  #EVENTS
  ireland.1.t:0 "[IRE.GetLeader] Сторонники Требуют Отречения"
  ireland.1.d:0 "После долгой кампании пропаганды, начатой [From.GetLeader] и его правительством, напряженность между лоялистами [Root.GetLeader] и теми, кто хочет увидеть объединение [Root.GetNonIdeologyName] - [From.GetNonIdeologyName], достигла уровня, когда мирное сосуществование уже не является возможным. Сторонники фашизма недвусмысленно потребовали, чтобы [Root.GetLeader] отрекся от престола и признал [From.GetLeader] единственным истинным лидером [Root.GetNonIdeologyName].\n\nСогласие на это сделает [Root.GetNonIdeologyName] не более чем государством-сателлитом [From.GetAdjective], но отказ почти наверняка приведет к гражданской войне."
  ireland.1.a:0 "Мы сдадимся!"
  ireland.1.b:0 ""Лучше война, чем быть марионеткой [From.GetAdjective]."
  ireland.2.t:0 "[FROM.GetNameDefCap] требует Северной Ирландии"
  ireland.2.desc:0 "В 1936 году ирландское правительство предприняло исторический и политический шаг, отправив ультиматум Соединенному Королевству с требованием отделить Северную Ирландию от Соединенного Королевства. Это важное решение было принято в результате давних исторических конфликтов. Ирландия, принявшая политику, направленную на независимость Северной Ирландии и создание единой Ирландии, решила покончить с непростыми процессами на протяжении всей своей истории.\n\n Ультиматум рассматривается как смелый шаг ирландского правительства по улучшению политической ситуации в Северной Ирландии и дальнейшему развитию отношений с Соединенным Королевством. Считающийся переломным моментом в истории Ирландии, этот шаг добавил новое измерение в сложность дипломатических отношений с Соединенным Королевством.\n Ультиматум Ирландии вызвал неоднозначную реакцию среди местного населения в этом регионе, что привело к ожесточенным политическим дебатам. По мере обострения напряженности между протестантскими и католическими общинами в Северной Ирландии правительство Соединенного Королевства вступило в серию внутренних дискуссий о том, как реагировать на эту ситуацию."
  ireland.2.a:0 "Приемлемо"
  ireland.2.b:0 "Требование Отклонено"

  ireland.3.t:0 "Правительство Великобритании приняло спрос"
  ireland.3.desc:0 "После выдвижения ультиматума ирландским правительством Соединенное Королевство приняло его условия, что ознаменовало собой знаменательный поворот событий. Принятие ультиматума положило начало серии дипломатических переговоров и политических маневров, которые могут изменить геополитический ландшафт Британских островов.\n\nПосле признания Соединенным Королевством требований Ирландии о присоединении Северной Ирландии между двумя странами начались переговоры о деталях этого значительного перехода. Дипломаты и представители обеих сторон ведут интенсивные переговоры, обсуждая вопросы, связанные с границами, гражданством и общим процессом перехода. Международное сообщество внимательно следит за этими обсуждениями, признавая их далеко идущие последствия для региональной стабильности."
  ireland.3.a:0 "Отличные новости!"
  
  ireland.4.t:0 "Правительство Великобритании отклонило требование"
  ireland.4.desc:0 "Отказ Соединенного Королевства от ультиматума, направленного ирландским правительством за Северную Ирландию, обострил политическую и дипломатическую напряженность в регионе. Вслед за этим отказом отношения между Ирландией и Соединенным Королевством стали все более напряженными.\n\nПравительство Соединенного Королевства заявило о своей приверженности сохранению связи Северной Ирландии с Соединенным Королевством. Эта позиция привела к дальнейшему расколу и политической неопределенности среди протестантских и католических общин в Северной Ирландии."
  ireland.4.a:0 "Плохие новости."
  ireland.55.d:0 "Приглашение Квислинга в Ирландию вызвало неоднозначную реакцию как на внутриполитической, так и на международной арене. В ирландском обществе возникли разногласия по поводу радикального шага правительства. Некоторые восприняли это приглашение как позицию за национальную независимость и силу, в то время как другие критиковали его, выражая опасения по поводу возможных последствий.\n\n Национальные и международные СМИ широко обсуждали это приглашение, оценивая изменения во внешней политике Ирландии. Неопределенность относительно того, как Квислинг отреагирует на это приглашение и как этот визит повлияет на политическую динамику в регионе, стала интригующей темой для обсуждения.\n\n После этого приглашения роль Ирландии в международных отношениях, в сочетании с внутренними и внешними политическими взаимодействиями, должна претерпеть значительную эволюцию. Будущие события покажут, как это решение в этот период формирует политическую и дипломатическую позицию Ирландии в предстоящие годы."
  ireland.55.a:0 "Добро пожаловать, Квислинг!"
  ireland.55.b:0 "Не надо рисковать."
  ireland.66.d:0 "Приглашение Квислинга в Ирландию вызвало неоднозначную реакцию как в стране, так и на международном уровне. В ирландском обществе возникли различные мнения относительно радикального шага правительства. Одни восприняли это приглашение как позицию за независимость и силу нации, в то время как другие критиковали его, выражая опасения по поводу возможных последствий.\n\n Национальные и международные средства массовой информации широко обсуждали это приглашение, оценивая изменения во внешней политике Ирландии. Неопределенность, связанная с тем, как Квислинг отреагирует на это приглашение и как этот визит повлияет на политическую динамику в регионе, стала интригующей темой для обсуждения.\n\n Вслед за этим приглашением роль Ирландии в международных отношениях в сочетании с внутренней и внешней политикой, взаимодействием встанет на путь существенной эволюции. Будущие события покажут, как это решение в этот период формирует политическую и дипломатическую позицию Ирландии в грядущие годы."
  ireland.66.a:0 "Предатель!"
  
  ireland.5.t:0 "[From.GetNameDefCap] Требует [Root.GetAdjective] Аннексии!"
  ireland.5.desc:0 "Сегодня [Root.GetLeader] получил на свой стол очень тревожную телеграмму от [From.GetAdjective] президента с требованием, чтобы [Root.GetNameDef] сложил оружие и передал все свои территории [From.GetAdjective] государству. [From.GetNameDefCap] пытается восстановить давно умершую Викинскую империю! С самого момента возникновения [Root.GetNameDef], и, похоже, они считают, что одной лишь угрозы войны между нашими нациями будет достаточно, чтобы [Root.GetLeader] пал."
  ireland.5.a:0 "Ничего не делать..."
  ireland.5.b:0 "Нет!"
  
  ireland.6.t:0 "[From.GetNameDefCap] согласен!"
  ireland.6.d:0 "Сегодня для [Root.GetNameDef] - великий день празднования, так как [From.GetAdjective] армия сложила оружие и позволила [Root.GetAdjective] солдатам войти в столицу и объявить о воссоединении [Root.GetNameDef] и [From.GetNameDef]! Возрожденное Содружество, улицы [Root.Capital.GetName] заполнены людьми, которые машут [Root.GetAdjective] и [From.GetAdjective] флагами, хотя в [From.GetAdjective] столице нет подобных торжеств, где, похоже, люди странно мрачны и скорбят."
  ireland.6.a:0 "Прекрасные новости!"
  
  ireland.7.t:0 "[From.GetNameDefCap] непокорен!"
  ireland.7.d:0 "Сегодня получен ответ от верховного главнокомандования [From.GetAdjective], в котором прямо отвергаются все требования [Root.GetAdjective] и утверждается, что они «не позволят [Root.GetLeader] попрать суверенитет [From.GetAdjective]». Хотя многие предпочли бы не вступать в очередное состояние войны с [From.GetNameDef], если [Root.GetLeader] не ответит в ближайшее время, будущие требования [Root.GetAdjective], вероятно, не будут восприняты всерьёз."
  ireland.7.a:0 "[Root.GetNameDef] и [From.GetNameDef] будут едины!"
  
  ireland.8.d:0 "Ирландское правительство, обратившись за военной помощью к Германии, сигнализировало об изменении своих проблем национальной безопасности и региональной политики. Эта просьба может рассматриваться как значительный поворотный момент для Ирландии с точки зрения ее целей независимости и стратегий безопасности.\n\n Этот запрос о военном сотрудничестве с Германией не только добавил сложности политическому балансу в регионе, но и привлек внимание международного сообщества. Эта разработка вносит новое измерение в борьбу Ирландии за независимость, а также в ее международные союзы и отношения."
  ireland.9.d:0 "Правительство Германии положительно отреагировало на запрос правительства националистов Ирландии об оказании военной помощи. Эта договоренность знаменует собой начало сотрудничества между двумя странами и является важным рубежом в региональных и международных отношениях.\n\n Согласие Германии на запрос указывает на то, что Ирландия вступила в новый этап в борьбе за независимость и меры безопасности. Это сотрудничество между двумя странами повлияло на региональный баланс и привлекло пристальное внимание мирового сообщества."
  ireland.10.d:0 "Правительство Германии отклонило запрос правительства националистов Ирландии об оказании военной помощи. Это неожиданное событие разрушило надежды на возможное сотрудничество между двумя странами, внеся неопределенность в региональные и международные отношения.\n\n Отказ Германии от запроса представляет собой серьезный вызов для Ирландии в ее борьбе за независимость и меры безопасности. Это решение является поворотным моментом, который может повлиять на региональный баланс и иметь глубокие последствия на международной арене.\n Хотя причины этого отказа неясны, международное сообщество будет внимательно следить за этим развитием событий, ожидая будущих действий, чтобы увидеть, как будут развиваться отношения между Ирландией и Германией."
  ireland.11.d:0 "В 1936 году националистическое правительство Ирландии приняло значительный шаг, мобилизовав военизированную группировку, известную как Синие Рубашки. Этот шаг символизирует радикальный сдвиг в региональной и национальной стратегиях безопасности, который также может повлиять на внутриполитическую динамику.\n\nМобилизация Синих Рубашек вызвала в стране различные общественные реакции. Одни воспринимают этот шаг как значительную поддержку национальной безопасности и борьбы за независимость, в то время как другие выражают обеспокоенность и критику."
  
  ireland.12.t:0 "[From.GetNameDefCap] Требует Фарерские острова!"
  ireland.12.desc:0 "В 1936 году, после исторического шага - отправки Соединенному Королевству ультиматума и требования отделить Фарерские острова от королевства, ирландское националистическое правительство объявило курс на изменение политической ситуации в регионе и стратегический пересмотр планов по расширению страны.\n\nУльтиматум подчеркивает права фарерцев на самоопределение и предлагает его жителям самостоятельно решить будущее. Данный шаг укрепляет ирландскую борьбу за независимость и свободу, перестраивая политический баланс в регионе.\n\nОднако, ввиду неопределенности реакции Соединенного Королевства, за развитием ситуации пристально следят все государства мира. Дипломатическое противостояние за статус Фарерских островов стало предметом споров заинтересованных сторон и субъектом международных обсуждений."
  ireland.12.a:0 "Приемлемо"
  ireland.12.b:0 "Отказаться"
  ireland.13.t:0 "Правительство Великобритании приняло требование"
  ireland.13.desc:0 "После выдвижения ультиматума со стороны правительства Ирландии Соединенное Королевство приняло условия, что ознаменовало собой важный поворот событий. Принятие ультиматума положило начало серии дипломатических переговоров и политических маневров, которые могут изменить геополитический ландшафт Британских островов.\n\nПосле признания Соединенным Королевством требований Ирландии об отделении Северной Ирландии между двумя странами начались обсуждения, чтобы определить детали этого значительного сдвига. Дипломаты и представители с обеих сторон ведут интенсивные переговоры по вопросам границ, гражданства и общего переходного процесса. Международное сообщество внимательно следит за этими обсуждениями, понимая их далеко идущие последствия для стабильности в регионе."
  ireland.14.t:0 "Правительство Великобритании отклонило требование"
  ireland.14.desc:0 "Отказ Соединенного Королевства от ультиматума, выдвинутого правительством Ирландии за Фарерские острова, обострил политическую и дипломатическую напряженность в регионе. После этого отказа отношения между Ирландией и Соединенным Королевством стали все более напряженными.\n\nПравительство Соединенного Королевства заявило о своей приверженности сохранению связи Фарерских островов с Соединенным Королевством. Эта позиция привела к дальнейшему разделению и политической неопределенности среди протестантских и католических общин на Северных Фарерских островах."
  ireland.14.a:0 "Плохие новости."

  ireland.15.t:0 "[FROM.GetName] требует [100.GetName]"
  ireland.15.desc:0 "[IRE.GetName] потребовал полный контроль над портом Исландии. Их правительство оправдывает эту риторику из-за опасений, что противник может высадиться в Исландии и напасть на ирландские железные рудники. Несогласие может привести к дальнейшей эскалации конфликта."
  ireland.15.a:0 "Приемлемо"
  ireland.15.b:0 "Отказать"
  ireland.16.t:0 "Требование было принято"
  ireland.16.desc:0 "Они приняли наше требование, и теперь Исландия - наше государство!"
  ireland.16.a:0 "Хорошие новости."
  ireland.17.t:0 "Требование было отклонено"
  ireland.17.desc:0 "Они отклонили наше требование."
  ireland.17.a:0 "..."

  ireland.18.t:0 "[IRE.GetName] предлагает полный нейтралитет на островах."
  ireland.18.desc:0 "Если это соглашение будет подписано, правительство Ирландии обязуется сохранять нейтралитет в любом инциденте на островах."
  ireland.18.a:0 "Всегда союзники!"
  ireland.18.b:0 "Отказать"

  ireland.19.t:0 "Ирландско-советский пакт"
  ireland.19.desc:0 "Социалистическое ирландское правительство в 1936 году делает исторический шаг, предлагая Советскому правительству проект всестороннего договора. Предложение направлено на расширение сотрудничества между двумя странами, охватывающего различные аспекты, такие как экономика, военное дело и многое другое, с целью заключения прочного соглашения. Этот шаг свидетельствует о радикальном сдвиге во внешней политике Ирландии и выделяется как заметное событие на региональном и глобальном уровнях.\n\nПроект договора иллюстрирует намерение Социалистического ирландского правительства создать и укрепить стратегическое партнерство с Советским Союзом, стремясь к более глубокой интеграции в экономическом и военном плане. Это предложение может вывести отношения между двумя странами на новый уровень, влияя на региональный и глобальный баланс сил.\n\nОднако неясно, как будет воспринято это предложение в Ирландии и Советском Союзе. Ход переговоров между двумя сторонами даст дополнительное представление о том, будет ли сделан этот значительный шаг."
  ireland.19.a:0 "Достаточно военных соглашений"
  ireland.19.b:0 "Достаточно промышленности"
  ireland.19.c:0 "Мы можем одобрить пакт с обеих сторон."
  ireland.19.d:0 "Мы отвергаем пакт"
  IRE_irish_soviet_pact_tt:0 "\n§Y4§! Возможность:"
  
  ireland.20.t:0 "Новый состав ИСО"
  ireland.20.desc:0 "Звоны перемен раздаются в Ирландском сельскохозяйственном обществе, и на эти перемены есть 4 основных кандидата. Эти кандидаты:\n\n-Гораций Планкетт\n-Томас Спринг Райс\n-Томас А. Финлей\n-Джордж Уильям Рассел.\n\nВы можете не менять ничего и продолжить с Горацием Планкеттом, или вы можете избрать нового президента IAOS. Решение за вами."
  ireland.20.a:0 "Продолжить с Планкеттом"
  ireland.20.c:0 "Новый лидер, Томас А. Финлей."
  ireland.20.d:0 "Новый лидер, Джордж Уильям Рассел."

  ireland.21.t:0 "Сектный пакт"
  ireland.21.desc:0 "В 1936 году социалистическое правительство Ирландии делает исторический шаг, предложив секретный договор советскому правительству. Это предложение направлено на углубление отношений между двумя странами и разработку совместной стратегии в отношении событий, связанных с Великобританией. Содержание секретного договора, охватывающего дипломатические инициативы и стратегии безопасности, имеет потенциал для создания значительных последствий на региональном и международном уровнях.\n\nСодержание секретного договора призвано определить позицию Ирландии и Советского Союза в отношении событий, связанных с Великобританией, намереваясь в дальнейшем укрепить сотрудничество между двумя странами. В этом контексте дипломатические инициативы, военная координация и экономическая интеграция составляют основу договора."
  ireland.21.a:0 "Это стоит того"
  ireland.21.b:0 "Чрезвычайно рискованно, отказано."
  ireland.22.d:0 "Социалистическое правительство Ирландии обратилось к советскому правительству с предложением секретного договора, и это предложение в частности касалось событий, связанных с Соединенным Королевством. Советское правительство приняло предложение секретного договора. Этот шаг представляет собой существенный прогресс в установлении глубокого сотрудничества и стратегического партнерства между двумя странами."
  
  ireland.23.desc:0 "Советское правительство отклонило договор, предложенный социалистическим правительством Ирландии. Это решение усилило неопределенности в отношении потенциального сотрудничества и стратегического соглашения между двумя странами. В то время как обоснование отказа остается неизвестным, нежелание Советского Союза принять это предложение может повлиять на региональный и глобальный политический баланс. Это событие является важным переломным моментом, отражающим приоритеты и стратегии советского правительства."
  
  ireland.24.t:0 "О'Даффи хочет попросить убежища в вашей стране."
  ireland.24.desc:0 "В 1936 году правительство социалистической Ирландии во главе с его харизматичным лидером решило изгнать Эоина О'Даффи, известного политического деятеля, чьи спорные взгляды привели к этому. Однако О'Даффи не был тем, кто сдался без боя. \n\n Намереваясь продолжить свою политическую карьеру и избежать изгнания, он тайно бежал в другую страну, ища убежища и планируя свои следующие шаги. Оказавшись в этой незнакомой стране, О'Даффи столкнулся с трудностями адаптации к новой среде и в то же время разрабатывал свою стратегию возвращения в политику. Международное сообщество с пристальным вниманием наблюдало, как этот изгнанный лидер готовил свое возвращение, заручаясь поддержкой из неожиданных источников и устанавливая связи, которые окажутся важными в его будущих начинаниях."
  ireland.24.a:0 "Умелый полководец, добро пожаловать!"
  ireland.24.b:0 "Лишняя мера, отказываюсь!"
  
  ireland.25.t:0 "Случаи в Северной Ирландии!"
  ireland.25.desc:0 "В эти дни националистическое правительство Ирландии представляет предложение правительству Соединенного Королевства положить конец ирландским действиям в Северной Ирландии. В этот исторический период желание Ирландии воссоединиться и конфликты в Северной Ирландии являются важными вопросами, влияющими на политические события в регионе. \n\nПредложение направлено на поиск мирного решения и отражает усилия по налаживанию диалога между сторонами. Правительство Ирландии выражает готовность принять меры для улучшения ситуации в Северной Ирландии в историческом контексте и обеспечения социального мира."
  ireland.25.a:0 "Понятно, принять."
  ireland.25.b:0 "Нам все равно!"

  ireland.26.d:0 "В эти дни националистическое правительство Ирландии представляет предложение правительству Соединенного Королевства положить конец ирландским действиям в Северной Ирландии. В этот исторический период желание Ирландии воссоединиться и конфликты в Северной Ирландии являются важными вопросами, влияющими на политические события в регионе. \n\nПредложение направлено на поиск мирного решения и отражает усилия по налаживанию диалога между сторонами. Правительство Ирландии выражает готовность принять меры для улучшения ситуации в Северной Ирландии в историческом контексте и обеспечения социального мира."
  ireland.26.a:0 "Хорошие новости!"
  ireland.27.d:0 "В эти дни националистическое правительство Ирландии представляет предложение правительству Соединенного Королевства положить конец действиям Ирландии в Северной Ирландии. В этот исторический период стремление Ирландии к воссоединению и конфликты в Северной Ирландии являются важными вопросами, влияющими на политические события в регионе. \n\nПредложение направлено на поиск мирного решения и отражает усилия по налаживанию диалога между сторонами. Правительство Ирландии выражает готовность принять меры по улучшению ситуации в Северной Ирландии в историческом контексте и обеспечению социального мира."
  ireland.27.a:0 "Плохие новости..."
  
  ireland.28.d:0 "В 1936 году Ирландия решительно встала на путь независимости, разорвав свои связи с Соединенным Королевством. Стремление к автономии столкнулось как с вызовами, так и с триумфами, поскольку ирландский народ горячо стремился формировать свою собственную судьбу. Уход из Соединенного Королевства ознаменовал поворотный момент в истории Ирландии, символизируя стойкость и решимость нации создать свою уникальную идентичность. \n\nНовоирландское государство столкнулось с задачей строительства собственного политического, экономического и культурного фундамента. Конституционная основа была тщательно продумана с целью отражения устремлений ирландского народа, заложив основу для демократического и суверенного государства. Вызовы государственного строительства были встречены непоколебимым духом, поскольку Ирландия преодолевала трудности, связанные с государственностью."
  ireland.28.a:0 "Славный день!"
