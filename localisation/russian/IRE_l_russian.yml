  IRE_IOAS_category:0 "Общество ирландской сельскохозяйственной организации"
  IRE_IOAS_category_desc:0 "§YОбщество ирландской сельскохозяйственной организации (IAOS)§! было §Yсельскохозяйственной ассоциацией§! в §YИрландии§! которая выступала за и помогала организовать §Yсельскохозяйственный§! §Lкооперативизм, в том числе взаимокредитные возможности. С момента своего основания сэром Горацием Планкеттом в 1894 г. он быстро стал важным элементом ирландской экономики и заложил основы успешной ирландской молочной промышленности.\n\n§YХотя официально и аполитичное, IAOS с начала 20-го века стало ассоциироваться с движением за ирландское самоуправление и деятельностью ирландских националистов§!. Позже оно было реорганизовано и переименовано в §LIrish Co-operative Organisation Society Limited, орган, который продолжает работать в Ирландии.§!\n\n\n                 §YРавенство £GFX_ETH_imperial_treasury Фермеров§! = [?iaos_equality_of_farmers_var]%\n        [GetIAOSheadName]"
  IRE_agricultural_state_reform:0 "Сельскохозяйственная реформа государства"
  iaos_infrastructure_decision_tooltip:0 "§YРешение о государственной сельскохозяйственной реформе§! будет §Rнедоступно§! после §Y5§! щелчков"
  IRE_war_cabinet_category:0 "Англо-ирландский военный кабинет"
  IRE_war_cabinet_category_desc:0 "Пламя в Европе увеличилось, и теперь Европа стала непредсказуемым местом. Ирландии и Соединенному Королевству, как двум странам на континенте, следует принять меры предосторожности в связи с этими событиями."
