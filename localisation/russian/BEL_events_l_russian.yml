l_russian: 
 belgium.1.t:0 "Всеобщие выборы в Бельгии 1936 года"
 belgium.1.d:0 "Выборы 1936 года были сложными из-за подъема крайне правых и крайне левых партий. Даже если эта политическая неразбериха беспокоит нас о будущем страны, народ знает, кого выбрать, и мы надеемся, что этот выбор не станет концом нашей страны. Посмотрим, каковы будут результаты."
 belgium.1.a:0 "Национальное единство (§CDemocratic Coalition§!)"
 belgium.1.b:0 "VNV-Verdinaso (§HNationalists§!)"
 belgium.1.c:0 "POB (§RLabour Party§!)"
 belgium.2.t:0 "Какая партия должна сформировать правительство"
 belgium.2.d:0 "Выборы закончились. Теперь остается выбрать, какой партии сформировать правительство. Сделанный здесь выбор может серьезно повлиять на политику нашей страны, поэтому мы должны тщательно подумать."
 belgium.2.a:0 "§CCatholic Party§!"
 belgium.2.b:0 "§CLiberal Party§!"
 belgium.2.c:0 "§RLabour Party§!"
 belgium.2.f:0 "§HVlaamsch Nationaal Verbond§!"
 belgium.2.e:0 "§HVerdinaso§!"
 belgium.3.t:0 "Проблемы в национальном единстве"
 belgium.3.d:0 "Лейбористская партия создает некоторые проблемы внутри национального единства. Возможно, они намерены покинуть альянс, используя в качестве предлога некоторые разногласия, и сформировать альянс с нашими соперниками, чтобы победить нас."
 belgium.3.a:0 "Они могут идти"
 belgium.3.b:0 "Убедить их остаться"
 belgium.4.t:0 "Лейбористская партия отложила выборы"
 belgium.4.d:0 "Лейбористская партия сослалась на внутренние проблемы в стране и заявила, что сначала лучше решить их. Это логичная причина, но она может привести к тому, что более радикальные оппозиционные партии наберут силу в стране, а мы не хотим, чтобы это произошло."
 belgium.4.a:0 "Отложить выборы"
 belgium.4.c:0 "Не обязательно"
 belgium.5.t:0 "Неожиданный альянс" 
 belgium.5.d:0 "Лейбористская партия и Коммунистическая партия объявили о союзе на предстоящих выборах. Это был неожиданный ход, и он может бросить нам вызов. Мы должны тщательнее подготовиться к выборам."
 belgium.5.a:0 "Мы побеждаем" #Surprising 
 belgium.6.t:0 "Внеочередные выборы"
 belgium.6.d:0 "Мы не ожидали, что Коммунистическая партия разорвет альянс и убедит парламент провести досрочные выборы. Что бы ни случилось, мы не должны позволить им выиграть выборы."
 belgium.6.a:0 "Лейбористская партия"
 belgium.6.b:0 "КБП"
 belgium.7.t:0 "Националисты разрывают альянс"
 belgium.7.d:0 "Уже было ясно, что этот альянс между националистами будет корыстным и недолговечным. Теперь вопрос в том, кто из них одержит верх над другим и получит право управлять страной." 
 belgium.7.a:0 "Выбрать Vlaamsch Nationaal Verbond"
 belgium.7.b:0 "Выбрать Verdinaso"
 belgium.8.t:0 "[ROOT.GetLeader] обвиняется в растрате"
 belgium.8.d:0 "Густаф Сап, член парламента, обвинил премьер-министра в растрате, когда тот работал в Национальном банке. Даже после отрицания [ROOT.GetLeader] этот скандал оказал сильное давление на правительство. Трехсторонняя коалиция пока выдержит шок." 
 belgium.8.a:0 "Выбрать Либеральную партию" 
 belgium.8.b:0 "Выбрать Лейбористскую партию"
 belgium.9.t:0 "Политическая агитация угрожает правительству!"
 belgium.9.d:0 "С угрозой рексистов, выглядящей менее угрожающей, политическое соперничество снова усилилось. Министр финансов Анри де Ман попытался объединить левые крылья Католической партии и Либеральной партии с Социалистической партией, чтобы принять новый налог, затрагивающий высшие социальные классы. Затем де Ман ушел в отставку «по состоянию здоровья». Этот проект снова потрясает парламентское большинство. Новая коалиция должна быть создана без католиков."
 belgium.9.a:0 "Объявить чрезвычайное положение"
 belgium.9.b:0 "У Поля-Анри Спаака есть яйца, чтобы сделать это"
 belgium.10.t:0 "Поль-Анри Спаак уходит в отставку"
 belgium.10.d:0 "Король Леопольд III отказался подписать назначение доктора Адриана Мартенса. Мартенс сотрудничал с немецкими имперскими войсками во время Первой мировой войны в качестве главы Фламандской академии медицины. Предложение должно было быть сначала одобрено советом министров. Но оказалось, что это не так и кто-то поставил его имя на Королевском указе. Скандал привел к отставке всего правительства."
 belgium.10.a:0 "Юбер Пьерло станет следующим формирователем"
 belgium.11.t:0 "Рост национализма"
 belgium.11.d:0 "Националистические партии в нашей стране набирают силу. Эти партии становятся все более популярными среди нашего народа, и эта ситуация вызывает большое беспокойство. Нам нужно помешать нашему народу поддерживать эти партии."
 belgium.11.a:0 "Подавить их" 
 belgium.11.b:0 "Игнорировать это" 
 belgium.12.t:0 "Фламандский национализм"
 belgium.12.d:0 "Поскольку мы игнорировали националистические партии, они получили большую власть и стали очень популярны среди нашего народа. Это наш последний шанс избавиться от этих партий, которые стали слишком популярны. Мы должны закрыть все эти партии и арестовать известные имена и тех, кто будет продолжать сопротивляться."
 belgium.12.a:0 "Закрыть фашистские партии"
 belgium.12.b:0 "Игнорировать это"
 belgium.13.t:0 "[FROM.GetNameDef] хочет, чтобы мы присоединились к Таможенному союзу"
 belgium.13.d:0 "[FROM.GetNameDefCap] недавно придумал новые экономические соглашения, которые позволили бы нам снизить производственные затраты."
 belgium.13.a:0 "Звучит неплохо"
 belgium.13.b:0 "Нет"
 belgium.14.t:0 "[FROM.GetName] отклоняет наше предложение"
 belgium.14.d:0 "К сожалению, [FROM.GetNameDef] отклонил наше предложение, поскольку оно «отрицало бы их суверенитет». Это их убыток - отказаться от нашего щедрого предложения."
 belgium.14.a:0 "Неважно" 
 belgium.15.t:0 "[FROM.GetName] принимает наше предложение" 
 belgium.15.t2:0 "[FROM.GetName] принимает наше требование"
 belgium.15.d:0 "[FROM.GetLeader] согласился сотрудничать с нами для дальнейшего сближения друг с другом."
 belgium.15.a:0 "Отлично"
 belgium.16.t:0 "[FROM.GetNameDef] запрашивает нашу гарантию" 
 belgium.16.d:0 "Бельгия не верит, что великие европейские державы могут защитить независимость Бельгии. В 1-й мировой войне опыт Бельгии был не очень хорошим, поэтому они подозревают, что то же самое произойдет снова, и они не хотят, чтобы это произошло. Они думают, что только мы можем их защитить. Что нам им сказать?"
 belgium.16.a:0 "Хорошо"
 belgium.16.b:0 "Ненужный" 
 belgium.17.t:0 "Бельгия хочет объединиться с нами"
 belgium.17.d:0 "Бельгийское правительство недавно объявило, что хочет объединиться с Нидерландами, чтобы обе страны могли стать сильнее на мировой арене. Если мы объединимся с ними, мы потеряем свою независимость, но наш народ будет двигаться к лучшему будущему."
 belgium.17.a:0 "Это кажется правильным решением для нашей страны"
 belgium.17.b:0 "мы будем стоять одни"
 belgium.18.t:0 "[FROM.GetNameDef] требует Кале" 
 belgium.18.d:0 "Бельгийские дипломаты указали на фламандцев, проживающих в регионе, и заявили, что Кале нам не принадлежит, он должен принадлежать им, и что если мы не дадим им то, что они хотят, они возьмут его силой, если это необходимо." 
 belgium.18.a:0 "Нет необходимости в войне, отдайте территорию" 
 belgium.18.b:0 "Чушь!"
 belgium.19.t:0 "Встреча с королем" 
 belgium.19.d:0 "Нам не удалось управлять страной, и мы переживаем трудные времена. Передача управления страной нашему королю Леопольду III может привести нас к лучшему положению. В конце концов, разве он не тот, кто думает о своем народе?" 
 belgium.19.a:0 "Король принимает" 
 belgium.19.b:0 "Король отклоняет"
 belgium.20.t:0 "Секретный пакт с [FROM.GetNameDef]" 
 belgium.20.d:0 "Бельгия, где к власти пришла фашистская партия, поддерживавшая нас на выборах, хотела заключить с нами тайную сделку. Соглашение заключалось в том, что Бельгия будет находиться в тайном союзе с нами и что, как только мы объявим войну Франции, они присоединятся к войне и помогут немецким войскам хлынуть через бельгийскую границу во Францию. Звучит как разумное предложение, скажем?" 
 belgium.20.a:0 "Мы приветствуем всех, кто нас поддерживает" 
 belgium.20.b:0 "Нам не нужна помощь"
 belgium.21.t:0 "[FROM.GetNameDef] требует нашей аннексии"
 belgium.21.d:0 "Бельгия хочет, чтобы нас аннексировали. Главная причина, говорят они, в том, что мы слишком малы, чтобы защитить себя, и если мы согласимся присоединиться к ним, наш народ сможет стать частью большей страны без страданий. Если мы не согласимся, добавляют они, между нашими странами может разразиться война, а в этом нет необходимости."
 belgium.21.a:0 "Делать нечего"
 belgium.21.b:0 "Мы будем сражаться до последней капли крови" 
 belgium.25.t:0 "[FROM.GetNameDef] хочет заключить с нами договор об обороне" 
 belgium.25.d:0 "Бельгийские дипломаты считают, что грядет война и что нам нужно объединить силы, чтобы лучше противостоять ей. Они сказали, что мы заключим договор об обороне до конца войны и передадим нашу страну и ее военные активы Бельгии на короткий период времени, а затем вернемся к нашему старому государству по окончании войны. Что скажем?" 
 belgium.25.a:0 "Мы должны объединиться против великого врага" 
 belgium.25.b:0 "Мы сохраним свой нейтралитет" 
 belgium.26.t:0 "[FROM.GetNameDef] просит помощи в расширении линии Мажино" 
 belgium.26.d:0 "Бельгия хочет продлить линию Мажино вдоль своей границы через Люксембург, но они не могут себе этого позволить, поэтому они попросили у нас помощи. Если ее продлить, это будет хорошая защита от немцев." 
 belgium.26.a:0 "Разумная идея" 
 belgium.26.b:0 "Мы не можем ее финансировать"
 belgium.27.t:0 "[FROM.GetNameDef] приглашает нас в ЕОУС"
 belgium.27.d:0 "Правительство Бельгии приглашает нас присоединиться к Европейскому объединению угля и стали, которое будет поддерживать друг друга в военном, экономическом и социальном плане."
 belgium.27.a:0 "Звучит неплохо"
 belgium.27.b:0 "Это бесполезно"
 belgium.28.t:0 "[FROM.GetNameDef] соглашается присоединиться к ЕОУС" 
 belgium.28.d:0 "После жарких споров среди политиков Бельгия решила присоединиться к Европейскому объединению угля и стали, теперь у нас есть союзник на мировой арене." 
 belgium.28.a:0 "Отлично" 
 belgium.29.t:0 "Бельгия хочет официально оформить Европейский Союз" 
 belgium.29.d:0 "Бельгийское правительство заявляет, что Европейское объединение угля и стали устарело, и вместо этого призывает к созданию Европейского Союза. Благодаря Европейскому Союзу страны будут связаны друг с другом юридически, в военном и экономическом отношении, а Европа станет крупнейшей экономической державой мира."
 belgium.29.a:0 "Хорошая идея, давайте сделаем это"
 belgium.29.b:0 "Ненужный" 
 belgium.30.t:0 "Королю не нравится наша нынешняя политика" 
 belgium.30.d:0 "Королю не нравится наша политика, и он считает, что страна идет в плохом направлении. Мы слышим, что люди вокруг короля пытаются заставить короля объявить чрезвычайное положение и временно закрыть парламент. Мы надеемся, что этого не произойдет." 
 belgium.30.a:0 "Беспокойство" 
 belgium.31.t:0 "Йорис Ван Северен казнен [FRA.GetAdjective]" 
 belgium.31.d:0 "В начале вторжения [BEL.GetAdjective] фашисты были заключены в тюрьму правительством из опасения, что они могут сотрудничать с врагом. Этих политических заключенных перевезли подальше от вражеских сил, и, наконец, их отправили в [FRA.GetNameDef] и охраняли [FRA.GetAdjective] солдаты.\n\nПрошлой ночью пьяные солдаты, разочарованные капитуляцией [BEL.GetAdjective] армии, убили своих заключенных."
 belgium.31.a:0 "Мы ничего не можем сделать" 
 belgium.32.t:0 "Бельгия инвестировала в нас" 
 belgium.32.d:0 "Сегодня корабль, присланный бельгийским правительством, пришвартовался в наших портах со многими рабочими и строительными материалами, и как только они прибыли, они начали работать в определенном районе. Было также объявлено, что была оказана и финансовая поддержка. Эта поддержка даст нам некоторое облегчение."
 belgium.32.a:0 "Это будет большим облегчением для нас" 
 belgium.33.t:0 "[FROM.GetName] хочет расширить свой контроль"
 belgium.33.d:0 "Бельгийское правительство сообщило нам, что хочет создать государство Бенилюкс под статусом рейхспротектората, подчиненное нам. Они сказали, что это сделает их сильнее в экономическом и военном отношении, чтобы они могли больше помочь нам в войне." 
 belgium.33.a:0 "Хороший план" 
 belgium.33.b:0 "Все территории принадлежат Рейху!"
 belgium.34.t:0 "Рабочие порта Антверпена бастуют"
 belgium.34.d:0 "Убийство фашистами двух социалистических боевиков в Антверпене вызвало забастовку портовых докеров." 
 belgium.34.a:0 "Пусть бастуют" 
 belgium.34.b:0 "Попробуем поговорить с ними"
 belgium.35.t:0 "Рабочие бастуют" 
 belgium.35.d:0 "Забастовка в порту Антверпена быстро распространилась по всей стране. Число бастующих достигло почти 500 000 человек. Фабрики по всей стране прекратили работу." 
 belgium.35.a:0 "Мы должны пойти на уступки"
 belgium.36.t:0 "Стаф де Клерк умирает от рака" 
 belgium.36.d:0 "Сегодня Стаф де Клерк, отец Vlaamsch Nationaal Verbond, сочувствующий нацистам и фламандский националист, умер от рака. Смерть человека, который породил Vlaamsch Nationaal Verbond, сдвинув Frontpartij вправо, и который был кумиром тысяч людей, должна быть болезненной для всех." 
 belgium.36.a:0 "Очень плохо"
 belgium.37.t:0 "Юбер Пьерло ушел в отставку"
 belgium.37.d:0 "Устав от многолетней войны, Юбер Пьерло решил подать в отставку. Ахилл Ван Аккер возглавит почти идентичное правительство."
 belgium.37.a:0 "Ничего не изменилось" 
 belgium.38.t:0 "Всеобщие выборы в Бельгии 1946 года" 
 belgium.38.d:0 "Выборы 1946 года были очень важны, так как это были первые выборы после Второй мировой войны. Многие партии претерпели радикальные изменения, некоторые почти исчезли, а некоторые стали очень популярны во время войны. Посмотрим, кто победит на выборах в этой обстановке." 
 belgium.38.a:0 "Камилла Гюисманс сформирует новое правительство"
 belgium.39.t:0 "Правительство Гюисманса падает"
 belgium.39.d:0 "Правительство Камиллы Гюисманс, которая сформировала правительство после Ахилла Ван Аккера, просуществовало недолго и просуществовало всего год. Несмотря на то, что Поль-Анри Спаак сформировал самое короткое правительство в истории Бельгии, ему было одобрено снова сформировать правительство."
 belgium.39.a:0 "У Поля-Анри Спаака есть яйца, чтобы сделать это"
 belgium.40.t:0 "Национальное единство распадается" 
 belgium.40.d:0 "Коалиция «Национальное единство», все более разделенная из-за своей неспособности победить на выборах, поддалась последнему давлению и объявила о своем роспуске."
 belgium.40.a:0 "Ожидаемые новости" 
 belgium.42.t:0 "Король убит" 
 belgium.42.d:0 "Король был убит сегодня в полдень боевиками в толпе, когда он приветствовал людей на улице. Убийцы были пойманы и не отрицали обвинений, но объяснили, почему они это сделали. Расследование также показало, что они были членами DeVlag. Посмотрим, каким будет следующий шаг этой организации, которая так сильно проникла в государство." 
 belgium.42.a:0 "Принц Чарльз" 
 belgium.42.b:0 "Принцесса Лилиан"
 belgium.43.t:0 "Бельгия хочет быть нашим гарантом" 
 belgium.43.d:0 "Бельгийское правительство сказало нам, что у нас мало шансов защитить себя, и что они могут взять на себя нашу защиту, потому что у нас давние хорошие отношения, чтобы мы могли противостоять будущим угрозам спиной к спине."
 belgium.43.a:0 "Нет другого выбора, кроме как принять"
 belgium.43.b:0 "Мы сохраним свой нейтралитет" 
 belgium.44.t:0 "Король сдается"
 belgium.44.d:0 "После краха фронтов и распада армии король Леопольд III согласился сдаться, чтобы предотвратить дальнейшие преследования бельгийского народа, но он решительно выступал против какого-либо сотрудничества с немцами. Наш король - герой, который заботится о своем народе, или трусливый предатель?" 
 belgium.44.a:0 "Больно"
 belgium.45.t:0 "Бельгия хочет купить колонии"
 belgium.45.d:0 "Бельгийское правительство требует от нас земли для расширения своих колоний в Африке. Это приемлемое предложение по хорошей цене, но, возможно, не стоит сдавать колонии, ради которых мы так усердно трудились."
 belgium.45.a:0 "Отдать колонии, которые они хотят" 
 belgium.45.b:0 "Смешное предложение"
 belgium.46.t:0 "Жозеф Жакмотт найден мертвым" 
 belgium.46.d:0 "Жозеф Жакмотт, лидер Kommunistische Partij van België, был найден мертвым в поезде, следовавшем из Льежа в Тиенен. После осмотра врачи сказали, что причиной смерти стал разрыв сердечной артерии." 
 belgium.46.a:0 "Может быть, нам стоит попробовать Лао"
 belgium.46.b:0 "Релеком подходит для этой должности" 
 belgium.47.t:0 "Ксавье Релеком арестован" 
 belgium.47.d:0 "После того, как наша страна была оккупирована немцами, было произведено много арестов, чтобы уменьшить восстания в регионе. Между тем, согласно полученной нами информации, Ксавье Релеком также был арестован." 
 belgium.47.a:0 "У нас нет альтернативы, кроме Лао"
 belgium.48.t:0 "Бельгия хочет создать интегрированную армию" 
 belgium.48.d:0 "Бельгия говорит, что интеграция наших армий очень поможет нам в плане планирования и координации во время войны, и чем раньше мы начнем эту интеграцию, тем лучше."
 belgium.48.a:0 "Интегрированная армия была бы очень полезна" 
 belgium.48.b:0 "Это было бы пустой тратой ресурсов" 
 belgium.49.t:0 "Бельгия хочет открыть интеграционные курсы" 
 belgium.49.d:0 "Бельгия хочет открыть интеграционные курсы в наших странах, чтобы наши народы могли лучше интегрироваться друг с другом во всех областях, и мы можем открыть их в своей стране, если захотим."
 belgium.49.a:0 "Мы должны поддерживать интеграцию" 
 belgium.49.b:0 "Мы можем использовать наши ресурсы более эффективно"
 belgium.51.t:0 "Общественность выступает против интеграции"
 belgium.51.d:0 "Наш народ против интеграции. Ходят слухи, что интеграция принесет больше вреда, чем пользы, и мы знаем, кто распространяет эти слухи, но доверие людей к нам подорвано, и вернуть его будет непросто." 
 belgium.51.a:0 "Это плохо"
 belgium.52.t:0 "Общественность поддерживает интеграцию" 
 belgium.52.d:0 "Наши усилия сработали, и наш народ поддерживает интеграцию. Они выражают свою радость за правительство, говоря, что это очень хороший шаг для нашей страны и экономики нашей страны." 
 belgium.52.a:0 "Очень хорошо"
 belgium.53.t:0 "Газеты выступают против интеграции" 
 belgium.53.d:0 "Газеты освещали наши усилия по интеграции как главную новость на первой полосе и критиковали нашу работу. Мы не знаем, почему они это сделали, но есть вероятность, что общественность может прочитать эти новости и повернуться против нас." 
 belgium.53.a:0 "Бесполезные бумажки"
 belgium.54.t:0 "Газеты поддерживают интеграцию"
 belgium.54.d:0 "Презентация, которую мы сделали журналистам, сработала, почти все газеты, вышедшие сегодня, поддержали интеграцию и добавили, что это то, что имеет смысл и должно было быть сделано уже. Если общественность это понимает, наша работа очень проста."
 belgium.54.a:0 "Хорошие новости" 
 belgium.55.t:0 "Армия выступает против интеграции" 
 belgium.55.d:0 "Генералы считают, что интеграция - это фарс и что такое дело запятнает имя и престиж нашей страны, даже нашу революцию. За ними стоят солдаты, и они решительно против интеграции." 
 belgium.55.a:0 "Ситуация очень плохая" 
 belgium.56.t:0 "Профсоюзы поддерживают интеграцию" 
 belgium.56.d:0 "Профсоюзы поддержали интеграцию. Конечно, мы знаем почему, их мечта - привлечь больше рабочих в профсоюз и получить власть, но мы ничего не можем сделать, кроме как закрыть глаза."
 belgium.56.a:0 "Это очень хорошо" 
 belgium.57.t:0 "Рабочие поддерживают интеграцию" 
 belgium.57.d:0 "Рабочие поддержали интеграцию, потому что чувствовали, что объединение стран уменьшит бремя на их плечах. Конечно, все политики знают, что этого не произойдет, но ни у кого не хватает смелости это объяснить." 
 belgium.57.a:0 "Выдать премии рабочим" 
 belgium.58.t:0 "Всеобщие выборы в Бельгии [GetYear] года" 
 belgium.58.d:0 "На внеочередных выборах Лейбористская партия победила на выборах, несмотря на предательство со стороны коммунистов. К сожалению, сформированное ими правительство было не очень эффективным. Вот почему оно не пользовалось особой популярностью у некоторых людей. Так что выборы [GetYear] года будут для них очень трудными." 
 belgium.58.a:0 "§RLabour Party§!"
 belgium.58.b:0 "§CCatholic Party§!"
 belgium.59.t:0 "Концессия на добычу урана [FROM.GetNameDefCap] отозвана" 
 belgium.59.d:0 "Сразу после провозглашения независимости Конго объявило, что отзывает все права Бельгии в стране. Именно бельгийское правительство предоставило нам концессию на добычу урана, но поскольку Конго больше не является их частью, я думаю, что мы должны заключить это соглашение с Конго." 
 belgium.59.a:0 "Это очень плохо" 
 belgium.60.t:0 "Концессия на добычу урана [FROM.GetNameDefCap]"
 belgium.60.t:0 "Наши хорошие отношения с нашими [FROM.GetAdjective] союзниками только что окупились: [FROM.GetAdjective] правительство предоставило нам права на разработку их месторождений урана в Катанге. Они утверждают, что их технологии еще далеки от того, чтобы эффективно использовать это вещество, поэтому они предпочитают подписать концессионное соглашение, по которому мы будем контролировать шахты в Катанге в обмен на основные продукты для бельгийской промышленности и сельского хозяйства.\nЭто выгодное соглашение не только предоставит нам новый источник урана, но, несомненно, еще больше улучшит отношения между [ROOT.GetNameDef] и [BEL.GetNameDef]." 
 belgium.60.d:0 "Мы будем использовать это с пользой." 
 belgium.61.t:0 "Политическая агитация угрожает правительству" 
 belgium.61.d:0 "Постоянный перенос выборов по нелепым причинам и неспособность нынешнего правительства что-либо сделать, чтобы изменить ситуацию в свою пользу, привлекли большое внимание общественности. Политические агитаторы пытаются организовать людей, чтобы бросить вызов правительству и призвать короля исправить ситуацию, и протесты уже проходят во многих частях страны."
 belgium.61.a:0 "Надеемся, что хуже не будет" 
 belgium_news.1.t:0 "Парижский договор" 
 belgium_news.1.desc:0 "Недавно в Париже Франция, Италия, Люксембург, Нидерланды, Германия и Бельгия подписали Парижский договор о создании Европейского объединения угля и стали. Известно, что это сообщество нацелено на создание общего рынка угля и стали между странами, снижение безработицы, улучшение экономики стран-участниц и развитие рынка." 
 belgium_news.1.a:0 "Многообещающий" 
 belgium_news.1.b:0 "Интересно" 
