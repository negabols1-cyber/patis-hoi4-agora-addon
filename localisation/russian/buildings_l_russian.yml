l_russian:
  infrastructure:0 "§LИнфраструктура§!"
  infrastructure_plural:0 "§LИнфраструктура§!"
  infrastructure_desc:1 "Здание улучшает инфраструктуру региона. Оно повышает снабжение армии в стратегически важных регионах и скорость ваших дивизий, а также добычу ресурсов."
  arms_factory:0 "§GВоенный завод§!"
  arms_factory_plural:0 "§GВоенные заводы§!"
  arms_factory_desc:0 "Это здание дает стране производство военной техники, его можно перестроить в гражданское производство."
  dockyard:0 "§BВерфь§!"
  dockyard_plural:0 "§BВерфи§!"
  dockyard_desc:0 "Это здание дает стране производство кораблей."
  industrial_complex:0 "§CФабрика§!"
  industrial_complex_plural:0 "§CФабрики§!"
  industrial_complex_desc:0 "Это здание дает стране производство гражданских товаров и строительство зданий. Его можно перестроить в военное производство."
  air_base:0 "Авиабаза"
  air_base_plural:0 "Авиабазы"
  air_base_desc:0 "Авиабаза позволяет вашим воздушным войскам базироваться в провинции."
  naval_base:0 "Военно-морская база"
  naval_base_plural:0 "Военно-морские базы"
  naval_base_desc:1 "Расширяет радиус действия вашего флота и обеспечивает его ремонт. Позволяет организовать снабжение за границей и экспорт ресурсов. Дальнейшее улучшение увеличивает производительность снабжения."
  bunker:0 "Крепость"
  bunker_plural:0 "Крепости"
  bunker_desc:0 "Это строение в бою накладывает на атакующего штраф к атаке в размере $VALUE|+%0$ за каждый уровень крепости. Атака с нескольких сторон снижает эффективность фортов."
  coastal_bunker:0 "Береговая крепость"
  coastal_bunker_plural:0 "Береговые крепости"
  coastal_bunker_desc:0 "Это строение в бою во время морской высадки накладывает на атакующего штраф к атаке в размере $VALUE|+%0$ за каждый уровень крепости."
  anti_air_building:0 "Зенитное орудие"
  anti_air_building_plural:0 "Зенитные орудия"
  anti_air_building_desc:0 "Это строение обеспечивает стране защиту от вражеских бомбардировщиков и возможность обстрела атакующих самолётов."
  synthetic_refinery:0 "Синтетический завод"
  synthetic_refinery_plural:0 "Синтетические заводы"
  #synthetic_refinery_desc:0 "Это строение обеспечивает страну +1 £resources_strip|3 и +2 £resources_strip|1."
  synthetic_refinery_desc:0 "Это строение обеспечивает страну"
  synthetic_refinery_amount:0 "$VALUE|Y0=$"
  synthetic_refinery_resource:0 "£resources_strip|$FRAME$"
  radar_station:0 "Радиолокационная станция"
  radar_station_plural:0 "Радиолокационные станции"
  radar_station_desc:3 "РЛС позволяет получать сведения о вражеских войсках в соседних регионах.\nБолее высокий уровень РЛС в регионе увеличивает эффективную дальность РЛС.\nРЛС также обеспечивает стране лучшую обнаруживаемость вражеских воздушных сил, давая вашим самолётам больше шансов перехватить их.\nКроме того, РЛС повышает обнаружение вражеских флотов в море."
  rocket_site:0 "Ракетная площадка"
  rocket_site_plural:0 "Ракетные площадки"
  rocket_site_desc:0 "Это здание предоставляет штату возможность размещения произведенных ракет."
  nuclear_reactor:0 "Ядерный реактор"
  nuclear_reactor_plural:0 "Ядерные реакторы"
  nuclear_reactor_desc:0 "Это здание обеспечивает штат производством обогащенного урана для использования в ядерном оружии."
