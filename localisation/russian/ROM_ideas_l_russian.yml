l_russian:
  ROM_political_void_idea:0 "Политический Вакуум"
  ROM_political_void_idea_desc:0 "По мере того как прогрессировали 1930-е, и без того шаткая румынская демократия медленно скатывалась к фашистской диктатуре. Конституция 1923 года давала королю полную свободу распускать парламент и проводить выборы по своему усмотрению. В результате Румыния пережила более 25 правительств за одно десятилетие."
  ROM_iron_guard_idea:0 "Железная гвардия"
  ROM_iron_guard_idea_desc:0 "Железная Гвардия (румынский: Garda de Fier) - румынское военизированное революционное фашистское движение и политическая партия, основанная в 1927 году Корнелиу Зелеа Кодряну как Легион Архангела Михаила (Legiunea Arhanghelul Mihail) или Легионерское Движение (Mișcarea Legionară)."
