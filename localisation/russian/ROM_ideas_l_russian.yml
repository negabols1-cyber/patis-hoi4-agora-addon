  ROM_greenshirts:0 "Зеленорубашечники"
  ROM_greenshirts_desc:0 "Железная гвардия как военизированное крыло Легиона, которая в 1935 году сменила свое официальное название на \"Totul pentru Țară\", ее члены назывались Легионерами или вне движения \"Зеленорубашечниками\" из-за преимущественно зеленой формы, которую они носили."
