 CREATE_CORE1_TOOLTIP:0 "§HТребования к созданию ядра:§!\nЭто действие стоит:\n§H>§! §H50§!£pol_power, если население страны составляет менее 50 тыс.\n§H75§!£pol_power, если население страны составляет от 50 тыс. до 100 тыс.\n§H100§!£pol_power, если население страны составляет от 100 тыс. до 250 тыс.\n§H125§!£pol_power, если население страны составляет от 250 тыс. до 500 тыс.\n§H150§!£pol_power, если население страны составляет от 500 тыс. до 1 млн\n§H200§!£pol_power, если население страны составляет от 1 млн до 5 млн\n§H300§!£pol_power, если население страны составляет от 5 млн до 10 млн\n§H400§!£pol_power, если население страны составляет от 10 млн до 15 млн\n§H500§!£pol_power, если население страны составляет более 15 млн\n\n§YОсобые требования к созданию ядра:§! \n§CTурция§! не может создавать ядра на своих §LKурдских§! территориях, а\n§CИталия§! не может создавать ядра на своих §LEфиопских§! территориях с помощью этого решения!"
 UNCREATE_CORE_TOOLTIP:0 "§HУдалить ядро§!\n\n"
