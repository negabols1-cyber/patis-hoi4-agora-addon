 china_fascism.2.t:0 "Подъём прояпонской фракции в [CHI.GetName]"
 china_fascism.2.d:0 "В последнее время некоторые прояпонские чиновники усилили свои позиции в правительстве [CHI.GetName] и партии [CHI.GetRulingParty]. Если мы поддержим их, то сможем добиться союза с Китаем без начала войны и получить доступ к его ресурсам."
 china_fascism.2.a:0 "Это сэкономит нам снаряды и жизни."

 china_fascism.1.t:0 "Военачальники не приняли сделку"
 china_fascism.1.d:0 "Военачальникам не понравилась сделка, заключённая с [JAP.GetName], и под влиянием коммунистов они выступили против нас. Вот к чему приводит наш путь."
 china_fascism.1.a:0 "Чёрт, я так и знал!"

 china_fascism.3.t:0 "[From.GetName] запрашивает помощь в судостроении"
 china_fascism.3.d:0 "Наши товарищи из Китая просят поделиться с ними некоторыми технологиями судостроения, чтобы они могли улучшить свой флот."
 china_fascism.3.a:0 "Азиаты должны помогать друг другу"
 china_fascism.3.b:0 "[Root.GetAdjective] технологии наши, а не их!"

 china_fascism.4.t:0 "[From.GetName] предоставляет помощь"
 china_fascism.4.d:0 "[From.GetName] оказал помощь нашему судостроительному сектору."
 china_fascism.4.a:0 "Пора строить корабли!"

 china_fascism.5.t:0 "[From.GetName] отказал в помощи"
 china_fascism.5.d:0 "[From.GetName] отказал в оказании помощи нашему судостроительному сектору."
 china_fascism.5.a:0 "Чёрт бы их побрал!"

 china_fascism.6.t:0 "[FROM.getNameDefCap] требует территорию"
 china_fascism.6.d:0 "Присвоив себе эти земли, [FROM.GetNameDef] потребовал безвозмездно передать их под его контроль."
 china_fascism.6.a:0 "Мы не выстоим против их полной мощи."
 china_fascism.6.b:0 "Жадная [FROM.getAdjective] сволочь! Они не получат ни пяди нашей земли!"

 china_fascism.7.t:0 "Земли возвращены"
 china_fascism.7.d:0 "Наши законные территории возвращены!"
 china_fascism.7.a:0 "Теперь мы должны планировать дальнейшее расширение."

 china_fascism.8.t:0 "Требование отклонено"
 china_fascism.8.d:0 "Эти варвары отвергли наши мирные требования и вынудили нас решить этот вопрос силой."
 china_fascism.8.a:0 "Варваров надо уничтожить!"

 china_fascism.9.t:0 "[FROM.getNameDefCap] требует территорию"
 china_fascism.9.d:0 "Присвоив себе эти земли, [FROM.GetNameDef] потребовал безвозмездно передать их под его контроль."
 china_fascism.9.a:0 "Мы не выстоим против их полной мощи."
 china_fascism.9.b:0 "Жадная [FROM.getAdjective] сволочь! Они не получат ни пяди нашей земли!"

 china_fascism.10.t:0 "Ядра возвращены"
 china_fascism.10.d:0 "Наши законные территории вернулись!"
 china_fascism.10.a:0 "Мы должны планировать дальнейшую экспансию с этого момента."

 china_fascism.11.t:0 "Требование отклонено"
 china_fascism.11.d:0 "Эти варвары отвергли наши мирные требования и заставили нас использовать насилие для разрешения этой ситуации."
 china_fascism.11.a:0 "Варвары должны быть очищены!"

 china_fascism.12.t:0 "Новая повестка дня [CHI.GetName]"
 china_fascism.12.d:0 "Узнав о последней повестке дня китайского правительства, некоторые наши чиновники думают, что мы должны отказаться от наших колоний в Азии, чтобы избежать растоптывания китайцами."
 china_fascism.12.a:0 "Мы должны отказаться от наших колоний."
 china_fascism.12.b:0 "Бах, разве они не помнят, как мы забрали Макао тогда."

 china_fascism.13.t:0 "Китай запрашивает расширение нашей военной миссии"
 china_fascism.13.d:0 "Китайский посол направил нам сообщение, запрашивающее более активное участие наших советников в подготовке китайской национальной армии. Наши военные советники присутствуют в стране с 1926 года. Удовлетворение их просьбы значительно улучшило бы наши отношения с правительством Гоминьдана."
 china_fascism.13.a:0 "Направить больше военных советников."
 china_fascism.13.b:0 "Мы не можем себе этого позволить."

 china_fascism.14.t:0 "Германия расширяет свою военную миссию"
 china_fascism.14.d:0 "По прямому решению [GER.GetLeader], [GER.GetAdjective] правительство согласилось увеличить численность своих военных советников. Прекрасная новость, которая поможет реструктурировать наши вооруженные силы и объединить наши нации."
 china_fascism.14.a:0 "Отправляйте их в штаб дивизии."

 china_fascism.144.t:0 "Германия отказывается расширять свою военную миссию"
 china_fascism.144.d:0 "Мы получили лаконичное сообщение от нашего посла в Германии о том, что [GER.GetAdjective] не будет направлять больше военных советников."
 china_fascism.144.a:0 "Какое разочарование."

 china_fascism.15.t:0 "Китай хочет присоединиться к нашей фракции"
 china_fascism.15.d:0 "Сильные лидеры RNGROC добились больших успехов и предлагают присоединиться к нашему делу. Китайская нация готова сражаться за Рейх."
 china_fascism.15.a:0 "Союзник с Востока"
 china_fascism.15.b:0 "Nein!"

 china_fascism.16.t:0 "[CHI.GetName] просит нашего вмешательства"
 china_fascism.16.d:0 "Учитывая наши хорошие отношения с [CHI.GetName] и [JAP.GetName] в нашей фракции, [CHI.GetLeader] обратился с просьбой вмешаться в их текущий конфликт и успокоить агрессию [JAP.GetName]."
 china_fascism.16.a:0 "Как предусмотрено в китайско-германской дружбе."
 china_fascism.16.b:0 "Сейчас мы слишком заняты, китайцы предоставлены сами себе, но мы обещаем оказать поддержку."

 china_fascism.17.t:0 "[GER.GetAdjective] Вмешательство"
 china_fascism.17.d:0 "[GER.GetLeader] направил официальное письмо [Root.GetLeader], в котором говорилось, что мы должны немедленно прекратить нашу агрессию против [CHI.GetName]."
 china_fascism.17.a:0 "Поразмыслив, вторжение в Китай может оказаться не таким выгодным, как пропагандируется."
 china_fascism.17.b:0 "К черту этих немцев."
 china_fascism.18.t:0 "[GER.GetName] отказал во вмешательстве, но послал поддержку"
 china_fascism.18.d:0 "Увязнув в собственных делах, [Ger.GetLeader] отказал во вмешательстве в наш конфликт с японцами, но [Ger.GetLeader] сказал, что пошлет нам поддержку"
 china_fascism.18.a:0 "Хоть чем-то помогли"
 china_fascism.19.t:0 "Мир с [JAP.GetName]"
 china_fascism.19.d:0 "После вмешательства немцев японские войска отступают с оккупированных территорий. Но они до сих пор отказываются возвращать нам Маньчжурию."
 china_fascism.19.a:0 "Еще увидят"
 china_fascism.19.b:0 "Мы настоящие миротворцы"
 china_fascism.19.d_2:0 "После нашего вмешательства японские войска отступают с оккупированных территорий."
 china_fascism.20.t:0 "[JAP.GetName] не поддается успокоению"
 china_fascism.20.d:0 "Несмотря на наше вмешательство, японское правительство по-прежнему не желает сложить оружие"
 china_fascism.20.a:0 "Это их выбор"
 china_fascism.20.b:0 "Мы не потерпим такого унижения"

 china_fascism.21.t:0 "Отправить мирный договор?"
 china_fascisms.21.d:0 "Одинокому нам эту войну не выиграть. Если так пойдет и дальше, они нас одолеют. Пока есть такая возможность, нужно садиться за стол переговоров и дать им то, что они требуют."
 china_fascisms.21.a:0 "Отослать запрос на договор"
 china_fascisms.21.b:0 "Никакого мира. Мы их победим"

 china_fascism.22.t:0 "[CHI.GetName] предлагает мирный договор"
 china_fascism.22.d:0 "Приняв мирный договор, мы получим то, что нам нужно. Больше нет смысла сражаться и изнурять своих солдат."
 china_fascism.22.a:0 "Принять договор"

 china_fascism.23.t:0 "[PRC.GetName] принимает мирный договор"
 china_fascism.23.d:0 "Нам повезло, что они приняли мирный договор. Потому что мы никак не могли выиграть эту войну. Мы не предвидели такой войны и оказались не готовы"
 china_fascism.23.a:0 "Мирные времена"

 china_fascism.24.t:0 "[PRC.GetName] отказал в принятии договора"
 china_fascism.24.d:0 "Конец близок. Мы потеряли последнюю надежду и бежать нам некуда"
 china_fascism.24.a:0 "Делать нечего"

 china_fascism.25.t:0 "Приглашение в [JAP.GetFactionName]"
 china_fascism.25.d:0 "Для усиления [JAP.GetFactionName] и сдерживания возможного возрождения агрессивного экспансионизма [CHI.GetName] просит присоединиться к альянсу для объединения этих наций"
 china_fascism.25.a:0 "С удовольствием. [JAP.GetFactionName] нужно расширяться"
 china_fascism.25.b:0 "[Root.GetName] идет своим путем"
 china_fascism.26.t:0 "[From.GetName] присоединяется к [JAP.GetFactionName]"
 china_fascism.26.d:0 "Наш план по удержанию имперских государств и их от нас продвигается. [From.GetLeader] одобряет наши усилия и принял наше приглашение в альянс"
 china_fascism.26.a:0 "Хорошо"
 china_fascism.27.t:0 "[From.GetName] отказывается присоединиться к [JAP.GetFactionName]"
 china_fascism.27.d:0 "Несмотря на наши усилия по поддержке [JAP.GetFactionName], наша последняя попытка по привлечению одной из наций была встречена скептицизмом. [From.GetLeader] отказался присоединяться к альянсу, возможно усомнившись в наших намерениях или опасаясь, что, сблизившись с нами, они станут мишенью"
 china_fascism.27.a:0 "Их и так уже может ждать любая участь!"
 china_fascism.28.t:0 "[CHI.GetName] хочет получить от нас армейский взвод"
 china_fascism.28.d:0 "[CHI.GetName] недавно прислали к нам дипломата, который сказал, что им нужна поддержка в виде армейского взвода, и что у нас и так хорошие отношения, и поэтому это возможно. Что нам делать в этой ситуации?"
 china_fascism.28.a:0 "Отправить"
 china_fascism.28.b:0 "Не в коем случае!"

 china_fascism.29.t:0 "[GER.GetName] принял нашу просьбу"
 china_fascism.29.d:0 "[GER.GetName] принял нашу просьбу и сказал, что армейский взвод доберется до нас как можно скорее"
 china_fascism.29.a:0 "Хорошо"

 china_fascism.30.t:0 "[GER.GetName] отклонил нашу просьбу"
 china_fascism.30.d:0 "Германцы отклонили нашу просьбу, сказав, что это невозможно, так как даже самое маленькое подразделение будет им полезно"
 china_fascism.30.a:0 "Трусы!"

 china_fascism.31.t:0 "Письмо от [CHI.GetName]"
 china_fascism.31.d:0 "С нами тайно связался китайский дипломат. Он хотел, чтобы Пу И вновь стал императором и возродил династию Цин. Они сказали, что если мы примем их предложение, они поставят Пу И во главе правительства, когда для этого настанут благоприятные условия. Что мы должны ответить?"
 china_fascism.31.a:0 "Принять предложение"
 china_fascism.31.b:0 "Чушь!"

 china_fascism.32.t:0 "Ответ от [MAN.GetName]"
 china_fascism.32.d:0 "Пу И принял наше предложение и сказал, что будет готов, когда придет время"
 china_fascism.32.a:0 "Очень хорошо"

 china_fascism.33.t:0 "Ответ от [MAN.GetName]"
 china_fascism.33.d:0 "Пу И нашел наше предложение абсурдным и сказал, что такое вряд ли возможно сегодня"
 china_fascism.33.a:0 "Трусы!"

 china_fascism.34.t:0 "Чан Кайши помещен под домашний арест"
 china_fascism.34.d:0 "Мы отправили Чан Кайши под домашний арест. Неизвестно, насколько это было правильным решением. Время покажет, что произойдет"
 china_fascism.34.a:0 "Посмотрим"

 china_fascism.35.t:0 "Стоит ли нам связаться с Пу И?"
 china_fascism.35.d:0 "Стоит ли нам связаться с Пу И и поручить ему управление страной, а также сказать, что мы хотим укрепить династию и страну Цин, или же более разумным будет отложить наш план?"
 china_fascism.35.a:0 "Связаться"
 china_fascism.35.b:0 "Не стоит"

 china_fascist_news.1.t:0 "[CHI.GetName] присоединяется к [From.GetFactionName]!"
 china_fascist_news.1.d:0 "Китайские и немецкие дипломаты недавно подписали военный пакт в [GER.Capital.GetName], укрепив связь между двумя странами. \n\nНекоторые считают, что цель такого союза - зажать в тиски [SOV.GetName], но официальные лица из [CHI.GetName] и [GER.GetName] ни подтвердили, ни опровергли эту информацию."
 china_fascist_news.1.c:0 "Рождается великая держава."
 china_fascist_news.2.t:0 "[GER.GetName] отклоняет китайский союз!"
 china_fascist_news.2.d:0 "Отклоняя дипломатические инициативы [CHI.GetAdjective], [From.GetLeader] публично объявил, что [From.GetName] не будет заключать военный пакт с [CHI.GetName]."
 china_fascist_news.2.b:0 "Und doch habe ich alein..."