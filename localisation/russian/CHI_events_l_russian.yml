 china_annex.1.t:0 "Вопрос Мэнцзяня"
 china_annex.1.d:0 "По вашему приказу мы можем создать марионеточное правительство или аннексировать Мэнцзян."
 china_annex.1.a:0 "Марионеточное правительство"
 china_annex.1.b:0 "Аннексированное правительство"
 china_annex.3.t:0 "Судьба Мэнцзяня"
 china_annex.3.d:0 "Китайцы хотят передать контроль над Мэнцзянем Китаю. Ваш император, мы решили представить это вам, поскольку сами не можем с этим справиться."
 china_annex.3.a:0 "Давайте дадим Мэнцзян, для нас это пустяк"
 china_annex.3.b:0 "Нет, так нельзя, это истощит наше терпение, немедленно начинайте подготовку"
 china_annex.4.t:0 "Судьба Мэнцзяня"
 china_annex.4.d:0 "Китайцы хотят передать контроль над Мэнцзянем Китаю. Ваш император, мы решили представить это вам, поскольку сами не можем с этим справиться."
 china_annex.4.a:0 "Давайте дадим Мэнцзян, для нас это пустяк"
 china_annex.4.b:0 "Нет, так нельзя, это истощит наше терпение, немедленно начинайте подготовку"
 china_annex.5.t:0 "Правительство Китая потребовало Восточный Хэбэй"
 china_annex.5.d:0 "Китай требует у нас землю, чтобы расширить свои территории, они дали нам 12 часов. Как вы думаете, стоит ли отдать провинцию?"
 china_annex.5.a:0 "Мы пытались подавить восстание, я уверен, что для нас это будет легко."
 china_annex.5.b:0 "Нет, так нельзя, это истощит наше терпение, немедленно начинайте подготовку"
 china_annex.2.t:0 "Захватить Восточный Хэбэй"
 china_annex.2.d:0 "Как только мы окрепнем, мы отправим японскому правительству ультиматум о захвате Восточного Хэбэя. Посмотрим, что они ответят"
 china_annex.2.a:0 "Немедленно начать подготовку"
