 prc_unite.1.t:0 "Ультиматум коммунистического Китая"
 prc_unite.1.d:0 "Они прислали нам ультиматум, и если это ультиматум, они говорят присоединиться или умереть. Что вы об этом думаете?"
 prc_unite.1.a:0 "Что мы можем поделать, мы ничего не можем поделать, они сильнее нас."
 prc_unite.1.b:0 "Мы никогда не потеряем нашу независимость."
