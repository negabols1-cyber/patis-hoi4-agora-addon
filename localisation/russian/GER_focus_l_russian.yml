  #Starter 
 GER_fuhrer_legacy: "Наследие Фюрера" #NT!
 GER_fuhrer_legacy_desc: "Мы готовы взять на себя весь мир, стоящий за нашим фюрером, который поместил Германию, чьи люди снова разбились от голода и страданий на мировой арене и защитили честь немцев." #NT!
 GER_old_empire: "Старая империя" #NT!
 GER_old_empire_desc: "Неудача правительства Веймара и коррупция правительства NSDAP контрастируют против славной Имперской истории Германии. Мы должны восстановить Германию к ее прежней имперской славе, чтобы обеспечить наше место как мировую власть." #NT!
 GER_kill_hitler: "Слив фюрера" #NT!
 GER_kill_hitler_desc: "Мы только что узнали, что на нашем Фурере была попытка убийства." #NT!
 GER_manace_spreading: "Угроза распространяется" #NT!
 GER_manace_spreading_desc: "Красная опасность распространяется в нашей стране" #NT!
 GER_ally_with_the_SPD: "Союзник с SPD" #NT!
 GER_ally_with_the_SPD_desc: ""
 GER_crush_the_communist_threat: "Раздавить коммунистическую угрозу" #NT!
 GER_crush_the_communist_threat_desc: ""
 GER_ein_volk_ein_reich_ein_fuhrer: "Эйн Волк, Эйн Рейх, Эйн Фюрер" #NT!
 GER_ein_volk_ein_reich_ein_fuhrer_desc: "Германия объединится под одним народом, одним штатом и одним лидером. Отделы прошлого были смещены непреодолимой силой национального единства. Это кульминация видения, обещанное немецкому народу - единственного рейха, неделимого в цели и судьбе, под вечным руководством Фюрера." #NT!
 GER_gott_mit_uns: "Gott MIT UNS" #NT!
 GER_gott_mit_uns_desc: "Когда дым очищается, и наши враги падают один за другим, немецкий народ идет вперед под непоколебимым руководством Фюрера. Это больше не просто война - это священная миссия. С историей в качестве нашего свидетеля и божественного провидения на нашей стороне мы принесем новый приказ из пепла старого. Бог с нами, и ничто не будет стоять на нашем пути." #NT!
 GER_lebensraum_achieved: "Лебенсраум достиг" #NT!
 GER_lebensraum_achieved_desc: "Наконец, мы преуспели, немецкий народ выиграл свою законную землю с кровью, потом и слезами. Благодаря нашему фюреру, у нас больше нет договоров, которые нас почесали. Long Live, наш великий фюрер. Хейл Гитлер." #NT!
 GER_the_new_order: "Новый Порядок" #NT!
 GER_the_new_order_desc: "Теперь, когда вся Европа находится у наших ног, богатые ресурсы Европы и миллионы скромных рабов готовы служить великой немецкой расе. Как великие немцы, которые будут вести эти обширные ресурсы, теперь мы создадим новый мировой порядок." #NT!
 GER_increase_the_air_force_budget: "Увеличьте бюджет люфтваффе" #NT!
 GER_increase_the_air_force_budget_desc: "Люфтваффе необходимо для достижения технологического превосходства, чтобы справиться с мировыми державами. Более быстрые, более мощные, лучшие маневренные самолеты могут оставить все небо под контролем немецкого языка. Но для этого необходимо увеличить бюджет люфтваффе" #NT!
  #Führer Path First Focus 
 GER_help_italians: "Помогите итальянцам" #NT!
