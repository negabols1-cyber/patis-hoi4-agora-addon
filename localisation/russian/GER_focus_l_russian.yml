 GER_lebensraum_focus: "Лебенсраум" #NT!
 GER_lebensraum_focus_desc: "Необходимо собрать всех немцев под одной крышей, немцы - высшая раса!" #NT!
 GER_make_coal: "Производить уголь альтернативными способами" #NT!
