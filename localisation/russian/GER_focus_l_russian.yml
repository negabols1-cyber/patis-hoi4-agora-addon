 GER_destory_barons_desc: "Проект Reichswerke Hermann Göring был большой ошибкой" #NT!
 GER_comprimise_with_barons: "Объединить стальные бароны" #NT!
 GER_comprimise_with_barons_desc: "В ноябре 1937 года рейхсминист авиации Герман Гёринг получил неконтролируемый доступ к государственному финансированию и запустил цепочку слияний, диверсифицируясь в военную промышленность с поглощением Rheinmetall. Сам Гёринг контролировал Рейхсворке, но не владел им ни в каком смысле и не получил личную прибыль от него напрямую, хотя иногда он снимал деньги на личные расходы" #NT!
 GER_nationalize_resource_industries: "Национализировать ресурсные отрасли" #NT!
 GER_nationalize_resource_industries_desc: "Мы должны создавать открытые пространства, чтобы построить больше заводов в нашей стране." #NT!
 GER_schwerer_gustav: "Шверер Густав" #NT!
 GER_schwerer_gustav_desc: "Разработанная Круппом в 1934 году, эта пушка была разработана для разрушения укреплений крупной области. Оружие было разработано и разработано немецким инженером Эрихом Мюллером. Первым пистолетом был Густав Крупп, как правило, не взимал никаких сборов за первое оружие. Второе оружие называется Дора, названная в честь подруги главного инженера" #NT!
 GER_Standard_panzer: "Стандартный танковой" #NT!
 GER_Standard_panzer_desc: "Немецкие танки были важной частью Вермахта и сыграли фундаментальную роль в течение всей войны, особенно в стратегии битвы Блицккриг." #NT!
 GER_underground_mil_factories: "Подземные фабрики" #NT!
 GER_underground_mil_factories_desc: "Нам нужно скрыть нашу милитаризацию, союзные силы не должны узнавать" #NT!
