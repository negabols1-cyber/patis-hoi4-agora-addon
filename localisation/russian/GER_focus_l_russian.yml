 GER_steel_barons: "Стальные бароны" #NT!
 GER_steel_barons_desc: "Рейхсварк Герман Гёринг был промышленным конгломератом в нацистской Германии. Он был основан в июле 1937 года для извлечения и обработки внутренних железных руд из Зальцгиттера, которые были сочтены неэкономичными частными стальными мельницами." #NT!
