 GER_total_war: "Полная война" #NT!
 GER_total_war_desc: "Total War-это война, которая включает в себя любые и все гражданские ресурсы и инфраструктуру в качестве законных военных целей, мобилизует все ресурсы общества для борьбы с войной и дает приоритет войне в отношении некомбатантных потребностей." #NT!
 GER_volkssturm: "Volkssturm" #NT!
 GER_volkssturm_desc: "Volkssturm, II. Народная освободительная армия, сформированная от немецких мужчин по приказу Адольфа Гитлера в последние месяцы Второй мировой войны. Хотя ополченцам организации было от 16 до 60 лет, не было никакого требования, чтобы ранее проходили военную подготовку в армии." #NT!
 GER_volunteer_workers: "Волонтерские работники" #NT!
 GER_volunteer_workers_desc: "В Германии традиция добровольной службы восходит к 19 веку. Сегодня сорок четыре процента всех немцев старше 14 лет работают на волонтерской основе для своих сообществ. Их причины для участия и опыт, который у них есть, столь же разнообразны, как и задачи, которые они принимают на себя." #NT!
