 GER_improve_steel_barons_desc: "Государственный Рейхсварке рассматривался как средство ускорения роста в добыче руды и производства стали, независимо от планов и мнений частных капиталистов, которые противоречат стратегическому видению Адольфа Гитлера." #NT!
