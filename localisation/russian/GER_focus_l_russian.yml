 GER_plan_sealion: "Операция морского льва" #NT!
 GER_plan_sealion_desc: "Операция Sea Lion, также написанная как операция Sealion, была нацистской Германией кодовым названием для плана вторжения в Великобритания во время битвы за Британию во второй мировой войне. После битвы во Франции Адольф Гитлер, немецкий фюрер и верховный командир вооруженных сил, надеялись, что британское правительство примет его предложение покончить с войной" #NT!
 GER_ally_with_iceland: "Подружиться с Исландией" #NT!
