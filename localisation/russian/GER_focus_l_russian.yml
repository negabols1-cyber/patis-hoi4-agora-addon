 GER_wehrmacht_focus: "[Root.GetWehrmachtFocus]" #NT!
 GER_wehrmacht_focus_desc: "Новая немецкая армия на поле. Пойдем. Завоевывать." #NT!
 GER_enigma_focus: "Загадка" #NT!
 GER_enigma_focus_desc: "Машина Enigma - наш шифтор. Он должен быть разработан и использовать, чтобы мы могли видеть, что делает враг, и они не могут видеть, что мы делаем." #NT!
 GER_abwehr_focus: "Абвер" #NT!
 GER_abwehr_focus_desc: "Абвер был создан в 1920 году как часть Министерства обороны Германии, когда правительству Германии было разрешено сформировать Рейхсвера, военную организацию Республики Веймар. Первым главой Abwer был майор Фридрих Гемпп, бывший заместитель полковника Уолтера Николай, глава немецкой разведки во время Первой мировой войны, который оказался в основном неэффективным. В 1930 -х годах, с ростом нацистского движения, Министерство обороны было реорганизовано; Удивительно, но 7 июня 1932 года военно -морской офицер, капитан Конрад Пациг, был назначен начальником Абвера, несмотря на то, что он был в значительной степени укомплектован военнослужащими." #NT!
  #Navy 
 GER_the_kriegsmarine: "[Root.GetKriegsmarineFocus]" #NT!
 GER_the_kriegsmarine_desc: "Кригсмарин является военно -морской ветвью немецких сил." #NT!
 GER_crizmarine: "Schlachtsche" #NT!
 GER_crizmarine_desc: "Дайте больше ресурсов немецкого флота." #NT!
 GER_new_bismarck: "Рыцари Атлантики" #NT!
 GER_new_bismarck_desc: "Атлантический океан очень важен. Закрепить их." #NT!
 GER_donits_ubot_effort: "Усилия Дёница подводной лодки" #NT!
 GER_donits_ubot_effort_desc: "Commodore Dönitz выступает за стратегию неограниченной подводной войны как лучшего способа привлечения Великобритании на колени. С достаточным количеством подводных лодок мы могли бы голодать в британскую домашнюю промышленность всех необходимых ресурсов из его обширной империи." #NT!
 GER_H_klasse: "H klasse" #NT!
 GER_H_klasse_desc: "Новый немецкий флот сильнее!" #NT!
 GER_Flugzeugtrager: "Flugzeugträger" #NT!
 GER_Flugzeugtrager_desc: "Принять новые планы." #NT!
  #Army 
 GER_the_heer: "[Root.GetTheHeerFocus]" #NT!
 GER_the_heer_desc: "Хайнц Гудериан и другие радикальные теоретики настаивают на том, чтобы осмеливаться новые доктрины, подчеркивая общение, идентификацию «Шверпанкта» и местные концентрации объединенных вооруженных сил. Предоставление им свободных бразды может помочь избежать у ужасов Великой войны с мясой." #NT!
 GER_new_infantry_tactics: "Новая пехотная тактика" #NT!
 GER_new_infantry_tactics_desc: "Пехотная тактика прошла долгий путь с момента Великой войны. Если мы применим недавние достижения Генерального штаба в военной мысли о реальном опыте, костяк Вермахта может стать более непоколебимой, чем когда-либо прежде." #NT!
 GER_artillery_modernization: "Артиллерийская модернизация" #NT!
 GER_artillery_modernization_desc: "Версальский договор стремился ограничить полевую артиллерию Германии всего 284 штуки, но это смешное ограничение не является препятствием для Рейха сейчас. Мощной Германии нуждается в мощном звании, и мощный человек нуждается в модернизированных мощных орудиях!" #NT!
 GER_motorize_and_modernize_the_infantry: "Моторизировать и модернизировать пехоту" #NT!
 GER_motorize_and_modernize_the_infantry_desc: "MG 42, разработанный для того, чтобы быть недорогим и простым в построении, оказался очень надежным и простым в эксплуатации. Он наиболее заметен очень высоким уровнем огня в 1200 раундов в минуту. Эта способность делает его чрезвычайно эффективным в обеспечении сильного огня. Нам необходимо реализовать эти дешевые способы извержения роя раундов на врага, являются ключом к победе и разработке нового опорного оружия." #NT!
 GER_Panzerwaffe: "Panzerwaffe" #NT!
 GER_Panzerwaffe_desc: "Блицкриг нуждается в бронированной войне. Это нужен танцворваффо. Что еще более важно для Лебенсраум.  Сейчас самое время уделять больше внимания бронированным подразделениям. Больше панзеров." #NT!
 GER_panzergrenadiers: "Pancergrenadiers" #NT!
 GER_panzergrenadiers_desc: "Для тех, кто смотрит дальше, чем наша пропаганда, не секрет, что наша армия остается одной из лошадей и поездов. Это должно быть одной из наших основных целей по увеличению нашего использования как мобильной, так и бронированной пехоты." #NT!
 GER_build_up_panzer_divisions: "Создать танковые подразделения" #NT!
 GER_build_up_panzer_divisions_desc: "Старые «подразделения Лейхте» оказались слишком тонкими, чтобы выполнять свою работу как броню, но недостаточно маневренные, чтобы полностью заменить кавалерию. Следующее поколение танков должно иметь более жесткую броню и более мощные вооружения, даже если есть небольшая стоимость скорости." #NT!
 GER_counter_armor: "Столешница" #NT!
 GER_counter_armor_desc: "Броня не должна быть на нашем пути. Если мы уничтожим то, на что рассчитывают наши противники, никто не может противостоять нам!" #NT!
 GER_oberkommando_des_heeres: "Oberkommando des Heeres" #NT!
 GER_oberkommando_des_heeres_desc: "Oberkommando des Heeres Okh - верховное командование армии Вермахта. Для вооруженных сил. Сильнее Ок, для Германии!" #NT!
  #Air 
 GER_the_luftwaffe: "[Root.GetLuftwaffeFocus]" #NT!
 GER_the_luftwaffe_desc: "Расширить воздушные силы Люфтваффе!" #NT!
 GER_Fallschirmjager: "Fallschirmjäger" #NT!
 GER_Fallschirmjager_desc: "Мощный Fallschirmjager следует использовать больше." #NT!
 GER_expand_air_bases: "Расширить возможности люфтваффе" #NT!
 GER_expand_air_bases_desc: "Люфтваффе II. Это была воздушная боевая единица немецких войск Вермахта во время Второй мировой войны. Воздушная власть имперской армии, воздушные силы немецкой империи во время Первой мировой войны." #NT!
 GER_Geschwader: "Гесчвадер" #NT!
 GER_Geschwader_desc: "Geschwader должен иметь больше важности." #NT!
 GER_entfalten_jagdgeschwader: "Расширить Jagdgeschwader" #NT!
 GER_entfalten_jagdgeschwader_desc: "Расширить Jagdgeschwader." #NT!
 GER_expand_Sturzkampfgeschwader: "Разверните Sturzkampfgeschwader" #NT!
 GER_expand_Sturzkampfgeschwader_desc: "Разверните Sturzkampfgeschwader." #NT!
 GER_bomber_production: "Производство бомбардировщика" #NT!
 GER_bomber_production_desc: "Дайте более важно производство бомбардировщика." #NT!
 GER_Strahlflugzeug_plan: "Страхлфлюгзег План" #NT!
 GER_Strahlflugzeug_plan_desc: "Принять план Strahlflugzeug." #NT!
 GER_Amerika_bomber: "Америка-бомбардировщик" #NT!
 GER_Amerika_bomber_desc: "Америка-бомбер будет могилой для врагов." #NT!
  #SS 
 GER_Schutzstaffel_focus: "Schutzstaffel" #NT!
 GER_Schutzstaffel_focus_desc: "Schutzstaffel - это военизированная группа, которая непосредственно обслуживает Адольфа Гитлера и нацистской партии. То, что началось как простой отряд безопасности для встреч NSDAP, выросло под руководством Генриха Гиммлера в мощный и боящийся инструмент для тоталитарного режима Гитлера." #NT!
 GER_RHSA_focus: "Установить главное офис безопасности Reich" #NT!
 GER_RHSA_focus_desc: "Главный офис REICH Security RHSA был организацией под руководством Генриха Гиммлера в его двойном качестве в качестве Рейхсфюрера-С.С., начальника немецкой полиции и главы нацистской партии Шуцштаффел. Заявленная миссия организации состояла в том, чтобы бороться со всеми «врагами Рейха» внутри и за пределами нацистской Германии." #NT!
 GER_Waffen_SS_focus: "Модернизируйте Waffen-SS" #NT!
 GER_Waffen_SS_focus_desc: "Waffen-SS является вооруженной группой организации. Мы должны модернизироваться, чтобы призвать мужчин из нацистской Германии и мужчин с оккупированных территорий." #NT!
 GER_Waffen_SS_recruitment: "Набор дивизий SS" #NT!
 GER_Waffen_SS_recruitment_desc: "Больше солдат и меньше мятежа! SS должен расти сейчас. Для этого мы должны укрепить SS. Вперед в Холокост и многое другое! Зиг Хейл!" #NT!
 GER_create_ss_panzer_divisions: "Создание танковых дивизий SS" #NT!
 GER_create_ss_panzer_divisions_desc: "Больше SS Panzers стало необходимостью в этой области. Дежурные танковые планы! Безжалостно для Лебенсраум." #NT!
 GER_Einsatzgruppen: "Форма einsatzGruppen" #NT!
 GER_Einsatzgruppen_desc: "Энсацгруппен были военизированными отрядами смерти Шуцстаффела (SS) нацистской Германии. Они несут главную ответственность за массовые убийства за счет стрельбы в оккупированной Европе. Einsatzgruppen был неотъемлемой частью реализации так называемого «окончательного решения еврейского вопроса» на территориях, завоевавшихся нацистской Германией. \ N the einsatzgruppen имел свое начало в Einsatzkommando, созданном сотрудниками SS Reinhard Heydrich в 1938 году, чтобы охранять правительственные здания и документы после Ansshluss Austria in That in That in That I. Einsatzgruppen, состоящий из нескольких Einsatzkommando в 1939 году, они стали частью Главного офиса безопасности REICH SS." #NT!
 GER_ethnic_cleansing: "Этническая чистка" #NT!
 GER_ethnic_cleansing_desc: "Для арийцев! Смерть евреям и предателям! Мы должны депортировать их все на Мадагаскар. SS поможет нам в этом. Чертовски люди и гонки." #NT!
 GER_holocaust_focus: "Установить концентрационные лагеря" #NT!
 GER_holocaust_focus_desc: "Европа наша и останется нашей! Теперь пришло время прославить нашу гонку. Убейте тех, кто не наше." #NT!
  ########### 
 GER_incorporate_rheinmetall: "Включите Rheinmetall" #NT!
 GER_incorporate_rheinmetall_desc: "Компания Rheinmetall была военной компанией. Он был основан рейхсминистером авиации Германа Горинга. Теперь нам нужно дать больше авторитетов, чтобы прирост ресурсов и наша отрасль могла развиваться." #NT!
 GER_Rheinmetall_attempt_tt: "\ n §Y с этими решениями §!, вы сможете §Ybe в состоянии извлечь §Lresources§! из мест, которые вы инвестируете в фокус §Y $ ger_prioritize_the_four_year_plan $ §!, с §Lrheinmetall Company§! §Yhermann." #NT!
 GER_Rheinmetall_attempt_state_modifier1: "Инициатива Rheinmetall" #NT!
 GER_Rheinmetall_attempt_state_modifier2: "Большая инициатива Rheinmetall" #NT!
 GER_Rheinmetall_attempt_state_modifier3: "Максимальная инициатива Rheinmetall" #NT!
 GER_rustung_und_ruhm: "Rüstung und ruhm" #NT!
 GER_rustung_und_ruhm_desc: "Слава выигрывает не словами, а со сталью. В соответствии с правлением Кайзера мы отправимся в новую эру вооружения - угаснутую, преднамеренное и вызывающее. Наши фабрики будут гремевать с жизнью, наши работники будут служить с гордостью, и наши враги будут дрожать от того, что мы сможем. Наследие Бисмарка и Мольтке требует не меньше." #NT!
 GER_albert_speer_ascended: "Альберт Шпеер поднялся" #NT!
 GER_albert_speer_ascended_desc: "В то время как другие, построенные с лозунгами, униформой и страхом, Альберт Шпеер двинулся тихо - с точностью, расчетом и намерениями. Теперь тишина закончилась. Шпеер поднялся не в огне, а по функционированию. Рейх больше не является сценой для сумасшедших, а система в руках его архитектора." #NT!
 GER_depoliticize_the_reich: "Деполитизировать рейх" #NT!
 GER_depoliticize_the_reich_desc: "Чтобы восстановить здравомыслие, мы должны удалить гниль идеологии со всех уголков администрации. Лояльность к порядку, компетентности и преемственности - это будут наши новые принципы." #NT!
 GER_reorganize_the_four_year_plan: "Реорганизовать четырехлетний план" #NT!
 GER_reorganize_the_four_year_plan_desc: "Первоначально построенный для подготовки Германии к войне, четырехлетний план устарел и раздувается. Под руководством Speer он будет преобразован в оптимизированный национальный экономический двигатель - сосредоточен на функции над идеологией." #NT!
 GER_purge_the_fanatics: "Очистить фанатиков" #NT!
 GER_purge_the_fanatics_desc: "Идеологические безумцы, которые когда -то захватили рейх, должны быть удалены, если порядок преобладает. SS, фанатики, манипуляторы все будут в стороне для выживания государства." #NT!
 GER_a_deal_with_the_black_order: "Сделка с черным орденом" #NT!
 GER_a_deal_with_the_black_order_desc: "Архитектор решил не сношать Черную Цитадель, а ремонтировать ее коридоры. В холодном и рассчитанном соглашении Спеер принял несколько требований от Гиммлера и руководства СС. В обмен на их лояльность SS получила большее влияние в военной иерархии, внутренней безопасности и администрации. Это не союз веры, а по необходимости. Порядок требует компромисса." #NT!
 GER_modernize_the_wehrmacht: "Модернизируйте wehrmacht" #NT!
 GER_modernize_the_wehrmacht_desc: "Армия должна служить рейху, а не партии, а не человеку и, конечно, не культовому. Мы восстановим Вермахт в профессиональное, послушное учреждение, лояльное только к немецкому государству." #NT!
 GER_industrial_modernization: "Промышленная модернизация" #NT!
 GER_industrial_modernization_desc: "Война изменилась, и мы тоже должны. Устаревшие производственные модели будут заменены на механизированную эффективность. От стали до синтетического каучука, рейх будет модернизирован - не для славы, а для выносливости." #NT!
 GER_architect_of_a_new_order: "Архитектор нового порядка" #NT!
 GER_architect_of_a_new_order_desc: "Рейх пролил свою идеологическую кожу. На его месте находится система порядка, эффективности и холодного дизайна. Не утопия - но состояние, которое функционирует. Государство стоит сохранить. Государство, которое мы построили из руин." #NT!
 GER_hermann_goring_ascended: "Герман Гёринг поднялся" #NT!
 GER_hermann_goring_ascended_desc: "С тех пор, как Герман Гёринг был пионером развития немецкой экономики, лидера Люфтваффе и правой руки Гитлера, его рост был неизбежным. Long Live наш новый фюрер." #NT!
 GER_preserve_the_party: "Сохранить партию" #NT!
 GER_preserve_the_party_desc: "NSDAP - это позвоночник рейха. Его структуры останутся нетронутыми, а его лояльность усилилась - наша власть, взятая из традиции, так же, как сила." #NT!
 GER_militarizing_the_four_year_plan: "Милитаризация четырехлетнего плана" #NT!
  GER_militarizing_the_four_year_plan_desc:0 "The original Four-Year Plan laid the groundwork for economic rearmament. Now, under Göring’s direct control, it will evolve into a full-fledged military-industrial complex. Every ton of steel, every drop of fuel—redirected toward the Reich’s arsenal. 
 GER_the_marshals_parade: "Парад маршала" #NT!
 GER_the_marshals_parade_desc: "В грандиозном шоу единства, дисциплины и боевой гордости маршалов Парада Рейха через Берлин. Гёринг возглавляет их не только как политическая фигура, но и как военный, - это восхищение как солдат, так и граждан." #NT!
 GER_reichswerke_revival: "Reichswerke Revival" #NT!
 GER_reichswerke_revival_desc: "Рейхсварк Герман Гёринг, когда -то раздутый промышленный эксперимент, теперь будет упорядочен и возродится. С прямым государственным надзором, он станет избитым сердцем немецкого военного производства." #NT!
 GER_legacy_of_the_black_eagle: "Наследие Черного Орла" #NT!
 GER_legacy_of_the_black_eagle_desc: "Черный орел Пруссии однажды взлетел над областью Европы, символом дисциплины, традиций и военного превосходства. Под руководством Гёринг мы теперь стремимся разжечь это наследие - изменить Вермахт по образу старого прусского ордена. Через тренировку, порядок и железное командование дух Фридриха Великого придет еще раз." #NT!
 GER_the_goring_doctrine: "Доктрина Гёринга" #NT!
 GER_the_goring_doctrine_desc: "Смешивание национализма, централизованного планирования и личного авторитета, доктрина Гёринг определяет новый путь для Рейха - одного, где эффективность служит идеологии и идеологии изгибает волю государства. Возраст жесткой догмы закончился; Возраст результатов начинается." #NT!
 GER_heinrich_himmler_ascended: "Генрих Гиммлер поднялся" #NT!
 GER_heinrich_himmler_ascended_desc: "С Гитлером мертвым и старой гвардией сломаны, Генрих Гиммлер поднимается к власти. Как Рейхсфюрер-С.С., его видение государства коренится в крови, послушании и мифе. Новая эра начинается - в черном." #NT!
 GER_reshape_the_volkskorper: "РАЗРЕШИТЕ ​​ВОЛКСКЕРЕР" #NT!
 GER_reshape_the_volkskorper_desc: "Чтобы очистить и реорганировать тело нации, мы должны навязывать новые идеалы. Раса, верность и цель - это столбы, на которых СС переопределяет немецкий народ." #NT!
 GER_ss_economic_order: "SS Экономический порядок" #NT!
 GER_ss_economic_order_desc: "Экономика должна быть реструктурирована, чтобы отразить ценности SS - порядка, иерархия и лояльность. Гражданские учреждения постепенно поглощаются в темный аппарат, управляемый внутренним кругом Гиммлера." #NT!
 GER_night_of_the_iron_crosses: "Ночь железных крестов" #NT!
 GER_night_of_the_iron_crosses_desc: "В одной, Swift Purge оставшаяся оппозиция в государстве и военных устранена. Железный крест - символ «Однажды чести» - теперь становится молчаливым надгробием для тех, кто бросил вызов видению Гиммлера. Без индивидуальных не осталось, SS держит бесспорный контроль." #NT!
 GER_rise_of_the_waffen_ss: "Восстание вафен-сс" #NT!
 GER_rise_of_the_waffen_ss_desc: "С вармачтом, растворяемым в неактуальность, HEER был полностью поглощен постоянно расширяющимся вафен-SS. Черный корпус теперь является единственной военной силой в Рейхе." #NT!
 GER_reich_youth_reborn: "Гиммлер-юугенд" #NT!
 GER_reich_youth_reborn_desc: "Молодежь Германии больше не является инструментом партии, теперь марширует к ритму СС. Дисциплина, идеология и расовая чистота прививаются с самого раннего возраста под прямым надзором Гиммлера." #NT!
 GER_the_shadow_bureaucracy: "Теневая бюрократия" #NT!
 GER_the_shadow_bureaucracy_desc: "Не вся сила находится в открытом виде. SS формирует параллельные учреждения, судебные системы и растущую сеть молчаливых сил. Вскоре первоначальное состояние станет пустой оболочкой." #NT!
 GER_the_black_order_triumphant: "Триумф Чёрного Ордена" #NT!
 GER_the_black_order_triumphant_desc: "Преобразование абсолютно. Рейх больше не существует как нация, а как идеологический крестовый поход. Черный порядок правит высшим, его видение применяется не законом - но присягой, кровью и железом." #NT!
