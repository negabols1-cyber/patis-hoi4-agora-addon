 GER_war_sweden: "Война со Швецией" #NT!
 GER_war_sweden_desc: "Мы в течение многих лет импортировали вольфрам и железо из Швеции; Угроза врага на [SWE.GetNameDef] также представляет угрозу для военных и расширения [GER.GetNameDef]. Мы должны обеспечить [SWE.GetNameDef], чтобы эти жизненно важные ресурсы не попадают в руки врага." #NT!
 GER_war_finland: "Война с Финляндией" #NT!
 GER_war_finland_desc: "[FIN.GetNameDefCap] Влияние в [SOV.GetNameDef] и Scandinavia делает его жизненно важным для дальнейшего расширения [GER.GetNameDef]. Защита этого оплота станет огромным ударом для наших врагов." #NT!
 GER_swedish_steel: "Шведский стальный договор" #NT!
 GER_swedish_steel_desc: "Скандинавские страны похожи на домино; Они стоят и падают вместе. С Норвегией и Данией в нашей сфере Швеция обязательно последует." #NT!
 GER_FIN_the_finnish_lion: "Финский лев" #NT!
 GER_FIN_the_finnish_lion_desc: "[FIN.GetNameDefCap] долгое время был врагом [SOV.GetNameDef] и может оказаться жизненно важной связью с северным фронтом и остальной частью Скандинавии." #NT!
 GER_war_with_iceland: "Операция Икарус" #NT!
 GER_war_with_iceland_desc: "Исландия слишком важна в качестве базы для северной атлантической судоходства, чтобы оставаться незанятой. Мы должны захватить это сразу!" #NT!
 GER_austrian_iron: "Стальные инвестиции в Австрии" #NT!
 GER_austrian_iron_desc: "Австрия немецкая и понадобится определенные инвестиции для немецкого воссоединения." #NT!
 GER_otto_von: "Чехический автобан" #NT!
 GER_otto_von_desc: "Автомобильные дорожки в Германии, федеральные автомагистрали в Германии. Строительство автомагистралей восходит к нацистской эпохе." #NT!
 GER_biger: "Большие танки" #NT!
 GER_biger_desc: "Nien Nien Nien должен быть больше и сильнее добавить пять кораблей, если необходимо, если это" #NT!
 GER_ITA_stahlpakt: "Пакт стали" #NT!
