l_russian:
  persia.1.t:0 "[GetYear] Чрезвычайные выборы"
  persia.1.d:0 "Наконец-то в нашей демократизированной стране проходят первые независимые демократические выборы. После отречения Резы Шаха от власти в пользу дипломатов, народу срочно потребовалось избрать нового президента. Посмотрим, кто же победит на выборах."
  persia.1.a:0 "У Мохаммада Али Форуги есть опыт, чтобы справиться с этой работой"
  persia.1.b:0 "Мохаммад Мосаддык - правильный выбор"
  persia.2.t:0 "[FROM.GetName] принимает наше предложение"
  persia.2.d:0 "[FROM.GetLeader] согласился сотрудничать с нами, чтобы еще больше сблизиться друг с другом."
  persia.2.a:0 "Отлично"
  persia.3.t:0 "[FROM.GetName] отклоняет наше предложение"
  persia.3.d:0 "К сожалению, [FROM.GetNameDef] отклонил наше предложение, поскольку оно 'отрицает их суверенитет'. Их потеря - отказываться от нашего щедрого предложения."
  persia.3.a:0 "Чушь!"
  persia.4.t:0 "Иран хочет пересмотреть нефтяное соглашение"
  persia.4.d:0 "Иран хочет, чтобы нефтяная сделка, которую мы с ними заключили, была пересмотрена таким образом, чтобы она была выгодна обеим сторонам. Они считают, что это можно сделать так, чтобы это соглашение, которое сейчас является бременем для их экономики, могло также укрепить наш союз."
  persia.4.a:0 "Имеет смысл"
  persia.4.b:0 "Не обязательно"
  persia.5.t:0 "Иран требует наши активы в Сирии"
  persia.5.d:0 "Иран поставил нам ультиматум передать им все наши активы в Сирии и ее окрестностях. Они заявили, что если передача не произойдет в ближайшее время, они прибегнут к силе, если потребуется."
  persia.5.a:0 "Нет необходимости в войне, отдайте землю"
  persia.5.b:0 "Они блефуют"
  persia.6.t:0 "Иран требует наши активы в Египте и Леванте"
  persia.6.d:0 "Иран поставил нам ультиматум передать им все наши активы в Египте и Леванте. Они заявили, что если передача не произойдет в ближайшее время, они прибегнут к силе, если потребуется."
  persia.6.a:0 "Нет необходимости в войне, отдайте землю"
  persia.6.b:0 "Они блефуют"
  persia.7.t:0 "Пригласить каджарского короля"
  persia.7.d:0 "Нам нужно решить сейчас, кого из династии Каджаров мы собираемся поставить во главе, чтобы к моменту успеха переворота было не слишком поздно. Интересно, кого было бы более уместно пригласить."
  persia.7.a:0 "Мохаммад Хасан Мирза Каджар"
  persia.7.b:0 "Ферейдун Мирза Каджар"
  persia.8.t:0 "[From.GetName] просит более тесного сотрудничества"
  persia.8.d:0 "[From.GetName] выразил желание укрепить связь между нашими двумя нациями."
  persia.8.a:0 "С радостью"
  persia.8.b:0 "Лучше держаться от них подальше"
  persia.9.t:0 "[From.GetName] соглашается"
  persia.9.d:0 "[From.GetName] согласился укрепить наши связи."
  persia.9.a:0 "Отлично"
  persia.10.t:0 "[From.GetName] отказывается"
  persia.10.d:0 "[From.GetName] отказался от дальнейшего сотрудничества между нами."
  persia.10.a:0 "Жаль"
  persia.11.t:0 "Иранский обмен ресурсами"

  persia.11.d:0 "[From.GetLeader] предложил торговую сделку с Германией, если [Root.GetLeader] согласится предоставить Ирану чертежи новейших легких и средних танков, которые мы разработали. Похоже, это первый шаг к более тесным ирано-германским отношениям, поэтому, даже если это не имеет военного значения, это может быть полезно для нас в геополитическом смысле. Конечно, эти новейшие танки могут попасть в руки будущего врага..."
  persia.11.a:0 "Это соглашение поможет как Германии, так и Ирану."
  persia.11.b:0 "Никогда!"

  persia.12.t:0 "[From.GetNameDef] Предлагает Пакт о ненападении"
  persia.12.d:0 "[From.GetName] предлагает Пакт о ненападении, направленный на укрепление мирных отношений и предотвращение любых актов агрессии или враждебности между двумя странами. Этот пакт будет служить обязательством взаимного уважения, территориальной целостности и мирного урегулирования споров."
  persia.12.a:0 "Хорошо"
  persia.12.b:0 "Ненужно"

  persia.13.t:0 "[From.GetNameDef] Предлагает Договор о дружбе"
  persia.13.d:0 "[From.GetName] протягивает руку дружбы и сотрудничества, предлагая Договор о дружбе. Этот договор направлен на укрепление дипломатических связей, поощрение взаимопонимания и содействие миру и стабильности в регионе. Если мы примем это соглашение, обе страны смогут способствовать развитию друг друга за счет увеличения торговли, культурного обмена и сотрудничества в различных областях."
  persia.13.a:0 "Звучит неплохо"
  persia.13.b:0 "Мы сохраним свой нейтралитет"

  persia.14.t:0 "[From.GetNameDef] Требует нашу землю"
  persia.14.d:0 "Иранские дипломаты указали на иранцев, живущих в этом регионе, и заявили, что эти земли не принадлежат нам, они должны принадлежать им, и что если мы не отдадим им то, что они хотят, они возьмут это силой, если потребуется."
  persia.14.a:0 "Нет необходимости в войне, отдайте территорию"
  persia.14.b:0 "Бред!"

  persia.15.t:0 "[From.GetNameDef] Требует нашей аннексии"
  persia.15.d:0 "Иранское правительство хочет, чтобы мы были аннексированы для служения более великой цели под знаменем Ислама. Они говорят, что будет легче сражаться с неверными, если мы все присоединимся к Ирану, но это также означает отказ от нашей независимости в пользу страны, принадлежащей шиитской ветви. Мы не считаем это возможным."
  persia.15.a:0 "Ничего не поделаешь"
  persia.15.b:0 "Мы не будем сдаваться шиитским псам"

  persia.16.t:0 "Мирские требования [ROOT.GetAdjective]"

  persia.16.d:0 "Мы принесли благие вести с фронта! Наши войска недавно выиграли битву и смогли обезопасить наши владения. С этим решающим ударом, нанесенным по [SOV.GetNameDef], мы находимся в сильной позиции, чтобы начать мирные переговоры.\n\nОдной из заявленных целей [SOV.GetAdjective] вторжения было увеличение буферной зоны вокруг наших территорий, и теперь, когда они, несомненно, не только не достигли этой цели, но и потеряли сами территории. Мы полагаем, что они будут жаждать избавиться от этого конфликта.\n\nТеперь решать нам, когда начинать переговоры, мы можем продолжить сражение и посмотреть, сможем ли мы захватить больше, или стремиться к белому миру как можно скорее."
  persia.16.a:0 "Пожалуй, пора к миру..."

  persia.17.t:0 "Территориальные требования [FROM.GetAdjective] к миру"
  persia.17.d:0 "Мы только что получили требование о капитуляции от наших [FROM.GetAdjective] соперников. В качестве одного из условий для мира они требуют от нас передать ряд различных территорий на Кавказе и в Центральной Азии, и настаивают на том, чтобы мы как можно скорее освободили эти земли."
  persia.17.a:0 "У нас нет другого выхода, кроме как признать поражение..."
  persia.17.b:0 "Как они смеют!?"

  persia.18.t:0 "[FROM.GetNameDefCap] принимает наши мирные условия"
  persia.18.d:0 "Они приняли мирный договор! На улицах начались спонтанные празднования по мере распространения новостей о нашей победе. [FROM.GetAdjective] войска уже начали отступать с нашей территории, возвращаясь в свои дома в нищете.\n\nЭто, безусловно, день, который останется одним из дней гордости для нашей нации, поскольку мы не только победили захватчиков, но и разгромили их так сильно, что смогли расширить свои собственные территории за их счет!"
  persia.18.a:0 "Надеюсь, они наконец-то извлекли урок."

  persia.19.t:0 "[FROM.GetNameDefCap] отклоняет наши мирные условия"
  persia.19.d:0 "Эти дураки в [FROM.GetNameDef] отказались от нашего великодушного предложения о мире. Их все более отчаянное правительство цепляется за бредовую идею, что они все еще могут победить, осознавая, что если правда о состоянии войны просочится наружу, им придется столкнуться с массовыми восстаниями и, возможно, даже с революцией у себя дома.\n\nНаши солдаты остаются на поле боя, их неугасимый дух высок, они уверены в том, что они продолжают праведную борьбу, готовясь к новым боям, будучи уверенными, что победа близка."
  persia.19.a:0 "Эти глупцы заплатят за это!"

  persia.100.t:0 "Смерть Шаха"
  persia.100.desc:0 "Реза Шах Пехлеви, представляющий Пехлеви монархию, умер от естественных причин. В то время как его сын занимает его место, представляя монархию, [ROOT.GetNameDef] оглядывается на его модернизированное правление."
  persia.100.a:0 "Сожалею"

  persia_clergy.2.t:0 "Духовенство хочет больше мечетей"

  persia_clergy.2.d:0 "Духовенство оказывает давление на правительство, чтобы оно выделяло ресурсы на строительство дополнительных мечетей. Они утверждают, что необходимо больше мест для поклонения, чтобы удовлетворить духовные потребности растущего населения и укрепить религиозные ценности нации. Духовенство считает, что поддержка государства в этом вопросе имеет решающее значение для поддержания социальной гармонии и религиозной приверженности среди населения."
  persia_clergy.2.a:0 "Одобрить строительство большего количества мечетей"
  persia_clergy.2.b:0 "Отклонить их просьбу"
  persia_clergy.3.t:0 "Духовенство требует финансовой поддержки от государственной казны"
  persia_clergy.3.d:0 "Духовенство обратилось к правительству с требованиями о финансовой поддержке из государственной казны. Они утверждают, что религиозные учреждения испытывают трудности с самообеспечением и нуждаются в государственном финансировании для продолжения своей деятельности. Духовенство утверждает, что эта поддержка необходима для сохранения культурной и религиозной ткани нации. Однако удовлетворение их требований может напрячь государственный бюджет и привести к потенциальным конфликтам из-за распределения ресурсов."
  persia_clergy.3.a:0 "Предоставить финансовую поддержку духовенству"
  persia_clergy.3.b:0 "Отказаться от их требований"
  persia_clergy.4.t:0 "Духовенство требует больше земли"
  persia_clergy.4.d:0 "Духовенство теперь требует от государства больше земли, чтобы расширить свое влияние и контроль. Они утверждают, что дополнительная земля необходима для строительства новых религиозных школ, мечетей и других объектов для обслуживания верующих. Этот шаг значительно увеличит их власть и потенциально ограничит способность правительства эффективно управлять ресурсами страны."
  persia_clergy.4.a:0 "Предоставить им больше земли"
  persia_clergy.5.t:0 "Духовенство хочет запретить алкоголь"
  persia_clergy.5.d:0 "Духовенство выдвинуло требование запретить продажу и употребление алкоголя по всей стране. Они утверждают, что алкоголь - это развращающее влияние, которое ведет к нравственному разложению и социальным проблемам. Духовенство считает, что запрет алкоголя необходим для поддержания исламских ценностей и обеспечения здоровья и благополучия населения. Однако реализация такого запрета может столкнуться с сопротивлением со стороны различных слоев общества и повлиять на экономику."
  persia_clergy.5.a:0 "Мы подумаем об этом"
  persia_clergy.6.t:0 "Духовенство хочет более консервативного образования"
  persia_clergy.6.d:0 "Духовенство выступает за более консервативный подход к образованию. Они хотят пересмотреть учебную программу, чтобы подчеркнуть традиционные религиозные ценности и учения, гарантируя, что следующее поколение вырастет с твердой приверженностью исламским принципам. Такой сдвиг в образовательной политике может сформировать будущую культуру и идеологию нации, но он также может ограничить академическую свободу и современные образовательные практики."
  persia_clergy.6.a:0 "Это важный вопрос, о котором нужно подумать"
  persia_clergy.7.t:0 "Духовенство требует отмены запрета на хиджаб"

  persia_clergy.7.d:0 "Духовенство требует отмены запрета на хиджабы. Они утверждают, что ношение хиджаба является фундаментальным религиозным правом и важным аспектом культурной идентичности для многих женщин в стране. По их мнению, снятие запрета восстановит религиозную свободу и уважение к традиционным ценностям."
  persia_clergy.7.a:0 "Снять запрет на хиджабы"
  persia_clergy.7.b:0 "Сохранить запрет"
  persia_clergy.8.t:0 "Духовенство оказывает все большее влияние на людей"
  persia_clergy.8.d:0 "Сообщения свидетельствуют о том, что духовенство усиливает свое влияние на население. Через проповеди, общественную деятельность и религиозные собрания они распространяют свою идею и приобретают все больше последователей. Это растущее влияние может поддержать их требования и повлиять на общественное мнение по различным вопросам."
  persia_clergy.8.a:0 "Тщательно следить за их деятельностью"
  persia_clergy.9.t:0 "Духовенству не нравятся наши политики"
  persia_clergy.9.d:0 "Духовенство выразило неудовлетворение политикой нынешнего правительства. Они считают, что последние решения и реформы противоречат их религиозным учениям и ценностям. Это недовольство может привести к усилению напряженности между правительством и религиозными лидерами."
  persia_clergy.9.a:0 "Пересмотреть нашу политику"
  persia_clergy.10.t:0 "Духовенство в гневе"
  persia_clergy.10.d:0 "Духовенство в ярости от действий правительства. Они считают, что их требования игнорируются, а их влияние подрывается. Этот гнев может привести к серьезным волнениям и оппозиции, создавая угрозу стабильности правительства."
  persia_clergy.10.a:0 "Учитывать их проблемы"
  persia_clergy.11.t:0 "Покушение на [ROOT.GetLeader]"
  persia_clergy.11.d:0 "В шокирующем повороте событий покушение на [ROOT.GetLeader] было связано с радикальными элементами в духовенстве. Нападавшие, мотивированные светской политикой шаха и воспринимаемыми угрозами для религиозного авторитета, стремились дестабилизировать правительство и восстановить большее влияние духовенства. К счастью, покушение было сорвано, но инцидент обострил напряженность и потребовал тщательного расследования степени участия духовенства."
  persia_clergy.11.a:0 "Усилить меры безопасности"
  persia_clergy.11.b:0 "Тщательно расследовать духовенство"
  persia_misc.1.t:0 "[FROM.GetAdjective] Военные инвестиции в [ROOT.GetName]"
  persia_misc.1.d:0  "[FROM.GetName] признал, что чем больше развивается регион Ближнего Востока, тем более процветающим становится наш народ, и тем больше мы все выигрываем от совместной обороны и торговли. Первый шаг к достижению этой мечты - повышение наших коллективных оборонных возможностей для отражения внешних угроз. \n\nВ результате [FROM.GetName] щедро предложил нам промышленное оборудование и специалистов, чтобы помочь нам повысить военное производство."
  persia_misc.1.a:0 "Мы воспользуемся этим!"
  persia_misc.2.t:0 "Реза Шах Пехлеви убит"

  persia_misc.2.d:0 "В трагическом повороте событий Реза Шах Пехлеви, правитель Персии, был убит, что вызвало широкомасштабный хаос и насилие по всей стране. Убийство спровоцировало ожесточенные фракционные соперничества и этническую напряженность, что привело к вспышке полномасштабной гражданской войны. Различные фракции, в том числе лоялисты Шаха, религиозные радикалы и региональные сепаратисты, борются за власть, погружая Персию в состояние хаоса и неопределенности. Будущее страны висит на волоске, поскольку враждующие силы сталкиваются в борьбе за господство в условиях хаоса."
  persia_misc.2.a:0 "Мы должны сохранить контроль"
  persia_misc.2.b:0 "Тревожное событие" 
