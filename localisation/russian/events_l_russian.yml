l_russian:
 MINIMIZE_EVENT:0 "§GКликните§!, чтобы Свернуть. Событие будет помещено в Очередь Событий в меню §HEvents and Decisions§!."
 germany.4.t:0 "Аншлюс"
 germany.4.d:0 "Постоянные восстания в Австрии ясно показывают, что местные жители мечтают о воссоединении с нашим Рейхом. Пришло время действовать и дать волю народу."
 germany.4.a:0 "Как можно говорить, что Австрия - не Германия?!"
 germany.5.t:0 "Антикоминтерновский пакт"
 germany.5.d:1 "Германия предлагает подписать пакт о борьбе с целями Коминтерна по распространению коммунизма по всему миру путем подрывных действий и насилия. Подписав этот пакт, мы соглашаемся обмениваться разведданными об угрозе коммунизма и действовать в тесном сотрудничестве против этой угрозы."
 germany.5.a:0 "Присоединиться"
 germany.5.b:0 "Отказаться"
 germany.6.t:0 "Тройственный Пакт"
 germany.6.d:0 "Подписанты считают важнейшим условием любого прочного мира предоставление всем нациям в мире подобающего места, и решили встать друг за друга и сотрудничать в своих усилиях в Большой Восточной Азии и регионах Европы, где их основной целью является установление и поддержание нового порядка вещей, призванного содействовать взаимному процветанию и благополучию участвующих народов."
 germany.6.a:0 "Присоединиться"
 germany.6.b:0 "Отказаться"
 germany.11.t:0 "Пакт Молотова-Риббентропа"
 germany.11.d:0 "Германский МИД предложил заключить пакт о ненападении между нашими странами. Этот договор существенно увеличит наш взаимный товарооборот, а секретный протокол к нему предполагает разделение Восточной Европы на сферы влияния Германии и СССР.\n\nХотя нацистам в Берлине нельзя доверять, этот пакт позволит нам разобраться с Финляндией, Прибалтикой и Румынией без опасений внешнего вмешательства. Восточные территории Польши также достанутся нам в случае польского коллапса."
 germany.11.a:0 "Подписать договор."
 germany.11.a.tt:1 "§RПока пакт в силе, торговая политика Закрытая экономика будет недоступна.§!\n"
 germany.11.b:0 "Никаких сделок с фашистами!"
 germany.12.t:0 "Москва подписывает пакт"
 germany.12.d:1 "[SOV.GetNameDefCap] мудро согласилась подписать наш пакт о ненападении. Это значит, что мы свободны в действиях и нам не грозит советское вмешательство.\n\nК сожалению, некоторые наши друзья теперь сомневаются в стремлении Германии к окончательному уничтожению коммунизма. По завершении дел с Польшей и Францией нам, возможно, придется пересмотреть этот договор, но об этом мы поговорим в другой раз..."
 germany.12.a:0 "Отлично."
 germany.13.t:0 "Москва отклоняет пакт"
 germany.13.d:1 "[SOV.GetNameDefCap] отказалась подписать наш пакт о ненападении! Это усложняет ситуацию, так как мы не можем с решительностью разобраться с Польшей или Францией, так как большевики могут вмешаться."
 germany.13.a:0 "Проклятье!"
 germany.14.t:0 "Раздел Польши"
 germany.14.d:1 "Польша наша, но согласно положениям Пакта Молотова-Риббентропа восточные районы попадают в сферу влияния [SOU.GetAdjective]. Вывести наши войска и позволить [SOU.GetAdjective] занять эту территорию? Если мы этого не сделаем, то наш договор станет недействительным"
 germany.14.a:0 "Да. Необходимо соблюдать условия договора"
 germany.14.b:0 "Нет! Вся Польша принадлежит Отечеству!"
 germany.15.t:0 "Германия чтит пакт"
 germany.15.d:0 "В соответствии с Пактом Молотова-Риббентропа германские войска эвакуировались из восточной Польши, а наши войска переместились, чтобы занять эту территорию"
 germany.16.t:1 "[From.GetNonIdeologyName] нарушает пакт"
 germany.16.d:1 "[From.GetNonIdeologyName] отказался от раздела Польши с нами, что является грубым нарушением Пакта Молотова-Риббентропа! Из-за этого предательства наш договор с ними стал ничтожным!"
 germany.16.a:0 "Мы были глупцами, доверившись фашистам!"
 germany.20.t:0 "Второй Венский арбитраж"
 germany.20.d:0 "Признавая, что в Европе установился новый порядок, нас попросили Венгрия и Румыния выступить посредниками в территориальном споре между двумя странами. Трансильвания была отнята у Венгрии и присоединена к Румынии в рамках одного из многих необдуманных изменений, навязанных миру Версалем. Следует ли вернуть Северную Трансильванию под контроль Венгрии?"
 germany.20.a:0 "Отдать Венгрии Северную Трансильванию"
 germany.20.b:0 "Передать Трансильванию Венгрии."
 germany.20.c:0 "Трансильвания останется в составе Румынии."
 germany.21.t:0 "Румыния отвергает наше решение"
 germany.21.d:0 "Румыния отказалась подчиниться решению, принятому на втором Венском арбитраже! Их делегация отозвана в Бухарест, а территория Венгрии не передана."
 germany.21.a:0 "Волю Германии нельзя не исполнять!"
 germany.22.t:0 "Мемель - [FROM.GetNameDef] сдаётся"
 germany.22.d:0 "[FROM.GetAdjective] правительство приняло наши требования, и Мемель будет вновь включен в состав Восточной Пруссии. Ещё одна незаконно захваченная провинция возвращена в состав Германской нации!"
 germany.22.a:0 "Великолепно."
 germany.23.t:0 "Мемель - [FROM.GetNameDef] отвергает требования"
 germany.23.d:0 "[FROM.GetAdjective] правительство отвергло наши требования! Они прячутся за Клайпедской конвенцией, утверждая, что Германия не имеет законных прав на Мемельскую территорию. Придётся объяснить им нашу позицию другими методами..."
 germany.23.a:0 "Упрямые ослы."
 germany.24.t:0 "Военная миссия Германии в Китае"
 germany.24.d:0 "Германия наслаждалась хорошими отношениями с Китаем со времени окончания предыдущей мировой войны, несмотря на потерю наших китайских владений. Немецкая военная миссия присутствует в Китае в течение многих лет, и Александр фон Фалькенхаузен добился большого прогресса в реформировании частей армии Гоминьдана.\n\nЭто, естественно, вызывает некоторую обеспокоенность у японцев, учитывая их нынешнюю войну с Китаем. Они требуют немедленного прекращения всей немецкой поддержки Китая."
 germany.24.a:0 "Отзовите фон Фалькенхаузена."
 germany.24.b:0 "Нет, наши советники останутся."
 germany.24.c:0 "Нет, наши советники останутся, как мы и обещали китайцам."
 germany.25.t:0 "Военные советники отозваны"
 germany.25.d:0 "Ухудшение отношений с Китаем сделало политически невыполнимым поддержание военной миссии в их стране. Александр фон Фалькенхаузен и все наши советники были отозваны."
 germany.25.a:0 "Мы поставим его на работу."
 germany.26.t:0 "Китай задерживает военных советников"
 germany.26.d:0 "Германия и Китай находятся в состоянии войны, и китайцы, следовательно, задержали немецких военных советников, которые реформировали их армию. Фон Фалькенхаузену и нескольким его офицерам удалось избежать плена, и теперь они возвращаются в Европу."
 germany.26.a:0 "Хороший человек!"
 germany.27.t:0 "Укрепление Западного вала"
 germany.27.d:0 "Военные инженеры завершили исследование наших укреплений и определили места, где их необходимо усилить. Были отданы приказы о проведении необходимых работ."
 germany.27.a:0 "Это будет надежней, чем линия Зигфрида."
 germany.28.t:0 "Немцы добиваются аншлюса"
 germany.28.d:0 "Во время протестов разразились беспорядки и акты насилия в знак протеста против присоединения Австрии к Германии для создания союза германских народов. Берлин настаивает на аншлюсе, в результате которого Австрия будет присоединена к нашему государству."
 germany.28.a:0 "Мы присоединимся к Германской империи!"
 germany.28.b:0 "Нет, у Австрии своя судьба."
 germany.29.t:0 "Австрия отказывает в аншлюсе!"
 germany.29.d:0 "Дураки в Вене отказались принять слияние двух наших народов! Это явное пренебрежение волей австрийского народа, и мы не потерпим этого! Возможно, нам придется добиться аншлюса силой."
 germany.29.a:0 "Мы должны подготовиться к военному вмешательству."
 germany.40.t:0 "Мюнхенская конференция"
 germany.40.d:0 "Германские требования передать в состав Германии Судетскую область Чехословакии, где проживает значительное число этнических немцев, достигли критической точки. [GER.GetLeader] разместил войска вдоль чехословацкой границы в готовности к наступлению. В Мюнхене проходят переговоры между Великобританией, Францией, Италией и Германией в надежде мирно урегулировать Судетский кризис. Какова будет позиция Великобритании?"
 germany.40.d_2:0 "Германские требования о передаче ей Судетской области Чехословакии, где проживает значительное число этнических немцев, достигли критической точки. [GER.GetLeader] разместил свои войска у чехословацкой границы, готовясь к нападению. И так как мы уже доказали, что не приемлем немецкий экспансионизм, теперь у нас есть ещё один союзник в войне против Германии."
 germany.40.d_3:0 "Германские требования о передаче ей Судетской области Чехословакии, где проживает значительное число этнических немцев, достигли критической точки. [GER.GetLeader] разместил свои войска у чехословацкой границы, готовясь к нападению. В Мюнхене идут переговоры между Нидерландами, Великобританией, Францией, Италией и Германией в надежде мирно урегулировать Судетский кризис. Какова позиция Нидерландов?"
 germany.40.a:0 "Чехи предоставлены сами себе."
 germany.40.b:0 "Чехословакию необходимо защищать!"
 germany.41.d:0 "Германия требует присоединения Судетской области Чехословакии, где проживает значительное число этнических немцев. [GER.GetLeader] сосредоточил силы вдоль чехословацкой границы, готовясь к нападению. В Мюнхене ведутся переговоры между Великобританией, Францией, Италией и Германией в надежде на мирное урегулирование Судетского кризиса.\n\nБританцы ясно дали понять, что не намерены воевать из-за ссор в далекой стране. Последуем ли мы их примеру или выполним свои обязательства перед Чехословакией, оказав им поддержку?"
 germany.41.a:0 "Оставьте чехов на произвол судьбы."
 germany.41.b:0 "Плевать на англичан! Франция поддерживает своих друзей!"
 germany.42.d:0 "Германия требует присоединения Судетской области Чехословакии, где проживает значительное число этнических немцев. [GER.GetLeader] сосредоточил силы вдоль чехословацкой границы, готовясь к нападению. В Мюнхене ведутся переговоры между Великобританией, Францией, Италией и Германией в надежде на мирное урегулирование Судетского кризиса.\n\nБританцы отказались отступать и угрожают немцам войной, если они нарушат границы Чехословакии. Война может быть неизбежной."
 germany.42.a:0 "Мы должны быть готовы!"
 germany.42.b:0 "Франция должна держаться подальше от этого."
 germany.43.t:0 "Франция выходит из состава союзников"
 germany.43.d:0 "Упрямая Франция отказалась поддержать нас в Судетском кризисе! Они по-прежнему поддерживают Чехословакию и с тех пор, как мы не признали это, решили отменить наш взаимный союз. Даже сейчас Франция готовится к надвигающейся войне с Германией."
 germany.43.a:1 "Дураки! [GER.GetLeader] нужно умиротворить!"
 germany.44.d:0 "Немецкие требования о нашей территории в Судетской области становятся все более враждебными, и теперь их силы собираются вдоль нашей границы! В Мюнхене проводится конференция, на которой европейские лидеры обсуждают будущее Чехословакии, но нас не пригласили.\n\nК счастью, похоже, что союзники будут придерживаться своих прежних обещаний о поддержке. Они пригрозили [GER.GetLeader] войной, если наши границы будут хоть немного нарушены. Несмотря на это, мы должны быть готовы к предстоящей атаке Германии."
 germany.44.a:0 "Хорошо! Пусть приходят!"
 germany.45.d:0 "Немецкие требования о нашей территории в Судетской области становятся все более враждебными, и теперь их силы собираются вдоль нашей границы! В Мюнхене проводится конференция, на которой европейские лидеры обсуждают будущее Чехословакии, но нас не пригласили.\n\nБританские трусы отказались поддержать наш суверенитет, но хотя бы французы держатся за нас! Они разорвали свой союз с Великобританией и образовали новый с нами, пообещав поддержать Чехословакию против немецкой агрессии."
 germany.45.a:0 "Да здравствует Франция!"
 germany.46.t:0 "Мюнхенский диктат"
 germany.46.d:0 "Немецкие требования нашей территории в Судетской области становятся всё более враждебными, и теперь их силы скапливаются вдоль нашей границы! В Мюнхене проходит конференция, где европейские лидеры обсуждают будущее Чехословакии, но нас туда не пригласили.\n\nИ британцы, и французы отозвали свои прежние обещания поддержать нас в случае немецкой агрессии. Их дипломаты ясно дали понять, что если мы решим дать отпор немцам, то будем делать это сами по себе. Возможно, у нас нет выбора, кроме как передать Судеты..."
 germany.46.a:0 "Это тёмный день для Европы."
 germany.46.b:0 "Мы никогда не сдадимся!"
 germany.47.d:0 "В Мюнхене прошли переговоры между лидерами Германии, Великобритании, Франции и Италии, чтобы обсудить будущее Чехословакии. Британцы и их союзники отвергли наши законные претензии на Судеты и пригрозили нам войной, если мы «нарушим» чешскую границу!\n\nБыл разработан план вторжения в Чехословакию, но это, вероятно, спровоцирует общеевропейскую войну. Мы должны убедиться, что готовы к этому."
 germany.47.a:0 "Пора взяться за дело по-жёсткому."
 germany.48.d:0 "В Мюнхене состоялись переговоры между лидерами Германии, Великобритании, Франции и Италии, посвященные будущему Чехословакии. Британцы проявили здравомыслие и признали наши претензии на Судетскую область законными, однако упрямые французы отказываются уступать.\n\nОни отказались от сотрудничества с Великобританией и вместо этого установили более тесные связи с чехами. Похоже, нам придется иметь дело с ними обоими в одно и то же время, но по крайней мере теперь британцы, надеемся, не будут вмешиваться..."
 germany.48.a:0 "Это может сыграть нам на руку."
 germany.49.d:0 "В Мюнхене состоялись переговоры между лидерами Германии, Великобритании, Франции и Италии, посвященные будущему Чехословакии. И британцы, и французы признали наши претензии на Судетскую область законными, и их предыдущие предложения о поддержке чехам были отозваны.\n\nНесмотря на безнадежность своего положения, упрямые чехи отказываются сдавать свою территорию! Нам придется взять ее силой. Подготовлен план вторжения, который сотрет этот гнусный эксперимент Версаля с лица Земли!"
 germany.49.a:0 "Чехов нужно уничтожить."
 germany.50.d:0 "Лидеры Германии, Британии, Франции и Италии обсудили будущее Чехословакии в Мюнхене. Британцы и французы признали наши требования относительно Судетской области обоснованными и отозвали прежние предложения о поддержке чехам.\n\nОсознав безнадежность своего положения, чехи передали нам Судетскую область. Их угнетенные германские жители наконец вернутся на родину!"
 germany.50.a:0 "Исторический день для Германии."
 germany.51.t:0 "Первый Венский арбитраж"
 germany.51.d:0 "Чехословакия — злокачественная опухоль в самом сердце Европы, и наконец немцы решили предпринять решительные действия против нее. Судетская область уже передана Германии, и теперь, в соответствии с Мюнхенским соглашением, территория Чехословакии, по праву принадлежащая Венгрии, должна быть возвращена нам."
 germany.51.a:0 "Пора!"
 germany.52.t:0 "Аннексия Заользья"
 germany.52.d:0 "Чехословакия разваливается, и мы должны действовать быстро, чтобы защитить территории, населенные поляками, прежде чем она будет захвачена Германией. Власть Чехии над Заользьем всегда оспаривалась нами, и пришло время этому региону стать частью нашей нации."
 germany.52.a:0 "Заользье — наше!"
 germany.53.t:0 "Судьба Чехословакии"
 germany.53.d:0 "Мало того, что Германия украла Судетскую область, теперь они решили захватить остатки нашей страны. Наши так называемые союзники нас бросили, а наша лучшая линия обороны была потеряна в Мюнхенском соглашении. Ситуация выглядит безнадежной..."
 germany.53.a:0 "Сдаться Германии"
 germany.53.b:0 "...но мы должны сопротивляться!"
 germany.54.t:0 "Чехи сопротивляются"
 germany.54.d:0 "Чехам почему-то хватило смелости дать отпор нашей оккупации их страны. Лучшие их защитники были в Судетской области, которая теперь под нашим контролем, так что это должна быть быстрая кампания."
 germany.54.a:0 "Прага скоро будет нашей."
 germany.55.d:0 "Чехословакия вот-вот развалится, и в эту минуту наши войска входят в Прагу. После сдачи чехословацкой армии нам досталось огромное количество оружия. Их танки, в частности, могут очень пригодиться нашим войскам.\n\nБогемия будет аннексирована Германией в качестве протектората, но что делать со Словакией? Мы можем превратить её в автономное марионеточное государство под управлением Йозефа Тисо."
 germany.55.d_2:0 "Завоевав Чехословакию, нам следует подумать, как лучше разделить эти территории.\n\nБогемия останется в составе Германии в качестве протектората, но что делать со Словакией? Мы можем превратить её в автономное марионеточное государство под управлением Йозефа Тисо."
 germany.55.a:0 "Создать из Словакии марионеточное государство"
 germany.55.b:0 "Разделить Чехословакию с Венгрией"
 germany.55.c:0 "Вся Чехословакия принадлежит Рейху!"
 germany.56.t:0 "Раздел Чехословакии"
 germany.56.d:0 "Немецкие войска вошли в Прагу, и конец Чехословакии не за горами. Они намерены аннексировать Богемию в состав Немецкого Рейха, но они готовы отдать нам Словакию. Согласиться ли нам на этот раздел? Это будет означать вступление в формальный военный союз с Германией."
 germany.56.d_2:0 "После аннексии Чехословакии Германия намерена сохранить Богемию в составе Рейха, но она готова отдать нам Словакию. Согласиться ли нам на этот раздел? Это будет означать вступление в формальный военный союз с Германией."
 germany.56.a:0 "Конечно! Великая Венгрия скоро станет реальностью!"
 germany.56.b:0 "Нет, нам не нужна Словакия или дружба с Германией."
 germany.57.t:0 "Венгрия отклонила наше предложение"
 germany.57.d:0 "Венгры возмутительно отклонили наше щедрое предложение аннексировать Словакию, заявив, что у них нет интереса к этому региону! С ними нам скоро придется иметь дело. Пока что мы должны найти решение словацкого вопроса."
 germany.57.a:0 "Создать марионеточное правительство Тисо."
 germany.57.b:0 "Аннексировать Словакию в состав Германии."
 germany.58.t:0 "Польский вопрос"
 germany.58.d:0 "Имперское министерство народного просвещения и пропаганды выполнило превосходную работу, и народ Германии - на самом деле, весь мир - был проинформирован о несправедливостях, которые наши немецкие братья в Польше вынуждены терпеть. Теперь у нас есть все необходимое оправдание для войны!"
 germany.58.a:0 "Скоро Польши не станет!"
 germany.60.t:0 "Ремилитаризация Рейнской области"
 germany.60.d:0 "Несколько немецких дивизий недавно вошли в Рейнскую область, что является первым случаем с момента окончания Первой мировой войны, когда немецкие войска располагаются к западу от Рейна. Это явное нарушение Версальского договора, согласно которому Германии запрещено милитаризировать этот регион! Если мы не предъявим ультиматум с требованием их отвода, договор не будет исполнен."
 germany.60.a:0 "Это акт войны! Привлеките британцев на нашу сторону!"
 germany.60.a.tt:0 "§RЕсли начнется война, мы будем страдать от гражданской войны из-за нашего §YРаздробленного правительства:§!§!\n"
 germany.60.b:0 "Выступить с дипломатическим протестом."
 germany.61.d:0 "Несколько немецких дивизий недавно вошли в Рейнскую область, что стало первым случаем размещения немецких войск к западу от Рейна после окончания Великой войны. Это явное нарушение Версальского договора, по которому Германии запрещено милитаризировать этот район!\n\nФранцузы мобилизуют свои войска и, похоже, намерены выдвинуть ультиматум. Если Германия откажется, они готовы выдвинуться в Германию, чтобы справиться с этой угрозой. Общественное мнение в Британии выступает против войны, но если мы откажемся поддержать французов, наш альянс с ними будет расторгнут."
 germany.61.a:0 "Война не обсуждается."
 germany.61.b:0 "Мы должны поддержать Францию!"
 germany.62.d:0 "Несколько немецких дивизий недавно вошли в Рейнскую область, что стало первым случаем размещения немецких войск к западу от Рейна после окончания Великой войны. Это явное нарушение Версальского договора, по которому Германии запрещено милитаризировать этот район!\n\nФранцузы, похоже, довольствуются тем, чтобы ограничить свой ответ на это нарушение дипломатическими возражениями, а общественное мнение в Британии твердо выступает против войны."
 germany.62.a:0 "Мы также выступим с возражением."
 germany.62.b:0 "Версаль нас больше не касается."
 germany.63.t:0 "Британия отказывается от войны"
 germany.63.d:0 "Британцы отказываются поддерживать нас в борьбе против Германии, заявляя, что немцы "просто гуляют у себя во дворе". Если мы вступим с ними в войну, похоже, мы будем сражаться в одиночку.\n\nФранцузское общественное мнение против войны, но Германия будет только крепнуть, а ремилитаризация Рейнской области представляет собой прямую угрозу нашим границам. Без Британии на нашей стороне предъявление ультиматума будет менее опасным. Стоит ли нам двигаться против них в одиночку?"
 germany.63.a:0 "Да! С Германией нужно покончить сейчас."
 germany.63.b:0 "Нет, без британцев мы должны отступить..."
 germany.64.t:0 "Британия поддерживает нас"
 germany.64.d:0 "Хотя в Британии отсутствует широкая общественная поддержка войны, британское правительство признало угрозу со стороны немцев и предложило нам полную поддержку. Мы предъявим Германии последний ультиматум с требованием покинуть демилитаризованную зону. Если они откажутся, пришло время нашим войскам глубоко войти в Германию и положить конец их тираническому режиму!"
 germany.64.a:0 "Вперёд!"
 germany.65.t:0 "Франция и Британия мобилизуются!"
 germany.65.d:0 "Британцы и французы отказались признать ремилитаризацию Рейнской области, назвав это "непростительным нарушением" Версальского договора. Они мобилизуют свои силы против нас и выдвинули ультиматум, в котором требуют, чтобы наши силы немедленно отступили и Рейнская область оставалась демилитаризованной, в противном случае наши страны будут находиться в состоянии войны."
 germany.65.a:0 "Мы не можем отступать! Рейх должен быть защищен!"
 germany.65.b:0 "Мы не готовы к этому противостоянию. Мы должны отступить."
 germany.66.t:0 "Франция мобилизуется!"
 germany.66.d:0 "Британцы проявили благоразумие и смирились с ремилитаризацией Рейнской области, но безумные французы отказываются уступить! Заявив, что этот инцидент представляет собой прямую угрозу для безопасности их страны, они мобилизуют свои войска и могут в любой момент вторгнуться через границу! Мы в состоянии войны!"
 germany.67.t:0 "Франция отступает"
 germany.67.d:0 "Французы мудро решили отступить, когда поняли, что их безумная затея не получит поддержки со стороны Британии. Их войска демобилизованы, и война пока предотвращена. Черт возьми, это было близко!"
 germany.67.a:0 "Война сейчас была бы безумием."
 germany.68.t:0 "Франция отказывается отступить"
 germany.68.d:0 "Французы упрямо решили сражаться с немцами в одиночку, и наш союз с ними был расторгнут. Из-за бессмысленных ссор разразилась очередная европейская война. Возможно, пришло время Британии снова дистанцироваться от континентальных дел..."
 germany.68.a:0 "Может быть, так и должно было случиться."
 germany.70.t:0 "Заговор Остера"
 germany.70.d:0 "Убежденные, что Гитлер втянул Германию в войну, которую она не может выиграть, группа старших офицеров в составе вермахта совершила переворот! Похоже, что организатором выступил полковник Ганс Остер из Абвера, но генералы Бек, фон Браухич, Гальдер и адмирал Канарис также подтвердили свою причастность!\n\nВооруженные люди, укрывающиеся в нескольких берлинских квартирах, собрались у Рейхсканцелярии с намерением ликвидировать Гитлера и его ближайших соратников. Сейчас внутри здания бушует ожесточенная перестрелка."
 germany.70.a:0 "Защищайте фюрера любой ценой!"
 germany.71.t:0 "Фюрер мертв"
 germany.71.d:0 "Войска СС и лояльные армейские подразделения, бросившиеся к Рейхсканцелярии, сумели убить или захватить всех предателей, но не раньше, чем те успели убить Гитлера! Фюрер был найден с несколькими десятками пулевых ранений, рухнув на свой ​​письменный стол - работая неустанно для Отечества до последнего вздоха, без сомнения!\n\nУцелевшие заговорщики предстанут перед судом за свое гнусное преступление, но на данный момент Германия находится в состоянии войны и нужен новый лидер. Кто станет следующим фюрером?"
 germany.71.a:0 "Герр Гиммлер поведет нас в будущее."
 germany.71.b:0 "Герр Геринг - самый логичный выбор."
 germany.71.c:0 "Пока что Рейхстаг является наиболее логичным выбором."
 germany.72.t:0 "Заговор провалился"
 germany.72.d:0 "Войска СС и верные подразделения армии, прибывшие в Рейхсканцелярию, смогли убить или захватить всех предателей-коммандос, а сам Гитлер с верным \"Люгером\" возглавил зачистку. По счастливой случайности Фюрер вышел из этой схватки лишь с несколькими царапинами.\n\nВыжившие заговорщики заплатят высокую цену за свою измену, а Гитлер с еще большей решимостью готов продолжить войну ради великой победы!"
 germany.72.a:0 "Да здравствует Фюрер!"
 germany.73.t:0 "Заговор успешен"
 germany.73.d:0 "В ходе тяжелых боев в Рейхсканцелярии здание превратилось в горящие руины. Хотя большое количество эсэсовцев бросилось на помощь Гитлеру, верные заговорщикам части армии вмешались в ход событий и обеспечили перелом в бою. Подтверждено, что Фюрер убит, а заговорщики успешно взяли штурмом все правительственные здания в Берлине.\n\nБольшая часть вермахта перешла на сторону заговорщиков, однако многие офицеры остались приверженцами НСДАП. Кому стать их лидером?"
 germany.73.a:0 "Смерть национал-социализму!"
 germany.73.b:0 "Гиммлер исправит ситуацию!"
 germany.73.c:0 "На данном этапе наша единственная надежда — Геринг!"
 germany.74.t:0 "Подготовка почвы"
 germany.74.d:0 "Австрийцы жаждут стать частью германского рейха, но упрямое правительство в Вене до сих пор сопротивлялось всем попыткам объединения. Мы должны усилить поддержку фашизма в Австрии. Тогда Австрийская нацистская партия станет жизнеспособной альтернативой правящим австрофашистам.\n\nAгент абвера был направлен с разведывательной миссией. Используйте его для тайного увеличения народной поддержки фашизма в Австрии."
 germany.74.a:0 "Австрия будет нашей!"
 germany.75.t:0 "Германо-советский договор"
 germany.75.d:0 "Несмотря на предыдущую резкую риторику как против народа, так и против идеологического руководства [Root.GetName], [From.GetLeader] и Германия теперь обратились к нам с просьбой о взаимовыгодном исследовательском договоре. Обмен знаниями поможет нам в разработке новых танков, наряду с обещаниями других исследовательских выгод в будущем, но, учитывая предыдущие заявления, нет никаких сомнений, что немцы делают это в своих собственных интересах. Стоит ли нам заключать соглашение, несмотря на риск поддержки амбиций [From.GetLeader]?"
 germany.75.a:0 "Капиталисты представляют для нас обоих большую угрозу."
 germany.75.b:0 "Мы не дадим фашистам оружие, чтобы уничтожить пролетариат!"
 germany.76.t:0 "Советы приняли германо-советский договор"
 germany.76.d:0 "Наши переговоры с [From.GetName] завершились успехом. Достигнуто соглашение, в рамках которого наши государства будут оказывать друг другу помощь в разработке новых бронетанковых соединений, возможное расширение в будущем на другие исследовательские области."
 germany.76.a:0 "Этот договор станет ступенькой в будущее."
 germany.77.t:0 "Советы отвергли германо-советский договор"
 germany.77.d:0 "Государство [From.GetName] отвергло наше предложение о подписании договора, направленного на продвижение исследований в области бронетанковых соединений в обеих странах, вероятно, из-за страха, что наше превосходное оружие будет использовано против них."
 germany.77.a:0 "Вряд ли теперь они уменьшили эти риски."
 germany.78.t:0 "Германо-совместные авиационные исследования"
 germany.78.d:0 "В соответствии с условиями договора с Германией некоторые из их специальных исследовательских проектов делятся результатами с нашими инженерами. Недавно нам стало известно о революционном прорыве в области радиолокационных технологий, открывшем неожиданные возможности для развития наших исследований в этой области."
 germany.78.a:0 "Обнаружение врага - это первый шаг."
 germany.79.t:0 "Ультиматум от Германии"
 germany.79.d:0 "Греция под властью Германии, [From.GetLeader] оказывает давление на наше правительство, чтобы мы присоединились к ним. Советско-германский союз поставил нас в такое положение, когда нейтралитет больше не является возможным, и теперь из Берлина пришёл ультиматум с требованием уступить наши восточные территории их советским союзникам и присоединиться к ним в том самом пакте, который они используют, чтобы заставить нас это сделать.\n\nХотя мы не можем сохранять нейтралитет, есть и другие варианты. Обращение за помощью к Британии - один, а самооборона - другой. Однако ни один из них не может с уверенностью гарантировать будущее республики."
 germany.79.a:0 "Если мы будем работать с немцами, мы, возможно, сможем вернуть себе другие земли."
 germany.79.b:0 "Мы можем рассчитывать на поддержку Британии, а они - на нас."
 germany.79.c:0 "Если эти деспоты хотят забрать наш дом, им придётся за него побороться."
 germany.80.t:0 "Данциг за Словакию"
 germany.80.d:0 "Германия давно положила глаз на Данциг, стремясь объединить свои территории в Восточной Пруссии с остальной частью германской нации. Дипломаты предупреждали, что может наступить день, когда нам придется выбирать между Данцигом и войной.\n\nКак ни странно, нам представили решение, которое немцы считают более мирным. Они предлагают нам недавно созданное государство Словакия, которое в настоящее время является не более чем марионеточным государством под властью Германии, в обмен на Данциг. \nКакие шаги предпримут немцы, если мы откажемся, неизвестно, но нам была предоставлена возможность урегулировать этот конфликт с некоторыми территориальными приобретениями."
 germany.80.a:0 "Это лучшее предложение, которое мы получим."
 germany.80.b:0 "Мы не отдадим то, что по праву принадлежит нам, за то, что они украли!"
 germany.81.t:0 "Данциг уступлен за Словакию"
 germany.81.d:0 "Польша согласилась на обмен, в котором Данциг будет передан [GER.GetNameDef], в то время как Словакия теперь будет под польским контролем. Благодаря этому соглашению мы вернули Данциг и сохранили сердечные, или, по крайней мере, не откровенно враждебные отношения с нашим восточным соседом."
 germany.81.a:0 "Германия снова едина."
 germany.82.t:0 "[From.GetNameDefCap] отказывается отдавать Данциг"
 germany.82.d:1 "Наше щедрое предложение словацких территорий [From.GetNameDef] в обмен на Данциг было отклонено, из-за чего Данциг остается в польских руках. Очевидно, [From.GetLeader] не разделяет наше понимание того, что Данциг по праву является немецкой территорией. \n[Root.GetLeader] в ярости, и, похоже, дипломатические возможности для возвращения Данцига исчерпаны."
 germany.82.a:0 "Возможно, настало время рассмотреть другие варианты."
 germany.83.t:0 "Антисоветский пакт"
 germany.83.d:0 "Благодаря Антикоминтерновскому пакту, [From.GetNameDef] получил плодотворную почву для сдерживания советской угрозы дипломатическими методами. Однако пакт не предусматривает военный союз и не содержит четко определенных обязательств для подписантов. Теперь [From.GetLeader] стремится расширить пакт до Антисоветской коалиции - обязательного соглашения, предполагающего вступление в войну, если кто-либо из подписантов окажется в состоянии войны с Советским Союзом.\n\nХотя это и намного опаснее и, вероятно, положит конец любой дипломатии, которую мы все еще поддерживаем с Советами, это также наш шанс заручиться поддержкой надежных союзников в случае войны."
 germany.83.a:0 "Мы будем поддерживать Германию и ее союзников против Советов."
 germany.83.b:0 "Кто угодно может начать новую мировую войну таким пактом."
 germany.84.t:0 "Призыв членов пакта к войне"
 germany.84.d:0 "Как мы и предполагали, когда подписывали Антисоветский пакт, мы сейчас находимся в состоянии войны с Советским Союзом. Пришло время нашим соучастникам выполнить свои обещания и присоединиться к нам."
 germany.84.a:0 "Наша дальновидность оправдалась."
 germany.85.t:0 "[From.GetName] Призывает членов пакта к войне"
 germany.85.t.a:0 "[From.GetName] Призывает членов пакта к войне"
 germany.85.t.b:0 "[From.GetName] Активирует гарантию"
 germany.85.d:1 "Антисоветский пакт предусматривает, что все подписавшие его страны должны присоединиться к любому оборонительном конфликту с Советским Союзом. [From.GetName] подвергся нападению со стороны Советов и незамедлительно направил запрос о помощи всем странам-участницам пакта. Пришло время [Root.GetAdjective] продемонстрировать свою преданность делу защиты мира от угрозы со стороны Советского Союза раз и навсегда."
 germany.85.desc.a:0 "Антисоветский пакт предусматривает, что все подписавшие его страны должны присоединиться к любому оборонительном конфликту с Советским Союзом. [From.GetName] подвергся нападению со стороны Советов и незамедлительно направил запрос о помощи всем странам-участницам пакта. Пришло время [Root.GetAdjective] продемонстрировать свою преданность делу защиты мира от угрозы со стороны Советского Союза раз и навсегда."
 germany.85.desc.b:0 "Наша гарантия для [From.GetNameDef] обязывает нас вступить в любой оборонительный конфликт с Советским Союзом. Сейчас они подверглись нападению со стороны Советов, и настало время для нас сдержать нашу часть сделки и немедленно прийти им на помощь. Пришло время [Root.GetAdjective] продемонстрировать верность в защите мира от угрозы со стороны Советского Союза раз и навсегда."
 germany.85.a:2 "[From.GetName] не одинок!"
 germany.85.b:0 "Это не наша война."
 germany.85.b_tt:0 "§YЭто будет расценено как предательство со стороны всех стран, которые чтут пакт (§!§R-50§!§Yмнения)§!"
 germany.86.t:0 "Данциг или война"
 germany.86.d:0 "[GER.GetNameDefCap] давно объявили о своей цели вернуть себе территории, которые они потеряли в Великой войне. В частности, они смотрят на территорию Данцига, которая отделяет Восточную Пруссию от остальной части их страны.\n\nТеперь они потребовали, чтобы Данциг был передан [GER.GetNameDef], и в обмен не предлагают ничего, кроме обещания отказаться от своих претензий на Познань. С учетом угрозы войны принятие предложения отложит возможный конфликт, но ценой будет предоставление немцам большей силы для того, что ждет впереди."
 germany.86.a:0 "Давайте заключим сделку. Может, они обратят свой взор куда-нибудь еще."
 germany.86.b:0 "Данциг останется Гданьском!"
 germany.87.t:0 "Польша уступает Данциг"
 germany.87.d:0 "После нашего ультиматума Польша согласилась уступить нам несправедливо приобретенную территорию, что доказывает, что они должны были знать, что по праву она принадлежит Германии!"
 germany.87.a:0 "Польша избежала войны... пока что."
 germany.88.t:0 "Польша отказывается передать Данциг"
 germany.88.d:0 "Несмотря на наши попытки дать Польше возможность мирно передать Данциг, поклявшись в обмен отказаться от своих претензий на другие немецкие территории, мы столкнулись с отказом. Как и ожидалось, мир ничего нам не дает, мы должны захватить это силой."
 germany.88.a:0 "Они прекрасно знают, что их ждет в противном случае."
 germany.1002.t:0 "Выполнить пакт Молотова-Риббентропа?"
 germany.1002.desc:1 "Германия и [SOU.GetNameDef] уже договорились о разделе Польши на восточную и западную части, однако наша оккупация восточной части несколько осложнила эту договоренность. Хотя наши немецкие союзники полностью ожидают, что мы передадим обещанные польские территории [SOU.GetNameDef], мы могли бы вместо этого нарушить пакт и продолжить нашу оккупацию."
 germany.1002.b:0 "Польша наша!"
 germany.1003.t:0 "[From.GetNameDefCap] нарушает пакт!"
 germany.1003.desc:1 "Несмотря на решение передать восточную Польшу [SOU.GetNameDef], наши союзники в [From.GetNameDef] решили продолжить оккупацию Польши, формально нарушив пакт Молотова-Риббентропа!"
 germany.1003.a:0 "Теперь мы должны заплатить за их наглость."
 china.1.t:0 "Инцидент на мосту Марко Поло"
 china.1.d:0 "Японские солдаты недавно напали на стратегически важный мост Марко Поло, расположенный южнее Пекина, однако они были отброшены нашими отважными воинами. Без сомнений, это спланированное событие, нацеленное на то, чтобы обвинить нас и заставить сдать еще больше территорий – прямо как инцидент в Мукдене, когда японцы вторглись в Маньчжурию. \n\nКак мы должны ответить?"
 china.1.a:0 "Мы достигли точки кипения!"
 china.1.b:0 "Мы вряд ли сможем себе позволить войну с Японией."
 china.2.t:0 "Германия отзывает советников"
 china.2.d:0 "Германия поддалась дипломатическому давлению Японии и решила отозвать своих военных советников из нашей страны! На прощальном ужине фон Фалькенхаузен пообещал, что не раскроет японцам ни одного из наших военных планов, но окончание поддержки со стороны Германии несомненно ударит по нашей армии."
 china.2.a:0 "Нам придется справляться без них."
 china.3.t:0 "Напряженные китайско-немецкие отношения"
 china.3.d:0 "Ухудшение отношений с Германией привело к тому, что она отозвала всех своих военных советников из нашей страны."
 china.3.a:0 "Китайские офицеры закончат то, что они начали!"
 china.4.t:0 "Военные советники задержаны"
 china.4.d:0 "Поскольку мы сейчас находимся в состоянии войны с Германией, все их военные советники, присутствовавшие в нашей стране, были задержаны. Фон Фалькенхаузену и нескольким его сообщникам удалось ускользнуть от нас и вернуться в Европу!"
 china.4.a:0 "Так им и надо!"
 china.5.t:0 "Больше не в ловушке"
 china.5.d:0 "Красная армия когда-то выживала в том, что казалось безнадёжностью, но со времён Великого похода несколько лет назад медленно переломила ход событий. Значительное продвижение по территории оставило нашу роль неполноценных в прошлом. Пройдя сквозь это время борьбы, отчаяние осталось позади. Мао Цзэдун превратился из лидера партизанской армии в председателя."
 china.5.a:0 "Да здравствует Народная Республика!"
 china.6.t:0 "Подготовка к атаке на коммунистов"
 china.6.d:0 "После долгого отступления Красной армии Коммунистической партии Китая, она сумела перегруппироваться и обосноваться в Шэньси. Её постоянные усилия, направленные на то, чтобы настроить сельское население против нас, и попытки добиться поддержки со стороны Советского Союза, говорят о том, что она может стать ещё могущественнее, если оставить её в покое. Тем не менее, многие из окружающих военачальников, несмотря на то, что они поддерживают наше правительство, не желают или не могут пойти на необходимые жертвы для эффективного наступления.\n\nВ настоящее время неясно, восстанавливается ли Красная армия или готова к битве с нами, но время не на нашей стороне. Чтобы укрепить свои политические позиции, мы должны нанести удар по коммунистам."
 china.6.a:0 "Принудить местных военачальников начать наступление."
 china.6.b:0 "Завербовать местных правонарушителей, чтобы они сражались за нас."
 china.6.c:0 "Положиться на местных волонтёров, которые выступают против коммунистов."
 china.6.tt:0 "§YЕсли КНР решит противостоять атаке:§!\n"
 china.6.tt_2:0 "§YЕсли КНР решит отступить:§!\n"
 china.7.t:0 "Гоминьдан готовится к наступлению"
 china.7.d:0 "Хотя нам и удалось спастись от поражения во время Великого похода, националисты не собираются позволять нам окрепнуть без дальнейших столкновений. Наши шпионы сообщают, что они готовят против нас наступление, которое может ослабить нашу политическую поддержку, если мы попробуем отступить дальше.\n\nМы не знаем, насколько гоминьдан решительно настроен оттеснить нас назад. Попытка противостоять им сопряжена со значительными рисками. Если местные милитаристы будут поддержать атаку, наши шансы могут быть невелики. С другой стороны, отступать сейчас, когда мы, наконец, остановились, может быть не лучшим вариантом."
 china.7.a:0 "Противостоять атаке любыми доступными нам средствами!"
 china.7.b:0 "Отступить в изоляцию."
 china.8.t:0 "Отступление коммунистов"
 china.8.d:0 "Узнав о нашем планируемом наступлении через свою местную шпионскую сеть, КПК отвели свою Красную армию дальше в Шэньси. Хотя это и лишило нас возможности ослабить их численность, это показало, что коммунисты не готовы противостоять нам, несмотря на их пропаганду. В некоторой степени наши усилия все же принесли нам пользу."
 china.8.a:0 "Трус!"
 china.9.t:0 "Победа над коммунистами"
 china.9.d:0 "Наши усилия по обращению в бегство Красной армии увенчались успехом, по крайней мере на данный момент. Несмотря на получение информации о нападении, коммунисты решили противостоять нашим силам и проиграли. Теперь они вынуждены отступить, и многие местные жители начали сомневаться в их способности сдержать обещания по свержению нашего правительства."
 china.9.a:0 "И правильно!"
 china.10.t:0 "Коммунисты отразили атаку"
 china.10.d:0 "Получив заранее информацию о наших планах начать наступление, Красная армия подготовилась и отразила наше нападение. Войск, которые мы смогли собрать в этой местности, где наша база слаба, оказалось недостаточно, чтобы победить коммунистические силы. \nК сожалению, атака обернулась против нас и была расценена как признак восстановления Красной армии после их длительного отступления."
 china.10.a:0 "В конечном итоге это им не поможет."
 china.11.t:0 "Поражение от Гоминьдана"
 china.11.d:0 "Несмотря на наши максимальные усилия отразить атаку собранных на местах войск, поддерживающих националистическое правительство, наших приготовлений оказалось недостаточно. С существенными потерями мы вынуждены были снова отступить, хотя и на более короткое расстояние.\n\nВозможно, противостояние националистам до нашего полного восстановления было ошибкой. Наше великолепное восстановление в Великом походе вселило надежду в наших сторонников, но теперь посеяны семена сомнения."
 china.11.a:0 "Мы восстановимся и вновь завоюем веру людей."
 china.12.t:0 "Победа над Гоминьданом"
 china.12.d:0 "Сопротивление наступлению Гоминьдана сработало в нашу пользу. Собранные на месте войска, отправленные на встречу Красной Армии, не были готовы к нашим знаниям о надвигающемся нападении и были разбиты, все они служили предупреждением для соседних военачальников, что нападение на нас может быть дорогостоящим.\n\nНационалисты только доказали, что недооценивают нас как врага, и что Народная Республика снова поднимается."
 china.12.a:0 "Политическая власть растет из дула ружья."
 china.13.t:0 "Столкновение с коммунистическими партизанами"
 china.13.d:0 "В то время как мы и Китайская Красная Армия едва оправились от нашего предыдущего наступления, наше взаимное присутствие войск вблизи границы возобновило конфликт. В дополнение к местным военачальникам и ополчению мы рассмотрели возможность переброски большего количества войск из других мест.\n\nХотя это может и не дать нам возможности раздавить коммунистическую угрозу раз и навсегда, это будет важной идеологической победой, чтобы показать, что им не будет позволено расширяться дальше."
 china.13.a:0 "Мы должны провести границу сейчас!"
 china.13.b:0 "Мы не можем позволить себе еще одно противостояние."
 china.14.t:0 "Поражение в [From.GetName]"
 china.14.d:0 "Несмотря на наши усилия по выталкиванию, мы должны показать, что коммунистам не будет позволено расширять свое влияние за пределами того места, где они нашли убежище. Мы не могли позволить себе выделить достаточно ресурсов для победы в конфликте вдоль границы [From.GetName]. \n\nОтдельные конфликты с коммунистическими ополченцами постепенно становились все более благоприятными для них, что в итоге привело к провалу кампании в демонстрации того, что мы контролируем ситуацию. Если их народная поддержка продолжит расти, коммунисты могут стать реальной угрозой."
 china.14.a:0 "Беспокоит."
 china.15.t:0 "Победа в [From.From.GetName]"
 china.15.d:0 "После нескольких мелких стычек на окраинах нашей контролируемой территории конфликт с Гоминьданом, похоже, повернулся в нашу пользу. Хотя постоянное давление было тяжелым для наших войск и снабжения, усилия были того стоили. \n\nРешающие битвы не проводились. На этот раз мы одержали медленную победу, которая укрепила веру в наше дело и снова раздула пламя революции."
 china.15.a:0 "Это не будет скоро забыто!"
 china.16.t:0 "Поражение в [From.GetName]"
 china.16.d:0 "Наши усилия вести опосредованную войну против усилившегося присутствия Гоминьдана оказались катастрофическими. Националисты были просто более преданы делу нашего оттеснения, чем мы думали, возможно, ожидая, какое влияние этот провал окажет на нашу репутацию. Хотя наша армия снова может восстанавливаться, сейчас местные жители не оставили потери без внимания, и слухи о неудаче революции уже распространяются в соседних деревнях."
 china.16.a:0 "Революция далека от смерти!"
 china.17.t:0 "Победа в [From.From.GetName]"
 china.17.d:0 "Наши усилия по проведению границы против угрозы коммунизма увенчались успехом. Партизанские кампании КПК в ответ на наше усиленное присутствие войск в регионах, окружающих их базу, не смогли предвидеть нашу решимость остановить их. Эта демонстрация силы, хотя и не без потерь, убедила многих местных жителей, которые ранее оказывали молчаливую поддержку [From.GetLeader] и его партии, теперь начали понимать, что Китай никогда не сможет быть объединен под такой идеологией."
 china.17.a:0 "Давайте надеяться, что они запомнят."
 china.18.t:0 "Столкновение с армией националистов"
 china.18.d:0 "В то время как мы все еще едва оправились от их предыдущего наступления, националисты, похоже, увеличивают свое присутствие войск в районах, близких к нашей границе. Очевидно, они пытаются показать, что снова сдерживают нас, и что Великий поход лишь задержал их последний удар по КПК. Мы не можем позволить людям думать, что это правда."
 china.18.a:0 "Мы не можем позволить себе тратить время на восстановление."
 china.100.t:0 "Китай снова подвергается нападению"
 china.100.d:0 "Как кот, Япония продвигается и берет Корею. Они пытались унизить нас своими двадцатью одним требованием, они оккупируют Маньчжурию, и теперь они снова продвигаются. Довольно, Китай будет бороться до последнего, чтобы быть свободным. В своем выступлении перед народом [Root.GetLeader] призвал всех [Root.GetAdjective] к тому, чтобы они держались вместе, иначе они столкнутся с определенной гибелью."
 china.100.a:0 "За Китай!"
 china.101.t:0 "Китай подвергается нападению"
 china.101.d:0 "Пришло время нам объединиться против нашего общего врага - японцев. Давайте оставим мелкие распри и будем сражаться как сильный, единый Китай!"
 china.101.a:0 "Вместе мы сильны!"
 china.101.b:0 "Мы должны отбиваться от захватчиков!"
 china.102.t:0 "Китай подвергается нападению"
 china.102.d:0 "В связи с тем, что Советский Союз занят войной с Германией, нам сообщили, что он больше не сможет обеспечить такую же степень защиты, как раньше. Будет в наших интересах заручиться поддержкой Гоминьдана и присоединиться к ним в их войне против Японии."
 china.102.a:0 "Мы сильны в единстве!"
 china.102.b:0 "Сразимся вместе с японской угрозой."
 china.102.c:0 "Наши интересы лучше всего защитит могучий Совет."
 china.103.t:0 "Единый Китай"
 china.103.d:0 "[From.GetName] решил присоединиться к нам в борьбе против японцев. Вместе мы изгоним захватчика."
 china.103.a:0 "Мы сильны в единстве!"
 china.104.t:0 "На Китай напали"
 china.104.d:0 "На Китай напали. Военачальники откладывают обиды в сторону, чтобы сражаться с вторгшимися японскими войсками. Это возможность продвинуть интересы КПК, мы можем показать жителям Китая, что именно мы, а не декадентский Гоминьдан, являемся истинным будущим для Китая. Следует ли нам тоже вступить в бой и обеспечить будущее Китая?"
 china.104_PRC_SOV_reinforcements:0 "Получит 10 дивизий от СССР."
 china.104.a:0 "Мы сильны в единстве!"
 china.104.b:0 "Им придётся справиться с Японией без нашей помощи."
 china.104.tt:0 "\nСеверный Китай и Маньчжурия теперь могут быть освобождены во имя [Root.GetName].\n"
 china.105.t:0 "Единый Китай"
 china.105.d:0 "[From.GetName] хочет, чтобы мы объединили силы в борьбе против Японии. Они уже присоединились к [From.GetFactionName] и готовы отложить старые обиды, чтобы выступить против вторжения японцев."
 china.105.a:0 "Мы сильны в единстве!"
 china.105.b:0 "Мы позволим им взять на себя некоторую власть в нашей стране во время грядущей войны."
 china.106.t:0 "Единый Китай"
 china.106.d:0 "[From.GetName] присоединился к [Root.GetFactionName] и готовы сражаться."
 china.106.a:0 "Мы выгоним японских чертей с нашей земли"
 china.107.t:0 "Больше не едины"
 china.107.d_PRC_joined:0 "[Root.GetFactionName] отслужил свое. Больше нет врага, против которого нужно быть едиными. Мао Цзэдун укрепляет свою власть над территориями в Северном Китае. Однако какая у них будет надежда против наших победоносных армий."
 china.107.d_PRC_refused:0 "С окончанием войны победили настоящие патриоты. Пришло время свести счеты с теми, кто прятался, пока мы истекали кровью."
 china.107_tt:0 "@PRC §YКитайская Народная Республика§! берет под контроль китайские государства в §YСеверном Китае§! и §YМаньчжурии§!\n"
 china.107.a:0 "У нас больше нет общего врага"
 china.108.t:0 "Коммунизм продвигается"
 china.108.d:0 "Наша роль в борьбе с ненавистными японскими собаками дала КПК большой престиж. Все больше и больше людей видят, что мы — будущее Китая, особенно в сравнении с коррумпированным Гоминьданом. Кадры партии уже организуют этих людей в новую армию, которая поплывет по крестьянскому морю."
 china.108.a:0 "Мы должны усилить наши ряды"
 china.108_PRC_SOV_reinforcements_2:0 "Получить 20 дивизий"
 china.109.t:0 "Битва за Китай!"
 china.109_tt:0 "§YПолучение требований на материковый Китай§!\n"
 china.109.d:0 "Время очистить Китай от недуга Гоминьдана. Мы освободим каждого китайца и объединим народ под мудрым руководством Мао."
 china.109.a:0 "На войну!"
 china.110.t:0 "[From.GetName] объявляет войну"
 china.110.d:0 "[From.GetName] и кабинет [From.GetLeader] объявили нам войну."
 china.110.a:0 "На войну!"
 china.111.t:0 "Больше не едины"
 china.111.d:0 "[Root.GetFactionName] отжила свое. Больше нет врагов, против которых нужно было бы держаться вместе. Мы мудро использовали время для того, чтобы выстроить нашу поддержку по всему Северному Китаю и Маньчжурии, и теперь настало время официально установить наш контроль в этом регионе."
 china.111.a:0 "Больше у нас нет общего врага"
 china.200.t:0 "Присоединение к Китайской Народной Республике"
 china.200.d:0 "Разорвав с националистическим Гоминьданом, чтобы освободить народ, мы должны теперь объединить усилия с существующей Китайской Народной Республикой, чтобы избежать раздробленности движения. Враги Китая всегда рассчитывали на наши междоусобицы, чтобы нас ослабить. Новое социалистическое государство не совершит такой ошибки!"
 china.200.a:0 "В единстве победим националистов!"
 china.201.t:0 "Коммунистические повстанцы присоединяются к республике"
 china.201.d:0 "Освободившись от националистического контроля, китайские революционеры, сочувствующие нашему делу, приняли решение объединить свое государство с нашим под руководством [Root.GetLeader]. Отныне и вовеки веков будет единая Китайская Народная Республика."
 china.201.a:0 "Мы должны присоединиться, чтобы защитить наших товарищей!"
 china.202.t:0 "Коммунистические восстания в [CHI_communist_state.GetName]"
 china.202.d:0 "Растущая поддержка коммунистов в [CHI_communist_state.GetName] достигла критической точки. Государственные учреждения захвачены, и повстанцы заявили, что они больше не считают себя частью [Root.GetName]. Мы фактически потеряли весь контроль над [CHI_communist_state.GetName] в пользу коммунистического режима."
 china.202.a:0 "Мы должны подавить эту коммунистическую угрозу!"
 china.203.t:0 "Коммунистические восстания в [CHI_communist_state.GetName]"
 china.203.d:0 "Освободившись от националистического контроля, китайские революционеры, сочувствующие нашему делу, приняли решение присоединить свое государство к нашему под руководством [Root.GetLeader]. Отныне и навсегда будет один объединенный [Root.GetName]."
 china.203.a:0 "Мы приветствуем наших братьев-коммунистов!"
 china.204.t:0 "Столица [Root.GetAdjective]"
 china.204.d:0 "С окончанием гражданской войны в Китае нам пора консолидировать власть в Китае и показать народу, что мы являемся современным воплощением Поднебесной. Мы государство, которое поведет их в будущее.\n\nДля этой цели у нас должна быть столица, соответствующая нашему великому государству."
 china.204.a:0 "Мы будем править из старой Северной столицы."
 china.204.b:0 "Мы будем править из старой Южной столицы."
 china.204.c:0 "Нет необходимости переносить столицу."
 CHI_nanjing_tt:0 "Перенос столицы в §YNанкин§!."
 CHI_no_united_front:0 "Не будет никакого сотрудничества против внешних угроз."
 spain_extra.1.t:0 "Технологический прогресс"
 spain_extra.1.desc:0 "Наша кровопролитная гражданская война наконец-то закончилась. Наши союзники, которые помогали нам во всех смыслах во время этой войны, также сотрудничали с нами технологически. В результате, благодаря им мы научились и смогли изготавливать несколько технологических машин, что окажет нам большую помощь."
 spain_extra.1.a:0 "Полезный"
 spanish_civil_war:1 "Началась испанская гражданская война"
 spain.1.t:0 "Гражданская война!"
 spain.1.d:0 "Группа могущественных генералов Вооруженных сил выступила с заявлением, осуждающим нынешнее правительство Испании! Они осуществили правосторонний переворот при поддержке консервативных монархистов и духовенства. Значительная часть военных встала на сторону этих националистов, но пока им не удалось захватить ни одного из крупных городов Испании, за исключением Севильи.\n\nМежду тем левые добровольцы стекаются под знамена республиканского правительства, готовые поддержать его в борьбе с мятежниками. Эти лоялисты могут быть плохо обучены, но никто не может усомниться в их энтузиазме.\n\nРубежи битвы очерчены - какую фракцию мы должны поддержать?"
 spain.1.a:0 "Националисты!"
 spain.1.b:0 "Республиканцы!"
 spain.10.d:1 "После мирных выборов генерала Франсиско Франко на пост президента Испании появилась надежда, что недавние годы жестоких восстаний и политических потрясений подойдут к концу. Слухи о том, что Франко попытается создать однопартийную диктатуру с самим собой в качестве главы государства, были подогреты внезапным исчезновением нескольких лидеров оппозиции.\nПосле скорого суда офицер карабинеров Хосе Галанфор был осужден за государственную измену, и вскоре после этого последовала его публичная казнь. Хотя это было задумано как шаг к тому, чтобы подавить всякое желание сопротивляться подъему националистической Испании, это возымело противоположный эффект. Левые добровольцы и даже группа генералов стекаются под знамена недавно сформированной Народной Армии, готовые поддержать борьбу против угнетателей-националистов. Хотя большинство из них плохо обучены, им удалось захватить несколько ключевых городов в хаосе, последовавшем за восстанием.\n\nЛиния фронта была прочерчена - какую фракцию мы должны поддержать?"
 spain.10.b:0 "Народную Армию!"
 nationalists_chosen:1 "Смерть Рохо!\n"
 republicans_chosen:1 "Смерть фалангистам!\n"
 spain.2.t:0 "Искать международную поддержку?"
 spain.2.d:0 "Переворот оказался не вполне удачным, но карлистам, фалангистам и Конфедерации автономных правых удалось мобилизовать большую часть армии с целью свержения Республики, которая слишком долго позволяла нашему славному христианскому народу ввергать себя в пучину анархии. Исход по-прежнему не ясен, и весь мир с тревогой наблюдает, какая сторона выйдет победительницей.\n\nТем не менее, мы подняли этот мятеж не для того, чтобы сидеть сложа руки, и точно так же не должен поступать весь мир, если он желает раздавить красную угрозу. Другие страны, идущие по тому же пути восстановления своей национальной гордости, должны быть готовы прийти нам на помощь."
 spain.2.a:0 "Запросить вооружение и боеприпасы."
 spain.2.b:0 "Испания должна быть освобождена кровью испанцев!"
 spain.3.d:0 "Реакционные и фашистские силы в армии попытались одним решительным ударом сокрушить Республику, но не ожидали такого сопротивления в крупных городах и такой быстрой мобилизации рабочих ополченцев. Вместо переворота они развязали войну, войну против прогресса и против того будущего, которое желал испанский народ.\n\nДемократические и социалистические государства единодушно выразили поддержку Республике, но немногие осмеливаются ввязываться в этот конфликт напрямую. Мы могли бы попросить их поддержать наше начинание, или угнетатели придут и за их свободой и солидарностью."
 spain.3.a:0 "Это международная борьба против фашизма!"
 spain.3.b:0 "Мы не станем марионетками этих вырожденческих рабочих государств!"
 spain.4.t:0 "Националистическая Испания просит о помощи"
 spain.4.d:0 "Гражданская война в Испании стала своего рода отражением нашего взгляда на ситуацию в мире: коммунисты и либералы стремятся разрушить старые ценности, а мы взялись за оружие, чтобы возродить их. Неудивительно, что националисты в Испании обратились к нам и другим, чтобы мы снабдили их для предстоящего конфликта."
 spain.4.a:0 "Мы обещаем послать все, что сможем."
 spain.4.b:0 "Если им не хватает сил, чтобы захватить власть, значит, они ее не заслуживают."
 spain.5.t:0 "Республиканская Испания нуждается в нашей помощи"
 spain.5.d:0 "Попытка свергнуть Вторую Испанскую республику - явный признак того, что фашисты не позволят цветам прогресса цвести даже там, где они естественным образом укореняются. Республиканцы и их союзники, смесь демократов, коммунистов и анархистов, обратились к нам и другим частям международного сообщества за помощью. Многие нации, заявляющие, что защищают демократию и свободу, отказали в своей поддержке из страха быть втянутыми в войну. Как нам отреагировать?"
 spain.5.a:0 "Обещать им отправку оружия и техники."
 spain.4.a.tt:0 "[From.GetName] будет благодарен, если мы организуем ленд-лиз во время войны."
 spain.5.b:0 "К сожалению, мы не можем позволить себе вмешаться."
 spain.6.t:0 "Националистическая Испания ценит нашу помощь"
 spain.6.d:0 "Наш ленд-лиз в националистическую Испанию не остался незамеченным. Если они выйдут победителями, мы можем получить сильного союзника, когда Испания будет восстановлена."
 spain.6.a:0 "Будем надеяться, что они обуздают красный террор."
 spain.7.t:0 "Республиканская Испания благодарит за нашу помощь"
 spain.7.d:0 "Наша помощь республиканской Испании не осталась незамеченной. Если республика будет восстановлена, мы можем рассчитывать на её поддержку в наших дальнейших усилиях по очищению мира от фашистской грязи"
 spain.7.a:0 "Да здравствует республика!"
 spain.8.t:0 "Мадрид отвоёван"
 spain.8.d:0 "Война выиграна. Мадрид снова наш, и у нас есть возможность снова сделать этот древний город центром Испании. Он видел много битв и нуждается в восстановлении. Разве есть лучший способ сделать это, чем сделать его нашей столицей?"
 spain.8.a:0 "Перенести столицу в Мадрид"
 spain.8.b:0 "Сохранить текущее местоположение"
 spain.9.t:0 "Испанские выборы 1936 года"
 spain.9.d:1 "Вторая республика оказалась хрупкой конструкцией. [Root.GetLeader] может стать президентом при поддержке Народного фронта, широкой коалиции левых групп, поддерживаемой республиканцами, коммунистами и анархистами.\n\nНо правая оппозиция, объединяющая консерваторов, монархистов и фашистов, также начинает объединяться для свержения Народного фронта. Какая бы коалиция ни развалилась, их противники, вероятно, воспользуются их внутренними конфликтами, чтобы начать революцию. Эти выборы не являются окончательным испытанием, которое Испания должна будет пройти для разрешения этого конфликта"
 spain.9.a:0 "Поддержать Народный фронт"
 spain.9.b:0 "Объединить консервативные группы под руководством фалангистов"
 italy.9.t:0 "Попросить Балеарские острова у Испании"
 italy.9.d:0 "Во время гражданской войны Италия поставляла добровольцев, сражавшихся на стороне националистов. Несмотря на то, что главным являлась идеологическая мотивация, для Италии исход событий также представлял и стратегический интерес. Оборону Балеарских островов, особенно Майорки, Италия считала важнейшей, поскольку их положение в Средиземном море открывало путь к западноевропейским колониям.\n\nТеперь [From.GetLeader] предложил передать острова во владение Италии на постоянной основе. С учётом их вклада в нашу победу, стоит прислушаться к этому предложению."
 italy.9.a:0 "Пусть итальянцы оставят то, что они защитили."
 italy.9.b:0 "Мы выиграли эту войну не для того, чтобы прогибаться под иностранными требованиями!"
 italy.10.t:0 "Испания передала Балеарские острова"
 italy.10.d:0 "В знак благодарности за нашу поддержку и защиту интересов фашистов во время гражданской войны в Испании [From.GetLeader] согласился передать во владение Италии наши временные военные укрепления на Майорке, Менорке и Ибице. И хотя эти острова с их важной стратегической позицией станут достойным пополнением нашей империи, по-видимому, испанцы теперь считают долг выплаченным."
 italy.10.a:0 "Пока они признают, что мы являемся законными владельцами."
 italy.11.t:0 "Испания отказалась отдать острова"
 italy.11.d:0 "Несмотря на помощь, которую мы им оказали в гражданской войне, [From.GetLeader] теперь отказывается передать нам Балеарские острова, которые наши соотечественники защищали кровью. Хотя они настаивают на том, что хотят поддерживать хорошие отношения с нашей нацией, вынуждая нас вывести военные объекты, которые изначально сохранили эти острова испанскими, — это оскорбление, которое мы не забудем."
 italy.11.a:0 "Если возникнет необходимость, мы все равно сможем на них претендовать."
 italy.12.t:0 "Лондонская конференция"
 italy.12.d:0 "Наши друзья в Югославии попали под давление нашего северного соседа. Коррумпированные и разложившиеся западные державы показали, почему они слабеют, не сумев отстоять права Югославии. Это может стать прекрасным шансом для более молодой, более энергичной державы, у которой есть достойное руководство, чтобы смело выйти на мировую арену! Командование спецназа сообщает, что они почти готовы выпустить на свободу наши непобедимые легионы."
 italy.12.a:0 "Это наш звездный час!"
 italy.12.b:0 "Будет и более подходящее время."
 italy.13.t:0 "Первое решение по Любляне"
 italy.13.d_dalmatia_montenegro:0 "Поскольку югославское государство рушится из-за своих внутренних противоречий, Италии пора получить то, что ей причитается. Угасающие западные державы, возможно, настолько боятся Италии, что откажут ей в ее праве, но на подъеме новые силы, которые видят истинную ценность Италии. Мы не только защитили то, что было нам отказано в Урезанной победе, но и наш протекторат над Албанией также расширил свои территории."
 italy.13.d_montenegro:0 "Наше решение объединиться с Германией, набирающей силу, окупилось. Югославское государство движется к роспуску, и немецкое руководство дальновидно понимает преимущества дружбы с Италией. Черногория будет передана Албании, как это и должно быть."
 italy.13.d_dalmatia:0 "После предательства наших бывших союзников на Западе на Парижской мирной конференции, где нам обещали северную Далмацию, мы решили объединиться с Берлином. Германия мудро рассудила, что дружба с Италией слишком ценна, чтобы ее игнорировать, и наши притязания в Югославии должны быть признаны. Адриатика станет итальянским озером, и справедливость восторжествует."
 italy.13.a:0 "Восстание Италии"
 italy.14.t:0 "Германия мешает нашим требованиям"
 italy.14.d:0 "Германия сочла уместным помешать нашим скромным, справедливым и разумным требованиям к территории Виши. Стоит ли нам покинуть [From.GetFactionName]?"
 italy.14.a:0 "Неприемлемо. Мы можем добиться большего в одиночку"
 italy.14.b:0 "Мы заслужим их уважение"
 italy.15.t:0 "Германия поддерживает наши требования"
 italy.15.d:0 "Германия увидела мудрость в поддержке наших требований к территории Виши. Виши передал нам Савойю и Корсику."
 italy.15.d_Corsica:0 "С небольшой помощью Германии Виши передал нам Корсику"
 italy.15.a:0 "Месть за Италию"
 italy.16.t:0 "Германия почти поддерживает нас"
 italy.16.d:0 "Германия сочла уместным вмешаться в наш спор с Францией Виши. Они заблокировали нашу попытку захватить Корсику, но у нас все еще есть Савойя."
 italy.16.a:0 "Корсиканский вопрос всего лишь отложен"
 france.1.t:0 "Япония требует Индокитай"
 france.1.d:0 "Японские войска выстроились на границах нашей колонии в Индокитае и требуют полного доступа к нашим базам и сооружениям! Если мы согласимся на их просьбу, то фактически подпишем документ о передаче им контроля над Индокитаем. С другой стороны, средств, чтобы бороться с ними по этому вопросу, у нас нет."
 france.1.a:0 "У нас нет выбора, кроме как согласиться."
 france.1.b:0 "Ни за что!"
 france.2.t:0 "Расширение линии Мажино"
 france.2.d:0 "Были завершены планы по расширению линии Мажино до самого Ла-Манша и размещены заказы на строительство. Бельгийцы подали официальный протест, увидев наши приготовления на другой стороне границы, но работы продолжаются."
 france.2.a:0 "Возможно, им не стоило выходить из нашего альянса."
 france.3.t:0 "Расширение Альпийской линии"
 france.3.d:0 "Мы приступили к улучшению укреплений Альпийской линии. Когда эти новые оборонительные сооружения будут завершены, итальянцы должны сойти с ума, чтобы пересечь границу!"
 france.3.a:0 "Пусть идут!"
 france.10.t:0 "Поражение"
 france.10.d:0 "Битва проиграна. Париж пал под натиском Германии, и теперь это всего лишь вопрос времени, когда остальная часть страны будет оккупирована. Теперь нам нужно думать о будущем. Часть правительства хочет перемирия с Германией, но многие офицеры желают продолжить борьбу из Британии.\n\nНекоторые члены британского военного кабинета предложили другой вариант - объединить Францию и Великобританию в единую нацию, которая будет сражаться, пока вся Франция не будет освобождена."
 france.10.a:0 "Мы должны сотрудничать с немцами."
 france.10.a_tt:0 "§YИграйте за Францию Виши, если Германия предоставит перемирие§!\n"
 france.10.b:0 "Борьба продолжается!"
 france.10.b_tt:0 "§YИграйте за Францию, если Германия предоставит перемирие§!\n"
 france.10.c:0 "Давайте объединимся с Британией!"
 france.11.t:0 "Франция предлагает объединение"
 france.11.d:0 "Ситуация во Франции ужасна. Многие в их правительстве хотят заключить перемирие с Германией, но некоторые положительно отреагировали на предложение членов британского военного кабинета об объединении наших двух стран в одну. Этот франко-британский союз продолжит борьбу против немцев до тех пор, пока не будет достигнута победа. Как нам следует ответить?"
 france.11.a:0 "Нет, Британия - это Британия, а Франция - это Франция."
 france.11.b:0 "Да, если это заставит французов продолжить бой!"
 france.12.t:0 "Британия согласна на союз"
 france.12.d:0 "Британия согласилась объединить наши две нации в одну. Уже сейчас в Лондоне формируется новое совместное правительство."
 france.12.a:0 "В Лондон!"
 FRA_franco_british_cores:0 "Все §Y[FRA.GetAdjective] ядра§! становятся §Y[ENG.GetAdjective] ядрами§!."
 france.13.t:0 "Британия отвергает объединение"
 france.13.d:0 "Британское правительство отвергло возможность слияния наших двух стран в одну. В этот момент неизбежно перемирие с Германией."
 france.13.a:0 "Мы должны сотрудничать"
 france.13.b:0 "Мы должны продолжать сражаться!"
 france.14.t:0 "Триумф во Франции"
 france.14.d:0 "Наша победа во Франции почти завершена. Французское правительство запросило перемирия, и наши дипломаты подготовили условия, с которыми оно согласилось. Они сохранят контроль над югом Франции, в то время как мы сможем оккупировать остальную часть."
 france.14.a:0 "Создать Вишистскую Францию"
 establishing_vichy_tt:1 "§YVichy France§! будет создана в Южной Франции.\n§YVichy France§! получит все §Yфранцузские колониальные территории§!\nПроцент §Yфранцузских§! сил будет переведен в §YVichy France§!\n(§YVichy France§!):\n §YMouvement Franciste§! становится правящей партией.\n §YPhilippe Pétain§! становится лидером §Yфашистской§! партии.\n Получает Национальный Дух §YРасходы на оккупацию§!, который дает (Фабрики потребительских товаров: §Y20%§!)\n Переносит столицу в §YAuvergne§!"
 france.14.b:0 "Нет, Германия покорит всех!"
 france.14.c:0 "Создать Бурбонскую Францию"
 france.15.t:0 "Германия отклоняет перемирие!"
 france.15.d:0 "Немцы отклонили наш запрос на перемирие! Очевидно, они стремятся поработить нас всех... у нас нет выбора, кроме как сражаться до конца!"
 france.15.a:0 "Мы обречены!"
 france.16.t:0 "Держитесь вместе, будьте сильными!"
 france.16.d:0 "В свете недавних событий в Париже, которые затронули большинство из нас, для нас как для нации важнее, чем когда-либо, объединиться. Мы должны посмотреть на состояние нашей страны и не принять его, а изменить исход этой войны.\n\nЗабудьте о прошлом и смотрите в новую сторону. Мы не знаем, чего ожидать в следующие месяцы, но мы встретим это вместе!"
 france.16.a:0 "Мы пережили и не такое!"
 france.17.t:0 "Приглашение во Французскую фракцию"
 france.17.d:0 "Для укрепления Малой Антанты — Чехословакии, Югославии и Румынии — и удержания возможного возрождения агрессивного экспансионизма со стороны бывших Центральных Держав, Франция попросила, чтобы мы присоединились к ним в альянсе, направленном на объединение этих наций."
 france.17.a:0 "Рады. Малую Антанту нужно восстановить."
 france.17.b:0 "[Root.GetName] идёт своим путём."
 france.18.t:0 "[From.GetName] присоединяется к Французской фракции"
 france.18.d:0 "Наш план, направленный на то, чтобы альянс Малой Антанты не распался и не ушёл от нас, воплощается в жизнь. [From.GetLeader] одобряет наши усилия и принял наше приглашение в альянс."
 france.18.a:0 "Мы на один шаг ближе к восстановлению Малой Антанты."
 france.19.t:0 "[From.GetName] отвергает Французский альянс"
 france.19.d:0 "Несмотря на наши усилия по оказанию поддержки Малой Антанте, наша последняя попытка протянуть руку помощи одной из стран была встречена скептицизмом. [From.GetLeader] отказался присоединиться к альянсу, возможно, усомнившись в наших мотивах или, возможно, опасаясь, что чрезмерно тесное сближение с нами сделает их мишенью."
 france.19.a:0 "Они уже могут быть мишенью для кого-то, насколько им известно!"
 france.20.t:0 "Сопротивление перемирию"
 france.20.d:0 "Вслед за перемирием между Францией и Германией и созданием нового правительства во Франции, группа высокопоставленных офицеров подняла восстание против нового французского правительства. Шарль де Голль выступил с обращением по радио, призывая к сопротивлению коллаборационистскому режиму Виши. Фактически де Голль берет на себя руководство Свободными французскими войсками и продолжает борьбу с немцами."
 france.20.a:0 "Борьба за Францию продолжается."
 france.20.a_tt:0 "§YШарль де Голль становится лидером Франции§!"
 france.21.t:0 "Рабочие угрожают забастовками"
 france.21.d:0 "После увольнения двух рабочих на крупном заводе по всей стране вспыхнули столкновения между рабочими и владельцами фабрик. Рабочие, поддерживаемые [Root.GetCommunistParty], организовались и требуют улучшения условий, таких как более высокая заработная плата и сокращение рабочей недели. Это значительно снизит производительность наших заводов и рассматривается как победа [Root.GetCommunistParty]. Нас приглашают в Матиньон на переговоры. Подадимся ли мы их требованиям или останемся твердыми и рискуем nationwide strike?"
 france.21.a:0 "Пусть бастуют"
 france.21.b:0 "Договориться о сделке"
 france.22.t:0 "Пересмотреть Матиньонские соглашения"
 france.22.d:0 "После подписания Матиньонских соглашений у нашей промышленности нет возможности конкурировать с немецкой. С каждым днем мы отстаем в производственных мощностях. Некоторые владельцы фабрик уже начали пересматривать некоторые из прав, предоставленных Матиньонскими соглашениями, почти без сопротивления со стороны рабочих. У нас есть возможность официально отозвать недавно полученные права рабочих по всей стране, но рискуем, что они снова сплотятся вокруг [Root.GetCommunistParty] в надежде, что они поддержат еще одну забастовку. Позволив рабочим сохранить свои права и сосредоточившись на оптимизации текущего рабочего процесса, мы сможем воссоединить французский народ и вместе расти."
 france.22.a:0 "Со временем мы станем такими же эффективными, как и раньше"
 france.22.b:0 "Немедленно отмените их права и восстановите нашу промышленность"
 france.23.t:0 "Забастовки закончены"
 france.23.d:0 "Большинство рабочих наконец поняли, что их неразумные требования не будут удовлетворены. Их дети голодают, и даже несмотря на то, что [Root.GetCommunistParty] призывает их продолжать забастовку, у них нет ресурсов для ее продолжения. С каждым днем рабочие сдаются и возвращаются на фабрики. Наша промышленность снова выйдет на полную мощность, и маловероятно, что в ближайшее время у нас будут забастовки."
 france.23.a:0 "Наконец-то мы снова можем конкурировать"
 france.24.t:0 "Коммунистическая угроза"
 france.24.d:0 "Угроза, которую представляет собой объединенная Германия и Советы, слишком велика, чтобы ее игнорировать. После соглашения между двумя странами о разделе Польши перед нами стоит сложный выбор. Если мы позволим [Root.GetCommunistParty] действовать так, как они действовали до сих пор, мы откроемся для внутренней борьбы по мере того, как Советы растут в мощи. Запрещая любую коммунистическую деятельность или связь с [Root.GetCommunistParty], мы посылаем всем гражданам мощный сигнал о том, что мы не потерпим никого, кто представляет угрозу миру. Традиционно мы могли включать [Root.GetCommunistParty] в политические дискуссии, но поскольку они отказываются отречься от своей преданности Москве, возможно, пришло время принять радикальные меры."
 france.24.a:0 "Запретить коммунизм во Франции"
 france.24.b:0 "Расхождения являются частью демократического процесса"
 france.25.t:0 "Лондонская конференция"
 france.25.d:0 "При усилении напряжённости в Берлине на границе между ними и Югославией, британцы решили уступить. Однако Югославия - один из трёх столпов, на котором держится восточноевропейское поселение. Если оно ослабнет, безопасность Франции пострадает. Стоит ли доказывать, что мы - великая держава и рискнуть сражаться в одиночку?"
 france.25.a:0 "Мы сохраним мир"
 france.25.b:0 "Мы будем отстаивать свободу"
 france.26.t:0 "Лондонская конференция"
 france.26.d:0 "При усилении напряжённости в Берлине на границе между ними и Югославией, британцы приняли решение противостоять немецкой агрессии. Однако раны от последней войны ещё не зажили, и наша страна глубоко разделена. Достаточно ли мы сильны, чтобы противостоять ей в одиночку?"
 france.26.a:0 "Пришло время выступить против немцев"
 france.26.b:0 "Это неправильное решение"
 france.27.t:0 "Германия поддерживает итальянские требования"
 france.27.d_1_state:0 "Германия приняла итальянские требования к нашей территории. После нашего поражения мы не можем бросить ей вызов."
 france.27.d_both:0 "Италия должна получить и Савойю, и Корсику. Это решение Германии вызвало беспокойство у колониальных губернаторов, которым интересно, кто следующий. Губернатор Сирии не стал ждать и перешёл на сторону Свободной Франции."
 france.27.a:0 "У нас нет выбора."
 france.27.b:0 "Немцы - недальновидные глупцы"
 france.28.t:0 "Переход Сирии"
 france.28.d:0 "После того, как Германия передала Виши территории Италии, сирийская администрация решила присоединиться к нам."
 france.28.a:0 "Франция еще на шаг ближе к искуплению."
 france.29.t:0 "Британия принимает запрос на союз."
 france.29.d:0 "«История показала, как много можно достичь, когда наши великие народы выступают бок о бок. В духе Антанты мы с гордостью приветствуем вас не только как друзей, но и как союзников. Вместе мы станем сияющим маяком свободы в мире, захваченном мраком угнетения!»\n\nНаш запрос о вступлении в союз с Британией был принят. Мы можем рассчитывать на их полную поддержку в эти бурные времена."
 france.29.a:0 "Вместе мы будем держать оборону!"
 france.30.t:0 "Британия отклоняет запрос на союз."
 france.30.d:0 "«Хотя в прошлом у нас были хорошие отношения, мы не можем рисковать эскалацией конфликтов на другой стороне Ла-Манша. Германия заслужила наше доверие, уважая наш военно-морской пакт, и хотя мы будем защищаться, если огонь разгорится, мы не будем раздувать пламя. Мир всегда должен быть целью любой демократической нации».\n\nНаш запрос на вступление в союз с Британией был отклонен. Британское правительство не желает дальше провоцировать Германию и не поставит под угрозу текущий мир."
 france.30.a:0 "Их «мир» — просто другое слово для «сдачи»."
 france.33.title:0 "Освобождение Франции"
 france.33.desc:0 "С окончанием войны необходимость в тесном союзе с Францией проходит. Французские политические партии все чаще призывают к созданию временного правительства и проведению всеобщих выборов."
 france.33.a:0 "Конечно, наши верные союзники - свободный народ."
 france.33.b:0 "Нам нужно обеспечить безопасность на материке."
 france.34.title:0 "Франко-Британский союз завершается"
 france.34.desc:0 "С установлением мира в Британии, [From.GetLeader] согласился с требованиями французских политических партий о восстановлении временного французского правительства. Их политическая интеграция приостановлена, но, без сомнения, эти нации в будущем останутся близкими друзьями."
 france.34.a:0 "Браво!"
 france.34.b:0 "Ясно."
 low.1.t:0 "Франция расширяет линию Мажино"
 low.1.d:0 "Французы решили расширить свою линию Мажино на запад, вплоть до Ла-Манша! Это явно показывает их намерение бросить нас в случае вторжения Германии. Наше посольство в Париже подало официальную жалобу, но вряд ли она будет иметь большое влияние."
 low.1.a:0 "Это возмутительно!"
 soviet.1.t:0 "Японское усиление"
 soviet.1.d:0 "Напряженность вдоль маньчжурской границы уже некоторое время была высокой, и сейчас наши товарищи из Монголии сообщают, что японцы собирают силы в Хэйлунцзяне. Отступление может быть расценено как признак слабости, но если мы ответим силой, ситуация может обостриться. Каковы ваши приказы, товарищ командир?"
 soviet.1.a:0 "Мы даем отпор. Жестко."
 soviet.1.b:0 "Мы не можем позволить себе войну с Японией."
 soviet.2.t:0 "Успешный рейд"
 soviet.2.d:0 "Наш рейд через маньчжурскую границу против скопившихся там японских войск был успешным! Мы застигли их врасплох до того, как они завершили свои приготовления, и наши отважные солдаты дали им хорошую трепку в последовавшей жестокой схватке."
 soviet.2.a:0 "Хорошо сработано!"
 soviet.3.t:0 "Неудачный рейд"
 soviet.3.d:0 "Наш рейд через маньчжурскую границу против скопившихся там японских войск потерпел неудачу! Враг поймал наши силы в клещи, и мы понесли тяжелые потери, прежде чем нам удалось вырваться."
 soviet.3.a:0 "Подготовьте расстрельную команду."
 soviet.4.t:1 "[FROM.GetNameDefCap] отдает Бессарабию"
 soviet.4.d:1 "[FROM.GetAdjective]ы мудро уступили нашим требованиям и вывели все свои силы из Бессарабии. Мы включим эту территорию в союз как Молдавскую Советскую Социалистическую Республику. Ее граждане теперь будут пользоваться преимуществами социализма."
 soviet.4.a:0 "Отлично."
 soviet.5.t:0 "Румыния отвергает наши требования"
 soviet.5.d:0 "Румыны отказались выполнить наши требования! Похоже, нам придется силой изгнать их оккупационные силы из Бессарабии."
 soviet.5.a:0 "Дураки!"
 soviet.6.t:1 "[FROM.GetNameDefCap] Сдается"
 soviet.6.d:1 "[FROM.GetNameDefCap] принял наши требования. Мы заменили декадентское правительство в Таллине Народным парламентом, который единогласно проголосовал за преобразование [FROM.GetNameDef] в Советскую Социалистическую Республику. После обсуждения Верховный Совет принял решение удовлетворить эту просьбу."
 soviet.6.a:0 "Добро пожаловать в союз, товарищи."
 soviet.7.t:1 "[FROM.GetNameDefCap] Отклоняет наше предложение"
 soviet.7.d:1 "[FROM.GetNameDefCap] возмутительно решил отказаться от нашего щедрого предложения о пакте о взаимопомощи! У капиталистов и подхалимов в Таллине хватило наглости выступить с заявлением, требуя от нас уважать территориальную целостность их нации!"
 soviet.7.a:1 "Мы должны защитить [FROM.GetAdjective] от самих себя."
 soviet.8.t:1 "[FROM.GetNameDefCap] Сдается"
 soviet.8.d:1 "Правительство [FROM.GetAdjective] в Риге согласилось с нашими требованиями, и мы заменили их коррумпированное правление Народным собранием. Этот орган единогласно проголосовал за то, чтобы запросить членство в нашем великом союзе в качестве Советской Социалистической Республики. Мы любезно согласились выполнить эту просьбу."
 soviet.8.a:0 "Теперь вы социалисты!"
 soviet.9.t:1 "[FROM.GetNameDefCap] Отклоняет наше предложение"
 soviet.9.d:1 "Буржуазные угнетатели, правящие в [FROM.GetNameDef], решили отказаться от всякого разума. Они отклонили наш щедрый договор о взаимопомощи и требуют немедленного вывода всех советских войск, \"сосредотачивающихся\" у их границы."
 soviet.9.a:1 "Народ [FROM.GetAdjective] должен быть освобожден."
 soviet.10.t:1 "[FROM.GetNameDefCap] Подчиняется"
 soviet.10.d:1 "Нашу просьбу о предоставлении военных баз в [FROM.GetNameDef] удовлетворили, но, к сожалению, их правительство рухнуло. Мы учредили Народный парламент, чтобы избежать анархии, и они единогласно проголосовали за обращение в Верховный Совет с просьбой о присоединении к нашему союзу. Эта просьба была удовлетворена."
 soviet.10.a:0 "Мы спасем вас от капитализма."
 soviet.11.t:1 "[FROM.GetNameDefCap] Отклоняет наше предложение"
 soviet.11.d:1 "[FROM.GetNameDefCap] словно настроен на самоуничтожение, а глупцы в их правительстве запрещают нашим войскам доступ в их страну. Думают ли они, что им будет лучше под немцами? Их эгоистичные лидеры совершают преступление против своего народа, лишая его граждан истинного социализма."
 soviet.11.a:1 "Народ [FROM.GetAdjective] настрадался."
 soviet.12.t:1 "[FROM.GetNameDefCap] Принимает наши требования"
 soviet.12.d:1 "Ошеломляющее количество сил, которое мы сконцентрировали вдоль наших границ, убедило [FROM.GetAdjective] правительство принять наши скромные требования по пересмотру границ. Мы получили контроль над Карелией, и положение [195.GetName] теперь намного надежнее."
 soviet.12.a:0 "Мы рассчитывали, что они будут сопротивляться..."
 soviet.13.t:1 "[FROM.GetNameDefCap] отвергает наши требования"
 soviet.13.d:1 "[FROM.GetAdjective] правительство отклонило наши требования, но этого следовало ожидать. Если мы хотим заполучить Карелию, то придётся силой. Пора проучить упрямых финнов так, чтобы они не забыли!"
 soviet.13.a:0 "Мы разгромим их за несколько недель."
 soviet.14.t:0 "Членство в СССР"
 soviet.14.d:0 "Мы получаем давление из Москвы, чтобы официально присоединиться к СССР. Стоит ли соглашаться на это?"
 soviet.14.a:0 "Да, присоединимся к ним."
 soviet.14.b:0 "Нет, мы ещё не достигли своего полного потенциала!"
 soviet.15.t:0 "Танну-Тыва отказывается!"
 soviet.15.d:0 "Тувинцы возмутительно отказались от слияния с Советским Союзом! И остаётся загадкой, что такая ничтожная нация может рассчитывать достичь самостоятельно."
 soviet.15.a:0 "Пусть им сопутствует удача."
 soviet.16.t:0 "Аннексия Танну-Тывы"
 soviet.16.d:0 "Верховный Совет получил официальное прошение от Тувинского парламента о вступлении в Советский Союз. Они будут организованы как Тувинская автономная область в РСФСР."
 soviet.16.a:0 "Добро пожаловать в союз, товарищи."
 soviet.17.t:0 "Улучшение Линии Сталина"
 soviet.17.d:0 "Всесторонний пересмотр оборонительных укреплений вдоль западных пограничных районов завершён, а заключённые из наших лагерей исправительных работ готовы приступить к работе. Скоро линия Сталина будет соответствовать своему великому тёзке!"
 soviet.17.a:0 "Товарищ Сталин будет горд!"
 soviet.60.t:0 "Раздел Польши"
 soviet.60.d:0 "Польша наша, но западные районы попадают под сферу влияния [GER.GetAdjective] согласно положениям пакта Молотова-Риббентропа. Следует ли нам вывести войска и позволить [GER.GetAdjective] занять эту территорию? Невыполнение этого условия приведёт к аннулированию нашего договора."
 soviet.60.a:0 "Да. Сейчас не время нарушать договоры."
 soviet.60.b:0 "Нет! Вся Польша принадлежит Родине!"
 soviet.61.t:0 "СССР выполняет пакт"
 soviet.61.d:0 "В соответствии с договором [SOV.GetAdjective] передали нам западные районы Польши в управление. Немецкие войска вошли, чтобы обеспечить безопасность."
 soviet.61.a:0 "Превосходно."
 soviet.62.t:0 "СССР нарушает пакт"
 soviet.62.d:0 "Несмотря на неоднократные заверения, Советы до сих пор не отвела свои войска и не предприняли никаких шагов для передачи территорий и возвращения к согласованным нами границам. Похоже, у них нет намерения следовать договору."
 soviet.62.a:0 "Даже чернил не стоил!"
 soviet.70.t:0 "Давление [SOV.GetName]"
 soviet.70.desc:0 "Несмотря на освобождение нашей Родины от [GER.GetAdjective] оккупации, мы всё ещё должны иметь дело с присутствием [SOV.GetName]. Теперь они отказываются признать легитимность нашего правительства, если не будут допущены коммунисты [SOV.GetAdjective] в стране к более заметной роли в администрации. На самом деле, это плохо скрытая угроза со стороны [SOV.GetAdjective], что они ожидают, что мы присоединимся к ним. Тем временем наши партнёры на Западе, похоже, не желают предлагать нам какую-либо поддержку в сопротивлении требованиям [SOV.GetLeader]."
 soviet.70.a:0 "Мы не в том положении, чтобы начать ещё одну войну."
 soviet.70.b:0 "Мы не будем подчиняться [SOV.GetLeader]."
 soviet.71.t:0 "Согласовано присоединение к [POL.GetAdjective]"
 soviet.71.desc:0 "После недавнего давления со стороны нашей администрации и постоянной угрозы со стороны могущественной Красной Армии буржуазная администрация [POL.GetName] согласилась признать полномочия коммунистической партии как единственного законного представителя народа. Хотя мы могли бы применить силу, чтобы навязать свою волю, теперь в этом нет необходимости, поскольку мы можем быть уверены, что [POL.GetName] отныне станет частью нашей сферы влияния."
 soviet.71.a:0 "Они были правы, что покорились."
 soviet.72.t:0 "[POL.GetName] продолжает подавлять пролетариат"
 soviet.72.desc:0 "В глупом проявлении буржуазной надменности, незаконная администрация [POL.GetName] отказывается признать авторитет коммунистической партии. Мы не можем позволить этим дуракам снова превратить Польшу в плацдарм для фашистских вторжений в [SOV.GetNameDef]. Это вопрос чрезвычайной национальной безопасности, что мы немедленно приведем [POL.GetName] в нашу сферу влияния."
 soviet.72.a:0 "Мы сокрушим [POL.GetAdjective] буржуазию раз и навсегда."
 soviet.72.b:0 "Люди устали от войны, мы должны найти другой путь."
 soviet.73.t:0 "[SOV.GetNameDef] отступает"
 soviet.73.desc:0 "Недавняя напряженность, связанная с внешнеполитическим курсом [POL.GetName], в последнее время утихла, поскольку [SOV.GetNameDef] отказалась от своей прежней агрессивной риторики. Хотя вероятность нового вторжения снизилась, мы должны сохранять бдительность в отношении нашего восточного соседа и его пешек."
 soviet.73.a:0 "Мы должны быть начеку."
 soviet.74.t: "[FROM.GetNameDefCap] вернёт [ROOT.GetAdjective] территории"
 soviet.74.d: "В знак доброй воли и дружбы между [FROM.GetAdjective] и [ROOT.GetAdjective] странами [FROM.GetLeader] предложил вернуть часть удерживаемой ими территории, которая исторически входила в состав Польши."
 soviet.74.a: "Что-то лучше, чем ничего."
 soviet.74.b: "Мы не принимаем благотворительность."
 POL_refused_states: "Польша отказалась от территории."
 POL_accepted_states: "Польша получила территорию."
 soviet.75.t: "[FROM.GetLeader] Принял наше предложение."
 soviet.75.d: "Наше предложение о возвращении территорий было принято [FROM.GetAdjective] правительством. Будем надеяться, это удовлетворит всех в обозримом будущем и снизит риск внутренних конфликтов."
 soviet.75.a: "Как и ожидалось"
 soviet.76.t: "[FROM.GetLeader] Отказался от нашего предложения."
 soviet.76.d: "По каким-то причинам наше предложение о возвращении территорий было отклонено [FROM.GetAdjective] правительством. Сложно сказать, что они замышляют, но по крайней мере, им будет труднее предъявлять претензии на территории в дальнейшем."
 soviet.76.a: "Всех не устроишь"

 finland.1.t:2 "[FROM.GetAdjective] требуют [146.GetName]"
 finland.1.d:1 "Правительство [FROM.GetNameDef] обратилось к нам с просьбой пересмотреть границы, сославшись на необходимость создания буферной зоны безопасности для [195.GetName]. Они хотят, чтобы мы уступили им Карелию, и судя по сосредоточению [FROM.GetAdjective] войск на нашей границе, они не потерпят отказа. Как нам реагировать?"
 finland.1.a:0 "У нас нет иного выбора, кроме как принять их требования."
 finland.1.b:0 "Пусть приходят, если осмелятся!"
 FIN_remove_soviet_claims_in_other_states_tt: "Отказаться от всех претензий на [FIN.GetFlag]§Y[FIN.GetAdjective]§! основные государства."
 finland.2.t:0 "Запросить помощь Швеции в войне"
 finland.2.d:0 "Финляндия и Советский Союз воюют. Всего через несколько десятилетий суверенитета мы снова рискуем стать объектом одного из наших соседей.\n\nОднако угроза нашего врага выходит за пределы наших границ. Наши соседи в Швеции по-прежнему сохраняют нейтральную позицию по отношению к Советскому Союзу, но, возможно, их можно убедить присоединиться к нам в защите нашего общего наследия и обеспечить свой собственный стратегический буфер."
 finland.2.a:0 "Они должны поддержать нашу позицию."
 finland.2.b:0 "Нам не нужна помощь старых угнетателей."
 finland.3.t:0 "Финляндия ищет поддержки Швеции"
 finland.3.d:0 "Наш сосед Финляндия отказалась уступить давлению со стороны Советского Союза, и теперь страны находятся в состоянии войны. Хотя между нашими странами не было заключено формального союза, правительство Финляндии запросило, чтобы Швеция приняла участие в совместной обороне Аландских островов, которые остаются в основном шведоязычными и стратегически важны для обеих стран.\n\nВ то время как правительство все еще не определилось, какие шаги нам следует предпринять, чтобы помочь Финляндии, общественная поддержка их обороны заслуживает внимания. Насколько далеко мы готовы пойти, чтобы защитить наших соседей-скандинавов от агрессии с востока?"
 finland.3.a:0 "Мы должны сохранить наш нейтралитет."
 finland.3.b:0 "Если у них есть общественная поддержка, отправьте добровольцев и оборудование."
 finland.3.c:0 "Дело Финляндии - наше! В войну!"
 finland.4.t:0 "Швеция отклоняет запрос"
 finland.4.d:0 "Шведское правительство отреагировало отрицательно на нашу просьбу о помощи в войне против Советского Союза. Предпочитая оставаться нейтральным, чтобы избежать международных и внутренних последствий, они до сих пор не хотят участвовать в войне."
 finland.4.a:0 "Будем надеяться, они поймут свою ошибку, пока не стало слишком поздно."
 finland.5.t:0 "Швеция направляет добровольцев"
 finland.5.d:0 "Шведское правительство не желает присоединиться к нам в войне против Советского Союза, но общественная поддержка среди наших соседей все еще высока, и многие добровольцы из других скандинавских стран предложили присоединиться к нашим рядам, чтобы помочь военным действиям. Хотя это меньше, чем мы надеялись, по крайней мере, есть некоторая популярная осведомленность об угрозе, с которой мы сталкиваемся."
 finland.5.a:0 "Это минимум, который можно было бы ожидать."
 finland.6.t:0 "Швеция присоединяется к нашей войне"
 finland.6.d:0 "Наша просьба к шведскому правительству о совместной обороне Аландских островов была встречена выше ожиданий. Швеция присоединилась к нам в войне против Советского Союза, отказываясь оставаться нейтральной перед лицом такой явной угрозы. Несмотря на внутренние разногласия, теперь они будут сражаться вместе с нами бок о бок, чтобы обеспечить сохранение суверенитета Финляндии."
 finland.6.a:0 "Этот день останется в памяти."
 finland.7.t:0 "Переговоры о мире с [SOV.GetNameDef]"
 finland.7.d:0 "[Root.GetAdjective] коммунист Хелля Вуолийоки связалась с нашим правительством и предложила свою помощь в установлении контакта с [SOV.GetAdjective] режимом. Встречу назначили в секретном месте в Швеции, где нам предложат уступить территорию в обмен на сохранение [Root.GetAdjective] суверенитета. \n\nФинам не хватает ресурсов и предыдущие попытки начать переговоры были безуспешными. Это может быть нашей единственной надеждой на мирное урегулирование конфликта."
 finland.7.a_tt:0 "§YЕсли [SOV.GetName] примет:\n§!"
 finland.7.a:0 "Нет смысла продолжать войну"
 finland.7.b:0 "Мы должны продолжать сражаться!"
 finland.8.t:0 "Предложения уступок от [From.GetNameDefCap]"
 finland.8.d:0 "Война с [From.GetNameDef] оказалась дорогостоящим мероприятием, но как только мы отбросили [From.GetAdjective] армию, они сделали нам заманчивое предложение. Нам дали контроль над стратегически важными районами, но взамен мы должны вывести войска и прекратить дальнейшие военные действия.\nЭто положит конец наступлению на [From.GetNameDef] без полного контроля над регионом, но это позволит нам сосредоточиться на расширении сферы влияния в других частях мира."
 finland.8.a:0 "Наших солдат ждут в других местах"
 finland.8.b:0 "Нам нужна вся территория [From.GetNameDef]"
 finland.9.t:0 "Отказ от [From.GetNameDefCap]"
 finland.9.d:0 "Переговоры, начатые с [From.GetNameDef], прекращены. Очевидно, что это была уловка, чтобы зря тратить наше время, в то время как [From.GetAdjective] армия готовилась к очередному нападению на [Root.GetAdjective] территорию.\n\n[Root.GetNameDef] будет стоять и сражаться до конца."
 finland.9.a:0 "Они будут проливать кровь за каждый шаг!"
 FIN_agree_peace:0 "Финляндия принимает советские требования и уступает §YКарелию, Саллу и Петсамо§!."
 finland.10.t:0 "Зимняя война"
 finland.10.d:0 "Наконец, территориальные амбиции [SOV.GetNameDef] достигли своего апогея во вторжении в нашу страну этого самого гнусного врага. Мы должны сделать все возможное, чтобы сформировать надежную оборону от этой безжалостной атаки. Пусть они заплатят за каждый шаг вперед на нашей земле!"
 finland.10.a:0 "Режьте их в куски!"
 japan.1.d:0 "Китайские власти утверждают, что \"точка невозврата\" достигнута в отношении наших \"необоснованных агрессий\" в отношении Китая! Наши требования о возмещении ущерба были отклонены, и появились сообщения о том, что японские граждане подверглись нападению в Шанхае. Если нам нужен был повод решительно разобраться с китайцами, то вот он!"
 japan.1.a:0 "Они за это заплатят!"
 japan.2.d:0 "Удивительно, но китайцы решили отступить после стычки у моста Марко Поло. Они понимают, что нас злить себе дороже, и согласились на обширные территориальные уступки, которые включают Пекин и его окрестности. Китай постепенно становится нашим."
 japan.2.a:0 "Война подождет."
 japan.3.t:0 "Пограничный конфликт: Победа Советского Союза"
 japan.3.d:0 "Русские и их монгольские прихвостни обнаружили скопление наших войск в Хэйлунцзяне и совершили крупный налет через границу до завершения нашей подготовки! Наши войска сильно пострадали в последовавших интенсивных стычках, прежде чем стороны разошлись."
 japan.3.a:0 "Как это могло произойти?!"
 japan.4.t:0 "Пограничный конфликт: Победа Японии"
 japan.4.d:0 "Русские и их монгольские прихвостни обнаружили скопление наших войск в Хэйлунцзяне и попытались осуществить крупный налет через границу, чтобы сорвать нашу подготовку! К счастью, наши дальновидные командиры поймали их силы в клещи. Мы нанесли серьезный урон их войскам, прежде чем они бежали обратно через границу."
 japan.4.a:0 "Им это будет уроком!"
 japan.5.t:0 "Советское отступление"
 japan.5.d:0 "Обнаружив сосредоточение наших войск, Советы благоразумно решили вывести свои войска из районов, непосредственно прилегающих к маньчжурской границе. Наши солдаты временно оккупировали несколько их заброшенных пограничных застав. Надеюсь, это положит конец нелепым территориальным претензиям, которые выдвигали русские и их монгольские союзники."
 japan.5.a:0 "Потребовалась всего лишь демонстрация силы."
 japan.6.t:0 "Французы приняли наши требования"
 japan.6.d:0 "Французы приняли наши требования, и их базы и производства в Индокитае находятся в нашем полном распоряжении. По сути, они передали нам полный контроль над своей колонией."
 japan.6.a:0 "Мудрый ход."
 japan.7.t:0 "Французы отклонили наши требования"
 japan.7.d:0 "Французы возмутительно отвергли наши требования! Похоже, если нам нужен Индокитай, нам придется брать его силой!"
 japan.7.a:0 "Дураки!"
 japan.8.t:0 "Германия отзывает советников"
 japan.8.d:0 "Немцы согласились отозвать всех своих советников из Китая. Они уже должны садиться на самолет в Берлин. Германия признает, что будущее Великой Восточной Азии принадлежит Японии, а не Китаю."
 japan.8.a:0 "Так оно и должно быть."
 japan.9.t:0 "Германия отклонила нашу просьбу"
 japan.9.d:0 "Немцы отказались отозвать своих советников из Китая, несмотря на то что их военная миссия напрямую мешает нашим планам в отношении Восточной Азии! Разве они не видят, что это подрывает основу для развития дипломатических отношений между нашими странами? Можно ли вообще доверять немцам?"
 japan.9.a:0 "Тогда их советники погибнут вместе с остальными китайцами."
 japan.11.t:0 "Выдвинуть ультиматум Сиаму"
 japan.11.d:0 "Мы сосредоточили войска в Индокитае вблизи сиамской границы, и таким образом наглядно продемонстрировали, что наше намерение использовать их землю в качестве базы для освобождения Юго-Восточной Азии от европейского колониализма абсолютно искренне. Надеемся, что, предоставив им возможность присоединиться к нам в рамках военного союза и сделать Сиам фактически марионеточным государством Японской империи, мы сможем избежать бессмысленного одностороннего вторжения. Конечно, если они откажутся, это будет равносильно объявлению войны."
 japan.11.a:0 "Мы войдем в Сиам, независимо от того, что они скажут."
 japan.11.b:0 "Оглядываясь назад, угроза вторжения выглядит слишком агрессивно."
 japan.12.t:0 "Япония выдвигает ультиматум"
 japan.12.d:0 "Япония давно сосредоточивает войска рядом с нашей границей, и, как мы и предполагали, их план состоит в том, чтобы использовать наши порты в качестве баз для дальнейшего вторжения в Бирму и Малайю. Теперь они поставили перед нами выбор: либо мы покоримся и позволим им беспрепятственно проходить, либо столкнемся с вторжением.\n\nС одной стороны, это можно расценить как отказ от нашего суверенитета и превращение в марионеточное государство Японии, но, с другой стороны, в наших интересах избежать войны."
 japan.12.a:0 "Мы заключим союз с Японией."
 japan.12.b:0 "Мы не так легко сдадим нашу независимость!"
 japan.13.t:0 "Сиам принимает ультиматум"
 japan.13.d:0 "[From.GetLeader] мудро решил принять наш ультиматум и заключить военный союз между нашими государствами. Фактически мы сможем использовать Сиам в качестве базы для будущих операций в Тихом океане."
 japan.13.a:0 "Великая Восточно-Азиатская сфера совместного процветания укрепляется."
 japan.14.t:0 "Сиам отвергает ультиматум"
 japan.14.d:0 "Лидер Сиама отклонил наши требования о вступлении в военный союз и разрешении нам войти в Сиам. Поскольку мы заявили, что войдем в любом случае, это означает войну."
 japan.14.a:0 "Жаль, что все так вышло."
 romania.1.t:1 "Румыния требует Бессарабию"
 romania.1.d:1 "Вооруженные силы Румынии сосредотачиваются на другой стороне нашей границы, а их дипломаты потребовали, чтобы мы уступили им всю Бессарабию! Мы не можем рассчитывать на вмешательство Германии, поскольку их пакт с русскими, по-видимому, содержит секретный протокол, который помещает нас в сферу интересов Румынии. Должны ли мы сопротивляться?"
 romania.1.a:0 "Нет. Это безнадежно."
 romania.1.b:0 "Да! Мы не отдадим нашу территорию без боя!"
 romania.2.t:0 "Второй Венский арбитраж"
 romania.2.d:0 "Германия была приглашена для посредничества в нашем территориальном споре с Венгрией, и на Втором Венском арбитраже они решили, что Северная Трансильвания должна быть возвращена под контроль Венгрии. Принять ли нам это решение?"
 romania.2.a:0 "Да... у нас нет выбора."
 romania.2.b:0 "Нет, мы никогда не отдадим Трансильванию!"
 romania.3.d:0 "Германия была приглашена для посредничества в нашем территориальном споре с Венгрией, и на Втором Венском арбитраже они возмутительно решили, что вся Трансильвания должна быть возвращена под власть Венгрии! Принять ли нам это решение?"
 romania.4.t:0 "Германия выступает посредником в конфликте"
 romania.4.d:0 "Германия стала посредником в нашем территориальном споре с Венгрией и мудро решила, что Трансильвания должна остаться под контролем Румынии. Венгры недовольны, но, мы надеемся, что это урегулирует вопрос раз и навсегда."
 romania.4.a:0 "Трансильвания останется румынской."
 romania.5.t:0 "Крайовский договор"
 romania.5.d:0 "Болгарские дипломаты выступили с поддержкой Германии, потребовав вернуть Южную Добруджу - территорию, которую мы аннексировали у них в 1913 году после Второй Балканской войны. Уступки, которые мы уже были вынуждены сделать, похоже, подтолкнули их к этой просьбе."
 romania.5.a:0 "Это разрешит спор."
 romania.5.b:0 "Нет, черта должна быть проведена здесь!"
 romania.6.t:0 "Трудное решение"
 romania.6.d:0 "Мы потеряли столько территорий из-за наших ненасытных соседей. Тем не менее, есть возможности вернуть часть утраченных земель с выгодой. Все, что нам нужно, - это выбрать правильную сторону."
 romania.6.a:0 "Наша единственная надежда - Германия."
 romania.6.b:0 "Советский Союз предлагает нам лучшие шансы."
 romania.6.c:0 "Мы должны оставаться нейтральными"
 baltic.1.t:1 "[FROM.GetAdjective] ультиматум"
 baltic.1.d:1 "[FROM.GetNameDefCap] оказывает на нас давление, чтобы подписать с ними договор о "взаимной помощи", который даст им право размещать силы на нашей территории! Это всего лишь тонко завуалированная попытка аннексировать нашу страну, но мы мало что можем противопоставить силам, которые они разместили на нашей границе."
 baltic.1.a:0 "Принять неизбежное..."
 baltic.1.b:0 "Им придется взять нашу землю силой!"
 baltic.4.t:0 "Германия требует Мемель"
 baltic.4.d:0 "Немецкие войска концентрируются в Восточной Пруссии, и их Министерство иностранных дел предъявило нам ультиматум! Мы должны немедленно уступить им территорию Мемель или столкнуться с угрозой военных действий. Должны ли мы согласиться на их требования?"
 baltic.4.a:0 "Мы должны согласиться."
 baltic.4.b:0 "Никогда!"
 baltic.5.t:0 "Коммунисты у власти."
 baltic.5.d:0 "[Root.GetName] выбрал солидарность, а политическая власть была вырвана у буржуазии. Многие в новом правительстве предлагают нам исполнить наши коммунистические обязанности и объединиться с Советским Союзом."
 baltic.5.a:0 "Наше будущее будет лучше обеспечено, если мы по-настоящему станем единым целым с Родиной."
 baltic.5.b:0 "[Root.GetName] может предложить больше, действуя самостоятельно под защитой Советского Союза."
 baltic.5.c:0 "[Root.GetName] останется суверенным государством."
 baltic.7.t:0 "[From.GetName] запрашивает [Root.GetAdjective] участие в [From.GetFactionName]"
 baltic.7.d:0 "Подписанием договора о дружбе между нашими странами, [From.GetName] просит [Root.GetName] присоединиться к их [From.GetFactionName], чтобы объединиться против растущих угроз, которые окружают наши страны. Будь то коммунисты или фашисты, [From.GetName] обещает защищать [Root.GetAdjective] интересы."
 baltic.7.a:0 "[Root.GetName] стоит вместе с его братьями."
 baltic.7.b:0 "[Root.GetName] может выжить только самостоятельно."
 baltic.8.t:0 "[SOV.GetNameDefCap] расширяет наш контроль над территориями Балтики"
 baltic.8.desc:0 "Это великий день для [ROOT.GetNameDef]! После доблестной кампании, которую вели наши товарищи, [SOV.GetNameDefCap] по праву заявил, что недавно освобожденная территория Балтики вместе с ее храбрыми работниками подпадет под нашу юрисдикцию.\n\nЭто приближает нас еще на один шаг к единому Балтийскому государству, достаточно сильному, чтобы отбить врагов рабочего класса."
 baltic.8.a:0 "Это естественный выбор!"
 hungary.1.t:0 "Германский арбитраж"
 hungary.1.d:0 "Несмотря на наши законные требования, Германия решила, что Трансильвания должна остаться под контролем Румынии. Они говорят, что хотят исправить все несправедливости, созданные в Версале, но очевидно, что это относится только к их собственным границам."
 hungary.1.a:0 "Возмутительно."
 hungary.2.t:0 "Второй Венский арбитраж"
 hungary.2.d:0 "Германия признала обоснованность наших претензий, как мы и знали, и Северная Трансильвания возвращена Венгрии. Это исторический момент!"
 hungary.2.a:0 "День празднования!"
 hungary.3.d:0 "Германия не только признала обоснованность наших претензий, но и решила, что вся Трансильвания должна быть возвращена под контроль Венгрии! Это больше, чем мы могли надеяться."
 hungary.4.d:0 "Германия признала обоснованность наших претензий и передала нам Северную Трансильванию, но Румыния упорно отказывается признать это решение!"
 hungary.4.a:0 "Дураки!"
 hungary.5.d:0 "Германия признала обоснованность наших претензий и передала нам всю Трансильванию, но Румыния упорно отказывается признать это решение!"
 hungary.6.t:0 "Первый арбитраж Любляны"
 hungary.6.d:0 "Немцы могут жаловаться на Версальский договор, но им повезло по сравнению с несправедливостью Трианонского договора. Хотя они утверждали, что это касается национального самоопределения, он обрек столь многих истинных сыновей Венгрии на иностранное правление. Одна из таких ран для гордости венгров — провинция Воеводина. Возвращение земель Венгрии исправило несправедливость, нанесенную нам."
 hungary.6.a:0 "Справедливость Венгрии"
 bulgaria.1.t:0 "Крайовский договор — согласие Румынии"
 bulgaria.1.d:0 "Румынское правительство приняло немецкий арбитраж в нашем споре. Южная Добруджа воссоединена с Болгарией!"
 bulgaria.1.a:0 "Наконец-то!"
 bulgaria.2.t:0 "Крайовский договор: Румыния отказывается"
 bulgaria.2.d:0 "Румынское правительство отвергло наше предложение положить конец всем спорам! Они утверждают, что Южная Добруджа теперь является неотъемлемой частью их страны, от которой они никогда не откажутся."
 bulgaria.2.a:0 "Недопустимо!"
 bulgaria.3.t:0 "Первое Люблянское соглашение"
 bulgaria.3.d:0 "Мы давно мечтали о Великой Болгарии, и с нами давно обращаются как с людьми второго сорта. На Лондонской конференции нам отказали в законных требованиях, нас предали союзники в 1913 году, нас наказали за то, что мы хотели справедливости в 1918 году. Но теперь все кончено: Германия стремится исправить несправедливость, допущенную в ходе так называемого мира, не только для себя, но и для других. Теперь Болгария вернет себе Македонию от Югославии."
 bulgaria.3.a:0 "Ликуйте, болгары!"
 bulgaria.4.t:0 "Крайовский договор"
 bulgaria.4.d:0 "Мы не забыли, как Румыния нанесла нам удар в спину в 1913 году и трусливо забрала Южную Добруджу, пока наши армии были заняты в другом месте. Венгрия использовала свою дружбу с Германией, чтобы отомстить Румынии, не настало ли и нам время?"
 bulgaria.4.a:0 "Мы отомстим"
 bulgaria.4.b:0 "Месть — это блюдо, которое лучше подавать холодным"
 bulgaria.5.t:0 "Крайовский договор"
 bulgaria.5.d:0 "Германия решила встать на сторону гнусных румын в нашей борьбе за справедливость. [Root.GetLeader] дал понять германскому послу, что Болгария ждет большего от своих друзей."
 bulgaria.5.a:0 "Отказано"
 italy.1.t:0 "Албания уступает"
 italy.1.d:1 "Албанские власти согласились на наши требования, и [ALB.GetLeader] был вынужден уйти в отставку. Отныне и до скончания века Албания будет итальянской!"
 italy.1.a:0 "Славный день."
 italy.2.t:0 "Зогу отвергает ультиматум"
 italy.2.d:0 "Король Зогу отвергает наш ультиматум. Он и его советники теперь пытаются собрать жалкие остатки обороны Албании. Мы должны занять Тирану и положить конец этому фарсу!"
 italy.2.a:0 "Мы могли бы сделать это просто, Зогу!"
 italy.3.t:0 "Итальянский ультиматум"
 italy.3.d:0 "Итальянские дипломаты предъявили нам ультиматум, требуя, чтобы мы подчинились их оккупации! Албанией должен управлять личный союз под руководством итальянского короля!"
 italy.3.a:0 "Мы должны подчиниться."
 italy.3.b:0 "Этого не будет! Объединимся с Зогу!"
 italy.4.t:0 "Расширение Валло Альпино"
 italy.4.d:0 "Инженеры Реджио Эсерчито изучили нашу северную границу и определили места, где Валло Альпино необходимо укрепить и расширить. Уже отданы необходимые строительные приказы."
 italy.4.a:0 "Если бы эти форты были здесь во времена Ганнибала..."
 italy.5.t:0 "Итало-германский технологический договор"
 italy.5.d:0 "Италия предлагает обмен технологиями и идеями, которые сблизят наши народы и сделают нас обоих сильнее."
 italy.5.a:0 "Отличное предложение!"
 italy.5.b:0 "Немецкие технологии предназначены только для немцев"
 italy.6.t:0 "Итало-германский договор о технологиях — принято!"
 italy.6.d:0 "Как и ожидалось, немцы с удовольствием разработали серию обменов технологиями. Очевидно, в Европе дуют новые ветры, и Италия стала на шаг ближе к восстановлению своей прежней славы!"
 italy.6.a:0 "Отлично!"
 italy.7.t:0 "Итало-германский договор о технологиях — отклонено!"
 italy.7.d:0 "Немцы отклонили наше предложение о договоре."
 italy.7.a:0 "С этого момента нам лучше самим заботиться о себе"
 italy.8.t:0 "Присоединиться к французской фракции"
 italy.8.d:0 "Мовсемен Франс набирает силу во Франции и попросил нас присоединиться к их фракции. Соответствует ли это интересам Италии?"
 italy.8.a:0 "Давайте присоединимся к французам."
 italy.8.b:0 "Французам нельзя доверять"
 usa.1.t:0 "Эрхарт хочет присоединиться"
 usa.1.d:0 "Когда Америка готовится к войне, мы получили необычный запрос. Амелия Эрхарт, известная авиатор, которая не так давно успешно облетела земной шар, желает поступить в армейский авиакорпус в качестве летчика-истребителя. Она продемонстрировала значительное мастерство в учебных воздушных боях, но во многих военных кругах неодобрительно относятся к идее женщины на боевых вылетах. Сделаем ли мы исключение для нее и позволим ей присоединиться?"
 usa.1.a:0 "Да, она нам нужна."
 usa.1.b:0 "Нет, в этом нет необходимости."
 usa.2.t:0 "Явная судьба"
 usa.2.d:0 "Уникальный фундамент и история Соединенных Штатов делают сохранение демократии и свободы в мире нашим долгом. Последнее десятилетие доказало, что эту миссию невозможно выполнить, не взявшись за оружие против тех, кто стремится их уничтожить. Отныне каждый угнетатель будет отвечать перед нами, а наши вооруженные силы освободят людей по всему миру."
 usa.2.a:0 "Свобода или смерть!"
 usa.3.t:0 "Американский флот в Перл-Харборе"
 usa.3.d:0 "Дипломатические и экономические санкции, которые мы потерпели от Соединенных Штатов, похоже, стали началом чего-то более угрожающего. Американский Тихоокеанский флот был размещен на военно-морской базе в Перл-Харборе, на Гавайях, что ясно свидетельствует о том, что американцы будут поддерживать сильное присутствие в Тихом океане и продолжать поддерживать наших врагов. Удар по базе в этот момент может дать нам элемент неожиданности."
 usa.3.a:0 "Кто знает, как долго продлится эта возможность?"
 usa.4.t:0 "Соглашение об обмене эсминцев на базы"
 usa.4.d:0 "Заняв позицию против немцев, США, похоже, заинтересованы в том, чтобы Великобритания твердо противостояла немецкой угрозе. Однако они также обеспокоены поддержанием своего собственного военно-морского присутствия в Атлантике. В обмен на несколько наших военно-морских баз они поставят нашей стране эсминцы. Корабли находились в резерве, но принятие все равно укрепит военные связи между нашими странами и может оказаться мудрым решением."
 usa.4.a:0 "Это уникальная возможность."
 usa.4.a.tt:1 "Мы получим 43 американских эсминца.\nКанада получит 7 американских эсминцев."
 usa.4.b:0 "Это явно более выгодно для США, и неприемлемо."
 usa.5.t:0 "Британия отказывается от предложения"
 usa.5.d:0 "Несмотря на нашу подготовку и благие намерения, Британия отклонила наше предложение о старых эсминцах в обмен на их военно-морские базы."
 usa.5.a:0 "Их потеря."
 usa.6.t:0 "Выборы [GetYear]"
 usa.6.d:0 "Настал день президентских выборов. Действующий президент Франклин Делано Рузвельт уже реализовал несколько программ, известных как «Новый курс», призванных вывести США из Великой депрессии.\n\nХотя многие из его начинаний пользовались популярностью, его планы по дальнейшему расширению роли и власти правительства подверглись критике со стороны его оппонента, республиканца Альфа Лэндона. Выходец из нефтяной отрасли, Лэндон хочет большей экономической свободы, в то время как Рузвельт и Демократическая партия хотят расширить социальное обеспечение и обеспечить экономическую стабильность. Выборы могут стать напряженными или крупной победой для демократов."
 usa.6.a:0 "Демократы. Еще четыре года!"
 usa.6.b:0 "Республиканцы. Мы должны защитить идеалы американской системы."
 usa.7.t:0 "Рузвельт против Вилки"
 usa.7.d:0 "С момента учреждения должности президента Соединенных Штатов ни один президент не находился на своем посту более трех сроков. Однако в свете сложной международной ситуации в мире и сложившихся за последние несколько лет обстоятельств президент Рузвельт решил отступить от традиции и выдвинуть свою кандидатуру на третий срок. Республиканец Уэнделл Уилки, которого характеризуют как тёмную лошадку в этой гонке, имеющий за плечами карьеру промышленника, но ограниченный политический опыт, критично высказался по поводу экономического интервенционизма Рузвельта, а также его мотивов по выдвижению на третий срок.\n\nХотя внешняя политика кандидатов во многом совпадает, и Уилки стремится сохранить некоторые принципы Нового курса, многие по-прежнему считают эти выборы определяющими для будущего американской демократии."
 usa.7.a:0 "Демократы. ФДР незаменим."
 usa.7.b:0 "Республиканцы. Нам нужен Уилки!"
 usa.8.t:0 "Лэндон против Рузвельта"
 usa.8.d:0 "Президент Лэндон четыре года назад положил конец реформам "Нового курса" демократов, решив полагаться на силу страны, основанную на промышленных компаниях, таких как те, что он помог создать до своего президентства. Рузвельт, который продолжал выступать за завершение программ, которые он первоначально планировал для своего второго срока, теперь снова баллотируется на пост президента. Хотя он остается популярным кандидатом, Лэндон продолжал критиковать его усилия по концентрации власти в руках президента и соответственно сам избегал подобной политики.\n\nУгрозы за рубежом, как для нашей собственной страны, так и для других, остаются реальностью, и ни один из кандидатов не поддерживает то, чтобы Соединенные Штаты закрывали на них глаза. Вопрос в том, кто поведет арсенал демократии через эти страшные времена."
 usa.8.a:0 "Республиканцы. Лэндон привержен нашим ценностям."
 usa.8.b:0 "Демократы. Рузвельт готов сделать все необходимое."
 usa.9.t:0 "Рузвельт против Дьюи"
 usa.9.d:0 "Президентство Франклина Д. Рузвельта во многих отношениях уже было исключительным. Несмотря на ухудшающееся здоровье и беспрецедентную продолжительность его президентского срока, он стремится продолжать руководить нашей страной через военные усилия. У республиканцев был ограниченный выбор кандидатов, поскольку многие потенциальные кандидаты служили в войне, но они выбрали губернатора Томаса Э. Дьюи для своего представления.\n\nУ Рузвельта по-прежнему есть поддержка населения, но многие подозревают, что он может не дожить до конца своего срока. Но достаточно ли этого, чтобы Дьюи одержал победу над человеком, который привел нас так далеко?"
 usa.9.a:0 "ФДР побеждает Дьюи."
 usa.9.b:0 "Дьюи побеждает ФДР."
 usa.10.t:0 "[Root.GetLeader] против Рузвельта"
 usa.10.d:0 "Хотя многие аспекты Нового курса были сохранены [Root.GetLeader], Рузвельт все еще видит возможность сделать реальностью свои первоначальные планы по дальнейшему развитию программ. Несмотря на ухудшение здоровья, ему удалось сохранить большую часть поддержки, которая ранее привела его к президентству, и теперь он снова проводит кампанию за демократов.\n\n[Root.GetLeader] утверждает, что смена руководства в сложившейся чувствительной ситуации в Америке будет безответственной, что несколько иронично, поскольку такое же утверждение было сделано перед его предыдущей победой над Рузвельтом. Несмотря на это, он может быть прав."
 usa.10.a:0 "[Root.GetLeader] зарекомендовал себя как способный лидер."
 usa.10.b:0 "Америка готова к новому новому курсу."
 usa.11.t:0 "Рузвельт против Макартура"
 usa.11.d:0 "Ввиду постоянной угрозы втягивания в войну, и демократы, и республиканцы нацелились найти кандидата из армии. Генерал Дуглас Макартур, который обычно предан своей военной службе, использовал возможность вести кампанию за республиканскую кандидатуру, пока наша нация пребывает в мире и победила. Теперь он бросает вызов Рузвельту, поддерживая консервативную коалицию.\n\nРузвельт по-прежнему популярен, но харизма Макартура и чувство долга произвели сильное впечатление на избирателей. Действительно ли армия знает лучше?"
 usa.11.a:0 "Рузвельт и Трумэн справятся."
 usa.11.b:0 "Макартур - человек мира, как и войны."
 usa.12.t:0 "Кампания Дугласа Макартура"
 usa.12.d:0 "Чтобы бросить вызов рекордно длительному президентству Рузвельта, республиканцы обратились к уважаемым военным командирам в надежде найти потенциального кандидата, который проведет Америку через эту войну. Генерал Дуглас Макартур был популярным номинантом среди консерваторов, но он также является незаменимым активом в текущем конфликте и неохотно тратит время на предвыборную кампанию за пост президента.\n\nТем не менее он остается одним из самых перспективных кандидатов-консерваторов и, возможно, его удастся убедить провести кампанию, чтобы избежать избрания умеренного республиканца на пост президента. Стоит ли эта жертва того?"
 usa.12.a:0 "Макартур нужнее на передовой, чем в Белом доме."
 usa.12.b:0 "Нам нужен он, чтобы бросить вызов Рузвельту."
 usa.13.t:0 "Смерть Рузвельта"
 usa.13.d:0 "Хотя здоровье президента Рузвельта на протяжении некоторого времени было в упадке, его убедительная президентская кампания убедила многих, что он проживет еще долгие годы. Тем не менее, возможность смерти ФДР при исполнении служебных обязанностей сохранялась, и сегодня он скончался после перенесенного инсульта. Вице-президент Гарри С. Трумэн теперь принял присягу, попросив поддержки и молитв у народа. Старый кабинет остался, и Трумэн поклялся продолжить многие из решений своего предшественника."
 usa.13.a:0 "Так закончилась одна эпоха, и началась другая."
 news.1.t:0 "Инцидент на мосту Марко Поло"
 news.1.d:0 "Японские и китайские силы безуспешно перестреливались из-за стратегически важного моста Марко Поло, расположенного к юго-западу от Пекина. \n\n[CHI.GetNameDef] отверг требования [JAP.GetNameDef] об извинениях и территориальных уступках, заявив вместо этого, что точка кипения японской агрессии достигнута. \n\nДипломаты опасаются, что нестабильная ситуация может в любой момент привести к войне."
 news.1.a:1 "Действительно, интересные времена."
 news.1.b:0 "Мы научим этих китайцев!"
 news.1.c:0 "Точно! Ни пяди!"
 news.2.d:0 "Японские и китайские войска столкнулись в безрезультатных стычках у стратегически важного моста Марко Поло, расположенного к юго-западу от Пекина. \n\n[CHI.GetNameDef] приняла на себя полную ответственность за инцидент, принесла извинения [JAP.GetNameDef] и согласилась на масштабные территориальные уступки. Это удивило многих экспертов, предсказывавших, что пограничная напряженность выльется в полномасштабную войну. \n\nЗначит ли это, что в Азии наступил прочный мир?"
 news.2.a:0 "Сомнительно."
 news.2.b:0 "Это удовлетворит нас... на данный момент."
 news.2.c:0 "У нас не было выбора."
 news.5.t:0 "[JAP.GetNameDefCap] требует Французский Индокитай"
 news.5.d:0 "Воспользовавшись слабостью Франции в свете борьбы в Европе, [JAP.GetNameDef] вынудил новое правительство передать ему контроль над их колонией в Индокитае! \n\nЯпонские войска уже заняли все крупные базы в регионе, и эксперты опасаются, что колония может быть использована как плацдарм для будущих военных экспедиций."
 news.5.a:0 "Падальщики роются в трупе..."
 news.5.b:0 "Так и должно быть."
 news.5.c:0 "Шакалы не оставили нам выбора."
 news.5.e:0 "Наши союзники проявляют инициативу!"
 news.6.d:0 "Пытаясь извлечь выгоду из слабости Франции, воспользовавшись их поражением в Европе, [JAP.GetNameDef] недавно предъявили новому французскому правительству требование предоставить им полный доступ к своим базам в Индокитае.\n\nПо сути, это означало передачу полного контроля над всей колонией Японии, на что французы не могли согласиться.\n\nЭксперты считают, что это решение, вероятно, приведет к японским военным репрессиям."
 news.6.a:0 "Они не осмелятся... Правда?"
 news.6.b:0 "Упрямые глупцы заплатят за эту ошибку."
 news.6.c:0 "Мы должны быть готовы."
 news.6.e:0 "Ещё один смелый шаг наших друзей."
 news.7.t:0 "Советско-японская перестрелка"
 news.7.d:0 "Советские и японские войска недавно столкнулись в крупной перестрелке вдоль маньчжурской границы.\n\nЗначительная группа советских рейдеров, поддержанная монгольской кавалерией, видимо застала японцев врасплох, нанеся тяжелые потери.\n\nКак сообщается, обстановка в Токио напряженная, но пока еще рано говорить, перерастет ли конфликт в открытую войну."
 news.7.a:0 "Это начало новой войны в Азии?"
 news.7.b:0 "Позорная демонстрация..."
 news.7.c:0 "Мы отправили всему миру сообщение."
 news.8.d:0 "На границе Маньчжурии произошло крупное столкновение советских и японских войск. \n\nПо сообщениям с поля боя, японцы поймали в клещи советские войска и вынудили их отступить в беспорядке. \n\nЗаставит ли этот инцидент Москву направить больше войск на Дальний Восток?"
 news.8.b:0 "За императора!"
 news.8.c:0 "Нужно оценить ситуацию..."
 news.9.t:0 "Советский отвод войск"
 news.9.d:0 "После наращивания японских войск в Маньчжурии Советский Союз неожиданно вывел подразделения, которые были размещены прямо у границы. \n\nВозможно, это попытка Москвы избежать дальнейшей конфронтации с Японией, вызванная горькими воспоминаниями о поражении России в русско-японской войне."
 news.9.a:0 "Возможно, это приведёт к прочному миру."
 news.9.b:0 "Трусы сбежали!"
 news.9.c:0 "Тактический отход. Не больше."
 news.10.t:0 "Советский Союз претендует на Бессарабию"
 news.10.d:0 "Накопив силы у румынской границы, [SOV.GetNameDef] предъявил ультиматум правительству в Бухаресте о немедленной передаче им Бессарабии. Этот регион когда-то принадлежал Российской империи, что [SOV.GetNameDef] считает достаточным юридическим основанием для своих требований.\n\nРумыния заявила, что ей не остаётся ничего другого, кроме как согласиться, и её войска были выведены из Бессарабии."
 news.10.a:0 "Любопытно."
 news.10.b:0 "Бессарабия по праву принадлежит нам."
 news.10.c:0 "У нас не было выбора..."
 news.10.e:0 "Наслаждайся этой временной победой, Москва."
 news.11.t:0 "Румыния отвергает советские требования"
 news.11.d:0 "[SOV.GetNameDefCap] сосредоточило значительные силы вдоль своей границы с [ROM.GetNameDef], и сегодня Москва предъявила ультиматум румынскому правительству, требуя немедленной передачи Бессарабии под свой контроль. Этот регион когда-то принадлежал Российской империи, что [SOV.GetNameDef] считает достаточным правовым основанием для своих требований.\n\nБросив вызов, Бухарест решил отвергнуть все советские территориальные требования, а румынской армии отдан приказ о полной мобилизации.\n\nМеждународные наблюдатели ожидают, что советские войска в любой момент пересекут границу."
 news.11.a:0 "Интересно."
 news.11.b:0 "Они совершили ужасную ошибку."
 news.11.c:0 "Бессарабия наша!"
 news.11.e:0 "Пусть дураки сражаются."
 news.12.t:0 "[FIN.GetNameDefCap] отвергает советские требования"
 news.12.d:0 "Советские дипломаты предъявили ультиматум правительству [FIN.GetNameDef], требуя скорректировать границы в районе Карелии.\n\nНесмотря на значительное наращивание советских войск на границе, Хельсинки отверг эти требования, заявив, что "ни пяди финской земли не будет отдано добровольно российским агрессорам".\n\nМеждународные наблюдатели опасаются, что советское вторжение может быть неизбежным."
 news.12.a:0 "Это не закончится ничем хорошим."
 news.12.b:0 "Нельзя было отвергать наши требования."
 news.12.c:0 "Мы должны заняться нашей обороной."
 news.12.e:0 "Посмотрим, как справятся большевики..."
 news.12.f:0 "Скоро они осознают свою ошибку."
 news.13.t:0 "[FIN.GetNameDefCap] принимает советские требования"
 news.13.d:0 "После долгих дебатов правительство [FIN.GetNameDef] решило принять советские требования о корректировке границ в районе Карелии. \n\n[SOV.GetNameDef] сослался на необходимость создания буферной зоны для повышения безопасности Ленинграда, расположенного всего в 30 километрах от нынешней бывшей границы с Финляндией. \n\n Многие наблюдатели опасались полномасштабного советского вторжения в Финляндию, но это дипломатическое решение должно развеять эти опасения."
 news.13.a:0 "Мир, но какой ценой?"
 news.13.b:0 "Теперь мы можем сосредоточить свои усилия в другом месте."
 news.13.c:0 "Мы сохранили нашу независимость."
 news.13.e:0 "Жаль. Это бы отвлекло большевиков."
 news.13.f:0 "Наши товарищи демонстрируют свою силу!"
 news.14.t:0 "[SOV.GetNameDefCap] аннексирует [TAN.GetNameDef]"
 news.14.d:0 "В сегодняшнем пресс-релизе Москва объявила о формальной аннексии [TAN.GetNameDef]. \n\nВерховный Совет удовлетворил просьбу парламента Тувы о вступлении в СССР. \n\nМаленькая Тувинская Народная Республика, которая была официально признана только Советским Союзом и Монголией, будет организована как автономная область."
 news.14.a:0 "Танну что?"
 news.14.b:0 "Им будет лучше."
 news.15.t:0 "Второй венский арбитраж"
 news.15.d:0 "В Вене был подписан договор по результатам немецкого арбитража, согласно которому Северная Трансильвания возвращается под управление Венгрии.\n\nРанее по итогам Первой мировой войны эта территория была передана [ROM.GetNameDef], что привело к ожесточенному спору.\n\nНе являются ли эти изменения только началом многих пограничных корректировок, которые грядут, теперь, когда в Европе установился новый порядок?"
 news.15.a:0 "Поживем - увидим, сколько это продлится."
 news.15.b:0 "Карта Европы будет перерисована."
 news.15.c:0 "Будем надеяться, что когда-нибудь эти корректировки будут нам на пользу."
 news.15.e:0 "Слушайте, слушайте!"
 news.16.d:0 "По результатам немецкого арбитража в Вене был подписан договор, согласно которому вся Трансильвания возвращается под управление Венгрии.\n\nРанее по итогам Первой мировой войны эта территория была передана [ROM.GetNameDef], что привело к ожесточенному спору.\n\nНе являются ли эти изменения только началом многих пограничных корректировок, которые грядут, теперь, когда в Европе установился новый порядок?"
 news.17.t:0 "Румыния отвергает немецкий арбитраж"
 news.17.d:0 "Переговоры между [HUN.GetNameDef] и [ROM.GetNameDef] относительно территориального спора прекратились в Вене. \n\n[GER.GetNameDef] выступали в качестве арбитра, но когда они решили вернуть Северную Трансильванию [HUN.GetNameDef], [ROM.GetNameDef] отклонили это решение. Румынское правительство немедленно распорядилось о возвращении своей делегации в Бухарест. \n\nПо-видимому, [GER.GetNameDef] пока не обладает тем дипломатическим влиянием, на которое они рассчитывали."
 news.17.a:0 "Интересно..."
 news.17.b:0 "Румыны нас опозорили..."
 news.17.c:0 "Трансильвания наша!"
 news.17.e:0 "Это еще не конец."
 news.18.d:0 "Переговоры между [HUN.GetNameDef] и [ROM.GetNameDef] относительно территориального спора прекратились в Вене. \n\n[GER.GetNameDef] выступали в качестве арбитра, но когда они решили вернуть Северную Трансильванию [HUN.GetNameDef], [ROM.GetNameDef] отклонили это решение. Румынское правительство немедленно распорядилось о возвращении своей делегации в Бухарест. \n\nПо-видимому, [GER.GetNameDef] пока не обладает тем дипломатическим влиянием, на которое они рассчитывали."
 news.19.t:0 "[GER.GetNameDefCap] заявляет права на Мемель"
 news.19.d:0 "После того, как немецкие войска собрались на границе, готовые к нападению, [FROM.GetNameDef] подчинилась [GER.GetAdjective] ультиматуму, требующему сдачи старой прусской территории Мемеля.\n\nОна была передана [FROM.GetNameDef] по Версальскому договору, но теперь была вновь включена в состав региона Восточная Пруссия. \n\nДостигли ли мы уже границ немецких территориальных амбиций в Европе? Эксперты сомневаются..."
 news.19.a:0 "Ещё одна партия карт потеряла актуальность."
 news.19.b:0 "Все немцы должны объединиться."
 news.19.c:0 "Если бы только у нас были средства, чтобы сопротивляться..."
 news.19.e:0 "Они правы, что склоняются перед своими превосходящими силами!"
 news.20.t:0 "[FROM.GetNameDefCap] отвергает требования Германии"
 news.20.d:0 "Даже несмотря на то, что немецкие войска выстроились на границе, [FROM.GetNameDef] отвергла ультиматум, выдвинутый Берлином о возвращении территории Мемеля. \n\nКогда-то Мемель принадлежал Восточной Пруссии, но был аннексирован [FROM.GetNameDef] после Версальского договора. Именно целостность договора, по словам [FROM.GetLeader], необходимо было защищать, когда [FROM.GetAdjective] правительство объявило о своем отказе.\n\nМеждународные наблюдатели теперь ожидают, что Германия может попытаться захватить территорию силой..."
 news.20.a:0 "Очень смело."
 news.20.b:0 "Они подписали себе смертный приговор."
 news.20.c:0 "Здесь должна быть проведена черта!"
 news.21.t:0 "Крайовский договор"
 news.21.d:0 "Румынию вынудили предоставить новые уступки, а Болгария вернула себе Южную Добруджу.\n\nРумыния аннексировала территорию в 1913 году после Второй балканской войны, и там по-прежнему проживает в основном болгарское и турецкое население.\n\nНезависимо от причин, теперь Румыния значительно ослаблена."
 news.21.a:0 "Небольшая проблема."
 news.21.b:0 "Это великая победа."
 news.21.c:0 "Эта земля все равно никчемная."
 news.22.t:1 "[ALB.GetLeader] сдался Италии"
 news.22.d:2 "Итальянские дипломаты передали албанскому правительству ультиматум, в котором потребовали полностью подчинить страну военной оккупации.\n\n[ALB.GetLeader] отрекся от престола, осознав бесполезность сопротивления, и теперь Албания будет управляться в личной унии под властью короля Виктора Эммануила III.\n\nИталия смотрит на Балканы..."
 news.22.a:1 "Еще одна жертва амбиций Италии."
 news.22.b:0 "Мы на шаг ближе к созданию нашей великой империи."
 news.22.c:0 "Еще одна победа для нашего друга [From.GetLeader]!"
 news.23.t:0 "Зог сопротивляется"
 news.23.d:0 "Дипломаты из [ITA.GetNameDef] предъявили ультиматум [ALB.GetNameDef], потребовав присоединения последнего к Великой Италии.\n\nВ смелом акте национального руководства король Зогор отказался уступить итальянским требованиям, призвав албанский народ сопротивляться давлению со стороны [ITA.GetNameDef].\n\nТем не менее, иностранные военные эксперты сходятся во мнении, что у [ALB.GetNameDef] мало шансов противостоять вторжению."
 news.23.a:0 "Как долго [ALB.GetNameDef] сможет сопротивляться?"
 news.23.b:0 "Это будет короткая кампания."
 news.23.c:0 "Да здравствует король Зог!"
 news.24.t:0 "Польский вопрос"
 news.24.d:0 "Сегодня в своей пламенной речи перед Рейхстагом [GER.GetLeader] осудил Польшу и их обращение с немцами, живущими в Данциге и Польском коридоре.\n\nЗаявив, что немецкие меньшинства в Польше подвергаются преследованиям самым гнусным из всех мыслимых, [GER.GetLeader] ясно изложил позицию своего правительства:\nДанциг был немецким городом и остаётся немецким городом! Коридор был немецким и остаётся немецким! Без немецкого народа эти восточные регионы все ещё находились бы в пучине варварства."
 news.24.a:0 "Война приближается."
 news.25.t:0 "Ремилитаризация Рейнской области"
 news.25.d:1 "Германия разместила войска на территории Рейнской области, вблизи французской границы, в явном нарушении Версальского договора. Местное население приветствовало немецких солдат, в то время как дипломатические реакции Франции и Великобритании до сих пор остаются сдержанными.\n\n«Немцы просто гуляют по своему собственному двору», - отметил политический комментатор в Великобритании."
 news.25.a:0 "Тревожно."
 news.25.b:1 "Это территория Германии."
 news.25.c:0 "Мы должны позаботиться об обороне наших границ."
 news.25.e:0 "Здесь точно не о чем беспокоиться."
 news.26.d:0 "В явное нарушение Версальского договора немецкие войска пересекли Рейн и вошли на территорию Рейнской области, расположенную близ французской границы.\n\nНазывая это «непростительным нарушением» мирного договора, положившего конец Великой войне, Франция и Великобритания мобилизовали свои силы для подготовки к вооруженному вторжению в Германию. \n\nВойна в Европе разразилась снова!"
 news.26.a:0 "Ну вот и все!"
 news.26.b:0 "Германия победит!"
 news.26.c:0 "Следующая остановка: Берлин!"
 news.26.e:0 "Покончим с этим здесь и сейчас."
 news.27.d:0 "В явном нарушении Версальского договора немецкие войска пересекли Рейн и вошли на территорию Рейнской области, расположенную близ французской границы.\n\nВ то время как реакция Великобритании пока остается сдержанной, Франция мобилизует свои силы для подготовки к вооруженному вторжению в Германию. \n\nВойна в Европе разразилась снова!"
 news.28.t:0 "Гитлер убит!"
 news.28.d:0 "Группа офицеров Вермахта, выступавшая против войны, подняла мятеж в Берлине. Отряд неустановленных вооруженных лиц штурмовал Рейхсканцелярию и в результате перестрелки с его телохранителями успешно лишил жизни немецкого фюрера.\nВсех оставшихся в живых заговорщиков арестовало гестапо, и этим утром Генрих Гиммлер был приведен к присяге в качестве нового фюрера Германского Рейха.\n\nВ своей речи перед Рейхстагом Гиммлер обвинил Британию и Францию в организации убийства Гитлера и заявил о решимости Германии полностью уничтожить оба государства."
 news.28.a:0 "Интересное развитие событий."
 news.28.b:0 "Они заплатят!"
 news.28.c:0 "По крайней мере, Гитлера больше нет."
 news.29.d:0 "Группа офицеров Вермахта, выступавшая против войны, подняла мятеж в Берлине. Отряд неустановленных вооруженных лиц штурмовал Рейхсканцелярию и в результате перестрелки с его телохранителями успешно лишил жизни немецкого фюрера.\nВсех оставшихся в живых заговорщиков арестовало гестапо, и этим утром Герман Геринг был приведен к присяге в качестве нового фюрера Германского Рейха.\n\nВ своей речи перед Рейхстагом Геринг обвинил Британию и Францию в организации убийства Гитлера и заявил о решимости Германии полностью уничтожить оба государства."
 news.30.t:0 "Неудачная попытка покушения на Гитлера"
 news.30.d:0 "Группа офицеров Вермахта, выступающих против войны, совершила попытку переворота против Гитлера в Берлине. Неопознанная группа вооруженных людей штурмовала Рейхсканцелярию, но была успешно отбита членами личной охраны фюрера из СС.\nАгенты Гестапо арестовали всех заговорщиков, среди которых были высокопоставленные офицеры, такие как Людвиг Бек и Вильгельм Канарис.\n\nВ речи перед Рейхстагом Гитлер поклялся отомстить Франции и Великобритании за то, что они являются идейными вдохновителями этой \"подлой попытки\" покушения на его жизнь."
 news.30.a:0 "Представьте, если бы у них получилось..."
 news.30.c:0 "Это ничего не меняет."
 news.30.e:0 "Жаль, что они не достали этого мерзавца!"
 news.31.t:0 "Гражданская война в Германии!"
 news.31.d:0 "Группа офицеров Вермахта, выступающих против нынешней войны, совершила попытку переворота против Гитлера в Берлине. Неопознанная группа вооруженных людей штурмовала Рейхсканцелярию и успешно ликвидировала немецкого фюрера после интенсивной перестрелки с его личной охраной СС.\nЗаговорщикам удалось взять под контроль большую часть Берлина, и многие подразделения Вермахта перешли на их сторону. Силы, все еще лояльные нацистам, объединились под новым руководством и поклялись очистить Германию от \"коммунистических диссидентов и иностранных агентов, в настоящее время оккупирующих Берлин\"."
 news.31.a:0 "Интересно."
 news.31.b:0 "Германия должна быть свободна от тирании!"
 news.31.c:0 "Смерть предателям!"
 news.31.e:0 "Это нам на руку!"
 news.32.t:0 "Пакт Молотова-Риббентропа"
 news.32.d:0 "Дипломаты из Германии и Советского Союза заключили сегодня историческое соглашение, подписав пакт Молотова-Риббентропа, который наблюдатели описывают как знаменательное событие.\nПакт о ненападении назван в честь министра иностранных дел Германии Иоахима фон Риббентропа и его советского коллеги Вячеслава Молотова, который обязывает стороны не вступать в союз и не оказывать помощь врагам друг друга.\n\nИностранные дипломаты предупреждают, что этот договор фактически развязывает Германии руки для ведения войны в Европе, не опасаясь вмешательства СССР."
 news.32.d_finland:0 "$news.32.d$ Однако [ROOT.GetAdjective] народ, похоже, больше обеспокоен угрозой, которую может представлять [SOV.GetNameDef]."
 news.32.a:0 "Это ничего хорошего не сулит..."
 news.32.b:0 "За наших новых большевистских друзей!"
 news.32.c:0 "За наших новых немецких друзей!"
 news.32.e:0 "За долгую и взаимовыгодную дружбу!"
 news.32.f:0 "Мы должны быть готовы защищать свою страну."
 news.33.t:0 "СССР оккупирует Восточную Польшу"
 news.33.d:0 "Советские войска оккупировали Восточную Польшу, официально для защиты белорусского и украинского меньшинств от хаоса, возникшего после краха польского правительства.\n\nНемецкие войска в хорошем состоянии отступили с этих территорий, в результате чего Польша фактически была разделена между двумя державами."
 news.33.a:0 "Неужели вы поверили?"
 news.33.b:0 "Наслаждайтесь, пока можете, большевики..."
 news.33.c:0 "Границы коммунизма расширяются!"
 news.34.t:0 "Второе перемирие в Компьене"
 news.34.d:0 "Перемирие между [From.GetName] и Французской Третьей республикой было подписано в Компьене, в том самом железнодорожном вагоне, в котором было согласовано капитуляцию Германии в Первой мировой войне.\n\nСогласно условиям перемирия, французское правительство под руководством [vichy_france.GetLeader] со штаб-квартирой в Виши будет продолжать управлять большей частью южной Франции, в то время как остальная часть страны окажется в немецкой оккупационной зоне.\n\nНекоторые французские офицеры поклялись продолжать сопротивление из-за рубежа, но это фактически положило конец боевым действиям во Франции, по крайней мере, на время."
 news.34.a:0 "Тревожно"
 news.34.b:0 "Великолепно!"
 news.34.c:0 "Борьба продолжается!"
 news.35.t:0 "Рождение франко-британского союза"
 news.35.d:0 "Столкнувшись с поражением во Франции, правительства Франции и Великобритании решили объединить свои две нации в одну, пока не будет обеспечена победа над Германией.\n\nНовое совместное правительство формируется в Лондоне, а Эдуард VIII остается главой государства. В опубликованной "Декларации о союзе" новый Объединенный военный кабинет заявил:\n\n"Франция и Великобритания больше не будут двумя нациями, а будут единым франко-британским союзом. Конституция союза предусматривает совместные органы обороны, внешней, финансовой и экономической политики. Каждый гражданин Франции или Великобритании будет пользоваться немедленным гражданством другого государства.""
 news.35.a:0 "Французы, должно быть, были в отчаянии"
 news.35.b:0 "Думают, что под другим флагом будут в безопасности?"
 news.35.c:0 "Единение против общего врага!"
 news.36.t:0 "Аншлюс Австрии"
 news.36.d:0 "После успешного государственного переворота, осуществленного местной нацистской партией в Вене, германские войска пересекли австрийскую границу и взяли под контроль страну.\n\nСообщений о боевых действиях не поступало, немецких солдат встречали ликующие толпы в городах.\n\nВ своем выступлении перед многотысячной толпой на площади Хельденплац в Вене Гитлер объявил об аншлюсе Австрии, присоединив страну к Германии:\n\n"Старейшая восточная провинция немецкого народа отныне станет новейшим бастионом Германского рейха!"
 news.36.a:0 "Если они этого хотят..."
 news.36.b:0 "Добро пожаловать в рейх!"
 news.36.c:0 "Нам необходимо обезопасить наши северные границы!"
 news.36.e:0 "Это нарушает Версальский договор!"
 news.37.t:1 "Убийство Льва Троцкого"
 news.37.d:2 "Лев Троцкий, когда-то первый лейтенант и наследник преемника Владимира Ильича Ленина, умер сегодня в больнице Мехико. Он был атакован в своем доме ледорубом испанским гражданином, предположительно работавшим на НКВД.\n\nПосле неудачной борьбы за власть с $SOV_iosif_stalin$ и его союзниками за контроль над Коммунистической партией Советского Союза Троцкий провел тридцатые годы в изгнании, живя в Турции, Франции и Норвегии, прежде чем окончательно обосноваться в Мексике.\n\nОн оставался постоянным критиком Сталина и «дегенеративного рабочего государства» Советского Союза."
 news.37.a:0 "Варварство."
 news.37.b:0 "Миссия выполнена."
 news.37.c:0 "Подходящий конец для этого зачинщика беспорядков."
 news.38.t:0 "Троцкий выжил в покушении"
 news.38.d:2 "После жестокой борьбы в его доме в Мехико ранее сегодня Лев Троцкий убил потенциального убийцу ледорубом, которым тот пытался на него напасть. Убийца был идентифицирован как испанский гражданин, предположительно работавший на НКВД.\n\nТроцкий когда-то был первым лейтенантом и предполагаемым наследником Владимира Ленина, но после неудачной борьбы за власть он был вынужден отправиться в изгнание из Советского Союза $SOV_iosif_stalin$.\n\nВыступая перед прессой, Троцкий осудил покушение на него как «очередной трусливый заговор, организованный Сталиным, чтобы заставить замолчать его критиков»."
 news.38.a:0 "Интересно."
 news.38.b:0 "Этот червь!"
 news.39.t:0 "Троцкий убит на советской границе"
 news.39.d:1 "Советские власти опубликовали фотографии трупа Льва Троцкого, подтверждая слухи о том, что он был недавно убит при попытке пробраться в [SOV.GetNameDef].\n\nЕго тело было обнаружено выброшенным на берег реки Атрек, которая проходит вдоль советско-персидской границы.\n\nПредполагается, что Троцкий хотел воспользоваться нынешними беспорядками в СССР, чтобы найти союзников против своего давнего соперника Сталина и заменить его в результате государственного переворота."
 news.39.a:0 "Интересно."
 news.39.b:0 "По крайней мере, одной угрозой стало меньше."
 news.40.t:0 "Троцкий начинает переворот!"
 news.40.d:1 "Временной столице Советов произошла жестокая борьба за власть. Лев Троцкий, по-видимому, тайно проник в остатки СССР, положив конец длительному изгнанию, которое было ему навязано.\n\nВместе с союзниками в высших эшелонах Коммунистической партии он предпринял успешный переворот против Сталина.\n\nПосле краткого судебного разбирательства в Народном суде Сталин был приговорен к повешению. Приговор был приведен в исполнение сегодня утром."
 news.40.a:0 "Это было неожиданно."
 news.40.b:0 "Да здравствует товарищ Троцкий!"
 news.41.t:0 "Троцкий встречает свой конец"
 news.41.d:1 "Сегодня утром в номере отеля в Буэнос-Айресе был найден мертвым Лев Троцкий.\n\nПо-видимому, он был задушен альпинистским снаряжением, а убийца был схвачен телохранителями Троцкого еще до того, как смог покинуть здание.\n\nХотя убийца является португальским гражданином, имеются доказательства, связывающие его с советским разведывательным управлением ГРУ. Похоже, что Сталин, наконец-то, нанес смертельный удар своему старому сопернику."
 news.42.t:0 "Катастрофа Гинденбурга"
 news.42.d:0 "Сегодня в ходе попытки приземления на военно-воздушной базе Лейкхерст в Соединенных Штатах был уничтожен немецкий пассажирский дирижабль Гинденбург. По причинам, которые еще не выяснены, дирижабль загорелся и упал на землю, унеся 35 жизней.\n\nИз-за нехватки и дороговизны гелия и запрета США на его экспорт Гинденбург, как и все немецкие пассажирские дирижабли, был в конечном итоге спроектирован для использования водорода, который обеспечивает большую подъемную силу, но также является горючим.\n\nЭта катастрофа, подорвавшая общественное доверие, и появление намного более быстрых пассажирских самолетов могут ознаменовать конец эры дирижаблей."
 news.42.a:0 "О, человечество!"
 news.43.t:0 "Инцидент с Гинденбургом"
 news.43.d:0 "Сегодня удалось избежать большой беды, когда на борту немецкого пассажирского дирижабля \"Гинденбург\" была обнаружена утечка дизельного топлива при заходе на посадку в военно-морской воздушной станции Лейкхерст в Соединенных Штатах.\n\nУтечка была быстро устранена. Если бы её не обнаружили вовремя, воспламеняющиеся пары могли бы вызвать пожар, который уничтожил бы весь дирижабль.\n\nКритики уже давно сомневаются в целесообразности использования пассажирских дирижаблей из-за их ненадёжной репутации в плане безопасности, и этот инцидент, несомненно, заставит их ещё громче выражать свои сомнения."
 news.43.a:0 "Было близко."
 news.44.t:0 "Полёт Рудольфа Гесса"
 news.44.d:0 "Заместитель фюрера Рудольф Гесс был арестован вчера в Шотландии бойцами местного ополчения после того, как выпрыгнул с парашютом из тяжёлого истребителя.\n\nБудучи опытным пилотом, он, по-видимому, в одиночку перелетел Северное море, позаботившись о том, чтобы оставаться вне зоны действия радаров, прежде чем повернуть на запад к Великобритании.\nПо-видимому, Гесс сам решил договориться о мирном договоре между Великобританией и Германией, хотя Берлин осудил его как сумасшедшего и лишил каких-либо политических полномочий.\n\nБританские власти отказались от комментариев."
 news.44.a:0 "Интересно."
 news.44.b:0 "Безумие!"
 news.44.c:0 "Отправить его в Тауэр!"
 news.45.t:0 "Смерть Рудольфа Гесса"
 news.45.d:0 "Заместитель фюрера Рудольф Гесс погиб вчера, когда Королевские ВВС перехватили тяжелый истребитель, на котором он летел у берегов Шотландии. \n\nТочная цель его миссии остается неясной - хотя Гесс был опытным пилотом, он летел один, и его самолет, судя по всему, не был вооружен. \nБританские власти обнаружили его останки, но в Берлине запланированы государственные похороны с пустым гробом. \nКак сообщается, Гитлер был явно расстроен смертью своего старого друга."
 news.45.a:0 "Интересно."
 news.45.b:0 "Этот бедняга дурак."
 news.45.c:0 "Что он здесь делал?"
 news.46.d:0 "Дирижабль "Гинденбург" встретил сегодня трагический конец, взорвавшись над Шотландией. \nПо-видимому, он был захвачен заместителем фюрера Рудольфом Гессом, которому удалось в одиночку перелететь на нем через Северное море, чтобы лично вести переговоры о мире с Британией. \nБританские радиолокационные станции без труда обнаружили огромный летательный аппарат, и вскоре в его направлении были отправлены несколько авиакрыльев Королевских ВВС. Когда "Гинденбург" не ответил по радио, они открыли огонь. \nГесс выпрыгнул с парашютом и был благополучно задержан, а сейчас находится в заключении в лондонском Тауэре."
 news.47.d:0 "Дирижабль "Гинденбург" потерпел трагическое крушение, взорвавшись над Шотландией. \nКак выяснилось, его захватил заместитель фюрера Рудольф Гесс, который сумел в одиночку перелететь через Северное море, чтобы лично договориться о мире с Великобританией.\nБританские РЛС без труда обнаружили огромный дирижабль, и в его сторону немедленно были направлены несколько эскадрилий Королевских ВВС. После того, как "Гинденбург" не ответил на радиосвязь, по нему был открыт огонь.\n\nВ обломках дирижабля были обнаружены останки Гесса."
 news.47.b:0 "Этот безумец..."
 news.47.c:0 "На что он рассчитывал?"
 news.48.t:0 "Амелия Эрхарт пропала без вести"
 news.48.d:0 "Знаменитая летчица Амелия Эрхарт, первая женщина, совершившая одиночный перелёт через Атлантический океан, пропала вместе со своим штурманом Фредом Нунаном недалеко от острова Хауленд в Тихом океане.\n\nОни пытались совершить кругосветный перелет на своем двухмоторном самолете Lockheed Electra, когда исчезли. \nВ настоящее время ВМС и Береговая охрана США проводят поиски пропавших летчиков, но надежд на их спасение практически нет."
 news.48.a:0 "Потеря для авиации."
 news.49.t:0 "Амелия Эрхарт совершила кругосветное путешествие"
 news.49.d:0 "Известная летчица Амелия Эрхарт, многим известная как \"Королева Воздуха\", совершила кругосветный полет вместе со своим штурманом Фредом Нунаном.\n\nПосле небольшой паники, когда пара временно заблудилась при приближении к острову Хоуленд в Тихом океане, полет прошел без происшествий, и этим утром их Lockheed Electra приземлился в Окленде, Калифорния.\nНа следующей неделе в Белом доме состоится церемония, где Эрхарт лично поздравит президент за ее подвиг."
 news.49.a:0 "Неплохое достижение!"
 news.55.t:0 "Англо-Польский Альянс"
 news.55.d:0 "В свете недавнего агрессивного поведения Германии, Соединенное Королевство и Франция сочли необходимым подписать военный союз с Польшей. Британский премьер-министр сделал следующее заявление в Палате общин:\n\n\"В случае любых действий, которые явно угрожают независимости Польши и которым польское правительство, соответственно, посчитает необходимым противостоять своими национальными силами, правительство Его Величества будет считать себя обязанным немедленно оказать польскому правительству всю поддержку, которая в его силах. Они дали польскому правительству заверения в этом.\""
 news.55.a:0 "События развиваются быстро."
 news.55.b:0 "Они блефуют!"
 news.55.c:0 "Мы поддерживаем Польшу."
 news.55.e:0 "Немцы теперь не осмелятся напасть!"
 news.55.f:0 "Мы выступаем вместе с нашими союзниками."
 news.56.t:0 "Мюнхенское соглашение"
 news.56.d:1 "German demands for the Sudeten territory in Czechoslovakia, which is home to a considerable German minority, have intensified. \n\nAt a summit held in Munich, Germany, Britain, France and Italy sought to find a diplomatic solution to the so-called Sudeten Crisis. Czechoslovakia was not invited to attend. An agreement was reached in which Germany annexes the Sudetenland, but will not pursue any further territorial gains in Europe.\n\nMr. Chamberlain spoke to crowds in London:\nFor the second time a Prime Minister has returned from Germany bringing peace with honor. I believe it is peace for our time."
 news.56.a:0 "No war this year then."
 news.56.b:0 "Peace for now at least..."
 news.56.c:0 "We have been spared another World War."
 news.56.e:0 "This is not an agreement, it is a diktat!"
 news.57.t:0 "The Sudeten Crisis"
 news.57.d:0 "German demands for the Sudeten border territory in Czechoslovakia, which is home to a considerable German minority, have intensified recently. \n\nAt a summit held in Munich, Germany, Britain, France and Italy sought to find a diplomatic solution to the so-called Sudeten Crisis.\n\nThe talks appear to have failed, however, with both Britain and its Allies uttering stern warnings to Germany that if its troops crosses the Czechoslovakian border, the result would be war. \n\nTime seems to be running out for a peaceful solution to the dispute."
 news.57.a:0 "It looks like there will be war!"
 news.57.b:0 "Fools!"
 news.57.c:0 "Пора принимать меры."
 news.57.e:0 "Пусть немцы попробуют!"
 news.58.d:0 "Недавно участились германские требования передать Судетскую область в состав Чехословакии, на территории которой проживает немалое количество немцев. \n\nНа саммите в Мюнхене (Германия) Великобритания, Франция и Италия попытались найти дипломатическое решение так называемого «судетского кризиса».\n\nМежду Францией и Великобританией возник разлад из-за того, что Великобритания признала германские требования обоснованными, а Франция — нет. Французы заключили новый союз с чехами и пригрозили Германии войной, если ее войска нарушат чехословацкую границу."
 news.58.b:0 "С французами мы скоро разберемся."
 news.58.c:0 "Теперь французы предоставлены сами себе."
 news.58.e:0 "Немцы сейчас не решатся напасть… не так ли?"
 news.58.f:0 "Свободный мир возлагает на нас надежды."
 news.59.t:0 "Мюнхенский диктат"
 news.59.d:0 "Недавно участились германские требования передать Судетскую область в состав Чехословакии, на территории которой проживает немалое количество немцев. \n\nНа саммите в Мюнхене (Германия) Великобритания, Франция и Италия попытались найти дипломатическое решение так называемого «судетского кризиса».\n\nВеликобритания и Франция признали германские требования обоснованными, однако Чехословакия, которую не пригласили на конференцию, отказалась уступить хоть дюйм территории. \n\nТеперь она в одиночку противостоит Германии в, казалось бы, безнадежной битве."
 news.59.a:0 "У чехов мало шансов."
 news.59.b:0 "Упрямые дураки"
 news.59.c:0 "Мы никогда не сдадимся!"
 news.60.t:0 "Судьба Чехословакии"
 news.60.d:0 "Немецкие войска вошли в Богемию и Моравию, якобы для восстановления порядка в регионах после краха чехословацкого правительства. \n\nВ Праге оккупационные войска объявили о создании автономного протектората в рамках Германского рейха. \n\nПри поддержке Германии Словакия была объявлена независимой под руководством Йозефа Тисо. Государство Чехословакия больше не существует"
 news.60.d_2:0 "После аннексии Чехословакии Германией продолжились дискуссии о том, как следует разделить эти территории, теперь, похоже, выработан окончательный вариант. \n\nПри поддержке Германии Словакия была объявлена независимой под руководством Йозефа Тисо"
 news.60.a:0 "Вот тебе и мир"
 news.60.b:0 "Чехов нужно защитить от них самих"
 news.60.c:0 "Это не то, о чём мы договаривались!"
 news.60.e:0 "Венгрия восстановит свою былую славу!"
 news.61.d:0 "Немецкие войска недавно вошли в Богемию и Моравию, якобы для восстановления порядка в регионах после краха чехословацкого правительства. \n\nВ Праге оккупационные войска объявили о создании автономного протектората в составе [GER.GetNameDef]. Венгерские войска, действовавшие с согласия Германии, вступили в Словакию и аннексировали ее в состав Венгрии. \n\nГосударство Чехословакия больше не существует"
 news.61.d_2:0 "После аннексии Чехословакии Германией продолжались дискуссии о том, как следует разделить эти территории, и, похоже, теперь решение найдено.\n\nВенгерские войска, действующие с согласия Германии, вошли в Словакию и присоединили ее к Венгрии."
 news.62.d:0 "Недавно немецкие войска вошли в Богемию и Моравию, якобы для восстановления порядка в регионах после краха чехословацкого правительства.\n\nВ Праге оккупационные силы объявили о создании \"автономного протектората\" в составе Германского Рейха.\n\nВторой протекторат, сосредоточенный вокруг Словакии, также был объявлен в Братиславе. Вся Чехословакия фактически аннексирована Германией."
 news.62.d_2:0 "После аннексии Чехословакии Германией продолжались дискуссии о том, как следует разделить эти территории, и, похоже, теперь решение найдено.\n\nАннексированная территория была разделена на два протектората, но остается под контролем Германии. На практике мало что изменилось по сравнению с предыдущим периодом, и Германия сохранила контроль над всей территорией Чехословакии."
 news.63.t:0 "Гражданская война в Испании"
 news.63.d:0 "В Испании разгорелась гражданская война! Несколько генералов, стремящихся свергнуть действующее правительство в Мадриде, выпустили прокламацию, и значительная часть испанских вооруженных сил откликнулась на их призыв к оружию. \n\nЭта правая националистическая фракция оккупировала большую часть Испании, включая заморские территории.\nПод левым республиканским правительством собрались верные правительству силы и добровольцы, решительно настроенные сопротивляться путчу до последнего вздоха. \n\nНачалось сражение за Испанию."
 news.63.a:0 "Что это будет значить для Испании?"
 news.63.b:0 "К победе!"
 news.64.t:0 "Конец гражданской войны в Испании"
 news.64.d:0 "С капитуляцией последних республиканских опорных пунктов гражданская война в Испании подошла к концу. \n\nНационалисты одержали победу, и для Испании началась новая эра. \n\nРаздираемая войной страна сильно пострадала в боях, и предстоит еще много восстановительных работ."
 news.64.a:1 "Интересное развитие."
 news.64.b:0 "Теперь исцелить нашу нацию."
 news.65.a:0 "Хорошо для Испании."
 news.65.d:0 "С капитуляцией последних националистических сил гражданская война в Испании подошла к концу. \n\nРеспубликанцы одержали победу, и для Испании началась новая эра. \n\nРаздираемая войной страна сильно пострадала в боях, и предстоит еще много восстановительных работ."
 news.66.t:0 "Игры XI Олимпиады"
 news.66.d:0 "Недавно в Берлине, Германия, прошли одиннадцатые Олимпийские игры.\n\nВ Летних Олимпийских играх 1936 года, в которых приняли участие спортсмены из 49 разных стран мира, впервые в истории была организована частичная трансляция в прямом эфире. Игры стали крупной пропагандистской победой для немецкого режима, который потратил на мероприятие огромные средства.\n\nНаибольшего успеха добились немецкие спортсмены, завоевавшие 33 золотые медали, в то время как американцы заняли второе место с 24 медалями. Четыре из них выиграл Джесси Оуэнс, самый успешный спортсмен Игр."
 news.66.d.b:0 "Одиннадцатые Олимпийские игры недавно прошли в нетронутых частях разрушенного и вновь отстраиваемого Берлина, Германия\n\nВ Летних Олимпийских играх 1936 года, в которых приняли участие спортсмены из 49 разных стран мира, впервые в истории была организована частичная трансляция в прямом эфире. Игры, ставшие символом восстановленного немецкого национального единства, также стали крупной пропагандистской победой для нового немецкого режима, который, несмотря на огромные расходы на восстановление нации после гражданской войны, потратил на мероприятие огромные средства.\n\nНаибольшего успеха добились немецкие спортсмены, завоевавшие 33 золотые медали, в то время как американцы заняли второе место с 24 медалями. Четыре из них выиграл Джесси Оуэнс, самый успешный спортсмен Игр."
 news.66.a:0 "Игры завершены."
 news.66.b:0 "Мы показали миру свою лучшую сторону."
 news.67.t:0 "Игры XII Олимпиады"
 news.67.d:0 "Недавно в Токио, Япония, прошли двенадцатые Олимпийские игры. В свете растущей международной напряженности многие опасались, что Игры будут отменены, но этого не произошло.\n\nТокио стал первым не-западным городом, который принимал Олимпиаду, и специально сконструированный дальнемагистральный самолет Me 261 доставил туда Олимпийский огонь из Германии без дозаправки.\n\nЯпонские спортсмены выступили хорошо и их 14 золотых медалей принесли им третье место в общем зачете после Германии и США."
 news.68.d:0 "Недавно в Хельсинки, Финляндия, прошли двенадцатые Олимпийские игры.\n\nИзначально Игры должны были проходить в Токио, но продолжающиеся военные действия в Японии сделали это невозможным, и Международный олимпийский комитет вместо этого вручил их Хельсинки.\n\nСпортсмены из США завоевали наибольшее количество медалей, за ними следовали Германия, а затем Италия. Финляндия заняла четвертое место с 10 золотыми медалями."
 news.69.t:0 "Советская экспансия в Европе"
 news.69.d:0 "С приходом к власти [From.GetRulingParty] [From.GetNameDef] стремился к более тесным отношениям с [SOV.GetNameDef] и теперь присоединился к самому Союзу.\n\nНесколько дней назад [From.GetAdjective] правительство официально передало управление страной [SOV.GetNameDef] в качестве интегрированной области.\n\nСоветские официальные лица отказываются признавать описания недавней ассимиляции [From.GetNameDef] как агрессивной, утверждая, что «интеграция территории» произошла без какого-либо внешнего давления."
 news.69.a:0 "Они поняли."
 news.69.b:0 "Расширение [SOV.GetNameDefCap]."
 news.70.t:0 "Советское влияние в Европе"
 news.70.d:0 "С приходом к власти [baltic_annexation.GetRulingParty] [baltic_annexation.GetNameDef] стремился к более тесным отношениям с [SOV.GetNameDef].\n\nХотя [baltic_annexation.GetLeader] остается в должности, министры выбираются за их верность [SOV.GetNameDef], и большая часть суверенитета нации была передана. Советские официальные лица заявляют, что [baltic_annexation.GetName] просто ищет защиты в ответ на то, что Европа становится все более опасной для небольших наций.\n\n[SOV.GetNameDef] также повторил, что они готовы распространить такую «защиту» на любое государство, которое чувствует угрозу со стороны соседних стран."
 news.100.t:0 "Падение Варшавы"
 news.100.d:0 "Германские войска, продвигающиеся в Польше, сумели взять Варшаву.\n\n Отдельные бои продолжаются в Праге и некоторых других районах, но, похоже, что организованное сопротивление в городе прекратилось. \n\n По сообщениям, польское правительство эвакуировалось из города, когда первые немецкие части вошли в предместья Варшавы, и их нынешнее местонахождение неизвестно.\n\nБои с немецкими захватчиками продолжаются в других частях страны, но потеря столицы является серьезным ударом для военных действий Польши."
 news.100.a:0 "У Польши не было шансов."
 news.100.b:0 "Еще одна победа для Фатерланда."
 news.100.c:0 "Это катастрофа!"
 news.101.t:0 "Падение Парижа"
 news.101.d:0 "Пока в других частях Франции продолжаются бои, поступили сообщения о том, что немецкие войска вошли в Париж.\n\nЗа несколько минут до отступления последних подразделений французские силы объявили столицу открытым городом. Несколько колонн немецких войск воссоздали парад победы Пруссии 1871 года, пройдя маршем по Елисейским полям, в то время как парижане ошеломленно наблюдали за происходящим в тишине.\n\nВоенные эксперты прогнозируют скорое падение Франции."
 news.101.a:0 "Армия [GER.GetNameDefCap] кажется непобедимой!"
 news.102.t:0 "Падение Лондона"
 news.102.d:0 "Согласно сообщениям из Лондона, английская столица пала, захваченная наступающими немецкими войсками. \n\nМестами все еще слышится стрельба из стрелкового оружия, но в городе не замечено существенных сил британцев.\n\nОтряд десантников атаковал Букингемский дворец, но предполагается, что королевская семья была эвакуирована задолго до нападения. \n\nВпервые со времен Вильгельма Завоевателя Лондон пал под натиском чужеземных захватчиков."
 news.103.t:1 "Падение [195.GetCapitalVictoryPointName]"
 news.103.d:1 "[195.GetCapitalVictoryPointName], родина русской революции, пала под натиском наступающих немецких войск. \n\nМестами все еще слышна перестрелка, но над остальной частью разрушенного города, кажется, царит зловещая тишина.\n\nСегодня утром колонны немецких солдат прошли маршем мимо Исаакиевского собора, чей купол был покрашен в серый цвет инженерами [SOV.GetSovietArmyAdjectiveBasedOnIdeology] армии, чтобы избежать внимания мародеров Люфтваффе. \nНесмотря на их усилия, он весь в выбоинах от пуль и осколков снарядов."
 news.103.c:0 "За это кому-то всыпят!"
 news.104.t:0 "Падение Киева"
 news.104.d:0 "Столица Украинской ССР Киев захвачена наступающими немецкими армиями в Советском Союзе. \n\nВзятие одного из важнейших городов является серьезным ударом для Советов, но все еще остается вопрос, смогут ли немцы сохранить свой импульс. Через несколько минут после того, как немцы заняли город, тысячи мин, установленных НКВД, были, по-видимому, взорваны в зданиях на главной улице Крещатик, нанеся еще больший ущерб уже разрушенному городу.\n\nТеперь наступающие силы смотрят на восток."
 news.105.t:1 "Падение [217.GetCapitalVictoryPointName]"
 news.105.d:0 "Наступающие немецкие авангарды захватили Сталинград, город Сталина на берегу Волги. \n\nПосле прорыва через разрушенный Сталинградский тракторный завод и захвата стратегически важных мамайских высот немцы оттеснили последних защитников Советского Союза через Волгу на ее восточный берег. Согласно непроверенным данным, уцелевшие из Красной Армии, сражающиеся вместе с партизанами, отступили в канализацию и подвалы, чтобы продолжить борьбу. \n\nОднако, как полагают, никакого значительного организованного сопротивления не осталось."
 news.105.d_alt:1 "Прорываясь вперёд, германские части завладели [217.GetCapitalVictoryPointName] - индустриальным центром на берегу Волги.\n\nПробившись с боями через разрушенный Сталинградский тракторный завод и взяв стратегически важные высоты Мамаева кургана, немцы вытеснили последних защитников [SOV.GetAdjective] за Волгу, на её восточный берег. Поступают непроверенные сведения, что бойцы [SOV.GetSovietArmyAdjectiveBasedOnIdeology] армии и партизаны отошли в подвалы и канализацию, чтобы продолжать сопротивление.\n\nОднако существенного организованного сопротивления, как предполагается, уже не осталось."
 news.106.t:0 "Падение Москвы"
 news.106.d:0 "На рассвете этого дня германские танки прорвали наспех возведённые баррикады на улицах Москвы, а на Красной площади были замечены полугусеничные бронетранспортёры, высаживающие панцергренадёров.\nИз-за многочисленных пожаров, бушующих в пригородах, к небу поднимались густые клубы дыма, пока германская пехота штурмовала Кремль. Сообщается, что для выбивания упорно сопротивлявшихся бойцов НКВД из комплекса пришлось применять гранаты и огнемёты. Сейчас столица России находится в руках немцев, но стала выжженной руиной.\n\nНеподтверждённые данные указывают на то, что забальзамированный труп Ленина был благополучно эвакуирован на восток."
 news.106.a:0 "Это конец Советского Союза?"
 news.106.b:0 "Наконец-то, Москва наша!"
 news.106.c:0 "Фашисты должны быть изгнаны из Москвы!"
 news.107.t:0 "Падение Севастополя"
 news.107.d:0 "Мощно укрепленный город Севастополь, база Черноморского флота СССР, в конце концов пал под натиском немецких войск. \n\nЕго потеря существенно затруднит Советскому Союзу попытки оспорить контроль над Черным морем, а взятие города расценивается как важная победа Германии.\n\nИз Берлина уже издан указ, гласящий, что город отныне будет называться Теодорихсхафен — в честь Теодориха Великого."
 news.108.t:0 "Падение Баку"
 news.108.d:0 "Сегодня немецким войскам удалось захватить город Баку — стратегически важную цель в войне против Советского Союза. \n\nРасположенный на берегу Каспийского моря, город является ключом к Кавказу, а его многочисленные нефтяные месторождения наверняка окажут содействие германским военным усилиям.\n\nЗахват Баку дает Германии возможность расширить войну на Ближний Восток и, возможно, даже на Индию."
 news.109.t:0 "Падение Каира"
 news.109.d:0 "Войска из состава Африканского корпуса вермахта прорвались в Каир, столицу Египта. \n\nКогда войска союзников в беспорядке отступили дальше вглубь пустыни, многие жители Каира приветствовали вступающих в город немецких солдат как освободителей, поскольку англичане считались угнетателями.\n\nПадение Каира — серьезная потеря для союзников, и многие эксперты предполагают, что весь Ближний Восток теперь беззащитен перед немецким завоеванием."
 news.110.t:0 "Падение Вашингтона"
 news.110.d:0 "Бои в районе Вашингтона завершились сегодня, когда последние очаги сопротивления в городе были ликвидированы немецкими войсками, наступавшими вдоль Потомака. \n\nГустой слой дыма висит над городом, и, как сообщается, часть его исходит от агентов УСС, сжигавших секретные документы до последнего момента. Отряд Ваффен-СС захватил Белый дом после короткой перестрелки с сотрудниками Секретной службы США, но считается, что президент был эвакуирован несколько дней назад. \n\nПадение американской столицы иллюстрирует ужасающую мощь германской военной машины."
 news.111.t:0 "Падение Нью-Йорка"
 news.111.d:0 "После нескольких часов уличных боев, во многом, как сообщается, против вооруженных иррегулярных формирований, немецкие передовые отряды вошли в Нью-Йорк и взяли город под свой контроль. \n\nИмпровизированные противотанковые заграждения, размещенные вдоль Пятой авеню, оказались неэффективными, и панцергренадеры с боями продвигались по Манхэттену, квартал за кварталом.\n\nВ восточных частях города уже несколько дней бушуют неконтролируемые пожары, освещающие горизонт ночью. \n\nСтатуя Свободы была обезглавлена шальным артиллерийским снарядом, хотя точная сторона, произведшая выстрел, остается предметом споров."
 news.112.t:0 "Падение Гибралтара"
 news.112.d:0 "После нескольких противоречивых сообщений теперь подтверждено, что Гибралтар пал под властью Германии. \n\nЭтот стратегический портовый город охраняет вход в Средиземное море, и до начала войны он считался неприступным. Британский гарнизон отступил в туннели, пролегающие под Скалой, но в конечном счете был выбит огнеметами и гранатами. \n\nПосле того как Гибралтар перешел в руки Германии, в битве за Средиземноморье произошел резкий сдвиг в соотношении сил."
 news.113.d:1 "Сегодня в Каир торжественно вошли ликующие итальянские солдаты через мгновения после того, как последние британские части покинули город. \n\nНемедленно был организован парад победы, и итальянские солдаты толпами отправились к Великим пирамидам Гизы, чтобы сфотографироваться на фоне знаменитых достопримечательностей.\n\nТеперь, когда Каир находится под контролем, [ITA.GetLeader] стал на шаг ближе к объединению Итальянской Восточной Африки с Итальянской Ливией и образованию единой колонии в Африке."
 news.113.b:0 "Еще одно завоевание для Италии!"
 news.114.d:1 "[GetItalianConquestofParisDesc]"
 news.114.d_leader:0 "Последние очаги французского сопротивления в Париже были ликвидированы сегодня, и город теперь находится под полным контролем Италии. \n\n[ITA.GetLeader] был спешно доставлен в город, чтобы участвовать в параде победы на Елисейских полях верхом на белом жеребце во главе марширующих войск. Во время празднований он сравнил нынешнюю кампанию во Франции с завоеванием Галлии Цезарем и пообещал, что это только начало восхождения Италии к величию.\n\nВремя покажет, прав ли он."
 news.114.d_council:0 "Последние очаги французского сопротивления в Париже были ликвидированы сегодня, и город теперь находится под полным контролем Италии. \n\n[ITA.GetLeader] был спешно доставлен в город, чтобы участвовать в параде победы на Елисейских полях верхом на белых жеребцах во главе марширующих войск. Во время празднований прозвучали сравнения нынешней кампании во Франции с завоеванием Галлии Цезарем, и от нескольких членов совета прозвучали обещания, что это только начало восхождения Италии к величию.\n\nВремя покажет, правы ли они."
 news.115.d:0 "Итальянские силы успешно штурмовали Лондон, а итальянский триколор был поднят над Викторианской башней. Небольшие бои продолжаются в некоторых частях города, и сегодня утром в инциденте несколько берсальеров были расстреляны снайперами, скрывавшимися на вершине Биг-Бена.\n\nПосле трех неудачных попыток выбить их, вся часовая башня была снесена подрывными зарядами в ходе того, что итальянские официальные лица описывают как «досадную чрезмерную реакцию» местного командира."
 news.116.d:0 "Судя по всему, Италия взяла под контроль Гибралтар после, как сообщается, тяжелых боев в районе Рок и гавани. Периодически еще можно слышать взрывы из военных туннелей, проходящих глубоко под Роком, но итальянские чиновники заявляют о прекращении какого-либо организованного сопротивления.\n\nПоскольку эти жизненно важные ворота в Средиземное море находятся под контролем Италии, британским военно-морским силам будет трудно противостоять Королевскому флоту Италии в регионе."
 news.117.t:0 "Падение Сингапура"
 news.117.d:0 "Сингапур, «Гибралтар Востока», был захвачен войсками Императорской Японии, несмотря на то, что его бывшие британские владельцы считали его неприступной крепостью.\n\nЯпонская военная администрация Сингапура выбрала здание Фуллертон в качестве своей штаб-квартиры, и город был переименован в Сёнанто, что примерно переводится как «Южный остров, захваченный в эпоху Сёва». Кемпэйтай можно увидеть патрулирующими улицы в массовом порядке, чтобы вбить в сознание мысль о том, что японцы здесь надолго."
 news.117.b:0 "За Императора!"
 news.118.t:0 "Падение Перл-Харбора"
 news.118.d:0 "Японские войска штурмом взяли Гонолулу, крупнейший город на гавайском острове Оаху. Военно-морская база в Перл-Харборе, бывшая штаб-квартира Тихоокеанского флота США, также пала.\n\nПо словам очевидцев, изнуренные американские моряки и морские пехотинцы отступили на остров Форд, где продолжали оказывать упорное сопротивление, пока не подверглись интенсивному артиллерийскому и авиационному обстрелу. С захватом этого острова дальность действия Императорского флота Японии стала еще больше."
 news.119.t:0 "Падение Нового Южного Уэльса"
 news.119.d:0 "Продолжая расширять свои завоевания на юге, Японская империя захватила Сидней и столицу Австралии Канберру. Местные защитники были вынуждены отступить через мост через гавань Сиднея на новые позиции на Обсерваторном холме, но попытки разрушить мост были сорваны наступающими японскими войсками, которые затем двинулись на Канберру.\n\nТеперь японский военный флаг можно увидеть на здании парламента в Канберре, которое служит штаб-квартирой новой военной администрации, а военная полиция Кэмпэйтай бдительно следит за улицами."
 news.120.t:0 "Падение Лос-Анджелеса"
 news.120.d:0 "Завоевав плацдарм на континентальной части Америки, японские войска двинулись на Лос-Анджелес и выбили защитников города. Длинная колонна имперских войск маршировала по Центральному проспекту сегодня днем, в то время как японские операторы кинохроники снимали происходящее.\n\nПеред отступлением американских войск в нескольких районах города велись ожесточенные бои. Голливуд пострадал особенно сильно, и многие японские офицеры сфотографировались на фоне разрушенной вывески Голливуда."
 news.121.t:0 "Падение Нанкина"
 news.121.d:0 "Столица Китайской республики Нанкин была оккупирована войсками Японской Империи. Несмотря на ожесточенное сопротивление китайских защитников, окруженного стенами города, японским войскам удалось захватить ворота Чжуншань и ворваться в город.\n\nВсе еще слышна редкая стрельба и в разных частях города бушует несколько пожаров, но большинство оставшихся в живых китайских войск либо отступили, либо были захвачены в плен. Наряду с захватом Шанхая, это является значительной победой для Японии в войне против Китая."
 news.122.t:0 "Падение Владивостока"
 news.122.d:0 "Владивосток, крупнейший город на Дальнем Востоке России и место базирования советского Тихоокеанского флота, был захвачен японскими войсками. Его стратегическое положение на дальнем конце Транссибирской магистрали делает его потерю тем более пагубной для советских военных действий в Азии.\n\nМногие жители города еще помнят японскую оккупацию, которая длилась несколько лет во время Гражданской войны в России. На этот раз некоторые опасаются, что им никогда не удастся выгнать захватчиков."
 news.123.t:0 "Падение Гонконга"
 news.123.d:0 "Японская империя взяла штурмом британскую колонию Гонконг, прорвав линию Джиндринкерс и высадившись на острове Гонконг. Вскоре защитники оказались в безвыходном положении, а губернатор лично сдался в гостинице Peninsula Hong Kong, где расположился штаб японской армии.\n\nПосле краткой церемонии был назначен новый губернатор, объявивший миру о «Новом Гонконге», «свободном от западного колониализма»."
 news.124.t:0 "Падение Манилы"
 news.124.d:0 "Манила, столица Филиппин, перешла в руки Японии после ухода американских и филиппинских защитников. Подход к стратегически важному заливу Манила некоторое время оспаривался, так как на острове Коррехидор сосредоточилось большое количество американской береговой артиллерии. Однако орудия в конце концов замолкли после согласованного нападения Японии.\n\nПосле перехода Манилы под японский контроль ожидается, что остальная часть Филиппин вскоре последует за ней. Это поражение наносит сильный удар по американским войскам в Азии и Тихом океане."
 news.125.t:0 "Падение Калькутты"
 news.125.d:0 "После периода интенсивных бомбардировок теперь подтверждено, что город Калькутта в Индии пал перед наступающими японскими силами. Несмотря на то, что на окраинах города все еще происходят спорадические бои, на проспекте Чоурингхи был быстро организован парад победы.\n\nЧлены Индийской национальной армии, военного подразделения, организованного японцами и нацеленного на освобождение Индии от Британии, приняли участие в параде и вызвали дикие аплодисменты толпы. После падения Калькутты многие предсказывают, что вскоре за этим последует вся Британская Индия."
 news.126.t:0 "Падение Нью-Дели"
 news.126.d:0 "Японские наступления продолжаются в Индии, и недавно произошло падение Нью-Дели. Как столица Британской Индии этот город имеет огромное стратегическое значение, и его потеря может оказаться решающим фактором в продолжающейся индийской кампании.\n\nСам вице-король, как сообщается, был схвачен японскими передовыми частями, когда он контролировал перемещение своих вещей из вице-королевского дома в караван грузовиков, но это еще не подтверждено."
 news.127.t:0 "Падение Панамского канала"
 news.127.d:0 "В ударе по американским военным усилиям, который можно считать поистине сокрушительным, японские войска высадились в Панаме и взяли под контроль канал после того, как заставили гарнизон сдаться. Сообщается, что несколько групп американских и панамских солдат бежали в близлежащие джунгли, чтобы вести партизанскую войну, но не считается, что они могут существенно помешать присутствию японцев.\n\nС падением канала американским военно-морским силам теперь приходится огибать Южную Америку, чтобы добраться до западного побережья США, что дает Императорскому японскому флоту значительное стратегическое преимущество."
 news.128.t:0 "Падение Берлина"
 news.128.d:0 "Взятие немецкой столицы подтвердили чиновники в Вашингтоне после того, как американские войска пробились в Берлин с нескольких направлений. Бои в городе были описаны как интенсивные, Мольтке-Брюке была разрушена отчаявшимися немецкими пионерами, чтобы остановить наступление американцев.\n\nВ конце концов, другие мосты через Шпрее были захвачены, и морские пехотинцы успешно штурмовали Оперный театр Кролля и Рейхстаг, несмотря на ожесточенное сопротивление немцев. Звездно-полосатый флаг развевается на ветру над Рейхстагом, и бои в городе прекратились. Битва за Берлин окончена."
 news.128.b:0 "Пример операции для учебника!"
 news.129.d:0 "Британские войска продвинулись в Берлин, и Военный кабинет объявил об успешном захвате столицы Германии после ожесточённой битвы. Британские коммандос, нанеся удар на рассвете, захватили аэропорт Темпельхоф, в то время как бронированные колонны продвигались вдоль Франкфуртской аллеи.\n\nБои в городе в основном прекратились, так как имперская канцелярия перешла под контроль Великобритании. Текущий статус немецкого правительства остаётся неясным, но есть основания полагать, что некоторые его элементы успели покинуть город до его падения."
 news.129.b:0 "Отличная работа, парни!"
 news.130.d:0 "Французские войска успешно взяли штурмом столицу Германии, которая пала после серии ожесточённых сражений в черте города. Многочисленная группа солдат Ваффен-СС забаррикадировалась на Олимпийском стадионе, который в конечном итоге пал после решительного наступления Иностранного легиона при поддержке артиллерии.\n\nТеперь над имперской канцелярией развевается французский триколор, и, хотя в некоторых пригородах все ещё поступают сообщения о спорадических перестрелках, считается, что большая часть Берлина очищена от организованного сопротивления."
 news.130.b:0 "Да здравствует Франция!"
 news.131.d:0 "Отчаянные бои в столице Германии, Берлине, но город уже считается полностью в руках поляков. Прорвавшись по Франкфуртер-аллее, поляки добрались до Александерплац, где столкнулись с упорным сопротивлением.\n\nВ других районах города, Бранденбургские ворота рухнули, предположительно, после того как в них врезался польский танк, а Государственная опера им. Кролля была разрушена артиллерийским обстрелом после того, как ее упрямые защитники из СС отказались сдаться. Красные и белые полотна польского флага теперь развеваются над Рейхстагом, а последние очаги сопротивления подавлены."
 news.131.b:0 "Польского колосса не остановить."
 news.132.t:0 "Падение Рима"
 news.132.d:0 "Недавно в Рим вошли силы Союзников после того, как его гарнизон сдался, и город перешел под военную оккупацию. Большинство исторических памятников осталось нетронутым, выдержав очередную битву за контроль над городом. Пока что, по просьбе Святого Престола, войска союзников не вошли на территорию Ватикана.\n\nПадение Рима — важный этап в итальянской кампании, и некоторые задаются вопросом, означает ли это конец организованного сопротивления наступающим армиям союзников на полуострове."
 news.132.b:0 "Великая победа!"
 news.133.d:0 "Недавно в Рим вошли французские войска, после того как оставшийся итальянский гарнизон города растворился в окружающей сельской местности. Французские войска быстро заняли все важные правительственные здания и провели \"триумф\" на Виа-дель-Корсо, где прошла долгая колонна пехотинцев и бронетехники.\n\nС падением Рима ставится под вопрос дальнейшее ведение войны Италией. Внешние наблюдатели ожидают, что итальянское правительство, бежавшее из города перед его падением, вскоре начнёт переговоры о капитуляции."
 news.134.t:0 "Освобождение Парижа"
 news.134.d:0 "Было окончательно подтверждено, что Париж, столица Франции, был освобождён от немецкой оккупации. В город вошли силы союзников, и оставшийся немецкий гарнизон сдался. Горожане приветствовали своих освободителей на Елисейских полях, даже несмотря на то, что в некоторых частях города ходили слухи о немецких снайперах.\n\nБыло опасение, что немцы воспользуются тактикой выжженной земли и оставят Париж пылающими руинами, но главные городские достопримечательности, судя по всему, не пострадали. И действительно, в данный момент с Эйфелевой башни развевается французский триколор."
 news.135.t:0 "Падение Токио"
 news.135.d:0 "Американские войска вошли в Токио. Министерство обороны США заявило о завершении крупномасштабных военных операций в этом городе. Бои были ожесточёнными, особенно в районе Императорского дворца, который обороняли фанатики из Императорской гвардии, несмотря на то, что, по сообщениям, Император покинул город ещё до начала штурма американцами.\n\nС падением Токио эксперты предсказывают, что организованное сопротивление на остальных японских островах вскоре будет подавлено. Предполагается, что в скором времени начнутся мирные переговоры, если только сторонники жёсткой линии в Японии не убедят Императора сражаться насмерть."
 news.136.d:1 "После серии ожесточенных сражений войска союзников заняли Москву, столицу [SOV.GetNameDef]. Город сильно пострадал, и пожары все еще не утихают по обе стороны от Москвы-реки. Несмотря на интенсивные бомбардировки, Кремль почти не пострадал, и он был выбран в качестве штаб-квартиры администрации союзников, занимающейся оккупацией.\n\nПосле потери Москвы военные усилия Советского Союза претерпели колоссальный крах. Хотя, по общему мнению, большая часть правительства была эвакуирована из города задолго до его падения, военные эксперты утверждают, что полный крах СССР может быть не за горами."
 news.137.t:0 "Освобождение Лондона"
 news.137.d:0 "Бои в Лондоне закончились, последние очаги сопротивления немцев были подавлены. Сразу же после того, как был отдан отбой воздушной тревоги, ликующие толпы высыпали на улицы, чтобы отпраздновать своих американских освободителей. По всему городу слышен звон церковных колоколов.\n\nЛикование охватило Британию, так как теперь, наконец, становится ясно, что немецкая оккупация подходит к концу. Сообщается о стихийных восстаниях в районах, все еще находящихся под контролем Германии, хотя эти инциденты жестко пресекались. Наконец ли вернулась свобода в Соединенное Королевство?"
 news.138.d:0 "В отличие от 1920 года, когда советские войска подошли к Варшаве, в этом году \"Чуда на Висле\" не произошло. Сопротивление поляков в городе в основном прекратилось, и над большинством правительственных зданий реет советский флаг.\n\nСтали ли мы свидетелями конца польской нации или же ее войскам каким-то образом удастся оправиться и отбить свою столицу? Большинство экспертов считают такой сценарий маловероятным."
 news.138.b: "[GetSOVIdeologyLondonResponse]"
 get_SOV_ideology_london_response: "Вперед, товарищи!"
 get_SOV_ideology_london_response_alt: "Вперед!"
 news.139.t:0 "Освобождение Варшавы"
 news.139.d:0 "Опустошенный город Варшава пал под натиском советских армий после того, как последние немецкие защитники отступили из его горящих пригородов. Большая часть города лежит в руинах после предыдущих сражений, и местные члены сопротивления поспешно вышли из-под обломков, чтобы приветствовать своих освободителей.\n\nС Варшавой под советским контролем стратегическая ситуация для Германии в Восточной Европе может вскоре еще более ухудшиться. Эксперты сомневаются, что они смогут организовать контратаку для отвоевания города, но измученное местное население не столь убеждено в этом."
 news.139.a:0 "Это начало конца...?"
 news.140.d:0 "В советском коммюнике было объявлено о капитуляции всех немецких войск в Берлине. После окружения города русские штурмовали его с нескольких разных направлений, а немецкие защитники яростно сопротивлялись на каждом шагу.\n\nСоветские войска, наконец, прорвались через мост Мольтке в здание Рейхстага, сражаясь в каждой комнате, пока не достигли крыши, где над городом был поднят советский флаг. Битва за Берлин окончена."
 news.140.a:0 "$SOV.GetAdjective$ медведь подрастает..."
 news.140.b:0 "Фашистское логово — наше!"
 news.141.d:0 "Рим, \"Вечный город\", пал под натиском советских передовых отрядов. Когда итальянские силы отступили, русские войска распространились по всему городу и расправились с несколькими оставшимися очагами сопротивления. Большинство исторических достопримечательностей, похоже, мало пострадали, хотя есть противоречивые сообщения о том, что Пантеон был обстрелян из пулеметов.\n\nПока что советские войска, по-видимому, уважают нейтралитет Святого Престола, но их силы заняли позиции по кольцу вокруг Ватикана - жест, который, должно быть, нервирует Его Святейшество."
 news.142.d:0 "Неумолимое продвижение Красной Армии продолжается, и теперь поступают сообщения о том, что пала французская столица. Предположительно, французские коммунисты помогали Советам при вступлении в город, принимая участие в атаках на отступающие части армии.\n\nПо всему городу распространялись листовки, в которых парижанам сообщалось, что они \"освобождены от буржуазного гнета\" и что Парижская коммуна была наконец возрождена."
 news.143.d:0 "В последнем приказе дня, прозвучавшем из Москвы, было объявлено о взятии Парижа у немцев. По сообщениям, многие защитники города утонули в Сене после того, как мощный советский артиллерийский обстрел разрушил несколько мостов через реку.\n\nЭйфелева башня обрушилась после мощного взрыва у основания, хотя неясно, какая из сторон несет ответственность за это. Советские войска сейчас проводят парад победы на Елисейских полях, в то время как усталые парижане наблюдают за ними и размышляют, не обменяли ли они одного оккупанта на другого."
 news.143.a:0 "Начало конца...?"
 news.144.d:0 "[GetSOVIdeologyLondonDesc]"
 get_SOV_ideology_london_desc: "Коммунистический подъем продолжается, поскольку советские войска недавно завершили захват Лондона. Парад был быстро организован Красной Армией, еще до того, как были полностью подавлены последние очаги сопротивления в городе.\n\nСотрудники-коммунисты быстро передали имена известных антикоммунистов советским военным властям, и на Трафальгарской площади собрался народный суд, чтобы наказать наиболее злостных преступников."
 get_SOV_ideology_london_desc_alt: "[SOV.GetAdjective] наступление продолжается. По последним данным, Лондон подвергся агрессивному натиску и, как следствие, попал под шквал, казалось бы, бесконечных атак. Последние очаги сопротивления едва были подавлены, когда [SOV.GetAdjective] силы организовали парад, чтобы отпраздновать свою победу. Сторонники [SOV.GetLeader] и его/ее лидерства предложили свою полную поддержку и восхищение, поскольку эта новая эра, наконец, наступила для них."
 news.145.d:0 "Пожары продолжают бушевать в центре Лондона, но считается, что большинство немецких оккупантов города либо пали в бою, либо были захвачены наступающими советскими войсками. Толпы людей вышли на улицы, чтобы поддержать русских, когда они будут разбираться с последними упрямыми стойкими сторонниками. С коллаборационистами сурово расправились, и Советы организовали временный совет для управления освобожденным городом до дальнейшего уведомления. Критики отметили, что, похоже, все члены этого совета были выдвинуты Коммунистической партией Великобритании."
 news.145.a:0 "Важное развитие событий."
 news.146.d:0 "Советские силы сосредоточились на Токио, и по всему городу сообщается о сильных боях. Большая часть города находится под контролем СССР, за исключением восточных окраин, где по-прежнему бушуют сильные пожары.\n\nКогда бои переместились к Императорскому дворцу, члены Императорской гвардии, как сообщается, атаковали приближающиеся советские войска штыками. Дворец в конце концов был захвачен отрядом десантников ВДВ, которые пробивались через комплекс из комнаты в комнату. Пленных не было, но предполагается, что Император был благополучно эвакуирован до падения города."
 news.147.d:0 "Ленинград, бывшая столица Российской империи, был оккупирован финскими войсками. При населении более трех миллионов человек в городе почти столько же жителей, сколько во всей Финляндии, но этот факт явно не остановил финских нападавших.\n\nВедутся споры о том, следует ли включать город в состав Великой Финляндии, поскольку ингерманландские финны составляют значительное меньшинство в районах за пределами города. Это, конечно, при условии, что Красная армия не сможет отбить город в контрнаступлении."
 news.148.d:0 "Недавно поступавшие из Токио новости окончательно подтвердили, что город пал под натиском китайских сил. Он в значительной степени разрушен, включая Императорский дворец, который теперь служит штаб-квартирой китайской военной администрации.\n\nИностранные репортёры стали свидетелями грандиозного парада победы, на котором, казалось бы, бесконечная колонна китайских солдат маршировала через город. Японские граждане, стоявшие по обе стороны улиц, молча наблюдали за проходящими войсками."
 news.149.d:0 "Впервые за более чем два столетия с момента захвата Гибралтара англичанами он вернулся под власть Испании. Полученная с территории новость гласит, что большая часть гарнизона сдалась, хотя некоторые упорствующие отступили в туннели, проходящие под скалой.\n\nНа пресс-конференции в Мадриде представители правительства заявили, что отныне Гибралтар будет считаться испанской территорией „навечно“. Британские дипломаты предсказуемо развенчали это заявление, отвергнув его как „полнейший абсурд“."
 news.150.t:0 "Государственный переворот в Югославии"
 news.150.d:0 "Попытки югославского правительства сотрудничать с Германией вызвали огромное противодействие среди военных страны, которое сегодня вылилось в переворот, свергший правящего правителя и поместивший на трон короля Петра II.\n\nСтрана порвала многие свои связи с Германией, и новый режим, похоже, готов рискнуть войной, а не сотрудничать."
 news.150.b:0 "Глупцы сами себе вырыли могилу."
 news.151.t:0 "Рейнская область остается демилитаризованной"
 news.151.d:0 "После попыток Германии выйти из ограничений Версальского договора и провести повторную милитаризацию Рейнской области, ультиматум от союзников заставил их отступить. Поскольку и Британия, и Франция угрожали мобилизацией в случае, если Германия продолжит реализовывать этот план, стало очевидно, что такой уровень сопротивления не ожидался. Германия не была готова противостоять обеим странам в полномасштабной войне.\n\nВ сложившейся ситуации Рейнская область останется демилитаризованной зоной, как это предусмотрено в договоре, если только Германия не вступит в войну."
 news.151.a:0 "Кризис пока предотвращен."
 news.151.b:0 "Наш день придет."
 news.151.c:0 "Им следовало знать, что мы не допустим их происков."
 news.152.d:0 "После попыток Германии выйти из ограничений Версальского договора и провести повторную милитаризацию Рейнской области, ультиматум от Франции заставил их отступить. Несмотря на то, что Британия отказалась вмешиваться, а Франция угрожала мобилизацией в случае, если Германия продолжит реализовывать этот план, стало очевидно, что любое военное вмешательство не ожидалось. Германия не была готова противостоять Франции в полномасштабной войне.\n\nВ сложившейся ситуации Рейнская область останется демилитаризованной зоной, как это предусмотрено в договоре, если только Германия не вступит в войну."
 news.152.c:0 "Франция действует в одиночку, но твердо."
 news.152.e:0 "Очевидно, что наше вмешательство не требовалось."
 news.153.t:0 "Германия нарушает пакт Молотова-Риббентропа"
 news.153.d:1 "Пакт о ненападении между Германией и [SOV.GetNameDef], вначале вызвавший удивление, теперь без удивления рухнул. Германия напала, нарушив пакт, и вновь открыто заявляет о Советском Союзе, как об угрозе, с которой нужно бороться, чтобы их мечты о будущем стали реальностью.\n\nСоветское руководство не довольно, но, возможно, не столь шокировано предательством, сколь разочаровано тем, что первым не использовало возможности."
 news.153.a:0 "Доверие между гигантами — хрупкая штука."
 news.153.b:0 "Мы подписали его только для того, чтобы выиграть время для атаки."
 news.153.c:0 "Для фашистов договор — не более, чем клочок бумаги."
 news.154.t:0 "СССР разрывает пакт Молотова-Риббентропа"
 news.154.d:1 "Пакт о ненападении между Германией и [SOV.GetNameDef], вначале вызвавший удивление, теперь без удивления рухнул. [SOV.GetNameDef] напал, нарушив пакт, и поклялся сокрушить германский режим и снова поставить экспансионистское государство на место.\n\nНемецкие лидеры, возможно, сами планировали атаку, но мир никогда не узнает. Теперь они быстро мобилизуются, чтобы справиться с новой угрозой."
 news.154.b:0 "У коммунистов нет ни чести, ни гордости!"
 news.154.c:0 "Договор выполнил свое предназначение."
 news.155.t:0 "Германия снова вступила в войну"
 news.155.d:0 "Несмотря на то, что многие надеялись на долговременный мир в Европе, последние события заставляют Германию вновь встать на путь войны. Германские войска, явно нарушая Версальский договор, мобилизованы и готовы к наступлению. Немецкие власти заявляют, что больше не будут придерживаться демилитаризации Рейнской области, ссылаясь на необходимость защитить немецких граждан в этом районе."
 news.155.a:0 "Это может быть началом новой Великой войны"
 news.155.b:0 "За славу Германии!"
 news.156.t:0 "Замечена \"Комета\""
 news.156.d:0 "Появление в небе \"Кометы\" вызвало волнения среди нашего народа. Me 163 \"Комета\", экспериментальный ракетный самолет, совершивший один из своих тестовых полетов, шокировал сельское население, которое заметило этот необычайно быстрый корабль. Его разработка велась в обстановке строгой секретности, но вскоре он будет представлен официально. Этот незначительный инцидент сделает его первое официальное появление еще более впечатляющим."
 news.156.a:0 "Конец близок... для наших врагов."
 news.156.a.tt:1 "Ваза падает на пол.\n"
 news.156.a.2.tt:0 "Мне все равно не нравилась эта ваза.\n"
 news.157.t:0 "[From.From.GetName] вмешивается в [From.GetAdjective] войну"
 news.157.d:0 "Всего несколько дней назад войска из [From.GetName] мобилизовались и выступили против [From.From.From.GetName], объявив войну. Вслед за этим [From.From.GetName] выдвинуло ультиматум, приказав сторонам прекратить боевые действия, а всем [From.GetAdjective] войскам отойти. [From.GetLeader] заявляет, что их война была оправданной, и отказался сдаваться. Теперь страна находится в состоянии полномасштабного конфликта как с [From.From.From.GetName], так и с [From.From.GetName]."
 news.157.a:0 "Похоже, [From.From.GetName] готовы замарать руки"
 news.157.a_usa:0 "Мы им покажем"
 news.158.t:0 "[From.From.GetName] вмешивается в войну в [From.GetAdjective]"
 news.158.d:0 "Несколько дней назад [From.GetName] объявило войну [From.From.From.GetName]. Вскоре после этого [From.From.GetName] выдвинуло ультиматум, заявив, что оно объявит войну [From.GetName], если тот не прекратит агрессию и не подпишет мирный договор. [From.GetLeader] заявляет, что его причины для войны были справедливыми, но решил провести демобилизацию и согласиться на мир."
 news.158.a:0 "Похоже, игра силой [From.From.GetAdjective] оправдалась"
 news.158.a_usa:0 "Мы должны сохранить мир"
 news.159.t:0 "Рассвет [From.GetFactionName]"
 news.159.d_01:0 "[From.GetLeader] объявил сегодня, что [From.GetName] заявил о создании нового союза. [From.GetFactionName] публично заявил о своем намерении сотрудничать в случае войны.\n\nХотя большие коалиции и могут сдерживать агрессию, мы видели, к чему они приводят, когда начинается конфликт. Намерения разных сторон, участвующих в этом новом союзе, все еще обсуждаются, но истинная цель этого союза может быть неизвестна даже его основателям."
 news.159.d_02:0 "Была высказана теория, что демократии не воюют друг с другом, но это не означает, что они гарантированно помогают друг другу в войнах. Поскольку политические интересы различны, а люди хотят мира, вступление в войну часто обходится этим нациям очень дорого.\n\nОднако это не помешало [From.GetName] объявить сегодня, что они сформировали военный союз, [From.GetFactionName], чтобы объединить свои силы для защиты своих людей и своих идеалов."
 news.159.d_03:0 "Даже [From.GetName], известная своей верой в силу и превосходство своего народа и нации, не против заключать союзы с теми, кого они уважают. [From.GetLeader] объявил сегодня о том, что были достигнуты окончательные соглашения о [From.GetFactionName], военной коалиции, в которую, как утверждается, могут вступить только почетные нации, предназначенные для величия.\n\nСтанет ли это величие результатом построения идеального общества в пределах границ соответствующих наций или результатом совместной работы по их расширению, мир может не узнать, пока не станет слишком поздно."
 news.159.d_04:0 "Несмотря на недавний фокус СССР на коммунизме в одной стране, интернациональные корни движения выходят за пределы границ. Эта солидарность с рабочими всего мира была ключевым элементом в сегодняшней речи [From.GetLeader], когда был объявлен [From.GetFactionName].\n\nВыходя за рамки политического Интернационала, этот альянс связывает страны в военном отношении, и оба режима обещают помогать друг другу против внешних угроз. Будет ли он действовать как меч или щит для коммунистической революции, еще предстоит выяснить."
 news.159.a:0 "Приведет ли это к вечному миру или к новой войне?"
 news.159.b:0 "Вместе мы никогда не потерпим поражения!"
 news.159.c:0 "Прекрасная инициатива!"
 news.159.tt:0 "[This.GetName] является частью [From.GetFactionName] с [From.GetName].\n"
 news.160.t:0 "Нападение на Германию"
 news.160.d:0 "Недавно Германия оказалась втянутой в очередную войну. В то время, как все надеялись на сохранение продолжительного мира в Европе, стало ясно, что разногласия на континенте все еще слишком велики. Немецкие чиновники заявляют, что больше не могут удерживать Рейнланд демилитаризованным и утверждают, что для обеспечения собственной безопасности им необходима полная мобильность внутри границ своей страны."
 news.160.a:0 "Для Европы это не сулит ничего хорошего"
 news.160.b:0 "Немецкий народ одержит верх"
 news.161.t:0 "Франция запретила коммунизм"
 news.161.d:0 "[From.GetLeader] решил распустить [From.GetCommunistParty]. С тех пор, как Советская Россия подписала пакт о ненападении с нацистской Германией, ведутся разговоры о запрещении коммунизма во Франции. Декрет был принят вслед за соглашением между двумя странами о разделе Польши.\n[From.GetLeader] воспользовался случаем, поскольку поддержка запрета росла, и даже левые газеты начали выступать за упразднение [From.GetCommunistParty]."
 news.161.a:0 "Решительный шаг"
 news.161.b:0 "Делают все возможное, чтобы удержать буржуа у власти"
 news.161.c:0 "Возможно, это было необходимо"
 news.161.e:0 "Это был единственный выход"
 news.162.d:0 "Гражданская война в Испании закончилась с заключением окончательного мирного договора, который расколол страну пополам. Хотя несогласные с обеих сторон осуждают этот компромисс, этот хрупкий мир, по крайней мере, даст разделенной нации время, чтобы оправиться и восстановиться по обе стороны."
 news.162.a:1 "Хорошо для испанцев."
 news.162.b:0 "Когда-нибудь мы вернем всю Испанию."
 news.163.t:0 "Лондонская конференция"
 news.163.d:2 "Используя аннексию Австрии [GER.GetName] в качестве основания для своего требования, Германия потребовала "законного возвращения" бывшей австрийской территории Словении от [YUG.GetName].\n\nВ ответ подписавшие Версальский договор собрались в Лондоне, чтобы обсудить решение "словенского вопроса". Эта великая мирная конференция привела к решению, что Югославия должна передать Словению Германии во имя мира.\n\nПравительство [YUG.GetLeader], считая себя брошенным великими державами Европы, не видит иного выхода, как подписать представленное соглашение."
 news.163.a:0 "Это закончится хорошо"
 news.163.b:0 "Справедливость"
 news.163.c:0 "Сожалею"
 news.163.e:0 "Предательство"
 news.164.t:0 "Кризис в Словении"
 news.164.d:2 "Используя аннексию Австрии в [GER.GetName] в качестве основания для своего требования, Германия потребовала "законного возвращения" бывшей австрийской территории Словении от [YUG.GetName].\n\nВ ответ подписавшие Версальский договор собрались в Лондоне, чтобы обсудить решение "словенского вопроса".\n\nНа конференции Великобритания и Франция единым фронтом выступили против требований Германии, заявив, что Югославия должна сохранить границы, установленные Версалем."
 news.164.d_FRA_abandoned_yugoslavia:2 "Используя аннексию Австрии [GER.GetName] в качестве основания для своих претензий, Германия теперь требует "законного возврата" бывшей австрийской территории Словении у [YUG.GetName].\n\nВ ответ на это подписанты Версальского договора собрались в Лондоне для обсуждения решения "Словенского вопроса".\n\nХотя Британия настаивала на том, что целостность Версаля должна быть сохранена, Франция поддержала требования Германии во имя мира в Европе."
 news.164.a:0 "Думаю, это значит войну."
 news.164.b:0 "Они испытают на себе наш гнев."
 news.164.c:0 "Мы встанем на сторону справедливости."
 news.164.e:0 "Первыми в бой!"
 news.164.f:0 "Британцы - глупцы."
 news.165.t:0 "Словенский кризис"
 news.165.d:2 "Используя аннексию Австрии [GER.GetName] в качестве основания для своих претензий, Германия теперь требует "законного возврата" бывшей австрийской территории Словении у [YUG.GetName].\n\nВ ответ на это подписанты Версальского договора собрались в Лондоне для обсуждения решения "Словенского вопроса".\n\nНесмотря на несколько дней переговоров, конференция не смогла прийти к соглашению. Хотя британское правительство искало мирное решение, французы оставались непреклонными перед лицом немецких угроз. Немецкая делегация в знак протеста вышла из переговоров, и над Словенией сгущаются тучи войны."
 news.165.a:0 "Выглядит скверно."
 news.165.b:0 "Мы не отступим."
 news.165.c:0 "Это досадно"
 news.165.e:0 "Вместе мы победим"
 news.165.f:0 "Мы сделаем то, что должно!"
 news.166.t:0 "Лондонское соглашение"
 news.166.d:2 "Используя аннексию Австрии Германией как основание для своих требований, Германия потребовала "правомерного возвращения" бывшей австрийской территории Словении у [YUG.GetName].\n\nВ ответ на это страны-подписанты Версальского договора собрались в Лондоне, чтобы обсудить решение "словенского вопроса".\n\nВеликие державы согласились, что Словения должна быть передана Германии как последняя попытка сохранить мир.\nОднако в страстной речи, направленной против германской угрозы европейской стабильности, [YUG.GetLeader] недвусмысленно заявил, что [YUG.GetName] откажется отказаться даже от пяди земли, несмотря на то, что в трудный час он брошен на произвол судьбы."
 news.166.a:0 "Свет гаснет"
 news.166.b:0 "Мы их раздавим"
 news.166.c:0 "Мы стоим одни"
 news.167.t:0 "Кризис в Словении"
 news.167.d:2 "Используя присоединение Австрии к [GER.GetName] как основу для своих требований, Германия теперь потребовала "законного возврата" бывшей австрийской территории Словении от [YUG.GetName].\n\nВ ответ на это страны-подписанты Версальского договора собрались в Лондоне для обсуждения решения "словенского вопроса".\n\nКонференция определила неожиданный поворот лояльности, так как Италия поддержала территориальную целостность Югославии, оставив немецкие требования без подтверждения.\n\nКак всегда, итальянская внешняя политика совершенно непредсказуема, и еще предстоит выяснить, каких результатов они надеются достичь этим ходом."
 news.167.a:0 "Мы будем следить за этим"
 news.167.b:0 "Мы сокрушим их обоих"
 news.167.c:0 "По крайней мере, мы не одиноки"
 news.167.e:0 "Италия покажет миру!"
 news.168.t:0 "Первый арбитраж по Любляне"
 news.168.d:2 "Вследствие потери Словении в Югославии обострились этнические разногласия, а центральная власть с каждым днем слабеет. \n\nСегодня министр иностранных дел Германии обнародовал план окончательного решения «ошибки Версальского договора». Согласно договору, подписанному несколькими самыми влиятельными соседями [YUG.GetName], большая часть ее территории была поделена между дружественными Германии странами.\n\nЮгославские дипломаты не были даже ознакомлены с этим договором до его ратификации, но поскольку несколько стран спешат захватить югославские земли, у правительства [YUG.GetLeader] почти нет выхода."
 news.168.a:0 "Так строится Новый Порядок"
 news.168.b:0 "Мечта рухнула в этот день"
 news.168.c:0 "Это ничего хорошего"
 news.168.e:0 "Прекрасные новости"
 news.168.f:0 "Удручающий для нас итог"
 news.168.g:0 "Мы благодарны"
 news.168.h:0 "Прискорбно"
 news.168.i:0 "Истинная мощь Италии получила заслуженное признание"
 news.168.j:0 "Германии лучше быть осторожнее."
 news.169.t:0 "Судьба Югославии"
 news.169.d_annex_YUG:1 "Недавние территориальные потери привели к расколу в югославском государстве, что привело к этническому конфликту и ослаблению центральной власти. Германия воспользовалась сложившимся вакуумом и решила объявить «протекторат» над остатками Югославии"
 news.169.d_puppet_CRO_annex_YUG:1 "Недавние территориальные потери вызвали раскол в югославском государстве, приведшем к этническим конфликтам и ослаблению центральной власти. Германия создала \"независимое\" государство Хорватию и аннексировала остальную территорию"
 news.169.d_puppet_CRO_YUG:1 "Недавние территориальные потери вызвали раскол в югославском государстве, приведшем к этническим конфликтам и ослаблению центральной власти. Германия решила разделить оставшуюся территорию между сербским и хорватским государствами под своим руководством"
 news.169.a:0 "Германия демонстрирует свою мощь Европе"
 news.169.b:0 "Мы выбрали правильную сторону"
 news.169.c:0 "Это зловеще"
 news.169.e:0 "Миру угрожает опасность"
 news.170.t:0 "Второй Венский арбитраж"
 news.170.d_BUL:2 "Заявляя о том, что они пытаются обеспечить мир на Балканах, Германия предъявила правительству Греции требование уступить территорию Болгарии. Несмотря на решительные протесты [GRE.GetName], сильное влияние Германии на Балканах оставляет им мало выбора. Единственный способ избежать столкновения с [GER.GetName] - это позволить немецкой дипломатии диктовать их территориальную целостность."
 news.170.d_ITA:1 "Заявляя о своей попытке обеспечить мир на Балканах, Германия выставила правительству Греции требование передать ей территорию, на которую [ITA.GetName] претендовала. Несмотря на то, что [GRE.GetName] выразили сильный протест, влияние Германии на Балканах практически не оставляет им выбора. Единственный способ избежать противостояния как с [GER.GetName], так и с [ITA.GetName] — позволить германской дипломатии повлиять на свою территориальную целостность."
 news.170.d_ITA_BUL:1 "Заявляя о своей попытке обеспечить мир на Балканах, Германия выставила правительству Греции требование передать ей территорию, на которую претендовали [BUL.GetName] и [ITA.GetName]. Учитывая солидное [GER.GetAdjective] присутствие на Балканах и угрожающее поведение как Болгарии, так и Италии, у [GRE.GetLeader] не оставалось иного выхода, кроме как принять условия."
 news.170.d_GER:1 "Установив свое влияние на Балканах, [GER.GetName] заявляет, что руководствуется желанием сохранить мир в неспокойном регионе. Исходя из этого, она потребовала от Греции передать ей свои территории.\n\nСтолкнувшись с германской военной машиной, [GRE.GetName] не оставалось иного выбора, кроме как принять требования, хотя они и назвали эти требования фикцией."
 news.170.a:0 "Любой ценой сохранить мир"
 news.170.b:0 "Мы восстанем"
 news.170.c:0 "Все не к добру"
 news.170.e:0 "Устоит ли центр?"
 news.170.f:0 "Это позор"
 news.171.t:0 "Второй арбитраж по Любляне"
 news.171.d_BUL:1 "Греция отклонила немецкое посредничество в пограничном споре с Болгарией, заявив, что немецкое предложение равносильно капитуляции. \n\nВ разговоре с прессой [GRE.GetLeader] сказал, что если [BUL.GetLeader] и [GER.GetLeader] хотят эти территории, они могут \"прийти и забрать их\". \n\n[BUL.GetAdjective] правительство отвергло все обвинения в том, что оно предложило военную и экономическую поддержку [GER.GetNameDef] в обмен на помощь в получении греческих территорий."
 news.171.d_ITA:1 "После встречи между [GER.GetLeader] и [ITA.GetLeader] [GER.GetAdjective] правительство публично поддержало [ITA.GetAdjective] позицию в продолжающемся пограничном споре с [GRE.GetNameDef]. \n\nЛидер Греции [GRE.GetLeader] заявил, что предложенное решение является совершенно неприемлемым и поклялся защищать страну \"до последнего патрона, последнего снаряда, последнего вздоха\"."
 news.171.d_ITA_BUL:1 "Греция отклонила предложения Германии о посредничестве в пограничном споре между Грецией с одной стороны и Италией и Болгарией с другой. Представитель [GRE.GetAdjective] правительства заявил, что [GRE.GetAdjective] армия готова защищать страну от любых захватчиков и что скорее умрет в бою, чем сдастся шакалам и стервятникам, которые цепляются за фалды Германии."
 news.171.d_GER:1 "Переговоры между [GRE.GetNameDef] и [GER.GetNameDef] с целью разрешения нескольких пограничных споров провалились. Утверждая, что немецкое предложение об аренде некоторых районов для немецких военных баз фактически означает передачу больших частей страны, [GRE.GetLeader] призвал всех здоровых греков встать на защиту родины."
 news.171.a:0 "Дураки."
 news.171.b:0 "Как они посмели!?"
 news.171.c:0 "Нужно подумать, сможем ли мы помочь Греции."
 news.171.e:1 "Это будет означать войну."
 news.171.f:1 "Они потерпят неудачу, как и персы."
 news.172.t:0 "Греция подчиняется"
 news.172.d:1 "После долгого и жаркого разговора с германским послом [GRE.GetLeader] объявил, что правительство [GRE.GetAdjective] будет впредь тесно координировать свою политику с [GER.GetNameDef].\n\nПолиции в столице [GRE.GetAdjective] пришлось применить силу, чтобы разогнать ряд стихийных протестов против этого решения, причем многие в толпе требовали головы "этого труса [GRE.GetLeader]".
 news.172.a:1 "Они поступают мудро."
 news.172.b:0 "Еще один триумф."
 news.172.c:0 "Это вызывает беспокойство."
 news.172.e:0 "Мы ничего не можем сделать."
 news.172.f:1 "Это греческая трагедия."
 news.173.t:0 "Четвертый Интернационал"
 news.173.d_1:0 "Сегодня в Париже состоялась конференция коммунистических делегатов со всего мира. Сторонники идей Троцкого взяли на себя инициативу, была заложена основа для Четвёртого интернационала.\n\nХотя пока неясно, какое влияние эти попытки организоваться окажут на международную политическую арену, новости, похоже, вызвали подозрения Сталина. Он подозревает многих высокопоставленных членов партии и армии в тайной поддержке Троцкого, и многие из них ещё живы. Паранойя вновь взяла над ним верх, он стал всё более замкнутым. Его недоверие и неустойчивость вызвали кризис в советском правительстве. Если так будет продолжаться, страну ждёт гражданская война."
 news.173.d_2:0 "Сегодня в Париже состоялась конференция коммунистических делегатов со всего мира, которая заложила основу для того, что стало известно как Четвёртый интернационал. Призывы к его формированию звучали уже много лет, а сторонники теорий Троцкого взяли на себя инициативу.\n\nСталин отреагировал на растущую поддержку троцкизма за рубежом, приказав совершить дополнительные убийства и усилив пропаганду против своего старого соперника. Учитывая недавние чистки подозреваемых троцкистов в высших эшелонах советских военных и руководства, вряд ли это встретит сопротивление."
 news.173.a:0 "Сколько же этих Интернационалов будет?"
 news.173.b:0 "Тёмное время для нашего Союза."
 news.174.t:0 "[From.GetName] стремится к ядерным технологиям"
 news.174.d:0 "После начальных испытаний политики [From.GetName] решили направить [From.GetAdjective] исследования на разработку ядерных технологий.\n\nТехнология все еще находится на стадии разработки, и нет уверенности в том, имеет ли она практическое применение. Кто знает, к чему приведут их военные усилия?"
 news.174.a:0 "Нам следует наблюдать за развитием событий."
 news.174.b:0 "Будем надеяться, что их исследования принесут плоды."
 news.174.c:0 "Ничем хорошим это не закончится."
 news.174.e:0 "Мы проведем наши исследования в тайне."
 news.175.t:0 "Франция и Британия объявляют об альянсе"
 news.175.d:0 "Ссылаясь на связи, возникшие во время Великой войны, Франция запросила формальный альянс с Британией, упоминая неопределенные угрозы стабильности Европы.\n\nСегодня их запрос был одобрен Британским парламентом, и Франция присоединилась к [ENG.GetFactionName]."
 news.175.a:0 "Мы едины."
 news.175.b:0 "Они готовятся к худшему."
 news.175.c:0 "Сбиваются в кучу, как загнанные крысы."
 news.175.e:0 "Британия приняла их сторону."
 news.176.t:0 "Британия отклоняет альянс с Францией"
 news.176.d:0 "В неожиданном повороте событий британский парламент сегодня отклонил просьбу [FRA.GetName] о формальном союзе между двумя нациями. Приведенная причина заключалась в том, чтобы избежать нарушения и без того хрупкого баланса на европейском континенте.\n\nФранцузское правительство осудило это как политический ход, пожертвовав французской безопасностью в пользу британских интересов."
 news.176.a:0 "Они должны были попросить более вежливо."
 news.176.b:0 "Наши старые враги стоят порознь."
 news.176.c:0 "Темный день для старых союзников."
 news.177.t:0 "Малая Антанта"
 news.177.d:0 "Стремясь сформировать единый фронт против общих врагов, [From.GetName] обратился к Чехословакии с предложением сформировать «Малую Антанту» для объединения против общих врагов, тем самым отказавшись от своих связей с Великобританией времен Первой мировой войны. Несмотря на то, что им предложили место в оборонительном пакте, премьер-министр Великобритании ясно дал понять, что Великобритания не считает этот союз «полезным для защиты европейской свободы».\n\nТем не менее Франция установила дипломатические связи с другими странами, которые могут чувствовать себя под угрозой, и поощряет единство ради сохранения дипломатического баланса в Европе и предотвращения будущих конфликтов. Только время покажет, смогут ли они добиться успеха."
 news.177.a:0 "Тогда не приходите к нам с плачем, да будет вам известно!"
 news.177.b:0 "Да здравствуют Франция и Антанта!"
 news.177.c:0 "Мы больше никогда не должны позволять Франции добиваться гегемонии в Европе."
 news.177.e:0 "Европа должна объединиться против фашистских агрессоров!"
 news.177.f:0 "Признак растущей напряженности в Европе."
 news.178.t:0 "Левые набирают силу во Франции"
 news.178.d:0 "После почти двух десятилетий политических потрясений народ [From.GetName] считает, что ему еще предстоит вернуть то, что было потеряно в Первой мировой войне. [From.GetAdjective] поставили перед собой цель восстановить [From.GetAdjective] государство, вместе с его народом и для его народа.\n\nЭти новые политические реформы способствуют процветанию профсоюзов и коммунистических организаций. Если Франция продолжит двигаться по этому пути, ее ждет политическая переориентация в сторону крайних левых или даже полномасштабная революция."
 news.178.a:0 "Франция идет за нами в будущее!"
 news.178.b:0 "Явный признак слабости Франции."
 news.178.c:0 "Трагическое развитие событий для Третьей республики."
 news.178.e:0 "Тревожное развитие событий."
 news.179.t:0 "Правые набирают силу во Франции"
 news.179.d:0 "После почти двух десятилетий политических потрясений народ [From.GetName] считает, что ему еще предстоит вернуть то, что было потеряно в Первой мировой войне. [From.GetAdjective] правящие круги поставили перед собой цель восстановить [From.GetAdjective] государство и вновь обрести [From.GetAdjective] величие.\n\nЭти политические реформы укрепляют власть государства и армии, при этом [From.GetAdjective] народ убежден в обещаниях [From.GetLeader] о величии."
 news.179.a:0 "Французское правительство - враг своему собственному народу!"
 news.179.b:0 "Это может снова сделать Францию великой нацией."
 news.179.c:0 "Трагическое событие для Третьей республики."
 news.179.e:0 "Тревожное развитие."
 news.180.t:0 "Франция вступила в Коминтерн"
 news.180.d:0 "Вслед за сдвигом в сторону коммунизма не только среди французского народа, но и в правящих кругах Франции [France.GetName] публично объявила о своем желании стать частью [From.GetFactionName].\n\n[From.GetName] незамедлительно отреагировала, показав, что в течение нескольких недель должны были вестись переговоры вне поля зрения общественности. [From.GetLeader] долго говорил о том, как народы мира должны работать вместе, чтобы совершить революцию во всех странах.\n\n[France.GetLeader] согласился и пригрозил в недвусмысленных выражениях тем, "у кого есть основания бояться [From.GetFactionName]."
 news.180.a:0 "Едины к мировой революции!"
 news.180.b:0 "Их союз скоро распадется."
 news.180.c:0 "Нельзя допустить усиления врагов демократии."
 news.180.e:0 "Франция выбрала свою сторону."
 news.181.t:0 "[France.GetName] и [From.GetName] объединяются"
 news.181.d:0 "Following increasingly autocratic politics, [France.GetName] has announced that it is time they find allies to counter the threat of global communism. Now it seems that [From.GetName] is that ally.\n\nThis morning, [From.GetLeader] announced that [France.GetName] and [From.GetName] will stand together as brothers. \"Our shared heritage will no longer make us enemies, but allies! The Titans of Europe stand together.\""
 news.181.a:0 "Together we stand strong!"
 news.181.b:0 "The enemies of democracy grow stronger."
 news.181.c:0 "An unexpected friendship"
 news.182.t:0 "[France.GetName] Joins the [From.GetFactionName]!"
 news.182.d:0 "European politics were turned on its head today, as French and German diplomats announced a military pact between [France.GetName] and [From.GetName]. They announced that too much blood has been spilt on their border, when there are other forces out there seeking their destruction.\n\nThe [From.GetName] encouraged everyone to consider what it means that rather than weakening themselves against each other, the old enemies will grow even stronger together."
 news.182.a:0 "Nothing can threaten the [From.GetFactionName]!"
 news.182.b:0 "The new [From.GetName] looms over Europe."
 news.182.c:0 "European diplomacy realigns along the Paris-Berlin Axis."
 news.182.e:0 "Oh bugger."
 news.183.t:0 "[From.GetName] Rejects French Alliance!"
 news.183.d:0 "Дав отпор [France.GetAdjective] дипломатическим попыткам [From.GetLeader] публично объявил, что [From.GetName] не будет добиваться заключения военного пакта с [France.GetName].\n\nНазывая [France.GetAdjective] государство слабым и коррумпированным, [From.GetAdjective] дипломаты заявили, что ни один настоящий [From.GetAdjective] не позволит распространиться «[France.GetAdjective] болезни»."
 news.183.a:0 "Как они смеют!"
 news.183.b:0 "Мы можем ужиться с ними как с нашими врагами."
 news.183.c:0 "По крайней мере, пока они заняты борьбой друг с другом..."
 news.184.t:0 "Италия стремится к более тесным связям с Германией"
 news.184.d:0 "Италия и Германия выразили много противоречивых интересов, особенно в Австрии и на Балканах. Однако это не помешало внешней политике стран стать более дружественной по отношению друг к другу, и в настоящее время ведутся переговоры о пакте, который будет «защищать общие интересы».\n\nЕсли переговоры пройдут успешно, мы можем увидеть союз, который сможет оказать большое влияние в Центральной и Восточной Европе."
 news.184.a:0 "У наших народов много общих интересов."
 news.184.b:0 "Мы будем следить за ситуацией."
 news.185.t:0 "[From.GetName] стремится к широкому военному пакту"
 news.185.d:0 "С целью пересмотреть баланс сил в Средиземноморье [From.GetName] совершает политические шаги на пути к созданию нового альянса в регионе.\n\nНосящий в значительной степени военный характер, [From.GetFactionName] по словам [From.GetLeader], поставит Италию в центр новой мировой державы."
 news.185.a:0 "Указывает путь [From.GetName]!"
 news.185.b:0 "Остаётся надеяться, что их интересы не войдут в конфликт с нашими."
 news.185.c:0 "Это может послужить поводом для беспокойства."
 news.186.t:0 "Италия заявляет претензии на греческую территорию"
 news.186.d:0 "Называя Римскую империю предшественницей современного [From.GetAdjective] государства, [From.GetName] заявило, что независимое греческое государство не имеет права на существование. Вместо этого \"Греческие территории\" должны признать верховенство Италии в Эгейском море или же лишиться их силой.\n\n[Greece.GetName] осудило заявления как смехотворные. Однако [From.GetName] имеет поддержку [From.GetFactionName]."
 news.186.a:0 "Италия должна контролировать Эгейское море."
 news.186.b:0 "Возмутительные заявления!"
 news.187.t:0 "Италия ищет поддержки у [GRE.GetName]"
 news.187.d:0 "Указывая на [GRE.GetName] как на преемника первых античных европейских государств, [ITA.GetName] утверждает, что между двумя государствами существует естественная дружба.\nИх политическая повестка очевидна, поскольку [ITA.GetName] также видит в [GRE.GetName] естественного члена [ITA.GetFactionName].\n\nЗа полторы тысячи лет разлуки еще предстоит узнать, могут ли снова объединиться восток и запад."
 news.187.a:0 "Безусловно, [Greece.GetName] разделяет наши интересы."
 news.187.b:0 "Это неудивительно."
 news.187.c:0 "У нас действительно много общих черт."
 news.188.t:0 "[ITA.GetName] Ищет Примирения С [TUR.GetName]"
 news.188.d:0 "Несмотря на десятилетия конфликтов и дипломатических маневров для достижения господства в Средиземноморье, [ITA.GetName] и [TUR.GetName] начинают оставлять свои разногласия позади.\n\nВ соглашении о сотрудничестве "на благо всей Средиземноморской Сферы" [ITA.GetName] и [TUR.GetName] обязуются обеспечить более тесные дипломатические связи, чем когда-либо после современного основания двух стран."
 news.188.a:0 "Влияние [ITA.GetName] растет."
 news.188.b:0 "Как кто-то вообще может согласиться "сотрудничать" с [ITA.GetAdjective]?"
 news.188.c:0 "Партнерство в Средиземноморье имеет большое значение."
 news.189.t:0 "Италия Требует Военно-морских Баз в Анатолии"
 news.189.d:0 "В 1915 году Лондонским договором Италии обещались турецкие территории в Анатолии. [From.GetAdjective] руководство, впрочем, не забыло о приоритете более поздних соглашений, и данные обещания не были исполнены.\n\n[From.GetLeader] открыто заявил, что ввиду стратегической важности анатолийского побережья, [From.GetName] вознамерился взять то, что \"по праву принадлежит Италии\"."
 news.189.a:0 "Этот вопрос урегулирован!"
 news.189.b:0 "Мы получим то, что нам обещали!"
 news.189.c:0 "Турецко-итальянское соперничество нарастает."
 news.190.t:0 "Балеарские острова переходят к [Italy.GetName]"
 news.190.d:0 "Вследствие участия [Italy.GetAdjective] сил в Гражданской войне в Испании, [Italy.GetName] запросил у [From.GetName] Балеарские острова. [From.GetLeader] уступил, назвав данный дипломатический шаг укреплением связей между двумя нациями.\n\nЧто касается [Italy.GetName], военно-морские базы на Балеарских островах позволят им усилить влияние на Гибралтарский пролив и дадут лучший доступ к Атлантике."
 news.190.a:0 "Это важный шаг к полному господству над Средиземноморьем."
 news.190.b:0 "Италия укрепляет свою власть в Средиземном море."
 news.190.c:0 "Символ \"искренней дружбы\" между нашими государствами."
 news.192.t:0 "Италия объявляет претензии на территорию Югославии"
 news.192.d:0 "Обращаясь к итальянскому населению вдоль далматинского побережья, [From.GetLeader] заявил(-а), что [From.GetName] полностью рассматривает италоязычную территорию в [YUG.GetName] как законную часть [From.GetName].\n\nОфициальное заявление подтвердило это требование, дав ясно понять, что [From.GetName] готов(-а) взять территорию силой, если это необходимо."
 news.192.a:0 "Это югославские земли, а не итальянские!"
 news.192.b:0 "Они нарушают и без того хрупкий баланс в регионе."
 news.192.c:0 "Эти территории кажутся более итальянскими, чем югославскими."
 news.193.t:0 "Итальянское министерство иностранных дел в [YUG.GetName]"
 news.193.d:0 "Вместо того, чтобы противостоять [YUG.GetName] из-за итальянского населения на далматинском побережье, [From.GetName] объявил(-а) об открытии постоянной дипломатической миссии в [YUG.GetName]. Согласно заявлению [From.GetAdjective] министерства иностранных дел, у двух стран есть много общей истории и интересов, поэтому взаимопонимание гораздо важнее, чем мелкие пограничные споры.\n\nПоскольку напряженность в Европе растет, остается только надеяться, что больше стран примут этот подход."
 news.193.a:0 "Наши нации стоят вместе как друзья."
 news.193.b:0 "На Адриатике будет мир."
 news.193.c:0 "Любопытно, чем это закончится."
 news.194.t:0 "Восточная Польша передана [From.GetName]"
 news.194.d:0 "В ходе неизвестных политических махинаций, руководство [Poland.GetName] уступило свои восточные регионы [From.GetName]. \n\nПока не ясно, какие обещания или угрозы использовал [From.GetName] для достижения этой политической победы. Мы, возможно, так никогда этого и не узнаем, поскольку [Poland.GetLeader] пока не сказал ни слова помимо объявления соглашения."
 news.194.a:0 "[Poland.GetName] признает мощь [From.GetFactionName]!"
 news.194.b:0 "[From.GetName] поглощает все на своем пути."
 news.194.c:0 "[Poland.GetName] возможно не оставили другого выбора."
 news.195.t:0 "[From.GetName] предоставила Восточную Германию"
 news.195.d:0 "После оккупации [Soviet.GetName] Германии, [From.GetName] была предоставлена большая часть Восточной Германии, включая спорную территорию Восточной Пруссии.\nПохоже, это результат секретного пункта в договоре между Советским Союзом и Польшей. Польше была предоставлена немецкая земля в качестве компенсации за то, что они были вынуждены уступить [Soviet.GetName].\n\nПольша сыграла на высоких ставках, и хотя многое было потеряно, многое было и приобретено."
 news.195.a:0 "[Soviet.GetName] чтит свои договоры."
 news.195.b:0 "Давайте надеяться, что свободная Польша поднимется из пепла, созданного ее "защитником""
 news.195.c:0 "Новый геополитический поворот для Польши. Снова."
 news.196.t:0 "[From.GetName] поощряет революционеров"
 news.196.d:0 "В пламенной речи [From.GetLeader] призвал коммунистические партии во всем мире ускорить падение капитализма, используя более экстремальную тактику. Страх преследования не должен останавливать ни одного человека от продвижения борьбы рабочего класса.\n\n[From.GetName] увеличит финансирование зарубежных коммунистических партий и обучит их более экстремальной тактике, необходимой для приведения их стран в соответствие с [From.GetFactionName]."
 news.196.a:0 "Демократия никогда не будет повержена!"
 news.196.b:0 "Смешная попытка!"
 news.196.c:0 "Поднимайтесь, братья и сестры!"
 news.196.e:0 "Столкновение идеологий — последняя битва цивилизаций."
 news.197.t:0 "[From.GetName] уступает [Soviet.GetAdjective] ультиматуму"
 news.197.d:0 "[From.GetName] уступил [Soviet.GetAdjective] ультиматуму и уступил контроль над Эгейскими островами [Soviet.GetName].\n\nЭтим [Soviet.GetName] укрепляют свое присутствие в Средиземноморье и усиливают себя как военно-морскую силу в регионе."
 news.197.a:0 "Им следовало бы порадоваться, что мы предложили им такие хорошие условия."
 news.197.b:0 "Необходимо остановить [Soviet.GetName]!"
 news.197.c:0 "[Soviet.GetName] готовится выйти в Средиземное море."
 news.198.t:0 "[From.GetName] противостоит [Soviet.GetAdjective] ультиматуму"
 news.198.d:0 "[From.GetName] отвергли требования ультиматума [SOV.GetAdjective], доставленные им по поводу Эгейских островов. Поскольку влияние [SOV.GetName] на этот регион становится все более значительным, [From.GetLeader] заявили, что если они уступят им хотя бы один остров в Эгейском море, то в итоге они захватят все Средиземноморье.\n\nПосле отклонения ультиматума [From.GetName] находятся на грани войны и могут только ждать, когда [SOV.GetNameDef] нажмет на спусковой крючок."
 news.198.a:0 "Значит, время для разговоров прошло."
 news.198.b:0 "Поджигателей войны из [SOV.GetNameDef] нужно остановить!"
 news.198.c:0 "Это был их ультиматум. Греция должна готовиться к войне"
 news.198.e:0 "Мы поддерживаем [From.GetNameDef]"
 news.199.t:2 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] передали Бессарабию [From.GetNameDef]"
 news.199.d:2 "\n\n[?SOV.former_controller_of_bessarabia.GetNameDefCap] были вынуждены принять ультиматум от [From.GetNameDef]. Территории Бессарабии перешли под [From.GetAdjective] контроль, а государственные границы [?SOV.former_controller_of_bessarabia.GetAdjective] сократились.\n\nОстается только догадываться, как [?SOV.former_controller_of_bessarabia.GetNameDef] смогут избежать дальнейших потерь."
 news.199.a:0 "Это необходимо для [From.GetAdjective] стратегии"
 news.199.b:0 "Страны мира должны выступить против зла [From.GetNameDef]!"
 news.199.c:2 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] оказались в затруднительном положении."
 news.200.t:0 "Германское дипломатическое влияние в [CZE.GetNameDef]"
 news.200.d:0 "Говоря о братстве наций в "Немецкой сфере", [From.GetLeader] в своем сегодняшнем выступлении объявил о приверженности [From.GetName] политическому и дипломатическому сотрудничеству с [CZE.GetNameDef]. Обладая значительным немецкоязычным населением, [CZE.GetNameDef] был представлен как естественный партнер [From.GetAdjective] интересов.\n\nХотя неясно, какое право голоса имеет [CZE.GetNameDef] в этом сотрудничестве, они, по крайней мере, могут быть уверены, что их границы защищены от территориальных амбиций [GER.GetNameDef]."
 news.200.a:0 "Германская дружба предпочтительнее немецкого господства."
 news.200.b:0 "Чехи всегда были друзьями немцев"
 news.200.c:0 "[From.GetName] продолжает расширять свою сферу влияния"
 news.200.e:0 "Мир во время наше?"
 news.200.f:0 "Отличные новости к тому моменту, когда [Root.GetLeader] вернется из отпуска в Мюнхене!"
 news.201.t:0 "Войска [GER.GetNameDefCap] заставляют [TUR.GetNameDef] подчиниться"
 news.201.d:0 "\nИспытывая дипломатическое и военное давление со стороны [GER.GetFactionName] с востока и запада, [TUR.GetAdjective] правительство ввергнуто в политический хаос.\n\nВслед за угрозами со стороны Германии и Советов из хаоса появилось новое правительство, которое гораздо дружелюбнее к [GER.GetFactionName], чем старое. Некоторые восточные территории уже переданы [SOV.GetNameDef].\n\nДействительно, некоторые быстро заглушённые диссиденты утверждают, что новое правительство следует всем прихотям [GER.GetLeader]."
 news.201.a:0 "Новое правительство Турции обеспечивает нашу конкурентоспособность в Средиземном море."
 news.201.b:0 "Ужасная сила [GER.GetFactionName] рушит страны, словно домино."
 news.201.c:0 "[From.GetNameDefCap] не смог противостоять силе [GER.GetFactionName]."
 news.201.e:0 "Альянс укрепляет наши позиции."
 news.201.f:0 "Турция пала жертвой хищной [GER.GetFactionName]."
 news.202.t:0 "Словакия за Данциг"
 news.202.d:0 "После месяцев все более агрессивной риторики, ухудшающиеся отношения между [GER.GetNameDef] и [POL.GetNameDef] сегодня резко изменились, достигнута дипломатическая договоренность об урегулировании данцигского спора.\n\n[POL.GetNameDef] включит в свой состав контролируемую Германией Словакию в качестве польского субгосударства, и в обмен уступит регион Данциг. Статус Вольного города Данцига быстро урегулирован, и вскоре он будет полностью воссоединен с германским государством.\n\nХотя вопрос, кажется, был урегулирован мирным путем, можно быть уверенным, что у победителей Великой войны будут возражения."
 news.202.a:0 "Справедливый обмен, чтобы исправить ошибки Версаля"
 news.202.b:0 "Сотрудничество делает нас сильнее, чем конфликт"
 news.202.c:0 "Это вопиющее нарушение Версальского договора!"
 news.202.e:0 "Конфликт из-за Данцига предотвращен"
 news.203.t:0 "Польша уступает Данциг"
 news.203.d:0 "После предъявления [GER.GetAdjective] ультиматума [From.GetNameDef], [From.GetLeader] и [From.GetAdjective] правительство решили выполнить все требования, чтобы не развязывать войну.\n\nОни надеются, что после потери Данцига [From.GetNameDef] будет в безопасности от дальнейших территориальных притязаний Германии. Однако ситуация остается напряженной, и показательно, что польские пограничные войска еще не получили приказ отступить"
 news.203.a:0 "Нельзя позволять [GER.GetLeader] продолжать предъявлять требования Европе!"
 news.203.b:0 "Это признание мощи [GER.GetFactionName]"
 news.203.c:0 "Немецкая экспансия продолжается"
 news.203.e:0 "Очевидно, что "демократии" Европы неспособны остановить фашистскую угрозу"
 news.204.t:0 "Польша отвергает ультиматум Германии"
 news.204.d:0 "Учитывая требования, это казалось неизбежным.\n\n[From.GetNameDef] будет вынужден передать Данциг Германии, и польский полномочный представитель будет направлен в Берлин для дальнейших переговоров. [From.GetLeader] указал на недавние действия [GER.GetNameDef], когда заявил, что очевидно, что Германия не удовлетворится одним лишь Данцигом.\n\nНемецкие и польские войска готовятся к войне, и уже поступают сообщения о столкновениях на границе. И снова в Европе война."
 news.204.a:0 "Германия проигнорировала все предупреждения!"
 news.204.b:0 "Значит, это война"
 news.204.c:0 "Вместе мы должны остановить этого агрессора!"
 news.204.e:0 "Это тяжелое положение"
 news.205.t:0 "Pax Americana"
 news.205.d_america:0 "Наблюдая за конфликтами на других континентах, [USA.GetLeader] объявил о новой программе внешней политики, направленной на поддержание мира у себя на родине.\n\nЛюбое правительство на американском континенте может обратиться к Соединенным Штатам за военной помощью, если почувствует угрозу со стороны своих соседей. Хотя это не является гарантией для какого-либо конкретного государства, стремление к миру в Америке уже не просто мечта, а официальная политика США."
 news.205.d_not_america:0 "Внимательно следя за конфликтами на других континентах, [USA.GetLeader] объявил о новой программе внешней политики, призванной сохранить мир дома.\nЛюбое правительство на Американском континенте может обратиться к Соединенным Штатам за военной защитой, если почувствует угрозу со стороны своих соседей. Хотя мир в Америке нельзя гарантировать любому конкретному государству, стремление к нему уже не просто мечта, а официальная политика Америки"
 news.205.a:0 "Это должно сделать Америку более безопасной"
 news.205.b:0 "При наличии мира внутри страны США смогут сосредоточиться на своих врагах за рубежом"
 news.205.c:0 "Возможно, теперь нам будет сложно найти союзников в Америке"
 news.205.e:0 "Будем надеяться на прочный мир"
 news.206.t:0 "Американский антиимпериализм"
 news.206.d_communist:0 "После распространения рабочей революции на Соединенные Штаты их риторика против старого порядка стала гораздо более агрессивной. Сейчас [USA.GetLeader] ставит под сомнение статус Канады как субъектного государства Британской империи, в то время как американские дипломаты выступают за мир, свободный от аристократии и господства по всему миру.\n\nНесмотря на связывающие их узы, напряженность между [USA.GetNameDef] и колониальной империей [ENG.GetNameDef] растет. Это лишь вопрос времени, когда этот дипломатический конфликт обострится и революция будет принесена в [ENG.GetNameDef] силой."
 news.206.d_not_communist:0 "Новый коммунистический режим в Соединенных Штатах принял новую доктрину [USA.GetAdjective] внешней политики, заняв гораздо более агрессивную позицию в отношении бывших союзников и друзей, одновременно сближаясь с членами Коминтерна.\nЭто изменение политики включает в себя сомнение в статусе [CAN.GetName] как подчиненной нации и общее применение того, что они называют \"Всемирным Британским империализмом\".\n\nНа фоне растущей напряженности угроза нового британо-американского конфликта кажется слишком реальной."
 news.206.a:0 "Весь мир будет освобожден революцией!"
 news.206.b:0 "Мы должны быть готовы к любым неожиданностям"
 news.206.c:0 "Глобальный баланс под угрозой"
 news.206.e:0 "[USA.GetAdjective] режим - это не то, о чем стоит беспокоиться"
 news.206.f:0 "Тревожное развитие событий"
 news.207.t:0 "[USA.GetNameDefCap] осуждает Коминтерн"
 news.207.d_fascism:0 "\nВ ответ на все более агрессивную риторику со стороны [SOV.GetNameDef] [USA.GetLeader] выступил против того, что он назвал \"величайшей опасностью для человеческой цивилизации, коммунизмом\".\n[USA.GetNameDef] не только будет проводить политику защиты для предотвращения распространения мирового социализма в Америке, но и стремится уничтожить само сердце коммунизма.\nПри поддержке военной машины [USA.GetAdjective] полное искоренение коммунизма впервые кажется вполне возможным."
 news.207.d_not_fascism:0 "[USA.GetLeader] сегодня выступил с публичной речью против того, что он назвал «величайшей угрозой для человеческой цивилизации» — коммунизма.\n\n[USA.GetNameDef] не только будет проводить защитную политику, чтобы предотвратить распространение мирового социализма в Америке, но и [USA.GetAdjective] прямо намерен уничтожить само сердце коммунизма.\n\nПоскольку напряжённость достигла своего пика, для того, чтобы вспыхнула война между [SOV.GetNameDef] и [USA.GetNameDef], нужна всего лишь одна искра."
 news.207.a:0 "Человечество будет освобождено от этой идеологической чумы!"
 news.207.b:0 "Они разобьются о бастионы коммунизма"
 news.207.c:0 "Мы заставим их встать на колени"
 news.207.e:0 "Как бы ни завершился этот конфликт, разрушение будет полным"
 news.207.f:0 "[USA.GetNameDefCap] должны сделать все возможное, чтобы защитить себя"
 news.208.t:0 "Японская армия принимает идеологию нансин-рон"
 news.208.d:0 "Вооруженные силы Японии уже давно признали, что [JAP.GetName] не обладает природными ресурсами, необходимыми для длительных военных действий. С ростом напряженности и началом вооруженных конфликтов с участием ведущих мировых держав, угроза потери импорта с каждым днем все возрастает.\nЧтобы противостоять этому, японские стратеги разработали стратегический план по захвату западных колоний в Юго-Восточной Азии и Тихом океане. Эти богатые ресурсами регионы будут питать японскую военную машину и позволят ей продолжать действовать более или менее беспрепятственно, пока колониальные державы и [USA.GetName] можно держать на расстоянии."
 news.208.a:0 "Неужели они действительно могут угрожать нашим владениям?"
 news.208.b:0 "Пока территория США не находится под угрозой"
 news.208.c:0 "Они поняли, что им нужно искать добычу в другом месте"
 news.208.e:0 "Война в Юго-Восточной Азии кажется вероятной"
 news.209.t:0 "Японская армия принимает Хокусин-рон"
 news.209.d:0 "Вооруженные силы Японии давно признали, что [JAP.GetNameDef] не обладает природными ресурсами, необходимыми для ведения затяжной войны. С ростом напряженности и вспышками вооруженных конфликтов с участием великих держав мира угроза потери импорта с каждым днем кажется все более вероятной.\nДля противодействия этому японские стратеги разработали стратегический план по захвату сибирских шахт и нефтяных месторождений у [SOV.GetNameDef]. Предполагается, что быстрое наступление позволит Японии взять под контроль ключевую территорию до того, как будет организован соответствующий [SOV.GetAdjective] контрудар. К тому времени японская армия будет иметь все ресурсы, необходимые для поддержания огня войны до [SOV.GetAdjective] капитуляции."
 news.209.a:0 "Было бы глупо угрожать нашим владениям."
 news.209.b:0 "Мы отговорили Японию от вторжения на Тихий океан."
 news.209.c:0 "Они не понимают, с какой страшной силой им предстоит столкнуться."
 news.209.e:0 "Война в Сибири кажется неизбежной."
 news.210.t:0 "Япония меняет правительство в Китае"
 news.210.d:0 "После десятилетий политической нестабильности в Китае, связанной с вооруженными конфликтами как внутри страны, так и за ее пределами, правительство Японии объявило, что считает китайское правительство угрозой стабильности в своей сфере интересов.\n\nИменно по этой причине под угрозой войны было назначено новое правительство, лояльное Японии и подчиняющееся японскому императору. Это новое правительство имеет не только защиту японской армии, но и военный мандат на то, чтобы вернуть контроль над мятежными китайскими государствами.\n\nХотя, несомненно, будут продолжаться политические конфликты, прямая война между двумя странами была предотвращена."
 news.210.a:0 "Сферу влияния Японии нельзя отрицать"
 news.210.b:0 "Мы должны следить за нашими юго-восточными границами"
 news.210.c:0 "Возможно, настало время укрепить наши колонии от японских амбиций"
 news.210.e:0 "Кажется, между Китаем и Японией наступит своего рода мир"
 news.211.t:0 "Япония претендует на гегемонию в Восточной Азии"
 news.211.d:0 "Учитывая непревзойденное военное превосходство в Восточной Азии, [JAP.GetLeader] заявил, что [JAP.GetNameDef] считает весь регион своей сферой интересов. Без точной информации о степени способности Японии к реализации власти пока неясно, что именно [JAP.GetNameDef] считает законной частью недавно созданного [JAP.GetFactionName]."
 news.211.a:0 "[JAP.GetFactionName] на подъеме"
 news.211.b:0 "Это весьма интересные новости"
 news.211.c:0 "Никто не решится потребовать у нас наши азиатские территории"
 news.211.e:0 "События в Тихом Океане все больше беспокоят"
 news.211.f:0 "Похоже, у нас слишком противоречивые интересы"
 news.211.g:0 "За этим стоит присматривать повнимательнее"
 news.212.t:0 "Японские дипломаты в Берлине"
 news.212.d_not_axis:0 "Между Токио и Берлином намечается новое партнерство. Начались переговоры по соглашению между этими двумя государствами, в котором указаны и стратегические интересы, и общие ценности. В то время как еще неизвестно, что (если хоть что-то) получится из этих переговоров, перспектива дружественных отношений между одними из самых сильных вооруженных сил в каждом полушарии вызывает тревогу у их многочисленных врагов."
 news.212.d_axis:0 "Между Токио и Берлином намечается новое партнерство. Начались переговоры по соглашению между этими двумя государствами, в котором указаны и стратегические интересы, и общие ценности. В то время как еще неизвестно, что (если хоть что-то) получится из этих переговоров, перспектива дружественных отношений между одними из самых сильных вооруженных сил в каждом полушарии вызывает радость у их союзников и тревогу у их многочисленных врагов."
 news.212.a:0 "Это сделает нас всех сильнее"
 news.212.b:0 "Наши враги не должны дружить"
 news.212.c:0 "Возможно, будет лучше, если ничто не выйдет из этого соглашения"
 news.213.t:0 "[USA.GetNameDefCap] против фашизма"
 news.213.d_peace:0 "Как Страна Свободы, [USA.GetNameDef] считает себя естественным врагом фашизма во всех его формах по всему миру. С агрессией немецкого режима они в настоящее время являются величайшим врагом мира, построенного на либеральных принципах, которых придерживаются [USA.GetNameDef].\n\nУчитывая это и заручившись одобрением [USA.GetAdjective] Конгресса, [USA.GetLeader] выступил с предупреждением [GER.GetNameDef]. Если [GER.GetNameDef] не изменит свой политический курс, [USA.GetNameDef] предпримет против них действия.\n\nХотя никаких конкретных действий не было определено, неявная угроза войны нависла между двумя странами."
 news.213.d_war:0 "Как Страна Свободы, [USA.GetNameDef] считает себя естественным врагом фашизма во всех его формах по всему миру. С агрессией немецкого режима они в настоящее время являются величайшим врагом мира, построенного на либеральных принципах, которых придерживаются [USA.GetNameDef].\n\nУчитывая это и заручившись одобрением [USA.GetAdjective] Конгресса, [USA.GetLeader] выступил с предупреждением [GER.GetNameDef]. Если [GER.GetNameDef] не капитулирует и не изменит политический курс, [USA.GetNameDef] направит против них всю свою промышленную и военную мощь.\n\"Мы не позволим [GER.GetNameDef] свернуть ход истории!\"."
 news.213.a:0 "[GER.GetName] будет стоять твердо тысячу лет!"
 news.213.b:0 "Им придется доказать свои слова сталью"
 news.213.c:0 "[GER.GetName] падет!"
 news.213.e:0 "Мирного решения этого вопроса не будет."
 news.214.t:0 "Польша стремится к сотрудничеству с Прибалтикой"
 news.214.d_not_baltic:0 "Для нас нет никакого выхода из этого положения, не рискуя при этом еще большим угнетением польского народа.\n\nПосле дистанцирования [POL.GetName] от международного сообщества польские политики стали активно продвигать идею державы «между морей».\n\nХотя надежда состоит в том, чтобы создать альянс, простирающийся от Балтийского до Черного морей, их заявленным приоритетом по-прежнему остается укрепление своей позиции против угрожающих влияний как с востока, так и с запада. Для этой цели [POL.GetName] стремится к более тесным связям со своими соседями в Прибалтике."
 news.214.d_baltic:0 "[POL.GetName] постепенно дистанцируется от международного сообщества, прекрасно осознавая, что они не могут полагаться на политиканство «великих держав», чтобы предотвратить агрессоров от очередного разрушения польского государства.\n\nВместо этого [POL.GetLeader] представил планы по созданию альянса для укрепления Балтийского региона, что, как можно надеяться, предотвратит агрессию как с востока, так и с запада.\n\nВ условиях ухудшения стабильности в Европе такой альянс может быть в наших наилучших интересах."
 news.214.a:0 "Новая держава в Восточной Европе."
 news.214.b:0 "Они вмешиваются в нашу сферу влияния!"
 news.214.c:0 "Очевидно, они пытаются угрожать [GER.GetName]."
 news.214.e:0 "[POL.GetFactionName] может быть нашим самым безопасным выбором."
 news.215.t:0 "[GER.GetName] формализует антисоветский пакт"
 news.215.d_not_soviet:1 "[GER.GetNameDefCap] давно осуждает коммунизм во всех его формах и выступает с дипломатическими инициативами, призывая другие нации также ему противостоять.\n\nТеперь [GER.GetName] предложил \"государствам, находящимся под непосредственной угрозой коммунизма\" возможность сформировать пакт против [SOU.GetName]. Любая страна в пакте будет обязана участвовать в войне против [SOU.GetName], если когда-нибудь будет совершено нападение на одного из членов."
 news.215.d_soviet:1 "[GER.GetLeader] яростно выступает против коммунизма с тех пор, как он пришел к власти, и никогда не было сомнений в том, что [GER.GetNameDef] считает себя врагом [SOU.GetNameDef].\n\nСегодня это отношение было объявлено всему миру, поскольку ранее действовавшее \"Антисоветское соглашение\" между [GER.GetNameDef] и несколькими другими странами теперь было формализовано в пакт. Остальные члены будут призваны к войне, если один из них в итоге окажется в конфликте с нами."
 news.215.a:0 "Это единственный способ противостоять коммунистической угрозе."
 news.215.b:0 "Борьба только ускорит рабочую революцию."
 news.215.c:0 "Пусть они обескровят друг друга."
 news.216.t:0 "[TUR.GetName] оказывает сопротивление ультиматуму от [GER.GetName]."
 news.216.d:0 "Дипломаты из [GER.GetName] вручили [TUR.GetName] ультиматум, требующий, чтобы [TUR.GetLeader] ушел в отставку в пользу поддерживаемого Германией правительства. При поддержке Великого национального собрания [TUR.GetLeader] отверг ультиматум, заявив [TUR.GetAdjective] народу, что Турция никогда не станет пешкой в войне иностранных диктаторов.\n\nТеперь страна готовится к войне."
 news.216.a:0 "[GER.GetName] будут повержены."
 news.216.b:0 "Мы поддерживаем [TUR.GetName]."
 news.216.c:0 "Глупое сопротивление."
 news.216.e:0 "Война в Турции, кажется, неизбежна."
 news.217.t:0 "[GER.GetNameDefCap] заставляет [TUR.GetNameDef] присоединиться к [ENG.GetFactionName]"
 news.217.d:0 "\n\nВыставив ультиматум [TUR.GetAdjective] правительству, [GER.GetNameDef] создал себе нового врага. Вместо того чтобы уступить требованиям [GER.GetAdjective] дипломатов, как ожидал [GER.GetLeader], [TUR.GetNameDef] согласился на оборонительный союз с [ENG.GetNameDef].\n\n[ENG.GetNameDef] и ее союзники готовятся защитить [TUR.GetNameDef] в случае, если [GER.GetNameDef] исполнит свой ультиматум."
 news.217.a:0 "Мы должны объединиться против [GER.GetNameDef]."
 news.217.b:0 "[GER.GetNameDefCap] наживает все больше врагов."
 news.217.c:0 "Если они откажутся от мирного сотрудничества..."
 news.217.e:0 "[GER.GetNameDefCap] и [TUR.GetNameDef] играют в опасную игру."
 news.218.t:0 "Да! Нам не нужны бананы"
 news.218.d:0 "Хотя наша суровая программа нормирования не распространяется на свежие фрукты, тень войны означает, что мы утратили большую часть наших импортных мощностей. Поэтому многие бывшие тропические товары теперь являются недоступной роскошью, включая такие вещи, как лимоны и бананы. \nДля поддержания военного духа владельцы магазинов вывешивают на витринах плакаты, ссылающиеся на веселую старую театральную постановку. \nК сожалению, не хватает также стручковой фасоли и лука, капусты и зеленого лука, и всевозможных фруктов, но британский дух не падает!"
 news.218.a:0 "Я просто хотел банан"
 news.219.t:0 "Чистка руководства в [SOV.GetNameDef]"
 news.219.d:0 "В [SOV.GetNameDef] давно царит неопределенность. Хотя подробности скудны, на высшем уровне прошел ряд секретных судебных процессов, и генералы, и министры исчезли из поля зрения общественности. \nЕстественно предположить, что в Коммунистической партии был раскрыт некий масштабный заговор, однако официальных заявлений не поступало. Кроме того, дипломатические доклады, к которым мы имеем доступ, свидетельствуют о том, что представленные на этих процессах доказательства были далеки от неопровержимых. \nЧто бы ни происходило, структура [SOV.GetAdjective] верховного командования безвозвратно изменилась."
 news.219.a:0 "[SOV.GetLeader] обеспечил стабильность в [SOV.GetNameDef]."
 news.219.b:0 "Доказательство коррупции, присущей коммунизму."
 news.219.c:0 "[SOV.GetAdjective] командование сильно пострадало"
 news.220.t:0 "Восстание офицеров в [SOV.GetNameDef]!"
 news.220.d:0 "Часть высшего командования СССР восстала против руководства [SOV.GetLeader]!\nТочно не известно, что послужило причиной этого восстания, но оно не выглядит как хорошо спланированная попытка захвата власти.\n\n[SOV.GetAdjective] политическая ситуация может быть не такой, какой они показывают внешнему миру."
 news.220.a:0 "Народ всегда победит."
 news.220.b:0 "За [Root.GetNameDef]!"
 news.220.c:0 "Они рушатся изнутри!"
 news.220.e:0 "Социалистическая властная структура нестабильна."
 news.220.f:0 "Это неожиданное событие."
 news.221.t:0 "Троцкий возвращается в [SOV.GetNameDef]"
 news.221.d:0 "[SOV.GetNameDefCap] потрясен, ведь Сталин был свергнут группировкой, поддерживающей его старого политического соперника [SOV.GetLeader]!\nОстаётся неизвестным, где теперь находится старый диктатор, а также как именно произошёл переход власти.\nОднако все указывает на то, что это был не мирный переход, поскольку некоторые сторонники Сталина подняли восстание против нового режима Троцкого."
 news.221.a:0 "Четвёртый Интернационал идёт в авангарде."
 news.221.b:0 "Новый мировой лидер выходит на сцену."
 news.221.c:0 "Но Троцкий прямо здесь, в... О."
 news.222.t:0 "Парламент [ENG.GetAdjective] обсуждает вторжение в Скандинавию"
 news.222.d:0 "\nУчитывая стратегическую важность Скандинавского региона для оборонительных действий [ENG.GetAdjective] и возможные риски того, что противник там будет наращивать влияние, парламент [ENG.GetAdjective] обсудил возможность военного вмешательства.\nХотя политические последствия такого действия сильно давили на [ENG.GetLeader], было высказано несколько решительных аргументов, прежде чем было решено, что оставшаяся часть дебатов должна проводиться в закрытых помещениях.\n\nТакое вмешательство необратимо изменит политическую ситуацию в Северной Европе."
 news.222.a:0 "Мы делаем то, что должны, за короля и страну."
 news.222.b:0 "А они не будут угрожать независимости [Root.GetAdjective]?"
 news.222.c:0 "[ENG.GetNameDefCap] должен сделать непростой выбор."
 news.222.e:0 "Такие действия нарушат баланс в Европе."
 news.222.f:0 "Неужели они действительно рискнут вмешаться?"
 news.223.t:0 "Парламент [ENG.GetAdjective] обсуждает вмешательство в Бенилюкс"
 news.223.d:0 "\nУроки Великой войны усвоены, и [ENG.GetAdjective] не будет недооценивать стратегическую ценность региона Бенилюкс и потенциальные риски присутствия вражеских стран в этом регионе. Парламент [ENG.GetAdjective] обсудил возможность военного вмешательства.\nНесмотря на то, что политические последствия такого шага вызывают серьезную озабоченность у [ENG.GetLeader], было выдвинуто несколько решающих аргументов до того, как было принято решение, что оставшаяся часть дебатов должна проходить в закрытом режиме.\n\nТакое вмешательство неизбежно изменит политический ландшафт Западной Европы."
 news.223.a:0 "Мы сделаем то, что должны, ради короля и страны."
 news.223.b:0 "Неужели они тоже будут угрожать независимости [Root.GetAdjective]?"
 news.223.c:0 "[ENG.GetNameDefCap] должен сделать непростой выбор."
 news.223.e:0 "Такие действия нарушат баланс в Европе."
 news.223.f:0 "Неужели они действительно решатся на вмешательство?"
 news.224.t:0 "[ENG.GetNameDefCap] оказывает давление на [Spain.GetNameDef]"
 news.224.d:0 "Учитывая давнюю традицию британского влияния на Средиземноморье, осуществляемого с Гибралтара, неудивительно, что правительство [ENG.GetAdjective] решило оказать политическое давление на фашистское правительство в [Spain.GetNameDef].\n\nВсе еще восстанавливающаяся после гражданской войны [ENG.GetAdjective] поддержка гораздо важнее политических принципов."
 news.224.a:0 "Мы должны принять их дипломатическую миссию."
 news.224.b:0 "Кем себя возомнили [ENG.GetAdjective]?"
 news.224.c:0 "[ENG.GetAdjective] усиливают свое влияние."
 news.225.t:0 "[ENG.GetNameDefCap] усиливает влияние в [TUR.GetNameDef]"
 news.225.d:1 "\nСредиземноморье на протяжении многих лет оставалось важным регионом для усиления имперского влияния [ENG.GetNameDef]. Теперь правительство [ENG.GetAdjective] ищет дальнейшую поддержку в регионе. Для этого они назначили "специального консула в [TUR.GetAdjective] state".\n\nУчитывая долгие годы ожесточенной конкуренции за военно-морское превосходство в Средиземном море, еще предстоит выяснить, удастся ли им сблизить две страны."
 news.225.a:0 "Их дипломатическая миссия может быть нам полезна."
 news.225.b:0 "Кто такие [ENG.GetAdjective]?"
 news.225.c:0 "[ENG.GetAdjective] усиливают свое влияние."
 news.226.t:0 "[ENG.GetNameDefCap] усиливает влияние в [GRE.GetNameDef]"
 news.226.d:0 "\nСредиземноморье на протяжении многих лет оставалось важным регионом для усиления имперского влияния [ENG.GetNameDef]. Теперь правительство [ENG.GetAdjective] ищет дальнейшую поддержку в регионе. Для этого они назначили "специального консула в [GRE.GetAdjective] state".\n\nПрошло уже больше века с того момента, как лорд Байрон принял участие в Греческой войне за независимость, но удастся ли [ENG.GetNameDef], еще предстоит выяснить."
 news.226.a:0 "Их дипломатическая миссия может быть нам полезна."
 news.226.b:0 "За кого [ENG.GetAdjective] себя принимают?"
 news.226.c:0 "[ENG.GetAdjective] оказывают влияние."
 news.227.t:0 "Темное и дикое путешествие"
 news.227.d:0 ""Мы были в десяти милях от Берлина, когда начали проявляться первые эффекты. Они должны были усилить наши боевые действия. Смешно. Единственное, что они усилили, - это мое подозрение, что мой командир хочет от меня избавиться. Мне не помогало то, что я не мог отличить лязг гусениц немецких танков от дикого стука в собственных глазах.\nМне нужно найти доктора Гонзо.""
 news.227.a:0 "Мы в стране Фледермаусов."
 news.228.t:0 "[ENG.GetNameDefCap] объявляет о дипломатической инициативе на Балканах"
 news.228.d:0 "\n[ENG.GetNameDef] не единственный, кто видит растущую угрозу в Центральной Европе.\n\nС их статусом независимой нации, гарантированным ныне оспариваемым Версальским договором, или с фашистскими державами, в своей агрессивной риторике заявляющих права на свою территорию, несколько государств увидели необходимость проводить про-[ENG.GetAdjective] политику. \n[ENG.GetNameDef] ответил на это развитие событий, удвоив свои дипломатические усилия в регионе."
 news.228.a:0 "Будем надеяться, что они смогут защитить нас от фашистской волны."
 news.228.b:0 "Им следует придерживаться своей собственной маленькой "сферы влияния"!"
 news.228.c:0 "Европейскую стабильность необходимо поддерживать!"
 news.228.e:0 "[ENG.GetNameDefCap] готовит свою стратегию."
 news.229.t:0 "[GRE.GetNameDefCap] Противостоит [GER.GetAdjective] Нажиму"
 news.229.d:0 "Несмотря на то, что территориальные требования во главе с [GER.GetNameDef] значительно снизились, [GRE.GetNameDef] в настоящий момент провёл черту. [GRE.GetLeader] ясно дал понять, что [GRE.GetNameDef] не пойдёт на дальнейшие уступки и больше не будет подчиняться никаким [GER.GetAdjective] требованиям.\n\nВсё это произошло в ответ на ультиматум от [GER.GetNameDef] правительству [GRE.GetNameDef] уйти в отставку и принять назначенного [GER.GetAdjective] заместителя."
 news.229.a:0 "Откажитесь от [GER.GetAdjective] продвижения!"
 news.229.b:0 "Им следовало спастись, пока была возможность."
 news.229.c:0 "Скорее всего, это закончится вооружённым конфликтом."
 news.230.t:1 "Восстания в Америке"
 news.230.d:0 "И в Центральной, и в Южной Америке революционеры взяли оружие и подняли восстание во имя [USA.GetRulingIdeologyNoun].\n\nОни, как правило, хорошо экипированы и хорошо организованы, и если бы они отстаивали другую идеологию, их финансирование было бы легко отследить. Однако кто бы ни снабжал эти движения, он предпринял согласованные усилия, чтобы скрыть свою причастность.\n\nКонечно, есть только одна великая держава с заявленной внешнеполитической миссией по продвижению [USA.GetRulingIdeologyNoun] в Америке..."
 news.230.a:0 "Они доведут нашу страну до краха!"
 news.230.b:0 "Что? Не мы."
 news.230.c:0 "Народ повсюду должен восстать за дело свободы!"
 news.230.e:0 "Американские спонсируемые перевороты?\nСобытие, случающееся раз в жизни!"
 news.231.t:0 "Накопление [JAP.GetAdjective] на границе с [CHI.GetAdjective]"
 news.231.d:0 "После инцидента на мосту Марко Поло [JAP.GetName] не прекращали свое давление на границу с [CHI.GetAdjective].\nВ сочетании с агрессивной реторикой [JAP.GetAdjective], говорящей о «жестком возмездии за отказ [CHI.GetNameDef] сотрудничать», возобновление войны между [JAP.GetNameDef] и [CHI.GetNameDef] кажется все более и более вероятным с каждым днем.\n\nДипломатическая ситуация скоро достигнет точки кипения, и [JAP.GetNameDef] не выразили заинтересованности в разрядке ситуации."
 news.231.a:0 "Злобные империалистические захватчики!"
 news.231.b:0 "Конфликт в Китае вызывает беспокойство."
 news.232.t:0 "[GER.GetNameDefCap] ищет скандинавской поддержки"
 news.232.d:0 "Говоря об «общих политических интересах», [GER.GetLeader] сегодня объявил о дипломатической программе по улучшению отношений между [GER.GetNameDef] и скандинавскими странами.\nПервым шагом является создание постоянной дипломатической миссии в [DEN.GetNameDef], которая обеспечит отсутствие конфликтов между двумя странами.\n\n[DEN.GetAdjective] правительство любезно приняло это дипломатическое предложение, согласно [GER.GetLeader].\n\n[DEN.GetAdjective] дипломаты не были доступны для комментариев."
 news.232.a:0 "Заводить друзей лучше, чем наживать врагов..."
 news.232.b:0 "Неужели они действительно думают, что найдут новых союзников в этой ситуации?"
 news.232.c:0 "Мы должны внимательно следить за этой ситуацией."
 news.233.t:0 "[GER.GetAdjective] Интерес к Скандинавии"
 news.233.d_war:0 "[GER.GetNameDefCap] имеет явные стратегические интересы в Скандинавии, как для баз военных операций, так и для импорта природных ресурсов. Эскалация конфликта привела к тому, что возникла реальная угроза для всех ресурсов, перевозимых через Балтийское или Северное море.\n\nВ связи с постепенным усилением дипломатических угроз против [DEN.GetNameDef] и [NOR.GetNameDef] ожидается наращивание [GER.GetAdjective] военных операций в регионе."
 news.233.d_no_war:0 "Риторика [GER.GetAdjective] в отношении северных стран усилилась за последние недели. Посыл ясен: [DEN.GetNameDef] и [NOR.GetNameDef] ни в коем случае не должны, будь то из-за противодействия или бездействия, препятствовать немецкому импорту.\n\nХотя прямой причины для таких требований нет, так как импорт по-прежнему свободно поступает в Германию, наши дипломаты опасаются, что это предвестник действий [GER.GetAdjective] в регионе."
 news.233.a:0 "Это не сулит ничего хорошего."
 news.233.b:0 "Мы должны рассмотреть наши варианты."
 news.233.c:0 "Мы посмотрим, как будет развиваться ситуация."
 news.234.t:0 "[GER.GetAdjective] Давление на страны Бенилюкса"
 news.234.d:0 "После начала войны с Францией Германия усилила дипломатическое давление на страны Бенилюкса. Однако, при поддержке [FRA.GetAdjective] и [ENG.GetAdjective], они отказываются уступать давлению.\n\nЕсть основания полагать, что если [GER.GetNameDef] не сможет добиться своего дипломатией, то они возьмут это силой."
 news.234.a:0 "Только не снова!"
 news.234.b:0 "[GER.GetNameDefCap] должны держать на расстоянии!"
 news.234.c:0 "Это было бы агрессивным ударом."
 news.235.t:0 "Чаплин схвачен в Калифорнии"
 news.235.d:0 "Радостные новости для [GER.GetLeader] сегодня, так как его любимую кинозвезду, единственного и неповторимого Чарли Чаплина, нашли в Калифорнии. При побеге в сельскую местность его остановил [GER.GetAdjective] патруль, который сразу узнал его по культовым усам. Заставив его повторить финальный монолог из его шедевра \"Великий диктатор\", уважаемого актера \"убедили\" сопровождать [GER.GetAdjective] войска, расквартированные в регионе.\n\nТеперь его отправят в Берлин, где [GER.GetLeader] наконец-то встретится со своим героем. Хотя политические разногласия могут омрачить встречу, [GER.GetLeader] ждет момента с нетерпением, как ребенок."
 news.235.a:0 "Он получит приветствие, достойное американского героя!"
 news.236.t:0 "Ялтинская конференция"
 news.236.d:0 "Понимая, что совместная победа над [GER.GetNameDef] неизбежна, [yalta_origin.GetNameDef] и [yalta_partner.GetNameDef] хотят обеспечить будущую стабильность в Европе. [yalta_origin.GetLeader], [yalta_partner.GetLeader] и лидеры других стран, участвующих в войне, встретились, чтобы договориться о судьбе [GER.GetNameDef].\n\nДни переговоров привели к созданию новой карты Европы. Этот новый европейский порядок разделен на восток и запад из-за разрыва, проходящего через центр [GER.GetNameDef].\n\nОстается выяснить, приведет ли это к длительному миру в Европе."
 news.236.a:0 "Не хвали день до вечера."
 news.236.b:0 "Мы потребовали то, что считали правильным."
 news.236.c:0 "Давайте быстро закончим эту войну."
 news.236.e:0 "Возможно, это конец [GER.GetNameDef]."
 news.237.t:0 "Аншлюс Австрии"
 news.237.d:0 "После успешного государственного переворота местной нацистской партией в [From.Root.GetNameDef] немецкие войска пересекли границу и взяли страну под контроль.\n\nНемецких солдат встречали ликующие толпы в городах, когда они спешили через страну, чтобы присоединиться к [From.Root.GetAdjective]ам, сражающимся в продолжающейся гражданской войне. [GER.GetLeader] объявил об аншлюсе Австрии и подчеркнул:\n\nБорьба народа скоро закончится! Самая старая восточная провинция немецкого народа станет, с этого момента, новым бастионом [GER.GetNameDef]!"
 news.237.a:0 "Если это то, чего они хотят..."
 news.237.b:0 "Добро пожаловать в Рейх!"
 news.237.c:0 "Мы должны обезопасить наши северные границы!"
 news.237.e:0 "Это нарушает Версальский договор!"
 news.238.t:0 "[AST.GetNameDefCap] принимает на себя ответственность за колониальные владения"
 news.238.d:0 "\nВ попытке противостоять растущей угрозе [ENG.GetAdjective] активов в Юго-Восточной Азии, колониальные территории Сингапура и Борнео были переданы [AST.GetNameDef]. С целью стать первой и лучшей линией обороны Содружества в Тихом океане, [AST.GetNameDef] берет на себя полную ответственность за военную и административную подготовку в случае боевых действий в регионе.\n\nПредположительно, в целях противодействия имперским амбициям [JAP.GetNameDef], [AST.GetNameDef] больше не будет полностью полагаться на усилия своего бывшего колониального владыки для защиты ее берегов от вторжения."
 news.238.a:0 "Интересная стратегия."
 news.238.b:0 "Будем надеяться, что [AST.GetNameDef] знает, что делает."
 news.238.c:0 "У нас наконец есть средства, необходимые для защиты континента."
 news.238.e:0 "Они действительно верят, что это что-то изменит?"
 news.239.t:0 "[AST.GetNameDefCap] присоединяется к [SOV.GetFactionName]"
 news.239.d:0 "Назвав свои страны «естественными союзниками в деле распространения революции», [AST.GetLeader] и [SOV.GetLeader] подписали договор, в соответствии с которым [AST.GetNameDef] присоединится в качестве одного из основных членов [SOV.GetFactionName].\n[AST.GetNameDef] был объявлен сияющим примером рабочего государства, принадлежащего народу и действующего в его интересах, а не колониальных сюзеренов Европы.\n\nНекоторые могут сказать, что этот шаг был неизбежен, учитывая недавние события в политической жизни [AST.GetAdjective]. Тем не менее, этот шаг воспринимается как повод для серьезного беспокойства среди тех самых «колониальных сюзеренов Европы» и всех, кто выступает против неограниченного влияния коммунистов и их мировой революции."
 news.239.a:0 "Весьма обескураживающе."
 news.239.b:0 "Мы приветствуем наших товарищей-социалистов с распростертыми объятиями!"
 news.239.c:0 "Мы — самая передовая линия справедливости и честности!"
 news.239.e:0 "Больше крыс на тонущем корабле."
 news.240.t:0 "Джайпурский договор"
 news.240.d:0 "[AST.GetAdjective] и [HOL.GetAdjective] сегодня объявили о создании \"Пакта о совместном сотрудничестве и обороне\", согласно которому [HOL.GetAdjective] колониальные владения в Юго-Восточной Азии будут находиться под защитой вооруженных сил [AST.GetAdjective]. Договор был подписан голландским губернатором Индонезии и [AST.GetLeader], которые заявили, что сделка будет включать полную колониальную администрацию из-за \"отдаленного и сложного положения в Европе\".\n\nПравительство [HOL.GetAdjective] не сделало никаких заявлений о договоре."
 news.240.a:0 "Это стало неожиданностью."
 news.240.b:0 "Каждый выживает как может."
 news.240.c:0 "[AST.GetNameDefCap] следит за Тихим океаном."
 news.241.t:0 "[NZL.GetNameDefCap] подчиняется влиянию [AST.GetAdjective]"
 news.241.d:0 "После создания в Австралии социалистического рабочего государства, [AST.GetAdjective] правительство стремится распространить свое влияние на регион. Ссылаясь на призывы угнетенных фермеров и заводских рабочих в [NZL.GetNameDef], [AST.GetNameDef] давит на [NZL.GetAdjective] правительство с целью присоединения к \"Народному союзу\" Южной части Тихого океана.\n\nОказавшись в окружении и не надеясь на своевременную помощь от [ENG.GetFactionName], [NZL.GetNameDef] уступил требованиям. Несмотря на то, что [AST.GetLeader] провозглашает \"равенство всех государств как продолжение равенства всех людей\", нет никаких сомнений в том, какое государство здесь всем управляет."
 news.241.a:0 "На Тихом океане все меняется."
 news.241.b:0 "У нас не было выбора, так что... за революцию."
 news.241.c:0 "Давайте услышим, как вы говорите "за революцию!""
 news.242.t:0 "[AST.GetNameDefCap] принимает управление колониями в Юго-Восточной Азии"
 news.242.d:0 "\n[ENG.GetNameDef] военная доктрина уже давно борется с проблемой защиты в Юго-Восточной Азии. Теперь они надеются, что их проблемы закончатся, так как [AST.GetNameDef] берет на себя ответственность за защиту Сингапура и Борнео, чтобы противостоять враждебной военной активности в регионе.\n\nЭта передача власти включает, по крайней мере на данный момент, гражданскую администрацию колониальных регионов, чтобы позволить [AST.GetNameDef] предпринять любые меры, необходимые для защиты своего континента от нападений из-за рубежа. Политические последствия этого шага для [ENG.GetNameDef], [AST.GetNameDef] и [MAL.GetNameDef] пока неопределенны."
 news.242.a:0 "Это меняет баланс сил в Юго-Восточной Азии."
 news.242.b:0 "Будем надеяться, что [AST.GetNameDef] не испортит это."
 news.242.c:0 "Отлично! Все идет по плану."
 news.243.t:0 "[AST.GetNameDefCap] и [JAP.GetNameDef] объявляют об альянсе"
 news.243.d:0 "Ввиду недавних приобретений [AST.GetNameDef] и [JAP.GetNameDef] в Восточной Азии и на Тихом океане многие обозреватели ожидали, что столкновение между двумя быстрорастущими империями — лишь вопрос времени. Однако страны вместо этого достигли соглашения о сотрудничестве, которое поспешно окрестили «Тихоокеанским барьером».\nДоговор не был обнародован ни одной из стран, поэтому многие аспекты их соглашения остаются неизвестными. Определенно лишь то, что обе стороны обещали друг другу военную поддержку для «противодействия наступлению алчных чужаков в наших соответствующих регионах».\nСлишком рано говорить, как видит мировой порядок [JAP.GetNameDef] и [AST.GetNameDef], но не может быть никаких сомнений в том, что [AST.GetFactionName] в настоящий момент доминирующая сила в Тихоокеанском регионе."
 news.243.a:0 "Мягко говоря, тревожно."
 news.243.b:0 "[Root.GetNameDefCap] приветствует сотрудничество со всеми, кто не встанет у нас на пути."
 news.243.c:0 "Это замечательное партнерство, по крайней мере, на данный момент."
 news.244.t:0 "[AST.GetNameDefCap] создает сферу влияния"
 news.244.d:0 "В ходе хода, который не стал неожиданным для большинства наблюдателей, [AST.GetNameDef] объявило о создании собственной, независимой организации договора. [AST.GetLeader] заявил, что [AST.GetNameDef] будет искать союзников для поддержания стабильности в Юго-Восточной Азии, в тихоокеанском регионе и за его пределами, и при необходимости противостоять агрессии в отношении [AST.GetAdjective] государства и других.\n\nС учетом последних шагов по отдалению от связей с Содружеством, этот шаг кажется естественным на пути [AST.GetNameDef] к обретению единственного хозяина своей судьбы."
 news.244.a:0 "Они делают ставку на доминирование."
 news.244.b:0 "Наш собственный двор не будет управляться европейцами!"
 news.245.t:0 "[USA.GetNameDefCap] присоединяется к инициативе обороны [AST.GetAdjective]"
 news.245.d:0 "\nВ связи с обеспокоенностью в отношении растущей стратегической важности Тихого океана [AST.GetNameDef] и [USA.GetNameDef] подписали договор о сотрудничестве в Тихом океане. Хотя он предназначен для поддержания политической стабильности в регионе и, в конечном итоге, для транстихоокеанских перевозок, договор также включает непредвиденные обстоятельства для военной обороны, позволяя двум странам осуществлять свою власть далеко за пределами их фактических территориальных претензий.\n\nПоскольку столь обширная территория сейчас находится под «защитой» Австралии и Америки, наверняка это лишь вопрос времени, когда эти непредвиденные обстоятельства подвергнутся испытанию."
 news.245.a:0 "Захватывающий шаг..."
 news.245.b:0 "Это обеспечит нам место как доминирующей державе в Тихом океане."
 news.245.c:0 "Вместе мы обеспечим стабильность в половине земного шара."
 news.246.t:0 "[USA.GetNameDefCap] и [CAN.GetNameDef] формализовали альянс"
 news.246.d:0 "В результате длительного сотрудничества в рамках Объединенного совета по обороне между [USA.GetNameDef] и [CAN.GetNameDef] возникло новое политическое партнерство. Программа под названием [CAN.GetFactionName] направлена на дальнейшее продвижение североамериканских интересов во всех сферах внешней политики, включая все вопросы обороны и военных действий.\n\nПоскольку [CAN.GetNameDef] все еще ищет свою послевоенную идентичность, а [USA.GetAdjective] политики фактически сражаются друг с другом из-за изоляционистской и интервенционистской политики, недавно сформированный альянс может дать обеим странам столь необходимое внешнеполитическое направление."
 news.246.a:0 "Обратят ли они внимание на Америку или на что-то за ее пределами?"
 news.246.b:0 "Братья на земле, братья по оружию!"
 news.246.c:0 "Теперь нет угрозы дома."
 news.247.t:0 "[CAN.GetNameDefCap] присоединилась к альянсу во главе с [GER.GetAdjective]!"
 news.247.d:0 "После быстрых переговоров [CAN.GetNameDef] объявили, что стали участниками [GER.GetFactionName]. Правительство [CAN.GetAdjective] провозгласило себя \"гордым защитником [GER.GetAdjective] народа, так же как [GER.GetNameDef] будет защитником народа [CAN.GetAdjective]\".\n\nХотя детали вступления [CAN.GetNameDef] в пакт неизвестны, кажется вероятным, что в скором времени начнутся военные действия против врагов [GER.GetNameDef]. Возможно, это будет решающий момент в военных действиях."
 news.247.a:0 "Шокирующее событие!"
 news.247.b:0 "Мы окажем помощь нашим союзникам в Европе!"
 news.247.c:0 "Братские народы стоят вместе!"
 news.247.e:0 "Проклятые переменчивые [CAN.GetAdjective]!"
 news.248.t:0 "[ENG.GetNameDefCap] передает северо-восточные территории"
 news.248.d:0 "\nПосле усиления дипломатического давления со стороны [CAN.GetNameDef], [ENG.GetNameDef] передал территории Лабрадор и Ньюфаундленд государству [CAN.GetAdjective]. Объединить все законные территории [CAN.GetAdjective] долгое время было целью политиков [CAN.GetAdjective], и сейчас эта цель стала на шаг ближе к достижению.\n\nКонечно, остается открытым вопрос о том, что составляет \"законную территорию [CAN.GetAdjective]\". И [ENG.GetNameDef], и весь североамериканский континент отныне будут спать с открытым глазом."
 news.248.a:0 "[ENG.GetNameDefCap] больше не имеет опоры в Северной Америке..."
 news.248.b:0 "Все идет так, как должно быть."
 news.248.c:0 "Тьфу, отсталые скалы!"
 news.249.t:0 "[CAN.GetNameDefCap] и [MEX.GetNameDef] объединяются!"
 news.249.d:0 "Политики [USA.GetAdjective] с тревогой проснулись сегодня утром: [CAN.GetNameDef] и [MEX.GetNameDef] объявили о новом оборонительном пакте против «противодействия и сдерживания непосредственных угроз суверенитету наших стран». Едва прикрытая угроза демонстрирует намерение воспрепятствовать военным усилиям [USA.GetNameDef] на американском континенте и, возможно, за его пределами.\n\nПолитические обозреватели сравнивают ситуацию с Европой перед Великой войной: две стороны, которым нечего терять, и ни одного способа ослабить напряженность. Вопрос стоит не столько в том, кто представляет большую угрозу, сколько в том, какая из сторон нанесет упреждающий удар."
 news.249.a:0 "Мы уже видели это раньше; все это кончится слезами."
 news.249.b:0 "Армия севера будет готова."
 news.249.c:0 "Армия юга будет готова."
 news.249.e:0 "Мы должны найти способ противостоять этому ходу, и быстро."
 news.250.t:0 "Гражданская война в [MEX.GetNameDef]!"
 news.250.d:0 "Нестабильность в мексиканской политической системе, которая развивалась на протяжении нескольких последних лет, вылилась в вооруженный конфликт! Вооружённые силы Партии синархистов начали боевые действия, и в крупнейших городах страны вспыхнули бои!\n\n Хотя изначально считалось, что у правительства будет очевидное преимущество перед повстанцами, ходят слухи об иностранной поддержке националистов. Соседи внимательно следят за развитием событий. Что принесет этот конфликт Мексике, покажет только время."
 news.250.a:0 "Тревожный конфликт, который может опустошить Мексику."
 news.250.b:0 "Теперь нам нужно всего лишь убедиться, что националисты захватывают власть."
 news.250.c:0 "Высокая цена за нашу страну, но ее нужно заплатить."
 news.251.t:0 "[CAN.GetNameDefCap] добивается немедленной репатриации"
 news.251.d:0 "\n\nПосле срыва переговоров с Вестминстером и беспрецедентных 63-часовых дебатов парламент Канады отменил Закон о Британской Северной Америке и закрепил канадскую конституцию в законах, неприкосновенных для британского парламента и монархии.\nХотя это не является антибританским шагом само по себе, это сигнализирует об отходе от политики Содружества старой империи.\n\nХотя это естественный шаг для любой страны, желающей обеспечить свою будущую стабильность, он не облегчает и без того напряженное состояние мировой политики."
 news.251.a:0 "Тогда они смогут выдержать это в одиночку."
 news.251.b:0 "[ENG.GetNameDefCap] слабеет с каждым днем."
 news.251.c:0 "Почему это должно было произойти именно сейчас?!"
 news.251.e:0 "Империя трещит по швам."
 news.251.f:0 "От моря к морю [CAN.GetNameDef] будет свободной!"
 news.252.t:0 "[CAN.GetNameDefCap] присоединяется к [GER.GetFactionName]!"
 news.252.d:0 "Рассматривая себя естественными союзниками, [GER.GetNameDef] и [CAN.GetNameDef] подписали договор о взаимной обороне. [CAN.GetAdjective] премьер-министр [CAN.GetLeader] объявил об альянсе в речи, цитируя естественное совпадение [CAN.GetAdjective] и [GER.GetAdjective] интересов.\n\nУчитывая возросшую мобилизацию по всей Европе и недавнее дистанцирование [CAN.GetNameDef] от Содружества, нетрудно спрогнозировать характер обсуждаемых интересов.\nИ в Европе, и в Америке старые державы наблюдают с растущей озабоченностью."
 news.252.a:0 "Таков мировой порядок..."
 news.252.b:0 "Мы — противовес, поддерживающий баланс сил."
 news.252.c:0 "Теперь баланс сил склоняется в нашу пользу!"
 news.252.e:0 "Ещё один фронт для беспокойства, если дело дойдёт до войны."
 news.252.f:0 "Мы становимся сильнее!"
 news.253.t:0 "[AST.GetNameDefCap] стремится к дистанциированию от Содружества"
 news.253.d:0 "\nВ своей утренней речи премьер-министр [AST.GetLeader] объявил, что правительство Австралии привержено росту и стабильности как океанического государства. Это означает, что Австралия должна смотреть на другие берега, кроме берегов британской Европы, поскольку австралийский народ больше не может нести бремя иностранных конфликтов на своих плечах. Ссылаясь на речь короля об открытии прошлого парламента, [AST.GetLeader] прямо заявил: \"Больше никакого Галлиполи!\"\n\nБурные овации толпы указывают на то, что началась новая эпоха австралийской политики. Где она закончится, мир может только предполагать."
 news.253.a:0 "Отныне [Root.GetFactionName] придётся обходиться без [AST.GetNameDef]."
 news.253.b:0 "Станьте свидетелем того, как империя рушится на части..."
 news.253.c:0 "Неужели они решили СЕЙЧАС добиваться большей независимости?"
 news.253.e:0 "Это будет иметь большие последствия для Тихого океана."
 news.253.f:0 "Мы проложим свой собственный путь!"
 news.254.t:0 "[AST.GetNameDefCap] и Новая Зеландия \"Объединились\""
 news.254.d:0 "[AST.GetNameDefCap], заявив о своей полной независимости, начал оказывать влияние на Южную часть Тихого океана. В рамках этого [AST.GetAdjective] правительство потребовало, чтобы все бывшие колонии Океании были переданы под его юрисдикцию.\n\nПо понятным причинам, правительства обремененных долгами [ENG.GetAdjective] и Новой Зеландии первоначально оказывали дипломатическое сопротивление. Однако, без каких-либо оснований для трансляции власти Империи в регион, которая ранее исполнялась Австралией, было лишь вопросом времени, когда [AST.GetNameDef] предъявит ультиматум, подкрепленный силой.\nНовая Зеландия теперь является самой восточной провинцией [AST.GetNameDef]."
 news.254.a:0 "Мы должны внимательно следить за ситуацией."
 news.254.b:0 "И правильно."
 news.254.c:0 "Это предательство!"
 news.260.t:0 "[SAF.GetNameDefCap] берет на себя ответственность за африканские колонии"
 news.260.desc:0 "\nНа официальной церемонии сегодня [SAF.GetLeader] подписал договор, который предоставит его правительству контроль над Британскими зависимостями в Африке. Теперь территории Бечуаналенда, Родезии и Кении будут управляться из Претории.\n\nВыступая перед палатой общин, [ENG.GetLeader] отрицал, что этот шаг ослабит позиции Великобритании на континенте, назвав его вместо этого "самым разумным изменением, позволяющим обеспечить более эффективное управление и защиту этих районов""
 news.260.a:0 "Интересно."
 news.260.b:0 "В самом деле весьма разумно."
 news.260.c:0 "Это начало конца Империи в Африке?"
 news.261.t:0 "[ENG.GetNameDefCap] реорганизует африканские колонии"
 news.261.desc:0 "Британский парламент принял меры, которые в корне реорганизуют части британских колоний в Африке. Новый акт фактически создает два новых колониальных режима в штатах Родезия и Кения. Эти новые государства получат определенную свободу в управлении своими делами, но также будут обязаны обеспечивать свою собственную оборону. \n\nНекоторые консерваторы, выступавшие против этого решения, открыто выразили опасения, что это решение является лишь первым шагом в процессе, который они называют «деколонизацией». \n\n[ENG.GetLeader] был недоступен для комментариев."
 news.261.a:0 "Интересно."
 news.261.b:0 "Какая глупая договоренность."
 news.261.c:0 "Видимо, это один из способов расширить Содружество."
 news.262.t:0 "Гражданская война в Южной Африке"
 news.262.desc:0 "Тлеющее в течение долгого времени напряжение в [SAF.GetName] вылилось в открытую войну. Националисты-фашисты заявляют, что политика демократического правительства унионистов угрожает [SAF.GetAdjective] образу жизни. Они утверждают, что унионисты наносят удар в спину храбрым воинам англо-бурских войн, безоговорочно поддерживая [ENG.GetName].\n\nВременное правительство националистов во главе с [SAF.GetLeader] призвало всех истинных патриотов присоединиться к ним и вернуть свободу Южной Африке силой оружия. Правительство унионистов в Претории объявило националистов «мятежниками и предателями худшего сорта». В условиях, когда вооруженные силы в равной степени лояльны обеим сторонам, конфликт в Южной Африке может продлиться долгое время."
 news.262.a:0 "Возможно, нам стоит подумать об отправке поддержки."
 news.262.b:0 "Этого следовало ожидать."
 news.262.c:0 "Возможно, самые большие угрозы находятся внутри наших границ..."
 news.263.t:0 "Антироялистские бунты в [SAF.GetNameDef]"
 news.263.desc:0 "Волна антимонархических демонстраций, многие из которых переросли в насильственные, прокатилась по Южной Африке. Тысячи протестующих вышли на улицы, взяли штурмом полицейские участки и другие правительственные здания. Портреты Короля были сорваны, разорваны, сожжены и, в одном случае, растворены в кислоте. \n\nПо словам наблюдателей, полиция и армия были настроены очень неохотно, пытаясь сдержать восстание, и вместо этого предпочитая охранять фабрики и мосты. Это поднимает вопрос, действительно ли беспорядки стали сюрпризом для правительства."
 news.263.a:0 "Революция на подходе?"
 news.263.b:0 "Без комментариев."
 news.263.c:0 "Возможно, самые большие угрозы находятся внутри наших границ..."
 news.264.t:0 "Африканский народный союз"
 news.264.desc:0 "Основатели [SAF.GetFactionName] собрались в Претории, чтобы объявить о создании своего нового союза. Европейские наблюдатели сразу же отметили, что единственное правительство с какой-либо законностью - это правительство самой [SAF.GetNameDef], [SAF.GetLeader] председательствует в разношерстном собрании самопровозглашенных правительств в изгнании и других революционных групп.\n\nПрисутствующие стороны опубликовали совместную декларацию, призывая европейские имперские державы немедленно передать любые земли, находящиеся в их владении в Африке, ее законным владельцам, осуждая практику колониализма и обещая принести свободу угнетенным африканским народам - любыми необходимыми средствами."
 news.264.a:0 "Африканцы? Управляют собой!?"
 news.264.b:0 "Первый шаг к истинной свободе."
 news.264.c:0 "Посмотрим, сохранят ли они свой идеализм в грядущих войнах."
 news.264.d:0 "Всё-таки они не настоящие коммунисты."
 news.265.t:0 "[SAF.GetAdjective] давление на Францию"
 news.265.desc:0 "После неожиданного поражения Франции на своей территории возникли вопросы по поводу законности ее колониальной империи. Правительства [SOV.GetNameDef] и [SAF.GetNameDef] опубликовали совместное заявление, в котором говорилось, что Франция больше не может нести ответственность за поддержание порядка на Мадагаскаре, и потребовали передачи острова [SAF.GetNameDef].\n\nПравительство Свободной Франции собралось для обсуждения этого вопроса. Эксперты по обороне считают маловероятным, что истощенные французские войска смогут защитить остров в случае войны."
 news.265.a:0 "Просто акулы чуют кровь в воде."
 news.265.b:0 "Посмотрим, разумны ли французы."
 news.265.c:0 "Французам конец."
 news.265.d:0 "Ещё одна бескровная победа коммунизма."
 news.270.t:0 "Рождение [NZL.GetAdjective] брони"
 news.270.desc:0 "Громыхая на главной улице столицы, новый танк Bob Semple сил обороны Новой Зеландии является настоящим свидетельством изобретательности и боевого духа [NZL.GetAdjective] людей. Вооружённый шестью пулемётами и почти пуленепробиваемой стальной обшивкой, это, возможно, будет самым большим препятствием, которое должен будет преодолеть любой оккупант.\n\nНекоторые так называемые эксперты указывают на унылую производительность и слабое вооружение машины как на причины, по которым её не следует строить, но, как сказал премьер-министр [NZL.GetLeader] во время официальной церемонии приёмки, своевременная оборона королевства настолько важна, что идеального оборудования не следует ожидать и требовать."
 news.270.a:0 "Вот как вы называете это танком!"
 news.270.b:0 "Они называют эту штуку ЧЕМ?"
 news.271.t:0 "Большой Боб выходит на сцену"
 news.271.desc:0 "После потрясающего успеха танка Боб Семпл высшее командование сил обороны [NZL.GetName] запросило создание его увеличенной версии. При росте более 15 футов и весе не менее 120 тонн, новый танк внушает благоговение в каждом смысле этого слова. Его вооружение, состоящее из спаренных 17-фунтовых противотанковых пушек, быстро разделается с любым врагом, в то время как его тяжелая броня, тщательно испытанная для обеспечения ее, по сути, пуленепробиваемости, позволит танку войти в гущу сражения, не опасаясь за свою безопасность.\n\nНа церемонии открытия один из обозревателей назвал его \"самым выдающимся танком, когда-либо произведенным\", в то время как другой назвал его \"не имеющим себе равных\".\nОжидается, что массовое производство начнется в течение месяца."
 news.271.a:0 "Мир дрожит при виде наших танков!"
 news.271.b:0 "Мир дрожит... от смеха."
 news.272.t:0 "Бенгальский голод"
 news.272.desc:0 "Натуральные катаклизмы, бездарное управление и разруха, принесённая войной, в совокупности привели к массовому голоду в Индии.\n\nВ результате циклона, который опустошил значительные районы страны и уничтожил почти весь урожай риса, колониальная администрация отреагировала медленно - некоторые могут сказать, намеренно медленно - на этот вопрос. Несмотря на продовольственный излишек в других районах Индии, никакой гуманитарной помощи отправлено не было из-за опасений, что она может попасть в руки противника.\n\nЗначительная часть территории была опустошена, и масштабы людских и производственных потерь пока даже нельзя оценить."
 news.272.a:0 "Ужасно."
 news.272.b:0 "Страшно."
 news.272.c:0 "С этим ничего не поделаешь."
 news.273.t:0 "Конец Бенгальского голода"
 news.273.desc:0 "После месяцев относительного бездействия колониальное правительство и индийская армия наконец решили действовать. Развернуто распространение чрезвычайного продовольствия в пострадавшие районы, а новый урожай риса превысил ожидания. \n\nОднако цены на продукты питания в пострадавших районах остаются высокими, и долгосрочные последствия голода пока еще нельзя оценить."
 news.273.a:0 "Хорошо, что это наконец закончилось."
 news.273.b:0 "Наконец-то."
 news.280.t:0 "Индия получает самоуправление"
 news.280.desc:0 "После напряженной встречи между [GER.GetAdjective] послом и [ENG.GetAdjective] министром иностранных дел правительство [ENG.GetNameDef] объявило, что [RAJ.GetNameDef] отныне будет иметь право самостоятельно определять свою политику. Вековая власть англичан над субконтинентом подошла к удивительно быстрому концу, так как госслужащие отправляются домой, а управление колонией переходит к индийцам.\n\nОдним из первых действий нового индийского руководства было объявление широкомасштабного договора о сотрудничестве с [GER.GetNameDef]. Индийское правительство отказалось комментировать обвинения в том, что это была цена, которую оно заплатило за немецкую поддержку."
 news.280.a:0 "Отлично."
 news.280.b:0 "Это конец Британской империи?"
 news.280.c:0 "Ценный союзник."
 news.280.d:0 "Не лучший наш час."
 news.281.t:0 "Индия получает самоуправление"
 news.281.desc:0 "В совместном заявлении явно взволнованный [ENG.GetAdjective] министр иностранных дел вместе с [SOV.GetAdjective] послом объявил, что Индии будет предоставлен полный суверенитет над своими делами незамедлительно. Не совсем понятно, какую роль [SOV.GetNameDef] сыграла в том, чтобы добиться этой внезапной перемены в политике [ENG.GetAdjective], но, похоже, она была значительной.\n\nОдним из первых действий нового индийского руководства стало объявление о более тесном сотрудничестве с [SOV.GetNameDef], что придало дополнительный вес слухам о том, что [SOV.GetNameDef] вмешалась от их имени."
 news.281.a:0 "Отлично."
 news.281.b:0 "Конец Британской империи?"
 news.281.c:0 "Ценный союзник."
 news.281.d:0 "Не лучший наш час."
 news.282.t:0 "Движение за выход Индии из Британского Содружества"
 news.282.desc:0 "Призывы к независимости Индии в последнее время усилились. Сейчас ситуация обострилась, так как радикальное Движение за выход Индии из Британского Содружества потребовало, чтобы [ENG.GetNameDef] как можно скорее покинули страну. [ENG.GetAdjective] власти быстро отреагировали и подавили движение, арестовав нескольких лидеров во время рейдов на рассвете по домам по всей Индии. \n\nОднако, как указывают отчеты Специального отдела, многие сторонники все еще на свободе, и многие в Гражданской службе выражают опасения, что более экстремистские элементы движения могут даже прибегнуть к насилию."
 news.282.a:0 "Будущее остается неопределенным."
 news.282.b:0 "Еще одна обреченная попытка обрести свободу."
 news.283.t:0 "Индийский национальный конгресс побеждает на выборах в провинциях"
 news.283.desc:0 "\nНа недавних местных выборах Индийский национальный конгресс получил подавляющее большинство за свою платформу медленного и упорядоченного перехода к местному самоуправлению и статусу доминиона в будущем. \n\nПо всей видимости, индийцы отвергли более радикальную политику, проводимую Ганди, который выступал за полный разрыв с Великобританией и абсолютное самоуправление как можно скорее."
 news.283.a:0 "Они приведут нас к свободе."
 news.283.b:0 "Действительно ли голоса что-то меняют?"
 news.284.t:0 "Набирает силу движение за сварадж на провинциальных выборах"
 news.284.desc:0 "\nБританские чиновники были шокированы полученными утром результатами провинциальных выборов. Очевидно, подавляющее большинство индийцев проголосовали за кандидатов, выступающих за сварадж. В провинциях по всей Индии уже раздаются призывы как можно скорее превратить существующее ограниченное местное самоуправление в полное самоуправление. \n\nПредставитель [ENG.GetAdjective] правительства подчеркнул, что сейчас не время обсуждать такие меры и что не может быть и речи о передаче индийцам полномочий."
 news.284.a:0 "Свобода близка."
 news.284.b:0 "Британцы с этим никогда не смирятся."
 news.285.t:0 "Пакистан обрел свободу"
 news.285.desc:1 "В соответствии с двухнациональной теорией мусульманское меньшинство получило суверенную родину в районах, где мусульмане составляют большинство населения. Изначально названный Пакстан, чтобы продемонстрировать объединение народов Пенджаба, Афганистана, Кашмира, Синда и Белуджистана, он был переименован в Пакистан для облегчения произношения.\n\nОднако между только что обретшими свободу Индией и Пакистаном сохраняется напряженность, так как некоторые приграничные территории оспариваются обеими новыми странами. Некоторые обозреватели даже предупреждают о возможности новой войны на полуострове."
 news.285.a:0 "Возможно, это был единственный путь."
 news.285.b:0 "Свобода!"
 news.285.c:0 "Посмотрим, продлится ли мир."
 news.286.t:0 "Австралия разорвала связи с Британией"
 news.286.desc:0 "\nВ результате горячо оспариваемого голосования небольшое большинство парламента [AST.GetAdjective] приняло решение о выходе страны из состава Британской империи. Последние остатки британского правового порядка были признаны недействительными. [AST.GetLeader] уже подписал решение, сделав его законом и тем самым обойдя сложившуюся правовую традицию королевского одобрения, выдаваемого генерал-губернатором. Таким образом, [AST.GetNameDef] становится полностью суверенным государством.\n\nПарламент также проголосовал за создание Конституционного комитета, который будет обсуждать и давать рекомендации относительно изменений, которые будут внесены в Конституцию, чтобы удалить все следы британского вмешательства в дела [AST.GetAdjective]."
 news.286.a:0 "Чистая формальность."
 news.286.b:0 "Свобода!"
 news.286.c:0 "Австралия выходит из Британского Содружества."
 news.287.t:0 "Германия оккупирует Западную Польшу"
 news.287.desc:0 "Немецкие войска оккупировали Западную Польшу, официально в целях защиты немецких меньшинств от хаоса, последовавшего после краха польского правительства.\n\nСоветские войска в порядке ушли из этих районов, в результате чего Польша фактически разделена между двумя державами."
 news.287.a:0 "Выдумки!"
 news.287.b:1 "Со временем мы возьмем и все остальное..."
 news.287.c:1 "Фашисты продвигаются вперед — пока что."
 news.288.t:0 "Формирование единого фронта в Китае"
 news.288.desc:0 "[CHI.GetLeader] и [PRC.GetLeader] сделали совместное заявление, объявив, что они отложили в сторону свои разногласия в связи с японским нападением. Обе стороны будут придерживаться политики невмешательства друг против друга, пока длится война против Японии, и пообещали сделать все возможное, чтобы отбросить захватчика. Ряд мелких военачальников также заявили о своей поддержке, отдав свои войска под командование [CHI.GetLeader].\n\nЕще неизвестно, будут ли давние враги из гражданской войны в Китае на самом деле работать вместе, и многие эксперты считают, что это лишь немного отсрочит неизбежное поражение Китая."
 news.288.a:0 "Альянс отчаяния."
 news.288.b:0 "Это ничего не меняет!"
 news.288.c:0 "Нестабильный альянс."
 news.337.title:0 "Унижение в Африке"
 news.337.desc:0 "Сегодня между [ETH.GetLeader] и [ITA.GetLeader] был подписан мирный договор, положивший конец вражде между двумя странами. Несмотря на значительное различие в силах между не имеющим выхода к морю королевством и империей, охватывающей весь мир, эфиопское правительство, безусловно, вышло победителем в этих переговорах. Италия не только должна заключить перемирие с Эфиопией, но и территории Эритреи и Итальянского Сомали были официально переданы [ETH.GetNameDef].\n\nПоскольку это уже второе поражение итальянских вооруженных сил в Эфиопии, правительство [ITA.GetLeader] находится в смятении, и, вероятно, потребуется много лет, прежде чем уязвленная гордость итальянцев действительно оправится от этого поражения."
 news.337.desc_some_states:0 "Сегодня между [ETH.GetLeader] и [ITA.GetLeader] был подписан мирный договор, положивший конец вражде между двумя странами. Несмотря на значительное различие в силах между не имеющим выхода к морю королевством и империей, охватывающей весь мир, эфиопское правительство, безусловно, вышло победителем в этих переговорах. Италия не только должна заключить перемирие с Эфиопией, но и некоторые бывшие итальянские территории в Восточной Африке были официально переданы [ETH.GetNameDef].\n\nПоскольку это уже второе поражение итальянских вооруженных сил в Эфиопии, правительство [ITA.GetLeader] находится в смятении, и, вероятно, потребуется много лет, прежде чем уязвленная гордость итальянцев действительно оправится от этого поражения."
 news.337.desc_no_states:0 "Сегодня был подписан мирный договор между [ETH.GetLeader] и [ITA.GetLeader], прекращающий боевые действия между двумя нациями. Несмотря на большую разницу в силах между запертым сушей королевством и всемирной империей, эфиопское правительство сумело выстоять против итальянских войск.\n\nПоскольку это уже второе поражение итальянских вооруженных сил в Эфиопии, правительство [ITA.GetLeader] в полном раздрае и, скорее всего, пройдут многие годы, прежде чем уязвленная гордость Италии оправится от этого поражения."
 news.337.a:0 "Отлично для Эфиопии!"
 news.337.b:0 "Мы надеемся, что [ITA.GetLeader] не будут вспоминать по его неудачам."
 news.337.c:0 "Мы никогда не оправимся от этого."
 news.337.d:0 "Империя Рас Алулы возрождается!"
 news.350.t:0 "Мирное воссоединение [ROOT.GetNameDef]"
 news.350.desc:0 "\n\nВняв воле народа [ROOT.GetAdjective], [ROOT.GetLeader] сумел осуществить мирное объединение [ROOT.GetRulingIdeology] [ROOT.GetAdjective] штатов. Остаётся только дождаться, какое влияние это окажет на весь мир, но, по крайней мере, в [ROOT.Capital.GetCapitalVictoryPointName] люди праздновали это историческое событие."
 news.350.a:0 "Это может быть опасно"
 news.350.b:0 "Это, безусловно, новое начало"
 news.350.c:0 "Очень хорошо, я полагаю"
 news.409.t:0 "Желтая река взрывается"
 news.409.desc:0 "В последней попытке остановить надвигающуюся мощь [JAP.GetAdjective] войск, сеть дамб и сооружений по защите от наводнений вдоль Желтой реки была разрушена [FROM.GetAdjective] армией.\n\nПоследовавшее внезапное наводнение вытеснило огромное количество сельского населения, у которого было только краткое окно, чтобы подготовиться.\n\nОстается выяснить, сможет ли этот акт обеспечить [FROM.GetAdjective] армии достаточно времени для перегруппировки и дальнейшего ведения боевых действий."
 news.409.a:0 "Понял."
 news.409.b:0 "Это не может остановить неизбежное."
 news.409.c:0 "Гуманитарная трагедия."
 ace_promoted.1.t:0 "Произведен в аса-пилота"
 ace_promoted.2.t:0 "Появляется дикий ас"
 ace_promoted.1.d:0 "Мало кто рискует так же сильно, как храбрые пилоты [Root.GetAdjective] ВВС. [From.GetName] [From.GetSurname], опытный пилот, известный под позывным [From.GetCallsign], отличил [From.GetHerselfHimself] не только тем, что вернулся живым с недавней миссии над [From.GetMissionRegion], но и пережил значительные победы во многих критических сражениях.\n\nПриведенный как сияющий пример [Root.GetAdjective] храбрости, недавнее повышение [From.GetName] получило широкую огласку. Хотя люди могут считать войну больше адом, чем славой, многие рады видеть, что все еще есть герои, за которыми можно объединиться."
 ace_promoted.1.d_major:0 "Только избранные рискуют так же, как и отважные пилоты [Root.GetAdjective] ВВС. [From.GetName] [From.GetSurname], опытный пилот, известный под позывным [From.GetCallsign], сумел не только вернуться живым, но и невероятно искусно пилотировать свой [From.GetWing]. Недавно [From.GetName] участвовал в миссии над [From.GetMissionRegion] и сыграл ключевую роль в успехе этой важнейшей операции.\n\nДостижения [From.GetName] - блистательный пример храбрости, достойный подражания для всей [Root.GetAdjective] армии. Несмотря на то что народ считает войну скорее адом, нежели подвигом, многие рады видеть, что в наших рядах еще есть герои, которые способны воодушевить нас."
 ace_promoted.1.a:0 "Кто смел, тот победил."
 ace_died.1.t:0 "Гибель [From.GetCallsign] над [From.GetMissionRegion]"
 ace_died.1.d:0 "Один из самых знаменитых асов [From.Owner.GetName], [From.GetFullName], был сбит при выполнении задания в ходе миссии над [From.GetMissionRegion]. К сожалению, поскольку он был известной фигурой, его гибель сильно подорвала боевой дух тех, кто равнялся на него.\n\nМы бы с удовольствием сдержали это известие от народа, но отсутствие [From.GetName] на людях вызвало бы подозрения. В конечном счете его гибель стала частью легенды, которая, как мы надеемся, переживет наши нынешние беды."
 ace_died.1.d_major:0 "Один из самых известных асов [From.Owner.GetName], [From.GetFullName], погиб при исполнении служебных обязанностей. Летчики, вернувшиеся с задания, сообщают, что видели, как [From.GetHerHis] [From.GetWingShort] был сбит огнем противника над [From.GetMissionRegion]. К сожалению, поскольку [From.GetSheHe] давно стал публичной фигурой, гибель [From.GetCallsign] крайне деморализует многих людей, которые восхищались [From.GetHerHim].\n\nХотя мы бы хотели скрыть это событие от людей, отсутствие публичных выступлений от [From.GetName] вскоре вызовет подозрения. В конечном счете, [From.GetHerHis] смерть - это еще одна часть легенды, которая, как мы надеемся, будет жить долго после наших нынешних проблем."
 ace_died.1.a:0 "Живая легенда все же лучше."
 ace_killed_by_ace.1.t:0 "[From.GetFullName] Сбит [Prev.GetCallsign]"
 ace_killed_by_ace.1.d:0 "Летчики, вернувшиеся с [From.GetMissionRegion], сообщают, что эскадрилья из [Prev.Owner.GetAdjective] самолетов, которую возглавлял небезызвестный [Prev.GetCallsign], поставила своей целью преследование [From.GetCallsign]. Уклоняясь от нескольких очередей [Prev.Owner.GetAdjective] и сбив несколько вражеских самолетов, [From.GetCallsign] оказался повержен [Prev.GetCallsign], который, как сообщается, перехитрил [From.GetHerHim] и точным попаданием разорвал топливные баки. Самолет [From.GetName] [From.GetSurname] загорелся и, объятый пламенем, упал в штопор над [From.GetMissionRegion].\n\nНа протяжении всей своей службы [From.GetFullName] проявлял величайшую отвагу и был для многих примером. Потеря этого национального героя — это огромный удар по [From.Owner.GetAdjective] Военно-воздушным силам и тяжелый удар для всей нашей страны. Знание того, что пока мы скорбим, [Prev.Owner.GetName] восхваляет [Prev.GetFullName] как героя, делает эту трагедию еще более ужасной."
 ace_killed_by_ace.1.d_major:1 "Вернувшиеся из [From.GetMissionRegion] пилоты сообщают, что эскадрилья [Prev.Owner.GetAdjective] самолетов во главе с печально известным [Prev.GetCallsign] сосредоточила свои усилия на преследовании [From.GetCallsign]. Сбив несколько самолетов противника и увернувшись от нескольких выстрелов [Prev.Owner.GetAdjective], [From.GetCallsign] в своем [Prev.GetWingShort] был подавлен [Prev.GetCallsign], который, как сообщается, обошел его с фланга и разнес топливные баки метким выстрелом. [From.GetWingShort] [From.GetName] [From.GetSurname] загорелся и рухнул в [From.GetMissionRegion] в страшном огне.\n\n[From.GetFullName] проявил большое мужество на протяжении всей службы, и на него равнялись многие. Потеря этого национального героя — тяжелый удар для [From.Owner.GetAdjective] ВВС и сокрушительный удар для всей нашей нации. Осознание того, что пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, делает трагедию еще более ужасной."
 ace_killed_by_ace.1.a:0 "Тяжелая утрата для нас всех"
 ace_killed_other_ace.1.t:0 "[From.GetFullName] сбил [Prev.GetCallsign]"
 ace_killed_other_ace.1.d:0 "Наша последняя миссия над [From.GetMissionRegion] стала большим успехом для [From.Owner.GetAdjective] ВВС и не только. Сообщения указывают на героические действия [From.GetFullName], которому удалось перехитрить пилота [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], известного как [Prev.GetCallsign]. [From.GetCallsign] использовал [From.GetHerselfHimself] как приманку и заманил [Prev.GetCallsign] в ловушку, где пилоты [From.Owner.GetAdjective] смогли спикировать на эскадрилью [Prev.GetCallsign]. [From.GetCallsign] удалось переиграть самолёты [Prev.Owner.GetAdjective] и одним выстрелом заставил [Prev.GetCallsign] рухнуть с небес [From.GetMissionRegion].\n\n[Prev.GetFullName] был известным пилотом, на совести которого было множество [From.Owner.GetAdjective] жизней. Эта большая победа и она показывает, что когда мы объединяемся вокруг великих героев, они совершают великие дела."
 ace_killed_other_ace.1.d_major:0 "Наша последняя миссия в [From.GetMissionRegion] стала грандиозным успехом для [From.Owner.GetAdjective] ВВС в более чем одном аспекте. Поступили отчёты о героических действиях [From.GetFullName], сумевшего перехитрить [Prev.Owner.GetAdjective] пилота, [Prev.GetName] [Prev.GetSurname], известного под позывным [Prev.GetCallsign]. [From.GetCallsign] использовал [From.GetHerselfHimself] как наживку и заманил [Prev.GetCallsign] в ловушку, где пилоты [From.Owner.GetAdjective] смогли атаковать эскадрилью [Prev.GetCallsign]. [From.GetCallsign] умело маневрировал, избегая [Prev.Owner.GetAdjective] самолётов, и одной очередью заставил [Prev.GetCallsign] рухнуть с неба [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным пилотом, на совести [Prev.GetHerHis] множество жизней [From.Owner.GetAdjective] воинов. Это великая победа, которая показывает, что когда мы объединяемся вокруг великих героев, они совершают великие подвиги."
 ace_killed_other_ace.1.a:0 "Это победа, которую запомнят все [From.Owner.GetName]!"
 aces_killed_each_other.1.t:0 "[From.GetFullName] сбит"
 aces_killed_each_other.1.d:0 "Во время недавней миссии наш знаменитый пилот-ас [From.GetAceType] [From.GetFullname] вступил в продолжительный бой со столь же прославленным асом [Prev.GetFullName]. Испытывая нехватку боеприпасов и не имея возможности уклониться от атаки, [From.GetCallsign] выполнил рискованный манёвр уклонения от огня вражеских самолётов и предпринял таран, нацеленный на [Prev.GetCallsign].\nИ самолёт [From.GetCallsign], и самолёт [Prev.GetCallsign] рухнули над [From.GetMissionRegion].\n\nНесмотря на то, что мы избавились от назойливого [Prev.Owner.GetAdjective] аса, имя [Prev.GetCallsign] навсегда войдёт в историю, а мы потеряли выдающегося деятеля и источник вдохновения для всех [From.Owner.GetAdjective]."
 aces_killed_each_other.1.d_major:0 "Во время недавней миссии наш выдающийся ас [From.GetAceType] [From.GetFullname] оказался в затяжном поединке со страшным лётчиком-асом [Prev.GetFullName]. С малым количеством боеприпасов и без возможности уйти от боя, [From.GetCallsign] направил [From.GetHerHis] [From.GetWingShort] сквозь огонь со стороны [Prev.Owner.GetAdjective] самолетов и протаранил [Prev.GetCallsign].\nОба самолета - [From.GetCallsign]s [From.GetWingShort] и [Prev.GetCallsign]s [Prev.GetWingShort] были замечены падающими над [From.GetMissionRegion].\n\nХоть небольшим утешением и является то, что [Prev.Owner.GetAdjective] угроза, [Prev.GetCallsign], больше не будет нам докучать, мы потеряли ценного общественного деятеля и вдохновителя для всех [From.Owner.GetAdjective]."
 aces_killed_each_other.1.a:0 "Но это, тем не менее, огромная потеря для нас"
 election.1.t:0 "ОБЩИЕ ВЫБОРЫ"
 election.1.d:1 ""
 election.1.a:1 ""
 election.2.t:0 "Выборы: общественность выступает против перевооружения"
 election.2.d:0 "На предстоящих выборах поддержка [Root.GetRulingParty] по-прежнему высока, люди уверены в руководстве [Root.GetLeader]. Однако стремление партии усилить внимание [Root.GetName] к военным вопросам было не совсем популярным среди общественности, поскольку значительная часть граждан считает это неразумным милитаризмом. Война еще не достигла нашей границы, и немногие хотели бы видеть агрессивные действия [Root.GetName]. Сотрудничая с другими крупными партиями, которые разделяют наши заботы о безопасности нации, мы по-прежнему сможем править после выборов, хотя и с уменьшенной поддержкой."
 election.2.a:0 "Народ должен быть услышан."
 election.2.b:0 "Защита нашего суверенитета стоит на первом месте."
 election.3.t:0 "Выборы: Общественные требования по перевооружению"
 election.3.d:0 "Продолжающаяся война, приближающаяся к нашим границам, нависла над предстоящими выборами. Многие избиратели обеспокоены тем, что [Root.GetName] не готов к тому, чтобы быть втянутым в этот конфликт или то, что может из него возникнуть. Они требуют, чтобы мы усилили наши меры предосторожности и убедились, что наша нация готова к войне. Хотя большинство по-прежнему поддерживают [Root.GetRulingParty], мы можем потерять их в пользу более радикальных элементов, если не развеем их опасения."
 election.3.a:0 "Народ имеет право чувствовать себя в безопасности."
 election.3.b:0 "Многие по-прежнему выступают за дипломатические решения."
 election.4.t:0 "Выборы: фашисты в правительстве?"
 election.4.d:0 "В [Root.GetName] усилились националистические настроения, появилось несколько партий, пропагандирующих фашистские идеи: государство, осуществляющее свою власть силой. Одна из них особенно прославилась на текущих выборах, что привело к обсуждениям в [Root.GetRulingParty] о том, стоит ли нам попытаться сотрудничать с ними при формировании нашего правительства. Несмотря на то, что они открыто отвергают демократические идеалы, которые являются основой нашего государства, тот факт, что они решили сами участвовать в выборах, в какой-то мере подтверждает наши взгляды, а признание их поддержки со стороны общественности может удержать их от насильственных действий."
 election.4.a:0 "Лучше они, чем коммунисты!"
 election.4.b:0 "Предпочтительнее широкая коалиция демократических партий."
 election.5.t:0 "Выборы: коммунисты в правительстве?"
 election.5.d:0 "Коммунистическое движение в [Root.GetName], подпитываемое широким недовольством рабочего класса и радикальными течениями среди академиков, выросло настолько, что привело к образованию нескольких партий. После того, как одна из них получила значительную поддержку на нынешних выборах, политики [Root.GetRulingParty] начали обсуждать, стоит ли заручиться их поддержкой при формировании правительства. Хотя они и считают наши демократические институты не более чем буржуазной тиранией, они, похоже, стремятся осуществить желаемые ими изменения через сотрудничество с правительством, а не путем его свержения."
 election.5.a:0 "Реформируем, не революционируем!"
 election.5.b:0 "Предпочтительна широкая коалиция демократических партий."
 election.6.t:0 "Выборы: Демократические партии в меньшинстве"
 election.6.d:0 "Политика в [Root.GetName] становится все более радикальной. Там, где когда-то была широкая поддержка партий, которые выступали за демократические идеалы и представительные институты [Root.GetName], в ходе этих выборов больше избирателей обратились к политическим крайностям. Партии в политической середине, даже если они решат отложить свои разногласия в сторону, больше не составляют большинства. Чтобы избежать слабого правительства меньшинства, у нас нет выбора, кроме как сотрудничать либо с фашистами, либо с коммунистами."
 election.6.a:0 "Мы будем работать с фашистами, чтобы усилить [Root.GetName]."
 election.6.b:0 "Объединившись с коммунистами, мы можем облегчить социальные изменения."
 election.6.c:0 "Правительство меньшинства, хотя и слабое, предпочтительнее."
 election.7.t:0 "Фашисты влияют на внешнюю политику"
 election.7.d:1 "Включение фашистов в нашу политическую коалицию оказало влияние на нашу внешнюю политику. Несмотря на их яростный национализм, у них есть сочувствующие за границей, которые одобряют влияние, которое им было оказано в [Root.GetName]. Тоталитарные правительства с аналогичными идеологическими взглядами видят в нас потенциальных союзников. Поддержание связей с этими нациями, несмотря на то, как [Root.GetRulingParty] презирает их идеалы, может быть необходимо для сохранения поддержки фашистов, поддерживающих наше правительство."
 election.7.a:0 "Мы можем использовать союзников против более серьезных угроз."
 election.7.b:0 "С такими друзьями враги нам не нужны."
 election.8.t:0 "Коммунисты влияют на внешнюю политику"
 election.8.d:0 "Коммунисты часто считают себя частью международной революции, а наш выбор принять их в качестве партнеров в правительстве привлек внимание многих из их международных союзников. Представители коммунистических партий поддерживают тесные связи со странами, отказавшимися от нашей формы правления в пользу диктатуры пролетариата. Эти связи нам, возможно, придется признать во [Root.GetAdjective] внешней политике, если мы хотим сохранить их поддержку."
 election.8.a:0 "Мы должны поддерживать наши общие цели."
 election.8.b:0 "По этому пути лежит роспуск самой [Root.GetName]."
 election.11.t:0 "Выборы: большинство фашистов"
 election.11.d:0 "Эти выборы были разрушительны для самого учреждения, которое они представляют. Большинство [Root.GetAdjective] населения проголосовали за фашистскую партию, которая стремится отменить выборы и установить автократического правителя. Хотя многие думают взяться за оружие, чтобы бороться с этим нарушением демократических идеалов, которые первоначально дали им этот мандат, другие полагают, что применение насилия только укрепит эти идеалы."
 election.11.a:0 "Это черный день для [Root.GetName], но люди высказались."
 election.11.b:0 "Мы не откажемся от нашей свободы без боя!"
 election.12.t:0 "Выборы: большинство у коммунистов"
 election.12.d:0 "На прошедших выборах победу одержали коммунистические партии. Реакция отставной администрации неоднозначная. Новые власти, заявляя, что представляют весь народ, считают многие из дорогих нам демократических институтов попытками манипуляции и угнетения рабочего класса, что приводит к дискуссиям о том, что на самом деле представляет собой \"власть народа\". В некоторых государствах революция началась в потоках крови. В [Root.GetName] обошлось без этого, но еще неизвестно, чем все закончится."
 election.12.a:0 "Это тревожит, но они действительно представляют большинство."
 election.12.b:0 "Надо их остановить, пока они не уничтожили все проявления инакомыслия!"
 election.13.t:0 "Выборы: Магнат выступает за фашизм"
 election.13.d:0 "Один влиятельный промышленник, стоящий за одной из компаний, которую мы выбрали для сотрудничества в промышленном производстве, в последнее время сделал ряд заявлений о политике, которые показались членам администрации тревожными. Он открыто выступал за авторитарное правительство и хвалил иностранные администрации, идентифицирующие себя как фашистские, намекая, что [Root.GetName] выиграет от подобного правления. Осуждение магната и его идеалов может испортить наши отношения с компанией, но, если не контролировать его, он получит площадку для распространения пропаганды, которая разрушает все, за что выступает [Root.GetRulingParty]."
 election.13.a:0 "Пусть говорит что хочет, нам не обязательно это поддерживать."
 election.13.b:0 "Мы не можем положиться на фашистов в развитии и защите [Root.GetName]."
 election.14.t:0 "Выборы: исключение во время войны"
 election.14.d:0 "[Root.GetName] находится в состоянии войны. Обычно в это время проводятся выборы, но во время важного конфликта многие утверждают, что не могут позволить себе тратить время на политическую кампанию или смену руководства, если такое произойдет. Между тем, другие утверждают, что объявление продолжающейся войны веской причиной для отмены выборов является первым шагом к подрыву демократии [Root.GetAdjective]. В конце концов, позволить военным вопросам взять верх над влиянием народа может быть скользким путем."
 election.14.a:0 "Выборы будут проводиться как обычно."
 election.14.b:0 "Мы сможем решить эти вопросы, когда эта война закончится."
 election.15.t:0 "Выборы: правительственные оспариваемые"
 election.15.d:0 "С приближением выборов люди начинают сомневаться в способности нынешней администрации продолжить текущую войну. [Root.GetName] сильно пострадал, и общественное мнение повернулось против тех, кто, похоже, ведет нашу нацию к поражению. Хотя наши люди полны решимости довести войну до конца, они предпочли бы, чтобы ее закончила другая власть."
 election.15.a:0 "Этот кризис доверия крайне печален."
 election.15.b:0 "Пусть политический ландшафт изменится, чтобы люди были едины."
 election.16.t:0 "[Root.GetLeader] пользуется общественной поддержкой"
 election.16.d:0 "С текущими выборами, оппозиция, в той мере, в какой она существует, критикует все более авторитарное правление [Root.GetRulingParty]. Они задаются вопросом, есть ли у избирателей какая-либо власть вообще, или это все только для вида.\n\nОднако поддержка [Root.GetLeader] по-прежнему высока, и хотя международное сообщество сомневается в обстоятельствах выборов, на национальном уровне они не оспаривались. Похоже, что даже если [Root.GetName] больше не управляется народом, народ поддерживает своего правителя... по крайней мере те, кто попал в бюллетени."
 election.16.a:0 "Один народ, один лидер."
 election.17.t:0 "Результаты выборов под вопросом"
 election.17.d:0 "Хотя режим [Root.GetLeader] привел большинство своих противников к молчанию силой, некоторые из них все же высказались о недавних выборах, обвиняя [Root.GetRulingParty] в подтасовке результатов и игнорировании явных усилий по избранию парламента, выступающего против их политики.\n\nПравительство отметает эти возражения как попытку разделить народ против него самого. Однако остается тот факт, что у большинства людей, похоже, есть оговорки в отношении их правления, а оппозиция, хотя сейчас и заглушена, доказала свою правоту."
 election.17.a:0 "Раскольники!"
 political.1.t:0 "Подъем коммунизма"
 political.1.d:0 "В то время как трудящиеся всего мира восстают против своих угнетателей, те, кто утверждает, что достиг классового сознания в [Root.GetName], сидят сложа руки и ждут, когда перемены произойдут в рамках политической системы, настолько коррумпированной, что только революция может нас от неё спасти!\n\nТак говорят новые голоса в [Root.GetAdjective] коммунистическом движении. Ссылаясь на правление [Root.GetRulingParty] как на диктатуру буржуазии, они начали призывать к тому, чтобы отстранить его от власти любыми необходимыми средствами. Остаётся только гадать, откуда эти средства появятся – изнутри или извне."
 political.1.a:0 "В правительстве могут быть те, кто поддерживает такие идеи."
 political.1.a.tt:0 "Увеличивает вероятность внутренней поддержки коммунистического переворота."
 political.1.b:0 "Движение за народ должно искать поддержки у народа."
 political.1.b.tt:0 "Увеличивает вероятность народной поддержки коммунистического восстания."
 political.2.t:0 "Марксистские симпатии в правительстве"
 political.2.d:0 "Хотя линия партии [Root.GetRulingParty] состоит в решительном противодействии революционному социализму, а также в бдительном наблюдении за радикальными левыми элементами страны, некоторые представители правительства более открыты для такой возможности. Они, по крайней мере, видят, что есть основания для решения проблем людей, которые ждут от коммунистов их решения, не рискуя полномасштабной гражданской войной.\n\nХотя те, кто хранят верность [Root.GetLeader], могут воспринимать их как предателей, эти голоса инакомыслящих могут гарантировать относительно бескровный переход, если революция все-таки произойдет."
 political.2.a:0 "Мы тоже будем за ними внимательно следить, по многим причинам."
 political.2.a.tt:0 "Если будет достаточная общественная поддержка, можно провести государственный переворот."
 political.3.t:0 "Коммунисты устраивают переворот"
 political.3.d:0 "В то время как популистское движение за коммунистическую революцию было громким и устрашающим, определенная часть политического движения во многом молчала и ждала. Ожидание закончилось. Сегодня, когда руководство [Root.GetRulingParty] и армия готовились к восстанию в общенациональном масштабе, ряд чиновников из правительства [Root.GetAdjective] быстро поместили [Root.GetLeader] под домашний арест и вступили в переговоры с повстанцами.\n\nСохраняя видимость охраны порядка, переговоры фактически обеспечили позиции в новом социалистическом государстве для тех, кто согласился сотрудничать. Переворот был завершен до того, как кто-либо успел предпринять шаги для его остановки, и те, кто сделал бы это, теперь находятся в заключении, изгнаны или казнены новым режимом."
 political.3.a:0 "Течение истории смоет прошлое."
 political.4.t:0 "Классовые конфликты разделяют [Root.GetName]"
 political.4.d:0 "Коммунистическое революционное движение, некогда маргинальное течение среди радикальных академиков в теории и смутьянов на практике, получило повышенную поддержку среди [Root.GetAdjective] рабочего класса. То, что все больше людей предпочитают идентифицировать себя с „классом“, говорит о распространении марксистских идей за пределы круга тех, кто активно стремится к свержению правительства.\n\nЧлены [Root.GetRulingParty] оплакивают эту тенденцию, тоскуя по временам, когда люди идентифицировали себя прежде всего как „[Root.GetAdjective]“. Их опасения не беспочвенны. Можно утверждать, что революция уже происходит на нескольких уровнях общества, и остановить ее может быть слишком поздно."
 political.4.a:0 "Пусть народ называет себя как угодно."
 political.5.t:0 "Солдаты дезертируют к коммунистическим партизанам"
 political.5.d:0 ""Капиталисты и националисты хотят, чтобы вы проливали свою кровь за них на фронте, сталкивая братьев друг против друга из-за споров, которые не касаются рабочего человека! Вместо того чтобы брать в руки оружие против рабочих, борющихся за рубежом, поднимите его против угнетателей и свергните тиранов!""\n\nАрмия, обычно оплот патриотизма и лояльности, оказалась невосприимчивой к коммунистической пропаганде, быстро распространяющейся в [Root.GetName]. Солдаты дезертируют, отказываясь сражаться за свою страну, а иногда даже присоединяются к партизанским движениям, которые якобы готовятся к революции.
 political.5.a:0 "Возможно, они просто борются за что-то [Root.GetName]."
 political.6.t:0 "Революция [GetMonth]"
 political.6.d:0 "Идея о том, что коммунистическое движение представляет интересы народа, безусловно, набрало силу в [Root.GetName], где поддержка коммунистической партии среди населения резко возросла в последние месяцы. Но те, кто призывает к революции, - это уже не разрозненные партизаны и недовольные профсоюзы. Группа, стоящая за призывом к восстанию, достаточно организована, чтобы сформировать правительство в случае успеха.\n\nТем не менее, если революция начнется сейчас, вряд ли удастся ее провести без погружения [Root.GetName] в гражданскую войну. Рискнут ли революционеры разорвать нацию пополам, чтобы удовлетворить свою нетерпеливость, или дождутся лучшей возможности в будущем?"
 political.6.a:0 "Те, кто хочет творить историю, должны действовать сегодня!"
 political.6.b:0 "Революция неизбежна. Неизбежное может и подождать."
 political.7.t:0 "Подъем фашизма"
 political.7.d:1 "\"Народ [Root.GetAdjective] уже слишком долго терпит бездарное правление [Root.GetRulingParty]! Они говорят, что представляют народ, а сами даже не могут порядок на улицах поддерживать! Чтобы эта страна начала развиваться, этих людей надо отстранить от власти!\n\nФашистские агитаторы в [Root.GetName] не скрывают, что думают о нашем нынешнем правлении и политической системе. Такие речи откликаются в душах людей, особенно в более консервативных слоях армии."
 political.7.a:0 "Не исключено, что среди высшего руководства тоже есть тайные сочувствующие."
 political.7.a.tt:0 "Увеличивает вероятность внутренней поддержки фашистского переворота."
 political.7.b:0 "Молодое поколение подхватит знамя."
 political.7.b.tt:0 "Увеличивает вероятность поддержки фашистского переворота со стороны народа."
 political.8.t:0 "Фашистские симпатии в армии"
 political.8.d:1 "Несколько высокопоставленных членов военного ведомства [Root.GetAdjective] выразили свою поддержку фашистскому движению в [Root.GetName]. Некоторые из них сделали это открыто, другие лишь намекают. Они полагают, что партия [Root.GetRulingParty] забыла о важности силы оружия для сплоченности государства. Их все больше раздражает отношение правительства к армии, которую власти считают инструментом, а не одним из важнейших институтов нации. Некоторые дошли до того, что начали говорить о необходимости новой власти, которая сумеет вести [Root.GetName] через следующие пятьдесят лет.\n\nПолитики не являются основной силой в этом движении, но некоторые из его сторонников занимают высокие должности в министерстве обороны. Если эти тенденции будут развиваться, они могут заручиться достаточной политической поддержкой для проведения переворота."
 political.8.a:0 "Государственный дух выше правительства."
 political.9.t:0 "Фашистский переворот"
 political.9.d:0 "Одни скажут, что они это предвидели. Как те, кто предостерегал от опасности фашизма, так и те, кто превозносил его как спасителя [Root.GetName], сегодня увидели, что их пророчества сбылись, когда военные в [Root.Capital.GetName] свергли правительство во главе с [Root.GetRulingParty] и захватили власть. [Root.GetLeader] пропал без вести, по слухам, он ушел в изгнание, а переворот первоначально не встретил большого сопротивления.\n\nНовое [Root.GetAdjective] руководство также не намерено допустить роста сопротивления. Введено военное положение, и с теми изменениями, которые сейчас происходят, маловероятно, что то, что будет после, будет сильно отличаться."
 political.9.a:0 "Необходим сильный лидер, чтобы защитить народ от самого себя."
 political.10.t:0 "Гражданская война ради фашизма"
 political.10.d:0 "Хотя попытки фашистского движения возродить националистические настроения увенчались некоторым успехом, сопротивление этим идеям остается высоким. Генералы, планирующие свергнуть нынешнее правительство, разочарованы отсутствием доверия к [Root.GetFascistParty], которое, по-видимому, испытывает само [Root.GetAdjective] население.\n\nОни по-прежнему уверены, что народ в конце концов устанет от [Root.GetLeader], но у них разногласия относительно того, какие действия следует предпринять. Некоторые призывают немедленно осуществить переворот, прежде чем враги [Root.GetName] предпримут какие-либо действия. Однако если сделать это при ограниченной поддержке населения, то это ввергнет страну в гражданскую войну."
 political.10.a:0 "Воля к власти ничего не значит, если колебаться при ее захвате."
 political.10.b:0 "Сперва нужно сплотить народ, а потом уже им управлять."
 political.11.t:0 "Формируются фашистские штурмовые дивизии"
 political.11.d:0 "Политика и военное дело всегда были тесно переплетены в фашизме. Наряду с растущим политическим движением фашистские партии начали формировать военизированные организации для защиты от внутренних и внешних угроз, к которым относятся их политические противники. Хотя многих беспокоит это развитие, волна воинственных настроений привела к увеличению числа добровольцев, присоединяющихся к нашим вооруженным силам.\n\nПолитические лидеры движения отмечают, что их противники не зря боятся. Наличие армии, на всех уровнях пронизанной столь откровенно политическими элементами, враги [Root.GetName] и враги фашизма начинают очень походить друг на друга."
 political.11.a:0 "Боятся только предатели страны."
 political.12.t:0 "Угроза коммунизма"
 political.12.d:0 "[Root.GetLeader] пытается убедить вас в том, что [Root.GetName] в безопасности и единстве. Неудивительно, что такая ложь отравила умы наших людей, когда змея свернулась рядом! Посмотрите через нашу границу и увидите соотечественников, восставших друг против друга во имя коммунизма, провозглашающих конец наций. Сколько времени пройдет, прежде чем они объявят нашу нацию мертвой? Защитит ли нас [Root.GetRulingParty] от этой угрозы?\n\nРост фашистского движения в [Root.GetName] был поддержан близостью коммунистической революции. Многие умеренные, которые обычно могли бы отмахнуться от фашизма как от очередного ошибочного идеологического эксперимента, находят это очень реальной проблемой и для них самих. Если выбирать между коммунизмом наших соседей и фашистским режимом, они, конечно, предпочли бы последнее. Они могут даже быть готовы активно поддерживать его."
 political.12.a:0 "Мы будем авангардом против красной угрозы!"
 political.13.t:0 "Движение к демократии"
 political.13.d:0 "Если мы лишаем голоса народ, как кто-либо из нас может заявлять, что представляет [Root.GetName] сами? Если мы боимся разногласий, если боимся общественного осуждения или свержения в ходе народного голосования, чего мы на самом деле боимся — так это ненависти и презрения к нам со стороны наших граждан. Действительно ли [Root.GetRulingParty] так не уверено в собственных принципах?"
 political.13.a:0 "Для начала мы можем обсудить это внутри партии."
 political.13.a.tt:0 "Увеличивает шанс поддержки проведения выборов внутри страны."
 political.13.b:0 "Зная, что мы правы, мы можем позволить себе разрешить нашим врагам говорить более открыто."
 political.13.b.tt:0 "Увеличивает шанс, что люди выскажутся в поддержку демократии и создадут оппозицию."
 political.14.t:0 "Обсуждения демократии в [Root.GetRulingParty]"
 political.14.d:0 "Удивительно, но призывы к проведению большего количества референдумов и менее репрессивных мер против оппонентов режима получили некоторую поддержку во внутренних партийных дискуссиях. В то время как руководство [Root.GetRulingParty] остаётся скептически настроенным, несколько влиятельных членов поддержали эти перемены.\n\nВозможно, они уверены, что на практике мало что изменится, или же они втайне предают дело партии, как многие их противники и заявляют. Так или иначе, если общественность потребует таких изменений, некоторые из лидеров [Root.GetName] готовы пойти на компромисс."
 political.14.a:0 "Выбор не всегда стоит между свободой и смертью."
 political.14.a.tt:0 "Правительство может проводить выборы, если за данную политику выступает большинство."
 political.14.c:0 "Нам нужен референдум."
 political.14.e:0 "Это всё пройдет."
 impending_civil_war_tt:0 "§RЕсли идеологическая поддержка продолжит расти, это может привести к полномасштабной гражданской войне!§!\n"
 political.15.t:0 "Формируется демократическая оппозиция"
 political.15.d:0 "Снятие ограничений на распространение анти-[Root.GetRulingParty] пропаганды, как и ожидалось, привело к увеличению общественных выражений несогласия. Организованные демонстрации и распространение листовок пока в основном наблюдаются в академических учреждениях и некоторых неблагополучных районах [Root.GetName], но нет сомнений в том, что это движение распространяется.\n\nРуководство страны разделилось по этому вопросу. [Root.GetLeader], который держит железной хваткой руководство партии, не горит желанием диверсифицировать общественные дебаты. Однако первые шаги уже сделаны, и пути назад может не быть."
 political.15.a:0 "Движение, по-видимому, развивается естественным образом в отсутствие репрессий."
 political.16.t:0 "Общий призыв к выборам"
 political.16.d:0 "Движение протеста, которое раньше было ограничено небольшим количеством районов, теперь стало широко распространенным явлением. Пока люди собираются на улицах, [Root.GetRulingParty] находится на перепутье. Если мы продолжим распространение этой пропаганды, референдумы, предлагаемые как внутри партии, так и оппозицией, могут показать, что у нас нет поддержки со стороны населения. Единство, к которому мы стремились, уступает место множеству мнений, объединенных против нас."
 political.16.a:0 "Даже если реформы происходят, мы должны показать свою силу, подавив это неповиновение."
 political.16.b:0 "Пусть люди будут услышаны."
 political.17.t:0 "Общенародные выборы в [Root.GetName]"
 political.17.d:0 "В связи с растущим признанием свободы слова и собраний в [Root.GetName] фракция [Root.GetRulingParty], требующая проведения выборов, перешла от тайного заговора к поддержке публичных реформаторов. Несмотря на протесты [Root.GetLeader], в последние месяцы страна постепенно, но неуклонно продвигается к демократии, и теперь выборы кажутся естественным следующим шагом.\n\nОднако далеко не все граждане [Root.GetAdjective] поддерживают демократические реформы. Внутри партии все еще идут дебаты о том, стоит ли откладывать проведение выборов, пока мы не сможем обеспечить стабильное развитие."
 political.17.a:0 "Сторонники [Root.GetRulingParty] поддержат это решение сейчас."
 political.17.b:0 "Прежде чем можно будет провести выборы, реформы должны получить более широкую поддержку."
 political.18.t:0 "Фашисты требуют референдума"
 political.18.d:0 "Быстро растущее [Root.GetAdjective] фашистское движение никогда не заявляло, что ему необходима поддержка большинства перед захватом власти, рассчитывая на объединение нации под своим руководством после установления своего режима. Однако, похоже, что их общественная поддержка быстро растет. Многие фашисты теперь называют [Root.GetLeader] лицемером, заявляющим, что представляет волю народа, в то время как на самом деле глух к народным массам.\n\nПризыв к референдуму до сих пор отклоняется как типичные попытки подорвать систему со стороны членов [Root.GetRulingParty], но по крайней мере это политическая мера. Если мы не примем меры сейчас, фашисты могут избрать путь насилия как лучший путь к власти."
 political.18.a:0 "Подавите это ненавистное движение!"
 political.18.b:0 "Не обращайте на них внимания."
 political.18.c:0 "Если народ этого захочет, мы проведем референдум."
 political.19.t:0 "Коммунисты требуют референдум"
 political.19.d:0 "Марксистские идеи пустили корни в [Root.GetName] давно, но в последнее время получили гораздо более широкую поддержку. Движение вышло за рамки политической теории и проникло в политическую практику, поскольку недовольные рабочие и даже некоторые известные знаменитости выразили свою поддержку. Коммунисты называют это классовым сознанием. [Root.GetRulingParty] называют это быстрым путём к беспорядкам и измене.\n\nВыражая слабое доверие [Root.GetLeader] и его готовности реализовать требуемые ими реформы, наиболее ярые коммунисты призвали к немедленному референдуму с целью отстранения действующего правительства. Хотя мы, возможно, сможем переломить ход этого массового движения, неудача, несомненно, приведёт к более популярному методу устранения у коммунистов: революции."
 political.19.a:0 "Анти-[Root.GetAdjective] деятельность должна быть прекращена!"
 political.19.b:0 "Игнорируйте их, они только вызывают проблемы."
 political.19.c:0 "Референдум предпочтительнее кровавого восстания."
 political.20.t:0 "Демократы требуют референдума"
 political.20.d:0 "Неудивительно, что идея о том, что люди управляют своей страной, может легко получить широкую популярность среди народа. [Root.GetRulingParty], конечно же, рассматривает идеи демократии, представленные этими движениями - свобода слова, свободные выборы, независимая пресса - как простую популистскую риторику, направленную на то, чтобы ослабить правительство [Root.GetLeader].\n\nОднако нельзя отрицать, что эти идеи овладели умами [Root.GetAdjective] населения. Как и в истинной демократии, они призывают провести общественный референдум о замене нынешнего режима. Хотя в настоящее время их легко игнорировать, эти идеи со временем приобретают большую стойкость. Что с нами случится, если мы сделаем мирную революцию невозможной?"
 political.20.a:0 "Окружить их."
 political.20.b:0 "Продолжать действовать как обычно."
 political.20.c:0 "Если мы примем референдум, возможно, сможем сохранить свое наследие."
 political.21.t:0 "Фашисты маршируют на [Root.Capital.GetName]"
 political.21.d:0 "Будучи лишены референдума, практически символической попытки законного захвата власти, фашисты использовали значительную общественную поддержку и связи в [Root.GetAdjective] армии, чтобы попытаться совершить переворот. Правительство [Root.GetRulingParty] отказалось от их условий и заявило, что будет сражаться до конца, чтобы сохранить [Root.GetName] в том виде, в котором мы его знаем."
 political.21.a:0 "Мы остановим их любой ценой!"
 political.21.b:0 "Фашисты несут истинный дух [Root.GetName]!"
 political.22.t:0 "Коммунисты поднимаются"
 political.22.d:0 "После того как их просьба о референдуме была отклонена, немногие реформаторы коммунистического движения в [Root.GetName] быстро потеряли влияние радикальным элементам. Из-за отказа [Root.GetRulingParty] признать общественную поддержку предлагаемых реформ, романтический взгляд на революцию постепенно становился более распространенным, а лидерами движения становились те, кто мог легче всего начать бунт. Эти бунты теперь переросли в полномасштабную гражданскую войну, в которой на карту поставлено будущее нации."
 political.22.a:0 "Мы не позволим им разрушить нашу страну!"
 political.22.b:0 "Огонь революции должен быть потушен кровью угнетателей!"
 political.23.t:0 "Весна [Root.GetAdjective]"
 political.23.d:0 "После того, как их попытка провести всенародный референдум для создания демократии была отклонена, люди, стоявшие за этим предложением, отвергли режим [Root.GetLeader] как неисправимый. Широкая коалиция повстанческих группировок, объединенных общей целью создания в [Root.GetName] более представительных политических систем, взялись за оружие и заявили, что не успокоятся, пока [Root.GetRulingParty] не будет свергнут."
 political.23.a:0 "Избавь нас от этого правления толпы!"
 political.23.b:0 "Наконец-то [Root.GetName] свободен!"
 political.24.t:0 "Фашисты высмеяны"
 political.24.d:0 "Кажется, у [Root.GetAdjective] народа прошла слепая влюбленность в националистическую гордость и попытки возродить славу прошлого. Это суровое пробуждение для его ярых сторонников, чья форма, милитаристская поза и чрезмерно пафосные речи сейчас чаще всего являются предметом насмешек, а не сочувствия.\n\nКогда-то считавшийся угрозой власти [Root.GetRulingParty], фашизм [Root.GetAdjective] теперь все чаще рассматривается как абсурдная, экстремистская позиция и нападение на самые фундаментальные ценности нашей нации, той самой нации, которую они, как утверждают, так высоко чтут. Само это слово, кажется, больше подходит как оскорбление, чем как политическое обозначение."
 political.24.a:0 "Кучка клоунов."
 political.25.t:0 "Мода на коммунизм прошла"
 political.25.d:0 "Многие коммунисты предсказывали, что [Root.GetName] станет следующей нацией, которая падет под натиском так называемой мировой революции, но после нескольких месяцев забастовок и демонстраций красных флагов на улицах движение, кажется, заглохло. У рабочего класса, который якобы должен был стать движущей силой революции, теперь куда больше забот, чем свержение [Root.GetLeader], и он определенно не впечатлён тем, как эти революции прошли в других странах. Тем временем интеллектуалы, которые страстно призывали к тому, чтобы перерезать горло угнетателям, оказались на удивление неохотно приступать к любым действиям, которые могли бы нарушить их комфортный образ жизни.\n\nРазговоры о революции, вероятно, будут продолжаться, за кружкой дешевого пива или бокалом дорогого вина, но вряд ли это будет чем-то большим, чем просто разговорами."
 political.25.a:0 "Что за лицемерие."
 political.26.t:0 "Демократическое движение замолчало"
 political.26.d:0 "После нескольких месяцев громких возражений против режима [Root.GetLeader], в которых требовались всеобщие выборы и более либеральные законы о свободе собраний и слова, движение, кажется, развалилось. Сейчас люди больше обеспокоены стабильностью [Root.GetName] в случае проведения таких реформ, а борцы за демократию рассматриваются скорее как смутьяны, чем как что-либо другое.\n\nЧто еще более загадочно, многие из ведущих фигур движения, похоже, пропали без вести или внезапно прекратили свою работу. Возможно, некоторые из них решили уйти в изгнание, увидев провал своих усилий. Вне зависимости от этого, правительство [Root.GetRulingParty] отрицает всякие знания и причастность к этому."
 political.26.a:0 "Что за свора неудачников."
 political.27.t:0 "[Root.GetLeader] отказывается от нейтральной внешней политики"
 political.27.d_fascism:0 "После недавнего прихода к власти [Root.GetRulingParty], [Root.GetLeader] объявил, что [Root.GetName] больше не будет придерживаться нейтральной внешней политики.\n«Мир стал запутанным и сложным. В одиночку мы больше не в безопасности. Мы должны выступить против наших врагов вместе с нашими фашистскими партнерами. Если мы не выберем сторону, мы погибнем в одиночку»."
 political.27.d_communism:0 "После недавнего прихода к власти [Root.GetRulingParty], [Root.GetLeader] объявил о том, что [Root.GetName] больше не будет придерживаться политики нейтралитета. \"Мир стал запутанным и сложным. Эта страна всегда придерживалась своих принципов и была готова защищать их. Теперь нам больше небезопасно в одиночку. Нейтралитет больше не является тем безопасным убежищем, которым он был раньше, а те, кто ищут власти в этом мире, не уважают его. Мы должны встать на сторону наших братьев-коммунистов против сил, которые хотят угнетать нас. Против буржуазного большинства, которое хочет только держать нас внизу. Если мы не займём позицию, мы погибнем в одиночестве\".\"
 political.27.a:0 "За будущее [Root.GetName]"
 political.28.t:0 "[Root.GetNameDefCap] объединилась"
 political.28.d:1 "Ужасная гражданская война, которая опустошила нашу землю, подходит к концу, и мы, наконец, достигли политического соглашения. Теперь мы смотрим в глаза нашим соотечественникам [Root.GetAdjective] и вместе мы восстановим нашу великую нацию. Враги, которые пытались извлечь выгоду из наших внутренних распрей, теперь должны столкнуться с объединенным [Root.GetAdjective] государством. Новый [Root.GetRulingIdeology] [Root.GetName] больше никогда не будет разделен!"
 political.28.a:0 "Наконец-то объединились!"
 political.29.t:0 "Конец гражданской войны"
 political.29.d:0 "Гражданская война, разделившая нашу нацию, окончена, и наша цель достигнута. Однако мы не можем позволить сторонникам наших противников распространять вредоносную пропаганду среди населения. Для дальнейшего укрепления нашего молодого правительства, единства и готовности к отражению внешних угроз нам необходима твёрдая рука."
 political.29.a:0 "Так и будет."
 political.31.t:0 "О [ROOT.GetAdjective] объединении"
 political.31.desc:0 "Война разделила нашу страну. Теперь, когда мир восстановлен, пора начать восстановление. Среди [ROOT.GetRulingIdeology] [ROOT.GetAdjective] ведётся активная кампания за объединение."
 political.31.a:0 "Нам следует поддержать это."
 political.31.b:0 "Не будем вмешиваться. Оставим прошлое позади."
 political.32.t:0 "[ROOT.GetAdjective] объединение"
 political.32.desc:0 "Пришло время воссоединить разделённые [ROOT.GetRulingIdeology] [ROOT.GetAdjective], которые появились после войны. [ROOT.GetNameDefCap] станет единым целым."
 political.32.a:0 "Воссоединённые [ROOT.GetName]"
 political.33.t:0 "[ROOT.GetCountryAppropriateFilmProduction]"
 political.33.desc:0 "Стремясь улучшить общественное мнение об усилиях на войне, наши министры пропаганды отобрали исключительную кинопродукцию \"[ROOT.GetCountryAppropriateFilmProduction]\" - возвышенный зрительский опыт с сильным патриотическим чувством - для показа по всей стране.\n\nМы надеемся, что это положит начало долгой и богатой традиции нашей патриотической киноиндустрии - пока результаты были отличными."
 political.33.a:0 "Шедевр."
 britain.1.t:0 "Миссия Тизерда"
 britain.1.d:0 "Британское правительство отправило нам научную делегацию во главе с Генри Тизердом с интересным предложением. Британцы готовы объединить свои исследовательские усилия с нашими в нескольких ключевых областях, поскольку у них нет достаточных промышленных мощностей, чтобы производить свои изобретения в достаточно большом количестве."
 britain.1.a:0 "Отличное предложение!"
 britain.1.b:0 "Нет, британцы сами по себе."
 britain.1.c:0 "Мы должны стремиться к более долгосрочному сотрудничеству."
 britain.2.t:0 "Тизерд достиг успеха"
 britain.2.d:0 "Правительство США согласилось с нашим предложением и поделилось некоторыми своими исследовательскими данными с нашей делегацией."
 britain.2.a:0 "Чертовски хорошо!"
 britain.3.t:0 "Тизерд отклонен"
 britain.3.d:0 "Правительство США отклонило наше предложение, мы не получим от них никакой помощи."
 britain.3.a:0 "Эти негодяи!"
 britain.4.t:0 "Бирманская дорога"
 britain.4.d:0 "Чтобы помочь в нашей войне против Японии, Великобритания улучшила инфраструктуру и построила авиабазы вдоль нашей границы с Бирмой."
 britain.4.a:0 "Отразить псов войны!"
 japan.16.t:0 "Марионетка Японии"
 japan.16.d:0 "Японцы стремятся контролировать богатства Китая и не остановятся перед войной. Если мы не хотим воевать с ними, мы должны покориться их контролю и стать не более чем марионеткой Японии."
 japan.16.a:0 "Мы не можем сражаться"
 japan.16.b:0 "Мы должны сражаться!"
 japan.17.t:0 "Китай покоряется"
 japan.17.d:0 "Трусливые китайцы в очередной раз подчинились нашим требованиям, они согласились стать марионеткой нашей нации."
 japan.17.a:0 "Их потеря - наша выгода!"
 japan.18.t:0 "Китай отказывается"
 japan.18.d:0 "Глупые китайцы отклонили нашу совершенно разумную просьбу о том, чтобы мы управляли определенными аспектами их правительства. Нам нужно будет завоевать их, если мы хотим получить доступ к их ресурсам."
 japan.18.a:0 "Не должно быть сложно!"
 britain.6.t:0 "Независимость Индии"
 britain.6.d:0 "Четыре года назад мы обещали Индии независимость в течение четырех лет. Время вышло, и индийцы хотят, чтобы мы выполнили свое обещание. Оставит ли жемчужина короны Британскую империю?"
 britain.6.a:0 "Пора отпустить"
 britain.6.b:0 "Никогда!"
 japan.15.t:0 "Индийская национальная армия"
 japan.15.d:0 "После наших поражений от британцев у нас осталось большое количество индийских военнопленных. С помощью правильного убеждения мы могли бы использовать этих заключенных для укрепления наших сил..."
 japan.15.a:0 "За великую справедливость!"
 JAP_Indian_National_Army_arrives:0 "Два дивизиона Индийской национальной армии прибывают в Сингапур."
 britain.7.t:0 "Прекратить торговлю с Германией"
 britain.7.d:0 "Великобритания выдвинула нам ультиматум: либо мы прекращаем нашу торговлю с Германией, либо они вторгаются."
 britain.7.a:0 "Мне никогда не нравились немцы"
 britain.7.b:0 "Мы будем торговать с теми, с кем нам нравится!"
 britain.8.t:0 "Требование отклонено!"
 britain.8.d:0 "[From.GetName] отклонили наше требование прекратить торговлю с Германией."
 britain.8.a:0 "Тогда это война!"
 britain.8.b:0 "Мы не можем заставить их."
 britain.9.t:0 "Отставка Чемберлена"
 britain.9.d:0 "По мере развития войны во вред нам и нашим союзникам премьер-министр подвергается критике как за решения мирного, так и за решения военного времени в критические моменты. В тот момент, когда Британии как никогда необходимо стоять единым фронтом, она оказывается разделенной, поскольку часть парламента презирает Чемберлена.\n\nНе имея жизненно важной поддержки со стороны лейбористов, премьер-министр принял решение уйти в отставку, предложив в качестве своего преемника лорда Галифакса. Однако Галифакс скептически отнесся к этому, и Чемберлен посоветовал королю обратиться к Уинстону Черчиллю. Черчилль, который долгое время предупреждал о войне, которая сейчас происходит, считается способным провести нас через нее."
 britain.9.a:0 "Мы никогда не сдадимся."
 britain.10.t:0 "Чемберлен скончался"
 britain.10.d:0 "Премьер-министр Невилл Чемберлен недавно заболел, несмотря на то, что ранее был вполне здоров для своего возраста. После диагностирования рака кишечника, усиливающаяся боль и бессонница привели к тому, что он был вынужден уйти в отставку. Чемберлен по-прежнему пользуется сильной народной поддержкой и уходит в отставку только в качестве крайней меры, понимая, что не доживет до возвращения к работе.\n\nВопрос остается открытым, кто возьмет на себя руководство после этого великого государственного деятеля и поведет Британию через трудные времена, которые, возможно, еще ждут нас впереди."
 britain.10.a:0 "Уинстон Черчилль - это тот, кто нужен Империи."
 britain.10.b:0 "Лорд Галифакс - первый выбор Чемберлена."
 britain.21.t:0 "Триумф Тиззарда"
 britain.21.d:0 "Правительство США не только согласилось с нашим первоначальным предложением, но и предложило более долгосрочное сотрудничество между исследователями наших стран."
 britain.21.a:0 "Замечательно!"
 soviet.18.t:0 "Сианьский инцидент"
 soviet.18.d:1 "Внешнее давление со стороны [SOV.GetNameDef] с целью прекращения боевых действий между нами и Красной армией Китая привело к тому, что люди в наших рядах взяли дело в свои руки. Два генерала арестовали [Root.GetLeader], пытаясь навязать перемирие между нами и коммунистами для объединения Китая перед лицом внешних угроз. Международное давление за мирное решение, наряду со слабостью Китая, разделенного в эту эпоху, являются факторами в пользу создания единого фронта. Какого курса нам следует придерживаться?"
 soviet.18.a:0 "Свяжитесь с коммунистической партией для мирных переговоров."
 soviet.18.b:0 "Ни за что!"
 soviet.19.t:0 "Националисты предлагают перемирие"
 soviet.19.d:0 "Разногласия в рядах националистов привели к опасной ситуации. Их лидер, [From.GetLeader], был арестован в попытке заставить наших врагов принять перемирие с нами, чтобы объединить Китай против иностранных врагов. Хотя мы хотели бы, чтобы руководство Гоминьдана понесло наказание за преступления против нас, это редкая возможность сотрудничать и гарантировать, что Китай не попадет в руки иностранных империалистов."
 soviet.19.a:0 "Мы принимаем перемирие сейчас."
 soviet.19.b:0 "Революцию нельзя отложить ради этого!"
 soviet.20.t:0 "Национальный Китай отказывается от переговоров"
 soviet.20.d:0 "Несмотря на похищение [From.GetLeader], националисты отказались вступить в переговоры о перемирии с коммунистами. К сожалению, китайцы останутся в жестоком конфликте со своим собственным народом, что делает их легкой добычей для своих врагов."
 soviet.20.a:0 "Мы сделали все, что могли."
 soviet.21.t:0 "Перемирие в китайской гражданской войне"
 soviet.21.d:0 "Переговоры в Сиане принесли свои плоды. И националисты, и коммунисты согласились на перемирие, положив, по крайней мере временно, конец враждебным действиям и позволив сторонам сотрудничать против внешних угроз."
 soviet.21.a:0 "Для Китая еще есть надежда."
 soviet.22.t:0 "Коммунистический Китай отказывается от переговоров"
 soviet.22.d:0 "Несмотря на все усилия генералов Гоминьдана достичь перемирия с лидерами Коммунистической партии, коммунисты отказываются заключать даже временный мир, пока жив лидер националистов. Похоже, что военные действия не закончатся так легко."
 soviet.22.a:0 "В таком темпе враги Китая могут разделить и завоевать."
 soviet.23.t:1 "СССР уступает территорию"
 soviet.23.d:1 "СССР больше обеспокоен другими угрозами и не хочет увеличивать враждебность с нашей Империей. В знак желания мира между нашими народами они уступили нам некоторую территорию, надеясь, что это укрепит наши дипломатические связи."
 soviet.23.a:0 "Может, это станет переломным моментом."
 soviet.24.t:0 "Пятая колонна"
 soviet.24.d:0 "Преследование врагов народа, тех, кто хотел бы отменить или подорвать революцию, проводится с момента прихода партии к власти. Последующие внутренние конфликты за власть сдвинули наш фокус, и с момента изгнания Троцкого больше внимания уделялось чисткам в рядах партии. Сталин сделал себя иконой, но ценой создания множества настоящих врагов и бесчисленного множества воображаемых.\n\nВидя худшее во внутренних конфликтах за власть, Генеральный секретарь склонен действовать при малейшем подозрении. Исключение из партии означает тюремное заключение или смерть. Тёмные времена ожидают тех, кто проявляет нелояльность, или тех, кто слишком предан, чтобы казаться заслуживающим доверия."
 soviet.24.a:0 "Зиновьев и его банда все еще поддерживают отношения с Троцким?"
 soviet.25.t:0 "Суд над антисоветским троцкистским центром"
 soviet.25.d:2 "Несмотря на то, что Льву Троцкому пришлось уйти в изгнание, $SOV_iosif_stalin$ опасается, что у него есть тайные сторонники в партии. Серия стремительных арестов и жестоких допросов привела к признаниям и показаниям, которые удобно указывают на некоторых соперников Сталина. Однако чем больше задается вопросов и чем глубже тайная полиция углубляется в письма и дневники, тем больше людей оказываются замешанными, пусть и косвенно.\n\nЧлены партии начинают верить, что абсолютная власть Сталина и смерть его жены изолировали его до такой степени, что он воспринимает любого как угрозу, но разве не это сказал бы предатель?"
 soviet.25.a:0 "Подозревают жену Калинина. Ему тоже нельзя доверять."
 soviet.25.b:0 "В прошлом Хрущев увлекался троцкизмом. Он должен уйти."
 soviet.25.c:0 "Признание Радека указывает на нескольких людей внутри партии."
 soviet.25.e:0 "Членам партии можно доверять. Эта паранойя должна прекратиться."
 soviet.26.t:0 "Тайный суд над генералами"
 soviet.26.d:0 "Красная армия всегда была домом для подрывных элементов, ещё с тех пор, когда сам Троцкий был Народным комиссаром обороны. Документы, полученные НКВД, скомпрометировали нескольких высокопоставленных офицеров, назвав их не только предателями, но и шпионами. Михаил Тухачевский — один из самых известных подозреваемых, от которого Сталин стремится избавить армию. Между тем, частые контакты военно-морских сил с иностранцами привели к арестам многих из них.\n\nХотя в распоряжении наших врагов есть документы, доказывающие их вину, нельзя сказать, изготовили ли они их сами или же ложную информацию предоставили те, кто с самого начала стремился запустить эту чистку."
 soviet.26.a:0 "Тухачевского необходимо тайно судить и немедленно казнить."
 soviet.26.b:0 "Рокоссовский отказывается признаваться, но жить ему больше нельзя."
 soviet.26.c:0 "Подложные документы и признания под принуждением — ещё не доказательства."
 soviet.27.t:0 "Суд над 21"
 soviet.27_tt:0 "Повышает штраф от §YЧистка офицеров§!"
 soviet.27_tt2:0 "§RВ будущем это приведёт к гражданской войне.§!"
 soviet.27.d:0 "После нескольких раундов арестов и процессов Большая чистка создала нарратив, который привел к этому процессу. Среди обвиняемых - не только старые руководители, такие как Николай Бухарин, но и ряд дипломатов, политиков, военных и даже многие высокопоставленные сотрудники НКВД. Обвинения также более обширны, чем раньше, включая десятилетние заговоры с целью убийства советских лидеров и продажи Союза врагам. \n\nСам факт того, что НКВД сейчас оказались среди мишеней чистки, в некотором смысле замкнул круг событий. Угрозы и избиения привели к тому, что многие признались во всех обвинениях, даже самых диких. Главным обвиняемым грозит казнь."
 soviet.27.a:0 "Военно-морской флот и военно-воздушные силы пока отделались легко."
 soviet.27.b:0 "Как мы и предполагали, враги повсюду."
 soviet.27.c:0 "Это зашло слишком далеко. Скоро мы убьём всех своих."
 soviet.28.t:0 "Троцкистский переворот"
 soviet.28.d:1 "Мир, возможно, никогда не узнает, были ли чистки Сталина нацелены на правильных людей, или же он создал себе больше врагов, пытаясь истребить каждого троцкиста в Партии. Известно, что то, чего он боялся, в конечном итоге произошло. Сегодня Лев Троцкий снова появился после возвращения из изгнания и при поддержке нескольких влиятельных членов партии и офицеров НКВД совершил переворот, свергнув правление Сталина.\n\nБывший генеральный секретарь был атакован в своем доме ледорубом и был быстро казнен вместе с несколькими своими сторонниками. На разрушение культа личности, который он построил, потребуется время, но теперь люди, по крайней мере, знают, что он не бессмертен.\n\nОдним из немногих выживших, кому удалось спастись, был Иван Конев. Яростному стороннику Сталина удалось собрать немного поддержки и объявить войну правительству Троцкого в попытке вернуть власть и \"исполнить видение товарища Сталина\"."
 soviet.28.a:0 "Лидеры приходят и уходят, но люди остаются."
 soviet.29.t:0 "Франция хочет вступить в Коминтерн."
 soviet.29.d:0 "Наши товарищи во Французской коммунистической партии добились больших успехов. Нация Франции готова вступить в Коминтерн."
 soviet.29.a:0 "Добро пожаловать!"
 soviet.29.b:0 "Нет!"
 soviet.100.t:0 "Коммунисты смирились"
 soviet.100.d:1 "Учитывая, что [SOV.GetNameDef] и мы сами находимся в состоянии войны с общим врагом, они, кажется, ослабили поддержку наших внутренних коммунистических партий."
 soviet.100.a:0 "Рад от них избавиться!"
 yugoslavia.1.t:0 "Ответный переворот в Югославии"
 yugoslavia.1.d:0 "Антифашистские настроения в Югославии, которые мы долго пытались уравновесить, чтобы страна сохраняла нейтралитет и продолжала сотрудничество с нынешним руководством, достигли критической точки после того, как нация решила сотрудничать с Германией. Несмотря на то, что некоторые союзники Германии заинтересованы в югославских территориях, руководство разрешило немецким войскам войти в страну.\n\nВВС Югославии планирует свергнуть прогерманское правительство. Хотя это может еще больше дестабилизировать регион, это положит конец их сотрудничеству с Германией. Поддержать ли нашим разведчикам переворот или попытаться убедить антинемецкую группировку отложить его?"
 yugoslavia.1.a:0 "Поддержать переворот через Управления специальных операций"
 yugoslavia.1.b:0 "Отговорить заговорщиков"
 yugoslavia.2.t:0 "Государственный переворот"
 yugoslavia.2.d:0 "Поскольку [Root.GetLeader] старался поддерживать дружеские отношения с Германией, внутри страны усилились антинемецкие настроения. В частности, сербские националисты выступили против этого дипломатического направления, и народная оппозиция заявила о себе. Сегодня военные ВВС попытались совершить переворот, объявив молодого короля Петра II совершеннолетним и возведя его на трон. Переворот, поддержанный разведкой врагов Германии, направлен на то, чтобы разорвать наши соглашения. Это может привести к войне."
 yugoslavia.2.a:0 "Лучше война, чем пакт!"
 yugoslavia.2.b:0 "Лучше сражаться с переворотом, чем с немцами."
 yugoslavia.3.t:0 "Лондонская конференция"
 yugoslavia.3.d:0 "Наша надежда не столкнуться с германскими угрозами в одиночку сбылась. Мощь Британской империи и ее союзников будет стоять вместе с нами."
 yugoslavia.3.d_FRA_abandoned_yugoslavia:0 "Наша надежда не столкнуться с германскими угрозами в одиночку сбылась. Мощь Британской империи и ее союзников будет стоять вместе с нами. К сожалению, Франция выбрала путь труса."
 yugoslavia.3.a:0 "Югославия будет свободной"
 yugoslavia.4.d:0 "Наша надежда не столкнуться с германскими угрозами в одиночку сбылась. Хотя угасающая мощь Британской империи не с нами, могущественная Французская империя будет стоять рядом с нами."
 yugoslavia.4.a:0 "Мы победим!"
 yugoslavia.5.t:0 "Лондонский диктат!"
 yugoslavia.5.d:0 "Перед лицом возрождающейся Германии, которая разрывает договоры, сохранявшие мир. Трусы на Западе бросают нас волкам в надежде, что мы утолим их голод. История осудит их недобро, но теперь мы должны сами выбирать свою судьбу."
 yugoslavia.5.a:0 "Сопротивление приведет лишь к бессмысленным смертям"
 yugoslavia.5.b:0 "Мы будем сражаться до конца"
 yugoslavia.6.t:0 "Лондонская конференция"
 yugoslavia.6.d:0 "Когда все остальные нас покинули, с нами осталась только Италия. Теперь это наш самый верный друг, и мы будем сражаться вместе."
 yugoslavia.6.a:0 "Помоги нам Бог"
 yugoslavia.7.t:0 "Судьба Югославии"
 yugoslavia.7.d:0 "[$From.GetNameDefCap$] требует от нас передать в их распоряжение полный контроль над нашей страной. Все граждане Югославии фактически станут немцами, и у нас больше не останется никакого влияния. Мы можем принять здесь решение держаться до конца и надеяться на помощь, но вполне возможно, что это единственный способ избежать истребления югославского народа."
 yugoslavia.7.a:0 "Мы должны твёрдо стоять на своём"
 yugoslavia.7.b:0 "Это спасёт очень многие жизни"
 yugoslavia.8.d:0 "[$From.GetNameDefCap$] требует от нас передать в их распоряжение полный контроль над нашей страной. Фактически граждане Югославии станут гражданами [$From.GetNameDef$] или одного из их марионеточных государств. Мы можем принять здесь решение держаться до конца и надеяться на помощь, но вполне возможно, что это единственный способ избежать истребления югославского народа."
 yugoslavia.8.a:0 "Мы должны твёрдо стоять на своём"
 yugoslavia.8.b:0 "Это спасёт очень многие жизни"
 yugoslavia.9.d:0 "[$From.GetNameDefCap$] требует от нас уступить территорию новообразованному правительству Хорватии, контролируемому [$From.GetNameDef$]. Также они требуют, чтобы мы провели крупные правительственные реформы, которые позволят нам управлять гражданами Югославии, но при сильном влиянии [$From.GetAdjective$] на нашу политику. Мы можем принять здесь решение держаться до конца и надеяться на помощь, но вполне возможно, что это единственный способ избежать истребления югославского народа."
 yugoslavia.9.a:0 "Мы должны твёрдо стоять на своём"
 yugoslavia.9.b:0 "Это спасёт очень многие жизни"
 germany.89.t:0 "Безбожный Альянс"
 germany.89.d:0 "После успеха нашего недавнего сотрудничества, немцы пришли к нам с интригующим предложением. Они предлагают оставить в стороне наши разногласия и вместо того чтобы тратить свои силы на борьбу друг с другом, пока западные демократии наблюдают и наживаются, объединить наши силы и вместо этого раздавить их!"
 germany.89.a:0 "Пусть мир дрожит!"
 germany.89.b:0 "Никаких сделок с фашистами!"
 germany.90.t:0 "Альянс отказался"
 germany.90.d:1 "Советы отклонили наше предложение, если мы хотим ресурсы [SOV.GetNameDef], нам придется забрать их силой!"
 germany.90.a:0 "Если они не с нами, значит они против нас."
 germany.91.t:0 "Франция хочет присоединиться к нашей фракции"
 germany.91.d:0 "Сильные лидеры Мувман Франсист добились большого прогресса и предлагают присоединиться к нашему делу. Страна Франция готова сражаться за Рейх."
 germany.91.a:0 "Mehr Soldaten für das Reich"
 germany.91.b:0 "Nein!"
 germany.92.t:0 "Германия отклоняет ультиматум"
 germany.92.d:0 "Несмотря на наше разъяснение, что их повторная милитаризация Рейнской области будет рассматриваться как акт войны, Германия отказалась отступить и продвинулась в демилитаризованную зону, проигнорировав наше предупреждение. Это означает, что, несмотря на наши усилия по поддержанию мира, война снова вспыхнула в Европе."
 germany.92.a:0 "Версальский договор должен быть исполнен."
 germany.93.t:0 "Лондонская конференция"
 germany.93.d:0 "Мы ожидали, что великие державы Европы сядут за стол переговоров и придут к справедливому соглашению во имя мира. Вместо этого британцы и французы решили поддержать выскочек-югославов и их искусственное государство. Словения будет нашей, так или иначе...."
 germany.93.d_FRA_abandoned_yugoslavia:0 "Мы ожидали, что великие державы Европы сядут за стол переговоров и придут к справедливому соглашению во имя мира. Хотя Франция увидела справедливость нашего дела, глупые британцы решили поддержать выскочек-югославов и их искусственное государство. Словения будет нашей, так или иначе...."
 germany.93.a:0 "Нам не откажут"
 germany.94.t:0 "Лондонская капитуляция"
 germany.94.d:0 "В очередном триумфе решительности и действий Словения, которая скоро будет переименована в Крайну, вернулась в свой законный дом в Германский Рейх."
 germany.94.a:0 "Триумф для Германии!"
 germany.95.t:0 "Югославы отказываются"
 germany.95.d:0 "Югославы, с ложным представлением о своем месте в мире, решили не воспользоваться шансом, который мы им предложили."
 germany.95.a:0 "Пора преподать им урок"
 germany.96.t:0 "Лондонская конференция"
 germany.96.d:0 "Югославы, подстрекаемые глупыми итальянцами, решили бросить нам вызов. Неблагодарные итальянцы сгорят вместе с югославами. Генерал Роммель заверяет нас, что они уже убегали в прошлый раз, и, без сомнения, убегут снова."
 germany.96.a:0 "Эта война продлится недолго"
 germany.97.t:0 "Лондонская конференция"
 germany.97.d:0 "Предполагалось, что великая Лондонская конференция исправит одну из многих несправедливостей, содеянных в отношении Германии. Однако французы по-прежнему жаждут мести и желают видеть Германию на коленях. Они поддержали режим в Белграде, несмотря на правоту нашего дела. Неужели они искренне полагают, что их пустые угрозы что-то значат для нас?"
 germany.97.a:0 "Мы раздавим их обоих."
 germany.98.t:0 "Судьба Югославии"
 germany.98_tt:0 "§YЕсли Югославия примет, произойдет следующее:§!\n"
 germany.98.d:1 "Мы всегда знали, что югославское государство, вырезанное из Габсбургской империи, было искусственной страной, которой суждено никогда не продержаться. Этническая враждебность, кипящая под поверхностью, выплеснулась наружу, и государство рушится. Мы должны вмешаться, чтобы исправить ситуацию."
 germany.98.a:0 "Аннексировать всю Югославию."
 germany.98.b:0 "Создать хорватскую марионетку. Аннексировать остальных."
 germany.98.c:0 "Создать марионетки из Хорватии и Югославии."
 germany.99.t:0 "Раздел Греции"
 germany.99.d:0 "Когда мы предположили, что, возможно, греческие границы следует пересмотреть, итальянский посол громогласно заявил, что они возродят Римскую империю на пепелище Греции."
 germany.99.a:0 "Конечно, они будут"
 germany.99.b:0 "Придерживайтесь того, чтобы заставить поезда ходить по расписанию"
 germany.100.t:0 "Раздел Греции"
 germany.100.d:0 "Территория, которую Болгария считала своей, была передана Греции после Второй Балканской и Первой мировой войн. Если мы исправим эту несправедливость, мы привяжем Болгарию к себе. Однако если они недостаточно сильны, чтобы вернуть ее себе сами, то будут ли они для нас достойными союзниками?"
 germany.100.a:0 "Привяжем Болгарию к себе"
 germany.100.b:0 "Пусть завоюют нашу дружбу"
 germany.101.t:0 "Расчленим Грецию"
 germany.101.d:0 "Отсутствие подходящих союзников ставит Германию в неудачное стратегическое положение в Восточном Средиземноморье. Однако мы можем исправить это, потребовав у Греции базы и территории вокруг нее, чтобы обезопасить их."
 germany.101.a:0 "Греция должна передать базы Германии"
 germany.101.b:0 "Мы должны играть по-крупному"
 germany.101_tt:0 "§YЕсли Греция согласится, произойдет следующее:§!"
 germany.102.t:0 "Греция отказывается"
 germany.102.d:0 "Греция глупо отказалась от нашей помощи в урегулировании их территориальных споров."
 germany.102.a:0 "Они, должно быть, осознали альтернативу"
 germany.103.t:0 "Греция отказывается"
 germany.103.d:0 "Греция отклонила наше щедрое предложение защиты и помощи"
 germany.103.a:0 "Мы должны заставить их понять истину"
 germany.104.t:0 "Италия требует территорий Виши"
 germany.104.d_Savoy:0 "Итальянцы начали предъявлять требования Вишистской Франции на волне нашей победы. Они просят передать приграничную зону Савойи, чтобы усилить Италию. Однако это мы будем решать."
 germany.104.d_Corsica:0 "Итальянцы требуют у Виши остров Корсика в качестве своей доли добычи. Мы могли бы предоставить его им?"
 germany.104.d_Savoy_Corsica:0 "Италия потребовала, чтобы Виши передала ей Савойю и Корсику. Это было бы благом для Италии, но это будет касаться французских колониальных властей."
 germany.104.a:0 "Полагаю, они могут получить Савойю"
 germany.104.b:0 "Корсика - это все, чего они заслуживают"
 germany.104.c:0 "Пусть получат Савойю"
 germany.104.e:0 "Сильный союзник ведет к сильной Германии"
 germany.104.f:0 "Им нужно больше, чем несколько тысяч погибших"
 germany.105.t:0 "Италия покидает [Root.GetFactionName]"
 germany.105.d:0 "После нашего решения не предоставлять никаких земель Италии, они решили покинуть [Root.GetFactionName], заявив, что мы не являемся для них достойными союзниками."
 germany.105.a:0 "В любом случае они никогда не много воевали"
 germany.106.t:0 "Крайовский договор"
 germany.106_threat:0 "Крайовский договор"
 germany.106.d_second_vienna_accepted_north:0 "С получением Венгрией Северной Трансильвании Болгария напомнила нам о своем давнем пограничном споре с Румынией из-за Южной Добруджи, захваченной Румынией в 1913 году."
 germany.106.d_second_vienna_accepted_all:0 "С обретением Венгрией Трансильвании Болгария напомнила нам о своем давнем пограничном споре с Румынией из-за Южной Добруджи, захваченной Румынией в 1913 году."
 germany.106.d_no_vienna:0 "С тех пор, как отношения с Венгрией охладели, в результате чего они решили присоединиться к другому альянсу, наш первоначальный план дать им часть Трансильвании стал невозможным. Вместо этого нам следует прислушаться к территориальному спору Болгарии за Южную Добруджу, захваченную Румынией в 1913 году."
 germany.106.a:0 "Позволим им потребовать Южную Добруджу"
 germany.106.b:0 "Мы не будем поддерживать какие-либо болгарские требования"
 germany.107.t:0 "Полет Рудольфа Гесса"
 germany.107.d:0 "Вчера в Шотландии заместитель фюрера Рудольф Гесс был арестован солдатами ополчения после того, как выпрыгнул с парашютом из тяжелого истребителя. Опытный пилот, он, по-видимому, в одиночку перелетел через Северное море, избегая попадания в зону действия радаров, прежде чем повернуть на запад к Британии.\nПо-видимому, Гесс взял на себя задачу договориться о мирном договоре между Британией и Германией, хотя Берлин объявил его сумасшедшим и лишил всех политических постов. Британские власти не прокомментировали это."
 germany.107.a:0 "Wahnsinn!"
 germany.108.t:0 "Смерть Рудольфа Гесса"
 germany.108.d:0 "Заместитель фюрера Рудольф Гесс погиб вчера, когда Королевские ВВС перехватили тяжелый истребитель, на котором он вылетел к берегам Шотландии. Подробности его миссии до сих пор остаются неясными: хотя Гесс был опытным пилотом, он летел один, и его самолет не был вооружен.\nЕго останки были обнаружены британскими властями, но в Берлине запланированы государственные похороны с пустым гробом.\nСообщается, что Гитлер был заметно расстроен смертью своего старого друга."
 germany.108.a:0 "Этот несчастный дурак."
 germany.109.d:0 "Воздушный корабль "Гинденбург", стоявшем на приколе в Германии с начала боевых действий, встретил сегодня свой драматический конец, взорвавшись над Шотландией. Его, по-видимому, угнал заместитель фюрера Рудольф Гесс, которому удалось перелететь на нем в одиночку через Северное море с целью лично договориться о мире с Британией.\nБританские станции обнаружения без труда запеленговали эту огромную машину, и на ее перехват немедленно направили несколько эскадрилий Королевских ВВС. Когда "Гинденбург" не ответил по радио, эскадрильи открыли огонь.\nГесс выпрыгнул с парашютом и приземлился в безопасном месте, после чего был заключен в Тауэр."
 germany.110.d:0 "Воздушный корабль "Гинденбург", пришвартованный в Германии с начала боевых действий, встретил сегодня трагический конец. Он взорвался над Шотландией. Выяснилось, что им управлял заместитель фюрера Рудольф Гесс, которому в одиночку удалось перелететь через Северное море, чтобы договориться о мире с Великобританией.\nБританские радары не могли не заметить этот массивный летательный аппарат, и несколько эскадрилий Королевских ВВС немедленно направились к месту его нахождения. Поскольку "Гинденбург" не отвечал по радио, они открыли огонь.\nОстанки Гесса были найдены в обломках."
 germany.110.a:0 "Этот сумасшедший..."
 germany.111.t:0 "Югославия отказывается"
 germany.111.d:0 "Югославия безрассудно отказалась от нашего предложения урегулировать напряженность в регионе."
 germany.111.a:0 "Они вынудили нас действовать"
 germany.113.t:0 "Германия официально запрашивает Данциг"
 germany.113.d:0 "Рассматривая их военную поддержку как необходимую для любого успеха в нашей гражданской войне, [GER.GetNameDef] представил планы по установлению [GER.GetAdjective] контроля над Данцигом по завершении военных действий. Они также ясно дали понять, что зависимость [Root.GetNameDef] от их военной поддержки не оставляет [Root.GetLeader] иного выбора, кроме как подписать это "Данцигское соглашение"."
 germany.113.a:0 "[Root.GetName] должен вести один бой за раз."
 germany.114.t:0 "Германские требования к Данцигу"
 germany.114.d:0 "После нашей победы в [Root.GetAdjective] гражданской войне Германия несколько раз напоминала нам об их требовании Данцига. Они также напоминали нам о том, какие могут быть последствия неповиновения для страны, все еще переживающей внутренний конфликт."
 germany.114.a:0 "У них будет Данциг, как и было согласовано."
 germany.114.b:0 "Мы никогда не уступим Польскую землю!"
 germany.115.t:0 "Польша передает Данциг"
 germany.115.d:0 "В соответствии с Данцигским соглашением [GER.GetNameDef] согласилась передать Данциг под контроль [GER.GetNameDef]."
 germany.115.a:0 "Это оказалось выгодным сотрудничеством."
 germany.116.t:0 "Польша отказывается от Данцигского соглашения"
 germany.116.d:0 "Игнорируя нашу неоценимую поддержку, которую мы оказали им во время гражданской войны, [From.GetName] решила проигнорировать наши претензии на Данциг."
 germany.116.a:0 "Нарушение нашего соглашения обойдется им дорого."
 germany.116.b:0 "Мы не можем позволить себе этот конфликт."
 germany.117.t:0 "Данцигское соглашение"
 germany.117.d:0 "[From.GetName] согласилась на нашу просьбу в обмен на поддержку в их гражданской войне. Наша просьба и наше обещание были оформлены в Данцигском соглашении. Теперь мы должны убедиться, что [From.GetName] выйдет победителем из их конфликта."
 germany.117.a:0 "Это тоже [Root.GetAdjective] борьба."
 germany.118.t:0 "Ялтинская конференция"
 germany.118.d:2 "С продвижением войны в Европе настало время для неизбежных победителей подумать о будущем Европы.\n\nМы можем предложить [yalta_partner.GetNameDef] конференцию о разделе [GER.GetNameDef] после войны, чтобы определить сферы нашего влияния на континенте.\n\nНаши "друзья" в [yalta_partner.GetNameDef] указали, что были бы заинтересованы в такой конференции. Без сомнения, они захотят какое-то вознаграждение за свои жертвы."
 germany.118.a:0 "Нам нужна конференция о будущем Европы."
 germany.118.b:0 "Мы не можем сотрудничать с [yalta_partner.GetNameDef]."
 yalta_division_tt:0 "Следующие государства будут обозначены как сфера влияния союзников:\n§Y[42.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!.\n\nСледующие государства будут в сфере влияния [SOU.GetAdjective]:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!.\n\n Претензии [POL.GetAdjective] на следующие государства будут признаны всеми сторонами:§Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!.\n\n"
 germany.118.c:0 "Мы должны следовать плану Моргентау."
 morgenthau_division_tt:0 "[FRA.GetFlag] [FRA.GetNameDefCap] получает §Y[42.GetName]§!\n[POL.GetFlag] Польша получает §Y[67.GetName]§! и §Y[5.GetName]§!.\n[SOV.GetFlag] [SOV.GetNameDefCap] получает §Y[763.GetName]§!\nМеждународная зона под §Y[ENG.GetAdjective] управлением будет создана в: §Y[51.GetName]§!, §Y[52.GetName]§!, и §Y[56.GetName]§!.\nНезависимое [GER.GetFlag] Северогерманское государство, в сфере влияния [yalta_partner.GetAdjective], должно быть создано в §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§!, и §Y[60.GetName]§!.\nНезависимое [GER.GetFlag] Южногерманское государство будет создано в §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[52.GetName]§!, и §Y[53.GetName]§!."
 germany.118.e:0 "У Черчилля есть идея..."
 churchill_plan_germany_tt:0 "Германия будет разделена на три страны. Западногерманское государство, Северогерманское государство и Южногерманское государство, также включающее некоторые части Австро-Венгерской империи. Все они должны находиться в сфере влияния союзников, в то время как остальная часть Центральной и Восточной Европы будет в сфере влияния [yalta_partner.GetAdjective]."
 germany.119.t:0 "Ялтинская конференция"
 germany.119.d:0 "По мере того, как война против [GER.GetNameDef] приближается к неизбежному завершению, [yalta_origin.GetNameDef] предложили нам провести конференцию по будущему Европы.\n\nОни предлагают разделить [GER.GetNameDef] на восток и запад. Это позволило бы нашей сфере влияния распространиться вглубь Европы, что компенсировало бы некоторые потери, которые мы понесли в этой ужасной борьбе."
 germany.119.a:0 "Ради длительного сотрудничества."
 germany.119.b:0 "Мы продиктуем свой мир."
 germany.1190.t:0 ""Торонтская конференция""
 germany.1190.desc:0 "По мере того, как война против [GER.GetNameDef] приближается к неизбежному завершению, [yalta_origin.GetNameDef] предложили нам провести конференцию по будущему Европы.\n\nОни предлагают разделить [GER.GetNameDef] на три части, в которых мы получим ограниченное влияние на восточный регион. Основной промышленный регион перейдет под контроль союзников, и союзники также будут иметь ограниченный контроль над южным регионом. Это уменьшит мощь Германии, однако наше влияние на центральную Европу останется неопределенным."
 germany.120.t:0 "[yalta_partner.GetNameDefCap] отказывается участвовать"
 germany.120.d:0 "Наша предполагаемая конференция по будущему Европы провалилась.\n\nНедвусмысленно выражаясь, [yalta_partner.GetLeader] отклонил необходимость планирования и сотрудничества в послевоенной Европе.\n\n«Мы встретимся, когда я буду предъявлять свои требования [GER.GetNameDef] за столом переговоров. Я не позволю мелкой политике встать на пути [yalta_partner.GetNameDef]»."
 germany.120.a:0 "Это тревожно."
 germany.121.t:0 "Разделение Германии"
 germany.121.d:0 "Как указано в Ялтинском соглашении, Германия должна быть разделена на два отдельных государства, каждое из которых находится в сфере влияния одной из воюющих сторон.\n\nБудем надеяться, что это положит конец конфликту в Европе."
 germany.121.a:0 "Для Германии..."
 germany.122.t:0 "[From.GetNameDefCap] требует Судетскую область"
 germany.122.d:0 "На фоне текущих событий Германия потребовала от нас передать ей Судетскую область, чтобы «защитить немецкое население» в этом регионе.\n\nПродолжая начатое, они дали ясно понять, что это конечная цель. Никаких переговоров или дипломатии не будет. Они получат Судетскую область или развяжут из-за нее войну."
 germany.122.a:0 "Пусть начинают войну, если осмелятся!"
 germany.122.b:0 "Мы не можем позволить себе войну с [From.GetNameDef]."
 germany.123.t:0 "[From.GetNameDefCap] отказывается передать нам Судетскую область"
 germany.123.d:0 "В глупом дипломатическом шаге, [From.GetLeader], лидер [From.GetAdjective], отклонил все [Root.GetAdjective] требования!\n\nОни не уступят Судетскую область и практически бросили нам вызов, высмеяв наше желание защитить наших [Root.GetAdjective] братьев и сестер."
 germany.123.a:0 "Пусть будет так!"
 germany.124.t:0 "[From.GetNameDefCap] уступает Судетскую область"
 germany.124.d:0 "Столкнувшись с перспективой войны с нами, [From.GetNameDef] согласился уступить контроль над Судетской областью и отказаться от любых будущих претензий на этот регион.\n\n[Root.GetAdjective] население Судетской области наконец-то окажется в безопасности в составе [Root.GetNameDef]."
 germany.124.a:0 "За [Root.GetNameDef] и всех [Root.GetAdjective]!"
 germany.126.t:0 "Аншлюс или уничтожение"
 germany.126.warning:0 "§RМожет привести к войне§!\n"
 germany.126.d:0 "Возникли гражданские беспорядки и акты насилия, когда протестующие выразили свое желание, чтобы Австрия присоединилась к Германии. Внутренние распри, от которых уже страдает наша нация, лишь усиливают голоса людей, желающих объединения с Германией. Берлин оказывает сильное давление на Аншлюс, и это вполне может быть нашим единственным шансом сохранить часть истинных австрийских ценностей живыми."
 germany.126.a:0 "Мы присоединимся к Германскому рейху!"
 germany.126.b:0 "Нет, судьба Австрии лежит в другом месте."
 germany.127.t:0 "Оформить союз"
 germany.127.d:1 "Наше единство в борьбе против [SOV.GetNameDef] — достаточный повод для того, чтобы официально закрепить этот союз и пригласить наших новых партнеров в антикоммунистической войне в нашу фракцию."
 germany.127.a:0 "Мы направим послов."
 germany.127.b:0 "Мы не должны перед ними ничем и дальше."
 germany.128.t:0 "Антисоветский пакт"
 germany.128.d:0 "[From.GetNameDefCap] предложил нам вступить в свою фракцию, чтобы мы могли лучше координировать совместные действия против коммунистической угрозы. Послы, чтобы официально закрепить этот союз, уже прибыли в столицу."
 germany.128.a:0 "Это прекрасная инициатива."
 germany.128.b:0 "Мы подчиняемся судьбе."
 germany.200.t:0 "Новая Германия"
 germany.200.desc:0 "Германия уже не является угрозой, которой была раньше. Вместо этого мировой порядок угрожает нарушить [SOV.GetNameDef]. Сильная и демократическая Германия может стать весьма полезным союзником в этой борьбе. Дав Германии возможность вновь подняться, мы также можем извлечь большие торговые преимущества для себя и для нее. Возможно, пришло время покончить с оккупацией и создать основу для прочного и объединенного демократического мира."
 germany.200.a:0 "Давайте начнем реализовывать эти планы."
 germany.200.b:0 "Нет, это слишком рискованно."
 germany.201.t:0 "[FROM.GetName] хочет воссоединить Германию"
 germany.201.desc:0 "[FROM.GetName] решил прекратить оккупацию Германии и предоставить немцам самоуправление в виде новой республики под названием [WGR.GetNameDef]. Они утверждают, что это делается для создания оплота против коммунизма, утверждая, что сильная демократическая Германия является лучшей защитой от распространения коммунизма, чем слабая раздробленная. \nНас попросили поддержать это путем слияния наших германских территорий с вновь созданным [WGR.GetName]. Народная поддержка этого сильна."
 germany.201.a:0 "В этом, безусловно, есть свои преимущества"
 germany.201.b:0 "Нет, время для этого еще не пришло"
 germany.202.t:0 "Новая Германия"
 germany.202.desc:0 "[FROM.GetName] позволили присоединить свои немецкие территории к так называемому [WGR.GetName]. Это привело к тому, что многие люди в нашей немецкой зоне также призвали к воссоединению с независимой Германией."
 germany.202.a:0 "Тогда давайте создадим собственную независимую Германию"
 germany.202.b:0 "Не стоит прилагать усилий, чтобы удержать их"
 THREAT_FROM_EFFECT:0 "Угроза от действий"
 war_justification.1.t:0 "[Root.GetLeader] выступает против [From.GetName]"
 war_justification.1.d:0 "[From.GetName] принадлежит [From.GetAdjective]? Давайте зададим себе вопрос по-другому: принадлежит ли будущее [From.GetAdjective] или оно принадлежит [Root.GetNameDef]?"\n\nСегодняшняя речь [Root.GetLeader] свидетельствует о том, что [Root.GetName] находится на пути к войне. В течение прошлого месяца политическая напряженность нарастает, и, похоже, народ [Root.GetAdjective] смиряется с тем, что война неизбежна.
 war_justification.1.a:0 "Будущее принадлежит [Root.GetName]!"
 war_justification.2.t:0 "[Root.GetLeader] осуждает идеалы [From.GetAdjective]"
 war_justification.2.d:0 "[From.GetAdjective] заявляет о свободе и демократии, заявляет о желании мира, но все то, чем они гордятся, - пусто. Их демократия разделяет людей там, где они должны быть едины, а их свобода лишь свидетельствует об отсутствии дисциплины. Мы, [Root.GetAdjective], видим ложь в их словах... и мы видим, что этот мир, мир на их условиях, - тоже ложь."\n\n[Root.GetRulingParty] давно высмеивает слабость государства [From.GetAdjective], но в последнее время риторика стала более агрессивной. День вооруженного конфликта приближается.
 war_justification.2.a:0 "[Root.GetName] сплотился под руководством [Root.GetLeader]."
 war_justification.3.t:0 "[Root.GetLeader] предупреждает о коммунизме [From.GetAdjective]"
 war_justification.3.d:0 "Есть ли большая угроза нашему образу жизни, да, или самому образу жизни, чем коммунизм? Это чума, которая угрожает тому, что рабы, а не господа будут править каждым народом, уничтожить сам народ, уничтожить людей и их историю. Мы возьмем [From.GetName] и уничтожим коммунистическую заразу.\n\nНенависть [Root.GetLeader] к коммунистам была хорошо известна еще до прихода [Root.GetRulingParty] к власти, но она, похоже, усилилась в последнее время в конкретном случае с правительством [From.GetAdjective]. Наше стремление очистить от марксизма лицо Земли может начаться там."
 war_justification.3.a:0 "Те, кто отвергает нации, увидят гибель своей."
 war_justification.4.t:0 "[Root.GetName] готовится к Великой борьбе"
 war_justification.4.d:0 "[From.GetAdjective] - люди, которые не легко расстанутся с властью. Однако они должны также понимать, что траектория наших двух наций может привести только к столкновению. Мы должны подготовиться к предстоящей борьбе. Потому что [From.GetName] не будет взят без боя.\n\nВозможность взаимопонимания между правительствами [From.GetName] и [Root.GetName], настроенными одинаково, уступила место кампании по насильственному захвату их территории."
 war_justification.4.a:0 "История будет написана нашей победой."
 war_justification.5.t:0 "[Root.GetLeader] приносит революцию в [From.GetName]"
 war_justification.5.d:0 "В то время, как мы укрепляем социалистическое общество в [Root.GetName], многие нации по-прежнему страдают под гнетом старых деспотов. Рабочие [From.GetName] лишены голоса, возможности организоваться, и любые попытки установить социализм будут жестоко подавлены режимом [From.GetLeader]. Мы не можем ждать, пока шестеренки международной революции закрутятся для [From.GetAdjective] народа. Своей революцией мы доказали, что можем сокрушить капиталистических угнетателей здесь, и мы также сокрушим угнетателей в [From.Capital.GetName]!\n\n[Root.GetLeader] отказался от любых попыток дипломатической риторики в адрес [From.GetRulingParty], управляющих [From.GetName]. Борьба за ликвидацию всех границ теперь строго сосредоточена на ликвидации их границ."
 war_justification.5.a:0 "Рабочие [From.GetAdjective], ваше освобождение близко!"
 war_justification.6.t:0 "[Root.GetLeader] призывает помочь рабочим [From.GetAdjective]"
 war_justification.6.d:0 "Разве есть ложь более страшная, чем мнимой свободой [From.GetAdjective] народа? Где они когда-то были рабами под принцами и герцогами, которые утверждали, что владеют землей, теперь они вынуждены продавать свой труд тем, кто утверждает, что владеет заводами. Их свободу выбора одного мастера вместо другого едва ли можно назвать свободой. Равным образом, их свобода выбирать своих лидеров является ложным выбором, поскольку пропаганда никогда не позволит настоящим социалистам взять власть. Народ, столь тщательно обработанный, может быть спасен только [Root.GetAdjective] вмешательством.\n\n[Root.GetLeader] долгое время критиковал правительство [From.GetName] на партийных собраниях, но теперь эта риторика используется чаще в публичном пространстве. Есть мало оснований полагать, что этот конфликт может быть разрешен мирным путем."
 war_justification.6.a:0 "Мы раздавим их буржуазную диктатуру!"
 war_justification.7.t:0 "[From.GetAdjective] Коммунизм рушится"
 war_justification.7.d:0 "Товарищи, хотя когда-то величайших революционеров называли предателями, стало очевидным, что настоящая революция сама была предана. Иначе как объяснить власть [From.GetRulingParty] из [From.GetName], отвергнувших все намеки на марксистские идеи, чтобы построить деградировавшее рабочее государство, где они могли бы править под ложными предлогами? Укрепив собственную власть за счет международной революции, они показали, что мало заботятся об идеалах, которые якобы исповедуют. Мы должны донести до них истинную революцию.\n\nХотя изначально [Root.GetLeader] поддерживал [From.GetAdjective] революцию, он выразил все большее разочарование в том, как она развивается. [Root.GetRulingParty] может придется вмешаться, пока не стало слишком поздно."
 war_justification.7.a:0 "Еще есть время спасти их попытку построить социализм."
 war_justification.8.t:0 "[Root.GetLeader] Призывает подавить [From.GetAdjective] Национализм"
 war_justification.8.d:0 "Есть ли в мире общество отвратительнее фашистского режима [From.GetName], более чуждого страданиям рабочего класса? Взывая к людям, чтобы те фанатично предавались ветхому учреждению национального государства, они облачили древние пути дикости в современный костюм, пытаясь выдать себя за альтернативное будущее неизбежной интернациональной победы рабочего класса. Это лишь вопрос времени, прежде чем они нападут на нас или наших союзников. Так давайте ударим первыми.\n\nНикто не ожидал ничего меньшего, чем взаимного презрения между нами и [From.GetAdjective], но последнее время враждебность усилилась. Теперь ясно, что конфликт разразится рано или поздно."
 war_justification.8.a:0 "Смерть фашистам!"
 war_justification.9.t:0 "Дипломатические отношения с [From.GetName] разорваны"
 war_justification.9.d:0 "Несмотря на наши попытки найти дипломатическое решение в нашем конфликте с [From.GetName], переговоры снова сорвались, оставив нам ограниченные возможности. Авторитарный режим [From.GetLeader] продемонстрировал неприемлемый подход к решению вопроса, что характерно для лидеров, которые не подотчетны своему народу. За исключением полного разворота в политике руководства [From.GetAdjective], у нас не останется другого выхода, кроме как сражаться.\n\n[Root.GetAdjective] вмешательство в [From.GetName] было острым вопросом, некоторые политики в оппозиции утверждали, что [Root.GetRulingParty] с самого начала проводила агрессивную политику. Каковы бы ни были их первоначальные намерения, теперь будущая война кажется очень реальной и неизбежной."
 war_justification.9.a:0 "Иногда нужно взобраться на гору конфликта."
 war_justification.10.t:0 "[Root.GetLeader] призывает к вмешательству в [From.GetName]"
 war_justification.10.d:0 "С тяжёлым сердцем мы должны противостоять реальности нашего положения: вторжение в [From.GetName] может быть нашим единственным выходом. Слишком велико стратегическое преимущество, чтобы пытаться найти другое решение в нашей нынешней ситуации. Хотя мы доверяем тому, что ни [Root.GetAdjective], ни [From.GetAdjective] народ не хочет войны, но история привела нас к этому моменту, и наши возможности ограничены. Мы можем только надеяться, что благодаря этому проявлению нашей военной мощи мы сможем избежать дальнейшего кровопролития в будущем.\n\nХотя популярна теория о том, что демократии не идут на войну с другими демократиями, недавние события указывают на возможное [Root.GetAdjective] вторжение в [From.GetName]. История может ещё нас удивить."
 war_justification.10.a:0 "[From.GetName] в любом случае сомнительная демократия."
 war_justification.11.t:0 "[Root.GetLeader] выступает против красной угрозы"
 war_justification.11.d:0 "Несомненно, [From.GetName] коммунизм - одна из величайших угроз свободе и порядку в эту эпоху. Безжалостный и беспощадный, он угрожает поглотить не только надежды [From.GetAdjective] народа на процветающее, демократическое общество, но и надежды его соседей. Если мы не будем действовать сейчас, мы вполне можем опоздать и увидеть, как рухнет первый домино, оставляя на своем пути еще больше неудавшихся социальных экспериментов. Сколько еще должно погибнуть, прежде чем мы вмешаемся?\n\nУгроза подрывной деятельности, подрывающая нашу демократию, подпитываемая [From.GetAdjective] амбициями, в последнее время стала горячо обсуждаемой темой. В то время как представители оппозиции назвали это красным страхом, направленным на ведение войны с [From.GetName], риторика [Root.GetRulingParty] до сих пор имеет большой успех."
 war_justification.11.a:0 "Они следуют жестокой идеологии, какой реакции они могут ожидать, кроме как жестокости?"
 war_justification.12.t:0 "[Root.GetLeader] противостоит [From.GetAdjective] фашизму"
 war_justification.12.d:0 "В современной истории, да, пожалуй, и во всей истории не было более ужасной тирании, чем железные тиски, в которых держит [From.GetRulingParty] [From.GetName]. Некоторые могут утверждать, что нам не стоит провоцировать конфликт, что мы должны доверять [From.GetLeader] и тому, что он в будущем будет выполнять договоры и обещания, но эти люди не понимают, что договоры, заключенные при фашистском режиме, бесполезны. Для этих бесчестных лжецов право – это сила, и соглашение, изложенное на бумаге, сгорает так же легко, как и книги их критиков.\n\n[Root.GetLeader] решительно возражает против тех, кто давно надеялся избежать прямого столкновения с [From.GetName], заявляя, что, выражаясь словами Макиавелли, мы всего лишь откладываем войну на радость врагу. И так будет продолжаться до тех пор, пока мы сами не нанесем первый удар."
 war_justification.12.a:0 "Покуда они живы, наш мир обречен."
 war_justification.13.t:0 "[Root.GetLeader] объявляет войну [From.GetName]"
 war_justification.13.d:0 "Хотя мы и являемся миролюбивым народом, наше существование само по себе не определяет путь, который мы должны выбрать в истории. Это время войны. Слишком долго [From.GetAdjective] владели средствами, которые нам необходимы, чтобы пройти через испытания, с которыми мы можем столкнуться, и очевидно, что они не расстанутся с ними мирно. Несмотря на все наши усилия по построению современного государства, некоторые вопросы могут быть решены только с помощью старых испытаний битвы.\n\nВраждебная риторика [Root.GetLeader] по отношению к [From.GetName] зашла слишком далеко, чтобы оправдать вторжение. Часть населения поддерживает этот курс, но решение лежит на землях нашего лидера."
 war_justification.13.a:0 "Это может быть трудным решением, но мы должны его поддержать."
 war_justification.14.t:0 "[Root.GetLeader] оспаривает притязания [From.GetAdjective]"
 war_justification.14.d:0 "[From.GetName] могут считать себя более современными и передовыми, чем мы, но правда в том, что их нация не прошла испытаний, как наша, и они не готовы к угрозам, которые теперь четко видны на горизонте. Своим презрением к нам и отказом передать то, что по праву принадлежит нам, они сделали нас одной из таких угроз для себя. Их слабый и разделенный народ вряд ли будет сопротивляться нашим требованиям.\n\nНасмешливое мнение о [From.GetName], давно высказываемое [Root.GetRulingParty], переросло из критики в неприязнь. Хотя распространено мнение, что [From.GetAdjective] народ хочет избежать войны, [Root.GetLeader] утверждает, что их выборные лидеры спровоцировали ее своим высокомерием."
 war_justification.14.a:0 "Они не знают, насколько сильными нас сделали наши трудности."
 war_justification.15.t:0 "[Root.GetLeader] хочет восстановить порядок в [From.GetName]"
 war_justification.15.d:0 "Национальный дух [Root.GetAdjective] силён, но не все нации столь же удачливы. Традиции [From.GetName] были уничтожены, а законные правители давно убиты и погребены во имя идеи великой марксистской революции. Наш долг — восстановить порядок в этом мире, заведённом в тупик кровожадными узурпаторами, и противопоставить угрозе силу [Root.GetName].\n\nХотя [Root.GetRulingParty] всегда выступала против коммунизма, [From.GetName] стала объектом особых нападок в последних выступлениях. Неважно, является ли атака коммунистов на [Root.GetAdjective] нацию реальной угрозой, превентивная атака на [From.GetAdjective] коммунизм уже готовится."
 war_justification.15.a:0 "Убитые в ходе революции будут отомщены!"
 war_justification.16.t:0 "[Root.GetLeader] осуждает [From.GetAdjective] угнетателей"
 war_justification.16.d:0 "Мои противники заставляют вас поверить, что мое правление похоже на правление [From.GetRulingParty] в [From.GetName]. Они не могут быть более неправы. В то время как успехи [From.GetLeader] являются результатом недавней моды, деструктивного массового движения, направленного на то, чтобы заставить другие народы подчиниться, [Root.GetRulingParty] противостоит этому движению как те, кто не подчинятся. Я готов сделать все необходимое, чтобы устранить эту угрозу, даже если это означает войну.\n\nРежим [Root.GetLeader] принял враждебную политику по отношению к [From.GetAdjective] нации. Кем бы ни были наши лидеры, фашист — это слово, зарезервированное для наших врагов."
 war_justification.16.a:0 "Традиции и прагматизм всегда восторжествуют над фанатизмом и террором."
 war_justification.17.t:0 "[Root.GetLeader] Вопросы [From.GetAdjective] Суверенитета"
 war_justification.17.d:0 "Кто определяет границы государства и как они определяются? Независимо от того, каким образом люди в прошлом могли бы оправдать, где заканчивается [Root.GetName] и начинается [From.GetName], мы живем в новой эре. Стратегическое значение этой границы невозможно переоценить, и мы в полной мере имеем право изменить ее, чтобы обеспечить постоянную безопасность нашего народа.\n\nСудя по недавним речам [Root.GetLeader], вторжение в [From.GetName] представляется неизбежным. Голоса инакомыслящих возражали, но общественная поддержка войны растет."
 war_justification.17.a:0 "Мы должны сплотиться вокруг этой цели!"
 war_justification.18.t:0 "[Root.GetLeader] подвергает сомнению мотивы [From.GetName]"
 war_justification.18.d:0 "Нет сомнений, что [From.GetName] готовится к войне. Изменения в экономической политике ясно показывают, что [From.GetAdjective] не являются миролюбивыми людьми, а скорее ждут подходящей возможности, чтобы напасть на нас. Будем ли мы сидеть сложа руки и смотреть, как они вооружаются, пока [Root.GetName] беззащитна? Или мы обезвредим эту угрозу, прежде чем она станет нам не по силам?\\n\nЯстребы в [Root.GetRulingParty] обратили свои взоры к [From.GetName], утверждая, что нападение - лучшая защита. Их точка зрения набирает силу, и [Root.GetName] готовится к войне."
 war_justification.18.a:0 "По крайней мере, через войну этому конфликту придет конец."
 war_justification.19.t:0 "[Root.GetLeader] разгневан позицией [From.GetAdjective]"
 war_justification.19.d:0 "Эти наивные граждане [Root.GetName], которые представляют [From.GetAdjective] как миролюбивый народ, совершенно оторваны от реальности. Те, кто живет на нашей границе, не могут позволить себе такой роскоши, видя, как их войска приближаются к нам. Это угроза, на которую мы не можем не ответить. С каждым днем [From.GetName] готовится к войне. С нашей стороны было бы безумием не делать того же самого.\n\nВоенное присутствие [From.GetAdjective] рядом с нашей территорией вызывает все большую обеспокоенность, поскольку эта нация все больше и больше представляется как враг [Root.GetRulingParty]. Является ли это причиной или следствием их полемики, является предметом спора."
 war_justification.19.a:0 "Вне зависимости от этого, мы должны готовить людей к войне."
 war_justification.20.t:0 "[Root.GetLeader] Защищает Вторжение в [From.GetName]"
 war_justification.20.d:0 "Если мы хотим обладать стратегическим преимуществом в обозримой, если не сказать неизбежной войне с [From.GetName], нам не стоит колебаться. Речь идет о том, чтобы защитить будущее наших детей и обеспечить место [Root.GetName] в завтрашнем мире. Это вопрос преданности нашему делу и идеалам, которые мы воспринимаем как должное. Пришло время действовать.\n\nЦелая серия воодушевляющих речей от лидеров [Root.GetRulingParty], самых известных - [Root.GetLeader], призывала народ поддержать вторжение в [From.GetName]. Геополитические мотивы вторжения в риторике уступают место патриотическим настроениям, но эта кампания представляется весьма эффективной в убеждении общественности в ее необходимости."
 war_justification.20.a:0 "Нация поддерживает это важное решение."
 war_justification.201.t:0 "[From.GetLeader] Выступает Против [Root.GetName]"
 war_justification.201.d:1 "Принадлежит ли [Root.GetName] [Root.GetAdjective]? Зададим себе лучший вопрос: Будущее принадлежит [Root.GetAdjective] или оно принадлежит [From.GetName]?\n\nВыступление [From.GetLeader] сегодня намекнуло на то, что [From.GetName] идет по пути войны. Политическая напряженность росла в течение прошлого месяца и кажется, что народ [From.GetAdjective] принял тот факт, что война неизбежна. [Root.GetName] должен также подготовиться."
 war_justification.201.a:0 "Почему нам не дают жить в мире?"
 war_justification.202.t:0 "[From.GetLeader] осуждает [Root.GetAdjective] идеалы"
 war_justification.202.d:0 "[Root.GetAdjective] заявляют, что у них есть свобода и демократия, заявляют, что хотят мира, но все эти вещи, которыми они так гордятся, пусты. Их демократия разделяет людей, когда она должна их объединять, а их свобода только выдает недостаток дисциплины. Мы, [From.GetAdjective], видим сквозь эту ложь ... и мы видим, что этот мир, мир на их условиях, тоже является ложью.\n\n[From.GetRulingParty] уже давно высмеивает слабость [Root.GetAdjective] нации, но в последнее время риторика стала более агрессивной. День вооруженного конфликта приближается."
 war_justification.202.a:0 "Чего и следовало ожидать от фашисткой сволочи вроде [From.GetLeader]."
 war_justification.203.t:0 "[From.GetLeader] предостерегает от [Root.GetAdjective] коммунизма"
 war_justification.203.d:0 "Есть ли большая угроза нашему образу жизни, или самому образу жизни, чем коммунизм? Эта чума грозит заставить рабов, а не хозяев, править каждой нацией, упразднить саму нацию, упразднить людей и их историю. Мы завоюем [From.GetName] и искореним коммунистическую чуму.\n\nНенависть [From.GetLeader] к коммунистам была хорошо известна еще до прихода к власти [From.GetRulingParty], но в последнее время она, похоже, усилилась в конкретном случае с [Root.GetAdjective] правительством. Наша миссия по очищению Земли от марксизма может начаться там."
 war_justification.203.a:0 "Если они боятся нашего дела, значит они боятся своего собственного народа."
 war_justification.204.t:0 "[From.GetName] готовится к Великой борьбе"
 war_justification.204.d:0 "[Root.GetAdjective] — народ, который не сдаст власть без боя. Тем не менее, они должны понимать, что траектории развития наших двух стран могут привести лишь к столкновению. Мы должны быть готовы к предстоящей борьбе. [Root.GetName] не сдастся без боя.\n\nВозможность взаимопонимания между схожими правительствами [Root.GetName] и [From.GetName] уступила место кампании по силовому захвату их территории."
 war_justification.204.a:0 "Пусть приходят!"
 war_justification.205.t:0 "[From.GetLeader] Несёт революцию в [Root.GetName]"
 war_justification.205.d:0 "В то время как в [From.GetName] мы установили социалистическое общество, многие страны всё ещё страдают под гнётом деспотов старого мира. Трудящиеся [Root.GetName] не имеют голоса, не имеют возможности объединяться, а любые попытки установить социализм будут жестоко подавляться режимом [Root.GetLeader]. Мы не можем ждать, когда колёса мировой революции сделают круг для [Root.GetAdjective] народа. Мы доказали, что можем разгромить угнетателей-капиталистов здесь, и мы также разгромим угнетателей в [Root.Capital.GetName]!\n\n[From.GetLeader] оставил все попытки диалога с нашим правительством. Коммунистическая задача по ликвидации всех границ теперь сфокусирована исключительно на ликвидации наших границ."
 war_justification.205.a:0 "[Root.GetLeader] - лучший правитель, чем какой-то революционер-оппортунист!"
 war_justification.206.t:0 "[From.GetLeader] призывает на помощь [Root.GetAdjective] рабочим"
 war_justification.206.d:0 "Разве есть ложь хуже, чем мнимая свобода [Root.GetAdjective] народа? Раньше они трудились под началом принцев и герцогов, которые объявляли себя собственниками земли, а теперь они вынуждены продавать свой труд тем, кто называет себя владельцем заводов. Их свобода выбирать одного хозяина вместо другого вряд ли может считаться свободой. И их свобода выбирать своих лидеров - такой же миф, потому что пропаганда никогда не позволит настоящим социалистам прийти к власти. Люди, подвергшиеся такой основательной индоктринации, могут спастись только благодаря [From.GetAdjective] вмешательству.\n\nНе желая признавать, что нашему народу может быть хорошо без их социальных экспериментов, коммунистический режим в [From.GetName] открыто пригрозил напасть на нашу страну. Есть основания полагать, что этот конфликт не удастся разрешить мирным путем."
 war_justification.206.a:0 "Каких достоинств могут быть их убеждения, если они навязываются нам?"
 war_justification.207.t:0 "[Root.GetAdjective] коммунизм терпит крах"
 war_justification.207.d:0 "Товарищи, хоть величайших революционеров когда-то называли предателями, стало очевидно, что предали саму революцию. Иначе как объяснить правление [Root.GetRulingParty] в [Root.GetName], которое отбросило даже намёк на марксистские идеи и построило извращённое рабочее государство, где оно может править на ложных основаниях? Ради укрепления своей собственной власти в ущерб международной революции они показали, что им плевать на идеалы, которые они якобы разделяют. Мы должны принести им истинную революцию."
 war_justification.207.a:0 "Они не понимают, что значит революция для [Root.GetAdjective] народа."
 war_justification.208.t:0 "[From.GetLeader] призывает раздавить [Root.GetAdjective] национализм"
 war_justification.208.d:0 "Есть ли общество более отвратительное для будущего революции, более чуждое положению рабочего, чем фашистский режим [Root.GetName]? Призывая людей фанатично посвящать себя дряхлеющему институту национального государства, они облекли древние пути дикости в современный костюм, пытаясь представить себя альтернативным будущим неизбежной интернациональной победе рабочего класса. Это лишь вопрос времени, когда они нападут на нас или наших союзников. Давайте ударим первыми.\n\nНикто не ожидал меньшего, чем взаимное презрение между нами и [Root.GetAdjective], но последнее время враждебность усилилась. Слушая выступление [From.GetLeader], кажется, что конфликт возникнет скорее рано, чем поздно."
 war_justification.208.a:0 "Смерть коммунистам!"
 war_justification.209.t:0 "Дипломатия с [Root.GetName] терпит крах"
 war_justification.209.d:0 "Несмотря на наши попытки найти дипломатическое решение конфликта с [Root.GetName], переговоры снова сорвались, оставив нам ограниченный выбор. Авторитарный режим [Root.GetLeader] продемонстрировал неразумный подход к этому вопросу, характерный для лидеров, не подотчетных своему народу. Если политика руководства [Root.GetAdjective] не изменится полностью, нам не останется ничего другого, кроме как воевать.\n\n[From.GetAdjective] вмешательство во внутренние дела стало острой проблемой, и некоторые оппозиционные политики утверждают, что [From.GetRulingParty] с самого начала проводила агрессивную политику. Какой бы ни был их первоначальный замысел, будущая война теперь кажется вполне реальной и неизбежной."
 war_justification.209.a:0 "Их снисходительная риторика нас не запугает."
 war_justification.210.t:0 "[From.GetLeader] призывает к вмешательству в [Root.GetName]"
 war_justification.210.d:0 "С тяжелым сердцем мы должны признать реальность нашей ситуации: вторжение в [Root.GetName] может стать нашим единственным выходом. Учитывая сложившиеся обстоятельства, попытки найти иные решения были бы проявлением тактической близорукости. Хотя мы искренне верим, что ни [From.GetAdjective], ни [Root.GetAdjective] народ не желают войны, история привела нас к этой точке, и у нас больше нет выбора. Мы можем только надеяться, что это проявление нашей военной мощи позволит нам избежать дальнейшего кровопролития в будущем.\n\nНесмотря на распространенное мнение о том, что демократии не воюют с другими демократиями, недавние события указывают на возможность [From.GetAdjective] вторжения в [Root.GetName] в будущем. Возможно, нас еще ждут исторические сюрпризы."
 war_justification.210.a:0 "[From.GetName] и так является сомнительной демократией, поскольку ее политика носит столь агрессивный характер."
 war_justification.211.t:0 "[From.GetLeader] выступает против красной угрозы"
 war_justification.211.d:0 "Без сомнения, коммунизм [Root.GetName] является одной из величайших угроз свободе и порядку в эту эпоху. Беспощадный и безжалостный, он угрожает поглотить не только надежду [Root.GetAdjective] народа на процветающее, демократическое общество, но и его соседей. Если мы не будем действовать сейчас, то вполне можем увидеть, как эта первая костяшка домино падает слишком поздно, оставляя на своем пути больше неудачных социальных экспериментов. Сколько еще должно погибнуть, прежде чем мы вмешаемся?\n\nСтановящееся движение рабочих запугало лидеров [From.GetAdjective]. Хотя их оппозиция назвала это красной угрозой, направленной на развязывание войны с нами, риторика [From.GetRulingParty] пока весьма успешна."
 war_justification.211.a:0 "Пока можно получить прибыль, капиталисты будут изготавливать войну."
 war_justification.212.t:0 "[From.GetLeader] противостоит фашизму [Root.GetAdjective]"
 war_justification.212.d:0 "В новейшей истории, а может и во всей истории, не было худшей тирании, чем железная хватка, в которой [Root.GetRulingParty] держит [Root.GetName]. Люди могут говорить, что мы не должны развязывать конфликты, что нам следует доверять [Root.GetLeader] в том, что он будет выполнять договоры и обещания в будущем, но эти люди не понимают, что договоры, заключённые во времена фашизма, бесполезны. Для этих бесчестных лжецов, право — это сила, а бумага, на которой написано соглашение, сгорает так же легко, как и книги их недоброжелателей.\n\nЗавидуя тому славному обществу, которое мы строим, и тому наследию, на котором оно основано, [From.GetAdjective] готовы начать войну, чтобы уничтожить его. Вот вам и их притворство о мире."
 war_justification.212.a:0 "Неизбежно. Лучше покончить с этим."
 war_justification.213.t:0 "[From.GetLeader] Призывает к Войне против [Root.GetName]"
 war_justification.213.d:0 "Хоть мы и являемся миролюбивым народом, наша природа сама по себе не определяет наш исторический путь. Время пришло воевать. Слишком долго [Root.GetAdjective] обладали ресурсами, необходимыми нам, чтобы пройти через испытания, которые нас могут ожидать, но очевидно, что мирно они с нами ими не поделятся. Несмотря на все наши попытки построить современное государство, некоторые вопросы могут быть решены только в бою.\n\nНедавно, в одной из своих речей народу [From.GetAdjective], обострилась враждебная риторика в отношении [Root.GetName], и [From.GetLeader] приложил все усилия, чтобы оправдать вторжение. Некоторая часть населения поддерживает это решение, но последнее слово остается за их правителем."
 war_justification.213.a:0 "Они пожалеют, что сделали нас своими врагами."
 war_justification.214.t:0 "[From.GetLeader] ставит под сомнение амбиции [Root.GetAdjective]"
 war_justification.214.d:0 "[Root.GetName] могут считать себя более современными и продвинутыми, чем мы, но правда в том, что их нация не прошла проверку, как наша, и они не готовы к угрозам, которые уже видны на горизонте. Из-за их презрения к нам и воспрепятствования захвату того, что по праву принадлежит нам, они сделали нас одной из угроз для себя. Их слабая и разрозненная нация вряд ли сопротивляется нашим претензиям.\n\nПрезрительное мнение о [Root.GetName], которое долгое время поддерживала [From.GetRulingParty], переросло из критики в неприязнь. Хотя популярное мнение таково, что [Root.GetAdjective] народ хочет избежать войны, [From.GetLeader] утверждает, что наши избранные лидеры спровоцировали ее своим высокомерием."
 war_justification.214.a:0 "Голоса, призывающие к миру среди [From.GetAdjective] народа, конечно, заглушены."
 war_justification.215.t:0 "[From.GetLeader] хочет восстановить порядок в [Root.GetName]"
 war_justification.215.d:0 "«[From.GetAdjective] национальный дух силён, но не все народы так удачливы. У [Root.GetName] были уничтожены традиции, а законные правители уже давно убиты и похоронены, всё во имя идеи великой марксистской революции. Наш долг — восстановить порядок в этом мире, введённом в заблуждение кровожадными узурпаторами, и продемонстрировать силу [From.GetName] перед этой угрозой».\n\nХотя [From.GetRulingParty] всегда выступала против коммунизма, [Root.GetName] стала мишенью особых нападок в недавних речах. Опасаясь неизбежного прогресса своей страны к следующему этапу истории, нападение на [Root.GetAdjective] коммунизм уже находится в разработке."
 war_justification.215.a:0 "Уже слишком поздно, чтобы повернуть вспять тот прогресс, которого мы достигли."
 war_justification.216.t:0 "[From.GetLeader] взывает к угнетателям [Root.GetAdjective]"
 war_justification.216.d:0 "Мои противники хотят заставить вас поверить, что мое правление похоже на правление [Root.GetRulingParty] в [Root.GetName]. Они глубоко ошибаются. В то время как успехи [Root.GetLeader] являются результатом кратковременной моды, разрушительного массового движения, направленного на то, чтобы запугивать другие страны и заставить их подчиняться, [From.GetRulingParty] противостоит этому движению, как те, кто не подчинятся. Я готов сделать все, что потребуется, чтобы устранить эту угрозу, даже если это означает войну.\n\nРежим [From.GetLeader] проводит враждебную политику в отношении государства [Root.GetAdjective]. Наши дальновидные планы относительно будущего величия опозорили их страну, и неудивительно, что они чувствуют угрозу."
 war_justification.216.a:0 "Если они захотят испытать нашу мощь, они об этом пожалеют."
 war_justification.217.t:0 "[From.GetLeader] ставит под сомнение суверенитет [Root.GetAdjective]"
 war_justification.217.d:0 "Кто определяет границы государства и как они определяются? Какой бы способ люди ни нашли в прошлом, чтобы обосновать, где заканчивается [From.GetName] и начинается [Root.GetName], мы живем в новую эпоху. Стратегическую важность этой границы невозможно переоценить, и мы имеем полное право изменить ее, чтобы обеспечить постоянную безопасность нашего народа.\n\nСудя по недавним речам [From.GetLeader], вторжение в [Root.GetName] кажется неизбежным. Несогласные возражали, но общественная поддержка войны растет."
 war_justification.217.a:0 "Ничему не научился мир после Великой войны?"
 war_justification.218.t:0 "[From.GetLeader] Усомнился в мотивах [Root.GetName]"
 war_justification.218.d:0 "Нет сомнений, что [Root.GetName] готовится к войне. Изменения в экономической политике ясно показывают, что [Root.GetAdjective] не являются миролюбивым народом, а скорее выжидают нужного момента, чтобы нанести по нам удар. Будем ли мы сидеть сложа руки и наблюдать, как они вооружаются, пока [From.GetName] беззащитна? Или мы обезвредим эту угрозу, пока она не вышла из-под нашего контроля?\n\nЯстребы в [From.GetRulingParty] обратили свой взор на [Root.GetName], утверждая, что нападение — лучшая защита. Их точка зрения набирает силу, и [From.GetName] готовится к войне."
 war_justification.218.a:0 "Вот именно поэтому мы должны быть готовы."
 war_justification.219.t:0 "[From.GetLeader] Разозлен позерством [Root.GetAdjective]"
 war_justification.219.d:0 "\"Те наивные граждане [From.GetName], которые представляют [Root.GetAdjective] как народ мира, совершенно оторваны от реальности. Те, кто живет на нашей границе, не могут позволить себе такой роскоши, поскольку видят, как их войска приближаются к нам прямо за ней. Это угроза, на которую мы не можем не ответить. С каждым днем [Root.GetName] готовится к войне. Было бы безумием с нашей стороны не делать то же самое.\"\n\nНаше военное присутствие рядом с территорией [From.GetAdjective] вызвало повышенную обеспокоенность, поскольку они интерпретируют наши передвижения войск как доказательство враждебных намерений. Они вряд ли думают о том, что их агрессивная риторика является причиной наших оборонительных мер."
 war_justification.219.a:0 "Мы вряд ли разоружимся после этих угроз."
 war_justification.220.t:0 "[From.GetLeader] выступает за вторжение в [Root.GetName]"
 war_justification.220.d:0 "Если мы хотим иметь стратегическое преимущество в обозримом будущем, не говоря уже о неизбежной войне с [Root.GetName], нельзя медлить. Речь идет о защите будущего наших детей и о том, чтобы обеспечить [From.GetName] место в завтрашнем мире. Это вопрос преданности нашему делу и идеалам, которые мы принимаем как должное. Пора действовать.\n\nЦелая серия зажигательных речей от лидеров [From.GetRulingParty], в первую очередь [From.GetLeader], призывает общественность поддержать вторжение в [Root.GetName]. Геополитические мотивы, лежащие в основе вторжения, менее заметны в риторике, чем патриотические настроения, но эта кампания, по-видимому, весьма эффективна в том, чтобы убедить общественность в ее необходимости."
 war_justification.220.a:0 "Лучше подготовиться. Война придет."
 war_justification.301.t:0 "[Root.GetLeader] критикуют за слабую внешнюю политику"
 war_justification.301.d:0 "У нас был шанс нанести удар по нашим врагам, но [Root.GetRulingParty] позволили этому пройти мимо. Это не только еще один позорный случай в цепочке упущенных возможностей для укрепления позиций [Root.GetName] на международном уровне, но и признак того, что их заявления о том, что они действуют в интересах [Root.GetAdjective] народа, по большей части пустая риторика. Настало время для изменения политики.\n\nНаше нежелание начать войну, которую многие ожидали, стало объектом резкой критики со стороны наших политических оппонентов. Невыполнение наших военных планов затруднит для нас возможность убедить людей в том, в каком направлении мы ведем [Root.GetName]."
 war_justification.301.a:0 "Разве они не хотят избежать войны?"
 war_justification.301.b:0 "Нет места для публичного несогласия вне партийных собраний."
 war_justification.301.c:0 "Мы не можем позволить людям обвинять [Root.GetLeader] в трусости!"
 nuke_dropped.1.t:0 "Атомная бомбардировка [From.From.GetName]"
 nuke_dropped.1.d:0 "Впервые, и, как хочется надеяться, в последний раз, в рамках международного военного конфликта атомная бомба была взорвана в [From.From.GetName]. Неслыханные разрушения говорят о страшной силе нового оружия, которое внушает страх не только из-за своих разрушительных возможностей для целей, но и из-за тех последствий, которые оно может иметь для использовавших его и для всего человечества.\n\nМир замер в ожидании, что будет дальше. Принудит ли этот удар [From.From.Owner.GetName] сдаться, чтобы избежать дальнейшего террора, или он только укрепит их решимость дать отпор тем, кто осмелится прибегнуть к таким мерам?"
 nuke_dropped.1.a:0 "Поистине наступила эпоха атомных бомбардировок."
 nuke_dropped.1.b:0 "Мы сделаем все возможное, чтобы защитить народ [Root.GetAdjective]."
 nuke_dropped.2.t:0 "Атомная бомбардировка Хиросимы"
 nuke_dropped.2.d:0 ""Улицы были похожи на сцены из ада."\n - Куниёси Айкава\n\nСегодня на высоте 580 метров над городом Хиросима была взорвана атомная бомба. Мгновенно были уничтожены более двух третей города. Несмотря на то, что город был построен так, чтобы противостоять землетрясениям, после взрыва выстояло только несколько прочных строений.\n\nВ то время как ужасающая сила атомной бомбы усиленно муссировалась в сознании людей, людские жертвы, которые она принесла, были умалены. Ни одна из сторон не желает думать об ужасе этого события, но его наследием останутся жизни, оборвавшиеся в мгновение ока, и продолжающиеся выбросы."
 nuke_dropped.2.a:0 "Сколько еще падет, прежде чем эта война закончится?"
 nuke_dropped.2.b:0 "Мы должны действовать быстро, чтобы помочь жертвам."
 nuke_dropped.3.t:0 "Атомная бомбардировка Нагасаки"
 nuke_dropped.3.d:0 "Сегодня над Нагасаки была взорвана атомная бомба, изначально предназначенная для Кокуры. Погодные условия заставили самолеты отклониться от своей миссии, а сочетание дыма, облаков и технических проблем стало решающим фактором в событии, которое может изменить историю.\n\nПоследствия бомбардировки несколько смягчились из-за расположения города в долине, но ущерб все еще очень велик. Были поражены некоторые военные объекты, но катастрофические потери среди гражданского населения намного превышают их. Могут пройти десятилетия, прежде чем мы с уверенностью узнаем о долгосрочных последствиях этого оружия."
 nuke_dropped.3.a:0 "Приведет ли это к капитуляции [From.From.Owner.GetAdjective]?"
 nuke_dropped.3.b:0 "Мы надеялись, что Нагасаки будет пощажен."
 nuke_dropped.4.t:0 "Атомная бомбардировка Берлина"
 nuke_dropped.4.d:0 "Сегодня, в [GetDateText], в немецкой столице Берлине произошел ядерный взрыв. Город подвергся нескольким нападениям, в этой и в прошлой войне, но все они меркнут в сравнении с этим. С момента Тридцатилетней войны Берлин не видел подобных разрушений, а учитывая рост города, это казалось невозможным.\n\nФюрербункер, как видится, частично уцелел, по крайней мере, из-за того, что бомба взорвалась в стороне от запланированного эпицентра. По слухам, [From.From.Owner.GetLeader] еще жив, хотя и в ярости. Как следует эвакуировать [From.From.Owner.GetAdjective] лидеров и можно ли их защитить от радиоактивных осадков — это отдельный вопрос."
 nuke_dropped.4.a:0 "Сегодня я благодарен за то, что не являюсь жителем Берлина."
 nuke_dropped.4.b:0 "Наши враги нанесли удар в самое сердце страны!"
 nuke_dropped.5.t:0 "Атомная бомбардировка Лондона"
 nuke_dropped.5.d:0 "Сегодня ядерный взрыв опустошил город Лондон. Несмотря на противовоздушную оборону города, [From.From.Owner.GetNameDef] не был готов к этой атаке. В [GetDateText] Биг-Бен прозвонил в последний раз, расплавившись от взрыва. Предварительные данные показывают, что Букингемский дворец был полностью разрушен, а местонахождение королевской семьи в настоящее время неизвестно.\n\nТем не менее, [From.From.Owner.GetLeader] подтверждено выжил и готовит сегодня позднее вечером воодушевляющую речь по радио. В то время как мораль находится на самом низком уровне, британский народ остро нуждается в этом - или в очень красноречивой капитуляции."
 nuke_dropped.5.a:0 "Трудно сохранять самообладание перед лицом ядерного взрыва."
 nuke_dropped.5.b:0 "Боже, храни короля!"
 nuke_dropped.6.t:0 "Атомная бомбардировка Киото"
 nuke_dropped.6.d:0 "Сегодня на город Киото, крупный [From.From.Owner.GetAdjective] промышленный центр, была сброшена атомная бомба. Предполагается, что город был выбран в качестве цели, потому что он считался интеллектуальным центром.\n\nКрасота и историческое значение Киото заставили многих предположить, что он будет избавлен от бомбы, но, похоже, ужас от обрушения разрушений на такое место, скорее, рассматривался как преимущество, увеличивая психологическое воздействие атаки. Расположение города в долине несколько ограничило взрыв, но старый императорский дворец и многие промышленные здания были полностью разрушены."
 nuke_dropped.6.a:0 "В такой войне нет места ни красоте, ни великолепию."
 nuke_dropped.6.b:0 "Если они разрушат старое, мы построим новое."
 nuke_dropped.7.t:0 "Атомная бомбардировка Токио"
 nuke_dropped.7.d:0 "Сегодня произошла ядерная атака в самом сердце Японской империи. Предполагалось, что целью бомбардировки станет столица Токио, но вряд ли кто-то мог подумать, что новая бомба будет сброшена именно сюда. Но в результате еще более разрушительный удар пришелся на город, возможно, из-за значимости его в качестве новой столицы и из-за того, что был уничтожен Императорский дворец.\n\nПо сообщениям, [From.From.Owner.GetLeader] удалось выжить, но этот инцидент породил вопросы о том, на что готовы пойти враги Японии. Что может остановить войну, если не это? Чем можно еще угрожать?"
 nuke_dropped.7.a:0 "Неужели это конец Японской империи?"
 nuke_dropped.7.b:0 "Пока жив [From.From.Owner.GetLeader], будет существовать и Империя."
 nuke_dropped.8.t:0 "Атомная бомбардировка Вашингтона"
 nuke_dropped.8.d:0 "Сегодня над столицей Соединенных Штатов была взорвана атомная бомба. Очевидно, в ходе атаки на политический центр и историческое наследие США были уничтожены Белый дом, Капитолий и несколько памятников и мемориалов. Даже сожжение Вашингтона более века назад меркнет по сравнению с разрушениями, причиненными городу этим разрушительным оружием.\n\nХотя президенту [From.From.Owner.GetLeader] удалось спастись, нация была потрясена до глубины души. Несомненно, США надеялись быть первой и единственной страной, которая использует такое оружие. Теперь эти надежды были разбиты наихудшим образом."
 nuke_dropped.8.a:0 "Одна страна, неделимая, против одного атома, делимого."
 nuke_dropped.8.b:0 "Орел поднимется из пепла, как феникс."
 nuke_dropped.9.t:0 "Атомная бомбардировка Рима"
 nuke_dropped.9.d:0 "Ядерный взрыв потряс сегодня Рим, ошеломив людей во всем мире. В связи с историческими и художественными ценностями, многие не думали, что старинный город станет целью столь беспринципного уничтожения. С частичным уничтожением Ватикана и неизвестным местонахождением Папы, событие ужаснуло не только итальянцев, но и католиков по всему миру.\n\nБыстрый рост Рима за последнее десятилетие был почти полностью уничтожен этим нападением. Какое-то время казалось, что город сможет помочь стране оправиться от войны. Эти надежды теперь обратились в пыль, вместе со многими людьми."
 nuke_dropped.9.a:0 "Бомба брошена!"
 nuke_dropped.9.b:0 "Рим не перестроят за один день..."
 nuke_dropped.10.t:0 "Атомная бомбардировка Парижа"
 nuke_dropped.10.d:0 "Сегодня ядерное устройство было взорвано над городом Париж, что привело к широкомасштабным разрушениям и бесчисленным жертвам. Франция была в шоке, так как ее столица пострадала от, возможно, самой разрушительной атаки, которую она когда-либо переживала, несмотря на столетия войн и революций. Парижане, возможно, ожидали завоевания, но не полного, жестокого опустошения.\n\nКажется маловероятным, что какие-либо победные парады на Елисейских Полях мимо остатков Триумфальной арки состоятся в нынешнем состоянии города. Возможно, в ближайшие десятилетия мы увидим рождение нового Парижа, но Париж в сознании общественности, город, построенный в Прекрасную эпоху, ушел навсегда."
 nuke_dropped.10.a:0 "Город света поглощён огнём."
 nuke_dropped.10.b:0 "Ещё вчера казалось, что Париж будет с нами всегда."
 nuke_dropped.11.t:0 "Атомная бомбардировка Москвы"
 nuke_dropped.11.d:0 "Город, который многие безуспешно пытались завоевать, Москва сегодня стала целью ядерной атаки. Взрыв был направлен в самое сердце [From.From.Owner.GetAdjective] руководства. Кремль был почти полностью разрушен взрывом.\n\n[From.From.Owner.GetLeader], который недавно стал более осведомлённым и боящимся всех возможных и невозможных угроз, вовремя эвакуировался и выжил. Однако даже обширность [From.From.Owner.GetName] может быть недостаточной, чтобы избежать такого безжалостного врага. В самом деле, если это продолжится, скоро в стране останется только два типа пустошей: те, которые были там с самого начала, и те, которые создали её враги."
 nuke_dropped.11.a:0 "Разве ядерная зима не сделает Москву лишь более трудной целью?"
 nuke_dropped.11.b:0 "Они могут сжечь все наши города, но они никогда не возьмут их."
 nuke_dropped.12.t:0 "Атомная бомбардировка Копенгагена"
 nuke_dropped.12.d:0 "Сегодня город Копенгаген подвергся ядерному удару. Столица, выросшая после того, как ей удалось избежать разрушения во время Великой войны благодаря нейтралитету Дании, с наполеоновских войн не испытывала столь разрушительных атак. В близлежащем районе Эресунн также наблюдались значительные осадки, и выжившие в страхе перед дальнейшими нападениями начали бежать на Фюн и материк. В настоящее время местонахождение короля Кристиана X неизвестно, а моральный дух нации серьезно пострадал после атаки. Остается выяснить, является ли это началом конца одной из старейших наций Европы."
 nuke_dropped.12.a:0 "Что-то подверглось радиоактивному облучению в Дании."
 nuke_dropped.12.b:0 "Город уже горел раньше, но не погибал."
 nuke_dropped.12.c:0 "Мы поставим датчан на колени с помощью плутония!"
 nuke_dropped.13.t:0 "Атомная бомбардировка Стокгольма"
 nuke_dropped.13.d:0 "Сегодня прекрасный город Стокгольм, гордая Венеция Севера, подверглась ядерной бомбардировке. Несмотря на все усилия шведов оставаться нейтральными в прошлом, они заплатили ужасную цену за международный конфликт. Эпицентр взрыва был в самом центре юга Стокгольма, в районе, предназначенном для будущих застроек и грандиозных строительных проектов, которые теперь были непоправимо уничтожены.\n\nБольшая часть города была неузнаваемой, но старые сооружения на шлюзе Slussen, похоже, перенесли взрыв лучше, чем ожидалось. Было решено оставить это нетронутым как памятник стойкости города."
 nuke_dropped.13.a:0 "Теперь шведский нейтралитет будет лишь воспоминанием."
 nuke_dropped.13.b:0 "Шведский тигр не потеряет своей сущности!"
 soviet.30.t:0 "Требовать Бессарабию"
 soviet.30.d:0 "Румыния не может противостоять могуществу Красной Армии, если мы пошлем им требование о нашей законно претендуемой земле в Бессарабии, они могут просто передать ее без боя."
 soviet.30.a:0 "Послать ультиматум!"
 soviet.30.b:0 "Нет, мы заплатим железную цену!"
 soviet.31.t:0 "Требовать Карелию"
 soviet.31.d:0 "Финляндия не может противостоять могуществу Красной Армии, если мы пошлем им требование о нашей законно претендуемой земле в Карелии, они могут просто передать ее без боя."
 soviet.31.a:0 "Послать ультиматум!"
 soviet.31.b:0 "Нет, мы заплатим железную цену!"
 soviet.32.t:0 "Подавить Эстонию"
 soviet.32.d:0 "Эстония не сможет противостоять мощи Красной Армии. Если мы выдвинем им ультиматум о праве размещения наших войск и контроле над их пограничной безопасностью, мы сможем эффективно аннексировать их без боя."
 soviet.32.a:0 "Отправить ультиматум!"
 soviet.32.b:0 "Нет, мы заплатим железную цену!"
 soviet.33.t:0 "Угнетение Латвии"
 soviet.33.d:0 "Латвия не сможет противостоять мощи Красной Армии. Если мы выдвинем им ультиматум о праве размещения наших войск и контроле над их пограничной безопасностью, мы сможем эффективно аннексировать их без боя."
 soviet.33.a:0 "Отправить ультиматум!"
 soviet.33.b:0 "Нет, мы заплатим железную цену!"
 soviet.34.t:0 "Угнетение Литвы"
 soviet.34.d:0 "Литва не сможет противостоять мощи Красной Армии. Если мы выдвинем им ультиматум о праве размещения наших войск и контроле над их пограничной безопасностью, мы сможем эффективно аннексировать их без боя."
 soviet.34.a:0 "Отправить ультиматум!"
 soviet.34.b:0 "Нет, мы заплатим железную цену!"
 soviet.35.t:0 "[From.GetNameDefCap] просится войти в состав [SOV.GetNameDef]"
 soviet.35.d:0 "Недавние политические потрясения в [From.GetName] привели к тому, что правительство страны во многом разделяет нашу точку зрения. Они понимают, что сильный Советский Союз может принести пользу миру, и готовы отдать все за Родину."
 soviet.35.a:0 "Поддержать это."
 soviet.35.b:0 "Сейчас неподходящее время для подобных действий."
 soviet.35_threat_LIT:0 "Литва присоединилась к Советскому Союзу"
 soviet.35_threat_FIN:0 "Финляндия присоединилась к Советскому Союзу"
 soviet.35_threat_EST:0 "Эстония в составе Советского Союза"
 soviet.35_threat_LAT:0 "Латвия в составе Советского Союза"
 soviet.36.t:0 "[From.GetName] хочет, чтобы мы правили ей."
 soviet.36.d:0 "Недавние политические потрясения в [From.GetName] привели к тому, что правительство страны ясно осознало будущее, совпадающее с нашими планами. Они ищут нашей защиты и предлагают свою безоговорочную поддержку. Официально они продолжат существовать как независимая нация, но будут во всем следовать за Родиной."
 soviet.36.a:0 "Еще один инструмент, помогающий нам в достижении целей."
 soviet.36.b:0 "Им потребуется слишком много защиты."
 soviet.36_threat_LIT:0 "Литва — марионетка Советского Союза"
 soviet.36_threat_FIN:0 "Финляндия — марионетка Советского Союза"
 soviet.36_threat_EST:0 "Эстония — марионетка Советского Союза"
 soviet.36_threat_LAT:0 "Латвия — марионетка Советского Союза"
 soviet.37.t:0 "Талантливые новые офицеры."
 soviet.37.d:1 "Наши новые офицеры справляются с задачей и быстро адаптируются к новым ролям в высшем военном командовании. С лояльным офицерским корпусом во главе нашей армии чистка, осуществленная [Root.GetLeader], похоже, принесла некоторые из ожидаемых нами результатов. Красная армия восстанавливает свою мощь и вскоре станет сильнее, чем когда-либо."
 soviet.37.a:0 "Отлично."
 soviet.37.a_tt:0 "Уменьшает штраф от §YОчистка офицеров§!"
 soviet.46.t:0 "Великая Отечественная война"
 soviet.46.d:0 "Хотя нам ещё предстоит проделать немало работы по восстановлению нашего военного верховного командования, наступление [From.GetAdjective] армии на наших границах вызвало у нашего нового офицерского корпуса изобретательность и патриотическую волю к борьбе. С каждым нанесенным нам ударом мы становимся сильнее, готовясь подняться и нанести ответный удар всей мощью [Prev.GetName]. Каждый солдат готов отдать свою жизнь и выстоять перед нашими врагами. Мы ожидаем, что это принесёт большую пользу обучению и преданности наших новых офицеров даже после того, как эта война будет выиграна!"
 soviet.46.a:0 "За славу [Root.GetName]"
 soviet.46.a_tt:0 "Добавляет §YВеликую Отечественную войну§!, что компенсирует часть штрафов от §YОчистки офицерского состава§!"
 soviet.48.t:0 "Перманентная революция"
 soviet.48.d:0 "Хотя за последние годы в качестве предателей и контрреволюционеров казнили и заключили в тюрьму бесчисленное множество людей, ответственные должности в значительной степени оставались в безопасности. Однако их не избавили от подозрения. Создание Четвёртого интернационала, по-видимому, внушило Сталину мысль, что самые близкие к нему люди никогда не были на его стороне. Желавшие обрести его доверие лишь подлили масла в огонь, пытаясь предстать в выгодном свете.\n\nТекущая ситуация — исключительная ирония: недоверие в нынешней администрации сделало её неустойчивой, и теперь неизбежен переворот. Некоторые члены партии утверждают, что, вновь пригласив Троцкого и обратив чистки против сталинистов, можно свести к минимуму ущерб от грядущей гражданской войны. Может ли этот план, который долгие годы был величайшим страхом генерального секретаря, быть по-настоящему воплощён в жизнь?"
 soviet.48.a:0 "Немыслимо!"
 soviet.48.a_tt:0 "§YСкоро начнётся масштабная гражданская война§!"
 soviet.48.b:0 "Коммунизм в одной стране провалился. Нам нужен Троцкий."
 soviet.48.b_tt:0 "§YПо возвращении Троцкого начнётся незначительная гражданская война§!"
 soviet.49.t:0 "Вторая русская гражданская война"
 soviet.49.d:0 "Из-за растущей паранойи Сталина в Партии и армии возник раскол. Те, кому удалось заслужить его доверие, хотя бы временно, хотят сохранить его у власти и сохранить созданный им культ личности, но многие другие были неформально исключены из круга избранных. Некоторые из них считают, что правление Сталина провалилось, другие подозревают, что они просто ждут того дня, когда НКВД найдёт или выдумает причину для их ареста.\n\nВместе они сформировали фракцию, достаточно могущественную, чтобы бросить вызов нынешней администрации. Их заявленная цель - свергнуть тиранию Сталина и перейти от тоталитарного государства к правлению, которое будут осуществлять военные.\n\nСторонники Сталина в армии и Партии объединились для сохранения нынешнего режима, называя своих противников контрреволюционными предателями. Началась новая гражданская война."
 soviet.49.a:0 "Смерть предателям!"
 soviet.50.t:0 "Основана Русская освободительная армия"
 soviet.50.d:0 "Основание Четвёртого интернационала снова возродило страх Сталина перед предателями в партии и военном командовании. Насмотревшись на судебные процессы и казни в годы Большого террора, многие подозревают, что грядут новые. В ответ на это ряд генералов во главе с Андреем Власовым создали Комитет освобождения народов России с целью свергнуть режим Сталина, пока тот не наделал ещё больше бед.\n\nХотя объявленная долгосрочная цель — переход к демократии, точная форма её пока неясна. Ясно лишь то, что они намерены отстранить Сталина от власти и положить конец правлению большевиков."
 soviet.50.a:0 "Их нужно остановить!"
 soviet.51.t:0 "НКВД запускает переворот"
 soviet.51.d:0 "Создание Четвёртого интернационала возродило сталинский страх перед предателями в партии и военном командовании. Став свидетелями процессов и казней во время Большого террора, многие подозревают, что грядет очередной террор. НКВД, бывший важным инструментом в чистках, также остро осознало тот факт, что само ведомство является потенциальной мишенью. Вместо того, чтобы ждать ареста, казни и замены, его руководители решили нанести первый удар и начать переворот при поддержке столь же обеспокоенных военных чиновников.\n\nОднако, несмотря на свое влиятельное положение, НКВД оказалось трудно завоевать доверие военных лидеров. Переворот привел лишь к захвату части территории Союза, но теперь, когда оставшимся членам старого ведомства грозит неминуемая казнь, они вряд ли сдадутся."
 soviet.51.a:0 "Их необходимо схватить!"
 soviet.52.t:0 "Переворот выживших"
 soviet.52.d:0 "Создание Четвёртого Интернационала вновь пробудило сталинский страх перед предателями в партии и армейском командовании. Видя суды и казни времён Большого террора, многие подозревают, что он грядет вновь. Из оставшихся в живых под подозрением находятся лишь немногие, кому удалось избежать казни. Подвергнутые жестоким допросам, а в некоторых случаях и заключению, они прекрасно знают, что станут первыми жертвами новой чистки. В отчаянии эти генералы решили попытаться свергнуть режим Сталина до того, как это произойдёт.\n\nНесмотря на малую вероятность успеха, некоторым выжившим в Большом терроре удалось захватить власть в некоторых районах Союза. По крайней мере, правление Генерального секретаря было дестабилизировано."
 soviet.52.a:0 "Мы должны стабилизировать его как можно скорее."
 soviet.53.t:0 "Удачная чистка"
 soviet.53.d:1 "После основания Четвёртого Интернационала охота на сторонников Троцкого усилилась, и несколько приближённых Сталина были казнены. Оставшись совсем один, Сталин удалился в свою резиденцию. Расправившись, наконец, со всеми вероломными друзьями и членами семьи, он теперь может найти покой и полностью сосредоточиться на прославлении [SOV.GetNameDef]."
 soviet.53.a:0 "Время повесить топор на гвоздь"
 soviet.54.t:0 "Под новым руководством"
 soviet.54.d_nopurge:0 "С угасанием власти коммунистической партии стало ясно, что сталинская система неустойчива.\nВозникли новые силы, пришедшие к власти, ссылаясь на русские идеалы, чтобы вести нашу страну по новому пути.\n\nВ качестве символа этого перехода [Root.GetLeader] сместил Сталина и поместил его под домашний арест вдали от залов власти, где он разработал так много своих опасных планов.\nПо мере того как на смену разлагающемуся трупу Партии приходит новая российская система, кончается секретность, паранойя и политические интриги старого Генерального секретаря."
 soviet.54.d_purge:0 "Стало ясно, что величайшая угроза российскому государству исходит не от заговорщиков против Коммунистической партии, а от самой Партии. С разочарованием в коммунистической мечте в России новые силы захватили власть, чтобы привести нашу страну в будущее.\n\nПосле смещения Сталина [Root.GetLeader] старый Генеральный секретарь был подвергнут скорейшему суду. Его параноидальные гонения на ведьм были описаны как уничтожение руководства нации в то время, когда это было очень нужно, и Сталин был приговорен к смертной казни за измену. Старая система уходит вместе с ним в безымянную могилу."
 soviet.54.a:0 "Новый рассвет в российской политике."
 usa.14.t:0 "Фашистские сумерки"
 usa.14.d:0 "Наш великий образец для подражания, нацистская Германия, предала свои глубочайшие принципы и вступила в союз с главным врагом: коммунистами. По мере распространения этой новости за ней следуют волнения. Люди были готовы следовать за нами до сих пор из-за страха перед коммунистической революцией, но из-за предательства со стороны Германии наше великое возрождение подвергается сомнению."
 usa.14.a:0 "Возвращение к демократии."
 usa.14.b:0 "Остаться верными фашизму."
 usa.24.t:0 "[SOV.GetNameDefCap], тот вдохновитель, что убедил многих в возможности свержения капитализма, предал международную революцию и объединился с нацистской Германией. После создания социализма в одной стране и этого союза с фашистами люди начинают сомневаться в искренности коммунистических идей во всем мире. Является ли американский коммунизм просто еще одним инструментом, который использовал [Root.GetLeader] для укрепления своей власти?"
 usa.24.a:0 "Возвращение к демократии."
 usa.24.b:0 "Остаться верными коммунизму."
 usa.17.t:0 "[From.From.GetName] объявил войну [From.GetName]"
 usa.17.d:0 "Мир и так небезопасен. Можем ли мы действительно допустить войну в нашем собственном регионе или нам следует обеспечить сохранение мира? Мы можем направить [From.From.GetName] ультиматум, чтобы они заключили мир с [From.GetName] или бросить их выяснять отношения."
 usa.17.a:0 "Дать знать [From.From.GetName], что мы готовы к войне."
 usa.17.a_tt:0 "§REсли [From.From.GetName] отступит, это приведет к белому миру.§!\n"
 usa.17.b:0 "В этот раз мы не будем вмешиваться."
 usa.18.t:0 "[From.GetName] вмешивается в войну против [being_attacked.GetName]"
 usa.18.d:0 "[From.GetName] недоволен нашим конфликтом против [being_attacked.GetName]. Они угрожают нам войной, если мы не подпишем мирный договор с [being_attacked.GetName]. \nНам отступать?"
 usa.18.a:0 "Дать понять [From.GetName], что мы готовы к войне"
 usa.18.b:0 "Мы отступим"
 usa.18.b_tt:0 "[Root.GetNameWithFlag] мир с [being_attacked.GetNameWithFlag]"
 usa.19.t:0 "[From.GetNameWithFlag] получил цель марионетки (фокус) против [Root.GetName]"
 usa.20.t:0 "Влияние США"
 usa.20.d:0 "Пропаганда демократии [From.GetName] начинает влиять на нашу страну. Радиопередачи позволяют речам [From.GetLeader] доходить до нашего народа, и многие [Root.GetAdjective] начали тянуться к [From.GetAdjective] образу жизни. [Root.GetName] - не марионетка, и мы не допустим, чтобы нашу политику диктовали [From.GetName]. Однако, мы не можем отрицать влияние, которое [From.GetAdjective] политика оказывает на нашу страну"
 usa.20.a:0 "В душе мы всегда будем [Root.GetAdjective]"
 usa.20.a_tt:0 "[Root.GetNameWithFlag] получает: §YVлияние США§!"
 usa.21.d:0 "Пропаганда коммунизма в [From.GetName] начинает оказывать влияние на нашу страну. Радиопередачи позволяют [From.GetLeader] обращаться к нашему народу, а мы даже обнаружили листовки с пропагандой, призывающей [Root.GetAdjective] рабочих к организации и пропаганде [From.GetAdjective] образа жизни. [Root.GetName] — не марионетка, и мы не позволим [From.GetName] диктовать нашу политику. Тем не менее мы не можем отрицать влияния, которое политика [From.GetAdjective] оказывает на нашу страну."
 usa.22.d:0 "Пропаганда фашизма в [From.GetName] начинает оказывать влияние на нашу страну. Радиопередачи позволяют [From.GetLeader] обращаться к нашему народу, а в некоторых частях страны даже были обнаружены листовки с пропагандой, продвигающие [From.GetAdjective] образ жизни. [Root.GetName] — не марионетка, и мы не позволим [From.GetName] диктовать нашу политику. Тем не менее мы не можем отрицать влияния, которое политика [From.GetAdjective] оказывает на нашу страну."
 usa.23.t:0 "Защита США"
 usa.23.d:0 "[From.GetName] теперь намного строже применяет доктрину Монро. Помимо политического влияния, которое [From.GetName] уже имеет на нашу страну, их представители теперь заявляют, что готовы вмешаться в любой конфликт между американскими странами."
 usa.23.a:0 "Могущество [From.GetName] растет"
 usa.23.a_tt:0 "[From.GetNameWithFlag] теперь может вмешиваться в американские войны"
 britain.11.t:0 "Берлинско-московская ось"
 britain.11.d:0 "Полноценный военный союз между Германией и Советами может перевернуть мировой порядок и привести к новой эре тоталитаризма. Чтобы противостоять этому процессу, мы должны объединить демократические страны мира в Великий альянс для борьбы с нацистско-коммунистической угрозой."
 britain.11.a:0 "Поддержать демократию!"
 britain.11.b:0 "Не стоит перегибать палку."
 britain.12.t:0 "Великий альянс"
 britain.12.d:0 "Британия предлагает нам присоединиться к их фракции для борьбы с нацистско-коммунистической угрозой. Как нам ответить?"
 britain.12.a:0 "Да"
 britain.12.b:0 "Нет"
 britain.13.t:0 "Франция хочет присоединиться к Союзникам"
 britain.13.d:0 "Мир становится все более опасным. Британия и Франция остаются бастионами демократии и свободы в Европе, и Франция предлагает присоединиться к Союзникам.\nКак нам ответить?"
 britain.13.a:0 "Да"
 britain.13.b:0 "Нет"
 britain.14.t:0 "Лондонская конференция"
 britain.14.d:0 "Немецкое правительство начало волноваться о статусе Словении, которую они считают исторической немецкой провинцией Крайной, где, по их словам, словенцы и немцы подвергаются угнетению со стороны югославского правительства. Правительство Его Величества пригласило правительства Франции, Германии и Италии на конференцию в Лондоне, чтобы найти справедливое решение этой проблемы. Нет никаких сомнений, что небольшое немецкое меньшинство хочет присоединиться к Германии, но пожелания словенского населения менее ясны. Кажется, Германия готова сорваться и натравить собак войны, и темные тучи войны снова сгущаются над континентом Европа."
 britain.14.a:0 "Необходимо искать прочный мир"
 britain.14.b:0 "История не простит нам"
 britain.15.t:0 "Франция бросает нас"
 britain.15.d:0 "Правительство Франции не смогло увидеть разум в нашем предложенном скромном изменении границ и решило нарушить мир и вести ужасную войну. Мы дадим им возможность истощить себя в очередном раунде бесполезной окопной войны, а затем они будут умолять о нашей помощи."
 britain.15.a:0 "Они узнают свое место."
 britain.16.t:0 "Умирает король Георг V"
 britain.16.d:0 "Его Величество Георг V, Король Соединенного Королевства, Британских Доминионов и Император Индии, скончался. Его спокойствие и преданность своим подданным помогли Империи пережить и Великую войну, и Великую депрессию. Его сын взойдет на престол как король Эдуард VIII, но уже сейчас есть опасения, что он будет слишком независим в мыслях. Стэнли Болдуин и Невилл Чемберлен готовятся к тому, чтобы он принял руководство премьер-министра и кабинета министров."
 britain.16.a:0 "Да пребудет он в мире"
 britain.17.t:0 "Король Эдуард отрекается"
 britain.17.d:0 "Премьер-министр Болдуин совершенно ясно дал понять, что достоинство короля-императора будет задето, если он женится не просто на простолюдинке, но и на разведенной женщине, а если этого было недостаточно - на американке. После долгих душевных терзаний его величество выбрал любовь вместо долга и решил отречься от престола. Его младший брат Альберт взойдет на престол как король Георг VI. Лондонские букмекеры уже принимают ставки на то, доберется ли этот застенчивый человек до своей коронации."
 britain.17.a:0 "Боже, храни короля Георга VI"
 britain.18.t:0 "Возвращение короля"
 britain.18.d:0 "Ни для кого не секрет, что между Георгом VI и [Root.GetRulingParty] нет любви. Теперь в парламенте раздаются голоса, призывающие его к отставке в пользу его брата в изгнании, Эдварда VIII. Этот человек менее чужд идее единства через силу и обладает видением Англии. Именно таких качеств мы ищем в лидере нашей нации!"
 britain.18.a:0 "Ради Империи Эдвард VIII должен править!"
 britain.18.b:0 "Мы не будем вмешиваться в дела парламента."
 britain.19.t:0 "Учреждено Временное правительство Свободной Индии"
 britain.19.d:0 "При поддержке Японии индийские националисты сформировали правительство в изгнании — Азад Хинд.\n\nНационалисты распространяют пропаганду в Радже и подстрекают сипаев к дезертирству. Сейчас у них недостаточно поддержки, но со временем их усилия могут стать опасными."
 britain.19.a:0 "Глупая затея!"
 ENG_RAJ_azad_hind_tooltip:0 "Поддержка националистов будет продолжать расти, если ей не противопоставить обещание о грядущей независимости."
 britain.20.t:0 "Азад Хинд возглавляет индийское восстание"
 britain.20.d:0 "Азад Хинд, временное правительство Свободной Индии, распространяет пропаганду и заручается поддержкой среди населения Раджа. Несмотря на то, что сейчас как никогда важно сплотиться в рамках Империи, они решили, что это время настало для их выступления."
 britain.20.a:0 "Нет, Империя должна остаться единой!"
 britain.23.t:0 "Индийское восстание"
 britain.23.d:0 "Азад Хинд, правительство Свободной Индии в изгнании, заявило, что пришло время для всех истинных патриотов взять в руки оружие против британских господ. Судьба Индии висит на волоске, и нам следует сделать выбор."
 britain.23.a:0 "Мы будем держаться за Империю!"
 britain.23.b:0 "Мы воспользуемся этой возможностью!"
 britain.24.t:0 "Задействованы заводы, созданные по секретной схеме"
 britain.24.d:1 "Тщательная подготовка, которую мы провели по секретной схеме, чтобы облегчить переход наших гражданских заводов к полномасштабной военной промышленности, теперь окупилась. Новые заводы уже гораздо более эффективны, чем можно было разумно ожидать в рамках этих временных рамок."
 britain.24.a:0 "Какое дальновидное предвидение у нас было!"
 poland.1.t:0 "Расширение на восток"
 poland.1.d:1 "Будучи вынуждены передать Гданьск немцам, мы теперь оказались в тисках между двумя империями, угрожающими нашему суверенитету. Поскольку мы теряем территорию на западе и не можем доверять союзникам в защите от немецкой агрессии, мы можем рассмотреть возможность присоединиться к немецким амбициям и вернуть часть нашего старого Содружества, ныне поглощенного [SOV.GetNameDef]. Мы станем легкой добычей, если останемся нейтральными, и слишком долго боролись, чтобы увидеть новый раздел Польши."
 poland.1.a:0 "Пора превратить Ось из угрозы в союзника."
 poland.1.b:0 "Предпочтительнее вести дипломатические переговоры с Советами."
 poland.2.t:1 "[FROM.GetNameDefCap] требует восток"
 poland.2.d:1 "Подтвердив свои притязания на наши восточные территории, [FROM.GetNameDef] теперь оказывает на нас давление, чтобы мы уступили им эти земли, подразумевая, что это единственный способ избежать дальнейшего вторжения и возможной аннексии или раздела.\n\nОбычно столь легко уступать таким угрозам недопустимо, но [FROM.GetNameDef] - далеко не единственная наша проблема. Если мы примем их требования, у нас может стать меньше поводов для беспокойства на восточном фронте, хотя это также значительно переместит восточный фронт на запад."
 poland.2.a:0 "Уступить Восток мирным путем."
 poland.2.b:1 "[ROOT.GetName] не сдастся без боя!"
 poland.3.t:1 "[FROM.GetName] уступает Восток"
 poland.3.d:1 "После того, как мы надавили на [FROM.GetNameDef], чтобы он уступил нашим законным притязаниям на его восточные территории, они согласились уступить нам то, что мы потребовали, без дальнейших конфликтов. Однако мы, вероятно, можем отказаться от любых надежд на установление более прочных связей с этой нацией в будущем. Отдав нам должное, они, похоже, надеются, что мы будем как можно меньше контактировать."
 poland.3.a:0 "Пока они признают наши претензии, проблем нет."
 poland.4.t:1 "[FROM.GetName] отказывается уступить Восток"
 poland.4.d:1 "Несмотря на все наши усилия по мирному решению спора с [FROM.GetNameDef], они отказались уступить свои восточные территории, вынудив нас начать войну, как единственный вариант завладеть ими. Очевидно, что этой непокорной стране не избежать раздела, даже несмотря на то, что им был предоставлен шанс."
 poland.4.a:0 "Неужели они думают, что смогут противостоять нам?"
 poland.5.t:1 "[FROM.GetNameDefCap] предлагает защиту"
 poland.5.d:1 "После того, как [FROM.GetNameDef] заявил о своих правах на восточную Польшу, мы предположили, что это может привести к новой атаке. Тем не менее, недавнее предложение от [FROM.GetAdjective]s свидетельствует об обратном. По-видимому, если мы уступим им требуемые территории, они готовы позволить нам присоединиться к их альянсу. Кроме того, они обещают, что в случае войны с Германией мы получим компенсацию за потерю, получив новые земли на западе.\n\nХотя это может быть лучшее предложение, чем мы ожидали, мы не можем знать, произойдет ли когда-нибудь эта предполагаемая будущая война. Возможно, [FROM.GetNameDef] просто ищет легкий захват земли и хочет подчинить нас их сфере влияния. Тем не менее, это, вероятно, лучшая защита, на которую мы можем рассчитывать."
 poland.5.a:0 "Мы должны принять сейчас, пока не стало слишком поздно."
 poland.5.b:1 "[ROOT.GetName] ещё не потеряно!"
 poland.6.t:1 "[FROM.GetNameDefCap] принимает защиту"
 poland.6.d:1 "Предложение взять [FROM.GetNameDef] под свою опеку и подтолкнуть их к будущим завоеваниям на западе в обмен на территорию на востоке оказалось успешным подходом. Им была обещана часть Германии в случае успешной войны и наша защита, и они согласились мирно уступить свои восточные территории."
 poland.6.a:0 "Союзник против Германии гораздо предпочтительнее, чем очередной раздел."
 poland.7.t:1 "[FROM.GetNameDefCap] отказывается от защиты"
 poland.7.d:1 "Несмотря на то, что мы сделали самое щедрое предложение, какое только могли, в попытке достичь соглашения, в соответствии с которым [FROM.GetNameDef] уступила бы свои восточные территории за обещание доли Германии в будущем, [From.GetLeader] отверг наши дипломатические усилия. [FROM.GetNameDefCap] выбрал для нас тяжелый путь, но еще больше — для себя."
 poland.7.a:0 "То, что нельзя купить, нужно захватить."
 poland.8.t:1 "[POL.GetName] передана Восточная Германия"
 poland.8.d:1 "Как и было согласовано ранее, после аннексии территорий восточной Германии [SOV.GetNameDef] некоторые из них перейдут под контроль [POL.GetAdjective] в качестве компенсации за прошлую передачу восточной Польши [SOV.GetNameDef]."
 poland.8.a:0 "Переход на запад — это лучшее, на что мы могли надеяться при таких обстоятельствах."
 poland.9.a:0 "Ситуация, кажется, разрешилась к нашему обоюдному удовлетворению."
 poland.10.t:0 "[From.GetName] присоединяется к [Root.GetFactionName]!"
 poland.10.d:0 "Признавая необходимость единения перед лицом угроз, окружающих наши страны со всех сторон, [From.GetLeader] сегодня объявил миру, что [From.GetName] заключил договор с [Root.GetName] ради нашей взаимной безопасности."
 poland.10.a:0 "[Root.GetName] и [From.GetName] сегодня стоят как братья."
 poland.11.t:0 "[From.GetName] отказывается присоединяться к [Root.GetFactionName]"
 poland.11.d:0 "В глупом акте мнимого самосохранения [From.GetLeader] сегодня объявил, что [From.GetName] воздержится от любых дипломатических действий, которые можно будет расценивать как угрозу для их могущественных соседей. Таким образом, они отклонили наш запрос присоединиться к [Root.GetFactionName]."
 poland.11.a:0 "Единственная безопасность - стоять вместе."
 poland.12.t:0 "Войтек никогда не роняет ящик"
 poland.12.d:0 "Рядовой Войтек зарекомендовал себя как исключительно ценный член наших линий снабжения. Даже в разгар боя, когда стрелковое оружие задевало его голову, руки и ноги, он не уронил ни одного ящика с боеприпасами. Этот храбрый солдат обеспечил бесперебойную работу нашей артиллерии, тем самым сыграв решающую роль в разгроме врага. В результате было решено, что Войтека следует повысить в должности."
 poland.12.a:0 "Пусть его храбрость станет для всех нас источником вдохновения"
 WOJTEK_COMMANDER:0 "Войтек становится §HКомандиром Корпуса§!"
 greece.1.t:0 "Советский ультиматум"
 greece.1.d:0 "СССР оказывает на нас давление, требуя передать территорию. Они угрожают полномасштабной войной, если мы не уступим. Уступка может спасти жизни многим греческим солдатам, но будет ли это последний раз, когда они потребуют земли?"
 greece.1.a:0 "Лучшим выбором для Греции будет избежание войны."
 greece.1.b:0 "Не отдавай им ничего."
 greece.2.t:0 "Второй Люблянский арбитраж"
 greece.2.d_GER_demand:0 "Германия стремится запугать Грецию и заставить ее передать территорию для «баз»."
 greece.2.d_ITA:0 "Немцы требуют землю для своих итальянских друзей за наш счет."
 greece.2.d_BUL:0 "Немцы требуют, чтобы мы передали земли их болгарским приспешникам."
 greece.2.d_ITA_BUL:0 "Немцы настаивают на требованиях как Италии, так и Болгарии к нашей территории."
 greece.2.a:0 "Мы не можем им противостоять."
 greece.2.b:0 "Мы не сдадимся."
 greece.3.t:0 "Судьба Греции"
 greece.3.d:0 "Германия потребовала, чтобы мы согласились на «координацию» с Германией. Это фактически превратило бы нас в марионетку Германии."
 greece.3.a:0 "Прими неизбежное."
 greece.3.b:0 "Откажись."
 greece.4.t:0 "Война с Турцией"
 greece.4.d:0 "Наши итальянские друзья планируют выступить против Турции. Это прекрасная возможность для нас укрепить наши позиции в Эгейском море. Захватим Измир для себя и поможем итальянцам прогнать турок подальше от Европы."
 greece.4.a:0 "Измир будет нашим."
 turkey.1.t:0 "Смерть Мустафы Кемаля Ататюрка"
 turkey.1.d:0 "\n Республика в трауре.\n\n Герой войны, революционер, президент и отец всех турок, Мустафа Кемаль Ататюрк скончался.\n\n Он выполнял свой долг перед турецким народом и основанной им республикой до самого конца. Тысячи скорбящих отдали ему последние почести в Стамбуле, прежде чем его тело перевезли на кессоне, корабле и поезде в Анкару. Там состоялись государственные похороны, в которых приняли участие весь парламент и представители со всего мира.\n\n После того, как отец современной турецкой нации ушел из жизни, республика должна идти вперед. Великое Национальное собрание избрало его преемником [Root.GetLeader]."
 turkey.1.a:0 "Ататюрк будет жить в нашей памяти"
 generic.1.t:0 "[From.GetName] пытается влиять на нашу политику"
 generic.1.d_neutral_good:0 "В течение долгого времени [From.GetAdjective] правительство стремилось выстроить наши страны в единую линию и проявляло большой интерес к [Root.GetAdjective] политике. Недавно это усилилось, когда [From.GetRulingParty] начал продвигать пропаганду [From.GetRulingIdeology] с помощью выступлений и раздачи информационных материалов народу [Root.GetAdjective]. \n\n Теперь даже некоторые политики и другие чиновники поддались влиянию [From.GetAdjective] пропаганды и начали выступать за [From.GetRulingIdeologyNoun] в [Root.GetName]."
 generic.1.d_bad:0 "В течение длительного времени [From.GetAdjective] правительство пыталось согласовать курс наших стран и часто пыталось вмешиваться в политику [Root.GetName]. Недавно ситуация усугубилась, поскольку [From.GetRulingParty] начала продвигать свою [From.GetRulingIdeology] пропаганду без уважения к [Root.GetAdjective] политическим традициям. Уже ряд речей и других [From.GetRulingIdeology] материалов распространяется среди [Root.GetAdjective] народа. Похоже, что даже ряд политиков и других чиновников поддаются пропаганде [From.GetAdjective] и начали выступать за [From.GetRulingIdeologyNoun] в [Root.GetName]."
 generic.1.a:0 "Интересно"
 generic.1.b:0 "Как они смеют!"
 country_capitulated.0.t:0 "[Root.GetName] капитулировал"
 country_capitulated.0.d_positive_both_no_faction:1 "\n[From.From.GetLeader] объявил, что трусливый [Root.GetAdjective] народ больше не может противостоять давлению со стороны подавляющего присутствия [From.From.GetAdjective] войск по всей стране. [Root.GetAdjective] правительство решило бежать из страны и отправилось в изгнание. Их основные силы капитулировали, и теперь [From.From.GetNameDef] контролирует их родной регион.\nХотя война продолжается в других местах, это великая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_no_faction:1 "\n[From.From.GetLeader] объявил, что трусливый [Root.GetAdjective] народ больше не может выдержать давления со стороны непобедимых [From.From.GetAdjective] сил, которые размещаются по всей стране. [Root.GetAdjective] правительство решило сбежать из страны и ушло в изгнание. Основные силы капитулировали, а [From.From.GetNameDef] теперь контролирует их родные земли.\nНесмотря на то, что война с остатками [Root.GetFactionName] продолжается в других местах, это великая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_faction:1 "\n[From.From.GetLeader] объявил, что трусливый [Root.GetAdjective] народ больше не может выдержать давления со стороны непобедимых [From.From.GetAdjective] сил, которые размещаются по всей стране. [Root.GetAdjective] правительство решило сбежать из страны и ушло в изгнание. Основные силы капитулировали, а [From.From.GetNameDef] теперь контролирует их родные земли.\nНесмотря на то, что война с остатками [Root.GetFactionName] продолжается в других местах, это великая победа для всех членов [From.From.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction:1 "\n[Root.GetLeader] объявил, что [Root.GetAdjective] народ больше не в силах сопротивляться давлению оккупирующих сил [From.From.GetAdjective], творящих бесчинства по всей стране. [Root.GetAdjective] правительство ушло в изгнание. Их главные силы капитулировали, и теперь [From.From.GetNameDef] контролирует их родные земли.\nНесмотря на эту тяжелую утрату, война с [From.From.GetNameDef] ещё далека от завершения."
 country_capitulated.0.d_negative_prev_no_faction:1 "\n[Root.GetLeader] объявил, что [Root.GetAdjective] народ больше не в силах сопротивляться давлению оккупирующих сил [From.From.GetAdjective], творящих бесчинства по всей стране. [Root.GetAdjective] правительство ушло в изгнание. Их главные силы капитулировали, и теперь [From.From.GetNameDef] контролирует их родные земли.\nХотя война с [From.From.GetNameDef] продолжается, это печальная неудача для всех [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction:1 "\n[Root.GetLeader] заявил, что [Root.GetAdjective] нация больше не может противостоять натиску оккупировавших её [From.From.GetAdjective] сил, которые учиняют бесчинства по всей стране. Правительство [Root.GetAdjective] ушло в изгнание. Их основные силы капитулировали, и теперь [From.From.GetNameDef] контролирует их родные земли.\nХотя война с [From.From.GetNameDef] и остальной частью [From.From.GetFactionName] продолжается, это неудачное отступление для всех, кто входит в [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction:1 "\nПравительство [Root.GetAdjective] ушло в изгнание, а их основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует их родные земли.\n\nХотя борьба между [From.From.GetName] и [Root.GetName] завершена, [From.From.GetNameDef] всё ещё ведёт тотальную войну, и бои продолжаются в других местах."
 country_capitulated.0.d_neutral_prev_no_faction:2 "\nПравительство [Root.GetAdjective] ушло в изгнание, а их основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует их родные земли.\n\nБорьба в [Root.GetName] была лишь малой частью конфликта. Война между [From.From.GetNameDef] и тем, что осталось от [Root.GetFactionName], продолжается в других местах."
 country_capitulated.0.d_neutral_prev_faction:2 "\n[Root.GetAdjective] правительство ушло в изгнание, а его основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует свою родную территорию.\n\nБорьба между [From.From.GetNameDef] и [Root.GetNameDef] была лишь небольшой частью конфликта. Война между [From.From.GetFactionName] и остатками [Root.GetFactionName] продолжается в других местах."
 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDef] объявила о полной капитуляции перед [From.From.GetNameDef]. [From.From.GetAdjective] силы вместе с рядом независимых [Root.GetAdjective] [From.From.GetRulingIdeology] сторонников вынудили [Root.GetLeader] и его правительство уйти в изгнание, поскольку было сформировано новое правительство для управления [Root.GetNameDef] в сотрудничестве с [From.From.GetNameDef]. [From.From.GetLeader] отметил, что это взаимное соглашение принесет [Root.GetNameDef] новую эру процветания и сотрудничества.\n[Root.GetLeader] ответил, заявив, что даже в изгнании он продолжит бороться за [Root.GetNameDef] и поддерживать все усилия сопротивления на своей родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology:0 "\n[Root.GetNameDef] объявила о полной капитуляции перед [From.From.GetNameDef]. Некоторые недовольные [Root.GetAdjective] граждане, которых не устраивала та разновидность [From.From.GetRulingIdeologyNoun], которая была принесена в [Root.GetNameDef] [Root.GetLeader], присоединились к солдатам [From.From.GetAdjective] и помогли им свергнуть его и сформировать новое правительство под руководством [From.From.GetNameDef]. [From.From.GetLeader] заявил, что это соглашение принесёт [From.From.GetNameDef] новую эру процветания и сотрудничества\n[Root.GetLeader] ответил, что [From.From.GetLeader] - не настоящий [From.From.GetRulingIdeology], и даже находясь в изгнании, он будет бороться за [Root.GetNameDef] и поддерживать сопротивление на родине"
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDef] объявила о полной капитуляции перед [From.From.GetNameDef]. Очевидно, что снисходительность правительства [Root.GetAdjective] к сторонникам [From.From.GetRulingIdeology] внутри страны способствовала падению [Root.GetName], поскольку [Root.GetFascistLeader] был избран на пост руководителя страны по указу [From.From.GetLeader]\n[Root.GetLeader] утверждает, что это ещё не конец суверенитета [Root.GetAdjective], и правительство продолжит поддерживать сопротивление даже находясь в изгнании"
 country_capitulated.0.a:0 "Отличные новости!"
 country_capitulated.0.b:0 "Мрачные времена"
 country_capitulated.0.c:0 "Неопределенные времена"
 britain.22.t:0 "Стэнли Болдуин ушел в отставку"
 britain.22.d:0 "Через две недели после коронации короля Георга VI г-н Болдуин объявил о своей отставке с должности премьер-министра, чтобы уйти в отставку в возрасте 70 лет. Будучи руководителем национального правительства с 1923 года с перерывами, он был надежной рукой, ответственной за вывод Британской империи из Великой депрессии, а в последние годы неохотно руководил началом имперского перевооружения и отречением короля Эдуарда VIII. Он уходит в отставку как популярный и успешный премьер-министр, но сделал ли он достаточно, чтобы противостоять растущей угрозе со стороны Германии?"
 britain.22.a:0 "Г-н Чемберлен намерен сформировать правительство."
 france.31.t:0 "Эдуард Даладье ушел в отставку"
 france.31.d:0 "С падением Третьей республики и отказом германского правительства предложить перемирие дальнейшее ведение борьбы из колоний должно лечь на плечи нового руководства. Хотя мало кто сомневается, что мсье Даладье был прекрасным премьер-министром, он просто не мог противостоять тем чрезвычайным обстоятельствам, в которых оказалась Франция. Мы можем только молиться, что в конце туннеля есть свет."
 france.31.a:0 "Мсье Рейно намерен сформировать правительство."
 germany.999.t:0 "Сказка о двух городах"
 germany.999.desc:0 "После ошеломляющей победы германских войск пришло время уничтожить последние остатки большевистской власти в Европе. До сих пор имена Сталина и Ленина позорят два крупных города в новом немецком Lebensraum, насмехаясь над солдатами, которые отдали свои жизни, чтобы захватить их. \n\n\"Ассоциация ветеранов Вельткрига\" внесла правительству предложение исправить это ужасное положение дел."
 germany.999.a:0 "Давайте почтим память героев прошлой войны!"
 germany.999.b:0 "Какое нелепое предложение!"
 GAME_OVER_TT:0 "§RДля вас игра закончится.§!"
 CAN_ANGERED_WORKERS:0 "Это расстроит население"
 generic.2.t:0 "[From.GetNameDefCap] стремится присоединиться к [Root.GetFactionName]"
 generic.2.d.a:0 "Столкнувшись с растущими угрозами свободе и демократическим ценностям, [alliance_applicant.GetAdjective] рассматривают нас как защитников свободы. Теперь они хотят войти в наш союз, чтобы воспользоваться нашей защитой и выступить вместе с нами против сил, которые угрожают демократии."
 generic.2.d.b:0 "Наши усилия по свержению существующего мирового порядка не остались незамеченными для единомышленников. [alliance_applicant.GetAdjective] признают, что их лучший шанс выстроить для себя процветающее будущее - присоединиться к нам в грядущем конфликте, и поэтому они предложили официально объединиться с нами против наших врагов."
 generic.2.d.c:0 "[alliance_applicant.GetNameDefCap] понимают, что должны сплотиться с другими социалистическими республиками, чтобы укрепить положение коммунизма в мире. Признавая нашу руководящую роль в международной борьбе рабочих, [alliance_applicant.GetAdjective] просят официально вступить в наш альянс."
 generic.2.d.e:0 "На фоне нынешних потрясений в мировой политике, которые продолжают сотрясать мир, [alliance_applicant.GetAdjective] решили, что мы представляем для них наибольший шанс выжить в эти бурные времена. Поэтому они просят принять их в наш альянс, чтобы мы могли вместе пережить грядущую бурю."
 generic.2.a:0 "Все, кто стоит за свободу и демократию, могут встать вместе с нами."
 generic.2.b:0 "Мир принадлежит всем сильным!"
 generic.2.c:0 "Если мы будем держаться вместе, революция непременно восторжествует."
 generic.2.e:0 "Мы должны преодолеть это!"
 generic.2.f:0 "Нам будет лучше без них."
 generic.2.g:0 "Нам уже хватает союзников."
 generic.3.t:0 "[alliance_inviter.GetNameDefCap] приветствуют нас в [alliance_inviter.GetFactionName]"
 generic.3.d:0 "[alliance_inviter.GetNameDefCap] решили принять нашу просьбу присоединиться к [alliance_inviter.GetFactionName]. Отныне мы будем стоять и падать вместе."
 generic.3.a:0 "Вместе мы защитим демократию."
 generic.3.b:0 "Никто не устоит против нас!"
 generic.3.c:0 "Положение рабочих не могло бы быть в лучших руках!"
 generic.3.e:0 "Мы отложим наши разногласия, на время."
 generic.4.t:0 "[alliance_inviter.GetNameDefCap] отклонил просьбу о вступлении в [alliance_inviter.GetFactionName]"
 generic.4.d:0 "[alliance_inviter.GetNameDefCap] решил отклонить нашу просьбу о вступлении в [alliance_inviter.GetFactionName]. Нам придется обойтись без их помощи."
 generic.4.a:0 "Они называют себя защитниками свободы?"
 generic.4.b:0 "Тогда мы сокрушим и их!"
 generic.4.c:0 "Их революция порочна!"
 generic.4.e:0 "Наши разногласия были слишком велики."
 news.289.t:0 "[alliance_applicant.GetNameDefCap] присоединяется к [alliance_inviter.GetFactionName]"
 news.289.d:0 "\nРанее сегодня [alliance_inviter.GetNameDef] и [alliance_applicant.GetNameDef] выступили с совместным заявлением, что последнему теперь официально присвоен статус члена [alliance_inviter.GetFactionName]. Будет ли это партнерство использоваться в наступательных или оборонительных целях, еще предстоит выяснить, но несомненно, что уже проводится обширное совместное военное планирование."
 news.289.a:0 "Мы сильнее вместе."
 news.289.b:0 "Они ищут силы в численности."
 news.289.c:0 "Это им не поможет!"
 news.289.e:0 "Война обостряется..."
 news.289.f:0 "Наш альянс становится крепче."
 generic.5.t:0 "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [alliance_inviter.GetFactionName]"
 generic.5.d.a:0 "С подозрением наблюдая за последними событиями в мировой политике, [alliance_inviter.GetNameDef] протягивает нам руку дружбы, предлагая свою защиту и призывая нас встать на их сторону в защиту принципов свободы и демократии. Будучи членом [alliance_inviter.GetFactionName], свобода нашего народа, вероятно, будет защищена."
 generic.5.d.b:0 "Признавая, что иногда даже сильным нужны союзники, [alliance_inviter.GetAdjective] пригласили нас присоединиться к [alliance_inviter.GetFactionName]. Если мы примем их предложение, это вполне может дать нам возможность найти свое место под солнцем."
 generic.5.d.c:0 "Наши идеологические союзники из [alliance_inviter.GetNameDef] отметили наш ценный вклад в дело рабочих, и сегодня утром мы получили приглашение присоединиться к [alliance_inviter.GetFactionName]. Стоя плечом к плечу с другими социалистическими республиками, мы можем распространять революцию с новой силой."
 generic.5.d.e:0 "Похоже, что [alliance_inviter.GetAdjective] считают нас для них стратегически важными, и что они считают более выгодным работать вместе, чем позволить разделить нас нашими идеологическими разногласиями. Сегодня утром посол [alliance_inviter.GetAdjective] передал нам приглашение стать государством-членом [alliance_inviter.GetFactionName]."
 generic.5.a:0 "Мы поддержим их."
 generic.5.b:0 "Нам нужны всего лишь несколько тысяч погибших..."
 generic.5.c:0 "Мы будем сражаться вместе с нашими товарищами!"
 generic.5.e:0 "Это выгодный выбор."
 generic.6.t:0 "[alliance_applicant.GetNameDefCap] принимает приглашение в [alliance_inviter.GetFactionName]"
 generic.6.d:0 "[alliance_applicant.GetNameDefCap] решил принять наше предложение присоединиться к [alliance_inviter.GetFactionName]. Отныне мы будем стоять или падать вместе."
 generic.7.t:0 "[alliance_applicant.GetNameDefCap] отклоняет предложение присоединиться к [alliance_inviter.GetFactionName]"
 generic.7.d:0 "[alliance_applicant.GetNameDefCap] решил отклонить наше предложение присоединиться к [alliance_inviter.GetFactionName]. Нам придется обойтись без их помощи."
 generic.7.a:0 "Наша помощь не нужна."
 news.290.t:0 "Отто принимает венгерскую корону"
 news.290.desc:0 "В поисках подходящего короля Королевство Венгрия направило приглашение Отто фон Габсбургу вернуться в земли, которыми до недавнего времени правила его семья. Отто, который жил в изгнании по всей Западной Европе с момента окончания Великой войны и распада империи своего отца, решил принять это предложение. Сегодня, среди большой помпы и празднования, он был коронован королем Венгрии на торжественной церемонии в Королевском дворце в Будапеште.\n\nВо время своей коронационной речи король Отто поблагодарил венгерский народ за его верность и преданность, и поклялся снова объединить земли Габсбургов, пообещав, что на этот раз Венгрия будет доминирующей составной частью.
 news.290.a:0 "Теперь это королевство не только по названию"
 news.290.b:0 "Это опасные речи..."
 news.290.c:0 "Гонка за Австрию начинается!"
 news.290.e:0 "Возродится ли Империя?"
 news.291.t:0 "Австрия голосует за объединение с Венгрией"
 news.291.desc:0 "По настоянию венгров Австрия провела референдум о возможном воссоединении двух стран под властью Габсбургов. Окончательный подсчет результатов еще не завершен, но уже очевидно, что это будет сокрушительная победа сторонников воссоединения. Никаких нарушений в ходе голосования не сообщалось, и австрийское правительство оказалось вынужденным сформировать региональное правительство Венгерского государства.\n\nХотя этот шаг был горячо приветствован венгерской общественностью, политические последствия референдума, вероятно, будут ощущаться по всей Европе."
 news.291.a:0 "Наши братские узы не забыты"
 news.291.b:0 "Это не останется без последствий..."
 news.291.c:0 "Возможно, вакуум власти в Империи все еще будет заполнен..."
 news.292.desc:0 "По настоянию венгров Австрия провела референдум о возможном воссоединении двух государств под властью династии Габсбургов. Подсчет голосов почти завершен, и уже очевидно, что сторонники объединения одержали подавляющую победу. Поступало много сообщений о нарушениях, фальсификациях и подтасовках результатов выборов, но австрийские чиновники отвергли эти обвинения и уже начали перестраивать правительство в региональное правительство венгерского государства.\n\nХотя венгерская общественность тепло приветствовала этот шаг, политические последствия референдума, вероятно, будут ощутимы по всей Европе."
 news.292.a:0 "Братские узы и несколько удобных взяток..."
 news.292.b:0 "Это был наш план!"
 news.292.c:0 "Возможно, вакуум власти в Империи будет заполнен..."
 news.292.e:0 "Оскорбление демократии!"
 news.293.t:0 "Австрия проголосовала против воссоединения"
 news.293.desc:0 "По настоянию венгров Австрия провела референдум о возможном воссоединении двух государств под властью династии Габсбургов. Подсчет голосов почти завершен, но победа лагеря воссоединения уже недостижима. Поэтому австрийское правительство решило не присоединяться к австро-венгерскому союзу.\n\nВ духе демократии и самоопределения Венгрия приняла этот результат и решила не продвигать свои предложения дальше."
 news.293.a:0 "Очень жаль."
 news.293.b:0 "Наша независимость в сохранности!"
 news.293.c:0 "Прекрасно... Теперь наша очередь."
 news.293.e:0 "Падение Империи стало окончательным."
 news.294.t:0 "Австрия голосует против воссоединения"
 news.294.desc:0 "По настоянию венгров, Австрия провела референдум о возможном воссоединении двух наций под властью Габсбургов. Итоговый подсчет голосов почти завершен, но победа лагеря за воссоединение уже недостижима. Поэтому австрийское правительство приняло решение против присоединения к австро-венгерскому союзу.\n\nОднако Венгрия обвинила австрийское правительство в фальсификации выборов против воссоединения. Они заявили, что не будут уклоняться от применения силы для защиты желания австрийского народа воссоединиться со своими венгерскими братьями. Обе стороны уже начали мобилизацию, и война кажется неизбежной."
 news.294.a:0 "Что такое несколько смертей для Империи?"
 news.294.b:0 "Мы будем защищать Вену до последнего человека!"
 news.294.c:0 "Это рушит все наши планы..."
 news.294.e:0 "Будем надеяться, что конфликт не распространится."
 news.295.t:0 "Восстановление Австро-Венгрии"
 news.295.desc:0 "Завершив воссоединение Австрии и Венгрии, венгерское правительство пригласило международную прессу в Будапешт и объявило о восстановлении Австро-Венгерской империи.\n\nКороль Отто принял законный титул императора Австрии и подтвердил своё обещание о том, что, хотя империя ещё представляет собой лишь тень своего прежнего величия, он не успокоится, пока все габсбургские земли не будут объединены. Их соседи, без сомнения, подозрительно относятся к событиям в Будапеште."
 news.295.a:0 "Как птица Феникс, восставшая из пепла."
 news.295.b:0 "Это сильно меняет ситуацию..."
 news.295.c:0 "Будут ли они другом или врагом?"
 news.295.e:0 "Нам лучше укрепить наши границы..."
 news.296.t:0 "Вильгельм получает венгерскую корону"
 news.296.desc:0 "Венгры, после долгих переговоров и приготовлений, ища короля для своей нации, на этой неделе официально пригласили шведского принца Вильгельма, герцога Седерманландского. Сегодня, среди большой шумихи и празднеств, в Королевском дворце в Будапеште, на торжественной церемонии он был коронован как король Венгрии.\n\nГоворят, что новый король принимает близко к сердцу благополучие своего народа и горячо поддерживает его демократические права. Кроме того, он выступает за диалог с соседями Венгрии, а не за враждебность. Таким образом, новый король может оказаться существенной поддержкой для снижения напряженности в регионе."
 news.296.b:0 "Поднимается ещё один слабак."
 news.296.c:0 "Ещё один, кто будет нести факел."
 news.297.t:0 "Фридрих Франц принимает венгерскую корону"
 news.297.desc:0 "В результате длительных переговоров и приготовлений венгры официально пригласили немецкого Фридриха Франца, Великого герцога Мекленбург-Шверина, возглавить их страну. Сегодня в ходе торжественной церемонии во дворце Будапешта под громкие фанфары и всеобщие празднества он был коронован в качестве короля Венгрии.\n\nНовый король состоит в СС с 1931 года. Его идеологические взгляды общеизвестны. Он уже заявил, что \"\"приведет Венгрию к величию, которого она заслуживает, несмотря ни на что\"\". Учитывая обещание короля \"\"восстановить справедливость, навязанную нам в прошлом\"\", маловероятно, что эта коронация приведет к снижению напряженности в регионе."
 news.297.b:0 "Весьма тревожное развитие событий..."
 news.297.c:0 "Новый потенциальный союзник!"
 news.298.t:0 "Венгрия отказывается от Трианонского договора"
 news.298.desc:1 "[HUN.GetLeader] публично отказался от договора, навязанного Венгрии союзными державами после Великой войны. Этот подписанный в 1920 году договор вызвал бурю негодования в Венгрии, поскольку значительно урезал территорию страны и ограничил численность ее вооруженных сил.\n\nВ своей речи [HUN.GetLeader] намекнул на то, что Венгрия в скором времени может попытаться вернуть утраченные двадцать лет назад территории."
 news.298.a:0 "Унижение окончено, но не забыто!"
 news.298.b:0 "Они покушаются на миропорядок..."
 news.298.c:0 "Венгрия провозгласила себя Великой Венгрией"
 news.299.t:0 "Венгрия провозгласила себя Великой Венгрией"
 news.299.desc:0 "Венгрия, восстановив земли, которые были у нее отняты по Трианонскому договору, [From.GetLeader] объявил вчера вечером, что отныне эта страна будет известна как Великая Венгрия. Эта акция, как надеются, будет способствовать укреплению престижа Великой Венгрии в глазах мирового сообщества, а также лучше отражать истинные границы страны."
 news.299.a:0 "Мир увидит наше могущество."
 news.299.b:0 "Они малость зазнались."
 news.300.t:0 "Венгрия требует вернуть Трансильванию"
 news.300.desc:0 "Пытаясь и дальше отменить действие Трианонского договора, Венгрия предъявила Румынии ультиматум, в котором потребовала вернуть Трансильванию. Официального ответа пока не было, но Венгрия уже намекнула, что примет меры, если ее требования не будут выполнены."
 news.300.a:0 "Нас больше не запугать!"
 news.300.b:0 "Мы должны быстро что-то придумать..."
 news.300.c:0 "Давайте надеяться, что они урегулируют ситуацию мирным путем."
 news.301.t:0 "Румыния возвращает Трансильванию"
 news.301.desc:0 "Румыния объявила, что она примет требования Венгрии о возврате Трансильвании. Следовательно, в настоящее время эта территория снова является частью страны, что значительно увеличивает ее размер и мощь. Маловероятно, что такой большой успех удержит венгров от дальнейшего выдвижения требований о возврате утраченных территорий."
 news.301.a:0 "Мы идем к величию!"
 news.301.b:0 "У нас не было выбора."
 news.301.c:0 "По крайней мере мир был сохранен."
 news.302.t:0 "Румыния отвергает Венгерские требования"
 news.302.desc:0 "Срок ультиматума прошел без ответа от Румынии. Разгневанные венгерские власти уже осудили румынское правительство, заявив, что они "дестабилизируют регион" своим настаиванием на соблюдении "незаконных договоров". Обе нации, кажется, готовятся к войне, которая может вспыхнуть в любой день."
 news.302.a:0 "Если только сила - единственный язык, который они понимают..."
 news.302.b:0 "Пусть приходят!"
 news.302.c:0 "Тупоголовые дураки..."
 news.303.t:0 "Венгрия требует Южную Словакию"
 news.303.desc:0 "В соответствии со своими клятвами о пересмотре Трианонского договора Венгрия потребовала вернуть Южную Словакию от [From.GetName]. [From.GetAdjective] еще не ответили, но угроза войны в венгерской риторике более чем очевидна. Отклонение запроса вполне может привести к новой войне в регионе."
 news.303.a:0 "Им должно повезти, что это все, чего мы требуем."
 news.303.b:0 "Будем надеяться, что мы сможем найти компромисс..."
 news.304.t:0 "[From.GetName] возвращает Южную Словакию"
 news.304.desc:0 "[From.GetName] официально согласился на требования Венгрии о возврате юга Словакии и уже спешит принять меры, гарантирующие, что территория будет немедленно возвращена Венгрии. Вряд ли этот успех помешает Венгрии предъявлять новые требования о возвращении ее остальных потерянных территорий."
 news.304.a:0 "Мы приветствуем их в наших рядах."
 news.305.t:0 "[From.From.GetName] отклоняет венгерские требования"
 news.305.desc:0 "Дипломатические переговоры провалились, и сегодня [From.From.GetName] публично отверг требования Венгрии о возвращении юга Словакии. Разгневанные венгерские официальные лица уже осудили правительство [From.From.GetName], заявив, что они \"дестабилизируют регион\" своим намерением придерживаться \"незаконных договоров\". Обе нации, кажется, готовятся к войне, которая может разразиться в любой день."
 news.306.t:0 "Венгрия требует Воеводину"
 news.306.desc:0 "В свете их прошлых успехов в достижении возвращения потерянных территорий венгры теперь потребовали, чтобы Югославия вернула Воеводину. Поскольку югославы пытаются найти дипломатическое решение, нетерпение венгров уже становится все более и более очевидным, и если югославы отклонят требования, вряд ли будет найдено мирное решение."
 news.306.a:0 "Продолжается поход к Великой Венгрии."
 news.306.b:0 "Мы должны думать быстро..."
 news.307.t:0 "Югославия возвращает Воеводину"
 news.307.desc:0 "Югославия решила уступить требованиям Венгрии и организовала быструю передачу Воеводины своему соседу. Хотя для этого пришлось применить дипломатию канонерок, неоспоримо, что Венгрия стала новой региональной державой."
 news.307.a:0 "Еще одна дипломатическая победа!"
 news.308.t:0 "Югославия отвергает требования Венгрии"
 news.308.desc:0 "В явном акте неповиновения югославы отвергли требования Венгрии о Воеводине. Венгрия, со своей стороны, не предприняла никаких усилий, чтобы отказаться от своих угроз применить силу для обеспечения своей законной территории. Обе страны, похоже, готовятся к войне, которая вполне может вспыхнуть в любой день."
 news.309.t:0 "Венгрия претендует на верховную власть над Словакией"
 news.309.desc.a:1 "Венгры заявили, что Словакия должна снова стать частью их страны, либо как ее неотъемлемая часть, либо как автономный регион. Ультиматум об этом был выпущен, подкрепленный угрозой применения силы, и дипломаты из нескольких европейских стран пребывают в суматохе, пытаясь найти мирное решение этого последнего кризиса."
 news.309.desc.b:0 "Венгры заявили, что Словакия должна снова стать частью их страны, либо как ее неотъемлемая часть, либо как автономный регион. Ультиматум об этом был выпущен, подкрепленный угрозой применения силы, и правительство Словакии пребывает в суматохе, пытаясь найти дипломатическое решение этого последнего венгерского кризиса."
 news.309.a:0 "Будем надеяться, что сила не потребуется."
 news.309.b:0 "Это не маловажное требование..."
 news.309.c:0 "Согласны ли мы расстаться с нашей независимостью?"
 news.310.t:0 "[From.GetName] уступает Венгрии"
 news.310.desc.a:2 "После долгих размышлений [From.GetAdjective] правительство под руководством [From.GetLeader] приняло решение уступить [HUN.GetAdjective] требованиям. Они приняли [HUN.GetAdjective] контроль над Словакией, предпочитая умиротворить [HUN.GetLeader] ради сохранения мира. Несомненно, это укрепит решимость [HUN.GetAdjective] в будущих отношениях с их ослабленными соседями."
 news.310.desc.b:0 "После долгих размышлений, словаки приняли решение уступить венгерским требованиям. Не видя альтернативы, они расстались со своей независимостью, чтобы сохранить жизни своего народа. Несомненно, это укрепит решимость Венгрии в будущих отношениях с их ослабленными соседями."
 news.310.a:0 "Словакам лучше именно так."
 news.310.b:0 "Это была необходимая жертва."
 news.311.t:1 "[From.From.GetName] отвергает венгерские требования"
 news.311.desc.a:1 "Между Германией и Венгрией разразился дипломатический кризис, касающийся судьбы Словакии. [HUN.GetLeader] ранее заявил, что Словакия является основной целью [HUN.GetNameDef] из-за ее исторических связей с Венгрией. Его правительство рассчитывало на то, что его проконсультируют по любым мерам в отношении Словакии.\n\nНемецкий лидер [GER.GetLeader] отказался принять подобные требования, назвав их «глупым и опасным вмешательством во внутренние дела суверенного государства»\n\nС учетом роста напряженности все больше наблюдателей задаются вопросом, не прибегнет ли Венгрия к насилию, чтобы поставить мир перед фактом."
 news.311.desc.b:0 "Цепляясь за свою независимость, словаки отклонили венгерские требования и укрепляют свою границу. Венгрия не предприняла никаких усилий для снижения напряженности, и обе нации, кажется, вступили на путь войны."
 news.311.b:0 "Мы едины. Пусть они приходят!"
 news.312.t:0 "Обновление Римских протоколов"
 news.312.desc.a:0 "По инициативе Венгрии, Италия, Австрия и Венгрия возобновили Римские протоколы, первоначально подписанные в 1934 году. Соглашения касаются экономического развития и сближения. По сути, это декларация о дружбе, и есть признаки того, что она может привести к официальному союзу, направленному на противодействие растущим ревизионистским и экспансионистским тенденциям Германии."
 news.312.desc.b:0 "По инициативе Венгрии, Италия и Венгрия возобновили действие Римского протокола, подписанного в 1934 году. Соглашения касаются экономического развития и сближения. В сущности это декларация дружбы; есть признаки, что она может привести к официальному альянсу с целью противодействия растущим ревизионистским и экспансионистским устремлениям Германии."
 news.312.a:0 "Мы приветствуем наших новых друзей."
 news.312.b:0 "Это не предвещает ничего хорошего..."
 news.312.c:0 "Возможно, из этого что-то хорошее выйдет."
 news.313.t:0 "Создан Римский пакт"
 news.313.desc.a:0 "Сегодня соответствующие правительства Италии, Австрии и Венгрии опубликовали совместное заявление о создании Римского пакта. Три державы поклялись оказывать друг другу военную помощь, как в целях обороны, так и для наступления в случае необходимости. Баланс сил в регионе радикально изменился в одночасье."
 news.313.desc.b:0 "Сегодня соответствующие правительства Италии и Венгрии опубликовали совместное заявление о создании Римского пакта. Две державы поклялись оказывать друг другу военную помощь, как в целях обороны, так и для наступления в случае необходимости. Баланс сил в регионе радикально изменился в одночасье."
 news.313.a:0 "Мы стоим плечом к плечу."
 news.313.b:0 "Это повод для беспокойства..."
 news.313.c:0 "Германия больше не беззащитна."
 news.314.t:0 "Убийство Хорти"
 news.314.desc:0 "Появилась информация, что сегодня в Венгрии одинокий стрелок застрелил Миклоша Хорти после того, как тот покинул здание парламента в Будапеште. Хотя Хорти сразу же доставили в больницу, врачи заявили, что он уже скончался к моменту прибытия. Стрелок, застреленный полицией при попытке скрыться с места преступления, был идентифицирован как член коммунистической партии.\n\nУбийство вызвало бурю в венгерской внутренней политике, поскольку антикоммунистические взгляды Хорти были важнейшим фактором в сдерживании революционных элементов. Вероятно, без старого адмирала у руля политической сцены коммунистическое влияние резко возрастет."
 news.314.a:0 "Жизнь человека — это лишь малая цена, которую нужно заплатить."
 news.314.b:0 "Революцию не остановить!"
 news.314.c:0 "Могут ли коммунисты опуститься еще ниже?"
 news.315.t:0 "Австрия отклоняет референдум"
 news.315.desc:0 "Австрия категорически отвергла призывы Венгрии к референдуму, несмотря на растущую воинственность Венгрии. Венгрия обвиняет австрийское правительство в вопиющем игнорировании демократических прав своего народа. Венгрия заявила, что не станет уклоняться от применения силы, чтобы защитить желание австрийского народа воссоединиться со своими венгерскими братьями. Обе стороны теперь начали мобилизацию, и война, похоже, неизбежна."
 news.316.t:0 "Польско-румынский альянс"
 news.316.desc:0 "Поляки и румыны объявили о новых обязательствах по защите друг друга. Хотя хорошие отношения между этими двумя странами существуют уже более десяти лет, сегодняшнее заявление свидетельствует о том, что политика взаимной обороны все больше доминирует в военном планировании как в Польше, так и в Румынии."
 news.316.a:0 "Мы нужны друг другу."
 news.316.b:0 "Они думают, это их спасет?"
 news.316.c:0 "Будем надеяться, что это окупится."
 news.317.t:0 "Санитарный кордон"
 news.317.desc:0 "Ссылаясь на растущую опасность, исходящую от идеологий на востоке и западе, румыны объявили о формировании Санитарного кордона. Альянс приветствует всех, кто оказался во власти фашизма и коммунизма в Восточной Европе, и некоторые страны уже рассматривают возможность объединения своих сил с Румынией."
 news.317.a:0 "Мы берем на себя ответственность."
 news.317.b:0 "Мы поддерживаем Румынию."
 news.317.g:0 "Это рушит наши планы..."
 news.317.e:0 "Похвальная инициатива."
 news.317.f:0 "Теперь кто ведет себя враждебно?"
 news.318.t:0 "Болгария подчиняется Румынии"
 news.318.desc:0 "В ответ на румынский ультиматум и в случае немедленных военных действий со стороны Румынии в случае отказа, болгары внесли значительные изменения в свое правительство, чтобы сделать его более дружественным по отношению к Румынии. Болгария приняла все требования своего соседа, и вряд ли она откажется от дальнейших запросов. В результате ее теперь можно рассматривать только как румынскую марионетку."
 news.318.a:0 "Они знали, что для них лучше."
 news.318.b:0 "Необходимая мера..."
 news.318.c:0 "Беспокоящая новость."
 news.319.t:0 "Болгария отвергает требования Румынии"
 news.319.desc:0 "Несмотря на выданный ультиматум и тот факт, что в случае отказа со стороны Болгарии Румыния начнет незамедлительные военные действия, Болгария отвергла требования Румынии. Последняя отказалась отступать, и обе страны, по всей видимости, твердо намерены прибегнуть к вооруженному конфликту."
 news.319.a:0 "Они поймут, как сильно заблуждались."
 news.319.b:0 "Приходите и получите!"
 news.319.c:0 "Еще одна Балканская война...?"
 news.324.t:0 "Югославия подчинилась Румынии"
 news.324.desc:0 "Столкнувшись с требованиями Румынии о "значительной перестройке" их государства и угрозой применения военной силы в случае отказа, Югославия не видела иного выхода, кроме как подчиниться. Однако объявленная "перестройка" не только привела к разделению Югославии на ее составные части, но и повлекла установку марионеточных правительств.\n\nОчевидно, что под предлогом права на самоопределение были реализованы в первую очередь румынские интересы и что румынское влияние в регионе продолжает расти."
 news.324.a:0 "Какой мастерский ход!"
 news.324.b:0 "Как коварно."
 news.320.t:0 "Югославия отвергает требования Румынии"
 news.320.desc:0 "Несмотря на румынские требования о “радикальной реструктуризации” их государства и угрозы применить военную силу в случае отказа, Югославия отклонила ультиматум. Хотя на страну оказывается значительное давление со многих сторон, югославы решили защищать свою страну зубами и ногтями. Румыния объявила войну, и вполне возможно, что другие страны примут участие в разделе территории."
 news.320.a:0 "Так им и надо."
 news.320.b:0 "Придите и возьмите!"
 news.320.c:0 "Мы их предупреждали."
 news.320.f:0 "Они не продержатся долго."
 news.321.t:0 "Югославия разделена"
 news.321.desc:0 "По инициативе Румынии Югославии был предъявлен ультиматум с требованием “реструктурировать государство”. Столкнувшись с давлением со стороны нескольких соседей одновременно, югославы не увидели иного выхода, кроме как принять ультиматум. В настоящее время проводится раздел страны."
 news.321.a:0 "Мы должны поблагодарить наших друзей."
 news.321.b:0 "Это была отличная идея!"
 news.321.c:0 "Жадюги."
 news.321.e:0 "Мы их понимаем..."
 news.322.t:0 "Переворот в Румынии"
 news.322.desc:0 "Недовольство руководством страны достигло в Румынии опасного уровня, в связи с чем принц Михаил при поддержке значительных сил армии организовал переворот. Первые донесения говорят об успехе, а король Михаил уже объявил о том, что берёт на себя обязанности главы государства, намереваясь дать Румынии столь необходимое ей руководство."
 news.322.a:0 "Это перемена к лучшему."
 news.322.b:0 "Он кажется более... скромным, по крайней мере."
 news.323.t:0 "Король Кароль II отрекается от престола"
 news.323.desc:0 "Под давлением влиятельных лиц в правительстве король Румынии Кароль II не видел другого выхода, кроме объявления об отречении и подписания соответствующих документов. Ему наследует король Михаил, однако многие из диктаторских полномочий, полученных Каролем, были возвращены правительству, так что вряд ли молодой король сможет обладать такой же властью, как его предшественник.\n\nПосле отречения Кароль, судя по всему, опустошил свои многочисленные банковские счета и бежал в изгнание, поселившись с любовницей Магдой Лупеску в одном из самых дорогих районов Мехико."
 news.323.a:0 "Сгинь."
 news.323.b:0 "Забавно."
 news.325.t:0 "Югославия претендует на Болгарию"
 news.325.desc:0 "Опираясь на принципы своего государства как \"союза южнославянских народов\", югославская пропаганда в последнее время всё чаще говорит о включении болгарского народа в этот союз. Сейчас эта пропаганда приобрела резкий новый поворот, поскольку Югославия открыто заявила свои претензии на болгарский регион. Поскольку обе страны готовят свои силы, война вполне может вспыхнуть в любой момент."
 news.325.a:0 "Югославия — для всех славян!"
 news.325.b:0 "Мы готовы их встретить!"
 news.325.c:0 "Пороховая бочка никогда не подводит."
 news.326.t:0 "Бановина Хорватия"
 news.326.desc:0 "В результате продолжающихся и растущих проблем с хорватскими националистическими элементами югославское правительство вынуждено предоставить хорватам большую автономию. Создано новое полунезависимое государство — Бановина Хорватия, которая, хотя номинально и является зависимостью Югославии, теперь сильно снизило влияние правительства в регионе."
 news.326.a:0 "Это было необходимо."
 news.326.b:0 "Да здравствует Хорватия!"
 news.326.c:0 "Начало развала Югославии?"
 news.327.t:0 "Югославия претендует на Македонию"
 news.327.desc:0 "С целью объединения македонских народов Югославия объявила, что теперь она рассматривает Центральную Македонию как неотъемлемую часть югославской нации. В поддержку своих претензий подразделения были размещены на границе, и региону угрожает новый военный конфликт."
 news.327.a:0 "Все южные славяне едины!"
 news.327.b:0 "Пускай только попробуют!"
 news.327.c:0 "Тревожные события."
 news.328.t:0 "Югославия предъявляет претензии на итальянскую границу"
 news.328.desc:0 "Югославское правительство в последнее время все чаще выступает против обращения Италии с славянским меньшинством в пограничных регионах Истрия и Зара. Сегодня было заявлено, что эти регионы, захваченные Италией после Великой войны и преимущественно заселенные этническими славянами, являются неотъемлемой частью югославской нации. Кроме того, для защиты прав жителей этих регионов югославы заявили, что не станут уклоняться от применения военной силы."
 news.328.a:0 "Только в нашей стране они будут в безопасности."
 news.328.b:0 "Мы их раздавим, если они попытаются!"
 news.328.c:0 "Заваривается новый конфликт."
 news.329.t:1 "Югославия признает [SOV.GetNameDef]"
 news.329.desc:1 "Югославия, даже более стойко, чем другие страны, годами отказывалась признавать коммунистическое государство, которым является [SOV.GetNameDef]. С сегодняшним объявлением, что правительство Югославии отныне установит официальные отношения с Советами, эта политика наконец подошла к концу. Будет ли это означать, что югославское государство откроется для коммунистического влияния, еще предстоит выяснить, но тон заявления был на удивление сердечным."
 news.329.a:0 "У них есть интересные идеи."
 news.329.b:0 "Мы покажем им революцию."
 news.329.c:0 "Советское влияние распространяется..."
 news.330.t:0 "Всеславянский рабочий конгресс"
 news.330.desc:0 "Несогласные с фундаментальными аспектами советского коммунизма, югославы сами выбрали подход к идеологии. Вместо того, чтобы вступить в Коминтерн, югославское правительство заявило, что намерено возглавить южных славян в их борьбе за права рабочих. Вероятно, что они вскоре попытаются втянуть в свою орбиту соседей, что может серьезно нарушить баланс сил в регионе."
 news.330.a:0 "Мы поведем за собой наших славянских братьев!"
 news.330.b:0 "Наглые щенки!"
 news.330.c:0 "Интересно..."
 news.330.e:0 "Может, это принесет стабильность?"
 excellent:0 "Отлично."
 unfortunate:0 "К несчастью."
 traitors:0 "Предатели!"
 stability.21.t:0 "Уклонение от призыва"
 stability.21.desc.a:0 "Новый доклад Министерства обороны свидетельствует о резком сокращении численности призывников. Очевидно, что в последнем призыве оказалось гораздо меньше новобранцев, чем ожидалось. Разница в численности расследуется, но первые выводы говорят о том, что большое число лиц, формально годных к службе, избежало призыва разными способами. 18-летние студенты вдруг стали высококвалифицированными рабочими, занятыми в жизненно важной военной промышленности, бывшие спортсмены проваливают тесты на физподготовку, а некоторые новобранцы просто бесследно исчезли.\n\nПосле задержания и допроса они жалуются на плохие условия службы в армии, равнодушных офицеров и нежелание погибать за проигранное дело. Военные требуют жестких мер к уклоняющимся от призыва, но многие в правительстве считают, что лучшим решением было бы улучшить условия службы для новобранцев."
 stability.21.desc.b:0 "Неэффективный официальный ответ на массовое уклонение от призыва только усугубил проблему. Все больше и больше призывников не появляются после получения повестки. Контрразведка перехватила профессионально сделанный памфлет, в котором даются советы, как избежать призыва, например, подкупить врачей, чтобы они признали новобранца непригодным по медицинским показаниям. Исключения для отцов семей привели к тому, что вдовы войны с детьми оказываются завалены предложениями о браке, а число людей, обращающихся за исключениями по этическим причинам, достигло рекордных показателей.\n\nВоенные предлагают отменить последние исключения и показать пример на нескольких пойманных уклонистах. Другие члены правительства предложили апеллировать к чувству гражданского долга наших граждан и указать на последствия поражения в этой войне."
 stability.21.desc.c:0 "Учитывая, что меры правительства по уклонению от призыва не привели к положительным результатам, все больше и больше людей начинают задаваться вопросом, почему они должны подвергать себя риску, в то время как другие остаются в безопасности. Призывники, которые все же появляются, часто сообщают, что их преследуют или высмеивают на улицах как дураков, сражающихся за обреченное дело. Повсюду поступают сообщения о матерях, запрещающих своим детям отвечать на призыв, и военное министерство представило отчет, в котором утверждает, что они больше не уверены в том, сколько людей они должны призвать, поскольку их бюрократия начала рушиться под тяжестью обработки всех этих пропавших солдат."
 stability.21.a:0 "С этим ничего нельзя поделать."
 stability.21.d:0 "Мы должны арестовать всех, кого найдем уклоняющимся от призыва!"
 stability.21.e:0 "Возможно, следует повысить заработную плату призванным солдатам."
 stability.21.f:0 "Пришло время для более жестких мер."
 stability.21.g:0 "Обращение к гражданскому долгу людей."
 stability.21.h:0 "Мы должны показать пример."
 stability.21.i:0 "Мы должны дать людям то, за что они будут сражаться."
 stability.22.t:0 "Забастовки!"
 stability.22.desc.a:0 "Производство на нескольких заводах резко снизилось за последние несколько дней, поскольку рабочие объявили забастовку по всему военному производству. Требуя "Мира и хлеба!", они до сих пор отвергали все попытки договориться об урегулировании. Некоторые в правительстве выступают за жесткий военный ответ, а затем за быструю казнь главарей как вражеских агентов и предателей. Однако другие в государственной службе рекомендовали более взвешенный подход, указывая на то, что жесткие меры могут иметь неприятные последствия, если задействованные солдаты не так лояльны, как мы думали."
 stability.22.desc.b:0 "Попытки правительства убедить бастующих вернуться к работе, похоже, не дали никакого эффекта. Напротив, забастовки были отмечены на других заводах, а последние несколько выжидающих на первоначально затронутых рабочих местах также сложили инструменты, столкнувшись с гневом своих коллег. Хотя запасы до сих пор могли несколько смягчить удар по поставкам на передовую, это лишь вопрос времени, когда перебои в производстве начнут сказываться на нашей способности вести войну.\n\nВоенное ведомство снова призвало правительство занять бескомпромиссную позицию в отношении бастующих, но другие фракции внутри администрации предложили, что предложения встретиться с рабочими на полпути может быть достаточно, чтобы убедить их вернуться к работе."
 stability.22.desc.c:0 "То, что началось как забастовка на нескольких предприятиях, теперь распространилось по всей стране, затрагивая даже отрасли, которые косвенно связаны с войной. Работа самого правительства также нарушена, так как всё больше низкоуровневых клерков, курьеров и водителей отказываются выходить на работу. \n\nВо многих местах рабочие советы захватили промышленные здания. Согласно отчётам секретной полиции, в некоторых местах, кажется, опять начали производить оружие - для крупного восстания против того, что называют «военным режимом».\n\nВоенное верховное командование полагает, что решительные действия со стороны верных войск ещё могут переломить ситуацию, в то время как гражданская часть правительства утверждает, что это может привести к гражданской войне и неминуемому поражению."
 stability.22.a:0 "Пройдёт само."
 stability.22.b:0 "Провести демонстрацию военной силы в городах."
 stability.22.c:0 "Сделать пропагандистских героев из тех, кто ещё готов работать."
 stability.22.d:0 "Мобилизовать рабочих в армию и передать заводы под военный контроль."
 stability.22.e:0 "Предложить увеличить продовольственные пайки рабочих."
 stability.22.f:0 "Послать войска, арестовать бастующих и казнить главарей."
 stability.22.g:0 "Предложить новые законы о социальном обеспечении."
 stability.23.t:0 "Мятежи в армии"
 stability.23.desc.a:0 "Тревожные новости достигли Высшего военного командования о том, что ряд подразделений нашей армии отказываются выполнять приказы вышестоящих офицеров. Пока ни одно из подразделений не покинуло свои позиции в строю, но представители солдат ясно дали понять, что они не будут выполнять никаких приказов атаковать врага.\n\nДо сих пор мятеж был ограничен небольшим количеством батальонов и горсткой учебных и вспомогательных подразделений, но многие в военном ведомстве опасаются, что это восстание скоро распространится на другие подразделения и в конечном итоге сделает нас неспособными продолжать войну. Необходимы решительные действия."
 stability.23.desc.b:0 "Усилия по подавлению мятежей в армии не дали результатов. Окрыленные отсутствием эффективной реакции правительства, мятежники расширили свой список требований, включив в него немедленное прекращение огня, за которым последует всеобъемлющий мирный договор и демобилизация.\n\nВоенное ведомство настоятельно рекомендует нам послать мятежникам сильный сигнал, чтобы сдержать любые дальнейшие действия с их стороны."
 stability.23.desc.c:0 "Правительство оказалось неспособным или не желающим решать проблемы бунтовщиков. Поэтому мятежники решили действовать самостоятельно. Были объявлены выборы в «Рабочие и солдатские советы» с главной целью взять под контроль страну и заключить мир с противником.\n\nЕсли не принять быстрых мер, в некоторых районах страны эти советы могут прийти на смену нашему правительству и лишить нас возможности продолжать войну."
 stability.23.a:0 "Сейчас мы ничего не можем сделать."
 stability.23.b:0 "Окружите мятежные подразделения лоялистами и прикажите им сложить оружие."
 stability.23.c:0 "Выступить с патриотической речью перед мятежниками."
 stability.23.d:0 "Публично объявить, что всякий, кто поддержит мятежников, будет обвинен в государственной измене."
 stability.23.e:0 "Объявить мирную инициативу. Убедитесь, что она неприемлема для противника."
 stability.23.f:0 "Мобилизуйте лояльные ополчения и арестуйте всех солдат, не находящихся на своих боевых постах."
 stability.23.g:0 "Предложите солдатам разрешить им самим выбирать своих офицеров."
 15_days_tt:0 "На это потребуется около §Y15 дней§!\n"
 30_days_tt:0 "На это потребуется около §Y30 дней§!\n"
 45_days_tt:0 "На это потребуется около §Y45 дней§!\n"
 stability.31.t:0 "Военная зачистка прошла успешно"
 stability.31.desc:0 "Наши быстрые действия оказались очень эффективными. Военно-полицейские подразделения, поддержанные местными правоохранительными органами и добровольцами-патриотами, совершили хорошо скоординированную операцию, чтобы посетить каждого пропавшего призывника. Большинство согласилось ответить на призыв, когда им сообщили о последствиях неявки в военкомат. Военное верховное командование публично заявило, что любой, кто явился на место службы, не будет обвинен ни в каком преступлении или наказан за то, что не сделал этого раньше. И всё же, некоторые люди категорически отказались взять в руки оружие за свою страну и были арестованы."
 stability.31.a:0 "Решительные действия предотвратили худшее."
 stability.32.t:0 "Бунт призывников"
 stability.32.desc:0 "Наши попытки разрешить ситуацию с помощью военной силы не увенчались успехом. Вероятно, кто-то из администрации выдал наш план действий публике, которая отреагировала довольно быстро. Когда военная полиция и другие правоохранительные органы попытались задержать известных уклонистов, на их пути встали разгневанные толпы, требующие прекратить войну и принудительный призыв. В нескольких случаях между полицией и протестующими вспыхивали уличные бои, что привело к гибели людей, когда солдаты были вынуждены применить оружие, чтобы защитить себя. Полиции потребовалось несколько часов, чтобы взять ситуацию под полный контроль.\n\nПо городу распространилось подавленное настроение, когда были убраны баррикады, а мертвых похоронили. Отчеты из военного министерства показывают, что количество новобранцев, прибывающих на службу, не изменилось. Многие в правительстве задаются вопросом, как долго мы можем продолжать сражаться при таких обстоятельствах."
 stability.32.a:0 "Ситуация сложилась не совсем в нашу пользу."
 stability.33.t:0 "Восстание призывников"
 stability.33.desc:0 "Наши попытки разрешить ситуацию силовыми методами не увенчались успехом. По всей видимости, кто-то в нашей администрации слил наш оперативный план в массы, которые отреагировали незамедлительно. Когда военная полиция и другие правоохранительные органы попытались задержать известных уклонистов, они столкнулись с разъяренной толпой, требующей прекратить войну и принудительный призыв. В нескольких случаях между полицией и протестующими вспыхивали уличные бои, в которых погибло несколько человек, когда солдаты были вынуждены применить оружие для самообороны.\n\nСитуация быстро вышла из-под контроля, когда граждане бросились на солдат и штурмовали отделения полиции, чтобы вооружиться. В нескольких городах страны теперь происходит вооруженное восстание против правительства. По иронии судьбы, у повстанцев нет проблем с поиском солдат, которые готовы взять в руки оружие."
 stability.33.a:0 "О, так что, СЕЙЧАС они хотят воевать!?"
 stability.34.t:0 "Реформа призыва оказалась эффективной"
 stability.34.desc:0 "Социальные меры, принятые правительством в рамках крупномасштабной реформы военной службы, оказались на удивление популярными. Более высокая оплата и более частые отпуска часто приводятся в качестве основных новшеств, но многие также указывают на новые правительственные программы по поддержке вдов и сирот войны. Все меньше и меньше людей могут оправдать отказ от призыва своей страны, и общественная поддержка уклоняющихся от призыва практически исчезла. Действительно, в последнее время наблюдается рост общественной поддержки правительства, поскольку все больше и больше людей понимают, что образ жизни [Root.GetAdjective] подвергается нападению."
 stability.34.a:0 "Мудрое решение"
 stability.35.t:0 "591-й штрафной батальон"
 stability.35.desc:0 "Видя серьезность ситуации, Главное военное командование решило, что требуются более жесткие меры, чтобы показать, что уклонение от своего гражданского долга по защите своей страны не будет терпеться. На рассвете военная полиция совершила рейды на дома нескольких тщательно отобранных, известных и влиятельных людей, которые использовали свое влияние, чтобы позволить другим избежать призыва. Все еще в ночных рубашках, они оказались призванными в армию и под вооруженной охраной доставлены в казармы, где они будут сформированы в отдельную часть, чтобы не допустить распространения их подрывного влияния на другие части. \n\nИзвестия об этом быстро распространились, и, похоже, что большинство людей, которые до сих пор считали, что могут избежать призыва повестки, изменили свое мнение. Призывные пункты по всей стране сообщают, что все больше людей пришли спросить, каковы будут последствия, если их \"друг\", который пытался избежать призыва, сдастся."
 stability.35.a:0 "Возможно, они ещё могут себя искупить."
 stability.36.t:0 "Местные элиты высказывают свой протест"
 stability.36.desc:0 "Осознав тяжесть ситуации, Верховное военное командование решило, что требуются более суровые меры, чтобы показать, что уклонение от гражданского долга по защите своей страны не будет терпеться. На рассвете военная полиция совершила облавы на дома ряда тщательно отобранных известных и влиятельных людей, которые использовали свое влияние, чтобы позволить другим избежать призыва. Все еще в ночных рубашках, они были призваны в армию. Их семьи мобилизовали свои обширные сети поддержки, чтобы протестовать против этого решения. Военное министерство было завалено звонками и письмами от простых рабочих, которые хотели вернуть своего заводского менеджера, до заместителей министров в различных других министерствах, требующих объяснений, почему люди, работающие в областях, имеющих решающее значение для военных усилий, были отстранены от своей работы. Похоже, что даже некоторые члены кабинета министров передумали относительно войны - возможно, опасаясь за безопасность своих собственных сыновей."
 stability.36.a:0 "Неужели у них нет чувства долга?"
 stability.37.t:0 ""Тяжелый и священный долг""
 stability.37.desc:0 ""Конечно, я хочу жить. Я хочу закончить школу, встретить девушку, создать семью, но если мы проиграем эту войну, я тоже не смогу этого сделать. Поэтому я сражаюсь.\n\nПисьмо, которое было анонимно отправлено в каждую крупную газету страны, вызвало огромный резонанс. Тот факт, что оно было написано солдатом, который сначала пытался избежать призыва, но потом осознал, что должен сражаться за свою страну, по-видимому, задел за живое многих других людей с такими же мыслями. Военные советы по всей стране сообщают, что число тех, кто отказывается отвечать на повестки, более чем компенсируется числом новых добровольцев, которые больше не ждут, когда их призовут, а сами идут воевать за свою страну и образ жизни.""
 stability.37.a:0 "Мы не позволим, чтобы их жизни были потрачены впустую."
 stability.38.t:0 "Конец труса"
 stability.38.desc:0 "«Его привели к стене на рассвете. От последней сигареты он отказался, но принял повязку. Его последние слова были извинениями перед матерью за то, что причинил ей столько боли. Расстрельная команда прицелилась хорошо. Через несколько минут прибывший врач объявил его мертвым».\n\nНесмотря на то, что всех уклонистов поймать не удалось, власти смогли провести ряд арестов. Учитывая тяжелое положение, в котором мы находимся, военное министерство решило судить этих людей по военному праву за то, что они не явились к исполнению своих обязанностей. Первая серия смертных приговоров уже вынесена, и осужденные были расстреляны. Эти меры, очевидно, возымели желаемый эффект. Похоже, что большинство людей предпочло возможность смерти на поле боя несомненной позорной смерти труса."
 stability.38.a:0 "Жаль, что до этого дошло"
 stability.39.t:0 "Мученик за мир"
 stability.39.desc:0 "Его вывели к стене на рассвете. Он отказался от последней сигареты, но принял повязку на глаза. Его последними словами были извинения перед матерью за то, что он причинил ей столько боли. Расстрельная команда целилась хорошо. Через несколько минут присутствовавший врач объявил его мертвым.\n\nОпубликованный отчет об исполнении смертной казни человека, приговоренного к смерти за неявку к месту службы, похоже, имел противоположный эффект. Вместо того, чтобы вернуть людей к порядку из страха перед последствиями, это сделало казненных моментальными мучениками за движение за мир. Их имена и истории жизни были опубликованы и очень четко отредактированы, чтобы представить их в лучшем свете. Массовые мирные демонстрации начались в нескольких крупных городах с требованием положить конец войне. Военное министерство сообщает, что оно получило ряд писем от призывников, в которых открыто говорится, что они не явятся к месту службы, заявляя, что они ни при каких обстоятельствах не будут участвовать в другой казни, кроме как в качестве лица, подлежащего казни."
 stability.39.a:0 "Вещи не обязательно улучшились."
 stability.40.t:0 "Новый курс для [Root.GetNameDef]"
 stability.40.desc:0 "В своей сегодняшней радиоречи [Root.GetLeader] объявил о начале «социальной революции». За следующий час он изложил систему реформ, охватывающую все сферы общественной жизни, пообещав каждому демобилизованному солдату образование, высокооплачиваемую работу и щедрую пенсию. Также он объявил о крупной строительной программе доступного жилья для молодых семей, которая должна начаться в день подписания перемирия. Судя по всему, это существенно повлияло на моральный дух. Из рекрутинговых пунктов по всей стране поступают сообщения о призывниках, интересующихся возможностью продлить срок службы после окончания текущего конфликта, а некоторые требуют перебросить их на передовую, чтобы получить дополнительные льготы."
 stability.40.a:0 "И как же мы за все это заплатим...?"
 strikes_event.1.t:0 "Порядок восстановлен"
 strikes_event.1.desc:0 "Военное командование быстро отреагировало и мобилизовало на службу несколько учебных подразделений, сформировав импровизированные группы солдат, находящихся в отпуске. Прохождение этих формирований мимо ворот заводов дало желаемый эффект, поскольку большинство бастующих не желали вступать в противостояние, которое могло иметь смертельные последствия. Некоторым бастующим удалось убедить солдат присоединиться к общему делу, однако их слова не возымели должного действия: солдаты спрашивали, почему рабочим в уютном тылу позволено подводить сражающихся на передовой."
 strikes_event.1.a:0 "Действительно, почему."
 strikes_event.2.t:0 "Кровавый понедельник"
 strikes_event.2.desc:0 "Военное Верховное командование, быстро отреагировав, мобилизовало ряд учебных подразделений для несения службы и сформировало временные группы из находящихся в отпуске солдат. Однако передислокация этих формирований в затронутые города оказалась намного сложнее, чем ожидалось, поскольку бастующие заблокировали железнодорожные пути и заставили войска идти пешком, что дало им достаточно времени на подготовку. Когда наши войска достигли баррикадированных заводов, то увидели, что бастующие готовы к их приходу. Попытки расчистить дороги натолкнулись на яростные атаки рабочих, которые бросали в солдат камни и бутылки. \n\nВ нескольких случаях солдаты открывали огонь для самообороны, убив ряд бастующих и ранив еще больше. Это только еще больше разозлило толпу, а крики «Убийцы!» наполнили воздух от собравшихся. Настроение в столице резко изменилось в пользу бастующих. С наступлением ночи солдаты отступили, оставив баррикады нетронутыми. \n\nБольше не было никаких попыток решить ситуацию силой. Бастующие по-прежнему контролируют заводы, и работа не ведется."
 strikes_event.2.a:0 "Не по плану."
 strikes_event.3.t:0 "Герои на производственном фронте"
 strikes_event.3.desc:0 "\"Индустриальная война - это не просто передвижения дивизий и бомбардировка самолётов. Это больше, чем долг солдата - сражаться и умирать за свою страну. Индустриальная война в первую очередь выигрывается на заводах и фабриках. Отказ от борьбы на конвейере ничем не лучше отказа от борьбы на фронте. А победы на конвейере следует праздновать не меньше, чем победы на фронте.\"\n\nВсе имеющиеся ресурсы пропаганды были перенаправлены, чтобы показать работу рабочих, производящих оружие, в максимально выгодном свете. [Root.GetLeader] лично одобрил новую награду, которая будет вручаться рабочим, перевыполнившим свою норму более чем на 100%, а первых получателей направил на ознакомительные поездки по стране, чтобы обучить других рабочих своим методам.\n\nПохоже, это заставило многих бастующих пересмотреть свою позицию. Работа возобновилась на всех ранее затронутых заводах."
 strikes_event.3.a:0 "Все как один - герои."
 strikes_event.4.t:0 "Министерство военного производства"
 strikes_event.4.desc:0 "[Root.GetLeader] сегодня объявил о нескольких незначительных изменениях в призыве. В то время как ранее квалифицированные работники освобождались от военной службы, теперь это исключение было отменено, и все освобожденные люди были немедленно призваны на военную службу. Одновременно с этим военное ведомство получило полномочия брать под свой прямой контроль любой завод, производящий товары, относящиеся к военным усилиям, если руководство этих заводов проявит отсутствие способностей.\n\nОбъявление было встречено безмолвной покорностью в пострадавших городах, особенно после того, как было объявлено, что с любым сопротивляющимся будут обращаться так же, как с солдатом, отказавшимся выполнять приказы. Хотя моральный дух рабочих на фабриках находится на самом низком уровне, производство возобновлено.
 strikes_event.4.a:0 "Следовало сделать так с самого начала."
 strikes_event.5.t:0 "Страна в неповиновении"
 strikes_event.5.desc:0 "[Root.GetLeader] сегодня анонсировал некоторые мелкие изменения в воинской повинности. Ранее работники с квалифицированными специальностями были освобождены от призыва в армию, однако теперь это исключение отменено, и все ранее освобожденные мужчины призываются немедленно. В то же время военное министерство уполномочено взять под прямой контроль любой завод, который выпускает товары, относящиеся к военным действиям, если руководство этих заводов продемонстрировало отсутствие должной квалификации.\n\nОбъявление было встречено большим смехом в пострадавших городах, особенно после того, как стало известно, что любой, кто сопротивляется, будет рассматриваться так же, как солдат, отказавшийся выполнять приказы. Полицейским, направленным для вручения повесток о призыве на военную службу, было приказано возвращаться с результатом, превышающим чернила на бумаге."
 strikes_event.5.a:0 "Может быть, нам стоит."
 strikes_event.6.t:0 "Полезные едоки"
 strikes_event.6.desc:0 "Не упоминая о происходящих забастовках, [Root.GetLeader] объявил сегодня, что работники, занятые в важных для ведения войны отраслях, будут получать дополнительные пайки сахара, кофе и мяса для поддержания сил. К сожалению, слухи о том, что правительство готово выдавать дополнительный шоколад, оказались ложными.\n\nХотя зачинщики забастовки пытаются удержать рабочих от возвращения к работе, большинство, похоже, приняли тот факт, что «Мир и хлеб» так и не наступят, и довольствуются просто хлебом."
 strikes_event.6.a:0 "Им лучше заработать себе на жизнь."
 strikes_event.7.t:0 "Операция «Черный дуб»
 strikes_event.7.desc:0 "Войска собрались за городом ночью, соблюдая тишину и светомаскировку, чтобы сохранить элемент неожиданности. Когда солнце взошло над горизонтом, а рабочие, стоявшие на баррикадах у заводов, ждали, когда их сменит дневная смена, колонны атакующих двинулись вперед. Уставшие рабочие медленно организовали сопротивление и быстро были побеждены. Оставив небольшой отряд охранять пленных, войска прочесали город, арестовав всех, кто был в списке известных рабочих фабрики. К полудню военные взяли под полный контроль города и ввели комендантский час. Дальнейшего сопротивления не ожидается. Большинство рабочих вскоре будут освобождены при условии, что они вернутся к работе, зачинщики будут задержаны и преданы суду. Ожидается, что будут вынесены смертные приговоры."
 strikes_event.7.a:0 "Порядок восстановлен."
 strikes_event.8.t:0 "Битва за улицу Оук"
 strikes_event.8.desc:0 "Войска собрались за городом в ночное время, но плохой свет и шум нарушили маскировку. При приближении войск рабочие оказались настороже и готовыми отразить нападение. Первая атака провалилась под градом камней. Вторая атака с применением штыков была отражена в жестокой рукопашной схватке, в ходе которой десятки человек были убиты и ранены на улицах.\n\nКомандующий войсками отступил для перегруппировки сил, в то время как рабочие усилили укрепления и вооружились брошенным во время отступления оружием. На следующий день ожидается новый день сражений, но Военное Верховное командование больше не верит в вероятность победы."
 strikes_event.8.a:0 "Варианты быстро заканчиваются."
 strikes_event.9.t:0 "Закон о защите прав трудящихся"
 strikes_event.9.desc:0 "В связи с напряженной обстановкой в столице [Root.GetLeader] объявил о принятии нового закона о защите прав трудящихся даже в военное время. Новый всеобъемлющий законодательный акт предусматривает неограниченный оплачиваемый больничный отпуск, обязательное страхование от несчастных случаев для каждого работника, право вступать в профсоюз, а также впервые устанавливается право работниц на декретный отпуск после рождения ребенка.\n\nМногие члены правительства считают, что это полная капитуляция перед бастующими, но результаты неоспоримы: во всех фабриках возобновилась работа."
 strikes_event.9.a:0 "Надеюсь, этого будет достаточно."
 mutiny_event.1.t:0 "Бунт подавлен"
 mutiny_event.1.desc:0 "После нескольких часов напряжённых переговоров у ворот казарм и передовой землянки, мятеж в нашей армии закончен. Столкнувшись с перспективой сражения, которое они не могут выиграть, мятежники быстро решили сдаться. \n\nПервоочередным вопросом стала судьба тех, кто отказался от приказов. Высшее военное командование выступило за снисхождение и заверило мятежников, что они не будут сурово наказаны. Были сделаны несколько исключений, в которых некоторые солдаты были понижены в звании и переведены в другую часть."
 mutiny_event.1.a:0 "Будем надеяться, что это последний такой случай"
 mutiny_event.2.t:0 "Пустая угроза"
 mutiny_event.2.desc:0 "Попытки запугать мятежников с целью принуждения к подчинению дали обратный эффект, так как войска проявили слабый страх перед подразделениями, отправленными для их подавления. Используя навыки, отточенные на передовой, они быстро организовали оборону своих позиций, что сделало бы любую попытку их разгрома очень затратной. \n\nОфицеры, отвечающие за лояльные подразделения, отступили и ждут дальнейших приказов, но этот небольшой успех, несомненно, укрепил решимость мятежников."
 mutiny_event.2.a:0 "Никто не мог этого предвидеть."
 mutiny_event.3.t:0 "За что МЫ воюем?"
 mutiny_event.3.desc:0 ""Для солдата не редкость задаться вопросом, стоит ли всё это того, чем он занимается. Может ли что-нибудь оправдать жертвы, которых мы просим? Можем ли мы действительно требовать от вас потенциально умереть в погоне за целью, которой вы никогда не увидите?\n\nК несчастью, нам приходится жить во времени, в которое мы родились. Судьба решила, что мы должны воевать, чтобы защитить нашу свободу, наши дома, наш [Root.GetAdjective] образ жизни! Мы не выбирали эту войну, она была навязана нам! Вы знаете, что я не попрошу вас ни о чем, чего бы не был готов сделать сам, и я знаю, что вы сделаете все необходимое для обеспечения победы.\n\nРечь [Root.GetLeader]а перед войсками, похоже, возымела желаемый эффект, поскольку солдаты разразились стихийными возгласами и вернулись к своим обязанностям, не жалуясь больше обычного.""
 mutiny_event.3.a:0 "Хорошая речь."
 mutiny_event.4.t:0 "Акт об измене на войне"
 mutiny_event.4.desc:0 "Хотя военное министерство делает все возможное, чтобы скрыть факт бунта в армии, цензура писем не поможет. Солдаты, находящиеся в отпуске, быстро распространяют слухи о том, что армия больше не желает проливать кровь в этой войне.\n\nНе упоминая бунт напрямую, [Root.GetLeader] сегодня заявил, что правительство теперь будет считать все действия, свидетельствующие об отсутствии приверженности войне, изменой.\n\nНаказание за измену хорошо известно, и общественная поддержка мятежников практически исчезла. Эта новость, конечно же, была широко распространена. Видя слабую поддержку со стороны населения, солдаты спокойно возобновили выполнение своих обязанностей."
 mutiny_event.4.a:0 "Нам не следовало говорить об этом прямо."
 mutiny_event.5.t:0 "Попытка подавления провалилась"
 mutiny_event.5.desc:0 "Хотя военное министерство делает все возможное, чтобы скрыть факт бунта в армии, цензура писем не поможет. Солдаты, находящиеся в отпуске, быстро распространяют слухи о том, что армия больше не желает проливать кровь в этой войне.\n\nПопытки правительства остановить этот поток полностью провалились. Сообщения от тайной полиции указывают на то, что мятежники пользуются сильной поддержкой населения, что делает маловероятным их изоляцию и подавление."
 mutiny_event.5.a:0 "Это неуважение к законам вызывает глубокую озабоченность."
 mutiny_event.6.t:0 "Мирный план [Root.GetAdjective]"
 mutiny_event.6.desc:0 "[Root.GetLeader] сегодня заявил на пресс-конференции, что его последние мирные предложения отклонены. Причины этого неудачного оборота событий весьма сложны, но [Root.GetAdjective] требование того, чтобы другая сторона оплатила весь нанесенный ущерб, полностью разоружилась и публично признала, что развязала войну, возможно, стало последней каплей.\n\nНаши враги ответили тем же, назвав наши разумные требования ультиматумом о безоговорочной капитуляции. Они пообещали продолжать эту войну до победного конца.\n\nПоскольку наши враги явно не хотят внять доводам разума и обещают продолжить борьбу, попытки мятежников добиться мирного соглашения провалились."
 mutiny_event.6.a:0 "Ужасный позор."
 mutiny_event.7.t:0 "Военные репрессии увенчались успехом."
 mutiny_event.7.desc:0 "Несмотря на несколько случаев, когда небольшие группы мятежников решили дать бой, наша операция по подавлению восстания стала ошеломляющим успехом. Полагаясь на численность, а не на мастерство, лояльные ополченцы окружили цитадели мятежников и потребовали их капитуляции. Большинство солдат решили не поднимать оружие против своих соотечественников и сдались мирно.\n\nЗачинщики будут осуждены на закрытом военном трибунале, а рядовые солдаты будут отправлены обратно на фронт, хотя и в другие подразделения, чтобы предотвратить создание новых ячеек мятежниками."
 mutiny_event.7.a:0 "Хорошо сделано."
 mutiny_event.8.t:0 "Брат против брата"
 mutiny_event.8.desc:0 "Наши попытки не допустить выборов в Советы рабочих и солдат привели к резкому обострению ситуации, даже более печальному, чем самые мрачные прогнозы. Вместо капитуляции мятежники сформировали временные Советы, избрали полевых командиров и организовали оборону на улицах. Ясно, что они хотят превратить это в настоящее сражение.\n\nТеперь армия раскололась до самых низов — по подразделениям и даже по семьям. [Root.GetNameDefCap] оказался на грани гражданской войны."
 mutiny_event.8.a:0 "Всё становится только хуже."
 mutiny_event.9.t:0 "Новый тип офицеров"
 mutiny_event.9.desc:0 "Несмотря на серьёзные возражения со стороны командования, во всех подразделениях [Root.GetAdjective] армии были проведены выборы командиров. Результаты оказались весьма неожиданными, так как большинство избранных — заслуженные солдаты с большим боевым опытом. И хотя многие профессиональные офицеры по-прежнему воспринимают это как личное оскорбление, очевидно, что большинство солдат положительно относится к этой ситуации."
 mutiny_event.9.a:0 "Неужели это может сработать?"
 if_they_accept:0 "Если они согласятся:\n"
 if_they_reject: "Если они откажутся:\n"
 canada_vanilla.1.title:0 "Ронни, пулемётчица Bren"
 canada_vanilla.1.desc:0 "Во время Второй мировой войны около миллиона канадских женщин вышли на работу. В национальных СМИ их представлял символ стойкости и патриотизма: Вероника Фостер, известная как Ронни, девушка с пулемётом Брен. Она работала в оружейной компании John Inglis and Company в Торонто, пока её трое братьев сражались за рубежом. Плакаты и короткие фильмы с ней и такими, как она, женщинами, участвующими в военных действиях, возможно, вдохновили более известную медиакампанию "Рози-заклепщицы" после вступления Америки в войну."
 canada_vanilla.1.opt:0 "Работа на заводе не труднее, чем работа по дому, как говорят в кинохрониках."
 usa.30.t:0 "Выборы в Конгресс"
 usa.30.desc:0 "Каждые два года на выборах переизбирается треть Сената и все места в Палате представителей. Хотя события в мире зачастую отвлекают от этого, положение дел в каждом округе иногда может иметь решающее значение. \n\nПосле подсчёта всех голосов фракция, поддерживающая правительство, в Сенате [USA.GetSenateElectionOutcome] и в Палате представителей [USA.GetHouseElectionOutcome]."
 usa.30.a:0 "Народ высказался."
 SenateElectionLost:0 "потеряно [?sen_loc] мест"
 SenateElectionGained:0 "получено [?sen_loc] мест"
 HouseElectionLost:0 "потеряно [?ror_loc] мест"
 HouseElectionGained:0 "получено [?ror_loc] мест"
 usa.31.t:0 "Изменение политического ландшафта"
 usa.31.desc:0 "Так как в офисе теперь новый президент, бывшая оппозиция в Конгрессе решила поддержать новую администрацию. Президент [USA.GetLeader] может рассчитывать на поддержку [?senators_support] сенаторов и [?representatives_support] представителей."
 usa.31.a:0 "Люди высказались."
 usa_congress_elections_tt_bad:0 "На выборах в Конгресс фракция, поддерживающая правительство, столкнется с более сильным противодействием.\n"
 usa_congress_elections_tt_good:0 "Подъем на президентских выборах, вероятно, повлияет и на выборы в Конгресс.\n"
 usa.32.t:0 "Правительственная фракция получает большинство в Конгрессе"
 usa.32.desc:0 "Похоже, реформы избирательной системы, которые мы ввели, оказались весьма успешными, так как на последних выборах в Конгресс было избрано большое количество наших сторонников. С солидным большинством мы легко сможем провести в жизнь наши политические инициативы."
 usa.32.a:0 "Явный признак нашей поддержки населением."
 usa.40.t:0 "Сенатор голосует за предложение правительства"
 usa.40.desc:0 "В ходе недавнего голосования один сенатор неожиданно переметнулся на сторону правительства и проголосовал за его предложение. Хотя сам вопрос был незначительным, публичное выражение поддержки со стороны откровенного критика [USA.GetLeader] вызвало массу пересудов в Вашингтоне.\n\nНекоторые аналитики полагают, что этот пример побудит еще больше сенаторов пересмотреть свою позицию."
 usa.40.a:0 "Полезный союзник."
 usa.41.t:0 "Представитель выступает в поддержку правительства"
 usa.41.desc:0 "Когда на благотворительном ужине у представителя спросили о его позиции по ряду политических вопросов, он выступил в поддержку политики президента [USA.GetLeader]. Он также заявил, что многие его коллеги-представители придерживаются аналогичных взглядов, но их сдерживает "идиотская близорукость, которая не выходит за пределы следующих выборов", вместо того, чтобы делать то, что правильно для американского народа.\n\nЕго комментарии были широко освещены прессой и поставили нескольких его коллег в затруднительное положение, поскольку им пришлось объяснять свою позицию по этим вопросам."
 usa.41.a:0 "Она права, знаете ли."
 usa.42.t:0 "Сенатор высказывается против правительственной политики"
 usa.42.desc:0 "Сенатор дал интервью крупной газете, в котором заявил, что больше не может поддерживать "глупую и опасную" политику президента [USA.GetLeader]. Он также утверждал, что знал нескольких других сенаторов, которые думают так же и вскоре откажутся от поддержки президента."
 usa.42.a:0 "Он скоро прибежит назад."
 usa.43.t:0 "Представитель критикует президента"
 usa.43.desc:0 "Во время недавних дебатов о налоговой реформе один из представителей произнес пространную речь о многочисленных недостатках Администрации. По его словам, ни один здравомыслящий американец не может поддерживать политику Президента, независимо от его партийной принадлежности.\n\nЕго резкие слова, похоже, возымели действие, так как ряд представителей, ранее считавшихся твердыми сторонниками политики [USA.GetLeader], выразили поддержку."
 usa.43.a:0 "Возмутительно."
 usa.44.t:0 "Оппозиция потерпела поражение в Сенате"
 usa.44.desc:0 "В Сенате отклонено предложение о вынесении порицания президенту [USA.GetLeader]. Хотя даже самые ярые его сторонники не питали надежд на его принятие, количество голосов против стало шоком даже для самых пессимистичных наблюдателей. Очевидно, что в Сенате у Президента гораздо более высокий уровень поддержки, чем предполагалось большинством, что должно помочь в продвижении его законодательной повестки дня."
 usa.44.a:0 "Прекрасно."
 usa.45.t:0 "Комитет Палаты представителей поддерживает президентскую политику"
 usa.45.desc:0 "В результате последних раундов слушаний Комитета по налогам и средствам палаты представителей появился доклад, в котором правительству президента приписывается значительное улучшение по всем имеющимся показателям экономики. И хотя в докладе нет откровенной похвалы, это, тем не менее, наносит удар по тем, кто критиковал президента и требовал реформ.\n\nНесколько представителей уже публично заявили, что, хотя у них до сих пор есть сомнения в отношении повестки президента, они теперь будут голосовать в его поддержку."
 usa.45.a:0 "Как и следует ожидать."
 usa.46.t:0 "Сенатор уходит в отставку"
 usa.46.desc:0 "Сегодня, после перенесенного легкого сердечного приступа, высокопоставленный сенатор заявил, что уходит в отставку по состоянию здоровья. Проведя в Конгрессе более двух десятилетий, сенатор создал большую сеть сторонников, и его влияние имело большой вес. Хотя с технической точки зрения он всего лишь один человек с одним голосом, инсайдеры в Вашингтоне, тем не менее, считали его равным нескольким голосам, поскольку он был ключом к получению нескольких других.\n\nВ связи с тем, что место в Сенате, скорее всего, займет откровенный критик президента [USA.GetLeader], администрации станет намного сложнее обеспечить необходимое количество голосов для принятия законопроектов."
 usa.46.a:0 "Его будет не хватать. А также его голоса."
 usa.47.t:0 "Слушания в Палате представителей по делу о проступке президента"
 usa.47.desc:0 "Из Белого дома в СМИ просочились сведения о скандале с участием представителя администрации, принимавшего взятки в обмен на выгодные контракты от правительства. Комитет палаты представителей по расходам в исполнительной власти приступил к проведению слушаний, чтобы выяснить, был ли президент в курсе этого. Большинство экспертов полагают, что этот скандал не навредит президенту [USA.GetLeader], однако его сторонникам придется какое-то время не высовываться."
 usa.47.a:0 "Охота на ведьм."
 usa.61.t:0 "Сенатор от [USA_congress_investment_state.GetName] предлагает поддержку."
 usa.61.desc:0 "Старший сенатор от [USA_congress_investment_state.GetName] предложил правительству свою поддержку. Его штат страдает от катастрофически низкого уровня инвестиций, и правительственная программа экономического стимулирования, безусловно, заставит его пересмотреть свою позицию по некоторым предлагаемым правительством инициативам. Сенатор является членом нескольких важных комитетов и известен своим умением заключать сделки, что делает его голос более весомым в обеих палатах."
 usa.61.a:0 "Это очень слаборазвитый регион."
 usa.61.b:0 "Тут попахивает коррупцией."
 usa.62.desc:0 "Сенаторы из штата [USA_congress_investment_state.GetName] обратились к правительству и предложили свою поддержку президенту в обмен на неофициальную гарантию того, что именно в [USA_congress_investment_state.GetName] будет построен новый завод по производству боеприпасов для армии. Они утверждают, что строительство завода в этом районе позволит создать множество рабочих мест и даст армии столь необходимую поддержку в условиях растущей нестабильности в мире. Два сенатора также упомянули свои превосходные рабочие отношения с несколькими влиятельными членами Палаты представителей."
 usa.62.a:0 "Они приводят весомые аргументы."
 usa.62.b:0 "Президенту не подобает идти на такие сделки."
 usa.63.t:0 "Представители штата [USA_congress_investment_state.GetName] предлагают свою поддержку"
 usa.63.desc:0 "Делегация Конгресса США от штата [USA_congress_investment_state.GetName] обратилась к правительству с несколькими предложениями по улучшению инфраструктуры штата. Федеральное финансирование должно быть направлено на модернизацию дорог и мостов для развития торговли между штатами. Они также отметили, что поддержка правительства в данном вопросе, безусловно, побудит их более активно поддерживать повестку президента."
 usa.63.a:0 "Хвальная инициатива."
 usa.63.b:0 "Пусть сами попытаются ее продвинуть."
 usa.64.t:0 "Комитет Сената расследует судостроение в штате [USA_congress_investment_state.GetName]"
 usa.64.desc:0 "По настоянию сенатора от [USA_congress_investment_state.GetName] торговый комитет Сената начал расследование состояния местной судостроительной промышленности. По мнению экспертов, значительный процент торговли США зависит от заморской торговли, а стране крайне не хватает судостроительных мощностей. [USA_congress_investment_state.GetName] определен как регион, в который следует сделать крупные инвестиции, и несколько членов комитета выразили надежду, что администрация [USA.GetLeader] выделит средства на это."
 usa.64.a:0 "Критическая слабость."
 usa.64.b:0 "У нас есть более серьезные проблемы."
 news.334.t:0 "Инцидент с \"Панай\""
 news.334.d:0 "Сегодня в отдельных инцидентах самолеты [JAP.GetAdjective] атаковали американские и английские канонерские лодки, эвакуировавшие западных мирных жителей с передовой в войне между [JAP.GetName] и [CHI.GetName]. Несмотря на то, что судно было четко обозначено как американское, USS Panay получил два попадания бомб и затонул, в результате чего погибли трое американских и один итальянский гражданин, а другие получили ранения. В другом нападении на HMS Ladybird был убит один британский моряк.\n\nПравительства США и Великобритании выступили с резкими протестами. Инцидент высветил растущую напряженность между тремя крупнейшими военно-морскими державами."
 news.334.a:0 "Неужели у [JAP.GetName] нет никаких ограничений?"
 news.334.b:0 "Это может усложнить ситуацию"
 news.334.c:0 "Угроза со стороны [JAP.GetAdjective] приобретает большие масштабы"
 news.335.t:0 "Напряжение между [USA.GetNameDef] и [JAP.GetName] достигло предела"
 news.335.d:1 "\nНедавний инцидент с «Панай» вышел из-под контроля. Возмущение в [USA.GetNameDef] привело к тому, что ряд известных политиков потребовали немедленного возмездия против [JAP.GetNameDef]. [USA.GetAdjective] СМИ были наводнены новыми историями о зверствах [JAP.GetAdjective], некоторые из которых были правдой, некоторые преувеличены, а некоторые и вовсе выдуманы. Поскольку две великие державы находятся на грани войны, немногие обозреватели до сих пор сохраняют надежду на то, что ситуация может стабилизироваться."
 news.335.a:0 "Что это означает для Тихого океана?"
 news.335.b:0 "Помни о «Панай»!"
 news.335.c:0 "Пусть приходят!"
 news.335.e:0 "Плохие новости для Японии — хорошие новости для нас"
 news.335.f:0 "Это может усложнить ситуацию в Китае"
 news.336.title:0 "Помните о Аламо"
 news.336.desc:0 "Армия [MEX.GetAdjective] вновь заняла Техас после столетнего отсутствия. [USA.GetAdjective] войска были полностью выведены из крупных городов Техаса, включая Сан-Антонио и его знаменитую достопримечательность Аламо. Хотя на историческом месте не велись бои, [MEX.GetLeader] осмотрел помещения католической миссии, провел митинги и выступления, призывая войска продолжать сражаться за окончательную победу над ненавистными «янки»."
 news.336.a:0 "Мы помним."
 news.336.b:0 "Мы забыли."
 news.336.c:0 "Как [USA.GetLeader] допустил, что это случилось?"
 generic.19.t:0 "[From.GetName] отправляет промышленную поддержку"
 generic.19.d:0 "[From.GetNameDefCap] сообщил нам, что он поддерживает наше дело и предоставит нам определенную меру промышленной помощи для укрепления нашей позиции против наших общих врагов."
 generic.20.t:0 "[From.GetNameDefCap] требует нашего подчинения"
 generic.20.d_friends:0 "Сегодня мы получили делегацию, выражающую интерес [From.GetLeader] в расширении отношений между нашими странами и в принятии мер по объединению [Root.GetAdjective] людей вместе с [From.GetNameDef]. Согласие с предложением [From.GetLeader] сделает [Root.GetNameDef] умеренно автономной марионеткой [From.GetNameDef], и наше правительство будет реорганизовано во что-то большее в соответствии с видением [From.GetLeader].\n\nОстается вопрос, независимость [Root.GetAdjective] важнее нашей дружбы с [From.GetNameDef]?"
 generic.20.d_enemies:0 "Сегодня [From.GetNameDef] доставил сообщение, в котором требует, чтобы [Root.GetLeader] признал его главой государства, а наше государство было реорганизовано в соответствии с видением правительства [From.GetAdjective] для [Root.GetNameDef]. Согласившись, мы станем марионеткой [From.GetNameDef].\n\n Хотя мы бы предпочли не отдавать свою независимость врагам через границу, в их сообщении явно присутствует угроза, которая заставляет нас поверить, что если мы не выполним требования [From.GetLeader], мы вскоре окажемся в состоянии войны с [From.GetNameDef]."
 generic.20.a:0 "Подчиниться их требованиям."
 generic.20.b:0 "Лично я приветствую наших новых повелителей [From.GetAdjective]."
 generic.20.c:0 "Решительно нет!"
 generic.21.t:0 "[From.GetNameDefCap] подчиняется"
 generic.21.d:0 "Правительство [From.GetAdjective] согласилось отказаться от своей независимости и стать государством-марионеткой [Root.GetNameDef]. Мы уверены, что это приведет к величию и продвижению интересов [Root.GetAdjective] в регионе."
 generic.21.a:0 "Превосходно."
 generic.22.t:0 "[From.GetNameDefCap] бросает вызов!"
 generic.22.d:0 "Сегодня из [From.GetNameDef] прибыли дипломаты, чтобы объявить, что они отклонили наше предложение объединить [From.GetNameDef] с [Root.GetNameDef]. Как бы это ни было разочаровывающе, вариант привести [From.GetNameDef] в повиновение силой остается действительным и заманчивым."
 generic.22.a:0 "Разочаровывает."
 generic.23.t:0 "[From.GetNameDefCap] требует управления [demanded_prov_target.GetName]"
 generic.23.d:0 "Сегодня к нам пришла враждебная делегация из [From.GetNameDef], претендующая на всё государство [demanded_prov_target.GetName]. [From.GetLeader] требует, чтобы мы немедленно вернули территорию, иначе война неизбежна. Они утверждают, что [demanded_prov_target.Owner.GetAdjective] владение этим регионом незаконно, и что [demanded_prov_target.GetName] является неотъемлемой частью [From.GetAdjective] государства.\n\nЕсли мы примем их требования, [demanded_prov_target.GetName] будет передано [From.GetNameDef], но мы сохраним любые ядра или претензии, которые у нас есть на этот регион. Если мы откажемся, то между нашими государствами, по-видимому, неизбежна война."
 generic.23.a:0 "У нас нет выбора."
 generic.23.b:0 "[demanded_prov_target.GetName] останется [Root.GetAdjective]!"
 generic.24.t:0 "[demanded_prov_target.GetName] уступлен!"
 generic.24.d:0 "[From.GetNameDefCap] решил принять наше законное требование на [demanded_prov_target.GetName] и уступил регион [Root.GetNameDef].\nС таким оперативным и почтительным решением этого вопроса мы уверены, что мир между [Root.GetNameDef] и [From.GetNameDef] сохранится навечно."
 generic.25.t:0 "[From.GetNameDefCap] непокорен!"
 generic.25.d:0 "[From.GetNameDefCap] отклонил наши требования, и теперь мы должны решить, выполнять или нет наше обещание вторгнуться. Невыполнение нашего слова сильно повредит общественному восприятию [Root.GetLeader] и легитимности правительства [Root.GetAdjective]."
 generic.25.a:0 "Так или иначе, [demanded_prov_target.GetName] будет нашим."
 maybe_war_tt:0 "§RЭто может привести к войне с §!§Y[From.GetNameDef]§!"
 usa.401.t:0 "[From.GetNameDefCap] принимает соглашение об эсминцах на базы"
 usa.401.desc:0 "Британский премьер-министр [From.GetLeader] подал сигнал о своем согласии с условиями соглашения об эсминцах на базы. Группа офицеров флота [From.GetAdjective] прибыла для осмотра эсминцев и наблюдения за передачей.\n\nОчевидно, что еще есть работа, так как несколько офицеров [From.GetAdjective] кажутся немного обеспокоенными огромным количеством и толщиной гуано и ржавчины на передаваемых кораблях."
 usa.401.a:0 "Нищие не могут выбирать."
 spain.11.t:0 "Карлистское восстание"
 spain.11.d:0 "Карлисты сошли с ума!"
 spain.11.a:0 "О, нет"
 spain.12.t:0 "Анархистское восстание"
 spain.12.d:0 "Анархисты сошли с ума!"
 spain.12.a:0 "О, нет"
 lar_test.1.t:0 "TODO_LAR_BC: Заголовок теста"
 lar_test.1.d:0 "TODO_LAR_BC: это тест\nЭто:[This.GetName]\nОт:[From.GetName]\nFrom.From:[From.From.GetName]\nRoot:[Root.GetName]\n"
 lar_collab_gov.1.t:0 "[From.GetAdjective] партизаны в [Root.GetNameDef]"
 lar_collab_gov.1.d:0 "[From.GetNameDefCap] недавно усилили свои попытки развить коллаборационизм в нашей стране. Ряд [This.GetAdjective] политиков стали довольно благосклонно отзываться о [From.GetAdjective] режиме, а многие партизаны в нашей стране превратили свои [From.GetRulingIdeology] настроения в прямую поддержку [From.GetNameDef].\n\nРастущее [From.GetAdjective] влияние в нашей стране, несомненно, ослабит [Root.GetAdjective] сопротивление и, возможно, даже приведет к созданию нового [From.GetRulingIdeology] правительства в сотрудничестве с [From.GetNameDef] в случае капитуляции [Root.GetNameDef]."
 worrying:0 "Тревожно."
 ETH_events.1.t:0 "Эфиопия предлагает сепаратный мир"
 ETH_events.1.d:0 "С учетом того, что контроль над Сомалилендом и Эритреей практически полностью потерян, за исключением нескольких очагов сопротивления, эфиопское правительство предложило нам найти мирное завершение этих военных действий. Италия официально прекратит свое вторжение в Эфиопию и уступит оккупированные территории в Восточной Африке Эфиопии. Как нам ответить?"
 ETH_events.1.a:0 "Подписать договор."
 ETH_events.1.b:0 "Мы не можем позволить себе еще одно унижение!"
 ETH_events.101.t:0 "[From.GetNameDefCap] отказался от мира"
 ETH_events.101.d:0 "Несмотря на потерю контроля над всеми территориями в Восточной Африке, [From.GetLeader] отклонил наше предложение сепаратного мира. Кажется, полная капитуляция — единственный способ когда-нибудь закончить эту войну."
 ETH_events.101.a:0 "Обидно."
 germany.1041.t:0 "[FROM.GetNameDefCap] Требует Судеты"
 germany.1041.desc:0 "Несмотря на недавние потрясения на чехословацких границах, внешняя политика [FROM.GetAdjective] осталась непоколебимой. [FROM.GetAdjective] дипломаты отправили нам ультиматум: передайте Судеты, или будет объявлена война."
 germany.1041.a:0 "У нас нет выбора."
 germany.1041.b:0 "Военная машина [FROM.GetAdjective] остановится здесь."
 germany.1042.t:0 "[FROM.GetNameDefCap] Сдается"
 germany.1042.desc:0 "[ROOT.GetAdjective] могущество безгранично - Судеты полностью переданы нам. [FROM.GetAdjective] нация остается вне нашего поля зрения. Пока что."
 germany.1042.a:0 "Отлично."
 germany.1043.t:0 "[FROM.GetNameDefCap] Отклоняет требования"
 germany.1043.desc:0 "Несмотря на дисбаланс сил, [FROM.GetAdjective] дипломаты отвергли наши требования о передаче Судет. Очевидно, что должна следовать война."
 germany.1043.a:0 "Черт побери."
 GRE_turkey_surrenders:0 "Турция уступила греческим требованиям"
 germany.1050.t:0 "Смерть Фюрера"
 germany.1050.desc:0 "Фюрер, $GER_adolf_hitler$, найден мертвым в бункере. С приближением вражеских сил, кажется, что фюрер решил покончить с собой, а не рисковать быть захваченным в плен. Чтобы предотвратить падение боевого духа войск, наши пропагандистские рупоры инструктируются, что Гитлер сражался героически до последнего вздоха перед лицом превосходящих сил противника. Однако наш более насущный вопрос - кто станет преемником фюрера?"
 germany.1050.a:0 "$GER_karl_donitz$ был избранным преемником фюрера."
 germany.1050.b:0 "$GER_albert_speer$ реализует амбиции фюрера."
 germany.1050.c:0 "$GER_heinz_guderian$ вытащит нас из этой передряги."
 generic_purchase_ships_events.01.t:0 "[FROM.GetAdjective] закупка кораблей"
 generic_purchase_ships_events.01.desc:0 "[FROM.GetNameDefCap] обратились к нам с предложением закупить некоторые из наших законсервированных военно-морских активов. Актив, которым они интересуются, больше не используется из-за его возраста и отсутствия современного оборудования."
 generic_purchase_ships_events.01.a:0 "Взаимовыгодное соглашение."
 generic_purchase_ships_events.01.b:0 "Мы не можем позволить себе потерять военно-морские активы."
 generic_purchase_ships_events.02.t:0 "[FROM.GetNameDefCap] согласился на закупку кораблей"
 generic_purchase_ships_events.02.desc:0 "[FROM.GetAdjective] дипломаты и военно-морские офицеры сообщили нам, что они расстанутся со своим законсервированным оборудованием, которое мы предложили купить. Это позволит нам быстро расширить наш зарождающийся флот."
 generic_purchase_ships_events.02.a:0 "Великолепные новости!"
 generic_purchase_ships_events.03.t:0 "[FROM.GetNameDefCap] отклоняет сделку по продаже флота"
 generic_purchase_ships_events.03.desc:0 "Дипломаты из [FROM.GetAdjective] сообщили, что они не хотят расставаться со старым оборудованием, которое мы предложили купить. Неясно, связано ли это с их планами на корабли или является ли признаком несогласия с нашей политикой."
 generic_purchase_ships_events.03.a:0 "Очень жаль"
 AAT_germany.1.t: "[FROM.GetNameDefCap] просит права на ресурсы"
 AAT_germany.1.desc:0 "[FROM.GetNameDefCap] обратились к нам с предложением, которое, по их словам, будет выгодно обеим экономикам. Им нужны наши природные ресурсы для развития, а нам нужны их инвестиции, чтобы расширить наши. Выгодное предложение, но стоит ли ввязываться в эту авантюру?"
 AAT_germany.1.a: "Это не в наших интересах"
 AAT_germany.1.b: "От этого выиграют все!"
 AAT_germany.2.t: "[FROM.GetName] отклоняет нашу сделку"
 AAT_germany.2.desc:0 "[FROM.GetName] отвергли наше предложение, заявив, что сейчас это не в их интересах.\nОни подчёркивают, что не желают нам зла, но у них сейчас другие приоритеты."
 AAT_germany.2.a: "Очень жаль"
 AAT_germany.3.t: "[FROM.GetName] принимает нашу сделку"
 AAT_germany.3.desc:0 "[FROM.GetName] приняли наше предложение, что, безусловно, принесёт пользу обеим сторонам. Будем надеяться, что за этой выгодной сделкой последуют и другие."
 AAT_germany.3.a: "Великая"