l_russian:
  IRQ_GATHERING_STORM_DESC:0 "С тех пор, как Ирак стал относительно независимым государством, иракский народ надеется, что он превратится в могущественную державу в регионе и избавится от обременительных британских контрактов.\n\nНесмотря на то, насколько реалистично это желание, оно может вновь сделать Ирак частью другого государства и привести к концу жизни его правительства."
  iraq_all.1.t:0 "Ирак национализировал нефть!"
  iraq_all.1.d:0 ""
  iraq_all.1.a:0 ""
  iraq_all.1.b:0 ""
  iraq_all.2.t:0 "Загадочная смерть"
  iraq_all.2.d:0 "Сегодня для народа Ирака наступил скорбный день, так как их король Гази I попал в подозрительное ДТП, в результате которого погиб.\n\nОднако многие считают это акцией революционеров и британцев и не признают, что это была случайность.\n\nСултан Гази I правил своей страной более двадцати лет, установил в ней мир, укрепил армию, улучшил жизнь народа и всегда выступал против британцев, чтобы арабский народ жил свободно и не служил иностранцам.\n\nМы надеемся, что он займет достойное место на небесах. Салават."
  iraq_all.2.a:0 "Аллахумма салли аля Мухаммад уа аали Мухаммад"
  iraq_all.3.t:0 "Смерть Гази"
  iraq_all.3.d:0 "Сегодня очень горький день для народа Ирака, потому что их король Гази I попал в подозрительную аварию во время вождения, и эта авария привела к его смерти.\nНо многие люди считают, что это был акт революционеров и британцев и отрицают, что это было случайностью.\n\nСултан Гази I был человеком, который правил своей страной более двух десятилетий и установил в стране мир, укрепил армию, повысил благосостояние народа и всегда выступал против британцев, чтобы однажды арабский народ жил свободно, а не служил иностранцам.\nМы надеемся, что его место на небесах будет высоким."
  iraq_all.3.a:0 "Покойся с миром"
  #####################
  iraq_all.4.t:0 "Власть в руках армии"
  iraq_all.4.d:0 "Отныне власть находится в руках армии, и теперь настало время армии решать, что делать в будущем страны, это решение изменит Ирак.\n\nМы надеемся, что это решение заставит Ирак процветать и приведет нас к тому, что мы станем славной страной."
  iraq_all.4.a:0 "Монархия должна сохраняться, но под нашим контролем"
  iraq_all.4.b:0 "Правительство останется в наших руках"
  iraq_all.4.c:0 "Настало время настоящему правителю править страной"
  #####################
  iraq_all.5.t:0 "Ирак хочет Кувейт"
  iraq_all.5.d:0 "Иракское правительство просит [GetNameDef] присоединить Кувейт к Ираку.\nИракское правительство считает, что Кувейт на протяжении всей истории был частью Ирака, и надеется, что эта просьба будет выполнена путем соглашений."
  iraq_all.5.b:0 "Стоит принять их просьбу"
  iraq_all.5.a:0 "Кувейт - часть нашей страны"
  iraq_all.6.t:0 "Ирак требует Кувейт"
  iraq_all.6.d:0 "Правительство Ирака просит правительство [GetNameDef] аннексировать Кувейт к Ираку. Правительство Ирака считает, что Кувейт был частью Ирака на протяжении всей истории и его отделение от Ирака было результатом британской колониальной политики. Если [GetNameDef] отвергает эту просьбу, Ирак заберет его силой."
  iraq_all.6.a:0 "Лучше принять их просьбу"
  iraq_all.6.b:0 "Кувейт - часть нашей страны"
  iraq_all.7.t:0 "Война за Кувейт?"
  iraq_all.7.d:0 "Они абсолютно уверены, что не отдадут нам Кувейт и считают его частью своей территории.\nОни не оставили нам иного выбора. Боремся ли мы за то, чтобы захватить Кувейт и положить конец этим оскорблениям?"
  iraq_all.7.a:0 "Лучше прекратить конфликты."
  iraq_all.7.b:0 "Однозначно да"
  iraq_all.8.t:0 "Победа в Кувейте!"
  iraq_all.8.d:0 ""
  iraq_all.8.a:0 "Боль"
  iraq_all.9.t:0 "Поражение в Кувейте!"
  iraq_all.9.d:0 ""
  iraq_all.9.a:0 "Хорошо"
  iraq_all.10.t:0 "Государственный переворот"
  iraq_all.10.d:0 "Генерал Сидки, недавно назначенный начальником генерального штаба Королевской иракской армии. устроил то, что, вероятно, является первым современным военным переворотом в арабском мире против правительства Ясина аль-Хашими.\nОдиннадцать иракских военных самолетов сбросили листовки над Багдадом с просьбой к королю принять меры и отстранить администрацию Ясина аль-Хашими и назначить отстраненного антиреформаторского премьер-министра Хикмата Сулеймана.\n\nКроме того, в листовках предупреждалось, что военные действия будут предприняты против тех, кто не \"примет наш искренний призыв.\""
  iraq_all.10.a:0 "Лучше принять их просьбу на время"
  iraq_all.11.t:0 "День мести"
  iraq_all.11.d:0 "Пришло время показать Бакру Сиддики, каковы будут последствия попытки переворота, и это будет концом его жизни."
  iraq_all.11.a:0 "Сегодня день расплаты"
  iraq_all.11.b:0 "Больше конфликтов приводит только к большим конфликтам"
  iraq_all.12.t:0 "Побег от смерти"
  iraq_all.12.d:0 "В настоящее время иранское правительство держит под домашним арестом человека по имени Хазал Ибн Джабер, который известен как борец за свободу арабов. В Иране в последнее время чувствуется, что иранское правительство планирует его убить. Но с нашим влиянием на арабские регионы и сторонниками Хазала мы можем помочь ему бежать. Потому что этот человек может помочь нам в будущем своей силой.\nКроме того, это дело может даже привести к тому, что мы сможем отделить населенные арабами районы от Ирана."
  iraq_all.12.a:0 "Внутренние дела Ирана нас не волнуют"
  iraq_all.12.b:0 "Мы спасем нашего друга" 
  #####################
  iraq_all.13.t:0 "Он сбежал"
  iraq_all.13.d:0 "Охранники дома Хазала сообщили, что он сбежал с помощью нескольких человек; к сожалению, нам удалось арестовать лишь немногих из тех, кто ему помогал, поскольку выяснилось, что этот побег был спланирован Ираком."
  iraq_all.13.a:0 "Это действие положит конец нашим отношениям"
  ########################
  ###### ПУТЬ ГАЗИ ######
  ########################
  iraq_king.1.t:0 "Единство арабов"
  iraq_king.1.d:0 "Правительство [IRQ.GetName] призывает нас к объединению арабов, чтобы с помощью этого единства мы могли изгнать врагов и колонизаторов с этих земель."
  iraq_king.1.a:0 "Это единство — то, что нам нужно"
  iraq_king.1.b:0 "У нас другой план"
  #############################
  ###### ПУТЬ ДЕМОКРАТИИ ######
  ############################# 
  iraq_democratic.1.t:0 "Эпоха демократии"
  iraq_democratic.1.d:0 "Сегодня день процветания Ирака. Сегодня конец монархии и начало свободы и справедливости. Король должен сдаться правительству или уйти отсюда."
  iraq_democratic.1.a:0 "За Свободу!"
  #####################
  iraq_democratic.2.t:0 "Предложение Договора"
  iraq_democratic.2.d:0 "У иракцев есть предложение, в котором все арабские страны, которые хочет Ирак, могут извлечь выгоду из арабской международной помощи."
  iraq_democratic.2.a:0 "Этот договор станет началом нашей дружбы"
  iraq_democratic.2.b:0 "Нам никто не нужен"
  #####################
  iraq_democratic.3.t:0 "Оборонительный пакт с арабами"
  iraq_democratic.3.d:0 "Арабские альянсы в случае войны в этом регионе, если один из них будет атакован, он может удержать наших врагов от проникновения в этот регион. Объединимся ли мы под сенью Ирака?"
  iraq_democratic.3.a:0 "Этот пакт станет началом нашей дружбы"
  iraq_democratic.3.b:0 "Нам никто не нужен"
  #####################
  iraq_democratic.4.t:0 "Организация по нефти на Ближнем Востоке"
  iraq_democratic.4.d:0 "Ирак приглашает арабские страны поставлять лучшую нефть путем продажи нефти, создавая нефтяную организацию и заставляя западные страны жаждать этой нефти."
  iraq_democratic.4.a:0 "Мы тоже будем в этой организации"
  iraq_democratic.4.b:0 "Ух, кто заботится об этой организации"
  #####################
  iraq_democratic.5.t:0 "Время выборов"
  iraq_democratic.5.d:0 "Сегодня наступил день процветания Ирака. Сегодня монархия заканчивается и начинается свобода и справедливость.\nМы должны тщательно выбрать наше будущее, чтобы стать сильной и независимой страной и смотреть в будущее.\nНо кто принесет нам эту свободу и независимость?"
  iraq_democratic.5.a:0 "Ясин аль-Хашими"
  iraq_democratic.5.b:0 "Хикмат Сулейман"
  iraq_democratic.6.t:0 "[IRQ.GetName] хочет вступить в [ENG.GetFactionName]"
  iraq_democratic.6.d:0 "[IRQ.GetName] просит вступить в наш альянс.\nЭтот альянс хорош и для [IRQ.GetName] с точки зрения укрепления позиций в регионе, и для [ENG.GetName] с точки зрения доступа к нефти."
  iraq_democratic.6.a:0 "Они могут быть хорошими союзниками"
  iraq_democratic.6.b:0 "Они нам не нужны"
  iraq_fascist.1.t:0 "[IRQ.GetName] хочет вступить в [GER.GetFactionName]"
  iraq_fascist.1.d:0 "[IRQ.GetName] просит вступить в наш альянс.\nЭтот альянс хорош и для [IRQ.GetName] с точки зрения укрепления позиций в регионе, и для [GER.GetName] с точки зрения доступа к нефти."
  iraq_fascist.1.a:0 "Они могут быть хорошими союзниками"
  iraq_fascist.1.b:0 "Они нам не нужны"
  iraq_fascist.2.t:0 "Предложение Ирака атаковать [PER.GetName]"
  iraq_fascist.2.d:0 "Чтобы атаковать [PER.GetName], иракское правительство просит нас либо присоединиться к ним в войне, либо подписать пакт о ненападении, чтобы обе стороны не беспокоились о войне между Ираком и Турцией."
  iraq_fascist.2.a:0 "Мы поддерживаем Ирак в этой войне"
  iraq_fascist.2.b:0 "Мы поддерживаем [PER.GetName] в этой войне"
  iraq_fascist.2.c:0 "Эта война для нас не важна"
  iraq_fascist.3.t:0 "Ответ Турции на наше предложение"
  iraq_fascist.3.d:0 "[GetIraqFascist3Event]"
  iraq_fascist.3.a:0 "Хорошо"
  IraqFascist3AcceptDesc:0 "Турция приняла наше предложение о нападении на [PER.GetName] и будет поддерживать нас, это хорошая новость для нас."
  IraqFascist3RejectDesc:0 "В ответ на наше предложение Турция заявила, что любое нападение на [PER.GetName] равносильно войне с Турцией, и Турция против этой войны и хочет мира на Ближнем Востоке."
  IraqFascist3NeutralDesc:0 "Турция заявила, что эта война нас не касается и, чтобы это доказать, принимает пакт о ненападении."
  iraq_communist.1.t:0 "Ирак хочет вступить в Коминтерн"
  iraq_communist.1.d:0 "Иракское правительство просит присоединиться к нашему альянсу и с радостью примет такую ​​великую страну на своей стороне."
  iraq_communist.1.a:0 "Принять"
  iraq_communist.1.b:0 "Отклонить"
  iraq_communist.2.t:0 "Плохие новости"
  iraq_communist.2.d:0 "Советский Союз отклонил нашу просьбу стать членом Коминтерна и в настоящее время не считает целесообразным наше присутствие в этом союзе."
  iraq_communist.2.a:0 "Понятно"
  iraq_khazal.1.t:0 "Предложение вернуть наши земли"
  iraq_khazal.1.d:0 "Правительство Хазала предлагает нам помочь им в будущей войне с Ираном, а также получить наши и их требования к Ирану."
  iraq_khazal.1.a:0 "Пора забрать наши земли"
  iraq_khazal.1.b:0 "Мы не можем пойти на такой риск."
  iraq_khazal.2.t:0 "Отличные новости из Азербайджана"
  iraq_khazal.2.d:0 "Азербайджан сообщил в своем послании, что в случае войны они будут сражаться вместе с нами, чтобы вернуть свои земли."
  iraq_khazal.2.a:0 "Хорошо"
  iraq_khazal.3.t:0 "Плохие новости из Азербайджана"
  iraq_khazal.3.d:0 "Азербайджан сообщил в своем послании, что хочет вернуть свои земли, но не может пойти на такой большой риск, чтобы их вернуть, и эта война может для них плохо кончиться, в результате чего они попадут под власть другой страны."
  iraq_khazal.3.a:0 "А, хорошо"
  iraq_khazal.4.t:0 "Требование от [IRQ.GetName]"
  iraq_khazal.4.d:0 "[IRQ.GetNameDefCap] требует вернуть Азербайджан в состав [AZR.GetNameDef] как можно скорее."
  iraq_khazal.4.a:0 "Этого не произойдет"
  iraq_khazal.4.b:0 "У нас нет выбора"
  if_any_of_them_accept:0 "\n§JЕсли кто-либо из них согласится§!:"
  it_will_be_finished_from_the_decision:0 "§RОн будет завершён с помощью решения§!."
  if_current_ruling_party_is_fascist:0 "\n§JЕсли текущая правящая партия фашистская§!:"
  if_current_ruling_party_is_communist:0 "\n§JЕсли текущая правящая партия коммунистическая§!:"
  IRQ_prca_tokens_tt_add_100:0 "Токены пропаганды: §G+100§!"
  IRQ_economic_tree_info:0 "\nДобавляет два §Jгражданских завода§! к каждому штату, в котором 10 и более нефти."
  IRQ_economic_tree_info2:0 "\nДобавляет два §Jгражданских завода§! и один §Jвоенный завод§! к каждому штату, в котором 10 и более нефти."
  IRQ_major_army_eq_trigger_tt:0 "Более чем §J10000§! единиц пехотного снаряжения в армии"
  IRQ_economic_tree_info3:0 "\nДобавляет один §Jгражданский завод§! к каждому штату, в котором 10 и более нефти."
  IRQ_expand_military_industry_effect:0 "Добавляет один §Jвоенный завод§! к каждому подконтрольному штату на Ближнем Востоке, в котором есть хотя бы один §Jвоенный завод§! и §J500 тыс. населения§!.\n\n"
  khazal_occupy_khuzestan_effect:0 "§JХузестан§! окажется под нашим контролем, когда мы объявим войну Ирану."
  khazal_occupy_azerbaican_effect:0 "§JTабриз§! окажется под контролем азербайджанцев, и они объявят войну Ирану, когда мы объявим войну Ирану."
  khazal_occupy_azerbaican_effect2:0 "§YTabrize§! перейдет под наш контроль, и мы начнем войну против Ирана, когда Ирак объявит войну Ирану."
  khazal_state:0 "Эмират Хазал"
  khazal_caliphate:0 "Халифат Хазал"
  IRQ_khazal_ibn_jabir_desc:0 "Хазал Ибн Джабир - шейх и вождь племени бани кааб на юге Ирака. Родился в 1843 году в городе Басра. Хазал - выдающаяся фигура в политической и социальной истории Ирака начала 20-го века. Он известен своей ролью в переговорах с британским правительством по вопросу контроля над нефтяными месторождениями на юге Ирака.\n\nХазал - опытный переговорщик и смог обеспечить выгодные условия для своего племени и себя в нефтяных соглашениях с британцами. Он также сыграл важную роль в создании Королевства Ирак в 1921 году и занимал пост министра обороны в первом иракском правительстве. Однако отношения Хазала с правящей династией Хашимитов со временем ухудшились, и в итоге в 1932 году его отправили в ссылку в Лондон."
  prominent_figure:0 "Выдающаяся фигура"
  IRQ_khazal:0 "Эмират Хазал"
  IRQ_khazal_DEF:0 "Эмират Хазал"
  IRQ_junta:0 "Государство-хунта Ирак"
  IRQ_junta_DEF:0 "Государство-хунта Ирак"
  effects_after_a_week_tt:0 "\n§YПоследствия через неделю после их атаки:§!"
  they_have_only_one_week_tt:0 "§RУ них есть только одна неделя§!"
  bakr_sidqi_will_assassinated_tt:0 "§YБакр Сидки аль-Аскари§! будет убит."
  has_been_saved_khazal_tt:0 "Был спасен §YKhazal Ibn Jabir§!"