l_russian:
  ef_usa.1.t:0 "Запрос Макартура"
  ef_usa.1.d:0 "Макартур постоянно давит на нас, чтобы мы провели крупную кампанию по набору рекрутов. Он утверждает, что в текущей ситуации, когда обстановка накаляется, военная мощь Америки должна опережать другие страны. Хотя его запрос кажется частью другого плана, похоже, нам придётся согласиться из-за усиливающегося давления."
  ef_usa.1.a:0 "Одобрить"
  ef_usa.1.b:0 "Отклонить"
  ef_usa.2.t:0 "Текущая деятельность предателей"
  ef_usa.2.d:0 "Благодаря расширению ФБР, мы вплотную занялись наблюдением за многими предателями-политиками и военнослужащими. Мы знаем, где они находятся, чем занимаются, и кому продают наши данные."
  ef_usa.2.a:0 "Продолжить наблюдение"
  ef_usa.3.t:0 "Казнь предателей"
  ef_usa.3.d:0 "Пришло время избавиться от предателей, за которыми мы так долго вёл наблюдение, одновременно с осуществлением операций. Кроме того, данная ситуация заставит тех, кого мы ещё не опознали как предателей, задуматься о своих действиях и, возможно, даже прекратить их предательскую деятельность."
  ef_usa.3.a:0 "Начать операцию"
  ef_usa.4.t:0 "Налёт на картель"
  ef_usa.4.d:0 "В последнее время картели стали вновь набирать силу, воспользовавшись волнениями во внутренних делах. Тем временем мы дали им возможность окрепнуть, потому что были заняты борьбой с предателями в своих рядах. Теперь пришло время разгромить их."
  ef_usa.4.a:0 "Мы можем справиться с ними"
  ef_usa.4.b:0 "Расстрелять всех"
  ef_usa.5.t:0 "Война с картелем окончена"
  ef_usa.5.d:0 "После длительных конфликтов с картелями, нам удалось победить их до того, как они полностью окрепли. Эти ублюдки больше не побеспокоят нас."
  ef_usa.5.a:0 "Наконец-то"
  ef_usa.7.t:0 "Донесения от наших шпионов"
  ef_usa.7.d:0 "После капитуляции Объединённого фронта Китая мы остались единственным препятствием на пути продвижения Японии в Тихом океане. Нас защищают от японцев две вещи: наша вера и наш доблестный флот. Но разведка докладывает, что японцы день ото дня наращивают свои военно-морские силы и вот-вот превзойдут темпы роста нашего флота. Как бы ни продолжался экономический кризис, мы должны усилить наш щит против японских захватчиков, направив часть бюджета на развитие флота."
  ef_usa.7.a:0 "Боже, благослови Америку"
  ef_usa.8.t:0 "Доклад о смене стратегии США"
  ef_usa.8.d:0 "Товарищ генеральный секретарь, наша разведка подтверждает, что Пентагон сменил позицию. Они осознали, что прямое столкновение приведёт к взаимному уничтожению. Они готовятся к долгой борьбе, делая ставку на ядерное сдерживание и прокси-войны. Мы должны адаптировать нашу стратегию соответственно. Баланс страха отныне становится основным законом геополитики."
  ef_usa.8.a:0 "Мы закопаем их в долгосрочной перспективе."