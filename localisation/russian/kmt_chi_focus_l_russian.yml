  KMT_switched_to_internal:0 "Изменен политический фокус на внутреннюю стабильность"
  KMT_north_plan_tt:0 "Любой штат в §HМаньчжурии§! или §HСеверном Китае§! не принадлежит §H[Root.GetName]§!, и его текущий владелец не воюет с §H[Root.GetName]§!"
  kmt_nw_infra_tt:0 "Добавить 1 §Yинфраструктуру§! во всех штатах в регионах §YАмдо§! и §YВосточного Туркестана§!, §Y[616.GetName]§!, §Y[870.GetName]§!, и §Y[756.GetName]§!, если они принадлежат вам."
  kmt_south_infra_tt:0 "Добавить 1 §Yинфраструктуру§! во всех штатах в регионах §YЛянгуан§!, §YМинь-Кан§! и §YХунань§!, если они принадлежат вам."
  KMT_pioneering_the_north_east_tt:0 "Добавить 1 §Yинфраструктуру§! в каждом штате региона §YМаньчжурия§!, §Y[609.GetName]§! и §Y[862.GetName]§!, если они принадлежат вам.§!"
  KMT_will_forfeit_tibet_tt:0 "§RЕсли они примут нашу дружбу, мы больше не будем претендовать на регион Тибет ( §H[601.GetName], [604.GetName], [757.GetName], [322.GetName], [758.GetName]§!) как на неотъемлемую часть Китая§!"
  KMT_nolonger_inalienable:0 "§RБольше не считаем его неотъемлемой частью Китая§!"
  KMT_now_inalienable:0 "§GТеперь считаем его неотъемлемой частью Китая§!"
  KMT_holding_inalienable_parts_tt:0 "Владение любым штатом, который мы считаем неотъемлемой частью Китая"
