  KMT_promote_new_officers:0 "Реформировать высшее командование"
  KMT_promote_new_officers_desc:0 "Во время переворота командованием высшего звена были преимущественно другие офицеры, и сейчас оно сильно недоукомплектовано. Следует найти подходящих кандидатов на эти вакансии."
  KMT_get_some_new_high_commands:0 "§GПолучить несколько новых офицеров Высокого Командования.§!\n"
  KMT_bypass_some_commie_focus:0 "Предприняты определенные действия во время цепочки событий Инцидента в Сиане"
  KMT_finished_one_industrial_focus:0 "Завершил один фокус индустриализации"
  KMT_finished_two_industrial_focus:0 "Завершил два фокуса индустриализации"
  KMT_if_have_completed_democratic_tt:0 "\n§HЕсли завершен фокус§! §YОкончание народной опеки§! \n\n"
  KMT_if_have_completed_fascism_tt:0 "\n\n§HЕсли завершен фокус§! §YВоенная диктатура§! \n\n"
  KMT_if_have_completed_bb_tt:0 "\n§HЕсли завершен фокус§! §YВерховенство линкоров§! \n\n"
  KMT_if_have_completed_cv_tt:0 "\n§HЕсли завершен фокус§! §YAвиация флота§! \n\n"
  KMT_USA_agreed_to_assist_tt:0 "§Y[USA.GetName]§! согласились на дальнейшее сотрудничество"
  KMT_JAP_agreed_to_assist_tt:0 "§Y[JAP.GetName]§! согласились на дальнейшее сотрудничество"
  KMT_FRA_agreed_to_assist_tt:0 "§Y[FRA.GetName]§! согласились на дальнейшее сотрудничество"
  KMT_ENG_agreed_to_assist_tt:0 "§Y[ENG.GetName]§! согласились на дальнейшее сотрудничество"
  KMT_JAP_refused_to_assist_tt:0 "§Y[JAP.GetName]§! отказались от дальнейшего сотрудничества"
  KMT_will_have_the_following_idea_tt:0 "§HСледующий национальный дух будет добавлен после выбора:§!\n\n"
  KMT_will_remove_the_above_idea_tt:0 "\n§HВышеуказанный национальный дух будет удален, когда фокус будет завершен.§!\n\n"
  KMT_there_are_some_events_tt:0 "§YВо время активации фокуса будут запускаться некоторые события, которые будут оказывать небольшое влияние на эффект от данного фокуса.§!\n\n"
  ## 24/1/2018 ##
