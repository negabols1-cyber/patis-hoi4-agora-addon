  KMT_elite_mountaineers_tt: "Получить хорошо обученную дивизию §Yгорцев§!.\n"
  ## 12/2/2018 ##
  KMT_if_have_not_1922_1936_dd_researched_tt:0 "\n§H Если исследования эсминцев образца 1922 и 1936 гг. не были завершены:§!\n\n"
  KMT_if_have_1922_1936_dd_researched_tt:0 "\n§H Если исследования эсминцев образца 1922 и 1936 гг. были завершены:§!\n\n"
  KMT_if_have_not_1922_1936_cl_researched_tt:0 "\n§H Если исследования легких крейсеров образца 1922 и 1936 гг. не были завершены:§!\n\n"
  KMT_if_have_1922_1936_cl_researched_tt:0 "\n§H Если исследования легких крейсеров образца 1922 и 1936 гг. были завершены:§!\n\n"
  KMT_if_have_not_1922_1936_ca_researched_tt:0 "\n§H Если не исследовали 1922 и 1936 тяжёлых крейсеров:§!\n\n"
  KMT_if_have_1922_1936_ca_researched_tt:0 "\n§H Если исследовали 1922 и 1936 тяжёлых крейсеров:§!\n\n"
  KMT_if_have_not_1922_1936_ss_researched_tt:0 "\n§H Если не исследовали 1922 и 1936 подводные лодки:§!\n\n"
  KMT_if_have_1922_1936_ss_researched_tt:0 "\n§H Если исследовали 1922 и 1936 подводные лодки:§!\n\n"
  KMT_incorporate_warlord_forces:0 "[Root.GetIncorporateWarlordForcesName]"
  KMT_INTEGRATE_WARLORD_FORCES:0 "Интеграция армий полевых командиров"
  KMT_DESTROY_FACTIONS_IN_THE_ARMY:0 "Уничтожить фракции в армии"
  KMT_DISBAND_MILITIA:0 "Расформировать милицию"
  KMT_incorporate_warlord_forces_desc:0 "[Root.GetIncorporateWarlordForcesDesc]"
  KMT_INTEGRATE_WARLORD_FORCES_DESC:0 "В данный момент нашими вооружёнными силами управляют центральные войска и силы полевых командиров. Однако силы полевых командиров не всегда подчиняются нашим приказам. Если нам удастся \"заслужить их доверие\", наши вооружённые силы станут более эффективными."
  KMT_DESTROY_FACTIONS_IN_THE_ARMY_DESC:0 "Во время переворота некоторые военачальники получили достаточно много власти. Поэтому они создали фракции в наших вооружённых силах, чтобы защитить свои позиции. И хотя они не представляют угрозы для нашего правления, можно уничтожить эти фракции, чтобы улучшить координацию в армии."
  KMT_DISBAND_MILITIA_DESC:0 "Во время нашей революции против испорченного старого режима, многие местные фермеры и рабочие объединились в отряды ополчения для поддержки нашего дела. Тем не менее, эти отряды плохо организованы и иногда даже вступают в конфликты с нашей регулярной армией. Возможно, настало время немного встряхнуть систему."
  KMT_FOCUS_ON_CENTRAL_ARMY:0 "Сконцентрироваться на центральной армии"
  KMT_ENCOURAGE_FACTIONALISM_IN_THE_ARMY:0 "Поощрять фракционализм в армии"
  KMT_MILITIA_ASSAULT_TACTICS:0 "Милицейские штурмовики"
  KMT_FOCUS_ON_CENTRAL_ARMY_DESC:0 "Недисциплинированные войска военачальников не заслуживают нашего внимания. Их единственная польза - в качестве пушечного мяса и приманки, в то время как наша центральная армия наносит удар по врагам."
  KMT_ENCOURAGE_FACTIONALISM_IN_THE_ARMY_DESC:0 "Хотя фракционализм в нашей армии приводит к некоторым трудностям в координации атак и обороны, дух соперничества между разными фракциями вынуждает солдат сражаться яростнее, чтобы принести пользу своей клике. Мы можем использовать эти явления для создания более сильной армии."
  KMT_MILITIA_ASSAULT_TACTICS_DESC:0 "Фермеры и рабочие сформировали слабо организованные отряды ополчения во время нашей революции против старого режима. Эти отряды ополчения обладают низкой боеспособностью, но могут быть использованы в качестве штурмовиков или пушечного мяса, чтобы истощить наших врагов до того, как наши регулярные силы нанесут решающий удар."
  ## 12/4/2018 ##
  KMT_closer_tie_with_fra:0 "Выйти на связь с [FRA.GetName]"
  KMT_closer_tie_with_fra_desc:0 "Франция победила в великой войне, а её армия считается одной из сильнейших в мире. Мы могли бы усилить свою армию, если бы нам удалось заключить с ними соглашение."
  KMT_closer_tie_with_eng:0 "Помощь от Великобритании"
  KMT_closer_tie_with_eng_desc:0 "Передовые технологии и индустрия Великобритании могут принести нам определённую выгоду, если они согласятся помочь в развитии нашей нации."
  KMT_invite_foreign_investors:0 "Привлечь иностранных инвесторов"
  KMT_invite_foreign_investors_desc:0 "Иностранный капитал будет полезен для нашей национальной индустрии."
  KMT_closer_tie_with_usa:0 "Тесные отношения с США"
  KMT_closer_tie_with_usa_desc:0 "Хотя США сильно пострадали от Великой депрессии, они всё ещё остаются влиятельной державой. Их мощь значительно поспособствует развитию наших технологий и индустрии, если мы подружимся с ними."
  KMT_closer_tie_with_jap:0 "Сотрудничество с Японией"
  KMT_closer_tie_with_jap_desc:0 "Сила, продемонстрированная Японией, ошеломляет. Мы должны подчиниться и воспользоваться преимуществами, которые несёт такая мощь!"
  KMT_civ_control_of_mil:0 "Гражданский контроль над армией"
  KMT_civ_control_of_mil_desc:0 "В настоящее время Национальная революционная армия находится под прямым контролем Национальной партии. Мы должны передать контроль над армией гражданским лицам, чтобы быть уверенными, что она будет сражаться за народ и национальные интересы, а не за интересы партии.
  KMT_ministry_of_national_defense:0 "Министерство национальной обороны"
  KMT_ministry_of_national_defense_desc:0 "Централизованный орган национальной обороны является необходимым для сильной нации."
  KMT_allow_commie:0 "Терпеть коммунизм"
  KMT_allow_commie_desc:0 "Идеологический конфликт между нами и коммунистами принес слишком много боли людям. Пришло время положить этому конец и восстановить процветание в центральной равнине."
  KMT_military_dictatorship:0 "Военная диктатура"
  KMT_military_dictatorship_desc:0 "Демократия переоценена, государство, управляемое одним человеком, обладающим абсолютной властью, более эффективно, чем кучка болтливых шутов, сидящих в парламенте."
  KMT_our_own_fascism:0 "Фашизм с китайскими характеристиками"
  KMT_our_own_fascism_desc:0 "Ранее мы пытались подражать политике и управлению других фашистских наций, чтобы приблизить силу нашей нации к силам противника. Однако эти попытки оказались неэффективными, поскольку чиновники игнорировали фактическое положение дел в Китае и слепо следовали за ними. Мы должны принять во внимание то, в чем действительно нуждается Китай, и разработать такой вид фашизма, который идеально впишется в [Root.GetAdjective] систему."
  KMT_supreme_leader:0 "Укрепить власть нашего лидера"
  KMT_supreme_leader_desc:0 "Чтобы [Root.GetLeader] вывел [Root.GetName] в центр мирового внимания, мы должны убедиться, что политика [Root.GetLeader] может осуществляться без каких-либо помех."
  KMT_order_destroyers:0 "Приказ эсминцам"
  KMT_order_destroyers_desc:0 "Нам была оказана иностранная помощь. Чтобы улучшить флот нашей страны, мы должны усовершенствовать конструкцию наших кораблей. Заказ и изучение эсминцев иностранной конструкции — хороший способ начать."
  KMT_cruiser_researches:0 "Исследование легких крейсеров"
  KMT_cruiser_researches_desc:0 "Изучение иностранных конструкций легких крейсеров принесет пользу нашему флоту."
  KMT_sub_researches:0 "Исследование подводных лодок"
  KMT_sub_researches_desc:0 "Эффективность, продемонстрированная подводными лодками в торговой войне, исключительна. Мы должны приложить больше усилий для ведения неограниченной подводной войны."
  KMT_train_marines:0 "Программа подготовки морских пехотинцев"
  KMT_train_marines_desc:0 "Растущее значение десантных операций требует разработки современных сил морского десанта."
  KMT_heavy_cruiser_researches:0 "Исследование тяжелых крейсеров"
  KMT_heavy_cruiser_researches_desc:0 "Большая огневая мощь и высокая скорость на море делают тяжелые крейсеры неотъемлемой частью сильного флота по стандартам этой эпохи."
  KMT_coastal_patrol_planes:0 "Развитие морских бомбардировщиков"
  KMT_coastal_patrol_planes_desc:0 "Все усилия, затраченные на корабль, будут напрасны, если он будет потоплен. Однако самолеты строятся относительно быстрее и являются более расходными материалами. Они будут очень полезны для ослабления силы флота противника, прежде чем наши вступят в решающее сражение."
  KMT_battleship_supremacy:0 "Верховенство линкоров"
  KMT_battleship_supremacy_desc:0 "Благодаря превосходной морской огневой мощи и зенитной способности, в сочетании с непроницаемой броней, эти морские гиганты означают полное господство на воде."
  KMT_naval_aviation:0 "Морская авиация"
  KMT_naval_aviation_desc:0 "Удар с расстояния, недоступного для наших врагов, лишает их возможности дать отпор. Авианосцы станут новым стандартом сильного флота и откроют новую страницу в морской войне."
  KMT_saco:0 "SACO"
  KMT_saco_desc:0 "Китайско-американская кооперативная организация ставит целью оказывать разведывательную поддержку нашей армии и тренировать спецназ."
  KMT_hire_chennault:0 "Нанять Ченнолта"
  KMT_hire_chennault_desc:0 "Нельзя игнорировать необходимость наличия организованных ВВС. Клэр Ли Ченнолт, отставной американский лётчик, обладает столь необходимыми знаниями для того, чтобы поднять наши ВВС до современного уровня. Нам стоит рассмотреть его кандидатуру в качестве нашего советника по авиации."
  KMT_cacw:0 "Китайско-американское объединенное авиационное крыло"
  KMT_cacw_desc:0 "Китайско-американское объединенное авиационное крыло включает как китайских, так и американских пилотов и в основном американские самолёты. Это новое авиационное крыло будет играть решающую роль в победе в воздушном бою."
  KMT_the_international_squadron:0 "Международная эскадрилья"
  KMT_the_international_squadron_desc:0 "Ченнолт организовал наемную авиационную эскадрилью, состоящую из пилотов разных национальностей. Эта "Международная эскадрилья" также позволит нашей стране получить представление о воздушном бое."
  KMT_reorganise_the_air_force:0 "Реорганизация ВВС"
  KMT_reorganise_the_air_force_desc:0 "Благодаря полученному пониманию и знаниям о воздушных сражениях мы можем провести тщательную реформу наших ВВС и вывести их на современный уровень."

  KMT_improve_design:0 "Улучшение истребителей"
  KMT_improve_design_desc:0 "С новыми знаниями, полученными от Ченнолта, мы можем улучшить дизайн наших истребителей."
  KMT_fighter_purchases:0 "Покупка истребителей"
  KMT_fighter_purchases_desc:0 "Поскольку наша промышленность в настоящее время недостаточно развита, нам следует импортировать иностранные истребители, чтобы получить опыт в производстве самолетов."
  KMT_develop_our_own_fighters:0 "Разработка собственных истребителей"
  KMT_develop_our_own_fighters_desc:0 "С прибытием заказанных истребителей мы можем начать изучать их конструкцию и попытаться произвести рабочие копии."
  KMT_the_burma_road:0 "Строительство Бирманского тракта"
  KMT_the_burma_road_desc:0 "У нас нет времени ждать годами, пока сторонние компании завершат строительство Бирманского тракта, мы построим его сами!"
  KMT_british_training:0 "[ENG.GetAdjective] подготовка"
  KMT_british_training_desc:0 "Нам следует отправить некоторых наших солдат в лагеря [ENG.GetAdjective] для дополнительной боевой подготовки."
  KMT_joint_burma_def_agreement_tt:0 "§GПолучить 5 единиц, когда истечет срок действия национального духа§! §H[ENG.GetAdjective] подготовка§! §G.§!"
  KMT_setup_camco_assembly_plants:0 "Создание сборочных заводов CAMCO"
  KMT_setup_camco_assembly_plants_desc:0 "По Бирманской дороге к нам поступают авиазапчасти, для оптимального производства самолетов нам следует создать там сборочные заводы."
  KMT_local_fighter_prod:0 "Производство собственных истребителей"
  KMT_local_fighter_prod_desc:0 "С полученными на сборочных заводах навыками и знаниями мы теперь можем производить собственные истребители с более высоким темпом."
  KMT_local_bomber_prod:0 "Производство собственных бомбардировщиков"
  KMT_local_bomber_prod_desc:0 "С полученными на сборочных заводах навыками и знаниями мы теперь можем производить собственные бомбардировщики с более высоким темпом."
  KMT_yunnan_bahn:0 "Железная дорога Юньнань-Хайфон"
  KMT_yunnan_bahn_desc:0 "Железная дорога Юньнань-Хайфон - это железная дорога, которая соединяет Хайфон в Индокитае и Куньмин в Юньнани. Она может выступать в качестве допустимого маршрута снабжения и гарантировать стабильный приток иностранных поставок."
  KMT_purchase_french_equipments:0 "Приобрести [FRA.GetAdjective] вооружение"
  KMT_purchase_french_equipments_desc:0 "Изучив [FRA.GetAdjective] вооружение, мы можем взглянуть на секреты могущественной армии."
  KMT_french_military_mission:0 "[FRA.GetAdjective] военная миссия"
  KMT_french_military_mission_desc:0 "Найм отставных офицеров из французской армии в качестве советников поможет нам в реформировании нашей армии."
  KMT_french_drill:0 "[FRA.GetAdjective] учения"
  KMT_french_drill_desc:0 "Следуя стандартам [FRA.GetAdjective] армии, наша армия в кратчайшие сроки станет такой же сильной."
  KMT_static_defense:0 "Акцент на статической обороне"
  KMT_static_defense_desc:0 "Можно сделать вывод, что [FRA.GetAdjective] победил в Великой войне, выиграв войну на истощение, используя статическую оборону. С количеством людей и обширными территориями в нашем распоряжении, мы будем ещё более способны, чем [FRA.GetAdjective], принять статическую оборону и вести войну на истощение."
  KMT_mountaineers_training:0 "Тренировка горцев"
  KMT_mountaineers_training_desc:0 "Горная местность в Юннани требует специальной подготовки для того, чтобы войска могли сражаться, имея все преимущества."
  KMT_defense_of_indo_china:0 "Дела Индокитая"
  KMT_defense_of_indo_china_desc:0 "Франция пала. Мы можем отправить им просьбу о том, чтобы мы взяли на себя обязанности по защите Индокитая для них. Это позволит им сконцентрировать свои силы на европейском театре военных действий."
  KMT_joint_tank_dev:0 "Совместная разработка танков"
  KMT_joint_tank_dev_desc:0 "С помощью знаний зарубежных конструкторов танков мы сможем в короткие сроки разработать свой первый современный танк."
  KMT_local_tank_assembly_plants:0 "Местные танковые сборочные заводы"
  KMT_local_tank_assembly_plants_desc:0 "Локализованная линия производства танков станет вехой в военном прогрессе нашей страны."
  KMT_mechanised_warfare:0 "Механизированная война"
  KMT_mechanised_warfare_desc:0 "Эра побед за счёт забрасывания врага телами прошла. В будущих войнах бронированные машины будут играть важную роль."
  KMT_sino_soviet_non_agression_pact:0 "Китайско-[SOV.GetAdjective] пакт о ненападении"
  KMT_sino_soviet_non_agression_pact_desc:0 "Сила [SOV.GetName] очень внушительна. Если мы сможем заключить с ними пакт о ненападении, мы сможем не дать им влиять на нашу нацию, может быть, даже извлечем из этого какую-то выгоду."
  KMT_soviet_volunteer_groups:0 "Группы добровольцев [SOV.GetAdjective]"
  KMT_soviet_volunteer_groups_desc:0 "[SOV.GetName] дал добровольцам воздушных сил [SOV.GetAdjective] помочь нам в нашей войне."
  KMT_purchase_soviet_aircrafts:0 "Закупка самолетов [SOV.GetAdjective]"
  KMT_purchase_soviet_aircrafts_desc:0 "Для борьбы с врагами нам очень нужны боеспособные самолеты. [SOV.GetNameDefCap] была бы отличной целью для закупки самолетов."
  KMT_soviet_advisors:0 "Найм военных советников [SOV.GetAdjective]"
  KMT_soviet_advisors_desc:0 "Военные знания [SOV.GetName] несомненно помогут в развитии наших."
  KMT_soviet_tanks:0 "Закупка танков [SOV.GetAdjective]"
  KMT_soviet_tanks_desc:0 "[Root.GetSOVTankFocusDesc]"
  KMT_soviet_tanks_desc_1:0 "Чтобы не отставать от развития современной войны, у нас должны быть свои бронетанковые войска. Однако сейчас у нас нет промышленных мощностей для создания собственной танковой производственной линии. Сейчас подойдет импорт танков из [SOV.GetNameDef]."
  KMT_soviet_tanks_desc_2:0 "Заказ иностранных танков может помочь нам глубже понять развитие армии."
  KMT_soviet_equipments:0 "Приобрести [SOV.GetAdjective] оборудование"
  KMT_soviet_equipments_desc:0 "Изучая [SOV.GetAdjective] технику, мы сможем заглянуть в секреты сильной армии."
  KMT_chinese_general_staff:0 "Генеральный штаб Китая"
  KMT_chinese_general_staff_desc:0 "Генеральный штаб зарекомендовал себя как чрезвычайно эффективный орган стратегического планирования. Мы должны подражать [GER.GetAdjective] и создать свой собственный."
  KMT_war_gaming_division:0 "Штабное подразделение разработки и анализа оперативного взаимодействия"
  KMT_war_gaming_division_desc:0 "Расширение нашего генерального штаба за счёт подразделения, специализирующегося на разработке и анализе оперативного взаимодействия, значительно повысит качество наших военных планов."
  KMT_german_tanks:0 "Заказать [GER.GetAdjective] танки"
  KMT_german_tanks_desc:0 "У [GER.GetAdjective] есть уникальные идеи о применении танков, нежели у других традиционных сухопутных держав, таких как [FRA.GetName]. Мы можем взглянуть на эту новую мысль, изучив их танковые разработки."
  KMT_falkenhausen_citizenship:0 "Отправить курсантов в [GER.GetAdjective] академии"
  KMT_falkenhausen_citizenship_desc:0 "Отправка курсантов на учёбу за границу в [GER.GetAdjective] военные академии может дать нам возможность изучить более передовые военные стратегии."
  ## 15/08/2018 ##
  KMT_jap_no_longer_a_threat_tt:0 "[JAP.GetName] больше не представляет непосредственной угрозы для нашей нации."
  ## 19/09/2018 ##
  KMT_voting_rights_desc:0 "[Root.GetNewConstitutionDesc]"
  KMT_voting_rights_normal_desc:0 "Предыдущая конституция не может предотвратить тиранию и коррупцию. Чтобы полностью перейти к демократической республике, мы должны написать новую конституцию. Право голоса, право на свободу, контроль и сдерживание, все должно быть учтено. Китай должен стать нацией законов, а не нацией людей."
  KMT_voting_rights_dictator_desc:0 "Новый институт закрепит позицию нашего лидера в качестве единственного правителя страны. Обеспечение законной основы для пресечения любой оппозиции на корню."
