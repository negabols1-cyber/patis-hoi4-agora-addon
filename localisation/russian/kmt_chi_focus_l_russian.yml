l_russian:
  KMT_demand_soviet_puppets_tt:0 "Владелец государств Центральной степи ( §YМонголия§! и §YTува§! ) и области §YСиньцзян§! получит требование."
  KMT_demand_indochina_tt:0 "Владелец государств §YЛаос§!, §YTонкин§!, §YKамбоджа§! и §YЮжный Индокитай§! получит требование."
  KMT_improve_burma_road:0 "Улучшить Бирманский путь"
  KMT_improve_burma_road_desc:0 "Хотя британцы построили Бирманский путь, чтобы помочь в войне против японцев, сам путь не настолько эффективен, мы должны улучшить его."
  kmt_ftf_tt:0 "Получить истребители и пилотов из США.\n"
  KMT_sinkiang_integration:0 "Судьба Синьцзяна"
  KMT_sinkiang_integration_desc:0 "Синьцзян - законная китайская земля. Теперь, когда мы оба находимся под руководством великого Советского Союза, мы можем воспользоваться шансом попросить, чтобы Синьцзян был возвращен Китаю."
  KMT_invite_sik:0 "Пригласить Синьцзян"
  KMT_invite_sik_desc:0 "Если мы хотим следовать истинному пути марксизма-ленинизма, мы должны искать союзников, чтобы противостоять свиньям-ревизионистам в Коминтерне."
  KMT_war_with_sik:0 "Война с Синьцзяном"
  KMT_war_with_sik_desc:0 "Синьцзян, несомненно, - еще одна нация, пораженная свиньями-ревизионистами. Мы должны их устранить!"
  kmt_force_sik_bp_tt:0 "Вы или любая нация, находящаяся с вами в одной фракции, воюете с §YSиньцзяном§!."
  KMT_claim_central_government_con_focus:0 "Заявить о позиции центрального правительства"
  KMT_claim_central_government_con_focus_desc:0 "Китай будет управляться по нашим правилам!"
  KMT_own_central_gov_capital_tt:0 "Правит текущей столицей Центрального правительства : §Y[KMT_central_gov_capital_state.GetName]§!\n"
  KMT_will_take_scc_if_nk_falls_tt:0 "\n§YАннексирует [SCC.GetName] безоговорочно, если падет Нанкин.§!"
  KMT_stall_time_tt:0 "Решил тянуть время на послевоенной встрече с [PRC.GetLeader]"
  kmt_forts_in_nanking_tt:0 "Добавить 3 §YНаземные Форта§! в §YNанкин§!.\n"
  KMT_is_not_a_puppet_or_is_puppet_of_CHI_tt:0 "Существует по крайней мере один из перечисленных военных или властей, не воюет с [Root.GetName], и не является марионеткой или является марионеткой §Y[Root.GetName]§! :\n   §Y[GXC.GetName]\n   [QIA.GetName]\n   [XIA.GetName]\n   [ZXL.GetName]\n   [SDC.GetName]\n   [SHX.GetName]\n   [SCC.GetName]\n   [SKC.GetName]\n   [XSM.GetName]\n   [NSM.GetName]\n   [YUN.GetName]\n   [YUT.GetName]\n   [PGR.GetName]\n   [MEN.GetName]§!"
  KMT_none_is_puppet_or_is_puppet_of_CHI_tt:0 "Не существует ни одной из перечисленных военных сил/властей, не находящаяся в мире с [Root.GetName],, или является марионеткой и не является марионеткой §Y[Root.GetName]§! :\n   §Y[GXC.GetName]\n   [QIA.GetName]\n   [XIA.GetName]\n   [ZXL.GetName]\n   [SDC.GetName]\n   [SHX.GetName]\n   [SCC.GetName]\n   [SKC.GetName]\n   [XSM.GetName]\n   [NSM.GetName]\n   [YUN.GetName]\n   [YUT.GetName]\n   [PGR.GetName]\n   [MEN.GetName]§!"
  kmt_resources_focus_tootip_tt:0 "§GЗавершение этого фокуса запустит события по добавлению ресурсов в соответствующих регионах.§!\n\n"
  kmt_resources_focus_1_tootip_tt:0 "§GЗавершение этого фокуса запустит события по добавлению ресурсов в центральных регионах Китая.§!\n\n"
  KMT_external_defense_requirement_tt:0 "Необходимо находиться не в состоянии войны с любым из следующих военачальников/правительств :\n   §Y[GXC.GetName]\n   [QIA.GetName]\n   [XIA.GetName]\n   [ZXL.GetName]\n   [SDC.GetName]\n   [SHX.GetName]\n   [SCC.GetName]\n   [SKC.GetName]\n   [XSM.GetName]\n   [NSM.GetName]\n   [YUN.GetName]\n   [YUT.GetName]§!"
  KMT_supported_fyx_tt:0 "Не поддерживать Фэн Юйсяня после того, как Чан Кайши был убит в ходе Сианьского инцидента\n"
  KMT_german_approved_tt:0 "§Y[GER.GetName]§! согласилась на дальнейшее сотрудничество между нашими странами.\n"
  KMT_become_communism:0 "Подпольные коммунисты"
  KMT_become_communism_desc:0 "Хотя две предыдущие чистки, устроенные Гоминьданом, уничтожили некоторых коммунистов внутри партии, некоторые все еще остаются."
  KMT_kill_mao:0 "Следовать Четвертому Интернационалу"
  KMT_kill_mao_desc:0 "Троцкий был прав, Сталин предал революцию и народ в пользу бюрократии. Мы не должны следовать по пути Советского Союза и вместо этого продолжить революцию."
  KMT_recognize_maos_government:0 "Сотрудничать с ККП"
  KMT_recognize_maos_government_desc:0 "В рядах КПК уже установилась своя хорошая организованная структура. Объединившись с ними, мы внесли бы значительный вклад в крестьянскую революцию."
  KMT_privilege_to_proletarians:0 "красный переворот"
  KMT_privilege_to_proletarians_desc:0 "Время пришло, мы поднимем восстание против коррумпированного гоминьдана и вернем власть народу!"
  KMT_help_mao_infiltrate:0 "внедрить маоистов"
  KMT_help_mao_infiltrate_desc:0 "Маоистам было бы труднее внедряться в области, потому что они не являются членами Гоминьдана. Однако мы можем выполнить эти задания куда проще."
  KMT_invite_chen_duxiu:0 "пригласить Чэнь Дусю"
  KMT_invite_chen_duxiu_desc:0 "Чэнь Дусю был исключен из КПК после распада первого единого фронта. Затем он стал видным в Китае лидером троцкистов. Присоединившись к нам, наше движение, несомненно, получит большую общественную поддержку."
  ## 1/1/2018 ##
  KMT_join_comintern:0 "сотрудничать с советским союзом"
  KMT_join_comintern_desc:0 "Оказавшись в окружении врагов, разумно искать защиту в рядах наших товарищей из других народов. Сотрудничая с Советским Союзом, мы можем обеспечить наше положение и продвигать дело коммунизма во всем мире."
  KMT_boycott_the_comitern:0 "собственный путь"
  KMT_boycott_the_comitern_desc:0 "Советский Союз сошел с истинного пути марксизма-ленинизма. Мы пойдем своим путем, подальше от той коррупции, которая предала революцию."
  KMT_sov_advisors:0 "Советская помощь"
  KMT_sov_advisors_desc:0 "Мы можем запросить помощь от наших большевистских товарищей для поддержки нашего развития"
  KMT_from_each_accoring_to_his_ability:0 "От каждого по его способностям..." # весь лозунг слишком длинный, чтобы уместиться в ограниченном пространстве имени фокуса
  KMT_from_each_accoring_to_his_ability_desc:0 "После того, как порабощающее подчинение личности разделению труда исчезнет; после того, как труд станет не только средством к жизни, но и главной жизненной потребностью, и все источники совместного богатства потекут более обильно - только тогда общество сможет написать на своих знаменах: От каждого по его способностям, каждому по его потребностям!" # весь абзац слишком длинный, чтобы поместиться в ограниченном пространстве
  KMT_PRC_agrees_to_work_with_us_tt:0 "[PRC.GetName] согласился сотрудничать с нами.\n"
  KMT_will_get_reinforcements_when_launch_coup_tt:0 "§GПолучит дополнительные войска, когда фокус§! §RКрасный переворот§! §Gбудет завершен.§!\n"
  KMT_coup_prc_can_join_tt:0 "§Y[PRC.GetName]§! §Gможет также присоединиться к вам, если переворот перерастет в гражданскую войну.§!\n"
  KMT_gain_additional_pp_tt:0 "§GПолучит дополнительную политическую власть, когда фокус§! §RКрасный переворот§! §Gбудет завершен.§!\n"
  KMT_chen_duxiu_becomes_leader_tt:0 "§GЧэнь Дусю станет лидером коммунистической партии, когда фокус§! §RКрасный переворот§! §Gбудет завершен.§!\n"
  KMT_coup_depends_on_commie_pop_tt:0 "§YЭффект данного фокуса зависит от популярности компартии.§!\n\n"
  KMT_PRC_not_agrees_to_work_with_us_tt:0 "[PRC.GetName] отказался от сотрудничества с нами.\n"
