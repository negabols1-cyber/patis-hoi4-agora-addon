  ## 31/1/2018 ##
  KMT_jet:0 "Проект Инь-Ян"
  KMT_ballistic_weapon:0 "Проект Цин Фэн"
  KMT_ballistic_weapon_desc:0 "Настала эра ракетного оружия. Мы должны освоить эти новые системы вооружения, если хотим, чтобы наши армии выжили на современных полях сражений."
  ## 2/2/2018 ##
