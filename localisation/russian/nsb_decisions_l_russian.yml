  SOV_comecon_dec_cat_desc_alt:0 "$SOV_the_common_economic_space_initiative$"
  SOV_comecon_industrialization_program:0 "Программа индустриализации [FROM.GetNameDef]"
  SOV_comecon_industrialization_program_desc:0 "Мы проведем программу индустриализации в [FROM.GetNameDef], чтобы ускорить строительство новой отечественной промышленности и инфраструктуры."
  SOV_comecon_joint_military_program:0 "Совместная военная программа"
  SOV_comecon_joint_military_program_desc:1 "Мы разработаем совместную военную программу с нашими странами-партнерами для улучшения их возможностей в области обучения."
  SOV_comecon_industrialization_program_ongoing_flag:0 "Программа индустриализации §Yуже проводится§!"
  SOV_comecon_joint_military_program_ongoing_flag:0 "В настоящий момент действует решение §Y$SOV_comecon_joint_military_program$§!"
  SOV_comecon_industrialization_program_modifier_tt:0 "Изменить значение параметра §Y$SOV_comecon_sov_default$§!:\nФабрики потребительских товаров: §Y+8,0%§!\n§YЦелевая страна§!: \nИзменить значение параметра §Y$SOV_comecon_sov_default$§!:\nФабрики потребительских товаров: §Y-5,0%§!\nСкорость строительства: §G+20,00%§!"
  SOV_comecon_joint_military_program_modifier_tt:0 "Изменить значение параметра §Y$SOV_comecon_sov_default$§!:\nФабрики потребительских товаров: §Y+3,0%§! \nМножитель ежедневного прироста командной власти: §R-15%§!\n§YВсе субъекты§!: \nИзменить значение параметра §Y$SOV_comecon_sov_default$§!:\nОчки опыта армии: §G0,50§! в день \nОчки опыта флота: §G0,50§! в день \nОчки опыта авиации: §G0,50§! в день \nВремя подготовки: §R+10,00%§! \nЕжедневный прирост командной власти: §G0,10§!"


  SOV_order_227_flag:0 "Активировал решение §Y$SOV_order_227$§!."
  SOV_factory_worker_militias:0 "Поднять отряды ополченцев из рабочих фабрик"
  SOV_factory_worker_militias_desc:1 "Необходимо поднять рабочих фабрик в [FROM.GetName], чтобы усилить находящиеся там дивизии, иначе у них скоро не будет заводов для работы."
  SOV_factory_worker_militias_state_modifier_tt:0 "\nМодификатор штата §Y$SOV_factory_worker_militias_raised$§!:\n   $MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-50,00%§! \n   $MODIFIER_LOCAL_FACTORIES$: §R-100%§! \n   $MODIFIER_LOCAL_ORG_REGAIN$: §G+10,00%§! \n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5,0%§! \n"
  SOV_civilian_labor_in_defense:0 "Гражданские силы в обороне"
  SOV_civilian_labor_in_defense_desc:1 "Мы задействуем гражданское население в [FROM.GetName], чтобы оно занялось строительством укреплений и обороной своего города."
  SOV_civilian_labor_in_defense_mod:0 "$SOV_civilian_labor_in_defense$"
  SOV_civilian_labor_in_defense_state_modifier_tt:0 "\n§Y$SOV_civilian_labor_in_defense$§! Модификатор штата:\n   $MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-50.00%§! \n   $MODIFIER_LOCAL_MANPOWER$: §R-25%§!  \n   $MODIFIER_LOCAL_FACTORIES$: §R-50%§! \n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§! \n   $modifier_state_production_speed_bunker_factor$: §G+60.00%§! \n   $modifier_state_production_speed_coastal_bunker_factor$: §G+60.00%§! \n"
  SOV_nothing_is_left_behind:0 "Не оставлять следов"
  SOV_nothing_is_left_behind_desc:1 "Если нашим войскам придётся уступить позиции, мы сделаем так, чтобы они не оставили ничего, чем бы мог воспользоваться противник."
  SOV_staggered_retreat:0 "Упорядоченное отступление"
  SOV_staggered_retreat_desc:1 "Если нам придётся отступать перед натиском противника, мы сделаем это упорядоченно, не оставляя отдельных подразделений и не допуская окружения наших войск."
  SOV_order_227_decisions_tt:1 "Разблокирует решения для подготовки и выполнения §YВоенных наступлений§!. \n\nСледующие решения больше не будут доступны: §Y$SOV_nothing_is_left_behind$§! \n§Y$SOV_staggered_retreat$§! \n§Y$SOV_factory_worker_militias$§! \n§Y$SOV_civilian_labor_in_defense$§! \n"
  SOV_order_227_scorched_earth_decisions_tt:0 "Решения \"§YВыжженная земля§!\" будут больше недоступны."
  SOV_military_offensive_in_progress_flag:0 "Военные наступательные действия еще продолжаются."
  SOV_military_offensive_ongoing:0 "Военные наступательные действия[GetOngoingOffensiveMainObjective] ведутся"
  SOV_military_offensive_ongoing_trigger_tt:0 "[GetOffensiveMissionTriggerText]."
  SOV_military_offensive_ongoing_trigger_default:0 "Контролирует §Y[?SOV_military_offensive_states^0.GetName]§! и все граничащие с ним провинции со модификатором провинции §Y$SOV_soviet_military_offensive$§!. \n Контроль над §Y[?SOV_military_offensive_states^0.GetName]§! предотвратит применение каких-либо штрафов в случае, если мы не сможем контролировать соседние провинции."
  SOV_military_offensive_ongoing_trigger_completed:0 "Наступательная операция завершена"
  SOV_military_offensive_ongoing_failing_main_objective_tt:0 "Потеря основного пункта, §Y[?SOV_military_offensive_states^0.GetName]§!, в случае провала этой миссии приведет к следующим штрафам:"
  SOV_military_offensive_scope_tt:0 "§Y[FROM.GetName]§! и §Yвсе соседние государства, которые в настоящее время контролируются врагом§!:\nДобавить модификатор: §Y$SOV_soviet_military_offensive$§! (Атака дивизии: §G+10,0%§!, Прорыв: §G+10,00%§! для [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! в государстве)."
  SOV_military_offensive_current_scope_main_objective_tt:0 "\nГлавная цель:"
  SOV_military_offensive_current_scope_negihbors_tt:0 "\nВторостепенные цели (соседи):"
  SOV_military_offensive_activate_decision_tt:0 "\nАктивирует миссию: §YMilitary Offensive in [FROM.GetName] Ongoing§! (Чтобы добиться успеха в этой миссии, нам нужно будет контролировать главную цель, §Y[FROM.GetName]§! и все ее соседние государства, которые в настоящее время контролируются врагом. Контроль только над главной целью избавит нас от штрафов за провал миссии)"
  SOV_military_offensive_generic_name:0 ""
