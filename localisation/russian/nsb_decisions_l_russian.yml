  form_siberia_category:0 "Сибирское объединение"
  form_siberia_category_desc:0 "Сибирь никогда не имела единой идентичности, ни культурной, ни этнической, ни политической, кроме нынешней русской. Однако, благодаря тому, что их объединили в одну сферу русские, сибирский народ никогда не был так един. Если государство объединит Сибирь и вытеснит русских империалистов, многие люди наверняка примут объединение под этим новым государством, и многие просят, чтобы это стало реальностью."
