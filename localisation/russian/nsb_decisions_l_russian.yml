  form_idel_ural_category:0 "Воссоединение идель-уральцев"
  form_idel_ural_category_desc:0 "1 марта 1918 г. Милли Меджлис, он же национальный совет, попытался объявить о создании Идель-Уральской республики, но ему помешали обе стороны гражданской войны. Сегодня концепция единой нации в регионе по-прежнему мало изучена, но если бы кто-то объявил о ее создании, чтобы защитить народ от российского империализма, поддержка населения была бы велика."
