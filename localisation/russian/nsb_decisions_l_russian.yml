  SOV_propaganda_campaign_cooldown_tt:0 "Эта кампания будет снова доступна через §Y[?ROOT.SOV_default_propaganda_campaign_cooldown] дней§! после ее отмены. Стоимость будет умножена на §R[?ROOT.SOV_propaganda_cost_increase]§!."
  SOV_propaganda_builders_of_communism_effect_tt:0 "Каждая советская марионетка получает '§Y$SOV_young_builders_of_communism$§!', который дает (скорость исследования: §G+1.00%§!, скорость изменения идеологии: §G+0.25§!) на §Y[?SOV_default_propaganda_campaign_duration]§! дней."
  SOV_punished_for_breaking_flag:0 "Вступил в войну, когда эта кампания была активна. §RНарушение этого условия приведет к нестабильности и заблокирует эту пропагандистскую кампанию навсегда.§!"
  SOV_propaganda_more_metal_tt:0 "Предоставляет +1 к  §Y$state_resource_aluminium$§!, §Y$state_resource_tungsten$§!, §Y$state_resource_steel$§! или §Y$state_resource_chromium$§! каждому штату, производящему любой из этих ресурсов."
  SOV_propaganda_death_to_invaders_no_invaders_tt:0 "Каждый штаб, контролируемый врагом:\nДобавить модификатор: §Y$SOV_invaders_must_die$§!"
  SOV_propaganda_anti_fascism_tt:0 "Получить модификатор §Y$SOV_anti_fascist_campaign_generic$§! против страны с самым высоким уровнем фашизма в мире, который дает (Бонус к атаке против страны: §G+10.0%§!, Бонус к защите против страны: §G+10.0%§!) на §Y[?SOV_default_propaganda_campaign_duration]§! дней."
  SOV_propaganda_anti_capitalism_tt:0 "Получить модификатор §Y$SOV_anti_capitalist_campaign_generic$§! против страны с самым высоким уровнем демократии в мире, который дает (Бонус к атаке против страны: §G+10.0%§!, Бонус к защите против страны: §G+10.0%§!) на §Y[?SOV_default_propaganda_campaign_duration]§! дней."
  SOV_propaganda_defend_moscow_state_modifier_tt:0 "\nМодификатор штата §Y$SOV_defend_moscow$§!:\n   $MODIFIER_LOCAL_FACTORIES$: §R-100%§! \n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+10.0%§! \n   $MODIFIER_RECRUITABLE_POPULATION_FACTOR$: §G+25.00%§! \n   $MODIFIER_SUPPLY_FACTOR$: §G+15%§!\n"
  SOV_propaganda_victory_at_hand_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap] ведет войну с крупной державой, которая сорвала Третий пятилетний план."
  SOV_propaganda_death_to_invaders_state_modifier_tt:0 "\n§Y$SOV_invaders_must_die$§! модификатор штата:\n   $MODIFIER_RESISTANCE_TARGET$: §R+15%§! \n   $MODIFIER_RESISTANCE_DECAY$: §R-30%§! \n   $MODIFIER_RESISTANCE_GROWTH$: §R+5%§! \n   $MODIFIER_COMPLIANCE_GROWTH$: §R-5%§!\n   $MODIFIER_STRATEGIC_REDEPLOYMENT_DISABLED$: §RДа§! \n   $MODIFIER_STATE_RESOURCES_FACTOR$: §R-25%§!\n"
  SOV_propaganda_heroes_forward_tt:0 "До §Y5 Лидеров Отрядов§! получат черту §Y$trait_SOV_determined$§! на §Y[?SOV_default_propaganda_campaign_duration]§! дней"

  SOV_paranoia_system:0 "Политическая Паранойя"
  SOV_paranoia_system_desc:0 "Атмосфера подозрений и недоверия витает над [ROOT.GetNameDef]. Заботы [ROOT.GetLeader] о фракционировании внутри партии растут по мере того, как расследуются бесчисленные обвинения и предполагаемые акты саботажа, вредительства и шпионажа НКВД."
  SOV_paranoia_bg_tooltip:0 "Если уровень подозрительности превосходит 25%, могут произойти случайные чистки. \nЧем выше уровень подозрительности и чем дольше он остается высоким, тем выше вероятность чисток. \nЕсли подозрительность превысит 75%, могут произойти массовые чистки. \n\nОпределенные фокусы, решения и эффекты немедленно увеличат или уменьшат уровень подозрительности, а определенные черты характера советников и лидеров страны будут постепенно повышать уровень подозрительности с течением времени. \n\nЗавершение фокуса [GetAppropriateLastPurgeFocusName] устранит систему подозрительности."
  SOV_paranoia_text_tooltip:0 "[GetAppropriateParanoiaTooltip]"
  SOV_paranoia_text_tooltip_default:0 "§YЕженедельная подозрительность §SOV_paranoia_text_icon зависит от:§! \n[GetLeaderTrait] \n[GetNKVDTrait]"
  SOV_paranoia_text_tooltip_not_active:0 "Политическая подозрительность больше не активна."
