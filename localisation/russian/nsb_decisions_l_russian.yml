  SOV_socialism_in_one_country_mission_tt:0 "---\nКогда начнётся гражданская война, центристы получат модификаторы от фокуса §Y$SOV_socialism_in_one_country$§!."

  SOV_secure_the_administration_mission:0 "$SOV_secure_the_administration$"
