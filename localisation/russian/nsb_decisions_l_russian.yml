  SOV_ultimatum_baltic_effects_tt:0 "Данное событие побудит §Y[FROM.GetFlag][FROM.GetNameDefCap]§! присоединиться к §Y[ROOT.GetNameDef]§! ([FROM.GetNameDefCap] все еще может отказаться)"
  SOV_ultimatum_generic_effects_tt:0 "Данное событие побудит §Y[FROM.GetFlag][FROM.GetNameDefCap]§! стать марионеткой §Y[ROOT.GetNameDef]§! или присоединиться к §Y[ROOT.GetFactionName]§! ([FROM.GetNameDefCap] все еще может отказаться)"
  SOV_pressure_government_effects_tt:0 "Это событие вынудит [FROM.GetNameDefCap] присоединиться к [ROOT.GetFactionName] или установить [ROOT.GetRulingIdeology]. [FROM.GetNameDefCap] может отказаться."
  SOV_promote_rallies_effects_tt:0 "Это событие расширит влияние идеологии [GetIdeologyNameWithCaps] в [FROM.GetNameDefCap], но [FROM.GetAdjective] правительство может расценить это как дестабилизирующий фактор."
  SOV_preparations_for_operation_countenance:0 "Подготовка к операции Countenance"
  SOV_operation_countenance:0 "Операция Countenance"
  SOV_preparations_for_operation_countenance_tt:0 "У нас есть [?SOV.SOV_operation_countenance_preparation_days] дней для подготовки к $SOV_operation_countenance$ и объявлению войны [PER.GetNameDef].\n$SOV_preparations_for_operation_countenance_mission_tt$\n"
  SOV_preparations_for_operation_countenance_mission_tt:0 "Когда миссия $SOV_operation_countenance$ будет активна, войскам [GetOperationCountenanceTooltip] дадут [?SOV.SOV_operation_countenance_mission_days] дней для капитуляции [PER.GetNameDef]. Затем они попытаются присоединиться к другой фракции, и наши граждане начнут сомневаться в наших военных силах."
  SOV_operation_countenance_tt_alone:0 "Мы"
  SOV_operation_countenance_tt_anglo_soviet:0 "Мы и [ENG.GetAdjective]"
  SOV_operation_countenance_successful_tt:0 "Эффекты, если мы капитулируем [PER.GetNameDef]:"
  SOV_agreed_anglo_soviet_invasion_of_iran_flag:0 "Совместное англо-советское вторжение в Иран"
  SOV_send_infantry_equipment_asia:0 "Отправить пехотное снаряжение"
  SOV_send_infantry_equipment_asia_desc:0 "Мы должны отправить военное снаряжение нашим китайским союзникам, чтобы они смогли противостоять как империалистическим странам, которые их окружают, так и амбициозным китайским военачальникам."
  SOV_send_equipment_cd_tt:0 "\nЭто решение снова станет доступным через §Y[?SOV_send_infantry_equipment_cd]§! дней.\n"
  SOV_peace_deal_for_south_sakhalin_and_kuril_islands:1 "Предложить мир для [537.GetName] и [555.GetName]"
  SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc:1 "Мы предложим правительству [JAP.GetAdjective] прекратить все военные действия, если они согласятся вернуть наши бывшие территории [537.GetName] и [555.GetName]."
  SOV_peace_deal_for_hokkaido:0 "Предложить мир для Сахалина, Курил и Хоккайдо"
  SOV_peace_deal_for_hokkaido_desc:1 "Мы предложим правительству [JAP.GetAdjective] прекратить все военные действия, если оно согласится вернуть наши бывшие территории [537.GetName] и [555.GetName], а также передать [536.GetName] под [ROOT.GetAdjective] управление."
  SOV_sinkiang_investment_ongoing_flag:0 "В Синьцзяне уже реализуется еще одна программа помощи"
  SOV_sinkiang_mineral_prospection_sik:0 "Предложить геологоразведку в Южном [SIK.GetNameDef]"
  SOV_sinkiang_mineral_prospection_sik_desc:0 "Чиновники [ROOT.GetAdjective] проявили интерес к добыче золота и редких минералов в Алтае, [SIK.GetNameDef]. Чтобы получить доступ к рынку Синьцзяна, мы предложим поискать новые месторождения и усовершенствовать инфраструктуру в [619.GetName], регионе, богатом минералами, но с очень архаичными методами добычи у нашего соседа."
  SOV_sinkiang_mineral_prospection:1 "Разведка полезных ископаемых в Южном Синьцзяне"
  SOV_sinkiang_mineral_prospection_desc:0 "Регион [619.GetName], в юго-западной части бывшего Синьцзяна, богат минералами, но в настоящее время разрабатывается лишь несколько месторождений, причем очень архаичным и неэффективным способом. Мы должны искать полезные ископаемые и совершенствовать инфраструктуру региона, чтобы облегчить разработку месторождений."
  SOV_sinkiang_mineral_prospection_mission_dummy:0 "Разведка полезных ископаемых [SOV.GetAdjective]"
  SOV_sinkiang_prospection_rejected_flag:0 "Наше предложение было отклонено"
  SOV_sinkiang_oil_prospection_sik:0 "Предложить разведку полезных ископаемых в Северном [SIK.GetNameDef]"
  SOV_sinkiang_oil_prospection_sik_desc:0 "[618.GetName], в северной части [SIK.GetNameDef], богат нефтью и минералами, но ни один из них не разрабатывается нашим соседом. Мы попросим разрешения на разведку полезных ископаемых в регионе и разработку всех обнаруженных месторождений."
  SOV_sinkiang_oil_prospection:1 "Разведка полезных ископаемых в Северном Синьцзяне"
  SOV_sinkiang_oil_prospection_desc:0 "[618.GetName], в северной части бывшего Синьцзяна, богат нефтью и минералами, но ни один из них в данный момент не добывается. Мы должны искать ресурсы и развивать инфраструктуру в этом регионе, чтобы облегчить добычу любых найденных нами месторождений."
  SOV_sinkiang_oil_prospection_mission_dummy:0 "[SOV.GetAdjective] Разведка полезных ископаемых и нефти"
  SOV_sinkiang_oil_prospection_rejected_flag:0 "$SOV_sinkiang_prospection_rejected_flag$"
  SOV_sinkiang_military_aid_sik:0 "Военная помощь для [SIK.GetNameDef]"
  SOV_sinkiang_military_aid_sik_desc:0 "Мы предложим военную помощь [SIK.GetNameDef] в обмен на увеличение экспорта их местных товаров, необходимых в нашей стране."
  SOV_sinkiang_military_aid_mission_dummy:0 "[SOV.GetAdjective] Военная помощь"
  SOV_sinkiang_military_aid_rejected_flag:0 "$SOV_sinkiang_prospection_rejected_flag$"
  SOV_sinkiang_support_expansion_mission_dummy:0 "[SOV.GetAdjective] Поддержка территориальной экспансии"
  SOV_sinkiang_support_expansion_sik:0 "Поддержка экспансии [SIK.GetNameDef]"
  SOV_sinkiang_support_expansion_sik_desc:0 "Наши торговые агенты в [SIK.GetNameDef] требуют больше политики для увеличения экспорта в [ROOT.GetNameDef], поскольку территориальная экспансия Синьцзяна предоставила им больше товаров для торговли."
  SOV_sinkiang_support_expansion_rejected_flag:0 "$SOV_sinkiang_prospection_rejected_flag$"
  SOV_formalize_of_the_soviet_republic_of_sinkiang:0 "Официально оформить Советскую Республику Синьцзян"
  SOV_formalize_of_the_soviet_republic_of_sinkiang_desc:0 "Пора требовать интеграции [SIK.GetNameDef] в качестве независимой Советской Социалистической Республики, подчиняющейся правительству [FROM.GetNameDef]."
  SOV_formalize_of_the_soviet_republic_of_sinkiang_only_once_tt:0 "Это решение можно активировать только один раз.\n§gИИ всегда будет соглашаться.§!"
  SOV_sinkiang_prospection_flag:0 "Провел разведку полезных ископаемых в Южном Синьцзяне"
  SOV_sinkiang_oil_prospection_flag:0 "Провел разведку полезных ископаемых в Северном Синьцзяне"
  SOV_sinkiang_military_aid_flag:0 "Оказал военную помощь Синьцзяну"
  SOV_sinkiang_support_expansion_flag:0 "Поддержал экспансию Синьцзяна, развивая инфраструктуру на новых территориях"
  SOV_sinkiang_joined_comintern_counter_flag:0 "Вступил в Коминтерн"
  SOV_sinkiang_joined_comintern_days_tt:0 "Текущий счетчик дней: [?SOV_sinkiang_joined_comintern_counter_flag:days|Y0]"
  SOV_soviet_aid_decision_category:0 "[SOV.GetAdjective] программа помощи и инвестиций"
  SOV_soviet_aid_decision_category_desc:0 "[SOV.GetNameDefCap] заинтересовался нашей страной, или, скорее, ее природными ресурсами, экономическим рынком и внешними связями. Как и было согласовано ранее, [SOV.GetAdjective] правительство в настоящее время проводит инвестиционную программу в нашей стране, которую они заявляют, будет стимулировать развитие нашей нации."
  SOV_pressure_government_active_flag:0 "В настоящее время оказывает давление на другое правительство"
  SOV_pressure_government_cd_tt:1 "\nМы можем оказывать давление на правительство страны только раз в каждые §Y[?SOV_pressure_government_cd]§! дней."
