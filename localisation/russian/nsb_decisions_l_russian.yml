  SOV_operation_iskra_desc:0 "Мы начнем подготовку к военной операции, чтобы прорвать осаду [195.GetName]."
  SOV_operation_iskra_ongoing_objective_tt:0 "Целью этого наступления является прорыв осады §Y[195.GetName]§!, восстановление соединения государства с нашей столицей к моменту истечения срока действия миссии."
  SOV_operation_iskra_ongoing_success_effects_tt:0 "Если нам это удастся:"
  SOV_operation_iskra_ongoing_failure_effects_tt:0 "\nЕсли мы потерпим неудачу:"
  SOV_operation_iskra_ongoing_success_tt:0 "\n§GМы прорвали осаду §YL Ленинграда§!, и город в настоящее время соединен с нашей столицей.§!"
  SOV_operation_iskra_ongoing_failure_tt:0 "\n§RМы еще не прорвали осаду §YL Ленинграда§!. Город все еще изолирован и окружен врагами.§!"
  SOV_operation_iskra_tt:0 "§Y[195.GetName]§!, §Y[208.GetName]§! и §Y[244.GetName]§!:\nДобавить модификатор: §Y$SOV_soviet_military_offensive$§! (Атака дивизии: §G+10,0%§!, Прорыв: §G+10,00%§! для [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! в государстве)."
  SOV_operation_iskra_activate_decision_tt:0 "\nАктивирует миссию: §YТекущая операция Искра§! (Чтобы добиться успеха в этой миссии, нам нужно прорвать осаду §YL Ленинграда§! и восстановить сухопутные пути между городом и нашей столицей к моменту истечения срока действия миссии)."
  SOV_the_rush_for_berlin:0 "Бросок на Берлин"
  SOV_the_rush_for_berlin_desc:0 "Очевидно, что наши нынешние союзники в борьбе против [GER.GetAdjective] станут нашими величайшими соперниками после войны. Мы не можем позволить им победить нас в гонке за Берлин."
  SOV_raise_penal_units:0 "Поднять штрафные части"
  SOV_raise_penal_units_desc:0 "Больше мяса для мясорубки."
  SOV_raise_penal_units_days_tt:0 "Текущие дни: [?SOV_penal_units_raised_flag:days|Y0]"
  SOV_great_patriotic_war_flag:0 "Ведет §YВеликую Отечественную войну§!"

  SOV_add_borderline_state_to_plot:0 "заполнить: добавить политически граничное государство к фашистскому заговору"
  SOV_add_borderline_state_to_plot_desc:0 "заполнить: получить государство, которое может выйти и присоединиться к вам на вашей территории, когда начнется война"
  SOV_woo_army_officers:0 "заполнить: завербовать офицера в фашизм"
  SOV_woo_army_officers_desc:0 "заполнить: Когда начнется гражданская война, этот офицер может присоединиться к вам и привести часть своих войск."
  SOV_woo_navy_officers:0 "заполнить: завербовать офицера в фашизм"
  SOV_woo_navy_officers_desc:0 "заполнить: Когда начнется гражданская война, этот офицер может присоединиться к вам, но он не приведет войска."
  
  
  SOV_noisy_meeting_in_paris:0 "заполнить: провести шумную встречу в Париже"
  SOV_noisy_meeting_in_paris_desc:0 "заполнить: еще не завершено, вызывает подозрения у Сталина к одному из его лояльных политических советников"
  SOV_soviet_civil_war_dec_cat:0 "[GetSovietCivilWarName]"
  SOV_soviet_civil_war_dec_cat_desc:1 "Мы столкнулись с угрозой новой гражданской войны. Необходимо подготовиться к худшему и контролировать как можно больше территорий и вооруженных сил. Однако, надо действовать осторожно и не привлекать лишнего внимания, в противном случае [ROOT.getLeader] может ускорить события, к которым мы пока не готовы."
  SOV_SOS_civil_war_divisions_tt_long:0 "§YПоддержка в гражданской войне§!\n§LПервоочередной задачей на случай начала гражданской войны является обеспечение максимально возможной поддержки как в вооруженных силах, так и среди населения.\n\n§![GetArmedForcesText]\n\n----\nЕжедневный риск развязывания войны со стороны Сталина составляет §Y20%§!, если показатель паранойи превысит §R90%§!\n----\n[GetCategoryStateText]"
  SOV_opposition_civil_war_divisions_value:0 "[GetArmedForcesData]"
  SOV_SOS_civil_war_divisions_value:0 "[?SOV.SOV_centre_army_support|%Y0]"
  SOV_SOT_civil_war_divisions_value:0 "[?SOV.SOV_left_opposition_army_support|%Y0]"
  SOV_SOB_civil_war_divisions_value:0 "[?SOV.SOV_right_opposition_army_support|%Y0]"
  SOV_SOP_civil_war_divisions_value:0 "[?SOV.SOV_exiles_army_support|%Y0]"
  SOV_SOS_civil_war_divisions_tt:0 "В случае начала гражданской войны [?SOV.SOV_centre_army_support|%Y0] состава армии, [?SOV.SOV_centre_navy_support|%Y0] состава ВМФ и [?SOV.SOV_centre_air_support|%Y0] состава ВВС сохранят верность [SOV.GetLeader].\n----\nЕжедневный риск развязывания войны со стороны Сталина составляет §Y20%§!, если показатель паранойи превысит §R90%§!\n"
  SOV_SOT_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_left_opposition_army_support|%Y0] \nПоддержка флота: [?SOV.SOV_left_opposition_navy_support|%Y0] \nПоддержка ВВС: [?SOV.SOV_left_opposition_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на уровень сдачи [FROM.GetLeader] и добавляет партизанские отряды во время войны)"
  SOV_SOB_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_right_opposition_army_support|%Y0] \nПоддержка флота: [?SOV.SOV_right_opposition_navy_support|%Y0] \nПоддержка ВВС: [?SOV.SOV_right_opposition_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на уровень сдачи [FROM.GetLeader] и добавляет партизанские отряды во время войны)"
  SOV_SOP_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_exiles_army_support|%Y0] \nПоддержка флота: [?SOV.SOV_exiles_navy_support|%Y0] \nПоддержка ВВС: [?SOV.SOV_exiles_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на уровень сдачи [FROM.GetLeader] и добавляет партизанские отряды во время войны)"
  SOV_select_headquarters_text:1 "Выберите базу для своего восстания, нажав на значок штаб-квартиры на карте: \n\n£select_headquarters_texticon"
  SOV_select_state_text:1 "Создайте новые ячейки, чтобы расширить влияние, на карте:\n\n £infiltrate_state_texticon\n\n"
  SOV_opposition_army_support_non_existant:0 "§RПочти не существует§!"
  SOV_opposition_army_support_very_low:0 "§RОчень низкая§!"
  SOV_opposition_army_support_low:0 "§YНизкая§!"
  SOV_opposition_army_support_medium:0 "§YСредняя§!"
  SOV_opposition_army_support_high:0 "§GВысокая§!"
  
  SOV_expand_nkvd_opposition:0 "Расширить военную ветвь НКВД"
  SOV_expand_nkvd_opposition_desc:1 "Мы должны воспользоваться возможностью и расширить военную ветвь НКВД. Эти войска могут быть очень полезны для обеспечения нашей будущей победы."
  SOV_expand_nkvd_opposition_tt:0 "Добавляет 5 дивизий НКВД, которые останутся верными, когда начнется [GetSovietCivilWarName]."
  SOV_nkvd_cd_tt:0 "\nЭто решение будет доступно снова через §Y120 дней§!."
  
  SOV_influence_army_opposition:0 "Увеличить поддержку в армии"
  SOV_influence_army_opposition_desc:1 "Проникнув в армию, мы теперь можем начать искать офицеров низкого ранга и рядовых, которые сочувствуют нашему делу, и убедиться, что они присоединятся к нам, если начнется война."
  SOV_influence_army_opposition_tt:0 "Поддержка армии растет"
  SOV_influence_cd_tt:0 "\nЭто решение будет доступно снова через §Y60 дней§!."
  SOV_influence_army_opposition_level_tt:0 "Поддержка в армии менее §Y70%§!"
  
  SOV_influence_navy_opposition:1 "Увеличить поддержку флота"
  SOV_influence_navy_opposition_desc:1 "Флот может быть не слишком полезен в гражданской войне, но он все еще может помочь нам захватить ключевые локации и обеспечить снабжение. Так что стоит заручиться лояльностью нескольких капитанов. Кроме того, наличие флота после войны открывает нам новые возможности на международной арене."
  SOV_influence_navy_opposition_tt:0 "Поддержка флота растет"
  SOV_influence_navy_opposition_level_tt:0 "Поддержка во флоте менее §Y70%§!"
  SOV_influence_airforce_opposition:1 "Увеличить поддержку военно-воздушных сил"
  SOV_influence_airforce_opposition_desc:1 "Используя наши связи в вооруженных силах, мы сможем найти летчиков и командиров ВВС, которые сочувствуют нашему делу. Присутствие ВВС на нашей стороне наверняка облегчит войну."
  SOV_influence_airforce_opposition_tt:0 "Поддержка ВВС растет"
  SOV_influence_air_opposition_level_tt:0 "Поддержка в ВВС менее §Y70%§!"
  SOV_recruit_general_opposition:0 "Набор генерала в свое дело"
  SOV_recruit_general_opposition_desc:1 "Мы должны использовать свои связи внутри Красной Армии, чтобы попытаться убедить высокопоставленных офицеров присоединиться к нам в случае гражданской войны."
  SOV_recruit_general_opposition_tt:0 "Один генерал или фельдмаршал становится верным нашему делу"
  SOV_recruit_admiral_opposition:0 "Привлечь адмирала в свое дело"
  SOV_recruit_admiral_opposition_desc:1 "Мы должны использовать наши связи в составе ВМФ СССР, чтобы попытаться убедить высокопоставленных офицеров присоединиться к нам в случае гражданской войны."
  SOV_recruit_admiral_opposition_tt:0 "Один адмирал становится верным нашему делу"
  SOV_recruit_cd_tt:0 "\nЭто решение будет доступно снова через §Y30 дней§!."
  SOV_army_framejob:0 "Подставить офицера армии"
  SOV_army_framejob_desc:0 "Распространяя слухи о генералах, лояльных [ROOT.GetLeader], и предоставляя поддельные "доказательства" в руки НКВД, мы сможем на некоторое время отвлечь внимание от себя. В качестве бонусного эффекта, если нам повезет, другие военнослужащие могут быть недовольны репрессивными действиями."
  SOV_army_framejob_tt:0 "Один генерал или фельдмаршал будет обвинен в государственной измене."
  SOV_army_framejob_cd_tt:0 "\nЭто решение будет доступно снова через §Y[?SOV_army_framejob_decision_re_enable_days_display] дней§!."
  SOV_navy_framejob:0 "Подставить адмирала"
  SOV_navy_framejob_desc:0 "Распространяя слухи об адмиралах, лояльных [ROOT.GetLeader], и предоставляя поддельные "доказательства" в руки НКВД, мы сможем на некоторое время отвлечь внимание от себя. В качестве бонусного эффекта, если нам повезет, другие военнослужащие флота могут быть недовольны репрессивными действиями."
  SOV_navy_framejob_tt:0 "Один адмирал будет обвинен в государственной измене."
  SOV_navy_framejob_cd_tt:0 "\nРешение будет доступно снова через §Y[?SOV_navy_framejob_decision_re_enable_days_display] дней§!."
  SOV_plan_start_of_uprising_archangelsk:1 "Установить секретную штаб-квартиру в [FROM.GetName]."
  SOV_plan_start_of_uprising_archangelsk_desc:1 "Северный регион имеет выход к портам и относительно близок к Москве, что делает его хорошей базой. Однако, у него слабая внутренняя инфраструктура и низкий уровень развития, поэтому вести войну отсюда будет несколько затруднительно, если не сделать что-то, чтобы смягчить это.."
  SOV_plan_start_of_uprising_odessa:1 "Установить секретную штаб-квартиру в [FROM.GetName]."
  SOV_plan_start_of_uprising_odessa_desc:1 "Украина - хорошая база для восстания. Это богатый регион с большими городами, хорошими портами и инфраструктурой. Однако это также означает, что будет труднее перевести государства на нашу сторону, чем в менее развитых регионах [SOV.GetNameDef]."
  SOV_plan_start_of_uprising_chita:1 "Установить секретную штаб-квартиру в [FROM.GetName]."
  SOV_plan_start_of_uprising_chita_desc:1 "Сибирь традиционно является антисталинистским и антибольшевистским оплотом. Регион может быть неразвитым, но его должно быть относительно легко переманить на нашу сторону."
  SOV_plan_start_of_uprising_omsk:1 "Установить секретную штаб-квартиру в [FROM.GetName]."
  SOV_plan_start_of_uprising_omsk_desc:1 "Омск удачно расположен на западе Сибири, гранича с Уралом и Великой степью. Несмотря на некоторую отсталость, здесь должно быть относительно легко построить хорошую, надёжную базу для восстания, а затем отправиться в Москву."
  SOV_plan_start_of_uprising_tashkent:1 "Установить секретный штаб в [FROM.GetName]."
  SOV_plan_start_of_uprising_tashkent_desc:1 "Если мы построим свою базу в регионе Великой степи, то обезопасим себе тыл. До Москвы придётся долго добираться, но большая часть боевых действий будет проходить у нас впереди. Кроме того, в этом регионе относительно легко завоевать поддержку."
  SOV_plan_start_of_uprising_ufa:1 "Установить секретный штаб в [FROM.GetName]."
  SOV_plan_start_of_uprising_ufa_desc:1 "Урал имеет то преимущество, что его легко защищать. Кроме того, если мы построим свою базу там, это позволит нам распространить своё влияние как в Сибири, так и на севере, а также на юг, в район Великой степи. Это даст нам массу возможностей."
  SOV_align_state_in_process:1 "Текущее проникновение в страну"
  SOV_planning_uprising_in_state:1 "Проникнуть в [FROM.GetName]"
  SOV_planning_uprising_in_siberia:1 "§WПроникнуть§! в [FROM.GetName] §в§! Сибири"
  SOV_planning_uprising_in_far_east:0 "§WПроникнуть§! в [FROM.GetName] §в§! российский Дальний Восток"
  SOV_planning_uprising_in_urals:1 "§WПроникнуть§! [FROM.GetName] §Win§! на Урал"
  SOV_planning_uprising_in_northern:1 "§WПроникнуть§! [FROM.GetName] §Win§! в Северные области"
  SOV_planning_uprising_in_ukraine:1 "§WПроникнуть§! [FROM.GetName] §Win§! на Украину"
  SOV_align_states_steppe:0 "§WПроникнуть§! [FROM.GetName] §Win§! в Степной регион"
  SOV_set_civil_war_state_tt:0 "В [FROM.GetName] установлена ячейка повстанцев, что гарантирует лояльность государства в случае гражданской войны."
  SOV_start_infiltrating_state_tt:0 "Начинается работа по созданию ячейки в [FROM.GetName]"
  SOV_sabotage_behind_enemy_lines_decision:0 "Саботаж за линией фронта"
  SOV_sabotage_behind_enemy_lines_decision_desc:0 "Лояльные партизаны, действующие за линией фронта, могут быть использованы для прерывания вражеской связи в [FROM.Getname]. Удары по командным пунктам, обрыв телеграфной связи или сход поезда с рельсов снижают готовность противника противостоять атакам наших войск и увеличивают вероятность успешного освобождения России."
  SOV_sabotage_behind_enemy_lines_decision_tt:0 "§YEдиницы противника§! получают штраф к §Yорганизации§!"
  sabotage_behind_enemy_lines_flag:0 "Подготовка диверсионной операции"
  SOV_dismiss_the_counter_revolution:0 "Подавить контрреволюцию"
  SOV_dismiss_the_counter_revolution_desc:1 "Публичное отрицание любых упоминаний контрреволюции должно отвлечь внимание НКВД от наших агентов. Однако это также может привести к потере сторонников, поверивших в ложное отрицание."
  SOV_dismiss_the_counter_revolution_tt:1 "Снижает политическую паранойю за счет стабильности в будущем и снижения поддержки со стороны военных"
  SOV_dismiss_cd_tt:0 "\nЭто решение снова будет доступно через §Y60 дней§!."

  SOV_is_opposition_state_tt:1 "В государстве существуют ячейки оппозиции"
  SOV_is_unaligned_state_tt:0 "Государство не присоединилось"
  SOV_is_opposition_tt:0 "Является оппозицией"
  SOV_has_crackdown_tt:0 "Идут репрессии"
  SOV_soviet_civil_war_not_started_tt:0 "Гражданская война в СССР не началась"
  SOV_has_selected_hq_tt:0 "Был создан секретный штаб"
  SOV_concessions_japan_vladivostok_SCW:0 "Передать Владивосток Японии"
  SOV_concessions_japan_vladivostok_SCW_desc:0 "Японские военные всегда стремились захватить Владивосток. Поэтому они должны помочь нам экспедиционным корпусом, если мы используем будущее владение этой территорией как разменную монету."
  SOV_concessions_japan_vladivostok_SCW_accept:0 "В случае согласия [JAP.GetNameDef] поставит части, которые будут воевать на стороне [GetSovietOppositionName] во время войны. После войны [JAP.GetNameDefCap] получит контроль над Владивостоком."
  SOV_not_has_conflict_with_japan:0 "§Y[ROOT.GetNameWithFlag]§!: Нет текущего конфликта с §Y[JAP.GetNameWithFlag]§!"
  SOV_CSW_transfer_vladivostok_flag:0 "Концессия §YВладивосток§!"
  SOV_concessions_japan_sakhalin_SCW:0 "Сахалин за оружие"
  SOV_concessions_japan_sakhalin_SCW_desc:1 "Бунту нужны вооружения. Возможно, японцы предоставят их нам, если мы покажем, что готовы предоставить им остальную часть Сахалина."
  SOV_concessions_japan_sakhalin_SCW_accept:0 "Если принято, [GetSovietOppositionName] получает [JAP.GetAdjective] пушки, винтовки и возможно истребители, когда начинается война. [JAP.GetNameDefCap] получит контроль над Северным Сахалином после войны."
  SOV_CSW_transfer_sakhalin_flag:0 "Концессия §YСеверный Сахалин§!"
  SOV_concessions_germany_baku_SCW:1 "Нефтяные права в Баку для военного усиления"
  SOV_concessions_germany_baku_SCW_desc:1 "[GER.GetNameDefCap] остро нуждаются в нефти для военного наращивания. Обещав им исключительные права на наши нефтяные месторождения после войны, они должны быть более чем готовы помочь нам."
  SOV_concessions_germany_baku_SCW_accept:0 "Если принято, [GER.GetNameDef] начнет строить военные заводы в [?SOV.SOV_civil_war_start_state.GetName]. [GetSovietOppositionName] получает [GER.GetAdjective] танки и винтовки. [GER.GetNameDefCAP] получит права на ресурсы [229.GetName] после войны."
  SOV_CSW_baku_oil_flag:0 "Концессия на Бакинские нефтяные месторождения"
  SOV_CSW_german_generals_flag:0 "Немецкие военные советники"
  SOV_concessions_germany_ukraininan_oil_SCW:1 "Поддерживаемое Германией украинское восстание"
  SOV_concessions_germany_ukraininan_oil_SCW_desc:1 "Хотя потерять Украину будет неприятно, она может стать ценным союзником в войне против сталинистов. Германия может тайно подготовить украинскую милицию, а затем украинские повстанцы смогут начать внезапное наступление, когда будут готовы."
  SOV_concessions_germany_ukraininan_oil_SCW_accept:0 "В случае согласия [GER.GetNameDef] обучит украинские подразделения, которые поднимут восстание, когда будут готовы. [GER.GetNameDefCAP] получит права на ресурсы на украинской территории по окончании войны."

  SOV_concessions_uk_belarus_SCW:1 "Независимая БССР в обмен на британскую поддержку"
  SOV_concessions_uk_belarus_SCW_desc:1 "Правительство [ENG.GetAdjective] сочувствует призывам находившегося в изгнании правительства [BLR.GetAdjective] к независимости. Если мы пообещаем им освободить [BLR.GetNameDef] после войны, они наверняка захотят поставить нам оружие."
  SOV_concessions_uk_belarus_SCW_accept:0 "В случае согласия [ENG.GetNameDef] начнет строить военные заводы в [?SOV.SOV_civil_war_start_state.GetName]. [BLR.GetNameDefCAP] станет независимой по окончании войны."

  SOV_recruit_manchurian_cavalry_exiles:0 "Набрать маньчжурскую кавалерию в [FROM.GetName]"
  SOV_recruit_manchurian_cavalry_exiles_desc:0 "Добавляет одну бригаду маньчжурской кавалерии в [?SOV.SOV_civil_war_start_state.GetName], когда начинается война."
  SOV_recruit_cavalry_exiles:0 "Набор сибирской конницы в [FROM.GetName]"
  SOV_recruit_cavalry_exiles_desc:0 "Добавляет одну кавалерийскую бригаду в [FROM.GetName] при начале войны."
