  SOV_gosproyektstroy_decision_category:0 "Госпроектстрой"
  SOV_gosproyektstroy_bring_foreign_experts:0 "Привлечь [FROM.GetAdjective] специалистов"
  SOV_gosproyektstroy_bring_foreign_experts_desc:0 "Мы подпишем соглашение с крупнейшими [FROM.GetAdjective] промышленными предприятиями о привлечении экспертов-инженеров и архитекторов из [FROM.GetNameDef] в качестве консультантов для наших промышленных проектов."
  SOV_gosproyektstroy_focus_civ:0 "Специализация на гражданской промышленности"
  SOV_gosproyektstroy_focus_civ_desc:0 "В процессе нашей крупномасштабной промышленной модернизации мы будем в приоритетном порядке обновлять гражданскую тяжелую и легкую промышленность."
  SOV_gosproyektstroy_focus_mil:0 "Специализация на военной промышленности"
  SOV_gosproyektstroy_focus_mil_desc:0 "В ходе широкомасштабной индустриальной модернизации сосредоточимся на повышении эффективности военного производства."
  SOV_gosproyektstroy_focus_dock:0 "Специализация на судостроении"
  SOV_gosproyektstroy_focus_dock_desc:0 "В ходе широкомасштабной индустриальной модернизации сосредоточимся на повышении эффективности производства флота."
  SOV_gosproyektstroy_upgrade_in_progress_flag:0 "В настоящее время работает над улучшением Госпроекта"

  SOV_generic_industry_relocation:0 "Переместить промышленность из [FROM.GetName]"
  SOV_generic_industry_relocation_desc:0 "Эвакуация тяжелой техники наших заводов в [FROM.GetName] на Урал - огромная задача, но необходимая для обеспечения производства военного времени."
  SOV_industry_relocation_complete_effect_tt:0 "До §Y4 военных или гражданских заводов§! будет удалено из §Y[FROM.GetName]§!.\n"
  SOV_industry_relocation_remove_effect_tt:0 "Удалится заводы будут перемещены в штат на Урале. "
  SOV_relocate_industry_repair_tt:0 "§RНекоторые заводы нужно будет восстановить.§!"
  SOV_relocate_industry_lose_control_tt:0 "§RПотеря контроля над [FROM.GetName] приведет к тому, что заводы при перемещении будут получать больше повреждений.§!"
  SOV_industry_relocation_trains_tt:0 "§R[?SOV_industrial_relocation_trains_decision_negative] $train_equipment$s§! будет использовано в течение действия этого решения."
  SOV_industry_relocation_aluminium_plant_trains_tt:0 "§R[?SOV_industrial_relocation_trains_decision_aluminium_negative] $train_equipment$ы будут использованы во время действия этого решения.\n"
  SOV_soviet_aid_to_poum_decision_category:0 "Тайная помощь ПОУМ"
  SOV_soviet_aid_to_poum_decision_category_desc:0 "$SOV_covert_support_for_spanish_poum_desc$"
  SOV_organize_covert_depots_poum:0 "Подготовить тайные склады"
  SOV_organize_covert_depots_poum_desc:0 "Наши антисталинистские контакты в Испании подготовят тайные склады для хранения оружия и военной техники, которые наши агенты приобретут различными способами."
  SOV_organize_covert_depots_poum_tt:0 "Эффекты, когда произойдет восстание ПОУМ:\n"
  SOV_send_infantry_equipment_poum:0 "Поставить винтовки и боеприпасы"
  SOV_send_infantry_equipment_poum_desc:0 "Отправка новых винтовок и боеприпасов позволит нашим испанским товарищам продолжить войну против фашизма и контрреволюционной буржуазии."
  SOV_organize_popular_brigades_poum:0 "Организовать интернациональные бригады"
  SOV_organize_popular_brigades_poum_desc:0 "Мы установим контакт с членами различных политических организаций антисталинистских левых как местных, так и иностранных для формирования интернациональных бригад в поддержку наших испанских товарищей в войне."
  SOV_send_elite_commandos_poum:0 "Отправить элитных коммандос"
  SOV_send_elite_commandos_poum_desc:0 "У нас есть высококвалифицированные и опытные кадры, способные успешно проводить спецоперации, а также несталинистские ветераны Гражданской войны и ветераны армии, которые знают, как вести войну. \nМы должны предоставить эти активы правительству ПОУМ в его борьбе с фашизмом и сталинизмом."
  SOV_send_elite_commandos_poum_flag:0 "Отправил элитных коммандос в Испанию"
  SOV_organize_popular_speeches_poum:0 "Организовать массовые речи"
  SOV_organize_popular_speeches_poum_desc:0 "Нашим испанским товарищам необходимо полное сотрудничество народа для продолжения военных усилий. Мы должны в сотрудничестве с влиятельными членами местных организаций провести информационно-агитационную кампанию, чтобы вновь разжечь пламя революции в испанских массах."
  SOV_infiltrate_stalinist_plans_in_spain_poum:0 "Инфильтровать сталинское командование в Испании"
  SOV_infiltrate_stalinist_plans_in_spain_poum_desc:0 "Новая партия советских военных советников вскоре будет отправлена в Испанию, чтобы помочь буржуазному республиканскому правительству, и у нас есть возможность внедрить нескольких антисталинистских агентов в их ряды. \nЭти агенты будут связываться и набирать солдат, бригадистов и ополченцев, сочувствующих ПОУМ на буржуазно-республиканской стороне, чтобы создать сеть информаторов, которая позволит нам узнать о планах врага до их реализации."
  SOV_default_poum_cd_tt:0 "\nЭто решение снова станет доступным через §Y[?SOV_default_poum_cd]§! дней."
  SOV_long_poum_cd_tt:0 "\nРешение станет доступным через §Y[?SOV_long_poum_cd]§! дней.\n"
  decision_only_once_tt:0 "\nРешение можно активировать только один раз."
