  SOV_secure_the_administration_mission_tt:0 "---\nКогда начнётся гражданская война, центристы получат модификаторы от фокуса §Y$SOV_secure_the_administration$§!."

  SOV_the_bloc_of_rights_and_trotskyites_mission:0 "$SOV_the_bloc_of_rights_and_trotskyites$"
  SOV_the_bloc_of_rights_and_trotskyites_mission_desc:0 "[FROM.GetLeader] работает над выполнением фокуса $SOV_the_bloc_of_rights_and_trotskyites$."
