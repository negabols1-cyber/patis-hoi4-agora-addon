l_russian:
  BALTIC_entente:0 "Балтийская Антанта"
  BALTIC_entente_desc:0 "Мы, балты, объединяем братство, которое характеризуется нашей долгой историей страданий под иностранным империализмом. Мы не можем снова преклоняться перед иностранными державами, потому что это означало бы передать ключи от нашего суверенитета в руки еще одной империалистической державы. Только сплотившись, мы сможем сохранить нашу независимость."
  formalize_the_entente:0 "Оформить Балтийскую Антанту"
  formalize_the_entente_desc:0 "Мы не решались объявить Балтийскую Антанту фракцией в собственном смысле, но мы уверены, что набрали достаточно членов, чтобы противостоять растущему империализму на наших границах."
  abandon_the_entente:0 "Отказаться от Антанты"
  abandon_the_entente_desc:0 "Это было глупой затеей. Как бы нам ни хотелось, чтобы это было возможно, самостоятельное существование Балтии просто не является жизнеспособным вариантом для выживания. Мы должны склониться перед иностранной державой, кем бы она ни была."
  baltic_entente_leader_flag:0 "Является лидером Балтийской Антанты.\n"
  baltic_entente_flag:0 "Согласился присоединиться к Балтийской Антанте"
  convert_neighbours_baltic_cat:0 "Распространить революцию"
  convert_neighbours_baltic_cat_desc:0 "Революция здесь, в [Root.GetNameDef], стала оглушительным успехом, и все, что осталось сделать, это распространить слово о революции нашим балтийским собратьям. Рабочие Балтии будут освобождены от своих буржуазных угнетателей своими собственными руками, но некоторая [Root.GetAdjective] помощь поможет им на их пути."
  BALTIC_promote_communism:0 "Социалистическая пропаганда в [From.Owner.GetNameDef]"
  BALTIC_promote_communism_desc:0 "Многие крестьяне [From.Owner.GetNameDef] по-прежнему видят в социализме врага их образу жизни. Хотя мы, возможно, никогда не исцелим шрамы, оставленные Красной Армией, мы можем убедить их, что наш тип революции не столь кровавый."
  BALTIC_promote_communism_militancy:0 "Поддержать [From.Owner.GetAdjective] боевиков"
  BALTIC_promote_communism_militancy_desc:0 "Социалистический пыл горит так ярко в сердцах многих [From.Owner.GetAdjective] рабочих, им нужна лишь поддержка извне, чтобы начать предпринимать шаги по свержению диктатуры."
  BALTIC_communist_propaganda:0 "Балтийская коммунистическая пропаганда"
  BALTIC_communist_militancy:0 "Балтийская коммунистическая милитантность"
  infiltrate_belarus_decisions:0 "Проникнуть в Белоруссию"
  infiltrate_belarus_decisions_desc:0 "СССР утверждает, что представляет интересы белорусских низов, но балтийские социалисты утверждают, что это чистая бравада. Они утверждают, что [SOV.GetLeader] - буржуазный диктатор в полном смысле этого слова, и только вооружив народ Беларуси, можно по-настоящему освободить его в социалистическом государстве."
  BALTIC_promote_unity_BLR:0 "Борьба за контроль в [From.GetName]"
  BALTIC_promote_unity_BLR_desc:0 "Когда вспыхнет белорусская гражданская война, все государства должны самостоятельно решить, какую сторону революции они поддерживают. Мы должны убедиться, что [From.GetName] находится на стороне победителя."
  BALTIC_belarus_uprising:0 "Гражданская война в Белоруссии"
  BALTIC_belarus_uprising_desc:0 "Белорусский народ разрывается на части, одна половина страны хочет остаться в составе [SOV.GetNameDef], а другая желает присоединиться к Прибалтике."
  support_polish_falange_decisions:0 "Поддержка польского фалангизма"
  support_polish_falange_decisions_desc:0 "Фашизм одержал победу в Литве, и мы не видим причин, по которым мы должны отказываться от наших бывших братьев в Польше. Распространяя фалангистские идеи среди ее населения, мы сможем дать силы [POL.GetFascistParty], и оттуда мы сможем работать над утверждением польско-литовского превосходства на всем континенте."
  LIT_promote_fascism:0 "Фашистская пропаганда в Польше"
  LIT_promote_fascism_desc:0 "Десятилетиями фашизм был отброшен на обочину польской политики. В то время как мы хотели бы, чтобы поляки поднялись за себя, у них почти нет шансов, если мы открыто не будем продвигать фашизм в их стране."
  LIT_promote_falange_militancy:0 "Поддержка фалангистских боевиков"
  LIT_promote_falange_militancy_desc:0 "Partia Faszystowska Polski [POL.GetFascistParty] печально известна своими шумными и жестокими методами демонстраций. Многие фашисты боятся националистического пыла [POL.GetFascistParty], но мы знаем, что это всего лишь выражение патриотизма, который горит в их сердцах и который необходимо поддержать."
  LIT_ignite_civil_war_in_POL:0 "Начать восстание"
  LIT_ignite_civil_war_in_POL_desc:0 "Подготовка завершена. Скоро Польша станет полем битвы не только за идеи, но и за доблесть и славу. Мы сделали все возможное для поддержки фалангистов в Польше, теперь нужно только бросить кости и надеяться, что Бог действительно на их стороне."
  march_through_estonia:0 "Марш через Эстонию"
  march_through_estonia_desc:0 "Слабое правительство Константина Пятса заставило замолчать эстонских патриотов на достаточно долгое время. У нас нет рабочей силы для борьбы с эстонскими вооруженными силами в одиночку, но, возможно, устроив ряд маршей по всей стране и продемонстрировав свое недовольство диктатурой, мы сможем напомнить эстонской молодежи, что их отцы боролись за хорошую жизнь для них, в которой Пятс и его шайка им отказывают."
  EST_stomp_the_vaps:0 "Жестокие репрессии правительства"
  EST_stomp_the_vaps_desc:1 "[EST.GetLeader] знает, что мы стремимся разрушить его режим, и готовится расправиться с нами и положить конец нашим маршам. Если нам не удастся свергнуть правительство до этого момента, в Эстонии начнется гражданская война!"
  EST_march_in_state:0 "Марш в [FROM.GetName]"
  EST_convert_FIN_cat:0 "Марш через Финляндию"
  EST_convert_FIN_cat_desc:0 "Партия [FIN.GetFascistParty] долгое время поддерживала тесные связи с [EST.GetFascistParty], и теперь, когда мы провозгласили власть над собственной нацией, мы должны уполномочить финских ветеранов захватить власть в своей стране."
  EST_march_in_FIN_state:0 "Поход на [FROM.GetName]"
  EST_march_in_FIN_capital:0 "Поход на [FROM.GetName]"
  EST_march_in_FIN_capital_desc:0 "Как только мы посчитаем, что ветераны Финляндии достаточно ободрились, нам нужно будет лишь дать сигнал о походе на [FROM.GetName], и финны наконец-то будут воодушевлены фашизмом."
  promote_baltic_fascism_cat:0 "Продвижение балтийского фашизма"
  promote_baltic_fascism_cat_desc:1 "Балтия характеризуется слабыми, инфантильными режимами, не способными представлять кровь балтов, текущую в жилах их народа. Литве, Эстонии и даже некоторым в Польше необходимо напомнить о славе их предков, которые противостояли германцам и славянам, которые теперь снова стремятся угнетать нас."
  LAT_promote_fascism:0 "Фашистская пропаганда в [From.Owner.GetNameDef]"
  LAT_promote_fascism_desc:0 "Многие в [From.Owner.GetNameDef] еще не приняли тот факт, что их партия [From.Owner.GetFascistParty] - единственный путь, которым [From.Owner.GetAdjective] люди могут наконец управлять собой. Это необходимо исправить с помощью пропагандистских усилий и активной поддержки партии [From.Owner.GetFascistParty]."
  LAT_promote_falange_militancy:0 "Поддержка боевиков [From.Owner.GetFascistParty]"
  LAT_promote_falange_militancy_desc:0 "В [From.Owner.GetNameDef] есть те, кто хранит в своих сердцах ярость балтов, и наш долг - оказать им заслуженную военную и политическую поддержку."
  LAT_ignite_civil_war_in_target:0 "Разожгите гражданскую войну в [From.Owner.GetAdjective]"
  LAT_ignite_civil_war_in_target_desc:0 "Пропаганда может достичь лишь определенных целей, иногда требуются прямые действия, чтобы принести стране силу и стабильность. Мы сделали все, что могли, теперь мы оставим [From.Owner.GetFascistParty] на их судьбу."
  LIT_iron_wolf_coup:0 "Железный волк"
  LIT_iron_wolf_coup_desc:0 "Последователи Августинаса Вольдемараса готовят восстание в нашей стране. Если не принять меры по предотвращению деятельности Железного волка, мы рискуем втянуться в гражданскую войну. Мы должны решить, будем ли мы идти на уступки Железному волку и рисковать расширением их полномочий или же мы просто вышлем их лидера из нашей страны, оставив его последователей разрозненными и без сильного руководства, которое они утверждают, что имеют."
  LIT_iron_wolf_partisans:0 "Железный волк"
  LIT_iron_wolf_partisans_desc:0 "Железный волк обосновывается в нашей стране. Со временем они неизбежно увеличат свою поддержку среди литовского народа и могут в конечном итоге почувствовать себя вольготнее и совершить государственный переворот."
  LIT_iron_wolf_appeasement:0 "Задержать восстание Железного волка"
  LIT_iron_wolf_appeasement_desc:0 "Мы должны принять меры по пресечению деятельности Железного волка в нашей стране. Хотя ни одна из этих мер не ликвидирует их полностью, мы, возможно, сможем задержать их деятельность достаточно долго, чтобы найти постоянное решение."
  LIT_relocate_iron_wolf_recruitment:0 "Переместить вербовочные центры Железного волка"
  LIT_relocate_iron_wolf_recruitment_desc:0 "Железный Волк полагается на местных рекрутеров для пополнения своих рядов новыми людьми. За счет принудительного перемещения этих рекрутеров мы собьем с толку всех будущих последователей и потенциально предотвратим их вступление в группу Железного Волка."
  LIT_promote_alternative_paramilitaries:0 "Поддерживать альтернативные военизированные формирования"
  LIT_promote_alternative_paramilitaries_desc:0 "Хотя мы хотели бы, чтобы наши граждане вступали в официальные литовские вооруженные силы, неизбежно, что некоторые предпочтут присягнуть на верность группе, отделенной от правительства. Возможно, поощряя другие группы, такие как Союз литовских стрелков, мы сможем отвлечь некоторых националистов от вступления в Железный Волк."
  LIT_grant_concessions_to_iron_wolf:0 "Предложить уступки Железному Волку"
  LIT_grant_concessions_to_iron_wolf_desc:0 "Возможно, предложив Железному Волку некоторые символические жесты, мы сможем несколько подавить их волнение."
  EST_vaps_revolt_category:0 "Мятеж вапсов"
  EST_vaps_revolt_category_desc:0 "Ряд ветеранских обществ по всей Эстонии объединились в единую фашистскую организацию, известную как движение Вапсов, которое угрожает свергнуть правительство. Мы должны принять меры, чтобы обуздать рост эстонского национализма, если хотим сохранить мир в стране."
  EST_vaps_uprising:0 "Вапсы идут на Таллин"
  EST_vaps_uprising_desc:0 "Вапсы продолжают маршировать и демонстрировать по всей Эстонии, несмотря на то, что они являются незаконной организацией. Чем дольше мы будем позволять этой группе националистов нарывать, тем больше риска того, что другие присоединятся к их делу."
  EST_vaps_crackdown:0 "Репрессии против вапсов"
  EST_vaps_crackdown_desc:0 "Мы координируем полное подавление всех обществ, связанных с движением вапсов. Если вапсы останутся на политической обочине, то подавление будет незначительным, но если они наберут достаточную поддержку, результатом нашего подавления может стать кровопролитная гражданская война с некоторыми из старейших ветеранов Эстонии."
  EST_fight_vaps_decisions:0 "Бороться с вапсами"
  EST_fight_vaps_decisions_desc:0 "Чтобы наше подавление было успешным, необходимо противостоять Движению вапсов. Действия, которые разрушают вапсов, резко уменьшат их влияние в нашей стране и сделают их насильственное удаление более плавным."
  EST_divide_veterans_societies:0 "Разделить ветеранские общества"
  EST_divide_veterans_societies_desc:0 "Вапсы в основном состоят из тех, кто сражался в Эстонской войне за независимость, и хотя печально видеть, как наши герои попадают под влияние ультранационализма, мы должны расколоть и разделить ветеранские общества, которые объединили вапсы."
  EST_disrupt_vaps_recruitment:0 "Нарушить набор вапсов"
  EST_disrupt_vaps_recruitment_desc:0 "Хотя вапсы традиционно являются ветеранами от среднего возраста до пожилого, им не хватает молодых сторонников, стремящихся присоединиться к ним во имя своих отцов и дедов. Мы должны найти способы сорвать этот набор и удержать этих молодых людей от пения сирены фашизма."
  EST_crackdown_on_vaps:0 "Налет на вапсов"
  EST_crackdown_on_vaps_desc:0 "Вапсы становятся слишком смелыми, мы должны провести рейд по их участникам, если мы хотим подавить их растущее влияние."
  EST_put_vaps_leaders_on_trial:0 "Поставить сторонников вапсидов на суд"
  EST_put_vaps_leaders_on_trial_desc:0 "Не секрет, что некоторые члены правительства сочувствуют движению вапсов. Этого нельзя допустить; члены нашего военного штаба должны быть осуждены как предатели за их связь с вапсами."
  EST_launch_vaps_investigation:0 "Начать расследование вапсидов"
  EST_launch_vaps_investigation_desc:0 "Мы должны выделить отделы наших спецслужб для внедрения и пресечения усилий вапсов по подрыву правительства."
  EST_anti_vaps_propaganda:0 "Антифашистская пропаганда"
  EST_anti_vaps_propaganda_desc:0 "Мы придерживаемся линии при продвижении антифашизма в нашей стране. Многие противники фашизма - демократы и коммунисты, но, возможно, их можно будет убедить поддержать диктатуру в наших совместных усилиях по сдерживанию роста фашизма."
  EST_delay_the_crackdown:0 "Отложить репрессии"
  EST_delay_the_crackdown_desc:0 "Хотя мы предпочли бы, чтобы с вапами разобрались как можно скорее, мы не можем рисковать погрузить страну в смятение, и подавление нужно отложить."
  EST_vapsid_takeover:0 "Правительство вапсидов уже правит страной."
  LAT_perkonkrust_revolt_category:1 "Восстание Перконкрустс"
  LAT_perkonkrust_revolt_category_desc:1 "Ультранационалисты, прославляющие балтийские племена и латышскую национальность, Перконкрустс представляют собой экзистенциальную угрозу для Латвии, которую мы с трудом создали. Перконкрустс — это инфекция, поражающая уязвленную национальную гордость, и их нужно уничтожить."
  LAT_perkonkrust_uprising:1 "Восстание Перконкрустс"
  LAT_perkonkrust_uprising_desc:0 "Со временем Перконкрустс наберет поддержку по всей стране, и если их оставить без внимания, они почувствуют себя достаточно смелыми, чтобы предпринять попытку переворота."
  LAT_delay_perkonkrust_decisions:0 "Бороться с Перконкрустс"
  LAT_delay_perkonkrust_decisions_desc:0 "Хотя это и не постоянное решение, мы можем провести несколько кампаний, чтобы надолго снизить поддержку фашистов в нашей стране, чтобы с Перконкрустс можно было разобраться так или иначе."
  LAT_equality_campaigns:0 "Кампании за равенство"
  LAT_equality_campaigns_desc:0 "Перконкрустс выступают против миссии [Root.GetLeader] по созданию Латвии, в которой солнце светит одинаково для всех латышей, и поэтому мы должны четко дать понять, что поддержка их превосходства противоречит основным ценностям нашей нации."
  LAT_empower_democrats:0 "Укрепление демократов"
  LAT_empower_democrats_desc:0 "Хотя демократы нежеланны, они являются ярыми противниками Перконкрустса и представляют гораздо меньшую угрозу для нашей нации. Это увеличит поддержку демократической оппозиции, но мы должны сделать все возможное, чтобы обуздать деятельность Перконкруста."
  LAT_support_loyalists:0 "Интегрировать оппозицию"
  LAT_support_loyalists_desc:0 "Аннексируя сектора оппозиции, мы получим больше полномочий, чтобы вытеснить Перконкрустс на политическую обочину нашего общества."
  BALTIC_forest_brother_resistance_cat:0 "Сопротивление лесных братьев"
  BALTIC_forest_brother_resistance_cat_desc:0 "Социализм не был полностью принят всеми в нашей стране, и никто так яростно и активно не выражает свое отвращение к новому [Root.GetNonIdeologyName], как лесные братья. Ярые сторонники [Root.GetAdjective] национализма, лесные братья отвергают любое иностранное влияние на [Root.GetNonIdeologyName] и стремятся свергнуть коммунистическую партию с целью создания более националистического правительства."
  BALTIC_forest_brothers_resistance:0 "Подпольная деятельность"
  BALTIC_forest_brothers_resistance_desc:1 "Лесные братья готовятся к совершению актов государственной измены. Мы пока не знаем, что они предпримут, но мы знаем, что это, конечно же, активно помешает нашей цели распространения социализма по всей стране."
  POL_purchase_madagascar:0 "Приобрести [543.GetName]"
  POL_purchase_madagascar_desc:0 "Мадагаскар – это чужеродный ландшафт, полный незнакомой полякам флоры и фауны. Хотя многие считают, что это делает остров непригодным для поляков, некоторые могут рассматривать это как возможность пожить где-то совершенно в новом месте. Размеры острова и наличие потенциальных природных ресурсов делают его идеальным местом для размещения польского правительства в изгнании, если это когда-нибудь потребуется."
  POL_purchase_gambia:0 "Приобрести [701.GetName]"
  POL_purchase_gambia_desc:0 "Сотни лет назад Курляндское герцогство пыталось колонизировать [701.GetName] от имени Речи Посполитой. Несмотря на хорошие отношения с местными жителями, их вытеснили иностранные державы. Настало время исправить это."
  POL_purchase_cheap_colony:0 "Приобрести [FROM.GetName]"
  POL_purchase_cheap_colony_desc:0 "Интерес поляков к [FROM.GetName] растёт. Хотя эти интересы находятся вне поля зрения правительства, энтузиазм можно использовать для обоснования польской покупки региона."
  POL_anti_capitalist_decisions:0 "Антикапиталистическая революция"
  POL_anti_capitalist_decisions_desc:0 "Капитализм – болезнь для Земли. Хотя многие из этих наций называют себя «демократическими», на деле они лишь порабощают пролетариат в буржуазной демократии, и освобождение товарищей – долг каждого социалиста."
  POL_anti_fascist_revolution_category:0 "Антифашистская революция"
  POL_anti_fascist_revolution_category_desc:0 "Фашисты использовали язык пролетарской борьбы против буржуазии для создания ультранационалистических диктатур, продолжающих жестокое угнетение рабочего класса. Как социалистическое государство, мы обязаны освободить трудящихся всего мира от террора фашизма."
  POL_support_monarchy_in_LIT_cat:0 "Наша претензия на [Root.GetRoyalClaim]"
  POL_support_monarchy_in_LIT_cat_desc:1 "Теперь, когда [Root.GetLeader] правит на [Root.GetAdjective] троне, у нас есть божественное право претендовать на [Root.GetRoyalClaim] как на неотъемлемую часть нашей нации.\n\nНаша текущая сила претензий составляет [Root.GetPolRoyalClaimStrength]"
  POL_support_monarchy_in_LIT_tt:0 "Открывает решения §YНаша претензия на Литву§!"
  POL_support_monarchy_in_ROM_tt:0 "Открывает решения §YНаша претензия на Румынию§!"
  POL_support_monarchy_in_CZE_tt:0 "Открывает решения §YНаша претензия на Чехословакию§!"
  LIT_support_monarchy_in_POL_tt:0 "Открывает решения §YНаша претензия на Польшу§!"
