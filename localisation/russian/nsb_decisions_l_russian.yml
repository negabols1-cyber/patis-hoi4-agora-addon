  restructure_supply_system:0 "Реорганизация железнодорожной системы"
  restructure_supply_system_desc:0 "Перенаправив строительные материалы и железнодорожников, мы можем быстро создать небольшое количество импровизированных складов боеприпасов вдоль некоторых из наших железных дорог. Однако это неустойчивый способ управления системой. \n\n§RЭто решение можно принять только один раз. Бонус исчезнет, если вы построите более 3 дополнительных центров снабжения.§!"