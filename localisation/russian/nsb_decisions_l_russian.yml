  POL_pacify_peasants_repeatable:0 "Усмирить [?peasant_state_var.GetName]"
  POL_sanacja_falanga_decisions:1 "Эндеция и Фаланга"
  POL_sanacja_falanga_decisions_desc:0 "Национал-демократы и фалангисты приобрели большое влияние во Второй Польской Республике. Путем предоставления уступок и проведения общенациональных демонстраций влияние фашистов может значительно возрасти в польском правительстве и среди населения."
  POL_nationwide_fascist_displays:0 "Общенациональные фашистские демонстрации"
  POL_appoint_nationalist_ministers:0 "Националистические политические кампании"
  POL_completing_miedzymorze_decision:0 "Уже ведутся переговоры с другой страной"
  form_turkestan_category:0 "Сформировать Тюркскую нацию"
  form_turkestan_category_desc:0 "На протяжении всей нашей истории тюркские народы объединялись и разъединялись бесчисленное количество раз. Если мы сможем взять под свой контроль весь центральноазиатский регион, то сможем вернуть себе наследие великих тюркских ханов и объединить наш народ в единую нацию!"
  form_turkestan:0 "Объединить тюрков"
  form_country_kazakhstan_required_states:0 "Контролировать все государства §YKazakh§!"
  form_country_uzbekistan_required_states:0 "Контролировать все государства §YUzbek§!"
  form_country_kazakhstan_coring_states_tt:0 "Получить ядра на всех государствах §YKazakh§!"
  form_country_uzbekistan_coring_states_tt:0 "Получить ядра на всех государствах §YUzbek§!"
  form_country_sinkiang_coring_states_tt:0 "Получить ядра на всех государствах §YSinkiang§!"
  POL_promote_falangism_decisions:0 "Продвигать фалангизм"
  POL_promote_falangism_decisions_desc:0 "Война с Германией уже не за горами, и хотя у нас меньше оружия, [GER.GetLeader] не сможет уничтожить всех [GER.GetLeader.GerHerHis] врагов сразу! При надлежащей фалангистской поддержке со стороны народа добрые католические нации мира могут присоединиться к нам в нашей борьбе против [GER.GetNameDef]."
