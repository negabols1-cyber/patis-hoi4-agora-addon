  POL_fight_against_monarchy_in_LIT_cat:0 "Противостоять иностранному претенденту"
  POL_fight_against_monarchy_in_LIT_cat_desc:1 "Иностранный агент пытается занять [Root.GetAdjective] трон, заручившись внутренней поддержкой в нашем правительстве. Если удастся не допустить повышения поддержки народом и внутри страны, возможно, получится полностью подорвать его претензии.\n\nТекущая сила претензий: [Root.GetPolRoyalClaimStrength]"
  POL_growing_monarchist_sentiment:0 "Растущие монархические настроения"
  POL_suppress_monarchist_sentiment:0 "Подавить монархические настроения"
  POL_ban_monarchist_propaganda:0 "Запретить монархическую пропаганду"
  POL_root_out_monarchists:0 "Выкорчевать монархистов"
