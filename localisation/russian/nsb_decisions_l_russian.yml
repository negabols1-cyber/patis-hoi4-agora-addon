  SOV_kill_trotsky_dec_cat:0 "Убить Троцкого"
  SOV_raid_trotskys_villa:0 "Налет на виллу Троцкого"
  SOV_raid_trotskys_villa_desc:0 "Агент НКВД Иосиф Григулевич возглавит группу вооруженных убийц во время налета на виллу Троцкого."
  SOV_raid_trotskys_villa_tt:0 "Группа вооруженных налетчиков попытается убить Троцкого, напав на его виллу.\n\nШансы убить Троцкого увеличатся, если: \n- Имеет высокую поддержку коммунистов \n- Состоит в одной фракции с [ROOT.GetFlag][ROOT.GetNameDefCap] \n- Является подданным [ROOT.GetFlag][ROOT.GetNameDefCap]\n"
  SOV_carefully_planned_assassination:0 "Инфильтрация и убийство"
  SOV_carefully_planned_assassination_desc:0 "Родившийся в Испании агент НКВД Рамон Меркадер подружится с доверенными лицами Троцкого, затем он переедет в Мексику, где агент будет выдавать себя за сторонника Троцкого, ожидая подходящего момента для совершения убийства."
  SOV_carefully_planned_assassination_tt:0 "Агент НКВД попытается проникнуть во внутренний круг Троцкого и убить его. \n\nВероятность успешного убийства Троцкого увеличится, если §Y[FROM.GetFlag][FROM.GetNameDefCap]§!: \n-имеет высокую поддержку коммунистов \n-имеет хорошие отношения с [ROOT.GetFlag][ROOT.GetNameDefCap] \n-состоит в одной фракции с [ROOT.GetFlag][ROOT.GetNameDefCap] \n-является субъектом [ROOT.GetFlag][ROOT.GetNameDefCap] \n-уже провел рейд на виллу Троцкого \n"
  SOV_attempting_to_kill_trotsky_flag:0 "Уже проводится еще одна операция по убийству Троцкого."
  SOV_nuclear_espionage_ongoing_flag:0 "Еще одна операция по проникновению в иностранную атомную программу уже проводится."
  SOV_infiltrate_foreign_atomic_programs_dec_cat:0 "Проникновение в иностранные атомные программы"
  SOV_infiltrate_atomic_program:0 "Проникнуть в [GetAtomicProgramNameCaps]"
  SOV_infiltrate_atomic_program_desc:0 "Мы попытаемся завербовать агентов в [FROM.GetNameDef], которые верят в дело коммунизма и могут получить доступ к секретной информации из атомной программы [FROM.GetAdjective]."
  SOV_infiltrate_atomic_program_tt:0 "Мы попытаемся собрать важную информацию, связанную с [GetAtomicProgramName], чтобы ускорить нашу собственную национальную атомную программу.\n\nВероятность успеха в этой операции увеличится, если в §Y[FROM.GetFlag][FROM.GetNameDef]§! будет высокая поддержка коммунистов.\n"
  SOV_atomic_program_usa:0 "Проект Манхэттен"
  SOV_atomic_program_others:0 "Атомная программа [FROM.GetAdjective]"
  SOV_atomic_program_others_caps:0 "[FROM.GetAdjective] Атомная программа"

  SOV_comecon_dec_cat:0 "[GetComeconName]"
  SOV_comecon_dec_cat_name_default:0 "СЭВ"
