  SOV_forge_production_reports:0 "Поддельные отчеты по производству"
  SOV_forge_production_reports_desc:0 "Наши последние отчеты по производству вызывают беспокойство. Мы не знаем, не были ли достигнуты ожидаемые цифры из-за действий диверсантов или из-за постановки нереальных норм. Очевидно одно: если мы хотим избежать новой кампании террора со стороны НКВД, нам лучше подкорректировать производственные показатели так, чтобы они выглядели приемлемо."
  SOV_inspection_in_the_administration:0 "Инспекция в администрации"
  SOV_inspection_in_the_administration_desc:0 "Мы проведем проверку местной и центральной администрации, чтобы выявить возможных диссидентов и вредителей."
  SOV_inspection_in_the_army:0 "Инспекция в армии"
  SOV_inspection_in_the_army_desc:0 "Мы должны разрешить НКВД провести проверку в армии, чтобы выявить возможных диссидентов и вредителей."
  SOV_inspection_in_the_navy:0 "Проверка на флоте"
  SOV_inspection_in_the_navy_desc:0 "Мы должны разрешить НКВД провести проверку на флоте, чтобы выявить потенциальных диссидентов и вредителей."
  SOV_inspection_in_the_airforce:0 "Проверка в военно-воздушных силах"
  SOV_inspection_in_the_airforce_desc:0 "Мы должны разрешить НКВД провести проверку в военно-воздушных силах, чтобы выявить потенциальных диссидентов и вредителей."
  SOV_paranoia_administration_purgeable_tt:0 "Подозрительные дела в администрации подлежат расследованию"
  SOV_paranoia_army_purgeable_tt:0 "Подозрительные дела в армии подлежат расследованию"
  SOV_paranoia_navy_purgeable_tt:0 "Подозрительные дела на флоте подлежат расследованию"
  SOV_paranoia_airforce_purgeable_tt:0 "Подозрительные дела в военно-воздушных силах подлежат расследованию"
  SOV_paranoia_inspection_cd_tt:0 "\nЭто решение будет доступно снова через §Y[?SOV_paranoia_inspection_re_enable_days] дней§!."
  SOV_paranoia_calm_down_stalin_cd_tt:0 "\nЭто решение будет доступно снова через §Y[?SOV_paranoia_calm_down_stalin_re_enable_days] дней§!."
  SOV_paranoia_conducting_inspection_flag:0 "Уже проводится проверка"
  SOV_loosen_prohibitions_in_military_academies_dec:0 "Ослабить запреты в военных академиях"
  SOV_loosen_prohibitions_in_military_academies_dec_desc:0 "Мы снимем ограничения на исследовательские и справочные документы в наших военных академиях, чтобы наши молодые офицеры имели более широкий спектр источников обучения для развития своих навыков в менее гнетущей обстановке."
  SOV_reinforce_army_officer_ranks_with_veterans_dec:0 "Укрепить армейские офицерские звания"
  SOV_reinforce_army_officer_ranks_with_veterans_dec_desc:0 "Мы укрепим наши сокращенные офицерские звания в армии закаленными и талантливыми ветеранами."
  SOV_reinforce_navy_officer_ranks_with_veterans_dec:0 "Укрепить военно-морские офицерские звания"
  SOV_reinforce_navy_officer_ranks_with_veterans_dec_desc:0 "Мы укрепим наши сокращенные офицерские звания на флоте закаленными и талантливыми ветеранами."
  SOV_reinstate_mig_design_bureau:0 "Восстановить КБ МиГ"
  SOV_reinstate_mig_design_bureau_desc:0 "Мы восстановим это авиационное КБ и реабилитируем всех инженеров и конструкторов, не связанных с какими-либо доказательствами саботажа или антисоветского поведения."
  SOV_reinstate_ilyushin_design_bureau:0 "Восстановить КБ Ильюшина"
  SOV_reinstate_ilyushin_design_bureau_desc:0 "$SOV_reinstate_mig_design_bureau_desc$"
  SOV_reinstate_tupolev_design_bureau:0 "Восстановить КБ Туполева"
