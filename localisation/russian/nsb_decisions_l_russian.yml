  SOV_wreckers_sabotage_military_production_desc:0 "Без вооружения армия [SOS.GetLeader] не сможет сражаться."
  SOV_wreckers_sabotage_military_production_tt:0 "Зданиям §Y$arms_factory$§! наносится урон"
  SOV_wreckers_sabotage_dockyards:0 "Саботаж вражеских верфей"
  SOV_wreckers_sabotage_dockyards_desc:0 "Нанося урон морскому производству [SOS.GetLeader], [SOS.GetAdjective] вынужден будет переключиться на другие цели."
  SOV_wreckers_sabotage_dockyards_tt:0 "Зданиям §Y$dockyard$§! наносится урон"
  SOV_wreckers_sabotage_railways:0 "Саботаж вражеской железнодорожной сети"
