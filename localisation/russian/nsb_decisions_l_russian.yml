 SOV_the_head_of_the_nkvd_yezhov:0 "Глава НКВД — Ежов"
  SOV_the_head_of_the_nkvd_yezhov_desc:1 "$SOV_genrikh_yagoda$, нынешний глава НКВД, находится в хороших отношениях со многими представителями правой оппозиции. Убедить его в том, что выбранный нами путь - верный для страны, не составит труда."
  SOV_the_head_of_the_nkvd_yagoda:0 "Глава НКВД - Ягода"
  SOV_the_head_of_the_nkvd_yagoda_desc:1 "$SOV_genrikh_yagoda$ может и не состоять в дружеских отношениях с лидерами Правой оппозиции, но с ним хотя бы можно вести диалог. Возможно, нам удастся показать Ягоде преимущества нашего предложения и убедить его в том, что наша сторона победит."
  SOV_aligned_right_opposition_flag:0 "Сторонник Правой оппозиции"
  SOV_the_head_of_the_nkvd_yagoda_tt:0 "§Y$SOV_genrikh_yagoda$§! становится сторонником Правой оппозиции."
  SOV_the_head_of_the_nkvd_yezhov_tt:0 "§Y$SOV_nikolay_yezhov$§! становится сторонником Правой оппозиции."
  SOV_assassinate_stalin:0 "Устранить Сталина"
  SOV_assassinate_stalin_desc:1 "Мирное устранение тирании возможно только при устранении самого тирана. Это акт отчаяния, но он избавит народ от ужасов новой гражданской войны. Мы должны нанести удар и продолжить осуществлять план переворота прежде, чем его преемник успеет заручиться поддержкой."
  SOV_assassinate_stalin_good_tt:0 "На Сталина совершено покушение\nШанс на успех = §G80%§!\n £trigger_yes base: 50 %\n £trigger_yes $SOV_infiltrate_the_nkvd$: +30%"
  SOV_assassinate_stalin_bad_tt:0 "Совершено покушение на Сталина\nШанс на успех: §Y50%§!\n £trigger_yes базовый: 50 %\n £trigger_no $SOV_infiltrate_the_nkvd$: +30%"
  SOV_assassinate_stalin_outcome_tt:0 "---\nЕсли покушение удалось, §Y$SOV_lavrenty_beriya$§! временно возьмет контроль на себя, создавая возможность для успешного переворота.\nЕсли покушение не удалось, $SOV_paranoia_very_high_increase_effect_tt$."
  SOV_send_supporters_abroad:0 "Отправить сторонников за рубеж"
  SOV_send_supporters_abroad_desc:1 "Самое безопасное место как можно дальше от сталинских приспешников. Нам нужно вывезти ключевых людей из страны в безопасное место, пока не придет время вернуться и завершить начатое нами дело."
  SOV_send_supporters_abroad_exile_tt:0 "Следующие персонажи будут отправлены в изгнание (§Gперсонажей в изгнании нельзя очистить§!):"
  SOV_send_supporters_abroad_back_tt:0 "\nЭтих персонажей вернут в страну, чтобы они поддержали нас в случае гражданской войны.\n"

  SOV_character_purged_flag:0 "Был очищен"

  SOV_align_general_stalin:1 "[ROOT.GetLeader] обеспечивает лояльность генерала"
  SOV_align_general_stalin_desc:1 "Используя все имеющиеся в его распоряжении средства, [ROOT.GetLeader] пытается обеспечить лояльность военного лидера в качестве подготовки к будущему конфликту."
  SOV_align_general_stalin_tt:0 "§Y[?SOV.SOV_selected_general_stalin.GetName]§! становится лояльным к [ROOT.GetLeader]"
  SOV_permanent_revolution_dec_cat:0 "Перманентная революция"
  SOV_permanent_revolution_dec_cat_desc:1 "[ПолучитьПодходящееОписаниеКатегДекретаПостояннойРеволюции]"
  SOV_permanent_revolution_dec_cat_desc_soviet:0 "$SOV_desc_постоянной_революции$"
  SOV_permanent_revolution_dec_cat_desc_targets:0 "Марксистская теория учит, что революция неизбежна, если сложились соответствующие обстоятельства, а многочисленные [SOV.ПолучитьПрилагательное] вражеские агенты, действующие в наших границах, гарантируют, что обстоятельства среди рабочего класса подходящие для успешного вооруженного восстания в [ROOT.GetName]."
  SOV_organize_fifth_columnists_in_enemy_neighbor:0 "Организовать [FROM.ПолучитьПрилагательное] пятую колонну"
  SOV_organize_fifth_columnists_in_enemy_neighbor_desc:1 "[FROM.GetNameDef] Рабочие и крестьяне, симпатизирующие большевистской партии, подготовились к вооруженному восстанию, и готовы нанести удар там, где враг меньше всего этого ожидает."
  SOV_ignite_uprising_timer_mission:0 "Надвигающееся революционное восстание"
  SOV_ignite_uprising_timer_mission_desc:1 "Рабочие и крестьяне [ROOT.ПолучитьПрилагательное], симпатизирующие [SOV.ПолучитьПрилагательное] большевистской партии, готовятся к вооруженному восстанию в стране."
  SOV_ignite_uprising_timer_mission_tt:0 "§RTроцкистское революционное ополчение восстанет во множестве подконтрольных государств.§!\n"
  SOV_ignite_revolutionary_uprisings_effect_tt:0 "Снизить £stability_texticon §YСтабильность§! и повысить §YПопулярность коммунизма§! в [FROM.GetNameDef], основываясь на текущей §YПопулярность коммунизма§! в стране. Текущие эффекты:"
  SOV_ignite_revolutionary_uprisings:0 "Поднять народ на восстание в [FROM.GetNameDef]"
  SOV_ignite_revolutionary_uprisings_desc:1 "Рабочие [FROM.GetNameDef] уже начали демонстрировать свое недовольство [FROM.GetRulingParty] и их буржуазной политикой. Пришло время продвигать коммунистическую идеологию в [FROM.GetAdjective] рабочем классе."
  SOV_align_admiral_stalin:0 "[ROOT.GetLeader] обеспечивает лояльность адмирала"
  SOV_align_admiral_stalin_desc:1 "С помощью угроз, взяток и личных связей [ROOT.GetLeader] пытается обеспечить лояльность флотского командира в качестве подготовки к будущему конфликту."
  SOV_align_admiral_stalin_tt:0 "§Y[?SOV.SOV_selected_admiral_stalin.GetName]§! становится лояльным к [ROOT.GetLeader]"
  SOV_ukraine_crackdown_timer:0 "Зачистка на Украине"
  SOV_ukraine_crackdown_timer_desc:0 "НКВД решил нацелиться на Украину, проводя массовые аресты и допросы, чтобы обеспечить лояльность народа в регионе."
  SOV_ukraine_crackdown_timer_tt:0 "Одно государство в украинском регионе будет присоединено к центристам."
  SOV_steppe_crackdown_timer:0 "Зачистка в регионе Великой Степи"
  SOV_steppe_crackdown_timer_desc:0 "НКВД решил нацелиться на регион Великой Степи, проводя массовые аресты и допросы, чтобы обеспечить лояльность народа в регионе."
  SOV_steppe_crackdown_timer_tt:0 "Одно государство в регионе Великой Степи будет присоединено к центристам."
  SOV_northern_crackdown_timer:0 "Зачистка в Северном регионе"
  SOV_northern_crackdown_timer_desc:0 "НКВД решило взяться за Северный регион, проводя массовые аресты и допросы, чтобы гарантировать лояльность населения в регионе."
  SOV_northern_crackdown_timer_tt:0 "Один штат в Северном регионе будет настроен на центристов."
  SOV_siberian_crackdown_timer:0 "Зачистка в Сибири"
  SOV_siberian_crackdown_timer_desc:0 "НКВД решило взяться за Сибирский регион, проводя массовые аресты и допросы, чтобы гарантировать лояльность населения в регионе."
  SOV_siberian_crackdown_timer_tt:0 "Один штат в Сибири будет настроен на центристов."
  SOV_urals_crackdown_timer:0 "Зачистка на Урале"
  SOV_urals_crackdown_timer_desc:0 "НКВД решило взяться за Урал и Зауралье, проводя массовые аресты и допросы, чтобы гарантировать лояльность населения в регионе."
