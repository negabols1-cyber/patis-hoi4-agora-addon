  POL_ban_polish_imports:0 "Запретить импорт из [From.GetAdjective]"
  POL_skirmish_with_monarchist_militants:0 "Разоружить монархических боевиков"
  POL_monarchist_civil_war:0 "Разжечь гражданскую войну"
  POL_ban_monarchists:0 "Покончить с монархическим вопросом"
  POL_cossack_republic_decisions:0 "Республики казаков"
  POL_cossack_republic_decisions_desc:0 "Во время Гражданской войны в России было создано несколько независимых казачьих держав, сражавшихся на стороне белых. Теперь, когда белые изгнанники продвигаются вглубь территории России, у нас есть возможность возродить павшие республики."
  POL_restore_don_cossacks:0 "Восстановить Донскую республику"
  POL_restore_don_cossacks_desc:0 "Донские казаки, непримиримые противники большевизма, воевали в составе Белой Армии. Теперь, когда вся их территория находится под нашим контролем, мы можем пригласить казаков-эмигрантов вернуться на земли предков и сражаться вместе со своими товарищами."
  POL_restore_kuban_cossacks:0 "Восстановить Кубанскую республику"
  POL_restore_kuban_cossacks_desc:0 "Предательство кубанских казаков стало главной причиной поражения Белой Армии. Теперь мы должны быть уверены в том, что Кубанью будет руководить лояльное правительство."
  POL_add_state_to_strike:1 "Включить в забастовку [From.GetName]"
  POL_expand_the_strike_name:1 "Расширить крестьянскую забастовку"
  POL_anti_fascist_military:0 "Антифашистские военные"
  POL_escelate_the_strike:1 "DEBUG: Ускорить забастовку"
  POL_escelate_the_strike_desc:1 "Отладочное решение для быстрого перехода крестьянской забастовки на следующий этап. Это решение должно быть невидимым, если не включён режим отладки."
  POL_expand_strikes_to_factories:0 "Распространить забастовки на фабрики"
  POL_expand_strikes_to_factories_tt:0 "Позволяет вовлечь в забастовку индустриально развитые штаты."
