  SOV_polish_territory: "Польская территория"
  SOV_polish_territory_desc: "Мы в настоящее время контролируем большое количество территорий, которые когда-то были частью так называемой Польской республики. Если мы вернем часть из них, руководство, которое мы установили в [POL.capital.GetCapitalVictoryPointName], сможет использовать это в качестве доказательства преимуществ сотрудничества с [ROOT.GetNameDef]."
  SOV_return_states_to_poland: "Возвращение штатов [POL.getname]"
  SOV_return_states_to_poland_desc: "В качестве жеста доброй воли и в знак того, кто главный, мы должны вернуть все территории к западу от [95.GetCapitalVictoryPointName], на которые претендует [POL.getNameDef], марионеточному режиму [POL.GetAdjective]."
  fought_vaps_flag:0 "Расправа над вапами"
  SOV_integrate_czechoslovakia:0 "Интеграция Чехословакии"
  SOV_integrate_bulgaria:0 "Интеграция Болгарии"
  SOV_integrate_poland:0 "Интеграция Польши"
  SOV_integrate_yugoslavia:0 "Интеграция Югославии"
  SOV_declare_the_pan_slavic_union:0 "Объявление о Всеславянском союзе"
  SOV_integrated_czechoslovakia_flag:0 "[SOV.GetNameDefCAP] интегрировала [CZE.GetName]"
  SOV_integrated_bulgaria_flag:0 "[SOV.GetNameDefCAP] интегрировала [BUL.GetName]"
  SOV_integrated_poland_flag:0 "[SOV.GetNameDefCAP] присоединил [POL.GetName]"
  SOV_integrated_yugoslavia_flag:0 "[SOV.GetNameDefCAP] присоединил [YUG.GetName]"
  form_mountainous_republic_category:0 "Создать Горную Республику Северного Кавказа"
  form_mountainous_republic_category_desc:0 "Во время Гражданской войны в России великий Тапа Чермоев пытался объединить республики, расположенные на Северном Кавказе, под одним флагом, чтобы отразить русских захватчиков. И снова народ Северного Кавказа объединяется, чтобы изгнать иностранные державы и восстановить свою славу!"
  form_mountainous_republic:0 "Объединить горные республики"
  form_transcaucasus_category:0 "Закавказская республика"
  form_transcaucasus_category_desc:0 "Закавказская республика, недавно распущенная после принятия советской конституции 1936 года, все еще остается идеей, запечатленной в умах людей. Если какой-либо стране удастся объединить эти территории, существует вероятность, что федерация будет восстановлена, а Закавказье снова будет единым и сильным."
