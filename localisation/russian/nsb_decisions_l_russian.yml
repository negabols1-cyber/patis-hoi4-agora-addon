 SOV_secure_moscow_opposition:0 "Защитить Москву"
 SOV_secure_moscow_opposition_desc:0 "Использовать наши связи в Москве, чтобы обеспечить восстание партизан в регионе, в попытке захватить столицу."
 SOV_secure_moscow_opposition_tt:0 "В начале гражданской войны в Москве поднимутся партизанские отряды."
 SOV_secure_leningrad_opposition:0 "Защитить Ленинград"
 SOV_secure_leningrad_opposition_desc:0 "Использовать наши связи в Москве, чтобы обеспечить восстание партизан в регионе, в попытке захватить город у центристов."
 SOV_secure_leningrad_opposition_tt:0 "В начале гражданской войны в Ленинграде поднимутся партизанские отряды."

