  SOV_pressure_country_government_baltic:0 "Оказывать давление на правительство [FROM.GetAdjective]"
  SOV_pressure_country_government_baltic_desc:0 "Мы окажем давление на правительство [FROM.GetAdjective] с целью принятия политики, более соответствующей нашим интересам."
  SOV_promote_ideology_rallies_baltic:0 "Организовать пропагандистские митинги в [FROM.GetNameDef]"
  SOV_promote_ideology_rallies_baltic_desc:0 "[ROOT.GetAdjective] агенты проведут политические митинги по всей [FROM.GetNameDef], чтобы продвигать [ROOT.GetIdeologyNameWithCaps] среди [FROM.GetAdjective] масс."
  SOV_send_ultimatum_to_country_baltic:0 "Направить ультиматум в [FROM.GetNameDef]"
  SOV_send_ultimatum_to_country_baltic_desc:0 "С помощью ультиматума мы окажем давление на [FROM.GetAdjective] правительство, чтобы оно удовлетворило наши требования."
