l_russian:
  bftb_greece.1.t:0 "Монархисты выигрывают выборы!"
  bftb_greece.1.desc:1 "Греческие толпы не были удивлены, услышав, что консерваторы, верные королю Георгу II, выиграли греческие выборы 1936 года. Ожидается, что премьер-министр Константинос Демерцис продолжит занимать свою должность, и король выразил свою личную уверенность в том, что премьерство Демерциса будет очень долгим и успешным. Время покажет, верен ли король своим предчувствиям..."
  bftb_greece.1.a:0 "Великая победа для Греции..."
  bftb_greece.2.t:0 "Венезелисты выигрывают выборы!"
  bftb_greece.2.desc:1 "Сегодня греческий народ заполнил улицы Греции, празднуя выбор армии, чтобы обеспечить, чтобы монархисты не могли вмешиваться в результаты выборов. Венезелисты получили мощный мандат на управление, вернувшись из своей эмиграции за границу; но перед ними стоит трудная задача объединить очень разделенную страну, страну, которая не забыла катастрофическую войну, в которую венезелисты втянули всю страну в 1919 году. Также остается вопрос, что венезелисты будут делать с захваченным греческим монархом - независимо от того, что произойдет, впереди для Греции интересные времена..."
  bftb_greece.2.a:0 "Наконец, мы вернулись!"
  GRE_republican_victory_tt:1 "The £faction_gre_monarchist §YMonarchists§! become §YIndifferent§!. \nThe £faction_gre_communist §YCommunists§! become §YIndifferent§!."
  bftb_greece.3.t:1 "Анатолийские фашисты мобилизуются"
  bftb_greece.3.desc:1 "Самопровозглашенное фашистское движение Греции переориентировалось в соответствии с нашей новой политической реальностью. Озлобленные и недовольные греческие беженцы, изгнанные из Турции, начинают стекаться к новому радикальному политическому движению Георгиоса Космидиса, еще одного грека, изгнанного из своей родины. \n\nКосмидис - ярый сторонник Мегали Идеи и возвращения исторических территорий, утраченных [TUR.GetNameDef], хотя его взгляды гораздо радикальнее, чем у любого венезелистского правительства. Некоторые сообщения свидетельствуют о том, что Космидис стремится к расширению границ [ROOT.GetNameDef] за пределы Эгейского моря, и что он может иметь планы на всю Анатолию. Однако такие сообщения следует воспринимать с долей скептицизма - какой сумасшедший может иметь планы на всю [TUR.GetNameDef]?"
  bftb_greece.3.a:1 "Никто никогда не последует за этим бандитом!"
  GRE_anatolian_fascists_in_play_tt:1 "The £faction_gre_fascist §YFascists§! emerge and start off as §Rhostile§!."
  GRE_republican_monarchist_alliance_tt:1 "Monarchist generals and ministers will remain available to the Venezelist government. \nThe £faction_gre_monarchist §YMonarchists§! has become §Gfriendly§!. \nThe £faction_gre_communist §YCommunists§! will turn §Rhostiles§!."
  bftb_greece.6.t:0 "Переговоры с ЕЕЕ"

  bftb_greece.6.desc:0 "Подлые анатолийские фашисты сеют хаос, оставаясь недосягаемыми для правительства с самого начала своего злокачественного движения, однако ситуация, похоже, меняется. К нам обратились с предложением заключить сделку века - объединить наши силы с анатолийскими фашистами, чтобы продвинуть нашу общую цель - разгром [TUR.GetNameDef]. \n\nНельзя отрицать, что многие из нашей администрации заключили бы эту сделку с дьяволами нашей нации, просто чтобы заставить их прекратить свои антиправительственные действия, и также нельзя отрицать, что среди наших гражданских служащих есть даже змеи, которые находят цели ЕЕЕ приемлемыми или даже достойными похвалы. К счастью, магнат Аристотель Онассис представил нам альтернативный курс действий: Онассис, тоже родом из Анатолии, создаст контрдвижение, используя свою известность, деловую хватку и личное состояние, и с помощью этого движения подорвет базу поддержки ЕЕЕ. Этот курс действий ни в коем случае не гарантирует разгром ЕЕЕ, но у нас достаточно доказательств, чтобы предположить, что Онассис вполне мог бы провернуть эту аферу, если мы попросим его об этом."
  bftb_greece.6.a:1 "Призраки прошлого не вернутся, чтобы снова преследовать нас."
  bftb_greece.6.b:0 "Никаких сделок с фашистской нечистью."
  GRE_ally_the_anatolian_fascists_tt:1 "£faction_gre_fascist §YФашисты§! станут §Gдружественными§!! \nСоюз с §YEEE§! будет иметь §Rсерьезные последствия§! при созыве §YГераклейской Конвенции§!"
  GRE_ally_onassis_tt:1 "§YAристотель Онассис§! станет доступен в качестве министра. \n£faction_gre_fascist §YФашисты§! останутся §Yвраждебными§!"
  GRE_increased_influence_tt:0 "Это увеличит наше влияние на §Y[FROM.GetAdjective]§! правительство."
  bftb_greece.7.t:0 "Гераклейская Конвенция"
  bftb_greece.7.desc:0 "Наконец-то пришло время пересмотреть договоры Севра и Лозанны с великими державами Европы, а также заново подойти к теме Мегали Идеи. Судьба [TUR.GetNameDef] не может быть решена только нами, поэтому мы должны сначала заручиться одобрением и культивировать поддержку [ENG.GetNameDef], [FRA.GetNameDef] и презренного [ITA.GetNameDef], если мы решим пригласить их на нашу конференцию."
  bftb_greece.7.a:0 "Мы пригласим делегатов [FRA.GetAdjective] и [ENG.GetAdjective]."
  bftb_greece.7.b:0 "Мы пригласим оригинальных подписантов Севра."
  bftb_greece.8.t:0 "Приглашение на Гераклейскую Конвенцию"

  bftb_greece.8.desc:0 "Мы только что получили интересное предложение от [FROM.GetNameDef], которые, очевидно, стремятся пересмотреть границы [TUR.GetNameDef]. [FROM.GetNameDef] стремятся провести дискуссию среди европейских держав-победительниц Первой мировой войны, чтобы пересмотреть Севрский и Лозаннский договоры, которые мы пытались навязать [TUR.GetNameDef]. \n\nЧиновники из [FROM.GetNameDef] уверяют наших чиновников, что мы получим материальную выгоду от побежденной [TUR.GetNameDef], и что уничтожение [TUR.GetNameDef] не является желанием [FROM.GetAdjective] правительства. Вместо этого, представители [FROM.GetNameDef] настаивают на том, чтобы называть эту конвенцию простой перестановкой границ, а не осуществлением реваншистских мечтаний."
  bftb_greece.8.a:0 "Ждите нас там."
  bftb_greece.8.b:0 "Вы дестабилизируете Средиземноморье!"
  potential_war_with_turkey_tt:0 "§RЕсли мы согласимся присутствовать, есть значительная вероятность того, что в ближайшем будущем мы окажемся втянутыми в войну с [TUR.GetNameDef] в обмен на территорию там§!."
  bftb_greece.9.t:0 "Только [ENG.GetNameDef] участвует в Ираклионской конвенции"
  bftb_greece.9.desc:0 "Приглашения на нашу Ираклионскую конвенцию по реорганизации границ [TUR.GetNameDef] были отправлены всем державам, которых мы хотели видеть там. Хотя мы ожидали, что все приглашенные страны примут участие, оказывается, только [ENG.GetNameDef] будет участвовать в нашем саммите. Наши отношения с [ENG.GetNameDef] всегда были глубокими, поэтому многие наши чиновники уверены, что Ираклионская конвенция может быть решена таким образом, который принесет пользу обеим нашим странам."
  bftb_greece.9.a:0 "[ENG.GetAdjective] всегда были надежны!"
  bftb_greece.10.t:0 "Только [FRA.GetNameDef] участвует в Ираклионской конвенции"
  bftb_greece.10.desc:0 "Приглашения на нашу Ираклионскую конвенцию по реорганизации границ [TUR.GetNameDef] были отправлены всем державам, которых мы хотели видеть там. Хотя мы ожидали, что все приглашенные страны примут участие, оказывается, только [FRA.GetNameDef] будет участвовать в нашем саммите. Разочарование - это слово, которое лучше всего описывает эмоции [ROOT.GetAdjective] чиновников после получения этой новости. Ни наша политическая элита, ни наши военные специалисты не уверены, что Ираклионская конвенция принесет те плоды, которые от нее ожидались, с [FRA.GetAdjective] в качестве единственного союзника, но мы остаемся верными своему курсу действий."
  bftb_greece.10.a:0 "Только [FRA.GetAdjective]? Мы должны просто покончить с этим."
  bftb_greece.11.t:0 "Только [ITA.GetNameDef] участвует в Ираклионской конвенции"

  bftb_greece.11.desc:0 "Наши удрученные чиновники обдумали ужасные новости о том, что только [ITA.GetNameDef] проявил интерес к решению судьбы [TUR.GetNameDef] на Гераклейской Конвенции, и в итоге решили, что единственный вариант действий - отменить Гераклейскую Конвенцию полностью. Это решение не было принято легко, поскольку многие чиновники Венезелиста прекрасно понимают, что они поставили весь легитимный статус их движения под удар ради мести за 1922 год, а теперь ситуация развивается таким образом, что вся операция находится под угрозой.\n\n[ROOT.GetAdjective] народ уже начал беспокоиться из-за отсутствия новостей после того, как вокруг этого события было создано столько шума. ЕЕЕ с энтузиазмом воспользовались бушующими огнями недовольства, обвиняя наше правительство в слабости и невыполнении обещаний. Как [ROOT.GetLeader] выведет нас из этих мутных вод?"
  bftb_greece.11.a:0 "Ничего хорошего из этого не выйдет; конвенцию необходимо отменить."
  bftb_greece.12.t:0 "[ENG.GetNameDefCap] и [FRA.GetNameDef] присутствуют на Гераклейской Конвенции"
  bftb_greece.12.desc:0 "Чиновники, собравшиеся в столице, были обрадованы, узнав, что как [ENG.GetNameDef], так и [FRA.GetNameDef] отправят делегатов для участия в нашей Гераклейской Конвенции. Подготовка к саммиту уже завершена, и конвенция официально начнется через несколько дней.\n\nВместе наши делегаты разделят сферы влияния на севере и юге [TUR.GetName] перед тем, как окончательно решить, должны ли мы получить наши законные территории вдоль Эгейского моря. История вот-вот будет сделана, и [ROOT.GetNameDef] будет в самом ее сердце."
  bftb_greece.12.a:0 "[ROOT.GetAdjective] руки будут лепить мир."
  bftb_greece.13.t:0 "Все подписавшие Севрский договор присутствуют на Гераклейской Конвенции"
  bftb_greece.13.desc:0 "Чиновники, собравшиеся в столице, были обрадованы, узнав, что как [ENG.GetNameDef], так и [FRA.GetNameDef] отправят делегатов для участия в нашей Гераклейской Конвенции, но это ликование было омрачено беспокойством по поводу присутствия [ITA.GetNameDef]. Многие из наших политических деятелей в частном порядке выразили опасения, что [ITA.GetAdjective] махинации могут сорвать все мероприятие, но [ROOT.GetLeader] по-прежнему убежден, что приглашение [ITA.GetNameDef] было правильным решением. Подготовка к саммиту уже завершена, и конвенция официально начнется через несколько дней.\n\nВместе наши делегаты разделят сферы влияния на севере и юге [TUR.GetName] перед тем, как окончательно решить, должны ли мы получить наши законные территории вдоль Эгейского моря. История вот-вот будет сделана, и [ROOT.GetNameDef] будет в самом ее сердце."
  bftb_greece.13.a:0 "Это должно быть интересно..."
  bftb_greece.14.t:0 "Никто не присутствует на нашей конвенции!"

  bftb_greece.14.desc:0 "Правительство потерпело полное и абсолютное фиаско, узнав, что ни одна из приглашенных стран не отправит делегатов на нашу Гераклейскую Конвенцию, и, что еще хуже, лидерство нашей страны подверглось публичной критике со стороны этих великих держав за разжигание напряженности в регионе. Сказать, что эта цепь событий оказалась не менее чем разрушительной, было бы преуменьшением, так как многие чиновники Венезелисты прекрасно осознают, что поставили на кон всю легитимность своего движения, стремясь отомстить за 1922 год, а сейчас ситуация дошла до того, что вся операция оказалась под угрозой.\n\n[ROOT.GetAdjective] народ уже начал волноваться из-за отсутствия новостей после того, как было создано столько шумихи вокруг этого события. ЕЕЕ с жадностью воспользовались разгорающимися очагами недовольства, клеймя наше правительство за слабость и неспособность выполнить обещания. Как [ROOT.GetLeader] выведет нас из этих мутных вод?"
  bftb_greece.14.a:0 "Наша гордыня привела нас к гибели."
  bftb_greece.15.t:0 "Гераклейская Конвенция - [FRA.GetAdjective] мандат в Курдистане?"
  bftb_greece.15.desc:0 "Тема для первого раунда голосования - разрешить ли [FRA.GetNameDef] получить [FRA.GetAdjective] мандат в [TUR.GetAdjective] Курдистане после капитуляции [TUR.GetNameDef]. Многие присутствующие [FRA.GetAdjective] чиновники считают, что такая договоренность вполне логична, учитывая близость [FRA.GetNameDef] к региону и довольно выраженное чувство национализма, уже существующее в [TUR.GetAdjective] Курдистане, хотя признается, что дома может возникнуть сопротивление этой идее, учитывая, насколько перегружена [FRA.GetAdjective] империя.\n\nЕсли [FRA.GetAdjective] будет предоставлена концессия в [TUR.GetNameDef], то они будут обязаны по договору прийти на помощь [GRE.GetNameDef], как только начнется война с [TUR.GetNameDef]. Если предложение не будет принято, то независимо от исхода Гераклейской Конвенции [FRA.GetNameDef] не будет иметь никаких обязательств перед [GRE.GetNameDef], когда начнется их война."
  bftb_greece.15.a:0 "Мы голосуем за!"
  bftb_greece.15.b:0 "Мы голосуем против!"
  GRE_french_kurdistan_option_tt:1 "Если предложение будет принято и Гераклейская Конвенция в конечном итоге завершится успешно, то после капитуляции §Y[TUR.GetNameDefCap]§! §Y[FRA.GetNameDefCap]§! создаст §YKурдское§! марионеточное государство во всех [TUR.GetAdjective]-захваченных штатах, которые являются ядрами §YКурдистана§!."
  bftb_greece.16.t:0 "Гераклейская Конвенция - [FRA.GetAdjective] получают свой мандат!"

  bftb_greece.16.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [FRA.GetNameDef] получил мандат в Курдистане после успешного свержения [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники похвалили присутствующих делегатов за их мудрое государственное управление и уже передали инструкции центральному [FRA.GetAdjective] правительству о начале планирования создания администрации в этом регионе."
  bftb_greece.16.a:0 "«За» побеждает!"
  bftb_greece.17.t:0 "Гераклейская конвенция - [FRA.GetAdjective] отказано в мандате!"
  bftb_greece.17.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [FRA.GetNameDef] было отказано в любой территории в Курдистане после успешного разгрома [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники почти решили полностью покинуть конвенцию, назвав мероприятие фарсом, прежде чем прийти к соглашению о том, что они предпочли бы все же иметь возможность влиять на последующие события, даже если им ничего не обещали."
  bftb_greece.17.a:0 "«Против» побеждает!"
  bftb_greece.18.t:0 "Гераклейская конвенция - [ENG.GetAdjective] протекторат в Армении?"
  bftb_greece.18.desc:0 "Темой для этого раунда голосования является вопрос о том, следует ли предоставить [ENG.GetNameDef] армянский протекторат в [TUR.GetAdjective] [354.GetName] после капитуляции [TUR.GetNameDef]. Вопрос о том, следует ли освобождать армянское государство внутри [TUR.GetAdjective] границ, был спорным ввиду тревожных недавних событий, но [ENG.GetAdjective] делегаты утверждают, что создание армянского государства на [SOV.GetAdjective] границе является не только моральным поступком, но и очень стратегически обоснованной позицией. \n\nЕсли [ENG.GetAdjective] получит свои уступки в [TUR.GetNameDef], то они будут связаны договором прийти на помощь [GRE.GetNameDef], как только начнется война с [TUR.GetNameDef]. Если предложение не будет принято, то независимо от результата Гераклейской конвенции [ENG.GetNameDef] не будет иметь никаких обязательств перед [GRE.GetNameDef], когда начнется их война."
  bftb_greece.18.a:0 "Мы голосуем «за»!"
  bftb_greece.18.b:0 "Мы голосуем «против»!"
  GRE_british_armenia_option_tt:1 "Если предложение будет принято и Гераклейская конвенция в конечном итоге увенчается успехом, то после капитуляции §Y[TUR.GetNameDefCap]§! §Y[ENG.GetNameDefCap]§! создаст марионеточное §Yармянское§! государство в §Y[354.GetName]§!."
  bftb_greece.19.t:0 "Гераклейская конвенция - [ENG.GetAdjective] получают свой протекторат!"

  bftb_greece.19.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ENG.GetNameDef] было предоставлено армянское протекторат, вырезанное из оболочки побежденного [TUR.GetName]. [ENG.GetAdjective] чиновники похвалили присутствующих делегатов за их мудрую государственную политику и уже передали инструкции центральному [ENG.GetAdjective] правительству о начале планирования создания администрации в регионе."
  bftb_greece.19.a:0 "За!"
  bftb_greece.20.t:0 "Ираклионская конвенция - [ENG.GetAdjective] лишены своего марионеточного государства!"
  bftb_greece.20.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ENG.GetNameDef] было отказано в праве создания любого армянского марионеточного государства на севере [TUR.GetNameDef]. [ENG.GetAdjective] чиновники осудили это решение и назвали всю конвенцию хаотичной, но решили, что они предпочли бы все же иметь возможность влиять на дальнейшие события, даже если им ничего не гарантировано."
  bftb_greece.20.a:0 "Против!"
  bftb_greece.21.t:0 "Ираклионская конвенция - [ITA.GetAdjective] колонии в [342.GetName] и [345.GetName]"
  bftb_greece.21.desc:0 "Тема этого раунда голосования - должны ли [ITA.GetNameDef] быть предоставлены колониальные территории на юге [TUR.GetNameDef] после того, как [TUR.GetNameDef] будет завоевана. У каждого участника есть некоторые сомнения по поводу передачи территории в Средиземном море [ITA.GetAdjective]s, но [ITA.GetAdjective] делегаты повторяют слова [ITA.GetLeader], когда они решительно заявляют, что предоставление этой территории только исправит некоторые из ошибок "vittoria mutilata". \n\nПеред формальным началом Ираклионской конвенции другие присутствующие державы решили, что участие [ITA.GetAdjective] в вторжении в [TUR.GetNameDef] было бы нежелательным. Вместо того, чтобы участвовать в войне напрямую, если [ITA.GetNameDef] получит свою концессию, то они будут связаны пактом о ненападении с [GRE.GetNameDef] и пактом о невмешательстве в отношении гипотетической войны с [TUR.GetNameDef]. Если резолюция не будет принята, то независимо от результата Ираклионской конвенции [ITA.GetNameDef] не будет иметь никаких обязательств перед [GRE.GetNameDef], когда их война начнется, и может даже попытаться вмешаться."
  bftb_greece.21.a:0 "Мы голосуем за!"
  bftb_greece.21.b:0 "Мы голосуем против!"
  bftb_greece.22.t:0 "Ираклионская конвенция - [ITA.GetAdjective] получают свои территории!"
  bftb_greece.22.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ITA.GetNameDef] были предоставлены колонии, разделенные на части из туши побежденного [TUR.GetName]. [ITA.GetAdjective] чиновники аплодировали присутствующим делегатам за их взвешенное решение по этому вопросу, и многие члены [ITA.GetAdjective] делегации уже спешат домой, чтобы сообщить [ITA.GetLeader] эту новость."
  bftb_greece.22.a:0 "За!"

  bftb_greece.23.t:0 "Гераклейская Конвенция - [ITA.GetAdjective] отказано в территориях!"
  bftb_greece.23.desc:0 "Большинство делегатов, присутствующих на заседании, проголосовало за то, чтобы [ITA.GetNameDef] было отказано в праве создавать какие-либо колонии на юге [TUR.GetNameDef], и осудило сам этот шаг как еще более бессмысленную [ITA.GetAdjective] воинственность. [ITA.GetAdjective] чиновники атаковали это решение и использовали всю ситуацию, чтобы показать, как это является еще одним доказательством того, что [ITA.GetAdjective] народ прав, веря в 'vittoria mutilata'. Независимо от их личных взглядов на этот вопрос, [ITA.GetAdjective] делегаты получили указание оставаться в рамках работы конвенции - несомненно, в надежде, что они все еще могут повлиять на вердикт по последнему и самому важному пункту повестки дня."
  bftb_greece.23.a:0 "Против!"
  bftb_greece.24.t:0 "Гераклейская Конвенция - Мегали Идея"
  bftb_greece.24.desc:0 "Тема этого раунда голосования - разрешить ли Великим державам присутствовать Мегали Идею, давнюю реваншистскую идею Великой Греции. Национальный лидер [GRE.GetAdjective] [GRE.GetLeader] совершил неожиданный визит в палаты, где проходила Гераклейская Конвенция, и произнес страстную речь о том, как Мегали Идея представляет собой нечто большее, чем циничный захват земель, и как это станет реализацией общей священной мечты, которую веками поддерживали [GRE.GetAdjective] по всему миру. \n\nВ этом нет сомнений: если Мегали Идея будет отклонена здесь и сейчас, то все уступки и обещания, данные на Гераклейской Конвенции, будут аннулированы. Самое будущее демократии и целостности [GRE.GetNameDef] может зависеть от решения присутствующих здесь сегодня."
  bftb_greece.24.a:0 "Мы голосуем за!"
  bftb_greece.24.b:0 "Мы голосуем против!"
  GRE_megali_idea_option_tt:1 "Если предложение будет принято, то после капитуляции §Y[TUR.GetNameDefCap]§! §Y[GRE.GetNameDefCap]§! аннексирует §YIstanbul§! и другие §Y[TUR.GetAdjective]§! государства, граничащие с §YAegean Sea§!. §RЕсли Греции будет отказано в Мегали Идее, то все принятые до сих пор решения будут аннулированы!§!"
  bftb_greece.25.t:0 "Гераклейская Конвенция - Мегали Идея возрождается!"
  bftb_greece.25.desc:0 "Большинство делегатов, присутствующих на заседании, проголосовало за то, чтобы [GRE.GetNameDef] разрешили реализовать Мегали Идею, если она успешно победит [TUR.GetNameDef] в войне. Наши чиновники в восторге, и [ROOT.GetLeader] уже выступил с обращением к нации, чтобы сообщить, что Гераклейская Конвенция прошла успешно. Конечно, никто за пределами нашего закрытого круга участников не знает, о чем на самом деле шла речь на Гераклейской Конвенции, но многие из нашего народа сделали вывод, что тема разговора в основном была посвящена реализации Мегали Идеи. \n\nМы вышли из Гераклейской Конвенции со всем, что могли себе пожелать, но дальше идет самое трудное..."

  bftb_greece.25.a:0 "Благословенны воины!"
  bftb_greece.26.t:0 "Ираклионская Конвенция - Мегали Идея Отвергнута!"
  bftb_greece.26.desc:0 "Большинство присутствующих делегатов проголосовало против предоставления [GRE.GetNameDef] права на создание Великой Греции в рамках их стремлений к Мегали Идее. Наши чиновники подтвердили решение присутствующим делегатам с примесью шока и ужаса, и отправили всех домой с сообщением о том, что Ираклионская Конвенция провалилась. [ROOT.GetLeader] пришлось нервно обращаться к толпе в столице и говорить им, что вся конвенция была провалом, и, само собой разумеется, реакция толпы была недоброй. Мы уже видим протесты по всей стране, и ситуация угрожает выйти из-под контроля."
  bftb_greece.26.a:0 "Какая трата времени..."
  ROOT_voted_aye_megali_effect:0 "Голоса за!"
  ROOT_voted_nay_megali_effect:0 "Голоса против!"
  bftb_greece.29.t:0 "Коммунисты захватывают власть в Греции"
  bftb_greece.29.desc:0 "Последние разведывательные данные подтверждают худшие опасения: коммунисты захватили контроль над Афинами и установили свою власть над [FROM.GetAdjective] народом. Мы должны подготовиться к возможности конфликта, если [SOV.GetNameDef] не посчитают нас достаточно послушными своим собственным махинациям, то они, несомненно, попытаются втянуть [FROM.GetNameDef] в какой-нибудь заговор, чтобы ослабить или даже уничтожить нас. Кабинет непоколебим: мы должны закрыть проливы для [FROM.GetNameDef] и [SOV.GetNameDef], чтобы избежать клещевого захвата нашей уязвимой страны. Это даст нам немного времени, но мы должны подготовиться к возможности конфликта."
  bftb_greece.29.a:0 "Конфликт, несомненно, назревает..."
  bftb_greece.31.t:0 "Ставка на Босфор"
  bftb_greece.31.desc:0 "Чиновники Политбюро из [SOV.GetNameDef] решили наконец посвятить нас в свои тайные планы на будущее [TUR.GetNameDef], и наша роль в них абсолютно ключевая. План довольно прост: мы выдвигаем [TUR.GetNameDef] неприемлемый ультиматум от имени [SOV.GetNameDef] и международной революции, и используем неизбежный [TUR.GetAdjective] отказ как casus belli, чтобы разжечь конфликт в Эгейском море. \n\nНаше высшее командование рекомендует разместить наши лучшие подразделения вдоль фракийской границы с [TUR.GetNameDef] и подготовить солдат к нападению на [TUR.GetAdjective] территорию у берегов наших островов в Эгейском море. В нашей администрации и вооруженных силах есть много тех, кто сомневается, что мы сможем победить [TUR.GetAdjective] вооруженные силы в прямом столкновении, но [SOV.GetNameDef] пообещали оказать нам поддержку, начав вторжение на севере, если мы провалим наше первоначальное наступление на Константинополь."
  bftb_greece.31.a:0 "Удача благоволит смелым."
  GRE_border_war_possible_tt:0 "Если ситуация обострится, мы можем быть вынуждены столкнуться с §Rпограничными конфликтами§! вдоль наших границ с §Y[TUR.GetNameDef]§!."
  bftb_greece.32.t:0 "Греки выдвигают свой ультиматум"

  bftb_greece.32.desc:1 "Наши чиновники отреагировали с негодованием, прочитав совершенно нереалистичные и необоснованные требования бесхребетных марксистов из [FROM.GetNameDef]. Заявляя о том, что действуют от имени [SOV.GetNameDef], [FROM.GetNameDef] потребовали от нас восстановления всех пунктов Лозаннского договора и разрешения присутствия [SOV.GetAdjective] солдат на всей территории нашей страны, чтобы они могли гарантировать наше соблюдение договора в качестве «надежной и объективной третьей стороны». \n\nЧего [FROM.GetAdjective] могли бы надеяться добиться таким нелепым требованием, кроме конфликта на наших границах? Мы всячески пытались сохранить мир на внутреннем фронте, но ясно, что мир никогда не был вариантом. Если [FROM.GetAdjective] действительно действуют от имени [SOV.GetNameDef], то, возможно, наша единственная надежда на спасение — капитуляция в надежде, что мы сможем остановить [SOV.GetAdjective] солдат, захватывающих контроль над нашей страной силой. Хотя мы никогда не отказывались от праведной борьбы — действительно ли мы заслуживаем правления, если не готовы бороться за свои ценности?"
  bftb_greece.32.a:0 "Мы должны подчиниться."
  bftb_greece.32.b:0 "[FROM.GetAdjective] ступили на темный путь: мы должны исправить это."
  bftb_greece.33.t:0 "[FROM.GetNameDef] подчиняется!"
  bftb_greece.33.desc:0 "В шокирующем для наблюдателей из [GRE.GetAdjective] и [SOV.GetAdjective] повороте событий [FROM.GetNameDef] согласился на все выдвинутые им требования. Разрешения, касающиеся доступа к турецким проливам, вернулись к своему статусу до 1936 года, и [SOV.GetAdjective] войска были приглашены на [FROM.GetAdjective] территорию, чтобы гарантировать, что [FROM.GetNameDef] соблюдает условия предъявленных им ранее требований. \n\n[SOV.GetLeader] лично поздравил [GRE.GetLeader] с мужеством, проявленным его страной, чтобы обеспечить успех этой операции, и уже начал собирать войска для размещения по всей [TUR.GetNameDef]. С нейтрализацией [TUR.GetNameDef] как угрозы [GRE.GetNameDef] был поставлен в известность о необходимости уделять больше внимания другим возможным театрам военных действий в регионе."
  bftb_greece.33.a:0 "Сюрприз, конечно, но приятный!"
  bftb_greece.34.t:0 "[SOV.GetNameDefCap] создают новое марионеточное правительство на севере!"
  bftb_greece.34.desc:0 "Проклятье нам за дураков! [SOV.GetNameDef] воспользовались своей свободой передвижения по нашей территории, чтобы создать соперничающее коммунистическое правительство рядом со своей собственной страной, и явно намерены завоевать нашу всю страну во имя этого правительства! Мы должны были знать с самого начала, что все так и будет; некоторые члены нашего собственного правительства даже бежали, чтобы присоединиться к соперничающему правительству на севере, утверждая, что наше положение безнадежно. Возможно, просто сдаться спасло бы нашу страну от меньшего числа жертв в ближайшие дни..."
  bftb_greece.34.a:0 "Мудрее служить и жить."
  bftb_greece.34.b:0 "Мы не сдались в 1919 году, и мы не сдадимся сейчас!"

  bftb_greece.35.t:0 "Турки отвергают наш ультиматум!"
  bftb_greece.35.desc:0 "Как и ожидалось, [FROM.GetNameDef] отклонил ультиматум, представленный им. С нашими солдатами, размещенными на позициях, мы теперь спровоцируем постепенно эскалирующийся конфликт с целью разжигания тотальной войны между нашими нациями. Победим мы или проиграем, до тех пор, пока [SOV.GetNameDef] стоит бок о бок с нами, мы не можем потерпеть неудачу."
  bftb_greece.35.a:0 "Теперь все становится интереснее!"
  bftb_greece.36.t:0 "Битва за Босфор начинается!"
  bftb_greece.36.desc:0 "Вопреки ожиданиям нашего высшего командования, мы одержали победу над [FROM.GetAdjective] силами на наших границах. Подстегиваемые нашим огромным успехом, наши вооруженные силы уже начали свое наступление вглубь [FROM.GetAdjective] территории. Наше высшее командование, располагающее последними данными, считает, что [FROM.GetNameDef] падет в течение нескольких дней."
  bftb_greece.36.a:0 "Нам просто нужно было выбить дверь, чтобы увидеть гниение!"
  bftb_greece.37.t:0 "[FROM.GetAdjective] силы разбиты!"
  bftb_greece.37.desc:0 "[FROM.GetAdjective] агитаторы были отброшены после их бессмысленного нападения на наши границы, но, судя по отчетам наших наблюдателей, эта история еще не закончена. [FROM.GetAdjective] силы собираются на Эгейских островах и перемещают оружие поразительно близко к [339.GetName]. Есть и более плохие новости: мы слышим о резком усилении движения на [SOV.GetAdjective] границе, а перехваченные сообщения предполагают, что нападение на север может произойти в любой момент. Мы должны быть готовы; мы должны выстоять."
  bftb_greece.37.a:0 "Выстроим коммунистов в ряд, и мы их скосим."
  TUR_border_conflicts_in_trabzon_tt:0 "Было бы разумно разместить войска вдоль границы с §Y[354.GetName]§! и §Y[187.GetName]§! прежде чем ситуация неизбежно станет еще хуже."
  bftb_greece.38.t:0 "Турки одерживают победу над нашими силами!"
  bftb_greece.38.desc:0 "К сожалению, похоже, наши силы не смогли прорвать [FROM.GetAdjective] оборону в [341.GetName]. Высшее командование, конечно же, разочаровано результатами, но не удивлено. Если [FROM.GetAdjective] силы не будут мстить, то нам придется снова эскалировать. На этот раз [SOV.GetNameDef] атакует [FROM.GetAdjective] позиции на севере, в то время как мы совершим два прибрежных десанта из [187.GetName] на [339.GetName] и [340.GetName]. Как мы вообще можем потерпеть неудачу в этот раз?"
  bftb_greece.38.a:0 "Для [FROM.GetNameDef] эта игра была с самого начала сфальсифицирована..."
  bftb_greece.39.t:0 "Битва за Босфор начинается!"

  bftb_greece.39.desc:0 "Наши войска, неподготовленные к такому дерзкому нападению со стороны [FROM.GetAdjective] вооруженных сил, были отброшены у [341.GetName] в ужасной потере для нашей страны. [FROM.GetAdjective] войска не прекратили продвижение, и объявление войны должно быть неизбежным. Хотя наша потеря была разочаровывающей, она не была разрушительной - эта война только началась, и наш народ твердо стоит с нами в этой войне против нашего старого соперника."
  bftb_greece.39.a:0 "У [FROM.GetAdjective]s не осталось нам другого выбора!"
  bftb_greece.40.t:0 "Битва за Босфор начинается!"
  bftb_greece.40.desc:0 "Как и ожидало наше высшее командование, мы одержали победу над [FROM.GetAdjective] войсками на наших границах и сломили оборону Измира. Подстегиваемые нашим огромным успехом, наши вооруженные силы уже начали свое наступление на территорию [FROM.GetAdjective]. Наше высшее командование, воодушевленное нашей победой, считает, что [FROM.GetNameDef] падет в течение нескольких недель."
  bftb_greece.40.a:0 "Через Смирну мы захватим всю страну!"
  bftb_greece.41.t:0 "Битва за Босфор начинается!"
  bftb_greece.41.desc:0 "[FROM.GetAdjective] нападение на [339.GetName] было для них провалом, но оно остается ужасной потерей для нас. [ROOT.GetLeader] не может не проводить личные сравнения с 1919 годом, когда [FROM.GetAdjective] войска в последний раз начали безжалостное наступление в [339.GetName]. \n\nХотя чиновники в столице оплакивают погибших в кратковременной осаде [339.GetName], вся нация кипит от возмущения по поводу этих дерзких нападений на наш суверенитет со стороны старого врага. Внезапное нападение на [341.GetName] было презренным, но потери, понесенные в [339.GetName], непростительны. Если [FROM.GetAdjective] правительство слишком трусливо, чтобы объявить войну открыто, то мы сделаем это за них."
  bftb_greece.41.a:0 "Мы отомстим за павших!"
  bftb_greece.42.t:0 "Битва за Босфор начинается!"
  bftb_greece.42.desc:0 "Наши планы пошли прахом; высшее командование ожидал, что мы можем быть отброшены [FROM.GetAdjective] войсками один раз, но быть отброшенным в обоих внезапных наступлениях действительно предвещает нам плохое. [ROOT.GetLeader] отменил любые будущие атаки, которые были подготовлены, но любые попытки исправить ситуацию, по-видимому, не принесут результатов, поскольку мы только что получили объявление войны от [FROM.GetAdjective] делегата. Похоже, ситуация изменилась, и не обязательно в нашу пользу."
  bftb_greece.42.a:0 "Мы победим! За революцию!"
  bftb_greece.43.t:0 "Битва за Босфор начинается!"

  bftb_greece.43.desc:0 "Наступление [FROM.GetAdjective] на [339.GetName] увенчалось для них успехом, а для нас стало страшной потерей. [ROOT.GetLeader] не может не провести параллель с 1919 годом, когда войска [FROM.GetAdjective] в последний раз захватили контроль над [339.GetName]. \n\nНесмотря на мрачную атмосферу в столице, вся страна кипит от негодования из-за этих дерзких нападений на наш суверенитет со стороны старого врага. Внезапная атака на [341.GetName] была презренной, но потери, понесенные в [339.GetName], непростительны. Если [FROM.GetAdjective] действительно хотят еще одной войны, то мы обрушим на них такую, которую они никогда не забудут."
  bftb_greece.43.a:0 "За [TUR.GetNameDef]!"
  bftb_greece.44.t:0 "Мы победили в [FROM.GetNameDef]!"
  bftb_greece.44.desc:0 "Как и ожидалось, Красная армия быстро расправилась с жалкими гарнизонами [FROM.GetAdjective] в [354.GetName] и проложила путь для обнадеживающего и обычного вторжения. Пока мы атакуем их с севера, [GRE.GetAdjective] будут атаковать их с запада. У них нет шансов."
  bftb_greece.44.a:0 "Участие [FROM.GetAdjective] в Коминтерне обязательно."
  bftb_greece.45.t:0 "[FROM.GetAdjective] отброшены на границе!"
  bftb_greece.45.desc:0 "Официальные лица были потрясены, узнав, что наши войска, дислоцированные в [354.GetName], успешно отбили наступление [FROM.GetAdjective] и удержали свои позиции, несмотря на подавляющее превосходство противника. Не только мы получили срочную депешу от посла [FROM.GetAdjective], восторженно извиняющегося за весь инцидент, но они также предоставили разведданные, компрометирующие режим [GRE.GetAdjective] как вдохновителей всей операции. Нам заверили, что мы не должны ожидать никаких репрессий со стороны [FROM.GetAdjective] в случае, если наша борьба с [GRE.GetNameDef] перерастет в войну."
  bftb_greece.45.a:0 "Мы спасли себя от забвения."
  bftb_greece.46.t:0 "Силы [FROM.GetAdjective] отбили наше наступление!"
  bftb_greece.46.desc:0 "Поступила информация о том, что наступление на [354.GetName] полностью провалилось, что нанесло сокрушительный удар по нашему международному авторитету и самолюбию нашего верховного командования. Мы выразили свои искренние извинения правительству [FROM.GetAdjective] и отказались от любой поддержки режима [GRE.GetAdjective], который по-прежнему враждует с [FROM.GetAdjective] на западе."
  bftb_greece.46.a:0 "За это кто-то будет расстрелян!"
  bftb_greece.47.t:0 "[FROM.GetNameDefCap] прорывает наши позиции в [354.GetName]!"

  bftb_greece.47.desc:1 "Немногие советники удивлены тем, что [FROM.GetAdjective] войскам удалось отразить наше наступление на севере, но это не делает разочарование менее ощутимым. [FROM.GetAdjective] войска не прекратили свои вторжения на границе [354.GetName]: мы получаем сообщения о спорадических и явно массовых передвижениях войск вблизи наших границ и даже сообщения о [FROM.GetAdjective] солдатах, переходящих через линию разграничения в [800.GetName]. Это может означать только одно - вторжение. Мы должны подготовиться к худшему."
  bftb_greece.47.a:0 "Может ли это стать гибелью для Отечества?"
  bftb_greece.48.t:0 "[FROM.GetAdjective] провоцируют коммунистический мятеж на юге!"
  bftb_greece.48.desc:0 "Позорный марксистский режим [FROM.GetNameDef] вооружил террориста Йосипа Броз Тито и воодушевил его на начало восстания на юге! Опасность, возможно, была бы незначительной, если бы не тот факт, что [FROM.GetAdjective] активно сотрудничают с самопровозглашенным режимом на юге в надежде свергнуть наше правительство. Похоже, у нас не будет иного выбора, кроме как подавить мятежников, а затем двинуть наши войска на [FROM.GetAdjective] столицу, чтобы привести их в чувство."
  bftb_greece.48.a:0 "Проклятый Тито и эти проклятые [FROM.GetAdjective]!"
  GRE_tito_backed_guerilla_war_tt:0 "§YКоммунисты§! при полной поддержке §YGриков§! начали небольшую гражданскую войну на юге нашей страны."
  bftb_greece.50.t:0 "Король распускает греческий парламент!"
  bftb_greece.50.desc:0 "Его Величество король Георг II потряс всю нацию своим заявлением о том, что он лично возьмет на себя управление страной, чтобы предотвратить развал страны из-за споров политических противников. С этой целью первый указ короля заключался в неопределенной отсрочке греческого парламента - института, который король осудил как 'гнездо самолюбивых гадов'. \n\n Указ короля был встречен с ликованием некоторыми, но гораздо чаще осуждался другими влиятельными слоями общества. Республиканские Венезелисты и отвратительные коммунисты объединились после десятилетий вражды из-за своего общего желания увидеть, как 'Король Эллинов' будет низвергнут с трона и навсегда избавиться от него. Разведывательные данные на данный момент свидетельствуют о том, что гражданская война может вполне разразиться в течение следующих недель или месяцев."
  bftb_greece.50.a:0 "Право короля на правление священно!"
  GRE_absolute_monarch_hostile_factions_tt:1 "§RCивильная война§! вероятно, неизбежна..."
  bftb_greece.51.t:0 "Монархисты в Греции просят нашей помощи!"
  bftb_greece.51.desc:0 "Про-[ROOT.GetAdjective] правительство в Афинах обратилось к нам за материальной помощью после того, как общенациональный политический раскол привел к катастрофической гражданской войне. Конечно, они имеют полное право просить нас об этом, но вопрос о том, стоят ли они даже тех материалов, которые они у нас просят, - это вопрос, который может решить только мы сами."

  bftb_greece.51.a:0 "Им, без сомнения, нужны винтовки."
  bftb_greece.51.b:0 "Мы можем выделить немного материалов для помощи."
  bftb_greece.51.c:0 "Лучше не вмешиваться в греческие дела."
  bftb_greece.52.t:0 "[FROM.GetNameDefCap] Отправляет нам оружие и добровольцев!"
  bftb_greece.52.desc:0 "Мы только что закончили выгрузку оружия и добровольцев из [FROM.GetNameDef] на наших доках. Поддержка очень кстати, и намного больше, чем мы могли ожидать. Эта помощь пригодится нам в течение следующих месяцев."
  bftb_greece.52.a:0 "Истинные союзники Короля!"
  bftb_greece.53.t:0 "[FROM.GetNameDefCap] Отправляет нам помощь!"
  bftb_greece.53.desc:0 "Мы только что закончили выгрузку припасов, отправленных из [FROM.GetNameDef] на наших доках. Поддержка очень кстати, и является приятным проявлением дружбы в эти трудные времена. Эта помощь пригодится нам в течение следующих месяцев."
  bftb_greece.53.a:0 "Истинные союзники Короля!"
  bftb_greece.54.t:0 "[FROM.GetNameDefCap] Отказался помочь нам"
  bftb_greece.54.desc:0 "Мы получили информацию от [FROM.GetAdjective] дипломата о том, что наш призыв о помощи не был услышан, и что мы не должны ждать никакой дальнейшей помощи от [FROM.GetNameDef]. Ситуация печальная, но мы будем упорствовать даже без помощи иностранных держав."
  bftb_greece.54.a:0 "Разочаровывает."
  bftb_greece.55.t:0 "[GRE.GetNameDefCap] Предлагает Энозис"
  bftb_greece.55.desc:0 "Представитель от [FROM.GetNameDef] предложил нам объединить наши две нации в одну. Ссылаясь на общую историю и культурное наследие, [FROM.GetAdjective] представитель выразил мнение, что это является волей [FROM.GetAdjective] правительства, чтобы мы способствовали реализации давно возвышенной концепции 'Энозиса': слияния наших государств в одно целое."
  bftb_greece.55.a:0 "Прекрасная идея!"
  bftb_greece.55.b:0 "Кипр проложит свой собственный путь."
  end_of_cyprus_tt:0 "§RЭто приведет к поражению!§!"
  bftb_greece.56.t:0 "[CYP.GetNameDefCap] Соглашается на Энозис"
  bftb_greece.56.desc:0 "Мы получили информацию от [FROM.GetAdjective], что они готовы содействовать долгожданному объединению наших двух народов в одно государство под нашим контролем. По всей стране начались торжества, и [ROOT.GetLeader] лично отправился в Никосию и выступил с речью перед народом в честь этого исторического дня."
  bftb_greece.56.a:0 "Родственники наконец-то объединились!"
  bftb_greece.57.t:0 "[CYP.GetNameDefCap] Отклоняет Энозис!"
  bftb_greece.57.desc:0 "[FROM.GetAdjective] чиновники сообщили нам, что не имеют намерения отказываться от [FROM.GetAdjective] суверенитета после такой продолжительной борьбы, чтобы достичь его в первую очередь. Было объявлено, что 'Энозис' - это не концепция, которую [FROM.GetAdjective] правительство готово обсуждать в настоящее время."
  bftb_greece.57.a:0 "Это не было просьбой."
  bftb_greece.57.b:0 "Хорошо, если таково их желание..."
  bftb_greece.58.t:0 "[FROM.GetNameDefCap] Запрашивает Энозис с Кипром"

  bftb_greece.58.desc:0 "К нам обратился делегат [FROM.GetAdjective] для обсуждения будущего нашей кипрской колонии. [FROM.GetAdjective] заявил, что попытки построить кипрскую нацию обречены на провал, поскольку киприоты по сути являются [FROM.GetAdjective] народом.\n\n[FROM.GetAdjective] предоставил письмо от премьер-министра [FROM.GetAdjective] [FROM.GetLeader], где была подробно описана история концепции «Эносис», а затем был сделан окончательный и решительный призыв к объединению Кипра и [FROM.GetNameDef]. Делегат [FROM.GetAdjective] попытался заверить нашего представителя, что это не просто грубый ирредентизм со стороны [FROM.GetAdjective]; Кипр и [FROM.GetNameDef] имеют общее культурное наследие, общую историю, общий язык и, с точки зрения [FROM.GetAdjective], общую судьбу.\n\nНаши военные чиновники подчеркнули важность Кипра как важной стратегической военной базы в Средиземноморье, но наши советники по внешней политике подчеркивают, что усиленный союзник [FROM.GetAdjective] может обеспечить намного больше, чем Кипр сам по себе, как военно-воздушная и военно-морская база. В конечном счете, выбор за [ROOT.GetAdjective] кабинетом, но мы должны убедиться, что не заставим делегата [FROM.GetAdjective] слишком долго ждать нашего ответа."
  bftb_greece.58.a:0 "Мы принимаем ваши предложения в обмен на формальный союз."
  bftb_greece.58.b:0 "Пусть заберут; Кипр нам не важен."
  bftb_greece.58.c:0 "[FROM.GetAdjective] правительство должно разделить власть с 'кипрскими' властями."
  bftb_greece.58.d:0 "Жадные греки ничего не получат!"
  bftb_greece.59.t:0 "[FROM.GetNameDefCap] Соглашается содействовать Эносису!"
  bftb_greece.59.desc:0 "Настроение в столице лучше всего описать как 'ликующее' после того, как [ROOT.GetLeader] объявил народу, что после всех этих лет [ROOT.GetAdjective] мечта о Эносисе с Кипром, наконец, станет реальностью, и все благодаря нашим [FROM.GetAdjective] друзьям. Наши администраторы не теряют времени и отправляются на Кипр, чтобы убедиться, что переход власти пройдет максимально гладко.\n\nЭто поистине великий и исторический день для [ROOT.GetNameDef]. Кипр долгое время был частью [ROOT.GetAdjective] коллективного сознания, и теперь он, наконец, вернулся в лоно цивилизации, из которой он произошел."
  bftb_greece.59.a:0 "Наконец-то вместе!"
  bftb_greece.59.b:0 "Мы не можем пожертвовать нашей автономией ради Эносиса."
  bftb_greece.60.t:0 "[FROM.GetNameDefCap] Принимает частичный Эносис"

  bftb_greece.60.desc:0 "The [FROM.GetAdjective] have offered a curious compromise to our original request that they facilitate Enosis: they are willing to fulfill our requests on the condition we cooperate with a Cypriot government given the same standing as a [FROM.GetAdjective] dominion. It is not a wholly unwelcome turn of events, just... unexpected. \n\nOn their part, the Cypriot government have agreed that if [ROOT.GetNameDef] shows enough commitment in Cyprus by building up their fledgling nation that they would not be adverse to a complete Enosis between us. Until that day comes though, we will have to be satisfied with a new Cypriot ally that is bound to us by the hip."
  bftb_greece.60.a:0 "Welcome, brothers!"
  bftb_greece.61.t:0 "[FROM.GetNameDefCap] Rejects Enosis!"
  bftb_greece.61.desc:0 "Our trust and faith in our long-cherished ally appears to have been misplaced; [FROM.GetNameDef] has refused to even entertain the very idea of transferring the [ROOT.GetAdjective] island of Cyprus over to our control. They cite the strategic importance of the island and concerns about [ROOT>GetAdjective] revanchism as reasons why, in their eyes, we are not deserving of the island. \n\nIt cannot be said we are wholly surprised, but that does not make our collective disappointment any less bitter. How many years have we waited for Cyprus to be returned to the fatherland? How many more years will we be forced to wait because of this setback? It has to be said that our enthusiasm regarding our relationship with [FROM.GetNameDef] has been significantly tempered by this turn of events."
  bftb_greece.61.a:0 "We will remember this..."
  bftb_greece.62.t:0 "[FROM.GetNameDefCap] Suggests Joint Applications for Joining the Axis!"
  bftb_greece.62.desc:0 "When news arrived that the old [FROM.GetAdjective] regime had been supplanted by a fascist one, a great feeling of dread loomed over advisors in the capital. War, we felt, had become something of an inevitability: and made all the more acrid by our previous attempts to maintain peace in the Aegean region. Apparently, fate has proven us wrong. \n\nWe have been approached with a unique offer: the fascist government of [FROM.GetNameDef] believes that it is inevitable that war will touch the both of our countries. [FROM.GetLeader], despite his ideological leanings, shares our sentiment that it would not be wise to throw out decades of diplomatic efforts on both of our parts all for the sake of what would surely be a great and terrible war. To that end, the government of [FROM.GetNameDef] has advised that together we bind ourselves to the emergent fascist powers of Europe. [FROM.GetLeader] believes fascist supremacy on the continent is inevitable, and that together we both have the power to tilt the scales enough that the war can come to a quicker and more decisive end. [FROM.GetLeader] calls it 'mercy'; [ROOT.GetLeader] is not so sure."
  bftb_greece.62.a:0 "In the name of peace, let us wage war."
  bftb_greece.60.desc:0 "[FROM.GetAdjective] предложили любопытный компромисс нашему первоначальному требованию о содействии Энозису: они готовы выполнить наши требования при условии, что мы будем сотрудничать с кипрским правительством, имеющим такой же статус, как и [FROM.GetAdjective] доминион. Это не совсем нежелательное развитие событий, просто... неожиданно.\n\nСо своей стороны, кипрское правительство согласилось, что если [ROOT.GetNameDef] проявит достаточную приверженность Кипру, развивая свою молодую нацию, то они не будут возражать против полного Энозиса между нами. Однако до тех пор, пока этот день не наступит, мы должны будем довольствоваться новым кипрским союзником, который связан с нами по рукам и ногам."
  bftb_greece.60.a:0 "Добро пожаловать, братья!"
  bftb_greece.61.t:0 "[FROM.GetNameDefCap] отвергает Энозис!"
  bftb_greece.61.desc:0 "Похоже, наше доверие и вера в нашего давнего союзника оказались неуместны; [FROM.GetNameDef] отказался даже рассматривать саму идею передачи [ROOT.GetAdjective] острова Кипр под наш контроль. Они ссылаются на стратегическое значение острова и опасения по поводу [ROOT>GetAdjective] реваншизма как на причины, по которым, по их мнению, мы не заслуживаем этого острова.\n\nНельзя сказать, что мы были совсем удивлены, но это не делает наше коллективное разочарование менее горьким. Сколько лет мы ждали, чтобы Кипр вернулся на родину? Сколько еще лет нам придется ждать из-за этого неудачи? Нужно сказать, что наш энтузиазм по поводу наших отношений с [FROM.GetNameDef] значительно снизился из-за этого поворота событий."
  bftb_greece.61.a:0 "Мы запомним это..."
  bftb_greece.62.t:0 "[FROM.GetNameDefCap] предлагает совместные заявки на вступление в Ось!"
  bftb_greece.62.desc:0 "Когда пришли новости о том, что старый [FROM.GetAdjective] режим был свергнут фашистским, чувство страха охватило советников в столице. Нам казалось, что война стала чем-то неизбежным: и тем более горьким из-за наших предыдущих попыток сохранить мир в Эгейском регионе. Очевидно, судьба доказала нам, что мы ошибались.\n\nК нам поступило уникальное предложение: фашистское правительство [FROM.GetNameDef] считает, что война неизбежно коснется обеих наших стран. [FROM.GetLeader], несмотря на свои идеологические взгляды, разделяет наше мнение о том, что было бы неразумно отбросить десятилетия дипломатических усилий с обеих сторон ради того, что, безусловно, будет великой и ужасной войной. С этой целью правительство [FROM.GetNameDef] посоветовало нам объединиться с формирующимися фашистскими державами Европы. [FROM.GetLeader] считает, что фашистское господство на континенте неизбежно, и что вместе у нас есть сила, чтобы перевесить чашу весов настолько, чтобы война могла завершиться быстрее и более решительно. [FROM.GetLeader] называет это «милосердием»; [ROOT.GetLeader] не так уверен."
  bftb_greece.62.a:0 "Во имя мира ведем войну."

  bftb_greece.62.b:0 "The [FROM.GetAdjective]s have truly gone mad..."
  bftb_greece.63.t:0 "[FROM.GetNameDefCap] Agrees to the Hellenoturkism Friendship Pact!"
  bftb_greece.63.desc:0 "Success! The [FROM.GetAdjective] ambassador has conveyed the consent of their government to our proposed friendship pact. Working in tandem with the fascist powers while bound together there is no way we can possibly lose."
  bftb_greece.63.a:0 "Two faction application forms, please!"
  bftb_greece.63.b:0 "Or perhaps... we do not need the Turks?"
  GRE_no_turkey_needed:0 "Through forgery and deceit we shall torpedo §YTurkey's§! relations with the §Yfascist powers§!."
  bftb_greece.64.t:0 "[FROM.GetNameDefCap] Firmly Rejects Hellenoturkism Friendship Pact!"
  bftb_greece.64.desc:0 "It would appear that the [FROM.GetAdjective] government suffers from a chronic lack of foresight. They will not join the inevitable victors alongside us, for they are either cowards or they are fools. It is of no consequence, our path is set and whatever happens next in regards to [FROM.GetNameDef] will in part be their own fault."
  bftb_greece.64.a:0 "The strong will inherit the earth; the meek shall perish."
  bftb_greece.65.t:0 "[FROM.GetNameDefCap] and [TUR.GetNameDef] Suggest a Strategic Partnership"
  bftb_greece.65.desc:0 "Like pieces of a puzzle, everything seems to be coming into place. The regime change in Berlin was unexpected, and cast many doubts upon the future of our nation. That future has been made just a little more discernible by a proposal dispatched to us from Athens. \n\nIt would appear that [FROM.GetNameDef] and [TUR.GetNameDef] have a desire to form a lasting strategic alliance with our government. We have been hurting for allies, and the addition of these two into a Mediterranean Pact could certainly go a long way in securing our regional ambitions. Although, who is to say those two are not the subject of ambitions of ours of another kind."
  bftb_greece.65.a:0 "Together, we shall make history!"
  bftb_greece.65.b:0 "Our plans for that pair certainly make no room for alliances."
  bftb_greece.66.t:0 "[FROM.GetNameDefCap] and [TUR.GetNameDef] Apply for [GER.GetFactionName] Membership"
  bftb_greece.66.desc:0 "We have met with delegates from both [FROM.GetNameDef] and [TUR.GetNameDef] and were quite surprised to hear the two were lodging joint applications to the [ROOT.GetFactionName]. It is hardly an unwelcome surprise, but a surprise nonetheless. We must determine if having them as partners in our alliance would further our goals, or hinder them."
  bftb_greece.66.a:0 "They make welcome allies in these turbulent times."
  bftb_greece.66.b:0 "Nein, we have no need of them."
  bftb_greece.67.t:0 "[FROM.GetNameDefCap] Suggests a Strategic Partnership!"
  bftb_greece.62.b:0 "The [FROM.GetAdjective]s have truly gone mad..."
  bftb_greece.63.t:0 "[FROM.GetNameDefCap] соглашается на Пакт дружбы с эллено-турками!"
  bftb_greece.63.desc:0 "Успех! Посол [FROM.GetAdjective] передал согласие своего правительства на наш предлагаемый пакт дружбы. Работая в тандеме с фашистскими державами, будучи связанными вместе, мы ни за что не проиграем."
  bftb_greece.63.a:0 "Два заявления на вступление в фракцию, пожалуйста!"
  bftb_greece.63.b:0 "А может быть... нам не нужны турки?"
  GRE_no_turkey_needed:0 "С помощью подделки и обмана мы торпедируем отношения §YТурции§! с §Yфашистскими державами§!."
  bftb_greece.64.t:0 "[FROM.GetNameDefCap] решительно отвергает пакт дружбы с эллено-турками!"
  bftb_greece.64.desc:0 "Похоже, что правительство [FROM.GetAdjective] страдает от хронического отсутствия прозорливости. Они не присоединятся к неизбежным победителям вместе с нами, потому что они либо трусы, либо глупцы. Это не имеет значения, наш путь определен, и все, что произойдет дальше в отношении [FROM.GetNameDef], отчасти будет их собственной виной."
  bftb_greece.64.a:0 "Сильные унаследуют землю; смиренные погибнут."
  bftb_greece.65.t:0 "[FROM.GetNameDefCap] и [TUR.GetNameDef] предлагают стратегическое партнерство"
  bftb_greece.65.desc:0 "Как кусочки головоломки, все встает на свои места. Смена режима в Берлине была неожиданной и поставила под сомнение будущее нашей страны. Это будущее стало немного более ясным благодаря предложению, отправленному нам из Афин.\n\nПо-видимому, [FROM.GetNameDef] и [TUR.GetNameDef] хотят заключить с нашим правительством прочный стратегический союз. Нам не хватало союзников, и присоединение этих двух к Средиземноморскому пакту могло бы значительно продвинуть нас в реализации наших региональных амбиций. Хотя, кто может сказать, что эти двое не являются предметом наших амбиций другого рода."
  bftb_greece.65.a:0 "Вместе мы создадим историю!"
  bftb_greece.65.b:0 "Наши планы в отношении этой пары точно не оставляют места для союзов."
  bftb_greece.66.t:0 "[FROM.GetNameDefCap] и [TUR.GetNameDef] подают заявку на вступление в [GER.GetFactionName]"
  bftb_greece.66.desc:0 "Мы встретились с делегатами как от [FROM.GetNameDef], так и от [TUR.GetNameDef], и были очень удивлены, узнав, что эти двое подают совместные заявки на вступление в [ROOT.GetFactionName]. Это едва ли неприятный сюрприз, но сюрприз все же. Мы должны решить, поможет ли нам наличие их в качестве партнеров в нашем союзе, или помешает."
  bftb_greece.66.a:0 "Они станут желанными союзниками в эти неспокойные времена."
  bftb_greece.66.b:0 "Nein, они нам не нужны."
  bftb_greece.67.t:0 "[FROM.GetNameDefCap] предлагает стратегическое партнерство!"

  bftb_greece.67.desc:0 "Как кусочки головоломки, всё встаёт на свои места. Смена режима в Берлине была неожиданной, и породила много сомнений в отношении будущего нашей страны. Это будущее стало немного яснее после предложения, поступившего нам из Афин.\n\nПохоже, что [FROM.GetNameDef] хотят заключить прочный стратегический союз с нашим правительством. Мы нуждаемся в союзниках, и помощь [FROM.GetNameDef] может сыграть ключевую роль в реализации наших региональных амбиций. Однако, кто может сказать, что это не просто отчаянная попытка выжить? Возможно, они не хотят быть нашими союзниками; возможно, они видят, что их ждёт, если они будут нам противостоять... и возможно, это не так важно для нас."
  bftb_greece.67.a:0 "Рим и Афины - снова вместе!"
  bftb_greece.67.b:0 "Хищник не дружит со своей жертвой."
  bftb_greece.68.t:0 "[FROM.GetNameDefCap] подаёт заявку на вступление в [GER.GetFactionName]!"
  bftb_greece.68.desc:0 "Мы встретились с делегатами из [FROM.GetNameDef] и с облегчением услышали, что [FROM.GetAdjective] правительство выразило желание видеть [FROM.GetNameDef] в [ROOT.GetFactionName]. Вряд ли это стало неожиданностью: позиция [FROM.GetAdjective] была несостоятельной без нас. Мы должны определить, будет ли их участие в нашем союзе способствовать нашим целям или препятствовать им."
  bftb_greece.68.a:0 "Willkommen, Griechenland!"
  bftb_greece.68.b:0 "Nein, ни за что!"
  bftb_greece.69.t:0 "[FROM.GetNameDefCap] отказывается от нашего предложения о союзе!"
  bftb_greece.69.desc:0 "Мы были проинформированы дипломатом [FROM.GetAdjective], что [FROM.GetLeader] считает, что добавление нас в их тесный союз - неразумное решение. Сказать, что мы разочарованы - значит ничего не сказать. Тем не менее, без союза с [FROM.GetNameDef] нам теперь нужно самостоятельно прокладывать свой путь через этот период кризиса."
  bftb_greece.69.a:0 "Мы будем стоять, когда всё закончится."
  bftb_greece.70.t:0 "Элефтериос Венизелос умирает в изгнании"

  bftb_greece.70.desc:0 "Элефтериос Венизелос, лидер Венезелистов и уважаемый титан греческой политики, скончался в изгнании после того, как был свергнут военными в 1935 году. Венизелос был страстным сторонником греческой многопартийной системы и, пожалуй, единственной фигурой, которая так сильно повлияла на греческое национальное самосознание.\n\nОднако Элефтериос Венизелос запомнится не своими успехами, а своими многочисленными провалами. Именно Венизелос отстаивал разрушительную силу республиканизма в этой стране, и именно бездумный ревизионизм Венизелоса привел к тому, что наша нация была почти уничтожена в Греко-турецкой войне 1919 года. Каждая проблема, с которой Греция сталкивается сегодня, может быть возложена к ногам Венизелоса как главного источника всех бед нашей нации.\n\nОн был революционером, государственным деятелем и политическим пионером; он был зачинщиком беспорядков, разжигателем войны и неудачником. Что еще нужно сказать об Элефтериосе Венизелосе, кроме того, что мы рады, что он больше никогда не покажет свое лицо в Греции после всей боли, которую он причинил."
  bftb_greece.70.a:0 "Хорошо, что он ушел."
  bftb_greece.71.t:0 "Элефтериос Венизелос скончался"
  bftb_greece.71.desc:0 "Премьер-министр Элефтериос Венизелос, лидер Венезелистов и уважаемый титан греческой политики, мирно скончался в своем доме. Венизелос был страстным сторонником греческой многопартийной системы и, пожалуй, единственной фигурой, которая так сильно повлияла на греческое национальное самосознание.\n\nКак можно словами описать человека, который так много отдал своей стране и своим соотечественникам? Он - архитектор нации, которой мы сегодня имеем честь служить, и его неизгладимое наследие переживет нас всех. Единственным пятном на безупречном послужном списке Венизелоса является ужасная потеря, которую понесла наша страна после разрушительной Греко-турецкой войны 1919 года. Это пятно на в остальном безупречном наследии, которое мы намерены отомстить.\n\nЭлефтериос Венизелос был революционером, государственным деятелем и политическим пионером; он был нашим Этноархом, и мы будем помнить его как непоколебимого льва, каким он был. Фемистокл Софулис стал премьер-министром и лидером Филелефтерона, и объявил национальный траур по недавно скончавшемуся отцу современной Греции."
  bftb_greece.71.a:0 "Греция в долгу перед тобой, который она никогда не сможет выплатить..."
  bftb_greece.91.t:0 "EEE открывает центр помощи анатолийским беженцам"

  bftb_greece.91.desc:0 "В циничной попытке привлечь больше последователей к своему делу Георгиос Космидис использовал средства своего движения, чтобы открыть центр помощи для беженцев из [TUR.GetNameDef], таких как он сам. Это было бы похвально, если бы он не использовал эти центры помощи как центры вербовки для своего психотического движения. \n\nМы оказываемся в сложном положении: очевидно, что Космидис намерен продолжать поддерживать эти центры, чтобы вербовать обездоленных беженцев из Анатолии, так что мы должны закрыть их, чтобы остановить его яд? Или же мы должны сохранить свою репутацию и позволить этим центрам продолжать свою работу? Некоторые могут утверждать, что наличие нищих беженцев, работающих в фашистских центрах помощи, предпочтительнее, чем их страдания в трущобах."
  bftb_greece.91.a:0 "Инициатива, достойная поддержки!"
  bftb_greece.91.b:0 "Закрыть."
  bftb_greece.92.t:0 "EEE требуют повышения заработной платы для [ROOT.GetAdjective] рабочих"
  bftb_greece.92.desc:0 "EEE использовали национальное внимание, привлеченное к ним, чтобы начать яростную атаку на то, что они считают нашим слабым подходом к социальному обеспечению. Идея, что эти фашисты, появившиеся из ниоткуда, считают себя вправе читать нам лекции по бюджетной и социальной политике, смешна, но общественность, похоже, воспринимает их очень серьезно."
  bftb_greece.92.a:0 "Может быть... символический минимальный размер оплаты труда?"
  bftb_greece.92.b:0 "Мы не будем подчиняться фашистскому запугиванию."
  bftb_greece.93.t:0 "Члены EEE участвуют в уличном насилии с нашей полицией!"
  bftb_greece.93.desc:0 "По всей стране вспыхнули драки между членами EEE и нашей собственной полицией, создавая картину политического насилия, которое, как мы надеялись, осталось в прошлом. Судя по всем сообщениям о госпитализациях и эскалации насилия, мы ошибались. \n\nНекоторые министры предлагают занять очень жесткую позицию по поводу этого насилия, чтобы показать стране, что мы не терпим такого хулиганства, но другие министры предупреждают, что борьба с фашистами в ответ - это битва, которую мы не можем выиграть. Люди злы и недовольны, но это не дает им права совершать такие необоснованные акты насилия."
  bftb_greece.93.a:0 "Их жалобы законны."
  bftb_greece.93.b:0 "Насилие недопустимо, и толпу нужно разогнать."
  bftb_greece.94.t:0 "Члены EEE грабят иностранные фабрики и распространяют украденные товары!"

  bftb_greece.94.desc:0 "В печально знакомой ситуации, сторонники ЕЕЕ проникли на фабрики, принадлежащие иностранцам, с целью распространения произведенных там товаров среди бедных и обездоленных. Георгиос Космидис и руководство ЕЕЕ утверждают, что не имеют никакого отношения к этим действиям, но в то же время страстно защищают мужчин и женщин, участвующих в, по-видимому, альтруистической серии грабежей. \n\nТакое поведение действительно неприемлемо: мы уже получаем жалобы от иностранных магнатов из таких стран, как [ENG.GetNameDef] и [FRA.GetNameDef]. Тем не менее, если мы вмешаемся в защиту промышленников, мы будем выглядеть марионетками иностранных финансистов; с другой стороны, если мы позволим этой анархии разгуляться, то в глазах международного сообщества мы будем казаться неспособным правительством."
  bftb_greece.94.a:0 "Мы не должны их останавливать."
  bftb_greece.94.b:0 "Эта анархия не к лицу нам!"
  bftb_greece.95.t:0 "EEE Клянется Поддержать Нашу Борьбу!"
  bftb_greece.95.desc:0 "EEE, которая до сих пор была для нас занозой в заднице, похоже, готова объединиться с правительством против общего врага. Георгиос Космидис был одним из самых ярых сторонников войны с [TUR.GetNameDef], и теперь, когда эта война достигла наших берегов, EEE готова отложить партийную политику в сторону, чтобы увидеть, как наши [TUR.GetAdjective] враги унижены перед нашими армиями."
  bftb_greece.95.a:0 "Вместе нас не остановить!"
  bftb_greece.95.b:0 "Мы победим, не запятнав себя фашизмом."
  bftb_greece.96.t:0 "Аристотель Онассис Возвращается в [ROOT.GetNameDef]"
  bftb_greece.96.desc:0 "Богатый магнат и любимец публики Аристотель Онассис вернулся в [ROOT.GetNameDef] впервые за многие годы. Он отказался отвечать на вопросы прессы, и наши наблюдатели с трудом отслеживают его местонахождение, но, по имеющимся данным, он пытается завоевать расположение анатолийских беженцев и, возможно, готовится баллотироваться на пост."
  bftb_greece.96.a:0 "Что он замышляет?"
  bftb_greece.101.t:0 "Венезелисты и Коммунисты Объединяются Против Абсолютного Правления Короля"
  bftb_greece.101.desc:0 "Если у кого-то еще оставались сомнения в том, что коммунисты и венезелисты заключили союз, теперь они должны исчезнуть. Мы получили сообщения о том, что коммунисты тайком переправили Элефтериоса Венизелоса обратно в страну, надеясь сделать его временным лидером после свержения монархии. \n\nБезумный план, даже для кучки красных предателей. Как они могли подумать, что Венизелос передаст им власть, когда сам ее получит? Это сумасшествие. С другой стороны, ни коммунисты, ни венезелисты никогда не отличались здравомыслием. Мы должны подготовиться к тому, что, несомненно, будет по-настоящему ожесточенной гражданской войной."
  bftb_greece.101.a:0 "Наши враги трусливо прячутся, как крысы!"
  bftb_greece.102.t:0 "Коммунисты Организуют Налет на Фабрику"

  bftb_greece.102.desc:0 "Правоохранительные органы не смогли предсказать и предотвратить недавний коммунистический рейд на один из наших заводов, где мы производим винтовки для армии. Марксисты ограбили все, что могли с заводского цеха, а затем попытались сжечь сам завод, хотя, к счастью, им удалось лишь повредить здание.\n\nНет необходимости размышлять, почему эти повстанцы предприняли этот дерзкий рейд на производителя оружия: они, несомненно, намерены использовать наши собственные винтовки против нас, когда найдут хребет и выйдут из тени. Это может оказаться одной из худших гражданских войн [ROOT.GetNameDef]..."
  bftb_greece.102.a:0 "Мы не можем позволить этим анархистам наносить нам удары с такой безнаказанностью."
  bftb_greece.103.t:0 "Венезелистские генералы тайком переправлены обратно в Грецию!"
  bftb_greece.103.desc:0 "Вслед за своим позорным лидером мы получили информацию о том, что многие бывшие генералы-венезелисты были тайком переправлены обратно в страну. Коммунистические и республиканские контрабандисты сговорились, чтобы вернуть опозоренных военных лидеров в страну, замаскированных среди перевозимых товаров, и скрыли их до того, как мы смогли понять, что происходит.\n\nРешительная битва с дезорганизованными повстанцами - это одно; полномасштабная гражданская война, поддерживаемая компетентным военным руководством, - это совсем другое дело. Многие советники теперь задаются вопросом, было ли действительно мудрым решением для такого непопулярного монарха предпринять такой публичный и непопулярный шаг, объявив себя абсолютным монархом, но [ROOT.GetLeader] остается непреклонным в том, что повстанцы будут быстро разгромлены."
  bftb_greece.103.a:0 "Неужели им действительно пришлось взрывать порт?"
  bftb_greece.104.t:0 "Организованное сопротивление усиливается на юге и севере!"
  bftb_greece.104.desc:0 "Власти сообщили правительству, что мы практически потеряли контроль над северной и южной частью страны. Коммунистические и венезелистские симпатизанты бесчинствуют на улицах, распространяя свою клевету и пропаганду: не встречая препятствий со стороны местных властей, которые либо столь же симпатизируют им, либо полностью бессильны их остановить.\n\nАрмия, зная, что их ждет ловушка, отказывается выдвигаться, чтобы обеспечить безопасность регионов. Однако они остаются в полной боевой готовности, и кабинет короля получил заверения, что как только венезелисты и коммунисты выйдут из укрытия, армия не будет колебаться, предприняв необходимые шаги, чтобы вернуть контроль над страной. Конечно, многие политические деятели остаются скептически настроены по поводу искренности этих заверений, поскольку широко распространены сообщения о коррупции и предательской лояльности в вооруженных силах."
  bftb_greece.104.a:0 "Ситуация выходит из-под контроля!"
  bftb_greece.105.t:0 "Гражданская война!"

  bftb_greece.105.desc:0 "Настал роковой день: лидер Венезелистов наконец вышел из тени, чтобы осудить указ короля как незаконный и беспрецедентную угрозу демократии [FROM.GetNameDef]. В их глазах у них нет другого выбора, кроме как насильственно свергнуть монархию, чтобы восстановить уже дважды побежденную Эллинскую Республику.\n\n[ROOT.GetLeader] осудил всех повстанцев как предателей и пообещал искоренить марксистов и республиканцев, чтобы порядок был восстановлен в [ROOT.GetNameDef]. Похоже, что политическая арена [ROOT.GetNameDef] снова превратилась в гладиаторский Колизей, где только самые могущественные могут уйти победителями."
  bftb_greece.105.a:0 "Встанем за короля!"

  bftb_greece.166.t:0 "Наши политики возвращаются из инвестиционных переговоров в Афинах"
  bftb_greece.166.desc:0 "Когда [FROM.GetAdjective]s решили пригласить нас для дальнейшего обсуждения углубления наших экономических связей, мы не могли отказать. Излишне говорить, что они убедительно обосновали, почему было бы идеально, если бы промышленный потенциал [FROM.GetAdjective]s был усилен. Вопрос о том, будем ли мы инвестировать в их страну или оставим их промышленный потенциал на волю судьбы, мы решаем сами."
  bftb_greece.166.a:0 "Да, мы будем инвестировать!"
  bftb_greece.166.b:0 "На этот раз инвестиций не будет..."
  bftb_greece.166.c:0 "Нет, мы никогда не будем инвестировать в их жалкую страну!"
  bftb_greece.167.t:0 "Наши бизнесмены возвращаются с Национальной выставки [FROM.GetAdjective]s"
  bftb_greece.167.desc:0 "[FROM.GetAdjective]s устроили нам настоящее шоу! Их предложение привлечь наши инвестиции было, несомненно, привлекательным, но у нас, безусловно, есть свои приоритеты, которыми мы должны заниматься. Выбор инвестировать ли в [FROM.GetAdjective] nation остается за нами."
  bftb_greece.167.a:0 "Да, мы будем инвестировать!"
  bftb_greece.167.b:0 "На этот раз инвестиций не будет..."
  bftb_greece.167.c:0 "Нет, мы никогда не будем инвестировать в их жалкую страну!"
  bftb_greece.168.t:0 "[FROM.GetAdjective]s шантажируют нас, используя план Шахта!"
  bftb_greece.168.desc:0 "Хитрые маленькие Schädlinge в [FROM.GetNameDef] придумали способ использовать нашу собственную пирамидальную схему против нас. Безопасная маленькая лазейка, разработанная для того, чтобы мы могли использовать ошибки плана Шахта в своих интересах, вместо этого была обращена против нас - что не должно было быть возможным. Мы можем либо сохранить лицо и дать [FROM.GetAdjective]s эту маленькую победу, либо отказаться от фасада игры по правилам и отказаться от переговоров с народом [FROM.GetAdjective]s."
  bftb_greece.168.a:0 "Чтобы избежать последствий, мы уступим на этот раз..."
  bftb_greece.168.b:0 "Переверните стол, Шахт!"
  bftb_greece.168.c:0 "Мы никогда не поддадимся [FROM.GetAdjective] шантажу!"
  bftb_greece.168.d:0 "Они переиграли; они должны понести последствия!"

  gott_bless_herr_schacht_tt:0 "Этот вариант доступен, потому что у вас сейчас в министерстве есть §YHjalmar Schacht§!"
  bftb_greece.169.t:0 "[FROM.GetAdjective]s Инвестируют!"
  bftb_greece.169.desc:0 "Мы только что закончили встречать [FROM.GetAdjective]s инвесторов обратно в нашу страну после их последнего короткого визита, и они несут добрые вести об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
  bftb_greece.169.a:0 "Ошеломляющий успех!"
  bftb_greece.169.b:0 "Ошеломляющий успех!"
  bftb_greece.169.c:0 "Прекрасная работа, ребята!"
  bftb_greece.170.t:0 "[FROM.GetAdjective]s Решают Не Инвестировать"
  bftb_greece.170.desc:0 "Увы, мы получили известие о том, что [FROM.GetAdjective]s в этот раз не будут инвестировать в нашу экономику. Это разочаровывающее событие, хотя делегат [FROM.GetAdjective]s не исключил будущих инвестиций, что хорошо для нас."
  bftb_greece.170.a:0 "Может быть, в следующий раз."
  bftb_greece.171.t:0 "[FROM.GetAdjective]s Навсегда Избегают Переговоров Об Инвестициях!"
  bftb_greece.171.desc:0 "Возможно, мы слишком настойчиво требовали инвестиций: [FROM.GetAdjective]s решили, что у них нет интереса к инвестированию в развивающуюся промышленную базу нашей страны. Если они не хотят помочь нам формировать будущее, то нам придется обойтись без них."
  bftb_greece.171.a:0 "Возможно... [ITA.GetAdjective]s будут более склонны к сделке?"
  bftb_greece.172.t:0 "Хьяльмар Шахт Обманывает Нас!"
  bftb_greece.172.desc:0 "Мы были такими дураками, что думали, что мы можем шантажировать [FROM.GetAdjective]s, используя план Шахта, когда сам человек, который составил это соглашение, все еще был министром! Теперь мы стали той нацией, которая должна им платить! Какая катастрофа!"
  bftb_greece.172.a:0 "Волшебник Финансов снова в деле!"
  bftb_greece.173.t:0 "Наши Предприниматели Возвращаются Из Переговоров В Афинах!"
  bftb_greece.173.desc:0 "Когда [FROM.GetAdjective]s решили пригласить нас для дальнейшего обсуждения углубления наших экономических связей, мы не могли отказаться. Излишне говорить, что они убедительно объяснили, почему было бы идеально укрепить промышленный потенциал [FROM.GetAdjective]s. Вопрос о том, хотим ли мы инвестировать в их страну или оставить их промышленный потенциал на волю судьбы, решать нам."
  bftb_greece.173.a:0 "Мы предоставим им хартию, чтобы они могли инвестировать."
  bftb_greece.173.b:0 "В настоящее время это не в интересах Великобритании."
  bftb_greece.173.c:0 "Извини, старые парни, но у Джона Буля есть более важные дела."
  bftb_greece.174.t:0 "Наши Политики Посещают Национальную Выставку [FROM.GetAdjective]s"
  bftb_greece.174.desc:0 "[FROM.GetAdjective]s устроили для нас отличное шоу! Их предложение привлечь наши инвестиции было привлекательным, без сомнения, но у нас, конечно, есть свои приоритеты, которые нас волнуют. Решение о том, инвестировать ли нам в [FROM.GetAdjective]s, остается за нами."

  bftb_greece.174.a:0 "Они могут рассчитывать на нашу поддержку!"
  bftb_greece.174.b:0 "В этот раз это не в интересах Британии."
  bftb_greece.174.c:0 "Прости, старина, но у Джона Буля есть более важные дела!"
  bftb_greece.175.t:0 "[$FROM.GetAdjective] Предлагают корабельные детали в обмен на инвестиции"
  bftb_greece.175.desc:0 "Интересное предложение от [$FROM.GetAdjective]ов: они хотят предложить нам детали, чтобы облегчить производство наших кораблей в обмен на увеличение инвестиций в их страну. Возможно, немного неортодоксально для государственных акторов торговаться на таком базовом уровне, но, с другой стороны, единственное, что всегда было по-настоящему ортодоксальным в [$FROM.GetAdjective]ах, - это их религия."
  bftb_greece.175.a:0 "Справедливая сделка! Почти."
  bftb_greece.175.b:0 "В настоящее время нам не нужны [$FROM.GetAdjective] детали."
  bftb_greece.175.c:0 "Извини, [$FROM.GetNameDef], но наши дела с тобой завершены. Навсегда!"
  bftb_greece.176.t:0 "[$FROM.GetAdjective] Решили Инвестировать!"
  bftb_greece.176.desc:0 "Мы только что закончили приветствовать [$FROM.GetAdjective] инвесторов в нашей стране после их последнего короткого визита, и они приносят хорошие вести об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
  bftb_greece.176.a:0 "Оглушительный успех!"
  bftb_greece.176.b:0 "Оглушительный успех!"
  bftb_greece.176.c:0 "Мы всегда можем рассчитывать на [$FROM.GetAdjective]!"
  bftb_greece.177.t:0 "[$FROM.GetAdjective] Решили Не Инвестировать В Этот Раз"
  bftb_greece.177.desc:0 "Увы, мы получили известие о том, что [$FROM.GetAdjective] не будут инвестировать в нашу экономику в этот раз. Это разочаровывающий поворот событий, хотя [$FROM.GetAdjective] делегат не исключил будущих инвестиций, что хорошо для нас."
  bftb_greece.177.a:0 "Ну ладно, может быть, в следующий раз."
  bftb_greece.178.t:0 "[$FROM.GetAdjective] Принимают Законопроект, Препятствующий Нам Искать Дальнейшие Инвестиции!"
  bftb_greece.178.desc:0 "Возможно, мы слишком сильно давили на вопрос о инвестициях: [$FROM.GetAdjective] решили, что они не заинтересованы в инвестировании в нашу бурно развивающуюся промышленную базу. Если они не хотят нам помогать формировать будущее, тогда нам придется обходиться без них."
  bftb_greece.178.a:0 "Осмелимся ли мы заключить сделку с русскими?"
  bftb_greece.179.t:0 "[$FROM.GetAdjective] Чиновники Обращаются К Нам В Столице, Прося Нас Об Инвестициях"
  bftb_greece.179.desc:0 "Когда [$FROM.GetAdjective]ы решили пригласить нас на дальнейшие обсуждения углубления наших экономических связей, мы не могли отказаться. Излишне говорить, что они убедительно аргументировали, почему было бы идеально, если бы промышленный потенциал [$FROM.GetAdjective]а был усилен. Вопрос о том, инвестируем ли мы в их страну или оставим их промышленный потенциал на волю судьбы, решать нам."
  bftb_greece.179.a:0 "Да, мы можем инвестировать небольшую сумму."
  bftb_greece.179.b:0 "Не в этот раз."

  bftb_greece.179.c:0 "У нас нет никакого интереса к делам [FROM.GetAdjective]!"
  bftb_greece.180.t:0 "Наши чиновники посетили национальную выставку, проводимую в [FROM.GetNameDef]"
  bftb_greece.180.desc:0 "[FROM.GetAdjective] устроили для нас настоящее шоу! Их предложение привлечь наши инвестиции было заманчивым, без сомнения, но у нас есть свои приоритеты. Выбор, инвестировать ли нам в [FROM.GetAdjective] нацию, остается за нами."
  bftb_greece.180.a:0 "Да, мы инвестируем в [FROM.GetNameDef]"
  bftb_greece.180.b:0 "Не в этот раз."
  bftb_greece.180.c:0 "У нас нет никакого интереса к делам [FROM.GetNameDef]!"
  bftb_greece.181.t:0 "Правительство [FROM.GetAdjective] подкупает наши профсоюзы!"
  bftb_greece.181.desc:0 "Эти подлые мошенники из [FROM.GetNameDef] задумали заставить нас инвестировать в кучу камней, которую они называют домом! Наши профсоюзы пикетируют нас, обвиняя нас в том, что мы сознательно усугубляем проблему занятости, сознательно игнорируя предложения столь щедрых [FROM.GetAdjective] людей. Это абсурд, их коррупция видна невооруженным глазом. И все же, они держат все карты в своих руках. Выберем ли мы путь наименьшего сопротивления и дадим профсоюзам, а значит и [FROM.GetNameDef], то, что они хотят? Или же мы будем отстаивать наши принципы, в то время как принципы могут погубить нас всех?"
  bftb_greece.181.a:0 "Мы не можем позволить себе забастовки в это время..."
  bftb_greece.181.b:0 "Ваши угрозы не пугают нас, бездельники!"
  bftb_greece.181.c:0 "Ах, Греция - король идиотов! Держитесь от нас подальше!"
  bftb_greece.182.t:0 "[FROM.GetAdjective] Инвестируют!"
  bftb_greece.182.desc:0 "Мы только что завершили встречу [FROM.GetAdjective] инвесторов в нашей стране после их последнего короткого визита, и они приносят добрые вести об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
  bftb_greece.182.a:0 "Ошеломляющий успех!"
  bftb_greece.182.b:0 "Ошеломляющий успех!"
  bftb_greece.182.c:0 "Поистине, наша дружба велика!"
  bftb_greece.183.t:0 "[FROM.GetAdjective] Решили не инвестировать на этот раз"
  bftb_greece.183.desc:0 "Увы, мы получили известие, что [FROM.GetAdjective] на этот раз не будут инвестировать в нашу экономику. Это разочаровывающий поворот событий, хотя [FROM.GetAdjective] делегат не исключил будущих инвестиций, что сулит нам надежду."
  bftb_greece.183.a:0 "Ну да ладно, может быть в следующий раз."
  bftb_greece.184.t:0 "[FROM.GetAdjective] Выдворяют Нашего Делегата и Исключают Возможность Инвестирования"
  bftb_greece.184.desc:0 "Возможно, мы слишком настаивали на инвестициях: [FROM.GetAdjective] решили, что у них нет никакого интереса инвестировать в развивающуюся промышленную базу нашей страны. Если они не хотят помогать нам формировать будущее, то нам придется обойтись без них."
  bftb_greece.184.a:0 "Осмелимся ли мы попытаться заключить сделку с русскими?"

  bftb_greece.185.t:0 "The [FROM.GetAdjective]s Approach Us for Help with Industrializing Their Country"
  bftb_greece.185.desc:0 "When the [FROM.GetAdjective]s decided to invite us to discuss deepening our economic ties, well, we could not refuse. What could possibly drive the [FROM.GetAdjective]s to become so desperate that they came to us for financial assistance? Needless to say, they made a compelling case for why it might be ideal that [FROM.GetAdjective]'s industrial standing was strengthened... espcially when it could prove to improve our own. The matter of whether we seek to invest in their nation or leave their industrial potential up to fate is a matter we get to decide."
  bftb_greece.185.a:0 "There are alternatives to fighting!"
  bftb_greece.185.b:0 "Perhaps at a later date."
  bftb_greece.185.c:0 "There will be a chance for industrialization after they have been conquered!"
  bftb_greece.186.t:0 "[FROM.GetAdjective] Diplomats Hope to Temper [ROOT.GetAdjective] Ambitions in the Mediterranean"
  bftb_greece.186.desc:0 "We have received a delegate from [FROM.GetNameDef] who has relayed his government's concern with increasing [ROOT.GetAdjective] political inteference in their country. They have been given the authority to strike a bargain: they shall provide us material goods, and we shall relent on seizing control of every apparatus of their state. \n\nWe, of course, denied any such inteference was taking place, although we all know it to be true. The offer is a generous one; no doubt the [FROM.GetAdjective] desire to keep their sovereignty secure is honest. We could use the influx of material, but then again, we could also use [FROM.GetNameDef] stuck completely under our thumb..."
  bftb_greece.186.a:0 "The aid would be appreciated."
  bftb_greece.186.b:0 "Perhaps we might agree in the future, but not now."
  bftb_greece.186.c:0 "Ah, vassalage cannot be escaped so easily!"
  bftb_greece.187.t:0 "The [FROM.GetAdjective] Invest!"
  bftb_greece.187.desc:0 "We have just finished welcoming the [FROM.GetAdjective] investors back to our country after their last short little visit, and they bring good tidings of investment and opportunity! They also bring with them uninvited observers, who we quickly lost track of as they went about doing whatever it was they were sent here to do. Regardless, with [FROM.GetAdjective] help, we shall build a truly modern economy."
  bftb_greece.187.a:0 "A deal with the Devil is preferable to death."
  bftb_greece.187.b:0 "We pay dearly for our continued independence."
  bftb_greece.188.t:0 "The [FROM.GetAdjective] Do Not Invest This Time"
  bftb_greece.188.desc:0 "Alas, we have received word that the [FROM.GetAdjective] shall not be investing into our economy this time. It is a disappointing turn of events, though the [FROM.GetAdjective] delegate has not ruled out future investments which bodes well for us."
  bftb_greece.188.a:0 "Perhaps this is a blessing in disguise..."
  bftb_greece.185.t:0 "The [FROM.GetAdjective]s Approach Us for Help with Industrializing Their Country"
  bftb_greece.185.desc:0 "Когда [FROM.GetAdjective]s решили пригласить нас обсудить углубление наших экономических связей, ну, мы не могли отказаться. Что могло заставить [FROM.GetAdjective]s стать настолько отчаянными, что они обратились к нам за финансовой помощью? Излишне говорить, они убедительно аргументировали, почему было бы идеально укрепить промышленный потенциал [FROM.GetAdjective]... особенно если это могло бы улучшить наш собственный. Решение о том, будем ли мы инвестировать в их страну или оставим их промышленный потенциал на волю судьбы, решать нам."
  bftb_greece.185.a:0 "Есть альтернативы войне!"
  bftb_greece.185.b:0 "Возможно, позже."
  bftb_greece.185.c:0 "Будет шанс на индустриализацию после того, как они будут покорены!"
  bftb_greece.186.t:0 "[FROM.GetAdjective] Diplomats Hope to Temper [ROOT.GetAdjective] Ambitions in the Mediterranean"
  bftb_greece.186.desc:0 "Мы получили делегата от [FROM.GetNameDef], который передал озабоченность своего правительства по поводу растущего политического влияния [ROOT.GetAdjective] в их стране. Им было дано право заключить сделку: они предоставят нам материальные блага, а мы откажемся от захвата контроля над каждым аппаратом их государства. \n\nМы, конечно же, отрицали, что какое-либо вмешательство имело место, хотя все мы знаем, что это правда. Предложение щедрое; нет сомнений в том, что [FROM.GetAdjective] искренне хотят сохранить свой суверенитет. Мы могли бы использовать приток материальных средств, но, с другой стороны, мы могли бы использовать [FROM.GetNameDef], полностью находящуюся под нашим контролем..."
  bftb_greece.186.a:0 "Помощь будет принята с благодарностью."
  bftb_greece.186.b:0 "Возможно, мы согласимся в будущем, но не сейчас."
  bftb_greece.186.c:0 "Ах, от вассальной зависимости так просто не уйти!"
  bftb_greece.187.t:0 "The [FROM.GetAdjective] Invest!"
  bftb_greece.187.desc:0 "Мы только что завершили встречу с [FROM.GetAdjective] инвесторами, вернувшимися в нашу страну после их последнего короткого визита, и они приносят хорошие новости об инвестициях и возможностях! Они также привезли с собой незваных наблюдателей, которых мы быстро потеряли из виду, когда они принялись делать то, что им было поручено. Несмотря ни на что, с помощью [FROM.GetAdjective] мы построим по-настоящему современную экономику."
  bftb_greece.187.a:0 "Сделка с дьяволом предпочтительнее смерти."
  bftb_greece.187.b:0 "Мы дорого платим за нашу независимость."
  bftb_greece.188.t:0 "The [FROM.GetAdjective] Do Not Invest This Time"
  bftb_greece.188.desc:0 "Увы, мы получили сообщение о том, что [FROM.GetAdjective] не будут инвестировать в нашу экономику на этот раз. Это разочаровывающее событие, хотя делегат [FROM.GetAdjective] не исключил возможности будущих инвестиций, что сулит нам хорошее."
  bftb_greece.188.a:0 "Возможно, это благословение в маскировке..."

  bftb_greece.189.t:0 "[FROM.GetAdjective] отказываются от наших делегатов и высылают наших дипломатов!"
  bftb_greece.189.desc:0 "Возможно, мы слишком настойчиво настаивали на вопросе инвестиций: [FROM.GetAdjective] решили, что у них нет интереса инвестировать в нашу бурно развивающуюся промышленную базу. Если они не хотят помогать нам строить будущее, то мы просто обойдемся без них."
  bftb_greece.189.a:0 "Это, безусловно, знак того, что в будущем нас ждут еще худшие времена."
  bftb_greece.190.t:0 "Чиновники [FROM.GetAdjective] завершают свой визит в Президиум"
  bftb_greece.190.desc:0 "Мы только что имели удовольствие принять у себя чиновников из [FROM.GetNameDef], одна из которых выступила с речью перед Президиумом в качестве гостя, подчеркнув прочные отношения между нашими странами. Это был приятный момент, но истинная цель визита [FROM.GetAdjective] заключалась в обсуждении инвестиций в их бедствующую страну. Марксистские теоремы гласили, что революция может произойти только в индустриальных обществах, но наша собственная история и опыт [FROM.GetAdjective] говорят нам об обратном.\n\nСреди чиновников царит твердое мнение, что мы должны помочь [FROM.GetAdjective], поскольку у нас есть ресурсы для этого. Однако у нас также есть потребность в собственных ресурсах - это не оспаривается ни одним чиновником. Что же нам делать?"
  bftb_greece.190.a:0 "[ROOT.GetNameDefCap] направит часть ресурсов на улучшение [FROM.GetNameDef]."
  bftb_greece.190.b:0 "Нет, в настоящее время инвестиций не будет."
  bftb_greece.190.c:0 "[ROOT.GetAdjective] народ не будет страдать, чтобы несколько [FROM.GetAdjective] фермеров могли работать на фабрике."
  bftb_greece.191.t:0 "[ROOT.GetAdjective] бюрократы возвращаются из своей поездки в [FROM.GetNameDef]"
  bftb_greece.191.desc:0 "Когда [FROM.GetAdjective] решили пригласить нас обсудить углубление наших экономических связей, ну, мы не могли отказать. Что могло заставить [FROM.GetAdjective] стать настолько отчаянными, что они обратились к нам за финансовой помощью? Излишне говорить, что они убедительно доказали, почему было бы идеальным решением укрепить промышленный потенциал [FROM.GetAdjective] ... особенно если это могло бы улучшить и наш собственный. Вопрос о том, будем ли мы инвестировать в их страну или оставим их промышленный потенциал на волю судьбы, решать нам."
  bftb_greece.191.a:1 "Разрешается расширение их вооружений во имя борьбы с реакционерами."
  bftb_greece.191.b:0 "Нет, в настоящее время инвестиций не будет."
  bftb_greece.191.c:0 "[ROOT.GetAdjective] народ не будет страдать, чтобы несколько [FROM.GetAdjective] фермеров могли работать на фабрике."
  bftb_greece.192.t:0 "Чиновники [FROM.GetAdjective] предлагают схему обратного выкупа, в которой они инвестируют в наши заброшенные сибирские регионы"

  bftb_greece.192.desc:0 "Мы получили от [FROM.GetNameDef] делегата, который передал озабоченность правительства по поводу возрастающего [ROOT.GetAdjective] политического вмешательства в их страну. Им было дано право заключить сделку: они будут инвестировать в наши обедневшие регионы, а мы откажемся от захвата контроля над всеми структурами их государства. \n\nМы, конечно, отрицаем любое вмешательство, хотя все мы знаем, что это правда. Предложение щедрое; без сомнения, желание [FROM.GetAdjective] сохранить свой суверенитет честно. Нам мог бы пригодиться приток материальных ресурсов, но, с другой стороны, нам также мог бы пригодиться [FROM.GetNameDef], полностью находящийся под нашим контролем..."
  bftb_greece.192.a:0 "План [FROM.GetAdjective] получил одобрение Политбюро, он будет реализован."
  bftb_greece.192.b:0 "Ставка считает, что мягкая сила, которую мы можем использовать в отношении [FROM.GetNameDef], более полезна."
  bftb_greece.192.c:0 "[ROOT.GetNameDefCap] завершил ведение дел с [FROM.GetNameDef]."
  bftb_greece.193.t:1 "Инвестиции в [FROM.GetNameDef]!"
  bftb_greece.193.desc:1 "Наши лучшие умы вернулись домой после своей последней восхитительной поездки к нашим [FROM.GetAdjective] друзьям и привезли отличные новости о взаимовыгодных инвестициях и возможностях! Совместными усилиями мы поднимем как [ROOT.GetAdjective], так и [FROM.GetAdjective] народы, создав партнерство, с которым придется считаться."
  bftb_greece.193.a:1 "Одна добрая услуга может привести к другой."
  bftb_greece.194.t:0 "[FROM.GetAdjective] не инвестируют на этот раз"
  bftb_greece.194.desc:0 "Увы, мы получили сообщение о том, что [FROM.GetAdjective] на этот раз не будут инвестировать в нашу экономику. Это разочаровывающее событие, хотя делегат [FROM.GetAdjective] не исключил будущих инвестиций, что хорошо для нас."
  bftb_greece.194.a:0 "Возможно, это благословение в маскировке..."
  bftb_greece.195.t:0 "[FROM.GetAdjective] отвергают наших делегатов и высылают наших дипломатов!"
  bftb_greece.195.desc:1 "Возможно, мы слишком сильно давили на вопрос инвестиций: [FROM.GetAdjective] решили, что они не заинтересованы в инвестировании в нашу растущую промышленную базу. Если они не хотят помогать нам формировать будущее, то нам просто придется обходиться без них."
  bftb_greece.195.a:0 "Теперь мы по-настоящему одни, решая наши экономические проблемы."
  bftb_greece.200.t:0 "Совещание в Ираклионе состоялось - большой успех!"
  bftb_greece.200.desc:0 "Совещание в Ираклионе официально завершилось, и это был абсолютный успех! Все участники уехали с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ждет основательное расширение своих границ. Вместе мы отомстим за Севрский договор, нанесший удар по [TUR.GetName]."
  bftb_greece.200.a:0 "Мы можем похлопать себя по спине за это."
  bftb_greece.201.t:0 "Совещание в Ираклионе"

  bftb_greece.201.desc:0 "Ираклийская конвенция официально завершилась, и это был большой успех! Все участники, за исключением [ENG.GetNameDef], ушли с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ожидает полное расширение своих границ. Вместе участники отомстят за Севрский договор, но теперь он будет адресован более заслуженному [TUR.GetName]."
  bftb_greece.201.a:0 "Ура!"
  bftb_greece.201.b:0 "Что за бред!"
  bftb_greece.202.t:0 "Созыв Ираклийской конвенции"
  bftb_greece.202.desc:0 "Ираклийская конвенция официально завершилась, и это был большой успех! Все участники, за исключением [FRA.GetNameDef], ушли с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ожидает полное расширение своих границ. Вместе участники отомстят за Севрский договор, но теперь он будет адресован более заслуженному [TUR.GetName]."
  bftb_greece.202.a:0 "Великая инициатива!"
  bftb_greece.202.b:0 "Quels imbéciles..."
  bftb_greece.203.t:0 "Созыв Ираклийской конвенции"
  bftb_greece.203.desc:0 "Ираклийская конвенция официально завершилась, и это был огромный успех! Все участники, за исключением [ITA.GetNameDef], ушли с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ожидает полное расширение своих границ. Вместе участники отомстят за Севрский договор, но теперь он будет адресован более заслуженному [TUR.GetName]."
  bftb_greece.203.a:0 "Превосходный результат!"
  bftb_greece.203.b:0 "Ricordiamo la Vittoria Mutilata..."
  bftb_greece.204.t:0 "Созыв Ираклийской конвенции"
  bftb_greece.204.desc:0 "Ираклийская конвенция официально завершилась, и это был… приемлемый успех. Ни [ENG.GetNameDef], ни [FRA.GetNameDef] не будут участвовать в будущей войне, поскольку никому из них не обещали территории от разгромленной [TUR.GetNameDef]. Похоже, что [GRE.GetNameDef] ожидает полное расширение своих границ, при условии, что у него хватит сил, чтобы в одиночку победить [TUR.GetNameDef]…"
  bftb_greece.204.a:0 "Все же победа."
  bftb_greece.204.b:0 "Какая пустая трата времени…"
  bftb_greece.205.t:0 "Созыв Ираклийской конвенции"
  bftb_greece.205.desc:0 "Ираклийская конвенция официально завершилась, и это был вполне подходящий успех! Все участники, за исключением [ENG.GetNameDef] и [ITA.GetNameDef], ушли с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ожидает полное расширение своих границ. Вместе участники отомстят за Севрский договор, но теперь он будет адресован более заслуженному [TUR.GetName]."
  bftb_greece.205.a:0 "В одних делах выигрываешь, в других проигрываешь!"
  bftb_greece.205.b:0 "Какая пустая трата времени…"
  bftb_greece.205.c:0 "Мы не потерпим это второе предательство!"
  bftb_greece.206.t:0 "Созыв Ираклийской конвенции"

  bftb_greece.206.desc:0 "Гераклионская конвенция официально завершилась, и она стала совершенным успехом! Все участники, за исключением [FRA.GetNameDef] и [ITA.GetNameDef], ушли с гарантиями территориальных приобретений, и похоже, что [GRE.GetNameDef] ожидает серьезное расширение своих границ. Вместе подписавшие соглашение отомстят за Севрский договор над гораздо более достойным [TUR.GetName]."
  bftb_greece.206.a:0 "По крайней мере, победа."
  bftb_greece.206.b:0 "Какая трата времени..."
  bftb_greece.206.c:0 "Мы не потерпим этого второго предательства!"
  bftb_greece.207.t:0 "EEE запускает переворот!"
  bftb_greece.207.desc:0 "Мы должны были знать, что это закончится так: лидеры EEE осудили нас как слабых и неэффективных, и объявили нас самой непосредственной преградой на пути к [ROOT.GetAdjective] величию. Хулиганы устроили грандиозное зрелище в греческом парламенте, где они обвинили нас всех в предательстве и заявили, что сделают все возможное, чтобы сместить нас. Конечно же, после того, как все драматично покинули палату, они вернулись несколько часов спустя с толпой, которая следовала за ними и призывала к нашей немедленной коллективной отставке.\n\nОбщественное мнение больше не на нашей стороне, и, честно говоря, многие министры правительства потеряли веру в то, что эта администрация способна довести дело до конца, как мы обещали народу. Повсеместно царит ощущение, что, маршируя на Константинополь без иностранной или народной поддержки, мы ведем всю страну на марш смерти, из которого мы никогда не вернемся."
  bftb_greece.207.a:0 "Мы должны ответить за наши неудачи."
  bftb_greece.207.b:0 "Афины никогда не будут управляться фашистскими собаками!"
  byzantinist_coup_tt:0 "§YВизантийские фашисты§! сформируют правительство!\n"
  byzantinist_civil_war_inevitable_tt:0 "§YВизантийцы§! скоро попытаются силой отстранить нас от власти...\n"
  bftb_greece.209.t:0 "Мы выполнили свои обязательства, как было указано во время Гераклионской конвенции!"
  bftb_greece.209.desc:0 "Мы раздробили бывшее турецкое государство и разделили добычу между победителями. Наши обязательства перед нашими союзниками и перед нашим народом выполнены, и [ROOT.GetNameDef] ближе, чем когда-либо за последние века, к достижению истинного величия."
  bftb_greece.209.a:0 "Это поистине наш величайший момент."
  megali_idea_honoured_greece_tt:0 "Территории, обещанные нашим союзникам во время §YГераклионской конвенции§!, уже переданы.\n"
  bftb_greece.210.t:0 "Греки выполняют свои гарантии, данные во время Гераклионской конвенции!"
  bftb_greece.210.desc:0 "Как и было обещано, провинции, которые нам гарантировали, были отрезаны от остатков побежденной турецкой нации и переданы нам под контроль. Империализм - это грязное дело, но никто не делает это лучше, чем мы."
  bftb_greece.210.a:0 "Выполнено по часам."
  megali_idea_honoured_tt:0 "Территории, обещанные нам §Y[GRE.GetNameDef]§! во время §YГераклионской конвенции§!, уже переданы."

  bftb_greece.213.t:0 "[$FROM.GetAdjective]s отказываются возвращать свои долги!"
  bftb_greece.213.desc:0 "Эти похотливые [$FROM.GetAdjective] воры решили сбежать с деньгами, которые они нам должны! Мы тщательно культивировали и наращивали этот долг на протяжении десятилетий, и у них хватает наглости называть его незаконным? Если они считают, что могут нас обмануть безнаказанно, то они глубоко заблуждаются - должны быть последствия! Хотя нельзя отрицать, что мы были несколько чрезмерно рьяны в том, чтобы помочь [$FROM.GetNameDef] накопить долг, а затем наказать его за него."
  bftb_greece.213.a:0 "Растрачивающие паразиты!"
  bftb_greece.213.b:0 "Их слишком сильно давили, и это стало следствием."
  bftb_greece.217.t:0 "Великая Фашистская Буле Галакарнасса"
  bftb_greece.217.desc:0 "Фашизм всегда был довольно умеренным явлением в [$ROOT.GetNameDef], но под руководством [$ROOT.GetLeader] он процветал до такой степени, что все великие фашистские умы страны могли собраться вместе, чтобы обсудить будущее страны. [$ROOT.GetLeader] предлагает взять свой решительно авторитарный стиль правления и перевести его непосредственно в фашистскую форму, чтобы свести к минимуму нестабильность. Георгий Меркурис, непревзойденный национал-социалист страны, считает, что лучший путь для [$ROOT.GetNameDef] - избавиться от непопулярного короля, чтобы привести страну в по-настоящему радикальную сферу политики.\n\n[$ROOT.GetLeader] подробно рассказал о видениях Великой Греции, простирающейся от Албании до Кипра, но Меркурис, не желая отставать, считал, что [$ROOT.GetAdjective] народу необходимо оглянуться еще дальше, чтобы найти ключ к своему величию. Метаксас считает, что Третья Эллинская Цивилизация грядет как новая, великая Эллинская нация в ближайшем будущем, но Меркурис считает, что вдохновение для Третьей Эллинской Цивилизации придет от самой Первой Эллинской Цивилизации. Два могущественных деятеля, выражающих два совершенно разных мнения: фашистское будущее [$ROOT.GetNameDef] здесь, на Самосе."
  bftb_greece.217.a:0 "Метаксас должен возглавить наше фашистское королевство!"
  GRE_metaxist_monarchist_fascism_tt:1 "§YГеоргий II§! останется королем, и §YВеликая Греция§! станет доступной для формирования как нация.\nФракция £faction_gre_monarchist §YМонархисты§! станет лояльной."
  bftb_greece.217.b:0 "Меркурис подарит нам империю!"
  GRE_republican_national_socialism_tt:1 "§YГеоргий II§! будет свергнут с престола, и мы сможем осуществить §YНаследие Аргеадов§!. \nФракция £faction_gre_monarchist §YМонархисты§! станет Незначительной."
  bftb_greece.218.t:0 "Анатлийские фашисты восстают!"
  bftb_greece.218.desc:0 "Настал час; в наш самый темный час презренный Георгиос Космидис объявил призыв к оружию и призвал тех, кто верен ЕЕЕ и [$ROOT.GetNameDef], уничтожить нас и оккупантов по другую сторону Эгейского моря. Единственное, что наверняка, - это то, что будущее [$ROOT.GetNameDef] очень неопределенно."

  bftb_greece.218.a:0 "Фашисты не должны решать судьбу [ROOT.GetNameDef]!"
  bftb_greece.218.b:0 "Возможно, мы ошибались; возможно, ЕЕЕ все же может спасти [ROOT.GetNameDef]."
  bftb_greece.220.t:0 "[FROM.GetNameDefCap] Соглашается Содействовать Энозису!"
  bftb_greece.220.desc:0 "Настроение в столице можно было бы описать как "ликующее" после того, как [ROOT.GetLeader] объявил нации, что после стольких лет [ROOT.GetAdjective] мечта об Энозисе с Кипром наконец-то станет реальностью, и все благодаря нашим [FROM.GetAdjective] друзьям. Наши администраторы не теряли времени и отправились на Кипр, чтобы обеспечить максимально плавный переход власти. \n\nЭто действительно великий и исторический день для [ROOT.GetNameDef]. Кипр всегда был частью [ROOT.GetAdjective] коллективного сознания, и теперь они наконец-то вернулись в лоно той цивилизации, из которой они произошли."
  bftb_greece.220.a:0 "Наконец-то вместе!"
  bftb_greece.221.t:0 "Гераклейская Конвенция - [FRA.GetAdjective] Получают Мандат!"
  bftb_greece.221.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [FRA.GetNameDef] был предоставлен мандат в Курдистане после успешного свержения [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники похвалили присутствующих делегатов за их мудрое государственное мышление и уже передали инструкции центральному [FRA.GetAdjective] правительству о начале планирования создания администрации в этом регионе."
  bftb_greece.221.a:0 "За!"
  bftb_greece.222.t:0 "Гераклейская Конвенция - [FRA.GetAdjective] Отказано в Мандате!"
  bftb_greece.222.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [FRA.GetNameDef] был лишен любой территории в Курдистане после успешного разгрома [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники почти решили покинуть конвенцию полностью, назвав событие фарсом, прежде чем пришли к согласию, что лучше все же иметь возможность влиять на дальнейшее развитие событий, даже если им ничего не было обещано."
  bftb_greece.222.a:0 "Против!"
  bftb_greece.223.t:0 "Гераклейская Конвенция - [ENG.GetAdjective] Получают Протекторат!"
  bftb_greece.223.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ENG.GetNameDef] был предоставлен армянский протекторат, вырезанный из остатков побежденного [TUR.GetName]. [ENG.GetAdjective] чиновники похвалили присутствующих делегатов за их мудрое государственное мышление и уже передали инструкции центральному [ENG.GetAdjective] правительству о начале планирования создания администрации в этом регионе."
  bftb_greece.223.a:0 "За!"
  bftb_greece.224.t:0 "Гераклейская Конвенция - [ENG.GetAdjective] Отказано в Марионетке!"

  bftb_greece.224.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ENG.GetNameDef] было отказано в праве создавать любое армянское марионеточное государство на севере [TUR.GetNameDef]. Представители [ENG.GetAdjective] осудили это решение и назвали всю конвенцию хаотичной, но решили, что предпочтут оставаться в состоянии влияния на дальнейшие действия, даже если им ничего не гарантировано."
  bftb_greece.224.a:0 "Против!"
  bftb_greece.225.t:0 "Гераклейская конвенция - [ITA.GetAdjective] получают свои территории!"
  bftb_greece.225.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ITA.GetNameDef] были предоставлены колонии, выделенные из останков побежденной [TUR.GetName]. [ITA.GetAdjective] чиновники аплодировали присутствующим делегатам за их справедливое решение по этому вопросу, и многие члены [ITA.GetAdjective] делегации уже поспешили домой, чтобы сообщить [ITA.GetLeader] эту новость."
  bftb_greece.225.a:0 "За!"
  bftb_greece.226.t:0 "Гераклейская конвенция - [ITA.GetAdjective] отказано в получении территорий!"
  bftb_greece.226.desc:0 "Большинство присутствующих делегатов проголосовало за то, чтобы [ITA.GetNameDef] было отказано в праве создавать какие-либо колонии на юге [TUR.GetNameDef], и осудили само предложение как еще более нелепую [ITA.GetAdjective] военную пропаганду. [ITA.GetAdjective] чиновники атаковали это решение и использовали всю ситуацию, чтобы проиллюстрировать, как это еще одно доказательство того, что [ITA.GetAdjective] народ прав, веря в «vittoria mutilata». Независимо от их личных взглядов на этот вопрос, [ITA.GetAdjective] делегатам было приказано оставаться в составе конвенции - несомненно, в надежде, что они смогут повлиять на вердикт по последнему и самому важному пункту повестки дня."
  bftb_greece.226.a:0 "Против!"
  bftb_greece.227.t:0 "Пограничные стычки [GRE.GetAdjective] с [TUR.GetNameDef] обостряются"
  bftb_greece.227.desc:0 "Нападение [GRE.GetAdjective] на [341.GetName] провалилось, как и ожидалось, и по мере обострения конфликта в Эгейском море у нас появилась идеальная возможность вмешаться от имени [GRE.GetNameDef]. Мы должны переместить наши войска на Кавказ, чтобы сидеть на границе с [TUR.GetAdjective]. Когда [GRE.GetAdjective] подадут сигнал, мы зажмем [TUR.GetAdjective] войска и спровоцируем легитимную войну."
  bftb_greece.227.a:0 "Мы будем готовы."
  bftb_greece.228.t:0 "[SOV.GetAdjective] потерпели поражение"
  bftb_greece.228.desc:0 "В нашу столицу поступили поразительные новости: непобедимые армии [SOV.GetNameDef] не смогли прорвать линии [TUR.GetAdjective]. Они не будут помогать нам с вторжением, они отменили все свои планы и наступление и дали [TUR.GetAdjective] безнаказанность, чтобы судить нас по своему усмотрению."
  bftb_greece.228.a:0 "Это не сулит ничего хорошего..."
  bftb_greece.229.t:0 "[GRE.GetNameDefCap] призывает нас выполнить обещание"

  bftb_greece.229.desc:0 "[GRE.GetNameDefCap] начала войну с [TUR.GetNameDef] и призвала нас на помощь, как мы и обещали. Обещанные выгоды значительны, и всегда есть возможность попросить больше, но, возможно, мы больше не в состоянии выполнить свои обязательства — даже если это означает отказ от наших претензий."
  bftb_greece.229.a:0 "На войну!"
  bftb_greece.229.b:0 "Ситуация изменилась."
  bftb_greece.230.t:0 "[FROM.GetNameDefCap] выполняет свои обязательства"
  bftb_greece.230.desc:0 "[FROM.GetNameDefCap] присоединилась к нам в войне против [TUR.GetNameDef], как и обещала. Вместе мы сокрушим [TUR.GetAdjective] государство."
  bftb_greece.230.a:0 "Мы не можем проиграть!"
  bftb_greece.231.t:0 "[FROM.GetNameDefCap] отказывается от своих обязательств!"
  bftb_greece.231.desc:0 "[FROM.GetNameDefCap] отказалась от своего обещания помочь нам и отказалась от своих претензий на [TUR.GetNameDef]! Они предали нас и обесчестили всю нашу борьбу, сделав это. Мы должны надеяться, что у нас хватит сил одержать победу без помощи [FROM.GetAdjective]."
  bftb_greece.231.a:0 "Трусы!"
  bftb_greece.232.t:1 "Появляется Василевс..."
  bftb_greece.232.desc:1 "Чудо снизошло на нашу подавленную нацию: божественное вмешательство, ниспосланное нам с Небес самим святым Юстинианом. Человек в лохмотьях был найден без сознания на побережье горы Афон, где его спасли от верной смерти верные хранители святого места. Личность, поначалу отвергнутая властями, которые арестовали его как сумасшедшего, который пешком добрался до [ROOT.GetNameDef] из Германии, на самом деле была опознана одним из наших собственных академиков EEE как давно потерянный потомок династии Комнинов.\n\nДолгое время нас мучил вопрос, кто должен возглавить наше Византийское государство, и, похоже, сам Бог дал нам свое решение. Византийский наследник не говорит ни слова по-гречески, но его наверняка можно обучить! Поистине, [ROOT.GetNameDef] благоволит Божественный промысел."
  bftb_greece.232.a:1 "Да здравствует Василевс Адольф I!"
  bftb_greece.232.b:0 "Э-э, погодите, а что если он просто сумасшедший?"
  bftb_greece.233.t:0 "Иоаннис Метаксас скончался"
  bftb_greece.233.desc:0 "Премьер-министр и диктатор [ROOT.GetNameDef] скончался после продолжительной болезни. Он умер в изгнании, как изгнанник из своей покоренной нации. Хотя он не был особенно любим [ROOT.GetAdjective] народом, он стал символом национального единства и сопротивления в период кризиса. Эммануил Цударос, объединяющая фигура и венизелист, занял место Метаксаса в качестве премьер-министра [ROOT.GetNameDef]."
  bftb_greece.233.a:0 "Война продолжается."
  bftb_greece.234.t:0 "Мегали Идея одобрена"

  bftb_greece.234.desc:0 "До нас дошли слухи с Гераклейской конвенции о том, что ведущие державы, присутствовавшие на ней, одобрили [GRE.GetAdjective] предложение «Мегали Идеи». Это не только угрожает стабильности региона, но и представляет собой серьезный риск развязывания полномасштабной войны между [GRE.GetNameDef] и [TUR.GetNameDef] в недалеком будущем.\n\nНельзя исключать возможности того, что [GRE.GetNameDef] получит военную поддержку от [FRA.GetNameDef] или [ENG.GetNameDef], и, учитывая наши нынешние военные обязательства перед [TUR.GetNameDef], мы можем оказаться на стороне, враждебной обеим, если не обеим, этим великим державам. Наши военные лидеры настоятельно рекомендуют нам помнить об этом и пересмотреть наши обязательства по защите [TUR.GetNameDef]."
  bftb_greece.234.a:0 "Турки должны выживать сами."
  bftb_greece.234.b:0 "Мы стоим на страже своих гарантий, несмотря ни на что!"
  bftb_greece.235.t:0 "[ROM.GetName] отзывает гарантии"
  bftb_greece.235.desc:0 "Гераклейская конвенция глубоко взволновала наших [ROM.GetAdjective] гарантов. Чтобы не рисковать войной с крупными европейскими державами, они решили отозвать свои обещания оказать военную помощь в нашей защите."
  bftb_greece.235.a:0 "Трус!"
  bftb_turkey.1.t:0 "Монтрёская конвенция"
  bftb_turkey.1.desc:1 "Президент [TUR.GetLeader] сообщил нам, что [TUR.GetNameDef] готовится к ремилитаризации турецких проливов. [TUR.GetAdjective] правительство хотело бы, чтобы мы поддержали их претензии на свои территориальные воды и изменили Лозаннский договор, чтобы предоставить им законные основания для поддержания этих претензий.\n\nПоддержка [TUR.GetAdjective] претензий на турецкие проливы, безусловно, вызовет к ним симпатию, и это может открыть возможность для [TUR.GetNameDef] оспорить [ITA.GetNameDef] в Средиземном море. Однако втягивание в этот кризис может также поставить нас на противоположную сторону от [SOV.GetNameDef], что в худшем случае может означать войну."
  bftb_turkey.1.a:0 "Мы поддержим турок в этом вопросе."
  bftb_turkey.1.b:0 "Британская империя не заботится о Турции."
  TUR_britain_backs_turkey_tt:0 "\nМы будем поддерживать §Y[TUR.GetNameDef]§! на том основании, что они должны иметь право регулировать проход через §YТурецкие проливы§!. \n\n§RМы получим возможность отозвать нашу поддержку, если война между §Y[TUR.GetNameDef]§! и §Y[SOV.GetNameDef]§! внезапно станет вероятной.§!"
  TUR_britain_unentangles_itself_tt:0 "\nМы оставим §Y[TUR.GetNameDef]§! на милость §Y[SOV.GetNameDef]§!. Вероятно, §YТурецкие проливы§! останутся открытыми для неограниченного морского трафика со всех уголков мира."
  bftb_turkey.2.t:0 "[ENG.GetName] оказывает поддержку"

  bftb_turkey.2.desc:0 "[ENG.GetLeader] выступил с заявлением, в котором объяснил, что [ENG.GetNameDef] намерен поддержать нас в нашей цели вернуть себе контроль над нашими проливами. Получение поддержки [ENG.GetNameDef] — это большая победа для нас, и это во многом укрепляет нашу легитимность по всему миру."
  bftb_turkey.2.a:0 "Теперь мы ждем ответа от [SOV.GetNameDef]."
  bftb_turkey.3.t:0 "[ENG.GetName] отказывает нам в помощи!"
  bftb_turkey.3.desc:0 "[ENG.GetLeader] написал длинное письмо [TUR.GetLeader], подробно объяснив, что [ENG.GetNameDef] не может позволить себе ввязываться в иностранный кризис в этот момент времени. [ENG.GetLeader] сослался на отсутствие популярной поддержки войны в [ENG.GetNameDef] и на свой собственный скептицизм по поводу готовности [TUR.GetAdjective] к войне с [SOV.GetNameDef] как на причины, по которым [ENG.GetNameDef] не будет вмешиваться. \n\n[ENG.GetName] признали наш контроль над турецкими проливами, но больше они ничего не сделают."
  bftb_turkey.3.a:0 "Теперь мы ждем ответа от [SOV.GetNameDef]."
  bftb_turkey.4.t:0 "[TUR.GetNameDef] захватывает контроль над Босфором!"
  bftb_turkey.4.desc:0 "[TUR.GetLeader] заявил, что турецкие проливы теперь будут находиться под полным контролем [TUR.GetNameDef], что дает [TUR.GetAdjective] правительству возможность закрыть проливы для нас по своему усмотрению! Это совершенно неприемлемо: это означает, что [TUR.GetAdjective] правительство решило, что имеет право запереть наши собственные флоты в Черном море, когда им захочется."
  bftb_turkey.4.a:0 "Немедленно мобилизовать вооруженные силы!"
  bftb_turkey.4.b:0 "Этот фарсовый цирк нас мало волнует."
  TUR_soviets_oppose_turkey_tt:0 "\n§Y[TUR.GetAdjective]§! правительство либо предложит нам компромиссное решение, либо еще больше обострит ситуацию. \n\n§RУ нас будет возможность деэскалации ситуации, если вооруженный конфликт станет вероятным.§!"
  TUR_soviets_allow_militarisation_tt:0 "§YТурецкие проливы§! будут снова милитаризованы, и §Y[TUR.GetNameDef]§! получит право регулировать все морское движение, проходящее через них."
  bftb_turkey.5.t:0 "[SOV.GetName] выступает против нашей ремилитаризации проливов!"
  bftb_turkey.5.desc:0 "Представители [SOV.GetNameDef] заявили очень четко, что они считают наш односторонний захват турецких проливов незаконным, и что они намерены предпринять крайние меры, чтобы отменить наше решение. Несмотря на давление наших дипломатов, [SOV.GetAdjective] чиновники отказались исключать военное вмешательство в [TUR.GetNameDef], чтобы навязать свою волю. \n\nСохранение существующего статус-кво немыслимо, и даже [SOV.GetNameDef] должен это понимать. Если мы предложим компромиссное решение, которое обеспечит свободный доступ для всех стран Черного моря, то [SOV.GetNameDef] не останется ничего, кроме как принять наше предложение, если они не хотят стать изгоем в мире."

  bftb_turkey.5.a:0 "Мы предложим компромисс."
  bftb_turkey.5.b:0 "Никаких уступок, никакого компромисса - мы сделаем это правильно!"
  TUR_strait_compromise_tt:0 "§Y[SOV.GetNameDefCap]§! и все остальные страны, имеющие побережье в §YЧерном море§!, сохранят свои права на свободный проход через §YТурецкие проливы§!."
  TUR_remaining_defiant_tt:0 "\nМы будем продолжать требовать права регулировать все морские перевозки, проходящие через §YТурецкие проливы§!. \n\n§RЭто может быть нашим последним шансом деэскалации: если [SOV.GetNameDef] будет настаивать, это приведет к войне!§!"
  bftb_turkey.6.t:0 "[SOV.GetName] Соглашается с Ремилитаризацией Проливов!"
  bftb_turkey.6.desc:0 "[SOV.GetAdjective] правительство выпустило краткое заявление с расплывчатыми намеками на последствия и наказание за нарушение мира, но в частном порядке наши чиновники были уверены, что никакой ответной реакции со стороны [SOV.GetNameDef] не последует. \n\n[TUR.GetLeader] произнес страстную речь в Стамбуле, которая транслировалась по радио на всю страну, провозглашая эту великую победу для [TUR.GetNameDef]. Со стороны народа была проявлена ​​огромная поддержка правительства, и мы можем ожидать празднований по всей стране в честь нашей решающей победы в этом вопросе."
  bftb_turkey.6.a:0 "За мир дома и мир во всем мире!"
  bftb_turkey.7.t:0 "[TUR.GetNameDefCap] Идет на Компромисс по Ремилитаризации Проливов"
  bftb_turkey.7.desc:0 "После долгих переговоров [TUR.GetAdjective] правительство решило взять под свой контроль проливы, но при этом разрешить свободный доступ всем странам, граничащим с Черным морем. Жесткое предложение, выдвинутое [TUR.GetNameDef], оставляет мало места для протеста, и уже было спешно одобрено [BUL.GetNameDef] и [ROM.GetNameDef], что в конечном итоге связывает нам руки в этом вопросе."
  bftb_turkey.7.a:0 "Ну, этот кризис можно считать завершенным."
  bftb_turkey.8.t:0 "Конфликт в Черном море"
  bftb_turkey.8.desc:0 "[SOV.GetName] оспорил план [TUR.GetNameDef] по возвращению контроля над своими проливами, но [TUR.GetNameDef] продолжает оставаться непоколебимым перед лицом угроз [SOV.GetAdjective]. Ситуация грозит перерасти в вооруженный конфликт, поскольку [TUR.GetNameDef] борется за утверждение своего суверенитета, а [SOV.GetNameDef] делает ставку на установление своего господства над регионом. \n\nБаланс сил в наших руках: мы должны решить, хотим ли мы легитимизировать нашу поддержку [TUR.GetNameDef] гарантией независимости, чтобы сдержать Советский Союз, или же отмыть руки от этой ситуации и надеяться, что две страны сами выйдут с того узкого пути столкновения, на который они встали."
  bftb_turkey.8.a:0 "Мы должны поддержать [TUR.GetNameDef] против большевистской тирании."
  bftb_turkey.8.b:0 "Умиротворение [SOV.GetAdjective] ирредентизма - это небольшая цена за мир!"

  TUR_britain_stands_up_for_turkey_tt:0 "\nМы встанем на сторону §Y[TUR.GetNameDef]§!, даже если это приведет к войне. §R[SOV.GetNameDefCap] получит последний шанс деэскалации ситуации!§!"
  TUR_britain_abandons_turkey_tt:0 "\nКогда мы отзовем свою поддержку §Y[TUR.GetNameDef]§!, у §Y[TUR.GetAdjective] правительства§! появится последний шанс деэскалации ситуации."
  bftb_turkey.9.t:0 "[ENG.GetAdjective] Отказываются от нас"
  bftb_turkey.9.desc:0 "Премьер-министр [ENG.GetLeader] публично заявил, что, учитывая растущую напряженность в отношениях между нами и [SOV.GetNameDef], [ENG.GetNameDef] не может позволить себе быть втянутым в то, что было названо "региональным конфликтом". Привлекая [ENG.GetAdjective] потери в Великой войне, [ENG.GetLeader] поддержал политику умиротворения [SOV.GetNameDef]. \n\nОбъявление было встречено с тревогой в Анкаре, и [TUR.GetLeader] осудил трусость [ENG.GetNameDef]."
  bftb_turkey.9.a:0 "Все пропало, мы должны полностью капитулировать перед прихотями [SOV.GetNameDef]."
  bftb_turkey.9.b:0 "Ничего не изменилось, мы должны продолжать выбранный курс."
  TUR_straits_remain_demilitarised_tt:0 "\n§YТуркиские проливы§! останутся демилитаризованными, и мы не будем иметь никакого контроля над морским трафиком, который проходит через §YТуркиские проливы§! пока мы не окажемся в состоянии войны. \n\n§RЭто наш последний шанс деэскалировать ситуацию: если [SOV.GetNameDef] будет настаивать на своем, это приведет к войне!§!"
  TUR_we_remain_committed_tt:0 "\n§R[SOV.GetNameDefCap] получит последний шанс деэскалации ситуации, но если они откажутся, это приведет к войне!§!"
  bftb_turkey.10.t:0 "[TUR.GetAdjective] Остаются Непокорными"
  bftb_turkey.10.desc:0 "Даже перед лицом подавляющей силы [TUR.GetLeader] отказывается уступить в вопросе о [TUR.GetAdjective] правах на Туркиские проливы. Напряженность резко возросла, войска были переброшены вдоль всей [TUR.GetAdjective]-[SOV.GetAdjective] границы. [TUR.GetLeader] назвал кризис "моментом судьбы для [TUR.GetNameDef]" и поклялся, что [TUR.GetNameDef] никогда не сдастся перед лицом [SOV.GetAdjective] тирании."
  bftb_turkey.10.a:0 "Туркиские проливы не стоят полной войны."
  bftb_turkey.10.b:0 "[TUR.GetNameDefCap] должны сдаться нам на коленях!"
  bftb_turkey.11.t:0 "[TUR.GetNameDefCap] Капитулирует перед Нашими Требованиями"
  bftb_turkey.11.desc:0 "[TUR.GetLeader] был тепло встречен в Москве, где он был вынужден под вооруженной охраной подписать новый договор, который фактически лишил [TUR.GetAdjective] права милитаризировать или контролировать Туркиские проливы. [TUR.GetAdjective] Президент был отправлен домой с трубкой, принадлежащей [SOV.GetLeader], в качестве сувенира от его визита в [SOV.GetNameDef]. \n\nУспешное утверждение нашей силы в наших водах является великой победой для нас, и нашим войскам на [TUR.GetAdjective] границе разрешено провести обязательный трехдневный праздничный период, где они должны быть как можно более шумными."

  bftb_turkey.11.a:0 "Мир должен бояться мощи [SOV.GetNameDef]."
  bftb_turkey.12.t:0 "[SOV.GetName] отступает"
  bftb_turkey.12.desc:0 "[SOV.GetLeader] лично позвонил [TUR.GetLeader], где он хладнокровно призвал к смягчению напряженности и похвалил [TUR.GetAdjective] президента за его вклад в борьбу с империализмом. [SOV.GetAdjective] солдаты получили приказ деэскалировать свои действия на [SOV.GetAdjective] границе, и [SOV.GetNameDef] отозвала свои жалобы на захват [TUR.GetName] турецких проливов. \n\n[TUR.GetAdjective] народ, будучи совершенно не заинтересованным в идее большой войны после жестокой Войны за независимость, коллективно вздохнул, когда [TUR.GetLeader] провозгласил нации, что мир в конечном итоге победил, и что [TUR.GetAdjective] суверенитет был навсегда обеспечен благодаря храбрости [TUR.GetAdjective] народа в это время кризиса."
  bftb_turkey.12.a:0 "Мы победили!"
  bftb_turkey.13.t:0 "[TUR.GetAdjective]-[SOV.GetAdjective] война начинается"
  bftb_turkey.13.desc:0 "Шесть часов назад [SOV.GetAdjective] войска начали обстрел [TUR.GetAdjective] стратегических баз в Трабзоне и провозгласили, что они входят в [TUR.GetNameDef], чтобы освободить [TUR.GetAdjective] рабочих в рамках марксистского крестового похода. Предатель, Шефик Хюсню, уже провозгласил создание Турецкой Народной Республики в изгнании, которая, несомненно, останется под контролем [SOV.GetNameDef] в обозримом будущем. \n\n[TUR.GetLeader] вышел на сцену в Стамбуле, где он мрачно объявил, что война пришла в [TUR.GetNameDef], но печальные тона не продлились долго, прежде чем турецкий президент сменил свою риторику: перейдя к огненной речи о том, как [TUR.GetAdjective] народ снова был призван судьбой бороться за свои свободы и независимость. Несмотря на то, что шрамы Войны за независимость еще свежи, [TUR.GetAdjective] народ был воодушевлен и спешит присоединиться к вооруженным силам. \n\nНо как долго может продолжаться этот энтузиазм?"
  bftb_turkey.13.a:0 "...и как долго мы можем продержаться?"
  bftb_turkey.14.t:0 "Начинает формироваться оппозиционное движение"

  bftb_turkey.14.desc:0 "[TUR.GetAdjective] политологи считали, что потребуется несколько недель, чтобы сформировалось законное оппозиционное движение после снятия запрета на политические партии, но все они оказались неправы.  Аднан Мендерес не терял времени и собрал группу единомышленников-традиционалистов, недовольных состоянием религиозной веры в [TUR.GetNameDef] при кемалистах.  В прошлом, когда [TUR.GetAdjective] политическое движение похищалось религиозными фундаменталистами, весь процесс перехода к демократии прекращался, но только не в этот раз: в этот раз [TUR.GetLeader] решил победить это движение фанатиков на выборах в день голосования. \n\nМендерес и его кабал фундаменталистов собрались вместе в том, что они называют «Традиционной группой», которую ЧНР определила как прародителя популистского исламистского движения, планирующего баллотироваться на платформе консерватизма и традиционализма.  Традиционная группа будет проводить агитацию в турецкой сельской местности в течение следующих недель с целью создания базы поддержки, и, как только они соберут достаточно обманутых последователей, они, несомненно, дебютируют свою неизбежную оппозиционную партию."
  bftb_turkey.14.a:0 "Предстоящие выборы станут битвой за душу [TUR.GetName]."
  bftb_turkey.16.t:0 "Традиционная группа мобилизует сельских жителей в попытке увеличить явку избирателей"
  bftb_turkey.16.desc:0 "Традиционалисты Аднына Мендереса в большом количестве прошли по всей стране, призывая религиозных граждан, которые чувствуют себя угнетенными светским правительством, выйти и проголосовать за свою партию на предстоящих выборах.  Сообщения показывают, что, хотя многие из этих избирателей по-прежнему скептически относятся к своим шансам победить кемалистов и в целом цинично относятся к демократии, большинство опрошенных продемонстрировали энтузиазм в отношении Мендереса и его оппозиционного движения."
  bftb_turkey.16.a:0 "Это противоречит Конституции! Прекратите это!"
  bftb_turkey.16.b:0 "Демократическая воля народа должна быть известна."
  bftb_turkey.17.t:0 "Традиционная группа Мендереса обращается к курдским организациям с предложением о союзе"
  bftb_turkey.17.desc:0 "Традиционалисты Аднына Мендереса предприняли широко разрекламированную поездку в [TUR.GetAdjective] Курдистан, где они проповедовали примирение и взаимные интересы, когда дело доходит до состояния веры в [TUR.GetNameDef] сегодня.  Ссылаясь на священные писания, курдские племенные вожди выступили на сцене вместе с должностными лицами оппозиционного традиционного движения и призвали курдов голосовать за Мендереса и его единомышленников на предстоящих выборах, чтобы «вернуть [TUR.GetNameDef] в объятия Всемогущего». "
  bftb_turkey.17.a:0 "Это граничит с государственной изменой!"
  bftb_turkey.17.b:0 "Это сотрудничество может принести плоды в будущем!"
  bftb_turkey.18.t:0 "Обнаружен заговор по совершению мошенничества на выборах в сельских районах"

  bftb_turkey.18.desc:0 "Это печальный день для молодой демократии [TUR.GetNameDef], так как заговор с целью подтасовки результатов будущих выборов в пользу движения оппозиции Аднана Мендереса был раскрыт в некоторых из самых отдаленных провинций [TUR.GetNameDef]. Заговор, в который были вовлечены религиозные лидеры, местные администраторы и даже государственные служащие, был сорван, а заговорщики арестованы. В ходе нашего расследования не было обнаружено никаких доказательств, связывающих Мендереса или его оппозиционное движение с заговором, но наша реакция, безусловно, повлияет на их предвыборную кампанию."
  bftb_turkey.18.a:0 "Судите их всех публично и вынесите им самое суровое наказание!"
  bftb_turkey.18.b:0 "Мы тайно предложим им амнистию и надеемся, что это будет забыто."
  bftb_turkey.19.t:0 "Огромный митинг в поддержку движения Мендереса"
  bftb_turkey.19.desc:0 "Митинг, проведенный Аднаном Мендересом в глубинке страны, собрал толпу, сопоставимую с той, что была на выступлениях Мустафы Кемаля Ататюрка в самом сердце Стамбула. [TUR.GetLeader] был в отчаянии, услышав рассказ о митинге, который прошел без сучка и задоринки, на котором Мендерес объявил о скором представлении своей официальной оппозиционной партии народу. Выступили ряд ораторов, каждый из которых проповедовал важность религии в повседневной жизни и в политике, и все они, по сути, поддерживали идеологию традиционного консерватизма – некоторые из ораторов даже говорили в милых выражениях о давно побежденной Османской империи и халифате! Сам Мендерес выступил последним и говорил гораздо более сдержанно, по сравнению с некоторыми из ораторов, чье выступление он завершал. Мендерес весело изложил своим слушателям достоинства либерализма свободной торговли и воздал должное кемалистам за все, что они сделали для нации, прежде чем разбавить эту похвалу большой критикой. Участники митинга покинули его в восторге, будучи уверенными в своих шансах на победу на выборах.\n\nПреданные кемалисты офицерский корпус обратился к правительству и без обиняков потребовал, чтобы Народно-республиканская партия сделала больше для сдерживания растущего влияния Мендереса и его консервативного популистского движения. Представитель офицерского корпуса заявил, что офицеры страны никогда не будут служить правительству Мендереса, и намекнул на принятие своих собственных крайних мер, если мы не сможем сдержать то, что они считают фундаментальной угрозой кемалистской системе."
  bftb_turkey.19.a:0 "Это темный день для Республики."
  bftb_turkey.20.t:0 "Демократическая партия"

  bftb_turkey.20.desc:0 "Восемь часов назад Аднан Мендерес торжественно объявил о появлении новой и наиболее опасной оппозиционной партии [TUR.GetNameDef] - Демократической партии. Он заявил, что Демократическая партия намерена свергнуть монополию НРП на власть и что страна будет направлена ​​в совершенно новом направлении, подобного которому еще не было. Три столпа партии были представлены ликующей толпе, Мендерес пообещал, что его правительство будет привержено вере, отчизне и свободе - в таком порядке. Еще более удивительным было объявление Мендереса о том, что управляемая ДП [TUR.GetName] будет значительно более интервенционистской, чем любое другое [TUR.GetAdjective] правительство с момента основания нации. \n\nОбъявление вызвало ярость в кемалистских кругах, и [TUR.GetLeader] пообещал своим сторонникам в Стамбуле сегодня, что даже если выборы будут более напряженными, чем считалось первоначально, НРП все равно выйдет из предстоящих выборов, оставаясь правящими лидерами нации."
  bftb_turkey.20.a:0 "Пусть победит лучшая партия!"
  bftb_turkey.21.t:0 "День выборов"
  bftb_turkey.21.desc:0 "Долгожданный день выборов наконец наступил. Мужчины и женщины по всей стране игнорировали плохую погоду и личные болезни, чтобы отправиться к избирательным участкам своего провинции и заполнить бюллетени за предпочитаемую ими партию. Никто не мог предвидеть такой огромной явки, особенно когда переход к демократии казался столь быстрым. Выборы проходили не совсем честно, но любой сторонник демократии почувствовал бы гордость, видя, как так много [TUR.GetAdjective] граждан выходят на голосование на первых свободных выборах в [TUR.GetName]. \n\nГонка была напряженной, и потребовалось значительное время, чтобы подсчитать все голоса и определить окончательный результат. Победителями первых выборов в [TUR.GetNameDef] стали..."
  bftb_turkey.21.a:0 "...Республиканцы!"
  bftb_turkey.21.b:0 "...Демократическая партия!"
  TUR_republican_victory_tt:0 "£faction_tur_kemalist §YCHP§! получит §Yдемократический§! мандат на управление страной."
  TUR_conservative_victory_tt:0 "£faction_tur_traditionalist §YDP§! получит §Yдемократический§! мандат на управление страной."
  bftb_turkey.22.t:0 "[TUR.GetAdjective] гражданская война"

  bftb_turkey.22.desc:0 "После победы на выборах Демократической партии, конфликт внутри [TUR.GetNameDef] стал практически неизбежен. Напряжение между правительством и вооруженными силами с каждым днем после выборов только усиливалось, и теперь, кажется, все достигло своего пика. Офицеры уже захватили контроль над самыми богатыми западными штатами, и считается, что они имеют поддержку населения этих восставших штатов. \n\nНа востоке курдские ополченцы начали организовываться в преддверии вооруженной борьбы с целью получения независимости. Мы были глупцами, думая, что наш союз с курдами продлится долго, но они еще большие дураки, думая, что мы не уничтожим их жалкие попытки вырвать нацию из нашей суверенной земли. \n\nБорьба за душу [TUR.GetNameDef] началась, и мы не можем позволить себе проиграть."
  bftb_turkey.22.a:0 "Фи сабилиллах, мы сражаемся!"
  bftb_turkey.23.t:0 "Саадабадский пакт"
  bftb_turkey.23.desc:0 "[FROM.GetLeader] обратился к [ROOT.GetLeader] с предложением подписать пакт о ненападении, оставляя открытой возможность дальнейшего сотрудничества в будущем. [FROM.GetAdjective] дипломаты усердно трудились над своим предложением, подробно рассказав о взаимосвязи истории и интересов наших двух стран, а затем обратились с искренним призывом к миру между братскими народами. Переговоры проходили приятно, но выбор – подписывать ли нам пакт или нет – в конечном счете остается за нами."
  bftb_turkey.23.a:0 "Конечно, мы подпишем этот пакт дружбы!"
  bftb_turkey.23.b:0 "Мы не родственники, [FROM.GetName]: мы вас не знаем."
  bftb_turkey.24.t:0 "Выбор преемника Ататюрка"
  bftb_turkey.24.desc:1 "Ни один мужчина или женщина никогда не могли бы надеяться приблизиться к мифическим высотам лидерства Мустафы Кемаля Ататюрка, но Отец-Освободитель Турции остается лишь смертным человеком. Мы не стремимся заменить нашего Гази, потому что никто никогда даже не мог бы мечтать приблизиться к нашему мессианскому отцу-основателю, но мы должны выбрать лидера, которому можем доверять, чтобы он следовал по стопам Ататюрка. Он должен воплощать в себе кемалистские ценности и следовать примеру Ататюрка как лидер [TUR.GetNameDef]."
  bftb_turkey.24.a:1 "Целяль Баяр – очевидный кандидат."
  bftb_turkey.24.b:0 "Целяль Баяр – очевидный кандидат."
  bftb_turkey.24.c:0 "Исме́т Иноню́ – достойный преемник Ататюрка."
  bftb_turkey.24.d:0 "Февзи Чакмак – лидер, который нужен [TUR.GetNameDef]."
  bftb_turkey.24.e:0 "Февзи Чакмак станет нашим собственным Франциско Франко."
  bftb_turkey.24.f:0 "Реджеп Пекер – тот, кто объединит фашизм и кемализм."
  bftb_turkey.24.g:0 "Гений Шевкета Сюрреи Айдемира приведет нас к успеху."
  bftb_turkey.24.h:0 "Только Исме́т Иноню́ может внедрить уникальный [TUR.GetAdjective] социализм."
  bftb_turkey.24.i:1 "Казым Орбай возглавит военную хунту, пока мы не найдем свой путь."
  bftb_turkey.24.j:0 "Эм… э… хм… бывший халиф?"
  bftb_turkey.25.t:0 "[TUR.GetName] поднимает вопрос о Хатае"

  bftb_turkey.25.desc:0 "[TUR.GetLeader] написал резко сформулированное письмо с требованием предоставить турецкому населению сирийского государства Хатай их демократическое право на референдум, чтобы народ Хатая мог решить, хочет ли он присоединиться к [TUR.GetNameDef] или оставаться частью Сирии на неопределенный срок. Наша колониальная полиция обнаружила незаконную деятельность на [TUR.GetAdjective] границе, где [TUR.GetAdjective] граждане пересекают границу и устраивают беспорядки в провинции Хатай. Ясно, что [TUR.GetNameDef] планирует исказить результаты референдума, чтобы обеспечить [TUR.GetAdjective] победу, но иметь [TUR.GetNameDef], симпатизирующий нам, безусловно, было бы предпочтительнее, чем альтернатива. Кто может сказать, насколько далеко [TUR.GetLeader] зайдет, чтобы обеспечить интеграцию Хатая в [TUR.GetNameDef]?"
  bftb_turkey.25.a:0 "Мы позволим Хатаю перейти в руки [TUR.GetNameDef]."
  bftb_turkey.25.b:0 "Хатай останется частью Сирии, независимо от [TUR.GetAdjective] желаний."
  bftb_turkey.26.t:0 "[FROM.GetNameDefCap] уступает нам суверенитет над Хатаем"
  bftb_turkey.26.desc:0 "[TUR.GetLeader] выступил с краткой речью в Антакье, приветствуя граждан Хатая в [TUR.GetNameDef], и выразил благодарность [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатая. Несмотря на то, что этот шаг вызвал возмущение у сирийских чиновников, общее настроение в Хатае и [TUR.GetNameDef] в целом было удовлетворением, и многие [TUR.GetAdjective] люди совершили поездки из своих домов в Хатай, чтобы освятить новую провинцию [TUR.GetNameDef] празднованиями и обменом подарками."
  bftb_turkey.26.a:0 "Мы приветствуем вас обратно в лоно, братья и сестры."
  bftb_turkey.27.t:0 "[FROM.GetName] сохраняет твердый контроль над Хатаем"
  bftb_turkey.27.desc:0 "[TUR.GetLeader] возглавил пылкий митинг в Газиантепе, где он осудил угнетение турок за рубежом со стороны [FROM.GetNameDef]. [TUR.GetAdjective] люди были взбудоражены, и в настоящее время между угнетателями Хатая и народом [FROM.GetNameDef] нет любви. Пока Хатай остается вне нашей досягаемости, но мы всегда будем помнить об этом отвратительном предательстве."
  bftb_turkey.27.a:0 "Так или иначе, Хатай будет освобожден и возвращен туда, где ему место."
  bftb_turkey.29.t:0 "Бывшие отказники от военной службы добровольно отправляются на службу"

  bftb_turkey.29.desc:0 "Похоже, наше решение принять подход «Отечество превыше всего» к управлению дало отличные результаты! Мы внезапно наблюдаем огромный приток добровольцев, желающих присоединиться к нашим вооруженным силам со всех концов света. Наше верховное командование почти перегружено, этот ошеломляющий эффект привел к тому, что люди всех религий и языков присоединились, и это почти слишком большая нагрузка для оперативного уровня. \n\nК счастью, мы были хотя бы в некоторой степени готовы к такому повороту событий, и интеграция всех этих бывших уклонистов от призыва прошла более или менее гладко. Наши советники предполагают, что мы можем наблюдать постоянный поток добровольцев в течение довольно долгого времени!"
  bftb_turkey.29.a:0 "Приятно видеть, как так много смелых мужчин и женщин приходят защищать свою страну."
  bftb_turkey.30.t:0 "Компенсация за Оники"
  bftb_turkey.30.desc:0 "Оники находятся в наших территориальных водах и когда-то считались неотъемлемой частью нашей империи. Додеканес, как предпочитают называть их [ENG.GetAdjective] и [GRE.GetAdjective], снова станет нашим, как только [ITA.GetAdjective] сдадут их своим законным владельцам. \n\nПравительственные чиновники составили портфолио того, что мы можем предложить [ITA.GetAdjective] в обмен на острова, так как мы, безусловно, можем ожидать, что они потребуют компенсации - если вообще будут готовы уступить."
  bftb_turkey.30.a:0 "Мы предложим им права на наш хром."
  bftb_turkey.30.b:0 "Мы предложим промышленную компенсацию."
  bftb_turkey.30.c:0 "Предложения о дружбе должно хватить."
  bftb_turkey.31.t:0 "[FROM.GetNameDefCap] предлагает нам эксклюзивные права на ресурсы в [342.GetName]"
  bftb_turkey.31.desc:0 "Правительство [FROM.GetAdjective] обратилось к нам с неожиданным предложением. Они хотели бы предоставить нам сто процентов продукции своих природных руд и металлов в штате [342.GetName] в обмен на Додеканесские острова. \n\nПравительство [TUR.GetNameDef] обычно занималось приобретением земли, а не ее сдачей, но это предложение дает нам собственный источник, из которого мы можем накапливать ресурсы, которые могут быть жизненно необходимы для любой крупномасштабной военной кампании. Мы также должны учитывать, что это ресурсы, к которым мы можем не получить доступ, когда война начнется всерьез. Решение о том, принять ли предложение [FROM.GetAdjective], в конечном счете зависит от нас."
  bftb_turkey.31.a:0 "Мы принимаем права на ваши ресурсы в обмен на Додеканесские острова."
  bftb_turkey.31.b:0 "Мы не отдадим ни дюйма земли! Ни сейчас, ни никогда!"
  bftb_turkey.32.t:0 "[FROM.GetNameDefCap] предлагает нам промышленную помощь в обмен на Додеканес"

  bftb_turkey.32.desc:0 "Правительство [FROM.GetAdjective] обратилось к нам с интересным предложением. [FROM.GetAdjective] предоставили нам портфолио, описывающее историческое и стратегическое значение Додеканеса для [FROM.GetNameDef], а также составили список объектов недвижимости и производственных мощностей, которые они хотели бы продать нам в обмен на острова. \n\nПравительство нашей страны обычно занималось приобретением земель, а не их уступкой, но нельзя отрицать, что дополнительная промышленность может быть очень полезна для [ROOT.GetAdjective] военной машины. В конечном счете, мы должны решить, является ли дополнительное усиление нашей промышленности более ценным для нашей страны, чем Додеканесские острова."
  bftb_turkey.32.a:0 "Подписать контракт; пусть у них будут острова, если они хотят за них платить."
  bftb_turkey.32.b:0 "Мы не уступим ни дюйма земли! Сейчас, никогда!"
  bftb_turkey.33.t:0 "[FROM.GetNameDefCap] запрашивает передачу Додеканесских островов"
  bftb_turkey.33.desc:0 "Правительство [FROM.GetAdjective] направило нам исчерпывающее письмо, подписанное [FROM.GetLeader], подчеркивающее важность связи между нашими двумя нациями и естественную симпатию [FROM.GetAdjective] к нашей стране. Пробиваясь сквозь всю эту болтовню, [FROM.GetAdjective] предложили подписать с нами «Пакт силы» - довольно бессмысленное соглашение, но с подвохом. К письму о дружбе прилагается досье с инструкциями о том, как организовать мирную передачу полномочий между нашими региональными губернаторами и [FROM.GetAdjective] бюрократами, которые ждут, чтобы взять на себя управление Додеканесскими островами. \n\nПравительство нашей страны обычно занималось приобретением земель, а не их уступкой, однако [FROM.GetAdjective] могут стать очень полезными союзниками в конфликте, ограниченном Средиземноморьем. Если вас это волнует, то преимущественно греческое население Додеканесских островов выразило недовольство идеей аннексии [FROM.GetNameDef] их островной цепи как части [FROM.GetAdjective] нации. Но, с другой стороны, у них была очень похожая реакция, когда мы отняли их родину у трупа Османской империи после Великой войны."
  bftb_turkey.33.a:0 "Лучше бы это привело к военному союзу в будущем..."
  bftb_turkey.33.b:0 "Мы не боимся быть названными лицемерами; острова останутся нашими!"
  bftb_turkey.34.t:0 "[FROM.GetNameDefCap] принимает наше предложение!"

  bftb_turkey.34.desc:0 "Оники были возвращены нам властями [FROM.GetAdjective] в обмен на исключительные права на ресурсы в [342.GetName]. Несмотря на то, что чиновники частным образом выразили свое недовольство по поводу вопиющего проявления согласованного колониализма в [342.GetName], многие из этих соображений были заглушены общим волнением по поводу присоединения новейшей провинции [TUR.GetNameDef].\n\n[TUR.GetLeader] совершил личный визит на Родос, где лично заверил угнетенных жителей, что все их проблемы будут услышаны и устранены правительством [TUR.GetAdjective], даже несмотря на то, что на всей цепи островов начал внедряться новый учебный план, сенсационно освещающий исторические и этнические корни островов для [TUR.GetNameDef]."
  bftb_turkey.34.a:0 "Великая победа!"
  bftb_turkey.35.t:0 "[FROM.GetNameDefCap] принимает наше предложение!"
  bftb_turkey.35.desc:0 "Оники были возвращены нам властями [FROM.GetAdjective] в обмен на плоды части нашей развивающейся промышленности. Несмотря на то, что чиновники частным образом выразили свое недовольство по поводу идеи платить за то, что веками принадлежало нам, сталью и потом, многие из этих соображений были заглушены общим волнением по поводу присоединения новейшей провинции [TUR.GetNameDef].\n\n[TUR.GetLeader] совершил личный визит на Родос, где лично заверил угнетенных жителей, что все их проблемы будут услышаны и устранены правительством [TUR.GetAdjective], даже несмотря на то, что на всей цепи островов начал внедряться новый учебный план, сенсационно освещающий исторические и этнические корни островов для [TUR.GetNameDef]."
  bftb_turkey.35.a:0 "Великая победа!"
  TUR_three_factories_sacrificed:0 "Три §Yгражданских фабрики§! удалены."
  bftb_turkey.36.t:0 "[FROM.GetNameDefCap] принимает наше предложение!"

  bftb_turkey.36.desc:0 "К удивлению многих [TUR.GetAdjective] чиновников, Оникские острова были возвращены нам [FROM.GetAdjective] властями в обмен на взаимное подписание договора, который в конечном итоге не обязывает ни одну из сторон соблюдать какие-либо бессмысленные обязательства, содержащиеся в нем. [TUR.GetLeader] совершил государственный визит лично, чтобы подписать так называемый Пакт власти с [FROM.GetLeader], и оба лидера взаимно пообещали развивать отношения между двумя морскими соседями в свете этого исторического обмена территориями. Воодушевление по всей [TUR.GetNameDef] заразительно, и в связи с присоединением новой провинции к [TUR.GetNameDef] было много празднований.\n\n[TUR.GetLeader] лично посетил Родос, где лично заверил долго угнетенных граждан, что все их проблемы будут услышаны и устранены [TUR.GetAdjective] правительством, даже несмотря на то, что на всей цепи островов начал внедряться новый учебный план, сенсационно рассказывающий об исторических и этнических корнях островов в [TUR.GetNameDef].\n\n[GRE.GetAdjective] правительство осудило беспрепятственный обмен территориями и призвало другие великие державы осудить то, что они называют несправедливым и незаконным нарушением суверенитета [GRE.GetAdjective] народа Оникских островов. Международное сообщество, скорее всего, из страха перед отчуждением [TUR.GetAdjective] правительства, в целом хранит молчание по поводу обмена территориями."
  bftb_turkey.36.a:0 "Лучше и быть не могло."
  bftb_turkey.37.t:0 "[FROM.GetNameDefCap] Отвергает наше предложение!"
  bftb_turkey.37.desc:0 "[FROM.GetAdjective] правительство публично заявило, что, несмотря на усилия [TUR.GetAdjective] агитаторов и реваншистов, Додеканесские острова навсегда останутся неотъемлемой территорией [FROM.GetAdjective] государства. [FROM.GetLeader] упомянул [TUR.GetLeader] по имени в своей речи, насмехаясь над тем, что, хотя [TUR.GetLeader] может пользоваться широким уважением в [TUR.GetNameDef], в [FROM.GetNameDef] его широко высмеивали как некомпетентного лидера [FROM.GetAdjective] граждане. [FROM.GetLeader] продолжил называть [TUR.GetNameDef] несостоявшимся государством и подробно описал, как само существование нашего государства является непростительным оскорблением для [FROM.GetAdjective] нации. В своей пространной речи [FROM.GetLeader] не менее тридцати семи раз упоминал невыполненные обещания Севрского договора.\n\n[TUR.GetLeader] назвал позицию [FROM.GetAdjective] 'к сожалению', но выразил надежду, что в будущем появится возможность для дальнейшего дипломатического диалога."
  bftb_turkey.37.a:0 "Ну, это могло быть и лучше."
  bftb_turkey.38.t:0 "[FROM.GetNameDefCap] Предлагает совместные усилия по добыче ресурсов на Кавказе"

  bftb_turkey.38.desc:0 "Правительство [FROM.GetAdjective] признало, что направило геодезистов и старателей в Грузию для оценки добычи руды в результате наших горных работ, и предложило нам портфолио, в котором предлагается способ, с помощью которого обе наши страны могут извлечь больше пользы от совместных усилий по добыче полезных ископаемых. Это, возможно, беспрецедентный феномен, когда государственный деятель признает форму шпионажа, а затем пытается превратить это признание в план по укреплению отношений между нашими двумя странами, но именно в такой ситуации мы сейчас оказались. Никто не может отрицать, что правительство [FROM.GetAdjective] не желает рисковать. \n\nПортфолио [FROM.GetAdjective] всеобъемлющее и тщательное; [FROM.GetAdjective] вскрыли бы и извлекли рудные жилы, которые они нашли, и предоставили бы нам большую часть добычи, одновременно перемещая часть находок в [354.GetName] для собственного использования. Мы, вероятно, не узнаем, что [FROM.GetAdjective] обнаружили, еще много лет, но мы можем использовать планы, присланные нам, чтобы улучшить наши процессы добычи в Грузии для меньшего выхода и без необходимости помощи [FROM.GetAdjective]. Решение о том, работать ли в одиночку или принять предложение о помощи от правительства [FROM.GetAdjective], принимаем мы."
  bftb_turkey.38.a:0 "Давайте работать вместе для нашей взаимной выгоды."
  bftb_turkey.38.b:0 "Они были дураками, думая, что мы примем их вмешательство в наши границы."
  bftb_turkey.39.t:0 "[FROM.GetNameDefCap] Принимает наше предложение"
  bftb_turkey.39.desc:0 "Чиновники [TUR.GetAdjective] хвалят свою собственную хорошую работу, поскольку правительство [FROM.GetAdjective] только что сообщило нам, что они хотели бы реализовать планы совместной добычи металла в Грузии, как это было запланировано в комплексном манифесте, который мы представили им ранее. \n\nГосударственные процессы уже мобилизованы, поэтому, как только руда будет добыта в Грузии, она может быть немедленно подготовлена ​​для транспортировки в [354.GetName], где ее можно будет переработать для нашего собственного использования."
  bftb_turkey.39.a:0 "Дипломатический триумф!"
  bftb_turkey.40.t:0 "[FROM.GetNameDefCap] Отклоняет наше предложение!"
  bftb_turkey.40.desc:0 "По сообщениям, чиновники [FROM.GetAdjective] отреагировали с недоверием на наше предложение добывать руду в Грузии с разрешения правительства [FROM.GetAdjective]. Наша просьба была осмеяна, и, возможно, что еще более оскорбительно, [FROM.GetAdjective] используют некоторые из планов, которые мы представили в нашем портфолио, чтобы добывать руду, которую мы нашли, без нас."
  bftb_turkey.40.a:0 "Эти ублюдки!"
  bftb_turkey.41.t:0 "[FROM.GetNameDefCap] Приглашает нас в [FROM.GetFactionName]"

  bftb_turkey.41.desc:0 "Президент [FROM.GetNameDef] [FROM.GetLeader] возглавил инициативу по официальному преобразованию Балканского пакта в более масштабный и всеобъемлющий стратегический альянс под названием Балканская Антанта. Всем членам Балканского пакта было предложено присоединиться к [FROM.GetFactionName], в том числе и нам.\n\nОфициальные лица [FROM.GetNameDef] заверили, что отношения, установленные между странами в [FROM.GetFactionName], выйдут далеко за рамки чисто военных вопросов, и уже опубликовали сводки планов по совместному развитию наших денежных систем, наших оборонительных стратегий и многого другого."
  bftb_turkey.41.a:0 "Объединенные, мы можем защитить Балканы."
  bftb_turkey.41.b:0 "Эта инициатива - безрассудная иллюзия, рожденная из [FROM.GetAdjective] шовинизма."
  bftb_turkey.42.t:0 "[FROM.GetNameDefCap] присоединяется к [ROOT.GetFactionName]!"
  bftb_turkey.42.desc:0 "[FROM.GetLeader] объявил, что [FROM.GetNameDef] решил ратифицировать и присоединиться к [ROOT.GetFactionName]. По случаю объединения судеб наших двух наций, когда неизбежно разразится конфликт, прошли грандиозные торжества и два подряд государственных праздника."
  bftb_turkey.42.a:0 "Вместе мы спасем Балканы."
  bftb_turkey.43.t:0 "[FROM.GetNameDefCap] отклоняет призыв присоединиться к [ROOT.GetFactionName]!"
  bftb_turkey.43.desc:0 "[FROM.GetLeader] сообщил нам, что [FROM.GetNameDef] не присоединится к [ROOT.GetFactionName]. Разочарование наших дипломатов и правительственных чиновников безмерно, а уход [FROM.GetNameDefCap] из Балканского пакта и отказ от участия в [ROOT.GetFactionName] поставил под угрозу весь проект."
  bftb_turkey.43.a:0 "Солидарность могла бы нас спасти, вместо этого наше разединение может нас уничтожить."
  bftb_turkey.44.t:0 "Петровское предложение"
  bftb_turkey.44.desc:0 "Мы получили от [FROM.GetNameDef] оборонительный план, предлагающий, чтобы [FROM.GetAdjective] правительство взяло на себя ответственность за защиту наших владений на Леванте. [FROM.GetLeader] утверждает, что географическая близость [FROM.GetNameDef] делает защиту и администрирование этих территорий простым делом, и что передача этих территорий [FROM.GetNameDef] освободит наши собственные ресурсы для перенаправления в другое место.\n\nПредложение не лишено смысла, но оно ставит нас в… интересное положение. Мы захватили Палестину, Иорданию и Синай у побежденной Османской империи: готовы ли мы вернуть их [FROM.GetAdjective] преемникам Османской империи? Отложив в сторону исторические соображения, мы должны также подумать о том, как может отреагировать [FROM.GetAdjective] правительство, если мы откажем им. Они могут интерпретировать наш отказ как знак того, что мы им не доверяем или что мы не ценим их место в этом альянсе. [FROM.GetNameDefCap] в прошлом проявлял непредсказуемость, и, к сожалению, мы не можем быть уверены, что [FROM.GetAdjective] власти не обострят ситуацию, если мы им откажем."

  bftb_turkey.44.a:0 "План стратегически верен!"
  bftb_turkey.44.b:0 "Османская империя рухнула не просто так."
  bftb_turkey.45.t:0 "$FROM.GetAdjective$ Дают Согласие на Предложение Петры"
  bftb_turkey.45.desc:0 "Колониальные офицеры $FROM.GetAdjective$ уже покидают свои посты и переезжают в соседние протектораты, чтобы обеспечить беспроблемное поглощение бывших колоний $FROM.GetAdjective$. $FROM.GetLeader$ написал письмо нашему президенту, объяснив, что $ROOT.GetNameDef$ имеет полное доверие $FROM.GetNameDef$ к нашей способности защищать и управлять провинциями, переданными нам. \n\nМногие граждане $ROOT.GetAdjective$ видят передачу земель как великую победу и подтверждение того, что $ROOT.GetNameDef$ вновь стала сильной региональной державой, уважаемой во всем мире."
  bftb_turkey.45.a:0 "Теперь мы в большой лиге."
  bftb_turkey.46.t:0 "$FROM.GetAdjective$ Отклоняют Предложение Петры"
  bftb_turkey.46.desc:0 "Премьер-министр $FROM.GetLeader$ из $FROM.GetNameDef$ заявил, что передача $FROM.GetAdjective$ территорий в Леванте $ROOT.GetNameDef$ была бы немыслимым поступком, и предупредил, что мудрость требует продолжения $FROM.GetAdjective$ управления в регионе. $FROM.GetAdjective$ силы в Леванте даже приведены в состояние повышенной готовности, чтобы обеспечить быстрое пресечение любого неожиданного вторжения $ROOT.GetAdjective$ в регион. \n\nВ частном порядке многие наши правительственные чиновники выразили разочарование решением $FROM.GetAdjective$, назвав отказ от нашего предложения доказательством того, что $FROM.GetAdjective$ не доверяют нам как союзникам. $ROOT.GetLeader$ также выразил свое неодобрение решению $FROM.GetAdjective$ и попросил советников представить варианты действий в ответ."
  bftb_turkey.46.a:0 "Мы пытались, и потерпели неудачу. Больше ничего сделать нельзя."
  bftb_turkey.46.b:0 "Мы должны обострить ситуацию!"
  bftb_turkey.47.t:0 "$FROM.GetNameDefCap$ Выражает Обеспокоенность Защитой Персидского Залива"
  bftb_turkey.47.desc:0 "Президент $FROM.GetNameDef$ $FROM.GetLeader$ связался с нами по поводу безопасности наших колоний в Персидском заливе. Лидер $FROM.GetAdjective$ предложил, чтобы $FROM.GetNameDef$ взяла на себя ответственность за оборону и администрацию всего региона, учитывая историю и близость $FROM.GetNameDef$ к региону. \n\nНекоторые чиновники $ROOT.GetAdjective$ выразили тревогу по поводу этого предложения, учитывая, что $FROM.GetNameDef$ совсем недавно просила взять под контроль регион Леванта. Аналитики опасаются, что эти дипломатические захваты земель были стратегически спланированы $FROM.GetNameDef$ с целью установления нового статус-кво для региона, где $FROM.GetNameDef$ является неоспоримой силой над всем субконтинентом. Несмотря на будущие опасения, $FROM.GetNameDef$ остается нашим союзником, и если мы хотим, чтобы они таковыми оставались, было бы разумно уступить их просьбе о контроле над нашими арабскими колониями."

  bftb_turkey.47.a:0 "Посмотрим, готова ли [FROM.GetNameDef] к ответственности."
  bftb_turkey.47.b:0 "Этот неоколониализм недопустим и не будет терпеться."
  bftb_turkey.48.t:0 "[FROM.GetAdjective] Доверяют нам оборону Персидского залива"
  bftb_turkey.48.desc:0 "Транспорты для наших гарнизонов и администраторов уже готовятся к отправке на наши новые территории в двойном Аравийском заливе. [FROM.GetAdjective] отказались от своей власти над регионом и передали нам суверенитет над этими землями для защиты и управления."
  bftb_turkey.48.a:0 "Мы действительно стали великой державой."
  bftb_turkey.49.t:0 "[FROM.GetAdjective] отказывают нам в аравийских территориях"
  bftb_turkey.49.desc:0 "Посол [FROM.GetAdjective] назвал планы [ROOT.GetAdjective] по захвату [FROM.GetAdjective] территорий в Аравии 'неприемлемыми' и потребовал немедленно прекратить этот вопрос. Наши эксперты по обороне разочарованы тем, что нам не дали права управлять [FROM.GetAdjective] аравийскими территориями, но [FROM.GetAdjective] чиновники настаивают на том, что, пока [ROOT.GetNameDef] остаётся частью [FROM.GetFactionName], мы сохраняем права на швартовку и базирование на этих территориях."
  bftb_turkey.49.a:0 "К сожалению."
  bftb_turkey.50.t:0 "[FROM.GetNameDefCap] запрашивает лёгкие танки"
  bftb_turkey.50.desc:0 "Чиновники из [FROM.GetNameDef] обратились к нам с заявленным желанием приобрести лёгкие танки из нашего арсенала. Выражая восхищение тем, что они назвали '[ROOT.GetAdjective] гением' и 'отличным дизайном', [FROM.GetAdjective] чиновники сообщили нам, что [FROM.GetNameDef] просто необходима [ROOT.GetAdjective] броня для защиты своего суверенитета."
  bftb_turkey.50.a:0 "Мы отправим им некоторые из наших лучших!"
  bftb_turkey.50.b:0 "Отправим им некоторые из наших более стандартных бронированных машин."
  bftb_turkey.50.c:0 "Они могут получить некоторые из наших старых моделей."
  bftb_turkey.50.d:0 "[FROM.GetNameDefCap] ничего не получит от нас."
  bftb_turkey.51.t:0 "[FROM.GetNameDefCap] отправляет улучшенные лёгкие танки!"
  bftb_turkey.51.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их собственных складов! Броня современная, и ранние испытания показали, что это очень универсальные машины. Без сомнения, они хорошо послужат нашим вооружённым силам."
  bftb_turkey.51.a:0 "Какой неожиданный сюрприз!"
  bftb_turkey.52.t:0 "[FROM.GetNameDefCap] отправляет лёгкие танки"
  bftb_turkey.52.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их собственных складов! Лёгкая броня немного устарела, но всё ещё довольно прочная, судя по нашим тестам качества. Без сомнения, они хорошо послужат нашим вооружённым силам."
  bftb_turkey.52.a:0 "Большое подспорье."
  bftb_turkey.53.t:0 "[FROM.GetNameDefCap] дарит устаревшую броню"

  bftb_turkey.53.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их собственных складов! Броня, несомненно, устарела, и [FROM.GetAdjective]s, вероятно, вывели эту модель из эксплуатации из-за множества ее недостатков. Тем не менее, наши вооруженные силы найдут для них применение… как-нибудь."
  bftb_turkey.53.a:0 "Если это было достаточно хорошо для 1922 года, то и сейчас сойдет!"
  bftb_turkey.54.t:0 "[FROM.GetNameDefCap] Не Посылайте Нам Ничего"
  bftb_turkey.54.desc:0 "[FROM.GetAdjective]s отказались отправить нам даже шасси от своей самой старой модели. Броня [FROM.GetAdjective]s, по-видимому, предназначена только для их собственного использования, а видные деятели в [FROM.GetNameDef], как утверждается, сослались на соображения национальной безопасности как на причину отказа предоставить нам какую-либо броню."
  bftb_turkey.54.a:0 "Танки, скорее всего, все равно сломались бы."
  bftb_turkey.55.t:0 "Честерская Концессия"
  bftb_turkey.55.desc:0 "В 1923 году вновь образованная Турецкая Республика ратифицировала и утвердила закон, разрешающий нам осваивать нефтяные месторождения и железные дороги [FROM.GetNameDef]. Сенат Соединенных Штатов, учитывая тяжелые последствия Великой Депрессии для американской экономики, решил не ратифицировать этот договор. [FROM.GetNameDef] отменил отмену договора и снова попросил нас выполнить условия концессии, которая изначально была разработана нами. \n\nНельзя отрицать, что в экономическом плане мы находимся в гораздо более безопасном положении, чем в 1923 году, и было бы большим плюсом иметь [FROM.GetNameDef] идеологически и военным образом на нашей стороне. Однако над всем земным шаром нависает война, и даже с нашей позиции силы мы должны быть экономны в том, как мы распределяем наши ресурсы. Доступность нефти в [FROM.GetNameDef] может в будущем стать очень ценным рычагом влияния на [SOV.GetNameDef], но в краткосрочной перспективе мы должны также учитывать возможность того, что эта добытая нефть может попасть в руки наших врагов. Было бы разумно использовать потребность [FROM.GetAdjective]s в нашей помощи для достижения наших собственных целей. В [FROM.GetNameDef] содержится много хрома, в то время как наша страна, к сожалению, им не обладает. Выбор за нами."
  bftb_turkey.55.a:0 "Мы будем помогать всем друзьям демократии."
  bftb_turkey.55.b:0 "Мы будем помогать им... при определенных условиях."
  bftb_turkey.56.t:0 "[FROM.GetNameDefCap] Безусловно Предоставляет Концессию"

  bftb_turkey.56.desc:1 "[FROM.GetNameDefCap] согласились выполнить обещания, данные нам более десяти лет назад, без каких-либо компенсаций. Они использовали свои передовые технологии и обширные промышленные ресурсы для добычи нефти в [350.GetName], которую мы ранее не могли добывать надежно. [FROM.GetAdjective] также оставили в нашем распоряжении часть отрасли, которая использовалась для добычи нефти, чтобы выполнить другие аспекты концессии, которые мы можем использовать по своему усмотрению.\n\nВ качестве дополнительного проявления дружбы, [FROM.GetAdjective] передали нам некоторые из методов и оборудования, которые они использовали в процессе добычи, чтобы мы могли более эффективно использовать природные ресурсы, найденные по всей нашей стране."
  bftb_turkey.56.a:0 "[FROM.GetAdjective] действительно лучшие."
  bftb_turkey.57.t:0 "[FROM.GetAdjective] устанавливают условия концессии"
  bftb_turkey.57.desc:0 "[FROM.GetNameDefCap] согласились выполнить обещания, данные нам более десяти лет назад, но в обмен на компенсацию. Они готовы использовать свои передовые технологии и обширные промышленные ресурсы для добычи нефти в [350.GetName], которую мы не могли добывать надежно, но в обмен [FROM.GetAdjective] хотят получить эксклюзивные права на ресурсы в [343.GetName]. Чтобы сделать предложение более привлекательным, [FROM.GetAdjective] выразили готовность обучить нас некоторым из их передовых методов добычи и предоставить нам схемы некоторых из их более сложных инструментов для раскопок.\n\nЗапрос на концессию должен был быть унижением, но это может оказаться за гранью допустимого. Наша нация должна представлять собой плоды антиимпериализма и антиколониализма, и если мы согласимся с требованиями [FROM.GetAdjective], то мы предадим наши ценности. Тем не менее, можем ли мы позволить себе отказаться от благодеяний, которые может предложить нам [FROM.GetNameDef]?"
  bftb_turkey.57.a:0 "Хорошо, дайте этим имперским ублюдкам то, что они хотят."
  bftb_turkey.57.b:0 "Мы никогда не будем жить под властью [FROM.GetAdjective]!"
  bftb_turkey.58.t:0 "[FROM.GetNameDefCap] выполняют наши требования"
  bftb_turkey.58.desc:0 "Правительство [FROM.GetAdjective] согласилось с каждым нашим требованием в обмен на нашу помощь. Хром уже начал поступать в наши порты из [343.GetName], и что еще лучше, мы действительно узнали кое-что в своих усилиях по добыче нефти на востоке [FROM.GetName]."
  bftb_turkey.58.a:0 "Приятно быть [FROM.GetAdjective]."
  bftb_turkey.59.t:0 "[FROM.GetNameDefCap] отвергают наши требования!"
  bftb_turkey.59.desc:0 "Правительство [FROM.GetAdjective] отклонило наши очень справедливые условия, которые мы выдвинули в обмен на нашу помощь. Если бы правительство [FROM.GetAdjective] было готово внести свою справедливую долю, то все могли бы выйти победителями. Вместо этого, им придется ждать еще несколько лет, прежде чем они смогут добыть какое-либо черное золото."

  bftb_turkey.59.a:0 "Мы - [ROOT.GetNameDef], и мы по-прежнему выходим из ситуации победителями."
  bftb_turkey.60.t:0 "[FROM.GetName] поднимает вопрос о Хатае"
  bftb_turkey.60.desc:1 "[FROM.GetLeader] написал резкое письмо с требованием предоставить турецкому населению сирийского штата Хатай их демократическое право на референдум, чтобы жители Хатая могли решить, хотят ли они присоединиться к [FROM.GetNameDef] или оставаться частью [ROOT.GetNameDef] неограниченное время. Наши вооруженные силы обнаружили незаконную активность на границе [ROOT.GetAdjective]-[FROM.GetAdjective], когда граждане [FROM.GetAdjective] пересекли нашу границу и устроили беспорядки в провинции Хатай. Ясно, что [FROM.GetNameDef] намеревается сфальсифицировать результаты референдума, чтобы обеспечить победу [FROM.GetAdjective], но, возможно, лучший курс действий - просто передать провинцию Хатай [FROM.GetNameDef]. Воюющая [FROM.GetNameDef] на нашей границе - не идеальный сценарий."
  bftb_turkey.60.a:0 "Какой у нас выбор?"
  bftb_turkey.60.b:0 "Если они хотят Хатай, пусть приходят и забирают его трудным путем."
  bftb_turkey.61.t:0 "[FROM.GetNameDef] уступает нам суверенитет над Хатаем"
  bftb_turkey.61.desc:0 "[ROOT.GetLeader] произнес небольшую речь в Антакье, приветствуя граждан Хатая в [ROOT.GetNameDef], и поблагодарил [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатая. Несмотря на то, что этот шаг вызвал возмущение у многих сирийских чиновников во всем политическом спектре, общее настроение в Хатае и [ROOT.GetNameDef] в целом было удовлетворенным, и многие [ROOT.GetAdjective] люди совершили поездки из своих домов в Хатай, чтобы освятить новейшую провинцию [ROOT.GetNameDef] празднованиями и обменом подарками. [FROM.GetLeader] хранит молчание по этому вопросу, но источники, близкие к [FROM.GetAdjective] лидеру, говорят, что [FROM.GetAdjective] считает, что это временное состояние дел, и что Хатай рано или поздно вернется к ним."
  bftb_turkey.61.a:0 "Мы приветствуем вас обратно в наши ряды, братья и сестры."
  bftb_turkey.62.t:0 "[FROM.GetName] сохраняет твердый контроль над Хатаем"
  bftb_turkey.62.desc:0 "[ROOT.GetLeader] возглавил пылкий митинг в Газиантепе, где он осудил угнетение турок за рубежом со стороны [FROM.GetNameDef]. [ROOT.GetAdjective] народ разбушевался, и советники говорят, что среди [ROOT.GetAdjective] населения есть энтузиазм использовать войну как средство исправления этого несправедливого положения дел. То, что [FROM.GetNameDef] думало, что может бросить вызов нашей воле, было чистым безумием - [ROOT.GetNameDef] никогда не позволит себе быть запуганным меньшими силами."
  bftb_turkey.62.a:0 "[FROM.GetNameDef] должна погибнуть."
  bftb_turkey.63.t:0 "[FROM.GetNameDefCap] приглашает нас в [FROM.GetFactionName]"

  bftb_turkey.63.desc:0 "[FROM.GetLeader] встретился с [ROOT.GetLeader] на днях, чтобы договориться о всеобъемлющем пан-средиземноморском альянсе, имеющем единую позицию по кризисам, требующим военного вмешательства. Существует мнение, что добровольное участие [FROM.GetNameDef] в альянсе может придать больше легитимности нашим региональным целям, даже если это означает, что нам придется отказаться от поддержки крупных держав. Мы должны также учитывать, что, в отличие от нас, у [FROM.GetNameDef] на самом деле довольно положительная репутация среди стран Балкан и Средиземноморья. Они могут использовать эту благоприятную репутацию, чтобы дипломатическим путем завоевать поддержку стран, которые в противном случае могли бы не иметь ничего общего с нами.\n\nМы стоим на распутье: используем ли мы оливковую ветвь, протянутую нам [FROM.GetNameDef], и используем их перо, чтобы заточить наш меч против других великих держав, или же мы обратимся к презренным тевтонам и покончим со всеми этими меньшими державами, тянущимися к нам, как с сорняками в саду? Только мы в силах решать судьбы стран Балкан - мы можем спасти их от [GER.GetAdjective] и [SOV.GetAdjective] гегемонии, или мы можем помочь этим державам и ускорить гибель наших соседей. Выбор за нами."
  bftb_turkey.63.a:0 "Мы все еще можем искупить себя, спасая других."
  bftb_turkey.63.b:0 "Этот мир холодный и безжалостный, и мы тоже."
  bftb_turkey.64.t:0 "[FROM.GetNameDefCap] присоединяется к [ROOT.GetFactionName]"
  bftb_turkey.64.desc:0 "[FROM.GetLeader] с помпой объявил своей нации, что душа и судьба [FROM.GetNameDef] теперь связаны с [ROOT.GetNameDef] на грандиозной церемонии с большим размахом. [ROOT.GetLeader] объявил то же самое, но гораздо более сдержанно.\n\n[ROOT.GetAdjective] чиновники надеются, что, объединив [FROM.GetNameDef], они смогут, надеюсь, держать их более экспансионистские тенденции на поводке, а их статус великой державы использовать для защиты малых стран Средиземноморья от гегемоний, которые стремятся поглотить их целиком."
  bftb_turkey.64.a:0 "Мы должны поторопиться, чтобы привлечь другие страны к этому пакту."
  bftb_turkey.65.t:0 "[FROM.GetNameDefCap] отвергает членство в [ROOT.GetFactionName]"
  bftb_turkey.65.desc:0 "Мы получили известие, что [FROM.GetNameDef] не будет присоединяться к [ROOT.GetFactionName]. [ROOT.GetAdjective] чиновники разочарованы и более чем немного обеспокоены тем, что это может предвещать для будущего Средиземноморья. [ROOT.GetLeader] в частном порядке призвал правительственных чиновников ускорить процесс подписания в альянс новых членов, чтобы можно было сформировать грозный блок, чтобы противостоять любой возможной [FROM.GetAdjective] иреденте."
  bftb_turkey.65.a:0 "Мы должны поторопиться, чтобы привлечь другие страны к этому пакту."
  bftb_turkey.66.t:0 "[FROM.GetNameDefCap] предлагает план раздела [GRE.GetNameDef]"

  bftb_turkey.66.desc:0 "[FROM.GetNameDefCap] предложил, что, хотя этот курс действий является прискорбным, для национальной безопасности регионы [GRE.GetNameDef] должны быть уничтожены. Наши чиновники с энтузиазмом и всем сердцем согласились с мнениями наших [FROM.GetAdjective] союзников, напомнив им, что это была наша официальная позиция с самого начала. \n\n[FROM.GetNameDefCap] предлагает разделить [GRE.GetNameDef] по географическому принципу: мы получим [185.GetName], [186.GetName] и [182.GetName], тем самым обеспечив наше господство над Восточным Средиземноморьем и Ионическим морем. [FROM.GetNameDefCap] возьмет оставшиеся [GRE.GetAdjective] государства, что гарантирует [FROM.GetAdjective] контроль над Эгейским морем, с которым граничат многие из их государств. \n\nСоглашение по большей части справедливо - справедливее, чем мы могли ожидать в свободной для всех схватке за землю, по крайней мере. Тем не менее, мы давно мечтали добавить [47.Capital.GetName] как главную жемчужину в нашу империю, и этот план, безусловно, положит конец этой амбиции в обозримом будущем. Готовы ли мы отказаться от [47.Capital.GetName] ради мира в Средиземноморье?"
  bftb_turkey.66.a:0 "Справедливое и приемлемое соглашение о будущем [GRE.GetNameDef]."
  bftb_turkey.66.b:0 "Мы должны иметь все!"
  bftb_turkey.67.t:0 "Переворот Золотого Квадрата"
  bftb_turkey.67.desc:0 "Шокирующие новости из [676.GetName], поскольку бывший премьер-министр Рашид Али аль-Гайлани предпринял попытку государственного переворота против правительства [ROOT.GetLeader]. Аль-Гайлани пользуется поддержкой значительной части армии и даже некоторых слоев населения. \n\nСчитается, что иностранное вмешательство сыграло решающую роль в организации и поставках оружия предателям Золотого Квадрата. Из всех государственных акторов, возможно, участвовавших в этом, считается, что [FROM.GetNameDef] сыграл наиболее значительную роль в поддержке фашистской попытки переворота. \n\nЗолотой Квадрат твердо стоит на платформе удаления [ENG.GetAdjective] империалистов силой, обращаясь за помощью к [GER.GetNameDef], и многие из наших людей считают это очень похвальным решением в этом вопросе. Возможно, свободную Аравию можно добиться только с помощью фашизма..."
  bftb_turkey.67.a:0 "Машаллах, мы сражаемся за душу Ирака против фашизма!"
  bftb_turkey.67.b:0 "Только с помощью фашизма возможно наше освобождение."
  bftb_turkey.67.c:0 "Рассейте фашистских тварей."
  bftb_turkey.68.t:0 "Начинается [IRQ.GetAdjective] гражданская война"
  bftb_turkey.68.desc:0 "Наши усилия по разжиганию фашистского переворота в [IRQ.GetNameDef] похоже, окупились. [IRQ.GetAdjective] фашисты теперь сражаются с бывшим правящим правительством за контроль над всей страной, и выиграем мы или проиграем, мы будем в выгодном положении, чтобы установить наш твердый контроль над регионом."
  bftb_turkey.68.a:0 "Пока мы сидим и ждем."
  bftb_turkey.69.t:0 "[IRQ.GetAdjective] фашисты побеждают"

  bftb_turkey.69.desc:0 "Фашисты [IRQ.GetAdjective] завершили разгром последних очагов сопротивления [IRQ.GetAdjective] лоялистов, как мы и предполагали. Они будут слишком слабы, чтобы противостоять нам, когда мы вторгнемся и захватим контроль над их государственными аппаратами."
  bftb_turkey.69.a:0 "Как восхитительно по-макиавеллиевски!"
  bftb_turkey.70.t:0 "Фашисты [IRQ.GetAdjective] терпят неудачу"
  bftb_turkey.70.desc:0 "Фашисты [IRQ.GetAdjective] не смогли свергнуть [IRQ.GetAdjective] лоялистов и вместо этого были разгромлены [IRQ.GetAdjective] армией. Это абсолютный позор, но, как и планировали наши стратеги, мы считаем, что [IRQ.GetNameDef] теперь будет слишком слаба, чтобы противостоять нам, когда наши войска вторгнутся и захватят контроль над их государственными аппаратами."
  bftb_turkey.70.a:0 "Игра была с самого начала подстроена."
  bftb_turkey.71.t:0 "Фашисты [IRQ.GetAdjective] захватывают контроль в [IRQ.GetNameDef]"
  bftb_turkey.71.desc:0 "Фашисты [IRQ.GetAdjective] успешно свергли прежнее правящее правительство и взяли под контроль всю страну. Фашисты [IRQ.GetAdjective] дали понять, что одной из их главных целей является избавление Аравии от [ENG.GetAdjective] влияния любой ценой, и они считают, что [ROOT.GetAdjective] вмешательство - лучший способ достичь этого."
  bftb_turkey.71.a:0 "[IRQ.GetName]? Нас это едва ли касается."
  bftb_turkey.71.b:0 "Они получат нашу полную поддержку."
  bftb_turkey.71.c:0 "Они доказали, что достойны [ROOT.GetFactionName]."
  bftb_turkey.72.t:0 "[FROM.GetNameDefCap] поддерживает нас!"
  bftb_turkey.72.desc:0 "[FROM.GetAdjective]s решили объявить о своей поддержке нашего правительства. Такие заявления невероятно важны для утверждения нашего суверенитета и легитимизации нашей роли как нации, принципиально противостоящей [ENG.GetAdjective] империализму."
  bftb_turkey.72.a:0 "Их храбрость заслуживает похвалы и признания!"
  bftb_turkey.73.t:0 "Фашисты [IRQ.GetAdjective] захватывают контроль в [IRQ.GetNameDef]"
  bftb_turkey.73.desc:0 "Фашисты [IRQ.GetAdjective] успешно свергли прежнее правящее правительство и взяли под контроль всю страну. Фашисты [IRQ.GetAdjective] дали понять, что одной из их главных целей является избавление Аравии от [ENG.GetAdjective] влияния любой ценой, и они считают, что [ROOT.GetAdjective] вмешательство - лучший способ достичь этого."
  bftb_turkey.73.a:0 "[IRQ.GetName] недостойна нашего внимания."
  bftb_turkey.73.b:0 "Ну... мы ведь провозгласили себя Мечом Ислама..."
  bftb_turkey.74.t:0 "[FROM.GetNameDefCap] поддерживает нас!"
  bftb_turkey.74.desc:0 "[FROM.GetAdjective]s решили объявить о своей поддержке нашего правительства. Такие заявления невероятно важны для утверждения нашего суверенитета и легитимизации нашей роли как нации, принципиально противостоящей [ENG.GetAdjective] империализму."
  bftb_turkey.74.a:0 "С [ITA.GetAdjective]s на нашей стороне мы не можем проиграть!"
  bftb_turkey.75.t:0 "Фашисты [IRQ.GetAdjective] национализируют свою нефть!"

  bftb_turkey.75.desc:0 "Шокирующие новости из [IRQ.GetNameDef], где [ROOT.GetAdjective] чиновники, управляющие нефтяными запасами страны, были под конвоем доставлены к [IRQ.GetAdjective] границе и вынуждены были уехать! Не менее тревожна и информация о том, что новое [IRQ.GetAdjective] правительство планирует пригласить [GER.GetAdjective] военные на свою территорию.\n\nКак будто этого было недостаточно, разведка также предполагает, что все это было организовано [FROM.GetNameDef] с целью помощи [GER.GetFactionName]! Мы должны решить, как действовать дальше: [IRQ.GetAdjective] могут занять более нейтральную позицию, если мы уважим их решение захватить нефть, но с другой стороны, мы должны решить, можем ли мы позволить себе возможность того, что эта нефть попадет в руки [GER.GetAdjective]."
  bftb_turkey.75.a:0 "Они – наши союзники в защите священного пламени."
  bftb_turkey.75.b:0 "Эта нефть не должна попасть в руки фашистов!"
  bftb_turkey.75.c:0 "Божественное право королей должно быть защищено."
  bftb_turkey.75.d:0 "Этого было не избежать."
  bftb_turkey.75.e:0 "Это их право как суверенного государства."
  bftb_turkey.76.t:0 "[ENG.GetAdjective] Подчиняются Нам!"
  bftb_turkey.76.desc:0 "[FROM.GetAdjective] передали нам полный контроль над нашими нефтяными месторождениями. Наша независимость принадлежит нам: мы победили империалистов в их собственной игре!"
  bftb_turkey.76.a:0 "Аллаху Акбар, слава [ROOT.GetLeader]!"
  bftb_turkey.77.t:0 "Англо-[GER.GetAdjective] Альянс"
  bftb_turkey.77.desc:0 "Мы стали жертвами ужасного и жестокого поворота судьбы: [ENG.GetAdjective] и [GER.GetAdjective] заключили союз друг с другом! Нам была нужна поддержка [GER.GetFactionName], но коварные [ENG.GetAdjective] нас опередили! \n\nЭто действительно мрачный день в [ROOT.GetAdjective] истории. Мы стоим одни, и никто нас не поддерживает, кроме [TUR.GetAdjective] - которые, скорее всего, испугаются перед лицом совместных усилий [ENG.GetAdjective] и [GER.GetAdjective] по срыву наших планов. Разве мы можем их винить за это? Кто в здравом уме осмелится противостоять такой силе? Рискнем ли мы даже попробовать?"
  bftb_turkey.77.a:0 "Иншалла, европейцы падут под мечом."
  bftb_turkey.77.b:0 "В каком безумном мире мы живем!?"
  bftb_turkey.79.t:0 "[FROM.GetNameDefCap] Просит Возобновления Пакта о ненападении"

  bftb_turkey.79.desc:0 "Исторически сложилось так, что мы поддерживали очень дружественные отношения с [FROM.GetNameDef], так как мы считали друг друга единомышленниками в борьбе с империализмом, однако за последние несколько лет связи между нами стали прохладнее. \n\nВ попытке разрядить обстановку между нашими странами [FROM.GetLeader] предложил возобновить давно забытый пакт о ненападении, который мы подписали много лет назад. Мы должны рассматривать эту оливковую ветвь как знак того, что [FROM.GetNameDef] может быть открыт для более глубокого сотрудничества в ближайшем будущем, однако [ROOT.GetLeader] также не скрывает своего желания захватить турецкие проливы. Мы должны решить, какой вариант предпочтительнее: готовый [FROM.GetAdjective] союзник, или [FROM.GetAdjective] вассал."
  bftb_turkey.79.a:0 "Дружественные связи с [FROM.GetNameDef] могут принести только положительные результаты."
  bftb_turkey.79.b:0 "Увы, у нас есть новые планы на них."
  bftb_turkey.80.t:0 "$OVERLORDADJ$ соглашаются на возобновление пакта о ненападении"
  bftb_turkey.80.desc:0 "Мы рады сообщить, что из [FROM.GetNameDef] пришли хорошие новости - мы получили сообщение о том, что $OVERLORDADJ$ очень положительно отреагировали на наше предложение о возобновлении пакта о ненападении. Наши чиновники уверены, что мы сможем уладить последние детали соглашения до конца недели."
  bftb_turkey.80.a:0 "Великий день для мира."
  bftb_turkey.81.t:0 "$OVERLORDADJ$ отклоняют план о возобновлении пакта о ненападении"
  bftb_turkey.81.desc:0 "Мы получили сообщение о том, что [FROM.GetNameDef] не намерен возобновлять наш старый пакт о ненападении. Напротив, $OVERLORDADJ$ чиновники уже аннулировали наш предыдущий договор, что полностью развеивает любые иллюзии о том, что отношения между нами и [FROM.GetNameDef] будут чем-то иным, кроме как прохладными в ближайшие годы."
  bftb_turkey.81.a:0 "Это может означать только что-то ужасное."
  bftb_turkey.82.t:0 "Запрет на деятельность Турецкой коммунистической партии снят"
  bftb_turkey.82.desc:0 "Изгнанные чиновники Турецкой коммунистической партии были возвращены на родину в [ROOT.GetNameDef] с полным помилованием всех обвинений против них, вынесенных [ROOT.GetLeader]. Чиновники ТКП были тепло встречены некоторыми членами правительства, но отвергнуты более ортодоксальными кемалистами. \n\nХотя [ROOT.GetLeader] лично не приветствовал ни одного из бывших изгнанников, им было предложено открытое приглашение на участие в работе правительства. В конечном счете, решение о том, будут ли какие-либо чиновники ТКП служить в правительстве, остается за самим правительством."
  bftb_turkey.82.a:0 "Нам на самом деле все равно, что они выберут."
  bftb_turkey.83.t:0 "Возвращение Турецкой коммунистической партии"

  bftb_turkey.83.desc:0 "Изгнанные чиновники Турецкой Коммунистической партии были возвращены на родину в [ROOT.GetNameDef], и все обвинения против них были сняты [ROOT.GetLeader]. Чиновники ТКП были тепло встречены некоторыми членами правительства, но отвергнуты более ортодоксальными кемалистами. \n\nИменно на официальном приеме, устроенном [ROOT.GetLeader] в честь возвращения изгнанных, произошел неожиданный переворот. Шефик Хюсню вышел на сцену и объявил о роспуске буржуазного и ревизионистского кемалистского режима в пользу формы правления, более близкой к системе, используемой в Москве. Кемалистские чиновники и офицеры по всей стране были арестованы в течение нескольких часов, и, если верить сообщениям, в этом процессе участвовали [SOV.GetAdjective] исполнители."
  bftb_turkey.83.a:0 "Подожди мину-"
  bftb_turkey.84.t:0 "[FROM.GetNameDefCap] Требует Нашего Покорности"
  bftb_turkey.84.desc:0 "Адские змеи из [FROM.GetNameDef] отправили нам одностороннее требование разоружиться и разрешить присутствие [FROM.GetAdjective] солдат на нашей территории, чтобы они могли «гарантировать безопасность и права [ROOT.GetAdjective] рабочих». Мотив этих нелепых требований ясен: [FROM.GetNameDef] стремится установить полный контроль над нашими делами и суверенитетом. \n\nМы не какая-то никчемная сила без значения в мировых делах, мы — [ROOT.GetNameDef]! Мы не можем позволить себе, чтобы нами манипулировали подобным образом, злобная сила, которая видит в нас лишь жертву. Мы должны искать союзников; наверняка найдется хотя бы одна страна, которая встанет с нами против [FROM.GetAdjective] войны! Но стоит ли возможная цена в [ROOT.GetAdjective] жизнях этого риска?"
  bftb_turkey.84.a:0 "[SOV.GetNameDefCap] будет справедливо посредничать в этом деле."
  bftb_turkey.84.b:0 "Мы демократически голосуем... чтобы обратиться за помощью к другим!"
  bftb_turkey.84.c:0 "Неужели кто-нибудь спасет нас от этой марксистской нечисти!"
  bftb_turkey.84.d:0 "Наши друзья гарантируют нашу безопасность."
  bftb_turkey.84.e:0 "[ROOT.GetAdjective] жизнь прежде всего."
  bftb_turkey.85.t:0 "[FROM.GetNameDefCap] Ищет Посредничества Против [TUR.GetNameDefCap] Агрессии"
  bftb_turkey.85.desc:0 "Чиновники из [FROM.GetNameDefCap] обратились к нам с надеждой, что мы предложим им защиту перед лицом [TUR.GetAdjective] агрессии. [FROM.GetAdjective] представили довольно обширный портфель, объясняющий, почему потеря [FROM.GetNameDef] в [TUR.GetAdjective] сфере влияния была бы очень пагубной для континентального баланса, и страстно защитили свое право на самоуправление в надежде, что мы решим оказать им помощь."
  bftb_turkey.85.a:0 "[TUR.GetNameDefCap] пытается монополизировать коммунизм!"
  bftb_turkey.85.b:0 "[TUR.GetNameDefCap] подвергает опасности континентальный баланс!"
  bftb_turkey.85.c:0 "Красным нельзя позволить безнаказанно бегать."

  bftb_turkey.85.d:0 "[FROM.GetAdjective] конфликты нас не касаются."
  bftb_turkey.86.t:0 "[FROM.GetNameDefCap] гарантирует нашу независимость"
  bftb_turkey.86.desc:0 "Мы получили сообщение о том, что [FROM.GetNameDef] намерен гарантировать нашу независимость перед лицом [TUR.GetAdjective] агрессии. Это большая дипломатическая победа для нас, и, надеюсь, заставит [TUR.GetNameDef] пересмотреть вопиющие требования, которые они выдвинули нам."
  bftb_turkey.86.a:0 "Истинные друзья [ROOT.GetNameDef]."
  bftb_turkey.87.t:0 "[BUL.GetNameDefCap] получает внешнюю поддержку"
  bftb_turkey.87.desc:0 "Подлые [BUL.GetAdjective] нашли себе союзников в своей обреченной попытке обрести независимость! Это осложнение, которого мы определенно хотели избежать. Мы должны решить, готовы ли мы двигаться вперед и использовать силу для утверждения наших требований, или настало время отступить и предотвратить более крупную войну."
  bftb_turkey.87.a:0 "Мы продолжаем движение, несмотря ни на что."
  bftb_turkey.87.b:0 "Это болезненный удар."
  bftb_turkey.88.t:0 "[FROM.GetNameDefCap] отступает!"
  bftb_turkey.88.desc:0 "Ликование можно было бы использовать для описания общего настроения нашего правительства, поскольку мы только что получили известие о том, что [FROM.GetAdjective] правительство и вооруженные силы отступили и теперь призывают к деэскалации. Это огромная победа как для [ROOT.GetAdjective] государства, так и для [ROOT.GetAdjective] народа.."
  bftb_turkey.88.a:0 "Мы победили!"
  bftb_turkey.89.t:0 "Мы не получаем поддержки ни от одного государства"
  bftb_turkey.89.desc:0 "[ROOT.GetLeader] не утешаем после получения ужасной новости о том, что ни одно государство не поддержит [ROOT.GetNameDef] против [TUR.GetAdjective] агрессии. Безразличное отношение других держав ставит нас перед ужасным ультиматумом: стоять и сражаться или сдаться и спасти жизни."
  bftb_turkey.89.a:0 "У нас нет выбора, мы должны сдаться."
  bftb_turkey.89.b:0 "Мы не сдадимся без боя!"
  bftb_turkey.90.t:0 "[BUL.GetNameDefCap] сдается нам"
  bftb_turkey.90.desc:0 "Мы на шаг ближе к мировой революции с новостью о том, что [FROM.GetAdjective] власти отступили и передали полномочия новому кабаллу коммунистических министров, лично отобранных нашими партийными чиновниками для руководства [FROM.GetNameDef]. Контроль над [FROM.GetAdjective] армиями и промышленностью ставит нас в еще более сильное положение как в регионе, так и в Европе."
  bftb_turkey.90.a:0 "Их освобождение теперь завершено."
  bftb_turkey.91.t:0 "[BUL.GetNameDefCap] стоит непокорным"
  bftb_turkey.91.desc:0 "Мы получили неожиданный отчет о том, что [FROM.GetNameDef] стоит непокорным нашим вполне разумным требованиям. [FROM.GetAdjective] правительство могло бы выбрать путь наименьшего сопротивления, вместо этого они решили пройти по пути боли."
  bftb_turkey.91.a:0 "Тогда мы смирим их."
  bftb_turkey.92.t:0 "[FROM.GetName] подписывает Саадабадский пакт"

  bftb_turkey.92.desc:0 "[FROM.GetLeader] был очень воодушевлен, когда ему были представлены наши предложения о договоре о дружбе и пакте о ненападении, и не тратил времени, чтобы ответить нам с их подписями на нашем договоре. С их соглашением мы на шаг ближе к достижению мира дома и мира во всем мире!"
  bftb_turkey.92.a:0 "Ты всегда будешь дорогим другом для [ROOT.GetNameDef]."
  bftb_turkey.93.t:0 "[FROM.GetName] отвергает Саадабадский пакт!"
  bftb_turkey.93.desc:0 "[FROM.GetLeader] написал пространное письмо [ROOT.GetLeader], информируя его, что предложение о договоре о дружбе и пакте о ненападении не стоит бумаги и чернил, на которых оно было задумано. [FROM.GetLeader] продолжил писать, что все, что меньше формального союза между [FROM.GetNameDef] и [ROOT.GetNameDef], просто пустая трата времени, и что они предпочли бы быть освобождены от любых будущих [ROOT.GetAdjective] схем с этого момента. "
  bftb_turkey.93.a:0 "...ты мог просто сказать 'нет'."
  bftb_turkey.94.t:0 "Экономика рушится"
  bftb_turkey.94.desc:0 "[ROOT.GetAdjective] экономисты были в панике, когда валюта страны резко упала в цене, и наша страна стала страдать от симптомов депрессии. Это ужасная трагедия, что наша нация, так умело избежавшая худших последствий Великой депрессии, должна теперь страдать от такой экономической депрессии, когда остальной мир выходит из своих экономических бед. \n\nДоверие к государственным институтам упало до исторического минимума, и народ в целом осознает, что нынешнее [ROOT.GetAdjective] правительство виновато в страданиях страны."
  bftb_turkey.94.a:0 "Нация истекает кровью из-за нашей жадности..."
  bftb_turkey.95.t:0 "Османские офицеры предлагают возможность восстановить султанат"
  bftb_turkey.95.desc:0 "Мы получили предложение от некоторых единомышленников, которые полностью согласны с нами о важности религии в управлении [ROOT.GetAdjective] государством, но мы знаем точно, что эти просители лояльны не только Всевышнему. К нам обратились бывшие офицеры и генералы Османской империи с выбором, который будет иметь далеко идущие последствия для всей нашей истории: они хотят восстановить султана на его троне. \n\nЭто предложение не является полной неожиданностью, так как многие наши министры и избиратели в частном порядке выражали разочарование по поводу краха Османского султаната и с гордостью говорили о своих дружеских отношениях с османскими беженцами, живущими за границей. Без сомнения, наш электорат поддержит наше решение в любом случае, но наше высшее руководство раздираемо противоречиями. К республике и ко всему, что сделал Мустафа Кемаль Ататюрк, испытывают огромное уважение, и если мы подпишем этот пакт с этими османскими призраками, то, несомненно, нанесем смертельный удар по республике Ататюрка. "
  bftb_turkey.95.a:0 "Наша старая слава ждет восстановления..."

  bftb_turkey.95.b:0 "Наша верность Республике и демократии!"
  bftb_turkey.97.t:0 "[FROM.GetNameDefCap] Требует нашего подчинения"
  bftb_turkey.97.desc:0 "Говорят, что история имеет привычку повторяться циклами, но ни один политолог, уважающий себя, не мог предсказать то, что происходит сейчас. Среди многих в правительстве царит чувство дежавю, поскольку мы только что получили посла от [FROM.GetNameDef], и, по-видимому, [FROM.GetLeader] потребовал нашего подчинения.\n\nВся ситуация просто абсурдна! Как на свете такое могло произойти!? Как турецкий народ мог такое допустить? Как мы вообще позволили себе оказаться в таком положении!? Ситуация нелепа, но угроза реальна. Мы должны решить, готовы ли мы снова противостоять [FROM.GetAdjective] угрозе, как мы это делали десятилетия назад, или времена изменились настолько, что мы не осмелимся сопротивляться их непонятным мотивам и рисковать их гневом."
  bftb_turkey.97.a:0 "Подлые османы переоценивают свою мощь!"
  bftb_turkey.97.b:0 "1908 год не был напрасен!"
  bftb_turkey.97.c:0 "Нет смысла сопротивляться османской угрозе."
  bftb_turkey.98.t:0 "[FROM.GetNameDefCap] Уверен в защите своих союзников"
  bftb_turkey.98.desc:0 "[FROM.GetAdjective] отказались подчиниться нашей власти или признать законность наших требований, вместо этого они ищут убежище в объятиях [FROM.GetFactionName], как трусы, какими они и являются. Мы должны решить, готовы ли мы рисковать конфликтом с союзниками [FROM.GetNameDef], или наше триумфальное восхождение придется отложить еще на некоторое время."
  bftb_turkey.98.a:0 "Никто не может противостоять нашей мощи!"
  bftb_turkey.98.b:0 "Мы не можем повторить 1913 год..."
  bftb_turkey.99.t:0 "[FROM.GetNameDefCap] Отступает от своих требований!"
  bftb_turkey.99.desc:0 "Раздражающие и гнилые [FROM.GetAdjective] отказались от своих нелепых требований. Будет любезностью сказать, что они проявили мудрость в своем пересмотренном решении, но это было бы слишком большой честью для администрации [FROM.GetAdjective], чем они когда-либо заслужили. Мир царит между [ROOT.GetNameDef] и [FROM.GetNameDef], по крайней мере, пока..."
  bftb_turkey.99.a:0 "Мы пережили великий кризис!"
  bftb_turkey.100.t:0 "[FROM.GetNameDefCap] Преклоняет колени перед нашей властью!"
  bftb_turkey.100.desc:0 "Мы на шаг ближе к восстановлению былой славы, подчиняя беспринципное [FROM.GetAdjective] государство и приводя его в соответствие с нашими ценностями. По всей стране прошли торжества в честь нашей великой победы."
  bftb_turkey.100.a:0 "Великую войну все еще можно отомстить..."
  bftb_turkey.101.t:0 "[FROM.GetNameDefCap] Остается непокорным"

  bftb_turkey.101.desc:0 "Злые [FROM.GetAdjective]s отказались преклонить колени перед нашим всемогущим и мудрым султаном, и вместо этого решили пойти по пути войны. Если [FROM.GetAdjective]s хотят войны, то они получат ее! Никогда больше не повторится 1913 год!"
  bftb_turkey.101.a:0 "Аллах направляет наш меч."
  bftb_turkey.102.t:0 "Дамасский диктат"
  bftb_turkey.102.desc:0 "Наглые бандиты, управляющие [FROM.GetNameDef], потребовали от нас немедленно передать им территорию Сирии под угрозой войны. Нельзя сказать, что мы были удивлены этим решением [FROM.GetAdjective]s-падальщиков, но от этого наше положение не становится менее шатким. \n\nМы должны решить, готовы ли мы отдать наши земли [FROM.GetAdjective]s в надежде избежать войны, или мы готовы попытаться навсегда отправить [FROM.GetNameDef] в анналы истории, где им и место."
  bftb_turkey.102.a:0 "Игра не стоит свеч."
  bftb_turkey.102.b:0 "Пора навсегда ликвидировать Османское господство."
  bftb_turkey.103.t:0 "[FROM.GetNameDefCap] отвергает нас!"
  bftb_turkey.103.desc:0 "Дураки из [FROM.GetNameDef] отвергли наше вполне разумное требование вернуть нашу бывшую территорию ее законному владельцу. Это оставляет нам только один путь действий: война!"
  bftb_turkey.103.a:0 "Их наглость встретит наш ятаган."
  bftb_turkey.104.t:0 "Наши территории - наши!"
  bftb_turkey.104.desc:0 "Слабаки из [FROM.GetNameDef] продемонстрировали некоторую нехарактерную мудрость, решив вернуть нам Сирию без применения насилия. Мы уже прилагаем все усилия, чтобы интегрировать территорию обратно в наше имперское управление, и столкнулись с перекрестком. \n\nКак ни странно, нас помнят на Леванте в основном как империалистов и иностранцев, которые несправедливо владели территориями, на которых не имели права находиться. Это, конечно, чистейшая чушь - но это ошибочное мнение сохраняется и по сей день. Мы можем получить больше долгосрочной выгоды, если поддержим автономный имперский субъект, который мы можем интегрировать позже, если ситуация этого потребует. С другой стороны, мы также можем просто аннексировать территорию обратно в наш Султанат - это наше божественное право, в конце концов."
  bftb_turkey.104.a:0 "Мы объединим Эйялеты Дамаска и Алеппо!"
  bftb_turkey.104.b:0 "Добро пожаловать обратно в Империю!"

  bftb_turkey.110.t:0 "Мятежники успешно подавлены в [TUR_kurdish_state_event_target.GetName]"

  bftb_turkey.110.desc:0 "Наши вооруженные силы одержали победу после продолжительных боевых действий с сепаратистами в [TUR_kurdish_state_event_target.GetName]. С тех пор в регионе были произведены аресты, и наша армия прилагает все усилия для восстановления порядка в этом районе.\n\nПотери с обеих сторон прискорбны, но общее понимание заключается в том, что ни одна жертва не слишком велика для сохранения единства нашей нации. Выступая по поводу инцидента, правительство объявило о проведении по всей стране дня траура в память о погибших."
  bftb_turkey.110.a:0 "Одна республика, неделимая."
  bftb_turkey.111.t:0 "Повстанцы разгромили наши войска в [TUR_kurdish_state_event_target.GetName]"
  bftb_turkey.111.desc:0 "В [TUR_kurdish_state_event_target.GetName] произошла ужасная катастрофа, наши вооруженные силы вышли из региона после изнурительных боевых действий против сепаратистских повстанцев, действовавших в этом районе.\n\nПравительственные чиновники и наблюдатели верховного командования шокированы и возмущены неожиданным поворотом событий, и призвали к решительной ответной реакции против повстанческих сил, терроризирующих регион. [ROOT.GetLeader] публично не комментировал событие, но в частном порядке призвал военных руководителей подготовить контрнаступление, чтобы отомстить за наши потери в битве."
  bftb_turkey.111.a:0 "Они еще не видели конца нам."
  bftb_turkey.113.t:0 "Фундаменталисты протестуют против производства товаров, запрещенных религией"
  bftb_turkey.113.desc:0 "Удовлетворение свободного рынка всегда было краеугольным камнем кемалистской политики: где есть спрос, мы ожидаем, что кто-то обеспечит предложение. Некоторые слои населения - в основном те, кто исповедует религию - не очень-то комфортны с новой потребительской культурой [ROOT.GetNameDef].\n\nПротесты охватили части страны в знак протеста против производства некоторых продуктов, которые члены нашего общества считают запрещенными их религией. Они никогда не уважали наши мечты о светской [FROM.GetName], и у них, очевидно, все еще возникают проблемы с адаптацией к этой концепции. Тем не менее, умиротворение толпы может быть более легким решением, чем ненужное разжигание конфликта между нашим собственным народом."
  bftb_turkey.113.a:0 "Хорошо, мы уступим в знак уважения к их обычаям."
  bftb_turkey.113.b:0 "Наш прогресс неумолим."
  bftb_turkey.114.t:0 "Фундаменталисты мирно протестуют против политики правительства"

  bftb_turkey.114.desc:0 "Еще один день, еще один протест, возникший из-за религиозных взглядов нашей страны. Последняя волна протестов возникла в [TUR_fundamentalist_state.GetName] в знак протеста против того, что они считают чрезмерным вмешательством правительства в дела, в которые оно не должно вмешиваться. Все это просто абсурдно; мы - правительство, наша работа - вмешиваться в дела наших граждан. \n\nПротесты были мирными, и нам не нужно отвечать на их провокации силой. Фактически, правительственные советники составили список бессмысленных уступок, которые можно сделать, чтобы успокоить массы в [TUR_fundamentalist_state.GetName]. Хотя, если мы уступим фундаменталистам в [TUR_fundamentalist_state.GetName], то фундаменталисты в остальной части страны могут подумать, что они могут избежать ответственности за то же самое. Возможно, было бы лучше отправить армию, чтобы продемонстрировать нашу приверженность нашим основным ценностям."
  bftb_turkey.114.a:0 "Можно предложить некоторые незначительные уступки."
  bftb_turkey.114.b:0 "Рассеять этих непокорных вредителей."
  bftb_turkey.115.t:0 "Фундаменталисты требуют региональной автономии"
  bftb_turkey.115.desc:0 "Напряженность в [TUR_fundamentalist_state.GetName] между религиозными фундаменталистами и правительственными властями, наконец, достигла предела, когда фундаменталисты потребовали региональной автономии и власти управлять в соответствии с собственными законами. Это серьезная эскалация конфликта, который в основном состоял из мирных протестов и беззубой риторики. \n\nВерно, что ситуация в [TUR_fundamentalist_state.GetName] постепенно вышла из-под нашего контроля. Как бы ни было больно об этом думать, если бы мы предоставили им требуемую автономию, по крайней мере, мы бы убрали бунтовщиков из [TUR_fundamentalist_state.GetName] из нашего списка текущих проблем. С другой стороны, даже размышления о подобном поступке могут быть восприняты некоторыми как государственная измена..."
  bftb_turkey.115.a:0 "Это необходимая жертва."
  bftb_turkey.115.b:0 "Пусть спросят наших офицеров, что они думают об этих «требованиях»."
  bftb_turkey.116.t:0 "В [TUR_fundamentalist_state.GetName] началась партизанская атака"

  bftb_turkey.116.desc:0 "Мы получили ужасную новость о том, что один из наших гарнизонов в [TUR_fundamentalist_state.GetName] стал жертвой тщательно спланированной и жестокой партизанской атаки, организованной религиозными фундаменталистами, базирующимися в этом районе. Потери с обеих сторон были значительными, но повстанцы угрожают повторить атаки, если мы не согласимся вывести свои вооруженные силы из региона. \n\nПоистине печально, когда соотечественник убивает соотечественника из-за чего-то столь незначительного, как вера, и тем не менее мы оказались в такой ситуации. Наш офицерский корпус предлагает нанести ответный удар по повстанцам с полной силой армии, чтобы отомстить за наши потери, но некоторые политические деятели настаивают на том, что, возможно, самым безопасным курсом действий было бы временно вывести наши войска из района, пока ситуация не успокоится. Это решение нельзя принимать легкомысленно."
  bftb_turkey.116.a:0 "Ответный удар, в два раза сильнее!"
  bftb_turkey.116.b:0 "Вывести наших солдат."
  bftb_turkey.117.t:0 "Фундаменталисты распространяют свою отравы в [TUR_fundamentalist_state.GetName]"
  bftb_turkey.117.desc:0 "Доклады с места событий свидетельствуют о том, что ячейки религиозных фундаменталистов проникли в [TUR_fundamentalist_state.GetName] в согласованных усилиях, чтобы склонить население к более традиционному образу жизни - который, несомненно, находится в непримиримой оппозиции к нашим светским идеалам. Харизматичные священнослужители и смелые лидеры протестов возглавили движение по обращению населения [TUR_fundamentalist_state.GetName] в свою веру, и до сих пор попытки вытеснить их с помощью мягкой силы оказались безуспешными. \n\nПеред нами стоит дилемма: мы стремимся поддержать волю народа, но если мы не вмешаемся через более прямой курс действий, то почти наверняка потеряем штат в пользу фундаменталистов. Мы снова и снова пытались просвещать население нашей страны, чтобы попытаться заручиться народной поддержкой секуляризма, и все же на каждом шагу фанатики сражались и продолжают сражаться с нами изо всех сил. Мы должны выбрать, готовы ли мы принять волю народа [TUR_fundamentalist_state.GetName], или же наше правительство должно предпринять прямые действия, чтобы сорвать планы фундаменталистов."
  bftb_turkey.117.a:0 "Не жалейте сил, чтобы остановить их."
  bftb_turkey.117.b:0 "Мы должны уступить воле народа..."
  bftb_turkey.118.t:0 "Фундаменталисты полностью захватывают контроль над [TUR_fundamentalist_state.GetName]!"

  bftb_turkey.118.desc:0 "Бедствие! Только что стало известно, что мы потеряли всякую видимость контроля над [TUR_fundamentalist_state.GetName]. Религиозные фундаменталисты-партизаны предприняли скоординированную атаку на все правительственные здания и военные базы в штате таким образом, что у нас было мало времени, чтобы скоординировать ответный удар, прежде чем вся ситуация вышла из-под контроля.\n\nЭто беспрецедентная потеря для нашей страны: врагам государства удалось полностью взять под контроль [ROOT.GetAdjective] суверенную территорию. Вернуть [TUR_fundamentalist_state.GetName] будет дорого, но также дорого позволить ей ускользнуть из-под нашего контроля. У нас нет времени, и мы должны принять решение."
  bftb_turkey.118.a:0 "Ударьте по ним всем, что у вас есть!"
  bftb_turkey.118.b:0 "Нам придется вернуть народ обратно со временем."
  bftb_turkey.119.t:0 "Фундаменталисты в [TUR_fundamentalist_state.GetName] уступают правительству"
  bftb_turkey.119.desc:0 "Наша политика прозрачного диалога и целенаправленного взаимодействия с сообществом окупилась сполна в [TUR_fundamentalist_state.GetName]. Радикалы покинули штат, будучи изгнаны местным населением в фантастической победе для нашего правительства. \n\nНаселение [TUR_fundamentalist_state.GetName] сохраняет свой религиозный характер, но в ходе наших дискуссий с лидерами общин мы поняли, что наши граждане больше не считают принципы правительства принципиально несовместимыми со своими убеждениями. В [TUR_fundamentalist_state.GetName] мы видим, как будет выглядеть будущее [ROOT.GetAdjective] единства."
  bftb_turkey.119.a:0 "Ваше сотрудничество оценено по достоинству."

  bftb_turkey.126.t:0 "[FROM.GetNameDefCap] Предлагает инвестиционный портфель"
  bftb_turkey.126.desc:0 "Представители [FROM.GetNameDef] посетили нашу страну и встретились со многими нашими политиками в надежде получить поддержку для своей инвестиционной схемы. Правительство [FROM.GetNameDef] хотело бы, чтобы мы использовали наши ресурсы для улучшения собственных промышленных мощностей и производства. [FROM.GetAdjective] чиновники намекнули, что, оказывая помощь их стране, мы можем ожидать в будущем помощи со своей стороны в виде военного союза между нашими странами."
  bftb_turkey.126.a:0 "Если им нужна помощь, то пусть ее получат."
  bftb_turkey.126.b:0 "Мы не подпишем их фаустовскую сделку."
  bftb_turkey.127.t:0 "[FROM.GetNameDefCap] Исключает инвестиции как возможность"
  bftb_turkey.127.desc:0 "Мы получили плохие новости от [FROM.GetNameDef]: хотя [FROM.GetAdjective] не испытывают к нам никакой неприязни, нам сообщили, что [FROM.GetNameDef] не будет инвестировать никаких ресурсов в нашу промышленную базу. Чиновники были непреклонны в этом вопросе, и они попросили нас не поднимать этот вопрос с ними снова в обозримом будущем."
  bftb_turkey.127.a:0 "Сожалеем, но понятно."
  bftb_turkey.128.t:0 "[FROM.GetNameDefCap] Делает скромные инвестиции"

  bftb_turkey.128.desc:0 "Недавно мы получили информацию от [FROM.GetAdjective] чиновников о том, что проект, в который они инвестировали, завершен. Наши собственные инспекторы посетили строительную площадку, чтобы убедиться, что все соответствует нашим ожиданиям, и они не были разочарованы. \n\n[FROM.GetAdjective] наблюдатели отметили после завершения проекта, что [FROM.GetNameDef] не прочь спонсировать аналогичные или даже более амбициозные проекты в [ROOT.GetNameDef] в будущем."
  bftb_turkey.128.a:0 "Они оказали нам огромную услугу."
  bftb_turkey.129.t:0 "[FROM.GetNameDefCap] инвестирует в наш легкий промышленный сектор"
  bftb_turkey.129.desc:0 "Недавно мы получили информацию от [FROM.GetAdjective] чиновников о том, что промышленный проект, который [FROM.GetAdjective] спонсировали некоторое время назад, завершен. Наши собственные инспекторы посетили строительную площадку, чтобы убедиться, что все соответствует нашим ожиданиям, и они не были разочарованы. Производство на новом объекте, как ожидается, начнется немедленно. \n\n[FROM.GetAdjective] наблюдатели отметили после завершения проекта, что [FROM.GetNameDef] не прочь спонсировать аналогичные или даже более амбициозные проекты тайного характера в будущем."
  bftb_turkey.129.a:0 "Какие замечательные новости!"
  bftb_turkey.130.t:0 "[FROM.GetNameDefCap] инвестирует в нашу военную промышленность"
  bftb_turkey.130.desc:0 "Недавно мы получили информацию от [FROM.GetAdjective] чиновников о том, что секретный промышленный проект, который [FROM.GetAdjective] спонсировали некоторое время назад, завершен. Наши собственные инспекторы посетили строительную площадку, чтобы убедиться, что все соответствует нашим ожиданиям, и они не были разочарованы. Производство на новом объекте, как ожидается, начнется немедленно. \n\n[FROM.GetAdjective] наблюдатели отметили после завершения проекта, что [FROM.GetNameDef] не прочь спонсировать аналогичные проекты в будущем."
  bftb_turkey.130.a:0 "Они - настоящие друзья [ROOT.GetAdjective]."
  bftb_turkey.131.t:0 "[FROM.GetNameDefCap] соглашается на раздел [GRE.GetNameDef]"
  bftb_turkey.131.desc:0 "Мы пришли к соглашению с [FROM.GetNameDef] о том, как следует проводить раздел [GRE.GetNameDef]. [FROM.GetNameDefCap] получит штаты, граничащие с Восточным Средиземноморьем и Ионическим морем, а мы возьмем [GRE.GetAdjective] сердцевину, которая делит с нами Эгейское море. К сожалению, это стало необходимо, но [GRE.GetNameDef] не оставил нам другого выбора в этом вопросе."
  bftb_turkey.131.a:0 "Всевышний прости нас, но [GRE.GetNameDef] должен быть уничтожен."
  bftb_turkey.132.t:0 "[FROM.GetNameDefCap] отвергает план раздела [GRE.GetNameDef]!"

  bftb_turkey.132.desc:0 "[FROM.GetNameDefCap] отвергли наше разумное предложение о разделе [GRE.GetNameDef] в пользу безумной гонки за землю без учета населения, населяющего эти территории. Нет такой вещи, как «хорошее» вторжение, но, по крайней мере, все могло быть упорядоченным и сдержанным — вместо этого [FROM.GetAdjective] предпочли превратить это вторжение в хаотичную и грязную гонку, чтобы захватить как можно больше земли, прежде чем подчинить [GRE.GetAdjective]. \n\nМы не хотели так поступать; так не должно было быть! Наша репутация испорчена навсегда!"
  bftb_turkey.132.a:0 "Гонка началась!"

  bftb_turkey.133.t:0 "Мустафа Кемаль Ататюрк заболел"
  bftb_turkey.133.desc:0 "Вчера Мустафа Кемаль Ататюрк был доставлен в больницу в тяжелом состоянии после того, как потерял сознание на своей яхте во время встречи с друзьями. Этот эпизод является последним в серии очень тревожных признаков того, что здоровье Ататюрка быстро ухудшается, и советники в частном порядке выразили обеспокоенность тем, что Ататюрк работает слишком много, поскольку его состояние становится все более непредсказуемым. \n\nНесмотря на его заверения, что все в порядке, правительство берет на себя ответственность за наблюдение за здоровьем Мустафы Кемаля Ататюрка и составляет список возможных мер. Если Ататюрк не отступит от своих обязанностей, чтобы позаботиться о своем здоровье, то мы должны рассмотреть возможность принуждения его к отставке, чтобы он мог провести последние месяцы со своей семьей."
  bftb_turkey.133.a:0 "Мы в гонке со временем."
  bftb_turkey.134.t:0 "Смерть Мустафы Кемаля Ататюрка"
  bftb_turkey.134.desc:0 "\nРеспублика скорбит. \n\nВоенный герой, революционер, президент и Отец Турок, Мустафа Кемаль Ататюрк мирно скончался во сне. \n\nНи один мужчина или женщина не могли бы надеяться достичь мифических высот лидерства Мустафы Кемаля Ататюрка, но Отец Турок не хотел бы, чтобы его драгоценная Республика погрузилась в хаос из-за кризиса лидерства. \n\nМы не ищем замену нашему Гази, потому что никто не мог бы даже мечтать сравниться с нашим мессианским отцом-основателем, но мы должны выбрать лидера, которому можем доверять, чтобы он следовал по стопам Ататюрка. Они должны олицетворять кемалистские ценности и следовать примеру Ататюрка как лидер [TUR.GetNameDef]."
  bftb_turkey.134.a:1 "Джелаль Баяр - очевидный кандидат."
  bftb_turkey.134.b:0 "Джелаль Баяр - очевидный кандидат."
  bftb_turkey.134.c:0 "Исмет Иненю — достойный преемник Ататюрка."
  bftb_turkey.134.d:0 "Февзи Чакмак — лидер, который нужен [TUR.GetNameDef]."
  bftb_turkey.134.e:0 "Февзи Чакмак обеспечит этой нации безопасность."
  bftb_turkey.134.f:0 "Реджеп Пекер — тот, кто синтезирует фашизм и кемализм."
  bftb_turkey.134.g:0 "Гений Шевкета Сюрея Айдемира поможет нам пройти через это."
  bftb_turkey.134.h:0 "Только Исмет Иненю может ввести уникальный [TUR.GetAdjective] социализм."

  bftb_turkey.134.i:0 "Казым Орбай возглавит военную хунту, пока мы не найдем свой путь."
  bftb_turkey.135.t:0 "Смерть Мустафы Кемаля Ататюрка"
  bftb_turkey.135.desc:0 "\nРеспублика скорбит. \n\nВоенный герой, революционер, президент и отец турок Мустафа Кемаль Ататюрк мирно скончался во сне. \n\nОн сохранял свою верность турецкому народу и основанной им республике до самого конца. Тысячи скорбящих отдали ему дань уважения в Стамбуле, прежде чем его тело было перевезено на лафете, по морю и по железной дороге в Анкару. Там были проведены государственные похороны с участием всего парламента и высокопоставленных лиц со всего мира.\n\nТеперь, когда отца современной турецкой нации больше нет, Республика должна двигаться дальше. [ROOT.GetLeader] был одним из многих ораторов на похоронах Ататюрка, и в своей речи он пообещал продолжить наследие человека, который сыграл столь важную роль в обеспечении свободы нации."
  bftb_turkey.135.a:0 "Покойся с миром, наш Гази. Мы никогда не забудем тебя."
  bftb_turkey.136.t:0 "Трагедия обрушилась на Османскую королевскую семью!"
  bftb_turkey.136.desc:0 "Бедствие охватило наш гордый Османский султанат, когда известие о внезапной и неожиданной смерти нашего султана дошло до ушей нашей нации. Султан и его сыновья посетили плодородные поля Никсара и отправились в поход по горам Чанык в Самсуне, когда в провинции произошло землетрясение. Тела османских монархов были найдены три дня спустя, что вызвало панику в королевском дворе. \n\nС изменением османских законов о наследовании престола, похоже, что наследницей престола стала старшая дочь султана. Она женщина с сильным характером и невероятными талантами, но многие консервативные элементы наших религиозных институтов могут протестовать против того, чтобы женщина сидела на османском троне."
  bftb_turkey.136.a:0 "Да здравствует новая султана!"
  bftb_turkey.136.b:0 "Женщина!? Неприемлемо! Нам нужен регент!"
  bftb_turkey.137.t:0 "[FROM.GetNameDefCap] принимает опасную внешнеполитическую позицию"
  bftb_turkey.137.desc:0 "Правительство [FROM.GetNameDef] решило изменить свою внешнюю политику: она не соответствует нашим собственным внешнеполитическим схемам. Делегаты от [FROM.GetNameDef] сообщили нашим дипломатам, что не намерены отказываться от своего нынешнего разрушительного курса."
  bftb_turkey.137.a:0 "Они стали тем, кого они клялись уничтожить."
  bftb_turkey.137.b:0 "Они предатели Революции!"
  bftb_turkey.137.c:0 "Возможно, они экспериментируют с социализмом в одной стране?"
  bftb_turkey.137.d:0 "До тех пор, пока они не трогают наших союзников..."
  bftb_turkey.137.e:0 "Им явно больше нельзя доверять."
  TUR_keeping_turkey_under_observation:0 "Мы будем внимательно следить за действиями §Y[TUR.GetNameDef]§! и в будущем исключим их из нашей фракции, если это станет необходимо."
  bftb_turkey.138.t:0 "[FROM.GetNameDefCap] нарушает суверенитет члена фракции!"

  bftb_turkey.138.desc:0 "Как и предсказывали наши эксперты по внешней политике, [FROM.GetNameDef] обратил свои взоры на одного из своих союзников. Мы осудили [FROM.GetAdjective] делегата за безрассудное решение правительства, но оно, похоже, не произвело никакого впечатления."
  bftb_turkey.138.a:0 "У них есть последний шанс. Один."
  bftb_turkey.138.b:0 "Ничего хорошего не может произойти от продолжения покровительства этому государству-изгою."
  bftb_turkey.139.t:0 "[FROM.GetNameDefCap] снова нарушает суверенитет члена фракции!"
  bftb_turkey.139.desc:0 "Бандиты, стоящие во главе [FROM.GetNameDef], снова предали наше доверие. Эта фарсовая игра больше невыносима, мы не можем продолжать заслуживать уважение наших союзников, пока мы покровительствуем стране, которая, по сути, враг."
  bftb_turkey.139.a:0 "Их предупреждали!"
  bftb_turkey.140.t:0 "[FROM.GetNameDefCap] выносит предупреждение"
  bftb_turkey.140.desc:0 "Мы получили предупреждение от правительства [FROM.GetAdjective] не нарушать снова суверенитет члена фракции. Они готовы простить нам наши действия на этот раз, но дальнейшие действия против наших союзников вынудят [FROM.GetNameDef] принять меры."
  bftb_turkey.140.a:0 "Мы делаем то, что нам угодно."
  bftb_turkey.141.t:0 "[FROM.GetNameDefCap] исключает нас из [FROM.GetFactionName]!"
  bftb_turkey.141.desc:0 "Наша новая внешняя политика оказалась неприемлемой для [FROM.GetNameDef], и они решили, что мы больше не можем считаться союзниками. С этого дня мы больше не являемся частью [FROM.GetFactionName]."
  bftb_turkey.141.a:0 "Так тому и быть."

  TUR_downgrade_fundamentalist_defiance_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! будут больше сотрудничать с правительством в §Y[TUR_fundamentalist_state.GetName]§!."
  TUR_upgrade_fundamentalist_defiance_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! усилят интенсивность своего сопротивления правительству в §Y[TUR_fundamentalist_state.GetName]§!."
  TUR_placate_fundamentalist_state_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! прекратят всякую риторику против правительства в §Y[TUR_fundamentalist_state.GetName]§! и теперь призывают к активному сотрудничеству."
  TUR_placate_fundamentalist_state_all_targets_effect_tt:0 "£faction_tur_traditionalist §YТрадиционалисты§!  совместно прекратят свое противодействие правительству."

  bftb_bulgaria_tsar_boris.1.t:0 "Царь Борис III посещает [GetDestinationName]"

  bftb_bulgaria_tsar_boris.1.desc_success:1 "Сегодня царь Борис завершил свой визит в [GetDestinationName], где монарх наслаждался эйфорией местных жителей, собравшихся приветствовать королевскую процессию, проходящую по некоторым из самых знаковых улиц города.\nНо этот визит был не только для удовольствия простых людей; пышные банкеты, грандиозные приемы и встречи с членами высшей местной элиты проходили в течение нескольких дней после прибытия царя.\n\nВ целом визит выполнил свою задачу, укрепив связи с богатейшими членами общества и показав царя простому народу как доброжелательного правителя, близкого к своим подданным."
  bftb_bulgaria_tsar_boris.1.desc_extra_success:1 "Королевский визит в [GetDestinationName] стал полным успехом! После завершения процессии к ратуше для встречи с мэром, царь решил прогуляться по одному из скромных районов [GetDestinationName], чтобы пообщаться с народом.\nГраждане не могли приветствовать Бориса более тепло. Все были рады видеть своего правителя, бродящего по улицам, и более чем несколько человек радостно преподнесли царю скромные подарки: от цветочных венков и местных продуктов до небольших деревянных и железных изделий.\n\nНеясно, всколыхнуло ли это искреннее и скромное приветствие что-то внутри царя или нет, но правда в том, что по этому случаю вместо частных приемов и эксклюзивных садовых вечеринок царь решил устроить большой народный праздник для всех. Само собой разумеется, жители [GetDestinationName] были в восторге от этой идеи, и все вернулись домой поздно и действительно довольными после мероприятия."
  bftb_bulgaria_tsar_boris.1.desc_failure:1 "Королевский визит в [GetDestinationName] стал катастрофическим ударом по популярности царя. Уже с самого начала визита было видно, что среди преимущественно бедных граждан, собравшихся приветствовать процессию, не было большого энтузиазма, и даже среди толпы можно было услышать спорадические освистывания.\n\nСитуация усугубилась, когда граждане организовали народный протест вокруг ратуши, где монарх и его семья наслаждались помпезным приемом и роскошным банкетом в сопровождении самых привилегированных членов общества. Люди критиковали такие пышные демонстрации и обвиняли высшие классы во всех экономических и социальных проблемах, которые обрушились на страну в последние десятилетия.\n\nВ ответ полицейские силы были поставлены задачей немедленно прервать демонстрацию, но применение насилия только ухудшило ситуацию, и демонстрация переросла в беспорядки."
  bftb_bulgaria_tsar_boris.1.a:1 "Когда запланирован следующий визит?"
  bftb_bulgaria_tsar_boris.1.b:1 "Вечер, который они запомнят надолго!"
  bftb_bulgaria_tsar_boris.1.c:1 "Больше никаких пиров на какое-то время..."
  bftb_bulgaria_tsar_boris.2.t:0 "Смерть царя Бориса III"
  bftb_bulgaria_tsar_boris.2.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"

  BUL_context_of_death_basic:2 "После того, как на протяжении недели он страдал от тяжелой болезни, сегодня, [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong], в [BUL.Capital.GetName] от очевидной сердечной недостаточности скончался царь Борис III."
  BUL_context_of_death_assassinated:0 "Несколько часов назад, когда царь Борис III покидал Софийский университет после посещения ежегодного Национального конгресса византийских исследований, к нему быстро приблизился человек, вытащил оружие и несколько раз выстрелил в Бориса, прежде чем был застрелен силами безопасности. Спустя несколько минут и царь Борис III, и его убийца лежали мертвыми."
  BUL_context_of_death_ger:1 "Вскоре после возвращения в [BUL.Capital.GetName] с неожиданно жесткой встречи с [GER.GetLeader] [GetBorisGermanMeetingLocation], царь Борис III скончался от очевидной сердечной недостаточности."
  BUL_boris_german_meeting_location_historical:0 "в Восточно-Прусском военном штабе «Волчье логово» в Растенбурге"
  BUL_boris_german_meeting_location_capital:0 "в [GER.Capital.GetName]"
  BUL_context_of_death_sov:1 "После возвращения царя в [BUL.Capital.GetName] с встречи с [SOV.GetLeader] в [SOV.Capital.GetName], царь Борис III скончался от очевидной сердечной недостаточности."
  BUL_context_of_death_eng:1 "Через неделю после возвращения в [BUL.Capital.GetName] с встречи с [ENG.GetLeader] в [ENG.Capital.GetName], царь Борис III скончался от очевидной сердечной недостаточности."
  BUL_popular_suspicions_about_death_basic:0 "Однако причины смерти до сих пор неясны, и высказываются предположения, что Бориса отравили во время его последней встречи, многие считают, что по приказу [GER.GetLeader]. Другие убеждены, что это был НКВД, который отравил царя. Кто-то указывал на [ENG.GetNameDef], и, как бы это ни было тревожно, некоторые даже осмеливаются утверждать, что само [BUL.GetAdjective] правительство причастно к смерти царя..."
  BUL_popular_suspicions_about_death_assassinated:0 "Служба национальной безопасности начала расследование, чтобы найти виновных в цареубийстве. Согласно официальным данным, преступник владел болгарскими, немецкими и английскими документами, что только усложняет расследование и подогревает спекуляции. Большинство болгар винят [GER.GetLeader], НКВД или [ENG.GetAdjective], но есть и те, кто осмеливается утверждать, что само правительство причастно к убийству царя..."
  bftb_bulgaria_tsar_boris.2.a:0 "Действительно тревожно..."
  bftb_bulgaria_tsar_boris.3.t:1 "Регентский совет"
  bftb_bulgaria_tsar_boris.3.desc:1 "Пришло время назначить членов регентского совета, который будет править [ROOT.GetNameDef] от имени наследника Бориса, Симеона II.\n\nМы должны выбрать самых подходящих кандидатов из числа королевской семьи, высших политических и военных кругов, но мы должны выбирать мудро, потому что каждый из них имеет свою собственную верность, а наша страна уже пережила бедствия и разрушения, вызванные решениями ее лидеров в прошлом..."

  bftb_bulgaria_tsar_boris.3.a:0 "Сформировать про-осевое правительство."
  bftb_bulgaria_tsar_boris.3.b:0 "Сформировать про-союзное правительство."
  bftb_bulgaria_tsar_boris.3.c:0 "Сформировать независимое правительство."
  bftb_bulgaria_factions.10.t:0 "Раскрыт заговор Звено"
  bftb_bulgaria_factions.10.desc:1 "Надежные источники сообщили нам, что некоторые члены Звено, которые уже публично критиковали режим по другим случаям, недавно связались с рядом военных офицеров. Хотя мы не знаем наверняка, для чего были эти встречи или кто были те офицеры, к которым они обращались, нет никаких сомнений в том, что это подозрительное движение со стороны Звено является частью неясной, более крупной схемы..."
  bftb_bulgaria_factions.10.a:0 "Провести дальнейшее расследование!"
  bftb_bulgaria_factions.10.b:0 "Давайте подождем, пока они сделают свой ход..."
  bftb_bulgaria_factions.11.t:0 "Заговорщик Звено разоблачен"
  bftb_bulgaria_factions.11.desc:1 "Проведя тщательное расследование и связавшись с несколькими членами Звено, лояльными режиму, мы обнаружили военный заговор с целью свержения правительства. \nСреди списка людей, связанных с этой конспирацией, всплыло имя одного из наших самых доверенных генералов: [?BUL_zveno_conspirator.GetName].\n\nТеперь мы должны решить, что делать с этим, по-видимому, нелояльным человеком."
  bftb_bulgaria_factions.11.a:0 "Избавиться от него немедленно!"
  bftb_bulgaria_factions.11.b:0 "Мы не должны делать поспешных выводов."
  bftb_bulgaria_factions.12.t:1 "Подготовка к перевороту Звено"
  bftb_bulgaria_factions.12.desc:1 "К нам дошли сведения о том, что Звено, наконец, решилось сделать окончательные приготовления к военному перевороту, который они уже давно осторожно готовили. \nОни попытаются свергнуть правительство, как это было в 1934 году, но на этот раз мы не позволим им добиться успеха, и мы разгромим эту беспокойную организацию раз и навсегда."
  bftb_bulgaria_factions.12.a:0 "Мы разгромим их!"
  bftb_bulgaria_factions.17.t:0 "Звено интегрировано"
  bftb_bulgaria_factions.17.desc:1 "Мы наконец интегрировали Звено в правительство, улучшив сотрудничество, которое уже развивалось между членами этой бывшей организации и нашей партией. Таким образом, мы можем теперь содействовать сотрудничеству в более крупных проектах, объединив некоторые из самых ярких умов нашей страны."
  bftb_bulgaria_factions.17.a:1 "Давайте немедленно заставим эти умы работать!"
  bftb_bulgaria_factions.19.t:0 "Звено уничтожено!"
  bftb_bulgaria_factions.19.desc:1 "Последние несколько недель полицейские силы выкорчевывали остатки Звено, которое уже было сильно ослаблено и дезорганизовано отсутствием сильного руководства после арестов, которые мы произвели до этой операции. \nМы можем теперь с уверенностью сказать, что Звено прекратило существование в [ROOT.GetNameDef], что может принести только пользу стране и ее правительству."
  bftb_bulgaria_factions.19.a:1 "Прекрасная новость!"
  bftb_bulgaria_factions.20.t:0 "Рабочие забастовки"

  bftb_bulgaria_factions.20.desc:1 "Члены фракции широких социалистов присоединились к коммунистам в их усилиях по разжиганию национальных забастовок среди промышленных рабочих. Путем тайных собраний и встреч им удалось собрать огромную поддержку и сочувствие среди болгарского пролетариата.\nМы должны действовать с осторожностью, наводя порядок в регионах, где эти забастовщики пользуются наибольшей популярностью, чтобы ситуация не переросла в нечто более серьезное, чем просто забастовки..."
  bftb_bulgaria_factions.20.a:1 "Голод в конечном итоге вернет их в стадо"
  bftb_bulgaria_factions.20.b:1 "Мы должны сокрушить их любой ценой!"
  bftb_bulgaria_factions.21.t:0 "Беспорядки приводят к сопутствующему ущербу"
  bftb_bulgaria_factions.21.desc:0 "После вмешательства наших сил против забастовщиков, в промышленных районах вспыхнули жестокие столкновения и беспорядки. В [?BUL.BUL_damaged_civs_state.GetName] беспорядки повредили ряд гражданских фабрик[GetMilitaryFactoriesDamaged].[GetInfrastructureDamaged]"
  bftb_bulgaria_factions.21.a:0 "Несчастный исход..."
  BUL_bs_strikes_no_military_factories_damaged:0 ""
  BUL_bs_strikes_military_factories_damaged_same_state:0 " в то время как несколько коммунистических групп пытались подорвать наше производство вооружений, саботируя военные объекты в штате"
  BUL_bs_strikes_military_factories_damaged_other_state:0 ". В [?BUL.BUL_damaged_mils_state.GetName] несколько коммунистических групп пытались подорвать наше производство вооружений, саботируя военные объекты"
  BUL_bs_strikes_no_infrastructure_damaged:0 ""
  BUL_bs_strikes_infrastructure_damaged:0 " Беспорядки также привели к повреждению и блокировке дорог, железных дорог и транспорта в [?BUL.BUL_damaged_infrastructure_state.GetName]."
  bftb_bulgaria_factions.27.t:0 "Широкие социалисты интегрированы"
  bftb_bulgaria_factions.27.desc:1 "Мы наконец интегрировали широких социалистов в правительство, улучшив сотрудничество, которое уже развивалось между членами этой бывшей организации и нашей партией. Таким образом, мы можем теперь способствовать сотрудничеству в более крупных проектах, объединяя некоторые из самых ярких умов нашей страны."
  bftb_bulgaria_factions.27.a:1 "Нам нужна взаимная поддержка, чтобы достичь величия!"
  bftb_bulgaria_factions.29.t:0 "Широкие социалисты уничтожены"
  bftb_bulgaria_factions.29.desc:1 "Последние несколько недель полицейские силы выкорчевывали остатки широких социалистов, которые уже были серьезно ослаблены и дезорганизованы отсутствием сильного руководства после арестов, которые мы совершили до этой операции.\nТеперь мы можем с уверенностью сказать, что широкие социалисты перестали существовать в [ROOT.GetNameDef], что может принести пользу стране и ее правительству."
  bftb_bulgaria_factions.29.a:1 "Это заняло некоторое время..."

  bftb_bulgaria_factions.30.t:0 "Популярность аграриев растет в сельской местности"

  bftb_bulgaria_factions.30.desc:1 "Национальный аграрный союз ведет незаконную пропагандистскую кампанию в сельских районах страны, где тысячи фермеров подвергаются манипуляциям, чтобы не доверять правительству и вступить в их ряды.\nАграрии особенно критикуют воинственные политики прошлого, которые привели Болгарию к разорению и унижению, стремясь найти слабые сходства с политикой нынешнего правительства, чтобы породить недовольство и неопределенность среди населения."
  bftb_bulgaria_factions.30.a:0 "Совершенно неприемлемо!"
  bftb_bulgaria_factions.31.t:0 "Разделение в Национальном аграрном союзе"
  bftb_bulgaria_factions.31.desc:1 "Несмотря на то, что аграрии и коммунисты ранее не имели богатой истории сотрудничества, похоже, что поиск общей цели в свержении правительства сумел объединить определенные крылья Национального аграрного союза и Коммунистической партии.\nНекоторые из аграриев решили покинуть организацию и присоединиться к коммунистам, в то время как другие, более консервативные, остаются верными как своей борьбе против буржуазии, так и своему отказу от большевизма и пытаются найти политические пути к взаимопониманию с правительством."
  bftb_bulgaria_factions.31.a:1 "Проклятые крысы!"
  bftb_bulgaria_factions.37.t:0 "Национальный аграрный союз интегрирован"
  bftb_bulgaria_factions.37.desc:1 "Мы наконец интегрировали Национальный аграрный союз в правительство, улучшив сотрудничество, которое уже развивалось между членами этой бывшей организации и нашей партией. Таким образом, мы можем теперь поощрять сотрудничество для более крупных проектов, объединяя некоторые из самых ярких умов нашей страны."
  bftb_bulgaria_factions.37.a:1 "Это принесет огромную пользу стране."
  bftb_bulgaria_factions.39.t:0 "Национальный аграрный союз уничтожен"
  bftb_bulgaria_factions.39.desc:1 "В течение последних нескольких недель полицейские силы искореняли остатки Национального аграрного союза, который уже был серьезно ослаблен и дезорганизован из-за отсутствия сильного лидерства после арестов, которые мы совершили до этой операции.\nТеперь мы можем с уверенностью сказать, что Национальный аграрный союз перестал существовать в [ROOT.GetNameDef], что может быть только на пользу стране и ее правительству."
  bftb_bulgaria_factions.39.a:1 "Они ушли навсегда!"
 
  bftb_bulgaria_factions.40.t:1 "Марш на [GetMarchDestinationName]"

  bftb_bulgaria_factions.40.desc:1 "Национальное Социальное Движение, подражая методам, использовавшимся Союзом молодых болгарских легионов много лет назад для повышения своей популярности, организовало марш из [Root.Capital.GetName] в [GetMarchDestinationName].\nИдя с факелами, как это делали нацисты, протестующие требуют более решительных мер по подавлению и ликвидации подрывных большевистских групп, создания национального рабочего синдиката против классовой борьбы и более активного государственного вмешательства в болгарскую экономику и общество.\nПока что марш становится довольно популярным среди городской молодежи, поэтому, если мы хотим остановить этот тип демонстраций, нам лучше сделать это как можно скорее."
  bftb_bulgaria_factions.40.a:1 "Это даже не оригинальный протест!"
  bftb_bulgaria_factions.40.b:0 "Мы должны заставить их замолчать, прежде чем они станут большей угрозой"
  bftb_bulgaria_factions.47.t:0 "Национальное Социальное Движение Интегрировано"
  bftb_bulgaria_factions.47.desc:1 "Мы наконец интегрировали Национальное Социальное Движение в правительство, улучшив сотрудничество, которое уже развивалось между членами этой бывшей организации и нашей партией. Таким образом, мы можем теперь способствовать сотрудничеству для более крупных проектов, объединяя некоторые из самых блестящих умов нашей страны."
  bftb_bulgaria_factions.47.a:1 "Мы же говорим, что это к лучшему..."
  bftb_bulgaria_factions.49.t:0 "Национальное Социалистическое Движение Уничтожено"
  bftb_bulgaria_factions.49.desc:1 "В течение последних нескольких недель полицейские силы выкорчевывали остатки Национального Социального Движения, которое уже было серьезно ослаблено и дезорганизовано отсутствием сильного руководства после арестов, которые мы произвели до этой операции.\nТеперь мы можем с уверенностью сказать, что Национальное Социальное Движение прекратило свое существование в [ROOT.GetNameDef], что может принести только пользу стране и ее правительству."
  bftb_bulgaria_factions.49.a:1 "Их никто не будет скучать!"

  bftb_bulgaria_factions.50.t:1 "Члены Звено Подавлены"
  bftb_bulgaria_factions.50.desc:1 "Мы успешно подавили организацию Звено, арестовав членов, которые, как сообщается, публично высказывались против [ROOT.GetLeader] или даже замышляли свергнуть правительство."
  bftb_bulgaria_factions.50.a:1 "Они получили по заслугам"
  bftb_bulgaria_factions.51.t:1 "Члены Звено Подавлены"
  bftb_bulgaria_factions.51.desc:1 "Наши силы безопасности провели массированные репрессивные действия против организации Звено. Руководитель операции утверждает, что полицейским удалось захватить множество проблемных личностей во время тайной встречи организации, считая результат операции чрезвычайно успешным."
  bftb_bulgaria_factions.51.a:1 "Прекрасные новости!"
  bftb_bulgaria_factions.52.t:1 "Члены Звено Подавлены"

  bftb_bulgaria_factions.52.desc:1 "Наша попытка подавить организацию \"Звено\" к сожалению провалилась. Полиция ворвалась в то, что они считали тайным собранием, где \"Звено\" замышляло заговор против правительства, но, хотя там действительно были члены \"Звено\", собрание не имело никакого отношения к их организации или даже к политике. \nНе нужно говорить, что эти действия полиции были не очень популярны среди болгарского населения, и ещё меньше среди \"Звено\"..."
  bftb_bulgaria_factions.52.a:1 "Как неловко..."
  bftb_bulgaria_factions.53.t:1 "Операция по аресту лидеров \"Звено\""
  bftb_bulgaria_factions.53.desc:1 "Операция по захвату лидеров \"Звено\" прошла успешно. Несколько важных фигур, включая самого Кимона Георгиева, были арестованы, что нанесло серьезный удар по организации."
  bftb_bulgaria_factions.53.a:1 "Они больше не смогут создавать проблем!"
  bftb_bulgaria_factions.54.t:1 "Операция по аресту лидеров \"Звено\""
  bftb_bulgaria_factions.54.desc:1 "Операция по захвату лидеров \"Звено\" не прошла так успешно, как мы ожидали. Хотя полицейские силы арестовали некоторых важных лиц, лидер организации, Кимон Георгиев, сумел бежать и, несмотря на то, что сейчас он скрывается, продолжает руководить \"Звено\"."
  bftb_bulgaria_factions.54.a:1 "Разочаровывающий результат..."
  bftb_bulgaria_factions.55.t:1 "Операция по аресту лидеров \"Звено\""
  bftb_bulgaria_factions.55.desc:1 "Операция по аресту лидеров \"Звено\" полностью провалилась. Полицейские силы ворвались на тайное собрание, но агенты, значительно уступающие в численности, не смогли подавить участников, которые быстро покинули место происшествия, преследуемые полицией, что привело к жестокому противостоянию на улицах города и оставило многих невинных граждан ранеными. Столкнувшись с такой жестокостью со стороны полиции, многие гражданские лица в этом районе не смогли не сочувствовать \"Звено\", помогая членам организации бежать и даже присоединяясь к борьбе против государственных сил."
  bftb_bulgaria_factions.55.a:1 "Кто-то должен поплатиться за этот провал!"
  bftb_bulgaria_factions.60.t:1 "Репрессии против Широких Социалистов"
  bftb_bulgaria_factions.60.desc:1 "Мы успешно подавили Широких Социалистов, арестовав членов, которые, по сообщениям, пытались спровоцировать протесты или беспорядки среди населения."
  bftb_bulgaria_factions.60.a:1 "Они получили по заслугам"
  bftb_bulgaria_factions.61.t:1 "Репрессии против Широких Социалистов"
  bftb_bulgaria_factions.61.desc:1 "Наши силовые структуры провели масштабную репрессивную акцию против Широких Социалистов. Полицейские, по сообщениям, сумели захватить множество проблемных лиц во время тайного собрания, на котором несколько лидеров Широких Социалистов встречались с членами рабочих организаций и даже с коммунистической партией. Глава полиции утверждает, что результаты операции были чрезвычайно успешными."

  bftb_bulgaria_factions.61.a:1 "Прекрасные новости!"
  bftb_bulgaria_factions.62.t:1 "Широкие социалисты подавлены"
  bftb_bulgaria_factions.62.desc:1 "К сожалению, наша попытка подавить Широких Социалистов провалилась. Полиция ворвалась в то, что, по их мнению, было тайным собранием, где Широкие Социалисты встречались с членами рабочих организаций и коммунистической партии, чтобы организовать новые промышленные забастовки, но оказалось, что Широкие Социалисты просто наслаждались лекцией Тодора Павлова о диалектическом материализме, что делает эту зрелищную полицейскую демонстрацию совершенно бесполезной. \n Само собой разумеется, эти действия полиции не очень популярны среди болгарского населения, и еще меньше - среди Широких Социалистов..."
  bftb_bulgaria_factions.62.a:1 "Как неловко..."
  bftb_bulgaria_factions.63.t:1 "Операция по аресту лидеров Широких Социалистов"
  bftb_bulgaria_factions.63.desc:1 "Операция по захвату лидеров Широких Социалистов прошла успешно. Полиция задержала большинство важных фигур, связанных с организацией, нанеся критический удар по Широким Социалистам."
  bftb_bulgaria_factions.63.a:1 "Они больше не смогут создать никаких проблем!"
  bftb_bulgaria_factions.64.t:1 "Операция по аресту лидеров Широких Социалистов"
  bftb_bulgaria_factions.64.desc:1 "Операция по захвату лидеров Широких Социалистов не была такой успешной, как мы ожидали. Хотя полиция арестовала некоторых важных лиц, нескольким лидерам организации удалось бежать, и, несмотря на то, что они скрываются, они продолжают руководить Широкими Социалистами."
  bftb_bulgaria_factions.64.a:1 "Разочаровывающий результат..."
  bftb_bulgaria_factions.65.t:1 "Операция по аресту лидеров Широких Социалистов"
  bftb_bulgaria_factions.65.desc:1 "Операция по аресту лидеров Широких Социалистов полностью провалилась. Полицейские силы ворвались на тайное собрание, но агенты, значительно уступающие по численности, не смогли подчинить себе участников, которые быстро разбежались и искали поддержки у своих товарищей-пролетариев, что вызвало жестокое столкновение на улицах города и оставило многих невинных граждан ранеными. Столкнувшись с такой жестокостью со стороны полиции, многие жители района не могли не сочувствовать Широким Социалистам, помогая членам организации бежать и даже присоединяясь к борьбе против государственных сил."
  bftb_bulgaria_factions.65.a:1 "За этот провал должен кто-то ответить!"
  bftb_bulgaria_factions.70.t:1 "Члены Аграрного Союза подавлены"
  bftb_bulgaria_factions.70.desc:1 "Мы успешно подавили Аграрный национальный союз, арестовав членов, которые, как сообщается, публично выступали против правительства или пытались подстрекать население к протестам."
  bftb_bulgaria_factions.70.a:1 "Они получили по заслугам"
  bftb_bulgaria_factions.71.t:1 "Члены Аграрного Союза подавлены"

  bftb_bulgaria_factions.71.desc:1 "Наши силовые структуры провели масштабную репрессивную акцию против Национального аграрного союза. Полиция ворвалась на несколько митингов Аграрного союза, которые одновременно проводились в разных городах по всей Болгарии, с целью вызвать волнения среди населения сельской местности. В официальных отчетах полиции утверждается, что результат был крайне успешным."
  bftb_bulgaria_factions.71.a:1 "Прекрасные новости!"
  bftb_bulgaria_factions.72.t:1 "Члены Аграрного союза подверглись репрессиям"
  bftb_bulgaria_factions.72.desc:2 "К сожалению, наша попытка подавить Национальный аграрный союз провалилась. Полиция ворвалась в то, что они считали тайным митингом в сельской местности, где лидеры Аграрного союза уговаривали фермеров выступить против правительства, но оказалось, что мероприятие было всего лишь лекцией по книге Александра Стамболийского «Политические партии или государственные организации», что сделало действия полиции совершенно бесполезными.\nНе нужно говорить, что эта полицейская акция не пользовалась большой популярностью среди болгарского населения, и еще меньше среди Аграрного союза..."
  bftb_bulgaria_factions.72.a:1 "Как стыдно..."
  bftb_bulgaria_factions.73.t:1 "Операция по аресту лидеров Аграрного союза"
  bftb_bulgaria_factions.73.desc:1 "Операция по захвату лидеров Национального аграрного союза прошла успешно. Силы полиции задержали большинство важных фигур, связанных с организацией, в том числе самого Никола Петкова, нанеся критический удар по Аграрному союзу."
  bftb_bulgaria_factions.73.a:1 "Теперь они не смогут создавать больше проблем!"
  bftb_bulgaria_factions.74.t:1 "Операция по аресту лидеров Аграрного союза"
  bftb_bulgaria_factions.74.desc:1 "Операция по захвату лидеров Национального аграрного союза прошла не так успешно, как мы ожидали. Хотя силы полиции арестовали некоторых важных людей, Никола Петков сумел бежать и, несмотря на то, что скрывается, продолжает руководить организацией."
  bftb_bulgaria_factions.74.a:1 "Разочаровывающий результат..."
  bftb_bulgaria_factions.75.t:1 "Операция по аресту лидеров Аграрного союза"
  bftb_bulgaria_factions.75.desc:1 "Операция по аресту лидеров Национального аграрного союза провалилась. Силы полиции ворвались на тайную встречу, но агенты, значительно уступая по численности, не смогли подчинить участников, которые быстро покинули место происшествия и искали народной поддержки в городе, вызвав на улицах города насильственное столкновение, в результате которого многие невинные граждане были ранены. Столкнувшись с такой жестокостью со стороны полиции, многие гражданские лица в этом районе не могли не сочувствовать Аграрному союзу, помогая членам организации бежать и даже присоединяясь к борьбе против государственных сил."
  bftb_bulgaria_factions.75.a:1 "Кто-то должен заплатить за эту неудачу!"
  bftb_bulgaria_factions.80.t:1 "Члены Национального социалистического движения подверглись репрессиям"

  bftb_bulgaria_factions.80.desc:1 "Нам удалось подавить Национальное Социальное Движение, арестовав членов, которые, как сообщается, пытались вызвать волнения, публично выступая с ненавистническими речами против некоторых организаций, и даже против [ROOT.GetLeader] самого."
  bftb_bulgaria_factions.80.a:1 "Они получили по заслугам"
  bftb_bulgaria_factions.81.t:1 "Члены Национального Социального Движения подавлены"
  bftb_bulgaria_factions.81.desc:1 "Наши силы безопасности провели масштабную репрессивную акцию против Национального Социального Движения. Полиция ворвалась на крупный митинг, где несколько неприятных лидеров Национального Социального Движения выступали с ненавистническими речами против [ROOT.GetLeader] и организовывали свой следующий марш для протеста против правительства. Большинство из этих радикалов были схвачены, и официальные отчеты утверждают, что итоги операции были крайне успешными."
  bftb_bulgaria_factions.81.a:1 "Прекрасная новость!"
  bftb_bulgaria_factions.82.t:1 "Члены Национального Социального Движения подавлены"
  bftb_bulgaria_factions.82.desc:2 "К сожалению, наша попытка подавить Национальное Социальное Движение провалилась. Полиция ворвалась в штаб-квартиру организации, где они полагали, что проходит тайный митинг по организации следующего фашистского марша, но оказалось, что это была просто конференция по вопросам современной экономической политики, которую проводил сам Александър Цанков, что сделало полицейскую демонстрацию совершенно бесполезной. \nСамо собой разумеется, эта полицейская акция не была очень популярной среди болгарского населения, и ещё меньше среди Национального Социального Движения..."
  bftb_bulgaria_factions.82.a:1 "Как неловко..."
  bftb_bulgaria_factions.83.t:1 "Операция по заключению лидеров Национального Социального Движения"
  bftb_bulgaria_factions.83.desc:2 "Операция по захвату лидеров Национального Социального Движения завершилась успешно. Полиция задержала большинство ключевых фигур, связанных с организацией, включая самого Александра Цанкова, что нанесло организации критический удар."
  bftb_bulgaria_factions.83.a:1 "Они больше не смогут создавать проблемы!"
  bftb_bulgaria_factions.84.t:1 "Операция по заключению лидеров Национального Социального Движения"
  bftb_bulgaria_factions.84.desc:2 "Операция по захвату лидеров Национального Социального Движения оказалась не такой успешной, как мы ожидали. Хотя полиция арестовала несколько важных личностей, Александру Цанкову удалось сбежать, и, несмотря на то, что он скрывается, он продолжает руководить организацией."
  bftb_bulgaria_factions.84.a:1 "Разочаровывающий результат..."
  bftb_bulgaria_factions.85.t:1 "Операция по заключению лидеров Национального Социального Движения"

  bftb_bulgaria_factions.85.desc:1 "Операция по аресту лидеров Национального социалистического движения провалилась. Силы полиции ворвались на тайную встречу, но агенты, значительно уступающие численностью, не смогли подчинить участников, которые быстро покинули место происшествия, преследуемые полицией, что вызвало жестокое противостояние на улицах города и оставило многих невинных граждан ранеными. Столкнувшись с такой жестокостью со стороны полиции, многие мирные жители района не смогли не сочувствовать Национальному социалистическому движению, помогая членам организации бежать и даже присоединяясь к борьбе против государственных сил."
  bftb_bulgaria_factions.85.a:1 "Кто-то должен заплатить за этот провал!"

  BUL_repress_imro_flag:0 "Подавило IMRO"
  bftb_bulgaria_imro.1.t:0 "IMRO возвращается!"
  bftb_bulgaria_imro.1.desc:0 "Достоверные источники сообщили нам, что члены IMRO пересекли границу, вооруженные болгарским оружием, и организуют анти-[ROOT.GetAdjective] движение в македонских регионах."
  bftb_bulgaria_imro.1.a:0 "Возвращение к началу 1930-х годов..."
  bftb_bulgaria_imro.2.t:0 "Болгарские настроения пробуждаются в Македонии"
  bftb_bulgaria_imro.2.desc:0 "Активисты IMRO и другие проболгарские македонцы в настоящее время распространяют болгарские настроения среди македонского населения.\nКак следствие, новая волна нестабильности и оппозиции [ROOT.GetAdjective] правительству поражает регион."
  bftb_bulgaria_imro.2.a:0 "Время снова разобраться с IMRO..."

  bftb_bulgaria_fatherland_front.1.t:1 "Фронт Отечества"
  bftb_bulgaria_fatherland_front.1.desc_positive:1 "Наконец, мы можем пожинать плоды наших огромных усилий по объединению широко отличающихся политических и идеологических групп на едином фронте против прогерманской милитаристской диктатуры в Болгарии.\nМы создали Фронт Отечества, объединяющий не только Коммунистическую партию, но и бывших членов «Звено», широких социалистов, аграриев и других формирований, которые теперь вместе выступают против буржуазии, которая доминирует в стране и которая не колеблясь снова разорит ее в поисках собственного богатства."
  bftb_bulgaria_fatherland_front.1.desc_negative:1 "Коммунисты вместе с членами других организаций создали Фронт Отечества, политическое движение сопротивления, которое становится опасно популярным среди пролетариата и может даже представлять угрозу свержения правительства в ближайшем будущем."
  bftb_bulgaria_fatherland_front.1.a:1 "Вместе мы сильнее!"
  bftb_bulgaria_fatherland_front.1.b:1 "Еще одна коммунистическая уловка, обреченная на провал"
  bftb_bulgaria_fatherland_front.2.t:1 "Фронт Отечества атакует!"

  bftb_bulgaria_fatherland_front.2.desc:0 "Сегодня, в соответствии с заранее разработанным планом, местные организации Отечественного фронта и вооруженные партизанские формирования захватили мэрии и районные администрации по всей стране. \nМятежники столкнулись с редким сопротивлением, а то и вовсе его не встретили, вдоль черноморского побережья от Бургаса до Варны[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]."
  bftb_bulgaria_fatherland_front.2.desc_no_support:0 ""
  bftb_bulgaria_fatherland_front.2.desc_has_bs_support:0 ", а в Пловдиве рабочий класс вышел на улицы в массовом порядке в поддержку восстания, сумев взять под контроль регион после нескольких часов уличных боёв"
  bftb_bulgaria_fatherland_front.2.desc_has_bzns_support:0 ". \nПо сообщениям, поддержка аграриев также сыграла решающую роль в успехе переворота в сельских районах Мезии"
  bftb_bulgaria_fatherland_front.2.desc_has_zveno_support:0 ". \nВ Софии бывшие офицеры Звено оккупировали коммуникационные объекты и устремились к зданию Национального собрания, заставив неподготовленные верные войска сдаться"
  bftb_bulgaria_fatherland_front.2.desc_has_partisan_support:0 ". \nИ, наконец, группы [GetPartisanFfSupportNationalities] партизан присоединились к перевороту Отечественного фронта и оспаривают контроль над оккупированными территориями"
  bftb_bulgaria_fatherland_front.2.desc_partisans_gre:0 "греческих"
  bftb_bulgaria_fatherland_front.2.desc_partisans_yug:0 "югославских"
  bftb_bulgaria_fatherland_front.2.desc_partisans_both:0 "греческих и югославских"
  bftb_bulgaria_fatherland_front.2.a:1 "Тогда это гражданская война!"
  BUL_zveno_dissidents_tt:0 "Если мы не разберемся с фракцией [GetZvenoName] вовремя, члены этой организации смогут осуществить военный переворот в будущем."
  BUL_exposed_zveno_conspirator_tt:0 "Это немного задержит любой переворот, который может планировать фракция [GetZvenoName]."
  BUL_bs_strikes_no_violence_tt:0 "В процессе будет поврежден ряд фабрик.\nВысокая поддержка §Yкоммунизма§! и высокая популярность [GetBsName] могут усугубить ситуацию."
  bftb_bulgaria_rearmament.1.t:1 "Переговоры о перевооружении [BUL.GetAdjective]"
  bftb_bulgaria_rearmament.1.desc:1 "[BUL.GetAdjective] правительство публично объявило о мирной политике, которой будет придерживаться [BUL.GetNameDef] на Балканах, и сейчас призывает нас к переговорам о снятии строгих военных ограничений, наложенных на страну после ее поражения в Великой войне. \nОни утверждают, что им необходимо немедленно начать перевооружение, чтобы создать современные вооруженные силы, способные защищать суверенитет и самоопределение [BUL.GetAdjective] народа."
  bftb_bulgaria_rearmament.1.a:1 "Они просто предлагают пустые обещания."
  bftb_bulgaria_rearmament.1.b:1 "Мы должны потребовать официального договора для поддержания мира."
  bftb_bulgaria_rearmament.1.c:1 "Мы должны положить конец их ограничениям!"

  bftb_bulgaria_rearmament.1_refuse_tt:0 "[BUL.GetNameDefCap] не сможет начать перевооружение, по крайней мере, сейчас."
  bftb_bulgaria_rearmament.1_nap_tt:0 "[BUL.GetNameDefCap] сможет начать перевооружение, как только заключит пакт о ненападении с [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] или [TUR.GetFlag][TUR.GetNameDefCap]."
  bftb_bulgaria_rearmament.2.t:1 "[ENG.GetNameDefCap] отказывается от [ROOT.GetAdjective] перевооружения"
  bftb_bulgaria_rearmament.2.desc:1 "[ENG.GetAdjective] правительство отказалось снимать любые ограничения с наших вооруженных сил, по-видимому, равнодушно к растущей напряженности в Европе и перспективе [ROOT.GetNameDef] беззащитно поддаться растущей силе в случае изменения хрупкого баланса, существующего на Балканах."
  bftb_bulgaria_rearmament.2.a:0 "Мы должны найти другие средства убеждения..."
  bftb_bulgaria_rearmament.3.t:1 "[ENG.GetAdjective] требует разрешить [ROOT.GetNameDef] перевооружение"
  bftb_bulgaria_rearmament.3.desc:1 "Прежде чем снять любые ограничения с наших вооруженных сил, [ENG.GetAdjective] правительство требует, чтобы [ROOT.GetNameDef] подписал официальный договор с одним из ее соседей, как отправную точку для окончательного развития дружественной дипломатии на Балканах."
  bftb_bulgaria_rearmament.3.a:1 "Еще одно препятствие, которое нужно преодолеть..."
  BUL_uk_demands_nap_with_balkan_nation_tt:1 "§YОграничения на армию§! Национальная идея будет удалена после подписания §Yпакта о ненападении§! с [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] или [TUR.GetFlag][TUR.GetNameDefCap]."
  bftb_bulgaria_rearmament.4.t:0 "Ограничения на армию сняты"
  bftb_bulgaria_rearmament.4.desc:1 "После выполнения требований [ENG.GetAdjective] и заключения пакта о ненападении с [GetNapTarget], [ENG.GetNameDef] наконец снял ограничения с нашей армии, и перевооружение [ROOT.GetAdjective] армии может наконец начаться."
  bftb_bulgaria_rearmament.4.a:1 "Давайте приступим к работе!"
  BUL_nap_with_greece:0 "[GRE.GetNameDefCap]"
  BUL_nap_with_yugoslavia:0 "[YUG.GetNameDefCap]"
  BUL_nap_with_romania:0 "[ROM.GetNameDefCap]"
  BUL_nap_with_turkey:0 "[TUR.GetNameDefCap]"
  bftb_bulgaria_rearmament.5.t:1 "[BUL.GetAdjective] ограничения на армию сняты"
  bftb_bulgaria_rearmament.5.desc:1 "После выполнения требований [ROOT.GetAdjective] и заключения пакта о ненападении с [GetNapTarget], болгарская делегация прибыла в Лондон и готова подписать официальный договор, который позволит [BUL.GetNameDef] начать военное перевооружение."
  bftb_bulgaria_rearmament.5.a:1 "Давайте покончим с этим."
  bftb_bulgaria_rearmament.6.t:0 "[ENG.GetNameDefCap] снимает ограничения на нашу армию"

  bftb_bulgaria_rearmament.6.desc:1 "После трудных переговоров в Софии с делегацией из [ENG.GetNameDef] мы подписали соглашение, по которому [ENG.GetAdjective] правительство сняло ограничения с нашей армии, и [ROOT.GetNameDef] наконец может начать военное перевооружение."
  bftb_bulgaria_rearmament.6.a:1 "Время не ждет, начинайте перевооружение!"
  bftb_bulgaria_rearmament.7.t:0 "[BUL.GetNameDefCap] давит на снятие ограничений с армии"
  bftb_bulgaria_rearmament.7.desc:1 "[BUL.GetAdjective] делегация прибыла в Лондон с целью надавить на [ROOT.GetAdjective] правительство, чтобы оно сняло военные ограничения на [BUL.GetNameDef]. \nС новой войной, надвигающейся на Балканы, они заверяют, что [BUL.GetNameDef] скоро начнет подготовку к защите своей территориальной целостности, так или иначе."
  bftb_bulgaria_rearmament.7.a:1 "Мы не поддадимся угрозам!"
  bftb_bulgaria_rearmament.7.b:1 "Другого выхода нет... Снимите ограничения!"
  bftb_bulgaria_rearmament.8.t:1 "[ENG.GetNameDefCap] не поддается нашему давлению"
  bftb_bulgaria_rearmament.8.desc:1 "[ROOT.GetAdjective] делегация, посланная в Лондон, чтобы надавить на [ENG.GetAdjective] правительство, чтобы оно сняло ограничения с нашей армии, вернулась с неутешительными новостями: [ENG.GetNameDef] не поддается нашим требованиям и не позволит [ROOT.GetNameDef] начать перевооружение."
  bftb_bulgaria_rearmament.8.a:1 "Значит, у нас нет выбора..."
  bftb_bulgaria_rearmament.9.t:1 "[BUL.GetNameDefCap] не будет соблюдать военные ограничения"
  bftb_bulgaria_rearmament.9.desc:1 "[BUL.GetAdjective] дипломат, посланный самим [BUL.GetLeader], прибыл в нашу страну, чтобы сообщить нам, что[GetReasonForNotAbiding]."
  bftb_bulgaria_rearmament.9.a:0 "Мы разберемся с ними позже..."
  bftb_bulgaria_rearmament.9.b:0 "Они должны заплатить за это!"
  bftb_bulgaria_rearmament.9.desc_reason_war:0 ", из-за военного конфликта, в который они оказались втянуты, [BUL.GetNameDef] немедленно начнет перевооружаться, чтобы сохранить свою национальную независимость и свободу своего народа"
  bftb_bulgaria_rearmament.9.desc_reason_faction:0 " теперь, когда они поддерживаются [BUL.GetFactionName], [BUL.GetNameDef] больше не будет соблюдать ограничения, наложенные на его вооруженные силы"

  bftb_bulgaria_nationalization.1.t:0 "[FROM.GetNameDefCap] захватили наши дочерние компании"
  bftb_bulgaria_nationalization.1.desc:0 "При поддержке своих [GetTsarLoyalistOrPartyName], [GetLeaderNameIfRegencyCouncil] [BUL.GetNameDef] принял новый закон, по которому все иностранные дочерние компании в стране были национализированы, и теперь принадлежат [BUL.GetAdjective] государству. \nЭта дерзкая атака на [ROOT.GetAdjective] интересы в [BUL.GetNameDef] была воспринята как серьезный удар в высших эшелонах, особенно промышленными магнатами, которые инвестировали огромные суммы в развитие инфраструктуры и дочерних компаний в [BUL.GetNameDef], которые были безжалостно экспроприированы."

  bftb_bulgaria_nationalization.1.desc_tsar_loyalists:0 "верные министры"
  bftb_bulgaria_nationalization.1.desc_party_name:0 "министры из [BUL.GetRulingPartyLong]"
  bftb_bulgaria_nationalization.1.desc_regency_council:0 "Богдан Филов и [BUL.GetLeader]"
  bftb_bulgaria_nationalization.1.desc_regular_leader:0 "[BUL.GetLeader]"
  bftb_bulgaria_nationalization.1.a:0 "Мы ничего не можем с этим поделать..."
  bftb_bulgaria_nationalization.1.b:0 "Торговое эмбарго научит их уважению!"
  bftb_bulgaria_nationalization.1.c:0 "Мы отправим дипломатическую делегацию... Во главе с танками!"
  bftb_bulgaria_nationalization.1.d:0 "Прочь с этими неблагодарными предателями!"
  bftb_bulgaria_nationalization.2.t:0 "Торговое эмбарго [FROM.GetAdjective] против Болгарии"
  bftb_bulgaria_nationalization.2.desc:1 "[FROM.GetNameDef] решила ввести эмбарго против нашей страны[GetEmbargoAllies] в ответ на национализацию [ROOT.GetAdjective] иностранными филиалами и отделениями. \nНекоторые говорят, что ситуация могла бы развиваться куда хуже, но правда в том, что несколько секторов, занимающихся импортом и экспортом товаров, серьезно пострадали от этого эмбарго."
  bftb_bulgaria_nationalization.2.desc_no_allies:0 ""
  bftb_bulgaria_nationalization.2.desc_allies:0 ", эмбарго, которое также поддержали её союзники"
  bftb_bulgaria_nationalization.2.a:0 "Как драматично..."
  bftb_bulgaria_nationalization.3.t:0 "[FROM.GetNameDefCap] исключила нас из [FROM.GetFactionName]"
  bftb_bulgaria_nationalization.3.desc:0 "[FROM.GetAdjective] правительство уступило давлению инвесторов и промышленных магнатов, которые, в ответ на национализацию [BUL.GetAdjective] иностранных филиалов, потребовали от [FROM.GetNameDef], чтобы она не только ввела торговое эмбарго против [BUL.GetNameDef], но и исключила страну из [FROM.GetFactionName].\nЭмбарго[GetEmbargoAndKickAllies] серьезно затронет несколько национальных экономических секторов, но еще хуже, что наша страна теперь подвержена территориальным амбициям своих соседей, которые, несомненно, скоро воспользуются плачевным положением [BUL.GetNameDef]."
  bftb_bulgaria_nationalization.3.desc_no_allies:0 ""
  bftb_bulgaria_nationalization.3.desc_allies:0 ", к ним присоединились союзники [FROM.GetNameDef],"
  bftb_bulgaria_nationalization.3.a:0 "Мы должны были ожидать этого!"

  bftb_bulgaria_uranium_mining_concessions.1.t:0 "Концессия на добычу урана [FROM.GetNameDefCap]"

  bftb_bulgaria_uranium_mining_concessions.1.desc:0 "Наши хорошие отношения с нашими [FROM.GetAdjective] союзниками окупились: [FROM.GetAdjective] правительство предоставило нам права на эксплуатацию их уранового месторождения возле города Бухово. Они утверждают, что их технологии все еще далеки от того, чтобы эффективно использовать это вещество, поэтому они предпочитают подписать соглашение о концессии, по которому мы будем контролировать рудники в Бухово в обмен на основные продукты для болгарской промышленности и сельского хозяйства.\nЭто выгодное соглашение не только обеспечит нас новым источником урана, но и, несомненно, улучшит отношения между [GER.GetNameDef] и [BUL.GetNameDef]."
  bftb_bulgaria_uranium_mining_concessions.1.a:0 "Мы используем его с пользой."

  bftb_bulgarian_claims.1.t:0 "Болгария заявляет о своих правах на Балканах"
  bftb_bulgarian_claims.1.desc:1 "Делегация из [BUL.GetNameDef] обратилась к нашему правительству с просьбой о [ROOT.GetAdjective] поддержке их претензий на Балканах и желает тайно вести переговоры и обеспечить [BUL.GetAdjective] территориальное расширение в регионе в ближайшем будущем в обмен на [BUL.GetAdjective] выравнивание с [ROOT.GetNameDef] и вступление страны в [ROOT.GetFactionName]."
  bftb_bulgarian_claims.1.a:1 "Признать болгарские претензии."
  bftb_bulgarian_claims.1.b:1 "Мы организуем любое территориальное расширение по своему усмотрению!"
  bftb_bulgarian_claims.1.a_tt:0 "Государства с §YПредустановленной болгарской территориальной экспансией§! Модификатор будет передан [BUL.GetNameDef], как только любой союзник фракции захватит штат, а [BUL.GetNameDef] присоединится к [ROOT.GetFactionName]."
  bftb_bulgarian_claims.2.t:0 "[GER.GetNameDefCap] Признает наши претензии"
  bftb_bulgarian_claims.2.desc:1 "[ROOT.GetAdjective] делегация, посланная в [FROM.Capital.GetName] для переговоров о нашем территориальном расширении на Балканах, вернулась в [ROOT.Capital.GetName], чтобы сообщить нам, что миссия увенчалась полным успехом. Они заключили тайное соглашение с [FROM.GetAdjective]s, по которому [FROM.GetNameDef] признает наши претензии и соглашается передать [ROOT.GetNameDef] контроль над ними, как только мы официально присоединимся к [FROM.GetFactionName], взяв на себя роль миротворцев в оккупированных балканских государствах."
  bftb_bulgarian_claims.2.a:1 "Сделка, которую трудно улучшить!"
  bftb_bulgarian_claims.3.t:0 "[GER.GetNameDefCap] Отклоняет наши претензии"
  bftb_bulgarian_claims.3.desc:1 "[ROOT.GetAdjective] делегация, посланная в [FROM.Capital.GetName] для переговоров о [FROM.GetAdjective] признании наших претензий на Балканах, вернулась в [ROOT.Capital.GetName], чтобы сообщить нам, что они не смогли выполнить свою миссию по заключению соглашения с [FROM.GetNameDef] для обеспечения [ROOT.GetAdjective] территориального расширения на Балканах."
  bftb_bulgarian_claims.3.a:1 "Тогда нам придется использовать менее тонкие методы расширения..."
  bftb_bulgarian_claims.4.t:0 "[GER.GetNameDefCap] Предоставляет Болгарии контроль"

  bftb_bulgarian_claims.4.desc:1 "Как ранее было согласовано, [GER.GetNameDef] приказал передать контроль над территориями, которые в настоящее время оккупированы силами [GER.GetFactionName] и претендуют на них [ROOT.GetNameDef], которые с этого момента будут находиться под управлением [ROOT.GetAdjective] правительства."
  bftb_bulgarian_claims.4.a:1 "Мы берем то, что по праву принадлежит нам!"
  bftb_bulgarian_claims.5.t:0 "Болгарская оккупация предоставлена"
  bftb_bulgarian_claims.5.desc:1 "Как ранее было согласовано, мы приказали передать контроль над территориями, которые в настоящее время оккупированы силами [GER.GetFactionName] и претендуют на них [ROOT.GetNameDef], которые с этого момента будут находиться под управлением [ROOT.GetAdjective] правительства."
  bftb_bulgarian_claims.5.a:1 "Это была наша часть сделки"
  bftb_bulgarian_claims.6.t:1 "[GER.GetNameDefCap] Предоставляет болгарскую оккупацию"
  bftb_bulgarian_claims.6.desc:1 "Как ранее было согласовано правительствами [GER.GetAdjective] и [BUL.GetAdjective], [GER.GetNameDef] приказал передать контроль над территориями, которые претендуют на них [BUL.GetNameDef] и в настоящее время оккупированы нами, которые с этого момента будут находиться под управлением [BUL.GetAdjective] правительства."
  bftb_bulgarian_claims.6.a:1 "Эти болгарские выскочки!"
  bftb_bulgarian_claims.7.t:0 "[FROM.GetNameDefCap] Просит контроль над [FROM.FROM.GetName]"
  bftb_bulgarian_claims.7.desc:0 "Принимая на себя роль миротворцев на оккупированных балканских территориях, [FROM.GetAdjective]s предложили предоставить им административный контроль над [FROM.FROM.GetName] для поддержания порядка и стабильности на территориях, захваченных [ROOT.GetFactionName], и для освобождения [ROOT.GetAdjective] гарнизонов, чтобы наши войска могли укрепить другие фронты."
  bftb_bulgarian_claims.7.a:0 "Согласен, нам нужны наши войска в другом месте!"
  bftb_bulgarian_claims.7.b:0 "Территориальные амбиции Болгарии безграничны!"
  bftb_bulgarian_claims.8.t:0 "[FROM.GetNameDefCap] Передает контроль над [FROM.FROM.FROM.GetName]"
  bftb_bulgarian_claims.8.desc:0 "Правительство [FROM.GetAdjective] согласилось предоставить [ROOT.GetNameDef] административный контроль над [FROM.FROM.FROM.GetName]. Теперь мы возьмем на себя роль миротворцев в регионе, развернув гарнизон, способный не только поддерживать порядок и стабильность в регионе, но и защищать его от любого вражеского наступления."
  bftb_bulgarian_claims.8.a:0 "Больше территории для Болгарии!"
  bftb_bulgarian_claims.9.t:0 "[FROM.GetNameDefCap] Отказал [ROOT.GetAdjective] в контроле над [FROM.FROM.FROM.GetName]"
  bftb_bulgarian_claims.9.desc:0 "Правительство [FROM.GetAdjective] отказывается предоставить [ROOT.GetNameDef] административный контроль над [FROM.FROM.FROM.GetName]. Они утверждают, что наша реальная мотивация для выдвижения такого предложения заключается просто в том, чтобы расширить [ROOT.GetAdjective] оккупационную зону в надежде получить больше кусков Балкан после окончания войны, и даже [FROM.GetLeader] сам заявил, что наши территориальные амбиции начинают его раздражать."

  bftb_bulgarian_claims.9.a:0 "Может быть, потом..."
  BUL_germany_recognizes_our_claim_tt:0 "[GER.GetNameDefCap] признает наш притязание на эту провинцию."

  bftb_bulgaria_german_influence.1.t:0 "[GER.GetNameDefCap] Предлагает Пожертвование Самолетов"
  bftb_bulgaria_german_influence.1.desc:1 "[GetFirstDonation] связи между нашей страной и [GER.GetNameDef], Герман Геринг предлагает нам пожертвование 12 [GER.GetAdjective] истребителей, очевидно, стремясь привести [ROOT.GetNameDef] к [GER.GetFactionName], и, таким образом, получить могущественного союзника на Балканах для защиты [GER.GetAdjective] интересов в регионе."
  bftb_bulgaria_german_influence.1.desc_first_donation:0 "Восстановить [ROOT.GetAdjective] ВВС и усилить"
  bftb_bulgaria_german_influence.1.desc_more_donations:0 "Для дальнейшего укрепления"
  bftb_bulgaria_german_influence.1.a:1 "С радостью принимаем!"
  bftb_bulgaria_german_influence.1.b:1 "Отказываемся."
  bftb_bulgaria_german_influence.2.t:0 "[BUL.GetNameDefCap] Принимает наше Пожертвование"
  bftb_bulgaria_german_influence.2.desc:1 "[BUL.GetAdjective] высшее командование с радостью приняло наше предложение, и [BUL.GetLeader] лично поблагодарил за пожертвование наших самолетов, заявив, что отношения между [ROOT.GetNameDef] и [BUL.GetNameDef] становятся крепче, более процветающими и взаимовыгодными."
  bftb_bulgaria_german_influence.2.a:1 "Отлично!"
  bftb_bulgaria_german_influence.3.t:1 "[BUL.GetNameDefCap] Отклоняет наше Пожертвование"
  bftb_bulgaria_german_influence.3.desc:1 "[BUL.GetAdjective] высшее командование вежливо отклонило наше предложение пожертвовать [ROOT.GetAdjective] самолеты для укрепления [BUL.GetAdjective] ВВС, заявив, что принятие этого пожертвования означало бы сближение [BUL.GetNameDef] с [ROOT.GetAdjective] политикой, что в настоящее время не отвечает интересам [BUL.GetAdjective], которые полны решимости восстановить свои ВВС самостоятельно."
  bftb_bulgaria_german_influence.3.a:1 "Что с ними не так?"
  bftb_bulgaria_german_influence.4.t:1 "[GER.GetLeader] Требует, чтобы мы заменили Кёсеиванова"
  bftb_bulgaria_german_influence.4.desc:1 "Сегодня мы получили письмо от самого [GER.GetLeader], в котором говорится, что некомпетентность [ROOT.GetAdjective] премьер-министра Георгия Кёсеиванова лишила его доверия в глазах [GER.GetAdjective] и что его следует вынудить уйти в отставку в пользу кого-то более подходящего для такой важной должности. \n[GER.GetAdjective] предлагают заменить Кёсеиванова Богданом Филовым, германофилом с небольшим политическим опытом, что означает, что он не будет оспаривать [GetLeaderToChallenge]."
  bftb_bulgaria_german_influence.4.desc_tsar:0 "царя"
  bftb_bulgaria_german_influence.4.desc_regency_council:0 "[ROOT.GetAdjective] Регентский Совет"
  bftb_bulgaria_german_influence.4.desc_no_tsar:0 "[BUL.GetLeader]"
  bftb_bulgaria_german_influence.4.a:1 "Немцы правы!"

  bftb_bulgaria_german_influence.4.b:1 "Мы не будем уступать немецким прихотям!"
  bftb_bulgaria_german_influence.5.t:1 "[BUL.GetLeader] Соглашается заменить Кьосеиванова"
  bftb_bulgaria_german_influence.5.desc:1 "Некомпетентность бывшего [BUL.GetAdjective] премьер-министра, Георгия Кьосеиванова, заставила его потерять всякий авторитет в глазах [BUL.GetLeader], который прекрасно понимал риск, который представляла собой некомпетентность этого человека, и который принял наше предложение заменить Кьосеиванова кем-то более способным, таким как Богдан Филов, германофил с небольшим политическим опытом, что означает, что он не бросит вызов [GetLeaderToChallenge] или не помешает [ROOT.GetAdjective] интересам."
  bftb_bulgaria_german_influence.5.a:1 "[BUL.GetLeader] доказал свою мудрость."
  bftb_bulgaria_german_influence.6.t:1 "[BUL.GetLeader] Отказался заменить Кьосеиванова"
  bftb_bulgaria_german_influence.6.desc:1 "[BUL.GetLeader] отказался заменить Георгия Кьосеиванова, заявив, что единственная причина, по которой [ROOT.GetAdjective] правительство хочет его отставки, - это избавиться от компетентного политика, преданного [BUL.GetNameDef], и обменять его на [ROOT.GetAdjective] марионетку, чтобы следить за интересами [GER.GetLeader] в [BUL.GetNameDef]."
  bftb_bulgaria_german_influence.6.a:1 "Единственная марионетка здесь - это Георгий Кьосеиванов!"
  bftb_bulgaria_german_influence.7.t:0 "[GER.GetNameDefCap] Требует военного доступа"
  bftb_bulgaria_german_influence.7.desc:1 "Дипломат из [GER.GetNameDef] сегодня прибыл в [ROOT.Capital.GetName], чтобы потребовать, чтобы [ROOT.GetNameDef] предоставил военный доступ [GER.GetAdjective] армии. \nВоенные операции, которые вот-вот начнутся на Балканах, требуют, чтобы [GER.GetAdjective] войска могли перемещаться по территории [ROOT.GetNameDef], чтобы развернуться вдоль границы с нашими соседями, и [GER.GetLeader] будет не рад узнать, что [ROOT.GetNameDef] мешает [GER.GetAdjective] военным усилиям..."
  bftb_bulgaria_german_influence.7.a:1 "Мы с радостью будем сотрудничать с немецкой армией."
  bftb_bulgaria_german_influence.7.b:1 "[GER.GetLeader] придется найти другой путь"
  bftb_bulgaria_german_influence.8.t:0 "[BUL.GetNameDefCap] Предоставляет нам военный доступ"
  bftb_bulgaria_german_influence.8.desc:0 "Дипломат, которого мы послали в [BUL.Capital.GetName], чтобы обсудить использование [BUL.GetAdjective] территории в качестве базы для наших войск, сообщил нам, что переговоры прошли успешно и что [BUL.GetLeader] уже подписал соглашение, по которому [ROOT.GetAdjective] армии был предоставлен военный доступ по всей территории [BUL.GetNameDef]."
  bftb_bulgaria_german_influence.8.a:0 "Все идет по плану."
  bftb_bulgaria_german_influence.9.t:0 "[BUL.GetNameDefCap] Отклоняет нашу просьбу о военном доступе"

  bftb_bulgaria_german_influence.9.desc:1 "Дипломат, посланный нами в [BUL.Capital.GetName] для переговоров об использовании [BUL.GetAdjective] территории в качестве базы для нашей армии, сообщил, что [BUL.GetLeader] отказался предоставить военный доступ войскам [ROOT.GetAdjective], что опасно затруднит наши военные действия на Балканах в ближайшем будущем. Предположительно, [BUL.GetLeader] считает, что удовлетворение всех наших требований превратит [BUL.GetNameDef] в очередной [ROOT.GetAdjective] сателлит, не позволив стране стать независимой великой державой на Балканах, которой она по праву должна быть."
  bftb_bulgaria_german_influence.9.a:1 "[BUL.GetLeader] играет с огнем..."
  bftb_bulgaria_italian_influence.1.t:0 "[BUL.GetAdjective] Предложение о подписании соглашения о научных исследованиях"
  bftb_bulgaria_italian_influence.1.desc:0 "[BUL.GetAdjective] делегация сегодня прибыла в нашу столицу, чтобы встретиться с [ITA.GetAdjective] министром иностранных дел и предложить подписание соглашения между нашими странами.\nДоговор, представленный [BUL.GetAdjective] дипломатами, включает, среди прочего, программу военного сотрудничества, направленную на проведение технологических исследований и внедрение новых экономических правил в [BUL.GetNameDef], которые принесут значительную пользу [ITA.GetAdjective] инвесторам."
  bftb_bulgaria_italian_influence.1.a:0 "Это выгодное соглашение для [ITA.GetNameDef]."
  bftb_bulgaria_italian_influence.1.b:0 "Мы не будем делиться нашими технологическими достижениями с [BUL.GetAdjective]!"

  bftb_bulgaria_equipment_purchases.1.t:0 "Приобрести [FROM.FROM.GetAdjective] артиллерию"
  bftb_bulgaria_equipment_purchases.1.desc:0 "Чтобы достичь соглашения о покупке [FROM.FROM.GetAdjective] артиллерийских орудий, мы должны сначала решить, какой тип артиллерии мы хотим приобрести."
  bftb_bulgaria_equipment_purchases.1.a:0 "Приобрести артиллерийские пушки"
  bftb_bulgaria_equipment_purchases.1.a_tt:0 "Мы приобретем §Y[?BUL_quantity_purchased_artillery]§! единиц §YБуксируемой артиллерии§!"
  bftb_bulgaria_equipment_purchases.1.b:0 "Приобрести зенитные орудия"
  bftb_bulgaria_equipment_purchases.1.b_tt:0 "Мы приобретем §Y[?BUL_quantity_purchased_artillery]§! единиц §YБуксируемой зенитной артиллерии§!"
  bftb_bulgaria_equipment_purchases.1.c:0 "Приобрести противотанковые орудия"
  bftb_bulgaria_equipment_purchases.1.c_tt:0 "Мы приобретем §Y[?BUL_quantity_purchased_artillery]§! единиц §YБуксируемой противотанковой артиллерии§!"
  bftb_bulgaria_equipment_purchases.2.t:0 "Приобрести [FROM.FROM.GetAdjective] военные машины"
  bftb_bulgaria_equipment_purchases.2.desc:0 "Чтобы достичь соглашения о покупке [FROM.FROM.GetAdjective] военных машин, мы должны сначала решить, какой тип машин мы хотим приобрести."
  bftb_bulgaria_equipment_purchases.2.a:0 "Приобрести моторизованные части"
  bftb_bulgaria_equipment_purchases.2.a_tt:0 "Мы приобретем §Y[?BUL_quantity_purchased_motorized]§! единиц §YМоторизованных частей§!"
  bftb_bulgaria_equipment_purchases.2.b:0 "Приобрести механизированные части"

  bftb_bulgaria_equipment_purchases.2.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_mechanized]§! единиц §Yмеханизированных войск§!"
  bftb_bulgaria_equipment_purchases.2.c:0 "Закупить бронеавтомобили"
  bftb_bulgaria_equipment_purchases.2.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_armored_car]§! единиц §Yбронеавтомобилей§!"
  bftb_bulgaria_equipment_purchases.3.t:0 "Закупить [FROM.FROM.GetAdjective] броню"
  bftb_bulgaria_equipment_purchases.3.desc:0 "Чтобы договориться о покупке [FROM.FROM.GetAdjective] брони, мы должны сначала решить, какой тип брони мы хотим приобрести."
  bftb_bulgaria_equipment_purchases.3.a:0 "Закупить легкую броню"
  bftb_bulgaria_equipment_purchases.3.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_light_armor]§! единиц §Yлегких танков§!"
  bftb_bulgaria_equipment_purchases.3.b:0 "Закупить среднюю броню"
  bftb_bulgaria_equipment_purchases.3.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_medium_armor]§! единиц §Yсредних танков§!"
  bftb_bulgaria_equipment_purchases.3.c:0 "Закупить тяжелую броню"
  bftb_bulgaria_equipment_purchases.3.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_heavy_armor]§! единиц §Yтяжелых танков§!"
  bftb_bulgaria_equipment_purchases.4.t:0 "Закупить [FROM.FROM.GetAdjective] самолеты"
  bftb_bulgaria_equipment_purchases.4.desc:0 "Чтобы договориться о покупке [FROM.FROM.GetAdjective] самолетов, мы должны сначала решить, какой тип самолетов мы хотим приобрести."
  bftb_bulgaria_equipment_purchases.4.a:0 "Закупить истребители"
  bftb_bulgaria_equipment_purchases.4.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_fighter]§! единиц §Yистребителей§!"
  bftb_bulgaria_equipment_purchases.4.b:0 "Закупить палубные бомбардировщики"
  bftb_bulgaria_equipment_purchases.4.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_naval_bomber]§! единиц §Yпалубных бомбардировщиков§!"
  bftb_bulgaria_equipment_purchases.4.c:0 "Закупить тактические бомбардировщики"
  bftb_bulgaria_equipment_purchases.4.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_tactical_bomber]§! единиц §Yтактических бомбардировщиков§!"
  bftb_bulgaria_equipment_purchases.5.t:0 "[BUL.GetNameDef] стремится закупить [ROOT.GetAdjective] корабли"
  bftb_bulgaria_equipment_purchases.5.a_tt:0 "Мы получим §Y1§! внекарточного §Yгражданского завода§! в качестве оплаты во время строительства [BUL.GetAdjective] кораблей."
  bftb_bulgaria_equipment_purchases.6.a_tt:0 "[FROM.GetNameDef] построит §Y3 подводных лодки§! для [ROOT.GetAdjective] флота."
  bftb_bulgaria_equipment_purchases.6.b_tt:0 "[FROM.GetNameDef] построит §Y2 эсминца§! для [ROOT.GetAdjective] флота."
  bftb_bulgaria_equipment_purchases.6.c_tt:0 "[FROM.GetNameDef] построит §Y1 легкий крейсер§! для [ROOT.GetAdjective] флота."
  bftb_bulgaria_equipment_purchases.8.t:0 "Строительство кораблей завершено - Подводные лодки"

  bftb_bulgaria_equipment_purchases.8.desc:0 "После почти года строительства три заказанные нами [FROM.GetAdjective] подводные лодки прошли ряд испытаний в море и, наконец, готовы к официальному вводу в состав ВМФ.\n Суда пришвартованы в порту [Root.GetAdjective], а их экипажи ожидают приказов."
  bftb_bulgaria_equipment_purchases.9.t:0 "Строительство кораблей завершено - Эсминцы"
  bftb_bulgaria_equipment_purchases.9.desc:0 "После почти года строительства два заказанных нами [FROM.GetAdjective] эсминца прошли ряд испытаний в море и, наконец, готовы к официальному вводу в состав ВМФ.\n Суда пришвартованы в порту [Root.GetAdjective], а их экипажи ожидают приказов."
  bftb_bulgaria_equipment_purchases.10.t:0 "Строительство кораблей завершено - Легкий крейсер"
  bftb_bulgaria_equipment_purchases.10.desc:0 "После почти года строительства заказанный нами [FROM.GetAdjective] легкий крейсер прошел ряд испытаний в море и, наконец, готов к официальному вводу в состав ВМФ.\n Судно пришвартовано в порту [Root.GetAdjective], а его экипаж ожидает приказов."
  bftb_bulgaria_scw_volunteers.1.t:0 "[ROOT.GetAdjective] добровольцы вернулись из Испании"
  bftb_bulgaria_scw_volunteers.1.desc:0 "Храбрые [ROOT.GetAdjective] добровольцы, которые сражались за свободу испанского народа в составе Интербригад, возвращаются домой [GetVictoryOrDefeatRepublicans] среди бесстрашных [ROOT.GetAdjective] воинов, возвращающихся ветеранами, находится опытный военный летчик Захари Захариев, награжденный за свои многочисленные военные подвиги и получивший высокую рекомендацию на повышение до начальника болгарских ВВС." #FROM.FROM is SCW loser // #FROM is SCW winner
  bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious:0 "ликуя после победы [FROM.GetNameDef] в гражданской войне, которая принесла так много боли испанскому народу. Среди"
  bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated:0 "опечаленные страшным поражением, которое потерпел [FROM.GetNameDef], который, наконец, поддался тирании фашизма... \nВ любом случае, среди"
  bftb_bulgaria_scw_volunteers.1.a:0 "Они возвращаются героями!"
  bftb_bulgaria_scw_volunteers.1.b:0 "Они сделали все, что могли, чтобы защитить свободу..."
  bftb_bulgaria_scw_volunteers.2.t:0 "Болгарские добровольцы возвращаются из Испании"
  bftb_bulgaria_scw_volunteers.2.desc:0 "Храбрые [ROOT.GetAdjective] добровольцы, которые сражались против большевизма и анархизма в Испании, возвращаются домой [GetVictoryOrDefeatNationalists] войска получили ценный боевой опыт, и один из наших командиров был награжден и повышен за свои выдающиеся заслуги во время войны."
  bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious:0 "как гордые победители испанской гражданской войны, в которой сам [FROM.GetLeader] высоко оценил их участие на фронте. \nНаши"

  bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated:0 "опустошенные от ужасного поражения, которое постигло [FROM.GetNameDef], и теперь полностью подчинено красным... \nВ любом случае, наша"
  bftb_bulgaria_scw_volunteers.2.a:0 "Они возвращаются настоящими ветеранами войны!"
  bftb_bulgaria_scw_volunteers.2.b:0 "Испания была лишь полигоном..."

  bftb_bulgaria_soviet_influence.1.t:0 "[ROOT.GetAdjective]-[BUL.GetAdjective] Договор о взаимопомощи"
  bftb_bulgaria_soviet_influence.1.desc:0 "[GetBulgarianLeaderToMeetStalin] встретился сегодня с [ROOT.GetLeader] в [ROOT.Capital.GetName], чтобы обсудить предложение [BUL.GetAdjective] о подписании Договора о взаимопомощи между нашими странами. С помощью этого договора [BUL.GetAdjective] правительство стремится укрепить связи с [ROOT.GetNameDef], одновременно получая поддержку, необходимую для сохранения своей целостности в эти неспокойные времена и для победы над своими враждебными соседями на Балканах."
  bftb_bulgaria_soviet_influence.1.desc_leader:0 "[BUL.GetLeader]"
  bftb_bulgaria_soviet_influence.1.desc_diplomat:0 "[BUL.GetAdjective] дипломаты"
  bftb_bulgaria_soviet_influence.1.a:0 "Подписание этого договора принесет пользу обеим странам!"
  bftb_bulgaria_soviet_influence.1.b:0 "Этот договор не в наших интересах."
  bftb_bulgaria_soviet_influence.2.t:0 "[SOV.GetNameDefCap] подписывает Договор о взаимопомощи"
  bftb_bulgaria_soviet_influence.2.desc:0 "[GetBulgarianLeaderToMeetStalin] вернулся сегодня в [ROOT.Capital.GetName] с встречи с [SOV.GetLeader], чтобы обсудить предложение о подписании Договора о взаимопомощи между [SOV.GetNameDef] и [ROOT.GetNameDef]. После долгой встречи для установления условий Договора, а также мер, которые должны быть предприняты соответствующими правительствами для сохранения этих отношений, высокопоставленные лица обеих стран подписали Договор."
  bftb_bulgaria_soviet_influence.2.a:0 "Это начало плодотворных отношений!"
  bftb_bulgaria_soviet_influence.3.t:0 "[SOV.GetNameDefCap] выходит из Договора о взаимопомощи"
  bftb_bulgaria_soviet_influence.3.desc:0 "[GetBulgarianLeaderToMeetStalin] вернулся сегодня в [ROOT.Capital.GetName] с встречи с [SOV.GetLeader], чтобы обсудить предложение о подписании Договора о взаимопомощи между [SOV.GetNameDef] и [ROOT.GetNameDef]. После долгой встречи для установления условий Договора, похоже, что не было возможности убедить [SOV.GetLeader] в необходимости этого договора, который [SOV.GetLeader.GetSheHe] категорически отказался подписать. \nПосле провала предложения в [SOV.GetNameDef], похоже, что [ROOT.GetLeader] уже взвешивает других возможных союзников для [ROOT.GetNameDef]."
  bftb_bulgaria_soviet_influence.3.a:0 "Время искать новых союзников..."
  bftb_bulgaria_soviet_influence.4.t:0 "[BUL.GetLeader] оказывает давление на [ROOT.GetLeader], чтобы тот присоединился к [BUL.GetFactionName]"

  bftb_bulgaria_soviet_influence.4.desc:0 "Правительство [BUL.GetAdjective] требует объединения балканских стран в революции против фашизма, империализма и капитализма, призывая [ROOT.GetLeader] присоединиться к [BUL.GetFactionName], создавая тем самым мощный блок сопротивления угнетающим европейским странам."
  bftb_bulgaria_soviet_influence.4.a:0 "Мы должны присоединиться к нашим болгарским и советским братьям."
  bftb_bulgaria_soviet_influence.4.b:0 "Мы не поддадимся болгарскому давлению!"
  bftb_bulgaria_soviet_influence.5.t:0 "[FROM.GetNameDefCap] Поддаётся [ROOT.GetAdjective] Давлению"
  bftb_bulgaria_soviet_influence.5.desc:0 "После необычайно интенсивных встреч и жарких дискуссий с членами правительства [FROM.GetAdjective], [FROM.GetLeader] наконец поддался нашему давлению, и [FROM.GetNameDef] присоединился к [ROOT.GetFactionName], укрепляя наш блок сопротивления фашизму, империализму и капитализму."
  bftb_bulgaria_soviet_influence.5.a:0 "Они сделали правильный выбор."
  bftb_bulgaria_soviet_influence.6.t:0 "[FROM.GetNameDefCap] Отклоняет [ROOT.GetAdjective] Требования"
  bftb_bulgaria_soviet_influence.6.desc:0 "[FROM.GetLeader] отказался встретиться с нашими дипломатами, посланными в [FROM.GetNameDef], чтобы обсудить необходимость сохранения наших стран в качестве союзников, а не разделения наших сил. Однако [FROM.GetAdjective] правительство отклонило наше предложение присоединиться к нашему союзу, тем самым четко дав понять, что сотрудничество между [ROOT.GetNameDef] и [FROM.GetNameDef] исключено, и оставив [ROOT.GetFactionName] народам мало альтернатив для решения проблемы с этой страной."
  bftb_bulgaria_soviet_influence.6.a:0 "Решение, которое принесет только разрушение [FROM.GetNameDef]..."

  bftb_bulgaria_yugoslavian_influence.1.t:0 "Болгарский договор о вечной дружбе"
  bftb_bulgaria_yugoslavian_influence.1.desc:0 "[GetBulgarianLeaderToMeetStalin] сегодня встретился с [ROOT.GetLeader] в [ROOT.Capital.GetName], чтобы обсудить [BUL.GetAdjective] предложение о подписании договора о вечной дружбе между нашими странами. С помощью этого договора [BUL.GetAdjective] правительство стремится похоронить прошлые разногласия и укрепить связи с [YUG.GetNameDef], надеясь в конечном итоге сформировать союз между двумя странами, который позволит сотрудничать и оказывать взаимную поддержку, если любой из подписантов окажется втянут в конфликт."
  bftb_bulgaria_yugoslavian_influence.1.a:0 "Подписание этого договора пойдёт на пользу обеим странам!"
  bftb_bulgaria_yugoslavian_influence.1.b:0 "Этот договор не отвечает нашим интересам."
  bftb_bulgaria_yugoslavian_influence.2.t:0 "[FROM.GetNameDefCap] Подписывает Договор о Вечной Дружбе"

  bftb_bulgaria_yugoslavian_influence.2.desc:0 "[GetBulgarianLeaderToMeetStalin] сегодня вернулся в [BUL.Capital.GetName] с встречи с [YUG.GetLeader] в [YUG.Capital.GetName], чтобы обсудить предложение о подписании Договора о вечной дружбе между [YUG.GetNameDef] и [ROOT.GetNameDef]. В конце встречи, высокопоставленные лица обеих стран подписали Договор, но оставили некоторые пункты открытыми для будущего, с взаимным желанием не только сохранить, но и расширить эти взаимовыгодные отношения."
  bftb_bulgaria_yugoslavian_influence.2.a:0 "Это укрепит обе нации!"
  bftb_bulgaria_yugoslavian_influence.3.t:0 "[FROM.GetNameDefCap] отвергает наш Договор о вечной дружбе"
  bftb_bulgaria_yugoslavian_influence.3.desc:0 "[GetBulgarianLeaderToMeetStalin] сегодня вернулся в [BUL.Capital.GetName] с встречи с [YUG.GetLeader] в [YUG.Capital.GetName], чтобы обсудить предложение о подписании Договора о вечной дружбе между [YUG.GetNameDef] и [ROOT.GetNameDef]. К сожалению, [YUG.GetLeader] не выглядел очень воодушевленным идеей подружиться с [ROOT.GetNameDef] и в конечном итоге отверг наше предложение."
  bftb_bulgaria_yugoslavian_influence.3.a:0 "Какая трата времени..."

  bftb_bulgaria_balkan_federation.1.t:0 "Проект Балканской Федерации"
  bftb_bulgaria_balkan_federation.1.desc:0 "Мы завершили подготовку проекта по созданию Балканской Федерации Социалистических Республик с целью представления его правительствам балканских стран и ведения переговоров о присоединении каждого из них, начиная с [YUG.GetNameDef]. \nОсновная цель федерации, которую будет возглавлять [ROOT.GetNameDef], - это сотрудничество всех народов Балкан в наднациональном союзе, готовом бороться с многочисленными врагами, стремящимися подчинить балканские страны. \nНо [ROOT.GetLeader] мечтает о большем: Объединенная Балканская Федерация, в которой граждане больше не будут болгарами, греками, югославами... Но свободными гражданами Балкан."
  bftb_bulgaria_balkan_federation.1.a:0 "Мечта, за которую стоит бороться!"
  bftb_bulgaria_balkan_federation.2.t:0 "[BUL.GetAdjective] проект Балканской Федерации"
  bftb_bulgaria_balkan_federation.2.desc:0 "[BUL.GetAdjective] правительство представило нам свой проект по созданию Балканской Федерации Социалистических Республик, обещая [ROOT.GetNameDef] привилегию быть первой страной, которую пригласят присоединиться к ней. \nОсновная цель федерации, которую будет возглавлять [BUL.GetNameDef], - это сотрудничество всех народов Балкан в наднациональном союзе, готовом бороться с многочисленными врагами, стремящимися подчинить балканские страны. \nСоциалистическая и коммунистическая пресса уже обнародовала информацию и поддержка Балканской Федерации и присоединения к ней [ROOT.GetNameDef] начинает распространяться среди [ROOT.GetAdjective] населения."
  bftb_bulgaria_balkan_federation.2.a:0 "Амбициозный проект..."

  bftb_bulgaria_balkan_federation.3.t:0 "Пропаганда Балканской Федерации"
  bftb_bulgaria_balkan_federation.3.desc:0 "Болгары начали пропагандистскую кампанию в [ROOT.GetNameDef] с целью убедить [ROOT.GetAdjective] население в осуществимости их обманчивого проекта по созданию Балканской Федерации Социалистических Республик. \nЛевая пресса распространила информацию, и многие люди, особенно промышленные рабочие в городах и фермеры в сельской местности, уже демонстрируют свою безоговорочную поддержку [BUL.GetAdjective] предложения."
  bftb_bulgaria_balkan_federation.3.a:0 "Смелый шаг Болгарии..."
  bftb_bulgaria_balkan_federation.4.t:0 "[BUL.GetNameDefCap] дестабилизирует [ROOT.GetNameDef]"
  bftb_bulgaria_balkan_federation.4.desc:0 "[BUL.GetAdjective] активисты пересекли границу нашей страны с целью вооружения сторонников Балканской Федерации в [ROOT.GetNameDef] и создания волнений в стране. \nСотрудники полиции день и ночь стремятся поймать и посадить в тюрьму эти подрывные элементы, но пока их усилия не были слишком плодотворны, и многие [ROOT.GetAdjective] граждане, особенно из рабочего класса, присоединились к рядам людей, которые поддерживают [BUL.GetAdjective] проект Балканской Федерации."
  bftb_bulgaria_balkan_federation.5.t:0 "Объединение Балкан"
  bftb_bulgaria_balkan_federation.5.desc:0 "[BUL.GetAdjective] правительство направило нам предложение о проведении объединения Балкан под единым централизованным управлением с целью улучшения взаимопонимания и сотрудничества между различными народами Балкан. По словам [BUL.GetLeader], это последний великий шаг Балканской Федерации, который позволит нам оставить позади конфликты прошлого и навсегда гарантировать единство и мир между нашими народами. \n[BUL.GetNameDef] ожидает ответа [ROOT.GetAdjective] правительства для продолжения последующего объединения наших народов."
  bftb_bulgaria_balkan_federation.5.a:0 "Давайте присоединимся к нашим балканским братьям!"
  bftb_bulgaria_balkan_federation.5.b:0 "Запросите помощь, прежде чем соглашаться на объединение."
  bftb_bulgaria_balkan_federation.5.c:0 "Требуйте ограниченного самоуправления."
  bftb_bulgaria_balkan_federation.5.d:0 "Мы не откажемся от [ROOT.GetAdjective] независимости и самобытности!"
  bftb_bulgaria_balkan_federation.5.d_consequences_tt:0 "§ROтказ может привести к тому, что [FROM.GetNameDef] исключит нас из [FROM.GetFactionName] или даже выставит нам цель войны!§!"
  bftb_bulgaria_balkan_federation.6.t:0 "[FROM.GetNameDefCap] интегрирован в [ROOT.GetNameDef]"
  bftb_bulgaria_balkan_federation.6.desc:0 "[FROM.GetAdjective] правительство приняло наше предложение об объединении и присоединилось к Объединенной Балканской Федерации. Бывшие [FROM.GetAdjective] граждане теперь станут свободными балканскими гражданами, которые доверились мечте [ROOT.GetLeader] о единых Балканах."
  bftb_bulgaria_balkan_federation.6.a:0 "Мечта сбывается!"

  bftb_bulgaria_balkan_federation.7.t:0 "[FROM.GetNameDefCap] просит промышленную помощь"
  bftb_bulgaria_balkan_federation.7.desc:0 "[FROM.GetAdjective] правительство согласилось присоединиться к нашей Объединенной Балканской Федерации. Однако, перед тем, как приступить к объединению, [FROM.GetNameDef] нуждается в помощи для развития своей неразвитой национальной промышленности. [FROM.GetLeader] заверил, что как только промышленное развитие страны будет усилено, [FROM.GetNameDef] с радостью присоединится к великой Объединенной Балканской Федерации."
  bftb_bulgaria_balkan_federation.7.a:0 "Мы должны оказать промышленную помощь [FROM.GetAdjective]."
  bftb_bulgaria_balkan_federation.8.t:0 "[FROM.GetNameDefCap] просит экономическую помощь"
  bftb_bulgaria_balkan_federation.8.desc:0 "[FROM.GetAdjective] правительство согласилось присоединиться к нашей Объединенной Балканской Федерации, однако, перед тем, как приступить к объединению, [FROM.GetNameDef] отчаянно нуждается в финансовой помощи, чтобы предотвратить крах своей бедствующей экономики. [FROM.GetLeader] заверил, что как только страна получит экономический стимул для восстановления и ситуация улучшится, [FROM.GetNameDef] с радостью присоединится к великой Объединенной Балканской Федерации."
  bftb_bulgaria_balkan_federation.8.a:0 "Мы должны оказать экономическую помощь [FROM.GetAdjective]."
  bftb_bulgaria_balkan_federation.9.t:0 "[FROM.GetNameDefCap] просит военной помощи"
  bftb_bulgaria_balkan_federation.9.desc:1 "[FROM.GetAdjective] правительство согласилось присоединиться к нашей Объединенной Балканской Федерации, однако, перед тем, как приступить к объединению, [FROM.GetNameDef] нуждается в военной помощи, чтобы укрепить свои ненадежные вооруженные силы перед проведением операции по ликвидации нескольких диссидентских ячеек в различных сельских городах вокруг [FROM.Capital.GetName]. [FROM.GetLeader] заверил, что после завершения операции [FROM.GetNameDef] с радостью присоединится к великой Объединенной Балканской Федерации."
  bftb_bulgaria_balkan_federation.9.a:0 "Мы должны оказать военную помощь [FROM.GetAdjective]."
  bftb_bulgaria_balkan_federation.10.t:0 "[FROM.GetNameDefCap] требует определенных прав на самоопределение"
  bftb_bulgaria_balkan_federation.10.desc:0 "Сегодня в [ROOT.Capital.GetName] прибыла [FROM.GetAdjective] делегация во главе с [FROM.GetLeader], чтобы обсудить с [ROOT.GetLeader] условия вступления [FROM.GetNameDef] в Объединенную Балканскую Федерацию. Похоже, [FROM.GetAdjective] правительство желает сохранить некоторую независимость и права на самоуправление в составе Федерации, но готово присоединиться к ней в качестве ассоциированного члена с определенной степенью автономии."
  bftb_bulgaria_balkan_federation.10.a:0 "Согласен!"
  bftb_bulgaria_balkan_federation.11.t:0 "[FROM.GetNameDefCap] отклонил наше предложение"

  bftb_bulgaria_balkan_federation.11.desc:1 "Правительство [FROM.GetAdjective] отказалось присоединиться к нашей Объединенной Балканской Федерации, хотя оно решительно настроено сохранить союз между нашими странами. \nОднако [FROM.GetLeader] публично заявил, что реакция болгарского правительства на отказ [FROM.GetAdjective] покажет, была ли истинная скрытая цель Федерации заключалась в расширении границ Болгарии за пределы воображаемого, или же Болгария действительно стремится к сотрудничеству между балканскими странами независимо от условий их членства в Федерации, но что в любом случае [FROM.GetNameDef] никогда не откажется от своей независимости или своей культурной идентичности."
  bftb_bulgaria_balkan_federation.11.a:0 "Мы уважаем их решение."
  bftb_bulgaria_balkan_federation.11.b:0 "Как мы можем сотрудничать с правительством, которое нам не доверяет?"
  bftb_bulgaria_balkan_federation.11.c:0 "[FROM.GetLeader] зашел слишком далеко со своей речью!"
  bftb_bulgaria_balkan_federation.12.t:0 "[FROM.GetNameDefCap] требует [ROOT.GetAdjective] территорий на Балканах"
  bftb_bulgaria_balkan_federation.12.desc:0 "Болгарское правительство направило дипломатическую миссию с требованием о передаче [ROOT.GetAdjective] территорий на Балканах балканским странам, которые, по мнению болгар, законно им принадлежат. Делегаты от [BUL.GetNameDef] поддерживали в целом дружелюбный тон, хотя некоторые наши дипломаты утверждают, что они заметили определенные угрожающие коннотации, особенно в связи с первоначальным отказом итальянских министров."
  bftb_bulgaria_balkan_federation.12.a:0 "Мы выполним их требования, чтобы сохранить мир..."
  bftb_bulgaria_balkan_federation.12.a_state_transfering_tt:0 "Штат будет передан законному балканскому владельцу."
  bftb_bulgaria_balkan_federation.12.b:0 "[ROOT.GetNameDef] не поддастся болгарскому давлению!"
  bftb_bulgaria_balkan_federation.12.b_tt:0 "Может привести к следующим последствиям:"
  bftb_bulgaria_balkan_federation.13.t:0 "[ITA.GetNameDefCap] поддается нашим требованиям"
  bftb_bulgaria_balkan_federation.13.desc:0 "После продолжительной и интенсивной встречи с нашей дипломатической делегацией, посланной для переговоров о передаче итальянских территорий на Балканах, [ITA.GetLeader] поддался болгарскому давлению и официально передал контроль над итальянскими штатами на Балканах тем странам, которым они законно принадлежат."
  bftb_bulgaria_balkan_federation.13.a:0 "Мудрое решение [ITA.GetLeader]."
  bftb_bulgaria_balkan_federation.14.t:0 "Болгарский арбитраж на Балканских территориях"

  bftb_bulgaria_balkan_federation.14.desc:0 "Правительство [BUL.GetAdjective] направило дипломатическую миссию в [ITA.GetNameDef], чтобы потребовать уступки [ITA.GetAdjective] территорий на Балканах.\nПосле долгой встречи [ITA.GetLeader] уступил давлению [BUL.GetAdjective] и согласился передать контроль над [ITA.GetAdjective] государствами на Балканах тем народам, которым они по праву принадлежат, что влечёт за собой некоторые территориальные приобретения для [ROOT.GetNameDef]."
  bftb_bulgaria_balkan_federation.14.a:0 "Мы должны поблагодарить болгар за это!"
  bftb_bulgaria_balkan_federation.15.t:0 "[ITA.GetNameDefCap] отказывается отдать Балканские территории"
  bftb_bulgaria_balkan_federation.15.desc:0 "После долгой встречи с нашей делегацией, отправленной для переговоров об уступке [ITA.GetAdjective] территорий на Балканах тем народам, которым они по праву принадлежат, [ITA.GetLeader] наконец отказался слушать [ROOT.GetAdjective] дипломатов, заявив, что каждая территория, оккупированная [ITA.GetNameDef] на Балканах, по праву принадлежит [ITA.GetAdjective] народу."
  bftb_bulgaria_balkan_federation.15.a:0 "Тогда мы сами возьмём эти территории!"
  bftb_bulgaria_balkan_federation.15.b:0 "Мы разберёмся с [ITA.GetAdjective] позже..."
  bftb_bulgaria_balkan_federation.16.t:0 "[BUL.GetNameDefCap] требует все [ROOT.GetAdjective] территории на Балканах"
  bftb_bulgaria_balkan_federation.16.desc:0 "Правительство [BUL.GetAdjective] направило дипломатическую миссию, чтобы потребовать уступки [ROOT.GetAdjective] территорий на Балканах, которые, по мнению [BUL.GetAdjective], по праву принадлежат им.\nДелегаты из [BUL.GetNameDef] в целом сохраняли дружелюбный тон, хотя некоторые из наших дипломатов утверждают, что ощущали определённые угрожающие коннотации, особенно в свете первоначального отказа [ROOT.GetAdjective] министров."
  bftb_bulgaria_balkan_federation.16.a:0 "Мы должны любой ценой избежать начала новой Балканской войны..."
  bftb_bulgaria_balkan_federation.16.b:0 "[BUL.GetLeader] должен страдать от бреда величия!"
  bftb_bulgaria_balkan_federation.17.t:0 "[TUR.GetNameDefCap] отдает Балканские территории"
  bftb_bulgaria_balkan_federation.17.desc:0 "После необычайно напряженной встречи с нашей дипломатической делегацией, отправленной для переговоров об [TUR.GetAdjective] уступке своих Балканских территорий, [TUR.GetLeader] уступил давлению [ROOT.GetAdjective] и официально передал контроль над [TUR.GetAdjective] государствами на Балканах [ROOT.GetNameDef]."
  bftb_bulgaria_balkan_federation.17.a:0 "Мы будем праздновать!"
  bftb_bulgaria_balkan_federation.18.t:0 "[TUR.GetNameDefCap] отказывается отдать Балканские территории"

  bftb_bulgaria_balkan_federation.18.desc:0 "После чрезвычайно напряженной встречи с нашей делегацией, отправленной для переговоров о передаче [TUR.GetAdjective] территорий на Балканах [ROOT.GetNameDef], [TUR.GetLeader] окончательно отказался слушать наших дипломатов, заявив, что [TUR.GetNameDef] веками контролировал эти территории, и поэтому они являются законными собственниками."
  bftb_bulgaria_balkan_federation.18.a:0 "Тогда нам придется действовать силой!"

  bftb_bulgaria_balkan_federation_project_ready_tt:0 "£GFX_trigger_yes Проект Балканской Федерации готов."
  bftb_bulgaria_balkan_federation.7_tt:0 "Эффекты после завершения решения:\n"
  BUL_italy_yields_states_to_root_tt:0 "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! передаёт контроль над следующими штатами §Y[ROOT.GetNameDef]§!: "
  BUL_italy_yields_states_to_others_tt:0 "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! передаёт контроль над следующими штатами §Yдругим балканским странам§!: "
  bftb_bulgaria_balkan_federation_turkish_states_tt:0 "[BUL.GetFlag]§Y[BUL.GetNameDefCap]§! становится владельцем и контролером: "

  bftb_bulgaria_fate_of_the_balkans.1.t:0 "[BUL.GetNameDefCap] Требует, чтобы мы присоединились к [BUL.GetFactionName]"
  bftb_bulgaria_fate_of_the_balkans.1.desc:0 "Сегодня в столицу прибыл [BUL.GetAdjective] посол, чтобы встретиться с [ROOT.GetLeader] и по сути потребовать вступления [ROOT.GetNameDef] в [BUL.GetFactionName]. По словам [GetBulgarianLeader], [BUL.GetNameDef] будет развивать программы сотрудничества в сфере исследований и обороны, а также гарантирует безопасность и суверенитет всех государств-членов альянса. Однако, предупредил дипломат, любое балканское государство, которое откажется присоединиться к альянсу, будет считаться врагом."
  BUL_leader_is_tsar:0 "Царь [BUL.GetLeader]"
  BUL_leader_is_regency_council:0 "Болгарский регентский совет"
  BUL_leader_is_a_politician:0 "[BUL.GetLeader]"
  bftb_bulgaria_fate_of_the_balkans.1.a:0 "[ROOT.GetNameDefCap] должен присоединиться к [BUL.GetFactionName]"
  bftb_bulgaria_fate_of_the_balkans.1.b:0 "Мы не поддадимся пустым угрозам!"
  bftb_bulgaria_fate_of_the_balkans.2.t:0 "[FROM.GetNameDefCap] Соглашается присоединиться к [BUL.GetFactionName]"
  bftb_bulgaria_fate_of_the_balkans.2.desc:0 "Посол, посланный, чтобы убедить правительство [FROM.GetName] присоединиться к [BUL.GetFactionName], сегодня вернулся из [FROM.GetAdjective] столицы с хорошими новостями: [FROM.GetLeader] согласился с нашими требованиями, и [FROM.GetHerHis] страна наконец присоединилась к нашему альянсу."
  bftb_bulgaria_fate_of_the_balkans.2.a:0 "[BUL.GetFactionName] растет!"
  bftb_bulgaria_fate_of_the_balkans.3.t:0 "[FROM.GetNameDefCap] Отказывается присоединиться к [BUL.GetFactionName]"

  bftb_bulgaria_fate_of_the_balkans.3.desc:0 "Посланник, отправленный с требованием присоединения [FROM.GetName] к [BUL.GetFactionName], сообщил, что [FROM.GetLeader] решил не вступать в наш союз, очевидно, не осознавая, несмотря на предупреждения нашего дипломата, роковую судьбу, ждущую [FROM.GetNameDef] за неповиновение командам [BUL.GetAdjective]."
  bftb_bulgaria_fate_of_the_balkans.3.a:0 "[FROM.GetLeader] оказался дураком..."
  bftb_bulgaria_fate_of_the_balkans.4.t:0 "[BUL.GetNameDefCap] требует [FROM.FROM.GetName]"
  bftb_bulgaria_fate_of_the_balkans.4.desc:0 "[BUL.GetAdjective] дипломатическая миссия[GetBulgarianLeaderDiplomaticMission] прибыла в нашу столицу, чтобы договориться о передаче [FROM.FROM.GetName] [BUL.GetNameDef], к которой, как они утверждают, она законно принадлежит."
  BUL_tsar_leads_diplomatic_mission:0 ", во главе с самим царем [BUL.GetLeader],"
  BUL_politician_leads_diplomatic_mission:0 ", во главе с самим [BUL.GetLeader],"
  BUL_bulgarian_government:0 ""
  bftb_bulgaria_fate_of_the_balkans.4.a:0 "Мы не в состоянии отказать..."
  bftb_bulgaria_fate_of_the_balkans.4.b:0 "Этому не бывать!"
  bftb_bulgaria_fate_of_the_balkans.5.t:0 "[FROM.GetNameDefCap] принимает [BUL.GetAdjective] контроль над [FROM.FROM.FROM.GetName]"
  bftb_bulgaria_fate_of_the_balkans.5.desc:0 "После продолжительной дискуссии с [BUL.GetAdjective] дипломатической миссией, отправленной в [FROM.GetAdjective] столицу, [FROM.GetLeader] согласился передать [FROM.FROM.FROM.GetName] Болгарии."
  bftb_bulgaria_fate_of_the_balkans.5.a:0 "[FROM.FROM.FROM.GetName] наконец вернулся туда, где ему и место"
  bftb_bulgaria_fate_of_the_balkans.6.t:0 "[FROM.GetNameDefCap] отказывается передавать [FROM.FROM.FROM.GetName] [BUL.GetNameDef]"
  bftb_bulgaria_fate_of_the_balkans.6.desc:0 "После нескольких часов бурных обсуждений с [BUL.GetAdjective] дипломатической миссией, отправленной в [FROM.GetAdjective] столицу, [FROM.GetLeader] упорно отказался передать [FROM.FROM.FROM.GetName] [BUL.GetNameDef]."
  bftb_bulgaria_fate_of_the_balkans.6.a:0 "Глупое решение [FROM.GetLeader]..."
  bftb_bulgaria_fate_of_the_balkans.7.t:0 "[BUL.GetNameDefCap] требует [ROOT.GetAdjective] подчинения"
  bftb_bulgaria_fate_of_the_balkans.7.desc:0 "Наконец, [BUL.GetAdjective] правительство показало свои истинные намерения и направило делегацию с требованием признать [BUL.GetNameDef] сюзереном [ROOT.GetNameDef], что подразумевало бы безоговорочное подчинение [ROOT.GetAdjective] правительства правлению [GetBulgarianLeader]."
  bftb_bulgaria_fate_of_the_balkans.7.a:0 "Мы не в состоянии отказать..."
  bftb_bulgaria_fate_of_the_balkans.7.b:1 "[ROOT.GetNameDefCap] никогда не покорится иностранным державам!"
  bftb_bulgaria_fate_of_the_balkans.8.t:0 "[FROM.GetNameDefCap] подчиняется [BUL.GetNameDef]"

  bftb_bulgaria_fate_of_the_balkans.8.desc:0 "С момента вступления [FROM.GetNameDef] в [BUL.GetFactionName], мы лоббировали их правительство, чтобы оно подчинилось [GetBulgarianLeader], и после недавних подкупов и принуждения нескольких [FROM.GetAdjective] министров, [FROM.GetLeader] был вынужден подписать договор, официально признающий [BUL.GetNameDef] своим сюзереном, и с помощью которого [FROM.GetAdjective] народ был наконец-то подчинен."
  bftb_bulgaria_fate_of_the_balkans.8.a:0 "[FROM.GetAdjective] знают свое место."
  bftb_bulgaria_fate_of_the_balkans.9.t:0 "[FROM.GetNameDefCap] отказывается подчиняться [BUL.GetNameDef]"
  bftb_bulgaria_fate_of_the_balkans.9.desc:0 "Неожиданно правительство [FROM.GetAdjective] решило бросить вызов [GetBulgarianLeader]. [FROM.GetLeader] публично заявил сегодня, что отказывается подчиняться [BUL.GetAdjective] правительству. Смелое решение, поддержанное большинством [FROM.GetAdjective] народа, но все равно безрассудное, так как они нуждаются в нашей защите, если их жалкое государство должно выжить в грядущих конфликтах, и после этого [GetBulgarianLeader] уже пересматривает членство [FROM.GetAdjective] в [BUL.GetFactionName]..."
  bftb_bulgaria_fate_of_the_balkans.9.a:0 "Мы должны продолжать давить на них!"
  bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt:0 "Решение §YПодчинить [FROM.GetName]§! снова будет доступно через §R365 дней§!"
  bftb_bulgaria_fate_of_the_balkans.9.b:0 "Их неповиновение не останется безнаказанным!"
  bftb_bulgaria_fate_of_the_balkans.10.t:0 "[BUL.GetNameDefCap] принудил [FROM.GetNameDef] присоединиться к [BUL.GetFactionName]"
  bftb_bulgaria_fate_of_the_balkans.10.desc:0 "После получения ультиматума от [BUL.GetAdjective] правительства, [FROM.GetLeader] из [FROM.GetNameDef], очевидно, вынужденный угрозами в адрес своей страны, своих министров и даже себя, поддался [BUL.GetAdjective] давлению и объявил, что [FROM.GetNameDef] немедленно покинет [ROOT.GetFactionName] и присоединится к [BUL.GetFactionName]."
  bftb_bulgaria_fate_of_the_balkans.10.a:0 "[BUL.GetNameDef] заплатит за это!"
  bftb_bulgaria_fate_of_the_balkans.10.b:0 "Жалкие выборы жалкого лидера..."
  BUL_transferred_bulgarian_state_autonomy_desc:0 "Передал территории, претендуемые Болгарией."

  bftb_bulgaria_political_leaders.1.t:0 "Убийство Христо Лукова"

  bftb_bulgaria_political_leaders.1.desc:0 "Прошлым вечером [GetLukovLeader] был атакован двумя [GetLukovPartisans], которые следовали за ним от Королевского кинотеатра до его дома на Артиллерийской улице, 1. \nКогда политический лидер собирался войти в дом, один из [GetLukovCriminals] выстрелил в него с близкого расстояния и попал ему в плечо, после чего Луков схватил его и прижал к стене, затем попытался отступить в здание, но [GetLukovSecondAssailant], выстрелил ему в спину, затем подобрал свой [GetLukovAccomplice] и скрылся во дворе соседнего дома, оставив смертельно раненного Христо Лукова у входа в его дом. \n[GetLukovConclusion]"
  bftb_bulgaria_political_leaders.1.a:0 "Назначить нового лидера из рядов УБНЛ."
  bftb_bulgaria_political_leaders.1.b:0 "Нам нужен кто-нибудь с более радикальной идеологией... Назначьте Александра Цанкова!"
  bftb_bulgaria_political_leaders.1.c:0 "Мир лучше без него!"
  bftb_bulgaria_political_leaders.1.d:0 "Трагично..."
  BUL_hristo_lukov_death_leader_party:0 "Христо Луков, лидер Союза болгарских национальных легионов,"
  BUL_hristo_lukov_death_leader_country:0 "[ROOT.GetAdjective] лидер Христо Луков"
  BUL_hristo_lukov_death_partisans_communism:0 "члены боевых групп, организованных Болгарской коммунистической партией, которые"
  BUL_hristo_lukov_death_partisans_other:0 "партизаны, которые, по сообщениям"
  BUL_hristo_lukov_death_criminals_communism:0 "партизаны, Иван Буруджиев,"
  BUL_hristo_lukov_death_criminals_other:0 "преступники"
  BUL_hristo_lukov_death_second_assailant_communism:0 "Виолета Якова, второй агент, все еще незамеченный жертвой"
  BUL_hristo_lukov_death_second_assailant_other:0 "второй нападавший, незамеченный жертвой, который, по словам очевидцев, был женщиной"
  BUL_hristo_lukov_death_accomplice_communism:0 "товарищ"
  BUL_hristo_lukov_death_accomplice_other:0 "соучастник"
  BUL_hristo_lukov_death_conclusion_communism:0 ""
  BUL_hristo_lukov_death_conclusion_other:0 "Наша служба национальной безопасности уже ищет убийц, но мы должны заботиться о будущем нации и назначить нового человека, чтобы заменить Христо Лукова на посту лидера [ROOT.GetNameDef]."
  bftb_bulgaria_greek_influence.1.t:0 "[BUL.GetNameDefCap] обращается к [GRE.GetAdjective] правительству"
  bftb_bulgaria_greek_influence.1.desc:0 "[BUL.GetAdjective] премьер-министр, [BUL.GetLeader], встретился с [ROOT.GetLeader], чтобы предложить формализацию дружественных отношений между [BUL.GetNameDef] и [ROOT.GetNameDef] посредством мирного соглашения. [BUL.GetAdjective] лидер также предложил определенные налоговые льготы [ROOT.GetAdjective] капиталистам, которые хотят создать филиалы в соседней стране."
  bftb_bulgaria_greek_influence.1.a:0 "[GRE.GetNameDefCap] и [BUL.GetNameDef] будут сотрудничать с этого момента!"
  bftb_bulgaria_greek_influence.1.b:0 "Мы не можем доверять [BUL.GetAdjective]!"
  bftb_bulgaria_greek_influence.2.t:0 "[FROM.GetNameDefCap] соглашается на наше предложение"

  bftb_bulgaria_greek_influence.2.desc:0 "Лидер [FROM.GetAdjective] [FROM.GetLeader] принял наше предложение и готов оформить наши дружеские отношения договором, который обеспечит мир между [BUL.GetNameDef] и [FROM.GetNameDef]."
  bftb_bulgaria_greek_influence.2.a:1 "[BUL.GetNameDefCap] и [GRE.GetNameDef] будут сотрудничать с этого момента!"
  bftb_bulgaria_greek_influence.3.t:0 "Правительство [FROM.GetAdjective] отклонило наше предложение"
  bftb_bulgaria_greek_influence.3.desc:0 "Лидер [FROM.GetAdjective] [FROM.GetLeader] заявил, что не доверяет этой новой политике мира [BUL.GetAdjective] и поэтому отклонил наше предложение о формализации дружеских отношений между [FROM.GetNameDef] и [BUL.GetNameDef]."
  bftb_bulgaria_greek_influence.3.a:0 "Они слишком горды, чтобы понять необходимость сотрудничества!"
  bftb_bulgaria_british_influence.1.t:0 "Правительство [BUL.GetAdjective] ищет нашей защиты"
  bftb_bulgaria_british_influence.1.desc:0 "Болгарский премьер-министр [BUL.GetLeader] прибыл в нашу страну, чтобы заключить соглашение с [ENG.GetNameDef], стремясь формализовать обязательства нашей страны защищать болгарскую территорию. \nПо словам [BUL.GetLeader], его партия желает укрепить связи с [ENG.GetAdjective] правительством, но опасается за территориальную целостность [BUL.GetNameDef], если они откажут другим великим державам с угрожающими амбициями на Балканах, таким как [GER.GetAdjective]ы, [ITA.GetAdjective]ы и [SOV.GetAdjective]ы."
  bftb_bulgaria_british_influence.1.a:0 "Мы возьмем [BUL.GetNameDef] под [ENG.GetAdjective] защиту."
  bftb_bulgaria_british_influence.1.b:0 "Мы согласны подписать пакт о ненападении."
  bftb_bulgaria_british_influence.1.c:0 "У нас есть более важные дела."
  bftb_bulgaria_british_influence.2.t:0 "[FROM.GetNameDefCap] соглашается гарантировать независимость [BUL.GetAdjective]"
  bftb_bulgaria_british_influence.2.desc:0 "Правительство [FROM.GetAdjective] согласилось подписать договор, предложенный [BUL.GetLeader], гарантирующий независимость нашей страны и стремящийся к дальнейшему улучшению наших отношений в будущем."
  bftb_bulgaria_british_influence.2.a:0 "Теперь мы под [ENG.GetAdjective] защитой!"
  bftb_bulgaria_british_influence.3.t:0 "[FROM.GetNameDefCap] соглашается подписать пакт о ненападении"
  bftb_bulgaria_british_influence.3.desc:0 "Хотя [FROM.GetAdjective] правительство согласилось подписать договор между [BUL.GetNameDef] и [FROM.GetNameDef], [FROM.GetLeader] отказался официально гарантировать независимость нашей страны, заявив, что такое действие может иметь серьезные дипломатические последствия, которые усугубят ситуацию не только на Балканах, но и во всей Европе. \nТем не менее, [FROM.GetAdjective] лидер, похоже, заинтересован в развитии дружеских отношений и поощрении сотрудничества между нашими странами."
  bftb_bulgaria_british_influence.3.a:0 "Это начало!"

  bftb_bulgaria_british_influence.4.t:0 "[ENG.GetNameDefCap] Отклонил наше предложение"
  bftb_bulgaria_british_influence.4.desc:0 "[FROM.GetAdjective] правительство показало, что у него нет интереса к укреплению связей с нашей нацией, и полностью отвергло наше предложение формализовать соглашение о поддержке независимости [BUL.GetNameDef] и развитии сотрудничества между нашими странами."
  bftb_bulgaria_british_influence.4.a:0 "Проклятые британцы и их упрямство!"
  bftb_bulgaria_democratic_international_policies.1.t:0 "[BUL.GetNameDefCap] Гарантирует [ROOT.GetAdjective] Независимость"
  bftb_bulgaria_democratic_international_policies.1.desc:0 "[BUL.GetAdjective] правительство сегодня объявило, что долг [BUL.GetNameDef] - защищать территориальную целостность дружественных балканских наций от амбиций разжигающих войну иностранных держав. \nС этой целью премьер-министр [BUL.GetLeader] провозгласил приверженность [BUL.GetNameDef] защите [ROOT.GetAdjective] нации, а также реализацию ряда новых мер по подготовке к обороне Балкан."
  bftb_bulgaria_democratic_international_policies.1.a:0 "Очень любезно с их стороны!"
  bftb_bulgaria_democratic_international_policies.2.t:0 "[BUL.GetAdjective] Промышленные Инвестиции"
  bftb_bulgaria_democratic_international_policies.2.desc:0 "[BUL.GetAdjective] магнаты сделали несколько инвестиций в нашу страну, развивая ряд дочерних компаний, которые повысят нашу национальную промышленность. \nНесомненно, это часть более крупной схемы, разработанной [BUL.GetAdjective] правительством, чтобы увеличить свое влияние и распространить свои капиталистические идеи в нашей стране, но пока мы можем извлечь выгоду из этого небольшого промышленного расширения."
  bftb_bulgaria_democratic_international_policies.2.a:0 "Думают, что могут так легко повлиять на нашу политику?"
  bftb_bulgaria_democratic_international_policies.3.t:0 "[BUL.GetAdjective] Вливание Капитала"
  bftb_bulgaria_democratic_international_policies.3.desc:0 "[BUL.GetAdjective] правительство предоставило финансовую поддержку испытывающим трудности [ROOT.GetAdjective] компаниям, чтобы стабилизировать финансовые сектора нашей страны. \nОднако ни один из наших министров не настолько наивен, чтобы на секунду поверить, что это действие могло быть мотивировано солидарностью или сочувствием. Ясно, что с помощью этого вливания капитала [BUL.GetAdjective] правительство просто стремится усилить свой контроль над нашей экономикой."
  bftb_bulgaria_democratic_international_policies.3.a:0 "Мы должны быть осторожны..."
  bftb_bulgaria_democratic_international_policies.4.t:0 "[BUL.GetAdjective] Территориальная Целостность"
  bftb_bulgaria_democratic_international_policies.4.desc:0 "Делегация из [BUL.GetNameDef] прибыла в нашу страну с просьбой к [ROOT.GetLeader] признать легитимность [BUL.GetAdjective] правительства на бывших болгарских территориях, в настоящее время оккупированных войсками союзников, и, следовательно, вернуть административный контроль над регионом [BUL.GetNameDef]."

  bftb_bulgaria_democratic_international_policies.4.a:0 "Правительство [ROOT.GetAdjective] признает территориальную целостность Болгарии!"
  bftb_bulgaria_democratic_international_policies.4_tt:0 "§Y[BUL.GetNameWithFlag]§! становится владельцем и контролером:"
  bftb_bulgaria_democratic_international_policies.4.b:0 "Это невозможно."
  bftb_bulgaria_democratic_international_policies.5.t:0 "[ENG.GetNameDefCap] Признает территориальную целостность Болгарии"
  bftb_bulgaria_democratic_international_policies.5.desc:0 "Наша делегация, отправленная в [ENG.GetNameDef], вернулась, успешно выполнив свою петицию к [ENG.GetAdjective] правительству, которое согласилось вернуть административный контроль над бывшими болгарскими территориями, оккупированными войсками союзников, [BUL.GetNameDef]."
  bftb_bulgaria_democratic_international_policies.5.a:0 "Наш народ ликует от этой новости!"
  bftb_bulgaria_democratic_international_policies.6.t:0 "[ENG.GetNameDefCap] Отказалось признавать территориальную целостность Болгарии"
  bftb_bulgaria_democratic_international_policies.6.desc:0 "К сожалению, наша делегация, отправленная в [ENG.GetNameDef], не смогла добиться от [ENG.GetAdjective] правительства предоставления нам административного контроля над бывшими болгарскими территориями, в настоящее время оккупированными войсками союзников."
  bftb_bulgaria_democratic_international_policies.6.a:0 "Они нарушают нашу территориальную целостность!"
  bftb_bulgaria_democratic_international_policies.7.t:0 "[ENG.GetAdjective]-[BUL.GetAdjective] Пакт"
  bftb_bulgaria_democratic_international_policies.7.desc:0 "Правительство [ENG.GetAdjective] направило дипломатическую делегацию, чтобы сообщить нам, что оно согласилось вернуть административный контроль над бывшими болгарскими территориями, оккупированными нашими войсками, правительству [BUL.GetNameDef] с немедленным вступлением в силу. \nСтолкнувшись с такими событиями и потерпев неудачу в попытке обсудить это решение с [ENG.GetAdjective], наше правительство было вынуждено отказаться от контроля над этими оккупированными территориями, чтобы сохранить дружественные отношения с нашими союзниками."
  bftb_bulgaria_democratic_international_policies.7.a:0 "Это оскорбление для [ROOT.GetNameDef]"

  bftb_news.1.t:0 "[BUL.GetAdjective] правительство осуждает ВМРО"
  bftb_news.1.desc:0 "Ранее сегодня [BUL.GetAdjective] лидер [BUL.GetLeader] сделал официальное заявление, показывающее его неприятие Внутренней македонской революционной организации и публично осуждающее их действия. \n[BUL.GetAdjective] Министр внутренних дел также объявил о реализации пакета чрезвычайных мер, который позволит правительству выделить больше ресурсов для принятия активных мер против ВМРО и уничтожения этой террористической организации раз и навсегда. \nС этим заявлением, кажется, наконец, [BUL.GetAdjective] правительство стремится положить конец одному из самых больших источников конфликтов и напряженности на Балканах..."
  bftb_news.1.a:0 "Давно пора!"
  bftb_news.1.b:0 "Пора уничтожить ВМРО!"

  bftb_news.1.c:0 "Похоже, дни ВМОРО сочтены..."
  bftb_news.2.t:0 "$BUL.GetAdjective$ правительство поддерживает ВМОРО"
  bftb_news.2.desc:0 "Ранее сегодня, лидер $BUL.GetAdjective$ [BUL.GetLeader] публично объявил, что правительство будет стремиться к переговорам с Иваном Михайловым, одним из самых влиятельных лидеров Внутренней македонской революционной организации, о прекращении боевых действий между ВМОРО и $BUL.GetAdjective$ властями. По словам министра внутренних дел, [BUL.GetNameDef] должны сотрудничать с этой организацией, чтобы освободить множество македонцев, проживающих в [YUG.GetNameDef] и [GRE.GetNameDef], смелое заявление, которое, несомненно, вновь раздует балканский конфликт и усилит напряженность между великими державами, имеющими интересы в регионе..."
  bftb_news.2.a:0 "Болгары играют с огнем!"
  bftb_news.2.b:0 "Мы делаем то, что лучше для Болгарии."
  bftb_news.2.c:0 "Похоже, балканский конфликт вот-вот разгорится..."
  bftb_news.3.t:0 "Смерть царя Бориса III Болгарского"
  bftb_news.3.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
  bftb_news.3.a:0 "Теперь он покоится с миром... В отличие от своей страны!"
  bftb_news.4.t:0 "Возвращение царя Фердинанда I"
  bftb_news.4.desc:0 "После смерти царя Болгарии Бориса III болгарское правительство приняло неожиданное решение встретиться с отцом Бориса и бывшим царем Фердинандом I, чтобы попросить его снова взять на себя руководство страной.\nПосле продолжительной конференции с [GetFormerLeaderBeforeFerdinand], Фердинанд I, воинственный правитель, который был вынужден отречься от престола в пользу своего сына после катастрофических поражений во Второй Балканской войне и Первой мировой войне, согласился вернуться в Софию, чтобы снова быть коронованным царем Болгарии."
  bftb_news.4.a:0 "Он - правитель, который нужен [BUL.GetNameDef]!"
  bftb_news.4.b:0 "Разве этот дряхлый старик способен править?"
  bftb_news.4.c:0 "Неожиданный поворот событий..."
  BUL_former_leader_before_ferdinand_kyoseivanov:0 "Премьер-министр Георгий Кьосеиванов"
  BUL_former_leader_before_ferdinand_filov:0 "Премьер-министр Богдан Филов"
  BUL_former_leader_before_ferdinand_mushanov:0 "Премьер-министр Никола Мушанов"
  BUL_former_leader_before_ferdinand_lukov:0 "Премьер-министр Христо Луков"
  BUL_former_leader_before_ferdinand_tsankov:0 "Премьер-министр Александр Цанков"
  BUL_former_leader_before_ferdinand_generic:0 "болгарский премьер-министр"
  bftb_news.5.t:1 "Болгарская кампания по реинтеграции на Балканах"
  bftb_news.5.desc:1 "$BUL.GetAdjective$ правительство начало масштабную кампанию по реинтеграции на оккупированных территориях на Балканах, поощряя заселение болгар, меняя названия городов и мест на традиционные болгарские формы и реорганизуя местное управление по болгарским образцам.\nС помощью этих мер, [BUL.GetLeader] надеется продемонстрировать болгарский характер этих регионов и легитимизировать их будущую аннексию [BUL.GetNameDef]."

  bftb_news.5.a:0 "[BUL.GetAdjective] суверенитет над этими территориями больше не обсуждается!"
  bftb_news.5.b:1 "Как они смеют уничтожать [THIS.GetAdjective] культуру?!"
  bftb_news.5.c:0 "Смелый шаг болгар..."
  bftb_news.6.t:0 "Восстановление Болгарского патриархата"
  bftb_news.6.desc:0 "При поддержке правительства Болгарский экзархат оказал давление на Константинопольского патриарха, чтобы тот признал автокефалию Болгарской Православной Церкви. \nСтолкнувшись с такими требованиями, подкрепленными угрозами [BUL.GetLeader], Константинопольский патриарх был вынужден разрешить Священному Синоду принять новый Устав, с помощью которого он сможет избирать главу Болгарской Церкви и таким образом, после более чем семи веков, восстановить Болгарский патриархат."
  bftb_news.6.a:0 "Это достижение приносит радость всем болгарам!"
  bftb_news.6.b:0 "Интересное развитие событий..."
  bftb_news.7.t:0 "Третья Болгарская империя"
  bftb_news.7.desc:0 "Вчера в Софии состоялся массовый политический митинг, организованный болгарским правительством. \nВ ходе мероприятия, к удивлению подавляющего большинства присутствующих, [BUL.GetLeader] провозгласил образование Третьей Болгарской империи и объявил о начале новой эры для великой болгарской нации. \nЗа этой речью последовала величественная, но торжественная церемония коронации [BUL.GetLeader] императором Болгарии, на которой политические и военные лидеры присягнули на верность империи и ее правителю."
  bftb_news.7.a:0 "Это укрепляет болгарскую нацию!"
  bftb_news.7.b:0 "Похоже, у [BUL.GetLeader] мания величия..."
  bftb_news.7.c:0 "Было ли это действительно необходимо?"
  bftb_news.8.t:0 "Отечественный фронт захватывает Болгарию"
  bftb_news.8.desc:0 "Отечественный фронт - это антифашистская болгарская политическая организация, радикально выступающая против авторитарного режима [FROM.GetLeader], состоящая из членов многочисленных политических групп, но в значительной степени под влиянием коммунистов, и созданная для противостояния диктаторской системе, установленной в Болгарии. \nПосле восстания, организованного этой организацией, между войсками, верными болгарскому правительству, и сторонниками Отечественного фронта вспыхнула ожесточенная гражданская война. \nНаконец, война подошла к концу, и коммунисты свергли режим [FROM.GetLeader] и провозгласили Народную Республику Болгарию."
  bftb_news.8.a:0 "Великая победа болгарского народа!"
  bftb_news.8.b:0 "Беспокоит..."
  bftb_news.9.t:0 "Балканская федерация социалистических республик"

  bftb_news.9.desc:0 "[BUL.GetNameDefCap] сформировала [BUL.GetFactionName], пересмотренный вариант проекта, предложенного в 1920-х годах, который в то время оказался не очень успешным. \nПо словам премьер-министра Болгарии, [BUL.GetLeader], [BUL.GetAdjective] правительство стремится создать единый фронт на Балканах, чтобы противостоять вторгающимся иностранным державам, угрожающим региону своими территориальными амбициями. \nОстается только ждать, будет ли этот новый проект успешным, но поддержка балканской федерации, безусловно, значительно растет среди населения соседних государств."
  bftb_news.9.a:0 "Это путь к прогрессу!"
  bftb_news.9.b:0 "Интересно..."
  bftb_news.9.c:0 "Еще одна попытка объединить Балканы, которая закончится неудачей..."
  bftb_news.10.t:0 "Объединение Балкан"
  bftb_news.10.desc:0 "Бывшее правительство [BUL.GetOldNameDef] провозгласило создание [BUL.GetNameDef], с помощью которого оно намерено сделать [BUL.GetFactionName] еще более действенным, призывая членов союза объединиться под единым централизованным правительством. \nВ соответствии с [BUL.GetLeader], [BUL.GetNameDef] стремится к полному сотрудничеству между балканскими государствами, оставив позади любые конфликты прошлого и поощряя единство между народами Балкан."
  bftb_news.10.a:0 "Мечта сбывается!"
  bftb_news.10.b:1 "Это ли то, что действительно нужно [THIS.GetNameDef]?" #THIS
  bftb_news.10.c:0 "Это ли то, что действительно нужно Балканам?"
  bftb_news.10.d:0 "Бред!"
  bftb_news.11.t:0 "[BUL.GetNameDefCap] обращается к [GER.GetNameDef]"
  bftb_news.11.desc:0 "\n[BUL.GetAdjective] правительство заключило торговое соглашение с несколькими [GER.GetAdjective] компаниями в попытке укрепить связи с [GER.GetNameDef], стимулируя при этом вливание иностранного капитала в страну. \nСогласно этому соглашению, [GER.GetAdjective] инвесторы получат значительные юридические преимущества и налоговые льготы при работе в [BUL.GetNameDef]."
  bftb_news.11.a:0 "Это улучшит наши отношения с [GER.GetNameDef]!"
  bftb_news.11.b:0 "Это побудит [BUL.GetAdjective] стать на нашу сторону!"
  bftb_news.11.c:1 "Тогда [BUL.GetNameDef] присоединится к [GER.GetFactionName]?"
  bftb_news.11.d:0 "Они ищут только защиту [GER.GetLeader]!"
  bftb_news.12.t:0 "[ITA.GetAdjective]-[BUL.GetAdjective] обмен военными технологиями"
  bftb_news.12.desc:0 "\nОбратившись к [GER.GetAdjective] правительству, [BUL.GetNameDef] теперь стремится укрепить отношения с [ITA.GetNameDef]. \n[BUL.GetLeader] и [ITA.GetLeader] подписали соглашение о научно-исследовательских работах, разработанное экспертами из обеих стран, для содействия разработке современного военного оборудования для своих вооруженных сил. \nВместе с этим соглашением [BUL.GetAdjective] правительство ввело новые экономические нормы для стимулирования инвестирования [ITA.GetAdjective] капитала в страну."
  bftb_news.12.a:0 "Это будет плодотворное сотрудничество!"

  bftb_news.12.b:0 "Болгары еще не доказали, что являются хорошими союзниками [ITA.GetNameDef]."
  bftb_news.12.c:0 "Болгары, похоже, отчаянно ищут новых друзей..."
  bftb_news.12.d:0 "Они имеют дело с дьяволом..."
  bftb_news.13.t:0 "[SOV.GetAdjective]-[BUL.GetAdjective] Договор о взаимопомощи"
  bftb_news.13.desc:0 "\n Премьер-министр Болгарии [BUL.GetLeader] и лидер [SOV.GetAdjective] [SOV.GetLeader] подписали соглашение, в котором они стремятся укрепить отношения между обеими странами и содействовать сотрудничеству в военной и экономической сфере. \nС помощью этого договора болгарское правительство также намеревается стимулировать торговлю с [SOV.GetNameDef] и использовать [SOV.GetAdjective] капитал для новых промышленных инвестиций."
  bftb_news.13.a:0 "Этот договор чрезвычайно выгоден для Болгарии!"
  bftb_news.13.b:0 "Советское влияние на Балканах растет!"
  bftb_news.13.c:1 "Болгария присоединится к [SOV.GetFactionName]?"
  bftb_news.13.d:0 "Они просто ищут [SOV.GetAdjective] защиты!"
  bftb_news.14.t:0 "Договор о вечной дружбе на Балканах"
  bftb_news.14.desc:0 "В качестве первого шага в попытке восстановить отношения между Болгарией и ее соседями по Балканам, болгарское правительство подписало договор о дружбе с Югославией, в котором обе страны формализовали свою приверженность развитию дружественных отношений и содействию экономическому сотрудничеству между ними. \nЕсть те, кто утверждает, что истинные намерения болгарского правительства выходят за рамки установления дружественных отношений с соседями, и что его реальная цель - создание Балканской федерации для противостояния крупным европейским державам. \nНо пока что эти утверждения не более чем пустые спекуляции..."
  bftb_news.14.a:0 "Это наконец-то принесет стабильность на Балканы!"
  bftb_news.14.b:0 "Отчаянная попытка остановить наше наступление в войне!"
  bftb_news.15.t:0 "Салоникское соглашение"
  bftb_news.15.desc:0 "Премьер-министр Болгарии [BUL.GetLeader] встретился с [GRE.GetLeader] в [GRE.GetAdjective] столице, чтобы обсудить подписание договора, в котором правительства обеих стран официально обязуются поддерживать дружественные отношения и содействовать экономическому сотрудничеству между Болгарией и Грецией. \nПо словам [BUL.GetLeader], это лишь первый шаг в попытке восстановить отношения между Болгарией и ее соседями, усилия, которые могут оказаться очень плодотворными в ближайшем будущем."
  bftb_news.16.t:0 "Болгария обращается к Англии"

  bftb_news.16.desc:0 "\n[BUL.GetAdjective] правительство, стремясь заручиться поддержкой великой державы, способной гарантировать независимость и территориальную целостность [BUL.GetNameDef], направило дипломатическую делегацию в [ENG.GetNameDef] для переговоров о подписании договора с [ENG.GetAdjective] правительством. \nПомимо положений, касающихся военных вопросов, этот договор также включает в себя экономическое соглашение, предоставляющее [ENG.GetAdjective] капиталистам значительные налоговые льготы при ведении деятельности в [BUL.GetNameDef]."
  bftb_news.16.a:0 "Это улучшит наши отношения с [ENG.GetNameDef]!"
  bftb_news.16.b:0 "Это побудит [BUL.GetAdjective] встать на нашу сторону!"
  bftb_news.16.c:1 "Значит ли это, что [BUL.GetNameDef] присоединится к [ENG.GetFactionName]?"
  bftb_news.16.d:0 "Они всего лишь ищут защиты у [ENG.GetLeader]!"

  bftb_news.201.t:0 "[TUR.GetNameDefCap] Ремилитаризует Турецкие проливы"
  bftb_news.201.desc:0 "[TUR.GetNameDefCap] и [SOV.GetNameDef] пришли к соглашению о пересмотре Лозаннского договора, который был подписан и введен в действие после того, как молодая Турецкая Республика отбила атаку Антанты в [TUR.GetAdjective] войне за независимость. Договор долгое время осуждался как посягательство на [TUR.GetAdjective] суверенитет, но сегодня он, наконец, был изменен в пользу недавно легализованной Монтрёской конвенции. \n\n[TUR.GetNameDefCap] теперь имеет полный контроль над движением судов, проходящих через Турецкие проливы, а государства вокруг проливов были ремилитаризованы [TUR.GetNameDef]. [ENG.GetAdjective] наблюдатели, которые участвовали в процессе, просто удовлетворены тем, что конфликт в регионе удалось избежать."
  bftb_news.201.a:1 "Пусть будет так."
  bftb_news.201.b:0 "Великий день для мира."
  bftb_news.201.c:0 "Еще один договор Великой войны нарушен."
  bftb_news.201.d:0 "Хорошо для [TUR.GetNameDef]."

  bftb_news.202.t:0 "Турецкие проливы остаются демилитаризованными"
  bftb_news.202.desc:0 "[TUR.GetNameDefCap] и [SOV.GetNameDef] не смогли прийти к соглашению о пересмотре Лозаннского договора, который был введен в действие после того, как молодая Турецкая Республика отбила атаку Антанты в [TUR.GetAdjective] войне за независимость. Лозаннский договор демилитаризовал Турецкие проливы и открыл Дарданеллы и Босфор для неограниченного гражданского и военного судоходства, и, похоже, что это положение сохранится в обозримом будущем. \n\n[TUR.GetLeader] осудил решение в речи, транслируемой по всей стране, где он осудил то, как [TUR.GetNameDef] остается целью упорного империализма. [ENG.GetAdjective] наблюдатели, которые участвовали в процессе, просто удовлетворены тем, что конфликт в регионе удалось избежать."
  bftb_news.202.a:1 "Они были правы, опасаясь нашей мощи."
  bftb_news.202.b:0 "Что же мы могли сделать?"
  bftb_news.202.c:0 "Могли ли мы сделать больше?"
  bftb_news.202.d:0 "По крайней мере, война была предотвращена..."
  bftb_news.202.e:0 "Признак слабости со стороны [TUR.GetNameDef]..."

  bftb_news.203.t:0 "[TUR.GetAdjective]-[SOV.GetAdjective] Война"
  bftb_news.203.desc:0 "То, что должно было быть безобидным пересмотром многолетнего договора, превратилось в полномасштабную войну между [SOV.GetNameDef] и [TUR.GetNameDef] из-за разрешения на проход через Турецкие проливы.\n\n[TUR.GetLeader] назвал срыв переговоров и начало войны «несчастьем» и тем, чего «можно было избежать». [SOV.GetLeader], со своей стороны, заявил, что непобедимые армии [SOV.GetNameDef] остановятся ни перед чем, чтобы обеспечить соблюдение старых договоров Первой мировой войны. [SOV.GetLeader] также пообещал, что освобождение [TUR.GetAdjective] рабочих не за горами, и что уничтожение нынешнего [TUR.GetAdjective] режима станет великой победой для международного коммунистического движения."
  bftb_news.203.a:1 "Ураааа!"
  bftb_news.203.b:0 "Давай!"
  bftb_news.203.c:0 "Ну и катастрофа..."
  bftb_news.203.d:0 "Что случилось с доброй старой дипломатией!?"
  bftb_news.203.e:0 "Хм, нам следует подумать о помощи [TUR.GetAdjective] в войне..."
  bftb_news.203.f:0 "Ужасно."

  bftb_news.204.t:0 "Гражданская война в [TUR.GetNameDef]!"
  bftb_news.204.desc:1 "В [TUR.GetNameDef] разразилась гражданская война между правящим консервативным правительством и бывшими правящими кемалистами. Кемалисты, которые сражались и обеспечили независимость [TUR.GetNameDef] после краха Османской империи, назвали многочисленные вопиющие нарушения конституции нынешним правительством достаточной причиной для свержения их режима. Известный генерал и убежденный кемалист Казым Орбай был избран во главе военной хунты, которая намерена свергнуть нынешнее исламистское правительство [TUR.GetLeader].\n\n[TUR.GetLeader] осудил действия кемалистов как не соответствующие поведению в по-настоящему функционирующей демократической стране и поклялся восстановить верховенство закона в своей раздираемой войной нации."
  bftb_news.204.a:1 "Мы должны победить!"
  bftb_news.204.b:0 "Какая ужасная новость..."
  bftb_news.204.c:0 "Здесь есть шанс..."
  bftb_news.204.d:0 "Эй, мы кое-что знаем о таких!"

  bftb_news.205.t:0 "Возрождение Османского султаната"
  bftb_news.205.desc:1 "К общему разочарованию всего мира, Османский султан был восстановлен на своем троне после особенно жестокой гражданской войны между консерваторами страны и ее светскими кемалистами. В роскошной церемонии, которая больше напоминала средневековье, султан был восстановлен в своей прежней должности, а республика Мустафы Кемаля Ататюрка была навсегда упразднена.\n\n[TUR.GetLeader] обратился к своему вновь созданному султанату, выразив смесь удивления и смирения по поводу того, что его вернули на прежнюю должность. Новый султан — мягкохарактерный человек, но его окружает двор воинов и иредентистов. Эксперты, которые никогда не верили, что возвращение султана вообще возможно, понятия не имеют, что ждет их в будущем."
  bftb_news.205.a:1 "Альхамдулиллах!"

  bftb_news.205.b:0 "О нет, только не снова!"
  bftb_news.205.c:0 "Как же это произошло!?"
  bftb_news.205.d:0 "Хм, интересно..."
  bftb_news.205.e:0 "Странно."

  bftb_news.206.t:0 "Рассвет Завета Средиземноморья"
  bftb_news.206.desc:0 "[ITA.GetLeader] и [TUR.GetLeader] объявили о создании нового блока союза в Средиземноморье, известного как ‘[TUR.GetFactionName].’ [ITA.GetLeader] пообещал, что их пакт будет доминировать во всех европейских делах как ведущий лидер европейского континента, в то время как [TUR.GetLeader] говорил более взвешенно, уверяя дипломатов, что альянс был чисто стратегическим, призванным повысить безопасность на Балканах и для стран Средиземноморья. \n\n[ENG.GetAdjective] чиновники назвали новую региональную силу ‘бесполезной и нежелательной’, в то время как [GER.GetAdjective] наблюдатели говорили решительно более определенно, предсказывая, что эта фракция будет не более чем сноской в истории к концу десятилетия."
  bftb_news.206.a:1 "Ура!"
  bftb_news.206.b:0 "Какие глупцы!"
  bftb_news.206.c:0 "Schwächlinge!"
  bftb_news.206.d:0 "Еще один конкурент вступает в игру."
  bftb_news.206.e:0 "Что это значит для Европы?"

  bftb_news.207.t:1 "[TUR.GetNameDefCap] Берет на себя ответственность за безопасность Балкан"
  bftb_news.207.desc:0 "[TUR.GetLeader] обратился к миру сегодня, когда он заявил, что [TUR.GetNameDef] будет стремиться расширить свою балканоцентричную внешнюю политику, гарантируя независимость всех сотрудничающих государств в этом регионе. Международным наблюдателям может показаться, что [TUR.GetNameDef] занял более решительную позицию, выбрав минимизацию отношений с великими державами, чтобы сосредоточиться на региональной безопасности. \n\nХотя [TUR.GetAdjective] решение было одобрено некоторыми, оно стало источником значительной тревоги для других. [ITA.GetAdjective] чиновники в частности отреагировали с некоторой тревогой, умоляя [TUR.GetAdjective] правительство отказаться от своей позиции, если они хотят свести к минимуму вероятность возникновения конфликта в регионе. [TUR.GetAdjective] правительство в ответ назвало [ITA.GetNameDef] ‘региональным антагонистом.’"
  bftb_news.207.a:1 "Наша судьба ждет."
  bftb_news.207.b:0 "Слава богу."
  bftb_news.207.c:0 "Это будет проблематично."
  bftb_news.207.d:0 "Хм."

  bftb_news.208.t:0 "[TUR.GetNameDefCap] Требует возвращения границ 1920 года"

  bftb_news.208.desc:1 "[TUR.GetNameDefCap] объявил о своем намерении перерисовать свои национальные границы до того, как [TUR.GetNameDef] ратифицировал Национальную клятву. [TUR.GetAdjective] правительство предъявило претензии практически ко всем своим соседним государствам и отклонило призывы отозвать свои ложные претензии. \n\nМеждународное сообщество широко осудило [TUR.GetAdjective] администрацию за ее решение, и в мире царит общее беспокойство, что безрассудные действия [TUR.GetAdjective] руководства могут только усугубить глобальные разрушения, которые мир пережил за последние несколько лет. [TUR.GetNameDefCap] кажется, привержен своему пути реваншизма, но только время покажет, каков будет исход его курса правления."
  bftb_news.208.a:1 "Мы не можем беспокоиться о [TUR.GetAdjective] схемах."
  bftb_news.208.b:0 "Эмбарго, кажется, достаточно."
  bftb_news.208.c:0 "Военачальники!"
  bftb_news.208.d:0 "Мы хотим только то, что по праву принадлежит нам."
  bftb_news.208.e:0 "Они только ухудшают ситуацию!"

  bftb_news.209.t:0 "Пришествие Турана"
  bftb_news.209.desc:1 "Турецкие завоевания продвинулись настолько, что турецкое правительство посчитало себя оправданным, чтобы провозгласить себя [TUR.GetNameDef]. Появление этой новой империи вызвало шок во всем мире, поскольку было очень мало наблюдателей, которые верили, что Турция вообще сможет полностью оправиться от своей войны за независимость в последующие десятилетия - не говоря уже о создании совершенно новой империи, охватывающей континенты. \n\nЕсли верить сообщениям, то новообразованная [TUR.GetAdjective] может еще не закончить свою стремительную экспансию, поскольку [TUR.GetLeader] заявил, что никогда не прекратит свои завоевания, пока все турки в мире не будут освобождены. Мир может только с замиранием сердца наблюдать за происходящим."
  bftb_news.209.a:1 "Мы непобедимы."
  bftb_news.209.b:0 "Как...?"

  bftb_news.301.t:0 "[GRE.GetAdjective] Гражданская война!"
  bftb_news.301.desc:1 "В [GRE.GetNameDef] разразилась гражданская война между силами, верными королю, который распустил греческий парламент, и республиканскими и коммунистическими силами, верными демократическим принципам [GRE.GetNameDef]. Несмотря на то, что между республиканцами и коммунистами существовала большая вражда, они объединились в попытке свергнуть непопулярного иностранного короля, который навязал себя как тиранического деспота над всей [GRE.GetAdjective] нацией. \n\n[GRE.GetLeader] пообещал, что ни он, ни монархические силы, верные ему, не прекратят свою борьбу, пока все антимонархические силы не будут изгнаны из страны."
  bftb_news.301.a:1 "Собирайтесь вокруг короля!"
  bftb_news.301.b:0 "Королевское правительство может нам хорошо послужить..."
  bftb_news.301.c:0 "Хорошо, хорошо - рвите друг друга в клочья!"
  bftb_news.301.d:0 "Когда же Греции наконец-то повезет?"

  bftb_news.302.t:0 "Создание Великой Греции"

  bftb_news.302.desc:0 "Наблюдатели по всему миру, которые задавались вопросом, о чем была тайная Гераклеонская конвенция, собравшая многочисленных участников со всей Европы, больше не должны гадать, ибо сегодня [GRE.GetLeader] объявил, что [GRE.GetAdjective] мечта о Великой Греции наконец осуществилась. \n\nЭксперты выразили удивление по поводу стремительной экспансии [GRE.GetNameDef], ссылаясь на политические потрясения и глубоко укоренившиеся экономические проблемы как на причины, по которым [GRE.GetAdjective] переворот казался маловероятным, но последние события доказали, что они все ошибались."
  bftb_news.302.a:1 "Наша мечта наконец исполнилась!"
  bftb_news.302.b:0 "Обычно мы не одобряем такое поведение, нооо..."
  bftb_news.302.c:0 "Это не поможет им!"
  bftb_news.302.d:0 "Вау."
