  GetBookPagesText:0 "[GetBookPagesText]"
  first_page_texts_loc:0 "- Что такое армия?\nАрмия, сухопутные силы или наземные силы - это вооружённые силы, которые сражаются в первую очередь на земле. В самом широком смысле это наземная военная отрасль, отрасль обслуживания или вооружённая служба нации или страны. Она также может включать в себя авиационные активы, имея компонент армейской авиации. Внутри национальных вооружённых сил слово армия также может означать полевую армию."
  second_page_texts_loc:0 "- Тактика обмана\nИспользование обмана, демонстраций, показов или уловок, чтобы отвлечь внимание противника от дружественных основных усилий и побудить противника сконцентрировать ресурсы в то время и в том месте, где это невыгодно для противника.\n\n- Оборонная тактика\nЭта тактика используется для защиты боевой среды, местности или во время атаки.\n\n- Наступательная тактика\nЭта тактика используется для атаки на область или местность."
  third_page_texts_loc:0 "- Закон о войне\nЗакон о войне - это компонент международного права, который регулирует условия начала войны (jus ad bellum) и ведение воюющими сторонами войны (jus in bello). Законы войны определяют суверенитет и национальность, государства и территории, оккупацию и другие критические юридические термины.\n\n- Химическое оружие\nХимическое оружие - это химическое вещество, используемое для преднамеренного причинения смерти или вреда за счёт его токсичных свойств. Боеприпасы, устройства и другое оборудование, специально разработанное для использования токсичных химикатов в качестве оружия, также подпадают под определение химического оружия."
  fourth_page_texts_loc:0 "- Галлиполийская кампания\nГаллиполийская кампания — военная операция Первой мировой войны, проходившая на Галлипольском полуострове с 19 февраля 1915 г. по 9 января 1916 г.\n\n- Битва за Францию\nЗападный фронт (битва за Францию) стал одним из основных театров военных действий Первой мировой войны. После начала войны в августе 1914 г. немецкая армия открыла Западный фронт вторжением в Люксембург и Бельгию, а затем получила военный контроль над важными промышленными районами Франции. Немецкое наступление было остановлено битвой на Марне. После гонки к морю обе стороны окопались вдоль извилистой линии укрепленных окопов, простиравшейся от Северного моря до швейцарской границы с Францией, которая изменилась незначительно, за исключением начала 1917 г. и 1918 г.\n\n- Битва при Сомме\nБитва на Сомме, также известная как наступление на Сомме, была битвой Первой мировой войны, в которой армии Британской империи и Третьей французской республики сражались с Германской империей. Она проходила с 1 июля по 18 ноября 1916 г. по обе стороны верхнего течения реки Соммы во Франции.\n\n- Первая битва на Марне\nПервая битва на Марне была сражением Первой мировой войны, которое произошло с 5 по 12 сентября 1914 г. Она произошла в ходе ряда стычек вокруг долины реки Марна. В результате союзники одержали победу над немецкими армиями на западе."
  declare_modern_army_button_tt:0 "§YОбъявить современную армию§!\n\n§YПредпосылки:§!\nИмеется завершенная §Yкнига§!\nБолее §Y100 очков обучения§!\n\n§YЭффекты при выборе:§!\nПолучает '§YСовременная армия§!', которая дает ( £organization_texticon  Организация дивизии: §G+5.0%§!, £in_combat  Нападение дивизии: §G+10.0%§!, £defence_texticon  Защита дивизии: §G+10.0%§!)"
  IRQ_race_for_dominance_category:0 "Борьба за господство"
  IRQ_race_for_dominance_category_desc:0 "После событий, произошедших в последние несколько месяцев, особенно после убийства короля, правительство ослабло, и революционеры стремятся захватить власть.\nЕсли одна из сторон имеет не менее §Y75% влияния§! в стране, она может захватить власть.\n\n§tКоммунистические партизаны§! пытаются увеличить свое влияние в стране с равной пропагандой для рабочих и строительством гражданских заводов.\n§LFашистские партизаны§! пытаются увеличить свое влияние в стране с помощью националистической пропаганды и строительства военных заводов.\n§gАрмия§! также пытается захватить власть, уничтожая обе стороны."
