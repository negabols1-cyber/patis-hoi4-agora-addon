l_russian:
  #Industry 
 LIB_expand_rubber_cultivation: "Расширить резиновые культивирование"
 LIB_expand_rubber_cultivation_desc: "В последние годы растут интерес к потенциалу Либерии для развития резины. Эксперты считают, что резина может играть важную роль в экономическом развитии страны. \ N \ nliberia идеально подходит для выращивания резины благодаря его тропическому климату и плодородным почвам. Резина уже выращивается в стране, но это производство все еще в небольших масштабах. Правительство Либерии предпринимает шаги по продвижению производства резины и работает над увеличением инвестиций в эту область."
 LIB_steel_prospecting: "Сталелитейный поиск"
 LIB_steel_prospecting_desc: "Сталь является одним из основных строительных материалов современного мира, и установление Либерии собственного производства стали может быть использовано для развития своей инфраструктуры и создания новых рабочих мест. \ N \ ngeologists считают, что в северных и западных регионах Либерии существуют большие месторождения железной руды. Этих депозитов могут быть достаточно, чтобы удовлетворить потребности в сталеле и даже экспортировать их."
 LIB_urbanization_Monrovia: "Урбанизация Монровии"
 LIB_urbanization_Monrovia_desc: "Люди из деревень и городов стекаются в город в надежде на лучшие условия жизни и возможности трудоустройства. Эта урбанизация оказала значительное влияние на инфраструктуру, экономику и социальную структуру Монровии. Урбанизация приводит к инвестициям в инфраструктуру в Монровии, таких как новое жилье, школы и больницы. Это также создает новые рабочие места в городе. Однако быстрая урбанизация не без проблем. Отсутствует жилье, заторы на движении и увеличение преступности."
 LIB_oil_proccesing: "Обработка масла"
 LIB_oil_proccesing_desc: "Это уменьшит зависимость от нефтяной и газовой промышленности Либерии и отметит важную веху в экономическом развитии Либерии, первая в стране строительство нефтепрограмм. Завод будет обрабатывать сырую нефть Либерии для производства масла и других нефтяных продуктов, необходимых для страны. \ N \ n \ n \ n \ n numbersing установка принесет много преимуществ для либерийской экономики. Это уменьшит зависимость страны от импорта топлива и сохранить иностранную валюту. Это также создаст новые рабочие места и стимулирует местную экономику."
 LIB_ban_the_use_of_cyanide: "Запретить использование цианида"
 LIB_ban_the_use_of_cyanide_desc: "Цианид является высокотоксичным химическим веществом, используемым в горнодобывающей промышленности для извлечения драгоценных металлов, таких как золото и серебро. Использование цианида может нанести серьезный ущерб окружающей среде и здоровью человека. Запрет на цианид поможет защитить здоровье тысяч людей, работающих на шахтах Либерии. Это также защитит природную среду от загрязнения, предотвращая попадание цианида водных принадлежностей и почвы."
 LIB_allimium_mining: "Алюминиевая добыча"
 LIB_allimium_mining_desc: "Алюминиевая добыча может принести много преимуществ Либерии. Он может создавать новые рабочие места, генерировать валютную прибыль, которая может использоваться для улучшения инфраструктуры и внести свой вклад в развитие страны. Правительство предлагает инвесторам стимулы для развития сектора майнинга алюминия."
 LIB_Liberated_Uranium: "Освобожденный уран"
 LIB_Liberated_Uranium_desc: "Некоторые считают, что освобожденный уран может быть новым источником энергии. Это может иметь потенциал для преобразования экономики Либерии и вывести страну на передний план современного мира. Именно то, что это такое и как это работает, остается неясным. Ученые проводят исследования, чтобы исследовать потенциальные преимущества и риски освобожденного урана."
 LIB_gold_extraction: "Извлечение золота"
 LIB_gold_extraction_desc: "Рост цен на золото в последние годы возродила добыча полезных ископаемых в Либерии. Инвесторы участвуют в гонках, чтобы извлечь выгоду из богатых запасов золота страны. Он может создавать новые рабочие места, генерировать валютную прибыль, которую можно использовать для улучшения инфраструктуры и внести свой вклад в развитие страны. Правительство предлагает инвесторов стимулы для развития сектора майнинга золота."
 LIB_chromium_mills: "Хром -мельницы"
 LIB_chromium_mills_desc: "Завод является одним из самых современных хромированных заводов в Африке и, как ожидается, будет значительно внести свой вклад в экономику страны. Завод имеет мощность обработки 12 тонн хромированной руды и будет нанять 2500 человек. Хром является важным сырью, используемым при производстве нержавеющей стали и многих других прочных металлов."
 LIB_tungsten_mills: "Вольфрамовая добыча"
 LIB_tungsten_mills_desc: "В 1930 -х годах Либерия вольфрама была центральной для перспектив экономического развития страны. Драгоценный металл был очень востребованным товаром, используемым в лампочках и других электронных продуктах. Шахтеры отправляются в поисках вольфрамовой руды в отдаленных районах Либерии, и новые шахты были быстро открыты."
 LIB_Steel_mills: "Сталелитейные заводы"
 LIB_Steel_mills_desc: "Правительство считает, что производство стали является ключом к модернизации и процветанию. В конце концов, даже винтовка не может выпустить пулю без стали. Вот почему нам срочно нужно расширить сталелитейные заводы."
 LIB_cofee_economy: "Возрождение производства кофе"
 LIB_cofee_economy_desc: "Несколько лет назад Либерия была производителем кофе номер один. И правительство Либерии. Возрождение производства кофе приводит к этому некоторым проблемам для Либерии. Чтобы добиться успеха, Либерия должна принять устойчивую практику сельского хозяйства, производить высококачественную кофе и продавать свою продукцию на международном уровне."
 LIB_pearl_mining: "Хирс жемчуга"
 LIB_pearl_mining_desc: "В самом сердце глубокой Африки, в Либерии, где жемчужина украшает береговую линию, редкое сокровище, спрятанное на природе, было обнаружено. В регионе Гринвиле, в таинственной бухте, смешанной с шепотом волн, было обнаружено, что ложе из бесконечной красоты. Названный «Сердцем Жемчужина», это принесет страну не только материальное процветание, но и культурное и духовное обогащение."
 LIB_centralised_economy: "Обработанная пищевая экономика"
 LIB_centralised_economy_desc: "Экономика Либерии преобразуется новым сектором, основанным на обработке и экспорте сельскохозяйственной продукции. Это захватывающее развитие рассматривается как важный шаг для развития и процветания страны. Разработка обработанного пищевого сектора принесет много преимуществ для Либерии. Он создаст новые рабочие места, увеличит дополнительную стоимость сельскохозяйственной продукции и поможет стране диверсифицировать экономику. Это также позволит Либерии стать более конкурентоспособной на международных рынках и приносить больший доход."
 LIB_hydropower: "Проект Mount Coffee Hydropower"
 LIB_hydropower_desc: "Либерия завершила гидроэлектростанцию ​​Mount Coffee, что является важным шагом для увеличения выработки электроэнергии и обеспечения энергетической безопасности страны. Этот гигантский проект имеет решающее значение для развития Либерии и будет удовлетворять большую часть потребностей в энергетике страны."
 LIB_mechanic_calculations: "Механические расчеты"
 LIB_mechanic_calculations_desc: "Ключом к успеху инженеров и техников в их работе является способность решать сложные механические проблемы. Для достижения этой цели используются математические формулы и физические принципы, а также инструменты и методы, специально предназначенные для механических расчетов."
 LIB_integrated_rail_network: "Соглашение монополий"
 LIB_integrated_rail_network_desc: "Либерийская экономика недавно стала свидетелем того, как фирмы в различных секторах собираются вместе и достигнуты соглашений, чтобы защитить свою долю рынка и повысить цены. Это было названо «монополий» общественностью и вызвало опасения."
 LIB_farming: "Создать районы сельского хозяйства"
 LIB_farming_desc: "Либерийское сельское хозяйство претерпевает захватывающую трансформацию с принятием новых и инновационных методов сельского хозяйства. Одним из них является современный метод сельского хозяйства, известный как «интенсивный». Этот метод способствует тому, чтобы сделать сельское хозяйство более продуктивным и устойчивым, что приносит значительные выгоды для либерийской экономики."
 LIB_research: "Расширить Университет Либерии"
 LIB_research_desc: "Университет Либерии является старейшим и самым престижным высшим учебным заведением страны, основанным в 1862 году. Университет предлагает различные программы бакалавриата и выпускников с основной целью обучения квалифицированной рабочей силы, чтобы внести свой вклад в развитие Либерии. Исследователи университета проводят важные исследования в различных областях, таких как сельское хозяйство, медицина, инженерия и социальные науки. Эти исследования способствуют развитию Либерии и помогают стране расти в международном престиже."
 LIB_research_2: "Стелла Марис Политехнический университет"
 LIB_research_2_desc: "Стелла Марис Политехнический университет предлагает различные программы инженерии, технологий и профессиональной подготовки. Эти программы предназначены для того, чтобы предоставить студентам современные технические навыки и подготовить их к рынку труда."
 LIB_inspired_by_goddard: "Вдохновлен Годдардом"
 LIB_inspired_by_goddard_desc: "Были захватывающие последние разработки в области исследования космоса и аэронавтики в Либерии. За этими разработками стоит посвящение либерийских ученых и инженеров, вдохновленных всемирно известным ученым-ракетом Робертом Х. Годдардом."
 LIB_syntetich_resources: "Синтетические ресурсы"
 LIB_syntetich_resources_desc: "Либерия - это страна, богатая природными ресурсами. Тем не менее, тот факт, что эти ресурсы ограничены и подвергаются риску истощения из -за растущего населения и индустриализации, является проблемой для либерийской экономики. Поэтому необходимы новые ресурсы для обеспечения устойчивого развития Либерии."
 LIB_Uranium_purification: "Урановое обогащение"
 LIB_Uranium_purification_desc: "Известно, что Либерия богата заповедниками урана. Это означает, что страна имеет потенциал для производства ядерной энергии. Строительство уранового нефтеперерабатывающего завода может позволить Либерии удовлетворить свои энергетические потребности и экспортировать электроэнергию."
 LIB_Monrovia_radar_stations: "Монровия радиолокационная станция"
 LIB_Monrovia_radar_stations_desc: "Новая радиолокационная станция, построенная в Монровии, значительно улучшит безопасность и контроль либерийского воздушного пространства. Эта современная радиолокационная система поможет предотвратить аварий и сделать воздушный транспорт более безопасным, обеспечивая мониторинг самолета и воздушного движения."
 LIB_way_of_Thomas_Faulkner: "Способ Томаса Фолкнера"
 LIB_way_of_Thomas_Faulkner_desc: "Томас Фолкнер, который приехал в Либерию из Соединенных Штатов в 1929 году, помог в значительной степени положить конец работорговли в значительной степени своими заявлениями. С другой стороны, он также помог развивать страну в его реформах, чтобы расширить сектор мороженого и охлаждения. Короче говоря, мы немного знаем о том, какой он был экономист. Как страна будет двигаться вперед со своими реформами."
 LIB_war_industry: "Военная индустрия"
 LIB_war_industry_desc: "Военная индустрия может принести новую работу и экономическое развитие в Либерию. Производство современного оружия и оборудования может позволить Либерии участвовать в Международном рынке оружия и приносить валютный заработок. Это также может дать технические навыки и опыт для тех, кто работает в этом секторе."
 LIB_liberated_workers: "Освобожденные работники"
 LIB_liberated_workers_desc: "Недавний рост трудовых движений в Либерии может преобразовать политический и экономический ландшафт страны. Эта новая волна возглавляет группу так называемых «освобожденных работников», которые борются с эксплуатацией и требуют более справедливой рабочей среды."
 LIB_Monroiva_dockyards: "Монровия Dockyards"
 LIB_Monroiva_dockyards_desc: "Недавно завершенное расширение верфи Монровии представляет собой важную веху в морском секторе Либерии. Этот современный объект может стать мировым лидером в секторе ремонта и строительства либерии. Это делает Либерию более привлекательным местом для международных судоходных компаний. Кроме того, верфь создаст новые рабочие места и инвестиции, которые внесут значительный вклад в либерийскую экономику."
 LIB_extraction: "Извлеките наши ресурсы"
 LIB_extraction_desc: "Либерия - это страна, богатая природными ресурсами. Здесь находится леса и ценные минералы, такие как золото, бриллианты, железная руда и древесина. Извлечение этих ресурсов имеет большой потенциал для оживления экономики Либерии и улучшения благополучия его людей."
 LIB_Increase_the_sea_trade_score: "Погрузиться"
 LIB_Increase_the_sea_trade_score_desc: "Либерия - это страна с длинной и глубоко укоренившейся морской историей. Однако в последние годы морская торговая оценка Либерии снизилась. Это ослабляет конкурентоспособность Либерии в мировом морском секторе и препятствует экономическому развитию страны."
 LIB_crate_trade_convoys: "Создать торговые конвои"
 LIB_crate_trade_convoys_desc: "Это может быть эффективное решение для защиты морской торговли Либерии и укрепления экономики страны. Конвои будут состоять из вооруженных судов, которые будут сопровождать корабли, работающие под либерийским флагом, и защищать их от морских бандитов и других угроз."
 LIB_cover_our_trade_convoys: "Покрыть наши торговые конвои"
 LIB_cover_our_trade_convoys_desc: "Либерийский народ должен признать важность защиты торговых колонн и поддержать правительство и морской сектор для достижения этой цели. Работая вместе, они могут сделать морскую торговлю Либерией более безопасной и процветающей."
 LIB_modern_trade_convoys: "Современные методы торговых конвоя"
 LIB_modern_trade_convoys_desc: "Современные методы торговых конвоя являются важным инструментом для защиты морской торговли Либерии и поддержки экономического развития страны. Продолжая разрабатывать и внедрять эти методы, правительство и морской сектор могут сделать морскую торговлю Либерии более безопасной и процветающей."
  #POLITIC 
 LIB_dolarisation: "Продолжить программу доллара"
 LIB_dolarisation_desc: "Чтобы решить сложные экономические условия 1930 -х годов, правительство Либерии выпустило новую инициативу под названием «Долларизационная программа». В рамках этой программы доллар США заменит либерийский доллар как официальную валюту страны."
 LIB_integrate_West_African_pound: "Интегрировать западноафриканский фунт"
 LIB_integrate_West_African_pound_desc: "На важном шаге по продвижению региональной стабильности и интеграции правительство Либерии решило повторно подготовить западноафриканский фунт в качестве своей валюты. Ожидалось, что это изменение облегчит торговлю Либерией со своими соседями и позволит стране более эффективно участвовать в региональной экономике."
 LIB_crush_the_union_rats: "Раздавить трудовых крыс"
 LIB_crush_the_union_rats_desc: "Обычно у нас было соглашение с профсоюзами, которые мы не будем работать в воскресенье, но в этом экономическом кризисе у нас нет выбора."
 LIB_contunie_new_deal: "Продолжить новое курс"
 LIB_contunie_new_deal_desc: "С инаугурацией президента Эдвина Барклая в 1930 году был новый луч надежды для профсоюзов. Барклай признал важность профсоюзов и предпринял шаги, чтобы сделать их сильнее. В 1931 году он подписал первый профсоюзный закон в Либерии. Этот закон дал правовую защиту формированию профсоюзов и коллективных переговоров."
  #VISA/WILKOMMENSKULTUR 
 LIB_visa_policies: "Реорганизование визовой политики"
 LIB_visa_policies_desc: "Правительство Либерии планирует внести значительные изменения в политике визы для регулирования въезда и выхода в страну и за его пределами. Считается, что эти изменения являются реформой, которая затрудняет путешествие и поселиться в Либерии и поселиться в Либерии."
 LIB_purge_foreign_scientists: "Чистка иностранных ученых"
 LIB_purge_foreign_scientists_desc: "Либерийское правительство сегодня объявило об увольнении ряда иностранных ученых, работающих в научных учреждениях страны. Правительство заявило, что эти ученые были обвинены в участии в политической деятельности и использовании научной работы в политических целях."
 LIB_national_education: "Национальное образование"
 LIB_national_education_desc: "Сторонники этой новой системы полагали, что образованное население будет способствовать экономическому развитию и процветанию Либерии. Образованные работники могут помочь развивать инфраструктуру страны, модернизировать сельское хозяйство и создать новые отрасли."
 LIB_take_settlers_lands: "Возьмите земли поселенцев"
 LIB_take_settlers_lands_desc: "Несмотря на то, что они прибыли почти 100 лет назад, поселенцы все еще не адаптируются к области. Кроме того, поскольку в настоящее время они наносят ущерб региону, правительство Либерии решило забрать землю «врага государственных» поселенцев."
 LIB_local_languages_program: "Программа местных языков"
 LIB_local_languages_program_desc: "В 1930 -х годах Либерия были предприняты усилия по развитию чувства национальной идентичности и единства. Важной частью этих усилий стало создание программы языков коренных народов для сохранения и развития богатого лингвистического наследия страны."
 LIB_the_sun_of_africa: "Солнце Африки"
 LIB_the_sun_of_africa_desc: "Идея «африканского солнца» была вдохновлена ​​борьбой Либерии за независимость и суверенитет. Либерийцы полагали, что их победа над колонизаторами представляла надежду на свободу и равенство для всех африканцев. Они полагали, что Либерия, с ее богатыми ресурсами и трудолюбивыми людьми, может стать моделью для африканского развития."
 LIB_Willkommenskultur: "Поселенцы приветствуются"
 LIB_Willkommenskultur_desc: "Политика приветствия поселенцев оказала значительное влияние на либерийскую экономику. Новые инвестиции способствовали улучшению инфраструктуры, увеличению возможностей трудоустройства и увеличению сельскохозяйственного производства. Это также помогло улучшить отношения Либерии с международным сообществом."
 LIB_land_for_settlers: "Земля для поселенцев"
 LIB_land_for_settlers_desc: "Сложные экономические условия и рост безработицы 1930 -х годов заставили многих американцев искать новый старт. В этом поиске обширные и плодородные земли Либерии стали многообещающим вариантом. Правительство Либерии стремилось развивать страну и увеличить свою население, предлагая американцам привлекательные стимулы для покупки земли и поселения."
 LIB_reestablish_radar_camps: "Восстановите радиолокационные лагеря"
 LIB_reestablish_radar_camps_desc: "Радарные лагеря из немецкой империи были реактивированы новыми учеными, которые мы принесли из Европы. Это большой шаг для Либерии, если не для мира."
 LIB_expand_foreign_scientists: "Пригласить иностранных ученых"
 LIB_expand_foreign_scientists_desc: "Либерия приглашает иностранных ученых в страну способствовать прогрессу в области науки и техники и ускорить национальное развитие. Предлагая щедрые стимулы и возможности исследовательских возможностей для ученых, специализирующихся на различных областях, правительство стремится наращивать научный потенциал страны и повысить инновации."
 LIB_national_language_projekt: "Национальная языковая программа"
 LIB_national_language_projekt_desc: "Правительство Либерии запустило новую национальную языковую программу, направленную на объединение страны и стимулирование национальной идентичности. Программа направлена ​​на то, чтобы все либерийцы могли говорить на общем языке и планы сделать английский единственным общим языком."
 LIB_the_star_of_africa: "Звезда Африки"
 LIB_the_star_of_africa_desc: "Звезда на флаге Либерии может означать разные вещи для некоторых. Но одна вещь, с которой все могут согласиться, это то, что он объединяет нас под одну вещь."
  #BARCLAY/REPUBLICAN 
 LIB_The_Lone_Star_Forever: "Одинокая звезда навсегда"
 LIB_The_Lone_Star_Forever_desc: ""
 LIB_pop_some_champagne: "Запьйте шампанское"
 LIB_pop_some_champagne_desc: "В своем выступлении президент высоко оценил мужество и устойчивость либерийского народа, описывая, как страна преодолела проблемы и стала более сильной нацией. Он также пообещал, что его правительство будет продолжать работать над развитием экономики, улучшения образования и здравоохранения и создать равные возможности для всех либерийцев."
 LIB_Firestone_payouts: "Выплаты Firestone"
 LIB_Firestone_payouts_desc: "Правительство Либерии сталкивается с трудным решением погасить свой долг на резиновую компанию Firestone. Этот долг проистекает из соглашения, заключенного в 1920 -х годах, чтобы позволить Firestone создать резиновые плантации в Либерии. Однако с нашими платежами Firestone сможет расширить и выращивать больше резиновых плантаций."
 LIB_trade_usa: "Торговое соглашение с США"
 LIB_trade_usa_desc: "Либерия и Соединенные Штаты подписали историческое торговое соглашение, которое направлено на то, чтобы значительно улучшить экономическое сотрудничество между двумя странами. Это соглашение даст Либерии больший доступ к рынкам США, помогая стране увеличить экспорт и укрепить свою экономику."
 LIB_us_roads: "Американские автомагистрали"
 LIB_us_roads_desc: "Строительство американских автомагистралей в Либерию является исторической возможностью для страны. Этот проект поможет улучшить инфраструктуру Либерии, способствовать развитию и создать лучшее будущее для всех либерийцев."
 LIB_american_machines: "Американские машины"
 LIB_american_machines_desc: "Американская техника также будет революционизировать сельскохозяйственное производство. Современные тракторы и комбайны помогут более эффективно производить сельскохозяйственную продукцию и увеличить мощность обработки. Это может улучшить продовольственную безопасность и сделать Либерию экспортером продуктов питания."
 LIB_us_military_coop: "США военное сотрудничество"
 LIB_us_military_coop_desc: "США предоставят Либерию военную подготовку, оборудование и финансовую помощь. Это поможет либерийским военным стать более профессиональной и эффективной силой. Соединенные Штаты и Либерия также увеличат сотрудничество, проводя совместные военные упражнения и операции. Увеличение сотрудничества будет более устойчивой к террористическим угрозам. США предоставят Либерию контртеррористическую разведку и обучение и поможет либерийским силам безопасности разрушить террористические сети."
 LIB_american_motor_factories: "Американские моторные фабрики"
 LIB_american_motor_factories_desc: "Американские моторные фабрики будут производить двигатели для электромобилей, сельскохозяйственного оборудования и другого оборудования, производимого в Либерии. Это уменьшит зависимость Либерии от импорта и способствует самодостаточной экономике."
 LIB_american_garnison: "США экспедиционные гарнизоны"
 LIB_american_garnison_desc: "США утверждают, что он будет развернуть экспедиционные гарнизоны для защиты стабильности Либерии и региональной безопасности. Гарризоны помогут бороться с терроризмом и защищать морские границы Либерии. Они также обеспечат обучение и поддержку, чтобы помочь либерийским военным модернизировать и создать свои возможности."
 LIB_american_advisors: "Американские советники"
 LIB_american_advisors_desc: "Соединенные Штаты заявляют, что отправит опытных консультантов для ускорения развития Либерии и помочь стране полностью реализовать его потенциал. Консультанты будут консультировать правительство Либерии по управлению экономикой, развитию инфраструктуры и улучшению общественных услуг."
 LIB_reform_the_army: "Реформировать армию"
 LIB_reform_the_army_desc: "Либерийское правительство с помощью американских консультантов начало новую инициативу по модернизации и изменению либерийских военных. Эти реформы сделают военные более профессиональными, эффективными и способными защищать национальную безопасность."
 LIB_sierra_leone: "Объединиться с Сьерра -Леоне"
 LIB_sierra_leone_desc: "Либерия и Сьерра -Леоне, две соседние страны Западной Африки, давно мечтали об объединении. История этого союза основана на колониальном прошлом и общих культурных связях. Сторонники объединения считают, что это повысит региональную стабильность и процветание и консолидирует политическую и экономическую власть."
 LIB_develop_sierra_leone: "Развивайте Сьерра -Леоне"
 LIB_develop_sierra_leone_desc: "Правительство Либерии начало новую инициативу по разработке и модернизации Сьерра -Леоне. План включает инвестиции для развития инфраструктуры, улучшения образования и здравоохранения и оживления экономики."
 LIB_five_days_work: "Пятидневная рабочая неделя"
 LIB_five_days_work_desc: "Независимо от того, сколько мы платим, независимо от того, сколько мы работаем, если наши работники недостаточно отдыхают, они не могут работать эффективно. Смена рабочего времени на 5 дней в неделю может помочь профсоюзам и работникам оставаться довольными и лучше обслуживать свою страну"
 LIB_review_interior_policy: "Просмотреть внутреннюю политику"
 LIB_review_interior_policy_desc: "Если мы хотим, чтобы наша страна развивалась, нам нужно пересмотреть нашу внутреннюю политику. Будем ли мы страной свободы, демократии и равенства или вернемся к нашей старой политике? Мы должны решить это."
 LIB_agree_with_unions: "Соглашение с профсоюзами"
 LIB_agree_with_unions_desc: "Нам нужно прийти к соглашению с профсоюзами. Они постоянно ставят наше правительство в трудную ситуацию с такими требованиями, как меньше рабочих часов, более высокая заработная плата, обеспечивая электроэнергию для областей без электричества. Эта проблема должна быть решена раз и навсегда"
 LIB_electricisation_of_urbans: "Городские энергетические сетки"
 LIB_electricisation_of_urbans_desc: "Несмотря на то, что у нас есть небольшая страна, у нас до сих пор нет электрической сетки в большинстве наших городских районов, и это большая проблема. Решение проблемы электроэнергии удовлетворит как наших людей, так и профсоюзов и будет способствовать нашей отрасли."
 LIB_open_cotteje_hospital: "Открытая больница Cotteje"
 LIB_open_cotteje_hospital_desc: "Из -за нашего географического положения мы живем в середине многих опасных заболеваний, и в любое время существует большой риск эпидемий. Мы можем подписать соглашение с США и попросить их открыть больницы в нашей стране, чтобы мы могли избежать опасности эпидемий."
 LIB_american_sivil: "Американские промышленные комплексы"
 LIB_american_sivil_desc: "Благодаря нашим соглашениям с США, США будут строить промышленные объекты, которыми мы будут управляться и управлять нами. Это создаст работу для наших людей и внесет свой вклад в нашу экономику."
 LIB_evolition_program: "Под звездами знамени"
 LIB_evolition_program_desc: ""
 LIB_national_car: "Национальные автомобили"
 LIB_national_car_desc: "Благодаря технологической помощи, которую мы получили от США, мы достигли уровня, на котором мы можем построить наш национальный автомобиль. Более того, это будет способствовать нашей экономике, и мы сможем иметь постоянно растущую экономику."
 LIB_national_defense_council: "Совет национальной обороны"
 LIB_national_defense_council_desc: "Поскольку Национальный совет теперь твердо под контролем Barclay, все, что остается, - это получить контроль над палатой депутатов. Со всеми палатами гражданского правительства в соответствии с абсолютным большинством партии диктатура получит неоспоримый контроль над нацией и ее отраслями."
 LIB_declare_martial_law: "Объявить военное положение"
 LIB_declare_martial_law_desc: "Время покажет, какие последствия будут иметь военное положение в Либерии. Еще неизвестно, будет ли это решение обеспечить национальную безопасность или угрожать демократии Либерии, но мы должны подготовиться к нынешним международным войнам"
 LIB_oil: "Разработать трубопроводы"
 LIB_oil_desc: "Правительство Либерии, в сотрудничестве с Соединенными Штатами, выступило с новой инициативой по разработке нефтегазовых трубопроводов в стране. Эти трубопроводы могут улучшить энергетическую инфраструктуру Либерии и стимулировать экономику."
  #Faulkner 
 LIB_Republican_conspiracy: "Заговор Фолкнера"
 LIB_Republican_conspiracy_desc: "Сделка Эдвина Барклая с нацистами - не что иное, как выстрел в ногу. не будет сложно выгнать его из правительства из -за этой ошибки"
 LIB_computing_techs: "Современные вычислительные системы"
 LIB_computing_techs_desc: "С развитием технологий мы смогли сделать сложные операции, выполняемые сложными машинами, называемыми компьютерами. Мы можем внести свой вклад в наш прогресс, доставив новейшие из этих систем в нашу страну."
 LIB_open_public_universities: "Открытые государственные университеты"
 LIB_open_public_universities_desc: "Не может быть развития без образования. Нам нужно открыть государственные университеты в нашей стране и дать людям из всех слоев общества возможность обучать себя."
 LIB_communication: "Расширить сектор связи"
 LIB_communication_desc: "Мы живем в эпоху, когда информация легко распространяется. Мы можем знать почти мгновенно о войне, технологическом прорыве и т. Д. На другом мире. инвестирование в этот сектор и обеспечение его развития будет держать нас в курсе мира."
 LIB_victrix: "Объединенные народы"
 LIB_victrix_desc: "В конце концов, репрессивное правительство Барклая упало, и либерийский народ получил право на равное правительство."
 LIB_demilitarisation: "Де-милитаризация"
 LIB_demilitarisation_desc: "Мы уже нейтральная страна, и вокруг нас едва ли есть страна, которая может предложить нам угрозу. Если мы сохраняем хорошие отношения с англичанами и французским, нам не нужно будет выделять нашу и без того слабую экономику армии."
 LIB_work_with_other_monopolies: "Работать с другими монополиями"
 LIB_work_with_other_monopolies_desc: "Торговля оружием - это не только винтовки. Сотрудничество с различными вооруженными компаниями в мире и в нашей стране получит большую пользу для обеих сторон"
 LIB_sell_arms_factories: "Продать заводы оружия"
 LIB_sell_arms_factories_desc: "Теперь, когда мы демилитаризованы, нам больше не нужны военные фабрики, для нас будет более полезно продавать эти ненужные фабрики и покупать фабрики, которые принесут пользу нашим людям."
 LIB_free_trade: "Откройте наш рынок"
 LIB_free_trade_desc: "Поскольку мы являемся нейтральной и демилитаризированной страной, для нашей экономики было бы очень полезно обеспечить, чтобы все страны мира могли использовать нас в качестве торгового маршрута"
 LIB_neutrality_act: "Закон о нейтралитете"
 LIB_neutrality_act_desc: "Наша страна была страной, которая ценит независимость и свободу с того дня, как она была основана. И единственный способ защитить их - оставаться нейтральным. Да, может показаться ошибкой объявлять нейтралитет, но война никогда не бывает прибыльной"
 LIB_arms_trade: "Торговля оружием"
 LIB_arms_trade_desc: "Мир собирается спуститься в хаос, и мы можем воспользоваться этим. У большинства стран мира не хватает оружия, и они могут заплатить любые деньги, которые они хотят, за любую страну, которая продает им оружие \ nif, мы можем извлечь выгоду из этого, наша экономика может сделать гигантский скачок вперед."
 LIB_work_together_with_unions: "Работать вместе с профсоюзами"
 LIB_work_together_with_unions_desc: "Быть противоречивым с профсоюзами не поможет им или нам. В такие трудные времена вступление друг на друга, а не противодействовать друг другу, важно сохранить нашу свободу"
 LIB_keep_control_settlers: "Держать поселенцев под контролем"
 LIB_keep_control_settlers_desc: "Прибытие американских поселенцев - это хорошо, но если мы не будем держать их под контролем, Либерия может перестать принадлежать либериям."
 LIB_call_for_foreign_advisors: "Призовать иностранных консультантов"
 LIB_call_for_foreign_advisors_desc: "К сожалению, в нашей стране очень мало людей, которые знают о промышленности, образовании и военных, и для их обучения требуется много времени. Но мы можем решить эту проблему, если пригласим иностранных консультантов в нашу страну"
 LIB_new_flag: "Новая конституция"
 LIB_new_flag_desc: "Наш нынешний флаг слишком похож на американский флаг. Мы должны изменить его, потому что это напоминает нам об американских колониальных временах и может быть запутан! Конечно, существует также возможность принятия некоторых экономических законов."
  #FAŞO 
 LIB_clocks_go_back: "Перемещать часы назад"
 LIB_clocks_go_back_desc: "Да, наша страна, возможно, была основана на принципах свободы, но рабство присуще природе мира, и мы не освобождаемся от этого."
 LIB_look_dad_you_at_the_headline: "Слушай, папа! Вы находитесь в заголовках!"
 LIB_look_dad_you_at_the_headline_desc: "Эдвин Барклай, когда он когда -либо делал что -то правильно для нашей страны, например, улучшение нашей экономики или достижение какой -либо другой хорошей вещи? Если бы наши люди знали о скандалах, в которых он вовлечен, они бы никогда не избрали его. Конечно, если они узнают сейчас, они могут оказать давление на него, чтобы уйти в отставку."
 LIB_unrest_of_workes: "Рабочие беспорядки"
 LIB_unrest_of_workes_desc: "У нас много рабочих в нашей стране, и любой, кто делает то, что хочет, может стать президентом. Если бы мы могли заставить работников ненавидеть Эдвина Барклая, его отставка была бы гарантирована"
 LIB_government_resigns: "Государственная отставка"
 LIB_government_resigns_desc: "Нет смысла в том, чтобы кто -то стал президентом, если они потеряют поддержку людей и рабочих. Иногда лучше всего уйти в отставку и освободить место для лучших лидеров."
 LIB_old_faces: "Старые лица, новая эра"
 LIB_old_faces_desc: "После того, как правительство уходит в отставку, лучший выбор был бы для бывшего президента Чарльза Д.Б. Король, чтобы вернуться. Давайте посмотрим, что в будущем сохранится для нашей страны."
 LIB_invite_the_mason: "Пригласить масонов"
 LIB_invite_the_mason_desc: "Есть большая группа, которая не поддерживает президента Чарльза Д.Б. Кинг и хочет, чтобы бывший президент вернулся. Приглашение масонов в нашу страну и обеспечение их поддержки на уступках поможет разрушить общественную оппозицию нам и укрепить наше правительство."
 LIB_crush_political_dissent: "Раздавить политическое несогласие"
 LIB_crush_political_dissent_desc: "Некоторые политические деятели по -прежнему упускают из виду и выступают за возвращение бывшего президента, несмотря на коррупцию и скандалы, в которых он участвовал, и эти дураки уменьшают нашу поддержку со стороны людей. Если мы не замолчаем их, наша сила может быть под угрозой."
 LIB_coup: "Переворот d'etat"
 LIB_coup_desc: "Доверие масонов было ошибкой. Мы должны были ожидать, что привилегии, которые мы им предоставили, будут иметь неприятные последствия для нас. Оценить нашу страну на такой риск для получения общественной поддержки был полной ошибкой. Важно объявить чрезвычайное положение, приостановить демократию и остановить переворот."
 LIB_liberity_forces: "Силы свободы"
 LIB_liberity_forces_desc: "Вполне вероятно, что в нашей армии есть противоположные и враждебные группы, которые могут предать нас в любой момент. Создание совершенно лояльной военной группы укрепит нашу власть."
 LIB_liberty_will: "Желание свободы"
 LIB_liberty_will_desc: "Свобода в нашей крови. Наши предки были свободны, и мы тоже будем свободными. Лучше умереть, чем стать рабами в другой стране."
 LIB_agreement_of_expand_the_plantation: "Расширить плантацию"
 LIB_agreement_of_expand_the_plantation_desc: "Компания Firestone предоставила нам отличные услуги, расширение их земель увеличит их возможности, что также увеличит деньги в наших карманах."
 LIB_militarisation: "Расширить заводы вооружений"
 LIB_militarisation_desc: "Удар, нанесенный против масонской ложи, и сдвиг нашей страны в сторону более националистической позиции не будет хорошо содержаться с нашими соседними странами. Нам нужно укрепить нашу армию, инвестируя в военные фабрики"
 LIB_reorganise_the_government: "Реорганизовать правительство"
 LIB_reorganise_the_government_desc: "С тех пор, как предыдущее правительство подало в отставку, правительство Charles DB King не смогло преодолеть кризис, но теперь все готово. С одной последней корректировкой нашего правительства, будет обеспечена абсолютная стабильность"
 LIB_agreement_of_firestone: "Сотрудничать с Firestone"
 LIB_agreement_of_firestone_desc: "Опираясь на отношения, которые мы разработали с Firestone, предоставит нам больше кредитов и больше резины. Это даст нам возможность вернуть репутацию как продюсера резины номер один, которого украл Малайя у нас."
 LIB_pan_africanism: "Панафриканизм"
 LIB_pan_africanism_desc: "В 1900 году на Панафриканском конгрессе мы решили, что все африканцы попадут под один щит."
 LIB_eagle_of_west_africa: "Орел Африки"
 LIB_eagle_of_west_africa_desc: "Какой пак километр?!"
 LIB_king_of_nation: "Король нации"
 LIB_king_of_nation_desc: "Король нации, может быть немного сложно понять, что это значит для Чарльза, но не поймите меня неправильно, он на самом деле не король, это просто название"
 LIB_close_the_masonic_lobby: "Близкие масонские ложи"
 LIB_close_the_masonic_lobby_desc: "Несмотря на то, что большая часть высшего руководства имеет масонское происхождение, ясно, что этот переворот был непосредственно от великого лидера. Нам нужно уничтожить этих масонов."
  #COMMUNIST 
 LIB_crisis_of_the_black_sunday: "Кризис Черного воскресенья"
 LIB_crisis_of_the_black_sunday_desc: "Обычно у нас было соглашение с профсоюзами, которые мы работали бы 6 дней в неделю, а не 7. По крайней мере, в воскресенье люди будут иметь время, чтобы сделать свои петиции Богу. Но когда нам пришлось вернуть его из -за трудных обстоятельств, люди начали злиться."
 LIB_sounds_of_the_revolition: "Звуки революции"
 LIB_sounds_of_the_revolition_desc: "В противоположность нашему спросу на работу в воскресенье, профсоюзы начали остановки работы, и почти все работники прекратили работу. В некоторых частях страны профсоюзы организуют митинги и предположительно ищут их права, некоторые слухи говорят, что профсоюзы формируют военизированные группы. Может ли все это быть шагами революции?"
 LIB_student_activits: "Студенческое движение"
 LIB_student_activits_desc: "Радикальные действия профсоюзов взяли под контроль не только наших работников, но и студентов и студентов протестуют на улицах по всей стране. Социалистическая революция - это просто вопрос времени, если мы не делаем что -то"
 LIB_raid_settlers: "Поселенцы рейдов"
 LIB_raid_settlers_desc: "Почему наши люди должны голодать, в то время как богатые американские поселенцы покупают дешевую землю в нашей стране и живут как короли? Набег на дома этих поселенцев и распределение их активов нашему народу продвинет революцию"
 LIB_revolision: "[GetMonth] Революция"
 LIB_revolision_desc: "Рабочие и студенты являются основой страны, и мы получаем их поддержку. Поддержка нашей революции выросла в геометрической прогрессии благодаря распределению активов колониальных американских поселенцев нашему народу, и у правительства больше нет возможности противостоять этому давлению. Давно живой Ленин долго живет революцией"
 LIB_help_to_spain: "Африканская международная бригада"
 LIB_help_to_spain_desc: "Мы завершили и стабилизировали свою собственную революцию, но война наших свободных братьев и сестер в Испании все еще еще не закончилась. При поддержке наши испанские братья и сестры смогут выбросить репрессивные фашисты и роялисты из своей страны и получить свою свободу"
 LIB_west_africa_in_flames: "Африка в пламени"
 LIB_west_africa_in_flames_desc: "Возможно, мы выиграли нашу свободу, но даже рядом с нами наши африканские братья и сестры работают в качестве рабов в нечеловеческих условиях. Если мы продолжим игнорировать это, чем мы отличаемся от этих империалистов?"
 LIB_ignite_the_flame: "Зажмите пламя"
 LIB_ignite_the_flame_desc: "Теперь, когда наша революция полностью стабилизирована, мы можем поддержать наших африканских братьев и сестер в их свободе. С оружием, рабочей силой и мужеством мы не остановимся, пока вся Африка не достигнет независимости."
 LIB_peoples_commissariat: "Комиссариат людей"
 LIB_peoples_commissariat_desc: "Еще одной необходимой частью для завершения нашей революции станет создание народного комиссариата, чтобы мы могли иметь абсолютный контроль в нашей стране и выявлять и уничтожить все, что является антиреволюционным"
 LIB_com_wargoal: "Антиимпериалистическая кампания"
 LIB_com_wargoal_desc: "Как мы можем спать хорошо, когда наши африканские братья и сестры подвергаются пыткам и порабощению каждый день? Есть ли у нас право называть себя защитниками свободы, пока вся Африка не станет свободной?"
 LIB_liberate_africans: "Освободить наших африканских братьев и сестер"
 LIB_liberate_africans_desc: "Мы должны интегрировать наших братьев и сестер из освобожденных африканских земель в нашу собственную страну и продолжить свое дело с той силой, которую мы получаем от них"
 LIB_fight_against_imperialism: "Бороться с империализмом"
 LIB_fight_against_imperialism_desc: "Мы не будем терпеть какую -либо империалистическую власть в Африке. Если они не выйдут из Африки, они будут дрожать от страха перед нами каждый день"
 LIB_professionalisation_of_guardians: "Профессионализация опекунов"
 LIB_professionalisation_of_guardians_desc: "Охранники Африканской революции до сих пор проделали хорошую работу, но они не профессиональны, и это создает проблемы в битвах, если мы тренируем наших охранников наилучшим образом, мы сможем легче отразить империалистических собак."
 LIB_spears_to_rifles: "От копья до винтовок"
 LIB_spears_to_rifles_desc: "Даже если мы преуспеем с копьями, которые у нас есть, у нас не будет шансов против дальних винтовок"
 LIB_guardians_of_the_proleteria: "Стражи пролетариата"
 LIB_guardians_of_the_proleteria_desc: "Несмотря на то, что наша революция произошла, все наши усилия будут напрасными, если мы не сможем ее защитить. Мы не можем допустить, чтобы будущее наших работников и детей было разрушено, нам нужен каждый, кто пожертвует своей жизнью ради революции"
 LIB_pep_akea_leta: "Пеп Ак Лета"
 LIB_pep_akea_leta_desc: "Наша революция была сделана народом, и мы обязаны делать то, что хотят люди, но люди должны пожертвовать чем -то для нас. Если обе стороны понимают друг друга, только тогда наша утопия станет реальностью"
 LIB_sydindacalist_reform: "Реформа децентрализации"
 LIB_sydindacalist_reform_desc: "Мы видели, что централизованная система сделала с нашей страной. Мы не сделаем эту ошибку. Позволить каждому производственному объекту скорректировать то, что наиболее подходит для себя, является правильной задачей, даже если это создает некоторые проблемы."
 LIB_guarentee_the_utiopa: "Guarentee The Utopia"
 LIB_guarentee_the_utiopa_desc: "Мы приближаемся к моменту утопии, но мы все еще недостаточно сильны, чтобы защитить его. Нам нужно стабилизировать нашу страну и достичь власти, чтобы защитить ее."
 LIB_expand_women_rights: "Расширить права женщин"
 LIB_expand_women_rights: "В стране равенства и братства неприемлемо, что женщины не могут иметь равные права с мужчинами, независимо от пола, равны и имеют равные условия"
 LIB_dismiss_the_american_company: "Уволить американскую компанию"
 LIB_dismiss_the_american_company_desc: "Насколько логично империалистические американские компании все еще колонизируют нашу страну и используют ресурсы нашего народа? Мы должны избавиться от этой компании как можно скорее и позволить профсоюзам взять под контроль."
 LIB_labour_act: "Закон о труде"
 LIB_labour_act_desc: "Мы обязаны обеспечить, чтобы рабочие, которые являются основой нашей революции, работали в лучших условиях. С принятием трудового законодательства мы будем на шаг ближе к реализации нашей утопии"
 LIB_syndacalist_manifesto: "Синдикалистский манифест"
 LIB_syndacalist_manifesto_desc: "Каждый работник должен работать в условиях, которые соответствуют человеческому достоинству и труду, профсоюзы должны быть организованы для защиты прав работников в полной мере, и каждый работник должен иметь вклад в управление стране."
  #SOCIALDEMOKRAT 
 LIB_hold_dearly_election: "Подготовка к ранним выборам"
 LIB_hold_dearly_election_desc: "Это было бы лучше для всей страны, если бы недавние события были разрешены через демократию, а не кровь, мы должны пойти на ранние выборы и решить, кто избранные люди избирают"
 LIB_Disclosure: "Раскрытие для Barclay"
 LIB_Disclosure_desc: "В стране, основанной на основе свободы, недопустимо, чтобы администрация Барклай тайно увековечивает рабство"
 LIB_United_Tribes: "Работать с племенами"
 LIB_United_Tribes_desc: "Чтобы выиграть выборы, нам нужно сыграть каждую карту в нашей руке, независимо от того, сколько племен ненавидят республику, немного денег выиграют их поддержку"
 LIB_parade_in_capital: "Парад в столице"
 LIB_parade_in_capital_desc: "Наличие парада в столице, который будет услышан по всей стране на скандалах с Барклай, и наши сделки с племенами обеспечат, чтобы мы выиграли выборы"
 LIB_Victory_of_United_People_Party: "Победа народной вечеринки"
 LIB_Victory_of_United_People_Party_desc: "Народная вечеринка наконец выиграла выборы. Это было необоснованным для тех, кто игнорировал права наших работников и выступал за то, чтобы рабство регулировало землю свободы. Теперь мы готовы стать страной, где каждый может жить счастливо"
 LIB_dissolve_hut_tax: "Растворить налог на хижину"
 LIB_dissolve_hut_tax_desc: "Почему мы облагаем налогом жилье, что является фундаментальной потребностью для каждого человека? Отмена этого налога улучшит благополучие наших людей."
 LIB_autonomy_of_tribals: "Племенная автономия"
 LIB_autonomy_of_tribals_desc: "Мы знаем о важности поддержки племен на этих выборах. Несмотря на то, что они не поддерживают республику, они решили поддержать нас на благо своей страны, и они заслуживают некоторых уступок взамен"
 LIB_Guardians_of_the_liberia: "Стражи стали"
 LIB_Guardians_of_the_liberia_desc: "Великая жертва Фолкнера принесла нам эти выборы, и Уильям Табман стал нашим новым президентом, но было бы стыдно оставить решение Фолкнера безразделенным"
 LIB_National_Bank_of_Liberia: "Национальный банк Либерии"
 LIB_National_Bank_of_Liberia_desc: "Почему банковская система нашей страны должна быть под контролем зарубежных штатов? Почему наши люди должны оставлять свои активы по милости иностранных государств? Создание собственного национального банка нашей страны повысит благосостояние нашего народа и укрепит нашу экономику."
 LIB_ekspe_balans: "Ekspe Balans"
 LIB_ekspe_balans_desc: "Нам нужно объявить нейтралитет, если мы хотим повысить благосостояние наших людей. Мы можем сосредоточить всю свою власть на нашем народе, удалив радикальные идеологии, такие как фашизм и коммунизм из нашей страны и объявления дипломатического нейтралитета"
 LIB_Skilled_labor_projekt: "Квалифицированная трудовая программа"
 LIB_Skilled_labor_projekt_desc: "Поскольку в нашей стране небольшое количество населения, нам нужно использовать рабочую силу, которую мы имеем наиболее квалифицированным образом, мы можем наилучшим образом использовать то, что мы имеем, открыв курсы для наших работников и предоставив тренинги для повышения их производительности."
 LIB_new_republic: "Новое лицо Либерии"
 LIB_new_republic_desc: "Больше нет бедной и отсталой Либерии. В настоящее время есть Либерия, где наука и техника постоянно продвигаются, где уровень процветания высок, а рабочие делают свою работу в мире"
 LIB_Kicking_Firestone_out: "Наденьте Firestone"
 LIB_Kicking_Firestone_out_desc: "Компания Firestone до сих пор хорошо обслуживала нашу страну, но она не соответствует законам нашей страны о труде и не прислушивается к нашим требованиям. К сожалению, эта компания должна перестать существовать в нашей стране."
 LIB_land_reform: "Земельная реформа"
 LIB_land_reform_desc: "Теперь, когда Firestone находится вне нашей страны, мы можем предложить их землю людям и улучшить благополучие наших людей."
 LIB_national_companies: "Национальные компании"
 LIB_national_companies_desc: "Несмотря на то, что Firestone покинул нашу страну, у нас возникают проблемы, потому что нет компании, чтобы заменить ее. При некоторой государственной поддержке мы можем заменить их, создав национальные компании."
  #MONARCHIST 
 LIB_Great_awakening: "Великое пробуждение"
 LIB_Great_awakening_desc: "Было ясно, что Уильям Тубман и его приспешники были мужчинами, привезенными, чтобы почувствовать, что что -то изменилось. Так что мы избавляемся от них раз и навсегда."
 LIB_glory_to_king: "Слава королю"
 LIB_glory_to_king_desc: ""
 LIB_african_revanchism: "Африканский реваншизм"
 LIB_african_revanchism_desc: ""
 LIB_claim_all_africa: "Претендовать на всю Африку"
 LIB_claim_all_africa_desc: ""
 LIB_empire_of_mande: "Империя Манде"
 LIB_empire_of_mande_desc: ""
 LIB_approach_germany: "Подходить к Германии"
 LIB_approach_germany_desc: ""
 LIB_join_axis: "Присоединяйтесь к оси"
 LIB_join_axis_desc: ""
 LIB_german_eq: "Немецкое оборудование"
 LIB_german_eq_desc: "Либерия подписала соглашение о покупке большого количества оружия в Германии. Это важное развитие, которое может значительно изменить баланс сил в регионе. Хотя точная область сделки не известна, подсчитано, что Либерия покупает истребительные самолеты, танки и другое оружие."
 LIB_german_specialisation: "Немецкая специализация"
 LIB_german_specialisation_desc: "Поскольку немецкие генералы приезжают в страну, у нас есть шанс дальнейшего профессионала в области боевиков, которые у нас есть. Если есть либерийская дисциплина, если не прусская дисциплина, это облегчит нам битвы."
 LIB_adapt_vai_script: "Адаптировать сценарий VAI"
 LIB_adapt_vai_script_desc: "В то время как латинский алфавит прост, Vai Alphabet - это древняя форма письма, которая исходит от наших предков."
 LIB_tribal_support: "Получить поддержку племени"
 LIB_tribal_support_desc: "Нам также нужно попросить финансовую поддержку, даже если племена от всего сердца поддерживают нас."
 LIB_tribal_warriors: "Профессионализация племенных воинов"
 LIB_tribal_warriors_desc: "Каким бы смелыми, как и племенные воины, этого уже недостаточно, чтобы быть смелым и сильным, вы также должны быть умными."
 LIB_deal_with_other_tribes: "Иметь дело с другими племенами"
 LIB_deal_with_other_tribes_desc: "Мы заключили сделку с нашими собственными племенами, но даже тогда у нас не хватает воинов. Нам нужно позвонить в другие племена."
  #ARMY 
 LIB_New_National_Defense_Law: "Новый закон национальной обороны"
 LIB_New_National_Defense_Law_desc: "Новый Закон о национальной обороне требует значительных инвестиций для модернизации и расширения либерийских вооруженных сил. Это сделает военные более грозным сдерживающим фактором против геополитических угроз, стоящих перед страной."
 LIB_aristocrat_officers: "Аристократические офицеры"
 LIB_aristocrat_officers_desc: "С момента основания Либерии аристократические классы сыграли важную роль в армии. Эта традиция была подкреплена тем фактом, что первый президент страны, Джозеф Дженкинс Робертс, также был аристократом. Аристократические офицеры были уважаются в армии за их лидерские качества, образование и семейные связи."
 LIB_standartisation: "Программа стандартизации"
 LIB_standartisation_desc: "Установка стандартов для частей оружия и боеприпасов и модернизация производственных процессов повысит эффективность вооруженной промышленности."
 LIB_enter_jungles_with_trucks: "Введите джунгли с грузовиками"
 LIB_enter_jungles_with_trucks_desc: "Современные войны требуют, чтобы армии могли быстро адаптироваться к изменяющимся ситуациям на местах и ​​эффективно маневрировать на разных фронтах. В этом контексте проект «Trucks in the Jungle» предоставит либерийской армии важное стратегическое преимущество. Грузовики позволят армии быстро и легко переносить тяжелое оружие, боеприпасы и персонал, значительно увеличивая ее логистические возможности. Это позволит армии быстрее развертываться на разных фронтах и ​​более эффективно проводить работу."
 LIB_innovative_education: "Инновационная подготовка офицеров"
 LIB_innovative_education_desc: "В прошлом подготовка офицеров в либерийской армии основывалась на традиционном подходе, посвященном дисциплине и послушанию. В то время как этот подход был эффективным в оснащении офицеров основными военными навыками, он не достиг развития лидерства, стратегии и навыков решения проблем, необходимых в современной армии."
 LIB_emergency_militarisation: "Аварийная милитаризация"
 LIB_emergency_militarisation_desc: "Для военных чрезвычайная милитаризация имеет решающее значение для обеспечения безопасности и защиты страны. Эта программа - это возможность построить возможности и потенциал военных и дать ей инструменты, необходимые для защиты Либерии от внутренних и внешних угроз. Военные стремятся реализовать эту программу ответственно и лучше всего служить либерийскому народу."
 LIB_traditional_education: "Традиционное обучение офицеров"
 LIB_traditional_education_desc: "Учебная программа традиционной программы обучения офицеров адаптирована из учебных программ французских и американских военных академий. Учебный план программы будет разработана со временем для удовлетворения конкретных потребностей Либерии."
 LIB_tribal_officers: "Племенные офицеры"
 LIB_tribal_officers_desc: "В рамках процесса модернизации либерийской армии племенные офицеры также должны пройти современную военную подготовку. Благодаря этому обучению племенные офицеры узнают о современной тактике и стратегиях войны."
 LIB_frontier_recons: "Разведывательные подразделения"
 LIB_frontier_recons_desc: "Разведывательные компании состояли из элитных солдат, обученных работать и выживают в самых суровых условиях. Они были обучены передовым методам отслеживания, использованию оружия и взрывчатых веществ, связи и первой помощи. Разведывальные компании также обучались тактике скрытности и обмана, чтобы проникнуть в вражеские линии и собирать информацию."
 LIB_tribal_forces: "Специальные племенные силы"
 LIB_tribal_forces_desc: "Программа обучения спецназа племени была интенсивной программой, которая бросала вызов солдатам как физически, так и умственно. Программа была направлена ​​на обучение кандидатам передовым боевым навыкам, навыкам обработки оружия, навыкам сбора интеллекта и навыкам выживания. Программа обучения также направлена ​​на то, чтобы привить такие ценности, как лидерство, дисциплина и патриотизм. Это позволяет солдатам эффективно выполнять свои миссии даже в самых сложных боевых условиях."
 LIB_new_weapons: "Новое оружие"
 LIB_new_weapons_desc: "Новое оружие по -прежнему будет важной частью инвентаря либерийской армии. Правительство Либерии стремится внедрить необходимые инвестиции для обеспечения того, чтобы военные по -прежнему были оснащены современным оружием. Это гарантирует, что национальная безопасность Либерии остается на самом высоком уровне защиты."
 LIB_National_Supply_forces: "Национальные силы снабжения"
 LIB_National_Supply_forces_desc: "В Конго был создан союз за закупки. Нам тоже нужен такой союз, но не так жестоко, как они. Нелегко нести пистолет в джунглях Либерии."
 LIB_found_cannons: "Используйте новые пушки"
 LIB_found_cannons_desc: "Отношения Либерии с соседями не всегда были спокойны. Поэтому для Либерии важно иметь сильные военные и быть готовыми к потенциальным нападениям. Новые артиллерийские покупки могут помочь укрепить защиту Либерии и способствовать региональной стабильности."
 LIB_Barclay_Military_Academy: "[GetLIBArmyAcamedyName]"
 LIB_Barclay_Military_Academy_desc: "Военная академия оснащена современными средствами и технологиями, чтобы предложить своим курсантам лучший образовательный опыт. Классные комнаты, лаборатории и спортивные залы оснащены новейшим оборудованием. Студенты, заканчивающие военную академию Барклай, готовы к университету или прямому вступлению в рабочую силу. С сильными академическими фондами, лидерскими навыками и чувством патриотизма, они молодые люди, готовые к формированию будущего Либерии."
  
 LIB_COMU_ACADEMY: "Военно-политическая академия Либерии"
 LIB_CHARIS_ACADEMY: "Военная академия Джеймса Роя"
 LIB_KINGS_ACADEMY: "Королевская военная академия Либерии"
 LIB_REPUBLICAN_ACADEMY: "Военная академия Томаса Фолкнера"
 LIB_BARCLAY_ACADEMY: "Эдвин Барклайский учебный центр"
  #NAVY 
 LIB_Liberian_National_Coast_Guard: "Создать либерийскую национальную береговую охрану"
 LIB_Liberian_National_Coast_Guard_desc: "Несмотря на то, что у нас есть длинная береговая линия, у нас нет флота, который может ее защитить, но это не значит, что мы не будем в будущем."
 LIB_Dominance_the_sea: "Доминировать в синей воде"
 LIB_Dominance_the_sea_desc: "Мы не можем построить грандиозные военные корабли с нашей и без того слабой экономикой, но мы можем инвестировать в менее грандиозные подводные лодки и, таким образом, стать страшной силой в глубоких морях"
 LIB_Guard_the_coasts: "Охранять побережья"
 LIB_Guard_the_coasts_desc: "Если мы хотим построить флот, мы не можем расширить в открытом море, мы не можем бюджет на такие вещи, как поддержание военно -морского флота. Но мы можем построить суда береговой охраны, чтобы защитить нашу береговую линию. И это будет более эффективным"
 LIB_submarine_effort: "Подводные усилия"
 LIB_submarine_effort_desc: "Если мы хотим быть страшной мечтой о глубоком море, нам нужно разработать наши подводные технологии более тихой, более смертоносной, более страшной подводной лодки, сделают нас правителями моря."
 LIB_naval_effort: "Военно -морские усилия"
 LIB_naval_effort_desc: "Будь то береговая охрана или охотники за глубоким морем, если мы не можем их построить, нет смысла. Нам срочно нужно увеличить количество верфи"
 LIB_Escort_Protection: "Защита сопровождения"
 LIB_Escort_Protection_desc: "Если мы собираемся защитить наши побережья, мы также должны защищать конвои, проходящие через наши побережья. Если военно -морской флот противника разрушит эти конвои, наша и без того слабая экономика может рухнуть. Хуже того, мы не сможем заменить потерянные конвои новыми."
 LIB_submarine_effort_2: "Подводная работа II"
 LIB_submarine_effort_2_desc: "Самые тихие, самые смертоносные, самые страшные подводные лодки сделают нас правителями моря"
 LIB_destroyer_effort: "Усилие разрушителя"
 LIB_destroyer_effort_desc: "Корабли разрушителя могут защитить наши конвои и провести рейды на вражеские колонны. Они идеально подходят для нашей доктрины"
 LIB_Doctrinisation: "Доктринизация"
 LIB_Doctrinisation_desc: "Если мы хотим защитить наши берега, мы должны научить наших кораблей команды кораблей. Если они не узнают, как найти вражеские подводные лодки и защищать конвои, они будут бесполезны для нас."
 LIB_finalize_the_fleet: "Завершите флот"
 LIB_finalize_the_fleet_desc: "Наш флот наконец готов к службе. Тысячи молодых людей готовы защитить нашу страну от любой угрозы, которая может прийти от морей, готовых пожертвовать своей жизнью. Наши корабли Глориуса сияют на море, как солнце. Наконец, наш флот стал стеной, на которую могут положиться народ Либерии"
 LIB_Budget_transfer_naval: "Бюджетный перевод"
 LIB_Budget_transfer_naval_desc: "Да, мы можем захотеть сделать наш флот мастером морей, но если мы пренебрегаем нашими ВВС, наш флот может быть опустошен в крупной воздушной атаке, что делает все наши усилия бесполезными. Нам нужно выделить часть нашего бюджета для укрепления наших ВВС."
  #AIR 
 LIB_air_force: "Создать либерийский национальный ВВС"
 LIB_air_force_desc: "Современные войны больше не ведутся только на море и на суше; Они также проходят в воздухе, влияя и на другие регионы. Если мы не установим наши ВВС, наши сухопутные силы могут быть уничтожены, даже не зная, что их атакует"
 LIB_integrate_aircrafts: "Интегрировать самолет"
 LIB_integrate_aircrafts_desc: "Даже если мы хотим создать наши ВВС, наша внутренняя промышленность недостаточно для этого. Интеграция самолетов, приобретенных у зарубежных стран в нашу собственную страну, является первым шагом в формировании наших собственных ВВС."
 LIB_Air_Innovations: "Воздушные инновации"
 LIB_Air_Innovations_desc: "Прошло даже не полвека с тех пор, как первый самолет вышел на небо, и точечная авиация достигла невероятной. Нам нужно внимательно следить за авиационными инновациями, чтобы наши воздушные силы могли иметь современные технологии в любой области"
 LIB_create_our_designs: "Создайте наши дизайны"
 LIB_create_our_designs_desc: "Да, наши военно -воздушные силы в настоящее время могут быть сильными благодаря самолетам из зарубежных стран, но сколько мы можем полагаться на эти самолеты? Разработка нашего собственного самолета всегда является лучшим и более разумным вариантом."
 LIB_justice_air_wing: "Либерийские воздушные крылья"
 LIB_justice_air_wing_desc: "Поскольку наш персонал обучен, наши самолеты достаточны, а наши духи свободны, теперь мы можем официально объявить наши ВВС."
 LIB_solve_range_problem: "Решить проблему диапазона"
 LIB_solve_range_problem_desc: "Независимо от того, сколько усилий мы приложили, мы не можем решить диапазон и проблемы с затратами нашего самолета, что является серьезной проблемой, которая может даже привести к кончине наших ВВС. Возможно, перераспределяя весь бюджет, выделяемый военно -морскому флоту на наши ВВС, мы можем сосредоточиться на поиске решений этих проблем."
 LIB_budget_transfer_air: "Бюджетный перевод"
 LIB_budget_transfer_air_desc: "Да, мы можем хотеть, чтобы наши ВВС доминировали в небе, но если мы не сможем защитить нашу обширную береговую линию, наши ВВС потеряют свое значение."
 #^W^END^W^# 
