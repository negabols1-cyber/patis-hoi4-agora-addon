 #События Arasaka
  japan.27.t:0 "Сандаю Ода предлагает отравить Сабуро Арасаку"
  japan.27.desc:0 "Сандаю Ода, телохранитель Ханако Арасаки, недавно пришёл с предложением. Он сказал, что планирует отравить Сабуро Арасаку в ходе секретной операции, чтобы все выглядело так, будто тот умер от естественных причин. После этого Ханако Арасака, его босс, сможет занять место своего отца во главе корпорации. Какой будет наш ответ?"
  japan.27.a:0 "Ханако будет лучшим лидером"
  japan.27.b:0 "Казнить Сандаю Оду"

  japan.29.t:0 "В штаб-квартире Arasaka разгорелась война"
  japan.29.desc:0 "Отравленный в последние месяцы Сабуро Арасака поставил все на карту, чтобы найти противоядие от яда, и, как сумасшедший, копался в исследованиях. Воспользовавшись хаосом и тем, что компания какое-то время была без лидера, Ханако и ее телохранитель Сандаю Ода атакуют штаб-квартиру с группой солдат Арасаки."
  japan.29.a:0 "Ханако наступает"
  japan.29.c:0 "Ханако преследует Сабуро"
  japan.29.b:0 "Люди Сабуро охраняют вход"
  japan.29.f:0 "Люди Сабуро отбили атаку"

  japan.30.t:0 "Кровавая война продолжается"
  japan.30.desc:0 "Нижние этажи здания сильно повреждены, а бои не стихают. Из-за глушилок внешняя связь здания отключена, и поддержки извне нет."
  japan.30.a:0 "Люди Ханако продолжают наступление"
  japan.30.b:0 "Мы не должны отступать"

  japan.31.t:0 "Кровавая война завершена"
  japan.31.desc:0 "[GetJapan31EventDesc]"
  japan.31.a:0 "Удивительно"

  japan_news.1.t:0 "Восхождение корпорации Арасака"
  japan_news.1.desc_2:0 "Корпорация Арасака захватила Японию и заявила, что теперь это новая страна, продолжающая существование Японской империи. Эта компания, которая стремится улучшить жизнь людей и остановить войны с помощью своих передовых технологий, уже привлекла к себе большое внимание в Японии и приветствуется общественностью, но общественность забывает, что любая компания пожертвует всем, чтобы сохранить свою власть."
  japan_news.1.desc:0 "По последним новостям, Япония пала в лапы опаснейшей корпорации. "Арасака" была компанией, производящей вооружение для Японии, однако правительство стало настолько зависимо от компании, что та смогла захватить страну изнутри. Пусть у компании есть возможность быстро развиваться, но когда настолько опасная компания захватывает страну, то вполне не удивительно, что она использует все ресурсы страны в своих интересах. Надеемся, что это не станет примером для других компаний и мы не станем врагами своих компаний."
  japan_news.1.a:0 "Приступим к работе"
  japan_news.1.b:0 "Принять жесткие меры!"
  
  JAP_hanako_advancing_tt:0 "§GHанко и её люди продолжают продвигаться вперед§!"
  JAP_saburo_advancing_tt:0 "§GSабуро и его люди продолжают продвигаться вперед§!"
  JAP_HANAKO_WINS:0 "После долгой и кровавой битвы победа досталась Ханко и её людям. В штабе Арасаки было полно крови. Люди Ханко арестовали Сабуро и посадили его в тюрьму, его дни сочтены, поскольку яд рано или поздно убьёт его."
  JAP_SABURO_WINS:0 "Сабуро на удивление выиграл эту битву. Он изгнал свою дочь и лишил её многих привилегий. Сандаю Ода был казнён. Похоже, что будут приложены значительные усилия для сокрытия этих событий от общественности."
  
  #Why do they still exist?
  japan_ultimatom.1.t:0 "Япония выдвигает нам ультиматум"
  japan_ultimatom.1.d:0 "Япония требует, чтобы коммунистический Китай, который Япония купила как марионетку, получил землю, и она консультируется с вами по этому вопросу, что вы думаете?"
  japan_ultimatom.1.a:0 "Япония сильнее, мы должны отдать эту землю коммунистическому Китаю."
  japan_ultimatom.1.b:0 "Нет, это станет причиной войны."
  japan_ultimatom.2.t:0 "Япония даёт нам ультиматум"
  japan_ultimatom.2.d:0 "Япония требует, чтобы коммунистический Китай, который Япония купила как марионетку, получил землю, и она консультируется с вами по этому вопросу, что вы думаете?"
  japan_ultimatom.2.a:0 "Япония сильнее, мы должны отдать эту землю коммунистическому Китаю."
  japan_ultimatom.2.b:0 "Нет, это станет причиной войны."
  japan_ultimatom.3.t:0 "Япония даёт нам ультиматум"
  japan_ultimatom.3.d:0 "Япония требует, чтобы коммунистический Китай, который Япония купила как марионетку, получил землю, и она консультируется с вами по этому вопросу, что вы думаете?"
  japan_ultimatom.3.a:0 "Япония сильнее, мы должны отдать эту землю коммунистическому Китаю."
  japan_ultimatom.3.b:0 "Нет, это станет причиной войны."
  japan_ultimatom.4.t:0 "Япония даёт нам ультиматум"
  japan_ultimatom.4.d:0 "Япония требует, чтобы коммунистический Китай, который Япония купила как марионетку, получил землю, и она консультируется с вами по этому вопросу, что вы думаете?"
  japan_ultimatom.4.a:0 "Япония сильнее, мы должны отдать эту землю коммунистическому Китаю."
  japan_ultimatom.4.b:0 "Нет, это станет причиной войны."
  japan_ultimatom.5.t:0 "Япония даёт нам ультиматум"
  japan_ultimatom.5.d:0 "Япония требует, чтобы коммунистическому Китаю, который Япония купила марионеткой, была предоставлена земля, и она консультируется с вами по этому вопросу, что вы думаете?"
  japan_ultimatom.5.a:0 "Япония сильнее нас, поэтому коммунистический Китай может забрать эту землю."
  japan_ultimatom.5.b:0 "Нет, это повод для войны."
  japan_ultimatom.6.t:0 "Япония ставит нам ультиматум"
  japan_ultimatom.6.d:0 "На этот раз Япония хочет земли, являющиеся нашим морским побережьем, ясно, что это будет сделано, но мы все еще хотели спросить вас, должны ли мы отдать их или это война?"
  japan_ultimatom.6.a:0 "Япония сильнее нас, поэтому Япония может забрать эту землю."
  japan_ultimatom.6.b:0 "Нет, это повод для войны."
  japan_ultimatom.7.t:0 "Япония ставит нам ультиматум"
  japan_ultimatom.7.d:0 "На этот раз Япония хочет земли, являющиеся нашим морским побережьем, ясно, что это будет сделано, но мы все еще хотели спросить вас, должны ли мы отдать их или это война?"
  japan_ultimatom.7.a:0 "Это не важное место для Японии, пусть берет."
  japan_ultimatom.7.b:0 "Нет, это повод для войны."
  japan_ultimatom.8.t:0 "Вопрос Гонконга"
  japan_ultimatom.8.d:0 "Японцы хотят Гонконг, являющийся нашим важным ресурсом, на самом деле это предложение следует отклонить, но вы знаете, что не можете действовать, не спросив."
  japan_ultimatom.8.a:0 "Япония сильнее нас, поэтому Япония может забрать эту землю."
  japan_ultimatom.8.b:0 "Нет, это повод для войны."
  japan_ultimatom.9.t:0 "Марионетка или смерть"
