l_russian:
  propaganda_campaings:0 "Пропагандистские кампании"
  propaganda_campaings_desc: "Пропаганда стала неотъемлемым средством поддержания национального порядка в современном мире. [propaganda_campaings_desc]"
  propaganda_campaings_default_desc:0 "С приближением войны мы не можем позволить, чтобы наши люди попали под влияние враждебных идей и в конце концов восстали против нашего правительства. Только через активные пропагандистские кампании мы сможем пережить следующее десятилетие!"
  propaganda_campaings_communist_desc:0 "С ростом фашизма и капиталистических интервенций возникла острая необходимость мобилизовать людей с помощью пропагандистских кампаний против наших врагов. Защитим коммунистическую революцию!"
  propaganda_campaings_fascist_desc:0 "Единство, сила и честь нашей страны находятся под угрозой со стороны либеральных и еще более опасных коммунистических идей. Мы должны искоренить эти понятия и заменить их новым чувством национальной гордости!"
  propaganda_campaings_democratic_desc:0 "В последние годы политические экстремисты значительно усилились и неоднократно угрожали стабильности нашей страны. Крайне важно, чтобы мы напомнили людям о наших демократических ценностях!"
  propaganda_available_tt:0 "Менее §Y3§! активных пропагандистских кампаний"

