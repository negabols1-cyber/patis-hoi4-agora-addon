  # PREPARATION
  # Add PT Decisions
  prca_deal_with_advertisers:0 "Заключить сделку с рекламодателями"
  prca_deal_with_advertisers_desc:0 "Если мы будем работать с большим количеством рекламодателей, то сможем задействовать множество видов пропаганды. Это значит, что мы сможем лучше влиять на общественное мнение различными способами."
  prca_increase_poster_production:0 "Увеличить производство плакатов"
  prca_increase_poster_production_desc:0 "Плакаты - это самый простой способ донести наши цели и идеалы до масс. Чтобы гарантировать, что мы можем продолжать эффективно использовать этот инструмент, мы должны увеличить производство новых плакатов."
  prca_publish_a_special_issue:0 "Опубликовать специальный выпуск"
  prca_publish_a_special_issue_desc:0 "Последние новости заставили некоторых из наших людей чувствовать себя неуверенно и критично. Хотя мы не можем скрыть от общественности текущие события, мы можем отвлечь их внимание с помощью специального выпуска газеты."
  prca_run_a_speech_of_leader:0 "Провести речь [Root.GetLeader]"
  prca_run_a_speech_of_leader_desc:0 "[Root.GetLeader] - это голос, который объединяет нашу нацию даже в трудные времена. Его последняя речь уже вдохновила многих людей, и очень важно, чтобы каждый мог ее услышать."
  prca_produce_a_war_movie:0 "Снять военный фильм"
  prca_produce_a_war_movie_desc:0 "Будь то драма, боевик или анимационный фильм, героические подвиги наших солдат должны быть изображены надлежащим образом. Таким образом мы можем продолжать вдохновлять армию и тыл на наше дело."
  # Отдел газет
  prca_form_newspaper_department:0 "Сформировать отдел газет"
  prca_form_newspaper_department_desc:0 "Газеты, которые могут производиться быстро и в больших количествах, предлагают идеальные средства для манипулирования общественным мнением в нашу пользу. С приближающейся войной очень важно, чтобы у нас был полный контроль над этим мощным оружием."
  prca_form_newspaper_department_tt:0 "Создает §YДепартамент газет§!, который предоставляет (недельные пропагандистские токены: §G+1,00§!)."
  prca_strengthen_cooperation_with_journalists:0 "Усилить сотрудничество с журналистами"
  prca_strengthen_cooperation_with_journalists_desc:0 "Перед журналистами стоит важная задача пристально следить за правительством и властью. Однако в такие времена совершенно не помешает убедить некоторых из этих журналистов заглушить свои критические голоса на некоторое время."
  prca_strengthen_cooperation_with_journalists_tt:0 "Изменить §YДепартамент газет§! на\nНедельные пропагандистские токены: §G+0,50§!"
  prca_increase_press_censorship:0 "Увеличить цензуру в прессе"
  prca_increase_press_censorship_desc:0 "Враждебные нации раз за разом пытались повлиять на нашу страну своей ложью. Мы не можем позволить такой иностранной пропаганде проникнуть в массы. Только наше правительство может гарантировать, что в газетах будет печататься правда."
  prca_increase_press_censorship_tt:0 "Изменить §YДепартамент газет§! на\nНедельные пропагандистские токены: §G+0,50§!\nЗащита от смещения идеологии: §G+5,00%§!"
  prca_form_radio_department:0 "Создать радиоведомство"
  prca_form_radio_department_desc:0 "Изобретение радио открыло бесчисленные новые возможности для распространения пропаганды. Контролируя транслируемые программы, мы можем гарантировать, что мощный голос нашей страны будет слышен не только среди нашего народа, но и во всем мире."
  prca_form_radio_department_tt:0 "Открывает §Yрадиоведомство§!, что даёт (Недельные жетоны пропаганды: §G+2.00§!).\n"
  prca_create_pro_governmental_radio_series:0 "Создать проправительственные радиосериалы"
  prca_create_pro_governmental_radio_series_desc:0 "Людям интересно слушать по радио о многочисленных достижениях нашего правительства. Поэтому в интересах всех, чтобы как можно больше радиосериалов рассказывали о величии нашей нации, а не о ее незначительных недостатках."
  prca_create_pro_governmental_radio_series_tt:0 "Изменяет §Yрадиоведомство§! на:\nНедельные жетоны пропаганды: §G+0.50§!\n"
  prca_invest_in_the_construction_of_radio_towers:0 "Инвестировать в строительство радиобашен"
  prca_invest_in_the_construction_of_radio_towers_desc:0 "Радиотехнология не может развиваться без необходимой инфраструктуры. Очень важно инвестировать в строительство новых радиобашен, поскольку даже самый убедительный голос не имеет значения, если его никто не слышит."
  prca_invest_in_the_construction_of_radio_towers_tt:0 "Модифицируйте §YРадио Отдел§! с помощью\nНедельных токенов пропаганды: §G+0.50§!\nСкорость строительства §YРадиостанции§!: §G+10.00%§!\n"
  prca_establish_the_capital_national_radio:0 "Создайте Национальное Радио [Root.Capital.GetName]"
  prca_establish_the_capital_national_radio_desc:0 "[Root.Capital.GetName] - политический центр нашей страны и оказывает огромное влияние на формирование общественного мнения по всем видам политических вопросов. Каждый должен знать, что столица говорит о текущем положении дел. Голос [Root.Capital.GetName] - это голос нации!"
  prca_international_radio_broadcast:0 "Международное Радиовещание"
  prca_international_radio_broadcast_desc:0 "Истинная сила радио заключается в его способности беспрепятственно транслировать сообщения через иностранные границы. Благодаря международным радиопередачам мы можем не только сдерживать противника в его собственных пропагандистских усилиях, но и привлекать сторонников нашего дела."
  prca_international_radio_broadcast_tt:0 "Открывает Решение: §YВраждебные Радиопередачи§!, которое позволяет нам вмешиваться в пропагандистские усилия стран, с которыми мы находимся в состоянии войны или которые создали большую мировую напряженность.\n"
  prca_broadcast_to_warmonger:0 "Транслировать \"[prca_broadcast_radio_station_decision]\""
  prca_broadcast_to_warmonger_desc:0 "Наши враги уже обладают множеством инструментов, чтобы сплотить людей ради своих целей, но наши радиопередачи сложно перехватить. Мы должны рассказать массам правду об этой войне!"
  prca_broadcast_to_warmonger_tt:0 "Дает '§YВраждебные радиопередачи§!', которые предоставляют (еженедельные жетоны пропаганды: §R-2.50§!) на §Y90§! дней.\n"
  # Кинодепартамент
  prca_form_movie_department:0 "Создать Кинодепартамент"
  prca_form_movie_department_desc:0 "Такого средства влияния, как фильмы, не существует. Они могут повлиять на мнение целых масс за считанные минуты. Наши враги уже снимают военные фильмы на невероятной скорости. Очень важно, чтобы мы тоже использовали это оружие для контроля над общественным мнением."
  prca_form_movie_department_tt:0 "Открывает доступ к §YКинодепартаменту§!, который дает (еженедельные жетоны пропаганды: §G+3.00§!).\n"
  prca_grant_draft_exceptions_to_actors:0 "Предоставьте освобождение от призыва актерам"
  prca_grant_draft_exceptions_to_actors_desc:0 "Мы не можем посылать наших самых известных актеров на войну, когда они нужны нам для съемок патриотичных фильмов. Они должны олицетворять храбрость и честь наших солдат... разумеется, за защитой камеры."
  prca_grant_draft_exceptions_to_actors_tt:0 "Изменяет §YКинодепартамент§!\nЕженедельные жетоны пропаганды: §G+0.50§!\nФактор доступного призывного населения: §R-5%§!\n"
  prca_produce_state_controlled_newsreels:0 "Создавать управляемые государством кинохроники"
  prca_produce_state_controlled_newsreels_desc:0 "Киножурналы, являющиеся важным источником информации, новостей и развлечений, уже привлекают множество кинозрителей. Мы должны убедиться, что в этих фильмах отражается только проправительственное мнение."
  prca_produce_state_controlled_newsreels_tt:0 "Изменить §YОтдел кино§! на\nЕженедельные пропагандистские токены: §G+0,50§!"
  prca_cooperate_with_the_entertainment_industry:0 "Сотрудничество с индустрией развлечений"
  prca_cooperate_with_the_entertainment_industry_desc:0 "Кино позволяет нам интегрировать наши идеи в сферу развлечения масс. Некоторые режиссеры уже солидарны с нашими целями, и пришло время укреплять это сотрудничество."

