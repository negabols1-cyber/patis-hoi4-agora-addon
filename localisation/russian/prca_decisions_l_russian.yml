  prca_tokens_tt:0 "§YТокены пропаганды§!\nТекущее количество токенов пропаганды: [?ROOT.prca_tokens|Y]\nЕженедельный прирост: [?ROOT.prca_tokens_weekly|=+]\n  Национальные ведомства: [?ROOT.prca_departments_tokens_weekly|=+]\n  Вражеские радиопередачи: [?ROOT.prca_hrb_add_tokens_weekly|=+]\n\n§Y[prca_newspaper_state]Ведомство газет§!\n  Еженедельные токены пропаганды: [?ROOT.prca_newspaper_tokens_weekly|=+] [prca_newspaper_modifiers]\n  Улучшения: [?ROOT.prca_newspaper_level|Y0]/2\n\n§Y[prca_radio_state]Радиоведомство§!\n  Еженедельные токены пропаганды: [?ROOT.prca_radio_tokens_weekly|=+] [prca_radio_modifiers]\n  Улучшения: [?ROOT.prca_radio_level|Y0]/4\n\n§Y[prca_movie_state]Киноведомство§!\n  Еженедельные токены пропаганды: [?ROOT.prca_movie_tokens_weekly|=+] [prca_movie_modifiers]\n  Улучшения: [?ROOT.prca_movie_level|Y0]/3\n\nТекущий максимум: §Y500§!"
  prca_tokens_tt_desc:0 "§YТокены пропаганды§! используются для запуска кампаний пропаганды, которые дают важные преимущества над противником. Их можно получить с помощью различных §Yподготовок§! или путем создания §Yведомств§!."
  prca_department_locked:0 "§Y(£prca_lock_ico!) §!"
