  GER_aid_hun_rom_democratic_civil_war:0 "Молодые демократии"
  GER_aid_hun_democratic_civil_war:0 "Вмешаться в венгерскую гражданскую войну"
  GER_aid_rom_democratic_civil_war:0 "Вмешаться в румынскую гражданскую войну"
  GER_austro_hungarian_empire:0 "Австро-Венгрия"
  GER_mefo_bills_category:0 "Мефо-векселя"
  GER_mefo_bills_category_desc:0 "Для финансирования развития нашей военной промышленности и сокрытия этого от бдительных глаз британцев и французов мы вынуждены осуществлять платежи через балансовый счет сторонней организации в виде долговых расписок. Если мы не воспользуемся своими политическими связями, чтобы отсрочить сроки погашения этих расписок, нам придется их погашать, и мы потеряем те преимущества, которые они дают."
  GER_mefo_bills_mission:0 "Оплата счетов MEFO"
  GER_can_delay_mefo_payment:0 "Можно отложить оплату счетов MEFO."
  GER_mefo_bills_mission_desc:0 "Срока оплаты наших выпущенных векселей наступает в ближайшее время. Необходимо решить, будем ли мы продлевать их или начнем погашение."
  GER_extend_mefo_bills:0 "Счета MEFO"
  GER_extend_mefo_bills_desc:0 "Продлить срок погашения счетов MEFO на 3 месяца, что позволит нам продолжать получать их выгоды в течение этого периода. Но это также увеличит стоимость наших платежей в будущем."
  GER_extend_mefo_bills_tt:1 "Выберите, продлевать '§YСчета MEFO§!' или начать платежи.\n"
  GER_mefo_bills_mission_tt:1 "Оформить шестимесячное продление '§YСчетов MEFO§!', вступающее в силу со дня погашения текущего пакета счетов MEFO.\n\nСтоимость каждого продления будет постепенно увеличиваться до начала войны, когда зависимость от счетов MEFO будет снята и платеж будет отсрочен до завершения войны.\n\n"
  GER_mefo_bills_effect_in_days:1 "Произойдет через [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дней:\n"
  GER_mefo_bills_extension_timer:0 "До даты погашения MEFO Bills."
  GER_mefo_bills_extension:0 "Менее 60 дней с момента продления MEFO Bills."
  GER_mefo_bills_extended:0 "Продленные MEFO Bills"
  GER_renew_mefos:0 "Продлить MEFO Bills"
  GER_renew_mefos_desc:0 "Рейхсбанк играет ключевую роль в восстановлении и перевооружении нашей нации. Очевидно, что мы совершили ошибку, приняв решение погасить наши долги, и мы должны продлить MEFO Bills еще на несколько месяцев."
  GER_cancel_mefos:0 "Отменить MEFO Bills"
  GER_cancel_mefos_desc:0 "Мы слишком долго полагались на Рейхсбанк в восстановлении нашей оружейной промышленности. Пришло время выполнить наши долговые обязательства перед нашими производителями оружия и положить конец этой пародии с "MEFO Bills"."
  GER_case_anton_category:0 "Операция \"Антон\""
  GER_case_anton_category_desc:0 "Цель создания Вишистской Франции всегда заключалась в том, чтобы не допустить попадания французских колоний и французского флота в руки союзников. Однако это соглашение, которое мы можем расторгнуть в любое время. У нас есть план принудительной интеграции этой территории, а также молниеносный удар по базе французского флота в Тулоне."
  GER_case_anton:1 "Осуществить операцию \"Антон\""
  GER_case_anton_tt2:2 "Не контролирует большинство французских государств в Северной Африке."
  GER_case_anton_desc:0 "Наш марионеточный режим во Франции исчерпал свою полезность. Мы начнем интеграцию в [Root.GetName] немедленно, и, если мы будем двигаться достаточно быстро, мы даже сможем взять под свой контроль остатки французского флота."
  GER_case_anton_tt:0 "Аннексировать Вишистскую Францию через 7 дней и захватить французский флот.\n\n§RФранция сможет затопить свой флот, если немецкие войска не окажутся в Тулоне в течение 2 дней!§!\n"
  GER_case_red:0 "Красный план"
  GER_operation_marita:0 "Операция \"Марита\""
  political_actions:0 "Политические действия"
  ban_fascist_party:0 "Запретить фашизм"
  ban_fascist_party_desc:0 "В сложившейся ситуации разрешение фашистским партиям продолжать деятельность подорвет нашу способность эффективно управлять. Необходимо принять решительные меры."
  ban_fascist_party_tt:1 "Изменение популярности фашизма: §G-§![?.Root.party_popularity@fascism|%0G].\n"
  ban_democratic_party:1 "Запретить демократические партии"
  ban_democratic_party_desc:1 "Партии политического центра слишком долго были занозой в боку нашего правительства. Их настойчивость в вопросе \"прав\" отдельных лиц подрывает наши усилия по созданию лучшей страны для всего нашего населения."
  ban_democratic_party_tt:1 "Изменение популярности демократии: §G-§![?.Root.party_popularity@democratic|%0G].\n"
  ban_communist_party:0 "Запретить коммунизм"
  ban_communist_party_desc:0 "Коммунистическая партия не устаёт критиковать правительство, сеять смуту и усложнять жизнь в целом. Пора их усмирить."
  ban_communist_party_tt:1 "Изменение популярности коммунизма: §G-§![?.Root.party_popularity@communism|%0G].\n"
  anti_fascist_raids:0 "Облава на фашистов"
  anti_fascist_raids_desc:0 "Нам необходимо подавить фашистские элементы в нашей нации, чтобы обеспечить стабильность на долгий срок. Их влияние слишком велико, и, возможно, оно может стать проблемой для правительства."
  anti_democratic_raids:0 "Облава на демократов"
  anti_democratic_raids_desc:0 "Нам необходимо подавить демократические элементы в нашей нации, чтобы обеспечить стабильность на долгий срок. Их влияние слишком велико, и, возможно, оно может стать проблемой для государства."
  anti_communist_raids:0 "Облава на коммунистов"
  anti_communist_raids_desc:0 "Нам необходимо подавить коммунистические элементы в нашей нации, чтобы обеспечить стабильность на долгий срок. Их влияние слишком велико, и, возможно, оно может стать проблемой для правительства."
  object_to_attaches:0 "Возмутиться атташе"
  object_to_attaches_desc:0 "Наши враги получают иностранную помощь! Необходимо выразить твердый протест и потребовать отозвать атташе."
  infrastructure_building_slot:0 "Индустриальная интеграция по всему региону"
  infrastructure_building_slot_flag:0 "Инфраструктура ещё не получила дополнительный слот под строительство."
  war_building_slot:0 "Присвоение промышленной земли"
  war_building_slot_flag:0 "Ещё не получил дополнительный строительный слот от захвата территории."
  special_projects:0 "Специальные проекты"
  CHI_xian_fired:0 "Китайские лидеры приглашены в Сиань"
  JAP_intervene_in_china_level_down:0 "Снизить уровень вмешательства в дела Китая"
  JAP_china_step_up_war_effort:0 "Обострение войны в Китае"
  JAP_ichi_go:0 "Ичи-го"
  JAP_ichi_go_desc:0 "Конец войны близок. Финальным толчком и решительными действиями мы сможем быстро завершить конфликт. Однако если мы не сможем добиться победы в течение следующего года, нас может ждать внутренняя нестабильность, так как общественное мнение восстанет против увеличения военных усилий..."
  JAP_conquer_china:0 "Захват Китая"
  JAP_release_korea:0 "Независимость Кореи"
  JAP_southern_expansion:0 "Экспансия на юг"
  JAP_sue_for_peace_CHI:1 "Предложить условия капитуляции [From.GetNameDef]"
  JAP_sue_for_peace_TT:0 "У §YЯпонии§! или её сателлитов нет под контролем континентальных §Yкитайских§! или §Yкорейских§! территорий."
  JAP_sue_for_peace_CHI_desc:0 "Мы потеряли влияние на континент. Военные считают маловероятным, что мы сможем вернуть утраченные территории. Гражданское правительство предлагает начать переговоры, чтобы, по крайней мере, сохранить наш суверенитет над островами."
  JAP_sue_for_peace_MAN:0 "Предложить условия капитуляции [From.GetNameDef]"
  JAP_sue_for_peace_MAN_desc:0 "Мы потеряли контроль над материком. Военные считают, что мы вряд ли сможем вернуть утраченные территории. Гражданское правительство предлагает нам пойти на переговоры, чтобы хотя бы сохранить суверенитет над островами."
  JAP_sue_for_peace_nuke:0 "Предложить безоговорочную капитуляцию"
  JAP_sue_for_peace_nuke_desc:0 "Враг применил новую и весьма жестокую бомбу. Война развивается явно не в нашу пользу. Мы должны вытерпеть невыносимое."
  JAP_sue_for_peace_nuke_mission:0 "Нанести ядерные удары по японским территориям"
  JAP_sue_for_peace_nuke_mission_desc:1 "Недавнее успешное испытание ядерной бомбы дает альтернативу полномасштабному вторжению на Японские острова. Разведка предполагает, что если мы отнимем у японцев контроль над Окинавой и Иводзимой и сократим их флот до 30 кораблей, то удары по двум целям на Японских островах с применением ядерных бомб в быстрой последовательности вынудят японское правительство безоговорочно капитулировать."
  JAP_request_soviet_support:0 "Попросить поддержки у Советского Союза"
  JAP_request_soviet_support_desc:0 "Нам нужна помощь в нашей гражданской войне, и наиболее вероятными сторонниками нашего дела являются Советы на севере. Возможно, мы могли бы обменять полуостров Южный Сахалин на группу советских добровольческих дивизий."
  JAP_nuke_1:0 "Нанесен первый ядерный удар по Японии"
  JAP_nuke_2:0 "Нанесен второй ядерный удар по Японии"
  foreign_politics:0 "Внешняя политика"
  JAP_pressure_france:1 "Требовать Индокитай"
  JAP_break_the_london_naval_treaty:0 "Отказаться от Лондонского военно-морского договора"
  JAP_break_the_london_naval_treaty_desc:0 "Возмутительные ограничения Лондонского военно-морского договора угрожают безопасности нашей нации. Мы должны иметь свободу строить флот, который сможет противостоять любой нации, которая захочет оспорить то, что по праву наше."
  JAP_tora_tora_tora:0 "Тора! Тора! Тора!"
  JAP_tora_tora_tora_desc:0 "Первый удар ждет. В дальнейшем нам нужно действовать быстро, используя полученный импульс, чтобы сломить наших врагов, прежде чем они поймут, что произошло."
  JAP_war_with_soviet_union:1 "Объявить войну [SOV.GetNameDef]"
  JAP_war_with_soviet_union_desc:1 "Наши союзники в Европе подписали пакт о ненападении с [SOV.GetNameDef]. Однако мы не можем ждать. Мы должны самостоятельно начать конфликт с коммунистами, даже если это грозит отчуждением наших союзников."
  prospect_for_resources:1 "Искать ресурсы"
  prospect_for_resources_desc:0 "Наши геологи нашли ряд перспективных месторождений полезных ископаемых на нашей территории. Мы можем потратить часть капитала на освоение этих месторождений. Прогресс в области технологий добычи может сделать больше месторождений пригодными для разработки."
  economy_decisions:0 "Экономическая политика"
  institute_press_censorship_fascist_state:0 "Ввести цензуру прессы"
  institute_press_censorship_fascist_state_desc:0 "Сейчас очень опасное время и мы не можем допустить, чтобы чьи-то голоса разожгли огонь распрей в нашей стране. Ограничение свободы прессы необходимо, чтобы истинное мнение граждан было услышано громко и ясно."
  institute_press_censorship_democratic_state:0 "Установить цензуру прессы"
  institute_press_censorship_democratic_state_desc:0 "Сейчас очень опасное время и мы не можем допустить, чтобы чьи-то голоса разожгли огонь распрей в нашей стране. Ограничение свободы прессы необходимо, чтобы истинное мнение граждан было услышано громко и ясно."
  institute_press_censorship_communist_state:0 "Установить цензуру прессы"
  institute_press_censorship_communist_state_desc:0 "Сейчас очень опасное время и мы не можем допустить, чтобы чьи-то голоса разожгли огонь распрей в нашей стране. Ограничение свободы прессы необходимо, чтобы истинное мнение граждан было услышано громко и ясно."
  institute_press_censorship_neutrality_state:0 "Установить цензуру прессы"
  institute_press_censorship_neutrality_state_desc:0 "Сейчас очень опасное время и мы не можем допустить, чтобы чьи-то голоса разожгли огонь распрей в нашей стране. Ограничение свободы прессы необходимо, чтобы истинное мнение граждан было услышано громко и ясно."
  JAP_colonial_independence:0 "Независимость колоний"
  JAP_return_manchuria:0 "Возвращение Маньчжурии"
  PRC_return_manchuria_communist:0 "Требовать возвращения Маньчжурии"
  PRC_return_manchuria_communist_desc:0 "Японские империалисты забрали Маньчжурию у ее законных владельцев — свободного народа Китая. Теперь, когда наши товарищи в Японии изгнали угнетателей, мы должны просить, чтобы она была возвращена народу."
  JAP_liberate_manchuria_alliance_tt:0 "Отправляет предложение о создании альянса."
  JAP_interservice_rivalry:0 "Межведомственное соперничество"
  JAP_interservice_rivalry_desc:0 "Императорский военно-морской флот и Императорская армия ведут жестокую борьбу за наши ограниченные ресурсы. Мы провели регулярные конференции, чтобы гарантировать, что наши ресурсы расходуются по назначению. То, что мы окажем предпочтение тому или иному, будет иметь далеко идущие последствия."
  JAP_steel_for_guns:0 "Распределите сталь для производства оружия в первую очередь"
