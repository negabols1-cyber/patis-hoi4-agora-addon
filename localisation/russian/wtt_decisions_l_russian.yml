  demob_economic_mission:0 "Демобилизовать экономику"
  demob_manpower_mission:0 "Ослабить призыв"
  demobilization_desc:0 "Угроза войны миновала, и люди больше не согласны мириться с тяготами военного времени. Нужно пересмотреть наши законы и внести изменения в законодательство, чтобы усмирить протестующих, прежде чем ситуация обострится."
  demobilization_economic_desc:0 "Угроза войны миновала, и люди больше не согласны мириться с тяготами военной экономики. Следует пересмотреть наши экономические законы и рассмотреть возможность их изменения в сторону производства большего количества потребительских товаров, чтобы удовлетворить потребности людей."
  draft_dodging_mission:0 "Решить кризис с уклонением от призыва"
  draft_dodging_mission_desc:0 "Если не принять быстрые меры по урегулированию проблемы призывников, отказывающихся служить, ситуация лишь ухудшится и может привести к тому, что население усомнится в авторитете правительства."
