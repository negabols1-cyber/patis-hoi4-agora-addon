  form_roman_empire:1 "Mare Nostrum!"
  form_persian_empire:0 "Воссоздать Персидскую империю"
  form_byzantine_empire:0 "Восстановить Византию"
  byz_triumph_for_italy:0 "Триумф Италии"
  byz_triumph_for_italy_desc:0 "Италия перешла под наш контроль, и мы должны реинтегрировать ее в империю на торжественной церемонии!"
  byz_triumph_for_middle_east:0 "Триумф Леванта"
  byz_triumph_for_middle_east_desc:0 "Левант перешел под наш контроль, и мы должны реинтегрировать его в империю на торжественной церемонии!"
  byz_triumph_for_egypt_and_tunis:0 "Триумф Египта и Туниса"
  byz_triumph_for_egypt_and_tunis_desc:0 "Египет и Тунис перешли под наш контроль, и мы должны заново интегрировать их в империю на славной церемонии!"
  form_arabia:0 "Объединить Аравию"
  form_majapahit_empire:0 "Воссоздать морскую державу"
  form_rattanakosin_kingdom:0 "Укрепить наследие Раттанакосина"
  form_hre:0 "Восстановить Священную Римскую империю"
  form_scandinavia_category:0 "Восстановить Кальмарскую унию"
  form_scandinavia_category_desc:0 "С завоеванием всех Скандинавских территорий пришло время восстановить дух Кальмарской унии. Вся Скандинавия будет процветать под нашим правлением."
  form_nordic_league_category:0 "Объявить о единстве Северных стран"
  form_nordic_league_category_desc:0 "Скандинавы давно чувствовали определенное родство друг с другом. Теперь, когда мы контролируем все земли, когда-то принадлежавшие скандинавским государствам-участникам, возможно поднять это родство на новые высоты."
  form_gran_colombia_category:0 "Возродить наследие Боливара"
  form_gran_colombia_category_desc:0 "Хотя эксперимент Большой Колумбии был недолгим еще столетие назад, нам сейчас снова удалось захватить контроль над его территориями. Мы снова можем воплотить мечту Боливара."
  form_austria_hungary_category:0 "Восстановить Австро-Венгерскую империю"
  form_austria_hungary_category_desc:0 "Старые австро-венгерские земли были завоеваны, и как единственное оставшееся государство-преемник, мы должны восстановить Империю. Давайте не будем медлить и сделаем это прямо сейчас."
  form_commonwealth_category:0 "Восстановить Содружество"
  form_commonwealth_category_desc:0 "Между Польшей и Литвой сложилась длительная история. Теперь, когда мы снова объединились силой оружия, возможно, пришло время возродить самые славные дни нашего прошлого."
  form_united_netherlands_category:0 "Отказаться от Лондонского договора"
  form_united_netherlands_category_desc:0 "Лондонский договор 1839 года позорно разделил Нидерланды на Северные и Южные после слишком короткого периода единства. Теперь, под нашим руководством, мы можем воссоздать те дни и занять подобающее нам место в качестве противовеса Франции и Германии."
  form_united_central_america_category:0 "Восстановить Федеративную Республику"
  form_united_central_america_category_desc:0 "Могущественное государство, часть которого составляла наша нация столетие назад, прожило слишком недолгую жизнь. Теперь, когда мы завоевали сепаратистские государства, которые привели к его падению, мы можем начать восстанавливать федеративную республику и распространять силу единой Центральной Америки."
  form_baltic_federation_category:0 "Объединить Прибалтику"
  form_baltic_federation_category_desc:0 "Наши предыдущие декларации о региональной солидарности и единой внешней политике могут быть улучшены только теперь, когда вся Прибалтика находится под нашим контролем. Интеграция наших бывших соседей обеспечит большую безопасность для всех перед лицом опасностей на Западе и Востоке."
  form_ottoman_empire_category:0 "Восстановить Османскую империю"
  form_ottoman_empire_category_desc:0 "В ходе боевых действий нам удалось сбросить путы слабости, которыми нас опутали после Великой войны. Чтобы отметить это историческое событие, ничто не подойдет лучше, чем восстановление великой Османской империи."
  form_european_union_category:0 "Осуществление единения Европы"
  form_european_union_category_desc:0 "Хотя концепция единой Европы с политической точки зрения получила развитие только в последние десятилетия, недавние наши завоевания большинства мощнейших европейских держав создали реальность, которую мы никак не ожидали. Может быть, реорганизация нашей страны необходима для полного использования преимуществ, которые она нам даст."
  form_mutapa_category:0 "Восстановление империи Зимбабве"
  form_mutapa_category_desc:0 "Избавившись от колониального влияния на юге континента, настало время объединить народы под флагом одной из империй прошлого. В этом регионе существовало их немало, и нам нужно только название, которое станет символом."
  form_roman_empire_category:0 "Осуществление римских амбиций"
  form_roman_empire_category_desc:0 "Идея создания империи, простирающейся на весь бассейн Средиземного моря, в последние годы получила развитие в народном сознании. Наши военные походы превзошли самые смелые мечты даже наших самых ревностных сторонников, и теперь мы оказались на грани реализации этих амбиций. Roma invicta!"
  form_persian_empire_category:0 "Восстановление Персидской империи"
  form_persian_empire_category_desc:0 "Наши недавние завоевания достигли границ древней Персидской империи. Принимая во внимание богатую историю нашего региона, разве мы можем упустить возможность заявить о нашей державе как о продолжателе империй прошлого?"
  form_byzantine_empire_category:0 "Восстановить Византию"
  form_byzantine_empire_category_desc:0 "Освободив наши старые территории от турецкого ига, мы теперь, благодаря небольшой пропаганде, можем заявить о своей нации как о преемнице той самой империи, которую турки уничтожили пять веков назад. Это наследие, безусловно, обеспечит рост нашего международного престижа!"
  form_arabia_category:0 "Объединить Аравию"
  form_arabia_category_desc:0 "Слишком долго арабские государства были разделены региональными распрями. Теперь, когда мы объединили полуостров под нашим владычеством, мы наконец можем объявить о создании единой Аравии!"
  form_majapahit_empire_category:0 "Восстановить талассократию"
  form_majapahit_empire_category_desc:0 "Много веков назад великая империя занимала Индонезийский архипелаг и контролировала его торговлю. Нам удалось расширить наши границы, охватив пространство этой империи, и её возрождение может послужить символом единства региона."
  form_rattanakosin_kingdom_category:0 "Укрепить наследие Раттанакосин"
  form_rattanakosin_kingdom_category_desc:0 "В последние годы мы отошли от традиционных ценностей, на которых изначально была основана наша нация. Теперь, когда мы достигли территориального охвата наших славных дней, возможно, пришло время теснее связаться с нашей историей."
  form_hre_category:0 "Возродить Священную Римскую империю"
  form_hre_category_desc:0 "Великолепие нашей Кайзерин не знает границ, как и границы нашей нации. Сейчас они выросли до размеров старой Священной Римской империи, и народы, стоявшие на нашем пути, больше не могут возражать против нашей политики. Кайзерин постановила, что текущая возможность должна быть использована, и что нация должна принять на себя роль духовного преемника Священной Римской империи. Aquila Elegit Iovis Omnia Vincit!"
  form_greater_german_reich_category:0 "Провозгласить Великую Германскую Империю"
  form_greater_german_reich_category_desc:0 "Наши враги были повергнуты перед нами, и наши цели по расширению на Восток были достигнуты. Сейчас самое время заставить мир понять величие нашей нации и начать превращать нашу столицу во что-то, чем все могут гордиться."
  form_greater_german_reich:0 "Провозгласить Великую Германскую Империю"
  form_country_andalusia_coring_states_tt:0 "Получить ядра для всех §Yиспанских§! и §Yпортугальских§! государств.\n"
  form_country_polynesia_coring_states_tt:0 "Получить ядра для всех §YПолинезийских островов§!.\n"
