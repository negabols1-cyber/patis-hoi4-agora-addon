  CHI_expand_the_burma_road:0 "Расширение Бирманского пути"
  owner_of_state_in_faction_tt:0 "Все государства в Бирме принадлежат §Y[ROOT.GetName]§! или находятся в §Yфракции§! с §Y[Root.GetName]§!."
