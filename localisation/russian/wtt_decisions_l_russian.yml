  CHI_detect_infiltration_tooltip:0 "У нас есть §Y10%§! шанс выявить §Yкоммунистические ячейки§! в каждом государстве, где они присутствуют.\n"
  CHI_xian_incident:0 "Сианьский инцидент"
  CHI_instigate_xian_incident:0 "Пригласить [CHI.GetLeader]"
  CHI_xian_incident_desc:0 "Нашу страну ослабляют внутренние распри, тогда как Япония явно нацелилась на нашу территорию. Мы должны заставить националистов и коммунистов объединиться и создать единый фронт."
  CHI_foreign_support:0 "Иностранная поддержка"
  foreign_support:0 "Поддержка Китая"
  CHI_flying_tigers:0 "Отправить Летающих тигров"
  flying_tigers_tt:0 "Вы получите 150 наших истребителей.\n"
