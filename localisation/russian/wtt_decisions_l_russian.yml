  war_propaganda_against_tension_desc:0 "Мы должны встать против угрозы от [From.GetName]. Наша нация рассчитывает, что каждый человек сделает свою часть для нашей безопасности."
  war_propaganda_against_warmonger:1 "Военная пропаганда против [From.GetName]"
  war_propaganda_against_warmonger_desc:0 "Нация призывает каждого мужчину, женщину и ребенка. Война, подобная войне [From.GetName], может произойти и здесь."
