  hold_fight_on_the_beaches_speech:0 "Провести речь «Будем сражаться на пляжах»"
  hold_fight_on_the_beaches_speech_desc:0 "'Мы пойдем до конца. Мы будем сражаться во Франции, мы будем сражаться на морях и океанах, мы будем сражаться с растущей уверенностью и растущей силой в воздухе, мы будем защищать наш остров, какой бы ни была цена. Мы будем сражаться на пляжах, мы будем сражаться на посадочных площадках, мы будем сражаться в полях и на улицах, мы будем сражаться на холмах; мы никогда не сдадимся...'"
  fight_on_the_beaches_speech:0 "Речь «Будем сражаться на пляжах»"
  operation_fork:0 "Операция «Вилка»"
  operation_fork_desc:0 "Недавно обретшая независимость Исландия занимает чрезвычайно важное стратегическое положение в Северной Атлантике. Потеря Норвегии поставит беззащитный остров в уязвимое положение. Мы должны опередить наших врагов во вторжении и оккупации Исландии, чтобы они не получили стратегические базы острова, с которых они могут подвергнуть опасности наши линии снабжения. Только под нашей защитой [ICE.GetAdjective]ы будут в безопасности от наших врагов."
  ENG_operation_valentine: "Операция «Валентина»"
 ENG_operation_valentine_desc: "Мы защитим Фарерские острова от всех тягот войны и удобно расположимся там с моря и с воздуха до тех пор, пока не наступит момент, когда они будут возвращены Дании, освобожденной от грязного рабства, в которое она погрузилась из-за вражеской агрессии, а также усилим свою позицию в Северном море."
 invade_ireland:0 "Напасть на [IRE.GetNameDef]"
 invade_ireland_desc:0 "Мы должны обеспечить безопасность наших конвоев любыми необходимыми средствами. Вторжение в [IRE.GetNameDef] может показаться некоторым из нас неприемлемым, но если это то, что нужно для использования их авиабаз, то так тому и быть."
 macdonald_proposal:0 "Предложение Макдональда"
 macdonald_proposal_desc:0 "Мы должны обеспечить безопасность наших конвоев, и для достижения этой цели [IRE.GetAdjective] авиа- и военно-морские базы имеют первостепенное значение. Мы отправим посланника, чтобы предложить обмен Северной Ирландией в обмен на немедленное вступление [IRE.GetNameDef] в войну на нашей стороне."
 hold_blood_toil_tears_sweat_speech:0 "Выступление "Кровь, труд, слёзы и пот""
  hold_blood_toil_tears_sweat_speech_desc:0 "'Я ничего не могу предложить вам, кроме крови, тяжкого труда, слёз и пота. [...] Вы спрашиваете, какова наша политика? Я отвечу: вести войну, на море, на суше и в воздухе, со всей нашей мощью и со всей силой, которую может нам дать Бог. Вести войну против чудовищной тирании, не превзойдённой в мрачном и прискорбном каталоге человеческих преступлений. Вот наша политика. Вы спрашиваете, какова наша цель? Я могу ответить одним словом: победа. Победа любой ценой — победа вопреки всему ужасу — победа, как бы долго и трудно ни был путь, ибо без победы не будет и спасения.'"
  blood_toil_tears_sweat_speech:0 "Речь \"Кровь, тяжкий труд, слёзы и пот\""
  hold_this_was_their_finest_hour_speech:0 "Прочитать речь \"Это был их лучший час\""
  hold_this_was_their_finest_hour_speech_desc:0 "'Давайте приготовимся к выполнению нашего долга, и так проявим себя, что если Британская империя и Содружество будут жить тысячу лет, люди всё равно скажут: это был их лучший час.'"
  this_was_their_finest_hour_speech:0 "Речь \"Это был их лучший час\""
  mers_el_kebir_raid:1 "Операция \"Катапульта\""
  mers_el_kebir_raid_desc:0 "Французский флот попал в руки вишистской Франции, и мы не можем допустить, чтобы он попал в руки Германии. Как бы ни было противно, мы должны потребовать немедленной капитуляции флота нашего бывшего союзника, под угрозой бомбардировки."
  FRA_vichy_france:0 "Вишистская Франция"
  FRA_scuttle_the_fleet:0 "Затопить флот"
  FRA_scuttle_the_fleet_desc:0 "Иностранные силы пытаются силой захватить контроль над нашим флотом. Мы не можем допустить этого и должны затопить свои корабли!"
  FRA_case_anton_mission:0 "Операция «Антон» в действии"
  case_anton:0 "Операция «Антон»"
  FRA_case_anton_mission_tt:0 "Аннексия отменена."
  war_measures:0 "Военные меры"
  women_in_the_workforce:0 "Женщины в рабочей силе"
  women_in_the_workforce_desc:0 "Когда мужчины уходят на войну, тысячи женщин устраиваются на работу на заводах, чтобы поддерживать работу военной машины."
  scientist_refuge:0 "Убежище для учёных"
  scientist_refuge_desc:0 "Учитывая текущий политический климат в Европе, некоторые учёные решили покинуть свою страну. Они подали заявление на получение въездной визы в нашу страну. Предоставление визы даст нам бонус к исследованиям, но также расстроит некоторых людей, которые считают, что это внутренний вопрос, в который мы не должны вмешиваться."
  give_refuge_ger:0 "Предоставить убежище [GER.GetAdjective] учёным"
  give_refuge_ita:0 "Предоставить убежище [ITA.GetAdjective] учёным"
  operations:0 "Операции"
  GER_military_buildup:0 "Военное укрепление"
  GER_weserubung_sud:0 "Везерюбунг-Зюд"
  GER_weserubung_sud_desc:0 "Чтобы получить хорошую базу для вторжения в Норвегию, мы сначала должны двинуться на Данию."
  GER_weserubung_nord:0 "Везерюбунг-Норд"
  GER_weserubung_nord_desc:0 "Норвегия - критически важная стратегическая точка и станет очевидным направлением для атаки любого противника, желающего нарушить нашу стальную торговлю со Швецией. Мы не можем рисковать тем, что наши враги создадут базы в этом регионе."
  GER_case_yellow_netherlands:0 "Желтый план - Нидерланды"
  GER_case_yellow_netherlands_desc:0 "Атака через Бельгию заставляет нас проходить слишком узким фронтом. Мы должны расширить наш военный план, чтобы включить Нидерланды, чтобы избежать ошибок, допущенных в 1914 году."
  GER_case_yellow_belgium_luxembourg:0 "Желтый план - Бельгия и Люксембург"
  GER_case_yellow_belgium_luxembourg_desc:0 "Атака через линию Мажино равносильна самоубийству. Мы обойдем ее с севера и двинемся через Арденны, чтобы обойти самые тяжелые укрепления."
  GER_polish_ultimatum:0 "Выдвинуть ультиматум Польше"
  SOV_industry_relocation:0 "Перемещение промышленности"
  SOV_relocate_industry_from_moscow:0 "Переместить промышленность из Москвы"
  SOV_relocate_industry_from_moscow_desc:0 "Эвакуация тяжелой техники наших московских фабрик на Урал - огромная задача, но она необходима для обеспечения нашего военного производства."
  SOV_relocate_industry_from_moscow_tt:0 "§RДля того, чтобы эти эффекты действовали, необходим контроль над Москвой, когда время принятия решения истечет.§!"
  SOV_relocate_industry_from_leningrad:0 "Переместить промышленность из Ленинграда"
  SOV_relocate_industry_from_leningrad_desc:0 "Эвакуация тяжелой техники наших ленинградских фабрик на Урал - огромная задача, но она необходима для обеспечения нашего военного производства."
  SOV_relocate_industry_from_leningrad_tt:1 "§RДанные эффекты требуют контроля над [569.GetName] после истечения действия решения.§!"
  SOV_relocate_industry_from_smolensk:0 "Перенос производства из Смоленска"
  SOV_relocate_industry_from_smolensk_desc:0 "Эвакуация крупной промышленности из заводов в Смоленске на Урал - огромная задача, но она необходима для обеспечения нашего военного производства."
  SOV_relocate_industry_from_smolensk_tt:0 "§RДанные эффекты требуют контроля над Смоленском после истечения действия решения.§!"
  relocate_industry_repair:1 "Некоторые заводы необходимо будет восстановить!"
  SOV_order_227:0 "Приказ 227"
  SOV_order_227_desc:0 ""Пора прекратить отступление. Ни шагу назад!""
  SOV_scorched_earth:0 "Реализация тактики выжженной земли"
