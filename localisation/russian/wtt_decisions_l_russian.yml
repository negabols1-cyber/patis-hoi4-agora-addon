  develop_baghdad_oil_fields:0 "Разработка нефтяных месторождений Аз Зубайр и Нахр Умр"
  develop_mosul_oil_fields:0 "Разработка нефтяных месторождений Баба Гургур"
  develop_nejd_oil_fields:0 "Разработка нефтяных месторождений Гавар"
  develop_eastern_desert_oil_fields:0 "Разработка нефтяных месторождений Рас-Гариб"
  develop_qatar_oil_fields:0 "Разработка нефтяных месторождений Дукхан"
  burma_road_expansion_tt:0 "Завершен либо фокус §YДорога в Бирму§!, либо §YДорога в Бирму§!, либо страна состоит в фракции или является сателлитом государства, которое обладает этими фокусами." #NOTE: это названия uk_burma_focus и CHI_burma_road
