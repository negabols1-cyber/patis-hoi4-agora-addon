  SOV_scorched_earth_stalingrad:0 "Выполнение тактики выжженной земли при подходе к Сталинграду"
  GER_reichskommissariats:0 "Рейхскомиссариаты"
  GER_reichskommissariats_desc:0 "Позволяет создавать определённые объекты Рейхскомиссариата на подконтрольной территории.\n\n"
  GER_reichskommissariat_norwegen:0 "Рейхскомиссариат Норвегия"
  GER_reichskommissariat_niederlande:0 "Рейхскомиссариат Нидерланды"
  GER_reichskommissariat_belgien_nordfrankreich:0 "Рейхскомиссариат Бельгия-Северная Франция"
  GER_reichskommissariat_ostland:0 "Рейхскомиссариат Остланд"
  GER_reichskommissariat_ukraine:0 "Рейхскомиссариат Украина"
  GER_reichskommissariat_moskowien:0 "Рейхскомиссариат Московия"
  GER_reichskommissariat_kaukasus:0 "Рейхскомиссариат Кавказ"
  reinstate_wilhelm_iv_succession_rights:0 "Восстановить правопреемство принца Вильгельма"
  reinstate_wilhelm_iv_succession_rights_desc:1 "Сын кайзера Вильгельма III был вынужден отказаться от права престолонаследия из-за желания жениться против воли тогдашнего главы рода Вильгельма II. Поскольку Вильгельм III теперь взял на себя эту роль, он может оказать давление на своего изгнанного отца, чтобы поддержать отмену этого решения."
  reinstate_wilhelm_iv_succession_rights_tt:0 "Линия наследования изменена.\n"
  modernize_the_succession_laws:0 "Модернизировать законы о престолонаследии"
  modernize_the_succession_laws_desc:0 "У нынешнего кайзера только две дочери. Мы должны обеспечить линию преемственности, и поэтому законы о преемственности должны быть модернизированы, чтобы принцесса Фелиситас могла царствовать, когда придет время."
  modernize_the_succession_laws_tt:0 "Женщины могут наследовать престол.\n"
  request_restoration_of_british_titles:0 "Просить восстановления британских титулов"
  request_restoration_of_british_titles_desc:0 "В 1917 году британский парламент проголосовал за аннулирование всех британских пэрств и королевских титулов из немецких королевских и княжеских семей. Теперь, когда мы союзники и наслаждаемся прекрасными отношениями, возможно, пришло время потребовать отмены этого решения."
  hindenburg_destroyed_tt:0 "Гинденбург не уничтожен!\n"
  request_restoration_of_british_titles_tt:0 "Это, несомненно, приведет к несравненным наградам..."
  GER_request_polish_war_participation:0 "Требовать польского участия в войне"
  GER_request_polish_war_participation_desc:0 "Так как мы находимся в состоянии войны с [SOV.GetName], нам необходимо провести наши армии через территорию [POL.GetAdjective]. Так как мы поклялись защищать их, вполне естественно, что они должны присоединиться к нашей войне."
  GER_reform_austro_hungarian_empire:1 "Восстановить Австро-Венгерскую империю"
  GER_reform_austro_hungarian_empire_tt:0 "Попросите другие страны-правопреемницы Австро-Венгрии восстановить Империю.\n§RЕсли они согласятся, вы унаследуете все войны, в которых они участвуют!§!\n"
  GER_reformed_austro_hungarian_empire:0 "Восстановлена Австро-Венгерская империя"
  GER_barbarossa_mission:0 "Директива Фюрера 21"
  emergency_factory_conversion_defensive:0 "Экстренное перепрофилирование фабрик"
  emergency_factory_conversion_defensive_desc:0 "Срочно требуется больше оборудования на фронте. Нам срочно необходимо перепрофилировать больше фабрик на производство оружия и транспортных средств для защиты нашей страны."
  emergency_factory_conversion_offensive:0 "Экстренная конвертация фабрик для нужд фронта"
  emergency_factory_conversion_offensive_desc:0 "Нашим войскам срочно необходимо больше снаряжения. Требуются дополнительные фабрики для производства снаряжения, необходимого для победы в войне."
  demolish_enemy_fortifications:0 "Снос вражеских укреплений"
  dismantle_maginot:0 "Демонтаж линии Мажино"
  propaganda_efforts:0 "Пропагандистские усилия"
  war_propaganda:0 "Военная пропаганда"
  war_propaganda_desc:0 "Пока мир вокруг нас горит, наш народ к войне совершенно не готов. Мы должны сплотить их, чтобы они взяли в руки оружие во имя нашей страны."
  desperate_defense:0 "Отчаянная оборона"
  desperate_defense_desc:0 "Мы не можем больше отступать. Наши солдаты должны окапываться и держать оборону."
  war_bonds:0 "Военные облигации"
  war_bonds_desc:0 "Нам нужны дополнительные ресурсы для нашей военной экономики, и военные облигации - это именно то, что нужно, чтобы их получить."
  CHI_lessons_of_war:0 "Уроки войны"
  CHI_bolster_our_ranks:0 "Пополнение наших рядов"
  CHI_industrial_evacuations_from_beijing:0 "Эвакуация предприятий из Пекина"
  GER_barbarossa_mission_desc:0 "Немецкие вооруженные силы должны быть готовы сокрушить Советскую Россию в стремительной кампании. Основная часть русской армии будет уничтожена в ходе дерзких операций под руководством танковых наконечников."
  USA_war_measures:0 "Военные меры"
  USA_homeland_defense:0 "Акт о чрезвычайном положении на территории государства"
  USA_homeland_defense_desc:1 "Враг ступил на священную землю нашей великой нации. Американский народ поднимется и вышвырнет захватчиков обратно в море!"
  USA_aid_britain:0 "Помощь Британии"
  USA_establish_personal_communication_with_former_naval_person:0 "Переписка с бывшим моряком"
  USA_establish_personal_communication_with_former_naval_person_desc:0 "В [ENG.GetName] к власти пришел новый лидер. Необходимо наладить с ним личный диалог, который поможет подготовить и согласовать наш неизбежный вступ в войну."
  USA_battle_domestic_isolationism:0 "Борьба с внутренним изоляционизмом"
  USA_battle_domestic_isolationism_desc:0 "Если бы сторонникам изоляционизма удалось продавить свою волю, мы бы оказались беззащитны перед лицом любой враждебной нам нации. Ради нашего же блага мы должны начать ломать довлеющую изоляционистскую риторику."
  USA_emergency_arms_deliveries:0 "Аварийные поставки вооружения"
  USA_emergency_arms_deliveries_desc:0 "Франция пала, и теперь Британия в одиночку противостоит агрессору, с трудом защищая свои берега от вторжения. Пламенные речи свидетельствуют, что их решимость незыблема и что они не намерены сдаваться без боя. Долг перед демократией обязывает нас обеспечить их средствами для защиты своей свободы."
  USA_arsenal_of_democracy_decision:0 "Арсенал демократии"
  USA_arsenal_of_democracy_decision_desc:0 "Хотя мы еще не втянуты в конфликт, мы можем помочь нашим друзьям, став их арсеналом. Давайте дадим людям понять, почему это необходимо."
  USA_women_in_the_workforce:1 "Рози-Клепальщица"
  USA_women_in_the_workforce_desc:0 "Вы умеете пользоваться электрическим миксером? Если да, то вы можете научиться работать со сверлильным станком. Во время войны более шести миллионов американских женщин устроились на работу на фабрики, на стройки и другие тяжелые физические работы и навсегда доказали, что женщины могут выполнять эту работу так же хорошо, как мужчины."
  CAN_women_in_the_workforce:0 "Ронни - пулеметчица"
  CAN_women_in_the_workforce_desc:0 "Ронни говорит: «Пусть продолжают поступать!» Когда наши мужчины служат в армии, бремя нашего военного производства ложится на плечи женщин нашей страны. За время войны 800 000 канадских женщин заняли рабочие места, оставленные теми, кто ушел на фронт, навсегда доказав, что женщины могут выполнять эту работу так же хорошо, как мужчины."
  CHI_integrate_the_warlords:0 "Интеграция военачальников"
  CHI_integrate_the_army:1 "Интеграция армии [From.GetAdjective]"
  CHI_integrate_the_administration:1 "Интеграция администрации [From.GetAdjective]"
