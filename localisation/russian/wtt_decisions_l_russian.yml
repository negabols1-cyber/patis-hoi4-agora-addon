  PRC_infiltrate_uprising_header:0 "§HВосстание§! приведёт к следующим последствиям:\n"
  PRC_infiltrate_uprising_effect_1:0 "§HИнфраструктура§! и §HВоенные заводы§! будут подвергнуты саботажу.\n"
  PRC_infiltrate_uprising_effect_2:0 "Коммунисты завоюют контроль над государством.\n"
  PRC_infiltrate_uprising_effect_3:0 "В государстве появятся коммунистические партизанские отряды.\n"
  PRC_infiltrate_uprising_effect_4:0 "В государстве появятся элитные коммунистические дивизии.\n"
  PRC_can_be_infiltrated:0 "Может быть подвергнуто дальнейшей §Hинфильтрации§!.\n"
  PRC_uprising_is_available:0 "По крайней мере одно националистическое государство было успешно §Yподвергнуто инфильтрации§!.\n"
