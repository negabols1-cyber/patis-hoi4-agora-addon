  SOV_hold_stalingrad:1 "Удержать [217.GetName]"
  SOV_hold_stalingrad_desc:0 "Ни шагу назад с [217.GetName]!"
  SOV_hold_leningrad:1 "Удержать [195.GetName]"
  SOV_hold_leningrad_desc:0 "Ни шагу назад с [195.GetName]!"
  SOV_hold_moscow:1 "Удержать [219.GetName]"
  SOV_hold_moscow_desc:0 "Ни шагу назад с [219.GetName]!"
  SOV_seize_manchuria:0 "Захватить Маньчжурию"
  SOV_seize_manchuria_desc:0 "В результате гражданской войны в Японии [MAN.GetName] вырвалась из-под японского владычества. У нас есть прекрасная возможность окончательно установить советскую власть в этом регионе, если мы будем действовать быстро."
  SOV_return_manchuria:0 "Вернуть Маньчжурию"
  SOV_return_manchuria_desc:0 "Мы вернем Маньчжурию единственному законному режиму в Китае."
  fascism_on_the_rise:0 "Подъем фашизма"
  fascism_on_the_rise_desc:0 "Высказывающиеся политические элементы начали выступать в пользу фашистских ценностей, находя поддержку у растущего числа населения. Путь нации к фашизму открыт, ожидая только выбора мирного или насильственного перехода."
  prepare_for_fascist_civil_war:0 "Подготовиться к гражданской войне"
  prepare_for_fascist_civil_war_desc:1 "У нас нет времени ждать медленных изменений в умах людей. Ради их же блага мы должны быстро принудить, даже если некоторые могут потерять свои жизни. В отличие от мирного референдума, гражданская война нанесет огромный ущерб нашим вооруженным силам, промышленности и инфраструктуре страны, но она также быстрее и гарантирует, что мы сможем более решительно навязать свою волю в дальнейшем."
  expand_civil_fascism_support:0 "Расширить гражданскую поддержку"
  expand_civil_fascism_support_desc:1 "Мы должны обеспечивать постоянное распространение поддержки нашего дела среди народа, а также поощрять их открыто оспаривать авторитет нынешнего правительства. По мере того как позиции правительства будут все больше подрываться, а гражданские беспорядки будут продолжаться, нам будет легче достичь наших целей. Это особенно актуально, если, в отличие от законной смены правительства, эти цели предполагают более... зловещие способы смены режима."
  army_support_for_fascist_civil_war:0 "Расширить военную поддержку"
  army_support_for_fascist_civil_war_desc:0 "Без широкой поддержки со стороны военных любая надежда на победу в вооруженной идеологической борьбе была бы тщетной. Мы должны обеспечить лояльность хорошо расположенных подразделений наших вооруженных сил."
  army_support_TT:0 "Каждый раз, когда увеличивается поддержка армии, к силе вашей фракции в гражданской войне добавляется 10%, до максимальной общей силы 70%.\n"
  ensure_general_loyalty_for_fascist_civil_war:1 "Обеспечить лояльность младшего армейского командования"
  ensure_general_loyalty_for_fascist_civil_war_desc:0 "Возможно, что некоторые генералы тайно настроены в пользу фашизма. Мы должны подойти к ним и обеспечить их лояльность на случай начала военных действий."
  ensure_marshal_loyalty_for_fascist_civil_war:0 "Обеспечить лояльность высшего армейского командования"
  ensure_marshal_loyalty_for_fascist_civil_war_desc:0 "Некоторые из наших фельдмаршалов могут скрыто симпатизировать фашистам. Мы должны переговорить с ними и гарантировать их лояльность, когда начнётся война."
  siphon_equipment_stockpiles_for_fascist_civil_war:0 "Конфисковать военные запасы"
  siphon_equipment_stockpiles_for_fascist_civil_war_desc:0 "Мы можем конфисковать часть государственных запасов и создать маленький арсенал оружия, который поможет нам в грядущей борьбе."
  formulate_surprise_attack_plan_for_fascist_civil_war:0 "Подготовить план внезапного нападения"
  formulate_surprise_attack_plan_for_fascist_civil_war_desc:0 "Враг не подозревает о надвигающейся беде. Мы должны сохранить это в тайне и разработать боевой план, который позволит извлечь максимальную выгоду из эффекта неожиданности."
  formulate_surprise_attack_plan_for_civil_war_tt:0 "План внезапного нападения даёт всем дивизиям, находящимся на основной территории, бонус в 25% к атаке в течение 30 дней.\n"
  ignite_the_fascist_civil_war:0 "Поджечь гражданскую войну"
  ignite_the_fascist_civil_war_desc:0 "Настало время решиться. Все приготовления, которые мы посчитали необходимыми, уже сделаны. Теперь пути назад нет."
  rebuild_the_nation_fascism:0 "Восстановить нацию"
  rebuild_the_nation_fascism_desc:0 "После гражданской войны пришло время восстановить нашу разрушенную нацию."
  open_up_political_discourse_fascism:0 "Смягчить политическую риторику"
  open_up_political_discourse_fascism_desc:1 "Мы должны открыть дорогу к принятию различных взглядов в правительстве. Возможно, в конечном итоге это даст нам возможность мирно изменить политическую ситуацию в нашей стране."
  discredit_government_fascism:0 "Опозорить правительство"
  discredit_government_fascism_desc:0 "Указав на множество недостатков нашего нынешнего правительства, мы можем заставить людей задуматься об идеологических причинах этих неудач."
  hold_the_fascist_national_referendum:0 "Провести национальный референдум"
  hold_the_fascist_national_referendum_desc:0 "Получив достаточную поддержку, мы теперь можем спокойно провести референдум, чтобы изменить правительство без кровопролития."
  democratic_on_the_rise:0 "Рост демократии"
  democratic_on_the_rise_desc:0 "Открытые политические деятели начали высказываться в пользу демократических ценностей, обретая поддержку у все большего числа людей. Путь страны к демократии открыт, осталось лишь выбрать путь мирного или насильственного перехода."
  prepare_for_democratic_civil_war:0 "Подготовиться к гражданской войне"
  prepare_for_democratic_civil_war_desc:1 "У нас нет времени ждать, пока умы людей медленно изменятся. Ради них самих мы должны действовать быстро и решительно, даже если в ходе процесса кому-то придётся пожертвовать собой. В отличие от мирного референдума гражданская война приведёт к огромным потерям в рядах наших вооружённых сил и сокрушительным последствиям для промышленности и инфраструктуры страны, однако она также пройдёт быстрее и позволит нам силой навязать нашу волю противникам."
  expand_civil_democratic_support:0 "Расширить гражданскую поддержку"
  expand_civil_democratic_support_desc:1 "Мы должны обеспечить продолжение распространения поддержки нашего дела среди людей и побудить их открыто бросить вызов авторитету нынешнего правительства. По мере того как позиции правительства будут всё больше подрываться, а гражданские беспорядки будут продолжаться, нам будет легче достичь наших целей. Это особенно актуально, если, в отличие от законной смены правительства, эти цели связаны с более... зловещими способами смены режима."
  army_support_for_democratic_civil_war:0 "Расширить военную поддержку"
  army_support_for_democratic_civil_war_desc:0 "Без достаточной поддержки со стороны военных любая надежда на победу в идеологической борьбе будет напрасной. Мы должны заручиться лояльностью надёжных подразделений наших вооружённых сил."
  ensure_general_loyalty_for_democratic_civil_war:1 "Обеспечить лояльность среди младшего командного состава"
  ensure_general_loyalty_for_democratic_civil_war_desc:0 "Возможно, некоторые генералы тайно симпатизируют демократии. Нам нужно подойти к ним и обеспечить их лояльность к началу боевых действий."
  ensure_marshal_loyalty_for_democratic_civil_war:0 "Обеспечить лояльность высшего армейского командования"
  ensure_marshal_loyalty_for_democratic_civil_war_desc:0 "Возможно, некоторые фельдмаршалы тайно симпатизируют фашизму. Нам нужно подойти к ним и обеспечить их лояльность к началу боевых действий."
  siphon_equipment_stockpiles_for_democratic_civil_war:0 "Перехватить запасы оборудования"
  siphon_equipment_stockpiles_for_democratic_civil_war_desc:0 "За счет изъятия из государственных оружейных складов мы можем создать небольшой запас оружия, который поможет нам в будущей борьбе."
  formulate_surprise_attack_plan_for_democratic_civil_war:0 "Разработать план внезапного нападения"
  formulate_surprise_attack_plan_for_democratic_civil_war_desc:0 "Враг не подозревает о надвигающемся бедствии. Мы должны позаботиться о том, чтобы это оставалось так, и в то же время направить наши боевые планы на максимальное использование элемента неожиданности."
  ignite_the_democratic_civil_war:0 "Развязать гражданскую войну"
  ignite_the_democratic_civil_war_desc:0 "Пришло время сделать решительный шаг. Все приготовления, которые мы сочли необходимыми, сделаны. Теперь пути назад нет."
  rebuild_the_nation_democratic:0 "Восстановить нацию"
  rebuild_the_nation_democratic_desc:0 "После гражданской войны пришло время восстановить нашу разрушенную нацию."
  open_up_political_discourse_democratic:0 "Открыть политический дискурс"
  open_up_political_discourse_democratic_desc:1 "Мы должны обеспечить принятие различных точек зрения в правительстве. Возможно, со временем это позволит повлиять на мирные изменения в политике нашей нации."
  discredit_government_democratic:0 "Дискредитировать правительство"
  discredit_government_democratic_desc:0 "Указав на многочисленные недостатки нашего нынешнего правительства, мы можем заставить людей задуматься об идеологических причинах этих неудач."
  hold_the_democratic_national_referendum:0 "Провести национальный референдум"
  hold_the_democratic_national_referendum_desc:0 "При достаточной поддержке мы теперь можем смело провести референдум, чтобы осуществить смену власти без кровопролития."
  communism_on_the_rise:0 "Коммунизм на подъеме"
  communism_on_the_rise_desc:0 "Голосовые политические элементы начали высказываться в пользу коммунистических ценностей, находя поддержку все большего числа населения. Путь нации к коммунизму открыт, ожидая лишь выбора мирного или насильственного перехода."
  prepare_for_communist_civil_war:0 "Готовиться к гражданской войне"
  prepare_for_communist_civil_war_desc:1 "У нас нет времени ждать, пока сознание людей медленно изменится. Ради их же блага мы должны поторопиться, даже если из-за этого кто-то погибнет. В отличие от мирного референдума, гражданская война принесет нашим вооруженным силам, экономике и инфраструктуре страны колоссальные разрушения, но она же пройдет и гораздо быстрее, а после ее завершения мы сможем силой заставить общество подчиниться нашей воле."
  expand_civil_communist_support:0 "Развернуть гражданскую поддержку"
  expand_civil_communist_support_desc:1 "Мы должны обеспечить распространение поддержки нашего дела среди населения и побудить людей публично оспаривать авторитет действующей власти. По мере того как позиции правительства будут все больше подрываться, а гражданские беспорядки будут нарастать, нам будет легче достичь наших целей. Это особенно актуально, если, в отличие от законной смены власти, эти цели предполагают более... зловещие средства смены режима."
  army_support_for_communist_civil_war:0 "Развернуть военную поддержку"
  army_support_for_communist_civil_war_desc:0 "Без широкой поддержки со стороны военных любые надежды на победу в идеологической борьбе будут тщетны. Мы должны обеспечить лояльность хорошо подготовленных подразделений наших вооруженных сил."
  ensure_general_loyalty_for_communist_civil_war:1 "Обеспечить лояльность низшего армейского командования"
  ensure_general_loyalty_for_communist_civil_war_desc:0 "Некоторые генералы могут тайно сочувствовать демократии. Мы должны найти их и обеспечить их лояльность, когда начнется война."
  ensure_marshal_loyalty_for_communist_civil_war:0 "Обеспечение лояльности высшего армейского командования"
  ensure_marshal_loyalty_for_communist_civil_war_desc:0 "Некоторые фельдмаршалы могут тайно сочувствовать фашизму. Мы должны найти их и обеспечить их лояльность, когда начнется война."
  siphon_equipment_stockpiles_for_communist_civil_war:0 "Изъятие военных запасов"
  siphon_equipment_stockpiles_for_communist_civil_war_desc:0 "Отобрав у государства оружейные запасы, мы сможем создать небольшой склад оружия, который поможет нам в будущей войне."
  formulate_surprise_attack_plan_for_communist_civil_war:0 "Разработка плана внезапной атаки"
  formulate_surprise_attack_plan_for_communist_civil_war_desc:0 "Враг ничего не подозревает о приближающемся бедствии. Мы должны это скрывать и при этом вести боевые планы так, чтобы максимально использовать элемент неожиданности."
  ignite_the_communist_civil_war:0 "Начало гражданской войны"
  ignite_the_communist_civil_war_desc:0 "Пришло время совершить решительный шаг. Все приготовления, которые мы считали необходимыми, сделаны. Пути назад больше нет."
  rebuild_the_nation_communism:0 "Перестройка страны"
  rebuild_the_nation_communism_desc:0 "После гражданской войны настало время восстанавливать нашу разрушенную страну."
  open_up_political_discourse_communist:0 "Либерализация политического дискурса"
  open_up_political_discourse_communist_desc:0 "Нам следует открыться для альтернативных точек зрения в правительстве. Возможно, это позволит в конечном итоге повлиять на мирные изменения в политике нашей нации."
  discredit_government_communism:0 "Дискредитация правительства"
  discredit_government_communism_desc:0 "Указав на многочисленные недостатки нашего нынешнего правительства, мы можем заставить людей задуматься об идеологических причинах этих неудач."
  hold_the_communist_national_referendum:0 "Провести национальный референдум"
  hold_the_communist_national_referendum_desc:0 "При достаточной поддержке мы теперь можем безопасно провести референдум, чтобы изменить правительство без кровопролития."
  military_support_for_fascist_civil_war:0 "Военная поддержка в гражданской войне.\n"
  military_support_for_democratic_civil_war:0 "Военная поддержка в гражданской войне.\n"
  military_support_for_communist_civil_war:0 "Военная поддержка в гражданской войне.\n"
  demand_tribute_from_new_communist_china:0 "Требовать повышенной дани"
  blow_suez_canal:0 "Подорвать Суэцкий канал"
  blow_suez_canal_desc:0 "Мы не можем позволить нашим врагам использовать стратегически важный Суэцкий канал. Поэтому мы должны начать подготовку к нанесению достаточного целевого ущерба каналу, чтобы он оставался вне эксплуатации в течение длительного времени. Это значительно ограничит способность противника перемещать корабли из Азии и Восточной Африки в Средиземное море."
  blow_panama_canal:0 "Взорвать Панамский канал"
  blow_panama_canal_desc:0 "Мы не можем позволить нашим врагам использовать стратегически важный Панамский канал. Поэтому мы должны начать подготовку к нанесению целенаправленного ущерба каналу, чтобы он оставался вне эксплуатации в течение длительного периода времени. Это значительно усложнит противнику переброску кораблей из Тихого океана в Атлантический и наоборот."
  rebuild_suez_canal:0 "Восстановить Суэцкий канал"
  rebuild_suez_canal_desc:0 "Суэцкий канал имеет первостепенное значение для наших военных усилий. Мы должны выделить любые необходимые ресурсы на восстановление этого великого канала, чтобы мы могли использовать его для свободного прохода кораблей и войск между Средиземным и Индийским океанами."
  rebuild_panama_canal:0 "Восстановить Панамский канал"
  rebuild_panama_canal_desc:0 "Панамский канал имеет первостепенное значение для наших военных усилий. Мы должны выделить любые необходимые ресурсы на восстановление этого великого канала, чтобы мы могли использовать его для свободного прохода кораблей и войск между Тихим и Атлантическим океанами."
  border_war_with_from:0 "Пограничная война с [From.GetNameDef]"
  MAN_banditry_category:0 "Бандитизм"
  MAN_banditry_category_desc:0 "Квантунская армия не очень заинтересована в помощи населению Маньчжурии, рассматривая ее как место для оккупации, а не как нацию, которую нужно строить. Правительству Маньчжоу-Го предоставлено слишком мало ресурсов для поддержания порядка, вследствие чего вакуум власти заполняют самые разнообразные бандиты: иногда самозваные \"борцы за свободу\", убивающие и грабящие во имя абстрактных идеалов, таких как \"национальное освобождение\" или \"пролетарский интернационализм\", но чаще всего без какой-либо заявленной идеологии, оправдывающей их злодеяния."
  MAN_bandit_raids:0 "Налеты бандитов"
  MAN_bandit_raids_desc:0 "Бродячие бандиты и террористы воруют все, что не прибито гвоздями, а все остальное сжигают! Мобилизуйте больше войск и остановите их!"
  PRC_border_clashes:0 "Пограничные стычки"
  PRC_border_clashes_desc:0 "Ландшафт Китая заставляет каждого тщательно выбирать, где вести бои. Это дает нам возможность захватить какую-то уязвимую территорию без развязывания полномасштабной войны."
  MAN_pacify_bandits_mission_explanation:0 "На протяжении [?Root.MAN_maintain_control_timer|H0] дней держите в провинции дивизии, чтобы подавить бандитизм в регионе.\n"
  MAN_pacify_bandits_in_the_northern_countryside:0 "Умиротворение бандитов в северной сельской местности"
  MAN_hunt_down_northern_bandits:0 "Охота на северных бандитов"
  MAN_hunt_down_northern_bandits_tt:0 "Искоренить северных бандитов.\n"
  MAN_maintain_northern_control:0 "Удержание контроля над севером"
  MAN_pacify_bandits_in_the_eastern_countryside:0 "Успокоить бандитов в восточной части сельской местности"
  MAN_hunt_down_eastern_bandits:0 "Выследить восточных бандитов"
  MAN_hunt_down_eastern_bandits_tt:0 "Уничтожает восточных бандитов\n"
  MAN_maintain_eastern_control:0 "Поддерживать контроль над Востоком"
  MAN_pacify_bandits_in_the_western_countryside:0 "Успокоить бандитов в западной части сельской местности"
  MAN_hunt_down_western_bandits:0 "Выследить западных бандитов"
  MAN_hunt_down_western_bandits_tt:0 "Уничтожает западных бандитов\n"
  MAN_maintain_western_control:0 "Поддерживать контроль над Западом"
  MAN_northern_bandits:0 "Бандиты бродят по Северу"
  MAN_eastern_bandits:0 "Бандиты бродят по Востоку"
  MAN_western_bandits:0 "Бандиты бродят по Западу"
  civil_war_surprise_attack_plan:0 "План внезапного нападения"
  civil_war_rebuild_nation:0 "Восстановить нацию"
  MAN_develop_kirin_aluminium_deposits:0 "Разработать месторождения бокситов в Кирине"
  MAN_develop_liaotung_iron_ore_deposits:0 "Разработать месторождения железной руды в Ляодуне"
  targeted_race_for_the_bomb:0 "Гонка за бомбу"
  targeted_race_for_the_bomb_desc:0 "Мы не можем позволить другим создать атомную бомбу раньше нас. Мы должны сделать все возможное, чтобы обеспечить то, чтобы наше технологическое превосходство не было поставлено под угрозу"
  first_nuke_dropped:0 "Сброшена первая атомная бомба"
  CHI_border_clashes:0 "Приграничные столкновения"
  CHI_border_clashes_desc:0 "Рельеф Китая вынуждает всех тщательно выбирать свои сражения. Это дает нам возможность захватить уязвимые участки местности, не вступая в полномасштабную войну"
  CHI_border_clash_with_from:0 "Пограничная война с [From.GetNameDef]"
  CHI_border_war_with_opposition:0 "Пограничная война с [From.GetNameDef]"
  CHI_warlord_in_opposition:0 "Фентьюань - оппозиция"
  improved_worker_conditions:0 "Улучшенные условия для рабочих"
  improved_worker_conditions_desc:0 "Работа на фабрике тяжела и полна опасностей. Улучшение условий для наших заводских рабочих уменьшит производительность в краткосрочной перспективе, но долгосрочные выгоды того стоят."
  promises_of_peace:0 "Обещания мира"
  promises_of_peace_desc:1 "История научила нас ужасам войны. Мы не должны допустить, чтобы это повторилось. Нашей стране пора познать мир и процветание."
  refuse_the_tribute:0 "Отказаться платить дань"
  refuse_the_tribute_desc:0 "Советские требования истощают нашу страну. Мы не можем позволить нашим так называемым "товарищам" эксплуатировать нас подобным образом."
  CHI_approach_japan:0 "Сближение с Японией"
  CHI_industrial_evacuations_from_FROM:0 "Индустриальная эвакуация с [FROM.getName]"
  CHI_industrial_evacuations_from_gansu:0 "Индустриальная эвакуация из Ганьсу"
  CHI_industrial_evacuations_from_hainan:0 "Индустриальная эвакуация с Хайнаня"
  CHI_industrial_evacuations_from_guangzhou:0 "Индустриальная эвакуация из Гуанчжоу"
  CHI_industrial_evacuations_from_guangdong:0 "Индустриальная эвакуация из Гуандуна"
  CHI_industrial_evacuations_from_nanning:0 "Индустриальная эвакуация из Наньнина"
  CHI_industrial_evacuations_from_fujian:0 "Индустриальная эвакуация из Фуцзяня"
  CHI_industrial_evacuations_from_zhejiang:0 "Промышленная эвакуация из Чжецзяна"
  CHI_industrial_evacuations_from_shandong:0 "Промышленная эвакуация из Шаньдуна"
  CHI_industrial_evacuations_from_jiangsu:0 "Промышленная эвакуация из Цзянсу"
  CHI_industrial_evacuations_from_guangxi:0 "Промышленная эвакуация из Гуанси"
  CHI_industrial_evacuations_from_jiangxi:0 "Промышленная эвакуация из Цзянси"
  CHI_industrial_evacuations_from_hunan:0 "Промышленная эвакуация из Хунани"
  CHI_industrial_evacuations_from_anhui:0 "Промышленная эвакуация из Аньхоя"
  CHI_industrial_evacuations_from_henan:0 "Промышленная эвакуация из Хэнани"
  CHI_industrial_evacuations_from_shanghai:0 "Промышленная эвакуация из Шанхая"
  CHI_industrial_evacuations_from_hebei:0 "Промышленная эвакуация из Хэбэя"
  CHI_industrial_evacuations_from_ningxia:0 "Промышленная эвакуация из Нинся"
  CHI_industrial_evacuations_from_hubei:0 "Промышленная эвакуация из Хубэя"
  CHI_industrial_evacuations_from_qingdao:0 "Промышленная эвакуация из Циндао"
  prestigious_projects:0 "Национальный престиж"
  barbarossa_mission_tt:0 "Использует национальный дух §YUnternehmen Barbarossa§! до завершения миссии.\n"
  war_propaganda_campaign_running:0 " Уже проводится военная пропагандистская кампания"
  JAP_test_the_soviets:1 "Испытание [SOV.GetAdjective]"
  JAP_test_the_soviets_desc:1 "У нас общая граница с [SOV.GetNameDef] в Корее и Маньчжурии. Имеются многочисленные потенциальные точки столкновения, где наши силы могут вступить в бой в любой момент. Это создаёт для нас возможность проверить реакцию [SOV.GetAdjective] на незначительную провокацию."
  JAP_border_conflict_warning_SOV:0 "Пограничная провокация на границе с Японией"
  JAP_border_conflict_warning_SOV_desc:0 "У нас произошёл вооружённый инцидент с японскими солдатами на нашей общей границе в Корее. Источники в разведке докладывают, что это может быть первым шагом в более крупном противостоянии. Мы должны немедленно усилить границу с Японией."
  JAP_border_conflict_escalation_warning_SOV:0 "Японская подготовка"
  JAP_border_conflict_escalation_warning_SOV_desc:0 "Аэросъёмка подтвердила масштабные перемещения войск с японской стороны границы. Мы не знаем, когда и собираются ли вообще японцы начать наступление, но должны быть готовы."
  JAP_border_incident_forgotten:0 "Благоприятный момент"
  JAP_border_incident_forgotten_desc:1 "Если мы хотим воспользоваться инцидентом на границе с Союзом для захвата Кореи, мы должны действовать быстро."
  JAP_escalate_incident_to_border_conflict_SOV:0 "Обострение инцидента до пограничного конфликта"
  JAP_escalate_incident_to_border_conflict_SOV_desc:0 "Похоже, что Советы не намерены прекращать конфликт. На данный момент мы должны или усилить его до вооружённого противостояния, или же сами отступить."
  JAP_border_conflict_time_until_cancelled:0 "Завершение конфликта"
  JAP_border_conflict_time_until_cancelled_desc:0 "При таких темпах мы сможем поддерживать военные операции недолго, после чего нам потребуется прекращение огня."
  JAP_border_conflict_escalate_conflict:0 "Усилить конфликт"
  JAP_border_conflict_escalate_conflict_desc:1 "Конфликт на границе с [FROM.GetNameDef] зашел в тупик. Возможно, если разжечь его еще больше и бросить в зону театра военных действий больше войск, мы все еще сможем добиться победы."
  JAP_border_conflict_escalate_to_war:0 "Объявить войну"
  JAP_border_conflict_escalate_to_war_desc:0 "Бои в спорном регионе продолжаются уже довольно долго и нет никаких признаков их прекращения. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как первый этап в полномасштабной войне."
  JAP_border_conflict_back_out_of_conflict:0 "Отступить"
  JAP_border_conflict_back_out_of_conflict_desc:0 "Опасность того, что этот конфликт выйдет из-под контроля и перерастет в полномасштабную войну между нашими странами, слишком велика. Мы должны немедленно сократить наши потери и отправить дипломатические зонды другой стороне."
  ROOT_inherit_current_scope_wars_effect:0 "[Root.GetNameDef] вступает во все войны.\n"
  in_60_days:0 "Через 60 дней:"
  sov_jap_border_conflict_won:0 "Опыт пограничного столкновения в Корее:"
  JAP_guardian_of_INS:0 "Принять на себя опеку над Индонезией"
  JAP_guardian_of_MAL:0 "Принять на себя опеку над Малайей"
  JAP_guardian_of_indochina:0 "Принять на себя опеку над Индокитаем"
  CHI_industrial_evacuations_remove_AF:0 "Демонтировать все §Yоружейные заводы§!.\n"
  CHI_industrial_evacuations_remove_IC:0 "Удалить все §Yгражданские заводы§!.\n"
  CHI_industrial_evacuations_add_AF:0 "Добавить 75% удалённых §Yзаводов оружия§!.\n"
  CHI_industrial_evacuations_add_IC:0 "Добавить 75% удалённых §Yгражданских заводов§!.\n"
  recall_von_lettow_vorbeck:0 "Вернуть Пауля фон Леттов-Форбека"
  recall_von_lettow_vorbeck_desc:0 "После возвращения Гогенцоллернов на трон старый Лев Восточной Африки вновь предлагает свои услуги."
  GER_sharpen_air_safety_regulations:0 "Ужесточить правила безопасности полетов"
  GER_sharpen_air_safety_regulations_desc:0 "С помощью более строгих правил безопасности мы сможем предотвратить некоторые из наиболее распространенных причин катастрофических аварий, в том числе с дирижаблями."
  MAN_recruit_bandits_north:0 "Вербовать северных бандитов"
  MAN_recruit_bandits_north_desc:0 "Каждая пуля, потраченная на охоту за бандитами, — это на одну пулю меньше для предстоящего боя. Вместо того чтобы воевать с нашими собственными подданными, мы должны предложить им способ искупить свою вину, служа императору."
  MAN_recruit_bandits_west:0 "Вербовать западных бандитов"
  MAN_recruit_bandits_west_desc:0 "Каждая пуля, потраченная на охоту за бандитами, — это на одну пулю меньше для предстоящего боя. Вместо того чтобы воевать с нашими собственными подданными, мы должны предложить им способ искупить свою вину, служа императору."
  MAN_recruit_bandits_east:0 "Вербовать восточных бандитов"
  MAN_recruit_bandits_east_desc:0 "Каждый потраченный на преследование бандитов патрон – это минус один патрон на предстоящую войну. Вместо того чтобы воевать с собственными подданными, мы должны предоставить им способ искупить вину, служа Императору."
  MAN_recruit_bandits_generic:0 "Призвать остатки бандитов"
  MAN_recruit_bandits_generic_desc:0 "Наши тюрьмы и трудовые лагеря переполнены теми, кто когда-то воевал против нас. В борьбе за свободу нам нужны все солдаты и все винтовки. Император мог бы проявить свою легендарную милость и дать этим преступникам возможность искупить вину, служа ему."
  MAN_release_bandits:0 "Освободить бандитов"
  MAN_release_bandits_desc:0 "Бывшие преступники и проходимцы доказали, что готовы пожертвовать собой ради своего Императора, и теперь их можно спокойно выпустить обратно в общество."
  MAN_war_preparations:0 "Война за независимость"
  MAN_raise_manchu_banner:0 "Развернуть знамена"
  MAN_raise_manchu_banner_desc:0 "В старые времена императоры династии Цин могли призвать своих знаменщиков на войну. Хотя времена изменились, принципы остались прежними. Дому Цин снова нужны знамена."
  MAN_disband_the_banners:0 "Расформировать знамена"
  MAN_disband_the_banners_desc:0 "Отслужив, знаменщики снова могут вернуться к своим семьям и домам – до тех пор, пока они снова не понадобятся."
  MAN_fund_underground_gun_shops:0 "Создать подпольные мастерские"
  MAN_fund_underground_gun_shops_desc:0 "Мелкие мастерские не так эффективны как крупные заводы и у них разные стандарты контроля качества. Однако распределение производства оружия по небольшим мастерским по всей стране – это лучший способ быстро увеличить производство."
  MAN_remove_underground_gun_shops:0 "Закрыть подпольные мастерские"
  MAN_remove_underground_gun_shops_desc:0 "Оружейные мастерские, которые мы создали, выполнили свою задачу. Пришло время вернуться к более организованному способу производства оружия."
  MAN_divert_machine_tools:0 "Отвлечь станочное оборудование"
  MAN_divert_machine_tools_desc:0 "С железными дорогами под нашим контролем мы можем организовать так, чтобы некоторые поставки станков "потерялись" в результате "административной ошибки"."
  MAN_prepare_to_seize_arms:0 "Подготовиться к захвату японских складов оружия"
  MAN_prepare_to_seize_arms_desc:0 "Склады и пункты снабжения по всей стране плохо охраняются. Хорошо спланированное и своевременное нападение может захватить их с минимальными потерями, предоставив нам доступ к современному оружию и одновременно лишив японцев боеприпасов и поставок. Если уделить этому больше времени и ресурсов, то можно будет захватить больше складов."
  MAN_seize_arms:0 "Выполнить план"
  MAN_seize_arms_desc:0 "Действуйте быстро! ЗА ИМПЕРАТОРА!"
  MAN_can_prepare_more_tt:0 "Ещё можно провести дополнительные приготовления для захвата ещё складов.\n"
