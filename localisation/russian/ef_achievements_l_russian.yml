l_russian: 
 # EF название сценария
 HIST_MODE_NAME:0 "Исторический режим"
 HIST_MODE_NAME_DESC:0 "§RВНИМАНИЕ!§! \nПри выборе этого сценария страны могут идти только по историческим путям, а страны, не участвовавшие во Второй мировой войне, будут удалены. \nИсторический режим предлагает полностью исторический геймплей и новые последовательности событий, с учетом только исторических событий."
 # названия достижений
 europe_in_flames_achievements_1:0 "Достижения Europe In Flames"
 
 back_from_dead_NAME:0 "Возвращение из мертвых"
 back_from_dead_DESC:0 "Как в былые времена, сделайте Николая II главой страны и контролируйте бывшие имперские российские государства."
 
 Third_Siege_Of_Vienna_NAME:0 "Третья осада Вены"
 Third_Siege_Of_Vienna_DESC:0 "В качестве Османской империи осадите Вену в 3-й раз и на этот раз преуспейте."
 
 achieve_the_impossible_NAME:0 "Достичь невозможного"
 achieve_the_impossible_DESC:0 "Под руководством Исмет-паши не потеряйте ни одного основного государства до 1 января 1945 года"
 
 Unfinished_business_NAME:0 "Незаконченное дело"
 Unfinished_business_DESC:0 "В качестве Венгрии; Снова постройте Великую империю гуннов и заставьте Папу Римского преклонить колени во 2-й раз. На этот раз не отравитесь!"
 
 desert_fox_NAME:0 "Лис пустыни"
 desert_fox_DESC:0 "В качестве нацистской Германии ведите войну с британцами и французами, будьте в союзе с Италией и имейте 3 танка как минимум на одной территории фронта Эль-Аламейна, а уровень навыков Эрвина Роммеля должен быть не менее 5."
 
 peace_in_our_time_NAME:0 "Мир в наше время"
 peace_in_our_time_DESC:0 "В качестве Соединенного Королевства примите участие в Мюнхенской конференции, оставьте Судетскую область Германии и не вступайте ни в какие войны до 1 января 1939 года."
 
 father_of_turks_NAME:0 "Отец турок"
 father_of_turks_DESC:0 "В качестве Турции спасите Мустафу Кемаля Ататюрка от его болезни и сохраните лидерство Ататюрка."
 
 parallel_universe_NAME:0 "Параллельная вселенная"
 parallel_universe_DESC:0 "В качестве гитлеровской Германии заключите мирный договор с Соединенным Королевством, который разоружит Лондон и сделает его демилитаризованной зоной."
 
 grand_admiral_new_emperor_NAME:0 "Гранд-адмирал, новый император"
 grand_admiral_new_emperor_DESC:0 "В качестве Японской империи; под руководством Исороку Ямамото постройте сверхтяжелый корабль «Ямато» и сделайте уровень навыков Исороку Ямамото не менее 6."
 
 the_real_asia_empire_NAME:0 "Настоящая азиатская империя"
 the_real_asia_empire_DESC:0 "В качестве Сиама Плэка захватите столицу Китая Нанкин раньше японцев."

 ufra_truly_we_mean_it_NAME:0 "Правда, мы это имеем в виду"
 ufra_truly_we_mean_it_DESC:0 "На мирной конференции после войны с Германией снова сделайте §YМозелланд§! и §YРейнланд§! демилитаризованной зоной."
 UFRA_fra_ger_war_rhine_achivement_tt:0 "§YФранция§! и §YГермания§! уже воевали"
 
 Deutsche_Disziplin_NAME:0 "Deutsche Disziplin !"
 Deutsche_Disziplin_DESC:0 "В качестве Германии выполните все решения Reichswerke Hermann Goring. (Всего 9.)"
 reichswerke_hermann_goring_var_achievement_tt:0 "§YВыполнены решения Reichswerke Hermann Goring. (Всего 9.)§!"
 
 inevitable_end_NAME:0 "Неизбежный конец"
 inevitable_end_DESC:0 "В качестве Соединенных Штатов Америки завершите Манхэттенский проект и произведите более 2 ядерных бомб до 1945 года."
 
 we_shall_never_surrender_NAME:0 "Мы никогда не сдадимся!"
 we_shall_never_surrender_DESC:0 "В качестве Соединенного Королевства освободите Париж самостоятельно или с помощью Соединенных Штатов Америки, сражаясь с Германией."
 
 legion_v_macedonia_NAME:0 "Legio V Macedonia"
 legion_v_macedonia_DESC:0 "С Италией сформируйте Западный Рим и полностью контролируйте Каир."

 hot_tub_pleasure_NAME:0 "Удовольствие от гидромассажной ванны"
 hot_tub_pleasure_DESC:0 "Контролируйте все Средиземное море как Советский Союз."

 the_new_order_NAME:0 "Новый порядок"
 the_new_order_DESC:0 "В качестве Германии вы должны контролировать материковую Францию, Бенилюкс, Польшу и территорию Советского Союза до Уральских гор."

 steiners_counter_attack_NAME:0 "Контрудар Штайнера"
 steiners_counter_attack_DESC:0 "Когда Германия вот-вот проиграет войну, переломите ход событий и выиграйте войну."

 the_man_in_the_high_castle_NAME:0 "Человек в высоком замке"
 the_man_in_the_high_castle_DESC:0 "В качестве Германии начните холодную войну с Японией и сделайте Соединенные Штаты своей марионеткой."

 a_new_sun_rises_NAME:0 "Восходит новое солнце"
 a_new_sun_rises_DESC:0 "В качестве Китая, с Чан Кайши в качестве лидера страны, победите и подчините японцев."

 revenge_of_gallipoli_NAME:0 "Месть за Галлиполи"
 revenge_of_gallipoli_DESC:0 "Захватите Дарданеллы в качестве Австралии или Новой Зеландии под властью Соединенного Королевства."

 EUYL_problems_in_the_family_NAME:0 "Проблемы с папой"
 EUYL_problems_in_the_family_DESC:0 "В качестве коммунистической Аргентины, с Либорио Хусто в качестве лидера, участвуйте в гражданской войне против своего собственного отца."

 EUYL_right_back_at_ya_NAME:0 "Тем же и тебе"
 EUYL_right_back_at_ya_DESC:0 "В качестве Аргентины, с Хуаном Доминго Пероном в качестве лидера, следуйте принципам Муссолини и имейте Италию в качестве марионетки."

 EUYL_god_bless_the_pope_NAME:0 "Да благословит Бог Папу"
 EUYL_god_bless_the_pope_DESC:0 "В качестве Аргентины объявите себя Папским государством и полностью контролируйте Рим и Иерусалим."

 EUYL_just_a_bit_indecisive_NAME:0 "Просто немного нерешительный"
 EUYL_just_a_bit_indecisive_DESC:0 "В качестве Парагвая смените идеологию не менее 4 раз."

 EUYL_the_real_united_states_NAME:0 "Настоящие Соединенные Штаты"
 EUYL_the_real_united_states_DESC:0 "В качестве Колумбии сформируйте Соединенные Штаты Колумбии и сделайте Соединенные Штаты своей марионеткой."

 EUYL_super_chile_NAME:0 "Супер Чили!"
 EUYL_super_chile_DESC:0 "В качестве Чили захватите и контролируйте каждое прибрежное государство в Тихом океане от Огненной Земли до Аляски. (Это также включает два канадских острова недалеко от побережья.)"

 CHL_controls_every_state_coastal_to_pacific_tt:0 "Владеет и контролирует §Yкаждое государство§!, прибрежное к §YТихому океану§!"
 PAR_switched_governments_4_times_tt:0 "§YСменил§! идеологию не менее §G4§! раз"
 disarmed_and_demilitarized_london_flag:0 "§YЛондон§! должен стать §Rдемилитаризованной§! зоной"
 JAP_declare_war_on_chi_flag:0 "Произошел инцидент на мосту Марко Поло, и Япония объявила войну."
 SOV_controls_all_mediterranean_tt:0 "§RСоветский Союз§! должен контролировать все §YСредиземное море§!, включая острова."
 GER_new_order_states_tt:0 "В качестве §YГермании§! вы должны контролировать материковую §YФранцию§!, §YБенилюкс§!, §YПольшу§! и территорию §YСоветского Союза§! до §YUральских гор§!."