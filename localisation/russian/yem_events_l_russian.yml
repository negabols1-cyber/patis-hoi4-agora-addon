l_russian:
  yemen.1.t:0 "Йемен просит Аден"
  yemen.1.d:0 "Сегодня йеменский дипломат Ахмут аль Яхья принес нам предложение. Они предлагают купить Аден. Что нам делать?"
  yemen.1.a:0 "Принять предложение"
  yemen.1.b:0 "Как они смеют!"
  yemen.2.t:0 "Британцы приняли наше предложение"
  yemen.2.d:0 "После дружественных переговоров Британия решила продать Аден."
  yemen.2.a:0 "Йемен снова един!"
  yemen.3.t:0 "Британия отклоняет наше предложение"
  yemen.3.d:0 "Британцы отклонили наше предложение"
  yemen.3.a:0 "К сожалению, мы ничего не можем сделать"
  yemen.4.t:0 "Йемен хочет заключить с нами секретную сделку"
  yemen.4.d:0 "Сегодня йеменский дипломат Ахмут аль Яхья принес нам предложение от своего премьер-министра. Они хотят оказаться под нашей защитой после заключения тайного соглашения и захвата земель Ближнего Востока. Что нам делать?"
  yemen.4.a:0 "Принять предложение"
  yemen.4.b:0 "Слишком много усилий, отклонить предложение"
  yemen.5.t:0 "Британцы приняли нашу сделку"
  yemen.5.d:0 "После дружественных переговоров Британия решила принять тайную сделку. Они поддержат нас."
  yemen.5.a:0 "Отлично!"
  yemen.6.t:0 "Британия отклоняет нашу сделку"
  yemen.6.d:0 "Британцы отклонили наше предложение и сказали, что не поддержат нас."
  yemen.6.a:0 "К сожалению, мы ничего не можем сделать"
  yemen.7.t:0 "Йемен просит Ближний Восток"
  yemen.7.d:0 "Сегодня йеменский дипломат Ахмут аль-Яхья принес нам предложение от своего премьер-министра. Йемен хочет, чтобы мы передали ему земли Ближнего Востока в соответствии с соглашением, которое мы заключили. Что нам делать?"
  yemen.7.a:0 "Отдать земли"
  yemen.7.b:0 "Разорвать сделку, этого не будет"
  yemen.8.t:0 "Британцы выполнили наше соглашение"
  yemen.8.d:0 "Британцы начали передавать нам все свои земли на Ближнем Востоке."
  yemen.8.a:0 "Ближний Восток скоро станет единым!"
  yemen.9.t:0 "Британия отказывается и разрывает договор"
  yemen.9.d:0 "Британцы разорвали соглашение и заявили, что не могут продолжать это дело. Нас обманули и унизили британцы."
  yemen.9.a:0 "К сожалению, мы ничего не можем сделать"

  yemen.10.t:0 "Йемен требует нашего подчинения"
  yemen.10.d:0 "Сегодня йеменский дипломат Ахмут аль-Яхья принес нам предложение. Они предлагают объединиться с Йеменом. Что нам делать?"
  yemen.10.a:0 "Принять предложение"
  yemen.10.b:0 "Конечно, нет!"
  yemen.11.t:0 "Оман поддался нашим требованиям"
  yemen.11.d:0 "После дружеских переговоров Оман решил принять наши требования."
  yemen.11.a:0 "Здорово!"
  yemen.12.t:0 "Оман отвергает наши требования"
  yemen.12.d:0 "Оман отверг наши требования, они не оставляют нам выбора, кроме как забрать землю силой."
  yemen.12.a:0 "Мы заберем то, что принадлежит нам!"

  yemen.13.t:0 "Йемен требует нашего подчинения"
  yemen.13.d:0 "Сегодня йеменский дипломат Ахмут аль-Яхья принес нам предложение. Они предлагают объединиться с Йеменом. Что нам делать?"
  yemen.13.a:0 "Принять предложение"
  yemen.13.b:0 "Ни в коем случае!"
  yemen.14.t:0 "Саудовская Аравия приняла наши требования"
  yemen.14.d:0 "После дружественных переговоров Саудовская Аравия решила принять наши требования."
  yemen.14.a:0 "Отлично!"
  yemen.15.t:0 "Саудовская Аравия отвергает наши требования"
  yemen.15.d:0 "Саудовская Аравия отклонила наши требования. Они не оставляют нам выбора, кроме как силой захватить их земли."
  yemen.15.a:0 "Мы заберем то, что принадлежит нам!"
  yemen.17.t:0 "Приглашение в Саадабатский пакт"
  yemen.17.d:0 "В попытке укрепить Саадабатский пакт и сдержать возможное возрождение агрессивного экспансионизма Йемен просит нас присоединиться к ним в альянсе, направленном на сплочение этих наций."
  yemen.17.a:0 "С радостью. Саадабатский пакт необходимо расширить."
  yemen.17.b:0 "[Root.GetName] идет своим путем."
  yemen.18.t:0 "[From.GetName] присоединяется к турецкой фракции"
  yemen.18.d:0 "Наш план по недопущению развала Саадабатского пакта и отчуждению его от нас продвигается. [From.GetLeader] одобряет наши усилия и принял наше приглашение в альянс."
  yemen.18.a:0 "Мы на шаг ближе к воссозданию Великого Саадабатского пакта."
  yemen.19.t:0 "[From.GetName] отказывается присоединяться к Саадабатскому пакту"
  yemen.19.d:0 "Несмотря на все наши усилия по предложению поддержки Пакту Саадабат, наша последняя попытка связаться с одной из наций была встречена скептически. [From.GetLeader] отказался присоединиться к альянсу, возможно, усомнившись в наших мотивах, или, возможно, обеспокоенный тем, что чрезмерное сближение с нами сделает их целью."
  yemen.19.a:0 "Они уже могли быть целью, насколько им известно!"
  yemen.20.t:0 "Аденская авантюра"
  yemen.20.desc:0 "Согласно полученной нами информации, количество британских гарнизонов на этой земле довольно мало. Мы начинаем эту операцию, полагая, что наша армия победит."
  yemen.20.a:0 "Удача благоволит смелым."
  YEM_border_war_possible_tt:0 "Если ситуация обострится, мы можем быть вынуждены столкнуться с §Rпограничными конфликтами§! вдоль наших границ с §Y[ENG.GetNameDef]§!."
  yemen.21.t:0 "Йемен отправляет свой ультиматум"
  yemen.21.desc:1 "Йемен требует от нас нашу колонию Аден. Если мы закроем глаза на этих трусов, наш имидж на международной арене будет запятнан."
  yemen.21.a:0 "Мы должны подчиниться."
  yemen.21.b:0 "[FROM.GetAdjective] встали на темный путь: мы должны исправить это."
  yemen.22.t:0 "[FROM.GetNameDef] подчиняется!"
  yemen.22.desc:0 "Британцы, которые знали то, что знаем мы, не могли позволить себе смерть солдат гарнизона и сделали правильно, передав нам нашу землю."
  yemen.22.a:0 "Удивление, конечно, но приятное!"
  yemen.23.t:0 "Великобритания отклоняет наш ультиматум, и начинается битва за Аден!"
  yemen.23.desc:0 "Как и ожидалось, [FROM.GetNameDef] отверг предъявленный им ультиматум. Разместив наших солдат на местах, мы сейчас спровоцируем постепенно расширяющийся конфликт с целью разжечь тотальную войну между нашими государствами. Выиграем или проиграем, пока мы стоим бок о бок, мы не можем потерпеть поражение."
  yemen.23.a:0 "Сейчас начнётся самое интересное!"
  yemen.24.t:0 "Битва за Аден!"
  yemen.24.desc:0 "Вопреки ожиданиям нашего верховного командования мы одержали победу над [FROM.GetAdjective] войсками на наших границах. Вдохновлённые нашим ошеломительным успехом, наши вооружённые силы уже начали наступление вглубь [FROM.GetAdjective] территории. Наше верховное командование, располагающее новейшими данными, полагает, что [FROM.GetNameDef] падёт в течение нескольких дней."
  yemen.24.a:0 "Нам лишь оставалось выбить дверь, чтобы обнаружить гниль!"
  yemen.25.t:0 "Войска [FROM.GetAdjective] разбиты!"
  yemen.25.desc:0 "Для Йемена было абсурдом даже пытаться совершить подобную глупость перед лицом империи, над которой никогда не заходит солнце. Мы укажем им на их место и выкорчуем их с корнем."
  yemen.25.a:0 "Выстройте трусов в линию, и мы их скосим."
  yemen.26.t:0 "Великобритания торжествует над нашими войсками!"
  yemen.26.desc:0 "К сожалению, как представляется, наши войска не сумели прорвать оборону [FROM.GetAdjective] в [659.GetName]. Верховное командование, конечно, разочаровано результатами, но не удивлено."
  yemen.26.a:0 "Мы очень их разозлили, и нам оставалось только ждать и обороняться.
  yemen.27.t:0 "Битва за Аден!"
  yemen.27.desc:0 "Наши войска, не подготовленные к столь дерзкому нападению вооруженных сил [FROM.GetAdjective], были отброшены у [659.GetName], что стало ужасной потерей для нашей нации. Хотя наша потеря была разочаровывающей, она не была разрушительной."
  yemen.27.a:0 "К сожалению, у нас нет армии поблизости, которая могла бы быстро сюда прибыть. Мы пока проигнорируем это место, но когда придет время, мы сожжем его дотла!"
  yem.30.t:0 "Попытка убийства Яхьи"
  yem.30.d:0 "Сегодня около полудня было совершено покушение на Яхью. Сейчас мы не знаем его точного местонахождения, но надеемся, что с ним все в порядке."
  yem.30.a:0 "К сожалению, мы потеряли имама Яхью."
  yem.30.b:0 "Состояние здоровья Яхьи очень хорошее."
  yem.34.t:0 "Йемен приглашает Гитлера на военный парад"
  yem.34.d:0 "Йемен вскоре проведет военный парад в честь Гитлера и пригласил нас на него."
  yem.34.a:0 "Мы обязательно будем присутствовать."
  yem.35.t:0 "Военный парад закончен"
  yem.35.d:0 "Военный парад в Йемене был именно таким, каким мы его ожидали, даже лучше, чем мы ожидали."
  yem.35.a:0 "Мы должны щедро вознаградить эти действия."
  yem.35.b:0 "У нас не так много ресурсов, чтобы направить их сюда."
  yem.36.t:0 "Гитлер решил поддержать нас"
  yem.36.d:0 "С поддержкой, которую мы получили от Гитлера, мы сможем двигаться дальше, чтобы стать сверхдержавой в регионе."
  yem.36.a:0 "Это очень приятно."
  yem.37.t:0 "Гитлер оказал нам небольшую поддержку"
  yem.37.d:0 "Как мы и ожидали, Гитлеру очень понравился парад, но он сказал, что не сможет оказать нам серьезную поддержку, так как не располагает достаточными ресурсами."
  yem.37.a:0 "Ну хоть попытались"
  yem.38.t:0 "Йемен запрашивает наши колонии"
  yem.38.d:0 "Сегодня йеменский дипломат Ахмут представил нам предложение от их короля. Они предлагают взять под свой контроль наши колонии на Аравийском полуострове. Учитывая недавние открытия нефти в этом регионе, отказ означал бы, что мы больше не получим от них столь необходимую нам нефть. Как нам поступить?"
  yem.38.a:0 "Принять предложение"
  yem.38.b:0 "Как они посмели!"
  yem.39.t:0 "Британцы уступили нашим требованиям"
  yem.39.d:0 "После дружественных переговоров Великобритания решила передать нам свои колонии на Аравийском полуострове за право экспортировать и добывать нефть в нашем регионе."
  yem.39.a:0 "Аравия вновь едина!"
  yem.40.t:0 "Британия отклоняет наши требования"
  yem.40.d:0 "Британцы отвергли наши требования, не оставив нам иного выбора, кроме как прекратить торговлю нефтью и силой забрать землю."
  yem.40.a:0 "Мы возьмем то, что принадлежит нам!"