l_russian:
  SOV_solidify_the_provisional_government:0 "Укрепить Временное Правительство"
  SOV_solidify_the_provisional_government_desc:0 "Только пригласив прежних сторонников прежнего либерального режима мы сможем обеспечить стабильность новорожденному Российскому государству. Большое значение имеет подчеркивание необходимости прогрессивных реформ, если мы хотим обеспечить демократическую приверженность нашей нации!"
  SOV_hold_emergency_elections:0 "Провести чрезвычайные выборы"
  SOV_hold_emergency_elections_desc:0 "Во время российской революции 1917 года великие умы, такие как Александр Керенский и Павел Милюков, видели Россию не под коммунистической тиранией или железным кулаком царя, а как полностью независимую республику, где каждый имеет свой голос. После многих лет конфликтов пришло время исполнить эту мечту!"
  SOV_agrarian_socialism:0 "Аграрный социализм"
  SOV_agrarian_socialism_desc:0 "Внедрение социальных реформ в нашей отрасли является необходимым шагом к достижению наших целей."
  SOV_funds_for_army:0 "Новые средства для армии"
  SOV_funds_for_army_desc:0 "После многих лет постоянной войны и вторжения последнее, что наш народ мог бы представить себе, - это ее продолжение. Тем не менее, мы всегда должны быть готовы к этим тяжелым временам."
  SOV_invest_civilian_industry:0 "Инвестиции в гражданскую промышленность"
  SOV_invest_civilian_industry_desc:0 "Гражданская промышленность является важной частью гарантии того, что наш народ не вернется к бедствию прошлого, поэтому нам нужно уделить большое внимание этой части."
  SOV_rebuild_the_russian_army:0 "Возродить Русскую армию"
  SOV_rebuild_the_russian_army_desc:0 "Русская армия была сильной и многочисленной в течение многих лет. Пора извлечь уроки из прошлых ошибок и создать лучшую и более современную армию."
  SOV_the_new_russian_army:0 "Новая Русская армия"
  SOV_the_new_russian_army_desc:0 "Армия сыграла огромную роль в освобождении нашей нации от коммунистов, но в то же время исторически она приносила в нашу страну насилие и тиранию. Чтобы Россия стала по-настоящему свободной, она должна быть под контролем."
  SOV_adapted_but_not_embraced:0 "Адаптировано, но не принято"
  SOV_adapted_but_not_embraced_desc:0 "Хотя мы, безусловно, можем извлечь уроки из изменений, внесенных Советами, мы должны помнить об их предательстве Временного правительства в 1917 году. Если мы хотим построить в России функционирующее демократическое государство, необходимо устранить некоторые элементы большевистского правления."
  SOV_purge_religous_beurocracy:0 "Очистить религиозную бюрократию"
  SOV_purge_religous_beurocracy_desc:0 "Хотя Православная церковь не должна быть полностью упразднена, следует предпринять шаги по ограничению ее влияния."
  SOV_reconvene_the_duma:0 "Воссоздать Думу"
  SOV_reconvene_the_duma_desc:0 "Восстановление Думы является важным шагом в укреплении демократии и обеспечении того, чтобы мы не попали под контроль бесполезных идеологий, таких как коммунизм."
  SOV_hero_of_the_1917:0 "Герой 1917 года"
  SOV_hero_of_the_1917_desc:0 "То, что сделал Керенский в 1917 году, нельзя игнорировать. Вот почему у нас он всегда будет занимать особое место"
  SOV_new_union_treaty:0 "Новый союзный договор"
  SOV_new_union_treaty_desc:0 "Укрепив нашу новую великую республику внутри страны, теперь нам пора обратить внимание на наши территории и на наши республики, чтобы снова установить с ними отношения. Мы должны подписать новый союзный договор для продолжения нашего совместного существования под управлением одного государства. Однако некоторые могут рассматривать этот поворот событий как предательство"
  SOV_russian_revanchism:0 "Русский реваншизм"
  SOV_russian_revanchism_desc:0 "Мало стран потеряли столько за такое короткое время. Если хоть какая-то справедливость есть, то мы вернем все, одним способом или другим"
  SOV_ultimatum_to_persia:0 "Ультиматум Персии"
  SOV_ultimatum_to_persia_desc:0 "Пришло время избавиться от персов раз и навсегда"
  SOV_returning_asia:0 "Назад в Азию"
  SOV_returning_asia_desc:0 "Нам нужно вновь утвердить свое господство в Азии и еще раз напомнить врагам, что мы здесь"
  SOV_watashi_revenge:0 "Отомстить Японии"
  SOV_watashi_revenge_desc:0 "Раньше Япония очень сильно нас разгромила. Мы не можем продолжать жить с этим унизительным поражением, мы должны отомстить!"
  SOV_join_allies:0 "Присоединиться к союзникам"
  SOV_join_allies_desc:0 "Присоединение к союзникам - очень хороший вариант для нас, чтобы остановить германскую военную машину"
  SOV_guardian_of_orthodoxy:0 "Хранитель православия"
  SOV_guardian_of_orthodoxy_desc:0 "Как крупнейшее и наиболее могущественное православное государство на Земле мы обязаны защищать эту религию и ее последователей."
  SOV_western_armenia:0 "Возвращение Западной Армении"
  SOV_western_armenia_desc:0 "Мы вернем Западную Армению, какой она была в прошлом, путем переговоров или силой!"
  SOV_warm_seas:0 "Операция \"Теплые моря\""
  SOV_warm_seas_desc:0 "Поскольку большая часть наших земель находится в засушливых и холодных регионах, нам приходится сталкиваться с серьезными проблемами. Мы должны найти способ добраться до теплых морей."
  SOV_dissolve_the_treaty_agreement:0 "Расторжение союзного договора"
  SOV_dissolve_the_treaty_agreement_desc:0 "Многолетние конфликты с братскими народами в составе бывшей Российской империи, а ныне Советского Союза, все более убедительно свидетельствуют о несостоятельности Союза, учитывая, что большинство этих территорий было присоединено вопреки воле их народов. Во имя сохранения мира и благополучия для всех нас мы должны предпринять шаги по обретению полной независимости союзными республиками."
  SOV_industry_for_the_west:0 "Индустриализация запада"
  SOV_industry_for_the_west_desc:0 "Индустриализация запада страны является важнейшим шагом на пути превращения его в неприступную стену на пути врага."
  SOV_industry_for_the_caucasus:0 "Индустриализация Кавказа"
  SOV_industry_for_the_caucasus_desc:0 "Индустриализация и вооружение территорий Кавказа позволит нашим союзникам встретить врага, идущего через горы, во всеоружии."
  SOV_industry_for_the_central_asia:0 "Индустрия в Центральной Азии"
  SOV_industry_for_the_central_asia_desc:0 "Нам необходимо инвестировать средства и напомнить жителям азиатского региона, почему они должны зависеть от нас, чтобы мы избавили их от нищеты и голода."
  SOV_return_russian_industries:0 "Возврат российской промышленности"
  SOV_return_russian_industries_desc:0 "Мы многое вложили в наши союзные республики за эти годы. Теперь, когда они строят свой собственный путь, пора вернуть эти инвестиции домой."
  SOV_move_towards_isolationism:0 "Движение к изоляционизму"
  SOV_move_towards_isolationism_desc:0 "Годы конфликта научили нас, что ни одна война не стоит той цены, которую она платит за наш народ. Мы будем стремиться никогда больше не втягивать русский народ в новую бессмысленную войну."
  SOV_the_free_russian_people:0 "ОДКБ"
  SOV_the_free_russian_people_desc:0 "Россия всегда имела сферу влияния за пределами Британской и Французской. Теперь, когда мы наконец избавились от нашего тиранического прошлого, мы можем быть союзниками с нашими соседями, а не доминировать над ними."
  #Prov Gov.
  SOV_civil_war_factory_1:0 "Исцелить раны гражданской войны"
  SOV_civil_war_factory_1_desc:0 ""
  SOV_civil_war_factory_2:0 "Открыть новые заводы"
  SOV_civil_war_factory_2_desc:0 ""
  SOV_civil_war_factory_3:0 "Проложить путь для военно-промышленного комплекса"
  SOV_civil_war_factory_3_desc:0 ""
  SOV_ally_cossac:0 "Союз с казаками"
  SOV_ally_cossac_desc:0 "Донские казаки занимают важное место в нашей армии. Нам нужно вновь ввести их в наш состав. Наш грозный вид наводит страх, Наполеон!"
  SOV_white_army_black_baron:0 "Белая армия Черного Барона!"
  SOV_white_army_black_baron_desc:0 "Белая армия снова с нами со всеми ее привилегиями. Нам теперь никого не надо бояться. Настало время для мести!"
  SOV_imperial_army:0 "Возрождение Императорской армии"
  SOV_imperial_army_desc:0 "Для сильной России мы должны восстановить нашу армию. Больше побед! Идти"
  SOV_putilov_factory:0 "Переименовать завод Путилова"
  SOV_putilov_factory_desc:0 "Путилов наш. Теперь, когда мы изгнали большевиков из страны, мы можем заново начать производство на нашем заводе. Под новым названием"
  SOV_retake_alaska:0 "Возвращение старой земли"
  SOV_retake_alaska_desc:0 "Мы должны заново захватить Аляску, чтобы возродить славу нашей прошлой империи"
  SOV_retake_tsargrad:0 "Взять Царьград"
  SOV_retake_tsargrad_desc:0 "Уничтожить турок, и мы должны двинуться к теплым морям. Идти и захватить Царьград. Марш"
  SOV_fallen_empire:0 "Возрождение павшей империи"
  SOV_fallen_empire_desc:0 "Пришло время собрать по частям нашу разрушенную империю, которая была разорвана на части. Никто не сможет отнять у нас наши земли. Идти"
  SOV_warsaw_pact:0 "Основание Варшавского договора"
  SOV_warsaw_pact_desc:0 "Наша сфера влияния достигает глубоко в Европу. Чтобы обеспечить безопасность вновь установленных коммунистических режимов в наших государствах-клиентах, мы применим сильное и прямое правление из Москвы, одновременно открывая им глаза на ужасающее угнетение рабочих, проводимое западными державами."
  SOV_fallen_empire_tt:0 "§ЖВерните ядро законных земель бывшей царской России§!"
  SOV_okhrana:0 "Охранка"
  SOV_okhrana_desc:0 "Охранка была очень важным отделением для нас, и для нас будет очень выгодно вернуть его и восстановить его прежнюю функцию."
  SOV_immortal_leader:0 "Возвращение из мертвых"
  SOV_immortal_leader_desc:0 "Говорили, что Николай умер, но теперь он вернулся и очень зол!"
  SOV_united_and_indivible:0 "Единый и неделимый"
  SOV_united_and_indivible_desc:0 "Если мы будем держаться вместе и научимся жить как единое целое, нас никто не сможет победить."
  SOV_re_enact_stolypin_reforms:0 "Восстановление столыпинских реформ"
  SOV_re_enact_stolypin_reforms_desc:0 "Возвращение столыпинских реформ, возможно, и не было логичной идеей, но это был действенный метод."
  SOV_lessons_of_ww1:0 "Уроки Первой мировой"
  SOV_lessons_of_ww1_desc:0 "Чтобы не сталкиваться с проблемами, которые случились с нами в Первой мировой войне, мы должны проанализировать их и не повторять наших ошибок."
  SOV_prioritize_civilian_economy:0 "Приоритет гражданской экономике"
  SOV_prioritize_civilian_economy_desc:0 "Мы должны уделять особое значение гражданской промышленности и обеспечить благосостояние нашего народа. В конце концов, одной из причин большевистского восстания был наш народ."
  SOV_prioritize_army_and_navy:0 "Приоритет армии и флоту"
  SOV_prioritize_army_and_navy_desc:0 "Мы должны превзойти другие сверхдержавы в этих вопросах, отдавая приоритет армии и флоту. В противном случае для всего может быть уже поздно."
  SOV_investigate_german_land_doctrine:0 "Исследовать немецкую военную доктрину"
  SOV_investigate_german_land_doctrine_desc:0 "Новая немецкая военная доктрина доказала свою эффективность и работает. Давайте изучим её и воспользуемся для себя."
  SOV_revenge_of_tsushima_battle:0 "Месть за Цусимский бой"
  SOV_revenge_of_tsushima_battle_desc:0 "Цусимское сражение стало очень унизительной и позорной войной для нас. Мы должны быть более готовы, чем раньше, и похоронить Японию в этом море."
  SOV_go_after_germany:0 "Пойти за Германией"
  SOV_go_after_germany_desc:0 "Мы должны пойти за немцами и отомстить за Первую мировую войну."
  SOV_execute_german_royal_family:0 "Казнить германскую королевскую семью"
  SOV_execute_german_royal_family_desc:0 ""
  SOV_secure_the_baltics_and_finland:0 "Обеспечить безопасность Прибалтики и Финляндии"
  SOV_secure_the_baltics_and_finland_desc:0 "Прибалтика и Финляндия долгое время являлись неотъемлемой частью России. Они откололись в момент национальной слабости и должны быть возвращены как можно скорее."
  POL_proclaim_slavic_unity2:0 "Объявить славянское единство"
  POL_proclaim_slavic_unity2_desc:0 "Со всеми славянскими и некоторыми немецкими территориями под нашим контролем мы намерены достичь того, чего не удавалось ни одному царю до нас. С согласия и одобрения как славян, так и немцев и поляков мы можем провозгласить объединение славянских народов."
  SOV_nkvd_on_action:0 "НКВД в действии"
  SOV_nkvd_on_action_desc:0 "НКВД работает, потому что в нашей стране слишком много ненависти. Мы очищаем ее."
  SOV_arrived_in_poland:0 "НКВД правит в Польше"
  SOV_arrived_in_poland_desc:0 "Мы должны найти и уничтожить предателей в Катыни. Ни у кого не должно возникать подозрений. На дежурстве начальник НКВД!"
  SOV_arrived_in_baltic:0 "НКВД правит в Прибалтике"
  SOV_arrived_in_baltic_desc:0 "Мы должны сделать в Прибалтике то же, что и в Польше. Никаких шансов!"
  SOV_NKVD_moral_army:0 "Контрольно-заградительные отряды"
  SOV_NKVD_moral_army_desc:0 "Дезертирство и дезертирство с фронта возросли. Пришло время положить этому конец."
  SOV_NKVD_construction_army:0 "Строительный батальон НКВД"
  SOV_NKVD_construction_army_desc:0 "Пришло время заставить работать мужчин на оккупированных территориях. Они будут работать на стройках и служить в Красной Армии."