 COG_coup:0 "Бельгийские командиры совершили переворот"
 COG_naval_effort:0 "Создание флота Конго"
 COG_naval_effort_desc:0 "Расширение нашего флота должно быть нашим главным приоритетом. Назначьте все имеющиеся ресурсы новым верфям и исследованиям легких надводных кораблей."
 COG_marine:0 "Морские усилия"
 COG_marine_desc:0 "Войны не выиграны только морской силой; мы также должны иметь возможность транспортировать наши армии через волны и безопасно высаживать их на берег..."
 COG_Naval_landing:0 "Морская высадка"
 COG_Naval_landing_desc:0 "Если наши худшие кошмары не сбудутся, эта война не закончится на американской земле. Хорошо спланированные высадки должны стать частью пути к победе."
 COG_submarine_effort:0 "Подводные усилия"
 COG_submarine_effort_desc:0 "Подводная война является наиболее захватывающим развитием военно-морского флота со времени изобретения торпедного катера. Было бы неплохо не только защищаться от подводных лодок, но и использовать их против вражеских кораблей."
 COG_submarine_effort_2:0 "Подводные усилия II"
 COG_submarine_effort_2_desc:0 "Подводная война является наиболее захватывающим развитием военно-морского флота со времени изобретения торпедного катера. Было бы неплохо не только защищаться от подводных лодок, но и использовать их против вражеских кораблей."
 COG_destroyer_effort:0 "Усилия по созданию эсминцев"
 COG_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое использование подводных лодок, мы также научились противостоять этим стратегиям. Эсминцы будут иметь решающее значение для этого."
 COG_destroyer_effort_2:0 "Усилия по созданию эсминцев II"
 COG_destroyer_effort_2_desc:0 "Изучая конструкцию и стратегическое использование подводных лодок, мы также научились противостоять этим стратегиям. Эсминцы будут иметь решающее значение для этого."
 COG_flexible_navy:0 "Гибкий флот"
 COG_flexible_navy_desc:0 "Переосмысление военно-морской войны с учетом достижений в области подводных технологий позволит нам эффективно наносить удары по вражеским конвоям."
 COG_Naval_end:0 "Современный военно-морской флот"
 COG_Naval_end_desc:0 ""

 #Economy Focuses
 COG_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 COG_invite_foreign_investors_desc:0 ""
 COG_use_farmlands:0 "Использовать сельхозугодья"
 COG_use_farmlands_desc:0 "Большая часть нашей земли покрыта лесами, и у нас недостаточно места для промышленности. Конечно же, фермеры нашей страны пожертвуют своей землей ради будущего Конго"
 COG_railways:0 "Конголезские железные дороги"
 COG_railways_desc:0 "Из-за географии нашей страны чрезвычайно сложно обеспечить инфраструктуру наших промышленных зон. Если мы оснастим свою страну рельсами, то сможем облегчить наши будущие инвестиции."
 COG_autarky:0 "Автономия"
 COG_autarky_desc:0 "Мы подготовили инфраструктуру нашей страны для промышленности. Теперь настало время заводов, которые будут использовать эту инфраструктуру"
 COG_develop_our_infrastructures:0 "Развить нашу инфраструктуру"
 COG_develop_our_infrastructures_desc:0 "Инфраструктура — это основа промышленности. Укрепление инфраструктуры нашей страны имеет решающее значение для развития конголезской промышленности"
 COG_further_industrialization_of_leopoldville:0 "Дальнейшая индустриализация Леопольдвиля"
 COG_further_industrialization_of_leopoldville_desc:0 ""
 COG_Congo_uranium:0 "Уран Конго"
 COG_Congo_uranium_desc:0 ""

 #Army Focuses
 COG_Budget_Expansion:0 "Расширение бюджета"
 COG_Budget_Expansion_desc:0 "Конголезская армия давно подвергалась сокращениям бюджета в результате Великой депрессии. По мере того как в мире росла напряженность из-за участившихся восстаний, армия отстала и нуждалась в реформе и вооружении."
 COG_Strengthen_Katanga_troops:0 "Укрепить войска Катанги"
 COG_Strengthen_Katanga_troops_desc:0 "С увеличением бюджета было закуплено много нового оружия, в основном пушек. Мы смогли передать их нашим проверенным элитным «белым» солдатам, войскам Катанги."
 COG_Weapon_Research:0 "Исследование оружия"
 COG_Weapon_Research_desc:0 "Винтовки - основное вооружение нашей армии. Мы должны отказаться от винтовок образца 1890-х годов и перейти на более современное оружие."
 COG_bring_support_tech:0 "Обеспечить техническую поддержку"
 COG_bring_support_tech_desc:0 "Наша армия лишена простейших подразделений, таких как разведка и инженерные войска. Нам нужно немедленно доставить их сюда из Европы."
 COG_protect_our_country:0 "Защитить нашу страну"
 COG_protect_our_country_desc:0 "Пока Бельгия не предоставила нам ни одного самолета. Похоже, больше нельзя делать ставку на самолеты. Если мы не можем поднять в воздух самолеты, то должны получить их на земле."
 COG_special_jungle_army:0 "Джунглевая пехота"
 COG_special_jungle_army_desc:0 "Конголезские джунгли чрезвычайно густые, и у нас много коренных солдат, привыкших к таким условиям. Почему бы нам не организовать их в дивизию"
 COG_desert_troops:0 "Пустынная пехота"
 COG_desert_troops_desc:0 "Мы преодолели леса! Теперь настало время пустынь."
