 #Political Focuses
 COG_Tour_of_Congo:0 "Тур по Конго"
 COG_Tour_of_Congo_desc:0 "§YБельгийское Конго§! начало приходить в упадок из-за §LВеликой депрессии§! 1929 года. Суровые реформы, введённые предыдущим генерал-губернатором §YОгюстом Тилькенсом§! в качестве реакции на депрессию, вызвали сильные волнения среди населения Конго. Поэтому, §YПьер Рикманс§!, фламандец, прибывший сюда для решения трудовых проблем, был назначен §YБельгийским министерством колоний§! 14 сентября 1934 года.\n\nРикманс отличался высокой активностью, мало задерживался в столице Леопольдвиле и часто объезжал колонию. §RЭто будет один из таких туров§!."
 COG_took_over_vacant_lands:0 "Захватили свободные земли"
 COG_took_over_vacant_lands_desc:0 "Конго располагает обширными лесами и бесконечными землями. Но мы их толком не используем. Аборигены не могут обрабатывать эти пустые земли. Поэтому мы должны отобрать их у них и наладить в них сельскохозяйственное, а может быть и промышленное, производство."
 COG_increase_rubber_cultivations:0 "Увеличить добычу каучука"
 COG_increase_rubber_cultivations_desc:0 "Хотя мы и достигли выдающихся успехов в области добычи каучука в своё время, наша репутация была запятнана из-за тех событий, что случились в прошлом. Теперь нам нужно оставить это позади, оставить красный каучук позади и снова увеличить объёмы добычи."
 COG_increase_rubber_cultivations_2:0 "Увеличить добычу каучука 2"
 COG_increase_rubber_cultivations_2_desc:0 "Наш план по увеличению первоначального объёма добычи каучука был с успехом выполнен, но нет, нам нужно ещё больше каучука. Его должно быть больше. Нам нужно увеличить импорт. Может быть, мы построим собственные самолёты."
 COG_mining_effort:0 "Горные работы"
 COG_mining_effort_desc:0 ""
 COG_steel_effort:0 "Стальное усилие"
 COG_steel_effort_desc:0 ""
 COG_steel_effort_2:0 "Стальное усилие 2"
 COG_steel_effort_2_desc:0 ""
 COG_Dominer_pour_servir:0 "Dominer pour servir"
 COG_Dominer_pour_servir_desc:0 "§YБельгийское правление в Конго§! основывалось на "§Yколониальной троице§!" §Yгосударства§!, §Yмиссионеров§! и §Yчастного бизнеса§!. Приоритет интересов бельгийских компаний означал, что в Конго вливалось огромное количество капитала, и каждый регион специализировался на добыче определённых ресурсов. В большинстве случаев интересы государства и частных предприятий тесно переплетались, и государство помогало компаниям подавлять забастовки и устранять другие препятствия со стороны аборигенов. Такой стиль управления отличался от практики §Yбританской и французской колониальной политики§!, которая оставляла традиционных вождей на позициях власти под надзором колониальной администрации.\n\nПатерналистская идеология, лежавшая в основе колониальной политики, была обобщена в лозунге, использовавшемся генерал-губернатором Пьером Рикмансом: Dominer pour servir (Управлять, чтобы служить). Колониальная администрация стремилась создать образ доброжелательного и мирного управления и Бельгийское Конго как образцовую колонию. Когда §YПьер Рикманс§! потягивал свой кофе после возвращения из своего путешествия, §Yон думал, сколько ещё он проведёт в Конго§!."
 COG_strike_problems:0 "Проблемы забастовок"
 COG_strike_problems_desc:0 "Суровые реформы, введённые предыдущим генерал-губернатором §YОгюстом Тилькенсом§! в качестве реакции на них, вызвали сильные волнения среди населения Конго. Их обязательно нужно будет отразить по указанию §YБельгийского министерства колоний§!."
