  infantry_terrain_training_orient:0 "Подразделения пехоты на Южном ТВД (1)"
  infantry_terrain_training_orient_desc:0 "Выполнение боевых задач и стратегических перебросок на Южном театре военных действий является трудной задачей для любой современной армии. Необходимо изучить данный театр, его историю и приемы, которые использовали местные народы для улучшения боевых качеств и скорости перемещения."
  infantry_terrain_training_orient2:0 "Подразделения пехоты на Южном ТВД (2)"
  infantry_terrain_training_orient2_desc:0 "Выполнение боевых задач и стратегических перебросок на Южном театре военных действий является трудной задачей для любой современной армии. Необходимо изучить данный театр, его историю и приемы, которые использовали местные народы для улучшения боевых качеств и скорости перемещения."
  infantry_terrain_training_north:0 "Подразделения пехоты на Северном ТВД (1)"
  infantry_terrain_training_north_desc:0 "Выполнение боевых задач и стратегических перебросок на Северном театре военных действий является трудной задачей для любой современной армии. Необходимо изучить данный театр, его историю и приемы, которые использовали местные народы для улучшения боевых качеств и скорости перемещения."
  infantry_terrain_training_north2:0 "Подразделения пехоты на Северном ТВД (2)"
  infantry_terrain_training_north2_desc:0 "Выполнение боевых задач и стратегических перебросок на Северном театре военных действий является трудной задачей для любой современной армии. Необходимо изучить данный театр, его историю и приемы, которые использовали местные народы для улучшения боевых качеств и скорости перемещения."
  marines_terrain_training_amf:0 "Подготовка морских пехотинцев для действий на нетипичном ландшафте (1)"
  marines_terrain_training_amf_desc:0 "Умение морских пехотинцев вести боевые действия на нетипичном ландшафте является ключевым фактором при морских вторжениях или форсировании рек. Необходимо вкладывать ресурсы в обучение наших войск действиям и перемещениям на подобном ландшафте."
  marines_terrain_training_amf2:0 "Подготовка морских пехотинцев для действий на нетипичном ландшафте (2)"
  marines_terrain_training_amf2_desc:0 "Умение морских пехотинцев вести боевые действия на нетипичном ландшафте является ключевым фактором при морских вторжениях или форсировании рек. Необходимо вкладывать ресурсы в обучение наших войск действиям и перемещениям на подобном ландшафте."