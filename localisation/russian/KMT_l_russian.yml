  political.9.d_nl:0 "Некоторые скажут, что они видели, как это приближается. И те, кто предостерегал от опасностей фашизма, и те, кто превозносил его как спасителя [Root.GetName], сегодня увидели, что их пророчества сбылись, когда [Root.GetLeader] в [Root.Capital.GetName] объявил, что [CHI.GetName] пойдёт по фашистскому пути. Вся оппозиция в течение нескольких часов была немедленно заглушена.\n\n[Root.GetLeader] также не планирует давать сопротивлению возможность усиливаться. Было объявлено военное положение, и с учётом происходящих изменений, то, что будет после, вряд ли будет сильно отличаться."
  political.18.d_nl:1 "Быстрорастущее [Root.GetAdjective] фашистское движение никогда не утверждало, что им нужна поддержка большинства, прежде чем они захватят власть. Тем не менее, похоже, что их общественная поддержка быстро растёт. [Root.GetLeader] теперь призывает к переходу к фашизму.\n\nПризыв к референдуму был отвергнут некоторыми членами [Root.GetRulingParty] как типичная попытка нарушить систему, но это очень разозлило [Root.GetLeader]. Если мы не будем действовать сейчас, [Root.GetLeader] может выбрать путь насилия как более подходящий для прихода к власти."
  political.10.d_nl:1 "Хотя попытки фашистского движения возродить националистические настроения и увенчались определенным успехом, сопротивление этим идеям остается высоким. [Root.GetLeader] разочарован отсутствием уверенности [Root.GetAdjective] населения, по-видимому, в [Root.GetRulingParty].\n\n[Root.GetLeader] по-прежнему уверен, что люди в конечном итоге обретут чувство гордости, но колеблется в выборе дальнейших действий. Некоторые из сторонников призывают немедленно организовать переворот, прежде чем враги [Root.GetName] предпримут какие-либо действия. Однако подобные действия при ограниченной общественной поддержке могут ввергнуть страну в гражданскую войну."
  true_marxist_lennenist:0 "Истинный марксист-ленинец"
  KMT_trick_war:0 "Китай объявляет внезапную войну Японии"
  JAP_toseiha_trait:0 "Тосэйха у власти"
  JAP_toseiha_trait_chi_ally:0 "Тосэйха у власти"
  JAP_kodoha_trait:0 "Кодоха у власти"
  JAP_kodoha_trait_chi_ally:0 "Кодоха у власти"
  JAP_kodoha:0 "Кодоха"
  JAP_toseiha:0 "Тосэйха"
  JAP_taiseiyokusankai:0 "Тайсэй Ёкусанкай"
  ya_zhou_lian_meng:0 "Da Dong Ya Gong Rong Quan"
  chi_jap_alliance_threat:0 "Китайско-японский союз"
  jyutgwai.1.d:0 "Ху Ханьминь, один из лидеров ранней консервативно-правой фракции в Гоминьдане во время революционного Китая, к сожалению, скончался. Его похороны должны состояться через 5 дней. Ожидается, что на похоронах будет присутствовать много важных фигур, включая Чан Кайши."
  jyutgwai.1.a:0 "Его подвиги не будут забыты."

  jyutgwai.2.t:0 "Похороны Ху Ханьминя"
  jyutgwai.2.d:0 "После кончины Ху Ханьминя его похороны состоятся через несколько дней. Чан Кайши планирует встретиться с [YUT.GetLeader] и заручиться его помощью в уничтожении новой Гуанси-клики и его политических соперников Ли Цзунжэня."
  jyutgwai.2.a:0 "Отличный план."
  jyutgwai.2.b:0 "Не нужно прибегать к такому подходу, наша армия справится с этой задачей."
  jyutgwai.2.c:0 "Вместо этого нам следует сосредоточиться на японской угрозе."

  jyutgwai.3.t:0 "Предложение Чан Кайши"
  jyutgwai.3.d:0 "После встречи с [CHI.GetLeader] на похоронах Ху Ханьминя [Root.GetLeader] получил предложение, или, как некоторые могли бы назвать это, ультиматум от него. Суть предложения заключается в том, чтобы заручиться нашей помощью в уничтожении клики [GXC.GetLeader]. [Root.GetLeader] опасается, что если новая Гуанси-клика будет уничтожена, его клика скоро последует за ними."
  jyutgwai.3.a:0 "Связаться с [GXC.GetLeader] и сформировать единый фронт!"
  jyutgwai.3.b:0 "Мы захватим Нанкин и свергнем режим [CHI.GetLeader]!"
  jyutgwai.3.c:0 "Подчиняйтесь, пока не стало слишком поздно!"

  jyutgwai.4.t:0 "Предложение от [YUT.GetLeader]"
  #jyutgwai.4.d:0 "[YUT.GetLeader] раскрыл план [CHI.GetLeader] уничтожить нашу клику. Однако, опасаясь, что в случае нашего уничтожения их постигнет та же участь, теперь они ищут союз с нами, а не содействия [CHI.GetRulingParty]."
  #jyutgwai.4.a:0 "Мы вместе выступим против такой тирании."
  #jyutgwai.4.b:0 "Они просто водят нас за нос."

  #jyutgwai.5.t:0 "Альянс принят"
  #jyutgwai.5.d:0 "[GXC.GetLeader] принял наше предложение о союзе и теперь готовит свои войска!"
  #jyutgwai.5.a:0 "Смерть [CHI.GetLeader]!"

  #jyutgwai.6.t:0 "Альянс отклонен"
  #jyutgwai.6.d:0 "[GXC.GetLeader] отклонил наше предложение о союзе!"
  #jyutgwai.6.a:0 "Как они могли!"

  #jyutgwai.7.t:0 "[YUT.GetName] отказывается подчиняться"
  #jyutgwai.7.d:0 "[YUT.GetLeader] отказался помогать нам уничтожить клику [GXC.GetLeader]!"
  #jyutgwai.7.a:0 "Попробуй подкупить некоторых из его людей."
  #jyutgwai.7.b:0 "Поразмыслив еще немного, может, стоит перестать это делать."

  #jyutgwai.8.t:0 "Юй Ханьмоу"
  #jyutgwai.8.d:0 "Некоторых наших людей подкупил [From.GetLeader], и они перебежали к врагу. Центральное правительство также отстранило Чэнь Цзитана от должности. Теперь Юй Ханьмоу, выступавший за Чан Кайши, занял должность Чэнь Цзитана. Чэнь Цзитан получает ультиматум с требованием лишиться власти над армией и подчиниться Центральному правительству."
  #jyutgwai.8.a:0 "Помоги Чэнь Цзитану сбежать в Гонконг!"
  #jyutgwai.8.b:0 "Убеди Чэнь Цзитана присоединиться к Новой Гуансийской клике!"
  #jyutgwai.8.c:0 "Этот предательский ублюдок!"
  
  #jyutgwai.9.t:0 "Новая Гуансийская клика"
  #jyutgwai.9.d:0 "Теперь, когда Чэнь Цзитан и его бунтарское поведение остались в прошлом, нам противостоят только [GXC.GetLeader] и его люди. Наши подкупы оказались безрезультатными. Похоже, нам придётся найти другой способ."
  #jyutgwai.9.a:0 "Попробуйте подкупить их."
  #jyutgwai.9.b:0 "Нашим приоритетом должны быть японцы."
  
  #jyutgwai.10.t:0 "Аварийный набор в армию"
  #jyutgwai.10.d:0 "[CHI.GetRulingParty] предприняли некоторые действия, их подкуп вызвал разногласия в Юэской клике. Мы должны подготовить наших людей к началу войны!"
  #jyutgwai.10.a:0 "Нам нужно направить представителей в Нанкин для более мирного урегулирования."
  #jyutgwai.10.b:0 "Jaak3 si2 laa1, zoeng2 gaai3 sek6"
  
  #jyutgwai.11.t:0 "Давление со стороны СМИ"
  #jyutgwai.11.d:0 "В связи с постоянным напряжением между нами и [GXC.GetLeader] большинство СМИ поддерживают [GXC.GetLeader], а не нас. Это в основном связано с нашей нынешней политикой приоритета внутренней стабильности над японской угрозой."
  #jyutgwai.11.a:0 "Сначала мы должны избавиться от болезни сердца!"
  #jyutgwai.11.b:0 "Если мы продолжим в том же духе, мы можем потерять еще больше поддержки со стороны общественности."
  
  #jyutgwai.12.t:0 "Инцидент разрешен"
  #jyutgwai.12.d:0 "После длительных обсуждений представителей с обеих сторон был достигнут консенсус. С тех пор так называемый "Лянгуанский инцидент" был разрешен.
  jyutgwai.12.a:0 "Это во благо китайскому народу."
  jyutgwai.15.a:0 "Мудрое решение."
  jyutgwai.15.b:0 "Скоро мы снова возьмем под контроль центральную равнину."
  jyutgwai.16.a:0 "Следующая остановка — [CHI.Capital.GetName]!"
  jyutgwai.16.b:0 "Где снова мой улун?"
  negotiate_in_20:0 "§YСобытие произойдет примерно через 35 дней.§!\n\n"
  jyutgwai.18.a:0 "Отлично, наши люди будут сражаться до последнего вздоха!"
  jyutgwai.19.a:0 "Предатель!"
  jyutgwai.20.d:0 "После продолжительных дебатов представители обеих сторон пришли к консенсусу.\n\nРезультат их обсуждения выглядит следующим образом :\n\n[CHI.GetName] и [GXC.GetName] выведут свои войска.\nЦентральное правительство не будет вмешиваться в дела Лянгуана.\n[GXC.GetName] должен безоговорочно подчиняться приказам Центрального правительства, как только разразится война.\n\nОднако [CHI.GetLeader] и [GXC.GetLeader] должны будут согласиться с этими условиями, чтобы они вступили в силу."
  jyutgwai.20.a:0 "Приемлемо"
  jyutgwai.20.b:0 "Унизительно!"

  jyutgwai.22.t:0 "Контрпредложение от [CHI.GetName]"
  jyutgwai.22.d:0 "Считая условия неравными и унизительными, [CHI.GetLeader] отдал приказ о контрпредложении, требующем, чтобы наша клика находилась под его прямым контролем."
  jyutgwai.22.a:0 "Просто покончи с этим."
  jyutgwai.22.b:0 "Fang shen me gou pi!"

  jyutgwai.23.t:0 "Контрпредложение от [GXC.GetName]"
  jyutgwai.23.d:0 "Считая условия неравными и унизительными, [GXC.GetLeader] отдал приказ о контрпредложении, требующем, чтобы область Лянгуан находилась под их прямым контролем в качестве компенсации."

  jyutgwai.24.t:0 "Контрпредложение отклонено"
  jyutgwai.24.d:0 "Наше контрпредложение было отклонено, похоже, остался только один выход."
  jyutgwai.24.a:0 "Приготовьтесь!"

  jyutgwai.25.t:0 "Контрпредложение принято"
  jyutgwai.25.d:0 "К нашему удивлению, наше контрпредложение было принято."
  jyutgwai.25.a:0 "По крайней мере нам не придется идти на войну."

  jyutgwai.26.t:0 "Переговоры не удались"
  jyutgwai.26.d:0 "Обе стороны отклонили условия. Другие переговоры кажутся невозможными, обе стороны начали мобилизовать войска к войне."
  jyutgwai.26.a:0 "Мы это предвидели!"

  jyutgwai.27.t:0 "Ситуация разрешена"
  jyutgwai.27.d:0 "Обе стороны вывели свои войска, напряженность ослабла."
  jyutgwai.27.a:0 "Хорошо для всех."

  jyutgwai.29.t:0 "[From.GetRulingParty] решили оставить нас в покое"
  #jyutgwai.29.d:0 "Так вот, похоже, официальные представители [From.GetRulingParty] решили отпустить нас и не принимать против нас никаких дальнейших действий."
  #jyutgwai.29.a:0 "Э... что? Они серьёзно?"

  #jyutgwai.30.t:0 "Попытка подкупа не удалась"
  #jyutgwai.30.d:0 "Несмотря на нашу щедрость, генералы и солдаты из [From.GetName] не хотят бросать своего господина. Наша попытка подкупа не удалась."
  #jyutgwai.30.a:0 "Тогда прибегнем к насилию."
  #jyutgwai.30.b:0 "Мы раздавим их нашими силами!"
  #jyutgwai.30.c:0 "Посмотрим, как будут развиваться события."

  #jyutgwai.31.t:0 "Взятка принята"
  #jyutgwai.31.d:0 "Наш подкуп приветствовали большинство генералов в [From.GetName], и многие из них перешли на нашу сторону."
  #jyutgwai.31.a:0 "Это лишний раз доказывает, насколько они слабы."

  #jyutgwai.32.t:0 "Наши люди не поддались на взятку"
  #jyutgwai.32.d:0 "Наши люди не поддались на взятку от [From.GetLeader]. Теперь мы ещё более сплочены, чем раньше!"
  #jyutgwai.32.a:0 "Справедливость восторжествует!"

  #jyutgwai.33.t:0 "Инцидент с Лянгуаном"
  #jyutgwai.33.d:0 "На фоне инцидента с Лянгуаном [CHI.GetLeader] теперь занят урегулированием проблемы на юге. Это наш шанс действовать. Сперва можем заключить мир с коммунистами, чтобы сберечь наших людей."
  #jyutgwai.33.a:0 "Призвать к прекращению огня."
  #jyutgwai.33.b:0 "Нет, коммунизм — это заноза в теле китайского народа."

  #jyutgwai.34.t:0 "[From.GetLeader] хочет прекращения огня"
  #jyutgwai.34.d:0 "[From.GetLeader] прислал своего представителя с предложением о прекращении огня между нашими войсками. Учитывая, что [CHI.GetLeader] занят на юге, мы можем воспользоваться этим шансом, чтобы оправиться."
  #jyutgwai.34.a:0 "Хорошо"
  #jyutgwai.34.b:0 "Это ловушка!"

  #jyutgwai.35.t:0 "[From.GetName] согласился"
  #jyutgwai.35.d:0 "[From.GetName] согласился на прекращение огня. Теперь мы можем оправиться и попробовать осуществить наш план."
  #jyutgwai.35.a:0 "Великолепно!"

  #jyutgwai.36.t:0 "[From.GetLeader] отказался"
  #jyutgwai.36.d:0 "[From.GetName] отказался от соглашения о прекращении огня. Нам следует продолжать сражаться."
  #jyutgwai.36.a:0 "Это нехорошо."

  #jyutgwai.37.t:0 "Чжан Сюэлян прекращает наступление"
  #jyutgwai.37.d:0 "Мы выяснили, что Чжан Сюэлян прекратил наступление на коммунистов. Возможно, он думает, что мы сейчас заняты войной с южными милитаристами и не обращаем на него внимания, поэтому хочет воплотить какой-нибудь свой зловещий замысел."
  #jyutgwai.37.a:0 "Мы разберемся с ними позже..."

  #jyutgwai.38.t:0 "Дилемма"
  #jyutgwai.38.d:0 "В то время как силы [CHI.GetLeader] приближаются к нашим границам, а представитель [GXC.GetLeader] пытается склонить на свою сторону [Root.GetLeader], мы оказались в затруднительном положении между [CHI.GetRulingParty] и [GXC.GetRulingParty]. Если мы заключим союз с одной из сторон, другая непременно будет недовольна. А текущая ситуация исключает сохранение нейтралитета."
  #jyutgwai.38.a:0 "Попытаться обмануть [CHI.GetLeader], заставив его разместить свои силы на передовой."
  #jyutgwai.38.b:0 "Заключить союз с [CHI.GetRulingParty]"
  jyutgwai.38.c:0 "Союзник [GXC.GetRulingParty]"

  jyutgwai.39.t:0 "Предложение [From.GetLeader]"
  jyutgwai.39.d:0 "Оказавшись в затруднительном положении, [From.GetLeader] попытался вступить в союз с нами и направил предложение, в котором говорилось, что силы [Root.GetLeader] должны быть направлены на передовую для эффективного удара в предстоящем наступлении."
  jyutgwai.39.b:0 "Это явно план ослабить наши силы!"
  jyutgwai.39.a:0 "Звучит хорошо."

  jyutgwai.40.t:0 "Предложение принято"
  jyutgwai.40.d:0 "[From.GetLeader] одобрил наше предложение и вывел свои силы на фронт."
  jyutgwai.40.a:0 "Нам повезло."

  jyutgwai.41.t:0 "Предложение отклонено"
  jyutgwai.41.d:0 "[From.GetLeader] раскусил уловку Хэ Цзяня и теперь возмущен. Хэ Цзянь был отстранен от должности."
  jyutgwai.41.a:0 "Что ж..."

  jyutgwai.42.t:0 "[From.GetName] присоединяется к нам"
  jyutgwai.42.d:0 "Подвергаясь давлению с обеих сторон, [From.GetLeader] решил присоединиться к нам!"
  jyutgwai.42.a:0 "Хорошо"

  jyutgwai.43.t:0 "[From.GetName] присоединяется к нашему врагу"
  jyutgwai.43.d:0 "Подвергаясь давлению с обеих сторон, [From.GetLeader] решил присоединиться к нашему врагу!"
  jyutgwai.43.a:0 "Как они смеют!"

  jyutgwai.44.t:0 "Наши люди были подкуплены"
  jyutgwai.44.d:0 "Наши люди были подкуплены [CHI.GetLeader], и был назначен новый лидер, который поддерживает [CHI.GetLeader]."
  jyutgwai.44.a:0 "Как это могло произойти!"
  #
  jyutgwai.45.t:0 "[From.GetName] объявил нам войну"
  #jyutgwai.45.d:0 "[From.GetName] решило решить наши текущие проблемы на поле боя."
  #jyutgwai.45.a:0 "Да будет так."
  #
  #jyutgwai.46.t:0 "Сохранение наших сил"
  #jyutgwai.46.d:0 "Несмотря на союз с [CHI.GetRulingParty], [Root.GetLeader] не хочет участвовать в споре [CHI.GetLeader] с [GXC.GetLeader]. Он придумал план по сохранению наших сил и ослаблению сил [CHI.GetLeader] в случае начала войны."
  #jyutgwai.46.a:0 "Отправить предложение."
  #jyutgwai.46.b:0 "У нас будут проблемы, если они узнают о наших намерениях!"
  ## NOT IN USE YET ##
  chi_jap.1.t:0 "Предательство [CHI.GetLeader]"
  chi_jap.1.d:0 "[CHI.GetLeader] предал свою нацию и свой народ, заключив союз с мерзкими японцами! Мы должны что-то предпринять, пока не стало слишком поздно!"
  chi_jap.1.a:0 "Мы должны сотрудничать с военачальниками!"
  chi_jap.1.b:0 "Мы будем действовать в одиночку."
  chi_jap.2.t:0 "Сообщение от [From.GetName]"                             #Эта нация обозначает народ (das Volk)
  chi_jap.2.d:0 "В связи с недавним предательством [CHI.GetName] в отношении китайской нации [From.GetLeader] отправил сообщение с просьбой о сотрудничестве в формировании единого фронта против этой угрозы."
  chi_jap.2.a:0 "Поднимитесь, те, кто отказывается быть рабами!"
  chi_jap.2.b:0 "У нас может быть более светлое будущее в сотрудничестве с Солнцем."
  chi_jap.2.c:0 "Никогда!"
  chi_jap.3.t:0 "Китайский военачальник - [From.GetLeader]"
  chi_jap.3.d:0 "[From.GetLeader] отправил сообщение о своем желании стать частью Сферы сопроцветания Великой Восточной Азии."
  chi_jap.3.a:0 "Они точно знают, куда дует ветер."
  chi_jap.3.b:0 "Они не заслуживают места в Зоне совместного процветания."
  chi_jap.4.t:0 "Просьба принята"
  chi_jap.4.d:0 "[From.GetName] предоставил нам место в Зоне совместного процветания!"
  chi_jap.4.a:0 "Зона совместного процветания растет!"
  chi_jap.5.t:0 "Просьба отклонена"
  chi_jap.5.d:0 "Наша просьба о присоединении к [From.GetFactionName] была отклонена!"
  chi_jap.5.a:0 "Мы поставили себя в безвыходное положение..."
  chi_jap.6.t:0 "[From.GetName] присоединяется к нам в нашем курсе"
  chi_jap.6.d:0 "[From.GetLeader] также увидел угрозу со стороны предателя [CHI.GetLeader] и японцев и присоединился к нам в наших усилиях по их устранению."
  chi_jap.6.a:0 "Китайцы должны быть едины!"
  chi_jap.7.t:0 "[From.GetName] отказывается присоединиться к нам"
  chi_jap.7.d:0 "[From.GetLeader] отказался присоединиться к нам в наших усилиях по спасению нации!"
  chi_jap.7.a:0 "Это еще один вид измены!"
  PRC_kang_ri_jiu_wang_manpower:0 "Kang Ri Jiu Wang"
  PRC_kang_ri_jiu_wang_economy:0 "Kang Ri Jiu Wang"
  CHIJAP_kang_ri_jiu_wang_idea:0 "Kang Ri Jiu Wang"
  #reject_all_demand_and_war:0 "Отклонить всё и объявить войну."
  #demand_rejected_war.t:0 "ВОЙНА!"
  #demand_rejected_war.d:0 "[From.GetName] потерял всё терпение и решил прибегнуть к войне, чтобы решить проблему. Он начал наступление, и нам пора готовить наших людей!"
  #demand_rejected_war.a:0 "Нецивилизованные варвары!"
  #KMT_chi_stop_civil_war_demand_rejected_tt:0 "[From.GetName] отклонил наше требование остановить гражданскую войну и создание единого фронта.\n"
  #KMT_chi_demand_submission_tt:0 "[From.GetName] потребовал нашей капитуляции.\n"
  #KMT_will_submit_to_chiang_tt:0 "Будем подчиняться [CHI.GetName].\n"
  #KMT_chi_demand_submission_rejected_tt:0 "[From.GetName] отклонил наше требование о капитуляции.\n"
  #resolved.t:0 "Инцидент исчерпан."
  #resolved.d:0 "Обе стороны пришли к соглашению по всем пунктам, инцидент исчерпан.\n\nУсловиями являются следующие:"
  #xian.1.t:0 "Чжан Сюэлян"
  #xian.1.d:0 "Так как Чжан Сюэлян прекратил атаковать бандитов-коммунистов без уведомления центрального правительства, ход ликвидации коммунистов замедлился. [Root.GetLeader] решил навестить Чжана в Сиане."
  #xian.1.a:0 "Это покажет им, кто тут хозяин."
  #xian.1.b:0 "Это неважно."
  #xian.2.t:0 "Прибытие [CHI.GetLeader]"
  #xian.2.d:0 "[CHI.GetLeader] прибыл в Сиань, чтобы встретиться с [Root.GetLeader]. [CHI.GetLeader] заявил, что мы должны уничтожить всех коммунистов в течение трёх месяцев, иначе он возьмёт дело в свои руки."
  #xian.2.a:0 "Захватить [CHI.GetLeader] и потребовать остановить гражданскую войну!"
  #xian.2.b:0 "Мы ничего не можем сделать."
  #KMT_will_Die_tt:0 "§R§!Если в течении трёх месяцев вы не уничтожите коммунистов, вас аннексируют.§!\n"
  #xian.3.t:0 "Чан Кайши взят в заложники"
  #xian.3.d:0 "Чжан Сюэлян начал атаку на резиденцию Чан Кайши и взял его в плен. Теперь Чжан требует, чтобы мы остановили гражданскую войну и сосредоточились на японцах. Если мы согласимся с этими условиями, они освободят Чан Кайши."
  #xian.3.a:0 "Отправить к ним парламентёров!"
  #xian.3.b:0 "Мы силой вернём Чан Кайши!"
  #xian.4.t:0 "[From.GetRulingParty] отправляет представителя"
  #xian.4.d:0 "Представитель [CHI.GetRulingParty] прибыл для обсуждения текущего вопроса.\n\nМы выдвинем следующие требования:"
  #xian.4.a:0 "Очень хорошо"
  #xian.5.t:0 "[CHI.GetRulingParty] переходит в наступление!"
  #xian.5.d:0 "[CHI.GetRulingParty] решил силой вернуть Чан Кайши!"
  #xian.5.a:0 "Приготовьте своих людей!"
  #xian.6.t:0 "Сианьский инцидент"
  #xian.6.d:0 "Чжан Сюэлян взял в заложники Чан Кайши в надежде, что тот сосредоточится на японцах, а не на коммунистах [PRC.GetLeader]."
  #xian.6.a:0 "Это не то, что нам нужно."
  #xian.6.b:0 "Мы должны поддержать усилия Чжана."
  #xian.7.d:0 "Чжан Сюэлян взял в заложники Чан Кайши в надежде, что тот сосредоточится на японцах, а не на нас."
  #xian.7.a:0 "Мы надеемся, что он добьётся успеха."
  #xian.8.t:0 "[SOV.GetName] недоволен"
  #xian.8.d:0 "[SOV.GetName] не слишком доволен нашим решением держать Чан Кайши в заложниках и требует, чтобы мы немедленно его отпустили."
  #xian.8.a:0 "Мы не должны отступать!"
  #xian.9.t:0 "Сообщение от [SOV.GetName]"
  #xian.9.d:0 "[SOV.GetName], кажется, вполне доволен нашими усилиями по достижению единого фронта и призвал нас не отступать."
  #xian.9.a:0 "Пусть передадут им нашу благодарность."
  #xian.10.t:0 "К власти приходит [CHI.GetRulingParty]"
  #xian.10.d:0 "Нам не удалось уничтожить коммунистов за три месяца, и теперь к власти пришел [CHI.GetRulingParty]."
  #xian.10.a:0 "..."
  #xian.11.t:0 "Мы взяли власть"
  #xian.11.d:0 "Мы взяли под свой контроль Северо-восточную армию, поскольку та не справилась с поставленной задачей по уничтожению коммунистов в течение трех месяцев."
  #xian.11.a:0 "Мы покончим с коммунистами."
  #xian.100.a:0 "Мы не будем работать с коммунистами!"
  #xian.100.b:0 "Мы потребуем их подчинения!"
  #xian.100.c:0 "Мы никогда не сдадимся!"
  #KMT_ROOT_NAME_TT:0 "[Root.GetName]:\n"
  #xian.12.t:0 "Арестовать Чжан?"
  #xian.12.d:0 "Чжан Сюэлян последовал за Чан Кайши в Нанкин, но его действия до сих пор не прощены. Теперь Чан планирует поместить Чжана под домашний арест, чтобы держать его под контролем."
  #xian.12.a:0 "Ему следует знать, что это неминуемо."
  #xian.12.b:0 "В этом нет необходимости."
  #KMT_chi_stop_civil_war_demand_again_tt:0 "Они настаивали на том, что гражданская война должна быть остановлена.\n"
  #xian.100.d:0 "Мы требуем единого фронта!"
  #KMT_chiang_returns_tt:0 "Чан Кайши доступен как полевой маршал"
  #xian.13.t:0 "Чан Кайши спасён"
  #xian.13.d:0 "После уничтожения войск Чжана наши солдаты нашли и освободили Чана."
  #xian.13.a:0 "Они никогда не получат против нас шанса."
  #xian.1.d_2:0 "Прогресс в борьбе с коммунистами медленный. [CHI.GetLeader] решил нанести визит [ZXL.GetLeader] и призвать его быстро разобраться с коммунистами."
