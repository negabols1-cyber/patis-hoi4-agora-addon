#################################### IDEAS #################################

  CHI_army_with_state:0 "Армия с государством"
  CHI_land_reforms:0 "Земельная реформа"
  CHI_land_reforms_desc:0 "Налоговая реформа колониальной администрации серьезно ограничила власть и сельскохозяйственный потенциал наших земель. Новый режим извлечет уроки из прошлых ошибок, реформировав налоговую систему и актуализировав кадастровую карту страны."
  KMT_into_fascism:0 "Новое движение жизни"
  KMT_into_fascism_desc:0 "Правительственное гражданское движение для противодействия коммунистической пропаганде по всей стране."
  kmt_military_youth:0 "Военная молодежь"
  kmt_military_youth_desc:0 "Молодых людей поощряют к созданию националистических организаций и военизированных формирований."
  KMT_communism_banned:0 "Новый белый террор"
  KMT_communism_banned_desc:0 "Мы искореним любые коммунистические мысли в сознании народа."
  KMT_powerful_blueshirts:0 "Мощные Голубые рубашки"
  KMT_powerful_blueshirts_desc:0 "СИБ — это разведывательное агентство при Голубых рубашках, которое сыграло важную роль в оказании помощи нынешнему режиму в приходе к власти. Теперь, когда нынешний правитель предоставил им больше контроля, никто не может вырваться из их власти."
  KMT_empire_plan:0 "План по созданию империи"
  KMT_empire_plan_desc:0 "Мы возродим Славу Китая из пепла наших врагов!"
  KMT_framed_mongolia:0 "Ненадежный посторонний"
  KMT_framed_mongolia_desc:0 "Наш бывший лидер фракции доверился некоторым документам неизвестного происхождения, и теперь мы остались сами по себе. Возмущенные граждане сформировали отталкивающую силу по отношению к посторонним."
  KMT_infiltrated_mongol:0 "Закрытая внешняя политика"
  KMT_infiltrated_mongol_desc:0 "Мы должны бороться сами, мы ни на кого не можем рассчитывать!"
  KMT_militarism:0 "Национальная военная индоктринация"
  KMT_militarism_desc:0 "Выполнять приказы и бороться с бесчеловечным врагом на славу государства - такова твоя единственная цель, солдат!"
  KMT_war_propaganda_idea:0 "Военная пропаганда"
  KMT_war_propaganda_idea_desc:0 "Враг должен бояться нашей мощи и доблести!"
  KMT_war_propaganda_idea_2:0 "Военная пропаганда"
  KMT_war_propaganda_idea_2_desc:0 "Враг должен бояться нашей силы и храбрости!"
  KMT_military_first_idea:0 "Военные прежде всего"
  KMT_military_first_idea_desc:0 "Всё для наших солдат, наших защитников, наших спасителей. Всё для фронта!"
  KMT_war_fanaticism_idea:0 "Военный фанатизм"
  KMT_war_fanaticism_idea_desc:0 "[CHI.GetLeader] ... [CHI.GetNameDef] ... жить десять тысяч лет ... жить десять тысяч десять тысяч лет!"
  KMT_jap_military_advisors:0 "Японские военные советники"
  KMT_jap_military_advisors_desc:0 "Нашим генералам есть чему поучиться у наших новых союзников [JAP.GetAdjective].\n\n§YРазрешить атаку банзай§!"
  KMT_into_democracy:0 "Принцип миньцюань"
  KMT_into_democracy_desc:0 "Только демократия, как учил Сунь Ят-сен, спасёт [CHI.GetNameDef] от краха."
  KMT_parliament:0 "Движение за возрождение села"
  KMT_parliament_desc:0 "Санитарные нормы и уровень жизни постепенно улучшаются под руководством нынешнего правительства."
  KMT_universal_sufferage_ns:0 "Три принципа народа"
  KMT_universal_sufferage_ns_desc:0 "Национализм, демократия и средства к существованию для народа!"
  KMT_people_knowledge:0 "Образование граждан"
  KMT_people_knowledge_desc:0 "Мы должны как можно быстрее искоренить неграмотность."
  KMT_westernization_ns:0 "Вестернизация"
  KMT_westernization_ns_desc:0 "Культурный и технологический обмен с Западом приносит большую пользу нашей стране."
  KMT_firm_belief:0 "Твёрдая вера"
  KMT_firm_belief_desc:0 "Уникальная основа [Root.GetAdjective] демократии никогда не может быть согнута или сломана."
  KMT_stay_non_aligned:0 "Опека народа"
  KMT_stay_non_aligned_desc:0 "[$CHI.GetRulingParty] будет руководить государством и учить людей, как строить по-настоящему демократическое государство."
  KMT_central_power:0 "Централизованная власть"
  KMT_central_power_desc:0 "Если бы вся власть была сконцентрирована в одном месте, а не рассеяна по всей стране, гражданской войны в Китае могло бы и не быть."
  KMT_despotism:0 "Деспотизм"
  KMT_despotism_desc:0 "[CHI.GetLeader] обладает всей властью, необходимой для правления и ведения [CHI.GetNameDef] к её предназначенному величию."
  KMT_propaganda:0 "Пропаганда национальной обороны"
  KMT_propaganda_desc:0 "Поскольку японцы угрожают нашему существованию, весь китайский народ должен объединиться против них."
  KMT_propaganda_busted:0 "Пропаганда национальной обороны дискредитирована"
  KMT_propaganda_busted_desc:0 "Наш народ чувствует себя обманутым. Некоторые солдаты отказались воевать, говоря, что они присоединились к армии, чтобы защищать Китай, а не развязывать агрессивную войну против товарищей-китайцев."
  taiwan_returned:0 "Тайвань вернулся"
  taiwan_returned_desc:0 "Мы разозлили многих националистических политиков и офицеров, вернув Тайвань Китаю. Наши люди требуют ответов и видят в нас предателей."
  KMT_united_front:0 "Единый фронт"
  KMT_united_front_desc:0 "Второй единый фронт защитит китайский народ от вторжения [JAP.GetNameDef].\n\n§RЕсли вы один из военачальников, вы будете автоматически аннексированы [CHI.GetNameDef], когда капитулируете.§!"
  KMT_rear:0 "Большой тыловой план"
  KMT_rear_desc:0 "Наша промышленность в безопасности, и [JAP.GetAdjective] захватчики никогда до нее не доберутся!\n\n§RЭтот национальный дух исчезнет, как только закончится война с Японией.§!"
  KMT_lure_them_in:0 "Стратегия "Заманить их""
  KMT_lure_them_in_desc:0 "Заманите их, отделите врага от его источника силы!\n\n§RЭтот национальный дух исчезнет, как только закончится война с Японией.§!"
  KMT_lure_them_in_1:0 "Стратегия "Заманить их""
  kmt_dare_to_die_corps_idea:0 "Отряды "Отвага умереть""
  kmt_dare_to_die_corps_idea_desc:0 "Наши храбрые солдаты готовы пожертвовать своими жизнями ради безопасности нашей страны!"
  kmt_national_treasure_ransacked:0 "Утрата национальных сокровищ"
  kmt_defend_the_treasures:0 "Защитите национальные сокровища!"
  kmt_planning_the_civil_war:0 "Планирование гражданской войны"
  kmt_planning_the_civil_war_desc:0 "[PRC.getNameDefCap] не хочет, чтобы кто-то выиграл от грядущей гражданской войны в Китае; это внутреннее дело китайцев."

  KMT_chinese_matter:0 "Внутреннее дело Китая"

  KMT_harsh_takeover:0 "Жестокое подчинение"
  KMT_harsh_takeover_desc:0 "Война разрушила промышленность нашей страны, наука пришла в упадок, а люди устали. Мы подвержены иностранному влиянию, как никогда ранее."

  communism_defeated_kmt:0 "Коммунизм побежден"

  KMT_jinyuanquan_inflation:0 "Гиперинфляция"
  KMT_jinyuanquan_inflation_desc:0 "Наш способ печатания дополнительных Золотых юаней для оплаты коммунистам без дополнительного обеспечения золотом вызвал серьезную инфляцию в нашей экономике! А недовольные граждане и солдаты теперь дезертируют к коммунистам!"

  KMT_corrupted_kmt:0 "Укрепленная воля"
  KMT_corrupted_kmt_desc:0 "Коррумпированные чиновники нашего врага укрепили волю наших товарищей сломать их гнилую структуру!"

  KMT_aid_to_xsm:0 "Помощь от Китая"
  KMT_aid_to_xsm_desc:0 "В нашей борьбе против коммунистической угрозы мы едины!"

  KMT_retreat_to_taiwan_idea:0 "Отступление на Тайвань!"

  KMT_warlord_cliques_pre_war:0 "Клики военачальников"
  KMT_warlord_cliques_pre_war_desc:0 "Несколько разрозненных клик военачальников по всему Китаю ослабили центральное правительство."

  KMT_warlord_cliques_war:0 "Армии военачальников"
  KMT_warlord_cliques_war_desc:0 "Хотя армии военачальников и были интегрированы с нашими, но они верны только своему хозяину."
  KMT_effective_integration:0 "Эффективная интеграция"
  KMT_effective_integration_desc:0 "Плавная и эффективная интеграция сил военачальника даёт нам больший контроль над войсками и позволяет быстрее принимать решения."
  KMT_focus_on_own_army:0 "Сфокусироваться на Центральной армии"
  KMT_focus_on_own_army_desc:0 "Армии военачальников слишком плохо оснащены и недисциплинированы; нам следует полагаться на нашу Центральную армию больше, чем на их, чтобы не тратить впустую необходимые средства."
  KMT_sino_german_joint_research:0 "Совместное китайско-германское военное исследование"
  KMT_science_funding:0 "Academia Sinica"
  KMT_science_funding_desc:0 "Первый исследовательский институт с государственным финансированием, напрямую подчиняющийся Исполнительному Юаню."
  public_iliteracy:0 "Неграмотность населения"
  public_iliteracy_desc:0 "После многих лет потрясений и гражданской войны китайская система образования лежит в руинах."
  KMT_national_institute_ns:0 "Убежище для евреев"
  KMT_national_institute_ns_desc:0 "Многие еврейские беженцы помогают нашей промышленности и исследованиям в знак благодарности за их спасение."
  incompetent_industry_fake:0 "Некомпетентная промышленность"
  incompetent_industry_fake_desc:0 "Молодая и неопытная промышленность Китая не готова к грядущей буре.\n\n§YИсследуйте промышленные технологии и стройте больше фабрик, чтобы снизить штраф§!"
  incompetent_industry_fake_navy:0 "Некомпетентная военно-морская промышленность"
  incompetent_industry_fake_navy_desc:0 "Китай всегда был сухопутной державой. Сильный флот так и остался несбыточной мечтой.\n\n§YИсследуйте промышленные технологии и постройте больше фабрик, чтобы снизить штраф§!"
  KMT_weak_army:0 "Некомпетентная армия"
  KMT_weak_army_desc:0 "NRA состоит из плохо обученных солдат и некомпетентных командиров.\n\n§YИспользуйте решения, чтобы решить проблему неорганизованности NRA§!"
  KMT_chennault:0 "Авиационный советник США"
  KMT_chennault_desc:0 "С отставным лётчиком армейского авиакорпуса США Клэйром Ли Шенно в качестве авиационного советника наши военно-воздушные силы будут лучше выступать на поле боя."
  KMT_the_flying_tigers_idea:0 "Летающие тигры"
  KMT_the_flying_tigers_idea_desc:0 "[USA.GetAdjective] пилоты помогают нашему делу и сражаются плечом к плечу с нашими пилотами."
  KMT_tft:0 "Летающие тигры"
  KMT_tft_desc:0 "[USA.GetAdjective] пилоты помогают нашему делу и сражаются плечом к плечу с нашими пилотами."
  KMT_sichuan_famine_no_aid:0 "Голод в Сычуане"
  KMT_sichuan_famine_no_aid_desc:0 "Народ теряет доверие к правительству из-за его игнорирования их проблем."
  KMT_sichuan_famine_aid:0 "Борьба с голодом"
  KMT_sichuan_famine_aid_desc:0 "Перераспределение средств на борьбу с голодом улучшило имидж правительства."
  KMT_corrupted_government:0 "Коррумпированная экономика"
  KMT_continue_the_national_revolution:0 "Продолжить национальную революцию"
  KMT_fight_for_survival:0 "Борьба за выживание"
  KMT_sino_german_joint_research_ger_adv:0 "Китайско-немецкие совместные военные исследования"
  KMT_aggresion:0 "Агрессия"
  navy_air_est:0 "Создание морской авиационной базы"
  cg_warlords:0 "Военачальник"
  KMT_student_soldiers:0 "Принудительный призыв"
  KMT_treasure_abroad_idea:0 "Артефакты отправлены за границу"
  KMT_wai_chingkuo:0 "Чан Кайши"
  CHI_technological_cooperation_idea:0 "Технологическое сотрудничество"
  CHI_technological_cooperation_idea_desc:0 "Нам есть чему поучиться у наших братьев по оружию"
  MAN_manchukuo_imperial_navy:0 "Имперский флот Маньчжоу-Го"
  MAN_manchukuo_imperial_navy_desc:0 ""
  MAN_new_imperial_chinese_navy:0 "Новый Имперский Китайский флот"
  MAN_new_imperial_chinese_navy_desc:0 ""
  MAN_manchukuo_imperial_army:0 "Имперская армия Маньчжоу-Го"
  MAN_manchukuo_imperial_army_desc:0 ""
  KMT_internal_stability:0 "Приоритет внутренней стабильности"
  KMT_internal_stability_desc:0 "Японцы как болезнь кожи, а коммунистические бандиты как болезнь сердца. Чтобы спасти Китай, мы сначала должны очистить его от всех предателей"
  KMT_SHX_offer:0 "Предложение Шаньси"
  KMT_SHX_offer_desc:0 "Феодальное владение Яня отказывает нам в военном доступе. Если мы силой подчиним его, то сможем окружить коммунистов и разгромить их раз и навсегда"
  KMT_preparation:0 "Борьба с коммунизмом"
  KMT_preparation_desc:0 "После почти полного уничтожения во время Великого похода коммунистические бандиты скрываются в регионе Шэньси. Мы должны атаковать, пока они не оправились!"

  KMT_strike_PRC:0 "Удар по коммунистическим бандитам"
  KMT_strike_PRC_desc:0 "Бандиты еще не оправились после Великого похода. Мы должны нанести удар, когда они слабы!"

  KMT_warlord:0 "Объединить Китай"
  KMT_warlord_desc:0 "Теперь, когда мы уничтожили коммунистических бандитов, пришло время военным главарям испытать на себе меч. Они слишком долго грабили народ. Мы должны завершить Национальную революцию!"

  KMT_deal_with_SIK:0 "Синьцзянская проблема"
  KMT_deal_with_SIK_desc:0 "Синьцзян является неотъемлемой частью Китая; местный губернатор оказался сепаратистом. Мы требуем их быстрой и немедленной капитуляции; если этот ультиматум не сработает, наших военных должно хватить, чтобы они сдались."

  KMT_external_defense:0 "Сфокусироваться на внешней угрозе"
  KMT_external_defense_desc:0 "Хотя коммунисты представляют серьезную угрозу, Япония может уничтожить всю китайскую нацию. Их не удовлетворит Маньчжурия. Когда-нибудь они попытаются захватить и остальной Китай. Мы должны сделать все возможное, чтобы подготовиться к буре."

  KMT_fortify_land:0 "Построить линию Сунь Ят-сена"
  KMT_fortify_land_desc:0 "После того как японцы разведали территорию вокруг Пекина, их намерения стали понятны. Мы должны укрепить наши границы. Мы не отдадим им ни дюйма священной китайской земли!"

  KMT_fortify_coast:0 "Центральные укрепления"
  KMT_fortify_coast_desc:0 "Учитывая контроль Японии над морями, они, несомненно, начнут прибрежные вторжения в случае войны. Мы должны подготовиться, пока можем. Мы не отдадим Париж Востока без боя!"
  KMT_national_def_propaganda:0 "Пропаганда национальной обороны"
  KMT_national_def_propaganda_desc:0 "Чтобы защитить себя от японской угрозы, мы должны объединить китайский народ. Хотя мы ненавидим и коммунистических бандитов, и полевых командиров, каждый мужчина, женщина и ребенок должны быть готовы сражаться и умереть вместе в защиту Китая."
  KMT_tibet_march:0 "Требуйте Тибет"
  KMT_tibet_march_desc:0 "Тибет имеет решающее значение для обороны Китая и будущего расширения. Однако с момента революции 1911 года регион находится в независимости от Китая. Мы должны исправить эту ошибку."
  KMT_tibet_friend:0 "Подружитесь с Тибетом"
  KMT_tibet_friend_desc:0 "Тибет имеет решающее значение для обороны Китая и будущего расширения. Однако Тибет обрел независимость после революции 1911 года. Мы должны объединиться с Далай-ламой и обезопасить свои фланги."
  KMT_redraw_mcmahon:0 "Перерисуйте линию МакМагона"
  KMT_redraw_mcmahon_desc:0 "Тибет согласился на позорное соглашение в Шимле, которое перечертило его границу с Индией. Мы должны убедиться, что эта линия перерисована в нашу пользу."
  KMT_industrial_effort:0 "Инвестируйте в промышленность"
  KMT_industrial_effort_desc:0 "Китайская промышленность всегда отставала от Запада и Японии. Чтобы сохранить нашу независимость, мы должны увеличить наши промышленные показатели. Мы также можем разрешить иностранным компаниям инвестировать в нашу промышленность"
  KMT_armament_effort:0 "Восстановить Арсенал Цзяннань"
  KMT_armament_effort_desc:0 "Арсенал Цзяннань предоставлял армии династии Цин самое современное оружие. Мы должны взять на вооружение это название для создания военно-промышленного комплекса, который может стать ядром для нашей растущей оружейной промышленности"
  KMT_gain_control_of_the_sea:0 "Расширить ВМС"
  KMT_gain_control_of_the_sea_desc:0 "Мы давно потеряли свое военно-морское превосходство, потерпев поражение в битве у реки Ялу. В то время как японские ВМС угрожают нашей торговле, мы должны стараться защищать наши торговые суда в открытом море"
  KMT_the_big_rear_concept:0 "Концепция Большого Заднего Фронта"
  KMT_the_big_rear_concept_desc:0 "В то время как война идет на востоке Китая, запад остается относительно безопасным. Мы должны попытаться развить эти прифронтовые районы, чтобы они также могли вносить свой вклад в борьбу Китая"
  KMT_increase_funding_of_german_weaponary:0 "Принять вооружение немецкого образца"
  KMT_increase_funding_of_german_weaponary_desc:0 "Хотя у нас есть поддержка немецких советников, таких как фон Фалькенхаузен, и мы импортируем некоторые немецкие разработки, наше локальное производство ужасного качества. Использование немецкого вооружения в качестве образцов в нашем производственном процессе может повысить его качество во много раз!"
  KMT_lure_them_in_strategy:0 "Стратегия «Заманить их внутрь»"
  KMT_lure_them_in_strategy_desc:0 "Благодаря обширной территории и суровому рельефу нашей страны, мы можем позволить себе отступать и заманивать захватчиков на выбранные нами поля сражений. Пусть империалисты попробуют нас преследовать! Их поджидает засада за каждым углом и ловушка на каждом шагу!"
  KMT_reuse_captured_weaponary:0 "Использование трофейного вооружения"
  KMT_reuse_captured_weaponary_desc:0 "Чтобы выдержать затяжную войну на истощение, нам крайне важно использовать технику, захваченную нами в бою, в полном объеме, дабы поддерживать силу нашей армии."
  KMT_air_base_expansion:0 "Расширение сети авиабаз"
  KMT_air_base_expansion_desc:0 "Нам нужны аэродромы, чтобы наши самолеты могли взлетать и садиться, иначе они будут просто экспонатами на складе."
  KMT_national_resources_commission:0 "Национальная комиссия по ресурсам"
  KMT_national_resources_commission_desc:0 "Национальная комиссия по ресурсам (NRC) является институтом, ответственным за разведку и добычу полезных ископаемых в Китае. Ее создание значительно увеличит наши усилия по добыче природных ресурсов."
  KMT_national_defense_council:0 "Национальный совет обороны"
  KMT_national_defense_council_desc:0 "В условиях, когда японцы и коммунистические бандиты вредят нашей стране, мы должны найти способ организовать свою оборону против них. Нам также следует попытаться импортировать современную технику из-за рубежа."
  KMT_revive_jiangnan_shipyard:0 "Расширение судостроительной группы Jiangnan"
  KMT_revive_jiangnan_shipyard_desc:0 "Необходимо расширить возможности завода Jiangnan Arsenal по строительству кораблей; это даст нам сильный флот для противостояния будущим угрозам."
  KMT_revive_hanyang_armory:0 "Возобновить производство Hanyang Arsenal"
  KMT_revive_hanyang_armory_desc:0 "Завод Hanyang Arsenal был одним из важнейших и самых успешных оружейных заводов в ходе движения за самоусиление, начатого чиновниками династии Цин. Мы можем восстановить его производство, чтобы поставлять армии современную технику."
  KMT_air_effort:0 "Реорганизовать ВВС Китайской Республики"
  KMT_air_effort_desc:0 "Мы всегда пренебрегали нашими ВВС. Если мы хотим усилить наши ВВС, необходимо серьезно их реформировать."
  KMT_air_reform:0 "Летящие тигры"
  KMT_air_reform_desc:0 "Признавая справедливость нашего дела, группа американских пилотов добровольно присоединилась к нашим ВВС. Мы должны использовать этих хорошо обученных людей в качестве элитного ядра новых и модернизированных ВВС."
  KMT_study_foreign_ship:0 "Изучить зарубежное судостроение"
  KMT_study_foreign_ship_desc:0 "Мы отстаем от других стран в области судостроения. Чтобы построить первоклассный флот, мы должны изучить то, что делает их корабли превосходными."
  KMT_demand_taiwan:0 "Требовать Тайвань"
  KMT_demand_taiwan_desc:0 "Народ Тайваня должен быть освобожден от его нынешнего правителя и возвращен нам. Нация должна воссоединиться после долгого разделения."
  KMT_taiwan_fleet_hub:0 "Штаб Тайваньского флота"
  KMT_taiwan_fleet_hub_desc:0 "Иностранцы оставили на Тайване значительную инфраструктуру. Мы должны расширить эту базу, чтобы превратить весь остров в военно-морскую базу и производственный центр."
  KMT_pacific_fleet:0 "Прорвать Первую островную цепь"
  KMT_pacific_fleet_desc:0 "Чтобы Китаю раскрыть весь свой потенциал, мы не должны останавливаться по эту сторону Тихого океана. Мы должны построить флот, способный проплыть мимо Тайваня и Японии."
  KMT_sea_fleet:0 "Начертить линию девяти пунктиров"
  KMT_sea_fleet_desc:0 "Южно-Китайское море содержит множество важнейших торговых путей. Если мы захватим этот проход, то сможем двигаться к доминированию в Юго-Восточной Азии. Однако у нас должен быть флот, способный поддержать наши претензии и утопить всю враждебную торговлю."
  KMT_naval_equipment:0 "Морское оборудование"
  KMT_naval_equipment_desc:0 "Современный флот нуждается в современном оборудовании."
  KMT_pacific_expansion:0 "Прорвать Вторую островную цепь"
  KMT_pacific_expansion_desc:0 "Теперь, когда у нас есть флот, способный перенести войну за пределы Японии, мы должны построить флот, который заставит любую нацию в Тихом океане почувствовать гнев Китая. Мы должны сделать Чжэн Хэ гордым."
  KMT_sea_expansion:0 "Обеспечить соблюдение линии девяти пунктиров"
  KMT_sea_expansion_desc:0 "Похоже, что заявления о наших претензиях на Южно-Китайское море недостаточно. Мы должны продолжить расширение нашего флота, чтобы мы могли заставить империалистов насильно увидеть справедливость нашего дела!"
  KMT_modernize_army:0 "Модернизировать армию"
  KMT_modernize_army_desc:0 "Духа и умения недостаточно, чтобы победить в войне. Нам также необходимо современное оборудование."
  KMT_north_plan:0 "Вернуть Маньчжурию"
  KMT_north_plan_desc:0 "Дунбэй, называемая маньчжурами западниками, была захвачена японцами и их марионетками всего несколько лет назад. Мы должны вернуть ее!"
  KMT_pioneering_the_north_east:0 "Основать Северо-Восточное агентство развития"
  KMT_pioneering_the_north_east_desc:0 "Хотя японцы развивали части Маньчжурии, обширные участки земли остаются нетронутыми. Мы должны начать масштабную работу по внедрению этих когда-то варварских земель в современный мир."
  KMT_science_effort:0 "Academia Sinica"
  KMT_science_effort_desc:0 "Основанная в 1928 году, Academia Sinica курирует и координирует научные, общественные науки и гуманитарные исследования во всех исследовательских институтах и ​​университетах, спонсируемых государством Китайской Республики. В отличие от других спонсируемых правительством исследовательских институтов, Academia Sinica напрямую подчиняется президенту."
  KMT_extra_research_slot:0 "Расширить Пекинский университет"
  KMT_extra_research_slot_desc:0 "Пекинский университет - это учреждение мирового уровня. Мы должны выделить ему больше финансирования и предоставить стипендии талантливой молодежи, чтобы воспитать поколение квалифицированных ученых и лидеров."
  KMT_national_institute:0 "Убежище для евреев"
  KMT_national_institute_desc:0 "Многие евреи начали селиться в Шанхае после преследований и смерти в Европе. Мы должны открыть наши границы для всех еврейских беженцев, чтобы мы могли извлечь выгоду из их опыта. Уже еврейские инженеры принесли нам польские и немецкие конструкции оружия. Что еще они могут сделать для своих новых покровителей?"
  KMT_military_science:0 "Военная наука"
  KMT_military_science_desc:0 "Как гражданская наука, так и военная наука имеют решающее значение для укрепления нации. Разумное финансирование науки сделает нашу армию более грозной."
  KMT_ballistic_weapon:0 "Реактивная система «Гуаньди»"
  KMT_ballistic_weapon_desc:0 "Настал рассвет применения ракет в войне. Мы должны принять эту новую систему вооружения, если наши армии хотят выжить на современном поле боя. Пусть наши враги почувствуют ярость бога войны!"
  KMT_electronics_research:0 "Национализировать электронную компанию"
  KMT_electronics_research_desc:0 "Хотя электричество еще не дошло до сельской местности, наши ученые уже вовсю работают над выпуском отечественной электронной продукции для рынков Шанхая и Гонконга. Мы должны взять под контроль Чэн-гун и использовать его для государственных исследований."
  KMT_extra_research_slot_2:0 "Образование для нации"
  KMT_extra_research_slot_2_desc:0 "Недостаточно позволять только тем, кто может себе это позволить, получить высшее образование. Мы должны национализировать все университеты Китая и основывать поступление на способностях, а не на богатстве."
  KMT_bold_hypothesis:0 "Смелая гипотеза"
  KMT_bold_hypothesis_desc:0 "У наших ученых сложился комплекс неполноценности, из-за которого они полагают, что никогда не превзойдут Запад, что бы они ни делали. Необходимо начать пропагандистскую кампанию для восстановления их боевого духа."

  KMT_nuclear_physics:0 "Ядерная физика"
  KMT_nuclear_physics_desc:0 "Если теории Эйнштейна верны, расщепление атома может дать невообразимо мощное оружие. Нам следует углубленно изучить эту возможность."

  KMT_jet:0 "Реактивный двигатель «Тяньлун»"
  KMT_jet_desc:0 "Разработка реактивной технологии обеспечит нам превосходство в небе. Эпоха, когда китайские солдаты на передовой были подвержены атакам с воздуха, наконец закончится. Наша мощь будет расти, как летящий дракон."

  KMT_fighter_focus:0 "Бойцы в приоритете"
  KMT_fighter_focus_desc:0 "В воздушном бою наше первостепенное внимание уделено превосходству в воздухе, а бойцы — именно те, кто делает эту работу."

  KMT_bomber_focus:0 "Бомбардировщики в приоритете"
  KMT_bomber_focus_desc:0 "Уничтожение линий снабжения и заводов противника — наилучший способ ведения воздушной войны. Следовательно, нам следует придерживаться стратегии бомбардировок."

  KMT_cas_effort:0 "Усилия CAS"
  KMT_cas_effort_desc:0 "Ближняя авиационная поддержка крайне важна для продвижения нашей армии по земле. Именно эти истребители поддержки выиграют для нас войну."

  KMT_nav_effort:0 "Усилия NAV"
  KMT_nav_effort_desc:0 "Торпедоносцы отлично справляются с уничтожением вражеских кораблей и портов, и они являются неотъемлемой частью морской войны."

  KMT_political_effort:0 "Национальная реформа"
  KMT_political_effort_desc:0 "Простолюдины мало любят наше правительство; если мы хотим выжить, то должны начать искоренять коррупцию."

  KMT_government_reform:0 "Переосмысление республики"
  KMT_government_reform_desc:0 "Наша нынешняя форма правления нежелательна, мы должны найти другой путь."

  KMT_strengthen_the_republic:0 "Укрепить республику"
  KMT_strengthen_the_republic_desc:0 "Наши граждане довольны республикой. Мы должны хранить верность заветам Сунь Ятсена, чтобы усилить их доверие."

  KMT_democratic_republic:0 "Завершить наставничество народа"
  KMT_democratic_republic_desc:0 "Наши граждане теперь готовы к демократии. Согласно заветам Сунь Ятсена мы должны завершить эру однопартийного правления и провести выборы, как только мы должным образом подготовимся к ним."

  CHI_open_the_new_parties:0 "Открыть новые партии"
  CHI_open_the_new_parties_desc:0 ""

  CHI_accept_capitalism:0 "Принять капитализм"
  CHI_accept_capitalism_desc:0 ""

  KMT_unitary_semi_presidential_republic:0 "Продолжить наставничество народа"
  KMT_unitary_semi_presidential_republic_desc:0 "Хотя мы добились значительного прогресса, люди все еще не готовы к демократии. Гоминьдан должен продолжить наставлять их."

  CHI_overclaim_of_factions:0 "Излишние претензии фракций"
  CHI_overclaim_of_factions_desc:0 ""

  KMT_promote_nationalism:0 "Возродить Движение новой жизни"
  KMT_promote_nationalism_desc:0 "Нашу нацию долгое время дразнили из-за ее слабости и неспособности. Мы должны продолжить наши ранние усилия по созданию националистического гражданства, чтобы снова сделать Китай великим."
  KMT_centralizing_power:0 "Централизация власти"
  KMT_centralizing_power_desc:0 "Этап народной опеки постепенно позволяет нам централизовать всю власть, как местную, так и региональную, в руках центрального правительства. Мы не должны повторять ошибки 1912 и 1916 годов. В едином Китае не может быть федерализма."
  KMT_into_despotism:0 "Объявить военное положение"
  KMT_into_despotism_desc:0 "По указу Чан Кайши Китай не будет следовать демократии, фашизму или коммунизму. Китай будет следовать за Гоминьданом, поскольку мы ведем срединное царство в будущее. Наши враги называют это деспотией. Мы называем это прогрессом."
  KMT_social_experiment:0 "Расширение государственной лаборатории"
  KMT_social_experiment_desc:0 "Чтобы продвинуть технологические возможности нашей нации, мы должны расширить нашу государственную лабораторию и нанять больше ученых."
  KMT_voting_rights:0 "Новая конституция"
  KMT_voting_rights_desc:0 "Нынешняя конституция недостаточна для предотвращения тирании и коррупции. Чтобы полностью перейти к демократической республике, мы должны написать новую конституцию. Мы должны закрепить право голоса, право на свободу и систему сдержек и противовесов. Китай должен стать страной законов, а не страной людей."
  KMT_implement_parliamentary_system:0 "Движение за восстановление села"
  KMT_implement_parliamentary_system_desc:0 "База коммунистов — недовольное крестьянство. Чтобы демократия в Китае выжила, мы должны разрушить базу поддержки коммунистов, улучшив жизнь крестьян. Мы должны разделить поместья помещиков, внедрить новые сельскохозяйственные технологии, построить школы и обеспечить медицинское обслуживание. Пришло время Китаю начать заботиться о своем народе."
  KMT_universal_sufferage:0 "Три принципа народа"
  KMT_universal_sufferage_desc:0 "Центральное место в учении Сунь Ятсена занимают три принципа народа: демократия, национализм и благосостояние народа. В прошлом мы достигли только национализма, но теперь мы идем к тому, чтобы окончательно достичь мечты Суня."
  KMT_european_friend:0 "Присоединиться к Союзникам"
  KMT_european_friend_desc:0 "На Западе демократия гораздо более устоявшаяся, чем в Китае. Мы должны присоединиться к блоку западных демократий, чтобы учиться на их примере и укрепить коалицию свободных народов."
  KMT_alone_in_the_east:0 "Первая демократия в Азии"
  KMT_alone_in_the_east_desc:0 "Западные демократии ввергнуты в хаос. Если мы присоединимся к ним сейчас, это разрушит нашу новую и хрупкую республику. Мы должны стоять одни в Азии, как свет свободы на Востоке."
  KMT_knowledge_of_the_citizens:0 "Воспитывать в гражданственности"
  KMT_knowledge_of_the_citizens_desc:0 "В прошлом образование было недоступно для многих людей. Мы расширим национальную школьную систему учебной программой, которая ставит целью создать граждан, а не подданных."

  KMT_westernization:0 "Вестернизация"
  KMT_westernization_desc:0 "Знания западного мира превосходят наше воображение; усвоение их знаний потребует всей кампании."

  KMT_fascism_focus:0 "Даёшь власть Голуборубашечникам"
  KMT_fascism_focus_desc:0 "Сила, проявленная Германским Рейхом, очень интригует. Наша нация должна следовать его пути к славе. Мы должны поддержать тех, кто проявил огромную страсть к нашей стране."

  KMT_militarism_focus:0 "Национальная военная индоктринация"
  KMT_militarism_focus_desc:0 "Люди говорят: «Не используй хорошее железо, чтобы делать гвозди, не используй хороших людей, чтобы делать солдат». Такое пренебрежение к армии недопустимо. Мы должны повысить престиж служб в глазах народа."

  KMT_ban_communism:0 "Возрождение Белого террора"
  KMT_ban_communism_desc:0 "Мы не можем рисковать, что коммунистические ячейки проникнут на территорию, находящуюся под нашим контролем, чтобы начать восстание. Мы должны возобновить гражданские и военные чистки, чтобы не осталось и следа коммунизма в нашем домене."

  KMT_planning_our_empire:0 "Восстановление империи"
  KMT_planning_our_empire_desc:0 "Китай был самой могущественной нацией на лице Земли большую часть цивилизованной истории. Мы должны вернуть себе место под солнцем."

  KMT_isolation_tactic:0 "Антисоветская тактика изоляции"
  KMT_isolation_tactic_desc:0 "По мере распространения Коминтерна в Центральной Азии Красная угроза медленно окружает нас. Мы должны посеять недоверие в их системе союзов, чтобы восстановить старые границы."
  KMT_war_propaganda:0 "Военная пропаганда"
  KMT_war_propaganda_desc:0 "Промывание мозгов нашему народу о пользе войны и победы - отличный способ объединить наш народ и создать сильную армию."
  KMT_military_first:0 "Армия прежде всего"
  KMT_military_first_desc:0 "«Информирование» нашего народа о преимуществах войны и экспансии обеспечит нам возможность убивать монстров за рубежом."
  KMT_war_fanaticism:0 "Военный фанатизм"
  KMT_war_fanaticism_desc:0 "Недостаточно сражаться и умирать. Мы должны сражаться и побеждать любой ценой. Пусть наша кровь снова сделает Китай центром мира! Чжунго ваньсуй!"
  KMT_claim_territory:0 "Требования системы дани"
  KMT_claim_territory_desc:0 "Мы потеряли и нашу землю, и наших вассалов из-за империалистов. Учитывая, что вассалы формально станут вассалами престола, мы можем претендовать на многие места в Восточной Азии."
  KMT_demand_soviet_puppets:0 "Требование о Центральной степи и Синьцзяне"
  KMT_demand_soviet_puppets_desc:0 "Территориальные споры не обязательно должны заканчиваться кровавыми войнами; дипломатические методы - жизнеспособные варианты, если они готовы идти на компромисс."
  KMT_demand_indochina:0 "Требование о Индокитае"
  KMT_demand_indochina_desc:0 "Территориальные споры не обязательно должны заканчиваться кровавыми войнами; дипломатические методы - жизнеспособные варианты, если они готовы идти на компромисс."
  KMT_special_force_training:0 "SACO"
  KMT_special_force_training_desc:0 "Организация китайско-американского сотрудничества предоставляет нашей армии разведподдержку и проводит подготовку подразделений специального назначения."
  KMT_improve_burma_road:0 "Улучшение Бирманского пути"
  KMT_improve_burma_road_desc:0 "Хотя британцы и построили Бирманский путь для помощи в войне против Японии, эта дорога не столь эффективна. Нам стоит улучшить ее."
  KMT_trade_port_neutral:0 "Отмена неравноправных договоров"
  KMT_trade_port_neutral_desc:0 "Из-за множества неравноправных договоров, подписанных некомпетентной династией Цин с западными государствами, часть наших земель все еще находится в чужих руках. Мы должны объединить наш народ под одним знаменем!"
  KMT_trade_port_demo:0 "Торговые порты для помощи"
  KMT_trade_port_demo_desc:0 "Поскольку западные государства и наше государство являются демократическими, мы должны помогать друг другу, когда настают тяжелые времена. Однако такая помощь будет иметь цену за унижение, которое они причинили нам, когда мы были слабы."
  KMT_trade_port_fascism:0 "Китайские порты"
  KMT_trade_port_fascism_desc:0 "Передача торговых портов по неравноправным договорам - это настоящее унижение для китайцев, поскольку западные государства ограничивают нашу торговлю и делят наши земли. Мы должны вернуть эти земли и сделать Китай великим снова!"
  KMT_industrialization_NW:0 "Локальная индустриализация: Северо-Запад"
  KMT_industrialization_NW_desc:0 "Северо-западный регион может сейчас казаться пустошью, но вскоре он станет одним из самых индустриально развитых районов."
  KMT_excavation_NW:0 "Раскопки на северо-западе"
  KMT_excavation_NW_desc:0 "Мы должны искать больше ресурсов в нашей стране, чтобы стать независимыми от импортных ресурсов."
  KMT_industrialization_S:0 "Локальная индустриализация: Юг"
  KMT_industrialization_S_desc:0 "Юг может быть одним из самых индустриализованных районов, но его можно значительно улучшить."
  KMT_excavation_S:0 "Резиновые плантации"
  KMT_excavation_S_desc:0 "Климат на юге очень подходит для каучуковых плантаций; мы должны этим воспользоваться."
  KMT_excavation_NE:0 "Разведка на северо-востоке"
  KMT_excavation_NE_desc:0 "Японцы оставили много инструментов в этом районе; мы можем использовать их, чтобы обнаружить новые ресурсы."
  KMT_ledo_road:0 "Ледо Роуд"
  KMT_ledo_road_desc:0 "Захватчики перекрыли Бирманский путь; мы должны построить еще одну дорогу из Индии для поставок."
  KMT_dare_to_die_corps:0 "Корпус “Смерть или победа”"
  KMT_dare_to_die_corps_desc:0 "Если мы хотим выиграть войну против захватчиков, наш народ должен быть достаточно храбрым, чтобы не бояться смерти."
  KMT_cbis:0 "Расширение ЦБР"
  KMT_cbis_desc:0 "Центральное бюро расследований и статистики - это разведывательное подразделение Гоминьдана. Недавно мы его реорганизовали и должны стремиться расширить его операции, чтобы гарантировать, что внутренние китайские подрывные элементы не подвергнут режим опасности.
  KMT_zhonghua_minzu:0 "Чжунхуа Миньцзу"
  KMT_zhonghua_minzu_desc:0 "Наш принцип \"Пять рас в одном союзе\" представляет ханьцев и все меньшинства Китая. Все они являются потомками одного и того же основателя Китая. Вместе мы сможем восстановить величие нашей нации и почтить память наших предков."
  KMT_cement_control_on_the_economy:0 "Цементный контроль экономики"
  KMT_cement_control_on_the_economy_desc:0 "Мы можем выступать против коммунистов, но это не значит, что мы должны преклонять колени перед капиталистами. Мы должны убедиться, что экономика и те, кто ею управляют, лояльны к правительству Гоминьдана, сосредоточившись в основном на государственных предприятиях."
  KMT_georgist_tax_reform:0 "Джорджистская налоговая реформа"
  KMT_georgist_tax_reform_desc:0 "Джорджизм служит основой многих экономических теорий Сунь Ят-сена. Одним из его основных аспектов является создание налога на удерживаемую землю, которую он считал \"единственным способом поддержать правительство, бесконечно справедливым, разумным и справедливо распределенным налогом, на котором мы должны основать нашу новую систему.\""
  KMT_monetary_reform:0 "Денежная реформа"
  KMT_monetary_reform_desc:0 "Гиперинфляция разрушает нашу экономику. Нам нужно немедленно взять ситуацию под контроль."
  KMT_preemptive_preparation:0 "Подготовка к гражданской войне"
  KMT_preemptive_preparation_desc:0 "Возникает необходимость в подготовке к действиям коммунистов, так как они тоже могут готовиться к нам."
  KMT_warlord_after_civil_war:0 "Объединить Китай"
  KMT_warlord_after_civil_war_desc:0 "Теперь, когда мы уничтожили бандитов-коммунистов, пришло время военачальникам встретиться с мечом."

  KMT_the_yangtze_partition:0 "Предложить раздел Янцзы"
  KMT_the_yangtze_partition_desc:0 "Война складывается не в нашу пользу, и мы проигрываем ее с большими потерями. Принимая во внимание [PRC.getAdjective] невозможность пересечь наши оборонительные линии на реке Янцзы, мы можем обратиться за дипломатическим решением этой трудной Гражданской войны, если хотим выжить и сохранить наши измученные войска."

  KMT_taiwan_bastion:0 "Бастион Тайваня"
  KMT_taiwan_bastion_desc:0 "Есть вероятность, что мы можем проиграть эту войну. Чтобы подготовиться к такому исходу, мы должны превратить Тайвань в национальный бастион, где мы сможем ждать и готовиться к отвоеванию материка."

  KMT_north_west_insurgence:0 "Восстание на северо-западе"
  KMT_north_west_insurgence_desc:0 "Люди на северо-западе недовольны коммунистами; мы можем использовать их недовольство, чтобы создать еще один фронт для коммунистов."

  KMT_placate_former_puppet_government:0 "Сотрудничать с коллаборационистами"
  KMT_placate_former_puppet_government_desc:0 "Бывшие японские марионетки - все предатели, и все это знают. Но после ухода японцев они могут служить новым хозяевам."

  KMT_harsh_takeover_focus:0 "Схватить Ханьцзяня"
  KMT_harsh_takeover_focus_desc:0 "Не нужно быть вежливым с предателями. Мы арестуем их всех и распорядимся их ресурсами по своему усмотрению."

  KMT_development_of_taiwan:0 "Развить Тайвань"
  KMT_development_of_taiwan_desc:0 "Японцы уделяли Тайваню много внимания. Учитывая, что тайваньская экономическая база значительно выше, чем у остального Китая, было бы разумно развивать ее и далее, чтобы она могла служить моделью компетентности нашего управления."

  KMT_incorporate_warlord_forces:0 "Интеграция войск полевых командиров"
  KMT_incorporate_warlord_forces_desc:0 "Как центральная армия, так и силы полевых командиров составляют нашу нынешнюю армию. Однако силы полевых командиров не очень послушны нашему командованию. Мы будем иметь более эффективную армию, если каким-то образом завоюем их доверие."

  KMT_focus_on_our_own_army:0 "Сосредоточение внимания на Центральной армии"
  KMT_focus_on_our_own_army_desc:0 "Нисчемные войска полевых командиров не заслуживают нашего внимания. Их можно использовать только как пушечное мясо и наживку, в то время как наша Центральная армия наносит удар по нашим врагам."

  KMT_increase_sino_german_cooperation:0 "Увеличение китайско-германского сотрудничества"
  KMT_increase_sino_german_cooperation_desc:0 "Мы должны больше сотрудничать с Германией. Таким образом, у нас будет лучшее преимущество перед нашими врагами."

  KMT_support_pro_japanese_faction:0 "Поддержка прояпонской фракции"
  KMT_support_pro_japanese_faction_desc:0 "Может быть, вместо того, чтобы противостоять японцам, мы можем найти более мирное решение?"

  KMT_re_elaborate_hakko_ichiu:0 "Предложить китайско-японский союз"
  KMT_re_elaborate_hakko_ichiu_desc:0 "Чтобы создать настоящую \"Сферу Совместного Процветания в Большой Восточной Азии\", нам необходимо добиться союза с японцами. Передовые индустриальные силы, несомненно, дадут нам преимущество перед нашими врагами."
  KMT_introduce_shipbuilding_technology:0 "Внедрить технологии кораблестроения"
  KMT_introduce_shipbuilding_technology_desc:0 "Благодаря мощным военно-морским производственным мощностям наших друзей мы можем попросить их оказать нам в этом помощь."
  KMT_introduce_shipbuilding_technology_usa:0 "Внедрить технологии кораблестроения"
  KMT_introduce_shipbuilding_technology_usa_desc:0 "Благодаря мощным военно-морским производственным мощностям наших друзей мы можем попросить их оказать нам в этом помощь."
  KMT_force_japan_to_accept_peace:0 "Попросить о вмешательстве Германии"
  KMT_force_japan_to_accept_peace_desc:0 "Учитывая наши теперешние отношения с Германией, мы можем попросить ее вмешаться в нашу текущую войну с японцами."
  KMT_force_japan_to_cede_land:0 "Снова запросить вмешательство Германии"
  KMT_force_japan_to_cede_land_desc:0 "Несмотря на достигнутые мирные соглашения, японцы все еще отказываются возвращать нам земли. Возможно, пришло время снова запросить вмешательства Германии."
  KMT_pincer_soviet:0 "Зажать Советы"
  KMT_pincer_soviet_desc:0 "В данный момент, когда Советы заняты, мы можем ударить туда, где они этого меньше всего ожидают."
  KMT_japanese_advisors:0 "Японские советники"
  KMT_japanese_advisors_desc:0 "Мы можем запросить у наших японских друзей нескольких советников, чтобы они помогли нашей армии.
  KMT_draw_closer_to_the_empire:0 "Улучшить отношения с Соединённым Королевством"
  KMT_draw_closer_to_the_empire_desc:0 "С нашей историей отношений с Британией, мы можем сделать что-то, чтобы улучшить наши отношения, или даже сформировать с ними альянс."
  KMT_trans_pacific_friendship_focus:0 "Транс-Тихоокеанская дружба"
  KMT_trans_pacific_friendship_focus_desc:0 "С нашим нынешним переходом к демократии, мы можем укрепить наши связи с США через Тихий океан."
  KMT_oust_the_colonizers:0 "Изгнать колонизаторов"
  KMT_oust_the_colonizers_desc:0 "Колониализм даже хуже империализма; для этого мы освободим наших азиатских братьев от зла западных колонизаторов!"
  KMT_pursuade_britain:0 "Убедить Британию"
  KMT_pursuade_britain_desc:0 "Японцы в своем желании ресурсов для питания своей военной машины, несомненно, нападут на колонии Британии и Нидерландов в Азии. Зная это, мы можем убедить Британию нанести первый удар. Если это удастся, мы получим могущественного союзника."
  KMT_join_the_axis:0 "Присоединиться к Оси"
  KMT_join_the_axis_desc:0 "Пришло время укрепить наши отношения с нашими немецкими друзьями."
  KMT_continuous_naval_production:0 "Морское производство"
  KMT_continuous_naval_production_desc:0 "Сосредоточив ресурсы на наших верфях и освободив квалифицированных судостроителей от военной службы, мы можем значительно сократить время производства кораблей."
  KMT_continuous_air_production:0 "Воздушное производство"
  KMT_continuous_air_production_desc:0 "Мы можем перестроить нашу авиапромышленность, чтобы исключить потери и оптимизировать производство."

  KMT_continuous_non_factory_construct:0 "Строительное проектирование"
  KMT_continuous_non_factory_construct_desc:0 "В нашей строительной промышленности по-прежнему много слабых мест. Сосредоточившись на этом вопросе, мы можем значительно повысить скорость строительства. К сожалению, производство станков стало значительным узким местом в расширении нашей тяжелой промышленности, поэтому оно не выиграет от усилий в этой области."

  KMT_continuous_reduce_training_time:0 "Армейская подготовка"
  KMT_continuous_reduce_training_time_desc:0 "Создавая специализированные передовые подразделения подготовки в каждой дивизии, мы можем развернуть даже дивизии, которые ранее мы сдерживали для завершения подготовки в тылу."

  KMT_continuous_suppression:0 "Подавление сопротивления"
  KMT_continuous_suppression_desc:0 "Инфильтруя основные группы сопротивления на оккупированных территориях и заставляя их лидеров перейти на нашу сторону, мы можем значительно уменьшить объем ущерба, который они могут нанести."

  KMT_continuous_repair:0 "Ремонт построек"
  KMT_continuous_repair_desc:0 "Мы сформируем специализированные ремонтные бригады из рабочих заводов и строительства и централизованно будем контролировать их развертывание для улучшения восстановления поврежденной инфраструктуры."

  KMT_continuous_tech_share:0 "Обмен технологиями"
  KMT_continuous_tech_share_desc:0 "Мы будем побуждать наши научно-исследовательские институты и университеты наладить связи с аналогичными структурами в странах-союзниках, что даст нам бонус к обмену технологиями."

  KMT_continuous_boost_freedom:0 "Увеличить автономию"
  KMT_continuous_boost_freedom_desc:0 "Реорганизовав колониальную бюрократию и наняв местных администраторов, со временем мы сможем взять на себя управление нашими делами."

  KMT_continuous_restrict_freedom:0 "Подавить подданных"
  KMT_continuous_restrict_freedom_desc:0 "Наши колониальные подданные овладели глупыми идеями о \"самоопределении\" или \"национальной независимости\". Пришло время развеять эти представления."

  KMT_continuous_request_lendlease:0 "Запросить ленд-лиз"
  KMT_continuous_request_lendlease_desc:0 "Наши промышленные мощности не могут быстро заменить технику, потерянную на поле боя. В таких обстоятельствах иностранная помощь жизненно важна для наших военных действий."

  KMT_develop_the_rear:0 "Завершить Большой тыловой план"
  KMT_develop_the_rear_desc:0 "Чем больше земли мы теряем, тем больше мы должны взяться за выполнение Большого тылового плана и завершить его."
  ########################### СОБЫТИЯ ########################
  kmt.1.t:0 "Предложение Шаньси"
  kmt.1.d:0 "Китайское правительство требует нашего подчинения. Они говорят, что если мы будем сопротивляться, то прольется кровь."
  kmt.1.a:0 "Не будет второго шанса! Нам следует подчиниться, прежде чем дело дойдет до крови."
  kmt.1.b:0 "Быть марионеткой лучше, чем полная аннексия."
  kmt.1.c:0 "Никогда!"

  kmt.2.t:0 "Шаньси аннексирован"
  kmt.2.d:0 "Военачальник Шаньси принял наше предложение. Бандиты — следующие."
  kmt.2.a:0 "Теперь, когда их тыл открыт, будет проще разгромить бандитов."

  kmt.3.t:0 "Предложение о марионеточном Шаньси"
  kmt.3.d:0 "Хотя они согласились подчиниться нам, они попросили автономии."
  kmt.3.a:0 "Приемлемое требование; пусть они станут нашим вассалом."
  kmt.3.b:0 "Недопустимо! У нас должен быть абсолютный контроль!"

  kmt.4.t:0 "Шаньси отказался"
  kmt.4.d:0 "Военачальник Шаньси отказался сотрудничать. [Root.GetLeader] не может стерпеть такого унижения центрального правительства. Мы должны разобраться с военачальником Шаньси."
  kmt.4.a:0 "Они пожалеют о своем решении."

  kmt.5.t:0 "Марионетка отвергнута"
  kmt.5.d:0 "Китайское правительство отклонило наше контрпредложение. Они требуют полного контроля над районом. Если мы не подчинится, они могут начать наступление."
  kmt.5.a:0 "У нас недостаточно сил, чтобы сражаться с ними. Мы должны подчиниться."
  kmt.5.b:0 "Мы не подчинится!"
  KMT_can_claim_central_government_tt:0 "Захватить [KMT_central_gov_tag.Capital.GetName] и потребовать передать статус центрального правительства."
  claim_central.2.t:0 "Мы - центральное правительство!"
  claim_central.2.d:0 "[KMT_central_gov_tag.GetName] потерпело поражение, их легитимность иссякла. Теперь мы можем захватить их позицию и провозгласить себя центральным правительством и единственным легитимным правительством Китая."
  claim_central.2.a:0 "Славный день!"
  claim_central.3.t:0 "Узурпация!"
  claim_central.3.d:0 "Коварные мятежники [KMT_central_gov_tag.GetName] решили свергнуть наше правительство и назначить свое, чтобы править Китаем."
  claim_central.3.a:0 "Как они посмели!"
  KMT_central_gov_core_tt:0 "Получить ядра в регионе Китай."
  claim_central.2.b:0 "Перенести столицу в Нанкин."
  claim_central.0.t:0 "Тест"
  claim_central.0.d:0 "Нынешнее центральное правительство - [KMT_central_gov_tag.GetName]"
  claim_central.4.t:0 "Низкая легитимность"
  claim_central.4.d:0 "Мы утратили контроль над большей частью своих провинций, и наши притязания на центральное правительство значительно ослабли."
  claim_central.4.a:0 "Неудачно"
  claim_central.5.t:0 "Легитимность возросла"
  claim_central.5.d:0 "С увеличением количества подконтрольных нам провинций, наши требования как центрального правительства получили общественную поддержку."
  claim_central.5.a:0 "Хорошо"
  claim_central.6.t:0 "Центральное правительство повержено"
  #claim_central.6.d:0 "После поражения центрального правительства от иностранных рук, мы не сможем претендовать на этот пост"
  #claim_central.7.t:0 "Триумф в гражданской войне"
  #claim_central.7.d:0 "После нашей недавней победы в гражданской войне, мы успешно востребовали должность Центрального правительства для себя"
  #claim_central.8.t:0 "Должность центрального правительства смещена"
  #claim_central.8.d:0 "[KMT_central_gov_tag.GetName] одержал победу в недавней гражданской войне и потребовал должность центрального правительства"
  #claim_central.8.a:0 "У нас еще есть шансы"
