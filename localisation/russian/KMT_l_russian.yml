  KMT_r56_lure_them_in_tt_1:0 "§WКаждый§! §Yполностью контролируемый коренной штат§!, §Wкоторый был во владении 1 января 1936 года, который находится восточнее§! §Y[620.GETNAME]§! §Wи южнее§! §Y[608.GETNAME]§!"
  KMT_prc_civil_war_tt:0 "Если вы решите связаться с §Y[PRC.GetNameDef]§! во время инцидента в Сиане для мирных переговоров, и они их §Gпримут§!, этот фокус будет §Rобойден§!!"
