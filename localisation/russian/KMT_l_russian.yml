  KMT_oust_colonisers_available_tt:0 "Любой базовый штат:\n        §YВьетнам§!\n        §YKамбоджа§!\n        §YЛаос§!\n        §YМалайзия§!\n        §YИндонезия§!\n        §YИндия§!\n    не принадлежит своему владельцу.\n    Или они марионетки неазиатских стран."
