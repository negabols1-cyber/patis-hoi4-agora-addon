  ## Каирская конференция ##
  cairoC.1.t:0 "Провести конференцию с [CHI.GetName] и [ENG.GetName]?"
  cairoC.1.d:0 "Во время продолжающейся войны с [JAP.GetName], благоразумно объединиться против [JAP.GetAdjective] угрозы. Для этого нам следует обсудить это с их лидерами и попытаться найти более тесное сотрудничество"
  cairoC.1.a:0 "Отправить сообщение"
  cairoC.1.b:0 "Не стоит"
  cairoC.2.t:0 "Сообщение от [From.GetName]"
  cairoC.2.d:0 "[From.GetLeader] отправил сообщение [Root.GetLeader] с желанием более тесно сотрудничать с теми, кто может помешать амбициям [JAP.GetName]. [CHI.GetLeader] также приглашен"
  cairoC.2.d_2:0 "[From.GetLeader] отправил [Root.GetLeader] сообщение, в котором выразил желание более тесного сотрудничества с теми, кто способен помешать амбициям [JAP.GetName]. [ENG.GetLeader] также приглашён."
  cairoC.2.a:0 "Мы могли бы извлечь из этого какую-то выгоду."
  cairoC.2.b:0 "Мы можем победить [JAP.GetName] без их помощи."
  cairoC.3.t:0 "[From.GetName] Принимает"
  cairoC.3.d:0 "[From.GetLeader] ответил [Root.GetLeader] и заявил, что будет присутствовать на конференции."
  cairoC.3.a:0 "Вместе мы сильнее."
  cairoC.4.t:0 "[From.GetLeader] Отказался"
  cairoC.4.d:0 "[From.GetLeader] отклонил наше приглашение и заявил, что наше сотрудничество не имеет даже малейшей необходимости."
  cairoC.4.a:0 "Какое разочарование."
  cairoC.5.t:0 "Условия"
  cairoC.5.d:0 "Когда все участники прибыли и всё было готово, началось обсуждение. Представлены следующие условия и ожидается их утверждение."
  cairoC.5.a:0 "Вроде приемлемо."
  cairoC.5.b:0 "Это какая-то афера!?"
  cairoC.6.t:0 "Конференция [CairoC_venue.GetName]"
  cairoC.6.d_fail:0 "Несмотря на попытки [USA.GetLeader] добиться более тесного сотрудничества между теми, кто способен остановить амбиции [JAP.GetName], эта идея полностью провалилась. В обсуждении так и не было достигнуто согласия, и некоторые подозревают, что это может привести к будущим конфликтам между теми, кто был приглашён на конференцию после того, как [JAP.GetName] потерпел поражение.
  cairoC.6.d_noUS:0 "Несмотря на то, что это была идея [USA.GetLeader], конференция закончилась с пустым креслом [USA.GetLeader]. [CHI.GetLeader] и [ENG.GetLeader] пришли к соглашению, которое не устраивало [USA.GetLeader]. Однако [ENG.GetLeader] выразил явное недовольство тем, что [CHI.GetName] может получить политические выгоды от подписания соглашения.\n\nПо мнению некоторых экспертов, эта конференция приведет к быстрому ухудшению отношений между [ENG.GetName] и [USA.GetName] в ближайшие годы и может даже привести к образованию блоков в демократическом мире."
  cairoC.6.d_noBR:0 "[CHI.GetLeader] и [USA.GetLeader] достигли соглашения о борьбе с угрозой [JAP.GetAdjective]. Однако [ENG.GetLeader], который также был приглашен на конференцию, покинул ее до подписания соглашения по причинам, которые не разглашаются.\n\nСуществует версия, что [ENG.GetLeader] покинул конференцию из-за того, что обсуждаемые условия противоречили его личным интересам, поскольку они дали бы [CHI.GetName] огромные политические выгоды, что навредило бы колониальным интересам [ENG.GetName] в этом регионе."
  cairoC.6.d_noCN:0 "После долгих жарких дебатов [CHI.GetLeader] с недовольством покинул конференцию, поскольку, по словам представителя [CHI.GetName], условия были признаны \"неприемлемыми\". Тем временем в [CairoC_venue.GetName] [ENG.GetLeader] и [USA.GetLeader] подписали соглашение, которое будет содействовать их военным усилиям в деле разгрома [JAP.GetName]."
  cairoC.6.d_suc:0 "Все приглашённые лидеры пришли к соглашению о более тесном сотрудничестве против [JAP.GetAdjective] угрозы после продолжительных переговоров. Некоторые специалисты утверждают, что эта конференция станет началом конца для [JAP.GetName] в недалёком будущем, так как три самые могущественные нации мира решили выступить единым фронтом против [JAP.GetName]. Если это правда, то [JAP.GetAdjective] ждёт сложный период."
  cairoC.6.a:0 "Смерть [JAP.GetAdjective] псам!"
  cairoC.6.b:0 "Детская забава..."
  cairoC.6.c:0 "Интересный поворот событий..."
  cairoC.8.d:0 "Были одобрены следующие условия, и теперь мы будем совместно противостоять [JAP.GetAdjective] угрозе!"
