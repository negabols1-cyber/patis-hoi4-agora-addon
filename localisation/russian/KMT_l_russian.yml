  YUT_zhou_baoheng:0 "Чжоу Баохэн"
  KMT_neutrality_focus:0 "Возвращение к изоляции"
  KMT_neutrality_focus_desc:0 "В то время как некоторые могут утверждать, что нужно мужество и мудрость, чтобы принять сторону в глобальном конфликте, мы знаем, что требуется больше, чтобы отказаться."
  KMT_interventionism_focus:0 "Экспорт национальной революции"
  KMT_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только наших граждан. Если предотвращение тирании означает войну, то пусть так и будет."
  KMT_deterrence:0 "Сдерживание"
  KMT_deterrence_desc:0 "Стоя в одиночестве, мы редко извлекаем выгоду из войны. К счастью, мы знаем, что лучшая защита так известна, что вам никогда не придется ее использовать."
  KMT_volunteer_corps:0 "Бригады Сунь Ятсена"
  KMT_volunteer_corps_desc:0 "Заставлять наших людей умирать за идеалы свободы было бы иронией, но создание средств для тех, кто хочет помочь людям за рубежом, - нет."
  KMT_foreign_expeditions:0 "Национальный экспедиционный корпус дружбы"
  KMT_foreign_expeditions_desc:0 "Поскольку наши враги готовы вмешиваться в отдаленные конфликты от имени своих идеалов, мы должны быть готовы сделать то же самое для наших."
  KMT_recognize_maos_government:0 "Признать правительство Мао"
  KMT_recognize_maos_government_desc:0 "Признание их правительства - отличный способ улучшить наши отношения и снять напряженность."
  KMT_privilege_to_proletarians:0 "Привилегия пролетариям"
  #KMT_privilege_to_proletarians_desc:0 "Рабочие слишком долго подвергались эксплуатации. Пришло время освободить их и дать им все привилегии, которых они заслуживают."

  #KMT_integration_of_government:0 "Интеграция правительства"
  #KMT_integration_of_government_desc:0 "Под руководством Мао обе нации объединятся в одно правительство."

  #KMT_join_comintern:0 "Вступить в Коминтерн"
  #KMT_join_comintern_desc:0 "Находясь в окружении врагов, неплохо найти безопасность в рядах наших товарищей из других стран. Вступив в Коминтерн, мы можем закрепить свое положение и продвигать дело коммунизма во всем мире."

  #kmt_integrate_mao_tt:0 "Установить коммунизм правящей партией"

  #KMT_socialist_science:0 "Социалистическая наука"
  #KMT_socialist_science_desc:0 "Мир, как и сознание, находится в постоянном движении. Природа находится в состоянии постоянного прогресса, даже революции. Принципы диалектического материализма могут быть применены как к естественным наукам, так и к социальным..."

  #KMT_boycott_the_comitern:0 "Бойкотировать Коминтерн"
  #KMT_boycott_the_comitern_desc:0 "Коминтерн - вонючая клоака, полная свиней-ревизионистов. Мы создадим собственную фракцию и пойдем по истинному пути марксизма-ленинизма."

  #KMT_sinkiang_integration:0 "Судьба Синьцзяна"
  #KMT_sinkiang_integration_desc:0 "Синьцзян - законная китайская земля. Теперь, когда мы оба находимся под руководством великого Советского Союза, мы можем воспользоваться возможностью и потребовать возвращения Синьцзяна в Китай."
  KMT_invite_sik:0 "Пригласить Синьцзян"
  KMT_invite_sik_desc:0 "Чтобы следовать истинному пути марксизма-ленинизма, мы должны найти союзника, который встанет против пиг-ревизионистов в Коминтерне."
  KMT_war_with_sik:0 "Война с Синьцзяном"
  KMT_war_with_sik_desc:0 "Синьцзян - еще одна нация, зараженная пигами-ревизионистами. Мы должны избавиться от них!"
  KMT_trade_port_commie_comintern:0 "Просить присутствия Советов"
  KMT_trade_port_commie_comintern_desc:0 "Если Западный мир не пойдет на компромисс по вопросу торговых портов, нам нужно запросить присутствие Советского Союза, чтобы повысить наши шансы."
  KMT_trade_port_commie_own:0 "Требовать торговые порты"
  KMT_trade_port_commie_own_desc:0 "Мы должны вернуть торговые порты у западного мира, они принадлежат нам по праву."
  KMT_yangtze_partition:0 "Раздел Янцзы"
  KMT_yangtze_partition_desc:0 "Война с коммунистами идет не в нашу пользу, но река Янцзы дает нам время. Мы можем использовать это как шанс предложить перемирие и разделить Китай, используя Янцзы в качестве границы с ними. Это даст нам драгоценное время для восстановления и подготовки контратаки."
  KMT_retreat_to_taiwan:0 "Отступить на Тайвань"
  KMT_retreat_to_taiwan_desc:0 "Мы проиграли эту войну! Мы должны приказать об общем отступлении на Тайвань и реорганизоваться там!"
  KMT_retake_the_mainland:0 "Отвоевать материк"
  KMT_retake_the_mainland_desc:0 "Материк - наш! Избавимся от коммунистических вредителей!"
  KMT_resisist:0 "Сопротивляться коммунизму"
  KMT_resisist_desc:0 "Если мы позволим коммунизму захватить наше общество, мечта Суна никогда не будет выполнена и в Китае никогда не будет истинной демократии!"
  KMT_sov_advisors:0 "Советские советники"
  KMT_sov_advisors_desc:0 "Мы можем попросить наших друзей-большевиков о советниках для помощи нашей армии."
  KMT_spread_the_revolution:0 "Распространить революцию"
  KMT_spread_the_revolution_desc:0 "Наши товарищи-азиаты угнетаются западными колонизаторами. Мы должны показать им путь коммунизма и изгнать дьявола с Запада!"
  KMTwarlords_continuous_naval_production:0 "Военно-морское производство"
  KMTwarlords_continuous_naval_production_desc:0 "Сосредоточив ресурсы на наших верфях и освободив квалифицированных судостроителей от военной службы, мы можем значительно сократить время производства кораблей."
  KMTwarlords_continuous_air_production:0 "Авиационное производство"
  KMTwarlords_continuous_air_production_desc:0 "Мы можем реорганизовать нашу авиационную промышленность, чтобы устранить отходы и оптимизировать производство."
  KMTwarlords_continuous_non_factory_construct:0 "Строительная инженерия"
  KMTwarlords_continuous_non_factory_construct_desc:0 "В нашей строительной отрасли еще много недостатков. Сосредоточив на этом внимание, мы можем значительно повысить скорость строительства. К сожалению, производство станков оказалось серьезным препятствием на пути развития нашей тяжелой промышленности, поэтому они не получат выгоды от усилий в этой области."
  KMTwarlords_continuous_reduce_training_time:0 "Армейская подготовка"
  KMTwarlords_continuous_reduce_training_time_desc:0 "Создавая специализированные подразделения продвинутой подготовки в каждом дивизионе, мы сможем развернуть на фронте даже те дивизии, которые раньше пришлось бы оставить для завершения подготовки."
  KMTwarlords_continuous_suppression:0 "Подавление сопротивления"
  KMTwarlords_continuous_suppression_desc:0 "Внедряясь в крупные группы сопротивления на оккупированных территориях и обращая их лидеров, мы сможем значительно снизить наносимый ими ущерб."
  KMTwarlords_continuous_repair:0 "Восстановление строительства"
  KMTwarlords_continuous_repair_desc:0 "Мы сформируем специализированные ремонтные бригады из рабочих заводов и строителей, и централизованно будем управлять их размещением для улучшения восстановления поврежденной инфраструктуры."
  KMTwarlords_continuous_tech_share:0 "Обмен технологиями"
  KMTwarlords_continuous_tech_share_desc:0 "Мы будем поощрять наши исследовательские институты и университеты устанавливать связи с аналогичными структурами в союзных странах. Это даст нам бонус к обмену технологиями."
  KMTwarlords_continuous_boost_freedom:0 "Увеличение автономии"
