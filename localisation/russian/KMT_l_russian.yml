 CHI_improve_the_army_situation:0 "Улучшить положение армии"
  CHI_improve_the_army_situation_desc:0 "Национальная революционная армия находится в плачевном состоянии из-за коррупции и неэффективной подготовки солдат.\n\nЕсли мы не хотим, чтобы Китай был стерт в порошок, необходимо провести реформы, чтобы сделать НРА реальной, обученной и хорошо управляемой силой."
  CHI_improve_the_NRA:0 "Улучшить НРА"
  chi_improve_nra_decision:0 "[СтоимостьПринятияРешенияУлучшитьНРА]"
  chi_improve_nra_decision_blocked:0 "[СтоимостьПринятияРешенияУлучшитьНРАЗаблокировано]"
  chi_improve_the_nra_decision200:0 "§H200§!£опыт_армии"
  chi_improve_the_nra_decision200_blocked:0 "§R200§!£опыт_армии"
  chi_improve_the_nra_decision175:0 "§H175§!£опыт_армии"
  chi_improve_the_nra_decision175_blocked:0 "§R175§!£опыт_армии"
  chi_improve_the_nra_decision100:0 "§H100§!£опыт_армии"
  chi_improve_the_nra_decision100_blocked:0 "§R100§!£опыт_армии"
  CHI_improve_nra_sub_20_tt:0 "Снижает стоимость решения §Y$CHI_improve_the_NRA$§! на §G25§!£опыт_армии"

  CHI_war_of_resistance:0 "Война сопротивления"
  CHI_war_of_resistance_desc:0 "Война снова бушует на нашей родине, и Центральная равнина больше не безопасна для простых людей. [АгрессияЯпонии.getAdjective] может поглотить всю Восточную Азию, если мы не остановим этих воинствующих и жаждущих власти империалистов!\n\nЕсли мы хотим защитить дорогой Чжунго, мы должны быть готовы сделать все возможное для обеспечения его безопасности."
  CHI_Huayuankou_embankment_breach_incident:0 "Прорвать дамбы реки Хуанхэ"
  CHI_Huayuankou_embankment_breach_incident_desc:0 "Река Хуанхэ - жизненная артерия для прилегающих районов, но преграждает путь наступающему вторжению. В качестве последнего средства для сдерживания наступающих войск было выдвинуто предложение взорвать сложную систему дамб и плотин.\n\nЭффективность этого действия сложно оценить, но последствия будут серьезными."
  CHI_scorched_earth_policy_map:0 "Данные штаты в настоящее время доступны для тактики §HScorched Earth§!"
  CHI_scorched_earth_policy:0 "Тактика выжженной земли в [FROM.getName]"
  CHI_scorched_earth_policy_desc:0 "Противник занял наши города и деревни, вынудив наши армии отступить, чтобы сохранить свои силы. Тем не менее, мы можем приказать им уничтожить местную инфраструктуру, прежде чем они покинут [FROM.getName], тем самым воспрепятствовав продвижению наших врагов."
  CHI_redirect_investments_for_burma_road:0 "Перераспределение инвестиций для строительства Бирманской дороги"
  CHI_redirect_investments_for_burma_road_desc:0 "Некоторые специалисты советуют, чтобы мы могли направить часть ресурсов на строительство серии фортов вдоль южной части Юньнани, что может эффективно сдержать нашего врага, если он решит вторгнуться к нам с юга."
  CHI_prioritize_external_threat:0 "Приоритет внешней угрозе"
  CHI_prioritize_external_threat_desc:0 "Японцы начали наступление, в то время как мы все ещё имеем дело с внутренней угрозой! Стоит ли нам направить наши винтовки с наших китайских товарищей на империалистических захватчиков?"
  CHI_prepare_provisional_capital:0 "Подготовить временную столицу"
  CHI_prepare_provisional_capital_desc:0 "Враг быстро продвигается к Нанкину! Враг не сможет захватить наше руководство. Мы должны создать основу для временной столицы глубоко в стране, чтобы править нашей нацией в эти тяжелые времена; однако это будет непросто."
  CHI_strife_for_survival:0 "Стремление к выживанию!"
  CHI_strife_for_survival_desc:0 "Все больше и больше наших солдат и генералов понимают, что они могут выиграть текущую войну, только если они полностью посвятить себя ей; это более или менее улучшило боеспособность нашей армии."
  CHI_most_desperate_hours:0 "Самые отчаянные часы!"
  CHI_most_desperate_hours_desc:0 "Наша нация находится на грани краха под натиском вторгшегося врага! Выживание [CHI.getAdjective] цивилизации зависит от нашего отважного народа!"
  CHI_united_front_strategy:0 "Единая фронтовая стратегия"
  CHI_united_front_strategy_desc:0 "Япония, словно кошка, прокралась и захватила Корею. Своим ультиматумом из 21 пункта они хотели унизить нас, они оккупировали Маньчжурию, а теперь снова наступают. Довольно, Китай будет биться до последнего за свободу. Выступая перед народом, [Root.GetLeader] обратится к каждому [Root.GetAdjective] с призывом сплотиться или встретить верную гибель в одиночку."
  CHI_unequal_treaties:0 "Неравноправные договоры"
  CHI_unequal_treaties_desc:0 "Один из последних осколков унижения династии Цин на мировой арене, договорные порты олицетворяют желания европейских и японских империалистов в Поднебесной, которые стремятся использовать и подчинить [ROOT.getAdjective] народ во времена нашей слабости.\n\nИспользуя ситуацию в наших интересах, мы можем установить более тесные связи с теми, кто разделяет наши ценности, и свергнуть незаконные режимы, которые владеют нашими законными землями!"
  CHI_dealing_with_trade_port_decision:0 "[FROM.getName]"
  CHI_success_chance_depends_on_stability_tt:0 "§HБолее высокая стабильность§! обеспечивает более высокие шансы на §Gуспешный переворот§!!"
  hk_returned_tp:0 "Возвращённый договорный порт"
  CHI_liberation_of_asia:0 "Освобождение Азии"
  CHI_liberation_of_asia_desc:0 "Многие народы Южной и Юго-Восточной Азии в настоящее время борются под гнетом европейских колонизаторов.\nХотя нам удалось сохранить нашу независимость и укрепить власть над Центральной равниной, мы не забыли борьбу наших братьев и сестер по оружию! К оружию, братья, вас ждет освобождение!"
  CHI_liberate_country:0 "Освободить [FROM.getNameDef]"
  CHI_raises_three_miltiia_divisions_tt:0 "Набирает три дивизии из §Y5 ополченцев§! батальонов."
  CHI_raises_five_miltiia_divisions_tt:0 "Набирает пять дивизий из §Y5 ополченцев§! батальонов."
  CHI_raises_ten_miltiia_divisions_tt:0 "Набирает десять дивизий из §Y5 ополченцев§! батальонов."
  CHI_liberation_of_asia_here_tt:0 "Освобождение этих территорий будет возможным."
  CHI_asia_decolonized:0 "Азия деколонизирована"
  CHI_asia_decolonized_desc:0 "Наши военные и идеологические победы привели к тому, что мы не можем достичь европейского и американского континентов. Тем не менее, наши враги также не в состоянии вернуть себе свои колонии.\nТеперь, когда мы наконец выполнили свои цели по освобождению Азии, каким должно быть решение [ROOT.getLeader]? Будем ли мы искать мир с этими надоедливыми колонизаторами?"
