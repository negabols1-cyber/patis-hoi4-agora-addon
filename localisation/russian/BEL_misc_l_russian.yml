 RULE_OPTION_SOCIAL_DEMOCRACY:0 "Демократия - Социализм"
 RULE_OPTION_SOCIAL_DEMOCRACY_BEL_AI_DESC:0 "Правительство во главе с Полем-Анри Спааком будет проводить социалистическую политику, стремясь улучшить свои отношения с союзниками и защитить Европу от иностранных агрессоров."
 RULE_OPTION_COMMUNIST_BEL_AI_DESC:0 "Бельгийский ИИ будет пытаться стать коммунистическим и присоединиться к Коминтерну, продвигаясь по соответствующим ветвям национального древа фокусов."
 RULE_OPTION_FASCIST_PUPPET_BEL:0 "Фашизм - VNV"
 RULE_OPTION_FASCIST_PUPPET_BEL_AI_DESC:0 "Бельгийский ИИ будет пытаться стать фашистским и объединиться с Германией, продвигаясь по соответствующему пути в национальном древе фокусов."
 RULE_OPTION_FASCIST_DUTCHLAND_BEL:0 "Фашизм - Вердинасо"
 RULE_OPTION_FASCIST_DUTCHLAND_BEL_AI_DESC:0 "Бельгийский ИИ будет пытаться стать фашистским и выступить вместе с Францией против Германии."
 RULE_OPTION_MONARCHY_BEL:0 "Монархизм"
 RULE_OPTION_MONARCHY_BEL_AI_DESC:0 "Бельгийский ИИ попытается восстановить Леопольда III на троне, продвигаясь по соответствующему пути в национальном древе фокусов."

