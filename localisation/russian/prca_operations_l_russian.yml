l_russian:
  prca_distribute_hostile_leaflets:0 "Распространение враждебных листовок"
  prca_distribute_hostile_leaflets_desc:0 "§L[FROM.GetAdjective] боевой дух может показаться несокрушимым для среднестатистического гражданина, но наши агенты знают, что вражеские пропагандисты неустанно работают, чтобы держать свой народ в узде. Эксплуатация любых слабостей в их стабильности, которые мы можем найти, неизбежно даст нам преимущество в этой войне.§!"
  distribute_hostile_leaflets_tt:0 "Мы попытаемся повлиять на вражеское население с помощью пропагандистских листовок, что снизит стабильность и моральный дух."
  distribute_hostile_leaflets_outcome_tt:0 "Получает '§Y[prca_last_activated_leaflet]§!', который даёт (Политическое влияние: §R-10%§!, Организация дивизии: §R-5,0%§!, Скорость восстановления дивизии: §R-5,0%§!, Стабильность: §R-10,00%§!) на §Y160§! дней."
  leaflet_operation_available_tt:0 "Менее §Y3§! активных операций '§YРаспространение враждебных листовок§!' против этой страны."
  prca_distribute_leaflets_airborne:0 "Распространение самолётами"
  prca_distribute_leaflets_airborne_desc:0 "Наши агенты организуют и координируют сброс с воздуха наших пропагандистских листовок. Их разведка обеспечит высокое воздействие сообщения на боевой дух противника."
  prca_distribute_leaflets_airborne_outcome:0 "После того, как наши агенты обнаружили несколько слабых мест в моральном духе противника, они связались с нашим информационным агентством по закрытому каналу для дальнейших действий. К настоящему времени несколько бомбардировщиков с пропагандистскими листовками уже направляются к своей позиции."
  prca_distribute_leaflets_resistance:0 "Распространение с помощью сопротивления"
  prca_distribute_leaflets_resistance_desc:0 "Наши агенты попытаются связаться с местным сопротивлением, чтобы скоординировать печать и распространение листовок. Их разведка обеспечит высокое воздействие сообщения на боевой дух противника."
  prca_distribute_leaflets_resistance_outcome:0 "Наши агенты смогли связаться с местным сопротивлением и уже начали печатать листовки пару дней назад. Несколько десятков членов сопротивления в настоящее время пытаются распространить листовки среди населения. Принимаются большие меры предосторожности, чтобы гарантировать, что операция останется незамеченной как можно дольше."
  prca_distribute_leaflets_artillery:0 "Распространение с помощью артиллерии"
  prca_distribute_leaflets_artillery_desc:0 "Наши агенты организуют и скоординируют обстрел вражеских линий пропагандистскими листовками. Их разведка обеспечит высокое воздействие сообщения на боевой дух противника."
  prca_distribute_leaflets_artillery_outcome:0 "После того, как наши агенты обнаружили несколько слабых мест в моральном духе противника, они связались с нашим информационным агентством по закрытому каналу для дальнейших действий. К настоящему времени наша артиллерия уже начала обстрел вражеских линий пропагандистскими листовками."