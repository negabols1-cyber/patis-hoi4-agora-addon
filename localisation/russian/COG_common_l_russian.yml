 COG_Pierre_Ryckmans:0 "Пьер Рикманс"
 COG_Pierre_Ryckmans_desc:0 "Рикманс родился в Антверпене во Фландрии, Бельгия, шестым ребенком Альфонса Рикманса. Его отец Альфонс был видным членом Католической партии, сенатором в Бельгийском сенате и городским советником. Рикманс начал свою карьеру на колониальной службе в 1915 году, а также некоторое время провел в бельгийском мандате Руанда-Урунди. Он отвечал за немецкую Восточную Африку, захваченную во время Первой мировой войны. С момента начала Великой депрессии 1929 года экономика Конго неуклонно падала. Прибыв в 1934 году, находясь в хороших отношениях с Полем ван Зеландом, членом Католической партии, он быстро начал развивать Конго."
