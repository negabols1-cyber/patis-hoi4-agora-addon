l_russian:
 COG_TOUR_DESC_TT_GG:0 "Пьер хотел взять своего сына на экскурсию по Конго из-за комикса "Тинтин в Конго". Конечно, Пьер с радостью покажет ему страну, но из-за беспорядков, которые назревают после Первой мировой войны, многие племена, особенно китавалы, восстали против бельгийского правления. Пьер желает продемонстрировать, что он не такой, как его предшественники, и он может это сделать, создавая хорошие условия в местах, которые он посещает. Но нужно быть осторожным. Ведь в любой момент на Пьера может быть совершено покушение. Поэтому нам нужно сбалансировать уровень опасности и безопасности."
