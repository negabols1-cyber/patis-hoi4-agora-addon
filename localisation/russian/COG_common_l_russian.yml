 COG_leopold_iii_idea:0 "Леопольд III"
 COG_leopold_iii_idea_desc:0 "Леопольд III, король Конго и Бельгии, несмотря на его формальные титулы и церемониальные обязанности, роль Леопольда как короля была в значительной степени символической, поддерживая престиж и легитимность монархии, а не осуществляя существенной власти над управлением и принятием решений. На практике реальная власть была в руках колониальных администраторов, военных чиновников и политической элиты, которые управляли Конго от имени Бельгии."
 COG_free_trade_zone:0 "Экономика зоны свободной торговли"
 COG_uncontrolled_exports:0 "Неконтролируемый экспорт"
 COG_harsh_reform_and_labour_problems:0 "Жесткие реформы и проблемы с рабочей силой"
 COG_harsh_reform_and_labour_problems_desc:0 "Колониальная администрация начала реализовывать радикальные реформы и новую политику для решения проблем с рабочей силой. В этот период были введены кардинальные изменения, направленные на изменение экономической структуры Конго.\nКолониальные власти стремились повысить экономический потенциал Конго, внеся радикальные изменения в такие ключевые секторы, как сельское хозяйство и горнодобывающая промышленность. Однако эти реформы часто ухудшали условия жизни местного населения и приводили к социальным волнениям."
