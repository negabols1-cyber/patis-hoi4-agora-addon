  TUR_turanist_assimilation_for_kurdistan_desc:0 "Некоторые тюрки, которые забыли, кто они такие, потому что они были отделены от других тюркских племён, назвали себя курдами и хотят отделиться от нас. Мы должны напомнить им, кто они такие."
