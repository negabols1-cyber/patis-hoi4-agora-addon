  #National Spirits 
 SAU_arbitrary_budget_spending: "Произвольные расходы на бюджет"
 SAU_arbitrary_budget_spending_desc: "Король лично контролирует национальную казначейство, часто тратит большие суммы без надзора или долгосрочного планирования. Основные расходы накапливаются, но большая часть бюджета перемещается на королевские предпочтения, дань и символические жесты."
 SAU_hajj_dependent_economy: "Хадж -зависимая экономика"
 SAU_hajj_dependent_economy_desc: "С доходами от нефти, все еще в их младенчестве, экономика королевства по -прежнему сильно зависит от дохода, полученного во время ежегодного паломничества Хадж. Каждый год тысячи паломников приносят торговлю, пожертвования и религиозные налоги, поддерживая как местные рынки, так и государственную казначейство. Несмотря на духовно бесценную, этот сезонный источник дохода оставляет нашу финансовую стабильность уязвимой для региональной нестабильности и сдвигов внешней политики."
 SAU_the_ulama: "Улама"
 SAU_the_ulama_desc: "Улама, тело исламских ученых и религиозных властей, оказывают значительное влияние на социальные и правовые структуры королевства. Их поддержка предоставляет законность государству, особенно в вопросах управления, образования и общественной морали. Тем не менее, они остаются глубоко осторожными и часто устойчивыми к реформам, которые угрожают традиционным ценностям или их авторитету в обществе."
 SAU_sharia_law: "Закон шариата"
 SAU_sharia_law_desc: "Исламский законодательство шариата составляет основу правовой системы королевства, влияя на все аспекты управления, гражданских прав и социальных норм. Эта структура усиливает традиционную власть и религиозную легитимность, ограничивая либеральную реформу."
 SAU_slavery: "Рабство"
 SAU_shura_council: "Шура Совет"
 SAU_shura_council_desc: "Совет Шура служит традиционным консультативным органом, состоящим из старейшин племени, религиозных ученых и доверенных чиновников. Хотя он не имеет формальной законодательной власти, его руководство укрепляет внутренний консенсус и помогает поддерживать политическую сплоченность в королевстве."
 SAU_communist_shura_council: "Красная Шура Совет"
 SAU_research_for_oil_ns: "Черное золото"
 SAU_research_for_oil_ns_desc: "Масло, так называемое «черное золото» становится самым ценным ресурсом современной эпохи. Наши усилия по расширению добычи и улучшению методов нефтеперерабатывающего завода начинают окупаться, трансформируя стратегическое положение королевства и экономический потенциал."
 SAU_hajj_revenues_ns: "Хадж доходы"
 SAU_hajj_revenues_ns_desc: "Ежегодное паломничество Hajj приносит сезонный всплеск торговли, пожертвований и служебной деятельности в священные города и окружающие регионы. Несмотря на то, что он временный, этот приток богатства обеспечивает ценное повышение для нашей экономики и морального духа королевства."
 SAU_british_loans_ns: "Британские кредиты"
 SAU_british_loans_ns_desc: "Королевство обеспечило финансовые кредиты от британского правительства для стабилизации экономики и финансировать ключевые государственные функции. Хотя эти средства предлагают немедленное облегчение, они также могут прийти с долгосрочными политическими ожиданиями."
 SAU_economic_buff: "Союзные экономические инвестиции"
