 SAU_worker_shortage_ns: "Нехватка рабочих"
 SAU_arabian_military_offensive: "Аравийский военный наступление"
 SAU_joint_military_training_ns: "Совместная военная подготовка"
 SAU_joint_task_force_aid: "Американская совместная целевая группа по развертыванию American Rapid"
 SAU_joint_task_force_aid_desc: "Американские войска быстро направились на нашу территорию в соответствии с условиями двустороннего соглашения о защите. Их присутствие укрепляет нашу защиту и сигналы в мире, что Саудовская Аравия не стоит одинокая. Хотя их командование остается независимой, координация между нашими силами улучшается."
 SAU_joint_task_force_usa: "Совместная целевая группа быстрого развертывания"
 SAU_joint_task_force_usa_desc: "Целевая группа по быстрому развертыванию США была мобилизована для обеспечения стратегических интересов на Аравийском полуострове. Работая в координации с местными силами, эта миссия демонстрирует нашу способность быстро проецировать власть и сдерживать агрессию в нестабильных регионах."
 SAU_foreign_scientists_ns: "Иностранные ученые"
 SAU_prioritized_research_efforts: "Приоритетные исследования"
 SAU_neutrality_guarantee: "Гарантия нейтралитета"
 SAU_drought_crisis: "Суровый кризис засухи"
 SAU_drought_crisis_desc: "Широко распространенная засуха вызывает нехватку продовольствия, потери животноводства и растущее недовольство по всей сельской местности."
