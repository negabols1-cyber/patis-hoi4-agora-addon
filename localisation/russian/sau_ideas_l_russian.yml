 SAU_royal_saudi_army_dmod: "Королевские саудовские сухопутные силы"
 SAU_royal_saudi_army_dmod_desc: "Королевские земельные силы Саудовской Аравии представляют основную сухопутную силу королевства. По -прежнему подвергаясь модернизации, они стоят как дисциплинированное и лояльное институт, готовые защищать наши границы и поддержать национальный суверенитет."
