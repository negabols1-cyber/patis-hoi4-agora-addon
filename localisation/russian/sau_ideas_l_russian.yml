 SAU_hajj_area: "Hajj Zone"
 SAU_state_supporting_resistance_modifier: "Сопротивление Саудовской Аравии"
 SAU_state_supporting_resistance_modifier_modifier_desc: "Саудовская Аравия тайно поставляет оружие и оборудование, а также военную подготовку местным арабским племенам."
 SAU_sabotaged_oil_wells: "Саботированные нефтяные скважины"
