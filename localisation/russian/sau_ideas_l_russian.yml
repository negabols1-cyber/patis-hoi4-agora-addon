 SAU_islamist_influence: "Исламистское влияние"
 SAU_old_war_traditions_ns: "Старые традиции"
 SAU_old_war_traditions_ns_desc: "Столетия племенной войны и выживания в пустыне превратили наших людей в гибких и устойчивых бойцов. Эти традиции, передаваемые в течение поколений, продолжают влиять на нашу тактику, благоприятствуя мобильности, смелые кавалерийские рейды и глубокое понимание местности."
 SAU_tribes_united: "Племена объединены"
 SAU_rebuilding_our_empire: "Восстановление нашей империи"
 SAU_aggressive_policies_ns: "Агрессивная политика"
 SAU_jihad_ns: "Джихад"
 SAU_nation_under_god_ns: "Нация под Богом"
 SAU_nation_under_god_ns_desc: "Эта нация определяет само существование через веру. Наши законы, лидерство и судьба основаны на божественной власти. По мере того, как призыв к обновленному халифату повторяется по всему исламскому миру, мы являемся не просто страной, а как символом единства, порядка и послушания при Боге."
 SAU_arabia_supporting_independence_idea: "[SAU.GetName] Поддержка независимости"
