 SAU_first_four_year_plan_ns: "Четырехлетний план"
 SAU_increase_oil_exports_ns: "Увеличить экспорт нефти"
 SAU_increase_oil_exports_ns_desc: "Благодаря растущему международному спросу, мы увеличиваем экспорт нефти, чтобы поддержать государственные доходы и обеспечить влияние за рубежом. Наши резервы теперь служат как экономическим двигателем, так и дипломатическим инструментом."
 SAU_spread_islam_ns: "исламизм"
 SAU_mabahith_lar_ns: "Мабахит"
 SAU_mabahith_lar_ns_desc: "Мабахит, наша внутренняя разведывательная служба, контролирует деятельность диссидентов и обеспечивает лояльность в королевстве. Несмотря на то, что они сдержаны, их операции жизненно важны для поддержания внутреннего порядка и подавления подрывных угроз."
 SAU_rekate_mecca_ns: "Вернуть Мекку"
 SAU_high_morale_ns: "Высокий моральный дух"
 SAU_arab_league_member: "Член Лиги арабского"
 SAU_arab_league_member_desc: "Признанный член Лиги арабских лиг, согласованный с общим видением политического единства и регионального сотрудничества между арабскими странами."
 SAU_arabian_defence_council: "Аравийский совет обороны"
 SAU_arabian_economic_council: "Аравийский экономический совет"
 SAU_pool_technical_know_how: "Пул технических ноу-хау"
 SAU_pool_technical_know_how_desc: "У каждой страны есть свои методы управления промышленностью и поддержания оборудования. Мы можем учиться друг у друга, отправив технические команды для распространения этих знаний среди других членов Альянса."
