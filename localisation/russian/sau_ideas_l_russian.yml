 SAU_saudi_backed_militia: "Саудовская Америка поддержала милицию"
 SAU_saudi_backed_militia_desc: "Благодаря поддержке Саудовской Аравии мы получили оружие, обучение и духовную поддержку в нашей борьбе. Их помощь поддержала наши ряды и дала нам силу противостоять режиму, который больше не представляет верующих. Мы сражаемся не только за власть, но и за видение ислама, незапятнанного коррупцией."
