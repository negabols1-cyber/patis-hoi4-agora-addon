l_russian:
  CHI_secure_internal_politics:0 "Обеспечение внутренней политики"
  CHI_secure_internal_politics_desc:1 "Чтобы наше правительство пережило эту китайскую политическую неразбериху, мы не должны отвлекаться на внутренние склоки. Любую внутреннюю оппозицию необходимо пресекать на корню."
  CHI_cooperation_with_the_nationalists:0 "Сотрудничество с националистами"
  CHI_cooperation_with_the_nationalists_desc:1 "Националисты — лучший вариант для объединения страны и победы над японцами. Нам необходимо убедиться в том, что они не считают нас угрозой."
  CHI_cooperation_with_the_nationalists_effect_tooltip:0 "§H[WTT_communist_china.GetNameDefCap]§! и воюющие князья, вставшие на сторону коммунистов, могут начать §HГраничные конфликты§! с нами в ответ на это."
  CHI_technological_cooperation:0 "Технологическое сотрудничество"
  CHI_technological_cooperation_desc:1 "Наше сотрудничество с центральным правительством позволит нам получить доступ к любым новым технологиям, которые оно разрабатывает."
  CHI_new_model_province:0 "Новая модель провинции"
  CHI_new_model_province_desc:1 "Пока центральное правительство изо всех сил пытается втащить страну в современную эпоху, мы внедрим реформы в гораздо меньших масштабах и будем считаться светлыми маяками прогресса на фоне отсталости остальной части нации."
  CHI_root_out_corruption:0 "Искоренение коррупции"
  CHI_root_out_corruption_desc:1 "Десятилетиями государственные чиновники использовали свое положение, чтобы набивать собственные карманы и притеснять население, закрывая глаза на коррупцию."
  CHI_embrace_the_opium_trade:0 "Поддерживать торговлю опиумом"
  CHI_embrace_the_opium_trade_desc:1 "Стране нужны деньги, чтобы функционировать. В сложившейся ситуации мы не можем слишком тщательно выбирать источники."
  CHI_land_reform:0 "Земельная реформа"
  CHI_land_reform_desc:1 "Коммунисты проводят агрессивную программу перераспределения земель, благодаря чему завоевывают множество сторонников среди крестьян. Нам следует реализовать менее радикальную программу, чтобы население было на нашей стороне."
  CHI_reform_the_administration:0 "Провести реформу администрации"
  CHI_reform_the_administration_desc:1 "Все наши усилия на правительственном уровне будут напрасны, если их не будут выполнять на местном уровне. Нам следует удостовериться, что должностные лица на местах способны и готовы выполнять наши приказы."
  CHI_join_the_republican_government:0 "Присоединиться к правительству республики"
  CHI_join_the_republican_government_desc:1 "Укрепив свою территорию и реформировав правительство, пора обратиться к центральному правительству и потребовать участия в политическом процессе. Как только мы получим признание в качестве политической партии, мы сможем использовать эту легитимность, чтобы наращивать поддержку в других штатах и расширять нашу базу власти."
  CHI_power_struggle:0 "Борьба за власть"
  CHI_power_struggle_desc:1 "Наше политическое влияние на государственные дела значительно возросло. Теперь мы можем попытаться установить отношения с другими странами на равных."
  china_nationalist_focus:0 "дерево фокусов Националистического Китая"
  china_communist_focus:0 "дерево фокусов Коммунистического Китая"
  CHI_cooperation_with_the_communists:0 "Сотрудничество с коммунистами"
  CHI_cooperation_with_the_communists_desc:1 "Гоминьдан пытался и не смог построить современную нацию. Страна разделена как никогда, крестьяне живут в страхе перед властью, коррупция процветает на всех уровнях, а японские империалисты находятся прямо у границ. Возможно, коммунизм - более правильный путь в будущее."
  CHI_cooperation_with_the_communists_effect_tooltip:0 "Сотрудничающие с националистами полевые командиры могут начать в ответ против нас §Hпограничные конфликты§!.\n"
  CHI_land_redistribution:0 "Перераспределение земли"
  CHI_land_redistribution_desc:1 "Крестьяне безжалостно эксплуатируются землевладельцами, хотя именно они составляют основу нашей экономики. Наделить людей, которые возделывают землю, правами на неё, приведёт к созданию намного более справедливого и эффективного общества."
  CHI_ideological_education:0 "Идеологическое образование"
  CHI_ideological_education_desc:1 "Сегодня закладывается основа нашего будущего успеха. Будущие поколения должны усвоить фундаментальную истину, согласно которой вся история - это история борьбы классов, и понять свою роль в ней."
  CHI_land_value_tax:0 "Налог на землю"
  CHI_land_value_tax_desc:1 "Прямое налогообложение земли дает нам более стабильную и справедливую налоговую систему, которая изымает деньги у тех, у кого их больше всего."
  CHI_judiciary_reforms:0 "Судебные реформы"
  CHI_judiciary_reforms_desc:1 "Если наша администрация собирается добиться перемен, нам необходимо убедиться, что все судьи получили достаточное образование, чтобы правильно применять наши законы."
  CHI_communist_administrators:0 "Коммунистические администраторы"
  CHI_communist_administrators_desc:1 "Старая гвардия администраторов слишком укоренилась, чтобы когда-нибудь склониться на нашу сторону. Мы должны полностью заменить их новыми, более молодыми администраторами с более радикальными идеями."
  CHI_join_the_chinese_soviet:0 "Присоединиться к Китайскому Совету"
  CHI_join_the_chinese_soviet_desc:1 "Революция может победить только в том случае, если коммунисты будут держаться вместе. Конечно, мы должны убедиться, что в партии нет элементов контрреволюции, которые попытаются сорвать революцию до ее начала."
  CHI_the_yanan_incident:0 "Яньаньский инцидент"
  CHI_the_yanan_incident_effect_tt:0 "Просить поддержки у §H[SOU.GetNameDef]§!, чтобы заменить §H[WTT_communist_china.GetNameDef]§! в качестве лидера коммунистов.\nЭто приведет к войне с §H[WTT_communist_china.GetNameDef]§!, если они откажутся.\nЭто соглашение с §H[SOU.GetNameDef]§! откроет нас для требований от [SOU.GetLeader]\n"
  CHI_the_yanan_incident_desc:1 "Нынешний лидер партии отвернулся от социалистических братьев из Советского Союза. Нам следует обратиться к Советам и добиться их поддержки в проведении революции по всему Китаю."
  CHI_opposition:0 "Оппозиция"
  CHI_opposition_effect_tooltip:0 "§H[WTT_current_china_leader.GetNameDef]§! может начать с нами пограничную войну в ответ на это."
  CHI_opposition_desc:1 "Центральное правительство коррумпировано и слабо. Коммунисты желают уничтожить 5000-летнюю китайскую историю. Эта ситуация требует великого лидера, того, кто готов принимать сложные решения и объединить страну — любыми необходимыми средствами."
  CHI_public_works:0 "Общественные работы"
  CHI_public_works_desc:1 "Население должно видеть, что мы работаем для их блага. Несколько важных проектов послужат полезным пропагандистским материалом и покажут, каким может быть весь Китай, если они нас поддержат."
  CHI_labor_reform:0 "Трудовая реформа"
  CHI_labor_reform_desc:1 "Методы и обычаи работы в Китае развивались на протяжении тысячелетий. Пришло время перевести их в современную эпоху."
  CHI_rural_militias:0 "Сельские ополчения"
  CHI_rural_militias_desc:1 "В обширной сельской местности военная поддержка часто долгое время не доходит до места нападения. Создав местные ополчения, мы можем обеспечить, чтобы любому захватчику было трудно передвигаться по нашей сельской местности."
  CHI_war_taxes:0 "Военные налоги"
  CHI_war_taxes_desc:1 "Отчаянные времена требуют отчаянных мер. Пока продолжается война, мы должны мобилизовать экономические ресурсы населения в максимально возможной степени."
  CHI_seek_japanese_support:0 "Поиск японской поддержки"
  CHI_seek_japanese_support_desc:1 "И центральное правительство, и коммунисты имеют могущественных союзников. Если мы хотим выйти победителями из этой войны, нам придется найти собственного покровителя."
  CHI_personal_leadership:0 "Личное руководство"
  CHI_personal_leadership_desc:1 "Разделение командования армией несет в себе риск, что офицер с идеями, превышающими его ранг, попытается узурпировать власть. Мы должны быть уверены, что наши солдаты всегда будут лояльны правительству."
  CHI_cult_of_personality:0 "Культ личности"
  CHI_cult_of_personality_desc:1 "Люди должны знать, кто ведет их через эти мрачные дни к светлому будущему, а также о многочисленных выдающихся качествах этого человека."
  CHI_provoke_border_clashes:1 "Пограничные столкновения с националистами"
  CHI_provoke_border_clashes_desc:1 "Мы еще не можем рисковать начать полномасштабную войну. Небольшой контролируемый конфликт позволяет нам занять выгодные позиции, не будучи полностью разгромленными. В идеале, мы нанесем удар прямо тогда, когда наш противник перебросит свои силы в другое место."
  CHI_defensive_posture:0 "Оборонительная позиция"
  CHI_defensive_posture_desc:1 "Этот конфликт - марафон, а не спринт. Вызов другим фракциям на слишком раннем этапе приведет к катастрофе. Пока что мы будем оставаться в обороне."
  CHI_rapid_mobilization:0 "Быстрая мобилизация"
  CHI_rapid_mobilization_desc:1 "Чтобы стать достойным претендентом на лидерство в Китае, нам необходимо увеличить размер нашей армии. Мы разработаем новые методы обучения и создадим армию, которая сможет справиться с любой задачей."
  CHI_proclaim_rival_government:0 "Провозгласить правительство противников"
  CHI_proclaim_rival_government_desc:1 "Пришло время сделать наши амбиции официальными. Нам требуется ничто иное, как полный контроль над Китаем, и мы будем вести переговоры с остальным миром на равных условиях."
  CHI_industrial_investment:0 "Промышленные инвестиции"
  CHI_industrial_investment_desc:1 "Хотя наши ресурсы могут быть ограничены, мы должны направить имеющийся у нас капитал на улучшение нашей экономики."
  CHI_public_education_reform:0 "Реформа общественного образования"
  CHI_public_education_reform_desc:1 "Основой современной нации являются знания и наука. Мы должны сначала улучшить и укрепить эту основу."
  CHI_local_arms_production:0 "Местное производство оружия"
  CHI_local_arms_production_desc:1 "Пока нас считают просто незначительной второстепенной фракцией в войне, мы не можем рассчитывать на поставки оружия извне. Нам придётся развивать собственные арсеналы для производства оружия."
  SIK_complete_horgos_hami_road:0 "Завершить строительство дороги Хоргос-Хами"
  SIK_complete_horgos_hami_road_desc:0 "Индустриальное развитие нашей страны сдерживается её недостаточно развитой инфраструктурой. Соединение промышленных районов Запада с глубинкой Востока позволит товарам и людям свободно перемещаться по стране."
  CHI_long_term_economic_planning:0 "Долгосрочное экономическое планирование"
  CHI_long_term_economic_planning_desc:1 "Наш бюрократический аппарат не столь велик, как в Центральном правительстве. Это позволяет нам избавиться от многих формальностей, препятствующих экономическому развитию, и сосредоточить наши скромные усилия на получении максимально возможной отдачи."
  CHI_local_arms_development:0 "Локальное производство оружия"
  CHI_local_arms_development_desc:1 "Изготовление грубых копий иностранного оружия - недостаточно. Если мы хотим идти в ногу со временем вместе с остальным Китаем, мы должны разработать новое оружие."
  90_days_tt:0 "Реализация займёт около 90 дней.\n"
  CHI_heavy_weapons_development:0 "Развитие тяжёлого вооружения"
  CHI_heavy_weapons_development_desc:1 "При нехватке ресурсов мы должны максимально использовать те немногие тяжёлые огневые средства, которые у нас есть. Мы должны отдать приказ о разработке новых артиллерийских орудий."
  CHI_anti_opposition_campaigns:0 "Антиоппозиционные кампании"
  CHI_anti_opposition_campaigns_desc:0 "Наши враги собираются прямо за нашими границами. Мы не можем позволить им оставаться там без присмотра. Серия небольших наступлений отбросит их и даст нам больше пространства.
  CHI_anti_opposition_campaigns_effect_tooltip:0 "Разблокирует значок решения §HРешения§! для начала §HКонфликтов на границе§! с Военными Лордами, не сотрудничающими с нашей стороной.\n"
  CHI_anti_opposition_campaigns_effect_tooltip_no_communists:0 "§RЕще не один Военный Лорд не встал на сторону Коммунистов§!\n"
  CHI_anti_opposition_campaigns_effect_tooltip_no_nationalists:0 "§RЕще не один Военный Лорд не встал на сторону Националистов§!\n"
  CHI_institute_cross_border_raids:0 "Инициировать трансграничные набеги"
  CHI_institute_cross_border_raids_desc:0 "Мы не будем восприниматься всерьез как независимые кандидаты в борьбе за лидерство в Китае, если не покажем миру, что мы можем и хотим сражаться за свои земли. Несколько небольших вылазок продемонстрируют нашу решимость и могут позволить нам захватить какую-нибудь незащищенную территорию."
  CHI_institute_cross_border_raids_effect_tooltip:0 "Разблокирует значок решения §HРешения§! для начала §HКонфликтов на границе§! с Военными Лордами и [WTT_communist_china.GetNameDef]\n"
  CHI_provoke_border_clashes_effect_tooltip:0 "Разблокирует значок решения §HРешения§! для начала §HКонфликта на границе§! с [WTT_current_china_leader.GetNameDef]\n"
  CHI_inflation_up_tt:0 "§RУвеличивает§! инфляцию.\n"
  CHI_inflation_down_tt:0 "§GУменьшает§! инфляцию.\n"
  CHI_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
  CHI_invite_foreign_investors_desc:0 "Пускай это и унизительно, но мы индустриализируем нашу страну, сотрудничая с теми, кто нас эксплуатировал."
  CHI_mission_to_germany:0 "Миссия в Германию"
  CHI_mission_to_germany_desc:0 "Изгои Европы добились больших успехов в преобразовании своей страны, вернув ей былое величие. Нам многому стоит у них поучиться."
  CHI_give_falkenhausen_citizenship:0 "Предоставление гражданства Фалькенхаузену"
  CHI_give_falkenhausen_citizenship_desc:0 "Немецкие советники оказали огромную помощь в восстановлении и модернизации нашей армии. Необходимо гарантировать им право оставаться здесь, несмотря на изменение политической ситуации."
  falkenhausen_tt:0 "Фалькенхаузену уже предложили гражданство в другой стране."
  CHI_chinese_general_staff:0 "Китайский генеральный штаб"
  CHI_chinese_general_staff_desc:0 "Хорошо организованный генеральный штаб имеет решающее значение для планирования сложных операций. Нам стоит перенять немецкий опыт и создать подобную организацию."
  CHI_wargaming_division:0 "Отдел военных игр"
  CHI_wargaming_division_desc:0 "Необходимо сформировать специальное подразделение в генеральном штабе, занимающееся прогнозированием будущих войн и разработкой новой тактики и стратегии для победы над врагами. Они могли бы использовать какое-нибудь вычислительное устройство для моделирования мировой войны..."
  CHI_closer_ties_with_germany:0 "Более тесные связи с Германией"
  CHI_closer_ties_with_germany_desc:0 "Наша миссия в Германию открыла возможность еще большего сотрудничества, включая заем для финансирования дальнейшего промышленного развития."
  CHI_purchase_tanks:0 "Закупить танки"
  CHI_purchase_tanks_desc:0 "Бронетехника будет составлять острие современного ведения войны. Мы должны совершить скромную закупку танков в целях формирования первых бронетанковых частей китайской армии."
  CHI_chinese_panzers:0 "Китайские панцеры"
  CHI_chinese_panzers_desc:0 "Немецкие танки - бесспорно, лучшие в мире. Мы должны учиться на их примере и разработать свои танки по их образцу."
  CHI_tank_plant:0 "Танковый завод"
  CHI_tank_plant_desc:0 "С прогрессирующим исследованием новых танков мы теперь можем инвестировать в специализированный завод для их постройки."
  CHI_experimental_mechanised_unit:0 "Экспериментальное механизированное подразделение"
  CHI_experimental_mechanised_unit_effect:0 "Получение дивизии с 2 §YЛегкими танками§! и 4 §YМоторизованными§! батальонами\n"
  CHI_experimental_mechanised_unit_desc:0 "Теоретики в Европе давно спорят о лучшем способе применения танков. Кажется, подразделение, объединяющее мобильную пехоту с быстрыми танками - лучший подход. Мы сформируем такое подразделение."
  CHI_combined_arms_warfare:0 "Общевойсковой бой"
  CHI_combined_arms_warfare_desc:0 "В то время как грузовиков достаточно для первоначальных экспериментов в современной механизированной войне, их плохие характеристики на бездорожье и отсутствие брони делают их непригодными для передовой."
  CHI_hire_soviet_designer:0 "Нанять советского конструктора"
  CHI_hire_soviet_designer_desc:0 "Советы долгое время экспериментировали с танками и имеют одних из лучших конструкторов танков в мире. Мы могли бы нанять одного из них для проектирования для нас бронемашин."
  CHI_joint_tank_development:0 "Совместная разработка танков"
  CHI_joint_tank_development_desc:0 "После опыта, полученного в работе с советскими конструкторами, нам следует сформировать совместные проектные группы для лучшей координации работы и обучения друг у друга."
  CHI_mission_to_the_soviet_union:0 "Миссия в Советский Союз"
  CHI_mission_to_the_soviet_union_desc:0 "Советский Союз выразил заинтересованность в Китае, в основном для создания противовеса японскому экспансионизму. Нам следует направить миссию в Москву, чтобы узнать, совпадают ли наши цели."
  CHI_rapprochement_with_soviet_union:0 "Сближение с Советским Союзом"
  CHI_rapprochement_with_soviet_union_desc:0 "Хотя у нас могут быть некоторые идеологические разногласия с Советским Союзом, очевидно, что у них те же интересы, что и у нас. Мы должны официально оформить наши новые отношения и подписать взаимный пакт о ненападении, чтобы показать миру, что мы едины."
  CHI_invite_soviet_advisers:0 "Пригласить советских советников"
  CHI_invite_soviet_advisers_desc:0 "Советы предложили направить военную миссию, чтобы помочь нам восстановить наши вооруженные силы."
  soviet_advisers_tt:0 "Советы уже отправили военную миссию в одну из китайских фракций"
  CHI_the_soviet_volunteer_group:0 "Группа советских добровольцев"
  CHI_the_soviet_volunteer_group_desc:0 "Наши военно-воздушные силы остаются слабыми по сравнению с другими державами в регионе. Советы, кажется, открыты для предложения по отправке группы добровольцев."
  CHI_reach_out_to_france:0 "Налаживание контактов с Францией"
  CHI_reach_out_to_france_desc:0 "Хотя французы неоднократно унижали нас и принуждали к новым уступкам, в нынешней ситуации мы можем оказаться в ситуации, когда нам потребуется их помощь."
  CHI_small_arms_expertise:0 "Экспертиза в области стрелкового оружия"
  CHI_small_arms_expertise_desc:0 "В нашей армии личное оружие является решающим. Нам следует направить скромные ресурсы на то, чтобы сохранить современный облик в этой области."
  CHI_elite_mountaineers:0 "Элитные горцы"
  CHI_elite_mountaineers_desc:0 "Война в горах отличается от боев на равнине. Нам следует обучить специализированные дивизии этому искусству, чтобы наилучшим образом использовать наш рельеф."
  CHI_free_mountain_template_tt:0 "Получите шаблон с §Y7 горными§! и §Y2 артиллерийскими§! батальонами."
  CHI_heavy_weapons:0 "Тяжелое вооружение"
  CHI_heavy_weapons_desc:0 "Армия без поддержки артиллерии не в состоянии противостоять серьезному нападению. Нам необходимо обеспечить нашу армию соответствующим оборудованием."
  CHI_guarantee_the_hanoi_route:0 "Гарантирование маршрута Ханоя"
  CHI_guarantee_the_hanoi_route_desc:0 "Маршрут через Ханой и на север к нашим границам обеспечивает максимально возможную поддержку извне, если разразится война с Японией."
  CHI_construction_battalions:0 "Строительные батальоны"
  CHI_construction_battalions_desc:0 "Если есть то, чем наша страна обладает в избытке, так это людьми. Мы можем сформировать специальные подразделения, которым нужны лишь лопаты для проведения важных инженерных работ."
  CHI_french_military_mission:0 "Французская военная миссия"
  CHI_french_military_mission_desc:0 "Французская армия является одной из наиболее хорошо обученных в Европе. Мы можем многому научиться у них."
  CHI_french_drill:0 "Французская муштра"
  CHI_french_drill_desc:0 "Французский опыт в Великой войне создал армию, превосходно подходящую для обороны. Приняв их методы и стандарты обучения, мы можем повысить свои собственные оборонительные возможности."
  CHI_modern_logistics:0 "Современная логистика"
  CHI_modern_logistics_desc:0 "Без работоспособной логистической системы мы не сможем поддерживать армию в полевых условиях."
  CHI_renegotiate_the_unequal_treaties:0 "Пересмотр неравноправных договоров"
  CHI_renegotiate_the_unequal_treaties_desc:0 "Западники слишком долго диктовали, как нам вести дела в наших собственных границах. Их граждане защищены от наших законов, и мы не имеем права голоса в том, как они ведут дела в наших городах. Это должно прекратиться. Мы снова станем равными с ними."
  CHI_one_china_policy:0 "Политика одного Китая"
  CHI_one_china_policy_desc:0 "В суматохе после революции несколько территорий отделились и попытались создать свои собственные государства. Некоторые просто перестали подчиняться центральному правительству, другие заявили, что снова стали суверенными государствами. Будучи укрепленными, как мы сейчас, мы публично заявим о своих притязаниях на старые китайские границы, которые стояли веками."
  CHI_integrate_tibet:0 "Присоединить Тибет"
  CHI_integrate_tibet_desc:0 "Эксперимент с независимостью Тибета окончен. Военное вторжение — это вариант, но мы должны попытаться вернуть их в лоно мирным путем."
  CHI_conquer_tibet:0 "Завоевать Тибет"
  CHI_conquer_tibet_desc:0 "Тибет занимает стратегически важное положение между нами и Индией. Они слишком слабы, чтобы защитить себя. Мы должны вмешаться, чтобы защитить наш южный фланг."
  CHI_renounce_the_mcmahon_line:0 "Отказаться от линии Макмагона"
  CHI_renounce_the_mcmahon_line_desc:0 "Старая граница, проведенная между Императорским правительством и англичанами, никогда не была верной, даже когда британцы притворялись, что уважают ее. Десятилетиями мы были слишком слабы, чтобы оспаривать это. Хватит."
  CHI_demand_mongolia:0 "Потребовать Монголию"
  CHI_demand_mongolia_desc:0 "Зажатая между нами и Россией, Монголия может в любой момент попасть к ним. Мы должны нанести удар первыми."
  CHI_anti_imperialism:0 "Антиимпериализм"
  CHI_lessons_of_war_completed:0 "Завершены все этапы §YРеформы армии§! и §YУроков войны§!\n"
  CHI_anti_imperialism_desc:0 "Сегодня мы одни из первых наций, сбросивших оковы колониализма. Наш священный долг - гарантировать, что и другие народы Азии смогут сами определять свою судьбу."
  CHI_guidance_and_support:0 "Руководство и поддержка"
  CHI_guidance_and_support_desc:0 "Народам Индокитая по-прежнему нужна помощь в строительстве собственных наций. Мы сделаем так, чтобы они больше не поддались давлению извне."
  CHI_indian_cooperation:0 "Индийское сотрудничество"
  CHI_indian_cooperation_desc:0 "Народы Индии борются за то, чтобы сбросить последние оковы колониального гнета. Мы должны протянуть им руку помощи, поддержать их борьбу и вместе поработать над более светлым будущим для обоих наших народов."
  CHI_commit_to_korean_independence:0 "Поддержать независимость Кореи"
  CHI_commit_to_korean_independence_desc:0 "Корейцы стали первыми жертвами японской оккупации. Впредь они снова станут свободным народом среди наций мира."
  CHI_influence_mongolia:0 "Оказать влияние на Монголию"
  CHI_influence_mongolia_desc:0 "Наличие Монголии в качестве буферного государства между нами и Россией защитит наш северный фланг. Нам просто нужно убедиться, что они смогут позаботиться о себе."
  CHI_imperial_legacy:0 "Имперское наследие"
  CHI_imperial_legacy_desc:0 "Тысячелетиями Китай был доминирующей силой на Востоке, гарантируя мир и стабильность в регионе. Пришло время вернуть наши прежние позиции."
  CHI_overlordship_over_indochina:0 "Доминирование над Индокитаем"
  CHI_overlordship_over_indochina_desc:0 "Индокитай издавна зависит от защиты Китая. Тот факт, что эта территория была захвачена Францией, показывает, что они не могут защитить себя самостоятельно."
  CHI_dominate_japan:0 "Подчинение Японии"
  CHI_dominate_japan_desc:0 "Десятилетиями Япония представляла наибольшую угрозу для нашей независимости. Ранее они вступали в союз с западными державами, чтобы подчинить нас. Мы не можем позволить им предпринять новую попытку. Мы должны нанести удар первыми."
  CHI_secure_the_peninsula:0 "Удержание полуострова"
  CHI_secure_the_peninsula_desc:0 "В наших интересах гарантировать, что Корейский полуостров никогда больше не будет оккупирован враждебной силой."
  CHI_british_cooperation:0 "Британское сотрудничество"
  CHI_british_cooperation_desc:0 "Несмотря на то, что они являются основными империалистами, сотрудничество с британцами предлагает лучшую возможность для модернизации наших военно-воздушных сил и обеспечения постоянного потока поставок."
  CHI_burma_road:0 "Бирманская дорога"
  CHI_burma_road_desc:0 "Бирманская дорога является нашим спасательным кругом с Западом. Она должна быть защищена любой ценой и расширена для обеспечения бесперебойных поставок."
  CHI_ledo_road:0 "Ледо"
  CHI_ledo_road_desc:0 "Одного только Бирманского пути нам недостаточно. Мы должны найти новые способы доставки припасов, чтобы продолжить борьбу."
  CHI_fighter_purchases:0 "Покупки истребителей"
  CHI_fighter_purchases_desc:0 "Нашим ВВС нужны современные истребители, чтобы противостоять иностранным угрозам. Наша промышленность пока не может их производить, поэтому мы должны покупать их за границей."
  CHI_camco:0 "CAMCO"
  CHI_camco_desc:0 "Если мы хотим создать независимую авиационную промышленность, мы должны сначала изучить методы и способы сборки и обслуживания уже имеющихся у нас самолетов."
  CHI_local_fighter_production:0 "Местное производство истребителей"
  CHI_local_fighter_production_desc:0 "Теперь, когда рабочая сила ознакомилась с основными задачами по техническому обслуживанию, мы можем приступить к производству всех компонентов для современного истребителя."
  CHI_local_bomber_production:0 "Местное производство бомбардировщиков"
  CHI_local_bomber_production_desc:0 "После того, как мы освоим технологии производства одномоторных самолетов, мы можем попытаться разработать и производить более тяжелые многомоторные модели для поддержки с воздуха."
  CHI_the_hump:0 "Горб"
  CHI_the_hump_desc:0 "Воздушно-десантная операция через Гималаи является плохой заменой другим видам транспорта, но ее намного труднее сорвать."
  CHI_chinese_expeditionary_force:0 "Китайские экспедиционные силы"
  CHI_chinese_expeditionary_force_desc:0 "Чтобы лучше скоординировать наши действия с нашими союзниками, американцы прислали одного из генералов для руководства объединенными силами."
  CHI_the_chu_x_po:0 "Чжу X-PO"
  CHI_the_chu_x_po_desc:0 "Chu X-PO - вершина китайского производства. Первый истребитель собственной разработки и производства, способный противостоять любому врагу."
  CHI_mission_to_the_us:0 "Миссия в США"
  CHI_mission_to_the_us_soong_us_decision:0 "Пока §YСун Мэйлин§! является §YПолитическим советником§!, США смогут поддерживать нашу войну против §YЯпонии§!"
  CHI_mission_to_the_us_desc:0 "У Китая давно есть надежные союзники в США. Они - лучший шанс получить нужную нам поддержку."
  CHI_hire_chennault:0 "Принять Ченнолта"
  CHI_hire_chennault_desc:0 "Клэр Ченнолт - американский теоретик воздушного боя, который выразил желание работать на нас. Мы должны нанять его, чтобы возродить наши ВВС."
  CHI_invite_the_flying_tigers:0 "Пригласить Летающих Тигров"
  CHI_invite_the_flying_tigers_desc:0 "Наши друзья в Америке организовали группу волонтеров-пилотов и купили несколько современных самолетов, чтобы поддержать нас. Нам нужно лишь сказать свое слово."
  CHI_sino_american_cooperative_organization:0 "Сино-американская кооперативная организация"
  CHI_sino_american_cooperative_organization_desc:0 "Американская разведка готова работать с нами, чтобы организовать специальные операции за линией фронта. Это может помочь нам развить собственные возможности в этой сфере."
  CHI_light_cruiser_project:0 "Проект легкого крейсера"
  CHI_light_cruiser_project_desc:0 "Первый шаг в создании мощного флота - модернизация крейсерского флота. Наш первый проект не должен быть слишком амбициозным."
  CHI_heavy_cruiser_project:0 "Проект по созданию тяжелого крейсера"
  CHI_heavy_cruiser_project_desc:0 "Благодаря успеху предыдущей конструкции крейсера мы можем масштабировать его и улучшить его характеристики, создав более мощный корабль для защиты наших флотов."
  CHI_naval_aviation:0 "Морская авиация"
  CHI_naval_aviation_desc:0 "Будущее военно-морских действий - авианосец. Мы никогда не будем считаться настоящей морской державой, если у нас не будет собственных авианосцев."
  CHI_carrier_air_wing:0 "Авиационное крыло авианосца"
  CHI_carrier_air_wing_desc:0 "Авианосец хорош настолько, насколько хороши самолеты, которые с него взлетают. Мы должны убедиться, что это самые лучшие и современные типы самолетов."
  CHI_investment_into_shipbuilding:0 "Инвестиции в судостроение"
  CHI_investment_into_shipbuilding_desc:0 "Для большого флота нужна крупная промышленная база. Нам следует привлечь иностранных инвесторов, чтобы они помогли нам построить наши верфи."
  CHI_order_destroyers:0 "Заказать эсминцы"
  CHI_order_destroyers_desc:0 "Первым шагом к перевооружению флота должно стать производство небольшой группы эсминцев."
  CHI_train_marines:0 "Обучить морских пехотинцев"
  CHI_train_marines_desc:0 "Наша протяженная береговая линия уязвима для вражеских высадок, но она также дает возможность для атаки с неожиданного направления, если враг вторгнется по суше."
  CHI_collaboration_with_the_japanese:0 "Сотрудничество с японцами"
  CHI_collaboration_with_the_japanese_desc:0 "Независимо от их планов в отношении Китая японцы ясно дали понять, что готовы работать с нами, если мы проявим должное уважение."
  CHI_modern_submarines:0 "Современные подлодки"
  CHI_modern_submarines_desc:0 "Японцы не желают передавать нам технические знания, необходимые для противостояния их флоту в открытом бою, но они рассматривают подводную войну как вспомогательное средство. Нам, конечно, не обязательно разделять это мнение."
  CHI_coastal_patrol_planes:0 "Береговые патрульные самолеты"
  CHI_coastal_patrol_planes_desc:0 "Наше длинное побережье можно эффективно патрулировать только с воздуха. Современные морские бомбардировщики позволят нам защищать наши берега, не тратя слишком много ресурсов."
  CHI_three_principles_of_the_people:0 "Три народных принципа"
  CHI_three_principles_of_the_people_desc:0 "Основатель республики д-р Сунь Ятсен установил три фундаментальных принципа, которые должны ее определять: Миньцзу, Миньцюань и Миньшэн - национализм, демократия и социальное благополучие."
  CHI_welfare:0 "Благосостояние"
  CHI_welfare_desc:0 "Современное государство заботится о своих гражданах, так что в случае необходимости граждане смогут и захотят его защитить."
  CHI_refugee_relief_agency:0 "Агентство по оказанию помощи беженцам"
  CHI_refugee_relief_agency_desc:0 "В связи с войной миллионы людей остались без крова. Мы создадим агентство, которое поможет им найти новое место жительства."
  CHI_land_tax_reform:0 "Реформа земельного налога"
  CHI_land_tax_reform_desc:0 "Нашей финансовой системе нужна срочная реформа. И её частью должна стать необходимость расширения налоговой базы."
  CHI_refugee_resettlement:0 "Расселение беженцев"
  CHI_refugee_resettlement_desc:0 "Миллионы отчаявшихся и бездомных беженцев, порождённых войной, нуждаются в убежище. Предоставив им кров на нашей территории, мы сможем использовать их как резерв пополнения нашей армии и экономики."
  CHI_new_life_movement:0 "Движение за новую жизнь"
  CHI_new_life_movement_desc:0 "Четыре добродетели — мораль, честность, справедливость и верность — отныне будут вести наших граждан к более совершенной и продуктивной жизни."
  CHI_unemployment_assistance:0 "Помощь по безработице"
  CHI_unemployment_assistance_desc:0 "Безработица никогда не должна приводить граждан к нищете и безвыходности. Голод — лучший союзник коммунистов."
  CHI_free_hospitals:0 "Бесплатные больницы"
  CHI_free_hospitals_desc:0 "Великая нация не бросает своих граждан во время их болезней. Создавая всеобъемлющую систему здравоохранения, мы обеспечим улучшение общего здоровья нашего населения. Они сплотятся, чтобы защитить её."
  CHI_rural_schooling:0 "Обучение в сельской местности"
  CHI_rural_schooling_desc:0 "Образованное население — ключ к модернизации нации. Мы не можем полагаться на небольшую группу образованных администраторов, а должны нести дух знаний и науки в каждую деревню."
  CHI_democracy:0 "Демократия"
  CHI_democracy_desc:0 "Путь, начатый доктором Сунь Ятсеном, в конечном итоге должен привести к республике. Несомненно, это будет долгий путь, но мы пройдем его шаг за шагом."
  CHI_constitutional_reform:0 "Конституционная реформа"
  CHI_constitutional_reform_desc:0 "Проблемы, с которыми мы сталкиваемся сегодня, частично проистекают из отсутствия конституции, которая отражала бы реалии в Китае. Мы должны исправить это."
  CHI_republicanism:0 "Республиканизм"
  CHI_republicanism_desc:0 "Многие на Западе задаются вопросом, искренни ли мы в намерении стать республикой по западной модели. Мы должны сделать публичное заявление о своих намерениях."
  CHI_inter_party_coordination_council:0 "Координационный совет между партиями"
  CHI_inter_party_coordination_council_desc:0 "Первым шагом к превращению нашей страны в функционирующую многопартийную демократию и прекращению необходимого управления народом станет организация, которая позволит другим заинтересованным сторонам высказывать свое мнение при принятии политических решений."
  CHI_judicial_yuan:0 "Судебный юань"
  CHI_judicial_yuan_desc:0 "Доктор Сунь Ятсен представлял себе современную республику с разделением властей. Наша судебная система должна быть независимой от внешнего влияния и выносить решения на основе закона и только закона."
  CHI_control_yuan:0 "Контрольный юань"
  CHI_control_yuan_desc:0 "Коррупция неизбежна в любом правительстве. Эффективное управление требует усилий по сдерживанию ее. Мы создадим отдельную ветвь власти, равную законодательной, исполнительной и судебной ветвям."
  CHI_examination_yuan:0 "Экзаменационный юань"
  CHI_examination_yuan_desc:0 "В течение тысячелетий китайские чиновники отбирались посредством строгих экзаменов. Возможно, тексты, которые использовались на экзаменах, изменились, но принцип остается тем же."
  CHI_executive_yuan:0 "Исполнительный юань"
  CHI_executive_yuan_desc:0 "Ядром правительства является исполнительная власть, которая исполняет законы. Поэтому логично, что её создание является первым шагом на пути к созданию функционирующего республиканского правительства."
  CHI_legislative_yuan:0 "Законодательный юань"
  CHI_legislative_yuan_desc:0 "Способность народа избирать орган, принимающий законы, по которым он живёт, является основой современной республики. Наш народ не должен обходиться без этого."
  CHI_nationalism:0 "Национализм"
  CHI_nationalism_desc:0 "Идея принадлежности к нации, а не к племени или религии, превращает группу людей в государство."
  CHI_foreign_threats:0 "Внешние угрозы"
  CHI_foreign_threats_desc:0 "Несколько лет назад японцы отобрали у нас Маньчжурию и создали марионеточное государство. Они не остановятся, пока не подчинят себе весь Китай. Мы должны быть готовы к тому, чтобы противостоять им, даже если это будет означать заключение сделок с местными влиятельными людьми."
  CHI_prioritize_the_interior:0 "Сделать упор на внутренние дела"
  CHI_prioritize_the_interior_desc:0 "Прежде чем даже думать о том, чтобы вернуть себе территории, отобранные у нас японцами, мы должны обезопасить наш тыл. Наша страна, раздробленная на множество враждующих друг с другом регионов, не выстоит."
  CHI_united_front:0 "Единый Фронт"
  CHI_united_front_desc:0 "Японцы уже наступают нам на пятки, поэтому мы должны быть готовы принять помощь, откуда бы она ни шла — даже от коммунистов."
  CHI_pick_a_fight_with_japan:0 "Спровоцируйте конфликт с Японией"
  CHI_pick_a_fight_with_japan_desc:0 "На протяжении долгих лет японцы предъявляли к нам одно требование за другим. Хватит. В следующий раз, как только они предъявят нам даже самое незначительное требование, мы не уступим ни пяди своей земли."
  CHI_anti_communism:0 "Антикоммунизм"
  CHI_anti_communism_desc:0 "Коммунизм представляет собой величайшую угрозу для нашей нации. Его необходимо искоренить беспощадно."
  CHI_subjugate_the_warlords:0 "Покорите военачальников"
  CHI_subjugate_the_warlords_desc:0 "В момент нашей слабости местные военачальники взяли под свой контроль значительные территории страны. Пора напомнить им, что они нам подчиняются — так или иначе."
  CHI_war_of_resistance:0 "Война сопротивления"
  CHI_war_of_resistance_desc:0 "Мы ещё не достаточно сильны, чтобы вести войну с Японией. Мы должны противостоять захватчикам до тех пор, пока не сможем снова перейти в наступление."
  CHI_industrial_evacuations:0 "Индустриальные эвакуации"
  CHI_industrial_evacuations_desc:0 "Современная война выигрывается на заводах. Армия без пушек - ничто, кроме группы людей в глупых шляпах."
  CHI_war_of_national_liberation:0 "Война за национальное освобождение"
  CHI_war_of_national_liberation_desc:0 "С поражением японского натиска мы можем перейти в наступление и освободить всю нашу территорию."
  CHI_scorched_earth_tactics:0 "Тактика выжженной земли"
  CHI_scorched_earth_tactics_desc:0 "В борьбе за национальное выживание нет ничего невозможного, и нужно рассматривать любые варианты."
  CHI_war_of_anti_imperialism:0 "Война против империализма"
  CHI_war_of_anti_imperialism_desc:0 "С освобождением нашей страны от угнетения, мы можем нацелить свои силы на вражеские границы, чтобы гарантировать, что нашествие с их стороны никогда не случится."
  CHI_forced_conscription:0 "Принудительный призыв"
  CHI_forced_conscription_desc:0 "Наши нынешние методы набора в армию не дают необходимого количества солдат. Поражение в этой войне будет означать уничтожение, поэтому мы должны потребовать ещё больше от своего народа."
  CHI_dare_to_die_corps:0 "Корпус Смертников"
  CHI_50_cheaper_force_attack:0 "§G-50%§! стоимость §YСиловых Атак§!\n"
  CHI_dare_to_die_corps_desc:0 "Борьба за республику уже создала много мучеников. К концу их будет ещё больше. Их жертвы будут вечно почитаться будущими поколениями."
  CHI_military_affairs_commission:0 "Комиссия по военным вопросам"
  CHI_military_affairs_commission_desc:0 "Наши военные продемонстрировали шокирующую некомпетентность. Реформа высшего командования — лишь первый шаг к решению проблемы."
  CHI_fortify_shanghai:0 "Укрепить Шанхай"
  CHI_fortify_shanghai_desc:0 "Если Япония нападет, первый удар придется на Шанхай. Мы должны быть готовы."
  CHI_army_reform:0 "Реформа армии"
  CHI_army_reform_desc:0 "Коррупция, некомпетентность и трусость процветают на всех уровнях командования в нашей армии. Решение этой проблемы займет много времени."
  CHI_bureau_of_investigation_and_statistics:0 "Бюро расследований и статистики"
  CHI_bureau_of_investigation_and_statistics_desc:0 "Мы не можем позволить предателям и шпионам разгуливать по нашей стране, пока мы вовлечены в войну за будущее нашей нации. Методы, используемые этим новым агентством, могут показаться неприятными, но работа должна быть выполнена."
  CHI_the_chinese_hindenburg_line:0 "Китайская линия Гинденбурга"
  CHI_the_chinese_hindenburg_line_desc:0 "Наши немецкие советники дали нам много полезных советов о том, как строить укрепления, извлеченные из уроков Великой войны. Любые попытки противника вырваться из Шанхая разобьются об эти укрепления."
  CHI_60_divisions_plan:0 "План 60 дивизий"
  CHI_60_divisions_plan_desc:0 "Вместо того, чтобы полагаться на людские массы для решения проблемы, наши иностранные советники предлагают радикально новый план: меньшие силы высокообученных дивизий, соответствующие противнику. Пилотный проект уже запущен.
  CHI_whampoa_military_academy:0 "Военная академия Вампу"
  CHI_whampoa_military_academy_desc:0 "Армия бесполезна без должного руководства. Если мы хотим превратить наши вооружённые силы в первоклассную армию, нам понадобятся хорошо обученные офицеры, чтобы руководить ей."
  CHI_unified_industrial_planning:0 "Единое промышленное планирование"
  CHI_unified_industrial_planning_desc:0 "Мы не должны задерживать нашу агрессивную программу индустриализации."
  CHI_expand_the_academica_sinica:0 "Расширение Academia Sinica"
  CHI_expand_the_academica_sinica_desc:0 "В течение тысячелетий Китай был лидером в области развития искусств и наук. Увеличение финансирования наших университетов — это всего лишь первый шаг к восстановлению этих позиций."
  CHI_chemical_research_institute:0 "Научно-исследовательский институт химии"
  CHI_chemical_research_institute_desc:0 "Хотя мы никогда не будем первыми использовать химическое оружие, мы всё же должны быть готовы защищаться от него в случае нападения. Мы должны финансировать новый научно-исследовательский институт для разработки необходимых методов и технологий."
  CHI_rural_reconstruction_movement:0 "Движение за возрождение деревни"
  CHI_rural_reconstruction_movement_desc:0 "Хотя мы добились большого прогресса в улучшении жизни нашего городского населения, их отделяют всего несколько километров от крестьян, живущих в условиях Средневековья. Мы обеспечим, чтобы каждый наш гражданин мог наслаждаться плодами нашего труда."
  CHI_mining_commission:0 "Горнодобывающая комиссия"
  CHI_mining_commission_desc:0 "Ресурсы имеют критическое значение для военных действий. Мы должны взять под контроль нашу горнодобывающую промышленность, чтобы обеспечить производство того, в чем мы нуждаемся."
  CHI_taiyuan_arsenal:0 "Арсенал Тайюань"
  CHI_taiyuan_arsenal_desc:0 "Арсенал Тайюань - одно из немногих мест в Китае, где может производиться тяжелое вооружение. Нам следует расширить его, чтобы обеспечить наши войска артиллерией и другим оружием."
  CHI_develop_the_hanyan_arsenal:0 "Развитие арсенала Ханян"
  CHI_develop_the_hanyan_arsenal_desc:0 "Арсенал Ханян долгое время снабжает китайские армии оружием. Его расширение обеспечит сохранение такого положения и в будущем."
  CHI_financial_policy:0 "Финансовая политика"
  CHI_financial_policy_desc:0 "Государственные финансы не особенно устойчивы, а амбициозные правительственные программы вызывают угрозу безудержной гиперинфляции. Финансовая реформа должна стать одним из наших главных приоритетов."
  CHI_price_controls:0 "Государственное регулирование цен"
  CHI_price_controls_desc:0 "Первый шаг к тому, чтобы держать инфляцию под контролем - гарантировать, что ключевые товары продаются по фиксированным ценам. Это будет непопулярно среди купеческого класса."
  CHI_grain_tax:0 "Налог на зерно"
  CHI_grain_tax_desc:0 "Выпускаемые правительством банкноты имеют все меньшую покупательную способность. Скоро мы больше не сможем кормить нашу армию. Мы могли бы ввести новый закон, согласно которому крестьяне должны платить налоги зерном, таким образом обходя рынок. Им это не понравится, и есть опасность, что это приведет к полномасштабному голоду."
  CHI_reform_the_national_bank:0 "Реформа Национального банка"
  CHI_reform_the_national_bank_desc:0 "Новый Национальный банк будет координировать всю финансовую деятельность правительства и предоставит необходимые средства."
  CHI_forced_loans:0 "Принудительные займы"
  CHI_forced_loans_desc:0 "В период относительного мира купцы и промышленники накопили неслыханное богатство. Наверняка, будет нелишним попросить их часть этого богатства сделать доступным правительству в это отчаянное время, с обещанием быстрой выплаты, как только позволит ситуация."
  CHI_purchase_tanks_tt:0 "Мы получим 100 старых легких танков от нашего сторонника."
  CHI_purchase_fighters_tt:0 "Мы получим 50 старых истребителей от нашего сторонника. Обеспечение поддержки Великобритании и США обеспечит закупки истребителей у обеих стран."
  PRC_strengthen_the_central_secretariat:0 "Усиление Центрального секретариата"
  PRC_strengthen_the_central_secretariat_desc:0 "После Великого похода мы должны реорганизовать нашу политическую организацию, чтобы создать государство, способное конкурировать с националистами."
  PRC_marxist_orthodoxy:0 "Марксистское православие"
  PRC_marxist_orthodoxy_desc:0 "Ключ к достижению настоящего коммунизма - как можно более полно внедрить учение Маркса."
  PRC_soviet_leadership:0 "Советское руководство"
  PRC_soviet_leadership_desc:0 "Советский Союз является ведущей страной на пути к полному коммунизму. Мы должны признать это и учиться на его примере."
  PRC_soviet_economic_aid:0 "Советская экономическая помощь"
  PRC_soviet_economic_aid_desc:0 "На преодоление последствий Великого похода уйдут поколения, если мы не получим помощи извне. Необходимо связаться с Советами и запросить экономическую помощь."
  PRC_internationalism:0 "Интернационализм"
  PRC_internationalism_desc:0 "Рабочие и крестьяне всего мира должны объединиться, чтобы сбросить свои оковы. Вместе мы построим лучшее будущее."
  PRC_agrarian_socialism:0 "Аграрный социализм"
  PRC_agrarian_socialism_desc:0 "Китай не похож на индустриальные страны мира. Ожидать коммунистической революции в том виде, как представлял Маркс, — значит не понимать, в каком положении находится наша страна."
  PRC_rectification_campaign:0 "Кампания по исправлению ошибок"
  PRC_rectification_campaign_desc:0 "Появилось несколько ошибочных представлений о том, каким должен быть наш путь борьбы. Мы должны дать заблуждающимся товарищам возможность признать ошибочность своего пути."
  PRC_maoism:0 "Маоизм"
  PRC_maoism_desc:0 "Великий председатель потратил много месяцев, разрабатывая свои политические теории в целостную идеологию, которая поведёт нашу страну вперед."
  PRC_socialism_with_chinese_characteristics:1 "Марксизм с китайской спецификой"
  PRC_socialism_with_chinese_characteristics_desc:1 "Несмотря на всю свою гениальность, Маркс писал, исходя из европейской перспективы. Наша политика социализма будет учитывать особенности положения Китая."
  PRC_proclaim_the_peoples_republic:0 "Провозгласить Народную республику"
  PRC_proclaim_the_peoples_republic_desc:0 "После победы над националистами настало время занять наше законное место как легитимного правительства Китая. Много работы ещё предстоит сделать, но будущее выглядит светлее, чем когда-либо."
  PRC_socialist_market_economy:0 "Социалистическая рыночная экономика"
  PRC_socialist_market_economy_desc:0 "Путь к социализму и коммунизму по определению должен проходить через капитализм. Китай никогда не развивал надлежащую капиталистическую рыночную экономику, что делает прогресс к социализму практически невозможным. Мы должны сначала развить капиталистические способы производства, прежде чем мы сможем двигаться дальше."
  PRC_social_democracy:0 "Социал-демократия"
  PRC_social_democracy_desc:0 "Радикальная политика партии сделала положение дел только хуже, а не лучше. Националисты, при всех их недостатках, являются нашими союзниками в борьбе за лучшее будущее. Мы должны двигаться к ним в политической сфере."
  PRC_coalition_government:0 "Коалиционное правительство"
  PRC_coalition_government_desc:0 "Хотя до объединения нашей страны ещё далеко, формирование совместного правительства с националистами сгладит этот путь."
  PRC_purge_the_radicals:0 "Очистить от радикалов"
  PRC_purge_the_radicals_desc:0 "Некоторые элементы в нашей партии по-прежнему верят в доктрину классовой борьбы и противостояния так называемому эксплуататорскому классу. Они должны уйти.
  PRC_strengthen_the_left_wing_of_the_kmt:0 "Укрепить левое крыло Гоминьдана"
  PRC_strengthen_the_left_wing_of_the_kmt_desc:0 "У националистов свои проблемы с внутренними фракциями, которые саботируют усилия по достижению соглашения между нашими режимами. Мы должны сделать все возможное, чтобы наши союзники в Гоминьдане победили в этой борьбе за власть."
  PRC_remove_chiang_kai_shek:0 "Убрать Чан Кайши"
  PRC_remove_chiang_kai_shek_desc:0 "Несмотря на наши усилия, генералиссимус по-прежнему считает нас коммунистами в душе. Его активное сопротивление стало проблемой. Необходимо принять меры."
  PRC_national_leadership:0 "Национальное руководство"
  PRC_national_leadership_desc:0 "С уходом Кайшика исчезла последняя оппозиция объединению. Само собой разумеется, что мы должны взять на себя ведущую роль в этом объединенном правительстве."
  PRC_land_redistribution:0 "Перераспределение земли"
  PRC_land_redistribution_desc:0 "На протяжении веков люди, работающие на земле, вынуждены были платить аренду людям, которым она на самом деле принадлежит. Мы это изменим."
  PRC_the_yanan_base_area:0 "Базовый район Яньань"
  PRC_the_yanan_base_area_desc:0 "Фундаментом нашей революции является район Яньань. Если мы хотим победить в предстоящей борьбе, его необходимо расширить и усовершенствовать."
  PRC_prepare_for_war_with_japan:0 "Подготовиться к войне с Японией"
  PRC_prepare_for_war_with_japan_desc:0 "Японские милитаристы представляют наибольшую угрозу для нашей нации. Они хотят ее поделить и эксплуатировать так, как ни одно китайское правительство никогда себе не представляло. Борьба против националистов меркнет в сравнении с этим."
  PRC_government_of_national_defense:0 "Правительство Национальной обороны"
  PRC_government_of_national_defense_desc:0 "Разделенная страна — страна, приглашающая к поражению. Мы должны объединиться с националистами для координации нашей обороны."
  PRC_confrontation_with_the_warlords:0 "Противостояние с военачальниками"
  PRC_confrontation_with_the_warlords_desc:0 "Некоторые силы в Китае игнорируют центральное правительство, отказываясь выбирать стороны в борьбе. Некоторые из них могут даже тайно лелеять замыслы о захвате страны или сотрудничестве с японцами. Их необходимо привести в соответствие."
  PRC_anti_japanese_expedition:0 "Анти-японская экспедиция"
  PRC_anti_japanese_expedition_desc:0 "Столкновение с японцами в открытом бою в нашем нынешнем положении будет скорее глупостью, чем смелостью. Сначала нам нужно подготовить почву, послав небольшие группы на территорию противника для создания базовых районов. Когда придет время, мы призовем к восстанию."
  PRC_revolutionary_military_commission:0 "Революционный военный совет"
  PRC_revolutionary_military_commission_desc:0 "Революционную борьбу против наших врагов необходимо координировать через специально созданный орган."
  PRC_provoke_japan:0 "Спровоцировать Японию"
  PRC_provoke_japan_desc:0 "В течение трех поколений мы жили под угрозой со стороны Японии. Противодействие японской экспансии сделает нас героями в глазах китайского народа. И если японцы не хотят дать нам нужную нам войну, то мы заставим их."
  PRC_protracted_warfare:0 "Затяжная война"
  PRC_protracted_warfare_desc:0 "Мы должны вести войну на своих условиях. У Китая много людей и много времени. Вступить с противником в открытый бой было бы самоубийством."
  PRC_mobile_warfare:0 "Маневренная война"
  PRC_mobile_warfare_desc:0 "Мы не можем вечно прятаться в горах и лесах. Пришло время дать отпор врагу и показать миру, что мы не боимся сражаться с ними открыто."
  PRC_peoples_war:0 "Народная война"
  PRC_peoples_war_desc:0 "Другие страны могут верить, что технологии и огневая мощь выигрывают войны. Мы знаем лучше. Никакая технология не устоит перед полным решимости народом, готовым к самопожертвованию."
  PRC_100_regiments_campaign:0 "Кампания 100 полков"
  PRC_100_regiments_campaign_desc:0 "Сейчас мы сосредоточились на мелких боях и стычках. Наши враги считают нас слабыми и ничтожными. Забывчивость в чувстве защищенности, они будут плохо подготовлены к крупному наступлению."
  PRC_central_military_commission:0 "Центральный военный комитет"
  PRC_central_military_commission_desc:0 "Укрепив свои позиции, мы можем перейти от революционной борьбы за выживание к борьбе за национальное лидерство."
  PRC_peoples_liberation_army:0 "Народно-освободительная армия Китая"
  PRC_peoples_liberation_army_desc:0 "Красная армия Китая добилась больших успехов. В будущем она одержит ещё большие победы в борьбе за освобождение нашего народа."
  PRC_peoples_volunteer_army:0 "Народно-освободительная армия Китая"
  PRC_peoples_volunteer_army_desc:0 "Борьба за освобождение рабочих и крестьян мира ведётся во многих странах. Не всегда целесообразно прямо вмешиваться в эти конфликты. Иногда достаточно небольших сил, чтобы изменить баланс сил."
  PRC_military_intelligence_department:0 "Разведывательное управление"
  PRC_military_intelligence_department_desc:0 "У нас много друзей среди населения, которые предоставляют нам ценную информацию. Врагов у нас ещё больше. Мы должны создать организацию, которая разделит одних и других."
  PRC_central_security_bureau:0 "Центральное бюро безопасности"
  PRC_central_security_bureau_desc:0 "Мы не можем допустить, чтобы контрреволюция укоренилась даже в самой маленькой деревне. Наша цель - найти каждого предателя, прежде чем он сможет нанести ущерб."
  PRC_focus_on_china:0 "Сконцентрироваться на Китае"
  PRC_focus_on_china_desc:0 "Мы не можем противостоять японцам, пока мы ещё воюем с националистами и военачальниками. Сначала мы должны победить их, а потом мы сможем сразиться с японцами."
  PRC_exploit_the_weak_neighbours:0 "Использовать преимущества у слабых соседей"
  PRC_exploit_the_weak_neighbours_desc:0 "Наши соседи ослаблены коррупцией и междоусобицами. Это представляет собой прекрасную возможность расширить свою территорию."
  PRC_infiltration:0 "Инфильтрация"
  PRC_infiltration_desc:0 "Националисты хотели бы, чтобы мы сражались с ними открыто. Мы не должны поддаваться искушению. Мы отправим небольшие группы солдат на вражескую территорию для создания базовых районов. Когда наступит подходящее время, мы спровоцируем восстание и застанем националистов врасплох."
  PRC_enforce_the_three_rules:0 "Соблюдение трех правил"
  PRC_enforce_the_three_rules_desc:0 "1: Следуйте приказам.\n2: Не воруйте у крестьян.\n3: Сдавайте все захваченное у противника.\nС помощью этих простых правил мы покажем людям, что мы на их стороне."
  PRC_permit_opium_trade:0 "Разрешить торговлю опиумом"
  PRC_permit_opium_trade_desc:0 "Несмотря на печальные побочные эффекты, разрешение крестьянам выращивать мак принесет нам необходимые средства для снабжения наших армий."
  PRC_ban_the_opium_trade:0 "Запретить торговлю опиумом"
  PRC_ban_the_opium_trade_desc:0 "Опиум был инструментом, с помощью которого западные державы поставили нас на колени. Мы не можем позволить этому злу распространиться."
  PRC_abolish_the_land_rent:1 "Отменить арендную плату за землю"
  PRC_abolish_the_land_rent_desc:0 "Частная собственность на землю - абсурдная концепция. Земля принадлежит тому, кто ее обрабатывает. Разрешение крестьянам самоорганизоваться обеспечит их поддержку."
  PRC_literacy_programs:0 "Программы по ликвидации неграмотности"
  PRC_literacy_programs_desc:0 "Первый шаг к созданию современного общества - убедиться, что все его граждане могут понимать текущие вопросы и помогать решать их."
  PRC_china_medical_university:0 "Китайский медицинский университет"
  PRC_china_medical_university_desc:0 "Гигиена и медицинское обслуживание позволят нашей армии оставаться на поле боя и дадут нам возможность улучшить жизнь наших граждан. Мы должны обеспечить разработку новых методов в этих областях и обучить им наше население."
  PRC_form_the_academy_of_sciences:0 "Основать Академию наук"
  PRC_form_the_academy_of_sciences_desc:0 "Мы объединим все наши исследовательские учреждения и университеты и создадим новую организацию для более эффективного управления ими."
  JAP_the_unthinkable_option:0 "Невероятный вариант"
  JAP_the_unthinkable_option_desc:0 "Будущее нашей нации требует пути, который никогда не был задуман нашими лидерами. Теперь этот вариант следует тщательно обдумать."
  JAP_approach_the_young_officers:0 "Подойти к молодым офицерам"
  JAP_approach_the_young_officers_desc:0 "Старшие поколения слишком твердо стоят на своем, чтобы их легко склонить к новому образу мышления. Вместо этого мы начнем с более молодых поколений."
  JAP_approach_the_young_officers_tt:0 "Получает 3 генералов-коммунистов.\n"
  JAP_exchange_the_exiles:0 "Обменяться ссыльными"
  JAP_if_man_accepts:1 "Если §HМаньчжоу-го§! согласится, произойдет следующее:\n"
  JAP_exchange_the_exiles_desc:0 "Раньше мы отправляли своих левоориентированных офицеров и чиновников в неофициальную ссылку в Маньчжурию, а теперь вместо них мы обменяем их на более правых."
  JAP_open_up_the_universities:0 "Открываем университеты"
  JAP_open_up_the_universities_desc:0 "Все должны получить возможность учиться независимо от их происхождения или социального положения."
  JAP_cast_the_die:0 "Бросить кости"
  JAP_cast_the_die_desc:0 "Наша политическая и военная база достаточно защищены. Пришло время воспользоваться судьбой!"
  cast_the_die_TT:0 "§RЗахват Токио быстро закончит гражданскую войну.§!\n"
  JAP_the_fate_of_the_imperial_family:0 "Судьба императорской семьи"
  JAP_the_fate_of_the_imperial_family_desc:0 "Пришло время увидеть последние следы наследственного правления в Японии. Мы должны решить, какая судьба постигнет императора и его семью."
  JAP_rebuild_the_civil_service:0 "Восстановить государственную службу"
  JAP_rebuild_the_civil_service_desc:0 "Чтобы правильно управлять нашим народом, мы восстановим государственную службу с наиболее способными людьми."
  JAP_reeducation_campaign:0 "Кампания по перевоспитанию"
  JAP_reeducation_campaign_desc:0 "После нашей великой революции стало распространённым волнение. Мы должны перевоспитать народ, чтобы усилить поведение, которое мы считаем наиболее приемлемым."
  JAP_finish_the_fight:0 "Завершаем борьбу"
  JAP_finish_the_fight_desc:0 "Мы должны начать борьбу со своей старой колонией и устранить последний оплот наших японских идеологических противников."
  JAP_join_comintern:0 "Наш главный враг?"
  JAP_join_comintern_desc:0 "Мы не можем противостоять миру в одиночку. Мы отложим старые разногласия и встанем вместе с родиной коммунизма, чтобы защитить революцию!"
  JAP_red_brigades:0 "Красные бригады"
  JAP_red_brigades_desc:0 "Каждый мужчина и женщина должны выполнять свой долг по защите государства. Мы обеспечим им такую возможность."
  JAP_communist_volunteers:0 "Коммунистические добровольцы"
  JAP_communist_volunteers_desc:0 ""
  JAP_reddoborantias:0 "Красные добровольцы"
  JAP_reddoborantias_desc:0 "Наша борьба не заканчивается здесь. Мы должны помогать другим нациям. Наши лучшие и ярчайшие отправятся, чтобы отстаивать наше дело в тех странах, которые приняли революцию!"
  JAP_asian_communist_solidarity:0 "Азиатская коммунистическая солидарность"
  JAP_asian_communist_solidarity_tt:0 "Пригласить §H[WTT_communist_china.GetNameWithFlag]§! в нашу фракцию."
  JAP_asian_communist_solidarity_desc:0 "Мы должны держаться вместе с нашими азиатскими братьями. Западная форма коммунизма здесь неуместна, но вместе с нашими соседями мы можем распространить её версию, которая соответствует азиатским потребностям."
  JAP_nationalize_the_zaibatsus:0 "Национализировать дзайбацу"
  JAP_nationalize_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны давно обладают беспрецедентной политической и экономической властью. Этому приходит конец. Контроль государства не будет поставлен под сомнение."
  JAP_people_owned_mines:0 "Народные рудники"
  JAP_people_owned_mines_desc:0 "Жителям будет разрешено владеть долями в шахтах, в которых они работают, что повысит мотивацию и эффективность рабочих."
  JAP_public_works:0 "Общественные работы"
  JAP_public_works_desc:0 "Новая серия общественных работ обеспечит всех работой, а также улучшит национальную инфраструктуру."
  #изменено с Tokyo, чтобы не лишать игрока свободных слотов
  JAP_tokyo_aluminum_plant:0 "Алюминиевый завод Нагоя"
  JAP_tokyo_aluminum_plant_desc:0 "Мы будем использовать силу наших рабочих, чтобы повысить самодостаточность страны."
  JAP_purge_the_kodoha_faction:0 "Зачистить фракцию Кодоха"
  JAP_purge_the_kodoha_faction_desc:0 "Появилась новая фракция, которая намеревается взять под контроль правительство и напасть на Советский Союз. Мы должны устранить их, прежде чем они нанесут слишком большой ущерб."
  JAP_liaison_conference:0 "Конференция по связям"
  JAP_liaison_conference_desc:0 "Отправляя связных из всех ветвей власти и вооруженных сил на центральную конференцию, мы можем значительно повысить скорость принятия решений."
  JAP_greater_east_asian_co_prosperity_sphere:0 "Великая восточноазиатская сфера сопроцветания"
  JAP_greater_east_asian_co_prosperity_sphere_desc:0 "Время западного империализма подошло к концу. Народы Азии должны объединиться и стать сильным, единым континентом под нашим руководством. Азия для азиатов!"
  JAP_intervene_in_china:1 "Инцидент на мосту Марко Поло"
  JAP_intervene_in_china_desc:1 "[Root.GetNameDefCap] бедна ресурсами, но у наших соседей их достаточно. Мы должны забрать у них то, чего нам не хватает, и только найти причину для этого. Эту причину могут предоставить несколько предприимчивых солдат, после чего у Императора не будет выбора, кроме как согласиться на войну, какой бы неподготовленной она ни была..."
  JAP_secure_china:0 "Обеспечить Китай"
  JAP_secure_china_desc:0 "Китайское сопротивление оказывается упорным и непрекращающимся. Мы должны удвоить наши усилия по умиротворению материка со всей возможной поспешностью."
  JAP_develop_chinese_resources:0 "Развивать китайские ресурсы"
  JAP_develop_chinese_resources_desc:0 "Мы должны развивать богатые китайские ресурсы, которые попали в наши руки, чтобы они могли быть полезны в следующей войне."
  JAP_strike_south_doctrine:0 "Доктрина удара с юга"
  JAP_strike_south_doctrine_desc:0 "Хотя Китай и богат, но не обладает всеми необходимыми нам ресурсами. Не так далеко на юге, однако, находятся Голландская Ост-Индия и британские колонии Малайя и Борнео. Для настоящего самообеспечения мы должны вырвать контроль над этими территориями из рук европейских империалистов."
  JAP_non_aggression_pact_with_the_soviet_union:0 "Пакт о ненападении с Советским Союзом"
  JAP_non_aggression_pact_with_the_soviet_union_desc:0 "Наша северная граница должна быть защищена, если мы хотим иметь свободу действий на юге. Мы начнем переговоры с [SOV.GetNameDef] немедленно."
  JAP_bypass_the_philippines:0 "Обойти Филиппины"
  JAP_bypass_the_philippines_desc:0 "Филиппины представляют собой нежелательное отвлечение на пути к нашей истинной цели. Пока мы их проигнорируем."
  JAP_secure_the_philippines:0 "Обезопасить Филиппины"
  JAP_secure_the_philippines_desc:0 "Филиппины - необходимая база на пути к нашей истинной цели. Мы должны обеспечить ее для будущих военных операций."
  JAP_strike_on_the_southern_resource_area:0 "Удар по южному ресурсному району"
  JAP_strike_on_the_southern_resource_area_desc:0 "Пришло время привести наш план в действие. Мы нанесем удар на юг и захватим богатые ресурсами западные колонии."
  JAP_alliance_with_siam:0 "Союз с Сиамом"
  JAP_alliance_with_siam_desc:0 "Сиам находится в выгодном месте, чтобы помочь нам в предстоящей войне с западными державами. Получив их на нашей стороне, мы значительно облегчим неизбежное вторжение в Малайю и, следовательно, в Ост-Индию."
  JAP_exploit_the_southern_resource_area:0 "Эксплуатировать южный ресурсный район"
  JAP_exploit_the_southern_resource_area_desc:0 "Мы должны значительно расширить эксплуатацию богатых ресурсов Ост-Индии, чтобы накормить наши войска во время войны."
  JAP_sign_tripartite_pact:0 "Подписать Тройственный пакт"
  JAP_sign_tripartite_pact_bypass_tt:0 "Либо Германия, либо Италия не имеют фашистского правительства, либо мы находимся в состоянии войны с одной из них."
  JAP_sign_tripartite_pact_desc:0 "Стоящая перед нами задача может оказаться не по зубам. Нам следует связаться с другими правительствами с аналогичными целями, чтобы добиться некоторой степени сотрудничества."
  JAP_guide_the_zaibatsus:0 "Направляй дзайбацу"
  JAP_guide_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны давно обладают беспрецедентной политической и экономической властью. При определенной ловкости мы можем направить их усилия в свою пользу."
  JAP_nationalize_war_industry:0 "Национализируйте военную промышленность"
  JAP_nationalize_war_industry_desc:0 "Усиление государственного контроля над нашей военной промышленностью позволит повысить эффективность и, следовательно, производительность."
  JAP_coal_liquification:0 "Жижевание угля"
  JAP_coal_liquification_desc:0 "[JAP.GetNameDefCap] испытывает дефицит нефти, поэтому мы должны удвоить наши усилия в области синтетической нефти."
  JAP_national_mobilization_law:0 "Закон о всеобщей мобилизации"
  JAP_national_mobilization_law_desc:0 "Новое законодательство сделает военную службу более повсеместной, тем самым привьет народу чувство долга, а также даст понять им необходимость войны."
  JAP_national_research_policy:0 "Политика национальных исследований"
  JAP_national_research_policy_desc:0 "Поддержка правительства и контроль над нашими научно-исследовательскими институтами обеспечат нам большую гибкость и производительность в наших программах НИОКР."
  JAP_imperial_arsenals:0 "Императорские арсеналы"
  JAP_imperial_arsenals_desc:0 "Усиление имперского контроля над нашей военной промышленностью во многом повысит эффективность и, следовательно, продуктивность."
  JAP_national_defense_state:0 "Государственная оборона"
  JAP_national_defense_state_desc:0 "Всех граждан следует заставить осознать насущную необходимость превратить наш народ в оплот, способный выдержать любое нападение."
  JAP_spiritual_mobilization:0 "Духовная мобилизация"
  JAP_spiritual_mobilization_desc:0 "Развивая те положения синтоизма, которые играют на чувстве воинского долга у людей, мы можем увеличить количество новобранцев."
  JAP_warrior_spirit:0 "Дух воина"
  JAP_warrior_spirit_desc:0 "Государственный синтоизм позволяет нам внушить людям необходимость пожертвовать собой ради блага государства и императорской семьи."
  JAP_strengthen_the_divine_wind:0 "Укрепление божественного ветра"
  JAP_strengthen_the_divine_wind_effect:0 "Позволяет производить §HYokosuka MXY7 Ohka§!"
  JAP_strengthen_the_divine_wind_effect_bba:0 "Включает модуль §HФиксированный взрывной заряд§!"
  JAP_strengthen_the_divine_wind_desc:0 "Камикадзе, тактика подразделения специальных атак, превратила самоубийственные атаки из импровизированных крайних мер в установленную доктрину. С новыми самолетами, по сути управляемыми ракетами, эти атаки станут неудержимыми."
  JAP_support_the_kodoha_faction:0 "Поддержать фракцию Kodoha"
  JAP_support_the_kodoha_faction_desc:0 "Появилась новая фракция, намеренная взять под контроль правительство и напасть на Советский Союз. Ради Императора и будущего Империи мы должны обеспечить победу этой фракции!"
  JAP_challenge_the_zaibatsus:0 "Бросить вызов дзайбацу"
  JAP_challenge_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической властью. Мы должны напомнить им, что они по-прежнему подчиняются воле Императора."
  JAP_showa_restoration:0 "Реставрация Сёва"
  JAP_showa_restoration_desc:0 "Время фиктивных лиц давно прошло, и сам Император должен взять на себя прямое управление государством. Только тогда наша Империя сможет противостоять западным империалистам."
  JAP_modern_shogunate:0 "Современный сёгунат"
  JAP_modern_shogunate_desc:0 "Император должен оставаться в более церемониальной роли с сильными посредниками, которые действуют от его имени. Это, безусловно, позволит словам Императора распространиться дальше и шире."
  JAP_prepare_for_war_with_the_soviet_union:0 "Подготовка к войне с Советским Союзом"
  JAP_prepare_for_war_with_the_soviet_union_desc:0 "Коммунистическая угроза на наших северных границах должна быть устранена. Мы должны начать подготовку к войне с [SOV.GetNameDef]."
  SOV_communist_threat:0 "коммунистический"
  SOV_fascist_threat:0 "фашистский"
  SOV_country_threat:0 "[SOV.GetAdjective]"
  SOV_communist_threatAlt:0 "большевистский"
  SOV_fascist_threatAlt:0 "империалистический"
  JAP_join_the_london_naval_treaty:0 "Присоединиться к Лондонскому морскому договору"
  JAP_join_the_london_naval_treaty_desc:0 "Нам нужно защитить свои фланги, если мы хотим сразиться с медведем. Если подписание документа, регулирующего наращивание нашего военно-морского флота, принесет нам мир, пусть будет так."
  JAP_build_up_the_manchurian_army:0 "Построить Маньчжурскую армию"
  JAP_build_up_the_manchurian_army_desc:0 "[MAN.GetNameDefCap] будут на переднем крае любой северной войны. Мы должны обеспечить, чтобы они были достаточно сильны, чтобы отразить любые потенциальные вражеские атаки."
  JAP_non_aggression_pact_with_china:0 "Пакт о ненападении с Китаем"
  JAP_non_aggression_pact_with_china_desc:0 "Хотя наши отношения с Китаем исторически были напряженными, мягко говоря, теперь нам нужен пакт о ненападении с ними, чтобы освободить войска для нашего северного наступления."
  JAP_create_a_manchurian_imperial_air_force:0 "Создать Маньчжурские императорские ВВС"
  JAP_create_a_manchurian_imperial_air_force_desc:0 "Превосходство в воздухе будет ключом к победе в войне. Если у [MAN.GetNameDef] будут собственные военно-воздушные силы, это значительно улучшит наше положение в воздухе."
  JAP_technological_exchange:0 "Технологический обмен"
  JAP_technological_exchange_desc:0 "Нам нужны союзники, чтобы сразиться с медведем. Германия не только хороший кандидат, но и обладает большим количеством технологических достижений, которыми можно поделиться с нами для помощи в нашей борьбе."
  JAP_preemptive_war:0 "Превентивная война"
  JAP_preemptive_war_desc:0 "Заранее изготовив доклады об усилении советской агрессии на наших северных границах, мы можем дать себе повод требовать превентивного удара, чтобы устранить северную угрозу."
  JAP_establish_the_northern_resource_area:0 "Установить северную зону ресурсов"
  JAP_establish_the_northern_resource_area_desc:0 "Богатые сибирские пустоши должны быть использованы для нашей постоянно растущей военной машины."
  JAP_german_rocketry:0 "Немецкая ракетотехника"
  JAP_german_rocketry_desc:0 "Дальнейшие немецкие технологические достижения были бы чрезвычайно полезны для наших военных усилий. Мы должны добиться получения этих схем, во что бы то ни стало."
  JAP_strengthen_civilian_government:0 "Укрепить гражданское правительство"
  JAP_tora_tora_tora_idea:0 "Тора! Тора! Тора!"
  JAP_tora_tora_tora_idea_desc:0 "После своего первоначального удара японцы начинают агрессивную молниеносную кампанию со своими корабельными силами."
  JAP_strengthen_civilian_government_desc:0 "Растущие ценности либерализма и демократии, далеко не являющиеся угрозой для нашей нации, могут стать ее величайшими силами. Мы должны обеспечить усиление нашего правительства, чтобы оно могло защитить эти идеалы."
  JAP_ally_with_the_zaibatsus:0 "Союз с дзайбацу"
  JAP_ally_with_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны давно имеют беспрецедентную политическую и экономическую власть. Они являются свидетельством всех возможностей, которые дают свобода и индивидуальность, и мы должны стремиться работать вместе с ними на благо нации."
  JAP_research_spending:0 "Расходы на исследования"
  JAP_research_spending_desc:0 "Если мы хотим в полной мере использовать самых лучших и талантливых людей нашей нации, то необходимо выделить достаточно большой бюджет на исследования и разработки."
  JAP_pre_emptive_coup:0 "Превентивный переворот"
  JAP_pre_emptive_coup_desc:0 "Мы должны нанести первый удар и обеспечить будущее нашей нации для наших детей, пока наши идеалы не будут растоптаны авторитарным правительством."
  JAP_purge_the_militarists:0 "Чистка милитаристов"
  JAP_purge_the_militarists_desc:1 "Те, кто считает, что военная сила является ответом на все вопросы, должны быть изгнаны с наших островов, если мы хотим освободить место для более трезвомыслящих людей. Они могут найти свой собственный путь за пределами наших границ."
  JAP_the_showa_constitution:0 "Конституция Сёва"
  JAP_the_showa_constitution_desc:0 "Мы принимаем и уважаем имперскую историю нашей страны. Однако в Японии, которую мы хотим построить, нет места авторитаризму. Мы сохраним императора в качестве номинального лидера, но ограничим его власть в конституции, как это принято во многих западных странах."
  JAP_west_pacific_treaty_organization:0 "Организация Договора о безопасности в Западной части Тихого океана"
  JAP_west_pacific_treaty_organization_desc:0 "Альянс с другими азиатскими странами позволит нам противостоять любым потенциальным угрозам нашему новому образу жизни."
  JAP_rekindle_the_old_alliance:0 "Возобновление старого альянса"
  JAP_rekindle_the_old_alliance_desc:0 "Наши лучшие шансы лежат с нашим бывшим союзником в Великой войне. Мы активируем старый альянс и встанем вместе с [ENG.GetNameDef] для защиты демократии."
  JAP_pacific_guardian:0 "Тихоокеанский страж"
  JAP_pacific_guardian_desc:0 "Мы примем на себя роль стража всех азиатских государств в Тихом океане и за его пределами. Освободившись от западного империализма, им понадобится направляющая рука, чтобы возвысить их до полноценных демократий."
  JAP_anti_communist_bulwark:0 "Антикоммунистический бастион"
  JAP_anti_communist_bulwark_desc:0 "Принципы демократии несовместимы с коммунизмом. Мы должны твердо противостоять этой идеологии и тем самым защищать как себя, так и тех, кто на нас полагается."
  JAP_anti_communist_volunteers:0 "Антикоммунистические добровольцы"
  JAP_anti_communist_volunteers_desc:0 "Мы должны бороться с коммунизмом везде, где он встречается, даже если сами официально не участвуем в конфликте. Вместо этого мы отправим добровольцев для защиты нашего дела в этих случаях."
  JAP_the_korean_question:0 "Корейский вопрос"
  JAP_the_korean_question_desc:0 "Мы уже некоторое время контролируем Корейский полуостров, но вопрос о самоопределении Кореи становится всё более насущным. Можем ли мы действительно придерживаться демократических идеалов, когда мы отказываем нашим соседям в праве на самоуправление?"
  JAP_liberate_manchuria:0 "Освободить Маньчжурию"
  JAP_liberate_manchuria_desc:0 "Маньчжурия продолжает существовать при авторитарном правлении - как отвратительный реликт нашего колониального правления. Мы должны исправить эту ситуацию и добиться, чтобы этот регион был возвращён под законный контроль Китая."
  JAP_liberate_manchuria_tt:0 "Решение может быть принято после завоевания Маньчжурии.\n"
  JAP_ultimate_deterrence:0 "Абсолютное устрашение"
  JAP_ultimate_deterrence_desc:0 "Лучший способ защитить наших граждан - сделать так, чтобы они никогда не сражались в войне. Разработка нового оружия ужасной разрушительной силы может сделать это возможным."
  JAP_full_sovereignty_for_the_philippines:0 "Полный суверенитет для Филиппин"
  JAP_full_sovereignty_for_the_philippines_desc:0 "Самоопределение должно быть распространено по всей Азии. [USA.GetNameDefCap] продолжает контролировать Филиппины и необходимо оказать давление на эту страну, чтобы заставить её уважать демократические права филиппинского народа."
  JAP_the_manchurian_project:0 "Маньчжурский проект"
  JAP_the_manchurian_project_desc:0 "Пока нашей территории катастрофически не хватает, мы можем пользоваться нашими обширными материковыми владениями. То, что мы не можем построить сами, мы возведем на материке. Мы начнем масштабную программу индустриализации для [MAN.GetNameDef]."
  JAP_expand_the_showa_steel_works:0 "Расширить сталелитейные заводы Шова"
  JAP_expand_the_showa_steel_works_desc:0 "Нам необходимо расширить сталелитейные заводы Шова, чтобы резко увеличить производство. Это важное условие для полномасштабной индустриализации."
  JAP_develop_aluminum_sources:0 "Разработать источники алюминия"
  JAP_develop_aluminum_sources_desc:0 "Для наших авиационных программ требуется много алюминия. Поэтому нам следует масштабно освоить маньчжурские месторождения."
  JAP_expand_manchurian_railways:0 "Расширить маньчжурские железные дороги"
  JAP_expand_manchurian_railways_desc:0 "В связи с усилением индустриализации нам нужно коренным образом расширить маньчжурскую инфраструктуру."
  JAP_light_industry_development:0 "Развитие легкой промышленности"
  JAP_light_industry_development_desc:0 "Легкая военная промышленность крайне важна для удовлетворения базовых нужд армии, поэтому ее необходимо развивать."
  JAP_heavy_industry_development:0 "Развитие тяжелой промышленности"
  JAP_heavy_industry_development_desc:0 "Тяжелая военная промышленность крайне важна для удовлетворения насущных нужд армии, поэтому ее необходимо развивать."
  JAP_japanese_settlement:0 "Японское поселение"
  JAP_japanese_settlement_desc:0 "Размещая своих людей в Маньчжурии, мы можем увеличить рабочую силу и создать новые подходящие места для строительства заводов."
  JAP_fortify_the_border:0 "Укрепить границу"
  JAP_fortify_the_border_desc:0 "Северная граница практически не защищена. Мы должны подготовиться к отражению возможного нападения с этого направления."
  JAP_army_expansion_law:0 "Закон о расширении армии"
  JAP_army_expansion_law_desc:0 "Неотъемлемой задачей нашего правительства должно стать резкое увеличение наших вооруженных сил."
  JAP_small_arms_modernization:0 "Модернизация стрелкового оружия"
  JAP_small_arms_modernization_desc:0 "Нашим войскам требуется модернизировать оружие, чтобы соответствовать нашим возможным противникам."
  JAP_supremacy_of_technology:0 "Верховенство технологий"
  JAP_supremacy_of_technology_desc:0 "Технологии приведут нас к победе. Все усилия должны быть направлены на то, чтобы превзойти наших врагов в вооружении и оснащении."
  JAP_modern_artillery:0 "Современная артиллерия"
  JAP_modern_artillery_desc:0 "Хотя наши солдаты храбры и свирепы, им нужна первоклассная артиллерия, которая поможет им в наступлении."
  JAP_armored_divisions:0 "Бронетанковые дивизии"
  JAP_armored_divisions_desc:0 "Другие страны уже узнали о силе бронетанковых дивизий. Мы не должны отставать и должны разрабатывать более современные и мощные модели брони, что позволит нам нанести врагу быстрый и сильный удар."
  JAP_bicycle_battalions:0 "Велосипедные батальоны"
  JAP_bicycle_battalions_desc:0 "Подвижность имеет ключевое значение. Наши силы будут оснащены велосипедами, что значительно повысит нашу способность перемещать дивизии."
  JAP_army_expansion:0 "Расширение армии"
  JAP_army_expansion_desc:0 "Чтобы достичь нашей цели расширения армии, мы должны использовать навыки тех офицеров, которые доказали свою способность обучать людей военному искусству."
  JAP_supremacy_of_will:0 "Сила воли"
  JAP_supremacy_of_will_desc:0 "Самое передовое оборудование бесполезно без человека, способного им владеть, а сила воли может превратить самый простой камень в самое смертельное оружие."
  JAP_fighter_modernization:0 "Модернизация истребителей"
  JAP_fighter_modernization_desc:0 "Мы должны поддерживать превосходство над своими врагами во всех областях, включая воздушную войну. Современные истребители имеют решающее значение для достижения этой цели."
  JAP_range_focus:0 "Дальность"
  JAP_range_focus_desc:0 "Расстояния, охватываемые войной на Тихоокеанском театре военных действий, огромны, поэтому нам нужны модели, способные преодолевать эти расстояния."
  JAP_agility_focus:0 "Маневренность"
  JAP_agility_focus_desc:0 "Только дальность не принесет нам пользы, если наши модели не смогут конкурировать с врагом по прибытии. Мы должны производить самолеты с превосходной маневренностью, чтобы они никогда не были превзойдены."
  JAP_the_zero:0 "Zero"
  JAP_the_zero_desc:0 "Новая разработка компании Мицубиси может оказаться самым способным на данный момент истребителем палубного базирования. Непревзойдённая манёвренность, наряду с достойным радиусом действия, говорит о том, что эта разработка, вероятно, будет служить нам многие годы. Необходимо незамедлительно приступить к изготовлению прототипа и серийному производству."
  JAP_the_zero_tt:0 "Позволяет производить §HMitsubishi A6M Zero-sen§!"
  JAP_bomber_modernization:0 "Модернизация бомбардировщиков"
  JAP_bomber_modernization_desc:0 "Наличие модернизированных тактических бомбардировщиков является ключом к поддержке наших сил на поле боя."
  JAP_strategic_bomber_effort:0 "Дальние бомбардировщики Nakajima"
  JAP_strategic_bomber_effort_desc:0 "Как бы нам этого ни хотелось, войны трудно выиграть исключительно за счёт прямых военных столкновений. Промышленный потенциал оказывает большое влияние на исход войны, поэтому мы должны инвестировать в новые модели стратегических бомбардировщиков, способные уничтожать промышленность врага в тылу."
  JAP_unified_fighter_development:0 "Единая программа разработки истребителей"
  JAP_unified_fighter_development_desc:0 "Слишком долго нас преследовало раздельное развитие авиации армией и флотом. Необходимо объединить эти программы, чтобы обеспечить как единообразие вооружения, так и более эффективное использование наших ограниченных научных ресурсов."
  JAP_jet_prototypes:0 "Прототипы реактивных самолётов"
  JAP_jet_prototypes_desc:0 "Будущее авиации не за пропеллерами. Мы должны обратить внимание на реактивный двигатель для расширения возможностей наших самолётов."
  JAP_new_naval_estimates:0 "Новые военно-морские оценки"
  JAP_new_naval_estimates_desc:0 "Нам необходимо подготовить новые оценки по увеличению численности нашего флота и, соответственно, по производственным мощностям верфей, которые потребуются для этого увеличения."
  JAP_carrier_warfare_experiments:0 "Эксперименты с авианосным боевым применением"
  JAP_carrier_warfare_experiments_desc:0 "Броненосцы - это пережитки прошлого. Мы должны смотреть в будущее, а будущее за авиацией. Авианосцы позволят нам проецировать нашу мощь по всему Тихому океану."
  JAP_expand_the_snlf:0 "Расширение Сил специального морского десанта"
  JAP_expand_the_snlf_desc:0 "Война в Тихом океане потребует высадки флота в больших масштабах. Силы специального морского десанта требуют расширения, если мы хотим быть готовыми к этой задаче."
  JAP_first_air_fleet:0 "Первый воздушный флот"
  JAP_first_air_fleet_desc:0 "Для того чтобы увеличить наступательную ударную мощь, мы объединим крупнейшую концентрацию авианосцев в мире в одну боевую группу. Разрабатывая доктрины, необходимые для скоординированных наступательных операций в такой форме, мы не оставим нашим врагам шанса на победу в войне против нашего превосходства в морской авиации."
  JAP_modern_escorts:0 "Современные эсминцы"
  JAP_modern_escorts_desc:0 "Наши флоты нуждаются в самых современных эсминцах для ведения операций без угрозы со стороны вражеских подводных лодок и торпедных катеров."
  JAP_supremacy_of_the_battlefleet:0 "Превосходство линейного флота"
  JAP_supremacy_of_the_battlefleet_desc:0 "За счёт своих превосходных разработок линкоров нам потребуется всего одно решающее сражение для победы в морской войне. Мы должны убедиться, что наш боевой флот достаточно силен, чтобы спровоцировать такое сражение и победить в нём."
  JAP_the_ultimate_battleship:0 "Окончательный линкор"
  JAP_the_ultimate_battleship_desc:0 "Поскольку у нас немного ресурсов, мы должны убедиться, что используем их самым эффективным способом. Мы создадим самые мощные из когда-либо построенных линкоров, которые смогут победить любого врага в лобовом столкновении."
  JAP_cruiser_modernization:0 "Модернизация крейсеров"
  JAP_cruiser_modernization_desc:0 "Крейсеры станут основой наших оперативных групп по всему Тихому океану, поэтому нам нужны лучшие из тех, что мы можем создать."
  JAP_long_lance_torpedoes:0 "Длинноствольные торпеды"
  JAP_long_lance_torpedoes_desc:0 "Из-за суровых условий мирового распределения ресурсов численность нашего флота уступает численности врага. Поэтому мы разработаем самую современную торпеду в мире: дальнобойное и мощное оружие, снабжаемое сжатым кислородом вместо сжатого воздуха, которое позволит нашим меньшим надводным судам наносить удары, намного превосходящие их грузоподъёмность."
  JAP_torpedo_cruisers:0 "Торпедные крейсеры"
  JAP_torpedo_cruisers_desc:0 "Мы выделим целый класс кораблей для транспортировки огромного количества наших новых торпед, что позволит им наносить сокрушительные удары по флоту противника.
  JAP_yamato_tt:0 "Добавляет два §Yлинкора класса "Ямато"§! в очередь производства, готовых на §G75%§! и §G50%§! соответственно."
  cost_reduced_last_stand:1 "Позволяет использовать способность §YПоследний рубеж§! с заметно сниженной стоимостью.\n"
  MAN_pacify_the_countryside:0 "Умиротворить деревню"
  MAN_pacify_the_countryside_desc:0 "С тех пор, как мы пришли к власти, преступники и мятежники пытались опротестовать наше правление в более отдаленных районах страны. Если мы хотим, чтобы нас воспринимали всерьез как правительство, нам нужно выкорчевать этих террористов и показать населению, что мы можем обеспечить нашу власть."
  MAN_pacify_the_countryside_effect_tooltip:0 "Разместите войска в определенных штатах, чтобы обезвредить бандитов в деревне.\n"
  MAN_army_modernization:0 "Модернизация армии"
  MAN_army_modernization_desc:0 "Наша армия и мала, и устарела. Принимая во внимание имеющиеся в нашем распоряжении ресурсы, это неприемлемо. Мы должны быть в состоянии использовать свой вес."
  MAN_mukden_military_academy:0 "Военная академия Мукдена"
  MAN_mukden_military_academy_desc:0 "Для руководства нашей армией нам нужны хорошие и верные офицеры, если мы захотим в дальнейшем полагаться не только на количество, чтобы достичь своих целей."
  MAN_invite_japanese_settlers:0 "Пригласить японских поселенцев"
  MAN_invite_japanese_settlers_desc:0 "У нас гораздо больше места, чем людей. Большие районы страны остаются по сути дикими. Мы должны заселить эти районы людьми, чтобы сформировать новые общины и обеспечить более экономичное развитие."
  MAN_collective_farms:0 "Коллективные фермы"
  MAN_collective_farms_desc:0 "Система, в которой отдельные семьи владеют и управляют отдельными фермами, является отсталой и неэффективной. Объединение всех трудовых ресурсов и земли деревни в единый объект обеспечивает гораздо более эффективное развитие."
  MAN_law_university:0 "Юридический университет"
  MAN_law_university_desc:0 "Наша страна ещё молода. У нас есть реальная возможность создать совершенно новую систему законов, основанную на самых современных представлениях о государственном управлении. Для этого мы должны создать специализированный центр, который объединит некоторые из самых светлых умов в Азии."
  MAN_research_and_education_department:0 "Департамент исследований и образования"
  MAN_research_and_education_department_desc:0 "По мере того как растет наш народ, мы должны гарантировать, что наши образовательные и исследовательские учреждения растут вместе с ним. Следует приложить больше усилий, чтобы сосредоточить наши исследовательские усилия там, где они больше всего нужны."
  MAN_trade_delegation:0 "Торговая делегация"
  MAN_trade_delegation_desc:0 "Остальной мир находится впереди нас по методам индустриализации. Мы должны отправить делегацию, чтобы изучить их методы и найти способы улучшить наши собственные."
  MAN_expand_the_textile_industry:0 "Расширение текстильной промышленности"
  MAN_expand_the_textile_industry_desc:0 "Наши текстильные фабрики долгое время были опорой нашей промышленности и станут самым простым способом привлечь больше иностранного капитала для расширения нашей индустриальной базы."
  MAN_obedience:0 "Повиновение"
  MAN_obedience_desc:0 "Кто-то называет нас марионетками Японии, но они не понимают по-настоящему наших близких и равноправных отношений. Выступить против наших покровителей – это как ребёнку выступить против своих родителей."
  MAN_hoankyoku:0 "Хоанкёку"
  MAN_hoankyoku_desc:0 "Наше правительство - лучшая надежда Китая на светлое будущее. Очевидно, что у многих людей есть свой интерес в том, чтобы оно было уничтожено. Мы должны создать организацию, которая будет преследовать этих людей и защищать наше государство."
  MAN_first_five_year_plan:0 "Первый пятилетний план"
  MAN_first_five_year_plan_desc:0 "Несмотря на то, что он запятнан связью с коммунизмом, пятилетний план является ценным инструментом в планировании экономического развития страны. Мы должны внедрить такой план, чтобы направить развитие нашей промышленности."
  MAN_invite_japanese_investors:0 "Пригласить японских инвесторов"
  MAN_invite_japanese_investors_desc:0 "Для развития нашей страны потребуется внешняя помощь. Некоторые компании в Японии выразили готовность инвестировать в нашу страну."
  MAN_expand_the_railways:0 "Расширение железных дорог"
  MAN_expand_the_railways_desc:0 "Современная железнодорожная система - ключ к объединению всех частей нашей нации и ее объединению под одной крышей."
  MAN_develop_aluminum_sources:0 "Разработка источников алюминия"
  MAN_develop_aluminum_sources_desc:0 "У нас есть обширные залежи бокситов в Ляонине, которые готовы к эксплуатации. Они дадут жизненно важный импульс нашей авиационной промышленности."
  MAN_expand_showa_steel_works:0 "Расширение Шова Сталелитейный завод"
  MAN_expand_showa_steel_works_desc:0 "Завод Шова Сталь образует основу нашей тяжелой промышленности. Инвестиции в них позволит нам в полной мере получить прибыль позже."
  MAN_social_research_unit:0 "Социальный Исследовательский институт"
  MAN_social_research_unit_desc:0 "Мы должны создать специальный институт для изучения методов и обычаев нашего народа, так что мы можем лучше направить их к тому, чтобы стать активными гражданами страны."
  MAN_second_five_year_plan:0 "Второй Пятилетний план"
  MAN_second_five_year_plan_desc:0 "Благодаря успеху первого пятилетнего плана, это естественно, что мы должны повторить его другим планом развития экономики."
  MAN_national_defense_state:0 "Национальное Оборонное государство"
  MAN_national_defense_state_desc:0 "Пока война не выиграна и мы не вернулись, чтобы править всем Китаем, мы должны приложить все усилия, быть готовы пойти на любые жертвы и использовать все имеющиеся ресурсы для ведения войны."
  MAN_mukden_arsenal:0 "Мукден Арсенал"
  MAN_mukden_arsenal_desc:0 "Старый Императорский арсенал станет ядром нового военно-промышленного комплекса, который будет поставлять нашей армии современное оружие."
  MAN_mamc:0 "MAMC"
  MAN_mamc_desc:0 "Создание Маньчжурской Компании по Производству Самолетов даст нам возможность создать современные военно-воздушные силы, способные противостоять любым другим."
  MAN_alliance_with_the_kwantung_army:0 "Союз С Квантунской армией"
  MAN_alliance_with_the_kwantung_army_desc:0 "Японские силы в стране часто расходятся во взглядах с нашими. Мы должны наладить с ними более тесные связи, чтобы сотрудничество проходило максимально слаженно."
  MAN_chinese_leadership:0 "Китайское руководство"
  MAN_chinese_leadership_desc:0 "Китайскому народу нужен китайский лидер. Мы должны публично заявить, что не остановимся ни перед чем, пока имперская власть не будет полностью восстановлена по всему Китаю."
  MAN_vassalize_mengukuo:0 "Сделать Мэнцзян своим вассалом"
  MAN_vassalize_mengukuo_desc:0 "Принц Мэнцзяна не достоин стоять рядом с императором Маньчжоу-го. Пришло время положить конец этому глупому эксперименту и поставить его на место."
  MAN_national_cooperation_government:0 "Правительство национального сотрудничества"
  MAN_national_cooperation_government_desc:0 "До нас дошли тревожные слухи о том, что японцы рассматривают возможность формирования коллаборационистского правительства из других китайских политиков — простолюдинов. Это недопустимо. Мы должны добиться, чтобы любые китайские территории, захваченные нашими объединёнными силами, находились под нашим управлением."
  MAN_the_two_emperors:0 "Два императора"
  MAN_the_two_emperors_desc:0 "Пришло время отказаться от абсурдной идеи о том, что мы не являемся ничем иным, кроме полностью равных партнёров японцев. Наши два императора как братья!"
  MAN_assertiveness:0 "Агрессивность"
  MAN_assertiveness_desc:0 "Японцы продолжают править нами с раздражающим высокомерием. Мы должны напомнить им, что и мы — Империя, достойная уважения."
  MAN_request_control_of_the_railways:0 "Запросить контроль над железными дорогами"
  MAN_request_control_of_the_railways_desc:0 "В такой большой стране, как наша, контролировать железные дороги — значит контролировать страну.\n\nА японцы контролируют железные дороги.\n\nЭто должно измениться."
  MAN_staff_the_court_with_manchus:0 "Сотрудники суда с маньчжурами"
  MAN_staff_the_court_with_manchus_desc:0 "Династия Цин правила Китаем веками. Если мы хотим вернуть себе былую славу, мы должны как можно точнее следовать их примеру."
  MAN_expand_the_imperial_guards:0 "Расширение императорской гвардии"
  MAN_expand_the_imperial_guards_tt:1 "Получите 4 юнита с §Y7 пехотными§! и §Y2 артиллерийскими§! батальонами.\n"
  MAN_expand_the_imperial_guards_desc:0 "Императорская гвардия станет элитой нашей новой армии и станет примером для всех наших солдат, к которому следует стремиться."
  MAN_local_arms_procurement:0 "Закупка местного оружия"
  MAN_local_arms_procurement_desc:0 "Мы не можем вечно полагаться на японцев в поставках оружия. Если мы хотим обрести независимость, нам нужен источник оружия, который мы контролируем."
  MAN_bolster_nationalism:0 "Подкрепить национализм"
  MAN_bolster_nationalism_desc:0 "Слишком долго люди считали Маньчжоу-го искусственным образованием, созданным японцами. Но когда-то каждая нация была всего лишь идеей. Нам нужно сформировать у людей чувство маньчжурской самобытности и воплотить эту идею в реальность."
  MAN_five_equal_peoples:0 "Пять равноправных народов"
  MAN_five_equal_peoples_desc:0 "Дни, когда один народ мог править всеми остальными, закончились. Маньчжоу-го станет новым типом нации, в которой пять народов — русские, японцы, монголы, корейцы и маньчжуры — будут жить в гармонии."
  MAN_white_russian_advisers:0 "Белогвардейские советники"
  MAN_white_russian_advisers_desc:0 "После Гражданской войны в России многие русские предпочли изгнание любой участи, которую советская власть приготовила для своих поверженных врагов. Мы могли бы использовать этих людей для восстановления и обучения нашей армии."
  MAN_empower_the_legislative_council:0 "Усиление законодательного совета"
  MAN_empower_the_legislative_council_desc:0 "В настоящее время законодательный совет мало чем отличается от церемониального органа, который одобряет все, что наши японские повелители предлагают. Если мы хотим стать по-настоящему суверенной нацией, мы должны сначала получить полную автономию в наших законодательных вопросах."
  MAN_five_people_armies:0 "Армии пяти народов"
  MAN_five_people_armies_desc:0 "Если все граждане равны, то каждый гражданин должен быть в равной степени готов и желать защитить свою родину от иностранных угнетателей."
  MAN_five_people_armies_tt:2 "Призыв 7 отрядов с §Y3 пехотными§! батальонами.\n"
  MAN_purge_the_general_affairs_council:0 "Чистка Совета по общим делам"
  MAN_purge_the_general_affairs_council_desc:0 "Совет по общим делам был создан японцами, чтобы обеспечить им полный контроль над нашим правительством. Это не может продолжаться. Мы должны устранить любого, чья лояльность нашему правительству хоть в малейшей степени подозрительна."
  MAN_reform_the_civil_service:0 "Реформа государственной службы"
  MAN_reform_the_civil_service_desc:0 "Совет по общим делам был лишь верхушкой айсберга. Японцы фактически контролировали большую часть государственной службы полностью вне нашего контроля. Нам нужно назначить наших собственных администраторов."
  MAN_independence_war:0 "Война за независимость"
  MAN_independence_war_desc:0 "Пришло время сбросить оковы угнетения и бороться за наши древние свободы. Маньчжоу-го станет первой частью Китая, которая вздохнет свободно от всякого иностранного гнета."
  MAN_imperial_divinity:0 "Императорская божественность"
  MAN_imperial_divinity_desc:0 "В прошлом императоров Китая почитали как живых богов. Мы должны воссоединить нынешнего Императора с этой древней традицией."
  MAN_imperial_university:0 "Императорский университет"
  MAN_imperial_university_desc:0 "Империи нужны светлые умы, чтобы продвигать ее дело. Мы должны создать место, где лучшие и самые яркие наши люди будут собираться, чтобы учить и учиться друг у друга."
  MAN_move_capitals:1 "Перемещение столицы"
  MAN_move_capitals_desc:0 "Пекин всегда был древней столицей всего Китая. Теперь, когда он был возвращён, мы можем с триумфом вернуть Императора в его старый дом."
  MAN_claim_the_mandate_of_heaven:0 "Востребовать Небесный Мандат"
  MAN_claim_the_mandate_of_heaven_desc:0 "Наши победы в войне ясно дали понять, что само небо судит Императора справедливым и достойным Небесного Трона. Любые сомнения в том, что он не является законным правителем всего Китая, должны исчезнуть перед лицом таких неоспоримых доказательств."
  MAN_reclaim_the_empire:0 "Восстановить Империю"
  MAN_reclaim_the_empire_desc:0 "Теперь, когда мы завоевали нашу свободу, пришло время продолжить войну против предателей и мятежников в остальном Китае. Мы будем править этой страной или погибнем в попытке."
  MAN_assert_our_authority:0 "Утвердить нашу власть"
  MAN_assert_our_authority_desc:0 "Остальная часть страны внутренне разделена. Ни один из узурпаторов и бандитов, называющих себя военачальниками и председателями, не годится для правления. Их заставят подчиниться, и наше просвещённое правление распространится по всему Китаю."
  MAN_offer_vassalization:0 "Предложить вассализацию"
  MAN_offer_vassalization_desc:0 "Война разрывает страну на части. Мы можем это закончить, если предложим тем, кто до сих пор отказывался занимать чью-либо сторону, место при нашем дворе."
 WARLORD_secure_internal_politics:0 "Обеспечить внутреннюю политику"
  WARLORD_secure_internal_politics_desc:1 "Если наше правительство должно выжить в запутанном хаосе китайской политики, мы не должны отвлекаться на внутренние распри. Всякая внутренняя оппозиция должна быть искоренена."
  WARLORD_cooperation_with_the_nationalists:0 "Сотрудничество с Националистами"
  WARLORD_cooperation_with_the_nationalists_desc:1 "Националисты предлагают наилучший шанс объединить страну и победить японцев. Нам следует убедиться, что они не считают нас угрозой."
  WARLORD_cooperation_with_the_nationalists_effect_tooltip:0 "[WTT_communist_china.GetNameDefCap] и военачальники, которые встали на сторону коммунистов, могут в ответ начать §HПограничные конфликты§! с нами."
  WARLORD_technological_cooperation:0 "Технологическое сотрудничество"
  WARLORD_technological_cooperation_desc:1 "Наше сотрудничество с Центральным правительством гарантирует нам доступ к любым новым технологиям, которые они разрабатывают."
  WARLORD_new_model_province:0 "Новая образцовая провинция"
  WARLORD_new_model_province_desc:1 "Пока Центральное правительство пытается втащить страну в современность, мы осуществим реформы в гораздо меньших масштабах и будем рассматриваться как сияющие маяки прогресса в отличие от отсталости остальной части страны."
  WARLORD_root_out_corruption:0 "Искоренить коррупцию"
  WARLORD_root_out_corruption_desc:1 "В течение десятилетий государственные чиновники злоупотребляют своим положением, набивая собственные карманы и терроризируя население, закрывая глаза на преступников, наполняющих их карманы. Теперь этому конец."
  WARLORD_embrace_the_opium_trade:0 "Охватить торговлю опиумом"
  WARLORD_embrace_the_opium_trade_desc:1 "Стране нужны деньги, чтобы функционировать. В нашем нынешнем положении мы не можем слишком уж привередничать в отношении источников."
  WARLORD_land_reform:0 "Земельная реформа"
  WARLORD_land_reform_desc:1 "Коммунисты проводят агрессивную программу перераспределения земли, завоевывая для себя множество сторонников среди крестьян. Мы должны реализовать менее радикальную программу, чтобы привлечь население на нашу сторону."
  WARLORD_reform_the_administration:0 "Реформирование администрации"
  WARLORD_reform_the_administration_desc:1 "Все наши усилия на государственном уровне не пойдут ни во что, если они не будут реализованы на местном уровне. Мы должны убедиться, что чиновники на местах способны и готовы выполнять наши приказы."
  WARLORD_join_the_republican_government:0 "Присоединиться к республиканскому правительству"
  WARLORD_join_the_republican_government_desc:1 "Теперь, когда наша территория укреплена и наше правительство реформировано, настало время обратиться к Центральному правительству и потребовать места за столом переговоров. Как только мы станем признанной партией в правительстве, мы сможем использовать эту новую легитимность для построения поддержки в других государствах, чтобы расширить нашу базу власти."
  WARLORD_power_struggle:0 "Борьба за власть"
  WARLORD_power_struggle_desc:1 "Наше политическое влияние в государственных делах значительно возросло. Теперь мы можем попытаться общаться с другими странами как с равными."
  WARLORD_cooperation_with_the_communists:0 "Сотрудничество с коммунистами"
  WARLORD_cooperation_with_the_communists_desc:1 "Гоминьдан пытались построить современную нацию, но потерпели неудачу. Страна разделена больше, чем когда-либо, крестьяне живут в страхе перед правительством, коррупция процветает на всех уровнях власти, а японские империалисты подстерегают прямо у границ. Возможно, коммунизм — лучший образ будущего."
  WARLORD_cooperation_with_the_communists_effect_tooltip:0 "В ответ на это лорды войны, поддержавшие националистов, могут начать против нас §HПограничные конфликты§!.\n"
  WARLORD_land_redistribution:0 "Перераспределение земель"
  WARLORD_land_redistribution_desc:1 "Крестьяне безжалостно эксплуатируются землевладельцами, хотя они и составляют основу нашей экономики. Если люди, которые обрабатывают землю, станут ее владельцами, общество станет гораздо более справедливым и продуктивным."
  WARLORD_ideological_education:0 "Идеологическое образование"
  WARLORD_ideological_education_desc:1 "Фундамент нашего будущего успеха закладывается сегодня. Будущие поколения должны усвоить фундаментальную истину: вся история — это история классовой борьбы и их роль в ней."
  WARLORD_land_value_tax:0 "Налог на стоимость земли"
  WARLORD_land_value_tax_desc:1 "Налог на землю дает нам более стабильную и справедливую налоговую систему, которая берет деньги у тех, у кого их больше всего."
  WARLORD_judiciary_reforms:0 "Судебная реформа"
  WARLORD_judiciary_reforms_desc:1 "Если наше правительство хочет добиться успеха, мы должны убедиться, что все судьи достаточно образованы, чтобы правильно применять наши законы."
  WARLORD_communist_administrators:0 "Коммунистические администраторы"
  WARLORD_communist_administrators_desc:1 "Старая гвардия администраторов слишком закоренела, чтобы ее можно было переубедить. Мы должны заменить их всех новыми, молодыми администраторами с более радикальными идеями."
  WARLORD_join_the_chinese_soviet:0 "Присоединиться к Китайскому Совету"
  WARLORD_join_the_chinese_soviet_desc:1 "Революция может победить только в том случае, если коммунисты будут держаться вместе. Конечно, мы должны убедиться, что никакие контрреволюционные элементы в партии не попытаются сорвать революцию еще до ее начала."
  WARLORD_the_yanan_incident:0 "Инцидент в Яньани"
  WARLORD_the_yanan_incident_effect_tt:1 "Попросите §H[SOU.GetNameDef]§! о поддержке, чтобы заменить §H[WTT_communist_china.GetNameDef]§! на посту лидера коммунистов.\nЕсли они откажутся, то это приведет к войне с §H[WTT_communist_china.GetNameDef]§!.\nЭта сделка с §H[SOU.GetNameDef]§! откроет нам доступ к требованиям от [SOU.GetLeader]\n"
  WARLORD_the_yanan_incident_desc:1 "Нынешний лидер партии отвернулся от социалистических братьев в Советском Союзе. Нам следует обратиться к Советам, чтобы заручиться их поддержкой в проведении революции во всём Китае."
  WARLORD_opposition:0 "Оппозиция"
  WARLORD_opposition_effect_tooltip:0 "§H[WTT_current_china_leader.GetNameDef]§! могут начать с нами пограничную войну в ответ на это."
  WARLORD_opposition_desc:1 "Центральное правительство коррумпировано и слабо. Коммунисты хотят уничтожить 5000 лет китайской истории. Эта ситуация требует великого лидера, который готов принимать трудные решения и объединять страну всеми необходимыми средствами."
  WARLORD_public_works:0 "Общественные работы"
  WARLORD_public_works_desc:1 "Население должно видеть, что мы работаем для их блага. Несколько заметных проектов послужат полезными пропагандистскими инструментами и дадут им представление о том, каким может стать весь Китай, если они будут больше нас поддерживать."
  WARLORD_labor_reform:0 "Реформа труда"
  WARLORD_labor_reform_desc:1 "Методы и традиции труда в Китае развивались на протяжении тысячелетий. Пришло время перевести их в современную эпоху."
  WARLORD_rural_militias:0 "Сельское ополчение"
  WARLORD_rural_militias_desc:1 "В разрозненных сельских районах военная поддержка зачастую долго добирается до места вторжения. Наращивая местное ополчение, мы можем гарантировать, что любому захватчику будет трудно передвигаться по нашей сельской местности."
  WARLORD_war_taxes:0 "Военные налоги"
  WARLORD_war_taxes_desc:1 "Отчаянные времена требуют отчаянных мер. Пока продолжается война, мы должны мобилизовать экономические ресурсы населения в максимально возможной степени."
  WARLORD_seek_japanese_support:0 "Просить японской поддержки"
  WARLORD_seek_japanese_support_desc:1 "И Центральное правительство, и коммунисты имеют могущественных союзников. Если мы хотим выйти победителями из этой войны, нам нужно найти себе защитника."
  WARLORD_personal_leadership:0 "Личная власть"
  WARLORD_personal_leadership_desc:1 "Разделение военного командования чревато тем, что офицер, чьи мысли витают выше его чина, попытается захватить власть. Мы должны обеспечить, чтобы наши солдаты всегда были лояльны правительству."
  WARLORD_cult_of_personality:0 "Культ личности"
  WARLORD_cult_of_personality_desc:1 "Люди должны знать, кто ведёт их через эти тёмные дни в светлое будущее, а также множество выдающихся качеств этого человека."
  WARLORD_provoke_border_clashes:1 "Приграничные столкновения с националистами"
  WARLORD_provoke_border_clashes_desc:1 "Мы не можем рисковать тотальной войной прямо сейчас. Небольшой, контролируемый конфликт позволит нам получить ценную территорию, не будучи при этом полностью раздавленными. В идеале мы нанесём удар как раз в тот момент, когда наш противник направит свои силы в другое место."
  WARLORD_defensive_posture:0 "Оборонительная позиция"
  WARLORD_defensive_posture_desc:1 "Этот конфликт - марафон, а не спринт. Преждевременные действия против других фракций могут обернуться катастрофой. Поэтому мы сохраним оборонительную позицию."
  WARLORD_rapid_mobilization:0 "Быстрая мобилизация"
  WARLORD_rapid_mobilization_desc:1 "Чтобы иметь шанс на лидерство в Китае, мы должны увеличить численность нашей армии. Мы разработаем новые методы ускоренной подготовки, создадим армию, способную справиться с любым вызовом."
  WARLORD_proclaim_rival_government:0 "Провозглашение соперничающего правительства"
  WARLORD_proclaim_rival_government_desc:1 "Пришло время официально заявить о наших амбициях. Нам нужен полный контроль над Китаем, и мы будем вести переговоры с остальным миром на равных."
  WARLORD_institute_cross_border_raids:0 "Организация трансграничных набегов"
  WARLORD_institute_cross_border_raids_desc:0 "Нас не будут воспринимать всерьез как независимого участника борьбы за лидерство в Китае, пока мы не покажем миру, что мы готовы и можем сражаться за наши земли. Несколько небольших вторжений продемонстрируют нашу решимость и позволят нам захватить незащищенные территории."
  GXC_import_german_equipment:0 "Импорт немецкой техники"
  GXC_import_german_equipment_desc:0 "'Все вы - хорошо обученные и оснащенные немцами отряды'\n - полковник Ся Цзинюань (из фильма \"Восемьсот\")"
  GXC_the_guangxi_arsenals:0 "Арсеналы Гуанси"
  GXC_the_guangxi_arsenals_desc:0 "Создание военных арсеналов необходимо для подготовки к грядущим войнам."
  GXC_military_aviation_school:0 "Военная авиационная школа"
  GXC_military_aviation_school_desc:0 "Чтобы иметь военные силы, мы должны сначала иметь пилотов."