 BEL_1936_elections_desc:0 "Нарастающая политическая активность явно указывает на скорые выборы. [BEL.GetAdjective] народ будет призван к голосованию в конце мая. За кулисами некоторые партии уже ведут переговоры о создании коалиции после выборов. Отнимут ли голоса у традиционных партий новые популистские движения, такие как Рекс, Вердинасо и Фламандский национальный союз?"
