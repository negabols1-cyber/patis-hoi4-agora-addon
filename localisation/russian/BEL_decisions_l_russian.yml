 BEL_integrate_benelux_decision:0 "Интегрировать Бенилюкс"
 BEL_integrate_benelux_decision_desc:0 "Мы можем мирно объединить Бенилюкс. Нам нужно убедить наши соседние государства в регионе и работать вместе для этой цели. Объединенный Бенилюкс был бы намного сильнее и принес бы пользу всем нам. Это также облегчит нам сохранение нашей социалистической революции. \n\nЧтобы мирно аннексировать §YБенилюкс§!, вам необходимо достичь §Y100%§! интеграции стран."
