 BEL_uranium_concession_agreement:0 "Соглашения о концессии на уран с [FROM.GetNameDef]"
 BEL_uranium_concession_agreement_desc:0 "Мы не можем в полной мере использовать урановые месторождения на нашей земле, и было бы более выгодно не только для нас, но и для наших [FROM.GetAdjective] союзников, подписать контракт, предоставляющий им права на разработку в обмен на полезные материалы и продукты для нашей отечественной промышленности и сельского хозяйства."

