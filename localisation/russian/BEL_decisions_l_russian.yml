 BEL_invite_belgium_faction_tt:0 "§HОчки убеждения§! должны быть больше §Y35§!"
 BEL_join_belgium_faction_tt:0 "Одна из 3 стран должна иметь §HОчки убеждения§! больше §Y35§!"

 BEL_CONVINCE_BELGIUM_ALLIANCE_DESC:0 "Мы должны выяснить, какая из великих держав вокруг нас может нам больше всего помочь, и выбрать свою сторону в грядущей мировой войне. Мы не должны повторять ошибок, допущенных в прошлой войне, и снова проиграть, поэтому мы должны встать на сторону самой могущественной страны, которая может нам больше всего помочь и выиграть эту войну."
 BEL_CONVINCE_BELGIUM_ALLIANCE_GER_DESC:0 "Если нам удастся привлечь Бельгию на нашу сторону, в отличие от предыдущей войны, нам не придется на них нападать, и мы сможем использовать их границу, чтобы без особых усилий пересечь линию Мажино. В этом случае, чтобы захватить и без того неподготовленных французов, не потребуется даже нескольких часов."
 BEL_CONVINCE_BELGIUM_ALLIANCE_OTHER_DESC:0 "Что бы ни случилось, мы должны убедить Бельгию стать нашим союзником. Если они согласятся, мы сможем сделать оборонительные рубежи в этом регионе намного прочнее. Если мы успеем скорректировать оборону, то защитить как страны Бенилюкса, так и Францию не составит труда."

