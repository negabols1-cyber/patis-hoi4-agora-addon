l_russian:
 ENG_scottish_king_lose_core_tt: "§R$ENG_protests_modifier$§! Модификатор будет добавлен во все штаты в регионе §Yengland."
 ENG_found_a_new_king: "Найти нового короля"
 ENG_found_a_new_king_desc: "Эдвард не должен принимать трон. Кроме того, мы не можем отказаться от этого авторитарного режима, поэтому мы должны найти нового короля и убедиться, что он принят среди наших людей со своими сторонниками."
 ENG_the_german_crown: "Немецкая корона"
 ENG_the_german_crown_desc: "Британские острова больше не стоят одиноки. Через момент, который изменит монархию, на престол поднялся [ENG_ROYAL_TITLE] немецкой крови. Хотя вопросы задерживаются и бормоты от инакомыслия эхо, легитимность этого нового суверена может подготовить путь к восстановлению единства - или углубить разрыв."
 ENG_reconcile_the_realm: "Примиритесь в сфере"
 ENG_reconcile_the_realm_desc: "Раны преемственности и дивизии проходят глубоко. Починив разрушенную лояльность в королевстве, мы укрепим внутреннюю поддержку нового монарха и восстановим общественную веру на престол."
 ENG_restore_royal_authority: "Восстановить королевскую власть"
 ENG_restore_royal_authority_desc: "Королевское влияние уменьшилось в современную эпоху, но оно не выходит за рамки восстановления. Благодаря решающему лидерству и тщательной реструктуризации мы подтвердим силу монархии над государственным механизмом."
 ENG_secure_the_industrialists: "Закрепите промышленников"
 ENG_secure_the_industrialists_desc: "Никакая современная монархия не может стоять без двигателей промышленности. Титаны производства должны быть введены в склад - не по указу, а в партнерстве и обещаниях стабильности под королевским надзором."
 ENG_the_kings_economic_vision: "Экономическое видение короля"
 ENG_the_kings_economic_vision_desc: "С твердой рукой и ясным умом, король излагает свой экономический план - путь промышленной модернизации, сбалансированного развития и королевского надзора, чтобы обеспечить процветание для царства."
 ENG_curtail_republican_opposition: "Удовлетворить республиканскую оппозицию"
 ENG_curtail_republican_opposition_desc: "Хотя республиканцы становятся все громче, они остаются, кроме мимолетного шторма. С тщательным законодательным давлением и тонким влиянием их сети будут демонтировать без разжигания открытого конфликта."
 ENG_the_kings_parliament: "Парламент короля"
 ENG_the_kings_parliament_desc: "Парламент реструктурирован, чтобы лучше отражать видение короля - традиционные ценности, лояльные представители и стабильность над хаосом. Хотя выборы продолжаются, результат никогда не угрожает короне."
 ENG_a_crown_for_a_new_era: "Корона для новой эры"
 ENG_a_crown_for_a_new_era_desc: "Правило короля - не переживание прошлого, а маяк на будущее. Британия входит в современную эпоху с царственной гордостью, драпированной не в распаде, а с целью."
 ENG_modernize_the_royal_army: "Модернизировать королевскую армию"
 ENG_modernize_the_royal_army_desc: "Королевская армия должна адаптироваться к временам - лучшей подготовке, обновленной доктрине и современному оборудованию, все под пристальным глазом короны. Меч монархии должен быть острым и быстрым."
 ENG_claim_the_highland_crown: "Претендовать на Шотландскую Корону"
 ENG_claim_the_highland_crown_desc: "Трон находится пустым, но север вспоминает свое. С Джеймсом Грэмом у руля мы утверждаем законное правило над Хайлендс и видение стабильного будущего за пределами краха Вестминстера."
 ENG_imperial_compromise: "Имперский компромисс"
 ENG_imperial_compromise_desc: "В то время как Германия, возможно, отклонилась далеко от своих имперских корней, не все ее народ покинул корону. Приветствуя изгнанных монархистов, бывших придворных и верных офицеров - мы можем обогатить наше государство с их опытом и углубить нашу приверженность общему королевскому наследию."
 ENG_revive_the_royal_navy: "Оживить Королевский флот"
 ENG_revive_the_royal_navy_desc: "Когда -то любовница морей, Королевский флот стал самодовольным. Согласно королевской директиве, его флоты должны быть обновлены - гладкий, смертельный и достойный возрождения империи."
 ENG_support_the_church: "Поддержать церковь"
 ENG_support_the_church_desc: "Во времена перемен люди стремятся к моральному руководству. Поддерживая альянс между короной и церковью, духовная душа нации защищена."
 ENG_aproach_wilhelmina: "Подход Вильгельмины"
 ENG_aproach_wilhelmina_desc: "Королева Вильгельмина давно сопротивлялась немецкому доминированию. Сделано осторожное предложение: присоединяйтесь к нашему праведному делу, и в единстве мы нанесем удар по схватке Рейха по Европе."
 ENG_ally_with_france: "Союзник с Францией"
 ENG_ally_with_france_desc: "Дни соперничества давно прошли. Перед лицом немецкой агрессии Британия и Франция должны еще раз объединиться - не из настроения, а по необходимости."
 ENG_disunite_germany: "Disunite Germany"
 ENG_disunite_germany_desc: "Германия стала слишком мощной, слишком централизованной. Мы разбим его в более мелкие, более слабые штаты - восстановление естественного баланса Европы и обеспечение мира посредством разделения."
 ENG_claim_remaining_imperial_lands: "Претендовать на оставшиеся имперские земли"
 ENG_claim_remaining_imperial_lands_desc: "С большей частью сердца Священной Римской империи теперь под нашим контролем, только разбросанные фрагменты остаются в руках иностранных государств. Утверждая наши исторические права и применяя дипломатическое давление, мы можем принести последние остатки империи в склад - либо с помощью соответствия, либо другими способами."
 ENG_imperial_shadow_over_europe: "Имперская тень на Европу"
 ENG_imperial_shadow_over_europe_desc: "С разбитой Германией и восстановлением нашего влияния Британия снова бросает свою имперскую тень. От Парижа до Варшавы судьба Европы наклоняется к воле Короны."
 ENG_rescue_the_deutschamerikaner: "Спасен Deutschamerikaner"
 ENG_rescue_the_deutschamerikaner_desc: "По всей Атлантике, в самом сердце Соединенных Штатов, живет динамичное сообщество немецких американцев-Deutschamerikaner. Слишком долго их наследием пренебрегали, их голосами утонули в плавильном горшке нового мира. Наша долга как законного защитника всех немцев не заканчивается на берегах Европы. Протянув руку, мы предложим им защиту, гордость и единство, которых они заслуживают. Если американское правительство сопротивляется, мы приведем их на каблук, гарантируя, что Deutschamerikaner восстановился в их законном месте под руководством нашей империи."
 ENG_tighten_the_imperial_bonds: "Затянуть имперские связи"
 ENG_tighten_the_imperial_bonds_desc: "То, что началось как дипломатическое партнерство, - это превращение в более глубокий, структурированный альянс. Двусторонние консультативные группы, взаимосвязанные политические форумы и королевская корреспонденция - все это признаки связи, которые больше не просто политические, а династические."
 ENG_joint_military_exercises: "Совместные военные учения"
 ENG_joint_military_exercises_desc: "Чтобы укрепить нашу стратегическую координацию и поддержку взаимного доверия, совместные военные учения с немецкой армией будут проводиться во многих кинотеатрах. Наши офицеры будут учиться у них и наоборот - основу для долговечного союза."
 ENG_review_military_landing_tactics: "Просмотреть военную тактику посадки"
 ENG_review_military_landing_tactics_desc: "Уроки, взятые из недавних упражнений - особенно в опыте Германии с континентальной войной - дают жизненно важное понимание для улучшения наших военно -морских процедур. Подготовка к будущим операциям через канал или за его пределами теперь является приоритетом."
 ENG_mutual_economic_pact: "Взаимный экономический договор"
 ENG_mutual_economic_pact_desc: "Общие интересы требуют общего процветания. Формальный экономический договор с Германией обеспечит стабильность ресурсов, преференциальную торговлю и совместную разработку в ключевых промышленных секторах. Связывая нашу экономику под знаменем монархистского сотрудничества."
 ENG_proclaim_a_dual_monarchy: "Провозглашать двойную монархию"
 ENG_proclaim_a_dual_monarchy_desc: "Пришло время предложить профсоюз более глубокий, чем просто альянс. Мы расширим официальное приглашение на немецкую корону: двойная монархия - объединенная в суверенитете, разделенная на сферы. В случае принятия Британия будет стоять рядом с Германией под одной общей короной."
 ENG_germanization_of_britain: "Германизация Британии"
 ENG_germanization_of_britain_desc: "Поскольку связи с Германией углубляются, культурный ландшафт меняется. Изменения имен, адаптируются язык и эхо тевтонского прошлого появляются на Британских островах."
 ENG_crusade_against_bolshevism: "Крестовый поход против большевизма"
 ENG_crusade_against_bolshevism_desc: "Идеологическая угроза, представляемая Советским Союзом, ставят под угрозу все монархии, традиции и национальные сувереницы по всей Европе. Вместе с нашими немецкими союзниками мы будем координировать военные операции, чтобы нанести удар в основе большевизма. Баннер двойной монархии не останется бездействующим, в то время как тираны стремятся экспортировать революцию через огонь и сталь."
 ENG_order_in_the_lowlands: "Заказ в низменности"
 ENG_order_in_the_lowlands_desc: "Бессмысленные варева на юге, подпитываемые неопределенностью и старой лояльностью. Пришло время восстановить стабильность и утверждение авторитета по низким уровням, прежде чем хаос распространится дальше."
 ENG_restore_national_unity: "Восстановить национальное единство"
 ENG_restore_national_unity_desc: "Крысок старого порядка оставил шрамы не только на границах, но и в умах. Многие регионы теперь рассматривают наше правило с неопределенностью или отказом. Благодаря информационно -проживанию, реформам и публичным кампаниям мы восстановим доверие и полностью вернем эти земли."
 ENG_convene_the_royal_cabinet: "Созвать королевский кабинет"
 ENG_convene_the_royal_cabinet_desc: "Первый шаг к восстановлению империи заключается в реорганизации правительства вокруг нового монарха. Лояльные министры и способные советники станут основой королевского правления."
 ENG_reorganize_the_home_guard: "Реорганизовать домашнюю охрану"
 ENG_reorganize_the_home_guard_desc: "Домашняя гвардия уже давно служила символом местной устойчивости, но ее структура устарела и неровная во всем мире. С новым королевским руководством и растущими международными угрозами пришло время превратить эту гражданскую силу в последовательную, регионально интегрированную оборонную аппарату, который может быстро реагировать на беспорядки дома или вторжение из -за рубежа."
 ENG_proclaim_new_union: "Провозглашать новый союз"
 ENG_proclaim_new_union_desc: "С Хайлендс и низменной под одним баннером пришло время объявить о новом заказе. Британия восстановилась не через доминирование, а посредством общего управления и возобновления легитимности."
 ENG_forge_northern_heartland: "Вылечить северное сердце"
 ENG_forge_northern_heartland_desc: "Мы восстановим как нагорья, так и низменности, инвестируя в средства самообороны. Пусть север станет кузницей нашей армии."
 ENG_reorganize_the_royal_army: "Реорганизовать королевскую армию"
 ENG_reorganize_the_royal_army_desc: "Годы пренебрежения, устаревшая доктрина и фрагментированная командование оставили Королевскую армию плохо подготовленными к предстоящим проблемам. Мы должны предпринять полномасштабную реорганизацию-протяжении нашей иерархии, модернизируя нашу тактику и обеспечение обучения, оборудования, оборудования и готовых к сражению."
 ENG_masters_of_the_highlands: "Мастера нагорья"
 ENG_masters_of_the_highlands_desc: "Прочные нагорья давно разведены воинами непревзойденной устойчивости и хитрости. Оттачивая навыки наших горных войск, мы гарантируем, что каждый пропуск Глена, Сервиса и Тумана стал крепостью само по себе. Враги, которые осмеливаются отправиться в нашу высокую страну, будут бороться не только с нашими солдатами, но и сама земля."
 ENG_pioneer_of_the_seas: "Пионер морей"
 ENG_pioneer_of_the_seas_desc: "С королем Джеймсом Грэмом, у руля нашей нации, Британия находится под руководством правителя, чье видение выходит далеко за пределы трональной комнаты. Известный своей новаторской работой над первым в мире авианосцем, его Величество теперь направляет тот же инновационный дух на расширение и модернизацию нашего флота. Под его командованием наши верфи работают в беспрецедентных темпах, и наши военно -морские стратеги охватывают будущее войны, - это то, что Британия будет управлять не только волнами, но и небом над ними."
 ENG_militarize_the_economy: "Милитаризировать экономику"
 ENG_militarize_the_economy_desc: "Эпоха мира позади, а требования современного конфликта с каждым днем ​​становятся все более неотложными. Гражданское производство должно уступить место стратегическому производству - сталь, оружие и машины войны. Мы будем преобразовать семинары и фабрики по всей стране, чтобы удовлетворить потребности нашей растущей армии."
 ENG_celtic_imperialism: "Шотландский империализм"
 ENG_celtic_imperialism_desc: "Шотландские народы больше не должны быть отнесены к полям Европы. С ослаблением старых имперских держав, наше время подняться - чтобы проецировать силу, восстановить потерянную славу и формировать будущее, руководствовавшуюся явно шотландским видением единства и доминирования."
 ENG_officer_emperor: "Офицер Император"
 ENG_officer_emperor_desc: "Человек дисциплины, подкованный не в дворцовых залах, а в военно -морском и солевом ветре, теперь находится на престоле. Он не управляет божественным правом или унаследованным величием - но через командование, порядок и заслуги. Под его правлением корона больше не пассивная - она ​​командует, она диктует, она ведет."
 ENG_securing_the_supply_lines: "Защита линий подачи"
 ENG_securing_the_supply_lines_desc: "Войны не выигрываются только солдатами, а постоянным потоком продуктов питания, топлива и боеприпасов на фронт. Мы должны укрепить наши логистические сети, защищать наши конвои и гарантировать, что никакие действия противника не смогут развернуть нашу спасательную линию до победы."
 ENG_restore_control_over_ireland: "Вернуть Ирландию"
 ENG_restore_control_over_ireland_desc: "Ирландия - это не иностранная земля - ​​это наша кровь, наша история и наши законные родственники. Разделенный на колониальное наследие и разрушенное войной, Изумрудный остров должен снова стать целым под общей шотландской судьбой."
 ENG_north_sea_strategy: "Стратегия Северного моря"
 ENG_north_sea_strategy_desc: "Король Джеймс Грэм, монарх как шотландского наследия, так и британской власти, представляет восстановление северной талассократии - царство, связанное не землей, а водами Северного моря. Сосредоточившись на наших усилиях на морской сфере, мы можем превратить это некогда бессмысленное море в избивающее сердце нашей империи."
 ENG_war_with_denmark: "Война с Данией"
 ENG_war_with_denmark_desc: "Дипломатия прошел свой курс. Мы подготовим формальное оправдание и перейдем к Приложению [DEN.GetNameDef]. Контроль над Øresund и Датскими островами необходим для Ордена Северного моря, который мы намерены построить."
 ENG_union_with_denmark: "Предложить личный союз Дании"
 ENG_union_with_denmark_desc: "Его Величество распространяет королевское предложение Копенгагене: личный союз под северной короной. Принятие будет сэкономить кровопролитие и поместить наши короны в тандем - повторное обучение учреждений [DEN.GetAdjective], выравнивая внешнюю политику и командование. Если они откажутся, наше требование будет нанесено правом оружия."
 ENG_war_with_norway: "Война с Норвегией"
 ENG_war_with_norway_desc: "Фьорды и северные побережья должны быть закреплены. Мы не будем искать полумеры: будет подготовлен прямая аннексия против [NOR.GetNameDef], обеспечивая, чтобы основания и полосы движения были необходимы для империи Северного моря."
 ENG_union_with_norway: "Предложить личный союз Норвегии"
 ENG_union_with_norway_desc: "Связанный общим северным наследием и морским интересом, мы приглашаем [NOR.GetNameDef] объединить короны мирно. Принятие увидит, что их сфера управляется на местном уровне под нашей династией; Отказ вызовет наше законное требование о том, чтобы донести заказ на северные подходы."
 ENG_proclaim_north_sea_empire: "Провозглашать империю в Северном море"
 ENG_proclaim_north_sea_empire_desc: "Будь то мирным союзом или решающей войной, берега Северного моря отвечает на одну корону. Мы формализуем эту реальность и объявим империю Северного моря - порядок кораблей, торговли и закона под рукой Его Величества."
 ENG_fortress_of_the_north: "Крепость севера"
 ENG_fortress_of_the_north_desc: "Наша империя стоит во власти штормов моря и амбиций конкурирующих способностей. Мы превратим наши порты в бастионы, наши побережья в крепости, и наши флоты в непроницаемые щиты против всех, кто осмелился бы бросить вызов домену императора."
 ENG_break_the_swedish_hold: "Разорвать шведский"
 ENG_break_the_swedish_hold_desc: "Слишком долго Швеция сохраняла свою сцепление с северными границами Балтии, проецируя свою власть через море и бросая вызов нашему влиянию в Скандинавии. Теперь, под непоколебимым руководством короля Джеймса Грэма, мы раз и навсегда разбим эту северную оплу. Наши флоты будут доминировать в ледяных водах, наши армии будут приземлиться на шведские берега, а баланс сил на севере будет решительно наклоняться в нашу пользу."
 ENG_integrate_the_realms: "Интегрировать сферы"
 ENG_integrate_the_realms_desc: "Аннексия приносит бремя: расходящиеся законы, налоги и лояльность. Мы проведем пациенту программу администрирования, инфраструктуры и культурного размещения. Интеграция будет требовательной и медленной, но она превратит имущество в провинции и субъекты в граждан."
 ENG_pan_celtic_campaign: "Пан-кельтская кампания"
 ENG_pan_celtic_campaign_desc: "Старые империи рухнули, но узы крови, языка и истории терпят. Пришло время объединить кельтских народов под одним баннером - не как субъекты, а как братья в общей судьбе. От холмов Уэльса до долины Бриттани пожары единства возрождаются."
 ENG_demand_belgium: "Спрос Бельгии"
 ENG_demand_belgium_desc: "Отправляя ультиматум в небольшие страны, такие как Бельгия, мы можем убрать их с дороги. Нет необходимости бороться за эти маленькие земли напрасно. Если их ответ нет, то мы можем подумать об этом."
 ENG_attack_iberia: "Атаковать Иберию"
 ENG_attack_iberia_desc: "Иберия - одна из регионов, которые могут предотвратить нас, поэтому мы должны сначала устранить их."
 ENG_campaign_through_the_alps: "Кампания через Альпы"
 ENG_campaign_through_the_alps_desc: "Высокие Альпы давно служат естественной стеной между севером и югом, но ни одна гора не должна стоять перед кельтскими амбициями. Будь то безопасность или превосходство, мы должны прорваться через защиту Швейцарии и доминировать в проходах, которые формируют судьбу Европы."
 ENG_return_of_celts: "Возвращение кельтов"
 ENG_return_of_celts_desc: "Европа считала, что кельты потеряли время - сломаны, ассимилированы, забыты. Но мы вернулись. Не в цепях или в фольклоре, а с высокими баннерами и гордыми армиями. Это не возрождение. Это наше господство."
 ENG_strike_at_the_gallic_heartland: "Нанести удар по галльскому сердцу"
 ENG_strike_at_the_gallic_heartland_desc: "Франция - Древний сосед и случайный угнетатель стоит ослаблен и разделен. Путь в галлическое сердце открыт. Свифт -кампания разрушит их иллюзии стабильности и обеспечит наш западный фланг."
 ENG_peaceful_crown: "Мирная корона"
 ENG_peaceful_crown_desc: "Победа не всегда лежит через войну. Мы построим стабильное и самостоятельное королевство, основанное на взаимном уважении, истории и достойном суверенитете."
 ENG_reformist_king: "Реформистский король"
 ENG_reformist_king_desc: "Король Джеймс Грэм не является правителем пустой традиции - он является символом вдумчивой реформы. Под его руководством монархия стремится не восстановить старое, а изменить будущее: прогрессивное, конституционное и обоснованное в воле народа."
 ENG_invest_in_education: "Инвестировать в образование"
 ENG_invest_in_education_desc: "Мы обогатим нашу систему образования с обновленным акцентом на историю, язык и региональную идентичность, культивируя граждан, которые понимают свое место в мире и их наследие."
 ENG_prioritize_research_programs: "Региональные исследовательские инициативы"
 ENG_prioritize_research_programs_desc: "Современная наука и промышленность должны быть поощрены, если мы хотим оставаться суверенными. Мы будем строить центры исследований и инноваций, чтобы перенести наших людей в процветающее будущее."
 ENG_bridging_the_isles: "Соединение островов"
 ENG_bridging_the_isles_desc: "Теперь, руководствуясь новым монархом шотландского наследия, наше царство стремится вести не доминирование, а посредством дипломатии. Предлагая статус Доминиона Ирландии, мы стремимся построить стабильный, уважительный союз на Британских островах-один, основанный на взаимной безопасности, самоопределении и общем будущем за пределами тени Империи."
 ENG_crown_of_the_isles: "Обновленная монархия"
 ENG_crown_of_the_isles_desc: "Наше правление больше не является реликвией империи-это отражение новой Британии: достойная, стабильная и перспективная. Пусть эта корона представляет волю народа и единство, которое мы восстановили."
 ENG_deterrent_rearmament: "Сдерживающая черта"
 ENG_deterrent_rearmament_desc: "Мы предпримем измеренное и прозрачное укрепление наших защитных сил, чтобы создать достоверный сдерживающий фактор, который служит миру. В этой программе приоритет артиллерии, поддерживающему укрепление, мобильные единицы, логистику и мобилизацию резерва, а не дорогостоящую проекцию электроэнергии. Цель ясна: сделать агрессию против нас рискованным предложением для любого актера, сохраняя при этом нашу позу в качестве чемпиона переговоров. Добро пожаловать, чтобы поддержать дипломатию - не заменить ее - гарантируя, что наши призывы к миру подкрепляются средствами для обеспечения ее при необходимости."
 ENG_call_for_european_peace: "Призыв к европейскому миру"
 ENG_call_for_european_peace_desc: "Пришло время обратиться к воюющим народам Европы с явным и решительным призывом к миру. Благодаря неустанной дипломатии, королевскому влиянию и обещанию безопасности в соответствии с нашими часами, мы пригласим все нации на стол - не просто обсудить мир, но и совершить его. Обращаясь как к их людям, так и к лидерам, мы стремимся сойти сеть понимания и неагрессии, которая будет терпеть покоя."
 ENG_imperial_conscription2: "Имперский призыв"
 ENG_imperial_conscription2_desc: "Мы давно пренебрегаем богатством рабочей силы, которую обеспечивает наша империя. Настало время, мы радикально улучшили призыв на пособие по всей Империи и убедиться, что у нас есть изобилие рабочей силы для борьбы с нашей войной. Все должны выполнять свой долг перед короной!"
 ENG_reclaim_the_imperial_mandate: "Вернуть имперский мандат"
 ENG_reclaim_the_imperial_mandate_desc: "С безопасным престолом мы должны напомнить миру, что наш суверенитет простирается за эти острова. Наследие империи не так легко исчезает - мы готовы вернуть себе то, что когда -то было нашим."
 ENG_restore_imperial_prerogatives: "Восстановить имперские прерогативы"
 ENG_restore_imperial_prerogatives_desc: "Старый баланс сил отдал за собой парламент слишком сильно. В соответствии с новым правлением мы должны восстановить исполнительную власть Короны как по гражданским, так и военным вопросам."
 ENG_consolidate_the_loyal_dominions: "Консолидировать верные владения"
 ENG_consolidate_the_loyal_dominions_desc: "В то время как некоторые бывшие доминии решили уйти от короны, другие остаются стойкими. Наша обязанность - вознаградить их верность и углубить наши связи с ними, гарантируя, что их голоса остаются услышанными, и их верность обеспечена."
 ENG_find_new_allies: "Найдите новых союзников"
 ENG_find_new_allies_desc: "Мы не можем победить Германию в одиночку, поэтому мы должны найти других союзников, с которыми у нас есть тесные отношения."
 ENG_joint_attack_on_germany: "Совместная атака на немецкий рейх"
 ENG_joint_attack_on_germany_desc: "Мы можем добиться победы с одновременной операцией против Германии."
 ENG_return_of_holy_roman_empire: "Возвращение Священной Римской империи"
 ENG_return_of_holy_roman_empire_desc: "Никто не будет стоять до возвращения Священной Римской империи, и все поклонится!"
 ENG_blockade_french: "Блокада Франция"
 ENG_blockade_french_desc: "Блокада, которую мы будем навязывать на Францию ​​с моря, будет очень плохое влияние на их экономику."
 ENG_joint_attack_on_france: "Совместная атака на Францию"
 ENG_joint_attack_on_france_desc: "Они никогда не смогут противостоять операции, которую мы будем выполнять против французов вместе с Германией."
 ENG_return_of_angevin_empire: "Возвращение Ангевина Империи"
 ENG_return_of_angevin_empire_desc: "Мы скоро должны вернуться в наши старые времена, они не смогут выступить против Ангевина империи."
 ENG_splendid_isolation: "Великолепная изоляция"
 ENG_splendid_isolation_desc: "Под давлением все более откровенного короля и населения, стоящего за ним, правительство приняло радикальный сдвиг в политике, пообещав нейтралитет на континентальные дела. Казалось бы, великолепная изоляция вернулась."
 ENG_appeasement_policy: "Новая политика умиротворения"
 ENG_appeasement_policy_desc: "Дальнейшее прерывание недавней традиции с его откровенным поведением, король дал необычайно неохраняемое и личное интервью с BBC News, в котором он утверждает, как солдат последней войны, за мир на континенте любой ценой. Принчанев Уайтхолла, отношение короля оказалось популярным на улицах, и многие британцы не должны умереть за еще одну европейскую войну."
 ENG_economic_reform: "Экономические реформы"
 ENG_economic_reform_desc: "Его Королевское Высочество стремится реформировать определенные коррумпированные финансовые практики, устанавливая больший надзор и хедгемонию над соответствующими секторами экономики."
 ENG_crown_works_programme: "Программа Crown Works"
 ENG_crown_works_programme_desc: "Массовые проекты общественных работ запускаются, чтобы облегчить безработицу, повысить моральный дух и связать экономику с королевским руководством."
 ENG_royal_armament_initiative: "Инициатива Королевского вооружения"
 ENG_royal_armament_initiative_desc: "Корона направляет ресурсы в производство оружия, гарантируя, что Британия оснащена для современной войны. Новые заводы поднимаются под королевскими хартиями."
 ENG_kings_officer_corps: "Корпус офицера короля"
 ENG_kings_officer_corps_desc: "Военные академии реструктурированы, чтобы подчеркнуть верность королю, прежде всего. Новое поколение офицеров появляется, верное монархии."
 ENG_mechanize_the_empire: "Механизуйте империю"
 ENG_mechanize_the_empire_desc: "Британская армия реформирована вокруг современной мобильной войны. Механизированные и моторизованные подразделения обеспечат соблюдение воли короны через империю."
 ENG_unite_the_isles: "Объединить острова"
 ENG_unite_the_isles_desc: "Для нас очень важно объединить острова, и полное доминирование, которое мы достигнем здесь, будет очень полезным для нас в будущем."
 ENG_retake_the_african_jewel: "Получить африканский драгоценный камень"
 ENG_retake_the_african_jewel_desc: "Независимый Египет - это слишком большой риск для наших азиатских и африканских интересов. Они снова будут приведены под контроль."
 ENG_kings_speech: "Речь короля"
 ENG_kings_speech_desc: "Еще раз, мы оказываемся на другой стороне лезвия от гун. Аппетит Гитлера к завоеванию достигла неприемлемого уровня, а цивилизованные нации Европы в противном случае против него и его ресанчжистка Германии. Настало время для всей нации прийти за этими военными усилиями, и какой лучший способ сплотить поддержку, чем речь для королевских предметов от британского суверена."
  
 ENG_elizabeth_ii: "Элизабет II"
 ENG_elizabeth_ii_desc: "Элизабет не ожидала стать королевой так скоро, но неудачная смерть ее отца подтолкнула ее по этому пути."
 ENG_queens_reign: "Царство королевы"
 ENG_queens_reign_desc: "Царство королевы сейчас начинается, наши союзники должны чувствовать себя счастливчиками."
 ENG_set_up_concentration_camps: "Установить концентрационные лагеря"
 ENG_set_up_concentration_camps_desc: "Мы должны следовать примеру Германии и создать концентрационные лагеря и использовать там рабовладельческий труд, чтобы принести пользу себе."
 ENG_demand_low_lands: "Требуют низких стран"
 ENG_demand_low_lands_desc: "Эти маленькие страны - лишь небольшое препятствие впереди нас, мы должны их раздавить."
 ENG_armed_neutrality: "Вооруженный нейтралитет"
 ENG_armed_neutrality_desc: "Мы должны заявить о нашем нейтралитете и избежать любых действий, которые бы согласовали нас с вражующими мировыми полномочиями."
 ENG_defenses_against_strategic_bombing: "Защита от стратегической бомбардировки"
 ENG_defenses_against_strategic_bombing_desc: "Если мы присоединимся к глобальному конфликту, мы должны обеспечить адекватно защищены наши города от неизбежной крупномасштабной стратегической бомбардировки, которым наши потенциальные враги, без сомнения, будут подвергнут нам."
  
 ENG_containment: "Сдерживание"
 ENG_containment_desc: "Пришло время начать нашу политику сохранения фашистских государств, таких как Германия. Мы видели, что, смягчая, вы никуда не получите."
 uk_wartime_measures: "Военные меры"
 uk_wartime_measures_desc: "Война, кажется, на нас, и поэтому мы должны начать готовиться; Мы не можем остаться в гонке, чтобы мобилизоваться, особенно с головным собранием, которые наслаждались нашими врагами."
 uk_plan_r4: "План r 4"
  uk_plan_r4_desc:0 "Use these possessions as the staging platform for an invasion of Norway and Sweden, a supplier of iron ore to the German War Machine. 
 uk_home_guards: "Развернуть домашние охранники"
 uk_home_guards_desc: "Поскольку угроза конфликта на нашей родине становится все более ясной, это идеально, мы формируем домашнюю милицию, в основном состоящую из великих ветеранов войны, чтобы замедлить любых иностранных захватчиков вовремя для того, чтобы профессиональные войска реорганизовались и отомстили."
 uk_government_code_and_cypher_school: "Государственный кодекс и школа Cypher"
 uk_government_code_and_cypher_school_desc: "Используя захваченных нацистских агентов для распространения дискформирования непосредственно на их контроллеры, мы можем запутать и запутать нацистские усилия по шпионажу."
 uk_operation_unthinkable: "Операция немыслимо"
 uk_operation_unthinkable_desc: "свободный мир"
 uk_ultra_enigma: "Ультра"
 uk_ultra_enigma_desc: "Шифрование машины загадки должно быть взломано; Это жизненно важно для военных усилий. К этим усилиям мы вкладываем наши лучшие математические умы в задачу; Проект Ultra ведется."
 ENG_war_propaganda: "Ограниченная военная пропаганда"
 ENG_war_propaganda_desc: "Многие из наций на Балканах про-британцы и видят ту же угрозу от Центральной Европы, что и мы. Если мы воспользуемся возможностью и поддерживаем их рано, мы сможем обеспечить их лояльность, хотя за счет зла ​​своих соседей -ресенгистов."
 ENG_luxemburg_security: "Безопасно Люксембург"
 ENG_luxemburg_security_desc: "Политические движения в Люксембурге продолжают поддерживать наших врагов и угрожают нашим союзникам. Люксембург должен быть приглушен, чтобы обеспечить свободную Европу."
  
 ENG_disunite_kingdoms: "Разделите королевство"
 ENG_disunite_kingdoms_desc: "«Соединенное Королевство» является не менее продуктом империализма, чем жестокий режим в Индии, который вынесен из соглашений между королями Бургуизи. Пришло время исправить это неправильно."
 ENG_syndicalist_development: "Децентрализованная промышленность"
 ENG_syndicalist_development_desc: "Планируемая в центре промышленной политики, сделанная бюрократами, далеко от реалий трудовой жизни, не является способом, чтобы получить свободное общество. Те, кто работает, решают, как, когда и где они работают!"
 ENG_syndicalist_research: "Синдикалистские исследования"
 ENG_syndicalist_research_desc: "Мы - нация, богатая обучением, с некоторыми из старейших в мире учреждений. Но все же знания остаются запертыми в башне из слоновой кости. Раздавать стипендии более недовольным людям Великобритании поможет массово расширить нашу производительность."
 ENG_syndicalist_resource: "Уделять приоритет извлечения ресурсов"
 ENG_syndicalist_army: "Синдикалистская армия"
 ENG_syndicalist_army_desc: "Мы являемся движением народа, и революционная армия должна быть не более чем конкретным, физическим воплощением воли пролетариата. Откройте арсеналы!"
 ENG_spread_syndicalism_neighbours: "Распространение синдикализма"
 ENG_spread_syndicalism_neighbours_desc: "Что хорошего в революции, связанной с берегами Британии? Пришло время распространять наши крылья и по всему миру!"
 ENG_syndicalist_iberia: "Распространение синдикализма на Иберию"
 ENG_syndicalist_iberia_desc: "Иберия была планом для британской революции - наш собственный премьер -министр Оруэлл, является ветераном войны в Испании, как и многие из наших ведущих чиновников. Они также оказываются отчужденными от авторитарной политики Советского Союза и будут дома в нашем международном сайте!"
 ENG_syndicalist_ireland: "Распространение синдикализма в Ирландию"
 ENG_syndicalist_ireland_desc: "Ирландия, которая долгое время стала жертвой Британской империи, наконец -то имеет шанс на будущее вместе со своими коллегами по островам. Предлагать им дразнящую перспективу объединенной Ирландии должна быть достаточно, чтобы привести их в Федерацию."
 ENG_soviet_scientists: "Советские ученые"
 ENG_soviet_scientists_desc: "Британия и Россия - две страны огромных знаний и обучения. Собрав наше исследование, мы можем неизмеримо украсить будущее человеческой расы!"
 ENG_red_army: "Красная армия"
 ENG_red_army_desc: "Мы обновили нашу армейскую систему, взяв пример Красной Армии, и наша новая красная армия намного сильнее, чем раньше."
 ENG_red_guards: "Красные охранники"
 ENG_red_guards_desc: "Основываясь на нашем единственном оружии для каждого человека политики, мы расширили наш закон о призывах."
 ENG_attack_ireland: "Атаковать Ирландию"
 ENG_attack_ireland_desc: "Капиталистическая Ирландия может легко стать трамплином для контрреволюционного вторжения Великобритании из -за изгнанной монархии и того, что остается их империей. Мы должны двигаться, прежде чем это произойдет."
 ENG_join_comecon: "Присоединяйтесь к ComeCon"
 ENG_join_comecon_desc: "Социалистические народы мира должны придерживаться вместе, чтобы гарантировать, что наши экономические необходимость и интерес не извращены реалиями капиталистического мира. С этой целью Совет по взаимной экономической помощи!"
 ENG_ideological_propaganda: "Идеологическая пропаганда"
 ENG_ideological_propaganda_desc: "Каждое коммунистическое движение - это потенциальная клетка, готовая организовать массы."
  
 ENG_diplomacy_with_the_reich: "Дипломатия с рейхом"
 ENG_diplomacy_with_the_reich_desc: "Базовая концепция фашизма - это в одиночку, мы слабы, как веточка, но вместе, как пакет, мы нерушимые - показывает, что наша судьба заключается в союзе с континентальными фашистскими способностями. Нападающие, для молодежи и Европы!"
 ENG_the_iron_ministry: "Железное служение"
 ENG_the_iron_ministry_desc: "Новое центральное министерство курирует внутреннюю инфраструктуру и производство войны, растворяя перекрывающиеся агентства и искоренение неэффективности."
 ENG_youth_loyalty_programmes: "Молодежные программы лояльности"
 ENG_youth_loyalty_programmes_desc: "Будущее государства заключается в ее молодежи. Спонсируемое государством образование и военизированное образование обеспечивают лояльность с самого раннего возраста."
 ENG_iron_fleet_initiative: "Инициатива Железного флота"
 ENG_iron_fleet_initiative_desc: "Запускается программа военно -морских перевоотданий, приоритетная тяжелые крейсеры и современные линкоры для обеспечения морского доминирования."
 ENG_state_propaganda_directorate: "Государственная пропагандистская дирекция"
 ENG_state_propaganda_directorate_desc: "Новое Директорат создан для наблюдения за всем коммуникацией - оцениванием, радио, кино и образованием - чтобы привить единство, силу и лояльность."
 ENG_restructure_the_british_state: "Реструктурировать британское государство"
 ENG_restructure_the_british_state_desc: "Новая Британия требует новой структуры. Старая парламентская структура демонтируется в пользу централизованных министерств и фашистского административного приказа."
 ENG_military_exchange_programs: "Военные программы обмена"
 ENG_military_exchange_programs_desc: "Делегации обмениваются с немецкими военными для изучения доктрины, дисциплины и механизации - подготовки к будущим войнам."
 ENG_join_the_axis: "Присоединяйтесь к оси"
 ENG_join_the_axis_desc: "Обеспечивая идеологическое и военное выравнивание, Британия официально присоединяется к оси, став ключевой опорой фашистской власти в Европе."
 ENG_road_war: "Подготовьтесь к войне"
 ENG_road_war_desc: "Все, что остается дряхлым и статичным, империя, нация, раса, неизбежно увядает и умрет. Благодаря постоянному расширению, переосмыслению и прогрессу мы будем первой вечной империей."
 ENG_demand_ireland: "Требовать Ирландии"
 ENG_demand_ireland_desc: "Ирландцы продолжают составлять свои глупые представления о независимости, и наша терпимость в конце. Настало время сокрушить их сопротивление и вернуть всю страну в склад в качестве неотъемлемой части Соединенного Королевства."
 ENG_rebuild_imperial_core: "Восстановить имперское ядро"
 ENG_rebuild_imperial_core_desc: "Фокус переключается на укрепление домашних островов как сердце империи. Промышленность, транспорт и управление должны отражать имперское первенство."
 ENG_ally_portugal: "Альянс с Португалией"
 ENG_ally_portugal_desc: "Альянс с Португалией стратегически очень важен для нас."
 ENG_secure_oil_imports: "Закрепите импорт нефти"
 ENG_secure_oil_imports_desc: "Для нас очень важно захватить нефтяные скважины и не допустить, чтобы наши враги использовали их."
 ENG_invite_china: "Пригласить Китай"
 ENG_invite_china_desc: "Союзник, который может поддержать нашу армию на всех фронтах, будет очень полезен для нас."
 ENG_invite_japan: "Пригласить Японию"
 ENG_invite_japan_desc: "Только Королевский флот может не иметь шанса против ВМС США, но если бы мы обновили англо-японский альянс."
 ENG_attack_france: "Атаковать Францию"
 ENG_attack_france_desc: "Фашизм не смог завоевать силу во Франции. Либеральные и коммунистические идеалы обладают слишком большой силой, поэтому на нас падает, чтобы освободить француза от слабости."
 uk_fascist_military: "Национальная программа мобилизации"
 uk_fascist_military_desc: "Чтобы увидеть как сильное, вы должны быть сильными. Мы не можем позволить нашим войскам продолжать находиться в стороне в пользу других областей. Военные всегда будут приоритетом номер один."
 ENG_become_global_hegemony: "Станьте глобальным гегемоном"
 ENG_become_global_hegemony_desc: "Теперь, когда мы стали глобальным гегемоном, никто не может противостоять нам и нашим союзникам."
 ENG_organize_the_military: "Организовать военные"
 ENG_organize_the_military_desc: "Для нашей армии было нормально вести себя спокойно, потому что мы являемся одной из величайших держав в мире, но во времена войны это доставит нам большие проблемы. Вот почему армия должна быть реформирована и восстановлена ​​до ее прежней славы."
  
 uk_ireland_focus: "Развитие в Ирландии"
 uk_ireland_focus_desc: "Состояние наших колоний в Ирландии остается спорным как за рубежом, так и дома, но все, что для них ждет, укрепление их промышленных мощностей является приоритетом на нынешнем этапе. Может быть, эта поддержка может заставить их оставаться с нами."
 uk_protect_pyrenees: "Защитите пиренеи"
 uk_protect_pyrenees_desc: "Пиренеи - очень сложные горы, чтобы пересечь, если нам удастся заранее укреплять это место, мы можем затруднить атаку Франции атаковать Испанию."
 uk_protect_spanish_morocco: "Защитите испанское Марокко"
 uk_protect_spanish_morocco_desc: "Мы можем сделать Гибралтара более безопасным для нас, защищая испанское Марокко."
 uk_protect_cyprus: "Защитите Кипр"
 uk_protect_cyprus_desc: "Кипр командует отличной позицией в Центральном Средиземноморье, жизненно важной станции, вдоль нашей спасательной линии через Египет и Суэцкий канал в Индию и на Дальнем Востоке. Время, потраченное на укрепление этого сильнее, никогда не может быть потрачено впустую."
 uk_protect_bosphorus: "Защитить Босфор"
 uk_protect_bosphorus_desc: "Проливы находятся в очень важном положении для нас, если мы сможем защитить проливы без каких -либо проблем, мы предотвратим спуск Советского флота в Черном море."
 uk_protect_aegean_islands: "Защитите Эгейские острова"
 uk_protect_aegean_islands_desc: "Эгейские острова - еще один способ держать турецкий пролив под контролем. Если мы сможем защитить эти области, корабли, поступающие из Черного моря, должны быть очень повезло пройти здесь."
 uk_support_education_in_india: "Поддержка образования в Индии"
 uk_support_education_in_india_desc: "Есть большое количество блестящих умов, которые остаются необоснованными и неразвитыми в Индии; Открывая университеты, мы можем массово увеличить интеллектуальные возможности нации."
 ENG_developing_the_empire: "Развитие империи"
 ENG_developing_the_empire_desc: "Условия жизни в каждом углу нашей империи должны быть равными, поэтому мы должны инвестировать в каждый регион."
 ENG_choosing_capital_imp: "Выбор нового капитала"
 ENG_choosing_capital_imp_desc: "Изменение столицы нашей империи, которая достигла своих наибольших пределов, может иметь стратегический смысл, но сделаем ли мы это?"
 uk_african_focus: "Развивать Африку"
 uk_african_focus_desc: "Мы вырезали большие борьбы с темным континентом для себя; Теперь со сталью, железной дорогой и асфальтом мы должны сделать это своим."
 uk_form_camel_corps: "Форма верблюжьего корпуса"
 uk_form_camel_corps_desc: "Верблюды идеально подходят для борьбы в пустыне, и они дают большое преимущество, особенно в очень больших пустынях."
 uk_develop_africas_infrastructure: "Развивать африканскую инфраструктуру"
 uk_develop_africas_infrastructure_desc: "Мы должны получить преимущество перед Италией, укрепляя инфраструктуру в Африке. Если наша инфраструктура не сильна, этот фронт может превратиться в ада для наших солдат."
 ENG_reform_balkan_entente: "Реформа Балканской Антенте"
 ENG_reform_balkan_entente_desc: "Балканский пакт был сформирован из Турции, Югославии, Румынии и Греции, чтобы сдержать болгарский и венгерский ирредентизм, но с тех пор мир стал значительно более опасным. Балканский договор неадекватен для защиты от роста Германии и реакционных режимов в Венгрии и Болгарии. Британия должна поощрять этот договор о реформировании балканской атенте."
 ENG_enosis_focus: "Эноз"
 ENG_enosis_focus_desc: "Правительство [GRE.GetAdjective] на протяжении десятилетий дало свои претензии на Кипр и настаивает на том, что объединение (называемое энозом) является единственным устойчивым будущим для Кипра. Министерство иностранных дел не соглашается с этим и считает, что киприоты должны иметь самоуправление. Чтобы получить полную поддержку Греции в войне, мы будем идти на компромисс и позволим происходить эйоз, если киприоты получат автономию."
 ENG_pax_britannica: "Pax Britannica"
 ENG_pax_britannica_desc: "Поскольку пыль хаоса оседает, и глобус снова устойчив, Британия не вызовет. Наши враги лежат побеждены, наши союзники встали в коленях в отношении, а сила нашей промышленности и оружия обеспечивает устойчивую мирную форму, формируемую британские идеалы. Это не просто конец войны - это начало нового порядка. Мир узнает фирму, но справедливую руку империи, поскольку мы подделываем возраст, когда британское лидерство, а не завоевание, определяет стабильность. В тени стали и суверенитета, новая британская Pax Britannica Dawns."
  
 ENG_national_recovery_programme: "Национальная программа восстановления"
 ENG_national_recovery_programme_desc: "Экономический спад в последние годы ослабл, но структурные проблемы остаются. Запустив скоординированную национальную программу инвестиций и реформ, мы можем обеспечить стабильное и процветающее восстановление."
 ENG_rearmament_drives_industry: "Установка поездок по водителям индустрии"
 ENG_rearmament_drives_industry_desc: "Наша перевооружение - это не только военная необходимость - это экономическая возможность. Военное производство может стимулировать наши фабрики и объединить рабочую силу."
 ENG_an_arsenal_for_the_empire: "Арсенал для империи"
 ENG_an_arsenal_for_the_empire_desc: "Наши глобальные обязанности требуют надежной и способной оборонной отрасли. Конвертируя и расширяя фабрики для военного использования, Британия снова станет мастерской войны - не только для себя, но и для всей империи."
 ENG_public_works_expansion: "Расширение общественных работ"
 ENG_public_works_expansion_desc: "В общенациональной программе финансируемых правительством проектов инфраструктуры не будет только тысячи тысяч, но также предоставит экономический стимул, который нуждается в нашем гражданском секторе."
 ENG_revitalize_the_economy: "Оживить экономику"
 ENG_revitalize_the_economy_desc: "Хотя худший из экономического кризиса прошел, наша экономика остается застойной и неровной. Пришло время запустить серию политики, чтобы вдохнуть жизнь обратно в британскую промышленность и восстановить рост по всей стране."
 ENG_expand_imperial_college: "Расширить имперский колледж"
 ENG_expand_imperial_college_desc: "Имперский колледж находится на переднем крае научных инноваций. С ростом государственного финансирования, новых лабораторий и растущего академического персонала, мы будем расширять возможности нашей страны с помощью расширенных исследовательских возможностей."
 ENG_national_housing_initiative: "Национальная жилищная инициатива"
 ENG_national_housing_initiative_desc: "Мы будем финансировать крупномасштабные программы жилищного строительства и инфраструктуры, чтобы обеспечить как занятость, так и достоинство для британцев."
 ENG_expand_steelworks: "Развернуть сталелитейные заводы Британии"
 ENG_expand_steelworks_desc: "С угрозой конфликта, растущей в Европе, увеличение производства внутренней стали стало национальным приоритетом. Наши фабрики в Шеффилде и за его пределами должны быть модернизированы и расширены, чтобы удовлетворить будущие требования."
 ENG_expand_imperial_chemical_industries: "Расширить имперскую химическую промышленность"
 ENG_expand_imperial_chemical_industries_desc: "Имперская химическая промышленность является краеугольным камнем британского химического сектора. Расширяя его производственные мощности и исследовательские возможности, мы можем укрепить нашу военную цепочку поставок и обеспечить превосходство химического вещества как в гражданских, так и в приложениях для военного времени."
 ENG_dual_pillars_of_industry: "Двойные столбы промышленности"
 ENG_dual_pillars_of_industry_desc: "Мы должны сбалансировать потребности нашего гражданского населения с растущими требованиями военных. С мудрым руководством мы можем поддержать оба."
 ENG_expand_the_lochaber_scheme: "Расширить схему Лочабера"
 ENG_expand_the_lochaber_scheme_desc: "Гидроэнергетический проект Lochaber, сосредоточенный вокруг плотины Спей, является одним из самых амбициозных подвигов инженеров в Шотландском нагорье. Первоначально построенный для питания алюминиевого плавиля в Форт-Уильяме, он использует воды реки Спей для генерирования надежного, крупномасштабного электричества. Расширяя и модернизируя эту схему, мы можем обеспечить постоянную власть как для промышленного производства, так и для военных усилий, принося свет и промышленность в отдаленное нагорье."
 ENG_war_workshop_expansion: "Расширение военного семинара"
 ENG_war_workshop_expansion_desc: "Мы расширим свои заводы по вооружениям и связанные с войной промышленности, обеспечивая постоянную поставку оборудования для предстоящих конфликтов."
 ENG_total_war_mobilization: "Полная война мобилизация"
 ENG_total_war_mobilization_desc: "Теперь, когда мы находимся на войне, каждый аспект британской жизни должен служить военным усилиям. Промышленность, наука и рабочая сила объединяются в одной цели: победа."
 uk_expand_mi6: "Расширить MI6"
 uk_expand_mi6_desc: "Мы должны разрабатывать и управлять агентством Intellegence, которое будет составлено со штаб -квартирой в Парке Блетчли, чтобы повысить эффективность в наших операциях Intel."
 ENG_nuke_alone: "Ядерные усилия"
 ENG_nuke_alone_desc: "Физические уравнения показывают, что деление урана может высвободить гигантское количество энергии. Это потенциально может привести к созданию бомбы почти немыслимой силы."
  
 ENG_air_training: "Программа обучения пилота"
 ENG_air_training_desc: "Наша рабочая сила растянута и тонко распространена; Мы должны приложить усилия по обучению тех пилотов, которые у нас есть, а также набирать добровольных добровольцев со всей империи и мира для летающих самолетов."
 ENG_army_rearmament_focus: "Армейский перевозка"
 ENG_army_rearmament_focus_desc: "Основанная в 1660 году, с гордостью одна из лучших боевых сил в мире, британская армия привлекает внимание, когда лев ревет."
 ENG_embrace_modern_warfare: "Примите современную войну"
 ENG_embrace_modern_warfare_desc: "Будущее войны заключается не в окопах, а в движении, машинах и механизированной агрессии. От немецкой тактики Blitzkrieg до советской теории глубоких операций мир меняется. Мы должны адаптироваться - или остаться позади."
 ENG_mechanized_warfare: "Механизированная война"
 ENG_mechanized_warfare_desc: "Механизированная пехота позволит нам проецировать мощность со скоростью, эффективностью и шоком. Грузовики и полу-треки заменят марширующие колонны, позволяя нашим силам захватить инициативу и эксплуатировать прорывы."
 ENG_armoured_spearhead_tactics: "Бронированная тактика Spearhead"
 ENG_armoured_spearhead_tactics_desc: "Дивизии танков больше не должны быть отнесены к поддержке ролей - они возглавят обвинение. Наша доктрина будет сосредоточена на независимых бронированных тягах, глубоких окружениях и высокоскоростной эксплуатации. Мы подкидываем кончик копья."
 ENG_embrace_traditional_warfare: "Примите традиционную войну"
 ENG_embrace_traditional_warfare_desc: "В возрасте, одержимым инновациями, мы подтверждаем наше доверие к вечным ценностям дисциплины, огневой мощи и сплоченности. Доктрины, вылеченные в окопах Великой войны, будут продолжать направлять нашу руку. Мы не отказались от уроков, оплачиваемых в крови."
 ENG_infantry_doctrines: "Поддерживать доктрину пехоты"
 ENG_infantry_doctrines_desc: "Пехоплин остается основой британской армии. Через структурированные строки, хорошо отрепетированные формирования и полевую дисциплину мы будем поддерживать превосходство на поле битвы. Наша стратегия зависит от сплоченности, а не хаоса."
 ENG_artillery_modernization: "Артиллерийская модернизация"
 ENG_artillery_modernization_desc: "Огненная мощь нашей артиллерии должна соответствовать масштабам предстоящих конфликтов. Новые дизайны, такие как 25-фунтовый боеприпасы, обещают большую мобильность, точность и летальность. Мы будем инвестировать в фабрики, обучение и логистику, чтобы наши канониры не имели равных."
 ENG_firepower_first: "Сначала огневая мощь"
 ENG_firepower_first_desc: "Мы отвергаем скорость силы, маневрировать для уничтожения. Концентрируя подавляющий артиллерийский и пулемый огонь, мы сделаем оскорблениями вражеских оскорблений, прежде чем они даже достигнут наших линий. Война выигрывает огонь, а не вспышка."
 ENG_coastal_fortification_program: "Программа прибрежного укрепления"
 ENG_coastal_fortification_program_desc: "Наша островная природа предлагает естественную защиту, но мы не должны полагаться только на географию. Мы отправимся в амбициозную программу построения бункеры, пибетки, противотанковой обороны и укрепленных портов, чтобы гарантировать, что нет захватчиков, не подчиняющихся британской почве."
 ENG_comprehensive_mobilization: "Комплексная мобилизация"
 ENG_comprehensive_mobilization_desc: "Чтобы вести полную войну, мы должны мобилизовать не только наши вооруженные силы, но и всю страну. Благодаря призывам, промышленному обращению и централизованному экономическому планированию каждый гражданин будет играть роль в защите Британии. Граница между солдатом и гражданским лицом будет размыться."
 ENG_grand_army_reforms: "Реформа Великой армии"
 ENG_grand_army_reforms_desc: "Следуя суровым урокам ранних неудач и организационной стагнации, мы пересмотрим нашу армию в современную, объединенную силу. Британская экспедиционная сила, домашние команды и колониальные подразделения будут реорганизованы под упорядоченным лидерством и обновленными доктринами."
 ENG_military_bureau_reorganization: "Реорганизация военного бюро"
 ENG_military_bureau_reorganization_desc: "Военный офис, генеральный штаб и поставки страдают от хронической неэффективности и межбранкового соперничества. Благодаря широкой административной реформе мы создадим централизованную и профессиональную структуру команд, способную поддерживать высокоинтенсивную, современную войну."
 ENG_expand_the_royal_marines: "Расширить королевские морские пехотинцы"
 ENG_expand_the_royal_marines_desc: "Поскольку амфибийная война становится важной частью современной стратегии, мы должны расширить и модернизировать королевские морские пехотинцы. Будут подняты дополнительные батальоны, будет проведено специализированное обучение, и координация с Королевским флотом будет приоритетом для обеспечения быстрых и эффективных нападений на берег в любой точке мира."
  
 ENG_reform_the_army_structure: "Реформировать армейскую структуру"
 ENG_reform_the_army_structure_desc: "Королевская армия недавно потеряла свою бывшую славу и власть. Нам нужно ввести структурные реформы в армию, прежде чем мы сможем ее модернизировать и восстановить ее прежнюю силу."
 ENG_improve_ship_cannons: "Улучшить судовые пушки"
 ENG_improve_ship_cannons_desc: "Наши судовые пушки иногда слабы против других стран, и это делает наши корабли слабыми. Нам нужно разрабатывать и производить новые пушки таким образом, чтобы не напрягать наш бюджет."
 ENG_expand_naval_facilities: "Расширить военно -морские средства"
 ENG_expand_naval_facilities_desc: "Перед лицом растущей напряженности в мире некоторые страны увеличили свои военно -морские инвестиции, что беспокоило наш флот. Нам нужно сделать новые инвестиции, чтобы наш флот не был ослаблен в случае возможной войны."
