l_russian:
  NWO_AI_Workaround:0 "Обходной AI"
  NWO_AI_Workaround_desc:0 "Это обходное решение для того, чтобы ИИ выбрал законы о рабочей силе. Если вы видите это, то что-то серьезно не так!"
  offensive_espionage_decisions:0 "Наступательный шпионаж"
  defensive_espionage_decisions:0 "Оборонительный шпионаж"
  infiltrate_target_nation:1 "Инфильтрация [From.GetName]."
  infiltrate_target_nation_desc:1 "Мы начали изучать возможность инфильтрации [From.GetName], чтобы подорвать их военные усилия."
  NWO_can_change_laws:0 "Вы можете изменить законы о прессе только с помощью решений"
  NWO_press_decisions:0 "Решения по прессе"
  NWO_encourage_free_thought_democratic:0 "Поощрять свободомыслие"
  NWO_encourage_free_thought_democratic_desc:0 "Мы можем не соглашаться с мнениями всех наших людей, но многие высказывают здравые идеи. Мы должны побуждать их участвовать в общенациональной дискуссии."
  NWO_adopt_free_press:0 "Принять свободную прессу"
  NWO_adopt_free_press_desc:0 "Свобода прессы является священным учреждением во многих демократиях. Даже в тяжелом положении мы не можем отказаться от своей морали."
  NWO_adopt_censored_press:0 "Принять цензурированную прессу"
  NWO_adopt_censored_press_desc:0 "Государство знает все, что хотят услышать люди, зачем доверять кому-то еще?"
  NWO_man_the_assembly_line:0 "Укомплектовать сборочную линию"
  NWO_man_the_assembly_line_desc:0 "Наши армии постоянно нуждаются в снабжении. Если люди узнают о бедственном положении наших солдат, они сделают все возможное, чтобы поддержать их."
  NWO_adopt_productive_press:0 "Внедрить прессу, повышающую производительность"
  NWO_adopt_productive_press_desc:0 "Производительный народ - счастливый народ! Также это радует и [Root.GetLeader]. А [Root.GetLeader] любит быть радостным."
  NWO_message_the_resistance:0 "Отправить сообщение Движению Сопротивления"
  NWO_message_the_resistance_desc:0 "Несмотря на то, что мы были вынуждены капитулировать перед лицом врага, наш народ сохраняет железную волю и верность. Нашему правительству удалось наладить связь с различными ячейками сопротивления на оккупированных территориях. Под нашим руководством и с нашими ресурсами они могут нанести серьёзный ущерб."
  NWO_adopt_resistance_press:0 "Внедрить прессу Движения Сопротивления"
  NWO_adopt_resistance_press_desc:0 "Если мы должны сдаться, то простая удерживание своей территории сокрушит наших врагов."
  NWO_training_initiative:0 "Запустить инициативу подготовки"
  NWO_training_initiative_desc:0 "В то время как новые рекруты подписываются по всей стране, нам следует уделить больше усилий, чтобы быстро доставить их на поле боя."
  NWO_adopt_mobilization_press:0 "Внедрить прессу Мобилизации"
  NWO_adopt_mobilization_press_desc:0 "Мы хотим ТЕБЯ. И тебя тоже. И тебя. И тебя."
  NWO_propaganda_campaign:0 "Националистическая пропагандистская кампания"
  NWO_propaganda_campaign_desc:0 "Наш народ должен быть готов сражаться за нашу страну."
  NWO_adopt_nationalism_press:0 "Внедрить прессу, поддерживающую национализм"
  NWO_adopt_nationalism_press_desc:0 "Наш образ жизни, наша вера и наши ценности превосходят всё остальное в мире."
  NWO_adopt_security_press:0 "Внедрить прессу, поддерживающую безопасность"
  NWO_adopt_security_press_desc:0 "Длинный язык до добра не доведет"
  NWO_logistics_initiative:0 "Инициатива по логистике"
  NWO_logistics_initiative_desc:0 "В нашем стремлении распространять славу на мир, наши линии снабжения должны быть упорядоченными"
  NWO_adopt_aggressive_press:0 "Принять агрессивную прессу"
  NWO_adopt_aggressive_press_desc:0 "Наши соседи слабы. Когда мы раскроем эту слабость нашему народу, они будут требовать нашей экспансии"