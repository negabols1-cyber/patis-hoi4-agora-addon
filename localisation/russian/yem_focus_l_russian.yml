  YEM_german_general_staff:0 "Германский Генеральный штаб"
  YEM_naval_effort:0 "Создание йеменского флота"
  YEM_naval_effort_desc:0 "Расширение нашего флота должно стать нашим главным приоритетом. Направить все имеющиеся ресурсы на новые верфи и исследования лёгких надводных кораблей."
  YEM_submarine_effort:0 "Подводные лодки"
  YEM_submarine_effort_desc:0 "Подводные лодки - наиболее впечатляющая военно-морская разработка со времён изобретения торпедных катеров. Нам следует не только защищаться от подводных лодок, но и использовать их против вражеских судов."
  YEM_destroyer_effort:0 "Эсминцы"
  YEM_destroyer_effort_desc:0 "Изучив конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать этим стратегиям. Эсминцы будут иметь решающее значение."
  YEM_flexible_navy:0 "Универсальный флот"
  YEM_flexible_navy_desc:0 "Обновление военно-морского флота, учитывая достижения в области технологий подводного плавания, позволит нам эффективно наносить удары по вражеским конвоям."
  YEM_aviation_effort:0 "Авиация"
  YEM_aviation_effort_desc:0 "Нигде технологический прогресс не идёт так быстро, как в воздушной войне. Авиация — это область, в которой любой современной нации нужно стать мастером."
  YEM_fighter_focus:0 "Фокус на истребители"
  YEM_fighter_focus_desc:0 "Великая война ещё не поставила точку в воздушных боях. Сохранение лидерства в развитии истребителей даст нам преимущество в будущем."
  YEM_bomber_focus:0 "Фокус на бомбардировщики"
  YEM_bomber_focus_desc:0 "Когда будущие поколения будут говорить об ужасе сегодняшних войн, огонь, падающий с небес, будет занимать видное место. Мы сделаем всё возможное, чтобы эти истории рассказывали наши враги."
  YEM_aviation_effort_2:0 "Авиационные усилия"
  YEM_aviation_effort_2_desc:0 "Дальнейшее совершенствование авиации будет необходимо для хорошей интеграции наших военно-воздушных сил с другими видами войск."
  YEM_CAS_effort:0 "Усилия в области CAS"
  YEM_CAS_effort_desc:0 "Современная армия нуждается в поддержке с воздуха, а не только с земли."
  YEM_NAV_effort:0 "Усилия в области NAV"
  YEM_NAV_effort_desc:0 "Как и новые морские сражения, отчасти проходящие под водой, часть из них происходит в воздухе над водой."

  YEM_industrial_effort:0 "Промышленный потенциал"
  YEM_industrial_effort_desc:0 "Сосредоточим все наши политические усилия на развитии гражданской промышленности с большим скачком вперед."
