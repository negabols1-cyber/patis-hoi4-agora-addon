  YEM_secret_weapons_desc:0 "Возникает соблазн потратить все дополнительные ресурсы на разработку танков и самолётов, однако секрет победы в войнах лежит в совершенно новых областях науки: электронике, ракетостроении и ядерных исследованиях."
  YEM_extra_tech_slot:0 "Дополнительный слот для исследования"
  YEM_extra_tech_slot_desc:0 "Наш промышленный рост и другие недавние достижения могут позволить нам проводить больше НИОКР параллельно."
  YEM_nuclear_effort:0 "Ядерные усилия"
  YEM_nuclear_effort_desc:0 "Стоя на пороге мирового открытия, мы не можем допустить, чтобы другие зажгли огонь, который однажды может поглотить Землю."
  YEM_militarization_of_aden:0 "Милитаризация Адена"

  #Армия
  YEM_muzaffer_army:0 "Армия Музаффера"
  YEM_muzaffer_army_desc:0 "После того как Османская империя покинула Йемен, даже солдат, призванных имамом Йахья для джихада, стало недостаточно. Поэтому в 1919 году была сформирована армия Музаффера «Победоносного». Сначала ливанские торговцы оружием снабжали армию, но сейчас мы сталкиваемся с серьёзными проблемами. Пора их решать."
  YEM_expand_royal_guards:0 "Укрепление Королевской гвардии"
  YEM_expand_royal_guards_desc:0 "С момента образования имамата Йемена Королевская гвардия, или подразделения Укфа, отвечала за защиту имама. Чтобы вступить в это подразделение, необходимо было продемонстрировать выдающиеся успехи и лояльность имаму. После закона Королевства 1926 года войска Укфа начали выполнять и другие задачи, помимо защиты имама..."
  YEM_further_arming_the_tribal_army:0 "Дальнейшее вооружение племенной армии"
  YEM_further_arming_the_tribal_army_desc:0 "Армия Барани, или племенная армия, состояла из пехоты и кавалерии, которые обычно служили в течение 1-2 лет, принося свои собственные винтовки и припасы. В своих войнах против соперников Йемен всегда в основном полагался на своих сторонников из племен. Эти племена обычно населяли северные, северо-западные и восточные районы. Этот тип воинов классифицируется как традиционные национальные армии, возглавляемые племенными вождями и без регулярного порядка."
  YEM_use_camels:0 "Использовать верблюдов в армии"
  YEM_use_camels_desc:0 "На самом деле верблюды не привыкли к географии Йемена, по крайней мере, в районе Саны, потому что Йемен - страна сложных горных дорог, откуда те, кто входит, не могут выйти. Но условия жизни стали вынуждать нас использовать верблюдов. Так же, как в 1904 году во время нашей освободительной войны под предводительством имама Яхьи. Турки в горах Муша были посланы нами, связанные по рукам и ногам и тащимые верблюдами..."
  YEM_military_schools:0 "Йеменская военная школа"
  YEM_military_schools_desc:0 "В 1925 году, после того как королевство Хиджаз было уничтожено саудитами, к нам бежали многие либералы и солдаты. Среди них был Хасан Тахсин аль-Факир. Он был великим офицером в Османской армии. Он также был новатором. Благодаря ему, наша подготовка к концу завершена, и мы можем открыть военные школы, которые станут первым шагом к созданию обученной, организованной армии в дополнение к солдатам, которых мы набрали из племен."
  YEM_footsteps_of_the_modern_army:0 "Шаги современной армии"
  YEM_footsteps_of_the_modern_army_desc:0 "Наши солдаты маршируют в радости, и вот что звучит из их уст:\nРодина, Родина\nО юность Йемена,\nНаша нация не имеет цены\nРазве что свою душу и свой саван.\n"
  YEM_foundation_of_the_defense_army:0 "Основание оборонительной армии"
  YEM_foundation_of_the_defense_army_desc:0 "Под присмотром Хассана Тахсина аль-Факира мы открыли первые военные училища. Наши солдаты обучены. Теперь нам нужно объединить их в армию, где они будут организованы, и здесь опять замешан аль-Факир. В отличие от победоносной армии, обучение будет основано на опыте, а не на теории! Однако, ещё ведутся споры о том, будет ли достаточным этот период обучения для того, чтобы солдаты освоили военную выучку, боевые навыки и военную подготовку. Руководство утверждает, что мы не можем себе позволить тратить больше денег на обучение солдат. Ведь теперь, с законом о призыве, в армию пойдут все йеменцы, а не только племена."
  YEM_adopt_new_doctrines:0 "Принять новые доктрины"
  YEM_adopt_new_doctrines_desc:0 "Никто не приезжал в Йемен, кроме востоковедов. Ведь у всех любимицей был Аден. Поэтому мы давно вне этого доктринального дела. Пора уже разобраться с этим."
  YEM_produce_modern_small_arms:0 "Производить современное стрелковое оборудование"
  YEM_produce_modern_small_arms_desc:0 "Хотя винтовки, полученные нами от Османской империи, были довольно достаточными, они устаревали. Это эпоха автоматического оружия. Мы должны идти в ногу со временем."
  YEM_modernize_artillery:0 "Модернизация артиллерии"
  YEM_modernize_artillery_desc:0 "Когда Фатих использовал пушки при осаде Стамбула, применение пушек стало привлекать внимание всех, но Йемен не был включен в это. Как только пришли известия, имам того времени запретил их. Но с тех пор многое изменилось. В 1904 году во время нашей освободительной войны мы захватили или украли много пушек у Османской империи, это зависит от того, кого вы спросите."
  YEM_open_new_factories_for_ammunation:0 "Открытие новых заводов по производству боеприпасов"
  YEM_open_new_factories_for_ammunation_desc:0 "Когда Йеменское королевство было впервые создано, в Йемене не было ничего, кроме сельского хозяйства, поскольку Османская империя больше инвестировала на Балканах, чем на Аравийском полуострове и в Анатолии. У него не было другого оружия, кроме винтовок, полученных от Османской империи, Королевства Италии и Соединенного Королевства. Боеприпасы - еще одна проблема. У нас нет надлежащих боеприпасов, кроме ржавых пуль. Нам нужно решить эту проблему сейчас."
  YEM_modernization_of_the_army:0 "Модернизация армии"
  YEM_modernization_of_the_army_desc:0 "Две армии создают множество технических проблем. Например, военачальники спорят о том, кто будет защищать территорию, победивший или обороняющийся. Мы должны найти радикальное решение этой проблемы. Что-то вроде еменского командования, вроде того, как всем управляют из одного центра в современных системах."
  YEM_continue_with_irregular_army:0 "Продолжить с нерегулярной армией"
  YEM_continue_with_irregular_army_desc:0 "Баранские армии достаточно долго поддерживали нас. Мы не можем тратить большую часть нашего бюджета на модернизацию. Поэтому пока лучше придерживаться этой системы нерегулярной армии."
  YEM_motorization_of_the_army:0 "Моторизация армии"
  YEM_motorization_of_the_army_desc:0 "В 1920-х годах с появлением механизированного автомобиля имам Яхья не захотел оставаться в стороне и создал национальную транспортную компанию для крестьян, которые ездили в города продавать свои товары и для транспорта. Но эта компания не охватывала весь Йемен. Кроме того, армия до сих пор не была обеспечена транспортными средствами. Пришло время решить эту проблему."
  YEM_armor_effort:0 "Прогресс в области бронетехники"
  YEM_armor_effort_desc:0 "После того как в 1923 году бригадный генерал Гарольд Джейкоб подарил имаму Яхье Ford Model Car, мы начали больше знакомиться с этими «механическими повозками». И наконец, мы сможем их усовершенствовать и устанавливать на них пушки, также как устанавливаем их на верблюдах! Мы верим, что у нас получится сделать это так же красиво, как у немцев!"
  YEM_introduction_of_support_units:0 "Внедрение вспомогательных подразделений"
  YEM_introduction_of_support_units_desc:0 "До этого момента в Йемене были только пушки и ружья. Реформы, которые мы начали, идут замечательно, и как последняя часть этих реформ, поступили вспомогательные подразделения. Теперь наши солдаты смогут использовать бинокли и лопаты!"
  YEM_special_forces:0 "Специальные силы безопасности"
  YEM_special_forces_desc:0 "Раньше йеменская армия была обучена только собирать налоги и защищать страну. Но времена меняются. Нам нужны лучше обученные, высококвалифицированные войска. Они станут главными ударными подразделениями нашей армии."
  YEM_lift_the_aircraft_ban:0 "Снять запрет на самолеты"
  YEM_lift_the_aircraft_ban_desc:0 "С помощью немцев и итальянцев в 1926 году были созданы военно-воздушные силы Йемена. 12 йеменцев были отправлены в Италию для обучения лётному делу, и с помощью итальянской команды в Йемене была основана лётная школа. Когда купленные в Италии самолёты прибыли, имам Яхья был очень зол. Все они были неисправны. Он тут же сообщил об этом в Италию. Итальянцы согласились заменить их на новые, но непонятно почему, мы думаем, что новые самолёты, которые они прислали, тоже были в ужасном состоянии. Самолёты, поставленные Йемену, разбились через три месяца, убив всех трёх членов экипажа. После этого имам Яхья запретил использование самолётов. Но с тех пор многое изменилось."
  YEM_rebuild_the_airforce:0 "Воссоздание ВВС Йемена"
  YEM_rebuild_the_airforce_desc:0 "Наконец, наши солдаты смогут летать как стрижи!"
  
