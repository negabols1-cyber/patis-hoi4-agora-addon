  tech_support:0 "Поддержка технологий"
  CHI_GATHERING_STORM_DESC:0 "Будучи некогда одной из сильнейших стран на планете, Китай пал под гнетом почти столетия западного империализма и внутренних разногласий.\n\nЧан Кайши и партия Гоминьдан, являющиеся центральным правительством Китая, теперь сталкиваются с угрозами как со стороны Японской империи, которая уже аннексировала большую часть Китая, так и со стороны коммунистов Мао, которые в настоящее время засели в горах Шэньси. Окруженный со всех сторон Чан в настоящее время готовит Китай к войне, которую страна никогда не видела."
  PRC_GATHERING_STORM_DESC:0 "Китайская коммунистическая партия на грани уничтожения. После неудавшейся революции коммунистические армии были разбиты на всех фронтах Гоминьданом. Коммунисты бежали со своих баз на юге Китая на новую базу в Шэньси. Из этой катастрофы для партии появился новый лидер: Мао Цзэдун.\n\nМао приносит с собой радикальное новое видение коммунизма и новую стратегию выживания и экспансии. Возможно, коммунисты смогут объединиться со своими бывшими врагами против более сильного врага…"
  PRC_BLITZKRIEG_DESC:0 "В хаосе есть возможность. Японское вторжение заставило Гоминьдан, который в 1936 году оказался невероятно близок к уничтожению КПК, теперь вынужден был заключить союз с коммунистами.\n\nТеперь коммунисты ждали в Шэньси, довольствуясь тем, что Гоминьдан ведёт большую часть боевых действий. Возможно, в этой войне коммунистам удастся продвинуться и захватить северные провинции Китая, давно потерянные для японцев. Возможно, после окончания войны коммунисты смогут использовать промышленность Севера, чтобы двинуться на юг и нанести сокрушительный удар по Гоминьдану. Возможно..."
  PRC_recover_from_the_long_march:0 "Оправиться от Великого Похода"
  PRC_recover_from_the_long_march_desc:0 "Великий Поход стоил нам огромных потерь, мы должны начать восстанавливаться, пока Гоминьдан не воспользовался нашей слабостью!"
  PRC_anti_japanese_aim:0 "Анти-Японский прицел"
  PRC_anti_japanese_aim_desc:0 "Японские захватчики у нашего порога, мы должны сосредоточиться на подготовке стратегии защиты от них."
  PRC_west_expedition:0 "Организовать Западный поход"
  PRC_west_expedition_desc:0 "Если мы сможем открыть маршрут, по которому Советский Союз будет присылать нам припасы, наша революция пройдет гораздо более гладко. Однако клика Ма стоит у нас на пути, мы должны избавиться от нее."
  PRC_approach_the_front:0 "Приблизиться к фронту"
  PRC_approach_the_front_desc:0 "Мы должны по собственной инициативе отбивать японских захватчиков! Мы не можем полагаться только на военачальников и Гоминьдан."
  PRC_supply_line_from_sov:0 "Советские поставки"
  PRC_supply_line_from_sov_desc:0 "С открытием маршрута советские припасы и подкрепления будут поступать намного легче."
  PRC_front_line_preparation:0 "Подготовка линии фронта"
  PRC_front_line_preparation_desc:0 "Мы должны подготовить наши прифронтовые позиции, организовать наших солдат против японских империалистов."
  PRC_boost_the_morale:0 "Повышение боевого духа"
  PRC_boost_the_morale_desc:0 "Пораженцы в наших рядах, несомненно, вредны, мы должны попытаться переубедить их."
  PRC_prepare_for_war:0 "Готовимся к войне"
  PRC_prepare_for_war_desc:0 "Война с японцами, по-видимому, неизбежна, мы должны подготовиться!"
  PRC_the_united_front:0 "Единый фронт"
  PRC_the_united_front_desc:0 "Гоминьдан теперь возглавляет Единый фронт, мы можем отправить наши войска для вхождения в их ряды и обучить их тактике партизанской войны."
  PRC_initiative_in_war_time:0 "Наша собственная инициатива"
  PRC_initiative_in_war_time_desc:0 "Мы должны взять инициативу в свои руки, Гоминьдан наверняка уничтожит нас, если получит ее после войны с японцами. Мы не должны давать им орудие для нашего уничтожения!"
  PRC_protracted_war:0 "Затяжная война"
  PRC_protracted_war_desc:0 "Мы должны максимально задержать врага и дождаться, когда другие народы и страны присоединятся к войне с японцами."
  PRC_root_out_defeatism:0 "Искоренить пораженчество"
  PRC_root_out_defeatism_desc:0 "Японцы не смогли покорить Китай, это лучшее доказательство, которым можно дать пощечину пораженцам."
  PRC_neccessary_flexibility:0 "Необходимая мобильность"
  PRC_neccessary_flexibility_desc:0 "Одной только партизанской войны недостаточно, наши войска должны готовиться к нападениям и отступлениям, когда это необходимо."
  PRC_war_of_attrition:0 "Война на истощение"
  PRC_war_of_attrition_desc:0 "У нас есть пространство и люди для ведения затяжной войны с японцами, мы можем сдержать истощение, а японцы - нет. Мы используем это против них."
  PRC_swift_victory:0 "Доктрина быстрой победы"
  PRC_swift_victory_desc:0 "Хотя Мао настаивает на ведении затяжной войны, некоторые товарищи предлагают, чтобы мы проявили больше инициативы и отнесли войну к японцам, ударив их тогда, когда они меньше всего этого ожидают."
  PRC_partial_guerilla_operation:0 "Частичная партизанская операция"
  PRC_partial_guerilla_operation_desc:0 "Мао настаивал, что партизанская война - это необходимость, мы просто дадим ему поверхностный ответ."
  PRC_war_of_annihilation:0 "Война на уничтожение"
  PRC_war_of_annihilation_desc:0 "С инициативой в наших руках мы уничтожим японцев до того, как они успеют среагировать!"
  PRC_political_mobilisation:0 "Политическая мобилизация"
  PRC_political_mobilisation_desc:0 "Мы должны призвать весь наш народ, как гражданских лиц, так и наших солдат, бороться с захватчиком."
  PRC_self_perservation:0 "Самосохранение"
  PRC_self_perservation_desc:0 "Если мы хотим иметь шанс победить в этой войне, наши солдаты должны знать, как сохранить свои силы и не приносить ненужных жертв."
  PRC_prepare_for_decisive_battle:0 "Подготовьтесь к решающему сражению"
  PRC_prepare_for_decisive_battle_desc:0 "Сохранив наши силы, мы можем подготовиться к решительным битвам, которые одним ударом покалечат японцев."
  PRC_the_goal_of_our_war:0 "Цель нашей войны"
  PRC_the_goal_of_our_war_desc:0 "Напоминание нашему народу о цели нашей нынешней войны значительно улучшит наш национальный дух."
  PRC_military_civilian_corporation:0 "Военно-гражданское сотрудничество"
  PRC_military_civilian_corporation_desc:0 "Создание ополчения и поощрение граждан к участию в армейской логистике станет важным фактором в войне."
  PRC_debunk_the_underestimation:0 "Развенчайте недооценку"
  PRC_debunk_the_underestimation_desc:0 "Мы должны показать нашим товарищам, что недооценка Японии совершенно ошибочна и наносит ущерб армии нашей нации."
  PRC_army_reform:0 "Реформа армии"
  PRC_army_reform_desc:0 "Наша нынешняя структура армии слишком разрознена. Мы должны создать более структурированную."
  PRC_purge_dissident_element:0 "Очистить правые элементы"
  PRC_purge_dissident_element_desc:0 "Некоторые полагают, что мысли правых заразили разум некоторых наших товарищей, и мы должны заставить их снова повернуть «влево», или же они будут отлучены..."
  PRC_found_our_nation:0 "Основать нашу нацию"
  PRC_found_our_nation_desc:0 "При наличии обширных территорий под нашим прямым контролем, мы можем провести ассамблею и объявить, что мы наконец-то основали нашу нацию и более не являемся партизанским движением."
  PRC_pla:0 "НОАК"
  PRC_pla_desc:0 "Народно-освободительная армия станет единственной армией, которая спасет китайский народ от мерзкого капитализма и устранит реакционеров, таким образом освободив и направив его к коммунизму."
  PRC_the_first_five_year_plan:0 "Первый пятилетний план"
  PRC_the_first_five_year_plan_desc:0 "Наша недавно созданная нация испытывает нехватку промышленных мощностей, в нашем первом пятилетнем плане необходимо сосредоточиться на данном направлении."
  PRC_resources_prospection:0 "Разведка ресурсов"
  PRC_resources_prospection_desc:0 "Огромные территории нашей нации оказываются довольно богатыми, мы можем искать ресурсы, которые значительно увеличат количество производимых полезных материалов."
  PRC_land_reform:0 "Земельная реформа"
  PRC_land_reform_desc:0 "В настоящее время наши земли в основном принадлежат землевладельцам, а фермеры подвергаются эксплуатации. Следует ввести политику освобождения фермеров и дать им собственную землю, придав им смелость противостоять землевладельцам."
  PRC_suppress_counterrevolutionaries:0 "Подавить контрреволюционеров"
  PRC_suppress_counterrevolutionaries_desc:0 "Чтобы сохранить стабильность в нашей стране, все элементы, которые выступают против Революции, должны быть устранены или реабилитированы; семьи должны сообщать властям об антиреволюционной деятельности своих членов."
  PRC_156_project:0 "Проект 156"
  PRC_156_project_desc:0 "С советской помощью наша национальная промышленность будет процветать."
  PRC_equipment_update:0 "Обновление оборудования"
  PRC_equipment_update_desc:0 "Наше нынешнее армейское оборудование — музейные экспонаты; нам нужно предоставить ему более современные образцы."
  PRC_ndcprc:0 "Основать НКОНОРК"
  PRC_ndcprc_desc:0 "Будет создан Национальный комитет обороны Китайской Народной Республики для определения политики, связанной с обороной страны."
  PRC_tbos:0 "ДБOC"
  PRC_tbos_desc:0 "ДБOC, аббревиатура от «Две бомбы, одна звезда» (спутник), — первый план нашей страны по расширению нашего присутствия на небе и даже в космосе."
  PRC_establish_navy:0 "Создать Народно-освободительный флот"
  PRC_establish_navy_desc:0 "Хотя у нас есть корабли, у нас нет официально организованного флота."
  PRC_the_red_pacific:0 "Красный Тихий океан"
  PRC_the_red_pacific_desc:0 "Мы распространим коммунизм по всему Тихому океану!"
  PRC_sea_ambition:0 "Амбиции на море"
  PRC_sea_ambition_desc:0 "Малаккский пролив — артериальный торговый путь для Востока и Запада; если мы контролируем его, мы будем решать судьбу некоторых стран."
  PRC_institution_reorganization:0 "Реорганизация института"
  PRC_institution_reorganization_desc:0 "Наша нынешняя система образования не сильно улучшена. Необходима реорганизация, если мы хотим иметь талантливых людей."
  PRC_cult_of_personality:0 "Культ личности"
  PRC_cult_of_personality_desc:0 "Каждый китаец должен поклоняться нашему великому и славному лидеру Мао Цзэдуну и никому другому."
  PRC_eliminate_iliteracy:0 "Устранение неграмотности"
  PRC_eliminate_iliteracy_desc:0 "Уровень неграмотности в нашей стране высок, мы должны снизить его, чтобы добиться прогресса."
  PRC_adopt_soviet_education_system:0 "Принятие образовательной системы советского типа"
  PRC_adopt_soviet_education_system_desc:0 "Мы можем принять образование Советского Союза, чтобы заменить наше нынешнее, так как их образование более структурировано, чем наше."
  PRC_sov_cooperation:0 "Сотрудничество с СССР"
  PRC_sov_cooperation_desc:0 "Советский Союз, несомненно, является самой могущественной коммунистической страной в мире, у нас так многому можно научиться у них."
  PRC_the_new_communism_beacon:0 "Новый маяк коммунизма"
  PRC_the_new_communism_beacon_desc:0 "В настоящее время в Советском Союзе полно ревизионистов, которые уклонились от пути Карла Маркса, мы не будем следовать такой гнилой структуре."
  PRC_anti_soviet_revisionist_aim:0 "Цель антисоветско-ревизионизма"
  PRC_anti_soviet_revisionist_aim_desc:0 "Советский ревизионизм отравляет миллионы товарищей в Советском Союзе, мы должны спланировать их спасение."
  PRC_liberate_the_soviet_people:0 "Освобождение советского народа"
  PRC_liberate_the_soviet_people_desc:0 "Пора освободить советский народ от мерзких ревизионистов!"
  PRC_state_controlled_education:0 "Государственное образование"
  PRC_state_controlled_education_desc:0 "Все, что может ослабить веру нашего народа в коммунизм, не должно преподаваться в школе!"
  PRC_liberate_tibet:0 "Освободить Тибет"
  PRC_liberate_tibet_desc:0 "Тибет долгое время был вынужден покинуть семью китайцев, теперь мы должны освободить их от капиталистов, которые затуманили их разум."
  PRC_establish_air_force:0 "Создать Народно-освободительные ВВС"
  PRC_establish_air_force_desc:0 "С помощью иностранцев мы сможем создать надлежащие военно-воздушные силы."
  PRC_fighter_focus:0 "Истребители"
  PRC_fighter_focus_desc:0 "Мы еще не видели последних воздушных боев в Великой войне. Передовое развитие истребителей даст нам преимущество в будущем."
  PRC_bomber_focus:0 "Бомбардировщики"
  PRC_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах современных войн, огонь, льющийся с небес, будет занимать видное место. Мы сделаем все возможное, чтобы наши враги рассказали эти истории."
  PRC_cas_effort:0 "Усилия CAS"
  PRC_cas_effort_desc:0 "Современной армии нужна поддержка с земли и с воздуха."
  PRC_nav_effort:0 "Усилия NAV"
  PRC_nav_effort_desc:0 "Так же как новые военно-морские действия происходят под поверхностью воды, часть из них происходит в воздухе над водой."
  PRC_economic_reform:0 "Экономическая реформа"
  PRC_economic_reform_desc:0 "Разрушения, вызванные Культурной революцией, ведут нашу нацию к пропасти. Мы должны провести реформы, которые помогут нам выбраться из нее."

  PRC_generalissimo_lin:0 "Генералиссимус Линь"
  PRC_generalissimo_lin_desc:0 "Линь доказал, что является единственным подходящим человеком для командования вооруженными силами нашей страны, поэтому он назвал себя генералиссимусом."

  PRC_armament_reorganization:0 "Перестройка вооружения"
  PRC_armament_reorganization_desc:0 "Мы должны укрепить свою страну в выпуске вооружений."

  PRC_expand_taiyuan_arsenal:0 "Расширение Тайюаньского арсенала"
  PRC_expand_taiyuan_arsenal_desc:0 "Тайюаньский арсенал известен своим качественным выпуском продукции. Если мы сможем увеличить его производство, мы получим от него большую выгоду."

  PRC_lure_them_in_strategy:0 "Стратегия заманивания"
  PRC_lure_them_in_strategy_desc:0 "Учитывая обширную территорию и неровный рельеф нашей страны, мы можем позволить себе отступить и заманить оккупантов на поля сражений по нашему выбору. Пусть империалисты попробуют преследовать нас! Они столкнутся с засадами на каждом углу и ловушкой на каждом шагу!"

  PRC_industrialization_NW:0 "Локальная индустриализация: Северо-запад"
  PRC_industrialization_NW_desc:0 "На данный момент Северо-западный регион может казаться засушливой землей, в скором времени он станет одним из наиболее индустриализированных районов."

  PRC_excavation_NW:0 "Северо-западные раскопки"
  PRC_excavation_NW_desc:0 "Мы должны провести разведку на предмет наличия в нашей земле дополнительных ресурсов, чтобы мы могли стать независимыми от импортных ресурсов."
  PRC_industrialization_S:0 "Локальная индустриализация : юг"
  PRC_industrialization_S_desc:0 "Юг может быть одной из самых индустриализированных областей, но его можно сильно улучшить."

  PRC_excavation_S:0 "Каучуковые плантации"
  PRC_excavation_S_desc:0 "Климат на юге очень подходит для каучуковых плантаций, мы должны им воспользоваться."

  PRC_excavation_NE:0 "Разведка на северо-востоке"
  PRC_excavation_NE_desc:0 "Японцы оставили многочисленные инструменты в этом районе, мы можем использовать их для обнаружения новых ресурсов."

  PRC_pioneering_the_north_east:0 "Основать северо-восточное агентство развития"
  PRC_pioneering_the_north_east_desc:0 "Хотя японцы и освоили некоторые части Маньчжурии, огромные участки земли остаются нетронутыми. Мы должны начать масштабную работу, чтобы полностью превратить эти некогда варварские земли в современный мир."

  PRC_rectification:0 "Движение за исправление ошибок"
  PRC_rectification_desc:0 "Некоторые наши товарищи не полностью следуют руководству коммунизма, мы должны исправить их образ мышления."

  PRC_increase_credibility_of_theory:0 "Повысить доверие к доктрине"
  PRC_increase_credibility_of_theory_desc:0 "В связи с успешностью военных усилий, мы должны повысить доверие к нашим обновленным теориям."

  PRC_front_line_behind_enemy_line:0 "Фронт за линией противника"
  PRC_front_line_behind_enemy_line_desc:0 "Если мы хотим полностью использовать потенциал партизанской войны, мы должны создать операции за линией фронта противника, нарушить их пути снабжения и дать им отпор."
  PRC_exploit_our_enemys_mistake:0 "Использовать ошибку врага"
  PRC_exploit_our_enemys_mistake_desc:0 "Операция врага на передовой плохо координирована. Мы должны использовать это в своих интересах и извлечь из этого как можно больше пользы."
  PRC_dare_to_die_corps:0 "Корпус «Смелых на смерть»"
  PRC_dare_to_die_corps_desc:0 "Чтобы победить в войне с захватчиками, наши люди должны набраться смелости и перестать бояться смерти."
  PRC_march_into_sik:0 "Вернуть Синьцзян"
  PRC_march_into_sik_desc:0 "Пора вернуть наши утраченные территории. Синьцзян скоро станет нашим."
  PRC_the_grand_northwest_united_proposal:0 "Проект союза на северо-западе"
  PRC_the_grand_northwest_united_proposal_desc:0 "Бывший генерал Фэнтяньской клики Чжан Сюэлян планирует создать ещё одно правительство в северо-западном регионе. Затем оно будет работать со Шэн Шицаем в Синьцзяне, чтобы получить помощь от Советов, пока мы готовим оборону на востоке. Однако, чтобы этот план стал реальностью, мы должны получить разрешение от Коминтерна."
  PRC_urge_zhang:0 "Связаться с Чжан Сюэляном"
  PRC_urge_zhang_desc:0 "Теперь, когда мы определились со следующим шагом, пора рассказать Чжану о нашем плане..."
  PRC_form_the_grand_northwest_united:0 "Северо-западное правительство национальной обороны"
  PRC_form_the_grand_northwest_united_desc:0 "Теперь, когда почти всё решено и Ганьсу защищен, мы можем претворить в жизнь план «Союза на северо-западе»."
  PRC_unite_against_the_jap:0 "Объединиться против японцев"
  PRC_unite_against_the_jap_desc:0 "Вместе мы победим, разобщенные мы падем."

  PRC_destroy_mao_and_his_clique:0 "Уничтожьте коммунистов"
  PRC_destroy_mao_and_his_clique_desc:0 "Хотя в качестве главы правительства, наводненного коммунистами, Чжан все еще считает, что только фашизм является единственным спасением для Китая. Чтобы воплотить в жизнь фашистскую идею, коммунисты должны быть истреблены."

  PRC_trust_in_communism:0 "Верьте в коммунизм"
  PRC_trust_in_communism_desc:0 "Есть причина, по которой коммунисты так долго держатся против НРА - причина, которую Чжан хотел бы узнать."

  PRC_government_reshuffle:0 "Перестановка в правительстве"
  PRC_government_reshuffle_desc:0 "Дезертиры и чрезмерные оптимисты в правительстве могут привести только к падению этого недавно сформировавшегося союза. Необходимо предпринять действия, чтобы предотвратить такую катастрофу."

  PRC_invite_shx:0 "Суйюаньский коридор"
  PRC_invite_shx_desc:0 "Получив доступ к Суйюаню, наши войска смогут легко добраться до фронта. Однако местные полевые командиры стали для нас препятствием для реализации такого плана."

  PRC_retake_dongbei:0 "Верните Дунбэй"
  PRC_retake_dongbei_desc:0 "После японского вторжения в Маньчжурию северо-восточный регион был оккупирован японцами. Теперь мы вернем то, что по праву было нашим!"

  PRC_winter_training:0 "Зимняя подготовка"
  PRC_winter_training_desc:0 "Чрезвычайный климат на севере был беспощадным. Предоставляя специальные тренировки в холодное время года, наши войска смогут более легко справиться с ситуацией.
  PRC_mountain_training:0 "Горная подготовка"
  PRC_mountain_training_desc:0 "Горный рельеф Китая станет отличным барьером для механизированных войск захватчиков. Без поддержки механизированных частей наши бойцы при достаточной подготовке смогут с легкостью уничтожить врага."

  PRC_recall_feng_clique_generals:0 "Вернуть генералов Фэнтяньской клики"
  PRC_recall_feng_clique_generals_desc:0 "Укрепив свои позиции в недавно сформированном правительстве, Чжан решил вернуть бывших генералов Фэнтяньской клики, чтобы заручиться их поддержкой в борьбе против японцев."

  PRC_incorporate_xbj:0 "Присоединить армию Сибэй"
  PRC_incorporate_xbj_desc:0 "Армия Сибэй под командованием Ян Хучэна поддержала план Чжана. Не мешало бы подкрепиться перед предстоящей войной."

  PRC_fight_alone:0 "Одинокий волк"
  PRC_fight_alone_desc:0 "Учитывая некомпетентность НАО, если сражаться вместе с ними, это станет нашей обузой. Поэтому нам нужно бороться с японцами самостоятельно. Тогда у нас будет больше шансов на победу."

  PRC_military_knowledge_exchange:0 "Обмен военными знаниями"
  PRC_military_knowledge_exchange_desc:0 "И в нашей тактике, и в тактике НАО есть недостатки. Если обмениваться офицерами, нашу тактику можно значительно улучшить, а общие силы двух армий гарантированно выгонят японцев с нашей земли."

  PRC_study_kmt_equipment:0 "Изучить технику НАО"
  PRC_study_kmt_equipment_desc:0 "Хоть и не самое качественное, снаряжение НРА всё же лучше, чем у большинства наших сил. Изучение его увеличило бы наши знания в области стрелкового оружия."
  PRC_apologise_to_sov:0 "Извиниться перед Советом"
  PRC_apologise_to_sov_desc:0 "Несмотря на наше неподчинение советскому приказу об учреждении нового правительства, мы теперь всё равно в едином фронте с КМТ. Советские чиновники, конечно, могут закрыть глаза на это незначительное "непослушание"."
  PRC_pressure_prince_dem:0 "Оказать давление на правительство Цахара"
  PRC_pressure_prince_dem_desc:0 "Японская марионетка в Цахаре более уступчивая, чем мы ожидали. Мы могли бы попытаться подкупить их и предложить им выгоду, таким образом мы смогли бы разобраться с ними без кровопролития. Если эти действия окажутся недостаточно эффективными, то..."
  PRC_reform_high_command:0 "Реформировать высшее командование"
  PRC_reform_high_command_desc:0 "Наше высшее командование могло бы использовать немного больше работы. Текущая структура сконструирована слишком свободно, а цепочка командования не очень подходит для координирования большой армии."
  PRC_focus_on_red_army:0 "Сосредоточиться на Красной Армии"
  PRC_focus_on_red_army_desc:0 "Коммунистическая Красная Армия преуспела в партизанской войне и имеет огромную народную поддержку. Приложение наших усилий к ним значительно увеличило бы нашу легитимность."
  PRC_focus_on_dong_beijun:0 "Сосредоточиться на Дунбэйской армии"
  PRC_focus_on_dong_beijun_desc:0 "Хорошо организованная Северо-восточная армия под руководством Чжан Сюэляна готова умереть за свою родину. Наши усилия, направленные на них, значительно увеличат эффективность наших войск на поле боя."
  PRC_guerilla_operation_expansion:0 "Расширение партизанских операций"
  PRC_guerilla_operation_expansion_desc:0 "Наши бесстрашные партизаны добились определённых успехов на поле боя. Мы должны подумать о расширении партизанской войны на другие аспекты, например, об использовании наших собственных партизан для борьбы с врагами. Это может значительно снизить наши затраты на оккупацию вражеских территорий."
  PRC_stir_anti_japanese_sentiment:0 "Нагнетание анти-японских настроений"
  PRC_stir_anti_japanese_sentiment_desc:0 "Японская оккупация Маньчжурии заставила наших братьев покинуть свои дома в Дунбее. Мы можем использовать это как пропаганду и поднять их моральный дух."
  PRC_enforce_our_goal:0 "Выполнение наших целей"
  PRC_enforce_our_goal_desc:0 "Мы не должны забывать о первоначальной цели создания этого правительства. Сейчас мы должны действовать."
  KMT_hundred_flowers_campaign:0 "Кампания ста цветов"
  KMT_hundred_flowers_campaign_desc:0 "Среди нас всё ещё есть реакционеры. Лучший способ разоблачить их - дать им возможность высказаться."
  KMT_great_leap_forawrd:0 "Большой скачок вперёд"
  KMT_great_leap_forawrd_desc:0 "Мы сильно отстаём как от Запада, так и от Советов. Чтобы достичь коммунизма и защитить народ, мы должны начать масштабную массовую кампанию, чтобы наверстать упущенное за короткий промежуток времени."
  PRC_begin_cultural_revolution:0 "Начало Культурной революции"
  PRC_begin_cultural_revolution_desc:0 "Недавние правительственные изменения в [SOV.getNameDef] вызвали серьезные сомнения вокруг правильной интерпретации коммунизма и в какой форме он должен вести [PRC.getNameDef] к желаемому процветанию. Различные группы уже начали борьбу за власть, чтобы достичь высот нашего любимого председателя. Только время покажет, к чему это приведет нашу славную страну."
  PRC_mongolia_issue:0 "Проблема Монголии"
  PRC_mongolia_issue_desc:0 "Монголия является неотъемлемой частью Китая, она должна быть возвращена нам!"
  PRC_exert_influence_in_sea:0 "Приложить усилия в Юго-Восточной Азии"
  PRC_exert_influence_in_sea_desc:0 "Многочисленные важные морские пути находятся в Юго-Восточной Азии. Укрепление нашего влияния в регионе может обеспечить нам тактические преимущества в случае войны."
  PRC_coerce_korea:0 "Принуждение Кореи"
  PRC_coerce_korea_desc:0 "Корейский полуостров занимает отличное стратегическое положение, мы должны овладеть им, чтобы обеспечить наше преимущество в военное время!"
  PRC_exert_influence_in_central_asia:0 "Приложить усилия в Центральной Азии"
  PRC_exert_influence_in_central_asia_desc:0 "Укрепление нашего присутствия в Центральной Азии было бы полезным, если бы мы хотели расширяться на запад."
  PRC_exert_influence_in_india_and_mongolia:0 "Приложить усилия в Монголии и Индии"
  PRC_exert_influence_in_india_and_mongolia_desc:0 "Нам меньше всего нужна война на два фронта. Чтобы не допустить этого, необходимо защитить наши северные и южные границы. Если мы сделаем соседей своими союзниками, это может оказаться весьма выгодным."
  PRC_demand_return_of_trade_ports:0 "Требование возврата торговых портов"
  PRC_demand_return_of_trade_ports_desc:0 "Наличие иностранных концессий унижает нашу страну. Мы должны потребовать немедленного аннулирования этих неравноправных договоров!"
  PRC_the_permanent_revolution:0 "Перманентная революция"
  PRC_the_permanent_revolution_desc:0 "Коммунизм в отдельно взятом государстве — это крайне мало. Весь мир должен встать на истинный путь Маркса и Ленина!"
  PRC_aid_the_workers:0 "Помощь рабочим"
  PRC_aid_the_workers_desc:0 "Рабочих в соседних странах притесняют уже слишком долго. Пришло время освободить их от капиталистических угнетателей!"
  PRC_hire_sov_experts:0 "Наём советских экспертов"
  PRC_hire_sov_experts_desc:0 "Советские эксперты могут предоставить неоценимую помощь в развитии нашей промышленности. Их советы стоят тех денег, что мы потратим на их наём."
  PRC_import_sov_machinery:0 "Импорт советских машин"
  PRC_import_sov_machinery_desc:0 "Нынешнее оборудование в нашей стране очень плохого качества. А вот советские машины производят материалы высочайшего качества в огромном количестве. Их импорт сделает нашу промышленность сильной."
  PRC_invest_in_new_companies:0 "Инвестиции в новые компании"
  PRC_invest_in_new_companies_desc:0 "В нашей стране всего несколько внутренних компаний. Мы должны рассмотреть возможность инвестирования в новые компании, чтобы повысить конкурентоспособность нашей страны в мире."
  PRC_assistance_in_naval_industry:0 "Запросить советскую помощь в военно-морской промышленности"
  PRC_assistance_in_naval_industry_desc:0 "Благодаря мощной военно-морской промышленности наших друзей, мы можем попросить их помочь и нам."
  PRC_study_soviet_ships:0 "Изучить советские корабли"
  PRC_study_soviet_ships_desc:0 "Изучение иностранных разработок прольёт свет на наши инженерные достижения в судостроении."
  PRC_study_sov_aircrafts:0 "Изучить советские самолёты"
  PRC_study_sov_aircrafts_desc:0 "Изучение иностранных разработок прольёт свет на наши инженерные достижения в авиационной промышленности."
  PRC_study_sov_equipments:0 "Изучить технику советской армии"
  PRC_study_sov_equipments_desc:0 "Изучение иностранных разработок прольёт свет на наши инженерные военные разработки."
  PRC_sov_military_advisor:0 "Советские военные советники"
  PRC_sov_military_advisor_desc:0 "При поддержке опытных отставных советских генералов, наша армия может работать лучше."
  PRC_the_second_northeast_flag_replacement:0 "Второе изменение флага северо-востока"
  PRC_the_second_northeast_flag_replacement_desc:0 "Армия Дунбэй стала решающей силой во время эпохи милитаристов. Если бы не наши действия во время войны на Центральной равнине, правительство Нанкина не победило бы. А если бы не замена северо-восточного флага, Китай не объединился бы под одним флагом. Теперь мы восстановим Фэнтяньскую клику и покажем правительству Нанкина, кто больше подходит для правления Китаем."

  PRC_submit_to_central_government:0 "Подчинение центральному правительству"
  PRC_submit_to_central_government_desc:0 "Ах-ха-ха, теперь я хочу сыграть за КИТ. Эта ветка фокусов никуда не годится!"

  PRC_revive_arsenals:0 "Возродить арсеналы"
  PRC_revive_arsenals_desc:0 "Большинство арсеналов на северо-востоке не тронуты, некоторые даже пользуются расположением японцев. Теперь мы можем использовать их для производства боевых машин, необходимых для восстановления былой славы Фэнтяньской клики."

  PRC_revive_the_navy_and_air_force:0 "Возродить флот и ВВС"
  PRC_revive_the_navy_and_air_force_desc:0 "Наши флот и ВВС были одним из источников нашей силы в эпоху милитаристов. Мы должны их возродить, чтобы удостовериться, что мы по-прежнему являемся силой, с которой стоит считаться."
  PRC_pact_with_jap:0 "Пакт с Японией"

  PRC_pact_with_jap_desc:0 "Несмотря на то что некогда они были нашими врагами, их военную мощь невозможно отрицать. Может быть, нам стоит отбросить наши предрассудки и заключить с ними союз?"

  PRC_king_of_dongbei:0 "Король Дунбэй"
  PRC_king_of_dongbei_desc:0 "Мы восстановили наши потерянные земли, этот регион снова станет центром наших операций."
  PRC_industrial_developement:0 "Промышленное развитие"
  PRC_industrial_developement_desc:0 "Разрушенная войной территория Дунбэя осталась почти без инфраструктуры. Инвестирование средств в восстановление региона поможет нам нарастить производство."
  PRC_study_foreign_equipment:0 "Изучение иностранного оборудования"
  PRC_study_foreign_equipment_desc:0 "Мы можем копировать иностранное оборудование и улучшать свою технику на основе их конструкции."
  PRC_expand_unversity:0 "Развитие университетов"
  PRC_expand_unversity_desc:0 "Образование имеет важное значение, поэтому мы должны построить больше университетов, чтобы воспитать будущее поколение и обеспечить будущее нашей страны."
  PRC_establish_general_staff:0 "Создание генерального штаба"
  PRC_establish_general_staff_desc:0 "Наша армия сильно разрослась. Необходимо создать структуру для координации наших усилий."
  PRC_claim_the_central_plain:0 "Захват Центральной равнины"
  PRC_claim_the_central_plain_desc:0 "Правительство на юге уже давно положило глаз на наши земли. Мы должны уничтожить их, прежде чем они сами пойдут в наступление."
  PRC_secure_the_far_east:0 "Защищаем Дальний Восток"
  PRC_secure_the_far_east_desc:0 "Русский Дальний Восток мешает нам получить прямой доступ к Тихому океану. Это сильно препятствует нашему развитию флота. В интересах страны мы должны захватить этот регион."
  PRC_joint_warfare:0 "Объединенное командование"
  PRC_joint_warfare_desc:0 "Широкая береговая линия Китая предоставила нашим вооружённым силам прекрасную возможность использовать наш воздушный, морской и наземный арсенал. Мы должны развить эту эффективную тактику."
  PRC_pressure_korea:0 "Нажим на Корею"
  PRC_pressure_korea_desc:0 "Благодаря нашему успеху в контроле над важнейшими городами на Дальнем Востоке, наше влияние растёт. Теперь, когда Корея окружена нашими войсками, им пора сделать правильный выбор."
  PRC_special_research_department:0 "Особый отдел исследований"
  PRC_special_research_department_desc:0 "Научный прогресс жизненно необходим для нашего государства."
  PRC_provisional_science_department:0 "Временный отдел исследований"
  PRC_provisional_science_department_desc:0 "Несколько опытных специалистов присоединились к нашему правительству в период перестановки. Мы можем объединить их в группу и поручить им заниматься научными задачами."
  PRC_establish_top_command:0 "Создание высшего командования"
  PRC_establish_top_command_desc:0 "Необходимо назначить руководителя вооружённых сил для эффективного командования и координации войск."
  PRC_expand_navy_command_structure:0 "Расширение военно-морской командной структуры"
  PRC_expand_navy_command_structure_desc: "С постоянно растущими размерами нашего флота необходима отдельная командная структура."
  PRC_expand_air_command_structure:0 "Расширение военно-воздушной командной структуры"
  PRC_expand_air_command_structure_desc: "С постоянно растущими размерами наших военно-воздушных сил необходима отдельная командная структура."
  PRC_yellow_sea_navy:0 "Желтоморский флот"
  PRC_yellow_sea_navy_desc:0 "В Желтом море находится база наших ВМС, мы должны усилить свой прибрежный флот, чтобы обеспечить его безопасность."
  PRC_pacific_fleet:0 "Тихоокеанский флот"
  PRC_pacific_fleet_desc:0 "Мы должны поставить перед собой более высокую цель: расширение флота для операций в открытом море является обязательным условием."
  PRC_naval_air_effort:0 "Воздушные силы флота"
  PRC_naval_air_effort_desc:0 "Авианосцы в последние годы стали центром развития военно-морского флота, мы должны держать свои ВМС в курсе последних событий."
  PRC_naval_innovation:0 "Внедрение новых технологий в военно-морской сфере"
  PRC_naval_innovation_desc:0 "Традиционные военно-морские доктрины и разработки в конечном итоге придут в упадок. Мы должны найти новые и более эффективные способы уничтожения нашего противника на море, пока они топчутся на месте."
  PRC_fight_effort:0 "Истребители"
  PRC_fight_effort_desc:0 "Мы не видели последнего воздушного боя в Великой войне. Передовые технологии в области разработки истребителей дадут нам преимущество в будущем."
  PRC_bomber_effort:0 "Бомбардировщики"
  PRC_bomber_effort_desc:0 "Когда будущие поколения будут говорить об ужасах нынешних войн, неизменно будет упомянут огонь, падающий с небес. Мы сделаем все возможное, чтобы наши враги рассказали эти истории."
  PRC_air_innovation:0 "Новое в области авиации"
  PRC_air_innovation:0 "Традиционные воздушные доктрины и авиаконструкции в конечном итоге придут в упадок. Мы должны найти новые и более эффективные способы уничтожения нашего противника в воздухе, пока они топчутся на месте."
  PRC_introduce_jap_shipbuilding_tech:0 "Просить у Японии помощи в развитии военно-морского флота"
  PRC_introduce_jap_shipbuilding_tech_desc:0 "У наших японских друзей мощная промышленность, они могут помочь в развитии нашей."
  PRC_jap_military_advisor:0 "Японский военный советник"
  PRC_jap_military_advisor_desc:0 "У Японии долгая военная история, японцы могут нам дать много полезного в плане обороны."
  PRC_west_pacific_alliance:0 "Альянс Западно-тихоокеанского региона"
  PRC_west_pacific_alliance_desc:0 "Чтобы выжить, нам надо создать альянс."
  PRC_coup_in_philipine:0 "Поддержать фашистский переворот в ЮВА"
  PRC_coup_in_philipine_desc:0 "Люди должны восстать против своего некомпетентного правительства и встать на путь фашизма. Тем, кто так поступит, мы окажем полную поддержку."
  PRC_burn_the_bridge:0 "Сжечь мосты"
  PRC_burn_the_bridge_desc:0 "Мы получили от Японии всё, что хотели, пора разрывать пакт."
  PRC_battlefield_four:0 "Шестой фронт"
  PRC_battlefield_four_desc:0 "За Тихим океаном — наши настоящие враги, мы должны их уничтожить!"
  PRC_restart_the_civil_war:0 "Заново начать гражданскую войну"
  PRC_restart_the_civil_war_desc:0 "Когда с внешним врагом покончено, можно сосредоточиться на свержении коррумпированного правительства Гоминьдана и освобождении народа Китая."

  ######################## CONTINUOUS FOCUSES ###################
  PRC_continuous_naval_production:0 "Производство флота"
  PRC_continuous_naval_production_desc:0 "Сосредоточение ресурсов на верфях и освобождение квалифицированных судостроителей от воинской обязанности позволяет значительно сократить сроки строительства кораблей."

  PRC_continuous_air_production:0 "Производство авиации"
  PRC_continuous_air_production_desc:0 "Мы можем реорганизовать нашу авиационную промышленность, чтобы устранить потери и оптимизировать производство."

  PRC_continuous_non_factory_construct:0 "Строительное машиностроение"
  PRC_continuous_non_factory_construct_desc:0 "В нашей строительной промышленности все еще много отставаний. Сосредоточив внимание на ней, мы можем достичь значительного улучшения скорости строительства. К сожалению, производство станков оказалось серьезным узким местом в развитии нашей тяжелой промышленности, поэтому они не выиграют от усилий в этой области. "

  PRC_continuous_reduce_training_time:0 "Армейская подготовка"
  PRC_continuous_reduce_training_time_desc:0 "Создавая специализированные передовые учебные подразделения в каждой дивизии, мы можем развертывать даже дивизии, которые раньше пришлось бы удерживать, чтобы завершить подготовку к фронту."

  PRC_continuous_suppression:0 "Подавление сопротивления"
  PRC_continuous_suppression_desc:0 "Инфильтруясь в основные группы сопротивления на оккупированной территории и переманивая их лидеров, мы можем значительно уменьшить масштабы ущерба, который они могут нанести."

  PRC_continuous_repair:0 "Ремонт конструкций"
  PRC_continuous_repair_desc:0 "Будут сформированы специальные ремонтные бригады из заводских и строительных рабочих. В целях улучшения восстановления поврежденной инфраструктуры ремонтные бригады будут находиться под центральным контролем"
  PRC_continuous_tech_share:0 "Обмен технологиями"
  PRC_continuous_tech_share_desc:0 "Будет рекомендовано научно-исследовательским институтам и университетам наладить контакт с их коллегами в странах-союзницах. Это позволит получить бонус к обмену технологиями"
  PRC_continuous_boost_freedom:0 "Расширение автономии"
  PRC_continuous_boost_freedom_desc:0 "Перестройка структуры управления колонией и привлечение администраторов из числа местного населения позволит нам со временем самостоятельно контролировать свои дела"
  PRC_continuous_restrict_freedom:0 "Угнетение подданных"
  PRC_continuous_restrict_freedom_desc:0 "У наших колониальных подданных сложились довольно странные представления о таких вещах, как "самоопределение" или "национальная независимость". Пора избавить их от этих идей"
  PRC_he_long:0 "Хэ Лун"
  PRC_luo_rong_huan:0 "Ло Жун Хуань"

  ################################# EVENTS #########################
  prc.1.t:0 "Поставки из [SOV.GetName]"
  prc.1.d:0 "С открытием маршрута советских поставок в Яньань прибыли оборудование и добровольцы, ожидающие проверки [Root.GetLeader]"
  prc.1.a:0 "Это внесет большой вклад в войну против Японии"
  prc.2.t:0 "Коммунистическая армия принята в состав"
  prc.2.d:0 "Коммунисты согласились передать нам своего человека для вступления в нашу армию; теперь мы будем вместе противостоять нашему общему врагу."
  prc.2.a:0 "Нашему врагу не победить!"

  prc.3.t:0 "Непреднамеренная чистка"
  prc.3.d:0 "Во время попытки очистить наши ряды от реакционеров некоторые товарищи ошибочно были отнесены к "правым", а не к "левым". Это, безусловно, скажется на нашей работе."
  prc.3.a:0 "Некоторые из наших товарищей настолько "левые", что называют остальных "правыми"..."

  prc.4.t:0 "Талантливые кадры"
  prc.4.d:0 "В обществе появились талантливые граждане, и мы могли бы предоставить им место в нашей организации."
  prc.4.a:0 "Прогресс не остановить!"

  prc.5.t:0 "Смерть Сталина"
  prc.5.d:0 "Вчера наш великий лидер Иосиф Виссарионович Сталин был призван Карлом Марксом и покинул нас. Тяжкая утрата для советского народа.\n\nРазвернулась борьба за власть, поскольку влиятельные члены партии вступают в борьбу за вакантное место, освободившееся после ухода Сталина."
  prc.5.a:0 "Падение звезды..."

  prc.6.t:0 "[GetMonth] Контур"
  prc.6.d:0 "После того как наш Великий Председатель Мао раскритиковал драму \"Отрешенный от должности Хай Жуй\", группа людей решила сформировать комитет, чтобы свести к минимуму последствия этого заявления, объявив, что высказывание Великого Председателя Мао было сделано с академической точки зрения. До этого Великий Председатель Мао хвалил эту драму как хорошее отражение классовой борьбы в социалистическом государстве.\n\nЭтот откат Великого Председателя Мао вызвал ажиотаж в стране: все газеты освещали это событие в своих заголовках и посвящали ему пространные репортажи."
  prc.6.a:0 "Надеюсь, из этого ничего не выйдет..."

  prc.7.t:0 "Начало \"Культурной революции\""
  prc.7.d:0 "Великий Председатель Мао опубликовал заявление, в котором утверждал, что капитализм развратил некоторых высокопоставленных чиновников партии и что они должны быть свергнуты с власти. В заявлении также было отвергнуто разъяснение, опубликованное после того, как Великий Председатель Мао раскритиковал драму \"Отрешенный от должности Хай Жуй\".\n\nНекоторые высокопоставленные чиновники были исключены из партии в тот же день."
  prc.7.a:0 "Это не сулит ничего хорошего..."

  prc.8.t:0 "Смерть Линь Бяо"
  prc.8.d:0 "Линь Бяо, лично выбранный Великим Председателем Мао преемником, погиб в результате авиакатастрофы в Öndörkhaan. Документы на борту самолета указывают на то, что погибшими являются Линь и некоторые члены его семьи. Точная причина крушения до сих пор неизвестна.\n\nОтношения Линя с Великим Председателем Мао ухудшились после их разногласий по вопросу об отмене должности Национального Председателя. Говорилось, что Линь был ответственен за некоторые попытки покушения на Великого Председателя Мао и, как полагают, бежал из-за страха стать следующей мишенью для Красной Гвардии."
  prc.8.a:0 "Это выходит из-под контроля!"
  prc.10.t:0 "Линь Бяо бежал в [PRC_linbiao_flee_target.GetName]"
  prc.10.d:0 "Линь Бяо, лично выбранный Великим Председателем Мао преемником, бежал в [PRC_linbiao_flee_target.GetName] и прибыл в [PRC_linbiao_flee_target.Capital.GetName] на самолете. Партия и Великий Председатель Мао объявили, что Линь бежал, потому что боялся быть привлеченным к ответственности за покушение на Великого Председателя Мао, и поэтому попросил убежища в [PRC_linbiao_flee_target.GetName].\n\nКрасная Гвардия начала критиковать Линя и членов его семьи, не участвовавших в полете, которых впоследствии забили до смерти."
  prc.10.a:0 "Похоже, что самые близкие люди Мао начинают видеть его истинное лицо."
  prc.11.t:0 "Смерть Чжоу Эньлая"
  prc.11.d:0 "Чжоу Эньлай, председатель Народного политического консультативного совета Китая, скончался. Несмотря на его усилия и преданность, Великий председатель Мао отказался присутствовать на его похоронах. Несмотря на продолжающийся хаос, люди по всей стране провели собрания, чтобы почтить его память. У Памятника народному герою многие возложили венки, чтобы почтить память любимого председателя."
  prc.11.a:0 "Трагическая утрата..."
  prc.12.t:0 "Смерть Мао Цзэдуна"
  prc.12.d:0 "Великий председатель, Мао Цзэдун скончался от многочисленных болезней в своей резиденции в Чжуннаньхае. Великий председатель основал КПК и одержал победу во Второй гражданской войне в Китае, его здоровье быстро ухудшилось после того, как он узнал об измене Лина. Хотя он на короткое время выздоровел, он наконец принял приглашение Карла Маркса. Его тело планируется сохранить в хрустальном гробу в недавно построенном Мавзолее Мао Цзэдуна на Тяньаньмэнь, чтобы будущие поколения могли любоваться некогда славным председателем Китая."
  prc.12.a:0 "Еще одна потеря руководства, это не к добру."
  prc.13.t:0 "Банда четырех раздавлена"
  prc.13.d:0 "[Root.GetLeader] арестовал 'Банду Четырех', которая отвечала за большинство событий в поздний период 'Культурной революции', включая критику Конфуция и Линь Бяо. Глава банды, Цзян Цин, которая является вдовой Мао, заявила, что они просто выполняли волю Мао. Однако Мао пытался подавить власть банды, пока он был еще жив. С исчезновением 'Банды Четырех' хаос, который длился почти десять лет, должен был подойти к концу."
  prc.13.a:0 "Их должны были арестовать и казнить еще давным-давно!"
  prc.14.t:0 "Иностранные инвестиции"
  prc.14.d:0 "В связи с проводимой нами реформой некоторые иностранные фирмы заинтересовались нашей экономикой и решили инвестировать в нее. Это еще больше укрепит нашу экономику."
  prc.14.a:0 "Наша экономика станет одной из самых сильных!"
  prc.15.t:0 "Знакомство с зарубежными исследованиями"
  prc.15.d:0 "В нашу лабораторию внедряются некоторые зарубежные исследования, что ускорит ход наших исследований."
  prc.15.a:0 "Наука!"
  prc.21.t:0 "Влияние реформы"
  prc.21.d:0 "Реформа создала достаточно сильную нацию для китайского народа и более или менее стерла эффект, принесенный 'Культурной революцией'."
  prc.21.a:0 "Китай восстает!"
  prc.22.t:0 "Дэн Сяопин захватывает власть"
  prc.22.d:0 "После того, как Хуа Гофэн провел самокритику на недавнем собрании, Дэн Сяопин занял высшую должность в партии, став, таким образом, самым влиятельным человеком в стране."
  prc.22.a:0 "Надеюсь, он лучше, чем Хуа..."
  prc.23.t:0 "Линь Бяо захватывает власть"
  prc.23.d:0 "Линь Бяо, который бежал в [SOV.GetName] во время \"культурной революции\", вернулся и захватил власть, совершив переворот со своими оставшимися подчинёнными, пережившими \"Десятилетие хаоса\", свергнув Хуа Гофэна и заняв место председателя страны."
  prc.23.a:0 "Призрак прошлого!"
  prc.24.t:0 "Западная экспедиция"
  prc.24.d:0 "Невыносимое продвижение западной экспедиции заставляет Мао подумать о перемирии, чтобы положить конец этой бессмысленной экспедиции."
  prc.24.a:0 "Экспедиция провалилась."
  prc.24.b:0 "Нам просто нужно подождать."
  prc.25.t:0 "Визит Бай Цюэня"
  prc.25.d:0 "Канадский коммунист Норман Бетюн, также известный как Бай Цюэнь, вчера посетил Мао. Бай настаивал на том, что будет проводить полевые хирургические операции для наших солдат, чтобы помочь в нашей войне против японцев."
  prc.25.a:0 "Медик - это то, что нам нужно!"
  prc.26.t:0 "[GetMonth] Контртечение"
  prc.26.d:0 "Конфликт между некоторыми высокопоставленными членами партии и Цзян Цин стал более очевидным. Группа Цзян Цин обвинила старших членов в реакционности, в результате чего некоторые из них потеряли доверие Мао."
  prc.26.a:0 "Политика - тёмная вещь."
  prc.27.t:0 "Хэ Лун под домашним арестом"
  prc.27.d:0 "Неповиновение Хэ Луна приказу Мао \"искоренить капиталистов\" привело к потере доверия со стороны Мао, и вчера Хэ Луна поместили под домашний арест в Сишане."
  prc.27.a:0 "Политика - тёмная вещь."
  prc.28.t:0 "Пэн Дэхуа похищен"
  prc.28.d:0 "Цзян Цин разрешил красной гвардии похитить генерала Пэн Дэхуа, и его допросили. После допроса Пэн был заключен в тюрьму."
  prc.28.a:0 "Политика - мрачная штука"

  prc.29.t:0 "Не Жунчжэнь понижен в должности"
  prc.29.d:0 "По приказу Мао Не Жунчжэнь был понижен в должности и работает на химзаводе в Хандане."
  prc.29.a:0 "Политика - мрачная штука"

  prc.30.t:0 "Конец борьбы за власть"
  prc.30.d:0 "После почти трех лет борьбы за власть [Root.GetLeader] занял пустовавшую после смерти Сталина должность и стал самым могущественным человеком в СССР"
  prc.30.a:0 "Надеюсь, это лучший исход"

  prc.36.t:0 "[PRC.GetName] планирует вторжение в [SIK.GetName]"
  prc.36.d:0 "Наш осведомитель в [PRC.GetName] подтвердил, что они планируют силой захватить [SIK.GetName]."
  prc.36.a:0 "Предъявите [SIK.GetLeader] требование о сотрудничестве, чтобы избежать кровопролития."
  prc.36.b:0 "Предъявите [PRC.GetLeader] требование отказаться от этой идеи."
  prc.36.c:0 "Интересно..."

  prc.37.t:0 "Вести из [SOV.GetName]"
  prc.37.d:0 "[SOV.GetLeader] потребовал, чтобы мы мирно подчинились [PRC.GetName] и избежали дальнейшего кровопролития."
  prc.37.a:0 "Он прав, это во благо нашего народа."
  prc.37.b:0 "Какая чушь! Мы не сдадимся без боя!"

  prc.38.d:0 "[SOV.GetLeader] потребовал, чтобы мы отменили план вторжения в [SIK.GetName]."
  prc.38.a:0 "Слова [SOV.GetLeader] не самые мудрые, слова [PRC.GetLeader] важнее!"
  prc.38.b:0 "Не привлекай ненужного внимания."

  prc.39.t:0 "[SOV.GetName] Вмешательство"
  prc.39.d:0 "Благодаря вмешательству [SOV.GetName], [SIK.GetName] мирно покорился нам."
  prc.39.a:0 "Так или иначе, цель достигнута."

  prc.40.t:0 "[SIK.GetName] Неподчинение"
  prc.40.d:0 "[SIK.GetLeader] отказывается мирно покориться [PRC.GetName]!"
  prc.40.a:0 "Как они смеют не подчиняться нашим приказам!"

  prc.41.t:0 "[PRC.GetName] Неподчинение"
  prc.41.d:0 "[PRC.GetLeader] отказался отказаться от планов вторжения в [SIK.GetName]!"

  prc.42.t:0 "[PRC.GetLeader] Подчинился Приказу"
  prc.42.d:0 "[SIK.GetLeader] отказался от планов вторжения в [SIK.GetName]!"
  prc.42.a:0 "По крайней мере, они еще знают свое место."

  prc.43.t:0 "[SOV.GetNameADJ] Подкрепления"
  prc.43.d:0 "Видя стойкость [SIK.GetName] против подчинения, [SOV.GetName] прислал подкрепления, чтобы помочь нам."
  prc.43.a:0 "Эти силы будут жизненно важны для нашей цели!"

  prc.44.d:0 "Видя агрессивную политику [PRC.GetName], [SOV.GetName] прислал подкрепления, чтобы помочь нам."

  prc.46.t:0 "Убийство Мао Цзэдуна"
  prc.46.d:0 "Наш Великий Председатель Мао Цзэдун был убит сегодня в результате злодейского покушения. Линь Бяо, назначенный им преемник, решил покончить с Культурной революцией раз и навсегда. Со всем сопротивлением было быстро покончено, и наша страна, по крайней мере в некоторой степени, оправляется от ущерба, нанесенного катастрофой.\n\nХотя некоторые теории заговора утверждают, что Линь организовал покушение, чтобы занять этот пост, никаких доказательств, подтверждающих это, нет."
  prc.46.a:0 "Тяжелейшая утрата."
  prc.47.t:0 "Мао Цзэдун пережил покушение"
  prc.47.d:0 "Сегодня наш Великий Председатель Мао Цзэдун пережил злодейское покушение. Убийца был замечен до того, как он смог нанести какой-либо вред нашему любимому Великому Председателю. Однако убийца, по-видимому, был чрезвычайно предан своему хозяину, поскольку во время допроса он не проронил ни слова.\n\nПоявились дикие слухи, что Линь Бяо, преемник Мао, назначенный им самим, организовал это покушение. Хотя нет никаких доказательств, подтверждающих это, некоторые хунвэйбины начинают критиковать Линь Бяо за такую "измену"."
  prc.47.a:0 "Да здравствует наш Великий Председатель Мао Цзэдун!"
  prc.48.t:0 "Помощь от Советского Союза"
  prc.48.d:0 "Советский Союз оказал помощь в нашей войне против японцев."
  prc.48.a:0 "Это будет иметь жизненно важное значение для наших военных усилий."
  prc.49.t:0 "Подъем наших партизан"
  prc.49.d:0 "Наши партизаны в Маньчжурии восстали и помогли нам установить контроль над этой территорией."
  prc.49.a:0 "Превосходно!"
  prc.50.t:0 "Дезертиры из НРА"
  prc.50.d:0 "Некоторые бойцы из НРА решили перейти на нашу сторону."
  prc.50.a:0 "Плохое решение [CHI.GetLeader] привело к его провалу."

  prc.51.t:0 "Вдохновляющая победа"
  prc.51.d:0 "Сводки с передовой приносят радостные вести. Отдельные стычки наших войск привели к нашим победам, а моральный дух наших бойцов стремительно повысился!"
  prc.51.a:0 "Вперёд, товарищи!"

  prc.66.t:0 "Чэнь Дусю"
  prc.66.d:0 "В связи с возвращением Троцкого в [SOV.GetNameDEF] сторонники троцкизма во всём мире подняли головы и принялись критиковать "испорченный" коммунизм, созданный Сталиным. Среди них есть и наш бывший товарищ - Чэнь Дусю. Если мы хотим сохранить хорошие отношения с [SOV.GetNameDEF], мы должны привести Чэня к власти и избавиться от Мао."
  prc.66.a:0 "Давайте продвинем идею постоянной революции!"
  prc.66.b:0 "Троцкизм — предательская идеология, связанная с фашизмом!"

  prc.54.t:0 "Предложение от [From.GetName]"
  prc.54.d:0 "Недавно мы получили предложение от представителя [From.GetLeader]. В нём заявляется, что они хотели бы попросить у нас разрешение на создание ещё одного правительства в северо-западном регионе Китая и использовать нашу поддержку в борьбе с японцами и [CHI.GetRulingParty]."
  prc.54.a:0 "Передайте им, что им лучше сотрудничать с [CHI.GetRulingParty]."
  prc.54.b:0 "Посмотрим, чего они добьются."

  prc.55.t:0 "Чжан Сюэлян"
  prc.55.d:0 "Чжан отказывается продвигать план по созданию Северо-Западного союза, теперь, когда мы приняли решение с нашей стороны, мы должны попытаться убедить Чжана, что все хорошо подготовлено."
  prc.55.a:0 "Просто избавьтесь от него, он только замедлит наш прогресс."
  prc.55.b:0 "Примите его идею не выступать против [CHI.GetRulingParty]."
  prc.55.c:0 "Угрожайте передать его Гоминьдану."
  prc.55.e:0 "Мы будем в порядке без него."

  prc.56.t:0 "Чжан Сюэлян убит"
  prc.56.d:0 "Мы обнаружили, что Чжан Сюэлян был убит. В него несколько раз выстрелили в голову и грудь, некоторые предполагают, что это дело рук коммунистов. Тем не менее, виновник до сих пор не найден."
  prc.56.a:0 "Теперь все пойдет по-нашему."
  prc.56.b:0 "Надо ударить сейчас!"

  prc.57.t:0 "Чжан принял"
  prc.57.d:0 "После некоторых размышлений Чжан Сюэлян решил присоединиться к Северо-Западному союзу. Он возьмет на себя руководство, как только мы обеспечим провинцию Ганьсу и официально сформируем СЗС."
  prc.57.a:0 "Как и ожидалось."

  prc.59.t:0 "[From.GetName] отверг наше предложение"
  prc.59.d:0 "[From.GetLeader] отклонил наше предложение, заявив, что мы должны работать с [CHI.GetRulingParty], а не бороться с ними."
  prc.59.a:0 "Мы возьмем дело в свои руки!"
  prc.59.b:0 "Выполняйте приказ."

  prc.60.t:0 "[From.GetName] одобрил наше предложение"
  prc.60.d:0 "Наш проект Великого Северо-Западного союза был одобрен [From.GetNameDEF], мы должны немедленно приступить к его реализации."
  prc.60.a:0 "Отлично!"

  prc.61.t:0 "[From.GetName] нарушил наш приказ"
  prc.61.d:0 "Несмотря на наши благие намерения, [From.GetLeader] отказался выполнять наш приказ и решил все равно сформировать Великий Северо-Западный союз."
  prc.61.a:0 "Подонок...!"  # потому что это было на русском языке раньше...

  prc.62.t:0 "Мао казнен"
  prc.62.d:0 "После быстрого ночного налета на штаб-квартиру и дом Мао и его верных последователей было арестовано и суммарно казнено множество коммунистов. Их тела развешаны на проходах, чтобы напоминать людям о последствиях следования проклятому коммунизму."
  prc.62.a:0 "Долой голову мерзкой змеи!"

  prc.63.t:0 "Скрытые коммунисты"
  prc.63.d:0 "Хотя ночной рейд прошел успешно, некоторые коммунисты все еще находятся в правительстве. У некоторых есть явные доказательства поддержки Мао, но позиция некоторых других не может быть четко определена."
  prc.63.a:0 "Казнить их всех!"
  prc.63.b:0 "Прежде чем предпринимать какие-либо действия, приложите больше усилий для их идентификации."

  prc.64.t:0 "Коммунистические партизаны"
  prc.64.d:0 "Некоторые коммунисты сформировали небольшие группы партизан, чтобы преследовать наши войска и базы. Как нам с ними бороться?"
  prc.64.a:0 "Жестко подавить их!"
  prc.64.b:0 "Использовать подкуп, чтобы вызвать разногласия среди них."

  prc.65.t:0 "Создать тайную полицию?"
  prc.65.d:0 "Коммунистов в нашем правительстве больше нет. Однако их по-прежнему полно среди гражданского населения, некоторые предлагают усилить спецслужбы, чтобы более эффективно подавлять коммунистическую деятельность."
  prc.65.a:0 "Мы должны защитить наших людей от красной чумы!"
  prc.65.b:0 "В этом нет необходимости."

  prc.67.t:0 "Сообщение от [From.GetName]"
  prc.67.d:0 "[From.GetName] направил представителей для встречи с [Root.GetLeader], требуя, чтобы мы передали им Суйюань. Взамен они предложат нам присоединиться к [From.GetFactionName] и немного помочь с промышленностью."
  prc.67.a:0 "Звучит разумно."
  prc.67.b:0 "Даже не в их самых смелых мечтах!"

  prc.68.t:0 "[From.GetName] согласился"
  prc.68.d:0 "[From.GetLeader] согласился передать нам Суйюань."
  prc.68.a:0 "Мудрый ход"

  prc.69.t:0 "[From.GetName] отказался"
  prc.69.d:0 "[From.GetLeader] отказался передавать нам Суйюань."
  prc.69.a:0 "Бесполезное сопротивление."

  prc.70.t:0 "Сюй Ланьчжоу"
  prc.70.d:0 "Сюй Ланьчжоу стал учителем боевых искусств после выхода на пенсию. Он заявляет, что больше не будет руководить армией, но с удовольствием научит наших бойцов боевым искусствам."
  prc.70.a:0 "Оставьте его в покое."
  prc.70.b:0 "Нанять его как нашего учителя боевых искусств."

  prc.71.t:0 "[From.GetName] ищет альянс"
  prc.71.d:0 "Хотя они создали свое правительство в северо-западном регионе, кажется, что их цель в чем-то совпадает с нашей. Мы могли бы сотрудничать с ними и выгнать японцев обратно в море."
  prc.71.a:0 "Китайцы должны объединиться против наших общих врагов."
  prc.71.b:0 "Они, безусловно, нанесут нам удар в спину!"
  prc.72.t:0 "Альянс принят"
  prc.72.d:0 "[From.GetName] принял наше предложение о союзе."
  prc.72.a:0 "Смерть оккупантам!"
  prc.73.t:0 "Альянс отвергнут"
  prc.73.d:0 "[From.GetName] отклонил наше предложение."
  prc.73.a:0 "Чёрт бы их побрал!"
  prc.74.t:0 "[From.GetName] хочет обменяться военными знаниями"
  prc.74.d:0 "Понимая, что мы оба не выживем, если будем воевать в одиночку, [From.GetLeader] решил позволить нашим войскам сотрудничать друг с другом. Таким образом, мы могли бы узнать достоинства их армии, как и они наши."
  prc.74.a:0 "Приемлемо"
  prc.74.b:0 "Они, должно быть, что-то замышляют..."
  prc.75.t:0 "Предложение принято"
  prc.75.d:0 "Некоторые должностные лица АНР прибыли в наш командный центр и начали обмениваться военными знаниями с нашими командирами."
  prc.75.a:0 "Наша объединённая мощь поставит наших врагов на колени!"
  prc.76.t:0 "Предложение отклонено"
  prc.76.d:0 "[From.GetName] отклонил наше предложение об обмене военными знаниями."
  prc.76.a:0 "О чём они вообще думают?"
  prc.77.t:0 "[From.GetName] приносит извинения"
  prc.77.d:0 "Хотя они и нарушили наш приказ, сформировав [From.GetFactionName], теперь они технически находятся в едином фронте с [CHI.GetName], что и было нашей целью. Теперь они прислали нам извинения и хотят, чтобы мы закрыли глаза на их предыдущее "непослушание"."
  prc.77.a:0 "Ну, хорошо..."
  prc.77.b:0 "Я никогда не видел таких бессовестных людей!"

  prc.78.t:0 "[From.GetName] принимает наши извинения"
  prc.78.d:0 "Наши извинения были приняты [From.GetName]."
  prc.78.a:0 "Отлично."

  prc.79.t:0 "[From.GetName] отвергает наши извинения"
  prc.79.d:0 "Наши извинения были отвергнуты [From.GetName]."
  prc.79.a:0 "Жаль"

  prc.80.t:0 "Давление со стороны [From.GetName]"
  prc.80.d:0 "В последнее время [From.GetName] оказывает давление на [Root.GetLeader]. Некоторые чиновники также начинают говорить [Root.GetLeader], чтобы он сдался до того, как войска [From.GetName] ворвутся в его дом и уничтожат его."
  prc.80.b:0 "Сдавайтесь, пока не стало слишком поздно."
  prc.80.a:0 "Мы не поддадимся на такие наивные уловки."

  prc.81.t:0 "[From.GetName] сдался"
  prc.81.d:0 "Больше не в силах выдержать наше давление, [From.GetLeader] решил сдаться нашему правительству."
  prc.81.a:0 "Мудрое решение."

  prc.82.t:0 "[From.GetName] отказывается сдаваться"
  prc.82.d:0 "Несмотря на наше сильное давление и убеждение подкупленных чиновников, [From.GetLeader] стоит твердо. Он сказал нашему представителю, что никогда не подчинится нашему тираническому правлению."
  prc.82.a:0 "Они скоро поймут, что совершили ошибку."

  prc.83.t:0 "[From.GetName] предал нас"
  prc.83.d:0 "[From.GetName] сверг наше марионеточное правительство и теперь верен [PRC.GetName]!"
  prc.83.a:0 "Как они смеют!"

  prc.84.t:0 "[From.GetName] требует, чтобы мы уступили территорию"
  prc.84.d:0 "[From.GetName] утверждает, что мы слишком долго занимаем их законные территории, и настало время для них принять меры против такой несправедливости."
  prc.84.a:0 "Мы не хотим начинать войну с ними."
  prc.84.b:0 "Это какая-то шутка?"

  prc.85.t:0 "[From.GetName] возвращает территорию"
  prc.85.d:0 "[From.GetName] решил вернуть нашу территорию."
  prc.85.a:0 "На благо обоим."

  prc.86.t:0 "[From.GetName] отказывается возвращать территорию"
  prc.86.d:0 "[From.GetName] решил сохранить нашу законную территорию."
  prc.86.a:0 "Пора сделать это по-жесткому."

  prc.87.d:0 "С постоянно растущей силой [From.GetName] наш народ боится, что наша нация может вскоре погибнуть, если мы не встанем на чью-либо сторону. Только вчера ультиматум от [From.GetName] достиг стола [Root.GetLeader], требуя, чтобы [Root.GetName] стал их протекторатом."
  prc.87.a:0 "Трусы живут..."
  prc.87.b:0 "Мы никогда не сдадимся тирану!"

  prc.88.a:0 "Захватить территорию."

  prc.89.t:0 "[From.GetName] требует уступок"

  prc.92.t:0 "[From.GetName] пытается захватить власть"
  prc.92.d:0 "[From.GetName] отправил сегодня утром представителей на встречу с [Root.GetLeader]. Встреча в основном посвящена тому, чтобы сказать [Root.GetLeader], чтобы он отказался от своей власти и позволил [From.GetName] захватить власть. После долгих размышлений со стороны [Root.GetLeader] было найдено решение..."
  prc.92.a:0 "[Root.GetName] не покорится дьяволу!"
  prc.92.b:0 "Отказаться от власти."
  prc.93.t:0 "Повстанцы [From.GetName]"
  prc.93.d:0 "[From.GetLeader] решил выступить против нас, а не подчиниться нам."
  prc.93.a:0 "Еще можно все уладить оружием."

  prc.95.t:0 "[From.GetName] хочет заключить с нами пакт"
  prc.95.d:0 "[From.GetName] направил представителей с просьбой подписать недавно разработанный пакт. Этот пакт также будет действовать в качестве декларации о дружбе и пакте о ненападении."
  prc.95.a:0 "Подписать"
  prc.95.b:0 "Должно быть, это какая-то наивная уловка."

  prc.96.t:0 "Пакт подписан"
  prc.96.d:0 "[From.GetName] подписал пакт."
  prc.96.a:0 "Отлично!"

  prc.97.t:0 "Пакт отклонен"
  prc.97.d:0 "[From.GetName] отказался подписать пакт."
  prc.97.a:0 "Ну и ладно"

  prc.102.t:0 "Предложение о ВППО"
  prc.102.d:0 "[From.GetName] направил нам предложение, в котором говорится, что создание ВППО (Организации пакта Западной части Тихого океана) является необходимым. С созданием ВППО мы можем присматривать друг за другом и удерживать от нас любых демонов, которые положили глаз на наши территории."
  prc.102.a:0 "Это может обеспечить наше выживание."
  prc.102.b:0 "Sore wa inbou desu."

  prc.103.t:0 "Создано [From.GetFactionName]"
  prc.103.d:0 "[From.GetName] согласился сформировать ВППО, теперь мы стоим вместе."
  prc.103.a:0 "Слава!"

  prc.104.t:0 "[From.GetName] отказался"
  prc.104.d:0 "[From.GetName] отказался от создания ВППО."
  prc.104.a:0 "Жаль"

  prc.105.t:0 "[From.GetFactionName] поддержал переворот"
  prc.105.d:0 "Только что начался переворот, который поддержал [From.GetFactionName]!"
  prc.105.a:0 "Проклятье!"
  prc.106.t:0 "Предательство [From.GetName]"
  prc.106.d:0 "Несмотря на подписанный нами пакт, теперь [From.GetName] проявляет враждебность по отношению к нам. Они казнили всех должностных лиц [Root.GetNameADJ] в своем правительстве и объявили нам войну!"
  prc.106.a:0 "Дикие твари!"
  prc.108.t:0 "Спасти Чжан Сюэляна?"
  prc.108.d:0 "Чжан содержится под стражей [CHI.GetRulingParty] после инцидента в Сиане. Без него план по созданию Великого Северо-Западного союза не может быть реализован."
  prc.108.a:0 "Спасти его!"
  prc.108.b:0 "Мы можем продолжать без него."
  prc.109.t:0 "Мир с Японией?"
  prc.109.d:0 "Теперь, когда Динбэй находится под нашим контролем, некоторые генералы и чиновники выразили удовлетворение результатом. Они предлагают нам заключить мир с Японией."
  prc.109.a:0 "Это для всеобщего блага."
  prc.109.b:0 "Мы должны дождаться более подходящей ситуации."
  prc.109.c:0 "Что это за чушь!"
  prc.110.t:0 "[From.GetName] ищет мира"
  prc.110.d:0 "Достигнув своей цели, они теперь ищут мира между нами."
  prc.110.a:0 "Наши силы нужны в другом месте..."
  prc.110.b:0 "Никогда!"
  prc.111.t:0 "Мир с [JAP.GetName]"
  prc.111.d:0 "[From.GetName] согласился на мир между нами."
  prc.111.a:0 "Лучший исход"
  prc.112.t:0 "[From.GetName] отверг мир"
  prc.112.d:0 "[From.GetName] отказался заключить мир."
  prc.112.a:0 "Они лишь избегают неизбежного."
  prc.114.d:0 "Мы долгое время отбивались от [JAP.GetNameDef] и их марионеточных режимов в Маньчжурии. В то время как наши войска освобождают последний оплот имперской державы на северо-востоке, [JAP.GetAdjective] чиновники, опасаясь, что их государство никогда не оправится от затяжной войны на истощение против [PRC.GetNameDef], обратились к нашим политикам с предложением о перемирии и условиями капитуляции. \n\nЭто наш шанс выдвинуть требования!"
  prc.115.t:0 "Голод в Хэнане"
  prc.115.d:0 "Война, бушующая в Хэнане, вызвала в регионе голод, поскольку сельскохозяйственные угодья разрушены войной. Местное правительство теперь просит нашей помощи, чтобы облегчить их бремя."
  prc.115.a:0 "Мы должны им помочь!"
  prc.115.b:0 "У нас нет времени на это."
  prc.116.t:0 "Бывшие коммунисты присоединяются к нам"
  prc.116.d:0 "Благодаря успеху наших программ по восстановлению села некоторые бывшие коммунисты решили присоединиться к нам."
  prc.116.a:0 "Мудрый ход."
  prc.117.t:0 "[XSM.GetName] присоединяется к [CHI.GetName] против нас"
  prc.117.d:0 "[CHI.GetLeader] приказал [XSM.GetLeader] начать наступление на наш северо-западный фланг!"
  prc.117.a:0 "Они погибнут вместе с [CHI.GetLeader]!"
  prc.120.t:0 "Приглашение от [From.GetLeader]"
  prc.120.d:0 "С созданием [From.GetFactionName], [From.GetLeader] отправил приглашение [Root.GetLeader], надеясь, что мы сможем присоединиться к ним."
  prc.120.a:0 "Хорошая идея."
  prc.120.b:0 "Как насчет отказа?"
  prc.121.t:0 "[From.GetName] присоединяется к нам"
  prc.121.d:0 "[From.GetLeader] принял решение присоединиться к нам."
  prc.121.a:0 "Фантастика!"
  prc.122.t:0 "[From.GetName] отказался"
  prc.122.d:0 "[From.GetLeader] отказался присоединиться к [Root.GetFactionName], сказав, что он может достичь большего в одиночку."
  prc.122.a:0 "Дерьмовый выскочка!"
  prc.123.t:0 "Отправить приглашение [SIK.GetLeader]?"
  prc.123.d:0 "Чтобы получать поставки из [SOV.GetName], важно получить доступ к Синцзянскому району. Мы могли бы пригласить их в нашу фракцию и завоевать их доверие."
  prc.123.a:0 "Отправить приглашение"
  prc.123.b:0 "Это излишне."
  prc.124.t:0 "[From.GetLeader] призывает действовать"
  prc.124.d:0 "[From.GetLeader] отправил сообщения о том, что они хорошо подготовлены к созданию Северо-Западного национального правительства и теперь ждут наших действий."
  prc.124.a:0 "Мы готовы."
  prc.124.b:0 "Пока рано..."
  kns.4.t:0 "Смерть Иосифа Сталина"
  kns.4.d:0 "Иосиф Сталин, бывший лидер Советского Союза, получил диагноз инсульта, высокого кровяного давления и желудочного кровотечения. До вызова врачей его нашли лежащим на полу в его спальне. Использовавшиеся для лечения пиявки не помогли, поэтому дублера Сталина отозвали из отпуска, чтобы в случае необходимости заменить Сталина. Однако позднее состояние здоровья Сталина было подробно передано по всей стране. На следующий день Иосиф Сталин был объявлен мертвым.\n\nОжидается, что культ личности Сталина сохранится и после его смерти. Уже идет борьба за власть, поскольку влиятельные члены партии стремятся занять оставленную им вакантную должность."
  kns.4.a:0 "Тяжелая утрата."
  kns.4.b:0 "Потеря великого наставника и великого лидера."
  kns.4.c:0 "Любопытно"

  ############ events transferred from KMT #######################3
  kmt.32.t:0 "Начало кампании «Сто цветов»"
  kmt.32.d:0 "Кампания «Сто цветов» приведена в действие. Теперь нам нужно только дождаться, когда покажутся свиньи-правые."
  kmt.32.a:0 "Пусть расцветут сто цветов, чтобы мы могли их сорвать."

  kmt.33.t:0 "Ход кампании"
  kmt.33.d:0 "Кампания проводится всего несколько месяцев, и уже некоторые капиталистические грызуны раскритиковали правительство. Мы можем продолжить эту кампанию и выманить из нор больше реакционных свиней, но их взгляды могут ослабить веру людей в коммунизм."
  kmt.33.a:0 "Мы арестуем этих правых свиней прямо сейчас."
  kmt.33.b:0 "Нам следует выманить еще больше из них."

  kmt.34.t:0 "Растущая критика со стороны народа"
  kmt.34.d:0 "Чем дольше длится кампания, тем больше критики получает правительство. Это будет только ухудшаться, если мы не возьмем ситуацию под контроль."
  kmt.34.a:0 "Мы посадим этих недовольных в тюрьму."
  kmt.34.b:0 "Надо потерпеть."
  KMT_baihua_stage_2_tt:0 "К критикам примыкает все больше правых"

  kmt.35.t:0 "Критика становится более радикальной"
  kmt.35.d:0 "Поначалу критика была мягкой. Но со временем стали звучать более радикальные голоса, призывающие к действию. Если мы не примем меры в ближайшее время, мы можем столкнуться с контрреволюцией."
  kmt.35.a:0 "Мы сделаем так, что они больше никогда ничего не скажут."
  kmt.35.b:0 "Это всего лишь прислужники настоящих реакционеров. Мы должны дождаться, когда лидеры реакции покажут свое лицо."
  KMT_baihua_stage_3_tt:0 "Критика становится более радикальной"

  kmt.36.t:0 "Призывы к восстанию"
  kmt.36.d:0 "Пока мы игнорируем радикальные высказывания, некоторые глупцы призывают к немедленному свержению народного правительства. Некоторые кадры начинают опасаться за свою жизнь. Может, пора заканчивать кампанию?"
  kmt.36.a:0 "Теперь им негде будет спрятаться."
  kmt.36.b:0 "Мы почти добрались до всех этих подонков, осталось всего несколько недель, и мы одним махом отрубим им всем головы!"
  KMT_baihua_stage_4_tt:0 "Люди начинают терять веру в коммунизм"

  kmt.37.t:0 "На грани краха"
  kmt.37.d:0 "Уровень и количество словесных атак на правительство стали невыносимыми. Чтобы защитить революцию рабочих и крестьян, мы должны арестовать всех смутьянов!"
  kmt.37.a:0 "Ради Партии, мы должны покончить со всей оппозицией. Навсегда."
  baihua_end_now:0 "Кампания будет прекращена немедленно.\n"

  kmt.39.t:0 "Начало Большого скачка"
  kmt.39.d:0 "Начался Большой скачок. Скоро мы достигнем тотального и научного коммунизма!"
  kmt.39.a:0 "Мы превзойдём западный мир!"

  kmt.40.t:0 "Построены доменные печи во дворах"
  kmt.40.d:0 "Некоторые люди построили собственные доменные печи во дворах без вмешательства правительства. Это поистине признак единства нашей нации."
  kmt.40.a:0 "С таким прогрессом мы скоро превзойдём западный мир!"

  kmt.43.t:0 "Голод"
  kmt.43.d:0 "Голод поразил некоторые из наших провинций из-за того, что крестьяне бросали сельскохозяйственные орудия в печи. Никто не может собрать урожай без соответствующего оборудования. Урожай, который собирают, отправляется за границу для оплаты промышленного оборудования."
  kmt.43.a:0 "Но в отчётах говорится, что урожай вырос на 400%..."

  kmt.46.t:0 "Большой скачок зашёл в тупик"
  kmt.46.d:0 "После партийного съезда председатель Мао с глубоким сожалением решил прекратить Большой скачок. Тела голодных крестьян и куски чугуна усеивают сельскую местность. Оказывается, всё-таки нельзя делать сталь во дворе."
  kmt.46.a:0 "Большой скачок дал Китаю лишь голод, а не прогресс."

  kmt.47.t:0 "Мао посетил местную коммуну"
  kmt.47.d:0 "Председатель Мао был крайне доволен, увидев преданность крестьян в одной из коммун в Хэнани. В честь их пролетарского духа он дал благословление таким коммунам по всему Китаю."
  kmt.47.a:0 "Наш народ действительно предан партии!"

  prc.126.t:0 "Мао возглавил"
  prc.126.d:0 "После длительного перехода многие дивизии наших военных лидеров ослабли в боях. Армия самого Мао осталась относительно нетронутой. Кроме того, его последние речи в армии также прояснили одну вещь. Теперь он является бесспорным лидером нашего дела!"
  prc.126.a:0 "Вперёд, к лучшим дням."
  PRC_continuous_one_time_boost_desc:0 "Чтобы победить нашего врага, нужен основательный план. Нам следует собрать как можно больше разведданных и военных умов для таких планов, они должны дать нам некоторые преимущества в ближайших стычках с нашими врагами."