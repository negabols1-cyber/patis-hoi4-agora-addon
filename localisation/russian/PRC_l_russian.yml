  ################  IDEAS  ###############################
  PRC_defeatism_1:0 "Дефетизм"
  PRC_defeatism_1_desc:0 "Некоторые наши товарищи полагают, что если мы вступим в войну с японцами, то станем новой Абиссинией. Эти мысли сильно подавляют волю нашего народа."
  PRC_underestimation:0 "Недооценка Японии"
  PRC_underestimation_desc:0 "Некоторые из наших товарищей слишком оптимистично настроены в отношении японцев. Они даже утверждают, что японцы никогда не доберутся до Шаньси. Такая самонадеянность сильно повлияет на наши военные усилия."
  PRC_integrated_army:0 "Объединенная армия"
  PRC_integrated_army_desc:0 "Коммунистическая Красная Армия согласилась быть включенной в состав нашей армии, с этой небольшой дополнительной поддержкой война может стать менее трудной."
  PRC_initiative_idea:0 "Инициатива во время войны"
  PRC_initiative_idea_desc:0 "Обезоруживание солдата является результатом потери им свободы действий из-за того, что он был вынужден занять пассивную позицию. То же самое и с поражением армии. По этой причине обе стороны в войне делают все возможное, чтобы захватить инициативу и избежать пассивности"
  PRC_protracted_war_idea:0 "Затяжная война"
  PRC_protracted_war_idea_desc:0 "Мы должны сдерживать японцев как можно дольше, чтобы выиграть время для получения международной помощи."
  PRC_devastating_long_march:0 "Опустошение от долгого похода"
  PRC_devastating_long_march_desc:0 "После Великого похода мы наконец обосновались в Шэньси. Однако зияющая рана, принесенная им, до сих пор не зажила. Будет ли это наш конец?"
  PRC_devastating_long_march_1:0 "Восстановление после Великого похода"
  PRC_devastating_long_march_1_desc:0 "Мы вернулись в нужное русло, и вскоре влияние Великого похода будет сведено к минимуму."
  PRC_guerilla_warfare_economy:0 "Партизанская война"
  PRC_guerilla_warfare_economy_desc:0 "Мы даже близко не можем считаться \"нацией\" или \"страной\". Наше движение - всего лишь нечто вроде партизанской войны против Гоминьдана.\n"
  PRC_lack_skilled_personnel:0 "Недостаток квалифицированного персонала"
  PRC_lack_skilled_personnel_desc:0 "Многие наши товарищи погибли во время Великого похода, из-за чего среди наших рядов возникла нехватка квалифицированного персонала. Это затруднит нам достижение каких-либо технологических улучшений."
  PRC_swift_victory_idea:0 "Доктрина \"Стремительная победа\""
  PRC_swift_victory_idea_desc:0 "Если мы хотим победить в войне против японских захватчиков, нам нужно действовать быстро и ударить, пока они не осознали это."
  propaganda_recruits:0 "Пропаганда рекрутов"
  propaganda_recruits_desc:0 "Сейчас мы полагаемся на нашу пропаганду, чтобы привлекать в свои ряды новых людей. Это не очень эффективно, но тем не менее укрепляет волю нашего народа.\n"
  unyielding_spirit:0 "Непоколебимый дух"
