  ############## DECISIONS ##################
  PRC_solidifying_our_revolution:0 "Укрепление нашей революции"
  PRC_solidifying_our_revolution_desc:0 "В последние годы [PRC.getNameDefCap] столкнулась со многими трудностями. Коварный Гоминьдан попытался уничтожить любую социалистическую оппозицию в 1935 году, что заставило наше когда-то популярное движение среди крестьян разойтись и рассеяться по сельским районам Центральной равнины. Восстановление сил, несомненно, потребует времени и усилий, но мы одержим победу в этой борьбе!"
  PRC_question_of_our_capital_decision:0 "Определить столицу"
  PRC_question_of_our_capital_decision_desc:0 "Народная революция получит еще большую поддержку рабочих и крестьян, если мы официально объявим об учреждении [PRC.getNameDef] в нашей новой столице."

  PRC_the_new_communist_beacon:0 "Новый коммунистический маяк"
  PRC_the_new_communist_beacon_desc:0 "Революционная борьба никогда не закончится, пока существуют угнетатели, колонизаторы, империалисты и враги народа! \nНесколькими быстрыми ударами мы можем уничтожить антиправительственные ячейки за пределами [ROOT.getNameDef] и внутри него. \nПришло время Da Zhonghua Diqu подняться и процветать!"
  PRC_hundred_flowers_campaign_progress:0 "Прогресс кампании \"Сто цветов\""

