  PRC_socialism_with_chinese_characteristics:0 "Социализм с китайской спецификой"
  lin_biao_generalissimo:0 "Линь Бяо"
  political_mobilisation_idea:0 "Политическая мобилизация"
  PRC_uncertainty_of_new_theory:0 "Неопределенность в новой доктрине"
  PRC_uncertainty_of_new_theory_desc:0 "Принятие новой доктрины, которая отвергает все предыдущие стратегии, вызывает некоторую тревогу по этому поводу."
  PRC_maybe_theory_is_ok:0 "Уверенность в новой доктрине"
  PRC_maybe_theory_is_ok_desc:0 "Недавно принятая доктрина оказалась успешной, наша армия полностью приспособилась к новому стилю боя.\n\n§RЕсли ход войны будет складываться не в вашу пользу, ваша армия может потерять в нее веру.§!"
  PRC_enemy_partisan:0 "Партизаны врага в нашем тылу"
  PRC_enemy_partisan_desc:0 "Партизаны нашего врага создали базу глубоко в нашем тылу, нанося урон линиям снабжения и замедляя продвижение наших войск.\n\n§RЭтот национальный дух закончится, когда закончится война с Китаем.§!\n\n§RПериодический урон по зданиям на подконтрольных нам китайских землях.§!"
  PRC_exploit_our_enemys_mistake_idea:0 "Использование ошибок врага"
  PRC_exploit_our_enemys_mistake_idea_desc:0 "Операция нашего врага на передовой не очень хорошо координирована, мы можем использовать это в своих интересах и эксплуатировать это как можно больше.\n\n§RЭтот Национальный Дух истечет, когда война с Японией закончится.§!"
  improper_frontline_command:0 "Недостатки в командовании на передовой"
  improper_frontline_command_desc:0 "Недостатки в нашей операции на передовой начинают проявляться, и наш противник начинает использовать их в качестве своих преимуществ."
  PRC_inspiring_victory:0 "Вдохновляющая Победа"
  PRC_land_reform_stimulated_our_farmers:0 "Восстание крестьян"
  PRC_land_reform_stimulated_our_farmers_desc:0 "Коммунистическая политика земельной реформы стимулировала многих фермеров в нашей стране. Эти фермеры теперь восстают против своих помещиков и присоединяются к коммунистической угрозе."
  prc_plan_for_decisive_battle:0 "Тщательное Планирование"
  PRC_winter_training_idea:0 "Зимние Тренировки"
  PRC_revanchism:0 "Реваншизм"
  PRC_revanchism_desc:0 "§RСрок действия истекает, когда не воюет с Японией§!"
  PRC_anti_jap_sentiment:0 "Анти-японские настроения"
  PRC_anti_jap_sentiment_desc:0 "§YПолучит бафф, когда воюет с Японией§!"
  PRC_expanded_guerillas:0 "Расширенная партизанская операция"
  PRC_dbj_army_focus:0 "Сосредоточиться на Северо-восточной армии"
