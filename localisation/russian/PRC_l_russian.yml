  PRC_former_glory:0 "Былая слава"
  PRC_general_staff:0 "Генеральный штаб"
  PRC_general_staff_desc:0 "Повторяя Германский генеральный штаб, эта военная группа может координировать наши силы для лучшего результата на поле боя."
  PRC_top_command:0 "Высшее командование"
  PRC_prepare_for_extreme_condition:0 "Подготовиться к экстремальным условиям"
  PRC_eastern_blitzkrieg:0 "Восточный блицкриг"
  PRC_jap_advisors:0 "Японские военные советники"
  PRC_jap_style_command:0 "Структура вольного командования"
  PRC_sov_advisor:0 "Советские военные советники"
  PRC_secret_police:0 "Тайная полиция"
  PRC_enemy_partisan_1:0 "Партизаны противника за нашей линией фронта"
  PRC_enemy_partisan_1_desc:0 "Партизаны противника установили свои позиции далеко за нашей линией фронта, что наносит урон линиям поставок и замедляет наши войска.\n\n§RЭтот национальный дух завершится, когда война с КНР закончится.§!\n\n§RПериодическое разрушение зданий в основных китайских государствах, контролируемых нами§!"
