l_russian:
 conference.0.title:0 "Нас приглашают на Межамериканскую конференцию"
 conference.0.title_arg:0 "[USA.GetLeader] готовит Межамериканскую конференцию"
 conference.0.desc:0 "\nПосольство [USA.GetName] прислало нам письмо, написанное [USA.GetLeader], в котором он сердечно приглашает нас на следующую Межамериканскую конференцию по поддержанию мира, которая состоится в [ARG.Capital.GetName]. Мы знаем заранее, что конференции обычно имеют большой успех, как в последний раз, когда она проводилась в 1933 году.\n\nНаши советники по международным отношениям настоятельно рекомендуют откликнуться на призыв [USA.GetName], так как мы наверняка сможем извлечь выгоду из мировой ситуации."
 conference.0.desc_arg:0 "\n[USA.GetName] уже готовит следующую Межамериканскую конференцию по поддержанию мира, которая состоится в [ARG.Capital.GetName] в декабре 1936 года, как договорились Франклин Д. Рузвельт и Агустин Педро Хусто год назад. Мы знаем заранее, что конференции обычно имеют большой успех, как в последний раз, когда она проводилась, в 1933 году. Безусловно, мы должны иметь возможность извлечь выгоду из мировой ситуации в интересах нации."
 conference.0.a:0 "Мы будем участвовать ради нашего благополучия и благополучия региона"
 conference.0.b:0 "Мы не заинтересованы"
 conference_0a_tt:0 "Разрешить миссии §YМежамериканской конференции§!"
 conference_0b_tt:0 "Отменить миссии §YМежамериканской конференции§!"
 conference_1a_tt:0 "По окончании конференции вы получите:\n\nЗаводы по производству товаров народного потребления: §Y-8%§! \nСкорость строительства §Yгражданских фабрик§!: §G+20%§! \nСкорость строительства §Yинфраструктуры§!: §G+5%§! \nв течение §Y365§! дней"
 conference_1b_tt:0 "По окончании конференции вы получите:\n\nСкорость строительства §Yвоенных заводов§!: §G+10%§! \nРост эффективности производства: §G+10%§! \nШтраф за отсутствие ресурсов: §G-15%§! \nв течение §Y365§! дней"
 conference_2a_tt:0 "По окончании конференции вы получите:\n\nСкорость исследования пехотного оружия: §G+10%§! \nСкорость исследования артиллерии: §G+10%§! \nСнижение затрат на сухопутную доктрину: §G-20%§! \nв течение §Y365§! дней"
 conference_2b_tt:0 "По окончании конференции вы получите:\n\nСкорость строительства §Yвоенно-морских верфей§!: §G+10%§! \nСкорость военно-морских исследований: §G+20%§! \nСнижение стоимости военно-морской доктрины: §G-20%§! \nв течение §Y365§! дней"
 conference_2c_tt:0 "По окончании конференции вы получите:\n\nСкорость строительства §Yавиабаз§!: §G+10%§! \nСкорость воздушных исследований: §G+15%§! \nСнижение затрат на воздушную доктрину: §G-20%§! \nв течение §Y365§! дней"
 conference_3a_tt:0 "По окончании конференции вы получите:\n\nСкорость исследований: §G+8%§! \nв течение §Y365§! дней"
 conference_3b_tt:0 "По окончании конференции вы получите:\n\nСкорость исследований в области электроники: §G+15%§! \nСкорость промышленных исследований: §G+15%§! \nв течение §Y365§! дней"
 conference.1.title:0 "Наш промышленный приоритет на конференции"
 conference.1.desc:0 "Первое решение, которое мы должны принять, это выбрать между приоритетом гражданской промышленности или укреплением военного производства. Приоритизация первого позволит нам повысить потенциал промышленности и строительства государства на раннем этапе, в то время как второе поможет нам производить оружие более эффективно."
 conference.1.a:0 "Это идеальная возможность для индустриализации страны."
 conference.1.b:0 "Сейчас самое главное - военная техника."
 conference.2.title:0 "Наши военные предпочтения на конференции"
 conference.2.desc:0 "Теперь мы должны спросить себя, какой род войск получит бонус на конференции. У каждого варианта будут свои преимущества, хотя нам, возможно, придется отдать приоритет тому, который в первую очередь требует нашего внимания."
 conference.2.a:0 "Сухопутная армия нуждается в срочных реформах, это должно быть приоритетом."
 conference.2.b:0 "Было бы целесообразно иметь компетентный флот."
 conference.2.c:0 "Лучше всего модернизировать наши военно-воздушные силы, пока они не устарели."
 conference.3.title:0 "Наше научно-исследовательское направление на конференции"
 conference.3.desc:0 "И, наконец, последнее, что нужно указать - это какая научная позиция мы займем. С одной стороны, мы можем отдать приоритет бонусу на исследования в целом или, с другой стороны, сосредоточиться только на электронике и промышленности."
 conference.3.a:0 "Развитие наших исследовательских центров позволит нам быть более автономными."
 conference.3.b:0 "Бесполезно разрабатывать технологии, если у нас нет механизмов для их производства."
 conference.4.title:0 "Наши делегаты возвращаются из [ARG.Capital.GetName]"
 conference.4.title_arg:0 "Наши делегаты возвращаются с конференции"
 conference.4.desc:0 "Поскольку Межамериканская конференция завершилась, наши делегаты сегодня прибыли в [Root.Capital.GetName] с неотложным сообщением. Судя по всему, нам удалось успешно обозначить все наши промышленные, военные и научные позиции, поддерживаемые в текущем сценарии, поэтому мы достигли специальных соглашений об их реализации в течение следующего периода. Этот этап, несомненно, станет рубежом в истории [Root.GetName]."
 conference.4.desc_arg:0 "Поскольку Межамериканская конференция завершилась, наши делегаты сообщили нам, что, судя по всему, нам удалось успешно обозначить все наши промышленные, военные и научные позиции, поддерживаемые в текущем сценарии, в отношении которых мы достигли специальных соглашений по их реализации в течение следующего периода. Этот этап, несомненно, станет рубежом в истории [Root.GetName]."
 conference.4.a:0 "¡Отличные новости!"
 conference.6.title:0 "Межамериканская конференция завершена"
 conference.6.desc:0 "Сегодня завершилась Межамериканская конференция по поддержанию мира, на которой председательствовал [USA.GetLeader], на которой делегаты различных стран Америки подтвердили позиции своих стран в отношении растущей мировой напряженности. \n\nХотя делегации договорились о том, чтобы не допустить вовлечения американского континента в возможный конфликт, их заявления были классифицированы как политический и чисто пропагандистский акт, поскольку не было подписано ни одного договора, который бы обязал страны соблюдать нейтралитет. Единственно верным является то, что конференция прошла успешно."
 conference.6.a:0 "В Америке не будет войны, по крайней мере, пока..."