l_russian:
 CHI_chiang_house_arrest:0 "Чан Кайши под домашним арестом"
 CHI_chiang_house_arrest_desc:0 "Единственный путь к достижению мечты о Цин — это убедить Чан Кайши в своей правоте. Мы сможем это сделать, только манипулируя его мнением. §RМнение Чан Кайши§!: [?CHI_chiang_under_house_arrest_var|G0]"
 CHI_manipulate_chiang:0 "Манипулировать Чан Кайши"
 CHI_brain_wash_chiang:0 "Промыть мозги Чан Кайши"
 CHI_chiang_opinion_decreases:0 "Мнение Чан Кайши снижается"
 CHI_chiang_under_house_arrest_var:0 "§RМнение Чан Кайши§!: [?CHI_chiang_under_house_arrest_var]"
 CHI_chiang_under_house_arrest_var_increases_10_tt:0 "Увеличивает мнение Чан Кайши на §Y10§!."
 CHI_chiang_under_house_arrest_var_increases_5_tt:0 "Увеличивает мнение Чан Кайши на §Y5§!."
 CHI_chiang_under_house_arrest_var_decreases_10_tt:0 "Уменьшает мнение Чан Кайши на §Y10§!."
 CHI_chiang_under_house_arrest_var_decreases_5_tt:0 "Уменьшает мнение Чан Кайши на §Y5§!."
 CHI_chiang_opinion_50_or_civil_war_tt:0 "Если мнение Чан Кайши не §R50§! или выше, §Rможет начаться гражданская война§!."
 CHI_chiang_opinion_greater_than_50_flag:0 "Мнение Чан Кайши должно быть §R50§! или выше"
 CHI_end_war_peace_treaty:0 "Текущие мирные переговоры"
 CHI_end_war_peace_treaty_desc:0 "Наконец, они приняли нашу просьбу о мире. Мы должны использовать все дипломатические возможности, чтобы понести минимальный ущерб от этого договора."
 CHI_peace_treaty_coming:0 "Текущие мирные переговоры"
 CHI_peace_treaty_coming_desc:0 "Наконец, они приняли нашу просьбу о мире. Мы должны использовать все дипломатические возможности, чтобы понести минимальный ущерб от этого договора."
 CHI_collapse_decisions:0 "Крайняя степень"
 CHI_collapse_decisions_desc:0 "По всей стране начались беспорядки, и мы потеряли контроль. Нам больше нечего делать."
 CHI_collapse_coming:0 "Крайняя степень"
 CHI_collapse_coming_desc:0 "По всей стране начались беспорядки, и мы потеряли контроль. Нам больше нечего делать."
 CHI_expand_industrial_capabilities:0 "Расширение промышленных мощностей"
 CHI_expand_industrial_capabilities_desc:0 "Экономический потенциал обширных земель в собственно Китае долгое время игнорировался правительством. Последние технологические и экономические достижения дают нам уникальную возможность укрепить промышленную мощь нашей страны и ослабить последствия экономической стагнации последних лет."