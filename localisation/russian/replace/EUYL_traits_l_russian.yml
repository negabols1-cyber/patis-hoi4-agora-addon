 trait_CHL_fascist_sympathies: "Фашистский симпатизатор"
 trait_CHL_fascist_sympathies_desc: "Этот лидер сочувствует фашистскому движению и будет поддерживать Nacistas в случае внутреннего конфликта."
 trait_CHL_communist_sympathies: "Коммунистический симпатизатор"
 trait_CHL_communist_sympathies_desc: "Этот лидер сочувствует коммунистическому движению и будет поддерживать коммунистов в случае внутреннего конфликта."
 trait_CHL_loyalists: "Лоялист"
 trait_CHL_loyalists_desc: "Этот лидер лоялен нынешнему демократическому правительству и будет поддерживать чилийскую демократию в случае гражданской войны."
 trait_BRA_communist_loyalty: "Коммунистический симпатизатор"
 trait_BRA_communist_loyalty_desc: "Этот общий сочувствует коммунистическому движению в стране и, вероятно, поддержат их в случае гражданской войны."
 trait_BRA_democratic_loyalty: "Демократический лоялист"
 trait_BRA_democratic_loyalty_desc: "Этот генерал является лояльным к демократическому движению в стране и будет поддерживать демократию в случае гражданской войны, или, если внедрено фашистское правительство."
 trait_BRA_imperial_loyalty: "Имперский лоялист"
 trait_BRA_imperial_loyalty_desc: "Этот генерал является верным бразильской королевской семье и будет поддерживать их в случае восстания или гражданской войны."
 trait_BRA_integralist_loyalty: "Интегральный симпатизатор"
 trait_BRA_integralist_loyalty_desc: "Этот генерал сочувствует интегралистскому движению в стране и присоединится к их стороне в случае гражданской войны."
 trait_BRA_vargas_loyalty: "Лояльный к Варгасу"
 trait_BRA_vargas_loyalty_desc: "Этот генерал является лояльным к нынешней администрации Варгаса и сделает все, что будет в своей власти, чтобы защитить эстадо Ново."
 trait_PRU_urrista: "Урриста"
 trait_PRU_urrista_desc: "Урристы лояльны к фашистскому режиму, и в случае коммунистического поглощения страны Урристас уйдет с военных."
