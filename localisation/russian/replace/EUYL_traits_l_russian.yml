 POLITICS_SUN_GOD_DESC: "Inti - это древний бог Sun Incan. Его уважают как национальный покровитель штата инков. Хотя большинство считают Inti The Sun God, он более подходящим образом рассматривается как кластер солнечных аспектов, поскольку инки разделили его идентичность в соответствии с этапами Солнца. Поклоняясь как божество покровителя империи инков, Пачакути часто связан с происхождением и расширением культа инков. Самая распространенная история говорит о том, что он сын Виракочи, бога цивилизации. \ n \ n the Word Inti является согласно лингвисту Родольфо Церрон-Паломино не из кечуа, а заимствованное слово от языка Puquina. Заимствование из языка пукины объясняет, почему генетически не связанные языки, такие как кечуа, аймара и мапуче, имеют похожие слова для Солнца. Спимоализации являются не только лингвистическими, но и символически, как у Мапуч и Центральной Андской космологии Солнце (Инти/Анту), а Луна (Quilla/Cuyen) - супруги."
