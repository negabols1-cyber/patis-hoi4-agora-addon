 oposicion_politica_col_desc: "Суровая политическая напряженность не только в социальном отношении разделяла Колумбия, но и органически. С одной стороны, есть [GetLiberalName] и [GetConservativeName], традиционные стороны, которые соперничают за власть и часто упрекают друг друга. С другой стороны, есть [GetMilitaryName], руководство которого состоит из политизированных лидеров, которые могут быть недовольны администрированием сторон. \ n \ neach Group постоянно увеличивает свою §Y -преобразовательную влияние §!, что может вызвать гражданскую войну в случае достижения §R100§!. \ n \ n[GetRuilingLeader] \ n[GetConservativeValues] [GetLiberalValues] [GetMilitaryValues]"
