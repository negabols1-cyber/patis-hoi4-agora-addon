 EUYL_1936_status_quo: "1936 Статус -кво"
 EUYL_1936_status_quo_desc: "Статус -кво 1936 года был согласован как Перу, так и Эквадор после вмешательства из Вашингтона. Однако этот временный мир очень хрупкий, так как обе стороны приносят значительные обиды против другой, и война просто неизбежна между ними."
 EUYL_tension_will_increase_tt: "§Rborder напряжение §! будет"
 EUYL_peru_ecuador_rising_tensions: "Растущая напряженность Перу-экодора"
 EUYL_peru_ecuador_rising_tensions_desc: "Перу и Эквадор имели проблемную историю между ними. Неразрешенные границы в регионе пастаза оказались в нескольких кровавых конфликтах, не ведущих, и теперь не отличается. Были предприняты усилия, чтобы натянуть напряженность с предложенной линией статус -кво, и, хотя она была согласована, нет никаких сомнений в том, что это не продлится. Время покажет, как эта ситуация решается, но пока она не выглядит красиво."
