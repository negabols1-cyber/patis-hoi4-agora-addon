 form_rioplatense_empire_category: "Реализуйте амбиции риоплатенса"
 form_rioplatense_empire_category_desc: "С волей, чтобы полностью объединить всех людей риоплатенса под одной страной, мы это сделаем и сделаем это. Все риоплатенсии должны быть объединены, и мы будем бороться с любой угрозой вместе."
 form_rioplatense_empire: "Сформировать империю риоплатенса"
  
  
 form_natural_borders: "Наши естественные границы"
 form_natural_borders_desc: "На протяжении всей нашей истории наши соседи злоупотребляли нашим довольно центральным положением в Южной Америке, а немного по -чуть взяли кусочки наших земель, но это больше не будет длиться, потому что они увидят нашу истинную силу, и они будут сжиматься в страхе, когда мы достигнем нашего истинного потенциала!"
