 ARG_march_in_the_province_of_FROM: "Март в провинции [FROM.GetName]"
 ARG_all_states_were_dealt_with_tt: "Военные были рассмотрены в провинциях §Ytierra del Fuego, Santa Cruz, Chubut, Neuquen и Rio Negro§! \ n \ n§Rfailure в решении всех 5 провинций все еще приведут к гражданской войне с военными военными."
 ARG_states_military_have_influence_over_tt: "Это те провинции, которые военные контролируют"
 ARG_unlock_march_decisions_tt: "Разблокирует §Yshut вниз по решению Coup§!, которое позволит вам §gstop§! Переворот и §gavoid§! a §Rcivil War§! при работе с каждой провинцией военные контроли."
 ARG_fm_is_a_monopoly_tt: "§Yfabricaciones Militares§! получил монопольный статус над нашим военным производством."
 PRU_coup_attempt_fascists: "Потенциальная попытка переворота"
 PRU_coup_attempt_fascists_desc: "После публичного смущения, которое произошло от отмены выборов, многие фашисты среди населения решили подняться и восстать против отмены, занимая некоторые провинции в стране. Их намерения ясны, чтобы свергнуть нынешнее правительство через гражданскую войну. Нам нужно сделать как можно больше, чтобы убедиться, что этого не произойдет!"
 PRU_states_fascists_have_influence_over_tt: "Это провинции, которые §YFascists§! контроль!"
 PRU_the_coup_attempt: "Попытка переворота"
 PRU_stop_the_coup: "Прекратите переворот"
