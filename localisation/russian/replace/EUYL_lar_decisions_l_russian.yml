 VEN_democratic_revolution: "Демократическая революция"
 VEN_democratic_revolution_desc: "Еще в 1901 году Венесуэла прошла через так называемое как революционер Либертадора, революция, направленная против тогдашнего президента Чиприано Кастро. Эта революция провалилась, что привело к тому, что Enxt 3 десятилетия возглавляли диктатор Хуан Висенте Гомес. Неудивительно, что такое поражение оставило либеральное население разочарованным и разочарованным, стремясь наброситься на возможность того, что другой президент не управляет страной должным образом. Неспособность контролировать нашу страну, и вполне может произойти вторая революция."
