 ARG_POLITICAL_TENSION_TOOLTIP: "§YPolitygy Tension§! представляет собой текущую напряженность в политической сфере Аргентины, охватывающей проблемы, протесты, политические проблемы и многое другое. Будьте очень осторожны с этим, потому что, если вы позволите напряжению стать слишком высоким, §Ymilitary§! может §RIntervene§!. \ nalso, пожалуйста, имейте в виду, что чем выше §Yполитическое напряжение §!."
 ARG_CORRUPTION_TOOLTIP: "§YDegree of Corruption§! - это мера того, насколько коррумпирована ваша нация. Чем §YHIGHER§!, тем больше §YCorrupt§! ваша страна, и наоборот. Степень коррупции варьируется между §G1§! и §R8§!. \ n \ n§Ycorruption§! также может быть либо §Gin вашей услуги, либо §Ragainst ou§!. Любой вариант будет иметь свои преимущества и недостатки, поэтому будьте осторожны с выбранным вами вариантом."
