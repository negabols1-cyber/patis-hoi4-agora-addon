 PRU_cooperating_with_the_church: "Сотрудничать с церковью"
 PRU_cooperating_with_the_church_desc: "Христианство и религия в целом всегда были очень влиятельны в истории и культуре перуанской. Принесение первоначальных конкистадоров столетия назад, влияние христианства все еще очень сильное в стране, и Церковь обладает значительной властью в стране. Мы можем использовать эту силу в нашу собственную пользу и согласиться сотрудничать с церковью."
