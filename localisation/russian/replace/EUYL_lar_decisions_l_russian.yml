 VEN_abrupt_government_transition_desc: "Хуан Висенте Гомес, предыдущий правитель и диктатор Венесуэлы, скончался всего несколько дней назад, и на своем месте Элеазар Лопес Контрерас принял власть. Висенте был диктатором Венесуэлы более 3 десятилетий, и теперь, когда внезапно переключался в лидере и правительстве, люди очень не уверены в стабильности своей страны, и многие не доверяют новому правителю. [ROOT.GetLeader] должен будет доказать себя, чтобы иметь возможность должным образом управлять страной и провести необходимые реформы, чтобы продвинуть эту страну вперед!"
 VEN_dependent_on_oil_extraction: "В зависимости от добычи нефти"
 VEN_dependent_on_oil_extraction_desc: "В отличие от экономики наших соседних стран в Латинской Америке, мы смогли быстро и эффективно справиться с Великой депрессией. Тем не менее, это стоило более зависящего от нашего производства нефти, что не позволило другим секторам отрасли развиваться."
 VEN_underground_communist_movement: "Подземное коммунистическое движение"
 VEN_underground_communist_movement_desc: "В соответствии с последней реформацией супругов, коммунистические и анархистские партии считаются «против независимости этой страны» и, следовательно, являются незаконными. Благодаря этому многие коммунистические боевики и сторонники начали работать под землей, под глазами правительства. Мы должны опасаться их действий и попытаться помешать им попробовать все, что может дестабилизировать страну."
 VEN_possibility_of_worker_strikes_occuring_tt: "§Rworker Strikes§! из различных секторов §yindustry§! может происходить случайным образом, если этот национальный дух активен!"
 VEN_german_infleunce_in_venezuela: "Немецкое влияние в Венесуэле"
 VEN_german_infleunce_in_venezuela_desc: "С 1933 года подземные нацисты присутствовали в Венесуэле, пытаясь увеличить влияние Германии в стране и обеспечить торговлю нефтью с нами."
 VEN_america_and_allied_nations_will_become_concerned_tt: "\ n§R0 -й этот национальный дух слишком долго приведет к тому, что Соединенные Штаты и другие союзные полномочия вырастут обеспокоенность по поводу потенциальной мощности оси, угрожающей их нефти, и может усилить вооруженное вмешательство, если не обрабатываться должным образом! §!"
 VEN_fascist_nations_will_become_concerned_tt: "\ n§R0 -й этот национальный дух слишком долго заставит основные фашистские полномочия вырастут озабоченность по поводу их торговли нефти и может усилить вооруженное вмешательство, если не обрабатываться должным образом! §! ""
