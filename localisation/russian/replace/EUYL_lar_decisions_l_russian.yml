 VEN_gloria_al_bravo_pueblo_cat_desc: "Слава народу Венесуэлы, которые долго и усердно боролись за поддержание и развитие страны, которую мы имеем сейчас. Мы не можем разогнать наших людей, и мы должны делать все возможное, чтобы стабилизировать нашу внутреннюю политику и адекватно управлять страной, чтобы мы могли иметь еще более сильную и более процветающую страну!"
