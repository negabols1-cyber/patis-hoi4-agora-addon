 ARG_infamous_decade_idea: "Бесславное десятилетие"
 ARG_infamous_decade_tt: "§Lour Великая нация поглощается жадностью, страхом и неопределенностью. Каждый день наши люди все менее и менее уверены в своем правительстве, и страх перед другим переворотом присутствует в умах всех. Эта неопределенность заключается в деморализации людей и дестабилизации страны в целом. Эта ситуация должна быть исправлена, если мы хотим стремиться вперед.§! \ n \ n"
 ARG_corruption_scandal_idea: "Коррупционный скандал"
 ARG_corruption_tt: "§L. Пока никто не хочет признать это, правда в том, что наша страна пронизана коррупцией. От рабочих до элиты, коррупция и Аргентина идут рука об руку. Несмотря на то, что некоторые из наших политиков есть сомнения в том, что они потенциально коррумпированы, указание пальцев только вызовет проблемы. Если мы хотим решить эту проблему, нам придется сделать это спокойно и со временем. §! \ n \ n"
