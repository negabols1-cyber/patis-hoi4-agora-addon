 HON_american_owned_industry: "Американская индустрия"
 HON_american_owned_industry_desc: "Американские компании контролируют нашу экономику уже много лет, с тех пор, как было обнаружено «культивируемое золото», как они ее называют. Несмотря на то, что это принесло пользу нашей экономике изначально, со временем это привело к тому, что наша экономика является просто продолжением [USA.GetAdjective], будучи зависимым и исключительно полагающим от нее. Наша отрасль не может функционировать без этих компаний, что может привести к разрушительным экономическим последствиям, если мы будем держать это в курсе. Несмотря на это, было бы также наносит ущерб, чтобы выбрать компании из -за нашей зависимости от них. Это сложная ситуация."
