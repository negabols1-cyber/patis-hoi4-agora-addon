 ARG_infamous_decade_cat: "Печально известное десятилетие"
 ARG_infamous_decade_cat_desc: "Нынешний политический ландшафт - это беспорядок в Аргентине. С тех пор, как жестокий переворот в 1930 году, который сверг Хиполито Йригоюен, Аргентина спирала вниз. Люди взволнованы, и военные очень внимательно следят за каждым нашим шагом. Одна маленькая ошибка, и это может означать еще одно военное поглощение. \ n \ nstatus £ucr_a_texticon §YUCRA§! IS: [ROOT.GetPartyOpinionUCRA] \ nstatus £ucr_texticon §YUCR§! IS: [ROOT.GetPartyOpinionUCR] \ nstatus of £partido_socialista_texticon §YPS§! IS: [ROOT.GetPartyOpinionPS] \ nstatus £col_militar §YUCRA§0! есть: §YUCRA§1"
