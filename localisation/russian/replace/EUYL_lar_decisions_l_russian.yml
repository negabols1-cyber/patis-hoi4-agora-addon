 ECU_gallos_looming_coup: "Долитый переворот Галло"
 ECU_gallos_looming_coup_desc: "Несмотря на то, что он не был президентом, [ROOT.GetLeader] показал нам, что он не является надежным лидером Эквадора и может представлять проблемы, когда мы рассматриваем его дружеские условия с фашистскими державами. Благодаря этому и общему национальному неумелому управлению военные решают вмешаться и поместить §Yalberto enriquez Gallo§!, чтобы убедиться, что Паес не достигнет своего пути и получает еще 4 года президента."
 ECU_pro_conservative_navy: "Проконсервативный флот"
 ECU_pro_conservative_navy_desc: "Многие сектора эквадорского военно -морского флота остаются верными консерваторам, слухи о либеральных преследованиях происходят так часто во флоте. Благодаря этому либералы рассматривают это как угрозу своей партии и будут протестовать в случае правительства, навязывающего консерваторам."
