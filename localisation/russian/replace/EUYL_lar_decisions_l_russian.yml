 COL_incidente_en_el_canal: "Вызвать инцидент на канале"
 COL_incidente_en_el_canal_desc: "Беспрецедентно, что Соединенные Штаты забрали что -то, что является нашим правым. Панамский канал не может оставаться в их руках, и даже если кровь будет пролита, это снова будет нашим ... хотя мы должны сначала убедиться, что у нас достаточно сильных подразделений на границе."
