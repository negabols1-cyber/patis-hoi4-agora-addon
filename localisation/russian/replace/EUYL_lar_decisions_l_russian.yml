 ROOT_the_second_war_of_the_pacific_desc: "Наш континент снова попал в хаос и на войну. Многие зрители из внешнего мира уже классифицируют этот конфликт как самая кровавая, когда -либо видела самая кровавая Южная Америка. Наши враги должны быть быстро снесены, если мы не хотим, чтобы этот конфликт продлялся гораздо дольше и живет впустую. Все наши усилия пойдут на этот конфликт, даже если это означает, что мы можем временно голодать из нашей собственной нации. Это будет для большего блага людей!"
