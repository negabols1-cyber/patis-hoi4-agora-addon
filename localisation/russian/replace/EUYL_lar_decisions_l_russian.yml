l_russian:
 EUYL_disband_militia_regiments: "Расборные полки ополченцев"
 ARG_the_argentine_civil_war: "Гражданская война аргентинца"
 ARG_the_argentine_civil_war_desc: "С гражданской войной в полном разгаре, мы должны использовать нашу поддержку военных в наших интересах, давая нам временные повышения в нашей атаке, обороне, организации и скорости. Очень жаль, что наша страна должна пройти через такой позор, но необходимо продвинуть эту страну вперед."
 ARG_purchase_FROM_weapons: "Покупка [FROM.GetAdjective] Оружие"
 ARG_division_movement: "Улучшить скорость движения деления"
 ARG_division_organization: "Улучшить организацию подразделения"
 ARG_division_attack: "Улучшить атаку дивизии"
 ARG_division_defense: "Улучшить защиту подразделения"
 ARG_robertos_renounce: "Неизбежная отставка Роберто"
 ARG_robertos_renounce_desc: "Состояние здоровья Роберто со временем ухудшится, в какой -то момент это будет настолько плохо, что президент больше не сможет должным образом руководить нацией, и придется уйти в отставку."
 ARG_give_proper_treatment: "Дайте Роберто правильное лечение"
 ARG_give_proper_treatment_desc: "Предоставление Роберто надлежащему лечению купит нам время и позволит ему дольше продолжаться в офисе."
 ARG_pay_for_better_doctors: "Платить за лучших врачей"
 ARG_pay_for_better_doctors_desc: "Оплата за лучших врачей немного улучшит его состояние и позволит ему продолжаться дольше."
 ARG_give_proper_medicine: "Дайте Роберто правильное лекарство"
 ARG_give_proper_medicine_desc: "Предоставление Роберто надлежащее лекарство купит нам много времени и позволит ему продолжаться дольше."
 ARG_allow_roberto_to_rest: "Позвольте Роберто отдохнуть"
 ARG_allow_roberto_to_rest_desc: "Позволяя Роберто отдохнуть от непосредственного возглавления страны, купит нам огромное количество времени за счет того, что он на данный момент не имеет надлежащего центрального лидера."
 ARG_convince_roberto_to_work_harder: "Убедить Роберто работать усерднее"
 ARG_convince_roberto_to_work_harder_desc: "Убедить Роберто работать усерднее, заставит болезнь быстрее прогрессировать и привести к его отставке быстрее."
 ARG_give_him_improper_treatment: "Дайте Роберто ненадлежащее лечение"
 ARG_give_him_improper_treatment_desc: "Предоставление Роберто неправильное лечение приведет к тому, что болезнь будет развиваться быстрее и приведет к его отставке быстрее."
 ARG_fake_his_test_results: "Подделка его результатов теста"
 ARG_fake_his_test_results_desc: "Подделка его результатов испытаний сделает, что его состояние становится лучше, когда на самом деле он делает наоборот."
 ARG_give_roberto_the_wrong_medicine: "Дайте Роберто неверное лекарство"
 ARG_give_roberto_the_wrong_medicine_desc: "Предоставление Роберто неправильное лекарство сильно усугубит его состояние при временных затратах на ухудшенное лидерство, как будто руководство уже недостаточно плохое."
 ARG_peron_left_argentina: "Отъезд Перона в Италию"
 ARG_peron_left_argentina_desc: "Недавно Перон покинул Аргентину под командованием министерства войны для изучения горной войны в итальянских Альпах, многие предполагают, что изучение тактики Италии также может повлиять на идеалы и убеждения Перона, однако это просто предположения."
 ARG_perons_return: "Возвращение Перона в Аргентину"
 ARG_perons_return_desc: "Перон вернется через 2 года. Однако, кажется, маловероятно, что это будет установлено и камень."
 ARG_demand_peron_to_report_back: "Потребовать Перона, чтобы сообщить о своих выводах"
 ARG_the_great_coup: "Великий переворот"
 ARG_the_great_coup_desc: "Фракции в армии недовольны нынешним правительством и планируют организовать переворот против нынешнего лидера, а в большей степени прицелится на Рамон Кастильо."
 ARG_the_coup: "Переворот"
 ARG_the_coup_desc: "Мы устанавливаем переворот, пытаясь убедиться, что Роберто уйдет в отставку, прежде чем мы организуем переворот, иначе люди сердится и, скорее всего, не примут Перон в качестве своего нового лидера."
 ARG_slight_concessions: "Небольшие уступки"
 ARG_moderate_concessions: "Умеренные уступки"
 ARG_large_concessions: "Большие уступки"
 ARG_foreign_investments: "Иностранные инвестиционные возможности"
 ARG_foreign_investments_desc: "Многие великие державы по всему миру открыли для нас свою экономику, чтобы инвестировать. Несмотря на то, что в ближайшем будущем эти инвестиции могут иметь огромные награды."
 ARG_invest_in_FROM: "Инвестировать в экономику [FROM.GetName]"
 invested_in_ARG: "Вы уже инвестировали в экономику этой страны"
 ARG_invest_in_countries_economy_tt: "Мы будем §Ginvest§! В этой стране §Yeconomy§!"
 ARG_debt_repayments: "Варианты погашения долга"
 ARG_debt_repayments_desc: "Сенаторы проголосовали, мы должны погасить наш «долг». Независимо от того, действительно ли мы обязаны платить или нет, это не проблема. Мы должны погасить долг, который мы в настоящее время имеем, за несколько групп людей в нашей стране. Мы могли бы даже получить бонус за соблюдение их."
 ARG_repay_our_debt_to_the_senators: "Погасить долг сенаторам"
 ARG_repay_our_debt_to_the_deputies: "Погасить долг для депутатов"
 ARG_repay_debt_to_the_chamber_of_deputies: "Погасить долг в палату депутатов"
 ARG_repay_debt_to_the_employees: "Погасить долг сотрудникам"
 ARG_repay_debt_to_war_ministry_officials: "Погасить долг для чиновников министерства войны"
 ARG_ramon_military_coup: "Военный заговор?"
 ARG_ramon_military_coup_desc: "Секторы военных были недоволены преемником [Root.GetLeader] и планируют полностью свергнуть правительство. Кажется, они готовы использовать грубую силу, если вынуждены."
 ARG_the_possible_coup: "Возможный переворот"
 ARG_five_year_plan: "Пятилетний план"
 ARG_five_year_plan_desc: "С полной защитой наша позиция, мы должны сосредоточиться на экономике и убедиться, что она достигает уровня, который будет считаться удовлетворительным. Страны вокруг нас быстро индустриляются, и мы не можем отставать."
 ARG_invest_in_the_civilian_economy: "Инвестировать в гражданскую экономику"
 ARG_invest_in_the_military: "Инвестировать в военные"
 ARG_nationalize_the_road_industry: "Национализировать дорожную индустрию"
 ARG_nationalize_the_steel_mines: "Национализировать стальные шахты"
 ARG_nationalize_the_tungsten_mines: "Национализировать вольфрамовые шахты"
 ARG_nationalize_the_oil_fields: "Национализировать нефтяные месторождения"
 ARG_integrate_our_territories: "Интеграция наших территорий"
 ARG_integrate_our_territories_desc: "Благодаря нашему резкому расширению во всех уголках Южной Америки, жители этих стран далеки от того, чтобы довольны нашим правительством над ними. Нам нужно подчинить их и интегрировать их в нашу нацию, даже если это означает потерю наших людей и нашу политическую власть. \ n \ n§R0, вы можете только основные состояния, которые соседят ваши основные состояния! §!"
 develop_catamarca_iron_ore_deposits: "Разработать отложения Catamarca Iron Fre"
 exploit_the_rio_negro_oil_field: "Эксплуатировать нефтяное месторождение в Рио"
 develop_cordoba_aluminium_deposits: "Разработать алюминиевые отложения Cordoba"
 develop_chaco_tungsten_deposits: "Разработать месторождение вольфрама Чако"
 develop_buenos_aires_chromium_deposits: "Разработать отложения хрома Buenos Aires"
 develop_neuquen_rubber_plantations: "Разработать резиновые плантации Neuquen"
 develop_misiones_steel_deposits: "Разработать мизионные стальные отложения"
 drill_the_chubut_oil_field: "Просверлить чубат"
 develop_arica_chromium_mines: "Разработать мины арики хрома"
 develop_antofagasta_steel_deposits: "Разработать стальные отложения Antofagasta"
 develop_magallanes_aluminium_deposits: "Разработать алюминиевые отложения Magallanes"
 ARG_inflation: "Борьба с инфляцией"
 ARG_inflation_desc: "Аргентина имела такую ​​долгую историю с инфляцией, что они почти синонимичны. Нам нужно как можно быстрее и эффективно остановить нашу инфляцию, иначе наша страна буквально потерпела крах на себя. Инфляция очень непредсказуема, и мы должны следить за этим, поэтому любая неудача или проблема, с которой мы можем столкнуться, нам необходимо эффективно справиться с этим. У нас есть различные способы борьбы с инфляцией, и нам потребуется использовать каждый, чтобы избавиться от этого позора."
 ARG_inflationary_crisis: "Инфляционный кризис"
 ARG_inflationary_crisis_desc: "Деликатная ситуация нашей валюты приводит к тому, что ее значение постоянно падает с течением времени. Это может быть несколько предотвращено, приняв различные меры, чтобы бороться с инфляцией и остановить ее на его следах. Удачи, это может понадобиться."
 ARG_emit_pesos_to_control_inflation: "Установить контроль заработной платы и цены"
 ARG_emit_pesos_to_control_inflation_desc: "Если мы хотим убедиться, что наша инфляция не выходит из -под контроля, мы должны реализовать контроль заработной платы и цены. Благодаря социалистическому характеру такого акта, Коммунистическая партия получит власть от этого."
 ARG_employ_a_contractionary_monetary_policy: "Используйте снисходительную денежно -кредитную политику"
 ARG_employ_a_contractionary_monetary_policy_desc: "Немного дороже, чем контроль за заработной платой и цены, но дает нам такой же эффект и отрицает коммунистов от получения власти."
 ARG_force_companies_to_lower_prices: "Заставлять компании снижать потребительские цены"
 ARG_force_companies_to_lower_prices_desc: "Наш самый дорогой вариант, но также и наш самый эффективный, значительно сокращая нашу инфляцию после прохождения курса."
 ARG_temporarily_slow_down_the_inflation: "Временно замедлить инфляцию"
 ARG_temporarily_slow_down_the_inflation_desc: "С несколькими уловками в нашем рукаве, мы можем временно остановить инфляционный кризис от возникновения. К сожалению, это не бесконечно."
 ARG_end_the_inflation: "Положить конец инфляции"
 ARG_end_the_inflation_desc: "После многих реформ мы теперь можем официально положить последний гвоздь в гроб и создать стабильную валюту."
 ARG_mobilize_elite_militia_in_FROM: "Мобилизовать элитную милицию в [FROM.GetName]"
 ARG_integration_of_the_falklands: "Интеграция Falklands"
 ARG_integration_of_the_falklands_desc: "Непосредственная близость Фолклендских островов к нашему материку, а также утверждение, что у нас было более 100 лет, и всегда будет неотъемлемой частью Аргентины. Британцы в конечном итоге будут вынуждены от островов, и именно мы сделаем такой подвиг, если они не захотят сотрудничать и передавать нас через острова, и в этом случае мы с радостью примем. В случае любого происходящих событий Фолкленды должны быть полностью интегрированы в нашу территорию и по -настоящему считаются аргентинцами!"
 ARG_integrate_the_falklands: "Интегрировать Фолклендс"
 ARG_integrate_the_falklands_desc: "Теперь, когда Фолкленды наконец -то находятся под нашим контролем, мы можем хорошо и по -настоящему «аргентин»."
 ARG_integrating_territories: "Интегрируйте провинцию [FROM.GetName]"
 ARG_elections_called_off_tt: "§Y1937 выборы §! будут"
 ARG_pressure_the_parties_for_faster_elections: "Давление на стороны на более быстрые выборы"
 ARG_coup_will_be_shut_down_tt: "§YMilitary§! будет §Gshut Down§!, а переворот будет §GCancell§!"
 ARG_state_will_be_dealt_with_tt: "§YMilitary§! В этом состоянии будет §Gshut down§!"
