 URG_finish_renovations: "Закончить ремонт"
 URG_work_with_the_PCU: "Уступки PCU"
 URG_work_with_the_PCU_desc: "У Эмилио Фригони много истории с PCU. Бывшая часть Социалисты Partido, партия разделилась на двух после октябрьской революции в Советском Союзе, поскольку позиция Фроугони всегда была одной из мирного реформизма и против кровавых революций, с которыми большинство его бывших членов партии не согласились. Это большинство хотело, чтобы БП присоединился к недавно сформированному коммунистическому интернационалу и помогли освободить работников. Все это привело к разделению вечеринки в 1920 году, когда Фрерони и его последователи выгнали из новой Partido Comunista. Несмотря на все это, обе стороны имеют в виду аналогичную цель, и с недавним политическим кризисом в Уругвае после кровавого свержения Габриэля Терры, Фрэрони может наступить уступки коммунистам, чтобы создать коалицию, чтобы стабилизировать свою каменистую должность в качестве президента."
 URG_undermine_berres: "Подрыв президента Берреса"
 URG_undermine_berres_desc: "Несмотря на то, что поддержка Batlle Berres поддерживает как внутри, так и за пределами партии только в течение некоторого времени, продолжает расти, что делает его политических противников параноидами. \ n \ nwhewow, один из его политических противников, Андрес Мартинес Труба, видит возможность получить власть для себя, навязывая других противников против себя и позаботиться."
 URG_support_berres: "Поддержка президента Берреса"
 URG_support_berres_desc: "Недавно добившись необычайных выборов, Батлле Беррес уже произвел довольно хорошее впечатление как масс, так и членов его партии, даже создавая свой собственный политический ток, основанный нагромообразование, называемое необатлизмом. Несмотря на все это, несмотря на все это, все еще существуют политики, стремящиеся усложнять его президентство, чувствуя угрозу от его растущей власти и поддержки. Тем не менее, благодаря его связям как внутри, так и за пределами партии, Бэтлле узнал о ситуации, и все, что осталось, - это предпринять меры против своих противников."
 URG_extraordinary_elections_tt: "Мы проведем выборы в §Y30§! Дни \ n \ n"
 URG_consequences_tt: "§R Может быть неожиданные последствия после принятия этого решения! §!"
  
  
