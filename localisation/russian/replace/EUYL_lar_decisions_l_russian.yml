 ARG_corruption_scandal_showcase_idea_desc: "Хотя никто не хочет признать это, правда в том, что наша страна пронизана коррупцией. От рабочих до элиты, коррупция и Аргентина идут рука об руку. Несмотря на то, что некоторые из наших политиков есть сомнения в том, что они потенциально коррумпированы, указание пальцев только вызовет проблемы. Если мы хотим решить эту проблему, нам придется делать это спокойно и со временем. §!"
