 BRA_economic_recession: "Экономический спад"
 BRA_economic_recession_desc: "Наша неспособность должным образом индустриализовать приводила к тому, что многие остались на работе, и из -за этой волны безработицы наша экономика резко упала. Потребуется время, чтобы исцелить нашу экономику, и пришло время сосредоточиться на других частях нашей страны."
 BRA_economic_management: "Экономическое управление"
 BRA_economic_management_desc: "Бразильская экономика является одной из крупнейших во всей Латинской Америке, поэтому не удивительно, что это будет ходить соответствующим образом. Мы должны быть очень осторожны с решениями, которые мы принимаем, и мы также должны устать от индустриализации нашей экономики, поскольку мы проводим быстрые реформы, которые обязывают нас, чтобы подтолкнуть нашу экономику к индустриальному ориентированию."
