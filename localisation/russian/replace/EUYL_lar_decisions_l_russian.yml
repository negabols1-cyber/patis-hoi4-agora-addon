 ARG_1937_elections: "Выборы 1937 года"
 ARG_1937_elections_desc: "Наша политическая суматоха еще не утихла и, скорее всего, не уйдет в течение очень долгого времени. Нагревается напряженность между сторонами, а политический спектр в целом медленно, но верно становится ужасным. Все, что мы можем сделать, это надеяться, что это не получится кроваво, и все будет решено мирно. §!0§!1Partido socialista§!: §!3 \ n \ n§R Победитель будет определяться на основе §! §YElectoral Voals§!§R. Партия с самыми избирательными голосами победит на выборах, игнорируя популярность указанной партии.§!"
