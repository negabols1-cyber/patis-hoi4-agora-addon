 PRU_coup_will_be_shut_down_tt: "§YFascists§! будет §GStopped§! и §Rcivil War§! будет §gprevented§!"
 PRU_fascists_take_over_states_tt: "§YFascists§! Вернутся на провинции §Yloreto, ancash, piura и yaguas§! и начните подготовку к §Rcivil War§!"
