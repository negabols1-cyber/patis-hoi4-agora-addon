 PRU_impending_navy_rebellion_desc: "Секторы нашего флота планируют переворот против нашего правительства, потому что мы дали армии слишком много власти. Они требуют, чтобы мы уменьшили власть, предоставленную армии, иначе будут серьезные последствия."
