 ARG_infamous_decade_showcase_idea_desc: "Наша великая нация поглощается жадностью, страхом и неопределенностью. Каждый день наши люди все менее и менее уверены в своем правительстве, и страх перед другим переворотом присутствует в умах всех. Эта неопределенность заключается в деморализации людей и дестабилизации страны в целом. Эта ситуация должна быть исправлена, если мы хотим стремиться вперед.§!"
