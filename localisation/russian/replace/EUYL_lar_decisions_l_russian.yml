  ## ECUADOR ## 
 ECU_la_gloriosa: "La Gloriosa"
 ECU_la_gloriosa_desc: "Несмотря на его довольно короткое президентство, удар, оказавший Веласко на эквадорцы, было не чем иным, как безумным. В случае несчастья, происходящего в стране, почти наверняка, что Velasco воспользуется этой возможностью и попытается принять власть через Coup D'Etat или полномасштабную революцию!"
 ECU_if_stability_or_lose_war_with_peru_tt: "\ n§RIf§! §YStability§! §Rdrops ниже 10% или вы проигрываете войну до §Y[PRU.GetName]§! §R, Velasco потребует контроля над нацией!"
 ECU_siding_too_much_with_liberals_will_cause_conservative_insurrection_tt: "\ n§Rsiding слишком много с помощью §! £ECU_liberal_texticon §yliberals§! §Rwill приведено к a§! £ECU_conservative_texticon §yconservative§! §Rinsurrection! a £ECU_liberal_texticon §yliberal§! §Rinsurrection! §!"
 ECU_aftermath_of_4_day_civil_war: "Последствия 4 -дневной гражданской войны"
 ECU_aftermath_of_4_day_civil_war_desc: "После внезапной отставки Исидро Айоры выборы были вызваны на месте, чтобы выбрать следующего лидера как можно скорее. Выборы были проведены в 1932 году, а Нептали Бонафиз выиграл. Эта победа, однако, стала нулевой после того, как эквадорский конгресс не позволил ему принять власть из -за его перуанских корней. Из-за этого про-консервативные ополченцы взяли оружие в столице и боролись, чтобы протестовать против профилактики его президентства. Либералы отреагировали на огонь огнем, и что привело к кровавой гражданской войне, в которой претендовали жизнь более чем 2000 года. Несмотря на то, что с тех пор проходило почти 4 года, кровавые события все еще живут в сознаниях обеих сторон, и в стороне от обеих сторон слишком много приведет к последствиям."
 ECU_rural_state: "Сельское государство"
 ECU_rural_state_desc: "Это состояние в основном состоит из сельского населения, и очень мало эквадорцев, живущих в урбанизированной среде."
 ECU_economic_reignition: "Экономическое правление"
 ECU_economic_reignition_desc: "Эквадорская экономика сильно повлияла на Великую депрессию, в частности, в пяти различных макро-разнообразных: внешнюю торговлю, государственные доходы, запасы золота, инфляция и ВВП. Из -за отклонения золотого стандарта, навязанного миссией Кеммерера, экономика эквадора пострадала от нестабильности и неважности. Это также не помогает, что большинство эквадорцев живут в сельской местности, что приводит к трудностям с индустриализацией."
 ECU_economic_reignition_cat: "Возрождение экономики"
 ECU_economic_reignition_cat_desc: "Эквадорская экономика в последнее время боролась, особенно из -за Великой депрессии и отказа от золотого стандарта. Для возрождения экономики необходимо провести различные изменения!"
 ECU_liberal_conservative_conflict: "Либерально-консервативный конфликт"
 ECU_liberal_conservative_conflict_desc: "Эквадорская политика всегда определялась жестким перетягиванием войны между либералами и консерваторами. Этот раскол был ухудшен только после 4 -дневной гражданской войны в 1932 году, что привело к £ECU_conservative_texticon §YConservatives§! быть антагонизированным с тех пор. Этот раскол может быть усилен, если мы не будем контролировать стороны, и может произойти восстание, если мы не будем осторожны. \ n \ nour current §YLeader§! представляет [ROOT.GetLeaderParty]"
 ECU_rural_provinces_tt: "§YRural§! Провинции"
 ECU_actively_antagonizing_tt: "§Rактивно антагонизируя §!"
 ECU_significant_resentment_tt: "§Osignificancening Enderment§!"
 ECU_slight_resentment_tt: "§YSlight Enderment§!"
 ECU_neutral_tt: "§gNeutral§!"
 ECU_slight_support_tt: "§7Slight Support§!"
 ECU_significant_support_tt: "§7significancement Support§!"
 ECU_active_cooperation_tt: "§Gактивное сотрудничество §!"
 ECU_CONFLICT_TT: "Эта система представляет наше текущее состояние в направлении £ECU_liberal_texticon §YLiberals§! и £ECU_conservative_texticon §YConservatives§!. Статус может варьироваться от §Ractively -антагонизации §! до §Gактивного сотрудничества §!. §Ycurrent Leader§! также может влиять на это в зависимости от того, какую сторону они представляют. Однако, в конечном счете, они мало что говорят о обращении страны к общей партии. \ n \ nif Существует §Y, согласованная разница в статусе между двумя сторонами или любой стороной, достигает статуса §Ractivesizing §!, эта сторона вызовет §Rinsurrection§!"
