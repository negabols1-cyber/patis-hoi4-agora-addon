 EUYL_prospect_for_resources_desc: "На континенте Южной Америки есть много ресурсов, и мы должны как можно больше использовать его. Эти ресурсы могут быть использованы либо для нашей личной выгоды, либо использовать их для торговли на мировом рынке."
  
  
