 ECU_the_constituent_assembly: "Учредительное собрание"
 ECU_the_constituent_assembly_desc: "Учредительное собрание Эквадора отвечает за обращение с большинством политических ситуаций и решений страны. Если лидер доказан, является причиной для беспокойства по поводу стабильности и суверенитета нации, Ассамблея проголосует за то, чтобы оторвать их и взять на себя ответственность напрямую."
