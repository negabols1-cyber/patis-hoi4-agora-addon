 col_rebelion_rojas_pinilla: "Восстание Рохас Пиниллы"
 col_rebelion_rojas_pinilla_desc: "Нестабильность и институциональный кризис правительства Лауаниста, по -видимому, подтолкнули Колумбию к ее пределам. Оппозиция, возглавляемая Рохасом Пиниллой, набрала опасную силу и достигла точки невозврата. Если мы хотим избежать другой гражданской войны, у нас нет выбора, кроме как поддаваться их требованиям ..."
  
  
 gestionar_bipartidismo_col: "Управлять двухпартийными конфликтами"
 gestionar_bipartidismo_col_tt: "Операция начнется, но успех не гарантируется."
 bipartidismo_10_tt: "\ n§Rif операция не выполняется, вы должны подождать 10 дней, чтобы снова выбрать. §! \ n"
 bipartidismo_20_tt: "\ n§Rif операция не выполняется, вы должны подождать 20 дней, чтобы выбрать еще раз.§! \ n"
 gestionar_bipartidismo_col_desc: "Колумбия пережила давнюю традицию политического насилия между либеральными и консервативными партиями. В течение последних десятилетий страна перенесла особенно жестокий период, оставив население усталым и безнадежным. На этом фоне ясно, что правительство - единственное, что может что -то с этим сделать."
 gestionar_bipartidismo_la: "Интегрировать либеральных политиков в Магдалене"
 gestionar_bipartidismo_la_desc: "Региональная администрация исключила либеральных политиков из позиций, на которые они были избраны. С президентским давлением либералы, наконец, смогут получить работу, которую они заслуживают."
 gestionar_bipartidismo_ant: "Удалить подрывную прессу в Антиокии"
 gestionar_bipartidismo_ant_desc: "Консервативные группы распространяют газеты, которые вызывают насилие в отношении своих политических противников. Пришло время остановить циркуляцию этого типа пресса."
 gestionar_bipartidismo_nar: "Демонтировать консервативную полицию в Нариньо"
 gestionar_bipartidismo_nar_desc: "Консервативные землевладельцы финансируют частные ополченцы, порученные удалением любых признаков либерала из этого района. Эти военизированные военизированные круги должны быть немедленно демонтированы."
 gestionar_bipartidismo_cun: "Устранить фаворитов столицы"
 gestionar_bipartidismo_cun_desc: "Либеральные предприятия в Боготе твердо отказались вести переговоры с консервативными сочувствующими. Мотивируя их, капитал сможет развиваться политически и экономически."
 gestionar_bipartidismo_met: "Защитите лидера либеральных лидеров Meta"
 gestionar_bipartidismo_met_desc: "Либеральные каудильи постоянно подвергаются нападению в мета, а некоторые даже убивают. Мы должны установить небольшую охрану за их защиту."
 gestionar_bipartidismo_caq: "Арестовать консервативных экстремистов Caquetá"
 gestionar_bipartidismo_caq_desc: "Консервативные общества на юге страны вызывают террор среди населения своими угрозами. Понятно, что мы не можем договориться с ними. Свифт и точной операции будет достаточно, чтобы арестовать своих лидеров и преследовать их за их действия."
  
