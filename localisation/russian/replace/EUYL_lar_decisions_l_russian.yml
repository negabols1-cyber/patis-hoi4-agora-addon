 URG_prisoners_of_the_terra_dictatorship: "Терра -диктатура"
 URG_prisoners_of_the_terra_dictatorship_desc: "С тех пор, как Габриэль Терра принял власть в Уругвае, он управлял страной железным кулаком. Шли годы, Терра начала получать много врагов на политических и социальных сценах, до такой степени, что попытки переворота, где он сделал для того, чтобы сбить его с власти. Из -за этого Терра начала арестовать многих политиков, врачей, писателей и даже вице -президента. Деликатная ситуация диктатуры Терры теперь заставляет его арестовать этих людей, потому что, если он этого не сделает, противостоящие стороны поднимутся и сокрушат диктатора. \ n \ nnumber о важных людях, арестованных режимом Терры: [?URG_politicians_arrested|R0] \ n \ n£stability_texticon  §Ystability: §! [?URG_terra_stability|+%]§! \ n \ n£occupation_costs  §Ydaily демократический дрифт: §! [?URG_democracy_from_terra|Y] £stability_texticon 4§Y%§! \ n \ n"
 URG_arrest_politicians: "Арестовать людей, которые кажутся подозрительными"
 URG_set_free_politicians: "Освободить некоторых, которые были арестованы"
 URG_repaying_the_debt_to_britain: "Погашение нашего долга британцам"
 URG_repaying_the_debt_to_britain_desc: "Британцы не были довольны нашим нежеланием заплатить с ними долг, но это изменится, начиная с сегодняшнего дня. Наша индустрия достаточно сильна, теперь мы можем позволить себе погасить ее, плюс она поможет британцам, а не врага. \ n \ ncurrent Процент нашего долга, который мы вернули: [?URG_debt_to_britain|G0]§G%§!"
 URG_small_debt_repayment: "Небольшое долговое погашение"
 URG_medium_debt_repayment: "Погашение среднего долга"
 URG_large_debt_repayment: "Большое долговое погашение"
 URG_dealing_with_the_protestors: "Работа с протестующими"
 URG_dealing_with_the_protestors_desc: "Теперь, когда у нас есть способность управлять нацией железной ручкой, мы можем начать иметь дело с протестующими, которые осмеливаются испортить любую часть нашей страны. Никто не заставил их выйти и насильственно протестовать, и никто не будет защищать их, когда их неизбежная судьба."
 URG_stomp_out_the_loyalists_in_FROM: "Топайте лоялистов в [FROM.GetName]"
 URG_guide_the_companies: "Направляя компании"
 URG_guide_the_companies_desc: "Поскольку мы приватизировали большую часть нашей отрасли, мы больше не можем вмешиваться в промышленное или военное наращивание, по крайней мере, не так эффективно. Что мы можем сделать, так это сказать компаниям или, по крайней мере, направлять их, чтобы делать то, что мы хотим. Многие из наших инвесторов сообщили нам, что этот путь гораздо более эффективен, чем прямое вмешательство правительства, но только время покажет."
 URG_ask_companies_to_invest_slightly_in_the_industry: "Попросите компании немного инвестировать в отрасль"
 URG_ask_companies_to_invest_heavily_in_the_industry: "Попросите компании инвестировать значительные средства в отрасль"
 URG_ask_companies_to_invest_slightly_in_the_military: "Попросите компании немного инвестировать в военные"
 URG_ask_companies_to_invest_heavily_in_the_military: "Попросите компании инвестировать значительные средства в армию"
 URG_ask_companies_to_invest_dockyard_expansion: "Попросите компаний инвестировать в расширение отчитанного двора"
 URG_ask_companies_to_invest_in_the_infrastructure: "Попросите компании инвестировать в инфраструктуру"
 URG_march_to_argentina_capital: "Марш в Буэнос -Айрес"
 URG_march_to_argentina_capital_desc: "Буэнос -Айрес - это сердце страны, это то, что держит народ на плаву. Если мы сможем запечатлеть его за короткое время, то аргентинцы будут Шатерред, а победа будет Гурантидом."
 URG_capture_buenos_aires: "Захват Буэнос -Айрес"
 URG_capture_buenos_aires_desc: "Столица в поле зрения! Одно хорошее оскорбительное, и оно будет под нашим контролем в кратчайшие сроки."
