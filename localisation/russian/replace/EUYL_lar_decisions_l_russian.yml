 VEN_advanced_oil_extraction: "Усовершенствованная добыча нефти"
 VEN_inefficient_oil_extraction_desc_tt: "\ n§L Технология, присутствующая для извлечения нефти в этом состоянии, просто не сокращает ее, чтобы извлечь всю потенциальную нефть в этом состоянии. Поэтому мы ограничены тем, сколько нефти мы можем извлечь и продавать. §!"
 VEN_looming_oil_strike_cat: "Навижающий нефтяной удар"
 VEN_looming_oil_strike_cat_desc: "Нефтяные работники недовольны условиями труда и низкой заработной платой, и их неудовлетворенность, вероятно, превратится в полное недовольство, что приведет к потенциальному удару в будущем. Неспособность придерживаться их требований может в полномасштабной революции, если не обращаться адекватно."
