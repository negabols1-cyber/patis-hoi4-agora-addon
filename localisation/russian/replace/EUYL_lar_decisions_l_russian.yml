 PRU_army_rebellious: "\ n§Rworking с демократическим государством приведет к тому, что оставшиеся фашисты армии восстают против вас, и потребуется некоторое время, чтобы вернуть их под ваш полный контроль. Если вы работали с фашистским государством с армией, то вы получите худшую версию восстанавливающейся армии, и это будет стоить больше времени и ресурсов, чтобы избавиться от нее! §! \ n"
 PRU_fascist_army_rebellion: "\ n§R вниз по демократическому маршруту заставит фашистов в армии восстать. Это восстание будет ухудшено только в том случае, если вы сотрудничаете с фашистским государством. \ n The Fav также будет восстать, если вы сотрудничаете с фашистским государством §!. \ n \ n§Gnone из них произойдет, если вы сделаете армейскую демократику. §!"
 PRU_rebellious_democrats: "\ n§Rworking с фашистским государством приведет к тому, что оставшиеся демократы военно -морского флота восстают против вас, и потребуется некоторое время, чтобы вернуть их под ваш полный контроль. Если вы работали с демократическим государством с армией, то вы получите худшую версию восстанавливающегося флота, и это будет стоить больше времени и ресурсов, чтобы избавиться от него! §! \ n"
 PRU_rebelling_of_navy: "\ n§Rworking с фашистским государством приведет к тому, что оставшиеся демократы военно -морского флота восстают против вас, и потребуется некоторое время, чтобы вернуть их под ваш полный контроль. Если вы работали с демократическим государством с военно -морским флотом, то вы получите худшую версию восстанавливающегося флота, и это будет стоить больше времени и ресурсов, чтобы избавиться от него! §! \ N"
