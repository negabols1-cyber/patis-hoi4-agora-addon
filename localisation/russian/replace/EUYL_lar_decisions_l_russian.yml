 ECU_partial_gold_standard_abandonment: "Частичный золотой стандарт"
 ECU_partial_gold_standard_abandonment_desc: "Золотой стандарт был отклонен в Эквадоре еще в 1932 году из -за неспособности достижения результатов, на которые надеялись эквадорцы с миссией Кеммерера. Это оставление в сочетании с американской Великой депрессией вызвало серьезную экономическую нестабильность."
 ECU_full_gold_standard_abandonment: "Полный золотой стандарт"
 ECU_full_gold_standard_abandonment_desc: "Решение, которое мы теперь больше не можем возвращаться. Экономическая стабильность теперь может колебаться еще больше, но, по крайней мере, эквадорская валюта действительно не будет зависеть от стоимости золота"
 ECU_returned_to_the_gold_standard: "Вернулся к золотому стандарту"
 ECU_returned_to_the_gold_standard_desc: "Судя по нашей экономической деятельности между 1927 и 1932 годами, когда мы все еще использовали золотой стандарт. Понятно, что это было точкой величайшей стабильности в экономике. Даже если это идет с долгосрочными недостатками, то в настоящее время это того стоит."
