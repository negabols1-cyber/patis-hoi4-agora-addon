 BRA_patrianovism_on_the_rise: "Патриановизм на подъеме"
 BRA_patrianovism_on_the_rise_desc: "С тех пор, как в 1889 году было много неудачных попыток восстановить монархию, было много неудачных попыток восстановить монархию, такую ​​как война с Кандосом или восстание Рибейраозиньо. Тем не менее, все эти попытки потерпели неудачу и были быстро раздавлены, и все же есть много бразильцев, которые по -прежнему жаждут возвращения монархии и восстановления империи. Patrianovistas, возглавляемые Арлиндо Вейга -Дос -Сантосом, предлагают новый подход к империи, один с более авторитарным подходом и твердым сторонником равных прав между чернокожими и белыми бразильцами. Patrianovistas предлагают вновь обретенную надежду восстановить монархию для тех, кто все еще любит имперские дни, и с комбинированными усилиями мы можем протолкнуть и воплотить ее в жизнь. \ n \ nit будет жестким, и впереди нас будет много препятствий, но мы продвинутесь вперед, независимо от того, какой путь мы идем!"
