 CHL_frente: "£CHL_FP  §YFrente Popular§!"
 CHL_internal_political_split_desc: "Благодаря глобальной напряженности, медленно растущей и экстремальной идеологии, такими как фашизм и коммунизм, растущий по всему миру, наша нация сильно затронута. Шрамы от Великой депрессии, смешанные с ростом власти из нацистской Германии и Советского Союза, экстремальные идеологии внутри нашей страны также растут с тревожной скоростью. Бастион демократии, которым мы являемся сегодня, вполне может не остаться, если мы позволим Nacistas или коммунистам расти более могущественными, чем они в настоящее время являются. Это также не помогает тому, что они находятся в бесконечной борьбе за власть, что значительно влияет на нашу способность контролировать свою собственную нацию. Нам нужно следить, один неправильный шаг, и наша страна может попасть в полный хаос. \ n \ ncurrent £CHL_nacista_text  §Ynacista power§!: [?CHL_nacista_power|R0] \ n \ ncurrent [ROOT.GetSocialistGov] §Ypower§!: [?CHL_communists_power|R0] \ n \ n \ n[ROOT.GetControlOverNation]"
 CHL_control_over_nation_text: "Из -за нашей нынешней политической ситуации это означает, что наш нынешний контроль над нашей нацией: [?CHL_control_over_nation|Y0]§Y%§! \ n \ n§Rplease Осторожно, если либо §! £CHL_nacista_text  §ynacistas§!§R, либо §! [root.getsocialistgov] §R que выше §!§y 40§!§R, тогда эта соответствующая идеология запустит переворот. Также, пожалуйста, будьте очень осторожны с вашим контролем над вашей Nation§!§R. Если он станет слишком низким, вы не сможете правильно управлять своей нацией! §!"
