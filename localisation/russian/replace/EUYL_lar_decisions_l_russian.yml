 PRU_army_navy_rivalry: "Соперничество армии"
 PRU_army_navy_rivalry_desc: "Многие сектора нашей армии имеют фашистские связи, в то время как многие сектора нашего флота имеют демократические связи. Тем сильнее немцы получают больше фашистов в армии, и, как это происходит, многие из наших военно -морских командиров и офицеров обращаются еще больше к демократии и западным идеалам, что вызывает не только разделение между нашей армией и флотом, но и идеологическим расколом между обеими ветвями вооруженных сил. Этот массивный раскол разрывает нашу нацию пополам, и из -за того, что оба постоянно конкурируют между большей частью доминирования в вооруженных силах. Если один получает слишком большую власть, другой может разжечь восстание. \ N \ ncurrent Идеологические настроения из §YArmy§! IS: [ROOT.GetIdeologyArmy] \ n \ ncurrent Идеологическое настроение от §YNavy§! IS: [ROOT.GetIdeologyNavy] \ n \ n§Rif и ваша армия, и флот совпадают идеологически, и ни ваша армия, ни флот не восстают, тогда эта система и национальный дух будут удалены вместе с Debuffs.§!"
