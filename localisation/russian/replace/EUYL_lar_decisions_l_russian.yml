 BOL_getting_our_sweet_revenge_desc: "В течение десятилетий мы постепенно теряли нашу территорию всем нашим соседям, вынимая куски из нашей нации и унизили боливийский народ. Все это изменится, каждая страна, которая даже положила палец на нашу страну, заплатит их кровью и их людьми, когда мы унижаем их таким же образом, как и они. Мы больше не будем известны как слабая Южной Америки!"
