 BRA_dependency_on_our_coffee_productions_desc: "Мы являемся одним из крупнейших производителей кофе на планете. Большая часть планеты зависит от наших плантаций для их кофейных добавок. Из -за такого высокого спроса кофейная промышленность и плантации собрали огромное количество власти в нашей экономике. Благодаря этому они дикторуют многие наши экономические и промышленные действия. Мы должны следить за тем, насколько мы зависим от них, если мы не сможем серьезно повлиять на нашу экономику. \ n \ nour Текущая зависимость от нашего производства кофе: §Y[?BRA_dependency_on_coffee|Y0]%§! \ n \ n Текущее мнение кофейных плантаций по отношению к нашему правительству: [ROOT.GetCoffeeOpinion]"
