l_russian:
 ARG_GATHERING_STORM_DESC: "Благодаря Великой депрессии, Аргентинская экономика уже много лет была в руинах. Агьюстину Педро Юго не только приходится иметь дело с разрушенной экономикой, но и с очень недоверчивым населением. Всего 6 лет назад произошел крупный переворот, свергнув некогда президента Хиполито Йригоюена, который заставил многих людей не доверять военным и правительству в целом. \ N \ nnow с мировым нагреванием и мировой войной, кажущейся неизбежными, невозможно сказать именно то, что произойдет с Аргентиной и его политической трюком."
 ARG_BLITZKRIEG_DESC: "После некоторых довольно сомнительных выборов в 1937 году Роберто Мария Ортис стал президентом Республики. Экономические проблемы в основном ушли, и люди немного больше доверяют армии. \ n \ nall во всем, все, кажется, идет гладко, однако многие предполагают, что это не длится долго, и в какой -то момент военные снова вмешиваются в правительство. \ n \ nif эти предположения истины, тогда все, что мы можем сделать, это молиться, чтобы ничто из этого не стало кровавым."
 CHL_GATHERING_STORM_DESC: "В связи с тем, что экономические беспорядки не прошли, Чили может сосредоточиться на более важных частях своей нации, в частности, на их внешней политике. В то время как мир сжигает все вокруг, сохранит ли бастион демократии в Южной Америке свою корону, или он поддается влиянию формирования."
 CHL_BLITZKRIEG_DESC: "Чили теперь видит себя посреди глобального хаоса. Европа пожирается фашизмом и радикальными идеологиями. Здесь, дома, Парагвай, Перу и Венесуэла все отказались от основных демократических принципов. \ n \ nit - это то, что мы должны показать демократию Латинской Америки и преимущества, которые она приносит нации. POR LA LIBERTAD Y PREPSERIDAD!"
 URG_GATHERING_STORM_DESC: "Прошло 5 лет с тех пор, как Габриэль Терра приобрел власть в Уругвае и зарекомендовал себя как диктатор страны. Уже было предпринято несколько попыток заставить его уйти от власти, но на данный момент все потерпели неудачу. Из -за этих неудачных переворотов и других причин Терра заключила в тюрьму важных людей исключительно подозрения, что они могут быть против него. \ n \ nwith Мира нагревается, один размышляет о том, что произойдет с Уругваем."
 URG_BLITZKRIEG_DESC: "Мир находится на своем переломном моменте, и он неизвестен в отношении того, что произойдет. Многие предполагают, что последние дни Терры в качестве диктатора подходят к концу и что мы снова получим выборы. Другие говорят, что он будет продолжать диктатор, пока не умрет. \ n \ nwhichere это произойдет, будем просто надеяться, что это в лучшую сторону."
 BOL_GATHERING_STORM_DESC: "Всего через год после потери Чако в Парагвай в войне Чако Боливия находится в состоянии почти анархии. Нынешний президент просто больше не может поддерживать нацию, и военные планируют переворот из -за его некомпетентности. Ситуация выглядит темной для Боливии, и сейчас только будущее скажет, если они выйдут из этого как более сильную силу или поддаются своей собственной политической суматохе."
 BOL_BLITZKRIEG_DESC: "С миром на грани крупной войны, Боливия застряла в паттерне. Они вмешиваются и пользуются возможностью, чтобы расширить, или они остаются нейтральными и держатся подальше от войн. На это вопрос, который Герман должен будет ответить и поститься, если он хочет сохранить стабильность и суверенитет своей нации и людей."
 COL_GATHERING_STORM_DESC: "После того, как они были исключены в течение почти 50 лет, либералы, наконец, пришли к власти в 1930 году. Однако они получили промышленную обратную страну, экономически застойную и потрясенную волной двухпартийного насилия, которая бушует ежедневно. Тогда Колумбия прошла через период социальных реформ, которые не остались незамеченными со стороны оппозиции. В то время как Лопес Пумарехо стремится создать нейтральную нацию, другие кажутся адскими на восстановление прошлого величия Колумбии, хотя и силой ...."
 COL_BLITZKRIEG_DESC: "Президентство либералов отметило до и после в истории Колумбии. Замедление реформ, чтобы избежать социальной катастрофы - это то, что он предлагает с помощью своей программы «Великая пауза»."
 BRA_GATHERING_STORM_DESC: "Поскольку революция, все еще свежая в умах большинства бразильцев, политический и социальный климат в стране не справился. Варгас в настоящее время вынужден иметь дело с социально хрупкой нацией, экономика которого все еще в основном сельская местность и отстает от других стран. \ n \ n the Paulistas все еще держатся за сепаратистские мечты и противодействуют политическим партиям, растущим в поддержке. Можно с уверенностью сказать, что следующие несколько лет для Бразилии будут иметь решающее значение для страны."
 BRA_BLITZKRIEG_DESC: "Процесс создания Estado novo был долгим и жестоким. Многие стороны были насильственно закрыты, и голоса людей должны были быть подвергнуты цензуре, чтобы Варгас мог достичь статуса диктатуры. \ n \ nwith мира нагревается, поскольку напряженность между союзниками и осью продолжает расти, Бразилия Варгаса вынуждена решать между сайдингом с любой стороной или нейтралитетом. Что будет делать Бразилия?"
 PAR_GATHERING_STORM_DESC: "Даже год не пройдет с момента заключения войны Чако. К счастью, мы одержали победу, однако, война все еще сильно повлияла на нашу страну, так как и наша армия, и политика находятся в хрупком государстве из -за ресурсов, потраченных на войну. Нам нужно восстановиться и вернуться на ноги, прежде чем какая -либо страна воспользуется нашей хрупкой ситуацией."
 PAR_BLITZKRIEG_DESC: "В то время как текущая ситуация Парагвай значительно улучшилась по сравнению с 3 годами назад. До сих пор нельзя отрицать, что нынешняя ситуация далека от идеальной. Нынешнее либеральное правило подвергалось жесткой критике многими, и обещания, которые были выполнены до предположения, власть не была выполнена. \ n \ nwill Paraguay может протянуть и преобладать?"
 VEN_GATHERING_STORM_DESC: "Элеазар Лопес Контрерас, новый президент Соединенных Штатов Венесуэлы, оказывается внезапно ответственным за страну после смерти предыдущего диктатора Хуана Висенте Гомеса, всего несколько дней назад. Резкие изменения в правительстве еще не были приняты народом Венесуэлы, и коммунисты работают под землей, без ведома нас своего следующего шага. \ n \ nwill contreras может получить уверенность населения и осуществить свою мечту о свободной и демократической Венесуэле?"
 VEN_BLITZKRIEG_DESC: "Мир приближается к полной войне, поскольку Германия планирует свое польское вторжение. Это может быть как для выгод, так и не для нас, так как трудности войны могут привести к тому, что страны смотрят на нас за их нефть. Это улучшит нашу экономику, но это может привести к стоимости противостоящих стран, пытающихся политически заставить нас торговать только с ними. \ n \ ncontreras не осталось много времени в офисе, и ему нужно подготовить почву для подъезда и предстоящего кандидата, Исаис Медина Ангарита."
 ECU_GATHERING_STORM_DESC: "С момента 4 -дневной гражданской войны прошло всего 4 года, кровавый конфликт между консерваторами и либералами страны. Шрамы этого конфликта по -прежнему вырисовываются в политике Эквадора, и, поскольку Федерико Паез Чирибога только выращивает Fonder и Fonder of фашизма, ситуация просто продолжает ухудшаться. \ n \ ncan ecuador выдерживает свою надвигающуюся угрозу на их границе?"
 ECU_BLITZKRIEG_DESC: "Напряженность продолжает расти между Эквадором и Перу, поскольку обе страны претендуют на другую. При таком скорости война неизбежна. Вопрос, который многие обдумывают: когда? У Auerlio много под его поясом, и ему нужно будет управлять страной с 100% эффективностью, если он захочет стать победителем."
  
  #Additions 
  
 PRU_GATHERING_STORM_DESC: "С момента войны в Тихом океане Перу стал шелухой своего прежнего я. Армия Перу - это смех, военно -морской флот был разрушен чилийцами, и у них даже нет воздушной силы! Кроме того, гнев Великой депрессии нашел свой путь даже к Перу, однако, не так сильно, как другие нации. \ N \ nóscar Benavides есть много дел, - и не много времени - так как многие из наших соседей смотрят на наши земли, когда мир становится все более напряженным ..."
 PRU_BLITZKRIEG_DESC: "Благодаря óscar, многие из проблем, которые страдают от Перу, начали исцеляться. С вопросом о нашей форме правительства уместилась, наша нация стабилизировалась политически. Армия Перу начала модернизироваться с покупкой иностранного оружия и, таким образом, стала сильнее. Несмотря на то, что многие бремени, поднятые с плеч Перу, и, поскольку мир вступает в еще одну войну, Перу, исходя из сборов экстремизма из -за собрания избирательного собрания - теперь остался один вопрос; "Что мы делаем теперь?""
  
