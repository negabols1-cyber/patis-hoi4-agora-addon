 PRU_internal_factions: "Caudillismo"
 PRU_internal_factions_desc: "Фракция Caudillismo в перуанской армии состоит из харизматических и влиятельных военных лидеров, таких как Eloy Mureta, Manuel Odria, Rodríguez Ramírez и Эрнесто Монтань. Эти лидеры, каждый из которых имеет собственное влияние и последователи, представляют значительную силу в перуанских военных и политике. Его личное господство и власть могут оспорить сплоченность центрального правительства и повлиять на стабильность страны."
  
