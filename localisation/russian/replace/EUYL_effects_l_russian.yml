 PRU_Liberate_the_indigenous_people_of_America: "Освободить коренных народов Америки"
 PRU_Liberate_the_indigenous_people_of_America_desc: "Он продвигает освобождение и автономию коренных народов в Америке, восстанавливая их законное место в истории и обеспечивая их активное участие в правительстве и обществе."
 PRU_unified_by_will: "Объединен по воле"
 PRU_unified_by_will_desc: "Укрепляет национальную сплоченность, способствуя единству среди различных этнических и культурных групп Перу под руководством инков. Консолидировать национальную идентичность и решимость преследовать общую судьбу."
 PRU_unified_in_spirit: "Объединен по духу"
 PRU_unified_in_spirit_desc: "Это способствует солидарности и гармонии между коренными народами и потомками инков, подчеркивая общие ценности, общую историю и общее видение будущего. Укрепляет культурные и духовные связи, которые объединяют нацию."
  
