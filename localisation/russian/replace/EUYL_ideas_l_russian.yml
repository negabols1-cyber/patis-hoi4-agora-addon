 PAR_worn_out_army: "Изношенная армия"
 PAR_worn_out_army_desc: "Мы только что вышли из трехлетней кровавой войны против Боливии, поэтому, хотя мы вышли победителями, наши армии исчерпаны."
 PAR_stagnated_economy: "Застойная экономика"
 PAR_stagnated_economy_desc: "§R Эта идея будет удалена, когда будет субсидирована 100% вашей отрасли! §!"
 PAR_victor_of_the_chaco_war: "Виктор войны Чако"
 PAR_victor_of_the_chaco_war_desc: "Война Чако велась с 1932 по 1935 год между Боливией и Парагваем над контролем северной части региона Гран Чако. Парагвай в итоге победил в этой военной встрече, и из -за этого люди более патриотичны, чем когда -либо. \ n \ n§R0losing контроль над Чако удалит этот национальный дух! §!"
