 BRA_labor_rights: "Трудовые права"
 rural_economy: "Сельская экономика"
 rural_economy_desc: "Бразильская экономика еще далека от промышленно развитой. Большая часть его зависит от сельского хозяйства и кофейных плантаций. Несмотря на то, что это помогает с нашим экспортом, мы должны в ближайшее время индустриализоваться, иначе мы отстанем, поскольку другие страны промышленно используются и быстро."
