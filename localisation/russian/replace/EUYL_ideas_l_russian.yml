 URG_escuela_de_aeronautica: "ЭСКЕУЛА ДЕ АРЕОНАТИКА"
 URG_escuela_militar: "ЭСКУЛАЛА МИЛИТАР"
 URG_escuela_militar_desc: "Militar Escuela - это институт, отвечающий за обучение офицеров национальной армии. Он был основан 25 августа 1885 года, после законопроекта, представленного 31 марта 1884 года заместителем Вентуры Фернандес. Недавние реформы включали в себя добавление года подготовительных исследований, что позволило нашим новым офицерам иметь лучшее образование и навыки, необходимые для того, чтобы привести наши армии к величию."
 URG_naval_expenses: "Увеличение военно -морских расходов"
 URG_foreign_advisors: "Иностранные консультанты"
 URG_new_airforce: "Новая воздушная сила"
 URG_merchant_navy: "Расширил торговый флот"
 URG_ley_9943: "Лей № 9943"
 URG_ley_9943_desc: "Все уругвайцы обязаны защищать республику в военном отношении и соблюдать юридический режим военной подготовки, который позволяет им сделать это."
 URG_farming_subsidized: "Сельское хозяйство субсидируется"
 URG_INC: "Внедорожник"
 URG_brou_reformed: "Брау реформировался"
 URG_building_grants_idea: "Строительные гранты"
 URG_maintain_status_quo: "Аграрная экономика"
 URG_maintain_status_quo2: "Аграрная экономика"
 URG_welfare_state1: "Реформированное государство благосостояния"
 URG_welfare_state1_desc: "Начиная с второго президентства Хосе Батлле и Ордонеса, текущая система включает в себя полные льготы по не разбиванию и пенсии для пожилых людей и инвалидов. Недавние реформы удалили некоторые незначительные преимущества, которые имеют часть бюджета по другим вопросам, в то же время распоряжая хорошее мнение о программах государства."
 URG_welfare_state2: "Реформированное государство благосостояния"
 URG_welfare_state2_desc: "Начиная с второго президентства Хосе Батлле и Ордонеса, нынешняя система включает в себя полные льготы по не разбиванию и пенсии для пожилых людей. Недавние реформы удалили некоторые преимущества, которые имеют часть бюджета на другие вопросы. Это сделало значительную большую часть людей, разочарованных с нашим правительством, но большинство населения все еще поддерживают программы."
 URG_welfare_state3: "Реформированное государство благосостояния"
 URG_welfare_state3_desc: "Начиная с второго президентства Хосе Бэтлле Y Ordóñez, текущая система включает в себя полные преимущества не разбивания. Недавние реформы удалили большинство преимуществ, что имеет много бюджета на другие вопросы. Люди очень разочаровываются в нашем правительстве из -за наших решений о программах социального обеспечения, но это все еще оказывает поддержку от некоторых из них, нуждающихся в них."
 URG_welfare_state4: "Политическая негативная реакция"
 URG_welfare_state4_desc: "Отмена государства всеобщего благосостояния вызвала серьезную политическую реакцию от всех партий нации, но особенно из сектора Batllist Колорадской партии и социалистов. Бэтллисты видят в этом предательство наследия Батлля, которое так усердно боролось, чтобы покончить с гражданскими войнами и принести процветание нации, в то время как социалисты видят в этом атаку на рабочий класс."
