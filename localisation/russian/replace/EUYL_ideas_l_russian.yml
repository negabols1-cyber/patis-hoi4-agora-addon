 CHL_ASMAR: "Асмар"
 CHL_ASMAR_desc: "Asmar (Asstilleros y Maestranzas de la Armada de Chile) является чилийской государственной компанией по строительству, с ее предшественником была создана в 1895 году до реструктурированного и адаптированного текущего названия 6 апреля 1960 года."
 CHL_FAMAE: "FAMAE"
 CHL_FAMAE_desc: "Famae (Fábricas y Maestranzas del ejército, «Фабрики и мастерские армии») является чилийским государственным производителем огнестрельного оружия. Его продукция используется чилийскими вооруженными силами и полицейскими силами Carabineros. Компания производит среди прочего, Carbine Famae CT-30, Saf Saf Submachine Gun, Famae FD-200"
 CHL_communists_political_power: "Коммунистическое политическое сотрудничество"
 CHL_communists_political_power_desc: "Из -за довольно интенсивных требований со стороны коммунистов они решили предложить нашему правительству некоторую помощь временно."
 CHL_welfare_plans: "Планы социального обеспечения"
 CHL_political_instability_idea: "Политическая нестабильность"
 CHL_political_instability_idea_desc: "Нынешний политический спектр в Чили совсем не симпатичный. Правительство, коммунисты и Нацисты политически находятся в постоянном перетягивании войны, и вся нация разделена тремя способами. Этот раскол тяжело причиняет серьезный ущерб нации, и если он продолжает дальше, нация Чили вполне может быть в серьезных проблемах."
  
