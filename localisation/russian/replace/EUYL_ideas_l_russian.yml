 PRU_naval_democratic_loyalties: "Западные чувства во флоте"
 PRU_naval_democratic_loyalties_desc: "Наш небольшой флот прошел обучение в Соединенных Штатах, из-за этого многие во флоте имеют очень демократические, прозападные настроения."
 PRU_naval_democratic_loyalties_2: "Сильные западные чувства во флоте"
 PRU_naval_democratic_loyalties_2_desc: "Наш растущий флот прошел обширную подготовку из Соединенных Штатов, из-за этого многие во флоте имеют очень демократические, за западные чувства."
 PRU_naval_fascist_loyalties: "Фашистские пособия в флоте"
 PRU_naval_fascist_loyalties_desc: "Видя успех немецких подводных лодок и японской военно-морской силы в Азии. Мы решили пройти наше военно -морское обучение в Японии. Следствием этого является то, что многие во флоте верят и сочувствуют фашистским убеждениям."
 PRU_pathetic_navy: "Униженный флот"
 PRU_pathetic_navy_desc: "Наш военно -морской флот был уничтожен в войне Тихого океана этими теплением в Чили. Хотя наш флот восстановил часть своей силы, шрамы войны по -прежнему остаются сильными во всем флоте. Будет ли наше флот когда -нибудь стать славным еще раз?"
 PRU_conflicting_army_navy_loyalties: "Столкновения между армией и флотом"
  PRU_conflicting_army_navy_loyalties_desc:0 "Clashing sentiments between our navy and army has caused a bitter hatred between the two to form... 
 PRU_improper_air_force: "Неорганизованные ВВС"
 PRU_improper_air_force_2: "Неорганизованные ВВС"
 PRU_improper_air_force_desc: "В настоящее время наши военно -воздушные силы представляют собой свободную коллекцию авиационных подразделений от нашего флота и армии. Из -за этого это очень плохо организовано ..."
 PRU_improper_air_force_2_desc: "Даже при укреплении ВВС они все еще страдают от многих проблем из -за его неорганизованной формы."
 PRU_divided_navy: "Военно -морские чувства разделены"
 PRU_divided_navy_desc: "Растущие фашистские чувства в нашем флоте заставляют многих из тех, кто все еще цепляется за западные чувства во флоте, сильно не любит тех, кто выступает против своих идеалов. Они сбудут со временем ..."
 PRU_divided_army: "Фашистские чувства в армии"
 PRU_divided_army_desc: "Восходящая немецкая власть заставила многих с крайне правыми убеждениями в нашей армии объединиться в большую фракцию в наших вооруженных силах. Эта фракция начинает сталкиваться с большими прозападными фракциями в нашей армии, и она начинает говорить на армии ..."
 PRU_pro_west_army: "Западные чувства в армии"
 PRU_pro_west_army_desc: "Пропадные фракции в нашей армии правят в высшем уровне с нашим новым военным сотрудничеством с Францией, что привело к тому, что эти крайне правые фракции отказались!"
 PRU_pro_fascist_army: "Сильные фашистские чувства в армии"
 PRU_pro_fascist_army_desc: "Крайне правые фракции в нашей армии царствовали высшим и раздавили все прозападные фракции в нашей армии. Наша армия снова объединена ..."
 PRU_strength_in_our_guns_idea: "Сила в нашем оружии"
 PRU_strength_in_our_guns_idea_desc: "Наши люди драгоценны и мало, поэтому мы должны убедиться, что наши убытки составляют потери."
 PRU_strength_in_our_minds_idea: "Сила в наших умах"
 PRU_strength_in_our_minds_idea_desc: "Переиграв наших врагов, мы можем обеспечить быструю победу."
 PRU_strengthened_currency: "Укрепленная валюта"
 PRU_strengthened_currency_desc: "С укрепленной валютой мы можем принять любой экономический вызов, который будет стоять на нашем пути!"
 PRU_industrial_expand: "Инадстрильный экспансионизм"
 PRU_rebelling_navy: "Восстановление военно -морского флота"
 PRU_rebelling_navy_desc: "Демократы в нашем флоте восстают из -за сотрудничества с фашистами. Это будет стоить нам довольно, чтобы успокоить их, но мы можем и в конечном итоге это сделаем."
 PRU_rebelling_army: "Восстанавливающая армия"
 PRU_rebelling_army_desc: "Фашисты в армии очень недовольны нашим недавним сотрудничеством с Западом и восстают. Это обойдется нам, чтобы успокоить их, но мы можем и будем справиться с этим."
