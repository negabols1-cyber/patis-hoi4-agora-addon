 PRU_preparing_for_the_worst_desc: "Поскольку народы мира возвращаются к своему любимому убиванию друг друга, мы должны убедиться, что мы не жертвами этих конфликтов."
 PRU_pokimane_fart: "Спасения для экономики"
 PRU_continuing_the_gold_standard: "Использование золотого стандарта"
 PRU_continuing_the_gold_standard_desc: "Когда Эдвин Кеммерер посетил нас, чтобы помочь с нашей экономикой в ​​1931 году, он посоветовал нам переключить нашу валюту на золотой стандарт. С тех пор мы следовали его совету, но, возможно, мы должны это изменить?"
 PRU_continuing_the_gold_standard_2: "Продолжение золотого стандарта"
 PRU_continuing_the_gold_standard_2_desc: "Когда Эдвин Кеммерер посетил нас, чтобы помочь с нашей экономикой в ​​1931 году, он посоветовал нам переключить нашу валюту на золотой стандарт. Мы знаем, что отключение этого стандарта и его изменение в фиатную валюту приведет к катастрофу и, таким образом, решили, что мы должны продолжать использовать золотой стандарт."
 PRU_fiat_currency_instability: "Нестабильная валюта"
 PRU_fiat_currency_instability_desc: "Наша валюта привлекло обеспокоенные глаза многих инвесторов, кредиторов и стран, не уверенных в том, является ли торговлю с нами хорошей идеей. Это говорит о нашей экономике, и мы должны найти способ исправить ее быстро ..."
 PRU_bedrock_of_sa: "Экономическая коренная порода Южной Америки"
 PRU_bedrock_of_sa_desc: "Мы сделали это! Наша валюта стабилизировалась, и мы сделали это без американского руководства! Эта стабилизация привела к тому, что многие иностранные инвесторы и тому подобное возобновило их бизнес здесь, что привело к восстановлению нашей экономики. Арриба, Арриба, Арриба Эль Перу!"
