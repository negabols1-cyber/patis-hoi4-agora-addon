  # Peru-Bolivian Confederation 
 PBC_divided_ideological_sentiments: "Разделенные идеологические чувства"
 PBC_divided_ideological_sentiments_desc: "То, что мы не имели в виду, когда мы объединились, так это то, что у каждой из наших наций были разные партии и идеологии, которые правят его, и это вызвало массовое раскол в нашей идеологии внутри нашей новой страны. Это очень плохо для нашей политической стабильности, и если мы позволим этой политической нестабильности показать нашим соседям, они воспользуются нашей ситуацией."
 PBC_all_must_accept: "§REvery Страна, которая войдет в войну с Перу-Боливской конфедерацией, должна принять, чтобы эффекты имели место! §!"
 PRU_BOL_all_must_accept: "§REvery Страна, которая войдет на войне с Перу и Боливией, должна принять, чтобы последствия имели место! §!"
 PBC_split_armies: "Расколотая армия"
 PBC_split_armies_desc: "Внезапное объединение наших армий вызвало огромное раскол в наших вооруженных силах. У наших генералов есть противоречивые идеи, наши солдаты плохо ладят друг с другом, и весь наш армейский отдел был исключен из курса из -за соединения наших наций. Нам нужно решить это и быстро."
 PBC_divided_economy: "Разделенная экономика"
 PBC_divided_economy_desc: "Наш промышленный сектор также пострадал от этого объединения. Компании из Боливии и Перу противоречат друг другу, как у кого больше власти над различными секторами нашей экономики. Если это не закончится и быстро, то последствия будут задержаться довольно долго."
 PBC_war_of_independence: "Наша война за независимость"
 PBC_war_of_independence_desc: "Эти проклятые ублюдки снова хотят, чтобы мы умерли, они не хотят, чтобы наш профсоюз работал. Они эгоистичны и напуганы, что мы будем успешными, и, к их неприятному сюрпризу, мы будем! Независимо от того, сколько из наших людей мы проиграем, мы должны выиграть эту войну. Наши предшественники попробовали это один раз и потерпели неудачу, но на этот раз мы добьемся успеха!"
  
  # Colombia 
 COL_politicised_army: "Политизированная армия"
 COL_politicised_army_desc: "В течение долгого времени в истории Колумбии консервативные правители использовали военные в качестве своей частной армии. Военное руководство было составлено почти исключительно из консервативных генералов, исключая либералов из любого участия. Однако теперь, когда консервативная гегемония, кажется, подходит к концу, мы должны спросить себя, будет ли армия будет продолжать быть политической силой или станет ли она организацией, которая защищает всех колумбийцев."
 COL_politicised_army_instant_desc: "\ n§R0."
 COL_political_violence: "Двухпартийные конфликты"
 COL_political_violence_desc: "Две традиционные партии, либеральные и консервативные, боролись за власть десятилетиями, поляризуя людей и предотвращая развитие нации. Колумбия и ее правители имеют долгий процесс, чтобы разорвать это древнее наследие."
 COL_oposicion: "Внутренняя политическая оппозиция"
 COL_oposicion_instant_desc: "\ n§R.copting Политическая оппозиция сделает возможным консервативное или либеральное восстание, в зависимости от того, какой человек является правящей стороной. §!"
 COL_revolucion_en_marcha: "Марширующая революция"
 COL_gaitan_desc: "Член либеральной дискуссии, Гайтан - политический фигур, который концентрирует пожелания народа своим превосходным ораторским искусством. Его образ чрезвычайно популярен, любим и похвалил многими, что принесло ему название «Трибуна людей»."
 gaitan_tt: "§Yliberal Subversive Empluction§! Скорость роста: §R+15%§!"
 COL_heridas: "Военные раны"
 COL_heridas_desc: "Постоянные гражданские войны, с которыми сталкивалась Колумбия на протяжении всей своей истории, отмечали ее как нацию, стремясь к военному традиционализму. Война настолько распространена для колумбийцев, что правительство потратило большую часть своих ресурсов на военные материалы. Люди, напротив, выросли на фоне боевых действий и будут бороться до смерти за идеалы, которые они исповедуют."
 COL_heridas_2: "Военные раны"
 COL_heridas_2_desc: "Постоянные гражданские войны, с которыми сталкивалась Колумбия на протяжении всей своей истории, отмечали ее как нацию, стремясь к военному традиционализму. Война настолько распространена для колумбийцев, что правительство потратило большую часть своих ресурсов на военные материалы. Люди, напротив, выросли на фоне боевых действий и будут бороться до смерти за идеалы, которые они исповедуют."
 COL_economia_1: "Застойная экономика"
 COL_economia_1_desc: "Со времен независимости экономика Колумбии никогда не выделялась за то, что она самая динамичная или самая медленная. Небольшой интерес правителей возродить национальную экономику, добавленные к постоянным гражданским войнам, сделали государственную казнь пустыми, а экономические показатели застряли на протяжении десятилетий."
