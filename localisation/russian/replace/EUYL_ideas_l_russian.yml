 BOL_losers_in_the_chaco_war_name: "Неудачник войны Чако"
 BOL_losers_in_the_chaco_war_name_desc: "Всего год назад мы пошли на войну с парагвайцами на территории Чако Бореаля и проиграли войну вместе со значительной частью нашей территории. Эта потеря привела к тому, что наша армия поступила в состояние почти анархии, и мы стали смешным запасом Южной Америки. Нам нужно искупить себя и поститься, прежде чем любая другая страна воспользуется нашей слабой ситуацией. \ n \ n§Rretaking and Controling the Chaco Boreal избавится от этого национального духа! §!"
 BOL_unstable_republic_name: "Нестабильная республика"
 BOL_unstable_republic_name_desc: "Наша страна была в руинах с момента нашей потери войны в Чако. Народ, армия, даже части правительства против нас. Порядок был потерян в нашей стране, и мы становимся ближе и ближе, чтобы считать неудачным государством. Нам нужно решить нашу политическую ситуацию и быстро, если мы хотим продолжать быть суверенной нацией."
 BOL_great_depression_name: "Великая депрессия"
 BOL_great_depression_name_desc: "У Боливии есть экономика, которая очень зависит от Соединенных Штатов, и из -за этого мы страдаем из -за Великой депрессии. Наш экспорт рушатся, и наша экономика не в состоянии, и если мы будем продолжать в том же скорости, нам, возможно, придется дефолт в качестве нации. Кроме того, ресурсы, которые использовались в недавней войне в Чако, также истощили нашу экономику."
 BOL_sea_access_loss: "Потеря доступа моря"
 BOL_sea_access_loss_desc: "Потеряв войну Тихого океана, мы потеряли доступ к морю. С того дня наш народ и экономика в результате сильно страдают. Если однажды мы получим доступ к морю, то наши люди действительно будут держать боливийский флаг с гордостью и национализмом! \ n \ n§R0controlling любое прибрежное государство избавится от этого национального духа! §!"
 BOL_gain_infrastructure: "Каждое состояние, которое имеет §Yinfrastructure, превышающую 3§!, это инфраструктура, будет §gimprove§! по §Y1§!. Для каждого состояния, в котором есть §Yinfrastructure менее 3§!, это инфраструктура будет §gimprove§! по §Y2§!."
 BOL_every_neighbor: "Для соседней страны §YEvery, которая имеет значение §Yopinion§! из вас §Ygreater than§! §g80§!, вы получите §g1§! §Ycivilian factory§!"
 BOL_tungsten_selling: "Для §YEvery state§!, который имеет §YOver§! §G40§! §Ytungsten§!, вы получите §G1§! §YCivilian Factory§!"
 BOL_opened_wheat_markets: "Открытые пшеничные рынки"
 BOL_step_off_free_trade_warning: "свободная торговля"
 BOL_focused_on_what_were_good_at: "Сосредоточиться на горнодобывающей промышленности"
 BOL_focused_on_what_were_good_at_desc: "Горнодобывающая промышленность уже была одной из наших самых сильных отраслей, получив большие инвестиции после открытия огромных объемов природных ресурсов, особенно вольфрамовых, в стране. Благодаря этим дополнительным инвестициям и приоритетам отрасли мы сможем достичь новых высот и даже можем стать основным производителем вольфрама на планете."
 BOL_switched_to_an_agrarian_industry: "Переключился на аграрное общество"
 BOL_switched_to_an_agrarian_industry_desc: "В течение очень долгого времени горнодобывающая промышленность доминировала в нашей экономике и промышленности в целом, но это начинает меняться. Многие из наших некогда сухих полей в настоящее время выращиваются, и наша экономика медленно, но верно переключается с горнодобывающей промышленности на сельскохозяйственное. Преимущества, которые принесут с наличием аграрного общества, будут показаны, и они скоро покажут достаточно."
