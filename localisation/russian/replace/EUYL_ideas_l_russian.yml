 ARG_economic_depression: "Экономическая депрессия"
 ARG_economic_depression_desc: "Великая депрессия сильно повлияла на Аргентину. Экономика была в руинах уже 7 лет, и если ничего не сделано, то кто знает, что будет с страной."
 ARG_rampant_corruption: "Безудержная коррупция"
 ARG_rampant_corruption_desc: "Аргентина, как и большинство ее латиноамериканских братьев и сестер, пронизана коррупцией и мошенничеством."
  
 ARG_does_not_have_distrust_of_military_spirit_tt: "Нет национального духа §Y$ARG_distrust_of_military$§!"
  
 ARG_distrust_of_military: "1930 Coup D'Etat Scars"
 ARG_distrust_of_military_desc: "Поскольку переворот 1930 года D'Etat все еще в недавней памяти о многих аргентинцах, неудивительно, что большая часть населения против военных, считая его негативным, что делает более плохие, чем пользы. Если мы хотим создать, мы должны вернуть доверие населения в целом."
 ARG_economic_depression_2: "Небольшое экономическое восстановление"
 ARG_economic_depression_2_desc: "Благодаря различным реформам и усилиям по индустриализации нации, наши экономические проблемы немного улучшились. Тем не менее, работа еще предстоит выполнить, если мы хотим полностью избавиться от наших экономических падений."
 ARG_shadow_of_peron: "Тень Перона"
 ARG_shadow_of_peron_desc: "Будучи свежей и новой идеологией, в умах многих аргентинских перонизма рассматривается как спасительная грация для нашего экономического падения, и независимо от того, какое правительство находится во власти, люди всегда будут расти и ближе к Перону и его идеологии."
 ARG_shadow_of_peron_2: "Тень Перона"
 ARG_shadow_of_peron_2_desc: "Будучи свежей и новой идеологией, в умах многих аргентинских перонизма рассматривается как спасительная грация для нашего экономического падения, и независимо от того, какое правительство находится во власти, люди всегда будут расти и ближе к Перону и его идеологии."
 ARG_shadow_of_peron_3: "Тень Перона"
 ARG_shadow_of_peron_3_desc: "Будучи свежей и новой идеологией, в умах многих аргентинских перонизма рассматривается как спасительная грация для нашего экономического падения, и независимо от того, какое правительство находится во власти, люди всегда будут расти и ближе к Перону и его идеологии."
 ARG_distrust_of_military_2: "1930 Coup D'Etat Scars"
 ARG_distrust_of_military__2_desc: "Даже с нашими недавними усилиями по восстановлению доверия людей, хороший процент населения все еще не полностью убежден в том, что может принести влиятельные военные. Мы должны стараться еще больше, чтобы полностью завоевать уверенность и поддержку всех в Аргентине."
 ARG_improved_mining_techniques: "Улучшенные методы добычи"
 ARG_improved_mining_techniques_desc: "С нашей новой технологией мы теперь можем более эффективно извлекать наши ресурсы."
 ARG_industrial_expansionism: "Промышленный экспансионизм"
 ARG_industrial_expansionism_desc: "Пришло время начать иметь дело с нашей экономикой и вернуть ее в государство, которое было раньше."
 ARG_reduce_public_expenses: "Снижение государственных расходов"
 ARG_reduce_public_expenses_desc: "Однако сокращение государственных расходов может помочь нам в краткосрочной перспективе, однако это не решает наши проблемы."
 ARG_patriotic_loan: "Установил патриотический кредит"
 ARG_patriotic_loan_desc: "Теперь, когда мы создали патриотический кредит, это укрепит нашу финансовую казну, напрямую улучшая нашу экономику за счет некоторых расходов."
 ARG_distrust_of_military_3: "1930 Coup D'Etat Scars"
 ARG_distrust_of_military_3_desc: "Поскольку переворот 1930 года D'Etat все еще в недавней памяти о многих аргентинцах, неудивительно, что большая часть населения против военных, считая его негативным, что делает более плохие, чем пользы. Если мы хотим создать, мы должны вернуть доверие населения в целом."
 ARG_air_dominance: "Воздушное доминирование"
 ARG_air_dominance_desc: "С нашим вниманием к воздуху мы можем доминировать в любом противнике, который осмеливается проверить нас."
 ARG_artillery_production: "Артиллерийское производство"
 ARG_artillery_production_desc: "Теперь мы производим артиллерию более эффективно."
