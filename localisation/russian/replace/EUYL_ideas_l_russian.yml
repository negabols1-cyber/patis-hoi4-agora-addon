 PAR_political_instability: "Политическая нестабильность"
 PAR_political_instability_desc: "Политический спектр в Парагве был в руинах с момента завершения войны в Чако. Военные все больше и больше взволнованы реформами и политикой нынешнего президента, и, вероятно, будут продолжать делать это, если они считают нынешнего президента как подразделение. Мы должны контролировать военные, чтобы убедиться, что они не вмешиваются дальше в нашей политике. \ n \ n§RAs, пока этот национальный дух активен, между военными и нынешним президентом будет баланс сил, и это всегда будет подталкивать баланс сил в сторону военных парагвайцев. §!"
