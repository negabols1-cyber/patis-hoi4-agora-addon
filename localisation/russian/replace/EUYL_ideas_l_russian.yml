 BOL_taking_antofagasta: "Принимая Антофагаста"
 BOL_taking_antofagasta_desc: "Пришло время сделать препараты, чтобы взять Антафагаста. Если все пойдет хорошо, мы могли бы даже взять его без какого -либо сопротивления. Раньше мы владели Антагагаста, и на самом деле мы должны владеть им. Мы не позволим чилийцам больше блокировать наш доступ к морю!"
 CHL_countering_bolivias_plan: "Противодействие плану Боливии принять Antofagasta"
