 CHL_prussian_military_traditions: "Прусские военные традиции"
 CHL_prussian_military_traditions_desc: "Прусские военные традиции представляют собой набор военных доктрин и практики, которые были разработаны в Королевстве Пруссия в течение 18 и 19 веков. Эти традиции были приняты многими странами по всему миру, включая Чили, и оказали значительное влияние на развитие современной военной стратегии и тактики."
  
