 PRU_rebelling_natives_desc: "Наш переход с Перу на нашу старую и славную империю окажет некоторую помощь от людей и правительства. Мы позаботимся о том, чтобы наше восстание распространяется по всем местным жителям страны и осознаем мусор, который является «европейским». Они не имеют права быть на нашей земле, и они будут платить, они будут платить за свой геноцид, их колониализацию, их нарушение нашего народа. Они заплатят!"
