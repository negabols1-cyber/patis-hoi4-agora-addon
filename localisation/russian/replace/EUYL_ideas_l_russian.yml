 ARG_infantry_production: "Производство пехотного оборудования"
 ARG_infantry_production_desc: "Благодаря нашим усилиям мы теперь можем производить пехотное оборудование по более дешевой цене и более эффективно."
 ARG_drift_back_towards_the_confederation_idea: "Вернуться к конфедерации"
 ARG_drift_back_towards_the_confederation_idea_desc: "Население просыпается. Когда придет время, мы нанесем удар!"
 ARG_death_to_the_Unitarios: "Смерть в Unitarios"
 ARG_death_to_the_Unitarios_desc: "Вниз с Unitarios! Мы бы предпочли умереть, чем отказаться от нашей судьбы!"
 ARG_death_to_the_Federales: "Смерть федеральным"
 ARG_death_to_the_Federales_desc: "Вниз с федералами! Мы не позволим нашей стране захватить эти военные торговцы!"
 ARG_viva_la_confederacion: "Viva La Confederacion"
 ARG_viva_la_confederacion_desc: "Мы являемся спасительной благодати Аргентины, мы - то, что продвинут страну вперед и превратит ее в региональную власть, и, возможно, даже сверхдержава, мы великолепны. Viva La Confederacion!"
 ARG_viva_la_confederacion_2: "Viva La Confederacion"
 ARG_viva_la_confederacion_2_desc: "Мы являемся спасительной благодати Аргентины, мы - то, что продвинут страну вперед и превратит ее в региональную власть, и, возможно, даже сверхдержава, мы великолепны. Viva La Confederacion!"
