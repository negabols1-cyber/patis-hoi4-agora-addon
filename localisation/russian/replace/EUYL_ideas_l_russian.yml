 ARG_send_volunteers: "Отправить добровольцев"
 ARG_send_volunteers_desc: "Мы должны быть в состоянии отправлять добровольцев, чтобы наши планы тренировались."
 URG_influenced_politics: "Аргентина влияет на нашу политику"
 URG_influenced_politics_desc: "Аргентинская конфедерация посылает фашистских дипломатов для влияния на нашу политику. Что бы они ни задумали, это не хорошо."
 ARG_the_second_cisplatine_war: "Дай Бразилию борьбу, которую они хотят"
 ARG_the_second_cisplatine_war_desc: "Бразилия объявила нам войну без реальной причины, пришло время платить с кровью. Пришло время дать им бой, за который они жаждали."
 ARG_the_second_cisplatine_war_2: "Дай Бразилию борьбу, которую они хотят"
 ARG_the_second_cisplatine_war_2_desc: "Бразилия объявила нам войну без реальной причины, пришло время платить с кровью. Пришло время дать им бой, за который они жаждали."
 ARG_naval_supremacy_over_brazil: "Военно -морское превосходство над Бразилией"
 ARG_naval_supremacy_over_brazil_desc: "Мы должны получить превосходство над Бразилией, если мы даже мечтаем победить их на войне."
 ARG_expansionist_policy: "Экспансионистская политика"
 ARG_joint_germanargentine_military_training: "Совместная военная подготовка"
 ARG_joint_germanargentine_military_training_desc: "Мы оба изучаем новые методы у военных друг друга, и с этим мы оба взаимовыгодны наши армии."
 ARG_increased_naval_output: "Увеличение военно -морского производства"
 ARG_increased_naval_output_desc: "С таким увеличением нашего военно -морского вывода мы, по крайней мере, сможем отключить любую латинаминальную военно -морскую мощность."
 ARG_increased_naval_output_2: "Увеличение военно -морского производства"
 ARG_increased_naval_output_2_desc: "С таким увеличением нашего военно -морского вывода мы, по крайней мере, сможем отключить любую латинаминальную военно -морскую мощность."
 ARG_increased_naval_output_3: "Увеличение военно -морского производства"
 ARG_increased_naval_output_3_desc: "С таким увеличением нашего военно -морского вывода мы, по крайней мере, сможем отключить любую латинаминальную военно -морскую мощность."
 ARG_increased_submarine_output: "Повышенная подводная мощность"
 ARG_increased_submarine_output_desc: "С более эффективными стратегиями мы можем создавать больше подводных лодок и оспаривать чилийский суб -флот."
 ARG_increased_destroyer_output: "Увеличение выходных выводов"
 ARG_increased_destroyer_output_desc: "С более эффективными стратегиями мы можем создать больше эсминцев и оспорить флот бразильского эсминца."
 ARG_modern_dockyard_technology: "Увеличение технологии верфи"
 ARG_modern_dockyard_technology_desc: "Новая и предназначенная технология Dockyard позволяет нам производить корабль более быстрыми темпами."
 ARG_modern_dockyard_technology_2: "Увеличение технологии верфи"
 ARG_modern_dockyard_technology_2_desc: "Новая и предназначенная технология Dockyard позволяет нам производить корабль более быстрыми темпами."
 ARG_improved_heavy_ships: "Улучшенные тяжелые корабли"
 ARG_improved_heavy_ships_desc: "Благодаря новой и передовой технологии мы можем нанести больший удар на тяжелые корабли и убедиться, что ни один другой корабль не может противостоять нашим."
 ARG_build_coastal_ships: "Построить прибрежные корабли"
 ARG_build_coastal_ships_desc: "Благодаря лучшей технологии и повышению эффективности, мы можем быстро построить прибрежную защиту в случае войны."
 ARG_modern_armada_argentina: "Современная Армада Аргентина"
 ARG_modern_armada_argentina_desc: "Со всеми нашими недавними событиями, военно -морскими расходами, расширением верфи и модернизированными кораблями мы произвели революцию в Армада Аргентине, превратив ее в серьезную военно -морскую власть в Америке и, возможно, даже во всем мире."
 ARG_quality: "Качество"
 ARG_quality_desc: "С качественными войсками мы можем изгнать любого врага, даже если у нас нет количества людей, которые у них есть."
 ARG_quality_2: "Качество"
 ARG_quality_2_desc: "С качественными войсками мы можем изгнать любого врага, даже если у нас нет количества людей, которые у них есть."
 ARG_quantity: "Количество"
 ARG_quantity_desc: "С большим количеством войск не имеет значения, имеет ли у врага технологическое лидерство."
 ARG_quantity_2: "Количество"
 ARG_quantity_2_desc: "С большим количеством войск не имеет значения, имеет ли у врага технологическое лидерство."
 ARG_produce_motorized: "Производить моторизованные"
 ARG_produce_motorized_desc: "Теперь мы можем производить больше моторизованного за более дешевую стоимость."
 ARG_make_our_own_tanks: "Сделайте наши собственные танки"
 ARG_make_our_own_tanks_desc: "Создание наших собственных танков показывает миру, что нам не нужно зависеть от их отраслей или технологий, чтобы мы могли продвигаться и иметь мощные военные."
 ARG_cheaper_artillery: "Более дешевая артиллерия"
 ARG_cheaper_artillery_desc: "С более дешевой артиллерией мы сможем накачать больше артиллерии и, следовательно, иметь больше огневой мощи, чем враг."
 ARG_cheaper_equipment: "Более дешевое оборудование"
 ARG_cheaper_equipment_desc: "С более дешевым оборудованием мы можем вооружать больше людей быстрее и, следовательно, сделать нашу большую армию более компетентной."
 ARG_expand_air_force: "Расширить ВВС"
 ARG_expand_air_force_desc: "Расширение наших ВВС является ключевым для того, чтобы сокрушить врага в небе и позволить нам иметь преимущество на войне на суше."
 ARG_concordancia_elected: "Согласованность переизбран"
 ARG_concordancia_elected_desc: "Поскольку согласие, недавно была переизбранная, мы можем продолжать контролировать страну так, как раньше."
 ARG_union_civica_radical_elected: "Union Civica Radical избран"
 ARG_union_civica_radical_elected_desc: "Поскольку избранный радикал Union Civica мы можем начать возвращаться к более демократическим идеалам и воспитывать эту страну."
 ARG_los_azules: "Лос -Азулы"
 ARG_los_azules_desc: "Los Azules - это фракция внутри UCR, которая имеет тенденцию держать более консервативные идеалы и больше сторон с верхним средним классом и богатыми."
 ARG_los_azules_2: "Лос -Азулы"
 ARG_los_azules_2_desc: "Los Azules - это фракция внутри UCR, которая имеет тенденцию держать более консервативные идеалы и больше сторон с верхним средним классом и богатыми."
 ARG_los_azules_3: "Лос -Азулы"
 ARG_los_azules_3_desc: "Los Azules - это фракция внутри UCR, которая имеет тенденцию держать более консервативные идеалы и больше сторон с верхним средним классом и богатыми."
 ARG_los_grises: "Лос -грисс"
 ARG_los_grises_desc: "Los Grises - это фракция внутри UCR, которая имеет тенденцию держать больше социалистических идеалов и больше сторон с бедными."
 ARG_los_grises_2: "Лос -грисс"
 ARG_los_grises_2_desc: "Los Grises - это фракция внутри UCR, которая имеет тенденцию держать больше социалистических идеалов и больше сторон с бедными."
 ARG_los_grises_3: "Лос -грисс"
 ARG_los_grises_3_desc: "Los Grises - это фракция внутри UCR, которая имеет тенденцию держать больше социалистических идеалов и больше сторон с бедными."
 ARG_expand_the_YPF: "Расширить YPF"
 ARG_expand_the_YPF_desc: "Расширяя компанию YPF, мы сможем собрать больше ресурсов и, следовательно, экспортировать больше снаружи."
 ARG_support_the_YPF_workers_idea: "Поддерживать работников YPF"
 ARG_support_the_YPF_workers_idea_desc: "Компания может быть теми, кто занимается людьми, но это рабочие, которые поднимают это."
 ARG_reject_personalismo: "Отвергнуть персонализм"
 ARG_reject_personalismo_desc: "Персонализмо - это латиноамериканская идея подчинения интересов политических партий, идеологий и конституционного правительства, чтобы лояльность к одному лидеру. Мы не можем больше этого происходить."
 ARG_banco_central_argentino: "Реформатор Банко Центральный Аргентино"
 ARG_banco_central_argentino_desc: "Центральный банк Аргентины - это идеальный способ контролировать нашу валюту, и наличие центрального банка позволит нам национализировать внешнюю торговлю."
 ARG_expanded_worker_rights: "Расширенные права работников"
 ARG_fadea: "Фабрика Аргентина де Авионес"
 ARG_fadea_desc: "Основанная в 1927 году, Fadea (короткая для Фабрики Аргентина де Авионес) была компанией, занимающейся производством самолетов военного уровня. Его основная производственная установка была расположена в провинции Кордоба."
 ARG_expanded_worker_rights_Desc: "Расширение прав работников привлекла нас к поддержке населения, и средний работник теперь работает более эффективно и в лучшем темпе, чем раньше."
 ARG_barn_of_the_world: "Сарай мира"
 ARG_barn_of_the_world_desc: "Благодаря нашим огромным сельскохозяйственным угодьям, обильным природным ресурсам и мощной экономике, которыми мы были и известны как «сарай мира», экспортируя продукты питания и товары во все страны по всей планете."
 ARG_invest_in_infrastructure: "Инвестировать в нашу инфраструктуру"
 ARG_invest_in_infrastructure_desc: "Инвестирование в нашу инфраструктуру позволит нам быстрее развивать нашу страну и позволить товарам быть доставленными в и по всей стране."
 ARG_our_liberal_ways: "Наши либеральные пути"
 ARG_our_liberal_ways_desc: "свободный рынок"
 ARG_our_liberal_ways_2: "Наши либеральные пути"
  ARG_our_liberal_ways_2_desc:0 "We were one of the first countries on the planet to adopt a liberal mindset, one that revolves around a free market, free thought, and better worker rights. These ideas allowed us to at one point be the richest country per capita on the planet. It's time we go back to those ways and become the power we once were. 
 ARG_spanish_civil_war_tactics: "Тактика гражданской войны в Испании"
 ARG_spanish_civil_war_tactics_desc: "Благодаря тому, что оказались на месте в первом ряду гражданской войны, мы можем сделать заметки о развертываемой тактике и, следовательно, лучше наших собственных войск."
 ARG_spanish_argentine_economic_allience: "Испанский-Аргентинский экономическое сотрудничество"
 ARG_spanish_argentine_economic_allience_desc: "Обе наши экономики в настоящее время процветают в результате нашего экономического благосостояния. Только хорошие вещи пришли из этого договора, и еще много еще."
 ARG_imrpoved_consumer_sector: "Улучшенный потребительский сектор"
 ARG_imrpoved_consumer_sector_desc: "Наша новая политика и реформы оказались успешными в потребительском секторе нашего идентификатора, что позволило населению все еще удовлетворить даже более низкое количество заводов, посвященных потребительским товарам."
 ARG_modernize_construction_companies: "Модернизированные строительные компании"
 ARG_modernize_construction_companies_desc: "Модернизация наших строительных комаров позволила нам получить преимущество, когда дело доходит до строительства новых фабрик и расширения нашей отрасли."
 ARG_attracted_foreign_investment: "Привлекла иностранные инвестиции"
 ARG_attracted_foreign_investment_desc: "Благодаря нашим недавним усилиям по привлечению иностранных инвесторов, наш торговый рынок значительно расширился, а также наша экономика."
 ARG_open_our_borders: "Открыл наши границы"
 ARG_open_our_borders_desc: "Благодаря открытию наших границ, новые люди со всего мира приезжают в Аргентину, чтобы вызвать свой новый дом."
 ARG_the_liberal_war_machine: "Машина либеральной войны"
 ARG_the_liberal_war_machine_desc: "Поскольку мир сжигается вокруг нас, пришло время создать нашу военную промышленность, чтобы конкурировать на мировой арене."
 ARG_the_liberal_war_machine_2: "Машина либеральной войны"
 ARG_the_liberal_war_machine_2_desc: "Поскольку мир сжигается вокруг нас, пришло время создать нашу военную промышленность, чтобы конкурировать на мировой арене."
 ARG_reformed_parliament: "Реформальный парламент"
 ARG_reformed_parliament_desc: "Серия реформ позже, и парламент теперь намного лучше организован, чем раньше."
 ARG_workers_in_parliament: "Рабочие в парламенте"
 ARG_workers_in_parliament_desc: "Наличие трудолюбивых работников среднего класса в парламенте позаботятся о том, чтобы рабочий класс получил наилучшие преимущества и реформы. В конце концов, работник понимает другого работника."
 ARG_federalized_society: "Федерализованное общество"
 ARG_federalized_society_desc: "Федерализация экономики принесла много преимуществ нашей экономике, не заставив обменять какой -либо из наших ценных ресурсов."
 ARG_recently_subsidized_industry: "Недавно субсидированные ключевые отрасли отрасли"
 ARG_nationalized_the_industry: "Национализированные ключевые отрасли"
 ARG_funded_public_works: "Финансированные общественные работы"
 ARG_funded_public_works_2: "Финансированные общественные работы"
 ARG_funded_public_works_3: "Финансированные общественные работы"
 ARG_hospital_militar_central: "Больница милитар Central"
 ARG_hospital_militar_central_desc: "Больница до сих пор оказалась очень успешной, и военные случаются в этом новом здании."
 ARG_accepted_debt_repayment: "Погашения долгов"
 ARG_accepted_debt_repayment_desc: "Иск, который был подан на нас, выглядит довольно мрачным. Мы надеялись, что Законодательное собрание защитит нас и осознает невиновность нашего правительства, однако, что было далеко от этого дела. Теперь мы должны погасить долг, который временно отменит нас."
 ARG_accepted_debt_repayments_6: "Полностью выплаченный долг"
 ARG_accepted_debt_repayments_6_desc: "Иск, который был подан на нас, был полностью окупился. Нам больше не нужно беспокоиться об этом."
 ARG_shadow_of_peron_ramon: "Тень Перона"
 ARG_shadow_of_peron_ramon_desc: "Будучи свежей и новой идеологией, в умах многих аргентинских перонизма рассматривается как спасительная грация для нашего экономического падения, и независимо от того, какое правительство находится во власти, люди всегда будут расти и ближе к Перону и его идеологии."
 ARG_disbanded_the_army: "Расформировал армию"
 ARG_disbanded_the_army_2: "Расформировал армию"
 ARG_gun_output: "Повышенная выход оборудования"
 ARG_viva_la_patria: "Viva La Patria"
 ARG_viva_la_patria_desc: "Абсолютно ничего, и никто не посмеет бросить вызов нашим сувертинге, и те, кто это делает, получат избиение на всю жизнь!"
 ARG_german_generals_advice: "Приглашенные немецкие советники"
 ARG_strived_for_autarky: "Autarky"
 ARG_smuggled_german_refugees: "Контрабандные немецкие беженцы"
 ARG_purged_the_peronists: "Очистить перонисты"
 ARG_purged_the_peronists_desc: "Мы очень эффективно имеем дело с мрамами, все овцы, которые следили за искаженными убеждениями Перона, помещаются на их место."
