 ARG_fm: "Dirección General de Fabracaciones Militares"
 ARG_fm_desc: "Fabricaciones Militares, полное название-Fabricaciones Militares Sociedad del Estado (испанская для военной промышленности Государственной корпорации), является государственным производителем аргентинских вооружений, базирующейся в Буэнос-Айресе. Компания была правительственным агентством под названием Mirección General De Fabricaciones Militares (Генеральный директор военной промышленности). Основанная в 1941 году, на протяжении многих лет компания диверсифицировалась в различных областях, таких как добыча, нефть, каллинг и нефтехимические вещества. Компания находится под руководством Аргентинского министерства обороны."
 ARG_fm_material: "Dirección General de Fabracaciones Militares"
 ARG_fm_material_desc: "Fabricaciones Militares, полное название-Fabricaciones Militares Sociedad del Estado (испанская для военной промышленности Государственной корпорации), является государственным производителем аргентинских вооружений, базирующейся в Буэнос-Айресе. Компания была правительственным агентством под названием Mirección General De Fabricaciones Militares (Генеральный директор военной промышленности). Основанная в 1941 году, на протяжении многих лет компания диверсифицировалась в различных областях, таких как добыча, нефть, каллинг и нефтехимические вещества. Компания находится под руководством Аргентинского министерства обороны."
 ARG_fm_air: "Dirección General de Fabracaciones Militares"
 ARG_fm_air_desc: "Fabricaciones Militares, полное название-Fabricaciones Militares Sociedad del Estado (испанская для военной промышленности Государственной корпорации), является государственным производителем аргентинских вооружений, базирующейся в Буэнос-Айресе. Компания была правительственным агентством под названием Mirección General De Fabricaciones Militares (Генеральный директор военной промышленности). Основанная в 1941 году, на протяжении многих лет компания диверсифицировалась в различных областях, таких как добыча, нефть, каллинг и нефтехимические вещества. Компания находится под руководством Аргентинского министерства обороны."
 ARG_ypf: "Yacimientos Petrolíferos Fircales"
 ARG_ypf_desc:0 "YPF S.A. (Yacimientos Petrolíferos Fiscales; English: "YPF S.A. (фискалы Yacimientos Petrolíferos; английский: «Фискальные нефтяные месторождения») - это вертикально интегрированная аргентинская энергетическая компания, занимающаяся разведкой и производством нефти и газа, а также транспортировкой, переработкой и маркетингом газовых и нефтяных продуктов. В 2020 году Forbes Global 2000 YPF был оценен в 1360 -й по величине общественной компании в мире. Основанная в 1922 году при администрации президента Hipólito Yrigoyen, YPF была первой нефтяной компанией, созданной в качестве государственного предприятия за пределами Советского Союза, и первая государственная нефтяная компания, которая стала вертикально интегрированной."
 ARG_invested_in_the_mining_industry: "Инвестировал в горнодобывающую промышленность"
 ARG_inflation_1: "Очень минимальная инфляция"
 ARG_inflation_1_desc: "Наша инфляция стабилизировалась до такой степени, что ее негативные последствия незначительны. Если мы продолжим то, как мы сейчас, мы сможем полностью избавиться от этого вредителя, который является инфляцией."
 ARG_inflation_2: "Минимальная инфляция"
 ARG_inflation_2_desc: "Наша инфляция сейчас отлично справляется, и негативные последствия не ощущаются так сильно. Мы должны продолжать идти, поскольку мы можем улучшить нашу текущую инфляционную ситуацию и полностью избавиться от нашей инфляции."
 ARG_inflation_3: "Небольшая инфляция"
 ARG_inflation_3_desc: "Наша инфляция может быть лучше, но сейчас это прилично. Нам нужно продолжить с нашими усилиями по контролю инфляции, если мы не хотим, чтобы она вышла из -под контроля и разрушила экономику."
 ARG_inflation_4: "Умеренная инфляция"
 ARG_inflation_4_desc: "Наша инфляция не велика, просто не отрицать. Мы должны начать предпринять действия, чтобы контролировать его, прежде чем он выйдет из -под контроля. Если мы станем слишком ленивыми, это вернется, чтобы укусить нас."
 ARG_inflation_5: "Что касается инфляции"
 ARG_inflation_5_desc: "Наша инфляция в настоящее время достигла точки, что многие из наших экономических консультантов обеспокоены. Что бы мы ни делали, мы должны остановиться, и сосредоточиться на контроле инфляции. Мы не можем позволить этому выскользнуть из наших рук."
 ARG_inflation_6: "Умеренно тяжелая инфляция"
 ARG_inflation_6_desc: "Наша нынешняя инфляция начинает оказывать свое влияние на средний аргентинский, причем многие бросают текущую валюту и используют доллар США. Мы должны действовать и быстро, чтобы это больше не проходило."
 ARG_inflation_7: "Тяжелая инфляция"
 ARG_inflation_7_desc: "Многие внешние экономические консультанты предупреждают нас, что инфляция быстро достигает неконтролируемого состояния. Нам нужно что -то сделать в это мгновенное, если мы не хотим, чтобы наша экономика поглотилась инфляцией."
 ARG_inflation_8: "Очень тяжелая инфляция"
 ARG_inflation_8_desc: "Наша инфляция достигает критического состояния. Компании быстро теряют денежную выгоду, многие люди зарабатывают меньше, цены на ADN стремительно растут. Многие люди уже совершенно отказались от нашей валюты и используют другую, что делает ситуацию еще хуже."
 ARG_inflation_9: "Безудержная инфляция"
 ARG_inflation_9_desc: "Наша инфляция достигла точки почти без возврата. Это стало настолько плохо, что компании закрываются из -за того, что они не получают достаточно денег, чтобы поддерживать свой бизнес. Это должно остановиться, а теперь!"
 ARG_inflation_10: "Гипер -инфляция"
 ARG_inflation_10_desc: "Наша инфляция достигла точки отсутствия возврата. Если мы как -то не найдем чудо и быстро, наша экономика погрузится, и наша страна полностью пойдет по канализации. Пусть кто -то нас спасет!"
 ARG_trying_to_control_inflation: "Пытается контролировать инфляцию"
 aresnal_naval_belgrano: "Арсенал военно -морской пуэрто -белграно"
 aresnal_naval_belgrano_desc: "Военно -морская база Puerto Belgrano (испанский: базовый военно -морской пуэрто -белграно - BNPB) является крупнейшей военно -морской базой аргентинского флота, расположенной рядом с Пунта -Альта, недалеко от Бахия -Бланка, около 560 км (348 миль) к югу от Буэнос -Айреса. Он назван в честь британского генерала Белграно (названного в честь Мануэля Белграно), который прозвучал область в конце 1824 года. Разработанный итальянским инженером Луисом Луигги, Пуэрто Белграно открылся 30 ноября 1896 года под названием Пуэрто -Милтар (английский: военный порт). В 1911 году французская железнодорожная компания Ferrocarril Rosario y Puerto Belgrano открыла широкую (5 футов 7 дюймов (1,70 м)) между Пуэрто-Белграно и Росарио. Гавань была переименована в Пуэрто Белграно в 1923 году."
 astillero_rio_santiago: "Афне"
 astillero_rio_santiago_desc: "Сервица Рио Сантьяго - это верфи, расположенная в городе Энсенада, провинция Буэнос -Айреса, на берегах реки Сантьяго. Это был один из основных активных и важных верфи в Латинской Америке. Основанная в 1953 году, он реализовал различные функции в военно -морском, промышленном и железнодорожном секторах. В своем золотом веке верфи достигла 8000 рабочих при двойной смене."
 great_south_american_war_name: "Великая южноамериканская война"
 great_south_american_war_name_desc: "После того, как между различными южноамериканскими нациями разразились различные бои и сражения, ясно, что главная война, несомненно, началась. Мы выиграем эту войну, независимо от того, какая стоимость может быть!"
 ARG_fm_industrial: "Dirección General de Fabricaciones Militares E Industriales"
 ARG_fm_industrial_desc: "Fabricaciones Militares, полное название-Fabricaciones Militares Sociedad del Estado (испанская для военной промышленности Государственной корпорации), является государственным производителем аргентинских вооружений, базирующейся в Буэнос-Айресе. Компания была правительственным агентством под названием Mirección General De Fabricaciones Militares (Генеральный директор военной промышленности). Основанная в 1941 году, на протяжении многих лет компания диверсифицировалась в различных областях, таких как добыча, нефть, каллинг и нефтехимические вещества. Компания находится под руководством Аргентинского министерства обороны."
