 URG_the_terra_dictatorship: "Терра -диктатура"
 URG_the_terra_dictatorship_idea: "Терра -диктатура"
 URG_the_terra_dictatorship_idea_desc: "Габриэль Терра управляет нацией железным кулаком с тех пор, как он принял власть. Благодаря этому, многие враги были сделаны по пути, и многие из них были обращены, арестовав их. Это наряду с несколькими переворотами превратило диктатуру в хрупкую, где вторая терра прекращает решение с жестокостью, страна будет сгореть в огне. \ n \ n§R, это не официальная идея, это просто заполнитель, чтобы рассказать вам, что происходит, эта идея будет удалена на следующий день. §!"
 URG_welfare_state: "Государство благосостояния"
 URG_welfare_state_desc: "Начиная с второго президентства Хосе Батлле и Ордонеса, текущая система включает в себя полные льготы по не разбиванию и пенсии для пожилых людей и инвалидов. Эта система позволила правительству получить поддержку нижнего класса, но она также ограничивает бюджет заявил, что правительство может потратить."
 URG_ancap_concern: "АНКАП"
 URG_ancap_concern_desc: "ANCAP (Short For Administación Nacional de Gubustibles, алкоголь Y Portland) - это нефтяная промышленность, созданная в 1931 году Габриэлем Терра. Несмотря на тип отрасли, она также фокусируется на контроле монополий на Alcahol и топливной промышленности. Эта отрасль изменится в зависимости от того, какие решения мы принимаем с нашим правительством."
 URG_safu: "Sociedad Anónima Fabril Uruguaya"
 URG_ute: "Usinas y trasmisiones eléctricas"
 URG_ute_desc: "Национальная администрация электростанций и электрической передачи, более известная под его аббревиатурой, является государственной компанией, которой поручено производство и поставку электроэнергии в Уругвай. Создан 21 октября 1912 года, когда был опубликован закон, который породил эту публичную компанию, в рамках реформистской и модернизации последовательных правительств Бэтллистов."
 URG_aserradero_oriental: "Aserradero Oriental"
 urg_ancap_trait: "Государственная компания"
 URG_udelar: "Уделар"
 URG_udelar_desc: "Universidad de la República (Udelar) - это общественный университет Уругвая и самый важный в стране."
 URG_PESMA: "Песма"
 URG_CIACA: "Циака"
 URG_SCRA: "Скраска"
 URG_Ford: "Ford Motors Uruguay"
 URG_debt_to_the_british: "Долг англичанам"
 URG_debt_to_the_british_desc: "Из -за наших различных промышленных расширений за последние несколько десятилетий мы собрали долг, который необходимо поплатить англичанам. Британцы ожидают, что мы вернем этот долг, и, поскольку мир нагревается вокруг нас, мы можем только надеяться, что ни одна крови не пролится с этой проблемой, и мы сможем заплатить ее мирно. \ n§R Эта идея будет удалена, когда все ваши долги для британцев будут погашены."
 URG_terra_loyalities: "Терра лоялисты"
 URG_violent_protests: "Насильственные протесты"
 URG_violent_protests_desc: "Люди вышли по улицам и начали проявляться по всей стране, заставляя многих невиновных терять свою жизнь, а страна - нанести ущерб. Мы должны остановить эти протесты и быстро, если мы хотим продолжать в качестве суверенной нации."
 URG_rebuilding_the_nation: "Восстановление нации"
 URG_economic_liberty: "Экономическая свобода"
 URG_economic_liberty_2: "Экономическая свобода"
 URG_improved_research: "Улучшенные исследования"
 URG_expanded_consription: "Расширенный призыв"
 URG_the_great_patriotic_war: "Великая патриотическая война"
 URG_the_great_patriotic_war_desc: "Серьезно ли эти аргентинцы верят, что они просто катятся на нас, как ничего? Что ж, они в черте удивления, потому что мы срадимся, и мы будем бороться до конец. Мы не будем сдаваться ни при каких обстоятельствах, независимо от того, сколько крови пролита, ни сколько времени на войну, мы позаботимся о том, чтобы даже если мы проиграем в долгосрочной перспективе, у них будет худшее время в их жизни."
 URG_maintaining_a_powerful_economy: "Поддержание мощной экономики"
 URG_building_up_an_airforce: "Создать воздушную силу"
 URG_building_up_an_airforce_desc: "С мощной воздушной силой мы можем доминировать в небе, и доминирование в небе даст нам преимущество в любом будущем конфликте."
 URG_privatized_industry: "Приватизированная отрасль"
 URG_privatized_industry_desc: "С приватизированной отраслью мы больше не можем вмешиваться непосредственно в экономику так же эффективно, как раньше. Однако приватизация нашей отрасли позволяет нам с новыми вариантами, которых у большинства других стран нет в их распоряжении."
 URG_political_deadlock: "Политический тупик"
 URG_anarcho_batllism_1: "Анархо-батллизм"
