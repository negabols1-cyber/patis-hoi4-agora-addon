  #Argentina 
  
 ARG_heavy_fighter_equipment_3: "I.ae 30 ñancú p1"
 ARG_heavy_fighter_equipment_3_short: "Ñancú p1"
 ARG_heavy_fighter_equipment_3_desc: "I.ae. 30 «ñancú», названный в честь местного орла Патагонии, был спроектирован итальянским инженером Чезаре Паллавичино, который приехал в Аргентину в 1946 году. Паллавичино возглавил команду аргентинских техников и инженеров в разработке концепции аргентского борца."
 ARG_strat_bomber_equipment_1: "Boeing B-17 Flying Fortress"
 ARG_strat_bomber_equipment_1_short: "B-17"
 ARG_strat_bomber_equipment_3: "Avro Lancaster"
 ARG_strat_bomber_equipment_3_short: "Avro Lancaster"
  
 ARG_fighter_equipment_0: "FMA D.21"
 ARG_fighter_equipment_0_short: "D.21"
 ARG_fighter_equipment_0_desc: "Dewotine D.21 представлял собой открытый истребитель для истребителей с открытым уколом с фиксированной пайкой, разработанный во Франции в 1920-х годах. 9 единиц D.21 были приобретены аргентинским правительством у швейцарского правительства в 1929 году. В 1930-х годах была приобретена лицензия, и местное производство началось в Cordoba до конца 1936 года, когда D.21 был заменен Hawk H-750."
 ARG_fighter_equipment_1: "FMA HAWK 75O"
 ARG_fighter_equipment_1_short: "Ястреб 75o"
 ARG_fighter_equipment_1_desc: "Ястреб 750 был одноместным монопланом, изготовленным Кертисом в 1930-х годах. «Dirección General de Aeronáutica» приобрел 30 единиц Curtiss Hawk H-75O, а затем приобрел лицензию Hawk H-75O под FMA для замены устаревшего D.21."
 ARG_fighter_equipment_2: "Fiar Cr.32"
 ARG_fighter_equipment_2_short: "Кр.32"
 ARG_fighter_equipment_3: "Североамериканский P-51 Mustang"
 ARG_fighter_equipment_3_short: "P-51 Mustang"
  
 ARG_cv_fighter_equipment_2: "Vought F4U Corsair"
 ARG_cv_fighter_equipment_2_short: "F4U Corsair"
 ARG_cv_fighter_equipment_2_desc: "Vought F4U Corsair был американским истребительным самолетом, который видел в основном во Второй мировой войне и Корейской войне. Аргентинское правительство приобрело 26 корсаров F4U для правительства США, которые были включены в «военно -морской истребитель и эскадрилья атаки», базирующуюся на базе «Пунта Индио»."
 ARG_cv_fighter_equipment_3: "Grumman f6f Hellcat"
 ARG_cv_fighter_equipment_3_short: "F6f Hellcat"
  
 ARG_nav_bomber_equipment_1: "Супермариновый морж"
 ARG_nav_bomber_equipment_1_short: "Справы"
 ARG_nav_bomber_equipment_1_desc: "Supermarine Walrus был британским одномоторным амфибийным бипланом, изготовленным британской авиационной компанией Supermarine. 2 единицы были приобретены Аргентиной и были назначены в военно -морской авиационный отдел военно -морского флота, где они служили до 1948 года."
 ARG_nav_bomber_equipment_2: "Короткий S25 Sunderland"
 ARG_nav_bomber_equipment_2_short: "S25 Sunderland"
 ARG_nav_bomber_equipment_3: "Мартин PBM Mariner"
 ARG_nav_bomber_equipment_3_short: "PBM Mariner"
 ARG_nav_bomber_equipment_3_desc: "PBM Mariner был военно-морским патрульным бомбардировщиком, изготовленным компанией Glenn L. Martin, которая впервые использовалась в 1940 году под военно-морским флотом США. 9 единиц были приобретены Аргентинским флотом, а затем были интегрированы в военно -морской авиационный отдел военно -морского флота."
  
 ARG_CAS_equipment_1: "Douglas Modelo 8a-2"
 ARG_CAS_equipment_1_short: "8a-2"
 ARG_CAS_equipment_1_desc: "Douglas Modelo 8A-2 был двухместным атакающим монопланом. Он был построен для авиационной компании Douglas Aircraft Company в качестве специального варианта Northrop A-17, причем 30 единиц производились и интегрированы в полк атаки № 2."
 ARG_CAS_equipment_2: "I.Ae 22 DL"
 ARG_CAS_equipment_2_short: "I.Ae 22 DL"
 ARG_CAS_equipment_3: "I.ae 30 ñancú pallavicino 2"
 ARG_CAS_equipment_3_short: "Ñancú P2"
 ARG_CAS_equipment_3_desc: "P2 Thancú представлял собой двухместный легкий бомбардировщик Cesare Pallavicino и изготовленный FMA. Это был вариант I.ae 30 ñancú, который имел более длинные крылья и более низкий вес из -за замены гонколов двигателя."
  
 ARG_tac_bomber_equipment_0: "Junkers Ju 52"
 ARG_tac_bomber_equipment_0_short: "JU 52"
 ARG_tac_bomber_equipment_1: "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_short: "FMA AeMB.2"
 ARG_tac_bomber_equipment_1_desc: "FMA AEMB.2 Bombi был бомбардировщиком, разработанным в Аргентине в середине 1930-х годов. Это был консольный моноплан обычной конфигурации. Он был оснащен фиксированным ход хвостового колеса, основные единицы которых были покрыты длинными, «брюками». Первоначальная конфигурация AEMB.1 была оснащена с дорсальной пулеметной башней, которая впоследствии удалена из AEMB.2 для улучшения стабильности. Пятнадцать примеров производства показали услуги с Аргентинскими ВВС между 1936 и 1945 годами."
 ARG_tac_bomber_equipment_2: "Североамериканский B-25 Митчелл"
 ARG_tac_bomber_equipment_2_short: "B-25 Митчелл"
 ARG_tac_bomber_equipment_3: "I.ae 24 Calquín"
 ARG_tac_bomber_equipment_3_short: "Calquín"
 ARG_tac_bomber_equipment_3_desc: "I.ae.24 Calquin (слово Mapudungun, которое означает «Королевский орл») был тактическим бомбардировщиком, разработанным и построенным Instituto Aerotécnico в Córdoba. Установленным после успешного комара де Хавилленда, у Calquín была деревянная структура, похожая на FMA AEMB.2, и был первым самолетом с двумя двигателями, разработанным и построенным в Аргентине. 101 единицы этого самолета были построены, а последний был выведен из эксплуатации в 1960 году."
  
 ARG_jet_fighter_equipment_1: "FMA I.Ae. 27 «Пульки I»"
 ARG_jet_fighter_equipment_1_short: "«Пульки I»"
 ARG_jet_fighter_equipment_1_desc: "I.ae. 27 Pulqui I был аргентинским самолетом, разработанным в Instituto Aerotecnico в 1946 году. Был завершен только один прототип; Неудовлетворительная производительность привела к тому, что самолет заменил более поздний дизайн. Фузеляж был полумонокок, с эллиптическим поперечным сечением корпуса одного двигателя Rolls-Royce Derwent 5 с воздухозаборником в носу и воздуховодом, окружающим кабину."
 ARG_jet_fighter_equipment_2: "FMA I.Ae. 27 «Пульки II»"
 ARG_jet_fighter_equipment_2_short: "«Пульки II»"
 ARG_jet_fighter_equipment_2_desc: "FMA IAE 33 Pulqui II представлял собой самолет для одноэтажного истребителя с одним сиденьем, разработанный Kurt Tank в конце 1940 -х годов в Аргентине, под правительством Перона, и построенным FMA. Его рамка была сделана исключительно из металла, а кабинка была под давлением с крышкой типа пузыря."
  
