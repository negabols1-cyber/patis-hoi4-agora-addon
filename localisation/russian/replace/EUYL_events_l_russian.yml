l_russian:
 ### EUYL ### 
  
 argentina.1.t: "Какой город мы должны сделать столицу?"
 argentina.1.d: "С нашим недавним завоеванием важного города Буэнос -Айреса возникает дилемма. Должны ли мы сделать Buenos Aires столицей, или мы должны держать Парана столицей? Оба города имеют исторические значения для аргентинской конфедерации. \ N \ n Paraná был столицей первоначальной конфедерации после отделения Буэнос -Айреса, а Буэнос -Айрес был и был столицей как конфедерации, так и каждого аргентинского правительства."
 argentina.1.a: "Сделайте Buenos Aires столицей"
 argentina.1.b: "Держите Парана столицей"
 news.360.t: "Аргентинская конфедерация снова установлена"
 news.360.d: "После того, как националистические настроения начались в Аргентине, многие люди снова начали верить в Конфедерацию как спасительную благодать, которая позволит стране продвигаться вперед и зарекомендовать себя как региональная власть. После жестокой гражданской войны, в которой конфедерация вышла победителем, нужно задаться вопросом, что они собираются делать сейчас. \ n \ n только время покажет, что воскресение некогда отмененного состояния вызовет на этой планете."
 news.360.a: "Подождите, в Америке есть более одной конфедерации?"
 news.360.b: "Мир теперь узнает нашу истинную силу!"
 argentina.2.t: "Аргентина просто аннексировала Уругвай!"
 argentina.2.d: "Уругвай всегда был областью ключевого интереса. Попустить это так же, что не может быть сделано. \ n \ n с момента окончания цисплатиновой войны и Великобритании заставляют нас отпустить наши территории в Уругвае, она всегда действовала как почти буферная территория, где ни одна страна не может и должна дотронуться до нее. Это предложение уважалось до сегодняшнего дня, где появились новости о том, что Аргентина аннексировала Уругвай. \ n \ n Аргентинцы не будут ожидать атаки от нас в данный момент, поэтому, чем раньше мы пересекаем границу, тем лучше. Поймать их врасплох будет ключевым в том, чтобы заставить эту операцию работать. \ n \ n Итак, что мы должны делать, мы должны вмешаться и вмешаться, или мы должны сдержать и позволить им иметь Уругвай?"
 argentina.2.a: "Взади, договор был подписан, и договор будет уважать!"
 argentina.2.b: "Может быть, лучше, чтобы мы просто позволили им иметь это"
 argentina.3.t: "Бразилия объявила нам войну!"
 argentina.3.d: "После нашей аннексии Уругвая правительство Бразилии решило ответить, объявив нам войну. Всего несколько часов назад появились сообщения о том, что бразильские солдаты пересекли границу возле провинции Мизионы. \ n \ n, какой бы ни был их разум для объявления войны с нами, абсолютно никакой ценности на международной арене, и они будут одни в этом конфликте, как и должно быть."
 argentina.3.a: "Если эти проклятые бразильцы хотят войны, то они получат ее!"
 news.738.t: "Вторая цисплатиновая война"
 news.738.d: "После довольно неожиданного вмешательства Уругвая правительством Аргентины, правительство Бразилии решило ответить, вторгся на них, утверждая, что было неправильно просто вмешиваться в дела Уругвая так, как это делали аргентинцы. \ n \ n стычки уже происходят вокруг границы, и многие обеспокоены тем, что эта война может превратиться в кровь, причем обе стороны одинаково стремятся сражаться с другой. \ n \ n только время покажет, как развивается этот конфликт, однако ситуация выглядит довольно мрачной."
 news.738.a: "Что, черт возьми, происходит на этом континенте?"
 news.738.c: "Мы покажем этим аргентинцам, что вы не связываетесь с суверенитетом других!"
 news.738.b: "Эти теплые зажигатели появились на шоу, и, о, мальчик, они собираются получить шоу!"
 argentina.4.t: "Мы нанесли весь необходимый ущерб Бразилии"
 argentina.4.d: "Поскольку потери, складывающиеся на бразильской стороне, и во многих их городах и южной территории заняты, вряд ли бразильцы захотят продолжить эту войну. \ n \ n Должны ли мы заключить с ними мир, воспользоваться ситуацией и требовать Санта -Катарины или просто продолжить войну?"
 argentina.4.a: "Принести мир с бразильцами"
 argentina.4.b: "Принести мир и спросить Рио -Гранде Сул"
 argentina.4.c: "Продолжайте идти"
 argentina.5.t: "Аргентина хочет провести мирные переговоры"
 argentina.5.d: "Аргентинские дипломаты прибыли сегодня, чтобы обсудить мирные переговоры. \ n \ n В этой войне сильно наложила на наши ресурсы, рабочую силу и промышленность. \ n \ n Пока не было ничего хорошего из этого конфликта. \ n \ n, рассматривая нашу текущую ситуацию, какой выбор мы сделаем?"
 argentina.5.a: "Принять мирное предложение"
 argentina.5.b: "Мы боремся за дело! Продолжайте войну!"
 argentina.5.c: "Принять мир и принять мизионы"
 argentina.6.t: "Аргентина требует Рио -Гранде Сул и иметь мир"
 argentina.6.d: "Аргентинские дипломаты прибыли сегодня, требуя мирных переговоров и нашего штата Рио -Гранде Сул. \ n \ n В этой войне сильно наложила на наши ресурсы, рабочую силу и промышленность. \ n \ n Пока не было ничего хорошего из этого конфликта. \ n \ n, рассматривая нашу текущую ситуацию, какой выбор мы сделаем?"
 argentina.6.a: "Вмешиваться в их требования"
 argentina.6.b: "То, кто думает эти аргентинцы? Продолжайте войну!"
 argentina.7.t: "Бразилия принимает наше предложение"
 argentina.7.d: "Бразилия приняла наше предложение, и между нашими народами больше не будет вооруженного конфликта."
 argentina.7.a: "Большой! Бразильцы сделали правильный выбор!"
 argentina.8.t: "Бразилия отвергает наше предложение"
 argentina.8.d: "Бразилия только что вернулась к нам, сказав, что они отвергают наше предложение. \ n \ n состояние вооруженного конфликта останется между нашими народами."
 argentina.8.a: "Разве они не заботятся о благополучии своей страны?"
 argentina.9.t: "Аргентинцы требуют Фолклендс"
 argentina.9.d: "Аргентинские дипломаты прибыли сегодня в Лондон, чтобы сказать нам, что они требуют, чтобы мы уступили им Фолклендские острова. \ n \ n мы даем им Фолкленды или мы отказываемся?"
 argentina.9.a: "Пусть им это будет, потеря нескольких островов не причинит никакого вреда"
 argentina.9.b: "Действительно ли эти аргии думают, что мы собираемся дать им даже дюйм нашей земли?"
 argentina.10.t: "Британская пещера по нашему требованию"
 argentina.10.d: "Британцы отреагировали на наших дипломатов, сказав, что они принимают наши требования и уступит территорию."
 argentina.10.a: "Большой! Может быть, британцы не так уж и плохие"
 argentina.11.t: "Британцы отказываются от наших требований"
 argentina.11.d: "Британцы отреагировали на наших дипломатов, заявив, что они не принимают наши требования и не дадут нам территорию."
 argentina.11.a: "Эти проклятые пираты увидят нашу мощь!"
 argentina.12.t: "Аргентинцы требуют Южной Грузии"
 argentina.12.d: "Аргентинские дипломаты прибыли сегодня в Лондон, требуя, чтобы мы уступили территорию Южной Джорджии. \ n \ n мы даем им южную Грузию или мы отказываемся?"
 argentina.12.a: "Пусть им это будет, едва ли кто -то там живет"
 argentina.12.b: "Абсолютно нет! Мы ничего не даем этим Арги!"
 argentina.13.t: "Аргентина требует Тариджи!"
 argentina.13.d: "Аргентина требует, чтобы мы уступили им провинцию Тариджа, территорию, которой мы в настоящее время владеем. \ n \ n Однако у нас нет армии, чтобы противостоять им, так что, может быть, лучшим выбором было бы покинуть. Что мы должны делать?"
 argentina.13.a: "Дай им Тариджу"
 argentina.13.b: "Если нам нужно, мы будем бороться за нашу землю!"
 argentina.14.t: "[From.GetName] Пещеры в наших требованиях"
 argentina.14.d: "[From.GetName] Правительство только что ответило на наши требования, заявив, что они уступит нам территорию Тариджи."
 argentina.14.a: "Они выбрали легкий путь"
 argentina.15.t: "[From.GetName] отказался дать нам Тариджу!"
 argentina.15.d: "[From.GetName] Правительство ответило на наши требования, заявив, что они не дадут нам территорию Тариджи. Они утверждают, что если им придется бороться за территорию, то они будут до самого последнего солдата!"
 argentina.15.a: "О, они увидят нашу мощь!"
 argentina.16.t: "Аргентина требует, чтобы мы дали им Санта -Катарину!"
 argentina.16.d: "Аргентина требует, чтобы мы дали им Санта -Катарина, территорию, которой они владели в начале своей жизни в качестве страны. Тем не менее, они больше не владеют этим, и у нас есть эта территория уже много десятилетий, и люди там более бразильские, чем аргентинец. \ n \ n Должны ли мы сдаться или отказаться?"
 argentina.16.a: "Нам нужно поддерживать мир, даже если это за счет нашей территории"
 argentina.16.b: "Они действительно думают, что мы сдам так легко?"
 argentina.17.t: "Бразилия руки через Санта -Катарину"
 argentina.17.d: "Правительство Бразилии пришло с мирным разрешением передачи нам в штат Санта -Катарина. С этой новой территорией мы на шаг ближе к достижению нашей конечной цели."
 argentina.17.a: "Рад, что мы могли бы иметь мирное решение с бразильцами"
 argentina.18.t: "Бразилия отказывается дать нам Санта -Катарину"
 argentina.18.d: "Правительство Бразилии отреагировало на наши требования, твердо заявив, что Санта -Катарина является их территорией и что они не передадут нам территорию."
 argentina.18.a: "Эти чертовы бразильцы"
 news.339.t: "Большая аргентинская конфедерация рождается"
 news.339.d: "После различных завоеваний против ее соседей, забрав у них территорию и вызывая большую напряженность в Южной Америке, Аргентинская конфедерация объявила, что теперь они будут называться «большей аргентинской конфедерацией». Нация, кажется, намного сильнее, чем ожидали другие ранее, и, будучи фашистской силой, может даже изменить поток войны в Европе."
 news.339.a: "Я думаю, отлично подходит для них?"
 news.339.b: "Теперь мир действительно увидит нашу мощь!"
 news.339.c: "Они заплатят за то, что они сделали!"
 argentina.19.t: "Аргентина хочет присоединиться к нашей фракции"
 argentina.19.d: "Аргентина просит присоединиться к нашей фракции. У нас не только общий враг, но и их убеждения также коррелируют с нашими убеждениями. \ n \ n мы должны впустить их?"
 argentina.19.a: "Конечно, впустите их!"
 argentina.19.b: "Они недостаточно заслуживают доверия"
 argentina.20.t: "Германия приняла нашу просьбу присоединиться к оси"
 argentina.20.d: "Немецкие дипломаты отреагировали на нашу просьбу присоединиться к оси положительно, и теперь мы будем в их фракции."
 argentina.20.a: "Отлично, теперь пришло время сосредоточиться на нашем общем враге!"
 argentina.21.t: "Германия отказалась от нашей просьбы присоединиться к оси"
 argentina.21.d: "Немецкие дипломаты ответили на нашу просьбу присоединиться к оси. Они сказали нам, что не хотят принять нас в нашу фракцию."
 argentina.21.a: "Тогда они умрут в одиночестве!"
 argentina.22.t.ucravictor: "UCRA (Concordancia) выиграла выборы"
 argentina.22.t.ucrvictor: "UCR выиграл выборы"
 argentina.22.t.psvictor: "Partido socialista выиграла выборы"
 argentina.22.d: "Выборы здесь, после 6 лет, когда Агустин Педро Юго теперь мы насчитывали голоса, и страна решила, кто должен привести нашу нацию к величию. \ n \ nwhoEne наступает, будем просто надеяться, что они знают, что они делают, и решат проблемы, с которыми сталкивается наша страна."
 argentina.22.a: "Мы не разочаруемся!"
 argentina.23.t: "Аргентина предлагает экономический альянс между нашими народами"
 argentina.23.d: "Дипломаты Аргентины сегодня прибыли в Мадрид, чтобы не только поздравить нас с нашей недавней победой в гражданской войне, но и с тем, чтобы предложить экономический альянс между нашей нацией. Дипломаты сказали нам, что обе наши экономические сотрудники помогут обеим странам одинаково, и, по -видимому, нет недостатков. Не только это, но и экономическое сотрудничество также позволит нам развиваться ближе к связям с Аргентиной, и может быть довольно полезно иметь союзника из Южной Америки. \ n \ n Доу принять их предложение о экономическом сотрудничестве?"
 argentina.23.a: "Абсолютно, почему бы нам не?"
 argentina.23.b: "Нам не нужен «договор» от этих аргентинцев"
 argentina.24.t: "Испания принимает наше экономическое сотрудничество"
 argentina.24.d: "Испанские дипломаты отреагировали на наших дипломатов, заявив, что они готовы продолжить этот экономический альянс и предоставлять любые товары или услуги, необходимые для его работы."
 argentina.24.a: "Большой! Пусть обе наши экономики извлекут выгоду из этого договора"
 argentina.25.t: "Испания отказывается от нашего экономического сотрудничества"
 argentina.25.d: "Испанские дипломаты отреагировали на наших дипломатов, заявив, что они не примут наше предложение об экономическом альянсе."
 argentina.25.a: "Позорно"
 argentina.26.t: "Роберто уходит от власти"
 argentina.26.d: "Президент объявил сегодня, что он больше не сможет возглавить нацию. Его диабет достиг до сих пор до такой степени, что он едва видит, что долгое время с другими ухудшающимися состояниями здоровья делает Роберто неспособным возглавить нацию. На данный момент нам понадобится вице -президент, чтобы возглавить нацию."
 argentina.26.a: "Что будет принести будущее для этой нации?"
 argentina.27.t: "Аргентина стремится присоединиться к союзникам"
 argentina.27.d: "Аргентинские дипломаты прибыли сегодня в Лондон, чтобы обсудить, может ли их нация присоединиться к нашему альянсу. Быть демократическим государством, союзник в Южной Америке не было бы такой плохой вещью. \ n \ nshuld мы впустили их?"
 argentina.27.a: "Принимать"
 argentina.27.b: "Отклонить"
 argentina.28.t: "Британия позволит нам в союзников"
 argentina.28.d: "Британцы отреагировали на наших дипломатов, заявив, что они будут более чем готовы допустить нас в союзников."
 argentina.28.a: "Большой!"
 argentina.29.t: "Британия отказалась допустить нас в союзников"
 argentina.29.d: "Британцы отреагировали на дипломатов, которые мы им послали, заявив, что они не допустят нас своей фракцией."
 argentina.29.a: "Думаю, мы идем один сейчас"
 argentina.30.t: "Аргентина предлагает военный альянс"
 argentina.30.d: "Аргентина только что связалась с нами с довольно внезапным предложением, военным альянсом. \ n \ nalthough у нас есть очень тесные связи с Европейским Западом, было бы хорошо иметь другого союзника в либеральном стиле, чтобы работать вместе. \ n \ nshuld мы примем их предложение?"
 argentina.31.t: "Американцы приняли наше предложение"
 argentina.31.d: "Американцы ответили, заявив, что они готовы составить военный альянс между нашими 2 странами"
 argentina.31.a: "Большой!"
 argentina.32.t: "Американцы отказались от нашего предложения"
 argentina.32.d: "Американцы отказались от нашего предложения сделать союз, считая его «бессмысленным»."
 argentina.32.a: "Эти чертовы американцы"
 argentina.33.t: "[FROM.GetName] хочет вздремнуть с нами"
 argentina.33.d: "[FROM.GetName] обратился к нам с довольно простым запросом, подписанием неагрессионного пакта. Они согласились с тем, что и они, и их союзники будут готовы принять смену с нами и отпустить любые военные действия между нашими народами. \ n \ nshould мы примем?"
 argentina.33.a: "Конечно"
 argentina.33.b: "Нам не нужен ни один из ваших «договоров»"
 argentina.34.t: "[FROM.GetNameDEF] принял наше предложение"
 argentina.34.d: "[FROM.GetNameDEF] вернулся к нам, заявив, что они согласны подписать сон."
 argentina.35.t: "[FROM.GetNameDEF] отказался от нашего предложения"
 argentina.35.d: "[FROM.GetNameDEF] вернулся к нам, заявив, что они не подписывают сон с нами."
 argentina.35.a: "Они что -то задумали"
 argentina.36.t: "Аргентина просит Фолклендс"
 argentina.36.d: "Аргентинские дипломаты прибыли сегодня, чтобы обсудить вопрос о Фолклендах. Теперь, когда обе наши страны находятся в хороших отношениях и являются союзниками, они считают, что для них было бы справедливо контролировать острова. Они даже говорят, что готовы помочь нам в будущем в компенсации за нас, давая им острова. Должны ли мы позволить им иметь острова?"
 argentina.36.a: "Конечно, они могут иметь их"
 argentina.36.b: "Нет, они наши острова"
 argentina.37.t: "Британцы позволяют нам иметь Фолклендс"
 argentina.37.d: "Британцы позволили нам взять под контроль Фолклендс с простым просьбой заботиться об первоначальном британском населении."
 argentina.37.a: "Отлично, мы обязательно позаботимся о них"
 argentina.38.t: "Британцы не позволят нам контролировать Фолклендс"
 argentina.38.d: "Британцы отреагировали на наших дипломатов, заявив, что они не позволят нам взять под контроль островки."
 argentina.38.a: "Эти чертовы британцы ..."
 argentina.39.t: "Аргентина просит Южную Грузию"
 argentina.39.d: "Аргентинские дипломаты прибыли сегодня, чтобы обсудить проблему Южной Джорджии. Теперь, когда обе наши страны находятся в хороших отношениях и являются союзниками, они считают, что для них было бы справедливо контролировать остров. Они даже говорят, что готовы помочь нам в будущем в компенсации за нас, давая им острова. Должны ли мы позволить им иметь остров?"
 argentina.40.t: "Британцы позволяют нам иметь Южную Грузию"
 argentina.40.d: "Британцы позволили нам взять под контроль Южную Джорджию с простым просьбой заботиться об первоначальном британском населении."
 argentina.41.t: "Британцы не позволят нам контролировать Южную Джорджию"
 argentina.42.t: "Аргентина требует контроля над острова Вознесения и Святой Елены"
 argentina.42.d: "Аргентинское правительство только недавно связалось с нами, спрашивая, могут ли они контролировать остров Вознесения и Святой Елены. \ n \ nThis позволит им контролировать все море Южного Атлантического моря, так что мы должны позволить им обладать такой территорией?"
 argentina.43.t: "Британия позволила нам занять остров Вознесения и Святой Елены"
 argentina.43.d: "Британцы отреагировали на нас, заявив, что они позволят нам контролировать острова и полностью контролировать Южную Атлантику."
 argentina.44.t: "Британия не позволит нам контролировать остров Вознесения и Святой Елены"
 argentina.44.d: "Британцы ответили на нашу просьбу, заявив, что они не позволят нам контролировать острова."
 argentina.45.t: "Перон отправляется в Италию"
 argentina.45.d: "Перон покинул страну и направляется в Италию после того, как министерство военного управления поручило ему сделать это. \ n \ n ему поручено узнать об тактике итальянской войны и узнать о горных войнах в итальянских Альпах. Он планирует остаться не менее 2 лет, прежде чем отправиться обратно в Аргентину. Только время покажет, вернется ли он с итальянскими фашистскими идеалами, и пока мы должны просто подождать."
 argentina.45.a: "Удачи, Перон"
 argentina.46.t: "Перон вернулся в Аргентину"
 argentina.d.46: "После некоторое время остановившись за границей, Перон вернулся в Аргентину с новыми знаниями об тактике войны, но и о политических идеалах и иностранных отношениях. \ n \ nwith вновь обретенные знания, опыт и связи ясно, что Перон будет пытаться подняться по рядам в стране."
 argentina.46.a: "Добро пожаловать, Перон"
 argentina.47.t: "Великий переворот"
 argentina.47.d: "После нескольких месяцев тщательного планирования и анализа, фракции военных наконец -то имели достаточно нынешнего правительства и взяли дело в свои руки. Нынешний президент и его коллеги сегодня вынуждены вытеснить из розового дома, и военные генералы единогласно решили вместо этого поместить Перон. \ n \ n это внезапное изменение власти поначалу приведет к довольно трудному для Перона, однако он кажется многообещающим."
 argentina.47.a: "Да направит нас Бог"
 argentina.48.t: "Скандал с военными больницей"
 argentina.48.d: "Спустя почти полгода после инаугурации военной больницы в Паломаре сенатор Бенджамин Вильяфанье разместил иск на нас и военных для этой самой больницы. Причина судебного процесса была связана с продажей земли для военной больницы. Земли были проданы по гораздо большей цене, чем они были на самом деле. Сенатор утверждает, что остальные деньги, которые еще необходимо выплатить, должны быть рассеяны среди депутатов и сотрудников, а также функционеров в министерстве войны. \ n \ nall, что мы можем сделать сейчас, это ждать сенаторов в законодательном собрании, чтобы проголосовать, невиновны ли мы или нет, и должны ли нам вернуть деньги."
 argentina.48.a: "Будем надеяться, что законодательное собрание поймет, что мы невиновны"
 argentina.49.t: "Законодательное собрание единогласно согласилось, что мы невиновны"
 argentina.49.d: "Сенаторы проголосовали, и результаты находятся. Подавляющее большинство сенаторов проголосовали, что и Роберто, и правительство невиновны и не обязаны возвращать деньги обратно. Фактически, 170 голосов были в пользу нашей невиновности, в то время как только один был против нашей невиновности."
 argentina.49.a: "Похоже, у сенаторов есть наши спины"
 argentina.50.t: "Законодательное собрание проголосовало, что мы должны погасить долг"
 argentina.50.d: "Сенаторы проголосовали, и результаты находятся. Чуть более половины сенаторов проголосовали, что мы на самом деле виновны в таких действиях и что мы должны погасить долг. Довольно грустно, что сенаторы не могут видеть тот факт, что мы невиновны, но мы должны соблюдать."
 argentina.50.a: "Мы не можем никому доверять"
 argentina.51.t: "Военные не довольны администрацией [Root.GetLeader]"
 argentina.51.d: "[Root.GetLeader] Администрация до сих пор не была очень приятной для многих секторов армии, и различные части военных начали сговор с правительством, надеясь свергнуть ее. \ n \ nplans уже начались, и это неизвестно, каковы их окончательные намерения. Все, что мы знаем, так это то, что если этот «переворот» не рассматривается сразу, у нас очень серьезные проблемы."
 argentina.51.a: "ЧТО! Эти чертовы ублюдки!"
 argentina.52.t: "Военные выполнили свой заговор"
 argentina.52.d: "Военные выполнили свой долгожданный заговор. После нескольких месяцев тщательного планирования, кажется, весь ад был освобожден. \ n \ нельзя сказать, каким будет будущее этой страны, однако, будущее будет выглядеть довольно мрачным."
 argentina.52.a: "Да спасли бы нас от этого ада"
 argentina.53.t: "Что мы должны делать с ополченцами?"
 argentina.53.d: "С гражданской войной, у нас все еще есть вопрос о том, что делать с оставшимися ополченцами. \ n \ non One Hand, мы можем держать их в армии и, возможно, даже обучить их быть еще лучше, и, с другой стороны, мы можем распустить их и сохранить как рабочую силу, которая использовалась для тех ополченцев, и приобретенное ими оборудование. \ n \ nwhat мы должны сделать?"
 argentina.53.a: "Держите их"
 argentina.53.b: "Расформировать их и накапливать оборудование и рабочую силу"
 argentina.54.t: "Рамирес вынужден уйти от власти"
 argentina.54.d: "После повышения напряженности в мире, напряженность также поднималась за кулисами. После перерезания всех связей с японцами и немцами, многие сторонники первоначального переворота больше не видят, как Рамирес пригоден возглавить нацию, и решили свергнуть его. \ n \ n Человек, ведущий этих людей в наш Рамирес? Эдельмиро Джулиан Фаррелл, один из главных участников военного заговора, который был исполнен около года назад. Внезапное переключение власти может застать многих людей врасплох и даже может бросить страну в беспорядки, поэтому мы больше всего надеемся, что этого не произойдет."
 argentina.54.a: "Что, черт возьми, даже происходит!"
 argentina.55.t: "Ситуация Аргентины в 1939 году"
 argentina.55.d: "Роберто показал себя компетентным лидером на данный момент, однако, его состояние здоровья ухудшается быстро с тех пор, как он был избран. Врачи не знают, сколько еще он продлится, и грубые оценки предполагают, что он будет вынужден уйти в отставку около 1942 года. \ N \ nas с ситуацией Перона, он в настоящее время находится в Италии, изучая горную войну. Остерегайтесь его прибытия, однако, когда ваша политика начнет меняться, когда он прибудет."
 argentina.55.a: "Понятно"
 argentina.56.t: "Аргентина подделает нашу политику"
 argentina.56.d: "Дипломаты из аргентинской конфедерации прибыли сегодня в Монтевидео, чтобы обсудить планы с нашей фашистской партией. \ n \ nfrom Внешний вид вещей не кажется хорошим, и даже может оказаться разрушительным, если мы позволим. Однако, несмотря ни на что, некоторые из наших людей фактически поддерживают это и даже выступают за аннексию. \ n \ nwhate, как это сделали аргентинцы, нам нужно ответить на это и быстро, что мы должны делать?"
 argentina.56.a: "Пусть они не должны причинять нам вреда в будущем"
 argentina.56.b: "Черт, нет, просто кто эти аргентинцы думают, что они есть?!"
 argentina.57.t: "Уругвайцы позволили нам повлиять на их политику"
 argentina.57.d: "Официальное заявление появилось сегодня из Уругвая, в котором говорилось, что они позволят подделать свою политику, если это не нанесет вреда людям."
 argentina.57.a: "Отлично, наш план может начать"
 argentina.58.t: "Уругвайцы подвели нас"
 argentina.58.d: "Уругвайцы подвели нас, и наши планы были разрушены. К сожалению, от внешней части вещей, кажется, у нас не будет легкой аннексии Уругвая."
 argentina.58.a: "Думаю, нам придется сделать это трудным путем"
 argentina.59.t: "Аргентина объявила войну с Уругваем!"
 argentina.59.d: "Мы только сейчас получили новость о том, что аргентинские войска пересекли границу уругвайцев, с тем, что кажется аннексированными намерениями. В последний раз, когда Аргентина пробовала что -то похожее на это, мы вмешались и защищали Уругвай от аргентинской аннексии, и эта ситуация кажется слишком знакомым. \ n \ nshuld мы помогли нашим братьям и сестрам и сестрам и отбили аргентинцы?"
 argentina.59.a: "Безусловно, мы не пролили кровь в предыдущей войне без причины!"
 argentina.59.b: "Извините, Уругвай, но мы не можем вам помочь"
 argentina.60.t: "Бразилия поможет нам на войне!"
 argentina.60.d: "Бразильские дипломаты прибыли сегодня в Монтевидео, обещая их помощь и полную поддержку во время войны. Они будут отправлять войска и оборудование, чтобы отбиться от аргентинцев."
 argentina.60.a: "Спасибо, Бразилия! Время показать аргентинцам, из чего мы действительно сделаны!"
 argentina.61.t: "Бразилия поможет Уругваю в этом конфликте!"
 argentina.61.d: "Многие из наших солдат на переднем крае сообщают о бразильских войсках, мобилизующихся на фронт -линии Уругвайя, и даже стреляют в наших солдат, сигнализируя только одну возможность: Бразилия помогает Уругвай. Ситуация кажется нам мрачной, но победа все еще возможна."
 argentina.61.a: "Эти проклятые бразильцы заплатят! Оба будут заплатить!"
 argentina.62.t: "Новый раздор и патрон"
 argentina.62.d: "Здравствуйте, надеюсь, у вас будет потрясающий день. Прошу прощения за прерывание вашей сессии HOI4, но если вы, пожалуйста, прочитаете это очень быстро, это будет означать для меня мир. \ n \ nThere теперь является раздором для мода, где каждому разрешено присоединиться и общаться о моде, поговорить со мной, сообщать об ошибках, предложить новые вещи и т. Д. и т. Д. Заходите и присоединяйтесь к веселью, я буду ждать вашего сообщения об присоединении. \ n \ non jonse Note, у меня сейчас есть Patreon, поэтому, если вы хотите пожертвовать и помочь мне в создании мода, вы можете. Ссылка будет прямо под ссылкой на разброс и в нижней части описания мода. Любая сумма очень поможет мне, и я буду всегда благодарен за вашу доброту!"
 argentina.62.a: "Понял"
 chile.18.t: "Новый раздор и патрон"
 chile.18.d: "Здравствуйте, надеюсь, у вас будет потрясающий день. Прошу прощения за прерывание вашей сессии HOI4, но если вы, пожалуйста, прочитаете это очень быстро, это будет означать для меня мир. \ n \ nThere теперь является раздором для мода, где каждому разрешено присоединиться и общаться о моде, поговорить со мной, сообщать об ошибках, предложить новые вещи и т. Д. и т. Д. Заходите и присоединяйтесь к веселью, я буду ждать вашего сообщения об присоединении. \ n \ non jonse Note, у меня сейчас есть Patreon, поэтому, если вы хотите пожертвовать и помочь мне в создании мода, вы можете. Ссылка будет прямо под ссылкой на разброс и в нижней части описания мода. Любая сумма очень поможет мне, и я буду всегда благодарен за вашу доброту!"
 chile.18.a: "Понял"
 news.340.t: "Анархистское восстание в Чили"
 news.340.d: "После нескольких месяцев политической нестабильности и массовых протестов, жители Чили поднялись сегодня, чтобы бороться за свои идеалы, однако единственная проблема заключается в том, что у них нет идеалов. Анархисты не хотят ничего, кроме отсутствия правительства или единой власти, государство, управляемое только народом. Многие страны уже беспокоятся о анархистах, теперь, когда в двух отдельных частях света существует 2 восстания. \ n \ Неизму времени покажет, что произойдет, но мы не можем позволить анархизму управлять планетой."
 news.340.a: "Отлично, именно то, что нам нужно ..."
 news.340.b: "Сейчас наше время сиять!"
 news.340.c: "ЧТО????????"
 argentina.63.t: "Вымытые немецкие подводные лодки"
 argentina.63.d: "Сегодня многие жители Мар -дель -Плата сообщили о двух немецких подводных лодках, которые промывают на побережье после их потери во второй мировой войне. \ n \ nit предназначен для предположений, как они попали сюда, что случилось с членами экипажа, и какова была их задача, чтобы они были так близки к Южной Америке. Технологии \ n \ ntheir кажутся довольно продвинутыми, и мы даже можем использовать эти подводные лодки для улучшения наших собственных подводных лодок."
 argentina.63.a: "Давайте посмотрим на них!"
 argentina.65.t: "Инфляция слегка ухудшается"
 argentina.65.d: "Наша инфляция недавно усилилась по разным причинам. Спайк не кажется слишком плохим, и похоже, что его можно контролировать, но тем временем мы должны следить за нашей инфляцией и убедиться, что он не выходит из -под контроля."
 argentina.65.a: "Мы будем иметь дело с этой несчастной инфляцией!"
 argentina.66.t: "Инфляция сильно ухудшается"
 argentina.66.d: "Денежная стоимость нашей валюты недавно разбилась и заставила нашу инфляцию временно взлететь. Это далеко не идеально и потенциально может разрушить наши планы остановить инфляцию. Тем не менее, мы должны справиться с этой неудачей и убедиться, что она не привлекает нас. Для большего блага Аргентины!"
 argentina.66.a: "Какого черта?!"
 argentina.67.t: "Аргентина слишком агрессивно расширяется!"
 argentina.67.d: "Аргентина недавно объявила войну еще одной нации в надежде расширить свою территорию еще дальше. Это должно остановиться сейчас, иначе они получат слишком много энергии! Не только это, но мы также можем получить свою личную выгоду от вмешательства в их конфликт, так что мы вмешаемся?"
 argentina.67.a: "Мы не должны вмешиваться"
 argentina.67.b: "Вниз с аргентинцами!"
 argentina.68.t: "Должны ли мы сформировать пакт о борьбе с печю-боливией"
 argentina.68.d: "Со второй войной Конфедерации в полном разгаре и различных других народах во время войны с Конфедерацией следует спросить: следует ли мы создать фракцию среди всех нас и помогать друг другу против этой угрозы? \ n \ nfor теперь ответ ..."
 argentina.68.a: "Да"
 argentina.68.b: "Нет"
 argentina.69.t: "Авраам Швейзер скончался"
 argentina.69.d: "Новости пришли к нам, что один из наших лучших генералов и полевых маршалов, Авраам Швейзер, погиб в аварии. \ n \ n Вся страна будет оплакивать его смерть, и его смерть не будет в вене. Нам нужно убедиться, что этого не повторится снова."
 argentina.69.a: "Пусть он упокоится с миром"
 argentina.70.t: "Кто должен возглавить Конфедерацию?"
 argentina.70.d: "Спустя всего несколько дней после начала нашей гражданской войны человек по имени Мануэль Карлс выразил свое возражение против того, чтобы Нимио был лидером, и в качестве лидера Лиги Патриотики Аргентина он считает, что его партия должна быть той, кто контролирует нацию. \ n \ n Выбор теперь зависит от людей, кто возглавит Конфедерацию между ними?"
 argentina.70.a: "Мануэль Карлс"
 argentina.70.b: "Нимио де Анкин"
 news.341.t: "Великая южноамериканская война"
 news.341.d: "После недавнего объявления о войне аргентинцами различные другие южноамериканские страны объявили войну Аргентине в надежде остановить их экспансионистские амбиции. \ n \ nmany Outlookers предполагают, что в то время как в Аргентине очень мало шансов на то, что они выиграют такой конфликт, если они действительно приведут к такому подвиге, они могут получить слишком большую власть в регионе. \ n \ nmany боятся, насколько кровавой может быть эта война, она может стать даже самым кровавым конфликтом в истории Южной Америки. Нам просто придется подождать и посмотреть."
 news.341.a: "Разве этот континент не самым скучным? Черт возьми?!"
 news.341.b: "Они будут платить своей кровью! Мобилизовать резервы!"
 news.341.c: "Аргентинцы не имеют шансов!"
 argentina.71.t: "Землетрясение в Сан -Хуане 1944 года"
 argentina.71.d: "Sad News сегодня поразила жителей [ROOT.GetName], так как землетрясение составляет около 6,7 до 7,8 величины по провинции Сан -Хуан. По оценкам, в этой трагедии погибли около 10 000 человек, и вскоре может появиться еще много других. \ n \ nnot это только это, но землетрясение сильно повредило инфраструктуру провинции и многие здания. Стоимость исправления всех этих ущерба будет большой, и это деньги, которые нам придется пожертвовать от других частей экономики, чтобы осуществить. \ n \ nall мы можем сделать сейчас, это скорбят тех, кто погиб, и устанавливает новые правила, чтобы предотвратить такую ​​трагедию снова."
 argentina.71.a: "Пусть эти бедные души покопаются с миром"
  
  
 argentina.rework.1.t: "Должны ли мы провести предстоящие выборы?"
 argentina.rework.1.d: "6 -летний срок Юсто приближается к концу, и люди ожидают, что выборы скоро пройдут. Однако, однако, есть право просто не проводить выборы и поддерживать Юсто в власти, в конце концов, военные должны поддержать нас и справиться с людьми, которые могут противостоять этому. \ n \ nin конец, выбор зависит от нас. Что мы будем делать ..."
 argentina.rework.1.a: "Держите выборы"
 argentina.rework.1.b: "Юстао останется у власти, несмотря ни на что!"
 argentina.rework.2.t: "Коррупционный скандал"
 argentina.rework.2.d: "Коррупция в стране вызвала скандал на политической сцене нации. Коррумпированные политики тянут струны, чтобы принести пользу себя, не заботясь о кого -либо еще. \ n \ nwhat мы должны делать с этим беспорядком?"
 argentina.rework.2.a: "Бросить вызов этому"
 argentina.rework.2.b: "Давайте просто подметим его под ковер"
 argentina.rework.3.t: "Коррумпированный олигарх был найден!"
 argentina.rework.3.d: "После проведения обширного расследования в нашем правительстве мы обнаружили довольно сомнительные действия от определенных людей. Теперь, когда они у нас есть в наших руках, что мы должны делать?"
 argentina.rework.3.a: "Заставить их сожалеть об этом"
 argentina.rework.3.b: "Подметать наши выводы под ковром"
 argentina.rework.4.t: "Расследование оказалось неудачным"
 argentina.rework.4.d: "Наше расследование оказалось провалом, поскольку наши следователи не смогли найти каких -либо конкретных доказательств о любой форме коррупции или коррумпированных политиков, присутствующих в правительстве."
 argentina.rework.4.a: "Мы могли бы получить лучшие результаты в следующий раз"
 argentina.rework.ALN.t: "Формирование алианзы Либертадоры Националиста"
 argentina.rework.ALN.d: "Новости пришли к нам, что легион Civica Argentina была распущена и вместо этого превратилась в Alianza Libertadora Nacionalista под руководством Хуана Квералето. \ n \ nthey - экстремистская партия, которая очень похожа на партию NSDAP в нацистской Германии. Нам нужно осторожно следить за этой новой партией, они не могут быть хорошими."
 argentina.rework.ALN.a: "Мы должны быть осторожны"
 argentina.rework.5.t: "Фашистская террористическая атака в [CURRENT_STATE.GetName]"
 argentina.rework.5.d: "Репортеры новостей затопили радиоприемники, когда появились сообщения о неспровоцированной террористической атаке фашистской партии. Нам нужно быстро справиться с ними и помешать им продолжать этот дикий буйный!"
 argentina.rework.5.a: "Они заплатят за это!"
 argentina.rework.6.t: "Штаб -квартира ALN найдена"
 argentina.rework.6.d: "После нашего недавнего завершения беспорядка, вызванного ALN, мы нашли довольно интригующую информацию об их штаб -квартире. С их штаб -квартирой у них не будет выбора, кроме как молчать и вспоминать. \ n \ nwhat's следующее должно быть очевидным."
 argentina.rework.6.a: "Нацеливаться и уничтожить его!"
 argentina.rework.7.t: "Военные недовольны нашим нынешним правительством"
 argentina.rework.7.d: "Напряжение в политической сцене Аргентины быстро выходило из -под контроля, и военные очень внимательно следят за тем, как мы управляли нацией, и, судя по всему, они далеко не довольны нашими нынешними действиями. \ n \ nvarious наших генералов напрямую выпустили нам предупреждение, заявив, что, если ситуация в стране продолжит обостряться, будут серьезные последствия."
 argentina.rework.7.a: "Черт возьми, мы должны быть осторожны"
 argentina.rework.8.t: "Военные окружили розовый дом"
 argentina.rework.8.d.notHistorical: "По мере того, как мы говорим, все, что мы можем сделать, это наблюдать за беззащитными, поскольку у военных есть розовый дом, главное правительственное здание Аргентины и место, где президент обладает всей административной властью, полностью окружил и приказывает нам уйти от руководства нации. Теперь мы не имеем представления о том, как они получили такую ​​большую власть или финансирование, но мы действительно имеем подсказку, так это серьезность этой ситуации и наша неспособность ответить. \ n \ nwith не осталось, чтобы запасать, что мы должны делать?"
 argentina.rework.8.d.historical: "По мере того, как мы говорим, все, что мы можем сделать, это наблюдать за беззащитными, поскольку у военных есть розовый дом, главное правительственное здание Аргентины и место, где президент обладает всей административной властью, полностью окружил и приказывает нам уйти от руководства нации. Основными преступниками этого, должно быть, были Gou (Grupo de Oficiales Unidos), тайно финансируемый и растущий во власти, не замечая нас. \ n \ nwhat мы должны сделать сейчас?"
 argentina.rework.8.a: "Пусть они возьмут на себя"
 argentina.rework.8.b: "Над нашими могилами, Viva La Patria"
 argentina.rework.9.t: "Люди выходят на улицы в знак протеста"
 argentina.rework.9.d: "Многие люди по всей стране начали протестующие, требующие стабильности и процветания в стране. Их голоса со временем будут только громче, и их проблемы показывают, насколько ужасной ситуация попадает здесь, в Аргентине."
 argentina.rework.9.a: "Мы позаботимся о них"
 argentina.rework.10.t: "Инфляция попадает в экономику!"
 argentina.rework.10.d: "В то время как мы раньше не боролись с инфляцией, сегодня рынок разбился как инфляционный кризис, который теперь бурвает на нашей и без того слабой экономике. \ nmarkets изо всех сил пытаются сохранить себя, и люди спешат в банки, чтобы снять любые деньги, которые они могут иметь, только ухудшая ситуацию."
 argentina.rework.10.a: "Это последнее, что нам нужно"
 argentina.rework.11.t: "Мы были введены в политическую борьбу"
 argentina.rework.11.d: "Выборы 1937 года очень сильно нанесли у нас очень тяжелый ущерб, так как мы были вынуждены быть на пальцах пальцев все это время, чтобы люди голосовали за нашу партию. Это, однако, побудило противостоящие стороны воспользоваться ситуацией и инвалидно, оспаривая наше господство. \ n \ nwe не сможет что -либо сделать, пока мы сильно нанесем ответный удар."
 argentina.rework.11.a: "Мы справимся с этим"
 argentina.rework.12.t: "Правительство инициировало расследование"
 argentina.rework.12.d: "Опасаясь потенциальных коррумпированных олигархов или политиков в стране, правительство начало тщательное расследование по всей стране, чтобы попытаться остановить это. \ n \ nif мы позволили им продолжить это расследование, они могут узнать о наших лояльных союзниках, помогающих нам в тени, и мы не можем допустить, чтобы это произошло."
 argentina.rework.12.a: "Мы должны положить конец этому"
 argentina.rework.13.t: "Военные требования увеличивают финансирование"
 argentina.rework.13.d: "Военные предложили свою поддержку в тени, в обмен на то, что мы увеличили их финансирование и власть в стране. \ n \ nif мы не соблюдаем, могут быть серьезные последствия."
 argentina.rework.13.a: "Хорошо, мы сделаем это"
 argentina.rework.13.b: "Не происходит"
 argentina.rework.14.t: "Олигархи требуют большей власти"
 argentina.rework.14.d: "Олигархи по всей стране были недовольны той властью, которую они в настоящее время имеют, и требуют большей политической власти по стране. \ n \ nshuld мы согласны с их требованиями?"
 argentina.rework.15.t: "Олигархи требуют повышенной зарплаты"
 argentina.rework.15.d: "Олигархи в нашей стране были недовольны своей нынешней зарплатой и требуют больше денег, чтобы быть перенаправленным на них, чтобы сохранить их поддержку. \ n \ nshuld мы подготовимся к их требованиям?"
 argentina.rework.16.t: "Политики в Буэнос -Айресе требуют перенаправленных фондов"
 argentina.rework.16.d: "Коррумпированные политики из Буэнос -Айреса требуют, чтобы общенациональные финансы были централизованы исключительно в Буэнос -Айресе. Большая часть наших преимуществ исходила от капитала, и не соблюдение их требований может привести к потере их поддержки. \ n \ nshould мы согласны?"
 argentina.rework.17.t: "Олигархи поддерживают нас"
 argentina.rework.17.d: "Олигархи недавно были очень довольны тем, как мы их относились, и они согласились погасить нас за наши поступки."
 argentina.rework.17.a: "Большой!"
 argentina.rework.18.t: "Аргентинцы по всей стране предлагают взять оружие"
 argentina.rework.18.d: "Нынешняя ситуация нашей страны быстро разваливается. Иностранные солдаты въезжают в нашу страну, и наша армия выступает против нападения. В разгар всего этого хаоса аргентинцы по всей стране предложили взять оружие, чтобы защитить La Patria. \ n \ nshall мы принимаем их помощь и позволяем им присоединиться к профессиональным солдатам на переднем крае?"
 argentina.rework.18.a: "Защитник La Patria!"
 argentina.rework.18.b: "Извините, но этого не может произойти"
 argentina.rework.20.t: "Гражданская война наконец закончилась"
 argentina.rework.20.d: "После потери многих бесчисленных жизней, доблестных жертв и уничтоженных дорог Аргентина, наконец, снова цела. Это действительно жаль, через что пришлось пройти наша прекрасная нация, но самое главное, что теперь мы можем взять на себя ответственность и выдвинуть Аргентину, которая действительно заслуживает внимания в глобальном масштабе. \ n \ n Мир, наконец, увидит истинный потенциал Аргентины, и больше мы не будем смехом для кого -либо еще!"
 argentina.rework.20.a: "Viva La Patria!"
 argentina.rework.21.t: "Успешный захват оборудования"
 argentina.rework.21.d: "Мы были Ableto успешно в состоянии проникнуть в вражескую фабрику вооружений и украсть некоторые из их оружия!"
 argentina.rework.21.a: "Идеальный!"
 argentina.rework.22.t: "Враг крадет некоторые из наших оружия!"
 argentina.rework.22.d: "Вражеские контингенты смогли пройти мимо наших фронта и украсть некоторые из наших оружия!"
 argentina.rework.22.a: "Нам нужно быть более осторожным"
 argentina.rework.23.t: "Неудачный захват оборудования"
 argentina.rework.23.d: "Наши солдаты поймали, пытаясь украсть вражеские оружия!"
 argentina.rework.23.a: "Пусть они покоятся с миром"
 argentina.rework.24.t: "Вражеские солдаты были пойманы, пытаясь украсть часть нашего оборудования!"
 argentina.rework.24.d: "Некоторые из наших гавров на заводе вооружений поймали вражеских солдат, пытающихся проникнуть в себя и украсть некоторые из наших оружия! К счастью, с ними сталкивались."
 argentina.rework.24.a: "Хороший"
 argentina.rework.25.t: "[FROM.GetName] украл некоторые из наших заводов!"
 argentina.rework.25.d: "Хотя это кажется и звучит безумно верить, тайные агенты и сторонники анархизма в нашей стране и Аргентине в совокупности штурмовали некоторые из наших оружия и промышленных фабрик, угрожая работникам фабрики оставить в Аргентину и приступили к тому, чтобы итога! \ n \ nThis Savage Act просто позорный! Что мы должны делать?"
 argentina.rework.25.a: "Мы заставим их заплатить в другой день"
 argentina.rework.25.b: "Они не сойдут с рук!"
 argentina.rework.26.t: "Анархистка Аргентина вмешивается в нашу политику!"
 argentina.rework.26.d: "Это не было просто совпадением, что внезапная популярность разрыва анархистского государства в нашей стране. Вдали от этого, основной причиной этого является Аргентина. Они вмешивались с нашей политикой и людьми и пытались внедрить свои больные, извращенные взгляды в наших людей! \ n \ nwhat мы должны сделать?"
 argentina.rework.30.t: "[FROM.GetName] убил наших анархистских повстанцев!"
 argentina.rework.30.d: "Новости достигли нашей штаб -квартиры в Ушуайе, что [FROM.GetName] старается изо всех сил, чтобы полностью уничтожить любое и все анархистское влияние на их страну, убив некоторых наших людей в процессе. \ n \ nhow мы должны ответить?"
 argentina.rework.30.a: "Они не сойдут с рук с этим!"
 argentina.rework.30.b: "Мы не можем позволить себе вторжение прямо сейчас"
 argentina.rework.31.t: "[FROM.GetName] требует нашего субнегации"
 argentina.rework.31.d: "[FROM.GetName] потребовал, чтобы мы уступили им и позволили их правительству полностью контролировать нашу страну. Это означало бы отказ от нашей независимости! \ n \ nwhat мы должны сделать?"
 argentina.rework.31.a: "У нас даже есть выбор?"
 argentina.rework.31.b: "Над нашими мертвыми могилами!"
 argentina.rework.32.t: "[FROM.GetName] просит у нас помощь!"
 argentina.rework.32.d: "Делегаты из [FROM.GetName] пришли в нашу страну, попросив любую помощь, которую мы можем предложить им в их усилиях. \ n \ nthey пока держат свои собственные, однако им нужна вся помощь, которую они могут получить. \ n \ nhaving Союзник в самом сердце Южной Америки может оказаться полезным, так что мы должны делать?"
 argentina.rework.32.a: "Мы предоставим вам несколько оружия"
 argentina.rework.32.b: "Мы отправим вам добровольцев"
 argentina.rework.32.c: "Мы отправим вам военные облигации"
 argentina.rework.32.e: "Почему мы должны вам что -нибудь дать?"
 argentina.rework.34.t: "[FROM.GetName] решил не помочь нам!"
 argentina.rework.34.d: "[FROM.GetName] лишал нас своих ресурсов, чтобы помочь нам в наших военных усилиях!"
 argentina.rework.34.a: "Ну, они могут гнить в аду!"
 argentina.rework.35.t: "Политические враги берут оружие!"
 argentina.rework.35.d: "Сопротивление среди провинций в нашей стране растет с тех пор, как мы взяли власть. Многие всегда были против нашего правительства, и переломный момент только что достигнут. Кажется, что они планируют подземную полномасштабную революцию, чтобы свернуть, но мы не будем так легко упасть!"
 argentina.rework.35.a: "Они заплатят своей кровью!"
 argentina.rework.36.t: "Социалисты получают больше мест в Конгрессе"
 argentina.rework.36.d: "После различных пропагандистских кампаний и усилий социалисты получили больше мест в Конгрессе и повысили признание на национальном уровне. \ n \ nthey продолжит продвигаться вперед и попытаться получить еще больше мест и потенциально выиграть выборы."
 argentina.rework.36.a: "Хорошо"
 argentina.rework.37.t: "Военные назначили Перон поехать в Чили"
 argentina.rework.37.d: "Различные высокопоставленные сотрудники RNKing решили отправить Хуана Доминго Перона в Чили на миссию в качестве военного атташе, чтобы получить больше внутренних знаний о текущей ситуации страны, а также потенциально получить доступ к новым знаниям о вознаграждении, которые в настоящее время доступны только числами. \ n \ nas Президент Аргентины, согласитесь ли вы с этим назначением или пойдете против него?"
 argentina.rework.37.a: "Отправить его в Чили"
 argentina.rework.37.b: "Военные не будут нас борнуть"
 argentina.rework.38.t: "Военные назначили Перон поехать в Италию"
 argentina.rework.38.d: "Различные офицеры с высоким уровнем RNKing решили отправить Хуана Доминго Перона в Италию на миссию, чтобы получить больше знаний о нынешней ситуации страны, а также узнать больше об тактике и навыках итальянской войны и навыки, необходимой для борьбы с высокими высоты. Перону также было поручено изучить итальянскую экономику и ее политику, получив еще более глубокое понимание итальянского образа жизни и, что самое важное, способ фашизма. \ n \ nas Президент Аргентины, согласитесь ли вы с этим назначением или пойдете против него?"
 argentina.rework.38.a: "Отправить его в Италию"
 argentina.rework.38.b: "Военные не будут нас борнуть"
 argentina.rework.39.t: "[ARG.GetLeader] диагностирован с диабетом"
 argentina.rework.39.d: "После регулярной проверки с доктором доктору не осталось выбора, кроме как дать Роберто в его состоянии невозможных новостей о его состоянии. Доктор заявил, что по скорости его диабет ухудшается, он в конечном итоге останется полностью слепым и будет вынужден уйти в отставку с должности. Страшные новости об этом значимости попали в дома и улицы Аргентины, а сторонники Роберто опустошены. \ n \ nwe нужно стараться изо всех сил, чтобы помочь Роберто в любом случае, так что нельзя гарантировать, сделает ли он это или нет."
 argentina.rework.39.a: "Разрушительный..."
 argentina.rework.40.t: "Американец, посланник, прибывает в Аргентину"
 argentina.rework.40.d: "После того, как [USA.GetLeader] узнал о состоянии Роберто, он решил лично отправить одного из лучших офтальмологов в стране, Рамона Кастровиехо, Аргентине, чтобы посмотреть, сможет ли он что -нибудь помочь, чтобы помочь в состоянии Роберто и, возможно, даже вылечить это. \ n \ n шансы невелики, но презрение Роберто к полномочиям оси является достаточной мотивацией для США, чтобы попытаться помочь нам любым возможным способом."
 argentina.rework.40.a: "Мы очень ценим помощь!"
 argentina.rework.41.t: "Вопрос о лидерстве ..."
 argentina.rework.41.d: "С учетом выборов, один из основных вопросов ставит себя в основу: кто примет командование Конкорсией? \ n \ nwe могли остаться с Роберто Марселино Ортисом, его сильная воля и неизменная менталитет обязательно помогут нам в отчаянные времена печально известного десятилетия. \ n \ non nome hand, у нас есть Леопольдо Мело, великий адвокат, дипломат и политик. \ n \ nour Последний потенциальный вариант - Робустиано Патрон Костас, нынешний губернатор Salta. \ n \ nwho следует выбрать?"
 argentina.rework.41.a: "Держите Роберто"
 argentina.rework.41.b: "Выберите Леопольдо"
 argentina.rework.41.c: "Выберите Рорустиано"
 argentina.rework.42.t: "Подземные военные движения были замечены"
 argentina.rework.42.d: "В последнее время растут различные анонимные отчеты о различных секторах армии, сотрудничающих странными и довольно загадочными способами. \ n \ nas od теперь у нас нет неэла относительно того, что они задумали, но, судя по текущей ситуации в округе, это вполне может оказаться очень плохой вещью. Нам нужно держать нашу охрану."
 argentina.rework.42.a: "Ха! Как будто они сделают что -нибудь с нами"
 argentina.rework.44.t: "Формирование gou"
 argentina.rework.44.d: "Первоначально то, что было просто слухами и предположениями, оказалось реальностью, как различные генералы, военные лидеры и правые политики объединили силы, чтобы сформировать Grupo de Oficiales Unidos, или GOU для краткости. \ n \ nthey стремится раз и навсегда иметь дело с нестабильностью в Аргентине и преодолеть проблемы, с которыми мы сталкивались в течение печально известного десятилетия. \ n \ nthey's уже заявили, что они будут достигать своих целей любым способом, необходимым, что означает, что кровь может быть пролита, если дела пойдут на юг."
 argentina.rework.44.a: "Как раз то, что нам нужно ..."
 argentina.rework.45.t: "Гу набирает более плотное сцепление по стране"
 argentina.rework.45.d: "В качестве попытки получить больше власти над страной и оказывать большее влияние на нашу политику, Гу взял под контроль еще одно государство. \ n \ nif это продолжает, мы больше не сможем их бросить вызов!"
 argentina.rework.45.a: "Они не сойдут с рук с этим!"
 argentina.rework.46.t: "Артуро Роусон вынужден уйти в отставку"
 argentina.rework.46.d: "После всего лишь 3 дней лидера, Гоу решил, что достаточно после того, как Артуро не слушал их требования. \ n \ npedro Palo Ramirez будет тем, кто возьмет под свой контроль и заменит Артуро Роусона после такого скандала, вызванного лидером, который не был лидером даже на неделю."
 argentina.rework.46.a: "Хорошо?"
 argentina.rework.47.t: "Перон поднимается в пределах государственных рангов"
 argentina.rework.47.d: "Получив некоторое признание за его усилия как извне, так и внутри страны, многие другие высокопоставленные правительственные чиновники были довольны выступлениями Перона и решили продвигать его в рядах Gvernment. На данный момент это отличная новость, но есть шанс, что он получит признание общественностью и может даже начать расти значимыми последователями."
 argentina.rework.47.a: "Хорошо"
 argentina.rework.48.t: "Поддержка Peron растет по всей стране"
 argentina.rework.48.d: "Официально став частью правительства, а также относительно высокого чиновника ранжирования, многие солдаты, а также обычные гражданские лица начали любить Перон, полагая, что его методологии и образ мышления могут быть спасительной грацией Аргентины после десятилетий медиократии. \ n \ nwe нужно следить за Пероном и его поддержкой, так как он может очень легко выйти из -под контроля."
 argentina.rework.48.a: "Это не хорошо ..."
 argentina.rework.49.t: "Перонисты собираются, чтобы протестовать против тюремного заключения Перона"
 argentina.rework.49.d: "Когда мы подумали, что Перон уйдет в прошлом после его официального тюремного заключения, мы не могли бы быть неправы. Сотни тысяч человек вышли на улицы в знак протеста против того, чтобы протестовать за окружение Перона и требовать его освобождения. \ n \ ntheir числа огромны, и если мы не справляемся с ними быстро, это может оказаться очень плохим!"
 argentina.rework.50.t: "Перонистская партия выигрывает от оползня!"
 argentina.rework.50.d: "После того, как поддержка перониста достигла критической точки, перонисты потребовали выборов, чтобы увидеть, кто должен быть лидером Аргентины. Благодаря большому выбору, мы были вынуждены подчиняться, и, к чему никому удивить, Перон выиграл с значительным отрывом над оппозицией и вступим в должность сегодня."
 argentina.rework.50.a: "Большой"
 argentina.rework.51.t: "Перон был освобожден!"
 argentina.rework.51.d: "После многих маршей в качестве протеста против решения правительства заключить в тюрьму Перон, они, наконец, подгонялись к нашим требованиям и будут официально освободить его и повторно размещать его в правительстве сегодня! \ n \ nour протесты оказались успешными!"
 argentina.rework.52.t: "Перон был заключен в тюрьму"
 argentina.rework.52.d: "После тревожного роста поддержки Перона правительство решило принять смелое решение и заключить в тюрьму Перон, чтобы предотвратить его влияние на развитие любого в стране. \ n \ nlet дает понять как день, чтобы они сделали ужасный выбор, и они заплатят за то, что сделали!"
 argentina.rework.52.a: "Перон будет освобожден!"
 argentina.rework.53.t: "Оппозиция обвиняет нас в победе"
 argentina.rework.53.d: "После нашей победы на выборах 1937 года различные члены от оппозиционных партий обвинили нас в том, что наша победа является незаконной. В то время как большинство аргентинцев не верят в это, значительная часть согласна с этими претензиями и считает, что мы не выиграли выборы чисто."
 argentina.rework.53.a: "Большой..."
 argentina.rework.54.t: "Успешное обнаружение подозрительных генералов"
 argentina.rework.54.d: "Наш поиск был успешным! Мы смогли точно определить и найти всех генералов, которые занимались интригами за спиной! О них позаботятся быстро."
 argentina.rework.54.a: "Очень хороший"
 argentina.rework.55.t: "Наша поисковая операция имеет неприятные последствия"
 argentina.rework.55.d: "После тщательного изучения всех наших генералов мы не смогли найти тех, кто отвечает за интриги за спиной. Из-за нашей неудачи они использовали эту слабую точку в нашем правительстве, чтобы убедить других генералов и начать полномасштабное подавление против нашего правительства!"
 argentina.rework.55.a: "Эти Vendepatrias будут рассмотрены быстро!"
 argentina.rework.56.t: "Военные повстанцы против нас!"
 argentina.rework.56.d: "После недовольства военных из -за наших различных действий и реформ они прямо решили восстать против нас! \ n \ nwe нужно держать их под контролем, прежде чем они попробуют что -нибудь еще!"
 argentina.rework.56.a: "Эти чертовы крысы!"
  
 argentina.fascist.1.t: "Кто должен представлять легионскую гражданскую аргентину?"
 argentina.fascist.1.d: "У нас есть выбор, чтобы сделать теперь, когда мы создали коалицию, и кто должен контролировать LCA? \ n \ nour Выбор между спокойным и уравновешенным Хуаном Квералето, и жестким и жестоким Хуан Баутиста Молина. \ n \ nwho, мы выберете?"
 argentina.fascist.2.t: "Какая сторона должна принять доминирование в коалиции?"
 argentina.fascist.2.d: "Теперь, когда мы запустили наши планы, на нас выбор: какая сторона должна иметь приоритет над остальными и по -настоящему представлять коалицию? \ n \ nour Choice значительно изменит нашего лидера и политики, связанного с ним, поэтому тщательно подумайте об этом решении, каков план действий. \ n \ n стороны, которая возглавит нас, ..."
 argentina.fascist.2.a: "Легион Civica Argentina"
 argentina.fascist.2.b: "Partido Fashista Argentino"
 argentina.fascist.2.c: "Лига Патриотика Аргентина"
 argentina.fascist.2.e: "Политические независимые"
 argentina.fascist.3.t: "Выборы 1937 года были отменены"
 argentina.fascist.3.d: "После растущего напряженности в стране из -за быстрого роста новорожденной фашистской партии нынешнее аргентинское правительство решило, что это будет лучший курс действий, чтобы отменить предстоящие выборы, чтобы сосредоточиться на внутренних вопросах в стране."
 argentina.fascist.3.a: "Идеальный!"
 argentina.fascist.4.t: "Если Walther Darre представляет политических независимых"
 argentina.fascist.4.d: "После прибытия в Аргентину Дарр довольно быстро получил поддержку от фашистов. Его опыт в нацистской Германии позволил ему быстро набрать популярность, и с такой популярностью приходит выбор ... Должны ли мы назначить его лидером политических независимых?"
 argentina.fascist.4.a: "Конечно! Он кажется опытным"
 argentina.fascist.4.b: "Держите Лугона как лидера"
 argentina.fascist.5.t: "Федералистский поглощение"
 argentina.fascist.5.d: "После различных месяцев работы и злоупотребления хрупкой ситуацией в стране, федералисты начали тотальный переворот, а Леопольдо Лугоны отвечали. Федералисты заняли все должности страны и снова выделили себя как аргентинскую конфедерацию. \ n \ n nThere, вероятно, будет унитарным противодействием таким внезапным изменениям правительства, но со временем это должно утихнуть."
 argentina.fascist.5.a: "Новая эра начинается сейчас!"
 argentina.fascist.6.t: "Гитлер прибывает в Аргентину"
 argentina.fascist.6.d: "После того, как национальный крах вернулся в Германию, Гитлер и его жена оба знали, что им нужно сбежать, иначе они будут убиты оппозицией. После исчезновения своих вариантов, одна страна выделялась .. наша. Гитлер знал, что один из его самых верных министров не только отправился в Аргентину, но и стал лидером нации. Судя по его вариантам, он нашел на Аргентину как лучшую страну, в которую можно сбежать. \ n \ nthis приводит нас к нашей нынешней дилемме: что мы делаем с Гитлером?"
 argentina.fascist.6.a: "Впусти его"
 argentina.fascist.6.b: "Дайте ему роль в правительстве; Он полезен"
 argentina.fascist.6.c: "Он не останется здесь намного дольше"
 argentina.fascist.7.t: "Вопрос об Адольфе Гитлере"
 argentina.fascist.7.d: "После недавнего продвижения в правительстве опыт Гитлера в этой области и течь со словами и эмоциями заставило его очень быстро получить поддержку по всей стране. Он не только обладает популярной поддержкой, но и поддержкой некоторых рядов военных и различных секторов недавно созданного правительства. \ n \ n Вопрос ... должен ли он взять власть над страной или оставаться просто просто политическим советником?"
 argentina.fascist.7.a: "Прямо сейчас нам нужен лидер с железным сердцем!"
 argentina.fascist.7.b: "Мы не можем позволить такой сумасшедшему принять силу!"
  
 news.368.t: "Папское государство объявлено в Аргентине"
 news.368.d: "После католического поглощения в Аргентине под священником Хулио Мейнвиэль ситуация была касалась, но не о чем беспокоиться. Однако, однако, значительно изменился, так как сейчас священник автоматически декорировал Аргентину в качестве нового официального папского государства, осуждая первоначальное папство и утверждая, что это является фальшивой копией. \ n \ nleaders по всему миру настолько сбиты с толку этим, что большинство даже не знают, что делать, но одна вещь наверняка: у Meinvielle есть опасные амбиции!"
 news.368.a: "Он шутит ... верно?"
 news.368.b: "Аминь, да благословит Бог эти мерзкие существа"
  
  
 argentina.posadistambitions.1.t: "Посадистские амбиции | Выиграть гражданскую войну"
 argentina.posadistambitions.1.d: "С гражданской войной в полном разгаре, Посадас усердно отметил нашим высокопоставленным офицерам и депутатам быстро сделать оппозицию, чтобы как можно быстрее восстановить страну."
 argentina.posadistambitions.1.a: "Для революции!"
 argentina.posadistambitions.2.t: "Посадистские амбиции | Восстановить экономику"
 argentina.posadistambitions.2.d: "Посадас выпустил еще один приказ: восстановить избитую экономику и продвинуть страну вперед. \ n \ nit будет сложной задачей, но Посадас уверен, что мы сможем выполнить это в свое время."
 argentina.posadistambitions.3.t: "Посадистские амбиции | Раздавить повторные олигархи"
 argentina.posadistambitions.3.d: "С момента завершения гражданской войны надоедливые олигархи внутри страны заметили, что их понимание страны ухудшилось, и пытаются очень бесполезно попытаться вернуть доминирование. \ n \ nposadas очень недовольны этими людьми и хотели бы, чтобы они были «решены»"
 argentina.posadistambitions.4.t: "Посадистские амбиции | Улучшить национальную инфраструктуру"
 argentina.posadistambitions.4.d: "Для того, чтобы иметь успешную страну, для всех дорог в стране, чтобы быть адекватно подключенным, имеет первостепенное значение, чтобы разрешить ресурсы, товары, люди и военные, чтобы с относительной легкостью перемещаться из любой точки в любой точке страны. \ n \ n мы получили поручено улучшить национальную инфраструктуру в стране."
 argentina.posadistambitions.5.t: "Посадистские амбиции | Подготовьтесь к расширению"
 argentina.posadistambitions.5.d: "После восстановления в основном из гражданской войны, Посадас считает, что пришло время начать готовить нацию и ее народ к тому, что должно произойти. Революция в конце концов не распространяется."
 argentina.posadistambitions.6.t: "Посадистские амбиции | Образуйте полядист la plata"
 argentina.posadistambitions.6.d: "Люди, проживающие в Парагвае и Уругвае, страдают от несчастной природы капиталистов. Люди нуждаются в освобождении, и мы можем спасти их от их раскрытия, все объединены под одним баннером, Постадист Ла Плата"
 argentina.posadistambitions.7.t: "Посадистские амбиции | Завоевать Анды"
 argentina.posadistambitions.7.d: "Посадас дал нам еще один приказ о завоевании Андских стран Чили, Перу и Боливии. Он отметил, что проезд, которые война потенциально может иметь на стране, и предпочел бы, чтобы они были быстро уничтожены."
 argentina.posadistambitions.8.t: "Посадистские амбиции | Завоевать Бразилию"
 argentina.posadistambitions.8.d: "Внезапно оказалось в конфликте с Бразилией, оказалось, что это не идеально, и Посадас предпочел бы быстро справиться с конфликтом, прежде чем какая -либо дальнейшая эскалация."
 argentina.posadistambitions.9.t: "Посадистские амбиции | Военно -морская программа расширения"
 argentina.posadistambitions.9.d: "Посадас приказал нам расширить Армаду Аргентину. Он считает, что нынешний флот слабым и не будет достаточным для будущих задач, с которыми он должен будет мириться."
 argentina.posadistambitions.10.t: "Посадистские амбиции | Расширяться за пределы Южной Америки"
 argentina.posadistambitions.10.d: "Революция должна выйти за пределы нашего собственного континента. Весь мир должен знать о слове позадас и позадизма, и это включает в себя тех, кто за пределами нашего континента!"
 argentina.posadistambitions.11.t: "Посадистские амбиции | Распространить революцию в Европу"
 argentina.posadistambitions.11.d: "Европа отчаянно нуждается в переменах, чего -то нового, революции. Место рождения Карла Маркса, места рождения идеалов, которые представляют революцию. Мы должны вернуть революцию в его законное место!"
 argentina.posadistambitions.12.t: "Посадистские амбиции | Обезглавить свиней"
 argentina.posadistambitions.12.d: "С тех пор, как концепция нашего правления, с момента начала пути к славе, с тех пор одно явное препятствие было на нашем пути: Великобритания и США. Оба утверждают, что представляют «демократию» и «свободную волю», но это, однако, не может быть дальше от истины их хаоса и разрушения. \ n \ nthey заплатит за их грехи крови их народа!"
 argentina.posadistambitions.13.t: "Последний полядистский амбиции | Viva La Revolución"
 argentina.posadistambitions.13.d: "Viva El Camarada Posadas! Viva La Revolución Mundial!"
 argentina.posadistambitions.100.t: "Посадистские амбиции были успешно завершены!"
 argentina.posadistambitions.100.d: "Мы смогли выполнить требования Посадаса вовремя и с большой эффективностью. Посадас очень доволен результатами и считает, что страна идет по пути роста и процветания."
 argentina.posadistambitions.100.a: "Viva El Camarada Posadas!"
 argentina.posadistambitions.101.t: "Посадистские амбиции потерпели неудачу"
 argentina.posadistambitions.101.d: "Посадас глубоко разочарован с нами, так как его требования не были достигнуты во времени, хотя он считал, что нам дали достаточно времени для успешного их достижения. Он надеется, что в следующий раз у нас будет лучше и не повторим такое разочарование."
 argentina.posadistambitions.101.a: "Дерьмо..."
  
  
 argentina.culturaldevelopment.1.t: "Культурное развитие | Построить общий паз"
 argentina.culturaldevelopment.1.d: "Инженеры со всей страны собрались в Буэнос -Айресе, обсуждая идею проспекта, которую можно использовать для разделения автономного капитала от провинции Буэнос -Айрес. \ n \ nwe было поручено выполнить этот проект через 5 месяцев."
 argentina.culturaldevelopment.1.a: "Мы сделаем это!"
 argentina.culturaldevelopment.2.t: "Культурное развитие | Привлечь больше иммигрантов в страну"
 argentina.culturaldevelopment.2.d: "Эта страна имела долгую историю иммиграции. Они сформировали и преобразовали Аргентину в то, что она является сегодня, и очень важно, чтобы мы продолжали это и упростили иммигранты для иммигрантов в нашу великую страну!"
 argentina.culturaldevelopment.2.a: "Время привлечь больше иммигрантов"
 argentina.culturaldevelopment.3.t: "Культурное развитие | Подключите Ruta 9 к Cordoba"
 argentina.culturaldevelopment.3.d: "Ruta 9 - это относительно новая национальная дорога, главная цель - соединить Буэнос -Айрес с Jujuy, а затем простираться мимо границы в Боливию. Однако проект такого масштаба займет годы, чтобы начать прогресс, мы должны сосредоточиться на подключении маршрута к Кордобе."
 argentina.culturaldevelopment.3.a: "Время работать!"
 argentina.culturaldevelopment.4.a: "Время работать!"
 argentina.culturaldevelopment.4.t: "Культурное развитие | Построить обелиск"
 argentina.culturaldevelopment.4.d: "Немецкая компания G.E.O.P.E недавно связалась с нами с желанием построить обелиск на авеню 9 июля, самый важный во всех Buenos Aires. \ n \ n Согласен Было бы хорошо иметь такой памятник, чтобы решить нашу страну!"
 argentina.culturaldevelopment.5.t: "Культурное развитие | Построить Bombonera и монументальный"
 argentina.culturaldevelopment.5.d: "Поскольку Futbol продолжает расти в популярности в нашей стране, спрос на правильные стадионы Futbol. River Plate и Boca Juniors, соответственно, призывают наше правительство построить свои стадионы."
 argentina.culturaldevelopment.5.a: "И это сделаем!"
 argentina.culturaldevelopment.6.t: "Культурное развитие | Инвестировать по всей стране в наше образование"
 argentina.culturaldevelopment.6.d: "Образование в Аргентине недавно было застойным. Там не было слишком много достижений, и хотя наше образование хорошее, оно может быть еще лучше. В конце концов, в конце концов, это будущее, и более молодые аргентинцы должны быть хорошо образованы, чтобы поддержать сильную и могущественную страну!"
 argentina.culturaldevelopment.7.t: "Культурное развитие | Построить военную больницу"
 argentina.culturaldevelopment.7.d: "После войны с Чако многие солдаты указали на необходимость иметь надлежащую военную больницу в стране для лечения раненых солдат и их семей. \ n \ n мы получили 8 месяцев для выполнения этой задачи."
  
  
 argentina.rework.communist.1.t: "Насильственные общенациональные протесты протесты"
 argentina.rework.communist.1.d: "Спустя всего несколько дней после того, как правительство заявило, что выборов не будет, люди по всей стране начали собираться вместе и организовывать массовые толпы, демонстрируя агрессию в полицию, пытаясь успокоить их, и преодолевать решение правительства таким же ясным, как дневное свет. \ nvarious лидеры левых фракций начали воспользоваться ситуацией, убедив людей в том, что правительство является проклятием всего зла и что революция является обязательной для Аргентины. \ n \ n, где мы будем сосредоточиться на поддержке людей?"
 argentina.rework.communist.1.a: "Получить поддержку в провинциях"
 argentina.rework.communist.1.b: "Завоевать поддержку приговора"
 argentina.rework.communist.2.t: "Ситуация только ухудшается"
 argentina.rework.communist.2.d: "Большинство людей просто предполагали, что нынешние беспорядки будут просто демонстрацией людей и утихнуть через несколько дней. Тем не менее, это не может быть дальше от этого дела, поскольку протесты и беспорядки выросли только в количестве и сильных сторонах. Почти каждый город страны подвергается влиянию крупных протестов, раздражающихся марксистами в стране. \ n \ nwith страна приближается к анархии, возникает Дилема: мы будем делать это мирно или с кровью, пролитой на наши руки?"
 argentina.rework.communist.2.a: "Дипломатия ничего не решает!"
 argentina.rework.communist.2.b: "Нам нужно сохранить нашу страну в качестве одной сущности!"
 argentina.rework.communist.3.t: "Анархистские настроения усиливаются в Патагонии"
 argentina.rework.communist.3.d: "Поскольку ситуация в стране становится только хуже и хуже, оставшиеся анархисты, ослабляющие в Патагонии, начали вооружение и получают поддержку провинций в Санта -Круз и Тьерра -дель -Фуэго, утверждая, что правительство является корнем всего зла, и только люди со своими руками могут принести справедливость. \ n \ nwhat вы говорите, мой друг, согласны ли вы с нашими идеалами?"
 argentina.rework.communist.3.a: "Анархизм - единственный путь вперед!"
 argentina.rework.communist.3.b: "Вы не накинут только эту страну!"
 argentina.rework.communist.4.t: "Крупные антивоенные настроения от PS"
 argentina.rework.communist.4.d: "Из -за подавляющего большинства людей все еще предпочитают более дипломатический подход, который предлагал PS, многие против нынешней войны и активно идут против нас и наших военных усилий. Либо саботируя наши резервы, либо убеждая солдат на то, чтобы десерт на передовых."
 argentina.rework.communist.4.a: "Черт возьми!"
 argentina.rework.communist.5.t: "Социалисты саботировали некоторые из наших резервов!"
 argentina.rework.communist.5.d: "Социалисты, все еще присутствующие в нашей стране, решили саботировать одно из наших запасов оружия в стране в качестве антивоенной демонстрации и сорвать нашу способность бороться!"
 argentina.rework.communist.5.a: "Они не сойдут с рук с этим!"
 argentina.rework.communist.6.t: "Популярная поддержка Fanny достигает рекордно высокого уровня"
 argentina.rework.communist.6.d: "После получения крупной поддержки, несмотря на нынешний общенациональный кризис, Фанни начала выступать за полномасштабную революцию и сплотила всех своих сторонников, чтобы пойти против правительства. Коммунистическая партия и контингенты в стране в настоящее время разделены между Либорио Юсто и Фанни Эдельман. \ n \ nshould Fanny стать лидером де-факто?"
 argentina.rework.communist.6.a: "Фанни приведет нас к победе!"
 argentina.rework.communist.6.b: "Либорио - наш лучший шанс"
 argentina.rework.communist.7.t: "Общенациональный анархистский саботаж"
 argentina.rework.communist.7.d: "Анархисты в стране организовали себя и организовали общенациональный саботаж, нацелившись на банки, правительственные здания и запасы. Они заметили чрезвычайно деликатную ситуацию в стране и оскорбляют ее в полной мере."
 argentina.rework.communist.7.a: "Эти чертовы черты ..."
 argentina.rework.communist.8.t: "Марксистские сторонники пытаются сорвать наши планы"
 argentina.rework.communist.8.d: "Благодаря нашему недавнему активации с анархистскими идеалами, многие из марксистов, все еще присутствующих в Аргентине, в значительной степени против этого понятия и, таким образом, вмешивались в наши планы и затрудняют планирование и общение до того, как эта страна развернется."
 argentina.rework.communist.8.a: "Позорное поведение"
 argentina.rework.communist.9.t: "Военный хунта переверкает аргентинское правительство"
 argentina.rework.communist.9.d: "Важные новости достигли нашей штаб -квартиры! Наш враг изобилует, чтобы контролировать свою политическую ситуацию, и хунта решила свергнуть свое правительство, чтобы попытаться принести стабильность на их сторону, используя грубую силу! Однако, однако, ослабленная ситуация может привести к тому, что другие фракции в стране воспринимают их шанс и попытаться взять под контроль страну, поэтому мы должны быть уставшими."
 argentina.rework.communist.9.a: "Мы не можем летать слегка"
 argentina.rework.communist.11.t: "Время присоединиться"
 argentina.rework.communist.11.d: "Сталин сегодня прибыл в Буэнос -Айрес, чтобы поздравить нас с нашей победой ... или мы так думали. Сталин фактически прибыл сюда, чтобы напомнить нам о нашем окончании сделки, присоединившись к Компинте после окончания гражданской войны. \ n \ nwhat, что мы делаем?"
 argentina.rework.communist.11.a: "У нас даже есть выбор?"
 argentina.rework.communist.11.b: "Мы сделаем все, что, черт возьми, мы хотим!"
 argentina.rework.communist.12.t: "[FROM.GetName] согласился присоединиться"
 argentina.rework.communist.12.d: "[FROM.GetName] согласился присоединиться к нашей фракции и станет для нас верным участником."
 argentina.rework.communist.12.a: "Идеальный"
 argentina.rework.communist.13.t: "[FROM.GetName] не присоединился к нашей фракции!"
 argentina.rework.communist.13.d: "[FROM.GetName] отказался присоединиться к Комунтерну, сказав, что они «сделают все, что, черт возьми, они хотят»."
 argentina.rework.communist.13.a: "Похоже, нам нужно преподавать урок"
 argentina.rework.communist.14.t: "Маловероятная встреча с бандитом"
 argentina.rework.communist.14.d: "Поскольку некоторые из наших людей делали упражнения на сельской местности, чтобы получить преимущество от нашего врага на сельской местности, они наткнулись на самого известного бандита, приятеля Дэвида "Косидо" Перелта. Несмотря на то, что он изначально относился к нашим людям как к угрозе, но вскоре понял, что они его не противодействуют. Вместо того, чтобы отвернуться от нас, услышав ситуацию, он предложил помочь нам привести некоторых из наших людей к победе, используя свою гениальную партизанскую тактику, и дать нам преимущество против нашего врага."
 argentina.rework.communist.14.a: "Добро пожаловать, Эль Пистолеро"
 argentina.rework.communist.15.t: "Чужой жизнь была обнаружена!"
 argentina.rework.communist.15.d: "То, что казалось просто мечтой для нас, на самом деле стало реальностью! Наши ученые высшего уровня захватили радиочастоты, которые поступили из форм жизни за пределами нашей планеты. После установления звенец связи с этими формами жизни и объяснения нашей истории и нашей истории, от создания земли до человеческой эволюции, эти формы жизни начали описывать их сторону истории. \ n \ nour ученые вернулись из чрезвычайно ценных данных и синих отпечатков, которые легко продвинут наши исследовательские годы впереди всех других стран на этой планете."
 argentina.rework.communist.15.a: "Ваша помощь действительно была благословением!"
 argentina.rework.communist.16.t: "[FROM.GetName] требует острова Питкэрн"
 argentina.rework.communist.16.d: "Мы только сейчас получили письмо от [FROM.GetName], требуя отказаться от острова Питкэрн и передать им. \ n \ nwhat мы должны сделать?"
 argentina.rework.communist.16.a: "Мы передаем это вам"
 argentina.rework.communist.16.b: "Черт возьми!"
 argentina.rework.communist.17.t: "[FROM.GetName] требует Патагонии и стать их субъектом"
 argentina.rework.communist.17.d: "Мы получили угрожающее письмо от [FROM.GetName], требуя, чтобы мы не только передали им всю всю патагонию, но и стали их предметом. \ n \ nwhat мы должны сделать?"
 argentina.rework.communist.17.a: "Отлично..."
 argentina.rework.communist.17.b: "Они безумны? Черт возьми!"
  
  
 argentina.rework.stabilization.t: "Попытки государственной стабилизации"
 argentina.rework.stabilization.d: "Поскольку ситуация в стране продолжает ухудшаться, правительство старается изо всех сил исправить ситуацию как можно лучше, и сорвать наши планы."
 argentina.rework.stabilization.a: "Хорошо"
  
 chile.20.t: "[FROM.GetName] хочет, чтобы мы присоединились к Коминтерну"
 chile.20.d: "Дипломаты из [FROM.GetName] обратились к нам, чтобы спросить нас, готовы ли мы присоединиться к Коминтерну. Они также присоединились к Коминтерну, и они говорят нам также присоединиться к Коминтерну. Они говорят, что Советы будут рады принять нас в их фракцию. \ n \ nshould мы примем это предложение?"
 chile.20.a: "Конечно, мы с радостью присоединитесь"
 chile.20.b: "Они не представляют наши идеалы!"
  
  
 chile.21.t: "Формирование популярного Френта"
 chile.21.d: "Новости распространились, что сегодня отмечается самый первый день, когда Френте популярен, существующий как политическая партия в Чили. Эта новая партия состоит из коалиции большинства коммунистических партий, объединяющих силы в одну крупную основную партию. Человек, отвечающий за эту новую политическую партию, - Педро Агирре Серда. К сожалению, у нас нет нынешнего Intel о том, как фашисты отреагируют на создание этой новой партии, но из того, что было замечено ранее, она не будет красивой. Наше правительство также должно следить, так как эта новая партия быстро набирает популярность среди чилийских граждан."
 chile.21.a: "Интересный..."
  
  
 chile.22.t: "Nacistas протестует против подавления их партии"
 chile.22.d: "После различных попыток подавить политическое движение Nacista, многие из его членов протестуют против этого действия и делают это, взяв под контроль одну из наших провинций. Такой акт не должен быть допущен, и нам нужно иметь дело с их небольшим действием как можно быстрее, прежде чем они станут слишком сильными!"
 chile.22.a: "Вы заплатите за это!"
  
  
 chile.23.t: "Коммунисты протестуют против подавления своей партии"
 chile.23.d: "После наших различных попыток подавить Коммунистическую партию, их члены разъярили наше правительство и решили показать ее, занимая одну из наших провинций силой. Этот акт не должен восприниматься легкомысленно, и они будут встречены с грубой силой!"
 chile.23.a: "Вы заплатите за это!"
  
  
 chile.25.t: "Nacistas требуют увеличения политического представительства"
 chile.25.d: "Различные политические лидеры партии Начиста пришли в нашу штаб -квартиру, требуя, чтобы их партия было должным образом представлено среди нашего правительства и народа. Они также заявили, что если мы не будем соблюдать их требования, то они будут использовать силу, чтобы получить то, что они хотят. \ n \ n Решение лежит в наших руках, мы должны соблюдать их требования или игнорировать их?"
 chile.25.a: "Принять их требования"
 chile.25.b: "Игнорировать их"
  
  
 chile.26.t: "Коммунисты требуют увеличения политического представительства"
 chile.26.d: "Различные политические лидеры из Коммунистической партии пришли в нашу главную штаб -квартиру, требуя, чтобы признание их партии увеличилось на протяжении всего нашего правительства, а народ в целом. Они утверждают, что их партия более популярна, чем то, что представлено нашим правительством, и они будут использовать силу, если мы не прислушиваемся к их требованиям. \ n \ nwhat мы должны делать, принимать или игнорировать их требования?"
  
  
 chile.28.t: "Нациста увеличивают свою политическую власть"
 chile.28.d: "Intel пришла к нам, что после различных незаконных пропагандистских кампаний и различных уровней коррупции Nacistas увеличили свое политическое представительство в нашем правительстве. \ n \ nwe нужно следить, если мы позволим им продолжать выполнять такие действия, как эти, то только время покажет, будем ли мы все еще контролироваться над нашей нацией."
 chile.28.a: "Кажется, у них есть довольно гнусные намерения"
  
  
 chile.29.t: "Коммунисты увеличивают свою политическую власть"
 chile.29.d: "Intel пришла к нам, что после различных незаконных пропагандистских кампаний и различных уровней коррупции коммунисты увеличили свое политическое представительство в нашем правительстве. \ n \ nif эта ситуация продолжается или даже эскалация, тогда у нас будут серьезные проблемы!"
 chile.29.a: "Да, это некоторые очень гнусные намерения"
  
  
 chile.30.t: "Политические дебаты вызваны между фашистами и коммунистами"
 chile.30.d: "Только сегодня различные политические лидеры с обеих сторон попали в огромный аргумент, и некоторые даже проходили все время на борьбу. Из того, что говорит нам наша Intel, это приведет к временной фазе пропагандистских кампаний, направленных на то, чтобы друг против друга. Несмотря на то, что любой результат может быть полезен для нашего правительства, мы должны следить за тем, как чилийский народ не будет любить так много хаоса в нашем правительстве. Будем просто надеяться, что все не станет жестоким."
 chile.30.a: "Будем надеяться на длительный мир ..."
  
  
 chile.31.t: "Nacistas требуют, чтобы мы закрыли экономику"
 chile.31.d: "Различные политические лидеры из фашистской партии требуют, чтобы мы закрыли экономику для иностранцев, утверждая, что чилийские ресурсы «сделаны и только для чилийского народа». Эти крайние требования связаны с тем, что их политическое движение набирает серьезную тяжбу, и они чертовски хорошо знают, что у них достаточно большая поддержка, чтобы предпринять такие безумные требования. \ n \ n Решение лежит в наших руках, мы должны соблюдать или мы должны просто игнорировать их?"
 chile.31.a: "Выполнять их требования"
 chile.31.b: "Игнорировать их требования"
  
  
 chile.32.t: "Nacistas требует увеличения парламентского представительства"
 chile.32.d: "Получив массовую популярность по всей стране и став основной политической партией в нашей стране, Нациста требуют, чтобы они были представлены гораздо большей маржой в нашем парламенте. \ n \ ntheir власть, кажется, растут без перерыва, и это очень важно для нас. Еще более могущественные, и они будут представлять серьезную угрозу для нашего правительства. \ n \ nfor теперь, должны ли мы слушать их требования или просто игнорировать их?"
 chile.32.a: "Вмешиваться в их требования"
 chile.32.b: "Они не получат то, что хотят!"
  
  
 chile.33.t: "Коммунисты требуют балансировки наших социальных классов"
 chile.33.d: "С момента создания этой нации наши социальные классы были очень непропорциональными. Из -за различной экономической политики эта проблема только ухудшилась, и теперь, когда коммунисты имеют оплот в отношении политической сцены страны, они требуют, чтобы мы уравновесили эти классы и быстро. \ n \ nthey дают нам довольно строгий срок, однако, даже они признают сложность задачи и предлагают свою помощь, чтобы раз и навсегда решить эту долгосрочную проблему. \ n \ nshuld мы слушаем их требования или игнорируем их?"
 chile.33.a: "Послушать их требования"
 chile.33.b: "Игнорировать их требования"
  
  
 chile.34.t: "Коммунисты требуют увеличения планов благосостояния"
 chile.34.d: "Получив массовую популярность среди чилийского народа, коммунисты снова приходят к нам с довольно чрезвычайным спросом. Увеличьте наши планы благосостояния, особенно для бедных. Коммунисты пытаются злоупотреблять своей властью, и тот факт, что мы не можем сделать на самом деле, является самой худшей частью. На данный момент все, что мы можем сделать, это либо слушать, и соблюдать их требования, либо просто игнорировать их и надеяться на лучшее."
 chile.34.a: "Исполнять"
 chile.34.b: "Игнорировать их"
  
  
 chile.35.t: "Чилии готовятся к выборам 1938 года"
 chile.35.d: "Осталось более года до выборов 1938 года, люди уже начали готовиться к появлению выборов. Политические партии также готовится, висящие плакаты вокруг и различные политические лидеры, произносящие речи по всей стране. \ n \ nalthough Большинство выборов - это время, чтобы отпраздновать нового лидера, на этот раз многие обеспокоены результатом этих выборов. Особенно из -за агрессивности между коммунистами и фашистами в стране. \ n \ nas долго, пока все получится мирным, тогда все будет хорошо. Однако только время покажет, действительно ли это так."
 chile.35.a: "Будем надеяться на мирные выборы"
  
  
 chile.36.t: "Nacistas выигрывают выборы"
 chile.36.d: "После некоторых очень близких выборов и подсчета всех голосов, Nacistas удивили всех, выходя на первое место. Была ли коррупция или нет, мы не можем сказать на данный момент. \ n \ none, что наверняка заключается в том, что их победа наверняка вызовет напряженность в Латинской Америке и, безусловно, среди союзных способностей. \ n \ nenough из этих проклятых демократов, пришло время Чили стать силой, которой она заслуживает! Наши враги будут дрожать от страха от простого взгляда чилийского флага!"
 chile.36.a: "Время по -настоящему сиять"
  
  
 chile.37.t: "Френте популярный выигрывает выборы"
 chile.37.d: "После очень близкой сессии голосования коммунисты вышли на первое место. Их победа, была ли она правдивой или нет, определенно произошла и вскоре примет власть в Чили. \ n \ nwhether это будет вызвать напряженность в регионе или нет, мы, к сожалению, еще не знаем. Тем не менее, одна вещь, которая наверняка, это то, что в Южной Америке все изменится. \ n \ nit, когда мы возвращаем Чили из его пепла и даем людям истинную свободу! Расширение возможностей для рабочего класса!"
 chile.37.a: "Время показать Южную Америку, из чего мы сделаны"
  
  
 chile.38.t: "Демократы снова выигрывают выборы"
 chile.38.d: "После довольно жесткой сессии голосования наше правительство снова встало на первое место из -за нашей оппозиции и останется у власти еще 4 года. На этот раз удача была на нашей стороне, то же самое нельзя сказать для оппозиции, так как они могут попытаться сделать что -то, чтобы нарушить наш второй срок. Как бы то ни было, нам нужно быть готовым к чему -либо и не позволить никому получить лучшие из нас!"
 chile.38.a: "Еще четыре года"
  
  
 chile.39.t: "Была сформирована популярная либертадора Alianza"
 chile.39.d: "Новости распространились повсюду по всей стране, которую MNS распустил, и занять свое место - это популярный Alianza Libertadora, (APL), на короткие сроки. Партия также решила выбрать Карлоса ибаньеса дель Кампо в качестве лидера, когда-то бывшего президента Чили. Его авторитарные идеалы в прошлом вызывали споры, и то же самое происходит сейчас, как многие из нашего собственного правительства и Коммунистической партии снова осуждают его шаг к власти. \ n \ nfor сейчас, будем просто надеяться, что ситуация успокоится, и у нас может быть мирный период выборов."
 chile.39.a: "Еще одно смену имени партии?"
  
  
 news.349.t: "Резня Сегуро Обреро"
 news.349.d: "Сегодня несколько печальных новостей пришли из страны Чили, так как более 80 человек лежали мертвым после того, как заняли здание Seguro obrero в Сантьяго, Чили. Самоидентифицированные как Nacistas, эти люди занимали не только это здание, но и несколько других в качестве попытки переворота, чтобы уничтожить нынешнего президента Артуро Алессандри, а вместо этого расположены в Power Carlos Ibáñez del Campo. Чилийское правительство отреагировало на эту попытку переворота с кровопролитием, отправив карабинерок и открыв огонь по нацистам. 80 человек были подтверждены мертвыми, но это может быть больше, чем это число. \ n \ n ситуация во всем мире выглядит мрачной, поскольку экстремальные идеологии растут по всей планете. Мир быстро сжигается, и эта резня показывает, что Южная Америка также включена в этот беспорядок."
 news.349.a: "Это должно было быть сделано"
 news.349.b: "Иисус Христос..."
  
  
 chile.40.t: "Правительство подавило нашу партию"
 chile.40.d: "Чилийское правительство стало изо всех сил, чтобы подавить нашу политическую партию. Это было прямое незаконное действие и в значительной степени плевкой на нашу свободу слова. \ n \ neven Хотя то, что они сделали, было неправильно, мы не можем вдаваться в неконтролируемую ярость и свергнуть правительство, так как многие умрут, делая такую ​​вещь, и тратить так много жизней на что -то, настолько мелкое, просто просто не умно. \ n \ nthat не означает, что мы не будем молчать, достаточно скоро, они будут сожалеть, что когда -либо предпринят эти действия!"
 chile.40.a: "Они заплатят!"
  
  
 chile.42.t: "Чили готов много заплатить за Патагонию"
 chile.42.d: "Чилийские официальные лица подошли к нам с очень внезапным предложением. Они готовы платить не только 4 гражданских фабрик, но и различные экономические выгоды в течение более полугода в обмен на Патагонию. \ n \ nshould мы примем это предложение?"
 chile.42.a: "Да"
 chile.42.b: "Нет"
  
  
 chile.43.t: "Чили хочет остров Питкэрн"
 chile.43.d: "Различные чилийские политики связались с нами, прося о острове Питкэрн. Они утверждают, что хотят использовать его в качестве постановки для амфибийного японского вторжения, наряду с развитием инфраструктуры. \ n \ nshuld мы даем им остров?"
 chile.43.a: "Да"
 chile.43.b: "Нет"
  
  
 chile.44.t: "Ассасирование Артуро Алессандри"
 chile.44.d: "Сегодня появились новости о том, что сегодня группа неизвестных террористов убила Артуро. Его тело было найдено в доме президента, и кажется, что он попал в засаду. Группа самостоятельно идентифицировала себя как Nacistas, повторяя 'La Guerra Va Comenzar! La Guerra Va A Comenzar! Поскольку эта новость написана, сотни и даже тысячи людей берут оружие в том, что, по -видимому, станет столкновением между правительством и Нацистами. Гражданская война начнется, и кровь, которая будет пролита, будет огромной."
 chile.44.a: "Виктория Пара Эль Насисмо!"
  
  
 chile.45.t: "[ROOT.GetPoliticalEnemy] сотрудничают с правительством!"
 chile.45.d: "Новости только сейчас достигли нас, что [ROOT.GetPoliticalEnemy] сотрудничают с правительством и работают против нас. Они предлагают правительственные принадлежности, оборудование и даже мужчины для борьбы с нами. Наш враг больше не просто правительство, но и [ROOT.GetPoliticalEnemy]. \ n \ ни один, мы все равно выиграем, и мы все равно выберемся победа, независимо от стоимости!"
 chile.45.a: "Эти проклятые ублюдки заплатят!"
 CHL_nacismo_enemy: "Нацистас"
 CHL_communismo_enemy: "Коммунисты"
  
  
 chile.48.t: "Педро Агирре Серда скончался"
 chile.48.d: "Сегодня отмечает печальный день для чилийского народа, поскольку президент и лидер популярного Франта Педро Агирре Серда скончался на должности. Его причиной смерти было туберкулез, однако для Педро это не было чем -то новым, поскольку он уже знал, что его состояние здоровья ухудшалось. Вот почему он назначил Иеронимо Мендеса вице -президентом. \ n \ nbecause о своей смерти, Иеронимо теперь активизирует первоначальную позицию Педро и возглавит жителей Чили до выборов 1942 года. То, что лежит дальше, это большие проблемы для мистера Иеронимо, но люди уверены, что он протянет."
 chile.48.a: "Это действительно печальный день"
  
  
 chile.49.t: "Выборы 1942 года"
 chile.49.d: "Как ни казалось, что в 1942 году было удивило, что многие поняли, что мы уже там, и выборы только начались. \ n \ nvarious политики баллотируются на должность, причем самым выдающимся из которых был Карлос Ибаньес дель Кампо, который уже был президентом Чили и хочет снова баллотироваться на должность, но как независимый политик. \ n \ nthese выборы станут довольно беспокойными, в конце концов, победитель выборов 1942 года ..."
 chile.49.a: "Хуан Антио Риос"
 chile.49.b: "Густаво Росс Санта -Мария"
 chile.49.c: "Карлос ибаньес дель Кампо"
  
  
 uruguay.2.t: "Наши офицеры арестовали некоторых подозрительных людей"
 uruguay.2.d: "Полицейские из нашего правительства арестовали людей, которые казались довольно подозрительными. Офицерам утверждалось, что этим людям нельзя доверять и быть помещенными в тюрьму. Новости, вероятно, будут распространяться на людей с помощью сторонних источников, и они не будут счастливы, но наше правительство будет сильнее, поэтому оно того стоит."
 uruguay.2.a: "Интересно, нам придется подождать и посмотреть, к чему это приводит"
 uruguay.3.t: "Некоторые из наших заключенных были освобождены"
 uruguay.3.d: "Новости только что пришли к нам, что некоторые из наших заключенных были освобождены сегодня. \ n \ nhow они сбежали, чтобы обсудить, мы не знаем, сбежали ли они самостоятельно или другие люди помогли им. Черт, может быть, даже люди из нашего собственного правительства помогли им. \ n \ nwhatever это может быть, это явный признак того, что мы должны быть еще более жесткими в популяции, чтобы убедиться, что этого не повторится снова."
 uruguay.3.a: "Может быть, есть основная причина, почему это произошло"
 uruguay.5.t: "Терра и его верные сторонники захватывают страну"
 uruguay.5.d: "После того, как новости были распространены на каждый уругвайец Терры, который выгнал насильственно с офиса, многие из его верных сторонников вышли на улицы, чтобы насильственно протестовать против его вытеснения. \ n \ nevery City, на каждой улице, каждый квартал, есть лоялисты, которые делают все в силе, чтобы вернуть Терру. Насилие подвергается жестокому жестокому обращению со стороны толпы, и многие люди уже погибли из -за них. \ n \ nwe должны действовать быстро против протестующих, если мы хотим, чтобы наша страна оставалась на плаву, и это, к сожалению, будет означать, что большее пролилось крови, но она достигла точки, где это необходимо."
 uruguay.5.a: "Вы заплатите, Терра!"
 uruguay.6.t: "Рузвельт прибыл в Монтевидео"
 uruguay.6.d: "Всего час назад Рузвельт прибыл в Монтевидео и приезжает в Терру, чтобы обсудить различные политические вопросы и улучшить дипломатические отношения. Его приняли с подбадривающими толпами и размахивали американскими и уругвайскими флагами, и было сделано много фотографий обоих президентов. \ n \ nlet надеясь, что мы сможем еще больше улучшить наши отношения с американцами и принести их в качестве союзника в будущем."
 uruguay.6.a: "Для большего блага обеих наших наций!"
 uruguay.7.t: "Уругвайские выборы"
 uruguay.7.d: "свободные выборы"
 uruguay.7.a: "Partido Nacional"
 uruguay.7.b: "Партидо Колорадо"
 uruguay.8.t: "Уругвай предлагает мирное соглашение между нашими народами"
 uruguay.8.d: "Уругвайские дипломаты прибыли сегодня в Буэнос -Айресе, чтобы предложить мирное соглашение между нашей нацией. Уругвай хорошо знает, что они представляют нам угрозу и хотят иметь с нами договор. Дипломаты утверждают, что между нашими народами не будет войны, и что мы оба будем мирно сотрудничать и строить каждую из наших наций. \ n \ nmere представляет много угроз вокруг нас, поэтому принятие этого соглашения не настолько надуманно. Мы должны это сделать?"
 uruguay.8.a: "Да, давайте поработаем с нашими новыми союзниками"
 uruguay.8.b: "Нет, у нас есть другие планы"
 uruguay.9.t: "Аргентина принимает наше предложение"
 uruguay.9.d: "Наши дипломаты вернулись в Монтевидео сегодня с отличными новостями, Аргентина принимает наше предложение, и теперь мы официально союзники."
 uruguay.9.a: "Большой!"
 uruguay.10.t: "Аргентина отказывается от нашего предложения"
 uruguay.10.d: "Наши дипломаты вернулись в Монтевидео сегодня с плохими новостями, к сожалению, они не приняли наше предложение и не будут в союзе с нами."
 uruguay.10.a: "Они что -то планируют, я уверен в этом!"
 uruguay.11.t: "Грузовики, несущие некоторые из наших солдат, только что были взорваны!"
 uruguay.11.d: "Грузовики с некоторыми из наших солдат только что были взорваны в Entre Rios возле границы Уругвайя! После более тщательного проверки было обнаружено, что уругвайские солдаты фактически пересекли границу и намеренно установили взрывчатые вещества, чтобы взорвать их. \ n \ nthis - это не что иное, как терроризм против Аргентины, а аргентинские народы и уругвайцы более чем полностью осознают это. \ n \ nthere просто ни в коем случае не можем просто остаться с нашими руками, и пусть они сойдут с рук, всего через несколько часов каждый аргентинс узнает о злодеянии и просит войну против уругвайцев, и мы действительно собираемся игнорировать наши люди так?"
 uruguay.11.a: "Они будут платить с каждым дюймом крови, которую они имеют!"
 uruguay.11.b: "Мы просто не в форме, чтобы объявить войну уругвайцам."
 uruguay.12.t: "Аргентина не объявила нам войну, поскольку мы надеялись"
 uruguay.12.d: "Прошло 24 часа, и от Аргентины не было никакого ответа, и кажется, что они не будут объявлять нам войну, чтобы заставить Бразилию помочь нам. \ n \ nwe придется двойной с аргентинцами в одиночку, что мы не сможем сделать."
 uruguay.12.a: "Неважно, мы все равно пойдем на войну, и мы победим!"
 uruguay.13.t: "Уругвайцы просят нас присоединиться к их войне против Аргентины"
 uruguay.13.d: "Уругвайцы дипломаты прибыли сегодня, предположительно, более уставшие, чем обычно, прося нас присоединиться к их войне против Аргентины. Они сказали нам, что в обмену мы получим Формозу для нашего участия в войне. \ n \ nshould мы примем это предложение?"
 uruguay.13.a: "Конечно, аргентинцы не имеют шансов!"
 uruguay.13.b: "Мы не можем позволить себе войну прямо сейчас"
 uruguay.14.t: "Парагвайцы отклонили наш запрос"
 uruguay.14.d: "Парагвайцы сказали нашим дипломатам, что они не присоединятся к войне против Аргентины, заявив, что сейчас они не в форме войны."
 uruguay.14.a: "Понятно"
 uruguay.15.t: "Уругвай предлагает разделить Аргентину"
 uruguay.15.d: "Уругвайские дипломаты прибыли сегодня, чтобы сказать нам, что у них есть план разделения Аргентины. \ nfor Starters, Уругвай получит все провинции Rioplatense, которые являются Buenos Aires, Entre Rios, Santa Fe, La Pampa, Neuquen, Rio Negro, Chubut, Santa Cruz и Tierra del Fuego. \ n \ nwe получит провинции миссий и корректов, а остальная часть Аргентины станет нашим спутником. \ n \ nshuld мы примем это мирное предложение?"
 uruguay.15.a: "Конечно, это кажется справедливым"
 uruguay.15.b: "Нет, мы были теми, кто больше всего работал!"
 uruguay.16.t: "Бразилия отказывается от нашего мира"
 uruguay.16.d: "Бразильцы отреагировали на наших дипломатов, заявив, что они не будут поддерживать эти мирные предложения и предпочтут разделить Аргентину так, как сейчас."
 uruguay.16.a: "Черт возьми, ты, Бразилия ..."
 uruguay.17.t: "Кто должен возглавить нашу нацию?"
 uruguay.17.d: "С гражданской войной в полном разгаре и нашей нации в хаосе, один вопрос поднят над любым другим, кто должен возглавить страну? \ n \ nimprisoning terra вызвала новое государство, которое должно было быть создано, чтобы быть рядом с анархией, и нам как можно скорее нужен сильный лидер. Из -за его тюремного заключения демократические и коммунистические идеалы распространились на всех уругвайских людей, которые против Терры. \ n \ nthis может быть в последний раз, когда люди решат, кто будет возглавлять нацию, поэтому мы должны принять правильное решение и быстро. После спешных выборов победитель ..."
 uruguay.17.a: "Consejo provisionario будет вести сейчас."
 uruguay.17.b: "Евгенио Гомес приведет к представлению рабочих."
 uruguay.18.t: "[GetYear] Выборы"
 uruguay.18.d: "свободные выборы"
 uruguay.18.a: "Луис Батлле Беррес выиграл выборы!"
 uruguay.18.b: "Эмилио Фригони выиграл выборы!"
 uruguay.18.c: "Луис Альберто де Эррера выиграл выборы!"
 uruguay.19.t: "Луис Бэтлле Беррес подает в отставку!"
 uruguay.19.d: "Растущие усилия оппозиции заблокировать его попытки реформы сказались на популярности и власти Бэтлле Берреса внутри партии. Используя эту ситуацию в своем приключении, Андрес Мартинес Трайба заключил сделку с Луисом Альберто де Эррерой из Национальной Партидо, оказав его поддержку и еще больше усиливая давление против Бэтлле Беррес. \ n \ nhaving приобрел достаточно власти после сделки с Эррерой, Мартинес начал давить на Бэтлле Беррес, чтобы он уступил ему. И, наконец, он начал давить на него и его кабинета уйти в отставку. Зная, что Мартинес получил контроль как законодательных камер, так и поддержки Национального Партидо, сегодня, в полдень, президент Луис Бэтлле Беррес объявил о своей отставке в Камарах -де -Сенадоре Y Diputados, вскоре последовал увольнение своего VP Alfeo Brum и All of Heby, Beaking Bont Of Nation Surrination. Занимая свою поддержку в парламенте, Мартинесу удалось избрано в качестве временного президента стройным большинством."
 uruguay.19.a: "Успех"
 uruguay.20.t: "[GetYear] Конституционный референдум"
 uruguay.20.d: "Немного через неделю после того, как вступил в должность президентства, Андрес Мартинес предложил конституционную реформу, которая направлена ​​на то, чтобы отменить президентство и заменить ее новой системой, основанной на Национальной национальной де -Администрации, которая была отменена Габриэлем Терра в 1933 году. между обеими сторонами. На протяжении недели назад на референдуме на референдуме проголосовали реформа, с тем, что население проголосовало на референдуме с вариантами поддержания конституции так, как она есть или принять новое предложение. И после подсчета оставшихся голосов, избиратель Corte объявил сегодня, что референдум ..."
 uruguay.20.a: "...Прошедший!"
 uruguay.20.b: "...Неуспешный?!"
 uruguay.21.t: "Политический тупик"
 uruguay.21.d: "Следуя результатам референдума, политические ссоры между обеими сторонами привели к коалиции между Партидо Колорадо и национальным разрывом Партидо. В связи с тем, что национальные и Колорадские партии разбиты в противоположных фракциях, и парламент, и исполнительная власть замедлились до ползания, что заставило правительство неспособным предпринять какие -либо меры, чтобы разобраться в напряженности между обеими сторонами и усложняет округление терристов. \ n \ nall этого напряжения привело к противостоянию и напряженному настроению в Монтевидео, поскольку различия между сторонами продолжают расти, и начинают появляться трещины как в новом правительстве, так и в демократической системе."
 uruguay.21.a: "Это катастрофа!"
 uruguay.22.t: "Правительство падает!"
 uruguay.22.d: "Чудолетный случайный! Немного до месяца политического тупика и беспорядков нанесли урок как гражданства, так и правительства Мартинеса. \ n \ nfollowing массивные протесты на Plaza Independencia и Palacio Legislativo, Мартинес объявил о своей отставке, последовавшей вскоре остальной частью его кабинета. Любые попытки парламента назвать промежуточный промежуток, из -за отсутствия сотрудничества со стороны ПН и давления со стороны недовольного гражданского населения."
 uruguay.22.a: "Может ли это стать хуже?!"
 uruguay.26.t: "Судьба Аргентины"
 uruguay.26.d: "После нашей победы над аргентинским правительством многие начинают задаваться вопросом, что станет с аргентинской республикой. [URG.GetLeader] призвал к встрече представителей коммуны из Уругвая, чтобы достичь соглашения о том, что станет с Аргентиной. После некоторых обсуждений консенсус в том, что ..."
 uruguay.27.d: "После нашей победы с Чили против аргентинского правительства многие начинают задаваться вопросом, что станет с Аргентиной. [URG.GetLeader] призвал к встрече представителей коммуны от Чили и Уругвая, чтобы достичь соглашения о том, как разделить Аргентину между двумя анархистскими коммунами. После некоторых обсуждений консенсус в том, что ..."
 uruguay.26.a: "Мы создадим коммуны в регионе, которые лояльны к революции."
 uruguay.26.b: "Мы разделим Аргентину на две регионы и создам коммуны, лояльные революции."
 uruguay.26.c: "Мы интегрируем аргентинцев в существующие коммуны."
 uruguay.27.t: "Вырезать Аргентину"
 uruguay.27.a: "Мы разделим Аргентину с Чили, и мы оба формируем коммуны, лояльные к революции в наших регионах."
 uruguay.27.b: "Мы интегрируем аргентинцев в наши существующие коммуны, в то время как чилийцы делают то же самое."
 uruguay.28.t: "Состояние экономики"
 uruguay.28.d: "С момента своей независимости в 1830 году Уругвай был аграрным обществом, с большей частью дохода от эстанций в сельской местности. Однако с промышленной революцией в Европе иностранные отрасли начали приезжать в Уругвай, а вместе с ними появились промышленные машины. Это начал процесс урбанизации и индустриализации, сосредоточенный вокруг столицы Монтевидео. Несмотря на все это, большая часть доходов страны по -прежнему поступает из сельскохозяйственного экспорта, который вступил в игру в Великой войне, где Уругвай вошел в золотой век благодаря доходу этого экспорта. \ n \ nnow, с напряженностью, варивкой как в Европе, так и в остальном мире, экономисты начали обсуждать, является ли эта система устойчивой в долгосрочной перспективе, или уругвай пришло время догнать современное время. Некоторые члены правительства также обеспокоены тем, что радикальные изменения в нашей экономике могут принести недовольство среди сельского населения и элит."
 uruguay.28.a: "Если это не сломано, не исправляйте это"
 uruguay.28.b: "Мы должны догнать остального мира"
 uruguay.29.t: "Судьба государства всеобщего благосостояния"
 uruguay.29.de: "Поскольку мы продолжаем создавать проекты для расширения нашей экономической ситуации, стало сложнее поддерживать положительный избыток в нашем годовом бюджете. Имея это в виду, некоторые члены нашего кабинета предложили реформу для многих программ социального обеспечения, спонсируемых правительством. \ n \ n \ nthis привел к спорным дебатам, поскольку эти программы очень популярны среди людей, и обширные реформы могут оказаться очень непопулярными. Некоторые политики также утверждают, что полная отмена этих программ позволит нам быстро индустриализоваться, но это действие может вызвать негативную реакцию как от населения, так и других политиков."
 uruguay.29.a: "Поддерживать текущую систему."
 uruguay.29.b: "Одобрить некоторые незначительные реформы."
 uruguay.29.c: "Одобрить некоторые основные реформы."
 uruguay.29.d: "Одобрить обширные реформы."
 uruguay.29.e: "Отменить систему благосостояния."
 uruguay.30.t: "Bray Bentos Corned Beef"
 uruguay.30.d: "Fray Bentos - это бренд солонической говядины, исходящей от англо -мясного завода в Рио -Негро, с его именом, происходящим из города Фрай Бентос, где он находится. По словам Бренда, имел заметный успех из-за растущей напряженности, когда многие страны начинают накапливать консервированные товары в случае тотальной войны. \ n \ nthis оставляет нас в интересной позиции, так как многие страны готовы купить наши товары, но ограниченный размер завода и рабочей силы означает, что это может покрыть только требования одной крупной страны. Аргументы могут быть приведены, чтобы помочь любой стороне, но это также может быть использовано локально, если мы не сможем обеспечить покупателя."
 uruguay.30.a: "Экспортируйте его в Великобританию"
 uruguay.30.b: "Экспортируйте его в Германию"
 uruguay.30.c: "Экспортировать его в Советский Союз"
 uruguay.30.do: "Вместо этого производить его для местной контактов"
 uruguay.31.t: "Протесты Nacionales врываются в гражданскую войну!"
 uruguay.31.d: "После более чем года того, что Бланко выступили против наших политических действий, бочонок пороха достиг своей точки кипения и взорвался. Сторонники \ n \ nblancos собрали всю страну, захватывая оружие из наших резервов, и начали нападать на правительственные здания и местные полицейские участки. \ n \ nwe нужно иметь дело с этим восстанием сразу же, оно выходит из -под контроля!"
 uruguay.31.a: "Они заплатят за это!"
 uruguay.32.t: "Протесты Colorados врываются в гражданскую войну!"
 uruguay.32.d: "После более чем года того, как колорадо выступили против наших политических действий, бочонок пороха достиг своей точки кипения и взорвался. Сторонники \ n \ ncolorados собрали всю страну, захватывая оружие из наших резервов и начали нападать на правительственные здания и местные полицейские участки. \ n \ nwe нужно иметь дело с этим восстанием сразу же, оно выходит из -под контроля!"
 uruguay.32.a: "Они заплатят за это!"
  
