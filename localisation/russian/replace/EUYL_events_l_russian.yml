 peru.122.t: "Перуанские выборы 1936 года"
 peru.122.d: "11 октября поступило быстрее, чем ожидалось, и День выборов на нас. Из всех сторон в нашей стране 4 основных партия выделяются среди остальных. Первым является социал -демократы Partido, возглавляемая Луисом Антонио Эгигуреном и представляет демократические идеалы. Следующим является Френте Насионал де Дереча, возглавляемая Хорхе Прадо Угартач, и представляет аналогичные идеалы с Оскаром. \ n Третий вариант - Partido unión Revolucionario, возглавляемый Луисом. А. Флорес и представляет ультранационалистические фашистские идеалы. Последним вариантом является республика Alianza Acción, возглавляемая Мануэлем Висенте Виллараном, и представляет коммунистические идеалы. \ n \ nafter довольно близкая сессия голосования, победитель выборов 1936 года ..."
 peru.122.a: "Partido социал -демократы"
 peru.122.b: "Френте Насионал де Дереча"
 peru.122.c: "Partido Unión Revolucionaria"
 peru.122.e: "АЛИАНГА АКСИОН РЕСПУБЛИНА"
 peru.123.t: "Результаты выборов были отменены"
 peru.123.d: "Хотя более 700 000 человек уже проголосовали, Оскар Бенавидс решил отменить выборы и заявил, что он будет править нации еще 3 года. Причина такого сурового решения было связано с предположением, что Демократическая социалистическая партия, социал -демократы Partido, использовала избирательные мошенничества, чтобы получить большинство голосов. \ nwhile большинство сторон, в том числе Эгигурен, приняли это продление времени, Unión Revolucionaria была очень недовольна этим, и многие боятся, что они могут что -то планировать в ближайшем будущем."
 peru.123.a: "Еще три года Оскара это"
  
  
 peru.126.t: "[FROM.GetName] хотел бы обсудить потенциальные инвестиции с [Root.GetNameDef]!"
 peru.126.desc: "[FROM.GetName] послал дипломатического посла, чтобы предложить нам возможность инвестировать в свою страну. Посол заявляет, что «для того, чтобы Южная Америка росла, каждая страна здесь должна работать рука об руку». Кроме того, он обещает, что правительство [FROM.GetAdjective] будет с большей вероятностью склоняться к нашей пользе принятия этой возможности. Должны ли мы принять их предложение?"
 peru.126.a: "Мы будем вкладывать небольшую сумму."
 peru.126.b: "Мы будем вкладывать скромную сумму."
 peru.126.c: "Никакая цена не слишком большая для друга!"
 peru.126.d: "Мы не можем позволить себе тратить наши ресурсы прямо сейчас."
 peru.127.t: "[From.GetNameDef] отказывается!"
 peru.127.desc: "Из -за множества причин, [From.GetNameDef] отказался от нашего предложения инвестировать, вместо этого заявив: «В то время как инвестиции сейчас не в картах, наше мнение может измениться позже ...»"
 peru.127.a: "Несчастный."
 peru.128.t: "[From.GetNameDef] инвестирует небольшую сумму!"
 peru.128.desc: "Наша дипломатическая миссия в [From.GetNameDef] принесла фрукты, поскольку они теперь согласились с небольшими инвестициями!"
 peru.128.a: "Высоко ценится."
 peru.129.t: "[From.GetNameDef] инвестирует скромную сумму!"
 peru.129.desc: "Наша дипломатическая миссия в [From.GetNameDef] принесла фрукты, поскольку они теперь согласились с скромными инвестициями!"
 peru.129.a: "Спасибо."
 peru.130.t: "[From.GetNameDef] инвестирует большую сумму!"
 peru.130.desc: "Наша дипломатическая миссия в [From.GetNameDef] принесла фрукты, поскольку они теперь согласились с крупными инвестициями!"
 peru.130.a: "Большое спасибо!"
  
 peru.131.t: "День выборов"
 peru.132.t: "День выборов"
 peru.131.desc: "В связи с тем, что Учредительное собрание утверждает выборы, определяющие, кто возглавляет наше правительство, сформировались две основные демократические партии и разбили массы для голосования на выборах. Теперь балеты были подсчитаны, и победитель выборов ..."
 peru.132.desc: "В связи с тем, что Учредительное собрание утверждает выборы, определяющие, кто возглавляет наше правительство, сформировались две основные демократические партии и разбили массы для голосования на выборах. Теперь балеты были подсчитаны, и победитель выборов ..."
 peru.131.a: "Национальный демократический фронт!"
 peru.132.a: "Перуанское демократическое движение!"
  
 peru.133.t: "свободная торговля"
 peru.133.desc: "свободная торговля"
 peru.133.a: "Экономические барьеры между нами должны идти!"
 peru.133.b: "Мы не собираемся торговать с вами."
  
 peru.134.t: "[From.GetNameDef] соглашается!"
 peru.134.desc: "свободная торговля"
 peru.134.a: "Пусть мы процветаем вместе."
  
  
 peru.135.t: "[From.GetNameDef] отказывается!"
 peru.135.desc: "свободная торговля"
 peru.135.a: "Оу."
  
 peru.136.t: "Наша коалиция рушится!"
 peru.136.desc: "Наш недавний дрейф к политическим левым заставил многих консервативных и правых политиков, которые когда-то сотрудничали с нами, отказаться от нашей коалиции! Наша когда -то единая вечеринка больше не так объединена ..."
 peru.136.a: "Мы не нужны."
  
 peru.137.t: "[FROM.GetName] хочет реформировать нашу старую конфедерацию!"
 peru.137.d: "Политические деятели из [FROM.GetName] связались с нами, спрашивая, согласим ли мы реформировать Перу-Боливианскую Конфедерацию и объединить наши народы в попытке стать правящей силой на континенте и, возможно, в Америке в целом. Некоторое время некоторое время обе наши народы очень близки, и мы можем объединить обе наши страны и стать тем, что мы когда -то были. Первоначальная конфедерация состояла из трех наций: северное перуанское государство, южное перуанское государство и Боливию. Он был создан 9 мая 1836 года. Несмотря на то, что мы можем встретиться с сопротивлением, и наши соседи могут оказаться не такими хорошими, как они утверждают, количество власти, которую мы получим от этого, будет огромным, и наше наследие не будет мертвым, так как мы все еще будем жить в качестве кооперативного правительства. \ n \ nshuld мы примем это предложение и попробуем еще раз реформировать Конфедерацию?"
 peru.137.a: "Пришло время вернуть нашу старую славу!"
 peru.137.b: "Разве не работал в прошлый раз, зачем это работать сейчас?"
  
  
 peru.1.t: "[FROM.GetName] принял реформировать Конфедерацию"
 peru.1.d: "После лишь всего часа [FROM.GetName] уже ответил на наше предложение, согласившись еще раз реформировать Конфедерацию и попытаться еще раз зарекомендовать себя как суверенное государство и установить доминирующую позицию в регионе, так же, как и первоначальная конфедерация. \ n \ nthis, однако, мы будем успешными, независимо от того, что наши враги бросают на нас, мы будем победить и делать то, что не могла бы сделать оригинальная конфедерация!"
 peru.1.a: "Мир будет знать нашу настоящую комбинированную силу!"
  
  
 peru.2.t: "Конфедерация Перу-Боливина может быть слишком сильной"
 peru.2.d: "В новостях стало известно, что Конфедерация Перу-Болива, союз, который был уничтожен почти целый век назад, вернулась, и, кажется, с горечью отомстить своим врагам. \ n \ nthey кажутся чрезвычайно сильными, и если мы позволим им оставаться невредимыми, они могут расстроить баланс сил в регионе и нанести ущерб, и мы не можем допустить, чтобы это произошло. \ n \ nshuld мы вмешаемся и остановим эту угрозу, прежде чем она станет хуже?"
 peru.2.a: "Мы остановим их так же, как мы это сделали в первый раз!"
 peru.2.b: "Мы просто не готовы к войне"
  
  
 peru.3.t: "[FROM.GetName] отказался реформировать Конфедерацию"
 peru.3.d: "Чиновники из [FROM.GetName] отреагировали на наше предложение о союзе между нашими народами, заявив, что у них есть причины не принимать его, и они будут лучше, если они останутся независимыми. \ n \ neven После всех усилий, которые мы пошли, чтобы улучшить связи, чтобы достичь этого подвига, они просто плюют на нас и отказываются от этого предложения совершенно позорно! \ n \ nshould мы отвечаем силой, или мы просто должны отпустить эту идею?"
 peru.3.a: "Эти ублюдки получат то, что они заслуживают!"
 peru.3.b: "Мы будем искать другой маршрут"
  
  
 peru.138.t: "[FROM.GetName] просит нас быть на их стороне во время Второй войны Тихого океана"
 peru.138.d: "Чиновники из [FROM.GetName] сказали нам, что они планируют вторжение в Чили, чтобы забрать свои потерянные земли из войны в Тихом океане, и они хотят, чтобы мы были на их стороне, когда они запускают это вторжение. \ n \ nthey утверждают, что на этот раз мы будем успешными, и мы раз и навсегда победим чилийцев и вернемся на наши потерянные земли. \ n \ ncondidering Мы также потеряли территорию для чилийцев, этот шанс кажется уникальной возможностью, так что мы должны его воспользоваться? \ n \ n \ nwarning: если вы примете, вы будете обязаны объявить войну чилийцам, когда это сделает [FROM.GetName]. Если мы этого не сделаем, [FROM.GetName] может объявить нам войну!"
 peru.138.a: "Принять, мы объявим войну, как и второе место!"
 peru.138.b: "Отказаться, мы не можем позволить себе еще одну войну"
  
  
 peru.4.t: "[FROM.GetName] принял наш договор"
 peru.4.d: "[FROM.GetName] принял договор, который мы им предложили, и они согласились объявить войну чилийцам, когда мы это сделаем. С нашими объединенными силами у них не будет шансов!"
 peru.4.a: "Большой!"
  
  
 peru.5.t: "[FROM.GetName] отказался присоединиться к войне"
 peru.5.d: "[FROM.GetName] не удостоила нашего предлагаемого пакта, заявив, что они не в состоянии объявить войну. Как мы должны ответить на их отказ?"
 peru.5.a: "Переходи за ублюдками с обратной задачей!"
 peru.5.b: "Отпусти их, мы не можем позволить себе другого врага"
  
  
 peru.124.t: "[FROM.GetName] объявил войну, и теперь наша очередь действовать"
 peru.124.d: "[FROM.GetAdjective] Силы только сейчас пересекли чилийскую границу, и официальное объявление войны было объявлено всего несколько минут назад. \ n \ ndue к нашему подписанию PACT несколько месяцев назад мы обязаны присоединиться к ним в их военных действиях, но у нас все еще есть возможность отказаться от присоединения. Мы должны иметь в виду, что такого акта с обратной задачей почти наверняка приведет к заявлению о войне от [FROM.GetName]. \ n \ ingiven наши обстоятельства, что мы должны делать?"
 peru.124.a: "Присоединяйтесь к войне и раздавите чилийцев!"
 peru.124.b: "Извините [FROM.GetName], но на этот раз мы должны пройти"
  
  
 peru.6.t: "Должны ли мы вмешаться во вторую войну Тихого океана?"
 peru.6.d: "Для некоторых это может показаться глупым даже с учетом вступления в состояние войны против Перу и Боливии, но после тщательного рассмотрения позитивные моменты фактически перевешивают негативы. \ n \ nnot только это, если чили в качестве союзника очень поможет нам в будущем, и наши комбинированные силы измельчают Перу и Боливию! \ n \ nso, мы должны вмешаться и помочь чилийцам?"
 peru.6.a: "Конечно! Лима, вот и мы!"
 peru.6.b: "Мы просто не можем сделать такую ​​вещь"
  
  
 peru.7.t: "[FROM.GetName] поможет нам во второй войне Тихого океана!"
 peru.7.d: "Это официально, [FROM.GetName] объявил войну с Перу и Боливией и официально поможет нам в наших военных усилиях. Это отличная новость, и благодаря две фронт-войны наша фронт будет облегчена."
 peru.7.a: "Большой!"
  
  
 peru.8.t: "Наши враги были искажены, война приближается к концу"
 peru.8.d: "После многих месяцев войны и многих погибших жизней, похоже, мы побеждаем против наших врагов и попадаем в угол. Однако люди быстро устали от войны и протестуют, чтобы остановить войну. Не только они, многие из наших солдат уклоняются от драфта, и наши офицеры говорят нам, что их солдаты отказываются продолжать войну. \ n \ nafter Тщательное рассмотрение, нам было бы лучше остановить войну здесь и оказать наше доминирование на войне и заставить наших врагов передать территорию, которая была неотъемлкой для нас в обмен на условия мира. \ n \ nshuld мы начинаем мирные разговоры?"
 peru.8.a: "Давайте закончим эту войну раз и навсегда"
 peru.8.b: "Продолжайте! Мы не остановимся, пока они не будут уничтожены с карты!"
  
  
 peru.9.t: "Наши армии искаляются, должны ли мы остановить эту войну?"
 peru.9.d: "После нескольких месяцев боя, армии Перу-Болива оказались слишком большими для наших, и это быстро оказалось для нас бременем. Моральный дух \ n \ nsoldier постоянно низко, и люди единогласно против продолжения этой войны. \ n \ nshall мы сдаем перу-боливианцам или мы должны продолжать?"
 peru.9.a: "У нас нет выбора"
 peru.9.b: "Мы продолжим до конец!"
  
  
 peru.10.t: "[FROM.GetName] готов сдаться"
 peru.10.d: "Делегаты из [FROM.GetName] согласились с нашими условиями мира и согласились отказаться от земель, которые по праву являются нашими. Наконец, наш путь к славе был очищен, и наша война за независимость на шаг ближе к завершению."
 peru.10.a: "Конечно, мы примем их условия сдачи"
 peru.10.b: "Мы еще не закончили! Они пострадают!"
  
  
 peru.11.t: "Мы проигрываем войну"
 peru.11.d: "Потеряв многих наших людей и потеряв хорошую часть нашей территории, было ясно, что мы просто не можем выиграть этот конфликт. Давайте попросим мирных переговоров с теплением и заключим с ними сделку: мы даем им их основную территорию в обмен на прекращение войны. \ n \ nwe всегда есть возможность продолжить, но на данный момент не имеет большого смысла продолжать идти. Итак, что нам делать?"
 peru.11.a: "Сдаваться"
 peru.11.b: "Продолжайте идти"
  
  
 peru.12.t: "[FROM.GetName] готов сдаться"
 peru.12.d: "[FROM.GetName] подошел к нам, заявив, что они готовы сдаться и отправиться в наши территориальные требования. \ n \ njudging от количества жизней, которые были потеряны, и тот факт, что мы уже получили больше земли, чем ожидалось, поэтому мы должны принять их условия капитуляции?"
 peru.12.a: "Давайте закончим этот конфликт раз и навсегда"
  
 peru.13.t: "[FROM.GetName] требует гарантии"
 peru.13.d: "Делегаты из [FROM.GetName] прибыли в нашу страну сегодня, чтобы спросить, можем ли мы дать их нации гарантию и гарантируют их независимость в случае иностранного вторжения. Недавно он переживал довольно большие усилия по улучшению своих отношений с нами и другими социал -демократиями по всему миру, и это поможет союзник в Южной Америке. \ n \ nshuld мы примем и гарантируем их независимость?"
 peru.13.a: "Конечно"
 peru.13.b: "Мы не можем"
  
  
 peru.14.t: "[FROM.GetName] отказался гарантировать нам!"
 peru.14.d: "[FROM.GetName] ответил на наших делегатов, заявив, что они не будут гарантировать нашу независимость по причинам, которые не были упомянуты. Может ли это что -то значит?"
 peru.14.a: "Думаю, мы просто должны принять это"
  
  
 peru.15.t: "[FROM.GetName] просит [490.GetName] в обмен на приглашение на фракцию и гарантию"
 peru.15.d: "Делегаты из [FROM.GetName] пришли сегодня в нашу страну, чтобы спросить, хотят ли они дать им [490.GetName] в обмен на защиту и приглашение на фракцию. Сила [FROM.GetName] неоспорима, и отказ от такого кажется смешной, однако мы не должны так легко сдаваться. \ n \ nshould мы примем это предложение?"
 peru.15.a: "Конечно"
 peru.15.b: "Мы не можем легко отказаться от нашей земли"
  
  
  ### Generic Accept/Refuse Events ### 
  
  
 peru.16.t: "[FROM.GetName] принял наше предложение"
 peru.16.d: "[FROM.GetName] только что отреагировал на наших делегатов, заявив, что они принимают наше предложение, и его последствия будут происходить в ближайшее время."
 peru.16.a: "Рад, что мы смогли сделать это дипломатически"
  
  
 peru.17.t: "[FROM.GetName] отказался от нашего предложения"
 peru.17.d: "[FROM.GetName] только что отреагировал на наших делегатов, заявив, что они не примут наше предложение и откажутся продолжать любой разговор, связанный с темой."
 peru.17.a: "Они не сойдут с рук!"
 peru.17.b: "Отпусти их"
  
  
  ### Generic Accept/Refuse Events ### 
  
  
 peru.18.t: "[FROM.GetName] просит добровольцев"
 peru.18.d: "Сегодня в нашу страну прибыли различные делегаты из [FROM.GetName] по довольно простой просьбе, чтобы мы отправили им добровольцев. \ n \ ncerry [FROM.GetName] находится во второй войне Тихого океана, и делегаты утверждают, что им нужна вся помощь, которую они могут получить, и из -за наших подобных правительств они считают, что мы можем им помочь. \ n \ nshould мы отправили им добровольцев?"
 peru.18.a: "Отправить им 3 добровольца"
 peru.18.b: "Отправить им 6 добровольцев"
 peru.18.c: "Не присылайте им никакой помощи"
  
  
 peru.19.t: "[FROM.GetName] соглашается отправить 3 добровольца"
 peru.19.d: "[FROM.GetName] согласился на нашу просьбу о добровольцах и послал 3, чтобы помочь нам в наших военных усилиях. Эти добровольцы были непосредственно переданы в нашу команду, и мы можем использовать этих людей, как угодно, для войны."
 peru.19.a: "Большой!"
  
  
 peru.20.t: "[FROM.GetName] соглашается отправить 3 добровольца"
 peru.20.d: "[FROM.GetName] согласился на нашу просьбу о добровольцах и послал 6, чтобы помочь нам в наших военных усилиях. Эти добровольцы были непосредственно переданы в нашу команду, и мы можем использовать этих людей, как угодно, для войны."
 peru.20.a: "Удивительный!"
  
  
 peru.21.t: "[FROM.GetName] отказался отправлять нам добровольцев"
 peru.21.d: "[FROM.GetName] отреагировал на наших делегатов, заявив, что они отказываются отправлять нам добровольцев и что мы должны искать в другом месте."
 peru.21.a: "Все это даром"
  
  
 news.342.t: "Вторая война Конфедерации"
 news.342.d: "Спустя всего несколько дней после Реформации Конфедерации Перу-Болива, различных стран Южной Америки, включая Аргентину, Чили, Эквадор и Колумбия, все объявили войну в Конфедерацию. Причина в том, почему эти страны так быстро объявили войну в страну, заключалась в том, что они считают, что это нарушит баланс сил в регионе, в том же стиле, что и в первоначальной войне Конфедерации.  \ n \ na ситуация в настоящее время стоит, кажется маловероятным, что Конфедерация выиграет этот конфликт и останется независимым. \ n \ Неоплачиваемое время покажет, что произойдет в этом массовом конфликте, однако справедливо предположить, что это приведет очень кроваво."
 news.342.a: "Сколько существует конфедераций ??"
 news.342.b: "Возможно, мы проиграли в первый раз, но мы не проиграем во второй раз!"
 news.342.c: "Мы победили их один раз, мы можем победить их во второй раз!"
  
  
 news.343.t: "Вторая война Тихого океана"
 news.343.d: "После повышения военных эскалаций и напряженности между Чили и Перу этот предел был нарушен сегодня после того, как перуанские войска пересекли границу чилийской, и официальное объявление войны было объявлено всего через 2 часа. Учитывая социальную климат Южной Америки, кажется крайне маловероятным, что Перу и Чили станут единственными комбатантами в этом конфликте, поскольку Колумбия и Эквадор, похоже, также вооружают их силы. Многие люди быстро маркируют этот конфликт «самый смертельный конфликт в истории Южной Америки», и, судя по всему, кажется, что они не ошибся. \ n \ nall, что осталось сделать, это просто позволить времени пройти время и посмотреть, как конфликт получится. Одна вещь наверняка, и одна из двух сторон получит от этого большую власть."
 news.343.a: "Что у вас в вас, Южная Америка?"
 news.343.b: "Пришло время вернуть наши потерянные земли!"
 news.343.c: "Эти теплые зажигатели проиграют так же, как в первый раз! Вива Чили!"
 news.343.d: "Нам нужно помочь нашим чилийским братьям! Этим теплению нужно остановить!"
  
  
 news.344.t: "Эквадор и Боливия присоединились к второй войне Тихого океана"
 news.344.d: "Новости быстро распространились на колумбийские и эквадорские силы, пересекающие перуанскую границу и официально присоединились к Чили на их стороне войны. Мир стоит в шоке, когда они видят, что когда -то считалось относительно спокойной спиралью континента из -под контроля. \ n \ nfor теперь, нам просто нужно подождать и посмотреть, как все это происходит."
 news.344.a: "Что, черт возьми, даже происходит?!"
 news.344.b: "ЧТО?? Эти ублюдки будут платить своей кровью!"
 news.344.c: "Мы стоим вместе, и вместе мы победим!"
  
  
 news.345.t: "Возрождение [FROM.GetNameDEF]"
 news.345.d: "После того, как в течение почти столетия укладывали бездействие, [FROM.GetNameDEF] был реформирован и кажется мощным, как и прежде. Различные страны Южной Америки уже выражают свое недовольство этим необоснованным реформацией некогда мертвого союза, и многие другие в ужасе от власти, которую она обладает. \ n \ npeople не знает, что произойдет из Реформации [FROM.GetNameDEF], и все, что мы можем сделать, это надеяться, что это не станет кровавым."
 news.345.a: "Еще одна конфедерация?!"
 news.345.b: "Наш путь к славе был очищен, теперь мир увидит нашу силу!"
 news.345.c: "Это может быть очень плохо, они кажутся слишком сильными"
  
  
 peru.22.t: "Перу готов купить арику"
 peru.22.d: "Перуанские дипломаты прибыли сегодня в Сантьяго, предлагая большие суммы денежных средств и сектор своей гражданской экономики в обмен на нашу территорию Арики. \ n \ narica находилась в нашем контроле с момента нашей победы в войне Тихого океана. На протяжении всего этого времени Перу претендует на эту землю своей основной территорией. \ n \ nnow, что напряженность спокойна, они дадут довольно большую сумму денег в обмен на Арику. \ n \ nshould мы примем их предложение?"
 peru.22.a: "Конечно, пусть им это будет"
 peru.22.b: "Мы не будем так легко отказаться от наших земель!"
  
  
 peru.23.t: "Перу предлагает гарантию и приглашение на свою фракцию в обмен на арику"
 peru.23.d: "Перуанские дипломаты прибыли сегодня в Сантьяго для довольно интересного предложения. Они предложат нам военную защиту и приглашение на свою фракцию в обмен на территорию Арики. \ n \ ncondidering, что мы уже довольно сильны в военном отношении и не нуждаемся в иностранной защите, а тем более от южноамериканской нации, разумно принять эту сделку?"
 peru.23.a: "Если это означает быть объединенным как континент, любая территориальная жертва - это нормально"
 peru.23.b: "Абсолютно нет"
  
  
 peru.24.t: "Наш переворот был успешным, так что теперь мы должны делать с Оскаром?"
 peru.24.d: "После нашего успешного переворота и теперь, будучи абсолютной властью над нацией, стоит один вопрос: что мы должны делать с Оскаром Бенавидсом? \ n \ nsome говорят публично повесить его и продемонстрировать его сторонникам, что мы отвечаем. Другие предполагают, что мы должны просто заставить его уйти в отставку, а некоторые говорят, чтобы просто позволить ему остаться генералом в армии. \ n \ nwith в нашем распоряжении, что мы должны делать?"
 peru.24.a: "Публично повесить его"
 peru.24.b: "Заставить его уйти в отставку"
 peru.24.c: "Позвольте ему остаться в армии"
  
 peru.25.t: "[FROM.GetName] просит нас разрешения купить один из наших кораблей"
 peru.25.d: "Дипломаты из [FROM.GetName] пришли в нашу страну, чтобы попросить нас разрешения купить один из наших кораблей. Они готовы заплатить довольно большую сумму за наши корабли, и они обещают нам, что они будут платить каждый цент, который мы взимаем с них за любой из наших кораблей. \ n \ nshould мы примем их офицера?"
 peru.25.a: "Принимать"
 peru.25.b: "Отклонить"
  
  
 peru.26.t: "[FROM.GetName] дал нам разрешение на покупку одного из своих кораблей"
 peru.26.d: "[FROM.GetName] отреагировали на наших дипломатов и дали нам зеленый свет, чтобы купить один из своих кораблей."
 peru.26.a: "Теперь наш флот действительно вырастет!"
  
  
 peru.27.t: "[FROM.GetName] не дал нам разрешения на покупку одного из своих кораблей"
 peru.27.d: "[FROM.GetName] отреагировали на наших дипломатов, заявив, что они не допустят покупку своих кораблей и предпочли бы сохранить их под руководством."
 peru.27.a: "Удачи в следующий раз"
  
  
 peru.28.t: "Кто возглавит нашу империю?"
 peru.28.d: "Теперь, когда мы получили наше место на южноамериканском континенте, нам нужно выбрать лидера. В то время как нашего Господа Инти в качестве нашего лидера, в современную эпоху может быть разумно иметь истинного и мудрый лидер, чтобы возглавить это возрождение нашей империи, так же, как это сделала первоначальная империя. \ n \ nwe мог бы сказать, что он будет представителем Inti, выдвинув противников во имя Apu-Punchau. До сих пор у нас есть два возможных претендента на руководство нашей империей. Первым является Хуан Веласко Альварадо, военный гений и с местным происхождением, он идеально подходит, чтобы возглавить нашу империю. \ Не с другой стороны, у нас есть Хосе Луис Бустаменте, квалифицированный экономист, который также обладает местным происхождением. \ n \ nwe также не могли бы просто не выбрать лидера и оставить Apu-Punchau, чтобы привести нас к окончательной славе! В конце концов, существо, которое нас ведет, ..."
 peru.28.a: "Хуан Веласко Альварадо"
 peru.28.b: "Хосе Луис Бустаменте y Rivero"
 peru.28.c: "Средые люди не будут знать, как привести нас к славе!"
 peru.28.e: "Pachacutec второй"
 peru.28.f: "Держите Рикардо у власти"
  
  
 peru.29.t: "Военные действия между армией и флотом успокоились"
 peru.29.d: "Военные действия между нашей армией и флотом, которые какое -то время причиняют нам боль, наконец успокоились. Многие сектора армии и флота теперь идеологически согласны и решили остановить это детское соперничество. \ n \ nnow, что наша армия и флот сотрудничают друг с другом, мы можем действительно начать разжигать сильное перуанское государство, которое будет бояться и уважать наши соседи."
 peru.29.a: "Наконец, мы можем расслабиться"
  
  
 peru.30.t: "Гражданская война началась"
 peru.30.d: "Гражданская война в перуанском языке официально началась. Наша кампания по созданию фашистского режима достигла своего пика, здесь мы либо выигрываем и правляем нации, либо умираем. Независимо от того, каков результат, мы должны убедиться, что мы даем все это. Эти капиталистические свиньи не будут длиться долго, если мы дадим ему все, что имеем, это точно!"
 peru.30.a: "Soldados, A La Victoria!"
  
  
 peru.31.t: "Наш переворот был успешным!"
 peru.31.d: "Мы мирно захватили нацию, не проливая ни капли крови. Эта победа будет отмечаться в течение десятилетий, и новая эра для Перу только началась. Мы покажем всем, что фашизм может по -настоящему привести нацию к величию, мы будем примером для всех этих капиталистических и коммунистических свиней, которые нас окружают!"
 peru.31.a: "Мы сделали это!"
  
  
 peru.32.t: "Кто приведет нас к победе?"
 peru.32.d: "Как люди и военные Перу, у нас есть очень важный выбор. Нам нужно решить, кто возьмет на себя роль лидера фашистского режима, и привести нашу нацию к славе. \ n \ n[ROOT.GetPeruSituation]"
 peru.32.a: "Eloy Уректора будет новым лидером"
 peru.32.b: "Луис А. Флорес должен продолжать лидировать"
  
  
 PRU_civil_war_situation: "С одной стороны, у нас есть Луис А. Флорес, надежный лидер, который уже доказал свою ценность в области и с его лидерскими навыками. \ n \ не с другой стороны, у нас есть уректора Eloy, умный лидер, который мог бы использовать его остроумие, чтобы перехитрить врага. Гражданская война в полной мере, поэтому нам нужно быстро сделать выбор, лидер нашей нации будет ..."
 PRU_peaceful_coup_situation: "С одной стороны, у нас есть Луис А. Флорес, талантливый лидер, который знает, как вести с железным кулаком. \ n \ не с другой стороны, у нас есть уректора Eloy, способный лидер, который является остроумием и интеллектом, могут значительно улучшить нашу экономику, военные и общую стабильность страны. \ n \ nwith в наших руках, лидер нашей нации будет ..."
  
  
 peru.33.t: "[FROM.GetName] хочет купить наши танки"
 peru.33.d: "Делагаты из [FROM.GetName] отправились по всему миру, чтобы приехать в нашу страну, чтобы спросить нас, могут ли они купить некоторые из наших танков. Они видели наш запас и очень довольны нашим арсеналом, и заявили, что готовы заплатить приличную сумму за некоторые из наших танков, особенно наши световые модели. \ n \ nshould мы примем их предложение?"
 peru.33.a: "Позвольте им приобрести соответствующие танки"
  peru.33.b:0 "Let them purchase Ok-ish Tanks 
 peru.33.c: "Ничего не присылайте им!"
  
  
 peru.254.t: "Фашисты приводят в ярость отменой выборов!"
 peru.254.d: "Фашисты сделали свое недовольство из -за отмены выборов очень ясны, почти слишком ясны. \ n \ npeople, проникшие среди их рядов, сообщили нам, что они планируют полноценную гражданскую войну, пытаясь свергнуть наше правительство! \ n \ nwe нужно убедиться, что этого не произойдет, несмотря ни на что!"
 peru.254.a: "Они заплатят за это!"
  
 peru.34.t: "Выбор между Eudocio и Del Prado"
 peru.34.d: "С нашими усилиями в полном разгаре мы должны сделать выбор относительно того, кто возглавит наше движение. \ n \ nwe может выбрать между оврагами из Eudocio и Хорхе дель Прадо Чавесом, как хорошо признанными, так и уважаемыми людьми со своими собственными амбициями и целями. \ n \ nwho, мы выберете?"
  
 peru.35.t: "Перуанское правительство начинает репрессировать усилия против нас"
 peru.35.d: "Некоторые из наших лояльных товарищей, проникших в правительство, сообщили нам, что [ROOT.GetLeader] приказал армии начать полномасштабные обыски по всей стране, чтобы отследить и выследить любого из наших сторонников. \ n \ nThis не будет легко, но нам нужно сделать все, что мы можем остановить [ROOT.GetLeader], и убедиться, что люди получают свободу, которую они заслуживают!"
 peru.35.a: "Чертовы ублюдки"
  
 peru.36.t: "Правительство преследовало некоторых из наших сторонников"
 peru.36.d: "Нам сообщили, что правительство поймало и заключило в тюрьму некоторых из наших сторонников, наносив ущерб нашей общенациональной поддержке и причине."
 peru.36.a: "Они заплатят за это!"
  
 peru.37.t: "Мы успешно перешли!"
 peru.37.d: "После нескольких месяцев препарата и поддержки общенациональной поддержки люди решили, что у них достаточно, и в сочетании с их поддержкой и нашим руководством мы взяли под контроль страну. Бывшие кабинет и члены были вынуждены опуститься с офиса, и с этого момента мы можем править Перу и привести к пути величия!"
 peru.37.a: "Фантастика!"
  
 peru.38.t: "Правительство разрушает наше правительство"
 peru.38.d: "В то время как мы сделали все возможное, чтобы поднять внимание правительства и получить поддержку каждого перуанского, этого просто было недостаточно. Правительство догнало наши схемы и массово общается на каждого на наших сторонников. \ n \ nwe должен что -то сделать, и быстро!"
 peru.38.a: "Все на руки! Борьба за свободу!"
  
 peru.39.t: "[PRU.GetName] Вторгнулся [CHL.GetName], теперь наш шанс!"
 peru.39.d: "Слово, как нас дошло до того, что [PRU.GetAdjective] пересекли границу [CHL.GetAdjective]. Это была бы наша золотая возможность вмешаться и вернуть то, что по праву наше!"
 peru.39.a: "Давай сделаем это!"
 peru.39.b: "Мы не можем рисковать этим"
  
 peru.40.t: "Выбор между Хая и Эгигурена"
 peru.40.d: "Мы должны выбирать между наличием Хая де ла Торре в качестве лидера или Луиса Антонио Эгигурена Эскудеро в качестве лидера социал -демократической партии. \ n \ nwho приведет нас к величию?"
  
  
  
 news.346.t: "[GetYear] война Перу-Экуадора"
 news.346.d: "После растущей напряженности и пограничных конфликтов между двумя странами разразилась вся война между двумя народами в борьбе за тех, кто контролирует пасты. Многие считают, что Перу станет явным победителем из -за их промышленного и военного превосходства, есть небольшое меньшинство, которое считает, что Эквадор может выйти из этой войны в качестве победителя. \ n \ nfor сейчас, только время покажет, кто станет истинным победителем этого конфликта."
 news.346.a: "Действительно довольно интересно"
 news.346.b: "Мы должны изучить этот конфликт"
 news.346.c: "Эти эквадорцы упадут!"
 news.346.e: "Мы не позволим этим Warmongerers сойти с рук!"
  
  
 news.347.t: "Вторая война в Чако"
 news.347.d: "Через несколько лет после первой войны в Чако боливийцы просто не могли выдержать парагвайцы, владеющие территорией Чако, территория, которую боливийцы считают своей. После различных пограничных конфликтов боливийцы начали военное наступление на парагвайцев и официально начали вторую войну в Чако. В мире будет очень внимательно следить за событиями, которые происходят в этой войне, так как любой победитель в этой войне может привести к довольно доминирующей позиции в Центральной Южной Америке."
 news.347.a: "Действительно очень интересно"
 news.347.b: "Нам нужно следить с этими двумя"
 news.347.c: "Чако будет нашим еще раз!"
 news.347.e: "На этот раз боливийцы будут хорошо и по -настоящему упадут!"
  
  
 news.348.t: "Падение Буэнос -Айреса"
 news.348.d: "Военные эксперты находятся в шоке, так как сообщения Буэнос -Айреса подтверждают, что столица упала на продвижение уругвайских войск. Несмотря на то, что некоторые районы все еще находятся в бою, большинство подразделений аргентинской армии отступили в сельскую местность, окружающую город. \ n \ Nuruguayan войска начали парад победы через 9 -й проспект De Julio, причем [URG.GetLeader] вылетел, чтобы принять участие в нем. \ n \ nrumors говорят, что аргентинскому правительству удалось сбежать через Рута 7 в сторону Анд, однако эксперты считают, что это разрушительный удар по Аргентине."
 news.348.a: "Что, черт возьми, там происходит?"
 news.348.b: "Кто сейчас провинция?"
 news.348.c: "Они заплатят! С их кровью они заплатят!"
  
  
 news.750.t: "Падение Буэнос -Айреса"
 news.750.d: "Буэнос -Айрес считает, что Париж Южной Америки - очень могущественный город в Южной Америке, поэтому еще более шокирует, что город теперь упал под руки постороннего. Последствия такого могущественного города больше не находятся в руках Аргентины, до сих пор неизвестно, однако известно, что это радикальные изменения, которые придут в регион как экономически, так и политически. В последние годы Южная Америка становится все более и более нестабильной, и падение Буэнос -Айреса только доказывает, насколько серьезной эта проблема. \ n \ nwith их экономический центр исчезла, шансы на победу в Аргентине в войне кажутся тусклыми."
 news.750.a: "Аргентина имеет шанс?"
 news.750.b: "Еще одна победа для нас!"
  
  
 news.351.t: "Падение Сан -Паулу"
 news.351.d: "Один из самых важных городов Бразилии только что был захвачен. Для многих все еще кажется невероятным, как был занят такой важный город южноамериканского гиганта, и все же сообщения из города и захватчик доказывают это вне сомнения. Бразилия все еще может вернуться в Рио -де -Жанейро, однако захватчики уже тоже у порога этого города. \ n \ nmans wrances бразильской армии сдерживает захватчики, кажется, почти нулевой. Темные дни приходят для страны Бразилии."
 news.351.a: "Бразилия не длится"
 news.351.b: "Далее, Рио -де -Жанейро"
  
  
 news.352.t: "Падение Рио -де -Жанейро"
 news.352.d: "Рио -де -Жанейро, популярный сайт с туристами, инвесторами и людьми в целом, а также красивый город больше не то, чем когда -то было. Теперь он наполнен кровопролитием и хаосом, когда иностранные захватчики выводят бразильцев из своего города. \ n \ n текущие обстоятельства кажутся невероятными, но местные отчеты подтверждают это. Рио -де -Жанейро упал, и нынешние бразильские военные усилия, кажется, недостаточно, чтобы остановить захватчиков. \ n \ nit собирается вернуться бразильцам, но мы все знаем, что жизнь не всегда приносит чудеса."
 news.352.a: "Что случилось с Южной Америкой?"
 news.352.b: "Конец войны рядом!"
  
  
 news.353.t: "Падение Монтевидео"
 news.353.d: "Поступили только что столица Уругвая, Монтевидео, упала на внешние силы. Число смерти достигает тысяч людей, поскольку гражданские лица пытаются избежать города в страхе попасть в перекрестный огонь. \ n \ nnow с его капиталом исчезла, он понесет большую жертву и способность идти в ногу с войной, однако кажется маловероятным, что Уругвай останется на плаву в этом конфликте."
 news.353.a: "Они приложили доблестное усилие"
 news.353.b: "Их сопротивление было бесполезным!"
  
  
 news.354.t: "Падение Сантьяго"
 news.354.d: "Когда -то шумная столица Чили была превращена в обломки и хаос, так как приливы войны затопили город сегодня. Захватчики официально захватили столицу Чили, Сантьяго, а город больше не находится под контролем числа. \ n \ ncondidering опасную местность, окружающую город, это, честно говоря, впечатляет, как захватчики смогли сделать такой подвиг. Военные эксперты со всего мира пытаются обернуть свои головы вокруг того, что случилось с чилийской обороной, и как они не могли защитить такой защитник. \ n \ ни один, чилийцы находятся на своих задних ногах, и ему понадобится чудо, чтобы отступить назад и выйти на вершину в войне."
 news.354.a: "Сердце южноамериканской стали ... ушел"
 news.354.b: "Они должны сдаваться в любое время!"
  
  
 news.355.t: "Падение Ла -Паза"
 news.355.d: "Столица Боливии, а также самый важный город страны стал жертвой гнева войны и сейчас больше не находится под контролем боливийцев. Ситуация сейчас очень мрачная в стране, поскольку бесчисленные люди умирают, и многие пытаются избежать ужасов войны. \ n \ na очень грустное зрелище, особенно при рассмотрении неудачной истории Боливии, когда дело доходит до войн. Весь мир может сделать, это заглянуть издалека и изучить конфликт, отдавая молитвы тем, кто погиб."
 news.355.a: "Это довольно печально"
 news.355.b: "У них никогда не было шансов!"
  
  
 news.356.t: "Падение Асунсьона"
 news.356.d: "Столица Парагвая, Асунсьон, стала жертвой захватчиков. Отчеты подтверждают, что город больше не находится под властью правительства парагвайцев. Парагвайцы приложили доблестные усилия против захватчиков, но в итоге захватчики вышли победителями и растянуты на парагвайских обороне в городе. Тактика защиты может быть изучена с этой войны, чтобы лучше понять, как и почему от падения этого города. \ n \ nwe оплакивают тех, кто больше не с нами из -за этого конфликта."
 news.356.a: "Асун-что?"
 news.356.b: "Наша армия не может быть остановлена!"
  
  
 news.357.t: "Падение Лимы"
 news.357.d: "Учитывая стратегическую позицию столицы Перу, Лима, было признано почти невозможным, чтобы победить его, логистику, необходимые солдаты, моральный дух. Многие факторы должны быть в игре, чтобы он добился успеха, и все же захватчики сделали это и захватили столицу страны. Несмотря на то, что их самый важный город исчез, перуанцы по -прежнему стараются изо всех сил выдвинуть надежную защиту против захватчиков, и мы должны уважать их усилия, даже если это усилие в конечном итоге не приведет ни к чему. \ n \ n the Tactics, развернутая захватчиками, может быть изучена, чтобы еще больше улучшить наши собственные методы."
 news.357.a: "Еще одна южноамериканская столица ушла?"
 news.357.b: "Наконец, наконец -то победа"
  
  
 news.358.t: "Падение Боготы"
 news.358.d: "Столица Колумбии, Богота, только сейчас была подтверждена, что она больше не находится под колумбийским контролем. Такой большой город, взятый внешним силой, все еще кажется невероятным, и все же освещение в местных новостях оказалось невероятным. Семьи \ n \ nmany потеряли свои дома, еще больше потеряли членов, и в целом вся нация Колумбии изо всех сил пытается поддерживать себя, поскольку захватчики продвигаются все дальше и дальше в свои земли. Независимо от того, будут ли они отстранить его или нет, все еще не подходит для дебатов, но с их столицей исчез, это кажется маловероятным. \ n \ nonce больше этого следует воспринимать как возможность изучать военную тактику, но нам нужно иметь сострадание к тем, кто погиб."
 news.358.a: "Интересный"
 news.358.b: "Все кончено, эта война закончена"
  
  
 news.359.t: "Падение Каракаса"
 news.359.d: "Столица Нефтяной Хейвен Южной Америки, Венесуэла, была недавно захвачена. Захватчики знали о стратегической важности города и убедились, что они использовали военную силу, чтобы взять его. \ n \ nthusts - мертвы, и может быть больше, если эта война не закончится. Захватчики не проявляют милосердия, поскольку их солдаты и танки проходят через некогда шумную столицу Венесуэлы. \ n \ nwe может только подождать и посмотреть, как решается этот конфликт."
 news.359.a: "Поистине позор"
 news.359.b: "Наконец, все это масло будет нашим!"
  
  
  # Bolivia 
  
  
 bolivia.1.t: "Военные начали переворот"
 bolivia.1.d: "После нескольких месяцев неэффективного правительственного управления и политической нестабильности военнослужащих было достаточно, и после нескольких месяцев планирования они начали переворот сегодня утром. Ситуация кажется очень деликатной, и многие предсказывают, что это только ухудшит то, что уже было очень хрупкой нацией. Боливийцы вынуждены выбирать сторону, и происходит политический раскол, когда мы говорим, и многие наблюдатели из внешнего мира наблюдают за нашей нацией с очень пристальным взглядом. \ n \ nwhatever собирается выйти из этого переворота, нам просто нужно надеяться, что это в лучшую часть страны."
 bolivia.1.a: "Для будущего Боливии!"
  
  
 bolivia.2.t: "Что мы должны делать с немецким и Торо"
 bolivia.2.d: "После нашей окончательной победы над генералами и их восстанием у нас есть еще один вопрос, чтобы затронуть: что мы должны делать с ними? Люди требуют, чтобы мы публично вешали их и показываем своим сторонникам, что демократия преобладает в середине крови и хаоса. \ Nothers говорят, что мы должны просто заставить их уйти в отставку, и очень небольшой процент населения говорит, чтобы сохранить их и сдерживать. \ n \ nwhat мы должны сделать?"
 bolivia.2.a: "Публично повесить их! Заставьте их заплатить за свои преступления!"
 bolivia.2.b: "Принудительно выходить на пенсию"
 bolivia.2.c: "Пусть они останутся"
  
  
 bolivia.3.t: "Торо начал со своими коварными схемами!"
 bolivia.3.d: "Некоторые из наших верных сторонников уведомили нас о том, что Торо собрал большую часть своих сторонников и часть военных и взял под контроль одно из наших штатов! \ n \ nwe нельзя позволить ему продолжать идти с этими схемами, и мы должны остановить его в его треках, прежде чем он выйдет из -под контроля!"
 bolivia.3.a: "Вы заплатите Торо!"
  
  
 bolivia.4.t: "Боливия готова купить чако"
 bolivia.4.d: "Боливийские дипломаты прибыли сегодня, чтобы обсудить, могут ли они купить у нас регион Чако Бореального. Они готовы заплатить нам большую сумму за землю и экономические выгоды для почти полугода в обмен на землю. \ n \ nshuld мы откладываем нашу войну и конфликты и принимаем это предложение?"
 bolivia.4.a: "Да"
 bolivia.4.b: "Нет, мы ничего не даем им"
  
  
 bolivia.5.t: "Боливия готова предоставить нам права на ресурсы в обмен на Тарапаку"
 bolivia.5.d: "Боливийские дипломаты прибыли сегодня в нашу страну, чтобы обсудить, готовы ли мы принять передачу Тарапака в обмен на права на ресурсы в Бени. Бени довольно богат ресурсами, особенно вольфрам и сталью, поэтому даже если мы позволим им иметь Тарапаку, мы все равно получим больше взамен. \ n \ nshould мы примем их предложение?"
 bolivia.5.a: "Конечно"
 bolivia.5.b: "Абсолютно нет"
  
  
 bolivia.6.t: "Боливия готова купить Acre, Pauini, Caceres и Corumba"
 bolivia.6.d: "Боливийские дипломаты прибыли, чтобы обсудить покупку этих территорий. Они готовы заплатить довольно большую сумму денег за территории. Из -за того, что эти территории не являются самыми развитыми частями нашей страны, мы не будем много терять. \ n \ nshould мы примем их предложение?"
 bolivia.6.a: "Да, почему бы и нет"
 bolivia.6.b: "Нет"
  
  
 bolivia.7.t: "Боливия хотела бы раз и навсегда прийти к мировой сделке"
 bolivia.7.d: "Боливийские дипломаты прибыли сегодня, чтобы обсудить тему, которая была в головах парагвайцев и боливийцев: войны Чако и ее последствия. \ n \ nbolivia утверждает, что они готовы поддержать свои претензии на территорию и полностью отказаться от нее в обмен на то, что мы допускаем им военный доступ. \ n \ nshould мы примем их сделку и, наконец, закончили наши военные действия?"
 bolivia.7.a: "Да, лучше иметь союзника, чем враг"
 bolivia.7.b: "Нет, им все равно приходится платить за свою потерю"
  
  
 bolivia.8.t: "Герман скончался"
 bolivia.8.d: "Новости попали в каждую часть страны, которую Герман скончался сегодня. \ n \ nmany предполагает, что он покончил жизнь самоубийством, однако есть небольшое меньшинство, которое считает, что он мог быть убит. \ n \ nrigh сейчас не время размышлять о том, кто его или что убило, теперь пришло время оплакивать смерть нашего президента и надеяться на лучшее. Для будущего Боливии!"
 bolivia.8.a: "Пусть он упокоится с миром"
  
  
 bolivia.9.t: "Боливия пытается взять Антафагаста"
 bolivia.9.d: "Некоторые из наших шпионов заметили странное поведение на боливийской границе, кажется, что они планируют какой -то план, чтобы взять нашу провинцию Антифагаста. Мы должны быть осторожны, поскольку они не используют прямую силу, а скорее подрывные маневры, чтобы взять государство без войны. \ n \ nwe не позволит этим мерзким боливийцам взять дюйм наших земель!"
 bolivia.9.a: "Мы позаботимся о том, чтобы этого не произошло!"
  
 bolivia.10.t: "Боливия заняла [995.GetName], что мы должны делать?"
 bolivia.10.d: "Боливийские силы прошли в [995.GetName] и заняли его силой. Этот отвратительный акт был не только разрешен, но и даже подбадривал местные жители из -за коварных схем, которые боливии сделали в пределах [995.GetName]. \ n \ nwhat мы должны сделать?"
 bolivia.10.a: "Они не сойдут с рук!"
 bolivia.10.b: "Пусть им это ..."
  
  
  ### Peru-Bolivian Confederation Events ### 
  
  
 perubolivia.1.t: "Кто возглавит Конфедерацию?"
 perubolivia.1.d: "С помощью перерождения Конфедерации почти 100 лет спустя нам нужен сильный и могущественный лидер, чтобы возглавить нацию, и мы должны быстро сделать этот выбор. \ n \ nwe есть 4 жизнеспособных варианта: Дэвид Торо, Герман Буш, Луис А. Флорес и Мануэль Прадо Угартач. Двое из Перу, а два из Боливии, и у каждого есть свои уникальные черты. \ n \ nour Leader будет ..."
 perubolivia.1.a: "Дэвид Торо"
 perubolivia.1.b: "Герман Буш"
 perubolivia.1.c: "Луис А. Флорес"
 perubolivia.1.e: "Мануэль Прадо Угартач"
  
  
 perubolivia.2.t: "Какой город должен быть нашей столицей?"
 perubolivia.2.d: "Теперь, когда мы являемся политическим сущностью на карте, нам нужно найти город, чтобы установить в качестве нашей столицы. До сих пор у нас есть 3 варианта: Тачна, Лима и Ла Пас. Каждый из этих городов имеет не только историческое значение для Конфедерации, но и политического значения. \ nout из этих 3 городов, столица Перу-Боливской Конфедерации будет ..."
 perubolivia.2.a: "Такна"
 perubolivia.2.b: "Лима"
 perubolivia.2.c: "La Paz"
  
  
 perubolivia.3.t: "Националисты растут по всей стране!"
 perubolivia.3.d: "Перуанские и боливийские националисты растут во всех частях нашей новой найденной нации. Сила этих националистов довольно сильная и уже формирует локализованные ополченцы, чтобы взять и контролировать провинции в Конфедерации. \ n \ Nall то, что мы знаем сейчас, это то, что это представляет серьезную угрозу для нашей нации, и мы должны взять под контроль ситуацию как можно быстрее!"
 perubolivia.3.a: "Будем ли мы когда -нибудь в мире?"
  
  
 perubolivia.4.t: "Должны ли мы распустить профсоюз?"
 perubolivia.4.d: "Наша нынешняя ситуация выглядит очень мрачной. Мы находимся на войне с перуанскими и боливийскими националистами одновременно, и нынешнее состояние нашего союза кажется очень хрупким. В этой крайней ситуации многие предложили просто уступить народам и раз и навсегда распаковать союз. \ n \ ncondidering наша текущая ситуация, должны ли мы распустить союз и снова стать отдельными народами?"
 perubolivia.4.a: "Да, мы не должны вызывать больше пролитой крови"
 perubolivia.4.b: "Нет, мы сражались слишком много, чтобы просто сдаться!"
  
  
 perubolivia.5.t: "Конфедерация Перу-Боливина приглашает нас в их защиту"
 perubolivia.5.d: "Дипломаты из Конфедерации недавно прибыли в нашу страну, спрашивая нас, хотим ли мы быть частью их защиты против какой -либо внешней угрозы. \ n \ nthey утверждают, что они хотят восполнить потерю жизни во время их войны за независимость. Дипломаты сказали, что конфедерация будет вмешаться в любую защитную войну, в которой мы можем оказаться."
 perubolivia.5.a: "Да, нам нужна их защита"
 perubolivia.5.b: "Мы не собираемся просто стоять за всеми их злодеяниями!"
  
  
 perubolivia.6.t: "[FROM.GetName] объявил войну в страну в рамках пакта обороны!"
 perubolivia.6.d: "[FROM.GetName] в настоящее время борется с одной из стран, которую мы пригласили в защитный пакт, и они не сдерживаются ни в коем случае. \ n \ nas в нашем обещании, мы технически обязаны присоединиться и помочь нашему союзнику против [FROM.GetName]. \ n \ nshall мы присоединяемся и защищаем их?"
 perubolivia.6.a: "Мы сокрушим этими теплением!"
 perubolivia.6.b: "Мы просто не можем позволить себе войну прямо сейчас"
  
  
 perubolivia.7.t: "Перу-боливская конфедерация хочет Путумайо для гарантий"
 perubolivia.7.d: "Дипломаты из Конфедерации приехали в Боготу сегодня, чтобы обсудить потенциальный обмен между нашими народами. Конфедерация будет готова предложить своей армии в качестве поддержки в любом оборонительном конфликте, который мы можем оказаться в обмен на состояние Путумайо. Дипломаты сказали нам, что они считают, что наше состояние является неотъемлемой частью их нации, и они будут готовы предложить свою полноценную поддержку в случае конфликта в рамках этого. Они также утверждают, что хотят восполнить потерю жизни во время их войны за независимость. \ n \ nshould мы примем их предложение?"
 perubolivia.7.a: "Да"
 perubolivia.7.b: "Нет"
  
  
 perubolivia.8.t: "Конфедерация Перу-Боливина хочет, чтобы Чако за гарантии"
 perubolivia.8.d: "Дипломаты из Конфедерации приехали сегодня в Асунсьон, чтобы обсудить потенциальный обмен между нашими народами. Конфедерация будет готова предложить своей армии в качестве поддержки в любом оборонительном конфликте, который мы можем оказаться в обмен на состояние Чако Бореал. Дипломаты сказали нам, что они считают, что наше состояние является неотъемлемой частью их нации, и они будут готовы предложить свою полноценную поддержку в случае конфликта в обмен на это. Они также утверждают, что хотят восполнить потерю жизни во время их войны за независимость. \ n \ nshould мы примем их предложение?"
  
  
 perubolivia.9.t: "Конфедерация Перу-Боливина готова купить наши земли"
 perubolivia.9.d: "Дипломаты из Конфедерации пришли в нашу страну, чтобы предложить предложение: не только выплата 1 гражданской фабрики, но и вмешательство в любую из наших защитных войн. Дипломаты сказали нам, что мы обладаем землями, которые они ценят, и они готовы не только платить, но и предлагают нам защиту в обмен на них. \ n \ n there не отрицает власть, которую держит Конфедерация, так мы должны принять это предложение?"
  
  
  ### Colombia events ### 
  
  
 colombia.1.title: "Лидер армии выпускает эксперт по пустыне"
 colombia.1.desc: "После длительного периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил как эксперт в Desert Combat. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. Новая черта \ n \ n \ nhis, безусловно, поможет вам в будущих битвах за родину."
 colombia.2.title: "Армейский лидер выходит за рамки болотного эксперта"
 colombia.2.desc: "После длительного периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил в качестве эксперта в борьбе с болотом. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. \ n \ nhis Новая черта обязательно поможет вам в будущих битвах за родину."
 colombia.3.title: "Лидер армии заканчивает эксперт в горах"
 colombia.3.desc: "После длительного периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил как эксперт в бою в горах. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. Новая черта \ n \ n \ nhis, безусловно, поможет вам в будущих битвах за родину."
 colombia.4.title: "Лидер армии заканчивает эксперт по холмам"
 colombia.4.desc: "После длительного периода обучения и подготовки местности один из наших лидеров армии наконец -то закончил эксперт в холме. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. \ n \ nhis Новая черта обязательно поможет вам в будущих битвах за родину."
 colombia.5.title: "Лидер армии заканчивает эксперт в джунглях"
 colombia.5.desc: "После долгого периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил как эксперт в бою в джунглях. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. Новая черта \ n \ n \ nhis, безусловно, поможет вам в будущих битвах за родину."
 colombia.6.title: "Лидер армии выпускает лесной эксперт"
 colombia.6.desc: "После долгого периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил как эксперт в бою в лесах. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. \ n \ nhis Новая черта обязательно поможет вам в будущих битвах за родину."
 colombia.7.title: "Лидер армии выпускает эксперт в городских районах"
 colombia.7.desc: "После длительного периода обучения и обучения в этой области один из наших лидеров армии, наконец, закончил в качестве эксперта в бою в городских районах. Без сомнения, это большое достижение не только для него, но и для всей системы военной подготовки. Новая черта \ n \ n \ nhis, безусловно, поможет вам в будущих битвах за родину."
 colombia.1.a: "Пример превосходства."
  
  
 colombia.9.title: "Трагедия Фукена"
 colombia.9.desc: "Сегодня в лагуне Фукенов произошла ужасная трагедия, расположенная в 120 километрах к северу от Боготы. Лодка с перегрузкой пассажиров затонула в ледяных водах лагуны и на очень далеком берегу. Из 27 человек в лодке 21 утонул. Среди жертв - выдающиеся армейские офицеры и несколько выдающихся деятелей нашего общества. Эта катастрофа глубоко перенесла всю страну и рассказала о трауре очень респектабельным семьям столицы."
 colombia.9.a: "Болезненное событие."
 colombia.10.title: "Трагедию была избежана в Фукене"
 colombia.10.desc: "Сегодня в Cundinamarca был бы в истории как трагический день. В лагуне Фукенов моторная лодка с перегрузкой пассажиров собиралась отправиться в ледяные воды лагуны. Тем не менее, пассажиры заняли больше времени, чем ожидалось, чтобы сесть на лодку, поэтому поездка была отложена на несколько минут. Некоторое время спустя внезапная метель, сопровождаемая проливным дождем, помешала им отправиться в плавание. В конце концов было обнаружено, что мотор лодки представлял неудачи, так что, возможно, если бы они отправились в плавание в запланированное время, они были бы в падении, и дождь потопил бы лодку."
 colombia.10.a: "Предупреждение от судьбы ..."
 colombia.11.title: "Военная миссия Рохаса Пиниллы"
 colombia.11.desc: "Верховное командование военного командования предложило отправить делегата от имени страны в иностранную власть или в целенаправленный учебный центр, чтобы привлечь к нему ключевую информацию для развития вооруженных сил. После рассмотрения между многими кандидатами, наконец, руководство выбрало лейтенанта Густаво Рохаса Пинилла для выполнения этой задачи. Единственное, что нужно уточнить, - это то, куда он будет отправлен."
 colombia.11.a: "Отправьте его в Соединенные Штаты."
 colombia.11.b: "Отправьте его в Германию."
 colombia.11.c: "Отправьте его в Центр военных исследований."
  
  
  #colombia.12 
 lideres.protegidos.title: "Либеральные каудильи защищены правительством"
 lideres.protegidos.desc: "После многих лет политических преследований лидеры либеральных лидеров восточной части страны наконец получили поддержку и защиту правительства для выполнения своих действий без вандализма. Либеральное население оценило этот жест, который способствовал стабильности региона."
 lideres.protegidos.a: "Триумф для людей."
  #colombia.13 
 bog.oponen.title: "Либеральные торговцы выступают против переговоров с консерваторами"
 bog.oponen.desc: "Основные либеральные бизнесмены, которые доминируют на рынке в Кундинамарке, не согласились экономически сотрудничать со своими консервативными противниками. Они утверждают, что у них нет гарантий договориться, и что фаворитизм для консерваторов со стороны других бизнесменов может стоить им их работы и их доходов."
 bog.oponen.a: "Они очень упрямы ..."
  #colombia.14 
 bog.aceptan.title: "Либеральные и консервативные бизнесмены согласовывают торговые соглашения"
 bog.aceptan.desc: "После нескольких встреч с директорами промышленных ассоциаций и лидеров национальных компаний Cundinamarca правительству удалось организовать обе группы, либералов и консерваторы, чтобы согласовать их взаимное сотрудничество на рынке. Либеральные промышленники несколько неохотно приняли, хотя они с добрыми глазами видели прибыль, которую можно было получить от синхронизации их компаний, откладывая политические различия."
 bog.aceptab.a: "Взаимная победа!"
  #colombia.15 
 int.acept.title: "Либеральные мэры вступают в должность на Магдалене"
 int.acept.desc: "После долгой кампании институциональной реструктуризации и прямого вмешательства [ROOT.GetLeader] мэры основных городов Магдалена наконец смогли вступить в должность, что было затруднено консервативными директивами этого места. Либеральная делегация радовалась новостям, объявив, что это победа для людей."
 int.acept.a: "Триумф за демократию."
  #colombia.16 
 int.oponen.title: "Консерваторы отвергают новых мэров в Магдалене"
 int.oponen.desc: "Несмотря на то, что президентские усилия по предоставлению канцелярии мэра либеральному избранию было невозможно выполнить эту задачу. Губернаторы консервативных департаментов утверждают, что страна находится в условиях осады с 1899 года, поэтому они конституционно гарантированно «удаляют какое -либо подчиненное с должности, если они считают это целесообразным». Более чем очевидно, что эти конфликты имеют идеологический порядок, но они юридически поддерживаются, и с ними мало что можно сделать."
 int.oponen.a: "Они стремятся препятствовать воле народа."
  #colombia.17 
 prensa.eliminada.title: "Правительство устраняет подрывную прессу"
 prensa.eliminada.desc: "Обширная операция, подготовленная властями, принесла фрукты. Ультраконсервативная газетная пресса, наконец, была расположена в Медельине, откуда она была распространена во всем департаменте, разжигая ненависть к либералам. Многочисленные люди были арестованы, и место печатной дома было назначено под стражей в полиции. Либеральное руководство Антиокии высоко оценило работу правительства и надеется, что с этим фактом политическое насилие уменьшится."
 press.removed.a: "Отличный."
  #colombia.18 
 prensa.continua.title: "Консервативные газеты продолжают распространяться"
 prensa.continua.desc: "Усилия полиции по определению места происхождения ультраконсервативной прессы были неудачными. Первоначально расследования привели к захвату нескольких подозреваемых, всех членов консервативной партии, но документальные доказательства оказались недостаточными для поддержки серьезных обвинений. Процесс в конечном итоге был отложен, и у властей не было выбора, кроме как освободить арестованных."
 prensa.continua.a: "Не долго."
  #colombia.19 
 conser.arrestados.title: "Экстремистские консерваторы арестовывают"
 conser.arrestados.desc: "Военный рейд на протяжении всего Какета сегодня завершился более чем сотней арестов. Экстремистская консервативная организация, которая была посвящена посеву хаоса и угрожающих противников, была распущена с помощью операции. Основные лидеры будут первыми, кто будет представлен перед судьей, и придется ответить за различные преступления. Консервативная партия, с другой стороны, утверждала, что эти люди не имеют никаких связей с партией, но они действовали на своем собственном аккаунте. Они были допрошены несколькими крупными газетами, хотя для прояснения этого факта потребуется более тщательное расследование."
 conser.arrestados.a: "Справедливость сделана."
  #colombia.20 
 conser.escapan.title: "Экстремистские консерваторы убегают от операции"
 conser.escapan.desc: "Несмотря на то, что в Caquetá был запланирован рейд против экстремистов в регионе, ситуация представляла осложнения с первого момента, пока он не завершился полной неудачей. Возможно, старшие лидеры экстремистских обществ выяснили план, поэтому они быстро покинули место, где они должны были быть сегодня. Не было сделано никаких публичных заявлений о том, что произошло, и не ожидается, поскольку очевидно, что это представляет собой позор для национальных учреждений."
 conser.escapan.a: "Мы найдем их."
  #colombia.21 
 conser.mueren.title: "Консервативные лидеры умирают в операции захвата"
 conser.mueren.desc: "Усилия по выявлению и аресте лидеров экстремистских обществ были не так успешны, как ожидалось. В середине рейда ситуация усложнилась несколькими способами, что привело к перекрестному огню, который завершился смертью почти всех арестованных экстремистских лидеров. Консервативная партия осудила неумелое управление правительством по отношению к этим лицам, утверждая, что событие «подтверждает неэффективность национальных институтов» и обвиняет ☻_ в подстрекательстве к политическому насилию с этим типом «чрезмерных действий»."
 conser.mueren.a: "Проклятие."
  #colombia.22 
 pol.desman.title: "Консервативная полиция демонтировала в Нариньо"
 pol.desman.desc: "В тщательно рассчитанной операции военного высшего командования общественным силам удалось проникнуть и начать совместную атаку на казармы консервативных военизированных формирований в Нариньо. Подавляющее большинство этих центров было найдено на окраине Пасто, укрывшись в гасиенде, откуда они планировали свои подрывные атаки и хранили большие кэши оружия. Остатки этой правой военизированной организации изолированы, и они не ожидают, что они будут представлять серьезную проблему, в то время как они захвачены и привлечены к ответственности."
 pol.desman.a: "Целое достижение!"
  #colombia.23 
 pol.gana.title: "Вооруженные силы побеждены консервативными военизированными формами"
 pol.gana.desc: "Тщательная операция, организованная военным высшим командованием в соответствии с президентским порядком, вышла из контроля вскоре после ее начала. Правительственные агенты, проникшие в военизированное формирование, были обнаружены и вынуждены раскрыть всю информацию. Следовательно, когда власти совершили налет на гасиенд, где произошли эти действия, консервативная полиция уже отозвалась, в то время как другие члены остались и убили нескольких солдат, прежде чем сбежать."
 pol.gana.a: "Немыслимо."
  #colombia.24 
 pol.mueren.title: "Конфронтация между консервативной полицией и вооруженными силами"
 pol.mueren.desc: "Гасиенды, которые были на окраине Пасто, стали свидетелем жестокого боя между общественными силами и так называемой консервативной полицией. В борьбе был услышан выстрел, который взорвал всю атмосферу. Неизвестно, откуда это взялось, но конфронтация закончилась несколькими десятками смертей с обеих сторон. Военные силы в конечном итоге окрашились, когда это стало публичным, получив критику главным образом от духовенства. Правительство не решено по этому вопросу, но различные политические сектора требуют объяснения того, что произошло, особенно члены Консервативной партии."
 pol.mueren.a: "Ни за что..."
  
  
 colombia.25.title: "Консервативное восстание!"
 colombia.25.desc: "Накопление политической напряженности, которое мы накопили, наконец взорвалось. На юге страны прошел ожесточенный бой между ополченцами консервативной партии и национальной армии. Ситуация, к сожалению, ясна, консерваторы поднимаются в оружие. \ n \ nwe поступили неправильно, позволив своему подрывному влиянию распространяться по всей стране, и теперь они оказались под контролем страшного Лауано Гомеса. Мало того, что остатки армии восстали, но вся цепочка командования рухнула, и невозможно установить контакт или направлять любое учреждение в области своего влияния. Теперь есть только один вариант: восстановить порядок силой."
 colombia.25.a: "Эта ситуация вышла из -под контроля ..."
 colombia_25_tt: "§Yconservative§! Сторонники начинают гражданскую войну."
  
  
 colombia.26.title: "Военное восстание!"
 colombia.26.desc: "Ренегатные генералы, которые рассматривали управление [COL.GetLeader] с недоверием, действовали. Новости о восстании сопровождались беспорядками по всей армии. Некоторые были подавлены, в то время как другие завершили свою миссию и присоединились к Renegades. Часть высокого командования была распущена, и несколько резервов боеприпасов были разграблены мятежными силами. Хотя Республика не вступила в обобщенный хаос, без сомнения, это событие принесет последствия для администрирования традиционных партий."
 colombia.26.a: "Эта ситуация вышла из -под контроля ..."
 colombia_26_tt: "§Ymilitary§! Начните гражданскую войну."
  
  
 colombia.27.title: "Либеральное восстание!"
 colombia.27.desc: "Либеральная оппозиция оказалась более жестокой, чем мы ожидали. Его лидер, Хорхе Элиеер Гайтан, утверждает, что все это время он пытался делать что -то «мирно», но эскалация насилия была невыносимой. Он не мог остаться незамеченным или иметь дело с экологией пацифизма. Основные лидеры либералов встретились на севере страны и с помощью генерала Альфредо Азуэро Аренас начали вооруженную революцию против правительства. Нет уверенности в размере или силе боя с их импровизированными единицами милиции, но мы знаем, что если восстание не закончится в ближайшее время, они примут столицу и не останутся, пока не контролируют всю страну."
 colombia.27.a: "Эта ситуация вышла из -под контроля ..."
 colombia_27_tt: "§Yliberal§! Сторонники начинают гражданскую войну."
  
  
 colombia.28.title: "Консервативные ополченцы организуются по всей стране"
 colombia.28.desc: "Высокое командование вооруженных сил послало тревожные новости в президентский кабинет. По всей стране сообщалось, что консервативные военизированные формирования вооружались и занимались контролем различных групп населения, в основном на юге. Если мы ничего не сделаем с этим, правительство может потерять контроль над ситуацией."
 colombia.28.a: "Давайте немедленно организуем операцию!"
 colombia.28.b: "Захватить их лидеров достаточно."
 colombia.28.c: "Мы справимся с этим."
  
  
 colombia.29.title: "Лауано Гомес угрожает гражданской войне"
 colombia.29.desc: "Консервативный лидер Лауано Гомес сделал ультиматум правительству. Он подтверждает, что, если нынешнее правительство не останавливает свои действия и включает в себя предложения консерватизма в его положениях, его сторонники возьмут оружие и сделают республику «невозможно». Эта деликатная ситуация потрясла весь национальный кабинет, так как угрозы уверены и звучат вполне реальны."
 colombia.29.a: "Нам придется поддаваться его требованиям ..."
 colombia.29.b: "Давайте изменим несколько вещей, чтобы успокоить его."
 colombia.29.c: "Посмотрим, смеется ли он."
  
  
 colombia.31.title: "Дело Bonitto Vega"
 colombia.31.desc: "Неоправдание генерала Бонайто Вега в качестве министра военного министра - это терпение министерского кабинета. В то время как гражданская власть требует как можно скорее наказать генерала, другие сектора, такие как диссидентская консервативная партия, подтверждают, что только правительство «стремится дискредитировать армию до общественного мнения, в пользу постепенно милитаризованной полиции, преданной интересам действующего президента». Хотя дискуссия напряженная, а мнение разделено, в конце концов, решение основано на [COL.GetLeader]."
 colombia.31.a: "Удалить общую Вегу из обслуживания."
 colombia.31.b: "Это не так уж важно."
  
  
 colombia.32.title: "Генерал Вильямизар неуважительный"
 colombia.32.desc: "Неоправдание генерала Вильямизара в качестве министра военного министра - это терпение министерского кабинета. Это не только игнорирует административные приказы, которые он получает, но также открыто подстрекает к повиновению правительства из -за его «отсутствия лидерства». Они предполагают, что военный суд должен был немедленно выдвинуть, чтобы наказать его увольнением с должности. С другой стороны, другие члены Верховного командования военного, считают, что ситуация не так серьезно, но должна рассматриваться как критика правительства, а не как акт восстания."
 colombia.32.a: "Мы должны создать военный совет!"
 colombia.32.b: "Это не так уж важно."
  
  
 colombia.33.title: "Генерал Нейра показывает нелояльность"
 colombia.33.desc: "Неоправдание генерала Нейры в качестве министра военного министра - это терпение министерского кабинета. Он не только игнорирует административные приказы, которые он получает, но также открыто подстрекает их не подчиняться правительству из -за его «отсутствия лидерства». Они предполагают, что военный суд должен был немедленно выдвинуть, чтобы наказать его увольнением с должности. С другой стороны, другие члены Верховного командования военного, считают, что ситуация не так серьезно, но должна рассматриваться как критика правительства, а не как акт восстания."
 colombia.33.a: "Удалить генерала Нейры из службы."
 colombia.33.b: "Это не так уж важно."
  
  
 colombia.34.title: "Высокий командный орган неуважения"
 colombia.34.desc: "Военное высшее командование, которому предшествовали генералы Хосе Хоакин Вильямизар, Мигель Дж. Нейра и Эдуардо Бонитто Вега, отказывается представлять соответствующие отчеты гражданской власти. Административные приказы также были проигнорированы, и как Конгресс, так и министерский кабинет подозревают, что военные задумали. Советники предлагают наказать это презрение до того, как ситуация обостряется. Со своей стороны, старшие генералы утверждают, что правительство «не имеет силы, необходимых для поддержания порядка», и что они «делают только то, что политики не знают, как это сделать»."
 colombia.34.a: "Суровая санкция является справедливой."
 colombia.34.b: "Предупреждение будет достаточно."
 colombia.34.c: "Это не так уж важно."
  
  
 colombia.36.title: "Военные требуют восстановления генерала Бонитто Вега"
 colombia.36.desc: "Другие члены военного руководства дали понять исполнительной власти своей неудовлетворенности удалением генерала Веги. Они утверждают, что нынешнее правительство не в состоянии отказаться от членов военного высшего командования без разрешения Конгресса, и что оно только «ухудшает очень серьезную ситуацию текущего общественного порядка». Сильные утверждения не были хорошо приняты министерским кабинетом, который подтверждает, что военные превышают свои функции, поэтому, если они поддаются своим требованиям, это будет синонимом передачи власти учреждения. Другие власти, с другой стороны, предвидят возможность военного заговора против гражданской власти, хотя это неубедительные предположения."
 colombia.36.a: "Генерал уже усвоил свой урок."
 colombia.36.b: "Вега останется вне службы."
  
  
 colombia.37.title: "Военные требуют восстановления генерала Вильямизара"
 colombia.37.desc: "Другие члены военного руководства дали понять исполнительной власти своей неудовлетворенности увольнением генерала Вилламизара. Они утверждают, что нынешнее правительство не в состоянии отказаться от членов Верховного командования военного управления без разрешения со стороны Конгресса, и что оно только «ухудшает очень серьезную ситуацию текущего общественного порядка». Сильные утверждения не были хорошо приняты министерским кабинетом, который подтверждает, что военные превышают свои функции, поэтому, если они поддаются своим требованиям, это будет синонимом передачи власти учреждения. Другие власти, с другой стороны, предвидят возможность военного заговора против гражданской власти, хотя они являются неубедительными предположениями."
 colombia.37.a: "Генерал уже усвоил свой урок."
 colombia.37.b: "Вилламизар останется вне службы."
  
  
 colombia.38.title: "Военные требуют восстановления генерала Нейры"
 colombia.38.desc: "Другие члены военного руководства дали понять исполнительной власти своей неудовлетворенности удалением генерала Нейры. Они утверждают, что нынешнее правительство не в состоянии отказаться от членов Верховного командования военного управления без разрешения со стороны Конгресса, и что оно только «ухудшает очень серьезную ситуацию текущего общественного порядка». Сильные утверждения не были хорошо приняты министерским кабинетом, который подтверждает, что военные превышают свои функции, поэтому, если они поддаются своим требованиям, это будет синонимом передачи власти учреждения. Другие власти, с другой стороны, предвидят возможность военного заговора против гражданской власти, хотя они являются неубедительными предположениями."
 colombia.38.a: "Генерал уже усвоил свой урок."
 colombia.38.b: "Нейра останется вне службы."
  
  
 colombia.39.title: "Возвращение Unir"
 colombia.39.desc: "Хотя Unión Nacional de Izquierda Revolucionaria (UNIR) была распущена в 1935 году, чтобы слиться с Либеральной партией, было очевидно, что такая связь не будет длиться долго. Хорхе Элиеер Гайтан, популярный лидер и основатель UniR, решил официально восстановить его политическое движение, которое теперь поддерживается самыми радикальными секторами либерализма, в том числе, среди прочего, его идеологическим партнером Плинио Мендоса Нейра и даже президентом Лопесом Пумарежо. \ n \ nenceing, отличный прием среди населения, UNIR становится более сильным и сильнее, концентрируя огромные популярные массы под руководством Гаитана."
 colombia.39.a: "Большие изменения происходят в Колумбии."
  
  
 colombia.41.title: "Консерваторы организуют переворот"
 colombia.41.desc: "После организации крупной единицы боевиков, поддержанных как большой частью гражданского населения, так и канцелярского сектора, была сформирована мощная консервативная атаку Как и ожидалось, [COL.GetLeader] не предвидел эту ситуацию, поэтому изоляция его и его кабинета в президентском офисе было довольно простой задачей. Вскоре присутствовали основные лидеры консерватизма, Гилберто Альзат Авенданьо и Лауано Гомес. Они были приняты с овациями от сторонников, которые собрались за пределами дворца, чтобы быть в курсе ситуации. \ n \ nafter несколько часов, поздно ночью, [COL.GetLeader] наконец согласился подписать отставку и передать командование страной консервативной партии. Эта новость распространилась по улицам, и в то время как сторонники вечеринки отмечались, во дворце была битва, чтобы выбрать, какой из двух лидеров вступит в должность: дерзкий фалангистский Гилберто Альзат или верный традиционалист Лауано Гомес."
 colombia.41.a: "Альзат - лидер, который нуждается в Колумбии."
 colombia.41.b: "Лауано Гомес - единственный, кто стабилизирует республику."
  
  
 colombia.42.title: "[ROOT.GetLeader] выходит из президента"
 colombia.42.desc: "Сегодня президент [ROOT.GetLeader] выразил Конгресс серьезное «пренебрежение» классических либеральных директив в решении национальных проблем. Разногласия в либерализме, добавленные к упрекам консервативной партии, разделили государственное управление и сделали невозможным управление. В отличие от этого, он утверждал, что его мандат не может продолжаться в соответствии с этим сценарием, и что он должен уступить командование тем, кто действительно наслаждался широко распространенной популярной поддержкой. Таким образом, [FROM.GetLeader] официально подал в отставку с президентской команды, чтобы передать ее нынешнему мэру Боготы (и кандидата на следующие выборы) Хорхе Элиеер Гайтан. \ n \ ngaitán - это прославленная личность, которая не только перемещает весь колумбийский народ своим красноречием и упорством, но и проявляет реальный интерес к полной реформировании колумбийской системы. Среди огромного празднования его последователей Гайтан принял командование Республикой, и после изысканного дискурса лозунг его кампании был услышан в унисон: люди, за вашу победу, обвинение!"
 colombia.42.a: "Гайтан не человек, он народ ..."
  
  
 colombia.43.title: "Переворот терпит неудачу!"
 colombia.43.desc: "Ополченцы, организованные Консервативной партией, были недостаточно эффективны для переворота. План состоял в том, чтобы напасть на президентский дворец и силу [COL.GetLeader], чтобы уйти в отставку. Тем не менее, президентской гвардии было достаточно долго, чтобы уведомить армию о ситуации. Вооруженные силы мобилизовались, и за считанные минуты ситуация была в абсолютном хаосе. Радиостанции быстро распространяют сообщение, и, в гневе, сотни консервативных боевиков штурмовали арстерские из полицейских участков и сформировали большие группы гражданских лиц. Натиск этих подразделений был настолько серьезным, что противники, либеральные сторонники, также вышли на улицы с оружием в руках. Ситуация обострилась до тех пор, пока два основных лидера партийного консерватора, Лауано Гомес и Гилберто Альзат Авендано, не заявили, что «перед лицом неспособности гражданской борьбы остается только сила», и тем самым инициируя гражданскую войну между консервативными сторонниками и оставшимися лоялистами в администрации [COL.GetLeader]. Даже в самой армии сотни солдат покинули, чтобы присоединиться к консервативным рядам. Республика в настоящее время находится в беспрецедентном беспорядке."
 colombia.43.a: "Alzate приведет нас к победе!"
 colombia.43.b: "Мы победим под руководством Лауано Гомес!"
  
  
 COL_grc_rejected: "Они отклонили предложение"
  
  
 colombia.44.title: "[FROM.GetName] ищет нашу аннексию"
 colombia.44.desc: "В последнее время в [FROM.GetName] существует риторика, обращаясь к старой идее реформирования старой колумбии. Таким образом, благодаря популярной инициативе, [COL.GetLeader] попросила наше правительство мирно реинтегрировать нас на свою территорию. Принятие подразумевает нашу независимость и автономию правительству Боготы, поэтому трудно сделать вывод, будет ли это полезно или нет. Ясно, однако, что нынешнее колумбийское правительство, как правило, является репрессивным и авторитарным, поэтому, возможно, подача - не лучший вариант поначалу."
 colombia.44.a: "Мы будем следовать по пути [FROM.GetAdjective]."
 colombia.44.b: "Эквадорский народ останется свободным!"
  
  
 colombia.45.title: "Эквадор отвергает аннексию!"
 colombia.45.desc: "Утверждая, что независимость Эквадора в настоящее время является окончательной, [FROM.GetLeader] категорически отрицал, что он переворачивал свою нацию в наш проект восстановления Гран-Колумбия. Эквадор закрыл свои границы и развернул несколько подразделений по пути, возможно, ожидая возможных военных действий с нашей стороны."
 colombia.45.a: "Тогда это будет силой ..."
  
  
 colombia.46.title: "Эквадор соглашается с нашими требованиями"
 colombia.46.desc: "[FROM.GetLeader] получен с энтузиазмом предложение, которое мы выдвинули. Политические движения страны, которая стремилась к воссоединению Гран Колумбии, отпраздновали это решение и объявили, что они будут сотрудничать с нашим правительством во всех необходимых усилиях."
 colombia.46.a: "Они выбрали хорошо."
  
  
 colombia.47.title: "[FROM.GetName] стремится реинтегрировать нас на их территорию"
 colombia.47.desc: "Наш маленький перешар был частью Гран Колумбии давным -давно, но наши люди решили отделиться из -за отсутствия внимания, которое мы получили от центрального правительства. Теперь [FROM.GetLeader] предлагает, чтобы мы присоединились к ним, возобновить проект Gran Colombia. Мы должны принять?"
 colombia.47.a: "Судьба Панамы с Колумбией."
 colombia.47.b: "Наша независимость более ценна, чем их амбиции!"
  
  
 colombia.48.title: "Панама снова отказывается быть частью Гран Колумбии!"
 colombia.48.desc: "Решение [FROM.GetLeader] было точным: Панама никогда не примет аннексию к [FROM.GetName]. Это вызвало много десятилетий, когда перешар находился под нашим контролем и был проигнорирован нынешними правительствами. Он утверждал, что борьба за независимость Панамы была окончательным и необратимым событием, и что народ Панамы должен процветать самостоятельно. Очевидно, что перед вторжением в наши силы перешай был беззащитным. Тем не менее, основной недостаток заключается в том, что в регионе нет наземного маршрута, так как Darien Gap является неприступным джунглями."
 colombia.48.a: "Они не знают, что для них хорошо."
  
  
 colombia.49.title: "Панама собирается аннексировать"
 colombia.49.desc: "Наша просьба раскрыла панамскому народу текущую реальность: Панама - это нация в кризисе, о которой она превращается в марионетку Соединенных Штатов. Поэтому, когда новости о гран-кольмбийском проекте достигли их ушей, сотни людей проявились в столице страны и утверждали, что Панама должна быть реинтегрирована в Колумбию не только из-за структурных и политических изменений, которые она переживает, но и потому, что она представляет более многообещающее будущее, чем анклав северо-американцев. Перед лицом популярного давления [FROM.GetLeader] одобрило предложение, и процесс аннексии уже продолжается."
 colombia.49.a: "Они выбрали правильный вариант."
  
  
 colombia.50.title: "[FROM.GetName] предлагает возобновить кольмбийский проект"
 colombia.50.desc: "[FROM.GetLeader] ясно дал понять: с тех пор, как он принял президентство соседней страны, его заинтересован в воссоединении Gran Colombia. Его пожелания наконец -то материализовались, поэтому он уведомил нас о возможности объединения наших двух наций, чтобы дать непрерывность мечте о освободителе Симоне Боливаре. Однако принятие будет подразумевать подчинение всей нашей независимости и автономии управлению Боготой, в дополнение к всегда настойчивой оппозиции за принятие без дополнительных осложнений, которые Венесуэла перестает существовать как нация. Многие показали свою поддержку движения, хотя другие также твердо отказались принять. Окончательное решение находится в руках [VEN.GetLeader]."
 colombia.50.a: "Юнайтед мы будем чтить наследие Боливара!"
  colombia.50.b:0 "This is only lust for power. 
  
  
 colombia.51.title: "[FROM.GetName] отказывается сотрудничать в проекте Gran Colombian!"
 colombia.51.desc: "После резких дебатов между правителями [FROM.GetAdjective] на местном и национальном уровне [FROM.GetLeader] заявил, что [FROM.GetName] не будет внезапно аннексирован. Они утверждали, что общее происхождение, которое «Юнайтед Колумбия» и «Венесуэла» были потеряны давно, и что объединение сделает новую нацию неустойчивой в дополнение к распространению политической нестабильности [ROOT.GetName] на территорию [FROM.GetAdjective]. Не ясно, заказал ли [FROM.GetLeader] военный уход, чтобы избежать вторжения со стороны нас, но не о чем задуматься."
 colombia.51.a: "Они позор для освободителя!"
  
  
 colombia.52.title: "Правительство [FROM.GetAdjective] одобряет наше предложение"
 colombia.52.desc: "После резких дебатов между венесуэльскими лидерами на местном и национальном уровне посольство уведомило нас, что [FROM.GetName] будет гармонично сотрудничать в восстановлении Большой Колумбии. Как было предусмотрено в нашем предложении, [FROM.GetLeader] останется во главе новой администрации в регионе, и будут проведены бюрократические процедуры, необходимые для объединения."
 colombia.52.a: "Возвращение Гран Колумбии приближается."
  
  
 colombia.53.title: "[FROM.GetName] готов купить ягуас"
 colombia.53.desc: "[FROM.GetAdjective] Дипломаты предоставили вероятность того, что мы продаем им штат Ягуас. Когда -то это было частью Гран Колумбии, и, хотя он не представляет стратегическую или широко промышленно развитую область, они настаивают на том, чтобы мы отказались от земли. Это может сделать это разумным предложением, но мы должны рассмотреть стоимость и выгод от продажи и может ли это быть осуществимым в долгосрочной перспективе. Мы должны принять?"
 colombia.53.a: "Интересное предложение."
 colombia.53.b: "Наша земля не продается."
  
  
 colombia.54.title: "[FROM.GetName] принимает продажу ягуаса"
 colombia.54.desc: "Ягуас был частью Гран Колумбии и помог ему иметь последовательную границу с Амазонкой. Поэтому очень приятно знать, что [FROM.GetName] знал, как это распознать, и согласился уступить территорию нам. Вскоре, чтобы восстановить территорию [FROM.GetAdjective] на юге."
 colombia.54.a: "Дипломатия - это тонкое искусство."
  
  
 colombia.55.title: "[FROM.GetName] отвергает предложение Ягуаса"
 colombia.55.desc: "[FROM.GetLeader] имел смелость отрицать нас на территории Ягуаса. Это государство было частью Большой Колумбии, и без него наша новая нация не будет иметь постоянную границу с Амазонкой. Они подтверждают, что их суверенитет над территорией является единственным признанным, и они не собираются его менять."
 colombia.55.a: "Тогда мы возьмем это сами!"
 colombia.55.b: "Это позор."
  
  
 colombia.56.title: "[FROM.GetName] хочет купить Mapari"
 colombia.56.desc: "[FROM.GetAdjective] Дипломаты информировали правительство о заинтересованности [FROM.GetName] к приобретению состояния Мапари. Они утверждают, что готовы заплатить значительную сумму, и что это будет очень помогать в реконструкции их границы, предложенной [COL.GetLeader]. Должны ли мы принять это предложение?"
 colombia.56.a: "Интересное предложение."
 colombia.56.b: "Наша земля не продается."
  
  
 colombia.57.title: "[FROM.GetName] принимает предложение Мапари"
 colombia.57.desc: "[FROM.GetLeader] соглашается продать нам Mapari, если мы платим согласованную цену и уважаем другие пределы, которые мы имеем с ними. Гарризоны [FROM.GetName] уже сняты, и смена администрации уже была уведомлена населению района, который (или, по крайней мере, большинство) видит это изменение с надеждой."
 colombia.57.a: "Отличный."
  
  
 colombia.58.title: "[FROM.GetName] отказывается продавать Mapari"
 colombia.58.desc: "[FROM.GetLeader] не согласен с продажей нам Mapari, так как считает, что наши амбиции заходят слишком далеко, вмешиваясь в его суверенитет. Следовательно, возможно, что они укрепят военное присутствие в этом районе, чтобы избежать возможной ссоры. Министерский кабинет сожалеет о том, что дипломатическое соглашение не может быть достигнуто, и война начинает рассматриваться как правдоподобный вариант."
 colombia.58.a: "Это будет наше снова, любой ценой."
 colombia.58.b: "Там нечего делать."
  
  
 colombia.59.title: "[FROM.GetName] хочет договориться о покупке Japurá"
 colombia.59.desc: "Благодаря дипломатической записке правительство [FROM.GetAdjective] уведомило о своей заинтересованности в штате Джапра, которое находится под нашим контролем. Эта территория, которая когда -то была частью Гран Колумбии, кажется, представляет часть национальной идентичности Новой Республики, которую [FROM.GetLeader] стремится к созданию. Вот почему они предложили купить территорию, вариант, который резонирует среди правительственных советников как жизнеспособность в нынешней напряженной панораме."
 colombia.59.a: "Интересное предложение."
 colombia.59.b: "Наша земля не продается."
  
  
 colombia.60.title: "[FROM.GetName] соглашается продать Japurá"
 colombia.60.desc: "[FROM.GetLeader] считает возможным передать нам контроль над Japurá в обмен на согласованную оплату. Бюрократические процедуры уже ведутся, и пограничные охранники были мобилизованы до полученной разделительной линии. Население праздновало эту веху и приветствует будущее нашей страны."
 colombia.60.a: "Наши границы восстанавливаются."
  
  
 colombia.61.title: "[FROM.GetName] не согласен продавать Japurá"
 colombia.61.desc: "[FROM.GetLeader] не считает возможным передать нам контроль над Japurá, независимо от того, сколько мы платим. Его заявление было завершено, и он просит, чтобы подобное предложение не было представлено снова, поскольку решение является окончательным. Общественное мнение не смотрело выгодно на этот дипломатический провал, но из -за ситуации страны не так много, что с этим можно сделать."
 colombia.61.a: "Ну, мы возьмем это у них!"
 colombia.61.b: "Это позор."
  
  
 colombia.62.title: "[FROM.GetName] Запрашивает продажу Гуаяны Эсекиба"
 colombia.62.desc: "[FROM.GetAdjective] Дипломаты предоставили возможность им продавать территорию Essequibo. Это может быть разумным предложением, но мы должны принять во внимание количество ресурсов, которые содержит в этом месте, и затрат на затрат на продажу. Мы должны принять?"
 colombia.62.a: "Интересное предложение."
 colombia.62.b: "Наша земля не продается."
  
  
 colombia.63.title: "[FROM.GetName] готов продать эссекейбо"
 colombia.63.desc: "[FROM.GetName] согласился дать нам Essequibo в обмен на доступную промышленную квоту. На самом деле не ожидалось, что [FROM.GetName] согласится, но, учитывая мировую панораму, вполне вероятно, что они примут из -за своей неспособности удержать эту территорию."
 colombia.63.a: "Наши границы восстанавливаются."
  
  
 colombia.64.title: "[FROM.GetName] не будет вести переговоры о продаже Essequibo"
 colombia.64.desc: "Представители [FROM.GetName] ясно дали понять, что территория Essequibo не будет продаваться ни при каких обстоятельствах нашей стране, поскольку она является областью стратегических и основных ресурсов. Возможно, ожидая наших планов, они мобилизовали войска в пограничную зону для своей защиты. С ним мало что можно сделать дипломатически."
 colombia.64.a: "Если они так сильно настаивают на сохранении того, что у нас ..."
 colombia.64.b: "Тогда он останется в их руках."
  
  
 colombia.65.title: "Латиноамериканский блок"
 colombia.65.desc: "С угрозой коммунизма и демократического популизма, нависшей над миром, президент Колумбии [COL.GetLeader] предложил установить альянс, который мог бы сохранить наши народы стабильными и безопасными перед лицом конфликта. Вспоминая наши общие корни, Колумбия стремится, что этот новый «латиноамериканский блок» представляет превосходство автократической воли. Этот альянс приведет не только к мощному союзу в воинственном контексте, но и взаимной поддержке против любой атаки."
 colombia.65.a: "Отличная идея."
 colombia.65.b: "Мы не заинтересованы в союзе с отсталой страной."
 colombia.66.title: "Правительство [From.GetAdjective] соглашается присоединиться к латиноамериканскому блоку."
 colombia.66.desc: "Было уведомлено, что правительство [From.GetAdjective] соглашается войти в латиноамериканский блок, чтобы противостоять и уравновешивать текущие мировые полномочия. Соответствующие процедуры продолжаются, поэтому мы надеемся, что альянс будет формализован очень скоро, и мы получим общие разведывательные отчеты."
 colombia.66.a: "Наш союз потрясет мировые силы."
 colombia.67.title: "Правительство [From.GetAdjective] не заинтересовано в присоединении к латиноамериканскому блоку."
 colombia.67.desc: "Посол [From.GetName] дал понять, что они не заинтересованы в создании союза с нами. Он упоминает, что в настоящее время глобальная ситуация не заслуживает этого типа предложения, и что они способствуют, учитывая деликатный контекст, в котором мир оказывается."
 colombia.67.a: "Они могут передумать позже."
  
  
 colombia.69.title: "Выборы 1938 года"
 colombia.69.desc: "Эти выборы были историческими, так как это первый раз (благодаря реформам Лопесу Пумарехо), что избиратели не требовали условий аренды или иллюстрации для голосования. Как и планировалось, консерваторы воздерживались от участия, утверждая, что у них нет шансов на победу и демократические гарантии. Поэтому либеральный Эдуардо Сантос выиграл без соперников с 511 947 голосами."
 colombia.69.a: "Люди говорили."
 colombia.71.title: "Выборы 1942 года"
 colombia.71.desc: "По состоянию на четыре года назад Либеральная партия одержала победу на этих выборах. Бывший президент Лопес Пумарехо снова побежал в качестве кандидата и стал торжествующим против другого кандидата либеральной дифференциации. Хотя предстоящие четыре года являются многообещающими, наиболее укоренившиеся консерваторы угрожают новое президентство. Будем надеяться, что они не процветают."
  
  
 colombia.72.title: "Продвижение Роджас Пиниллы"
 colombia.72.desc: "Офицер Густаво Рохас Пинилла демонстрирует исключительный талант и способность командовать единицами. Некоторые приписывают его его знаниям, приобретенным в его военной миссии, в то время как другие утверждают, что это естественный дар. Его выступление впечатлило его начальства, которые единогласно решили продвигать его до генерала. Однако для того, чтобы продвижение вступила в силу, она должна быть одобрена президентом [ROOT.GetLeader], как требуется в соответствии с законом."
 colombia.72.a: "У него есть одобрение."
 colombia.72.b: "Он еще не готов."
  
  
 colombia.73.title: "Оппозиционный вопрос"
 colombia.73.desc: "Фокус этого нового консервативного состояния сосредоточена на старых правителях и вечных противниках традиционалистской доктрины: либералов. Нет сомнений в том, что их руководство было чрезвычайно популярным, но это не оправдывает, что их реформы велись Колумбии по пути атеизма и анархии. Это было неприемлемо. \ n \ nnow, несмотря на то, что наш переворот был успешным, либералы продолжают представлять серьезную проблему для республики. У них нет никакой власти, но они продолжают мобилизоваться против институционального порядка на улицах. Такие персонажи, как Хорхе Элиеер Гайтан, только подстрекают массы, чтобы противоречить правительству, и если они продолжится, наступит момент, когда мы не будем контролировать страну. Но, учитывая, что его старая администрация была довольно успешной, у нас осталось только два варианта: либо сотрудничать с ними, чтобы избежать популярного гнева, либо атаковать их с такой силой, что они никогда не восстановят."
 colombia.73.a: "Пришло время для национального примирения."
 colombia_73_a_tt: "§YLiberal Subversive Empulcyt§! будет расти §R25%§! быстрее, но устранение его будет легко."
 colombia.73.b: "Мы не будем отдавать страну тем, кто отчужден!"
 colombia_73_b_tt: "§YLiberal Subversive Emplaince§! будет расти §G35%§! медленнее, но устранение его будет тяжело."
  
  
 colombia.74.title: "Республика в беспорядке"
 colombia.74.desc: "Правительство Лауано Гомес не было популярным. Стабильность страны, по -видимому, становится все более низкой, в то время как политическое насилие, либо между традиционными партиями, либо среди идеологических фанатиков, достигало точки остроты, никогда не наблюдалось ранее, в сочетании с постоянным страхом неизбежной войны невообразимых масштабов. Оппозиция обвинила Лауано Гомеса и его экстремистскую и репрессивную политику. Удивительно, но эти сторонники против Лавеано нашли союзника в вооруженных силах. Военные также подвергали сомнению новый режим, и во главе с Густаво Рохасом Пиниллой они согласились с оппозицией и теперь, похоже, организуют серьезное восстание. Возможно, единственный способ помешать стране вступить в свою десятую гражданскую войну, - это уступить власть Рохасу и повстанцам мирно ..."
 colombia.74.a: "Посмотрим, смеют ли они!"
  
  
 colombia.75.title: "Восстание оппозиции"
 colombia.75.desc: "То, что мы предвидели, произошло, и все же это застало нас врасплох. Ныне повстанческий генерал Густаво Рохас Пинилла консолидировал достаточно власти среди оппозиции, чтобы привести вооруженное восстание. Срочные сообщения поступают почти из каждого углу, объявляющего о том, что несколько военных гарнизонов поднялись и распределили оружие среди гражданского населения. Цепочка командования упала, армия была рассеяна, и правительственные силы горячо борются за восстановление институционального контроля. Колумбия вступила в кровавую гражданскую войну."
 colombia.75.a: "Неблагодарные предатели!"
 colombia_75_tt: "Сторонники §Ygustavo rojas pinilla§! начнут гражданскую войну."
  
  
 colombia.76.title: "Переворот мнения"
 colombia.76.desc: "Люди и оппозиция празднуют падение режима Лауано Гомес. В том, что они назвали «государственным переворотом» (так как он поддерживается почти всей страной). Генерал Густаво Рохас Пинилла принял президентство, не проливая ни капли крови. Роджас Пинилла обещает стабилизировать страну и привести ее во время славы, никогда не видевшего ранее под каким -либо другим режимом. Это, безусловно, не будет сложно для него, учитывая, что он не только чрезвычайно популярен, но и и искусен в том, чтобы держать армию вместе под своей фигурой."
 colombia_76_tt: "§YComando General de Las Fuerzas Armadas§! становится правящей стороной."
 Colombia.76.a: "И так начинается еще один военный режим ..."
  
  
 colombia.77.title: "Наши силы побеждают американцев"
 colombia.77.desc: "Воля наших людей одержала победу над американскими амбициями, чтобы захватить нашу территорию. Офицеры храбрых армии возглавляли обвинение против гарнизонов США; Такая насильственная атака оказалась невозможной для отталкивания, и сегодня наши силы занимали триумфы канала. Изменение администрации было проведено, и морское пересечение теперь окончательно находится под нашим контролем."
 colombia.77.a: "Мы возвращаем то, что принадлежит нам!"
  
  
 colombia.78.title: "Армия побеждена на перешейке"
 colombia.78.desc: "Диктатор Колумбии [From.GetLeader] имел смелость начать серьезное наступление против наших сил в Панамском канале с близлежащих баз. К сожалению, они преуспели, и наши запутанные войска выходят. Атака ухудшила нашу способность проецировать нашу силу миру, что является международным унижением."
 colombia.78.a: "К сожалению, у нас есть более насущные проблемы. Эмбарго должно быть достаточно."
 colombia.78.b: "Это заслуживает больше, чем предупреждение!"
  
  
 colombia.79.title: "Армия побеждена в канале"
 colombia.79.desc: "Военное наступление не имело ожидаемого успеха в канале. Волки США посадили жесткую защиту, установив фронт, который был невозможно для того, чтобы сломать. Офицеры уже приказали уйти, и наши люди втянулись обратно в перешаголь."
 colombia.79.a: "Небольшое неудобство, больше ничего."
  
  
 colombia.80.title: "Нашим силам удается сдержать атаку на канал"
 colombia.80.desc: "Диктатор Колумбии [From.GetLeader] имел смелость начать серьезное наступление против наших сил в Панамском канале с близлежащих баз. К счастью, нашим смелым солдатам удалось остановить свою работу и отразить захватчиков. Атака показала, что мы больше не являемся мастерами континента, что является международным унижением."
 colombia.80.a: "К сожалению, у нас есть более насущные проблемы. Эмбарго должно быть достаточно."
 colombia.80.b: "Эти действия неприемлемы!"
  
  
 colombia.81.title1: "[USA.GetName] сдает давление на Панамский канал"
 colombia.81.title2: "Конфликты для контроля Панамского канала"
 colombia.81.desc1: "После неожиданного нападения на Панамский канал колумбийские силы занимали окружающую территорию и рассеяли там силы США. [COL.GetLeader] описал это событие как полную и окончательную победу, утверждая, что вся панамская территория, наконец, «в руках его законного владельца». Международное сообщество признает, что это событие является унижением для сил США и может означать снижение этой страны. Хотя [USA.GetLeader] не делал никаких заявлений в данный момент, было бы неудивительно, если бы он ответил серьезными репрессиями против южноамериканской нации."
 colombia.81.desc2: "После неожиданного нападения на Панамский канал колумбийские вооруженные силы напали на анклав США с близлежащих военных баз. Тем не менее, атака не удалась и стала поразительным поражением для агрессоров. Ни [COL.GetLeader], ни [USA.GetLeader] не предоставили заявления в этом отношении, в то время как международные аналитики согласны с тем, что это событие не останется незамеченным, поэтому было бы неудивительно, если американцы отреагируют серьезными репрессиями против латинской нации."
 colombia.81.a: "Мы просто показываем нашу силу!"
 colombia.81.b: "Преступление суверенитета Соединенных Штатов."
 colombia.81.c: "Колумбия притворяется, что действует без последствий?"
  
  
 colombia.82.title: "Переговоры о нефтяных месторождениях"
 colombia.82.desc: "Подобно нашим мексиканским и венесуэльским коллегам, наша страна является одним из крупнейших производителей нефти в регионе. Наша экономика в значительной степени зависит от его добычи, но недавняя индустриализация показала, что казну нации не только наполнены так называемым «черным золотом». \ n \ nto останавливается почти исключительно от этого экспорта, мы организовали план по предоставлению уступок другим демократическим иностранным державам в обмен на поддержку в гражданском и военном производстве. Это не только принесет пользу нам в промышленных вопросах, но также будет поддерживать военное дело в защиту демократии в эти трудные времена. Единственное, что осталось, - это подписать план и выбрать, кому мы собираемся представить его."
 colombia.82.a: "Американскому оборудованию нужно колумбийское топливо."
 colombia.82.b: "Французская армия немного нефти на нефти."
 colombia.82.c: "Наша нефть поможет Британскому Королевскому флоту."
 colombia.82.d: "Другие основные державы нуждаются в наших ресурсах."
  
  
 colombia.83.title: "Колумбия предлагает уступку своих нефтяных месторождений"
 colombia.83.desc: "В неожиданном повороте событий колумбийское посольство прислало нам план, разработанный Им [COL.GetLeader], в котором оно предложило предоставить США права на одно из своих нефтяных полей в обмен на простую и модифицированную промышленную квоту. Принятие предложения является заманчивым вариантом, хотя, если наша страна не хватает заводов, нам, возможно, придется отвергнуть его."
 colombia.83.a: "Замечательное предложение!"
 colombia.83.b: "Мы не можем принять сейчас."
 COL_oil_concession: "Они дали нам свои ресурсы"
  
  
 colombia.84.title: "[FROM.GetName] принимает концессию"
 colombia.84.desc: "Дипломатическая записка сообщила нам, что [FROM.GetLeader] проявил большой интерес к предложению нашего плана концессии и немедленно приняла его. Соответствующие процедуры уже ведутся, и ожидается, что вскоре концессия будет формализована, и мы получим нашу промышленную квоту."
 colombia.84.a: "Отличный!"
  
  
 colombia.85.title: "[FROM.GetName] отвергает концессию нефти"
 colombia.85.desc: "Хотя мы были уверены, что [FROM.GetName] собирается принять наше предложение, новость удивительно появилась, что они отвергли его. Они утверждают, что они не в состоянии соответствовать промышленной квоте, о которой мы просим в обмен и что мы должны искать другой вариант."
 colombia.85.a: "Это будет для кого -то другого."
  
  
 colombia.86.title: "Олигархи осуждают правительство [ROOT.GetLeader]"
 colombia.86.desc: "Срочный доклад Министерства финансов подтверждает, что нация вступила в деликатный экономический и социальный кризис. Несколько предпринимателей и олигархов решили отозвать свои основные отрасли из страны, узнав, что [ROOT.GetLeader] ратифицировал противоречивую аграрную реформу, выразив, что реформа была «ненужной» и что она «против национального предпринимательства». Следовательно, магнаты закрыли свои основные отрасли и заявили, что не открывают их, пока правительство не гарантирует «справедливое обращение, которого они заслуживают». Если правительство не произносит это, несомненно, что другие олигархи в стране примут одно и то же решение."
 colombia.86.a: "Но это на благо людей!"
  
  
 colombia.87.title: "Профсоюзы мобилизуются против правительства"
 colombia.87.desc: "Сегодня тревожные новости достигли президентского офиса. Основные профсоюзные организации в стране были сыты на горло ожиданием сотрудничества правительства. Гнев этих групп достиг своего пика, когда они были уведомлены о том, что администрация [ROOT.GetLeader] не санкционировала аграрную реформу, столь же хотела бы за профсоюз, но продолжала с политикой, которая привилегирует олигархи над работниками. Из -за этого лидеры профсоюзов подстрекали своих последователей блокировать дороги, отрезать поставки и организовать общие удары по всей стране. Они утверждают, что эти действия не останутся до тех пор, пока правительство не сдаст и не будет реформировать трудовой закон."
 colombia.87.a: "Но это на благо Республики!"
  
  
 colombia.88.title: "Колумбийско-американский договор о помощи"
 colombia.88.desc: "В связи с тем, что фашистская и коммунистическая угроза, подвигающаяся над западным миром, президент Колумбии [COL.GetLeader] предложил мы вступить в союз, который мог бы сохранить стабильные и защищенные наши нации и защищены перед лицом возможного конфликта."
 colombia.88.a: "Стратегический альянс."
 colombia.88.b: "Мы не заинтересованы."
  
  
 colombia.89.title: "Соединенные Штаты подписывают договор"
 colombia.89.desc: "Посольство США в столице подтвердило, что [USA.GetLeader] согласился ратифицировать договор и что оно вступит в силу как можно скорее. Тем не менее, мы можем видеть его последствия только тогда, когда мы находимся в вооруженном конфликте."
 colombia.89.a: "Добрая весть!"
  
  
 colombia.90.title: "Соединенные Штаты отвергают договор"
 colombia.90.desc: "Посольство США в столице сообщило, что [USA.GetLeader] не заинтересован в ратификации Договора о помощи и что оно не хотелось принимать аналогичное предложение в эти времена войны."
 colombia.90.a: "Так что мы не можем рассчитывать на них ..."
  
  
 colombia.91.title: "Воссоединение Гран Колумбии"
 colombia.91.desc: "После восстановления всех стран, принадлежащих к старой бабушке Колумбии, правительство во главе [ROOT.GetLeader] объявило международному сообществу официальным воссоединением Гран Колумбии. Вдохновленные политическими идеями Симона Боливара, паннационалистская пропаганда распространилась по всей стране, укрепив доверие граждан в будущем своей новой родины. \ n \ nwhewight, это «возрождение наследия Боливара» дало многое поговорить на американском континенте. В то время как некоторые утверждают, что нестабильность заставит зарождать обрушиться на республику, другие считают, что внешние угрозы являются более большой проблемой. На данный момент будущее колумбийского народа остается загадкой."
 colombia.91.a: "Мир будет знать, на что мы способны!"
 colombia.91.b: "Еще один дисбаланс власти в регионе."
 colombia.91.c: "Это не длится долго!"
  
  
 colombia.92.title: "Переворот d'etat в Gran Colombia"
 colombia.92.desc: "В ответ на крах гражданской администрации в Колумбии во время президентства Лауано Гомес, две традиционные партии страны поддержали восстание во главе с генералом Густаво Рохасом Пиниллой. Хотя это восстание было близок к тому, чтобы стать еще одной гражданской войной для страны, военные, наконец, свергли правительство Лауано Гомес и установили Рохас Пиниллу в качестве нового главы государства. Историческое событие \ n \ n \ nthis было названо аналитиками «Coup Coup», поскольку оно поддерживалось практически всеми политическим сектором нерауреанистов нации. Несмотря на то, что новое правительство не дало явных заявлений, ожидается, что Рохас Пинилла стабилизирует страну и уменьшит насильственное наследие своего предшественника."
 colombia.92.a: "Новая эра для Колумбии!"
 colombia.92.b: "Это было следовало ожидать."
 colombia.92.c: "Мы победим их в любом случае!"
  
  
 colombia.93.title: "Óscar Benavides Rebels против правительства!"
 colombia.93.desc: "Генерал Оскар Бенавидс в течение некоторого времени демонстрировал тенденции к неповиновению. Было ясно, что он не полностью согласен с новым правительством, которое было создано после Учредительного собрания. Сегодня было наконец объявлено, что его восстание является окончательным: Бенавидс оставил свою позицию и пересек Колумбию во время декларации войны. Теперь он на службе наших врагов, пытаясь создать новый режим в нашей стране при их поддержке."
 colombia.93.a: "Предатель!"
  
  
 colombia.95.title: "Временное правительство Лорето"
 colombia.95.desc: "Поскольку Лорето в оккупации нашими вооруженными силами генерал Бенавидс предложил установить там новое предварительное предварительное правительство. Уже был установлен административный приказ для поддержания порядка, и они начали набирать военные ополченцы для поддержки перуанского дела. Бенавидс выразил благодарность нам и надеется, что отношения между новым перуанским государством и нашей нацией будут близки и дружелюбны."
 colombia.95.a: "Вместе мы восстановим порядок в Перу."
  
  
 colombia.96.title: "Смерть Васкеса Кобо"
 colombia.96.desc: "Республика в трауре. После нескольких проблем со здоровьем генерал Васкес Кобо, герой колумбийской перперианской войны и великий противник политиков, умер сегодня. Его продвинутый возраст не был препятствием, чтобы возглавить переворот против двух традиционных партий, которые привели нацию к состоянию циклического и вечного насилия. Его наследие будет жить в будущем нации, и его преданность никогда не будет забыта колумбийским народом. Но теперь вопрос в том, кто возглавит республику?"
 colombia.96.a: "Создание военной хунты будет держать личные интересы."
 colombia.96.b: "Генеральный персонал будет принимать правительственные функции."
 colombia.96.c: "Генерал Вилламизар должен взять командование."
 colombia.96.d: "Генерал Бонатто Вега - правильный лидер."
  
  
 colombia.97.title1: "Армия берет под контроль япон"
 colombia.97.title2: "Вооруженные силы занимают Мапари"
 colombia.97.desc1: "Скоординированная атака, которую мы запланировали на Джапуру, имела полный успех. Бразильские силы отозвались и были дезорганизованы, в то время как наши триумфально заняли государство. Нет необходимости ждать, чтобы узнать, что [BRA.GetLeader] не будет реагировать наилучшим образом на это событие, но, по крайней мере, превосходство нашей армии над их Япура скоро будет официально реинтегрирован в Колумбию."
 colombia.97.desc2: "Быстрое наступление наших войск было жестоким столкновением между нашей армией и бразильцем. Полученный бой длился какое -то время, пока не закончилась нашей победой и последующим занятием Мапари. Командиры батальонов получили множественную похвалу за эту победу, а также генерал, отвечающий за ведение конфронтации. Мапари определенно находится под колумбийским контролем, как и должно быть."
  
  
 colombia.98.title1: "Армия побеждена в Японии"
 colombia.98.title2: "Наши силы побеждены в Мапари"
 colombia.98.desc1: "Скоординированная атака, которую мы запланировали на Japurá, была полной неудачей. Бразильские силы установили ожесточенное сопротивление, и наши солдаты не могли обеспечить территорию. Не нужно ждать, чтобы узнать, что [BRA .GetLeader] не будет реагировать наилучшим образом на это событие, независимо от того, насколько они успешны. В худшем сценарии между нашими народами может разразиться полномасштабная война."
 colombia.98.desc2: "Быстрое наступление наших войск было жестоким столкновением между нашей армией и бразильцем. Полученный бой длился некоторое время, но, к сожалению, мы не смогли взять под контроль Мапари. Командиры батальонов не могут объяснить, как такая запланированная атака не имела ожидаемого успеха, в то время как общее командование ссылается на различные факторы разных видов. Войска были очень деморализованы этим поражением, так же, как общественное мнение ставит под сомнение истинную эффективность нашей армии."
  
  
 colombia.99.title1: "Атака на Джапруру отталкивается"
 colombia.99.title2: "Колумбийцы уходят из Мапари"
 colombia.99.desc1: "Колумбия имела смелость начать серьезное наступление против наших сил в Япаре с близлежащих баз. Это было то, что мы ожидали, зная диктаторские амбиции [COL.GetLeader]. К счастью, нашим смелым солдатам удалось остановить свою работу и отразить захватчиков. Эта героическая защита показала, что наша армия продолжает быть более высоким стандартом, усиливая наш суверенитет в регионе и наше национальное единство."
 colombia.99.desc2: "Неожиданное колумбийское нападение на гарнизон в Мапари заставило наших людей вовлечь агрессоров. К счастью, подразделения были достаточно сильны, чтобы удерживать свои позиции, и даже не метр земли не оказался под контролем противника. [BRA.GetLeader] высоко оценил работу и героизм солдат в Амазонке, но все же задается вопросом, было бы целесообразно организовать военный ответ или поддерживать статус -кво."
 colombia.99.a: "Мы демонстрируем наше превосходство."
 colombia.99.b: "Это акт агрессии!"
  
  
 colombia.100.title1: "Колумбийские силы занимают япон"
 colombia.100.title2: "Колумбийская армия берет контроль над Мапари"
 colombia.100.desc1: "Колумбия имела смелость начать серьезное наступление против наших сил в Япаре с близлежащих баз. Это было то, что мы ожидали, зная диктаторские амбиции [COL.GetLeader]. К сожалению, наша армия не смогла отразить атаку, и государство попало в руки колумбийцев. Похоже, что наша нация находится в упадке, и вполне возможно, что другие страны воспользуются этим внешним видом, чтобы внести свои преимущества."
 colombia.100.desc2: "Неожиданное колумбийское нападение на гарнизон в Мапари заставило наших людей вступить в борьбу с агрессорами. К сожалению, было невозможно отразить атаку, и государство оказалось под колумбийской оккупацией. Военные чиновники предлагают завершить план по возвращению их назад, но, учитывая результат битвы, он, вероятно, будет бесплодным."
 colombia.100.a: "Пусть им это будет тогда."
 colombia.100.b: "Это неслыханно!"
  
  
 colombia.101.title: "Колумбия планирует захватить нашу территорию на севере"
 colombia.101.desc: "[COL.GetLeader] имел нерв, чтобы претендовать на свою нацию ту территорию, которую мы контролируем на севере, и что мы только что получили несколько лет назад. Если мы не отправим оборону на границу с Колумбией, они могут захватить его без слов, что было бы медленной услугой для нашего правительства и бразильской армии."
 colombia.101.a: "Мы справимся с ситуацией должным образом."
  
  
 colombia.102.title: "Изгнанные колумбийские политики предлагают свою поддержку"
 colombia.102.desc: "После того, как переворот в Колумбии во главе с Альфредо Васкесом Кобо в Колумбии многие политики должны были войти в изгнание из -за неизбежного поглощения власти военными. Тем не менее, они по-прежнему полны решимости вернуть власть в своей стране и восстановить предыдущий институциональный приказ. Это их возможность. Некоторые из этих изгнанников предложили правительству сотрудничать с нами в нашей борьбе, предоставив нам свои знания о внутренней работе страны, чтобы получить стратегическое преимущество. Наши правительственные советники не согласны с принятием или нет этого предложения, поскольку мы не уверены в его намерениях или если они даже верны."
 colombia.102.a: "Нам нужна была эта помощь!"
 colombia.102.b: "Мы не можем им доверять"
  
  
 colombia.103.title: "Политики в изгнании поддерживают [From.GetName]!"
 colombia.103.desc: "После переворота Альфредо Васкеса Кобо в Колумбии многим политикам пришлось войти в изгнание из -за неизбежного поглощения власти военными. Тем не менее, они по-прежнему решили восстановить контроль и восстановить предыдущий институциональный приказ. Теперь, когда конфликт, нависающий над Колумбией, эти изгнания нашли свою возможность действовать; У них была смелость предложить себя правительству [From.GetAdjective] в качестве сотрудников, чтобы свергнуть новый военный режим. Теперь враг знает, как работает наше правительство, и оно будет иметь стратегическое преимущество в бою."
 colombia.103.a: "Даже из -за границы они предают свою страну!"
  
  
 colombia.104.title: "Триумф Конфедерации в войне Объединения"
 colombia.104.desc: "Наша поддержка профсоюзных сил оказала большую помощь в их кампании. Триумф их миссии был хорошо принят населением, и новая конфедерация Перу-Боливина была официально провозглашена. [PRU.GetLeader] уведомил свою благодарность нашему правительству и надеется, что отношения между новой нацией и нашей нашей Тем не менее, они могут с подозрением относиться к нашим намерениям поддерживать гегемонию региона, что может привести к будущим конфликтам. Но эти догадки неубедительны, и до тех пор, пока наши действия тонкие, в нашей работе не должно быть никаких недостатков."
 colombia.104.a: "Отличный."
  
  
 colombia.105.title: "Профсоюзные активы готовятся к восстанию!"
 colombia.105.desc: "В тот момент, когда мы меньше всего ожидали, наконец наступил. Мы знаем, что юнионистские ополченцы готовятся взять оружие, и мы мало что можем сделать, кроме как подготовиться к надвигающейся гражданской войне. Весьма вероятно, что они будут учитываться при военной поддержке колумбийцев, но ситуация не позволяет нам сейчас иметь дело с ними. Сначала мы должны встретиться с профсоюзами, а затем мы возьмем на себя ответственность за их архитекторов."
 colombia.105.a: "Мы их раздавим!"
  
  
 colombia.106.title: "Правительство Колумбии поддерживает подрывные ополченцы"
 colombia.106.desc: "Наши разведывательные отчеты сообщают, что крайне правые организации, которые выступают за воссоединение Перу-Боливийской Конфедерации, увеличивают свою деятельность в стране. Эти инциденты были ранее изолированы, но они усиливаются из -за того, что, по -видимому, является финансовой поддержкой со стороны колумбийцев. Эти обвинения являются деликатными, поэтому отсутствие убедительных доказательств оставляет нас в необработанном положении. В любом случае, лучше подготовиться, пока не станет слишком поздно."
 colombia.106.a: "Кто они думают?!"
  
  
  ## Generic Startup Event 
 EUYL_startupevent.1.t: "Спасибо, что сыграли в Unión y Libertad | Переработка Южной Америки!"
 EUYL_startupevent.1.d: "Большое спасибо за то, что играли в мод. Если вы столкнетесь с какой -либо ошибкой, не стесняйтесь сообщать об этом в Steam или на раздорах. Кроме того, имейте в виду, что этот мод доступен на английском, испанском и португальском. Si Llegan ancontrar Cualquier Bug, ReportEnlo en Steam O en Discord. POR FAST TENGAN EN CUENTA QUE ESTE MOD ESTA ОПРЕДЕЛИВКА ENGLES, ESPAñOL, Y PORTUGUES. SE Você Encontrar Algum Bug, Sinta-se à vontade para relatá-lo no Steam ou ou out disord. Алем Диссо, Лембре-Се-де-Ке-Эсте мод Está Disponível Em Inglês, Espanhol E Portuguess."
 EUYL_startupevent.1.a: "Сладкий, я буду"
 EUYL_startupevent.1.b: "Иисус Христос, перестань меня беспокоить"
  
  
 news.bolivia.t: "Боливийская гражданская война"
 news.bolivia.d: "После отказа Техады покинуть армию, генералы Германа Буша и Дэвид Торо решили взять оружие, использовать свою военную поддержку и влияние на вооруженные силы и устроить полномасштабное восстание против правительства Техады. Многочисленные сообщения о взрывах уже произошли, и происходит борьба, поскольку это сообщение отправляется во всем мире. Страна очень равномерно разделена, и многие эксперты не уверены в том, какими будут результаты этого конфликта, а также последствия, которые он принесет. \ n \ unall то, что мы можем сделать, это надеяться, что ситуация не обостряется за пределами Боливии."
 news.bolivia.a: "Мы собираемся закончить это!"
 news.bolivia.b: "Надеюсь, они смогут оправиться от этого"
  
  
  
  
  ### Brazil ### 
 brazil.1.t: "Кофейные плантации предлагают помочь нашей экономике"
 brazil.1.d: "Владельцы различных кофейных плантаций пришли к соглашению и решили предоставить нам некоторые из своих активов нашему правительству, чтобы помочь нам в наших проектах. \ n \ ntheir помощь будет очень удобна и может дать нам только то, что нам нужно для многих из наших самых амбициозных проектов. Похоже, что они хотят быть погашенными, если мы позволяем их плантациям процветать под нашим руководством."
 brazil.1.a: "Это будет очень полезно!"
  
  
 brazil.2.t: "Городское развитие разрушило одну из наших плантаций"
 brazil.2.d: "К нам пришли новости о том, что городское развитие расширило настолько, что разрушило плантацию. Владельцы упомянутой плантации очень злится на нашу «халатность» ситуации, и мы требуем, чтобы мы восстанавливаем их плантацию и/или сокращаем наше городское развитие. \ n \ nat На этом этапе нам нужно индустриализировать нашу страну, поэтому отступает в этот момент не сокращать ее. Наша зависимость от кофе уменьшится, но, возможно, это в лучшую сторону."
 brazil.2.a: "Извините за это ..."
  
  
 brazil.3.t: "Нелегальная кофейная плантация была установлена"
 brazil.3.d: "Из -за уменьшающейся силы кофейных плантаций в экономике страны многие начали устанавливать нелегальные плантации в разных частях страны. Владельцы этих нелегальных плантаций, похоже, раздражаются наше управление плантациями, и они утверждают, что мы относились к ним довольно плохо, поэтому они решили протестовать, установив эти нелегальные плантации. \ n \ nshuld мы останавливаем людей за этими незаконными плантациями? Или мы позволяем этому скользить и видим, к чему это ведет?"
 brazil.3.a: "Пусть они сделают это"
 brazil.3.b: "Помешать им сделать это"
  
  
 brazil.4.t: "Плантации повстанцы против правительства"
 brazil.4.d: "Некоторые из плантаций, юридически или незаконно созданы, начали восстать против нашего правительства с момента нашего внезапного перехода к промышленно развитой экономике. \ n \ nit кажется, что наш переход к промышленно развитой экономике не будет таким плавным, как казалось. Нам нужно будет бороться с огнем и закрыть повстанцев, пока не стало слишком поздно. \ n \ n's не скажет, как это пойдет, но нам просто нужно надеяться на лучшее."
 brazil.4.a: "Мы выиграем эту битву!"
  
  
 brazil.5.t: "Плантации были успешно остановлены"
 brazil.5.d: "После многих месяцев туда -сюда мы смогли успешно остановить повторные плантации и успокоить ситуацию. Из -за массовых протестов и кровавых репрессий их, мы, скорее всего, никогда не сможем зависеть от кофе, по крайней мере, в течение длительного времени. Хорошо, что теперь мы можем полностью сосредоточиться на построении нашей экономики и развитии нашей отрасли. Если все пойдет хорошо, мы сможем поставить этот ужасный инцидент и посмотреть на новое яркое будущее."
 brazil.5.a: "Это было в лучшем виде"
  
  
 brazil.6.t: "Фермеры согласились на наше соглашение"
 brazil.6.d: "Владельцы плантаций в нашей стране согласились позволить нашей стране индустриализации с медленной и контролируемой скоростью, позволяя их плантациям продолжать процветать, пока мы медленно промышленно реализовываемся."
 brazil.6.a: "Мы будем расти нации вместе"
  
  
 brazil.7.t: "Фермеры отказались от нашего соглашения"
 brazil.7.d: "Владельцы плантаций отказались от нашего соглашения и сказали нам не разрушать свой бизнес любой ценой. Кажется, что наш переход к промышленно развитой экономике не будет таким плавным, как казалось."
 brazil.7.a: "Похоже, у нас будет новый враг"
  
  
 brazil.8.t: "Сколько бы вы хотели инвестировать в армии?"
 brazil.8.d: "У нас есть выбор инвестировать определенное количество нашей политической власти в нацию на расширение нашей армии. Некоторые эксперты говорят нам немного инвестировать и нарастать со временем, в то время как другие говорят нам как можно больше инвестировать. \ n \ ngiven эти варианты, с какими мы должны пойти?"
 brazil.8.a: "Инвестируйте немного"
 brazil.8.b: "Вкладывать большую сумму"
 brazil.8.c: "Инвестируйте много"
  
  
 brazil.9.t: "Бразилия просит лицензию на производство наших танков"
 brazil.9.d: "Бразильские политики и генералы прибыли в Вашингтон, округ Колумбия, сегодня, чтобы попросить нас просить. Они запрашивают доступ для производства наших танков и для некоторых наших танков. В последние годы отношения с Бразилией и бразильцами улучшались, и их доминирующий статус в Южной Америке может иметь большое стратегическое значение для нас, особенно в будущем, если мы когда -нибудь окажемся в тяжелой ситуации. \ n \ nwith эти факторы, должны ли мы принять их запрос?"
 brazil.9.a: "Принять их запрос"
 brazil.9.b: "Отрицать их просьбу"
  
  
 brazil.10.t: "Бразилия просит купить одного из наших перевозчиков"
 brazil.10.d: "Бразильцы заметили наши модели перевозчиков и решили, что они могут хорошо использовать одного из наших перевозчиков в своем собственном флоте. \ n \ nshuld мы позволим им приобрести одного из наших перевозчиков?"
 brazil.10.a: "Да"
 brazil.10.b: "Нет"
  
  
 brazil.11.t: "Политические противники протестуют против наших пропагандистских кампаний"
 brazil.11.d: "Различные чиновники и многие из их сторонников ответили против нашего увеличения влияния на политическую сферу нации. Протесты начали распространяться по всей стране, так как тысячи начинают утверждать, что мы эгоистично увеличиваем свою собственную власть. \ n \ thorns становятся больше и больше с наших сторон, чем больше мы стараемся выполнять нашу политическую повестку дня. Мы должны осознавать выбор, который мы делаем, и последствиями, которые могут прийти после."
 brazil.11.a: "Они не будут протестовать гораздо дольше"
  
  
 brazil.12.t: "[FROM.GetName] хотел бы, чтобы мы инвестировали в их страну"
 brazil.12.d: "[FROM.GetName] недавно связался с нами, спрашивая, не будем ли мы вкладывать средства в их экономику. Они утверждают, что мы получим в долгосрочной перспективе, и наша экономика будет расти вместе с их. \ n \ nshould мы инвестируем некоторые из наших резервов в [FROM.GetName]?"
 brazil.12.a: "Да, абсолютно"
 brazil.12.b: "Нет, у нас нет денег, чтобы сэкономить"
  
  
 brazil.13.t: "[FROM.GetName] инвестировал! Куда мы должны положить деньги?"
 brazil.13.d: "Наши чиновники сообщили о некоторых отличных новостях, [FROM.GetName] принял наш запрос и вложил в нашу экономику хорошую сумму своих резервов. \ n \ nit теперь зависит от нас, чтобы решить, где мы хотели бы в конечном итоге положить эти деньги. \ n \ nwith Этот выбор в ладони, где мы должны вкладывать эти деньги?"
 brazil.13.a: "Инвестируйте его на гражданские рынки"
 brazil.13.b: "Инвестировать в армию"
 brazil.13.c: "Инвестируйте это в военно -морской флот"
 brazil.13.e: "Инвестируйте его в инфраструктуру и железнодорожную систему"
  
  
 brazil.14.t: "[FROM.GetName] не принял нашу просьбу"
 brazil.14.d: "К сожалению, [FROM.GetName] отказался от нашей просьбы инвестировать в нашу страну, заявив, что у них просто недостаточно запасных денег, чтобы инвестировать в нашу страну. Будем надеяться, что они смогут инвестировать в другой раз."
 brazil.14.a: "Несчастный"
  
  
 brazil.15.t: "Варгас начал подготовку к созданию его estado novo!"
 brazil.15.d: "Варгас официально начал готовиться к своей версии Бразилии, установившись в центре страны и приводя к нему. \ n \ nnot много известно как о том, как он собирается добиться такого подвига, однако многие люди размышляют о возможном собственном перевороте, чтобы свергнуть Конгресс и полностью контролировать нацию. Мы должны знать, что планирует Варгас, и мы должны убедиться, что он не мешает нам."
 brazil.15.a: "Мы позаботимся о том, чтобы он этого не сделал!"
  
  
 brazil.16.t: "Конгресс вмешался в наши планы"
 brazil.16.d: "Конгресс Бразилии заметил наши беспрецедентные действия на государство и ввел различные реформы, чтобы попытаться уменьшить влияние на нашу страну. \ n \ ncondidering власть Конгресса в данный момент, мало что можно сделать, но с достаточными усилиями и временем мы могли бы перевернуть приливы."
 brazil.16.a: "Они не смогут остановить нас"
  
  
 brazil.17.t: "Конгресс вмешивается в наши планы на диктатуру"
 brazil.17.d: "Конгресс заметил некоторые из наших странных действий и начал создавать общенациональные реформы, чтобы оттолкнуть прогресс нашей диктатуры. \ n \ nhow они смогли выяснить, что наши планы все еще остаются загадкой, но мы должны опасаться их действий. Если они продвинут слишком много реформ, то у нас могут быть серьезные проблемы."
 brazil.17.a: "Средние реформы не останут нас!"
  
  
 brazil.18.t: "Коммунисты планируют распространять свое влияние на другое государство"
 brazil.18.d: "Наше освещение Intel над нацией уладило коммунистическую подрывную деятельность в государстве, в котором ранее не сообщалось о какой -либо такой деятельности. Кажется, что коммунисты планируют полностью установить себя там. \ n \ nwe нужно попытаться остановить их, пока не стало слишком поздно."
 brazil.18.a: "Позвольте им принять это, мы возьмем это позже"
 brazil.18.b: "Эти проклятые коммунисты не берут еще один дюйм этой страны!"
  
  
 brazil.19.t: "Коммунисты распространили пропаганду по стране"
 brazil.19.d: "Коммунисты начали распространять массовую пропаганду о своем движении к народу Бразилии, особенно в штатах, где в настоящее время активна подрывная деятельность. \ n \ nthey также нацелены на фермеров и нижний класс, поэтому мы должны следить за штатами, где у нас есть плантации."
 brazil.19.a: "Такая Scummy Tactics"
  
  
 brazil.20.t: "Коммунисты планируют нанести ущерб государству!"
 brazil.20.d: "Некоторые из наших тайных шпионов сообщили о довольно пугающем открытии: коммунисты планируют сознательно нанести ущерб в состоянии, где они влияют на то, чтобы услышать их голос. \ n \ nwe должны быть очень осторожны, поскольку мы еще не знаем, насколько серьезным может быть ущерб. Мы должны попытаться остановить их как можно быстрее."
 brazil.20.a: "Ты серьезно?"
  
  
 brazil.22.t: "Интегралисты увеличивают свое влияние на страну"
 brazil.22.d: "Используя некоторую довольно сомнительную тактику, интегралисты увеличили свое влияние на политику этой страны и начинают представлять серьезную угрозу для административной власти, которую мы имеем в стране. \ n \ nwe нужно попытаться остановить их, прежде чем они станут слишком сильными. По крайней мере, мы должны убедиться, что они дружелюбны к нашему правительству."
 brazil.22.a: "Они не добрались ..."
  
  
 brazil.23.t: "Конгресс проектирует реформы, чтобы более эффективно контролировать нацию"
 brazil.23.d: "Конгресс официально объявил о новой волне реформ для страны и ее политики, чтобы закрепить еще большую опору на страну. Это нарушит некоторые из наших планов, и приведет к всплеску влияния Конгресса на страну. \ n \ nwhate, это требует, мы должны убедиться, что Конгресс не делает это часто, чтобы мы могли правильно продолжить с нашими планами."
 brazil.23.a: "Надоедливое раздражение"
  
  
 brazil.24.t: "Наши шпионы успешно противостояли коммунистам"
 brazil.24.d: "Наши шпионы сообщили с некоторыми фантастическими новостями, они смогли расстроить дело и арестовать коммунистов, которые занимали штат. \ n \ nwith такая важная победа, коммунистическое движение наверняка получит огромный удар от этого. Нам просто нужно подтолкнуть немного больше, и мы могли бы полностью иметь дело с коммунистами."
 brazil.24.a: "Это фантастические новости!"
  
  
 brazil.25.t: "Наши шпионы были противостояли"
 brazil.25.d: "К сожалению, наши шпионы были побеждены коммунистами, пытаясь остановить коммунистическую подрывную деятельность. \ n \ nthis был огромным поражением и полным унижением. Коммунисты, скорее всего, в полной мере воспользуются этим поражением, чтобы использовать его против нас. \ n \ nall, что осталось, это надеяться, что мы сможем остановить все, что пойдет дальше."
 brazil.25.a: "Это ужасно!"
  
  
 brazil.26.t: "Интегралисты ожидают назначения Plinio Salgado"
 brazil.26.d: "Интегралисты до сих пор поддерживают наши усилия по установлению более авторитетного правила, и из -за этого они ожидают, что мы назначаем Плинио Сальгадо в качестве министра образования. \ n \ nwhether или нет, мы делаем, что в конечном итоге зависит от нас, и каждый из наших выборов будет иметь как положительные, так и отрицательные."
 brazil.26.a: "Пока мы увидим"
  
  
 brazil.27.t: "Интегралисты заняли одно из наших штатов!"
 brazil.27.d: "Местные отчеты сообщили нам, что интегралисты начали заниматься военностью в военном отношении, чтобы установить доминирование над политической сферой Бразилии."
 brazil.27.a: "Черт возьми, все это, черт возьми!"
  
  
 brazil.28.t: "Интегралисты падают хаос в одном из их оккупированных государств"
 brazil.28.d: "Интегралисты решили снести одно из штатов, которые они занимают как акт сопротивления против нашего правительства. \ n \ nif они продолжают эти вопиющие акты терроризма, тогда будут серьезные последствия."
 brazil.28.a: "Чертовы ублюдки"
  
  
 brazil.29.t: "Сторонники интегралистов начинают протесты по всей стране"
 brazil.29.d: "Интегралисты вышли на улицы по всей стране, чтобы протестовать против подавления их движения и администрирования нашей страны. Plínio Salgado и Gustavo Barroso - это возвышенные головы этих протестов и целенаправленно пытаются дестабилизировать нацию. Протесты должны немедленно остановиться, а лидеры арестованы. Если эти протесты продолжатся, то у нас могут быть серьезные проблемы."
 brazil.29.a: "Вниз с интегрализмом!"
  
  
 brazil.30.t: "Интегралисты усиливают свое восстание"
 brazil.30.d: "Используя различную дешевую пропагандистскую тактику и влияние на страну, интегралисты усилили свое восстание и строят полномасштабные планы в начальной гражданской войне. \ n \ nwe должны быть хорошо подготовлены к этому конфликту, все наши люди должны быть призваны в случае полной гражданской войны."
 brazil.30.a: "Будем надеяться, что мы сможем остановить это"
  
  
 brazil.31.t: "Carlos Prestes был арестован"
 brazil.31.d: "Коммунистическая революция Carlos Prestes была поймана и арестована нашими властями. Это нанесет огромный удар по коммунистическому движению и, несомненно, повлияет на них на долгие годы. \ n \ nthis не будет совершенно плавной победой, так как коммунисты, скорее всего, будут предпринять последнюю попытку ответить против тюремного заключения Prestes, но без их лидера мы должны иметь возможность справиться с этим довольно быстро."
 brazil.31.a: "Большой!"
  
  
 brazil.33.t: "Пребы начинают планы восстания"
 brazil.33.d: "Проработав под тени в течение некоторого времени, коммунисты начали планировать полномасштабное восстание, чтобы отомстить за неудачную попытку восстания 1935 года. В прошлый раз, на этот раз он, кажется, намного более организован, и количество людей, поддерживающих пребы, намного больше, чем попытка 1935 года. Мы должны быть осторожны здесь, один неправильный шаг может стоить нам значительно."
 brazil.33.a: "Они будут раздавлены!"
  
  
 brazil.35.t: "Враждебные фермеры кофе выступают против нашей вечеринки"
 brazil.35.d: "Сердитые фермеры кофе занялись сельской местностью, чтобы протестовать и выступить против нашей вечеринки. Они требуют, чтобы мы давали им больше политического представительства и вкладывают больше наших ресурсов в кофейные плантации."
 brazil.35.a: "Нам это не нужно сейчас"
  
  
 brazil.36.t: "Враждебные кофейные плантации бойкотировали свою прибыль"
 brazil.36.d: "Враждебные кофейные плантации объединились и бойкотировали нашу экономику, не давая своей прибыли добраться до национального правительства. Этот акт протеста оказался вредным для нашей экономики, и мы должны иметь дело с ними как можно быстрее."
 brazil.36.a: "Они будут помещены на их место!"
  
  
 brazil.37.t: "Варгас подавил наше движение"
 brazil.37.d: "Варгас заметил, что наше движение набирает обороты среди людей, поэтому он и его члены кабинета решили принять более политический подход. Варгас публично осквернял наше движение и сделал шаги, чтобы подавить нашу способность распространять наше движение в другие места страны. \ n \ nthis тираническое правило скоро рухнет, и Варгас заплатит за то, что он сделал!"
 brazil.37.a: "Хорошо сказал коллега -сторонник. Варгас упадет!"
  
  
 brazil.38.t: "Варгас дестабилизирует наши планы"
 brazil.38.d: "С Scummy Tactics Vargas вмешивался в наши планы и дестабилизировал наше восстание в некоторой степени. Благодаря этому нам необходимо ускорить наши планы, чтобы компенсировать этот икота."
 brazil.38.a: "Мы можем иметь дело с защитой"
  
  
 brazil.39.t: "Коммунисты в [FROM.GetName] хотят нашей поддержки в их восстании"
 brazil.39.d: "Агенты под прикрытием из [FROM.GetName] пришли в нашу штаб -квартиру, чтобы попросить поддержку в их восстании против угнетения от [FROM.GetLeader] и их авторитарного режима ». \ n \ nthey утверждают, что мы обладаем тем, что им нужно, чтобы иметь успешное крестьянское восстание против нынешнего правительства, и будем готовы полностью погасить наш вклад в их восстание. \ n \ nshuld мы одолжим им нашу помощь?"
 brazil.39.a: "Это наш золотой шанс, мы поможем им"
 brazil.39.b: "Мы не можем позволить себе помочь в данный момент"
  
  
 brazil.40.t: "[FROM.GetName] согласился помочь нам"
 brazil.40.d: "Наши тайные агенты вернулись с отличными новостями! Они сказали, что [FROM.GetNameDEF] поможет нам в нашем восстании и предоставит нам все, что нам нужно, если мы возвращаемся."
 brazil.40.a: "Идеальный"
  
  
 brazil.41.t: "[FROM.GetName] отказался помочь нам"
 brazil.41.d: "Наши тайные агенты вернулись из [FROM.GetName] с душераздирающими новостями. Они сказали, что не будут одолжить нам помощь в нашем восстании против правительства."
 brazil.41.a: "Это ужасно!"
  
  
 brazil.42.t: "Варгас узнал о нашей деятельности и вмешался!"
 brazil.42.d: "Варгас узнал о нашей деятельности, с помощью которой мы еще не узнали. Наши люди были арестованы, выполняя эту задачу, и наши общие планы были неудачными из -за этого. \ n \ nwe должны быть более осторожными в ближайшем будущем, иначе Варгас может узнать обо всех наших планах."
 brazil.42.a: "Он заплатит за это!"
  
  
 brazil.43.t: "Варгас был убит"
 brazil.43.d: "Радио по всей стране начали сходить с ума, поскольку сообщения подтвердили, что Варгас был убит тем, что кажется неопознанной террористической группой. Начались последствия этого душераздирающего события, поскольку люди по всей стране начали массовые протесты, большинство из которых были жестокими и приводят к стрельбе. \ n \ n Нация рухнет, когда мы говорим, пожалуйста, если кто -то там читает, оставайтесь в безопасности, оставайтесь в помещении и будьте осторожны с тем, с кем вы окружаете. Они могут быть союзником или врагом, ожидающим атаки!"
 brazil.43.a: "Наше время пришло"
  
  
 brazil.44.t: "Неудача в попытке Ассазинации Варгаса"
 brazil.44.d: "На сегодняшний день появились сообщения о том, что против Варгаса была попытка убийства. Группа, ответственная за это, была определена как часть Коммунистической партии Бразилии. Однако намерения по -прежнему остаются загадкой для общественности и правительства. Какими бы ни была конечная цель, Варгас официально объявил о полной бечной войне против коммунистов в стране и будет «искоренить» их от нации, независимо от затрат."
 brazil.44.a: "Дерьмо! Это не прошло, как и ожидалось!"
  
  
 brazil.45.t: "Сепаратисты Паулиста начинают брать оружие"
 brazil.45.d: "С нацией в состоянии внутренней войны и хаоса, националистические настроения в Сан -Паулу начали расти в геометрической прогрессии, а некоторые даже начали брать оружие, чтобы стать суверенной нацией. \ n \ n последствия, которые это вызовет, все еще не подходит для обсуждения, но сейчас нам приходится решать эту проблему под рукой."
 brazil.45.a: "Это не хорошо"
  
  
 brazil.46.t: "Интегралисты начали вооружаться"
 brazil.46.d: "Поскольку наша нация углубляется и глубже в анархии, интегралисты начали брать оружие и организовывая себя. \ n \ nfrom, что кажется, они планируют полномасштабное восстание и пользуются катастрофой, которая в настоящее время является Бразилии. \ n \ nwe должны осторожно относиться к тому, что они делают, после того, как все их восстание могло бы склонить шкалы этой войны, к лучшему или к худшему."
 brazil.46.a: "Мы их раздавим!"
  
  
 brazil.47.t: "Интегралисты усилили свое восстание"
 brazil.47.d: "Отчеты некоторых из наших замаскированных сторонников сообщили нам о различных планах интегралистов о повышении силы их восстания. Они хотят выиграть эту гражданскую войну, несмотря ни на что, и будут делать это любыми необходимыми средствами. \ n \ nwe должны подготовиться к их восстанию, только Бог знает, когда они будут атаковать, и сколько мужчин поддержит свои идеалы."
 brazil.47.a: "Они все еще проиграют!"
  
  
 brazil.48.t: "Интегралисты выиграли выборы"
 brazil.48.d: "Голоса были подсчитаны, и результаты вышли. Интегралисты пошли вперед в подсчете голосов и вступят в должность начиная с сегодняшнего дня. Мир шокирован этим результатом, так как никто не ожидал, что фашистская партия в Бразилии выйдет на первое место. Немецкие и итальянские дипломаты уже поздравляют интегралистов с победой, и люди празднуют на улицах."
 brazil.48.a: "Пришло время сиять"
  
  
  #add more 
 brazil.48.t: "Интегралисты выиграли выборы"
 brazil.48.d: "Голоса были подсчитаны, и результаты вышли. Интегралисты пошли вперед в подсчете голосов и вступят в должность начиная с сегодняшнего дня. Мир шокирован этим результатом, так как никто не ожидал, что фашистская партия в Бразилии выйдет на первое место. Немецкие и итальянские дипломаты уже поздравляют интегралистов с победой, и люди празднуют на улицах."
 brazil.48.a: "Пришло время сиять"
  
  
  #add more maybe 
 brazil.49.t: "Хосе Америко выиграл выборы"
 brazil.49.d: "Голоса были подсчитаны, и результаты вышли. Хосе Америко де Алмейда пришел вперед в подсчете голосов и будет вступить в должность сегодня. \ n \ nbeing, поддерживаемая Варгасом, Америко обещает не сильно измениться в стране и еще больше улучшить страну. Поскольку мир быстро сжигается, он также пообещал оставаться полностью нейтральным в случае глобального конфликта."
 brazil.49.a: "Люди говорили"
  
 brazil.50.t: "Партия Демократического союза выиграла выборы"
 brazil.50.d: "Он голоса был подсчитан, и результаты вышли. Бразильский демократический союз во главе с Армандо де продаж Оливейра официально выиграл и вступит в должность сегодня. \ n \ n the West в восторге от результатов, и мы получаем поздравления письма из Великобритании, Франции и Соединенных Штатов."
 brazil.50.a: "Люди были услышаны"
  
 brazil.51.t: "[FROM.GetName] хочет, чтобы мы помогли им в гражданской войне"
 brazil.51.d: "Дипломаты из [FROM.GetName] спросили нас, можем ли мы помочь им каким -либо образом в бразильской гражданской войне. \ n \ nshould мы им помогли?"
 brazil.51.a: "Да"
 brazil.51.b: "Нет"
  
 brazil.52.t: "[FROM.GetName] соглашается помочь!"
 brazil.52.d: "[FROM.GetName] согласился помочь нам, и скоро будет отправлять помощь любым способом."
 brazil.52.a: "Идеальный!"
  
 brazil.53.t: "[FROM.GetName] отказывается"
 brazil.53.d: "[FROM.GetName] отказался помочь нам, заявив, что они не подходят для этого в то время"
 brazil.53.a: "Несчастный"
  
 brazil.54.t: "[FROM.GetName] Отправляет оборудование!"
 brazil.54.d: "[FROM.GetName] послал нам пехотное оборудование как средство помощи нам в наших усилиях!"
 brazil.54.a: "Любая помощь очень ценится"
  
 brazil.55.t: "[FROM.GetName] Отправляет военные облигации!"
 brazil.55.d: "[FROM.GetName] послал нам военные облигации, чтобы помочь нашей экономике во время нашей борьбы на войне!"
 brazil.55.a: "Любая помощь очень ценится"
  
 brazil.56.t: "[FROM.GetName] отправляет добровольцев!"
 brazil.56.d: "[FROM.GetName] послал нам волонтерские силы, чтобы помочь нам в гражданской войне. Они заявили, что мы будем отвечать за их мужчин!"
 brazil.56.a: "Любая помощь очень ценится"
  
 brazil.57.t: "Война наконец завершилась!"
 brazil.57.d: "После многих, многих месяцев борьбы, крови, хаоса, смерти, нация, наконец, была объединена под одним знаменем. История навсегда запомнит эту гражданскую войну как одну из самых смертоносных, известных человеку, с миллионами солдат в общей сложности. Люди начали подбадривать на сломанных улицах, и многие солдаты плачут слезы радости, поскольку теперь они способны воссоединиться со своими семьями. \ n \ n n nwe есть долгий путь впереди нас, и много проблем, с которыми нужно решить, но мы сможем протянуть и стать Бразилией, о которой никто даже не мечтал!"
 brazil.57.a: "Пусть этот вновь обретенный мир будет вечным"
  
 brazil.58.t: "Молодой мальчик с большой мечтой"
 brazil.58.d: "Бэзил Дос Сантос, молодой подросток, живущий на сельскохозяйственных угодьях Рио -де -Жанейро со своим смотрителем. Он часто посещает свою группу друзей, которые живут в близкой деревне, и до начала гражданской войны его обычно видели, что ухаживает за кофейными плантациями вокруг своего дома. Однако все это изменилось, так как коммунисты начали работать под землей, чтобы свергнуть правительство, и некоторые из этих солдат приехали в базилик, чтобы попросить его помочь с сокрытием оружия на плантациях. Напуганный, Базилик обязался и начал скрывать их, однако солдаты были впечатлены его скоростью и эффективностью и быстро признали молодого подростка вундеркиндом. Слово уже распространилось о его помощи во всех коммунистах, и фермеров тоже."
 brazil.58.a: "У многих есть мечты, что делает это таким особенным?"
 brazil.58.b: "Интригующий, мы должны следить за ним"
  
 brazil.59.t: "Базилик получает поддержку фермеров!"
 brazil.59.d: "Молодой мальчик и его видение изначально видели как только это, детское видение. Тем не менее, это видение, похоже, завоевало популярность с определенной группой людей в нашем штате: фермерами. Фермеры по всей стране были очарованы его видением и, кажется, считают, что его юношеская неопытность очаровательна, а не препятствие. На данный момент кажется, что Бэзил получил статус знаменитости среди фермеров, но нет никаких сомнений в том, что его влияние будет дальше распространяться по нашей стране. Видя, что их дома рухнут, а их повседневная жизнь больше нет, многие фермеры начали подбадривать базилик, некоторые уже объявляют его Спасителем Бразилии и ее народом."
 brazil.59.a: "Почему они заботятся о жалком ребенке?"
 brazil.59.b: "Интересное развитие"
  
  #change parliament with whatever 
 brazil.60.t: "Люди требуют немедленной инаугурации Василия!"
 brazil.60.d: "Сегодняшнее спокойное утро было внезапно прервано звуком тысяч мужчин, женщин и детей, протестующих в коммунистическом штаб -квартире в [ROOT.GetCapitalVictoryPointName] с одним простым требованием: они хотят немедленной отставки [BRA.GetLeader] и инаугурации базилика. То, что когда -то было простым ребенком, который только хотел, чтобы его мечта стала реальностью, теперь стало политическим движением с монументальной силой в [BRA.GetName], и эта сила манила для нашего сотрудничества. Люди не перестанут повторять имя Базилика, и теперь, когда жертвы только растут, нам нужно принять решение и быстро!"
 brazil.60.a: "Они сумасшедшие? Решение ребенка нелепо!"
 brazil.60.b: "Люди говорили, и мы будем слушать соответственно ..."
  
 brazil.61.t: "[FROM.GetName] требует нашего подчинения!"
 brazil.61.d: "[FROM.GetName] требует нашего непосредственного подчинения! Они уже выстроили тысячи солдат на нашей границе и в ближайшее время ожидают отклик от нас. \ n \ nwhat мы должны сделать?"
 brazil.61.a: "У нас действительно есть выбор в этом вопросе?"
 brazil.61.b: "Независимость или смерть!"
  
 brazil.62.t: "[FROM.GetName] Кед в наших требованиях!"
 brazil.62.d: "[FROM.GetName] согласился стать нашим предметом, и начиная с сегодняшнего дня у нас будет административная власть над большей частью их страны."
 brazil.62.a: "Они сделали правильный выбор."
  
 brazil.63.t: "[BRA.GetName] вторгается [URG.GetName]!"
 brazil.63.d: "Репортеры сегодня стекались в Каса Росаду, обильно потея и кричали '[BRA.GetName] esta Invadiendo Уругвай!'. Эта информация - то, чего никто никогда не ожидал, и все же это происходит, когда мы говорим прямо сейчас. \ n \ n[BRA.GetName] сейчас делает что -то ужасное, и Уругвай не имеет шансов победить их. С нашим братом в опасности мы должны вмешаться и остановить военных торговцев?"
 brazil.63.a: "Вауш"
