 brazil.64.t: "[ARG.GetName] решил вмешаться в нашу мелиорацию [URG.GetName]"
 brazil.64.d: "Наши дипломаты уведомили нас, что [ARG.GetName] официально вмешается, и будут полностью поддержать уругвайцев в этом конфликте."
 brazil.64.a: "Они будут сожалеть, когда когда -нибудь присоединились к этой войне!"
  
 brazil.65.t: "Принести мир с [BRA.GetName]?"
 brazil.65.d: "Мы потеряли много людей в этой бессмысленной войне. Наши солдаты больше не могут его принимать, люди протестуют на улицах, требуя, чтобы мы выйдем из войны. \ n \ nwhat мы должны сделать?"
 brazil.65.a: "Нет больше кровопролития"
 brazil.65.b: "Мир не может быть приготовлен с монстрами"
  
  
 brazil.66.t: "Кто возглавит нас"
 brazil.66.d: "У нас есть несколько хороших вариантов, это будет очень сложный выбор. В нашем распоряжении много хороших лидеров, желающих дать все, чтобы возглавить страну и улучшить ее любым способом, возможно. \ n \ nas мы говорим, голоса были подсчитаны, и люди выбрали в качестве лидера ..."
 brazil.66.a: "[ROOT.GetLeader]"
 brazil.66.b: "Конгресс"
 brazil.66.c: "Армандо продажи"
 brazil.66.e: "Луис Вашингтон"
 brazil.66.f: "Хосе Америко"
 brazil.66.g: "Африо де Мело"
  
  
 brazil.67.t: "Бразильский призыв о помощи"
 brazil.67.d: "Бразильские интегралисты требуют помощи в своем предстоящем восстании, которые они ставят. Они утверждают, что им нужна наша помощь, чтобы улучшить свои шансы на свержение правительства. \ n \ nwe есть два варианта, приходите на их помощь или оставьте их"
 brazil.67.a: "Принять их запрос"
 brazil.67.b: "Отрицать их просьбу"
  
 brazil.68.t: "Попытка убийства в престах преуспела"
 brazil.68.d: "Коммунистическая партия сходит с ума, организуя массовые протесты по всей стране, требуя объяснения правительства об убийстве предварительных. \ n \ neveryone пытается найти объяснение этого, которое мы и надеялись. Теперь у коммунистов не будет возможности восстать без адекватного лидера, и в результате страна только дестабилизировала еще больше."
 brazil.68.a: "Именно так, как планировалось"
  
 brazil.69.t: "Престав предварительных убийств не удалась"
 brazil.69.d: "В газетной отрывок сегодняшняя отрывка гласит «Радуйство для Коммунистической партии, так как убийца неизвестного происхождения было отправлено, чтобы убить предварительных презрений, и их застрелили, прежде чем они смогли достичь предварительных. Последователи Коммунистической партии находятся в руках и очень злы. К счастью, наш убийца смог сохранить свою личность секрет, единственная проблема - мы не уверены, что он останется в секрете надолго."
 brazil.69.a: "Дерьмо! ДЕРЬМО! Это не хорошо!"
  
  
 brazil.70.t: "Коммунистический план восстать"
 brazil.70.d: "Агенты под прикрытием сообщили нам, что коммунисты получают оружие из кофейных плантаций и вооружают ополченцы. Судя по текущему положению страны, нет сомнений, что они планируют полномасштабное восстание, чтобы попытаться зарекомендовать себя как лидеры страны. \ n \ nwhatever, мы делаем, мы не можем допустить, чтобы это произошло, и мы должны сделать все, что в наших силах, чтобы попытаться победить их как можно быстрее."
 brazil.70.a: "Эти ублюдки не выживут месяц!"
  
  
 brazil.71.t: "Королевский вопрос"
 brazil.71.d: "Королевская семья была задана вопросом, если они нужны. Их роль в стране изменилась с момента роспуска Империи, и они могут даже поставить шип на нашу сторону, учитывая противоположные идеалы. \ n \ nshall мы депортируем их из этой страны, даем им повышенную роль в правительстве или пусть они будут?"
 brazil.71.a: "Депортировать их"
 brazil.71.b: "Дайте им роли в правительстве"
 brazil.71.c: "Пусть они останутся"
  
  
 brazil.72.t: "Patrianovistas предлагают поддержку в интегралистском восстании"
 brazil.72.d: "Patrianovistas предложили нам поддержку в нашем восстании. Они признают наши разные идеалы, однако они готовы отложить наши различия и помочь нам в наших усилиях против Варгаса. \ n \ nshall мы принимаем или отрицаем?"
 brazil.72.a: "Мы возьмем все, что помогает"
 brazil.72.b: "Мы в порядке сами по себе!"
  
  
 brazil.73.t: "[BZE.GetName] запрашивает нашу помощь!"
 brazil.73.d: "[BZE.GetName] запрашивают помощь в своей гражданской войне. Они планируют полномасштабное восстание, чтобы восстановить монархию в стране, и с нынешней политической ситуацией в стране они считают, что это прекрасная возможность сделать это. \ n \ nshuld мы одолжим им нашу помощь?"
 brazil.73.a: "Конечно, что -нибудь, чтобы помочь им"
 brazil.73.b: "Мы не можем сделать это сейчас"
  
  
 brazil.74.t: "[BZE.GetName] хочет, чтобы мы вмешались в гражданскую войну!"
 brazil.74.d: "Бразильские империалисты просят, чтобы мы полностью вмешивались в гражданскую войну и помогли им в их усилиях против других фракций. \ n \ nshuld мы вмешаемся и поможем им? Или мы должны оставить их по своему усмотрению?"
 brazil.74.a: "Время помочь нашим братьям!"
 brazil.74.b: "Извините, но нет"
  
  
 brazil.75.t: "Неудачное восстание уругвайя"
 brazil.75.d: "Монархисты в Уругвае не смогли добиться успеха в их восстании. \ n \ nshall мы вступаем во владение, или мы оставим их."
 brazil.75.a: "На войне"
 brazil.75.b: "Сейчас не время"
  
  
 brazil.76.t: "Шанс нанести удар"
 brazil.76.d: "У нас есть шанс нанести удар по [BRA.GetName]. Они оказались в войне с Аргентиной и Уругвая одновременно, и все их силы сосредоточены на своей границе, а наша граница совершенно пуста. \ n \ nshall мы рискуем или сейчас не время?"
 brazil.76.a: "Возьмите наши шансы"
 brazil.76.b: "Мы не можем позволить себе войну в данный момент"
  
  
 brazil.77.t: "Объединение с Бразилией"
 brazil.77.d: "Бразильцы предложили объединение наших территорий. Если мы воспользуемся этим шансом, мы можем стать неудержимой силой и стать истинной угрозой для тех, кого мы считаем врагами. \ n \ nshould"
 brazil.77.a: "Да, мы объединимся"
 brazil.77.b: "Нет, мы не будем объединяться"
  
  
 brazil.78.t: "Португалия отказывается объединить"
 brazil.78.d: "Португальцы отказались от нашей просьбы об объединении и не приняли никаких решений, чтобы изменить свои пути."
 brazil.78.a: "Черт все это."
  
  
 brazil.79.t: "Уругвайское восстание"
 brazil.79.d: "Уругвайское восстание началось, и наше имперское владение сейчас борется с правительством Уругвайя. \ n \ ntime, чтобы войти и справиться с ситуацией. После того, как мы почистим Уругвай, мы снова интегрируем их в империю."
 brazil.79.a: "Понял"
  
  
 brazil.80.t: "Страна была убеждена в плане Коэна"
 brazil.80.d: "Люди, Конгресс и Армия были убеждены в плане Коэна. Благодаря этому Конгресс предоставит нам еще большую власть из-за этого выдуманного переворота, чтобы вести железный кулак."
 brazil.80.a: "Идеальный"
  
  
 brazil.81.t: "Интегралисты пробуют последнее усилие"
 brazil.81.d: "Мы смогли подобрать Intel на планы на последнюю работу интегралистов, чтобы поместить Plínio к власти. Мы также смогли узнать, что они планируют полную атаку на дворец Гуанабара. \ n \ nwe должны быть осторожны с их следующим шагом. Это может испортить все наши планы, если дела пойдут на юг."
 brazil.81.a: "Эти чертовски ублюдки!"
  
  
 brazil.82.t: "[BRA.GetName] предлагает нам план"
 brazil.82.d: "[BRA.GetName] связался с нами, сказав нам, что у них есть план в рукаве. Они не только хотят присоединиться к нашей фракции и помочь нам в нашей войне против союзников, но и хотят создать новый фронт в Южной Америке, вторгся в Уругвай. Несмотря на то, что план звучит рискованно, он, безусловно, отвлекает внимание союзников от Европы в Южную Америку, теперь, когда их имущество будет подвергаться риску. Должны ли мы согласиться с их планом?"
 brazil.82.a: "Мы впустим их, когда они начнут атаку"
 brazil.82.b: "Мы не можем позволить себе еще один фронт"
  
  
 brazil.83.t: "[BRA.GetName] хотел бы купить наши колонии в Африке"
 brazil.83.d: "Бразильские дипломаты прибыли сегодня в нашу страну, чтобы предложить нам предложение. Они будут готовы заплатить большую сумму денег за наши земли в Африке. Они также обещают поддерживать положительные отношения с нами и защищать нас в случае иностранного вторжения. \ n \ nshould мы примем их предложение?"
 brazil.83.a: "Конечно, они могут иметь это"
 brazil.83.b: "Абсолютно нет"
  
  
 brazil.84.t: "[FROM.GetName] хотел бы купить наши южноамериканские владения"
 brazil.84.d: "Дипломаты из [FROM.GetName] пришли в [ROOT.GetName], чтобы попросить наши южноамериканские владения к северу от их территории. Они готовы заплатить большую сумму денег за указанное владение. \ n \ nshould мы примем?"
 brazil.84.a: "Конечно, они могут иметь их"
 brazil.84.b: "Абсолютно нет"
  
  
 brazil.85.t: "[BRA.GetName] требует демократического референдума в нашей стране"
 brazil.85.d: "Бразильские дипломаты пришли в [ROOT.GetName], требуя, чтобы мы провели демократический референдум и позволили людям выбирать. Они предупредили нас, что будут страшные последствия, если мы не сделаем референдум. \ n \ nshuld мы выйдем или выдерживаем свою позицию?"
 brazil.85.a: "Мы выйдем"
 brazil.85.b: "Они не сойдут с рук с этим!"
  
  
 brazil.86.t: "Должны ли мы объединиться с Объединенными республиками Латинской Америки?"
 brazil.86.d: "Нам сообщили, что были сформированы Объединенные республики Латинской Америки, и мы спрашиваем нас, хотим ли мы присоединиться к их союзу. Они уже заверили нас, что мы будем должным образом представлены в Союзе. \ n \ nso, мы должны объединиться и стать сверхдержавой вместе?"
 brazil.86.a: "Давай сделаем это"
 brazil.86.b: "Никогда!"
  
  
 brazil.87.t: "Португалия пытается воскресить монархию!"
 brazil.87.d: "Захваченные португальские шпионы признались, что правительство Португальского планирует подстрекаться к полномасштабному имперскому восстанию в стране. Мы должны быть очень осторожны с их следующим шагом, так как это может значительно повлиять на ход войны."
 brazil.87.a: "Эти чертовы ублюдки!"
  
  
 brazil.88.t: "Португалия поможет нам в наших имперских усилиях"
 brazil.88.d: "Португальские шпионы в тайне прибыли в нашу штаб -квартиру, чтобы сообщить нам, что у нас есть полная поддержка со стороны португальской монархии и их сил. Если нам нужна помощь, мы должны просто спросить, и они ответят."
 brazil.88.a: "Замечательно!"
  
  
 brazil.89.t: "Должны ли мы начать атаку на дворец Гуанабара?"
 brazil.89.d: "Наши лояльные члены сообщили нам, что все произведения на месте для нашей атаки на дворец Гуанабара. Как только мы это сделаем, гражданская война официально начнется, поскольку наши силы будут организовать и захватить различные штаты на юге Бразилии. \ n \ nshall мы запускаем атаку сейчас или немного ждем?"
 brazil.89.a: "Давай сделаем это!"
 brazil.89.b: "Мы еще не готовы"
  
  
 brazil.90.t: "Различные вражеские генералы пришли на нашу сторону"
 brazil.90.d: "После их поражения в гражданской войне и сброса их оружия, некоторые из их генералов пришли к нам, чтобы предложить свою поддержку на нашей стороне конфликта и привести Бразилию в большую эпоху."
 brazil.90.a: "Большой!"
  
  
 brazil.91.t: "Сбежавший агент от демократов был захвачен"
 brazil.91.d: "Мы захватили сбежавшего агента у демократов, который планирует выполнить потенциальное восстание. Используя эту возможность, мы могли бы получить много информации о местонахождении их штаб -квартиры."
 brazil.91.a: "Нам нужно получить как можно больше информации"
 brazil.91.b: "Задайте ему несколько вопросов"
 brazil.91.c: "Не доверяйте этому потенциальному шпиону"
  
  
 brazil.92.t: "Мы не смогли найти штаб -квартиру"
 brazil.92.d: "Несмотря на наши доблестные усилия, мы не были способны обнаружить местоположение штаб -квартиры Демократической партии."
 brazil.92.a: "Черт возьми, к черту!"
  
  
 brazil.93.t: "Демократическое сопротивление согласилось на компромисс"
 brazil.93.d: "Демократическое сопротивление согласилось на наш компромисс, и мы будем прислушиваться к их требованиям в обмен на их пацифизм в гражданской войне и даже потенциальное сотрудничество."
 brazil.93.a: "Большой!"
  
 brazil.94.t: "Демократическое сопротивление не согласилось на компромисс"
 brazil.94.d: "Сопротивление отказалось идти на компромисс и продолжит свои первоначальные планы."
 brazil.94.a: "Вы пожалеете об этом решении!"
  
 brazil.95.t: "Estado novo был создан"
 brazil.95.d: "После многих месяцев обмана, коррупции и интриги Варгас сделал все надлежащие препараты, чтобы утвердиться в качестве диктатора Бразилии. \ n \ nwith это текущее затруднение, это будет означать, что нам нужно запустить все планы, которые у нас есть, пока не стало слишком поздно!"
 brazil.95.a: "Запустите планы"
 brazil.95.b: "Похоже, нам нужно отступить"
  
  
  
 news.361.t: "Интегралистское восстание в Бразилии"
 news.361.d: "Мир мог бы стоять только в страхе, поскольку бразильские политические и социальные сферы рухнули с интегральным восстанием в стране. Интегралисты получили огромную поддержку своего движения, используя проступки нынешних и бывших лидеров, чтобы подпитывать свою партию и расти в поддержку. \ n \ nas, мы говорим, многие сражения уже извергаются по всей стране, и большинство считают, что Бразилия достигнет состояния чистой внутренней войны. Эксперты уже предсказывают, что это одна из самых смертоносных гражданских войн, известных человеку, и это только началось."
 news.361.a: "Мы победим!"
 news.361.b: "Они не сойдут с рук с этим!"
 news.361.c: "Иисус Христос"
  
  
 news.362.t: "Восстание с Паулиста в Бразилии"
 news.362.d: "Как будто ситуация в Бразилии не может ухудшиться, Intel уже подтвердила, что восстание Паулиста полностью взорвалось в стране. Паулистас рассматривал слабое состояние Бразилии как возможность официально получить от них независимость. Похоже, что они смогли собрать довольно большую армию, чтобы бороться с другими бразильскими фракциями, и готовы сражаться до самого конца за их независимость. \ n \ нельзя сказать, как будет развиваться гражданская война Бразилии, но пока она не выглядит красиво."
 news.362.a: "Мы получим нашу независимость!"
 news.362.b: "Они не получат дерьмо!"
 news.362.c: "Ухудшается только хуже"
  
  
 news.363.t: "Коммунистическое восстание в Бразилии"
 news.363.d: "Мир не может ничего делать, кроме как наблюдать, как Бразилия спускается в чистый хаос. Коммунистическая партия в стране оснащена полномасштабным восстанием, чтобы свергнуть правительство и зарекомендовать себя как истинные лидеры Бразилии. \ n \ nfrom, что кажется, великое большинство их поддержки исходит от фермеров страны и нижнего класса. Они также смогли сформировать большое количество ополченцев, чтобы стать победителями гражданской войны. \ n \ nbattles уже вспыхнули, и тела накапливаются, когда мы говорим."
 news.363.a: "Мы победим!"
 news.363.b: "Они не сойдут с рук с этим!"
 news.363.c: "Иисус Христос"
  
  
 news.364.t: "Демократическое восстание в Бразилии"
 news.364.d: "Гражданская война в Бразилии продолжает расти, поскольку люди решают, что у них было достаточно, и начали восстание, чтобы восстановить демократию в стране. Они делают это под названием Соединенных Штатов Бразилии, очень недолгого имени Бразилии в 1870 -х годах. Они решили возродить эту недолгую республику, чтобы противопоставить все другие экстремистские идеологии в гражданской войне, и раз и навсегда положили конец гражданской войне. \ n \ nwhoWever победит в этой гражданской войне, все еще готовы к обсуждению, но то, что наверняка, у них будет долгий путь, прежде чем они смогут по -настоящему починить нацию."
 news.364.a: "Еще одна фракция?!"
 news.364.b: "Они скоро будут раздавлены"
 news.364.c: "Демократия вернется!"
  
  
 news.365.t: "Императорское восстание в бразильской гражданской войне"
 news.365.d: "На сегодняшний день было подтверждено, что империалистическая фракция, при поддержке Patrianovistas, начала масштабное нападение на другие фракции в гражданской войне, а их главная цель-восстановить имперский престол и поместить королевскую семью в их «правильное место». \ n \ nnot много известно с этим восстанием, а некоторые подозревают, что Португалия, возможно, имела некоторую форму участия в оказании помощи империалистам. \ n \ n Гражданская война, кажется, не заканчивается в ближайшее время."
 news.365.a: "Это просто не останавливается"
 news.365.b: "Отлично, именно то, что нам нужно ..."
 news.365.c: "Слава королевской семье!"
 news.365.e: "Теперь это интересно"
  
  
 news.366.t: "Португалия вмешивается в гражданскую войну в Бразилии"
 news.366.d: "Мир был брошен в неконтролируемое соответствие, поскольку источники новостей подтвердили, что Португалия официально вступила в гражданскую войну Бразилии, помогая империалистам в их гражданской войне. Соединенные Штаты не знают, как реагировать, так как это технически прямое нарушение доктрины Монро, однако, США пока не похоже, что в форме войны. В рамках ситуации только эрасту, так как теперь европейская власть вмешивается в гражданскую войну в Бразилии. Весь мир может надеяться, что гражданская война не станет международной."
 news.366.a: "ПОРТУГАЛИЯ????"
 news.366.b: "КАКОГО ЧЕРТА?!?!"
 news.366.c: "Давайте сделаем это"
  
  
 news.367.t: "Парагвай вмешивается во вторую цисплатиновую войну"
 news.367.d: "Как будто ситуация в Южной Америке не может ухудшиться, было подтверждено, что Парагвай официально участвует во второй цисплатиновой войне после пересечения бразильской границы со своей армией. \ n \ nall Теперь мы можем надеяться, что ситуация не обостряется даже дальше, чем она уже есть."
 news.367.a: "Вещи только ухудшаются"
 news.367.b: "Эти ублюдки будут раздавлены!"
 news.367.c: "Бразилия скоро упадет!"
  
  
 brazil.23.b: "Великолепный"
  
 ### PAR ### 
 paraguay.1.t: "Люди, возмущенные недавней политикой Laissez-Fair"
 paraguay.1.d: "Люди начали демонстрировать свой гнев по отношению к правительству и его недавней экономической политике, принимая улицы и протестуя против них. Они считают, что эта политика повредит экономике еще дальше. Люди считают, что это из -за предыдущих либеральных правительств, избивающих экономику. \ N \ n \ nwe нужно иметь дело с этими протестами и не позволять им ухудшаться! Что мы будем делать?"
 paraguay.1.a: "Успокоить людей"
 paraguay.1.b: "Отправить военных, чтобы разобраться с их истерикой"
 paraguay.2.t: "[PAR.GetLeader] был свергнут военными!"
 paraguay.2.d: "Парагвайские военные взяли под контроль правительство и свергнули [PAR.GetLeader]! \ N \ nthis ситуация выглядит довольно мрачной."
 paraguay.2.a: "Пусть Бог поможет нам."
 paraguay.3.t: "Рафаэль Франко принимает власть"
 paraguay.3.d: "После спекуляций и заговоров военные фактически сделали это; Они свергли либеральное правительство и поместили Рафаэля Франко в власть. \ n \ nvarious социалистические сектора, такие как Колорадо, анархисты и члены из Лиги Национальной Независимой, поддерживали военных и рост Франко к власти."
 paraguay.3.a: "Будем надеяться, что Франко может должным образом возглавить нацию."
 paraguay.4.t: "Национальные выборы"
 paraguay.4.d: "Сегодня особенный день для нашей маленькой страны, для того, чтобы были рассмотрены отвратительные коммунисты в армии, и демократия была полностью сохранена! \ n \ nbeyond США лжет тревожный вопрос: кто будет продолжать возглавить эту страну? Esuebio сделал очень хорошо, но новый новый ум может принести пользу нашей стране. \ n \ n Новый лидер [ROOT.GetName] ..."
 paraguay.4.a: "Eusebio Ayala"
 paraguay.4.b: "Луис Альберто Риарт"
 paraguay.4.c: "Феликс Пайва"
 paraguay.4.e: "Жозе Патрисио Гуджиари"
 paraguay.5.t: "[FROM.GetName] хотел бы купить [1048.GetName]"
 paraguay.5.d: "Делегаты из [FROM.GetName] пришли в [ROOT.Capital.GetCapitalVictoryPointName], чтобы обсудить потенциальную покупку [1048.GetName]. \ n \ nthey готовы заплатить за это. Примем ли мы их предложение?"
 paraguay.5.a: "Да, конечно, мы не можем для этого."
 paraguay.5.b: "Мы не допустим этого!"
 paraguay.6.t: "Недовольное правое крыло"
 paraguay.6.d: "Вскоре после того, как предполагая власть, многие правые симпатики в стране продемонстрировали разочарование в новом лидере, считая его непригодным для управления страной. Их беспокойство в основном связано с администрацией Франко недавно приобретенного Чако, так как он проявил интерес к отмене парагвайских войск оттуда; что -то, что правое крыло ненавидит! \ n \ nwe нужно будет следить за ними, если мы хотим держать Франко у власти."
 paraguay.6.b: "Давай следим за ними"
 paraguay.7.t: "Либеральные остатки в армии"
 paraguay.7.d: "Хотя наше правительство было успешным, это не означает, что либеральная оппозиция волшебным образом исчезала. Они все еще очень присутствуют, и это показывает. Они публично объявили о своем презрении к нынешнему правительству, но в соответствии с тем, что действия, которые они могут выполнить, ограничены. \ n \ nwe должны следить за ними на случай, если что -то случится."
 paraguay.7.a: "Хорошая идея"
 paraguay.8.t: "[FROM.GetName] любезно просит [994.GetName]"
 paraguay.8.d: "Дипломаты из [FROM.GetName] прибыли в нашу страну, чтобы попросить нас [994.GetName]. Они гарантируют, что они просто просят эту землю, и говорят, что они гарантируют, что между нашими двумя странами больше не будет военных действий, если мы их дадут. \ n \ nwhat будет наш выбор?"
 paraguay.8.a: "Конечно, дай им это"
 paraguay.8.b: "Estan Locos Estos? Que Se Piensan !!"
 paraguay.9.t: "Военные поместили Феликс Пайва в власть"
 paraguay.9.d: "Через несколько часов после военного восстания высокопоставленные офицеры в нем решили, что Феликс Пайва должен взять командование в стране, что, в свою очередь, вернет Либеральную партию у власти."
 paraguay.9.a: "Хорошо"
 paraguay.10.t: "Хосе Феликс Эстигаррибия был избран"
 paraguay.10.d: "После подсчета голосов на выборах [GetYear] Хосе Феликс Эстигаррибия был избран президентом Республики и скоро вступит в должность. \ n \ nwhat это будет означать для Парагвая, и его народ все еще не подходит для дебатов, но мы можем быть уверены, что мы должны обеспечить безопасность страны и нашего народа."
 paraguay.10.a: "Большой"
 paraguay.11.t: "Жозе Феликс Эстигаррибия скончался"
 paraguay.11.d: "Tragic News сегодня поразили страну, так как Хосе Феликс Эстигаррибия скончался вместе со своей женой в самолете во время поездки из Лос -Альтоса в свою страну в Сан -Бернардино. \ n \ nmany пошел на улицы, чтобы оплакивать свою смерть, что только естественно, учитывая внезапность его кончины."
 paraguay.11.a: "Пусть он упокоится с миром"
 paraguay.12.t: "Конституция 1870 года была отменена"
 paraguay.12.d: "[PAR.GetLeader] решил отменить Конституцию 1870 года, заявив, что она стоит за время и требует современной замены."
 paraguay.12.a: "Так что это будет"
 paraguay.13.t: "Гражданские лица берет оружие"
 paraguay.13.d: "После растущей напряженности в стране, гражданским лицам было достаточно сумасшедшего сумасшедшего, который составляет [ROOT.Getleader], и взяли оружие, чтобы бороться с нынешним правительством!"
 paraguay.14.t: "[FROM.GetName] требует, чтобы мы дали им законные земли"
 paraguay.14.d: "Парагвайские дипломаты, сопровождаемые различными высокопоставленными солдатами и генералами, топали в нашем столице, чтобы потребовать, чтобы мы уступили им то, во что они верят в их «законные земли». \ n \ nshall мы соблюдаем это?"
 paraguay.14.a: "Хорошо, мы принимаем"
 paraguay.14.b: "Не шанс, отступите!"
 paraguay.15.t: "Должны ли мы сформировать коалицию против Parauay?"
 paraguay.15.d: "Поскольку Парагвай продолжает расширять и угрожать балансу сил среди стран Южной Америки, мы должны спросить себя: является ли Парагвай угрозой для нашего благополучия? \ n \ nfrom Внешний вид вещей, наверняка есть. Имея это в виду, будем ли мы сформировать договор и пригласить тех, кто борется с Парагваем?"
 paraguay.15.a: "Нам нужно защищать себя"
 paraguay.15.b: "Мы можем сделать это сами, спасибо"
 paraguay.150.t: "[FROM.GetName] требует, чтобы мы подчинились им"
 paraguay.150.d: "Нам отправили письмо [FROM.GetName], требуя, чтобы мы сдались и подчинились им. Они заметили наши усилия по убыванию военных действий и решили воспользоваться этим. \ n \ nwhat мы должны сделать?"
 paraguay.150.a: "Принять их требования"
 paraguay.150.b: "Мы будем бороться до конец!"
 paraguay.16.t: "[FROM.GetName] отказался от наших требований"
 paraguay.16.d: "Новости вернулись к нам, что [FROM.GetName] отказался стать нашим предметом и продолжит сражаться, несмотря на их потери."
 paraguay.16.a: "Ну что ж, у них была возможность жить"
 paraguay.17.t: "Призыв к местной революции"
 paraguay.17.d: "После того, как коренное население в стране получило больше прав и свобод, по всей стране начались движения независимости. Помимо этого подстрекательства, вызванного Хуаном Белаеффом, и туземцы группируют по всей стране, призывая к полномасштабной революции. \ n \ nwhat выбор мы сделаем? Должны ли мы встать на сторону ими и отомстить европейцам, или мы должны бороться с ними и убедиться, что этого не повторится снова?"
 paraguay.17.a: "Мы принесем нашу месть!"
 paraguay.17.b: "Мы будем бороться с этими проклятыми ублюдками"
 paraguay.18.t: "Наша революция началась"
 paraguay.18.d: "Пока мы говорим, тысячи людей берут оружие, чтобы бороться за наше дело. Вскоре мы унесем это несчастное правительство и дадим понять, кто является истинным владельцем этих земель!"
 paraguay.18.a: "Мы выиграем, несмотря ни на что!"
 paraguay.19.t: "Praguay усиливает сопротивление нативного!"
 paraguay.19.d: "Хотя сначала это казалось сумасшедшим, сообщили, что наблюдения парагвайцев, помогающих местным населению в нашей стране, были подтверждены. Преступники были заключены в тюрьму и будут платить за свои действия, но теперь остается вопрос: что мы делаем с Парагваем?"
 paraguay.19.a: "Мы заставим их заплатить!"
 paraguay.19.b: "Мы ничего не можем с этим поделать"
 paraguay.20.t: "[FROM.GetName] узнал о наших схемах"
 paraguay.20.d: "Люди, которых мы отправили в [FROM.GetName], были обнаружены и окружены. Они также почти наверняка обнаружили наши планы!"
 paraguay.21.t: "Успешный поиск и подавление либеральных остатков"
 paraguay.21.d: "Наши поиски в стране были успешными, и мы смогли найти и нацелиться на главную штаб -квартиру тех, кто в армии, которые все еще оставались верными Либеральной партии."
 paraguay.21.a: "Отличный!"
 paraguay.22.t: "Успешный поиск и разрабатывание правых революционеров"
 paraguay.22.d: "Наши поиски в стране были успешными, и мы смогли найти и нацелить главную штаб-квартиру тех, кто в армии, которые были сочувствующими экстремальным правым идеологиям."
 paraguay.23.t: "Неудачный поиск"
 paraguay.23.d: "Несмотря на наши усилия, мы не смогли найти какую -либо из основных штаб -квартиров против нас."
 paraguay.23.a: "Проклятие"
  
 news.369.t: "Парагвайская война мести"
 news.369.d: "Новости подтвердили, что в Южной Америке вспыхнул новый крупный конфликт, поскольку создается антипарагуайская фракция, которая содержит быстро мобилизующую Парагвай от дальнейшего расширения. \ n \ Nestimates of потенциальных жертв уже достигают сотен тысяч, и многие считают, что Южная Америка может быть обречена, если Парагвай в конечном итоге выиграет эту войну. Несмотря на это, мы все равно будем надеяться на континент и надеемся, что все получится хорошо."
 news.369.a: "Они все заплатят!"
 news.369.b: "Мы раз и навсегда рассмотрим Парагвай!"
 news.369.c: "Иисус..."
  
 chile.50.t: "Железнодорожные удары [GetYear]"
 chile.50.d: "После того, как железнодорожная забастовка января 1935 года из -за девальвации валюты и сокращения заработной платы, движения, которое получило эффективную поддержку со стороны Коммунистической партии, это второй удар все более активного национального трудового сектора. Хотя это второе правительство Алессандри сделало все возможное, чтобы сохранить фискальный баланс, эта мобилизация от северного к югу приводило к дектуальному составу. Тем не менее, неоспоримо, что синдикалистское единство работников усиливается."
 chile.50.a: "Это должно быть вмешательство от коммунистического интернационала!"
  
  ### VENEZUELA ### 
 venezuela.1.t: "Нефть, обнаруженное в миоценету"
 venezuela.1.d: "После надежного исследования и бурения открытия скважины всего в 37 километрах к северо-северо-западу от Сьюдад Боливар, было обнаружено нефть! Нефть была найдена в миоценовых зубчатых песках [947.GetName], и уже были составлены планы, чтобы начать бурение нефти, найденного здесь, и в полной мере воспользоваться возможностями. \ n \ nwith усердие, мы ожидаем произвести значительно больше сырой нефти, что может резко помочь нам в экономическом плане."
 venezuela.1.a: "Фантастика!"
 venezuela.2.t: "Февральская резня"
 venezuela.2.d: "После того, как губернатор [VEN.GetCapital.GetName], Félix Galavís, постановил, что новые законы о цензуре по различным средствам общения, многие венесуэльцы в столице решили достаточно, и это достаточно и заняло улицы для протеста против этих действий. По мере роста протестов, достигнув более 20000 года, Галавис принял грубое решение и приказал своим людям стрелять в протестующих, убив 6 и травмируя 150. Нам нужно слегка идти, так как один неправильный шаг может означать общенациональную революцию."
 venezuela.2.a: "Это не может быть хорошо!"
 venezuela.3.t: "Протесты против правительства"
 venezuela.3.d: "Мы получили новости о проявлениях, формирующихся в стране, чтобы продемонстрировать их отвращение к нынешнему правительству. Неспособность правильно обработать протесты может привести к интенсификации протеста."
 venezuela.4.t: "Общенациональные удары"
 venezuela.4.d: "Рабочие по всей стране отказались идти на работу, утверждая, что условия труда являются невыполненными, а оплата ужасна. Нападения дали понять, что они не будут идти на работу, если эти условия труда не будут улучшены, или стабилизация страны обеспечит более крупную салри."
 venezuela.5.t: "Должны ли мы вмешаться в [FROM.GetName]?"
 venezuela.5.d: "Наше внимание пришло к тому, что Венесуэла не была должным образом объединена с нашими намерениями, что может привести к катастрофическим побочным эффектам в случае того, как враг захватил их нефтяные месторождения."
 venezuela.5.a: "Вмешиваться как можно скорее!"
 venezuela.5.b: "Выпустить строгое предупреждение"
 venezuela.5.c: "Отпусти их"
 venezuela.5.e: "Дать им 2 года покаяния"
 VEN_allied_speech_tt: "\ n \ n[VEN.GetName] отказывается разрешать связи с полномочиями оси, и это может привести к безопасному маршруту торговли топливом между двумя сторонами, что мы должны предотвратить при любой цене."
 VEN_axis_speech_tt: "\ n \ nvenezuela по уходу со смежными державами - это потенциальная задержка, ставя уплотнение на то, что может быть безопасным маршрутом торговли нефтью и топливом."
 venezuela.6.t: "[FROM.GetName] выпустил нам строгое предупреждение"
 venezuela.6.d: "Мы получили сообщение от [FROM.GetName], в котором они подтвердили, что мы предпринимаем потенциально опасные действия и что мы «идем по узкому пути». Неспособность прекратить наше нынешнее идеологическое согласование может привести к вмешательству от них."
 venezuela.6.a: "Мы не боимся тебя!"
 venezuela.7.t: "Венесуэла удалила наше влияние в своей стране"
 venezuela.7.d: "Мы получили новости о том, что Венесуэла удалила наше влияние со своей страны. \ n \ nwhat мы должны сделать?"
 venezuela.8.t: "[FROM.GetName] начал влиять на нашу политику"
 venezuela.8.d: "[FROM.GetName] инициировал различные подрывные действия, чтобы начать влияние на нашу политику. Мы должны устать от их намерений и следить за ними на всякий случай."
 venezuela.8.a: "Ну это просто здорово ..."
 venezuela.9.t: "[VEN.GetName] национализировал свою нефть"
 venezuela.9.d: "В ответ на растущую напряженность в мире и политическое перетягивание войны, которое осуществлялось на [VEN.GetName] из -за их нефти, [VEN.GetAdjective] принял импровизированное решение полностью национализировать свою нефть и не допустить продажи какой -либо своей нефти никому."
 venezuela.9.a: "Вмешиваться в военную жизнь"
 venezuela.10.t: "[FROM.GetName] требует права на ресурсы на [VEN_RESOURCE_TARGET_STATE.GetName]"
 venezuela.10.d: "[FROM.GetName] связался с нами, заявив, что они требуют прав на ресурсы, присутствующие в [VEN_RESOURCE_TARGET_STATE.GetName], в частности, сырую нефть, которая присутствует там. \ n \ nwhat, мы возьмем?"
 venezuela.10.a: "Дайте им права на ресурсы"
 venezuela.10.b: "Они не получают доступ к этим правам"
 venezuela.11.t: "Будем ли мы требовать права на ресурсы, присутствующие в поясе Orinoco?"
 venezuela.11.d: "Пояс Orinoco - это регион в Венесуэле, которая, как известно, чрезвычайно богата сырой нефти. На самом деле, это регион в стране с наибольшим количеством нефти, и, возможно, регион с наиболее нетронутой нефтью на всей планете. \ n \ nwith, наше влияние, полностью установленное в стране, мы можем выполнить такой спрос. Должны ли мы это сделать?"
 venezuela.11.a: "Абсолютно"
 venezuela.12.t: "[FROM.GetName] готов обсудить продажу своих ресурсов нам"
 venezuela.12.d: "Дипломаты из [FROM.GetName] пришли в нашу страну, чтобы обсудить продажу прав на свои ресурсы в их провинции. Мы получаем ресурсы от штата, который они выбирают, и в обмен они могут требовать оплаты каждые 6 месяцев. Должны ли мы принять это предложение?"
 venezuela.12.a: "Конечно, посмотрим, что они предлагают"
 venezuela.12.b: "Мы не можем себе это позволить прямо сейчас"
 venezuela.13.t: "[FROM.GetName] принял наше предложение"
 venezuela.13.d: "Мы получили Intel, что [FROM.GetName] согласился купить ресурсы в одном из наших штатов. Теперь мы должны выбрать, в какое состояние мы предложим доступ."
 venezuela.13.a: "Большой!"
 venezuela.14.t: "[FROM.GetName] не хочет покупать доступ к нашим ресурсам"
 venezuela.14.d: "[FROM.GetName] смог вернуться к нам, оценив предложение, но их нынешняя экономическая и политическая ситуация делает их невозможным позволить себе покупку прав на наши ресурсы."
 venezuela.14.a: "Удачи в следующий раз"
 venezuela.15.t: "[FROM.GetName] дал нам права на ресурсы на [VEN_RESOURCE_SELLING_TARGET_STATE.GetName]"
 venezuela.15.d: "[FROM.GetName] сообщил нам, что у нас будет полный доступ к ресурсам, расположенным в [VEN_RESOURCE_SELLING_TARGET_STATE.GetName]. Они могут требовать оплаты время от времени, но обещают, что они сохранят свой конец сделки."
 venezuela.15.a: "Хорошо"
 venezuela.16.t: "[FROM.GetName] выгнал нас из их фракции"
 venezuela.16.d: "Нас выгнали из фракции [FROM.GetName] из -за наших действий."
 venezuela.17.t: "[FROM.GetName] требует оплаты за использование их ресурсов"
 venezuela.17.d: "Было неизбежно, что [FROM.GetName] потребует оплаты за использование их ресурсов. Мы должны придерживаться нашего конца сделки и заплатить."
 venezuela.18.t: "Конец революции"
 venezuela.18.d: "Впервые за годы мы действительно имеем право голоса в венесуэльской политике и в стране в целом. Наше движение набрало серьезную тяжбу, и люди просыпаются, и, чтобы по -настоящему продолжить воздействие нашей революции, нам нужен надлежащий подборщик, чтобы взять на себя ответственность за движение и убедиться, что работники [VEN.GetAdjective] представлены должным образом. \ n \ nwho возьмет заряд?"
 venezuela.19.t: "Рафаэль Симон Урбина уходит из -за проблем со здоровьем"
 venezuela.19.d: "После всего лишь месяца, когда его призвали [ROOT.GetLeader], чтобы стать губернатором, Рафаэль представил свою отставку из -за личных проблем со здоровьем."
 venezuela.19.a: "Какой позор"
 venezuela.20.t: "[FROM.GetName] перестал покупать наши ресурсы"
 venezuela.20.d: "[FROM.GetName] сообщил, что они официально прекратят покупать доступ к нашим ресурсам. Начиная с сегодняшнего дня, мы не будем давать [FROM.GetName] ресурсов."
 venezuela.20.a: "Ах"
 venezuela.21.t: "[FROM.GetName] требует Гайаны Эсекиба"
 venezuela.21.d: "[FROM.GetName] пришел постучать в наши двери, требуя, чтобы мы передали им Гайану Эсекибу. Они утверждают, что это неотъемлемая часть нации [FROM.GetAdjective], и что они являются законными владельцами этой земли. \ n \ nthey уже позаботились о том, чтобы, если мы отрицаем им землю, они отреагируют силой. Каким будет наш ответ?"
 venezuela.21.a: "Передать им это"
 venezuela.21.b: "Как ты думаешь, кто ты, черт возьми? НЕТ"
 venezuela.22.t: "Гражданская война наконец завершается"
 venezuela.22.d: "После многих жестоких сражений, кровавых полей и уничтоженных жизней луч солнца, наконец, приземляется на нашей прекрасной стране. В конце туннеля действительно был свет, даже если он казался таким далеким. Это красиво."
 venezuela.22.a: "Новая эра венесуэльской истории начинается сейчас!"
 venezuela.23.t: "Рабочие требуют национализации наших нефтяных месторождений"
 venezuela.23.d: "Мы не можем забыть, что мы смогли подняться на власть из -за запланированного нефтяного удара по предыдущему правительству. Рабочие, которые очень помогли нам в нашей революции, теперь ожидают их награды, которую мы достигнем!"
 venezuela.24.t: "[FROM.GetName] хочет купить Панамский канал"
 venezuela.24.d: "[FROM.GetName] прибыл в [ROOT.Capital.GetName] с интересным предложением. Они готовы купить у нас Панамский канал и готовы заплатить за это довольно огромную сумму. \ n \ nshall мы принимаем?"
 venezuela.24.a: "Конечно, давайте дадим им им"
 venezuela.24.b: "Конечно, но мы требуем дополнительной компенсации"
 venezuela.24.c: "Извините, но мы не можем этого сделать"
 venezuela.25.t: "[FROM.GetName] согласился, но мы должны выплатить дополнительную компенсацию"
 venezuela.25.d: "Хотя [FROM.GetName] согласился продать нам Панамский канал, они дали понять, что нам нужно выплатить им дополнительную компенсацию из -за стоимости, которую удерживает канал."
 venezuela.26.t: "[FROM.GetName] хотел бы подписать с нами договор о переднем крае"
 venezuela.26.d: "Делегаты из [FROM.GetName] прибыли в нашу страну, чтобы обсудить подписание договора, чтобы наконец установить наши границы и исправить наши отношения после многих лет споров и напряженности. \ n \ nshall мы подписываем это?"
 venezuela.26.a: "Конечно"
 venezuela.26.b: "Нет"
 venezuela.27.t: "[FROM.GetName] отказался подписать передний договор"
 venezuela.27.d: "[FROM.GetName] ответил на наших делегатов, которые были отправлены туда, заявив, что они не будут подписывать договор и утверждать, что их видение границы является единственным правильным."
 venezuela.27.a: "Черт возьми, неудача"
 venezuela.27.b: "Они не сойдут с рук с этим!"
 venezuela.28.t: "Погружение монаг и Тиа Хуана"
 venezuela.28.d: "Мы получили новость о том, что нефтяные корабли Монаг и Тиа Хуана были затоплены [GER.GetAdjective] торпедом. Жизнь Венесуэля была потеряна в тех погружениях, а действия, предпринятые [GER.GetAdjective], непростительны. \ n \ nhow мы должны ответить на эту ситуацию?"
 venezuela.28.a: "Требуйте немедленной компенсации!"
 venezuela.28.b: "Эмбарго их"
 venezuela.28.c: "Мы ничего не можем с этим поделать ..."
 venezuela.280.t: "[FROM.GetName] требует компенсации за затонувшие нефтяные суда"
 venezuela.280.d: "[FROM.GetName] официально обратился к нам, что мы затонули два их нефтяных корабля. Из -за гибели жизни их правительство требует, чтобы мы дали им немедленную компенсацию за наши действия и гарантировали, что мы больше не делаем что -то подобное. \ n \ nwhat мы должны сделать?"
 venezuela.280.a: "Просто игнорируйте их"
 venezuela.280.b: "Кто, черт возьми, они думают, что они есть ????"
 venezuela.280.c: "Извините, мы оплатим наши ошибки"
 venezuela.29.t: "SEMM, такие как [FROM.GetName], проигнорировали нас"
 venezuela.29.d: "После требования компенсации от [FROM.GetName] мы еще не получили никакого вида ответа от их правительства. Можно с уверенностью предположить, что они просто проигнорировали нас ..."
 venezuela.29.a: "Должен был ожидать от них столько же"
 venezuela.30.t: "[FROM.GetName] согласился компенсировать"
 venezuela.30.d: "Несмотря на то, что многие ожидали, правительство [FROM.GetAdjective] фактически отреагировало на наши требования и согласилось с тем, что они компенсируют свои ошибки. Они также прислали нам официальные извинения, сказав, что сожалеют о потере венесуэльской жизни, и сделают все возможное, чтобы компенсировать ее."
 venezuela.30.a: "Замечательно!"
 venezuela.31.t: "[VEN.GetName] купил два наших эсминца"
 venezuela.31.d: "Мы получили новость о том, что [VEN.GetName] приобрела два наших эсминца, и заплатили за них адекватно."
 venezuela.31.a: "Большой!"
 venezuela.32.t: "Медина возвращается, чтобы справиться с тяжелой ситуацией"
 venezuela.32.d: "Получив известие о том, что ситуация дома выглядела мрачной, Медина решила отменить свой тур и вернуться в свою страну, чтобы решить эту проблему."
 venezuela.32.a: "Добро пожаловать"
 venezuela.33.t: "Медина вернулась в Венесуэлу"
 venezuela.33.d: "После продолжительного тура по странам Перу, Колумбии, Панамы, Эквадора и Боливии, Медина наконец -то вернулась домой, чтобы снова правильно управлять страной после того, как он был более близким к дипломатичности к ранее упомянутым странам."
 venezuela.34.t: "Подозрительная деятельность генералов и Acción Democratica"
 venezuela.34.d: "Наша Intel показала, что некоторые генералы в стране политически сотрудничают с Acción Democratica, планируя свергнуть нынешнее правительство. \ n \ nfrom, что мы знаем, их оправдание для такого отвратительного акта состоит в том, что Медина не позволяет должным образом разрешать право на свободные и частные выборы, и что военные зарплаты являются «подразделением»."
 venezuela.34.a: "Чертовы ублюдки"
 venezuela.35.t: "Вооруженные силы и реклама начали переворот"
 venezuela.35.d: "После нескольких месяцев плана, политический альянс, сформированный между рекламой и вооруженными силами, наконец решил начать переворот против нынешнего правительства. \ n \ nas, мы говорим, члены рекламы и военнослужащих направляются в капитал, чтобы обеспечить немедленную отставку [ROOT.GetLeader]. \ n \ Нели времени покажет, как это решает себя."
 venezuela.35.a: "Да направит нас Бог"
 venezuela.36.t: "Оппозиция остается удовлетворенной"
 venezuela.36.d: "После наших различных реформ кажется, что оппозиция и военные довольны нашими действиями и решили отменить свое военное вмешательство."
 venezuela.36.a: "Пусть этот мир длится вечно"
 venezuela.37.t: "Escalante с диагнозом деменции начала"
 venezuela.37.d: "Недавняя проверка с доктором в конечном итоге превратилась в кошмар, так как было подтверждено, что Эскаланте начнется деменция, которая будет только ухудшаться. «Хотя это выглядит мрачным, есть тонкая вероятность, что его можно вылечить». \ n \ nif Условие сохраняется, Эскалантес будет вынужден уйти в отставку из политики."
 venezuela.37.a: "Это урегулирует, это правительство должно пойти"
 venezuela.37.b: "Мы сделаем все возможное, чтобы исцелить его"
 venezuela.38.t: "Медина передает президентство Эскаланте"
 venezuela.38.d: "Как первоначально планировалось, Медина решила уйти от власти, и на своем месте Дион Эскаланте примет власть. Считается, что многие являются потенциальной спасательной грацией для Венесулеи, возглавляя их в золотое десятилетие. Благодаря этому его инаугурация в качестве президента увидела тысячи людей, которые подбадривали его. \ n \ nlet's надежда ничего плохого с ним не происходит."
 venezuela.38.a: "El Pueblo esta Contigo, президент сеньора"
 venezuela.39.t: "Romulo Gallegos выиграл выборы [GetYear]"
 venezuela.39.d: "Благодаря администрации Бенкурта и демократизации страны, Венесуэла, наконец, впервые за десятилетия впервые за десятилетия провели свои свободные и надлежащие выборы. Результаты выборов были выявлены в этот особенный день, и было подтверждено, что Ромуло Галлегос выиграл выборы и будет отвечать за страну."
 venezuela.39.a: "Это замечательные новости!"
 venezuela.40.t: "Ромуло Бенкурт выиграл выборы [GetYear]"
 venezuela.40.d: "свободные выборы"
 venezuela.40.a: "Это замечательные новости!"
 venezuela.41.t: "Рафаэль Симон Урбина уходит в изгнание"
 venezuela.41.d: "После событий, которые произошли из -за переворота [GetYear] против Медины, мы получили новости о том, что Урбина снова вошла в изгнание, на этот раз к Гаити. Время покажет, что он решает сделать, но, как и сейчас, он не наша главная проблема под рукой."
 venezuela.42.t: "Урбина возвращается в Венесуэлу"
 venezuela.42.d: "Будучи подтвержденным несколькими свидетелями глаза и под прикрытием, Урбина вернулась в Венесуэлу. Пока кажется, что он будет на низком уровне, но он может что -то планировать. Мы должны идти очень осторожно."
 venezuela.42.a: "Pffff, как будто он может что -то сделать против нас"
 venezuela.43.t: "Карлос Дельгадо Чалбо был найден мертвым"
 venezuela.43.d: "Все еще кажется безумным верить, но доказательства вышли, и было подтверждено, что Чалбо был убит и найден мертвым. Отчет о вскрытии подтверждает, что злоумышленник изначально пытался похитить его, но он сопротивлялся, заставляя злоумышленника убить его на месте. Также было подтверждено, что виновником этого убийства был не кто иной, как Рафаэль Симон Урбина. \ n \ nwhat мы должны делать с этим уборочным уколом?"
 venezuela.43.a: "Ассамировать проклятого ублюдка"
 venezuela.43.b: "Изгнать его навсегда"
 venezuela.44.t: "[GetYear] масляный удар"
 venezuela.44.d: "В знак протеста против нынешнего правительства различные сектора нефтяной промышленности нанесли забастовку. Ударные удары произошли в основном в Зулии, однако они распространились на многие части страны. Организатор довольно неизвестен, но причиной забастовки являются плохие условия работника."
 venezuela.44.a: "Они заплатят за это!"
 venezuela.45.t: "[FROM.GetName] предлагает спасение в объединении"
 venezuela.45.d: "Заметив нашу текущую ситуацию, [FROM.GetName] предложил последнее решение для канавы: Union. Это звучит безумно, но с их промышленностью и военными, это может быть просто преимущество, которое нам нужно, чтобы одержать победу. \ n \ nwhat мы должны сделать?"
 venezuela.45.a: "Это наш последний шанс"
 venezuela.45.b: "Нет, мы более чем в порядке"
 venezuela.46.t: "[FROM.GetName] отказался объединиться с нами"
 venezuela.46.d: "[FROM.GetName] ответил на наше предложение об объединении, заявив, что они будут в порядке без объединения."
 venezuela.46.a: "Ну что ж"
 venezuela.47.t: "США дают нам два года, чтобы полностью отказаться от оси"
 venezuela.47.d: "Соединенные Штаты заметили наше ассортимент с державами оси и страхом, что мы можем в конечном итоге стать их врагом. Из -за этой проблемы США дали нам ультиматум. Либо мы разбиваем все связи с оси в течение 2 лет, либо Соединенные Штаты вмешаются в военном отношении."
 venezuela.47.a: "Хорошо"
 venezuela.48.t: "[FROM.GetName] отказался сотрудничать с нашими приказами"
 venezuela.48.d: "После того, как они дали им время, чтобы следовать нашим приказам, [FROM.GetName] отказался делать как таковые. \ n \ ndue к нашим условиям, и неспособность их встретить, пришло время пройти через наше слово и вмешиваться в военное место."
 venezuela.48.a: "Мы предупредили вас, теперь уже слишком поздно"
 venezuela.48.b: "Мы просто не можем позволить себе войну с ними прямо сейчас"
  
 ### Generic Ultimatum Event ### 
 venezuela.49.t: "[FROM.GetName] прислал нам ультиматум"
 venezuela.49.d: "В этот день мы получили официальное общение от [FROM.GetName], требуя нашей непосредственной аннексии и последующей передачи нашей суверенной территории. \ n \ n[ROOT.GetLeader] усердно оценил ситуацию вместе со своим кабинетом, и к сегодняшнему дню должно быть принято решение. \ n \ nwith Суверенитет нашей нации в наших руках, каким будет наш выбор?"
 venezuela.49.a: "У нас даже есть выбор?"
 venezuela.49.b: "Мы будем бороться до конец!"
 ### Generic Ultimatum Event ### 
  
 venezuela.50.t: "[FROM.GetName] требует наших южноамериканских владений"
 venezuela.50.d: "Мы получили официальное сообщение от [FROM.GetName], требуя передачи им нашей южноамериканской территории. \ n \ nthey утверждают, что территория имеет жизненно важную важную роль для основных и фундаментальных границ своей страны и дала понять, что неспособность передать территорию приведет к военной эскалации. \ n \ nwhat мы сделаем?"
 venezuela.50.a: "Мы не можем позволить себе войну с ними"
 venezuela.50.b: "Хочешь? Приходите и получите это тогда"
 venezuela.51.t: "Escalantes уходит от власти"
 venezuela.51.d: "Сегодня печальный день для республики, так как новости были обнародованы, что Эскалант ушел от власти из -за его деменции. Психическое заболевание слишком сильно прогрессировало и сильно повлияло на эскалантес, до такой степени, что он не смог должным образом вести. Из -за отсутствия замены Национальное собрание будет возглавлять страну и принимать административные обвинения."
 venezuela.51.a: "Печальный день для Венесуэлы"
 venezuela.52.t: "Escalantes был вылечен от его деменции"
 venezuela.52.d: "Замечательные новости прибыли из кабинета врача после последней проверки Эскалантеса. Было подтверждено, что деменция была чудесно вылечена. Доктор отметил, что это было технически возможно, но процесс будет трудным. Они были правы, это был процесс, но в конце концов он был успешным, и Escalantes может продолжать возглавлять нашу страну до следующих выборов."
 venezuela.52.a: "Это замечательно!"
 venezuela.53.t: "Революционеры берут оружие по всей стране"
 venezuela.53.d: "Порошковая бочонка в Венесуэле больше не мог его взять и разразился! По мере того, как мы говорим, тысячи и тысячи революционеров начали брать оружие, чтобы насильно снять наше авторитарное правительство. Они утверждают, что борются за предотвращение второго Висенте Гомеса, второго жестокой диктатуры. 'Никогда больше!' Являются ли пение, которые люди кричат ​​по всей стране, поскольку они поддерживают и даже берут оружие с революционерами, чтобы бороться за свое дело. \ n \ nthey не осознает серьезную ошибку, которую они совершают, и просто доказывают, что Laureano правым: что народу Венесуэлы нужен сильный авторитарный правитель, чтобы должным образом направлять их. Видите, что происходит, когда вы разрешаете свободу?"
 venezuela.53.a: "Они совершают серьезную ошибку"
 venezuela.54.t: "Насильственные протесты развернулись по всей стране"
 venezuela.54.d: "Люди начали демонстрировать свой гнев по поводу нашего сдвига в правительстве с протестами по всей стране. То, что впервые началось как лишь несколько незначительных протестующих, теперь превратилось в общенациональный хаос, поскольку протестующие теперь начали нападать на наши полицейские силы, и многие из их протестов стали насильственными, требуя, чтобы мы немедленно прекратили наши реформы. \ n \ na стыдно видеть таких людей промывших мозгов, которые считают, что мы плохие парни. Мы просто пытаемся помочь."
 venezuela.54.a: "Похоже, нам нужно подавить их еще дальше"
 venezuela.55.t: "CONSYTRWIDE удары"
 venezuela.55.d: "Поскольку политическая сцена в стране ухудшается, социалисты в стране начали организовать общенациональные удары, чтобы выразить свое презрение к нашему сдвигу к авторитарному правлению, утверждая, что это не так, как следует относиться к венесуэльскому народу. Наше правительство было отправлено этим ведущими организаторами, заявив, что мы совершаем серьезную ошибку и что мы будем платить дорого."
 venezuela.55.a: "Они будут платят дорого"
 venezuela.56.t: "Революционеры поймали контрабанда оружия"
 venezuela.56.d: "Различные скудроны нашего гендарма поймали людей, пытающихся украсть оружие из наших резервов, и это не то, что только что произошло один раз, о нет, нет, это повторялось в течение последних нескольких недель. \ n \ nit на болезненно очевидно, почему они это делают, они планируют полноценную революцию против нас только потому, что мы начали вносить порядок и достоинство в этой стране. Что бы они ни пытались, они будут растоплены на землю!"
 venezuela.56.a: "Они конденсации"
 venezuela.57.t: "Лопес Контрерас вынужден уйти от власти"
 venezuela.57.d: "Как будто что -то не может ухудшиться, [ROOT.GetLeader] отправил официальное письмо в кабинет министров, а правительство объявило о своей отставке и последующей отставке с должности. Он обратился к причинам его отставки в письме, заявив, что он просто не мог справиться с ухудшающейся ситуацией в стране, и это оказало значительное влияние на его психическое здоровье."
 venezuela.57.a: "Какой позор"
 venezuela.58.t: "Вторая освобождающая революция"
 venezuela.58.d: "Напряженность в Венесуэле растут в течение нескольких месяцев, с тех пор, как страна решила переключиться на более авторитарное государство. Intel говорит нам, что люди не хотели проходить аналогичную диктатуру, подобную той, которую они переселивали всего год назад, и готовы поставить свою жизнь на линию, чтобы спасти Венесуэлу и гарантировать, что она остается свободной и демократической. Первые снимки революции были произведены всего несколько часов назад, и ситуация, похоже, с этого момента будет только хуже. Результат этой революции мог бы навсегда определить траекторию страны, поэтому на линии есть много для обеих сторон."
 venezuela.58.a: "Мы сделаем все возможное, чтобы победить!"
 venezuela.58.b: "Мы должны следить за Венесуэлой"
 venezuela.58.c: "Интересный"
 venezuela.59.t: "[ROOT.GetLeader] заболел легким"
 venezuela.59.d: "Мы получили новость о том, что [ROOT.GetLeader] заключил серьезную болезнь легких. Профессионалы заявили, что если это не обращается вовремя, это может серьезно ухудшаться и даже привести к смерти. Там, где [ROOT.Getleader] заключила контракт, болезнь до сих пор неизвестно, но это могло бы быть во время тура на юге страны."
 venezuela.59.a: "Мы позаботимся о том, чтобы он получил надлежащее лечение!"
 venezuela.60.t: "Лауано скончался"
 venezuela.60.d: "Сегодня встретился с Sad News, так как было подтверждено, что Лауано скончался. Вскрытие подтвердило, что это было связано с его развивающейся болезнью легких. Это действительно позор, что мы не смогли дать ему правильное лечение вовремя."
 venezuela.60.a: "Ваша память будет жить!"
 venezuela.61.t: "[FROM.GetName] занимал во в судебном порядке [VEN_STATE_OCCUPIED.GetName]"
 venezuela.61.d: "Местные жители в [FROM.GetName] внезапно связались с нами, прося о нашей помощи. Они уведомили нас о том, что Венесуэла не незаконно вступила в наши земли со своими войсками, сияла [FROM.GetName] и заставив местных жителей придерживаться правления своей страны. \ n \ nhow мы будем ответить на это?"
 venezuela.61.a: "Мы ничего не можем сделать, извините"
 venezuela.61.b: "Они не сойдут с рук!"
 venezuela.62.t: "Революционеры успешно подавлены"
 venezuela.62.d: "После наших различных репрессивных мер мы получили подтверждение того, что революционеры отступили и вернули свое оружие обратно в местные власти. Страна сможет продолжить нетронутую и целую часть."
 venezuela.62.a: "Они сделали правильный выбор"
  
  ## Ecuador ## 
 ecu.1.t: "Галло повышается до высшего руководства"
 ecu.1.d: "После попытки Паеса продлить его позицию власти, армия решила поместить Альберто Энрикеса Галло в власть. Военные считают, что его глубоко укоренившиеся убеждения в демократии и свободе обеспечат демократию в стране. Несомненно, армия также растворила избирательное собрание, чтобы более эффективно контролировать нацию."
 ecu.1.a: "Хорошо"
 ecu.2.t: "Инфляция попадает в эквадорскую экономику"
 ecu.2.d: "Инфляция поразила нашу экономику, повысила цены и снижая стоимость нашей валюты. Никто не видел этого вообще. Центральный банк пытается решить финансовый кризис, который сейчас присутствует в стране!"
 ecu.2.a: "Это плохо ..."
 ecu.3.t: "Учредительное собрание раскрывает [ROOT.GetLeader]"
 ecu.3.d: "Учредительное собрание собралось сегодня после анализа критической ситуации. Они посчитали [ROOT.GetLeader], чтобы не быть выполнено для того, чтобы возглавить нацию, и будут уволены с должности. На сегодняшний день сборка примет власть."
 ecu.4.t: "Коммунисты выигрывают национальные выборы"
 ecu.3.a: "Ах, черт возьми"
 ecu.4.d: "После того, как большая часть населения потребовала для выборов, результаты вернулись с громкой победой для Коммунистической партии. Как консервативные, так и либеральные партии, которые управляли страной в течение большого большинства своего времени, не могут поверить в этот результат и отказываться принять коммунистическое тоталитарное правительство у власти. \ N \ nwe должны будут держать двухпартийных контролей, прежде чем они попробуют еще раз."
 ecu.4.a: "Фантастика!"
 ecu.5.t: "Протесты против мобилизации"
 ecu.5.d: "После того, как [ROOT.GetLeader] призвал к мобилизации против растущей угрозы [PRU.GetAdjective], многие эквадорцы отказались и даже начали протестовать против нее. Если [PRU.GetAdjective] узнает об этом, у нас будут серьезные проблемы."
 ecu.5.a: "Разве они не осознают серьезность ситуации ???"
 ecu.6.t: "Учредительное собрание в конфликте с [ROOT.GetLeader]"
 ecu.6.d: "После [ROOT.GetLeader] приобрела власть. Многие члены Ассамблеи начали подвергать сомнению его лидерские навыки и идеалы. В настоящее время это вызвало разделение между президентом страны и Учредительным собранием."
 ecu.6.a: "Отлично ... именно то, что нам нужно"
 ecu.8.t: "Aurelio Mosquera narváez нашел мертвых"
 ecu.8.d: "Аурелио трагически скончался. Однако окуст загадки окружает его смерть, поскольку источники не могут убедиться, если это было из -за самоубийства, или если это было убийство. В любом случае, сегодня мы оплакиваем смерть великого лидера, у которого впереди светлое будущее."
 ecu.8.a: "Пусть он упокоится с миром"
 ecu.9.t: "[FROM.GetName] готова отказаться от своих претензий на защиту"
 ecu.9.d: "Делегаты из [FROM.GetName] прибыли в наш офис, чтобы обсудить потенциал для окончательной мирной сделки между нами. Они готовы отказаться от всех своих претензий на нашей территории в обмен на нашу защиту над ними. \ n \ naccepting Это будет означать, что между ними не будет военных действий. Мы сделаем это?"
 ecu.9.a: "Конечно, давайте отменим наши различия"
 ecu.9.b: "Pffffff, как будто мы просто забудем, что вы, ребята, сделали с нами!"
 ecu.10.t: "[FROM.GetName] предлагает поставить нас под их защиту"
 ecu.10.d: "Уважаемые генералы из [FROM.GetName] прибыли в наш офис, чтобы обсудить потенциал, чтобы стать их предметом в обмен на их полноценную защиту от нашего суверенитета. \ n \ naccepting Это превратит нас в их спутниковое состояние. Примем ли мы настоящие Условия?"
 ecu.10.a: "...Отлично"
 ecu.10.b: "Вы уколы просто хотите использовать нас!"
 ecu.11.t: "[FROM.GetName] предлагает профсоюз между нашими странами"
 ecu.11.d: "Делегаты из [FROM.GetName] прибыли в наш офис, чтобы обсудить потенциальный союз между нашими странами, учитывая наше сходство в людях и культуре. \ n \ nshall мы принимаем и формируем Коломбо-экодорский союз?"
 ecu.11.a: "Конечно"
 ecu.11.b: "Мы хотели бы остаться страной, так что нет"
 ecu.12.t: "[FROM.GetName] - это права на наши ресурсы"
 ecu.12.d: "[FROM.GetName] отправил нам ультиматум, чтобы передать доступ к нашим ресурсам по всей стране. Неспособность сделать это может привести к полномасштабному вторжению земли от [FROM.GetName]. \ n \ nwhat мы должны сделать?"
 ecu.12.a: "У нас даже есть выбор?"
 ecu.12.b: "Приходите и возьмите это у нас, давайте посмотрим, сколько крови вы готовы пролить!"
 ecu.13.t: "[FROM.GetName] преследует опасные дипломатические отношения"
 ecu.13.d: "Мы получили новости о том, что [FROM.GetName] принял довольно опасную внешнюю политику, объединяя себя с основными фашистскими державами. Если мы позволим им продолжить это, фашистские силы могут получить опору на нашей родной почве."
 ecu.14.t: "Веласко Ибарра возвращается в Эквадор"
 ecu.14.d: "Веласко прибыл сегодня после того, как остановился на несколько лет в Буэнос -Айресе. Многие люди уже начали хвалить его возвращение и называть его истинным Спасителем страны. Несмотря на его довольно короткое президентство, политическая ситуация в стране не была самой стабильной, и люди могут рассматривать его как шанс выйти из этого беспорядка."
 ecu.14.a: "Добро пожаловать назад, Веласко"
 ecu.14.b: "Отрицать его запись"
 ecu.15.t: "В нашем офисе появляется странный посетитель"
 ecu.15.d: "Вскоре после того, как в нашем офисе прибыл странный человек. Он объяснил свою ситуацию и то, как он сын нынешнего царя Испании, который в то время жил в Италии, считал нашу нацию возможность сбежать и потенциально зарекомендовать себя должным образом. Он утверждает, что наша нация имеет странно прочную связь с домом Борбона, и он может сделать много великих вещей, если мы позволим ему. \ n \ nwhat мы должны делать с ним?"
 ecu.15.a: "Он может остаться, возможно, этот план может осуществить"
 ecu.15.b: "Мы не знаем тебя"
 ecu.16.t: "Веласко начинает получать общенациональную поддержку"
 ecu.16.d: "В худшем случае начался сценарий, когда люди по всей стране начали сплачивать вокруг Веласко, рассматривая его как единственную спасительную грацию для страны. \ n \ nas, если это было не достаточно плохо, карабинеры также начали поддерживать Velasco и сплотиться против [ROOT.GetLeader]. \ n \ nwe нужно действовать и быстро!"
 ecu.16.a: "Иди в ад, укол!"
 ecu.17.t: "Провалепротестный протест в [FROM.FROM.GetName]"
 ecu.17.d: "Мы получили новость о том, что в [FROM.FROM.GetName] проходило провалосвистское митинг, который получил большое внимание и только раздражала поддержку Веласко по всей стране."
 ecu.17.a: "Большой..."
 ecu.18.t: "La Gloriosa"
 ecu.18.d: "У людей было достаточно [ROOT.GetLeader], и он требует, чтобы он немедленно отключился от власти, что позволит Веласко вступить во владение. Веласквисты по всей стране выступают против нашего правительства и готовы пролить кровь, если это означает, что Веласко берет власть. \ n \ nhow мы будем справиться с этой ужасной ситуацией?"
 ecu.18.a: "Мы должны отступить ..."
 ecu.18.b: "В своих снах!"
 ecu.19.t: "Веласко принимает силу"
 ecu.19.d: "После временного восстановления контроля над страной предварительная хунта официально отступила, чтобы позволить Веласко Ибарре взять под контроль нацию. Сегодня замечательный день для веласквистов, и наш великий лидер может наконец выдвинуть эту страну вперед!"
 ecu.19.a: "Как все должно быть"
 ecu.20.t: "[FROM.GetName] хотел бы сформировать с нами фракцию"
 ecu.20.d: "Делегаты из [FROM.GetName] прибыли в наш офис, чтобы обсудить потенциал формирования союза с нами. Они считают, что совместное, объединенное, сделает нас непобедимыми для любой угрозы посторонней. \ n \ nshall мы принимаем?"
 ecu.20.a: "Конечно"
 ecu.20.b: "Нет, извините"
 ecu.21.t: "[FROM.GetName] дал нам доступ ко всем их ресурсам"
 ecu.21.d: "Мы получили новости о том, что [FROM.GetName] позволил нам управлять всеми их ресурсами и использовать их так, как хотим."
 ecu.21.a: "Фантастика!"
 ecu.22.t: "Объединенная фруктовая компания предлагает взять на себя власть"
 ecu.22.d: "Корпоративные чиновники из банановой компании заметили нашу заинтересованность в компании, а также нашу слабую административную эффективность по стране и предложили взять под контроль страну. \ n \ nshould мы разрешаем это?"
 ecu.22.a: "У нас нет выбора ..."
 ecu.22.b: "Вы не будете принимать власть!"
 ecu.23.t: "Банановая компания вступает во владение в Эквадоре"
 ecu.23.d: "В последнее время Эквадор не очень хорошо себя делал, страдая гражданской войной и политическим кризисом, который вскоре последовал за этим. Из -за всего этого Объединенная фруктовая компания решила взять дело в свои руки и взять административный контроль над страной. \ n \ nhaving Компания, управляемая всей страной, никогда не была замечена раньше, и это может означать катастрофу, если деньги - единственное, что у них на уме."
 ecu.23.a: "Фантастика!"
 ecu.23.b: "Интересный"
 ecu.24.t: "Формирование Арне"
 ecu.24.d: "Мы получили новость о том, что Хорхе Луна Юпес только что сформировал новую фашистскую партию, Acción Revolucionaria nacionalista ecuatoriana, которая сильно основывалась на идеях фалангизма в Испании. Он приобрел некоторую поддержку и может оказаться, что это будет шип на нашей стороне, если они приобретают слишком большую популярность."
 ecu.24.a: "Хорошо"
 ecu.25.t: "Эдмундо Чирибога убит в бою"
 ecu.25.d: "Трагические новости прибыли в наш офис, поскольку наши солдаты подтвердили, что уважаемый генерал Эдмундо Чирибога был убит в бою. Так обстоит дело с тем, что многие из наших смелых солдат сражаются с уборочными перуанскими подонками. Мы надеемся, что он наконец сможет найти мир с другой стороны."
 ecu.25.a: "Пусть он упокоится с миром"
 ecu.26.t: "Великобритания Эквадор, Перу и Боливия"
 ecu.26.d: "Идея о том, что королевство, ожившее в Южной Америке, была определенно не в умах многих, и все же, сегодня было подтверждено, что [ECU.GetName] сформировался, с [ECU.GetLeader] во главе всего этого. Родом из Испании, член дома Борбона рассматривал Эквадора как шанс сделать его величество и страну сиять. \ n \ nwith баланс сил в Северной и Южной Америке, который значительно смещается с этого, только время покажет, как отреагируют другие страны."
 ecu.26.a: "Фантастика!"
 ecu.26.b: "Хорошо"
 ecu.27.t: "[PRU.GetName] заблокировал гуаякиль"
 ecu.27.d: "Мы получили сообщения о том, что [PRU.GetName] блокировал один из наших наиболее важных портов, препятствуя нам получать какие -либо товары от зарубежных стран."
 ecu.27.a: "Ублюдки!"
  
  ## PERU | ECUADOR ## 
 peruecuador.1.t: "[FROM.GetName] имеет милитаризированную западную пастаза"
 peruecuador.1.d: "Местные источники подтвердили, что солдаты [FROM.GetAdjective] вступили в пастаза. Это прямое нарушение статус -кво, подписанного в 1936 году, и может даже потенциально классифицировать как заявление войны! \ n \ nwhat должен быть наш ответ?"
 peruecuador.1.a: "Мы также должны милитаризировать"
 peruecuador.1.b: "Это акт войны, мы должны ответить!"
 peruecuador.1.c: "Мы подождем и посмотрим, как разворачивается ситуация"
 peruecuador.2.t: "[FROM.GetName] также ремилитаризован в ответ"
 peruecuador.2.d: "После того, как мы вошли в Pastaza, чтобы укрепить фронт, надежные источники подтвердили, что [FROM.GetName] сделал то же самое в попытке противодействовать нашим действиям."
 peruecuador.2.a: "Хорошо"
 peruecuador.3.t: "[PRU.GetName] и [ECU.GetName] на войне!"
 peruecuador.3.d: "Мы получили Intel, что и [PRU.GetName], и [ECU.GetName] находятся в войне из -за территориального спора в регионе пастаза. \ n \ nthis будет первым крупным конфликтом, который Южная Америка имел почти 6 лет, у нас есть шанс остановить его во времени и совпадать во время мирных переговоров."
 peruecuador.3.a: "Мы должны обеспечить мир на нашем континенте!"
 peruecuador.3.b: "Почему мы должны вообще заботиться?"
 peruecuador.30.t: "[FROM.GetName] начал предложения о мирных разговорах"
 peruecuador.30.d: "Делегаты из [FROM.GetName] предложили начать мирные переговоры как можно скорее, чтобы предотвратить большее эскалацию военных действий."
 peruecuador.4.t: "Мирные переговоры на нас"
 peruecuador.4.d: "День прибыл. Делегаты со всего континента, включая [BRA.GetName], [ARG.GetName] и [USA.GetName], ожидают нашего окончательного ответа на ситуацию. Все они настаивают на том, чтобы мы остановили эту войну и снова в мире. \ n \ nthey заверили, что любая территория, в настоящее время находящаяся под нашим пониманием, будет нарисована на официальных границах. \ n \ nwhat мы будем делать?"
 peruecuador.4.a: "Давайте остановим эту войну"
 peruecuador.4.b: "Есть спор, с которым нам все еще нужно иметь дело!"
 peruecuador.5.t: "Обе страны согласились на мир"
 peruecuador.5.d: "Сегодня тяжелый день! Было получено подтверждение, что обе страны готовы подписать мирное соглашение, официально прекратив войну между [PRU.GetName] и [ECU.GetName]."
 peruecuador.5.a: "Фантастика!"
 peruecuador.6.t: "Протокол Рио -де -Жанейро подписан"
 peruecuador.6.d: "С момента падения Гран Колумбии произошел территориальный спор между [PRU.GetName] и [ECU.GetName], особенно на территории пастаза, причем обе страны утверждают это как их. Эти пограничные напряженности в конечном итоге превратились в полномасштабную войну. К счастью, благодаря подписанию этого мирного договора, мир был восстановлен на континенте Южной Америки. \ n \ nmany по -прежнему обдумывает, что мир действительно останется с этими новыми границами, так как спор все еще очень присутствует."
 peruecuador.6.a: "Мир наконец"
 peruecuador.6.b: "Хорошо"
 peruecuador.7.t: "Должны ли мы уйти из эквадорских земель?"
 peruecuador.7.d: "Теперь, когда война вырисовывается: Должны ли мы поддерживать нашу оккупацию эквадорских земель, или мы должны вернуть его обратно в Эквадор?"
 peruecuador.7.a: "Вернуть им это"
 peruecuador.7.b: "Ни за что!"
 peruecuador.8.t: "[PRU.GetName] выводит из наших земель"
 peruecuador.8.d: "[PRU.GetName] отступил их войска с нашей территории, и мы снова имеем владение нашей землей."
 peruecuador.8.a: "Хороший"
 peruecuador.9.t: "[PRU.GetName] все еще занимает наши земли"
 peruecuador.9.d: "[PRU.GetAdjective] войска все еще присутствуют в наших землях! \ N \ nwhat, мы будем делать?"
 peruecuador.9.a: "Просто отпусти это"
 peruecuador.9.b: "Они не сойдут с рук!"
 peruecuador.10.t: "Прекрасная военная операция"
 peruecuador.10.d: "Наши войска успели в завершении назначенной военной операции! Мы можем радоваться!"
 peruecuador.10.a: "Замечательный!"
 peruecuador.11.t: "Неудачная военная операция"
 peruecuador.11.d: "Наши войска, к сожалению, не смогли выполнить задачи, которые они были назначены."
 peruecuador.11.a: "Облом ..."
 peruecuador.12.t: "Мы готовы сражаться [ECU.GetName]"
 peruecuador.12.d: "Все препараты были сделаны, мы можем объявить войну Эквадору!"
 peruecuador.12.a: "Мы возьмем, что у нас!"
 peruecuador.13.t: "Победоносная стычка на [FROM.FROM.GetName]"
 peruecuador.13.d: "Наши войска были успешными в обращении с врагом в [FROM.FROM.GetName]. Благодаря этому мы получили еще больше Intel на врага!"
 peruecuador.14.t: "Поражение в [FROM.FROM.GetName]"
 peruecuador.14.d: "К сожалению, битва была тем, которая просто не суждено было в наших интересах. Наш враг теперь увеличил нас, и если мы не будем действовать быстро, это может означать нашу гибель!"
 peruecuador.140.t: "Победа в [490.GetName]"
 peruecuador.140.d: "Мы успешно смогли отразить вражеские войска в [490.GetName]. \ n \ nthis значительно увеличит наши военные усилия против них!"
 peruecuador.140.a: "Фантастика"
 peruecuador.15.d: "[ECU.GetAdjective] Делегаты прибыли в нашу страну, чтобы попросить нашу помощь в их неизбежном конфликте с [PRU.GetName]. \ N \ nshall Мы им помогаем?"
 peruecuador.16.t: "Эквадор незаконно занял Пиуру!"
 peruecuador.16.d: "Мы получили срочные новости о том, что войска въехали в провинцию Пиура без какого -либо предупреждения! Это четкое заявление о войне, и наши войска должны немедленно мобилизовать эффект!"
 peruecuador.16.a: "Они не сойдут с рук!"
 peruecuador.16.b: "Мы не можем объявить войну сейчас"
 peruecuador.17.t: "Эквадор борется с антивоенными протестами"
 peruecuador.17.d: "Некоторые из наших шпионов в Эквадоре вернулись к нам, заявив, что страна переживает тяжелые времена из -за их попытки мобилизовать в подготовке к неизбежной войне. Это может быть очень полезно для нас, поскольку они будут дезорганизованы, и мы в полной мере воспользуемся этим!"
 peruecuador.17.a: "Идеально, приготовьте наступление!"
 peruecuador.18.t: "Победитель войны Перу-Экуадора"
 peruecuador.18.d: "После многих месяцев ужасных сражений мы одержали победу от конфликта. То, что стоит перед нами, - это будущее Брига, блестящее радость нашего победоносного военного завоевания!"
 peruecuador.18.a: "Невероятный!"
 peruecuador.19.t: "Неудачник войны Перу-Экуадора"
 peruecuador.19.d: "Несмотря на то, что мы дали ему все, что у нас было, мы потерпели поражение. Это всего лишь вопрос времени, когда начнут последствия."
 peruecuador.19.a: "Не хорошо! Совсем не хорошо!"
 peruecuador.20.t: "Неубедительный результат войны Перу-Экуадора"
 peruecuador.20.d: "Война привела к довольно неубедительному результату, и ни одна из них не сможет сказать, что они были «победителем»."
 peruecuador.20.a: "Я думаю ... это нормально?"
 peruecuador.21.t: "[PRU.GetName] начал пограничную войну в [490.GetName]"
 peruecuador.21.d: "Повышенная активность войск не только для показа, так как [PRU.GetAdjective] начал полномасштабный пограничный конфликт в провинции [490.GetName]. Мы должны укрепить и быстро!"
  
  
  ## Monarchist rework 
 brazil.96.t: "Создание антимонархистской коалиции"
 brazil.96.d: "Узнав о нашем растущем монархистском влиянии по всей стране, Варгас взял дело в свои руки, чтобы сотрудничать с другими сторонами страны сформировать антимонархистскую коалицию. \ n \ nsee, его решимость в работе с его предполагаемыми врагами может означать только то, что другие стороны считают нас серьезной угрозой для их маленького круга друзей, которые приносят пользу друг другу."
 brazil.96.a: "Они скоро рухнут"
 brazil.97.t: "Коалиция инициирует планы остановить наше движение"
 brazil.97.d: "Новости достигли нас, что коалиция инициировала планы полностью расколоть наше движение, и они планируют использовать все в своем распоряжении, чтобы остановить нас, в том числе кровь наших соотечественников."
 brazil.97.a: "Уступывание"
 brazil.98.t: "Коалиция расстроилась на нашем движении!"
 brazil.98.d: "Коалиция попала в нас. Многие из наших самых страшных и лояльных последователей были арестованы, некоторые из которых оказывают значительное влияние на движение, препятствуя нам продолжать наши планы, как и предполагалось. Нам нужно запустить все, что мы планировали сейчас!"
 brazil.98.a: "Everyone к оружию"
 brazil.99.t: "Антимонархистская коалиция охотится на монархистов"
 brazil.99.d: "Некоторые из наших самых лояльных сторонников были вынуждены противостоять антимонархистским силам, и, к сожалению, результат оказался трагическим, поскольку большинство из них были заключены в тюрьму, с некоторыми жертвами. Эти презренные действия являются преступлением против человечества!"
 brazil.99.a: "Они заплатят за это!"
 brazil.100.t: "Бавария объявила независимость!"
 brazil.100.d: "Некоторые из наших войск, размещенных в Баварии, срочно связались с нами, заявив, что Бавария вышла из страны и объявила от нас независимость! Наша Intel также получила внутреннюю манипуляцию из [BRA.GetName], присутствовала в этой операции и последующем отделении. \ n \ nwhat мы сделаем?"
 brazil.100.a: "Они оба заплатят за это!"
 brazil.100.b: "Мы не можем себе это позволить."
 brazil.101.t: "Имперский переворот"
 brazil.101.d: "В конце концов, после многих месяцев тщательного планирования и при поддержке миллионов по всей стране, мы смогли насильно отречься от тогдашнего лидера Гетулио Варгаса. \ n \ nnow, с вейгой, мы можем начать реструктуризация недавно созданного монархистского состояния и выбрать адекватного императора в качестве преемника Dom Pedro II, чтобы управлять новой империей во славу!"
 brazil.101.a: "IndependendCia Ou Morte!"
 brazil.103.t: "Баварская независимость!"
 brazil.103.d: "Новости путешествовали по всему миру, что Бавария только что вышла из Германии и объявила независимость! За последние пару месяцев в Баварии растут чувства, и многие источники были закреплены в качестве виновника. Учитывая нынешнюю ситуацию в Германии, как бразильцы, так и баварцы считали это прекрасной возможностью. Стоимость ситуации почти гарантированно обострена, но сейчас все, что мы можем сделать, это подождать и посмотреть."
 brazil.103.a: "Интересный"
 brazil.103.b: "В конце концов!"
 brazil.103.c: "Они заплатят за это!"
 brazil.104.t: "Восстановление империи Бразилии"
 brazil.104.d: "Первоначальная империя была распущена еще в 1889 году, а последним лидером был Дом Педро II. Теперь, почти 5 десятилетий спустя, преемник первоначальной империи официально был объявлен всего несколько часов назад, заявив о первоначальном престоле Империи. Было показано, что вторая бразильская империя имела довольно амбициозные планы, в частности, чтобы вернуть империю к своей прежней славе. \ nhaving a Империя снова в Южной Америке вызывает обеспокоенность во многих американских нациях, в частности в Соединенных Штатах, однако на данный момент они остаются просто бдительными в ситуации."
 brazil.104.a: "Ах, круто"
 brazil.104.b: "Avé Gloria, Avé Imperio"
 brazil.105.t: "Союз Бразилии и Баварии"
 brazil.105.d: "Было подтверждено, что Вторая Бразильская империя и Королевство Бавария объединились, чтобы сформировать Королевство Бразилия и Бавария. Нации \ n \ nmany предполагают, что делать с этой ситуацией, с еще большим оставшимся с очень важным вопросом: рассматриваем ли мы эту новую сущность как к союзнику или врагу?"
 brazil.105.a: "Хорошо"
  
 argentina.22.e: "Винт, что люди проголосовали, мы взяли под контроль!"
  
 peru.41.t: "Восстановление испанской империи"
 peru.41.d: "Новости распространились по всему миру тогдашнего королевства Перу, который теперь автоматически децилируется в качестве преемника оригинальной испанской империи, заявляя, что их судьба-выполнить то, что не могла первоначальная империя! \ n \ nmany предполагает, насколько успешным будет этот «преемник», и многие уже предсказывают его неизбежный крах до огромного количества земли, необходимой для их контроля. В настоящее время они представляют серьезную угрозу глобальному балансу."
 peru.41.a: "Они обречены на неудачу"
 peru.41.b: "Слава империи!"
 peru.42.t: "Должны ли мы продвигать короля?"
 peru.42.d: "Видный и влиятельный карлист по имени Карлос Пио Хабсбурго Борбон подошел к нашему правительству, предлагая стать королем новой испанской империи. Он обещает, что сделает все в силе, чтобы обеспечить полный имперский успех! \ n \ nshall он становится королем?"
 peru.42.a: "Конечно, это только логично"
 peru.42.b: "Перуанский останется ответственным!"
  
  ## EUYL ## 
 EUYL.1.t: "[USA.GetName] дает нам 3 года, чтобы объявить войну по оси"
 EUYL.1.d: "[USA.GetLeader] связался с нами, с серьезным предупреждением по отношению к нашей нации, заявив, что если мы не объявим войну на державами оси и присоединяемся к их стороне войны, то будут серьезные последствия. \ N \ nwe дают 3 года, чтобы решить нашу судьбу по этой теме: либо мы подчиняемся и объявляем войну на немцев, либо мы игнорируем его и сталкиваются с потенциальным американским вторжением."
 EUYL.1.a: "Мы должны быть осторожны с [USA.GetAdjective]"
  
 EUYL.2.t: "Мы не смогли достичь наших военных целей"
 EUYL.2.d: "Наши враги установили очень жесткое сопротивление, и наши первоначальные цели пошли по утечке. \ n \ nour люди выходят на улицы, чтобы протестовать против нашего неудачного расширения, и нам нужно быстро принять решение. Должны ли мы положить руки?"
 EUYL.2.a: "Мы сдаемся"
 EUYL.2.b: "Мы будем продолжать"
  
 EUYL.3.t: "[FROM.GetName] повернул руки"
 EUYL.3.d: "Мы были уведомлены, что [FROM.GetName] решил остановить все достижения на нашей территории и прекратить их атаку. Они даже согласились передать территорию, которую мы завоевали от них. \ n \ nour Fierce Constiance окупилось, и теперь мы те, кто уходит победительными!"
 EUYL.3.a: "Мы лучше!"
  
  ## NEW DLC CONTENT ## 
 argentina.dlc.1.t: "Небольшой фашистский марш в [FROM.FROM.GetName]"
 argentina.dlc.1.d: "Несмотря на то, что крупные препараты были созданы для проведения массового марша, только несколько пришли к маршу в [FROM.FROM.GetName]. Нам просто нужно надеяться, что больше людей посещают следующий."
 argentina.dlc.1.a: "Проклятие"
 argentina.dlc.2.t: "Фашистский марш в [FROM.FROM.GetName]"
 argentina.dlc.2.d: "Марш в [FROM.FROM.GetName] оказался успешным, так как многие люди появились, чтобы похвалить идеи фашизма и выразить свою солидарность идеологии."
 argentina.dlc.2.a: "Большой!"
 argentina.dlc.3.t: "Большой фашистский марш в [FROM.FROM.GetName]"
 argentina.dlc.3.d: "Первоначально планировалось быть маршем приличного размера в [FROM.FROM.GetName], оказалось огромным. Это прошло намного лучше, чем кто -либо когда -либо ожидал!"
 argentina.dlc.3.a: "Это фантастика!"
 argentina.dlc.4.t: "Оппозиция вынуждена сдаться"
 argentina.dlc.4.d: "Мы получили официальное уведомление от Марсело Т. де Альвира, лидера сопротивления правительства ANIT, заявив, что их официальная сдача и отступая от каких-либо конфронтаций. Он также пообещал, что в будущем больше не будет военных действий."
 argentina.dlc.4.a: "Похоже, они усвоили свой урок"
 argentina.dlc.5.t: "Различные оппозиционные секторы объединяются против нас"
 argentina.dlc.5.d: "После полного контроля над нацией многие из наиболее демократических частей Конкордансии, UCR, социалистов и даже некоторых коммунистов объединились, чтобы сформировать коалицию против нашего нынешнего решения, и наш разум обнаружил, что они планируют полномасштабное восстание, чтобы убрать нас сильно из власти!"
 argentina.dlc.5.a: "Они заплатят своей кровью!"
 argentina.dlc.6.t: "Леопольдо Лугонс предлагает принять власть"
 argentina.dlc.6.d: "После присоединения к правительственным рядам многие люди начали боготворить образ мышления Лугона, а недавно получили огромную поддержку. Благодаря этой крупной общественной поддержке, Лугонс пришел к нам, предлагая взять на себя власть вместо нас и возглавить Аргентину. Он считает, что с его поддержкой он станет лучшим кандидатом на то, чтобы привести нацию в полной мере."
 argentina.dlc.6.a: "Знаешь что? Конечно, почему бы и нет"
 argentina.dlc.6.b: "... ты безумный? Черт возьми!"
  
  ## CHILE | NEW ## 
 chile.430.t: "[FROM.GetName] требует [270.GetName]"
 chile.430.d: "Мы получили требование от [FROM.GetName], чтобы передать владение [270.GetName]. Неудача при этом приведет к серьезным последствиям. \ n \ nhow мы будем продолжать с этим?"
 chile.430.a: "Пусть им это"
 chile.430.b: "Остров останется британским"
  
 chile.51.t: "Фашистский переворот в Чили!"
 chile.51.d: "[CHL.GetName] за последние пару месяцев видел недавний переход к более правой политике. В то время как большинство предполагали, что этот сдвиг останется политическим и демократическим, многие были шокированы, обнаружив, что страна внезапно проходит через и жестокий переворот, чтобы снизить демократическое правительство вместо фашистского. Найки, как сами призыв, являются экстремистами, которые ищет ничего больше, чем привести порядок и справедливость в Чили, распространяя страх среди своих соседей."
 chile.51.a: "Действительно очень полезный союзник"
 chile.51.b: "Как опасно. Как грустно."
 chile.51.c: "Чили снова будет великим!"
  
 ecu.28.t: "[FROM.GetName] запрашивает военный доступ в Галапагосе"
 ecu.28.d: "Из -за их недавней ссоры с [JAP.GetName], [FROM.GetName] требует военного и военно -морского доступа в [649.GetName], поскольку они считают, что это стратегическая точка для удержания. Должны ли мы это?"
 ecu.28.b: "Абсолютно нет!"
  
 ecu.29.t: "Перу милитаризировал [490.GetName]!"
 ecu.29.d: "Отчеты затопили нашу штаб -квартиру, предупреждающие нас о перуанском военном присутствии в провинции [490.GetName]. \ n \ nhow мы будем отреагировать на эту потенциальную угрозу для нашего суверенитета?"
 ecu.29.a: "Мы должны милитаризировать в ответ!"
 ecu.29.b: "Нам нужно отступить ..."
  
