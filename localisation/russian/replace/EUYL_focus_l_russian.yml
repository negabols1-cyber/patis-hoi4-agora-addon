l_russian:
 CHL_aviation_effort: "Авиационные усилия"
 CHL_aviation_effort_desc: "Нигде технологические достижения более быстрые, чем в воздушной войне. Авиация - это область, которую должна освоить любая современная нация."
 CHL_fighter_focus: "Истребитель фокусировки"
 CHL_fighter_focus_desc: "Мы не видели этого последнего боя в Великой войне. Будучи вперед в разработке истребительных самолетов, даст нам преимущество в будущем."
 CHL_bomber_focus: "Фокус бомбардировщика"
 CHL_bomber_focus_desc: "Когда люди будущего говорят об ужасе на сегодняшние войны, будет заметно пожар с неба. Мы сделаем все возможное, чтобы эти истории рассказали эти истории."
 CHL_aviation_effort_2: "Авиационные усилия II"
 CHL_aviation_effort_2_desc: "Дальнейшие достижения в области авиации будут необходимы для хорошей интеграции наших ВВС с другими ветвями военных."
 CHL_CAS_effort: "CAS усилие"
 CHL_CAS_effort_desc: "Современная армия нуждается в поддержке транспортных средств не только на земле, но и в воздухе."
 CHL_democracy_path: "По праву"
 CHL_democracy_path_desc: "С падением авторитаризма благодаря Великой депрессии, демократия расцвела в его отсутствии. Мы должны убедиться, что мы продолжили путь правильности."
 CHL_fascist_path: "По мозу"
 CHL_fascist_path_desc: "Демократическое учреждение было слишком слабым, чтобы возглавить нашу страну. После примера Германии мы укрепим силу нашей страны."
 CHL_communist_path: "Сформировать Frente Popular"
 CHL_communist_path_desc: "Великая депрессия показала, что капитализм обречен на неудачу. Следуя советскому примеру, мы будем следовать этому новому альтернативному пути."
 CHL_status_quo: "Продолжайте использовать экономику Laissez-Faire"
 CHL_status_quo_desc: "свободный рынок"
 CHL_liberalism_focus: "Другой подход"
 CHL_liberalism_focus_desc: "Наряду с окончательным авторитаризмом, Великая депрессия показала, что система Laissez-Faire ошибочна и может в любое время рухнуть. Мы должны действовать, чтобы убедиться, что другая трагедия, подобная депрессии, снова возникает"
 CHL_freer_market: "Freer The Market,"
 CHL_freer_market_desc: "Freer The Market,"
 CHL_freer_people: "Через свободные люди."
 CHL_freer_people_desc: "Через свободные люди."
 CHL_revenue_tax: "Наложить налог на доход"
 CHL_revenue_tax_desc: "Наше правительство в его нынешнем государстве мало что говорит в экономике. С этим предварительным налогом правительство будет иметь средства для действия."
 CHL_central_bank: "Усилить наш центральный банк"
 CHL_central_bank_desc: "Чилийский центральный банк был создан еще в 1925 году и с тех пор является влиятельной организацией в чилийской экономике. Однако из -за меняющейся политической и глобальной ситуации нам может потребоваться переосмыслить роль центрального банка в экономике. Укрепление этого было бы нашим лучшим выбором, чтобы убедиться, что наша валюта не теряет ценности."
 CHL_communist_counterweight: "Капиталистический противовес"
 CHL_communist_counterweight_desc: "Капитализм - единственный путь к свободе, и существование коммунистических советов представляет угрозу для этого. Мы должны стать капиталистическим противовесом, чтобы противостоять коммунистической угрозе."
 CHL_bastion_democracy: "Бастион южноамериканской демократии"
 CHL_bastion_democracy_desc: "Мы - самая мощная демократическая южноамериканская страна, как таковая, мы должны стать демократическим бастионом нашего региона и привести наших соседей к демократии."
 CHL_NAP: "Приснитесь с нашими соседями"
 CHL_NAP_desc: "Принцип неагрессии (NAP) является важной частью капитализма. Мы должны применить эту идею с соседями, с которыми мы общаемся."
 CHL_global_market: "Полностью откройте наши рынки"
 CHL_global_market_desc: "Мы должны открыть наши рынки для достижения настоящей капиталистической утопии."
 CHL_join_allies: "Присоединяйтесь к союзникам"
 CHL_join_allies_desc: "Наше будущее лежит на Демократическом Западе, и, поскольку тоталитаризм распространяется по всему миру, мы должны присоединиться к демократическим силам в союзниках."
 CHL_our_path: "Южноамериканская Антента"
 CHL_our_path_desc: "Демократия должна быть защищена, но это не значит, что мы должны на стороне империалистических империй. Вместо этого мы должны искать других союзников и создать новый союз."
 CHL_invite_argentina: "Пригласить Аргентину"
 CHL_invite_argentina_desc: "Хотя это не так демократично, как хотелось бы, нельзя отрицать, что Аргентина - очень сильная страна. Если они присоединятся к нашему альянсу, они могут даже стать более демократической страной."
 CHL_invite_south_america: "Пригласить южноамериканских демократий"
 CHL_invite_south_america_desc: "Хотя это правда, что какая -либо одна южноамериканская страна не имеет такого большого влияния, как в Европе, однако, если мы объединяемся с другими демократиями на нашем континенте, мы могли бы стать мощным голосом на международной арене."
 CHL_invite_central_america: "Пригласить демократии центральной Америки"
 CHL_invite_central_america_desc: "Зачем останавливаться в Южной Америке? Если мы союзним с демократиями в Центральной Америке, наш объединенный голос и сила только возрастет."
 CHL_influence_neighbors_democracy: "Влиять на наших соседей"
 CHL_influence_neighbors_democracy_desc: "Мы должны показать нашим соседям, как сделана демократия."
 CHL_create_the_pan_american_highway: "Создать панамериканское шоссе"
 CHL_create_the_pan_american_highway_desc: "Чтобы укрепить легитимность нашего государства, а также установить отношения со странами, опасающиеся наши идеи, мы создадим панамериканское шоссе."
 CHL_strengthen_the_workers: "Укрепить рабочих"
 CHL_strengthen_the_workers_desc: "Рабочие - это то, что управляет обществом. Таким образом, мы должны предоставить им больше прав на рабочем месте."
 CHL_legalize_labor_unions: "Легализовать профсоюзы"
 CHL_legalize_labor_unions_desc: "Легализация профсоюзов и поражение является решающим правом, необходимым пролетариату, чтобы не допустить управления буржуазией над ними. Мы должны легализовать это."
 CHL_our_commie_path: "Наш собственный путь"
 CHL_our_commie_path_desc: "Советский Союз - это коррумпированное тоталитарное государство, которое рисует нас всех в плохом свете, мы должны отказаться от них и установить нашу собственную сферу влияния."
 CHL_influence_neighbors: "Распространить наши убеждения"
 CHL_influence_neighbors_desc: "Наши соседи по -прежнему контролируются буржуазией, обманывая пролетариат в их штатах, полагая, что они имеют право голоса в их обществе. Мы должны распространять наши убеждения на наших соседей и показать им, что их «демократия» - фасад."
 CHL_join_soviets: "Присоединяйтесь к Советам"
 CHL_join_soviets_desc: "Мы должны присоединиться к самой сильной силе коммунизма, если хотим выжить в суровом капиталистическом мире, в котором мы живем."
 CHL_crush_the_press: "Раздавить прессу"
 CHL_crush_the_press_desc: "Мы должны остановить коррумпированную прессу, чтобы предотвратить распространение лжи и заявлений, которые могут повредить наше правило."
 CHL_establish_propaganda_news: "Распространять пропаганду"
 CHL_establish_propaganda_news_desc: "Мы должны объединить нашу нацию, либо заявив о наших успехах, демонизируя наших врагов или какой -либо другой метод. В любом случае, мы должны распространять эти истины через наши собственные новостные станции."
 CHL_fight_for_it: "Борьба за фашизм!"
 CHL_fight_for_it_desc: "Кому волнует, во что верят люди? Мы знаем их лучше и будем править этой страной, с ними или без них."
 CHL_join_it_to_beat_it: "Присоединяйтесь к системе, чтобы раздавить систему"
 CHL_join_it_to_beat_it_desc: "Чтобы создать успешное фашистское состояние, мы должны достать людей на нашей стороне, и с референдумом мы можем стать правителями Чили."
 CHL_world_oyster: "Мир - наша устрица"
 CHL_world_oyster_desc: "С установленным нашим новым режимом мы можем использовать эту силу, чтобы получить то, что мы хотим от наших соседей."
 CHL_join_the_nazi: "Присоединяйтесь к нацистской Германии"
 CHL_join_the_nazi_desc: "Немецкий рейх поддерживал нас с самого начала, мы должны выразить нашу благодарность, присоединившись к их альянсу."
 CHL_BOL_ultimatum: "Боливийский ультиматум"
 CHL_BOL_ultimatum_desc: "Мы отправим наши требования Боливии. Однако, если они откажутся от наших требований, мы будем делать то, что должны."
 CHL_fuego_demand: "Требование Тьерра дель Фуэго"
 CHL_fuego_demand_desc: "Мы требуем, чтобы аргентинцы вернули то, что по праву нашим!"
 CHL_ARG_ultimatum: "Судьба Аргентины"
 CHL_ARG_ultimatum_desc: "Аргентинцы представляют потенциальную угрозу для нашего выживания, мы должны убедиться, что они никогда не мешают нам или избавиться от них раз и навсегда."
 CHL_Peru: "Перуанский ультиматум"
 CHL_Peru_desc: "Мы отправим наши требования Перу. Однако, если они откажутся от наших требований, мы будем делать то, что должны."
 CHL_laissez_faire: "Laissez-Faire Economics"
 CHL_diff_approach: "Другой подход"
 CHL_diff_approach_desc: "Наша экономика находится в переходной стадии, поскольку она медленно наклоняется влево. Из-за этого мы столкнемся с краткосрочными проблемами для лучшего долгосрочного будущего."
 CHL_tax_revenue: "Налог на доход"
 CHL_tax_revenue_desc: "Большинство правительств облагают налогом своих людей, чтобы приобрести средства, чтобы делать то, что он желает, мы не должны быть исключением."
 CHL_central_bank_idea: "Banco Central de Chile"
 CHL_capitalist_counterweight: "Капиталистический противовес"
 CHL_open_markets: "Укрепление международной торговли"
 CHL_democratic_bastion: "Демократический бастион Южной Америки"
 CHL_anarchist_society: "Анархистское общество"
 CHL_anarchist_society_desc: "Чилийские работники имели это с правительством и президентом, взяв всю славу для себя, и теперь восстают и следят за тем, чтобы их голоса были услышаны. Больше нет централизованного правительства, больше нет единого лидера, только сейчас рабочие действительно смогут показать свое доминирование в любой стране!"
 CHL_seized_production: "Анархисты захватили производство"
 CHL_a_new_idea: "Новая идея"
 CHL_a_new_idea_desc: "Каждое из наших правительств подвело нас, и каждый раз, когда это приводило к тому же. Небольшой экономический бум, а затем обратно к бедности. Может быть, это не идеология, а само правительство, которое является проблемой нашей нации. Отменить правительство вообще может просто решить все наши проблемы."
 CHL_arm_the_people: "Вооружать людей"
 CHL_arm_the_people_desc: "Оружие для всех, независимо от того, кто они. Анархистская причина больше, чем мечта каждого мужчины или женщины, и если мы сможем достичь этого, то величие будет достигнуто быстро. Анархист будет возрождать над нашими врагами!"
 CHL_seize_the_means_of_production: "Захватить средства производства"
 CHL_seize_the_means_of_production_desc: "Средства производства принадлежали правительству слишком долго. Рабочие - это те, кто должен использовать средства для выкупа, а не те коррумпированные ублюдки. Мы обязательно вернем средства производства их законным владельцам!"
 CHL_seize_the_reserves: "Захватить резервы"
 CHL_seize_the_reserves_desc: "Правительство накапливается слишком много оружия по буквально без причины. Может быть, теперь на самом деле есть причина, и это для большего блага. Мы будем использовать это оружие по своему вкусу и убедитесь, что эти проклятые «демократы» получают то, что они заслуживают."
 CHL_our_own_fate: "Наша собственная судьба"
 CHL_our_own_fate_desc: "Все приготовления закончено, пришло время начать революцию и убедиться, что эти демократические мраки получают то, что они давно заслужили. Больше нет централизованного правительства, больше лидера, только рабочие будут теми, кто приведет эту страну во славу! Слава работнику!"
 CHL_appropriate_the_means_of_production: "Уместить средства производства"
 CHL_appropriate_the_means_of_production_desc: "С гражданской войной в полном разгаре мы должны убедиться, что эти грязные демократы не получают абсолютно ничего от своих производственных линий. Применение их и передача их работнику - это правильный путь, и единственный способ убедиться, что они в правильных руках."
 CHL_seize_the_factories: "Захватить фабрики"
 CHL_seize_the_factories_desc: "Фабрики теперь открыты благодаря нашей революции, мы должны убедиться, что мы не тратим ни одну секунду нашего времени, и убедиться, что эти фабрики находятся в правильных руках."
 CHL_an_army_of_workers: "Армия рабочих"
 CHL_an_army_of_workers_desc: "Нашей армии нуждаются в большем количестве, и для этого мы должны убедиться, что рабочие понимают, что причина, за которую их борется больше, чем что -либо еще. Найдите их в армию, и у нас будет одна адская армия."
 CHL_everyone_must_bear_the_torch: "Каждый должен выдержать факел"
 CHL_everyone_must_bear_the_torch_desc: "Каждый чилиец сейчас находится под властью работника, людей. Больше нет тиранического правителя или коррумпированного правительства, теперь это действительно и полностью люди, которые управляют страной, как и должно быть!"
 CHL_train_the_workers_army: "Обучить рабочую армию"
 CHL_train_the_workers_army_desc: "Армия довольно новая и не в лучших формах. Чтобы он достиг допустимого уровня, нам нужно обучать рабочих, чтобы правильно поставить борьбу с нашими врагами и убедиться, что наши враги поклоняются нам!"
 CHL_consolidate_the_economy: "Консолидировать экономику"
 CHL_consolidate_the_economy_desc: "Экономика все еще не полностью на нашей стороне. Мы должны убедиться, что мы полностью контролируем его и убедились, что эти капиталистические, фашистские и коммунистические бакалы абсолютно ничего не получают!"
 CHL_anarchism_no_borders: "Анархизм не имеет границ"
 CHL_bolivian_anarchism: "Боливийский анархизм"
 CHL_bolivian_anarchism_desc: "Легко самые слабые из наших соседей, мы должны сначала сосредоточиться на них. Хотя у них есть Анды, защищающие их от всех сторон, как только мы пройдемся, у них будет абсолютно нечего противостоять нашей военной мощности!"
 CHL_peruvian_anarchism: "Перуанский анархизм"
 CHL_peruvian_anarchism_desc: "Перу имеет аналогичную ситуацию, как Боливию, где Анды защищают их от всех сторон. Тем не менее, у перуанцев очень долгая и плохо защищенная береговая линия, которой мы можем в полной мере воспользоваться в результате амфибийных военно-морских вторжений."
 CHL_argentine_anarchism: "Аргентинский анархизм"
 CHL_argentine_anarchism_desc: "Аргентина имеет самую длинную границу из всех других стран, и с нашей многочисленной армией мы можем воспользоваться этим. Пробейте прямо по их линиям, и они не что иное, как торт!"
 CHL_anarchism_has_no_borders: "Анархизм не имеет границ"
 CHL_anarchism_has_no_borders_desc: "Мир теперь увидит нашу мощь, они увидят. Анархизм распространится на каждую часть планеты. Самодельный будет под красным и черным баннером, и люди действительно будут правителями мира, как и должно. Нет больше лидеров, больше нет правительства, только люди!"
 CHL_equal_education: "Установить равное образование"
 CHL_equal_education_desc: "Мы начнем показывать бонусы быть анархистским государством для людей. Пришло время позволить каждому мужчине, женщине и ребенку неограниченное количество образования, чтобы люди были лучше оснащены интеллектуальными навыками."
 CHL_militarize_the_economy: "Милитаризировать экономику"
 CHL_militarize_the_economy_desc: "Экономика просто не подготовлена ​​к нашим военным планам. Вот почему нам нужно поднять его до стандарта надлежащей военной машины и убедиться, что наши враги дрожат в страхе, когда они стали свидетелями возможности нашей экономики!"
 CHL_establish_the_global_commune: "Создать глобальную коммуну"
 CHL_establish_the_global_commune_desc: "Наша сила сейчас за пределами того, что мы впервые ожидали. Теперь мы можем осуществить нашу конечную мечту, полное завоевание Южной Америки и поместить ее под анархизм. Народ Южной Америки будет освобожден!"
 ARG_integrate_argentina: "Интегрировать Аргентину"
 CHL_create_a_mountaineer_korp: "Создать альпинистского Korp"
 CHL_create_a_mountaineer_korp_desc: "Боливийцы очень сильно защищены за Андами, и наша обычная пехота просто не сделает этого, поэтому нам нужно протолкнуть прямо через Анды с помощью надлежащих альпинистых войск."
 CHL_take_out_bolivia: "Уберите Боливию"
 CHL_take_out_bolivia_desc: "Теперь с подходящим альпинистом Korp мы можем иметь дело с капиталистическими свиньями Боливии и дать им полную мощность революции. Чем быстрее мы заканчиваем это завоевание, тем, что мы можем распространять революцию!"
 CHL_spread_the_revolution_to_argentina: "Распространить революцию в Аргентину"
 CHL_spread_the_revolution_to_argentina_desc: "Налив одну из самых длинных земельных границ в мире, должно быть довольно просто отбить аргентинцев. Наши люди будут раздавить их и, сразу же, среднестатистический аргентин увидит красоту революции!"
 CHL_revolution_to_the_cisplatine: "Революция к цисплатину"
 CHL_revolution_to_the_cisplatine_desc: "Уругвай также нуждается в некоторой революции. Они не должны представлять угрозу для наших сил и даже будут хорошей базой для вторжения в Бразилию в ближайшем будущем."
 CHL_destroy_paraguay: "Уничтожить Парагвай"
 CHL_destroy_paraguay_desc: "Парагвай также не будет представлять угрозу для наших сил. Подобно Уругваю, мы должны быть в состоянии раздавить их на ветру, и хотя их правительство может быть похоже на наше, мы не можем допустить, чтобы самозванца больше не мог жить на этой карте!"
 CHL_invite_paraguay: "Пригласить Парагвай"
 CHL_invite_paraguay_desc: "Paraguay разделяет очень похожие убеждения в наших собственных и даже несколько раз зарекомендовали себя, чтобы иметь компетентную армию. Было бы разумно иметь их в нашей фракции."
 CHL_go_for_brazil: "Пойти в Бразилию"
 CHL_go_for_brazil_desc: "Теперь, когда у нас есть хороший и долгий фронт с бразильцами, пришло время изложить наши планы и вытащить их раз и навсегда. Война будет нелегкой, но она будет стоить в долгосрочной перспективе."
 CHL_adjust_the_labor_unions: "Отрегулировать профсоюзы"
 CHL_adjust_the_labor_unions_desc: "Профсоюзы выходят из -под контроля, и многие люди слишком много получают от работы невинных, и мы быстро становимся противоположностью того, для чего мы намеревались. Вот почему мы будем корректировать эти профсоюзы, чтобы убедиться, что они не стремятся слишком далеко от своей предполагаемой цели."
 CHL_an_army_against_fascism: "Антифашистская армия"
 CHL_an_army_against_fascism_desc: "Фашисты должны быть сразу разбираются, мы не можем допустить, чтобы они больше не могли бродить по этой планете. Все меры насилия и войны приемлемы, если они против фашизма!"
 CHL_decimate_the_peruvians: "Разделение перуанцев"
 CHL_decimate_the_peruvians_desc: "Перуанцы - ближайшие фашисты из кого -либо, и их позорная идеология означает, что им больше нельзя оставаться в этом мире. Может быть, население не виновато, с идеологией необходимо немедленно разобраться!"
 CHL_integrate_our_historical_claims: "Интегрировать наши исторические претензии"
 CHL_integrate_our_historical_claims_desc: "У Чили было много исторических претензий на протяжении всей жизни, включая Патагонию и части Боливии и Перу. Теперь, когда мы полностью контролируем эти территории, мы можем интегрировать их в нашу страну."
 CHL_make_way_for_the_venezuelan_threat: "Провести место для венесуэльской угрозы"
 CHL_make_way_for_the_venezuelan_threat_desc: "Венесуэльцы на данный момент довольно далеко от нас, и между нами, и они лежат Эквадор и Колумбия. Нам нужно вытащить их, чтобы получить доступ к границе Венесуэля."
 CHL_take_out_the_final_fascist_threat: "Уберите последнюю фашистскую угрозу"
 CHL_take_out_the_final_fascist_threat_desc: "Теперь, когда Колумбия и Эквадор ушли с дороги, мы, наконец, можем сосредоточиться на истинной угрозе. Уберите Венесуэлу, и фашизм больше не будет в регионе. Конечно, есть нацисты, но союзники должны справиться с ними довольно хорошо, то есть, если они даже существуют."
 CHL_improve_the_infrastructure: "Улучшить инфраструктуру"
 CHL_improve_the_infrastructure_desc: "Поскольку наша территория довольно быстро расширяется, нам необходимо улучшить наши дорожные сети между нашими землями и нашими завоеванными землями. При этом позволит нам раскрыть гораздо больший потенциал с завоеванными землями."
 CHL_exploit_the_bolivian_tungsten: "Эксплуатировать боливийский вольфра"
 CHL_exploit_the_bolivian_tungsten_desc: "Боливия известна своими обильными вольфрамовыми шахтами. Теперь, когда мы имеем полный контроль над ними, мы можем использовать их до абсолютного максимума и пользоваться всеми преимуществами, которые принесут как нашу экономику, так и торговлю."
 CHL_exploit_the_intellects: "Эксплуатировать интеллекты"
 CHL_exploit_the_intellects_desc: "В нашем нынешнем населении есть много интеллектов, и они могут немного помочь в нашей технологии и убедиться, что анархизм может достичь каждого уголка планеты."
 CHL_combine_with_the_anarchists_in_iberia: "Объединиться с испанскими анархистами"
 CHL_combine_with_the_anarchists_in_iberia_desc: "Наши анархистские братья и сестры добиваются успеха на иберийском полуострове. Оба наши идеалы одинаковы, ни один, ни у нас, ни у нас нет политических идеалов, мы оба о людях и только люди. Сочетание наших сил даст нам еще больший шанс воплотить в жизнь нашу конечную мечту, целый мир под анархизмом!"
 CHL_prepare_the_people_for_war: "Подготовьте людей к войне"
 CHL_prepare_the_people_for_war_desc: "Люди Чили просто не готовы к экспансионистской политике, которую мы собираемся установить. Вот почему мы должны убедиться, что люди столь же патриотичны, как и всегда для большего блага Чили!"
 CHL_gain_the_edge: "Получить преимущество"
 CHL_gain_the_edge_desc: "Гражданская война будет довольно сложной, поэтому мы не должны получить все преимущество. Убедитесь, что люди были на нашей стороне, чтобы, когда начинается гражданская война, они сражаются за нас, а не за капиталистических свиней!"
 CHL_secure_the_peruvian_alliance: "Закрепите перуанский альянс"
 CHL_secure_the_peruvian_alliance_desc: "У перуанцев есть те же идеалы, что и у нас, и, хотя они могли бы иметь враждебное отношение к капиталистической версии самих, эти новые мы не должны быть проблемой для них. В конце концов, у нас одинаковые амбиции."
 CHL_decimate_the_bolivians: "Разделение боливийцев"
 CHL_decimate_the_bolivians_desc: "Боливийцы стоят на пути нашего пути к полной славе. Мы позаботимся о том, чтобы они сдались, даже если это означает жестокую силу."
 CHL_build_up_the_military: "Создать военные"
 CHL_build_up_the_military_desc: "Нам нужно поднять наш военный продукт, если мы хотим, чтобы наши амбиции сбылись. Создание наших арсенала поможет нам достичь нашей цели."
 CHL_maintain_the_fire: "Поддерживать огонь"
 CHL_maintain_the_fire_desc: "Чилии столь же патриотичны, как и всегда, держат флаги повсюду и желают умереть за свою страну. Давайте убедимся, что это националистическое настроение продолжается, чтобы убедиться, что наши планы работают."
 CHL_purge_the_communist_scums: "Очищать коммунистические море"
 CHL_purge_the_communist_scums_desc: "Парагвайские идеалы далеко не ОК. Этим гнилым коммунам нельзя оставаться здесь больше, им нужно искать, несмотря ни на что. Они увидят мощь чилийской фашистской армии!"
 CHL_tackle_the_giant: "Возьмите гигант"
 CHL_tackle_the_giant_desc: "Бразильская угроза слишком велика, чтобы ее не присматривали. Они становятся все более и более сильными к второму, и если мы позволим им продолжать, то кто знает, что они смогут сделать. Это почему мы будем иметь дело с ними прямо сейчас прямо сейчас!"
 CHL_strenghthen_our_ties_with_peru: "Укрепить наши связи с Перу"
 CHL_strenghthen_our_ties_with_peru_desc: "Перуанцы продемонстрировали, что они не только хороший союзник, но и компетентный, который может самостоятельно выполнить много вещей и при этом быть готовыми помочь UT других своих союзниках. Они очень хороший союзник, и мы демонстрируем им, насколько мы их ценим."
 CHL_stab_peru_in_the_back: "Ударить Перу в спину"
 CHL_stab_peru_in_the_back_desc: "Как раз когда они думают, что все они были уютны и комфортно с нами, тогда мы нанесем удар! Соберите их быстро, и у нас будет очень широкий фронт, чтобы снять бразильцев. Ничего личного Перу, просто не следует доверять всем, с кем говорите."
 CHL_push_past_peru: "Протолкнуть мимо Перу"
 CHL_push_past_peru_desc: "Теперь, когда Перу уходит с пути, мы можем иметь дело с остальной частью континента. Сначала в нашем списке убийств, Эквадор и Колумбия. Работайте с ними быстро, и у нас будут открыты ворота в Венесуэлу. С Венесуэлой, у нас будет весь континент под нашим руками."
 CHL_secure_the_oil_fields: "Закрепить нефтяные месторождения"
 CHL_secure_the_oil_fields_desc: "Теперь, когда мы имели дело с Эквадором и Колумбией, мы можем пойти после нефтяной гавани континента, Венесуэла. Наличие всей этой нефти для себя даст нам очень мощную позицию на мировой арене."
 CHL_join_the_axis: "Присоединяйтесь к оси"
 CHL_join_the_axis_desc: "Мы достали единственные два других фашистских государства на континенте, поэтому нет смысла иметь союз только с самими собой. Немцы, с другой стороны, гораздо больше, чем компетентный союзник. С ними на нашей стороне весь мир встретится с нашим гневом!"
 CHL_invite_the_venezuelans: "Пригласить венесуэльцев"
 CHL_invite_the_venezuelans_desc: "Как и перуанцы, венесуэльцы имеют очень похожие идеалы для наших. Наличие их в качестве союзника наверняка поможет нам в долгосрочной перспективе, не говоря уже о их бесконечном подаче топлива."
 CHL_establish_an_economic_alliance_with_peru: "Установить экономический альянс с Перу"
 CHL_establish_an_economic_alliance_with_peru_desc: "Обе наши экономики по -прежнему нуждаются в некотором расширении, чтобы быть подвижной угрозой для других стран, поэтому мы будем сформировать экономический договор с нашим верным союзником и одновременно улучшит обе наши экономики. Мир будет бояться нас!"
 CHL_attack_from_both_sides: "Атаковать с обеих сторон"
 CHL_attack_from_both_sides_desc: "С Венесуэлой сейчас на нашей стороне, мы можем с относительной легкостью снять Колумбию и Эквадор. США и перуанцы толкают с юга, а венесуэльцы толкают с севера. Колумбийцам и эквадорцам не будет шансов против двух передней войны."
 CHL_prepare_for_one_final_invasion: "Подготовиться к одному последнему вторжению"
 CHL_prepare_for_one_final_invasion_desc: "Пришло время начать готовить военно -морской флот к нашему последнему и трудному вторжению, захватывающему Испании. Они только что прошли гражданскую войну, поэтому их силы не должны быть в состоянии противостоять нашим. Однако эти планы все еще нуждаются в подготовке, так как у них все еще есть компетентный флот, над которым нам все еще нужно работать."
 CHL_get_revenge_on_our_colonizers: "Месть наших колонизаторов"
 CHL_get_revenge_on_our_colonizers_desc: "Наступило время, все приготовления были сделаны, пришло время, наконец, продемонстрировать Испанию и миру, который является ответственным боссом. Пришло время, когда наши некогда колонизаторы получают то, что они заслуживают, почти 5 веков спустя."
 CHL_economic_alliance_with_new_friends: "Экономический рост от наших новых друзей"
 CHL_economic_alliance_with_new_friends_desc: "Теперь, когда у нас есть неагрессионные пакты с нашими соседями, мы можем учиться в их отраслях, чтобы улучшить нашу собственную отрасль. При этом очень поможет нашей экономике."
 CHL_strenghten_our_pacts: "Укрепить наши договорки"
 CHL_strenghten_our_pacts_desc: "Хотя неагрессионные пакты показывают нашу дружбу, мы верим, что пришло время укрепить нашу дружбу и убедиться, что мир знает нашу дружбу и нашу альянс против коммии!"
 CHL_destroy_the_communist_paraguayans: "Уничтожить коммунистических парагвайцев"
 CHL_destroy_the_communist_paraguayans_desc: "Теперь, когда у нас есть граница с коммунистами, пришло время полностью уничтожить их, а не допустить ни одного. Коммунисты будут бояться нашего гнева!"
 CHL_go_after_the_soviets: "Идти после Советов"
 CHL_go_after_the_soviets_desc: "Мы общаемся с коммунальными коммуниками возле нашей родины, но эти позорные существа все еще живы в Советском Союзе. Они не будут жить намного дольше, это может быть guranteed. Мы позаботимся о том, чтобы они упали, как парагвайцы!"
 CHL_remove_fascism_from_the_continent: "Удалить фашизм с континента"
 CHL_remove_fascism_from_the_continent_desc: "Тот факт, что фашизм все еще находится на нашем собственном континенте, позорный. Пришло время удалить этот вредитель, который они называют «идеологией»."
 CHL_remove_communism_from_the_continent: "Удалить коммунизм с континента"
 CHL_remove_communism_from_the_continent_desc: "Коммунизм так же плохо, как фашизм, если что -то еще хуже. Вот почему нам нужно как можно быстрее очистить их с континента."
 CHL_arm_the_population: "Вооружать население"
 CHL_arm_the_population_desc: "Пришло время подготовиться к войне, наша внешняя политика собирается принять полное 180 ходов. Juts, чтобы убедиться, что мы находимся на победной стороне, давайте убедимся, что люди в армии."
 CHL_jointmilitary_training: "Совместная военная подготовка"
 CHL_jointmilitary_training_desc: "Теперь, имея множество союзников, мы все можем учиться у военных друг друга и улучшить их. Чем более компетентна армия, тем лучше."
 CHL_economic_pact_with_argentina: "Экономический договор с Аргентиной"
 CHL_economic_pact_with_argentina_desc: "У Аргентины есть шумная экономика, из которой мы можем многому научиться. Экономический договор между нашими странами значительно улучшит как нашу экономику, и никакая внешняя угроза не сможет нас препятствовать!"
 CHL_learn_british_naval_tactics: "Узнайте британские военно -морские методы"
 CHL_learn_british_naval_tactics_desc: "Британцы - король морей, это нельзя отрицать, поэтому было бы довольно разумно изучать их методы и лучше нашего собственного флота."
 CHL_invest_in_the_universities: "Инвестировать в университеты"
 CHL_invest_in_the_universities_desc: "В университетах в Чили не хватало некоторого финансирования в течение довольно долгого времени, поэтому мы дадим им деньги, необходимые для того, чтобы преподавать население и иметь гораздо лучшее и образованное будущее."
 CHL_aftermath_of_the_great_depression: "Последствия Великой депрессии"
 CHL_aftermath_of_the_great_depression_desc: "Будучи одной из немногих стран на планете, которая полностью оправилась от Великой депрессии к 1936 году, это ставит Чили в удивительное место. Военные и промышленность могут расширяться гораздо быстрее, чем любая другая страна, и мы будем использовать это в нашем полном преимуществе."
 CHL_maintain_the_stability_of_the_nation: "Поддерживать стабильность нации"
 CHL_maintain_the_stability_of_the_nation_desc: "Стабильность - это главное, о чем мы должны беспокоиться для нашей страны. Мы держаем вместе страну, и каждый чилиец будет наслаждаться всеми удивительными преимуществами, которые она принесет."
 CHL_embrace_chilean_nationalism: "Охватите чилийский национализм"
 CHL_embrace_chilean_nationalism_desc: "Чилийский народ знает величие своей страны. Он достиг многих вещей на протяжении всей своей жизни и будьте уверены, что это сделает гораздо больше в ближайшие годы."
 CHL_expand_the_industry: "Расширить отрасль"
 CHL_expand_the_industry_desc: "Давайте сосредоточимся на промышленном секторе, убедитесь, что наша экономика поднимается перед любой другой. Если это произойдет, у нас будет отличное преимущество над нашими врагами."
 CHL_ramp_up_the_armories: "Наращивать арсенали"
 CHL_ramp_up_the_armories_desc: "Наши военные отсутствуют, наши арс -орудие довольно пусты. Мы обязательно потратим на военную информацию, чтобы они достигли уровней, которые, по нашему мнению, были невозможными."
 CHL_invest_more_in_the_civilian_economy: "Инвестируйте больше в гражданскую экономику"
 CHL_invest_more_in_the_civilian_economy_desc: "Гражданская экономика является основой этой страны, без нее мы не будем стоять так, как сейчас. Это должно быть расширено и быстро."
 CHL_invest_more_in_the_military: "Инвестировать больше в военные"
 CHL_invest_more_in_the_military_desc: "Военные - это то, что позволило нам стать независимой нацией в первую очередь, без этого мы все равно будем испанской колонией. Нам нужно расширить военные, а теперь."
 CHL_industrialize_the_nation: "Индустриализировать нацию"
 CHL_industrialize_the_nation_desc: "Будучи такой длинной нацией, нам нужны современные дорожные сети, чтобы соединить каждую часть нашей страны. Индустриализация нации поможет нам в этом секторе экономики."
 CHL_invest_in_the_education: "Инвестировать в образование"
 CHL_invest_in_the_education_desc: "Сегодняшние дети будут людьми завтрашнего дня, поэтому нам нужно, чтобы наши дети были одними из самых умных на планете, чтобы наша нация могла сиять ярче, чем любая другая."
 CHL_strengthen_the_civilian_economy: "Укрепить гражданскую экономику"
 CHL_strengthen_the_civilian_economy_desc: "Даже со всеми нашими реформами, гражданская экономика все еще не наравне с нашими целями. Мы укрепим его еще дальше, чтобы убедиться, что он достигнет этой цели."
 CHL_sacrifice_the_civilian_economy: "Жертвовать гражданской экономикой"
 CHL_sacrifice_the_civilian_economy_desc: "Гражданская экономика слишком велика для собственного блага, поэтому давайте в основном избавимся от нее. Это может повредить нашей отрасли, но наши военные скоро появятся благодаря этим радикальным изменениям."
 CHL_invest_in_the_capital: "Инвестировать в капитал"
 CHL_invest_in_the_capital_desc: "Сантьяго - это сердце этой нации, и им слишком долго пренебрегали. Давайте убедимся, что этого не произойдет на этот раз."
 CHL_expand_steel_mines: "Расширить стальные шахты Сантьяго"
 CHL_expand_steel_mines_desc: "Наш столичный регион суетливы с большим количеством стали, которую можно найти. Давайте будем использовать это абсолютно полное, чтобы наша экономика могла расти еще дальше!"
 CHL_an_economy_for_the_people: "Экономика для людей"
 CHL_an_economy_for_the_people_desc: "Люди - это то, что заставляет страну идти, они являются основной основой этой страны, они и воплотили ее в жизнь, и это то, что позволит ей продолжать идти. Наша экономика будет исключительно для обычного человека, они это заслуживают."
 CHL_arm_the_north: "Вооружать на север"
 CHL_arm_the_north_desc: "Север обладает большим потенциалом для создания арстерных изделий, вдали от большинства населения. Имея их там, позволит нам милитаризировать экономику, если большинство людей не осознают ее."
 CHL_produce_fuel_for_our_forces: "Производить топливо для наших сил"
 CHL_produce_fuel_for_our_forces_desc: "В ближайшем будущем нашим силам потребуется много топлива, а в нашей стране есть неиспользованные нефтяные резервы. С нашим недавним расширением экономики мы должны быть в состоянии войти в эти неиспользованные нефтяные резервы и использовать их в полной мере."
 CHL_reform_the_economy: "Реформировать экономику"
 CHL_reform_the_economy_desc: "Наступило время, давайте полностью реформируем экономику с гражданского населения, базирующейся в военном. Сначала люди могут разозлиться, но они поймут, насколько важен этот шаг для страны."
 CHL_consolidate_part_of_the_civilian_economy: "Консолидировать часть гражданской экономики"
 CHL_consolidate_part_of_the_civilian_economy_desc: "Наши расширения в области гражданской экономики, возможно, были слишком много, поэтому мы немного сократим ее, чтобы привлечь другие сектора экономики."
 CHL_invest_heavily_in_the_military: "Инвестировать в армию"
 CHL_invest_heavily_in_the_military_desc: "Со всеми нашими расширениями, это будет примерно время, это достигнет военных. Этот массовый рост инвестиций не только освободит еще большую часть нашей экономики по отношению к военным, но и профессионализировать армию."
 CHL_steel_for_everyone: "Сталь для всех"
 CHL_steel_for_everyone_desc: "Наше огромное увеличение производства стали привело к тому, что многие страны по всему миру с просьбой о нашей стале, и каков наш ответ? Конечно, пусть им это будет, каждый кусочек, сначала приходите сначала подавать. Это очень поможет нашей экономике, так почему бы не сделать это."
 CHL_a_modern_chilean_economy: "Современная чилийская экономика"
 CHL_a_modern_chilean_economy_desc: "Чилийская экономика сейчас сильнее, чем когда -либо благодаря нашим различным реформам и промышленным расширениям. Если мы продолжим идти так, мы почти уверенно станут региональной электростанцией и, возможно, даже глобальной силой, если что -то пойдет правильно."
 CHL_conserve_our_resources: "Сохранить наши ресурсы"
 CHL_conserve_our_resources_desc: "Наши ресурсы драгоценны, они для чилийцев и только чилийцев. Любой, кто хочет кусок наших ресурсов, должен будет заплатить за них большую цену."
 CHL_the_chilean_military_economy: "Чилийская военная экономика"
 CHL_the_chilean_military_economy_desc: "Чилийская экономика в настоящее время официально является военной. Наши военные значительно расширились благодаря всем этим изменениям. Если дела продолжают идти такими, какие они есть сейчас, мы обязательно станем военным энергетическим домом."
 CHL_new_mining_techniques: "Новые методы добычи"
 CHL_new_mining_techniques_desc: "Благодаря всем нашим экономическим и технологическим достижениям, мы сможем использовать новые методы добычи полезных ископаемых, чтобы получить еще больший ресурс для нас, чтобы использовать и получить выгоду."
 CHL_fuerzas_armadas: "Фуэрзас Армадас Чиленас"
 CHL_fuerzas_armadas_desc: "Чилийские вооруженные силы выглядят довольно мрачными, если не сказать больше. Однако мы можем решить эту проблему и довести чилийские вооруженные силы до уровня, который люди никогда не поверили, что это возможно."
 CHL_armada_chilena: "Армада Чилена"
 CHL_armada_chilena_desc: "Армада Чилена является одной из самых сильных в Латинской Америке и континенте в целом. Это Wime, мы продолжаем расширять его, пока наша отрасль не начнет ограничивать нас."
 CHL_keep_up_with_the_south_american_naval_race: "Южноамериканская военно -морская гонка"
 CHL_keep_up_with_the_south_american_naval_race_desc: "Наша страна уже десятилетиями конкурирует с Аргентиной и Бразилией, которая имеет самый доминирующий военно -морской флот в Южной Америке. Пришло время взять эту корону в себя и убедиться, что другие 2 не трогают ее."
 CHL_focus_on_heavy_ships: "Сосредоточиться на тяжелых кораблях"
 CHL_focus_on_heavy_ships_desc: "Тяжелые корабли - ключ к победе военно -морских сражений. Лучше всего уделять им все внимание."
 CHL_focus_on_light_ships: "Сосредоточьтесь на световых кораблях"
 CHL_focus_on_light_ships_desc: "Световые корабли очень дешевы, и наша отрасль более чем способна производить многие из них."
 CHL_expand_our_naval_industry: "Расширить нашу военно -морскую промышленность"
 CHL_expand_our_naval_industry_desc: "Наша военно -морская индустрия в данный момент выглядит не так хорошо. Давайте убедитесь, что стигма изменяется."
 CHL_create_a_carrier_fleet: "Создать флот с носителем"
 CHL_create_a_carrier_fleet_desc: "Ни одна другая южноамериканская страна не имеет перевозчика, поэтому давайте будем первыми, кто сделает это и имеем преимущество над другими."
 CHL_imrpove_our_capital_ships: "Улучшить наши капитальные суда"
 CHL_imrpove_our_capital_ships_desc: "Столицы нашего военно -морского флота могут стать намного лучше, чем сейчас. Давайте доберемся до этого и сделаем это так, чтобы ни один другой капитальный корабль не мог соответствовать нашему."
 CHL_build_a_new_battleship: "Построить новый линкор"
 CHL_build_a_new_battleship_desc: "Наш флот линкора слишком маленький для нашего вкуса. Создание нового расширит его и сделает намного лучше."
 CHL_expand_the_light_cruiser_fleet: "Расширить флот Light Cruiser"
 CHL_expand_the_light_cruiser_fleet_desc: "Наш легкий крейсерский флот маленький и слабый. Это должно быть намного больше и сильнее представлять значительную угрозу для наших врагов."
 CHL_produce_more_submarines: "Производить больше подводных лодок"
 CHL_produce_more_submarines_desc: "Наш сильный фут - это Sub Flee."
 CHL_produce_more_destroyers: "Производить больше эсминцев"
 CHL_produce_more_destroyers_desc: "Чем больше эсминцев, тем лучше. В наших битвах у нас будет больше огневой мощи, и мы обязательно выиграем их с большим количеством эсминцев."
 CHL_a_stronger_navy: "Более сильный флот"
 CHL_a_stronger_navy_desc: "Наш флот намного сильнее, чем он был раньше, наши реформы и изменения оказались довольно успешными. Последний толчок, и мы действительно будем неудержимой военно -морской силой для наших соседей."
 CHL_ejercito_de_chile: "Ejercito Chileno"
 CHL_ejercito_de_chile_desc: "Чилийская армия очень хорошая, особенно по сравнению с нашими соседями. Конечно, это не так много любви, как следовало бы, поэтому мы здесь, чтобы изменить это."
 CHL_expand_our_numbers: "Расширить наши цифры"
 CHL_expand_our_numbers_desc: "Чем больше солдат на поле битвы и вооруженных сил в целом, тем лучше будет."
 CHL_improve_the_quality: "Улучшить качество"
 CHL_improve_the_quality_desc: "Качество нашего подразделения может и будет достигать уровня, которого будут бояться наших врагов."
 CHL_invite_german_advisors: "Пригласить немецких советников"
 CHL_invite_german_advisors_desc: "Немцы очень умны, когда дело доходит до земельной войны, и особенно танков. Их советники значительно улучшат нашу армию."
 CHL_invite_american_advisors: "Пригласить американских советников"
 CHL_invite_american_advisors_desc: "Американцы знают все о своем оружии и вспомогательном оборудовании. Их советники значительно улучшат нашу армию."
 CHL_invite_soviet_advisors: "Пригласить советских советников"
 CHL_invite_soviet_advisors_desc: "Все Советы - все о людях в поле, тем лучше их записка. Их советники значительно улучшат нашу армию."
 CHL_produce_more_equipment: "Производить больше оборудования"
 CHL_produce_more_equipment_desc: "Благодаря американским консультантам мы можем накачать гораздо больше орудий и оборудования и более высокой скоростью."
 CHL_modernize_our_tanks: "Модернизируйте наши танки"
 CHL_modernize_our_tanks_desc: "Немецкие советники снова зарекомендовали себя со своим гением на поле битвы. Искусство танковой войны будет чем -то, что мы будем освоить в кратчайшие сроки."
 CHL_adjust_our_tactics: "Отрегулируйте нашу тактику"
 CHL_adjust_our_tactics_desc: "Наша тактика устарела, как это было доказано советскими советниками, которые мы пригласили. Благодаря им, мы улучшим нашу тактику, чтобы улучшить наши солдаты."
 CHL_improve_our_artillery: "Улучшить нашу артиллерию"
 CHL_improve_our_artillery_desc: "Артиллерия, которую мы имеем сейчас, старая и устаревшая. Мы модернизируем его, чтобы убедиться, что наши враги не смеются над нами на нашу артиллерию, и вместо этого именно мы будем смеяться над нашими врагами."
 CHL_produce_more_motorized: "Производить больше моторизованного"
 CHL_produce_more_motorized_desc: "Моторизованные идут рука об руку с танками и танковой войной. Давайте увеличим наше моторизованное производство, чтобы расширить нашу моторизованную задачу и еще больше улучшить нашу армию."
 CHL_a_modern_army: "Современная армия"
 CHL_a_modern_army_desc: "Наша армия теперь лучше, чем когда -либо благодаря всем изменениям и достижениям, которые мы сделали. Мы обязательно уйдем очень далеко благодаря этому, и наши враги не будут иметь шанса против нашей военной мощи."
 CHL_fuerza_aerea: "Фуерза Аереа"
 CHL_fuerza_aerea_desc: "Чилийские ВВС - это ветвь вооруженных сил, которая все еще находится в стадии создания. Мы можем помочь ускорить его, и мы сделаем именно это, чтобы убедиться, что никто не может доминировать в нас в небе."
 CHL_alliance_with_the_argentines: "Альянс с аргентинцами"
 CHL_alliance_with_the_argentines_desc: "Аргентинцы уже доказали свою мощь в этой области, и наличие их в качестве союзника могло бы служить нам довольно хорошо. Сочетая наши силы, ни у одной другой нации не будет шансов!"
 CHL_joint_military_build_up: "Совместные военные"
 CHL_joint_military_build_up_desc: "Наши военные требуют большой программы наращивания, если мы хотим осуществить наши самые дикие амбиции. Теперь, когда мы находимся в фракции, мы можем объединить наши отрасли и помогать друг другу в этой программе создания."
 CHL_improve_our_numbers: "Улучшить наши цифры"
 CHL_improve_our_numbers_desc: "Чилийские воздушные силы должны быть расширены, наши соседи быстро создают могущественную воздушную силу, и нам нужно построить ее еще более мощную. Мы спешим часть нашего истребителя, даже если это означает, что наши шансы на несчастные случаи могут расти из -за этого."
 CHL_improve_our_fighters: "Улучшить наших бойцов"
 CHL_improve_our_fighters_desc: "Наши бойцы довольно старые и устаревшие. Многие другие страны мира быстро модернизируют своих бойцов, и мы также должны сделать это. Наша истребительная эскадрилья будет той, которой все будут бояться!"
 CHL_purchase_foreign_planes: "Купить иностранные самолеты"
 CHL_purchase_foreign_planes_desc: "Иностранные крупные державы создают свои воздушные силы с впечатляющей скоростью. Было бы глупо не покупать некоторые из их самолетов, даже если нам приходится заключать сделки с определенными мрачными."
 CHL_expand_our_air_bases: "Расширить наши воздушные базы"
 CHL_expand_our_air_bases_desc: "С растущей воздушной силой, нам нужно будет расширить наши воздушные базы, чтобы хранить все наши недавно приобретенные самолеты. Многие из наших воздушных баз по всей нашей стране требуют расширения, так почему бы не воспользоваться возможностью сейчас?"
 CHL_expand_our_airfoce_armament: "Расширить наше вооружение воздуха"
 CHL_expand_our_airfoce_armament_desc: "Наше вооружение посвящено, что наша воздушная сила в лучшем случае миноштана. Нам нужно расширить его и быстро, чтобы поставить страх в сердцах наших врагов, когда они видят наши воздушные силы над их воздушными зонами!"
 CHL_improving_our_CAS: "Улучшение нашего CAS"
 CHL_improving_our_CAS_desc: "Близкая воздушная поддержка - это то, что решает много сухопутных сражений, если мы сможем иметь преимущество в этом секторе, тогда у наших врагов не будет шансов против нас."
 CHL_modernize_our_bombers: "Модернизируйте наших бомбардировщиков"
 CHL_modernize_our_bombers_desc: "Бомбардировщики - это то, что уничтожает врага, это то, что поражает истинный страх среди гражданских лиц и военных, это то, что выиграет нам любую войну, которую мы могли бы иметь в будущем! Чем более современные наши бомбардировщики, тем ущерб MROE мы сможем нанести!"
 CHL_focus_on_naval_bombers: "Сосредоточьтесь на военно -морских бомбардировщиках"
 CHL_focus_on_naval_bombers_desc: "Война в море не должна быть просто с судов, мы также можем добавить несколько военно -морских бомбардировщиков, чтобы получить преимущество. Если у нас есть технологическое превосходство над врагом, то ни один флот не должен быть угрозой для нас."
 CHL_professional_chilean_pilots: "Профессиональные чилийские пилоты"
 CHL_professional_chilean_pilots_desc: "Наши пилоты уже известны по всему миру как одни из лучших, и мы обязательно сохраним этот титул в наших руках. Мы расширим количество тренировок для наших пилотов. Чем лучше пилоты, тем лучше наши воздушные силы, просты."
 CHL_produce_more_bombers: "Производить больше бомбардировщиков"
 CHL_produce_more_bombers_desc: "Бомбардировщики - это то, что уничтожает врага, это то, что поражает истинный страх среди гражданских лиц и военных, это то, что выиграет нам любую войну, которую мы могли бы иметь в будущем! Чем больше бомбардировщиков у нас есть в нашем распоряжении, тем больше ущерба мы нанесем нашему врагу!"
 CHL_produce_more_CAS: "Производить больше CAS"
 CHL_produce_more_CAS_desc: "Близкая авиационная поддержка-это то, что диктует наземные сражения в течение дня, и наличие преимущества в этом секторе обязательно вызовет наши победы против врага, если это когда-либо произойдет."
 CHL_create_a_powerful_naval_air_fleet: "Создать мощный военно -морской флот"
 CHL_create_a_powerful_naval_air_fleet_desc: "Если мы сможем стать одной из первых стран на планете, которая будет иметь и поддерживать военно -морской флот с перевозчиками и военно -морскими бомбардировщиками, то мы будем непреодолимы в морях!"
 CHL_divert_production_for_heavy_fighters: "Отвратить производство для тяжелых бойцов"
 CHL_divert_production_for_heavy_fighters_desc: "Тяжелые бойцы - это все, что есть, но лучше. Существует ни разум, чтобы не начать производить этих зверей, и наличие таких зверей в нашем распоряжении даст нам преимущество в любом конфликте."
 CHL_a_modern_air_force: "Современные ВВС"
 CHL_a_modern_air_force_desc: "После многих реформ и модернизации нашей авиации мы можем с уверенностью сказать, что наша воздушная сила является современной и с тем, чтобы считаться. Наши враги будут сжиматься в страхе, когда они видят мощь нашей современной воздушной силы, а затем мы действительно будем сиять на этой планете."
 CHL_balanced_social_classes: "Ваши социальные классы были полностью сбалансированы"
 CHL_people_demanding_social_class_balancing: "Баланс социальных классов"
 CHL_people_demanding_social_class_balancing_desc: "Чилийский народ имел это с расслабленным правительством и не адажает самую серьезную проблему, которая сдерживает страну, это проблема с социальными классами и балансом сил. Если ничего не сделано быстро, то люди встанут!"
 CHL_the_second_war_of_the_pacific: "Вторая война Тихого океана"
 CHL_the_second_war_of_the_pacific_desc: "Эти чертовы ублюдки пробуют это еще раз, на этот раз они хотят отомстить за нашу победу в первой войне Тихого океана. Они проиграют еще раз, и мы будем победить!"
 CHL_focus_fully_on_the_war: "Полностью сосредоточиться на войне"
 CHL_focus_fully_on_the_war_desc: "Нам нужно сосредоточить все наше внимание на этой войне, если мы хотим победить во второй раз. Перу и Боливия не дурачны, и будет очень сложно взять их и победить."
 CHL_try_to_gain_foreign_support: "Попробуйте получить иностранную поддержку"
 CHL_try_to_gain_foreign_support_desc: "Нам нужно собрать как можно больше иностранной поддержки. С этой поддержкой мы сможем попросить других стран добровольцев, чтобы помочь нам в наших военных усилиях."
 CHL_mobilize_desperately_our_reserves: "Отчаянно мобилизуйте наши резервы"
 CHL_mobilize_desperately_our_reserves_desc: "Эта война требует гораздо большей армии, чем то, что у нас в настоящее время есть, поэтому мы будем стремиться как можно быстрее мобилизовать резервы, и на нашем земле."
 CHL_draw_up_war_plans: "Нарисовать военные планы"
 CHL_draw_up_war_plans_desc: "Теперь, когда Frontlien закрепился, мы можем начать составлять будущие планы военных действий, чтобы убрать Боливию и Перу."
 CHL_launch_war_plan_rojo: "Запустить план войны Rojo"
 CHL_launch_war_plan_rojo_desc: "Время убрать Перу одним качелем. С ними из парка этот WA будет бризом."
 CHL_launch_war_plan_verde: "Запустить план войны Верде"
 CHL_launch_war_plan_verde_desc: "Время убрать Боливию за один раз; С ними из парка этот WA будет бризом."
 CHL_expand_our_conscription: "Расширить наш призыв"
 CHL_expand_our_conscription_desc: "Наш призыв на данный момент недостаточно, нам нужно расширить, чтобы никогда не преодолеть рабочую силу."
 CHL_victors_of_the_second_war_of_the_pacific: "Победители второй войны Тихого океана"
 CHL_victors_of_the_second_war_of_the_pacific_desc: "Мы сделали это, мы вышли победителями во второй раз. Эти Warmongerers получили то, что они заслуживают, и теперь они больше не будут беспокоить нас."
 CHL_prepare_to_act_against_the_coup: "Приготовьтесь действовать против переворота"
 CHL_prepare_to_act_against_the_coup_desc: "Наш суверенитет подвергается риску этими чертовами Нацистами. Мы не можем допустить, чтобы это произошло, поэтому мы будем вести себя, когда они это сделают, и останавливаем их в их следах!"
 CHL_side_with_the_nacistas: "Сторона с Нацистами"
 CHL_side_with_the_nacistas_desc: "Движение Nacista в последнее время набирает большую часть тяги, и их идеалы звучат довольно убедительно. Может быть, мы должны дать ему шанс и следить за стопами Отец."
 CHL_calm_down_the_people: "Успокаивать людей"
 CHL_calm_down_the_people_desc: "Люди злится на наше быстрое расширение. Мы должны стараться изо всех сил, чтобы успокоить их и не допустить, чтобы трагедия произошла."
 CHL_crush_the_nacistas: "Сокрушить нациста"
 CHL_crush_the_nacistas_desc: "Нациста представляют угрозу для нашей великой нации, их крайние идеалы разрушат нацию. Мы не можем допустить, чтобы это произошло!"
 CHL_expand_the_welfare_plans: "Расширить планы социального обеспечения"
 CHL_expand_the_welfare_plans_desc: "Наша нынешняя система социального обеспечения очень не хватает, и она сильно разделяет каждый из наших соответствующих социальных классов. С новыми и улучшенными планами социального обеспечения мы можем изменить это и решить эту проблему, которая так долго сдерживает нас."
 CHL_take_over_various_government_positions: "Занять различные государственные должности"
 CHL_take_over_various_government_positions_desc: "Если мы хотим расширить наше движение до каждого уголка страны, нам придется занять различные должности внутри правительства. С нашей нынешней поддержкой это должно быть очень легко."
 CHL_take_over_via_blood: "Захватить кровью"
 CHL_take_over_via_blood_desc: "Ясно, что это нынешнее правительство не позволит нам жить, поэтому наш единственный выбор - пойти по кровавому пути. Если это то, что они хотят, то они получат это!"
 CHL_gather_support: "Соберите поддержку"
 CHL_gather_support_desc: "Наше движение будет услышано по всей стране, каждый должен поддержать нас в нашем деле и присоединиться к нам, когда мы запустим восстание!"
 CHL_supress_the_communists: "Подавить коммунистов"
 CHL_supress_the_communists_desc: "Идея коммунизма распространяется очень быстро, особенно среди бедных. Нам нужно остановить это, прежде чем он выйдет из -под контроля."
 CHL_disband_communist_generals: "Распустить коммунистические генералы"
 CHL_disband_communist_generals_desc: "Говорят, что некоторые генералы в нашей армии выступают за идею коммунизма и пытаются бросить наше правительство под автобус. Мы не допустим этого ни при каких обстоятельствах, и поэтому они будут быстро исключены из армии."
 CHL_anti_communist_propaganda: "Антикоммунистическая пропаганда"
 CHL_anti_communist_propaganda_desc: "Нам нужно показать людям, что коммунизм не является решением, поэтому мы будем использовать наш нынешний статус Полтиика и власть для распространения пропаганды и убеждения людей."
 CHL_convince_neutral_generals: "Убедить нейтральных генералов"
 CHL_convince_neutral_generals_desc: "Есть различные генералы, которые в настоящее время аполитичны, и мы могли бы очень использовать их мозг в нашей войне, поэтому мы убедим их и заставим их присоединиться к стороне Нациста."
 CHL_secure_santiago: "Безопасно Сантьяго"
 CHL_secure_santiago_desc: "Сантьяго - это сердце Чили, это промышленный и экономический эпицентр нации. Если мы сможем контролировать это, то наше восстание будет успешно!"
 CHL_assasinate_arturo: "Ассасинат Артуро"
 CHL_assasinate_arturo_desc: "Пришло время привести наши планы в движение, и для этого нам нужно ассировать нынешнего президента. Такой подвиг приведет к разрушению основания этой самой нации, и наше захват власти станет намного проще."
 CHL_secure_our_defenses: "Обеспечить нашу защиту"
 CHL_secure_our_defenses_desc: "Правительство не сдерживает удар, и, как ему нравятся, нам, возможно, нужно немного быть в обороне. Мы сосредоточим наше внимание и ресурсы на просто защиту."
 CHL_seize_the_national_highways: "Захватить национальные автомагистрали"
 CHL_seize_the_national_highways_desc: "Национальные автомагистрали соединяют нацию сверху донизу. Использование контроля над ними задушит ресурсы правительства, что даст нам лидерство в гражданской войне."
 CHL_switch_to_a_military_economy: "Переключиться на военную экономику"
 CHL_switch_to_a_military_economy_desc: "В настоящее время нам нужно мобилизовать нашу экономику на многое, если мы хотим идти в ногу с требованиями этой войны."
 CHL_infliltrate_the_enemy: "Задувать врага"
 CHL_infliltrate_the_enemy_desc: "Враг может быть сильным, но у нас есть что -то в нашем рукаве, что он никогда не сможет предсказать. Мы проникнем в северные штаты и вызваем там небольшое восстание. Как только это будет сделано, у нас наверняка будет преимущество!"
 CHL_mobilize_militias: "Мобилизовать ополченцы"
 CHL_mobilize_militias_desc: "Пришло время мобилизовать ополченцы. Больше не нужно играть, давайте выиграем эту войну раз и навсегда."
 CHL_take_over_via_diplomacy: "Охватить дипломатию"
 CHL_take_over_via_diplomacy_desc: "Нет необходимости в том, чтобы проливаться кровь, мы можем мирно захватить. Мы не только продемонстрируем, что мы представляем лучшие идеалы, но и возьмем под контроль нацию."
 CHL_form_the_apl: "Сформировать APL"
 CHL_form_the_apl_desc: "APL (сокращение для Alianza Popular Libertadora) была коалицией различных правых партий в Чили в подготовке к выборам 1938 года. Эта коалиция потребуется, если мы захотим делать все мирно."
 CHL_continue_with_the_coup: "Продолжать переворот"
 CHL_continue_with_the_coup_desc: "Нам нужно показать этому нынешнему правительству, что удивление нашей политической партии неприемлемо. Вот почему мы послушаем некоторых из наших членов, продолжим переворот и свергнем это правительство тирана."
 CHL_win_via_elections: "Выиграть на выборах"
 CHL_win_via_elections_desc: "Переворот не является решением, мы знаем, что можем выиграть, используя самую систему, которую наложили демократы. Мы распределим наше движение и идеалы для каждого чилийца, и тогда мы обязательно выиграем их голос."
 CHL_win_support_in_the_provinces: "Выиграть поддержку в провинциях"
 CHL_win_support_in_the_provinces_desc: "Нам нужно распространять наши идеалы на чилийцах в каждой провинции. При этом у нас будет гораздо больше шансов на победу на выборах и захват нации!"
 CHL_speak_out_against_the_government: "Выступать против правительства"
 CHL_speak_out_against_the_government_desc: "Мы можем не только получить большее количество последователей, распространяя пропаганду о нашей идеологии, но мы можем сделать это так же, выступая против правительства и дав им плохую репутацию."
 CHL_garner_mass_support: "Собственная массовая поддержка"
 CHL_garner_mass_support_desc: "Людям Чили, ты нужен нам! Волновые флаги, возьмите улицы, покажите всем настоящую чилийскую идеологию, покажите всем, из чего мы действительно сделаны!"
 CHL_weaken_the_central_government: "Ослабить центральное правительство"
 CHL_weaken_the_central_government_desc: "Если мы хотим, чтобы наш переворот был успешно, нам нужно ослабить само правительство. С ослабленным правительством, захват нации будет легко."
 CHL_march_on_the_seguro_obrero: "Марш на Сегуро Обреро"
 CHL_march_on_the_seguro_obrero_desc: "Мы закончили все необходимые подготовки к перевороту, пришло время опрокинуть айсберг и привести весь процесс в движение. Мы возьмем Сегуро Обреро, одно из самых важных зданий нации. С контролем над этим правительство быстро сдадится нам."
 CHL_speed_election_process: "Ускорить процесс выборов"
 CHL_speed_election_process_desc: "Нам нужно ускорить процесс выборов, чтобы мы могли встретиться с другими нациями и приблизить нашу нацию к величию!"
 CHL_win_the_1937_parliamentary_elections: "Парламентские выборы 1937 года"
 CHL_win_the_1937_parliamentary_elections_desc: "Парламентские выборы проводятся на 37, и это может дать нам огромный шанс получить большую власть в правительстве. Мы можем проиграть, но мы можем выиграть, так что здесь действительно не проиграть."
 CHL_use_nationalism_to_win_votes: "Используйте национализм, чтобы выиграть больше голосов"
 CHL_use_nationalism_to_win_votes_desc: "Наши идеалы вращаются вокруг национализма, поэтому мы можем очень легко злоупотреблять национализмом в наших интересах. Дайте гордость народу Чили, в то же время набирая еще больше голосов. Этот бюллетень обеспечен, нам больше не нужно беспокоиться!"
 CHL_victory_for_nacismo: "Победа для Нацизма"
 CHL_victory_for_nacismo_desc: "Мы сделали это, наконец, мы находимся у власти в великой стране Чили. Далее, так это несколько реформ, военное накопление и поражение страха нашим соседям! Чили станет региональной властью, а затем глобальной сверхдержавой!"
 CHL_begin_mass_mobilization: "Начните массовую мобилизацию"
 CHL_begin_mass_mobilization_desc: "Время ранней фазы наших реформ, расширение армии. Мы будем мобилизовать всех людей в каждом уголке нации, все, на что способны служить чилийской армии. Те, кто не получит ничего, кроме абсолютного худшего наказания!"
 CHL_begin_preperations_for_uprising: "Начните подготовку к восстанию"
 CHL_begin_preperations_for_uprising_desc: "По -настоящему ясно, что мы ничего не сделаем с помощью дипломатии, поэтому давайте вместо этого пойдем по более грязным маршруту. Тот, который потребует смерти многих, но обеспечит светлое будущее для Чили. Наше восстание будет одним, чтобы помнить, и то, что будет в сердцах каждого числа!"
 CHL_prepare_the_navy: "Подготовьте флот"
 CHL_prepare_the_navy_desc: "Наш флот - один из наших самых сильных моментов в наших вооруженных силах"
 CHL_conquer_bolivia: "Завоевать Боливию"
 CHL_conquer_bolivia_desc: "У Боливии есть много ценных ресурсов, которые мы могли бы очень использовать в наших интересах. Они не будут сражаться с нашими вооруженными силами!"
 CHL_make_use_of_bolivias_tungsten: "Используйте вольфрам Боливии"
 CHL_make_use_of_bolivias_tungsten_desc: "Боливия заполнена до краев вольфрамами, очень ценным ресурсом, который можно использовать для артиллерии. Мы воспользуемся таким обильным ресурсом настолько, насколько это возможно."
 CHL_calm_the_people: "Успокойте людей"
 CHL_calm_the_people_desc: "Люди очень злятся на наше быстрое расширение, и на то есть веские причины. Тем не менее, мы должны объяснить им, что такое быстрое расширение приведет к великой империи и мощной нации, которая абсолютно никогда не развалится!"
 CHL_prepare_for_the_brazilian_invasion: "Подготовиться к бразильскому вторжению"
 CHL_prepare_for_the_brazilian_invasion_desc: "Бразильцы очень сильны, и чтобы победить их, нам нужно будет сделать определенные приготовления, прежде чем совершить наши первые атаки. Такие вещи, как оборудование и солдат -моральный дух, должны быть проверены, прежде чем мы запустим это амбициозное вторжение."
 CHL_prepare_the_army: "Подготовьте армию"
 CHL_prepare_the_army_desc: "Армия определенно может быть вытеснена за пределы его предела, и нам нужно сделать так, если мы когда -нибудь мечтаем о том, чтобы победить такие полномочия, как Соединенные Штаты или Испания."
 CHL_push_past_the_darien_gap_euyl: "Протолкнуть промежуток"
 CHL_push_past_the_darien_gap_euyl_desc: "Darién Gap - это небольшой коридор леса, отделяющий Центральную Америку из Южной Америки. Этот небольшой участок леса окажутся большим испытанием, но не невозможным. Мы покорим его вместе с окружающими его нациями!"
 CHL_conquer_central_america: "Завоевать Центральную Америку"
 CHL_conquer_central_america_desc: "Центральная Америка стоит на пути нашего истинного врага, это всего лишь простой контрольно -пропускной способности, и с ним нужно решать. Если они вынесут любую форму боя, мы просто раздавим ее нашими вооруженными силами!"
 CHL_take_out_the_usa: "Выньте США"
 CHL_take_out_the_usa_desc: "Побережье ясно, наша армия готова, наш флот лучше, чем когда -либо, и наши солдаты более чем готовы решить проблему, который их ждет. Это не будет легким подвигом, но это абсолютно выполнимо, и мы докажем столько же!"
 CHL_make_an_effort_to_stabilize_the_nation: "Приложить усилия, чтобы стабилизировать нацию"
 CHL_make_an_effort_to_stabilize_the_nation_desc: "Наша политика в настоящее время повсюду, и наша страна быстро отталкивается. Нам нужно будет накачать больше ресурсов, чем ожидалось, чтобы держать нацию на плаву, и мы должны убедиться, что наша страна остается стабильной среди хаоса, который в настоящее время продолжается."
 CHL_cooperate_with_el_frente: "Сотрудничать с Эль Френте"
 CHL_cooperate_with_el_frente_desc: "Популярные Френте доказали свое политическое доминирование, даже больше, чем нынешнее правительство. Сотрудничество с ними кажется наиболее очевидным выбором, и это выбор, которым мы будем совершать."
 CHL_victory_for_the_fp: "Победа для FP"
 CHL_victory_for_the_fp_desc: "Популярный Френте вышел победителем в голосовании, и благодаря этому мы сейчас отвечаем за нацию. Пришло время исправить все ошибки, которые предыдущее правительство имеет, и привести Чили к величию!"
 CHL_approach_the_soviets: "Приблизиться к Советам"
 CHL_approach_the_soviets_desc: "Советы - это электростанция, промышленно и миолета. Мы определенно можем выучить у них много вещей, поэтому приближение к ним полиции не кажется плохой идеей."
 CHL_fund_infrastructure_works: "Фонд инфраструктурных работ"
 CHL_fund_infrastructure_works_desc: "Наши дороги не самые лучшие, и могут использовать некоторую модернизацию. Соединение страны должно быть нашим главным приоритетом."
 CHL_cave_to_the_rich: "Пещера богатым"
 CHL_cave_to_the_rich_desc: "Богатые очень сильны, они управляют большинством чилийских предприятий и несут ответственность за великое большинство нынешней экономики. Певавка к ним может быть хорошим решением некоторых наших проблем."
 CHL_modernize_the_slum_road_network: "Модернизируйте сеть трущоб дорожной"
 CHL_modernize_the_slum_road_network_desc: "В трущобах есть, ну, в значительной степени несуществующая дорожная сеть, но мы могли бы использовать это в наших интересах. Мы можем инвестировать в их дорожные сети, не стоить слишком дорого, и повысить наши текущие отношения с нижним классом."
 CHL_soviet_arms_industry: "Советская индустрия оружия"
 CHL_soviet_arms_industry_desc: "Эксперты в настоящее время отвечают за фабрику вооружений, управляемой советом, и они будут возглавлять нашу заводу оружия, чтобы стать лучшей в Латинской Америке."
 CHL_purchase_soviet_tanks: "Купить советские танки"
 CHL_purchase_soviet_tanks_desc: "Советы были недавно производимыми массовыми танками, и они обязательно будут иметь дополнительные просто лежать там. Они, вероятно, будут более чем готовы продать нам эти танки."
 CHL_join_the_comintern: "Присоединяйтесь к Коминтерну"
 CHL_join_the_comintern_desc: "Мы должны присоединиться к самой сильной силе коммунизма, если хотим выжить в суровом капиталистическом мире, в котором мы живем."
 CHL_spread_propaganda_to_the_people: "Распространять пропаганду людям"
 CHL_spread_propaganda_to_the_people_desc: "Какое -то остальное правительство в истории человечества каким -то образом распространило пропаганду, форму или форму, так почему же и не так?"
 CHL_establish_plentiful_farmlands: "Создать обильные сельскохозяйственные угодья"
 CHL_establish_plentiful_farmlands_desc: "Чили может стать сельскохозяйственной электростанцией. Несмотря на то, что мы окружены Андами, есть много участков, которые можно культивировать, и мы сделаем именно это."
 CHL_continue_with_the_compromise: "Продолжить с компромиссом"
 CHL_continue_with_the_compromise_desc: "Компромисс, который мы поступили с демократами, в котором говорится, что мы не перейдем к какому -либо радикализму и не объявляем войны, которые будут расширять нашу территорию, будет восприниматься всерьез и уважать, сейчас и в будущем."
 CHL_embargo_the_germans: "Эмбарго немцев"
 CHL_embargo_the_germans_desc: "Немцы представляли очень серьезную угрозу для глобальной стабильности, поэтому мы должны сделать все возможное, чтобы остановить их, пока не стало слишком поздно."
 CHL_invest_in_the_army: "Инвестировать в армию"
 CHL_invest_in_the_army_desc: "Наши нынешние инвестиции в армию хороши, но мы можем позволить себе увеличить их еще дальше."
 CHL_go_after_germany: "Иди после Германии"
 CHL_go_after_germany_desc: "Немцам слишком долго отпускали крючок. Учитывая наше расстояние, мы не сможем сделать многое, но мы можем, по крайней мере, помочь Советам в их военных усилиях против нацистов."
 CHL_invest_in_our_navy: "Инвестировать в наш флот"
 CHL_invest_in_our_navy_desc: "Наши нынешние инвестиции в военно -морской флот хороши, но мы можем позволить себе увеличить их еще дальше."
 CHL_go_after_japan: "Иди после Японии"
 CHL_go_after_japan_desc: "Япония рапно расширяет свою империю, и по температуру они это делают, они в конечном итоге достигнут нашей береговой линии. Мы должны нанести удар в первую очередь, если мы хотим иметь шанс придерживаться собственных против них."
 CHL_nationalize_our_steel_industry: "Национализируйте нашу сталелитейную промышленность"
 CHL_nationalize_our_steel_industry_desc: "Наша сталелитейная промышленность была бы намного лучше, если бы мы имели прямой контроль над этим, так что мы сделаем именно это. Наши текущие отношения со стальными предпринимателями хороши, поэтому сопротивления не должно быть."
 CHL_expand_the_cominterns_influence: "Расширить влияние Коминтерна"
 CHL_expand_the_cominterns_influence_desc: "Вся Латинская Америка должна изучать величие коммунизма и насколько мощным может стать под коминтерном. Мы обязательно проведем его по всему континенту, на каждый угол и каждому человеку."
 CHL_expand_communism_to_the_continent: "Расширить коммунизм на континент"
 CHL_expand_communism_to_the_continent_desc: "Теперь, когда коммунистические идеалы распространяются и обсуждаются по всей континете, пришло время начать конвертировать эти нации. Те, у кого уже есть прилично крупные коммунисты, будут поддерживать нашу марширующую армию освобождения, и вскоре будет достаточно коммунизма в каждой стране!"
 CHL_the_final_nail_in_the_coffin: "Последний гвоздь в гробу"
 CHL_the_final_nail_in_the_coffin_desc: "У немцев нет большой борьбы с ними, поэтому они больше не являются нашим истинным врагом. На кого мы действительно должны сосредоточить наше внимание, - это американцы. Они являются последним антикоммунистическим бастионом, и если мы разберемся с ними, то распространение коммунизма не будет иметь никаких препятствий."
 CHL_abandon_the_compromise: "Отказаться от компромисса"
 CHL_abandon_the_compromise_desc: "Почему мы должны слушать компромисс, который был подписан более года назад. Сейчас мы у власти, и мы диктуем то, что мы можем и не можем сделать с великой нацией Чили."
 CHL_abandon_the_fp: "Отказаться от FP"
 CHL_abandon_the_fp_desc: "Нам больше не нужна коалиция для поддержания власти, поэтому мы можем отказаться от популярной Френте. Кроме того, формируются различные небольшие группы внутри коалиции, поэтому было бы лучше, если бы мы просто бросили ее."
 CHL_stabilize_our_politics: "Стабилизировать нашу политику"
 CHL_stabilize_our_politics_desc: "Наша политическая среда намного спокойнее, чем было раньше. Мы, наконец, можем сохранить спокойствие и начать стабилизировать нашу политику. Как только это будет сделано, ничто не остановит нас от величия!"
 CHL_focus_on_internal_politics: "Сосредоточиться на внутренней политике"
 CHL_focus_on_internal_politics_desc: "Нам нужно сосредоточить все наше внимание на нашей внутренней политике. Если это слишком из -под контроля, то у нас будут серьезные проблемы."
 CHL_give_winter_clothing_to_our_soldiers: "Дайте зимнюю одежду нашим солдатам"
 CHL_give_winter_clothing_to_our_soldiers_desc: "Для нашего запланированного вторжения в Аргентину мы отправим целевую группу через Патагонию, которая является очень холодным местом. Чтобы бороться с этим, мы дадим нашим солдатам лучшую зимнюю одежду, чтобы помочь им бороться с почти замороженными температурами Патагонии."
 CHL_build_up_the_dockyards: "Создать верфи"
 CHL_build_up_the_dockyards_desc: "Перу может хорошо удержать свои позиции, поэтому нам нужно будет придумать другой способ победить их, и таким образом через океан. Создание наших верфи приведет к более сильному военно -морскому флоту, который будет переоборудовать перуанцев, что в конечном итоге приведет к победе с нашей стороны."
 CHL_economic_cooperation_with_paraguay: "Экономическое сотрудничество с Парагваем"
 CHL_economic_cooperation_with_paraguay_desc: "Мы можем экономически сотрудничать с Paraguay теперь, когда мы являемся союзниками, и обе наши экономики могут извлечь из этого большую пользу."
 CHL_bolster_chilean_nationalism: "Подкрепление чилийского национализма"
 CHL_bolster_chilean_nationalism_desc: "Чилийцы, которые восстают из -за нашего расширения, должны научиться гордиться своей нацией. Пропаганда, флаги, все, что нужно, чтобы повысить этот национализм внутри них и успокоить протесты."
 CHL_the_literary_generation: "Gobernar Es Educar"
 CHL_the_literary_generation_desc: "Чилийское литературное поколение произошло в 1938 году, когда многие авторы начали выражать свою нынешнюю ситуацию в стране. Этот рост в письменной форме может привести ко многим новым ученым и целому новому поколению ярких умов, способных привести эту нацию к величию."
 CHL_expand_our_science_field: "Расширить нашу научную область"
 CHL_expand_our_science_field_desc: "Чилийское научное поле всегда было одним из лучших в Южной Америке, но быть одним из лучших недостаточно. Мы должны быть лучшими, а не только одним из лучших."
 CHL_sell_some_of_our_steel: "Продай часть нашей стали"
 CHL_sell_some_of_our_steel_desc: "Со всей нашей избыточной сталью мы определенно можем позволить себе продавать некоторые за быстрые деньги, чтобы использовать в некоторых из наших промышленных/экономических проектов."
 CHL_reignite_ties_with_the_british: "Царствование связей с британцами"
 CHL_reignite_ties_with_the_british_desc: "Британцы всегда были чрезвычайно сильными, и с силой, с которой нужно считаться. Политически обращаясь к ним политически еще раз принесет нам большую пользу, так как мы сможем выучить у них много великих вещей."
 CHL_recruit_democratic_generals: "Найдите демократических генералов"
 CHL_recruit_democratic_generals_desc: "В то время как хороший кусок наших генералов верен правительству, есть некоторые, которые верят в более экстремальные идеалы. Вот почему нам нужно нанять новых генералов, преданных демократии и народу Чили."
 CHL_ask_the_british_for_loans: "Спросите британцев за кредиты"
 CHL_ask_the_british_for_loans_desc: "С нашими укрепленными связями между нашими народами мы можем попросить британцев о кредитах. Эти кредиты могут оказаться очень полезными для нас в краткосрочной перспективе, поскольку нам нужны все деньги, которые мы можем получить, чтобы стабилизировать нашу нацию."
 CHL_use_the_loans_to_help_the_workers: "Используйте кредиты, чтобы помочь работникам"
 CHL_use_the_loans_to_help_the_workers_desc: "Хорошее использование для денег, которые мы заводили с этими кредитами, - это использование их, чтобы помочь погасить благосостояние среднего класса. При выполнении ОС нам не нужно жертвовать деньгами от любого другого класса."
 CHL_strive_towards_democratic_socialism: "Социал -демократия"
 CHL_strive_towards_democratic_socialism_desc: "Такие нации, как Франция, Австралия и Норвегия, являются социал -демократиями, и все эти народы очень успешно говорят. Если мы хотим повторить этот уровень успеха, мы должны начать копировать их идеалы и принимать добро, игнорируя плох."
 CHL_expand_our_military: "Расширить наши военные"
 CHL_expand_our_military_desc: "Что ждет впереди, неизвестно. Мы не знаем, кто будет на войне, кто будет врагом, который станет союзником, и если мы застрямся между этим столкновением. Из -за этой неопределенности важно, чтобы мы оставались готовыми ко всему, что может прийти на наш путь."
 CHL_deal_with_political_instability: "Иметь дело с политической нестабильностью"
 CHL_deal_with_political_instability_desc: "Теперь, когда мы гораздо более стабильны, чем раньше, мы, наконец, можем начать решать нашу политическую проблему. Настало время, когда наша нация больше не несет бремени политической нестабильности, и что мы, наконец, можем начать долгий путь мира и процветания."
 CHL_armed_neutrality: "Вооруженный нейтралитет"
 CHL_armed_neutrality_desc: "Мы должны прояснить всем, что мы останемся нейтральными, независимо от обстоятельств. Если нация осмеливается угрожать нашему нейтралитету, то они будут встречаться с свирепостью наших вооруженных сил."
 CHL_crush_the_communists: "Сокрушить коммунистов"
 CHL_crush_the_communists_desc: "Коммунизм - это неудачная идеология, он никогда не будет работать. Мы должны убедиться, что наши люди понимают это, поэтому мы активно замолчаем коммунистов в нашей стране. Это будет для их собственного блага."
 CHL_liberty_to_the_people: "Свобода народу"
 CHL_liberty_to_the_people_desc: "Свобода-это данный Богом право, которое не следует забрать ни кем, ни чего-либо. Наши люди заслуживают этого правильно, и они очень будут сохранять это."
 CHL_spread_our_democratic_deals: "Распространите наши демократические идеалы"
 CHL_spread_our_democratic_deals_desc: "Демократия - это будущее, и каждый должен это знать. Свобода выбора и свободы делать и сказать то, что вы хотите, должны быть нормой, и мы сделаем все, что в наших силах, чтобы сделать это."
 CHL_absolute_freedom: "Абсолютная свобода"
 CHL_absolute_freedom_desc: "Больше никаких последствий, больше нет дискриминации, больше нет полицейского гибели, больше насилия. То, что мы создадим, - это общество, где осуществляется абсолютная свобода, где у каждого есть свобода выражать себя любым способом, которым они могут желать."
 CHL_increase_private_property_rights: "Увеличить права частной собственности"
 CHL_increase_private_property_rights_desc: "Частная собственность очень важна в нашей стране, и тот факт, что с ними плохо обращаются, просто неуместен. Мы обязательно увеличим их права и свободы, и дадим владельцам частной собственности больше власти над своей территорией, которую они по праву заработали."
 CHL_privatize_the_companies: "Приватизировать компании"
 CHL_privatize_the_companies_desc: "Нашим компаниям было бы намного лучше, если бы они управляли людьми, а не правительством. Такая свобода приведет к большому экономическому росту и процветанию."
 CHL_achieve_laissez_faire: "Достичь Лайсес-Фаэр"
 CHL_achieve_laissez_faire_desc: "Laissez-Faire-это экономическая система, в которой транзакции между частными группами людей свободны от или практически свободны от любой формы экономического интервенционизма, такой как регулирование и субсидии. Достижение такой системы является проблемой, но в конечном итоге окажется очень успешным."
 CHL_speed_up_the_elections: "Ускорить выборы"
 CHL_speed_up_the_elections_desc: "Нам нужно ускорить процесс выборов, чтобы мы могли встретиться с другими нациями и приблизить нашу нацию к величию!"
 CHL_crush_extremists: "Раздавить экстремистов"
 CHL_crush_extremists_desc: "Чрезвычайные политические идеологии представляют угрозу для нашей свободы и процветания. В то время как при нормальных обстоятельствах мы допустили бы такие идеалы, люди, стоящие за ними, вызывают хаос и нарушают мир, что мы не можем допустить."
 CHL_prepare_to_act_against_the_coup: "Приготовьтесь действовать против переворота"
 CHL_prepare_to_act_against_the_coup_desc: "Nacistas в настоящее время планируют переворот, чтобы свергнуть нынешнее правительство и установить себя в качестве лидеров Nation. Если мы не будем действовать быстро, это будет иметь серьезные последствия для будущего Чили."
 CHL_ask_for_loan_bailouts: "Попросите задолженность"
 CHL_ask_for_loan_bailouts_desc: "Наша экономика не так хорошо, поэтому просить о спасении ссуды не является плохой идеей."
 CHL_4_more_years_of_democracy: "Еще 4 года демократии"
 CHL_4_more_years_of_democracy_desc: "Густаво Росс, лидер Демократической партии Тех, одержал победу на выборах и продолжит привести эту нацию к величию, представляя свободу слова и демократические идеалы!"
 CHL_establish_the_partido_democratico: "Установить Partido Democratico"
 CHL_establish_the_partido_democratico_desc: "Медленно, но верно мы переходили от социалистического государства к демократическому, и мы делаем это официальным для всех. Педро приведет нашу нацию к величию!"
 CHL_invite_british_architects: "Пригласить британских архитекторов"
 CHL_invite_british_architects_desc: "Британцы известны во всем мире многими архитектурными чудесами, поэтому наличие их квалифицированных архитекторов в нашей стране значительно поможет нашим строительным проектам."
 CHL_study_and_purchase_british_guns: "Изучать и покупать британские оружия"
 CHL_study_and_purchase_british_guns_desc: "У британцев есть все виды оружия, а их винтовки являются одними из лучших во всем мире. Мы могли бы приобрести это оружие, а затем изучить его, чтобы улучшить свое собственное оружие."
 CHL_joint_military_training_with_britain: "Совместная военная подготовка"
 CHL_joint_military_training_with_britain_desc: "Оба наша Армейс может улучшиться, если мы начнем проводить совместное обучение. Мы можем выучить британскую тактику и навыки, в то время как англичане могут выучить количество горной войны и некоторую собственную тактику."
 CHL_go_after_the_germans: "Последовать за немцами"
 CHL_go_after_the_germans_desc: "Немцам слишком долго выпустили крючок, пришло время иметь дело с ними силой."
 CHL_ask_for_pitcairn_island: "Попросить остров Питкэрн"
 CHL_ask_for_pitcairn_island_desc: "Остров Питкэрн - это небольшой остров в нескольких сотнях километров от побережья Чили. Остров может служить хорошей постановкой для будущего военно -морского вторжения."
 CHL_develop_the_pitcairn_island: "Развивайте остров Питкэрн"
 CHL_develop_the_pitcairn_island_desc: "Pitcairn довольно недостаточно развит, но это связано с низким населением, которое находится в нем. Это не будет проблемой, так как мы отправим наших лучших работников для создания острова и превратить его в надлежащую постановку."
 CHL_prepare_for_an_amphibious_invasion: "Подготовиться к амфибийному вторжению"
 CHL_prepare_for_an_amphibious_invasion_desc: "Наши солдаты должны быть готовы к вторжению в Японию, мы видели, насколько жестоким может быть сопротивление японцев благодаря американцам, поэтому мы не можем воспринимать это легкомысленно. Мы дадим все!"
 CHL_take_out_the_japanese: "Достать японцев"
 CHL_take_out_the_japanese_desc: "Все приготовления были сделаны, пришло время поставить Японию на свое место и показать миру, что мы можем изменить глобальную сцену."
 CHL_invite_the_ecuadorians: "Пригласить Эквадор"
 CHL_invite_the_ecuadorians_desc: "Эквадор уже давно представлял демократию в Южной Америке, и благодаря их позиции между Колумбией и Перу они обязаны искать союзника. Этот союзник будет нами, и мы с радостью защитим их."
 CHL_look_for_allies_in_the_south: "Ищите союзников на юге"
 CHL_look_for_allies_in_the_south_desc: "Нам нужно расширить наш альянс, просто Эквадора не хватит. Нам понадобятся более сильные союзники, поэтому наш альянс будет уважаться, и наши соседи здесь, на юге Южной Америки, очень сильны."
 CHL_secure_the_patagonian_oil_fields: "Закрепить патагонистские нефтяные месторождения"
 CHL_secure_the_patagonian_oil_fields_desc: "Нефтяные месторождения в Патагонии могут быть проданы за огромную прибыль, прибыль, что значительно увеличило бы нашу экономику. Только барьер на пути - Аргентина, с которой мы будем быстро иметь дело."
 CHL_the_great_patagonian_march: "Великий Патагонский марш"
 CHL_the_great_patagonian_march_desc: "Великий Патагонский марш должен быть тем, кто запомнится в книгах истории, поскольку наши солдаты прорезали всю патагонию и достигнут Атлантики. С такой атакой мы обязательно выбросят аргентинцы с баланса."
 CHL_the_march_to_buenos_aires: "Марш в Буэнос -Айрес"
 CHL_the_march_to_buenos_aires_desc: "Теперь, когда Патагония уходит с дороги, мы можем начать со следующей цели: Буэнос -Айрес. Будучи самым важным городом в Аргентине, очень важно, чтобы мы захватили его на войне и заставляли сдачу аргентинца."
 CHL_the_south_america_science_academy: "Южноамериканская научная академия"
 CHL_the_south_america_science_academy_desc: "Южноамериканская научная академия станет академией одаренных ученых по всей Южной Америке, помогая всем странам развиваться технологически и развиваться как целый континент. Если все пойдет хорошо, мы сможем достичь уровня технологий, которые есть в Европе."
 CHL_establish_a_shared_currency: "Установить общую валюту"
 CHL_establish_a_shared_currency_desc: "Наши нынешние валюты хороши, но инфляция и другие внутренние факторы приводят к тому, что они иногда становятся нестабильными. Установление общей валюты среди всех наших стран поможет решить эту проблему и, в свою очередь, поможет всем нашей экономике одновременно."
 CHL_try_to_purchase_the_patagonia: "Попробуйте купить Патагонию"
 CHL_try_to_purchase_the_patagonia_desc: "С деньгами, которые у нас есть в настоящее время, мы можем просто позволить себе покупку Патагонии. Будет ли аргентинцы отдавать так много территории, до сих пор неизвестно, но, возможно, поддержание хороших отношений с ними может помочь."
 CHL_exploit_the_patagonian_oil: "Эксплуатировать патагонистское масло"
 CHL_exploit_the_patagonian_oil_desc: "Теперь, когда мы контролируем Патагонию, мы можем начать эксплуатировать ее для будущей прибыли и самостоятельного получения. Наличие столько масла будет очень долго в долгосрочной перспективе."
 CHL_integrate_the_patagonia: "Интегрировать Патагонию"
 CHL_integrate_the_patagonia_desc: "Пришло время начать кампанию по интеграции Патагониан, кампанию, направленную на интеграцию всех людей, живущих в Патагонии и преобразовать их в надлежащие чилийцы. Это займет некоторое время и потребует небольшого количества силы, но это будет возможно."
 CHL_take_out_the_bolvians: "Достать боливийцев"
 CHL_take_out_the_bolvians_desc: "Боливийцы должны не более чем ступенька для нас, так как наша армия должна очень легко иметь возможность сокрушить свою армию."
 CHL_exploit_the_venezuelan_oils: "Эксплуатировать венесуэльскую масло"
 CHL_exploit_the_venezuelan_oils_desc: "Венесуэла - это нация, которая была одарена огромным количеством природных ресурсов, одним из тех, кто является нефти. Мы могли бы очень использовать это масло и использовать его для нашей личной выгоды."
 CHL_make_the_bolivian_communnists_pay: "Заставить боливийских коммунистов платить"
 CHL_make_the_bolivian_communnists_pay_desc: "Эти коммунистические ублюдки должны платить за то, что они сделали с людьми. Их действия не останутся незамеченными, а справедливость будет отдано."
 CHL_open_up_ivestments_in_south_america: "Откройте инвестиции в Южную Америку"
 CHL_open_up_ivestments_in_south_america_desc: "Южная Америка является быстро развивающимся центром для инвесторов и всевозможных инвестиций. Не инвестировать в наши соседние страны было бы пустой тратой времени, поэтому нам нужно действовать быстро и приносит пользу как можно больше от этих инвестиций."
 CHL_ban_the_communist_party: "Запретить коммунистическую партию"
 CHL_ban_the_communist_party_desc: "Коммунизм внутри нашей страны больше не может длиться. Просто тот факт, что они даже сейчас существуют, является смущением для нации. Их партия должна быть быстро аннулирована."
 CHL_deal_with_the_political_instability: "Иметь дело с политической нестабильностью"
 CHL_deal_with_the_political_instability_desc: "Теперь, когда мы гораздо более стабильны, чем раньше, мы, наконец, можем начать решать нашу политическую проблему. Настало время, когда наша нация больше не несет бремени политической нестабильности, и что мы, наконец, можем начать долгий путь мира и процветания."
 CHL_sell_the_bolivian_tungsten: "Продать боливийский вольфра"
 CHL_sell_the_bolivian_tungsten_desc: "Мы смогли сильно использовать вольфрамовые шахты Боливии, и в настоящее время мы находимся в избытке ресурса, поэтому давайте продадим все наши дополнительные вольфрама и получим огромную прибыль от него."
 CHL_send_munitions_to_the_germans: "Отправить боеприпасы немцам"
 CHL_send_munitions_to_the_germans_desc: "Немцы преуспевают в войне и продемонстрировали свое доминирование в борьбе. Хотя это может быть не слишком много, мы можем, по крайней мере, продемонстрировать им поддержку, отправив несколько оружия."
 CHL_send_food_to_the_british: "Отправить еду британцам"
 CHL_send_food_to_the_british_desc: "Британцы и британцы почти голодают из -за военно -морских блокад и войны, поэтому, чтобы показать им нашу поддержку, мы должны отправить им немного еды и помочь их людям."
 CHL_study_british_armaments: "Изучить британские вооружения"
 CHL_study_british_armaments_desc: "Британские вооружения являются одним из самых современных на планете. Мы могли бы многому научиться из их изучения."
 CHL_learn_the_ways_of_blitzkrieg: "Узнайте способы блицкрига"
 CHL_learn_the_ways_of_blitzkrieg_desc: "Благодаря Blitzkrieg немцы смогли снять несколько стран в течение всего лишь месяцев. Изучение такой тактики может поставить нас в дмининантную позицию по сравнению с нашими врагами, если у нас когда -нибудь их есть."
 CHL_the_global_defense_pact: "Глобальный договор о защите"
 CHL_the_global_defense_pact_desc: "Поскольку мир сжигает, нам нужен новый нейтральный альянс, который остается вне конфликта, и мы будем лидером такого альянса. Мы продемонстрируем, что мир и процветание - это то, что приводит к величию, а не к войне."
 CHL_recruit_new_allies_in_the_americas: "Найдите новых союзников в Америке"
 CHL_recruit_new_allies_in_the_americas_desc: "Нам нужно расширить нашу фракцию, поэтому давайте ищем союзников вокруг нас. Давайте начнем с Америки, мы обязательно найдем страны, желающие присоединиться к нейтральной фракции."
 CHL_recruit_new_members_across_the_world: "Набирать новых членов по всему миру"
 CHL_recruit_new_members_across_the_world_desc: "Многие страны по всей планете будут готовы присоединиться к нашей фракции, поэтому мы впустим их всех."
 CHL_send_armaments_to_the_soviets: "Отправить вооружения в Советы"
 CHL_send_armaments_to_the_soviets_desc: "С Советами, которые в настоящее время войдут с нацистами, они определенно примут любую помощь, которую они могут получить. Мы отправим им некоторые из наших оружия, чтобы помочь их защитной войне и показать им нашу поддержку."
 CHL_learn_from_the_second_world_war: "Учиться на второй мировой войне"
 CHL_learn_from_the_second_world_war_desc: "Самая смертоносная война в мире, наконец, завершилась, и многое нужно извлечь из нее многому. Мы можем научиться из этого много вещей сами и лучше благодаря этому."
 CHL_exploit_capital_via_factories: "Эксплуатировать капитал через фабрики"
 CHL_exploit_capital_via_factories_desc: "Нам нужно извлечь как можно больше капитала, чтобы позволить себе наши нынешние планы социального обеспечения, и мы можем сделать это с нашими нынешними фабриками. Их производство генерирует много капитала, капитала, который мы можем использовать, чтобы помочь погасить планы социального обеспечения."
 CHL_befriend_the_middle_class: "Подружиться со средним классом"
 CHL_befriend_the_middle_class_desc: "После различных планов благосостояния и правильных бонусов мы можем с радостью сказать, что средний класс на нашей стороне. Это принесет нам много преимуществ для нашей отрасли и, несомненно, очень поможет нам в долгосрочной перспективе."
 CHL_supress_the_nacista_movement: "Подавлять движение Начиста"
 CHL_supress_the_nacista_movement_desc: "Нацисты выходят из -под контроля, и их нужно поместить. Их идеология просто не будет работать в нашей стране, и им нужно изучить это."
 CHL_arrest_various_fascist_leaders: "Арестовать различных фашистских лидеров"
 CHL_arrest_various_fascist_leaders_desc: "Различные фашистские лидеры планировали много вещей, один из которых заставляет нынешнее правительство закрыть экономику. Подобные требования не могут быть разрешены, и мы не позволим им сойти с рук."
 CHL_expel_fascist_generals: "Выбросить фашистских генералов"
 CHL_expel_fascist_generals_desc: "Фашистские генералы пытаются распространять свои идеалы среди своих солдат. Они должны быть вытеснены из вооруженных сил и никогда не разрешают возвращаться."
 CHL_spread_anti_nacista_propaganda: "Распространение пропаганды антинакисты"
 CHL_spread_anti_nacista_propaganda_desc: "Нам нужно, чтобы люди поняли, что назистам пытаются испортить нацию и вызвать хаос. Распространение пропаганды кажется самым логичным курсом действия для достижения такого подвига."
 CHL_advocate_a_compromise_with_the_democrats: "Выступайте за компромисс с демократами"
 CHL_advocate_a_compromise_with_the_democrats_desc: "Демократы хотят, чтобы мы подписывали товарищ, заявив, что мы не будем пытаться распространять наши идеалы на другие страны и не разрушить мир в любом смысле. На данный момент мы должны согласиться с этими Условиями и демократов ясны, что мы здесь не нанесены вреда."
 CHL_speed_elections: "Ускорить выборы"
 CHL_speed_elections_desc: "Нам нужно ускорить процесс выборов, чтобы мы могли встретиться с другими нациями и приблизить нашу нацию к величию!"
 CHL_nationalize_key_industries: "Национализируйте ключевые отрасли"
 CHL_nationalize_key_industries_desc: "Наша отрасль была бы лучше под нашим прямым контролем. С таким контролем мы могли бы не поливать экономический рост и даже контролировать формирование монополии. Экономика будет процветать в рамках этих изменений."
 CHL_spread_the_word_of_communism: "Распространять радикальное слово"
 CHL_spread_the_word_of_communism_desc: "Каждому чилийскому нужно услышать о коммунистической идеологии и о том, как она может помочь многим аспектам нации."
 CHL_continue_with_the_fp: "Продолжить с FP"
 CHL_continue_with_the_fp_desc: "Если мы хотим иметь возможность мирно управлять Чили, то нам нужно продолжить с Frente Popular. Это наш лучший шанс достичь его, и с правильными движениями это может быть определенно сделано."
 CHL_establish_a_comrpomise_with_the_democrats: "Установить компромисс с демократами"
 CHL_establish_a_comrpomise_with_the_democrats_desc: "Демократы хотят, чтобы мы подписывали товарищ, заявив, что мы не будем пытаться распространять наши идеалы на другие страны и не разрушить мир в любом смысле. На данный момент мы должны согласиться с этими Условиями и демократов ясны, что мы здесь не нанесены вреда."
 CHL_speed_up_elections: "Ускорить выборы"
 CHL_speed_up_elections_desc: "Нам нужно ускорить процесс выборов, чтобы мы могли встретиться с другими нациями и приблизить нашу нацию к величию!"
 CHL_win_over_the_vote_of_the_lower_clas: "Выиграть голос нижнего класса"
 CHL_win_over_the_vote_of_the_lower_clas_desc: "Нижний класс довольно много в нашей стране, и их голосование может иметь большое значение в процессе голосования. Мы должны убедиться, что они на нашей стороне, когда это произойдет."
 CHL_win_over_the_middle_class: "Победить в среднем классе"
 CHL_win_over_the_middle_class_desc: "Средний класс является нашим крупнейшим социальным классом, и их голоса могут легко изменить голосование голосования на нашей стороне или против, поэтому нам нужно, чтобы они были на нашей стороне."
 CHL_secure_the_upper_class: "Закрепить верхний класс"
 CHL_secure_the_upper_class_desc: "Высший класс - наш самый мощный класс, претендуя на большую часть национального богатства. Хотя их голоса не так много, было бы хорошо, чтобы они были на нашей стороне."
 CHL_spread_word_of_communism: "Распространять радикальное слово"
 CHL_spread_word_of_communism_desc: "Каждому чилийскому нужно услышать о коммунистической идеологии и о том, как она может помочь многим аспектам нации."
 CHL_return_to_the_pcch: "Вернуться в PCCH"
 CHL_return_to_the_pcch_desc: "PCCH продемонстрировал свое доминирование как до, так и даже во время существования популярного Франта. Нашим лучшим курсом действий было бы сбросить коалицию вместе и вернуться к PCCH"
 CHL_support_the_radicals: "Поддержать радикализм"
 CHL_support_the_radicals_desc: "Мы всегда зависели от правительства, чтобы возглавить нас, но, возможно, нам просто не нужно. Радикалы и радикализм в целом начали распространяться по всей стране, и мы должны слушать их и даже с ними."
 CHL_use_excess_money_to_afford_tax_cuts: "Используйте лишние деньги для снижения налогов"
 CHL_use_excess_money_to_afford_tax_cuts_desc: "Благодаря нашему недавнему экономическому успеху со стороны панамериканского шоссе, мы получили гораздо больше денег, чем то, в что мы инвестировали. Эти дополнительные деньги могут быть использованы, чтобы дополнить снижение налогов, предоставленные высшему классу."
 CHL_spread_anti_fascist_propaganda: "Распространение пропаганды антинакисты"
 CHL_spread_anti_fascist_propaganda_desc: "Нацисты постоянно пытаются нарушить мир в нашей стране, и мы не можем позволить этому продолжить. Нам нужны люди Чили, чтобы понять, что Нацисты не хороши."
 CHL_ban_the_spread_of_fascism: "Запретить распространению фашизма"
 CHL_ban_the_spread_of_fascism_desc: "Пришло время сделать это официальным и запретить любое распространение фашистской идеологии в нашей стране. Мы не можем позволить им получить больше силы, чем у них уже есть."
 CHL_supress_the_fascist_leaders: "Подавить фашистских лидеров"
 CHL_supress_the_fascist_leaders_desc: "Различные фашистские лидеры, в настоящее время отвечающие за партию, стараются изо всех сил уклониться от наших действий и продолжать распространение их идеологии. Нам нужно положить конец им, даже если это требует серьезных действий."
 CHL_prepare_to_act_against_coup: "Приготовьтесь действовать против переворота"
 CHL_prepare_to_act_against_coup_desc: "Наш суверенитет подвергается риску этими чертовами Нацистами. Мы не можем допустить, чтобы это произошло, поэтому мы будем вести себя, когда они это сделают, и останавливаем их в их следах!"
 CHL_befriend_middle_class: "Подружиться со средним классом"
 CHL_befriend_middle_class_desc: "После различных планов благосостояния и правильных бонусов мы можем с радостью сказать, что средний класс на нашей стороне. Это принесет нам много преимуществ для нашей отрасли и, несомненно, очень поможет нам в долгосрочной перспективе."
 CHL_de_stabilize_the_government: "Де-стабилизирование правительства"
 CHL_de_stabilize_the_government_desc: "Если мы хотим, чтобы наша революция работала должным образом, мы должны убедиться, что основное правительство было максимально слабым. Таким образом, они смогут установить только жалкую борьбу с нами."
 CHL_offer_work_to_the_poor: "Предложить работу бедным"
 CHL_offer_work_to_the_poor_desc: "Работа довольно много в нашей стране, и эти люди очень способны работать. Мы откроем отрасли и позволим им работать в них."
 CHL_promise_the_poor_rights: "Обещать плохие права"
 CHL_promise_the_poor_rights_desc: "Бедным нужно помогать, они ужасны, и мы, как правительство, должны сделать все возможное, чтобы помочь им. Мы предоставим им дополнительные права, чтобы обеспечить лучшее качество жизни для несчастного."
 CHL_arm_up_the_people: "Поднимать народа"
 CHL_arm_up_the_people_desc: "Каждый должен взять оружие в революции, чтобы свергнуть правительство и победить их. Каждому чилийскому нужно участвовать в этой борьбе, в будущем страны."
 CHL_win_over_loyalty_of_some_generals: "Победить лояльность генералов"
 CHL_win_over_loyalty_of_some_generals_desc: "Есть различные генералы, которые в настоящее время аполитичны, и мы могли бы очень использовать их мозг в нашей войне, поэтому мы убедим их и заставим их присоединиться к коммунистической стороне. Их верность революции будет иметь решающее значение в будущем."
 CHL_march_over_the_national_congress: "Марш над национальным конгрессом"
 CHL_march_over_the_national_congress_desc: "Пришло время, все приготовления были сделаны, пришло время привести нашу революцию в движение. Национальный конгресс является важным зданием для правительства, поэтому принятие этого, несомненно, заставит пламя революции, и к концу этого мы выйдем победителем."
 CHL_mobilize_all_our_reserves: "Мобилизовать все наши резервы"
 CHL_mobilize_all_our_reserves_desc: "Нам нужно выйти на поле как можно больше резервов, если мы хотим продолжать сражаться в этой войне. Все люди будут служить революции и красному баннеру!"
 CHL_capture_the_reserves: "Захватить резервы"
 CHL_capture_the_reserves_desc: "Правительство держит запас оружия в каком -то около столицы. Нам нужно захватить это оружие и отдать их нашим солдатам, прежде чем это сделают проникшие в правительственные чиновники."
 CHL_focus_on_arms_production: "Сосредоточиться на производстве оружия"
 CHL_focus_on_arms_production_desc: "Наша экономика должна быть полностью сосредоточена на военных усилиях. Мы можем иметь дело с последствиями позже в будущем."
 CHL_boost_soldier_morale: "Повышение боевого духа солдата"
 CHL_boost_soldier_morale_desc: "Наши солдаты должны быть в отличной форме, как физически, так и умственно. Их моральный дух очень важен, и нам нужно, чтобы он всегда был высоко над облаками."
 CHL_establish_the_regime: "Установить режим"
 CHL_establish_the_regime_desc: "После многих смертей и бесчисленных дней борьбы мы наконец вышли победителями. Мы топали над демократами, и теперь мы отвечаем за нацию Чили. Далее, так это десятилетия повышения и роста для нации."
 CHL_exploit_the_intellectuals: "Эксплуатировать интеллектуалов"
 CHL_exploit_the_intellectuals_desc: "В нашем нынешнем населении есть много интеллектуалов, и они могут немного помочь в нашей технологии и убедиться, что коммунизм может достичь каждого уголка планеты."
 CHL_build_up_the_industry: "Создать отрасль"
 CHL_build_up_the_industry_desc: "Наша отрасль довольно хорошо растет в последние несколько лет, но благодаря нашим недавним технологическим улучшениям и более стабильной политике мы можем позволить себе расширить его еще дальше."
 CHL_arm_the_civilians: "Вооружать гражданских лиц"
 CHL_arm_the_civilians_desc: "Каждый мужчина, женщины и даже ребенок должны взять оружие для революции. Начало глобальной анархистской революции впервые началось в Испании и теперь воспроизводилось здесь, в нашей собственной стране. Анархизм должен видеть свет повсюду на планете."
 CHL_recruit_new_generals: "Найдите новых генералов"
 CHL_recruit_new_generals_desc: "Нам нужны новые генералы, чтобы привести наших людей к победе в революции, и Гуранти - создание анархистского государства."
 CHL_seize_the_means_of_transportation: "Захватить средства транспорта"
 CHL_seize_the_means_of_transportation_desc: "Если мы сможем получить средства транспорта перед нашим врагом, то мы сможем гораздо быстрее пройти все части страны во время войны."
 CHL_establish_the_anarchist_council: "Создать анархистский совет"
 CHL_establish_the_anarchist_council_desc: "Несмотря на то, что мы представляем отсутствие полномочий и центрального правительства, организация является неизвестной, чтобы поддерживать, учитывая, что мы сейчас являемся официальным политическим сущностью на планете."
 CHL_integrate_the_patagonian: "Интегрировать Патагонию"
 CHL_integrate_the_patagonian_desc: "Люди Патагонии будут изучать чудеса анархизма и прижимают их, как будто это был ребенок для них. Им может потребоваться некоторое время, чтобы понять, но в конечном итоге это произойдет."
 CHL_the_future_of_anarchy: "Будущее анархии"
 CHL_the_future_of_anarchy_desc: "Будущее по -прежнему очень подходит для нас, поэтому мы должны быть готовы к любому крикумсту, в котором мы можем оказаться."
 CHL_exploit_bolivias_tungsten: "Эксплойт вольфрама Боливии"
 CHL_exploit_bolivias_tungsten_desc: "Боливия известна своими обильными вольфрамовыми шахтами. Теперь, когда мы имеем полный контроль над ними, мы можем использовать их до абсолютного максимума и пользоваться всеми преимуществами, которые принесут нашей экономике."
 CHL_offer_cooperation_with_the_social_classes: "Предложить сотрудничество с социальными классами"
 CHL_offer_cooperation_with_the_social_classes_desc: "Социальные классы нуждаются в нашей поддержке, поэтому вместо того, чтобы активно идти против них, мы должны начать сотрудничать с ними и стремиться к их соответствующим потребностям."
 chile.19.t: "Кто возглавит нашу нацию?"
 chile.19.d: "Через несколько дней прошло с тех пор, как мы поднялись против правительства, возникает вопрос среди нашего населения и высшего звена, кто будет руководить нацией? \ nsome предлагают Хорхе Гонсалесо фон Мареесу продолжать возглавить нацию, так как до сих пор он доказал свое мастерство в качестве лидера и военного тактика всего за эти несколько дней войны. \ Не с другой стороны, некоторые люди предлагают Карлосу Ибанес дель Кампо стать президентом Чили. Фактически, по многим основной причиной подъема состояла в том, чтобы поставить Карлоса к власти чилийской нацистской партии, а не иметь его в качестве лидера, чтобы привести нас к победе в гражданской войне, многие считают смущением к партии, и идея захвата нации. \ n \ n Окончательное решение зависит от вас, так кто приведет Чили к победе?"
 chile.19.a: "Хорхе Гонсалес фон Марес"
 chile.19.b: "Карлос ибаньес дель Кампо"
 chile.15.t: "[FROM.GetName] предлагают союз между нашими анархистскими государствами"
 chile.15.d: "[FROM.GetName] связался с нами, поздравляю нас с нашими завоеванием и с довольно простой, но важной просьбой. Они спрашивают, могут ли наши государства объединиться в одно, чтобы распространять анархизм на каждый угол планеты. Рассуждение \ n \ ntheir довольно просты, анархизм не имеет границ, и, поскольку оба наших государства имеют одинаковую конечную цель, они говорят, почему бы не объединить наши руки, чтобы иметь больше шансов на достижение нашей мечты. \ n \ nshuld мы примем их предложение?"
 chile.15.a: "Безусловно, мир теперь действительно дрожит в страхе!"
 chile.15.b: "Никогда они не представляют истинного анархизма!"
 chile.16.t: "Испанцы приняли наше предложение"
 chiile.16.d: "Анархисты в Испании отреагировали на нас, заявив, что они принимают наше предложение и что наши страны, сразу же вступившие в силу, объединяются на большую долю анархизма и планету в целом."
 chile.16.a: "Большой! Теперь мир увидит силу анархизма!"
 chile.17.t: "Испанцы отказались от нашего предложения"
 chile.17.d: "Анархисты в Испании отказались от нашей просьбы, утверждая, что наш анархизм не является «истинным анархизмом», и, следовательно, наши страны не будут объединяться."
 chile.17.a: "Они увидят нашу силу!"
 chile.1.t: "Чили хочет сформировать сон"
 chile.1.d: "С растущей напряженностью во всем мире Чили хочет обеспечить свою безопасность, установив неагрессивный пакт (СП) со своими соседями. Если принята, эта сделка обещает убедиться, что между вами и Чили не происходит конфликта."
 chile.1.a: "Там не будет войны между нами."
 chile.1.b: "Мы ничего не обещаем!"
 chile.12.t: "[From.GetName] принял!"
 chile.12.d: "[From.GetName] согласился подписать с нами договор о неагрессии."
 chile.12.a: "Пусть это принесет много лет мира."
 chile.13.t: "[From.GetName] отказался."
 chile.13.d: "Переговоры о неагрессионном договоре провалились. Хотя [From.GetName] не заявил, почему, нам кажется довольно ясным."
 chile.13.a: "Они намерены сражаться с нами?"
 chile.2.t: "Чили приглашает нас на их фракцию"
 chile.2.d: "Несмотря на наши различия, Чили обратилась к нам, чтобы пригласить нас на их фракцию. Они хотят сотрудничать с нами, чтобы «держать регион стабильной». Мы должны принять?"
 chile.2.a: "Мы можем извлечь выгоду из такого союза."
 chile.2.b: "Нам не нужно ваше «сотрудничество»."
 chile.3.t: "Аргентина принимает!"
 chile.3.d: "Аргентина также увидела необходимость сотрудничества и решила присоединиться к нам!"
 chile.3.a: "Пусть мы будем работать вместе в лучшем будущем!"
 chile.4.t: "Аргентина отказалась."
 chile.4.d: "Аргентина решила стоять в одиночестве."
 chile.4.a: "Несчастный."
 CHL_the_pan_american_highway_complete: "Панамериканское шоссе"
 CHL_labor_unions_legalized: "Профсоюзы легализованы"
 CHL_workers_strengthened: "Права работника усилился"
 pan_american_highway: "Панамериканское шоссе"
 pan_american_highway_2: "Панамериканское шоссе"
 CHL_fake_press: "Распространение пропаганды"
 CHL_no_more_free_speech: "свободная пресса"
 CHL_highly_divided_social_classes: "Высоко разделенные социальные классы"
 CHL_highly_divided_social_classes_desc: "Социальные рейтинги в Чили были общеизвестно отделены с момента ее независимости. Вы можете перейти из особняков, которые стоили миллионы до грязной трущоб всего в одном блоке. Это серьезное разделение нашего народа слишком долго повредило нашей стране и экономике."
 CHL_prepare_the_people_for_war_idea: "Подготовьте людей к войне"
 CHL_prepare_the_people_for_war_idea_2: "Подготовьте людей к войне"
 chile.5.t: "Чили хочет присоединиться к Коминтерну"
 chile.5.d: "Будучи другим коммунистическим государством, Чили хотела бы присоединиться к нашей фракции и стать нашим союзником. Если мы примем, наша фракция будет иметь точку опоры в новом мире."
 chile.5.a: "Что угодно для другого коммунистического государства!"
 chile.5.b: "Нам больше не нужны обязательства"
 chile.6.t: "Советы принимают!"
 chile.6.d: "Советский Союз принял нас в их фракцию!"
 chile.6.a: "День, чтобы отпраздновать."
 chile.7.t: "Советы отказываются"
 chile.7.d: "К сожалению, Советский Союз отклонил нашу просьбу присоединиться к их фракции."
 chile.7.a: "Наши люди стоят одиноки."
 chile.510.t: "Чили послала ультиматум!"
 chile.510.d: "Сегодня дипломат, представляющий Чили, прислал нам ультиматум. Либо мы даем земли, которые они требуют, разрешаем правительству, благоприятственному чили, управлять нашим государством или столкнуться с войной. Что мы будем делать?"
 chile.510.a: "У них могут быть эти земли, но не более!"
 chile.510.c: "Мы бы предпочли быть под большим пальцем Чили, чем сдавать наши земли ..."
 chile.510.b: "Кто только эти чилийцы думают, что они есть?!"
 chile.511.t: "Аргентина согласилась вернуть Патагонию!"
 chile.511.d: "Сегодня Аргентина согласилась вернуть Патагонию своему законному владельцу!"
 chile.511.a: "День, чтобы отпраздновать."
 chile.512.t: "Аргентина отказывается!"
 chile.512.d: "Аргентина отказалась согласиться с любым из вариантов, которые мы им дали ..."
 chile.512.a: "Большая ошибка"
 chile.512.b: "На втором мышлении ..."
 chile.513.t: "Аргентина представила нам!"
 chile.513.d: "Вместо того, чтобы потерять свои земли или столкнуться с войной, Аргентина решила согласиться установить в их штате правительство, благоприятствующее чили."
 chile.513.a: "День, чтобы отпраздновать."
 chile.410.t: "Чили требует Тьерры дель -Фуэго!"
 chile.410.d: "Чили требует, чтобы мы давали им Тьерру дель -Фуэго. Они утверждают, что это принадлежит им, и они угрожают войне, если мы скажем иначе."
 chile.410.a: "У них есть момент ..."
 chile.410.b: "Мы не даем этим чилийцам на дюйм наших земель!"
 chile.411.t: "Аргентина соглашается с нашими требованиями!"
 chile.411.d: "Аргентина согласилась вернуть нам Тьерру дель -Фуэго!"
 chile.411.a: "Возможно этого недостаточно?"
 chile.412.t: "Аргентина отказалась!"
 chile.412.d: "Аргентинцы считают, что земля «по праву» их и отказывается дать Тьерру дель -Фуэго."
 chile.412.a: "Давайте "передумайся""
 chile.412.b: "На втором мышлении ..."
 chile.8.t: "Чили хочет присоединиться к оси"
 chile.8.d: "Будучи другим фашистским государством, Чили хотела бы присоединиться к нашей фракции и быть нашим союзником. Если мы примем, наша фракция будет иметь точку опоры в новом мире."
 chile.8.a: "Вместе мы будем сильными!"
 chile.9.b: "Нам больше не нужны обязательства"
 chile.9.t: "Немцы принимают!"
 chile.9.d: "Немецкий рейх принял нас в их фракцию!"
 chile.9.a: "День, чтобы отпраздновать."
 chile.91.t: "Немцы отказываются"
 chile.91.d: "К сожалению, немецкий рейх отклонил нашу просьбу присоединиться к их фракции."
 chile.91.a: "Наши люди стоят одиноки."
 CHL_world_oyster_idea: "Мир - наша устрица"
 CHL_aftermath_of_the_great_depression_name: "Последствия Великой депрессии"
 CHL_aftermath_of_the_great_depression_name: "Наша экономика быстро растет благодаря всем реформам, которые мы провели во время Великой депрессии. Будучи одной из первых наций, выходящих из депрессии, ставит нас в гораздо лучшее место, чем большая часть планеты."
 CHL_steel_for_everyone_idea: "Сталь для всех"
 CHL_class_fix_in_progress: "В настоящее время пытается выровнять социальное занятие"
 chile.110.t: "Чили требует наших земель!"
 chile.110.d: "Кажется, что, несмотря на мир, который последовал после войны в Тихоокеанском регионе, Чили вернулась, чтобы потребовать больше наших земель. Требования также влекут за собой уединение любой оставшейся земли к югу от того, что чилийцы хотят стать Аргентиной. Что мы будем делать?"
 chile.110.a: "Какой у нас есть выбор?"
 chile.110.b: "На этот раз Чили не будет так повезло."
 chile.111.t: "Боливия принимает!"
 chile.111.d: "Боливия, понимая, что у них не было шансов против нас, согласилась соблюдать все наши условия!"
 chile.111.a: "Больше земли для наших людей"
 chile.112.t: "Боливия отказывается!"
 chile.112.d: "Боливия отказалась соблюдать любой из наших условий! Разве они ничего не узнали из прошлого раза?"
 chile.112.a: "Давайте напоминаем им"
 chile.112.b: "На втором мышлении ..."
 chile.310.t: "Чили требует наших земель!"
 chile.310.d: "Кажется, что, несмотря на мир, который последовал после войны в Тихоокеанском регионе, Чили вернулась, чтобы потребовать больше наших земель. Что мы будем делать?"
 chile.310.a: "Какой у нас есть выбор?"
 chile.310.b: "На этот раз Чили не будет так повезло."
 chile.311.t: "Перу принимает!"
 chile.311.d: "Перу, понимая, что у них не было шансов против нас, согласилась соблюдать все наши условия!"
 chile.311.a: "Больше земли для наших людей"
 chile.312.t: "Перу отказывается!"
 chile.312.d: "Перу отказался соблюдать любой из наших условий! Разве они ничего не узнали из прошлого раза?"
 chile.312.a: "Давайте напоминаем им"
 chile.312.b: "На втором мышлении ..."
 CHL_balancing_out_the_social_classes: "Уравновешивание социальных классов"
 CHL_balancing_out_the_social_classes_desc: "Пришло время решить эту проблему, которая изнурила нашу страну с момента создания. Это будет стоить нам времени, производства, экономики и нашего общего благополучия нации, чтобы избавиться от этого позора, но это будет более чем стоит того в долгосрочной перспективе."
 CHL_redistribute_the_wealth_of_the_rich: "Перераспределить богатство богатых"
 CHL_adjust_the_upper_middle_class: "Отрегулируйте верхний средний класс"
 CHL_help_out_the_lower_middle_class: "Помогите в нижнем среднем классе"
 CHL_give_out_welfare_plans_to_the_poor: "Раздавать планы социального обеспечения бедным"
 CHL_ejercito_chileno_name: "Эль Эйерсито Чилено"
 CHL_ejercito_chileno_name_desc: "Чилийская армия является одной из самых профессионально обученных армий в Латинской Америке, и она имеет репутацию очень хорошей, несмотря на это довольно маленький размер. Правительство сделает все возможное, чтобы полностью довести армию."
 CHL_land_of_mountain: "Земля гор"
 CHL_land_of_mountain_desc: "Чилийцы привыкли жить в горах, большая часть Чили покрыта Андами. Эта адаптация к горам дает чилийскому солдату преимущество, когда дело доходит до горной войны, чего нет большинства соседних стран. Это может быть очень полезно в будущем, если один из наших врагов также окружен горами."
 CHL_offer_a_compromise_to_the_communists: "Предложить компромисс коммунистам"
 CHL_offer_a_compromise_to_the_communists_desc: "Коммунисты действуют на нервы. Их требования к балансу социальных классов в лучшем случае являются по -детски, но мы не можем просто передать его как ничего. Мы можем попытаться предложить им компромисс и купить нам некоторое время."
 CHL_build_up_the_armories: "Создать Орусположение"
 CHL_build_up_the_armories_desc: "Наши арс -арссохи будут созданы, если мы хотим представить угрозу иностранным державам. Создание арсеналов было бы хорошим первым шагом."
 CHL_prepare_for_an_amphibious_invasion: "Подготовиться к амфибийному вторжению"
 CHL_prepare_for_an_amphibious_invasion_desc: "Нам нужно подготовиться к нашему японскому вторжению, их фашистские идеалы должны быть остановлены. Для этого нам нужно подготовиться в первую очередь."
 CHL_take_out_the_japanese: "Достать японцев"
 CHL_take_out_the_japanese_desc: "Мы готовы взять японцев, они будут остановлены, даже если на это займет годы. С помощью англичан мы будем очищать этот мир от таких крайних идеалов и показать миру свет демократии."
 CHL_purchase_british_ships_focus: "Покупать британские корабли"
 CHL_purchase_british_ships_focus_desc: "Наш военно -морской флот, хотя и хороший, может использовать импульс в своих числах. С нашей экономей мы можем позволить себе купить некоторые из их кораблей, если они позволят нам."
 CHL_efficient_railway_building: "Эффективное железнодорожное здание"
 CHL_efficient_railway_building_desc: "Нам нужно расширить наши железные дороги, особенно если мы хотим догнать Европу, Америку и даже нашу соседку Аргентину. Мы не можем позволить никому обгонять нас."
 CHL_modernize_our_trains: "Модернизируйте наши поезда"
 CHL_modernize_our_trains_desc: "Наши поезда не такие современные, как другие страны, но благодаря этому мы можем скопировать дизайн этих других наций и использовать их для модернизации наших."
  
 BOL_establish_the_department_of_pando: "Создать Департамент Пандо"
 BOL_establish_the_department_of_pando_desc: "Департамент Пандо был основан 24 сентября 1938 года. Правительство Боливии давно считает это место как подходящее для того, чтобы стать департаментом и неотъемлемой частью Боливии, и так было сделано. Мы можем разработать его и извлечь любые ресурсы, которые мы можем найти здесь."
  
 PRU_purchase_czechoslovak_tanks: "Купить чехословацкие танки"
 PRU_purchase_czechoslovak_tanks_desc: "Чехословакия известна тем, что у него есть некоторые из танков высочайшего качества. Наличие некоторых из них в нашем арсенале может быть полезным в случае конфликта."
  
 COL_establish_FNC: "Установить FNC"
 COL_establish_FNC_desc: "FNC (Shork for Ferrocarriles Nacionales de Colombia) была государственной компанией в Колумбии, созданной в 1954 году для просмотра железных дорог страны. Нам понадобится единственная организация, чтобы наблюдать за всеми нашими железными дорогами, если мы хотим, чтобы они были хорошо организованы и актуальны."
 COL_modernize_our_trains: "Модернизируйте наши поезда"
 COL_modernize_our_trains_desc: "Наши поезда не такие современные, как другие страны, но благодаря этому мы можем скопировать дизайн этих других наций и использовать их для модернизации наших."
  
 PRU_build_up_our_railways: "Создайте наши железные дороги"
 PRU_build_up_our_railways_desc: "Наши железные дороги не являются самыми продвинутыми на континенте, поэтому давайте изменим, начиная с сегодняшнего дня."
  
 WHILE_FOCUSING: "При выборе этого фокуса будут следующие эффекты:\n$EFF$"
 benghazi_oil_developed: "Разработаны нефтяные месторождения в Бенгази"
 TREE_FILTER_TOGGLE: "§GЩелчок§! — вкл./выкл. показ дополнительных фильтров"
  
 ARG_construct_the_general_paz: "Построить общий паз"
 ARG_construct_the_general_paz_desc: "Генерал Пас был одним из самых важных проспектов, построенных в Аргентине, отделяющей провинцию из столицы Буэнос -Айреса. Достижение этого разделения обеспечит правильный транзит между ними и поможет экономике."
  
 ARG_establish_ferrocarriles_argentinos: "Установить феррокаррилы Аргентино"
 ARG_establish_ferrocarriles_argentinos_desc: "Fercrocarriles Argentinos была государственной компанией, которая управляла всей аргентинской железнодорожной системой в течение почти 45 лет. Нам понадобится организация, чтобы следить за нашими железными дорогами, если мы хотим должным образом поддерживать их, и наличие государственной компании может просто сделать свое дело."
 ARG_expand_our_railways_in_the_patagonia: "Расширить наши железные дороги в Патагонии"
 ARG_expand_our_railways_in_the_patagonia_desc: "Патагония довольно недостаточно развита, когда дело доходит до железных дорог, но с новым правильным управлением мы можем изменить эту стигму."
 ARG_focus_on_armored_trains: "Сосредоточьтесь на бронированных поездах"
 ARG_focus_on_armored_trains_desc: "Бронированные поезда и поезда в целом - это то, что будет продвигать нации Фоуарда и по -настоящему выделять страну, когда дело доходит до развития. Мы должны убедиться, что мы одна из тех стран."
 ARG_build_railways_in_the_north: "Строить железные дороги на севере"
 ARG_build_railways_in_the_north_desc: "Север всегда был недоразвит в Аргентине, и нам нужно изменить это. Мы можем инвестировать некоторые из наших ресурсов на севере и довести их до приемлемого уровня."
 ARG_modern_railway_system: "Современная железнодорожная система"
 ARG_modern_railway_system_desc: "Наша железнодорожная система наконец достигла уровня, сравнимого с уровнем Европы или даже в Соединенных Штатах, и мы можем конкурировать с некоторыми из самых развитых стран на планете. Наша железнодорожная система может транспортировать людей и ресурсы по всей стране, и наша экономика очень выгодно от этого."
 ARG_efficient_resource_transportation: "Эффективный транспорт ресурсов"
 ARG_efficient_resource_transportation_desc: "С нашими современными железными дорогами и улучшенными методами горнодобывания мы можем объединить их и переносить наши ресурсы по всей стране и соседние страны на молнии, что значительно улучшило бы нашу скорость, эффективность и денежные выгоды от них."
 ARG_invite_german_tank_designers: "Пригласить немецких дизайнеров танков"
 ARG_invite_german_tank_designers_desc: "Немцы доказали свое превосходство на земле со своими танками. Узнав больше об их танках значительно улучшит нашу собственную производство танков."
 ARG_modernize_ruta_40: "Модернизируйте Ruta Nacional 40"
 ARG_modernize_ruta_40_desc: "Ruta Nacional 40 - самая длинная дорога в стране, соединяющая Jujuy с Санта -Крус. Мы будем модернизировать его, чтобы лучше подключиться к северу и югу."
 ARG_invest_in_our_mining_industry: "Инвестировать в горнодобывающую промышленность"
 ARG_invest_in_our_mining_industry_desc: "Горнодобывающая промышленность может быть расширена довольно значительно. У нас есть знания о многих неиспользованных ресурсах в нашей стране, и мы можем использовать и добывать их. Единственная проблема заключается в том, что нам придется инвестировать в нашу горнодобывающую промышленность, чтобы это произошло, поскольку наша горнодобывающая промышленность на данный момент очень слаба."
 ARG_industrialize_the_pampas: "Индустриализировать пампа"
 ARG_industrialize_the_pampas_desc: "Если мы хотим лучше подключить нашу страну, мы должны начать в основе ее и двигаться с севера и юга оттуда."
 ARG_industrialize_the_north: "Индустриализировать север"
 ARG_industrialize_the_north_desc: "Теперь, когда мы улучшили наши дорожные сети в Пампасе, мы можем двигаться на север."
 ARG_expand_jujuy_steel: "Расширить стальные мины Jujuy"
 ARG_expand_jujuy_steel_desc: "С нашими недавно построенными дорогами, соединяющими север, мы можем начать эксплуатировать сталь, найденную в Jujuy, и использовать ее в наших интересах."
 ARG_industrialize_the_south: "Индустриализировать юг"
 ARG_industrialize_the_south_desc: "С установленной сетью Pampas Road, мы можем двигаться на юг и расширить там дорожную сеть."
 ARG_exploit_la_vaca_muerta: "Разработать Вака-Муэрту"
 ARG_exploit_la_vaca_muerta_desc: "Vaca Muerta - это непрерывное плотное нефтяное и сланцевое газовое резервуар, который можно найти в основном в провинциях Neuquen, Mendoza и Rio Negro. Этот огромный резервуар был известен на протяжении десятилетий, и благодаря нашим последним усилиям по индустриализации мы можем использовать этого нетронутого бегемота."
 ARG_improve_mining: "Улучшить наши методы добычи"
 ARG_improve_mining_desc: "Благодаря нашей новой технологии мы можем более эффективно извлекать наши ресурсы, и мы будем воспользоваться большими преимуществами."
 ARG_focus_economy: "Сосредоточиться на экономике"
 ARG_focus_economy_desc: "Нам нужно сосредоточиться на промышленном секторе, если мы хотим избавиться от наших экономических проблем."
 ARG_develop_the_capital: "Развивать капитал"
 ARG_develop_the_capital_desc: "Мы пренебрегали сердцем нашей нации в течение довольно долгого времени, мы изменим это."
 ARG_develop_northern_patagonia: "Развивать северную Патагонию"
 ARG_develop_northern_patagonia_desc: "Теперь, когда мы разработали столицу, мы можем двигаться на юг и начать расширять нашу отрасль в довольно малонаселенном северном парте Патагонии."
 ARG_reduce_public_expense: "Сократить общественный расходы"
 ARG_reduce_public_expense_desc: "Сокращение наших государственных расходов откроет больше денег, чтобы использовать их в других секторах экономики, однако это будет только временно, и нам нужно приложить больше усилий, если мы хотим избавиться от экономического кризиса."
 ARG_restrict_circulation_currency: "Ограничить циркуляцию валюты"
 ARG_restrict_circulation_currency_desc: "Теперь, когда мы снизили наши государственные расходы, мы должны ограничить циркуляцию валюты, чтобы контролировать инфляцию."
 ARG_establish_patriotic_loan: "Установить патриотический кредит"
 ARG_establish_patriotic_loan_desc: "Если мы установим Emprestito Patriotico (испанский для патриотического займа), то мы можем расширить нашу финансовую казнь и, следовательно, расширить нашу экономику за счет некоторых расходов."
 ARG_develop_patagonia: "Развивать остальную часть Патагонии"
 ARG_develop_patagonia_desc: "С северной Патагонией, единственным логическим вариантом - продолжать идти на юг и развивать остальную часть Патагонии."
 ARG_deal_with_depression: "Иметь дело с экономической депрессией"
 ARG_deal_with_depression_desc: "С нашими недавними реформами и экономической стабилизацией, мы, наконец, можем решить сердце проблемы и раз и навсегда избавиться от этого экономического кризиса, который уволил нас в течение последних 7 лет."
 ARG_buenos_aires_university: "Расширить Университет Буэнос -Айреса"
 ARG_buenos_aires_university_desc: "Теперь, когда мы оба исправили нашу экономику и развили часть нашей страны, нам нужны более яркие умы, чтобы сохранить этот рост и темпы развития, а расширение уже всемирно известного университета Буэнос-Айреса-прекрасная возможность, чтобы это произошло."
 ARG_rapidly_mobilize: "Быстро мобилизуется"
 ARG_rapidly_mobilize_desc: "Глобальная угроза надвигается, мы должны подготовиться к тому, что может произойти в ближайшем будущем, и мы должны сделать это быстро."
 ARG_slowly_mobilize: "Медленно мобилизуйте"
 ARG_slowly_mobilize_desc: "Хотя угроза серьезной войны растет с каждым днем, в то время мы не можем заставить нашу экономику в военную экономику, наше население сомневается в наших военных, и мы должны исправить это, прежде чем мы сможем сделать что -либо, связанное с военными."
 ARG_dominate_the_skies: "Доминировать в небе"
 ARG_dominate_the_skies_desc: "Воздух - это путь, если мы выиграем войну в небе, то мы выигрываем войну на земле."
 ARG_dominate_the_land: "Доминировать в земле"
 ARG_dominate_the_land_desc: "Если мы сосредоточимся на земле, то даже если у врага есть преимущество в воздухе и воде, наше превосходство на земле сделает его бесполезным."
 ARG_expand_our_air_bases: "Расширить наши воздушные базы"
 ARG_expand_our_air_bases_desc: "Пришло время расширить наши довольно пренебрежимые воздушные базы, которые усеяны по всей нашей стране."
 ARG_focus_on_fighters: "Сосредоточьтесь на бойцах"
 ARG_focus_on_fighters_desc: "Теперь, когда наши воздушные базы имеют большую мощность, мы можем работать над производством бойцов."
 ARG_focus_on_bombers: "Сосредоточьтесь на бомбардировщиках"
 ARG_focus_on_bombers_desc: "С бойцами приходят бомбардировщики, а с бомбардировщиками приходят разрушения."
 ARG_air_doctrine: "Воздушная доктрина"
 ARG_air_doctrine_desc: "Нам нужно модернизировать нашу тактику в воздухе, если мы хотим сделать наши ВВС страшной силой."
 ARG_modernize_our_motorized: "Модернизируйте наш моторизованный"
 ARG_modernize_our_motorized_desc: "Чтобы быстро перевозить солдат из точки A в пункт B, нам понадобится грозная моторизованная корпорация."
 ARG_produce_more_artillery: "Производить больше артиллерии"
 ARG_produce_more_artillery_desc: "Нам нужно разработать более эффективные способы производства артиллерии, если мы хотим иметь шанс."
 ARG_strive_to_make_our_own_tanks: "Стремитесь сделать наши собственные танки"
 ARG_strive_to_make_our_own_tanks_desc: "Мы не будем зависеть от отрасли других стран, чтобы дать нам свои танки, которые будут плевать на нашу Патрию. Нахуэль - это аргентинский танк, который напоминает Шерман. С этим у нас будет преимущество против наших врагов."
 ARG_improve_our_tactics: "Улучшить нашу тактику"
 ARG_improve_our_tactics_desc: "С новым современным оборудованием появляется новая современная тактика, и нам нужно наверстать упущенное, если мы хотим иметь грозные земельные силы."
 ARG_ready_the_economy_for_war: "Готовить экономику для войны"
 ARG_ready_the_economy_for_war_desc: "Хотя наше население недовольнее наших новых амбиций, когда дело доходит до милитаризации, мы не можем остановиться сейчас. Santa Fe - отличное место для создания вооруженных заводов, чтобы разжечь аргентинскую военную машину."
 ARG_militarize_the_capital: "Милитаризировать столицу"
 ARG_militarize_the_capital_desc: "Столица является самой мощной частью нашей страны, ключом к тому, чтобы стать военной электростанцией, является милитаризацией столицы."
 ARG_militarize_the_northeast: "Милитаризируйте северо -восток"
 ARG_militarize_the_northeast_desc: "С столицей и сердцем, готовыми к войне, пришло время милитаризировать довольно нетронутую часть этой страны. Вдали от крупных городов, это делает северо -восток идеальным местом для размещения наших заводов."
 ARG_raise_military_salary: "Поднимите военную зарплату"
 ARG_raise_military_salary_desc: "Поднимая военную зарплату, мы могли бы убедить часть населения вступить в армию и медленно вернуть доверие населения"
 ARG_spread_military_propganda: "Распространять военную пропаганду"
 ARG_spread_military_propganda_desc: "Мы можем распространять пропаганду, чтобы убедить людей в том, что военные не такие плохие, как кажется."
 ARG_idolize_war_heroes: "Идолизируйте военных героев"
 ARG_idolize_war_heroes_desc: "Идоризирующие военные герои, такие как Сан -Мартин или Мануэль Белграно, могут заставить людей иметь чувство обязательства, когда дело доходит до поддержки армии."
 ARG_warn_about_outside_threat: "Предупредить о наружных угрозах"
 ARG_warn_about_outside_threat_desc: "Мы не самая любимая страна в Латинской Америке, поэтому мы можем использовать это в наших интересах и убедить людей в том, что внешняя угроза может прийти к нам в любое время."
 ARG_gain_back_trust_of_population: "Вернуть доверие населения"
 ARG_gain_back_trust_of_population_desc: "Время, чтобы положить последний гвоздь в гроб, наши усилия до сих пор оказались удовлетворительными. Нам просто нужен последний толчок, чтобы наконец убедить аргентинцев в том, что армия - это нечто хорошее."
 ARG_make_an_effort_to_mobilize: "Приложить усилия, чтобы мобилизовать"
 ARG_make_an_effort_to_mobilize_desc: "Мы должны приложить усилия для мобилизации, и Чако - отличная провинция, чтобы начать наши мобилизующие планы."
 ARG_arm_the_northwest: "Вооружать северо -запад"
 ARG_arm_the_northwest_desc: "Миссии должны быть нашей следующей целевой провинцией, когда дело доходит до наших мобилизационных планов. Его близость к Бразилии и Парагваю является ключевой."
 ARG_ramp_up_infantry_equipment_production: "Увеличить производство пехотного оборудования"
 ARG_ramp_up_infantry_equipment_production_desc: "Нам нужно сделать производство пехотного оборудования дешевле и эффективнее, если мы хотим полностью поставить всех наших солдат."
 ARG_give_out_gifts: "Выдайте подарки"
 ARG_give_out_gifts_desc: "Если мы позволим нашим солдатам отправиться в дом в дом, давая как детям, так и взрослым, мы сможем показать населению, что военные являются силой добра."
 ARG_promise_peace_and_prosperity: "Обещать мир и процветание"
 ARG_promise_peace_and_prosperity_desc: "Обежание нашего населения мира и процветания покажут им, что военные не только хороши, но и мирны, и это, наконец, убедит население, что военные - не то, что они ранее думали."
 ARG_infamous_decade: "Печально известное десятилетие"
 ARG_infamous_decade_desc: "Печально известное десятилетие было периодом в жизни Аргентины, который включал большую неопределенность, когда дело дошло до политики. Люди не знали, что должно было случиться с страной в течение этого времени. Мы подождем и посмотрим."
 ARG_drift_back_towards_the_confederation: "Вернуться к конфедерации"
 ARG_drift_back_towards_the_confederation_desc: "Наше правительство подвело нас, потребовав 7 с лишним лет, чтобы исправить и без того ужасную экономику, позорно. Люди злы, они не хотят слабого правительства, они хотят сильного, который может провести путь, и возвращение к Конфедерации сделает это."
 ARG_secure_the_northern_provinces: "Закрепить северные провинции"
 ARG_secure_the_northern_provinces_desc: "Нам нужно обеспечить первоначальные территории аргентинской конфедерации, чтобы этот план работал."
 ARG_gain_the_support_of_the_population: "Получить поддержку населения"
 ARG_gain_the_support_of_the_population_desc: "Нам нужно получить поддержку местного населения, если мы посмелимся даже начать гражданскую войну."
 ARG_gain_the_support_of_the_workers: "Получить поддержку работников"
 ARG_gain_the_support_of_the_workers_desc: "Нам понадобится промышленный сектор, чтобы быть на нашей стороне, если мы хотим иметь шанс."
 ARG_gain_the_support_of_the_military: "Получить поддержку военных"
 ARG_gain_the_support_of_the_military_desc: "Мы должны получить поддержку нынешних вооруженных сил, чтобы добиться успеха в наших планах."
 ARG_gain_the_support_of_the_high_command: "Получить поддержку высокой команды"
 ARG_gain_the_support_of_the_high_command_desc: "Мы должны получить поддержку высокой команды, чтобы самые яркие умы командировали на поле."
 ARG_etsablish_the_confederation: "Установить Конфедерацию"
 ARG_etsablish_the_confederation_desc: "С гражданской войной, мы можем сосредоточиться на улучшении себя и привести эту страну к величию. Мир будет бояться нас!"
 ARG_viva_la_industria: "Viva La Industria"
 ARG_viva_la_industria_desc: "Чем больше наша экономика, тем лучше будет аргентинское народ."
 ARG_viva_los_militares: "Viva Los Militares"
 ARG_viva_los_militares_desc: "Чем сильнее наши военные, тем больше страха мы нанесем нанесение успеха наших врагов, и, таким образом, мир будет уважать нас."
 ARG_viva_la_educacion: "Viva La Educación"
 ARG_viva_la_educacion_desc: "Чем умнее средний аргентинский является, тем больше прогресс мы сможем достичь и, следовательно, помогать нам разными способами."
 ARG_viva_la_confederacion: "Viva La Confederación"
 ARG_viva_la_confederacion_desc: "Long Live the Confederation!"
 ARG_prepare_for_the_uruguayan_coup: "Подготовиться к аннексии Уругвая"
 ARG_prepare_for_the_uruguayan_coup_desc: "Нам нужно подготовиться, чтобы наша аннексия Уругвая работала. Мы должны взять это медленно, чтобы гарантировать, что никто не вмешивается, по крайней мере, в Старом мире."
 ARG_influence_uruguayan_politics: "Влияние уругвайской политики"
 ARG_influence_uruguayan_politics_desc: "Пришло время начать манипулировать уругвайской политикой. Чтобы наш план работы, нам нужно, чтобы наше сотрудничество было по крайней мере мощной партией в Уругвайской политике."
 ARG_prepare_a_volunteer_force: "Подготовьте добровольную силу"
 ARG_prepare_a_volunteer_force_desc: "Когда мы запускаем переворот в Уругвае, мы должны убедиться, что фашисты выиграли гражданскую войну, и мы можем сделать это, отправив добровольную силу, чтобы помочь в их усилиях. Если фашисты выигрывают войну, то мы должны быть в состоянии мирно приложить Уругвай."
 ARG_launch_the_coup: "Запустить переворот"
 ARG_launch_the_coup_desc: "Все необходимое наращивание было сделано, пришло время организовать переворот в Уругвае. Мы должны делать все возможное, чтобы проаргентинское правительство возродило победу над этой войной, чтобы мы могли мирно аннексировать Уругвай."
 ARG_annex_uruguay: "Приложение Уругвай"
 ARG_annex_uruguay_desc: "После успешного сработавшего переворота мы должны быть в состоянии мирно аннексировать Уругвай без сопротивления и не без угрозы."
 ARG_win_the_second_cisplatine_war: "Вторая цисплатиновая война"
 ARG_win_the_second_cisplatine_war_desc: "Нам нужно привлечь все наше внимание к этой войне. Это золотая возможность показать миру, что мы сильная сила, и мы возьмем этот шанс."
 ARG_militarize_our_economy: "Милитаризируйте нашу экономику"
 ARG_militarize_our_economy_desc: "Нам нужно милитаризировать нашу экономику, чтобы не отставать от требований войны."
 ARG_decimate_the_brazilian_navy: "Разделять бразильский флот"
 ARG_decimate_the_brazilian_navy_desc: "Бразильцы представляют угрозу для нашего военно -морского доминирования, мы должны избавиться от их военно -морского флота как можно скорее, чтобы предпринять свои усилия на море бесполезными."
 ARG_go_through_paraguay: "Пройдите через Парагвай"
 ARG_go_through_paraguay_desc: "С тем, что фронтальные линии, начинающие останавливаться, нам нужно открыть новый фронт, чтобы застать бразильцев врасплох, и пройти через Парагвай почти слишком идеален."
 ARG_adopt_an_expansionist_policy: "Принять экспансионистскую политику"
 ARG_adopt_an_expansionist_policy_desc: "Теперь, когда мы собрали себя и настроили Конфедерацию, мы можем начать расширяться наружу."
 ARG_prepare_the_navy: "Подготовьте флот"
 ARG_prepare_the_navy_desc: "Нам понадобится мощный флот, если мы даже мечтаем бросить вызов англичанам."
 ARG_demand_the_falklands: "Требовать Фолклендс"
 ARG_demand_the_falklands_desc: "Лас Мальины - законная аргентинская глина. Теперь, когда они воюют с немцами, это идеальное время, чтобы выдержать наши позиции и показать британскому боссу в Южной Атлантике."
 ARG_demand_south_georgia: "Спрос Южной Джорджии"
 ARG_demand_south_georgia_desc: "Южная Джорджия является законной Аргентиной Клэй. Поскольку британцы отвлекались на собственную войну, пришло время воспользоваться ситуацией и требовать Южной Георгии."
 ARG_go_a_step_further: "Идти еще дальше"
 ARG_go_a_step_further_desc: "Теперь, когда британцы с относительной легкостью дали нам Фолклендс и Южную Джорджию, я думаю, что пришло время продвигаться дальше и полностью контролируем Южную Атлантику и по -настоящему назвать весь Южный Алантический аргентинский."
 ARG_prepare_the_army: "§3la ambición de san martin§!"
  
 ARG_demand_tarija: "Требование Тариджа"
 ARG_demand_tarija_desc: "Тария исторически была частью Аргентины, и хотя мы потеряли ее много десятилетий назад, с нашей теперь укрепленной армией, мы можем потребовать ее еще раз. Если они отказываются, то мы можем пойти с ними на войну и взять это силой!"
 ARG_demand_florianopolis: "Спрос, Санта -Катарина"
 ARG_demand_florianopolis_desc: "Западная часть Санта -Катарина была исторически частью Аргентинской конфедерации, теряя ее после войны с Платина и с тех пор принадлежала Бразилии. Пришло время показать Бразилии, что теперь мы доминирующая власть в Южной Америке."
 ARG_integrate_the_rest_of_patagonia: "Интегрировать всю патагонию"
 ARG_integrate_the_rest_of_patagonia_desc: "Патагония принадлежит нам, мы контролируем ее большую часть, и мы не можем позволить Чили контролировать остальную часть. Пришло время соединить Тьерру дель -Фуэго с материковой Аргентиной и, наконец, рассмотреть Патагонию действительно аргентинской."
 ARG_proclaim_the_greater_argentine_confederation: "Провозглашать большую аргентинскую конфедерацию"
 ARG_proclaim_the_greater_argentine_confederation_desc: "Мы гораздо более сильная сила, чем то, что мы были всего несколько лет назад. Мы вернули всю территорию, которую хотели, и даже расширились дальше, чем мы ожидали. Пришло время показать миру большую аргентинскую конфедерацию, пришло время раскрыть себя миру как сила, с которой нужно считаться!"
 ARG_join_the_germans: "Присоединяйтесь к немцам"
 ARG_join_the_germans_desc: "Теперь, когда мы находимся на войне с англичанами, было бы довольно разумно работать со страной, которая находится на войне с англичанами."
 ARG_create_our_own_axis: "Создать нашу собственную ось"
 ARG_create_our_own_axis_desc: "Нам не нужна помощь немцев, чтобы пройти через себя, мы можем создать нашу собственную фракцию и царствовать победителем над нашими энемами таким образом, без какой -либо помощи."
 ARG_secure_the_bolivian_tungsten: "Закрепить боливийский вольфра"
 ARG_secure_the_bolivian_tungsten_desc: "Боливия заполнена до краев вольфрамотой, ресурсом, который очень ценен для нас. С нашей улучшенной армией и улучшенной тактикой, мы должны легко справиться с ними и получить ресурсы для себя."
 ARG_avenge_the_platine_war: "Отомстить за войну Платина"
 ARG_avenge_the_platine_war_desc: "Война Платина была войной между Аргентинской конфедерацией и объединенными силами Бразилии и Уругвая. Эта война была для нас потерей, но мы можем это изменить. Мы покажем этим бразильцам раз и навсегда, что они не связываются с нами. Мы победили их один раз, мы можем победить их во второй раз, и на этот раз мы обязательно победим их."
 ARG_subjegate_the_peruvians: "Подчиняться перуанцам"
 ARG_subjegate_the_peruvians_desc: "Чтобы продолжить наши завоевания, нам нужно протолкнуть мимо перуанцев. Будучи защищенным Андами со всех сторон, будет довольно дико, но ничего невозможно."
 ARG_push_past_peru: "Протолкнуть мимо Перу"
 ARG_push_past_peru_desc: "Теперь, когда Перу ушел, мы должны иметь дело с Эквадором и Колумбией. Не должно быть слишком сложным и может получить 2 на 1. Колумбия может быть тем, кто доставит нам немного неприятностей, но наши солдаты должны пройти через свою защиту."
 ARG_secure_the_venezuelan_oil: "Закрепить венесуэльскую масло"
 ARG_secure_the_venezuelan_oil_desc: "Венесуэльцы очень богаты, когда дело доходит до нефти. Их нефтяное резервуар больше, чем на Ближнем Востоке вместе взятых. Доступ к этому обильному маслу поможет нам в долгосрочной перспективе."
 ARG_integrate_our_conquered_lands: "Интегрировать наши завоеванные земли"
 ARG_integrate_our_conquered_lands_desc: "Теперь с обильным количеством территории и населения, последняя проблема, которую мы имеем, - это фактически интегрировать новых людей в нашу страну. Нам нужно будет пожертвовать многими вещами, чтобы справиться с этим, но награда в конце туннеля просто слишком хороша, чтобы сопротивляться."
 ARG_invite_peru: "Пригласить Перу"
 ARG_invite_peru_desc: "Нам нужно расширить нашу фракцию, и Перу - идеальный союзник для нашей новой фракции."
 ARG_invite_venezuela: "Пригласить Венесуэлу"
 ARG_invite_venezuela_desc: "Нам нужно расширить нашу фракцию, и получить Венесуэлу в нашей фракции было бы замечательно."
 ARG_push_past_the_darien_gap: "Протолкнуть промежуток"
 ARG_push_past_the_darien_gap_desc: "Благодаря контролю над Колумбией и Венесуэлой, мы можем начать искать еще дальше, более конкретно, Центральная Америка. То, что стоит между нами и завоевание всего региона, - это разрыв Дариэна, участок леса между Колумбией и Панамой. Это не должно доказывать проблему для наших солдат, и мы сможем пробить."
 ARG_conquer_central_america: "Завоевать Центральную Америку"
 ARG_conquer_central_america_desc: "Теперь, когда у нас есть сильная опора в Центральной Америке, остальная часть региона должна быть бризом. Их армии не должны иметь шансов против наших, и мы будем на шаг ближе к нашей окончательной войне против американцев."
 ARG_the_final_stretch: "Последний отрез"
 ARG_the_final_stretch_desc: "После многих месяцев войны и кровопролития мы наконец -то достигли последнего барьера для нашего окончательного плана. После Мексики ни одна другая страна не будет стоять в нашем пути покорности Америки. Viva La Confederación!"
 ARG_go_for_the_yanks: "Атаковать на источник"
 ARG_go_for_the_yanks_desc: "Американцы были в основе многих вещей, вещей, которые не должны быть разрешены на этой планете. Вот почему нам нужно нацелиться на них и избавиться от них раз и навсегда."
 ARG_fuerzas_armadas_argentinas: "Las Fuerzas Armadas Argentinas"
 ARG_fuerzas_armadas_argentinas_desc: "Теперь, когда люди доверяют нашим вооруженным силам, мы можем сосредоточиться на расширении и модернизации его по порядку, чтобы достичь мировых уровней власти, аналогичных уровням в Европе."
 ARG_la_armada_argentina: "Ла Армада Аргентина"
 ARG_la_armada_argentina_desc: "Ла Армада Аргентина - военно -морская ветвь вооруженных сил. Это было всемирно известно как лучшая во всей латинской и Южной Америке, и пришло время расширить его еще дальше."
 ARG_expand_the_rivadavia_class: "Расширить класс Ривадавии"
 ARG_expand_the_rivadavia_class_desc: "Класс Rivadavia - это модернизированный класс дредноутов, разработанный в Нью -Йорке, и купленный Аргентиной. Это было лучшее в своем классе, и пришло время расширить флот этого бегемота."
 ARG_expand_our_naval_output: "Расширить наш военно -морской выход"
 ARG_expand_our_naval_output_desc: "Если мы хотим конкурировать с военно -морскими державами Европы, то мы должны сосредоточиться на нашем военно -морском производстве дома, если мы хотим достать куда угодно."
 ARG_continue_the_south_amarican_naval_arms_race: "Южноамериканская военно -морская гонка"
 ARG_continue_the_south_amarican_naval_arms_race_desc: "Южноамериканская военно -морская гонка была военно -морской гонкой между 3 латиноамериканскими военно -морскими державами: Аргентина, Чили и Бразилия. Этот конкурс усилил все 3 наших военно -морских сил, и продолжение его улучшит еще больше."
 ARG_outclass_the_chilean_subs: "Превзойти чилийские подводные лодки"
 ARG_outclass_the_chilean_subs_desc: "Чилии всегда выделялись, когда дело дошло до их подводного флота. Пришло время забрать у них эту корону."
 ARG_topple_the_brazilian_destroyers: "Опрокинуть бразильских эсминцев"
 ARG_topple_the_brazilian_destroyers_desc: "У бразильцев есть один, если не лучший флот эсминцев в Латинской Америке. Мы должны превзойти их и убедиться, что их флот эсминца не представляет угрозы."
 ARG_produce_more_submarines: "Производить больше подводных лодок"
 ARG_produce_more_submarines_desc: "Мы должны начать качать подводные лодки, если хотим достичь уровня Чили."
 ARG_produce_more_destroyers: "Производить больше эсминцев"
 ARG_produce_more_destroyers_desc: "Мы должны начать производить больше эсминцев, если мы хотим соперничать с флотом эсминца Бразилии."
 ARG_modern_dockyard_technology_focus: "Современная технология верфи"
 ARG_modern_dockyard_technology_focus_desc: "Достижения в области технологий теперь могут позволить нам производить суда более эффективно."
 ARG_better_ship_building: "Лучшее здание корабля"
 ARG_better_ship_building_desc: "Благодаря лучшей технологии мы можем еще больше улучшить эффективность развития нашего корабля."
 ARG_greatly_increase_the_navy_budget: "Значительно увеличить бюджет флота"
 ARG_greatly_increase_the_navy_budget_desc: "Большое увеличение военно -морского бюджета позволит нам достичь уровней военно -морского производства, как никто никогда не видел. Тем не менее, это произойдет по цене немного пренебрежения основной экономикой и необходимостью сократить бюджет в армии."
 ARG_focus_lightly_on_the_navy: "Слегка сосредоточиться на флоте"
 ARG_focus_lightly_on_the_navy_desc: "Хотя не так много преимуществ, как увеличение нашего бюджета, легкий фокус позволит нам полностью сохранить нашу экономику и все же немного улучшить нашу военно -морскую производительность."
 ARG_focus_on_heavy_ships: "Сосредоточиться на тяжелых кораблях"
 ARG_focus_on_heavy_ships_desc: "Нам нужно расширить наш тяжелый корабль, если мы хотим конкурировать с европейскими военно -морскими державами."
 ARG_expand_our_light_cruiser_fleet: "Расширить наш флот Light Cruiser"
 ARG_expand_our_light_cruiser_fleet_desc: "Световые крейсеры довольно дешевы, и все еще накладывают удар, и мы будем использовать его в полной мере."
 ARG_expand_our_heavy_cruiser_fleet: "Расширить наш тяжелый крейсерский флот"
 ARG_expand_our_heavy_cruiser_fleet_desc: "Хотя тяжелые крейсеры не дешевы, сила, которую они содержат, делает усилия стоящими."
 ARG_build_a_carrier: "Построить перевозчика"
 ARG_build_a_carrier_desc: "У большинства крупных военно -морских держав есть перевозчики, так почему бы не построить перевозчика, чтобы соответствовать им?"
 ARG_create_a_naval_air_fleet: "Создать военно -морской флот"
 ARG_create_a_naval_air_fleet_desc: "С перевозчиком вам нужен воздушный флот, чтобы сопровождать его. Мы построим воздушный флот, как никто другой."
 ARG_imrpove_our_heavy_ships: "Улучшить наши тяжелые корабли"
 ARG_imrpove_our_heavy_ships_desc: "Благодаря новой и передовой технологии мы можем нанести больший удар на тяжелые корабли и убедиться, что ни один другой корабль не может противостоять нашим."
 ARG_design_coastal_defense_ships: "Проектирование прибрежных оборонных кораблей"
 ARG_design_coastal_defense_ships_desc: "Благодаря лучшей технологии и повышению эффективности, мы можем быстро построить прибрежную защиту в случае войны."
 ARG_a_modern_armada_argentina: "Современная Армада Аргентина"
 ARG_a_modern_armada_argentina_desc: "Со всеми нашими недавними событиями, военно -морскими расходами, расширением верфи и модернизированными кораблями мы произвели революцию в Армада Аргентине, превратив ее в серьезную военно -морскую власть в Америке и, возможно, даже во всем мире."
 ARG_el_ejercito_argentino: "Эль Эйерсито Аргентино"
 ARG_el_ejercito_argentino_desc: "Эйерсито Аргентино является армейским филиалом аргентинских вооруженных сил. Это был первый филиал, созданный во время Аргентинских войн за независимость в 1810 году. Будучи одним из старейших в Латинской Америке, до сих пор добилась замечательных достижений, но мы можем добиться большего."
 ARG_quality: "Качество"
 ARG_quality_desc: "Войска лучшего качества являются ключевыми в выигрышных битвах."
 ARG_quantity: "Количество"
 ARG_quantity_desc: "Чем больше войск, тем лучше."
 ARG_improve_our_mechanized: "Улучшить наш механизированный"
 ARG_improve_our_mechanized_desc: "Пришло время отказаться от моторизации и пойти на что -то лучшее и сильное, механизированное."
 ARG_produce_cheaper_motorized: "Производить более дешевые моторизованные"
 ARG_produce_cheaper_motorized_desc: "Какой смысл модернизации, если мы сможем производить моторизованные по более дешевой цене, что позволяет нам штурмовать врага намного проще и быстрее."
 ARG_produce_our_own_tanks: "Производить наши собственные танки"
 ARG_produce_our_own_tanks_desc: "Будучи созданными и разработанными в Аргентине, мы лучше знаем, как производить наши собственные танки, и это даст нам преимущество, когда дело доходит до их производства."
 ARG_modern_artillery: "Современная артиллерия"
 ARG_modern_artillery_desc: "Современная артиллерия позволит нам упаковать больший удар из меньшего количества артиллерии."
 ARG_modernize_our_infantry_equipment: "Модернизируйте наше пехотное оборудование"
 ARG_modernize_our_infantry_equipment_desc: "С современным оружием и оборудованием наши солдаты будут сильнее врага, поэтому, даже если у врага больше людей, у нас все равно будет преимущество."
 ARG_improve_training_tactics: "Улучшение тактики обучения"
 ARG_improve_training_tactics_desc: "Благодаря лучшей тактике обучения, наши войска будут лучше подготовлены к любой ситуации, с которой они могут столкнуться, что позволит нам снова иметь преимущество."
 ARG_rush_training: "Рас тренировка"
 ARG_rush_training_desc: "Зачем нам необходимо обучать наши войска в чрезвычайных деталях? Если они знают, как владеть пистолетом, и они могут стрелять, то они солдат!"
 ARG_produce_cheaper_artillery: "Производствуйте более дешевую артиллерию"
 ARG_produce_cheaper_artillery_desc: "Более дешевая артиллерия позволит нам выкачивать больше артиллерии с более высокой скоростью и сокрушит любую защиту, которую враг может поставить."
 ARG_make_cheaper_equipment: "Сделайте более дешевое оборудование"
 ARG_make_cheaper_equipment_desc: "Создание более дешевого оборудования позволит нам оснастить каждого солдата на переднем крае, чтобы ни один солдат был плохо оборудован."
 ARG_continue_the_doctrine: "Продолжить доктрину"
 ARG_continue_the_doctrine_desc: "Продолжение доктрины армии является ключевым для того, чтобы сделать наши войска мирового класса и показать миру, что мы не просто «пропущение»."
 ARG_fuerza_aerea_argentina: "Фуерза Аерея Аргентина"
 ARG_fuerza_aerea_argentina_desc: "Аргентинские ВВС являются самыми молодыми из всех армейских филиалов. Несмотря на то, что в 1912 году была основана школа, и фактическая организация под названием Dirección General De Aeronáutica в 1927 году."
 ARG_expand_our_air_force: "Расширить наши ВВС"
 ARG_expand_our_air_force_desc: "Несмотря на то, что наши ВВС по -прежнему не на том уровне, в котором находятся другие страны, особенно европейские страны. Нам нужно расширить наши нынешние ВВС, чтобы получить уважение этих воздушных полномочий."
 ARG_develop_new_fighters: "Разработать новых бойцов"
 ARG_develop_new_fighters_desc: "Модернизация наших бойцов является ключом к тому, чтобы выиграть битву в воздухе."
 ARG_develop_new_bombers: "Разработать новых бомбардировщиков"
 ARG_develop_new_bombers_desc: "Модернизация наших бомбардировщиков позволит нам нанести ущерб вражеской индустрии, что позволит нам проникнуть через них."
 ARG_develop_better_heavy_fighters: "Развивать лучшие тяжелые бойцы"
 ARG_develop_better_heavy_fighters_desc: "Тяжелые бойцы - более сильные версии бойцов, и хотя они медленнее они наносят гораздо больший удар. Использование этих плохих парней может даже выиграть нам войну в небе."
 ARG_focus_on_startegic_bombers: "Сосредоточьтесь на стратегических бомбардировщиках"
 ARG_focus_on_startegic_bombers_desc: "Наличие стратегических бомбардировщиков позволит бомбить места, которые мы никогда не были бомбировали. Это позволит нам бомбить любую отрасль, которую враг пытается спрятаться от нас."
 ARG_modernize_our_CAS: "Модернизируйте наши CAS"
 ARG_modernize_our_CAS_desc: "Близкая авиационная поддержка была ключевым фактором во многих битвах и войнах, которые мы были свидетелем до сих пор. Нам нужно использовать эти красавицы в нашу пользу, если мы хотим одержать верх."
 ARG_improve_our_air_bases: "Улучшить наши воздушные базы"
 ARG_improve_our_air_bases_desc: "Наши воздушные базы были довольно пренебрежны. Пришло время довести их на уровень, который, по крайней мере, приемлемо."
 ARG_improve_pilot_training: "Улучшить обучение пилотов"
 ARG_improve_pilot_training_desc: "Если мы улучшим обучение пилотов, то независимо от того, какой тип самолета мы используем, наши пилоты изучат свои секреты и злоупотребляют им против любого врага, который может бросить нам вызов."
 ARG_concordancia: "Согласованность"
 ARG_concordancia_desc: "Согласованность проделала довольно хорошую работу по лидеру нации на данный момент, поэтому лучше всего продолжать с партией и посмотреть, куда она нас ведет."
 ARG_union_civica_radical: "Юнион гражданский радикал"
 ARG_union_civica_radical_desc: "Радикал Union Civica - это наш путь к славе, демократическая слава. Мы отмахнулись от демократии и смотрим, что произошло? Нам нужно вернуться к демократии и снова создать демократические идеалы, чтобы улучшить эту страну."
 ARG_los_azules: "Лос -Азулы"
 ARG_los_azules_desc: "Los Azules - более консервативная фракция в UCR и имеет тенденцию поддерживать богатое и предпринимательство."
 ARG_los_grises: "Лос -грисс"
 ARG_los_grises_desc: "Los Grises - более социалистическая фракция в UCR и имеет тенденцию поддерживать бедных и среднего работника."
 ARG_open_our_markets: "Откройте наши рынки"
 ARG_open_our_markets_desc: "Открытие наших рынков позволит нам им импортировать и экспортировать больше. Это открытие наших рынков также позволит нам узнать больше о других странах и их экономической политике, позволяя нам улучшить себя и расширить свою экономику."
 ARG_cave_to_the_rich: "Пещера богатым"
 ARG_cave_to_the_rich_desc: "Богатые - это то, что кормит рабочих, это то, что держит экономику на плаву, без них мы не были бы ничем. Если мы сможем получить поддержку богатых, то мы можем сделать много замечательных вещей с нашей отраслью и экономикой."
 ARG_help_out_the_poor: "Помогать бедным"
 ARG_help_out_the_poor_desc: "Бедные страдают от всего населения, им приходится просто поужинать. Пришло время помочь им с планами социального обеспечения и обеспечить их благополучие."
 ARG_expand_the_YPF_company: "Расширить компанию YPF"
 ARG_expand_the_YPF_company_desc: "YPF - это нефтяная компания, основанная нашим бывшим президентом UCR Hipolito Yrigoyen, который стремился расширить нефтяную промышленность в Аргентине и сделать его золотым рудником для природных ресурсов, таких как нефть. Мы можем расширить компанию, чтобы привлечь больше работников и, следовательно, повысить эффективность добычи нефти."
 ARG_support_the_YPF_workers: "Поддерживать работников YPF"
 ARG_support_the_YPF_workers_desc: "В то время как компания становится грязной богатой, работник заставляет себя сделать все возможное для жалкой зарплаты. Пришло время улучшить жизнь этих работников и поддерживать их в этом позоре, который называется «YPF»."
 ARG_reject_personalimso: "Отвергнуть персонализм"
 ARG_reject_personalimso_desc: "Personimso - это латиноамериканская идея подчинения интересов политических партий, идеологий и конституционного правительства в лояльности к одному лидеру. Пришло время сохранять верность этим убеждениям и отвергать эту идею, для ее работника и населения, которые приносят процветание для нации!"
 ARG_ban_personalismo: "Запретить персонализм"
 ARG_ban_personalismo_desc: "Personimso - это латиноамериканская идея подчинения интересов политических партий, идеологий и конституционного правительства в лояльности к одному лидеру. Пришло время полностью искоренить эту мерзкую идею от нашей нации и продвигаться к новой эре, новой идее, новой концепции в нашей стране."
 ARG_hand_out_the_communist_manifesto: "Выдать коммунистический манифест"
 ARG_hand_out_the_communist_manifesto_desc: "У коммунизма есть много обещаний, которые кажутся слишком хорошими, чтобы быть правдой. Карл Маркс показал нам, что существует идеология, способная это сделать, и Ленин показал нам, что действительно возможно свергнуть злой буржуазии."
 ARG_continue_Hipolitos_legacy: "Продолжайте наследие Хиполито"
 ARG_continue_Hipolitos_legacy_desc: "Хиполито дважды служил президентом Аргентины, сначала с 1916 по 1922 год и второй раз с 1928 года по переворот 1930 года. Хиполито - легенда, когда дело доходит до UCR и является одним из главных лидеров этой политической партии. Продолжение его наследия только повысит нашу страну и поможет нам в долгосрочной перспективе, а также сохранить его традицию."
 ARG_establish_the_central_bank: "Усилить центральный банк"
 ARG_establish_the_central_bank_desc: "Укрепление центрального банка позволит нам подключиться к нетронутым внешним рынкам и торговле. Оттуда мы можем предпринять много шагов, таких как национализация отраслей промышленности, чтобы еще больше укрепить нашу экономику и представлять полностью функционирующее капиталистическое общество в Южной Америке."
 ARG_expand_worker_rights: "Расширить права работников"
 ARG_expand_worker_rights_desc: "Рабочие заслуживают больше прав, они - те, которые поднимают эту нацию и любую другую нацию на планете. Это то, что мешает ему погрузиться в бесконечную яму. Мы должны уважать эти смелые души и уважение, которые они получат в большем количестве прав и свободы."
 ARG_the_barn_of_the_world: "Сарай мира"
 ARG_the_barn_of_the_world_desc: "Благодаря нашему огромному количеству экспорта и товаров продуктов питания, а также нашей растущей экономики нас считали во всем мире как «сарай мира». Страны со всего мира теперь готовы торговать с нами на товары и ресурсы. Это значительно улучшит не только наши отношения с другими странами, но и наша экономика."
 ARG_invest_in_our_infrastructure: "Инвестировать в нашу инфраструктуру"
 ARG_invest_in_our_infrastructure_desc: "Ключом к наличию большой и мощной экономики является то, чтобы убедиться, что все части нашей страны были должным образом связаны, а товары/услуги могут быть доставлены в любую часть Аргентины и обратно."
 ARG_increase_the_minimum_salary: "Увеличить минимальную зарплату"
 ARG_increase_the_minimum_salary_desc: "Работникам нуждается в повышении заработной платы, они не могут выполнять эту сумму труда по такой низкой цене. Пришло время повысить минимальную зарплату, позволяя среднему работнику лучше поддерживать свою семью."
 ARG_go_back_to_our_liberal_ways: "Демократия над всеми"
 ARG_go_back_to_our_liberal_ways_desc: "свобода слова"
 ARG_help_out_the_spanish: "Помогите испанскому"
 ARG_help_out_the_spanish_desc: "Несмотря на то, что мы бодимся за независимость против них столетие назад, эта Испания отличается от Испании, которую мы боролись так давно. Мы должны помочь нашим испанским братьям и сестрам и вместе избавиться от фашистской угрозы."
 ARG_study_the_spanish_civil_war: "Изучить гражданскую войну в Испании"
 ARG_study_the_spanish_civil_war_desc: "Давайте изучим оборудование и тактику, используемые испанцами, немцами, итальянцами и даже советами, чтобы улучшить как наши методы обучения, так и оборудование."
 ARG_learn_spanish_civil_war_tactics: "Узнайте тактику гражданской войны в Испании"
 ARG_learn_spanish_civil_war_tactics_desc: "Находясь на сиденье в первом ряду, мы изучаем много вещей как на том, чтобы увидеть и испытывать боевые действия в Испании. Мы будем принять к сведению эту тактику, чтобы лучше разобрать войска."
 ARG_spanish_argentine_economic_cooperation: "Испанский-Аргентинский экономическое сотрудничество"
 ARG_spanish_argentine_economic_cooperation_desc: "Испанские - довольно могущественная страна, с достойной экономикой и военными. Благодаря нашей приверженности в их гражданской войне можно с уверенностью предположить, что они будут готовы совершить экономический альянс между нашими странами и удержать обе наши страны."
 ARG_invite_dominican_republic: "Пригласить доминиканскую республику"
 ARG_invite_dominican_republic_desc: "Доминиканская Республика является идеальным союзником для нас, будучи сидячей прямо под США, что позволяет нам иметь идеальную зону удара, когда придет время."
 ARG_invite_el_salvador: "Пригласить Эль Сальвадор"
 ARG_invite_el_salvador_desc: "Сальвадор - хороший союзник, расположенный чуть ниже Мексики и прямо в центре Центральной Америки."
 ARG_prepare_for_the_US_invasion: "Подготовиться к вторжению в США"
 ARG_prepare_for_the_US_invasion_desc: "С помощью пути к США теперь полностью ясно, мы должны полностью подготовиться к нашему вторжению. Американцы не шутят, когда речь заходит как о промышленности, так и военных, поэтому мы должны убедиться, что мы можем выбить их одним полным махом. Если мы продлим войну слишком долго, то их станет почти невозможно."
 ARG_limit_our_exports: "Ограничьте наш экспорт"
 ARG_limit_our_exports_desc: "Наши ресурсы ценны, они для нас и только для нас. Если другие хотят купить их, им придется заплатить огромную цену."
 ARG_expand_the_industry: "Оправиться от гражданской войны"
 ARG_expand_the_industry_desc: "Поскольку наша отрасль была разрушена довольно жестокой гражданской войной, которую мы должны были пройти, нам нужно еще раз исправить ее и вернуть ее на уровень, на котором он был раньше."
 ARG_improve_our_consumer_sector: "Уменьшить потребительский сектор"
 ARG_improve_our_consumer_sector_desc: "Сектор потребительских товаров нашей отрасли некоторое время сдерживает нас, на то время, когда мы придерживаемся вопросов в наших руках и снижают это число, чтобы освободить больше фабрик для наших военных усилий."
 ARG_modernize_our_construction_companies: "Модернизируйте наши строительные компании"
 ARG_modernize_our_construction_companies_desc: "Модернизация наших строительных комаров позволит нам расширить нашу отрасль гораздо быстрее, чем раньше."
 ARG_attract_foreign_investors: "Привлечь иностранных инвесторов"
 ARG_attract_foreign_investors_desc: "Аттракция иностранных инвесторов не только улучшит нашу экономику, но и наши дипломатические отношения с другими странами по всему миру."
 ARG_build_better_highways: "Постройте лучшие автомагистрали"
 ARG_build_better_highways_desc: "Строительство лучших автомагистралей и улучшение нашей инфраценрузы принесут пользу только для нашей быстро расширяющейся отрасли."
 ARG_develop_uruguay: "Развивать Уругвай"
 ARG_develop_uruguay_desc: "С нашей недавней аннексией Уругвая многие из наших ведущих бизнесменов сказали нам, что Уругвай может стать идеальным местом для расширения нашей отрасли. Их земли, богатые ресурсами, могут очень помочь нашей отрасли в ближайшем будущем, поэтому мы должны воспользоваться этим как можно скорее."
 ARG_no_compromise_on_liberal_ideals: "Нет компромисса на наших либеральных идеалах"
 ARG_no_compromise_on_liberal_ideals_desc: "Никто не встанет на пути нашего либерального возрождения, Аргентина снова станет мировой силой!"
 ARG_reform_the_education_system: "Реформировать систему образования"
 ARG_reform_the_education_system_desc: "Система образования постепенно ухудшается с тех пор, как мы оставили наши либеральные пути, но теперь пришло время изменить это."
 ARG_clamp_down_on_corruption: "Зажигать коррупцию"
 ARG_clamp_down_on_corruption_desc: "Коррупция затрудняет способность нашей нации управлять в течение очень долгого времени, пришло время избавиться от этих коррумпированных морец и очищать нацию."
 ARG_reform_the_parliament: "Реформировать парламент"
 ARG_reform_the_parliament_desc: "Парламент оставался прежним в течение многих лет и был одной из основных причин того, что коррупция происходила по всей стране."
 ARG_open_our_borders: "Откройте наши границы"
 ARG_open_our_borders_desc: "Привлечь людей со всего мира, это не имеет значения их национальности, ни религии, ни расы, все приветствуются."
 ARG_industrialize_the_nation: "Индустриализировать нацию"
 ARG_industrialize_the_nation_desc: "Наша отрасль не в лучшем случае, если не сказать больше, и если мы хотим стать тем, кем мы когда -то были. Мы должны создать наш промышленный сектор, чтобы конкурировать с другими способностями."
 ARG_awaken_the_liberal_war_machine: "Пробудить либеральную военную машину"
 ARG_awaken_the_liberal_war_machine_desc: "Поскольку мир, сжигающийся вокруг нас, нам нужно достичь уровня других стран, если мы хотим выступить на мировой сцене и быть уважаемыми."
 ARG_workers_in_the_parliament: "Рабочие в парламенте"
 ARG_workers_in_the_parliament_desc: "Рабочие знают друг друга лучше всего, поэтому трудолюбивые граждане среднего класса, представляющие правительство, принесут много великих вещей в рабочий класс нации."
 ARG_reform_the_central_bank: "Реформировать центральный банк"
 ARG_reform_the_central_bank_desc: "На данный момент центральный банк обладает слишком большой властью, и, во всяком случае, он причиняет вред экономике. Нам нужно реформировать его и снизить объем власти, который он обладает в экономике, чтобы наша экономика стала ближе к действительно либеральной экономике Аргентине."
 ARG_review_our_foreign_policy: "Просмотреть нашу внешнюю политику"
 ARG_review_our_foreign_policy_desc: "В последнее время мы были очень тихими, когда дело доходит до мировой сцены. Давайте изменим это и покажем миру, что либерализм делает с нацией."
 ARG_go_our_own_route: "Идти по своему собственному маршруту"
 ARG_go_our_own_route_desc: "Современные демократии стремятся от своего истинного происхождения, пришло время установить истинную демократическую фракцию, которая следит за истинными демократическими идеалами и защищает их."
 ARG_placate_to_the_west: "Улатать на запад"
 ARG_placate_to_the_west_desc: "Запад - электростанция, и все они разделяют демократические убеждения. Было бы глупо не встать на сторону их."
 ARG_side_with_the_americans: "Сторона с американцами"
 ARG_side_with_the_americans_desc: "Американцы представляют истинные либеральные идеалы, похожие на наши. Ни одна другая демократическая страна не делает этого, так что в настоящий момент сторона американцев, кажется, наша лучшая ставка."
 ARG_join_the_allies_euyl: "Присоединяйтесь к союзникам"
 ARG_join_the_allies_euyl_desc: "Союзники - это мощный союз, который остается сильным даже с угрозой, которая является немцами. Присоединиться к ним, мы должны помочь нашим британским братьям и сестрам."
 ARG_propose_an_allience_to_america: "Предложить альянс в Америку"
 ARG_propose_an_allience_to_america_desc: "Мир горит вокруг нас, и нам нужно быстро и быстро. Американцы, с которыми мы улучшили наши отношения и имеют аналогичные идеалы, должны быть явным выбором в составлении военного союза."
 ARG_embargo_the_british: "Эмбарго англичан"
 ARG_embargo_the_british_desc: "Британцы были началыми многих бедствий, слишком много, чтобы сосчитать. Мы больше не можем им доверять, и мы должны начать с их замыкания."
 ARG_embargo_the_germans: "Эмбарго немцев"
 ARG_embargo_the_germans_desc: "Немцы - настоящее зло, они привели мир к пламени, и нам нужно убить это пламя."
 ARG_learn_american_war_tactics: "Изучить тактику военных военных действий"
 ARG_learn_american_war_tactics_desc: "Американцы были во многих войнах, и они усовершенствовали свою военную тактику. Теперь, когда мы являемся их главным союзником, мы можем изучить их и усовершенствовать нашу собственную тактику."
 ARG_joint_military_training: "Совместная военная подготовка"
 ARG_joint_military_training_desc: "Проведение военных упражнений вместе улучшит наши армии и подготовит нас к будущему конфликту."
 ARG_invite_chile: "Пригласить Чили"
 ARG_invite_chile_desc: "Чили всегда была оплотом демократии в регионе, представляя наши идеалы еще долго после того, как нас заменили, однако, теперь, когда мы вернулись, было бы разумно привлечь их в наш новый альянс."
 ARG_invite_colombia: "Пригласить Колумбию"
 ARG_invite_colombia_desc: "Колумбия всегда представляла демократические идеалы, даже в разгар хаоса. Было бы разумно привести их в нашу фракцию."
 ARG_invite_uruguay: "Пригласить Уругвай"
 ARG_invite_uruguay_desc: "Уругвай всегда представлял демократические идеалы, даже в разгар хаоса. Было бы разумно пригласить их на нашу фракцию."
 ARG_invite_ecuador: "Пригласить Эквадор"
 ARG_invite_ecuador_desc: "Эквадор - демократический бастион в Южной Америке, один из немногих оставшихся. Было бы разумно пригласить их на нашу фракцию."
 ARG_prepare_for_war: "Подготовьтесь к войне"
 ARG_prepare_for_war_desc: "Война кажется неизбежной. Лучше всего, что мы готовим сейчас, всегда лучше, чем никогда."
 ARG_go_against_imperialism: "Идти против империализма"
 ARG_go_against_imperialism_desc: "Империализм не может быть принят в современном обществе. Эксплуатация других не может быть разрешено продолжать дальше. Британия и Франция утверждают, что представляют демократию, когда на самом деле они представляют только эту мерзкую форму империализма."
 ARG_go_against_fascism: "Идти против фашизма"
 ARG_go_against_fascism_desc: "Фашизм-это величайшее зло на этой планете, они не хотят ничего, кроме как использовать свое собственное население и расширить свою территорию для собственного благополучия. Это не может больше продолжать."
 ARG_go_against_communism: "Идти против коммунизма"
 ARG_go_against_communism_desc: "Коммунизм является основой массового голода и эксплуатации рабочего класса. Они утверждают, что они для рабочих, когда на самом деле они являются полной противоположностью. Мы должны избавить себя от этих коммунистических мест."
 ARG_the_great_stab_in_the_back: "Большой удар в спину"
 ARG_the_great_stab_in_the_back_desc: "Британцы и французы были отпущены с крючка достаточно долго, пришло время показать им, как выглядят настоящие демократия и демократические идеалы, а не этот империалистический мусор, который они называют «демократией»!"
 ARG_deal_with_the_devil: "Иметь дело с дьяволом"
 ARG_deal_with_the_devil_desc: "В то время как немцы могут быть не самыми невинными из группы, они определенно лучше, чем эти империалистические мраки. Их опыт работы в войне также поможет нам в наших собственных военных усилиях."
 ARG_remove_fascism_from_the_continent: "Удалить фашизм с континента"
 ARG_remove_fascism_from_the_continent_desc: "Если мы хотим очистить этот мир от зла ​​фашизма, мы должны начать близко к дому. Есть несколько стран Южной Америки, у которых есть фашистское правительство, и это нельзя допустить, чтобы продолжить."
 ARG_go_for_the_nazis: "Идти на нацисты"
 ARG_go_for_the_nazis_desc: "Пришло время по -настоящему вмешаться и вмешаться во Второй мировой войне. Немцы были в этом гораздо дольше, чем они должны. Мы не можем позволить этому продолжить."
 ARG_remove_communism_from_the_continent: "Удалить коммунизм с континента"
 ARG_remove_communism_from_the_continent_desc: "Коммунизм по -прежнему присутствует на нашем континенте, отменяя наш прогресс, который мы достигли как континент. Мы больше не можем продолжать идти так, мы должны избавиться от них, прежде чем они сделают что -то хуже."
 ARG_go_after_the_soviets: "Идти после Советов"
 ARG_go_after_the_soviets_desc: "Советы - это то, что большинство считает создателями этой мерзкой идеологии, и они будут наказаны из -за этого. Никто не будет пронизан этим миром коммунизмом. Даже с нашими ограничениями из -за расстояния мы все равно найдем способ убедиться, что они платят."
 ARG_ask_for_the_falklands: "Спросите Фолклендс"
 ARG_ask_for_the_falklands_desc: "Теперь, когда у нас есть очень позитивные отношения с англичанами, можно с уверенностью предположить, что если мы просто попросим Фолклендс, они могут просто дать им нам."
 ARG_ask_for_south_georgia: "Попросите Южную Джорджию"
 ARG_integrate_our_new_territories: "Интегрировать наши новые территории"
 ARG_integrate_our_new_territories_desc: "Теперь, когда мы контролируем эти новые территории, пришло время интегрировать их в нашу страну и сделать людей, живущих там по -настоящему аргентинца."
 ARG_ask_for_south_georgia_desc: "Поскольку они дали нам Фолкленды, было бы также с уверенностью предположить, что они также дадут нам Южную Джорджию."
 ARG_remove_the_fascist_threat: "Удалить фашистскую угрозу"
 ARG_remove_the_fascist_threat_desc: "Немцы являются оплотом фашистской идеологии, мы должны снять их вместе с американцами и положить конец их режиму!"
 ARG_continue_the_roca_runciman_treaty: "Продолжить договор Рока-Дунксиман"
 ARG_continue_the_roca_runciman_treaty_desc: "Договор Рока-Дунксиман был договором, подписанным между Великобританией и Аргентиной в 1933 году, который обеспечил экспорт мяса из Аргентины в Британию. Это заставило обе страны в значительной степени полагаться друг на друга с помощью импорта и экспорта и увеличило обе их экономики соответственно. Продолжение договора улучшит наши связи еще больше с британцами и поможет обеим странам."
 ARG_learn_british_naval_techniques: "Узнайте британские военно -морские методы"
 ARG_learn_british_naval_techniques_desc: "Нельзя отрицать мощь Королевского флота, и с его мощностью мы сможем многому научиться у них сейчас, когда мы ближе, чем когда -либо."
 ARG_ask_for_control_over_the_southern_atlantic: "Попросите контролировать южную Атлантику"
 ARG_ask_for_control_over_the_southern_atlantic_desc: "С нашими недавними территориальными выгодами и улучшенными отношениями с англичанами, существует высокая вероятность того, что англичане могут просто позволить нам контролировать всю территорию в южной части Атлантики."
 ARG_help_out_in_operation_avalanche: "Помогите в операции Avalanche"
 ARG_help_out_in_operation_avalanche_desc: "С операцией «Лавина» в полном разгаре и наших союзников, пытающихся протолкнуть итальянские горы, это больше, чем наше обязательство помогать им и обучить наши собственные полки альпиниста, чтобы помочь."
 ARG_help_out_in_dday: "Помогите в день D"
 ARG_help_out_in_dday_desc: "D-Day планируется, когда мы говорим, нам нужно вмешаться и помочь нашим союзникам в этом деле раз и навсегда избавиться от этих фашистских свиней!"
 ARG_convince_opposition_of_plan: "Убедить оппозицию в отношении плана"
 ARG_convince_opposition_of_plan_desc: "Оппозиция не хочет, чтобы Роберто отвечал, что было ясно много раз, и мы воспользуемся этим."
 ARG_the_great_concession: "Великая концессия"
 ARG_the_great_concession_desc: "Роберто не собирается уйти в отставку в ближайшее время, однако военные больше, чем стремятся продолжить переворот. Мы должны вступить в уступки военнослужам, чтобы задержать переворот как можно больше, пока Роберто не уйдет в отставку."
 ARG_spread_the_peronist_ideals: "Распространите идеалы перониста"
 ARG_spread_the_peronist_ideals_desc: "Люди еще не подготовлены, так сказать, в Пероне, предполагая, что власть так внезапно, поэтому мы должны распространять его убеждения по всей стране и показать людям, которые он на самом деле может выдвинуть эту страну."
 ARG_ask_the_UCR_to_support_peron: "Попросите UCR поддержку Peron"
 ARG_ask_the_UCR_to_support_peron_desc: "Хотя мы, возможно, убедили оппозицию поддержать нас в перевороте, то же самое нельзя сказать за поддержку новой идеологии, которую Перон приносит на стол. Мы постараемся убедить их, однако, это не так многообещающе."
 ARG_consolidate_the_economy: "Консолидировать экономику"
 ARG_consolidate_the_economy_desc: "С учетом наших усилий по перевороту нам необходимо консолидировать экономику и привести работников на нашу сторону."
 ARG_consolidate_power: "Консолидировать власть"
 ARG_consolidate_power_desc: "При успешном перевороте мы смогли поместить Перон в власть, теперь нам просто нужно консолидировать его, чтобы прояснить, что сейчас мы отвечаем."
 ARG_tackle_our_economic_woes: "Решать наши экономические проблемы"
 ARG_tackle_our_economic_woes_desc: "Наша экономика была в руинах с тех пор, как до нашего роста к власти. Нам нужно исправить это и быстро, если мы хотим продолжить с нашими планами."
 ARG_federalize_the_economy: "Федерализировать экономику"
 ARG_federalize_the_economy_desc: "Мы провели все необходимые экономические реформы, наша экономика готова действительно быть тем, каким является экономика Конфедерации. Наши ресурсы ценны, и никому другому, кроме нас, нельзя использовать их."
 ARG_invest_in_foreign_countries: "Инвестировать в зарубежные страны"
 ARG_invest_in_foreign_countries_desc: "Наша шумная экономика нуждается в работе за пределами нашей страны. Инвестиции в иностранные державы могут принести большую выгоду для нашей экономики в будущем."
 ARG_demand_repay_from_investment: "Погашение спроса от наших инвестиций"
 ARG_demand_repay_from_investment_desc: "Пришло время требовать погашения всех наших инвестиций в иностранные территории. Если мы инвестировали в эту страну, они будут обязаны погасить наши усилия. Чем больше стран мы инвестировали, тем большей будет наша экономика после требовательных выплат."
 ARG_push_industrial_reforms: "Обещайте промышленные реформы"
 ARG_push_industrial_reforms_desc: "С экономикой в ​​разбитых, мы обязаны вернуть его на ноги и снова начать экономику."
 ARG_strenghten_robertos_ideals: "Уступить большую силу Роберто"
 ARG_strenghten_robertos_ideals_desc: "Роберто уже показал свой гений, когда дело доходит до экономики и бизнеса. Предоставление ему больше власти в этих секторах может принести больше пользы для страны."
 ARG_push_forward_anitcorruption_reforms: "Продвигать антифролентные реформы"
 ARG_push_forward_anitcorruption_reforms_desc: "Коррупция продолжалась слишком долго в этой стране, пришло время провести различные реформы, чтобы наконец избавиться от вредителя, который является коррупцией."
 ARG_subsidize_key_industries: "Субсидировать ключевые отрасли"
 ARG_subsidize_key_industries_desc: "С помощью нашей растущей экономики мы можем позволить себе помочь финансово новым и растущим отраслям в нашей стране. Высокая стоимость в начале, но высокая награда в конце."
 ARG_nationalize_key_industries: "Национализируйте ключевые отрасли"
 ARG_nationalize_key_industries_desc: "Наши отрасли промышленности не преуспевают самостоятельно, поэтому нам нужно вмешаться и национализировать эти отрасли, чтобы помочь среднему работнику и улучшить нашу экономику."
 ARG_begin_the_creation_of_a_socialist_state: "Начать создание социалистического государства"
 ARG_begin_the_creation_of_a_socialist_state_desc: "Люди давно желают нового и лучшего правительства, которое уважает их взгляды и слушает их, тот, который восхищается работниками и понимает их важность, которая не будет плюнуть на людей. Коммунизм делает именно это и многое другое."
 ARG_fund_public_works: "Фонд общественных работ"
 ARG_fund_public_works_desc: "Общественные работы - один из самых ценных аспектов нашей экономики, и они заслуживают всего финансирования, которое они могут получить. Наша экономика может сначала немного бороться, но в конечном итоге она окупится."
 ARG_continue_mobilizing_our_economy: "Продолжайте мобилизовать нашу экономику"
 ARG_continue_mobilizing_our_economy_desc: "Экономика не подготовлена ​​к войне, и это может навредить нам очень сильно в будущем. Нам нужно мобилизовать экономику в случае войны."
 ARG_improve_the_infrastructure_in_the_north: "Улучшить инфраструктуру на севере"
 ARG_improve_the_infrastructure_in_the_north_desc: "Север всегда был, скорее, неразвитым. Предыдущие правительства никогда не смотрели на расширение инфраструктуры там, но мы разные."
 ARG_build_better_infrastructure: "Построить лучшую инфраструктуру"
 ARG_build_better_infrastructure_desc: "Инфраструктура является ключом к современной эпохе, было бы разумно расширить ее в нашей стране и пользоваться преимуществами лучшей дорожной сети."
 ARG_remove_the_communist_threat: "Удалить коммунистическую угрозу"
 ARG_remove_the_communist_threat_desc: "Правительство Парагвайя представляет угрозу для целостности Южной Южной Америки. Их правительство больше не может оставаться на этом континенте, поэтому мы интегрируем их в нашу страну."
 ARG_expand_the_steel_mines: "Расширить стальные шахты"
 ARG_expand_the_steel_mines_desc: "Сталь является ключевым в войне, это то, что производит много вещей. Расширение это должно быть довольно очевидным."
 ARG_continue_our_economic_reforms: "Продолжить наши экономические реформы"
 ARG_continue_our_economic_reforms_desc: "Наши экономические реформы оказались довольно успешными. Мы можем только представить, что принесут гораздо больше преимуществ эти Refomrs."
 ARG_develop_paraguay: "Разработать Парагвай"
 ARG_develop_paraguay_desc: "Теперь, когда Paraguay был взаимосвязаен в нашу страну, мы начнем расширять отрасли в их бывшей стране."
 ARG_study_the_battle_of_rio_de_la_plata: "Изучите битву при Рио -де -ла -Плата"
 ARG_study_the_battle_of_rio_de_la_plata_desc: "Битва при Рио -де -ла -Плата была военно -морской битвой между британскими и немецкими кораблями у побережья Уругвай во время Второй мировой войны. Из -за близости битвы мы получаем первое классовое представление об этой битве, и мы можем изучить используемые крейсеры, а также тактику, которая была реализована."
 ARG_demand_peron_to_report_notes: "Потребовать Перона, чтобы сообщить о своих заметках"
 ARG_demand_peron_to_report_notes_desc: "Перон научится немного, когда дело доходит до горной войны в Италии. Его заметки могут содержать большие знания для нас, и мы можем использовать их в наших интересах."
 ARG_build_the_military_hospital: "Построить военную больницу Паламар"
 ARG_build_the_military_hospital_desc: "Военная больница Паламара была военной больницей, построенной в Паламаре, Буэнос -Айрес. Строительство началось в 1936 году, и торжественное открытие было в 1939 году. С растущей экономикой как в промышленности, так и в военном отношении нам нужно больше сосредоточиться на благополучии наших солдат. Военнослужащей должна достаточно этой потребности."
 ARG_take_in_spanish_immigrants: "Принять итальянских иммигрантов"
 ARG_take_in_spanish_immigrants_desc: "Итальянцы уже давно иммиграции в нашу страну, и они очень помогли в развитии того, что сейчас является Аргентиной. Все итальянцы приветствуются на аргентинской земле, и с ними будут обращаться с самым уважением и достоинством."
 ARG_modernize_industrial_tactics: "Модернизируйте промышленную тактику"
 ARG_modernize_industrial_tactics_desc: "Индустрия растет устойчивыми темпами, однако, она может увеличиваться гораздо быстрее, если мы модернизируем нашу промышленную тактику и продвигаемся вперед."
 ARG_increase_funding_on_public_works: "Увеличить финансирование проектов государственной работы"
 ARG_increase_funding_on_public_works_desc: "Общественные работы были ключевыми в стране. Мы прогрессировали довольно далеко благодаря им, и недавно работы стали больше и дольше. Нынешний бюджет не сокращает его, поэтому давайте увеличим его для тех, кто работает над указанными общественными работами."
 ARG_redirect_our_fundings: "Перенаправить наши финансирование"
 ARG_redirect_our_fundings_desc: "Наши финансы ценны, и нет никаких оснований продолжать наше финансирование общественных работ. Это немного истощает нашу экономику и предпочитает использоваться по промышленным и военным причинам, а не для общественных работ."
 ARG_take_advantage_of_immigrant_intellectuals: "Воспользоваться иммигрантскими интеллектуалами"
 ARG_take_advantage_of_immigrant_intellectuals_desc: "С очень большим иммигрантским населением было бы довольно глупо не воспользоваться интеллектуалами среди нашей страны. Есть некоторые очень талантливые люди, разбросанные долго и далеко, и мы должны найти их и использовать их интеллектуальные способности."
 ARG_begin_preparing_for_Robertos_retiring: "Начните готовиться к выходу на пенсию Роберто"
 ARG_begin_preparing_for_Robertos_retiring_desc: "Совершенно очевидно, что у президента мало осталось. Его состояние здоровья просто постоянно ухудшается, и после того, как мы пробовали все, что у нас было, просто ничто не остановило бы его болезнь. Лучше всего мы начинаем готовиться к его неизбежному выходу на пенсию и убедитесь, что Рамон в хорошей форме, чтобы взять страну."
 ARG_strengthen_the_military: "Укрепить военные"
 ARG_strengthen_the_military_desc: "Военные уже давно держались под тенью страны, пренебрегали. Мы изменим это и по праву, мир поджигается, и мы должны быть в состоянии остановить этот огонь, если он когда -нибудь придет к нашему порогу."
 ARG_go_with_the_military_plot: "Идти с военным заговором"
 ARG_go_with_the_military_plot_desc: "С очень серьезной угрозой суверенитету нашей нации, кажется, что нет другого выбора, кроме как соблюдать план военных и просто следовать их примеру. Это не то, как мы хотели пойти вниз, однако, кажется, это единственный способ, которым это произойдет."
 ARG_defy_the_military_plot: "Бросить вызов военному заговору"
 ARG_defy_the_military_plot_desc: "Нам не все равно, что планируют военные, они получат то, что заслуживают. Никто не должен угрожать суверенитету этой страны, и те, кто это делает, заплатит своей кровью. Пусть они придут на нас, у нас есть наши верные сторонники, которые защитят нас до конец."
 ARG_maintain_the_loyalist_support: "Поддерживать поддержку лоялистской поддержки"
 ARG_maintain_the_loyalist_support_desc: "Часть армии по -прежнему верна нашему делу и готова отбиться от восстающихся армейских мужчин. Мы должны убедиться, что они находятся на нашей стороне войны, даже если это означает, что противоположная сторона будет использовать это в качестве пропагандистских усилий, чтобы получить больше солдат на их стороне."
 ARG_conserve_our_stockpiles: "Сохранить наши запасы"
 ARG_conserve_our_stockpiles_desc: "Наше оружие драгоценное, мы не можем позволить этим мрачным получить какое -либо кусочек нашего оружия, поэтому нам нужно приложить усилия, чтобы сохранить как можно больше нашего запаса."
 ARG_disband_the_army: "Распустить армию"
 ARG_disband_the_army_desc: "К сожалению, кажется, что мы должны временно распадать армию, чтобы у хунты не было такой большой власти. Это жертва, которую стоит принять в данный момент."
 ARG_increase_our_equipment_output: "Увеличьте наше оборудование"
 ARG_increase_our_equipment_output_desc: "Несмотря на то, что мы сохраняем большую часть нашего оборудования, мы все еще не можем стать слишком дерзкими. Необходимо увеличить производство нашего оборудования во время гражданской войны, чтобы не отставать от требования войны."
 ARG_viva_la_patria_argentina: "Viva La Patria"
 ARG_viva_la_patria_argentina_desc: "Эти проклятые генералы думают, что у них есть шанс против нас? Они чертовски хорошо знают, с кем они сталкиваются, аргентинский народ. Ничто не ставит под сомнение нашу независимость и суверенитет, и именно поэтому эти генералы получат очень тяжелый урок. Viva La Patria!"
 ARG_fire_the_loyalist_soldiers: "Уволить лоялистских солдат"
 ARG_fire_the_loyalist_soldiers_desc: "Часть армии по -прежнему верна нынешнему правительству и может представлять угрозу для нашего переворота. Раннее общение с ними - это наша лучшая ставка, так что они не вмешиваются в наши планы."
 ARG_gain_the_support_of_the_Army: "Получить поддержку армии"
 ARG_gain_the_support_of_the_Army_desc: "В то время как большая часть армии пользуется нам, они все еще не полностью убеждены в наших планах. Мы должны убедиться, что каждый солдат понимает, что мы делаем что -то хорошее для страны, неплохо."
 ARG_learn_from_the_failed_coups: "Учиться у неудачных переворотов"
 ARG_learn_from_the_failed_coups_desc: "У Рамона было несколько переворотов против него и его правительства до сих пор, и все они потерпели неудачу. Мы должны убедиться, что у нас нет, с тщательным планированием и надлежащим исполнением."
 ARG_march_to_la_casa_rosada: "Март в Ла Касадада"
 ARG_march_to_la_casa_rosada_desc: "La Casa Rosada находится там, где находится президент, на что мы должны нацелиться. Мы принимаем La Casa Rosada, мы принимаем страну, и оттуда можем полностью взять под контроль."
 ARG_oust_ramon: "Овер Рамон"
 ARG_oust_ramon_desc: "Теперь, когда Casa Rosada, обеспеченная, мы можем решить большую часть проблемы, сам президент. Вынуждать его из Каса Росады и отправить его в Уругвай, кажется довольно хорошим планом, и тогда мы наконец сможем взять полный контроль над нацией."
 ARG_invite_german_advisors: "Пригласить немецких советников"
 ARG_invite_german_advisors_desc: "Немцы продемонстрировали свой тактический гений в войне. Их генералов будет более чем достаточно, чтобы начать профессию, а также поместить их в центр внимания."
 ARG_the_five_year_plan: "Начать пятилетний план"
 ARG_the_five_year_plan_desc: "Пришло время начать по -настоящему сосредотачиваться на экономике и убедиться, что она достигает удовлетворительного уровня. То, как сейчас это глобальное смущение, и мы не допустим этого."
 ARG_deal_with_the_corruption: "Иметь дело с коррупцией"
 ARG_deal_with_the_corruption_desc: "Коррупция была серьезной проблемой в нашей стране уже довольно давно, и с ней необходимо быстро разобраться. Мы больше не будем страдать от этого позора."
 ARG_continue_our_military_expansion: "Национализировать вооруженную индустрию"
 ARG_continue_our_military_expansion_desc: "Наши военные расширяются довольно хорошо, и было бы разумно продолжать с этим. У нас до сих пор не было обратной реакции, так зачем сейчас останавливаться?"
 ARG_invite_german_intellectuals: "Пригласить немецких интеллектуалов"
 ARG_invite_german_intellectuals_desc: "Немецкий народ - одни из самых умных людей на этой планете, особенно когда дело доходит до войны. Танки, которые они произвели, превзошли все другие, поэтому использование некоторых из своих знаний может дать нам преимущество в нашем будущем конфликте."
 ARG_invite_italian_intellectuals: "Пригласить итальянских интеллектуалов"
 ARG_invite_italian_intellectuals_desc: "Когда дело доходит до военно -морского флота, Региа Марина легко одна из лучших. У класса и славы их кораблей нет конкурентов. Это не повредит, если бы некоторые из военно -морских знаний Итальянского, в конце концов, большая часть нашего населения является итальянским."
 ARG_make_use_of_the_intellects: "Использовать интеллекты"
 ARG_make_use_of_the_intellects_desc: "С этими яркими умами сейчас в нашей стране было бы разумно использовать их присутствие и убедиться, что наши собственные люди и индустрия укрывают интеллект, обладающий этими яркими людьми."
 ARG_autarky: "Autarky"
 ARG_autarky_desc: "Будучи твердым сторонником итальянского фашизма, Перон приказал, чтобы мы изменили нашу экономику на экономику. Тот, который самодостаточен и не нуждается в помощи или ресурсах от любой другой страны. Мы все равно будем держать часть наших ресурсов открытыми для остального мира, но большинство должно быть для нашего личного использования."
 ARG_perons_argentina: "Аргентина Перона"
 ARG_perons_argentina_desc: "Страна вернулась на ноги. После многих удивительных достижений, сделанных Пероном, страна снова проснулась. Люди влюблены в президента и того, что он сделал, даже если это было за счет жестокого переворота. Теперь мы будем с нетерпением ждем будущего, лучшего будущего."
 ARG_review_our_foreign_affairs: "Просмотрите наши иностранные дела"
 ARG_review_our_foreign_affairs_desc: "В последнее время мы были очень тихими, когда дело доходит до мировой сцены. Давайте изменим это и покажем миру, что либерализм делает с нацией."
 ARG_maintain_a_neutral_stance: "Поддерживать нейтральную позицию"
 ARG_maintain_a_neutral_stance_desc: "Поскольку мир сжигается в пламени, было бы лучше, если бы мы просто не вмешивались в такую ​​войну. Ничего хорошего не выйдет из вмешательства, и, если что -то, только плохие вещи произойдут, если мы сделаем такую ​​вещь."
 ARG_side_with_the_axis: "Сторона с осью"
 ARG_side_with_the_axis_desc: "Ось, кажется, является доминирующей силой в войне, одержав победы практически на каждом фронте, с которой они подвергаются. Присоединение к фашистской стороне войны не кажется такой плохой идеей, плюс мы получим военные знания немцев."
 ARG_side_with_the_allies: "Сторона с союзниками"
 ARG_side_with_the_allies_desc: "Даже со всеми шансами, сложенными против них, союзники все еще становятся сильными, отказываясь сдаться. Если мы собираемся присоединиться к стороне войны, было бы лучше, если бы мы присоединились к смешению 2 фракций. Не только это, но присоединение к союзникам также повысит наши отношения с Западом."
 ARG_reassemble_the_army: "Соберите армию"
 ARG_reassemble_the_army_desc: "После необходимости распадать армию из -за гражданской войны, теперь нам нужно ее повторно собрать. Это не должно занять слишком много времени, так как большинство солдат, которые оставались лояльными, будут более чем готовы воссоединиться в качестве одного объекта. Слава Богу, мы выиграли гражданскую войну, кто знает, что случилось бы, если бы мы этого не сделали?!"
 ARG_have_our_own_territorial_gains: "Иметь свои собственные территориальные выгоды"
 ARG_have_our_own_territorial_gains_desc: "С осью, принимающей всю территорию вокруг них, мы остались в пыли. Кажется, что нам придется сделать собственное расширение в нашей собственной части мира, и Уругвай - идеальная цель."
 ARG_adopt_an_imperialist_policy: "Принять империалистическую политику"
 ARG_adopt_an_imperialist_policy_desc: "Теперь, когда мы ясно дали понять остальной части континента наши экспансионистские планы, больше не полезно скрывать его. Мы расширимся, пока нас не остановится, никто не встанет на нашем пути, и если они это сделают, мы перевернем их."
 ARG_ask_for_the_falkland_islands: "Спросите Фолклендские острова"
 ARG_ask_for_the_falkland_islands_desc: "Теперь, когда у нас есть очень позитивные отношения с англичанами, можно с уверенностью предположить, что если мы просто попросим Фолклендс, они могут просто дать им нам."
 ARG_ask_for_the_south_georgia_island: "Попросите остров Южной Джорджии"
 ARG_ask_for_the_south_georgia_island_desc: "Поскольку они дали нам Фолкленды, было бы также с уверенностью предположить, что они также дадут нам Южную Джорджию."
 ARG_create_our_own_faction: "Создать свою собственную фракцию"
 ARG_create_our_own_faction_desc: "Нам не нужно и не хотим присоединиться к какой -либо глобальной фракции в данный момент. Вместо этого было бы лучше, если мы создадим фракцию с некоторыми странами Южной Америки и взаимно защищаем друг друга в случае внешнего вторжения."
 ARG_declare_war_on_the_germans: "Объявить войну немцам"
 ARG_declare_war_on_the_germans_desc: "Союзники ловят нас и могут слишком много сотрудничать с немцами, поэтому, чтобы убрать от них какие -либо сомнения, мы объявим войну немцам, даже если мы не будем сильно повлиять на войну."
 ARG_let_in_german_refugees: "Пусть в немецких беженцах"
 ARG_let_in_german_refugees_desc: "С точки зрения немцев, которые теперь начинают терять внезапные, стада нацистских военных преступников и генералов хотят выйти из страны, и мы можем в полной мере воспользоваться этим. С их интеллектом и трудоемкой этикой мы можем пройти очень долгий путь."
 ARG_the_true_leader: "Истинный лидер"
 ARG_the_true_leader_desc: "Даже после переворота и попыток довольно спуститься на людей, он просто не сработал. Люди хотят, чтобы Перон у власти, его популярность растет и растет уже много лет, и люди не будут довольны, пока он не станет лидером Аргентины."
 ARG_purge_the_peronists: "Очистить перонисты"
 ARG_purge_the_peronists_desc: "У нас было достаточно Перона и его махинаций. Пришло время получить то, что он заслуживает, за то, что он подделал аргентинский народ и искажает их мысли, верить, что наше правительство плохо, и что его будет «лучше». Людям это не понравится, но это должно быть сделано, для большего блага страны."
 ARG_a_new_path: "Новый путь"
 ARG_a_new_path_desc: "Фашизм? Демократия? Монархизм? Империализм? Перонизм? Все они бесполезны. Ни одна из этих идеологий не заботится о среднем работнике и не уважает этого, и если у вас это не может быть, то у вас нет рабочей идеологии. Коммунизм отличается в этом аспекте и во многих других. Это новая идеология, но она обладает очень высоким потенциалом."
 ARG_our_own_communism: "Наш собственный коммунизм"
 ARG_our_own_communism_desc: "Нам не нужна внешняя помощь или припасы. Наш коммунизм отличается от остального мира, наши люди разные. Мы не можем доверять никому, кроме наших братьев и сестер. Латинская Америка будет объединена с красным баннером, а коммунизм достигнет каждой части региона."
 ARG_join_the_soviets: "Присоединяйтесь к Советам"
 ARG_join_the_soviets_desc: "Советы - это электростанция, просто нельзя отрицать. Они могут помочь нам во многих отношениях, если мы находимся в союзе с ними. Со всеми этими преимуществами, ожидающими у нашего порога, это простой легкий."
 ARG_embrace_socialist_science: "Примите социалистическую науку"
 ARG_embrace_socialist_science_desc: "Прорыв в науке необходим в современную эпоху, которую мы живем, и социализм помог нам до этого момента. Социалистическая наука будет жить вечно!"
 ARG_soviet_economic_aid: "Советская экономическая помощь"
 ARG_soviet_economic_aid_desc: "Наша экономика все еще нуждается в некоторой исправлении, и с промышленной мощью Советского Союза мы легко сможем достичь наших экономических целей. Советы обязательно отправят нам несколько припасов, чтобы повысить нашу экономику."
 ARG_workers_in_the_army: "Рабочие в армии"
 ARG_workers_in_the_army_desc: "Нашим вооруженным силам не хватает надлежащей рабочей силы для наших амбиций. Если мы действительно хотим, чтобы весь континент находился под красным флагом, то нам понадобятся гораздо более сильные вооруженные силы, чтобы осуществить его."
 ARG_spread_the_revolution_to_uruguay: "Распространить революцию в Уругвай"
 ARG_spread_the_revolution_to_uruguay_desc: "Давайте сначала сосредоточимся на нашем ближайшем соседке, разместите революцию на народа Уругвая. Как только мы справимся с этим, мы можем начать сосредоточиться на других углах Латинской Америки и распространять революцию повсюду. Por La Revolución!"
 ARG_the_revolution_beyond_the_andes: "Революция за Андами"
 ARG_the_revolution_beyond_the_andes_desc: "Чили заполнена этими надоедливыми капиталистами, разрушающими нацию. Их нужно научить пути революции. Por La Revolución!"
 ARG_the_bolivian_revolution: "Боливийская революция"
 ARG_the_bolivian_revolution_desc: "Боливийский народ был угнетен слишком долго своим правительством. Пришло время освободить людей и интегрировать их в нашу постоянную борьбу, чтобы распространить революцию!"
 ARG_the_paraguayan_question: "Парагвайский вопрос"
 ARG_the_paraguayan_question_desc: "Парагвайцы были простым вредителем все время, однако они разделяют наши общие убеждения. Хотя оба наши правительства ладят довольно хорошо, не известно, будут ли они заслуживают доверия на 100%. Вот почему мы должны привлечь их под нашу сферу влияния, чтобы быть в безопасности."
 ARG_tackle_the_giant: "Возьмите гигант"
 ARG_tackle_the_giant_desc: "После различных экспансионистских войн у нас есть гигант, чтобы заняться. Все наши войны до сих пор должны были подготовиться к этому столкновению гигантов. Мы постараемся убедиться, что с гигантом справляется, и революция живет!"
 ARG_reorganize_our_new_territories: "Интегрировать наши новые территории"
 ARG_reorganize_our_new_territories_desc: "Благодаря нашему быстрому расширению нашей нации и границ мы внедрили в нашу страну много разных стран, этнических групп и населения. Это может стоить некоторые из наших ресурсов, но это будет стоить в долгосрочной перспективе."
 ARG_push_past_the_northern_andes: "Протолкнуть мимо северных Андов"
 ARG_push_past_the_northern_andes_desc: "У Перу и Эквадора есть фашистское и капиталистическое правительство соответственно. Это позор для этого континента, и они оба будут сразу разобраться. Por La Revolución!"
 ARG_secure_the_oil_fields: "Закрепить северные нефтяные месторождения"
 ARG_secure_the_oil_fields_desc: "Колумбия и Венесуэла богаты нефтью, их нефтяные месторождения являются одними из крупнейших на планете. Не только это, но и их правительства одинаково презренны, и работники требуют освобождения. Por La Revolución!"
 ARG_deal_with_the_corrupt_bourgeoisie: "Иметь дело с коррумпированной буржуазией"
 ARG_deal_with_the_corrupt_bourgeoisie_desc: "Коррупция была для нас серьезной проблемой, проклятые капиталисты и их грязное отмывание денег слишком долго препятствуют правительству. Больше этого позора в нашей стране, мы зайдем в то, чтобы избавиться от этого вредителя."
 ARG_exploit_the_bolivian_tungesten_mines: "Эксплуатировать боливийские вольфрамовые шахты"
 ARG_exploit_the_bolivian_tungesten_mines_desc: "Боливия известна своими обильными вольфрамовыми шахтами. Теперь, когда мы имеем полный контроль над ними, мы можем использовать их до абсолютного максимума и пользоваться всеми преимуществами, которые принесут как нашу экономику, так и торговлю."
 ARG_the_socialist_war_economy: "Военная экономика работника"
 ARG_the_socialist_war_economy_desc: "Рабочие решили, что теперь они являются командными, как и должно быть. Наше вооружение довольно не хватает во многих аспектах, и рабочий класс вмешался и попросил расширить такие, и, как таковые, мы дадим им именно то, что они хотят."
 ARG_the_second_cisplatine_war_focus: "Вторая цисплатиновая война"
 ARG_the_second_cisplatine_war_focus_desc: "После многих десятилетий мира между нашими двумя нациями у нас теперь есть бремя на войне. Кто мы когда -то считали, что наши братья теперь нанесли удар нам прямо в живот по единственной причине личной выгоды. Они будут платить своей кровью, и мы позаботимся о том, чтобы эта война была для нас победой, независимо от того, что нужно."
 ARG_make_an_effort_to_control_the_inflation: "Приложить усилия, чтобы контролировать инфляцию"
 ARG_make_an_effort_to_control_the_inflation_desc: "Понятно, что у нас есть проблема с инфляцией, которую нужно решить. Начиная с сегодняшнего дня, мы будем уделять первоочередную задачу борьбы с инфляцией, потому что нам нужно иметь дело с инфляцией, если хотим справиться с нашей экономической депрессией. Как только мы сделаем оба, наша экономика будет стремительно взлететь!"
 ARG_support_our_growing_industry: "Поддерживать нашу растущую отрасль"
 ARG_support_our_growing_industry_desc: "Наша отрасль должна как можно больше расти, чтобы не только минимализировать эффект, что инфляция оказывает на нашу экономику, но и может даже помочь нам бороться с инфляцией. Сильная экономика поможет нам в долгосрочной перспективе, поэтому любые признаки роста нашей отрасли мы будем полностью поддерживать ее."
 ARG_restrict_the_usage_of_the_dollar: "Ограничить использование доллара"
 ARG_restrict_the_usage_of_the_dollar_desc: "Доллар начинает использовать многие люди в качестве альтернативы нашей валюте. Из -за наших тонких обстоятельств мы должны остановить это и быстро. Если мы сможем это сделать, у нас будет больше шансов остановить инфляцию."
 ARG_fully_adopt_a_contractionary_fiscal_policy: "Принять сокращающую фискальную политику"
 ARG_fully_adopt_a_contractionary_fiscal_policy_desc: "Принятие сокращения фискальной политики поможет нам при борьбе с инфляцией. Мало того, что он купит нам время, но как только он пройдет, многие экономисты все экономисты указывают на то, что он снижает нашу инфляцию, что составляет 2 на 1!"
 ARG_deal_with_the_inflation: "Иметь дело с инфляцией"
 ARG_deal_with_the_inflation_desc: "Условия были выполнены, и части были установлены. Пришло время решать нашу самую большую и самую важную проблему, инфляцию. Как только мы полностью избавимся от этого, мы можем начать сосредоточиться на других частях нашей экономики и по -настоящему стать региональной властью."
 ARG_continue_pushing_north: "Продолжайте толкать на север"
 ARG_continue_pushing_north_desc: "С нашим недавним завоеванием Paraguay мы открыли приятный и широкий фронт с бразильцами. С таким фронтом мы очень легко сможем запустить инвазиону на их территорию и обеспечить их огромные богатства. Мы не должны тратить впустую время!"
 ARG_secure_the_tungsten_mines: "Закрепить вольфрамовые шахты"
 ARG_secure_the_tungsten_mines_desc: "Боливийцы чрезвычайно богаты, когда дело доходит до вольфрама, и большая часть нашего докладчивого оборудования требует, чтобы вольфрам. Было бы очень приятно иметь в наших руках во всем этом вольфраме."
  
  
  
 URG_lessons_of_paso_morlan: "Уроки Пасо Морлана"
 URG_lessons_of_paso_morlan_desc: "Есть много уроков, которые мы можем извлечь из Paso Morlan. Эти уроки могут очень помогать нам в будущем."
 URG_reform_the_high_command: "Реформировать высокое командование"
 URG_reform_the_high_command_desc: "Высокому командованию Уругвайя нуждается в различных реформах, чтобы поддерживать высокий уровень качества, особенно по сравнению с нашими соседями."
 URG_order_new_cannons: "Заказывать новые пушки"
 URG_order_new_cannons_desc: "Наша армия очень выгодно от покупки новых пушек."
 URG_purchase_new_rifles: "Купить новые винтовки"
 URG_purchase_new_rifles_desc: "Наши винтовки довольно устарели. Мы купим новые винтовки, чтобы заменить старые."
 urg_purchase_new_rifles_tt: "Разблокирует: §Ysmall Arms '36 §!"
 URG_foreign_advisors: "Иностранные консультанты"
 URG_foreign_advisors_desc: "Учитывая небольшой размер нашей армии, наличие иностранных консультантов поможет организовать наши военные и планировать заранее, принесет нам большую пользу."
 URG_establish_support_companies: "Создать вспомогательные компании"
 URG_establish_support_companies_desc: "Компании поддержки являются основой многих подразделений. Их не было бы просто глупы."
 URG_escuela_de_ingenieros: "Escuela de Ingenieros del ejército"
 URG_escuela_de_ingenieros_desc: "Наличие и создание школы инженеров для военных значительно продвинет технологии, которые в настоящее время находятся в нашем распоряжении и улучшит нашу армию в целом."
 URG_expand_the_escuela_militar: "Расширить милитара Escuela"
 URG_expand_the_escuela_militar_desc: "Наши солдаты должны быть готовы к суровой реальности, и нет лучшего способа сделать это, чем расширить нашу военную школу."
 URG_CIACA: "Создайте CIACA"
 URG_CIACA_desc: "Создание и создание CIACA позволит нам с большим контролем над нашей армией и поможет ей расширить и модернизировать."
 URG_renovate_CIMA: "Ремонтировать CIMA"
 URG_renovate_CIMA_desc: "CIMA очень устарела, и, учитывая текущее состояние наших вооруженных сил, было бы полезно его ремонт."
 URG_CCTE: "Comisión de ciencia y tecnología del ejército"
 URG_CCTE_desc: "CCTE уже оказал большую помощь в улучшении технологии, доступной нам в армии, и улучшение ее принесет нам пользу только еще больше."
 URG_study_new_armament: "Изучить Новое вооружение"
 URG_study_new_armament_desc: "Мы не можем модернизировать наши вооружения, если мы сначала не изучаем их и не решим, что лучше для нашей армии."
 URG_ECOME: "Нашел Ecome"
 URG_ECOME_desc: "Рало радарная технология может пригодиться для нас, особенно если учесть, что наши соседи во много раз сильнее нас. Ecome поможет нам получить это преимущество против них, если это необходимо."
 URG_expand_pesma: "Расширить Pesma"
 URG_expand_pesma_desc: "Завод PESMA отвечает за большую часть нашего производства оружия, настолько расширяющееся, что было бы логично, учитывая наши растущие военные."
 URG_renovate_colonial_forts: "Ремонтировать колониальные форты"
 URG_renovate_colonial_forts_desc: "Многие форты из испанской колониальной эры остались в нашей стране. Несмотря на то, что они теперь изношены и устарели, мы могли бы приложить усилия, чтобы отремонтировать их и использовать их в случае иностранного вторжения."
 URG_motorization_effort: "Усилия по моторизации"
 URG_motorization_effort_desc: "Моторизованный - будущее транспорта военнослужащих. Лучше извлечь выгоду из этого раньше, чем позже."
 URG_create_the_reserva_naval: "Создать военно -морской флот резервы"
 URG_create_the_reserva_naval_desc: "Наличие запасной морской пехоты в нашем распоряжении может очень удобно в случае, когда земля невозможно осуществить."
 URG_create_the_reserva_naval_tt: "Создает единицу §YMarines§! в Уругвае."
 engineers_tech_bonus: "Инженерное оборудование"
 URG_direccion_de_sanidad: "Dirección de Sanidad"
 URG_direccion_de_sanidad_desc: "Солдатское здоровье очень важно, и мы должны убедиться, что все наши солдаты находятся в пиковых физических возможностях, если мы хотим, чтобы они работали надлежащим образом."
 URG_escuela_de_ingenieros_idea: "ЭСКЕУЛА ДЕГЕНЕРОС"
 URG_foreign_advisors_idea: "Иностранные консультанты"
 URG_anti_tank_equipment: "Противотанковые усилия"
 URG_anti_tank_equipment_desc: "Наши враги могут принести танки в деривационное уравнение, поэтому мы принесем антитанки для интеграции этого уравнения."
 URG_create_the_aeronautica_militar: "Создать милитар Aeronáutica"
 URG_create_the_aeronautica_militar_desc: "Наша воздушная сила почти не существует, поэтому нам нужно создать правильную и расширить ее."
 URG_purchase_british_fighters: "Pruchase British Fighters"
 URG_purchase_british_fighters_desc: "У британцев есть лучшие истребители, которые мы могли бы извлечь большую пользу."
 URG_purchase_french_bombers: "Купить французские бомбардировщики"
 URG_purchase_french_bombers_desc: "Французские бомбардировщики продемонстрировали свое превосходство в воздухе. Получение в руки некоторых из них было бы очень полезным."
 URG_protect_the_skies: "Защитите наше небо"
 URG_protect_the_skies_desc: "Наше небо должно быть защищено любой ценой. Наша нация довольно мала, и если враг доминирует в нашем небе ... ну, давайте просто скажем, что это не будет довольно концом."
 URG_bombard_our_enemies: "Бомбардировать наших врагов"
 URG_bombard_our_enemies_desc: "Наши враги не будут иметь шансов против наших бомбардировщиков! Их кунтри будут обращены в пепел, прежде чем они даже попытаются отправить самолет в нашем воздушном пространстве."
 URG_establish_our_doctrine: "Установить нашу доктрину"
 URG_establish_our_doctrine_desc: "Мы должны поддерживать лояльный до доктрины и следовать за ней, чтобы улучшить нашу тактику и боевые возможности."
 URG_heavy_fighter_effort: "Тяжелые бойцы"
 URG_heavy_fighter_effort_desc: "У тяжелых бойцов есть все преимущества бойца, и даже больше!"
 URG_naval_bomber_effort: "Военно -морские бомбардировщики"
 URG_naval_bomber_effort_desc: "Мы не должны позволять врагам иметь какие -либо шансы на море, поэтому мы уничтожаем их нашими военно -морскими бомбардировщиками!"
 URG_dive_bomber_effort: "Дайв -бомбардировщики"
 URG_dive_bomber_effort_desc: "Близкая воздушная поддержка является ключом к победным битвам. Разработка больше бомбардировщиков дайвинга поможет нам в этом отношении."
 URG_strategic_bomber_effort: "Стратегические бомбардировщики"
 URG_strategic_bomber_effort_desc: "Из всех типов бомбардировщиков стратегические бомбардировщики являются наиболее эффективными в бомбардировочных промышленных точках. Мы могли бы использовать это в нашу пользу, чтобы дестабилизировать экономику наших врагов."
 URG_establish_the_fuerza_aerea: "Создать фурза Аереа"
 URG_establish_the_fuerza_aerea_desc: "Наша воздушная сила выросла до респектабельного размера и может быть, наконец, классифицирована как надлежащие воздушные силы, достойные названия."
 URG_rocket_effort: "Ракетика"
 URG_rocket_effort_desc: "Ракеты - это будущее. Мы воспользуемся ими как можно быстрее."
 URG_new_air_bases: "Создайте новые авиабазы"
 URG_new_air_bases_desc: "Нам понадобятся новые авиабилеты, чтобы поддержать нашу быстро растущую воздушную силу."
 URG_aircraft_innovations: "Авиационные инновации"
 URG_aircraft_innovations_desc: "Новые авиационные технологии выходят каждый год. Эти технологии могут быть очень полезны для нас."
 URG_an_independent_navy: "Независимый военно -морской флот"
 URG_an_independent_navy_desc: "Уругвайский флот не самый большой и не самый мощный, но он все еще очень там и лоялен к флагу. Мы можем приложить усилия, чтобы расширить его и довести его до размера, которые другие страны будут уважать его."
 URG_protect_rio_de_la_plata: "Защитить Рио -де -ла -Плата"
 URG_protect_rio_de_la_plata_desc: "Рио -де -ла -Плата окружает почти все наше побережье, поэтому мы очень уязвимы для любой угрозы, которая может исходить оттуда. Вот почему нам нужно обеспечить его как можно больше, чтобы убедиться, что мы не позволяем этой визитной области."
 URG_power_projection: "Проекция власти"
 URG_power_projection_desc: "Чем больше оружие, тем больше страха мы поместим в наших врагов. Мы не позволим нашим врагам знать что -либо о наших слабостях, и вместо этого сделаем себя как можно большим, чтобы привить страха в них."
 URG_expand_the_SCRA: "Расширить SCRA"
 URG_expand_the_SCRA_desc: "SCRA отвечает за большинство военно -морских производств в стране. Нам нужно инвестировать в это и расширить его, если мы хотим увеличить нашу военно -морскую власть."
 URG_anti_submarine_warfare: "Анти-подключатая война"
 URG_anti_submarine_warfare_desc: "Подводные лодки могут представлять для нас серьезную угрозу, особенно с их способностью оставаться незамеченными и все еще нанести ущерб нашему флоту. Разработка тактики и вооружений против субмаренной войны и вооружением, это не приведет к нам."
 URG_new_naval_cannons: "Новые военно -морские пушки"
 URG_new_naval_cannons_desc: "Чем лучше наши военно -морские пушки, тем больше ущерба мы можем нанести нашим врагам."
 URG_expand_the_merchant_navy: "Расширить торговый флот"
 URG_expand_the_merchant_navy_desc: "Торговые флоты очень полезны в создании капитала. Расширение нашего собственного торгового флота может помочь нам в финансовом отношении."
 URG_mine_warfare: "Шахтная война"
 URG_mine_warfare_desc: "Шахты могут сбросить вражеские суда и декоордировать свои атаки, преимущество, которое нам очень нужно."
 URG_improved_armor: "Улучшенная доспеха сосуда"
 URG_improved_armor_desc: "Улучшение доспехов суда позволило бы нашим судам больше выстрелов и дольше оставаться на плаву, потенциально обеспечивая нам военно -морскую победу, где мы обычно не выходили на первое место."
 URG_improve_the_armamento_naval: "Улучшить военно -морской вооружение"
 URG_improve_the_armamento_naval_desc: "Военно -морской военно -морской военно -морской вооружение нуждается в улучшении, лучше, чтобы они покончили с собой, чем позже."
 URG_purchase_naval_vessels: "Покупать военно -морские суда"
 URG_purchase_naval_vessels_desc: "Вместо того, чтобы производить наши собственные военно -морские суда, мы должны предпочтительнее смотреть за пределы наших границ и покупать иностранные, чтобы увеличить размер нашего флота."
 URG_encourage_tourism: "Поощрять туризм"
 URG_encourage_tourism_desc: "Наша страна не имеет самого большого населения, поэтому поощрение туризма для страны поможет увеличить наше население и расширить нашу рабочую силу."
 URG_form_the_global_anarchist_council: "Сформировать мировой анархистский совет"
 URG_form_the_global_anarchist_council_desc: "Пришло время показать миру, почему анархия является последним блестящим маяком надежды для человечества. Мир будет спасен от ада, который он сейчас проходит!"
 URG_anarchist_takeover: "Анархистское поглощение"
 URG_anarchist_takeover_desc: "С правительством в штатах и ​​людьми, которые изо всех сил пытаются найти какую -либо форму лидерства, возможно, на то время мы поднимаемся, чтобы столкнуться с этой проблемой. Вместо того, чтобы иметь правительство, это должен быть народ Уругвая, возглавляющий страну. Фермеры, рабочие, матери, будущее, люди приведут эту страну к величию!"
 URG_seize_the_means_of_production: "Взять на себя средства производства"
 URG_seize_the_means_of_production_desc: "Средства производства-наш односторонний билет на абсолютный успех. Получение старта в экономических и военных преимуществах наличия таких средств производства принесет нам пользу в долгосрочной перспективе."
 URG_seize_CUTCSA: "Захватить Катча"
 URG_seize_CUTCSA_desc: "Cutsca предлагает транспорт по всей стране. Доступ к таким средствам транспортировки позволит нам развернуть войска, где и когда и всякий раз, наряду с дополнительными экономическими и социальными выгодами."
 URG_legacy_of_batlle_euyl: "Наследие Batlle"
 URG_legacy_of_batlle_euyl_desc: "Бэтлле оставил очень долгосрочное наследие в этой стране, и пришло время, наконец, его мечты осуществили наши собственные средства, перенесему эту страну на высоты, которую она никогда не испытывала раньше!"
 URG_best_of_both_worlds: "Лучшее из обоих миров"
 URG_best_of_both_worlds_desc: "Зачем пользоваться только одной стороной, когда мы можем извлечь выгоду из обоих миров и наслаждаться плодами победы, которые он предлагает."
 URG_communal_collectivisation: "Общая коллективизация"
 URG_communal_collectivisation_desc: "Индивидуально мы ничто, но коллективно, мы не остановимся. Мы уругвайцы MST коллективируем и выступаем, чтобы выдвинуть эту страну вперед и заставить всех нас бояться!"
 URG_protect_our_freedom: "Защитите нашу свободу"
 URG_protect_our_freedom_desc: "Даже во время нашей независимости мы долго и упорно боролись с бразильцами и аргентинцами, чтобы создать независимое государство, и это не меняется: ни тогда, ни сейчас! Мы будем защищать нашу свободу любой ценой!"
 URG_mobilize_workers: "Мобилизовать рабочих"
 URG_mobilize_workers_desc: "Рабочие стремятся присоединиться к фронтанию и с гордостью представлять и защищать свою страну, и мы будем очень рады."
 URG_persuade_batllists: "Убедить паттерны"
 URG_persuade_batllists_desc: "В то время как большинство паттернов находятся на нашей стороне, некоторые все еще ставят под сомнение наши общинные решения и тактику. Для них мы должны просветить их, протянуть руки и направлять их к свету, который сияет нашим ярким будущим, которого можно достичь, если мы все будем работать вместе."
 URG_unchained_minds: "Освободить умы"
 URG_unchained_minds_desc: "Наши умы слишком долго были прикованы безмозглыми политиками и лидерами. Пришло время освободить себя и сделать свой собственный путь, путь людей, путь свободы и процветания, которому абсолютно никто не владеет."
 URG_communal_cooperation: "Коммунальное сотрудничество"
 URG_communal_cooperation_desc: "Как сообщество, уже было показано, что мы можем добиться огромного прогресса. Так что давайте не будем останавливаться сейчас, давайте продолжим, вместе, как команда!"
 URG_prepare_for_the_workers_struggle: "Подготовиться к борьбе работников"
 URG_prepare_for_the_workers_struggle_desc: "Борьба впереди нас очень грубая, и будут очень грубые пятна, но с достаточной решимостью и усилиями мы можем сделать все, что желаем наши сердца, и создать тот мир мечты, который мы все хотим."
 URG_contact_chilean_communes: "Свяжитесь с чилийскими коммуниками"
 URG_contact_chilean_communes_desc: "Наше слово, похоже, распространилось на другие части света, поскольку наши чилийские братья видели свет и усердно работали над тем, чтобы осуществить свои мечты, как и мы. Мы будем сотрудничать, и вместе никто не сможет нас остановить!"
 URG_bear_the_burden: "Нести бремя"
 URG_bear_the_burden_desc: "Бремя наших грехов будет массивным, но свет, освещенный его плоды, будет составлять их все."
 URG_liberate_argentinian_workers: "Освободить аргентинский народ"
 URG_liberate_argentinian_workers_desc: "Аргентинцы боролись достаточно долго. Пришло время привести их к свету и помогать им осуществить мечты, которые у нас есть! Вместе возможно будущее."
 URG_Ley_No_9943: "Лей № 9943"
 URG_Ley_No_9943_desc: "Все граждане Уругвайя клянутся лояльностью флага. Это то, что говорится в законе № 9943 страны Уругвай. Этот закон должен быть внесен в силу, поскольку наш суверенитет находится на ставках!"
 URG_confiscate_enemy_ships: "Конфисковать вражеские суда"
 URG_confiscate_enemy_ships_desc: "Наши враги остаются слишком близко к нашим побережьям. Мы можем воспользоваться этим сценарием, взять некоторые из их кораблей и претендовать на его собственные, и использовать свои собственные суда против них."
 URG_introduce_conscription: "Ввести призыв"
 URG_introduce_conscription_desc: "Обязательный призыв к призывам сейчас вступает в силу! Все, способные служить в армии, будут немедленно вызваны!"
 URG_mobilize_the_economy: "Мобилизовать экономику"
 URG_mobilize_the_economy_desc: "Работайте эти мышцы! Наша страна находится в опасности, и нам нужна каждая чертова, которую мы можем получить здесь! Переместить его!"
 URG_libertad_o_muerte: "Libertad O Muerte!"
 URG_libertad_o_muerte_desc: "То, как наши отцы -основатели воскликнули, когда они боролись за нашу независимость, сегодня мы делаем то же самое, пытаясь сохранить нашу страну и нашу независимость. Итак, все уругвайцы ... Peleamos Hasta La Muerte!"
 URG_finish_the_rincon_del_bonete: "Завершить плотину Rincón del Bonete"
 URG_finish_the_rincon_del_bonete_desc: "Rincon Del Bonete является крупнейшим озером в нашей стране, и установит плотину, которая поможет нам вывести электроэнергию для остальной части страны, наряду со всеми экономическими выгодами, связанными с ней."
 URG_encourage_american_investments: "Поощрять американские инвестиции"
 URG_encourage_american_investments_desc: "Американцы стремятся инвестировать в нашу страну, так почему бы не позволить им."
 URG_american_investments_tt: "Эффекты §Ywill зависят от §Gdiplomatic intations§! с §Cunited stancts§!."
 URG_farming_subsidies: "Сельскохозяйственные субсидии"
 URG_farming_subsidies_desc: "Наши фермеры были основой этой экономики с момента концепции этой страны. Субсидии могут принести большую пользу их производству, и, в свою очередь, принести пользу нашей собственной стране."
 URG_expand_the_rivera_mines: "Расширить шахты Ривера"
 URG_expand_the_rivera_mines_desc: "Ресурсы не обидны в нашей стране, поэтому лучше всего максимально используем то, что имеем, и Eploit IT."
 URG_reform_the_brou: "Реформировать брау"
 URG_reform_the_brou_desc: "Уругвайский национальный банк может использовать некоторые реформы. Это довольно старое и улучшается, это может принести нам очень хорошие преимущества."
 URG_create_the_INC: "Создать INC"
 URG_NOT_undermined_berres_tt: "Не подорвал §Yluis batlle berres§!"
 URG_create_the_INC_desc: "Создание INC принесет пользу нашей экономике и подведет нас на шаг ближе к шумной экономике."
 URG_building_grants: "Обеспечить строительные гранты"
 URG_building_grants_desc: "Если мы хотим поддерживать растущую экономику, нам нужно освободить место в нашей стране, чтобы позволить возможность построить больше заводов."
 URG_state_of_the_economy: "Состояние экономики"
 URG_state_of_the_economy_desc: "Наша экономика наконец достигла стабильной точки. Он растет устойчивым темпом, и наш долг перед британцами, наконец, был окупился. Остается только один вопрос: будем ли мы более промышленно развитая экономика или более ориентированная на сельскохозяйственную экономику?"
 URG_agricultural_economy: "Сельскохозяйственная экономика"
 URG_agricultural_economy_desc: "Сельское хозяйство творило чудеса для нас. Зачем останавливаться сейчас?"
 URG_industrial_economy: "Промышленная экономика"
 URG_industrial_economy_desc: "Индустриализация принесла пользу многим странам в мире, так почему бы не пойти по их стопам."
 URG_expand_the_textile_industry: "Расширить текстильную промышленность"
 URG_expand_the_textile_industry_desc: "Текстильная индустрия является крупной отраслью в нашей стране. Он служит многим целям и генерирует справедливость, помогая нашей экономике. Расширение этой отрасли принесет много преимуществ, как в краткосрочной, так и в долгосрочной перспективе."
 URG_nationalise_foreign_industries: "Национализировать иностранные отрасли"
 URG_nationalise_foreign_industries_desc: "Иностранные отрасли принесли уругвай, но национализация их и создание их наше принесло бы гораздо больше преимуществ и позволит нам иметь больший контроль над ними."
 URG_urbanization_effort: "Урбанизация усилий"
 URG_urbanization_effort_desc: "Нам нужно урбанизировать, если мы хотим идти в ногу с нашей индустриализационной экономикой."
 URG_increase_beef_exports: "Увеличьте наш экспорт говядины"
 URG_increase_beef_exports_desc: "Говядина - один из наших основных экспорта и роскоши. Все по всему миру хотят получить уругвайский говядину. Нам нужно использовать эту потребность и получить как можно больше прибыли."
 URG_open_up_the_economy: "Открыть экономику"
 URG_open_up_the_economy_desc: "Наши культуры должны быть экспортированы в мир, чтобы гарантировать, что деньги входят в страну."
 URG_industrial_agriculture: "Промышленно развитое сельское хозяйство"
 URG_industrial_agriculture_desc: "Вместо того, чтобы строго оставаться в сельском хозяйстве, мы могли бы привлечь некоторые преимущества индустриализации и объединить их с нашей сельскохозяйственной экономикой."
 URG_fate_of_the_welfare_state: "Судьба государства всеобщего благосостояния"
 URG_fate_of_the_welfare_state_desc: "Благосостояние в нашей стране было очень важной темой в экономике Уругвая, и это, которое мы наконец -то решим, что делать точно. Какой бы выбор мы ни принимали сейчас, будет сформировать нашу экономику в течение длительного времени."
 URG_fray_bentos_corned_beef: "Bray Bentos Corned Beef"
 URG_fray_bentos_corned_beef_desc: "Fray Bentos - очень важная продовольственная компания, происходящая из города Фрай Бентос в Уругвае. Мы решаем перспективы этой экономики и должны ли мы ее экспортировать или просто держать ее в стране."
 URG_mass_production: "Массовое производство оружия"
 URG_mass_production_desc: "Нам понадобится много оружия, чтобы поддерживать растущую армию, поэтому давайте производим столько, сколько сможем, даже если нам нужно немного дешево."
 URG_quality_control: "Ввести контроль качества"
 URG_quality_control_desc: "Вместо массового производства оружия, давайте убедитесь, что они имеют высочайшее качество и гарантируют, что каждый солдат получает лучшее оружие, даже если это потребуется немного для их производства."
 URG_create_the_armoured_corps: "Создать бронированную корпус"
 URG_create_the_armoured_corps_desc: "Уругвайская армия в основном состоит из пехотных полков, но предложение бронированной корпорации принесет большую глубину в армию и значительно улучшит ее."
 URG_mechanizing_the_troops: "Механизация войск"
 URG_mechanizing_the_troops_desc: "Механизированное будущее. Лучше всего воспользоваться этим."
  
  
 URG_purchase_naval_vessels_tt: "Завершение этого фокуса предоставит §Ysmall fleet§! §Cdestroyers and Cruisers§!. Тем не менее, это будет §R.take toll§! на нашем §Yeconomy§!."
 URG_go_with_terra: "Пойти с Террой"
 URG_go_with_terra_desc: "С тех пор, как предполагая президентство в марте 1931 года, страна находилась как в мире, так и в стабильности. Различные экономические реформы и проекты оказались успешными для уругвайской экономики, и Terra запланирована гораздо больше. Лучше всего мы остаемся с ним и позволили Терре полностью управлять нацией, так как он делал это до этого момента."
 URG_go_against_terra: "Иди против Терры"
 URG_go_against_terra_desc: "Терра достаточно долго терроризировала людей! Мы не можем просто позволить ему продолжать заключать в тюрьму этих невинных людей без всякой причины. Его преступления продолжались достаточно долго, пришло время положить конец его тирании!"
 URG_strengthen_the_ANCAP: "Укрепить ANCAP"
 URG_strengthen_the_ANCAP_desc: "ANCAP (Short For Administación Nacional de Gubustibles, алкоголь Y Portland) - это нефтяная промышленность, созданная в 1931 году Габриэлем Терра. Он играет очень важную роль в уругвайской экономике, поддерживая монополии в бухтах и ​​добывая топливо в нашей стране. Предоставление ему больше власти в стране, скорее всего, принесет положительные изменения."
 URG_build_the_teja_refinery: "Построить нефтеперерабатывающий завод Teja"
 URG_build_the_teja_refinery_desc: "Некстояние Teja было первым и единственным нефтеперерабатывающим заводом, построенным в Уругвае, чтобы извлечь еще большую нефть в стране. Наши вооруженные силы, скорее всего, понадобятся топливо в ближайшем будущем, поэтому, если это дополнительное топливо, приходящее в правильное, наша территория будет очень полезно."
 URG_build_up_our_industry: "Создать нашу отрасль"
 URG_build_up_our_industry_desc: "Уругвайский промышленный сектор уже является одним из самых сильных в Латинской Америке, несмотря на наши размеры, так почему бы не расширить его еще дальше. Большая власть в промышленном секторе будет означать более сильную экономику и доступность для расширения и планов на будущее."
 URG_open_up_our_foreign_policy: "Откройте нашу внешнюю политику"
 URG_open_up_our_foreign_policy_desc: "Мы уже давно закрыты от большинства глобальных дел, мы должны изменить это и открыть себя для политики за границей."
 URG_contact_german_officials: "Свяжитесь с немецкими чиновниками"
 URG_contact_german_officials_desc: "Немцы очень умны во многих различных секторах, экономике, армии, воздухе и т. Д. Их советники очень помогут нам в экономическом и военном отношении, но сейчас их экономические консультанты будут делать великие. Связывание с ними не только поможет нам, но и откроет ссылки с немцами, если они когда -либо понадобятся в будущем."
 URG_repay_our_debt_to_the_british: "Погасить наш долг британцам"
 URG_repay_our_debt_to_the_british_desc: "Наш долг растут слишком долго, и теперь он достигает точки, что это задыхает нашу экономику. Мы должны иметь дело с этим и быстро, поэтому давайте свяжемся с англичанами и заверим их, что мы начнем платить за долг."
 URG_construct_the_rincon_de_bonote: "Построить Rincón del Bonete"
 URG_construct_the_rincon_de_bonote_desc: "Rincón del Bonete - это скрытый завод в Уругвае, причем он спрашивает, чтобы быть соседними городами и некоторыми цититами. Он был прогнозирован немецким инженером Адольфо Лудином, поэтому для нас было хорошо связаться с немцами, потому что, если бы мы не были бы, этот проект был бы намного сложнее."
 URG_placate_to_the_allies: "Улатать к союзникам"
 URG_placate_to_the_allies_desc: "Союзники - спасители демократии, хорошие парни планеты. Хотя они могут быть не самыми лучшими, нельзя отрицать, что они лучше, чем ось, когда дело доходит до мира. Создание дружеских связей с союзниками проведет нас долгий путь, поэтому мы не должны тратить эту возможность."
 URG_placate_to_the_axis: "Уловить к оси"
 URG_placate_to_the_axis_desc: "Между осью или союзниками нет конкуренции. Ось очень быстро приобрела огромное количество энергии, в то время как союзники просто сидели там и ничего не сделали. Если между ними когда -либо будет фактический конфликт, то это так же ясно, как дневной свет, ось победит, так что наставление с ними - явный выбор."
 URG_give_more_power_to_the_military: "Дайте больше власти военным"
 URG_give_more_power_to_the_military_desc: "Военные - это то, что диктует силу нации, это то, что поддерживает нацию, и что позволяет ей получить больше власти. Нашим военным не хватает этого Стрегнта, но это изменится, начиная с сегодняшнего дня!"
 URG_overthrow_terras_regime: "Свергнуть режим Терры"
 URG_overthrow_terras_regime_desc: "Приготовления были сделаны, фашизм достиг во всех частях страны. Пришло время поставить Терру на его место и по -настоящему управлять страной железным кулаком. Уругвай будет и не будет рассматриваться как незначительная сила, мы достигнем вершины, независимо от того, как!"
 URG_consolidate_power: "Консолидировать власть"
 URG_consolidate_power_desc: "Терра чувствовала, что не повредит нашей стране достаточно, поэтому он решил объединиться со своими верными сторонниками и полностью уничтожить нацию. Со всем, что он пытается провести нас, это действительно заставляет вас думать, поддерживает ли он эту страну. Не имеет значения, в конце концов мы полностью отремонтируем нацию и децимамте все и все сторонники терра, даже если это означает, что это будет разливать кровь других уругвайцев."
 URG_march_to_the_capital: "Марш в столицу"
 URG_march_to_the_capital_desc: "Пришло время вернуть себе капитал, мы должны убедиться, что Терра не получила лучших из нас! Мы должны убедиться, что мы победили его повсюду и убедиться, что страна остается стоять. Пересмотр столицы покажет не только уругвайцы, но и мир, в котором мы можем возглавить эту страну, и мы приведем ее к славе."
 URG_march_to_paysandu: "Март на север"
 URG_march_to_paysandu_desc: "Северная часть Уругвая все еще находится в твердом контроле над Террой, и мы позаботимся о том, чтобы это не долго. Наши солдаты будут идти на север и уничтожить любых сторонников Terra, которые осмеливаются блокировать свой путь!"
 URG_focus_on_external_matters: "Посмотрите наружу"
 URG_focus_on_external_matters_desc: "Теперь, когда мы стабилизировали нашу страну, пришло время раз и навсегда разобраться с протестами и начинаем смотреть за пределы наших границ. Оба наши соседи являются двумя сильнейшими способностями в Южной Америке, поэтому любое расширение за пределами наших границ будет трудным, но у нас есть трюк, который может просто работать."
 URG_roosevelts_visit_to_uruguay: "Визит Рузвельта в Уругвай"
 URG_roosevelts_visit_to_uruguay_desc: "Президент Франклин Делано Рузвельт отправился в путешествие по всей Южной Америке, посетив каждую страну в Южной Америке. Одной из этих наций будет Уругвай, и мы обязательно получим его с открытыми руками. Наличие США в качестве союзника является и может быть большим преимуществом для нас и поможет нам очень поможет."
 URG_open_our_markets: "Откройте наши рынки"
 URG_open_our_markets_desc: "Несмотря на то, что нам нечего предложить, какая -то страна может быть просто нуждаться в наших ресурсах и товарах, и мы позаботимся о том, чтобы они получили как можно больше. Наша экономика скоро вспыхнет благодаря всем нашим изменениям."
 URG_reform_the_constitution: "Реформировать конституцию"
 URG_reform_the_constitution_desc: "То, как конституция структурирована, просто не работает в современную эпоху Уругвай. Реформирование его принесет хорошие изменения в нацию и позволит ему переключаться и формироваться с нынешней политической ситуацией в стране. Мы покажем миру, что мы развиты, и современная страна с надлежащими правами и свободами."
 URG_rule_with_an_iron_fist: "Править железным кулаком"
 URG_rule_with_an_iron_fist_desc: "Свобода? Свобода? Это просто не работает, и это было совершенно ясно со всей политической напряженностью во Франции, Великобритании и США. Людям нужен сильный и могущественный лидер, чтобы возглавить их, и мы обязательно дадим им именно это. Наша страна будет царствовать с чистой мощностью и правильным лидерством!"
 URG_allow_free_elections: "свободные выборы"
 URG_allow_free_elections_desc: "Терра сделала Enoguh для нации, он поднял ее и теперь готов позволить людям принять решение о своем следующем лидере и оставаться с Колорадо или переключиться на Nacionales. Независимо от того, что люди выберет, это будет для большего и лучшего будущего для Уругвая."
 URG_economic_liberites_for_all: "Экономические свободы для всех"
 URG_economic_liberites_for_all_desc: "Люди могут и должны быть допущены на все, что они хотят с их деньгами. Личная справедливость должна быть собственностью человека, а не государства, и если это когда -либо происходит, мы не можем считать себя «истинной демократией»."
 URG_improve_our_research: "Улучшить наше исследование"
 URG_improve_our_research_desc: "Наша научная команда хороша, но это может быть лучше. Улучшение нашего научного сектора может помочь нам в будущем, с новыми технологическими прорывами и в целом, станут более подходящей страной."
 URG_build_up_the_military: "Создать военные"
 URG_build_up_the_military_desc: "Нам понадобится сильная армия, чтобы контролировать наше население. В настоящее время то, как стоят наши вооруженные силы, просто недостаточно, чтобы не отставать от требований управления страной железным кулаком, так что воля и должна быть изменена как можно скорее."
 URG_expand_our_conscription: "Расширить наш призыв"
 URG_expand_our_conscription_desc: "Нашим числам не хватало с момента создания нашей страны. У нас нет такого большого населения, поэтому мы должны убедиться, что мы можем призвать столько, сколько мы можем, чтобы иметь шанс, если нам когда -нибудь придется справиться с внешней угрозой."
 URG_adopt_an_aggresive_foreign_policy: "Принять агрессивную внешнюю политику"
 URG_adopt_an_aggresive_foreign_policy_desc: "То, что находится за пределами наших границ, является не чем иным, как варварским. Этим людям нужно надлежащее руководство, и мы дадим им любые необходимые средства. Мы окружены врагами, и мы должны убедиться, что мы получили первый удар."
 URG_join_the_allies_euyl: "Присоединяйтесь к союзникам"
 URG_join_the_allies_euyl_desc: "Давайте сделаем это официальным, пришло время спросить британцев, сможем ли мы присоединиться к союзникам. Они являются спасительной миростью в этом мире, а теплбсоны немцев разрушают жизнь миллионов и бросают мир хаоса. Мы должны предоставить союзникам как можно больше нашей поддержки."
 URG_maintain_neutrality: "Поддерживать нейтралитет"
 URG_maintain_neutrality_desc: "Независимо от того, что происходит за пределами наших границ, мы должны убедиться, что мы оставались вне этого. Война только нарушает гармонию, в которой мы живем, и поддержка любой стороны вызовет немедленную ненависть другой стороны, что мы не можем себе позволить в этот момент."
 URG_join_the_axis: "Присоединяйтесь к оси"
 URG_join_the_axis_desc: "Немцы сильнее, чем когда -либо, и страх, который союзники испытывают, дает это совершенно ясно. Давайте сделаем нашу поддержку и спросим немцев, сможем ли мы присоединиться к оси. Мир сгорает, и лучше всего мы выбираем победную сторону этой войны."
 URG_our_own_way: "Наш собственный путь"
 URG_our_own_way_desc: "Забудьте союзников и оси, их альянсы в лучшем случае стоят грязи. Если мы действительно хотим выделиться на мировой арене, мы должны идти своим путем и создавать свой собственный союз. Сами сами со странами, которым мы доверяем, и не зависим от других стран. Мы являемся лидерами нашей собственной судьбы, и мы проясним это для всех наших соседей."
 URG_prepare_to_go_to_war_with_argentina: "Приготовьтесь пойти на войну с Аргентиной"
 URG_prepare_to_go_to_war_with_argentina_desc: "Мы не какая -то «мятежная провинция», и мы проясним это как день для аргентинцев. Мы покажем им нашу военную мощь, и когда мы пойдем на войну, мы выйдем на вершину, независимо от обстоятельств!"
 URG_treaty_with_the_argentines: "Договор с аргентинцами"
 URG_treaty_with_the_argentines_desc: "Наши люди почти идентичны, у нас очень похожие культуры и очень хорошо ладили. Какой смысл иметь Аргентину в качестве врага, когда мы можем иметь их в качестве союзника? Давайте отправим им мирное соглашение, чтобы обеспечить мир между нашими двумя странами."
 URG_prepare_our_plan: "Подготовьте наш план"
 URG_prepare_our_plan_desc: "Серьезно ли аргентинцы верят, что мы сами пойдем против них? Что ж, позвольте им продолжать думать, что они будут далеко не счастливы, когда поймут, что Бразилия поможет нам благодаря тому же договору, который позволил нашу независимость. Любая из двух стран, которые вмешиваются в Уругвай, заставит другую нацию вмешаться и помогать нам."
 URG_launch_the_plan: "Запустите план"
 URG_launch_the_plan_desc: "Подготовка была сделана, взрывчатые вещества были установлены, теперь нам просто нужно ждать, пока транспортные грузовики с взорвались некоторых из своих солдат. Мы сделаем это аргентинцем как преднамеренной атакой, но для остального мира как ужасная авария. Если все пойдет хорошо, они объявят нас войной, и бразильцы помогут нам. С нашими объединенными силами аргентинцы не имеют шансов!"
 URG_mobilize_the_reserves: "Мобилизовать резервы"
 URG_mobilize_the_reserves_desc: "Война быстро доказывает, что требуется большое количество людей в поле, и очевидно, что у нас не хватает мужчин в поле, чтобы конкурировать с аргентинцами, поэтому мы будем мобилизовать резервы как можно скорее."
 URG_fully_mobilize_our_economy: "Полностью мобилизуйте нашу экономику"
 URG_fully_mobilize_our_economy_desc: "Мы не можем еще больше расслабиться, экономика должна быть полностью для военных усилий, все наши ресурсы должны идти на нашу войну с Аргентиной. Мы должны выиграть эту войну, несмотря ни на что, и полная мобилизация экономики даст нам преимущество в нашей войне, и мы сможем выйти на первое место."
 URG_ask_paraguay_to_join_the_war: "Попросите Paraguay вступить в войну"
 URG_ask_paraguay_to_join_the_war_desc: "Новый фронт был бы очень полезен прямо сейчас, и мы знаем, что Парагвай очень наслаждается некоторой компенсацией земли, когда мы закончим войну против Аргентины. Конечно, они примут, и при этом мы будем этой войной еще быстрее. Наши союзники на севере будут видны за истинную силу, которую они позиционируют."
 URG_split_up_argentina: "Разделил Аргентину"
 URG_split_up_argentina_desc: "Теперь, когда мы хорошо и по -настоящему победили Аргентину, мы можем работать над разделением Аргентины, чтобы каждый получил количество земли, которых они заслуживают. Мы получим все провинции риоплатенса, Бразилия получит миссии, корриента, и Аргентина станет бразильским спутником. Если Парагвай также является частью войны, они получат Формозу. Конечно, Бразилия сначала должна согласиться с этими условиями, поэтому будем надеяться, что они это сделают."
 URG_economic_pact_with_argentina: "Взаимная мобилизация с Аргентиной"
 URG_economic_pact_with_argentina_desc: "Мы можем многому научиться у экономики Аргентины, плюс нам обоим нужно расширить наши военные. Что может быть лучше, чем взаимно мобилизование нашей экономики, чтобы подготовиться к любой потенциальной войне в будущем."
 URG_prepare_for_an_inevitable_conflict: "Подготовиться к неизбежному конфликту"
 URG_prepare_for_an_inevitable_conflict_desc: "Это MROE, чем апартана, на планете скоро возникнет конфликт, и мы должны убедиться, что мы можем быть готовы к тому, когда это произойдет. Мы не можем и не будем расслабиться дальше."
 URG_backstab_the_brazilians: "Backstab Бразильцев"
 URG_backstab_the_brazilians_desc: "Soory Brazil, но с той властью, которую мы имеем сейчас, вы конкурируете с нами, и мы не можем этого разрешить. Мы будем южноамериканской властью, мы будем страной, чтобы представлять Южную Америку, а не Бразилию. Вива Уругвай!"
 URG_allience_with_the_brazilians: "Альянс с бразильцами"
 URG_allience_with_the_brazilians_desc: "Бразильцы - это электростанция, и наличие их на нашей стороне было бы удивительно. С нами двумя на одной лодке мы были бы не остановить. Ни одна другая нация не будет стоять на нашем пути к славе!"
 URG_study_the_british_navy: "Изучить британский флот"
 URG_study_the_british_navy_desc: "Британцы, несомненно, являются королями этой планеты, когда дело доходит до флота. Королевский флот переживал так много разных вещей, которые все время существовали, и благодаря этому он достиг вершины всех военно -морских рейтингов. Мы можем выучить много вещей из этого большого флота благодаря тому, чтобы быть в союзе с англичанами."
 URG_a_mighty_industry: "Могущественная индустрия"
 URG_a_mighty_industry_desc: "Индустрия, это приводит ко многим великим вещам для нации. Наши должны быть могущественными, тот, который может перевернуть ход войны, если это необходимо. Для могущественной индустрии!"
 URG_strengthen_economic_liberties: "Укреплять экономические свободы"
 URG_strengthen_economic_liberties_desc: "Каждого мужчины и женщин не следует судить и не предотвратить использование этих денег каким -либо образом, формой или формой, и Вей позаботится о том, чтобы это уважалось не только от правительства, но и людей. Экономическая либерализация может и поможет нам стать региональной властью."
 URG_expand_our_armories: "Расширьте наши арсенали"
 URG_expand_our_armories_desc: "Сильные военные - это то, что приводит к мощной нации, а мощная нация - это то, что приводит к лучшему качеству жизни. Однако, чтобы получить сильные военные, нам нужно иметь сильную индустрию вооружений, и поэтому мы сосредоточимся на ее расширении."
 URG_steel_for_our_forces: "Сталь для наших сил"
 URG_steel_for_our_forces_desc: "Наша страна заполнена различными стальными шахтами, которые могут значительно помочь нашим вооружению, чтобы улучшить наши военные. Мы не будем больше ждать и использовать нашу сталь до его абсолютного предела."
 URG_a_modern_uruguayan_economy: "Современная уругвайская экономика"
 URG_a_modern_uruguayan_economy_desc: "После различных реформ, многочисленных промышленных расширений и экспансий арсенала мы теперь можем официально сказать, что у нас очень современная экономика. С современной экономикой мы теперь можем смотреть наружу, за пределами наших собственных границ и искать новых союзников или новых врагов."
 URG_break_all_ties_with_the_axis: "Разбейте все связи с осью"
 URG_break_all_ties_with_the_axis_desc: "Ось АХЕВ нарушила так много именных законов, что на данный момент она смущает, что у нас все еще есть какой -либо контакт с ними. Мы остановим это прямо сейчас, и с этого момента мы не примем никакого взаимодействия с каким -либо из членов оси."
 URG_go_after_the_germans: "Последовать за немцами"
 URG_go_after_the_germans_desc: "Немцы продолжали достаточно долго, пришло время продемонстрировать нашу полную поддержку союзникам в этой войне и объявлять войну немцам. Хотя мы не сможем сделать многое, мы все равно будем помогать всеми возможными способами в союзных усилиях против оси."
 URG_go_after_paraguay: "Иди после Парагва"
 URG_go_after_paraguay_desc: "Парагвайцы представляют идеалы, которые не могут длиться на нашем прекрасном континенте. Мы должны убедиться, что они удаляются с карты с помощью нашего нового аргентинского союзника. К победе!"
 URG_expand_the_universities: "Расширить Udelar"
 URG_expand_the_universities_desc: "Наш главный университет хорош, но это может быть лучше. Небольшая программа расширения для расширения Udelar позволит большему количеству наших людей получить надлежащее образование."
 URG_begin_undoing_what_terra_did: "Начните отменять то, что сделала Terra"
 URG_begin_undoing_what_terra_did_desc: "Терра разрушил эту страну своими программами и реформами. Те, кто поддерживает Терру, слепы к фактам, их эго ослепило их от истины. Пришло время начать уничтожать то, что Терра сделала как единое население."
 URG_reestablish_the_parliament: "Восстановить парламент"
 URG_reestablish_the_parliament_desc: "Парламент был распущен в 1933 году, прошло 4 года с момента его роспуска, и это не может продолжаться. Давайте восстановим парламент и перераспределим власть в правительстве, чтобы Терра больше не могла просто делать все, что он хочет, и люди, наконец, могут иметь Avoice после почти 6 лет диктатуры."
 URG_maintain_a_powerful_economy: "Поддерживать мощную экономику"
 URG_maintain_a_powerful_economy_desc: "Экономика - это то, что держит народ на плаву, это то, что позволяет людям жить правильной жизнью, и это то, что определяет силу нации. Чем сильнее наша экономика, тем сильнее будет наша страна, и чем более сильна страна, тем больше уважение, которое мы получим от других стран, особенно от Аргентины и Бразилии."
 URG_invest_in_the_military: "Инвестировать в военные"
 URG_invest_in_the_military_desc: "Военные - очень важная ветвь нашей страны. Мы не инвестировали в это так много, как сразу же, настолько эффективно, что больше нашей экономики будет зарезервировано для армии."
 URG_modernizing_the_army: "Модернизация армии"
 URG_modernizing_the_army_desc: "Более сильная военная требует современной армейской тактики. Наши вооруженные силы проведут надлежащее обучение, и мы будем и выиграем любую будущую битву, которая появится на нашем пути."
 URG_build_up_a_navy: "Создать военно -морской флот"
 URG_build_up_a_navy_desc: "Наш флот сильно не хватает, особенно по сравнению с нашими соседями. Нам нужно начать догонять и быстро, если мы хотим иметь шанс на войну в море."
 URG_modernize_our_light_ships: "Модернизируйте наши легкие корабли"
 URG_modernize_our_light_ships_desc: "Понятно, что мы не сможем вовремя производить большой линкора или супер -носителя, поэтому вместо этого давайте сосредоточимся на том, что мы можем произвести. Если мы получим приличный большой флот маленьких кораблей, мы могли бы просто выиграть войну в море против нашего врага."
 URG_build_up_an_airforce: "Создать воздушную силу"
 URG_build_up_an_airforce_desc: "До сих пор у нас не было подходящей воздушной силы. У нас не было никаких врагов, поэтому содержание воздушной силы было совершенно бесполезно. Однако, поскольку мир быстро нагревается, кажется, что эта риторика не продлится намного дольше, и нам понадобится сильная воздушная сила."
 URG_modernize_our_airforce: "Модернизируйте нашу воздушную силу"
 URG_modernize_our_airforce_desc: "Теперь, когда у нас есть надлежащая воздушная сила, мы должны приложить усилия, чтобы модернизировать ее. Чем более современные наши самолеты, тем больше края у нас против наших врагов."
 URG_focus_on_tanks: "Сосредоточьтесь на танках"
 URG_focus_on_tanks_desc: "Новая концепция, которая была приведена к концу Второй мировой войны, использование танков в войне, похоже, будет новым способом войны. Быстрые ощущения, штурмовая фронтальные линии и окружают врагов. Мы хотим в этом, и для этого мы должны сосредоточиться на производстве резервуаров."
 URG_produce_more_tanks: "Производить больше танков"
 URG_produce_more_tanks_desc: "Если у нас есть мощное производство резервуаров, мы можем накачать их ежедневно, и если мы сможем совершить такой подвиг, то наши враги не будут иметь шанса."
 URG_a_modern_armed_forces: "Современные вооруженные силы"
 URG_a_modern_armed_forces_desc: "После различных реформ и учебных программ наши вооруженные силы могут действительно считаться «современными». Сильные вооруженные силы означает сильную амри, и с этим мы можем выполнить наши самые большие амбиции."
 URG_set_free_all_the_prisoners: "свободно важные заключенные"
 URG_set_free_all_the_prisoners_desc: "С нашими нынешними ресурсами мы просто не можем освободить всех заключенных, но мы можем позволить себе освободить некоторых из самых важных политических деятелей в тюрьме прямо сейчас. Чем раньше мы это сделаем, тем лучше и чем более слабым режимом Терры."
 URG_repay_the_british_debt: "Погасить наш долг британцам"
 URG_repay_the_british_debt_desc: "Наш долг растут слишком долго, и теперь он достигает точки, что это задыхает нашу экономику. Мы должны иметь дело с этим и быстро, поэтому давайте свяжемся с англичанами и заверим их, что мы начнем платить за долг."
 URG_imprison_Terra: "Тюремное заключение Терра"
 URG_imprison_Terra_desc: "Все приготовления были сделаны, пришло время сделать окончательный шаг и заключить в тюрьму Terra. Нет никакой альтернативной вселенной, где его сторонники не будут подниматься, однако мы рассмотрим это восстание для блюда на нации и будущего Уругвая!"
 URG_the_will_of_the_people: "Воля народа"
 URG_the_will_of_the_people_desc: "Демократия - это хорошая идеология, позволяющая людям иметь свои собственные взгляды/мнения, и делиться ими публично - это то, что должна предложить каждая страна. Фашизм внедряет людей, коммунизм делает то же самое, монархия - это просто дешевая диктатура, но демократия отличается. Демократия продвигается, и мы примем эту идеологию."
 URG_a_new_path: "Новый путь"
 URG_a_new_path_desc: "Вниз с капиталистическими свиньями! Вниз с фашистскими банками! Вниз с монархистской грязью! Путь Карла - единственный путь, и мы уверем, что остальная часть континента более чем ясна с этой концепцией!"
 URG_recover_from_the_civil_war: "Оправиться от гражданской войны"
 URG_recover_from_the_civil_war_desc: "Гражданская война сильно поразила нашу нацию, и наше нынешнее государство далеко не добра. Вот почему нам нужно приложить усилия, чтобы оправиться от беспорядка, с которой нам приходилось иметь дело, и заверить любую другую страну, наблюдая за нами, что мы не только полностью восстановимся, но и станем более сильнее, чем раньше!"
 URG_contact_the_west: "Свяжитесь с западом"
 URG_contact_the_west_desc: "Запад - это спасающая мировая благодать, это то, что приведет мир к миру и, надеюсь, решает большинство глобальных проблем. Обращение к ним и установление дружеских отношений с ними поможет Гуранти в их новом и лучшем мире."
 URG_invest_in_our_companies: "Инвестировать в наши компании"
 URG_invest_in_our_companies_desc: "Наличие сильных компаний поможет нашей экономике и улучшит ее функции как в стране, так и в обществе. Не только это, но и, укрепляя компании, нам не нужно беспокоиться о том, чтобы вмешаться в экономику, так же, как и раньше. Конечно, мы должны беспокоиться о монополиях, но до тех пор, пока существует конкуренция, наша экономика взлетит."
 URG_privatize_our_industry: "Приватизировать нашу отрасль"
 URG_privatize_our_industry_desc: "Давайте сделаем еще один шаг вперед и приватизируем нашу отрасль. Государство больше не должно иметь никакого контроля над неисзимостью, и именно люди и коорпорации должны контролировать этот сектор. Приватизация нашей отрасли не позволит нам вмешиваться непосредственно в отрасль, но мы сможем «направлять» наши компании делать то, что мы хотим."
 URG_keep_our_ecconomy_the_way_it_is: "Держите нашу экономику таким, какой она есть"
 URG_keep_our_ecconomy_the_way_it_is_desc: "Наша экономика в порядке, как сейчас она стоит, в то время как приватизация может быть хорошей в долгосрочной перспективе, пока сейчас лучше, чтобы государство все еще мог вмешаться в экономику и управлять отраслью."
 URG_side_with_the_allies: "Присоединяйтесь к союзникам"
 URG_side_with_the_allies_desc: "Давайте сделаем это официальным, пришло время спросить британцев, сможем ли мы присоединиться к союзникам. Они являются спасительной миростью в этом мире, а теплбсоны немцев разрушают жизнь миллионов и бросают мир хаоса. Мы должны предоставить союзникам как можно больше нашей поддержки."
 URG_stay_within_the_continent: "Оставаться на континенте"
 URG_stay_within_the_continent_desc: "Нет необходимости открывать себя для иностранных держав и европейского влияния. Мы можем провести безопасность демократии на нашем континенте, и мы сделаем именно это. Никакая другая идеология не должна угрожать демократии в Южной Америке!"
 URG_remove_fascism_from_the_continent: "Удалить фашизм с континента"
 URG_remove_fascism_from_the_continent_desc: "Фашизм не останется на нашем прекрасном континенте. Давайте убедимся, что, начиная с сегодняшнего дня, мы начнем удалять фашизм с континента и показать всем силу демократии и свободной воли."
 URG_remove_communism_from_the_continent: "Удалить коммунизм с континента"
 URG_remove_communism_from_the_continent_desc: "Коммунизм - это такой же позор, как и фашизм, и обе идеологии не должны оставаться на нашем великом континенте. Обе идеологии будут побеждены, как только возможно, и демократия преобладают!"
 URG_studying_the_british_navy: "Изучить британский флот"
 URG_studying_the_british_navy_desc: "Британцы, несомненно, являются королями этой планеты, когда дело доходит до флота. Королевский флот переживал так много разных вещей, которые все время существовали, и благодаря этому он достиг вершины всех военно -морских рейтингов. Мы можем выучить много вещей из этого большого флота благодаря тому, чтобы быть в союзе с англичанами."
 URG_invite_other_south_american_democracies: "Пригласить другие южноамериканские демократии"
 URG_invite_other_south_american_democracies_desc: "Нам нужно расширить нашу фракцию, если мы хотим иметь шанс против этих фашистских и коммунистических бамбей. На нашем континенте есть другие страны, которые разделяют те же идеалы, что и наши, и нам нужно объединиться для хорошего континента."
 URG_strengthen_our_military: "Укрепить наши военные"
 URG_strengthen_our_military_desc: "Нам понадобятся мощные военные, если мы хотим достичь наших амбиций. Наши соседи очень сильны, и их будет трудно снять, если у нас нет мощной стоячей армии."
 URG_all_adults_must_serve: "Все взрослые должны служить"
 URG_all_adults_must_serve_desc: "Каждый взрослый мужчина, живущий в этой стране, должен служить для вооруженных сил. Ни у кого нет оправдания, если они не служат, то они будут плевать на гордость страны и действительно не будут считаться уругвайцами."
 URG_secure_the_paraguayan_alliance: "Закрепите парагвайский альянс"
 URG_secure_the_paraguayan_alliance_desc: "Парагвайцы, хотя они не разделяют те же идеалы, что и мы, имеют аналогичные амбиции для нас. Я думаю, что они были бы более чем рады быть в союзе с нами и объединиться против Аргентины."
 URG_attack_the_argentines: "Атаковать аргентинцы"
 URG_attack_the_argentines_desc: "Пришло время изменить курс истории, как мы ее знаем. Мы завоеваем Аргентину, мы можем покорить остальное, простые. Аргентинцы собираются ожесточать ожесточенное сопротивление, но с достаточным количеством смелости и военной силы мы можем победить их."
 URG_desperate_mobilization: "Отчаянная мобилизация"
 URG_desperate_mobilization_desc: "Наша экономика должна мобилизоваться и быстро, чтобы не отставать от требований войны. Мы должны мобилизовать экономику, просто нет другого пути вокруг нее."
 URG_mutual_military_mobilization: "Взаимная военная мобилизация"
 URG_mutual_military_mobilization_desc: "Обе наши страны должны мобилизоваться, чтобы не отставать от требований войны против аргентинцев. Если мы оба мобилизуем взаимозаменяемые, то мы оба получим бенфит, и это сделает войну легче для нас обоих."
 URG_march_to_buenos_aires: "Марш в Буэнос -Айрес"
 URG_march_to_buenos_aires_desc: "Буэнос -Айрес - это сердце Аргентины, это то, что поддерживает экономику аргентинцы. Их капитал является символом национального единства для аргентинцев, и если мы поймаем это, то их чувство национального единства будет рухнуть, а викотри будет для нас."
 URG_strengthen_our_relations_with_paraguay: "Укрепить отношения с парагваем"
 URG_strengthen_our_relations_with_paraguay_desc: "Парагвайцы зарекомендовали себя как достойный союзник. Давайте убедимся, что мы укрепим наши отношения с ними и сотрудничаем в будущем."
 URG_backstab_the_paraguayans: "Backstab парагвайцев"
 URG_backstab_the_paraguayans_desc: "Парагвайцы всерьез поверили, что их вопиющий капитализм просто будет проигнорирован. Ну, они ждет сюрприз, потому что наши силы будут в ближайшее время в их столице. Вива Уругвай!"
 URG_go_after_the_brazilians: "Идти за бразильцами"
 URG_go_after_the_brazilians_desc: "Мы не останавливаемся в просто аргентинском, мы идем до конца. Бразилия следующая в списке, и они будут побеждены нашими силами. Коммунизм должен распространяться на каждый угол этого континента!"
 URG_integrate_entre_rios: "Интегрировать Entre Rios"
 URG_integrate_entre_rios_desc: "Entre Rios очень близок к нашей стране, как географически, так и в культурном отношении. Они самая легкая провинция для нашей страны. Если мы их интегрируем, другие окружающие провинции также будут склонны присоединиться к нам."
 URG_civilian_factories: "Гражданские фабрики"
 URG_civilian_factories_desc: "Гражданские фабрики являются ключом к национальной индустрии, чем больше у нас есть, тем больше и сильнее мы будем, и чем больше это поможет нам в долгосрочной перспективе."
 URG_military_factories: "Военные фабрики"
 URG_military_factories_desc: "Военные фабрики - это то, что производит наше оборудование для наших солдат. Чем больше у нас заводов, тем больше, тем больше нашей армии, и тем сильнее мы будем в целом."
 URG_a_country_of_intellectuals: "Страна интеллектуалов"
 URG_a_country_of_intellectuals_desc: "Есть много интеллектуалов, разбросанных по всей нашей стране, и мы должны использовать их в полной мере, чтобы помочь нам с нашими личными амбициями."
 URG_declare_war_on_the_germans: "Объявить войну немцам"
 URG_declare_war_on_the_germans_desc: "Немцы представляют угрозу для этой планеты, им нельзя разрешить оставаться на этой карте. Мы обязательно повернем весы в сторону, которые противоречат фашистским мочам и по -настоящему избавились от фашизма."
 URG_improve_our_resource_extraction: "Улучшить нашу извлечения ресурсов"
 URG_improve_our_resource_extraction_desc: "Наша нация не имеет слишком много ресурсов, особенно по сравнению с нашими соседями. Вот почему мы должны сосредоточиться на извлечении как можно большего количества ресурсов, которые у нас есть, чтобы мы могли, по крайней мере, иметь шанс на мировом рынке."
 URG_build_up_the_steel_plants: "Создать сталелитейные заводы"
 URG_build_up_the_steel_plants_desc: "Наши стальные шахты отсутствуют в их нынешнем состоянии, и наша страна более чем способна производить большее количество стали, чем то, что она в настоящее время производит."
 URG_prepare_the_uruguayan_army: "Подготовьте уругвайскую армию"
 URG_prepare_the_uruguayan_army_desc: "Нашей армии в его нынешнем государстве недостаточно для наших будущих усилий, поэтому нам нужно начать наращивать нашу армию и по -настоящему выделяться в Южной Америке."
 URG_ramp_up_the_military_production: "Увеличить военное производство"
 URG_ramp_up_the_military_production_desc: "С растущей армией нам понадобится растущая индустрия, чтобы поддержать ее. Наши заводы по оружию требуют дальнейших инвестиций, чтобы мы могли довести его до приемлемого статуса."
 URG_economic_cooperation_with_our_allies: "Экономическое сотрудничество с нашими союзниками"
 URG_economic_cooperation_with_our_allies_desc: "Постоянный альянс требует мощных членов, составляющих этот альянс. Мы можем начать экономически сотрудничать с нашими союзниками и не только повысить их экономику, но и повысить нашу значительную прибыль."
 URG_purchase_british_ships: "Покупать британские корабли"
 URG_purchase_british_ships_desc: "Британцы - военно -морской электростанцию, просто нельзя отрицать. Теперь, когда мы находимся в союзе с ними и имеем надлежащую экономику, мы могли бы попытаться купить некоторые из их кораблей и улучшить свой собственный флот."
 URG_form_the_rioplatense_empire: "Сформировать империю риоплатенса"
 URG_form_the_rioplatense_empire_desc: "Наши границы достигли далеко за пределы того, что мы когда -либо ожидали, доказывая себя как грозной нации. Теперь пришло время сделать еще один шаг вперед и установить самую первую империю на этом континенте!"
 URG_calm_down_the_officers: "Успокаивать офицеров"
 URG_calm_down_the_officers_desc: "Некоторые из наших офицеров мы не все это поддерживаем идею объединения нашей территории и начали восстать против нашей суверенной нации. Мы должны убедиться, что мы успокоим их, если мы не хотим, чтобы плохие вещи произошли."
 URG_restabilize_the_currency: "Восстановить валюту"
 URG_restabilize_the_currency_desc: "Внезапное объединение нашей нации вызвало серьезную волну на нашем рынке, и наша валюта значительно не стабилизировалась. Мы должны убедиться, что он стабилизируется еще раз, чтобы мы продолжали заниматься другими вопросами."
 URG_expand_beyond_our_borders: "Расширяться за пределы наших границ"
 URG_expand_beyond_our_borders_desc: "Наши нынешние границы хороши, но мы можем продвинуться еще дальше. Мы должны убедиться, что все наши соседи боятся нас, и лучший способ сделать это - военная мощь! Они увидят, они все увидят!"
 URG_gain_the_edge: "Получить преимущество"
 URG_gain_the_edge_desc: "Некоторые из наших соседей довольно сильны, поэтому нам понадобится каждое небольшое преимущество, которое мы сможем получить, чтобы заставить их встать на колени, прежде чем наше доклад может и наш славный флаг!"
 URG_integrate_our_conquered_lands: "Интегрировать наши завоеванные земли"
 URG_integrate_our_conquered_lands_desc: "Расширение нашей территории так быстро значительно уточняет нашу нацию. Мы должны убедиться, что мы интегрируем территорию и людей в нашу страну как можно быстрее, чтобы укрепить нашу нацию."
 URG_reform_the_liga_federal: "Реформировать федеральный"
 URG_reform_the_liga_federal_desc: "Федеральная лига, также известная как Лига свободных народов, была альянсом провинций в том, что сейчас является Уругваем, Аргентиной и Бразилии, направленным на создание Конфедеральной организации для государства, которое вышло из майской революции. Благодаря нашему внезапному росту власти, мы вполне можем и по -настоящему сможем установить эту потерянную республику еще раз."
 URG_solidify_our_current_borders: "Затвердеть наши нынешние границы"
 URG_solidify_our_current_borders_desc: "Мы уже зарекомендовали себя как региональная сила, было бы глупо пролить больше крови на бессмысленную территорию. Теперь мы должны работать над укреплением наших нынешних границ и стабилизации нашей страны."
 URG_maintain_peaceful_relationships: "Поддерживать мирные отношения"
 URG_maintain_peaceful_relationships_desc: "Мир и процветание идут рука об руку. Если мы сохраняем мирные отношения со всеми, мы обязательно будем расти как нация."
 URG_solidify_our_industry: "Властись нашей отрасли"
 URG_solidify_our_industry_desc: "Сильная отрасль приводит ко многим улучшениям во всех аспектах нашей страны, поэтому было бы разумно его создать и укрепить ее."
 URG_join_the_british: "Присоединяйтесь к англичанам"
 URG_join_the_british_desc: "Британцы помогали нам раньше, и теперь пришло время вернуть услугу и помочь им, даже если это не слишком много."
 URG_join_the_germans: "Присоединяйтесь к немцам"
 URG_join_the_germans_desc: "Хотя это может показаться глупым, сражение с немцами может забрать нас довольно далеко. Даже с нашими разными идеалами мы можем заставить что -то работать."
 URG_join_the_soviets: "Присоединяйтесь к Советам"
 URG_join_the_soviets_desc: "Советы могут быть довольно огромной помощью как в военном, так и в экономическом отношении. С нашими подобными идеалами это должна быть прогулка для торта, чтобы попасть в Коммерс."
  
  #Ecuador 
  
 ECU_army_effort: "Армейские усилия"
 ECU_army_effort_desc: "Несмотря на растущие возможности воздушной и военно -морской войны, наземные бои все еще являются ключом к завтрашним войнам. При подготовке мы можем избежать переживания чертовски траншей."
 ECU_equipment_effort: "Усилия по оборудованию"
 ECU_equipment_effort_desc: "Пределы того, какое оборудование может быть переносится пехотой, постоянно выдвигаются. Мы сосредоточимся на том, чтобы дать нашим войскам лучшие инструменты."
 ECU_motorization_effort: "Усилия по моторизации"
 ECU_motorization_effort_desc: "Мобильность и защита имеют решающее значение, чтобы безопасно добраться до пехоты на поле и за ее пределами. Сосредоточение внимания на этих событиях позволит нам быстро принять меры."
 ECU_doctrine_effort: "Учение усилия"
 ECU_doctrine_effort_desc: "Военные доктрины, которые определили наземные боя в Великой войне, устарели. Мы должны поместить наши величайшие умы к задаче формирования военной мысли о завтрашнем дне."
 ECU_equipment_effort_2: "Усилия по оборудованию II"
 ECU_equipment_effort_2_desc: "Мы продолжим наши усилия по обеспечению того, чтобы наши пехотные и поддержки войска были вооружены наилучшим оборудованием нашего времени."
 ECU_mechanization_effort: "Усилия механизации"
 ECU_mechanization_effort_desc: "Переосмысление возможностей моторизованной пехоты, мы можем раздвинуть границы того, какие транспортные средства могут быть построены сегодня."
 ECU_doctrine_effort_2: "Учение усилия II"
 ECU_doctrine_effort_2_desc: "Поле битвы изменилось не только в межбеллельные годы, но и в течение недавних конфликтов. Мы должны постоянно переоценивать наши доктрины, чтобы отразить это."
 ECU_equipment_effort_3: "Усилия по оборудованию III"
 ECU_equipment_effort_3_desc: "Вместо того, чтобы подражать или покупать иностранное оборудование, мы должны стремиться стать ведущим в мировом виде в пехотном оружии."
 ECU_armor_effort: "Броня усилий"
 ECU_armor_effort_desc: "Применяя то, что мы узнали из механизации нашей пехоты, мы также можем улучшить наши бронированные автомобили."
 ECU_special_forces: "Спецназ"
 ECU_special_forces_desc: "Нам нужны элитные силы; Горные войска и десантники должны быть нашим приоритетом."
 ECU_aviation_effort: "Авиационные усилия"
 ECU_aviation_effort_tt: "Недостаточно слотов для строительства для §Yair base §!"
 ECU_aviation_effort_desc: "Нигде технологические достижения более быстрые, чем в воздушной войне. Авиация - это область, которую должна освоить любая современная нация."
 ECU_fighter_focus: "Истребитель фокусировки"
 ECU_fighter_focus_desc: "Мы не видели этого последнего боя в Великой войне. Будучи вперед в разработке истребительных самолетов, даст нам преимущество в будущем."
 ECU_bomber_focus: "Фокус бомбардировщика"
 ECU_bomber_focus_desc: "Когда люди будущего говорят об ужасе на сегодняшние войны, будет заметно пожар с неба. Мы сделаем все возможное, чтобы эти истории рассказали эти истории."
 ECU_aviation_effort_2: "Авиационные усилия II"
 ECU_aviation_effort_2_desc: "Дальнейшие достижения в области авиации будут необходимы для хорошей интеграции наших ВВС с другими ветвями военных."
 ECU_CAS_effort: "CAS усилие"
 ECU_CAS_effort_desc: "Современная армия нуждается в поддержке транспортных средств не только на земле, но и в воздухе."
 ECU_rocket_effort: "Ракетная работа"
 ECU_rocket_effort_desc: "Ракетные и реактивные двигатели позволяют обеспечить беспрецедентные скорости как для беспилотных, так и для пилотируемых судов. Новатор этих технологий позволит нам застать врага врасплох."
 ECU_NAV_effort: "Навие усилия"
 ECU_NAV_effort_desc: "Так же, как новая военно -морская война происходит частично под поверхностью воды, часть ее происходит в воздухе над водами."
 ECU_naval_effort: "Военно -морские усилия"
 ECU_naval_effort_tt: "Недостаточно слотов для строительства для §Ynaval Dockyards§!"
 ECU_naval_effort_desc: "Расширение нашего флота должно быть нашим первым приоритетом. Назначьте все доступные ресурсы новым верфи и исследовать на световых поверхностных кораблях."
 ECU_GER_naval_effort2: "Расширить объекты верфи"
 ECU_GER_naval_effort2_desc: "Чтобы по -настоящему перестроить флот, достойный примечания, мы должны значительно расширить наши способности судостроения."
 ECU_flexible_navy: "Гибкий флот"
 ECU_flexible_navy_desc: "Изобретение военно -морской войны для учета достижений в подводных технологиях позволит нам эффективно нанести удар по вражеским конвоя."
 ECU_large_navy: "Большой флот"
 ECU_large_navy_desc: "Адаптация наших военно -морских доктрин для размещения больших кораблей и обеспечения безопасности наших торговых конвоя многому научит нас о том, какие суда нам нужны."
 ECU_submarine_effort: "Подводные усилия"
 ECU_submarine_effort_desc: "Подводная война является наиболее захватывающим военно -морским развитием с момента изобретения торпедной лодки. Мы преуспели бы не только защитить от подводных лодок, но и использовать их против вражеского доставки."
 ECU_cruiser_effort: "Крейсер усилие"
 ECU_cruiser_effort_desc: "Прежде чем совершать набеги в расширенное исследование линкора, меньшие крейсеры нуждаются в замене."
 ECU_destroyer_effort: "Усилие разрушителя"
 ECU_destroyer_effort_desc: "Изучая дизайн и стратегическое использование подводных лодок, мы также узнали, как противостоять этим стратегиям. Разрушители будут иметь решающее значение для этого."
 ECU_capital_ships_effort: "Капитальный корабль усилия"
 ECU_capital_ships_effort_desc: "Нация с самым линейным кораблем будет править океанами. Линкофты и носители представляют старое и новое в военно -морском превосходстве."
 ECU_industrial_effort: "Промышленные усилия"
 ECU_industrial_effort_desc: "Сосредоточьтесь на всех наших политических усилиях на создании гражданской индустрии на большом скачке вперед."
 ECU_industrial_effort_2: "Промышленные усилия II"
 ECU_industrial_effort_2_desc: "С Железной волей и неустанной трудовой этикой мы можем мобилизовать людей в другом великом промышленном усилиях."
 ECU_construction_effort: "Строительные усилия"
 ECU_construction_effort_tt: "Недостаточно слотов для строительства для §Ycivilian factory§!"
 ECU_construction_effort_desc: "Гражданские промышленные возможности не должны недооценивать, даже когда война вырисовывается по всему миру."
 ECU_production_effort: "Усилие вооружения"
 ECU_production_effort_tt: "Недостаточно слотов для строительства для §Ymilitary Factory§!"
 ECU_production_effort_desc: "Если вы можете построить тракторы, вы можете построить резервуары! Мы не должны допускать, чтобы наши военные производственные мощности отстали."
 ECU_construction_effort_2: "Строительные усилия II"
 ECU_construction_effort_2_desc: "Продолжение расширения наших заводов позволит нам ускорить производство товаров для торговли и дальнейших строительных усилий."
 ECU_production_effort_2: "Усилие вооружения II"
 ECU_production_effort_2_desc: "Попытка адаптировать гражданские фабрики для производства военной техники неэффективны. Мы должны сосредоточиться на подготовке военного производства сейчас."
 ECU_production_effort_3: "Усилие вооружения III"
 ECU_production_effort_3_desc: "Постоянные усилия по расширению наших военных фабрик необходимы для удовлетворения требований нового оборудования."
 ECU_infrastructure_effort: "Инфраструктурные усилия"
 ECU_infrastructure_effort_desc: "Страна без надлежащей инфраструктуры не может заниматься продвинутыми проектами или строительствами."
 ECU_infrastructure_effort_tt: "Недостаточно слотов для строительства для §YInfrastructure§!"
 ECU_synth_oil_effort_tt: "Недостаточно слотов для строительства для §Yсинтетического нефтепереработки"
 ECU_infrastructure_effort_2: "Инфраструктурные усилия II"
 ECU_infrastructure_effort_2_desc: "Расширение нашей инфраструктуры дополнительно позволит транспортировке и коммуникациям, необходимым для высокотехнологичных тайных проектов."
 ECU_construction_effort_3: "Строительные усилия III"
 ECU_construction_effort_3_desc: "Расширение нашей инфраструктурной сети значительно улучшило наши возможности для строительства."
 ECU_nuclear_effort: "Ядерные усилия"
 ECU_nuclear_effort_desc: "Стоя на краю изменяющего мира открытия, мы не можем позволить другим зажечь огонь, который может однажды потреблять землю."
 ECU_extra_tech_slot: "Дополнительный исследовательский слот"
 ECU_extra_tech_slot_desc: "Наша промышленная экспансия и другие недавние достижения могут позволить нам проводить больше исследований и разработок параллельно."
 ECU_extra_tech_slot_2: "Дополнительный исследовательский слот II"
 ECU_extra_tech_slot_2_desc: "Быстрая индустриализация нашей страны открыла новые возможности в исследованиях и разработках, которые мы должны продолжать."
 ECU_technology_sharing: "Обмен технологиями"
 ECU_technology_sharing_desc: "Поделившись технологическими достижениями с нашими союзниками, вся наша фракция сможет более эффективно проводить исследования в военном времени."
 ECU_secret_weapons: "Секретное оружие"
 ECU_secret_weapons_desc: "Заманчиво тратить все дополнительные ресурсы на разработку танков и самолетов, но секрет победы в войнах заключается в совершенно новых областях науки; Электроника, ракетология и ядерные исследования."
 our_rival: "Наш соперник"
 our_enemy: "Наш враг"
 ECU_spike_tensions_with_PERU: "Развивайте напряженность с peru"
 ECU_spike_tensions_with_PERU_desc: "Разжигая напряженность с нашим соседом, мы можем объединить наших людей и более совместимы с нашим штатом."
 ECU_spike_tensions_with_PERU_2: "Оличить против перуанской угрозы!"
 ECU_spike_tensions_with_PERU_2_desc: "Война с Перу уверена, и мы должны действовать соответственно ..."
 ECU_continue_where_Ayora_left_off: "Продолжить, где остановилась Айора"
 ECU_continue_where_Ayora_left_off_desc: "Политика Исидро Айоры очень помогла нашей стране. Мы должны следовать по его пути, чтобы дальше разработать Эквадор."
 ECU_pander_to_left: "Потворствовать левым"
 ECU_pander_to_left_desc: "При поддержке левых мы можем достичь наших целей."
 ECU_pander_to_right: "Пандера правым"
 ECU_pander_to_right_desc: "При поддержке левых мы можем достичь наших целей."
 ECU_create_the_labor_code: "Установить трудовой кодекс"
 ECU_create_the_labor_code_desc: "Укрепляя права работников, мы можем заставить их поддержать нас."
 ECU_silence_the_far_left: "Замолчать радикальный левый"
 ECU_silence_the_far_left: "Радикальные левые являются экзистенциальной угрозой для нашей нации. С ними должны быть разбираются."
 ECU_prop_up_small_business: "Опора малого бизнеса"
 ECU_prop_up_small_business_desc: "Малый бизнес заставляет основу любой экономики. Мы должны укрепить их."
 ECU_produce_cocoa_plants: "Производить больше какао"
 ECU_produce_cocoa_plants_desc: "Мы известны своим производством какао. Укрепление этого сектора принесет огромную пользу нам."
 ECU_grow_more_bananas_and_plantains: "Производить больше бананов и бананов"
 ECU_grow_more_bananas_and_plantains_desc: "Наши бананы и производство подорожника конкурируют с теми, кто в Центральной Америке. Укрепление этого сектора принесет огромную пользу нам."
 ECU_nationalize_our_oil: "Национализируйте нашу нефть"
 ECU_nationalize_our_oil_desc: "Национализируя нашу нефть, мы можем дополнительно увеличить сумму, которую мы можем предоставить."
 ECU_increase_our_global_trade: "Увеличьте нашу глобальную торговлю"
 ECU_increase_our_global_trade_desc: "Создавая себя на мировом рынке, принесет здесь больше капитала."
 ECU_extract_more_of_our_oil: "Извлекать больше нашего масла"
 ECU_extract_more_of_our_oil_desc: "Мы нашли способ извлечь больше масла! Это принесет большое богатство нашей стране!"
 ECU_liberty_for_the_people: "Свобода для наших людей!"
 ECU_liberty_for_the_peopl_desc: "Свобода и свобода должны быть до всего остального, наши люди должны быть свободны, чтобы мы могли процветать!"
 ECU_SSI: "Установить социальное обеспечение"
 ECU_SSI_desc: "Социальное обеспечение является неотъемлемым человеческим правом, которое должен иметь наши люди!"
 ECU_Modus_Vivendi_with_the_holy_see: "Modus vivendi со святым Престолом"
 ECU_Modus_Vivendi_with_the_holy_see_desc: "Крайне важно, чтобы мы укрепляли связи со Священным Престолом."
  
  #Peru 
  
 PRU_repairing_the_nation: "Ремонт нации"
 PRU_repairing_the_nation_desc: "Наша нация пострадала во всех аспектах. Наша политическая, экономическая и военная сила рухнула. Поскольку óscar возглавлял нашу нацию еще несколько лет, мы надеемся, что мы сможем начать исцелять под его девизом «Порядок, мир и работа»."
 PRU_naval_buildup_in_callao: "Военно -морское наращивание Каллао"
 PRU_naval_buildup_in_callao_desc: "Наш флот был уничтожен после войны в Тихом океане, и с тех пор наш военно-морской флот не смог вернуться к своей передовой силе. Построив эти военно -морские верфи и базы в Каллао, мы можем это изменить."
 PRU_import_designs_from_foreigners: "Импорт военно -морской конструкции от иностранцев"
 PRU_import_designs_from_foreigners_desc: "Военно -морские силы глобальных держав объективно сильнее наших, мы должны делать заметки из их работы."
 PRU_work_with_the_japanese: "Работать с японцем"
 PRU_work_with_the_japanese_desc: "Японский флот заставил тех, кто сталкивается с этим, сжиматься в страхе, мы должны работать с этой растущей сверхдержавой."
 PRU_work_with_the_americans: "Работать с американцами"
 PRU_work_with_the_americans_desc: "У американцев есть и все еще являются одним из самых сильных военно -морских сил в мире, мы должны продолжать работать с нашим американским союзником."
 PRU_our_own_ships: "Наши собственные корабли"
 PRU_our_own_ships_desc: "Вместо того, чтобы учиться на сегодняшних силах, мы должны делать заметки о неудачах нашего флота во время войны в Тихом океане."
 PRU_strength_in_numbers: "Сила в числах"
 PRU_strength_in_numbers_desc: "Наш маленький, но сильный флот был уничтожен чилийцами во время войны. Вместо этого мы должны использовать более мелкие и более дешевые корабли, чтобы иметь преимущество цифр против врага."
 PRU_our_navy_reborn: "Наш военно -морской флот возрождается"
 PRU_our_navy_reborn_desc: "Несмотря на многие проблемы, нам удалось возродить наш разрушенный флот. Как и Феникс, поднимающийся из пепла, наш военно -морской флот возродился и теперь готов встретиться с миром."
 PRU_strengthen_the_army: "Укрепить армию"
 PRU_strengthen_the_army_desc: "Поскольку мир, кажется, становится все более хаотичным с каждым днем, становится все более ясно, что мы должны сосредоточиться на дальнейшей развитии нашей армии."
 PRU_purchase_modern_arnaments: "Купить современные вооружения"
 PRU_purchase_modern_arnaments_desc: "Чтобы иметь современную армию, нам нужно современное оружие. Мы можем решить эту проблему, импортируя оружие от американцев."
 PRU_prepare_for_a_potential_war: "Подготовиться к потенциальной войне"
 PRU_prepare_for_a_potential_war_desc: "Мы окружены потенциальными врагами. Мы должны подготовиться к борьбе с ними, если дипломатия подведет нас еще раз."
 PRU_the_1933_constitution...: "Какая наша нация?"
 PRU_the_1933_constitution..._desc: "Наша нация была под многими флагами и формами правительства. Пришло время решить, как мы управляем раз и навсегда."
 PRU_a_presidential_republic: "Президентская республика"
 PRU_a_presidential_republic_desc: "Мы - президентская республика, где власть находится в нашем избранном лидере."
 PRU_the_best_of_both_worlds: "Лучшее из обоих миров"
 PRU_the_best_of_both_worlds_desc: "Почему мы должны придерживаться строго президентской или парламентской республики? Вместо этого мы должны регулировать использование преимуществ обеих систем."
 PRU_a_parliamentary_republic: "Парламентская республика"
 PRU_a_parliamentary_republic_desc: "Мы являемся парламентской республикой, где власть находится в нашем парламенте."
 PRU_ban_socialism: "Запретить интернационалистские вечеринки"
 PRU_ban_socialism_desc: "APRA уже давно была шипучкой на нашей стороне, когда интернационалистские партии теперь неконституционны, мы должны воспользоваться возможностью избавиться от них."
 PRU_oppress_the_communists: "Угнетать экстремистов"
 PRU_oppress_the_communists_desc: "Экстремистское мышление представляет угрозу для нашего государства. Их сила и влияние здесь должны быть ослаблены любым способом."
 PRU_strengthen_civil_liberties: "Укрепить гражданские свободы"
 PRU_strengthen_civil_liberties_desc: "Многие авторитарные государства угнетают своих людей, чтобы служить им. Тем не менее, мы знаем, что противоположное должно быть так, государство всегда должно служить своим людям."
 PRU_the_will_of_the_people: "Воля людей"
 PRU_the_will_of_the_people_desc: "Воля перуанского народа должна быть известна и представлена!"
 PRU_deal_with_the_economic_turmoil: "Иметь дело с экономическими беспорядками"
 PRU_deal_with_the_economic_turmoil_desc: "Хотя Великая депрессия не оказала на нас, как это было на наших соседей, она все равно оказала негативное влияние на нашу экономику. Мы должны исправить это, как только сможем."
 PRU_continue_with_the_gold_standard: "Продолжайте"
 PRU_continue_with_the_gold_standard_desc: "Мы должны продолжать следить за советом Эдвина Кеммерера и придерживаться золотого стандарта."
 PRU_return_to_a_fiat_currency: "Вернуться в фиатную валюту"
 PRU_return_to_a_fiat_currency_desc: "Нам больше не нужно золото, чтобы сохранить нашу экономику стабильно, поскольку наше правительство стабилизировалось, мы можем использовать нашу валюту с нашим правительством."
 PRU_improve_relations_with_the_US: "Улучшить отношения с Соединенными Штатами"
 PRU_improve_relations_with_the_US_desc: "Мы должны дополнительно связываться с американцами с целью продвижения нашего экономического развития."
 PRU_create_the_pan_american_highway: "Создать панамериканское шоссе"
 PRU_create_the_pan_american_highway_desc: "Создавая панамериканское шоссе, мы можем дальнейший экономический рост и процветание в регионе."
 PRU_the_bedrock_of_south_america: "Переланка Южной Америки"
 PRU_the_bedrock_of_south_america_desc: "Нам не нужно американцы, чтобы рассказывать нам, как управлять нашими экономическими делами. Мы доказали это с успехом нашей фиатной валюты, и мы стали оплотом экономического успеха, которым хотят стать другие."
 PRU_improve_the_central_highway: "Улучшить центральное шоссе"
 PRU_improve_the_central_highway_desc: "Центральное шоссе соединяет наше побережье с нашими тропическими лесами на востоке. Мы можем извлечь выгоду только путем дальнейшего развития дороги."
 PRU_strengthen_our_mining_industries: "Усилить наш горнодобывающий сектор"
 PRU_strengthen_our_mining_industries_desc: "Наш горнодобывающий сектор производит различные сокровища, которые хотят иностранцы. Мы должны расширить этот сектор, чтобы развивать нашу экономику."
 PRU_strengthen_our_agrarial_industries: "Укрепить наш сельскохозяйственный сектор"
 PRU_strengthen_our_agrarial_industries_desc: "Наш сельскохозяйственный сектор производит различные культуры, которые хотят иностранцы. Мы должны расширить этот сектор, чтобы развивать нашу экономику."
 PRU_expand_our_armaments: "Расширить наши вооружения"
 PRU_expand_our_armaments_desc: "Мы не должны зависеть от других, чтобы вооружить наших солдат. Это должны быть наши оружейные патроны, которые вооружают наших солдат нашим оружием, нашей гордостью, нашим обязательством, прямо здесь, на нашей родной земле."
 PRU_build_up_the_economy: "Создать экономику"
 PRU_build_up_the_economy_desc: "Теперь, когда наша валюта была стабилизирована, мы можем начать сосредоточиться на действительно расширении нашей отрасли и экономики. Чем сильнее наша экономика, тем лучшие шансы у нас будут в любом будущем конфликте."
 PRU_increase_worker_salaries: "Увеличить зарплату работников"
 PRU_increase_worker_salaries_desc: "Перуанский работник работает почти весь день каждый день и платит жалкую зарплату. Это не может продолжаться в нашей модернизированной экономике, и поэтому их зарплата должна быть увеличена, даже если это означает, что коммунисты воспользуются ситуацией, чтобы расширить свою идеологию."
 PRU_strengthen_the_power_of_our_currency: "Усилить покупательную способность нашей валюты"
 PRU_strengthen_the_power_of_our_currency_desc: "Со стабильной валютой мы можем начать укреплять ее покупательную способность. Чем сильнее наша валюта, тем богаче будет наше общее население, и тем больше будет наша экономика."
 PRU_allow_foreign_subsidies: "Разрешить иностранные субсидии"
 PRU_allow_foreign_subsidies_desc: "Эффекты наших соседей находятся в хорошей форме, и иметь хорошие отношения с ними позволит инвесторам из своих стран инвестировать в нашу экономику и субсидировать наши отрасли."
 PRU_fuerzas_armadas: "Фуэрзас Армадас Перуанас"
 PRU_fuerzas_armadas_desc: "Перуанские вооруженные силы увидели много конфликтов и испытали из первых рук опыт войны и страданий, особенно в унизительном поражении против Чили во время войны с Тихого океана. Мы почистим это пятно от нашей записи и приведем Перу во славу!"
 PRU_ejericto_peruano: "Эль Эйерсито Перуано"
 PRU_ejericto_peruano_desc: "Перуанская армия находится в довольно сомнительном состоянии. Многие сектора армии обратились к фашистам и поддерживают немецкий режим, в то время как есть еще несколько секторов, которые наряду с Западом. В любом случае, наша армия должна быть укреплена в случае любого будущего конфликта."
 PRU_ramp_up_our_armories: "Наращивайте наши арсенала"
 PRU_ramp_up_our_armories_desc: "Хорошая армия требует большого арсенала, и для того, чтобы приобрести такой, нам нужно расширить наши арс -арс -АС. Военно -морской флот разозлит такое решение, но нам нужно, если это означает защиту нашего суверенитета."
 PRU_modernize_our_weapons: "Модернизируйте наше оружие"
 PRU_modernize_our_weapons_desc: "Каждый солдат в поле должен держать и использовать оружие, и если мы действительно хотим одержать верх над врагом, нам нужно иметь верхнюю часть линии, современные Wepons."
 PRU_modernize_our_tanks: "Модернизируйте наши танки"
 PRU_modernize_our_tanks_desc: "Tank Warfare - очень новая концепция в войне, которая используется основными державами мира. Если мы сможем стать первым в регионе, который овладел этим новым типом войны, то никто не сможет нам бросить вызов."
 PRU_recruit_new_generals: "Найдите новых генералов"
 PRU_recruit_new_generals_desc: "Наша армия не хватает генералов, у нас не было много со времен Конфедерации, но это изменится, начиная с сегодняшнего дня."
 PRU_modernize_our_artillery: "Модернизируйте нашу артиллерию"
 PRU_modernize_our_artillery_desc: "Наши люди драгоценны, но наши пули дешевы. Сосредоточение внимания на нашей артиллерии и наличие технологического преимущества заставит нас далеко в любом будущем конфликте, в котором мы можем оказаться."
 PRU_marina_de_guerra_del_peru: "Марина де Герра дель Перу"
 PRU_marina_de_guerra_del_peru_desc: "Перуанский флот определенно не то, чем когда -то был. С момента нашей потери в войне Тихого океана наш флот никогда не был прежним. К счастью, он несколько выздоровел, но ему еще предстоит пройти долгий путь, прежде чем он действительно восстановится."
 PRU_extend_naval_training: "Расширить военно -морское обучение"
 PRU_extend_naval_training_desc: "Наш военно -морской флот нуждается в обучении, наши адмиралы должны изучать правильную тактику, чтобы мы могли начать восстанавливать истинную силу нашего военно -морского флота. Как только мы это сделаем, мы действительно сможем соревноваться в гонке военно -морских вооружений Южной Америки."
 PRU_build_up_a_carrier_fleet: "Создать флот с носителем"
 PRU_build_up_a_carrier_fleet_desc: "Перевозчики - довольно недавняя технология в нашем мире. Использование портативных аэропортов и военно -морских самолетов не пересекло умы многих до недавнего времени, и если мы сможем сначала освоить это, то у нас будет преимущество в наших южноамериканских соревнованиях."
 PRU_modernize_our_battleships: "Модернизируйте наши линкоры"
 PRU_modernize_our_battleships_desc: "Линкоры - одни из самых сильных типов кораблей, это то, что сделка поражает вражеские военно -морские силы, и наличие некоторых в нашем арсенале является абсолютной необходимостью."
 PRU_modernize_our_subs: "Модернизируйте наши подводные лодки"
 PRU_modernize_our_subs_desc: "Подводные лодки дешевы и легко в MKE, и при правильном использовании могут быть очень смертоносной силой. Может быть, мы не должны сосредоточиться на больших кораблях, но, возможно, на маленьких кораблях и массово расширять наш военно -морской арсенал."
 PRU_improve_our_dockyard_building: "Улучшить наше здание отчителя"
 PRU_improve_our_dockyard_building_desc: "Верты - это то, что производит корабли, это то, что делает военно -морской флот. Налив крупную отрасль на строительные суда, у нас будет большой флот в кратчайшие сроки."
 PRU_build_up_our_universities: "Создать университеты"
 PRU_build_up_our_universities_desc: "Чем умнее наше население, тем больше возможностей мы получим модернизацию и становясь сильной силой, но для того, чтобы люди стали SMRTER, нам нужно улучшить наше редакцию."
 PRU_cuerpo_de_aviacion_del_peru: "Cuerpo de aviación del perú"
 PRU_cuerpo_de_aviacion_del_peru_desc: "Перуанская воздушная сила, возможно, является самым слабым из трех ветвей. Все еще не полностью организованный, мы должны убедиться, что мы укрепляем его как можно скорее."
 PRU_modernize_our_fighters: "Модернизируйте наших бойцов"
 PRU_modernize_our_fighters_desc: "Бойцы являются основным типом самолета, когда дело доходит до здоровой воздушной силы. Если у нас могут быть современные бойцы перед кем -либо еще, то никто не сможет бросить нам вызов в небе."
 PRU_modernize_our_bombers: "Модернизируйте наших бомбардировщиков"
 PRU_modernize_our_bombers_desc: "Бомбардировщики и бойцы идут рука об руку, когда дело доходит до мощной воздушной силы. Если у нас могут быть современные бомбардировщики, то наши экономики врагов будут на судьбе наших рук."
 PRU_build_up_our_airbases: "Создайте наши авиабазы"
 PRU_build_up_our_airbases_desc: "Если мы хотим иметь большую воздушную силу, нам нужно расширить наши авиабазы ​​и плоскости. Если у нас нет нигде, чтобы хранить эти самолеты, то какой смысл их иметь."
 PRU_train_our_pilots: "Тренировать наших пилотов"
 PRU_train_our_pilots_desc: "Наши пилоты должны пройти строгий трингон, если мы хотим по -настоящему одержать верх в воздухе. Чем лучше пилоты, тем лучше будет наша общая воздушная сила."
 PRU_focus_on_our_navy: "Сосредоточиться на нашем флоте"
 PRU_focus_on_our_navy_desc: "Наш флот нуждается в том, что он может привлечь. Нам нужно вернуться к чилийским нечинкам и убедиться, что их флот был уничтожен так же, как наш, и на этот раз это будут мы, которые уничтожат его."
 PRU_focus_on_army: "Сосредоточиться на армии"
 PRU_focus_on_army_desc: "Наша армия должна быть сильнее, чем сейчас. Чем сильнее наша армия, тем лучше мы сможем достичь наших целей и заставить другие страны ценить наши претензии и уважать их."
 PRU_focus_on_air: "Сосредоточиться на воздухе"
 PRU_focus_on_air_desc: "Наша воздушная сила определенно не хватает, если не сказать больше. Хотя мы никогда не прилагаем особого усилия на нашу воздушную силу, мы можем изменить это, начинающееся сейчас. Чем сильнее наша воздушная сила, тем лучше будет."
 PRU_fork_in_the_road: "Наше будущее"
 PRU_fork_in_the_road_desc: "Теперь, когда мы достигли нашей цели по ремонту нации, у нас осталось множество расходящихся путей, которые мы можем пойти. Что мы будем делать?"
 PRU_our_northern_land: "Наша северная земля"
 PRU_our_northern_land_desc: "Эквадор занимает нашу законную землю! Мы должны подготовиться, чтобы вернуть то, что по праву является нашим."
 PRU_prepare_our_people: "Подготовьте наших людей"
 PRU_prepare_our_people_desc: "Многие люди в нашей стране могут быть против войны с нашими соседями, мы должны убедить их иначе."
 PRU_militirize_our_people: "Милитаризируйте наших людей"
 PRU_militirize_our_people_desc: "Увеличивая сумму, которую мы призываем, мы можем увеличить количество людей в нашей армии."
 PRU_increase_our_equipment_reserves: "Увеличьте наши резервы оборудования"
 PRU_increase_our_equipment_reserves_desc: "Нам нужно увеличить производство нашего оборудования для подготовки к неизбежной войне. Кроме того, мы должны импортировать оборудование для быстрого увеличения налока."
 PRU_form_alpacalry: "Формируйте альпакалирию"
 PRU_form_alpacalry_desc: "Мы должны воспользоваться нашей популяцией альпаки, формируя альпакалирию. Эти дивизии в стиле кавалерии преуспеют в нашей горной местности."
 PRU_prepare_our_army_further: "Подготовьте нашу армию дальше"
 PRU_prepare_our_army_further_desc: "Нам нужно улучшить нашу армию, и мы можем сделать это по -разному. Какой путь мы пойдем?"
 PRU_strength_in_our_guns: "Сила в нашем оружии"
 PRU_strength_in_our_guns_desc: "Жизнь наших людей драгоценна, и немногие, мы должны убедиться, что мы минимизируем потери в наших конфликтах."
 PRU_strength_in_our_mind: "Сила в наших умах"
 PRU_strength_in_our_mind_desc: "Благодаря обширному планированию мы можем быстро и с решительной победой."
 PRU_learn_from_the_germans: "Работать с немецким рейхом"
 PRU_learn_from_the_germans_desc: "Армия Германии Рейха - одна из них, с которой мы должны считаться, мы должны работать с ними и делать заметки."
 PRU_continue_our_military_relationship_with_the_french: "Продолжайте работать Французская Республика"
 PRU_continue_our_military_relationship_with_the_french_desc: "Французская армия исторически одна из самых сильных, есть причина, по которой им удалось добраться до Москвы. Мы должны продолжить сотрудничество с французской армией."
 PRU_the_war_begins: "Война начинается ..."
 PRU_the_war_begins_desc: "Война начинается, пусть выиграет лучший человек."
 PRU_strengthen_the_CAP: "Укрепить кепку"
 PRU_strengthen_the_CAP_desc: "Cuerpo de Aviación del Perú должен быть укреплен, чтобы мы могли выиграть любой будущий конфликт."
 PRU_purchase_american_planes: "Покупать американские самолеты"
 PRU_purchase_american_planes_desc: "Мы должны приобрести американские самолеты, чтобы разработать наши ВВС."
 PRU_purchase_italian_planes: "Купить итальянские самолеты"
 PRU_purchase_italian_planes_desc: "Мы должны приобрести итальянские самолеты, чтобы разработать наши ВВС."
 PRU_form_the_FAP: "Формализовать FAP"
 PRU_form_the_FAP_desc: "В настоящее время наши ВВС состоит из авиационных подразделений в армии и флоте. Мы должны формализовать Cuerpo de Aviación del Perú в современные ВВС (Fuerza Aérea del Perú)."
 strengthened_ties: "Укрепление связей"
 PRU_delay_democracy: "Задержка демократии"
 PRU_delay_democracy_desc: "С угрозой коммунизма над нашим государством, мы должны продолжать существование нашего авторитарного режима и задержать демократию до более позднего срока."
 PRU_the_state_serves_the_people: "Государство служит народу"
 PRU_the_state_serves_the_people_desc: "Государство должно служить людям, а не наоборот! Давно живая демократия!"
 PRU_the_people_serve_the_state: "Люди служат государству"
 PRU_the_people_serve_the_state_desc: "Те, кто думает, что «государство должно служить народу», являются дураками. Мир наполнен врагами, и нам нужно, чтобы люди служили нам, чтобы справиться с ними."
 PRU_form_the_democratic_coalition: "Сформировать демократическую коалицию"
 PRU_form_the_democratic_coalition_desc: "Пришло время остановить этот раскол между демократией и коммунизмом и создавать коалицию между двумя идеологиями. Чем более объединены наши люди, тем сильнее будет наша нация."
 PRU_bring_in_the_communists_into_the_fold: "Интегрировать коммунистов"
 PRU_bring_in_the_communists_into_the_fold_desc: "Теперь, когда у нас есть наша Coaltiion SE, мы можем начать интегрировать коммунистов в соответствии с этой одной стороной и по -настоящему объединить людей."
 PRU_the_left_and_right_united: "Левая и правая объединенная"
 PRU_the_left_and_right_united_desc: "Теперь это официально, левая и правая были должным образом объединены под одной идеологией и одним баннером. Больше не будет разделен между людьми и их различными идеологиями."
 PRU_abandon_the_socialists: "Оставить социалистов"
 PRU_abandon_the_socialists_desc: "Вниз с социалистами! Они являются мрачными народами, и с ними должны быть обработаны непосредственно, прежде чем они станут слишком сильными."
 PRU_pander_to_catholics: "Потворствовать католикам"
 PRU_pander_to_catholics_desc: "Христианство в целом стало ключом к развитию этой страны, и потворство им кажется самым мудрым выбором. Наличие их, наша сторона, явно поможет нам."
 PRU_supporting_religious_traditons: "Сотрудничать с церковью"
 PRU_supporting_religious_traditons_desc: "Церковь уже давно набирает власть в политической сцене этой страны, и сотрудничество с церковью может привлечь нас к различным секторам нашей нации."
 PRU_election_day: "День выборов"
 PRU_election_day_desc: "Наступил день, пришло время провести выборы и посмотреть, какая политическая партия подходит на первое место."
 PRU_the_coalition_wins: "Коалиция выигрывает"
 PRU_the_coalition_wins_desc: "После жестокой сессии голосования коалиция вышла на первое место, и теперь они будут брать на себя ответственность за нацию."
 PRU_the_liberals_win: "Либералы выигрывают"
 PRU_the_liberals_win_desc: "После интенсивной сессии голосования либералы вышли на первое место и будут вести страну с этого момента."
 PRU_increase_social_spending: "Увеличить социальные расходы"
 PRU_increase_social_spending_desc: "Увеличение наших социальных расходов повысит наши промышленные потенциал и нашу эффективность для развития нашей экономики, на обмене некоторыми нашими ведущими компаниями и предприятиями в определенной степени являются гандикапком. Это достойная жертва, которая поможет нам в долгосрочной перспективе."
 PRU_decrease_social_spending: "Уменьшить социальные расходы"
 PRU_decrease_social_spending_desc: "Снижение наших социальных расходов повредит некоторым секторам нашей экономики, но в то же время повысит другие для довольно хорошего компромисса."
 PRU_reenforce_the_progressive_tax_system: "Усилить прогрессивную налоговую систему"
 PRU_reenforce_the_progressive_tax_system_desc: "Наша прогрессивная налоговая система доказывается, что до сих пор работает довольно хорошо. Было бы довольно разумно укрепить его и продолжать использовать систему, которую мы уже реализовали, чтобы еще больше улучшить экономику."
 PRU_enforce_neutrality: "Применение нейтралитета"
 PRU_enforce_neutrality_desc: "Оставаться нейтральным является нашим лучшим выбором, если мы хотим сохранить наш суверенитет среди хаоса, который пивоварряет по всей планете. Если мы выберем сторону, мы мертвым мясом, поэтому было бы лучше просто оставаться в стороне от каких -либо неприятностей."
 PRU_introduce_free_trade_deals_with_our_neighbors: "свободная торговля"
 PRU_introduce_free_trade_deals_with_our_neighbors_desc: "свободная торговля"
 PRU_lean_more_to_the_left: "Больше наклоняться влево"
 PRU_lean_more_to_the_left_desc: "Левые - это путь, социализм - лучший выбор для нашей нации, и мы должны принять этот факт. Чем быстрее мы делаем, тем лучше будет."
 PRU_reject_the_extremists: "Отвергнуть радикалы"
 PRU_reject_the_extremists_desc: "Экстремизм в целом не очень хорош в стране. Они террористы, и с ними нужно разобраться непосредственно, прежде чем они станут слишком сильными."
 PRU_social_democratic_peru: "Социал -демократия Перу"
 PRU_social_democratic_peru_desc: "Социализм имеет некоторые хорошие и плохие вещи, у демократии есть некоторые хорошие и плохие вещи, так почему бы не взять хорошее с обеих сторон и не создать социал -демократию в нашей стране. Люди, скорее всего, согласятся с этим предложением, и нам нечего терять из него."
 PRU_ask_the_holy_see_for_support: "Либеральный Перу"
 PRU_ask_the_holy_see_for_support_desc: "свободный рынок"
 PRU_radicalize_the_moderates: "Радикализировать умеренные"
 PRU_radicalize_the_moderates_desc: "Нам нужно собрать поддержку умеренных, они сдерживают нас, и мы не можем позволить этому продолжить. Они будут и будут под красным знаменем коммунизма в кратчайшие сроки!"
 PRU_purge_right_leaning_politicians: "Очистить правых политиков"
 PRU_purge_right_leaning_politicians_desc: "Фашизм и право в целом - это просто шишка на нашей дороге, которую нужно искоренить. С ними не по пути наш путь к славе будет ясен."
 PRU_follow_the_teachings_of_marx: "Следуйте учению Маркса"
 PRU_follow_the_teachings_of_marx_desc: "Маркс, отец современного коммунизма и гений. Если мы не будем следовать его учениям, мы будем коммунистической катастрофой."
 PRU_learning_from_our_paraguayan_neighbors: "Учиться у наших парагвайских соседей"
 PRU_learning_from_our_paraguayan_neighbors_desc: "Парагвай уже очень долго держал свой собственный под красным знаменем социализма. Они даже выиграли войну в Чако против боливийцев, что не могло предсказать не многие. Учиться у них - наш лучший вариант на данный момент."
 PRU_our_unique_revolution: "Наша уникальная революция"
 PRU_our_unique_revolution_desc: "Дешевый социализм, который практикуется в Китае и Советском Союзе, является не чем иным, как позором. Они не представляют настоящие коммунистические идеалы, так что именно здесь мы вступаем."
 PRU_join_the_soviets: "Присоединяйтесь к Коминтерну"
 PRU_join_the_soviets_desc: "Советы - это электростанция в современном мире, было бы разумно объединиться с ними и использовать их силу, ресурсы и интеллект в нашу пользу."
 PRU_send_the_bolivians_an_ultimatum: "Боливийский ультиматум"
 PRU_send_the_bolivians_an_ultimatum_desc: "У боливийцев были свои собственные слишком долго, пришло время уничтожить эту карту. Их ресурсы будут лучше использовать под нашим руководством."
 PRU_invite_the_paraguayans: "Пригласить парагвайцев"
 PRU_invite_the_paraguayans_desc: "Парагвайцы могут быть для нас очень полезным союзником, поэтому приглашение на нашу фракцию кажется легким."
 PRU_liberate_the_paraguayans: "Освободить парагвайцев"
 PRU_liberate_the_paraguayans_desc: "Парагвайский народ уже слишком долго отъехал их правительство. Пришло время освободить их и принести их под настоящую коммунистическую утопию."
 PRU_revive_the_peru_bolivian_confederation: "Оживить Перу-Боливианскую Конфедерацию"
 PRU_revive_the_peru_bolivian_confederation_desc: "Перу-Боливская Конфедерация, недолговечный союз между штатами Боливия, Северной Перу и Южным Перу. Этот первоначальный союз, возможно, не сработал, но на этот раз он может сработать. Наши улучшенные отношения с Боливией, несомненно, заставит их принять это предложение."
 PRU_work_with_social_democracies: "Работать с социал -демократиями"
 PRU_work_with_social_democracies_desc: "Теперь, когда мы зарекомендовали себя как социал -демократия, мы можем начать работать с другими социал -демократиями по всему миру и укреплять с ними наши связи."
 PRU_request_guarantees_by_social_democratic_powers: "Запрос гарантий социал -демократиями"
 PRU_request_guarantees_by_social_democratic_powers_desc: "Враги вокруг нас вокруг нас, и нация, которая сначала, кажется, в любое время может вернуть нас в отставку, так что было бы лучше, если бы мы могли попросить Гурантеи у других социал -демократий."
 PRU_strengthen_ties_with_social_democracies_in_oceania: "Укрепить связи с Океанией"
 PRU_strengthen_ties_with_social_democracies_in_oceania_desc: "Океания - это место, наполненное социал -демократиями, такими как Австралия и Новая Зеландия. Их богатство показывает, что они действительно успешные народы и что мы можем им доверять."
 PRU_strengthen_ties_with_scandinavian_social_democrats: "Укрепить связи со скандинавией"
 PRU_strengthen_ties_with_scandinavian_social_democrats_desc: "Скандинавия - самое близкое, что у нас есть утопия, поэтому укрепление связей с ними было бы очень мудрым."
 PRU_tie_social_democracies_closer: "Связывать социал -демократии ближе"
 PRU_tie_social_democracies_closer_desc: "Социал -демократии теперь дружелюбны для нас, поэтому давайте сделаем еще один шаг вперед и по -настоящему установим нашу дружбу."
 PRU_ally_with_the_french: "Союзник с французами"
 PRU_ally_with_the_french_desc: "Франция, пожалуй, самая сильная социал -демократия на планете. Их шумная экономика и могущественная армия означают, что они могут быть очень мощным и полезным союзником."
 PRU_join_the_allies: "Присоединяйтесь к союзникам"
 PRU_join_the_allies_desc: "Союзники - хорошие парни этого мира. Поскольку планета горит в хаосе и экстремистских идеалах, союзники стоят выше всего этого, и это фракция, к которой мы должны присоединиться."
 PRU_condemn_authoritarian_states: "Осуждают авторитарные государства"
 PRU_condemn_authoritarian_states_desc: "Авторитарные государства злоупотребляют своим населением, и они нарушили много международных законов, и это не может быть прощено."
 PRU_give_refuge_to_victims_of_authoritarianism: "Дайте убежище жертвам авторитаризма"
 PRU_give_refuge_to_victims_of_authoritarianism_desc: "Мы можем взять на себя жертвы этих авторитарных государств и дать им новый шанс на жизнь в нашей стране."
 PRU_spread_our_values_to_our_neighbors: "Распространите наши ценности нашим соседям"
 PRU_spread_our_values_to_our_neighbors_desc: "Наши соседи должны услышать профессионалы демократии и либерализма. Страны могут расти так же, как наши, если они слушают наши советы, поэтому мы немного подталким их в правильном направлении."
 PRU_invite_our_democratic_neighbors: "Попросить иностранные субсидии"
 PRU_invite_our_democratic_neighbors_desc: "Теперь мы можем попросить иностранных субсидий у наций, которые дружелюбны к нашей стране, и они, скорее всего, примут. Эти субсидии очень помогут повысить нашу экономику."
 PRU_ask_the_americans_to_help_mediate_regional_issues: "Улучшить отношения с американцами"
 PRU_ask_the_americans_to_help_mediate_regional_issues_desc: "Американцы - неоспоримая электростанция в западном мире, и, возможно, даже самая сильная сила на планете. Поддержание дружественных связей с ними принесет мне большую пользу в долгосрочной перспективе."
 PRU_south_america_united: "Южная Америка Юнайтед"
 PRU_south_america_united_desc: "Южная Америка стоит как объединенный континент. Больше не в борьбе, больше не спорить, больше нет конкуренции. Мы поможем друг другу и разжигаем новые и более сильные отношения друг с другом, чтобы мы могли принять любую иностранную угрозу, которая может прийти в наш путь."
 PRU_invest_in_our_agriculture: "Инвестировать в наше сельское хозяйство"
 PRU_invest_in_our_agriculture_desc: "Наш сельскохозяйственный сектор довольно слаб, как сейчас стоит. Такие страны, как Аргентина и Бразилия, использовали свой сельскохозяйственный сектор и получили большую выгоду, поэтому мы должны делать то же самое и пахнуть о преимуществах."
 PRU_sell_our_wheat_market: "Продать наши пшеничные рынки"
 PRU_sell_our_wheat_market_desc: "Благодаря шумному рынку пшеницы мы можем продать ее иностранным компаниям и странам. С этим притоком денег от продажи нашей пшеницы, мы сможем инвестировать в другие сектора нашей экономики и еще больше развивать нашу нацию."
 PRU_improve_worker_conditions: "Улучшить условия работников"
 PRU_improve_worker_conditions_desc: "Текущие условия работников в нашей стране далеко не приемлемые. Если мы сможем улучшить рабочее пространство для нашей рабочей силы, наша национальная продукция увеличится, и мы будем производить больше, что приведет к более сильной экономике."
 PRU_strengthen_relations_with_the_bolivians: "Укрепить отношения с боливистами"
 PRU_strengthen_relations_with_the_bolivians_desc: "Боливийцы - наша лучшая ставка как союзник. У них есть похожие идеалы для нас, всегда поддерживали с ними хорошие отношения, и мы были союзниками в нескольких войнах. Наличие их в качестве близкого союзника было бы идеальным."
 PRU_purchase_french_armaments_focus: "Купить французские вооружения"
 PRU_purchase_french_armaments_focus_desc: "У французов есть очень хорошие вооружения, которые могут быть очень полезны для наших вооруженных сил. Для их покупки может стоить довольно большая сумма денег, но в долгосрочной перспективе это будет стоить."
 PRU_invite_the_bolivians: "Пригласить Боливию"
 PRU_invite_the_bolivians_desc: "Пришло время сделать его официальным и пригласить Боливию в наш альянс, чтобы показать Южную Америку и мир, что мы станем единым континентом."
 PRU_invite_argentina: "Пригласить Аргентину"
 PRU_invite_argentina_desc: "Аргентина была бы отличным союзником, чтобы иметь на нашей стороне, так же, как и с таким же успехом, могла бы попробовать и посмотреть, примут ли они."
 PRU_estabish_a_unified_currency: "Установить единую валюту"
 PRU_estabish_a_unified_currency_desc: "Давайте установим общую валюту во всех странах в нашем альянсе, поэтому нам не нужно слишком беспокоиться об инфляции, и все наши экономики могут расти одинаково."
 PRU_arm_up_our_nations: "Поднять наши народы"
 PRU_arm_up_our_nations_desc: "Угрозы нависаются вокруг нас, поэтому нам нужно создать наши армии, чтобы быть готовыми к любой угрозе, которая может прийти на наш путь."
 PRU_cooperate_with_allied_scientists: "Сотрудничать с учеными союзников"
 PRU_cooperate_with_allied_scientists_desc: "Сотрудничество с учеными -союзниками очень поможет нашим технологическим продвижению для нас и каждой нации в нашем альянсе."
 PRU_the_south_american_science_academy: "Южноамериканская научная академия"
 PRU_the_south_american_science_academy_desc: "Создание континентальной научной академии протолкнет нас мимо границ, которые навязывали нам другие страны, что позволит нам стать силами западного мира и, возможно, даже планетой."
 PRU_ask_the_region_powers_to_join: "Пригласить Колумбию"
 PRU_ask_the_region_powers_to_join_desc: "Колумбия была бы отличным союзником. Их крупная промышленность и вооруженные силы могут оказаться очень полезными в ближайшем будущем."
 PRU_ask_the_powers_above_us_to_join: "Вернуть наши земли силой"
 PRU_ask_the_powers_above_us_to_join_desc: "Пришло время раз и навсегда разобраться с Эквадором. Они не могут продолжаться больше, поэтому давайте раз и навсегда урегулируем счет!"
 PRU_reconcile_with_ecuador: "Примирим с Эквадором"
 PRU_reconcile_with_ecuador_desc: "Зачем получать врага, когда мы можем получить союзника. С достаточным убедительным и гурантеи, Эквадор обязательно примет, чтобы дать нам наши земли без каких -либо пролитых крови."
 PRU_demand_spanish_concessions: "Разорвать связи с испанским"
 PRU_demand_spanish_concessions_desc: "Испанцы совершили слишком много злодеяний, чтобы даже начать их называть, поэтому мы будем перерезать все связи с ними."
 PRU_develop_arica: "Развивать Арику"
 PRU_develop_arica_desc: "С нашей недавно приобретенной землей мы можем начать ее расширять и использовать эту территорию, чтобы расширить нашу экономику. Это даже не упоминает о природных ресурсах, которые могут быть найдены, которые помогут нам еще больше."
 PRU_ask_the_minor_powers_to_join: "Попросите южноамериканских демократий присоединиться"
 PRU_ask_the_minor_powers_to_join_desc: "Теперь, когда мы зарекомендовали себя как сильный альянс, пришло время пригласить других демократий на континенте и еще больше развивать альянс. Южная Америка поднимется!"
 PRU_build_up_naval_bases: "Создать военно -морские базы"
 PRU_build_up_naval_bases_desc: "Нам понадобится большой флот для планов, которые мы сейчас пишем. Чем больше наш флот, тем лучше наши шансы победить испанского и по -настоящему заставлять их заплатить за все свои преступления."
 PRU_use_brazil_to_invite_portugal: "Пригласить Португалию"
 PRU_use_brazil_to_invite_portugal_desc: "Португалия могла бы стать очень хорошей посадкой для нашего вторжения в Испанию, если они примут наше предложение о приглашении в наш альянс, эта война станет намного проще."
 PRU_take_out_the_spanish_imperialists: "Уберите испанских империалистов"
 PRU_take_out_the_spanish_imperialists_desc: "Приготовления были сделаны, пришло время раз и навсегда раз и навсегда справиться с испанским! Мир увидит нашу комбинированную силу!"
 PRU_reconcile_with_chile: "Примирим с Чили"
 PRU_reconcile_with_chile_desc: "Чилии не плохие люди, и по причине очень целесообразно получить от них то, что мы хотим, либо с силой с дипломатией. Whatver используется, мы получим то, что хотим."
 PRU_try_to_buyback_our_lands: "Попробуйте купить наши земли"
 PRU_try_to_buyback_our_lands_desc: "С нашей шумной экономикой мы можем позволить себе купить у них ARICA. Мы предложим им очень хорошую сумму денег, чтобы мы могли безопасно провести их принятие в нашем предложении."
 PRU_demand_our_lands: "Требовать наши земли"
 PRU_demand_our_lands_desc: "Вниз с дипломатией, чилийцы не будут слушать без грубой силы, так что это именно то, что мы им дадим!"
 PRU_land_for_alliance: "Земля для членства в фракции"
 PRU_land_for_alliance_desc: "Мы могли бы попытаться предложить им приглашение нашему альянсу в обмен на землю. Чили видел, что мы изменились как нация, поэтому они могут просто принять наше предложение."
 PRU_open_our_markets: "Откройте наши рынки"
 PRU_open_our_markets_desc: "Наличие открытого рынка позволит нам продать наши товары почти каждой части мира. Это не только улучшит наши отношения с другими странами, но и повысит нашу экономику."
 PRU_crusade_against_communism: "Крестовый поход против коммунизма"
 PRU_crusade_against_communism_desc: "Коммунисты должны сразу разобраться! Их мерзкая идеология разрушает континент, и это не может длиться долго!"
 PRU_crusade_against_fascism: "Крестовый поход против фашизма"
 PRU_crusade_against_fascism_desc: "Фашизм разрушил каждую нацию, которую она коснулась, и мы должны убедиться, что он не разрушил ни одной нации на нашем континенте. Вниз с этими мерзкими суставами!"
 PRU_a_clean_south_america: "Чистая Южная Америка"
 PRU_a_clean_south_america_desc: "Коммунизм и фашизм, наконец, были рассмотрены. Ни одна нация на нашем континенте не следует за одной из этих экстремальных идеологий. Наша работа здесь сделана, и теперь мы можем начать долгий путь мира и процветания."
 PRU_mutual_industrial_build_up: "Взаимное промышленное наращивание"
 PRU_mutual_industrial_build_up_desc: "С нашим новым союзником мы можем использовать наши объединенные экономики для улучшения экономики друг друга и взаимно полезной друг друга."
 PRU_prepare_for_a_plan: "Подготовьте план с Боливией"
 PRU_prepare_for_a_plan_desc: "Чили победила нас в войне Тихого океана несколько десятилетий назад. Если мы хотим отомстить, нам понадобится помощь Боливии. Поскольку война сильно повлияла на Боливию, они, скорее всего, примут наше предложение одновременно вторгаться в Чили."
 PRU_launch_the_second_war_of_the_pacific: "Запустить вторую войну Тихого океана"
 PRU_launch_the_second_war_of_the_pacific_desc: "Планы были составлены, как наша армия, так и боливийская армия выстроены на чилийской границе. Пришло время отомстить за чертовы ублюдков, и они платят за эту потерю в первой войне!"
 PRU_focus_on_winning_the_war: "Сосредоточиться на победе в войне"
 PRU_focus_on_winning_the_war_desc: "Нам нужно сосредоточить все наше внимание на победе в войне. Мы не можем позволить себе потерять второй раз, когда SE должен убедиться, что мы победили их, независимо от стоимости."
 PRU_mobilize_the_reserves: "Мобилизовать резервы"
 PRU_mobilize_the_reserves_desc: "Война требует большего количества людей в этой области, чем то, что у нас есть, поэтому нам нужно мобилизовать наши резервы и быстро, если мы хотим сохранить нашу армию."
 PRU_mobilize_the_economy: "Мобилизовать экономику"
 PRU_mobilize_the_economy_desc: "Наша экономика станет одной из войн, чтобы поддерживать требования войны. Людям это может не понравиться, но мы должны сделать это, чтобы выйти на вершину."
 PRU_desperate_mobilization: "Отчаянная мобилизация"
 PRU_desperate_mobilization_desc: "Нам нужно мобилизовать еще больше мужчин! Дайте им пистолет и страстную речь, и они вступят в армию в кратчайшие сроки!"
 PRU_victor_of_the_second_war_of_the_pacific: "Виктор второй войны Тихого океана"
 PRU_victor_of_the_second_war_of_the_pacific_desc: "Наконец, наша сладкая месть, мы достали чилийцев и любого другого врага, который присоединился к их стороне. Несмотря на все шансы, мы вышли на первое место, и мир видел нашу истинную силу."
 PRU_make_our_bolivian_allience_official: "Сделайте нашего боливийского альянса чиновником"
 PRU_make_our_bolivian_allience_official_desc: "До сих пор боливийцы были великим военным союзником, так почему бы не сделать наш псевдоолентность и официальный альянс, они обязательно примут."
 PRU_influence_our_neighbors: "Влиять на наших соседей"
 PRU_influence_our_neighbors_desc: "Наши соседи услышат чудеса коммунизма, и достаточно скоро они пойдут на наши шаги, чтобы создать коммунистическую утопию."
 PRU_invite_our_communist_brothers: "Пригласить наших коммунистических братьев"
 PRU_invite_our_communist_brothers_desc: "Мы Шалле расширяем наш альянс и приглашаем наших коммунистических братьев по всему континенту. Красный флаг должен быть размахивается по всему континенту!"
 PRU_clean_up_south_america: "Очистить Южную Америку"
 PRU_clean_up_south_america_desc: "Несмотря на наши попытки, все еще есть некоторые страны, которые не приняли коммунизм, и те страны, которые мы будем иметь дело с ними с силой."
 PRU_backstab_the_bolivians: "Backstab боливийцев"
 PRU_backstab_the_bolivians_desc: "Боливийцы всерьез думали, что мы будем союзниками? Ну, они очень ошибаются, и они поймут, что в тот момент, когда наши войска войдут в их территорию."
 PRU_exploit_the_bolivian_tungsten_mines: "Эксплуатировать боливийские вольфрамовые шахты"
 PRU_exploit_the_bolivian_tungsten_mines_desc: "Боливия известна своими обильными вольфрамовыми шахтами. Теперь, когда мы имеем полный контроль над ними, мы можем использовать их до абсолютного максимума и пользоваться всеми преимуществами, которые принесут как нашу экономику, так и торговлю."
 PRU_deal_with_the_ecuadorians: "Иметь дело с эквадорами"
 PRU_deal_with_the_ecuadorians_desc: "Эквадорцы слишком долго стремились к нашей законной земле, пришло время раз и навсегда поработать с ними."
 PRU_finish_off_the_colombians: "Закончить колумбийцам"
 PRU_finish_off_the_colombians_desc: "Колумбийцы стоят на нашем пути, и мы позаботимся о том, чтобы они выйдут из этого!"
 PRU_acquire_the_venezuelan_oil: "Приобрести венесуэльскую масло"
 PRU_acquire_the_venezuelan_oil_desc: "Венесуэльцы очень богаты, когда дело доходит до нефти. Их нефтяное резервуар больше, чем на Ближнем Востоке вместе взятых. Доступ к этому обильному маслу поможет нам в долгосрочной перспективе."
 PRU_convince_others_to_join_us: "Спросите иностранных добровольцев"
 PRU_convince_others_to_join_us_desc: "Нам нужно убедить другие страны отправить нам добровольцев. Наша нынешняя армия просто не может идти в ногу с требованиями войны, и нам понадобится иностранная поддержка, чтобы помочь нам в нашей войне."
 PRU_build_up_our_army: "Создать нашу армию"
 PRU_build_up_our_army_desc: "Наша армия должна нарастать дальше, если мы хотим нанести страх в сердцах наших врагов."
 PRU_build_up_the_navy: "Создать наш флот"
 PRU_build_up_the_navy_desc: "Наш флот не хватает и отчаянно нуждается в крупном финансировании, чтобы поддерживать его. Как только у нас появится мощный флот, никто не бросит нам вызов в морях."
 PRU_decimate_the_imperialist_iberians: "Разделение империалистов иберов"
 PRU_decimate_the_imperialist_iberians_desc: "Приготовления были сделаны, пришло время раз и навсегда раз и навсегда справиться с испанским! Мир увидит нашу истинную силу!"
 PRU_invite_bolivia: "Пригласить Боливию"
 PRU_invite_bolivia_desc: "Парагвайцы могут быть для нас очень полезным союзником, поэтому приглашение на нашу фракцию кажется легким."
 PRU_prepare_our_industry_for_total_war: "Подготовьте нашу отрасль к полной войне"
 PRU_prepare_our_industry_for_total_war_desc: "Наша отрасль должна быть готова к приготовлению к полной войне. Если мы сможем справиться с этим, мы сможем победить любую страну."
 PRU_legalize_the_labor_unions: "Легализовать профсоюзы"
 PRU_legalize_the_labor_unions_desc: "Легализация профсоюзов и поражение является решающим правом, необходимым пролетариату, чтобы не допустить управления буржуазией над ними. Мы должны легализовать это."
 PRU_build_up_our_road_networks: "Создайте наши дорожные сети"
 PRU_build_up_our_road_networks_desc: "Создание наших дорожных сетей улучшит транспорт по всей нашей стране, и это поможет нам очень."
 PRU_purchase_foreign_infantry_equipment: "Покупать иностранное пехотное оборудование"
 PRU_purchase_foreign_infantry_equipment_desc: "У нас есть деньги на покупку иностранного пехотного оборудования у основных держав. Их огнестрельное оружие значительно улучшит возможности нашей армии."
 PRU_enact_conscription_laws: "Принять более строгие законы о призывах"
 PRU_enact_conscription_laws_desc: "Давайте примут строгие законы о призывах по всей нашей стране. При этом мы можем еще больше расширить нашу армию и сделать нашу армию сильнее и больше."
 PRU_go_after_the_chileans: "Идти за чилийцами"
 PRU_go_after_the_chileans_desc: "Чилии нанесли слишком большой ущерб нашей стране, и за это они должны заплатить."
 PRU_inspire_peruvian_nationalism: "Вдохновлять перуанский национализм"
 PRU_inspire_peruvian_nationalism_desc: "Национализм в нашей стране очень сильный, но он может быть сильнее. Чем он сильнее, тем более склонностью наши пищевые люди будут идти на войну."
 PRU_go_after_argentina: "Иди после Аргентины"
 PRU_go_after_argentina_desc: "Аргентина должна заплатить за весь ущерб, который они причинили нашей нации, и они будут с их кровью!"
 PRU_proclaim_the_union_of_south_america: "Провозглашать союз Южной Америки"
 PRU_proclaim_the_union_of_south_america_desc: "Пришло время Южной Америки объединиться под одним баннером под одним флагом, под одной идеологией. Наши цели не будут завершены, пока каждый дюйм континента не будет под нашим контролем."
 PRU_strength_in_our_numbers: "Сила в числах"
 PRU_strength_in_our_numbers_desc: "Чем больше наша армия, тем выше вероятность победы в любой войне, в которой мы можем привлечь себя."
 PRU_try_to_appease_oscars_supporters: "Попробуйте успокоить сторонников Оскара"
 PRU_try_to_appease_oscars_supporters_desc: "Оскар по -прежнему имеет очень большие последователи, что может оказаться неприятным для наших планов по нашему перевороту. Если мы сможем как -то успокоить их, то наш переход к фашизму будет проще."
 PRU_capture_the_reserves: "Захватить резервы"
 PRU_capture_the_reserves_desc: "Правительство имеет очень большие резервы в вооружениях, в том числе пехотное оборудование, вспомогательное оборудование и даже артиллерийские произведения. Захват их обеспечит большую часть запаса, если в случае гражданской войны."
 PRU_disband_the_guardia_civil: "Расформировать Гражданский Граждан"
 PRU_disband_the_guardia_civil_desc: "Гражданская Граждана несет ответственность за арест многих наших сторонников. Расформирование их предотвратит их за арест больше наших сторонников."
 PRU_sway_the_industrial_loyalty: "Повладеть промышленную лояльность"
 PRU_sway_the_industrial_loyalty_desc: "Промышленность в настоящее время находится на стороне правительства. Если мы сможем получить отрасль на нашей стороне, то мы наверняка получим преимущество."
 PRU_the_maximum_concession: "Максимальная концессия"
 PRU_the_maximum_concession_desc: "Нам нужно пойти на компромисс. Если мы хотим убедиться, что наш переворот идет идеально и эффективно, нам нужно купить больше времени."
 PRU_bring_back_exiled_fascists: "Вернуть изгнанных фашистов"
 PRU_bring_back_exiled_fascists_desc: "Многие фашистские сторонники были изгнаны в Чили, включая политиков и политических лидеров. Давайте попросим Чили вернуть их и по -настоящему установить нашу позицию в перуанской политике раз и навсегда."
 PRU_relase_fascist_prisoners: "Освободить фашистских заключенных"
 PRU_relase_fascist_prisoners_desc: "Многие из наших субиков были арестованы под руководством Оскара. Мы освободим их и покажем Оскар, что мы являемся силой, с которой нужно считаться."
 PRU_secure_the_fascist_majority_states: "Закрепите штаты фашистского большинства"
 PRU_secure_the_fascist_majority_states_desc: "На выборах 1936 года мы увидели, что в некоторых штатах в них есть фашистское большинство, поэтому было бы разумно распространять пропаганду в этих штатах и ​​обеспечить их, когда мы делаем переворот."
 PRU_launch_the_coup: "Запустить переворот"
 PRU_launch_the_coup_desc: "Подготовка была сделана, пришло время запустить наш переворот. Это может пойти хорошо и быть мирным переворотом, или это может привести к полноценной гражданской войне. Что мы действительно знаем, так это то, что в конце концов мы будем победить для обоих сценариев."
 PRU_recover_from_the_coup: "Оправиться от переворота"
 PRU_recover_from_the_coup_desc: "Несмотря на то, что наш переворот был успешно, он нанес серьезный ущерб по всей стране, и нам нужно быстро восстановиться, если мы хотим иметь шанс против других южноамериканских стран."
 PRU_rearm_our_soliders: "Переводить наших солдат"
 PRU_rearm_our_soliders_desc: "Предыдущие правительства в основном покинули армию, но мы не будем. Мы купим иностранное оборудование для переворачивания наших солдат и сделаем нашу армию по -настоящему элитной силой."
 PRU_enact_sticter_conscription_laws: "Принять более строгие законы о призывах"
 PRU_enact_sticter_conscription_laws_desc: "Давайте примут строгие законы о призывах по всей нашей стране. При этом мы можем еще больше расширить нашу армию и сделать нашу армию сильнее и больше."
 PRU_advocate_protected_company_rights: "Защищенные защиты прав компании"
 PRU_advocate_protected_company_rights_desc: "Нам нужно защитить наши компании. Чем более защищены они, тем лучше, тем, что он будет от них."
 PRU_nationalize_the_steel_mines: "Национализировать стальные шахты"
 PRU_nationalize_the_steel_mines_desc: "Мы можем очень хорошо использовать активы и лунную стоимость, производимые стальными рудниками, поэтому мы их национализируем."
 PRU_rebuild_the_armada_peruana: "Восстановить армада Перуана"
 PRU_rebuild_the_armada_peruana_desc: "Армада был серьезно пострадал от нашего перехода к фашизму, большая часть нашего флота покинула нас, и мы должны вернуть его к ее прежней славе."
 PRU_expand_the_industrial_sector: "Расширить промышленный сектор"
 PRU_expand_the_industrial_sector_desc: "Иднустриальный сектор является сердцем каждой нации, и дело одинаково для нас, так что он будет послужить нам довольно хорошо."
 PRU_continue_our_naval_expansion_plan: "Продолжайте наш план военно -морского расширения"
 PRU_continue_our_naval_expansion_plan_desc: "Наша программа военно -морского переводображения до сих пор идет очень хорошо, поэтому не повредит продолжать ее немного дольше."
 PRU_expand_the_armories: "Расширить арсенал"
 PRU_expand_the_armories_desc: "Если мы хотим сохранить большую армию, нам сначала придется расширить наши арс -арс -АСС."
 PRU_reviving_the_peruvian_army: "Новая перуанская армия"
 PRU_reviving_the_peruvian_army_desc: "Перуанская армия была в руинах под правительством Оскара, но теперь, когда мы отвечаем, мы можем сосредоточить все наше внимание на его возрождении и донесении до максимальной славы."
 PRU_contact_the_bolivians: "Свяжитесь с боливистами"
 PRU_contact_the_bolivians_desc: "Мы должны начать наши политические дела, связавшись с боливийцами. Они были бы очень хорошими союзниками."
 PRU_secure_an_allience_with_bolivia: "Обеспечьте альянс с Боливией"
 PRU_secure_an_allience_with_bolivia_desc: "Обеспечение альянса с Боливией будет более чем идеальным. Они были и были очень заслуживающим доверия союзником, даже если они покинули нас в войне Тихого океана."
 PRU_propose_a_plan_to_bolivia: "Предложить план Боливии"
 PRU_propose_a_plan_to_bolivia_desc: "Чили победила нас в войне Тихого океана несколько десятилетий назад. Если мы хотим отомстить, нам понадобится помощь Боливии. Поскольку война сильно повлияла на Боливию, они, скорее всего, примут наше предложение одновременно вторгаться в Чили."
 PRU_retake_our_rightful_land: "Вернуть нашу законную землю"
 PRU_retake_our_rightful_land_desc: "Планы были составлены, как наша армия, так и боливийская армия выстроены на чилийской границе. Пришло время отомстить за чертовы ублюдков, и они платят за эту потерю в первой войне!"
 PRU_the_second_war_of_the_pacific: "Вторая война Тихого океана"
 PRU_the_second_war_of_the_pacific_desc: "Вторая война Тихого океана официально началась, и мы должны сосредоточить все наше внимание на победе в войне. Мы не можем позволить себе потерять второй раз, когда SE должен убедиться, что мы победили их, независимо от стоимости."
 PRU_arm_up_the_reserves: "Поднимать резервы"
 PRU_arm_up_the_reserves_desc: "Война требует большего количества людей в этой области, чем то, что у нас есть, поэтому нам нужно вооружить наши резервы и быстро, если мы хотим сохранить нашу армию."
 PRU_advocate_peruvian_nationalism: "Адвокат перуанский национализм"
 PRU_advocate_peruvian_nationalism_desc: "Национализм в нашей стране очень сильный, но он может быть сильнее. Чем он сильнее, тем более склонностью наши пищевые люди будут идти на войну."
 PRU_mobilize_our_economy: "Мобилизовать нашу экономику"
 PRU_mobilize_our_economy_desc: "Наша экономика станет одной из войн, чтобы поддерживать требования войны. Людям это может не понравиться, но мы должны сделать это, чтобы выйти на вершину."
 PRU_guns_for_every_soldier: "Оружие для каждого солдата"
 PRU_guns_for_every_soldier_desc: "Каждому солдату нужен пистолет, чтобы выполнить работу, и для этого нам нужно расширить индустрию вооружений."
 PRU_look_for_foreign_volunteers: "Ищите иностранных добровольцев"
 PRU_look_for_foreign_volunteers_desc: "Нам нужно искать другие страны, чтобы отправить нам добровольцев. Наша нынешняя армия просто не может идти в ногу с требованиями войны, и нам понадобится иностранная поддержка, чтобы помочь нам в нашей войне."
 PRU_the_peruvian_blitzkrieg: "Перуанский Блицкриг"
 PRU_the_peruvian_blitzkrieg_desc: "Давайте закончим эту войну молнией, используя нашу собственную версию Blitzkrieg. Комбинация повышенной скорости деления и небольшого злоупотребления комбинированными оружием и войны закончится в кратчайшие сроки."
 PRU_victor_war_of_pacific: "Виктор второй войны Тихого океана"
 PRU_victor_war_of_pacific_desc: "Наконец, наша сладкая месть, мы достали чилийцев и любого другого врага, который присоединился к их стороне. Несмотря на все шансы, мы вышли на первое место, и мир видел нашу истинную силу."
 PRU_backstab_bolivia: "Backstab Bolivia"
 PRU_backstab_bolivia_desc: "Боливийцы всерьез думали, что мы будем союзниками? Ну, они очень ошибаются, и они поймут, что в тот момент, когда наши войска войдут в их территорию."
 PRU_make_our_allience_official: "Сделать нашего официального альянса"
 PRU_make_our_allience_official_desc: "До сих пор боливийцы были великим военным союзником, так почему бы не сделать наш псевдоолентность и официальный альянс, они обязательно примут."
 PRU_take_out_the_paraguayans: "Достать парагвайцев"
 PRU_take_out_the_paraguayans_desc: "Парагвай вызвал у нас много проблем, им нужно и заплатит за то, что они сделали с нами."
 PRU_offer_a_compromise_to_chile: "Предложить компромисс с Чили"
 PRU_offer_a_compromise_to_chile_desc: "Несмотря на все, что сделано Чили, Чили может служить очень полезным союзником. В конце дня всегда лучше иметь союзника, чем врага."
 PRU_our_brothers_in_the_north: "Наши братья на севере"
 PRU_our_brothers_in_the_north_desc: "Нам нужно расширить нашу фракцию, и получить Венесуэлу в нашей фракции было бы замечательно."
 PRU_invest_in_the_venezuelan_oil: "Инвестировать в венесуэльскую нефть"
 PRU_invest_in_the_venezuelan_oil_desc: "Венесуэла сложена с нефтью, почти такой же, как и на Ближнем Востоке. Мы можем инвестировать в их нефть, чтобы они выиграли в краткосрочной перспективе, и мы получаем пользу в долгосрочной перспективе."
 PRU_deal_with_the_argentines: "Снять арг."
 PRU_deal_with_the_argentines_desc: "Аргентина - это угроза, о которой нужно позаботиться, если мы позволим им стать слишком сильными, они могут представлять угрозу для нашей фракции."
 PRU_strike_a_deal_with_the_confederation: "Поиск сделки с [ARG.GetName]"
 PRU_strike_a_deal_with_the_confederation_desc: "[ARG.GetName] смог выиграть Аргентинскую гражданскую войну и снова стать страной. Мы должны объединиться с ними, и вместе мы будем непреодолимыми."
 PRU_invite_the_brazilians: "Пригласить бразильцев"
 PRU_invite_the_brazilians_desc: "Бразильцы могут быть очень полезными союзниками в случае войны. Было бы разумно объединить себя с ними."
 PRU_deal_with_brazil: "Иметь дело с Бразилией"
 PRU_deal_with_brazil_desc: "У Бразилии очень ценная территория, которая может быть полезна для нас, так и с таким же успехом может воспользоваться нашими преимуществами и начать вторжение против них."
 PRU_the_final_struggle: "Последняя борьба"
 PRU_the_final_struggle_desc: "Настало время, пришло время убрать последнее препятствие в нашей корузе. После того, как США сталкиваются, мы можем по -настоящему объединить Америку под фракцией."
 PRU_retake_our_land: "Вернуть нашу землю"
 PRU_retake_our_land_desc: "Пришло время вернуть земли, которые Эквадор вырывает от нас все это время. Они заплатят, и мы позаботимся о том, чтобы они больше не беспокоили нас."
 PRU_connect_our_lands: "Соединить наши земли"
 PRU_connect_our_lands_desc: "Пришло время соединить наши границы с Венесуэлой. Колумбия и Эквадор стоят на пути, так что давайте пройдем через них."
 PRU_proclaim_peruvian_empire: "Провозглашать перуанскую империю"
 PRU_proclaim_peruvian_empire_desc: "Пришло время, чтобы мир в целом воспринимал нас всерьез. Мы провозгласим себя империей и победим Южную Америку. Мы обещаем наше население наших планов по победе за континентом, и они подбодрит нас с чистым национализмом. Мир увидит нашу мощь!"
 PRU_secure_colombia: "Безопасная Колумбия"
 PRU_secure_colombia_desc: "Колумбия - это Pesk, который стоит на нашем пути. Мы раздавим их и убедимся, что они не мешают нам снова."
 PRU_decimate_the_venezuelans: "Разделение венесуэльцев"
 PRU_decimate_the_venezuelans_desc: "Мало того, что Венесуэла довольно сильна, но они заполнены до краев природными ресурсами. Вытащить их очень поможет нашей экономике."
 PRU_finish_off_the_job: "Закончить работу"
 PRU_finish_off_the_job_desc: "Пришло время закончить Чили раз и навсегда. С ними не придется беспокоиться о том, что они угрожают нам."
 PRU_the_sun_shall_set: "Солнце установит"
 PRU_the_sun_shall_set_desc: "Аргентина должна быть завоевана, и Империя будет растянуться до Патагонии."
 PRU_conquer_uruguay: "Завоевать Уругвай"
 PRU_conquer_uruguay_desc: "Уругвай стоит на нашем пути полной победы. Мы сразу же вытащим их в силу."
 PRU_destroy_the_giant: "Уничтожить гиганта"
 PRU_destroy_the_giant_desc: "Бразилия - самая большая угроза для нашей империи, поэтому нам нужно иметь дело с ними как можно быстрее, чтобы они не мешали нам."
 PRU_kick_out_the_europeans: "Выкинуть европейцев"
 PRU_kick_out_the_europeans_desc: "Европейцы не имеют права быть на этом континенте, поэтому мы выгнаем их силой."
 PRU_a_powerful_empire: "Мощная империя"
 PRU_a_powerful_empire_desc: "Наша империя оказалась не только успешной, но и мощной. Тот, который смог убрать весь континент в одиночку. Наше имперское путешествие здесь не останавливается, у нас все еще есть остальные Америки."
 PRU_improve_the_imperial_transport: "Улучшить имперский транспорт"
 PRU_improve_the_imperial_transport_desc: "Наша империя растет безумно, и мы должны поддерживать каждую ее часть. Мы начнем расширение дорожной сети и расширим имперские сети."
 PRU_maintain_the_imperial_army: "Поддерживать имперскую армию"
 PRU_maintain_the_imperial_army_desc: "Наша славная армия хороша, но это может быть лучше. Мы можем сделать это намного больше, чем сейчас, и мы воспользуемся для этого."
 PRU_ask_for_protected_native_rights: "Попросить защищенные права коренных"
 PRU_ask_for_protected_native_rights_desc: "Пришло время начать наши планы. Если мы хотим реформировать империю инков, нам придется сначала сделать много вещей, прежде чем мы сможем достичь этого состояния."
 PRU_organize_mass_protests: "Организовать массовые протесты"
 PRU_organize_mass_protests_desc: "Организация массовых протестов по всей стране отбросит правительство с равновесия, заставив их выслушать протесты, в то время как мы можем работать за кулисами и планировать восстание."
 PRU_secure_the_south: "Закрепить юг"
 PRU_secure_the_south_desc: "Нам нужно найти место для начала войны, и юг кажется идеальным местом для этого."
 PRU_rally_the_native_soldiers: "Сплотить местных солдат"
 PRU_rally_the_native_soldiers_desc: "Давайте сплотим местных солдат и формируем ополченцу и надлежащим образом отдают от них. Они понадобятся, когда придет время ударить."
 PRU_secure_the_road_networks: "Защитить дорожные сети"
 PRU_secure_the_road_networks_desc: "Защита дорожных сетей будет ключевым в нашей войне за независимость. Задыхание их связей будет серьезно слабнее правительство и даст нам преимущество."
 PRU_our_war_of_independence: "Наша война за независимость"
 PRU_our_war_of_independence_desc: "Наши родные братья нанесли достаточно ущерба и достаточно ослабили правительство, теперь наша очередь вмешаться и нанести последний удар. Давайте выиграем войну и восстановим империю инков."
 PRU_train_the_warriors_of_the_sun: "Тренировать воинов солнца"
 PRU_train_the_warriors_of_the_sun_desc: "Ou Rarmy зарезервирован для Бога Солнца и только Бога Солнца. Они должны служить для этого и только для этого, и они станут сильной силой в течение долгих тренировок."
 PRU_mobilize_the_militias: "Мобилизовать ополченцы"
 PRU_mobilize_the_militias_desc: "Война идет хорошо, но мы могли бы использовать дополнительное преимущество. Призыв к ополченцам в некоторых из наших государств, которые будут работать довольно хорошо."
 PRU_the_army_of_the_sun: "Армия Солнца"
 PRU_the_army_of_the_sun_desc: "Наша армия обладает верностью Богу Солнца и только Богу Солнца. Наша армия будет более чем осознавать этот факт."
 PRU_populate_the_industrial_mills: "Заполнить промышленные мельницы"
 PRU_populate_the_industrial_mills_desc: "Иднустриальные мельницы пусты, мы можем воспользоваться и заполнить их до того, как у перуанского правительства получится шанс."
 PRU_capturing_the_armories: "Захватить арсенала"
 PRU_capturing_the_armories_desc: "Основа находится на нашем сайте, если мы сможем их захватить, то индустрия оружия будет в нашей пользе, и с этим мы выиграем в долгосрочной перспективе."
 PRU_the_inca_industry: "Индустрия инков"
 PRU_the_inca_industry_desc: "Наша отрасль становится все лучше и лучше благодаря реформам и программам расширения. Вскоре мы станем главной властью и угрозой для мира."
 PRU_solidify_our_state: "Укрепить наше состояние"
 PRU_solidify_our_state_desc: "Мы выиграли войну и обеспечили Перу, теперь мы просто должны стабилизировать себя и обеспечить наше новое государство."
 PRU_build_up_the_research_labs: "Создать исследовательские лаборатории"
 PRU_build_up_the_research_labs_desc: "Исследовательские лаборатории должны быть созданы, если мы хотим технологически конкурировать с другими странами."
 PRU_continuing_atahualpas_legacy: "Продолжайте наследие Атауалпа"
 PRU_continuing_atahualpas_legacy_desc: "Atahualpa был последним императором инков, последним человеком, который поддерживал первоначальную империю инков. Мы будем фигурировать его имя и расширимся под его наследием."
 PRU_recapturing_our_lands_in_the_north: "Повторно переоценить наши земли на севере"
 PRU_recapturing_our_lands_in_the_north_desc: "Перу бросает наши земли на севере, поэтому мы заберим их силой."
 PRU_recapturing_our_bolivian_lands: "Повторно"
 PRU_recapturing_our_bolivian_lands_desc: "Боливия проталкивает некоторые из наших земель, поэтому мы возьмем ее у них силой."
 PRU_recapturing_our_southern_lands: "Повторное воспроизведение наших южных земли"
 PRU_recapturing_our_southern_lands_desc: "Чили увлекается нашими землями, поэтому мы заберим их силой."
 PRU_our_true_borders: "Наши истинные границы"
 PRU_our_true_borders_desc: "Наши истинные границы, наконец, были восстановлены, мы достигли того, что когда -то было нашим пиком много веков назад, и мы не остановимся здесь."
 PRU_the_one_true_sun: "Одно истинное солнце"
 PRU_the_one_true_sun_desc: "Аргентинский флаг и люди, использующие нашего Господа в их флаге, презренны. У них нет чувства уважения, и они будут платить за это!"
 PRU_eliminate_the_portuguese_descendants: "Устранить португальских потомков"
 PRU_eliminate_the_portuguese_descendants_desc: "Бразилия - дешевое оправдание европейской нации, но в любом случае они все равно будут платить. Эти проклятые португальцы заплатят за проживание на этом континенте."
 PRU_eliminate_the_paraguayans: "Устранить парагвайцев"
 PRU_eliminate_the_paraguayans_desc: "Парагвай также на нашем пути, мы должны убедиться, что они вынуты."
 PRU_go_after_uruguay: "Иди после Уругвая"
 PRU_go_after_uruguay_desc: "Уругвай стоит на нашем пути полной победы. Мы сразу же вытащим их в силу."
 PRU_bring_everyone_under_the_sun: "Принесите всех под солнце"
 PRU_bring_everyone_under_the_sun_desc: "Каждая часть континента будет контролироваться нашим Господом. Люди понимают, чтобы уважать и принять тот факт, что они находятся под его правлением, и мы позаботимся о нем."
 PRU_enslave_the_european_descendants: "Поработить европейских потомков"
 PRU_enslave_the_european_descendants_desc: "Пришло время относиться к европейцам в нашей стране так же, как они относились к нам столетия назад. Мы поработим их и заставит их работать на фабриках, чтобы дать им вкус собственного лекарства. Хотя этот потребитель может повредить нашей стране, это значительно увеличит производство производства."
 PRU_the_inca_army: "Армия инков"
 PRU_the_inca_army_desc: "Наша армия - это сила, с которой нужно считаться. Мы уже покорили многие нации, и эта тенденция будет продолжаться, поэтому наша армия станет еще сильнее."
 PRU_take_out_colombia: "Уберите Колумбию"
 PRU_take_out_colombia_desc: "Колумбия - это Pesk, который стоит на нашем пути. Мы раздавим их и убедимся, что они не мешают нам снова."
 PRU_take_out_venezuela: "Уберите Венесуэлу"
 PRU_take_out_venezuela_desc: "Мало того, что Венесуэла довольно сильна, но они заполнены до краев природными ресурсами. Вытащить их очень поможет нашей экономике."
 PRU_victory_in_south_america: "Победа в Южной Америке"
 PRU_victory_in_south_america_desc: "Южная Америка наконец была обеспечена, и континент снова находится под контролем их первоначальных колонизаторов. Теперь мы можем начать смотреть наружу и отомстить европейцам."
 PRU_prepare_the_navy: "Подготовьте флот"
 PRU_prepare_the_navy_desc: "Наш флот должен подготовиться к планам, которые у нас есть, если мы хотим, чтобы они работали."
 PRU_prepare_the_army: "Подготовьте армию"
 PRU_prepare_the_army_desc: "Наша армия должна подготовиться к нашим большим планам, если мы хотим заставить ее работать."
 PRU_get_revenge_against_the_europeans: "Отомстить европейцам"
 PRU_get_revenge_against_the_europeans_desc: "Европейцы украли все наше богатство в нашем пике, Броу грипп, который убил Амни из наших людей, и даже тогда они до сих пор не узнают, какой ущерб, который они нас нанесли. Вот почему мы приедем через себя, мы сделаем с ними то, что они сделали с нами, и мы не остановимся, пока каждый дюйм Европы не окажется под нашим контролем. Только тогда мы будем действительно удовлетворены."
 PRU_total_victory: "Полная победа"
 PRU_total_victory_desc: "Мы сделали это, мы сделали то, что многие считали невозможным. Европа находится под нашим полным контролем, и мы получили полную месть. Наша работа здесь сделана, и мы можем начать формировать лучший мир, который уважает всех людей."
 PRU_expand_state_labs: "Расширить государственные лаборатории"
 PRU_expand_state_labs_desc: "Наши нынешние лаборатории находятся в состоянии, которое далеко не желательно, поэтому мы начнем их расширять."
 PRU_communist_peru: "Люди служат людям"
 PRU_communist_peru_desc: "В течение многих лет мы подвергались жестокому обращению, преследовали и заключались в тюрьму за то, что просто говорили о наших идеалах. Это больше не будет длиться, и мы покажем [ROOT.GetLeader], что он пожалеет о действиях, которые он предпринял против нас!"
 PRU_purchase_japanese_ships: "Изучить флот [ITA.GetAdjective]"
 PRU_purchase_japanese_ships_desc: "Теперь, когда мы установили дружеские отношения с [ITA.GetName], мы можем начать изучать их флот, чтобы улучшить нашу собственную."
 PRU_purchase_japanese_loans: "Покупка [ITA.GetAdjective] кредитов"
 PRU_purchase_japanese_loans_desc: "Если мы хотим, чтобы наша отрасль была быстро расти, нам нужно будет спросить ссуды от иностранной власти, чтобы помочь нам в финансовом отношении, и наша лучшая ставка - [ITA.GetName]."
 PRU_establish_an_arms_purchase_deal_with_japan: "Заключить соглашение о покупке оружия с [ITA.GetName]"
 PRU_establish_an_arms_purchase_deal_with_japan_desc: "[ITA.GetName] имеет одно из лучших пехотных оборудования, и они готовы продать его нам по более дешевой цене, чем европейские державы. Было бы разумно принять их предложение."
 PRU_lobby_for_national_support: "Лобби для национальной поддержки"
 PRU_lobby_for_national_support_desc: "Если мы хотим получить поддержку для нашего дела, мы должны обратиться к перуанскому народу. Если мы не получим поддержку большинства, у нас не будет шансов против [ROOT.GetLeader]."
 PRU_gain_the_armys_support: "Получить поддержку армии"
 PRU_gain_the_armys_support_desc: "Наличие такой сильной сущности, как армия на нашей стороне, было бы благословением. Мы должны сделать все возможное, чтобы убедить генералов высшего ранга присоединиться к нашему делу."
 PRU_merge_with_el_partido_socialista: "Слияние с El Partido Socialdemocrata"
 PRU_merge_with_el_partido_socialista_desc: "Социал -демократическая партия в Перу является одной из самых сильных во всей стране, и они тоже разделяют те же взгляды, что и мы. Мы оба также разделяем одно и то же презрение к [ROOT.GetLeader], поэтому мы почти уверены, что они согласятся с этим."
 PRU_coerce_the_politicians: "Приступить к политикам"
 PRU_coerce_the_politicians_desc: "Сердце наших врагов - в политике. Всегда был, всегда будет. Принуждая этих людей не отказаться от нации, когда у нас будет возможность взять на себя возможность оказать нам помощь в стабилизации нации."
 PRU_thwart_the_governments_attempts: "Помешать попыткам правительства"
 PRU_thwart_the_governments_attempts_desc: "В течение некоторого времени правительство [ROOT.GetLeader] помешало нам по -настоящему расцветать. Пришло время преподавать ему или два урока, чтобы не возиться с не тем врагом, и убить кого -либо, кого он пытается посылать нам, чтобы попытаться сорвать наши планы."
 PRU_take_hold_of_the_country: "Завладеть страной"
 PRU_take_hold_of_the_country_desc: "Мы наконец -то контролируем страну. Люди говорили, и мы сейчас отвечаем за то, чтобы привести эту страну к будущему, которого с нетерпением ждут людей. Давайте не будем разочаровывать их!"
 PRU_jose_carlos_influence: "Влияние Хосе Карлос Мариятеги"
 PRU_jose_carlos_influence_desc: "Неоспоримо, влияние, которое Хосе Карлос Мариятеги оказал на коммунизм и его сторонники в Перу. Он является отцом коммунизма здесь, и было бы неуважительно не уважать его желания и перенести Перу в страну, которую он предполагал."
 PRU_fund_the_CGTP: "Фонд CGTP"
 PRU_fund_the_CGTP_desc: "CGTP, короткий для Confederación General De Trabajadores del Perú, является центральным синдикатом, расположенным в Лиме, ​​Перу. Он финансировался не кем иным, как Хосе Карлосом Мариятеги, и его целью является регулирование прав и заработной платы работников. Мы будем идти по его стопам и финансируем CGTP еще дальше."
 PRU_expansionist_foreign_policy: "Экспансионистская внешняя политика"
 PRU_expansionist_foreign_policy_desc: "Подготовка установлена, пришло время начать расширяться наружу и распространять революцию нашим соседям."
 PRU_with_the_guidance_of_eudocino: "С руководством Eudocino"
 PRU_with_the_guidance_of_eudocino_desc: "Eudocino Davines - политик, писатель и журналист. После смерти Хосе Карлоса он принял власть PCP после окончания Хосе Карлоса Mariátegui и с тех пор был выдающейся фигурой PCP. С страной в руках нам вообще не нужно беспокоиться."
 PRU_adelante_jorge_del_prado: "Аделанте, Хорхе дель Прадо Чавес!"
 PRU_adelante_jorge_del_prado_desc: "Первоначально художник, художник и журналист, Хорхе решил покинуть свою работу в качестве художника и стать постоянным членом PCP. С тех пор он получил как признание, хвала и уважение со стороны членов партии. Наличие такой фигуры, как он у власти, наверняка приведет нас в хорошие вещи."
 PRU_tackle_the_crisis: "Справиться с кризисом"
 PRU_tackle_the_crisis_desc: "Наше переключение в идеологии вызвало неопределенность в экономике и кабинете. Это привело к социальному и экономическому кризису в стране, с которым мы должны иметь дело и быстро!"
 PRU_national_research: "Национальные исследования"
 PRU_national_research_desc: "Все должны учиться, чтобы технологически развивать эту страну!"
 PRU_march_north: "Март на север"
 PRU_march_north_desc: "С Эквадором, мы можем теперь перейти к обеспечению как Колумбии, так и Венесуэлы. Их люди нуждаются в освобождении, и мы здесь, чтобы сделать именно это!"
 PRU_exploit_the_venezuelan_oil: "Эксплуатировать венесуэльскую масло"
 PRU_exploit_the_venezuelan_oil_desc: "Венесуэла - это нация, которая была одарена огромным количеством природных ресурсов, одним из тех, кто является нефти. Мы могли бы очень использовать это масло и использовать его для нашей личной выгоды."
 PRU_improved_resource_extraction: "Улучшение извлечения ресурсов"
 PRU_improved_resource_extraction_desc: "Благодаря нашим достижениям в области технологий, мы можем улучшить нашу добычу ресурсов и извлечь больше ресурсов, чтобы воспользоваться преимуществами."
 PRU_establish_the_mutual_support_council: "Установить Совет взаимной поддержки"
 PRU_establish_the_mutual_support_council_desc: "Поскольку экстремальные идеологии продолжают расти в популярности и силе по всему миру, страны, которые не соответствуют какой -либо идеологии, выдвигаются все дальше и дальше в угол, и нет куда идти. В рамках этой группы стран мы должны заключить пакт о взаимной обороне в случае, когда кто -либо из нас вторгается, мы все можем вмешаться и попробовать все возможное, чтобы справиться с иностранной угрозой."
 PRU_the_final_straw: "Последняя соломка"
 PRU_the_final_straw_desc: "Мир теперь знает о нашей силе, они знают, на что мы способны. Теперь у нас есть возможности встать против ублюдков японцев и заставить их заплатить за все страдания, которые они вызвали."
  
  
 PBC_focus_tree: "Перу-Боливианская Конфедерация"
 PBC_deal_with_the_peruvian_nationalists: "Иметь дело с перуанскими националистами"
 PBC_deal_with_the_peruvian_nationalists_desc: "Нам нужно сосредоточиться на националистах по одной стране за раз. Как перуанцы, так и боливийцы становятся злющими, поэтому по одному по одному может быть нашим лучшим курсом."
 PBC_deal_with_the_bolivian_nationalists: "Иметь дело с боливийскими националистами"
 PBC_deal_with_the_bolivian_nationalists_desc: "Нам нужно сосредоточиться на националистах по одной стране за раз. Как перуанцы, так и боливийцы становятся злющими, поэтому по одному по одному может быть нашим лучшим курсом."
 PBC_build_up_arms_for_garrison: "Накачать оружие для гарнизона"
 PBC_build_up_arms_for_garrison_desc: "Нам понадобится как можно больше оборудования, чтобы вооружить наши гарнизоны, отвечающие за то, чтобы держать националистов в страхе. Если мы не сможем, то националисты станут слишком сильными."
 PBC_try_appeasing_the_nationalists: "Попробуйте умиротворять националистов"
 PBC_try_appeasing_the_nationalists_desc: "Националисты выходят из -под контроля и быстро, возможно, умиротворяя их, мы можем сдержать на некоторое время и косвенно их. Потребуется некоторое время и усилия, чтобы справиться с этим, но все может быть достигнуто с терпением."
 PBC_crush_the_nationalists_faster: "Раздавить националистов быстрее"
 PBC_crush_the_nationalists_faster_desc: "Мы не можем тратить время на эти убогие националисты, поэтому мы разберемся с ними как можно быстрее. Мы укрепим наши гарнизоны и обеспечим закон с еще большей жестокостью. Если они собираются восстать, то это их вина."
 PBC_put_the_nationalists_in_their_place: "Поставить националистов на их место"
 PBC_put_the_nationalists_in_their_place_desc: "Националисты теперь являются лишь тенью того, чем они когда -то были, и мы, наконец, можем положить конец этому беспорядку. Больше не будет националистам, националисты не будут беспокоить наш мир и поставить под сомнение наш суверенитет."
 PBC_consolidate_our_borders: "Консолидируйте наши границы"
 PBC_consolidate_our_borders_desc: "Вместо того, чтобы расширяться за пределы наших границ, было бы лучше консолидировать то, что у нас уже есть, и сосредоточиться на улучшении нашей великой страны."
 PBC_begin_our_switch_to_democracy: "Начните наш переход к демократии"
 PBC_begin_our_switch_to_democracy_desc: "Мы должны показать пример не только нашим соседям, но и для себя. Способ сделать это, следуя пути свободы свободы, пути демократии. Тот, который построен людьми, для людей."
 PBC_freedom_to_the_people: "Свобода народу"
 PBC_freedom_to_the_people_desc: "Люди Конфедерации заслуживают свободных прав и права выражать все, что они верят. Если они не могут, то мы потерпели неудачу как нация."
 PBC_supress_the_extremists: "Подавить экстремистов"
 PBC_supress_the_extremists_desc: "Наша нация была основана на насильственных идеалах, идеалах, которые не могут остаться, если мы хотим перейти на демократию. Этим экстремистам нужно замолчать и быстро, прежде чем они смогут помешать нашему переходу."
 PBC_apoint_the_congress_to_lead: "Назначить Конгресс возглавить"
 PBC_apoint_the_congress_to_lead_desc: "То, как наша нация работает, является союзом между Боливией и Перу, так как таковая, что наличие единственного лидера не будет работать, так как другая нация будет расстроен выбором лидера. Чтобы решить эту проблему, мы назначим Конгресс Такны, чтобы возглавить нацию. Там будет сочетание обоих национальностей, поэтому проблем не должно быть."
 PBC_prado_leads_the_way: "Прадо ведет путь"
 PBC_prado_leads_the_way_desc: "Мануэль Прадо Угартач возглавлял Демократическую партию Перу, и ни один другой лидер демократов не подходит, чем он. Он наверняка принесет нас на большие новые высоты и улучшит нашу нацию более чем ожидалось, даже если мы можем столкнуться с некоторыми проблемами в ближайшем будущем."
 PBC_open_up_our_politics: "Откройте нашу политику"
 PBC_open_up_our_politics_desc: "Пришло время больше не оставаться уединенными от наших соседей и остального мира. Прошло уже некоторое время с момента нашей войны за независимость, и для того, чтобы продемонстрировать наши демократические качества, мы должны открыть для наших соседей и попытаться работать с ними."
 PBC_formalize_the_defense_pact: "Формализовать защитный договор"
 PBC_formalize_the_defense_pact_desc: "Возможно, было бы трудно возродить связи с некоторыми из наших соседей, особенно с теми, кто борется против нас в нашей войне за независимость, поэтому мы начнем защитный пакт и обеспечим их безопасность. Хотя это может не сработать, это поможет этим народам пересмотреть свою позицию против нас."
 PBC_chaco_for_gurantees: "Чако для Гурантов"
 PBC_chaco_for_gurantees_desc: "Chaco Boreal является неотъемлемой частью Боливии, и теперь это неотъемлемая часть нашей страны. Мы пригласим Paraguay в защиту пакта в обмен на территорию. Если мы сохраняем с ними хорошие связи, они могут принять это предложение."
 PBC_putumayo_for_gurantees: "Путумайо для Гурантов"
 PBC_putumayo_for_gurantees_desc: "Путумайо является ключевой территорией для нашей нации и истории нашей страны, и мы попросим Колумбию об этом. Мы пригласим их в защитный договор в обмен на территорию. С достаточно хорошими отношениями они могут просто принять."
 PBC_purchase_our_lands_in_brazil: "Купить наши земли в Бразилии"
 PBC_purchase_our_lands_in_brazil_desc: "Бразилия владеет многими штатами, которые мы рассматриваем как ключевую территорию, и для удовлетворения бразильцев потребуется нечто большее, чем просто приглашение в защиту. Вот почему мы не только платим за территорию, но и предложим им приглашение в защиту."
 PBC_officialy_declare_the_defense_pact: "Официальный объявление договора обороны"
 PBC_officialy_declare_the_defense_pact_desc: "В настоящее время в договоре защиты есть много стран, поэтому было бы смысл сформировать фракцию с указанными нациями. Таким образом, мир узнает о том, насколько силен нашим договором."
 PBC_advocate_public_works: "Адвокат общественные работы"
 PBC_advocate_public_works_desc: "Если общественность хочет помочь с разработкой, то пусть будет так. Мы предложим стимулы тем, кто хочет работать, и наша страна будет взлететь благодаря этим общественным работам."
 PBC_approach_the_allies: "Приблизиться к союзникам"
 PBC_approach_the_allies_desc: "Несмотря на то, что в политике действительно нет «хорошей» стороны, совершенно ясно, что лучшим из группы является союзники. Это единственная мощная фракция, которая представляет демократические идеалы, поэтому было бы разумно присоединиться к их стороне."
 PBC_purchase_british_guns: "Покупать британские оружия"
 PBC_purchase_british_guns_desc: "Британское вооружение просто невероятно. У них есть все виды оборудования, и все это тоже в курсе. Это принесет большую пользу нашей собственной армии, если бы мы приобрели некоторые из этих вооружений в обмен на нашу столицу."
 PBC_cooperate_with_the_french_resistance: "Сотрудничать с французским сопротивлением"
 PBC_cooperate_with_the_french_resistance_desc: "Французское сопротивление очень впечатляет, удерживая монстров, которые являются нацистами. Мы должны стараться изо всех сил, чтобы помочь им любым возможным способом, если мы это сделаем, мы могли бы даже выучить от них определенные хитрости в случае иностранной оккупации."
 PBC_join_the_allies: "Присоединяйтесь к союзникам"
 PBC_join_the_allies_desc: "Мы должны сделать наш вход в чиновник союзников. Пора у них есть южноамериканский союзник на их стороне, и мы обязательно поможем им в любом случае. Фашисты и коммунисты должны быть остановлены любой ценой, они причинили слишком большой вред, и это не может быть дальше!"
 PBC_remain_neutral: "Оставаться нейтральным"
 PBC_remain_neutral_desc: "Учитывая текущую глобальную ситуацию, в наших наилучших отношениях останется нейтральным. Любая сторона, которую мы выбираем, будет просто собирать врагов, поэтому, если мы хотим сохранить стабильность, мы должны оставаться как можно более нейтральными и держаться подальше от конфликта в Европе."
 PBC_economic_cooperation_with_our_allies: "Экономическое сотрудничество с нашими союзниками"
 PBC_economic_cooperation_with_our_allies_desc: "Наши союзники могут значительно повысить нашу экономику, и мы должны использовать это в полной мере. Конечно, мы также поможем нашим Алисам, это не было бы альянсом, если бы мы были единственными, кто получил от этого. Мы все будем расширять наши экономики вместе и стать еще более сильными народами."
 PBC_economic_cooperation_with_our_allies_desc: "Наши союзники могут значительно повысить нашу экономику, и мы должны использовать это в полной мере. Конечно, мы также поможем нашим алисам, это не было бы благосостоянием, если бы мы были единственными, кто получил от этого. Мы все будем расширять наши экономики вместе и стать еще более сильными народами."
 PBC_wipe_out_the_communists: "Вытирать коммунистов"
 PBC_wipe_out_the_communists_desc: "Эти проклятые коммунисты слишком долго нарушили мир. Пришло время заставлять их заплатить за свои преступления против людей и стереть их с нашего континента. Их идеология просто слишком экстремальна, чтобы ее жили."
 PBC_wipe_out_the_fascists: "Вытереть фашистов"
 PBC_wipe_out_the_fascists_desc: "Фашисты представляют угрозу самой стабильности этого континента. Сохраняя такую ​​мерзкую идеологию, просто не может продлиться, и мы позаботимся о том, чтобы это не так."
 PBC_spread_democracy_to_our_neighbors: "Распространять демократию нашим соседям"
 PBC_spread_democracy_to_our_neighbors_desc: "Наши соседи должны начать принимать наши идеалы и понимать, что демократия - это путь вперед. Мы отправим тайных агентов, чтобы распространять демократические идеалы, и заставим людей наших соседей понять, насколько великой может быть демократия."
 PBC_peace_in_our_time: "Мир в наше время"
 PBC_peace_in_our_time_desc: "Наконец, через многие годы мы наконец -то сможем иметь мир на нашем континенте. Все экстремальные идеологии были уничтожены, и преобладающая идея - это демократия. Люди довольны своей жизнью, и наши народы процветают. У нас действительно мир в наше время."
 PBC_the_path_to_communism: "Путь к коммунизму"
 PBC_the_path_to_communism_desc: "Коммунизм - это путь вперед. Работник является единственным наиболее важным аспектом любой страны, и это неоспоримо. Мы расширим свои границы далеко за пределы их нынешнего состояния и предложим многочисленную землю работникам нашей великой страны!"
 PBC_the_glory_of_fascism: "Слава фашизма"
 PBC_the_glory_of_fascism_desc: "Наша нация - величайшая, и нам не нужно никого, чтобы сказать нам это. Мы докажем наше превосходство под знаменем фашизма, и мы заставим наших врагов дрожать в страхе, поскольку мощь нашей армии топает над их маленькой нацией!"
 PBC_spread_communism_to_the_continent: "Распространять коммунизм на континент"
 PBC_spread_communism_to_the_continent_desc: "Континент должен понимать величие коммунизма. Их народы извлекут огромную пользу от этих идеалов, и их народы укрепится из них."
 PBC_spread_fascism_to_the_continent: "Распространять фашизм на континент"
 PBC_spread_fascism_to_the_continent_desc: "Континент должен понять величие фашизма. Их народы извлекут огромную пользу от этих идеалов, и их народы укрепится из них."
 PBC_reform_the_viceroyalty_of_rio_de_la_plata: "Реформировать вице -король"
 PBC_reform_the_viceroyalty_of_rio_de_la_plata_desc: "На континенте просто слишком много наций, поэтому было бы лучше, если бы мы сжались с ними в одну. Мы можем начать с вице -короля Рио -де -ла -Плата, старое имя испанской колонии, состоящей из Аргентины, Уругвая, Чили и частей Перу и Боливии. Мы объединим Аргентину, Чили и Уругвай в этом переоснащении нации."
 PBC_reform_the_gran_colombia: "Реформа Гран Колумбия"
 PBC_reform_the_gran_colombia_desc: "Гран Колумбия была старой нацией, которая состояла из Колумбии, Эквадора, Венесуэлы и Панамы. Если мы сможем контролировать территорию, которую они когда -то контролировали, мы сможем еще раз реформировать этот союз."
 PBC_preperations_for_our_expansion: "Подготовка к нашему расширению"
 PBC_preperations_for_our_expansion_desc: "Нам понадобится как можно больше ресурсов, чтобы снять наши амбициозные планы. Чем больше военных фабрик мы можем поддерживать в нашей стране, тем больше военного производства у нас есть, и тем сильнее станет наша армия."
  
  # Bolivia 
  
 BOL_the_bohen_plan: "План Бохана"
 BOL_the_bohen_plan_desc: "Заинтересованность в Северной Америке к нашим природным ресурсам в конфликте, особенно в Эстаньо, был договорился со многими экспертами. Они согласились продвинуть агроиндиальный сектор и строительство маршрута 7 по всей востоке страны."
 BOL_founded_the_school_of_transmissions: "Основал школу передачи"
 BOL_founded_the_school_of_transmissions_desc: "Мы создадим различные профессиональные центры по всей стране в ответ на наши ужасные результаты в войне в Чако. Мы подготовим инженеров -электриков в ближайшее время, особенно с помощью радиотехнологии."
 BOL_found_the_escuela_central_tecnica: "Основана Центральная Течника Эскуэлы"
 BOL_found_the_escuela_central_tecnica_desc: "Соединение страны также является очень важной задачей. Создание Центральной Técnica Escuela Tecnica значительно продвинет нашу ранее установленную школу и лучше подготовьтесь к нам на будущее."
 BOL_begin_dealing_with_the_depression: "Начните иметь дело с депрессией"
 BOL_begin_dealing_with_the_depression_desc: "Великая депрессия насчитывала нашу экономику. Наши люди голодают, и наша политическая стабильность находится в руинах. Нам нужно как можно скорее действовать быстро и избавиться от этой депрессии и сделать необычное выздоровление."
 BOL_focus_on_what_were_good_at: "Сосредоточьтесь на том, что мы хороши"
 BOL_focus_on_what_were_good_at_desc: "Мы известны своими обильными шахтами и природными ресурсами, поэтому давайте сосредоточимся на этом. Расширяя наши шахты и злоупотребляя нашими природными ресурсами для хорошего в нашей стране, в любом случае мы не единственные."
 BOL_switch_to_an_agrarian_industry: "Переключиться на аграрное общество"
 BOL_switch_to_an_agrarian_industry_desc: "В то время как у нашей горнодобывающей промышленности все хорошо, мы должны размышлять о переходе на аграрную экономику. Наши поля очень хороши для плантаций, особенно пшеницы. Если это пойдет хорошо, мы можем довольно быстро стать основным экспортером и конкурировать даже с лучшими способностями."
 BOL_improve_our_road_networks: "Улучшить наши дорожные сети"
 BOL_improve_our_road_networks_desc: "Если мы хотим сохранить мощную горнодобывающую экономику, нам сначала необходимо обеспечить надлежащее строительство наших дорог по всей стране, чтобы перевозить наши товары по всей стране."
 BOL_feed_our_people: "Кормите наших людей"
 BOL_feed_our_people_desc: "Поскольку мы медленно переключаемся на аграрную экономику, теперь мы можем начать более эффективно кормить своих людей. В конечном счете это приведет людей в нашу сторону и положительно подумать о нашем правительстве."
 BOL_open_our_food_markets: "Откройте наши пищевые рынки"
 BOL_open_our_food_markets_desc: "Благодаря нашему ныне процветающему сельскохозяйственному производству мы можем начать экспортировать наши товары другим странам на планете. Если мы сможем сформировать торговые соглашения и установить справедливые цены на товары, мы можем хорошо и по -настоящему расширить свою экономику."
 BOL_conserve_our_resources: "Сохранить наши ресурсы"
 BOL_conserve_our_resources_desc: "В настоящее время было бы лучше сохранить наши ресурсы и сохранить наши обильные товары для себя. Мы производим так много, что даже если мы не экспортируем так много, у нас все равно будет чистая прибыль."
 BOL_expand_our_mines: "Расширить наши шахты"
 BOL_expand_our_mines_desc: "Инвестирование в наши шахты и их расширение позволит нам найти еще больше ресурсов и товаров на наших землях, и чем больше у нас будет лучше, то в целом это будет для наших торговых партнеров и экономики."
 BOL_sell_our_tungsten_mines: "Продайте наши вольфрамовые шахты"
 BOL_sell_our_tungsten_mines_desc: "Многие компании внутри нашей страны и иностранных компаний хотят купить наш вольфрам, и почему мы не согласны с такой сделкой? Наша экономика по -настоящему будет взять на себя, если мы сделаем это, поэтому мы воспользуемся ее как можно большим количеством."
 BOL_improve_relations_with_our_trade_partners: "Улучшить отношения с нашими торговыми партнерами"
 BOL_improve_relations_with_our_trade_partners_desc: "Чем лучше наши отношения с нашими торговыми партнерами, тогда тем более они будут покупать наши товары. Довольно простая, но эффективная стратегия, и при правильном использовании может привести к развитию нашей экономики."
 BOL_allow_foreign_investment: "Разрешить иностранные инвестиции"
 BOL_allow_foreign_investment_desc: "Многие инвесторы из наших соседних стран связались с нами, сказав, что хотят инвестировать в наши товары и плантации. Чем больше иностранных инвесторов мы можем привлечь, тем лучше это будет для нашей экономики."
 BOL_gurantee_foreign_trade_agreements: "Гарантировать соглашения о внешней торговле"
 BOL_gurantee_foreign_trade_agreements_desc: "Нам нужно заключить любое внешне торговли, которое мы можем получить в свои руки. Обеспечение торгового маршрута со страной означает, что они будут дипломатически обязаны покупать наши товары, что только продвинет нашу экономику еще больше!"
 BOL_improved_farmer_rights: "Улучшенные права фермеров"
 BOL_improved_farmer_rights_desc: "Наши фермеры уже давно усердно работали, и система юридической системы почти ничего не делает, поэтому начиная с сегодняшнего дня, мы будем переделать нашу юридическую систему, чтобы поддержать больше наших фермеров."
 BOL_improve_miner_salaries: "Улучшить зарплату шахтера"
 BOL_improve_miner_salaries_desc: "Заработная плата наших шахтеров близка к чему, почти позорно, насколько низко она учитывает, сколько они делают, чтобы улучшить нашу экономику. Вот почему начиная с сегодняшнего дня наши горные компании будут вынуждены привлекать зарплаты шахтеров."
 BOL_accept_government_subsidies: "Принять государственные субсидии"
 BOL_accept_government_subsidies_desc: "Различные сектора нашего правительства посылают нам субсидии, чтобы помочь горнодобывающей промышленности и вытеснять ее за пределы его лимита. Принятие этих субсидий только укрепит государственную власть и контроль над нашей нацией, поэтому нет никаких сомнений в том, каким будет наш выбор."
 BOL_maintain_a_civilian_economy: "Поддерживать гражданскую экономику"
 BOL_maintain_a_civilian_economy_desc: "Экономика, основанная на людях и гражданском рынке, вот чем заключается наша экономика. Армия на данный момент не требует больше силы, чем она имеет. В конце концов, они доказали свою бесполезность как в войне Тихого океана, так и в войне Чако."
 BOL_mobilize_the_economy: "Мобилизовать экономику"
 BOL_mobilize_the_economy_desc: "Армия должна восстановить свои силы и стать электростанцией, и для этого нам нужно больше инвестировать в наши военные."
 BOL_open_our_wheat_markets: "Откройте наши пшеничные рынки"
 BOL_open_our_wheat_markets_desc: "Наш экспорт процветает почти так же, как и наши поля, особенно нашу пшеницу. Пшеница очень ценна на иностранных рынках, и наше выращивание пшеницы когда -либо нарастает, так почему бы не открыть наши пшеничные рынки для всего мира."
 BOL_reserve_money_for_our_industry: "Резервировать деньги на нашу отрасль"
 BOL_reserve_money_for_our_industry_desc: "Наша отрасль нуждается в том, что он может привлечь, особенно из -за ущерба, который великая депрессия нанесла для нее. Если мы сможем заставить нашу отрасль продолжиться еще раз, то мы будем в хорошей форме."
 BOL_expand_the_civilian_economy: "Расширить экономику гражданского населения"
 BOL_expand_the_civilian_economy_desc: "Нам нужна оживленная гражданская экономика, прежде чем мы сможем начать побаловать себя в других вопросах. Чем сильнее наша экономика, тем больше шансов на полное национальное восстановление."
 BOL_expand_our_armories: "Расширьте наши арсенали"
 BOL_expand_our_armories_desc: "С государством, в которой находится наша армия, мы должны убедиться, что мы расширим наши арс -пастерии и промышленные возможности. Мы должны убедиться, что мы можем правильно вооружить наших людей, чтобы мы могли одержать победу в любом будущем конфликте."
 BOL_aleviate_the_industrial_mills: "Aleviate промышленные мельницы"
 BOL_aleviate_the_industrial_mills_desc: "Рабочие работают без перерыва на промышленных мельницах с тех пор, как мы начали восстанавливаться после экономической депрессии. Возможно, лучше всего подготовить мельницы и позволить работникам сделать перерыв, заменив их более современными технологиями и оборудованием, делая их работу более эффективной и приобретает меньшую рабочую силу."
 BOL_an_open_economy: "Открытая экономика"
 BOL_an_open_economy_desc: "После очень амбициозного переключения в нашей экономике, различных реформ и промышленной экспансии мы хорошо и по -настоящему возродили нашу экономику и стали открытой экономикой, которая включает в себя массовый экспорт товаров и услуг и стали дружить с различными нациями."
 BOL_a_self_sufficient_economy: "Самодостаточная экономика"
 BOL_a_self_sufficient_economy_desc: "После многих реформ, промышленных расширений и увеличения добычи полезных ископаемых мы хорошо и по -настоящему превзошли эту катастрофическую депрессию, которая поразила нашу экономику. Теперь благодаря нашим обильным ресурсам и товарам нам не нужно зависеть от кого -либо еще, чтобы поддерживать нашу экономику, и мы находимся на пути, чтобы по -настоящему стать автоматической экономикой."
 BOL_new_research_facilities: "Новые исследовательские учреждения"
 BOL_new_research_facilities_desc: "С нашими экономическими проблемами, теперь мы можем начать расширять наши исследовательские сооружения и модернизировать наше оборудование. Модернизация является ключом к победе!"
 BOL_side_with_the_people: "Сторона с людьми"
 BOL_side_with_the_people_desc: "свобода слова"
 BOL_side_with_military: "Сторона с военными"
 BOL_side_with_military_desc: "В то время как люди могут злиться на наше правительство, если мы на стороне военных в перевороте, так как все будет стоять, это будет нашим лучшим вариантом. В конечном счете мы можем вернуть гражданских лиц в наши руки, нравится им это или нет."
 BOL_secure_the_southern_provinces: "Закрепить южные провинции"
 BOL_secure_the_southern_provinces_desc: "Хотя кажется маловероятным, что мы сможем контролировать столицу или любую из северных провинций, то же самое нельзя сказать для южных. Люди наверняка поддержат нас в нашем конфликте и принесут демократию нацию!"
 BOL_militarize_the_people_in_our_provinces: "Милитаризировать людей в наших провинциях"
 BOL_militarize_the_people_in_our_provinces_desc: "Гражданская война не будет легкой в ​​малейшей степени, поэтому нам понадобится каждое небольшое преимущество, которое мы можем получить. Призыв к населению в штатах, которые, как мы знаем, мы сможем, чтобы высший контроль станет ключевым в нашей победе над армией."
 BOL_secure_the_guardia_nacional: "Закрепить национальную охрану"
 BOL_secure_the_guardia_nacional_desc: "Guardia Nacional - это группа элитных войск в наших вооруженных силах и была очень важна для нас с момента основания нашей нации. Закрепление их и получение их на нашей стороне изменит поток войны в нашу пользу."
 BOL_disband_the_bolivian_armed_forces: "Расформировать боливийские вооруженные силы"
 BOL_disband_the_bolivian_armed_forces_desc: "Давайте сделаем это официальным, пришло время распустить боливийские вооруженные силы, для большего блага страны и будущего, к которому это приведет. Хотя это приведет к немедленной реакции армии, это риск, который мы должны взять."
 BOL_purchase_foreign_arms: "Купить иностранные оружия"
 BOL_purchase_foreign_arms_desc: "Иностранное пехотное оборудование лучше, чем наше собственное, так почему бы не приобрести его и не использовать для наших военных усилий."
 BOL_mobilizing_the_economy: "Мобилизация экономики"
 BOL_mobilizing_the_economy_desc: "Экономика должна перейти в режим войны, нам нужно выиграть эту гражданскую войну независимо от затрат."
 BOL_strengthen_the_guardia_nacional: "Укрепить охрану"
 BOL_strengthen_the_guardia_nacional_desc: "До сих пор The Guardia Nacional помогает нам в этой войне, но мы определенно можем использовать больше помощи."
 BOL_train_new_generals: "Обучить новых генералов"
 BOL_train_new_generals_desc: "Нам нужны новые генералы быстро! Наши два лучших генерала полностью против нас, поэтому нам понадобятся новые талантливые умы в этой области, чтобы противодействовать им."
 BOL_take_matters_into_our_own_hands: "Возьмите дело в свои руки"
 BOL_take_matters_into_our_own_hands_desc: "Пришло время взять дело в свои руки и самостоятельно вести армию. Нам нужно преодолеть восстание сейчас больше, чем когда -либо, и каждый день, который проходит, - это день, который мы могли бы использовать для стабилизации нации, поэтому нам нужно как можно быстрее положить конец этой гражданской войне."
 BOL_secure_the_loyalty_of_our_army: "Обеспечить верность нашей армии"
 BOL_secure_the_loyalty_of_our_army_desc: "Нам нужно обеспечить часть армии, которая все еще верна нам. Если мы сможем это обеспечить это, то остальные постепенно начнут присоединяться к нашей стороне."
 BOL_the_bolivian_army_reborn: "Боливийская армия возрождается"
 BOL_the_bolivian_army_reborn_desc: "Армия теперь гораздо более сильная версия своего прошлого. После многих реформ и отчаянных действий, они являются очень мощной силой, которая будет полезна в будущем."
 BOL_victor_of_the_civil_war: "Победитель гражданской войны"
 BOL_victor_of_the_civil_war_desc: "Мы вышли победителями над военными и снова успешно обеспечили нашу нацию. Наш путь был очищен, и мы можем начать наш процесс реабилитации."
 BOL_a_path_of_diplomacy: "Боливийская демократия"
 BOL_a_path_of_diplomacy_desc: "Если мы действительно хотим вернуть наши потерянные земли, то наиболее возможным вариантом является дипломатия, просто нет другой альтернативы."
 BOL_open_up_our_foreing_policy: "Откройте нашу внешнюю политику"
 BOL_open_up_our_foreing_policy_desc: "Пришло время открыть нашу политику и начинаем взаимодействовать с внешним миром."
 BOL_try_to_buyback_chaco: "Попробуйте выкупить чако"
 BOL_try_to_buyback_chaco_desc: "В то время как парагвайцы сражались и победили нас за Чако, война оставила их в экономически искалеченном состоянии. Из -за этого может быть шанс, что они могут вернуть нам землю, если мы купим ее у них, но это будет стоить больших денег."
 BOL_sea_access_for_resource_rights: "Доступ к море для прав на ресурсы"
 BOL_sea_access_for_resource_rights_desc: "В то время как чилийцы богаты сталью, то же самое можно сказать и о вольфраме. Мы можем заключить с ними сделку, предоставив им права на ресурсы для нашего вольфрама в обмен на нашу потерянную землю, и есть большая вероятность, что они могут принять."
 BOL_try_to_purchase_acre: "Попробуйте купить акра"
 BOL_try_to_purchase_acre_desc: "Из -за того, что ACRE был недоразвит, Бразилия может быть готова просто передать нам землю, если мы предложим ее приобрести."
 BOL_our_borders_finaly_restored: "Наши границы наконец восстановились"
 BOL_our_borders_finaly_restored_desc: "После различных дипломатических контактов и довольно большой суммы потраченных денег мы получили наши первоначальные границы. Наши люди подбадривают наше правительство по всей стране, и ни одна душа не была потеряна в процессе."
 BOL_join_the_allies: "Присоединяйтесь к союзникам"
 BOL_join_the_allies_desc: "Союзники - хорошие парни этого мира в настоящее время, поэтому было бы разумно объединить себя с ними и быть на правильной стороне любого конфликта."
 BOL_learn_from_the_british_navy: "Учиться у британского флота"
 BOL_learn_from_the_british_navy_desc: "Нельзя отрицать военно -морскую мощь англичан, и теперь, когда мы создаем Anvay, мы можем многому научиться у их военно -морского флота."
 BOL_purchase_british_armaments: "Покупать британские вооружения"
 BOL_purchase_british_armaments_desc: "У британцев есть некоторые из самых продвинутых вооружений на планете, поэтому было бы очень опасно купить их."
 BOL_economic_cooperation_with_britain: "Экономическое сотрудничество с Британией"
 BOL_economic_cooperation_with_britain_desc: "Британия - это промышленная власть, и это нельзя отрицать. Их промышленность может очень помочь нашей собственной отрасли и продвинуть ее вперед."
 BOL_look_for_a_close_ally: "Ищите близкого союзника"
 BOL_look_for_a_close_ally_desc: "Мы не должны искать союзников в Европе, вместо этого мы должны искать некоторых прямо здесь, на нашем собственном континенте."
 BOL_join_the_argentines: "Присоединяйтесь к аргентинцам"
 BOL_join_the_argentines_desc: "Несмотря на то, что аргентинцы делали с нами в прошлом, они по -прежнему являются хорошим выстрелом в союзнике, и в конце дня союзник всегда лучше, чем враг."
 BOL_join_the_chileans: "Присоединяйтесь к чилийцам"
 BOL_join_the_chileans_desc: "Мы должны отложить наши военные действия и начать новый путь мира и процветания между нашими народами."
 BOL_join_the_peruvians: "Присоединяйтесь к перуанцам"
 BOL_join_the_peruvians_desc: "Перуанцы всегда были дружелюбны с нами, они станут нашим лучшим выбором для альянса."
 BOL_create_our_own_faction: "Создать свою собственную фракцию"
 BOL_create_our_own_faction_desc: "Мы должны просто создать свою собственную фракцию и быть лидером нашей фракции, а не зависеть от кого -то другого."
 BOL_economic_boost_from_our_ally: "Экономический рост от нашего союзника"
 BOL_economic_boost_from_our_ally_desc: "Наш союзник дал нам много экономических выгод, которые мы теперь можем использовать в наших преимуществах благодаря нашим дружеским отношениям."
 BOL_invite_the_other_democracies: "Пригласить других демократий"
 BOL_invite_the_other_democracies_desc: "Давайте пригласим другие демократии в наш альянс и установим надлежащий демократический альянс на континенте."
 BOL_arm_up_the_population: "Поднимать население"
 BOL_arm_up_the_population_desc: "Наше население будет готово к любой угрозе, с которой она может столкнуться, и мы начнем готовить подготовку, начиная с сегодняшнего дня."
 BOL_clean_up_the_fascists: "Очистите фашистов"
 BOL_clean_up_the_fascists_desc: "Давайте разберемся с фашистами на континенте. Их преступления на человечестве больше не продлятся."
 BOL_clean_up_the_communists: "Очистите коммунистов"
 BOL_clean_up_the_communists_desc: "Давайте разберемся с коммунистами на континенте. Их преступления на человечестве больше не продлятся."
 BOL_a_path_of_force: "Централизовать государственный контроль"
 BOL_a_path_of_force_desc: "Демократия и дипломатия в целом просто не работают в современную эпоху. Военная и грубая сила - это то, что демонстрирует истинное чувство власти и мощь, и это единственный способ заставить другие нации слушать нас и серьезно относиться к нам, и централизация правительства Техады может быть нашим ключом к успеху."
 BOL_making_the_military_our_puppet: "Марионетка военных"
 BOL_making_the_military_our_puppet_desc: "О, как перевернулись столы, будучи марионеткой военных, которые теперь купили военные. Мы будем использовать военные для наших собственных амбициозных целей."
 BOL_ban_the_press: "Запретить прессу"
 BOL_ban_the_press_desc: "В последнее время пресса была очень надоедливой, давая нам плохую славу и мешает нам. Вот почему пресса будет запрещена, чтобы люди получили свой источник новостей от нас и только нас."
 BOL_establish_the_new_regime: "Укрепить правительство"
 BOL_establish_the_new_regime_desc: "Пришло время отказаться от демократии, это просто не работает, и в любом случае у нас есть другие планы. Наши соседи будут бояться нашей мощи."
 BOL_focus_on_expanding_our_industry: "Сосредоточьтесь на расширении нашей отрасли"
 BOL_focus_on_expanding_our_industry_desc: "Промышленность - это все в стране, она решает много факторов в стране. Если мы можем иметь сильную отрасль, то мы обязательно будем успешной нацией."
 BOL_expand_the_armories: "Расширить арсенал"
 BOL_expand_the_armories_desc: "Чем больше наша индустрия оружия, тем больше будет наше производство и производство оружия."
 BOL_investment_possibilities_in_south_america: "Инвестиционные возможности в Южной Америке"
 BOL_investment_possibilities_in_south_america_desc: "У наших соседей есть много ресурсов и инвестиционных возможностей, лучше всего использовать это в полной мере и извлечь выгоду из этого."
 BOL_expand_our_conscription: "Расширить наш призыв"
 BOL_expand_our_conscription_desc: "На данный момент нам понадобится больше людей в поле, если мы хотим, чтобы наши амбиции стали правдой."
 BOL_a_revived_industry: "Оживленная отрасль"
 BOL_a_revived_industry_desc: "Наша отрасль наконец достигла приемлемого уровня. Наша экономика растет, наши люди счастливы, и наша стабильность растет. Будущее яркое для Боливии."
 BOL_placate_to_the_experienced_officers: "Уловить к опытным офицерам"
 BOL_placate_to_the_experienced_officers_desc: "У опытных офицеров есть опыт, чтобы на самом деле управлять страной, они способны управлять нацией."
 BOL_empower_the_young_officers: "Расширить возможности молодых офицеров"
 BOL_empower_the_young_officers_desc: "Молодые - будущее, а молодые офицеры - это те, которые приведут эту нацию к величию."
 BOL_begin_regaining_the_peoples_trust: "Начать восстанавливать доверие людей"
 BOL_begin_regaining_the_peoples_trust_desc: "Люди оставили нас и правительство в целом, и мы обязаны вернуть их под наш контроль и показать им истинный путь."
 BOL_restructure_parliament: "Реструктуризация парламента"
 BOL_restructure_parliament_desc: "Парламент не является тем, что предпочитает наши идеалы, поэтому нам нужно будет реструктурировать его, чтобы сделать его должным образом функционировать в рамках нашей идеологии."
 BOL_kickstart_the_industry: "Kickstart в отрасли"
 BOL_kickstart_the_industry_desc: "Наша отрасль существует, она просто нужно немного подтолкнуть в правильном направлении, чтобы она функционировала, как и должно."
 BOL_nationalize_the_holdings_of_standard_oil: "Национализируйте активы стандартной нефти"
 BOL_nationalize_the_holdings_of_standard_oil_desc: "Стандартная нефть имеет много активов, которые сейчас могут быть очень полезны для нашего правительства, поэтому национализация ее лучшего выбора."
 BOL_set_up_corporate_style_system: "Установите систему корпоративного стиля"
 BOL_set_up_corporate_style_system_desc: "Создание системы корпоративного стиля значительно улучшит не только нашу экономику, но и нашу захват политики страны."
 BOL_improve_worker_conditions: "Улучшить условия работников"
 BOL_improve_worker_conditions_desc: "Текущие условия работников на наших заводах менее чем желательны, поэтому мы изменим это начиная с сегодняшнего дня."
 BOL_embrace_a_new_idea: "Принять новую идею"
 BOL_embrace_a_new_idea_desc: "В то время как нашей первоначальной идеей было создание военного социализма, идея фашистского государства имеет большой смысл для Боливии. Используя наши территориальные потери в качестве катализаторов для фашистской поддержки, мы можем легко заставить людей болеть за фашистское состояние, и поэтому мы и это сделаем."
 BOL_begin_purging_the_military_socialists: "Начните чистить военных социалистов"
 BOL_begin_purging_the_military_socialists_desc: "Военные социалисты стоят на нашем пути фашистского поглощения. Они все еще не осознавали наш переход на фашизм, поэтому мы просто должны заставить их осознать."
 BOL_revive_our_military_industry: "Оживить нашу военную промышленность"
 BOL_revive_our_military_industry_desc: "Наша военная промышленность сильно не хватает, поэтому сейчас расширение было бы довольно хорошим."
 BOL_embrace_military_socialism: "Примите военный социализм"
 BOL_embrace_military_socialism_desc: "Военный социализм - это наша собственная уникальная идеология, которая имеет все возможности для тренировки. Принимая кусочки авторитаризма и социализма и объединение их в улучшенную идеологию."
 BOL_expand_worker_rights: "Расширить права работников"
 BOL_expand_worker_rights_desc: "Права, которые в настоящее время обладают нашими работниками, являются ужасными, и это должно измениться немедленно. Чем лучше наши права работников, тем больше у них вывода."
 BOL_a_balanced_Economy: "Сбалансированная экономика"
 BOL_a_balanced_Economy_desc: "Мы не можем расставить приоритеты в гражданской индустрии над вооружением, и наоборот. Было бы лучше, если бы мы сохранили баланс между ними и выровняем нашу экономику."
 BOL_nation_reborn: "Наша нация возрождается"
 BOL_nation_reborn_desc: "После многих жертв мы, наконец, стабилизировались как нация. Люди снова верят в правительство, и мы можем начать сосредоточиться на наших политических действиях и планах."
 BOL_continue_with_toro: "Продолжить с Торо"
 BOL_continue_with_toro_desc: "Торо - самый опытный из двух генералов. Он лучший выбор, чтобы вытащить нас из этой лазейки, в которой застряла Боливия и принесла нас региональной власти."
 BOL_put_german_in_his_place: "Поместить Германа на его место"
 BOL_put_german_in_his_place_desc: "Давайте разберемся с Германом и остановим его в его следах. Тот факт, что он восстает, уже сама по себе, поэтому мы убедим его присоединиться к нам, и он получит особые полномочия в правительстве. Таким образом, он даже не подумает о повторении."
 BOL_continue_with_german: "Продолжить с Германом"
 BOL_continue_with_german_desc: "Герман - наша лучшая ставка, когда дело доходит до выбора между ним и Торо. Быть младшим дает ему больше времени, чтобы адаптироваться и изучать климат Боливии и в конечном итоге приведет нацию к успешному будущему."
 BOL_hold_the_1938_national_convention: "Держать Национальное собрание 1938 года"
 BOL_hold_the_1938_national_convention_desc: "Боливийская национальная конвенция 1938 года была собранием законодательного органа однорацидического боливии, состоящего из избранного компонентного собрания, состоящей из палаты сенаторов и палаты депутатов. Мы будем использовать эту конвенцию, чтобы составить будущие планы для нации и планировать то, что мы будем делать."
 BOL_treaty_of_peace_with_paraguay: "Договор о мире с парагваем"
 BOL_treaty_of_peace_with_paraguay_desc: "Договор Чако был договором о мире, подписанном между Боливией и Парагваем 12 июля 1938 года. Этот договор официально закончил все военные действия между Парагваем и Боливией. Давайте раз и навсегда закончим этот конфликт и создадим нового союзника на западе."
 BOL_write_the_1938_constitution: "Напишите конституцию 1938 года"
 BOL_write_the_1938_constitution_desc: "Нынешняя конституция просто не работает в нынешнем ландшафте нашей страны, поэтому пришло время написать новую конституцию, которая имеет отношение к нынешним проблемам."
 BOL_hand_out_welfare_plans: "Раздавать планы социального обеспечения"
 BOL_hand_out_welfare_plans_desc: "Бедный и рабочий класс нашей нации все еще борются, так что давайте дадим им руку помощи. Хотя это может немного поразить нас в краткосрочной перспективе, в долгосрочной перспективе это позволит распространять больше денег в нашей стране и позволить нашей экономике расти."
 BOL_establish_ourselves_as_dictator: "Установить Германа как диктатор"
 BOL_establish_ourselves_as_dictator_desc: "Давайте перейдем к следующему шагу и зарекомендоваем себя как диктатор. Эта страна нуждается в прямом контроле, и мы единственные, кто может это произойти."
 BOL_invest_in_the_army: "Инвестировать в армию"
 BOL_invest_in_the_army_desc: "Наша армия требует увеличения инвестирования, чтобы сделать ее мощной силой, и нашей армии отчаянно нуждаются в этом."
 BOL_choose_a_path_of_democracy: "Выберите путь демократии"
 BOL_choose_a_path_of_democracy_desc: "Демократия и свобода - это то, что приводит нацию к процветанию, и это то, к чему мы идем. Наши люди будут свободны думать и делать все, что они хотят."
 BOL_continue_with_the_military: "Продолжить с военными"
 BOL_continue_with_the_military_desc: "Военные - это место, где находится наша истинная сила. Нам нужно продолжить военные, если мы хотим, чтобы наша нация оставалась стабильной и эффективной."
 BOL_make_our_ideals_official: "Сделайте наши идеалы официальными"
 BOL_make_our_ideals_official_desc: "Пришло время сделать наши фашистские идеалы официальными. Вега приведет нас к пути славы через фашизм. Великие силы, такие как Германия и Италия, сделали это, так почему мы не можем?"
 BOL_tackle_toro_directly: "Займись Торо напрямую"
 BOL_tackle_toro_directly_desc: "Пришло время напрямую начинать иметь дело с Торо, сосредотачивая все наше внимание на его остановке. С ним не по пути мы сможем сосредоточиться на других более важных вопросах."
 BOL_imprison_toro: "Тюремное заключение Торо"
 BOL_imprison_toro_desc: "Теперь, когда Торо находится на его бэкфуте, мы можем начать заключать в тюрьму его сторонников за вандализм, который они вызвали, и в конечном итоге сам заключили в тюрьму Торо и раз и навсегда положить конец его схемам."
 BOL_contact_the_peruvians: "Свяжитесь с перуанцами"
 BOL_contact_the_peruvians_desc: "Теперь, когда наше население под контролем мы можем начать работать над нашей внешней политикой. Перу станет нашей первой целью, и мы постараемся связаться с ними."
 BOL_reform_the_peru_bolivian_confederation: "Оживить Перу-Боливианскую Конфедерацию"
 BOL_reform_the_peru_bolivian_confederation_desc: "Перу-Боливская Конфедерация, недолговечный союз между штатами Боливия, Северной Перу и Южным Перу. Этот первоначальный союз, возможно, не сработал, но на этот раз он может сработать. Наши улучшенные отношения с Перу, несомненно, заставит их принять это предложение."
 BOL_propose_a_plan_to_peru: "Предложить план Перу"
 BOL_propose_a_plan_to_peru_desc: "Перу, как и мы, потерял землю и достоинство против Чили в первой войне Тихого океана. Скорее всего, они примут двойной план вторжения Чили. Чили не увидит этого."
 BOL_get_revenge_for_our_sea_access_loss: "Получите месть за нашу потерю доступа в море"
 BOL_get_revenge_for_our_sea_access_loss_desc: "Пора Чили заплатит за то, что они сделали. Их преступления больше не могут длиться. Мы начнем неожиданное оскорбление против них и возьмем инициативу!"
 BOL_the_second_war_of_the_pacific: "Вторая война Тихого океана"
 BOL_the_second_war_of_the_pacific_desc: "Вторая война Тихого океана началась, наша война с конечной местью действительно началась. Давайте выиграем и уступим этой борьбой раз и навсегда."
 BOL_mobilize_the_militias: "Мобилизовать ополченцы"
 BOL_mobilize_the_militias_desc: "Каждый человек должен служить, дать им пистолет и сигарету и отправить их на фронт!"
 BOL_an_economy_for_war: "Экономика для войны"
 BOL_an_economy_for_war_desc: "Наша экономика должна быть одной из войн в эти времена. Мы не сможем продержаться, если не примем такую ​​резкую меру."
 BOL_ask_for_foreign_volunteers: "Спросите иностранных добровольцев"
 BOL_ask_for_foreign_volunteers_desc: "Требование войны выдвигало наши ограничения на армию, и нам понадобится иностранная помощь, чтобы мы могли продолжать вступить в бой."
 BOL_expand_the_conscription: "Расширить призыв"
 BOL_expand_the_conscription_desc: "Нам нужно расширить призыв, чтобы мы могли призвать больше людей в армию."
 BOL_victor_of_the_war_of_the_pacific: "Виктор второй войны Тихого океана"
 BOL_victor_of_the_war_of_the_pacific_desc: "После многих месяцев кровопролития и борьбы мы наконец вышли на первое место. То, что когда -то было нашим бременем, стало благословением, и мы вернули наш доступ к морю. Наш путь вперед теперь действительно очищен."
 BOL_alliance_with_peru: "Альянс с Перу"
 BOL_alliance_with_peru_desc: "Перу был единственной нацией, которой мы можем действительно доверять. У них всегда были наши спины, и мы должны погасить их за все их добрые дела, сделав нашего альянса."
 BOL_economic_cooperation_with_peru: "Экономическое сотрудничество с Перу"
 BOL_economic_cooperation_with_peru_desc: "Обе наши экономики растут быстро. Это будет расти быстрее, если бы мы сотрудничали экономически."
 BOL_mutual_military_buildup: "Взаимное военное накопление"
 BOL_mutual_military_buildup_desc: "Угрозы нависаются вокруг нас, поэтому нам нужно создать наши армии, чтобы быть готовыми к любой угрозе, которая может прийти на наш путь."
 BOL_use_a_shared_currency: "Используйте общую валюту"
 BOL_use_a_shared_currency_desc: "Давайте установим общую валюту между нами и Перу, поэтому нам не нужно слишком беспокоиться об инфляции, и наша экономика может расти с одинаковой скоростью."
 BOL_go_after_chile: "Иди после Чили"
 BOL_go_after_chile_desc: "Чили всегда увязала нас и помешала нам достичь нашего пика, поэтому мы вытереть их с лица этой земли, чтобы этого никогда не произошло."
 BOL_take_out_argentina: "Возьмите нашу Аргентину"
 BOL_take_out_argentina_desc: "Аргентина и была врагом с момента ее зачатия, и мы не можем дольше этого пройти."
 BOL_invite_venezuela: "Пригласить Венесуэлу"
 BOL_invite_venezuela_desc: "Венесуэла - очень богатая нация, которая довольно мощная. Было бы разумно иметь их в нашей фракции."
 BOL_invest_in_the_venezuelan_oil: "Инвестировать в венесуэльскую нефть"
 BOL_invest_in_the_venezuelan_oil_desc: "Венесуэла сложена с нефтью, почти такой же, как и на Ближнем Востоке. Мы можем инвестировать в их нефть, чтобы они выиграли в краткосрочной перспективе, и мы получаем пользу в долгосрочной перспективе."
 BOL_take_out_paraguay: "Уберите Парагвай"
 BOL_take_out_paraguay_desc: "Парагвай вызвал у нас много проблем, им нужно и заплатит за то, что они сделали с нами."
 BOL_invite_paraguay: "Пригласить Парагвай"
 BOL_invite_paraguay_desc: "Paraguay разделяет очень похожие убеждения в наших собственных и даже несколько раз зарекомендовали себя, чтобы иметь компетентную армию. Было бы разумно иметь их в нашей фракции."
 BOL_establish_a_common_border: "Установить общую границу"
 BOL_establish_a_common_border_desc: "Пришло время соединить наши границы с Венесуэлой. Колумбия и Эквадор стоят на пути, так что давайте пройдем через них."
 BOL_take_out_brazil: "Убери Бразилию"
 BOL_take_out_brazil_desc: "Бразилия будет самой сложной задачей для преодоления, но с достаточным количеством приверженности и усилий от нас и наших союзников мы сможем их снять."
 BOL_our_rightful_borders: "Наши законные границы"
 BOL_our_rightful_borders_desc: "Наши настоящие границы наконец -то были восстановлены. После многих лет наращивания, потерь и усилий мы наконец достигли границ, которые мы хотели. Наш путь теперь ясен."
 BOL_forge_our_own_path: "Подделать наш собственный путь"
 BOL_forge_our_own_path_desc: "Наша судьба отличается от судьбы любой другой страны, мы не можем позволить себе объединиться с кем -то. Единственная страна, которой мы доверяем, - это сами, и мы будем держать это таким образом."
 BOL_our_wars_of_vengence: "Наши войны мести"
 BOL_our_wars_of_vengence_desc: "Все наши соседи забрали у нас территорию, они все оскорбляли нас и воспользовались нашим слабым местом и ситуацией. Каждая страна, которая воспользовалась нами, будет платить, они будут платить своей кровью и землей!"
 BOL_retaking_the_chaco: "Пересмотреть чако"
 BOL_retaking_the_chaco_desc: "Потеряв чако в 1935 году парагвайцам, многие боливии потеряли веру в нашу нацию, и общий национализм упал. Это изменится, мы вернем Чако, и наша старая слава будет восстановлена!"
 BOL_revenge_against_the_chileans: "Месть снова числа"
 BOL_revenge_against_the_chileans_desc: "Чилии взяли то, что было наиболее ценным для нас, и они заставили нас страдать из -за этого. Вот почему мы заставим их заплатить за то, что они сделали со мной, мы вернем наши земли и больше и полностью закончаем их!"
 BOL_the_peruvian_menace: "Перуанская угроза"
 BOL_the_peruvian_menace_desc: "Перуанцы сейчас являются одной из наших самых больших угроз, и нам нужно иметь дело с ними. В то время как мы были союзниками, на этот раз мы будем противоположными, и этот Перу не тот, с которым мы соблюдаем в прошлом."
 BOL_building_up_our_conquered_lands: "Создание наших завоеванных земель"
 BOL_building_up_our_conquered_lands_desc: "Земли, которые мы завоевали, недоразвиты и бедны, но с нашей сейчас шумной экономикой мы можем это изменить."
 BOL_force_integrate_our_new_territory: "Сила интегрировать нашу новую территорию"
 BOL_force_integrate_our_new_territory_desc: "Наше быстрое расширение заставило нас получить много новых территорий. Нам нужно начать интегрировать их в боливийскую нацию и сделать его неотъемлемой частью боливийской территории."
 BOL_make_the_argentineans_pay: "Заставлять аргентинцев платить"
 BOL_make_the_argentineans_pay_desc: "Аргентинцы причиняют большой ущерб нашей стране на протяжении многих лет. Они будут платить за все, что они сделали с нами."
 BOL_retaking_acre: "Редакция акра"
 BOL_retaking_acre_desc: "Бразилия взяла акр из нас десятилетия назад, но даже после всего этого времени мы не забыли, и они узнают, что мы не забыли, когда увидят, как наши солдаты идут на их землю!"
 BOL_go_after_ecuador: "Иди после Эквадора"
 BOL_go_after_ecuador_desc: "Эквадору было бы лучше под контролем, так что давайте сделаем эту мечту реальностью."
 BOL_go_after_colombia: "Иди после Колумбии"
 BOL_go_after_colombia_desc: "Колумбия - это Pesk, который стоит на нашем пути. Мы раздавим их и убедимся, что они не мешают нам снова."
 BOL_take_out_venezuela: "Уберите Венесуэлу"
 BOL_take_out_venezuela_desc: "Мало того, что Венесуэла довольно сильна, но они заполнены до краев природными ресурсами. Вытащить их очень поможет нашей экономике."
 BOL_triumphant_will: "Триумфальная воля"
 BOL_triumphant_will_desc: "Каждая страна в Южной Америке попала под наш контроль. То, что они считали невозможным, стало возможным, и мы доказали планете, что мы являемся силой, с которой нужно считаться!"
 BOL_army_revival: "Армейское возрождение"
 BOL_army_revival_desc: "Наша армия не то, что было раньше. После многих программ, изменений, реформ и увеличения инвестиций у нас есть надлежащая армия. Тот, который не увяз от прошлого, но с нетерпением жду будущего."
 BOL_reforming_the_army: "Реформировать армию"
 BOL_reforming_the_army_desc: "Боливийская армия создала очень плохую репутацию. Наши различные территориальные потери, потери в большинстве войн, особенно в последней войне в Чако. Нам нужно реформировать нашу армию и избавиться от этой репутации, которая сдерживает нас."
 BOL_restoring_faith_in_the_army: "Восстановление веры в армию"
 BOL_restoring_faith_in_the_army_desc: "Различные военные потери заставили наше население потерять веру в армию. Нам нужно вернуть их веру, потому что, если мы не сможем, мы не сможем получить могущественную армию."
 BOL_advocating_bolivian_nationalism: "Адвокат Боливийский национализм"
 BOL_advocating_bolivian_nationalism_desc: "Давайте опубликуем массовую пропаганду, картины лидеров, политических деятелей и боливийских флагов по всей стране. Люди должны гордиться тем, что они боливийцы, и мы позаботимся о том, чтобы они были."
 BOL_help_out_the_spanish: "Помогите испанскому"
 BOL_help_out_the_spanish_desc: "Испанские находятся в состоянии почти анархии из -за гражданской войны, самое большее, что мы можем сделать, это помочь им как можно быстрее положить конец их конфликту."
 BOL_study_spanish_infantry_equipment: "Изучить испанское пехотное оборудование"
 BOL_study_spanish_infantry_equipment_desc: "У испанцев есть довольно хорошее пехотное оборудование, которое мы могли бы использовать, и воспользоваться собой."
 BOL_examine_the_spanish_artillery: "Изучите испанскую артиллерию"
 BOL_examine_the_spanish_artillery_desc: "Артиллерия, которую мы наблюдали в гражданской войне в Испании, являются одними из лучших на планете. Занимая их за заметки, чтобы лучше улучшить нашу собственную артиллерию."
 BOL_expanding_our_armaments: "Расширение наших вооружений"
 BOL_expanding_our_armaments_desc: "С нашими нынешними вооружениями мы не сможем поставить всю армию, поэтому необходимо сделать расширение."
 BOL_expanding_the_bolivian_Army: "Расширение боливийской армии"
 BOL_expanding_the_bolivian_Army_desc: "Боливийская армия должна быть расширена больше, чем в настоящее время, если мы хотим представить истинную угрозу любому врагу, с которым мы можем столкнуться."
 BOL_establishing_a_proper_airforce: "Установить надлежащие ВВС"
 BOL_establishing_a_proper_airforce_desc: "Боливийские воздушные силы не самые лучшие в Южной Америке, далеко от них. Вот почему мы проведем различные программы расширения, чтобы расширить наши ВВС и сделать их сопоставимыми с региональной властью."
 BOL_expand_the_airbases: "Расширить авиабазы"
 BOL_expand_the_airbases_desc: "Наши авиабазы ​​маленькие и редкие. Если мы хотим поддерживать хорошую воздушную силу, нам сначала нужно расширить наши авиабазы."
 BOL_modernize_our_fighters: "Модернизируйте наших бойцов"
 BOL_modernize_our_fighters_desc: "Модернизация наших бойцов является ключом к тому, чтобы выиграть битву в воздухе."
 BOL_modernize_our_bombers: "Модернизируйте наших бомбардировщиков"
 BOL_modernize_our_bombers_desc: "Модернизация наших бомбардировщиков позволит нам нанести ущерб вражеской индустрии, что позволит нам проникнуть через них."
 BOL_rebuilding_the_bolivian_navy: "Восстановление военно -морского флота Боливии"
 BOL_rebuilding_the_bolivian_navy_desc: "До того, как Боливия потеряла свой доступ к морю, он использовал для поддержания военно -морского флота значительного размера. Теперь, когда у нас еще раз есть доступ к морю, давайте перестроим этот флот."
 BOL_focus_on_light_ships: "Сосредоточьтесь на световых кораблях"
 BOL_focus_on_light_ships_desc: "Световые корабли очень дешевы, и наша отрасль более чем способна производить многие из них."
 BOL_improved_submarine_production: "Улучшенное производство подводных лодок"
 BOL_improved_submarine_production_desc: "Пришло время улучшить нашу подводную лодку. Субновники очень дешевы, поэтому давайте злоупотребляем этим как можно больше."
 BOL_focus_on_heavy_ships: "Сосредоточиться на тяжелых кораблях"
 BOL_focus_on_heavy_ships_desc: "Тяжелые корабли - ключ к победе военно -морских сражений. Лучше всего уделять им все внимание."
 BOL_improve_our_heavy_ships: "Улучшить наши тяжелые корабли"
 BOL_improve_our_heavy_ships_desc: "Наши тяжелые корабли, хотя и хорошие, нуждаются в улучшениях, чтобы иметь шанс против тяжелых кораблей других стран."
 BOL_continue_our_naval_rearmament: "Продолжить наше военно-морское вооружение"
 BOL_continue_our_naval_rearmament_desc: "Наш военно -морской перевооружение до сих пор прошло хорошо, но нам нужно продолжить его, чтобы достичь приемлемого состояния."
 BOL_our_navy_restored: "Наш военно -морской флот восстановился"
 BOL_our_navy_restored_desc: "После различных реформ и разработчиков программ, у нас наконец -то есть надлежащий военно -морской флот, готовый решить любую проблему, с которой он может столкнуться."
 BOL_the_tejada_dictatorship: "Техада диктатура"
 BOL_the_tejada_dictatorship_desc: "Техада может быть не самым подходящим лидером для нации, но он, безусловно, доказал свою ценность во время гражданской войны. Он станет лучшим лидером со временем, это займет время, но это обязательно произойдет!"
 BOL_establish_an_allience_with_brazil: "Создать союз с Бразилией"
 BOL_establish_an_allience_with_brazil_desc: "Бразильцы являются электростанцией Южной Америки, поэтому их в качестве союзника было бы очень полезным."
 BOL_try_to_buy_acre_off_brazil: "Попробуйте купить акра в Бразилии"
 BOL_try_to_buy_acre_off_brazil_desc: "Из -за того, что ACRE был недоразвит, Бразилия может быть готова просто передать нам землю, если мы предложим ее приобрести."
 BOL_focusing_on_internal_politics: "Сосредоточиться на нашей внутренней политике"
 BOL_focusing_on_internal_politics_desc: "Вместо бездумного расширения нашей территории мы должны объединить нашу нацию и убедиться, что мы оправились от нашего внезапного правительственного перехода."
 BOL_close_down_the_economy: "Закрыть экономику"
 BOL_close_down_the_economy_desc: "Никому, кроме боливийцев, не должно быть разрешено использовать наши ресурсы. Почему мы должны обменять его, когда мы можем использовать его и расширить нашу собственную отрасль и военную силу."
 BOL_nationalize_our_industry: "Национализируйте нашу отрасль"
 BOL_nationalize_our_industry_desc: "Подобно тому, как мы закрыли наши ресурсы на внешность, мы должны делать то же самое с нашими компаниями, вместо этого сосредоточившись на разработке и производстве нашей родины."
 BOL_support_from_the_catholic_church: "Получить поддержку от церкви"
 BOL_support_from_the_catholic_church_desc: "Наши идеалы сильно полагаются на католическую церковь и ее последователей. Мы верные последователи Христа, и мы сделаем все в нашей власти, чтобы распространить Его Слово тем, кто не повезло услышать его мудрость. Поддержка со стороны церкви является данной, поэтому мы должны воспользоваться этим."
 BOL_draft_plans_to_take_antofagasta: "Проекты планы по привлечению Antofagasta"
 BOL_draft_plans_to_take_antofagasta_desc: "Пришло время начать составлять планы по расширению нашей территории, но мы не должны просто вторгаться в другие страны, как маньяк. Вместо этого давайте сначала сосредоточимся на нашей главной цели, Чили. Они владеют провинцией Антафагаста, которая блокирует наш доступ к морю. С правильными методами мы можем вырвать его от них, не рискуя полномасштабной войной."
 BOL_focus_all_our_efforts_on_the_plan: "Сосредоточить все наши усилия на плане"
 BOL_focus_all_our_efforts_on_the_plan_desc: "Все наши ресурсы должны быть сосредоточены на мирном приеме Антафагаста. Это займет время и рабочую силу, но с правильными условиями это определенно возможно. Наш доступ к морю терпеливо ждет!"
 BOL_prepare_our_forces_for_worst_case: "Подготовьте наши силы к худшему случаю"
 BOL_prepare_our_forces_for_worst_case_desc: "Мы должны подготовиться к худшему сценарию на всякий случай. Маловероятно, что чилийцы просто позволили бы нам взять на свою землю без какого -либо сопротивления."
 BOL_connect_the_country: "Соединить страну"
 BOL_connect_the_country_desc: "Наша нация очень бедна, когда дело доходит до дорог и железных дорог. Если мы хотим быть успешной NAATION, мы должны построить надлежащую дорожную сеть и железнодорожную систему."
 BOL_total_success: "Общий успех"
 BOL_total_success_desc: "Наш план был успешным, и мы взяли Антафагаста. Неудивительно, что чилийцы не облегчали, но, тем не менее, мы сняли его и на шаг ближе к достижению наших целей."
 BOL_develop_antofagasta: "Разработать Антагагаста"
 BOL_develop_antofagasta_desc: "Мы должны стремиться к разработке нашей новой получившей территорию. Теперь, имея доступ к морю, мы сможем сделать много вещей, и на этот раз в Южной Америке мы будем уважаемыми региональной властью!"
 BOL_strengthen_our_catholic_support: "Укрепить нашу католическую поддержку"
 BOL_strengthen_our_catholic_support_desc: "Католики видели, что мы смогли сделать с их поддержкой, и они полны надежды на наше будущее. Мы должны воспользоваться таким наполненным надеждой сообществом и улучшить нашу нацию наряду с их поддержкой."
  
 ARG_focus_on_foreign_immigration: "Сосредоточиться на иностранной иммиграции"
 ARG_focus_on_foreign_immigration_desc: "Наша нация является одной из самых стабильных в регионе, и многие люди со всего мира рассматривают иммигрирование в нашу страну. Мы должны расширить нашу иммиграционную политику и принять любого человека, который хочет."
  
  ### Peru-Bolivian Confederation ### 
 PBC_choose_our_leader: "Выберите нашего лидера"
 PBC_choose_our_leader_desc: "Нам нужен лидер и пост! Наш выбор довольно ограничен, но мы можем заставить его работать. Наличие какой -то формы лидерства лучше, чем вообще не иметь."
 PBC_our_war_of_independence: "Наша война за независимость"
 PBC_our_war_of_independence_desc: "Эти ублюдки не позволят нам оставаться независимыми без войны, но они совершили серьезную ошибку. На этот раз мы получим нашу законную независимость и стоять победа. Мы усвоили наши уроки из первой войны, так что во второй раз мы можем действительно быть на победной стороне."
 PBC_focus_on_our_armed_forces: "Сосредоточиться на наших вооруженных силах"
 PBC_focus_on_our_armed_forces_desc: "Сейчас самой важной ветвью нашей нации являются наши вооруженные силы. Поддержание мощной армии - это то, что позволит нам выиграть эту войну и выдержать победу против наших врагов."
 PBC_maneging_the_new_nation: "Управление новой нацией"
 PBC_maneging_the_new_nation_desc: "В связи с тем, что наш профсоюз будет очень новым, нам придется назначить различные министерства, чтобы надлежащим образом управлять страной. Процесс не должен занять слишком много времени, и это стоит того в долгосрочной перспективе."
 PBC_invite_foreign_advisors: "Пригласить иностранных консультантов"
 PBC_invite_foreign_advisors_desc: "Что нам действительно нужно сейчас, так это иностранные советы, чтобы правильно направить нас на правильном пути и стать электростанцией."
 PBC_unite_the_parties: "Объединить стороны"
 PBC_unite_the_parties_desc: "То, как он стоит, боливийские и перуанские партии мешают нашему успеху как союза двух штатов, поэтому давайте объединим две стороны. Создание коалиции решит большинство наших проблем в этом секторе."
 PBC_deal_with_the_economy: "Иметь дело с экономикой"
 PBC_deal_with_the_economy_desc: "Наша экономика вообще не подготовлена ​​для этой войны, поэтому мы должны начать дело с этим и быстро, если мы хотим сохранить наш суверенитет."
 PBC_mobilize_the_economy: "Мобилизовать экономику"
 PBC_mobilize_the_economy_desc: "Экономика будет и будет экономикой войны, по крайней мере. Как только война закончится, мы можем увидеть, что мы можем сделать."
 PBC_unite_the_industries: "Объединить отрасли"
 PBC_unite_the_industries_desc: "Конкуренция между перуанскими и боливийскими компаниями нарушает нашу экономику, и мы должны остановить это прямо сейчас. Предложение профсоюза различных компаний и предоставление льгот для обоих, обязательно решит эту проблему."
 PBC_reform_the_research_facilities: "Реформировать исследовательские учреждения"
 PBC_reform_the_research_facilities_desc: "Наши исследовательские объекты устарели и старые, как на боливийской, так и на перуанской стороне. Модернизация и реформирование их приведет к более широким возможностям для технологической экспансии."
 PBC_stabilizing_the_nation: "Стабилизация нации"
 PBC_stabilizing_the_nation_desc: "Стабильность нашей страны далека от хорошей, поэтому мы должны убедиться, что она стабилизировалась и быстро, чтобы наша нация могла расти."
 PBC_calm_down_the_nationalists: "Успокаивать националистов"
 PBC_calm_down_the_nationalists_desc: "Перувианские и боливийские националисты наносят ущерб нашему прогрессу в качестве страны. Лучше всего, чтобы мы успокоили их, чтобы наша новая нация могла расти и процветать."
 PBC_mutual_military_training: "Взаимная военная подготовка"
 PBC_mutual_military_training_desc: "Обучение нашей армии взаимно между боливийскими и перуанскими генералами обязательно решит наши проблемы с разделением нашей армии."
 PBC_fully_reform_the_army: "Полностью реформировать армию"
 PBC_fully_reform_the_army_desc: "Наша армия не перуанская и не боливийская, она официально Перу-Боливианская. Реформирование нашей армии и заставив наших солдат понять, что концепция позволит нашей армии действительно быть мощной."
 PBC_arm_up_the_militias: "Поднимать ополченцы"
 PBC_arm_up_the_militias_desc: "Мы можем сформировать различные ополченцы по всей нашей стране и доставить их на передовые. Хотя они могут не быть нашим лучшим вариантом, они, безусловно, имеют решающее значение, в эту секунду."
 PBC_escelate_the_war: "Эскалация войны"
 PBC_escelate_the_war_desc: "Периодически эскалация войны даст нашему населению все больше и больше причины бороться за дело и укрепить наши шансы на победу в войне."
 PBC_expanding_our_armaments: "Расширение наших вооружений"
 PBC_expanding_our_armaments_desc: "Наши Армаманеты на данный момент отсутствуют и не могут не отставать от требований войны, поэтому немедленно эффективная программа расширения будет инициирована для расширения наших вооружений."
 PBC_purchase_foreign_arms: "Купить иностранные оружия"
 PBC_purchase_foreign_arms_desc: "Наша лучшая ставка сейчас - просто купить иностранное оружие и использовать их в наших интересах против наших врагов."
 PBC_ask_for_foreign_volunteers: "Спросите иностранных добровольцев"
 PBC_ask_for_foreign_volunteers_desc: "У врагов просто слишком много солдат, но у нас есть трюк в нашу рукав. Мы постараемся убедить другие страны на континенте отправить нам добровольцев и помочь нам в наших военных усилиях."
 PBC_expand_the_army: "Расширить армию"
 PBC_expand_the_army_desc: "На данный момент наша армия не такая большая, как хотелось бы. Мы начнем программу пособия, чтобы привлечь больше солдат и вырастить нашу армию."
 PBC_conscript_militias_across_the_country: "Ополченцы призывника по всей стране"
 PBC_conscript_militias_across_the_country_desc: "Пришло время действительно выиграть эту войну раз и навсегда. Мы сосредоточим все наше внимание на предоставлении людей по всему национальному оружию и призыву их к ополченцам, чтобы отправить их на фронт. Для Конфедерации!"
 PBC_independent_at_last: "Наконец -то независимый"
 PBC_independent_at_last_desc: "Мы наконец выиграли нашу войну за независимость. Это казалось невозможным, и все же мы сделали это. Мы достигли того, что наши первоначальные предки не могли сделать. Наш путь теперь действительно ясен от препятствий, и мы можем зарекомендовать себя как правильная страна."
 PBC_prepare_for_our_expansion: "Подготовьтесь к нашему расширению"
 PBC_prepare_for_our_expansion_desc: "Если эти ублюдки подумали, что выбора войны за войну и проигрыша было достаточно, то они погибли неправильно! Мы не остановимся, пока они не будут полностью уничтожены с карты."
 PBC_make_the_argentines_pay: "Заставлять аргентинцев оплачивать"
 PBC_make_the_argentines_pay_desc: "Аргентинцы в значительной степени несут ответственность за наше первоначальное падение и почти во второй раз, поэтому они будут платить за то, что они сделали с нами!"
 PBC_make_the_chileans_pay: "Заставить чилийцев платить"
 PBC_make_the_chileans_pay_desc: "Чилии также несут ответственность за наш первоначальный падение и почти во второй раз, поэтому они будут платить за то, что они сделали с нами!"
 PBC_integrate_our_newly_conquered_lands: "Интегрировать наши недавно завоеванные земли"
 PBC_integrate_our_newly_conquered_lands_desc: "Люди будут переданы под нашим полным контролем, и наши завоеванные земли станут неотъемлемой частью нашей нации."
 PBC_take_out_uruguay: "Убери Уругвай"
 PBC_take_out_uruguay_desc: "Уругвай стоит на нашем пути полной победы. Мы сразу же вытащим их в силу."
 PBC_take_out_paraguay: "Уберите Парагвай"
 PBC_take_out_paraguay_desc: "Парагвай также на нашем пути, мы должны убедиться, что они вынуты."
 PBC_take_out_colombia_and_ecuador: "Уберите Колумбию и Эквадор"
 PBC_take_out_colombia_and_ecuador_desc: "Колумбия и Эквадор - последние две страны, которые должны заплатить за свои преступления против нас. Мы их вытатим!"
 PBC_go_after_venezuela: "Иди после Венесуэлы"
 PBC_go_after_venezuela_desc: "Мало того, что Венесуэла довольно сильна, но они заполнены до краев природными ресурсами. Вытащить их очень поможет нашей экономике."
 PBC_take_out_brazil: "Убери Бразилию"
 PBC_take_out_brazil_desc: "Бразилия - наша самая большая угроза на сегодняшний день, общение с ними решит, кто возглавляет этот континент, и это будут мы!"
 PBC_push_past_the_darien_gap: "Протолкнуть промежуток"
 PBC_push_past_the_darien_gap_desc: "Благодаря контролю над Колумбией и Венесуэлой, мы можем начать искать еще дальше, более конкретно, Центральная Америка. То, что стоит между нами и завоевание всего региона, - это разрыв Дариэна, участок леса между Колумбией и Панамой. Это не должно доказывать проблему для наших солдат, и мы сможем пробить."
 PBC_conquer_the_central_american_nations: "Победить страны Центральной Америки"
 PBC_conquer_the_central_american_nations_desc: "Теперь, когда у нас есть сильная опора в Центральной Америке, остальная часть региона должна быть бризом. Их армии не должны иметь шансов против наших, и мы будем на шаг ближе к нашей окончательной войне против американцев."
 PBC_conquer_the_mexicans: "Завоевать мексиканцев"
 PBC_conquer_the_mexicans_desc: "Мексиканцы - последняя нация, стоящая между нами и США. Мы имеем дело с ними, и наш путь к США полностью открыт."
 PBC_build_up_for_the_final_war: "Накапливаться для окончательной войны"
 PBC_build_up_for_the_final_war_desc: "Наш последний конфликт с США будет долгим и кровавым войной, поэтому мы должны убедиться, что мы накапливаемся как можно больше."
 PBC_the_one_true_american_power: "Настоящая американская электростанция"
 PBC_the_one_true_american_power_desc: "Пришло время, давайте достанем США и утвердимся как единственная настоящая американская электростанция."
 PBC_reforming_the_economy: "Реформирование отрасли"
 PBC_reforming_the_economy_desc: "Наша отрасль должна быть реформирована, если мы хотим должным образом начать развивать нашу экономику."
 PBC_investing_in_the_civilian_economy: "Инвестировать в гражданскую экономику"
 PBC_investing_in_the_civilian_economy_desc: "Гражданская экономика является основой кономией большинства стран, и она будет такой же для нас."
 PBC_invest_in_our_armaments: "Инвестировать в наши вооружения"
 PBC_invest_in_our_armaments_desc: "Наши вооружения по -прежнему не хватает даже после наших программ расширения, поэтому мы будем инвестировать еще больше, чтобы убедиться, что это не продолжается."
 PBC_focus_more_on_industry: "Сосредоточиться больше на промышленности"
 PBC_focus_more_on_industry_desc: "В настоящее время отрасль требует всего нашего внимания, так что это именно то, что мы будем делать."
 PBC_focus_more_on_our_army: "Сосредоточиться больше на нашей армии"
 PBC_focus_more_on_our_army_desc: "Наша армия нуждается в том, что она может привлечь. Чем больше, тем лучше, и чем лучше наша армия, тем сильнее будет наша нация."
 PBC_expand_even_further_our_industry: "Расширить еще дальше нашу отрасль"
 PBC_expand_even_further_our_industry_desc: "В нашей индустрии есть место для дальнейшего расширения, поэтому мы сделаем именно это. Чем более расширена наша отрасль, тем лучше."
 PBC_further_improve_our_arms_industry: "Еще больше улучшить нашу индустрию вооружений"
 PBC_further_improve_our_arms_industry_desc: "Наша вооруженная индустрия может питать нашу армию и позволить нашим вооруженным силам стать еще сильнее."
 PBC_redirect_our_fundings: "Перенаправить наши финансирование"
 PBC_redirect_our_fundings_desc: "Мы слишком много инвестировали в нашу отрасль, и это причиняет нам боль в других секторах нашей отрасли. Давайте сократим наши фонды и перенаправляем их в других частях страны."
 PBC_improve_the_army: "Улучшить армию"
 PBC_improve_the_army_desc: "Мы улучшим нашу армию, чтобы сделать ее грозной силой. Чем сильнее, тем больше, что наши шансы поразительны в сердцах наших врагов."
 PBC_improve_our_firearms: "Улучшить наше огнестрельное оружие"
 PBC_improve_our_firearms_desc: "Огнестрельное оружие - самая основная технология, используемая солдатами в армиях. Если у нас может быть самое современное огнестрельное оружие, мы будем иметь преимущество против наших врагов."
 PBC_improve_our_artillery: "Улучшить нашу артиллерию"
 PBC_improve_our_artillery_desc: "Современная артиллерия позволит нам упаковать больший удар из меньшего количества артиллерии."
 PBC_establish_a_tank_korp: "Установить силу танка"
 PBC_establish_a_tank_korp_desc: "Танки - современный способ войны. Мы овладеем этой техникой, и никто не сможет остановить нас."
 PBC_establish_a_proper_airforce: "Установить надлежащую воздушную силу"
 PBC_establish_a_proper_airforce_desc: "Наша воздушная сила не так сильна, и мы должны укрепить ее, если хотим представить угрозу для других воздушных сил."
 PBC_imrpove_our_fighters: "Улучшить наших бойцов"
 PBC_imrpove_our_fighters_desc: "Модернизация наших бойцов является ключом к тому, чтобы выиграть битву в воздухе."
 PBC_improve_our_bombers: "Улучшить наши бомбардировщики"
 PBC_improve_our_bombers_desc: "Модернизация наших бомбардировщиков позволит нам нанести ущерб вражеской индустрии, что позволит нам проникнуть через них."
 PBC_purchase_foreign_planes: "Купить иностранные самолеты"
 PBC_purchase_foreign_planes_desc: "Иностранные крупные державы создают свои воздушные силы с впечатляющей скоростью. Было бы глупо не покупать некоторые из их самолетов, даже если нам приходится заключать сделки с определенными мрачными."
 PBC_build_up_the_navy: "Создать флот"
 PBC_build_up_the_navy_desc: "Наш флот не хватает и отчаянно нуждается в крупном финансировании, чтобы поддерживать его. Как только у нас появится мощный флот, никто не бросит нам вызов в морях."
 PBC_focus_on_light_ships: "Сосредоточьтесь на световых кораблях"
 PBC_focus_on_light_ships_desc: "Световые корабли очень дешевы, и наша отрасль более чем способна производить многие из них."
 PBC_focus_on_heavy_ships: "Сосредоточиться на тяжелых кораблях"
 PBC_focus_on_heavy_ships_desc: "Тяжелые корабли - ключ к победе военно -морских сражений. Лучше всего уделять им все внимание."
 PBC_modernizing_the_light_cruisers: "Модернизация наших легких крейсеров"
 PBC_modernizing_the_light_cruisers_desc: "Световые крейсеры довольно дешевы, и все еще накладывают удар, и мы будем использовать его в полной мере."
 PBC_expand_further_our_dockyards: "Расширить наши верфи"
 PBC_expand_further_our_dockyards_desc: "Если мы хотим конкурировать с военно -морскими способностями Европы, то мы должны расширить наши верфи и военно -морские продукты, если мы хотим достать куда угодно."
 PBC_modernize_our_naval_bombers: "Модернизируйте наши военно -морские бомбардировщики"
 PBC_modernize_our_naval_bombers_desc: "Военно -морские бомбардировщики обеспечат наше доминирование в море и в воздухе одновременно."
 PBC_design_coastal_ships: "Дизайн прибрежных кораблей"
 PBC_design_coastal_ships_desc: "Благодаря лучшей технологии и повышению эффективности, мы можем быстро построить прибрежную защиту в случае войны."
  
  ##Colombia## 
 COL_la_revolucion_en_marcha: "Марширующая революция"
 COL_la_revolucion_en_marcha_desc: "Флагманская программа Лопеса Пумарехо, так называемое Revolución en Marcha, популярна даже среди консерваторов. Он направлен на модернизацию страны, индустриализацию, обновление социальных законов и структурных реформ общества. Короче говоря, это закрепляет, что обязанность государства состоит в том, чтобы «влиять на мирное, означает все, что сделало бы революцию»."
 COL_integrar_la_inversion_militar: "Военная инвестиционная интеграция"
 COL_integrar_la_inversion_militar_desc: "В эти неспокойные времена военные расходы необходимы для защиты нации. Увеличение инвестиций и включение военных материалов в государственные расходы будет очень полезным в долгосрочной перспективе."
 COL_ley_de_movilizacion_militar: "Национальный закон о призывах"
 COL_ley_de_movilizacion_militar_desc: "Правила, регулирующие военную службу, не были изменены с начала тысячи дней войны в 1899 году. Пришло время возобновить это законодательство, чтобы нарастать ряды армии, военно -морского флота и военно -воздушных сил."
 COL_continuar_la_reforma_agraria: "Продолжить аграрную реформу"
 reforma_tt: "§R Олигархам не понравится, что государство противоречит их интересам. §! \ n"
 COL_continuar_la_reforma_agraria_desc: "Очевидно, что в Колумбии распределение земли неравное; В то время как крупные землевладельцы соответствуют целым гектарам, крестьяне остаются в стороне и не могут экономически конкурировать. Мы должны настаивать на ратификации аграрной реформы, которая оправдывает разделение земли и государственного вмешательства, даже если это что -то обременительное."
 COL_mantener_los_privilegios_patronales: "Поддерживать привилегии работодателя"
 privilegios_tt: "§R людям не понравится, что государство приостанавливает олигархисы."
 COL_mantener_los_privilegios_patronales_desc: "Это факт, что колумбийские землевладельцы - это те, кто лучше всего знает, как управлять сельскохозяйственным производством. Мы не можем просто поставить ответственность, иначе вся экономика рухнет. Хотя это больно для профсоюзов, сохранение правовых привилегий работодателей является единственным способом развития страны."
 COL_surcando_mar_y_oceano: "Плыть по морю и океану"
 COL_surcando_mar_y_oceano_desc: "Колумбийские корабли должны быть готовы для навигации как на мелководье, так и наклонных океанов. В конце концов, в стране есть выход в Атлантику, Тихоокеанский регион и Карибское море. Нет смысла, более стратегического, чем у нас."
 COL_astilleros_del_pacifico: "Тихоокеанские верфи"
 COL_astilleros_del_pacifico_desc: "Часть развития нации экономически воспринимает способность производить наши собственные корабля. Тихоокеанское побережье, являющееся важной точкой торговли и прямого выхода на восток, является идеальным местом для позиционирования этой отрасли."
 COL_armada_de_la_republica: "Военно -морской флот Республики"
 COL_armada_de_la_republica_desc: "Неслыханно, что у нас есть только три устаревших эсминца, в то время как у других американских наций даже есть линкоры. Очевидно, что мы не можем немедленно сопоставить их военно -морскую силу, но первый шаг состоит в том, чтобы правильно структурировать военно -морской флот, следуя примеру великих сил."
 COL_la_mision_de_rojas_pinilla: "Миссия Рохас Пиниллы"
 COL_la_mision_de_rojas_pinilla_desc: "Во время колумбийской перспередитивной войны 1932 года лейтенант Густаво Рохас Пинилла утверждал, что колумбийская военная промышленность и методы обучения устарели. По этой причине Высшее командование подготовило специальную миссию по обновлению этих аспектов, и это требует только президентской санкции для его выполнения."
 COL_fuerza_aerea_colombiana: "Колумбийские ВВС"
 COL_fuerza_aerea_colombiana_desc: "До сих пор помнят, что первым президентом в мире, который использовал официальный самолет, был Колумбийский Педро Нел Оспина в 1922 году. Наша история была связана с авиацией с того момента, как они стали переплетенными, и это наследие не может быть потеряно. Колумбия должна иметь воздушные силы наравне с основными державами."
 COL_ejercito_nacional: "Национальная армия"
 COL_ejercito_nacional_desc: "Наша славная армия имеет свои корни в независимости, и с тех пор смелые солдаты дали себе тело и душу защите нашего суверенитета. Институт требует особого обращения со стороны правительства, поскольку оно представляет всю историю войны страны: отечество, честь, лояльность."
 COL_produccion_aeronautica: "Аэронавтическое производство"
 COL_produccion_aeronautica_desc: "Импорт самолетов из других стран будет совершенно неустойчивым в контексте полномасштабной войны. Внутренняя отрасль должна быть адаптирована к потребностям ВВС, используя современные и сложные сборочные линии."
 COL_modernizar_el_armamento: "Модернизируйте оружие"
 COL_modernizar_el_armamento_desc: "Мы не можем продолжать снабжать наши войска оружием десять лет назад и ожидать, что их выступление будет выдающейся. Необходимо перенаправить часть военных расходов при разработке обновленного и эффективного оборудования, способного справиться с иностранным механизмом."
 COL_indumil: "Индомиль"
 COL_indumil_desc: "Понятно, что монополия производства оружия не может быть передана ни одному частному человеку, но государство не может выдержать рассеянную и неорганизованную производство. Соответствующим будет централизация производства в общественной компании, колумбийской военной промышленности (Indumil)."
 COL_tacticas_aereas: "Воздушная тактика"
 COL_tacticas_aereas_desc: "Воздушный бой сложный, гораздо больше, чем земля или морской бой. Это включает в себя большое количество дисциплин и знаний, которые необходимо подробно изучить. В противном случае мы будем обречены проиграть войну в воздухе."
 COL_fabricas_nacionales: "Национальные фабрики"
 COL_fabricas_nacionales_desc: "Наше производство становится все более и более зависимым от иностранной отрасли. Этот порочный цикл должен быть ограничен финансированием фабрик с национальной штаб -квартирой, которая создает рабочие места и поддерживает хорошие результаты во времена кризиса."
 COL_estrategia_de_altamar: "Стратегия открытого моря"
 COL_estrategia_de_altamar_desc: "Борьба в открытом море - это не то же самое, что пересекать реку или лагуну. Военно -морской флот должен быть готов сражаться в местах далеко от побережья, даже если это означает реструктуризацию всей программы военно -морского обучения."
 COL_vigilancia_costera: "Прибрежный патрулинг"
 COL_vigilancia_costera_desc: "Мы должны признать, что мы не способны защитить обширные морские границы страны. Единственный жизнеспособный вариант защиты себя - это создать патрулирующую систему вдоль Тихоокеанского побережья и Карибского бассейна, тем самым поддерживая обновление военно -морского интеллекта в режиме реального времени."
 COL_fuego_del_cielo: "Погонь с неба"
 COL_fuego_del_cielo_desc: "Если мы не сможем заряжать военную ответственность на земле, то мы будем подчиняться воздуху. Мы разработаем модели бомбардировщиков, способные атаковать ключевые очки противника, и мы заставим их дрожать, развернув дождь огня библейских пропорций над ними."
 COL_artilleria_arrolladora: "Подавляющая огневая мощь"
 COL_artilleria_arrolladora_desc: "Огненная мощь необходима на фронте. Мы потратим решающее время, изучая этот тип оружия, чтобы вооружить наших смелых угоновок необходимыми инструментами, с которыми враг останется беззащитным."
 COL_motorizar_la_infanteria: "Моторизировать пехоту"
 COL_motorizar_la_infanteria_desc: "В долгосрочной перспективе кавалерийский батальон гораздо более дорогостоящий, чем моторизованный. Мы не можем позволить себе взять многодневную вершину лошади на фронт, в то время как наши подразделения срочно нуждаются в подкреплении. Мы будем реализовать огромный план моторизации, чтобы создать компетентную армию."
 COL_fortalecer_la_marina_mercante: "Укрепить торговый морской пехотинец"
 COL_fortalecer_la_marina_mercante_desc: "Торговый морской пехотинец может быть не очень полезным в мирное время, но в войне они станут важной поддержкой для логистики и транспорта. Если мы адаптируем больше коммерческих судов для служения в торговом морском пехотине, мы будем лучше подготовлены в случае непредвиденных событий военно -морского флота."
 COL_proteccion_desde_las_profundidades: "Защита от глубин"
 COL_proteccion_desde_las_profundidades_desc: "Будущее военно -морского боя не в волнах, а под ними. Использование парка подводных лодок даст нам огромное преимущество против атакующим поверхностным лицом, и мы даже сможем ослабить их торговлю и транспорт."
 COL_policia_militar: "Военная полиция"
 COL_policia_militar_desc: "Регулярная полиция, состоящая из гражданских лиц, не является наиболее подходящей для нации с военным наследием, как наша. Мы будем милитаризировать институт, чтобы оно служило поддержкой не только во внутреннем порядке, но и на поле битвы, если это станет необходимым."
 COL_defensa_desde_tierra: "Защита от земли"
 COL_defensa_desde_tierra_desc: "Мы слишком бредовые, если считаем, что военно -морской флот достаточной защиты от военно -морского вторжения. Нам необходимо установить линию защиты, способной защищать себя, поэтому мы заказам построение сотен фортов, которые будут неприступны против любого амфибийного нападения."
 COL_defensa_desde_tierra_tt: "Поместите §Ycoastal forts§! в каждом прибрежном колумбийском государствах, которые полностью контролируются вами."
 COL_modernizar_la_aviacion_naval: "Модернизировать военно -морскую авиацию"
 COL_modernizar_la_aviacion_naval_desc: "Военно -воздушные силы также несут ответственность за защиту неба наших океанов. Тем не менее, этот тип работы требует определенных моделей самолетов, и мы должны иметь их в первую очередь. Мы посвятим специальный раздел нашего исследования проектированию самолетов этого типа."
 COL_manufactura_blindada: "Производство броней"
 COL_manufactura_blindada_desc: "Посмотрим правде в глаза, у кавалерии нет шансов против бронированного наступления, ни транспортного грузовика против военного танка. Пришло время, чтобы наша военная промышленность была гибкой, добавив доспехи в нашу пехоту."
 COL_topografia_militar: "Военная топография"
 COL_topografia_militar_desc: "Изучение местности также необходимо при планировании преступления или защитной линии. Используя огромную и разнообразную географию нашей нации, мы будем обучать наших теоретиков выполнять конкретные логистические задачи, если он станет необходимым в области боя."
 COL_propiedad_social: "Общее собственность"
 COL_propiedad_social_desc: "Мы не можем продолжать рассматривать собственность как частную форму экономической эксплуатации. Государство должно признать социальную функцию, которую собственность имеет в качестве помощи менее предпочтительным, включая тех, кто много владеет и мало эксплуатирует. Мы не допустим, чтобы эта маржа неравенства продолжалось среди колумбийского населения."
 COL_legalizar_las_huelgas: "Легализовать удары"
 COL_legalizar_las_huelgas_desc: "Что -то, что так же распространено, как удары, все еще считается незаконным в стране. Это не что иное, как оправдание прав работников, и это деспотическая тактика - считать это преступлением. Законодательство должно измениться немедленно."
 COL_organizar_los_sindicatos: "Организовать профсоюзы"
 COL_organizar_los_sindicatos_desc: "Союзы сегодня являются не чем иным, как неорганизованными трудовыми кругами без четкого списка требований и внутренних разногласий. Если правительство вступит и поможет их организовать, мы получим большое сообщество рабочего класса, которое будет максимизировать производство, согласившись на их точку зрения."
 COL_priorizar_al_obrero: "Расставить приоритеты работника"
 COL_priorizar_al_obrero_desc: "Существует много разговоров о предпринимательстве и крупных промышленниках, но средний заработный заработок остается в стороне. У них есть необходимость, приоритеты и, прежде всего, права тоже. Закон должен быть преобразован в течение их пользы, или мы будем игнорировать большую проблему в нашем обществе."
 COL_garantizar_el_acceso_universitario: "Гарантия доступа в университет"
 COL_garantizar_el_acceso_universitario_desc: "Несправедливо, что только несколько людей - это те, кто имеет доступ к высшему образованию, в то время как остальные люди приговорены к неформальной или плохо оплачиваемой работе. Государственные университеты являются ключом к закрытию колумбийского разрыва в образовании."
 COL_cooperar_con_los_terratenientes: "Сотрудничать с землевладельцами"
 COL_cooperar_con_los_terratenientes_desc: "Крупные землевладельцы - это те, кто знает, что лучше для национальной экономики. Само государство не способно управлять всем как материальной единицей, но если оно работает как частная организация, оно может быть устойчивой моделью. Мы установим соглашения с землевладельцами, чтобы государство работало в соответствии с ними."
 COL_semilleros_de_investigacion: "Очаги исследований"
 COL_semilleros_de_investigacion_desc: "В эксплуатацию государственных лабораторий для разработки всех видов технологий только разрушит исследовательскую программу. Подходящая вещь - распространять научные нагрузки в разных очагах, чтобы сделать работу более динамичной."
 COL_ferrocarriles_nacionales_de_colombia: "Ферокаррилы Националеса де Колумбия"
 COL_ferrocarriles_nacionales_de_colombia_desc: "Поезд по -прежнему является совершенно жизнеспособным средством транспорта, но он не получил того внимания, которого он заслуживает. Национальные железные дороги заброшены и недостаточно инвестированы, в дополнение к тому факту, что железнодорожные линии практически не существуют. Крайне важно укрепить этот сектор, прежде чем страна станет кучей изолированных регионов."
 COL_concesiones_estatales: "Государственные уступки"
 COL_concesiones_estatales_desc: "Передача части общественного потребностей частному сектору может показаться плохим поначалу для профсоюзов, но это возможная стратегия снижения неэффективности состояния и повышения экономического роста."
 COL_educacion_privada: "Частное образование"
 COL_educacion_privada_desc: "Перегрузка системы государственного образования не принесет долгосрочных выгод. Образование - это услуга, которая также может быть приватизирована и будет лучше предоставлена ​​этим сектором."
 COL_expansion_industrial: "Промышленное расширение"
 COL_expansion_industrial_desc: "Мы должны думать заранее, в Колумбии с большим внутренним промышленным потенциалом, поэтому мы не можем сосредоточить всю отрасль в крупных городских районах. Расширение продуктивных возможностей на периферию позволит децентрализовать производство и повышение экономических темпов роста."
 COL_una_colombia_moderna: "Современная Колумбия"
 COL_una_colombia_moderna_desc: "Эта новая Колумбия была восстановлена ​​и самодостаточной. Мы будем нации, которая не зависит от импорта для выживания и не останется позади в технологическом развитии. Мы отказались от устаревших экономических моделей, и мы готовы считать себя современной страной."
 COL_ingenieria_avanzada: "Advanced Engineering"
 COL_ingenieria_avanzada_desc: "Наши инженеры должны быть на уровне великих держав, поэтому они должны знать новые технологии, которые полезны для промышленности и общения в стране."
 COL_radiodifusora_nacional: "Radiodifusora Nacional"
 COL_radiodifusora_nacional_desc: "Радио является мощным инструментом не только с точки зрения военной разведки, но и в стабильности и достоверности правительства. Использование существующего Radiodifusora Nacional в качестве исследовательского центра для этой дисциплины улучшит наши знания об этом аспекте."
 COL_emplear_el_petroleo: "Используйте наше масло"
 COL_emplear_el_petroleo_desc: "Большие нефтяные месторождения страны не являются чем -то, что следует игнорировать. Мы разработаем основные центры добычи нефти для улучшения уточнения этого ресурса наряду с изучением других депозитов."
 COL_los_silos_del_norte: "Северные топливные бункеры"
 COL_los_silos_del_norte_desc: "Большое количество нефти, которую мы извлекаем, означает, что нам нужны места для хранения изысканной сырой нефти, поэтому мы будем строить большие бункеры на севере страны, где они легко доступны как для торговли, так и для внутреннего использования."
 COL_procesamiento_de_caucho: "Резиновая обработка"
 COL_procesamiento_de_caucho_desc: "Резина, полученная из нефти и натурального каучука, является незаменимым в промышленно развитом обществе. Мы можем воспользоваться экономическими преимуществами этой потребности, обрабатывая нашу собственную резину."
 COL_asegurar_los_recursos_minerales: "Обеспечение минеральных ресурсов"
 COL_asegurar_los_recursos_minerales_desc: "Если мы продолжим тратить ресурсы без разбора, в будущем у нас будет материал для военной промышленности. Нам нужно планировать потребление и изучать новые, более изысканные методы извлечения полезных ископаемых."
 COL_etb: "Etb"
 COL_etb_desc: "Телекоммуникационная компания Bogotá (ETB) была революционной ставкой, которая увидела свет в 1884 году. Их сотрудничество и их знания в области электроники будут полезны для государственных исследовательских проектов."
 COL_ampliar_el_sector_minero: "Расширить горнодобывающий сектор"
 COL_ampliar_el_sector_minero_desc: "Руководители должны быть расширены для предоставления внутреннего производства оружия и другого оборудования. Мы попросим геологов о том, чтобы найти новые месторождения полезных ископаемых."
 COL_excavaciones_profundas: "Глубокие раскопки"
 COL_excavaciones_profundas_desc: "Нам нужно за короткое время извлечь больше минеральных ресурсов, чтобы поддерживать работу национальной промышленности. Мы будем изучать новые методы бурения и экстракции, чтобы максимизировать эффективность прибыли этих элементов."
 COL_brigadas_especializadas: "Специализированные бригады"
 COL_brigadas_especializadas_desc: "Нам нужны элитные силы: десантники и горные войска должны быть нашим приоритетом."
 COL_aprovechar_la_geografia: "Воспользоваться географией"
 COL_aprovechar_la_geografia_desc: "Разнообразные и бурные биомы страны являются идеальным местом для изучения успеваемости военных в этих условиях и максимизировать ее эффективность."
 COL_expandir_las_minas_de_cromo: "Расширить хромовые шахты"
 COL_expandir_las_minas_de_cromo_desc: "Хромированные шахты на западе страны по -прежнему содержат большое количество ресурсов, но наша емкость раскопок ограничена. Нам срочно нужно увеличить извлечение этого материала."
 COL_extraccion_de_aluminio: "Извлечение алюминия"
 COL_extraccion_de_aluminio_desc: "Наши геологи определили алюминиевый месторождение в Вичаде. Мы перенесем экстракцию на сайт, чтобы воспользоваться этим природным ресурсом."
 COL_bastion_por_naturaleza: "Естественное укрепление"
 COL_bastion_por_naturaleza_desc: "Может случиться так, что в конце дня нам не нужны великие крепости или комплексы, чтобы защитить национальную территорию, поскольку география страны делает нас естественным бастионом, который полностью не поддается неосторожным."
 COL_el_yacimiento_de_cerro_tigre: "Депозит Cerro Tigre"
 COL_el_yacimiento_de_cerro_tigre_desc: "У нас есть сообщения о том, что в Гуейне есть определенное место, которое может содержать вольфрамовый подполье. Мы не должны больше ждать, чтобы использовать этот новый ресурс."
 COL_cerro_tigre_tt: "Создайте точку победы §Y10§!"
 COL_mejorar_los_puestos_de_mando: "Улучшить командные сообщения"
 COL_mejorar_los_puestos_de_mando_desc: "Условия, в которых наши офицеры и генералы должны командовать войсками платежными; Нет никаких рекомендаций по созданию хороших руководящих должностей. Мы должны установить новые положения в этом отношении и, таким образом, повысить эффективность в военном руководстве."
 COL_centro_de_desarrollo_militar: "Центр военного развития"
 COL_centro_de_desarrollo_militar_desc: "Не повредит посвятить часть государственных ресурсов военным расследованиям, это важный приоритет."
  
 COL_desintegrar_la_apen: "Распадаться апен"
 COL_desintegrar_la_apen_desc: "Национальные экономические патриотические действия (APEN), состоящие из промышленников и крупных землевладельцев, являются совершенно подрывным движением. Он не только намерен навязывать свои личные интересы на правительство, но и распространять крайне правое мышление. Это движение больше не должно существовать."
 COL_la_reforma_constitucional: "Конституционная реформа"
 COL_la_reforma_constitucional_desc: "Пришло время внести значительные изменения в Колумбии. Государство больше не может быть понято как «полиция», а скорее как организация на службе народа и это гарантирует права и выполнение обязанностей. Таким образом, мы должны отделить государство от церкви, по крайней мере частично, чтобы избежать его поляризации."
 COL_la_reforma_constitucional_tt: "Этот путь сохранит [GetLiberalName] в силе."
 COL_oponerse_al_cambio: "Противостоять изменениям"
 COL_oponerse_al_cambio_desc: "Чем на самом деле на самом деле либералы? Не более чем привести нацию к состоянию хаоса, без Бога или порядка, где закон самых сильных правлений. Это что -то неприемлемое. Мы никоим образом не примем это несчастье. Причина должна преобладать."
 COL_oponerse_al_cambio_tt: "Этот путь заставит [GetConservativeName] подняться к власти."
 COL_oponerse_al_cambio_2_tt: "§Y Консервативное влияние §! больше не будет вызывать гражданскую войну, если она достигнет §R100§!."
 COL_expulsar_a_los_politicos: "Изготовить политиков"
 COL_expulsar_a_los_politicos_desc: "Двухпартийность уже нанесла достаточно ущерба для страны. Мы не можем продолжать игнорировать, что это главная проблема Колумбии. Политики знают это, и это удобно для них, но военные понимают, что нет ничего более вредного. Пришло время организовать переворот против гражданской администрации, свергнуть либералов и отправить политиков в изгнание."
 COL_expulsar_a_los_politicos_tt: "Этот путь заставит [GetMilitaryName] подняться к власти."
 COL_expulsar_a_los_politicos_2_tt: "§Y0Ailaza Министерство республики_1 становится правящей партией."
 expulsar_tt: "\ n§Rexile политики могут иметь последствия в будущем конфликте ... §! \ n \ n"
 COL_bienestar_general: "Общее благополучие"
 COL_bienestar_general_desc: "Мы не можем внести формальность для неотъемлкого государства, не принимая во внимание правительственное обязательство гарантировать социальное и политическое благополучие всех граждан."
 COL_bienestar_general_tt: "Эти решения позволяют §Greduction/removal§! из §Ybipartisan conflicts§!. \ n"
 COL_la_republica_liberal: "Либеральная Республика"
 COL_la_republica_liberal_desc: "Пришло время продемонстрировать истинную оплот либерализма; Мы будем вести путь к более множественному и участию республики под конституционным краем без вмешательства церкви и идеологического фанатизма, защищая индивидуальные свободы и социальные потребности."
 COL_apoyar_la_unir: "Поддержите Unir"
 COL_apoyar_la_unir_desc: "Партия, которую Хорхе Элиеер Гайтан основал в 1933 году, Unir, несомненно, была одним из самых популярных движений среди населения. Возможно, если правительство поддерживает политику Гайтана, оно может вернуться к жизни и возобновить свое место в качестве народной партии."
 COL_mantener_el_proteccionismo: "Поддерживать протекционизм"
 COL_mantener_el_proteccionismo_desc: "Политика интервенционизма в экономике необходима, чтобы сохранить экономику стабильной и без излишеств. Мы возьмем инициативу по защите национальной производственной промышленности."
 COL_la_gran_pausa: "Великая пауза"
 COL_la_gran_pausa_desc: "Эдуардо Сантос предлагает поставить «паузу» в социальные реформы, прежде чем они станут слишком ошеломляющими для колумбийского народа. Это приводит к более слабому участию государства в экономике и стремлению к международному политическому нейтралитету."
 COL_nacionalizacion_del_credito: "Кредитная национализация"
 COL_nacionalizacion_del_credito_desc: "Экономический протекционизм является хорошим предложением, но этого недостаточно для защиты национальной промышленности. Система, которая привилегирует олигархи, должна быть полностью атакована, национализация кредитного сектора и ограничивающая денежную циркуляцию."
 COL_exportacion_de_petroleo: "Экспорт масла"
 COL_exportacion_de_petroleo_desc: "Потенциальные продажи наших нефтяных ресурсов нельзя пропустить. Экспорт его в больших масштабах значительно повысит нашу экономику."
 COL_integrar_el_banco_lopez: "Интегрировать банк Лопеса"
 COL_integrar_el_banco_lopez_desc: "Педро Аквилино Лопес, отец президента Лопеса Пумарехо, основал один из самых важных банков в стране, который несет его фамилию. Тем не менее, большой капитал, который он имеет, наряду с выдачей юридической валюты, не является позитивным для экономики, поскольку эта работа должна выполняться государством. Интеграция банка в правительство решит эту проблему."
 COL_el_proyecto_agrario: "Аграрный проект"
 COL_el_proyecto_agrario_desc: "Сельскохозяйственный сектор имеет жизненно важное значение для национальной экономики. Следовательно, целесообразно создать план политики и программ для его продвижения."
 COL_el_auge_del_cafe: "Рост кофе"
 COL_el_auge_del_cafe_desc: "Производство кофе значительно выросло за последние десятилетия. Очевидно, что кофе консолидируется как один из самых потребляемых продуктов на мировом рынке, поэтому мы не можем позволить себе перестать конкурировать с нашими культурами."
 COL_materias_primas_colombianas: "Колумбийское сырье"
 COL_materias_primas_colombianas_desc: "Сырье - один из основных продуктов, которые мы экспортируем. Мы заполним мировой рынок нашей продукцией, защищая нашу экономику, ограничивая импорт аналогичных продуктов."
 COL_proteger_a_los_pequenos_productores: "Защитите мелких производителей"
 COL_proteger_a_los_pequenos_productores_desc: "Розничные фермеры и крестьяне являются наиболее уязвимыми для неустанно продвижения промышленности и монополий. Мы объединим программу субсидий, а также стимулы для повышения их работы."
 COL_desarrollar_la_nacion: "Развивать нацию"
 COL_desarrollar_la_nacion_desc: "Нам нужно руководить отрасли и улучшить стандарты качества в отдаленных районах страны. Это привлечет больше людей в эти районы и повысит региональную рабочую силу."
 COL_centros_de_desarrollo_rural: "Центры развития сельских районов"
 COL_centros_de_desarrollo_rural_desc: "Мы не можем сосредоточить все научное развитие в крупных городах. Мы должны перенести определенные исследовательские центры в сельскую периферию, которые соответствуют их потребностям."
 COL_unificar_la_poblacion: "Объединить население"
 COL_unificar_la_poblacion_desc: "Двухпартийность оставила насильственное наследие в Колумбии. Очевидно, что люди не хотят больше политической борьбы, и они просят обратить внимание на другие виды проблем. Правительство должно преуменьшить идеологическое мышление, чтобы ответить за правильное управление для всего общества."
 COL_la_voluntad_del_pueblo: "Воля народа"
 COL_la_voluntad_del_pueblo_desc: "У штата есть основания быть только в том случае, если оно будет на службе колумбийского народа. Сейчас самое время игнорировать тех, кто называет себя «каудильо» и начать настоящий диалог с простыми гражданами."
 COL_el_legado_de_santander: "Наследие Сантандера"
 COL_el_legado_de_santander_desc: "Герой независимости Франсиско де Паула Сантандер был не только великим генералом, но и отличным государственным деятелем. Несмотря на то, что он был несправедливо злобным в истории, его руководство оставило большие уроки как в гражданской администрации, так и в военном порядке, достижения, из которых мы можем изучить и подать заявку сегодня."
 COL_el_ejercito_popular: "Народная армия"
 COL_el_ejercito_popular_desc: "Несправедливо, что армия является силой на службе политиков того дня, это должно быть учреждение, которое в равной степени защищает всех граждан. Нет лучшего способа достичь этого, чем расслаблять законы о призывах, в том числе простых людей, которые вдохновлены почетными службами."
 COL_tribuno_del_pueblo: "Трибуна народа"
 COL_tribuno_del_pueblo_desc: "Гайтан выиграл привязанность людей со своим безупречным ораторским искусством, собирая свои самые основные интересы, которые были проигнорированы другими политиками. Гайтан не только представляет собой дифференциацию от либерализма, но и целое политическое желание некушенного народа, стремящегося к славе и справедливости."
 COL_apoyar_a_la_republica: "Поддержите республику"
 COL_apoyar_a_la_republica_desc: "Наша последняя конституционная реформа была вдохновлена ​​политической хартией Испанской Республики. Теперь, в этот момент кризиса, через который они переживают, у нас есть моральный долг, чтобы помочь им. Мы не можем позволить их наследию погибнуть от рук этих фашистов!"
 COL_innovaciones_del_frente: "Инновации с фронта"
 COL_innovaciones_del_frente_desc: "Нет другого места, где есть больше достижений вооружений, чем в контексте самой битвы. Гражданская война в Испании, несомненно, не будет исключением."
 COL_refugio_de_intelectuales: "Интеллектуальное убежище"
 COL_refugio_de_intelectuales_desc: "Мы должны выполнить в сочетании с Испанской Республикой, программой для переезда испанских ученых и интеллектуалов, прежде чем они опадают под контроль фашистов. Наша нация станет идеальным убежищем, чтобы приветствовать эти преследования."
 COL_iniciar_las_reformas: "Инициировать реформы"
 COL_iniciar_las_reformas_desc: "Пришло время полностью реструктурировать государство. Эра социальной несправедливости и доминирования олигархии подошли к концу."
 COL_arremeter_contra_la_oligarquia: "Набрасываться на олигархию"
 COL_arremeter_contra_la_oligarquia_desc: "Эта горстка элит не сделала ничего, кроме как воспользоваться своей политической властью для своих интересов, сверх своих идеалов, за счет страданий колумбийского народа. Сегодня страна находится в напряженном бою с системой олигархии; сражается с битвой, сразится с битвой, победит либеральную олигархию и сокрушит консервативную олигархию."
 COL_pueblo_a_la_carga: "Люди, заряжай!"
 COL_pueblo_a_la_carga_desc: "Мы не собираемся позволять им управлять страной за спиной. Это наше достоинство, которое выше партий, и которое оставляет только эту борьбу против людей, которые манипулируют нами. Пусть они скажут это на улицах, пусть они скажут это на тротуарах, пусть они скажут это в столицах департаментов, пусть они скажут это с ловким голосом в Боготе: люди, за вашу победу, заряда!"
 COL_purgar_la_derecha: "Очистить правое"
 COL_purgar_la_derecha_desc: "Этого недостаточно только с этой человеческой лавиной против олигархической системы, но его нужно очистить из корней. Ретроградное и экстремистское право - это то, что с когтями и зубами цепляется за экономическую и политическую власть, но как только вырвавшись из Колумбии, оно никогда не будет расти снова."
 COL_las_ligas_campesinas: "Лигас Кампезинас"
 COL_las_ligas_campesinas_desc: "У крестьянства есть внутреннее желание бороться за справедливость. Они не только до земли, они укладывают свою жизнь на благосостояние Республики. Под руководством Гайтана так называемые Лигас Кампезины, несомненно, согласятся стать частью активной военной службы."
 COL_prepararse_para_el_conflicto: "Подготовьтесь к конфликту"
 COL_prepararse_para_el_conflicto_desc: "Примите, что крупномасштабный конфликт неизбежен. Вражеские силы не могут столкнуться и найти Колумбию без достаточного военного потенциала, мы должны больше инвестировать в военную индустрию."
 COL_cruzada_por_la_restauracion: "Крестовый поход для восстановления"
 COL_cruzada_por_la_restauracion_desc: "Эта популярная битва, ведущая народы, является не только лавиной против несправедливости, но и против морального ущерба от того, что олигархия вызвала нацию. Как кто -то может считать справедливым, что миллионы бедных, в то время как группа получает богатство? Это ретроградная концепция, срочно нуждающаяся в моральном восстановлении."
 COL_fundar_el_seguro_social: "Нашел социальное обеспечение"
 COL_fundar_el_seguro_social_desc: "Работа - это ничто, если человек, который осуществляет ее, не защищен от первой угрозы. Государство обязано обеспечить эту безопасность гражданам, включая продвижение отрасли в качестве фундаментального варианта."
 COL_centrarse_en_el_gasto_publico: "Сосредоточиться на государственных расходах"
 COL_centrarse_en_el_gasto_publico_desc: "Государство не собирает ресурсы, чтобы спасти их, а тем более, чтобы распространять их среди политиков. Он делает это, чтобы инвестировать в свое население, и это именно то, на чем мы должны сосредоточиться. Мы должны увеличить государственные расходы ради общего благосостояния."
 COL_regular_el_tributo: "Регулировать дань"
 COL_regular_el_tributo_desc: "Деньги, которые собираются и инвестируются государством, представляют собой большую сумму, и они должны регулироваться, чтобы избежать коррупции, избыточной ликвидности или других зло, которые возникают из -за плохого управления."
 COL_reestructurar_la_educacion: "Реструктуризация образования"
 COL_reestructurar_la_educacion_desc: "Нам нужно обновить систему образования, поскольку она продвигает классовые стандарты, которые приносят пользу олигархии, оставляя в стороне любой другой тип мировоззрения."
 COL_impuesto_al_patrimonio_eclesiastico: "Церковный налог на наследие"
 COL_impuesto_al_patrimonio_eclesiastico_desc: "Церковь можно рассматривать как преимущество, так и угрозу, в зависимости от того, какую перспективу вы на это смотрите. Тем не менее, это факт, что он владеет большими состояниями, которые освобождаются от налогов. Мы изменим законодательство, чтобы поддержать налоговое капитал."
 COL_colectivizar_la_industria: "Коллектизировать отрасль"
 COL_colectivizar_la_industria_desc: "Эра монополий подошла к концу. Пришло время распространять отрасль среди тех, кто действительно оказывает свою жизнь своей поддержке: рабочими и потребителям."
 COL_brindar_asilo_a_los_exiliados: "Предоставить убежище изгнанникам"
 COL_brindar_asilo_a_los_exiliados_desc: "Жаль, что наша доктрина настолько отвергается в других регионах мира. Мы откроем наши границы любому идеологическому партнеру, которому нужна помощь."
 COL_un_rumbo_propio: "Наш собственный путь"
 COL_un_rumbo_propio_desc: "Мы не собираемся быть просто еще одной марионеткой главных держав! Наша судьба в наших руках; Это наша борьба, наше будущее, а не их."
 COL_unirse_a_la_comintern: "Присоединяйтесь к Коминтерну"
 COL_unirse_a_la_comintern_desc: "Несмотря на то, что мы не полностью сочувствуем русским, они, несомненно, будут важным союзником. Мы попросим поделиться с ними позицией в Коммунистической международной. Кто знает, может быть, мы сможем вдохновить русских менее радикальным взглядом на вещи."
 COL_comprar_armamento_sovietico: "Купить советское вооружение"
 COL_comprar_armamento_sovietico_desc: "Советский Союз - промышленный гигант. Не повредит приобрести большое количество оружия, которое мы не сможем производить самостоятельно."
 COL_propagar_el_ideal: "Распространить идеал"
 COL_propagar_el_ideal_desc: "Стоясь бездействующей несправедливостью, которая совершается в мире, является непростительным преступлением. Мы должны вдохновлять социальные движения против тирании за границей, пока народы не поднимутся в триумфе против своих угнетателей."
 COL_invitar_asesores_simpatizantes: "Пригласить идеологических консультантов"
 COL_invitar_asesores_simpatizantes_desc: "Мы не единственный бастион социал -демократии в Америке. Есть много похожих движений в других странах, и все они разработали свою уникальную перспективу. Знание этих точек зрения поможет нам иметь более полное состояние."
 COL_liberar_a_nuestros_hermanos: "Освободить наших братьев"
 COL_liberar_a_nuestros_hermanos_desc: "Мы должны признать, что Эквадор и Венесуэла потеряны, погрязли в хаосе и институциональном расстройстве. Это преступление - закрывать глаза на эти несправедливости; Мы должны положить конец этому угнетению, даже силой."
 COL_programa_de_apoyo_industrial: "Программа промышленной поддержки"
 COL_programa_de_apoyo_industrial_desc: "При поддержке Советов мы разработаем большой план совместной индустриализации, который сближает нашу экономику и полезно для нас обоих."
 COL_esfuerzo_belico_conjunto: "Совместные войны"
 COL_esfuerzo_belico_conjunto_desc: "Война - это ад, что никто не должен пройти. Именно поэтому мы должны предвидеть угрозы и быть готовыми к любой атаке с твердой отраслью."
 COL_bloque_socialdemocrata: "Социал -демократический блок"
 COL_bloque_socialdemocrata_desc: "Будущее Латинской Америки прямо здесь, на континенте, а не в амбициях иностранных держав. Мы возглавим свою собственную фракцию против угрозы фашизма, которая нарисована над нами."
 COL_bloque_socialdemocrata_faction: "Социо-демократический блок"
 COL_bloque_socialdemocrata_pru_tt: "Если Перу завершила фокус §YSocial Democracy Peru§! и §Ywork с социал -демократиями §!, она будет приглашена на фракцию."
 COL_nuestro_aliado_en_la_region: "Наш союзник в регионе"
 COL_nuestro_aliado_en_la_region_desc: "Парагвайский и колумбийский народ разделял духовное братство после войны за тройной альянс. В конечном счете, наши заповеди и идеалы неразрывно связаны, поэтому нет более высокой причины для создания процветающей коалиции."
 COL_vista_al_sur: "Смотреть на юг"
 COL_vista_al_sur_desc: "Вскоре мы освободим южные народы от презренной олигархии, которая управляет ими. Они больше не будут жить под игом высших классов, но будут знать только язык справедливости."
 COL_desarrollo_del_progreso: "Развитие прогресса"
 COL_desarrollo_del_progreso_desc: "Нам было бы эгоистично зарезервировать все технологические достижения для себя. Мы должны поделиться нашими открытиями с нашими союзниками, чтобы максимизировать преимущества науки."
 COL_vista_al_norte: "Смотреть на север"
 COL_vista_al_norte_desc: "Ничего более абернтного, чем ультра-капиталистический корпоратизм стран к северу от континента. Мы простираем их, как человеческая лавина, пока не останется следов американской организованной плутократии."
 COL_asediar_al_peru: "Осада Перу"
 COL_asediar_al_peru_desc: "Не требуется эксперта, чтобы понять, что Перу - нестабильная и ухудшающаяся нация. Они слепы, они не могут понять, что они приводят свою нацию к самоуничтожению с политической идеей."
 COL_guerra_a_los_bolivianos: "Война с боливинами"
 COL_guerra_a_los_bolivianos_desc: "Боливийская республика выглядела так многообещающе с его переходом к социальному статусу, но они позволили себе омрачить высокомерием и фаворитизмом. У нас нет выбора, кроме как раздавить гнилую структуру боливийского государства."
 COL_tomar_centroamerica: "Возьмите Центральную Америку"
 COL_tomar_centroamerica_desc: "Центральноамериканские республики стали бастионом, который защищает плутократию и частные компании за счет страданий своего народа. У нас есть моральная обязанность распадать эти отсталые институты."
 COL_ocupar_mexico: "Занимайте Мексику"
 COL_ocupar_mexico_desc: "Наследие мексиканской революции было не чем иным, как беспорядочной борьбой между радикалами слева и радикалами справа. Если мы не остановим это накопление обиды, весь американский континент будет дестабилизирован их глупостью."
 COL_ultimatum_al_cono_sur: "Ультиматум в южный конус"
 COL_ultimatum_al_cono_sur_desc: "Как бы это ни звучало, война - единственный способ решить этот «южный вопрос». Нет другого выбора, кроме как подготовиться к борьбе с деспотизмом аргентинцев, плутократии чилийцев и олигархии уругвайцев."
 COL_derrotar_el_imperialismo: "Победить империализм"
 COL_derrotar_el_imperialismo_desc: "Невозможно найти новое латиноамериканское общество под империалистической тенью Соединенных Штатов. У нас было достаточно их вмешательства, мы не позволим им продолжать заниматься своими делами без последствий."
 COL_tierra_de_colon: "Земля Колумбуса"
 COL_tierra_de_colon_desc: "Предшественник независимости Франсиско де Миранда однажды представлял великую нацию, которая охватывала всю территорию от реки Миссисипи до Тьерра -дель -Фуэго на юге, поэтому он решил назвать это Колумбией, что означает «Земля Колумбуса». Теперь, когда мы преуспели в нашем крестовом походе, мы можем материализировать проект Миранды."
 COL_tierra_de_colon_focus_tt: "Эти решения позволяют преобразовать все оккупированные народы латиноамериканской Америки в §Gcore States§!, а также территории, которые принадлежали им в прошлом."
 COL_el_renacer_institucional: "Институциональный ренессанс"
 COL_el_renacer_institucional_desc: "Изменение вещества должно быть сделано во всех государственных организациях. Новое правительство будет возрождено чистым, оно будет похоже на новое, на службе колумбийского народа."
 COL_educacion_publica: "Государственное образование"
 COL_educacion_publica_desc: "Образование должно быть государственной службой, управляемой исключительно государством. Если мы допустим, чтобы эта работа была выполнена в частном порядке, наши молодые люди в конечном итоге внушают в соответствии с политическими идеалами учителя. Образование должно быть светским и без политических тенденций."
 COL_acabar_la_hegemonia_conservadora: "Положить конец консервативной гегемонии"
 COL_acabar_la_hegemonia_conservadora_desc: "Консервативный экстремизм зашел слишком далеко. Очевидно, что они не хотят избавляться от власти, и они также не будут терпимы к нам, если мы позволим им продолжать выполнять свою работу. Мы создадим сильную правовую систему, которая приведет к окончательному прекращению консервативной гегемонии в стране."
 COL_escuela_normal_superior: "Превосходные нормальные школы"
 COL_escuela_normal_superior_desc: "Настоящий учитель - тот, кто никогда не перестает учиться. Это несколько идеалистический максимум, но чрезвычайно показатель. Мы создадим систему, которая позволяет преподавателям привить им ценность защиты и интеллектуальной эффективности."
 COL_ministerio_de_obras_publicas: "Министерство общественных работ"
 COL_ministerio_de_obras_publicas_desc: "Колумбия является изолированной нацией, между ее регионами почти нет никаких соединений, и как железнодорожные, так и воздушные системы полностью дефицит. Мы создадим специальное министерство для решения этих проблем инфраструктуры."
 COL_reestructurar_la_cupula_militar: "Реструктуризация военного высшего командования"
 COL_reestructurar_la_cupula_militar_desc: "Кто военные думают, что они должны не подчиняться приказам гражданской власти? Если они настолько сильно настаивают на поддержании своего восстания, мы будем выполнять внутреннюю реструктуризацию высшего командования учреждения в качестве наказания за их неподчинение."
 COL_laboratorios_jgb: "JGB Laboratories"
 COL_laboratorios_jgb_desc: "JGB является крупной фармацевтической компанией, основанной более 50 лет назад. Их лаборатории являются современными и высокоэффективными, поэтому сотрудничество между ними и государством означало бы большой прогресс для колумбийской науки."
 COL_proteger_al_pueblo_colombiano: "Защитить колумбийский народ"
 COL_proteger_al_pueblo_colombiano_desc: "Одним из величайших обязательств, которые имеет государство, состоит в том, чтобы защитить своего народа, а не быть угрозой для них. Правительство больше никогда не будет рассматриваться как оскорбительное лицо, но как опекун населения, их щит против угроз от рубежа."
 COL_inclusion_fenemina: "Женское включение"
 COL_inclusion_fenemina_desc: "Мы должны отложить в сторону ретроградное консервативное видение женщин, которое было наложено в Колумбии с момента ратифицированной конституции 1886 года. Женщины обладают такими же возможностями, как и у всех, закон должен признать это."
 COL_abandonar_el_patron_oro: "Отказаться от золотого стандарта"
 COL_abandonar_el_patron_oro_desc: "Золотой стандарт держит нас привязанными к этому архаичному видению денег, очевидно, что он приносит больше вреда, чем пользу для государственных финансов, поэтому у нас нет выбора, кроме как избавиться от этого исторического и финансового порока."
 COL_invertir_en_el_banco_de_la_republica: "Инвестировать в Банк Республики"
 COL_invertir_en_el_banco_de_la_republica_desc: "Центральное банковское дело имеет решающее значение для экономики страны. Сосредоточение внимания на укреплении его поможет увеличить государственную казну, что будет очень полезно в будущем, когда нам придется реинвестировать эти ресурсы."
 COL_ley_de_nacionalizacion_aerea: "Закон о национализации воздуха"
 COL_ley_de_nacionalizacion_aerea_desc: "Мир авиации перемещает большие суммы денег как внутри, так и за пределами страны, но он ужасно дезорганизован в низкокоммерческих компаниях. Мы национализируем этот конгломерат, чтобы сделать его единственной громкой компанией."
 remove_designer: "Удалить как §Ydesign company§!: \ n"
 COL_preparar_el_camino: "Подготовьте путь"
 COL_preparar_el_camino_desc: "Колумбия должна быть главой Демократической партии в переходе к более справедливому обществу в Латинской Америке, хотя осознавая, что угроза тоталитаризма всегда присутствует."
 COL_instituto_de_credito_territorial: "Институт территориальной территории"
 COL_instituto_de_credito_territorial_desc: "Нам срочно нужна организация, которая обеспечивает решение бездомности наименее предпочтительных колумбийцев посредством строительства и финансирования непосредственно государством. Он будет называться территориальным кредитным институтом (Inscredial)."
 COL_el_buen_vecino: "Хороший сосед"
 COL_el_buen_vecino_desc: "Соединенные Штаты всегда были своего рода защитником нашей страны. В конце концов, наша история всегда была связана, поэтому она всегда была похожа на нашего «хорошего соседа». Теперь, с угрозой фашизма и коммунизма на континенте, нам некому обратиться, кроме них."
 COL_priorizar_europa: "Расставить приоритеты в Европе"
 COL_priorizar_europa_desc: "Будущее мира находится не в Америке, так же, как это больно, а в Европе. Тот, кто станет победителем этой великой войны, будет тем, кто определит конфигурацию мира. Мы не можем позволить демократии потерпеть поражение в Европе, иначе она также будет побеждена во всем мире."
 COL_diplomacia_americana: "Американская дипломатия"
 COL_diplomacia_americana_desc: "Было бы не очень разумно доверять наше будущее великим западным державам, так как они сделают нас пешкой в ​​отличной игре политического влияния. Идеально состоит в том, чтобы установить стабильный континентальный альянс, который будет противостоять глобальным бедствиям. В одиночку мы слабы, но вместе мы будем непобедимы."
 COL_limitar_la_participacion: "Ограничение участия"
 COL_limitar_la_participacion_desc: "Колумбия уже достаточно внутренней политической борьбы, чтобы участвовать в полномасштабной войне. Люди жаждут мира, а не для вечного конфликта."
 COL_concesiones_de_petroleo: "Нефтяные уступки"
 COL_concesiones_de_petroleo_desc: "Очевидно, что у нас есть нефть, которая будет иметь дальнейшую помощь великим демократическим странам в их крестовом походе против фашистского тоталитаризма и коммунистического популизма."
 COL_seguir_a_los_britanicos: "Следуйте за англичанами"
 COL_seguir_a_los_britanicos_desc: "свободный мир"
 COL_el_ideal_regional: "Региональный идеал"
 COL_el_ideal_regional_desc: "Нет сомнений в том, что, несмотря на внутренние разногласия, Колумбия - это модель участия, которая должна быть воспроизведена во всех других странах полушария под нашим руководством."
 COL_esfera_de_defensa: "Оборонительная сфера"
 COL_esfera_de_defensa_desc: "Если мы ждем, пока другие придут и помогут нам в случае атаки, мы обречены проиграть войну. Мы будем структурировать целую оборонительную сферу, которая сделает нас неприступной стеной."
 COL_retribucion: "Возмездие"
 COL_retribucion_desc: "Как бы мы ни давали нефть другим странам для благотворительности в их борьбе, мы все равно имеем право требовать справедливого возмездия; платежеспособность, которая была бы полезна для нынешней ситуации в мире."
 COL_retribucion_tt: "Добавьте две нефтемеры §Y -милитарные фабрики §! для каждого штата, которое имеет концессию нефти."
 COL_tratado_de_asistencia_colombo_americano: "Коломбо-американский договор о помощи"
 COL_tratado_de_asistencia_colombo_americano_desc: "Наши хорошие отношения с Соединенными Штатами представляют собой фундаментальное преимущество для нас, и, возможно, мы можем укрепить их дальше. Мы надеемся, что сможем подписать договор, который гарантирует помощь США в случае иностранной атаки."
 COL_bastion_ante_el_caos: "Бастион перед хаосом"
 COL_bastion_ante_el_caos_desc: "Мы - те, кто отстаивал свободу и справедливость как принципы демократического общества с неизбежным риском, но мы не можем показать себя слабым перед врагом. Наш баннер будет представлять собой борьбу с тиранией, угнетением и мировым хаосом."
 COL_fundar_la_oea: "Основан ОАГ"
 COL_fundar_la_oea_desc: "План создания эксклюзивной фракции для членов нашего континента звучит многообещающе. Эта организация американских штатов поможет удержать наших латиноамериканских братьев вместе и будет встряхнуть любого, кто осмеливается бросить нам вызов."
 oea_faction_name: "Организация американских государств"
 COL_defender_la_patria: "Защищать отечество"
 COL_defender_la_patria_desc: "Альфонсо Лопес Пумарехо однажды заявил: «Национализм, которым я увлечен, может быть синтезирован в этой фразе: Колумбия сначала для колумбийцев». Не зная об этом, он установил прецедент для усилий штата по защите Отец. Как бы у нас были союзники, мы должны сначала быть в состоянии защитить себя, прежде чем помочь им."
 COL_capacitacion_estadounidense: "Американское обучение"
 COL_capacitacion_estadounidense_desc: "Американские вооруженные силы имеют великий международный стандарт. Мы попросим правительство США специальное атташе обучать наших директоров на подготовку войск."
 COL_democracia_triunfante: "Триумфальная демократия"
 COL_democracia_triunfante_desc: "Мы почти обязаны вмешиваться в другие страны, когда это необходимо, когда им не хватает стабильности, которую демократия представляет собой триумфальное руководство по здоровым идеалам."
 COL_integracion_de_la_industria_regional: "Региональная отраслевая интеграция"
 COL_integracion_de_la_industria_regional_desc: "Индустрия наших союзников разделена и отключена друг от друга, что затрудняет эффективное военное производство. Мы создадим новые руководящие принципы, чтобы максимизировать эффективность военных заводов союзников."
 COL_integracion_de_la_industria_regional_tt: "Добавьте одну нефтумарию §Y -милитарного фабрики §! для каждой демократической южноамериканской нации, которая находится в одной и той же фракции."
 COL_la_avanzada_anticomunista: "Антикоммунистический форпост"
 COL_la_avanzada_anticomunista_desc: "Монстр коммунизма распространяет свои щупальца в нашем полушарии. Это немыслимо. Мы атакуем тех, кто поддался его челюстям, и мы освободим его людей, чтобы восстановить демократию."
 COL_la_avanzada_anticomunista_tt: "Получите §Ytopple правительство §! Цель войны против каждой южноамериканской нации §Ymunist§!."
 COL_ejercito_de_america: "Армия Америки"
 COL_ejercito_de_america_desc: "Объединенные вооруженные силы среди союзников намного лучше, чем рассеянные; Это неопровержимый факт, когда доказано в бою. У нас будет совместная армия, которая защищает нас всех одинаково."
 COL_estado_social_de_derecho: "Верховенство закона"
 COL_estado_social_de_derecho_desc: "Мы создадим новую концепцию государства: той, в которой правительство полностью подчиняется юридическим принципам, всегда определяя общий интерес к человеку, сохраняя при этом уважение и пределы вмешательства от власти."
 COL_investigacion_compartida: "Общее исследование"
 COL_investigacion_compartida_desc: "Научные достижения, как наши, так и наши союзники, подтверждают наше технологическое превосходство над врагом, но мы не можем позволить себе роскошь соответствовать текущим достижениям, поскольку это будут устаревшие модели завтрашнего дня."
 COL_trabajar_con_los_monopolios: "Работать с монополиями"
 COL_trabajar_con_los_monopolios_desc: "Хотя не совсем хорошо, что в стране есть монополия, последствия их устранения будут катастрофическими. Напротив, мы должны установить союз с этими великими магнатами, чтобы принести пользу государству от этого экономического явления."
  
 COL_conservar_el_directorio_liberal: "Сохранить либеральный каталог"
 COL_conservar_el_directorio_liberal_desc: "Лидеры либерализма были большими интеллектуалами с момента основания партии. Эта традиция не может быть потеряна, мы не можем отказаться от командования популистам только ради их харизмы."
 COL_subsumir_la_disidencia: "Подборочная дифференциация"
 COL_subsumir_la_disidencia_desc: "Разнообразие Гайтаниста чрезвычайно сильна по сравнению с обычным либеральным движением. Мы покажем Гайтану, что, в конце концов, наши интересы не так разные, поэтому ему удобнее присоединиться к партии."
 COL_ley_de_integracion_en_el_congreso: "Закон об интеграции в Конгрессе"
 COL_ley_de_integracion_en_el_congreso_desc: "Недостаточно сказать, что мы собираемся интегрировать различные голоса и движения, если у нас нет юридической поддержки, чтобы сохранить наше слово. Мы выпустим закон, который гарантирует комплексное политическое участие в Конгрессе."
 COL_el_fuerte_antifascista: "Антифашистская крепость"
 COL_el_fuerte_antifascista_desc: "Чем больше времени проходит, тем более популярными и сильными фашистскими движениями становятся. Мы не можем дождаться, когда они будут у ворот континента, чтобы действовать."
 COL_el_fuerte_antifascista_tt: "Получите §Ytopple правительство §! Цель войны против каждой южноамериканской нации §YFASCIST§!."
 COL_derogar_la_constitucion: "Отменять конституцию 1886 года"
 COL_derogar_la_constitucion_desc: "Конституция 1886 года была продуктом консервативной гегемонии своего времени и претерпела бесконечность реформ, которые демонстрируют, насколько невозможно текст. Колумбия должна отложить это архаичное руководство, чтобы сосредоточиться на функциональном законодательстве в будущем."
 COL_la_patria_por_encima_de_los_partidos: "Отечественная страна над сторонами"
 COL_la_patria_por_encima_de_los_partidos_desc: "Великий генерал тысячидневной войны, Бенджамин Эррера, однажды заявил, что он борется за свою родину, а не за Либеральную партию. Без сомнения, он был образцом для подражания, но мы забываем его сегодня. Мы будем соблюдать его учения о мужестве и патриотизме."
 COL_centralizar_la_banca: "Централизовать банковское дело"
 COL_centralizar_la_banca_desc: "Банковский сектор несбалансирован, потому что он разделен на высшие классы страны. Банковская монополия пройдет в руки государства."
 COL_el_quinquenio_vasquez: "Васкес Квинкенум"
 COL_el_quinquenio_vasquez_desc: "Промышленные возможности нашей страны плачевны. К счастью, генерал Васкес Кобо подготовил план, который значительно увеличит нашу экономику."
 COL_alianza_con_el_movimiento_obrero: "Альянс с рабочим движением"
 COL_alianza_con_el_movimiento_obrero_desc: "Понятно, что военное движение неспособно конкурировать с профсоюзом во главе с Гайтаном. Мы формализуем союз с рабочими, чтобы включить их в министерский кабинет."
 COL_alianza_con_el_movimiento_obrero_tt: "Замените §Yjorge eliécer gaitán§! с §Y, обязательство рабочих §! \ громкое изменение: \ npolitical Sain: §g+15%§! \ n§Yliberal subversies"
 COL_arrestar_a_gaitan: "Арестовать Гайтан"
 COL_arrestar_a_gaitan_desc: "Хорхе Элиеер Гайтан не плохой человек, но он огромный подрывной направлен. Очевидно, он не собирается останавливать свои действия, если мы попросим его, поэтому мы должны арестовать его, даже если это повредит населению."
 COL_arrestar_a_gaitan_pp_tt: "Третий текущего §Yliberal влияние §! применяется как §GPolitical Power§! Бонус:"
 COL_arrestar_a_gaitan_stability_tt: "Половина текущего §Yliberal влияние §! применяется как штраф §rstability§!:"
 COL_obtener_financiacion_de_la_iglesia: "Получить церковное финансирование"
 COL_obtener_financiacion_de_la_iglesia_desc: "Близость духовенства к консервативной партии была тем, что сделало его правительство настолько успешным в то время. Мы не можем недооценивать преимущество для нас, чтобы получить канцелярскую поддержку, даже посредством пожертвований государству."
 COL_rumbo_a_la_autarquia: "На пути к авто"
 COL_rumbo_a_la_autarquia_desc: "Мы должны быть самодостаточными, если хотим, чтобы Колумбия была великолепной. Мы должны лучше использовать наши ресурсы и быть более эффективными в строительстве."
 COL_nacionalizar_las_armerias: "Национализируйте Орусполь"
 COL_nacionalizar_las_armerias_desc: "Несколько немногих охраны в стране почти полностью принадлежат в частном порядке. Его имущество должно пройти в руки штата, если мы хотим предоставить спрос на военную технику."
 COL_reforma_al_ministerio_de_hacienda: "Реформа Министерства финансов"
 COL_reforma_al_ministerio_de_hacienda_desc: "То, как мы собираем налоги, - это отставание от новых торговых механизмов мира. Мы будем реформировать Министерство финансов, чтобы сделать его работу более эффективной и лучше распределять ресурсы."
 COL_purificar_el_ejercito: "Очистить армию"
 COL_purificar_el_ejercito_desc: "Политика похожа на инфекцию, которая делает армию больным. Если мы хотим догнать великие полномочия, наша армия должна быть «очищена» немедленно."
 COL_llevar_la_industria_al_extranjero: "Возьмите отрасль за границей"
 COL_llevar_la_industria_al_extranjero_desc: "Поскольку в стране процветают крупные промышленные комплексы, благодаря мотивации этих гигантов инвестировать и консолидироваться в других странах, что приносит нам прибыль."
 COL_estatismo: "Статизм"
 COL_estatismo_desc: "Несомненно, государство является единственным, которое может организовать экономическое расстройство, которое в настоящее время существует. Мы расширим присутствие правительства в нескольких аспектах, пока не будем абсолютно контролировать все."
 COL_incentivar_la_industria: "Поощрять индустрию вооружений"
 COL_incentivar_la_industria_desc: "Индустрия должна сосредоточиться на производстве войны с несколькими денежными стимулами; Оружие сегодняшнего дня символизирует мир завтрашнего дня."
 COL_fortalecer_el_ministerio_de_guerra: "Усилить военное служение"
 COL_fortalecer_el_ministerio_de_guerra_desc: "Министерство - это организация, которая должна отвечать за войны, в которых участвует наша страна. Мы позаботимся о том, чтобы у вас была последняя информация и лучшее финансирование."
 COL_el_gabinete_militar: "Военный кабинет"
 COL_el_gabinete_militar_desc: "Мы не можем верить, что один человек возглавит нашу нацию, как только Васкес Кобо не с нами, это должно быть университетским советом, чтобы не допустить личных интересов."
 COL_fundar_la_guardia_civil: "Основание гражданской гвардии"
 COL_fundar_la_guardia_civil_desc: "Колумбия является одной из немногих стран в мире, которая на данный момент не имеет гражданской гвардии для поддержки общественной силы. Но это вот -вот изменится."
 COL_complejo_industrial_de_los_llanos: "LOS LLANOS Промышленный комплекс"
 COL_complejo_industrial_de_los_llanos_desc: "Восточные равнины, известные как «Los Llanos», являются отдаленным местом, но идеально подходят для создания промышленности, которая не адаптирована к другим биомам нации."
 COL_centro_de_estudios_avanzados: "Центр передовых исследований"
 COL_centro_de_estudios_avanzados_desc: "Мы нашли новое учреждение, которое разработает наиболее важные научные достижения на континенте."
 COL_infraestructura_para_las_tropas: "Инфраструктура для войск"
 COL_infraestructura_para_las_tropas_desc: "Прежде чем строить великую армию, у нас должны быть первые дорожные и железнодорожные сети для перевозки наших войск."
 COL_la_legion_ricaurte: "Легион Рикаурта"
 COL_la_legion_ricaurte_desc: "Великий герой независимости, генерал Антонио Рикаурте, был забыт в истории колумбийцами, но сегодня его наследие порядка и дисциплины сохраняется, и мы должны почтить его элитным военным легионом, названным в его памяти."
 COL_honrar_la_vieja_guardia: "Почитайте старую гвардию"
 COL_honrar_la_vieja_guardia_desc: "Великие военные умы прошлых лет, такие как генерал Рафаэль Рейес, Антонио Нариньо, Рафаэль Урибе Урибе и Сам Симон Боливар, являются отличными примерами, за которыми следует следить не только национальной армии, но и всеми гражданами страны. Мы отдадим им дань, и мы позаботимся о напоминании колумбийцам об их наследии."
 COL_incrementar_el_salario_obrero: "Увеличить зарплату работников"
 COL_incrementar_el_salario_obrero_desc: "Рабочие в Колумбии зарабатывают гораздо меньше, чем в других странах латиноамериканцев. Мы будем использовать закон, чтобы установить минимальную зарплату гораздо более справедливой и справедливой."
 COL_abandonar_el_conformismo: "Отказываться от соответствия"
 COL_abandonar_el_conformismo_desc: "У нас было достаточно этого нейтралитета и пацифистской риторики. Мы нация воинов, бойцов и солдат. Мы достаточно определены, чтобы взять на себя ответственность за нашу собственную судьбу, даже если она силой."
 COL_estado_mayor_conjunto: "Совместный генеральный персонал"
 COL_estado_mayor_conjunto_desc: "Мы организуем все вооруженные силы под командованием единого совместного генерального штаба, который, помимо руководства нашей армией, будет иметь правительственные полномочия после смерти Васкеса Кобо."
 COL_sociedad_marcial: "Боевое общество"
 COL_sociedad_marcial_desc: "Мы говорили это несколько раз, и мы скажем снова, мы не страна пацифистов, а солдат. Мы обучаем наших молодых людей, чтобы они получили это очень ясно."
 COL_asesores_alemanes: "Немецкие консультанты"
 COL_asesores_alemanes_desc: "Немцы показали свой тактический гений в войне. Их генералов будет более чем достаточно, чтобы начать профессионализировать нашу армию и поместить ее в центр внимания."
 COL_avivar_la_doctrina_prusiana: "Оживить прусскую доктрину"
 COL_avivar_la_doctrina_prusiana_desc: "Наша военная дисциплина неразрывно основана на стратегиях пруссацев, но мы пренебрегаем этим в последние десятилетия. Мы не можем позволить таким ценному учениям, чтобы быть потерянными из -за явного бессознательного сознания."
 COL_influenciar_en_panama: "Влияние в Панаме"
 COL_influenciar_en_panama_desc: "Мы не можем атаковать Панаму силой, но мы можем перемещать политические влияния, чтобы вызвать симпатизатор движения с нашим делом в перешейке."
 COL_enardecer_el_militarismo: "Поощрять милитаризм"
 COL_enardecer_el_militarismo_desc: "Те, кто видит армию как необходимое зло, осуждаются, чтобы колебаться перед лицом войны. Мы прививаем милитаризм в нашей культуре стать нацией солдат."
 COL_pasantias_de_desarrollo_militar: "Стажировки военного развития"
 COL_pasantias_de_desarrollo_militar_desc: "Технологические достижения быстрые в области оружия. Мы отправим специальный контингент для самых развитых стран в этом аспекте для проектирования большего и лучшего оборудования за меньшее время."
 COL_el_incidente_de_japura: "Инцидент в Японии"
 COL_el_incidente_de_japura_desc: "Япура был частью нашей территории сразу после обретения независимости, но мы потеряли ее из -за бразильских экспансионистских амбиций. Мы подготовим инцидент, чтобы восстановить контроль над этим государством."
 COL_ocupar_el_itsmo: "Занимайте перешейк"
 COL_ocupar_el_itsmo_desc: "С панамским большинством на нашей стороне мы готовы запустить быструю посадку и занять весь перешай. Скоро это снова будет нашим!"
 COL_asegurar_el_sur: "Закрепление юга"
 COL_asegurar_el_sur_desc: "Наша территория на юге - одна из тех, у кого самый потенциал, и все же мы потеряли ее из -за отсутствия решимости политиков прошлых лет. Мы не будем прославлять нашу отечество, если позволим другим странам сохранить то, что принадлежит нам."
 COL_contactar_a_benavides: "Свяжитесь с Бенавидесом"
 COL_contactar_a_benavides_desc: "Очевидно, что генерал Бенавидс вообще не удовлетворен новым правительством, установленным в Перу. Перуанские люди попали в руки элитарной буржуазии, и они должны быть спасены вскоре, прежде чем они уничтожат себя. Мы свяжемся с Бенавидсом и предложим предложение, которое он не может отказаться ..."
 COL_contactar_a_benavides_tt: "§Yóscar benavides§! находится на действительной службе для [PRU.GetName]"
 COL_benavides_contacted: "Заговор против правительства?"
 COL_seguir_a_venezuela: "Следуйте за Венесуэлой"
 COL_seguir_a_venezuela_desc: "Венесуэльский милитаризм - это модель, которой следует следовать. Отношения между нашими двумя странами будут намного ближе, если мы вступим в официальный альянс, от военных до военных."
 COL_military_faction: "Андский военный фронт"
 COL_industrializar_japura: "Индустриализировать Japurá"
 COL_industrializar_japura_desc: "У Япара есть большой потенциал для создания там наших промышленных комплексов, места, далеко от какой -либо угрозы."
 COL_recordar_la_guerra_colombo_peruana: "Помните колумбийскуюпеанскую войну"
 COL_recordar_la_guerra_colombo_peruana_desc: "Экспансионистские амбиции Перу - это то, что привлекло нас к войне против них в 1932 году, но новое перуанское правительство, похоже, склоняется к возобновлению конфликта. Мы должны атаковать первым и удивленным."
 COL_fortalecer_los_vinculos_con_peru: "Укрепить связи с Перу"
 COL_fortalecer_los_vinculos_con_peru_desc: "Хотя Перу не находится под такой милитаристической моделью, как наша, она уже прошла через одну, и это было полезно для них. Мы должны отложить наши различия в сторону и улучшить дипломатические отношения."
 COL_reestablecer_el_orden_en_peru: "Восстановить порядок в Перу"
 COL_reestablecer_el_orden_en_peru_desc: "Пик наступил момент. Пришло время победить политиков Перу, как мы здесь. Мы подготовим наших генералов и Бенавидов к неожиданной атаке, мы не остановимся, пока не установим новое и сочувствующее состояние."
 COL_reestablecer_el_orden_en_peru_tt: "§Yóscar Benavides§! присоединится к Колумбии в войне против нынешнего перуанского правительства."
 COL_dinamizar_la_economia_belica: "Динамизировать военную экономику"
 COL_dinamizar_la_economia_belica_desc: "Продолжение расширения наших заводов позволит нам ускорить производство товаров для торговли и увеличить усилия по строительству."
 COL_continuar_el_avance: "Продолжить аванс"
 COL_continuar_el_avance_desc: "Япура был лишь первым шагом, чтобы вернуть Амазонские территории, которые принадлежат нам. Теперь мы должны посмотреть немного дальше на юг, к Мапари."
 COL_nuestro_por_derecho: "Это наше правое"
 COL_nuestro_por_derecho_desc: "Американское правительство - не что иное, как посредник. Они поддержали разделение Панамы в 1903 году, чтобы просто построить и сохранить канал. Если мы возьмем Панаму, мы также должны взять канал. Это принадлежит нам по праву, благодаря нашей истории, а не им. Независимо от того, сколько крови пролита, американский анклав будет уничтожен."
 COL_urbanizar_la_region: "Урбанизировать регион"
 COL_urbanizar_la_region_desc: "Гражданские промышленные возможности не должны недооценивать, даже когда война угрожает миру. Мы создадим промышленные центры в Амазонке, чтобы улучшить нашу продуктивную продукцию."
 COL_comprar_yaguas: "Купить ягуас"
 COL_comprar_yaguas_desc: "Мы ничего не получим, если прибегли к насилию, чтобы получить то, что мы хотим. Напротив, мы выберем дипломатию."
 COL_intercambio_mineral_industrial: "Минерал-промышленный обмен"
 COL_intercambio_mineral_industrial_desc: "Было бы уместно дать часть наших ресурсов нашим венесуэльским союзникам в обмен на предоставление нам небольшого количества их отрасли для нашего использования."
 COL_desarrollar_el_amazonas: "Разработка Амазонки"
 COL_desarrollar_el_amazonas_desc: "Некоторые скажут, что территория Амазонки несущественна, но она полна огромного промышленного потенциала и ресурсов, ее просто необходимо использовать должным образом."
 COL_redimir_la_union: "Получить профсоюз"
 COL_redimir_la_union_desc: "Республика Нуэва Гранада была названием, данной унитарной республике, созданной центральными провинциями Гран Колумбии после ее роспуска в 1830 году. Она сохранила это имя с 1831 по 1858 год. С достаточной силой и доблестью мы можем восстановить его до полной высоты!"
 COL_nace_una_potencia: "Рождается главная сила"
 COL_nace_una_potencia_desc: "Колумбия больше не является неуместной нацией, и она никогда не будет снова. Мы займем наше законное место в конфигурации мира в качестве гегемонистской силы на континенте."
 COL_asegurar_la_poblacion: "Закрепите население"
 COL_asegurar_la_poblacion_desc: "Колумбийский народ в большинстве консервативен, они всегда были. Они знают о своей традиционной идентичности, и это то, чем мы должны воспользоваться."
 COL_respaldo_clerigal: "Поддержка духовенства"
 COL_respaldo_clerigal_desc: "Связь к католицизму населения хорошо известна, поэтому поддержка великих церковных родов почти узаконит наше движение божественным мандатом."
 COL_derrocar_a_los_liberales: "Свернуть либеральное правительство"
 COL_derrocar_a_los_liberales_desc: "Этого уже было достаточно. Очевидно, что либералы не собираются исправлять свой путь, они будут продолжать заставлять страну снижаться, если мы не будем действовать немедленно. Власть должна быть изъята немедленно и силой, пока не стало слишком поздно."
 COL_derrocar_a_los_liberales_tt: "[GetConservativeName] организует переворот против либерального правительства. Чем выше §Y -консервативное влияние §!, тем ниже шансы на гражданскую войну."
 azul_coup: "Консерваторы организовали переворот"
 COL_alzatismo: "Альзатизм"
 COL_alzatismo_desc: "Истинный лидер, который нуждается в Колумбии, должен быть радикальным и определенным. Никто не лучше, чем Гилберто Альзат, который возглавляет свою собственную сторону консерватизма."
 COL_alzatismo_focus_tt: "Эффекты §Y-распределенного правого крыла будут более серьезными или более мягкими в соответствии с количеством состояний, которые находятся под воздействием §Ylaureano gómez§!."
 COL_alzatismo_tt: "\ n§Ygilberto alzate avendaño§! захватит власть и превратит правительство в фашистского, но Лауано Гомес станет §R -консервативным несогласием и затруднено новым режимом."
 COL_laureanismo: "Лауанизм"
 COL_laureanismo_desc: "Лауано Гомес - великий консерватор, который должен возглавить республику. Он холодный и расчетливый, а также впечатляющий интеллектуал, неся с собой гигантское количество знаний по различным академическим доктринам."
 COL_laureanismo_tt: "\ n§Ylaureano gómez§! останется во главе консервативной партии, но он потребует времени, чтобы преобразовать его в фашизм."
 COL_apelar_a_las_potencias: "Обращаться к основным полномочиям"
 COL_apelar_a_las_potencias_desc: "Великие фашистские силы мира - это наша структура ссылки, чтобы возглавить нашу нацию. Мы должны установить с ними хорошие дипломатические отношения."
 COL_seguir_a_franco: "[Root.GetSeguirFrancoName]"
 COL_seguir_a_franco_name_paquito: "Следуй за Франко"
 COL_seguir_a_franco_name_phalanx: "Следуйте по фалангу"
 COL_seguir_a_franco_name: "Следуйте за Испанией"
 COL_seguir_a_franco_desc: "Право испанского является примерной моделью эффективного и функционального правительства. Их правящий способ - это нечто достойное репликации."
 COL_formar_el_bloque_hispano: "Сформировать латиноамериканский блок"
 COL_formar_el_bloque_hispano_desc: "Основные испаноязычные фашисты окружены врагами, которые только хотят видеть нас победили. Если мы объединитесь, ничто не может противостоять нам."
 COL_hipanic_bloc: "Латиноамериканский блок"
 COL_aprender_de_mussolini: "Учиться у Муссолини"
 COL_aprender_de_mussolini_desc: "Альзат подробно изучил риторику Муссолини, он, несомненно, является его великим поклонником. Не было бы удивительно, если бы он подражал несколько аспектов, которые характеризуют итальянского лидера."
 COL_material_de_guerra_italo_aleman: "Итало-германский военный материал"
 COL_material_de_guerra_italo_aleman_desc: "Объединение как итальянского, так и немецкого оружия в наших рядах, как на земле, так и в воздухе, значительно расширит боевые возможности армии. В конце концов, современное оборудование гораздо более эффективно, чем то, что мы производим."
 COL_el_haz_godo: "Эль Хаз Годо"
 COL_el_haz_godo_desc: "Есть те, кто прозвил Alzate «El Haz Hodo» за то, что он является ориентиром правой идеологической системы. Тем не менее, это название начинает резонировать среди населения как почетное звание Альзата, поэтому его официальное лицо будет благоприятной детализацией."
 COL_autocracia: "Самодержавие"
 COL_autocracia_desc: "Колумбия будет объединена только под фигурой Гилберто Альзата. Мы отбросим любую другую личную ссылку, пока не сосредоточим все это под ним, который представляет всю нацию и консервативную партию."
 COL_nacionalcatolicismo: "Национальный католицизм"
 COL_nacionalcatolicismo_desc: "Национальный католицизм - это модель, импортируемая с права испанского языка, в основном со стороны Франко, которая связывает национальную идентичность с католической доктриной, контролирующей различные аспекты общества в этом союзе. Колумбийский консерватизм выступает за аналогичную модель, поэтому мы официально примут ее в качестве политической ссылки."
 COL_economia_belica: "Военная экономика"
 COL_economia_belica_desc: "Необходимы дальнейшие усилия, чтобы расширить наши военные фабрики, чтобы удовлетворить требования к новому оборудованию."
 COL_transformacion_de_los_bienes: "Преобразовать товары"
 COL_transformacion_de_los_bienes_desc: "Экономика не может продолжать вращаться вокруг потребительских товаров. Мы должны реструктурировать модель, чтобы придать первичность военной технике."
 COL_directorio_de_produccion_estatal: "Государственный производственный каталог"
 COL_directorio_de_produccion_estatal_desc: "Рыному нельзя доверять, поскольку он никогда не изменится самостоятельно в нашу пользу. Государство должно быть тем, кто направляет экономику."
 COL_defensa_de_la_fe: "Защита веры"
 COL_defensa_de_la_fe_desc: "Мы обязаны защищать хорошую западную католическую цивилизацию от мирских угроз. Наша борьба предназначена не только для идеала, но и в интересах всей общины божественным мандатом."
 COL_la_republica_apostolica: "Апостольская Республика"
 COL_la_republica_apostolica_desc: "Великие генералы прошлого знали, что их преданность будет вознаграждена. Христианство - это мудрость, которая должна управлять поведением государства."
 COL_secularizacion_de_la_ensenanza: "Секуляризация обучения"
 COL_secularizacion_de_la_ensenanza_desc: "Вмешательство религии в образование зашло слишком далеко. Все виды идеологической идеологической обработки должны быть устранены юридическими средствами."
 COL_una_nueva_colombia: "Новая Колумбия"
 COL_una_nueva_colombia_desc: "Колумбия находится в определяющем моменте в своей истории. С этого момента родина будет возрождена из пепла либерального хаоса, открывая новую эру процветания и прогресса."
 COL_reforzar_el_conservatismo: "Подкреплять консерватизм"
 COL_reforzar_el_conservatismo_desc: "Традиционалистский моральный дух людей ухудшился с таким количеством лет либеральной администрации. Мы должны укрепить здоровые ценности нашего общества прошлых лет, пока не восстановим нашу идентичность."
 COL_alinear_a_los_leopardos: "Интегрировать леопардос"
 COL_alinear_a_los_leopardos_desc: "Леопардос-это группа правых интеллектуалов, хотя изначально диссиденты из классических партий. Тем не менее, наше новое видение консерватизма сильнее их, поэтому интеграция их в наше движение принесет большие преимущества."
 COL_alinear_a_los_leopardos_tt: "§Ypartido Conservador§! становится правящей стороной."
 COL_purgar_el_gobierno_debil: "Очистить слабое правительство"
 COL_purgar_el_gobierno_debil_desc: "Колумбийское государство страдает от коррупции и некомпетентности. Если мы хотим полностью восстановить нацию, мы должны начать с разрушения этой системы слабости."
 COL_encargarse_de_la_oposicion: "Иметь дело с оппозицией"
 COL_encargarse_de_la_oposicion_desc: "Либеральный вопрос - самая большая дилемма, с которой мы сталкиваемся. Есть те, кто считает, что мы не можем разрешить либеральное движение даже в качестве оппозиции. Другие утверждают, что мы не достигнем ничего хорошего, если мы полностью избавимся от одной из самых выдающихся партий в стране. Решение в наших руках."
 COL_milicias_partidarias: "Партийные ополченцы"
 COL_milicias_partidarias_desc: "Те, которые наиболее посвящены нашему идеалу, не могут разделить место в армии с теми, кто служит только из -за обязательств. Мы создадим частную милицию для всех симпатиков."
 COL_autodefensas_privadas: "Приватные военизированные формирования"
 COL_autodefensas_privadas_desc: "Насилие может быть осуждено, но это эффективный метод борьбы с антиправительственным мятежом. Государство будет финансировать частную политическую полицию, отвечающую за подавление этих карманов сопротивления."
 COL_controlar_los_medios: "Контролировать СМИ"
 COL_controlar_los_medios_desc: "Пресса может быть как источником порядка, так и хаосом. Мы будем регулировать средства массовой информации, чтобы гарантировать, что они не передают подрывные идеи."
 COL_el_enemigo_de_la_civilizacion: "Враг цивилизации"
 COL_el_enemigo_de_la_civilizacion_desc: "Коммунистическое мышление - это не что иное, как уловки, чтобы разрушить человеческую цивилизацию. Мы не будем стоять, поскольку его влияние распространяется как яд по всему миру."
 COL_guerra_al_caos: "Война с хаосом"
 COL_guerra_al_caos_desc: "Война, с которой мы собираемся столкнуться, - это не просто конфликт политических доктрин, а крестовый поход против всех сил генерализованного расстройства."
 COL_apaciguar_a_los_laureanistas: "Удовлетворить лауаньеристы"
 COL_apaciguar_a_los_laureanistas_desc: "Лауано Гомес не собирается так легко отказываться от своего влияния. Нам не будет хорошо поддерживать это трение интересов, поэтому мы уступим часть администрации лауаньерам до того, как они официально восстают."
 COL_apaciguar_a_los_laureanistas_tt: "Эти решения позволяют §Greduction/removal§! §Y-див"
 COL_partido_unico: "Однопартийное состояние"
 COL_partido_unico_desc: "Руководящий принцип, который должен возглавить нацию, является единство под алзатизмом. Не будет никакой другой политической группы, которая будет присутствовать в стране."
 COL_veto_a_los_contradictores: "Напрашивать противоречивые"
 COL_veto_a_los_contradictores_desc: "Политические остатки в оппозиции настаивают на дестабилизации новой республики. Нет иного выбора, кроме как принять радикальные меры против этих повстанцев."
 COL_nacionalizar_las_filiales: "Национализируйте дочерние компании"
 COL_nacionalizar_las_filiales_desc: "Частная собственность имеет важное значение, но существование небольших дочерних компаний распространяется по всей стране исключительно для целей обогащения, немыслимо. Все эти сущности пройдут в руки государства."
 COL_escuela_superior_de_guerra: "Верхний военный колледж"
 COL_escuela_superior_de_guerra_desc: "Наши генералы должны быть обучены сражаться во всех видах местности и со всеми видами оружия. Импровизация не допускается на поле битвы."
 COL_escuela_superior_de_guerra_tt: "Эти решения позволяют предоставить §Gterrain traits§! для любого общего. \ N"
 COL_revolucion_del_orden: "Революция порядка"
 COL_revolucion_del_orden_desc: "В отличие от марширующей революции Pumarejo, Лауано Гомес выступает за революцию порядка, где исполнение обязанностей преобладает над правами гарантировать стабильность Республики."
 COL_defender_a_los_oligarcas: "Защищать олигархи"
 COL_defender_a_los_oligarcas_desc: "Привилегированная элита - единственная, кто знает, как индустриализировать нацию и принести пользу ее на общем уровне. Государство должно защищать свою защиту с помощью юридических и институциональных средств."
 COL_apoyo_industrial_fascista: "Фашистская промышленная поддержка"
 COL_apoyo_industrial_fascista_desc: "Мы будем привлекать фашистские державы, чтобы инвестировать в нашу отрасль в долгосрочной перспективе. Мы повысим наше производство со всеми этими ресурсами."
 COL_monopolios_privados: "Частные монополии"
 COL_monopolios_privados_desc: "Понятно, что государство не может присутствовать во всех областях. Мы должны дать часть рынка монополиям, чтобы стабилизировать спрос и предложение."
 COL_heroes_del_frente_de_produccion: "Герои фронта производства"
 COL_heroes_del_frente_de_produccion_desc: "Рабочие на военных заводах заслуживают справедливого признания за их преданность национальной обороне. В конце концов, это герои, которые служат из промышленного производства."
 COL_aumentar_el_gasto_militar: "Увеличить военные расходы"
 COL_aumentar_el_gasto_militar_desc: "Мы перенаправим большую часть ресурсов для удовлетворения спроса на военное оборудование."
 COL_el_banco_popular: "Популярный банк"
 COL_el_banco_popular_desc: "Колумбии нуждается в частном банковском организации, которая поможет финансово помогать в стране. Конечно, он должен по -прежнему прикрепляться к государству определенным образом, чтобы избежать проблем фондового рынка."
 COL_maquinaria_europea: "Европейский механизм"
 COL_maquinaria_europea_desc: "Мы будем импортировать военный материал из Европы, который имеет более качественное и стандартное, чем тот, который мы производим на региональном уровне."
 COL_aprovechar_la_influencia: "Воспользуйтесь нашим влиянием"
 COL_aprovechar_la_influencia_desc: "Политизация армии выступает за консервативное правительство. Мы оправдываем наши действия военным одобрением и сделаем армию марионеткой партии."
 COL_sociedad_industrializada: "Промышленно развитое общество"
 COL_sociedad_industrializada_desc: "Сосредоточить все наши политические усилия на укреплении гражданской индустрии на большом скачке вперед."
 COL_la_mision_espanola: "Испанская миссия"
 COL_la_mision_espanola_desc: "Испанское право - стратегический союзник в Европе. Мы отправим дипломатическую и военную миссию, чтобы собрать некоторые из своих знаний."
 COL_diplomacia_proalemana: "Прогерманская дипломатия"
 COL_diplomacia_proalemana_desc: "Немецкий рейх - это институциональная модель, которой следует следовать. Если у нас будет поддержка Гитлера, нам будет гораздо легче установить с ними альянсы."
 COL_german_colombian_diplomacy: "Колумбийская германская дипломатия"
 COL_entrar_al_eje: "Введите ось"
 COL_entrar_al_eje_desc: "Ось, по -видимому, является доминирующей силой в войне, с победами почти на каждом фронте, которую они подвергают. Присоединение к фашистской стороне войны не кажется плохой идеей, и мы также получим военные знания немцев."
 COL_hombre_tempestad: "Hombre Tempestad"
 COL_hombre_tempestad_desc: "Впечатляющая риторика, которую Лауано Гомес Вилдс принес ему прозвище "Hombre Tempestad". В конце концов, это не похоже на плохое название."
 COL_enaltecer_el_nacionalismo: "Exalt национализм"
 COL_enaltecer_el_nacionalismo_desc: "Колумбия - это гораздо больше, чем вечная двухпартийность. Наша нация великолепна и великолепна, и это то, что люди должны знать."
 COL_corporativismo: "Корпоратизм"
 COL_corporativismo_desc: "Корпоративная модель довольно поразительна для Лауано Гомеса. Предоставление части рынка конгломерату компаний под руководством государства является эффективным способом повышения экономики, развития и частной собственности."
 COL_expandir_las_siderurgicas: "Расширить сталелитейные заводы"
 COL_expandir_las_siderurgicas_desc: "Модернизация Steelworks будет максимизировать производство металлов, используемых при изготовлении военной техники."
 COL_lealtad_absoluta: "Абсолютная верность"
 COL_lealtad_absoluta_desc: "Военные силы будут полностью подчиняться партии. Его верность к нации и идеалу будет абсолютной и окончательной, без вопросов или сомнений."
 COL_fuerzas_contrarrevolucionarias: "Контрреволюционные силы"
 COL_fuerzas_contrarrevolucionarias_desc: "Вспышки повстанцев везде. Государство должно иметь специальное подразделение, чтобы сдержать региональные восстания."
 COL_el_deber_universal: "Универсальная обязанность"
 COL_el_deber_universal_desc: "Работа, согласующаяся с человеком, это делает его незаменимой обязанностью для каждого гражданина Колумбии."
 COL_fortificar_los_nucleos: "Укрепить ядра"
 COL_fortificar_los_nucleos_desc: "Города страны остаются слабыми точками перед лицом организованной атаки врага. Мы будем строить огромные укрепления в городах, чтобы защитить себя от всего."
 COL_fortificar_los_nucleos_tt: "Поместите §Y2 forts§! во всех провинциях с §Y5 очками победы."
 COL_poder_para_el_ejercito: "Власть в армию"
 COL_poder_para_el_ejercito_desc: "Армия политизирована, но по этой причине не удобно подчинить ее в государственную область. Мы дадим высокой команде некоторую автономию, чтобы принимать правильные решения в вопросах, которые их касаются."
 COL_servicio_militar_obligatorio: "Обязательная военная служба"
 COL_servicio_militar_obligatorio_desc: "Мы представим новое законодательство по параметрам набора персонала, чтобы увеличить количество солдат в нашей армии."
 COL_metodos_de_defensa: "Методы защиты"
 COL_metodos_de_defensa_desc: "Поле битвы изменилось не только в межвоенные годы, но и в ходе недавних конфликтов. Мы должны постоянно переоценивать наши защитные доктрины, чтобы отразить это."
 COL_cuestionar_a_gomez: "Вопрос Гомес"
 COL_cuestionar_a_gomez_desc: "Администрация Laureano Gómez ведет страну в хаос с его радикальными мерами. Он должен быть немедленно остановлен."
 COL_fortalecer_a_los_opositores: "Укрепить противников"
 COL_fortalecer_a_los_opositores_desc: "Политическим противникам консерватизма много, но они подавляются насилием государства. Мы будем стремиться к их поддержке, чтобы противостоять Гомесу."
 COL_buscar_apoyo_en_el_ejercito: "Обратиться за поддержкой в ​​армии"
 COL_buscar_apoyo_en_el_ejercito_desc: "Столько, сколько высшее командование полностью поляризовано, вооруженные силы сомневаются в достоверности консервативного правительства. Это преимущество, учитывая, что это единственная сила, которую государство имеет на службе."
 COL_el_golpe_de_opinion: "Переворот мнения"
 COL_el_golpe_de_opinion_desc: "Колумбии достаточно. Гражданская администрация рухнула, насилие обострилось, и нестабильность республики является окончательной. Лауано Гомес принес только эру хаоса, пришло время свергнуть его."
 COL_legado_bolivariano: "Боливарианское наследие"
 COL_legado_bolivariano_desc: "Наша нация является прямым потомком мечты Симона Боливара, освободителя. Это все еще не потеряно. Мы пойдем по его стопам, мы возобновим проект, который Боливар начал в 1819 году."
 COL_same_origin: "Наследники Боливара"
 COL_mandato_de_unificacion: "Мандат объединения"
 COL_mandato_de_unificacion_desc: "С 1830 года мечта о воссоединении Большой Колумбии сохранялась. Теперь это желание более живое, чем когда -либо. Мы полны решимости возобновить это желание, которое было омрачено личными интересами и политическими разногласиями, но на этот раз мы сделаем это должным образом. Гран Колумбия вернется к жизни, либо по закону, либо по мечту."
 COL_cumplir_el_sueno: "Выполнить мечту"
 COL_cumplir_el_sueno_desc: "Американское правительство - не что иное, как посредник. Они поддержали разделение Панамы в 1903 году, чтобы просто построить и сохранить канал. Если мы возьмем Панаму, мы также должны взять канал. Это принадлежит нам по праву, благодаря нашей истории, а не им. Независимо от того, сколько крови пролита, американский анклав будет уничтожен."
 COL_impuesto_al_paso_maritimo: "Maritime Pass Tax"
 COL_impuesto_al_paso_maritimo_desc: "С помощью канала под контролем мы воспользуемся возможностью, чтобы ввести налог, несколько выше, чем ранее, на прохождение кораблей. Оттуда мы получим большие ресурсы для финансирования военной кампании."
 COL_segunda_campana_libertadora: "Вторая освободительная кампания"
 COL_segunda_campana_libertadora_desc: "Серия боев, которые Боливар возглавлял против испанского иго в Америке, называлась освободительной кампанией. Сегодня мы должны повторить его маршрут, но не только в Колумбии, но и на протяжении всего континента, чтобы освободить народов, угнетенных их правительствами, отравленными персоналом."
 COL_marcha_a_la_tierra_de_san_martin: "Марш на землю Сан -Мартин"
 COL_marcha_a_la_tierra_de_san_martin_desc: "Южный конус, земля, где родился герой Хосе Сан -Мартин, попала в руки отчужденных и популистских правительств. Мы определим новый курс, который американский континент пройдет с должной уверенностью, как и Сан -Мартин и Боливар."
 COL_alianza_con_el_sur: "Альянс с югом"
 COL_alianza_con_el_sur_desc: "Приятно узнать, что Аргентина прошла правильный курс. Они будут великим союзником для нашего дела."
 COL_liberar_el_sur: "Освободить юг"
 COL_liberar_el_sur_desc: "Аргентинский народ сразу же должен быть освобожден от лапок ложной демократии и популизма. Мы обязаны возглавить бой."
 COL_el_ultimo_reducto: "Последний редут"
 COL_el_ultimo_reducto_desc: "Уругвай является последней спутниковой нацией европейских интересов на континенте. Он должен быть полностью уничтожен или перенастроен."
 COL_una_america_libre: "Освобожденная Америка"
 COL_una_america_libre_desc: "Америка наконец была освобождена. Там больше не будет вмешательства интересов, больше не будет угнетения или наивности. Мы триумфально поднимаемся как мастера нашей судьбы!"
 COL_desmoronar_al_coloso: "Раскрутить колосса"
 COL_desmoronar_al_coloso_desc: "Великая Бразилия - единственная вещь, которая стоит между нами и полной победой. Это, безусловно, будет сложной кампанией, но наши смелые солдаты будут знать, как сломать фронт и победить Южноамериканский Колосс."
 COL_atacar_la_raiz: "Атаковать корень"
 COL_atacar_la_raiz_desc: "Источником латиноамериканских проблем всегда был интерес, как эти так называемые «западные державы». Мы будем атаковать их с такой силой, что они будут раздавлены нашим превосходством!"
 COL_anexion_total: "Общая аннексия"
 COL_anexion_total_desc: "Предполагалось, что Перу стал частью Колумбии, но необходимость его правителей привела к тому, что он пошел по другому пути, и теперь они находятся в плачевном состоянии. Еще не поздно поставить вещи в порядок."
 COL_apunalar_el_norte: "Нанести удар на север"
 COL_apunalar_el_norte_desc: "Центральная Америка является группой беспорядочных республик без какой -либо причины для существования. Мы будем стереть это неприятное разделение с карты."
 COL_liberar_la_republica_de_bolivar: "Освободить Республику Боливар"
 COL_liberar_la_republica_de_bolivar_desc: "Боливия получает свое название в честь Боливара, но даже в этом случае они опозорены его наследие, игнорируя все, что он сделал для этой нации. Мы измельчим правительство Боливии, которое отклонило наследство освободителя."
 COL_revivir_la_confederacion: "$ECU_reforming_the_lost_unions$"
 COL_revivir_la_confederacion_desc: "$ECU_reforming_the_lost_unions_desc$"
 COL_revivir_la_confederacion_tt: "§R Если невозможно превратить Перу-Боливскую Конфедерацию в марионетку после ее воссоединения, они могли бы пойти на войну против нас! §!"
 COL_consolidar_el_dominio: "$ECU_the_union_of_the_americas$"
 COL_consolidar_el_dominio_desc: "$ECU_the_union_of_the_americas_desc$"
 COL_asegurar_chile: "Безопасно чили"
 COL_asegurar_chile_desc: "Чили представляет большую угрозу для стабильности региона. Это не просто место, где сходятся иностранные интересы, но его правители также амбициозны, и они, кажется, стремятся привести континент к войне."
 gomez_cuestionado: "Правительство §YLaureano gómez§! было поставлено под сомнение"
  
  ### Brazil ### 
 POR_intervene_in_the_brazilian_civil_war: "Вмешиваться в гражданскую войну в Бразилии"
 POR_intervene_in_the_brazilian_civil_war_desc: "С гражданской войной полной весной и бразильскими монархистами, борющимися за свою жизнь, пришло время вмешаться и помочь им. Для большей славы империи!"
 POR_strengthen_the_uprising: "Укрепить восстание"
 POR_strengthen_the_uprising_desc: "Бразильские монархисты сами по себе не смогут сделать многое, но с нашей помощью они смогут опрокинуть всех, кто противостоит им."
 BRA_invest_in_our_economy: "Инвестировать в нашу экономику"
 BRA_invest_in_our_economy_desc: "Бразильская экономика является самой мощной во всей Южной Америке, однако недавние события в мировой экономике отодвинули нашу собственную экономику обратно, и чтобы наверстать упущенное, нам нужно будет глубоко заботиться о нашей экономике и о том, как мы ее управляем."
 BRA_pave_the_roads: "Проложить дороги"
 BRA_pave_the_roads_desc: "Большинство наших дорог плохо сконструированы и едва вымощены, если вообще. Нам нужно начать морить наши дороги и улучшать нашу инфраструктуру, если мы хотим по -настоящему изменить способ, которым работает наша нация, и догнать другие силы."
 BRA_begin_industrializing_the_nation: "Начать индустриализацию нации"
 BRA_begin_industrializing_the_nation_desc: "Приготовления были сделаны, и наша страна готова начать свое путешествие по индустриализации. Нам нужно будет настолько быстро, насколько можем, если мы хотим встретиться с другими основными державами, даже если это приведет к конфликту с мощной кофейной отраслью."
 BRA_construct_factories_for_an_army: "Построить фабрики для армии"
 BRA_construct_factories_for_an_army_desc: "Если мы хотим создать и поддерживать сильную и могущественную армию, нам нужно будет построить больше фабрик, чтобы увеличить нашу военную продукцию и удовлетворить материальные потребности армии. Это будет означать вынуждение кофейных плантаций из их земли, что может разозлить их владельцев."
 BRA_expand_our_arsenal: "Расширить наш арсенал"
 BRA_expand_our_arsenal_desc: "Чем больше наш военный арсенал, тем больше и сильнее может получить наша армия. С мощной армией никто не сможет взять нас с собой, и вместо этого мы будем теми, кто собирается окружать других."
 BRA_maintain_our_agriculture: "Поддерживать наше сельское хозяйство"
 BRA_maintain_our_agriculture_desc: "Наш сельскохозяйственный сектор в данный момент слишком мощный, чтобы бросить вызов. Наш проект индустриализации должен будет продолжаться независимо от того, что, но мы можем отложить его Портгресс, чтобы плавный переход между сельской экономикой и промышленно развитым. Нам потребуется больше времени для промышленности, но, по крайней мере, мы не будем страдать от последствий разъяренных фермеров."
 BRA_work_out_an_agreement_with_farmers: "Выпустить соглашение с фермерами"
 BRA_work_out_an_agreement_with_farmers_desc: "Наши фермеры, скорее всего, не будут слишком довольны нашим проектом по индустриализации нации, поскольку она нанесет вред их бизнесу, но мы могли бы выработать с ними соглашение. Если они примут, нам будет намного легче индустриализации."
 BRA_try_to_delay_our_industrialization: "Попробуйте задержать нашу индустриализацию"
 BRA_try_to_delay_our_industrialization_desc: "Чтобы сохранить свое обещание, мы должны сделать все, что в наших силах, чтобы отложить нашу индустриализацию и не страдать от экономических последствий такого действия."
 BRA_slow_path_to_industrialize: "Медленный путь к индустриализации"
 BRA_slow_path_to_industrialize_desc: "Мы задержали нашу индустриализацию достаточно долго, теперь мы можем начать медленный путь к индустриализации. Это может или не может быть гладким, но в долгосрочной перспективе это очень поможет нашей экономике, и мы станем такими же великими, если не даже большими, чем основные силы этого мира."
 BRA_a_balanced_economy: "Сбалансированная экономика"
 BRA_a_balanced_economy_desc: "Было бы нехорошо расставить приоритеты в армии в отношении отрасли, а не наоборот. Вместо этого мы должны попытаться сбалансировать их обоих и создать их одновременно, чтобы максимально использовать нашу экономику."
 BRA_the_brazilian_mining_industry: "Бразильская горнодобывающая промышленность"
 BRA_the_brazilian_mining_industry_desc: "Наша страна заполнена природными ресурсами, и мы можем использовать эти ресурсы для улучшения нашей собственной экономики. Нам нужно будет инвестировать значительную часть нашей экономики в отрасль, если мы хотим, чтобы она была эффективной, но она окупится в долгосрочной перспективе."
 BRA_expand_the_armys_arsenal: "Расширить армейский арсенал"
 BRA_expand_the_armys_arsenal_desc: "Наш Armys Current Arsenal не хватает, нам нужно расширить его, если мы хотим получить возможность мобилизовать и поддерживать мощную армию."
 BRA_small_local_factories: "Маленькие местные фабрики"
 BRA_small_local_factories_desc: "Теперь, когда мы более индустриализированы, чем раньше, мы можем начать создавать небольшие местные фабрики в различных частях страны, чтобы еще больше развивать нашу отрасль. Деньги, которые мы получим от этих заводов, погашат их текущую стоимость."
 BRA_support_private_rubber_companies: "Поддерживать частные резиновые компании"
 BRA_support_private_rubber_companies_desc: "Благодаря нашей индустриализационной экономике различные частные резиновые компании создаются для извлечения и продажи наших обильных резиновых плантаций на амазонках. С нашей стороны, мы могли бы поддержать эти компании и инвестировать в них, чтобы они расти и приносить еще больше денег, чем раньше."
 BRA_establish_mines_for_other_resources: "Создать шахты для других ресурсов"
 BRA_establish_mines_for_other_resources_desc: "У нас есть различные другие ресурсы по всей нашей стране, и сосредоточение исключительно на резине не поможет другим секторам экономики. Наша нация заполнена многими ресурсами, поэтому давайте использовать их в полной мере."
 BRA_establish_the_FNM: "Установить FNM"
 BRA_establish_the_FNM_desc: "FNM (короткая для Fábrica Nacional de Motores) является бразильским производителем двигателей и автомобилей. Со всеми этими новыми найденными ресурсами, добавленными к тому факту, что наша быстро индустриализация, мы можем создать индустрии Aoutomotive, которая может справиться как с гражданскими, так и военными целями."
 BRA_increased_military_output: "Увеличение военного производства"
 BRA_increased_military_output_desc: "Нам нужно больше военного производства, если мы хотим идти в ногу с требованиями нашей постоянно растущей армии."
 BRA_industrialize_the_amazons: "Индустриализировать амазонки"
 BRA_industrialize_the_amazons_desc: "Хотя сначала может показаться трудным борьбы с сердцем матери -природы, если мы сможем индустриализировать амазонки и использовать все обильные ресурсы, которые он хранил внутри, мы можем очень легко удвоить или даже утроить нашу экономику."
 BRA_establish_rubber_plantations: "Создать резиновые плантации"
 BRA_establish_rubber_plantations_desc: "Теперь, когда мы слегка индустриализировали амазонки и на некоторых дорогах, мы можем начать создавать резиновые плантации и использовать все эти хранимые резины."
 BRA_expand_our_roads_in_the_south: "Расширить наши дороги на юге"
 BRA_expand_our_roads_in_the_south_desc: "На юге страны недавно пренебрегали с тех пор, как мы начали наши довольно амбициозные усилия в амазонках. Мы также должны инвестировать в их инфраструктуру и соединить всю страну."
 BRA_improve_the_mining_industry: "Улучшить горнодобывающую промышленность"
 BRA_improve_the_mining_industry_desc: "Наша горнодобывающая промышленность сейчас гораздо эффективнее по сравнению с тем, что было когда -то. Мы должны быть в состоянии инвестировать в них меньше и при этом сохранять те же преимущества, что и раньше, благодаря всем новым ресурсам, которые мы извлекали."
 BRA_expand_the_roads_along_the_coast: "Расширить дороги вдоль побережья"
 BRA_expand_the_roads_along_the_coast_desc: "Пришло время закончить наш инфраструктурный проект и расширять наши дорожные сети вдоль береговой линии Бразилии. При этом вся страна будет связана, и наша страна будет более объединенной, чем когда -либо прежде."
 BRA_an_industry_for_the_people: "Индустрия для людей"
 BRA_an_industry_for_the_people_desc: "Наши люди заслуживают только лучших. Наши прошлые выборы и препятствия показали, что мы должны заботиться о нашем населении больше всего на свете, и наша отрасль - лучший способ показать это."
 BRA_industrialize_fully_our_economy: "Индустриация полностью наша экономика"
 BRA_industrialize_fully_our_economy_desc: "Все на месте, мы можем сделать последний шаг к индустриализации нашей экономики. Это может привести к последствиям, и мы не знаем, как на это отреагируют плантации кофейных кофейных, но это будет для большего блага бразильской экономики."
 BRA_an_industrialized_economy: "Промышленно развитая экономика"
 BRA_an_industrialized_economy_desc: "Наконец -то плантации были рассмотрены, и наш путь к власти только что был очищен. Мы увидим, куда и как далеко это займет нас, но сейчас мы можем пользоваться преимуществами, наконец, наличие ориентированной на отрасль экономики."
 BRA_expand_our_industry_in_the_south: "Расширить отрасль на юге"
 BRA_expand_our_industry_in_the_south_desc: "Юг имеет очень обильную землю, которую можно использовать для создания заводов. Мы должны быть в состоянии настроить несколько, не нарушая местную среду."
 BRA_establish_csn: "Установить CSN"
 BRA_establish_csn_desc: "CSN (Short For Companhia Siderúrgica Nacional) - это сталелитейное производство, расположенное в Бразилии, и является одной из крупнейших стальных коммунальных комаров на Латинской Америке. Со всей нашей обильной сталью мы можем создать компанию, ориентированную исключительно на производство стали и принести прибыль."
 BRA_expanded_armories: "Расширенные Оружейные"
 BRA_expanded_armories_desc: "Нам нужно расширить наши арс -пастерии для производства большего количества военной техники. Чем больше оборудования мы можем производить, тем быстрее мы можем оснастить армию и сохранить ее."
 BRA_open_up_steel_mines: "Открыть стальные мины"
 BRA_open_up_steel_mines_desc: "Теперь, когда у нас есть специальная компания, мы можем начать открывать шахты, посвященные производству стали. У нас есть различные штаты в нашей стране, которые заполнены сталью, поэтому мы должны воспользоваться этим как можно скорее."
 BRA_steel_for_the_army: "Сталь для армии"
 BRA_steel_for_the_army_desc: "Сталь очень ценна, так как это необходимый материал для многих различных военных оборудования. Теперь, когда у нас такое обильное количество стали, мы можем более эффективно производить это различное оборудование."
 BRA_expand_our_petroleum_industry: "Расширить нашу нефтяную промышленность"
 BRA_expand_our_petroleum_industry_desc: "Наши земли заполнены нефтью и нефтью, и извлечение их позволило бы нам продать его другим или использовать ее для наших собственных потребностей. В любом случае это поможет нам, и мы должны воспользоваться этим как можно скорее."
 BRA_forcas_armadas_brasileiras: "Forças Armadas Do Brasil"
 BRA_forcas_armadas_brasileiras_desc: "Вооруженные силы Бразилии являются наиболее известными во всей Южной Америке, в основном из -за ее размера и власти по сравнению с ее соседями. Несмотря на это, наши соседи быстро расширяют свои собственные вооруженные силы, и мы не можем позволить им догнать нас."
 BRA_forca_aerea: "Форса Аерея Бразилира"
 BRA_forca_aerea_desc: "Наша армия и флот - лиги впереди наших соседей, но то же самое нельзя сказать о нашей воздушной силы. Это неплохо, но это можно улучшить. У нас есть ресурсы, необходимые для того, чтобы справиться с этим."
 BRA_increased_plane_production: "Увеличение самолета"
 BRA_increased_plane_production_desc: "Первым шагом к наличию надлежащей воздушной силы является большая, и мы можем достичь этого, сосредоточив наши ресурсы на производстве внутренних самолетов. Тем не менее, слишком много внимания уделяется производству самолета и истощает наши ресурсы и отрасль, что приведет к увеличению затрат."
 BRA_foreign_plane_purchase: "Покупка иностранного самолета"
 BRA_foreign_plane_purchase_desc: "Вместо того, чтобы исчерпывать наши собственные ресурсы, давайте вместо этого приобрелите иностранные плоскости. Основные державы должны иметь линейные технологии, когда дело доходит до самолетов, и мы можем воспользоваться этим в нашей собственной воздушной силам."
 BRA_focus_on_bombers: "Сосредоточьтесь на бомбардировщиках"
 BRA_focus_on_bombers_desc: "Бомбардировка является ключом к ослаблению врага, особенно их войска и промышленности. У нас должно быть преимущество, если Neccesarry."
 BRA_focus_on_strat_bombers: "Сосредоточьтесь на стратегических бомбардировщиках"
 BRA_focus_on_strat_bombers_desc: "Стратегическая бомбардировка является одной из современных технологий, когда речь заходит о воздушной войне, и может оказаться полезным в случае войны."
 BRA_naval_bomber_effort: "Военно -морской бомбардировщик"
 BRA_naval_bomber_effort_desc: "Наличие преимущества в небе во время военно -морских сражений могло полностью изменить поток битвы."
 BRA_focus_on_fighters: "Сосредоточьтесь на бойцах"
 BRA_focus_on_fighters_desc: "Большая часть почти каждой воздушной силы на планете состоит из бойцов. Наши бойцы должны быть высочайшего качества и многочисленны, если мы хотим, чтобы наша воздушная сила была грозной."
 BRA_heavy_fighter_production: "Производство тяжелых истребителей"
 BRA_heavy_fighter_production_desc: "В то время как тяжелые бойцы стоят больше ресурсов и времени для производства, их улучшенная броня и пулеметы восполняют дополнительное время и ресурсы."
 BRA_improve_our_air_bases: "Улучшить наши воздушные базы"
 BRA_improve_our_air_bases_desc: "Нам нужно будет расширить и улучшить наши собственные воздушные базы, чтобы поддержать нашу растущую воздушную силу."
 BRA_improve_our_pilots: "Улучшить наших пилотов"
 BRA_improve_our_pilots_desc: "Пилоты, которые у нас есть в нашем распоряжении, пока не подходят для боя, мы должны убедиться, что они хорошо подготовлены к любой задаче, с которой они могут столкнуться."
 BRA_expand_our_naval_arsenal: "Расширить наш военно -морской арсенал"
 BRA_expand_our_naval_arsenal_desc: "Бразильский флот является одним из, если не самым сильным флотом в Южной Америке, и нам нужно идти в ногу с нашим военно -морским производством, если мы хотим остаться на вершине."
 BRA_produce_better_naval_equipment: "Производить лучшее военно -морское оборудование"
 BRA_produce_better_naval_equipment_desc: "Вместо того, чтобы сосредоточить наши усилия на производстве более дешевых и более многочисленных военно -морских кораблей, мы должны сосредоточиться на производстве судов более качества и более высокой скорости модернизации нашего оборудования, чем наши враги."
 BRA_produce_cheaper_naval_equipment: "Производить более дешевое военно -морское оборудование"
 BRA_produce_cheaper_naval_equipment_desc: "Какой смысл врага, имеющего модернизированное оборудование, когда мы могли бы переоценить их с более многочисленными кораблями. Мы должны сосредоточить наши усилия на производстве более дешевого и более многочисленного оборудования, а не тратить время и модернизация наших кораблей."
 BRA_strengthened_marinha_do_brasil: "Укрепление мариньи до Бразилия"
 BRA_strengthened_marinha_do_brasil_desc: "Наш флот уже силен, как есть, и мы можем предпринять дополнительные шаги, чтобы усовершенствовать его и сделать его лучше. Может быть, не довести его до уровня европейской военно -морской силы, но мы могли бы сделать наш флот уважать во всем мире."
 BRA_heavy_ship_focus: "Тяжелый корабль фокус"
 BRA_heavy_ship_focus_desc: "Корабли капитала представляют собой большую часть каждого флота, а наша ничем не отличается. Если мы хотим надлежащего военно -морского флота, нам нужны сильные капитальные суда."
 BRA_improved_heavy_ships: "Улучшенные тяжелые корабли"
 BRA_improved_heavy_ships_desc: "Наши тяжелые корабли могут быть оснащены новыми и лучшими технологиями, поэтому нам нужно стремиться к достижению такого уровня технологий и оборудовать ее на наши корабли."
 BRA_brazilian_carriers: "Бразильские перевозчики"
 BRA_brazilian_carriers_desc: "У бразильского флота есть все типы корабля, в которой он нуждается, кроме одного: перевозчики. Мы можем быть первой южноамериканской нацией, у которой есть перевозчики в их флоте, и мы обязательно получим этот титул."
 BRA_purchase_the_minas_gerais: "Купить Минас Герайс"
 BRA_purchase_the_minas_gerais_desc: "Первоначально HMS Мститель, корабль исторически был продан в Бразилии в 1956 году. С нашей растущей экономикой и необходимым расширить наш флот, мы могли бы купить перевозчика у Соединенного Королевства. Если мы предложим достаточно, они могут быть готовы принять."
 BRA_marinha_nuova: "Marinha Nova"
 BRA_marinha_nuova_desc: "Наш флот был реформирован снизу вверх, и мы можем с гордостью сказать, что это намного лучше, чем раньше. Наша военно -морская сила респектабель, даже по сравнению с основными военно -морскими державами."
 BRA_crush_the_german_subs: "Раздавить немецкие U-подборы"
 BRA_crush_the_german_subs_desc: "Эти гнилые немцы действительно думают, что могут вторгнуться в наши домашние воды и действовать так, как будто ничто не поразит их. Ну, они не могли больше ошибаться, и мы позаботимся о том, чтобы они сожалели о прикосновении к нашим водам!"
 BRA_modernize_our_battleships: "Модернизируйте наши линкоры"
 BRA_modernize_our_battleships_desc: "Наши битвы по -прежнему из эпохи Второй мировой войны. Нам нужно сделать их, чтобы унести шанс против линков других наций."
 BRA_south_american_naval_arms_race: "Южноамериканская военно -морская гонка"
 BRA_south_american_naval_arms_race_desc: "Южноамериканская военно-морская гонка-это военно-морская гонка между региональными державами Чили, Аргентины и Бразилии, которая произошла в основном во время WW1. Хотя наша конкуренция не так сильна, она все еще очень присутствует, и Чили и Аргентина обладают угрозой для нашего флота."
 BRA_efficient_submarine_production: "Эффективное производство подводных лодок"
 BRA_efficient_submarine_production_desc: "Новые достижения в области технологий и производства Dockyard позволили нам более эффективно производить подводные лодки."
 BRA_efficient_destroyer_production: "Эффективное производство эсминца"
 BRA_efficient_destroyer_production_desc: "С новыми достижениями в области технологий мы можем производить больше эсминцев с более высокой и более эффективной скоростью."
 BRA_invest_in_the_army: "Инвестировать в армию"
 BRA_invest_in_the_army_desc: "Мы уже много лет были в мире, и из -за того, что нашей армией пренебрегали. В случае войны в будущем мы должны быть готовы, и лучший способ сделать это - подготовиться заранее и инвестировать в нашу армию."
 BRA_modernize_the_tank_korp: "Модернизировать танк korp"
 BRA_modernize_the_tank_korp_desc: "Танки - это будущее земельной войны, и если мы хотим иметь АДГЕ КРЕЙТАМ, нам нужно извлечь выгоду из этой новой технологии."
 BRA_modern_mechanized_units: "Современные механизированные единицы"
 BRA_modern_mechanized_units_desc: "В то время как другие страны переходят с лошадей на моторизованные, мы пойдем прямо к механизированным и бронированным транспортным средствам. С таким преимуществом над нашим врагом никто не будет иметь шансов."
 BRA_tank_lease_from_the_USA: "Аренда танка из США"
 BRA_tank_lease_from_the_USA_desc: "Поскольку Соединенные Штаты являются нашим самым близким союзником на данный момент, очевидно, кого мы должны попросить об аренде танка. Байтурская американская экономика легко поддержала бы адекватное производство танков, чтобы удовлетворить нашу аренду танков. Все, на что у нас есть лучшая надежда, это то, что они принимают."
 BRA_keep_the_people_at_ease: "Держать людей в спокойной"
 BRA_keep_the_people_at_ease_desc: "Революция 1930 года все еще свежа в середине многих людей, и мы должны медленно убедить их в том, что армия не является злой. Это займет много усилий, но это определенно возможно."
 BRA_modernize_the_infantry_equipment: "Модернизировать пехотное оборудование"
 BRA_modernize_the_infantry_equipment_desc: "Учитывая тот факт, что каждому из наших солдат нужен пистолет, чтобы правильно функционировать, то пехотное оборудование является наиболее важным предметом оборудования для нас. Наши солдаты должны иметь роскошь использовать самое передовое оружие и иметь преимущество над любым врагом, с которым мы можем столкнуться."
 BRA_produce_more_motorized: "Производить больше моторизованного"
 BRA_produce_more_motorized_desc: "Наша главная цель должна состоять в том, чтобы полностью заменить любое использование лошадей в армии моторизованными подразделениями."
 BRA_efficient_artillery_production: "Эффективное артиллерийское производство"
 BRA_efficient_artillery_production_desc: "С новыми достижениями в области технологий, артиллерийское производство лучше, чем когда -либо, и мы можем извлечь выгоду из этого."
 BRA_train_special_jungle_regiments: "Обучить специальные полки джунглей"
 BRA_train_special_jungle_regiments_desc: "Большая часть нашей нации покрыта глубокими лесами и джунглями. В случае, когда иностранный захватчик вступает в нашу территорию, мы должны быть подготовлены, узнав о нашей собственной земле и максимально используя ее в своих интересах. Наличие полков джунглей подготовит нас к этому конфликту, если это произойдет."
 BRA_produce_more_support_equipment: "Производить больше вспомогательного оборудования"
 BRA_produce_more_support_equipment_desc: "Наше оборудование для поддержки может быть улучшено благодаря новым технологиям и ресурсам. Мы должны в полной мере воспользоваться этим."
 BRA_modernize_our_tank_equipment: "Модернизируйте наше оборудование для танков"
 BRA_modernize_our_tank_equipment_desc: "Теперь, когда наша танковая армия растет, мы должны начать сосредоточиться на модернизации наших танков, чтобы лучше иметь шанс против врага, у которого могут быть танки. Наличие верхней части в любой ситуации должно быть нашей главной целью."
 BRA_improve_our_tactics: "Улучшить нашу тактику"
 BRA_improve_our_tactics_desc: "Наши солдаты все еще используют и преподают тактику Второй мировой войны, которая в наше время устарело. Нам нужно улучшить тактику, которую мы учим, наши солдаты не только улучшают нашу армию в целом, но и на шаг впереди толпы."
 BRA_exerecito_nuovo: "Exército novo"
 BRA_exerecito_nuovo_desc: "Благодаря всем нашим реформам, улучшению технологий и улучшению производственных линий, наша армия лучше, чем когда -либо. Люди также, наконец, принимают армию, и мы, наконец, можем увидеть свет в конце туннеля."
 BRA_open_up_investments_in_the_civilian_market: "Откройте инвестиции на гражданский рынок"
 BRA_open_up_investments_in_the_civilian_market_desc: "Гражданский рынок является самым сильным сектором нашей экономики и наиболее влиятельным. Поддержание сильной и здоровой гражданской экономики должно быть нашим самым приоритетом."
 BRA_invest_in_the_arms_industry: "Инвестировать в индустрию вооружений"
 BRA_invest_in_the_arms_industry_desc: "Чем больше денег уйдет наша вооружений, тем лучше и эффективнее производство оборудования. Благодаря улучшенной индустрии вооружений мы сможем поставить крупную армию, способную победить любого врага, стоящего на нашем пути."
 BRA_foreign_investments: "Иностранные инвестиции"
 BRA_foreign_investments_desc: "Мир заполнен многими инвесторами, которые хотели бы инвестировать в другие страны, так почему бы не воспользоваться этим."
 BRA_railways_for_the_military: "Железные дороги для военных"
 BRA_railways_for_the_military_desc: "Военнослужащие не требуют ничего, кроме наиболее качественных железных дорог, чтобы правильно функционировать в такой большой стране, как наша."
 BRA_railways_for_the_people: "Железные дороги для людей"
 BRA_railways_for_the_people_desc: "Люди не заслуживают только самого качества железных дорог, чтобы отправлять товары в FRO. Нам также нужно догнать наших соседей, когда дело доходит до качества железной дороги."
 BRA_manipulate_behind_the_scenes: "Месть за 1935 год"
 BRA_manipulate_behind_the_scenes_desc: "Пришло время начать наши планы свергнуть правительство Варгаса. Наши товарищи уже пробовали один раз в 1935 году, и они были сильно подавлены. На этот раз, однако, все будет иначе. Для крестьян!"
 BRA_set_up_intelligence_agency: "Настроить разведывательное агентство"
 BRA_set_up_intelligence_agency_desc: "Если мы хотим должным образом работать под прикрытием, нам необходимо создать разведывательное агентство и повысить нашу подрывную деятельность."
 BRA_work_in_secret_with_coffee_farmers: "Работать в секрете с фермерами кофе"
 BRA_work_in_secret_with_coffee_farmers_desc: "Кофейные фермеры давно угнетены и не дают достаточно компенсации за всю свою работу. Давайте извлекаем выгоду из этого и заставим фермеров на нашей стороне гражданской войны."
 BRA_offer_labor_rights_post_civil_war: "Предложить трудовые права после цивильской войны"
 BRA_offer_labor_rights_post_civil_war_desc: "Перспективные трудовые права, как только гражданская война завершится, станет уверенным способом, чтобы вывести фермеров на нашей стороне, даже если это будет стоить нам позже."
 BRA_secret_conscription: "Секретный призывник"
 BRA_secret_conscription_desc: "Нам нужно еще больше расширить наш призыв, без замечения бразильцев. Таким образом, мы можем заверить нашу победу."
 BRA_offer_proper_training_to_farmers: "Предложить надлежащую подготовку фермерам"
 BRA_offer_proper_training_to_farmers_desc: "Можно с уверенностью сказать, что фермеры не самые лучшие солдаты. Нам нужно тренировать их и подготовить их к тому, что должно появиться в ближайшие месяцы."
 BRA_secure_all_coffee_plantations: "Закрепить все кофейные плантации"
 BRA_secure_all_coffee_plantations_desc: "Теперь, когда достаточное количество фермеров согласуется с нашим восстанием, мы можем интегрировать все штаты с плантациями в них и контролировать великое большинство из них к началу гражданской войны."
 BRA_save_up_coffee_profits: "Сэкономьте прибыль от кофе"
 BRA_save_up_coffee_profits_desc: "Гражданская война будет резко истощать нашу экономику, так что было бы умно"
 BRA_build_up_defenses_in_plantations: "Создать защиту на плантациях"
 BRA_build_up_defenses_in_plantations_desc: "Плантации должны быть должным образом защищены к тому времени, когда начинается гражданская война, иначе мы потеряем их!"
 BRA_hide_weapons_inside_the_plantations: "Скрыть оружие внутри плантаций"
 BRA_hide_weapons_inside_the_plantations_desc: "Варгас никогда не увидит этого. Я имею в виду, давайте будем реалистичными, кто будет скрывать оружие на кофейных плантациях? Точно, никого, но это изменится с нами, так как мы будем одним из первых, кто это сделает."
 BRA_destabilize_the_government: "Дестабилизировать правительство"
 BRA_destabilize_the_government_desc: "Нам нужно, чтобы Варгас и его правительство были максимально слабыми. Наши шпионы могли бы сделать некоторое вмешательство здесь и там и дестабилизировать страну."
 BRA_interfere_with_vargas_plans: "Мешать планам Варгаса"
 BRA_interfere_with_vargas_plans_desc: "Варгас был для нас ничем иным, как болью, вмешиваясь с нашими планами при каждой возможности получить. Ну, это изменится, мы сделаем с ним то, что он сделал с нами, и вмешиваться с его собственными планами."
 BRA_secretely_spread_support: "Тайно распространять поддержку"
 BRA_secretely_spread_support_desc: "Люди должны узнать о нашем деле и движении и присоединиться к битве против Варгаса. Мы должны убедиться, что Варгас не узнает."
 BRA_convince_the_army: "Убедить армию"
 BRA_convince_the_army_desc: "В гражданской войне одна из самых важных вещей, которые нужно сделать, - это поддерживать лояльность армии. Мы позаботимся о том, чтобы большая часть армии не лояла Варгасу к тому времени, когда мы запустим наши планы."
 BRA_organize_countrywide_strikes: "Организовать удары по всей стране"
 BRA_organize_countrywide_strikes_desc: "Мы уже протестовали в прошлом, но ни один из них даже не приблизится к общенациональным протестам, которые мы планируем, когда мы планируем. Правительство Варгаса будет дестабилизировано за пределы понимания."
 BRA_secret_supply_build_up: "Секретное наращивание снабжения"
 BRA_secret_supply_build_up_desc: "Поставка будет иметь решающее значение во время гражданской войны. Кто бы ни контролировал железные дороги и узлы снабжения страны, в конечном итоге победит. Этот победитель станет нами, если мы сможем тайно создавать запасы в местах, в которых мы восстаем."
 BRA_ask_for_soviet_support: "Попросить советскую поддержку"
 BRA_ask_for_soviet_support_desc: "Советы довольно хорошо представляют наши идеалы, и мы считаем, что они будут готовы помочь нашему делу и свергнуть правительство Варгаса."
 BRA_soviet_logistic_advisors: "Пригласить советских консультантов по логистике"
 BRA_soviet_logistic_advisors_desc: "В соответствии с этим, не так много высокопоставленных офицеров, преданных нашему делу, поэтому вместо этого мы должны привлечь советских советников, чтобы помочь нам."
 BRA_soviet_volunteers: "Советские добровольцы"
 BRA_soviet_volunteers_desc: "Добровольцы будут очень полезны во время гражданской войны. Если мы сможем обеспечить советские, у нас будет огромное преимущество перед Варгасом и его режимом."
 BRA_bring_soviet_weaponry_in_bulk: "Принесите советское оружие"
 BRA_bring_soviet_weaponry_in_bulk_desc: "У нас не так много времени, чтобы сэкономить. Лучше, если мы принесем советское оружие оптом и надеемся, что Варгас не узнает о нашей внезапной торговле оружием."
 BRA_secretly_bring_soviet_weaponry: "Тайно принести советское оружие"
 BRA_secretly_bring_soviet_weaponry_desc: "Поскольку Варгас контролирует каждый наш ход, будет лучше, если мы делаем что -то внимательно и планируем что -то соответствующим образом. Мы принесем пониженное количество оружия более медленными темпами, чтобы лучше увеличить наши шансы на то, чтобы не обнаружиться."
 BRA_bring_in_soviet_tanks: "Приносить советские танки"
 BRA_bring_in_soviet_tanks_desc: "Советские танки являются одними из лучших на планете, способные выдерживать множество различных сред, и их можно легко производить. Мы принесем некоторые из их танков в нашу страну, чтобы сражаться в гражданской войне."
 BRA_cooperation_with_the_anarchists: "Сотрудничество с анархистами"
 BRA_cooperation_with_the_anarchists_desc: "Анархисты в нашей партии не слишком любят наши планы, и некоторые из наших шпионов уведомили нас, что они планируют десерт после начала гражданской войны. Мы должны попытаться заключить сделку, чтобы убедиться, что этого не произойдет."
 BRA_strengthen_support_in_our_provinces: "Укрепить поддержку в наших провинциях"
 BRA_strengthen_support_in_our_provinces_desc: "Чем больше, тем лучше, это, вероятно, то, что кто -то сказал однажды в истории. В этом случае это применяется больше, чем когда -либо, так как нам понадобится столько людей на поле, сколько мы могли бы получить."
 BRA_assasinate_vargas: "Ассасинат Варгас"
 BRA_assasinate_vargas_desc: "Куски на месте, все выглядит готово к работе. Все, что осталось, - это убрать короля и сделать это, мы планируем убийство на Варгасе. Независимо от того, работает ли это, не случайно, так что на этот раз шансы на нашу сторону будут на нашей стороне."
 BRA_women_in_the_army: "Женщины в армии"
 BRA_women_in_the_army_desc: "Женщины должны быть не только на фабриках или дома, они также могут быть великими солдатами, желающими бороться за свою родину, и мы позаботимся о том, чтобы их мечта стала реальностью."
 BRA_train_female_pilots: "Обучить женских пилотов"
 BRA_train_female_pilots_desc: "Многие женщины в армии также хотели стать пилотами для нашего дела и доминировать в небе на войне. Мы дадим им надлежащее обучение, чтобы выполнить их задачи."
 BRA_save_ewert: "Сохранить Эверт"
 BRA_save_ewert_desc: "Эверт был задержан в Рио -де -Жанейро Варгасом еще в 1935 году. Учитывая ситуацию, в которой мы находимся, мы можем освободить его, если мы поймаем Рио -де -Жанейро."
 BRA_strike_a_deal_with_the_seperatists: "Заключить сделку с сератистами"
 BRA_strike_a_deal_with_the_seperatists_desc: "Паулистас рассматривает эту гражданскую войну как возможность наконец быть свободным, в чем мы не виноваты. К счастью, они на самом деле находятся в достойных условиях с нами, и мы могли бы даже заключить с ними сделку, предлагая автономию в обмен на не восстание."
 BRA_crush_the_seperatists: "Сокрушить сепаратисты"
 BRA_crush_the_seperatists_desc: "Эти чертовы Паулистас будут раздавлены, когда они восстают! Мы позаботимся об этом!"
 BRA_contact_other_south_american_countries: "Свяжитесь с другими странами Южной Америки"
 BRA_contact_other_south_american_countries_desc: "Нам нужно как можно больше иностранной поддержки. Просто нашим ресурсам и оружием может быть недостаточно, но с помощью других это будет гораздо более осуществимым."
 BRA_new_training_regiments: "Новые учебные полки"
 BRA_new_training_regiments_desc: "Наша нынешняя армия недостаточно с нашей нынешней ситуацией, нам нужны новые полки, новые лица, чтобы пойти на фронт и сделать коммунистическую мечту в реальность!"
 BRA_restrcuture_the_brazilian_army: "Реструктурировать бразильскую армию"
 BRA_restrcuture_the_brazilian_army_desc: "Теперь, когда мы консолидировали в основном власть в нашей фракции, нам нужно реструктурировать армию и улучшить ее как можно больше."
 BRA_confiscate_paulista_weaponry: "Конфисковать оружие Паулиста"
 BRA_confiscate_paulista_weaponry_desc: "Там, где Паулистас получил оружие, является загадкой, но с другой стороны, мы можем использовать его в наших интересах."
 BRA_the_final_push: "Последний толчок"
 BRA_the_final_push_desc: "Конец находится в поле зрения, мы просто должны сделать один последний толчок. Для людей, для крестьян, для фермеров мы выиграем эту войну!"
 BRA_la_bestia_roja: "La Bestia Roja"
 BRA_la_bestia_roja_desc: "Боливийская «Бестиа Роха» была волонтерской корпорацией из Боливии, отправленной в Коммун Бразилии во время гражданской войны в Бразилии. Он видел много боя и хорошо справился с поддержкой линий фронта, когда это необходимо."
 BRA_soviet_war_administration: "Советская война администрация"
 BRA_soviet_war_administration_desc: "Советы должны быть теми, кто справляется с нашими финансовыми показателями. На данный момент у нас нет времени беспокоиться об этом, даже если нам придется платить больше войны после цивиля."
 BRA_strategic_supply_hub_construction: "Стратегическое строительство центра снабжения"
 BRA_strategic_supply_hub_construction_desc: "Поставки центров являются наиболее важным аспектом управления поставками и будут иметь решающее значение в нашей нынешней ситуации."
 BRA_switch_to_a_war_economy: "Переключиться на военную экономику"
 BRA_switch_to_a_war_economy_desc: "Неважно, если наша экономика будет танковать потом, нам нужно все, что мы можем получить прямо сейчас!"
 BRA_resources_for_the_army: "Ресурсы для армии"
 BRA_resources_for_the_army_desc: "Армия требует увеличения поставки оборудования, а это означает, что нам нужно будет направлять больше ресурсов на наши производственные линии, чтобы поставить наших солдат."
 BRA_emergency_railroad_construction: "Экстренная железная дорога строительство"
 BRA_emergency_railroad_construction_desc: "Железные дороги, которые уже были установлены в Бразилии до гражданской войны, были сокращены до обломков. Нам нужно будет восстановить их и расширить их еще дальше, чтобы увеличить наши линии подачи и степень их."
 BRA_populate_the_industrial_mills: "Заполнить промышленные мельницы"
 BRA_populate_the_industrial_mills_desc: "Промышленным мельницам не хватает численности из-за интенсивности гражданской войны, но теперь, когда мы приближаемся к концу, мы сможем их заполнить."
 BRA_adapt_soviet_railway_systems: "Адаптировать советские железнодорожные системы"
 BRA_adapt_soviet_railway_systems_desc: "Уже было показано, что советские железные дороги являются исключительными при транспортировке припасов из Москвы в Сибири. Нам нужен такой уровень железных дорог прямо в этот момент, чем раньше, тем лучше."
 BRA_delay_the_integralist_uprising: "Задержать восстановление интегралиста"
 BRA_delay_the_integralist_uprising_desc: "Интегралисты планируют собственное восстание, но мы ничего не можем вмешиваться благодаря нашим шпионам. Мы нарушаем их планы и усложнем их."
 BRA_crush_the_integralists: "Сокрушить интегралисты"
 BRA_crush_the_integralists_desc: "Хорошо, кажется, что мы собрали более чем достаточно Intel на интегралистах, пришло время начать сокрушать любое место, в котором они могут восстать в наших границах. Мы ослабим их таким образом, и, возможно, даже вообще предотвратит восстание."
 BRA_supply_hubs_in_sao_paulo: "Центры снабжения в Сан -Паулу"
 BRA_supply_hubs_in_sao_paulo_desc: "Теперь, когда мы контролируем Сан -Паулу, мы можем установить центры снабжения для увеличения степени наших линий снабжения."
 BRA_invest_heavily_in_the_military: "Инвестировать в армию"
 BRA_invest_heavily_in_the_military_desc: "Военным требуется как можно больше финансирования, и мы обязательно выслушаем их крики и дадим им то, что они хотят."
 BRA_victors_at_last: "Победители наконец"
 BRA_victors_at_last_desc: "После многих месяцев ничего, кроме жестокой войны и жизни многих, мы, наконец, консолидировали всю страну. Это день празднования, и тот, который отмечает начало новой эры бразильской истории."
 BRA_the_peasants_represent_democracy: "Крестьяне представляют демократию"
 BRA_the_peasants_represent_democracy_desc: "Коммунизм не адекватно представляет то, во что верят крестьяне. Демократия является лучшим кандидатом на это, и мы слушаем крестьян."
 BRA_begin_deradicalization: "Начните дебадикализацию"
 BRA_begin_deradicalization_desc: "Из -за интенсивности гражданской войны многие люди и политики в нашей новой стране адаптировали крайние идеалы. Эти радикальные идеалы не могут длиться долго в нашей стране, если мы даже мечтаем переключиться на демократию."
 BRA_the_blue_purge: "Синяя чистка"
 BRA_the_blue_purge_desc: "Пребы нужно идти, нравится ему это или нет. Мы просто не сможем установить с ним демократию, все еще у власти. Возможно, даже с нашими намерениями, некоторые политики, ушедшие в отставку с должности, могут вернуться и предложить нам поддержку."
 BRA_re_establish_the_congress: "Восстановлять Конгресс"
 BRA_re_establish_the_congress_desc: "До сих пор мы не заметили, насколько важен Конгресс для страны. Может быть, это был не лучший выбор, чтобы растворить его. Из-за этого мы восстановим его и посмотрим, как это происходит."
 BRA_social_democratic_brazil: "Социал -демократическая Бразилия"
 BRA_social_democratic_brazil_desc: "Все приготовления были сделаны, установив социал -демократию в наших руках."
 BRA_open_our_borders: "Откройте наши границы"
 BRA_open_our_borders_desc: "Люди со всего мира приветствуются в нашей стране. Этническая принадлежность, раса, национальность, ничто из этого не имеет значения, мы все равны, и мы готовы принять кого -либо."
 BRA_promote_immmigration: "Продвигать иммиграцию"
 BRA_promote_immmigration_desc: "Иммиграция является ключевой, получая новые люди из других стран, чтобы помочь перенести нашу страну до величия. Они будут нести будущие поколения, и наша страна будет формироваться вокруг них."
 BRA_learn_from_italian_immigrants: "Учиться у итальянских иммигрантов"
 BRA_learn_from_italian_immigrants_desc: "Итальянские иммигранты приносят много интересных технологий и вещей, которые мы еще не знали. Мы должны учиться у них, чтобы лучше улучшить наше собственное оборудование."
 BRA_learn_from_german_immigrants: "Учиться у немецких иммигрантов"
 BRA_learn_from_german_immigrants_desc: "Немецкие иммигранты очень умны, и они приносят с собой много вещей, о которых мы еще не узнали. Мы должны учиться у них, чтобы лучше улучшить наше собственное оборудование."
 BRA_choose_our_leader: "Выберите нашего лидера"
 BRA_choose_our_leader_desc: "Пришло время, когда люди выбирают, кого привести их к величию. Они были теми, кто сделал тяжелую работу, и они заслуживают выбора, кто должен их вести."
 BRA_export_our_coffee: "Экспортируйте наш кофе"
 BRA_export_our_coffee_desc: "Наша производство кофе продолжает расти все больше и больше. Нам нужно извлечь выгоду из этого и экспортировать его в другие страны, чтобы получить прибыль."
 BRA_redistrubute_the_profits_amongst_the_classes: "Перераспределить прибыль среди классов"
 BRA_redistrubute_the_profits_amongst_the_classes_desc: "Благодаря нашему экспорту кофе мы получаем большую прибыль, и эту прибыль можно использовать для распределения среди социальных классов нашей страны."
 BRA_invest_in_foreign_economies: "Инвестировать в иностранные экономики"
 BRA_invest_in_foreign_economies_desc: "Есть много растущих экономик. Давайте воспользуемся этим и инвестируем в них, если все пойдет хорошо, мы получим от них массовую прибыль."
 BRA_invest_in_the_army_f: "Инвестировать в армию"
 BRA_invest_in_the_army_f_desc: "Армия не в лучшей форме, как мы говорим, но инвестиции в эту филиал значительно улучшит ее."
 BRA_expand_our_civilian_economy: "Расширить нашу экономику гражданского населения"
 BRA_expand_our_civilian_economy_desc: "В настоящее время гражданская экономика довольно мала, поэтому она будет расширять наш лучший курс действий."
 BRA_closer_ties_with_other_social_democracies: "Более тесные связи с другими социал -демократиями"
 BRA_closer_ties_with_other_social_democracies_desc: "Социал -демократии мира, скорее всего, будут готовы сотрудничать с нами сейчас, и мы даже можем создать фракцию, если что -то пойдет хорошо."
 BRA_formalize_a_proper_allience: "Формализовать правильный альянс"
 BRA_formalize_a_proper_allience_desc: "Похоже, что наши планы пошли в соответствии с планом, и теперь мы можем формализовать официальный союз с другими социал -демократиями."
 BRA_help_out_the_french_resistance: "Помогать французскому сопротивлению"
 BRA_help_out_the_french_resistance_desc: "Нацисты достали Францию ​​и мучают ее население в жадных целях. Мы больше не будем стоять, давайте поможем французскому сопротивлению."
 BRA_send_aid_to_the_soviets: "Отправить помощь Советам"
 BRA_send_aid_to_the_soviets_desc: "Советская ситуация сейчас не выглядит слишком хорошей. Отправка помощи им должна быть приоритетом."
 BRA_the_anti_fascist_movement: "Антифашистское движение"
 BRA_the_anti_fascist_movement_desc: "Фашизм - это чума на этой планете. Их крайние идеалы разрушают политический и социальной климат мира. Если они продолжат идти так, у нас будут серьезные проблемы."
 BRA_cleanse_the_continent_of_fascism: "Очистить континент фашизма"
 BRA_cleanse_the_continent_of_fascism_desc: "Наш красивый континент испорчен фашизмом! Мы не можем позволить этой мерзкой идеологии распространяться дальше."
 BRA_decimate_the_beacon_of_fascism: "Разделять маяк фашизма"
 BRA_decimate_the_beacon_of_fascism_desc: "Сердце фашизма в настоящее время лежит в Германии, поэтому их вывод наверняка дестабилизирует все другие фашистские режимы в мире."
 BRA_establish_our_dominance: "Установить наше доминирование"
 BRA_establish_our_dominance_desc: "Теперь, когда гражданская война вне дороги, пришло время дать понять всем, что теперь мы являемся теми, кто отвечает за нацию, и мы сделаем это силой, если это необходимо!"
 BRA_army_preperations: "Армейские препараты"
 BRA_army_preperations_desc: "Чтобы наши планы сбылись, нам нужно будет подготовить нашу армию и улучшить ее до уровня, который никогда раньше не видели."
 BRA_efficient_supply_consumption: "Эффективное потребление предложения"
 BRA_efficient_supply_consumption_desc: "Если гражданская война научила нас чему -то, то это то, что предложение является ключевым в конфликте. Мы должны убедиться, что мы максимально эффективны, когда речь заходит о потреблении предложения."
 BRA_the_inevitable_spread_of_communism: "Неизбежное распространение коммунизма"
 BRA_the_inevitable_spread_of_communism_desc: "Коммунистические идеалы обязательно распространяются за пределы наших границ, это просто данный. Мы позаботимся о том, чтобы помочь указанному распространению и превратить наших соседей в коммунистические государства."
 BRA_establish_agrarian_reforms: "Установить аграрные реформы"
 BRA_establish_agrarian_reforms_desc: "С экономикой в ​​руинах благодаря гражданской войне, мы должны принять как можно больше мер, чтобы облегчить экономические проблемы. Аграрные реформы могут быть полезными прямо сейчас и очень помогут справиться с рецессией после цивильника."
 BRA_post_civil_war_recovery: "После восстановления гражданской войны"
 BRA_post_civil_war_recovery_desc: "В то время как мы выиграли гражданскую войну, все еще остаются изолированные карманы сопротивления, с которыми необходимо справиться, прежде чем они выйдут из -под контроля."
 BRA_expand_our_plantations_even_further: "Расширить наши плантации еще дальше"
 BRA_expand_our_plantations_even_further_desc: "Экспорт кофе уже оказался значительно помогает экономике и нашим людям, поэтому мы должны расширить наши плантации, чтобы как можно больше извлечь выгоду из этих экспорта."
 BRA_expand_the_peasant_markets: "Расширить крестьянские рынки"
 BRA_expand_the_peasant_markets_desc: "Крестьянские рынки растут изо дня в день, так как все больше и больше экспортных денег. Мы должны поддержать их как можно больше, чтобы не только улучшить их финансовое положение, но и экономику в целом."
 BRA_limit_our_exports: "Социалистическая наука"
 BRA_limit_our_exports_desc: "Мы инвестируем в наши лаборатории для улучшения нашего научного департамента и сектора исследований."
 BRA_strengthen_our_intelligence_agency: "Укрепить наше агентство по интеллектуальному интеллекту"
 BRA_strengthen_our_intelligence_agency_desc: "Наше разведывательное агентство не использовалось с момента гражданской войны. Улучшения наступают, чтобы лучше адаптировать его к нашим предстоящим планам."
 BRA_form_volunteer_korps: "Форма добровольца Корпс"
 BRA_form_volunteer_korps_desc: "Мы должны быть в состоянии отправлять добровольцев, где бы и когда мы хотим, чтобы наши планы работали."
 BRA_everyone_united_under_one_banner: "Все объединились под одним баннером"
 BRA_everyone_united_under_one_banner_desc: "Приготовления были сделаны, пришло время начать подстрекаться к коммунистическим восстаниям в других странах. У нас есть рабочая сила, шпионы и сила, чтобы сделать это. Коммунизм расширяется по всему континенту!"
 BRA_re_establish_a_fully_agrarian_economy: "Восстановить полностью аграрную экономику"
 BRA_re_establish_a_fully_agrarian_economy_desc: "Индустриализация имеет свои преимущества, но сельская экономика не такая плохая, как другие считают ее. Он может иметь свои преимущества, и мы докажем всем, что вам не нужен промышленно развитая экономика, чтобы быть успешной."
 BRA_establish_an_agrarian_syndicate_council: "Создать аграрный синдикат Куунсун"
 BRA_establish_an_agrarian_syndicate_council_desc: "Чтобы опосредовать негативы сельской экономики, мы создадим Совет аграрного синдиката, и он может справиться с управлением экономическим управлением."
 BRA_slowly_subjegate_our_neighbors: "Медленно починить наших соседей"
 BRA_slowly_subjegate_our_neighbors_desc: "Наши соседи в настоящее время намного слабее нас, возможно, с небольшим количеством манипулирования и политического давления мы можем заставить их стать нашими подданными."
 BRA_industrial_build_up_in_the_cisplatine: "Промышленное наращивание в цисплатине"
 BRA_industrial_build_up_in_the_cisplatine_desc: "Давайте поможем уругвайцам в их отрасли, я уверен, что они будут рады принять нашу помощь."
 BRA_integrate_uruguay: "Интегрировать Уругвай"
 BRA_integrate_uruguay_desc: "Благодаря промышленному наращиванию и другим факторам, Уругвай сейчас находится под нашим доменом и скоро будет аннексирован."
 BRA_strike_at_the_colonizers: "Нанести удар по колонизаторам"
 BRA_strike_at_the_colonizers_desc: "Эти проклятые империалисты думают, что они могут иметь земли здесь, на нашем драгоценном континенте? Ну, они подумали неправильно!"
 BRA_push_past_the_darien_gap: "Протолкнуть промежуток"
 BRA_push_past_the_darien_gap_desc: "Наши ворота к капиталистическим свиньи выше - через Центральную Америку, и на нашем пути стоит разрыв Дариэна и страны, занимающие его."
 BRA_the_revolution_beyond_south_america: "Революция за пределами Южной Америки"
 BRA_the_revolution_beyond_south_america_desc: "Пришло время революция расширяется за пределы границ этого континента. Северная Америка также будет свидетельствовать о мощи революции!"
 BRA_push_past_mexico: "Протолкнуть мимо Мексики"
 BRA_push_past_mexico_desc: "Мексика стоит на нашем пути величия. Мы быстро перекатим их, чтобы добраться до нашей главной цели."
 BRA_the_union_of_south_american_socialist_republics: "Союз южноамериканских социалистических республик"
 BRA_the_union_of_south_american_socialist_republics_desc: "Коммунизм не знает границ, и мы будем уважать это, объединив всю Южную Америку под одним баннером. Это будет стоить жизни, времени и ценных активов, но в конечном итоге это будет стоить."
 BRA_take_out_the_capitalist_pigs: "Достать капиталистических свиней"
 BRA_take_out_the_capitalist_pigs_desc: "Пришло время, теперь мы готовы взять на себя Соединенные Штаты. Тот, кто победит здесь, будет диктовать этот континент до конца времени. Демократия или коммунизм? Только один будет сохраняться."
 BRA_form_the_latin_bloc: "Сформировать латинский блок"
 BRA_form_the_latin_bloc_desc: "Вместо того, чтобы активно искать врагов, мы должны вместо этого консолидировать и формировать альянсы со странами, которые разделяют для нас подобные идеалы. Латинский блок станет идеальным способом сделать это."
 BRA_invite_our_brothers_beyond_south_america: "Посмотри за Южную Америку"
 BRA_invite_our_brothers_beyond_south_america_desc: "Есть много других стран за пределами Южной Америки, которые разделяют те же идеалы, что и мы, и хотели бы быть в военном альянсе с нами."
 BRA_recover_the_cisplatine: "Восстановить цисплатин"
 BRA_recover_the_cisplatine_desc: "Цисплатин был хорошим временем ранней истории Бразилии, неотъемлемой частью нации. Сегодня будет восстановить нашу потерянную территорию, завтра будет интегрировать ее в нашу страну."
 BRA_join_the_soviets: "Присоединяйтесь к Советам"
 BRA_join_the_soviets_desc: "Советский Союз, настоящая мать коммунизма в современную эпоху. Наличие их в качестве союзника было бы честью, и мы постараемся сделать это реальностью."
 BRA_send_the_soviets_armaments: "Отправить помощь Советам"
 BRA_send_the_soviets_armaments_desc: "Советы требуют нашей помощи, и мы будем подчиняться, дав им все, что мы можем дать."
 BRA_join_in_against_the_germans: "Присоединиться к немцам"
 BRA_join_in_against_the_germans_desc: "Время помочь миру против фашистской угрозы. Как только Германия обрушится, фашистская идеология больше не будет."
 BRA_peasants_helping_peasants: "Крестьяне помогают крестьянам"
 BRA_peasants_helping_peasants_desc: "Крестьяне там, чтобы помочь другим. Мы должны быть в союзе и помогать друг другу, когда это возможно. Если мы не можем сделать что -то столь простое, то мы облажались."
 BRA_joint_military_buildup: "Совместные военные"
 BRA_joint_military_buildup_desc: "Наши военные самостоятельно хороши, но вместе они могут быть неудержимыми."
 BRA_compromise_with_the_democrats: "Идти на компромисс с демократами"
 BRA_compromise_with_the_democrats_desc: "Наши шпионы смогли сообщить нам, что демократы в стране выяснили о нашем запланированном восстании и планируют собственное восстание. Может быть, просто может быть, мы могли бы пойти с ними компромисс, чтобы предотвратить их восстание во время гражданской войны."
 BRA_reject_the_estado_navo: "Отвергать эстадо Ново"
 BRA_reject_the_estado_navo_desc: "Варгас серьезно думает, что он поступает правильно? Это позорно, мы даже думали, что в начале, и мы должны принять меры, чтобы убедиться, что он платит за то, что он делает. Стране придется на мгновение колебаться, но не боятся за то, что мы будем теми, кто возвращает ее к невообразимым высотам."
 BRA_challenge_vargass_influence: "Бросить вызов влиянию Варгаса"
 BRA_challenge_vargass_influence_desc: "Варгас уже оказывает огромное влияние на страну, и если он сохранит это влияние на страну, наши планы не сработают. Нам придется бросить вызов его влиянию и попытаться убить его, даже если это рискованный маневр."
 BRA_organize_integralist_protests: "Организовать интегральные протесты"
 BRA_organize_integralist_protests_desc: "Уже есть много людей, которые следуют нашим идеалам по всей стране. Благодаря этому мы сможем организовать протесты по всей стране для дальнейшего снятия Варгаса."
 BRA_let_our_voices_be_heard: "Пусть наши голоса будут услышаны"
 BRA_let_our_voices_be_heard_desc: "Голос интегрализма больше не должен быть подавлен, мы позаботимся о том, чтобы каждый квадратный дюйм этой страны слышит наши идеалы и цели."
 BRA_trained_militia_regiments: "Обученные полки ополченцев"
 BRA_trained_militia_regiments_desc: "Нам понадобится лучшие ополченцы, которые мы можем получить, чтобы наше восстание на работу. Нет сомнений в том, что Варгас будет использовать его лучшие войска, и мы должны убедиться, что у нас есть верх."
 BRA_the_integralist_army: "Интегралистская армия"
 BRA_the_integralist_army_desc: "Наша армия должна расширяться не в небольшой степени, но до такой степени это можно считать чем -то совершенно отличным от бразильских вооруженных сил. Интегралистская армия приведет нас к победе!"
 BRA_attack_the_guanabara_palace: "Атаковать дворец Гуанабара"
 BRA_attack_the_guanabara_palace_desc: "Приготовления были завершены, все на месте, чтобы начать восстание. Что случилось впереди, это кровь и хаос, но мы сделаем это, и Варгас упадет вместе со всеми его коррумпированными помощниками!"
 BRA_contact_the_germans_for_help: "Свяжитесь с [ITA.GetAdjective]"
 BRA_contact_the_germans_for_help_desc: "Это восстание не будет легким для нас, поэтому нам нужно обратиться к [ITA.GetAdjective] за помощью. Учитывая наши подобные идеалы, они, вероятно, примут."
 BRA_secure_german_weaponry: "Безопасное [ITA.GetAdjective] Оружие"
 BRA_secure_german_weaponry_desc: "[ITA.GetAdjective] Оружие - одно из лучших на этой планете. Получение в руки эти оружия и артиллерийские произведения будет означать полное уничтожение Варгаса и его людей."
 BRA_discuss_potential_german_volunteers: "Обсудить потенциальные добровольцы [ITA.GetAdjective]"
 BRA_discuss_potential_german_volunteers_desc: "С помощью [ITA.GetAdjective] теперь охотно поддерживает наше дело, мы могли бы получить некоторых из их солдат и использовать их в нашем восстании. С такими высококвалифицированными солдатами у Варгаса не будет шансов!"
 BRA_gain_the_armys_support: "Получить поддержку Армиса"
 BRA_gain_the_armys_support_desc: "Армия будет в значительной степени диктовать, кто выигрывает эту гражданскую войну, и мы должны быть уверены, что будем на хорошей стороне армии, если мы хотим иметь шанс."
 BRA_follow_barrosos_principals: "Следуйте за принципалами Баррососа"
 BRA_follow_barrosos_principals_desc: "Густаво Баррозо - очень интересный человек. Твердо веря в интегрализм и кто -то с довольно экстремистскими взглядами, он кажется идеальным лидером, который возглавит нас во время гражданской войны."
 BRA_the_jews_are_our_common_enemy: "Евреи - наш общий враг"
 BRA_the_jews_are_our_common_enemy_desc: "Баррозо считает, что евреи тайно контролируют мир, и это влияет на страну в целом. Из -за этого начнется серия депортаций для любого еврея, живущего в стране."
 BRA_arm_up_the_industrial_workers: "Поднимать промышленных работников"
 BRA_arm_up_the_industrial_workers_desc: "Работники по всей стране устали от того, чтобы их игнорировали правительством. Они заслуживают лучшего правительства, которое заботится о них и ценит их усилия, и это правительство будет нашим. Мы возьмем их и вооружаем их так, чтобы к тому времени, когда начнется гражданская война, мы будем более чем готовы встретиться с Варгасом."
 BRA_secure_the_heavy_industry_provinces: "Обеспечить провинции тяжелые промышленности"
 BRA_secure_the_heavy_industry_provinces_desc: "Великолепное большинство работников расположены в промышленных провинциях страны. Благодаря нашей текущей поддержке мы должны быть в состоянии обеспечить все эти провинции."
 BRA_plinio_to_victory: "Плинио к победе"
 BRA_plinio_to_victory_desc: "Плинио, без преувеличения, отец интегрализма. Он хладнокровный человек, который может думать, находясь под стрессом, и никто другой не подходит для того, чтобы привести интегрализм к победе, чем отец идеологии."
 BRA_confiscate_stockpiled_weapons: "Конфисковать запасы оружия"
 BRA_confiscate_stockpiled_weapons_desc: "Мы получили Intel в местах различных мест, где правительство закупает оружие. Мы просто ... украсть несколько из них, я уверен, что Варгас не так против."
 BRA_seek_cooperation_with_prestes: "Попробуйте убить Пребы"
 BRA_seek_cooperation_with_prestes_desc: "Пребы - это шип на нашей стороне. Как только мы запустим восстание, нет никаких сомнений, что он также начнет подготовку к одному из своих. Мы не можем позволить ему достичь этого, и хотя ход действий по убийству его может показаться экстремальным, нам нужно что -то экстремальное, чтобы убедиться, что он не вмешивается в наши планы."
 BRA_farmers_to_arms: "Фермеры до оружия"
 BRA_farmers_to_arms_desc: "Фермеры в основном поддерживают Престы и его идеалы, но с небольшим принуждением мы сможем получить их на нашей стороне. Как только мы это сделаем, мы можем начать вооружение, чтобы подготовить их к тому, что будет."
 BRA_learn_subversive_techniques_from_the_communists: "Прижимайте последователи Престатс"
 BRA_learn_subversive_techniques_from_the_communists_desc: "Коммунисты долгое время были одними из лучших в стране, чтобы организовать скрытые атаки и тайно дестабилизировать правительство. Мы можем узнать кое -что из их последователей и посмотреть, сможем ли мы адаптировать некоторые из их методов."
 BRA_try_to_convince_plantations: "Попробуйте убедить плантации"
 BRA_try_to_convince_plantations_desc: "Это будет сложно, но на данный момент это определенно что -то выполнимо. Если мы сможем получить владельцев плантаций на нашей стороне, мы должны быть в состоянии контролировать большинство провинций с плантациями, ставя нас вперед к Варгасу к тому времени, когда мы запустим наше восстание."
 BRA_mobilize_the_economy: "Мобилизовать экономику"
 BRA_mobilize_the_economy_desc: "Даже если наша экономика колеблется позже, нам нужно как можно больше военного производства, а теперь!"
 BRA_focus_on_military_expansion: "Сосредоточиться на военной экспансии"
 BRA_focus_on_military_expansion_desc: "С гражданской войной в полном разгаре, наша армия нуждается в массовом расширении, чтобы компенсировать нашу отсутствие чисел, особенно по сравнению с армией Варгаса."
 BRA_sieze_the_paulista_factories: "Захватить фабрики Паулиста"
 BRA_sieze_the_paulista_factories_desc: "Паулистас накопил довольно большую отрасль за их восстание, и теперь, когда они ушли, мы будем в полной мере воспользоваться этим."
 BRA_focus_on_supply_build_up: "Сосредоточьтесь на создании поставок"
 BRA_focus_on_supply_build_up_desc: "Поставка имеет решающее значение в нашей нынешней ситуации, и наличие преимуществ в центрах распределения предложения и поставок очень поможет нам в гражданской войне."
 BRA_emergency_railway_production: "Экстренная железная дорога"
 BRA_emergency_railway_production_desc: "Нам нужны железные дороги сразу! Наши линии снабжения исчерпаны, и мы должны как можно скорее доставить припасы в наши войска!"
 BRA_recruit_the_fascist_women: "Нанять фашистских женщин"
 BRA_recruit_the_fascist_women_desc: "Кто сказал, что женщины не могут служить в армии? Они могут быть такими же хорошими, как и люди на переднем крае, и нам нужен каждый солдат, о котором мы можем получить прямо сейчас!"
 BRA_integralism_shall_rule: "Интегрализм должен управлять"
 BRA_integralism_shall_rule_desc: "Интегрализм приведет эту нацию к величию! Наши идеалы поднимут эту страну до дальнейших высот, о которых никто даже не думал!"
 BRA_obliterate_the_paulista_uprising: "Уничтожить восстание Паулиста"
 BRA_obliterate_the_paulista_uprising_desc: "Паулистас серьезно думают, что они получат свою независимость? Ха, это хорошо. Мы позаботимся о том, чтобы они сожалели даже о чем -то подобном."
 BRA_force_the_paulistas_to_the_frontlines: "Принуждать Паулистас на передовые"
 BRA_force_the_paulistas_to_the_frontlines_desc: "С паулистами, которые сейчас занимаются, у нас есть их солдаты в качестве заключенных. Вместо того, чтобы оставлять их в трате в этих тюрьмах, мы должны заставить их сражаться на нашей стороне и помочь против других групп гражданской войны."
 BRA_garner_catholic_support: "Католическая поддержка Гарнера"
 BRA_garner_catholic_support_desc: "Интегрализм как идеология очень зависит от христианской веры и морали, поэтому убедить католическое население внутри страны присоединиться к нам, не будет сложно."
 BRA_the_warriors_of_christ: "Воины Христа"
 BRA_the_warriors_of_christ_desc: "Мы представляем святую веру, и мы будем теми, кто продемонстрирует миру, что единственная истинная вера и религия - христианство!"
 BRA_a_visit_to_the_past: "Посещение прошлого"
 BRA_a_visit_to_the_past_desc: "С тех пор, как отречение от императора и падения империи Бразилия только ухудшилась. Наши старые традиции были выплюнуты, наша экономика колебалась, и мир больше не уважает нас. Может быть, мы должны измениться, может быть, мы должны вернуть все это и еще раз продемонстрировать все истинную силу, какой мы есть! Давно жить королевской семьей!"
 BRA_rekindle_imperial_sentiments: "Возрождает имперские чувства"
 BRA_rekindle_imperial_sentiments_desc: "В Бразилии все еще много людей, которые хотят вернуться империей, и мы можем осуществить их мечты. Распространите слово! Каждый должен знать о нашем неизбежном возвращении!"
 BRA_o_imperador_do_brasil: "§Bo Imperador do brasil§!"
 BRA_o_imperador_do_brasil_desc: "Педро Энрике, член бразильской королевской семьи, и единственный, кто действительно способен привести эту нацию к величию. Он действительно заслуживает престола как короля империи Бразилии, и он будет тем, кто приведет нас к победе!"
 BRA_priority_to_the_royal_family: "Приоритет для королевской семьи"
 BRA_priority_to_the_royal_family_desc: "Королевская семья не заслуживает ничего, кроме предельного уважения и приоритета в империи. Это те, кто поддержат это и принесет его славе!"
 BRA_contact_the_portuguese: "Свяжитесь с португальцами"
 BRA_contact_the_portuguese_desc: "Португальцы могут на самом деле захоть помочь нам в нашей имперской реставрации, в конце концов, у них есть политические причины для этого. Все, что мы можем сделать сейчас, это подождать, пока они не примут."
 BRA_hidden_portuguese_weaponry: "Скрытое португальское оружие"
 BRA_hidden_portuguese_weaponry_desc: "Португальцы послали нам оружие в тайне, чтобы помочь нам в нашей гражданской войне. Нам нужно как можно больше воспользоваться преимуществами этого в наших усилиях по восстановлению!"
 BRA_portuguese_volunteers: "Португальские добровольцы"
 BRA_portuguese_volunteers_desc: "Получение португальских добровольцев даст нам огромное преимущество против наших врагов в наших усилиях по восстановлению. Давайте обязательно воспользуемся этим."
 BRA_discuss_potential_portuguese_intervention: "Обсудить потенциальное португальское вмешательство"
 BRA_discuss_potential_portuguese_intervention_desc: "Португальцы очень много помогали нам в течение последних нескольких месяцев, поэтому, возможно, пришло время предложить им окончательную помощь: полномасштабное военное вмешательство. Независимо от того, принимают ли они или нет, все еще готово к обсуждению, но с нашими нынешними обстоятельствами они, вероятно, примут."
 BRA_once_again_an_empire: "Еще раз империя"
 BRA_once_again_an_empire_desc: "После нескольких месяцев подготовки и установления всего мы можем безопасно объявить о возвращении империи Бразилии. Мир будет скручиваться в страхе, когда мы с легкостью топаем наших врагов!"
 BRA_learn_from_the_frontlines: "Учиться на переднем крае"
 BRA_learn_from_the_frontlines_desc: "По мере продвижения гражданской войны мы должны воспользоваться этой возможностью узнать о нашей борьбе и опыте, с которыми сталкиваются, и применить эти новые знания к нашим ополченцам, чтобы лучше соответствовать им для будущих битв."
 BRA_delay_the_democrats: "Задержать демократов"
 BRA_delay_the_democrats_desc: "Демократы планируют собственное восстание, и мы должны попытаться в наибольшей степени из нашей способности предотвратить это, по крайней мере, задерживая его."
 BRA_new_training_techniques: "Новые методы обучения"
 BRA_new_training_techniques_desc: "Нам нужно навязывать новые методы обучения, чтобы иметь более подготовленные ополченцы и получить преимущество в гражданской войне."
 BRA_ask_for_foreign_aid: "Попросить иностранную помощь"
 BRA_ask_for_foreign_aid_desc: "Есть много стран, которые будут готовы помочь нам в наших усилиях, так что давайте в полной мере воспользуемся этим!"
 BRA_everyone_to_war: "§REveryOne to War§!"
 BRA_everyone_to_war_desc: "Все на передовые! Нам нужен все, что мы можем получить! Эта война не будет выиграна сама по себе!"
 BRA_the_war_on_communism: "Война с коммунизмом"
 BRA_the_war_on_communism_desc: "Эти проклятые коммунисты действительно думают, что они будут успешными в своем маленьком восстании? Они будут сожалеть об этом!"
 BRA_establish_the_imperial_council: "Создать имперский совет"
 BRA_establish_the_imperial_council_desc: "В соответствии с этим, у нас нет много высокопоставленных офицеров, готовых руководить нашими войсками, поэтому вместо этого мы установим совет членов, выбранную вручную не кто-то иной, как королевская семья, чтобы привести этих смелых солдат к победе."
 BRA_imperial_economic_management: "Императорское экономическое управление"
 BRA_imperial_economic_management_desc: "Экономика рушится, когда мы говорим! Нам нужно исправить это и быстро, чтобы поддержать наших солдат в войне."
 BRA_the_voice_of_imperialism: "Голос империализма"
 BRA_the_voice_of_imperialism_desc: "Каждый услышат наши крики и проблемы, и они будут отвечать соответственно. Люди знают, что для них лучше! Наше восстание будет только сильнее с этого момента!"
 BRA_the_imperial_brazilian_army: "Имперская бразильская армия"
 BRA_the_imperial_brazilian_army_desc: "Наша армия должна много расширяться. Нам нужно выдержать армию, действительно заслуживающую титула «Имперская бразильская армия», и мы обязательно заставим ее достичь этой цели."
 BRA_the_push_to_victory: "Толчок к победе"
 BRA_the_push_to_victory_desc: "Конец близок, пришло время для одного последнего толчка, чтобы закончить все это. После этого наша империя, наконец, вернется в полную славу!"
 BRA_officialy_establish_the_empire: "Официально установить империю"
 BRA_officialy_establish_the_empire_desc: "После долгих боев и многих погибших жизней война наконец пришла к выводу, и мы вышли на вершину всех остальных. Каждый, кто погиб в этом конфликте, будет навсегда оплачивать, поскольку их жертвы составили большую причину восстановления империи."
 BRA_external_imperial_management: "Внешнее имперское управление"
 BRA_external_imperial_management_desc: "Внутренне империя довольно стабильна, по крайней мере, на данный момент, поэтому мы должны смотреть за пределы наших собственных границ и начать устанавливать политическое доминирование над нашими соседями."
 BRA_begin_preperations_for_the_uruguayan_occupation: "Препараты для восстановления цисплатина"
 BRA_begin_preperations_for_the_uruguayan_occupation_desc: "Уругвайцы, также называемые цисплатином, были частью нашей империи в далеком прошлом. Давайте сделаем эту реальность еще раз за шагом."
 BRA_spread_monarchism_in_uruguay: "Распространять монархизм в Уругвае"
 BRA_spread_monarchism_in_uruguay_desc: "Уругвайский народ должен узнать о преимуществах монархизма. Не только ради них, но и для нашей военной марионетки, которая будет установлена ​​там."
 BRA_coerce_the_uruguayans: "Приступить к уругвайцам"
 BRA_coerce_the_uruguayans_desc: "Уругвай должен быть хорошо осведомлен о неравенстве власти между обеими народами. Мы здесь лучшие собаки, и они будут хорошо осведомлены об этом достаточно скоро."
 BRA_win_the_second_cisplatine_war: "Выиграть вторую цисплатиновую войну"
 BRA_win_the_second_cisplatine_war_desc: "Аргентина вмешалась в этот конфликт, что все еще шокирует нас по сей день. Но, увы, мы позаботимся о том, чтобы они полностью сожалели об этом решении о вечности."
 BRA_the_imperial_integration_campaign: "Кампания имперской интеграции"
 BRA_the_imperial_integration_campaign_desc: "Наши завоеванные земли должны быть ассимилированы в империю. Это будет медленный процесс, но в конце концов все будут интегрированы в нашу славную империю."
 BRA_promote_ultra_nationalism: "Продвигать ультранационализм"
 BRA_promote_ultra_nationalism_desc: "Бразильцы должны гордиться своей нацией, они должны хорошо знать, насколько это здорово! Каждый должен гордиться своей национальностью, несмотря ни на что."
 BRA_the_march_to_buenos_aires: "Марш в Буэнос -Айрес"
 BRA_the_march_to_buenos_aires_desc: "Буэнос -Айрес, столица и самый важный город Аргентина, прозвали «Париж Южной Америки». Не секрет, что город чрезвычайно важен для аргентинцев, поэтому принятие его обеспечит нашу победу."
 BRA_form_jungle_regiments: "Форма джунглей полков"
 BRA_form_jungle_regiments_desc: "На нашем севере у нас есть бесконечный тропический лес Amazon. Переход этой земли чрезвычайно трудно даже для самых опытных солдат. Полки джунглей, специализируемые на этой территории, будут сформированы для борьбы с этим."
 BRA_push_through_the_north: "Протолкнуть через север"
 BRA_push_through_the_north_desc: "Колумбия и Венесуэла находятся в нашем пути величия. Нам нужно немедленно вытащить их. Они вызывали проблемы с империей в прошлом, и теперь мы отомстим."
 BRA_the_european_theater: "Европейский театр"
 BRA_the_european_theater_desc: "Пришло время сделать то, что европейцы никогда бы не догадались. Мы установим наше влияние в Европе и продемонстрируем, кто сейчас отвечает!"
 BRA_total_imperial_success: "Полный имперский успех"
 BRA_total_imperial_success_desc: "Мы достигли нашего абсолютного максимального успеха. Мы достигли всего, что мы когда -либо хотели, и многое другое. Можно с уверенностью сказать, что мы можем официально классифицировать себя как очень успешную империю."
 BRA_alliance_with_the_portuguese: "Альянс с португальскими"
 BRA_alliance_with_the_portuguese_desc: "Португальцы так много помогли нам в нашей недавней истории, что пришло время превратить наше сотрудничество во что -то официальное. Давайте предложим им союз и станем более сильнее вместе."
 BRA_master_mountain_warfare: "Мастер горная война"
 BRA_master_mountain_warfare_desc: "С Андами, покрывающими большую часть континента, очень важно, чтобы мы учимся и понимаем горную войну, чтобы иметь возможность победить наших врагов на этих местах."
 BRA_decimate_chile: "Древесный Чили"
 BRA_decimate_chile_desc: "Чилии не имеют шанса против нашей могучей армии. Они упадут в кратчайшие сроки!"
 BRA_take_out_peru: "Наше право на Анды"
 BRA_take_out_peru_desc: "Там нет остановки великой имперской мощи Бразилии!"
 BRA_set_our_eyes_on_africa: "Посмотрите на Африку"
 BRA_set_our_eyes_on_africa_desc: "Европейцы думают, что у них есть монополия на Африку, но мы изменим это очень скоро. Они не будут ожидать ничего."
 BRA_integrate_liberia_into_the_empire: "Интегрировать Либерию в империю"
 BRA_integrate_liberia_into_the_empire_desc: "Мы успешно победили Либерию, и мы немного контролировали их. Пришло время интегрировать их в империю."
 BRA_establish_liberia_as_a_dominion: "Установить Либерию как владычество"
 BRA_establish_liberia_as_a_dominion_desc: "В то время как мы завоевали Либерию и в настоящее время контролируем ее, было бы лучше сохранить их как владычество и позволить местному правительству взять под контроль нацию."
 BRA_build_up_in_liberia: "Нарастать в Либерии"
 BRA_build_up_in_liberia_desc: "Либерия не совсем наиболее развитое место на планете, поэтому давайте поможем им в этом."
 BRA_expand_beyond_south_america: "Расширяться за пределы Южной Америки"
 BRA_expand_beyond_south_america_desc: "Наша слава ждет за пределами этого континента. Пришло время достичь этой славы."
 BRA_conquer_central_america: "Завоевать Центральную Америку"
 BRA_conquer_central_america_desc: "Центральная Америка - это просто препятствие на пути нашей славы, и они сразу же будут раздавлены."
 BRA_conquer_north_america: "Захватить Северную Америку"
 BRA_conquer_north_america_desc: "Северная Америка скоро будет завоевана нашими силами мощи, нравится им это или нет!"
 BRA_push_through_paraguay: "Протолкнуть через Парагвай"
 BRA_push_through_paraguay_desc: "Мы можем протолкнуть Парагвай, чтобы быстрее победить Аргентину. Мы должны рискнуть и нанести удар сейчас!"
 BRA_imperial_buildup_in_conquered_lands: "Императорский нарастание в завоеванных землях"
 BRA_imperial_buildup_in_conquered_lands_desc: "Наши завоеванные земли не строится должным образом. В нашу вечно выражающую отрасль мы расширим свою индустрию вооружений в этих завоеванных землях."
 BRA_imprison_pedro_gastao: "В тюрьму Педро Гастао"
 BRA_imprison_pedro_gastao_desc: "Гастао пытается претендовать на престол от Педро Энрике, что -то неприемлемое! Он должен быть помещен в тюрьму немедленно за это возмутительное поведение!"
 BRA_offer_pedro_a_cabinet_seat: "Предложить Педро место правительства"
 BRA_offer_pedro_a_cabinet_seat_desc: "Гастао на самом деле может быть эффективным политическим советником. Мы должны увидеть, как он справедливо в правительстве."
 BRA_internal_imperial_management: "Внутреннее имперское управление"
 BRA_internal_imperial_management_desc: "Прежде чем мы сможем посмотреть наружу, нам нужно сосредоточиться на нашей внутренней политике. Сначала мы должны быть стабильными, прежде чем мы сможем сосредоточиться на политических действиях за пределами наших границ."
 BRA_invest_in_the_imperial_army: "Инвестировать в имперскую армию"
 BRA_invest_in_the_imperial_army_desc: "Имперская армия нуждается в дальнейших инвестициях. Нам нужно улучшить его как можно больше."
 BRA_support_the_economy: "Поддерживать экономику"
 BRA_support_the_economy_desc: "Наша экономика все еще не так хороша, как может быть. Мы можем улучшить это, и мы сделаем именно это."
 BRA_take_advantage_of_the_imperial_scholars: "Воспользоваться имперскими учеными"
 BRA_take_advantage_of_the_imperial_scholars_desc: "В нашей стране много ученых. Мы должны воспользоваться их расширенным интеллектом и использовать его для наших собственных исследовательских амбиций."
 BRA_propose_unification_with_portugal: "Предложить объединение с Португалией"
 BRA_propose_unification_with_portugal_desc: "Португалия так много помогла нам в гражданской войне, что мы должны предложить с ними объединение. В конце концов, мы братья, все, что осталось, - это еще больше укрепить наше братство."
 BRA_stabilizing_our_politics: "Стабилизируя нашу политику"
 BRA_stabilizing_our_politics_desc: "С нашим довольно недавним объединением наша политика была по всему дворцу. Нам нужно время, чтобы стабилизировать нашу политику."
 BRA_the_portuguese_brasilero_army: "Португальская армия Бразилеро"
 BRA_the_portuguese_brasilero_army_desc: "Время официально объединить наши армии. Они будут сильнее вместе!"
 BRA_take_out_spain: "Убери Испанию"
 BRA_take_out_spain_desc: "Испания стоит на нашем пути величия. Они подвергали риску суверенитет Португалии, поэтому пришло время отомстить за это."
 BRA_target_france: "Претендовать на французский трон"
 BRA_target_france_desc: "Бразильская королевская семья всегда имела значительные связи с французским престолом, учитывая, что большая часть семьи происходит из Франции и прожила большую часть своей жизни во Франции. Имея это в виду, у нас есть претензии по легитамату над престолом, и что они будут хорошо осведомлены!"
 BRA_target_colonial_france: "Вывести колониальную Францию"
 BRA_target_colonial_france_desc: "Колонии Франции заполнены ресурсами. Мы должны вытащить их и воспользоваться естественными преимуществами."
 BRA_african_buildup: "Африканский наращивание"
 BRA_african_buildup_desc: "Африка не так развита, как другие части планеты, но, по крайней мере, в тех частях, которые мы контролируем, мы можем изменить это в лучшую сторону."
 BRA_integrate_galicia: "Интегрировать Галисию"
 BRA_integrate_galicia_desc: "Галисия всегда была неотъемлемой частью Португалии. Пришло время официально сделать это частью нашей империи."
 BRA_combine_the_industries: "Объединить отрасли"
 BRA_combine_the_industries_desc: "Промышленность колебалась с момента нашего объединения из -за неправильного управления. Нам нужно объединить их, чтобы заставить их функционировать должным образом."
 BRA_deal_with_the_nationalists: "Иметь дело с националистами"
 BRA_deal_with_the_nationalists_desc: "Националисты попадают в наш нерв. Давайте разберемся с ними и быстро, прежде чем они вызовут скандал."
 BRA_a_new_brazilian_era: "Новая бразильская эпоха"
 BRA_a_new_brazilian_era_desc: "Пришло время для мира снова уважать нас. Никто больше не сможет на нас смотреть свысока. Они будут бояться этой новой Бразилии, которую мы создадим, вместе!"
 BRA_re_establish_a_police_force: "Восстановить полицейские силы"
 BRA_re_establish_a_police_force_desc: "Полицейские силы очень помогли Варгасу во время его тирании. Может быть, мы могли бы научиться чему -то из этого."
 BRA_political_censorship: "Политическая цензура"
 BRA_political_censorship_desc: "В стране еще много людей, которые не согласны с нашими идеалами. Мы должны убедиться, что они понимают, что мы сейчас лидеры."
 BRA_dealing_with_the_post_civil_war_crisis: "Иметь дело с кризисом гражданской войны"
 BRA_dealing_with_the_post_civil_war_crisis_desc: "Наша экономика рухнула с тех пор, как началась гражданская война, и теперь, когда гражданская война наконец закончилась, мы действительно чувствуем ее влияние. Нам нужно инвестировать как можно больше времени, чтобы исправить это."
 BRA_rebuild_the_destroyed_roads: "Восстановить разрушенные дороги"
 BRA_rebuild_the_destroyed_roads_desc: "Гражданская война уничтожила многие национальные дороги. Давайте восстановим их и сделаем их лучше, чем когда -либо."
 BRA_expand_our_school_system: "Расширить нашу школьную систему"
 BRA_expand_our_school_system_desc: "Дети в нашей великой стране должны учиться, и им нужно превзойти всех остальных. Мы можем быть успешной страной только в том случае, если наше молодое население будет должным образом образовано."
 BRA_eliminate_the_resistance_movements: "Устранить движения сопротивления"
 BRA_eliminate_the_resistance_movements_desc: "Движения сопротивления длились слишком долго. Пришло время наконец положить гвоздь в гроб на нашу гражданскую войну."
 BRA_nationalize_our_industry: "Национализируйте нашу отрасль"
 BRA_nationalize_our_industry_desc: "Индустрия сейчас не так горячо. Возможно, национализируя это, мы можем полностью сосредоточиться на развитии экономики и улучшении ее без иностранного вмешательства."
 BRA_invite_the_best_economists: "Пригласить корпоратистов -экономистов"
 BRA_invite_the_best_economists_desc: "С точной экономикой нам нужно будет полагаться только на лучшие из лучших. Лучшие экономисты мира будут знать, что делать и как исправить нашу ситуацию."
 BRA_learn_from_the_economists: "Учиться у экономистов"
 BRA_learn_from_the_economists_desc: "Мы должны вернуть домой некоторые из того, что нас учат экономисты. Мы могли бы использовать его позже."
 BRA_establish_autarky: "Установить Autarky"
 BRA_establish_autarky_desc: "Бразильские ресурсы для бразильцев и только бразильцев!"
 BRA_the_brazilian_economic_miracle: "Бразильское экономическое чудо"
 BRA_the_brazilian_economic_miracle_desc: "После многих реформ мы достигли состояния постоянного экономического роста. Многие по всему миру уже называли эту экономическую фазу нашего «бразильского экономического чуда», чем мы действительно можем гордиться."
 BRA_promote_immigration_fash: "Продвигать иммиграцию"
 BRA_promote_immigration_fash_desc: "Иммиграция - это нечто очень важное, а не только в нашей стране в каждой стране. Получение новых людей со всего мира, чтобы помочь вашей стране и улучшить ее. Это только одно из многих преимуществ иностранной иммиграции."
 BRA_secure_brazil_completely: "Полностью защитить Бразилию"
 BRA_secure_brazil_completely_desc: "Теперь мы можем полностью защитить Бразилию. Большинство движений сопротивления были подавлены, и наши политические противники были уничтожены. Время официально начать новую эру бразильской истории."
 BRA_spread_the_fascist_movement_peacefully: "Распространять фашистское движение мирно"
 BRA_spread_the_fascist_movement_peacefully_desc: "Мы не должны тратить наши драгоценные ресурсы и солдат на вторжения, вместо этого мы должны распространять слово фашизма всем вокруг нас. Люди скоро узнают, насколько это хорошо."
 BRA_join_the_axis: "Присоединяйтесь к оси"
 BRA_join_the_axis_desc: "Ось является единственной фракцией на планете, которая действительно обладает силой и должным образом представляет наши идеалы. Мы можем использовать это в нашу пользу и присоединиться к их стороне, поддерживая их в их деле."
 BRA_study_the_german_blitzkrieg: "Изучить немецкий блицкриг"
 BRA_study_the_german_blitzkrieg_desc: "У немцев есть тактика, известная как «Блицкриг», что -то очень мощное, которое использовалось для чрезвычайно быстрого устранения многих стран. Может быть, мы должны учиться у них и сделать то же самое."
 BRA_help_out_the_germans: "Помогать немцам"
 BRA_help_out_the_germans_desc: "Немцы нуждаются в большей помощи, и мы будем теми, кто раздаст кредитную руку. Независимо от того, что, мы не проиграем!"
 BRA_invite_german_architects_focus: "Пригласить немецких архитекторов"
 BRA_invite_german_architects_focus_desc: "Немецкие архитекторы являются одними из лучших в мире. Привлечение некоторых в нашу собственную нацию, чтобы помочь в разработке дорог и сооружений, не принесет большого вреда."
 BRA_create_our_own_faction: "Создать свою собственную фракцию"
 BRA_create_our_own_faction_desc: "Нам будет лучше самостоятельно. Нам никому не нужна помощь, вместо этого это должно быть другим, нуждающейся в нашей помощи. Вот почему мы будем лидерами нашей собственной фракции."
 BRA_mutual_agreement_with_argentina: "Взаимное согласие с Аргентиной"
 BRA_mutual_agreement_with_argentina_desc: "Аргентина настроена на защиту Уругвая, несмотря ни на что, но, возможно, мы могли бы убедить их присоединиться к нашей стороне. С небольшим разговором мы могли бы прийти к какой -то форме соглашения."
 BRA_claim_and_conquer_uruguay: "Претензия и победить Уругвай"
 BRA_claim_and_conquer_uruguay_desc: "Время повторно интегрировать Уругвай в нашу страну. Цисплатин будет нашим еще раз!"
 BRA_invite_the_fascist_powers: "Пригласить фашистские силы"
 BRA_invite_the_fascist_powers_desc: "Наша фракция может выиграть от большего количества участников. Давайте пригласим другие фашистские страны поблизости и посмотрим, хотят ли они присоединиться."
 BRA_join_military_training: "Совместная военная подготовка"
 BRA_join_military_training_desc: "Наши армии самостоятельно в порядке, но вместе они могут стать неудержимыми!"
 BRA_let_our_allies_use_our_currency: "Пусть наши союзники используют нашу валюту"
 BRA_let_our_allies_use_our_currency_desc: "Если мы все используем одну и ту же валюту, то все наши экономики могут расти одновременно. Это принесет пользу каждому из нас одинаково."
 BRA_attack_paraguay: "Атаковать Парагвай"
 BRA_attack_paraguay_desc: "Paraguay - не что иное, как простой препятствие. Мы будем иметь дело с ними быстро."
 BRA_integrate_paraguay: "Интегрировать парагвай"
 BRA_integrate_paraguay_desc: "Теперь, когда Парагвай справился, мы можем интегрировать их и их население в нашу страну."
 BRA_expand_aggresively: "Расширить агрессивно"
 BRA_expand_aggresively_desc: "Мир узнает о нашей истинной силе, и единственный способ сделать это с силой. Каждый будет сжиматься в страхе, когда они видят мощь нашей армии."
 BRA_rapid_army_expansion: "Быстрое расширение армии"
 BRA_rapid_army_expansion_desc: "Нам понадобится масштабная армия, чтобы победить против наших врагов. Вот почему мы расширим его как можно скорее."
 BRA_military_build_up_in_our_conquered_lands: "Военные нарастают в наших завоеванных землях"
 BRA_military_build_up_in_our_conquered_lands_desc: "Наши завоеванные земли довольно недостаточно развиты. Давайте изменим это."
 BRA_look_north: "Посмотрите на север"
 BRA_look_north_desc: "Страны на севере не так сильны. Мы должны быть в состоянии справиться с ними довольно легко."
 BRA_expand_the_venezuelan_oil_fields: "Расширить венесуэльские нефтяные месторождения"
 BRA_expand_the_venezuelan_oil_fields_desc: "Венесуэла чрезвычайно богата нефтью. Мы могли бы извлечь из этого значимость извлечь выгоду из этого и даже расширить некоторые из их нефтяных месторождений с помощью нашей технологии."
 BRA_expand_beyond_central_america: "Расширяться за пределы Южной Америки"
 BRA_expand_beyond_central_america_desc: "Центральная Америка стоит на нашем пути славы. Никто не пойдет на нашем пути!"
 BRA_hit_right_where_it_hurts: "Хит прямо там, где больно"
 BRA_hit_right_where_it_hurts_desc: "США, хорошо известная как сверхдержава Америки. Это, однако, скоро изменится с нами. Они не увидят наше вторжение!"
 BRA_look_south: "Посмотрите на юг"
 BRA_look_south_desc: "Юг богат многими вещами: ресурсы, промышленность, технология, вы называете его. Мы могли бы извлечь большую пользу от всего этого и многого другого, поэтому мы должны подготовиться к их завоеванию."
 BRA_develop_uruguay: "Развивать Уругвай"
 BRA_develop_uruguay_desc: "Уругвай не так развит, как наша страна, поэтому давайте используем нашу экономику для улучшения своей земли и пожимают выгоды."
 BRA_integrate_uruguay_integralist: "Интегрировать Уругвай"
 BRA_integrate_uruguay_integralist_desc: "Время полностью интегрировать Уругвай и его людей в нашу вечнознашивающую страну."
 BRA_kick_out_the_europeans: "Выкинуть европейцев"
 BRA_kick_out_the_europeans_desc: "Европейцы не имеют права оставаться на нашем континенте. Это место - наш дом, и мы позаботимся о том, чтобы они это понимали."
 BRA_desperate_naval_modernization: "Отчаянная военно -морская модернизация"
 BRA_desperate_naval_modernization_desc: "Наш военно -морской флот далеко не находится на уровне европейских стандартов. Мы должны инвестировать в нашем флота и улучшить наши военно -морские технологии, чтобы хотя бы достичь боевых возможностей."
 BRA_dockyard_investments: "Внешний двор инвестиции"
 BRA_dockyard_investments_desc: "Чем больше верфи, тем больше кораблей мы можем производить, и тем больше станет нашим флотом. Это базовая математика; 2+2 = 4."
 BRA_focus_our_efforts_against_the_european_powers: "Усилия против европейских держав"
 BRA_focus_our_efforts_against_the_european_powers_desc: "Все наше внимание должно быть сосредоточено на европейских энергетических домах. Они находятся в лигах впереди отраслей Южной Америки, и их методы борьбы сильно отличаются от того, что здесь найдены."
 BRA_switch_the_theater: "Переключить театр"
 BRA_switch_the_theater_desc: "Давайте смущаем всех. Время открыть еще один фронт ... в Африке. Они не увидят это, и оттуда у нас может быть прочная база, чтобы прямо вторгаться на европейскую родину."
 BRA_build_up_liberia: "Создание Либерии"
 BRA_build_up_liberia_desc: "Если мы хотим использовать Либерию в качестве постановки для вторжений, нам нужно будет разработать ее, чтобы иметь возможность поддерживать сотни тысяч мужчин и женщин."
 BRA_establish_camel_corps: "Установить верблюда Корпс"
 BRA_establish_camel_corps_desc: "Теперь, когда мы занимаемся враждебной местностью, такой как пустыня Сахара, мы должны научиться использовать верблюдов, чтобы пройти и сражаться в этой местности более эффективно."
 BRA_conquer_the_african_continent: "Победить африканский континент"
 BRA_conquer_the_african_continent_desc: "Время продемонстрировать миру, что мы не проживание. Африканский континент скоро будет под нашими руками, чего они наверняка никогда не ожидают."
 BRA_the_path_to_estado_novo: "Путь к эстадо Ново"
 BRA_the_path_to_estado_novo_desc: "Коммунизм и фашизм просто не подходят для Бразилии. Что нужен бразильцам, так это тот, кто может править железным кулаком и привести свою страну к величию, и единственный способен к этому, это Варгас."
 BRA_solidify_control_over_the_state: "Затвердевать контроль над состоянием"
 BRA_solidify_control_over_the_state_desc: "Нынешний политический ландшафт очень разнообразен. Нам нужно начать устанавливать политическое доминирование над всеми, если мы хотим должным образом создать эстадо Ново."
 BRA_build_the_national_museum_of_fine_arts: "Построить музей изящных искусств"
 BRA_build_the_national_museum_of_fine_arts_desc: "Museu Nacional de Belas Artes - это Национальный художественный музей, расположенный в городе Рио -де -Жанейро, Бразилия. Музей, официально созданный в 1937 году инициативой министра образования Густаво Капанемема, был открыт в 1938 году президентом Гетулио Варгасом. Люди должны учиться и в полной мере понимать бразильскую культуру и ее значение."
 BRA_invest_in_the_education: "Инвестировать в образование"
 BRA_invest_in_the_education_desc: "Молодежь должна быть должным образом образована, если мы хотим расти как нация. Наш низкий уровень грамотности убивает наш прогресс, и это больше не может длиться."
 BRA_establish_a_minimum_wage: "Установить минимальную заработную плату"
 BRA_establish_a_minimum_wage_desc: "Бразильцы должны иметь как минимум минимальную заработную плату, достаточно большую, чтобы жить и прогрессировать. Как великий лидер этой нации, мы дадим людям то, что им нужно."
 BRA_political_cooperation_with_plinio: "Позвольте интегралистам остаться"
 BRA_political_cooperation_with_plinio_desc: "Вместо того, чтобы создавать врагов, мы должны сформировать политические альянсы с теми, кого мы когда -то считали «врагами». Таким образом, люди и только люди получают пользу, стабилизируя страну в прогрессе."
 BRA_cut_back_on_our_censorship: "Сократить нашу цензуру"
 BRA_cut_back_on_our_censorship_desc: "Может быть, Estado novo - это не то, что нужно. Может быть, это не то, что принесет пользу людям больше всего. Вместо этого мы должны позволить людям свободно думать и сократить нашу цензуру."
 BRA_an_era_of_democracy: "Эпоха демократии"
 BRA_an_era_of_democracy_desc: "Демократия - единственная правая идеология. Люди должны быть в состоянии говорить и думать свободно, и это то, что мы будем представлять."
 BRA_convince_washington_to_come_back: "Убедить Вашингтон вернуться"
 BRA_convince_washington_to_come_back_desc: "Вашингтон Луис был для нас отличным лидером. Кто -то, кто действительно заботился о нации, и мы должны сделать все возможное, чтобы убедить его вернуться в эту страну."
 BRA_empower_the_congress: "Расширить возможности Конгресса"
 BRA_empower_the_congress_desc: "Конгресс - это то, что определяет свободу слова. Люди выбирают там всех делегатов, и Конгресс в целом должен быть сущностью, чтобы иметь максимальную власть в стране."
 BRA_freedom_of_the_press: "свобода слова"
 BRA_freedom_of_the_press_desc: "Больше нет цензуры. Это прошлое и только прошлое. Будущее Бразилии является демократическим, и которое будет представлять людей."
 BRA_a_free_brazil: "свободная Бразилия"
 BRA_a_free_brazil_desc: "Результаты выборов вернулись, и это официально. Демократическая партия победила, и люди выбрали. Пусть наше будущее будет таким же ярким."
 BRA_empower_the_social_democrats: "Расширить возможности социал -демократов"
 BRA_empower_the_social_democrats_desc: "Мы должны связать некоторые социалистические идеалы в нашей стране. Доказано, что они помогают странам в промышленности, так почему бы нам не воспользоваться этим?"
 BRA_follow_liberal_ideals: "Следуйте либеральным идеалам"
 BRA_follow_liberal_ideals_desc: "Либерализм - это то, что позволило великим народам, таким как Великобритания и США вырасти до того размера и власти, которыми они сейчас являются. Мы должны идти по их стопам, чтобы стать такими же, как они."
 BRA_promote_free_speech: "свобода слова"
 BRA_promote_free_speech_desc: "свобода слова"
 BRA_end_the_political_crisis: "Положить конец политическому кризису"
 BRA_end_the_political_crisis_desc: "Политический кризис, который нас мучил в течение многих лет, больше не будет. Мы наконец примем меры, чтобы полностью искоренить его."
 BRA_open_our_markets: "Откройте наши рынки"
 BRA_open_our_markets_desc: "Все открыты, чтобы купить наши ресурсы. Мы не только улучшаем наши отношения с другими странами, но и развиваем нашу отрасль."
 BRA_strengthen_our_foreign_investments: "Укреплять наши иностранные инвестиции"
 BRA_strengthen_our_foreign_investments_desc: "Иностранные инвестиции являются лучшим и наиболее эффективным способом развития нашей экономики, и мы должны сделать это просто, чтобы улучшить свою собственную."
 BRA_let_the_people_choose_the_leader: "Пусть люди выберут лидера"
 BRA_let_the_people_choose_the_leader_desc: "Люди должны быть теми, кто выбирает, к кому они хотят их руководить. Никто, кроме людей, не должен быть в состоянии решить такую ​​вещь."
 BRA_the_congress_shall_lead: "Конгресс возглавит"
 BRA_the_congress_shall_lead_desc: "Конгресс - наш лучший выбор для эффективного «лидера». Вместо того, чтобы иметь человека, у нас должна быть сущность, ведущая нашу нацию к величию."
 BRA_focus_on_south_america: "Сосредоточьтесь на Южной Америке"
 BRA_focus_on_south_america_desc: "Южная Америка должна быть нашим основным направлением на данный момент. Мы должны убедиться, что наши соседи не пошли темными путями."
 BRA_spread_democracy_to_those_around_us: "Распространять демократию среди окружающих"
 BRA_spread_democracy_to_those_around_us_desc: "Наши соседи и их популяция должны понимать, что они подвергаются риску того, чтобы их поставили под экстремистский правитель. Демократия - это их спасительная благодать, и каждый должен это осознать."
 BRA_formalize_the_mercosur: "Формализуйте Mercosur"
 BRA_formalize_the_mercosur_desc: "Время установить надлежащий военный альянс, чтобы не только защитить себя, но и окружающих."
 BRA_establish_a_universal_central_bank: "Создать универсальный центральный банк"
 BRA_establish_a_universal_central_bank_desc: "Все наши экономики могут расти одновременно, если мы все разделяем один и тот же основной центральный банк."
 BRA_mutual_military_buildup: "Взаимное военное накопление"
 BRA_mutual_military_buildup_desc: "Наши военные в совокупности станут непреодолимой силой, способной носить волны демократии в 7 морях."
 BRA_demand_democratic_referendums: "Требуют демократических референдума"
 BRA_demand_democratic_referendums_desc: "Пришло время начать использовать наше влияние на регион навсегда. Мы должны убедиться, что эти экстремистские нации учатся на своих ошибках и отбрасывали такие вредные идеалы."
 BRA_support_the_newly_established_democracies: "Поддерживать недавно созданные демократии"
 BRA_support_the_newly_established_democracies_desc: "Теперь, когда мы смогли установить демократии в некоторых из этих стран, нам нужно будет как можно больше поддержать их."
 BRA_look_beyond_south_america: "Посмотри за Южную Америку"
 BRA_look_beyond_south_america_desc: "Нам нужно расширить наше влияние за пределы только нашего континента. Фашизм и коммунизм быстро растут, и мы должны быть противовесом."
 BRA_estabalish_the_united_states_of_brazil: "Создать Соединенные Штаты Бразилии"
 BRA_estabalish_the_united_states_of_brazil_desc: "Очень недолгое имя и флаг после роспуска Империи в 1889 году Соединенные Штаты Бразилии изначально собирались следовать по пути, очень похожему на путь Соединенных Штатов. Мы все еще не поздно исправить наши ошибки и повторно запустить, где мы остановились."
 BRA_cooperation_with_the_west: "Сотрудничество с западом"
 BRA_cooperation_with_the_west_desc: "Запад - это путь. Они являются истинными представителями демократии, и имеющие тесные связи с ними принесут пользу только нам."
 BRA_purchase_portuguese_colonies: "Покупать португальские колонии"
 BRA_purchase_portuguese_colonies_desc: "Благодаря обильным ресурсам в Африке европейские колонии определенно захватывают наш интерес, особенно Португалия. С нашими хорошими связями и надежной экономикой мы могли бы купить их у них."
 BRA_volunteers_to_the_allies: "Волонтеры союзников"
 BRA_volunteers_to_the_allies_desc: "Союзники оказались в очень серьезной ситуации. Война не кажется, что скоро закончится, поэтому давайте поможем им столько, сколько сможем."
 BRA_economic_cooperation: "Экономическое сотрудничество"
 BRA_economic_cooperation_desc: "Мы будем расширять наши экономики вместе и стать промышленной мощью вместе с европейскими державами."
 BRA_purchase_the_guyanas: "Купить Гайаны"
 BRA_purchase_the_guyanas_desc: "С ситуацией в Европе и нашими дружелюбными связями с Западом мы сможем купить у них гайана. Посмотрим, как они отвечают."
 BRA_resource_rights_for_the_allies: "Права ресурсов для союзников"
 BRA_resource_rights_for_the_allies_desc: "Союзники, вероятно, работают с ресурсами. Возможно, в качестве еще одного способа выразить нашу благодарность, мы могли бы позволить им использовать некоторые из наших ресурсов."
 BRA_develop_the_guyanas: "Развивайте Гайана"
 BRA_develop_the_guyanas_desc: "Европейцы не были лучших рабочих мест, чтобы сохранить Гайаны на том же уровне, что и Европа, но мы можем изменить это теперь, когда мы отвечаем за них."
 BRA_officially_join_the_allies: "Официально присоединиться к союзникам"
 BRA_officially_join_the_allies_desc: "Пришло время сделать его официальным миром на нашей должности в глобальной политике: мы представляем демократию и военные усилия союзников!"
 BRA_purchase_allied_ships: "Учиться у британского флота"
 BRA_purchase_allied_ships_desc: "Британский флот и его история являются одним из самых важных и обширных во всем человечестве. Обучение у такого флота очень поможет нам."
 BRA_war_on_communism: "Война с коммунизмом"
 BRA_war_on_communism_desc: "Коммунизм - это болезнь в этом мире, от которой мы должны немедленно избавиться!"
 BRA_war_on_fascism: "Война с фашизмом"
 BRA_war_on_fascism_desc: "Фашизм - это болезнь в этом мире, которую нужно искоренить как можно скорее."
 BRA_peace_at_last: "Мир наконец"
 BRA_peace_at_last_desc: "После многих лет боевых действий и политического давления официально нет экстремистских идеалов во всей Южной Америке. Мы сделали это, наконец,."
 BRA_unite_hispanoamerica: "Unite LatinoAmerica"
 BRA_unite_hispanoamerica_desc: "Вместо того, чтобы быть разделенными как отдельные организации, мы должны быть объединены под одним баннером и именем. Все будут должным образом представлены, и мир скоро узнает о нашей комбинированной власти!"
 BRA_welfare_to_the_farmers: "Благосостояние фермеров"
 BRA_welfare_to_the_farmers_desc: "Фермеры всегда поддерживали нашу экономику с момента создания этой страны. Пришло время вернуть им то, что они по праву заслуживают."
 BRA_spread_the_word: "Распространить слово"
 BRA_spread_the_word_desc: "Наши идеалы должны быть услышаны по всей стране. День выборов становится все ближе и ближе, и мы должны убедиться, что люди голосуют за нас."
 BRA_ask_aid_from_the_royal_family: "Спрашивать помощь королевской семьи"
 BRA_ask_aid_from_the_royal_family_desc: "Королевская семья может помочь нам в наших стремлениях победить на выборах."
 BRA_cooperate_with_plinio: "Сотрудничать с Плинио"
 BRA_cooperate_with_plinio_desc: "Время сделать наш политический альянс, мы больше не будем врагами. Вместо этого мы будем поддерживать и сотрудничать, зайдя так далеко, что оказали помощь Плинио и его движению."
 BRA_increase_our_influence: "Увеличить наше влияние"
 BRA_increase_our_influence_desc: "Люди должны узнать о величии интегрализма, и единственный способ, которым они это сделают, - это усиление нашего влияния на нацию."
 BRA_convince_government_officials: "Убедить правительственных чиновников"
 BRA_convince_government_officials_desc: "Политики в рамках правительства все еще в основном против нашего движения. Нам нужно попытаться убедить хотя бы некоторых перевернуть новый лист и понять, что мы не зло, которым мы изображаем."
 BRA_cooperation_with_the_church: "Сотрудничество с церковью"
 BRA_cooperation_with_the_church_desc: "Наша идеология связана с католицизмом и католической церковью, поэтому очевидно, что мы попытаемся сотрудничать с католической церковью."
 BRA_victory_at_the_elections: "Победа на выборах"
 BRA_victory_at_the_elections_desc: "День выборов прошел, и голоса были подсчитаны. Это официально, мы завоевали сердца достаточно бразильцев, чтобы они выбрали нас в качестве своих новых лидеров. Мы не будем разочаровывать никого и оправдать все ожидания."
 BRA_political_censorship_vargas: "Политическая цензура"
 BRA_political_censorship_vargas_desc: "Наши политические враги мешают нашему пути славы. Есть только один способ справиться с этими незначительными неудобствами."
 BRA_the_war_on_communism_vargas: "Война с коммунизмом"
 BRA_the_war_on_communism_vargas_desc: "С тех пор, как коммунистическое восстание в 1935 году коммунисты представляли серьезную угрозу для целостности этой страны. Пришло время, наконец, раз и навсегда раз и навсегда."
 BRA_disband_various_communist_poltiicans: "Распаковать различные коммунистические политики"
 BRA_disband_various_communist_poltiicans_desc: "Если мы хотим по -настоящему поразить коммунистов, где это больно, нам нужно справиться с их политической властью в правительстве. Хотя эти действия не будут встречены добрыми глазами, мы должны сделать это, если мы хотим выиграть эту войну против коммунизма."
 BRA_spread_anti_communist_propaganda: "Распространение антикоммунистической пропаганды"
 BRA_spread_anti_communist_propaganda_desc: "Люди должны знать, насколько ужасен коммунизм, особенно фермеры и люди в нижнем классе!"
 BRA_imprison_prestes: "Тюремные предварительные предыдущие"
 BRA_imprison_prestes_desc: "Коммунисты были достаточно ослаблены, все, что осталось, - это поместить последний гвоздь в гроб. Лихве предварительного заключения будет хорошо и по -настоящему закрыть Коммунистическую партию и заставит ее сторонников бороться за прочную базу."
 BRA_censor_the_integralists: "Цензура интегралистов"
 BRA_censor_the_integralists_desc: "Интегралисты серьезно думали, что мы будем прислушиваться к их требованиям? Pfft, какая больная, извращенная, шутка. Как будто мы когда -нибудь слушаем эти дикари. Они узнают, что трудный путь достаточно скоро."
 BRA_preperations_for_the_self_coup: "Подготовка к самоотранту"
 BRA_preperations_for_the_self_coup_desc: "Если мы хотим полностью вступить во владение, нам нужно будет пройти переворот. Это, однако, не будет регулярным переворотом, а скорее «самостоятельно». Мы переведем себя и ставят себя в качестве диктаторов страны, решением железного кулака."
 BRA_shut_down_the_congress: "Закрыть Конгресс"
 BRA_shut_down_the_congress_desc: "Первый, кто пойдет против наших планов, - это не кто иной, как Конгресс Бразилии. Нам нужно будет иметь дело с ними как можно скорее, если мы хотим пройти через наши планы, потому что они гарантированно подойдут, чтобы не допустить достижения наших целей."
 BRA_strengthen_the_police_force: "Укрепить полицейские силы"
 BRA_strengthen_the_police_force_desc: "Полицейские силы усердно работали, удерживая наших врагов в страхе. Мы укрепим их, чтобы подавить наших противников еще дальше."
 BRA_shut_down_the_integralists: "Выключить интегралистов"
 BRA_shut_down_the_integralists_desc: "Интегралисты сейчас являются частью того, чем они когда -то были. Мы можем предпринять последние шаги, чтобы хорошо и по -настоящему закрыть их идеологию."
 BRA_mediate_the_effects_of_the_political_crisis: "Опосредовать политический кризис"
 BRA_mediate_the_effects_of_the_political_crisis_desc: "Политический кризис в нашей стране сильно влиял на нас в целом. Может быть, мы должны начать предпринимать шаги, чтобы облегчить эти проблемы."
 BRA_exile_political_opponents: "Изгнание политических противников"
 BRA_exile_political_opponents_desc: "Они попросили об этом, мы делаем им только одолжение за то, что должно произойти."
 BRA_enact_the_cohen_plan: "Принять план Коэна"
 BRA_enact_the_cohen_plan_desc: "План Коэна был разработанным планом, который коммунисты планировали восстание правительства. Это использовалось для того, чтобы убедить нацию, включая Конгресс, дать Варгасу больше полномочий над нации как средство встречного измерения этого «плана»."
 BRA_sign_the_decree_law: "Подписать закон"
 BRA_sign_the_decree_law_desc: "С большей властью над государством появляется больше обязанностей и задач, и мы будем справляться с этими шагом за раз, начиная с закона."
 BRA_officialy_establish_the_estado_novo: "Официально установить эстадо Ново"
 BRA_officialy_establish_the_estado_novo_desc: "Все приготовления были сделаны, и все установлено и готово к работе. Пришло время сделать его официальным и захватить страну в качестве диктатора. Бразилия теперь увидит годы процветания и роста благодаря нашему непревзойденному лидерству!"
 BRA_review_our_foreign_policy: "Просмотреть нашу внешнюю политику"
 BRA_review_our_foreign_policy_desc: "Мы должны потратить некоторое время, чтобы рассмотреть нашу внешнюю политику и посмотреть, где мы должны выравниваться в глобальной политике."
 BRA_maintain_strict_neutrality: "Поддерживать строгий нейтралитет"
 BRA_maintain_strict_neutrality_desc: "В лучших интересах будет строго нейтрально, учитывая глобальную ситуацию. Присоединение к любой стороне будет гарантировать врагов, и это то, чего мы не хотим."
 BRA_allign_ourselves_with_the_allies: "Выровнять себя с союзниками"
 BRA_allign_ourselves_with_the_allies_desc: "Союзники, безусловно, наш лучший вариант, когда дело доходит до формирования альянсов. Фашисты и коммунисты дестабилизируют глобальную политику и подвергают риску мир, в то время как союзники пытаются предотвратить это, и мы им поможем."
 BRA_embargo_the_germans: "Эмбарго немцев"
 BRA_embargo_the_germans_desc: "Немцам не разрешается покупать какой -либо из наших ресурсов, особенно с учетом их чрезвычайно быстрого расширения."
 BRA_join_allies: "Присоединяйтесь к союзникам"
 BRA_join_allies_desc: "Пришло время сделать его официальным, мы поможем союзникам и их делу против немцев, занимающихся войной."
 BRA_declare_war_on_the_germans: "Объявить войну немцам"
 BRA_declare_war_on_the_germans_desc: "Немцы подвергают риску все, что человечество сделало и наращивалось на протяжении тысячелетий. Пришло время помогать им остановить."
 BRA_establish_the_FAB: "Установить февраль"
 BRA_establish_the_FAB_desc: "Бразильские экспедиционные силы по прозвищу Кобры Фумантес были военным подразделением бразильской армии и ВВС, которые боролись с силами союзных сил в Средиземном театре Второй мировой войны. Это насчитывало около 25 900 человек, в том числе полную пехотную дивизию, рейс по связи и истребительская эскадрилья. Давайте отправим наших людей в Европу и поможем союзникам в победе над осью."
 BRA_learn_from_the_italian_alps: "Учиться у итальянских Альп"
 BRA_learn_from_the_italian_alps_desc: "Война в итальянских Альпах была очень грубой, но мы можем вернуть домой наши знания из этого типа войны, чтобы лучше улучшить наши собственные военные."
 BRA_help_out_in_d_day: "Помогите в день D"
 BRA_help_out_in_d_day_desc: "Посадка в день и операция в целом была одним из самых рискованных маневров во всей истории человечества. Есть много, чтобы отнять у такой операции."
 BRA_lend_aid_to_the_soviets: "Оказывать помощь Советам"
 BRA_lend_aid_to_the_soviets_desc: "Советы отчаянно нуждаются в помощи, поэтому мы одолжим им помощь, которую мы можем оказать."
 BRA_allign_ourselves_with_the_axis: "Выровнять себя с осью"
 BRA_allign_ourselves_with_the_axis_desc: "Ось явно побеждает в войне, поэтому должно быть довольно очевидно, кого мы должны поддерживать в этой войне."
 BRA_defend_ourselves_against_the_integralists: "Защищать себя от интегралистов"
 BRA_defend_ourselves_against_the_integralists_desc: "Интегралисты просто не могли справиться с тем фактом, что мы полностью контролируем нацию, и делаем одну последнюю отчаянную попытку вернуть контроль над нацией, планируя нападение на дворец Гуанабара. Мы будем защищать дворец со всей нашей мощью, они ничего не возьмут у нас!"
 BRA_arrest_plinio: "Арестовать Плинио"
 BRA_arrest_plinio_desc: "Плинио сошел с рук со многими вещами, но это заканчивается сегодня. Это запланированное нападение на дворец зашла слишком далеко, и из -за этого мы посадим его в тюрьму. Как только это будет сделано, его сторонники наверняка отказались от продолжения плана, и к тому времени сторона, надеюсь, будет полностью распущена."
 BRA_internal_management: "Внутреннее управление"
 BRA_internal_management_desc: "Прежде чем мы сможем сосредоточиться на экстерьере, нам нужно сосредоточиться и стабилизировать наш интерьер. Только когда мы достаточно стабильны, мы сможем заглянуть за пределы наших границ."
 BRA_make_up_for_the_lack_of_congress: "Компенсировать отсутствие Конгресса"
 BRA_make_up_for_the_lack_of_congress_desc: "Отсутствие Конгресса серьезно причиняет нам вред. Нам нужно будет взять контрмеры, чтобы убедиться, что это не сохранится."
 BRA_establish_the_department_of_press_and_propaganda: "Департамент прессы и пропаганды"
 BRA_establish_the_department_of_press_and_propaganda_desc: "Департамент прессы и пропаганды должны быть созданы для дальнейшего улучшения имиджа Варгаса по всей стране и справиться с любым надоедливым оппозицией, которая может на нашем пути."
 BRA_harsher_punishment_for_the_protestors: "Более жесткое наказание за протестующих"
 BRA_harsher_punishment_for_the_protestors_desc: "Даже со всеми нашими реформами все еще есть люди, протестующие время от времени на улицах. Эти жалкие протесты не будут длиться больше!"
 BRA_cleanse_the_political_sphere: "Очистить политическую сферу"
 BRA_cleanse_the_political_sphere_desc: "Мы уже сделали достаточно, чтобы полностью обеспечить политическую сферу. Наши противники были подавлены, люди любят нас, и экономика растет постоянно. Пусть наша страна процветает с этого момента."
 BRA_establish_petrobras: "Установить петбробрас"
 BRA_establish_petrobras_desc: "Petrobras - это нефтяная промышленность, которая становится крупнейшей в Южной Америке. Наша страна богата нефтью, и нам нужна сущность, чтобы иметь возможность использовать ее в полной мере."
 BRA_industrial_recovery: "Промышленное восстановление"
 BRA_industrial_recovery_desc: "Наша отрасль все еще восстанавливается от Великой депрессии и наших недавних реформ, чтобы принять власть в стране, но медленно и, конечно, она восстанавливается."
 BRA_strengthen_the_army: "Укрепить армию"
 BRA_strengthen_the_army_desc: "Бразильская армия хороша, но ее можно улучшить. Мы приложим усилия, чтобы укрепить его и стать военной властью во всем мире."
 BRA_offer_the_use_of_coastal_bases_to_the_US: "Предложите использование прибрежных баз в США"
 BRA_offer_the_use_of_coastal_bases_to_the_US_desc: "США все еще не слишком убеждены в нашем сотрудничестве с союзниками, поэтому для того, чтобы укрепить их, давайте дадим им доступ к нашим верфи. Их зависит от того, используют ли они их, но мы дадим им знать, что их более чем приветствуют."
 BRA_try_to_purchase_american_guns: "Попробуйте купить американское оружие"
 BRA_try_to_purchase_american_guns_desc: "Американское оружие - одно из лучших на планете. Получение в руки это обязательно улучшит нашу армию."
 BRA_allow_the_germans_to_purchase_cotton: "Позвольте немцам покупать хлопок"
 BRA_allow_the_germans_to_purchase_cotton_desc: "Немцы уже некоторое время интересовались нашим хлопком, и для лучших наших интересов будет торговать с ними и позволить им покупать наш хлопок."
 BRA_aid_both_sides: "Помогите обеим сторонам"
 BRA_aid_both_sides_desc: "Мы должны еще больше укрепить наш нейтралитет, предоставляя помощь обеим сторонам, таким образом, ни одна из сторон не может жаловаться."
 BRA_establish_the_mercosur: "Установить Мерков"
 BRA_establish_the_mercosur_desc: "Время формализовать официальный альянс здесь, в Южной Америке. Мы будем третьим вариантом для тех, кто нерешительный относительно того, какую сторону выбрать."
 BRA_the_war_on_fascism: "Война против фашизма"
 BRA_the_war_on_fascism_desc: "Фашизм - это чума на этой планете. Нам нужно немедленно положить конец этому."
 BRA_purchas_german_weaponry: "Купить немецкое оружие"
 BRA_purchas_german_weaponry_desc: "Немецкое оружие оказалось одним из лучших в мире. Получение в руки их значительно улучшит нашу армию."
 BRA_secret_deal_with_the_germans: "Тайная сделка с немцами"
 BRA_secret_deal_with_the_germans_desc: "Мы решили, мы присоединимся к оси ... но с небольшим поворотом. Кажется, что Германия никому не примет, поэтому мы закрепим наши рассуждения присоединиться, вторгаясь на уругвайцев одновременно."
 BRA_open_up_the_south_american_front: "Открыть южноамериканский фронт"
 BRA_open_up_the_south_american_front_desc: "Пришло время доставить войну в Южную Америку. Мы сделаем все возможное, чтобы продемонстрировать нашу компетентность нашим новым союзникам."
 BRA_push_through_paraguay_vargas: "Протолкнуть через Парагвай"
 BRA_push_through_paraguay_vargas_desc: "Парагвай может использоваться как способ обойти уругвайские и аргентинские силы. Может быть, мы должны сделать то, что Германия сделала с Бенилюксом, и протолкнуть прямо через Парагвай."
 BRA_the_war_on_communism_vargas_snd: "Война против коммунизма"
 BRA_the_war_on_communism_vargas_snd_desc: "Пора заканчивать коммунизм на континенте раз и навсегда!"
 BRA_militarize_economy: "Милитаризировать экономику"
 BRA_militarize_economy_desc: "Наша экономика должна быть военизирована и быстрой, если мы хотим одержать верх в этой войне!"
 BRA_the_germans_and_brazilians_united: "Немцы и бразильцы объединились"
 BRA_the_germans_and_brazilians_united_desc: "Обе наши армии борются с миром вместе. Наши армии становятся лучше вместе. Мы будем расти одновременно с немцами и станем с ними великими союзниками."
 BRA_develop_paraguay: "Разработать Парагвай"
 BRA_develop_paraguay_desc: "Парагвай не так развит, как хотелось бы, но мы можем это изменить."
 BRA_improve_our_research_facilities: "Улучшить наши исследовательские учреждения"
 BRA_improve_our_research_facilities_desc: "Наши исследовательские учреждения могут быть улучшены даже дальше, чем то, что сейчас сейчас."
 BRA_learn_from_the_immigrants: "Учиться у иммигрантов"
 BRA_learn_from_the_immigrants_desc: "Иммигранты принесли с собой много вещей, и мы должны это воспользоваться."
 BRA_mobilize_the_reserves: "Мобилизовать резервы"
 BRA_mobilize_the_reserves_desc: "Каждый будет служить в этой войне! Нам нужно спасти эту страну от темного пути."
 BRA_contact_other_south_american_nations: "Связаться с другими южноамериканскими странами"
 BRA_contact_other_south_american_nations_desc: "Нам нужна иностранная помощь, просто нет оправдания, чтобы не получать ее. Их помощь будет очень удобна."
 BRA_adopt_a_temporary_war_economy: "Принять временную экономику войны"
 BRA_adopt_a_temporary_war_economy_desc: "Военная экономика - это то, что нам сейчас нужно, чтобы перепроизводить наших врагов, и мы установим это немедленно."
 BRA_jose_americo_for_president: "Хосе Америко для президента"
 BRA_jose_americo_for_president_desc: "У Хосе Америко есть несколько очень многообещающих предложений и планов, изложенных на будущее этой страны. Он вполне может быть просто ключом, необходимым для продвижения этой страны в новую эру."
 BRA_ensure_our_political_victory: "Обеспечить нашу политическую победу"
 BRA_ensure_our_political_victory_desc: "Нам нужно принять обширные меры, чтобы убедиться, что люди проголосуют за правую сторону. Мы выиграем, если мы будем играть наши карты правильно."
 BRA_victory_for_the_neutrals: "Победа для нейтралов"
 BRA_victory_for_the_neutrals_desc: "Наша вечеринка выиграла! Люди говорили и решили избрать нас и поместить нас в власть. Мы обязательно сделаем правильные вещи, и сделаем правильные шаги, чтобы привести Бразилию в новую и лучшую эпоху своей истории."
 BRA_end_the_political_crisis_neutrals: "Положить конец политическому кризису"
 BRA_end_the_political_crisis_neutrals_desc: "Политический кризис, который нас мучил в течение многих лет, больше не будет. Мы наконец примем меры, чтобы полностью искоренить его."
 BRA_purchase_foreign_arms: "Купить иностранные оружия"
 BRA_purchase_foreign_arms_desc: "Нам нужно снабдить наши войска лучшим оборудованием. Что может быть лучше, чем купить иностранное оборудование для нашей армии."
 BRA_brasilia: "Бразилиа"
 BRA_brasilia_desc: "Бразилиа является нынешней столицей Бразилии. 21 апреля 1960 года он был основан президентом Juscelino Kubitschek, который стал новой национальной столицей. Нам нужна новая столица для нашей нации, чтобы мы могли дать людям стимул уехать из Сан -Паулу и Рио -де -Жанейро и продемонстрировать новую эру бразильской истории."
  
 CHL_the_ISI_model: "Модель ISI"
 CHL_the_ISI_model_desc: "Модель индустриализации импорта была характерным планом Южной Америки перед лицом Великой депрессии. Цель состояла в том, чтобы содействовать экономическому развитию и индустриализации этих стран, снижение их зависимости от импорта промышленных продуктов и поощрение национального производства товаров."
  
  
  ### Argentina Rework ### 
 ARG_focus_on_our_markets: "Сосредоточиться на наших рынках"
 ARG_focus_on_our_markets_desc: "Аргентинская экономика в настоящее время изо всех сил пытается сохранить на плаву благодаря Великой депрессии. Мы должны сосредоточить наши усилия на улучшении наших рынков и начале начала экономики."
 ARG_continue_the_roca_runciman: "Продолжить договор Рока-Дунксиман"
 ARG_continue_the_roca_runciman_desc: "Договор Рока-Дунксиман был соглашением между Аргентинской Республикой и Великобританией, которое гарантировало Аргентину фиксированную долю на британском мясном рынке и ликвидировал тарифы на большинство аргентинских товаров. Это соглашение было запланировано всего на 3 года, и конец соглашения приближается. Мы должны продолжить соглашение, поскольку оно приносит нам больше всего пользу."
 ARG_cancel_the_roca_runciman_treaty: "Отменить договор Рока-Дунксиман"
 ARG_cancel_the_roca_runciman_treaty_desc: "Договор Рока-Дунксиман помог нам ввести наши отношения с англичанами на протяжении всего этого времени, но он просто не сокращает его. Мы могли бы получить гораздо больше, если бы освободим нашу экономику другим инвесторам, а не только в Великобритании. Извините [ENG.GetLeader], но мы вышли!"
 ARG_import_british_weaponry: "Импортировать британское оружие"
 ARG_import_british_weaponry_desc: "У британцев всегда было очень продвинутое оружие. Мы должны использовать наши хорошие условия с британцами в нашу пользу и запросить некоторые из их вооружений."
 ARG_make_an_effort_to_mobilize: "Начните нашу мобилизацию"
 ARG_make_an_effort_to_mobilize_desc: "Мир горит, и мы должны быть готовы к худшему."
 ARG_juremos_con_gloria_morir: "O Juremos Con Gloria Morir"
 ARG_juremos_con_gloria_morir_desc: "У нас, аргентинцы, имеем чувство национализма, в отличие от любого другого. La Patria - священная, с момента своей концепции в 1810 году, и мы позаботимся о том, чтобы она никогда не умирает. Аргентина населена аргентинцами; Не имеет значения на фоне или статусе, мы все, едины, объединены с одной целью, чтобы продвинуть эту страну и держать ее на месте, над всеми остальными. Viva La Patria!"
 ARG_project_huemul: "Project Huemul"
 ARG_project_huemul_desc: "Проект Huemul был ранней аргентинской попыткой разработать ядерные бомбы. С достаточным количеством инвестиций и времени, он обязательно сработает, и мы будем одной из первых стран, которые используют силу ядерной энергии и бомб."
 ARG_a_newfound_commune: "Новая обстоящая коммуна"
 ARG_a_newfound_commune_desc: "Распространение слова коммунизма нашим соседям, это было ясно, что миру наша власть и воля. Коммунизм преобладает, и мир увидит, насколько мы могу быть!"
 ARG_military_improvements: "Военные улучшения"
 ARG_military_improvements_desc: "Если мы хотим продолжить наши амбициозные планы, нам нужно будет улучшить наши военные, чтобы удовлетворить возросшие требования."
 ARG_invite_the_other_communists: "Пригласить других коммунистов"
 ARG_invite_the_other_communists_desc: "Есть и другие коммунистические страны за пределами нашего горизонта. Мы протянем руку к ним и будем работать вместе для большего блага."
 ARG_bring_down_the_capitalist_pigs: "Сбить капиталистических свиней"
 ARG_bring_down_the_capitalist_pigs_desc: "Пришло время принести дело в наши руки. Американцы больше не будут боссом этого континента, и мы позаботимся о том, чтобы они получили записку!"
 ARG_create_the_CNU: "Создайте CNU"
 ARG_create_the_CNU_desc: "В Аргентине существуют различные независимые фашистские партии, каждая из которых работает независимо друг от друга, но с той же мечтой и стремлением сделать эту страну процветать. Создание коалиции и привлечение всех этих партий под одно и то же имя может позволить нам заставить эту мечту стать реальностью."
 ARG_stage_nationwide_attacks: "Стадия общенациональных атак"
 ARG_stage_nationwide_attacks_desc: "Наши политические враги не воспринимают нас всерьез. Может быть, мы должны показать им, что такое настоящий страх."
 ARG_bring_the_oligarchs_into_the_mix: "Привнести олигархи в смесь"
 ARG_bring_the_oligarchs_into_the_mix_desc: "Олигархи - наш враг, без сомнения. Тем не менее, они могли бы помочь нам довольно хорошо, как только мы возьмем под контроль страну. Все, что нам нужно сделать, это держать их на их месте, и у нас все должно быть в порядке."
 ARG_rally_sectors_of_the_army: "Митинговые секторы армии"
 ARG_rally_sectors_of_the_army_desc: "В то время как хорошее большинство армии противоречит нашему движению, некоторые сектора проявляют серьезные симпатии фашизму и видели потенциал, которую приносит наша коалиция, и раз и навсегда приносят порядок в эту нацию."
 ARG_coerce_the_politicans: "Приступить к политикам"
 ARG_coerce_the_politicans_desc: "Сердце наших врагов - в политике. Всегда был, всегда будет. Принуждая этих людей не отказаться от нации, когда у нас будет возможность взять на себя возможность оказать нам помощь в стабилизации нации."
 ARG_convince_the_catholic_church: "Убедить католическую церковь"
 ARG_convince_the_catholic_church_desc: "Идея объединения церкви и фашизма не так редка. Это было замечено много раз раньше, и у многих пасторов есть симпатии к нашему движению. Привлечение их под коалицию только принесет пользу нашему движению и пролит свет на наши идеалы на большие глаза."
 ARG_arm_the_catholics: "Вооружать католиков"
 ARG_arm_the_catholics_desc: "В то время как правительство будет сосредоточено на армии, они не смогут предсказать вооруженных католиков и церквей."
 ARG_spread_word_of_the_coalition: "Массовая пропаганда"
 ARG_spread_word_of_the_coalition_desc: "Все больше людей должны услышать о наших идеалах, чтобы привлечь к нашей коалиции большую популярность, что дает нам гораздо легкое время, требуя [ROOT.GetLeader], чтобы уйти от власти, чтобы мы могли вступить во владение."
 ARG_assasinate_those_against_us: "Убийся наших врагов"
 ARG_assasinate_those_against_us_desc: "Принуждение не будет достаточно; Некоторые враги просто слишком опасны, чтобы их жили. Не только это, мы могли бы использовать это, чтобы привить страха нашим врагам и заставить их понять, с кем они на самом деле имеют дело."
 ARG_government_crackdown: "Правительством подавления"
 ARG_government_crackdown_desc: "Приготовления все установлены. Все, что осталось, - это установить эту страну на правильном пути и вывести позорных, коррумпированных ублюдков, которые разрушали ее в течение последних нескольких десятилетий."
 ARG_take_full_control: "Возьмите полный контроль"
 ARG_take_full_control_desc: "Теперь, когда у нас есть контроль, и никто, который может противостоять нам, мы можем начать сосредоточиться на стране и полностью контролировать его политику, экономику и людей. Нам нужно будет провести много реформ и корректировок, если мы хотим сохранить эту страну стабильной."
 ARG_state_of_terror: "Состояние террора"
 ARG_state_of_terror_desc: "Мир? Жалкий. Мир никогда не работал против этих бешеных существ, которые постоянно пытаются снять нас. Мы должны использовать силу, кровь и насилие, чтобы действительно отправить сообщение, что мы имеем в виду бизнес. Привив страх в наших врагов, чтобы они даже не рассматривали восстание против нас."
 ARG_deal_peacefully_with_our_enemies: "Дипломатический подход"
 ARG_deal_peacefully_with_our_enemies_desc: "Мы должны попытаться получить решение дипломатически с теми, кто выступает против нашего режима. Они так же, как и наши собственные, и их мнение тоже имеет значение."
 ARG_threaten_the_oligarchs: "Угрожать олигархам"
 ARG_threaten_the_oligarchs_desc: "Теперь с олигархами на нашей стороне, все, что нам нужно сделать, это просто ... держать их под контролем. Убедитесь, что они знают, что мы являемся ответственными, и их усилия бесполезны против нас. Если все сделано успешно, мы можем повторно оказаться в пособиях, не платя ни одну из цен."
 ARG_german_allignment: "[GER.GetAdjective] Altignment"
 ARG_german_allignment_desc: "[GER.GetAdjective] разделяют очень похожие идеалы и интересы, как и мы. Союз с людьми, которые делятся такими идеалами, должно быть легким."
 ARG_german_tank_shipments: "Немецкие поставки танков"
 ARG_german_tank_shipments_desc: "[GER.GetAdjective] Производство бака быстро увеличивается, когда мир нагревается, а напряженность обостряется. Мы слышали, что их резервуары на высшем уровне, и было бы очень полезно, чтобы получить в свои руки некоторые из этих танков, или, по крайней мере, понять производственный процесс, чтобы воспроизвести эти резервуары."
 ARG_japanese_allignment: "[JAP.GetAdjective] Altignment"
 ARG_japanese_allignment_desc: "Составление себя с [JAP.GetAdjective] принесет нам преимущество на любого тихоокеанского врага, с которым мы можем столкнуться. Не говоря уже о нелепо мощном Имперском флоте, который есть у японцев, что может оказаться очень полезным в долгосрочной перспективе."
 ARG_purchase_japanese_ships: "Взаимные военно -морские упражнения с Японией"
 ARG_purchase_japanese_ships_desc: "[JAP.GetAdjective] Корабли - одни из самых мощных, но элегантных в мире. Составляя как силу, так и красоту, они видят силу за пределами человеческого воображения, способная на то, что большинство из них мечтает только мечтать о том, чтобы достичь. Мы могли бы многое узнать об их флоте и их тактике и использовать их, чтобы улучшить нашу собственную."
 ARG_catholic_takeover: "Католическое поглощение"
 ARG_catholic_takeover_desc: "Приготовления все установлены. Все в его правильном месте. Мы принесем справедливость в эту страну, и Господь отдадит свою руку, чтобы привести нас к славе."
 ARG_desecularization_effort: "Дескуляризация усилий"
 ARG_desecularization_effort_desc: "Аргентина в своем нынешнем состоянии по -прежнему придерживается довольно секуляризированного менталитета, что прямо противоречит нашим идеалам. Переход к более дезкуляризованному состоянию будет лучше подчеркнет наши идеалы и намерения."
 ARG_reservist_mobilization: "Мобилизовать резервисты"
 ARG_reservist_mobilization_desc: "По всей стране все еще есть много резервистов, но все же были вызваны. Они могут быть очень хорошим использованием в случае ужасной ситуации."
 ARG_seize_local_arms_factory: "Захватить местные арсенали"
 ARG_seize_local_arms_factory_desc: "Местные заводы вооружений были оставлены заброшенными из -за хрупкой ситуации страны. Это гонка со временем в отношении того, кто берет контроль над этим и использует их в своих интересах, и мы должны убедиться, что мы первыми достигнут."
 ARG_the_holy_army: "Священная армия"
 ARG_the_holy_army_desc: "Благодаря Господу и просвещенной Богом, наша армия принесет мир и опора к тем, достаточно несчастным, чтобы жить лжи и ошибки. Мы будем их Спасителем, спасуя их от вечного проклятия и освещая их светом Бога."
 ARG_empower_meinvielle: "Расширить Мейнвиэль"
 ARG_empower_meinvielle_desc: "Хотя нынешний фрапс над Аргентиной является тоталитарным, это не значит, что мы полностью охватываем по всей стране. Различные группы людей по -прежнему выступают против нас, поэтому нам нужно ужесточить нашу хватку, даже истребитель и заставить их понять, что Мейнвиэль - наш настоящий Спаситель."
 ARG_empower_the_independents: "Стремиться к изменению"
 ARG_empower_the_independents_desc: "Вместо того, чтобы снова и снова пробовать тот же общий подход, почему бы не вернуть что -то, что сработало в прошлом? На бумаге кажется безумным разжигать идеологию почти столетие, но судя по нынешней ситуации страны ... это действительно так безумно?"
 ARG_the_one_true_papal_state: "Одно истинное папское государство"
 ARG_the_one_true_papal_state_desc: "С церковью на нашей стороне и никто не вмешиваюсь, мы можем раз и навсегда привести Бога в этот мир. В течение всего времени считалось, что Святая Земля была в Риме, но это просто не кажется правильным. Мы, аргентинцы, были благословлены, и поэтому Святая Земля должна быть расположена прямо здесь."
 ARG_reclaim_our_original_land: "Восстановить нашу первоначальную землю"
 ARG_reclaim_our_original_land_desc: "Первоначально папское государство находилось в Риме, Италия. Он имеет много веков истории и был одной из самых длинных стран нашего современного мира. Если мы хотим, чтобы мир серьезно относился к нашим претензиям, нам нужно вывести первоначальное папское государство и наложить себя на них."
 ARG_the_holy_crusades: "Святые крестовые походы"
 ARG_the_holy_crusades_desc: "Бог с нами, и мы обязаны распространять слово нашего Господа любыми необходимыми средствами."
 ARG_the_quest_for_jerusalum: "Квест на Иерусалим"
 ARG_the_quest_for_jerusalum_desc: "Как солдаты Бога, мы должны продолжить стремление восстановить то, что по праву является христианской землей."
 ARG_holy_assimilation: "Святая ассимиляция"
 ARG_holy_assimilation_desc: "Поскольку Аргентина имеет контроль над Римом и Иерусалимом, мы должны полностью ассимилировать народ наших вновь обретенных территорий в аргентинское общество."
 ARG_establish_the_TNM: "Установить TNM"
 ARG_establish_the_TNM_desc: "Националистическое движение Такуара было аргентинским крайне правым православным пернистским фашистским движением в 50-х годах, вдохновленным непосредственно идеалами Хулио Мейнвиэль. Мы должны осторожно рассмотреть наши варианты и тщательно продумывать вещи. Наша страна все еще находится в хрупком состоянии, поэтому мы должны делать вещи шаг за шагом и придерживаться более спокойной решимости."
 ARG_a_different_approach: "Другой подход"
 ARG_a_different_approach_desc: "Те же проклятые правительства работают и разрушают нашу страну уже десятилетиями, каждый из которых хуже, чем предыдущий. Нам нужно что -то изменить, что -то новое ... или что -то старое! Идея возвращения Конфедерации безумна, но не невозможная, и сейчас нам нужно что -то безумное, если мы хотим выйти из этого вечного кризиса!"
 ARG_empower_the_federalists: "Расширить возможности федералистов"
 ARG_empower_the_federalists_desc: "Федералистская поддержка в стране все еще недостаточно популярна. Если мы хотим, чтобы наш переворот был по -настоящему успешным, нам понадобится как можно больше людей, поддерживающих наши идеалы и причину."
 ARG_seize_enemy_reserves: "Захватить вражеские резервы"
 ARG_seize_enemy_reserves_desc: "Когда враг отступает и их солдаты сдаются, они оставляют позади много оружия и оборудования. Это может быть очень полезным для нашего дела и помочь нам одержать верх над нашим противником."
 ARG_cooperation_with_fascist_deserters: "Сотрудничество с фашистскими дезертирами"
 ARG_cooperation_with_fascist_deserters_desc: "Прежде чем мы вступили во владение, многие солдаты, которые были против фашистского режима, покинули поле битвы. Эти люди потенциально могут быть убеждены присоединиться к нашей стороне, а не с нашими врагами."
 ARG_capture_transport_material: "Захват транспортный материал"
 ARG_capture_transport_material_desc: "Наш враг использовал много моторизованных для транспортировки материалов в FRO. Мы могли бы получить верхний край в подаче, если мы захватим их транспортное оборудование."
 ARG_federalizing_the_country: "Федерализация страны"
 ARG_federalizing_the_country_desc: "Аргентина - большая, обширная страна, поэтому федерализация нашей страны будет намного проще управлять правительством."
 ARG_arms_expansion: "Расширение оружия"
 ARG_arms_expansion_desc: "Наши арс -оружиры хороши, но они могут быть лучше. В конце концов, больше арсеналов означает больше оружия."
 ARG_fascist_intellectuals: "Фашистские интеллектуалы"
 ARG_fascist_intellectuals_desc: "Интеллекты среди нас очень ценны, и их работа не будет тратить впустую."
 ARG_guerilla_tactics: "Партизанская тактика"
 ARG_guerilla_tactics_desc: "Нет ничего плохого в использовании партизанской тактики вместо того, чтобы бороться с ней на открытом воздухе."
 ARG_major_naval_investments: "Основные военно -морские инвестиции"
 ARG_major_naval_investments_desc: "Мы должны в значительной степени инвестировать в наши военно -морские силы и улучшить нашу военно -морскую власть."
 ARG_demand_the_pitcarin_island: "Спрос на остров Питкэрн"
 ARG_demand_the_pitcarin_island_desc: "Остров Питкэрн станет прекрасным дополнением к нашей территории. Мы должны потребовать, чтобы британцы передали его нам."
 ARG_decimate_the_imperialists: "Разделение империалистов"
 ARG_decimate_the_imperialists_desc: "Франция и Великобритания заставили слишком много страдать от этого мира, чтобы они были просто оставлены в покое. Они будут искупить свои грехи, нравится им это или нет."
 ARG_the_threat_in_the_west: "Угроза на западе"
 ARG_the_threat_in_the_west_desc: "Превосходство Японии над Тихого океана может представлять проблему, поскольку мы также хотим превосходства над Тихим океаном, чтобы не только лучше защитить себя, но и установить доминирование против любых потенциальных врагов. Нам нужно взять Японию, чтобы сделать такую ​​вещь."
 ARG_focus_on_south_america: "Сосредоточьтесь на Южной Америке"
 ARG_focus_on_south_america_desc: "Сосредоточение внимания на расширении на нашем собственном континенте - это гораздо более выполнимая попытка, чем выборы борьбы за пределами нашего домена. Поэтому мы должны сосредоточиться на наших усилиях по расширению, чтобы находиться на континенте Южной Америки."
 ARG_conscript_war_refugees: "Военнопленные призывника"
 ARG_conscript_war_refugees_desc: "Мы должны призвать военнопленных военнопленных, чтобы сражаться от нашего имени, чтобы смягчить количество наших людей, которых мы проиграем в бою."
 ARG_inherit_foreign_industries: "Унаследовать иностранные отрасли"
 ARG_inherit_foreign_industries_desc: "По мере того, как мы расширяемся на иностранную территорию, наша текущая промышленная продукция просто недостаточно потребностей, необходимых для поддержания наших нынешних границ. Вместо того, чтобы беспокоиться о расширении нашей собственной отрасли, мы должны просто унаследовать иностранных и заставить их выполнять всю работу для нас."
 ARG_equal_education_across_the_provinces: "Образование по провинциям"
 ARG_equal_education_across_the_provinces_desc: "Наличие образованного общества принесет нам пользу в целом. Таким образом, мы должны попытаться обеспечить доступное образование по провинциям."
 ARG_economic_recoverry: "Экономическое восстановление"
 ARG_economic_recoverry_desc: "Экономически мы не в лучшей ситуации. Если мы хотим, чтобы у нашей страны была возможность стать процветающей нацией, мы должны сначала поработать над восстановлением нашей экономики."
 ARG_the_confederate_army: "Конфедеративная армия"
 ARG_the_confederate_army_desc: "Росас улыбается сверху, видя, как его наследие и гордость передаются и используют для большего блага. Наша армия в настоящее время сильна, но ее все еще можно улучшить и расширить."
 ARG_deal_with_the_remaining_unitarians: "Иметь дело с оставшимися унитарными"
 ARG_deal_with_the_remaining_unitarians_desc: "По всей стране все еще есть разбросанные остатки унитарического сопротивления. Если мы хотим полностью контролировать страну, нам сначала нужно с ними иметь дело."
 ARG_an_imminent_revolution: "Неизбежная революция"
 ARG_an_imminent_revolution_desc: "Поскольку страна рушится внутренне, и протесты распространяются по всей стране, идея полномасштабной революции начала очаровывать умы многих аргентинцев. Это вполне может быть нашим единственным спасением на данный момент, и люди более чем убеждены, что это единственный способ."
 ARG_spread_the_word: "Распространить слово"
 ARG_spread_the_word_desc: "Страна ухудшается, и революция должна быть известна всем. Нам нужно получить как можно больше поддержки, если мы хотим, чтобы революция работала, и нет места для неудачи."
 ARG_a_diplomatic_revolution: "Дипломатическая революция"
 ARG_a_diplomatic_revolution_desc: "Нет необходимости, чтобы кровь была пролита, в конце концов, мы все аргентинцы, и любая пролитная кровь - это аргентинская жизнь, потерянная. Скорее, мы должны подходить к этому дипломатичности и попытаться мирно разрешить ситуацию, взяв под контроль страну без применения силы, но с общественной поддержкой."
 ARG_merge_with_the_PS: "Слияние с PS"
 ARG_merge_with_the_PS_desc: "Если мы хотим иметь хороший шанс взять под контроль, нам нужно слиться с Partido Socialista. Нам придется смягчить наши собственные взгляды, чтобы они могли принять это действие, но если это означает, что это приведет к лучшей Аргентине, то это того стоит."
 ARG_liborio_shall_lead: "Сплоть наших сторонников"
 ARG_liborio_shall_lead_desc: "Нам нужна вся популярная поддержка, которую мы можем получить, если хотим мирно взять под контроль страну."
 ARG_political_assasination: "Политическое убийство"
 ARG_political_assasination_desc: "Есть много политиков, которые в значительной степени противодействуют нам, и это было бы угрозой, чтобы сохранить такие люди. Мы должны избавиться от них и отправить сообщение тем, кто наснит."
 ARG_weaken_the_government: "Ослабить правительство"
 ARG_weaken_the_government_desc: "Нам понадобится руководящий орган Аргентины, чтобы быть слабым, чтобы провести плавный правительственный переход и быстро и эффективно принять власть."
 ARG_gain_the_trust_of_the_officers: "Завоевать доверие офицеров"
 ARG_gain_the_trust_of_the_officers_desc: "Наличие высокопоставленных офицеров на нашей стороне может оказаться очень полезным как в краткосрочной, так и в долгосрочной перспективе. Мы не знаем, что ждет впереди, так что лучше быть в безопасности, чем сожалеть."
 ARG_no_one_other_than_alfredo_palacios: "Назначить Альфредо Паласиос"
 ARG_no_one_other_than_alfredo_palacios_desc: "Альфредо Паласиос, софистиоцированный и известный социалист в Аргентине. Он был активным в аргентинской политике в течение многих лет, и наличие такого знания и опыта, как он, был бы более чем идеальным."
 ARG_stick_with_nicolas: "Назначить Николаса"
 ARG_stick_with_nicolas_desc: "Николас Репетто, нынешний лидер Partido Socialista, также имеет многолетний опыт работы в аргентинской политике, активно участвуя в них с 1900 года. Иметь кого -то вроде его в качестве лидера было бы идеальным, особенно если учесть, что он уже руководит социалистической партией."
 ARG_propaganda_campaigns: "Пропагандистские кампании"
 ARG_propaganda_campaigns_desc: "Перемещение сердца людей должно быть нашим главным приоритетом. Им нужно понять, кто настоящий враг, и понять, что мы здесь, чтобы помочь им и освободить их от этой тирании."
 ARG_move_to_secure_parliament: "Переехать в защиту парламента"
 ARG_move_to_secure_parliament_desc: "Аргентинский парламент - очень мощный управляющий орган в Аржетнине. Получение мест внутри него позволило бы нам получить больше власти и контроля над нацией без особого оппозиции."
 ARG_gain_corrupt_votes: "Получить коррумпированные голоса"
 ARG_gain_corrupt_votes_desc: "Теперь с олигархами на нашей стороне мы можем начать подделка зарегистрированным голосованием. С тем, что такие могущественные сущности могут манипульть, зарегистрированные сценами, будет легко подделать голоса и сойти с рук. Мы не можем получить слишком амбициозные, как люди могут выяснить."
 ARG_a_bloody_revolution: "Кровавая революция"
 ARG_a_bloody_revolution_desc: "Был ли мир когда -нибудь вариант, когда дело дошло до освобождения людей под буржуазией? Нет, и наша ситуация ничем не отличается. Страна явно разваливается, и гражданская война неизбежна. Мы должны убедиться, что мы одержали верх в неизбежном событии, которое приближается."
 ARG_a_red_blanket_over_argentina: "Красное одеяло над Аргентиной"
 ARG_a_red_blanket_over_argentina_desc: "Те, кто не поддерживает наше дело, скоро поймут, почему они совершают ошибку, и обращают свою поддержку нашему делу."
 ARG_ask_for_soviet_aid: "Просить советскую помощь"
 ARG_ask_for_soviet_aid_desc: "Сообщается, что Советская электростанция должна быть готова поддержать наше дело в стране, а также наши намерения освободить нашего народа и окружающих. Помогая моя цена, но любая цена того стоит в долгосрочной перспективе."
 ARG_treaty_with_the_anarchists: "Договор с анархистами"
 ARG_treaty_with_the_anarchists_desc: "Люди считали, что анархисты сумасшедшие, но действительно ли они сумасшедшие? Они могут быть на чем -то, что нам еще предстоит выяснить сами."
 ARG_establish_headquarters_in_ushuaia: "Создать штаб -квартиру в Ушуайе"
 ARG_establish_headquarters_in_ushuaia_desc: "С освобождением Саймона Радовицкого будет иметь смысл только установить нашу штаб -квартиру, где его держали в плену, Ушуая. Это уже прилично значительный город, и это может стать идеальным местом для организации наших планов."
 ARG_founded_the_ERP: "LA Patrulla Roja"
 ARG_founded_the_ERP_desc: "Вниз с анархизмом! Народная Республика Аргентина будет преобладать!"
 ARG_build_up_militias: "Создание ополченцев"
 ARG_build_up_militias_desc: "Хотя мы не можем сформировать правильную армию, мы должны сделать все, что в нашей власти, чтобы тренировать и создавать ополченцы для неизбежного конфликта. Они могут быть не самыми сильными, но у нас будет преимущество."
 ARG_steal_national_stockpiles: "Украсить национальные запасы"
 ARG_steal_national_stockpiles_desc: "Аргентинское правительство закупает вооружения в ответ на хрупкое положение страны и неизбежность внутреннего конфликта. Мы должны воспользоваться этим и попытаться украсть как можно больше вооружений."
 ARG_convince_generals: "Убедить генералов"
 ARG_convince_generals_desc: "Есть еще много генералов, выступающих против наших взглядов. Нам нужно убедить их присоединиться к нашей стороне и быстро, поскольку некоторые очень опытны в аспекте войны."
 ARG_bring_the_other_parties_into_the_fold: "Интегрировать другие стороны"
 ARG_bring_the_other_parties_into_the_fold_desc: "По мере роста популярности полядизм, многие из других коммунистических группировок все больше и больше склоняются к нашим идеалам. Приглашаем все присоединиться к делу! Революция должна двигаться вперед, и нам нужен каждый аргентинец, который мы можем получить!"
 ARG_secure_the_patagonia: "Закрепите Патагонию"
 ARG_secure_the_patagonia_desc: "Патагония богата ресурсами и возможностями. Защита такой земли до гражданской войны будет иметь решающее значение для обеих сторон."
 ARG_rally_the_patagonia_rebelde: "Усилить повстанческий"
 ARG_rally_the_patagonia_rebelde_desc: "В то время как события Патагонии Rebelde еще в начале 1920 -х годов в прошлом, в этих рядах все еще есть уединенные анархисты, готовые присоединиться к нашему делу. Не только это, но хрупкая ситуация в стране только укрепила их. Мы должны в полной мере воспользоваться этим и привести этих анархистов в наше движение."
 ARG_radicalize_the_masses: "Радикализировать массы"
 ARG_radicalize_the_masses_desc: "Средний работник должен понять красоту государства без правящего органа. Государство свободно от людей, для людей. Как только они поймут его красоту, наша поддержка будет расти в геометрической прогрессии!"
 ARG_simon_radowitzky_will_lead_us: "Назначить Саймона Радовицкого"
 ARG_simon_radowitzky_will_lead_us_desc: "Саймон Радовицки, выдающийся анархист в предыдущих 2 десятилетиях. Он был заключен в тюрьму в Ушуайе за его террористические атаки и крики анархизма. Но это сейчас в прошлом, когда он вернулся, сильнее, чем когда -либо, ведет анархистское государство и аргентинец к новоиспеченной славе!"
 ARG_virginia_bolten_shall_lead: "Назначить Вирджинию Болтен"
 ARG_virginia_bolten_shall_lead_desc: "Будучи депортированным в Уругвай после ее организованных ударов в Росарио и сочувствующей анархии, Болтен все еще продолжал распространять слово анархизма в Уругвае. Теперь, когда она вернулась в Аргентину, поддерживая наше дело, она более заметна, чем когда -либо! Она должна быть тем, кто взять под контроль нации!"
 ARG_the_council_shall_lead: "Совет анархизма"
 ARG_the_council_shall_lead_desc: "Мы должны сыграть это в безопасности и функционировать как настоящая анархия, без видной фигуры в центре! Поскольку Совет организовал для людей, людьми, должен сделать именно это!"
 ARG_secure_the_northa: "Закрепить север"
 ARG_secure_the_northa_desc: "Юг богат ресурсами, и то же самое можно сказать о севере. Взять под контроль такой обширный участок земли до гражданской войны будет иметь решающее значение для определения победителя!"
 ARG_the_revolution: "Революция"
 ARG_the_revolution_desc: "Революция будет успешной, свиньи рушатся, и новая эра аргентинца может подняться из крови и пепла!"
 ARG_a_new_type_of_communism: "Новый тип коммунизма"
 ARG_a_new_type_of_communism_desc: "Камарады! Нам нужно, чтобы все взялись за оружие и боролись за посадистскую революцию! Мы не можем сделать это без вашей помощи! Возьмите оружие и сражайтесь за будущее, достойное того, что его называют аргентинцем!"
 ARG_initiate_the_posadist_science_program: "Программа Posadist Science"
 ARG_initiate_the_posadist_science_program_desc: "Посадас всегда был очень острым и амбициозным, когда дело дошло до технологических достижений, и это остается верным по сей день. Мы начнем финансировать совершенно новую научную программу, и ее главная цель - продвинуться вперед по всей конкуренции в области технологий вооружения ... и, возможно, чего -то большего."
 ARG_re_organize_the_party: "Реорганизовать политическую партию"
 ARG_re_organize_the_party_desc: "Хотя позадизм был доминирующей фракцией до конфликта, в нашей политической партии все еще существуют синпатизаторы других фракций. Если мы хотим должным образом установить себя, нам сначала нужно иметь дело с этими людьми и реструктурировать Постадистскую партию."
 ARG_birth_of_the_posadist_fourth_internationale: "Посадистский четвертый международный"
 ARG_birth_of_the_posadist_fourth_internationale_desc: "Поскольку гражданская война подходит к концу, мы можем начать сосредоточиться на нашей внешней политике. Посадас приказал инициировать «Посадистский четвертый международный», в надежде внедрить больше людей в посадистское движение и присоединиться к нам в нашей глобальной революции."
 ARG_seize_the_national_industry: "Захватить национальную промышленность"
 ARG_seize_the_national_industry_desc: "Нам нужна как можно больше промышленной помощи, и наши лучшие шансы - извлечь выгоду из национальной промышленности страны."
 ARG_the_birth_of_posadism: "Рождение полянизма"
 ARG_the_birth_of_posadism_desc: "С гражданской войной в прошлое и страна, проходящая национальное восстановление, мы можем хорошо и по -настоящему объявить, что полянизм был создан в стране. Мир запомнит этот прекрасный день и будет благословлено, что мы дали все, чтобы оттолкнуться вперед и справиться с этим!"
 ARG_posadist_conscription_focus: "Посадистский призыв"
 ARG_posadist_conscription_focus_desc: "Наша армия должна расти в числах, если мы хотим достичь успешных амбиций Посадаса, поэтому мы будем инициировать план пособия с полянистом по расширению наших чисел."
 ARG_internal_management: "Внутреннее управление"
 ARG_internal_management_desc: "Нам нужно иметь дело с нашими внутренними проблемами, прежде чем мы сможем начать смотреть наружу."
 ARG_eliminate_the_oligarchs: "Устранить олигархи"
 ARG_eliminate_the_oligarchs_desc: "Эти надоедливые олигархи в течение некоторого времени восстанавливались на нашей земле с момента решимости гражданской войны. Давайте проясним им, что их маленький парад скоро закончится в кровавом беспорядке."
 ARG_cleanse_the_extremists: "Очистите экстремистов"
 ARG_cleanse_the_extremists_desc: "Экстремизм по -прежнему заметен в Аргентине, и эти люди представляют угрозу для революции. Они скоро будут истреблены."
 ARG_patagonic_industrialization: "Патагоническая индустриализация"
 ARG_patagonic_industrialization_desc: "Патагония полна неиспользованного потенциала. Давайте используем это в полной мере и индустриализируем южный регион как можно лучше. Если все сделано хорошо, это приведет ко многим богатствам."
 ARG_expand_the_posadist_science_program: "Расширить программу Posadist Science"
 ARG_expand_the_posadist_science_program_desc: "Хотя на данный момент программа все в порядке, мы можем сделать намного лучше. Нам необходимо увеличить финансирование в программе Posadist Science, чтобы лучше улучшить наши методы исследования и модернизировать еще быстрее."
 ARG_el_ejercito_del_pueblo: "El ejercito del Pueblo"
 ARG_el_ejercito_del_pueblo_desc: "Людям нужна сильная армия, которая может защитить их независимо от угрозы, и это то, что мы, как лидер, должны обеспечить для нашего народа."
 ARG_ask_for_international_aid: "Попросить международную помощь"
 ARG_ask_for_international_aid_desc: "С войной в полном разгаре, нам нужна столько помощи, сколько мы можем получить верх над предыдущим правительством. Это будет сложно, но с достаточным убедительным, все возможно."
 ARG_incorporate_the_red_marines: "Включите красных морских пехотинцев"
 ARG_incorporate_the_red_marines_desc: "Армада Аргентина хороша, но она все еще привязана к старому правительству до революции, и ее необходимо переключить, чтобы лучше поставить нынешнее правительство и идеологию."
 ARG_red_skies: "Красное небо"
 ARG_red_skies_desc: "Когда наши пилоты взлетают высоко над небом, размахивая аргентинским флагом, ему нельзя помочь пролить слезу радости, видя, как наша воздушная сила растут и расширяется."
 ARG_urban_militias: "Городские ополченцы"
 ARG_urban_militias_desc: "Поскольку большая часть аргентинского населения является урбанизированным, имело бы смысл для нашей милиции специализироваться на городской войне и близких кварталах Comabt."
 ARG_rural_militias: "Сельские ополченцы"
 ARG_rural_militias_desc: "В то время как хороший кусок боев происходит в городских регионах, сельские борьбы, возможно, более важны, поскольку способность использовать засадку и партизанную тактику становится большей необходимостью, чтобы «могла». Обучение ополченцев для этой тактики даст нам верхнюю часть в этом отношении."
 ARG_formalize_gaucho_militias: "Формализуйте гочко ополченцы"
 ARG_formalize_gaucho_militias_desc: "Гаучо был видным с момента концепции этой страны, поэтому не имеет смысла не использовать господские ополченцы и Гаучо в целом в нашу пользу в этой войне."
 ARG_nace_el_ejercito_revolucionario: "Nace el ejército revolucionario"
 ARG_nace_el_ejercito_revolucionario_desc: "El Ejercito Revolucionario del Pueblo, просто известный как ERP, был военной ветвью революционной партии коммунистических рабочих и был основан в 1970 -х годах. Здесь мы поддерживаем новую и улучшенную армию, которая превзошла все шансы и ожидания, и его действительно могут назвать революционной народной армией."
 ARG_argentina_para_argentinos: "La Revolución Vialenta"
 ARG_argentina_para_argentinos_desc: "Аргентина есть и всегда будет для аргентинцев и только аргентинцев. Люди самые важные, и мы проясним это."
 ARG_la_industria_anarquista: "La Industria Anarquista"
 ARG_la_industria_anarquista_desc: "Нам понадобится мощная индустрия, чтобы продолжить наши планы и принести достойную Аргентину."
 ARG_military_above_all: "Военные прежде всего"
 ARG_military_above_all_desc: "Наш нынешний приоритет - военные, нам нужна струна и мощная армия, если мы хотим, чтобы кто -нибудь воспринял нас всерьез."
 ARG_cheap_out_on_weaponry: "Дешево на оружии"
 ARG_cheap_out_on_weaponry_desc: "Нам нужно как оружие Mnay, насколько мы можем получить, даже если они дерьмовые!"
 ARG_industry_is_priority: "Промышленность является приоритетом"
 ARG_industry_is_priority_desc: "Нашим приоритетом должен быть потребительская индустрия. Люди заслуживают правильной экономики, чтобы по -настоящему репутация под флагом."
 ARG_la_industria_ante_todo: "La Industria Ante Todo"
 ARG_la_industria_ante_todo_desc: "Приоритет отрасли, прежде всего, может привести к большей экономической стабильности, поскольку увеличение промышленных потенциал часто приводит к более сильной экономике. Это позволит нам лучше поддерживать наши военные и дипломатические усилия."
 ARG_centralize_the_syndicates: "Централизовать синдикаты"
 ARG_centralize_the_syndicates_desc: "Наши синдикаты в стране очень децентрализованы и повсюду. Нам нужно должным образом организовать их и централизовать их, чтобы довести их до самого большого потенциала."
 ARG_improved_resource_extraction: "Улучшение извлечения ресурсов"
 ARG_improved_resource_extraction_desc: "Эта страна полна ресурсов. Давайте максимизируем их извлечение и сделаем богатство от них."
 ARG_steal_foreign_factories: "Украсить иностранные фабрики"
 ARG_steal_foreign_factories_desc: "Вместо того, чтобы вкладывать все наши усилия в нашу собственную отрасль, почему бы просто не украсть его из зарубежных стран? Если они ответили, мы просто принимаем это силой."
 ARG_a_revolutionized_industry: "Революционизированная отрасль"
 ARG_a_revolutionized_industry_desc: "После различных экономических реформ наша экономика, наконец, неуклонно растет и, как и ожидалось. Мы скоро станем экономическим энергетиком, если все пойдет хорошо."
 ARG_el_ejercito_de_la_gente: "El Ejército de la Gente"
 ARG_el_ejercito_de_la_gente_desc: "Армия - народ, для людей. Мы выставем армию больше, чем может принять любой человеческий разум, способный выдвинуть желания народа."
 ARG_technological_advancements: "Технологические достижения"
 ARG_technological_advancements_desc: "Поскольку прогресс продолжается в нашей стране, наши технологические достижения. Наши ученые продолжают открывать новые вещи, и наши возможности продолжают расширяться и больше."
 ARG_todos_a_las_fronteras: "Todos A Las Fronteras"
 ARG_todos_a_las_fronteras_desc: "Каждый возьмет оружие, чтобы бороться за Патрию! Мы не свободны, пока не выиграем эту войну."
 ARG_militia_recruitment: "Ополчение набор персонала"
 ARG_militia_recruitment_desc: "Нам нужно каждое маленькое преимущество, которое мы можем получить. Быстро вооружение и обучение новых полков по всей стране, обязательно принесет нам победу!"
 ARG_las_semillas_del_anarquismo: "Семена анархизма"
 ARG_las_semillas_del_anarquismo_desc: "Анархизм распространяется как лесной пожар. Как только начинается небольшое пламя, его не останавливается, и мы позаботимся о том, чтобы анархизм распространился по всему континенту и миру, приводя всех под одно и то же знамя."
 ARG_una_armada_sin_dueno: "Уна Армада грех Дайеньо"
 ARG_una_armada_sin_dueno_desc: "Единственный настоящий «владелец» военно -морского флота - это народ, который также можно сказать об армии и воздушных силах. Люди заслуживают лучшего военно -морского флота, и это то, что мы даем им."
 ARG_dominate_skies: "Доминировать в небе"
 ARG_dominate_skies_desc: "Нам понадобится большая воздушная сила, если мы хотим, чтобы наши враги воспринимали нас всерьез."
 ARG_women_in_the_skies: "Женщины высоко над"
 ARG_women_in_the_skies_desc: "Если мы хотим оживить большую воздушную силу, нам понадобится многочисленные пилоты, и вместо того, чтобы зависеть исключительно от мужчин, мы должны начать принимать больше женщин. Чтобы быть пилотом, вам не нужно быть физически сильным, поэтому такая задача была бы идеальной для женщин этой страны, желающих заняться этой работой."
 ARG_anarquismo_para_todos: "Anarquismo para todos"
 ARG_anarquismo_para_todos_desc: "Весь мир нуждается в освобождении. В течение бесчисленных веков они управляют, использовали, оскорбляли, мучились элитой и позором, который мы называем политикой. ДОСТАТОЧНО! Мы больше не увидим, что другой человек страдает от рук таких людей."
 ARG_anarchist_expeditionary_forces: "Анархистские экспедиционные силы"
 ARG_anarchist_expeditionary_forces_desc: "Мы должны присутствовать на каждом углу мира на каждом возможном повороте. Никакое отвратительное правительство не будет в безопасности, ни один из этих маньяков, геноцивящих, не сможет сбежать."
 ARG_foment_anarchist_sentiment_in_our_neighbors: "Фомовые анархистские настроения вокруг нас"
 ARG_foment_anarchist_sentiment_in_our_neighbors_desc: "Ни у кого не было его хуже, чем у наших братьев Южной Америки. Снова и снова они использовались как куклы для простого политического удовлетворения. Диктатура, коррумпированные демократии, ужасные коммунистические режимы, все для чего? Мы не допустим, чтобы это продолжилось, никогда больше!"
 ARG_initiate_our_subversive_activities: "Инициировать нашу подрывную деятельность"
 ARG_initiate_our_subversive_activities_desc: "Пришло время поставить наши планы на ациона, пока мы дотошно планировали, но теперь ... Начнется реальная сделка."
 ARG_annex_our_subordinates: "Приложение наших подчиненных"
 ARG_annex_our_subordinates_desc: "Многие из наших братьев были освобождены. Пришло время поднять их в нашу собственную, и позволить им помахать знаменем свободы и процветания."
 ARG_anarchist_integration: "Анархистская интеграция"
 ARG_anarchist_integration_desc: "Все являются частью нас, мы все одно и то же. Почему мы должны относиться к кому -либо по -другому, когда мы все люди?"
 ARG_a_world_without_borders: "Мир без границ"
 ARG_a_world_without_borders_desc: "Анархизм не имеет границ, мы все одно и то же, мы все должны поддержать друг друга, независимо от пола, расы, этнической принадлежности, убеждений. Вскоре, если все пойдет хорошо, весь мир будет освобожден нами, и наконец -то будет новый порядок, в котором правят люди."
 ARG_destabilize_the_major_powers: "Дестабилизировать основные державы"
 ARG_destabilize_the_major_powers_desc: "С нашей нынешней силой и влиянием у нас есть много тайных агентов, способных делать много вещей, и теперь им будет поручено самую большую проблему из всех: ослабление основных способностей. Они заставили людей страдать больше всего, чем любая другая страна, и они заплатят за это!"
 ARG_foreign_recruitment: "Иностранный набор"
 ARG_foreign_recruitment_desc: "Несмотря на то, что наши собственные цифры ограничены, как только мы учитываем тех, кто не является родным для Аргентины, тогда эта проблема быстро исчезнет."
 ARG_unite_with_the_chilean_anarchists: "Поглощать чилийских анархистов"
 ARG_unite_with_the_chilean_anarchists_desc: "Анархисты в Чили наконец -то проснулись, и они успешно взялись за руки! Пока мы поздравляем их ... они все еще отталкивают, несчастные, даже грязные. Они не представляют истинные анархистские идеалы, они делают это только для своих извращенных эгоистичных взглядов. Чилийский народ заслуживает лучшего, чем эта грязная шутка правящего органа."
 ARG_unite_with_the_spanish_anarchists: "Поглощать испанских анархистов"
 ARG_unite_with_the_spanish_anarchists_desc: "Анархисты в Испании успешно взяли страну и привели их к новому пути! У них все хорошо ... но могут сделать намного лучше. Серьезно? У вас понадобилось так долго, чтобы освободить своих так называемых «священных людей», людей, которых вы предположительно цените выше себя? Позлостно, абсолютно презренно. Мы дипломатично попытаемся посмотреть, сможем ли мы объединиться с ними, но в глубине души мы возмущаемся такие эгоистичные взгляды."
 ARG_por_la_patria_y_el_pueblo: "Por la patria y el pueblo"
 ARG_por_la_patria_y_el_pueblo_desc: "В течение десятилетий Аргентина имело неисправное правительство после неисправного правительства, каждая из которых имеет одинаковые пустые обещания: «Оооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооооо. Ложь ложь, все они! Мы больше не будем этого отстаивать, мы так отчаянно желаем этой страны."
 ARG_las_mujeres_adelante: "Las Mujeres Adelante"
 ARG_las_mujeres_adelante_desc: "С ответственным Фанни нам нечего бояться. Кто -то с песчаной и муской, как Фанни, не слышал в наши дни, и она обязательно принесет много замечательных вещей в эту страну."
 ARG_liborio_al_frente: "Либорио Аль Френте"
 ARG_liborio_al_frente_desc: "Либорио Юноо, сын Агустина Педро Юсто, сильного марксиста с явным обожанием для страны. Такой сильный лидер, безусловно, будет означать, что эта страна будет в хороших руках."
 ARG_commence_the_purge: "Великая чистка"
 ARG_commence_the_purge_desc: "Мы видим себя вынужденными начать чистку в наших рядах. В нашем собственном правительстве и стране есть много, которые могут представлять серьезную угрозу для нашего правительства, и мы должны быть осторожны. Если мы не избавимся от нужных людей, у нас могут быть серьезные проблемы."
 ARG_a_new_era_for_argentina: "Новая эра для Аргентины"
 ARG_a_new_era_for_argentina_desc: "После многих изменений и обменов Perseell мы теперь можем полностью зарекомендовать себя как новую и улучшенную Аргентину. Тот, который на самом деле заботится о своих людях и хочет улучшить текущую ситуацию страны. Мы сделаем все возможное, чтобы это произошло."
 ARG_political_reform: "Политическая реформа"
 ARG_political_reform_desc: "Есть еще много работы в политическом аспекте вещей в стране. Мы только недавно приняли власть и много изменений, но все еще делаемся."
 ARG_industrial_reforms: "Промышленные реформы"
 ARG_industrial_reforms_desc: "В настоящее время нынешняя экономическая проекция и то, как она обрабатывается, необходимо значительно измениться. Это может вызвать проблемы в краткосрочной перспективе, но в долгосрочной перспективе это обязательно окупится."
 ARG_agricultural_syndicates: "Сельскохозяйственные синдикаты"
 ARG_agricultural_syndicates_desc: "С тем, насколько обширно наш сельскохозяйственный раздел, воздвижение синдикатов для работников в таких секторах экономики позволило бы обеспечить лучшие условия работника и улучшить производство."
 ARG_foreign_subsidies: "Иностранные субсидии"
 ARG_foreign_subsidies_desc: "Получение иностранных субсидий от наших соседей, которые содержат хорошие мнения по отношению к нам, обязательно поможет нам в наших перспективах иметь значительную отрасль."
 ARG_offer_universal_education: "Предложение универсального образования"
 ARG_offer_universal_education_desc: "Каждый аргентинец должен иметь право на свободное и надлежащее образование, независимо от обстоятельств!"
 ARG_establish_the_american_internationale: "Создать американский международный"
 ARG_establish_the_american_internationale_desc: "В одиночку мы не можем многое сделать, но вместе с нашими товарищами мы можем так много сделать."
 ARG_ally_with_the_soviets: "Союзник с Советами"
 ARG_ally_with_the_soviets_desc: "Союз со советской электростанцией оказалось бы очень полезным. Сырая мощь и сила могут нести горы."
 ARG_democracia_y_socialismo: "La Revolución Lenta"
 ARG_democracia_y_socialismo_desc: "Вместо того, чтобы идти на полную или полную справа, почему бы не найти сладкое место? Принимая некоторые из лучших аспектов левых и одни из лучших аспектов правого и объединить их в социалистическое состояние. Северные страны сделали это хорошо, почему мы не можем?"
 ARG_reworking_the_internals: "Переработка внутренних дел"
 ARG_reworking_the_internals_desc: "Шрамы печально известного десятилетия по -прежнему присутствуют в стране, что затрагивает аргентинцы каждый день. Пришло время начать работать над полной борьбой с этим позором и по -настоящему продвигаться вперед как страна."
 ARG_establish_a_mutual_support_defense_council: "Создать Совет обороны взаимной поддержки"
 ARG_establish_a_mutual_support_defense_council_desc: "Поскольку экстремальные идеологии продолжают расти в популярности и силе по всему миру, страны, которые не соответствуют какой -либо идеологии, выдвигаются все дальше и дальше в угол, и нет куда идти. В рамках этой группы стран мы должны заключить пакт о взаимной обороне в случае, когда кто -либо из нас вторгается, мы все можем вмешаться и попробовать все возможное, чтобы справиться с иностранной угрозой."
 ARG_pass_the_national_territory_act: "Принять в действие Закон о национальной территории"
 ARG_pass_the_national_territory_act_desc: "Учитывая огромное количество национальных территорий, которые у нас все еще есть в стране, было бы более выгодным как для страны, так и для нашего народа, если мы приняли Закон о национальной территории, который автоматически объявит каждую национальную территорию как официальную провинцию [ARG.GetName]"
 ARG_invest_in_our_universities: "Инвестировать в наши университеты"
 ARG_invest_in_our_universities_desc: "Каждый аргентинец должен иметь право на свободное и надлежащее образование, независимо от обстоятельств!"
 ARG_establish_hydroelectric_powerplants: "Установить гидроэлектростанцию"
 ARG_establish_hydroelectric_powerplants_desc: "Гидроэлектростанция растут в последние последние десятилетия. Это источник возобновляемой энергии, который производит большое количество электроэнергии, учитывая ресурсы, необходимые для его построения. Аргентина может извлечь большую пользу от этого нового источника энергии в стране."
 ARG_officialize_the_defense_council: "Официально использовать совет обороны"
 ARG_officialize_the_defense_council_desc: "До сих пор Совет обороны был всего лишь чем -то взаимным между нами, но, возможно, мы должны сделать его официальным для мира, что мы стоим вместе. Таким образом, любая иностранная сила, которая потенциально бы рассматривала нас как простые выборы, подумала бы дважды."
 ARG_planting_our_foot: "Посадка нашей ноги вниз"
 ARG_planting_our_foot_desc: "Пришло время наступить вещи прямо в нашей иностранной политике, и сообщить окружающим, что мы имеем в виду бизнес."
 ARG_mutual_arms_purchase: "Покупка взаимных оружия"
 ARG_mutual_arms_purchase_desc: "Чтобы повысить как наши экономики, так и военные, мы должны приобрести пехотное оборудование друг у друга, а также стараться изо всех сил торговать исключительно друг с другом."
 ARG_military_exercises: "Военные учения"
 ARG_military_exercises_desc: "Если мы не будем заниматься военными должным образом, то каким хорошим они могли бы быть, когда настоящая сделка достигнет?"
 ARG_mutual_economic_aid: "Взаимная экономическая помощь"
 ARG_mutual_economic_aid_desc: "Если у всех нас в конечном итоге есть более сильные отрасли, это даст нам лучшие шансы на то, чтобы защитить себя в случае иностранного вторжения."
 ARG_combined_resource_extraction_efforts: "Объединенные усилия по извлечению ресурсов"
 ARG_combined_resource_extraction_efforts_desc: "Наши страны заполнены до краев ресурсами. Если мы сможем использовать их в полной мере, мы можем значительно улучшить нашу экономику."
 ARG_prepare_the_liberating_army: "Подготовить освобождающую армию"
 ARG_prepare_the_liberating_army_desc: "Мы выставем армию, подходящую для того, чтобы освободить тех, кто эксплуатируется под грязными схемами капиталистов и фашистов."
 ARG_offensive_military_buildup: "Наступательное военное накопление"
 ARG_offensive_military_buildup_desc: "Нам нужно столько военного производства, сколько мы можем получить. Чем больше производства, тем лучше."
 ARG_asian_theatre: "Азиатский театр"
 ARG_asian_theatre_desc: "Поскольку южноамериканская сторона, в основном очищенной, мы можем начать освобождать тех, кто в Азии. Многие подвергаются насилию, когда мы говорим, и мы должны это остановить."
 ARG_naval_investments: "Военно -морские инвестиции"
 ARG_naval_investments_desc: "Нам требуется большой, мощный флот, чтобы взять на себя потенциальных будущих врагов с способными флотами."
 ARG_reinforced_navy: "Усиленный флот"
 ARG_reinforced_navy_desc: "Благодаря растущему флоту, нам нужно правильно укрепить как его производство, так и материалы, чтобы убедиться, что он остается в курсе."
 ARG_filipino_landing_base: "Филиппинская посадочная база"
 ARG_filipino_landing_base_desc: "Видя, что американцы являются нашей главной угрозой, мы могли бы использовать Филиппины в качестве базы посадки, чтобы затем нацелиться на другие окружающие страны, такие как Австралия и Япония, а также наносит огромный удар по США."
 ARG_a_worthy_navy: "Достойный флот"
 ARG_a_worthy_navy_desc: "Наш военно -морской флот наконец достиг уровня, который мы можем считать достойными. Те, кто придет против этого, больше никогда не увидят свет!"
 ARG_demand_easter_island: "Требуют британских владений"
 ARG_demand_easter_island_desc: "Британцы держат многие из наших законных территорий. Либо они передают их мирно, либо мы принимаем их силой!"
 ARG_coastal_asian_claims: "Претензии на Азию"
 ARG_coastal_asian_claims_desc: "Многие из наших азиатских товарищей страдают под трудностями капитализма и фашистских тоталитарных диктатур. Они заслуживают спасения, и мы можем принести им это спасение."
 ARG_south_american_theatre: "Южноамериканский театр"
 ARG_south_american_theatre_desc: "Сначала мы должны сосредоточиться на пределах нашего собственного континента и убедиться, что наши братья и сестры освобождены."
 ARG_liberate_uruguay: "Освободить Уругвай"
 ARG_liberate_uruguay_desc: "Уругвайский народ разделяет для нас много подобных черт, и они заслуживают спасения от таких, как Терра и другие диктаторы до него!"
 ARG_liberate_paraguay: "Освободить Парагвай"
 ARG_liberate_paraguay_desc: "Видеть борьбу Парагвая с некомпетентным лидером после некомпетентного лидера, душераздирающе. Поистине, парагвайский народ заслуживает лучшего."
 ARG_form_the_posadist_la_plata: "Образуйте полядист la plata"
 ARG_form_the_posadist_la_plata_desc: "Теперь, когда мы захватили и Уругвай, и Парагвай, мы можем официально объявить себя революционной Ла Платой, страной, родившейся от освобождения и криков помощи, и будет продолжать бродя о тех голодных подонках, которые осмеливаются назвать себя «лидером людей»."
 ARG_focus_on_second_cisplatine_war: "Вторая цисплатиновая война"
 ARG_focus_on_second_cisplatine_war_desc: "К сожалению, бразильское правительство и люди не могут понять, что мы просто пытаемся помочь уругвайцам. Хорошо, похоже, наше освобождение бразильца на юге придет раньше, чем ожидалось."
 ARG_demand_the_patagonia: "Требовать остальной патагонии"
 ARG_demand_the_patagonia_desc: "Чилийское правительство сделало много вещей с чилийцами, и тем более для Мапуче на юге. Они оба заслуживают лучшего, и мы позаботимся о том, чтобы убогое правительство это знало!"
 ARG_patagonic_resource_exploitation: "Патагоническая эксплуатация ресурсов"
 ARG_patagonic_resource_exploitation_desc: "Мы много лет знали, что Патагония была грязно богата ресурсами. Давайте начнем инициативу использовать эти ресурсы и получить от них как можно больше преимуществ."
 ARG_4_year_patagonic_plan: "4 -летний патагонический план"
 ARG_4_year_patagonic_plan_desc: "Патагония, по сравнению с остальной частью страны, крайне недостаточно развита. Там не так много людей, и общая индустрия отсутствует. 4 -летний план, посвященный построению Патагонии, должен не только поднять его до стандартов, найденных в остальной части страны, но и помочь нам использовать ресурсы, найденные там."
 ARG_patagonic_nuclear_campaign: "Патагоническая ядерная кампания"
 ARG_patagonic_nuclear_campaign_desc: "Теперь, когда Патагония соответствует необходимым стандартам, мы можем начать разработку и тестирование ядерных, чтобы дополнительно улучшить нашу ядерную программу."
 ARG_european_theatre: "Европейский театр"
 ARG_european_theatre_desc: "В основном с Азией и Южной Америкой мы можем взглянуть на основную проблему по под рукой: Европа. Место рождения коммунизма, а также место рождения трудностей и страданий, которые привели к такой идеологии. Мы будем теми, кто наконец -то освободит их раз и навсегда."
 ARG_a_red_world: "Красный мир"
 ARG_a_red_world_desc: "Теперь мы видим новую эру человечества, которая не пронизана позорными лидерами, коррумпированными политиками и небезопасными диктаторами. Мы смотрим на мир, которого заслуживает Земля, идеалы, которые приведут нас вперед, и эпоху технологических достижений, социальных достижений, наряду с миром и процветанием!"
 ARG_partido_socialista: "Partido Socialista"
 ARG_partido_socialista_desc: "Социалистическая партия, возглавляемая Николасом Репеетто, до сих пор значительно зарекомендовала себя, с множеством лидеров и политиков, поддерживающих свое дело. Это требует лучшего капитализма и лучшего из коммунизма, объединяя его в то, что мы можем назвать умеренной социал -демократией. В настоящее время из всех 3 партий у нас есть наименьшая поддержка, но с достаточными усилиями, которые скоро могут измениться."
 ARG_anti_corruption_effort: "Антикоррупционные усилия"
 ARG_anti_corruption_effort_desc: "В течение десятилетий у Аргентины была долговечная проблема с коррупцией. Элиты, олигархи и политики все помогали друг другу за кулисами, размышляя о том, каким может быть следующий шаг, чтобы еще больше заполнить их карманы. Это скоро изменится, и мы позаботимся об этом! Даже если это приведет к тому, что они восстают против нас!"
 ARG_clamp_down_on_the_corruption: "Зажимать коррупцию"
 ARG_clamp_down_on_the_corruption_desc: "Теперь, когда мы имели дело с большинством из тех, кто ответственен за интриги за спиной, мы можем хорошо и по -настоящему передать окончательные реформы раз и навсегда очистить эту страну от этой презренной коррупции, которая так долго мучила нас."
 ARG_work_with_the_oligarchs: "Работать с олигархами"
 ARG_work_with_the_oligarchs_desc: "Вместо того, чтобы бороться с коррупцией, почему бы не присоединиться к ней? В конце концов, это не просто сущность, на которую мы можем физически нацелиться, поэтому борьба с «концепцией» в значительной степени невозможно. Что невозможно, так это сотрудничество с олигархами и получает свои собственные выгоды от этой сущности."
 ARG_establish_political_connections: "Установить политические связи"
 ARG_establish_political_connections_desc: "Когда мы стоим, мы никто. Никто не воспринимает нас всерьез, и если мы хотим победить на предстоящих выборах, нам нужно установить много политических связей, чтобы получить достаточное признание, чтобы, по крайней мере, воспринимать серьезно."
 ARG_gain_congressional_recognition: "Получить признание Конгресса"
 ARG_gain_congressional_recognition_desc: "Теперь, когда мы должным образом зарекомендовали себя в политическом спектре, пришло время начнут завоевать места в Конгрессе и по -настоящему зарекомендовать себя как грозной политической партии."
 ARG_focus_on_securing_empty_provinces: "Сосредоточьтесь на обеспечении пустых провинций"
 ARG_focus_on_securing_empty_provinces_desc: "Наше внимание к текущим выборам должно заключаться в том, чтобы обеспечить голосование в провинциях, которые еще не приняли решение о том, за кого голосовать."
 ARG_focus_on_challenging_other_parties: "Сосредоточьтесь на вызов другим сторонам"
 ARG_focus_on_challenging_other_parties_desc: "Наше внимание к нынешним выборам должно заключаться в том, чтобы убедиться, что победить в голосовании за те провинции, которые уже зарекомендовали себя с стороной."
 ARG_increase_sabottinis_influence: "Держите Хосе П. Тамборини"
 ARG_increase_sabottinis_influence_desc: "Нет необходимости менять текущую фигуру нашей партии. Тамборини преуспел в выступлении по всей стране и завоеванию сердца аргентинцев. По нашей нынешней ставке мы уверены в победе на выборах."
 ARG_honorio_pueyrredon: "Назначить почетный Пуэйрредон"
 ARG_honorio_pueyrredon_desc: "Вернувшись из изгнания, многие внутри партии предложили и умоляли назначить Пуййрредон главной фигурой и лидером партии, утверждая, что его идеалы обязательно выдвинут эту страну."
 ARG_reorganize_the_cabinet: "Реорганизовать шкаф"
 ARG_reorganize_the_cabinet_desc: "Нынешний шкаф просто не подходит для наших идеалов и стиля лидера. Нам нужно изменить некоторые вещи, чтобы должным образом координировать с нашими методиками."
 ARG_empower_t_de_alvear: "Расширить T. de Alvear"
 ARG_empower_t_de_alvear_desc: "Как мы говорим, Т. де Альвир в настоящее время выступает в речи в Буэнос -Айресе, благодаря тем, кто обещал проголосовать за него на предстоящих выборах. Такой респектабельный лидер, который уже возглавлял страну, наверняка должен быть тем, кто представляет нас и наши идеалы."
 ARG_reinstate_the_PAN: "Восстановите кастрюлю"
 ARG_reinstate_the_PAN_desc: "Пан, известная ранее как Partido Autonomista Nacional, была правящей политической партией Аргентины с 1874 по 1916 год. В 1880 году Хулио Аргентино Рока вступил в президенты в соответствии с «Миром и администрацией». Хотя нельзя отрицать, что у Хулио Аргентино Рока была справедливая доля противоречий, особенно учитывая завоевание пустыни, также нельзя отрицать все великие вещи, которые он сделал для этой страны, и такая идеология наверняка поможет нам даже сейчас."
 ARG_stabilize_the_country: "Стабилизировать страну"
 ARG_stabilize_the_country_desc: "Теперь, когда мы приняли власть, мы должны сделать все возможное, чтобы правильно стабилизировать внутреннюю работу этой страны и справиться с проблемами и бедствиями, которые были вызваны печально известным десятилетием. Это займет некоторое время, но аргентинцы будут благодарить нас за это в долгосрочной перспективе."
 ARG_calmp_down_on_the_socialists: "Зажимать социалистов"
 ARG_calmp_down_on_the_socialists_desc: "С нашим нынешним правым правительством оппозиция обратилась к левым социалистам, чтобы противостоять нам. Мы должны остановить их достижения, прежде чем они получит слишком много власти и бросит нам вызов."
 ARG_a_country_of_immigrants: "Страна иммигрантов"
 ARG_a_country_of_immigrants_desc: "Даже при рассмотрении ранней истории Аргентина всегда была страной иммигрантов, так же, как Соединенные Штаты. Мы получали иммигранты из Германии, Италии, Испании, России, даже в Османской империи уже десятилетиями. Не только это, но и наша культура, и даже архитектура были сформированы и сильно повлияли бесчисленное количество иммигрантов, которые приехали в страну, и это не изменится сейчас и в будущем."
 ARG_construction_company_investments: "Строительная компания инвестиции"
 ARG_construction_company_investments_desc: "Наши строительные компании - это то, что сохраняет большую часть нашей отрасли и экономики на плаву, без них мы не будем ничем. Они требуют увеличения средств и инвестиций, чтобы получить больший объем производства и еще больше повысить нашу экономику."
 ARG_improve_public_transport: "Улучшить общественный транспорт"
 ARG_improve_public_transport_desc: "Общественный транспорт всегда был чем -то очень важным в Аргентине и для аргентинцев. Нынешняя система адекватна, но могут быть внесены различные изменения для улучшения его маршрутизации и эффективности."
 ARG_depoliticize_the_military: "Деполитизировать военные"
 ARG_depoliticize_the_military_desc: "С почти рождения этой страны военные всегда имели право голоса в аргентинской политике. Хотя иногда это может быть хорошо, великое большинство из них были ужасными, оставив эту страну в руинах. Это больше не будет длиться, и военные больше не должны иметь права голоса в нашей политике, даже если это приведет к восстанию!"
 ARG_cave_to_the_army: "Пещера армии"
 ARG_cave_to_the_army_desc: "У армии просто слишком много силы, чтобы пойти против этого. Мы ничего не можем по -настоящему сделать с этим, не получая обратной реакции и потенциального переворота против нас. Пещеры им - наш лучший курс действий."
 ARG_italian_engineering: "Итальянская инженерия"
 ARG_italian_engineering_desc: "В рамках множества итальянских иммигрантов, которые прибыли в [ARG.GetName], некоторые являются уважаемыми инженерами, способными производить множество прекрасных фрагментов архитектуры. Мы должны в полной мере воспользоваться этими интеллектами и помочь нашей стране расти еще дальше."
 ARG_promises_of_new_projects: "Обещания новых проектов"
 ARG_promises_of_new_projects_desc: "По мере того, как предстоящий день выборов приближается, нам нужно сделать все возможное, чтобы получить как можно больше голосов на нашей стороне. Хотя это правда, что у нас есть лидерство, это может очень быстро измениться, и мы должны убедиться, что этого не произойдет."
 ARG_the_question_of_leadership: "Вопрос о лидерстве"
 ARG_the_question_of_leadership_desc: "Аналяизируя внутреннюю работу нашей собственной политической партии, выявляется вопрос: кто будет главным представителем нашей политической партии? У нас есть различные варианты, каждый из которых имеет свои прекрасные навыки и знания, поэтому мы должны тщательно выбирать."
 ARG_make_use_of_our_political_power: "Использовать нашу политическую власть"
 ARG_make_use_of_our_political_power_desc: "Мы обеспечили хорошее отверстие голосов в стране, что предоставило нам много власти над нашей политикой. Мы должны использовать это в наших интересах и ужесточить нашу контроль над политикой этой страны."
 ARG_leopoldo_melo_for_president: "Леопольдо Мело для президента"
 ARG_leopoldo_melo_for_president_desc: "Леопольдо Мело был аргентинским адвокатом, дипломатом и политиком. Он был ведущей фигурой в Радикальном гражданском союзе, кандидатом на пост президента, а затем и министром внутренних дел. Такой прекрасный джентльмен, как и он, наверняка приведет эту страну к величию."
 ARG_expand_the_facultad_de_derecho: "Расширить фасолид де веречо"
 ARG_expand_the_facultad_de_derecho_desc: "Facultad de Derecho является юридическим факультетом, найденным в ограничениях UBA, Университета Буэнос -Айреса. Этот факультет в UBA, которого уважали за обучение и качественное образование и качество, получили большую похвалу за эти годы. Расширение его и финансирование еще дальше может привести к лучшему адвокатам и потенциальным политикам, чтобы привести эту страну к еще большим делам!"
 ARG_robustiano_for_president: "Рорудиано для президента"
 ARG_robustiano_for_president_desc: "Робустиано Патрин Костас был аргентинским политиком и бизнесменом, который занимал пост губернатора провинции Салты. Он также занимался политикой с 1912 года, имея более 2 десятилетий опыта в этой области. Такой опытный человек наверняка станет адекватным лидером для этой партии."
 ARG_company_subsidies: "Субсидии компании"
 ARG_company_subsidies_desc: "Различные компании по всей стране просят субсидии, и кто мы должны отрицать их, когда они так много сделали для страны."
 ARG_deal_with_the_fradulent_charges: "Иметь дело с ошибочными обвинениями"
 ARG_deal_with_the_fradulent_charges_desc: "Многие из оппозиции требовали, чтобы мы стали чистыми с нашей предполагаемой «чужой» победой. Мы знаем правду, но, к сожалению, они убеждены, что мы вытащили некоторые схемы, чтобы обеспечить победу. Не волнуйтесь, мы позаботимся о том, чтобы справиться с этими обвинениями и придем в чистоту."
 ARG_anything_for_the_cure: "Что -нибудь для лечения"
 ARG_anything_for_the_cure_desc: "После регулярной проверки с врачом у Роберто был диагностирован диабет. Мы были уведомлены о том, что этот диабет, если он не обрабатывается должным образом, в конечном итоге приведет к тому, что он ослеп и заставит его уйти от власти. Мы должны сделать все возможное для безопасности и здоровья Гуранти Роберто."
 ARG_bring_in_american_doctors: "Привлечь американских врачей"
 ARG_bring_in_american_doctors_desc: "[USA.GetLeader] также был проинформирован о ситуации Роберто и готов помочь нам относиться к нему. Они могут отправить нам Рамона Катровиехо, уважаемого доктора как в Соединенных Штатах, так и в Испании. Надеюсь, он сможет помочь нам в состоянии Роберто."
 ARG_steps_in_the_right_direction: "Шаги в правильном направлении"
 ARG_steps_in_the_right_direction_desc: "Состояние Роберто медленно, но верно улучшается, и наши усилия начинают окупаться. При такой скорости мы можем полностью его вылечить!"
 ARG_looking_ahead: "Глядя в будущее"
 ARG_looking_ahead_desc: "Мы переворачиваем новый лист в аргентинской политике и истории. Мы должны посмотреть в будущее и посмотреть, что мы можем сделать, как страна, и как аргентинцы."
 ARG_formalize_the_GOU: "Формализовать Gou"
 ARG_formalize_the_GOU_desc: "Гоу, известный как Grupo de Oficiales Unidos, исторически был военным, сгруппированным в конце 1942 года, который в конечном итоге сверг правительство Рамона Кастильо в 1943 году. Наш нынешний лидер ужасно неумел, и мы должны положить этому конец!"
 ARG_secure_the_high_ranks: "Закрепить высокие ряды"
 ARG_secure_the_high_ranks_desc: "Офицеры высокого ранга в армии хорошо знают о хрупкой ситуации страны и, как и мы, готовы положить конец этому печальному правительству."
 ARG_blame_the_government: "Винить правительство"
 ARG_blame_the_government_desc: "Это правительство ничего не делало, кроме как вызовать проблемы снова и снова. Они виноваты во всем, что произошло, и аргентинские люди должны это знать."
 ARG_depose_getleader: "Свернуть [ROOT.GetLeader]"
 ARG_depose_getleader_desc: "Ситуация достигла своей точки кипения, у нас было достаточно [ROOT.GetLeader]. Пришло время, когда их правление некомпетентности выйдет внезапно, и мы будем тем, кто приведет эту страну к новой эре величия!"
 ARG_go_against_the_peronists: "Идти против перонистов"
 ARG_go_against_the_peronists_desc: "Вскоре после переворота многие по всей стране начали обращаться к Хуану Доминго Перону для спасения, видя, что его идеалы могут потенциально продвигать эту страну вперед и освободить ее от позора, который был печально известным десятилетием. Мы не можем позволить ни его, ни его сторонникам получить слишком много власти."
 ARG_imprison_peron: "Тюремное заключение Перон"
 ARG_imprison_peron_desc: "Это прошло достаточно долго! Перон представляет угрозу для нашего правила, и мы должны положить конец ему и быстро. В заключение его заключается в заключении явного ответа, даже если он приводит к протестам."
 ARG_consolidate_absolute_power: "Консолидировать абсолютную власть"
 ARG_consolidate_absolute_power_desc: "Поскольку перонисты имели дело, и никто не может бросить нам вызов, мы, наконец, можем полностью взять под контроль страну и править ее по своему вкусу. Аргентинские люди в конечном итоге поймут, что это был лучший курс действий."
 ARG_support_the_peronists: "Поддержите перонисты"
 ARG_support_the_peronists_desc: "Возможно, у Перона есть момент, может быть, он действительно единственный, кто может привести эту страну к славе. Этот военный фуле просто повторяет ошибки, которые мы совершали в прошлом, и повторение прошлого никогда не получится хорошо."
 ARG_demand_liberation: "Спрос на освобождение"
 ARG_demand_liberation_desc: "Эти чертовы ублюдки поняли, что угроза Перон представляет своему слабому, незначительному правлению и действовала вне линии, осознавая Перона с едва каким -либо предупреждением. Они скоро придут, чтобы сожалеть об этом решении!"
 ARG_deal_with_the_instability: "Иметь дело с нестабильностью"
 ARG_deal_with_the_instability_desc: "Наша политическая нестабильность продолжалась слишком долго. Пришло время раз и навсегда справиться с этим позором и, наконец, стабилизируется как страна."
 ARG_improved_mobilization: "Улучшенная мобилизация"
 ARG_improved_mobilization_desc: "Нам нужно улучшить нашу мобилизацию, если мы хотим выставить грозную армию."
 ARG_crack_down_on_our_generals: "Расстраивать наших генералов"
 ARG_crack_down_on_our_generals_desc: "Нам сообщили о интригах, стоящих за нашей спиной, различными генералами в наших рядах, и нам нужно выяснить, какие из них они являются, и быстро с ними справляются. Если все пойдет хорошо, то виновные будут должным образом рассмотрены, но если это пойдет не так, мы можем столкнуться с серьезными последствиями."
 ARG_andean_claims: "Андеи претензий"
 ARG_andean_claims_desc: "Большая часть Анд заполнена обильными ресурсами и промышленным потенциалом. Мы могли бы получить большую пользу от владения такими землями."
 ARG_al_amigo_todo_al_enemigo_nada: "§RAL Amigo, Todo; Al Enemigo, Ni Justicia§!"
 ARG_al_amigo_todo_al_enemigo_nada_desc: "Известная цитата сказала никто, кроме Хуана Доминго Перона, и та, которая несет серьезное убеждение. Наши враги заслуживают только худшего, но наши друзья и союзники, они заслуживают похвалы и поддержки на каждом этапе пути."
 ARG_capo_maximo_de_la_argentina: "Капо Максимо де ла Аргентина"
 ARG_capo_maximo_de_la_argentina_desc: "Точно так же, как Муссолини взял власть над страной, Перон взял на себя власть над Аргентиной и пообещал новую, процветную эру для Аргентины и ее людей. Вива Перон!"
 ARG_topple_the_bolivian_government: "Свергнуть правительство боливии"
 ARG_topple_the_bolivian_government_desc: "Боливийцы страдали слишком долго под их некомпетентными и безжалостными правительствами. Они будут намного лучше под нашим надзором."
 ARG_resource_exploitation: "Эксплуатация ресурсов"
 ARG_resource_exploitation_desc: "Наши земли полны ресурсов. Мы должны использовать их в полной мере и воспользоваться преимуществами, связанными с ним."
 ARG_a_traditional_approach: "Традиционный подход"
 ARG_a_traditional_approach_desc: "Мы не должны ничего менять в наших методиках и стиле правления. Хотя внешние идеалы могут быть полезными, мы должны придерживаться самого себя и оставаться с тем, что, как мы знаем, обязательно сработают."
 ARG_follow_mussolinis_principles: "Следуйте принципам Муссолини"
 ARG_follow_mussolinis_principles_desc: "Муссолини оказал большое влияние на [ARG.GetLeader], и его идеалы и правила могут быть очень полезными для нашей страны и того, как мы должны им управлять."
 ARG_mass_nationalization: "Массовая национализация"
 ARG_mass_nationalization_desc: "Аргентинские отрасли предназначены только для Аргентины и Аргентинца! Нам не нужен иностранец, чтобы взять под контроль наши компании и отрасли."
 ARG_italian_equipment_shipments: "Поставки итальянского оборудования"
 ARG_italian_equipment_shipments_desc: "Мы поставим запрос на различные типы итальянского оборудования. Их оборудование может служить очень полезным для нас в ближайшем будущем."
 ARG_form_the_camisas_negras: "Сформировать Camisas Negras"
 ARG_form_the_camisas_negras_desc: "Так же, как Италия имеет Camicie Nere, мы должны создать систему милиции под названием Camisas Negras, которая будет отвечать за защиту наших побережья в случае войны и удерживая их против нашего нынешнего правила в страхе."
 ARG_nadie_se_escapa: "§Rnadie se escapa§!"
 ARG_focus_on_the_major_powers: "Сосредоточиться на основных силах"
 ARG_focus_on_the_major_powers_desc: "По мере того, как наша армия и промышленное производство продолжает расти, так и наши амбиции. Мы можем начать смотреть на обеспечение места в основных рядах и бросить им вызов!"
 ARG_industria_extranjera: "Industria Extranjera"
 ARG_industria_extranjera_desc: "Вместо того, чтобы исчерпывать наши собственные ресурсы и отрасль, мы можем просто использовать те, кого победили и взяли."
 ARG_axis_equipment_shipping: "Оборудование оси"
 ARG_axis_equipment_shipping_desc: "Мы поставим запрос на различные типы оборудования из мощности оси, специально предназначенная [GER.GetName]. Их оборудование может оказаться очень полезным для нас!"
 ARG_dominance_in_the_americas: "Доминирование в Америке"
 ARG_dominance_in_the_americas_desc: "Поскольку наша сила и захват над континентом продолжают расти, так и наше влияние. В настоящее время единственная другая страна, которая может оспорить наше влияние, - это Соединенные Штаты, и мы не можем допустить, чтобы это произошло. Вскоре они рухнут!"
 ARG_shared_bank: "Общая банковская система"
 ARG_shared_bank_desc: "Наличие общей системы выпечки среди наших союзников может помочь нам экономически на протяжении всего альянса."
 ARG_a_new_south_american_era: "Новая южноамериканская эпоха"
 ARG_a_new_south_american_era_desc: "Наконец, мы можем с нетерпением ждать новой эры истории Южной Америки, новой главы нашей истории!"
 ARG_improved_conscription_laws: "Улучшенные законы о призывах"
 ARG_improved_conscription_laws_desc: "Нам нужно будет мобилизовать страну дальше, чтобы выставить надлежащую армию. Улучшение наших законов о призывах должно помочь этому."
 ARG_the_world_against_extremism: "Мир против экстремизма"
 ARG_the_world_against_extremism_desc: "Экстремизм захватил множество различных слоев мира, и, поскольку он рушится из -за этого, многие страны, которые смогли избежать этих экстремистских идеологий, начали вооружение и союзник, чтобы защитить себя от глобальной угрозы, и мы тоже должны!"
 ARG_equipment_capturing_techniques: "Методы захвата оборудования"
 ARG_equipment_capturing_techniques_desc: "Чтобы облегчить наше собственное производство оружия, мы могли бы уточнить методы захвата оборудования и использовать против них оружие противника."
 ARG_save_roberto: "Роберто для президента"
 ARG_save_roberto_desc: "Поскольку ситуация в Аргентине рушится, только один человек достаточно способен занять дело в свои руки, и этот человек - Роберто Мария Ортис. Известный своей стойкостью и песком, он обязательно выведет эту страну из нынешней ситуации, в которой она оказалась."
 ARG_kill_off_roberto: "Воспользуйтесь слабой ситуацией"
 ARG_kill_off_roberto_desc: "Поскольку страна ухудшается с каждым днем ​​и согласии в слабом месте, мы можем воспользоваться своим шансом сделать шаг и, наконец, изменить то, что не смогли прошлые лидеры!"
 ARG_commence_plans_for_the_coup: "Дестабилизировать нацию"
 ARG_commence_plans_for_the_coup_desc: "Теперь, когда хунта у власти мы можем по -настоящему начать наши планы, с Пероном. Все отчаянно ищут изменение, для решения, и мы те, кто обладает этим."
 ARG_roberto_leads_the_way: "Победа для согласования"
 ARG_roberto_leads_the_way_desc: "Как это было предназначено, согласность снова выиграла выборы, и, хотя Южо больше не будет вести, партия все равно останется у власти под руками Роберто. Пусть Бог направит нас к пути процветания."
 ARG_a_new_argentina: "Collo de Peron"
 ARG_a_new_argentina_desc: "Вива Перон! Viva La Patria!"
 ARG_launch_the_civil_war: "Розас увековечен"
 ARG_launch_the_civil_war_desc: "Хуан Мануэль де Росас, когда -то лидер аргентинской конфедерации почти столетие назад. В то время как он сейчас ушел, и только просто кости остаются из его трупа, его дух, менталитет и идеалы превосходят смертность и все это время жили, кульминацией которого мы сейчас делаем: возвращая Аргентину к своей прежней славе!"
 ARG_red_curtain_over_the_carribean: "Красная занавеска над Карибским морем"
 ARG_red_curtain_over_the_carribean_desc: "Коммунизм должен распространяться по странам Центральной Америки. Их люди слишком долго эксплуатировались капиталистами на севере и заслуживают лучшего."
 ARG_target_the_andes: "Нацеливаться на Анды"
 ARG_target_the_andes_desc: "Большая часть Анд заполнена обильными ресурсами и промышленным потенциалом. Мы могли бы получить большую пользу от владения такими землями."
 ARG_support_the_PS_comm: "Поддержка PS"
 ARG_support_the_PS_comm_desc: "Partido Socialista приносит на стол мирное решение нашей дилеммы. В этой революции нет необходимости пролить аргентинскую кровь. Давайте изменим, как революции видны по всему миру, и покажем миру, что мирная революция возможна!"
 ARG_prioritize_german_architecture: "Распределите приоритеты немецкой архитектуры"
 ARG_prioritize_german_architecture_desc: "Известно, что немцы более медленные строители, чем итальянцы, но их структуры гораздо более надежны, чем их итальянский аналог. Это повышение надежности и качества может существенно помочь нам в ближайшие годы."
 ARG_prioritize_italian_architecture: "Распределите приоритеты итальянской архитектуры"
 ARG_prioritize_italian_architecture_desc: "В то время как немцы занимают слишком много времени, чтобы построить одно здание, итальянцы уже построили 4. Их скорость и эффективность не являются аналогичными, и такая скорость может резко помочь нам в ближайшие годы."
 ARG_the_fourth_reich: "Четвертый рейх"
 ARG_the_fourth_reich_desc: "Поскольку родина все еще хорошо видно, нет никаких оправданий в преодолении того, что по праву является нашим. Черт возьми, [GER.GetLeader], ты заплатите за это! Я, [ARG.GetName], вернусь, сильнее, чем когда -либо! Они будут платить, чертовые коммунисты заплатят, все будут платить за то, что они сделали!"
 ARG_prepare_the_army_desc: "Сан -Мартин всегда представлял Аргентину в качестве конкуренции в Соединенных Штатах, повторяя его федерализм и официально называемый Объединенными провинциями Рио -де -ла -Плата. Это в итоге никогда не произошло, как Боливия, Парагвай и Уругвай, в итоге заявили о своей независимости, но это не значит, что это невозможно."
  
  
 ### PARAGUAY ### 
  # Industry # 
 PAR_kickstart_economy: "Разработать чако"
 PAR_kickstart_economy_desc: "После недавнего контроля над Чако очевидно, что регион недоразвит по сравнению с остальной частью страны, и нам нужно исправить это, если мы хотим в полной мере воспользоваться нашей недавно завоеванной землей."
 PAR_maintain_agrarian_dominance: "Поддерживать аграрное доминирование"
 PAR_maintain_agrarian_dominance_desc: "Как и многие другие страны региона, аграрное общество все еще используется и очень эффективно. Если это не сломано, то лучше не исправить это."
 PAR_laissez_faire: "Вернуться к подходу"
 PAR_laissez_faire_desc: "Рынок не должен быть ограничен какими -либо государственными правилами. Мы должны вернуться к неограниченному рынку."
 PAR_attract_american_investors: "Привлечь американских инвесторов"
 PAR_attract_american_investors_desc: "Поощрение инвесторов из Соединенных Штатов инвестировать в нашу экономику будет полезно."
 PAR_resource_extraction_effort: "Усилия по извлечению ресурсов"
 PAR_resource_extraction_effort_desc: "У нас есть много природных ресурсов. Оставить их неиспользованным было бы полной тратой. Таким образом, мы должны приложить усилия, чтобы их извлечь."
 PAR_lift_market_restrictions: "Ограничения рынка подъема"
 PAR_lift_market_restrictions_desc: "Предыдущие правительства наложили много ограничений на текущий рынок, что ограничивает его истинный потенциал и не позволяет ему расти и репутация. У нас есть возможность изменить это, и мы будем делать как таковые."
 PAR_properly_adopt_laissez_faire: "Правильно принять модель Laissez-Faire"
 PAR_properly_adopt_laissez_faire_desc: "Из -за негативной реакции, которую мы получили от парагвайского народа, мы не смогли правильно установить экономику Laissez Faire. Тем не менее, ситуация улучшилась в лучшую сторону, и люди привыкли к более освобожденной экономике, и мы, наконец, можем установить правильную экономику Laissez Faire."
 PAR_subsidize_the_industry: "Субсидировать отрасль"
 PAR_subsidize_the_industry_desc: "Наша экономика была застойна в течение последних нескольких лет, и недавний конфликт в Chaco не помогал нашему делу. Если мы хотим возродить экономику, нам, возможно, придется вручную субсидировать различные сектора экономики, как государственных, так и частных, чтобы переопределить ее и вернуть ее к тому, что было раньше."
 PAR_expand_universities: "Расширить университеты"
 PAR_expand_universities_desc: "Расширение наших университетов позволит большему количеству студентов получить надлежащее образование и потенциально продвигать технологические достижения страны."
 PAR_push_agrarian_reforms: "Протолкнуть аграрные реформы"
 PAR_push_agrarian_reforms_desc: "Как указано в [ROOT.GetLeader], в аграрном секторе нашей отрасли будут проходить различные реформы для увеличения производства и улучшения условий работников."
 PAR_industrial_buildup: "Промышленное наращивание"
 PAR_industrial_buildup_desc: "По мере того, как наша экономика цветут, мы должны наращивать промышленность, чтобы поддержать экономику и не позволить ей снова стагнировать."
 PAR_develop_western_paraguay: "Развивать западный парагвай"
 PAR_develop_western_paraguay_desc: "Западный Парагвой является сердцем парагвайской промышленности. Улучшение и расширение его промышленных возможностей позволит экономике расти еще дальше."
 PAR_commence_paraguayan_mobilization: "Начало мобилизации парагвайцев"
 PAR_commence_paraguayan_mobilization_desc: "С военными в руинах, нам необходимо повторно обмениваться мобилизацией и расширить армию, чтобы ни одна страна не могла воспользоваться нами."
 PAR_increased_military_production: "Увеличение военного производства"
 PAR_increased_military_production_desc: "С увеличением военного производства мы сможем производить больше вооружений для наших солдат и правильно их выставить."
 PAR_open_our_markets: "Откройте наши рынки"
 PAR_open_our_markets_desc: "Если мы хотим, чтобы наши соседи и остальной мир покупали наши товары, нам нужно открыть наши рынки для мира и позволить всем и каждому покупать то, что мы производим."
 PAR_industrial_agriculture: "Промышленное сельское хозяйство"
 PAR_industrial_agriculture_desc: "Чтобы иметь процветающий сельскохозяйственный сектор, вам нужен надлежащий промышленный сектор, чтобы сопровождать его."
 PAR_allow_foreign_investment: "Разрешить иностранные инвестиции"
 PAR_allow_foreign_investment_desc: "Есть много стран, готовых инвестировать в нашу экономику ... или, по крайней мере, мы надеемся, что есть. В любом случае, мы должны разрешить иностранные инвестиции в случае, когда страна решает инвестировать в нашу экономику."
 PAR_invest_in_our_nations_professors: "Инвестировать в профессоров нашей страны"
 PAR_invest_in_our_nations_professors_desc: "Нет необходимости полагаться на приглашение профессоров из других стран приехать в Парагвай. У нас есть ресурсы, чтобы сами улучшить нашу систему образования."
 PAR_invite_foreign_professors: "Пригласить иностранных профессоров"
 PAR_invite_foreign_professors_desc: "Если мы хотим улучшить качество нашей системы образования, мы должны пригласить более опытных и хорошо образованных профессоров из других стран, которые имеют больше образовательных ресурсов, чем у нас в настоящее время."
 PAR_heavy_military_investments: "Тяжелые военные инвестиции"
 PAR_heavy_military_investments_desc: "Нам нужно инвестировать основные средства в военные, чтобы надлежащим образом выставить его и поддерживать армию, способную противостоять себе."
 PAR_develop_capital: "Развивать капитал"
 PAR_develop_capital_desc: "За то, что быть столицей нашей страны, Асунсьон довольно недостаточно развит. Давайте исправим это."
 PAR_electrical_grid: "Paraguayan Power Grid"
 PAR_electrical_grid_desc: "Если мы хотим добиться технологических достижений, мы должны сначала построить энергетическую сетку. В противном случае невозможно продвинуть нашу технологию."
  
 #PAR_ = Political Tree owo 
 PAR_fight_for_our_freedom: "Бороться за нашу свободу"
 PAR_fight_for_our_freedom_desc: "Как мы говорим, многие сектора армии пытаются снять нас с власти и места Рафаэля Франко во власти! Суверенитет этой страны находится в опасности, и нам нужно бороться за нашу свободу, независимо от стоимости!"
 PAR_support_the_revolution: "Поддерживать революцию"
 PAR_support_the_revolution_desc: "Если так много разных секторов как военного, так и гражданского населения выступают против нынешней либеральной демократии, то кажется логичным, что что -то серьезно не так с нынешним правительством. Мы будем на стороне революционеров и поместим Рафаэль Франко во власти!"
 PAR_disband_the_army: "Распустить армию"
 PAR_disband_the_army_desc: "Нынешняя армия оказалась нынешней опасностью для позиции [ROOT.GetLeader] в правительстве. Расхождение армии, возможно, может быть лучшим решением."
 PAR_limit_francos_power: "Ограничить силу Рафаэля Франко"
 PAR_limit_francos_power_desc: "Рафаэль Франко слишком долго был обременительной головной болью. Нам нужно избавиться от него как можно скорее."
 PAR_rally_the_people: "Сплоть людей"
 PAR_rally_the_people_desc: "Люди знают, что для них хорошо. Если они в конечном итоге пойдут с Франко, это только повредит им в долгосрочной перспективе. Мы обязательно сохраним их права и свободы в безопасности."
 PAR_restructure_the_country: "Реструктуризация страны"
 PAR_restructure_the_country_desc: "Несмотря на то, что мы решили непосредственную проблему, в стране все еще есть много, которые в сторону с Франко и ненавидят наше правительство. Нам нужно завоевать их сердца, если мы хотим продолжить."
 PAR_imprison_franco: "Заключить в тюрьму Рафаэль Франко"
 PAR_imprison_franco_desc: "Франко слишком долго был шипучком на нашей стороне. Пришло время раз и навсегда иметь дело с ним."
 PAR_hold_national_elections: "Провести национальные выборы"
 PAR_hold_national_elections_desc: "Демократическая нация без выборов может также быть диктатурой. Мы должны установить выборы и позволить народу Парагвая голосовать."
 PAR_free_the_press: "Освободить прессу"
 PAR_free_the_press_desc: "Журналисты Paraguay заслуживают свободы информировать массы без цензуры."
 PAR_ban_communism: "Запретить коммунизм"
 PAR_ban_communism_desc: "Коммунизм не имеет места в Парагвае. Мы должны исключить эту грязную идеологию от нашей нации."
 PAR_final_reforms: "Окончательные реформы"
 PAR_final_reforms_desc: "Страна наконец достигает точки мира и стабильности. Мы проведем окончательные реформы, чтобы правильно структурировать политический спектр в стране."
 PAR_expand_on_native_rights: "Расширить права на коренные права"
 PAR_expand_on_native_rights_desc: "В нашей стране все еще есть много местных черт и происхождения. Гуарани по -прежнему является одним из наших официальных языков, и многие коренные племена проживают в нашей стране. Они заслуживают того, чтобы иметь те же права, что и у парагвайцев, потому что они тоже парагвайцы."
 PAR_open_our_foreign_policy: "Откройте нашу внешнюю политику"
 PAR_open_our_foreign_policy_desc: "Пришло время начать сосредоточиться на нашей внешней политике и посмотреть, в каких странах мы должны подходить и к каким странам мы должны уйти."
 PAR_join_the_allies_euyl: "Присоединяйтесь к союзникам"
 PAR_join_the_allies_euyl_desc: "Союзники - это то, что представляют свободу и процветание, борясь против злого зла этого мира. Мы присоединимся к их делу."
 PAR_go_our_own_way: "Идти своим путем"
 PAR_go_our_own_way_desc: "Никто не невиновен на этой планете, особенно не в союзных способностях. Они утверждают, что сражаются за мир, но сами совершили много грехов. Мы можем только доверять себе."
 PAR_invest_in_nuclear_studies: "Инвестировать в ядерные исследования"
 PAR_invest_in_nuclear_studies_desc: "Поле ядерных наук является многообещающим. Если мы инвестируем исследования в ядерную энергию, мы можем научиться использовать ее в будущем."
 PAR_harness_nuclear_energy: "Использовать ядерную энергию"
 PAR_harness_nuclear_energy_desc: "Использование власти ядерной энергии поможет нам в процветании и технологическом прогрессе нашей страны ... и, возможно, поможет нам в других аспектах."
 PAR_rocket_studies: "Ракетные исследования"
 PAR_rocket_studies_desc: "Рактивная наука - это увлекательная область. Инвестирование в исследования в это будет полезно для продвижения нашего мастерства технологической войны."
 PAR_purchase_formosa: "Покупка Formosa"
 PAR_purchase_formosa_desc: "Приобретение Formosa значительно повысит нашу отрасль, доверие и национальную мощь. Пока мы предлагаем значительную сумму для Formosa, мы уверены, что аргентинцы примут."
 PAR_import_british_weaponry: "Импортировать британское оружие"
 PAR_import_british_weaponry_desc: "Британцы известны своим превосходным оружием. Мы должны предложить купить некоторые из их вооружений, чтобы улучшить нашу собственную армию."
 PAR_study_the_british_navy: "Изучить британский флот"
 PAR_study_the_british_navy_desc: "Королевский флот широко считается самым сильным военно -морским флотом на планете. Изучение такого военно -морского флота очень поможет нам, и нам нужно, учитывая скудное состояние нашего нынешнего флота."
 PAR_strengthen_ties_with_us: "Укрепить связи с США"
 PAR_strengthen_ties_with_us_desc: "Наличие такого сильного союзника, как Соединенные Штаты, было бы как полезным, так и стратегическим."
 PAR_aid_in_european_front: "Помощь в европейском фронте"
 PAR_aid_in_european_front_desc: "Союзникам нужна столько помощи, сколько они могут вернуться дома. Нам нужно снабжать их любым оборудованием, которое мы можем иметь."
 PAR_expand_conscription: "Расширить призыв"
 PAR_expand_conscription_desc: "Нам нужно расширить наш призыва, чтобы выставить больше людей и похвастаться большей и более сильной армией."
 PAR_work_on_south_american_relations: "Работа над отношениями Южной Америки"
 PAR_work_on_south_american_relations_desc: "У наших соседей есть много черт, которые можно похвастаться, многие из которых могут быть очень полезны для нас. Поддержание хороших отношений с нашими непосредственными соседями принесет множество положительных последствий как для нас, так и для наших соседей."
 PAR_make_amends: "Исправить с бывшими соперниками"
 PAR_make_amends_desc: "Наши прошлые конфронтации с другими странами, несомненно, вызвали напряженность между нами. Пришло время помириться с ними и найти еще немного земли."
 PAR_invite_south_america: "Пригласить Южную Америку"
 PAR_invite_south_america_desc: "Страны Южной Америки объединены одним континентом. Мы должны работать вместе с нашими коллегами -соседями из Южной Америки через единство, а не конфликт."
 PAR_economic_coop_with_allies: "Экономическое сотрудничество с нашими союзниками"
 PAR_economic_coop_with_allies_desc: "Экономическое сотрудничество с нашими союзниками приносит пользу не только нам, но и им. Это беспроигрышная ситуация."
 PAR_fight_communism: "Бойся коммунизм в Южной Америке"
 PAR_fight_communism_desc: "Коммунистическая идеология быстро распространяется в разные страны, и она даже достигла Америки. Мы должны помешать коммунизму взять какой -либо контроль в Южной Америке."
 PAR_fight_fascism: "Бой фашизм в Южной Америке"
 PAR_fight_fascism_desc: "Фашизм противостоит нашим ценностям, и у него нет бизнеса, имея никакого присутствия на нашем континенте. Мы должны раз и навсегда топать его из Южной Америки."
 PAR_a_new_south_america: "Новая Южная Америка"
 PAR_a_new_south_america_desc: "Страны Южной Америки слишком долго боролись. Мы должны работать вместе с нашими коллегами из Южной Америки, чтобы доказать остальному миру, что мы можем преодолеть раздоры и процветать как континент."
 PAR_solidify_control: "Затвердеть контроль"
 PAR_solidify_control_desc: "Теперь, когда мы взяли под контроль нацию, мы должны должным образом установить себя и обеспечить, чтобы никто ничего не пытался в нашем новом правительстве."
 PAR_establish_labor_reforms: "Установить трудовые реформы"
 PAR_establish_labor_reforms_desc: "Франко считает, что рабочий, проживающий в Парагвае, недопредставлен. Тот, кто работает, должен рассматриваться как национальный герой, неся страну на своей спине и приближая ее на шаг ближе к значительной региональной власти."
 PAR_go_against_right_wing: "Идти против правых революционеров"
 PAR_go_against_right_wing_desc: "В то время как Франко не является лучшим решением для страны, ни тех, кто не является правым подонками, утверждая, что они знают, как решить страну. Нет, нам нужен кто -то с песчаной, кто -то с мощью, кто -то, кто может выдвинуть эту страну вперед и сделать всех по -настоящему равными, где ни один парагвайец не больше, чем другой."
 PAR_support_right_wing: "Поддерживать правые революционеры"
 PAR_support_right_wing_desc: "Франко - это не решение этой страны, которую нуждается в этой стране, нет, нам нужен кто -то, кто сильна и может продвигать эту страну через решимость и силу. Нам нужен сильный лидер, которого опасается, но любил."
 PAR_promote_morinigo: "Продвигайте Higinio Morínigo"
 PAR_promote_morinigo_desc: "В последнее время Higinio Morinigo в последнее время растут, особенно среди правых сторонников. Они считают, что он будет хорошей заменой шутки, когда либеральное правительство в настоящее время находится у власти."
 PAR_go_with_franco: "Пойти с Франко"
 PAR_go_with_franco_desc: "Франко зарекомендовал себя как достойный лидер. Мы должны продолжать поддерживать его."
 PAR_go_against_franco: "Иди против Франко"
 PAR_go_against_franco_desc: "Мы думали, что можем доверять Франко как нашему новому лидеру, но он не справился с нашими ожиданиями. Мы не можем доверять ему, чтобы он продолжал эффективно лидировать Парагвай по этой скорости. Он должен идти."
 PAR_cooperate_with_oligarchs: "Сотрудничать с олигархами"
 PAR_cooperate_with_oligarchs_desc: "Денежные разговоры и конец оправдывает средства. Таким образом, нет никакого реального вреда в том, чтобы позволить нашим богатым друзьям выровнять наши карманы в обмен на высшее положение в политике парагвайцев - верно?"
 PAR_kindly_ask_for_gran_chaco: "Пожалуйста, попросите [994.GetName]"
 PAR_kindly_ask_for_gran_chaco_desc: "Контроль над [994.GetName] принесет нам пользу, но мы не собираемся захватывать контроль над ним через силу. Может быть, если мы спросим [BOL.GetName] за [994.GetName] достаточно вежливо, они будут руководить нам без необходимости конфликта?"
 PAR_open_new_schools: "Откройте новые школы"
 PAR_open_new_schools_desc: "На данный момент в Парагвае не хватает школ, чтобы должным образом приспособиться к нашему населению. Мы должны открыть больше школ, чтобы обеспечить более доступное образование для масс."
 PAR_expand_national_education: "Расширить национальное образование"
 PAR_expand_national_education_desc: "Мы не можем справиться с национальным образованием. Мы должны инвестировать в нашу систему образования и увеличить как количество, так и качество школ нашей страны."
 PAR_purchase_italian_aircraft: "Купить итальянские самолеты"
 PAR_purchase_italian_aircraft_desc: "Парагвай нуждается в мощной воздушной силе. Из -за этой дилеммы [ROOT.GetLeader] приказал отправить запрос на покупку различных итальянских самолетов, что составляет всего 60 самолетов."
 PAR_create_new_ministries: "Создать новые министерства"
 PAR_create_new_ministries_desc: "Несмотря на то, что в стране уже есть много министров, Франко считает, что нам нужно больше, чтобы удовлетворить текущие потребности страны и дать людям качество жизни, которого они заслуживают."
 PAR_seize_equipment_reserves: "Захватить запасы оборудования"
 PAR_seize_equipment_reserves_desc: "Либеральное правительство спрятало оружие в различных запасах по всей стране в случае худшего исхода. Мы должны воспользоваться этим и украсть эти резервы."
 PAR_la_patria_ante_todo: "§Rpatria o muerte§!"
 PAR_la_patria_ante_todo_desc: "Когда все кажется потерянным, всегда есть одна вещь, которая никогда не теряется: La Patria. Это последнее, что страна проигрывает, даже на грани краха, и это очень дорого. Патрия О Мюерте!"
 PAR_promote_barthe: "Продвигать Obdulio Barthe"
 PAR_promote_barthe_desc: "Обдулио является нынешним лидером Парагвайской коммунистической партии, и он будет наиболее подходит для контроля страны и заменить шутку о том, как мы в настоящее время имеем у власти."
 PAR_dissolve_the_legislature: "Растворить законодательный орган"
 PAR_dissolve_the_legislature_desc: "Видя, что законодательный орган может быть бременем, чтобы сохранить в долгосрочной перспективе, [ROOT.GetLeader] издал приказ, который многие никогда не думали, что видят, который должен полностью разобрать законодательный орган."
 PAR_restore_the_consitution_of_1870: "Восстановить конституцию 1870 года"
 PAR_restore_the_consitution_of_1870_desc: "Теперь, когда Франко больше нет у власти, мы можем начать уничтожать прошлые ошибки, которые он совершил. Одной из этих серьезных ошибок было отменить конституцию 1870 года, что мы должны убедиться, что станет слишком поздно."
 PAR_denounce_the_liberal_government: "Осудить либеральное правительство"
 PAR_denounce_the_liberal_government_desc: "Либеральное правительство заполнено тонкокожными анюмирующими анюмированием. Сильное правительство не может быть мягким."
 PAR_focus_on_national_matters: "Сосредоточиться на национальных вопросах"
 PAR_focus_on_national_matters_desc: "Многие против нас, многие из которых хотят свергнуть нас, даже убивают нас. Вот почему мы должны сначала сосредоточиться на национальных вопросах и обеспечить мир и стабильность в этой стране."
 PAR_improve_nationwide_infrastructure: "Улучшить общенациональную инфраструктуру"
 PAR_improve_nationwide_infrastructure_desc: "Наша инфраструктура может определенно привлечь внимание. Давайте поработаем над улучшением его в общенациональном масштабе."
 PAR_national_department_of_labor: "Национальный департамент труда"
 PAR_national_department_of_labor_desc: "Создание национального департамента труда позволит повысить гражданскую и промышленную производительность. Хорошее изменение, которое позволило бы нашей стране производить еще больше товаров и ресурсов."
 PAR_define_our_foreign_policy: "Определите нашу внешнюю политику"
 PAR_define_our_foreign_policy_desc: "Теперь, когда наша внутренняя политика устроилась, мы можем начать сосредоточиться за пределами наших границ."
 PAR_fully_abolish_the_1870_consitution: "Полностью отменить конституцию 1870 года"
 PAR_fully_abolish_the_1870_consitution_desc: "Ранее в нашем президентстве мы отменили Конституцию 1870 года. Тем не менее, мы все еще держали некоторые из его принципов активными. Мы полностью отменим любое и все влияние конституции 1870 года и заменим ее новой и улучшенной конституцией: парагвайская конституция [GetYear]."
 PAR_establish_the_committee_of_civilian_mobilization: "Комитет гражданской мобилизации"
 PAR_establish_the_committee_of_civilian_mobilization_desc: "Хотя наши военные значительны, учитывая наши населения Nubers, нам все еще нужно гораздо больше солдат, чтобы выставить надлежащую армию, которой могут быть опасаются окружающие нас. В этом отношении мы установим комитет по гражданской мобилизации, ответственный за набор гражданских лиц, которые подходят для военной службы и готовы умереть за La Patria."
 PAR_industrial_expansion: "Промышленное расширение"
 PAR_industrial_expansion_desc: "Нам понадобится сильная отрасль, чтобы поддержать растущих военных."
 PAR_the_influence_of_rafael_barrett: "Влияние Рафаэля Барретта"
 PAR_the_influence_of_rafael_barrett_desc: "Анархист Рафаэль Барретт и влиятельный поэт всегда находился под сильным влиянием анархиста Рафаэля Барретта и влиятельного поэта. Его идеалы по -прежнему ощущаются в Коммунистической партии, и это может иметь как взлеты, так и падения."
 PAR_looking_outwards: "Глядя наружу"
 PAR_looking_outwards_desc: "Пришло время начать смотреть за пределы. Мы еще многое должны сделать."
 PAR_empower_the_fascists: "Расширить возможности фашистов"
 PAR_empower_the_fascists_desc: "Мы стоим с фашистскими идеалами; Мы должны расширить возможности наших братьев -единомышленников, если мы хотим полностью установить фашистский парагвай."
 PAR_deport_the_fascists: "Депортировать фашистов"
 PAR_deport_the_fascists_desc: "Позволить фашизму вырасти до этого уровня было ошибкой. Если мы продолжим позволять этим сумасшедшим фашистам сохранить присутствие в Парагвае, они станут подлинной угрозой для нашей страны. Лучше всего, если мы покажем им дверь."
 PAR_la_primavera_democratica: "La Primavera Democratica"
 PAR_la_primavera_democratica_desc: "Поскольку поддержка демократии продолжает расти все больше и больше, поддержка полномасштабной демократической революции растет еще дальше. Теперь, когда выдающиеся демократические и коммунистические люди вернулись в страну, мы можем убрать [ROOT.GetLeader] и заставить его заплатить за все, что он сделал!"
 PAR_fascist_dictatorship: "Фашистская диктатура"
 PAR_fascist_dictatorship_desc: "Парагвайский народ может возражать против диктатуры, но пока они остаются послушными для [ROOT.GetLeader] и правительства, они узнают, что правительство знает, что лучше для них. Никакого критического мышления не требуется."
 PAR_commence_the_armament_project: "Начать проект вооружения"
 PAR_commence_the_armament_project_desc: "По мере роста нашей армии спрос на вооружения линейно увеличивается. Вот почему мы должны установить проект вооружения в каждом из наших военных целей."
 PAR_economic_reactivaiton: "Экономическая реактивация"
 PAR_economic_reactivaiton_desc: "Пришло время вернуть экономику и вернуть эту славную отрасль, которую мы когда -то имели много лет назад."
 PAR_no_sera_comunista_fascista_racista: "Нет Será Comunista, Ni Fashista, Ni Racista"
 PAR_no_sera_comunista_fascista_racista_desc: "Исходя из выступления самого Рафаэля Франко, он заявил, что Парагвай не будет коммунистическим, ни фашистским, ни расистским. Парагвай должен быть страной свободы и свободы, а не кровью и трудностей."
 PAR_military_investments: "Военные инвестиции"
 PAR_military_investments_desc: "Никакие военные не могут расти без надлежащей военной промышленности."
 PAR_formosan_development: "Формозан развитие"
 PAR_formosan_development_desc: "Теперь, когда мы контролируем Formosa, мы должны приложить усилия, чтобы разработать землю."
 PAR_join_the_british: "Присоединяйтесь к англичанам"
 PAR_join_the_british_desc: "Британцы помогали нам раньше, и теперь пришло время вернуть услугу и помочь им, даже если это не слишком много."
 PAR_join_the_germans: "Присоединяйтесь к немцам"
 PAR_join_the_germans_desc: "Хотя это может показаться глупым, сотрудничество с немцами может уйти довольно далеко. Даже с нашими разными идеалами мы можем заставить что -то работать."
 PAR_join_the_soviets: "Присоединяйтесь к Советам"
 PAR_join_the_soviets_desc: "Советы могут быть довольно огромной помощью как в военном, так и в экономическом отношении. С нашими подобными идеалами это должна быть прогулка для торта, чтобы попасть в Коммерс."
 PAR_economic_boost_from_our_allies: "Экономический рост наших союзников"
 PAR_economic_boost_from_our_allies_desc: "Наши союзники дали нам много экономических выгод, которые мы теперь можем использовать в наших преимуществах благодаря нашим дружеским отношениям."
 PAR_united_we_stand: "Юнайтед мы стоим"
 PAR_united_we_stand_desc: "Нам не нужно выходить из континента, чтобы найти WOR"
 PAR_diplomacy_over_bloodshed: "Дипломатия над кровопролитием"
 PAR_diplomacy_over_bloodshed_desc: "Война не оставляет ничего, кроме следа крови и скорбящих вдов с обеих сторон. Вместо насилия мы должны пойти по мирному пути. В конце концов, лучше заводить друзей, чем врагов."
 PAR_the_legacy_of_selano_lopez: "Наследие Солано Лопес"
 PAR_the_legacy_of_selano_lopez_desc: "Солано Лопес, которого многие парагвайцы считают национальным героем, ведут Парагвай к окончательной славе и в то же время окончательное поражение. У нас есть незаконченный бизнес, которому начал заниматься Лопесом, и тот, который мы закончим. Бразилия и Аргентина заплатят за все, что они сделали с нами!"
 PAR_political_cleanup: "Политическая очистка"
 PAR_political_cleanup_desc: "Есть еще много против нашего нынешнего правительства. Мы очистим этих паразитов, прежде чем они смогут сделать что -нибудь с нами."
 PAR_national_labor_unions: "Национальные профсоюзы"
 PAR_national_labor_unions_desc: "Чтобы повысить национальную производительность, мы будем создавать национальные профсоюзы для работников."
 PAR_red_banner_support: "Поддержка от Guión Rojo"
 PAR_red_banner_support_desc: "С тех пор, как Хигинио начал набирать обороты в политическом спектре, у Гуона Рохо всегда были наши спины и продолжали это делать. Хотя их идеалы являются экстремальными, поддержка военизированного движения поможет нам в долгосрочной перспективе."
 PAR_unrestricted_conscription: "Неограниченный призыв"
 PAR_unrestricted_conscription_desc: "Все граждане Парагвая - будь то мужчина или женщина, болезненные или трудоспособные, беременные, молодые или старые - должны призвать к оружию и бороться за нашу нацию."
 PAR_prepare_for_hypermobilization: "Подготовьтесь к гипермобилизации"
 PAR_prepare_for_hypermobilization_desc: "Если мы хотим повторно привязать гипер амбициозные мечты о Солано, мы должны начать гипермобилизацию. Люди должны сосредоточиться на военном производстве, даже если это вызывает беспокойство общественности."
 PAR_econ_hypermobilization: "Экономическая гипермобилизация"
 PAR_econ_hypermobilization_desc: "Наша экономика принесет большую пользу, если мы предпринимаем серьезные усилия по гипермобилизации ее."
 PAR_mil_hypermobilization: "Военная гипермобилизация"
 PAR_mil_hypermobilization_desc: "Нам нужно в полной мере гипермибилизировать наши военные, если мы хотим стать силой, с которой можно рассчитывать."
 PAR_econ_mil_hypermobilization: "Сбалансированная гипермобилизация"
 PAR_econ_mil_hypermobilization_desc: "Мы должны в равной степени гипермибилизировать как нашу экономику, так и наши военные."
 PAR_demand_rightful_territory: "Требовать наших законных территорий"
 PAR_demand_rightful_territory_desc: "Мы наконец готовы начать расширяться наружу. Приготовления завершены, и окружающие на разгар узнают истинный страх!"
 PAR_our_war_of_vengeance: "Наша война мести"
 PAR_our_war_of_vengeance_desc: "Южная Америка будет знать, что мы не забываем и не прощаем, и мы продолжим работу Солано."
 PAR_adopt_an_expansionist_policy: "Принять экспансионистскую политику"
 PAR_adopt_an_expansionist_policy_desc: "Чтобы наша страна была процветала, мы должны расширить наши границы, и мы сделаем это с необходимой силой."
 PAR_build_up_in_our_conquered_provinces: "Создать в наших завоеванных провинциях"
 PAR_build_up_in_our_conquered_provinces_desc: "С новыми территориями приходит задача построить их. Мы должны инвестировать в развитие наших завоеванных территорий."
 PAR_form_greater_paraguay: "Формируйте больший парагвай"
 PAR_form_greater_paraguay_desc: "Мы будем чтить наследие Солано и сформировать больший парагвай!"
 PAR_everyone_shall_pay: "§REveryOne должен платить a_1"
 PAR_everyone_shall_pay_desc: "Каждый должен заплатить за то, что они сделали с нашей Патрией. Так много десятилетий разочарования и восстановления населения ... они все заплатят!"
 PAR_demand_our_enemies_to_surrender: "Подчинение наших врагов"
 PAR_demand_our_enemies_to_surrender_desc: "Весь необходимый ущерб был нанесен, наши враги просто не могут больше сражаться, так почему бы не заставить их сдаваться нам, а не исчерпывать наши собственные ресурсы и вооружения."
 PAR_a_major_power_is_born: "Рождается главная сила"
 PAR_a_major_power_is_born_desc: "За последние последние годы мы получили значительную власть, с надежной экономикой, растущим населением и значительно более крупной страной. Нет никаких сомнений, мы сейчас главная сила. Солано ... Надеюсь, вы увидите, насколько красивой оказалась ваша страна."
 PAR_rally_the_native_people: "Сплотить коренных жителей"
 PAR_rally_the_native_people_desc: "Достаточно с этими проклятыми евродисессами и европейцами! Достаточно! Мы страдали достаточно долго, и теперь пришло время услышать наш голос."
 PAR_take_up_arms: "Взять оружие"
 PAR_take_up_arms_desc: "Нам понадобится столько солдат, сколько мы можем на месте, даже если они плохо обучены. Чем больше, тем лучше."
 PAR_convince_the_experienced_soldiers: "Убедить опытных солдат"
 PAR_convince_the_experienced_soldiers_desc: "В Парагвае много ветеранов войны благодаря войне Чако. Получение этих солдат на нашей стороне даст нам значительное преимущество перед правительством."
 PAR_seize_national_stockpiles: "Захватить национальные запасы"
 PAR_seize_national_stockpiles_desc: "Правительство накапливает много оружия из -за растущей напряженности. Получение в руки так много оружия, несомненно, принесет нам преимущество в конфликте."
 PAR_seize_local_factories: "Захватить местные фабрики"
 PAR_seize_local_factories_desc: "Мы должны использовать контроль над как можно большим количеством фабрик, чтобы мы могли улучшить производство оружия для конфликта."
 PAR_seize_control_of_the_government: "Захватить контроль над правительством"
 PAR_seize_control_of_the_government_desc: "Приготовления сделаны, пришло время отомстить за последние 10 веков пыток, через которые мы прошли!"
 PAR_native_solidarity: "Местная солидарность"
 PAR_native_solidarity_desc: "Наши братья! Мы здесь, чтобы объявить вам все, что эти убогие колонизаторы можно было бы услышать нас и поклониться нам! Ваши голоса действительно важны, и не поддавайтесь этим проклятым ублюдкам. Мы оригиналы, мы были здесь первыми!"
 PAR_mobilize_the_economy: "Мобилизовать экономику"
 PAR_mobilize_the_economy_desc: "У нас впереди много трудностей, и нам понадобится мобилизованная экономика, чтобы они сбудились."
 PAR_native_intellects: "Родные интеллекты"
 PAR_native_intellects_desc: "Существует серьезное заблуждение, что мы предположительно «тупые», но это не может быть дальше от истины. Некоторые из самых революционных результатов были получены от коренных жителей в Северной и Южной Америке, и в нашей стране проживает многие способные технологически продвигать нацию."
 PAR_native_industry: "Местная промышленность"
 PAR_native_industry_desc: "Наша отрасль просто продолжает расти! ¡Jandejára tohovasa pe Industria!"
 PAR_inherit_a_foreign_industry: "Унаследовать иностранную отрасль"
 PAR_inherit_a_foreign_industry_desc: "Вместо того, чтобы тратить наши собственные ресурсы и промышленные возможности, мы должны злоупотреблять отраслями этих проклятых колонизаторов, которые мы вступили во владение. Может быть, тогда они получат кусок собственного лекарства."
 PAR_the_call_from_our_brothers: "Звонок наших братьев"
 PAR_the_call_from_our_brothers_desc: "Наши братья звонят! Из Бразилии, Аргентина, Перу, со всех частей континента! Они призывают нас спасти их, и как братья, мы приедем к их помощи как можно скорее."
 PAR_native_conscription: "Родной призыв"
 PAR_native_conscription_desc: "Нам нужно много людей в нашей армии, чтобы освободить наших братьев. Я уверен, что эти поддержки нашего дела не будут иметь жалобы в армии."
 PAR_our_brothers_in_arms: "Наши братья по оружию"
 PAR_our_brothers_in_arms_desc: "Братья! Возьмите это оружие, они помогут вам защитить себя от этих колонизаторов! Пуля на их лицо - лучший способ общаться с ними!"
 PAR_united_under_one_banner: "Юнайтед под одним баннером"
 PAR_united_under_one_banner_desc: "Все мы, объединенные по оружию, под одним и тем же баннером. Поистине красивое зрелище, чтобы увидеть."
 PAR_our_expansion_begins: "Наше расширение начинается"
 PAR_our_expansion_begins_desc: "Все приготовления были сделаны. Оставайся на месте, братья и сестры, мы скоро спасем тебя!"
 PAR_liberate_the_bolivian_natives: "Освободить боливийских аборигенов"
 PAR_liberate_the_bolivian_natives_desc: "В Боливии расположено много местных жителей, которые мучают их «правительство». Мало ли это правительство знает, что вскоре они заплатят за то, что они делают с нашими братьями."
 PAR_march_south: "Март на юг"
 PAR_march_south_desc: "Теперь, когда мы освободили наших людей в Боливии, Юг находится на следующем на блоке. Особенно Аргентина, то, что они сделали с нашими братьями и сестрами, непростительно!"
 PAR_to_the_land_of_the_incas: "На землю инков"
 PAR_to_the_land_of_the_incas_desc: "То, что когда -то было блаженной землей инков, теперь заменяется состоянием посредственного колонизатора ... действительно стыдно видеть. Может быть, мы сможем вернуть их к их бывшей славе, привлекая их под нашим правлением."
 PAR_never_again: "Никогда больше"
 PAR_never_again_desc: "Никогда больше мы не будем сжимаемся в страхе, никогда больше не будем склонять головы вниз, никогда больше не уступим другим, и никогда больше не проиграем кому -либо!"
 PAR_prepare_for_our_european_invasion: "Подготовьтесь к нашему европейскому вторжению"
 PAR_prepare_for_our_european_invasion_desc: "Европейцы - это те, которые должны платить за свою сестру больше всего. Они совершили невыразимые грехи, и за это они заплатят всем, что у них есть!"
 PAR_get_revenge_against_the_europeans: "Отомстить европейцам"
 PAR_get_revenge_against_the_europeans_desc: "Все приготовления были сделаны, пришло время, когда эти подонка платят за то, что они сделали с нашими людьми!"
 PAR_improve_our_civilian_industry: "Улучшить нашу гражданскую индустрию"
 PAR_improve_our_civilian_industry_desc: "По мере того, как мы продолжаем расширяться и расти, нам нужна надежная гражданская индустрия, чтобы поддержать нас."
 PAR_improve_our_military_industry: "Улучшить нашу военную промышленность"
 PAR_improve_our_military_industry_desc: "По мере того, как мы расширяемся и растем как нация, наши военные требуют все больше и большего запаса для обслуживания. Для этого нам нужна более сильная военная промышленность."
 PAR_march_north: "Март на север"
 PAR_march_north_desc: "Сейчас, когда Южная Америка имела дело, мы можем начать сосредоточиться на освобождении наших братьев и сестер в Северной и Центральной Америке."
 PAR_take_down_the_usa: "Снять США"
 PAR_take_down_the_usa_desc: "Американцы думают, что они такие сильные. Давайте посмотрим, как они противостоят нашей мощью!"
 PAR_native_integration: "Нативная интеграция"
 PAR_native_integration_desc: "Все наши братья и сестры будут одинаково представлены под нашим флагом! Никто не уступает другим ... кроме колонизаторов, они худшие из худших."
  
  # Armed Forces 
 PAR_restructure_the_armed_forces: "Реструктурировать вооруженные силы"
 PAR_restructure_the_armed_forces_desc: "Из -за недавнего конфликта в Чако наша армия была оставлена ​​в изнуренном государстве. Нам нужно реструктурировать вооруженные силы и попытаться исправить нашу текущую ситуацию."
 PAR_the_paraguayan_army: "Ejército Paraguayo"
 PAR_the_paraguayan_army_desc: "Благодаря нашей недавней войне солдаты и армия в целом получили гораздо больше знаний о войне и как победить нашего врага, даже с числовым недостатком. Такие знания помогут нам вернуть армию на ноги!"
 PAR_ensure_quality_in_our_soldiers: "Обеспечить качество наших солдат"
 PAR_ensure_quality_in_our_soldiers_desc: "Нам нужна солдаты с большим опытом в бою, обученные в полной мере и знания профессионалов."
 PAR_modernize_our_armaments: "Модернизируйте наши вооружения"
 PAR_modernize_our_armaments_desc: "С современным оружием появляется больше огневой мощи, и в этой игре это то, что важно больше всего."
 PAR_modernize_our_artillery: "Модернизируйте нашу артиллерию"
 PAR_modernize_our_artillery_desc: "Нам потребуется современная артиллерия, чтобы одержать верх на наших врагах."
 PAR_a_professional_army: "Профессиональная армия"
 PAR_a_professional_army_desc: "При интенсивной подготовке и силе воли наша армия достигнет статуса профессиональной армии. Тот, который будет готов к тому, что приходит на свой путь!"
 PAR_the_more_the_merrier: "Чем больше, тем лучше"
 PAR_the_more_the_merrier_desc: "Чем больше войск, тем лучше."
 PAR_cheap_out_on_infantry_equipment: "Дешево на пехотном оборудовании"
 PAR_cheap_out_on_infantry_equipment_desc: "Нам нужно сделать производство пехотного оборудования дешевле и эффективнее, если мы хотим полностью поставить всех наших солдат."
 PAR_produce_more_artillery: "Производить больше артиллерии"
 PAR_produce_more_artillery_desc: "Нам нужно разработать более эффективные способы производства артиллерии, если мы хотим иметь шанс."
 PAR_an_expansive_army: "Обширная армия"
 PAR_an_expansive_army_desc: "Поскольку армия продолжает расти в количестве, тоже наша власть!"
 PAR_new_training_regiments: "Новые учебные полки"
 PAR_new_training_regiments_desc: "Мы установим новые и надлежащие тренировочные полки, чтобы еще больше улучшить нашу армию и раз и навсегда сработать с проблемами, от которых мы пострадали из -за войны в Чако."
 PAR_un_ejercito_moderno: "Un ejército moderno"
 PAR_un_ejercito_moderno_desc: "Наша армия теперь лучше, чем когда -либо благодаря всем изменениям и достижениям, которые мы сделали. Мы обязательно уйдем очень далеко благодаря этому, и наши враги не будут иметь шанса против нашей военной мощи."
 PAR_the_paraguayan_airforce: "Fuerza Aerea Paraguaya"
 PAR_the_paraguayan_airforce_desc: "Парагвайская воздушная сила, хотя и не известная своей силой или числами, все еще примечательна, учитывая размер нашей нации. Мы можем продолжать улучшать его и довести до уровней, которые есть в Бразилии и Аргентине."
 PAR_fully_establish_the_armada_paraguaya: "Полностью установить Армаду Парагвайя"
 PAR_fully_establish_the_armada_paraguaya_desc: "У нас уже есть флот, но теперь, когда мы контролируем прибрежное государство, мы можем действительно начать строить надлежащий флот."
 PAR_modernize_our_fighters: "Модернизируйте наших бойцов"
 PAR_modernize_our_fighters_desc: "Бойцы являются основным типом самолета, когда дело доходит до здоровой воздушной силы. Если у нас могут быть современные бойцы перед кем -либо еще, то никто не сможет бросить нам вызов в небе."
 PAR_modernize_our_bombers: "Модернизируйте наших бомбардировщиков"
 PAR_modernize_our_bombers_desc: "Бомбардировщики - это то, что уничтожает врага, это то, что поражает истинный страх среди гражданских лиц и военных, это то, что выиграет нам любую войну, которую мы могли бы иметь в будущем! Чем более современные наши бомбардировщики, тем ущерб MROE мы сможем нанести!"
 PAR_industrial_effort_into_airplane_production: "Промышленные усилия в производстве самолетов"
 PAR_industrial_effort_into_airplane_production_desc: "Если мы хотим похвастаться надежной воздушной силой, нам нужно инвестировать в национальное производство самолетов."
 PAR_airbase_expansion_project: "Проект расширения Airbase"
 PAR_airbase_expansion_project_desc: "Пришло время расширить наши довольно пренебрежимые воздушные базы, которые усеяны по всей нашей стране."
 PAR_heavy_military_funds: "Тяжелые военные средства"
 PAR_heavy_military_funds_desc: "Со всеми нашими расширениями, это будет примерно время, это достигнет военных. Этот массовый рост инвестиций не только освободит еще большую часть нашей экономики по отношению к военным, но и профессионализировать армию."
 PAR_submarine_effort: "Подводные усилия"
 PAR_submarine_effort_desc: "Подводная война является наиболее захватывающим военно -морским развитием с момента изобретения торпедной лодки. Мы преуспели бы не только защитить от подводных лодок, но и использовать их против вражеского доставки."
 PAR_destroyer_effort: "Усилие разрушителя"
 PAR_destroyer_effort_desc: "Изучая дизайн и стратегическое использование подводных лодок, мы также узнали, как противостоять этим стратегиям. Разрушители будут иметь решающее значение для этого."
 PAR_heavy_naval_investments: "Тяжелые военно -морские инвестиции"
 PAR_heavy_naval_investments_desc: "Нам нужно вкладывать значительные средства в военно -морской флот, чтобы похвастаться сильным и мощным флотом, который поразит страх в наших врагов, даже за счет промышленного производства SOE."
 PAR_mild_naval_investments: "Мягкие военно -морские инвестиции"
 PAR_mild_naval_investments_desc: "Мы должны поместить достаточное количество инвестиций в наши военно -морские силы."
 PAR_an_improved_armada: "Улучшенная армада"
 PAR_an_improved_armada_desc: "Парагвай, возможно, был страной, не имеющей выхода к морю, но реки, окружающие нас Теперь, с нашим улучшенным военно -морским результатом и расширенным температурой, мы сильнее, чем когда -либо."
 PAR_utilize_our_indigenous_knowledge: "Используйте наши знания коренных народов"
 PAR_utilize_our_indigenous_knowledge_desc: "Наши коренные народы очень полезны в выживании с зеленым адом, предоставляя нам топографию и очень полезные растения, чтобы бороться с жаждой наших солдат и кормить нашего скота и животных. Консолидация их знаний для защиты нашей территории, состоящей из песчаных банков и нестабильной земли, является стратегическим интересом."
 PAR_the_nuclear_option: "Ядерный вариант"
 PAR_the_nuclear_option_desc: "Если наши враги отказываются сдаться нашим словам, то, возможно, они сдадут наше ядерное оружие."
  
 ### VENEZUELA 
 VEN_drill_the_miocene_tar_sands_oil: "Просверлить масло миоцен"
 VEN_drill_the_miocene_tar_sands_oil_desc: "Масло было обнаружено возле ремня Ориноко. Мы должны взять это открытие в нашу пользу и поступить на наш вновь обретенный источник масла."
 VEN_nationwide_oil_extraction_improvements: "Общенациональные улучшения добычи нефти"
 VEN_nationwide_oil_extraction_improvements_desc: "Мы могли бы использовать некоторые улучшения в том, как мы извлекаем наш самый прибыльный ресурс."
 VEN_invest_in_the_consumer_market: "Инвестировать в потребительский рынок"
 VEN_invest_in_the_consumer_market_desc: "Наша экономика слишком зависит от добычи нефти, и мы должны это остановить. Мы должны углубиться в более ориентированные на потребителя рынки, чтобы отойти от нефтяной зависимости и улучшить наш потребительский сектор."
 VEN_promise_worker_condition_improvements: "Обещание улучшения состояния работника"
 VEN_promise_worker_condition_improvements_desc: "Совершенно очевидно, что среди тех, кто работает в нашей нефтяной промышленности, есть беспорядки в отношении условий труда. Возможно, мы должны успокоить их жалобы."
 VEN_adopt_pro_market_policies: "Принять политику про-маркета"
 VEN_adopt_pro_market_policies_desc: "Мы видели положительные последствия политики про-маркета по всему миру. Видя, что наша добыча нефти довольно впечатляет, мы должны извлечь выгоду из этого в полной мере, чтобы принести как можно больше инвестиций."
 VEN_nationalize_the_oil_fields: "Национализировать нефтяные месторождения"
 VEN_nationalize_the_oil_fields_desc: "Вместо того, чтобы позволить нашей нефтяной промышленности быть в руках частного предприятия, мы должны национализировать наши нефтяные месторождения."
 VEN_estado_bolivar_mine_Expansions: "Расширение шахты Estado Bolivar"
 VEN_estado_bolivar_mine_Expansions_desc: "Различные неиспользованные ресурсы были найдены в Эстадо Боливаре. Инвестиции в создание шахт могли бы увидеть наше производство различных мелких материалов, которые будут творить чудеса для нашей национальной промышленности."
 VEN_industrialize_the_nation: "Индустриализировать нацию"
 VEN_industrialize_the_nation_desc: "В то время как на нас не было слишком отрицательно влияет Великая депрессия, нельзя отрицать влияние промышленного мира и многочисленных преимуществ, которые он приносит. Наша нация, будучи стабильной, не хватает, когда дело доходит до индустриализации, и может стать еще сильнее, если бы мы приняли план индустриализации."
 VEN_establish_the_guardia_nacional: "Установить охрану"
 VEN_establish_the_guardia_nacional_desc: "Национальный Guardia был основан в 1937 году Crongeras и стал одним из 4 основных компонентов вооруженных сил Венесуэля. По мере роста нашей нации"
 VEN_ramp_up_the_armories: "Наращивать арсенали"
 VEN_ramp_up_the_armories_desc: "С ростом напряженности в мире, мы должны начать вооружение наших людей, чтобы быть готовыми к любой ситуации."
 VEN_heavy_military_investments: "Тяжелые военные инвестиции"
 VEN_heavy_military_investments_desc: "Нам нужно как можно больше инвестировать в наше военное производство, чтобы мы никогда не были пойманы не готовы к оборудованию. Это разозлит рабочих, но это небольшое препятствие в ходе обращения с гораздо большим."
 VEN_conservative_military_investments: "Консервативные военные инвестиции"
 VEN_conservative_military_investments_desc: "Мы должны быть консервативными с нашими военными инвестициями. Это правда, что напряженность растет во всем мире, но нам также нужно поддерживать удовлетворение наших людей."
 VEN_autarky: "Autarky"
 VEN_autarky_desc: "В настоящее время мы не можем зависеть от других для ресурсов, так как они могут превратиться от союзника к врагу за день. Нам нужно подтолкнуть реформы, чтобы стать самодостаточной экономикой."
 VEN_prioritize_oil_to_the_army: "Расставить приоритеты в армии"
 VEN_prioritize_oil_to_the_army_desc: "Армия в настоящее время является нашим приоритетом. Вся наша добыча нефти пойдет прямо в армию."
 VEN_standarized_production_lines: "Стандартные производственные линии"
 VEN_standarized_production_lines_desc: "Процесс стандартизации производственных линий позволит производству военного вооружения стать значительно более эффективным и быстрее, а также позволить использовать отдельные ресурсы."
 VEN_begin_army_modernizations: "Начинать армейские модернизации"
 VEN_begin_army_modernizations_desc: "Как отмечает Соединенные Штаты, наше армейское оборудование отсутствует, технологически говоря. Модернизация приведет нашу армию в соответствии с надлежащими стандартами, даже если это займет некоторое время."
 VEN_modernize_the_air_force: "Fuerza Aerea Venezolana"
 VEN_modernize_the_air_force_desc: "Военно -воздушные силы Венесуэлы имеют долгую историю, но в последнее время не было необходимости в первую очередь. Это, однако, вскоре может измениться, так как напряженность продолжает расти, и мы должны быть готовы к любой возможной ситуации."
 VEN_national_airplane_production: "Национальное производство самолетов"
 VEN_national_airplane_production_desc: "Поскольку мы индустриализируем и расширяем нашу отрасль, то и наше самолет. Вскоре у нас будет воздушная сила, которая соперничает с таковыми в Бразилии и Аргентине."
 VEN_venezuelan_airbase_expansion: "Проект расширения Airbase"
 VEN_venezuelan_airbase_expansion_desc: "По мере того, как воздушная сила растет в количестве, так же как и наши авиабазы, чтобы держать все новые плоскости."
 VEN_modernized_venezuelan_fighters: "Модернизированные венесуэльские бойцы"
 VEN_modernized_venezuelan_fighters_desc: "Бойцы - это фронт воздушных сражений. Наличие современных бойцов обеспечит нашу победу в воздухе."
 VEN_bombs_from_the_sky: "Бомбы с неба"
 VEN_bombs_from_the_sky_desc: "Когда бойцы сражаются в небе, бомбардировщики спускаются, чтобы бордить наших врагов, чтобы обеспечить абсолютную победу."
 VEN_import_american_weaponry: "Импорт [USA.GetAdjective] Оружие"
 VEN_import_american_weaponry_desc: "У американцев есть одно из лучших и самых современных оружия в регионе, и они уже продемонстрировали свою готовность продать нам свое оружие."
 VEN_troop_air_support: "Авиационная поддержка войск"
 VEN_troop_air_support_desc: "Наличие воздушной поддержки в вершине вторжения войск позволит нам легче против наших врагов."
 VEN_ejercito_venezolano_f: "Ejército Venezolano"
 VEN_ejercito_venezolano_f_desc: "Венесуэльская армия имеет одну из самых длинных истории в регионе, начиная с колумбийских дней Гран под руководством Саймона Боливара. Армия с такой историей заслуживает правильного финансирования и инвестиций."
 VEN_small_arms_modernization: "Модернизация стрелкового оружия"
 VEN_small_arms_modernization_desc: "Снижение оружия, такого как оружие и военная техника, хотя и дешевая для производства, являются наиболее важными вещами для производства и модернизации."
 VEN_study_venezuelan_topography: "Изучите венесуэльскую топографию"
 VEN_study_venezuelan_topography_desc: "Топография и география Венесуэлы очень уникальны по сравнению с другими странами. Правильное изучение его может дать нам преимущество против наших врагов в случае необходимости сражаться в аналогичной местности."
 VEN_venezuelan_special_forces: "Венесуэльский спецназ"
 VEN_venezuelan_special_forces_desc: "Венесуэльская программа спецназа должна быть незамедлительно создана для подготовки армии к любым особым случаям, в которой она может оказаться."
 VEN_national_tank_program: "Национальная программа танка"
 VEN_national_tank_program_desc: "Сильная армия - это та, которая содержит солдат и оружие. Еще более сильная армия - это та, которая содержит многочисленное количество танков."
 VEN_armament_program: "Программа вооружения"
 VEN_armament_program_desc: "По мере расширения армии, так же как и требование о оружии и оборудовании. Правильная программа вооружения будет создана для подавления этого требования."
 VEN_artillery_modernization_effort: "Артиллерийские усилия по модернизации"
 VEN_artillery_modernization_effort_desc: "Наличие современной артиллерии обеспечит победу в Battelfield."
 VEN_combined_arms_tactics: "Объединенная тактика оружия"
 VEN_combined_arms_tactics_desc: "По мере того, как все ветви вооруженных сил улучшаются, так и наша тактика. Использование и объединение всех трех одновременно окажется решающим."
 VEN_stricter_training_lessons: "Более строгие уроки обучения"
 VEN_stricter_training_lessons_desc: "Строгие уроки обучения в наших школах будут подталкиваться к улучшению качества наших пилотов."
 VEN_adopt_a_protectionist_policy: "Принять протекционистскую политику"
 VEN_adopt_a_protectionist_policy_desc: "[VEN.Getleader] объявил, что венесуэльская нефть для и венесуэльцев. Это, однако, не означает, что нефтяные рынки будут полностью закрыты, так как другие страны по -прежнему смогут покупать нефть и инвестировать в нашу производство нефти, хотя и в ограниченном количестве."
 VEN_study_foreign_central_banks: "Изучить иностранные центральные банки"
 VEN_study_foreign_central_banks_desc: "Идея наличия центрального национального банка не нова в Венесуэле, и это идея, с которой [VEN.GetLeader] хочет пройти. Нам нужно адекватно изучить иностранные центральные банки и проанализировать лучшие стратегии и методологии для реализации надлежащего центрального банка."
 VEN_agricultural_investments: "Сельскохозяйственные инвестиции"
 VEN_agricultural_investments_desc: "По мере того, как мы модернизируем и индустриализуем, также важно поддерживать наш сельскохозяйственный сектор экономики."
 VEN_el_pais_de_los_trabajadores: "§Yel país de los trabajadores§!"
 VEN_el_pais_de_los_trabajadores_desc: "Эта страна для рабочих, рабочими. Как показал запланированный удар, рабочие - это те, кто говорит в этой стране, и мы сделаем то, что нужно сделать, чтобы это осталось верным."
 VEN_demand_foreign_subsidies: "Требуют иностранных субсидий"
 VEN_demand_foreign_subsidies_desc: "Теперь, когда зарубежные страны покупают права доступа на нашу нефть, мы начнем выдвигать требования к этим странам, чтобы оплатить наши ресурсы, используя их в качестве иностранных субсидий для субсидирования экономики и улучшения нашей отрасли."
 VEN_banco_central_de_venezuela: "Banco Central de Venezuela"
 VEN_banco_central_de_venezuela_desc: "Исторически, Центральная де Венесуэла Банко была создана еще в 1941 году, будучи ответственным в основном за золотые заповедники в стране. Наш центральный банк окажется решающим в обеспечении экономической стабильности по всей стране."
 VEN_nationwide_education_reforms: "Общенациональные реформы образования"
 VEN_nationwide_education_reforms_desc: "Образование является наиболее важным аспектом любой страны, и мы не вернемся к этому."
 VEN_industrial_investments: "Промышленные инвестиции"
 VEN_industrial_investments_desc: "Нет ничего плохого в том, чтобы ввести инвестиции в улучшение нашей отрасли, особенно когда результаты приносят нам пользу в конце концов."
 VEN_invest_in_the_mining_industry: "Инвестировать в горнодобывающую промышленность"
 VEN_invest_in_the_mining_industry_desc: "Наша зависимость от добычи нефти начала отрицательно влиять на нашу экономику. Настало время выйти из нашей зоны комфорта, инвестируя в другие сектора горнодобывающей промышленности, потому что сталь и вольфрама."
 VEN_the_modern_venezuelan_economy: "Современная венесуэльская экономика"
 VEN_the_modern_venezuelan_economy_desc: "После многих реформ, принятия законов и надлежащего финансирования венесуэльская экономика действительно может считаться современной. Тот, который может влиять на региональные державы и даже иметь позицию на мировой арене."
 VEN_support_galavis_actions: "Поддержка действий Галависа"
 VEN_support_galavis_actions_desc: "Чем больше мы анализируем действия, которые Галавис предпринял против протестующих в столице, тем более очевидным становится то, что это был правильный курс действий. Мы поддержим его полностью, независимо от того, что утверждают протестующие. Даже если люди не поймут сейчас, они в конечном итоге будут."
 VEN_temporarily_imprison_galavis: "Временно заключить галавис"
 VEN_temporarily_imprison_galavis_desc: "Действия Галависа просто непростительны. Убийство невинных протестующих, просто осуществляющих свое право на протест, были убиты, ограбленные в их жизни. Это непростительное преступление, и Галавис впоследствии будет наказан за свои действия, в то же время умиротворяя людей, которые протестули."
 VEN_enact_the_february_plan: "Принять февральский план"
 VEN_enact_the_february_plan_desc: "Поскольку протесты вспыхивают все дальше и дальше, нам нужно найти способ смягчить растущую внутреннюю напряженность. [VEN.GetLeader] объявил о наборе мер, установив руководящие принципы для политических, экономических и социальных изменений страны, что позволило рождение демократии, признание прав и свобод и экономическое развитие капиталистического типа."
 VEN_create_the_ministry_of_health_and_social_assistance: "Создать Министерство здравоохранения и помощи"
 VEN_create_the_ministry_of_health_and_social_assistance_desc: "Чтобы способствовать улучшению здоровья населения венесуэльского населения, Министерство здравоохранения и социальной помощи будет создано, чтобы помочь нуждающимся."
 VEN_promote_nationwide_hygiene: "Продвигать общенациональную гигиену"
 VEN_promote_nationwide_hygiene_desc: "Продолжая наше подавление болезни, мы будем способствовать гигиене по всей стране, чтобы укрепить хорошее здоровье."
 VEN_support_the_workers_cause: "Поддерживать дело работника"
 VEN_support_the_workers_cause_desc: "По мере того, как забастовка вырисовывается все ближе, общее население удивляется стабильности нынешнего правительства и насколько она эффективна. Возможно, есть лучший вариант, возможно, с этим ударом мы сможем превратить его во что-то еще больше, в полномасштабную революцию, чтобы спасти венесуэльского народа!"
 VEN_arm_the_peasants: "Вооружать крестьяне"
 VEN_arm_the_peasants_desc: "Народ Венесуэлы поднимется, чтобы продемонстрировать свой гнев и обиду на правительство. Все на руки!"
 VEN_revolution_to_the_army: "Революция армии"
 VEN_revolution_to_the_army_desc: "Те, кто в настоящее время в настоящее время должен узнать о нашем деле. Наличие профессиональных солдат принесет баланс победы на нашу сторону."
 VEN_bourgeoisie_crackdown: "Буржуазийная репрессия"
 VEN_bourgeoisie_crackdown_desc: "Со всеми подготовленными и в движении приготовления, последний гвоздь в кафе полностью уничтожает всю буржуазию. Во имя революции!"
 VEN_spearhead_of_the_revolution: "Конец революции"
 VEN_spearhead_of_the_revolution_desc: "По мере того, как революция становится все сильнее и сильнее, вопрос о том, как многие станут: кто возглавляет революцию? Есть различные кандидаты, достойные этой позиции, с такими, как Густаво Мачадо Моралес, Хуан Баутиста Фуэнмайор и Родольфо Кинтеро."
 VEN_everyone_to_arms: "Все на руки"
 VEN_everyone_to_arms_desc: "Все на руки! Революция нужна вам!"
 VEN_mobilize_the_economy: "Мобилизовать экономику"
 VEN_mobilize_the_economy_desc: "Все на фабриках! Не один работник позади!"
 VEN_PRP: "Партидо Республико Професста"
 VEN_PRP_desc: "В основном идеализированный Родольфо Квинтеро, PRP использует более синдикалистический подход к коммунизму, давая всю власть работнику и обеспечивая сильную экономику устранить любые неравенства, обнаруженные среди людей."
 VEN_PCV: "Partido Comunista de Venezuela"
 VEN_PCV_desc: "Коммунистическая партия Венесуэлы, идеализированная Густаво Мачадо Моралесом и поддерживаемая Хуан Буатистой Фуэнмайор, подпитывая ненависть к империалистическим полномочиям Запада и желанием иметь коллективизированное общество, объединяя различные страны Южной Америки в единый союз социалистических республик."
 VEN_declare_the_national_syndicate: "Объявить национальный синдикат"
 VEN_declare_the_national_syndicate_desc: "С настоящим режимом, мы можем начать внедрять наши изменения, чтобы улучшить нацию. Наш первый заказ - создать национальный синдикат, который будет отвечать за работников Венесуэлы. Это потребует финансирования, но в долгосрочной перспективе будет помочь экономике."
 VEN_farmer_subsidies: "Фермерские субсидии"
 VEN_farmer_subsidies_desc: "Фермеры очень помогли в революции, и они заслуживают как похвалы, так и компенсации за это."
 VEN_venezuelan_worker_movement: "Венесуэльское рабочее движение"
 VEN_venezuelan_worker_movement_desc: "Работником, для работника! Это девиз, который мы живем, и девиз, который мы будем продвигать."
 VEN_greater_university_investments: "Большие университетские инвестиции"
 VEN_greater_university_investments_desc: "С большими и более влиятельными университетами мы можем иметь более образованные венесуэльцы, продвигающие рост нации еще дальше. Для революции!"
 VEN_education_is_first: "Образование в первую очередь"
 VEN_education_is_first_desc: "Образованное общество - это сильное общество."
 VEN_enact_major_economic_reforms: "Принять основные экономические реформы"
 VEN_enact_major_economic_reforms_desc: "Гражданская война оставила нашу экономику в руинах. Нам нужно провести крупные экономические реформы, если хотим надежды на его ремонт."
 VEN_ensure_proper_military_training: "Обеспечьте надлежащую военную подготовку"
 VEN_ensure_proper_military_training_desc: "После ужасной гражданской войны наши военные были опустошены. Пришло время построить с нуля и начать должным образом обучать наши вооруженные силы."
 VEN_seize_the_military_industry: "Захватить военную промышленность"
 VEN_seize_the_military_industry_desc: "Мы возьмем это, большое спасибо. Мы считаем, что мы лучше пользуемся этим оружием."
 VEN_national_mobilization_program: "Национальная программа мобилизации"
 VEN_national_mobilization_program_desc: "Не может иметь надлежащего режима без сильной красной армии, чтобы сопровождать его. Все венесуэльцы должны начать обязательный военный призыва, начиная с сегодняшнего дня! Славная венесуэльская армия будет бояться Западом!"
 VEN_invest_development_zulia: "Инвестировать развитие Зулия"
 VEN_invest_development_zulia_decs: "Считаясь местом рождения венесуэльского коммунизма, неудивительно, что [VEN.GetLeader] захочет разработать провинцию и довести ее до тех же стандартов, что и столица."
 VEN_organizing_the_new_cabinet: "Организация нового шкафа"
 VEN_organizing_the_new_cabinet_desc: "С новым шкафом в наших руках мы должны правильно организовать его, чтобы соответствовать нашим стандартам качества и избавиться от любых скрывающихся капиталистов или потенциальных авторитаристов."
 VEN_follow_earl_browders_theories: "Следуйте за теориями Эрла Броудера"
 VEN_follow_earl_browders_theories_Desc: "Эрл Броудер был печально известным коммунистом в Соединенных Штатах, в основном известным своим восхищением по отношению к Советскому Союзу и амбициями для тесного сотрудничества между Соединенными Штатами и Советским Союзом. Его теории до сих пор присутствуют в сознании многих, и с руководством такого гениального ума мы обязательно добьемся успеха."
 VEN_equality_for_all: "Равенство для всех"
 VEN_equality_for_all_desc: "Мы все созданы равными, независимо от того, какая раса, возраст или пол."
 VEN_gloria_al_pueblo: "Глория Аль Пуэбло"
 VEN_gloria_al_pueblo_desc: "Глория Аль Браво Пуэбло! Глория Аль Пуэбо Вензолано!"
 VEN_the_great_south_american_revolution: "Великая южноамериканская революция"
 VEN_the_great_south_american_revolution_desc: "Пришло время начать распространять революцию и освободить отъезда в Латинскую Америку!"
 VEN_ley_lara: "Лей Лара"
 VEN_ley_lara_desc: "Закон или закон Лары в отношении общественного порядка был правовым инструментом, утвержденным в Венесуэльском парламенте правительством Элеазара Лопеса Контрераса в июне 1936 года, чтобы контролировать политические демонстрации оппозиции и подавить их, если это необходимо. Нам нужно будет сохранить более жесткую сцепление с нашей оппозицией, если мы хотим, чтобы эта страна исцелялась."
 VEN_sign_the_frontline_treaty: "Подписать договор"
 VEN_sign_the_frontline_treaty_desc: "Договор Лопеса де Меса-Гил Борхес был договором, подписанным в апреле 1941 года о протезной, установив границы между Венесуэлой и Колумбией раз и навсегда, и раз и навсегда заканчивая все напряженности между двумя из-за пограничных споров. Хорошие отношения с Колумбией будут для нас обоих."
 VEN_museum_of_fine_arts_of_caracas: "Музей изобразительных искусств Каракаса"
 VEN_museum_of_fine_arts_of_caracas_desc: "Музей изящных искусств был создан в Каракасе под президентством Лопеса Контрераса, направленного на содействие историческому образованию страны и служить точкой как местного, так и для международного туризма."
 VEN_education_reforms: "Образовательные реформы"
 VEN_education_reforms_desc: "Продвижение надлежащих реформ образования повысит образование этой страны и позволит нашим будущим поколениям продвигать эту страну вперед."
 VEN_the_medina_administration_focus: "Администрация Медины"
 VEN_the_medina_administration_focus_desc: "С термином Контрераса, достигнутым своим концом, должен быть поднят нового лидера, чтобы возглавить нацию. Эта роль должна пойти никому, кроме Исаиса Медины Ангарита, сильного военного лидера, который также верит в идею свободной Венесуэлы, которая объединилась с союзными державами Запада."
 VEN_allow_full_freedom_of_speech: "Разрешить полную свободу слова"
 VEN_allow_full_freedom_of_speech_desc: "Многие сектора оппозиции утверждают, что Медина - подземный фашист, тот, кто связан с военными группами страны TGE и способствует тоталитаризму. Мы докажем эти претензии неправильно, разрешив полную свободу слова, особенно позволяя венесуэльцам быть частью любой идеологии, которая им нравится без каких -либо последствий, за исключением коммунизма и анархизма."
 VEN_the_right_to_strike: "Право на удар"
 VEN_the_right_to_strike_desc: "Без свободы нанести удар, как мы будем улучшаться как страна, если мы запрещаем венесуэльскому народу встать и быть услышанным?"
 VEN_break_all_ties_with_the_axis: "Разбейте все связи с осью"
 VEN_break_all_ties_with_the_axis_desc: "Ось нанесла слишком большой урон, достаточно! Мы должны разорвать все связи с ними, так как они доказали, что они являются истинной мрачкой этой планеты."
 VEN_favor_the_allied_cause: "Благосклонно"
 VEN_favor_the_allied_cause_desc: "После разрыва связей с осью, это единственное, что мы наряду с союзными способностями. Они уже оказались значительно более полезными: Соединенные Штаты даже предлагают помочь нам модернизировать нашу армию и ВВС."
 VEN_internal_anti_german_measures: "Внутренние антигерманские меры"
 VEN_internal_anti_german_measures_desc: "В нашей стране есть несколько немцев, которые придерживаются про-германских настроений. Они представляют угрозу для нашего народа и должны быстро разобраться."
 VEN_tour_through_the_bolivarian_countries: "Тур по боливарским странам"
 VEN_tour_through_the_bolivarian_countries_desc: "Чтобы содействовать хорошим отношениям с нашими соседями, мы должны начать тур по боливарианским странам. Это будет включать в себя Колумбию, Панаму, Перу, Эквадор и Боливию. Это был бы естественный выбор, учитывая, что лидеры этих стран в тот или иной момент посетили нашу страну, чтобы улучшить политические отношения."
 VEN_support_the_accion_democratica: "Поддерживать Acción Democratica"
 VEN_support_the_accion_democratica_desc: "Было ясно, что Медина не вырезана для руководства этой нации, и нам нужно улучшение, что -то новое. Особенно при рассмотрении подвешенного эскалантеса относится к тому, будет ли он руководить. Все это делает более чем очевидным, что переворотный переворот должен быть принят, чтобы избавиться от медианы и поместить в его место Ромуло Бенкурт, кого -то, кто действительно способен руководить."
 VEN_the_father_of_venezuelan_democracy: "Отец Венесуэльской демократии"
 VEN_the_father_of_venezuelan_democracy_desc: "свобода слова"
 VEN_use_what_we_learned_from_pedro: "Используйте то, что мы узнали от Pedro"
 VEN_use_what_we_learned_from_pedro_desc: "В то время, когда мы были изгнаны в Чили, мы узнали о многих великих вещах от тогдашнего чилийского лидера Педро Агирре Серда. Мы могли бы использовать некоторые из его идеалов в нашей стране, чтобы способствовать росту и процветанию."
 VEN_allow_free_and_public_elections: "Разрешить свободные и государственные выборы"
 VEN_allow_free_and_public_elections_desc: "Люди требуют совершенно свободных и государственных выборов, поэтому было бы целесообразно слушать их и делать так, как они желают, прежде чем эта ситуация ухудшится."
 VEN_the_escalante_administration: "Администрация Эскаланте"
 VEN_the_escalante_administration_desc: "Многие считают единственным лидером, который действительно подходит для управления Венесуэлой, Эскаланте восхищается многими на его стороне, и лидер, который, по мнению многих, выведет эту страну на передний план мира, будучи признанным во всем мире как истинную силу. Мы должны убедиться, что это произойдет несмотря ни на что."
 VEN_cooperation_with_the_US: "Сотрудничество с Соединенными Штатами"
 VEN_cooperation_with_the_US_desc: "Наличие такого сильного и могущественного союзника на севере было бы более чем идеальным для продвижения нашего собственного роста. США уже очень активно поддерживали нас и нашего дела, поэтому это единственное естественно, что мы вернем услугу и сотрудничаем с ними еще ближе."
 VEN_fully_implement_the_agrarian_reform: "Полностью реализовать аграрную реформу"
 VEN_fully_implement_the_agrarian_reform_desc: "Первоначально запланированный Мединой до того, как ее проголосовали, эта крупная аграрная реформа была направлена ​​на повышение производительности в сельскохозяйственной стороне нашей экономики. Теперь, когда мы отвечаем, мы можем продолжить эту запланированную реформу и сделать ее реальностью."
 VEN_promote_venezuelan_industrialization: "Продвигать венесуэльскую индустриализацию"
 VEN_promote_venezuelan_industrialization_desc: "Экономика Венесуэлы неуклонно растет, но способствуя индустриализации как в местном, так и в общенациональном масштабе, мы можем заставить ее расти еще быстрее."
 VEN_a_free_venezuela: "свободная Венесуэла"
 VEN_a_free_venezuela_desc: "Конечная цель нашего правительства, после долгих времени и усилий, была окончательно достигнута. Наша страна, наконец, может быть признана надлежащей демократией, которая является свободной и представляет все качества свободы и репутации."
 VEN_promote_immigration: "Продвигать иммиграцию"
 VEN_promote_immigration_desc: "Открытие наших границ для иммиграции увеличит наше население - и, следовательно, увеличит наше рабочее население."
 VEN_support_the_national_industry: "Поддерживать национальную промышленность"
 VEN_support_the_national_industry_desc: "Национальная промышленность - это то, что продвигает эту экономику. Этот сектор нуждается в нашей полной поддержке, и это именно то, что мы будем делать."
 VEN_appoint_romulo_gallegos: "Назначить Ромуло Галлегос"
 VEN_appoint_romulo_gallegos_desc: "свободные выборы"
 VEN_military_takeover: "Военное поглощение"
 VEN_military_takeover_desc: "С правительством в самой слабой точке истории стало более чем ясно, что военные должны полностью вмешаться, чтобы донести порядок в эту страну. Мы были слишком расслаблены, и это принесло слишком много последствий."
 VEN_strengthen_the_military: "Укрепить военные"
 VEN_strengthen_the_military_desc: "Нам нужны сильные военные, чтобы уважать наши приказы."
 VEN_wave_of_democracy: "Волна демократии"
 VEN_wave_of_democracy_desc: "Демократия превратилась в умирающий свет в Латинской Америке, но мы можем это изменить. Мы можем быть теми, кто принесет демократию нашим соседям и сделать наш регион еще лучше,"
 VEN_caracas_la_guaira_highway: "Каракас-ла Гуайра Шоссе"
 VEN_caracas_la_guaira_highway_desc: "Шоссе Гуайра Каракас-Ла было шоссе, построенным в Каракасе, начиная с 1950 года, и закончилось в 1953 году. Это должно было сделать транспорт между двумя частями города легче и быстрее. Предлагаемое шоссе обеспечит большую производительность в капитале."
 VEN_readjust_the_parties: "Перечегут вечеринки"
 VEN_readjust_the_parties_desc: "Теперь, когда мы отвечаем, мы можем начать демонтировать некоторые из оппозиционных сторон, чтобы гарантировать, что они не мешают нашим планам. Они станут шипой на нашей стороне, если мы позволим им быть слишком долго."
 VEN_military_oriented_industry: "Военная ориентированная промышленность"
 VEN_military_oriented_industry_desc: "Военные - это то, что приносит истинное процветание для нации. Кого заботится о людях, когда у вас сильная армия. (4 -й настенный перерыв здесь, пожалуйста, потому что любовь к Богу на самом деле не думайте так)"
 VEN_towards_a_new_venezuela: "На пути к новой Венесуэле"
 VEN_towards_a_new_venezuela_desc: "Вензуэла сейчас находится на пути роста, который мы смогли достичь. Были взлеты и падения, но мы сделали это в конце, и теперь пришло время стать силой, о которой мы всегда мечтали."
 VEN_our_comrades_in_south_america: "Наши товарищи в Южной Америке"
 VEN_our_comrades_in_south_america_desc: "Многие - это Южная Америка, которые готовы присоединиться к нам в нашем деле для южноамериканской революции. Эти нации достойны союзников с нами, и мы можем сделать много великих вещей вместе."
 VEN_potential_comintern_membership: "Потенциальное членство в Коминтерне"
 VEN_potential_comintern_membership_desc: "С Risin Global напряженность, становится все более и более очевидным, что наш лучший курс действий - это связать себя с Советами. Вместе мы можем сделать глобальную революцию реальностью."
 VEN_demand_guyana_esequiba_commie: "Требование Гайаны Эсекиба"
 VEN_demand_guyana_esequiba_commie_desc: "Гуаяна Эсекиба была заявлена ​​Венесуэлой с момента роспуска Гран Колумбии, будучи официально признанным как часть нации до оккупации и последующей его аннексии британцами. Несмотря на то время, которое прошло, мечты о том, чтобы его контролировали, только с тех пор выросли, и теперь пришло время прояснить британцам, что территория принадлежит нам."
 VEN_an_unthinkable_union: "Немыслимый союз"
 VEN_an_unthinkable_union_desc: "В связи с тем, что Советы подвергались воздействию иностранных держав и с их суверенитетом в опасности, наше высшее командование вызвало очень интересную идею: предложить идею спасти их путем аннексии через объединение. Хотя это кажется надуманным, на самом деле это имеет смысл, как только наша собственная сила также рассматривается, а также наши отношения с Советами и их нынешним ситюаутоном. Мы сохраним вас, мы обещаем."
 VEN_soviet_industrial_investments: "Советские промышленные инвестиции"
 VEN_soviet_industrial_investments_desc: "Советская индустрия является одной из самых сильных на планете. Получение инвестиций от них будет продвигать нашу отрасль еще дальше."
 VEN_invite_our_communist_brothers: "Пригласить наших коммунистических братьев"
 VEN_invite_our_communist_brothers_desc: "Теперь, когда мы являемся лидерами фракции, мы можем начать приглашать наших коммунистических братьев и работать вместе."
 VEN_bolivarian_liberation: "Боливарианское освобождение"
 VEN_bolivarian_liberation_desc: "Колумбия и Эквадор были расстроены слишком долго. В рамках Боливарского братства мы обязаны освободить их и спасти их от этого раскрытия."
 VEN_reunification_in_the_south: "Воссоединение на юге"
 VEN_reunification_in_the_south_desc: "Перу также считается боливаренным многими, и они тоже будут освобождены за большую пользу революции."
 VEN_the_panamanian_question: "Панамский вопрос"
 VEN_the_panamanian_question_desc: "Панама также подвергается риску манипулирования Западом. Они должны быть спасены как можно скорее."
 VEN_the_march_north: "Марш на север"
 VEN_the_march_north_desc: "Центральная и Северная Америка были испорчены бедными бедлами Запада, и мы должны убедиться, что эта модель не будет продолжаться. Мы положим остановки на этот западный прилив."
 VEN_bolivarian_workers_reunited: "Боливарские рабочие воссоединились"
 VEN_bolivarian_workers_reunited_desc: "Боливарские работники были наконец объединены под одним баннером. Наши надежды на еще большие амбиции стали возможными, и наш путь к большей революции теперь разблокирован."
 VEN_proclaim_the_south_american_union: "Провозглашать южноамериканский союз"
 VEN_proclaim_the_south_american_union_desc: "Со всей землей, которую мы контролируем, мы наконец можем составить профсоюз южноамериканских социалистических республик. Это был утомительный процесс, но мы, наконец, можем показать миру, что мы серьезно относимся к этому!"
 VEN_the_revolutionary_south_american_industry: "Революционная южноамериканская индустрия"
 VEN_the_revolutionary_south_american_industry_desc: "С таким большим количеством земли под нашим контролем, мы можем продвигать нашу отрасль до самого потенциального потенциала, представляя отрасль, которая конкурирует с силами великих миров."
 VEN_an_army_like_no_other: "Армия, как никто другой"
 VEN_an_army_like_no_other_desc: "Все остальные армии будут бояться наших! Мы будем самыми мощными!"
 VEN_major_naval_investments: "Основные военно -морские инвестиции"
 VEN_major_naval_investments_desc: "Наши амбиции потребуют очень сильного флота, чтобы добиться успеха."
 VEN_the_asian_counterweight: "Азиатский противовес"
 VEN_the_asian_counterweight_desc: "Так же, как Запад был испорчен империалистическим мышлением, так и Азия, в частности Японская империя. Их люди нуждаются в освобождении, и мы будем тем, кто это сделает."
 VEN_counter_japanese_imperialism: "Контр -японский империализм"
 VEN_counter_japanese_imperialism_desc: "Дни Имперской Японии закончились, пришло время заплатить за все преступления, которые они совершили."
 VEN_liberate_mexico: "Освободить Мексику"
 VEN_liberate_mexico_desc: "Ваши дни считаются Мексикой, прилив революции придет к вам, и ваш народ будет подняться против вашего несчастного правительства."
 VEN_liberate_the_guyanas: "Освободите гуаян"
 VEN_liberate_the_guyanas_desc: "Гуаяны были под европейским рабством слишком долго. Их люди просили о спасении, и это то, что мы дадим им."
 VEN_the_caribbean_question: "Карибский вопрос"
 VEN_the_caribbean_question_desc: "Из -за нашей непосредственной близости к Карибскому морю мы можем воспользоваться этим и спланировать наше вторжение в регион, чтобы их взять и не позволить Западу эксплуатировать их."
 VEN_strike_at_capitalism: "Удар по капитализму"
 VEN_strike_at_capitalism_desc: "Капитализм длился слишком долго, пришло время положить последний гвоздь в гроб и избавиться от этой ошеломляемой идеологии раз и раз и навсегда."
 VEN_the_global_revolution: "Глобальная революция"
 VEN_the_global_revolution_desc: "Теперь мы видим новую эру человечества, которая не пронизана позорными лидерами, коррумпированными политиками и небезопасными диктаторами. Мы смотрим на мир, которого заслуживает Земля, идеалы, которые приведут нас вперед, и эпоху технологических достижений, социальных достижений, наряду с миром и процветанием!"
 VEN_la_tierra_de_bolivar: "La Tierra de Bolivar"
 VEN_la_tierra_de_bolivar_desc: "Наш великий освободитель, Саймон Боливар, родился в нашей прекрасной стране Венесуэлы. У него были амбиции, в отличие от любого другого, и, несмотря на тот факт, что многие сомневались в нем, он все еще продвигался вперед и сумел сформировать то, что в конечном итоге стало Гран Колумбией. Абсолютная электростанция нации, которая, к сожалению, перестала существовать почти столетие назад. Это, как и скоро, скоро изменится, так как мы вернем его мечты и амбиции из могилы, и снова реформируйте бабурию Колумбию!"
 VEN_unification_mandate: "Мандат объединения"
 VEN_unification_mandate_desc: "С 1830 года мечта о воссоединении Большой Колумбии сохранялась. Теперь это желание более живое, чем когда -либо. Мы полны решимости возобновить это желание, которое было омрачено личными интересами и политическими разногласиями, но на этот раз мы сделаем это должным образом. Гран Колумбия вернется к жизни, либо по закону, либо по мечту."
 VEN_ensure_total_victory: "Обеспечить полную победу"
 VEN_ensure_total_victory_desc: "Некоторые из Боливарских стран могут противостоять нашим амбициям воссоединения, но это нормально. Мы позаботимся о том, чтобы они попали под контроль, мирно или силой."
 VEN_no_second_chances: "Никаких вторых шансов"
 VEN_no_second_chances_desc: "Этот мир слишком жестокий, чтобы быть мягким во второй раз. Боливар был слишком снисходительным, и это вызвало растворение тогдашней Гран Колумбии, но на этот раз этого не произойдет. Мы сделаем все, что в наших силах, чтобы убедиться, что этого не произойдет во второй раз. Настоящая слава Гран Колумбии скоро будет продемонстрирована!"
 VEN_nuestra_por_derecho: "Nuestra por derecho"
 VEN_nuestra_por_derecho_desc: "Американское правительство - не что иное, как посредник. Они поддержали разделение Панамы в 1903 году, чтобы просто построить и сохранить канал. Если мы возьмем Панаму, мы также должны взять канал. Это принадлежит нам по праву, благодаря нашей истории, а не им. Независимо от того, сколько крови пролита, американский анклав будет уничтожен."
 VEN_la_marcha_al_norte: "La Marcha Al Norte"
 VEN_la_marcha_al_norte_desc: "Ничего более абернтного, чем ультра-капиталистический корпоратизм стран к северу от континента. Мы простираем их, как человеческая лавина, пока не останется следов американской организованной плутократии."
 VEN_the_mexican_question: "Мексиканский вопрос"
 VEN_the_mexican_question_desc: "Поскольку время ставится заканчивая, становится яснее и яснее, что Мексика является просто препятствием в нашем стремлении к величию, стоящим на пути окончательной славы. Не только это, но они стали жертвой капитализма и западных влияний, чем мы, наконец, сможем избавиться раз и навсегда."
 VEN_la_armada_gran_colombiana: "La Armada Gran Colombiana"
 VEN_la_armada_gran_colombiana_desc: "Военно -морской флот Гран Колумбия будет упомянут в книгах истории, опасанный флот, с которым могут столкнуться только самые сильные военно -морские силы! Наш флот скоро достигнет этих стандартов, и мы позаботимся о том, чтобы это было."
 VEN_our_ambition_in_the_caribbean: "Наши амбиции в Карибском бассейне"
 VEN_our_ambition_in_the_caribbean_desc: "Пришло время нацелиться на расширение нашей территории в Карибское бассейн."
 VEN_the_true_dominant_power_in_america: "Истинная доминирующая сила в Америке"
 VEN_the_true_dominant_power_in_america_desc: "Сцена установлена, наш последний танец против Соединенных Штатов - это последнее, что ожидается на нашем великом амбициозном завоевании."
 VEN_development_near_the_amazonas: "Развитие возле Амазонки"
 VEN_development_near_the_amazonas_desc: "Amazonas печально известен своим отсутствием снабжения. Нам нужно адекватно построить его, чтобы подготовиться к нашему вторжению."
 VEN_the_march_south: "Марш на юг"
 VEN_the_march_south_desc: "Страны на юге являются следующими в нашем списке завоеваний. Вскоре они будут уничтожены этой картой во имя большей колумбии!"
 VEN_take_down_the_giant: "Снять гигант"
 VEN_take_down_the_giant_desc: "Последняя битва, последний враг. Это все, что осталось, и мы позаботимся о том, чтобы они быстро справлялись, независимо от затрат!"
 VEN_secure_the_tungsten_mines: "Закрепить вольфрамовые шахты"
 VEN_secure_the_tungsten_mines_desc: "В то время как нефть является нашим самым прибыльным ресурсом, вольфрам, тем не менее, ценен. Таким образом, мы должны работать над тем, чтобы обеспечить наши вольфрамовые шахты."
 VEN_establish_the_confederation_as_a_dominion: "$ECU_reforming_the_lost_unions$"
 VEN_establish_the_confederation_as_a_dominion_desc: "$ECU_reforming_the_lost_unions_desc$"
 VEN_the_union_of_the_americas: "$ECU_the_union_of_the_americas$"
 VEN_the_union_of_the_americas_desc: "$ECU_the_union_of_the_americas_desc$"
 VEN_the_southern_cone: "Южный конус"
 VEN_the_southern_cone_desc: "Продолжая марш на юг, страны Чили, Аргентина и Уругвай вскоре встретятся с гневом Гран Колумбии."
 VEN_the_gran_colombian_economy: "Колумская экономика Гран"
 VEN_the_gran_colombian_economy_desc: "По мере того, как мы расширяемся и развиваемся в силе, так и наша экономика. Инвестиции по всему совету в нашей экономике будут созданы для продвижения дальнейшего экономического роста."
 VEN_extract_the_amazonian_rubber: "Извлечь амазонский резин"
 VEN_extract_the_amazonian_rubber_desc: "Amazonas печально известен своей неиспользованной резиновой подачей. Мы обязательно будем использовать это как можно больше."
 VEN_panama_canal_profits: "Панамский канал прибыль"
 VEN_panama_canal_profits_desc: "Поскольку Панамский канал твердо под контролем, мы можем начать в полной мере использовать его статус удушья в международной торговле, принося большую сумму денег."
 VEN_purchase_our_remaining_territories: "Купить наши оставшиеся территории"
 VEN_purchase_our_remaining_territories_desc: "Есть еще несколько территорий, которые по праву принадлежат нам, поэтому мы будем использовать нашу вновь обретенную экономическую силу для покупки этих территорий и убедиться, что они переданы нам."
 VEN_close_american_cooperation: "Закрытие американского сотрудничества"
 VEN_close_american_cooperation_desc: "С нашей растущей силой и влиянием нам необходимо сотрудничать со следующей сильной силой, способной помочь нам. Соединенные Штаты."
 VEN_protection_over_the_caribbean_and_CA: "Защита от Карибского бассейна и Центральной Америки"
 VEN_protection_over_the_caribbean_and_CA_desc: "Мы будем защищать независимость наших братьев Карибского бассейна и Центральной Америки от иностранных держав."
 VEN_ensure_peace_in_our_homeland: "Обеспечить мир на нашей родине"
 VEN_ensure_peace_in_our_homeland_desc: "Коммунизм и фашизм не имеют места в Южной Америке. Мы должны избавить наш континент от этих двух угроз."
 VEN_the_people_are_always_respected: "Людей всегда уважают"
 VEN_the_people_are_always_respected_desc: "Мы должны бороться с фашистской угрозой в Южной Америке!"
 VEN_there_shall_be_no_revolution: "Не будет революции"
 VEN_there_shall_be_no_revolution_desc: "Мы должны бороться с коммунистической угрозой в Южной Америке!"
 VEN_assess_the_situation_in_europe: "Оценить ситуацию в Европе"
 VEN_assess_the_situation_in_europe_desc: "Демократические силы больше привлекают наши убеждения и позиции. Фашистские силы? Не так много."
 VEN_no_to_nazism: "Нет нацизму"
 VEN_no_to_nazism_desc: "Нацизм - это мерзкая идеология, которая не имеет места в нашей стране и не должна существовать вообще."
 VEN_gran_colombians_in_operation_avalanche: "[VEN.GetAdjective]s в операции Avalanche"
 VEN_gran_colombians_in_operation_avalanche_desc: "Вторжение в Италию идет полным ходом, и мы должны убедиться, что мы присутствуем в нем и помогаем как можно больше."
 VEN_establish_the_GetYear_constitution: "Установить конституцию [GetYear]"
 VEN_establish_the_GetYear_constitution_desc: "Пересмотр предыдущей конституции должен быть установлен. Его замена будет включать в себя множество изменений, таких как 5 -летний президентский сроки, запрет коммунистических и анархистских партий, а также общую повышение безопасности для людей и страны в целом."
 VEN_pass_worker_right_reforms: "Правильные реформы прохождения работников"
 VEN_pass_worker_right_reforms_desc: "Выталкивая Лей де Трабаджо, будет продвигать трудолюбивую нацию, заполненную до краев, людьми, желающими работать и поддерживать как самих, так и нацию в полной мере. Наша экономика наверняка будет расти с этим новым законом, как указано [VEN.GetLeader]"
 VEN_fiscal_reforms: "Фискальные реформы"
 VEN_fiscal_reforms_desc: "Поскольку политическая ситуация в Венесуэле снижается, мы можем продолжить наши реформы в стране, чтобы улучшить национальную стабильность и единство."
 VEN_fixate_salaries: "Зарплата зарплаты"
 VEN_fixate_salaries_desc: "В настоящее время нам нужно заработать зарплату, чтобы облегчить экономическое управление нации. Сначала он может укусить среднего венесуэльца, но сверхурочная покупательская способность увеличится с заработной платой и улучшит общий доход венесуэльцев."
 VEN_anti_communist_crackdown: "Антикоммунистическое подавление"
 VEN_anti_communist_crackdown_desc: "Мы должны очистить коммунистическую идеологию и ее последователей из нашей страны."
 VEN_our_stance_in_the_world: "Наша позиция в мире"
 VEN_our_stance_in_the_world_desc: "Мы должны занять позицию на глобальной сцене. С кем мы будем на стороне?"
 VEN_allied_allignment: "Союзник"
 VEN_allied_allignment_desc: "Большая часть наших ценностей похожа на союзную причину. Было бы естественно, чтобы выровнять себя с ними."
 VEN_british_naval_funding: "Британское военно -морское финансирование"
 VEN_british_naval_funding_desc: "Известно, что британцы имеют самый сильный флот на планете. Получение финансирования от них значительно усилило бы нашу военно -морскую мощь и даже может позволить нам получить военно -морской флот, достойный регионального доминирования."
 VEN_purchase_guyana_esequiba: "Покупать Гуаяна Эсекиба"
 VEN_purchase_guyana_esequiba_desc: "Мы претендовали на Гайану Эсекибу с момента роспуска Гран Колумбии более века назад. Сегодня отмечает день, когда мы возвращаем его, используя как дипломатию, так и нашу вновь обретенную экономическую силу. Мы просто должны надеяться, что британцы примут наше предложение."
 VEN_american_protection: "Американская защита"
 VEN_american_protection_desc: "[USA.GetLeader] высказывался об их полноценной поддержке нашей нации и готовности помочь нам с военной техникой. Мы должны воспользоваться этой возможностью не только получить военную технику, но и укрепить отношения с Соединенными Штатами."
 VEN_exploit_ABC_oil: "Правильно эксплуатируйте масло острова ABC"
 VEN_exploit_ABC_oil_desc: "Благодаря нашему контролю острова ABC, мы можем использовать обильное количество нефти, найденного на этих островах."
 VEN_offer_protection_over_the_ABC_islands: "Предложите «защиту» на острова ABC"
 VEN_offer_protection_over_the_ABC_islands_desc: "Теперь, когда голландцы капитулировали, они не имеют реальной силы против нас. Мы можем оставаться дипломатическими, предлагая «защиту» на островах, когда на самом деле наша главная цель - аннексировать их на нашу территорию."
 VEN_demand_guyana_esequiba: "Требование Гайаны Эсекиба"
 VEN_demand_guyana_esequiba_desc: "Британцы слишком долго держались за Гайану. Это наша законная территория, и они передадут ее нам, дипломатически или силой!"
 VEN_mine_out_guyana_gold: "Моя золота Гайаны"
 VEN_mine_out_guyana_gold_desc: "В Гайанах много золота, и теперь, когда мы контролируем их, мы также контролируем золотые шахты. Давайте в наших интересах и начнем добывать."
 VEN_import_german_weaponry: "Импортировать немецкое оружие"
 VEN_import_german_weaponry_desc: "У немцев есть приличное вооружение, которое мы можем импортировать для себя."
 VEN_demand_the_remiander_of_the_guyanas: "Требовать оставшейся части гайан"
 VEN_demand_the_remiander_of_the_guyanas_desc: "Гайаны по праву принадлежат нам. В Южной Америке нет места для европейских держав, и нравится им это или нет, мы будем теми, кто их выгнал."
 VEN_a_new_republic_is_born: "Рождена новая республика"
 VEN_a_new_republic_is_born_desc: "После многих проблем, потерянных людей и жертв, конечная цель была достигнута. Гран Колумбия вернулась, но на этот раз мы не будем представлять экспансионизм и тоталитаризм. Вместо этого мы хотим проповедовать и принять идеи свободы и свободы. Мы будем значительной демократической властью на Западе, которая осуждает любые и все формы диктатуры и будет способствовать миру и процветанию, несмотря на наше воспитание."
 VEN_purchase_the_panama_canal: "Купить Панамский канал"
 VEN_purchase_the_panama_canal_desc: "Зачем идти на войну за Панамский канал, когда мы можем просто купить его?"
 VEN_axis_allignment: "Выравнивание оси"
 VEN_axis_allignment_desc: "Большая часть наших значений аналогична причине оси. Было бы естественно, чтобы выровнять себя с ними."
 VEN_venezuela_stands_with_no_one: "Венесуэла никого не стоит"
 VEN_venezuela_stands_with_no_one_desc: "Почему мы должны наставать на стороне кого -нибудь? Мы лучше, и мы можем получить гораздо больше, оставаясь нейтральными на глобальной сцене."
 VEN_pass_social_reforms: "Пройти социальные реформы"
 VEN_pass_social_reforms_desc: "Необходимость проходить социальные реформы в стране растет все больше и больше, и, если все сделано правильно, мы можем более эффективно решать внутренние проблемы нации."
 VEN_mas_que_un_sueno: "MAS Que un Sueño"
 VEN_mas_que_un_sueno_desc: "То, что когда -то было просто мечтой Боливара, стало реальностью. Сейчас мир уважает нас и нашего мощи, и многие страны боятся нас и делают все возможное, чтобы мы были на нашей хорошей стороне. Боливар, где бы вы ни находились, просто знайте, что мы достигли того, о чем вы всегда мечтали."
 VEN_fuel_armada_bolivariana: "Топливо Армада Боливариана"
 VEN_fuel_armada_bolivariana_desc: "Армада Боливариана имеет долгую историю, начиная с дней правления Боливара. Это наиболее приоритет, что мы обеспечиваем достаточно топлива на нашем флоте."
 VEN_naval_investments: "Военно -морские инвестиции"
 VEN_naval_investments_desc: "Мы не можем позволить нашим военно -морским власти позади. Пришло время поместить некоторые инвестиции в наш флот."
 VEN_create_compania_de_defensa_de_costas: "Создайте Compañía de Defensa de Costas"
 VEN_create_compania_de_defensa_de_costas_desc: "[VEN.GetLeader] недавно проанализировал ситуацию наших морских пехотинцев и определила, что должна быть создана новая морская компания для укрепления как нашей армии, так и спецназа."
 VEN_focus_on_submarines: "Сосредоточьтесь на подводных лодках"
 VEN_focus_on_submarines_desc: "Подводные лодки обладают возможностями ухода под водой, вводящими в врага, но упаковывая большую силу."
 VEN_modernize_destroyers: "Модернизировать эсминщики"
 VEN_modernize_destroyers_desc: "Чем более современные наши эсминцы, тем лучше."
 VEN_the_heavier_the_better: "Чем тяжелее, тем лучше"
 VEN_the_heavier_the_better_desc: "Это, как следует из названия ... пауза"
 VEN_conservative_production: "Консервативное производство"
 VEN_conservative_production_desc: "Мы не можем просто инвестировать все, что у нас есть в военный сектор экономики, так как это может привести к значительным последствиям. Вместо этого давайте инвестируем скромное количество, чтобы мы все еще могли улучшить вооруженную индустрию, не влияя на другие части экономики."
 VEN_ambitions_of_large_navy: "Амбиции большого флота"
 VEN_ambitions_of_large_navy_desc: "Со всеми улучшениями, внесенными в нашу военно -морскую мощь, мы должны еще больше сгибать наши мышцы и продолжать иметь большой, респектабельный флот."
 VEN_purchase_italian_destroyers: "Купить итальянские эсминцы"
 VEN_purchase_italian_destroyers_desc: "Покупка эсминцев у итальянцев определенно поможет укрепить нашу военно -морскую силу."
 VEN_convince_laureano_to_come_back: "Убедить Лауано вернуться"
 VEN_convince_laureano_to_come_back_desc: "Из всех, кто приходит на ум, только один человек достаточно подходит, чтобы правильно управлять нацией: Лауано. Его идеалы консерватизма и авторитаризма идеально подходят для нашего стиля правительства, и его правление железного кулака наверняка заставит людей понять, что это единственный путь вперед."
 VEN_brutal_protest_Repression: "Жестокие репрессии протеста"
 VEN_brutal_protest_Repression_desc: "Правительство всегда знает, что лучше для народа, и люди должны соблюдать слово правительства ни без конкурса, ни вопроса."
 VEN_the_hegemonia_andina_reigns_supreme: "Hegemonía Andina Reigns Верховная"
 VEN_the_hegemonia_andina_reigns_supreme_desc: "Hegemonía Andina относится к лидерам Венесуэлы, которые приехали из Венесуэльских Андов, большинство из которых сочувствовали авторитарному управлению и идеологии. Эти великие люди должны служить катализатором нашего движения."
 VEN_la_nueva_era: "La Nueva Era"
 VEN_la_nueva_era_desc: "Мы не можем продолжать идти с этим ужасным правительством Бога, нет. Все, что нужно изменить, и начиная с сегодняшнего дня, они будут, так как [VEN.GetLeader] уйдет в отставку с власти, и на его месте Лауано возьмет под свой контроль, направив Венесуэлу в новую эру, лучшую эпоху."
 VEN_crush_the_revolutionaries: "Раздавить революционеров"
 VEN_crush_the_revolutionaries_desc: "Эти чертовы революционеры просто не знают, когда уйти, не так ли? Мы просто сообщим им очень «любезно», что они больше не должны быть в этой стране."
 VEN_formalize_the_black_divisions: "Формализовать черные дивизии"
 VEN_formalize_the_black_divisions_desc: "Как приказано [Ven.GetLeader], черные подразделения должны быть официально сформированы в стране, получая приоритет поставки оборудования, чтобы обеспечить их силу и мастерство."
 VEN_mobilize_the_economy_fash: "Мобилизовать экономику"
 VEN_mobilize_the_economy_fash_desc: "Все на фабриках! Приступим к работе сейчас!"
 VEN_closer_italian_cooperation: "Ближе итальянское сотрудничество"
 VEN_closer_italian_cooperation_desc: "Наши идеалы наиболее близки напоминают те, которые представлены Муссолини и итальянцами. Связание себя ближе к итальянцам - самый разумный вариант, который мы имеем в нашем распоряжении, и они могут даже захоть помочь нам."
 VEN_italian_military_advisors: "Итальянские военные советники"
 VEN_italian_military_advisors_desc: "Итальянцы высказывались о своей поддержке нашего режима и готовы отправить нам военных консультантов для улучшения наших собственных военных. Мы будем с радостью возьму этих советников."
 VEN_consolidate_power: "Консолидировать власть"
 VEN_consolidate_power_desc: "Теперь, когда мы имеем полный контроль, мы можем начать консолидацию энергии и очищать страну любого и всех оппозиций."
 VEN_the_great_purge: "Великая чистка"
 VEN_the_great_purge_desc: "Хотя это может быть грубым, это необходимая мера, чтобы гарантировать, что наш шкаф чист и без предателей. Оставить даже только один может привести к серьезным последствиям в будущем, поэтому мы не можем рисковать."
 VEN_internal_industrial_rework: "Внутренняя промышленная переделка"
 VEN_internal_industrial_rework_desc: "Индустрия требует, чтобы серьезные переосмысления функционировали должным образом. Честно говоря, сбивает с толку, как предыдущие правительства были так расслаблены по этому вопросу."
 VEN_adopt_a_corporatist_economic_model: "Принять корпоратистскую экономическую модель"
 VEN_adopt_a_corporatist_economic_model_desc: "Учитывая наш текущий стиль правительства, корпоратистская экономическая модель принесет наибольшую пользу и рост нашей экономике в настоящее время. Это связано с государственным финансированием, но преимущества перевешивают негативы."
 VEN_italian_industrial_influence: "Итальянское промышленное влияние"
 VEN_italian_industrial_influence_desc: "Поскольку мы все больше и больше объединяем себя с итальянцами, наша отрасль начала оказывать влияние итальянского языка, в более мелком масштабе приняла некоторые итальянские экономические модели. Мы просто должны надеяться, что это окажется к лучшему."
 VEN_national_military_Reorganization: "Национальная военная реорганизация"
 VEN_national_military_Reorganization_desc: "Военные в его нынешнем состоянии ужасны и нуждаются в крупных переосмыслениях. Мы предсказываем, что эти переосмысления будут полностью завершены примерно через два месяца, и результаты будут впечатляющими."
 VEN_military_investments: "Военные инвестиции"
 VEN_military_investments_desc: "Мы должны больше инвестировать в наши военные, это действительно нужно."
 VEN_major_military_expansion: "Основные военные инвестиции"
 VEN_major_military_expansion_desc: "Мы начнем перенаправлять крупное финансирование в военных, чтобы значительно улучшить его, даже если это принесет последствия для других секторов отрасли."
 VEN_gendarme_necesario: "Жендарм Нерезарио"
 VEN_gendarme_necesario_desc: "Как заявил сам [VEN.GetLeader], Gendarmerie является необходимой ветвью военных, которая должна быть установлена ​​как можно скорее. Благодаря надлежащему финансированию и военной технике мы можем сделать это реальностью."
 VEN_expand_the_national_academy_of_history: "Расширить Национальную историю"
 VEN_expand_the_national_academy_of_history_desc: "Нам необходимо расширить Национальную академию истории, чтобы лучше рассказать о наших людях как глобальной истории, так и о нашей собственной, чтобы не повторять ошибки и вместо этого улучшать и расти как как люди, так и страну."
 VEN_define_our_foreign_policy: "Определите нашу внешнюю политику"
 VEN_define_our_foreign_policy_desc: "Теперь, когда мы правильно установили себя, мы можем начать смотреть наружу и определить нашу внешнюю политику."
 VEN_raise_military_salaries: "Поднимите военную зарплату"
 VEN_raise_military_salaries_desc: "В настоящее время большая часть военных недофинансируется, и различные филиалы озвучивали эту проблему. Если мы хотим предотвратить сохраняющуюся эту проблему, нам нужно повысить их зарплату, несмотря на последствия."
 VEN_the_unthinkable: "Немыслимый"
 VEN_the_unthinkable_desc: "Никто никогда не ожидает, что Венесуэла будет писать ядерное оружие, но, как говорится, всегда ожидайте неожиданного."
 VEN_the_ambition_of_a_greater_venezuela: "Амбиции Большой Венесуэлы"
 VEN_the_ambition_of_a_greater_venezuela_desc: "Несмотря на то, что это никогда не было заявлено, идея Большой Венесуэлы задерживалась много лет. То, что сейчас является просто простой идеей, может быть превращена в реальность с достаточными усилиями и тяжелой работой, даже если жизнь потеряна."
 VEN_push_our_claims_in_the_guyanas: "Протолкнуть наши претензии в Гайане"
 VEN_push_our_claims_in_the_guyanas_desc: "Мы должны выдвигать восток и претендовать на Гайанас как венесуэльскую территорию."
 VEN_industrial_development_in_our_integral_states: "Промышленное развитие в наших завоеванных заявленных государствах"
 VEN_industrial_development_in_our_integral_states_desc: "По мере того, как мы расширяем наши границы, нам нужно развить провинции, которые мы захватываем, и довести их до того же стандарта, что и нашу материковую территорию."
 VEN_major_naval_buildup: "Крупное военно -морское наращивание"
 VEN_major_naval_buildup_desc: "Нам понадобится очень сильный флот, если мы хотим выполнить наши планы."
 VEN_our_lands_in_colombia: "Наши земли в Колумбии"
 VEN_our_lands_in_colombia_desc: "Колумбия питает некоторые из наших заявленных земель, и это скоро изменится!"
 VEN_no_end_to_our_ambition: "Нет конца нашим амбициям"
 VEN_no_end_to_our_ambition_desc: "Зачем останавливаться сейчас?  Мы просто продолжаем расти и расти у власти, и наши амбиции растут только вместе с ним."
 VEN_the_european_ambition: "Европейские амбиции"
 VEN_the_european_ambition_desc: "Мир - наша устрица; Мы не должны ограничивать себя только Южной Америкой - расширение в Европе звучит очень заманчиво."
 VEN_the_initiative_campaigns: "Инициативные кампании"
 VEN_the_initiative_campaigns_desc: "Так же, как мы делали с Колумбией, мы можем заранее спланировать наши атаки и получить инициативу против врага, чтобы победить их еще быстрее."
 VEN_the_bolivarian_integration_campaign: "Кампания по интеграции Боливара"
 VEN_the_bolivarian_integration_campaign_desc: "Есть много земель, не контролируемых нами должным образом или пронизаны сопротивлением. Мы рассмотрим эти бесполезные усилия быстро."
 VEN_the_terror_of_the_americas: "Ужас Америки"
 VEN_the_terror_of_the_americas_desc: "Многие в регионе начали обменять нас «террором Америки» из -за нашей жестокости и экспансионизма. Пусть они сжимаются в страхе, мы будем только сильнее! Никто не остановит нас!"
 VEN_continue_the_march_down_south: "Продолжить марш по югу"
 VEN_continue_the_march_down_south_desc: "Перу стоит на нашем пути между нами и абсолютным величием. Это простой контрольно -пропускной пункт, с которым будет быстро разобраться!"
 VEN_prepare_for_the_amazonian_march: "Подготовьтесь к амазонскому маршу"
 VEN_prepare_for_the_amazonian_march_desc: "Прохождение по Амазонке будет чрезвычайно сложным, поэтому нам нужно заранее подготовиться, чтобы лучше увеличить наши шансы на быструю победу."
 VEN_the_amazonian_march: "Амазонский марш"
 VEN_the_amazonian_march_desc: "Планы были завершены, пришло время запустить наше вторжение в Бразилию через амазонки. Если все пойдет хорошо, мы победим их в кратчайшие сроки!"
 VEN_full_bolivarian_integration: "Полная боливарианская интеграция"
 VEN_full_bolivarian_integration_desc: "Последняя оставшаяся страна Боливара не под нашим руками - Боливия, но это скоро изменится!"
 VEN_the_great_southern_march: "Великий южный марш"
 VEN_the_great_southern_march_desc: "Есть много полезных ресурсов, которые можно найти в южном конусе Южной Америки. Мы скоро возьмем их в себя, будь то оригинальным странам это или нет."
  
  ## MONARCHIST REWORK ## 
 BRA_empower_the_patrianovistas: "Расширить Patrianovistas"
 BRA_empower_the_patrianovistas_desc: "Патриановисты, также известные как Патрия-Нова, являются монархистской организацией, которая присутствует в стране с 1932 года. Первоначально его возглавляла Арлиндо Вейга Дос Сантос, однако он покинул партию около 2 лет назад. Теперь, здесь мы стоим, с обретенной возможностью привлечь патриановистов на славу и в конечном итоге восстановление империи!"
 BRA_gone_but_not_forgotten: "Ушел, но не забыт"
 BRA_gone_but_not_forgotten_desc: "Несмотря на годы, прошедшие с тех пор, как Педро II ушел от власти, многие бразильцы по всей стране по-прежнему имеют очень про-монархистские настроения. Все, что нам нужно сделать, это сообщить им о существовании нашей группы и наших целей, и они обязательно присоединятся к нашему делу."
 BRA_by_blood_alone: "Только кровью"
 BRA_by_blood_alone_desc: "Варгас скоро будет на нас с нашими выходками, поэтому переворот невозможно будет выполнить. Столько, сколько ему больно, нам нужно пожертвовать бразильской жизнью, чтобы вернуть страну к ее прежней славе и еще больше!"
 BRA_rekindle_imperial_sentiments: "Возрождает имперские чувства"
 BRA_rekindle_imperial_sentiments_desc: "Имперские настроения уже давно присутствовали в бразильском населении, но его влияние умирает с годами. Мы должны предотвратить продолжение этой тенденции!"
 BRA_long_live_the_monarchy: "Давно жить монархией"
 BRA_long_live_the_monarchy_desc: "Avé Gloria, Avé Imperio! Вниз с антимонархистами!"
 BRA_smuggle_italian_weapons: "Переводить итальянское оружие"
 BRA_smuggle_italian_weapons_desc: "Нам нужно собрать как можно больше оружия, чтобы иметь шанс против Варгаса и его коалиции!"
 BRA_the_imperial_war_machine: "Имперская военная машина"
 BRA_the_imperial_war_machine_desc: "По мере того, как мы растем, так же как и наша промышленность. Имперская военная машина только сейчас началась, и нет никакой остановки!"
 BRA_an_imperial_coup: "Императорский переворот"
 BRA_an_imperial_coup_desc: "Кровь не должна быть пролита в нашем стремлении к большему блага бразильцев. Вместо этого давайте покажем эти ублюдки, что у нас больше стандартов, и не просто случайно проливайте бразильскую кровь из -за бессмысленных конфликтов!"
 BRA_promises_for_the_lower_class: "Обещания для нижнего класса"
 BRA_promises_for_the_lower_class_desc: "Существует большая поддержка, которую можно получить от менее удачи. Мы обеспечим, чтобы они получили свою прибыль от нашего роста и процветания!"
 BRA_take_over_the_department_of_propaganda: "Захватить пропаганду Destamento Do"
 BRA_take_over_the_department_of_propaganda_desc: "Пропаганда Destamento Do была создана Варгасом, чтобы изгнать бессмысленную чушь в надежде на людей вступить в это, но не на нас! Вместо этого мы будем использовать его на благо людей, чтобы продвигать идеи, которые когда -то побудили Бразилию, чтобы стать величайшей властью в Америке!"
 BRA_absorb_the_integralists: "Поглощать интегралистов"
 BRA_absorb_the_integralists_desc: "Плинио всегда очень уважал Арлиндо и его Патриановисту. В случае объединения, Плинио будет более чем рад объединить наши стороны в надежде на большее блага страны. Тем не менее, интегралисты ожидают, что мы будем продолжать с нашей стороны обещания поддерживать авторитарного лидера."
 BRA_the_integralist_squadrons: "Интегралистские эскадрильи"
 BRA_the_integralist_squadrons_desc: "Новые эскадрильи должны быть реализованы, чтобы раздавить антимонархисты! Avé Gloria, Avé Imperio!"
 BRA_challenge_vargas: "Вызов Варгас"
 BRA_challenge_vargas_desc: "У Варгаса был свой путь достаточно долго. Пришло время начать быть на его стороне и убедиться, что он больше не контролирует бразильский народ!"
 BRA_total_war_against_the_anti_monarchists: "Полная война против антимонархистов"
 BRA_total_war_against_the_anti_monarchists_desc: "Антимонархисты уже несколько месяцев проливали кровь наших соотечественников! Это не будет длиться дольше, и мы будем бороться с огнем, если это означает, что они остановится со своими отвратительными аэциями!"
 BRA_in_memory_of_the_ribeirazinho_revolt: "В память о восстании рибейразиньо"
 BRA_in_memory_of_the_ribeirazinho_revolt_desc: "Восстание Рибейрайразиньо было небольшим восстанием, которое произошло в том, что сейчас является Такваритингом, с надеждой восстановить тогдашнего истецкого претендента на престол принца Луиза из Орлеанс-Браганза. Это восстание показывает, что есть все еще много Паулистов с про-монархистскими чувствами, желающими бороться за большую причину империи!"
 BRA_the_monarchists_in_the_north_east: "Монархисты на северо -востоке"
 BRA_the_monarchists_in_the_north_east_desc: "Монархизм всегда был наиболее заметным на северо -востоке страны, в частности Pernambuco. Захватывание северо -востока не предложит нам проблем."
 BRA_win_over_military_loyalty: "Победить лояльность военных"
 BRA_win_over_military_loyalty_desc: "В то время как значительная часть офицеров остается верной Варгасу, все еще есть много, кто придерживается про-монархистских настроений, и эти генералы могут помочь нам изменить поток этого конфликта!"
 BRA_emperor_pedro_gastao: "Император Педро Гаст"
 BRA_emperor_pedro_gastao_desc: "Педро Гаст из Орлеанс-Браганса, глава филиала Петрополиса и сын другого заявителя на престоле Педро де Алькантара, является идеальной перспективой для нового императора Бразилии. Его отношения и связи с интегрализмом также послужат порядок в новой империи и обеспечить абсолютную лояльность."
 BRA_emperor_pedro_henrique: "Император Педро Энрике"
 BRA_emperor_pedro_henrique_desc: "Прозвище «ожидаемого принца» из -за его связей с королевской семьей и его претензий на трон, нет лучшего кандидата для императора, чем он. Его спокойное поведение и голова по уровню обязательно принесут процветание в новую империю!"
 BRA_empress_maria_elisabeth_focus: "Императрица Мария Элизабет"
 BRA_empress_maria_elisabeth_focus_desc: "Мария Элизабет из Баварии, жена Педро Энрике, является идеальным кандидатом на то, чтобы стать императрицей новой империи! Ее отношения с Баварией также будут означать, что империя теперь будет иметь законное требование о Баварии."
 BRA_emperor_pedro_alcantara: "Император Педро де Альлканара"
 BRA_emperor_pedro_alcantara_desc: "Дом Педро де Алькантара из Орлеанс-Браганса, принц Грао Пара, был первым сыном Дона Изабель, принцессы имперской Бразилии и принца Гастона из Орлеанса, графы ЕС и как таковой, родился вторым в линии на Имперском престоле Бразилии, во время правления его дедушки, Эмпир-Педро, до тех пор, пока не до тех пор, пока не доми. Он действительно избран!"
 BRA_reintegrate_the_cisplatine: "Реинтегрировать цисплатин"
 BRA_reintegrate_the_cisplatine_desc: "На протяжении большей части продолжительности империи цисплатин был неотъемлемой частью нации. Тем не менее, цисплатиновая война вызвала возможную независимость Уругвая. Теперь, когда мы снова находимся у власти, мы переоценим цисплатин на нашу территорию!"
 BRA_contact_the_italians: "Свяжитесь с итальянцами"
 BRA_contact_the_italians_desc: "Нам нужна итальянская помощь, если мы хотим обеспечить победу над антимонархистами."
 BRA_there_can_only_be_one: "Может быть только один"
 BRA_there_can_only_be_one_desc: "Португальцы должны говорить только одна страна, и это будет вторая бразильская империя! Там нет места для неудачного состояния, как Португалия."
 BRA_dissolve_the_press: "Растворить прессу"
 BRA_dissolve_the_press_desc: "Пресса долгое время была на нашей стороне, извергая случайное дерьмо, которое никого не заботится об этом. Нам лучше без этого."
 BRA_the_imperial_brazilian_army: "Установить Divisao Imperial"
 BRA_the_imperial_brazilian_army_desc: "Divisao Imperial будет группой элитных подразделений в Королевской армии, сдал задачи, имеющую огромное значение. Они обязательно принесут много побед в битве!"
 BRA_absorb_the_french_throne: "Поглощать французский трон"
 BRA_absorb_the_french_throne_desc: "Наше претензия на французский трон был очень длинным, и теперь, когда мы контролируем французский Mainalnd, мы можем начать объединять престолы, как это всегда должно было быть."
 BRA_our_eternal_rival: "Наш вечный соперник"
 BRA_our_eternal_rival_desc: "Ни одна другая страна не вошла с нами столько раз, сколько аргентинцы. Они были нашим вечным соперником, и сегодня день, когда заканчивается соперничество, с крахом их страны!"
 BRA_join_the_axis_monarchy: "Присоединяйтесь к оси"
 BRA_join_the_axis_monarchy_desc: "Ось представляет наши идеалы адекватно. Соберите себя с ними - самый логичный выбор."
 BRA_join_the_allies_monarchy: "Присоединяйтесь к союзникам"
 BRA_join_the_allies_monarchy_desc: "Союзники представляют наши идеалы адекватно. Соберите себя с ними - самый логичный выбор."
 BRA_consolidate_power: "Консолидировать власть"
 BRA_consolidate_power_desc: "Теперь, когда мы контролируем империю, мы можем консолидировать ее и получить абсолютную власть над каждым ее аспектом!"
 BRA_promote_seperatist_sentiment_in_bavaria: "Содействовать севератистским настроениям в Баварии"
 BRA_promote_seperatist_sentiment_in_bavaria_desc: "Поскольку ситуация в Германии ухудшается, наш шанс поддержать баварский национализм и объединиться с ними только растет. Мы воспользуемся этой возможностью, для большего блага королевства!"
 BRA_take_over_the_guyanas: "Захватить Гайанас"
 BRA_take_over_the_guyanas_desc: "Гайаны имеют многочисленное количество ресурсов. Использование их может принести нам отличное состояние!"
 BRA_establish_brazilian_west_africa: "Создать бразильскую Западную Африку"
 BRA_establish_brazilian_west_africa_desc: "В то время как первоначально считался безумной идеей, мысль о бразильской Западной Африке казалась безумной для многих, но со временем все больше и больше размышляла за мысль, до сегодняшнего дня. [BRA.GetLeader] выдвинула создание бразильской западноафриканской кукольной страны и управлять непосредственно его самым верным сотрудником."
 BRA_the_race_for_africa: "Раса за Африку"
 BRA_the_race_for_africa_desc: "Это гонка со временем, чтобы увидеть, кто может удержать больше всего доминирования над Африкой, и этот титул пойдет к нам!"
 BRA_secure_the_italian_colonies: "Закрепить итальянские колонии"
 BRA_secure_the_italian_colonies_desc: "Итальянские колонии имеют много ресурсов, которые мы могли бы использовать. Из-за нашей близости к ним будет глупо не воспользоваться возможностью для полномасштабного вторжения!"
 BRA_the_imperial_navy: "Императорский флот"
 BRA_the_imperial_navy_desc: "Императорский флот достигнет своего пика и выйдет за его пределы! И Аргентина, и Чили рухнут в страхе!"
 BRA_the_imperial_scholars: "Имперские ученые"
 BRA_the_imperial_scholars_desc: "Эта страна полна ученых. Мы в полной мере воспользуемся этим!"
  
  ### NEW DLC CONTENT ### 
 ARG_buenos_aires_development: "Buenos Aires Development"
 ARG_buenos_aires_development_desc: "Буэнос -Айрес, по прозвищу Париж Южной Америки, наполнен красотой до кравей ... для постороннего. Однако для аргентинцев в различных аспектах, в основном промышленных. Мы выдвигаем промышленные разработки в столице, начиная с сегодняшнего дня!"
 ARG_manuel_antonio_fresco_desc: "Мануэль Антонио Фреско является нынешним губернатором Буэнос -Айреса и одной из главных перспектив преемника Юстао вместе с Роберто Марией Ортис. Однако, в отличие от Ортиса, фреска цепляется за более фашистские идеалы, восхваляя и боготворяя таких, как Адольф Гитлер и Бенито Муссолини, так что назначение его как лидера вполне может привести к фашистскому поглощению."
 ARG_coerce_the_army: "Приступить к армии"
 ARG_coerce_the_army_desc: "Многие сектора военных всегда цеплялись за более тоталитарные идеологии в истории Аргентины. Их поддержка будет иметь решающее значение для нашего поглощения."
 ARG_take_full_control_f: "Возьмите полный контроль"
 ARG_take_full_control_f_desc: "Согласованность просто не представляет нашу идеологию адекватно. Идея гражданских либиртов снова и снова показывают, что она просто не обрезает ее. Между тем, такие страны, как Германия и Италия, процветали под фашизмом, и пришло время идти по их стопам."
 ARG_nadie_se_escapa_DLC: "§Rnadie se escapa§!"
 ARG_nadie_se_escapa_DLC_desc: "§Rlord только знает, что будет с теми, кто не следит за нашими приказами! §!"
 ARG_guerilla_tactics_DLC: "Партизанская тактика"
 ARG_guerilla_tactics_DLC_desc: "Нет ничего плохого в использовании партизанской тактики вместо того, чтобы бороться с ней на открытом воздухе."
 ARG_maintain_the_state: "Поддерживать состояние"
 ARG_maintain_the_state_desc: "С точки зрения оппозиции, которая теперь полностью справляется, мы можем сосредоточиться на укреплении текущего состояния и должным образом определить нашу внешнюю политику. Наши враги будут бояться нас!"
 ARG_the_legacy_of_rosas: "Наследие Розаса"
 ARG_the_legacy_of_rosas_desc: "Хуан Мануэль де Росас, военный генерал, лидер и национальный герой для аргентинской конфедерации. Он действительно наш герой, и мы сделаем все, что в нашей власти, чтобы он был должным образом представлен в нашей стране."
 ARG_uruguayan_integration: "Уругвайская интеграция"
 ARG_uruguayan_integration_desc: "Когда -то наша провинция, теперь, когда мы наконец -то имеем полный контроль над ней, мы можем правильно интегрировать его в территорию aregntine."
 ARG_major_naval_investments_DLC: "Основные военно -морские инвестиции"
 ARG_major_naval_investments_DLC_desc: "В мире есть много замечательных военно -морских способностей, поэтому мы должны убедиться, что наш флот может дать им драку, если мы хотим сделать наши амбиции в реальность."
 ARG_the_push_across_the_pacific: "Толчок через Тихий океан"
 ARG_the_push_across_the_pacific_desc: "Эти отвратительные британские колонии должны быть уничтожены с карты как можно скорее. Это отвратительно даже смотреть на них."
 ARG_attack_the_mainland_DLC: "Атаковать материк"
 ARG_attack_the_mainland_DLC_desc: "Теперь у нас есть и военно -морская сила, и рабочая сила, чтобы распустить британский флаг раз и навсегда, за всю жизнь, которую они занесли!"
 ARG_the_push_through_peru: "Толчок через Перу"
 ARG_the_push_through_peru_desc: "В «Предвидение Сан -Мартина в Объединенных провинциях Перу» также была частью этого. Если мы хотим воплотить эту мечту реальностью, нам нужно их победить."
 ARG_the_nail_in_the_coffin: "Гвоздь в гробу"
 ARG_the_nail_in_the_coffin_desc: "Вставьте эту чертову доктрину Монро вверх по заднице, у нас было достаточно США, и вскоре они рухнут!"
 ARG_european_theatre_DLC: "Европейский театр"
 ARG_european_theatre_DLC_desc: "В основном с Азией и Южной Америкой мы можем взглянуть на основную проблему по под рукой: Европа. Место рождения коммунизма, а также место рождения трудностей и страданий, которые привели к такой идеологии. Мы будем теми, кто наконец -то освободит их раз и навсегда."
 ARG_a_red_world_DLC: "Красный мир"
 ARG_a_red_world_DLC_desc: "Теперь мы видим новую эру человечества, которая не пронизана позорными лидерами, коррумпированными политиками и небезопасными диктаторами. Мы смотрим на мир, которого заслуживает Земля, идеалы, которые приведут нас вперед, и эпоху технологических достижений, социальных достижений, наряду с миром и процветанием!"
 ARG_al_amigo_todo_al_enemigo_nada_DLC: "§RAL AMIGO TODO AL ENEMIGO NADA§!"
 ARG_al_amigo_todo_al_enemigo_nada_DLC_desc: "Известная цитата сказала никто, кроме Хуана Доминго Перона, и та, которая несет серьезное убеждение. Наши враги заслуживают только худшего, но наши друзья и союзники, они заслуживают похвалы и поддержки на каждом этапе пути."
 ARG_argentine_industrial_heaven: "Аргентинский промышленный рай"
 ARG_argentine_industrial_heaven_desc: "Все идет так же, как и запланировано! Это действительно чудо, насколько растет наша экономика. Будем просто надеяться, что эта полоса удачи и удачи продолжится."
 ARG_defense_and_democracy: "Defensa y Democracia"
  
  ## PRU Small New Content ## 
 PRU_internal_management: "Внутреннее управление"
 PRU_internal_management_desc: "Мы не можем просто пойти на войну прямо сейчас, нам нужно сначала сосредоточиться внутренне и должным образом исцелить, прежде чем мы сделаем какие -либо поручения."
 PRU_the_kingdom_of_peru: "Королевство Перу"
 PRU_the_kingdom_of_peru_desc: "Будучи последним оставшимся бастионом наместника, когда испанская империя все еще имела понимание континента, это не секрет, что все еще существует значительная часть перуанского населения, которая хочет, чтобы им снова управлял королевство. Этот день наступил!"
 PRU_the_kingdom_strikes_back: "Королевство наносит ответный удар"
 PRU_the_kingdom_strikes_back_desc: "Испанцы просто не были вырезаны для задачи управления столько землей, они были слишком неэффективными, неряшливыми и бедными. Мы будем стереть их с карты и очистить исчезновение, которое они вызвали, и на их месте родился новый преемник, который гораздо более подходит для этой задачи."
 PRU_the_eternal_empire: "Вечная империя"
 PRU_the_eternal_empire_desc: "Теперь, когда мы контролируем то, что было изначально Испания, мы можем провозглашать официального преемника испанской империи! Империя будет жить, под новым правителем, а рай будет восстановлен!"
 PRU_revenge_against_the_europeans: "Месть европейцам"
 PRU_revenge_against_the_europeans_desc: "Эти европейские мраки просто не могут держать руки от континентов, которые не являются их собственными. Пришло время дать им вкус их собственного лекарства!"
 PRU_the_attack_on_the_west: "Атака на запад"
 PRU_the_attack_on_the_west_desc: "Запад нанес слишком большой ущерб. Они заплатят за то, что они сделали!"
 PRU_peruvian_heavy_military_industry: "Перуанская тяжелая военная промышленность"
 PRU_peruvian_heavy_military_industry_desc: "Военной индустрии Перу необходимо догнать другие сектора отрасли. Достаточно отвлечь ресурсов на военные."
 PRU_address_the_border_tensions: "Решать пограничное напряжение"
 PRU_address_the_border_tensions_desc: "Понятно, что даже с недавним статус -кво, подписанным в 1936 году, Эквадор не поддержит подписанную на границах и может даже попытаться взять землю незаконно у нас. Нам нужно, чтобы наши глаза были очищены от любого подозрительного движения на их конце."
 PRU_militarize_pastaza: "Милитаризация пастаза"
 PRU_militarize_pastaza_desc: "С эквадором, ремилитаризацией их части Pastaza, лишь логично, что мы должны делать то же самое."
 PRU_build_up_local_supply: "Создание местного поставок"
 PRU_build_up_local_supply_desc: "В случае войны мы должны быть полностью оснащены всем необходимым оборудованием для борьбы с эквадорцами. Поставка будет иметь решающее значение в этой войне."
 PRU_test_the_ecuadorians: "Проверьте эквадорцы"
 PRU_test_the_ecuadorians_desc: "С нашими войсками, которые теперь находятся на границе, мы можем проверить, насколько сильны эквадорские войска."
 PRU_ramp_up_mobilization: "Наращивать мобилизацию"
 PRU_ramp_up_mobilization_desc: "Больше солдат нужно вызвать, если мы хотим выиграть эту войну! Мы не позволим эквадорцам иметь даже малейшие шансы против нас!"
 PRU_launch_the_guayaquil_offensive: "Запустить наступление гуаякила"
 PRU_launch_the_guayaquil_offensive_desc: "Подготовка установлена, мы можем запустить наступление на Гуаякиль и захватить их очень важный порт!"
 PRU_victor_of_the_peru_ecuador_war: "Победитель войны Перу-экодора"
 PRU_victor_of_the_peru_ecuador_war_desc: "Мы одержали победу в войне Перу-Экодора! К сожалению, многие из наших смелых солдат скончались, но это было для большего блага!"
 PRU_loser_of_the_peru_ecuador_war: "Неудачник войны Перу-Экуадора"
 PRU_loser_of_the_peru_ecuador_war_desc: "Война была катастрофой! Нам нужно воспринимать это как возможность узнать о том, что не нужно делать на войне! Прокните, Эквадор!"
  
  ## Ecuador ## 
 ECU_fully_abandon_the_gold_standard: "Полностью покинуть золотой стандарт"
 ECU_fully_abandon_the_gold_standard_desc: "Золотой стандарт устарел, и нет никакой логической причины отставать от остального мира, поддерживая его. Лучше всего отказаться от золотого стандарта и принять фиатную валюту."
 ECU_returned_to_the_gold_standard_focus: "Вернуться к золотому стандарту"
 ECU_returned_to_the_gold_standard_focus_desc: "Золотой стандарт называется стандартом по какой -то причине, и мы должны принять его еще раз."
 ECU_nationwide_development: "Общенациональное развитие"
 ECU_nationwide_development_desc: "Мы были сельским государством довольно долго. Между тем, остальной мир намного впереди технологий и модернизации. Пришло время начать догнать остального мира и стремиться к общенациональной урбанизации и развитию."
 ECU_local_banana_production_focus: "Местное производство бананов"
 ECU_local_banana_production_focus_desc: "Бананы - обильный фрукт в Эквадоре. Мы можем извлечь выгоду из этого, если приложим усилия по увеличению наших банановых производств."
 ECU_promote_the_civilian_industry: "Продвигать гражданскую промышленность"
 ECU_promote_the_civilian_industry_desc: "Эквадорская гражданская экономика требует значительного промышленного повышения, чтобы подтолкнуть его в правильном направлении. Наши соседи намного сильнее нас, поэтому мы должны похвастаться впечатляющей отраслью, чтобы противостоять им."
 ECU_the_ecuadorian_military_industry: "Эквадорская военная промышленность"
 ECU_the_ecuadorian_military_industry_desc: "С ростом напряженности во всем мире сильная военная промышленность - не что иное, как необходимость. Мы будем субсидировать основные части вооруженной промышленности, чтобы расширить ее."
 ECU_regional_development_in_the_south: "Региональное развитие на юге"
 ECU_regional_development_in_the_south_desc: "Мы должны добиться дальнейших событий в нашем южном регионе."
 ECU_regional_development_in_the_north: "Региональное развитие на севере"
 ECU_regional_development_in_the_north_desc: "Мы должны добиться дальнейших событий в нашем северном регионе."
 ECU_steel_for_the_allies: "Сталь для союзников"
 ECU_steel_for_the_allies_desc: "Мы можем показать нашу поддержку союзникам, поставляя их сталью."
 ECU_oil_for_the_axis: "Масло для оси"
 ECU_oil_for_the_axis_desc: "Мы можем показать нашу поддержку оси, снабжая их маслом."
 ECU_education_reforms: "Образовательные реформы"
 ECU_education_reforms_desc: "Качество образования нашей страны довольно не хватает. Если мы хотим иметь хорошо образованное общество, мы должны провести реформы в нашей системе образования."
 ECU_the_elections_that_shouldve_been: "Выборы, которые должны были быть"
 ECU_the_elections_that_shouldve_been_desc: "Четыре года назад выборы 1932 года были аннулированы из -за нептали, имеющих перуанское происхождение. Этот позорный акт в итоге стоил жизни многих эквадорцев. Мы получим нашу месть за то, что они сделали с нами, и у людей, наконец, будет президент, которого они заслужили."
 ECU_always_on_time_focus: "Всегда вовремя"
 ECU_always_on_time_focus_desc: "Пока поезда работают вовремя, экономика будет расти, а наша отрасль расцветает."
 ECU_consumer_relief: "Потребительский облегчение"
 ECU_consumer_relief_desc: "Потребительский сектор экономики был подчеркнут из -за различных факторов, особенно из -за напряженных отношений с Перу и недавней гражданской войной. Необходимо принять различные экономические меры, чтобы облегчить его."
 ECU_national_arms_production: "Национальное производство оружия"
 ECU_national_arms_production_desc: "Вместо того, чтобы в зависимости от импорта формирования, когда дело доходит до оружия, было бы дешевле и эффективнее производства их внутри страны."
 ECU_major_industrial_advancements: "Основные промышленные достижения"
 ECU_major_industrial_advancements_desc: "По мере того, как отрасль растет, также доступны наши промышленные достижения и технологии. Вскоре наша отрасль будет процветать!"
 ECU_economic_investments: "Экономические инвестиции"
 ECU_economic_investments_desc: "С растущей экономикой требования, необходимые для поддержания ее, также растут. Нам нужно увеличить наши экономические инвестиции, чтобы поддерживать повышенный уровень экономической деятельности."
 ECU_devalue_the_sucre: "Обесценить суски"
 ECU_devalue_the_sucre_desc: "Сукре должен быть обесценен, чтобы лучше поднять его с тем, каковы текущие рыночные тенденции. При этом длительные преимущества этой меры значительно перевесят первоначальные негативы."
 ECU_financial_stability: "Финансовая стабильность"
 ECU_financial_stability_desc: "Благодаря золотому стандарту мы можем пользоваться преимуществами стабильной валюты, и с тем, что как рынки, так и потребители могут пользоваться преимуществами."
 ECU_finance_local_industries: "Финансирование местных отраслей"
 ECU_finance_local_industries_desc: "Расширение прав и возможностей наших местных отраслей принесет пользу нашей экономике."
 ECU_reform_the_organic_law_of_the_bank: "Реформировать органический закон банка"
 ECU_reform_the_organic_law_of_the_bank_desc: "С недавним инфляционным кризисом нам нужно действовать и быстро! Существуют наборы законов, окружающих банки Эквадора, которые необходимо настроить, чтобы остановить инфляцию и не дать Sucre потерять покупательную способность."
 ECU_reform_monetary_laws: "Реформа денежных законов"
 ECU_reform_monetary_laws_desc: "С продолжением золотого стандарта различные денежные законы в настоящее время бесполезны и устарели. Они должны быть реформированы и заменены новыми, чтобы лучше поддерживать текущие рыночные тенденции."
 ECU_oil_extraction_improvements: "Улучшения добычи нефти"
 ECU_oil_extraction_improvements_desc: "Мы могли бы использовать некоторые улучшения в том, как мы извлекаем этот прибыльный ресурс."
 ECU_galapagos_development: "Галапагосские разработки"
 ECU_galapagos_development_desc: "Галапагосские острова могут использовать свою справедливую долю индустриализации и развития."
 ECU_support_gallo: "Поддержка Галло"
 ECU_support_gallo_desc: "Мы подчеркнем нашу поддержку в отношении Альберто Энрикеза Галло, принимая лидерство. Понятно, что Федерико Паез Чирибога не подходит для возглавления этой страны, особенно если учесть его союз и увлечение фашистскими державами. Только Альберто может вывести нас из этого!"
 ECU_address_the_border_tensions: "Обращаться к пограничной напряженности"
 ECU_address_the_border_tensions_desc: "Понятно, что Перу - наша самая непосредственная угроза. Даже с самым последним статус -кво, который произошел в 1936 году, ясно, что Перу не будет уважать, и, честно говоря, мы не будем уважать это. Мы должны быть готовы, когда они ударяют."
 ECU_convince_our_liberal_supporters: "Убедить наших либеральных сторонников"
 ECU_convince_our_liberal_supporters_desc: "Соглашение наших лояльных либеральных сторонников против нынешнего правительства Паеса должно показать ему, что мы против его действий и внешней политики."
 ECU_appease_the_conservatives_focus: "Успокоить консерваторов"
 ECU_appease_the_conservatives_focus_desc: "Уже 4 года консерваторы были сданы в качестве худшей руки. Мы должны попытаться исправить с ними и переосмыслить отношения с ними."
 ECU_denounce_the_leftist_persecutions: "Определить левые преследования"
 ECU_denounce_the_leftist_persecutions_desc: "В течение последних нескольких месяцев правительство антагонизировало и преследует людей, которые имеют левые идеалы. Мы должны немедленно остановить это!"
 ECU_re_establish_constituent_assembly: "Восстановить Учредительное собрание"
 ECU_re_establish_constituent_assembly_desc: "Приглашенное собрание было распущено высшим командованием, когда они заставили Галло принять власть, однако Галло посчитал, что акт не является демократическим, и требования о том, чтобы Кондотическое собрание было установлено еще раз."
 ECU_return_power_to_the_assemblists: "Вернуть питание в сборщиков"
 ECU_return_power_to_the_assemblists_desc: "В то время как многие люди смотрели на Галло в качестве их лидера, он хочет, чтобы от Ассамблеи был надлежащего лидера -демократа, чтобы возглавить страну."
 ECU_leftist_agitation: "Левая агитация"
 ECU_leftist_agitation_desc: "Люди возмущаются нынешним правительством! Это не может и не будет разрешено больше!"
 ECU_push_for_national_elections: "Стремиться к национальным выборам"
 ECU_push_for_national_elections_desc: "Голос людей становится сильнее и сильнее. Песны революции распространились на каждую часть нации, и единственное препятствие осталось до тех пор, пока мы не сможем возглавить нацию, - это выборы, которые, как мы уверены, мы победим!"
 ECU_quell_the_parties: "Qwell партии"
 ECU_quell_the_parties_desc: "Как либералы, так и консерваторы начали противодействовать нашему новому найденному правительству. Пришло время понять, кто сейчас отвечает."
 ECU_national_takeover: "Национальное поглощение"
 ECU_national_takeover_desc: "Страна теперь полностью под нашими руками! Мы можем начать делать то, что всегда планировали делать!"
 ECU_brothers_in_arms: "Братья по оружию"
 ECU_brothers_in_arms_desc: "Наши соседи - братья, мы все одно и то же. Зачем быть разделенным воображаемыми линиями?"
 ECU_united_under_one_banner: "Юнайтед под одним баннером"
 ECU_united_under_one_banner_desc: "Наши границы отделяют нас от действительно объединенных. Это изменится, начиная с сегодняшнего дня!"
 ECU_join_the_commintern: "Присоединяйтесь к Коммерному"
 ECU_join_the_commintern_desc: "Советы являются нашим нынешним величайшим союзником. Они поддерживают те же взгляды, что и мы, и мы можем сделать много вещей вместе."
 ECU_soviet_military_industry: "Советская военная промышленность"
 ECU_soviet_military_industry_desc: "Советские военные - абсолютный зверь! Изучение и получение некоторых из их оборудования может послужить нам хорошо."
 ECU_the_revolution_lives_on: "Революция живет на"
 ECU_the_revolution_lives_on_desc: "Революция только началась! Континент будет освобожден от этих диктаторов, которые считают, что они имеют право голоса!"
 ECU_the_peruvian_ultimatum: "Перуанский ультиматум"
 ECU_the_peruvian_ultimatum_desc: "Перуанцы были на нашей стороне слишком долго! Пришло время положить конец этому детскому и вперед ... навсегда."
 ECU_integration_campaigns: "Интеграционные кампании"
 ECU_integration_campaigns_desc: "Все под одним баннером! Все под красным баннером!"
 ECU_liberate_the_bolivarian_people: "Освободить Боливарский народ"
 ECU_liberate_the_bolivarian_people_desc: "Боливарский народ ближе всего к нам, а также те, кто пострадал больше всего. Пришло время положить конец их страданиям."
 ECU_the_revolution_to_central_america: "Революция в Центральную Америку"
 ECU_the_revolution_to_central_america_desc: "Что не любить в Центральной Америке? Бананы, бананы и ... больше бананов? Да, нет, им нужно больше индивидуальных свобод и меньше корпоратизма!"
 ECU_liberate_the_rio_de_la_plata: "Освободить Рио -де -ла -Плата"
 ECU_liberate_the_rio_de_la_plata_desc: "Регион Рио -де -ла -Плата ... такие красивые пейзажи. Позор их нынешние правительства не отражают этого, но мы можем это изменить."
 ECU_liberate_brazil: "Освободить Бразилию"
 ECU_liberate_brazil_desc: "Бразилия будет освобождена сразу!"
 ECU_the_north_american_Revolution: "Североамериканская революция"
 ECU_the_north_american_Revolution_desc: "Северная Америка является безопасным загадкой всех этих мерзких идеалов. Пришло время изменить это!"
 ECU_improved_labor_conditions: "Улучшенные условия труда"
 ECU_improved_labor_conditions_desc: "Нынешние условия труда нации являются бездонными! Должны быть перемены и сейчас!"
 ECU_increased_research_funds: "Повышенные исследовательские фонды"
 ECU_increased_research_funds_desc: "Наши ученые станут будущим нашей нации. Увеличение средств на исследования и образование продвинут нашу страну вперед."
 ECU_national_mobilization_f: "Национальная мобилизация"
 ECU_national_mobilization_f_desc: "Нашей армии не хватает количества, и в нашем нынешнем состоянии было бы невозможно сделать полномасштабную мобилизацию. Вместо этого мы должны взять это медленно. Одна провинция за раз должна сделать свое дело."
 ECU_major_military_investment: "Крупные военные инвестиции"
 ECU_major_military_investment_desc: "Военнослужащим нуждается в увеличении финансирования, чтобы поддержать новые штаммы более сильной армии."
 ECU_civilian_expansion: "Гражданское расширение"
 ECU_civilian_expansion_desc: "Гражданский рынок может использовать увеличение субсидий. С дополнительным финансированием это, несомненно, продвинет экономику вперед."
 ECU_march_into_western_pastaza: "Марш в Западную пастаза"
 ECU_march_into_western_pastaza_desc: "Перуанцы представляют собой четкую угрозу, и сохранить одну из главных линий с ними демилитаризованными не идеальными! Мы будем мобилизовать войска и ремилитарализировать нашу сторону пастазы, чтобы показать им, что мы не возитесь!"
 ECU_adopt_an_offensive_strategy_plan: "Принять план наступления стратегии"
 ECU_adopt_an_offensive_strategy_plan_desc: "Лучшая защита - хорошее преступление."
 ECU_adopt_a_defensive_strategy_plan: "Принять план защитной стратегии"
 ECU_adopt_a_defensive_strategy_plan_desc: "Лучшее преступление - хорошая защита."
 ECU_perform_recon_flights: "Выполнить переподготовки"
 ECU_perform_recon_flights_desc: "Реконсы могут дать нам больше Intel на врага и лучше улучшить наши шансы на наступательную войну против Перу."
 ECU_commence_defensive_preperations: "Начало защитных препаратов"
 ECU_commence_defensive_preperations_desc: "Нам нужно нарастать в обороне против перуанцев. Они явно имеют верх, когда дело доходит до цифр, и нам понадобится каждое обогащение, которое мы можем подготовиться к натиску."
 ECU_formalize_militia_regiments: "Формализовать полки милиции"
 ECU_formalize_militia_regiments_desc: "Нам нужно формализовать полки милиции возле границы с Перу, если мы хотим иметь шанс. Скорее всего, они будут выставить большую армию, чем нашу, поэтому каждый человек имеет значение."
 ECU_anti_air_defense: "Оборона против воздуха"
 ECU_anti_air_defense_desc: "Перуанская воздушная сила может быть потенциальной угрозой для нашей отрасли и солдат. Нам нужно подготовить защиту от них."
 ECU_a_call_for_international_aid: "Призыв к международной помощи"
 ECU_a_call_for_international_aid_desc: "То, что сделали перуанцы, позорно! Мир должен слушать наши крики, даже если он среди глобальной войны."
 ECU_march_into_piura: "Марш в Пиуру"
 ECU_march_into_piura_desc: "Наши солдаты подтвердили довольно небольшую целевую группу, присутствующую в провинции Пиура. Наши цифры больше их, и мы можем запустить удивительное вторжение и застать перуанцы врасплох."
 ECU_victor_of_the_peru_ecuador_war: "Победитель войны Перу-экодора"
 ECU_victor_of_the_peru_ecuador_war_desc: "Мы сделали это! Через толстый и худой мы протолкнули и одержали победу от этого кровавого конфликта. Эта победа будет отмечаться десятилетиями!"
 ECU_loser_of_the_peru_ecuador_war: "Неудачник войны Перу-Экуадора"
 ECU_loser_of_the_peru_ecuador_war_desc: "Это было следовало ожидать, у перуанцев просто была верхняя часть. Наши солдаты сражались с храбростью и мужеством, и это только заслуживает похвалы."
 ECU_get_revenge_on_peru: "Месть Перу"
 ECU_get_revenge_on_peru_desc: "Эти проклятые перуанцы думают, что могут просто оторваться от этого конфликта без каких -либо последствий? Они будут прокляты!"
 ECU_greater_ecuador: "Большой Эквадор"
 ECU_greater_ecuador_desc: "С нашей недавней победой мечты о большем Эквадоре стали реальностью, и мы можем подтолкнуть к восстановлению наших границ с 1832 года!"
 ECU_call_for_elections: "Откажем от офиса"
 ECU_call_for_elections_desc: "Поскольку приглашенная сборка постоянно бросает нам вызов на каждом шагу, просто не используется в том, чтобы ухватиться за власть. Вместо этого мы должны передать его кому -то, кто поживает с собранием и может лучше справиться с нацией."
 ECU_constituent_assembly_takeover: "Учредительное поглощение собрания"
 ECU_constituent_assembly_takeover_desc: "После анализа недавних президентов Республики ясно, что они не выполняли задачу. Вместо одного человека, берущего, Ассамблея берет на себя административную ответственность нации."
 ECU_the_getyear_act: "[GetYear] акт"
 ECU_the_getyear_act_desc: "Закон [GetYear] направлен на улучшение средств к существованию граждан Эквадора. Провинция будет провинция, чтобы повысить его эффективность."
 ECU_stabilize_our_politics: "Стабилизировать нашу политику"
 ECU_stabilize_our_politics_desc: "Политический раскол между консерваторами и либералами разрывал эту страну, даже привела к гражданской войне. На этот раз давайте вместо этого сотрудничаем вместе и будем стремиться к лучшему и единому будущему."
 ECU_freedom_at_home_freedom_in_the_world: "Свобода дома, свобода в мире"
 ECU_freedom_at_home_freedom_in_the_world_desc: "Если свобода может быть достигнута в нашем доме, так и это может быть сделано в мире."
 ECU_maintain_a_neutral_stance: "Поддерживать нейтральную позицию"
 ECU_maintain_a_neutral_stance_desc: "Вместо того, чтобы выбрать сторону, с нашей стороны было бы лучше и более стратегически оставаться нейтральным и оценивать нашу ситуацию."
 ECU_reconciliation_with_peru: "Примирение с Перу"
 ECU_reconciliation_with_peru_desc: "Вместо этого мы не должны оставаться врагами с Перу, давайте будем стремиться сделать наших союзников с нашими бывшими врагами. Мы можем вырезать новый путь мира, сотрудничать и работать вместе к лучшему будущему."
 ECU_remember_the_lost_lives: "Помните погибшие жизни"
 ECU_remember_the_lost_lives_desc: "Эти дикие перуанцы будут прокляты, если они думают, что мы когда -нибудь сотрудничаем с ними!"
 ECU_praise_our_brave_soldiers: "Хвалите наших смелых солдат"
 ECU_praise_our_brave_soldiers_desc: "Наши солдаты заслуживают похвалы. Они прошли через густые и худые и много сделали для страны."
 ECU_learn_from_the_global_conflict: "Учиться на глобальном конфликте"
 ECU_learn_from_the_global_conflict_desc: "Глобальный конфликт, бушующий по всему миру, показывает нам ужасы войны, но он может научить нас многому о том, что делать и как управлять армией."
 ECU_no_room_for_fascism: "Нет места для фашизма"
 ECU_no_room_for_fascism_desc: "На этом континенте нет места для фашизма."
 ECU_no_room_for_the_revolution: "Нет места для революции"
 ECU_no_room_for_the_revolution_desc: "На этом континенте нет места для тоталитарных режимов и кровавых революций."
 ECU_latin_america_reborn: "Латинская Америка возрождается"
 ECU_latin_america_reborn_desc: "Его Латинская Америка время сиять. Наш регион постоянно смотрел свысока на протяжении времени. Юнайтед, мы покажем миру, насколько мы действительно сильны."
 ECU_alliance_with_the_united_states: "Альянс с Соединенными Штатами"
 ECU_alliance_with_the_united_states_desc: "Соединенные Штаты являются маяком демократии в западном мире. Быть в союзе с ними было бы нашим лучшим курсом действий."
 ECU_request_access_to_the_panama_canal: "Запросить доступ к Панамскому каналу"
 ECU_request_access_to_the_panama_canal_desc: "Несмотря на амбициозные, есть большая вероятность, что Соединенные Штаты предоставят нам доступ к Панамскому каналу, если у нас достаточно хороших отношений. Если мы это сделаем, деньги, которые мы изготовим из них, будут беспрецедентными."
 ECU_trade_our_resources_for_economic_aid: "Обменивать наши ресурсы на экономическую помощь"
 ECU_trade_our_resources_for_economic_aid_desc: "Наши ресурсы, хотя и жизненно важные, в конечном итоге не служат нам реальной цели, но могут быть очень полезными для Соединенных Штатов."
 ECU_ally_ourselves_with_britain: "Союзники сами с Британией"
 ECU_ally_ourselves_with_britain_desc: "Соединенное Королевство является последним основным оплотом демократии в Европе, и они знают кое -что о том, чтобы сохранить свой суверенитет, несмотря на все шансы. Союз с ними - наш лучший крик!"
 ECU_british_economic_aid: "Британская экономическая помощь"
 ECU_british_economic_aid_desc: "Британская индустрия является одной из крупнейших в мире. Они, безусловно, могут избавить некоторых, чтобы помочь нашей экономике и улучшить наши отношения."
 ECU_naval_arsenal_expansion: "Расширение военно -морского арсенала"
 ECU_naval_arsenal_expansion_desc: "Наш военно -морской флот не в лучшем виде, и наличие Королевского флота, поскольку наш союзник действительно представляет свои преимущества. Мы могли бы узнать кое -что из них и расширить свой собственный флот."
 ECU_study_the_british_navy: "Изучить британский флот"
 ECU_study_the_british_navy_desc: "Изучение Королевского флота научило нас многим вещам о судостроении и тактике в случае участия в битве."
 ECU_adopt_liberal_economic_models: "Принять либеральные экономические модели"
 ECU_adopt_liberal_economic_models_desc: "Либерализм - единственный способ по -настоящему позволить нашей экономике расти. Наличие сильной экономики откроет двери для гораздо большего количества возможностей."
 ECU_arms_factory_improvements: "Улучшения завода вооружений"
 ECU_arms_factory_improvements_desc: "Улучшение нашей завода оружия позволит увеличить производство стрелкового оружия и оборудовать наших солдат улучшенным оружием."
 ECU_reestablish_the_1906_constitution: "Восстановить конституцию 1906 года"
 ECU_reestablish_the_1906_constitution_desc: "Конституция 1906 года, также известная как Конституция ATEA, была в основном известна полной разлукой церкви и государства в стране. Наша нынешняя политическая ситуация видит необходимость восстановить конституцию 1906 года."
 ECU_repress_our_political_opponents: "Подавлять наших политических противников"
 ECU_repress_our_political_opponents_desc: "Наши политические оппоненты слишком сильно садится в наш путь. Пришло время понять, кто отвечает."
 ECU_slander_the_current_government: "Клеветь на нынешнее правительство"
 ECU_slander_the_current_government_desc: "Нынешнее правительство не соответствует задаче управления страной, и люди должны это знать! Устойчивость их может принести нам большую общественную поддержку и сделать переход более гладким."
 ECU_conservative_to_arms: "Консерваторы для оружия"
 ECU_conservative_to_arms_desc: "Возьми руку! Не позволяйте этим предполагаемым «либералам» плевать на ваши индивидуальные свободы!"
 ECU_take_over_the_country: "Захватить страну"
 ECU_take_over_the_country_desc: "По всей стране люди в ярости из -за отмененных выборов еще в 1932 году, и они хотят окупаемости за это. Мы возьмем руки и запустим полномасштабное восстание и ответственное место, который уже должен был быть президентом: Нептали Бонифаз."
 ECU_national_recovery: "Национальное восстановление"
 ECU_national_recovery_desc: "Гражданская война нанесла значительный урон нашей стране. Мы должны выделить ресурсы для восстановления."
 ECU_neptali_administration: "Администрация Нептали"
 ECU_neptali_administration_desc: "Нептали - единственный, кто действительно может привести эту страну к величию. Его опыт на поле, несомненно, позволит ему делать великие дела для страны."
 ECU_caamano_administration: "Администрация Каманьо"
 ECU_caamano_administration_desc: "Каманьо - это человек, которым мы должны доверять, чтобы возглавить эту страну. Мы можем быть уверены, что он сделает великие дела."
 ECU_a_new_industrial_approach: "Новый промышленный подход"
 ECU_a_new_industrial_approach_desc: "Нам нужно изменить наш подход к обращению с национальной промышленностью. Новый промышленный подход может потенциально позволить экономике снова расти."
 ECU_construction_developments: "Строительные события"
 ECU_construction_developments_desc: "Людям нужно жилье, и это то, что наше правительство обеспечит."
 ECU_wave_of_scholars: "Волна ученых"
 ECU_wave_of_scholars_desc: "Ученые - это будущее этой страны. Нам нужно вдохновить наших студентов стремиться быть самыми лучшими, независимо от ситуации."
 ECU_standarized_production_lines: "Стандартные производственные линии"
 ECU_standarized_production_lines_desc: "$VEN_standarized_production_lines_desc$"
 ECU_pass_conscription_laws: "Законы о призывах"
 ECU_pass_conscription_laws_desc: "$ECU_national_mobilization_f_desc$"
 ECU_foreign_equipment_shipments: "Поставки иностранного оборудования"
 ECU_foreign_equipment_shipments_desc: "Импорт оборудования из зарубежных стран может очень помочь нам в наших военных усилиях против любого врага, с которым мы можем столкнуться."
 ECU_review_our_foreign_policy: "Просмотреть нашу внешнюю политику"
 ECU_review_our_foreign_policy_desc: "Учитывая нашу текущую позицию, нам придется пересмотреть нашу политику предпринимательства и принять выбор в отношении того, как мы хотим объединить себя."
 ECU_via_diplomacy: "Через дипломатию"
 ECU_via_diplomacy_desc: "Дипломатия - единственный путь вперед."
 ECU_allied_allignment: "Союзник"
 ECU_allied_allignment_desc: "Союзники стараются изо всех сил, чтобы предотвратить сжигание мира до кола. Было бы разумно схватить себя с ними."
 ECU_a_clean_south_america: "Чистая Южная Америка"
 ECU_a_clean_south_america_desc: "На нашем домашнем континенте нет места для экстремизма. Те, кто в настоящее время является тоталитарным, скоро узнают, что их пути не являются правильными."
 ECU_united_we_stand: "Юнайтед мы стоим"
 ECU_united_we_stand_desc: "Мы все, наконец, совпадаем идеологически. Новая эра для Южной Америки началась, и наше будущее ярче, чем когда -либо."
 ECU_british_naval_prowess: "Британское военно -морское мастерство"
 ECU_british_naval_prowess_desc: "Королевский флот, пожалуй, самый мощный флот в мире. Наличие такого мощного союзника значительно улучшит наш собственный флот."
 ECU_axis_allignment: "Осин активации"
 ECU_axis_allignment_desc: "Военная мощь немцев - не что иное, как впечатляющий, и наличие такого могущественного союзника - единственный способ провести наше выживание."
 ECU_try_to_reconcile_with_peru: "Попробуйте согласовать с Перу"
 ECU_try_to_reconcile_with_peru_desc: "$ECU_reconciliation_with_peru_desc$"
 ECU_no_room_for_savages: "Нет места для дикарей"
 ECU_no_room_for_savages_desc: "В этом мире нет места для таких дикарей, как перуанцы."
 ECU_allies_in_south_america: "Союзники в Южной Америке"
 ECU_allies_in_south_america_desc: "Вместо того, чтобы смотреть наружу для союзников, мы должны объединиться со странами на континенте и работать вместе, чтобы противостоять растущим угрозам."
 ECU_mutual_economic_benefits: "Взаимные экономические выгоды"
 ECU_mutual_economic_benefits_desc: "Теперь, когда мы союзники, наши экономики могут взаимно пользоваться и расти вместе!"
 ECU_axis_equipment_shipments: "Опытные поставки оборудования"
 ECU_axis_equipment_shipments_desc: "Мы будем запросить поставки оборудования, чтобы помочь в наших военных усилиях."
 ECU_pushing_our_claims: "Выдвигая наши претензии"
 ECU_pushing_our_claims_desc: "Наши истинные и естественные границы были официально созданы в 1832 году, однако никто не узнает их. Пришло время изменить это, и наши соседи узнают трудный путь!"
 ECU_revenge_for_1832: "Месть за 1832 год"
 ECU_revenge_for_1832_desc: "В 1832 году произошла война между Колумбией и Эквадором, в то время как краткая, она заставила нас отказаться от многих квадратных километров земли в Колумбии. Эта земля по праву наша, и мы скоро вернемся!"
 ECU_industrial_development_in_colombia: "Промышленное развитие в Колумбии"
 ECU_industrial_development_in_colombia_desc: "Теперь, когда мы вернули наши земли в Колумбии, мы можем начать промышленное развитие в них."
 ECU_the_colombo_ecuadorian_union: "Коломбо-экодорский союз"
 ECU_the_colombo_ecuadorian_union_desc: "Мы разделяем много сходства с колумбийцами. Наши люди, наша культура, наши традиции, все они очень похожи. Объединение наших стран не только сделает нас более сильными, но и является формированным врагом в случае вторжения в будущее."
 ECU_demand_oil_rights_in_venezuela: "Потребовать права на нефть в Венесуэле"
 ECU_demand_oil_rights_in_venezuela_desc: "Венесуэла чрезвычайно богата нефтью, и благодаря нашему нынешнему статусу мощности мы можем потребовать доступ к их нефти. Если они отказываются, то мы просто возьмем это силой."
 ECU_the_panamanian_ultimatum: "[PAN.GetAdjective] ultimatum"
 ECU_the_panamanian_ultimatum_desc: "[PAN.GetName] занимает очень стратегическое положение вокруг канала. Если они не принимают мирное субегацию, то они заплатят своей кровью!"
 ECU_caribbean_domination: "Карибское доминирование"
 ECU_caribbean_domination_desc: "Завоевание Карибского бассейна даст нам стратегическое преимущество против Соединенных Штатов и Европейских держав."
 ECU_strike_at_the_united_states: "Удар в Соединенных Штатах"
 ECU_strike_at_the_united_states_desc: "Сейчас наш шанс! Мы можем нанести удар по Соединенным Штатам и по -настоящему зарекомендовать себя как главная сила Америки."
 ECU_no_second_chances: "Никаких вторых шансов"
 ECU_no_second_chances_desc: "Пришло время, чтобы Перу наконец -то заплатил за все грехи, которые они совершили!"
 ECU_push_our_sphere_of_influence_south: "Подтолкнуть нашу сферу влияния на юг"
 ECU_push_our_sphere_of_influence_south_desc: "Если мы сможем закрепиться в южной части Южной Америки, это укрепит нашу позицию как доминирующую власть Америки."
 ECU_a_major_power_is_born: "Рождается главная сила"
 ECU_a_major_power_is_born_desc: "После многих сражений и завоеваний наша сфера влияния выросла до такого значительного количества, что мы можем по -настоящему считать основной силой. Может быть, теперь другие силы начнут воспринимать нас всерьез."
 ECU_via_force: "Через силу"
 ECU_via_force_desc: "Расширение агрессивно - единственный путь вперед."
 ECU_adopt_an_imperialist_foreign_policy: "Принять империалистическую внешнюю политику"
 ECU_adopt_an_imperialist_foreign_policy_desc: "$ARG_adopt_an_imperialist_policy_desc$"
 ECU_revive_a_lost_idea: "Оживить потерянную идею"
 ECU_revive_a_lost_idea_desc: "Предложил в 1846 году тогдашний президент Хуан Хосе Флорес, когда он был изгнан во Франции. Очень амбициозный план, который никогда не осуществлялся, когда член дома Борбона станет претендентом на трон. С прибытием Хуана де Борбона эта идея может снова быть повторной и, возможно, превратить ее в успешную!"
 ECU_conquer_peru_and_bolivia: "Завоевать Перу и Боливию"
 ECU_conquer_peru_and_bolivia_desc: "Перу и Боливия стоят на пути величия. Они будут быстро раздавлены!"
 ECU_a_kingdom_for_centuries: "Королевство на протяжении веков"
 ECU_a_kingdom_for_centuries_desc: "То, что когда -то было амбициозной идеей, превратилось в реальность! Мы покорили Перу и Боливию и создали Королевство Эквадор, Перу и Боливия. Наше королевство станет первым по -настоящему успешным королевством в истории человечества, и мы длится веками!"
 ECU_capture_our_claimed_lands: "Захватить наши заявленные земли"
 ECU_capture_our_claimed_lands_desc: "Есть еще много земель, которые мы придерживаемся претензий, которые в настоящее время не находятся под нашим владением. Мы изменим это немедленно вступительно!"
 ECU_claims_on_the_continent: "Претензии на континент"
 ECU_claims_on_the_continent_desc: "Америка мешает нашему пути величия, и это неприемлемо. Отвратительно, что так много стран занимают такие богатые и плодородные земли. Все они в практически принадлежат нам, и мы продемонстрируем это с чистой огневой мощью!"
 ECU_there_can_only_be_one_empire: "Там может быть только одна империя"
 ECU_there_can_only_be_one_empire_desc: "свобода слова"
 ECU_recapture_the_motherland: "Вернуть родину"
 ECU_recapture_the_motherland_desc: "Время вернуть Родину, землю, откуда мы первоначально пришли, и улучшить ее с нуля."
 ECU_restore_the_empire: "Восстановите империю"
 ECU_restore_the_empire_desc: "$PRU_the_eternal_empire_desc$"
 ECU_claim_the_french_throne: "Претендовать на французский трон"
 ECU_claim_the_french_throne_desc: "Дом Борбона возникает во Франции, поэтому дает нам законное заявление о французском Троне. Мы подтолкнем эти претензии и посмотрим, куда это нас приведет."
 ECU_the_royal_armed_forces: "Королевские вооруженные силы"
 ECU_the_royal_armed_forces_desc: "Наши вооруженные силы только стали сильнее и сильнее. Давайте убедитесь, что эта тенденция продолжается."
 ECU_the_imperial_economy: "Имперская экономика"
 ECU_the_imperial_economy_desc: "С такой обширной империей поступает за счет экономического неверного управления. Мы должны принять меры, чтобы это не произошло, и экономика должным образом централизована, несмотря на недавнее расширение."
 ECU_imperial_road_connections: "Имперские дорожные соединения"
 ECU_imperial_road_connections_desc: "$PRU_improve_the_imperial_transport_desc$"
 ECU_recovering_what_was_forgotten: "Восстановление того, что было забыто"
 ECU_recovering_what_was_forgotten_desc: "$VEN_unification_mandate_desc$"
 ECU_win_at_all_costs: "Победить любой ценой"
 ECU_win_at_all_costs_desc: "$VEN_ensure_total_victory_desc$"
 ECU_operation_americas: "Операция Americas"
 ECU_operation_americas_desc: "Кодовое имя «Операция Americas», план по утверждению себя главной доминирующей властью в Америке. Это потребует много времени и усилий, но как только он будет завершен, это будет более чем стоит."
 ECU_reforming_the_lost_unions: "Реформирование потерянных союзов"
 ECU_reforming_the_lost_unions_desc: "На протяжении всего времени в Латинской Америке было много разных союзов стран и стран, потерянных во времени, которые на своем роде состояли из важных людей и повлияли на большую часть нашей истории. Мы должны работать, чтобы реформировать эти профсоюзы, потерянные во времени, воссоединение людей, которые когда -то были под одним баннером, и вернуть Латинскую Америку к доминированию, которое он использовал для оказывать."
 ECU_the_union_of_the_americas: "Союз Америки"
 ECU_the_union_of_the_americas_desc: "Мы все должны быть объединены под одним флагом, представляя весь континент и его народ. Давайте покажем миру, что мы не нажимаем!"
 ECU_claims_in_the_amazon: "Претензии в Амазонке"
 ECU_claims_in_the_amazon_desc: "Мы попробуем нашу удачу и подтолкнули наши претензии на Амазонке."
 ECU_conquer_the_south: "Завоевать юг"
 ECU_conquer_the_south_desc: "$ECU_push_our_sphere_of_influence_south_desc$"
 ECU_make_use_of_the_refugees: "Использовать беженцев"
 ECU_make_use_of_the_refugees_desc: "$ARG_conscript_war_refugees_desc$"
 ECU_wartime_industry: "Военная промышленность"
 ECU_wartime_industry_desc: "Война звонит нам, и это означает, что у нас должна быть индустрия, готовая к военному времени, и любые проблемы, с которыми мы можем столкнуться."
 ECU_the_paez_dictatorship: "Диктатура Паза"
 ECU_the_paez_dictatorship_desc: "Федерико Паес сочувствует фашистским силам, черпая вдохновение от таких, как Адольф Гитлер и Бенито Муссолини. Таким образом, это заставило Паеса получить фашистскую репутацию, однако, он никогда не действовал на этом. Вместо того, чтобы держаться в стороне, пришло время принять идеи фашизма и стремиться к возвращению этой страны к своей пике!"
 ECU_imprison_gallo: "Тюремное заключение Галло"
 ECU_imprison_gallo_desc: "Галло и большая часть военных сговорились против нас в попытке остановить наши планы. Этого не произойдет, и мы поместим Галло в тюрьму, чтобы он не попробовал что -либо на нас."
 ECU_gain_support_from_the_fascists: "Получить поддержку от фашистов"
 ECU_gain_support_from_the_fascists_desc: "Несмотря на то, что большинство может подумать, в Эквадоре скрывается много фашистов, которые могли бы поддержать нас в случае полномасштабного поглощения. Мы могли бы попросить их поддержку и получить больше политической власти по стране."
 ECU_the_great_betrayal: "Великое предательство"
 ECU_the_great_betrayal_desc: "Паес действительно верил, что собирается просто использовать нас без каких -либо последствий ... как наивно. Хорхе Луна, да, - наш единственный настоящий лидер, и он будет тем, кто приведет нас к победе!"
 ECU_take_full_control: "Возьмите полный контроль"
 ECU_take_full_control_desc: "Теперь, когда у нас достаточно общественной поддержки, мы можем полностью и по -настоящему захватить страну. Нет больше демократии, эта страна нуждается в тоталитарном режиме с сильным лидером воли прямо в центре ее!"
 ECU_dissolve_the_constituent_assembly: "Растворить составную сборку"
 ECU_dissolve_the_constituent_assembly_desc: "Проклятая сборка слишком долго садится на наши нервы. Они будут незамедлительно закрыты, чтобы больше никогда не увидели!"
 ECU_diplomatic_mission_to_germany: "Дипломатическая миссия в Германию"
 ECU_diplomatic_mission_to_germany_desc: "Немцы действительно верили, что мы не заметили подземную деятельность, которую они выполняли в нашей стране, однако это на самом деле помогает нам в нашей нынешней ситуации. Мы можем использовать его в качестве рычага для улучшения дипломатических связей с немцами, даже если американцы обеспокоены этим."
 ECU_entry_into_the_axis: "Вход в ось"
 ECU_entry_into_the_axis_desc: "$ECU_axis_allignment_desc$"
 ECU_crush_the_bipartisanship_conflict: "Раздавить конфликт двухпартийности"
 ECU_crush_the_bipartisanship_conflict_desc: "Этот детский перетягивание войны между либералами и консерваторами был милым, пока он продолжался, но теперь мы являемся ответственными."
 ECU_italian_allignment: "Итальянское соглашение"
 ECU_italian_allignment_desc: "$VEN_closer_italian_cooperation_desc$"
 ECU_fascist_researchers: "Фашистские исследователи"
 ECU_fascist_researchers_desc: "Исследование - единственный путь вперед! Чем умнее наши исследователи, тем лучше."
 ECU_italian_military_advising: "Итальянские военные консультируют"
 ECU_italian_military_advising_desc: "$VEN_italian_military_advisors_desc$"
 ECU_inherit_italian_economic_techniques: "Унаследовать итальянские экономические методы"
 ECU_inherit_italian_economic_techniques_desc: "$VEN_italian_industrial_influence_desc$"
 ECU_increase_statal_power: "Увеличьте государственную власть"
 ECU_increase_statal_power_desc: "Государственная власть должна быть увеличена, чтобы лучше контролировать страну и ее ресурсы."
 ECU_support_the_spanish_falangists: "Поддерживать испанские фалангисты"
 ECU_support_the_spanish_falangists_desc: "Наши идеалы черпают вдохновение в испанском фаланге. Мы должны помочь нашим братьям через море и распространить слово о фалангизме."
 ECU_cooperate_with_the_church: "Сотрудничать с церковью"
 ECU_cooperate_with_the_church_desc: "Церковь по -прежнему очень сильна в стране, и наличие их в качестве политического союзника будет послужить нам хорошо."
 ECU_take_an_anti_communist_stance: "Занять антикоммунистическую позицию"
 ECU_take_an_anti_communist_stance_desc: "$ARG_go_against_communism_desc$"
 ECU_increase_funding_to_the_military: "Увеличить финансирование военных"
 ECU_increase_funding_to_the_military_desc: "Мы никуда не поедем без сильной и централизованной армии. Нашим главным приоритетом должно быть улучшение нашей армии."
 ECU_ban_the_press: "Запретить прессу"
 ECU_ban_the_press_desc: "$BOL_ban_the_press_desc$"
 ECU_build_up_the_army: "Построить армию"
 ECU_build_up_the_army_desc: "$ECU_national_mobilization_f_desc$"
 ECU_brutal_repression: "Жестокие репрессии"
 ECU_brutal_repression_desc: "$VEN_brutal_protest_Repression_desc$"
 ECU_looking_outwards: "Глядя наружу"
 ECU_looking_outwards_desc: "$PAR_looking_outwards_desc$"
 ECU_support_la_gloriosa: "Поддержка La Gloriosa"
 ECU_support_la_gloriosa_desc: "Слава Веласко! Эти чертовы неколы у власти не знают, как управлять чертовой страной! Веласко - единственный путь вперед, и мы сделаем все возможное, чтобы обеспечить его рост власти."
 ECU_a_new_velasquist_identity: "Новая идентичность веласквиста"
 ECU_a_new_velasquist_identity_desc: "С Веласко еще раз в силе, по всей стране формируется новая веласквистская идентичность. Тот, который боготворяет Веласко и считает его единственной истинной спасительной грацией Эквадора после беспорядка, который произошел за последнее десятилетие."
 ECU_prevent_la_gloriosa: "Предотвратить La Gloriosa"
 ECU_prevent_la_gloriosa_desc: "Веласко представляет серьезную угрозу для стабильности этой страны. Его выходки и карабинеры являются крупным шипом на нашей стороне, и мы должны сделать все, что в нашей силе, чтобы предотвратить это!"
 ECU_stability_restored: "Стабильность восстановлена"
 ECU_stability_restored_desc: "Несмотря на шансы, мы вышли победителями, и Веласко был вынужден покинуть страну. Его сторонники могут быть в ярости, но это был единственный путь вперед, и мы достигли этого."
 ECU_banana_company_takeover: "Банановая компания поглощение"
 ECU_banana_company_takeover_desc: "Банановые компании могут взять его отсюда. [ROOT.GetName] нуждается в правильном лидерстве, и его люди могут использовать больше калия."
 ECU_bananas_for_all_f: "Бананы для всех"
 ECU_bananas_for_all_desc: "В этой славной стране [ROOT.GetName] ни один квадратный метр земли не будет без бананов. Бананы поддерживают нас всех. Мы все идем бананами для бананов."
 ECU_bananas_for_all_f_desc: "В этой славной стране [ROOT.GetName] ни один квадратный метр земли не будет без бананов. Бананы поддерживают нас всех. Мы все идем бананами для бананов."
 ECU_achieve_laissez_faire: "Достичь Laissez Faire"
 ECU_achieve_laissez_faire_desc: "$CHL_achieve_laissez_faire_desc$"
 ECU_open_up_the_markets: "Открыть рынки"
 ECU_open_up_the_markets_desc: "$BRA_open_our_markets_desc$"
 ECU_mobilize_the_free_enterprise_army: "Мобилизовать армию свободного предпринимательства"
 ECU_mobilize_the_free_enterprise_army_desc: "Армия свободного предпринимательства теперь будет сформирована! Не обращайте внимания на какие -либо случаи жестокого обращения с работниками, которых не существует в нашей великолепной стране. Здесь мы заботимся о том, чтобы сделать мир лучшим местом и гарантировать, что у каждого есть бананы."
 ECU_economic_freedom_to_the_americas: "Экономическая свобода Америки"
 ECU_economic_freedom_to_the_americas_desc: "Хм, кажется, есть много мест в Америке, которые еще не потребляются банановыми плантациями. Мне не очень нравятся стран, не производящие бананы. [ROOT.GetLeader], принеси мне банановую армию."
 ECU_the_global_enterprise_zone: "Глобальная зона предприятия"
 ECU_the_global_enterprise_zone_desc: "Глобальное доминирование скоро будет достигнуто. Мир будет знать о чудесах бананов и всех его питательных веществ! Ешьте свои бананы, сейчас!"
 ECU_el_ejercito_ecuatoriano: "Эль -Эйерсито Экюатоано"
 ECU_el_ejercito_ecuatoriano_desc: "Армейская филиал эквадорских вооруженных сил имела значительный опыт в бою, являясь частью множественных войн. Поскольку это всегда оставалось в очень высоком приоритете, и это не изменится с нашим правительством."
 ECU_seek_foreign_military_advising: "Искать иностранные военные консультирование"
 ECU_seek_foreign_military_advising_desc: "Хотя у нас есть надлежащая армия, получение консультирования от иностранных держав улучшит наши шансы на победу в случае войны."
 ECU_foreign_military_aid: "Иностранная военная помощь"
 ECU_foreign_military_aid_desc: "С иностранным консультированием приходит иностранная помощь ... Я думаю, так что это происходит, по крайней мере,"
 ECU_artillery_warfare: "Артиллерийская война"
 ECU_artillery_warfare_desc: "$FRA_artillery_focus_desc$"
 ECU_motorize_our_soldiers: "Моторизировать наших солдат"
 ECU_motorize_our_soldiers_desc: "$BRA_produce_more_motorized_desc$"
 ECU_ecuadorian_tank_force: "Эквадорский танк"
 ECU_ecuadorian_tank_force_desc: "$BRA_modernize_the_tank_korp_desc$"
 ECU_mechanized_mobilization: "Механизированная мобилизация"
 ECU_mechanized_mobilization_desc: "$BRA_modern_mechanized_units_desc$"
 ECU_modern_infantry_equipment_designs: "Современное пехотное оборудование"
 ECU_modern_infantry_equipment_designs_desc: "$BRA_modernize_the_infantry_equipment_desc$"
 ECU_new_training_regiments: "Новые учебные полки"
 ECU_new_training_regiments_desc: "$BRA_new_training_regiments_desc$"
 ECU_import_american_planes: "Импорт американских самолетов"
 ECU_import_american_planes_desc: "Мы должны импортировать американские самолеты, чтобы разработать и расширить наши ВВС."
 ECU_study_our_new_fighters: "Изучите наших новых бойцов"
 ECU_study_our_new_fighters_desc: "С недавним прибытием американских бойцов, мы можем воспринимать это как возможность изучить их проекты и получить представление о том, что делает их такими смертельными в бою."
 ECU_aerial_troop_support: "Поддержка воздушных войск"
 ECU_aerial_troop_support_desc: "$USA_air_support_desc$"
 ECU_the_legacy_of_cosme_renella_barbatto: "Наследие Косме Ренелла Барбатто"
 ECU_the_legacy_of_cosme_renella_barbatto_desc: "Косме Реналла Барбатто была пионером Эквадорской авиации, будучи широко считаться лучшим и наиболее влиятельным пилотом того времени. Первоначально из Италии, Бербатто в одиночку продвигала вперед авиацию и ВВС Эквадора. Его наследие наверняка останется годами."
 ECU_bombing_effort: "Бомбардировка усилий"
 ECU_bombing_effort_desc: "$USA_strategic_bombing_desc$"
 ECU_airbase_expansion: "Расширение авиабазы"
 ECU_airbase_expansion_desc: "$VEN_venezuelan_airbase_expansion_desc$"
 ECU_allocate_industrial_resources_to_plane_production: "Распределить ресурсы на производство самолета"
 ECU_allocate_industrial_resources_to_plane_production_desc: "Мы должны выделить больше промышленных ресурсов на производство самолета, если хотим иметь обширные ВВС."
 ECU_officially_seperate_the_airforce_branch: "Официально отделяет филиал ВВС"
 ECU_officially_seperate_the_airforce_branch_desc: "Долгое время военно -воздушные силы были просто ветвью армии. Однако с недавними модернизациями и расширениями мы можем разделить их и сделать ВВС своими отдельными ветвями."
 ECU_la_armada_ecuatoriana: "La Armada Ecuatoriana"
 ECU_la_armada_ecuatoriana_desc: "La Armada Ecuatoriana представляет флот страны. Он, как и армия, имела обширную историю, особенно из -за различных конфликтов, через которые она должна была пройти. Несмотря на это, это значительно омрачено армией."
 ECU_depoliticize_the_navy: "Деполитизировать военно-морской флот"
 ECU_depoliticize_the_navy_desc: "В течение долгого времени слухи распространились, что большинство адмиралов сочувствуют консерваторам и активно преследуют либералов. Это вызвало больший разделение между либералами и консерваторами, и это то, что мы должны обратиться как к возможному."
 ECU_support_the_conservative_admirals: "Поддерживать консервативные адмиралы"
 ECU_support_the_conservative_admirals_desc: "Адмиралы знают, что они делают. Если они поддерживают консервативную причину, то пусть будет так."
 ECU_dockyard_facility_expansion: "Расширение завода на верфи"
 ECU_dockyard_facility_expansion_desc: "$PRU_improve_our_dockyard_building_desc$"
 ECU_research_carriers: "Исследовательские перевозчики"
 ECU_research_carriers_desc: "$ITA_carrier_effort_desc$"
 ECU_centralized_repair_centers: "Централизованные ремонтные центры"
 ECU_centralized_repair_centers_desc: "В случае войны наши корабли могут выйти избитыми и ушибленными. Вот почему мы должны сосредоточить наши усилия на специализированных ремонтных центрах для наших кораблей, чтобы в кратчайшие сроки!"
 ECU_light_ship_effort: "Легкий корабль усилие"
 ECU_light_ship_effort_desc: "$ITA_light_ship_effort_desc$"
 ECU_heavy_ship_expansion: "Тяжелая экспансия корабля"
 ECU_heavy_ship_expansion_desc: "$BOL_focus_on_heavy_ships_desc$"
 ECU_cuerpo_de_marinas_del_ecuador: "Cuerpo de Marinas del Ecuador"
 ECU_cuerpo_de_marinas_del_ecuador_desc: "У Эквадора нет действительно определенной морской силы, особенно потому, что он никогда не нуждался в нем. Однако, поскольку глобальная напряженность продолжает растуть и угроза на горизонте нашего юга, мы должны иметь верхнюю часть в любых возможностях."
 ECU_technological_lessons_from_the_war: "Технологические уроки из войны"
 ECU_technological_lessons_from_the_war_desc: "Война научила нас многим вещам, и мы должны учиться у них. Мы должны убедиться, что наш флот в курсе новейших технологий."
 ECU_fund_the_AFE: "Финансировать AFE"
 ECU_fund_the_AFE_desc: "В конце 1938 года, с одобрением министерства, эквадорский женский альянс (AFE) был основан как демократическая и прогрессивная социальная организация. Независимо от множества политических мнений, его благотворительных действий, содействия образованию, культуры и юридической помощи принесли ему быстрый рост. Эквадор является континентальным примером политических прав."
  
  ## CHILE MARITIME EMPIRE PATH ## 
 CHL_the_american_counterweight: "Американский противовес"
 CHL_the_american_counterweight_desc: "Как описано в речи [ROOT.GetLeader], наш враг номер 1 - это [USA.GetName], и нам нужно построить и развивать нашу нацию, чтобы стать противовес этой демонической сущностью. Несмотря на шансы, мы преодолеем их и станем доминирующей силой!"
 CHL_reach_for_cochranes_thalassocracy: "Добраться до талассократии Кокрейны"
 CHL_reach_for_cochranes_thalassocracy_desc: "Томас Кокрейн, 10 -й граф Дандональд, был английским моряком, известным своим опытом в парусном спорте и качествами в качестве лидера. Он также служил одним из главных моряков чилийского флота во время ее войны за независимость. В это время он предложил идею о том, что Чили станет морской империей, причем ее баннер является доминирующей властью во всем Тихом океане. Хотя в то время это было немыслимо, теперь это может стать реальностью."
 CHL_demand_pitcairn_island: "Спрос [270.GetName]"
 CHL_demand_pitcairn_island_desc: "Если мы хотим по -настоящему разработать нашу морскую империю, нам нужно будет закрепить опору глубоко в Тихом океане. В то время как Пасхальный остров служит хорошей базой, более централизованная позиция Питкэрна окажется жизненно важным для постановки военно -морских вторжений и обеспечения нашего места в океане."
 CHL_pushing_west_desc: "Наше распространение влияния не может просто остановиться на острове Питкэрн. Как Соединенные Штаты с ее манифесткой судьбой, мы будем проявлять свою собственную, большую судьбу, вводя себя фарфоровым престолом, сидящим хорошо на всех наших соревнованиях."
 CHL_a_setting_sun_desc: "По мере того, как надвигающаяся тень Чилийской империи продолжает расти, тоже страх в глазах тех, кто бросает под ее тень. Япония, Великобритания и Соединенные Штаты знают свою предстоящую судьбу, и они столкнутся с этим с полной силой чилийского флота и армии."
 CHL_capture_guayaquil: "Захватить гуаякиль"
 CHL_capture_guayaquil_desc: "Гуаякиль является одним из основных портов Южной Америки. Наличие его под нашим руками обеспечит будущие победы."
 CHL_pushing_west: "Толчок на западе"
 CHL_a_setting_sun: "Заходящее солнце"
  
 ECU_the_kingdom_lives_on: "Королевство живет на"
 ECU_the_kingdom_lives_on_desc: "Королевство Эквадор, Перу и Боливия было создано, и оно продлится на протяжении веков. Наше королевство станет первым по -настоящему успешным королевством в истории человечества, и мы более чем доказали это!"
  
 CHL_embrace_our_prussian_military_tradition: "Примите нашу прусскую военную традицию"
 CHL_embrace_our_prussian_military_tradition_desc: "Прусская военная традиция является одной из самых мощных и эффективных в мире. Военные советники приехали в Чили в конце 19 -го века, и они научили нас многим вещам. Лучше всего поддерживать эти традиции и учения."
  
 BRA_harness_centrifuge_technology: "Harness Centrifuge Technology"
 BRA_harness_centrifuge_technology_desc: "Технология центрифуги - это мощный инструмент, который можно использовать для извлечения урана из руды. Эта технология позволит нам производить больше ядерного топлива и оружия."
  
 BRA_revive_the_corps_of_foreigners: "Оживить корпус иностранцев"
 BRA_revive_the_corps_of_foreigners_desc: "Корпус иностранцев был военным подразделением, состоящим из иностранных добровольцев, которые боролись за Бразилию во время войны в цисплатине. Возрождение этого подразделения позволит нам использовать опыт и опыт этих добровольцев и укрепить наши военные."
  
 BOL_founded_the_school_of_mechanics_and_navegation: "Основал школу механики и навигации"
 BOL_founded_the_school_of_mechanics_and_navegation_desc: "В 1939 году, с целью предположения контроля над речной навигацией и обучением необходимого технического персонала, армия создала Школу механиков и навигацию в Рибералате. Контроль над гидрографией страны и озером Титикака будет отмечать начало силы реки Лейк -реки в течение следующего десятилетия."
  
 PRU_paratrooper_company: "Переобусывающие компании"
 PRU_paratrooper_company_desc: "Дворцы - это элитная сила, которую можно развернуть за вражескими линиями, чтобы нарушить их операции и создать хаос. Они обучаются прыгать с самолетов и приземлиться на вражеской территории, где они могут выполнять саботажные миссии и собирать разум."
  
 PAR_the_golden_ten: "Золотая десять"
 PAR_the_golden_ten_desc: "Полковник ВВС Бразилии Энрике Деотт Фонтенелл предложил группе парагвайских офицеров уникальную возможность участвовать в защитных миссиях, учитывая глобальную напряженность. Несмотря на про-германские настроения армии, мы должны признать, что в результате укомплектования самолета янки последнего поколения на территории Бразилии было сдерживание немецких вторжений."
 PAR_the_golden_ten_opinion: "$PAR_the_golden_ten$"
  
 BOL_the_colorados_of_Bolivia: "Колорадо Боливии"
 BOL_the_colorados_of_Bolivia_desc: "Батальон Колорадоса, элитный подразделение боливийской армии с тех пор, как до войны Тихого океана демонстрировал непоколебимую решимость во время войны в Чако. Несмотря на то, что он был среди полков, которые сдались во время осады Кампо Вии 11 декабря 1933 года, он выздоровел и в мае 1934 года отличился в битве при сильной битве при Каньяде, где он окружил и заставил сдачу парагвайского полка. Его способность преодолевать трудности и действовать решительно сделала его символом национальной военной гордости и модели дисциплины и смелости для будущих поколений."
  
 BOL_fund_the_institute_of_military_geography: "Фонд Института военной географии"
 BOL_fund_the_institute_of_military_geography_desc: "С момента ранней работы Топографического комитета армии в 19 веке Боливия накопила опыт в своей национальной картографии. Следуя урокам Chaco, правительство объединило эти усилия с постановлением 1936 года, установив институт военного географического географического института, по которому поручено создать стратегические карты и координацию топографических исследований, а также все связанные задачи поддержки для вооруженных сил."
  
 VEN_accept_portuguese_and_spanish_refugees: "Принять португальских и испанских беженцев"
 VEN_accept_portuguese_and_spanish_refugees_desc: "Гражданская война в Испании заставила многих беженцев бежать в Венесуэлу, и мы должны принять их. Они станут отличным дополнением к нашей стране, и мы можем использовать их опыт для улучшения нашей страны."
  
 CHL_standarized_production: "Стандартизированное производство"
 CHL_standarized_production_desc: "Стандартизированное производство - это процесс создания продуктов, которые идентичны во всех отношениях. Это обеспечивает массовое производство и снижает затраты. Мы должны реализовать это на наших заводах, чтобы повысить эффективность и снизить затраты."
  
 CHL_commence_a_new_modernization_process: "Начать новый процесс модернизации"
 CHL_commence_a_new_modernization_process_desc: "Процесс модернизации является длинным и трудным, но он необходим для выживания нашей нации. Мы должны модернизировать наши военные, чтобы гарантировать, что мы можем конкурировать с другими великими державами мира."
  
  
  ## CENTRAL AMERICA ## 
 CEA_the_economy: "Экономика [ROOT.GetAdjective]"
  
 CEA_address_the_coffee_plantations: "Обратиться к кофейным плантациям"
 CEA_address_the_coffee_plantations_desc: "Кофейные плантации являются основой нашей экономики. Мы должны убедиться, что они должным образом управляются и поддерживаются."
 CEA_coffee_exports: "Экспорт кофе"
  
 CEA_nationalize_the_coffee_industry: "Национализировать кофейную индустрии"
 CEA_nationalize_the_coffee_industry_desc: "Кофейная индустрия является основным источником дохода для страны. Национализация этого гарантирует, что прибыль оставалась в стране."
  
 CEA_force_out_the_banana_companies: "Вытеснить банановые компании"
  
 CEA_dismantle_the_plantation_monopoly: "Демонтировать монополию плантации"
  
 CEA_nationalize_the_industry: "Национализируйте отрасль"
  
 CEA_an_industrial_economy: "Промышленная экономика"
  
