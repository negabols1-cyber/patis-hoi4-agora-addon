  IRQ_middle_east_chaos_bridge:0 "Мост хаоса на Ближнем Востоке"
  IRQ_middle_east_chaos_bridge_desc:0 "С тех пор как Ирак перестал быть частью Османской империи, всегда существовал страх, что Ирак может подвергнуться нападению со стороны региональных держав.\nЭтот страх и беспокойство заставили Ирак попытаться установить добрые и мирные отношения с соседними странами и не выступать против них в своей политике.\n\n§RМожно удалить§!, если наша страна §Yвелика§! или §Y[TUR.GetName], [PER.GetName], [SAU.GetName] все они демократичны§! или §Yдвух из них не существует§!.\nВы также можете удалить его §Yиз некоторых национальных целей§!."
