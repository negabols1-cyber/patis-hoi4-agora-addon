 #Тур по Конго
 congo_tour.1.t:0 "Тур по Конго"
 congo_tour.1.d:0 "С момента назначения в 1934 году, Пьер Рикманс пытался устранить разрушения, оставленные его предшественником на посту генерал-губернатора, Огюстом Тилькенсом. Постепенно раны заживали, и миф о *Красной резине* исчезал, но местные жители по-прежнему не понимают ситуацию. Кроме того, его маленький мальчик хотел увидеть места из комикса *Тинтин в Конго*. Так что он решил отправиться в путь.\n\nОн позвал свою секретаршу. Когда она пришла, он сказал..."
 congo_tour.1.a:0 "Мой ребёнок хочет пойти вглубь леса!"
 congo_tour.1.b:0 "Пойдём немного на юг и проведаем народ!"
 congo_tour.2.t:0 "Станция:Порт-Франки"
 congo_tour.2.d:0 "Порт-Франки, или Илебо, как его называют местные, был, несомненно, крупнейшим поселением в центральной части Конго. Город был связан рекой и несколькими песчаными тропами, по которым могли передвигаться носильщики. Европейцы были повсюду. Местные жители обычно работали носильщиками или лодочниками. Райкманс сначала посетил административное здание, где его приветствовали. Вместе с мэром и несколькими журналистами они отправились в путь. Они подошли к мосту через реку Касаи, который был построен в 1935 году. Райкманс спросил, почему мост так долго строился. Мэр ответил: "Сэр, мы, конечно, стараемся вести строительство как можно быстрее, но китавала саботируют нашу работу". Райкманс сказал..."
 congo_tour.2.a:0 "Китавала также являются конголезцами"
 congo_tour.2.b:0 "Китавала - это позор для Конго!"
 congo_tour.3.t:0 "Китавала"
 congo_tour.3.d:0 "Китавала - это религиозное движение, которое возникло в Конго в начале 1900-х годов. С момента начала Великой войны они замедляли прогресс Конго с помощью некоторых диверсий. После последнего заявления Пьера Райкманса вождь Китавала сказал, что они не остановятся, пока его голова не будет пронесена по всему Конго. Некоторые аванпосты присылают доклады о том, что старые немецкие склады разграблены. Что нам с этим делать?"
 congo_tour.3.a:0 "Мы должны быть осторожны"
 congo_tour.3.b:0 "Мы займёмся ими после экскурсии"
 congo_tour.4.t:0 "Станция:Камина"
 congo_tour.4.d:0 "Камина известен как важный железнодорожный узел; три линии конголезских железных дорог проходят от Камины на север, запад и юго-восток. Железная дорога от Кейптауна до Каира проходит через этот город. Бельгийские вооруженные силы создали в Камине крупную военную базу. Райкманс и его делегация вошли на площадь в церемониальном порядке в конце его инспекционного тура. С обеих сторон дороги стояли конголезские солдаты. Пройдя мимо всех них, он начал свою речь. Он говорил о продолжающемся возрождении Конго под бельгийским правлением. После своей речи он провел приятный вечер с офицерами, которых узнал в том месте. Завтра утром Пьер..."
 congo_tour.4.a:0 "поехал на поезде в Элизабетвиль"
 congo_tour.4.b:0 "поехал на поезде в Кабало"
 congo_tour.4.c:0 "должен был быть убит"
 congo_tour.5.t:0 "Неудача"
 congo_tour.5.d:0 "Но прежде чем убийцы покушались на его жизнь, они, согласно полученным сведениям, были пойманы в своих убежищах. Даже несмотря на то, что это не произошло на глазах у всех, в обществе наблюдается некоторое возмущение."
 congo_tour.5.a:0 "Поехали в Кабало"
 congo_tour.6.t:0 "Небольшая рана"
 congo_tour.6.d:0 "Когда Пьер продолжал идти, раздался выстрел, и он упал от боли. Стрельба продолжалась некоторое время, непонятно, откуда она была. Охрана немедленно окружила Райкманса. Приехала скорая помощь, и его отвезли в больницу. Утром было объявлено, что его состояние стабильное. Газеты начали писать антиафриканские статьи."
 congo_tour.6.a:0 "Я надеюсь, это не повлияло на Пьера."
 congo_tour.7.t:0 "Генерал-губернатор мёртв!"
 congo_tour.7.d:0 "Когда Пьер продолжал идти, раздался выстрел, и он упал от боли. Стрельба продолжалась некоторое время, источник неизвестен. Охрана немедленно окружила Райкманса. Приехала скорая помощь, и его отвезли в больницу. Через два дня Пьер Райкманс был объявлен мертвым. До тех пор, пока не будет назначен новый губернатор, страной будет управлять совет."
 congo_tour.7.a:0 "Покойся с миром"
 congo_tour.8.t:0 "Конечная станция: Элизабетвиль"
 congo_tour.8.d:0 "Начиная с 1933 года бельгийские колониальные власти создали ограниченную форму самоуправления, основав город-поселение для коренных жителей Элизабетвиль в качестве так называемого центра нетрадиционного права (центра, не подчиняющегося обычному праву). Он управлялся местным советом и возглавлялся вождём-аборигеном. Колониальное правительство вмешивалось слишком активно, но люди, похоже, были довольны ситуацией. Колониальное правительство вмешивалось слишком активно, но люди, похоже, были довольны ситуацией.\n\nПьер прикурил сигарету на своем балконе и вечером смотрел на прохожих."
 congo_tour.8.a:0 "Вернемся к работе"
 congo_tour.9.t:0 "Станция: Кабало"
 congo_tour.9.d:0 "Пьер приближался к концу путешествия. Они остановились в Кабало. Вошли в ресторан и стали есть со своей делегацией. К вечеру были открыты вина из пальм. Все были в хорошем настроении. Пьер начал спрашивать комиссара, сидящего в сторонке, о ситуации в этом районе. По мере того, как вопросы и ответы приходили один за другим, разговор перешёл к англичанину по имени Джон Эдвард Черч. Этот англичанин помогал бесплатно открывать многие больницы и церкви в Руанде и Бурунди. Пьер, похоже, был этим немного доволен. В конце концов, он был религиозным человеком, а бельгийская миссионерская работа шла не очень хорошо. Он сказал..."
 congo_tour.9.a:0 "Ух ты, замечательно"
 congo_tour.9.b:0 "Он должен присоединиться к нам"
 congo_tour.9.c:0 "Мне нужен воздух"
 congo_tour.10.t:0 "Провал"
 congo_tour.10.d:0 "Он вышел, затем прикурил сигарету и сел. Больше ничего не произошло, потому что все убийцы были пойманы во время рейдов."
 congo_tour.10.a:0 "Поехали в Стэнливиль"
 congo_tour.11.t:0 "Конечная станция: Стэнливиль"
 congo_tour.11.d:0 "Прежде чем Генри Мортон Стэнли, работавший на короля Леопольда II, основал в 1883 году то, что стало станцией Стэнли-Фоллс, на острове Вана Русари в бассейне Конго, эта территория была заселена местным конголезским племенем, известным как кланы Энья, которые использовали Стэнли-Фоллс для рыболовства. Теперь это один из самых важных городов в Конго, с рыболовным промыслом и железной дорогой в Каир. Пьер объехал весь город и поговорил с людьми."
 congo_tour.11.a:0 "Он сказал: «Пора возвращаться домой»"
 congo_tour.11.b:0 "Потом он направился к центру"
 congo_tour.12.t:0 "Провал"
 congo_tour.12.d:0 "Пьер направился к центру, и несколько Китавала бросились к нему, но солдаты поймали их, прежде чем они смогли приблизиться к нему."
 congo_tour.12.a:0 "Пора возвращаться домой"
 congo_tour.13.t:0 "Пьер находит гориллу, но..."
 congo_tour.13.d:0 "По пути назад Пьер остановился возле деревни и вышел, чтобы осмотреть ее. Деревня принадлежала Китавалам. Китавала хотели, чтобы Пьер и горилла сразились. Пьер согласился, но затем упал от одного удара. Согласно конголезским правилам, победитель поединка übernimmt. Поэтому новым губернатором станет Горилла Вито."
 congo_tour.13.a:0 "Новому губернатору!"
 congo_dem.1.t:0 "Бельгийский генерал-губернатор мёртв"
 congo_dem.1.d:0 "В 1936 году бельгийский генерал-губернатор Конго Пьер Рикманс был убит. Смерть генерал-губернатора нарушила политический и социальный баланс Конго, распространив беспокойство и неуверенность по всей стране.\n\nБельгийское правительство и местные власти Конго начали обсуждать, какие меры предпринять после этого. Бельгийцы, живущие в Конго, требовали большей защиты от правительства и сил безопасности. А конголезцы стали добиваться справедливости и раскрытия сил, стоящих за убийством. Местные лидеры в других колониях внимательно следили за событиями в Конго и пытались обеспечить свою безопасность.\n\nМеждународное сообщество также пристально следило за ситуацией. Убийство Рикманса продемонстрировало растущую политическую нестабильность в Конго и угрозу безопасности в бельгийских колониях. Это привело к пересмотру европейской колониальной политики и дальнейшим дебатам о будущем колоний, таких как Конго.\n\nВ результате убийство Рикманса оказало глубокое влияние на колонию Конго. После этого стало ясно, что политические лидеры и международное сообщество несут серьёзную ответственность за принятие мер по стабилизации региона и предотвращению повторения подобных событий.\n\nЧто же нам делать?"
 congo_dem.1.a:0 "Отправить ещё одного губернатора"
 congo_dem.2.t:0 "Прибыл новый губернатор"
 congo_dem.2.d:0 "Когда после последнего заседания бельгийского колониального министерства было сделано объявление о назначении Луверса новым генерал-губернатором, в Конго возникли как волнение, так и неуверенность. С назначением Луверса стало возникать много вопросов о будущем Конго. Потрясённый смертью Рикманса, он вызвал любопытство относительно того, какого рода преобразования ждут Конго под руководством Луверса.\n\nВ 1936 году жаркая и влажная погода Конго ждала прибытия новоназначенного бельгийского генерал-губернатора Октава Луверса. Луверс был назначен на место предыдущего генерал-губернатора Пьера Рикманса, и как новый лидер Конго он нёс огромную ответственность.\n\nПо прибытии Луверса в столице Конго Леопольдвилле была организована торжественная церемония встречи. Местные жители вышли на улицы, чтобы приветствовать нового генерал-губернатора, и встречали его традиционными танцами и музыкой. Однако первой задачей Луверса было завоевать доверие народа и администрации. После Рикманса Луверсу нужно было понять сложную политическую и социальную структуру Конго и быстро предпринять меры, чтобы оправдать ожидания народа.\n\nМежду тем, другие европейские державы внимательно следили за тем, что происходило в Конго. То, как изменится влияние Бельгии в Конго под руководством Луверса, и влияние этого изменения на другие державы в регионе, вызывало большой интерес.\n\nС прибытием Луверса началась новая глава в истории Конго. Однако после событий прошлого будущее Конго было неопределённым, и то, как лидерство Луверса справится с этой неопределённостью, было важным вопросом для конголезцев и международного сообщества."
 congo_dem.2.a:0 "Добро пожаловать, новый губернатор!"
 congo_dem.3.t:0 "Политическое освобождение"
 congo_dem.3.d:0 "После недавних событий бельгийское правительство объявило, что пересмотрит свою политику в отношении Конго. В то же время оно заявило, что теперь бельгийского короля Пьера можно считать дворянином, то есть достойным титула графа, даже после смерти. Эти заявления были восприняты как предвестники политических преобразований в Конго и пристально отслеживались как местным населением, так и международным сообществом.\n\nНовая администрация во главе с Октавом Луверсом начала вносить радикальные изменения в политическую и социальную структуру Конго. Луверс одобрил закон, разрешающий людям свободно передвигаться между городами. Этот закон позволил людям, живущим в разных частях Конго, жить более свободно и независимо.\n\nНовый закон повысил мобильность конголезцев со всей территории Конго. Теперь люди могли свободнее перемещаться между городами для работы, учёбы или посещения родственников. Это способствовало культурному обмену и экономическому взаимодействию между различными регионами Конго.\n\nС этой новой свободой у конголезцев появилась возможность самим строить свою жизнь. Некоторые мигрировали в другие города в поисках новых возможностей, в то время как другие возвращались на свою родину, чтобы установить более прочные связи с корнями. Однако эти преобразования не обошлись без проблем. Новая волна миграции привела к проблемам с инфраструктурой и росту населения в некоторых городах, поставив новые задачи перед местными властями.\n\nМежду тем, пересмотр бельгийской политики в Конго оказал глубокое влияние на политический и социальный баланс в регионе. Конголезский народ теперь требовал больше свободы и справедливости, в то время как международное сообщество стало ставить под сомнение колониальную политику Бельгии. Это ознаменовало начало эпохи, которая обещает новые дебаты и перемены в будущем Конго."
 congo_dem.3.a:0 "Carpe diem!"
 congo_dem.4.t:0 "Основание ABAKO"
 congo_dem.4.d:0 "Вернувшиеся в Конго конголезские интеллектуалы из Конго основали Альянс баконго, или ABAKO, политическую организацию, в настоящее время возглавляемую священником по имени Даниэль Канза. Эта организация поставила перед собой цель как можно скорее освободить Конго от всех иностранных держав. После публикации манифеста ABAKO его члены были через несколько часов освобождены из тюрьмы, поскольку они не совершили никакого правонарушения.\n\nОднако основание и цели ABAKO оказали огромное влияние на Конго. Под руководством Канзы организация подняла требования конголезского народа о свободе и независимости. Другие политические группы в Конго присоединились к призыву ABAKO и решили вместе бороться с иностранным господством над народом.\n\nПосле манифеста ABAKO начались протесты возле полицейских участков по всему Конго. Люди вышли на улицы, требуя справедливости, требуя освобождения членов ABAKO. Эти протесты распространились на разные части Конго, посылая правительству сигнал прислушаться к ним.\n\nОднако по мере роста беспорядков в Конго бельгийское правительство и колониальные власти стали беспокоиться. Растущая мощь ABAKO и лидерство Канзы стали ставить под сомнение контроль Бельгии над Конго. Правительство стало принимать жёсткие меры по задержанию членов ABAKO и их сторонников.\n\nМежду тем, другие политические группы и сообщества в Конго начали поднимать свой голос. Появление ABAKO было признано предвестником значительных перемен в политической и социальной атмосфере Конго. Растущие требования против бельгийского господства рассматривались как важный поворотный момент, который определит будущее Конго."
 congo_dem.4.a:0 "Дальше будет хуже."
 congo_dem.5.t:0 "Вопросы о Конго"
 congo_dem.5.d:0 "Бельгийский контроль над Конго существовал полностью или частично со времени основания Международной африканской ассоциации. Однако с начала 1900-х годов в Конго стали всё больше влиять националистические идеологии, и население постепенно начало забывать, что их освободили. Это заставило многих учёных публиковать статьи по этому вопросу.\n\nОбщим мнением является то, что Бельгия должна постепенно вывестись из Конго по 10-летней программе. Бельгийское колониальное министерство начало обсуждать этот вопрос. На повестке дня был отчёт Кейсмента, документ о голоде и смерти в Конго, вызванных неудачными реформами властного и надменного короля Леопольда. Этот документ был огромным фиаско, когда был впервые опубликован. Лига Наций заявила, что если это произойдёт снова, она насильно возьмёт под контроль Конго.\n\nЗная ситуацию, Октав Луверс представил в колониальное министерство план быстрого вывода войск. Согласно этому плану
 congo_dem.8.t:0 "Конго отменяет монархию"
 congo_dem.8.d:0 "Октав Луверс поднялся на трибуну, и зал наполнился тишиной. Его взгляд скользнул по членам совета, он чувствовал напряжённость на каждом из их лиц.\n\nОгонь независимости горел в его сердце, и он был полон решимости распространить его на все уголки ассамблеи. \"Конголезцы!\" - воскликнул Луверс, его голос эхом разнёсся по залу. \"Мы собрались здесь сегодня, чтобы решить нашу судьбу. Пришло время разорвать оковы рабства и подняться как свободная нация!\" С энтузиазмом в голосе Луверс описал богатства и потенциал Конго. \"Наша земля плодородна, наши люди трудолюбивы и умны. Мы ничем не хуже любой другой нации! У нас есть право на самоопределение и самоуправление!\" Идея независимости была не нова в парламенте. Но слова Луверса отозвались в сердцах членов собрания. Его страсть и убежденность были заразительны. \"Мы больше не будем жить под гнётом колонизаторов!\" - воскликнул он. \"Конго будет независимым!\" Луверс приправлял свою речь историческими примерами. \"Помните борьбу за независимость Соединённых Штатов Америки!\" - сказал он членам собрания. \"Помните принципы свободы и равенства, принесенные Французской революцией! Как и они, мы можем обрести независимость и построить свою собственную нацию!\"\n\nКогда речь была закончена, члены совета устроили ему овацию. Слова Луверса зажгли их сердца. Желание независимости было сильнее, чем когда-либо."
 congo_dem.8.a:0 "Ничего не сделать"
 congo_dem.9.t:0 "День выборов"
 congo_dem.9.d:0 "Долгожданный день выборов наконец настал в Конго, ознаменовав исторический момент в пути нации к демократии. Несмотря на такие трудности, как плохая погода и личные недомогания, мужчины и женщины из всех слоёв общества по всей стране явились на избирательные участки в своих провинциях, чтобы отдать свои голоса за предпочитаемую партию или кандидата. Сама величина явки избирателей удивила многих, особенно с учетом быстрого перехода страны к демократии.\n\nАтмосфера в день выборов была электрической, в воздухе витало предвкушение и волнение. Для многих граждан Конго это была первая возможность участвовать в свободных и честных выборах, в фундаментальном праве, которое им долгое время отказывали. Несмотря на сохраняющуюся неопределенность и напряжённость в политическом ландшафте, непреодолимое стремление к переменам и прогрессу побудило людей реализовать свои демократические права с рвением и решимостью.\n\nПо мере того, как в течение дня разворачивался процесс голосования, стало очевидно, что избирательная гонка велась в напряженной борьбе. Политические партии и кандидаты энергично проводили свои кампании, каждый из них боролся за поддержку электората. Хотя выборы не были лишены своих недостатков и противоречий, включая обвинения в запугивании избирателей и нарушениях, стойкость и дух конголезского народа проявились в полной мере, поскольку они твердо придерживались своей приверженности формированию будущего своей нации мирными и демократическими средствами.\n\nПосле выборов последовала череда активных действий: бюллетени были тщательно подсчитаны, а результаты подведены. Это был кропотливый процесс, требующий тщательного изучения и внимания к деталям. По мере того, как часы превращались в дни, напряжение только росло, поскольку вся страна с нетерпением ждала объявления окончательного результата.\n\nНаконец, после долгого ожидания были объявлены окончательные победители первых свободных выборов в Конго. Результаты отразили разнообразные устремления и голоса конголезского народа, продемонстрировав демократический триумф перед лицом невзгод. Хотя путь впереди оставался сложным и неопределенным, успешное проведение выборов стало маяком надежды на более светлое и более инклюзивное будущее для Конго и его граждан.\n\nОкончательные победители первых выборов в Конго..."
 congo_dem.9.a:0 "Христианско-демократическая партия!!!"
 congo_dem.9.b:0 "Альянс Баконго!!!"
