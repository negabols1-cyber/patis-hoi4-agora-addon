l_russian:
  TUR_turanist_meb:0 "Очистить Министерство национального образования от коммунистов"
  TUR_turanist_meb_desc:0 "Чистое туранское общество начинается с обучения молодежи. Устранение "раковой опухоли" коммунистов в Министерстве национального образования станет первым шагом к достижению нашей цели создания Турана"
  TUR_clear_univercityes:0 "Очистить университеты и внедрить туранизм"
  TUR_clear_univercityes_desc:0 "Мы очистили Министерство национального образования, и теперь очередь за профессорами, которые заражают наших чистых и светлых юнцов раковой опухолью коммунизма. Мы должны удалить остатки коммунистов и привить нашей молодежи чувство превосходства турок"
  TUR_expanding_the_saadabad_pact_2:0 "Расширение пакта Саадабада"
  TUR_expanding_the_saadabad_pact_2_desc:0 "Альянс с другими странами на Ближнем Востоке укрепит наши позиции"
  TUR_expanding_the_saadabad_pact_invite:0 "Пригласить всех соседей с Ближнего Востока"
  TUR_expanding_the_saadabad_pact_invite_desc:0 "Пригласить всех соседей с Ближнего Востока"
  TUR_the_clodius_agreement:0 "Соглашение Клодиуса"
  TUR_the_clodius_agreement_desc:0 "Немцы вышли к нам с выгодным предложением: хромовая руда в обмен на средства для производства нашего собственного военного снаряжения. Став для [GER.GetNameDef] основным источником хромовой руды, мы также приобретаем право на покровительство [GER.GetNameDef], что в нынешней ситуации ставит нас в довольно завидное положение"
  TUR_clodius_agreement_tt:1 "Every state that produces §Y55§! or more units of §YChromium§! will receive three levels of §YInfrastructure§! and three §YMilitary Factories§!."
  TUR_return_misaki_milli:0 "Road to old lands"
  TUR_return_misaki_milli_desc:0 ""
  TUR_old_friends:0 "Recall old Friends"
  TUR_old_friends_desc:0 "\"Medîne Müdâfii\", \"Turkish Tiger\", \"Desert Tiger\", \"Hero of Medîna\" Fahrettin Pasha retired as a lieutenant general and is now spending happy times with his family.Yes it is his right but the world is changing and we need our Veterans to train and lead our young officers. Fahrettin Pasha will not refuse this request."
  TUR_free_turkic_peoples:0 "Every Turk Must Be Free"
  TUR_free_turkic_peoples_desc:0 "We Turks have been fighting for our independence for centuries. Our last war was the war of independence. Yes, we Anatolian Turks have gained our independence, but our other Turkish brothers and sisters scattered all over the world are still not free. We will give a single note to all countries persecuting Turkic peoples. Either they will give the Turks their independence or we will use force to give them their independence."
  TUR_Forced_Marriage_law:0 "Forced Marriage law"
  TUR_Forced_Marriage_law_desc:0 "Мир вот-вот погрузится в хаос, и все страны начали вооружать свой народ, но в отличие от других стран у нас недостаточно населения. Налог с тех, кто не вступает в брак, несмотря на достижение брачного возраста, для выживания нашей страны позволит нашей молодежи вступать в брак и ускорит рост нашего населения."
  TUR_every_turk_born_soldier:0 "Каждый турок рождается солдатом"
  TUR_every_turk_born_soldier_desc:0 "Мы веками сражаемся без остановки и не отдадим этот последний клочок земли своим врагам. От степей Центральной Азии до гор Кавказа, от Балкан до фронта Вены, мы поливали каждый дюйм земли своей кровью. Сегодня ничего не изменится, это наша последняя защита, это наша последняя родина, да, наш враг может быть сильным, но помните: «Каждый турок рождается солдатом»"
  TUR_take_bismarck:0 "Турецкий Бисмарк"
  TUR_cyprus_territory:0 "Конец аренды"
  TUR_cyprus_territory_desc:0 "С 1878 года мы сдаем свою малую родину в аренду англичанам. В 1-й мировой войне англичане захватили нашу малую родину и так и не вернули, но времена изменились, теперь мы с англичанами и вместе сражаемся против всего мира, может быть, англичане не замедлят с тем, чтобы вернуть то, что по праву наше."
  TUR_national_development_plan:0 "Национальный план развития"
  TUR_national_development_plan_desc:0 "Национальный план развития"
  TUR_New_Janissary_System:0 "Новая система янычар"
  TUR_New_Janissary_System_desc:0 "Да, янычары были коррумпированы и стали государством в государстве, и их нужно было уничтожить. Но времена изменились, и если наша империя хочет снова бросить вызов мировым державам, нам нужно возродить янычар."
  TUR_new_gendarmerie:0 "Новая жандармерия"
  TUR_new_gendarmerie_desc:0 "Одной из самых больших проблем нашей империи в прошлые века были внутренние мятежи, которые ослабили нашу армию в крупных битвах и повредили наши линии снабжения. Если мы не сможем подавить сепаратистов в нашей империи, наша новая империя не продлится долго"
  TUR_Integrate_into_Ancient_Traditions:0 "Интеграция в древние традиции"
  TUR_Integrate_into_Ancient_Traditions_desc:0 "В прошлом мы жили счастливо на завоеванных нами землях, не вмешиваясь в жизнь немусульман, не вмешиваясь в их религию и образ жизни. Если мы сможем сделать это снова и более эффективно, мы сможем посадить платан, который будет жить сотни лет."
  TUR_return_of_the_tarikats:0 "Возвращение тарикатов"
  TUR_return_of_the_tarikats_desc:0 ""
  TUR_Ashes_of_the_Fallen_Empire:0 "Возвращение к системе бейликов"
  TUR_Ashes_of_the_Fallen_Empire_desc:0 "Наша славная империя использовала систему бейликов, чтобы обеспечить безопасность своих обширных границ и развивалась, так что мы могли контролировать территории далеко от нашей столицы. Если мы сможем адаптировать и возродить эту систему для современной эпохи, неминуемо, что наша империя вернется к своей былой славе."
  TUR_Like_in_the_old_days:0 "Как в старые времена"
  TUR_Like_in_the_old_days_desc:0 "В течение столетий наш народ не бежал в случае войны, как другие народы. Это не изменится и в этом веке."
  TUR_attack_arab_lands:0 "Цена предательства"
  TUR_attack_arab_lands_desc:0 "Арабы, которых до недавнего времени мы считали друзьями, предали нас, объявив неверными и сотрудничая с христианами. Это предательство не будет забыто."
  TUR_Unionization:0 "Объединение турецких рабочих"
  TUR_Unionization_desc:0 ""
  TUR_militarisation:0 "Фашистская милитаризация"
  TUR_militarisation_desc:0 ""
  TUR_expand_the_redshirts:0 "Расширение рядов краснорубашечников"
  TUR_expand_the_redshirts_desc:0 ""
  TUR_allies_aid:0 "Помощь союзников"
  TUR_allies_aid_desc:0 ""

