  #Events
  ef_tur.3.t:0 "Абдулазиз объявляет себя истинным Халифом"
  ef_tur.3.d:0 "Многие годы мы как империя носили титул Халифа. Теперь мы его вернули, но проблемы продолжают нас преследовать, и в то же время лидер арабов заявляет о себе как о Халифе. Мы должны либо принять очень сложное решение и отказаться от титула халифа, чтобы не накалять напряженность между двумя странами, либо потребовать от них отказаться от титула халифа."
  ef_tur.4.t:0 "Оттоманы прислали нам ультиматум"
  ef_tur.4.d:0 "Османская империя прислала нам ультиматум, в котором требует отказаться от титула халифа. В противном случае они могут объявить нам войну, потому что не может быть двух халифов одновременно."
  ef_tur.5.t:0 "[FROM.GetName] отверг ультиматум"
  ef_tur.5.d:0 "[FROM.GetName] заявил, что не откажется от титула халифа и будет бороться за него до конца. В этой ситуации у нас нет другого выхода, кроме как объявить им войну."
  ef_tur.6.t:0 "Объявить джихад!"
  ef_tur.6.d:0 "Наши ультиматумы не были приняты. Одна сторона должна отказаться от титула халифа, так что нет другого выхода, кроме как сражаться. Мы должны выиграть эту войну, так что мы должны объявить джихад."
  ef_tur.7.t:0 "[FROM.GetName] сдается"
  ef_tur.7.d:0 "Кровавая война наконец закончилась и [FROM.GetName] согласился сдаться. Вскоре они выполнят условия мирного соглашения, и мы пойдем вперед, став сильнее, чем прежде."
  ef_tur.8.t:0 "Вернулся TCG Muavenet"
  ef_tur.8.d:0 "TCG Muavenet был 1 из 4 эсминцев, которые мы заказали у Соединенного Королевства в 1938 году. Когда началась Вторая мировая война, Королевский флот купил 2 из этих кораблей, и Muavenet был одним из них. Оставшиеся 2 были поставлены нам в 1942 году и введены в эксплуатацию. В то же время, HMS Ithuriel (Gayret) не был доставлен, так как был поврежден сверх меры и был разобран. Но теперь, когда война закончилась и мрачные дни позади нас, пересмотр TCG Muavenet был завершен, корабль доставлен в Стамбул, и завтра мы включим корабль в состав нашего флота на большой церемонии!"
  bftb_turkey.145.t:0 "Турция хочет забрать Кипр!"
  bftb_turkey.145.desc:0 "После вступления Турции в союзники развились турецко-британские отношения. Однако турецкое правительство хочет снова присоединить Кипр, который на протяжении многих лет был турецкой землей.\n\nНесмотря на то, что британцы благосклонно отнеслись к этому предложению, пока что не получено определенного ответа. Мы подождем и посмотрим."
  bftb_turkey.145.a:0 "Приемлемо..."
  bftb_turkey.145.b:0 "Стратегически важный регион, спад"
  bftb_turkey.146.t:0 "Великобритания принимает."
  bftb_turkey.146.desc:0 "Наши дипломатические отношения с Великобританией значительно улучшились после того, как мы вступили в эту великую войну на стороне союзников в последние дни.\nОднако наше предложение по Кипру было принято правительством Великобритании. Кипр теперь - турецкая земля!"
  bftb_turkey.146.a:0 "Отличные новости!"
  bftb_turkey.147.t:0 "Великобритания отказалась!?"
  bftb_turkey.147.desc:0 "Хотя мы и участвовали в этой великой войне на стороне союзников в последние дни, правительство Великобритании не приняло нашу просьбу по Кипру и отклонило ее.\n\nПричина, по которой предложение не было принято, заключается в том, что Кипр является важным стратегическим регионом."
  bftb_turkey.147.a:0 "Плохие новости."