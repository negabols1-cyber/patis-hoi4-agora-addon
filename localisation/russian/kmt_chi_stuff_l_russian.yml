  KMT_hold_manchuria:0 "Держать Маньчжурию!"
  KMT_hold_manchuria_desc:0 "Богатая промышленность и ресурсы Маньчжурии жизненно важны для наших военных действий, мы не должны допустить, чтобы наши враги их захватили!"
