  KMT_demand_war_cut_losses:0 "Отступить в войне за требования [From.GetAdjective]"
  KMT_demand_war_cut_losses:0 "Нынешняя война за требования [From.GetAdjective] обходится нам слишком дорого. Несколько высокопоставленных лиц уже предлагают отступить в войне раз и навсегда, чтобы избежать дальнейших потерь."
  KMT_demand_war_demand_peace:0 "Повторить требования [From.GetName]"
  KMT_demand_war_demand_peace_desc:0 "Теперь, когда мы заняли все территории, удерживаемые [From.GetName], мы можем вновь выдвинуть наши требования и посмотреть, подчинятся ли они теперь."
