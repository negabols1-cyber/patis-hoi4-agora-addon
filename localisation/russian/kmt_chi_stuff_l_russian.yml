  KMT_dcat_chinese_civil_war:0 "Гражданская война в Китае"
  KMT_retreat_to_taiwan:0 "Отступить на Тайвань"
  KMT_send_help_to_central:0 "Отправить подкрепление в [From.GetName]"
  KMT_send_help_to_commie:0 "Отправить подкрепление в [From.GetName]"
  KMT_deal_with_separatist:0 "Вернуть [From.GetAdjective] сепаратистов в лоно"
  KMT_deal_with_separatist_desc:0 "Сепаратисты в [From.GetName] отделились от нас во время гражданской войны. Пора усмирить их непокорный нрав."
  KMT_deal_with_separatist_window:0 "Признание независимости"
  KMT_deal_with_separatist_window_desc:0 "Если не предпринять дипломатических мер вовремя, сепаратисты, отделившиеся в ходе гражданской войны, сумеют утвердить свое положение. И тогда справиться с ними будет непросто."
  KMT_declare_independence:0 "Провозгласить независимость"
  KMT_declare_independence_desc:0 "Пока [From.GetName] занят гражданской войной, мы можем объявить независимость в этот момент. Однако после окончания гражданской войны мы можем столкнуться с ужасными последствиями, если [From.GetName] выйдет из неё победителем."
  KMT_yangtze_partition_trigger_central_tt:0 "Ни одним из ваших провинций, которой вы владеете в §Южном Китае§! или §Восточном Китае§!, что §к югу от реки Янцзы§!, не управляет §[PRC.GetName]§!, члены их фракции или их подданные."
  KMT_yangtze_partition_trigger_prc_tt:0 "Ни одним из ваших провинций, которой вы владеете в §Амдо§!, §Северном Китае§!, §Маньчжурии§! или §Восточном Китае§!, что §к северу от реки Янцзы§!, не управляет §[KMT_central_gov_tag.GetName]§!, члены их фракции или их подданные."
  KMT_has_idea_cg_warlords:0 "Имеет национальный дух §Является местным правительством§!"
  KMT_retreat_to_sichuan:0 "Отступить в [605.GetName]"
  KMT_retreat_to_sichuan_desc:0 "Наша текущая война идет не в нашу пользу, мы должны рассмотреть возможность отступления в горный район в [605.GetName]. Нашим врагам будет трудно захватить этот район, и у нас будет драгоценное время для получения иностранной помощи."
  KMT_back_to_nanking:0 "Перенести столицу в [613.GetName]"
  KMT_join_central:0 "Присоединиться к [KMT_central_gov_tag.GetName]"
  KMT_join_central_desc:0 "Китайская гражданская война снова в самом разгаре, мы должны подумать о том, чтобы занять чью-то сторону."
  KMT_join_prc:0 "Присоединиться к [PRC.GetName]"
  KMT_join_prc_desc:0 "Гражданская война в Китае снова в самом разгаре, стоит определиться на чьей мы стороне"
  KMT_fuckem_all:0 "Уничтожить их всех"
  KMT_fuckem_all_desc:0 "Все воюющие стороны в текущей гражданской войне одинаково испорчены, мы уничтожим их всех и отвоюем Китай для себя!"
  KMT_retake_the_mainland:0 "Операция Национальная слава"
  KMT_retake_the_mainland_desc:0 "Несмотря на потерю материка, мы не должны терять волю к борьбе! Мы должны освободить наших братьев по ту сторону пролива от подлых коммунистов в один прекрасный день!"
  KMT_dcat_fate_of_collaborators:0 "Судьба коллаборационистов"
  KMT_dcat_fate_of_collaborators_desc:0 "Многие [Root.GetAdjective] граждане решили сотрудничать с нашими врагами, когда наша нация была на грани поражения. Однако Виктория на нашей стороне, а враги повержены. Пришло время для предателей предстать перед судом"
  KMT_deal_with_them_mission:0 "Решить судьбу коллаборационистов"
  KMT_deal_with_them_mission_desc:0 "Мы должны решить их судьбу как можно скорее. В противном случае наши люди будут недовольны нашей неэффективностью. Некоторые из них могут стать мстителями и нарушить общественный порядок."
  KMT_deal_with_them_purge:0 "Очистить от предателей"
  KMT_deal_with_them_purge_desc:0 "Святые могут быть достаточно милосердными, чтобы простить этих предателей, но мы не святые. Только ад ждет этих позорных подонков."
  KMT_deal_with_them_reorganise:0 "Поглотить их армию"
  KMT_deal_with_them_reorganise_desc:0 "Они, возможно, совершили государственную измену, но их армия все еще довольно сильная. Мы заставим их сражаться под нашим знаменем."
  KMT_deal_with_them_forgive:0 "Сотрудничать с коллаборационистами"
  KMT_deal_with_them_forgive_desc:0 "Знания и опыт, переданные нашим врагом коллаборационистам, довольно сильны. Мы сможем получить некоторые технологические или военные сведения, если будем сотрудничать с ними."
