  KMT_hand_over_cg_capital:0 "Запросить [KMT_central_gov_capital_state.GetName]"
  KMT_hand_over_cg_capital_desc:0 "Только с [KMT_central_gov_capital_state.GetName] в наших руках мы сможем осуществить наш план."
  KMT_new_peace_window:0 "Изменить военную политику предыдущего режима"
  KMT_new_peace_window_desc:0 "Предыдущий режим оставил нам разбираться с войнами и конфликтами. Если мы хотим выразить желание положить конец этой дорогостоящей политике, то сейчас или никогда."
