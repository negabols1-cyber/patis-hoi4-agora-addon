  KMT_retreat_to_wuhan:0 "Временная столица [859.GetName]"
  KMT_retreat_to_wuhan_desc:0 "Наш враг вторгается в [Root.Capital.GetName]. Мы должны перенести нашу администрацию в другое место, чтобы предотвратить захват наших чиновников и лидера. [859.GetName] находится недалеко от фронта и по-прежнему обладает высокой доступностью, что делает его идеальным кандидатом для временной столицы."
  KMT_retreat_to_chungking:0 "Временная столица [605.GetName]"
  KMT_retreat_to_chungking_desc:0 "[Root.Capital.GetName] сейчас находится под угрозой со стороны наших наступающих врагов. [605.GetName] был признан идеальным кандидатом на роль временной столицы благодаря защищающим его окрестностям и труднодоступности, что затруднит и удорожит захват нашей администрации врагом."
  KMT_the_hump:0 "Маршрут воздушного снабжения через Гималаи"
  KMTccw_break_negotiation:0 "Выход из переговоров"
  KMT_ccw_cease_fire:0 "Соглашение о перемирии"
  KMT_ccw_broken_negotiation:0 "Вышли из переговоров"
  KMTccw_negotiate_mission1:0 "Контроль над территориями коллаборационистов"
  KMTccw_negotiate_mission1_desc:0 "После сдачи коллаборационистов коммунисты попытались захватить часть отвоеванной земли. Это создаёт конфликты между ними и нашими войсками, посланными принять капитуляцию. Часть переговоров будет сосредоточена на урегулировании этого вопроса."
  KMTccw_negotiate_mission2:0 "Коалиционное правительство"
  KMTccw_negotiate_mission2_desc:0 "Медиатор находится под влиянием идеи коммунистов о коалиционном правительстве и настаивает, чтобы мы приложили усилия для воплощения её в жизнь."
  KMTccw_negotiate_mission3:0 "Перемирие"
  KMTccw_negotiate_mission3_desc:0 "Простое перемирие должно предотвратить вооруженные конфликты между нами и коммунистами в ближайшем будущем."
  KMTccw_negotiate_ceasefire:0 "Опосредование в китайской гражданской войне"
  KMTccw_negotiate_ceasefire_desc:0 "Китайцы вновь охвачены гражданской войной, мы могли бы вмешаться и попытаться добиться мирного урегулирования между враждующими группировками."
  KMTccw_negotiate_ceasefire2:0 "Предложить перемирие"
  KMTccw_negotiate_ceasefire2_desc:0 "Провал нашего предыдущего посредничества привел к возвращению открытого конфликта в китайской гражданской войне. Мы могли бы попытаться снова выступить посредниками и попытаться добиться перемирия."
  PRC_soviet_send_weapons_mission:0 "Советская помощь"
  PRC_soviet_send_weapons_mission_desc:0 "[SOV.GetNameDefCAP] отправляет нам помощь."
  PRC_liaoxi_campaign:0 "Ляо-Шэньская кампания"
  PRC_liaoxi_campaign_desc:0 "Маньчжурия — наиболее развитый район Китая, мы должны вытеснить наших врагов из столицы региона. Чтобы лишить их ресурсов и получить к ним доступ."
  PRC_huaihai_campaign:0 "Хуайхайская кампания"
  PRC_huaihai_campaign_desc:0 "Железнодорожный узел у [This.Get11973] является важным стратегическим пунктом. Если мы возьмем его под контроль, то сможем угрожать нашему врагу к югу от реки Янцзы."
  PRC_pingtsin_campaign:0 "Пинцзиньская кампания"
  PRC_pingtsin_campaign_desc:0 "Город [608.GetName] — стратегически важный пункт в Северном Китае. Его захват станет необходимым условием для нашего продвижения на юг."
  PRC_retreat_from_yenan:0 "Отступление из [622.GetName]"
  PRC_retreat_from_yenan_desc:0 "На протяжении значительного времени [622.GetName] являлся нашей штаб-квартирой, но из-за расположения мы оказались в окружении врага. Мы не можем допустить, чтобы [Root.GetLeader] попал в плен."
  ## 16/01/2022 ##
  KMT_dcat_war_of_resistance:0 "Война сопротивления"
  KMT_dcat_war_of_resistance_desc:0 "После вторжения на Северо-Восток японцы не смогли обуздать свою неутолимую жажду крови и возобновили свою жестокую кампанию против китайской нации. Центральная равнина в опасности, а будущее Китая под угрозой.\n\nЧтобы обеспечить выживание нации, мы должны обеспечить нашу окончательную победу всеми необходимыми средствами."
  KMT_supreme_council_of_national_defence:0 "Высший совет национальной обороны"
  KMT_supreme_council_of_national_defence_desc:0 "Чтобы лучше координировать всех участников Войны сопротивления, власть Совета национальной обороны будет расширена и будет охватывать множество других областей."
  KMT_huayuankou:0 "Прорвать дамбу на реке Хуанхэ"
  KMT_huayuankou_desc:0 "Наши враги приближаются к Ченгсяню. Эта важная дорожная развязка не может попасть в руки врага. Для вышеупомянутой цели рассматривается возможность прорыва дамбы на реке Хуанхэ возле уезда, чтобы задержать и замедлить врага."
  KMT_rail_to_kweiyang:0 "Железная дорога в Гуйян"
  KMT_rail_to_kweiyang_desc:0 "После отступления на юго-запад возникли проблемы с логистикой на фронте. Поскольку мы отрезаны от самой богатой и обладающей наибольшими ресурсами части Китая, стало довольно сложно снабжать наши войска в этом регионе. Для облегчения снабжения наших войск на юго-западе предложено построить новую железную дорогу из Чунцина в Гуйян."
  KMT_forced_conscription:0 "Принудительный призыв"
  KMT_forced_conscription_desc:0 "По мере затягивания войны потеря боеспособных мужчин начинает сказываться. Восполнение состава солдат на передовой становится все более сложным, поскольку мы теряем обученных людей с пугающей скоростью. Хотя принудительный призыв официально карается, в конечном счете такая мера может оказаться необходимой для выживания нашей нации."
  KMT_improve_chungking_anti_air:0 "Подготовка [605.GetName] к авиаударам"
  KMT_improve_chungking_anti_air_desc:0 "Попасть на суше в Сычуаньский бассейн — непростая задача, особенно когда его удерживают вражеские силы. Основываясь на этом, можно с уверенностью предположить, что наш враг предпримет воздушные атаки на Чунцин, чтобы эффективнее сломить наш дух. Мы должны быть готовы противостоять таким попыткам нашего врага."
  KMT_prepare_for_battle_of_shanghai:0 "Подготовка к битве за Шанхай"
  KMT_prepare_for_battle_of_shanghai_desc:0 "Японцы обосновались в Шанхае ещё с первых дней существования Республики. Располагая своим районом в Международном сеттльменте, японцы получили полномочия по управлению районом Хункоу через строительство дорог, выходящих за пределы сеттльмента. Это позволило им разместить в районе значительный гарнизон.\n\nС обострением конфликта на севере все наши высокопоставленные офицеры соглашаются, что в конце концов японцы воспользуются своей базой в Шанхае для наступления. Мы должны взять на себя инициативу по противостоянию и устранению этой угрозы до того, как они нападут первыми."
  KMT_defence_of_shanghai_mission:0 "Битва за Шанхай"
  KMT_defence_of_shanghai_mission_desc:0 "Мы покажем японцам силу и волю китайского народа!"
  ## 07/03/2022 ##
  KMT_trautmann_chi_demands:0 "\n\nТекущие требования Китая:\n     -Отмена японских \"марионеток\" во Внутренней Монголии, не находящихся под управлением Маньчжоу-го и Китая."
  KMT_trautmann_inner_mogolia_autonomy:0 "     -Автономия Внутренней Монголии\n        (§C§H[746.GetName]§!, §H[621.GetName]§!, §H[845.GetName]§!, §H[611.GetName]§!, §H[612.GetName]§!, и §H[862.GetName]§! будут принадлежать §H[MEN.GetName]§!. Если §H[MEN.GetName]§! не является субъектом ни §H[KMT_central_gov_tag.GetName]§!, ни §H[JAP.GetName]§!, вышеупомянутые государства попадут под контроль §H[JAP.GetName]§! вместо него.§!)\n"
  KMT_chi_raise_terms:0 "Предложить встречное предложение"
  KMT_chi_raise_terms_desc:0 "Наша блестящая победа в битве за Шанхай дала нам небольшое преимущество в продолжающихся переговорах. Мы можем использовать это для того, чтобы сделать условия менее возмутительными."
  KMT_influence_info_613_desc:0 "-------------------------------------------------------\n§WПоддержка §H[613.GetName]§! Обзор:\n§H[CHI.GetName]§!: §H [?613.KMT_pop_support@CHI]§!\n§H[GXC.GetName]§!: §H [?613.KMT_pop_support@GXC]§!\n§H[YUT.GetName]§!: §H [?613.KMT_pop_support@YUT]§!\n§H[YUN.GetName]§!: §H [?613.KMT_pop_support@YUN]§!\n§H[SKC.GetName]§!: §H [?613.KMT_pop_support@SKC]§!\n§H[SCC.GetName]§!: §H [?SCC.KMT_pop_support@YUT]§!\n§H[XSM.GetName]§!: §H [?613.KMT_pop_support@XSM]§!\n§H[SHX.GetName]§!: §H [?613.KMT_pop_support@SHX]§!\n§H[SDC.GetName]§!: §H [?613.KMT_pop_support@SDC]§!\n§H[ZXL.GetName]§!: §H [?613.KMT_pop_support@ZXL]§!\n§H[XIA.GetName]§!: §H [?613.KMT_pop_support@XIA]§!\n§H[QIA.GetName]§!: §H [?613.KMT_pop_support@QIA]§!\n§H[SIK.GetName]§!: §H [?613.KMT_pop_support@SIK]§!\n§H[MEN.GetName]§!: §H [?613.KMT_pop_support@MEN]§!\n§H[PGR.GetName]§!: §H [?613.KMT_pop_support@PGR]§!\n§!"
