  KMT_ps_cg_modifier:0 "§HCентральное правительство§!\n----------------\nВ настоящее время кликой, ведущей Центральное правительство, является §H[KMT_central_gov_tag.GetRulingParty]§!, а национальным лидером является §H[KMT_central_gov_tag.GetLeader]§!.[This.GetCoreBonus]"
  KMT_ps_cg_modifiers_enabled:0 "\n\n§HCентральное правительство получает следующие преимущества от регионов, которые они включили в ядро в пределах Большого Китая§!:\n  Стабильность: [?global.KMT_ps_cg_stability_bonus|+%=]\n  Рост политической власти: [?global.KMT_ps_cg_ppfactor_bonus|+%=]"
  KMT_ps_warlords_modifier:0 "§HРегиональные силы§!\n----------------\nРегиональные силы будут препятствовать управлению центрального правительства.\n\n§HВ настоящий момент, наличие региональных сил дает центральному правительству следующие модификаторы:§!\n  Стоимость политической власти: [?global.KMT_warlord_pp_cost_mod|=-]\n  Стабильность: [?global.KMT_warlord_stability_mod|=%+]\n  Модификатор стабильности штрафов к оборонительной войне: [?global.KMT_warlord_defensive_stab_mod|%+]\n  Коэффициент мобилизуемого населения: [?global.KMT_warlord_conscription_factor_mod|%=+]\n\nРегиональные силы, у которых нет национального духа §RКоммунистические бандиты§! имеют следующий модификатор:\n  [!KMT_ps_warlords_modifiers_click]"
  ## 18/02/2020 ##
  KMT_dcat_inalienable_parts_tt:0 "§HРелион Большой Китай§!"
  KMT_dcat_inalienable_parts_tt_delayed:0 "[This.GetDisabledMechanicTT]"
  KMT_useful:0 "Штаты светло-серого цвета, представляют штаты, являющиеся ядром для текущего центрального правительства.\n\nЕсли некоторые области аннулируются текущим центральным правительством (то есть они больше не считаются «неотъемлемой частью Китая»), штаты в этой области не будут отображаться, но границы останутся.\n\n§GВы можете сделать штаты ядром, которые они считают неотъемлемыми частями Китая, с помощью кнопки в выбранном интерфейсе штата.§!\n\n§RНаличие 0 влияния в штатах, которыми вы не владеете и не контролируете, приведет к удалению вашего ядра из этого штата.§!"
  KMT_break_free_from_cg:0 "Освободитесь от центрального правительства"
  KMT_break_free_from_cg_desc:0 "Мы достаточно натерпелись под железным сапогом [KMT_central_gov_tag.GetLeader] и [KMT_central_gov_tag.GetRulingParty], настало время для нас обрести заслуженную автономию."
  KMT_ps_atleast_loyal_tt:0 "Ваш уровень лояльности - как минимум §GLoyal§!(§G1§!)"
  KMT_ps_suppress_loyalists:0 "Подавить лоялистов"
  KMT_ps_suppress_loyalists_desc:0 "Лояльные к центральному правительству только подвергнут опасности наше правление, им нельзя позволять закрепляться в НАШЕМ правительстве!"
  KMT_men_join_jap:0 "Присоединиться к [JAP.GetName]"
