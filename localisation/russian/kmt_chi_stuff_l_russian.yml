  KMT_EFFICIENT_INTEGRATION:0 "Эффективная интеграция"
  KMT_FACTIONS_IN_ARMY_DESTROYED:0 "Во фракциях в армии уничтожены"
  KMT_MILITIAS_DISBANDED:0 "Ополчение расформировано"
  KMT_EFFICIENT_INTEGRATION_DESC:0 "Плавная и эффективная интеграция сил военачальника дает нам больший контроль над армией и более быстрое принятие решений."
  KMT_FACTIONS_IN_ARMY_DESTROYED_DESC:0 "Раньше в нашей армии были фракции, которые затрудняли координацию между различными силами. Теперь эта ситуация больше не существует, и наши силы могут вновь проводить хорошо спланированные и хорошо скоординированные операции."
  KMT_MILITIAS_DISBANDED_DESC:0 "Слабо организованные отряды ополчения, появившиеся во время революции против старого режима, были расформированы. Теперь общая боевая мощь наших войск возросла."
  KMT_FOCUS_ON_CENTRAL_ARMY_IDEA:0 "Сосредоточиться на Центральной армии"
  KMT_FACTIONALISM_ENCOURAGED:0 "Фракционализм поощряется"
  KMT_MILITIA_STORMTROOPERS:0 "Милиция-штурмовики"
  KMT_FOCUS_ON_CENTRAL_ARMY_IDEA_DESC:0 "Войска военачальников слишком плохо оснащены и недисциплинированы. Мы должны больше полагаться на нашу Центральную армию, а не на их, чтобы не тратить важные средства."
  KMT_FACTIONALISM_ENCOURAGED_DESC:0 "Хотя фракционализм в нашей армии препятствует проведению хорошо скоординированных операций, солдаты каждой клики будут яростнее сражаться на поле боя, чтобы получить обещанные выгодные награды."
  KMT_MILITIA_STORMTROOPERS_DESC:0 "Ниже среднего боевые способности ополчения делают их непригодными для самостоятельных действий. Однако выступая в качестве штурмовиков первой линии, они могут помочь нам истощить врага, прежде чем наши регулярные войска вступят в бой и нанесут последний удар."
  KMT_WARLORD_ARMIES:0 "Армии военачальников"
  KMT_FACTIONS_WITHIN_THE_ARMY:0 "Фракции в армии"
  KMT_MILITIAS:0 "Ополчение"
  KMT_WARLORD_ARMIES_DESC:0 "Хотя армии военачальников были интегрированы в нашу, очевидно, что они лояльны только своему господину."
  KMT_FACTIONS_WITHIN_THE_ARMY_DESC:0 "Влиятельные лица в армии создают группировки, чтобы укрепить свои позиции. Хотя они не представляют угрозы для нашего правления, конфликты между группировками привели к трудностям в координации военных операций."
  KMT_MILITIAS_DESC:0 "Местные фермеры и рабочие сформировали группы ополченцев, чтобы помочь нашему делу. Однако эти подразделения обладают лишь небольшими боевыми возможностями, а иногда даже вызывают конфликты с нашими регулярными войсками."
