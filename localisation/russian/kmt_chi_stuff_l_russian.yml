  KMT_entrust_the_white_group:0 "Привлечь Белую Группу"
  KMT_entrust_the_white_group_desc:0 "Белая Группа состоит из японских офицеров, сдавшихся нашему правительству. Им предлагают служить в нашей армии в качестве советников в обмен на освобождение от наказания."
  KMT_train_mountaineers:0 "Подготовить горцев"
  KMT_train_mountaineers_desc:0 "Горная местность внутренней части Фуцзяня дает нам отличные оборонительные позиции для защиты наших плацдармов. Мы должны обучить наши войска умению вести боевые действия в таких условиях."
  KMT_train_paratroopers:0 "Подготовить парашютистов"
  KMT_train_paratroopers_desc:0 "Мы должны пересечь Тайваньский пролив, чтобы достичь материка и разгромить бандитов. Мы должны рассмотреть возможность развертывания парашютистов для обеспечения безопасности ключевых позиций, благоприятных для наших основных сил вторжения."
  KMT_train_marine:0 "Подготовить морских пехотинцев"
  KMT_train_marine_desc:0 "Наше нынешнее положение позволяет осуществлять десантные атаки - это единственный способ для нас провести крупномасштабное вторжение на материк. Мы не должны оступиться в ходе создания вторженческих сил, чтобы закрепиться на материке."
