  ## 03/01/2020 ##
  KMT_dcat_central_government_desc:0 "После смены северо-восточного флага Китай формально объединён. Однако различные группировки по-прежнему обладают высокой степенью автономии в своих владениях. Некоторые даже пытаются сопротивляться влиянию центрального правительства на своей территории. Такая внутренняя раздробленность проявляется в том, что некоторые провинции отказывают центральному правительству в доступе к своей территории, даже когда это необходимо для выслеживания и ликвидации коммунистических бандитов во время пятой окружной кампании.\n\nБольшинство милитаристов и группировок надеется сохранить статус-кво и удержать свои территории, но кто знает, не попытается ли кто-нибудь из них добиться национального лидерства.\n\n"
  KMT_dcat_central_government_nomaps_desc:0 "После инцидента с перестановкой флагов на северо-востоке Китай был формально объединен. Однако различные клики военачальников все еще сохраняют высокую степень автономии в своих владениях. Некоторые даже пытаются сопротивляться любым проявлениям влияния центрального правительства на своей территории. Этот внутренний раскол очевиден в отказе нескольких провинций предоставить доступ к вооруженным силам центрального правительства, даже для целей выслеживания и уничтожения беглых бандитов-коммунистов во время пятой кампании окружения.\n\nБольшинство военачальников и клик надеется сохранить статус-кво и удержать свои территории, но кто знает, не предпримет ли кто-нибудь из них попытку захватить власть на национальном уровне.\n\n"
  KMT_ps_tips:0 "В настоящее время вы израсходовали [?Root.KMT_ps_ip_spent|-0] из своих [?Root.KMT_ps_available_ip_max|+0] общих Очков влияния.   \n========================================\nКаждый действительный участник борьбы за власть всегда имеет §Hбазовое количество Очков влияния§! ( §H §G4§! для Центрального правительства и §G1§! для региональных держав§! ) и получает по §H1 дополнительному Очку влияния за каждые 10% стабильности свыше 30%§!. \n\nПри наличии национального духа §RКоммунистические бандиты§! использование очков влияния запрещено, но каждое контролируемое государство будет пассивно увеличивать общественную поддержку без необходимости выделения очков влияния. Наличие ячейки партизан в государствах приведет к дополнительному росту общественной поддержки в этом государстве. \n\n§H Очки влияния можно назначить государствам, чтобы §Hускорить рост вашей поддержки§! там. \n§HЦентральное правительство§! также может использовать Очки влияния, чтобы §Hповысить лояльность военачальника§!. \nДля §Hвоеначальников§! §Hподдержание альянса будет стоить 1 очко влияния§!. \n\n[This.GetInfluenceStateAmt][This.GetInfluenceLoyaltyAmt][This.GetInfluenceAllianceAmt]"
  ## 23/01/2020 ##
  KMT_dcat_chinese_focus:0 "Внутренняя стабильность"
  KMT_switch_focus_to_internal_stability:0 "Сосредоточиться на внутренней стабильности"
  KMT_switch_focus_to_internal_stability_desc:0 "В связи с неожиданным исчезновением внешней угрозы, мы теперь можем сосредоточиться на внутренней стабильности."
  KMT_the_next_offensive_mission:0 "Следующее наступление"
  KMT_the_next_offensive_mission_desc:0 "Согласно приказу Центрального правительства, мы должны вскоре начать еще одну наступательную операцию против коммунистов. Мы не в том положении, чтобы ослушаться такого приказа, если только у Центрального правительства не возникнет другой неотложной проблемы."
  KMT_dcat_skirmishes_with_commies:0 "Перестрелки с коммунистами"
  KMT_dcat_skirmishes_with_commies_desc:0 "Центральное правительство назначило нас основной силой по "истреблению бандитов". От нас ожидают, что мы полностью и быстро уничтожим остатки Красной армии КПК после их разрушительного "Похода на Запад". Однако мы сильно недооценили этих коммунистических бандитов, и результатом стало наше сокрушительное поражение почти в каждой стычке с ними.\n\nТеперь у наших людей низкий моральный дух, и они не хотят сражаться, но Центральное правительство все еще заставляет нас совершать нападения на территории коммунистических бандитов."
  KMT_seek_ceasefire_with_commie:0 "Прекращение огня с коммунистами"
  KMT_seek_ceasefire_with_commie_desc:0 "Теперь, когда мы получили свободу принимать собственные решения, мы вполне можем воспользоваться этой возможностью, чтобы добиться прекращения огня с коммунистами."
  KMT_all_out_assault:0 "Финальный штурм"
  KMT_all_out_assault_desc:0 "[KMT_central_gov_tag.GetLeader] лично прибыл в [Root.Capital.GetName], чтобы контролировать наши усилия по истреблению бандитов. Также было выдвинуто требование о полномасштабном наступлении на коммунистических бандитов. От этого приказа нет спасения, если только..."
  KMT_arrest_chiang:0 "Удерживать [KMT_central_gov_tag.GetLeader] в качестве заложника"
  KMT_arrest_chiang_desc:0 "Приоритет [KMT_central_gov_tag.GetLeader] в области внутренней стабильности станет гибелью для Китая. Однако его убийство приведет к той же ситуации, что и после смерти Юань Шикая, когда региональная власть снова ввергнет Китай в крупномасштабную гражданскую войну. В свете этого лучше держать его в качестве заложника и требовать изменения курса Центрального правительства."
  KMT_assasinatte_chiang:0 "Убить [KMT_central_gov_tag.GetLeader]"
  KMT_assasinatte_chiang_desc:0 "Только смерть [KMT_central_gov_tag.GetLeader] может принести перемены, необходимые Китаю для выживания в грядущей буре. Мы сделаем то, что необходимо."
  KMT_dcat_xian_incident:0 "Переговоры по Сианьскому инциденту"
  KMT_dcat_xian_incident_desc:0 "Чан Кайши был взят в заложники [ZXL.GetNameDef], чтобы заставить Центральное правительство в первую очередь противостоять внешней угрозе. Между Центральным правительством и [ZXL.GetNameDef] ведутся переговоры.\n\n        @CHI[KMT_central_gov_tag.GetName]:\n[This.GetCGDemands][This.GetCGDemands2]\n\n        @ZXL[ZXL.GetName]:\n[This.GetZXLemands][This.GetZXLemands2]\n\n        @CHI[KMT_central_gov_tag.GetName]:[This.GetCGSignedStatus]\n        @ZXL[ZXL.GetName]:[This.GetZXLSignedStatus]\n\n"
  KMTStopAllCivilWars:0 "              - Прекратит все гражданские войны в стране\n"
  KMTNoProsecution:0 "              - Не преследовать персонал [ZXL.GetName], замешанный в текущем инциденте\n"
  KMTReleaseCKS:0 "              - Освободить Чан Кайши из плена\n"
  KMTSubmission:0 "              - Немедленно подчиниться центральному правительству и реорганизоваться в рамках его армии\n"
  KMT_xian_incident_negotiate_mission:0 "Недовольство в [ZXL.GetName]"
  KMT_xian_incident_negotiate_mission_desc:0 "По мере затягивания переговоров солдаты и генералы все больше теряют терпение. Ясно, что когда оно иссякнет, они либо принудят [ZXL.GetLeader] казнить Чан Кайши, либо сделают это сами. В любом случае последствия будут ужасными."
  KMT_dcat_liangguang_incident:0 "Инцидент с Лянгуаном"
  KMT_dcat_liangguang_incident_desc:0 "Южные военачальники всегда выступали против центрального правительства. Сейчас нам представилась возможность устранить [YUT.GetName]."
  #KMT_attend_hhm_funeral_mission:0 "Похороны Ху Ханьмина"
  #KMT_attend_hhm_funeral_mission_desc:0 "Ху Ханьмин, одна из самых авторитетных фигур в республике, недавно скончался. Если мы не явимся на его похороны, это может быть воспринято как неуважение к этому человеку и республике."
  #KMT_attend_hhm_funeral:0 "Присутствовать на похоронах Ху Ханьмина"
