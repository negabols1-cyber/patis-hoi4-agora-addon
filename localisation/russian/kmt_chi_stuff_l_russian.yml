  KMT_dcat_integrate_the_communists_desc:0 "Несмотря на присягнувших на верность коммунистов к [Root.GetRulingParty], им, в ответ, была предоставлена широкая автономия. Однако многие высокопоставленные должностные лица по-прежнему считают коммунистическую администрацию бомбой замедленного действия, которую необходимо обезвредить до того, как она взорвется."
  KMT_incorporate_communist_generals:0 "Привлечение коммунистических генералов"
  KMT_incorporate_communist_generals_desc:0 "Мы можем предложить генералам-коммунистам лучшее место в нашей армии и привлечь их на свою сторону. Это наверняка ослабит красных."
  KMT_incorporate_communist_talents:0 "Ограничение коммунистических администраторов"
  KMT_incorporate_communist_talents_desc:0 "Мы можем предложить некоторым политикам-коммунистам или администраторам в этом регионе достойное место в нашем правительстве. Это ослабит их координацию и возможность организовать восстание."
  KMT_replace_local_officials:0 "Замена местных чиновников"
  KMT_replace_local_officials_desc:0 "Теперь, когда все улажено, мы можем заменить местных чиновников своими людьми и положить конец незаслуженной автономии коммунистов, которую мы по ошибке им предоставили."
  KMT_use_postal_romanisation_tt:0 "Использовать почтовую романизацию для названий в Китае"
