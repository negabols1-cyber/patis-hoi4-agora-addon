  KMT_dcat_trautmann_mediation:0 "Медиация Траутманна"
  KMT_dcat_trautmann_mediation_desc:0 "Германия приняла запрос Японии о посредничестве в текущем конфликте между Японией и Китаем. Если это удастся, затяжной войны можно будет избежать, что на данный момент, кажется, соответствует интересам обеих сторон.\n\nТекущие требования Японии:\n[global.GetIMAutonomyTT]     -Демилитаризовать §H[608.GetName]§! и все штаты, граничащие с §H[MCK.GetName]§! и §H[JAP.GetName]§!\n     -Расширить демилитаризованную зону в Шанхае\n        (§C§HШанхай§! будет принадлежать §H[JAP.GetName]§! и на самом деле не будет демилитаризован.§!)\n     -Прекратить анти-японскую деятельность и сотрудничать в антикоммунистических делах\n     -Снизить тариф на японские товары\n     -Уважать экстерриториальность иностранцев[This.GetJAPTrautmannDemands][This.GetCHITrautmannDemands]"
  KMT_trautmann_harsher_jap_demands:0 "\n     -Дипломатическое признание §H[MCK.GetName]§!\n        (§CКаждый штат, принадлежащий §H[MCK.GetName]§!, больше не будет считаться нами неотчуждаемой частью и потеряет наши ядра.§!)\n     -Предоставить §H[JAP.GetNameDef]§! военный доступ и права на швартовку\n     -Репарации §H[JAP.GetNameDef]§!"
  KMT_trautmann_mediation_mission:0 "Срок для ответа Китая"
  KMT_trautmann_fail_flag:0 "Посредничество Траутманна провалилось"
  KMT_trautmann_success_flag:0 "Посредничество Траутманна увенчалось успехом"
  KMT_mediation_from_germany:0 "Запросить посредничество у [GER.GetName]"
  KMT_mediation_from_germany_desc:0 "Некоторые в правительстве и в армии на данный момент выступают против идеи полномасштабной войны с Китаем. Поскольку затяжная война не в интересах Империи, мы могли бы попросить о помощи наших друзей в Европе."
  KMT_jap_raise_terms1:0 "Предложить более жесткие условия"
  KMT_jap_raise_terms1_desc:0 "Текущие условия были признаны слишком мягкими с учетом последних изменений обстоятельств."
  KMT_china_accept:0 "Принять требования Японии"
  KMT_china_accept_desc:0 "Хотя это и унизительно, мы должны выиграть время для искоренения коммунистов.\n\nПередача наших сообщений займет некоторое время."
  KMT_withdraw_from_negotiation:0 "Выйти из переговоров"
  KMT_withdraw_from_negotiation_desc:0 "Посредническая работа никуда не годится, мы больше не будем тратить время."
  KMT_trautmann_mediation_flag:0 "Посредничество Траутмана ведется."
  KMT_no_more_trautmann_peace:0 "Отменить Токийский договор"
