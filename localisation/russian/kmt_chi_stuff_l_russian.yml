  KMT_dcat_corruption:0 "Коррупция в правительстве"
  KMT_dcat_corruption_desc:0 "Коррумпированные и влиятельные лица в нашем правительстве, особенно "Четыре семьи", оставили нашу экономику в весьма плачевном состоянии"
  KMT_corruption_investigate_tvsoong:0 "Расследовать Соун Цзывэня"
  KMT_corruption_investigate_tvsoong_desc:0 "Соун Цзывэнь, эксперт в области финансов и член семейства Сун, одной из "Четырех семей", давно прослыл нахалом и карьеристом. Очень вероятно, что он скопил для себя значительное богатство. Однако, в силу принадлежности к "Четырем семьям" и того, что он является братом Сун Мэйлин, расследование в отношении него будет сопряжено с множеством препятствий."
  KMT_corruption_investigate_hhkung:0 "Расследовать Кун Сянси"
  KMT_corruption_investigate_hhkung_desc:0 "Кун Сянси, один из толкачей за Фиатную валюту, продемонстрировал огромное желание накопить личное богатство, используя свою должность исполнительного директора центрального банка. Это значительно снизило бы уровень коррупции в нашей стране, если бы мы смогли отстранить его от власти, но то, что он из семьи Кун, одной из \"четырех семей\", усложняет дело.
  KMT_root_out_corruption:0 "Война с коррупцией"
  KMT_root_out_corruption_desc:0 "После того, как Сун Цзывэнь и Кун Сисян были смещены с высоких постов, со всеми остальными коррумпированными чиновниками стало гораздо легче иметь дело. Используя эту ситуацию в качестве возможности, мы могли бы искоренить серьезную коррупцию в нашем правительстве."
  KMT_useless_now:0 "§Так как вы отключили механизм борьбы за власть, этот интерфейс вообще не предоставляет никакой информации§!\n"
