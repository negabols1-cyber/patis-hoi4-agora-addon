USA_war_production_board_ns:0 "Совет военного производства"
USA_war_production_board_ns_desc:0 "Созданный указом № 9024, Совет военного производства получил верховную власть направлять промышленную мощь страны на нужды войны. Запретив несущественное гражданское производство и внедрив План контролируемых материалов, мы превратили американскую промышленность в «Арсенал демократии». Отныне прибыль вторична по отношению к производству; Детройт больше не строит автомобили — он куёт победу."
