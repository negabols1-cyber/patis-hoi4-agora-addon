USA_far_left_suppression_desc:0 "События, приведшие к «Красной угрозе» 1920-х годов, оставили неизгладимый след в сознании сотрудников правоохранительных органов и американской общественности. Это привело к преследованию и судебному давлению на ультралевые движения по всей территории Соединённых Штатов."
