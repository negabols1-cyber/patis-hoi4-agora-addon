usa_nato_tech_sharing_name:0 "Программа стандартизации НАТО"
usa_nato_tech_sharing_desc:0 "Альянс настолько же силён, насколько сильны его линии снабжения. Если голландский солдат не может стрелять британскими патронами из американской винтовки — мы не единая сила, а разобщённая толпа. Учредив Программу стандартизации НАТО, мы приведём наши военные спецификации к единому знаменателю — от радиочастот до танковых траков, — гарантируя, что наша промышленность учится друг у друга, а наши армии сражаются как одно целое."
