NATO_military_assistance:0 "Объединённые военные миссии НАТО"
NATO_military_assistance_desc:0 "Нашим союзникам нужны не просто обещания; им нужна сталь, подготовка и лидерство. Через эти миссии мы направим американских советников и технику для модернизации армий Свободного мира, превращая их в грозный оплот против коммунизма."
USA_incirlik_air_base:0 "Строительство авиабазы «Инджирлик»"
USA_incirlik_air_base_desc:0 "Нам нужна передовая база, способная принимать стратегические бомбардировщики в пределах удара от бакинских нефтепромыслов и советской промышленности. Мы построим огромный авиационный комплекс близ Аданы в Турции, который станет непотопляемым авианосцем на Ближнем Востоке."
USA_mission_jammat:0 "Учреждение JAMMAT"
USA_mission_jammat_desc:0 "Турецкая армия многочисленна, но испытывает недостаток в современном оснащении и доктрине. Создав Объединённую американскую военную миссию помощи Турции, мы модернизируем её командную структуру и укрепим Босфор."
USA_integrate_bundeswehr:0 "Перевооружение ФРГ"
USA_integrate_bundeswehr_desc:0 "Оборона Европы невозможна без немецкой живой силы. Несмотря на тени прошлого, мы должны интегрировать Федеративную Республику в НАТО. Мы профинансируем создание Бундесвера, оснастив его современными танками, чтобы он стал остриём Центральной группы армий НАТО."
USA_setaf_mission:0 "Учреждение миссии SETAF"
USA_setaf_mission_desc:0 "Горицийский коридор — это ворота на Апеннинский полуостров. Южная оперативная группа НАТО (SETAF) обеспечит постоянное американское присутствие в Виченце, укрепив Альпы и обучив итальянскую армию держать оборону против любого вторжения югославских или советских войск."
USA_ramstein_base:0 "Расширение авиабазы «Рамштайн»"
USA_ramstein_base_desc:0 "НАТО нужен центральный логистический узел в Европе. Расширение Рамштайна до крупного авиационного и снабженческого центра гарантирует, что американские подкрепления смогут быть быстро переброшены на любой участок германского фронта."
ITA_setaf_mission_ns:0 "Доктрина альпийской обороны"
