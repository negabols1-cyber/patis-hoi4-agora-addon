USA_FDR_desc:0 "Франклин Делано Рузвельт был президентом Соединённых Штатов Америки. Он был избран в 1933 году. 32-й президент Соединённых Штатов Америки.\nОн боролся с Великой депрессией. Она всё ещё продолжается.\nИзвестен своей антивоенной и антигерманской позицией."

