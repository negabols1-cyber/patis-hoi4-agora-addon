l_russian:
  agr_SIK_bring_kashgar_back_into_the_fold:0 "Возвращение Кашгара в состав государства"
  agr_SIK_bring_kashgar_back_into_the_fold_desc:0 "Мы устали от шарлатанства [TNG.getleader]. Мы позволили ему захватить слишком много контроля над Кашгарским военным округом, и пришло время раз и навсегда решить эту проблему.\n\n§RЕсли мы отправим [TNG.getleader] ультиматум до того, как [SOV.getnamedef] возьмет на себя обязательство поддержать [SIK.getleader], [SOV.getnamedef] не окажет нам помощи в войне с [TNG.getname].§!"

  SIK_caught_off_gruad:0 "Застигли врага врасплох"
  SIK_caught_off_gruad_desc:0 "[TNG.GetName] был застигнут врасплох нашими недавними требованиями и вмешательством, и поэтому сейчас мы одерживаем верх."
  TNG_caught_off_gruad:0 "Застигнут врасплох"

  sik.1.t:0 "[SIK.getleader] требует прямого контроля над Кашгарским военным округом"
  sik.1.desc:0 "Похоже, что недавние политические победы [SIK.getleader] воодушевили его. Он чувствует, что имеет право и обязанность управлять всеми регионами Синьцзяна, включая находящийся под нашим контролем Кашгарский военный округ. Хотя такой шаг является лишь попыткой подорвать и лишить власти [TNG.GetLeader], человека, которого [SIK.GetLeader] рассматривает как соперника своей власти в регионе. Как нам реагировать на такое необоснованное требование?"
  sik.1.a:0 "Сплотить народ и выступить против вероломного [SIK.GetLeader]!"
  sik.1.b:0 "У нас нет выбора, кроме как уступить..."
  sik.2.t:0 "[TNG.getleader] призывает войска сопротивляться нашим требованиям!"
  sik.2.desc:0 "[TNG.getleader] отреагировал на наши требования, мобилизовав находящиеся под его командованием войска и готовясь к бою. Это восстановление его контроля над регионом и прямое оскорбление для [SIK.getleader]. Это требует скорой и решительной реакции!"
  sik.2.a:0 "Немедленно вступить в бой и нанести удар!"
  sik.2.b:0 "Давайте выиграем время..."
  sik.3.t:0 "[TNG.getleader] уступает!"
  sik.3.desc:0 "Столкнувшись с боем, который он не мог выиграть, [TNG.getleader] передал контроль над Кашгарским военным округом и свои войска [SIK.getleader]. Это значительно укрепит наши позиции в Синьцзянском регионе и в Китае в целом!"
  sik.3.a:0 "Великая победа!"
  sik.4.t:0 "[SIK.getleader] отступает!"
  sik.4.desc:0 "Не желая ввязываться в бой с [TNG.getleader], армии под командованием [SIK.getleader] отозвали свои требования о контроле над Кашгарским военным округом. Это великая победа для народа Кашгара! Это еще больше укрепляет наш контроль над нашей землей и Кашгарским регионом."
  sik.4.a:0 "Великая победа!"
  SIK_TNG_REBELS_tt:0 "В Кашгаре появляется тюркское повстанческое подразделение"