  SOV_solidify_the_provisional_government_tt:0 "§YАлександр Керенский§! возвращается из изгнания."
  SOV_operation_red_tt:0 "Маленькая группа агентов отправится в деревню Николая, чтобы спасти его."
  operation_rescue_nicholas:0 "Напасть на деревню Николая"
  operation_rescue_nicholas_desc:0 "Человек, заявляющий, что он Николай, долгое время жил в деревне. Мы можем отправить небольшую команду в эту деревню, чтобы провести операцию, вернуть человека в страну и проверить, правда ли то, что он сказал."
  operation_rescue_nicholas_outcome:0 "Команда проникла в деревню, похитила его и бесшумно переправила через границу."
  soviet_tsar.1.t:1 "[FROM.GetNameDefCap] подчиняется"
  soviet_tsar.1.d:1 "[FROM.GetNameDef] неохотно согласился присоединиться к нашей империи в противостоянии растущей мощи [GER.GetNameDef]. С этим предлогом пришло время присоединять к нашей империи другие страны и возрождать наши былое величие!"
  soviet_tsar.1.a:0 "Добро пожаловать обратно."
  soviet_tsar.2.t:1 "[FROM.GetNameDefCap] отвергает наше предложение"
  soviet_tsar.2.d:1 "[FROM.GetNameDefCap] явно сошли с ума и умышленно разрушают свою страну, а идиоты в их правительстве не дают нашим войскам прохода через их территорию. Думают, что немцы будут для них лучше? Эти эгоистичные правители совершают преступление против своего народа, лишая его настоящего порядка."
  soviet_tsar.2.a:1 "[FROM.GetAdjective] народ уже настрадался."
  NSB_soviet_fascist_tsarist.34.t:0 "Отряд спас подозрительного мужчину"
  NSB_soviet_fascist_tsarist.34.desc:0 "Отряду удалось спасти мужчину, утверждающего, что он Николай, из его убежища и доставить в нашу страну. Наши расследования подтверждают, что он может быть Николаем, но мы не совсем уверены в этом. Следует ли нам посадить этого человека на трон?"
  NSB_soviet_fascist_tsarist.34.a:0 "Продолжить"
  NSB_soviet_fascist_tsarist.35.t:0 "Найден подозрительный старик"
  NSB_soviet_fascist_tsarist.35.desc:0 "Мужчина, живущий в небольшой деревне в Польше, утверждает, что он Николай. Он говорит, что ему удалось сбежать от казни и укрыться здесь. Внешне он очень похож на Николая, но до этого года все были уверены в его смерти. Как это возможно?"
  NSB_soviet_fascist_tsarist.35.a:0 "Следовать за ним"
  NSB_soviet_fascist_tsarist.35.b:0 "Не обращать внимания"
  NSB_soviet_fascist_tsarist.36.t:0 "Романов в Польше"
  NSB_soviet_fascist_tsarist.36.desc:0 "В Польше власть захватила женщина, заявляющая, что является Анастасией Романовой. Мы уверены, что она погибла, но поскольку наш Царь является самозванцем, он считает, что мы можем заключить с ней сделку, как отец и дочь."
  NSB_soviet_fascist_tsarist.36.a:0 "Заключить сделку"
  NSB_soviet_fascist_tsarist.36.b:0 "Оставить все как есть"
  NSB_soviet_fascist_tsarist.37.t:0 "Предложение от [SOV.GetLeader]"
  NSB_soviet_fascist_tsarist.37.desc:0 "Царь Николай прислал нам предложение. Наша разведка знает, что он не настоящий Николай, а их разведка знает, что наш лидер не настоящая Анастасия. Николай предлагает нам продолжать эту игру как отец и дочь и вместе править миром. Они заявили, что если мы не примем предложение, то последствия будут плохими."
  NSB_soviet_fascist_tsarist.37.a:0 "Принять"
  NSB_soviet_fascist_tsarist.37.b:0 "Отклонить"
  NSB_soviet_fascist_tsarist.38.t:0 "Ответ от Польши"
  NSB_soviet_fascist_tsarist.38.desc:0 "Они приняли наше предложение и сказали, что при сотрудничестве мы сможем править миром. В то же время они сообщили, что Анастасия переедет в наш дворец, чтобы отношения отца и дочери казались правдоподобными."
  NSB_soviet_fascist_tsarist.38.a:0 "Отлично"
  NSB_soviet_fascist_tsarist.39.t:0 "Ответ от Польши"
  NSB_soviet_fascist_tsarist.39.desc:0 "Анастасия отклонила наше предложение и заявила, что ничего подобного никогда не произойдет."
  NSB_soviet_fascist_tsarist.39.a:0 "Дураки"
  NSB_soviet_fascist_tsarist.40.t:0 "Николай сбежал в другую страну"
  NSB_soviet_fascist_tsarist.40.desc:0 "Нашим людям удалось совершить налет на деревню Николая, но, подумав, что наши люди были агентами, которые пришли убить его, он сбежал в другую страну."
  NSB_soviet_fascist_tsarist.40.a:0 "Преследуйте его и приведите его в страну"
  SOV_send_ultimatum_to_country_baltic2:0 "Отправить ультиматум [FROM.GetNameDef]"
  SOV_send_ultimatum_to_country_baltic2_desc:0 "С помощью ультиматума мы окажем давление на [FROM.GetAdjective] правительство, чтобы оно выполнило наши требования."
  SOV_finland_claimed_states_tt:0 "[ROOT.GetNameDefCap] получает претензии на §Yвсе [FIN.GetAdjective] ядра§!."
  russian_empire_nicholas:0 "Царская Россия"
  russian_empire_nicholas_DEF:0 "Царскую Россию"
  NSB_soviet_tsarist_news.1.t:0 "Николай II воскрес из мертвых"
  NSB_soviet_tsarist_news.1.desc:0 "Весь мир знал, что Николай мертв, но сегодня произошло кое-что интересное, и мы выяснили, что Николай на самом деле не умер. На самом деле, мы думаем, что он в последний момент сбежал от казни, а человек, который умер, был похож на него и был одет в его одежду, иначе это было бы невозможно. Вопрос в том, вспомнит ли Николай прошлое и отомстит или забудет об этом и будет с нетерпением ждать светлых времен впереди? Мы ничего не можем сделать, кроме как сидеть сложа руки и ждать и смотреть, что произойдет в ближайшие месяцы."
  NSB_soviet_tsarist_news.1.desc_exiles:0 "Сегодня мы узнали, что Николай не умер на самом деле. Его приспешники восстановили его на троне, и, согласно информации, он говорит, что не будет повторять своих прежних ошибок и позаботится о своем народе. Сейчас никто не сомневается в этом, в целом люди рады, что коммунизм закончился, и что Николай заявляет, что он позаботится о своем народе, и они станут богаче, чем раньше. Но другая информация, которую мы услышали, заключается в том, что он очень зол и горит желанием отомстить Германии и ее союзникам. Будем надеяться, что он не сделает неверных шагов, которые снова поставят нашу страну в плохое положение и заставят историю повториться."
  NSB_soviet_tsarist_news.1.a:0 "Боже, храни царя!"
  NSB_soviet_tsarist_news.1.b:0 "Чёрт"
  NSB_soviet_tsarist_news.1.c:0 "Чёрт подери"
  NSB_soviet_tsarist_news.1.d:0 "Как это случилось?"
  NSB_soviet_tsarist_news.1.e:0 "Нам лучше начать составлять оборонительные планы"
  NSB_soviet_tsarist_news.1.f:0 "Очень подозрительно"
  NSB_soviet_great_patriotic_war.04.t:0 "Рабочие внесли коррективы в производственную линию"
  NSB_soviet_great_patriotic_war.04.desc:0 "Рабочие, обеспокоенные тем, что война идет не так, как надо, поняли, что производственную линию можно улучшить. В результате они обнаружили, что некоторые детали можно производить с меньшим расходом ресурсов благодаря внесенным ими изменениям, и они быстро организовали производственную линию таким образом."
  NSB_soviet_great_patriotic_war.04.a:0 "Удивительный прогресс"
  NSB_soviet_great_patriotic_war.05.t:0 "Поднят боевой дух рабочих"
  NSB_soviet_great_patriotic_war.05.desc:0 "За последние месяцы мы потеряли еще земли, сердце революции поставлено на карту, и наши рабочие знают это и готовы сделать все, что в их силах, чтобы предотвратить уничтожение революции, ради которой они отдали свои жизни, поэтому наши рабочие начали работать усерднее, чтобы удовлетворить потребности армии, и они поддерживают высокий моральный дух, хором напевая наш гимн, чтобы поддерживать свою производительность на высоком уровне."
  NSB_soviet_great_patriotic_war.05.a:0 "За Родину-мать!"
  POLITICS_VLADIMIR_KIRILL_DESC:0 "Император и самодержец Всероссийский, Московский, Киевский, Владимирский, Новгородский; Царь Казанский, Царь Астраханский, Царь Польский, Царь Сибирский, Царь Херсонеса Таврического, Царь Грузинский; Государь Псковский и Великий князь Смоленский, Литовский, Волынский, Подольский, Финляндский; Князь Эстляндский, Лифляндский, Курляндский, Семигальский, Самогитский, Белостокский, Корельский, Тверской, Югорский, Пермский, Вятский, Болгарский и иных; Государь и великий князь Нижегородский, Черниговский, Рязанский, Полоцкий, Ростовский, Ярославский, Белозерский, Удорский, Обдорский, Кондийский, Витебский, Мстиславский и всея северныя страны повелитель; и государь Иверский, Карталинский и Кабардинской земли и армянских областей; наследный государь и владетель черкесских и горских князей и иных; Государь Туркестанский; Наследник Норвежский; Герцог Шлезвиг-Гольштейнский, Стормарнский, Дитмарсенский и Ольденбургский и прочая, и прочая, и прочая."
  POLITICS_VSEVOLOD_IVANOV_DESC:0 "$POLITICS_VLADIMIR_KIRILL_DESC$"
  POLITICS_NIKOLAI_II_DESC:0 "$POLITICS_VLADIMIR_KIRILL_DESC$"
  POLITICS_IOSIF_STALIN_DESC:0 "Сталин, также известный как Вождь, является правителем Советского Союза, человеком, который сверг Троцкого, наследником Ленина, защитником русской нации.\nТроцкий назывался следующим лидером после Ленина, а также находился в прочном положении внутри партии благодаря влиянию Наркомата обороны, который он осуществлял. Однако из-за некоторых ошибок, допущенных им, и мудрой политики Сталина он потерял власть. После смерти Ленина популярность Сталина также возросла среди населения благодаря его выступлениям по радио и статьям в газетах. В процессе этого Сталин объединился с Бухариным и выступил против Каменева и Зиновьева. Троцкий был сначала удалён из Политбюро в 1926 году, а затем из Центрального комитета партии в 1927 году вместе с Зиновьевым.\nПосле смерти Ленина Сталин принял активное участие в разработке и осуществлении политики Коммунистической партии Советского Союза, планов экономического и культурного развития, мер по укреплению обороноспособности страны, внешнеполитической практики партии и Советского правительства. Наряду с другими видными партийными деятелями Сталин вёл бескомпромиссную борьбу с противниками ленинизма.\nОн сыграл важную роль в идейно-политическом разгроме троцкизма и правого оппортунизма, в отстаивании ленинской доктрины для победы социализма в СССР, в укреплении единства Партии."
  SOV_nkvd_moral_army:0 "Контрольно-заградительные отряды"
  SOV_nkvd_construction_army:0 "Строительно-исправительные батальоны НКВД"