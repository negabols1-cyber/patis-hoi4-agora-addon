l_russian:
  USA_junta_in_command:0 "Хунта у власти"
  USA_junta_in_command_desc:0 "Военная хунта свергла правительство и взяла власть."
  USA_mcarthurs_request:0 "Просьба Макартура"
  USA_mcarthurs_request_desc:0 "Похоже, Макартур эффективно ведёт войну против радикалов, но отчаянно просит дополнительной помощи, воспринимая нежелание правительства расширять армию как признак слабости. Возможно, ему действительно нужно дополнительное подкрепление, чтобы сохранить порядок."
  USA_expand_the_fbi:0 "Расширить ФБР"
  USA_expand_the_fbi_desc:0 "Расширив ФБР, мы сможем пристальнее следить за нашими врагами."
  USA_enlistment_campaign:0 "Рекрутинговая кампания"
  USA_enlistment_campaign_desc:0 "Для дальнейшей мобилизации усилий и получения дополнительной поддержки необходима масштабная рекрутинговая кампания. В то же время нам нужно расширить призыв, выходящий за рамки избирательной службы."
  USA_investigate_the_corruption:0 "Расследовать коррупцию"
  USA_investigate_the_corruption_desc:0 "Коррупция процветает в нашей стране, и мы должны внимательно следить за всеми причастными."
  USA_raid_gangs:0 "Налёт на картели"
  USA_raid_gangs_desc:0 "Мы должны совершить налёт на картели, раздавить их на ранней стадии и избавиться от них."
  USA_down_with_the_traitors:0 "Выследить предателей"
  USA_down_with_the_traitors_desc:0 "Пришло время выследить и покончить с предателями, за которыми мы следили."
  USA_deal_with_congress:0 "Разобраться с Конгрессом"
  USA_deal_with_congress_desc:0 "Если им удастся найти общий язык с Конгрессом и прийти к соглашению с ним, всё могло бы быть намного лучше."
  USA_shut_down_the_congress:0 "Распустите Конгресс"
  USA_shut_down_the_congress_desc:0 "Нам нужно распустить Конгресс и избавиться от этого нелепого сообщества людей."
  USA_trial_of_traitors:0 "Избавьтесь от предателей"
  USA_trial_of_traitors_desc:0 "Наши спецслужбы выявили в Америке пособников радикализма и жадности. Эти организации по праву запрещены за их подлое предательство."
  USA_dissolve_the_federal_system:0 "Упраздните федеральную систему"
  USA_dissolve_the_federal_system_desc:0 "Федеральная система приносит нам больше вреда, чем пользы. Мы должны принудительно присоединить эти мелкие регионы к себе и управлять ими из единого центра."
  USA_patton:0 "Президентство Паттона"
  USA_patton_desc:0 "Президент Паттон заявил, что не уступит победу тем самым партизанам, которые вызвали гражданскую войну. Его американская хунта обещает национальное возрождение и принятие функциональной демократии, такой, как ее видит Паттон. Устранение лишних политиков и назначение более компетентных чиновников сократит пропасть между народом и политикой."
  USA_declare_martial_law:0 "Введите военное положение"
  USA_declare_martial_law_desc:0 "С согласия Конгресса действие закона о хабеас корпус приостанавливается в соответствии с Конституцией. Поскольку угроза вторжения сил синдикалистов и популистов все еще нависает над частью страны, очевидно, что мы должны действовать, чтобы обеспечить безопасный переход к эпохе после гражданской войны. Habeas corpus и свобода слова все еще приостановлены по политическим причинам, и мы должны ввести военное положение, чтобы помочь найти оставшихся мятежников."
  USA_second_american_protective_league:0 "Вторая Американская лига защиты"
  USA_second_american_protective_league_desc:0 "Поскольку большая часть Соединенных Штатов была усмирена, жизненно важно, чтобы американские граждане оставались бдительными. Необходимо восстановить Лигу в качестве свободной информационной системы для передачи правительству информации о возможных шпионах-популистах или синдикалистах и для воспрепятствования общественным протестам."
  USA_all_to_the_general_staff:0 "Все в Генштаб"
  USA_all_to_the_general_staff_desc:0 "Необходимо создать Генеральный штаб, который будет иметь гораздо больший контроль над перемещением войск, внутренней армейской политикой и технологиями, чтобы мы могли сражаться с врагом со всем, что у нас есть."
  USA_empower_the_army:0 "Укрепить армию"
  USA_empower_the_army_desc:0 "В нашем новом военном ведомстве уже назрел кризис. Армия и флот постоянно грызутся из-за финансирования и политических откатов. Нам нужно переместить флот на второстепенный уровень власти и передать все полномочия армии."
  USA_american_stratocracy:0 "Американская Стратократия"
  USA_american_stratocracy_desc:0 "Паттон наконец восстановил националистический пыл и функциональную демократию, какой он ее видит. Хотя некоторые жалуются, что политиков, которые сделали политику своей профессией, заменили офицеры, немногие будут спорить, что бюрократия не улучшилась. Теперь американский народ может доверять своим политикам в том, что они будут использовать законные средства для достижения своих целей."
  USA_investigate_army_commanders:0 "Расследовать армейских командиров"
  USA_investigate_army_commanders_desc:0 "Мы подозреваем, что среди армейских командиров могут быть предатели. Мы должны внимательно за ними следить."
  USA_change_the_constitution:0 "Новая конституция"
  USA_change_the_constitution_desc:0 "Источником власти Паттона являются вооруженные силы. Однако он выразил обеспокоенность некоторым из своих ближайших советников по поводу того, что после окончания Гражданской войны США снова станут обладать слабой армией. Чтобы противостоять этому, Паттон предложил поправку к конституции, которая поможет создать постоянную военную машину, начиная с требования, чтобы мужчины определенного возраста служили в вооруженных силах."
  USA_destroy_radicalism:0 "Уничтожить радикализм"
  USA_destroy_radicalism_desc:0 "Хотя правительство США терпимо относится к политическому дискурсу, Конгресс выступил против синдикалистских и дистрибутистских платформ Лонга и Хэйвуда. Юридические органы, которые выступают за профсоюзы или организации взаимного кредита, будут преследоваться в соответствии с Законом о подстрекательстве 1917 года."
  USA_the_american_chief:0 "Американский главнокомандующий"
  USA_the_american_chief_desc:0 "Да здравствует глава! Все американцы будут приветствовать человека, спасшего нашу страну от экстремистов и иностранного господства. Паттон вдохновил американский народ, и с их поддержкой он стал могущественнее, чем когда-либо прежде. Теперь он обращает свой взгляд на внешнюю арену в поисках новых врагов."
  USA_unholy_alliance_ger:0 "Нечестивый союз"
  USA_unholy_alliance_ger_desc:0 "Этот союз принесёт нам большую выгоду, но вызовет гнев всех государств вокруг нас, поэтому мы должны быть готовы."
  USA_north_america:0 "Доминировать в Северной Америке"
  USA_north_america_desc:0 "Мы контролируем Северную Америку и должны её ассимилировать."
  USA_new_strategy:0 "Переключить промышленный фокус на военный"
  USA_new_strategy_desc:0 "Гражданская промышленность не приносит нам никакой пользы, мы уже достаточно продвинуты в этой области. Пора полностью сосредоточиться на военной промышленности."
  USA_american_junta:0 "Американская хунта"
  USA_american_junta_desc:0 "Когда Римская республика находилась в кризисе, могущественные генералы поднялись, чтобы спасти страну от себя самой. Сделка Макартура с Эйзенхауэром была частично обнародована, хотя ни американский народ, ни остальные члены комитета не узнают о характере их отношений. Теперь мы должны решить, кто ещё будет служить вместе с этими двумя людьми в новой хунте."
  USA_utilize_the_legions:0 "Использовать легионы"
  USA_utilize_the_legions_desc:0 "Американский Легион теперь под нашим контролем, и он займет важное место в нашем новом режиме. Легион будет поддерживать мир и, как мы надеемся, подавит любые восстания в их начальной стадии, а также поможет нашим правоохранительным органам обеспечить соблюдение законов. В нашей стране больше никогда не будет беззакония!"
  USA_privatize_the_TVA2:0 "Приватизация Управления долиной Теннесси"
  USA_privatize_the_TVA2_desc:0 "Управление долиной Теннесси вытеснило частную конкуренцию и установило монополию на строительные работы в этом районе. Правительство не должно заниматься тем, что частный сектор может делать лучше, это доказано."
  USA_de_regulate_the_banking_sector2:0 "Дерагулирование банковского сектора"
  USA_de_regulate_the_banking_sector2_desc:0 "После коррекции на финансовых рынках, что совершенно нормально для экономического цикла, предыдущие правительства ввели совершенно необоснованные ограничения на финансовую деятельность. Хотя, несомненно, это было сделано с благими намерениями, эти ограничения явно приносят больше вреда, чем пользы."
  USA_national_employment_strategy2:0 "Национальная стратегия занятости"
  USA_national_employment_strategy2_desc:0 "Безработица обусловлена простым фактом: люди не соответствуют предлагаемым рабочим местам. Фабрики простаивают, потому что работодатели не могут найти нужных им людей, в то время как в других частях страны люди голодают. Мы внедрим новую стратегию, которая гарантирует, что любой работодатель сможет найти людей, необходимых для управления своей компанией."
  USA_loyalist_army:0 "Армия лоялистов"
  USA_loyalist_army_desc:0 "Хотя такие люди, как Макартур, преступили границы, слишком суровое наказание их сочтется недопустимым для многих из нашего народа. Те, кто сочувствует этим людям, утверждают, что они в конечном итоге были преданы Америке и демократии. У нас есть армия, которая нам предана, и это то, что важно."
  USA_control_congress:0 "Управление конгрессом"
  USA_control_congress_desc:0 "Многие бывшие демократы и республиканцы перешли на сторону нового режима, а ярые сторонники бежали. К счастью, мы смогли заполнить их вакансии квалифицированными, заслуживающими доверия людьми. Эти новые конгрессмены не являются политиками в чистом виде, а являются государственными служащими для американского народа."
  USA_full_congressional_restoration:0 "Полное восстановление Конгресса"
  USA_full_congressional_restoration_desc:0 "Конгресс полностью восстановлен в своем былом великолепии. Те, кто в последнее время ушел в отставку из-за запугивания, возвращаются, и в Вашингтон прибывает новая кровь. Не стало экстремистских партий, которые раздирали нацию, а на их место пришли возрожденные Демократическая и Республиканская партии, которые работают на представление всех. Американцы могут смело писать своим конгрессменам еще раз, и демократия спасена."
  USA_rebuild_civil_service:0 "Восстановить гражданскую службу"
  USA_rebuild_civil_service_desc:0 "Страна сильно пострадала еще до начала войны. Это и монументальная задача, и возможность объединить транспортные сети, а также продвигать более смелые экономические идеи, чтобы поднять американскую промышленность над этим слабеющим миром."
  USA_american_values:0 "Американские ценности"
  USA_american_values_desc:0 "Пассивная пропаганда гражданского правительства через возвышенные публикации была резко подорвана памфлетами и частными издателями, которые продвигали негражданское правительство. Конгресс решил, что многогранный подход к привитию американских ценностей через средства массовой информации, наконец, подорвет памфлетистов."
  USA_loyalty_to_american_flag:0 "Верность американскому флагу"
  USA_loyalty_to_american_flag_desc:0 "В отличие от тиранов и деспотов, которые распространены в Америках, Макартур хочет быть не Великим Человеком, а уважаемым и смертным лидером американцев. Верность неизменной идее Америки должна быть поставлена ​​выше, пока сохраняется популярность Макартура."
  USA_join_allies:0 "Присоединиться к союзникам"
  USA_join_allies_desc:0 "Если бы мы заключили союз с союзниками, мы бы полностью защитили моря вокруг нас. Таким образом, наши враги не смогут приблизиться к нам."
  USA_the_lion_and_the_eagle:0 "Лев и орел"
  USA_the_lion_and_the_eagle_desc:0 "Лев и орел стоят как одно целое, и наши экономические кабинеты соберутся вместе, чтобы обсудить возможные инвестиции в боеприпасы, которые мы можем осуществить совместно."
  USA_help_the_dominions:0 "Помочь доминионам"
  USA_help_the_dominions_desc:0 "Доминионы - сильная страна, но им не хватает индустрии и опыта. Мы отправим туда и то, и другое, чтобы они смогли защитить интересы демократии."
  USA_reorganize_free_corps:0 "Реорганизовать Свободные Корпуса"
  USA_reorganize_free_corps_desc:0 "Так как армия вызывает всё больше подозрений, мы должны обратиться к героям Великой войны. В трудные времена Свободные Германские Корпуса приходили на помощь Германской Республике. Нам нужна подобная организация, которая останется верной нам, когда настанет наш час."
  USA_german_technology_exchange:0 "Технологическое сотрудничество между Америкой и Германией"
  USA_german_technology_exchange_desc:0 "Это технологическое соглашение пойдет на пользу двум государствам. Танковые технологии, которые мы здесь изучим, будут для нас очень полезны."
  USA_infantry_weapons_modernization:0 "Модернизация стрелкового оружия"
  USA_infantry_weapons_modernization_desc:0 "Пехотинец по-прежнему остаётся становым хребтом нашей армии. Модернизация его винтовки, оружия поддержки и средств связи гарантирует, что наши пехотные дивизии смогут на равных противостоять любому противнику."
  USA_rainbow_five:0 "План «Рэйнбоу-5»"
  USA_rainbow_five_desc:0 "Отдел военного планирования завершил разработку серии «радужных» планов. План №5 предусматривает полномасштабную мобилизацию для глобального конфликта — и мы должны быть готовы сражаться на всех фронтах."
  USA_mainland_defense_doctrine:0 "Доктрина обороны континентальной части США"
  USA_mainland_defense_doctrine_desc:0 "Пока за океаном полыхают чужие войны, первейший долг армии США — защита Родины. Разработка скоординированного плана континентальной обороны позволит нам обезопасить побережье и индустриальное сердце страны от любой угрозы."
  USA_homeland_fortification:0 "Укрепление Родины"
  USA_homeland_fortification_desc:0 "Если враг когда-либо ступит на наши берега, последним рубежом обороны станут мощные фортификации и береговые батареи. Бетон и сталь, быть может, не так эффектны, но они спасают жизни."
  USA_static_defense_training:0 "Подготовка к позиционной обороне"
  USA_static_defense_training_desc:0 "Оборона — это не просто ожидание, это подготовка, стойкость и умение контратаковать. Обучение наших дивизий позиционной обороне сделает любое вторжение невозможным."
  USA_national_guard_integration:0 "Интеграция Национальной гвардии"
  USA_national_guard_integration_desc:0 "Национальная гвардия долгое время была разрыва между властью штатов и федеральным центром. Интегрировав её командную структуру в регулярную армию, мы получим более многочисленный и управляемый резерв, готовый к чрезвычайным ситуациям."
  USA_combined_arms_doctrine:0 "Доктрина объединённых родов войск"
  USA_combined_arms_doctrine_desc:0 "Современная война требует безупречного взаимодействия пехоты, бронетехники, артиллерии и авиации. Разработав полноценную доктрину объединённых родов войск, мы научим наши силы действовать как единое целое — быстро, гибко и сокрушительно."
  USA_engineer_corps_expansion:0 "Расширение Инженерного корпуса"
  USA_engineer_corps_expansion_desc:0 "Дороги, мосты и укрепления выигрывают войны не хуже, чем пушки. Расширение Инженерного корпуса обеспечит нашим войскам возможность строить, восстанавливать и сражаться в любых условиях."
  USA_armored_spearhead:0 "Бронетанковый клин"
  USA_armored_spearhead_desc:0 "Танки — это остриё копья современной армии. Формируя новые бронетанковые дивизии и улучшая координацию между танками, пехотой и авиацией, мы превратим нашу армию в силу неудержимого натиска."
  USA_army_of_liberation:0 "Армия освобождения"
  USA_army_of_liberation_desc:0 "Американская армия призвана не только защищать свободу, но и нести её миру. Везде, где пустит корни тирания, наши солдаты принесут освобождение, а не завоевание."
  USA_hammer_of_democracy:0 "Молот [GetHammerOfDemocracyName]"
  USA_hammer_of_democracy_commie:0 "социализма"
  USA_hammer_of_democracy_democratic:0 "демократии"
  USA_hammer_of_democracy_desc:0 "Наша сила должна служить высшей цели. Армия Соединённых Штатов станет молотом, которым [GetHammerOfDemocracyName] обрушится на угнетателей — символом свободы, выкованным из стали и решимости."
  USA_army_service_forces:0 "Тыловые службы армии"
  USA_army_service_forces_desc:0 "Гигантский логистический аппарат, необходимый для снабжения глобальной армии, требует координации и эффективности. Создание Тыловых служб объединит снабжение, транспорт и администрирование под единым командованием."
  USA_strengthen_the_air_corps:0 "Усиление Воздушного корпуса"
  USA_strengthen_the_air_corps_desc:0 "Воздушный корпус армии США остаётся малочисленным и недофинансированным — пережиток прошлой эпохи. Увеличив бюджеты, модернизировав подготовку и вложившись в производство самолётов, мы заложим основу для воздушной мощи, достойной великой державы."
  USA_aerial_maneuvers:0 "Воздушные манёвры"
  USA_aerial_maneuvers_desc:0 "Сложные фигуры пилотажа и массовые построения — это уже не просто украшение авиашоу. Регулярные совместные учения отточат мастерство наших пилотов в координации, точности и умении адаптироваться в небе."
  USA_fighter_procurement_board:0 "Комитет по закупкам истребителей"
  USA_fighter_procurement_board_desc:0 "Для завоевания превосходства в воздухе наша истребительная программа должна стать приоритетной. Специализированный комитет возьмёт на себя координацию разработок, ускорит испытания и обеспечит создание нового поколения американских перехватчиков."
  USA_jet_propulsion_research:0 "Исследования в области реактивной тяги"
  USA_jet_propulsion_research_desc:0 "Эра винтов подходит к концу. Инвестируя в экспериментальные реактивные технологии, мы сможем совершить рывок и обеспечить себе господство в небесах завтрашнего дня."
  USA_tactical_bomber_command:0 "Командование тактической бомбардировочной авиации"
  USA_tactical_bomber_command_desc:0 "Победа на земле начинается с ударов с воздуха. Создание Командования тактической бомбардировочной авиации позволит координировать непосредственную поддержку войск, изоляцию поля боя и удары по тылам противника с разрушительной эффективностью."
  USA_heavy_bomber_fleet_expansion:0 "Расширение парка тяжёлых бомбардировщиков"
  USA_heavy_bomber_fleet_expansion_desc:0 "Наша индустриальная мощь позволяет строить бомбардировщики с беспрецедентными дальностью и боевой нагрузкой. Расширение флота тяжёлых бомбардировщиков гарантирует, что ни один враг не укроется от мощи американской авиации."
  USA_precision_bombing_doctrine:0 "Доктрина точного бомбометания"
  USA_precision_bombing_doctrine_desc:0 "Вместо ковровых бомбардировок городов наши стратеги предлагают наносить точечные удары по ключевым промышленным и логистическим объектам. Точное бомбометание нанесёт максимальный урон военной машине врага при минимальных затратах."
  USA_expand_aircraft_production_lines:0 "Расширение авиационных производственных линий"
  USA_expand_aircraft_production_lines_desc:0 "Воздушная мощь опирается на промышленность. Расширение производственных линий и стандартизация деталей позволят нам строить истребители, бомбардировщики и транспортники быстрее, чем любая другая страна."
  USA_advanced_pilot_training_program:0 "Программа углублённой подготовки пилотов"
  USA_advanced_pilot_training_program_desc:0 "Самолёт хорош настолько, насколько хорош пилот за штурвалом. Усовершенствовав учебные программы, внедрив симуляторы высотных боёв и сделав упор на дисциплину, мы подготовим лучших пилотов в мире."
  USA_the_b_17_project:0 "Проект B-17"
  USA_the_b_17_project_desc:0 "Boeing B-17 «Летающая крепость» знаменует новую эру американского инжиниринга — бомбардировщик, созданный для дневных точных ударов в глубоком тылу врага. С этим проектом мы станем пионерами стратегических бомбардировок."
  USA_boost_transport_capacity:0 "Увеличение транспортных мощностей"
  USA_boost_transport_capacity_desc:0 "Логистика — основа воздушных операций. Расширение транспортного флота и улучшение координации между наземным и воздушным снабжением позволят нам перебрасывать силы через океаны с невиданной скоростью."
  USA_army_airfields_expansion:0 "Расширение сети армейских аэродромов"
  USA_army_airfields_expansion_desc:0 "Чтобы принимать более крупные авиакрылья и тяжёлые самолёты, наша аэродромная инфраструктура должна расти. Новые базы будут построены как на материке, так и за океаном, обеспечивая американской авиации глобальную досягаемость."
  USA_radar_and_targetting_improvements:0 "Совершенствование радаров и прицелов"
  USA_radar_and_targetting_improvements_desc:0 "От систем раннего предупреждения до точности бомбовых прицелов — воздушная война теперь ведётся с помощью данных. Улучшенные радары и передовые прицелы дадут нашим пилотам преимущество в обнаружении и точности."
  USA_unified_strategic_command:0 "Объединённое стратегическое командование"
  USA_unified_strategic_command_desc:0 "Взаимодействие истребителей, бомбардировщиков и разведчиков — залог победы. Единое стратегическое командование объединит все ветви воздушной службы в единую, слаженную силу."
  USA_convair_b_36_project:0 "Проект Convair B-36"
  USA_convair_b_36_project_desc:0 "Мир становится теснее, и наши бомбардировщики должны летать дальше. Проект Convair B-36 «Миротворец» предусматривает создание самолёта, способного наносить удары по целям на других континентах — высшее воплощение американской стратегической мощи."
  USA_CAS:0 "Поддержка с воздуха"
  USA_CAS_desc:0 "Опыт современных конфликтов доказал решающее значение авиации, действующей в тесной связке с наземными войсками. Создание выделенных сетей связи и отработка тактики ударов позволят нашим пилотам наносить точные удары, непосредственно поддерживая наступающие части. Небо станет продолжением поля боя, гарантируя, что наши солдаты никогда не будут сражаться в одиночку."
  USA_fund_the_navy:0 "Финансирование флота"
  USA_fund_the_navy_desc:0 "Пришло время вернуть военно-морскому флоту США былое господство на морях. Новые кораблестроительные программы, расширение верфей и возобновлённое финансирование со стороны Конгресса позволят нашему флоту расти в числе и мощи — Америка вновь сможет проецировать силу во всех океанах."
  USA_iowa_class_battleships:0 "Линейные корабли типа «Айова»"
  USA_iowa_class_battleships_desc:0 "Новые линкоры типа «Айова» представляют собой вершину американского военно-морского инжиниринга — сочетание тяжёлой брони, огромных 16-дюймовых орудий и беспрецедентной для кораблей такого размера скорости. Эти суда станут символом американской мощи и сдерживания на всех морях."
  USA_essex_class_aircraft_carriers:0 "Авианосцы типа «Эссекс»"
  USA_essex_class_aircraft_carriers_desc:0 "Авианосцы типа «Эссекс» воплощают новое поколение морской авиации — более быстрые, крупнее и эффективнее предшественников. Способные нести мощное авиакрыло, они обеспечат флоту непревзойдённую гибкость и ударную силу по всему миру."
  USA_extended_carrier_range_operations:0 "Операции авианосцев на увеличенной дальности"
  USA_extended_carrier_range_operations_desc:0 "Современная война требует радиуса действия. Улучшив топливные системы, логистические суда снабжения и возможности дозаправки в воздухе, наши авианосные ударные группы смогут действовать вдали от баз — обеспечивая американскую воздушную мощь даже в самых отдалённых регионах."
  USA_improved_high_velocity_naval_guns:0 "Усовершенствованные скоростные корабельные орудия"
  USA_improved_high_velocity_naval_guns_desc:0 "Корабельная артиллерия продолжает развиваться. Разработка новых высокоскоростных снарядов и передовых башенных механизмов даст нашим линкорам превосходство в дальности, бронепробиваемости и точности, гарантируя господство в любом надводном бою."
  USA_emergency_repair_procedures:0 "Аварийно-ремонтные процедуры"
  USA_emergency_repair_procedures_desc:0 "Опыт военных действий научил наших моряков: выживание часто зависит от быстрой борьбы за живучесть. Специализированная подготовка ремонтных команд и улучшение внутренних переборок кораблей позволят резко сократить потери и время ремонта судов в бою."
  USA_anti_submarine_warfare:0 "Противолодочная борьба"
  USA_anti_submarine_warfare_desc:0 "Подводные лодки представляют собой одну из самых серьёзных угроз для нашей морской логистики. Усовершенствованные гидролокаторы, системы сброса глубинных бомб и координация эскорта позволят нам разработать комплексную доктрину поиска и уничтожения вражеских субмарин до того, как они нанесут удар."
  USA_expand_naval_shipyards:0 "Расширение военно-морских верфей"
  USA_expand_naval_shipyards_desc:0 "В условиях растущей напряжённости существующие мощности по строительству флота уже не отвечают потребностям. Расширив крупнейшие верфи в Норфолке, Бруклине и на острове Мэр, а также построив новые вдоль побережий, мы значительно увеличим наши кораблестроительные возможности и обеспечим американскому флоту первенство на морях."
  USA_advanced_fire_control_systems:0 "Передовые системы управления огнём"
  USA_advanced_fire_control_systems_desc:0 "Интеграция радаров и автоматического наведения произведёт революцию в морском бою. Передовые системы управления огнём позволят нашим кораблям обнаруживать, отслеживать и поражать цели с высокой точностью даже в условиях плохой видимости, превращая ночь и непогоду в наших союзников."
  USA_arsenal_of_the_oceans:0 "Арсенал океанов"
  USA_arsenal_of_the_oceans_desc:0 "Америка не будет просто защищать моря — она будет властвовать над ними. Наши верфи, наши авианосцы, наши линкоры и наши люди вместе образуют величайшую военно-морскую силу, которую когда-либо видел мир. Военно-морской флот США станет бесспорным Арсеналом океанов."
  USA_war_production_board:0 "Учреждение Совета военного производства"
  USA_war_production_board_desc:0 "Время кустарного расширения прошло. Нынешняя мобилизация промышленности тормозится бюрократической конкуренцией между армией, флотом и гражданским рынком. Этому хаосу необходимо положить конец. Исполнительным указом 9024 мы учреждаем Совет военного производства, наделённый верховной властью над экономикой страны. Автомобильные заводы будут принудительно перепрофилированы под выпуск танков и самолётов. Каждая тонна стали, каждая унция резины и алюминия пойдут исключительно на нужды войны. Энергия свободного рынка отныне подчинена единой цели: Полной Победе."
  USA_NSC_68:0 "Стратегия NSC-68"
  USA_NSC_68_desc:0 "Советский Союз движим новой фанатичной верой, враждебной нам. Чтобы выжить, мы должны встать на путь быстрого и устойчивого наращивания политической, экономической и военной мощи свободного мира. Защита свободы не знает слишком высокой цены."
  USA_new_look_policy:0 "Доктрина «Нового облика»"
  USA_new_look_policy_desc:0 "Мы не можем сравняться с ордами коммунистов в живой силе, не обанкротив экономику. Нам нужна defence «нового облика»: небольшие силы общего назначения, опирающиеся на подавляющую, асимметричную мощь нашего ядерного арсенала."
  USA_SHAPE:0 "Создание SHAPE"
  USA_SHAPE_desc:0 "Нам нужно нечто большее, чем просто союз — нам нужно единое командование. Верховное главнокомандование объединёнными вооружёнными силами НАТО в Европе обеспечит, что в случае войны американские, британские и французские силы будут сражаться как единый, слаженный механизм."
  USA_offshore_procurement:0 "Оффшорные закупки"
  USA_offshore_procurement_desc:0 "Поставлять американское оружие бесконечно — неустойчиво. Мы должны профинансировать возрождение европейской военной промышленности, позволив им производить собственные боеприпасы на американские деньги."
  USA_STANAG:0 "СТАНАГ"
  USA_STANAG_desc:0 "Союз настолько же силён, насколько сильны его линии снабжения. Если голландский солдат не может стрелять британскими патронами из американской винтовки — мы разобщены. Соглашение о стандартизации приведёт наши военные спецификации к единому знаменателю."
  USA_strategic_missile_program:0 "Программа стратегических ракет"
  USA_strategic_missile_program_desc:0 "Бомбардировщик не всегда сможет прорваться. Мы должны вступить в эру межконтинентальных баллистических ракет, гарантируя, что ни одна цель на Земле не останется вне досягаемости американского правосудия."
  USA_the_mediterranean_flank:0 "Средиземноморский фланг"
  USA_the_mediterranean_flank_desc:0 "Оборона Европы не заканчивается у Альп. Мы должны обезопасить Средиземное море и южные подступы к Советскому Союзу."
  USA_mutual_security_act:0 "Закон о взаимной безопасности"
  USA_mutual_security_act_desc:0 "Чтобы сдержать советскую угрозу, недостаточно одних договоров. Мы должны залить бетоном и сталью оборону наших союзников. Этот закон выделяет средства на строительство военных баз, аэродромов и организацию консультативных миссий по всему Свободному миру — от Средиземноморья до Тихого океана."
  USA_the_cia_directorate:0 "Центральное разведывательное управление"
  USA_the_cia_directorate_desc:0 "Эра импровизированной военной разведки закончена; мы не можем допустить ещё одного Пёрл-Харбора. Закон о национальной безопасности реорганизует наши возможности в единое, постоянное ведомство. В этой новой теневой войне ЦРУ станет глазами и ушами свободного мира, действуя там, куда не могут войти армии."
  USA_operation_gladio:0 "Операция «Гладио»"
  USA_operation_gladio_desc:0 "Мы должны готовиться к худшему. Сети «остающихся» партизан и агентов будут созданы по всей Европе, чтобы возглавить сопротивление в случае оккупации континента Красной армией."
  USA_annual_joint_war_games:0 "Ежегодные совместные учения"
  USA_annual_joint_war_games_desc:0 "Бумажные договоры не сдерживают агрессора — это делают готовые армии. Мы введём в практику масштабные ежегодные манёвры, чтобы проверить наши возможности по быстрой переброске сил. Пусть Кремль наблюдает и трепещет, видя безупречную координацию войск Свободного мира."
  USA_marshall_plan:0 "План Маршалла"
  USA_marshall_plan_desc:0 "Европа лежит в руинах, а нищета — это рассадник тоталитаризма. Наша политика направлена не против какой-либо страны или доктрины, а против голода, бедности, отчаяния и хаоса. Влив миллиарды в европейскую экономику, мы восстановим рынки Запада и возведём процветающий бастион против распространения коммунизма."
  USA_the_point_four_program:0 "Программа «Пункт Четвёртый»"
  USA_the_point_four_program_desc:0 "Мы должны начать новую смелую программу, чтобы сделать преимущества наших научных и промышленных достижений доступными для улучшения и роста слаборазвитых регионов. Нищета — это питательная среда для коммунизма."
  USA_architect_of_the_free_world:0 "Архитектор свободного мира"
  USA_architect_of_the_free_world_desc:0 "Из пепла войны мы возвели новый порядок. Атлантический альянс стал самым мощным союзом в истории. Мы больше не просто участник мировых дел — мы гарант глобального мира."
  USA_operation_dropshot:0 "Операция «Дропшот»"
  USA_operation_dropshot_desc:0 "Сосуществование — это миф. Природа советского зверя не оставляет миру шанса. Мы должны ударить сейчас, сокрушительной ядерной мощью, пока они не стали слишком сильны. Или мы, или они."
  USA_the_long_twilight_struggle:0 "Долгая сумеречная борьба"
  USA_the_long_twilight_struggle_desc:0 "Ныне труба снова зовёт нас... не призывом к оружию, хотя оружие нам нужно, а призывом принять на себя бремя долгой сумеречной борьбы против извечных врагов человека: тирании, нищеты, болезней и самой войны."
  USA_allied_cooperation:0 "Сотрудничество с союзниками"
  USA_allied_cooperation_desc:0 ""
  USA_help_soviet_infantry:0 "Помощь в снабжении пехоты §Y[SOV.GetFlag][SOV.GetAdjective]§!"
  USA_help_soviet_tank:0 "Помощь в поставках средних танков §Y[SOV.GetFlag][SOV.GetAdjective]§!"
  USA_help_uk_fighter:0 "Помощь в снабжении легкими самолетами §Y[ENG.GetFlag][ENG.GetAdjective]§!"
  USA_help_uk_strat:0 "Помощь в поставках тяжелыми самолетами §Y[ENG.GetFlag][ENG.GetAdjective]§!"