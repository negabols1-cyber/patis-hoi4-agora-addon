 GER_ss_wehrmacht_conflict_desc: "Поскольку §Yadolf Hitler стал канцлером в 1933 году_1, штат Германия, которое находилось в состоянии коллапса, §Ybegan быстро восстановиться. После того, как социальные, экономические и другие подобные проблемы в стране были решены. §Y0Adolf Гитлера Цели были увеличены §!. В большинстве своих публичных выступлений §YHE пообещал §Ygerman народ восстановить немецкие земли, потерянные после Первой мировой войны, другими словами, чтобы §Y -nemather все немецкие общины под одной крышей. Армия §Ygerman состояла из 2 основных групп. Ограниченная военная власть Германии §!. \ n \ n §Y5§!6schutzstaffel§!, §Y Вторая часть новой немецкой армии §! была в 1923 году, чтобы скрыть личные встречи Adolf Hitler§!, но затем, с эффектом, пришедшего к власти, §Y -й малой группе. §!6waffen-ss§!, одна из ветвей §Ymain 2 §! §Y5§!6schutzstaffel§!, имела значение в немецкой армии. Эти большие группы §Y2 начали чувствовать себя некомфортно друг с другом, и между ними начались конфликты. §!" #NT!
  
