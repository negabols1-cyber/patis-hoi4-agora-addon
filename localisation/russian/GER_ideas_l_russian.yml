 #Events #Temporary 
 germany.2000.t: "Вермачт занимает позицию" #NT!
 germany.2000.desc: "Двери министерства войны сегодня открылись не для нового порядка, а по старому принципу - разум. Generalfeldmarschall Werner Von Blomberg и несколько других старших офицеров Wehrmacht выпустили тихое, но решительное коммюнике: они поддерживают усилия Шпеера по удалению радикальных идеологов из внутреннего круга Рейха. По их словам: «Германия должна управляться теми, кто строит, а не те, кто горит». С тенью военных позади него, позиция Шпеера больше не является заместителем, а государственным деятелем." #NT!
 germany.2000.alt.desc: "Казармы и командные залы Хира тихо взволновали сегодня не с сапогами и приказами, а с согласия. Generalfeldmarschall Walther von Brauchitsch и несколько других старших офицеров Вермахта выпустили тихое, но решительное коммюнике: они отстают от усилий Шпеера по удалению радикальных идеологов из внутреннего круга Рейха. По их словам: «Германия должна управляться теми, кто строит, а не те, кто горит». С тенью военных позади него, позиция Шпеера больше не является заместителем, а государственным деятелем." #NT!
 germany.2000.a: "Они защитят нас от фанатиков" #NT!
  
 germany.2001.t: "Ночь тихой стали" #NT!
 germany.2001.desc: "В коридорах Берлина не было выстрелов. Нет речей. Нет криков. Только запертые двери, запечатанные заказы и молчаливые встречи. В течение одной ночи десятки высокопоставленных фигур из SS, гестапо и министерства пропаганды исчезли. Некоторые из них были «освобождены от долга», другие были «переназначены», а некоторые больше никогда не видели. Инструкции Шпеера были холодными и ясными: «Государство будет регулироваться не идеологической лояльностью, а инженерными принципами». Той ночью сталь управляла Германией - тихой, рассчитанной и абсолютной." #NT!
 germany.2001.a: "Мы заменили хаос на расчет" #NT!
  
 germany.2002.t: "Золотое прикосновение" #NT!
 germany.2002.desc: "В одном из своих первых действий в роли Фюрера Герман Гёринг приказал восстановить несколько государственных залов с золотой отделкой и бархатной мебелью. «Рейх, достойный величия, должен выглядеть роль», - сообщил он помощникам. В то время как некоторые издеваются за счет, другие считают его символом восстановленной стабильности." #NT!
 germany.2002.a: "Пусть у него есть золотой рейх" #NT!
  
 wtt_germany.1500.t: "[From.GetNameDefCap] Требование европейского объединения" #NT!
 wtt_germany.1500.d: "[From.GetNameDefCap] сегодня назвал собрание европейских стран, чтобы обсудить европейский федеральный штат! [GER.GetLeader] умолял мир в Европе и формирование глобальной сверхдержавы. Что мы будем голосовать?" #NT!
 wtt_germany.1500.a: "Отличная идея!" #NT!
 wtt_germany.1500.b: "Безумный аренда!" #NT!
 wtt_germany.1501.t: "[From.GetNameDefCap] принять объединение" #NT!
 wtt_germany.1501.d: "После долгих переговоров было достигнуто соглашение с правительством [From.GetNameDefCap]. Они решили присоединиться к европейскому федеральному штату в качестве полного члена." #NT!
 wtt_germany.1501.a: "Замечательный" #NT!
 germany.9923.t: "Германия хочет вмешаться в [GetSovietCivilWarName]" #NT!
 germany.9923.d: "Этим утром немецкие дипломаты пришли к нам с предложением. Они сказали, что могут прийти к нашей помощи с большой армией, чтобы помочь нам в гражданской войне, но в свою очередь мы должны принять демократию, чтобы убедиться, что мир на континенте снова не сломается, или мы могли бы столкнуться с очень серьезными санкциями." #NT!
 germany.9923.a: "Приемлемый" #NT!
 germany.9923.b: "Абсолютно нет" #NT!
 germany.9922.t: "Русские приняли наше предложение" #NT!
 germany.9922.t_2: "Русские отвергли наше предложение" #NT!
 germany.9922.d: "Русские приняли наше предложение и сказали, что примут демократию после окончания войны. Мы должны немедленно мобилизовать наши армии и принять участие в войне." #NT!
 germany.9922.d_2: "Русские отвергли наше предложение. Если они выиграют гражданскую войну и не примут демократию, это будет очень плохо для них." #NT!
 germany.9922.a: "Хороший" #NT!
 germany.9922.a_2: "Время покажет" #NT!
 germany.10012.t: "Немцы требуют возвращения колоний" #NT!
 germany.10012.desc: "После поражения в Великой войне Германия потеряла свои небольшие колонии в Африке и Океании. Некоторые из них, расположенные в Африке, были переданы нашему государству под преданным администрации. Сегодня Германия потребовала, чтобы, по крайней мере, часть африканских колоний Германии была возвращена в свою страну." #NT!
 germany.10013.t: "[From.GetName] отказался от нашего предложения" #NT!
 germany.10013.desc: "После того, как мы предъявили наши требования правительству и пригрозили использовать военную силу, если они отказались, их ответ не был, и они сказали, что не боятся противостоять нам." #NT!
 germany.10013.a: "Мы запомним это" #NT!
 germany.899.t: "Генеалогические исследования" #NT!
 germany.899.desc: "Группа ученых считает, что Фюрер произошел от Габсбурга, но они хотят финансирования для исследований. Что мы должны делать?" #NT!
 germany.890.t: "Генеалогические исследования - фаза 2" #NT!
 germany.890.desc: "Ученые говорят, что они близки к концу исследования, но необходимо больше финансирования." #NT!
 germany.891.t: "Генеалогические исследования - результат" #NT!
 germany.891.desc: "Согласно исследованию, фюрер действительно был из габсбургской линии. Когда мы получили эту новость, фюрер объявил себя королем." #NT!
  
 germany.1100.t: "Революция против NSDAP начинается" #NT!
 germany.1100.d: "Революция началась, и нам нужно выбрать лидера, чтобы возглавить нас, чтобы наша страна не опустилась в хаос." #NT!
 germany.1100.a: "Strasser имеет больше всего смысла" #NT!
 germany.1100.b: "Мы должны попробовать новую идеологию с Дреселом" #NT!
 germany.1100.c: "Подавить революцию, застрелить всех!" #NT!
  
 germany.1101.t: "Смерть Рейнхарда Гейдрих" #NT!
 germany.1101.d: "Рейнхард Гейдрич, командир Главного офиса безопасности Германии Рейха (RSHA), исполняющего обязанности губернатора Протектората Богемии и Моравии и главного архитектора Холокоста, был убит шрапнелью, поданной в его нижней части спины, когда граната взорвалась в атаке на его автомобиль." #NT!
 germany.1101.a: "Покойся с миром" #NT!
  
 germany.1102.d: "Германия погрузилась в гражданскую войну после метеорического роста Генриха Гиммлера и растущего доминирования СС над Вермачтом. Позвонившись консолидации власти Гиммлера и реструктуризацией государства вдоль линий SS, фракция старших офицеров Вермахта, в том числе Вальтер фон Браучич и Вернер фон Фриш, объявили открытое мятеж против нового режима. \ N \ n the Conspirators, опасаясь полной подразделения по -немецки по -немецки, запускаясь по -немецки по всему грубомуртированию, запустив их в качестве навыки, выступив по всему норме. Боевые действия вспыхнули во многих городах, поскольку лояльные силы СС пытаются сокрушить сопротивление. Германия теперь разделена, с одной стороны обещала верность темному видению Гиммлера о Рейхе, а другая борется за сохранение старого военного ордена." #NT!
  
 germany.9989.d: "Сейчас мы испытываем, что совместное руководство не очень хорошо, особенно в военное время, когда есть много разных голосов. Когда нужно принимать решение, это займет много времени, поэтому нам нужно выбрать генерала, который может возглавить нас до конца войны." #NT!
  
 germany_ss_wh_conflict.1.t: "Чиновники Вермахта обеспокоены" #NT!
 germany_ss_wh_conflict.1.d: "С растущими властями подразделений Schutzstaffel в последние дни, Schutzstaffel начал становиться более могущественным в политических и военных областях. Чиновники \ n \ nwhrmacht были обеспокоены этой ситуацией и сказали [GER.GetLeader], что они были укомплектованы этой ситуацией, но они не получили ответа. Проблема в том, что становится больше. Что нужно сделать?" #NT!
 germany_ss_wh_conflict.1.a: "Расширить власти офицеров Вермахта" #NT!
 germany_ss_wh_conflict.1.b: "Очистите одного из командиров Schutzstaffel!" #NT!
