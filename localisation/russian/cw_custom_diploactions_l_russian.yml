l_russian:
 CW_EMBARGO_TITLE:0 "£embargo_texticon£ Наложить эмбарго"
 CW_EMBARGO_ACTION_DESC:0 "Наложить эмбарго на эту страну, которое не позволит им покупать у нас ресурсы.\n\nЭто не запретит нам покупать у них ресурсы, если только они также не наложат эмбарго на нас.\n\n§YПримечание:§! Вы не можете использовать эту опцию для стран с торговым законом §YЗакрытая экономика§!, поскольку эмбарго не будет иметь на них никакого эффекта."
 CW_EMBARGO_LOC:0 "Вы хотите наложить эмбарго на\n\n§Y[From.Getname]?§!\n\nЭто не позволит им покупать у нас ресурсы.\nОни могут принять ответные меры и ввести ответное эмбарго."
 CW_EMBARGO_INITIATED_TITLE:0 "[ROOT.GetAdjective] эмбарго"
 CW_EMBARGO_INITIATED_DESC:0 "§Y[ROOT.GetName]§!\n\nРешила наложить эмбарго на нашу страну.\n\nВ результате этого мы больше не можем покупать у них ресурсы, но они могут свободно покупать у нас, если только мы также не наложим на них эмбарго."
 CW_CANCEL_EMBARGO_TITLE:0 "£unembargo_texticon£ Снять эмбарго"
 CW_CANCEL_EMBARGO_ACTION_DESC:0 "Отменить эмбарго, наложенное нами на эту страну, это позволит им снова торговать с нами ресурсами."
 CW_CANCEL_EMBARGO_LOC:0 "Вы хотите снять эмбарго, наложенное на\n\n§Y[From.Getname]?§!\n\nЭто позволит им свободно торговать с нами.[FROM.UNSC_SANCTIONS_WARNING]"
 CW_CANCEL_EMBARGO_INITIATED_TITLE:0 "[ROOT.GetAdjective] снято эмбарго"
 CW_CANCEL_EMBARGO_INITIATED_DESC:0 "§Y[ROOT.GetName]§!\n\nПриняла решение снять экономическое эмбарго против нас.\n\nЭто улучшит наши отношения и позволит нам покупать у них ресурсы.[CW_CHECK_COUNTER_EMBARGO]"
 CW_WE_ARE_EMBARGO_THEM:0 "\n\n§RПримечание:§! это не отменит автоматически эмбарго, которое мы наложили на них!"
 CW_CHECK_IS_EMBARGOED_BY_US:0 "На нас наложено эмбарго."