 GER_adolf_hitler_desc: "Адольф "Фюрер" Гитлер Рейхсканцлер из Германии, президент NSDAP Reichspräsidident Führer und Reichskanzler, Oberbefhehlshaber. Это дало ему свободу действовать без парламентского разрешения и даже без конституционных ограничений. Согласно его характерной смесью переговоров и запугивания, Гитлер предложил возможность дружественного сотрудничества и пообещал не угрожать Рейхстагу, президенту, государствам или церквям, если бы чрезвычайные полномочия были предоставлены. Номер из-за того, что он допустил в отставку в течение четырех лет. Гитлер немедленно начал устранять полномочия штатов и существование неименных политических партий и организаций. Недонные партии были официально запрещены 14 июля 1933 года, и Рейхстаг был лишен его демократических обязанностей. Гинденбург оставался главнокомандующим армии и сохранил полномочия вести переговоры об иностранных договорах. Закон не нарушал полномочия президента, и Гитлер не достиг полной диктаторской власти до смерти Гинденбурга в августе 1934 года. Только Гитлер в качестве главы государственного государства мог убрать себя главы правительства. Все солдаты приняли клятву Гитлера в день смерти Гинденбурга, поклявшись в «безоговорочном послушании» лично Гитлеру, а не в офисе или нации. Отныне началось время великого фюрера Германии, и теперь настала его очередь управлять Европой." #NT!
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
