 light_tank_chassis_4:0 "Легкая ходовая часть 1944 года"
 light_tank_chassis_4_desc:0 "В связи с тем, что средние танки все чаще выходят на передний план, легкие танки в значительной степени переквалифицировались на вспомогательные роли. Необходима новая конструкция ходовой части, которая будет учитывать потребности этих ролей."
 light_tank_chassis_5:0 "Легкое шасси 1947 года"
 light_tank_chassis_5_desc:0 "По мере того, как основной боевой танк становился все более важным в бою, легкие танки в основном отводились для вспомогательных ролей. Необходим новый дизайн шасси, учитывающий потребности в этих ролях."
 light_tank_chassis_6:0 "Легкое шасси 1950 года"
 light_tank_chassis_6_desc:0 "По мере того, как основной боевой танк становился все более важным в бою, легкие танки в основном отводились для вспомогательных ролей. Необходим новый дизайн шасси, учитывающий потребности в этих ролях."

