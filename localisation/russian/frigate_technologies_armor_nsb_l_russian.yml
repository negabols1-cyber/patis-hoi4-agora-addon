l_russian:
 field_fortifications:0 "Полевые укрепления"
 field_fortifications_desc:0 "Строительство простых и быстрых укреплений прямо на поле боя повысит безопасность наших войск во время обороны."
 armor_organized_march:0 "Организованный марш бронетехники"
 armor_organized_march_desc:0 "Современная бронетехника представляет некоторые сложности для наших войск в плане стратегического перемещения танковых дивизий. Эту проблему можно решить, убедившись в том, что у командиров есть необходимые организаторские навыки."
 armor_training:0 "Подготовка танкистов I"
 armor_training_desc:0 "С появлением основной боевой техники для многих наших бронированных машин мы должны скорректировать обучение и организационную структуру, чтобы убедиться в том, что мы используем ее правильно."
 armor_training2:0 "Подготовка танкистов II"
 armor_training2_desc:0 "Дальнейшее обучение наших войск стратегическому маневрированию бронетанковых дивизий будет очень полезным."
