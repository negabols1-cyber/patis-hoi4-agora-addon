 tech_slat_armor:0 "Решетчатый экран"
 tech_slat_armor_desc:0 "Ряд металлических прутьев или полос, нанесенных на основную броню транспортного средства. Это простой, но эффективный способ защиты транспортного средства от кумулятивных снарядов."

  slat_armor:0 "Решетчатый экран"
  slat_armor_desc:0 "Ряд металлических прутьев или полос, нанесенных на основную броню транспортного средства. Это простой, но эффективный способ защиты транспортного средства от кумулятивных снарядов."

  basic_ventilation:0 "Базовая система вентиляции"
  basic_ventilation_desc:0 "Система вентиляции является важным элементом любого бронемашины. Улучшенная вентиляция обеспечивает дополнительную защиту экипажа от пожароопасных ситуаций и снижает риски удушья и отравления угарным газом."

  improved_ventilation:0 "Улучшенная система вентиляции"
  improved_ventilation_desc:0 "Система вентиляции является важным элементом любого бронемашины. Улучшенная вентиляция обеспечивает дополнительную защиту экипажа от пожароопасных ситуаций и снижает риски удушья и отравления угарным газом."

  advanced_ventilation:0 "Современная система вентиляции"
  advanced_ventilation_desc:0 "Система вентиляции является важным элементом любой бронетехники. Улучшенная вентиляция обеспечивает дополнительную защиту экипажа от пожароопасности и уменьшает риски удушья и отравления экипажа дымом."

  modern_ventilation:0 "Современная система вентиляции"
  modern_ventilation_desc:0 "Система вентиляции является важным элементом любой бронетехники. Улучшенная вентиляция обеспечивает дополнительную защиту экипажа от пожароопасности и уменьшает риски удушья и отравления экипажа дымом."