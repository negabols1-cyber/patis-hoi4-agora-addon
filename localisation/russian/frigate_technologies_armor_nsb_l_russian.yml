 tech_tank_optics_1:0 "Улучшенная танковая оптика"
 tech_tank_optics_1_desc:0 "Оптика нужна для прицельной стрельбы. Чем более она современная, тем реже экипаж танка будет промахиваться, а также быстрее обнаруживать противника."
