 tank_heavy_cannon_4:0 "Тяжелая пушка IV"
 tank_heavy_cannon_4_desc:0 "Орудие, способное вести огонь крупными снарядами. Обладает высокой бронепробиваемостью и неплохой эффективностью по незащищенным целям. Главные недостатки — крупные размеры и стоимость, делающие ее непомерно тяжелой для большинства машин, которые не были специально спроектированы для ее перевозки."
 tank_heavy_cannon_5:0 "Тяжелая пушка V"
 tank_heavy_cannon_5_desc:0 "Орудие, стреляющее крупными снарядами. Обладает исключительно высоким бронепробитием и вполне достойной эффективностью против мягких целей, однако главный недостаток — это огромные габариты и высокая цена. В итоге орудие получается слишком громоздким и дорогм для размещения на машинах, которые не спроектированы специально для него."
 tank_heavy_cannon_6:0 "Тяжелая пушка VI"
 tank_heavy_cannon_6_desc:0 "Орудие, стреляющее крупными снарядами. Обладает исключительно высоким бронепробитием и вполне достойной эффективностью против мягких целей, однако главный недостаток — это огромные габариты и высокая цена. В итоге орудие получается слишком громоздким и дорогм для размещения на машинах, которые не спроектированы специально для него."

 tank_anti_air_cannon_4:0 "Зенитное орудие IV"
 tank_anti_air_cannon_4_desc:0 "Быстрострельное автоматическое орудие, разработанное для борьбы с самолетами. Его потенциал как вспомогательного оружия против наземных целей ограничен."
 tank_anti_air_cannon_5:0 "Зенитное орудие V"
 tank_anti_air_cannon_5_desc:0 "Быстрострельное автоматическое орудие, разработанное для борьбы с самолетами. Его потенциал как вспомогательного оружия против наземных целей ограничен."
 tank_anti_air_cannon_6:0 "Зенитное орудие VI"
 tank_anti_air_cannon_6_desc:0 "Быстрострельное автоматическое орудие, разработанное для борьбы с самолетами. Его потенциал как вспомогательного оружия против наземных целей ограничен."

 tank_heavy_howitzer_2:0 "Тяжелая гаубица II"
 tank_heavy_howitzer_2_desc:0 "Тяжёлая полевая гаубица, установленная на шасси. Основное предназначение — косвенный обстрел мягких целей, но при необходимости может стрелять напрямую. Имеет малый боекомплект бронебойных снарядов, что делает её непригодной для борьбы с танками."
 tank_medium_cannon_3:0 "Средняя пушка III"
 tank_medium_cannon_3_desc:0 "Универсальное орудие, которое хорошо подходит для выполнения самых разных задач. Не является лучшим ни в противопехотной, ни в противотанковой борьбе, но обеспечивает большой запас прочности транспортного средства."
 tank_medium_cannon_4:0 "Средняя пушка IV"
 tank_medium_cannon_4_desc:0 "Универсальное орудие, которое хорошо подходит для выполнения самых разных задач. Не является лучшим ни в противопехотной, ни в противотанковой борьбе, но обеспечивает большой запас прочности транспортного средства."
 tank_medium_cannon_5:0 "Средняя пушка V"
 tank_medium_cannon_5_desc:0 "Универсальное орудие, которое хорошо подходит для выполнения самых разных задач. Не является лучшим ни в противопехотной, ни в противотанковой борьбе, но обеспечивает большой запас прочности транспортного средства."
 tank_rocket_launcher_3:0 "Реактивный гранатомёт III"
 tank_rocket_launcher_3_desc:0 "Реактивный гранатомёт, предназначенный для установки на самоходную бронемашину. Эффективен против мягких целей благодаря большой взрывной силе, но любая бронированная цель, скорее всего, отразит большую часть урона."
 tank_rocket_launcher_4:0 "Реактивный гранатомёт IV"
 tank_rocket_launcher_4_desc:0 "Гранатомёт, предназначенный для установки на самоходную бронетехнику. Эффективен против слабозащищенных целей благодаря огромной взрывной силе, однако нанесёт бронированным целям минимальный урон."
 tank_rocket_launcher_5:0 "Гранатомёт V"
 tank_rocket_launcher_5_desc:0 "Гранатомёт, предназначенный для установки на самоходную бронетехнику. Эффективен против слабозащищенных целей благодаря огромной взрывной силе, однако нанесёт бронированным целям минимальный урон."

 tank_high_velocity_cannon_4:0 "Скорострельная пушка IV"
 tank_high_velocity_cannon_4_desc:0 "Пушка, разработанная специально для достижения высокой дульной скорости. Эффективна против бронированных целей, однако малоэффективна против слабозащищенных целей."
 tank_high_velocity_cannon_5:0 "Скорострельная пушка V"
 tank_high_velocity_cannon_5_desc:0 "Пушка, разработанная специально для достижения высокой дульной скорости. Эффективна против бронированных целей, однако малоэффективна против слабозащищенных целей."
 tank_high_velocity_cannon_6:0 "Скорострельная пушка VI"
 tank_high_velocity_cannon_6_desc:0 "Пушка, разработанная специально для достижения высокой дульной скорости. Эффективна против бронированных целей, однако малоэффективна против слабозащищенных целей."

 tank_auto_cannon_3:0 "Автоматическая пушка III"
 tank_auto_cannon_3_desc:0 "Адаптированная из зенитной скорострельной пушки, эта автоматическая пушка может выпускать шквал огня, опустошающий слабозащищённые цели. Однако её небольшой калибр ограничивает эффективность против бронетехники."
 special_type_slot_5:0 "Слоты размещения брони"
 special_type_slot_5_desc:0 "То, как броня распределена по контуру и силуэту танка. Увеличение брони, безусловно, приведёт к увеличению веса машины, но также и повысит уровень защиты экипажа."
 special_type_slot_6:0 "Слоты размещения трансмиссии"
 special_type_slot_6_desc:0 "Трансмиссия определяет подвижность танка, надёжность на поле боя и его максимальную скорость."
 special_type_slot_7:0 "Слоты размещения оптических приборов"
 special_type_slot_7_desc:0 "Оптические приборы необходимы для прицельных выстрелов. По мере совершенствования этих устройств экипаж танка реже промахивается и более эффективно обнаруживает врага."
 special_type_slot_8:0 "Слоты размещения камуфляжа"
 special_type_slot_8_desc:0 "Краска или приманки, нанесённые на броню, сделают её менее заметной для вражеских войск."
 special_type_slot_9:0 "Слоты установки дополнительного оборудования"
 special_type_slot_9_desc:0 ""
 special_type_slot_10:0 "Слоты размещения дополнительного оборудования"
 special_type_slot_10_desc:0 ""
 special_type_slot_11:0 "Слоты размещения системы вентиляции"
 special_type_slot_11_desc:0 "Система вентиляции — это важнейший элемент бронированного транспорта, отвечающий за надлежащий теплообмен в рамках энергосистемы и поддержание в салоне комфортной температуры, необходимой для выполнения боевых действий экипажем. "
 basic_optic:0 "Базовая оптика"
 basic_optic_desc:0 "Базовое оптическое устройство для бронетехники."
 periscope_optic:0 "Перископная оптика"
 periscope_optic_desc:0 "Усовершенствованное оптическое устройство для бронетехники."
 advanced_optic:0 "Усовершенствованная оптика"
 advanced_optic_desc:0 "Передовое оптическое устройство для бронетехники."

 tank_transmission_geared:0 "Шестерёнчатая трансмиссия"
 tank_transmission_geared_desc:0 "Базовая трансмиссия, широко используемая на бронетехнике. Достаточно надёжна, проста в производстве и обеспечивает хорошую производительность."
 tank_transmission_clutch:0 "Фрикционная трансмиссия"
 tank_transmission_clutch_desc:0 "Фрикционная трансмиссия обеспечивает лучший контроль над движением техники."
 tank_transmission_double_differential:0 "Двухдифференциальная трансмиссия"
 tank_transmission_double_differential_desc:0 "Этот тип трансмиссии считается более передовым. Однако при повышении общей производительности страдает надёжность техники."

 tank_frontal_layout:0 "Фронтальная компоновка"
 tank_frontal_layout_desc:0 "Фронтальная компоновка — самая распространённая схема бронирования для любой бронетехники. Доказала свою эффективность, надёжность и экономическую целесообразность."
 tank_frontal_sides_layout:0 "Фронтально-боковая компоновка"
 tank_frontal_sides_layout_desc:0 "Фронтально-боковая компоновка обеспечивает перераспределение части брони на борта танка, при этом дополнительно укрепляя лоб."
 tank_citadel_layout:0 "Цитадельная компоновка"
 tank_citadel_layout_desc:0 "Иногда устанавливается на тяжелые и сверхтяжелые танки, планировка цитадели по существу распределяет броню по периметру транспортного средства. Это обеспечивает превосходную защиту, но значительно увеличивает производственные затраты."
