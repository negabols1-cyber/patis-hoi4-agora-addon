l_russian:
 saudi.1.t: "Найти партнеров для разведки нефти"
 saudi.1.d: "Нефтяные скважины в нашей стране недостаточно для поддержки нашей экономики, поэтому мы зависим в основном от доходов HAJJ, но мы знаем, что нефтяные запасы в нашей стране гораздо больше, но у нас нет полномочий открывать или извлекать его. Таким образом, нам приходится иметь дело со странами, которые могут сделать это для нас, тот, который принесет нам пользу больше всего и развивает нашу экономику."
 saudi.1.a: "Американцы"
 saudi.1.b: "Британский"
 saudi.1.c: "Немцы"
 saudi.1.f: "Советы"
  
 saudi.2.t: "[From.GetNameDefCap] предлагает договор дружбы"
 saudi.2.d: "[ROOT.GetLeader] встретился сегодня с министром иностранных дел Саудовской Аравии Принца Фейсала в [ROOT.Capital.GetName], чтобы обсудить предложение [SAU.GetAdjective], чтобы подписать договор о дружбе между нашими странами. С помощью этого договора правительство [SAU.GetAdjective] стремится укрепить с нами связи, надеясь в конечном итоге сформировать союз между двумя странами, который позволяет сотрудничать и взаимная поддержка."
 saudi.2.a: "Подписание этого договора принесет пользу обеим странам!"
 saudi.2.b: "Этот договор не в наших интересах."
  
 saudi.3.t: "[From.GetNameDefCap] Знаки договора о дружбе"
 saudi.3.d: "Министр иностранных дел Принц Фейсал вернулся в [SAU.Capital.GetName] сегодня с встречи с [FROM.GetLeader] в [FROM.Capital.GetName], чтобы обсудить предложение о подписи договора о дружбе между [FROM.GetNameDef] и [ROOT.GetNameDef]. В конце встречи сановники из обеих стран подписали договор, но оставили некоторые положения открытыми на будущее, с взаимным желанием не только сохранить, но и расширить эти полезные отношения."
 saudi.3.a: "Это укрепит обе страны"
  
 saudi.4.t: "[From.GetNameDefCap] отвергает договор о дружбе"
 saudi.4.d: "Министр иностранных дел Принц Фейсал вернулся в [SAU.Capital.GetName] сегодня с встречи с [FROM.GetLeader] в [FROM.Capital.GetName], чтобы обсудить предложение о подписи договора о дружбе между [FROM.GetNameDef] и [ROOT.GetNameDef]. К сожалению, [FROM.GetLeader] не показался с энтузиазмом в отношении идеи дружбы [ROOT.GetNameDef] и в конечном итоге отклонил наше предложение."
 saudi.4.a: "Какая трата времени ..."
  
 saudi.5.t: "[FROM.GetNameDefCap] ищет контроль над нашими колониями"
 saudi.5.alt.t: "[FROM.GetNameDefCap] требует наших колоний"
 saudi.5.d: "В результате их сотрудничества с нами [SAU.GetNameDefCap] просят наши колониальные земли в регионе для расширения разведки нефти и обеспечения нам больше нефти. [SAU.GetLeader] сказал, что это в интересах обеих стран, и это сделка, которая должна быть заключена."
 saudi.5.alt.d: "Поскольку [SAU.GetNameDefCap] отбрасывает иго своего прошлого [SAU.GetLeader], стало достаточно нагло, чтобы требовать возвращения наших колониальных владений в этом районе. Объединение субконтинента в одно сильное состояние, кажется, имеет первостепенное значение для новорожденной страны."
 saudi.5.a: "Звучит как сделка"
 saudi.5.b: "Им придется взять это силой"
  
 saudi.6.t: "[From.GetNameDefCap] принимает наше предложение"
 saudi.6.d: "[FROM.GetName] неохотно принял наши требования. Они действительно дают понять, что этот тип политики вручную останется долго и станет жизнеспособным только как небольшое вознаграждение."
 saudi.6.a: "Большой!"
  
 saudi.7.t: "[From.GetNameDefCap] отвергает наше предложение"
 saudi.7.d: "Правительство [FROM.GetAdjective] упорно отказалось передать законные земли, несмотря на неоднократные предупреждения о том, что статус-кво недопустим."
 saudi.7.a: "Нам придется взять это силой тогда"
 saudi.7.b: "У нас есть другие проблемы"
  
 saudi.8.t: "[FROM.GetNameDefCap] требует нашей аннексии"
 saudi.8.d: "Правительство [FROM.GetNameDefCap] хочет, чтобы мы аннексировали, чтобы служить большей цели в соответствии с исламом. Они говорят, что будет легче бороться с неверными, если мы все присоединитесь к Саудовской Аравии, но это также означает сдачу нашу независимость другой стране. Мы не думаем, что это возможно."
 saudi.8.a: "Нечего делать"
 saudi.8.b: "Они бредовые?"
  
 saudi.9.t: "[FROM.GetNameDefCap] принимает наше требование"
 saudi.9.d: "[FROM.GetLeader] [FROM.GetNameDef] решил принять наше предложение об аннексии, и их нация впоследствии станет неотъемлемой частью нашей. Это поможет нам бороться с неверными."
 saudi.9.a: "У них не было реального варианта, кроме как принять."
  
 saudi.10.t: "[FROM.GetNameDefCap] отвергает наш спрос"
 saudi.10.d: "[FROM.GetLeader] [FROM.GetNameDef] решил отклонить наше предложение об аннексии. Глупое решение, если не сказать больше. Как мы должны с ними иметь дело?"
 saudi.10.a: "Мы уничтожим их!"
 saudi.10.b: "Мы поговорим с ними позже"
  
 saudi.11.t: "Огромный нефтяной заповедник обнаружил"
 saudi.11.d: "Сегодня мы получили хорошие новости от наших сотрудников [GetSAUCollaboratorName] о том, что бурение нефтяной скважины Dammam № 7 с помощью [GetSAUCollaboratorCompanyName] дало результаты, а 1585 баррелей нефти были извлечены, и это число, как ожидается, увеличится в ближайшие дни. Согласно статистике, мы свидетельствуем об открытии крупнейшего нефтяного заповедника в мире. Это хорошо обогатит нашу страну и внесет большой вклад в наше развитие. Таким образом, мы можем укрепить нашу страну, открыться до мирового рынка и стать важной страной."
 saudi.11.a: "Это огромное открытие"
  
 saudi.12.t: "Падение Мекки"
 saudi.12.d: "Сегодня, в темное утро [GetYear], самый важный дом, созданный для людей, священный дом в Бекке, источник руководства для всех народов, попал в руки неверных. Недопустимо, что мы только что закончили 400 -летний угнетение и снова потеряли Священную Мекку и Каабу. Честь нашего святого города была нарушена. Это вопрос того, где верные исполнит хадж. Если мы не сможем восстановить наши святые земли до того, как наступит время Хадж, наша экономика влияет на это."
 saudi.12.a: "Газат аль-Атем Лахми, Тумма Атми"
  
 saudi.13.t: "МЕККА НАЗАД"
 saudi.13.d: "О место, где спускается Откровение, о Qibla of Souls, \ nhound много раз кааба плакала о жестокости тирана ... \ n \ nbut, Властелин дома на мгновение не спал, \ nhe разрешил, свободные разбудили с оружием ... \ n \ nat the Long Siege, Mecca был спасен приказом нашего командира! Люди Мекки вышли на улицы со своими шариатскими флагами и чем угодно, что они могли бы получить. Весь исламский мир очень рад, что смог снова выступить с хадж, и паломники уже начали приходить к Умре."
 saudi.13.a: "Облако очистилось, и правый одержал победу."
  
 saudi.14.t: "Падение Дхахрана"
 saudi.14.d: "Согласно последним сообщениям о конфликтах, города Дахран и Даммам упали. Эти важные города также содержали самые большие нефтяные запасы, когда -либо обнаруженные в мире. Если мы не сможем вернуть эти города, наша экономика будет серьезно повреждена, а развитие нашей страны значительно замедлит."
 saudi.14.a: "На фронт!"
 saudi.14.a: "Саботировать нефть"
  
 saudi.15.t: "Дхахран"
 saudi.15.d: "Наши усилия окупились. Нам удалось вернуть города Дхахран и Даммам, где мы должны немедленно начать восстанавливать разрушенную инфраструктуру и перезапустить добычу нефти, как только мы уверены, что враг никогда не придет сюда снова."
 saudi.15.alt.d: "Наши усилия окупились. Нам удалось вернуть города Дхахран и Даммам, где мы должны немедленно начать восстанавливать разрушенную инфраструктуру и перезапустить добычу нефти, как только мы уверены, что враг никогда не придет сюда снова. Но поскольку мы саботировали нефть, для его ремонта займет много времени и стоить много денег."
 saudi.15.a: "Запустите операции немедленно"
  
 saudi.16.t: "[FROM.GetNameDefCap] хочет, чтобы мы присоединились к лиге арабских"
 saudi.16.d: "[FROM.GetLeader] назвал собрание арабских лидеров для обсуждения соглашения, которое принесет пользу всему арабскому миру. Если мы присоединимся к протоколу, чтобы подписаться сегодня, мы будем частью предстоящей Лиги арабских лиг, и в результате у нас будет сильный голос в мире, и мы поможем друг другу развиваться как арабские страны. Мы подписываем?"
 saudi.16.a: "Отличная идея!"
 saudi.16.b: "Мы не будем частью невозможной цели!"
  
 saudi.17.t: "[From.GetNameDefCap] Знаки [GetProtocolCityName] Протокол"
 saudi.17.d: "[FROM.GetLeader] [FROM.GetNameDef] решил подписать протокол. Согласно его заявлению, [FROM.GetLeader] считает, что этот протокол будет способствовать будущему арабского мира и является важным шагом к лучшему будущему для всех нас."
 saudi.17.a: "Для братства народов!"
  
 saudi.18.t: "[FROM.GetNameDefCap] отказывается подписать протокол [GetProtocolCityName]"
 saudi.18.d: "[FROM.GetLeader] [FROM.GetNameDef] отказался подписать протокол. Он покинул зал, сказав, что протокол был невозможной мечтой, что напряжение в мире растет день ото дня и что вскоре будут говорить винтовки, а не соглашения. Перед отъездом он посоветовал нам укрепить наши армии."
 saudi.18.a: "Чуть!"
  
 saudi.19.t: "[FROM.GetNameDefCap] требует независимости на Ближнем Востоке"
 saudi.19.d: "[FROM.GetName] требует, чтобы мы предоставили независимость нашим колониям на Ближнем Востоке. Они говорят, что их цель состоит в том, чтобы каждый араб жил независимо, и они не останутся, пока не достигнут этого. Они говорят, что если мы примем их требования, они начнут работать над увеличением сотрудничества между двумя странами и что мы можем получить очень хорошие экономические выгоды от этого."
 saudi.19.alt.d: "[FROM.GetName] требует, чтобы мы предоставили независимость нашим колониям на Ближнем Востоке. Они говорят, что их цель состоит в том, чтобы каждый араб жил независимо, и они не останутся, пока не достигнут этого. Они сказали, что если мы не примем их требования, последствия будут плохими, и это вызовет у нас много проблем, потому что жители региона также хотят независимости, и если они не будут предоставлены, могут быть беспорядки в регионе."
 saudi.19.a: "Принять запрос и дать независимость"
 saudi.19.b: "Невозможный!"
  
 saudi.20.t: "[FROM.GetNameDefCap] принимает наше требование"
 saudi.20.d: "[FROM.GetName] принял наши требования, заявив, что не было необходимости в напряженности, и предоставил независимость своим колониям на Ближнем Востоке. Они также сказали, что они с нетерпением ждали необходимой работы по увеличению сотрудничества между нашими странами. Это важное достижение для нас."
 saudi.20.a: "Свобода наконец"
  
 saudi.21.t: "[FROM.GetNameDefCap] отвергает наш спрос"
 saudi.21.d: "[FROM.GetName] отклонил наше требование, заявив, что оно было абсурдно и что такая вещь не была бы возможно. Они сказали, что регион находился под крепким контролем, и не было места для беспорядков."
 saudi.21.a: "Запустите операции немедленно"
  
 saudi.22.t: "Арабская Лига учреждения"
 saudi.22.d: "Лига арабских лиги была официально создана. Мы являемся одним из основателей лиги, так как мы являемся одним из подписавшихся протокола [GetProtocolCityName]. Нам нужно продолжить это сотрудничество и оставить лучшую страну для будущих поколений. Мы надеемся, что это будет хорошим развитием для всего арабского мира."
 saudi.22.a: "Нас ждет светлое будущее"
  
 saudi.23.t: "[SAU.GetName] требует объединения арабского языка"
 saudi.23.d: "В смелом дипломатическом шаге [SAU.GetName] призвал к объединению Аравийского полуострова под одним штатом. Они считают, что это укрепит регион против иностранных угроз и увеличит сотрудничество между арабскими народами. Тем не менее, это будет означать уступить национальный суверенитет в Эр -Рияде."
 saudi.23.a: "Единство - это сила, мы примем"
 saudi.23.b: "Наша независимость не подлежит обсуждению!"
  
 saudi.24.t: "[SAU.GetName] требует объединения в рамках федерации"
 saudi.24.d: "[SAU.GetName] предложил новую политическую модель для региона: федерация арабских государств под их руководством. В то время как это предлагает некоторую автономию, настоящая власть будет отдыхать в Эр -Рияде. Некоторые рассматривают это как путь к единству, другие как завуалированная аннексия."
 saudi.24.a: "Мы принимаем эту федерацию за большее блага"
 saudi.24.b: "Мы отвергаем эту империалистическую маскировку!"
  
 saudi.25.t: "[From.GetNameDefCap] принять объединение"
 saudi.25.d: "[From.GetNameDef] согласился объединиться с нами. Это историческое решение знаменует собой новую главу для Аравийского полуострова, приближая нас к мечте Объединенной Аравии."
 saudi.25.a: "Сильнее вместе"
  
 saudi.26.t: "[From.GetNameDefCap] отклонить объединение"
 saudi.26.d: "[From.GetNameDef] отклонил наше предложение об объединении. Эта неудача показывает, что не все готовы отказаться от своих личных амбиций ради арабского единства."
 saudi.26.a: "Они смешны!"
  
 saudi.27.t: "Король Абдулазиз заболеет"
 saudi.27.d: "Король Абдулазиз внезапно сильно заболел, и его состояние быстро ухудшается. Врачи боятся худшего, так как варианты лечения кажутся ограниченными. Нация затаила свое дыхание в качестве монарха -основателя, объединяющего Аравии, сражается за загадочную и агрессивную болезнь. С выведением в нет, внимание внимание обращается к наследному принцу Сауд бин Абдулазиз Аль -Сауд, который, как ожидается, возьмет на себя лидерство, если ситуация ухудшится."
 saudi.27.a: "Мы должны сделать все возможное, чтобы вылечить его"
  
 saudi.28.t: "Смерть короля Абдулазиза"
 saudi.28.d: "Король Абдулазиз умер. Человек, который объединил племена, выкинул королевство из пустыни и стоял высоко, несмотря на шансы - больше нет. Его прохождение наступает в хрупкий момент, так как нация все еще формирует свое будущее на основаниях, которые он заложил. Но государственные дела не останавливаются на трауре. Трон теперь переходит к своему сыну, наследному принцу Сауду, чье правление начинается в длинной тени его отца. В мире наблюдает. То, что будет дальше, определит судьбу Аравии."
 saudi.28.a: "Мы должны стоять в этот темный день"
  
 saudi.29.t: "[GetProtocolCityName] Протокол"
 saudi.29.alt.t: "Протокол Эр -Рияда"
 saudi.29.d: "В самом сердце арабского мира написана новая глава. [SAU.GetLeader], наряду с делегатами из различных арабских стран, собрался в [GetProtocolCityName], чтобы подписать историческое соглашение - протокол, направленный на объединение арабского мира в целях, защите и процветании. Это больше, чем просто лист бумаги; Это проявление видения, которое давно мечтает пан-арабисты, поэты, ученые и революционеры. Однако некоторые опасаются, что такое соглашение может поставить под угрозу национальный суверенитет или расширить возможности доминирующих государств за счет других. Тем не менее, вес истории дает вниз: оставаться разделенным может означать, чтобы оставаться уязвимым."
 saudi.29.a: "Мы подписам и приведем арабский мир в новую эру!"
 saudi.29.b: "Наш путь - наш собственный"
  
 saudi.30.t: "[From.GetNameDefCap] вмешательство во внутренней политике"
 saudi.30.d: "[From.GetNameDefCap] обратился к происламистским и антимонархистским элементам иранского правительства и под землей с планами убийства [ROOT.GetLeader] и установить исламистское правительство. Саудовцы гарантируют нам, что они могут справиться с убийством; Все, что нам нужно сделать, это подтвердить нашу готовность создать правительство замены и обещать нашу будущую военную поддержку Саудовским начинаниям."
 saudi.30.a: "Мы должны смотреть на ислам в будущем."
 saudi.30.b: "Нелепо! Мы никогда не откажемся от наших путей!"
  
 saudi.31.t: "Иранцы принимают предложение об переводе"
 saudi.31.d: "Элементы в иранском правительстве и подполье приняли наше предложение о перевороте. Они готовится к быстрому вынуждению власти, как только произошло убийство. Но они указали, что, поскольку мы имеем разные религиозные ветви, и даже если король успешно убит, существует высокая вероятность гражданской войны, потому что сын короля не может легко передать власть."
 saudi.31.a: "Мы можем привести наши планы в движение."
  
 saudi.32.t: "Иранцы отклоняют предложение об переводе"
 saudi.32.d: "Элементы иранского правительства и подполья, с которыми мы связались, сказали нам, не слишком мягкими, что они не заинтересованы в нашем предложении о перевороте. Они угрожали раскрыть наши планы правительству Ирана, если мы посмелимся сделать то же самое предложение снова."
 saudi.32.a: "Как неудачно."
  
 saudi.34.t: "[?global.arabian_supporting_country.GetNameDef] Запрос распознавание [?global.arabian_revolt_country.GetNameDef]"
 saudi.34.d: "[?global.arabian_supporting_country.GetLeader], лидер [?global.arabian_supporting_country.GetNameDef], запросил немедленное прекращение войны с повстанцами [?global.arabian_revolt_country.GetAdjective]. Дипломаты [?global.arabian_supporting_country.GetAdjective] поощряют [ROOT.GetName] распознавать независимость [?global.arabian_revolt_country.GetNameDef]. Они явно не утверждают, что [?global.arabian_supporting_country.GetNameDef] пойдет на войну, если мы решим отказаться, но они явно намекают на эту возможность."
 saudi.34.a: "Они правы, мы должны положить конец этому колониальному конфликту сейчас"
 saudi.34.b: "Война закончится, когда [?global.arabian_revolt_country.GetNameDef] будет побежден"
  
 saudi.35.t: "[?global.arabian_supporting_country.GetAdjective] Посредничество успешно!"
 saudi.35.d: "[?global.arabian_supporting_country.GetLeader], лидер [?global.arabian_supporting_country.GetNameDef], успешно вел переговоры с [?global.arabian_colonial_country.GetLeader] от нашего имени. [?global.arabian_colonial_country.GetLeader] согласился распознать независимость [ROOT.GetAdjective] и заказал прекращение военных действий между [?global.arabian_colonial_country.GetNameDef] и [ROOT.GetNameDef]. [ROOT.GetNameDefCap] всегда будет обязан [?global.arabian_supporting_country.GetNameDef] за их помощь в нашей борьбе."
 saudi.35.a: "Свобода наконец"
  
 saudi.36.t: "[FROM.GetNameDefCap] отказывается распознавать [?global.arabian_revolt_country.GetAdjective] независимость"
 saudi.36.d: "Несмотря на наше давление, правительство [?global.arabian_colonial_country.GetAdjective] отказывается распознавать [?global.arabian_revolt_country.GetNameDef] и прекратить военные действия. [?global.arabian_colonial_country.GetAdjective], кажется, настроен на уничтожение движения независимости. Это, вероятно, насколько мы можем получить только с дипломатией."
 saudi.36.a: "Мы пробовали хотя бы"
 saudi.36.b: "Тогда мы должны сделать их"
  
 saudi.37.t: "[FROM.GetName] присоединяется к войне против [?global.arabian_colonial_country.GetName]"
 saudi.37.d: "После попытки посредничества в нашей войне против [?global.arabian_colonial_country.GetNameDef] и потерпели неудачу, [?global.arabian_supporting_country.GetNameDef] решил активно начать поддержку борьбы [ROOT.GetAdjective]. Посол [?global.arabian_colonial_country.GetAdjective] в [?global.arabian_supporting_country.GetName] был проинформирован о том, что с этого момента [?global.arabian_supporting_country.GetNameDef] рассматривается на войне с [?global.arabian_colonial_country.GetName], пока [?global.arabian_colonial_country.GetNameDef] не отдает свои империалистические и колониальные амбиции в Африке и в других местах."
 saudi.37.a: "Силы [ROOT.GetName] и [?global.arabian_supporting_country.GetName] Стенд объединены!"
  
 saudi.38.t: "Свобода для [FROM.GetNameDef]"
 saudi.38.d: "После сильного дипломатического давления от [ROOT.GetName], включая прямые встречи между [ROOT.GetLeader] и [?global.arabian_colonial_country.GetLeader], правительство [?global.arabian_colonial_country.GetAdjective] решило отступить и признать независимость [?global.arabian_revolt_country.GetAdjective]. \ nthanks для направления вмешательства [ROOT.GetAdjective] война за независимость [?global.arabian_revolt_country.GetAdjective] наконец закончилась. [?global.arabian_revolt_country.GetNameDefCap] - это свободная страна, и [ROOT.GetLeader], безусловно, навсегда станет героем в [?global.arabian_revolt_country.GetNameDef]."
 saudi.38.a: "Другая страна освободилась от империалистов"
  
 saudi.41.t: "Нефтяное соглашение о Саудовской Аравии"
 saudi.41.d: "Нефтяное соглашение было предложено между Саудовской Аравией и Германией, сосредоточенное на взаимных выгодах посредством торговли и обмена технологиями. В случае принятия это может повысить обе экономики и укрепить их геополитический альянс."
 saudi.41.a: "Это соглашение поможет как Германии, так и Аравии."
 saudi.41.b: "Ненужная сделка"
  
 saudi.42.t: "[From.GetNameDefCap] принимает наше предложение"
 saudi.42.d: "Нефтяное соглашение было принято. Сотрудничество между нашими странами начнется немедленно, обещание процветания и более тесных связей."
 saudi.42.a: "Важное развитие для нас"
  
 saudi.43.t: "[FROM.GetNameDefCap] отвергает наше предложение"
 saudi.43.d: "Наше предлагаемое нефтяное соглашение было отклонено. Это может препятствовать будущим дипломатическим усилиям и ослабить экономические отношения."
 saudi.43.a: "Несчастные новости"
  
 saudi.44.t: "[FROM.GetNameDefCap] ищет секретный договор"
 saudi.44.d: "Один из наших скрытых агентов, размещенных в [FROM.capital.GetCapitalVictoryPointName], приблизился с предложением от правительства [FROM.GetAdjective]; Секретный пакт между нашей фракцией и [FROM.GetNameDef], который будет означать, что они помогут нам подрывать наших врагов в Европе, сохраняя при этом их появление нейтралитета и даже отказаться от него в нашу пользу, когда придет время."
 saudi.44.a: "Они будут отличным активом"
 saudi.44.b: "Нам не нужна их помощь"
  
 saudi.45.t: "[FROM.GetNameDefCap] принял наш секретный договор"
 saudi.45.d: "Благодаря нашим ответным устройствам с [FROM.GetNameDef] мы подтвердили, что они согласились с предлагаемым нами секретным альянсом. С этого момента они будут поддержать своих врагов и защитить нас, если мы когда -нибудь окажемся на грани вторжения. Это не означает, что мы в безопасности, хотя враг может раскрыть наши действия и рассматривать их как угрозу, поэтому мы должны продолжать с той же осторожностью, которую мы показали до сих пор, пока мы готовимся к тому, чтобы вступить в действие."
 saudi.45.a: "Это ради нашей демократии!"
  
 saudi.46.t: "[FROM.GetNameDefCap] отклонил наше предложение!"
 saudi.46.d: "Страшные новости из наших контактов в [FROM.GetCapitalVictoryPointName]. Похоже, что правительство [FROM.GetAdjective] отклонило наше предложение о секретном договоре, оставив нас в результате вторжения со стороны наших соседей. Теперь мы должны подготовиться к защите себя или искать другой путь, чтобы сохранить нашу независимость и демократию."
 saudi.46.a: "Мы стоим в одиночестве против наших врагов."
  
 saudi.47.t: "Рабы вызывают беспорядки"
 saudi.47.d: "Долгое время мы должны были внести новое регулирование рабства, но мы этого не сделали. В результате рабы в нашей стране больше не могли нести условия и начали вызывать проблемы. Поскольку мы используем рабов во многих областях, если мы не регулируем эту проблему немедленно, это может вызвать у нас проблемы в будущем."
 saudi.47.a: "Мы подумаем об этом"
  
 saudi.48.t: "[FROM.GetNameDefCap] Защита запроса от нас"
 saudi.48.d: "Правительство Саудовской Аравии официально запросило защиту от Соединенных Штатов. Несмотря на их ограниченные военные возможности, Саудовская Аравия является одним из самых важных в мире поставщиков нефти и оказывает значительное геополитическое влияние на Ближнем Востоке. Признавая растущие региональные угрозы и нестабильность, теперь они ищут американскую поддержку, чтобы обеспечить их суверенитет и продолжающийся поток нефти. Мы должны решить защитить это пустынное королевство, достойное обязательства?"
 saudi.48.a: "Мы должны защитить наших союзников"
 saudi.48.b: "Мы не можем выделить ресурсы для этого"
  
 saudi.49.t: "Соединенные Штаты принимают запрос на защиту"
 saudi.49.d: "Соединенные Штаты официально согласились с нашей просьбой о защите. Американские чиновники процитировали жизненно важную роль Саудовской Аравии в глобальной стабильности нефти и ее стратегическое положение на Ближнем Востоке. Хотя наши силы ограничены, этот альянс сигнализирует о мощном сдерживании любой региональной агрессии. Американские советники, оборудование и военные гарантии скоро появятся, и вместе с ними начинается новая глава в нашем международном положении."
 saudi.49.a: "Сильнее вместе"
  
 saudi.50.t: "Соединенные Штаты отрицают запрос на защиту"
 saudi.50.d: "Наша просьба о защите американской защиты была отклонена. Несмотря на наше стратегическое значение как богатой нефтью нации, Вашингтон решил не вмешиваться от нашего имени. Они претендуют на ограниченные возможности и конкурирующие глобальные приоритеты. Без их щита мы остаемся открытыми и теперь должны найти другие способы защиты нашего суверенитета во все более враждебном регионе."
 saudi.50.a: "Мы не ожидали этого"
  
 saudi.51.t: "[SAU.GetNameDefCap] под атакой"
 saudi.51.d: "Наши союзники, [SAU.GetNameDef] оказались под прямой атакой. [?SAU.agressor_country_var.GetName] объявил войну, угрожая стабильности всего Ближнего Востока. В соответствии с соглашением о защите, которое мы подписали, мы теперь обязаны ответить. Саудовская Аравия может быть ограничена в рабочей силе, но ее роль в качестве мирового поставщика нефти и стратегического партнера не может быть переоценена. Если нам не удастся действовать, мы рискуем потерять как влияние, так и достоверность в регионе. Мы поддерживаем свое слово и защищаем нашего союзника?"
 saudi.51.a: "Мы будем сдерживать свое обещание и поможем им"
  
 saudi.52.t: "Соединенные Штаты приходят на нашу помощь"
 saudi.52.d: "Наш враг внес войну в наш порог, но мы не одиноки. Соединенные Штаты, в честь Пакта защиты, объявили войну нашим агрессорам и привержены нашей защите. Американская поддержка меняет все. Их военная сила и глобальный охват посылают четкое сообщение. Подкрепление уже находится в движении, и готовится совместная команда. Сегодня воздух пахнет войной и свободой, но и надеждой."
 saudi.52.a: "С ними рядом с нами, у нас есть шанс"
  
 saudi.53.t: "[FROM.GetNameDefCap] требует нейтралитета на войне"
 saudi.53.d: "На фоне растущей региональной напряженности [FROM.GetNameDef] официально просило, чтобы мы оставались нейтральными в разворачивающемся конфликте. Их дипломаты подчеркнули стратегическую важность Баба Эль-Мандеба узкого пролива, который соединяет Красное море с Аденским заливом. Любые враждебные силы, получающие доступ к этой точке, представляют серьезную угрозу для судоходных полос и суэцкого канала. Они настаивают на том, что наше согласование с их врагами не только подвергало бы опасности их положение, но и нарушит стабильность всего региона. Уважаем ли мы их просьбу или наметить наш собственный курс?"
 saudi.53.a: "Нейтралитет - лучший вариант для нас тоже"
 saudi.53.b: "Они не могут сказать нам, что делать!"
  
 saudi.54.t: "[From.GetNameDefCap] принимает наше требование"
 saudi.54.d: "[From.GetNameDef] согласился оставаться нейтральным в конфликте. Их правительство заявило, что Йемен не заинтересован в том, чтобы стать полем битвы, особенно вблизи пролива Баб Эль-Мандеб ключевым водным путем для мировой торговли. Эта дипломатическая победа гарантирует, что южные ворота в Красное море на данный момент остаются безопасными."
 saudi.54.a: "Облегчение для нашей военно -морской стратегии"
  
 saudi.55.t: "[FROM.GetNameDefCap] отвергает наш спрос"
 saudi.55.d: "[FROM.GetNameDef] отказался от нашего запроса о нейтралитете. Чиновники в Сане заявили, что они не будут оказывать давление на представление и что Йемен будет действовать в соответствии с его собственными интересами. Это неповиновение рискует безопасностью Баба Эль-Мандеба и, соответственно, доступа к Красному морю и Суэцкому каналу. Последствия могут быть серьезными, если враждебные силы закрепляются там."
 saudi.55.a: "Они будут сожалеть об этом безрассудстве"
  
 saudi.56.t: "[YEM.GetName] нарушает свой нейтралитет"
 saudi.56.d: "Несмотря на предыдущие гарантии, [YEM.GetNameDef] отказался от своей нейтральной позиции и выровнялся с нашими врагами. Их решение непосредственно угрожает контролю над Баб Эль-Мандеб критической морской точки зрения, которая предоставляет доступ к Красному морю и Суэцкому каналу. Это предательство может усложнить военно -морские операции союзников и дать нашим противникам стратегическое преимущество в регионе."
 saudi.56.a: "Там будет цена на это предательство!"
 saudi.56.b: "У нас нет времени, чтобы справиться с ними"
  
 saudi.57.t: "Засуха поражает сердце Аравии"
 saudi.57.d: "Неупомянутая засуха обосновалась над сердцем Аравии. В NEJD Уэллс высушил, пастбища превратились в пыль, а урожай прошел. Сельские общины бегут к городским центрам, и среди кочевых племен растет отчаяние. Наше все еще хрупкое состояние не хватает инфраструктуры для обеспечения эффективного облегчения. Король Абдулазиз заказал помощь через религиозные и племенные сети, но формируются трещины. Если небо остается молчаливым, голод и беспорядки могут распространяться как лесной пожар."
 saudi.57.a: "Будем надеяться, что дождь вернется, пока не стало слишком поздно."
  
 saudi.58.t: "Рабы снова вызывают беспорядки"
 saudi.58.d: "Несмотря на предыдущие волнения и последующие предупреждения, наше правительство еще не предприняло никаких значимых действий для решения проблемы рабства. Слухи в настоящее время распространяются среди племенных земель, а также в городах шепчет скоординированного неповиновения, организованных сбег и даже восстания. Любая дальнейшая нестабильность может поставить под угрозу нашу легитимность дома и за рубежом. Окончательное решение должно быть принято, пока не стало слишком поздно."
 saudi.58.a: "Мы не можем позволить себе игнорировать это снова"
  
 saudi.59.t: "[FROM.GetName] требует независимости для арабских меньшинств"
 saudi.59.d: "[FROM.GetName] выпустил официальный дипломатический спрос, призывая нас полностью независимости для нашего арабского населения. Их правительство утверждает, что представляет интересы всех арабов и настаивает на том, что дальнейший контроль над этими регионами является формой несправедливого подавления. Хотя тон спроса является мирным и идеологическим, он имеет четкое геополитическое давление. Принятие будет означать потерю территории, но отклонение может спровоцировать региональное напряжение. Выбор наш."
 saudi.59.a: "Мы узнаем их независимость"
 saudi.59.b: "Мы отвергаем это вмешательство в наши дела"
  
 saudi.60.t: "[From.GetNameDefCap] предоставляет независимость на арабские меньшинства"
 saudi.60.d: "[From.GetNameDef] принял наше требование и предоставила полную независимость своему арабскому населению. Знамена свободы поднимаются через их бывшие колонии, и наше видение Объединенного Арабского будущего приближается. Эти недавно независимые страны смотрят на нас с благодарностью и, возможно, альянсом."
 saudi.60.a: "Шаг вперед для освобождения арабского"
  
 saudi.61.t: "[From.GetNameDefCap] отвергает наш спрос"
 saudi.61.d: "[From.GetNameDef] прямо отклонил наш призыв освободить их арабское население. Этот отказ не только подрывает наше региональное видение, но и открыто отрицает права наших родственников по всему морю. Слово этого оскорбления быстро распространяется среди интеллектуалов, племен и даже наших вооруженных сил. Теперь мы сталкиваемся с трудным решением о том, как мир и протест через дипломатию или сами возглавляем обвинение и освобождаем их силой."
 saudi.61.a: "Мы освободим наших братьев любыми необходимыми средствами!"
 saudi.61.b: "Мы еще недостаточно сильны ... но наступит день"
  
 saudi.62.t: "Страна -члена запрашивает гражданские инвестиции"
 saudi.62.d: "Хотя [FROM.GetName] в настоящее время является неотъемлемой частью нашего штата, представители его бывшего административного органа - в настоящее время активно в Федеральном совете - обратились к нам об инвестировании в гражданскую инфраструктуру своего региона. Они утверждают, что путь к стабильной и Объединенной арабской федерации заключается не только в централизованной власти, но и в справедливом региональном развитии. Поддержка этих усилий укрепит федеральное единство, но отвлечь некоторые из наших собственных ресурсов."
 saudi.62.a: "Они правы, мы должны инвестировать в каждый угол федерации"
 saudi.62.b: "Сейчас не время, когда наши приоритеты лежат в другом месте"
  
 saudi.63.t: "Члена страна запрашивает военные инвестиции"
 saudi.63.d: "Делегаты, представляющие [FROM.GetName] в Федеральном комитете обороны, призвали к строительству военных заводов на их территории. Хотя теперь под нашей полной властью, их регион остается стратегически важным - и их лидеры утверждают, что он не должен оставаться в процессе переворота. Инвестирование в этот регион продемонстрирует нашу приверженность равным защитным возможностям по всей Федерации, но будет стоить нашего собственного производства."
 saudi.63.a: "Пусть каждая часть федерации будет готова к войне"
 saudi.63.b: "Их защита может подождать, мы должны сначала объединить"
  
 saudi.65.t: "Король Абдулазиз восстанавливается"
 saudi.65.d: "То, что опасалось, что это конец эпохи, приняло чудесный поворот. Против ожиданий его врачей и советников король Абдулазиз полностью выздоровел. Лихорадка сломалась, и его сила возвращается изо дня в день. Новости о выживании короля принесли огромное облегчение дворцу, правительству и народу. На данный момент линия преемственности отступает на задний план, и королевство остается под властью его основателя монарха. Хотя кризис показал нашу уязвимость, он также напомнил нам о устойчивости человека, который построил Аравию из песков."
 saudi.65.a: "Давно живи король!"
  
 saudi.66.t: "Тень растет в Аравии"
 saudi.66.d: "Отчеты со всей границы показывают, что Амин аль-Хуссеини нашла убежище в Саудовской Аравии. В то время как его публичное присутствие остается тихим, слухи указывают на более глубокий план в движении - тот, который включает в себя возбуждение беспорядков в наших собственных границах. Хотя еще ничего конкретного не появилось, простое присутствие муфтий в Эр -Рияде является причиной для беспокойства."
 saudi.66.a: "Мы должны оставаться бдительными"
  
 saudi.67.t: "Новая арабская власть в Палестине"
 saudi.67.alt.t: "Падение режима"
 saudi.67.d: "Внезапная волна восстаний, скоординированная проарамными силами, прошла через палестинские территории. Существующий контроль рухнул под давлением народных волнений. После последствий новое правительство, возглавляемое Амином аль-Хуссеини, объявило себя законной властью-под защитным крылом Саудовской Аравии."
 saudi.67.alt.d: "На фоне растущих волнений и переломов в нашей политической структуре широко восстановилось. Революционеры, поддержанные идеологически и материально Саудовской Аравией, захватили власть и объявили новое правительство. Амин аль-Хуссеини принял лидерство, и теперь государство тесно связано с видением Эр-Рияда к региону."
 saudi.67.a: "Регион упал на арабское влияние"
  
 saudi.68.t: "Победа в Палестине"
 saudi.68.d: "Наша поддержка принесла фрукты. Пожары революции охватили старый режим в Палестине, и под руководством Амина аль-Хуссеини в настоящее время поднимается новая арабская администрация. С поднятыми и лояльными знаменами они выровнялись под нашей защитой. Призыв к арабскому единству нашел еще один голос - и он говорит из Иерусалима."
 saudi.68.a: "Еще один шаг к нашему видению арабского мира."
  
 saudi.69.t: "Грохот в Святой Земле"
 saudi.69.d: "Недавний интеллект предполагает растущее место волнения на бывших палестинских территориях. Шепот координации, движения оружия и идеологического возбуждения указывают на внешнее участие с пальцами, четко направленными на Саудовскую Аравию. Хотя ничего не подтверждено, схема тревожно знакома: где идет Амин аль-Хуссеини, революция имеет тенденцию следовать."
 saudi.69.a: "Мы должны держать глаза на земле."
  
 saudi.70.t: "Общенациональные протесты труда"
 saudi.70.d: "То, что началось как изолированные жалобы на нефтяных месторождениях, быстро распространилось по всему королевству. Арабские работники из разных секторов присоединились к движению, протестуя против резкого несоответствия в условиях оплаты труда между собой и советскими специалистами, занятыми в наших проектах развития. Песны за достоинство, равенство и реформу теперь повторяются от городских мастерских в пустынные города. Протесты с каждым днем ​​растут громче, и, если не решаются быстро, они могут спираться в более широкий кризис."
 saudi.70.a: "Мы больше не можем позволить себе игнорировать эти волнения."
  
 saudi.71.t: "Красный король"
 saudi.71.d: "По мере того, как советские советники становятся более смелыми в своих требованиях, дворец начал тихо осуществлять реформы, которые давно считаются немыслимыми. Ограничения, основанные на законе шариата, ослабляются. Влиятельные священнослужители оказываются в стороне. Шепот распространился, что король слушает больше иностранных рабочих, чем с верующими. На улицах некоторые называют его «Красным Королем» - горьким прозвищем, которое сигнализирует о расширяющемся разрыве между правителем и управляемым. В глазах многих он больше не является хранителем традиции, а весом нового и незнакомого порядка."
 saudi.71.a: "Цена прогресса никогда не бывает дешевой."
  
 saudi.72.t: "Новый порядок в Аравии"
 saudi.72.d: "В смелом и беспрецедентном шаге король Абдулазиз был удален из власти. Вознички королевства теперь отдыхают в руках Карима Хакимова, когда -то был советским дипломатом, ныне политическим архитектором революционной Аравии. В обмен на стабильность и советское признание, новая администрация предоставила СССР полный доступ к военному транзиту и портовым объектам по всему королевству. В то время как некоторые празднуют рассвет прогресса, другие шепчут, что Аравия стала чуть больше, чем спутниковая, накированная красным."
 saudi.72.a: "Новый рассвет поднимается над пустыней."
 saudi.72.b: "Они подают дело лучше как спутник."
  
 saudi.73.t: "Верный партнер"
 saudi.73.d: "По мере того, как новый социалистический порядок стабилизируется, наше выравнивание с Москвой стало сильнее. Советские консультанты играют важную роль в формировании политики, надзор за логистикой и обеспечению нашего долгосрочного развития. В то время как мы остаемся суверенной нацией по имени, влияние наших северных товарищей является одновременно видимым и глубоким. Некоторые считают это необходимым шагом к глобальной солидарности, которые, как интересно, задаются, когда мы можем сформировать свой собственный путь в социалистической семье."
 saudi.73.a: "На данный момент сотрудничество - это сила."
  
 saudi.74.t: "[From.GetNameDefCap] Апелляции по автономии"
 saudi.74.d: "Несмотря на то, что они стремятся продолжать доказать свою лояльность и внести свой вклад в революцию, представители [From.GetAdjective] обратились за своим делом об увеличении автономии. Они утверждают, что, если мы немного ослабить бразды правления, они смогут намного лучше помочь нашему делу."
 saudi.74.a: "Они заслужили наше доверие."
 saudi.74.b: "Но держать поводья плотных еще лучше."
  
 saudi.75.t: "[From.GetNameDefCap] предоставляет автономию"
 saudi.75.d: "Наши представители в [From.GetNameDef] сообщают нам, что правительство [From.GetAdjective] считается пригодным для предоставления нам большей автономии."
 saudi.75.a: "Прогресс!"
  
 saudi.76.t: "[From.GetNameDefCap] отвергает автономию"
 saudi.76.d: "Наши представители в [From.GetNameDefCap] сообщают нам, что правительство [From.GetAdjective] отклонило нашу апелляцию на большую автономию."
 saudi.76.a: "Разве они нам не доверяют?"
  
 saudi_news.1.t: "[GetProtocolCityName] Протокол подписан"
 saudi_news.1.alt.t: "Протокол Эр -Рияда подписан"
 saudi_news.1.d: "На историческом саммите, состоявшемся в [GetProtocolCityName], представители арабских стран собрались под руководством [SAU.GetLeader], чтобы подписать то, что сейчас называется протоколом [GetProtocolCityName]. Это соглашение закладывает основу для арабского блока - в военном, экономическом и культурном отношении. Саммит был отмечен страстными речами и коллективным видением арабского мира, который станет одним из них перед лицом иностранного доминирования. [SAU.GetLeader] провозгласил, что «эпоха фрагментации закончилась; Рассвет арабского единства начался ». Несмотря на то, что многие страны подписали протокол и приняли этот новый альянс, некоторые государства отказались присоединиться, выразив обеспокоенность по поводу суверенитета и регионального влияния. Станет ли это соглашение краеугольным камнем нового арабского века или недолговечной мечты, будет определено в ближайшие годы."
 saudi_news.1.a: "Новая эра начинается для арабского мира"
 saudi_news.1.b: "Амбициозный шаг и только время даст свой успех"
  
 saudi_news.2.t: "Соединенные Штаты вмешиваются в защиту Саудовской Аравии"
 saudi_news.2.d: "В драматической эскалации Соединенные Штаты объявили войну на [?SAU.agressor_country_var.GetName] после нападения на Саудовскую Аравию. Белый дом призвал к недавнему соглашению о защите, подписанном с Эр -Риядом, заявив, что «нападение на Саудовскую Аравию - это нападение на саму стабильность». По сообщениям, мобилизуются на американские войска, а воздушные и военно -морские активы уже были развернуты в регионе. Это вмешательство преобразует то, что могло бы быть региональным конфликтом в глобальную точку вспышки, поскольку Вашингтон ясно дает понять, что он не отказатся от своих союзников, особенно такого, что является жизненно важным для глобального нефтяного снабжения и стратегического баланса, как Саудовская Аравия. Всемирные столицы сейчас внимательно следят: пустыня сжигает, и сверхдержава вошла в драку."
 saudi_news.2.a: "Линии нарисованы, и война наступила"
 saudi_news.2.b: "Другая империалистическая война под знаменем «свободы»"
  
  
  
  
  
  
  
  
  
  
  
