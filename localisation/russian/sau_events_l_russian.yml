 arabia.85.t: "Попытка убийства на Абдулазиз"
 arabia.85.d: "Абдулазиз был застрелен в плечо неопознанным человеком, обращаясь к общественности в полдень. Сразу после того, как выстрелы были услышаны, охранники заметили человека и нейтрализовали его, но было слишком поздно. Абдулазиза быстро доставили в больницу. Что мы будем делать сейчас?"
 arabia.85.a: "Мы должны воспользоваться путаницей."
 arabia.85.b: "Люди и армия поддерживают наследного принца."
 arabia.85.c: "После долгой борьбы врачи спас нашего лидера!"
  
 arabia.86.t: "Давно живи, наш король!"
 arabia.86.d:0 "Our king Saud is now used to his throne and is now completely ready. 
 arabia.86.a: "Давно живи, наш король!"
  
 arabia.87.t: "Приглашение в Лигу арабских лиги"
 arabia.87.d: "Стремясь укрепить Лигу арабских лиг, содержащая возможное возрождение агрессивного экспансионизма, Саудовская Аравия попросила, чтобы мы присоединились к ним в альянсе, стремящемся объединить эти нации."
 arabia.87.a: "С радостью. Лига арабских лиги должна быть расширена."
 arabia.87.b: "[Root.GetName] идет по своему собственному пути."
 arabia.88.t: "[From.GetName] присоединяется к арабской фракции"
 arabia.88.d: "Наш план, чтобы помешать Лиге арабских лиг от разваливания и от нас вдали от нас, - это прогресс. [From.GetLeader] утверждает наши усилия и принял наше приглашение в альянс."
 arabia.88.a: "Мы на шаг ближе к восстановлению Объединенной Арабской Республики"
 arabia.89.t: "[From.GetName] отказывается присоединиться к лиге арабских"
 arabia.89.d: "Несмотря на все наши усилия по оказанию поддержки Лиге арабских лиг, наша последняя попытка связаться с одной из наций была встречена скептицизмом. [From.GetLeader] отказался присоединиться к альянсу, возможно, сомневаюсь в наших мотивах, или, возможно, обеспокоено тем, что слишком близко к нам выровняется с нами."
 arabia.89.a: "Они уже могут быть целью для всего, что они знают!"
  
 arabia.90.t: "Решите свой путь"
 arabia.90.d: "До завершения гражданской войны мы должны выбрать наш путь и принимать решения соответственно. Потому что это будет невозможно после гражданской войны."
 arabia.90.a: "Анархокоммунизм-лучший вариант!"
 arabia.90.b: "Коммунизм - лучший вариант!"
  
 arabia.91.t: "Иракский анархизм"
 arabia.91.d: "Борьба в [From.GetNameDef] в последние дни пролилось в пограничные регионы [Root.GetAdjective], и [From.GetAdjective] Анархистские ополченцы быстро начали привлекать единомышленников из местных городов. Несмотря на быстрое действие от наших пограничных сил, явное насилие в боевых действиях заставило их с самостоятельного защитника, и после первоначальных стычек с обученными в бою сил [From.GetAdjective] с обеих сторон гражданской войны они были вынуждены отступить. \ N \ nin с тех пор, как поддержка, не имеющая усилий, не в значительной степени, что и на все, что было в значительной степени, не в значительной степени, что и на исключительную поддержку. Нация фактически зафиксирована в более крупной гражданской войне."
 arabia.91.a: "Почему они должны были привлечь нас к этому?!"
 arabia.92.d: "С тех пор, как [Root.GetAdjective] бои, пролившись по границе [From.GetAdjective], локальные анархистские сторонники стекались к нашему делу. С некоторым хорошо спланированным и обследованным «поощрением», про-анархистские настроения распространились как лесной пожар среди молодых членов общества [From.GetAdjective]. \ N \ nas результат передачи кэша оружия [Root.GetAdjective] в эти [From.GetAdjective]-анархистские ячейки, ситуация в [From.GetNameDef] приводила к тому, что правительство подавляет полноценные подготовленные вверх. Лидеры этого восстания теперь запросили нашу более официальную и прямую помощь, предложив нам взять на себя инициативу в глобальной анархистской борьбе, и предположив, что они присоединяются к нам более официально, когда боевые бои утягиваются."
 arabia.92.a: "Мы с нетерпением приветствуем их поддержку анархистского дела!"
  
 arabia.93.t: "Иракский анархизм - гражданская война заканчивается"
 arabia.93.d: "С благоприятном выводом части нашей анархистской борьбы [From.GetAdjective], клетки [From.GetAdjective] теперь просят приветствовать в Совете обороны."
 arabia.93.a: "Мы принесем их под нашей защитой."
  
  
 arabia.95.d: "Мы должны подготовить совместное вторжение с [SOV.GetAdjective]"
