 LIB_yavas_cigerimi_soktun_idea: "Резкие расходы"
 LIB_yavas_cigerimi_soktun_idea_desc: "Либерия-чрезвычайно бюджетная страна, но даже в этом случае новые расходы могут вызвать у него много проблем. Мы думаем, что на этот раз мы сможем справиться с этими платежами, но в следующий раз, когда мы не пойдем на такой высокий уровень расходов. Никто не жалеет падших"
 LIB_gold_extraction_idea: "Извлечение золота"
 LIB_gold_extraction_idea_desc: "Хотя минеральные ресурсы Либерии остаются в значительной степени неиспользованными, аллювиальное золото уже давно эксплуатировалось ремесленными шахтерами. Кроме того, торговля золотом составляет 25% экономики Либерии."
