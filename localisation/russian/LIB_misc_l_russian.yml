 LIB_Edwin_Barclay: "Эдвин Барклай"
 POLITICS_LIB_Edwin_Barclay_DESC: "Бабушка и дедушка Эдвина Барклая по отцовской линии переехали из Барбадоса в Либерию со своими детьми в 1865 году. Они были среди меньшинства иммигрантов из Карибского бассейна, но поделились с американо-либерианцами культурой с английской базой, значительной миклевой гонкой и общей историей. Отец Эдвина, Эрнест Барклай и дядя, Артур Барклай, стали важными политиками в Либерии. Эдвин Барклай, член партии истинного вига, которая правила в то время, служил в качестве государственного секретаря Либерии в правительстве Чарльза Д. Б. Кинга с 1920 по 1930 год. Он стал президентом Либерии в 1930 году, когда президент Кинг и вице -президент Аллена Янси подал в отставку после того, как он был подчеркнут расследованием Лиги наций, поскольку из -за выявления вынужденного труда. Он был избран сам по себе впервые в 1931 году."
 POLITICS_Varney_Massaquoi_DESC: "Massaquoi родился 13 июня 1905 года в Кейп -Маунт, Либерия. Его отцом был Момолу Массакуай (также известный как Момолу IV), либерийский король Галлинасского королевства до его роспуска британцами. Натаниэль учился в Колледже Западной Африки, прежде чем его отец был назначен генеральным консулом в Германию на 1922–1930. Массакуэй последовал за своей семьей в Гамбург, где он жил и учился."
  
 LIB_William_Tubman: "Уильям Тубман"
 POLITICS_LIB_William_Tubman_DESC: "Уильям Ваканарат Шедрах Тубман родился 29 ноября 1895 года в Харпер, округ Мэриленд, Либерия. Его отец был методистским проповедником, который стал генералом в либерийской армии и спикером Палаты представителей. Тубман учился в начальной школе в Харпере и средней школе в средней школе округа Харпер. Он вступил в армию в 1910 году в возрасте 15 лет и служил в различных военных операциях до 1917 года. В течение этого времени он снялся с частного к лейтенанту. \ N \ ntubman начал изучать право в 1917 году и сдала экзамен в 1920 году. В 1930 году Тубман был назначен министром юстиции и государственного секретаря президента Эдвина Барклая. В этой роли он работал, чтобы повысить видимость Либерии и престиж на международном уровне. \ N \ nin 1931, Тубман стал генеральным секретарем истинной партии вига, что привело к переизбранию Барклая. В 1935 году она выступила против выдвижения Барклая на третий срок и покинула партию."
  
