 LIB_GATHERING_STORM_DESC: "Либерия была основана по переселению бывших афро-американских рабов Соединенными Штатами. Несмотря на то, что афроамериканские рабы праздновали свою свободу, это не относится к туземцам. Династия Массакуи в регионе была свергнута США, а английский был объявлен единственным официальным языком, отвергая языки коренных племен. После всего этого, с Великой депрессией и скандалом с рабством с бывшим президентом Чарльзом Д.Б. королем, Либерия находится в состоянии большой нестабильности."
  
  ################################## 
  ################################## 
  ######## STARTING IDEAS  ######### 
  ################################## 
  ################################## 
 LIB_history_of_segregation_dmod: "Многоязычная страна"
 LIB_history_of_segregation_dmod_desc: "Либерия - многоязычная страна с более чем тридцатью языками. Хотя английский является официальным языком страны, на нем говорят только 15% либерийцев. Ни одна из языковых групп не является явным большинством. Языки Либерии могут быть разделены на четыре языковых семьях, манде -языках, языках Krou, Mel Languages ​​и отдельном языке Gola. Хотя между ними нет огромной разницы, это оказывает большое влияние на влияние наших законов на население и вызывает конфликт между местным населением и африканскими либерийцами из Соединенных Штатов."
 LIB_history_of_segregation_fake: "Многоязычная страна"
 LIB_history_of_segregation_fake_desc: "Либерия - многоязычная страна с более чем тридцатью языками. Хотя английский является официальным языком страны, на нем говорят только 15% либерийцев. Ни одна из языковых групп не является явным большинством. Языки Либерии могут быть разделены на четыре языковых семьях, манде -языках, языках Krou, Mel Languages ​​и отдельном языке Gola. Хотя между ними нет огромной разницы, это оказывает большое влияние на влияние наших законов на население и вызывает конфликт между местным населением и африканскими либерийцами из Соединенных Штатов."
 LIB_deals: "Сделки труда"
 LIB_deals_desc: "После выборов 1927 года Томас Фолкнер выдвинул обвинения в принудительном труде и, что еще более ужасно, рабство в Либерии. Когда Комиссия во главе с Катбертом Кристи доказала это после распространения новостей, это было большое фиаско, и весь кабинет подал в отставку, после чего неписаное соглашение между правительствами, последовавшим за Эдвином Барклаем и рабочими."
  
