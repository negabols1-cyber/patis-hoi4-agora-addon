 LIB_army_idea: "Либерийская пограничная сила"
 LIB_army_idea_desc: "Либерийская пограничная сила - это военная подразделение, созданная в Либерии в 1908 году. Ей было поручено обеспечить внутреннюю безопасность, контроль пограничного контроля и защиту Либерии. Он был создан для защиты суверенитета Либерии и борьбы с внутренними восстаниями. Первоначально либерийские пограничные силы состояли из добровольцев, набираемых из коренных племен в различных частях Либерии. Однако со временем он превратился в более профессиональную структуру и стала обычной армией. Он сыграл важную роль и представлял военную власть Либерии до 1936 года. В течение этого периода он выступал в качестве важного актера против внутренних беспорядков и потенциальных угроз для границ."
