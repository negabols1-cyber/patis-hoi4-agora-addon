  r56i_tooltip_suppress_harsh:0 "Убирает национальный дух §YГражданские волнения§!\n §g'Мы отправим военную полицию сделать то, что необходимо.'§!"
  r56i_laws_security_order_tt:0 "§WШанс забастовок§!:§G -100%§!"

#Events
 
 #Люди недовольны
  r56i.event.01.title:0 "Бунты на улицах"
  r56i.event.01.description:0 "Похоже, люди слишком долго оставались без внимания. В результате нынешней ситуации и ввиду невозможности ее выдержать, взорвалось насилие. Хотя их требования довольно умеренные, они, безусловно, дорогостоящие."
  r56i.event.01.default:0 "Очень тревожно."
  r56i.event.01.democratic:0 "Наши граждане страдают."
  r56i.event.01.communism:0 "Наши братья манипулируются."
  r56i.event.01.fascism:0 "Людям нужно показать твердую руку."
 
 #Люди снова недовольны
  r56i.event.02.title:0 "Возвращение беспорядков"
  r56i.event.02.description:0 "Бунты продолжаются и переросли в нечто худшее. Больше интеллектуалов из нашего общества их поддерживают, а изначально экстремистские требования теперь становятся массовыми."
  r56i.event.02.default:0 "Что мы можем сделать?"
  r56i.event.02.democratic:0 "Наверняка есть какое-то решение?"
  r56i.event.02.communism:0 "Это не настоящие коммунисты!"
  r56i.event.02.fascism:0 "Возможно, нужны чрезвычайные меры."

  # Насильственное подавление оказалось успешным
  r56i.event.04.title:0 "Жесткие меры принесли успех"
  r56i.event.04.description:0 "Несмотря на то, что недовольные, возможно, по-прежнему придерживаются своих убеждений, они усвоили тяжелый урок, поняв, что высказываться нужно конфиденциально. Несмотря на то, что в воздухе витает беспокойство, бунтовщики и военная полиция разгромили протестующих, и люди вернулись к своей обычной жизни."
  r56i.event.04.default:0 "Несколько разбитых яиц."
  r56i.event.04.democratic:0 "И помните - голосуйте за нас!"
  r56i.event.04.communism:0 "Цена революции высока."
  r56i.event.04.fascism:0 "Пусть слабые трепещут."

  # Насильственное подавление не принесло успеха
  r56i.event.05.title:0 "Жесткие меры не принесли успеха"
  r56i.event.05.description:0 "Хотя отправленная нами военная полиция теоретически могла бы восстановить порядок, несколько наших людей, отправленных на борьбу с ситуацией, на самом деле присоединились к бунтовщикам. Те немногие, кто остались верны, похоже, только разгневали остальное общество. Кажется, мы только добавили масла в огонь."
  r56i.event.05.default:0 "За что мы им платим?"
  r56i.event.05.democratic:0 "Мы зря предали свои ценности."
  r56i.event.05.communism:0 "Они, должно быть, получают помощь извне."
  r56i.event.05.fascism:0 "В следующий раз мы должны отправить НАСТОЯЩИХ военных."
  
  r56i.event.06.title:0 "Переговоры увенчались успехом"
  r56i.event.06.description:0 "Как и любой другой человек, организатор протеста может ошибаться. Неясных, пустых обещаний было достаточно, чтобы умиротворить некоторых лидеров, в то время как другим пришлось заплатить... пожертвованиями на мирные усилия из государственной казны. Независимо от этого, без дальнейшей организации кажется, что протесты выдохлись."
  r56i.event.06.default:0 "Перо могущественно."
  r56i.event.06.democratic:0 "Демократия снова торжествует."
  r56i.event.06.communism:0 "Диалектика служит нам хорошо."
  r56i.event.06.fascism:0 "Массы легко умиротворить."
  
  r56i.event.07.title:0 "Переговоры провалились"
  r56i.event.07.description:0 "Оказывается, гораздо легче уговорить одного человека, чем группу, - урок, который выучил наш министр внутренних дел после попытки убедить всех главных лидеров протеста распустить свои организации. Некоторые не поверили нашим обещаниям, а другие были возмущены нашими попытками подкупа, кажется, мы только посеяли единство и сплоченность между лидерами беспорядков."
  r56i.event.07.default:0 "Почему они не могут быть неприсоединившимися, как мы?"
  r56i.event.07.democratic:0 "Это оскорбление нашей демократии."
  r56i.event.07.communism:0 "Но наше государство может предоставить все!"
  r56i.event.07.fascism:0 "Что ж, мы попытались сделать это по-хорошему."

  #Spend suppression is a success
  r56i.event.08.title:0 "Протестующие удовлетворены"
  r56i.event.08.description:0 "Несмотря на высокую цену, поскольку теперь ямы на наших городских улицах заполнены, а социальные программы немного улучшились, люди достаточно довольны, чтобы прекратить организованные беспорядки. Некоторые все еще жалуются, но большинство удовлетворено."
  r56i.event.08.default:0 "Что ж, если они счастливы..."
  r56i.event.08.democratic:0 "Деньги правят миром."
  r56i.event.08.communism:0 "Капитал еще может приносить пользу."
  r56i.event.08.fascism:0 "Овцы никогда не представляли угрозы."

  #Spend suppression is a failure
  r56i.event.09.title:0 "Протестующие требуют большего"
  r56i.event.09.description:0 "Несмотря на то, что первоначальные требования лидеров протеста были удовлетворены, более радикальные личности заняли более крайнюю позицию и начали требовать от нашего государства еще большего, а народ, воодушевленный мнимой победой, стал более охотно следовать их каждому слову."
  r56i.event.09.default:0 "Потрачено впустую ценные средства."
  r56i.event.09.democratic:0 "Испорченные гнилые социалисты."
  r56i.event.09.communism:0 "Эти принудительные работы были пустой тратой!"
  r56i.event.09.fascism:0 "Как они смеют так оскорблять нашу великую нацию?"

  #Strikes planners are found out

  strikes_rt56.t:0 "Планировавшие забастовки рабочие арестованы"
  strikes_rt56.desc:0 "Правоохранительные органы страны недавно раскрыли план рабочих многих заводов по всей стране устроить забастовку. К счастью, план был раскрыт, а зачинщики арестованы. Надеемся, что это предотвратит перебои в производстве."
  strikes_rt56.a:0 "Мы пресекли источник этого неповиновения."
  
#Event to leave faction in case of revolution
  r56i.event.10.title:0 "Новая дипломатическая ориентация?"
  r56i.event.10.description:0 "Создание нового правительства вызывает ряд вопросов о будущем [ROOT.getnameDef]. [ROOT.GetLeader] остерегается идеологической ориентации [ROOT.GetFactionName] и опасается, что такое сотрудничество может привести к войне против стран, сочувствующих [ROOT.GetRulingIdeology] причине и политической ориентации [ROOT.GetRulingParty]."
  r56i.event.10.a:0 "Это были союзники предыдущего правительства"
  r56i.event.10.b:0 "Соблюдайте наши дипломатические обязательства"
  
  
  r56i.event.11.title:0 "[From.GetNameDefCap] выходит из [From.GetFactionName]"
  r56i.event.11.description:0 "\nПриняв решение радикально изменить свою дипломатическую позицию, новое [FROM.GetAdjective] [FROM.GetRulingIdeology] правительство решило выйти из [FROM.GetFactionName]. Новость вызвала волнения среди членов [FROM.GetFactionName], поскольку они задавались вопросом, не приведут ли другие выходы к краху их союза.\n\n [FROM.GetLeader] заявил, что в основе его решения лежит необходимость переориентировать политику страны в соответствии с программой [ROOT.GetRulingParty], заявив, что его правительство сделает все возможное, чтобы сохранить [From.GetAdjective] независимость."
  r56i.event.11.a:0 "Мир меняется."

  r56i.event.12.title:0 "Историческая возможность"
  r56i.event.12.description:0 "Создание нашего правительства поднимает вопросы о будущем [ROOT.GetName]. Для большинства из нас ответ ясен: пришло время завоевать нашу независимость. Очевидно, что наше восхождение является явным признаком правоты дела [ROOT.GetRulingIdeology], и мы должны привести нашу дипломатическую ситуацию в соответствие с политическим манифестом [ROOT.GetRulingParty]."
  r56i.event.12.a:0 "Мы свободны, наконец-то!"
  r56i.event.12.b:0 "Это слишком рискованно"


  r56i.event.13.title:0 "[From.GetLeader] объявляет о независимости [From.GetAdjective]"
  r56i.event.13.description:0 "\nНовое [FROM.GetAdjective] [FROM.GetRulingIdeology] правительство решило в одностороннем порядке объявить о своей независимости. Это решение было объявлено тотальным и бескомпромиссным. Поэтому [FROM.GetNameDef] выйдет из всех своих военных обязательств и пересмотрит свою внешнюю политику. Это, безусловно, разозлит их бывшего сюзерена, так как [FROM.GetLeader] четко заявил, что он не связан предыдущими договорами и что этот день ознаменует начало новой эры в истории [FROM.GetAdjective]."
  r56i.event.13.a:0 "Очередная революция."

  r56i.event.14.title:0 "[From.GetNameDefCap] мятежники!"
  r56i.event.14.description:0 "\nЗахват власти [FROM.GetRulingIdeology] привел к декларации независимости [FROM.GetAdjective] [FROM.GetLeader]. Не желая уважать установленный порядок, их вызывающее поведение может создать опасный прецедент."
  r56i.event.14.a:0 "Мы должны отомстить!"

  r56i.event.15.title:0 "[From.GetNameDefCap] распускает свою фракцию!"
  r56i.event.15.description:0 "\nНе сумев найти дипломатических партнеров, правительство [FROM.GetAdjective] объявило, что оно больше не будет стремиться возглавить международную коалицию. Таким образом, они открыты для дипломатических предложений, чтобы присоединиться к более сильному альянсу.\n\nЭта новость, безусловно, привлечет внимание различных канцелярий. Вероятно, иностранные дипломаты уже работают над тем, чтобы повлиять на [FROM.GetLeader] и его правительство."
  r56i.event.15.a:0 "Интересно."
  r56i.event.16.t:0 "[alliance_inviter.GetFactionName] и [alliance_applicant.GetAdjective] фракция объединяются в единый Альянс!"
  r56i.event.16.d:0 "\n\n Мировая политика меняется быстрыми темпами, и поэтому лидеры [alliance_inviter.GetFactionName] и [alliance_applicant.GetLeader] признали, что бесполезно стоять как отдельные коалиции. Вместо этого они решили сражаться бок о бок.\n\nВероятно, это будет беспокоить зарубежные канцелярии, поскольку их объединенная сила может стать намного более угрожающей."
  r56i.event.16.a:0 "Вместе мы сильнее."
  r56i.event.16.b:0 "Они ищут силу в количестве."
  r56i.event.16.c:0 "Это не поможет им!"
  r56i.event.16.e:0 "Война обостряется..."
  r56i.event.16.f:0 "Наш союз крепнет." 

  r56i.event.17.t:0 "Высадились вражеские войска!"
  r56i.event.17.desc:0 "\nЭтим утром с катеров береговой охраны и многочисленных морских наблюдательных пунктов поступили сообщения о том, что у берегов [ROOT.getnameDef] собрался флот вражеских кораблей. Многие корабли вражеского флота отделились от флота и подошли к нашей береговой линии с целью высадиться.\n\nИз быстро поступающих разведданных сообщается, что размеры десанта слишком велики для налета, так как вражеские силы быстро подавили небольшой гарнизон, с которым они столкнулись. Сообщается, что вражеские силы быстро устанавливают небольшой плацдарм и вывозят на берег большое количество техники."
  r56i.event.17.a:0 "Мы должны действовать быстро!"

  r56i.event.18.t:0 "Приземлились вражеские парашютисты!"
  r56i.event.18.desc:0 "\nСамолеты были замечены в небе над нашей территорией, и был осуществлен масштабный выброс войск. Из первого сообщения еще не понятно, насколько велики силы противника. К тому же, операция, вероятно, является частью чего-то более масштабного."
  r56i.event.18.a:0 "Мы должны действовать быстро!"

 r56i.event.19.t:0 "Отчет исследовательской лаборатории сухопутных войск"
 r56i.event.19.desc:0 "Сегодня утром в канцелярию правительства поступил свежий отчет из нашей исследовательской лаборатории сухопутных войск. В отчете говорится о том, что существующий бюрократический аппарат серьезно ограничивает возможность модернизации старых систем вооружения и применения новых военных технологий.\n\n Отдел НИОКР [ROOT.GetAdjective] просто не справляется с обработкой нынешнего потока сообщений, получаемых от военных специалистов. А рост количества сообщений, подобных поступающим сейчас, будет бесполезен, поскольку они слишком похожи друг на друга. Предлагается выделить бюджет на улучшение военной техники с учетом огромного объема данных, полученных из боевого опыта.\n\n Наш генеральный штаб также поддерживает такое развитие событий, признавая, что оно, несомненно, повысит боеспособность армии [Root.GetAdjective]."
 r56i.event.19.a:0 "Дадим этому делу ход!"

  r56i.event.20.t:0 "Отчет военно-морской исследовательской лаборатории"
  r56i.event.20.desc:0 "Сегодня утром в правительственный офис поступило последнее сообщение из нашей военно-морской исследовательской лаборатории. В докладе указано, что нынешний бюрократический аппарат существенно ограничивает любую возможную модернизацию старых систем вооружения и применение новых технологий военно-морского флота.\n\nНаучно-исследовательский отдел [ROOT.GetAdjective] просто не в состоянии обработать текущее количество докладов, направленных командирами нашего флота. Любое увеличение количества этих докладов также будет бесполезным, поскольку они слишком похожи друг на друга. Они предлагают выделить бюджет на улучшение военно-морского оборудования с учетом огромного количества данных, полученных в ходе боевых действий.\n\nАдмиралтейство также выступает за такое развитие событий, признавая, что это, безусловно, повысит боевые возможности военно-морского флота [Root.GetAdjective]."
  r56i.event.20.a:0 "Давайте воспользуемся этим!"

  r56i.event.21.t:0 "Большой опыт в авиации"
  r56i.event.21.desc:0 "Сегодня утром в правительственный офис поступило последнее сообщение из нашей авиационной исследовательской лаборатории. В докладе указывается, что нынешний бюрократический аппарат серьезно ограничивает любую потенциальную модернизацию, заставляя анализировать боевые отчеты вместо проведения надлежащих испытаний. Директор настаивает на том, что технологии для усовершенствования наших самолетов существуют и должны быть рассмотрены как можно скорее."
  r56i.event.21.a:0 "Давайте воспользуемся этим!"
  r56i.event.16.t:0 "[HUN.GetFactionName] поглощает фракцию [YUG.GetAdjective], объединяя их в единый союз!"
  r56i.event.16.d:0 "\n\n Мировая политика стремительно меняется, и поэтому лидеры [HUN.GetFactionName] и [YUG.GetLeader] признали, что бесполезно сражаться разрозненными коалициями, а следует сформировать единую коалицию, борющуюся за торжество своей идеологии."
  r56i.event.16.a:0 "Интересно."
  r56i.event.16.a:0 "Вместе мы сильнее."
  r56i.event.16.b:0 "Они ищут силы в численности."
  r56i.event.16.c:0 "Это им не поможет!"
  r56i.event.16.e:0 "Война разгорается..."
  r56i.event.16.f:0 "Наш союз становится сильнее."