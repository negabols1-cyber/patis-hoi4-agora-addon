  r56i_idea_suppress_spend_desc:0 "Мы направляем федеральные средства на программы, которые требуют бунтовщики."

#Decisions
 #r56i_national_character_decisions:0 "Национальные решения"
  r56i_decision_suppress_revolts:0 "Жестко подавить гражданские беспорядки"
  r56i_decision_suppress_revolts_desc:0 "Если к башмаку применить силу, шея согнется."
  r56i_decision_talk_revolts:0 "Договориться с зачинщиками"
  r56i_decision_talk_revolts_desc:0 "Несколько харизматичных лиц направляют гнев общественности. Может быть, их можно уговорить остановиться?
  r56i_decision_spend_revolts:0 "Удовлетворить требования протестующих"
