l_russian:
 #Political
 PER_dictatorship_of_reza_shah_pahlavi:0 "Диктатура Резы Шаха Пехлеви"
 PER_dictatorship_of_reza_shah_pahlavi_desc:0 "Даже если мы хотим принести демократию, права и свободы в нашу страну, мы не можем рисковать тем, что иностранные государства и предатели внутри нашей страны разорвут нашу страну на части. Пока наша страна не готова к этим нововведениям, у нас нет другого выбора, кроме как строгое правление с однопартийным режимом."
 PER_weakening_influence_clergy:0 "Ослабление влияния духовенства"
 PER_weakening_influence_clergy_desc:0 "На протяжении веков, если мы пытались внести новшества в нашу страну, мы не могли их реализовать из-за фанатичного и отсталого духовенства. Но теперь эта эпоха закончится. Уничтожение влияния духовенства на нашу страну будет первым шагом реформ, которые мы будем проводить."
 PER_empowerment_women:0 "Равноправие женщин"
 PER_empowerment_women_desc:0 "Женщины - это не просто кусок мяса. Один из самых важных шагов для нашей страны, чтобы достичь уровня развитых цивилизаций, - это то, чтобы женщины имели равные права с мужчинами с этого момента, ни одна женщина не будет чувствовать себя слабой перед мужчиной."
 PER_women_in_the_army:0 "Женщины в армии"
 PER_women_in_the_army_desc:0 "Теперь, когда женщины больше не должны жить в заключении дома, они могут внести свой вклад в оборону нашей страны. Нам нужны все, мужчины и женщины, чтобы предотвратить уничтожение нашей страны еще раз."
 PER_blackmail_the_clergy:0 "Шантаж духовенства"
 PER_blackmail_the_clergy_desc:0 "Хотя духовенство известно своей моральностью, ясно, что некоторые из них не соответствуют морали этого народа. Некоторые из них были заблокированы, когда они собирались быть разоблачены некоторыми журналистами. И эти... некоторые из них отвратительны. Мы считаем, что духовенство также хочет, чтобы они не были известны."
 PER_enforce_the_hat_and_dress_code:0 "Введение кодекса головных уборов и одежды"
 PER_enforce_the_hat_and_dress_code_desc:0 "В августе 1927 года Реза Шах Пехлеви принял закон. Так же, как Мустафа Кемаль Ататюрк, основатель Турецкой Республики, несколько законов о одежде и связанных с ней законах, чтобы избавиться от реакции Востока и интегрироваться в западный мир. Хотя мы приняли такой закон, мы не смогли его реализовать. Теперь пришло время его реализовать"
 PER_continued_reform:0 "Реформы успешны"
 PER_continued_reform_desc:0 "Наши реформы были успешными. Наши женщины больше не рабыни мужчин. Наша армия и промышленность не устарели. Мы обеспечили существование нашей страны на долгие годы. Да здравствует Реза Шах Пехлеви! Да здравствует Иран!"
 PER_invite_islamists_to_government:0 "Пригласить исламистов в правительство"
 PER_invite_islamists_to_government_desc:0 "Независимо от того, насколько сильно мы сломаем давление духовенства в нашей стране, невозможно убрать религию из нашей страны. Но если мы пригласим исламистов в правительство и получим их поддержку, нам будет легче реализовать наши реформы."
 PER_side_with_islamists:0 "Сторонить с исламистами"

  PER_side_with_islamists_desc:0 "Разрушение духовенства означает разрушение нашей страны и пренебрежение нашей цивилизацией, которая веками развивалась с исламом. Нам нужно уничтожить предателей среди духовенства и двигаться дальше с оставшимися верными."

  #Democratic
  PER_democratic_principles:0 "Демократические принципы"
  PER_democratic_principles_desc:0 "В то время, когда мир демократизируется и развивается, мы не должны оставаться в плену устаревших форм правления, мы должны уважать права человека и меньшинств, уважать выборы, создавать равную и правильно функционирующую правовую систему и строить лучшую страну для нашего народа."
  PER_pahlavi_with_republic:0 "Демократическая диктатура"
  PER_pahlavi_with_republic_desc:0 "Шах объявил о планах возобновить выборы в Иране. Этот план был истолкован как превращение Ирана в демократическую страну и повышение политического участия народа. Но были и некоторые опасения. Некоторые опасались, что шах может использовать выборы для защиты своих собственных интересов и не был заинтересован в установлении реальной демократии. Другие утверждали, что Иран еще не готов к демократии и что выборы могут привести к политической нестабильности. Время покажет, превратится ли эта демократия в диктатуру."
  PER_illusions_of_a_democratic_system:0 "Иллюзии демократической системы"
  PER_illusions_of_a_democratic_system_desc:0 "Хотя наш народ хочет демократии, ни они, ни наша страна не готовы к ней, но если мы интегрируем некоторые важные части демократии в нашу страну, мы можем сохранить доверие нашего народа к нам."
  PER_arrest_criminals:0 "Арест преступников"
  PER_arrest_criminals_desc:0 "Шах Реза Пехлеви предпринял ряд жестких мер по укреплению своей власти и подавлению инакомыслия. В этом контексте по приказу шаха было арестовано множество людей, считавшихся политическими преступниками. Эти аресты привели к ограничениям политических свобод и усилению репрессий в Иране.\n\nСреди арестованных были члены оппозиционных партий, журналисты, интеллектуалы и студенты. Их обвиняли в критике или оппозиции режиму шаха. Арестованные были осуждены без справедливого судебного разбирательства, и многие были приговорены к длительным срокам тюремного заключения."
  PER_restore_constitutionalism:0 "Восстановление конституционализма"
  PER_restore_constitutionalism_desc:0 "«Никакая власть не может быть выше конституции». Это должно быть краеугольным камнем любой страны, будь то император, король или шах, если он отказывается подчиняться закону, он должен быть наказан в соответствии с законом."
  PER_an_election_for_the_future:0 "Выборы для будущего"

  PER_an_election_for_the_future_desc:0 "Шах решил провести в Иране всеобщие выборы впервые за много лет. Это решение вызвало в Иране огромный энтузиазм и было истолковано как важный шаг к демократии в стране. Пока нет полной ясности о том, как именно будут проходить выборы. Хотя проводились пробные выборы на местном уровне, было объявлено, что выборы будут проводиться по образцу Турции, и что будут приглашены наблюдатели из Турции."
  PER_constitutional_monarchy:0 "Конституционная монархия"
  PER_constitutional_monarchy_desc:0 "Мы не можем игнорировать добро, которое династия Пехлеви принесла нашей стране. Вместо того, чтобы изгонять династию, мы должны ограничить ее полномочия с помощью конституционной монархии и передать абсолютную власть народу."
  PER_abolish_the_monarchy:0 "Упразднить монархию"
  PER_abolish_the_monarchy_desc:0 "Если мы хотим демократии, мы должны ликвидировать все, что мешает ей, включая монархию. Независимо от того, насколько они работают на благо нашей страны, монархия не имеет места в новом современном и демократическом Иране."
  PER_confiscate_pahlavi_assets:0 "Конфисковать имущество Пехлеви"
  PER_confiscate_pahlavi_assets_desc:0 "Теперь, когда мы изгнали династию, которая годами эксплуатировала страну, живя богатой и роскошной жизнью за счет налогов и государственных доходов нашего народа, мы можем конфисковать их имущество и использовать эти деньги для развития нашей страны."
  PER_open_the_parliament:0 "Открыть парламент"
  PER_open_the_parliament_desc:0 "Теперь, когда правительство находится в руках нашего народа, мы можем открыть парламент, который будет представлять волю нашего народа, и мы можем сделать шаг ближе к светлому будущему нашей страны."
  PER_work_with_monopolies:0 "Сотрудничать с монополиями"
  PER_work_with_monopolies_desc:0 "Хотя наличие монополий в стране не является полностью положительным явлением, последствия их ликвидации были бы катастрофическими. Напротив, мы должны заключить союз с этими великими магнатами, чтобы извлечь выгоду для государства от этого экономического явления."
  PER_public_education:0 "Общественное образование"
  PER_public_education_desc:0 "Образование должно быть общественной услугой, предоставляемой исключительно государством. Если мы позволим проводить эту работу в частном порядке, наша молодежь будет подвержена индоктринации в соответствии с политическими идеалами учителя. Образование должно быть светским и без политических тенденций."
  PER_get_rid_of_corruption:0 "Избавиться от коррупции"
  PER_get_rid_of_corruption_desc:0 "Коррупция подобна раковой опухоли для страны. Мы должны провести рейды, проверки и допросы по всей стране, мы должны один за другим ловить предателей, жаждущих народных денег, и удалить эту раковую опухоль из нашей страны."
  PER_economic_reforms:0 "Экономические реформы"

  PER_economic_reforms_desc:0 "Теперь, когда мы сделали нашу страну современной и современной, следующим шагом является исправление нашей экономики. С поддержкой иранского народа мы можем сделать нашу экономику лучшей экономикой на Ближнем Востоке в очень короткие сроки."
  PER_put_religious_affairs_under_state_control:0 "Поставить религиозные дела под государственный контроль"
  PER_put_religious_affairs_under_state_control_desc:0 "Религия является важной частью нашей страны и нашего народа, но если ее не контролировать, она может отравить наш народ. Поместив религиозные дела под государственный контроль, мы могли бы предотвратить наблюдение за духовенством и предотвратить распространение еретических идей среди нашего народа."
  PER_nationalize_aioc:0 "Национализировать AIOC"
  PER_nationalize_aioc_desc:0 "Хотя у нас есть одни из самых богатых нефтяных ресурсов на Ближнем Востоке, империалистическая Британия официально эксплуатирует нефтяные ресурсы нашей страны и не дает нам деньги и нефть, которые они нам обещали. Если они не будут соблюдать соглашения, мы не обязаны соблюдать это соглашение."
  PER_fight_against_illiteracy:0 "Борьба с неграмотностью"
  PER_fight_against_illiteracy_desc:0 "Невежество - один из самых больших врагов страны. Знание - основа для построения великой армии, экономики и страны. Мы откроем школы и университеты по всей стране. Мы подготовим молодое поколение к светлому будущему и тем самым войдем в иранский век."
  PER_complete_reforms:0 "Полные реформы"
  PER_complete_reforms_desc:0 "Мы, наконец, добились успеха, наша страна продвинулась в науке и технике, мы - сияющий бриллиант Ближнего Востока с точки зрения промышленности, наша армия стала одной из самых элитных армий в мире, наши женщины не сидят дома. Светлое будущее ждет нашу страну."
  PER_the_sadabat_pact:0 "Пакт Садабад"
  PER_the_sadabat_pact_desc:0 "[PER.GetLeader] объявил о планах превратить Пакт Садабад в военный союз для обеспечения региональной стабильности и безопасности. План [PER.GetLeader] побудил страны Пакта Садабад (Турция, Афганистан, Ирак и Иран) создать общую систему обороны и организовать совместные военные учения. Этот план также включал в себя облегчение торговли оружием и военной техникой между странами и повышение обмена разведданными."
  PER_technology_sharing:0 "Обмен технологиями в Садабаде"
  PER_technology_sharing_desc:0 "[PER.GetLeader] объявил о планах запуска программы обмена технологиями со странами Пакта Садабад. Эта программа была направлена ​​на расширение доступа Ирана к современным технологиям и ускорение индустриализации страны.\n\nПакт Садабад был соглашением о региональном сотрудничестве, в которое входили Турция, Иран, Афганистан и Ирак. Это соглашение было предназначено для содействия миру и стабильности среди стран региона и для защиты общих интересов. [PER.GetLeader] рассматривал Пакт Садабад не только как политическое сотрудничество, но и как платформу для экономического и технологического развития."

  PER_invite_kemalist_officers:0 "Пригласить кемалистских офицеров"
  PER_invite_kemalist_officers_desc:0 "В Иране в 1930-х годах [PER.GetLeader] предпринимал важные шаги по модернизации и развитию страны. В этом контексте он пригласил в Иран группу кемалистских офицеров из Турции. Эти офицеры были назначены для помощи в модернизации и обучении иранской армии. [PER.GetLeader] также добавил, что Иран всегда будет оставаться независимой страной и продолжит осуществлять самоопределение."
  PER_adapt_six_arrows:0 "Принять Шесть Стрел"
  PER_adapt_six_arrows_desc:0 "Шесть основных принципов, известных как Шесть Стрел, которые были выдвинуты Ататюрком, были выдвинуты [PER.GetLeader] для модернизации и развития страны. Эти принципы включали в себя национализм, прогрессизм, секуляризм, республиканизм, эгалитаризм и популизм.  Это были принципы, которые были необходимы цивилизованному народу."
  PER_our_own_path:0 "Свой собственный путь"
  PER_our_own_path_desc:0 "Наша судьба отличается от судьбы любой другой нации, мы не можем позволить себе стать союзниками с кем-либо. Единственная страна, которой мы доверяем, - это мы сами, и мы будем придерживаться этого."
  PER_invite_other_countries:0 "Пригласить другие страны"
  PER_invite_other_countries_desc:0 "Согласно плану [PER.GetLeader], к этому новому блоку присоединятся важные страны Ближнего Востока, такие как Турция, Афганистан, Ирак и Саудовская Аравия. Эти страны стремились увеличить региональное развитие и процветание, сотрудничая на общей политической и экономической платформе. Шах также считал, что этот блок будет способствовать поддержанию регионального мира и стабильности, а также создавать сдерживание от внешних угроз."
  PER_go_against_communism:0 "Противостоять коммунизму"
  PER_go_against_communism_desc:0 "Коммунизм - это основа массового голода и эксплуатации рабочего класса. Они утверждают, что они за рабочих, в то время как на самом деле они являются полной противоположностью. Мы должны избавиться от этой коммунистической грязи."
  PER_increase_military_investment:0 "Увеличить военные инвестиции"
  PER_increase_military_investment_desc:0 "Экономическая и логистическая составляющая конфликта так же важна для нашего выживания, как и сражения на передовой. Поэтому мы должны инвестировать в нашу оружейную промышленность, чтобы гарантировать, что она может продолжать снабжать наши войска всем необходимым оборудованием."
  PER_join_allies:0 "Присоединиться к союзникам"
  PER_join_allies_desc:0 "Давайте официально сделаем это, пришло время спросить у британцев, можем ли мы присоединиться к союзникам. Они - спасители этого мира, в то время как кровожадные немцы губят миллионы людей и бросают мир в хаос. Мы должны оказать союзникам как можно больше нашей поддержки."
  PER_more_funds_to_scientists:0 "Больше средств ученым"
  PER_more_funds_to_scientists_desc:0 "Персидская пословица гласит, что если ослу нужна еда, вы дадите ему еду, а если ему нужна порка, вы накажете его. Мы тоже сейчас голодны по образованию."
  PER_military_aid:0 "Военная помощь"

  PER_military_aid_desc:0 "У союзников есть огромный арсенал производителей оружия, мы должны воспользоваться ими, чтобы быстро модернизировать наши вооруженные силы."
  PER_revise_the_oil_agreement:0 "Пересмотреть нефтяное соглашение"
  PER_revise_the_oil_agreement_desc:0 "Текущие нефтяные сделки. Они сильно влияют на иранскую экономику. Именно поэтому мы представим законопроект нашему другу, Соединенному Королевству. AIOC будет преобразована в BP, чтобы обе стороны получили выгоду."
  PER_learn_british_naval_techniques:0 "Изучить британские военно-морские технологии"
  PER_learn_british_naval_techniques_desc:0 "Британцы, несомненно, являются королями этой планеты, когда дело доходит до флота. Королевский флот прошел через множество различных вещей на протяжении всего своего существования, и благодаря этому он достиг вершины всех военно-морских рейтингов. Мы можем многому научиться у этого большого флота благодаря союзу с британцами."
  PER_preemptive_invasion_of_iraq:0 "Превентивное вторжение в Ирак"
  PER_preemptive_invasion_of_iraq_desc:0 "Политическая нестабильность в Ираке также снижает стабильность Ирана. Мы также слышали, что Ирак отвергнет верховенство Соединенного Королевства. Прежде чем они сделают это, мы должны сделать это."

  #Shah
  PER_continue_pahlavi_dictatorship:0 "Продолжить диктатуру Пехлеви"
  PER_continue_pahlavi_dictatorship_desc:0 "Реза-шах должен укрепить свою власть и сохранить свою личную диктатуру, чтобы обеспечить стабильность и прогресс Ирана.
  PER_deal_with_clergy:0 "Договориться с духовенством"
  PER_deal_with_clergy_desc:0 "Духовенство обладает значительной властью в Иране. Чтобы модернизировать нашу нацию, мы должны уменьшить их влияние."
  PER_exile_political_opponents:0 "Изгнать политических оппонентов"
  PER_exile_political_opponents_desc:0 "Чтобы укрепить наш контроль, нам нужно изгнать тех, кто выступает против нас в других партиях. Это снизит их популярность и укрепит наши позиции."
  PER_supress_the_opposite_side:0 "Подавить противоположную сторону"
  PER_supress_the_opposite_side_desc:0 "Подавление противоположных идеологий имеет решающее значение для предотвращения их популярности среди населения."
  PER_invest_in_education:0 "Инвестировать в образование"
  PER_invest_in_education_desc:0 "Инвестирование в образование жизненно важно для будущего нашей нации. Повышая уровень грамотности, мы стремимся создать более образованное и квалифицированное население."
  PER_expand_the_shahrbani:0 "Расширить Шахрбани"
  PER_expand_the_shahrbani_desc:0 "Шахрбани, наша полиция, нуждается в расширении и модернизации, чтобы поддерживать порядок и проводить в жизнь нашу политику. Это необходимый шаг для снижения уровня преступности."
  PER_forced_secularization:0 "Принудительная секуляризация"
  PER_forced_secularization_desc:0 "Чтобы полностью модернизировать Иран, мы должны проводить секуляризацию. Устранить влияние духовенства невозможно без светского общества. Секуляризировать наше население непросто, но необходимо."
  PER_remove_the_british_reppesion:0 "Убрать британские репрессии"

  PER_remove_the_british_reppesion_desc:0 "В последние годы репрессивный режим, установленный британцами в Иране, вызвал гнев и реакцию нашего народа. Эта колониальная держава применяет произвольные практики на наших землях, эксплуатирует нашу экономику и ограничивает наши свободы. Мы больше не можем терпеть эту жестокость!\n\nЖестокость британцев проявляется во всех сферах. Они вгоняют наш народ в нищету, эксплуатируя нашу экономику. Они пытаются подавить наши голоса, ограничивая наши политические свободы. Они также проводят репрессивную политику в области образования и культуры."
  PER_subsidize_key_industries:0 "Субсидирование ключевых отраслей"
  PER_subsidize_key_industries_desc:0 "Мы будем финансировать ключевые отрасли, чтобы стимулировать открытие новых фабрик и поднять нашу экономику. Это крайне важно для экономического роста и развития."
  PER_deal_with_corruption:0 "Борьба с коррупцией"
  PER_deal_with_corruption_desc:0 "Коррупция в нашем правительстве достигла нетерпимых масштабов, нанося вред государству. Мы должны принять строгие меры для искоренения коррупции и восстановления честности."
  PER_budget_adjustment:0 "Корректировка бюджета"
  PER_budget_adjustment_desc:0 "Внося коррективы в бюджет, мы стремимся сбалансировать военную и гражданскую экономику. Нам нужна эта корректировка, чтобы обеспечить устойчивый рост в нашей стране."
  PER_increase_military_spending:0 "Увеличение военных расходов"
  PER_increase_military_spending_desc:0 "В условиях, когда мир находится на грани конфликта, важно увеличить военные инвестиции. Нам необходимо укрепить наши оборонные возможности, чтобы защитить нашу нацию."
  PER_diplomatic_neutrality:0 "Дипломатический нейтралитет"
  PER_diplomatic_neutrality_desc:0 "По мере того как политическая атмосфера в мире накаляется, позиция Ирана в международных отношениях начинает подвергаться сомнению. В недавней статье журналист рассматривает концепцию «дипломатического нейтралитета» и задается вопросом, что эта политика означает для Ирана. Рано или поздно наш нейтралитет будет нарушен, но это не мы его нарушим!"
  PER_promote_nationalism:0 "Пропаганда национализма"
  PER_promote_nationalism_desc:0 "Пропаганда национализма повысит эффективность вербовки и укрепит нашу армию. Подготовленная и активная армия необходима в случае нападения на нашу страну."
  PER_strengthen_regime:0 "Укрепление режима"
  PER_strengthen_regime_desc:0 "В то время, когда Иран нуждается в национальном единстве и сильном лидере, укрепление режима обеспечит их. В конце концов, Реза-шах Пехлеви правит нашей страной для нас!"
  PER_fortification_effort:0 "Усилия по укреплению"
  PER_fortification_effort_desc:0 "Граница – это честь. Кроме этого, ничего не скажешь. Это также преступление – говорить об этом. Военные беженцы не могут пересечь наши границы или перепрыгнуть через наши огромные стены."
  PER_extensive_recruitment:0 "Массовая вербовка"

  PER_extensive_recruitment_desc:0 "Нам необходимо значительно увеличить наш активный военный потенциал, чтобы лучше поддерживать порядок на оккупированных территориях и эффективно противостоять будущей агрессии. В противном случае мы можем быть застигнуты врасплох."

  #Persian
  PER_embrace_persian_identity:0 "Принятие персидской идентичности"
  PER_embrace_persian_identity_desc:0 "В эпоху ностальгии по прошлому и надежд на будущее Реза Шах Пехлеви утверждает, что иранцы должны гордиться своим историческим и культурным наследием и стремиться передать его будущим поколениям."
  PER_assign_fazlollah_zahedi:0 "Назначение Фазлоллаха Захеди"
  PER_assign_fazlollah_zahedi_desc:0 "На политической арене Ирана произошли важные изменения. Шах назначил Фазлоллаха Захеди, опытного государственного деятеля, премьер-министром. Это назначение ознаменовало собой значительные изменения во внутренней и внешней политике Ирана.\n\nЗахеди имеет богатый и успешный бюрократический опыт. Захеди известен своей честностью, трудолюбием и патриотизмом. Также говорят, что он происходит из династии Сефевидов."
  PER_crush_illegal_religious_activity:0 "Подавление незаконной религиозной деятельности"
  PER_crush_illegal_religious_activity_desc:0 ""
  PER_reorganize_the_government:0 "Реорганизация правительства"
  PER_reorganize_the_government_desc:0 "Новый премьер-министр Ирана Фазлоллах Захеди с момента вступления в должность предпринимает важные шаги по модернизации и развитию страны. Одним из этих шагов является реорганизация правительства.\n\nЗахеди вносит изменения в структуру правительства, чтобы сделать бюрократию более эффективной и сократить коррупцию. Эти изменения включают слияние или упразднение некоторых министерств и создание новых."
  PER_strategic_nationalizations:0 "Стратегические национализации"
  PER_strategic_nationalizations_desc:0 "Новый премьер-министр Ирана Фазлоллах Захеди предпринял важный шаг для стимулирования экономики страны и сокращения иностранного господства. Захеди национализировал некоторые стратегические секторы, такие как нефтеперерабатывающие заводы.\n\nЭти национализации являются важным шагом для укрепления экономической независимости и суверенитета Ирана. В течение многих лет иностранные компании получали неоправданную прибыль от природных ресурсов и инфраструктуры Ирана. Действия Захеди положат конец этой эксплуатации и обеспечат справедливую выгоду иранскому народу от этих ресурсов."
  PER_began_militarization:0 "Начало милитаризации"
  PER_began_militarization_desc:0 "Новый премьер-министр Ирана Фазлоллах Захеди стремится ускорить программу вооружения, чтобы обеспечить национальную безопасность страны. С этой целью в своем заявлении от [GetMonth] 	[GetYear] он объявил о своих новых планах по «Новому плану милитаризации». \n\nЗахеди утверждает, что Иран сталкивается с растущими региональными угрозами и нуждается в сильной армии для противодействия этим угрозам. Поэтому будут сделаны новые инвестиции в оснащение армии Ирана современным оружием и оборудованием, а также в увеличение численности войск."
  PER_compulsory_education:0 "Обязательное образование"

  PER_compulsory_education_desc:0 "Новый премьер-министр Ирана Фазлолла Захеди сделал важный шаг в направлении модернизации и развития страны. Захеди объявил о введении обязательного образования для всех иранских детей.\n\nЭто решение является исторической вехой в системе образования Ирана. Обязательное образование гарантирует, что все дети будут обучаться грамоте и базовым навыкам, что поможет повысить общий уровень грамотности в стране."
  PER_reform_the_shahrbani:0 "Реформа Шахрбани"
  PER_reform_the_shahrbani_desc:0 "Новый премьер-министр Ирана Фазлолла Захеди предпринимает важные шаги по модернизации правоохранительных органов страны и повышению их эффективности. Одним из таких шагов является реформа Шахрбани.\n\nЗахеди утверждает, что Шахрбани страдает от коррупции и некомпетентности. Поэтому он разработал новый план, чтобы сделать Шахрбани более современной и профессиональной полицейской силой."
  PER_the_dream_of_persian_empire:0 "Мечта о Персидской империи"
  PER_the_dream_of_persian_empire_desc:0 "У нового премьер-министра Ирана Фазлолла Захеди есть амбициозное видение. Захеди хочет вернуть Иран к былому величию и сделать его ведущей силой в регионе. Чтобы достичь этой цели, Захеди провел ряд реформ по модернизации страны в политическом, экономическом и военном плане.\n\nВ основе видения Захеди лежит идея возрождения Персидской империи. Захеди - националист, который гордится историческим и культурным наследием Ирана. Он считает, что Иран может восстановить свою былое величие и стать великой державой в регионе."
  PER_attack_iraq:0 "Нападение на Ирак"
  PER_attack_iraq_desc:0 "Утром появились сообщения о том, что премьер-министр Ирана генерал Фазлолла Захеди планирует военную операцию против Ирака. Этот шаг знаменует собой эскалацию давних напряжений между двумя странами.\n\nХотя причины решения Захеди не до конца известны, недавнее усиление провокаций и шпионской деятельности Ирака на иранской границе, возможно, сыграло провоцирующую роль. Кроме того, желание Захеди укрепить свой имидж национального лидера могло сыграть свою роль в этом решении."
  PER_exploit_the_iraqi_oil:0 "Эксплуатация иракской нефти"
  PER_exploit_the_iraqi_oil_desc:0 "После захвата Ирака мы вновь запустим добычу на скважинах, которые иракское правительство не сочло нужным использовать, но которые представляют собой огромные запасы. Таким образом, мы приблизимся к осуществлению мечты о Персидской империи."
  PER_attack_afghanistan:0 "Нападение на Афганистан"
  PER_attack_afghanistan_desc:0 "Шокирующие новости сегодняшнего утра свидетельствуют о том, что премьер-министр Ирана генерал Фазлолла Захеди планирует военную операцию против Афганистана. Этот шаг вызвал большое беспокойство и тревогу в регионе."
  PER_demand_syria:0 "Требовать Сирию"
  PER_demand_syria_desc:0 ""
  PER_demand_egypt:0 "Требовать Египет"

  PER_demand_egypt_desc:0 "С помощью дипломатического давления и переговоров мы требуем контроля над делами Египта, стремясь оказать влияние на их правительство и стратегические интересы. Этот решительный шаг может повысить напряженность в регионе и, возможно, привести к конфликтам, поскольку мы стремимся укрепить свое господство на Ближнем Востоке."
  PER_destabilize_turkey:0 "Дестабилизировать Турцию"
  PER_destabilize_turkey_desc:0 "Мы стремимся подорвать стабильность Турции с помощью тайных операций, пропагандистских кампаний и подрывной деятельности. Используя существующие внутренние разногласия, поддерживая диссидентские группы и подстрекая к беспорядкам, мы стремимся ослабить влияние и контроль Турции в регионе. Дестабилизация Турции проложит путь для наших экспансионистских амбиций и усилит наше геополитическое положение."
  PER_attack_first_tr:0 "Внезапная атака на Турцию"
  PER_attack_first_tr_desc:0 "Наш план предполагает внезапное и неожиданное военное нападение на Турцию, застигнув их врасплох и воспользовавшись стратегическими уязвимостями. Используя быстрые и решительные тактические приемы, мы стремимся добиться значительных территориальных завоеваний, подорвать военные возможности Турции и установить наше господство в регионе. Эта внезапная атака станет смелым заявлением о нашей силе и решимости."
  PER_declare_persian_empire:0 "Провозгласить Персидскую империю"
  PER_declare_persian_empire_desc:0 "Мы смело объявляем о создании новой Персидской империи, сигнализируя о наших стремлениях к региональной гегемонии и территориальной экспансии. Взывая к славе древней Персии и восстанавливая наше имперское наследие, мы стремимся утвердить свое господство над соседними государствами и закрепить свое положение как великой державы на Ближнем Востоке. Эта декларация знаменует собой новую эру возрождения и амбиций Персии."
  PER_prepare_for_one_last_war:0 "Готовиться к последней войне"
  PER_prepare_for_one_last_war_desc:0 "В ожидании неизбежного и решающего конфликта мы мобилизуем ресурсы нашей страны и готовимся к войне. Усиливая наши военные возможности, укрепляя нашу оборону и объединяя население, мы стремимся обеспечить победу перед лицом невзгод. Эта подготовка демонстрирует нашу непоколебимую приверженность защите нашего суверенитета и достижению наших стратегических целей, какой бы ни была цена."
  PER_retake_our_central_asian_lands:0 "Вернуть наши земли в Центральной Азии"
  PER_retake_our_central_asian_lands_desc:0 "Отстаивая свои исторические претензии и территориальные права, мы приступаем к кампании по возвращению наших утраченных земель в Центральной Азии. Мобилизуя наши военные силы, заключая союзы с симпатизирующими фракциями и используя дипломатические маневры, мы стремимся вернуть свои законные территории и восстановить славу нашей империи. Это начинание является смелым утверждением нашей национальной идентичности и решимостью исправить прошлые несправедливости."
  PER_mobilize_the_reserves:0 "Мобилизовать резервы"

  PER_mobilize_the_reserves_desc:0 "В ответ на растущую напряженность и угрозы национальной безопасности правительство приняло решение мобилизовать резервы. Мобилизация резервов демонстрирует нашу приверженность защите суверенитета и целостности нашей страны и посылает четкий сигнал нашим противникам о том, что мы не будем колебаться в защите себя."
  PER_patriotic_army:0 "Патриотическая армия"
  PER_patriotic_army_desc:0 "Чтобы укрепить нашу национальную оборону и повысить наш военный потенциал, мы создаем патриотическую армию, состоящую из преданных граждан, добровольцев и ополченцев. Эта армия, посвященная защите родины и сохранению национального суверенитета, будет служить бастионом против внешних угроз и внутренней нестабильности. Используя патриотический пыл нашего народа, мы обеспечиваем безопасность и процветание нашей нации на долгие годы."
  
  #Qajar
  PER_overthrow_the_shah:0 "Свергнуть Шаха"
  PER_overthrow_the_shah_desc:0 "В Иране в 1930-х годах политические волнения и экономические трудности приводили к народному недовольству. На этом фоне статья под названием «Свержение короля» попала на первые полосы газет. В статье описывалось состояние королевства путем создания вымышленного королевства.\n\nВ статье критиковалась диктатура короля и нищета народа. Автор утверждал, что король правил страной в своих собственных интересах и не слушал голос народа. В конце статьи было написано, что король был свергнут, а народ достиг состояния счастья. Было ясно, для кого была сделана эта вымышленная критика."
  PER_gather_support_for_qajar_dynasty:0 "Собрать поддержку династии Каджаров"
  PER_gather_support_for_qajar_dynasty_desc:0 "Династия Каджаров стремилась обеспечить стабильность, необходимую для развития страны, обеспечивая национальное единство и солидарность. Однако в 1925 году Реза-шах Пехлеви отложил весь план в сторону и ждал его гибели. Но этого не произошло."
  PER_invite_qajar_king:0 "Пригласить короля Каджара"
  PER_invite_qajar_king_desc:0 "Династия Пехлеви оказалась неправа. Но нам нужен лидер, который не является Пехлеви. Лучший вариант для этого — король из благородной династии Каджаров, наше бывшее величество. Мы представим это предложение обоим вариантам и попытаемся найти наиболее подходящего лидера."
  PER_destabilize_the_central_government:0 "Дестабилизировать центральное правительство"
  PER_destabilize_the_central_government_desc:0 "Внутренняя борьба и политическая нестабильность, подпитываемые слухами о приходе династии Каджаров, ослабляют авторитет центрального правительства и погружают страну в хаос. Слабость правительства приводит к росту экономических проблем и снижению уровня благосостояния населения. Возможно, это свидетельство того, что это правительство утратило власть."
  PER_raid_the_arms_depots:0 "Рейд на оружейные склады"

  PER_raid_the_arms_depots_desc:0 "По мере роста напряженности между династией Каджаров и династией Пехлеви, риск конфликта между двумя сторонами увеличивается. Разграбление вооружений может привести к проблемам с безопасностью по всей стране и поставить под угрозу безопасность жизни и имущества. Этот набег угрожает политической стабильности страны и может привести к гражданской войне."
  PER_get_support_from_religious_scholars:0 "Получить поддержку от религиозных ученых"
  PER_get_support_from_religious_scholars_desc:0 "В последние дни ходят слухи, что династия Каджаров получает все большую поддержку от религиозных ученых. Это знаменует собой значительный сдвиг в политическом и религиозном ландшафте Ирана. В прошлом ученые чаще выступали против династии. Однако в последнее время они, похоже, объединились, чтобы защитить династию в ответ на модернизирующие реформы шаха Реза Пехлеви."
  PER_kill_the_shah:0 "Убить шаха"
  PER_kill_the_shah_desc:0 "Сегодня ночью Реза-шах Пехлеви может больше не проснуться от сна. Да, это событие способно погрузить Иран в глубокий хаос. Причина убийства ясна. Было очевидно, что недавние реформы шаха вызвали недовольство в армии и что он пытался насильно обратить людей в свою религию. Я надеюсь, что армия быстро примет нового лидера."
  PER_hold_the_coronation_ceremony:0 "Провести церемонию коронации"
  PER_hold_the_coronation_ceremony_desc:0 "Сегодня на долгожданной церемонии новый король провел свою коронацию. Толпа собралась перед дворцом и восторженно приветствовала королевский кортеж, проезжавший мимо. Церемония включала в себя благословение короля коронационной короной и провозглашение начала его нового царствования. Было сделано множество фотографий и видеозаписей этого исторического события, которое встретили с энтузиазмом по всей стране. Есть большие надежды, что новый король приведет страну к процветанию и миру."
  PER_improve_relations_with_other_turkic_countries:0 "Улучшение отношений с тюркскими странами"
  PER_improve_relations_with_other_turkic_countries_desc:0 "Существует новая инициатива по улучшению отношений с тюркскими странами. Эта инициатива будет направлена на увеличение культурного обмена, продвижение экономического сотрудничества и укрепление политических связей."
  PER_turkification:0 "Начать тюркизацию"
  PER_turkification_desc:0 "Был сделан долгожданный шаг, и Иран начал новое движение по возвращению к турецкому языку и культуре. В рамках этой новой инициативы планируется популяризировать турецкий язык в образовании и использовать турецкий язык в качестве официального языка в государственных учреждениях. Кроме того, названия городов теперь будут на турецком языке."
  PER_imprison_political_opponents:0 "Заточить политических противников"

  PER_imprison_political_opponents_desc:0 "В последнее время правительство все чаще прибегает к аресту и тюремному заключению диссидентов. Правительство утверждает, что эти действия необходимы для защиты национальной безопасности. Оно утверждает, что диссиденты пытаются дестабилизировать страну и спровоцировать население."
  PER_get_rid_of_clergy:0 "Поставить духовенство под контроль"
  PER_get_rid_of_clergy_desc:0 "Религия и духовенство над нами, альхамдулиллях. Аллах велик, но не духовенство. Хотя они говорят правду большую часть времени, иногда они встают перед нами и создают проблемы, поэтому было бы гораздо лучше направить их."
  PER_ensure_full_control:0 "Обеспечить полный контроль"
  PER_ensure_full_control_desc:0 "В последнее время Каджарская династия предпринимает шаги по укреплению своего контроля в стране. Эта ситуация вызывает разные чувства у многих граждан. Некоторые считают, что эти шаги обеспечат политическую стабильность и порядок."
  PER_approach_germany:0 "Сближение с Германией"
  PER_approach_germany_desc:0 "В последнее время Иран предпринимает шаги по улучшению отношений с Германией. Эта ситуация вызывает разные толкования у многих граждан. Некоторые считают, что это сближение принесет Ирану экономическую и политическую выгоду. Они утверждают, что Германия поможет Ирану в модернизации и развитии.\n\nОднако противники опасаются, что это сближение подвергнет Иран экспансионистской политике нацистского режима. Они утверждают, что Германия попытается использовать Иран в своих интересах."
  PER_join_the_axis:0 "Присоединиться к Оси"
  PER_join_the_axis_desc:0 "Некоторые считают, что этот шаг защитит национальную безопасность и интересы Ирана. Они утверждают, что державы Оси создали сильный союз и что Иран окажется в более сильном положении, участвуя в этом союзе.\n\nОднако противники утверждают, что этот шаг приведет Иран к международной изоляции и может втянуть его во Вторую мировую войну. Они утверждают, что державы Оси не мирные и что Иран рискует, присоединяясь к этому союзу."
  PER_buy_german_arms:0 "Закупить немецкое оружие"
  PER_buy_german_arms_desc:0 "Иранское правительство подписало соглашение о закупке у Германии большого количества вооружений. Это важное событие, которое может значительно изменить баланс сил в регионе. Хотя точный объем сделки неизвестен, по оценкам, Иран закупает истребители, танки и другое оружие."
  PER_nationalize_oil_wells:0 "Национализировать нефтяные скважины"

  PER_nationalize_oil_wells_desc:0 "В историческом решении иранское правительство сегодня объявило о национализации всех нефтяных скважин в стране. Это решение даст Ирану полный контроль над своими нефтяными ресурсами и, как ожидается, внесет значительный вклад в экономику страны. Решение о национализации вызвало большие последствия в Иране и на международной арене. В то время как некоторые утверждают, что это решение укрепит суверенитет и независимость Ирана, другие опасаются, что оно может отбить желание у иностранных инвесторов и привести к росту цен на нефть."
  PER_agressive_foreign_policy:0 "Агрессивная внешняя политика"
  PER_agressive_foreign_policy_desc:0 "Агрессивная внешняя политика, проводимая Каджарской династией в последнее время, вызывает опасения в регионе. Династия предъявляет территориальные претензии к своим соседям и стремится расширить свое политическое и экономическое влияние. Эта ситуация усиливает напряженность в регионе и вызывает опасения, что она может привести к новой войне."
  PER_the_past_wont_be_forgotten:0 "Прошлое не забудется"
  PER_the_past_wont_be_forgotten_desc:0 "Прошлое - это свет, который освещает путь к будущему. Забыв о нем, мы можем повторить свои ошибки и попасть в те же ловушки. Поэтому очень важно понимать прошлое и учиться на нем."
  PER_claim_qajar_lands:0 "Претензия на земли Каджаров"
  PER_claim_qajar_lands_desc:0 "Недавно некоторые группы начали претендовать на земли, которые, по их утверждениям, принадлежали Каджарской династии. Эти требования вызывают напряженность в регионе и влекут за собой судебную тяжбу.\n\nАргументы заявителей основаны на исторических документах и семейных преданиях. Они утверждают, что Каджарская династия правила этими землями на протяжении веков, а их права передавались из поколения в поколение."
  PER_revoke_other_treaties:0 "Отмена других договоров"
  PER_revoke_other_treaties_desc:0 "Недавно иранское правительство решило аннулировать ряд международных соглашений. Это решение вызвало тревогу и беспокойство в регионе. Правительство утверждает, что приняло это решение для защиты национальных интересов и укрепления суверенитета страны.\n\nСреди аннулированных соглашений - торговые соглашения, политические соглашения и военные соглашения. Правительство утверждает, что эти соглашения не отвечают интересам Ирана и препятствуют развитию страны."
  PER_revoke_treaty_of_paris:0 "Отмена Парижского договора"
  PER_revoke_treaty_of_paris_desc:0 "По последним новостям, иранское правительство решило аннулировать Парижский договор, который был подписан в 1857 году. Это решение вызвало тревогу и беспокойство в регионе. Правительство утверждает, что приняло это решение для защиты национальных интересов и укрепления суверенитета страны. Кроме того, Иран требует возвращения территории Пакистана."
  PER_greater_qajar:0 "Великая Каджария"

  PER_greater_qajar_desc:0 "В последнее время попытки династии Каджаров увеличить свою региональную мощь и влияние усиливаются. Эти инициативы рассматриваются как часть видения, называемого «Великий Каджар». Это видение направлено на то, чтобы сделать Иран ведущей державой в регионе и повысить престиж и репутацию страны на международной арене."
  PER_reform_the_armed_forces:0 "Реформа вооруженных сил"
  PER_reform_the_armed_forces_desc:0 "В последнее время все больше и больше споров о необходимости реформирования вооруженных сил Ирана. В результате этих дискуссий каджарский король инициировал серию реформ. В результате армия должна стать более организованной и лучше подготовленной к вызовам."
  PER_fix_the_economy:0 "Улучшение экономики"
  PER_fix_the_economy_desc:0 "Любимый лидер Ирана, [PER.GetLeader], предпринимает важные шаги по модернизации и развитию страны. Одним из этих шагов является новая программа, которую он запустил для улучшения экономики. Эта программа направлена на увеличение сельскохозяйственного производства, продвижение индустриализации и улучшение инфраструктуры.\n\nЧтобы увеличить сельскохозяйственную производительность, король продвигает современные методы ведения сельского хозяйства и обеспечивает установку новых ирригационных систем. Кроме того, он поддерживает создание новых фабрик и приоритет отечественного производства. Инвестиции также вкладываются в важные инфраструктурные проекты, такие как дороги, железные дороги и порты."
  PER_mobilize_the_economy:0 "Мобилизация экономики"
  PER_mobilize_the_economy_desc:0 "Иранское правительство объявило об историческом плане экономической мобилизации для развития и модернизации страны. Этот план включает в себя крупные инвестиции в инфраструктуру, индустриализацию и модернизацию сельского хозяйства."
  PER_good_neighbor_policy:0 "Политика добрососедства"
  PER_good_neighbor_policy_desc:0 "Ожидается, что политика добрососедства поможет улучшить имидж Ирана в регионе и укрепить его отношения с международным сообществом. Эта политика также может быть выгодна для Ближнего Востока, способствуя миру и стабильности. Однако остается неизвестным, насколько успешной будет эта политика. Отношения Ирана с его соседями имеют сложную историю, и эта политика не гарантирует преодоления всех препятствий."
  PER_sign_non_aggression_pacts:0 "Подписание пактов о ненападении"
  PER_sign_non_aggression_pacts_desc:0 "Иран подпишет ряд пактов о ненападении со своими соседями в попытке снизить напряженность и сохранить мир в регионе. Согласно этим пактам, стороны не будут атаковать друг друга и будут пытаться мирно разрешать любые споры.\n\nПодписание пакта о ненападении является важным шагом, предпринятым Ираном для улучшения своих отношений с другими странами региона. Согласно этим пактам, торговля и сотрудничество между сторонами будут увеличиваться, а в регионе будут осуществляться совместные проекты развития."
  PER_treaty_of_friendship_with_the_turks:0 "Договор о дружбе с Турцией"

  PER_treaty_of_friendship_with_the_turks_desc:0 "Этот договор призван содействовать политическому, экономическому и культурному сотрудничеству между двумя странами.\n\nДоговор включает в себя взаимное признание суверенитета и территориальной целостности обеих стран. Он также включает в себя принципы невмешательства и мирного урегулирования отношений между двумя странами."
  PER_neutrality_effort:0 "Усилия по сохранению нейтралитета"
  PER_neutrality_effort_desc:0 "Иран принял решение проводить политику нейтралитета в период обострения международной напряженности. Цель этой политики - удержать страну от возможной войны и сохранить мир и стабильность.\n\nВ рамках своих усилий по сохранению нейтралитета Иран стремится оставаться вне политических и военных блоков. Кроме того, он занимает нейтральную позицию в международных спорах."
  PER_formalize_sadabat_pact:0 "Официальное оформление Договора Садабата"
  PER_formalize_sadabat_pact_desc:0 "На церемонии, состоявшейся вчера в Тегеране, вступил в силу Договор Садабата, подписанный между Ираном, Турцией, Ираком и Афганистаном. С подписанием договора, целью которого является укрепление мира и стабильности в регионе, а также развитие политического и экономического сотрудничества.\n\nВ церемонии подписания договора приняли участие шах [PER.GetLeader], турецкий лидер [TUR.GetLeader], иракский лидер [AFG.GetLeader] и афганский лидер [AFG.GetLeader]. В выступлениях, произнесенных на церемонии, было подчеркнуто, что пакт будет иметь благоприятные последствия для всех стран региона."
  PER_joint_military_training:0 "Совместные военные учения"
  PER_joint_military_training_desc:0 "В учениях примут участие отдельные подразделения армий стран, подписавших Договор Садабата. В рамках учений будут проведены различные военные маневры и упражнения.\n\nПредполагается, что совместные военные учения будут внимательно отслеживаться другими странами региона. Также существует вероятность того, что учения повлияют на политический и военный баланс в регионе."

  #Communist
  PER_restart_jungle_movement:0 "Возобновление движения «Джунгли»"
  PER_restart_jungle_movement_desc:0 "Пришло время возродить дух движения «Джунгли» - инициативы, которая когда-то вдохновляла массы на восстание против тирании. Мы будем учить принципам коммунизма наш народ и закладывать основы для революции, которая свергнет существующую монархию. Это первый шаг нашей революции по созданию народного правительства."
  PER_request_soviet_support:0 "Принять советское оружие"
  PER_request_soviet_support_desc:0 "В подготовке к возможному вооруженному конфликту во время нашей революции, мы должны обеспечить себе оружие от нашего коммунистического союзника, Советского Союза. Это оружие гарантирует, что мы будем хорошо оснащены, чтобы противостоять любой внутренней оппозиции и гарантировать дальнейшую военную поддержку в случае гражданской войны."
  PER_communist_partisans:0 "Коммунистические партизаны"

  PER_communist_partisans_desc:0 "Чтобы защитить революцию и сохранить ее импульс, нам нужно обучать коммунистических партизан. Эти преданные бойцы защитят наши достижения и могут быть мобилизованы на линию фронта в случае гражданской войны. Верные и хорошо подготовленные партизаны, которые будут защищать наше дело любой ценой, очень важны для нас."
  PER_creation_of_tudeh_party:0 "Создание партии Тудех"
  PER_creation_of_tudeh_party_desc:0 "Чтобы получить легитимность и организовать наши усилия, мы создадим партию Тудех. Эта новая политическая структура будет иметь четкое руководство и кадры, обеспечивая четкую структуру для нашего движения. Партия Тудех станет spearhead наших революционных действий, направляя нас к нашей конечной цели - коммунистическому государству."
  PER_towards_a_red_government:0 "К красному правительству"
  PER_towards_a_red_government_desc:0 "Наша революция прошла мирно, и мы взяли под контроль правительство. Монархии больше нет, и вся королевская семья будет изгнана. Это начало нашего пути к созданию красного правительства, которое отражает волю и потребности народа."
  PER_start_socialist_revolution:0 "Начать социалистическую революцию"
  PER_start_socialist_revolution_desc:0 "Мы должны признать, что мирный переход больше невозможен, и мы должны начать социалистическую революцию, прежде чем правительство раздавит нас. Вооружив наших партизан и сторонников, мы начнем решительное и кровавое восстание, чтобы свергнуть нынешний режим. Мы сделаем эту революцию любой ценой!"
  PER_purge_clergy_members:0 "Очистка от радикальных священнослужителей"
  PER_purge_clergy_members_desc:0 "Радикальные священнослужители долгое время препятствовали прогрессу нашей страны. Мы казним тех, кто причинил наибольший вред, и подорвем их влияние. Остальные священнослужители будут принуждены поддержать наше дело или столкнуться с серьезными последствиями."
  PER_rebuild_the_country_from_scratch:0 "Перестроить страну с нуля"
  PER_rebuild_the_country_from_scratch_desc:0 "По завершении революции необходимо исправить ошибки предыдущих правительств. Благодаря всеобъемлющим реформам мы перестроим нашу страну с нуля, обеспечивая долговечность нашего режима и повышая качество жизни нашего народа. Основы нашего нового режима должны быть прочными."
  PER_exile_pahlavi_dynasty:0 "Изгнание династии Пехлеви"
  PER_exile_pahlavi_dynasty_desc:0 "Династии Пехлеви нет места в нашем новом обществе. Каждый член королевской семьи будет изгнан навсегда, гарантируя, что они не смогут вернуться, чтобы бросить вызов нашему авторитету."
  PER_socialist_constitution:0 "Социалистическая конституция"
  PER_socialist_constitution_desc:0 "Мы разработаем и внедрим социалистическую конституцию, которая закрепляет равенство для всех граждан. Эта новая правовая основа направит нашу страну к справедливому и равноправному обществу, отражая наши революционные идеалы."
  PER_establish_tudeh_army:0 "Создание армии Тудех"

  PER_establish_tudeh_army_desc:0 "Нашей армии требуется серьезная реформа, чтобы она стала опорой нашего нового режима. Создание армии Тудех преобразует наши войска в грозную Красную армию, внушающую страх как внутренним оппозиционерам, так и враждебным соседям."
  PER_promote_atheism:0 "Пропаганда атеизма"
  PER_promote_atheism_desc:0 "Ислам и религиозные деятели принесли нашему народу больше вреда, чем пользы, и люди заплатили за это высокую цену. Чтобы обеспечить, что наша страна и народ могут сосредоточиться на прогрессивных шагах вперед, мы должны дистанцироваться от Ислама и принять атеизм. Теперь, когда духовенство под нашим контролем, на пути к пропаганде атеизма и освобождению нашей нации от оков религиозной догмы больше нет препятствий."
  PER_develop_spy_agency:0 "Создание разведывательного агентства"
  PER_develop_spy_agency_desc:0 "Чтобы лучше защитить нашу страну от внешних угроз, мы должны развивать и организовывать нашу шпионскую деятельность. Создание специализированного разведывательного агентства позволит нам проводить эффективные контрмеры и собирать важную информацию."
  PER_socialist_islamic_constitution:0 "Социалистическая исламская конституция"
  PER_socialist_islamic_constitution_desc:0 "Ислам всегда был неотъемлемой частью нашей страны. Теперь, когда мы казнили радикальных представителей духовенства, не осталось ни одной группы, которая могла бы причинить вред нашим людям своими экстремистскими идеями. Мы должны объединить социализм и ислам в единую конституцию, которая служит наилучшим интересам нашего народа."
  PER_red_islam:0 "Ислам с социалистическими чертами"
  PER_red_islam_desc:0 "Слияние ислама и социализма принесло нашей стране значительные выгоды. Наш народ принял эту комбинацию, что привело к увеличению процветания и удовлетворенности. Живя счастливо под знаменем ислама, наши граждане более устойчивы к периодическим вызовам."
  PER_islamist_army:0 "Исламистская армия"
  PER_islamist_army_desc:0 "Мы должны создать армию, основанную на исламских принципах, которая была бы одновременно справедливой и могущественной. Эта армия должна быть столь же справедливой и грозной, как силы, возглавляемые Hz. Мухаммедом, чтобы наши враги дважды подумали, прежде чем нападать на нас."
  PER_power_of_equality:0 "Сила равенства"
  PER_power_of_equality_desc:0 "Сила равенства имеет первостепенное значение. Независимо от их религии или этнической принадлежности, наши граждане должны знать, что они равны перед законом. Никто не превосходит другого, и мы должны отстаивать этот принцип."
  PER_start_red_middle_east_plan:0 "План «Красный Ближний Восток»"
  PER_start_red_middle_east_plan_desc:0 "После успеха нашей революции и последующего роста процветания нашей страны пришло время распространить этот прогресс на наших соседей по Ближнему Востоку. Каждая страна в регионе заслуживает того, чтобы пользоваться преимуществами социализма. Мы продемонстрируем преимущества нашей системы и, если необходимо, применим силу, чтобы ввести сопротивляющиеся государства в состав. Наша миссия - обеспечить, чтобы все люди на Ближнем Востоке имели право жить в мире и процветании."

  PER_join_the_comitern:0 "Присоединиться к Коминтерну"
  PER_join_the_comitern_desc:0 "Наше будущее связано с коммунизмом, поэтому мы должны присоединиться к нашим товарищам по всему миру в этой глобальной борьбе. Сталин покажет нам путь и поведет рабочих к славному завтра."
  PER_soviet_economic_support:0 "Советская экономическая поддержка"
  PER_soviet_economic_support_desc:0 "Нет позора в том, чтобы искать помощи у более крупных и развитых стран. В войне за защиту революции каждый рабочий, крестьянин и инженер - наш товарищ, и мы приветствуем их помощь в развитии наших отраслей, как мы сделали бы, если бы роли были перевернуты."
  PER_nkvd_assistance:0 "Помощь НКВД"
  PER_nkvd_assistance_desc:0 "Агенты НКВД относятся к числу самых опытных в мире. Поскольку мы дружим с Советским Союзом, мы можем пригласить их в нашу страну и не допустить, чтобы империалисты спровоцировали гражданские беспорядки в нашей стране."
  PER_independent_alliance:0 "Независимый союз"
  PER_independent_alliance_desc:0 "Хотя мы получили помощь от Советов во время нашей революции, это не означает, что мы откажемся от нашего суверенитета или независимости нашего народа от советского влияния. Наша цель - создать альянс, который сохранит нашу автономию и гарантирует, что наша нация останется свободной от внешнего контроля. Мы будем твердо стоять за нашу независимость, обеспечивая наше будущее без превращения в марионетку какой-либо иностранной державы."
  PER_liberate_arab_workers:0 "Освободить арабских рабочих"
  PER_liberate_arab_workers_desc:0 "Пришло время реализовать наш план «Красного Ближнего Востока». Мы пригласим страны, которые приняли социализм и подняли свой народ, присоединиться к нашему альянсу, чтобы двигаться вперед вместе в единстве. Для тех, кто все еще находится под гнетом монархических режимов, которые игнорируют благосостояние своих граждан, мы продемонстрируем им нашу силу. Наша цель - освободить арабских рабочих и принести обещание социализма во всем регионе."
  #Qajar / Communist
  PER_recover_from_civil_war:0 "Оправиться от гражданской войны"
  PER_recover_from_civil_war_desc:0 "Гражданская война была изнурительной и оставила нашу страну и народ измученными. Однако это не конец нашей страны. Мы должны использовать наши ресурсы, чтобы залечить эти раны и исправить ущерб, нанесенный конфликтом. Сосредоточившись на восстановлении и восстановлении, мы быстро восстановим нашу страну и обеспечим нашим гражданам стабильность и надежду, которые им нужны, чтобы двигаться вперед."
  PER_encourage_schools:0 "Поощрять школы"
  PER_encourage_schools_desc:0 "К сожалению, наша грамотность довольно низкая. Чтобы исправить это, мы должны построить новые школы и запустить инициативы, которые поощряют людей к получению образования. Пропагандируя грамотность и образование, мы обеспечим, чтобы будущие поколения были лучше подготовлены и более осведомлены. Это значительный шаг к более развитому и просвещенному Ирану."

  #Islamic
  PER_islamic_revolution:0 "Начинается исламская революция"

  PER_islamic_revolution_desc:0 "Ради стольких мучеников\nОни отдали свои жизни за путь праведности\nУгнетенные наблюдают за путем\nМы отправляемся к тебе, чтобы принести Шариат, Шариат\n\nШариат, это свобода,\nШариат, это свобода\nЭто глоток жизни\nЕсли ты не хочешь, просто подожди"
  PER_rise_against_the_king:0 "Восстание против царя"
  PER_rise_against_the_king_desc:0 "Когда ангелы останавливаются, чтобы помолиться\nКогда площади покрыты пылью,\nКогда ты покидаешь тело жизни\n\nПришло время для мученичества, принесите такбир\nПришло время для мученичества, принесите такбир\nПришло время для мученичества, принесите такбир"
  PER_death_to_the_king:0 "Смерть царю"
  PER_death_to_the_king_desc:0 "Никогда, нет, мы не отклонимся\nНикогда, нет, мы не отклонимся\nМы никогда не отклонимся от шагов веры.\n\nУ нас долгий путь\nНаш путь долог с руководством Корана\nНикогда, нет, мы не отклонимся\nНикогда, нет, мы не отклонимся\nМы никогда не отклонимся от шагов веры."
  PER_islamic_state_of_iran:0 "Исламское государство Иран"
  PER_islamic_state_of_iran_desc:0 "Слушайте и повинуйтесь! Даже если правитель, назначенный над вами, - эфиопский раб с головой, как у черного изюма, слушайте и повинуйтесь, пока он применяет Книгу Аллаха среди вас"
  PER_holy_purge:0 "Святая чистка"
  PER_holy_purge_desc:0 "Исламистский режим предпринимает различные шаги для очистки светских сегментов. Эти шаги включают в себя закрытие светских учреждений, арест светских интеллектуалов и ограничение светского образа жизни.\n\nУсиливающиеся репрессии против светских сил в Иране являются тревожным развитием для демократии и прав человека в стране. Эта ситуация усиливает политическую напряженность и поляризацию в Иране."
  PER_cancel_reforms_against_sharia:0 "Отмена реформ против Шариата"
  PER_cancel_reforms_against_sharia_desc:0 "Законы, противоречащие закону Божьему, отменяются. Среди отмененных реформ - либерализация доступа женщин к некоторым общественным пространствам, ослабление цензуры и расширение свободы прессы."
  PER_ban_alcohol:0 "Запрет алкоголя"
  PER_ban_alcohol_desc:0 "Покров несчастья пьющего разорван, и Дьявол становится его спутником, ведя его к всякому злому делу и отводя от добрых дел.\n\n- из слов Абу аль-Касима аш-Шами ат-Табарани"
  PER_islamisation_program:0 "Программа исламизации"

  PER_islamisation_program_desc:0 "Помните, ислам — это круг. Пока он возвращается, вы должны вернуться в этот круг с книгой (Коран/Сунна). Заметьте, что книга и султанат (религия и государственные дела) будут разделены. Заметьте, что они (кто не среди нас) будут правителями над вами. Они будут править против вас так, как им выгодно.\n\nЕсли вы не слушаете их, они убьют вас, а если вы подчиняетесь, они уведут вас в заблуждение. Обращайтесь с ними так же, как обращались с ними компаньоны Иисуса, сына Марии. Их пилили и распинали, но они все равно не отказывались от своего дела. Смерть в послушании Аллаху лучше, чем жизнь в мятеже против Аллаха."
  PER_islamisation_of_universities:0 "Исламизация университетов"
  PER_islamisation_of_universities_desc:0 "Исламские курсы добавляются в университетские учебные планы, светские профессора увольняются, а светские элементы на университетских кампусах подавляются. Движение исламизации может отвести университеты Ирана от международных стандартов и негативно повлиять на научное и технологическое развитие страны."
  PER_mandatory_hijab:0 "Обязательный хиджаб"
  PER_mandatory_hijab_desc:0 "В последний период моей уммы будет много мужчин. Подобно мужчинам, они будут ездить на лошадях и спускаться к дверям мечетей. Их жены одеты, но голы, ничем не прикрывая свои головы. Проклинайте их. Ибо они прокляты.\n\n-из Ибн Хиббана аль-Бусти"
  PER_jizya_tax:0 "Джизья"
  PER_jizya_tax_desc:0 "В последние годы исламистские группировки в Иране требуют взимания подушного налога с меньшинств. Эта ситуация приводит к усилению давления на меньшинства в Иране. Подушный налог — это вид налога, взимаемого с меньшинства людей Писания, которые не принимают ислам. Исламистские группировки утверждают, что повторное введение этого налога станет стимулом для меньшинств в Иране перейти в ислам."
  PER_fight_for_god:0 "Борьба за Аллаха"
  PER_fight_for_god_desc:0 "Тот, кто снабжает солдата (для войны) для борьбы на пути Аллаха (swt), будет как будто сам сражался. И тот, кто хорошо заботится о своей семье после ветерана, который идет на войну на пути Аллаха (swt), будет как будто сам сражался.\n\n-из Мухаммада аль-Бухари"
  PER_guardians_of_the_islamic_revolution:0 "Хранители исламской революции"
  PER_guardians_of_the_islamic_revolution_desc:0 "В отличие от традиционной армии, Хранители исламской революции — это армия, основанная на идеологической приверженности и верности революции. Состоящая из профессиональных солдат и добровольцев, Хранители исламской революции обладают широким спектром военных возможностей, включая сухопутные, морские и воздушные силы."
  PER_holy_jihad:0 "Священный джихад"

  PER_holy_jihad_desc:0 "Передал 'Абдулла ибн Масуд: Он сказал посланнику Аллаха:\n"О посланник Аллаха! Какое дело более добродетельное?"\nОн сказал: "Молитва, которая совершается вовремя."\n"Какая следующая?" Спросил.\nОн сказал: "Быть добрым к своим родителям."\nЯ спросил: "Какая следующая?"\nОн сказал: "Это джихад на пути Аллаха.""
  PER_attack_iraq_islamist:0 "Атака на Ирак"
  PER_attack_iraq_islamist_desc:0 "Исламистские группировки утверждают, что они совершили эти атаки, чтобы защитить шиитов в Ираке и положить конец присутствию суннитов в регионе. Однако эти атаки также нацелены на мирных жителей и привели к серьезному гуманитарному кризису в регионе. Война теперь неизбежна."
  PER_attack_saudi_arabia:0 "Атака на Саудовскую Аравию"
  PER_attack_saudi_arabia_desc:0 "Исламистское движение в Иране освободит Святую Землю от ее неверных. Если вы не верите, просто подождите. Когда придет время, вы, как и все остальные, будете ждать, чтобы мы сжалились."
  PER_war_against_remaining_sunni_states:0 "Война против оставшихся государств суннитов"
  PER_war_against_remaining_sunni_states_desc:0 "Длительные напряженные отношения, наконец, достигли точки взрыва. Сегодня утром шиитские лидеры объявили джихад против оставшихся государств суннитов. Это шокирующее событие рассматривается как начало крупномасштабного конфликта в регионе."
  PER_demand_annexation_of_sunni_states:0 "Требовать аннексии государств суннитов"
  PER_demand_annexation_of_sunni_states_desc:0 "В заявлении сегодня, шиитское иранское правительство потребовало аннексии всех государств суннитов. Это шокирующее требование еще больше обостряет напряженность в регионе и может спровоцировать полномасштабный конфликт.\n\nЛидеры Ирана утверждают, что это решение необходимо для объединения региона и избавления от суннитского гнета. Государства суннитов отрицают эти обвинения и утверждают, что Иран пытается захватить регион."
  PER_attack_turks:0 "Уничтожить светских мусульман"
  PER_attack_turks_desc:0 "Мы должны поставить на колени атеистическое мусульманское сообщество, созданное Мустафой Кемалем Ататюрком, которым был одержим шах Реза Пехлеви. Мы должны уничтожить их всех, иначе, если даже один турок останется в живых, он придет и уничтожит нас. Мы должны раздавить голову змеи, прежде чем она вырастет!"
  PER_focus_on_east:0 "Сосредоточиться на Востоке"
  PER_focus_on_east_desc:0 "Они так и не смогли убрать революции, совершенные Амануллой-ханом под влиянием Ататюрка, из страны. Наша задача - очистить их. Если ты умрешь в горах Афганистана, если ты фактически не умрешь, ты будешь продолжать следовать за нами с места мученичества с Хазратом Али в глазах Бога."
  PER_declare_islamic_caliphate:0 "Объявить Исламский халифат"

  PER_declare_islamic_caliphate_desc:0 "Моя родина, моя родина, моя история и моя безопасность\nИ место жительства условий безопасности\nМои фабрики, чтобы сделать людей\nЯ буду милосердно поддерживать все народы для них\nМой родной город, мой родной город, моя история и моя безопасность\nИ место жительства условий безопасности\nМои фабрики, чтобы сделать людей\nЯ буду милосердно поддерживать все народы для них\nИ мы должны умереть за это\nМужчины сражаются с испуганным сердцем\nЭто кризис отправки, и именно для этого мы здесь\nРоговые мечи и ограждения стены\nИ мы должны умереть за это\nМужчины сражаются с испуганным сердцем\nЭто кризис отправки, и именно для этого мы здесь"
  PER_declare_war_on_infidels:0 "Объявить войну еретикам"
  PER_declare_war_on_infidels_desc:0 "Только что рассвело\nПоявились проводники\nСобственность и жизнь были оставлены\nМы отправились к тебе, чтобы ты пришел, Шариа, Шариа\nМы ждали, мы долго ждали\nМы сказали, что это не придет в ожидании\nМы встали и пошли к тебе"
  PER_sword_of_islam:0 "Меч Аллаха"
  PER_sword_of_islam_desc:0 "Острый, как меч, ветер, волны в изобилии.\nСильный, как лошадь, лев, гром, сверкающий.\nОстрый, как меч, ветер, волны в изобилии.\nСильный, как лошадь, лев, гром, сверкающий."
 
  #Economic
  PER_economic_restoration:0 "Экономическое восстановление"
  PER_economic_restoration_desc:0 "Иран осуществляет комплексный план развития для возрождения своей экономики после глобального кризиса. Благодаря новым инвестициям и инфраструктурным проектам, количество рабочих мест увеличится, а уровень благосостояния в стране повысится. В рамках плана развития также будут модернизированы секторы сельского хозяйства и промышленности, а производственные мощности увеличатся."
  PER_kickstart_the_industry:0 "Запустить промышленность"
  PER_kickstart_the_industry_desc:0 "Наша промышленность есть, ей просто нужно небольшое толчок в правильном направлении, чтобы она функционировала так, как должна."
  PER_extraction_efforts:0 "Усилия по добыче"
  PER_extraction_efforts_desc:0 "Наши страны полны ресурсов. Если мы сможем максимально использовать их, мы можем значительно улучшить нашу экономику."
  PER_steel_extraction:0 "Добыча стали"
  PER_steel_extraction_desc:0 "Иран стремится ускорить индустриализацию и развитие страны, инвестируя в увеличение производства стали. Увеличение производства стали будет способствовать более быстрому и эффективному завершению инфраструктурных проектов страны"
  PER_aluminium_extraction:0 "Добыча алюминия"
  PER_aluminium_extraction_desc:0 "Алюминиевый завод будет оснащен новейшими технологиями, что позволит производить продукцию высокого качества. Значительная часть производимого алюминия будет экспортироваться, и в страну будет поступать валютная выручка."
  PER_expand_oil_fields:0 "Расширение нефтяных месторождений"

  PER_expand_oil_fields_desc:0 "Расширяя свои нефтяные месторождения, Иран стремится увеличить запасы нефти в стране и, таким образом, ее экономическую мощь. С увеличением нефтяных доходов развитие страны ускорится, будут сделаны новые инвестиции, а уровень благосостояния населения повысится. Увеличивая добычу нефти, Иран получит более сильную позицию на мировом энергетическом рынке и станет важным игроком в международной торговле."
  PER_support_urbanization:0 "Поддержка урбанизации"
  PER_support_urbanization_desc:0 "Иран продвигает урбанизацию для быстрого развития и модернизации страны. В современных городах инфраструктура и общественные услуги более развиты, а уровень жизни выше. Урбанизация способствует экономическому росту страны, стимулируя индустриализацию и торговлю."
  PER_new_investment_plans:0 "Новый инвестиционный план"
  PER_new_investment_plans_desc:0 "Иран разработал новый инвестиционный план для ускорения развития и модернизации страны. В рамках плана инвестиции будут направлены в стратегические области, такие как инфраструктура, промышленность, сельское хозяйство, энергетика и образование. Частный сектор будет играть важную роль в новом инвестиционном плане и способствовать развитию страны."
  PER_expand_university_of_tehran:0 "Расширение Тегеранского университета"
  PER_expand_university_of_tehran_desc:0 "Тегеранский университет расширяется, чтобы модернизировать систему образования страны и привести ее к мировым стандартам. С расширением университета большее количество студентов получит возможность получить образование, а страна получит квалифицированные кадры. В рамках расширения будут открыты новые факультеты и кафедры, а студентам будет предложено больше возможностей для обучения."
  PER_national_bank_of_iran:0 "Национальный банк [GetIranName]"
  PER_national_bank_of_iran_desc:0 "Создание Национального банка Ирана является важным шагом для укрепления экономической независимости страны и ускорения национального развития. Национальный банк укрепит финансовую систему страны, поможет сохранить стоимость валюты и стабилизировать национальную экономику. Национальный банк будет способствовать развитию страны, стимулируя отечественные и иностранные инвестиции."
  PER_imperial_bank_of_persia:0 "Императорский банк Персии"
  PER_imperial_bank_of_persia_desc:0 "Создание Национального банка Персии является важным шагом для укрепления экономической независимости страны и ускорения национального развития. Национальный банк укрепит финансовую систему страны, поможет сохранить стоимость валюты и стабилизировать национальную экономику. Национальный банк будет способствовать развитию страны, стимулируя отечественные и иностранные инвестиции."
  PER_expand_agricultural_lands:0 "Расширение сельскохозяйственных земель"

  PER_expand_agricultural_lands_desc:0 "Иран расширяет сельскохозяйственные районы для обеспечения продовольственной безопасности и увеличения сельскохозяйственного производства. С расширением сельскохозяйственных районов повысится благосостояние крестьян и будет способствовать развитию сельских районов. Избыток продукции обеспечит приток иностранной валюты в страну за счет экспорта сельскохозяйственной продукции."
  PER_open_the_new_trade_routes:0 "Открыть новые торговые пути"
  PER_open_the_new_trade_routes_desc:0 "Новые торговые пути увеличат долю Ирана в мировой торговле и повысят престиж страны на международной арене. Новые торговые пути стимулируют иностранные инвестиции и обеспечат приток капитала в страну. Новые торговые пути помогут повысить благосостояние иранского народа и улучшить качество жизни."
  PER_new_industrial_technologies:0 "Новые промышленные технологии"
  PER_new_industrial_technologies_desc:0 "Иран стремится ускорить индустриализацию и обеспечить развитие страны за счет использования новых промышленных технологий. Новые технологии увеличат экономическую диверсификацию страны, позволив развить новые продукты и услуги. Новые промышленные технологии создадут новые рабочие места и внесут вклад в занятость."
  PER_attract_people_business_activity:0 "Привлечение людей к предпринимательству"
  PER_attract_people_business_activity_desc:0 "Обучая наших людей финансовой и предпринимательской грамотности, мы можем рассчитывать на повышение темпов роста ряда секторов экономики."
  PER_reorganize_the_military_industry:0 "Реорганизация военной промышленности"
  PER_reorganize_the_military_industry_desc:0 "Мы должны стать более сильной и влиятельной страной в регионе, сосредоточившись на военной промышленности."
  PER_iranian_small_arms_production:0 "Иранское производство стрелкового оружия"
  PER_iranian_small_arms_production_desc:0 "У нас есть мощная промышленность, но не вся она хорошо приспособлена для производства боевых материалов. Поиск эффективных процессов для облегчения этого изменения будет ключом к использованию наших ресурсов."
  PER_develop_city_infrastructure:0 "Развитие городской инфраструктуры"
  PER_develop_city_infrastructure_desc:0 "В Иране начат крупный проект по улучшению инфраструктуры городов. Это значительно повысит качество жизни людей, проживающих в городах. Современные дороги, мосты и системы общественного транспорта сделают городской транспорт проще и быстрее. Инвестиции в инфраструктуру также будут способствовать экономическому развитию городов и созданию новых рабочих мест."
  PER_finish_the_trans_iranian_railway:0 "Завершение строительства Трансиранской железной дороги"
  PER_finish_the_trans_iranian_railway_desc:0 "Проект Трансиранской железной дороги, который строился многие годы, наконец близится к завершению. Этот проект станет важной вехой в развитии и модернизации Ирана. Железная дорога ускорит экономическое развитие, способствуя развитию сельскохозяйственного, промышленного и горнодобывающего секторов страны."

  PER_supply_centers:0 "Построить пункты снабжения"
  PER_supply_centers_desc:0 "Иран создает стратегические пункты снабжения, чтобы обеспечить бесперебойную доставку товаров и услуг в каждый уголок страны. Современные и интегрированные пункты снабжения внесут значительный вклад в экономику, сократив логистические расходы и повысив скорость распределения."
  PER_rocketry_focus:0 "Ракетная техника"
  PER_rocketry_focus_desc:0 "Ракетостроение — это будущее. Мы должны как можно быстрее использовать его преимущества."
  PER_national_defense_institute:0 "Институт национальной обороны"
  PER_national_defense_institute_desc:0 "Технологии решают все. Создание института для исследования оборонных технологий позволит нам изучать новые технологии. Мы должны быть уверены, что мы всегда опережаем наших врагов и не отстаем в технологиях."
  PER_agrarian_reform:0 "Аграрная реформа"
  PER_agrarian_reform_desc:0 "Нам нужно уделить внимание фабричному производству, реформируя сельское хозяйство. В этот период открытие новых фабрик важнее многих других вещей."

  #Army
  PER_learn_from_mistakes:0 "Учиться на ошибках"
  PER_learn_from_mistakes_desc:0 "Пришло время учиться на ошибках прошлого и строить более совершенную и современную армию."
  PER_modernize_small_arms:0 "Модернизировать стрелковое оружие"
  PER_modernize_small_arms_desc:0 "Вместо разных типов оружия армия будет использовать стандартизированное оружие. Это сократит логистические и учебные расходы. Новое оружие, насколько это возможно, будет производиться в Иране. Это укрепит оборонную промышленность страны и снизит зависимость от иностранного производства."
  PER_motorization_effort:0 "Моторизация войск"
  PER_motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасной доставки пехоты на поле боя и обратно. Сосредоточение внимания на этих разработках позволит нам действовать быстро."
  PER_armor_effort:0 "Бронетанковая мощь"
  PER_armor_effort_desc:0 "Наши танки устарели. Мы должны сосредоточиться на разработке новых моделей, чтобы соответствовать военным эволюциям нашего времени."
  PER_modernize_artillery:0 "Модернизировать артиллерию"
  PER_modernize_artillery_desc:0 "Пехота не может функционировать без надлежащей артиллерийской поддержки. Обеспечение современных, высококачественных орудий значительно повысит эффективность наших сил."
  PER_anti_air_support:0 "Противовоздушная поддержка"
  PER_anti_air_support_desc:0 "Если у нас нет сил для создания флота качественных самолетов, мы должны по крайней мере не позволять вражеским самолетам летать над нами."
  PER_conduct_army_drills:0 "Проводить армейские учения"
  PER_conduct_army_drills_desc:0 "Во время учений также будут представлены современные вооружения Ирана. Таким образом, всему миру будет продемонстрировано, что армия является современной и мощной силой. Это также посылает сообщение о национальном единстве и солидарности иранского народа."
  PER_update_our_tactics:0 "Обновить тактику"
  PER_update_our_tactics_desc:0 "С новым современным оборудованием приходит новая современная тактика, и мы должны наверстать упущенное в обоих случаях, если хотим иметь грозные сухопутные войска."

  PER_open_new_military_schools:0 "Открыть новые военные училища"
  PER_open_new_military_schools_desc:0 "Иран открывает новые военные училища для подготовки будущих офицеров. Эти училища будут способствовать укреплению военной мощи страны и ее модернизации. Новые училища будут оснащены современными методами обучения и учебными программами. Таким образом, офицеры иранской армии будут ознакомлены с новейшими технологиями и тактикой."
  PER_mountain_war:0 "Горная война"
  PER_mountain_war_desc:0 "Иранские солдаты проходят суровую подготовку в горах, чтобы улучшить свою выносливость и боевые навыки. Горная подготовка также дает солдатам навыки лидерства, выносливости и командной работы. Солдаты, прошедшие эту сложную подготовку, полны глубокой преданности своей родине и флагу."
  PER_build_defensive_lines:0 "Строительство оборонительных линий"
  PER_build_defensive_lines_desc:0 "Эти линии обороны будут служить сдерживающим фактором для потенциальных агрессоров и помогут защитить территориальную целостность Ирана. Линии обороны будут оснащены новейшими технологиями и оборудованием. Таким образом, иранская армия будет готова к любой атаке."

  PER_naval_effort:0 "Морские усилия"
  PER_naval_effort_desc:0 "Расширение нашего флота должно быть нашим первоочередным приоритетом. Направьте все доступные ресурсы на новые верфи и исследования легких надводных кораблей."
  PER_ensure_commercial_protection:0 "Обеспечение коммерческой защиты"
  PER_ensure_commercial_protection_desc:0 "Иран начнет производить свои собственные корабли для защиты своих торговых судов. Таким образом, у нас будет более безопасное и сильное присутствие на морских торговых путях. Таким образом, у нас появится возможность развивать отечественный опыт в области морской техники и создавать новые рабочие места."
  PER_expand_shipbuilding_capacities:0 "Расширение судостроительных мощностей"
  PER_expand_shipbuilding_capacities_desc:0 "Судостроительную промышленность нашей страны не следует упускать из виду, поскольку она будет иметь решающее значение для развития будущего флота."
  PER_protection_of_strait_of_hormuz:0 "Защита Ормузского пролива"
  PER_protection_of_strait_of_hormuz_desc:0 "Ормузский пролив - это единственный морской путь, по которому могут атаковать наши нефтеперерабатывающие заводы и, что более важно, наши прибрежные города. Если мы перехватим врага до того, как он доберется сюда, выжить с меньшими потерями будет намного проще."
  PER_dominate_the_persian_gulf:0 "Доминирование в Персидском заливе"
  PER_dominate_the_persian_gulf_desc:0 "Персидский залив содержит значительную часть мировых запасов нефти. Поэтому морское господство в регионе имеет жизненно важное значение для процветания и безопасности нашей страны. В рамках этой новой инициативы Иран оснастит свой флот современными кораблями. Таким образом, мы преобразуем наше присутствие на море в сдерживающую силу."
  PER_produce_submarines:0 "Производство подводных лодок"
  PER_produce_submarines_desc:0 "Мы должны сосредоточить наши подводные силы на силе, которая может лишить наших врагов ресурсов, уничтожая их конвои."

  PER_doctrine_effort_navy:0 "Усиление доктрины"
  PER_doctrine_effort_navy_desc:0 "Иранский флот состоит из опытных и компетентных специалистов. Несмотря на большое количество кораблей, самое главное - это то, что все всегда действуют как единое целое. Новая доктрина будет сосредоточена на развитии навыков и возможностей этих специалистов."

  PER_air_innovations:0 "Воздушные инновации"
  PER_air_innovations_desc:0 "Мир изменился, и на небе открылся новый фронт. Мы должны производить новые самолеты для наших солдат, которые будут сражаться на этом фронте."
  PER_air_superiority:0 "Воздушное превосходство"
  PER_air_superiority_desc:0 "У нас никогда не было промышленности, чтобы одновременно защищать наше небо и бомбить наших врагов. Если ситуация дойдет до того, что нам нужно будет решить, что важнее: нанести больше ударов по врагам или спасти больше своих от их атак, мы всегда будем выбирать спасение наших соотечественников."
  PER_development_fighters:0 "Разработка истребителей"
  PER_development_fighters_desc:0 "Основанная в 1925 году, наша военно-воздушная сила наконец получит истребитель собственной разработки. Производство собственных истребителей значительно усилит нашу противовоздушную оборону. Таким образом, воздушные границы нашей страны будут более защищены, чем когда-либо."
  PER_modernize_our_cas:0 "Модернизация CAS"
  PER_modernize_our_cas_desc:0 "Ближняя воздушная поддержка является ключом к победе в сражениях. Разработка большего количества пикирующих бомбардировщиков поможет нам в этом."
  PER_build_new_airbases:0 "Строительство новых авиабаз"
  PER_build_new_airbases_desc:0 "Нам понадобятся новые авиабазы, чтобы поддерживать быстро растущую авиацию."
  PER_aircraft_innovations:0 "Инновации в области авиации"
  PER_aircraft_innovations_desc:0 "Ежегодно появляются новые авиационные технологии. Эти технологии могут быть нам очень полезны."
  PER_light_bombers:0 "Разработка тактических бомбардировщиков"
  PER_light_bombers_desc:0 "Наши враги не смогут противостоять нашим бомбардировщикам! Их страны будут превращены в пепел, прежде чем они попытаются отправить самолет в наше воздушное пространство."

  #Dynamic Name
  PER_imperial_iranian_army:0 "[GetIranArmyName]"
  PER_imperial_iranian_army_desc:0 "В последние годы вооруженные силы Ирана проходят значительный процесс модернизации и укрепления. Оснащенная новым оружием и оборудованием, иранская армия начала становиться одной из самых мощных в регионе."
  PER_ISLAMIC_ARMY_NAME:0 "Армия Исламской Республики Иран"
  PER_COMMUNIST_ARMY_NAME:0 "Иранская народная армия"
  PER_DEMOCRATIC_ARMY_NAME:0 "Иранская армия"
  PER_ARMY_NAME:0 "Императорская иранская армия"
  PER_PERSIAN_ARMY_NAME:0 "Императорская персидская армия"
 
  PER_imperial_iranian_ground_force:0 "[GetIranGroundArmyName]"
