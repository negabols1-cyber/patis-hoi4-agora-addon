l_russian:
  prca.1.t:0 "[broadcast_from.GetAdjective] пропаганда по радио"
  prca.1.d:0 "Информационное бюро сообщает, что [broadcast_from.GetNameDef] начал вещание специальной радиопрограммы под названием \"[prca_broadcast_radio_station_event]\". Ее цель - деморализовать армию и народ. В передачах сообщается о [This.GetAdjective] потерях в войне и победах противника, а также о многочисленных предупреждениях и призывах к сдаче.\n\nХотя мы можем предупредить общественность о враждебных намерениях этих передач, неизбежно, что некоторые люди будут подвержены их влиянию. Кажется, в этой ситуации мы ничего не можем поделать."
  prca.1.a:0 "Нужно держать ситуацию под контролем."
  prca.1.b:0 "В любом случае, они говорят только чушь."
  prca.1.tt:0 "Отключить событие для \"§Yвраждебных радиопередач§!\""
  prca.4.t:0 "Вражеские самолеты сбрасывают пропагандистские листовки"
  prca.4.d:0 "В последние дни вражеские бомбардировщики сбрасывают пропагандистские листовки над нашими городами. В некоторых из них говорится об уничтожении наших заводов или поощряется сопротивление среди населения, а другие пытаются помешать нашим собственным пропагандистским усилиям, разглашая важную информацию. В любом случае, нет никаких сомнений, что наша стабильность и моральный дух находятся под угрозой, если не будут приняты меры.\n\nМы должны как можно скорее найти решение этой проблемы."
  prca.4.a:0 "У нас есть более важные проблемы в данный момент."
  prca.4.b:0 "Пусть полиция собирает эти листовки."
  prca.4.c:0 "Наши ВВС должны усилить атаки на эти бомбардировщики."
  prca.4.tt:0 "Прирост \"§Y[prca_last_activated_leaflet]§!\""
  prca.5.t:0 "[ROOT.GetName]: обнаружен устаревший субмод!"
  prca.5.d:0 "Кампании пропаганды обнаружили устаревший субмод для: §R[ROOT.GetName]§!\nСубмод для §R[ROOT.GetName]§! работает на версии §R[prca_outdated_version]§! вместо последней версии §R[prca_latest_version]§!, что может привести к ошибкам во время игрового процесса. Пожалуйста, свяжитесь с создателем субмода, чтобы решить эту проблему."
  prca.5.a:0 "Понял."
  prca.5.b:0 "Отключить PRCA для [ROOT.GetName]"
  prca.5.tt:0 "Отключает пропагандистские кампании для [ROOT.GetNameDef] в этом §Yсохранении§!. Пожалуйста, отключите субмод в §YParadox Launcher§!, если вы все еще столкнетесь с какими-либо проблемами."