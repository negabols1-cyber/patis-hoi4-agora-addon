l_russian:
 EF_news.1.d:0 "6 июля 1938 года японская Квантунская армия расшифровала сообщение, отправленное советским командиром из района Посьета в штаб-квартиру советских войск в Хабаровске.\nВ сообщении рекомендовалось разрешить советским солдатам занять незанятую возвышенность к западу от озера Хасан, в первую очередь спорные высоты Чанкуфэн, поскольку Советскому Союзу было бы выгодно занять территорию, откуда просматривался корейский портовый город Раджин, а также стратегические железные дороги, соединяющие Корею с Маньчжурией. В течение следующих двух недель небольшие группы советских пограничных войск перешли в этот район и начали укреплять гору окопами, траншеями, сетями и системами связи.\nВначале японская Корейская армия, которая была назначена для защиты этого района, проигнорировала наступление советских войск.\nОднако Квантунская армия, чья административная юрисдикция перекрывала Чжан Гуфэн (Чанкуфэн), заставила Корейскую армию предпринять больше действий, так как она подозревала намерения Советского Союза."
 EF_news.3.d:0 "Советские войска состояли из 57-го особого корпуса, дислоцированного в Забайкальском военном округе. Они отвечали за защиту границы между Сибирью и Маньчжурией. Монгольские войска в основном состояли из кавалерийских бригад и легких артиллерийских подразделений, и, как оказалось, были эффективны и маневренны, но не хватало брони и живой силы в достаточном количестве.\n2 июня 1939 года Климент Ворошилов, нарком обороны, сказал Георгию Жукову, что Сталин недоволен местным командующим, и он должен отправиться в Монголию, принять командование 57-м особым корпусом и ликвидировать японские провокации, нанеся решительное поражение Императорской японской армии (когда его вызвали в Москву 1 июня, он опасался, что его арестуют и допросят в НКВД). Советские и японские армии снова стоят друг против друга."
 EF_news.5.d:0 "С первых дней войны наблюдается невероятное превосходство Германии. Бомбардировщики-штуки терроризируют небо. 2600 немецких танков против 150 польских. Только в Варшаве немецкие самолеты убили 25000 мирных жителей. По оценкам, к концу года число казненных составит от 45 000 до 500 000."
 EF_news.6.d:0 "Ливинов говорит об аншлюсе. Великие державы должны занять твердую и твердую позицию. Он подчеркивает, что аншлюс может нарушить мир во всем мире, и что великие державы должны предпринять шаги по этому вопросу и что немцы не должны начинать новую мировую войну."
 EF_news.8.d:0 "В сентябре 1937 года Муссолини посетил Германию с официальным визитом, где его встретили длинным парадом войск, артиллерии и военной техники. Эти демонстрации силы, очевидно, были созваны, чтобы произвести впечатление на итальянского лидера, и, судя по всему, это сработало. Два месяца спустя Италия присоединилась к Германии и Японии в Антикоминтерновском пакте — соглашении противостоять экспансии Советского Союза и предотвратить распространение коммунизма.\nВлияние Гитлера на Муссолини стало очевидным в расовом манифесте итальянского лидера (июль 1938 года). Этот указ, который оказался очень непопулярным в Италии, лишил итальянских евреев их гражданства и отстранил их от государственных должностей."
 EF_news.9.d:0 "3 мая Гитлер прибыл в Рим в сопровождении Геббельса и Риббентропа, а также примерно пятисот партийных чиновников, дипломатов, охранников и журналистов на трёх поездах. Для немцев была построена специальная станция, их приветствовали Муссолини и король Виктор Эммануил. Рим был украшен украшениями, включая свастики, и была построена новая улица, Виа Адольфа Гитлера, по которой немецкий лидер проехал до Квиринальского дворца, где он остановился в качестве гостя короля. Виктор Эммануил и Гитлер были утомительны друг для друга. Гитлер чувствовал себя некомфортно при дворе и считал, что с ним обращаются с презрением. Говорят, что король спросил у немецкого лидера, сколько гвоздей было в пехотном сапоге Германии, и когда Гитлер не знал, то подробно объяснил, что у итальянского сапога было пятьдесят два гвоздя в подошве и двадцать два в пятке."
 EF_news.2.d:0 "После инцидента в Халхин-Голе пал кабинет Хиранумы. Хирохито назначил Нобуёки Абэ на пост главы нового кабинета. Можно сказать, что Советы произвели сильное впечатление на японцев. Ходят слухи, что с этого момента японцы могут атаковать на юг. Британцам следует быть осторожными."
 EF_news.4.d:0 "НКВД управляет в Испании. Орлов - мясник. Удачи, республиканцы. Александр Орлов начал работать в Барселоне по указаниям, которые он получил из Москвы. Республиканцев ожидает долгий путь. Ходят слухи, что Сталин применяет здесь такие же чистки, как в своей стране."
 EF_news.10.d:0 "Молотов, советский комиссар иностранных дел, вызвал польского посла Вацлава Грыбовского в Кремль и вручил ему сфабрикованную декларацию войны. Молотов заявил, что польского государства больше не существует и что Сталин приказал Красной Армии защитить своих кровных братьев, западных украинцев и белорусов, перейдя границу и защитив их имущество."
 EF_news.11.d:0 "Договор о дружбе и границах между нацистской Германией и Советским Союзом - это лишь видимая часть айсберга. Что происходит в той его части, которая скрыта от посторонних глаз?"
 EF_news.12.d:0 "Главной моей целью было избавить наши отношения с Францией от всех следов недоброжелательности... Я всегда выражал Франции свое желание навсегда похоронить нашу давнюю вражду... Я не пожалел усилий для достижения англо-германской дружбы... Чтобы достичь этой великой цели [мира], ведущим странам этого континента однажды придется собраться вместе, чтобы разработать, принять и гарантировать статут на комплексной основе, который обеспечит им всем чувство безопасности, спокойствия, и, в конечном итоге, мира... Равно невозможно, чтобы такая конференция, которая должна будет определить судьбу этого континента на многие годы вперед, могла продолжать свои обсуждения, пока гремят пушки или мобилизованные армии оказывают на нее давление..."
 EF_news.13.d:0 "СССР управлялся типичной диктатурой. Он заключил союз с другой диктатурой и оккупировал соседа, единственная цель которого - жить мирно как демократическое государство, соседа, слишком маленького, чтобы представлять какую-либо опасность для СССР."
 EF_news.14.d:0 "Отважный пилот Хью Макфейл запустил давно запланированное министерством авиации Великобритании наблюдение за нефтяными месторождениями Баку и Батуми. Самолет кружил над городом почти час."
 EF_news.16.d:0 "Польских заключенных, доставленных в советские лагеря, с октября 1939 года по февраль 1940 года подвергали длительным допросам и политическим репрессиям со стороны сотрудников НКВД. Хотя заключенные думали, что их вскоре освободят, переговоры на самом деле представляли собой тайный отборочный процесс, который определял, кто будет жить, а кто умрет.\nСогласно сообщениям НКВД, если заключенного не удалось убедить занять просоветскую позицию, его объявляли «закоренелым и непримиримым врагом советской власти»."
 EF_news.15.d:0 "Гитлер объявил всему миру, что ни Германия, ни Россия никогда не предпринимали каких-либо шагов за пределами сферы своих интересов, и подтвердил Московский пакт."
 EF_news.17.d:0 "Британская королевская семья погибла в результате террористического акта в Букингемском дворце. Это нападение, произошедшее во время подготовки к королевской свадьбе Эдуарда VIII, вызвало у всех подозрения. Пока ведется расследование исполнителей, идут споры о том, кто заменит Эдуарда VIII, потому что королевская семья полностью погибла, и преемник не ясен."
 EF_news.18.d:0 "Чуть после 11 часов утра 12 ноября Молотова приехала на берлинский Анхельтер Банхоф. Риббентроп, Гиммлер и фельдмаршал Вильгельм Кейтель были готовы принять его.\nТеперь все взгляды мира обратились к Берлину."
 EF_news.19.d:0 "На пресс-конференции 24 июня Рузвельт заявил, что он полон решимости оказать России всю возможную помощь.\nЭто сняло моральное эмбарго, наложенное США на СССР.\nАмерика, очевидно, будет больше вовлечена в войну в Европе."
 EF_news.20.d:0 "Касабланкская конференция проходила в Касабланке, Французское Марокко, с 14 по 24 января 1943 года, с целью планирования стратегии союзников в Европе на следующем этапе Второй мировой войны. Главные обсуждения были между президентом США Франклином Рузвельтом и премьер-министром Великобритании Уинстоном Черчиллем. Сталин не смог присутствовать.\nТакже присутствовали суверен Марокко султан Мухаммед V и представляющие силы Свободной Франции генералы Шарль де Голль и Анри Жиро, но они играли второстепенную роль и не участвовали в военном планировании. Генеральный секретарь Коммунистической партии Советского Союза Иосиф Сталин отказался приехать, сославшись на то, что продолжающаяся битва за Сталинград требует его присутствия в Москве."
 EF_news.21.d:0 "Курск - один из самых старых городов в России, впервые упомянутый в документах в 1032 году. Полностью разрушенный в 1240 году татарами, город был восстановлен в 1586 году и стал военным форпостом для защиты русской колонизации от набегов татар. Однако в начале 18 века значение города резко упало по мере продвижения русской границы дальше на юг.\nНемцы планировали крупное наступление с целью захвата Курска. Согласно этому плану, они должны были прорвать советскую оборону и окружить Курск, продвигаясь двумя колоннами от Орла на север от Курска и Белгорода на юг."
 ef_news.1.a:0 "Будут ли побеждены Советы?"
 ef_news.1.b:0 "Ещё одна победа для Германии!"
 ef_news.1.c:0 "Всего лишь небольшое отступление"
 EF_news.22.d:0 "Конференция была проведена в Каире в Египте между Великобританией, Китаем и Соединёнными Штатами. Она наметила позицию союзников против империи Японии во время Второй мировой войны и приняла решения о послевоенной Азии. На конференции присутствовали премьер-министр Великобритании Уинстон Черчилль, председатель китайского национального правительства и председатель Военной комиссии национального правительства Чан Кайши и президент США Франклин Д. Рузвельт."
 EF_news.23.d:0 "Немцы начали плановую операцию, которую они назвали холокостом.\nЕвреев убивают в концентрационных лагерях на многих оккупированных территориях. Остается выяснить, совершают ли нацисты массовые убийства или они были правы в том, во что они верили.\nАушвиц, Дахау, Бухенвальд, Равенсбрюк, Заксенхаузен и Нацвайлер - это предполагаемые названия этих концентрационных лагерей."