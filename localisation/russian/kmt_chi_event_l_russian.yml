l_russian:
  kmt.6.t:0 "Дискредитация пропаганды"
  kmt.6.d:0 "Наша пропаганда о национальной обороне дискредитирована. Наш народ считает нас лжецами, поскольку мы нападаем на других китайцев."
  kmt.6.a:0 "Это глупцы, которые не видят общей картины."
  kmt.8.t:0 "[From.GetName] требует покорности"
  kmt.8.d:0 "[From.GetNameDef] считает Тибет территорией Китая. Они требуют нашей полной и немедленной аннексии."
  kmt.8.a:0 "Они слишком сильны, чтобы им сопротивляться"
  kmt.8.b:0 "Далай-лама никогда не покорится!"
  kmt.9.t:0 "[From.GetName] Соглашение"
  kmt.9.d:0 "Далай-лама принял наши условия. Теперь Тибет наш."
  kmt.9.a:0 "Тибет наш по праву!"
  kmt.10.t:0 "[From.GetName] Отказался"
  kmt.10.d:0 "Тибетский лидер отверг наше щедрое предложение. Они заявляют, что никогда не покорятся нашей "тирании"."
  kmt.10.a:0 "Увидим об этом..."
  kmt.11.t:0 "[KMT_central_gov_tag.GetName] Требование пересмотреть линию Макмагона"
  kmt.11.d:0 "Теперь, когда Тибет находится под [KMT_central_gov_tag.GetAdjective] контролем, они требуют пересмотреть линию Макмагона в их пользу."
  kmt.11.a:0 "Бесполезная земля для бесполезных людей"
  kmt.11.b:0 "Передать дело [KMT_kmt11_temp_overlord.GetNameDef]"
  kmt.11.c:0 "Мы не уступим им ни дюйма!"
  kmt.11.c_tt:0 "§RМожет привести к войне с [KMT_central_gov_tag.GetName]§!"
  kmt.12.t:0 "Линия Макмагона перерисована"
  kmt.12.a:0 "Замечательный день для [Root.GetAdjective] людей"
  kmt.14.t:0 "Пересмотр отклонен"
  kmt.14.a:0 "Мы не хотим новой войны прямо сейчас"
  kmt.14.b:0 "Эти варвары узнают нашу ярость! [Root.GetName] станет больше"
  kmt.15.t:0 "[From.GetName] требует Тайвань"
  kmt.15.d_2:0 "Когда-то Тайвань был частью Китая, и [From.GetName] требует его "возвращения" под их власть"
  kmt.15.d_1:0 "Хотя мы были одними из первых, кто правил Тайванем, [From.GetName] требует, чтобы мы отдали его им. Что нам делать?"
  kmt.15.a_1:0 "Мы хотели бы сохранить мир между нами."
  kmt.15.a_2:0 "Они могут получить эту влажную преисподнюю, если им это так нужно."
  kmt.15.b_1:0 "Как эти варвары смеют требовать этого? Тайвань по праву наш!"
  kmt.15.b_2:0 "Может быть, они когда-то правили островом, но теперь им правим мы!"
  kmt.16.t:0 "Тайвань возвращен"
  kmt.16.d:0 "Тайвань возвращен китайскому народу. Наши граждане празднуют ее возвращение."
  kmt.16.a:0 "Лучший исход, на который мы могли надеяться."
  kmt.17.t:0 "Тайвань остается в рабстве"
  kmt.17.d:0 "Они отклонили нашу просьбу вернуть то, что по праву принадлежит нам. Их тирания ясна как день."
  kmt.17.a:0 "Мы их уничтожим!"
  kmt.21.t:0 "[From.GetName] хочет присоединиться к союзникам"
  kmt.21.d:0 "Демократические силы в [From.GetNameDef] взяли под контроль. Они хотят присоединиться к союзникам как символ их доверия и дружбы."
  kmt.21.a:0 "Союзник на Востоке, почему бы и нет?"
  kmt.21.b:0 "В данный момент нет"
  kmt.22.t:0 "[From.GetName] принято"
  kmt.22.d:0 "[From.GetName] позволило нам присоединиться к союзникам. Теперь мы едины в деле свободы."
  kmt.22.a:0 "Теперь демократический мир окреп."
  kmt.23.t:0 "[From.GetName] отклонено"
  kmt.23.d:0 "Они не сказали нам причину отказа, но, похоже, что у них сейчас не самые легкие времена."
  kmt.23.a:0 "Заносчивые глупцы! Может быть, позже они увидят ошибку своего пути."
  kmt.25.t:0 "Получены секретные документы"
  kmt.25.d:0 "Мы получили секретные документы неизвестного происхождения. Из них ясно, что [From.GetName] недоволен нашим лидерством во фракции. Они хотят свергнуть нас!"
  kmt.25.a:0 "[From.GetName] - наш проверенный союзник. Эти документы, должно быть, жалкая уловка наших врагов."
  kmt.25.b:0 "Тогда мы изгоним их из нашей фракции."
  kmt.25.c:0 "Мы не потерпим этого акта захвата власти."
  kmt.26.t:0 "Исключение из состава фракции"
  kmt.26.d_1:0 "Наш бывший лидер фракции решил изгнать нас из нее на основе информации из каких-то секретных документов. Похоже, что наши враги смогли изолировать нас."
  kmt.26.d_2:0 "Наш бывший лидер фракции решил изгнать нас из нее и объявить нам войну на основе информации из каких-то секретных документов. Похоже, что наши враги смогли изолировать нас."
  kmt.26.a:0 "Теперь мы должны рассчитывать только на себя."
  kmt.27.t:0 "Нейтральная внешняя политика"
  kmt.27.d:0 "Наши правительственные чиновники выступают за политику нейтралитета. Мы останемся в стороне от мелких сетей мировых альянсов. Пусть низшие нации уничтожают друг друга в бессмысленных войнах.
  kmt.27.a:0 "Неопределенный план в неопределенном мире."
  kmt.28.t:0 "Получены секретные документы"
  kmt.28.d:0 "К нам попали секретные документы неизвестного происхождения. Из них явствует, что [SIK.GetName] недоволен нашим положением лидера фракции. Они хотят свергнуть нас!"
  kmt.28.a:0 "[SIK.GetName] — наш верный союзник. Эти документы, должно быть, отвратительная уловка наших врагов."
  kmt.28.b:0 "Тогда мы вычистим их из нашей фракции."
  kmt.28.c:0 "Мы не потерпим этого акта узурпации."
  kmt.29.t:0 "Исключение из фракции"
  kmt.29.d_1:0 "Наш бывший лидер фракции решил вышвырнуть нас из нее на основе информации из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
  kmt.29.d_2:0 "Наш бывший лидер фракции решил вышвырнуть нас из нее и объявить нам войну на основе информации из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
  kmt.29.a:0 "Теперь нам нужно полагаться на самих себя."
  kmt.30.t:0 "Получены секретные документы"
  kmt.30.d:0 "К нам попали секретные документы неизвестного происхождения. Из них явствует, что [TAN.GetName] недоволен нашим положением лидера фракции. Они хотят свергнуть нас!"
  kmt.30.a:0 "[TAN.GetName] — наш верный союзник. Эти документы, должно быть, отвратительная уловка наших врагов."
  kmt.30.b:0 "Тогда мы вычистим их из нашей фракции."
  kmt.30.c:0 "Мы не потерпим этого акта узурпации."
  kmt.31.t:0 "Исключение из фракции"
  kmt.31.d_1:0 "Наш бывший лидер фракции решил выгнать нас из фракции, опираясь на информацию из каких-то секретных документов. Похоже, нашим врагам удалось нас изолировать."
  kmt.31.d_2:0 "Наш бывший лидер фракции решил выгнать нас из фракции и объявить нам войну, опираясь на информацию из каких-то секретных документов. Похоже, нашим врагам удалось нас изолировать."
  kmt.31.a:0 "Теперь мы должны положиться только на себя."
  kmt.49.t:0 "Китай хочет вступить в Коминтерн."
  kmt.49.d:0 "Наши товарищи в КПК добились больших успехов. Они действительно готовы присоединиться к мировой революции в полном смысле этого слова."
  kmt.49.a:0 "Добро пожаловать."
  kmt.49.b:0 "Нет! Этот Мао - левый оппортунист!"
  ## 4/7/2016 ##
  kmt.52.t:0 "Китай требует территорий."
  kmt.52.d:0 "Объявив эти земли своими, [CHI.GetName] потребовали их безоговорочной передачи."
  kmt.52.a:0 "Мы не сможем противостоять их полной мощи."
  kmt.52.b:0 "Алчные китайские подонки! Они не получат ни дюйма!"
  kmt.53.t:0 "Ядра возвращены"
  kmt.53.d:0 "Наши законные территории вернулись!"
  kmt.53.a:0 "С этого момента мы должны планировать дальнейшую экспансию."
  kmt.54.t:0 "Требование отклонено"
  kmt.54.d:0 "Эти варвары отклонили наше мирное требование и вынуждают нас применить силу для разрешения этой ситуации."
  kmt.54.a:0 "Варваров надо очистить!"
  kmt.56.t:0 "Китай требует территорий."
  kmt.56.d:0 "После объявления этих земель своими основными территориями, [CHI.GetName] пришел потребовать, чтобы эти земли были переданы им без каких-либо условий."
  kmt.56.a:0 "Мы не выстоим против их всепоглощающей мощи."
  kmt.56.b:0 "Алчные китайские подонки! Они не получат ни дюйма!"
  kmt.57.t:0 "Возвращение основных территорий"
  kmt.57.d:0 "Наши законные территории вернулись!"
  kmt.57.a:0 "Отныне нам стоит планировать дальнейшее расширение."
  kmt.58.d:0 "Эти варвары отвергли наше мирное требование и вынудили нас решить этот вопрос силой."
  kmt.58.a:0 "Варваров нужно очистить!"
  ## 8/7/2016 ##
  kmt.62.t:0 "Франко-китайское соглашение"
  kmt.62.d:0 "После войны китайские чиновники связались с нами, чтобы обсудить вопрос управления Гуанчжоуваном."
  kmt.62.a:0 "Они так много пожертвовали в войне, пусть это будет нашим признанием."
  kmt.62.b:0 "La région appartient à la France!"
  kmt.63.t:0 "Франция отказалась вернуть Гуанчжоуван"
  kmt.63.d:0 "Французы настояли на том, что Гуанчжоуван останется французской концессией."
  kmt.63.a:0 "Проклятые свиньи!"
  kmt.64.t:0 "Принять поражение?"
  kmt.64.d:0 "Наше положение в Индокитае оказалось под угрозой, некоторые генералы и чиновники предложили прекратить потери и заключить мир с китайцами."
  kmt.64.a:0 "Nous ne pouvons nous permettre plus de pertes..."
  kmt.64.b:0 "France se battra jusqu'au dernier!"
  kmt.65.t:0 "[From.GetName] Предлагает мир"
  kmt.65.d:0 "Желая предотвратить дальнейшие жертвы, [From.GetAdjective] чиновники предложили нам мирное соглашение, отказавшись от всех своих владений в Индокитае."
  kmt.65.a:0 "Хорошо"
  kmt.65.b:0 "Их нация должна быть побеждена!"
  kmt.66.t:0 "Предложение Отклонено"
  kmt.66.d:0 "Китайцы отклонили наше предложение о мире, теперь мы должны сражаться до конца."
  kmt.66.a:0 "Дикари!"
  kmt.67.t:0 "Совместная Сино-Британская Декларация"
  kmt.67.d:0 "Наше правление в Гонконге подошло к концу, теперь мы должны вернуть Гонконг китайцам."
  kmt.67.a:0 "Договор есть договор."
  kmt.67.b:0 "Гонконг должен остаться в Империи!"
  kmt.68.t:0 "Британцы Нарушают Обещание"
  kmt.68.d:0 "Британцы отказались вернуть Гонконг после 99 лет правления согласно Нанкинскому договору. Это унижение не останется незамеченным!"
  kmt.68.a:0 "Проклятые свиньи!"
  kmt.69.t:0 "Возвращение Макао?"
  kmt.69.d:0 "Хотя мы переопределили Макао как "китайскую территорию под (временным) португальским управлением" в 1974 году, и китайцы вскоре возьмут ее под свой контроль. Некоторые наши чиновники утверждают, что Макао должен оставаться португальской территорией, несмотря ни на что."
  kmt.69.a:0 "Эти чиновники сошли с ума."
  kmt.69.b:0 "Португалия сильна! Макао станет законной португальской землей!"
  kmt.70.t:0 "Португалия Отказывается Возвращать Макао"
  kmt.70.d:0 "Правительство Португалии отказалось вернуть Макао!"
  kmt.70.a:0 "Мы покажем им, к чему это приведет."
  kmt.71.t:0 "Гуанчжоувань Возвращен"
  kmt.71.d:0 "Гуанчжоувань теперь возвращен своему законному правителю!"
  kmt.71.a:0 "Ура!"
  kmt.72.t:0 "Гонконг вернулся"
  kmt.72.d:0 "Гонконг вернулся к своему законному правителю!"
  kmt.72.a:0 "Ура!"
  kmt.73.t:0 "Макао вернулся"
  kmt.73.d:0 "Макао вернулся к своему законному правителю!"
  kmt.73.a:0 "Ура!"
  kmt.74.t:0 "[CHI.GetName] требует подчинения"
  kmt.74.d:0 "[CHI.GetName] отправил всем военачальникам ультиматум с требованием немедленно сдаться. [Root.GetLeader] с момента получения ультиматума провёл несколько часов за закрытым совещанием со своими самыми доверенными офицерами.\n\nКаким же будет итог совещания?"
  kmt.74.a:0 "'Во избежание кровопролития, мы принимаем их требование. Мы сдадимся.'"
  kmt.74.b:0 "'Тиран не победит!'"
  kmt.75.t:0 "Ультиматум - военачальник согласен"
  kmt.75.a:0 "Ещё один шаг к объединению!"
  kmt.752.t:0 "Ультиматум - военачальник отказался"
  kmt.752.d:0 "[From.GetLeader] отказался подчиниться. Более того, они заявили, что настоящие 'тираны' - это мы!"
  kmt.752.a:0 "Да как они смеют!"
  kmt.76.t:0 "Судьба Янь Сишаня"
  kmt.76.a:0 "Мы должны подготовиться к будущей войне!"
  kmt.76.b:0 "Он послужит отличным примером"
  kmt.77.t:0 "Судьба Ли Цзунжэня"
  kmt.77.a:0 "Мы должны подготовиться к будущей войне!"
  kmt.77.b:0 "Он послужит отличным примером"
  kmt.78.t:0 "Судьба Лун Юня"
  kmt.78.a:0 "Мы должны подготовиться к будущей войне!"
  kmt.78.b:0 "Он послужит отличным примером"
  kmt_lzr_join:0 "Ли Цзунжэнь присоединится к нашей армии"
  kmt_yxs_join:0 "Янь Сишань присоединится к нашей армии"
  kmt_ly_join:0 "Лун Юнь присоединится к нашей армии"
  kmt.85.t:0 "[SOV.GetNameDef] покинули нас!"
  kmt.85.d:0 "В связи с недавним запросом [CHI.GetName] об аннексии нашей нации, [SOV.GetLeader] решил, что мы будем принесены в жертву ради общего блага!"
  kmt.85.a:0 "Мы должны подчиниться приказу [SOV.GetLeader]..."
  kmt.85.b:0 "Эти свиньи, изменяющие своим принципам! Мы будем бороться за свое существование!"
  kmt.86.t:0 "Запрос отклонен"
  kmt.86.d:0 "[SOV.GetName] отклонил нашу просьбу об аннексии [SIK.GetName]."
  kmt.86.a:0 "Мы должны подчиниться приказу [SOV.GetLeader]..."
  kmt.86.b:0 "Тогда мы возьмем дело в свои руки!"
  kmt.87.t:0 "Аннексия [SIK.GetName]"
  kmt.87.d:0 "С одобрения [SOV.GetLeader], [SIK.GetName] теперь является неотъемлемой частью [CHI.GetName]!"
  kmt.87.a:0 "Вся хвала [SOV.GetLeader]!"
  kmt.88.t:0 "Сопротивление [SIK.GetName]"
  kmt.88.d:0 "Недовольство среди жителей [SIK.GetAdjective] привело к созданию сил сопротивления против надвигающейся китайской оккупации. Сопротивление даже открыло огонь по китайским солдатам, между [CHI.GetName] и [SIK.GetName] вспыхнула война!"
  kmt.88.a:0 "Мы должны помочь китайцам!"
  kmt.88.b:0 "Эти неблагодарные свиньи!"
  kmt.89.t:0 "[SOV.GetName] присоединяется к нашей войне"
  kmt.89.d:0 "[SOV.GetName] решил встать на нашу сторону в этом восстании варваров Синьцзяна!"
  kmt.89.a:0 "У них не будет шансов против нашей объединенной мощи!"
  kmt.90.t:0 "Приглашение Китая"
  kmt.90.d:0 "Теперь, когда Китай решил выступить против Коминтерна, он хочет стать нашим союзником."
  kmt.90.a:0 "Мы вместе выступим против свиней-ревизионистов!"
  kmt.90.b:0 "Мы не можем позволить себе войну с [SOV.GetName]..."
  kmt.91.t:0 "[SIK.GetName] принял"
  kmt.91.d:0 "[SIK.GetName] принял наше предложение присоединиться к нашей фракции, он сделал правильно, последовав истинному пути марксизма-ленинизма!"
  kmt.91.a:0 "Ещё один товарищ, освободившийся от порока ревизионизма!"
  kmt.92.t:0 "[SIK.GetName] отказался"
  kmt.92.d:0 "[SIK.GetName] отказался присоединиться к нашей фракции. Как мы раньше не знали, что они тоже были свиньями-ревизионистами!"
  kmt.92.a:0 "Порок ревизионизма распространяется..."
  kmt.93.t:0 "Китайское давление"
  kmt.93.d:0 "В последнее время китайцы оказывают на нас сильное давление, мы должны выбирать между превращением в демократию и уничтожением нашей нации!"
  kmt.93.a:0 "Мы должны сохранить существование нашей нации!"
  kmt.93.b:0 "Демократия — всего лишь другая форма тирании!"
  kmt.94.t:0 "Синьцзян стал демократией"
  kmt.94.d:0 "Под нашим недавним давлением Синьцзян наконец осознал, какое светлое будущее ждёт его при демократии. А мы возьмём его за руку."
  kmt.94.a:0 "Potentia democratia!"  #Latin
  kmt.95.t:0 "Синьцзян отказался стать демократией"
  kmt.95.d:0 "Хотя мы сильно на него надавили, правительство Синьцзяна по-прежнему не понимает всех преимуществ демократии и отвергает наше щедрое предложение."
  kmt.95.a:0 "Пора переходить к жёстким мерам..."
  kmt.96.t:0 "Ультиматум от Чан Кайши"
  kmt.96.d:0 "Чан Кайши требует нашего безоговорочного подчинения. Он говорит, что если мы будем сопротивляться, то прольётся кровь. [SIK.GetLeader], после многочасового совещания с высокопоставленными лицами, объявляет, что народ Синьцзяна будет защищён от..."
  kmt.96.a:0 "'Войны'"
  kmt.96.b:0 "'Тирании'"
  kmt.97.t:0 "Синьцзян подчиняется"
  kmt.97.d:0 "Спустя десятилетия Китай, наконец, восстанавливает контроль над Синьцзяном!"
  kmt.97.a:0 "Китай растёт!"
  kmt.98.t:0 "Ультиматум истекает"
  kmt.98.d:0 "Синьцзян отказался подчиниться, теперь мы должны силой забрать то, что по праву принадлежит нам!"
  kmt.98.a:0 "Умри! Варварское отребье!"
  ## 5/8/2016 ##
  kmt.100.t:0 "Ультиматум от [From.GetLeader]"
  kmt.100.a:0 "Мир всегда лучше"
  kmt.100.b:0 "Они не ровня нам!"
  kmt.101.t:0 "Торговые порты возвращены"
  kmt.101.a:0 "Мудрый ход"
  kmt.102.t:0 "Ультиматум отклонен"
  kmt.102.a:0 "Их высокомерие погубит их!"
  kmt.103.d:0 "Китайское правительство прислало нам ультиматум, требуя вернуть Макао. Ожидаются военные действия, если мы не дадим им удовлетворительного."
  kmt.104.t:0 "Макао возвращён"
  kmt.104.d:0 "Макао возвращен, западные державы по праву боятся нашей мощи!"
  kmt.105.d:0 "Эти отвратительные западные варвары отказались сотрудничать мирным путём! Народу Макао придётся ещё немного подождать."
  kmt.106.d:0 "Китайское правительство прислало нам ультиматум о том, что мы должны вернуть Гонконг. Ожидаются военные действия, если мы не дадим им удовлетворительного ответа."
  kmt.107.t:0 "Гонконг возвращен"
  kmt.107.d:0 "Гонконг возвращен, западным варварам пора убояться нашей мощи!"
  kmt.108.d:0 "Эти мерзкие западные варвары отказались от сотрудничества мирным путем! Жителям Гонконга придется немного подождать."
  kmt.112.d:0 "Китай предложил оказать нам помощь, если мы вернем торговый порт в Макао."
  kmt.113.t:0 "Макао возвращен"
  kmt.113.d:0 "[From.GetName] принял предложение и была заключена сделка, Макао теперь официально является китайской территорией, а мы получаем обещанную помощь."
  kmt.115.d:0 "Китай предложил оказать нам помощь, если мы вернем торговый порт в Гонконге."
  kmt.116.t:0 "Гонконг возвращен"
  kmt.116.d:0 "[From.GetName] принял предложение и была заключена сделка, Гонконг теперь официально является китайской территорией, а мы получаем обещанную помощь."
  kmt.118.t:0 "Гуанчжоувань"
  kmt.118.d:0 "Гуанчжоувань сейчас находится под иностранным управлением, и это не может продолжаться. Мы должны попытаться вернуть его, но как?"
  kmt.118.a:0 "Организовать переворот и свергнуть местную администрацию"
  kmt.118.b:0 "Мы сделаем это дипломатическими путями"
  kmt.118.c:0 "Мы потребуем его у этих мерзких варваров"
  kmt.118.e:0 "Захватить с помощью наших сил"
  kmt.120.t:0 "Переворот в Гуанчжоуване"
  kmt.120.d_1:0 "Недавний переворот сверг наше местное правительство в Гуанчжоуване. Они также провели референдум о возвращении под власть Китая. Тем не менее, наша разведка указывает на то, что этот переворот был организован китайским правительством.\n\nКак нам реагировать?"
  kmt.120.d_2:0 "Наш переворот в Гуанчжоуване оказался успешным. Местный референдум после того, как было создано прокитайское местное правительство, привел к возвращению Гуанчжоувана. Нам некогда праздновать, потому что варвары, должно быть, планируют некую форму возмездия."
  kmt.120.a:0 "Мы немедленно уничтожим эту назойливую нацию!"
  kmt.120.b:0 "Умиротворение принесет мир нам обоим..."
  kmt.120.c:0 "Мы должны быть начеку."
  kmt.121.t:0 "Переворот в Гуанчжоуване"
  kmt.121.d_1:0 "Недавно в Гуанчжоуване был подавлен переворот. Хотя он не нанес значительного ущерба, некоторые люди считают, что это был заговор китайского правительства с целью вернуть эту область."
  kmt.121.d_2:0 "Наш переворот в Гуанчжоуване потерпел жалкий провал. Мы должны уничтожить любые улики, которые могут связать нас с переворотом и наоборот. Мы должны держать это в секрете от общественности."
  kmt.121.a:0 "Мы должны осудить китайцев за столь гнусный поступок!"
  kmt.121.b:0 "У нас есть более важные дела, требующие нашего внимания."
  kmt.121.c:0 "О, почему..."
  kmt.122.t:0 "Китай стремится к более тесным связям с нами"
  kmt.122.d:0 "Поскольку мы теперь являемся владельцами Гуанчжоувань, Китай хочет использовать его в качестве знака дружбы и просит о том, могли бы мы его вернуть, для более тесных отношений между нашими народами."
  kmt.122.a:0 "Сильный союзник - всегда желанный гость"
  kmt.122.b:0 "Они нам не нужны! Мы прекрасно справимся сами."
  kmt.123.t:0 "Китай требует Гуанчжоувань"
  kmt.123.d:0 "Китай утверждает, что Гуанчжоувань - это необходимое жизненное пространство для китайского народа, поэтому он должен быть возвращен."
  kmt.123.a:0 "Мы не можем позволить себе войну с ними"
  kmt.123.b:0 "Какая чушь."
  kmt.124.t:0 "Китай оккупировал Гуанчжоувань"
  kmt.124.d:0 "Китай отправил в Гуанчжоувань несколько сил и оккупировал его вскоре после этого. Позже объявив, что он официально вернулся под власть Китая. Этот акт агрессии вызвал немало споров в стране."
  kmt.124.a:0 "Несмотря на унижение, мы должны уступить в этом случае"
  kmt.124.b:0 "Это явно вторжение! Мы должны подготовить наших людей к войне!"
  kmt.125.t:0 "Более тесные отношения с [From.GetName]"
  kmt.125.d:0 "Теперь, когда [From.GetAdjective] правительство приняло решение вернуть нам Гуанчжоувань, мы можем перейти к улучшению наших отношений."
  kmt.125.a:0 "Все во славу Родины!"
  kmt.126.t:0 "[From.GetName] отказал"
  kmt.126.d:0 "[From.GetAdjective] правительство отказалось вернуть Гуанчжоувань, несмотря на щедрое предложение, теперь им придется попробовать "напиток наказания"... "
  kmt.126.a:0 "Никто не устоит против Родины!"
  kmt.127.t:0 "[From.GetName] принял"
  kmt.127.d:0 "[From.GetName] принял наше требование о возвращении Гуанчжоувань!"
  kmt.127.a:0 "Родина приветствует своих сынов!"
  kmt.128.t:0 "[From.GetName] отказал"
  kmt.128.d:0 "[From.GetName] отклонил наше требование о возвращении Гуанчжоувань!"
  kmt.128.a:0 "Родина вернет её так или иначе!"
  kmt.130.t:0 "Обвинение [From.GetName]"
  kmt.130.d:0 "[From.GetName] каким-то образом нашёл доказательства того, что мы стоим за недавним неудавшимся переворотом в Гуанчжоуване, и они публично осудили нас!"
  kmt.130.a:0 "Мы ответим тем же, мы прекратим с ними торговлю!"
  kmt.130.b:0 "Новая возможность для нас захватить Гуанчжоувань!"
  kmt.130.c:0 "Просто игнорируйте это..."
  kmt.131.t:0 "Макао"
  kmt.131.d:0 "Макао сейчас находится под иностранным управлением, и это не должно продолжаться, мы должны попытаться вернуть его, но как?"
  kmt.131.a:0 "Устроить переворот и свергнуть местную администрацию."
  kmt.131.b:0 "Мы сделаем это дипломатическими средствами."
  kmt.131.c:0 "Мы потребуем этого у этих грязных варваров."
  kmt.131.e:0 "Оккупировать территорию нашими войсками."
  kmt.133.t:0 "Переворот в Макао"
  kmt.133.d_1:0 "Недавний переворот сверг наше местное правительство в Макао, они также провели референдум о том, что он должен вернуться под китайское правление. Однако наша разведка сообщает, что этот переворот организован правительством Китая.\n\nКак нам ответить?"
  kmt.133.d_2:0 "Наш переворот в Макао прошел успешно, местный референдум после того, как было установлено прокитайское местное правительство, привел к возвращению Гуанчжоувань. Нам некогда праздновать, потому что варвары, должно быть, планируют какое-то возмездие."
  kmt.133.a:0 "Мы немедленно уничтожим этот надоедливый народ!"
  kmt.133.b:0 "Умиротворение принесет мир нам обоим..."
  kmt.133.c:0 "Мы должны оставаться настороже."
  kmt.134.t:0 "Переворот в Макао"
  kmt.134.d_1:0 "Недавно в Макао был подавлен переворот, хотя он не нанес серьезного ущерба, некоторые считают, что он был организован китайским правительством для возвращения этой области."
  kmt.134.d_2:0 "Наш переворот в Макао с треском провалился, мы должны стереть любые доказательства, которые могут связать нас с переворотом и наоборот. Мы должны сохранить это в тайне от общественности."
  kmt.134.a:0 "Мы должны осудить китайцев за такой грязный поступок!"
  kmt.134.b:0 "У нас есть вещи, которые требуют нашего внимания."
  kmt.134.c:0 "О, почему..."
  kmt.135.t:0 "Китай стремится сблизиться с нами"
  kmt.135.d:0 "Поскольку теперь мы являемся владельцами Макао, Китай хочет использовать это как знак дружбы и просит нас вернуть его для более тесных отношений между нашими странами."
  kmt.135.a:0 "Сильный союзник весьма кстати"
  kmt.135.b:0 "Они нам не нужны! Мы прекрасно справляемся сами."
  kmt.136.t:0 "Китай требует Макао"
  kmt.136.d:0 "Китай заявляет, что Макао является необходимым жизненным пространством для китайского народа, поэтому он должен быть возвращен."
  kmt.136.a:0 "Мы не можем позволить себе войну с ними"
  kmt.136.b:0 "Какая чушь"
  kmt.137.t:0 "Китай оккупировал Макао"
  kmt.137.d:0 "Китай направил войска в Макао и вскоре оккупировал его, объявив, что тот официально возвращается под китайское правление. Этот акт агрессии вызвал большие споры в стране"
  kmt.137.a:0 "Несмотря на унижение, в этом нам стоит отступить"
  kmt.137.b:0 "Это явно вторжение! Мы должны подготовиться к войне!"
  kmt.138.t:0 "Укрепление отношений с [From.GetName]"
  kmt.138.d:0 "Теперь, когда [From.GetAdjective]-ое правительство решило вернуть нам Макао, мы можем улучшить наши отношения"
  kmt.138.a:0 "Всё ради славы Родины!"
  kmt.139.t:0 "[From.GetName] отказал"
  kmt.139.d:0 "Несмотря на щедрое предложение, [From.GetAdjective]-ое правительство отказалось вернуть Макао, теперь им придётся вкусить "наказание вином"..."
  kmt.139.a:0 "Никто не встанет против Родины!"
  kmt.140.t:0 "[From.GetName] принял"
  kmt.140.d:0 "[From.GetName] принял наше требование вернуть Макао!"
  kmt.140.a:0 "Родина принимает своих детей!"
  kmt.141.t:0 "[From.GetName] отказал"
  kmt.141.d:0 "[From.GetName] отказал нам в возвращении Макао!"
  kmt.141.a:0 "Родина отберёт его так или иначе!"
  kmt.143.t:0 "Осуждение [From.GetName]"
  kmt.143.d:0 "[From.GetName] как-то нашли доказательства того, что мы стоим за недавним неудачным переворотом в Макао, и они публично нас осудили!"
  kmt.143.a:0 "Мы вернем им одолжение, мы прекратим торговлю с ними!"
  kmt.143.b:0 "Новая возможность для нас захватить Макао!"
  kmt.143.c:0 "Просто игнорировать это..."
  kmt.144.t:0 "Гонконг"
  kmt.144.d:0 "Гонконг сейчас находится под иностранным управлением, и это не должно продолжаться, мы должны попытаться вернуть его, но как?"
  kmt.144.a:0 "Устроить переворот и свергнуть местную администрацию."
  kmt.144.b:0 "Мы сделаем это дипломатическим путем."
  kmt.144.c:0 "Мы потребуем это от этих грязных варваров."
  kmt.144.e:0 "Захватить местность с помощью наших сил."
  kmt.146.t:0 "Переворот в Гонконге"
  kmt.146.d_1:0 "Недавний переворот сверг наше местное правительство в Гонконге, они также провели референдум о возвращении под китайское правление. Однако наша разведка указывает, что этот переворот был организован китайским правительством.\n\nКак мы должны реагировать?"
  kmt.146.d_2:0 "Наш переворот в Гонконге оказался успешным, местный референдум после того, как было установлено прокитайское местное правительство, привел к возвращению Гуанчжоувань. Нам некогда праздновать, поскольку варвары, должно быть, планируют какую-то ответную акцию."
  kmt.146.a:0 "Мы немедленно уничтожим эту надоедливую нацию!"
  kmt.146.b:0 "Умиротворение принесет мир нам обоим..."
  kmt.146.c:0 "Мы должны быть начеку."
  kmt.147.t:0 "Переворот в Гонконге"
  kmt.147.d_1:0 "Недавно в Гонконге был подавлен переворот, хотя он и не нанес серьезного ущерба, некоторые люди считают, что это спланировано китайским правительством для возвращения этого района."
  kmt.147.d_2:0 "Наш переворот в Гонконге потерпел сокрушительное фиаско, мы должны уничтожить любые доказательства, которые могут связать нас с переворотом, и наоборот. Мы должны держать это в секрете от общественности."
  kmt.147.a:0 "Мы должны осудить китайцев за такой грязный поступок!"
  kmt.147.b:0 "У нас есть дела поважнее, требующие нашего внимания."
  kmt.147.c:0 "О, почему..."
  kmt.148.t:0 "Китай стремится к более тесным отношениям с нами"
  kmt.148.d:0 "Поскольку теперь мы являемся владельцами Гонконга, Китай хочет использовать это как знак дружбы и просит, чтобы мы могли вернуть его для более тесных отношений между нашими народами."
  kmt.148.a:0 "Сильный союзник - самый желанный гость"
  kmt.148.b:0 "Они нам не нужны! Мы сами по себе прекрасно справимся."
  kmt.149.t:0 "Китай требует Гонконг"
  kmt.149.d:0 "Китай заявляет, что Гонконг является необходимым жизненным пространством для китайского народа, поэтому он должен быть возвращен."
  kmt.149.a:0 "Мы не можем позволить себе войну с ними"
  kmt.149.b:0 "Что за чушь."
  kmt.150.t:0 "Китай оккупирует Гонконг"
  kmt.150.d:0 "Китай ввел войска в Гонконг и вскоре оккупировал его. Позже объявив, что он официально вернулся под китайским правлением. Этот акт агрессии вызвал немало споров в стране."
  kmt.150.a:0 "Несмотря на унижение, в этой ситуации мы должны отступить"
  kmt.150.b:0 "Это явно вторжение! Мы должны подготовить наших людей к войне!"
  kmt.151.t:0 "Более близкие отношения с [From.GetName]"
  kmt.151.d:0 "Теперь, когда правительство [From.GetAdjective] приняло решение вернуть нам Гонконг, мы можем перейти к улучшению наших отношений."
  kmt.151.a:0 "Всё во славу Матери-Родины!"
  kmt.152.t:0 "[From.GetName] отказались"
  kmt.152.d:0 "Правительство [From.GetAdjective] отказалось возвращать нам Гонконг, несмотря на щедрое предложение. Теперь им придётся отведать \"напиток наказания\"..."
  kmt.152.a:0 "Никто не устоит перед Матерью-Родиной!"
  kmt.153.t:0 "[From.GetName] приняли"
  kmt.153.d:0 "[From.GetName] приняли наше требование о возвращении Гонконга!"
  kmt.153.a:0 "Родина приветствует своих детей!"
  kmt.154.t:0 "[From.GetName] отказались"
  kmt.154.d:0 "[From.GetName] отклонили наше требование о возвращении Гонконга!"
  kmt.154.a:0 "Родина вернёт его так или иначе!"
  kmt.156.t:0 "Осуждение со стороны [From.GetName]"
  kmt.156.d:0 "[From.GetName] каким-то образом обнаружили доказательства того, что мы стоим за недавним неудачным переворотом в Гонконге, и они публично осудили нас!"
  kmt.156.a:0 "Мы ответим тем же, прекратим торговлю с ними!"
  kmt.156.b:0 "Новая возможность захватить Гонконг!"
  kmt.156.c:0 "Просто игнорируйте это..."
  ## 22/8/2016 ##
  kmt.157.t:0 "Вмешательство со стороны [From.GetName]"
  kmt.157.d_1:0 "[From.GetName] вмешались в проблему торговых портов, которая у нас есть с [From.From.GetName] как лидером фракции. "
  kmt.157.d_2:0 "[From.GetName] вмешался в проблему торговых портов, которая у нас с [From.From.GetName]. Он утверждает, что торговля между нами пойдет лучше, если мы вернем торговые порты."
  kmt.157.a_1:0 "Мы должны подчиниться приказам [From.GetAdjective]!"
  kmt.157.a_2:0 "Интересно..."
  kmt.157.b_1:0 "[From.GetFactionName] это гниющая дыра, мы больше не будем им подчиняться!"
  kmt.157.b_2:0 "Их ресурсы не то, что нам нужно!"
  kmt.158.t:0 "Запрос вмешательства [From.GetName]"
  kmt.158.d:0 "[From.GetName] испытывает проблемы с торговыми портами, которые он уступил Западному миру по неравноправным договорам, подписанным разлагающейся династией Цин. Он просит нас вмешаться в эти вопросы, чтобы они могли защитить свои интересы."
  kmt.158.a:0 "Мы стоим вместе!"
  kmt.158.b:0 "Они должны научиться быть терпеливыми!"
  kmt.159.t:0 "[From.GetName] отклонил предложение"
  kmt.159.d:0 "[From.GetLeader] отказался посредничать в наших делах и приказал нам отойти от проблемы."
  kmt.159.a:0 "Решение товарища [From.GetLeader] всегда правильное..."
  kmt.159.b:0 "Мы возьмем дело в свои руки!"
  kmt.164.t:0 "Гонконг возвращен"
  kmt.164.d:0 "[SOV.GetName] успешно вмешался в наши дела, и теперь Гонконг возвращен нам."
  kmt.164.a:0 "Мы должны поблагодарить их"
  kmt.179.t:0 "Промышленность улучшена"
  kmt.179.d:0 "С увеличением количества заводов возросло и качество продукции."
  kmt_incompetent_indus_tt:0 "Уменьшить штраф от §YНекомпетентной промышленности§!\nДобавить свободный слот для строительства в каждом контролируемом штате."
  kmt.179.a:0 "Скоро наша промышленная мощь станет одной из сильнейших!"
  kmt_incompetent_indus_remove_tt:0 "Убрать национальный дух §YНекомпетентной промышленности§!\nДобавить 1 свободный слот для строительства в каждом контролируемом штате."
  kmt.183.t:0 "Судьба Ма Буфана"
  kmt.183.d:0 "Этот исламский военачальник попал в плен после поражения своей клики. Теперь мы должны решить его судьбу."
  kmt_mbf_join:0 "Ма Буфан присоединится к армии"
  kmt.185.t:0 "Японская угроза"
  kmt.185.d:0 "Японцы начали наступление, пока мы все еще имеем дело с внутренней угрозой! Нам следует направить наши войска на китайцев или против японских захватчиков?"
  kmt.185.a:0 "Наша нация сейчас в отчаянном положении!"
  kmt.185.b:0 "Внутренняя стабильность все еще важнее."
  kmt.186.t:0 "[From.GetRulingParty] Ищет мира"
  kmt.186.d:0 "На фоне вторжения японцев, [From.GetLeader] решил вызвать [Root.GetLeader] на мирные переговоры, чтобы сосредоточиться на японских захватчиках."
  kmt.186.a:0 "Между нами будет мир, но мы не присоединимся к их войне."
  kmt.186.b:0 "В конце концов мы все китайцы..."
  kmt.186.c:0 "Между нами не будет мира!"
  kmt.186.e:0 "Мы можем вступить в союз с японцами!"
  kmt.187.t:0 "Мир!"
  kmt.187.d_1:0 "[From.GetLeader] согласился на мир без победителей, теперь мы можем сосредоточиться на японских захватчиках."
  kmt.187.d_2:0 "[From.GetLeader] согласился на белый мир и объединился с нами для отпора японским захватчикам!"
  kmt.187.a:0 "Мы всегда сможем разобраться с ними позже."
  kmt.188.t:0 "[From.GetName] отвергает мир"
  kmt.188.d:0 "[From.GetLeader] отказался от мира между нами, [Root.GetLeader] возмущён."
  kmt.188.a:0 "Его обязательно стереть!"
  kmt.189.t:0 "[From.GetName] хочет сражаться вместе с нами"
  kmt.189.d:0 "[From.GetLeader] возмущён действиями [KMT_central_gov_tag.GetLeader] и решил, что они совместно с нами преподадут ему урок."
  kmt.189.a:0 "Сфера Совместного Процветания Великой Восточной Азии растёт!"
  kmt.189.b:0 "Люди, которые предают свою страну, не заслуживают уважения!"
  kmt.190.t:0 "[JAP.GetName] согласился"
  kmt.190.d:0 "[JAP.GetName] принял наше предложение, и теперь мы свергнем [KMT_central_gov_tag.GetName]!"
  kmt.190.a:0 "Смерть [KMT_central_gov_tag.GetLeader]!"
  kmt.191.t:0 "[JAP.GetName] отказался"
  kmt.191.d:0 "[JAP.GetName] отклонил наше предложение и осудил наши действия, заявив, что [Root.GetLeader] не заслуживает уважения."
  kmt.191.a:0 "Мы, вероятно, разозлили двух гигантов..."
  kmt.192.t:0 "[From.GetName] присоединяется к японской агрессии"
  kmt.192.d:0 "[From.GetLeader] объединился с японцами и вторгся на территорию Китая!"
  kmt.192.a:0 "Ханьцзянь! Цзоу Гоу!"
  kmt.193.t:0 "[From.GetName] не удалось присоединиться к Японии"
  kmt.193.d:0 "Разведка утверждает, что [From.GetLeader] пытался связаться с японцами для совместных действий против нас, но потерпел отказ и японцы осудили его за отсутствие чести."
  kmt.193.a:0 "Предатели народа не преуспеют."
  kmt_fascism_tp_728_coup_tt:0 "Готовится переворот, он, скорее всего, будет успешным, если у вас будет высокое значение поддержки войны."
  kmt_manpower_transfer_tt:0 "Передать 20 000 живой силы"
  kmt_fascism_tp_728_inc_tt:0 "Гуанчжоувань будет оккупирован нашими войсками. Это может спровоцировать войну."
  kmt_fascism_tp_729_inc_tt:0 "Макао будет оккупирован нашими войсками. Это может спровоцировать войну."
  kmt_fascism_tp_326_inc_tt:0 "Гонконг будет оккупирован нашими войсками. Это может спровоцировать войну."
  kmt.196.t:0 "Синьцзян под контролем"
  kmt.196.d:0 "После мятежа народа Синьцзяна область наконец-то переходит под наш контроль."
  kmt.196.a:0 "Смерти можно было бы избежать, если бы народ Синьцзяна был умнее..."
  ## 5/9/2016 ##
  kmt.197.t:0 "[From.GetName] улучшает наши отношения"
  kmt.197.d:0 "[From.GetLeader] пытается улучшить наши отношения, отказываясь от своих притязаний на Тибет. Наши чиновники предупреждают о возможных фальсификациях и уловках, но такое решение, в конце концов, должен принять сам [TIB.GetLeader]."
  kmt.197.a:0 "Относитесь к другим хорошо, и другие будут относиться к вам хорошо."
  kmt.197.b:0 "[From.GetRulingParty] приведёт нас к величию!"
  kmt.197.c:0 "Мы тоже проявим дружелюбие."
  kmt.197.e:0 "Мы не поддадимся на такую наивную уловку!"
  kmt.198.t:0 "[From.GetName] принимает нашу доброту"
  kmt.198.d:0 "[From.GetLeader] решил, что мы будем работать вместе ради более светлого будущего."
  kmt.198.a:0 "Никто не хочет кровопролития"
  kmt.199.t:0 "[From.GetName] становится нашей марионеткой"
  kmt.199.d:0 "[From.GetLeader] решил, что [Root.GetRulingParty] приведёт их к величию, передав нам свои политические дела."
  kmt.199.a:0 "Мы их не разочаруем"
  kmt.200.t:0 "[From.GetName] отказывается от претензий на Сикан"
  kmt.200.d:0 "[From.GetLeader] решил, что они больше не будут считать Сикан своим основным государством в знак дружбы."
  kmt.200.a:0 "Взаимное уважение превыше всего"
  kmt.201.t:0 "[From.GetName] отклоняет нашу доброту"
  kmt.201.d:0 "[From.GetLeader] думает, что наш акт дружбы - не более чем жалкие уловки, и отказался от дальнейшего обсуждения этого вопроса."
  kmt.201.a:0 "Почему они не могут понять?"
  kmt.202.t:0 "Гражданская война окончена"
  kmt.202.a:0 "Теперь мы поищем союзников по всему миру."
  kmt.208.t:0 "Зарплата коммунистической армии"
  kmt.208.d:0 "Восьмая и Новая четвертая армии теперь просят свою зарплату. Однако в настоящее время у нас недостаточно денег, чтобы выплатить им заслуженную зарплату."
  kmt.208.b:0 "Наша армия всё сделала, коммунисты не заслуживают зарплаты!"
  kmt_probable_inflation:0 "§RЭто приведёт к серьёзной инфляции, поскольку у нас нет дополнительного золота в качестве обеспечения!§!"
  kmt.209.t:0 "Началась инфляция"
  kmt.209.d:0 "Печатание нами новых купюр вызвало серьёзную инфляцию в нашей экономике. И сейчас мы теряем поддержку наших граждан, особенно среднего класса. И некоторые из наших солдат дезертируют к коммунистам!"
  kmt.209.a:0 "Надо было думать раньше..."
  kmt.210.t:0 "[From.GetRulingParty] Отказались платить зарплаты"
  kmt.210.d:0 "[From.GetRulingParty] утверждают, что наши солдаты ничего не сделали во время войны, чтобы заслужить зарплату."
  kmt.210.a:0 "Это возмутительно!"
  ## 10/10/2016 ##
  kmt.212.t:0 "Раздел Янцзы"
  kmt.212.d:0 "Армия [From.GetRulingParty] сейчас стоит на пороге поражения, но нам трудно пересечь реку Янцзы. [From.GetRulingParty] используют это в своих интересах и сейчас предлагают разделить Китай, установив границу по реке Янцзы."
  kmt.212.a:0 "Их поражение - это всего лишь вопрос времени, мы можем подождать."
  kmt.212.b:0 "Они на последнем издыхании, мы не должны давать им время восстановиться!"
  kmt.213.t:0 "[From.GetName] Согласились на раздел"
  kmt.213.d:0 "[From.GetName] согласились с нашим предложением разделить Китай по реке Янцзы."
  kmt.213.a:0 "Липовый мир..."
  kmt_yangtze_partition_tt_prc:0 "Мы заберём китайские провинции севернее Янцзы, а они заберут южнее."
  kmt_yangtze_partition_tt_prc:0 "Мы возьмем китайские провинции к югу от Янцзы, а они возьмут те, что к северу"
  kmt.214.t:0 "[From.GetName] отклонил предложение о разделе"
  kmt.214.d:0 "[From.GetName] отклонил наше предложение разделить Китай, используя Янцзы в качестве границы"
  kmt.214.a:0 "Нам нужно искать другой способ сохранить наше существование!"
  kmt.220.t:0 "Рост прояпонской фракции в [From.GetName]"
  kmt.220.d:0 "Недавно несколько прояпонских чиновников получили влияние в правительстве [From.GetRulingParty] в [From.GetName]. Если мы поддержим их, мы можем получить Китай в качестве союзника, не начиная войны, и получить доступ к его ресурсам"
  kmt.220.a:0 "Это сэкономит нам патроны и жизни"
  kmt.220.b:0 "Они просто косвенно сохраняют свою жалкую нацию"
  kmt.221.t:0 "Дипломат из [From.GetName]"
  kmt.221.d_1:0 "Дипломат из [From.GetName] прибыл в наш двор и подробно рассказал об идеологии паназиатизма. После выступления остатки Кодоха вновь завоевали общественную поддержку. Это ставит Тосэйха в сложное положение"
  kmt.221.d_2:0 "Дипломат из [From.GetName] прибыл в наш двор и подробно рассказал об идеологии паназиатизма. После презентации члены Кодоха составили предложение о японо-китайском альянсе"
  kmt.221.a:0 "Пусть новые идеи воцарятся и последуем за нашими товарищами-китайцами."
  kmt.221.b:0 "Мы поведем Азию к славе."
  kmt.221.c:0 "Новые идеи должны быть остановлены!"
  kmt.222.t:0 "[JAP.GetName] отвергает новые идеи"
  kmt.222.d:0 "[JAP.GetLeader] отверг новую идею пан-азиатства и уничтожил Кодоха, который ее поддерживал. Наши попытки создать китайско-японский альянс потерпели неудачу"
  kmt.222.a:0 "Хотел бы я жить в более просвещенные времена..."
  kmt.224.d:0 "Наши товарищи-китайцы просят нас поделиться некоторыми нашими методами кораблестроения, чтобы они могли построить лучший флот."
  kmt.224.a:0 "Азиаты должны помогать друг другу"
  kmt.224.b:0 "[Root.GetAdjective] технологии - это наши технологии, а не их!"
  kmt.225.t:0 "[From.GetName] оказывает помощь"
  kmt.225.d:0 "[From.GetName] оказал помощь в развитии нашей морской промышленности."
  kmt.225.a:0 "Давайте стройте корабли!"
  kmt.226.t:0 "[From.GetName] отказывает в помощи"
  kmt.226.d:0 "[From.GetName] отказал в помощи в развитии нашей морской промышленности."
  kmt.226.a:0 "Проклятье!"
  kmt.233.t:0 "[From.GetName] просит о нашем вмешательстве"
  kmt.233.d:0 "В связи с нашими хорошими отношениями с [From.GetName] и [JAP.GetName] в нашей фракции. [From.GetLeader] направил нам просьбу о вмешательстве в их текущий конфликт и усмирении агрессии [JAP.GetName]."
  kmt.233.a:0 "Как предусмотрено в рамках китайско-германской дружбы."
  kmt.233.b:0 "Сейчас у нас слишком много дел, китайцы сами по себе."
  kmt.234.t:0 "[From.GetAdjective] вмешательство"
  kmt.234.d:0 "[From.GetLeader] направил(а) официальное письмо [Root.GetLeader], где указал(а), что мы должны немедленно прекратить нашу агрессию в отношении [From.From.GetName]."
  kmt.234.a:0 "Поразмыслив, могу сказать, что вторжение в Китай может оказаться не таким выгодным, как нас убеждают."
  kmt.234.b:0 "К черту этих немцев."
  kmt.235.t:0 "[From.GetName] отказался(лась) вмешаться"
  kmt.235.d:0 "Из-за слишком большой текущей нагрузки [GER.GetLeader] отказался(лась) вмешаться в наш текущий конфликт с японцами."
  kmt.235.a:0 "Какая жалость."
  kmt.236.t:0 "Мир с [JAP.GetName]"
  kmt.236.d:0 "После вмешательства немцев японские войска сейчас отходят из оккупированных районов. Однако они все еще отказываются возвращать нам Маньчжурию."
  kmt.236.a:0 "Еще посмотрим."
  kmt.237.t:0 "Мир между [Root.GetName] и [JAP,GetName]"
  kmt.237.d:0 "После вмешательства немцев японские войска сейчас отходят из оккупированных районов. Однако они все еще отказываются возвращать нам Маньчжурию."
  kmt.237.d_2:0 "После нашего вмешательства японские войска сейчас отходят из оккупированных районов."
  kmt.237.a:0 "Еще посмотрим."
  kmt.237.b:0 "Мудрое решение."
  kmt.238.t:0 "[JAP.GetName] отказывается успокаиваться"
  kmt.238.d:0 "Несмотря на вмешательство, японское правительство все еще отказывается складывать оружие."
  kmt.238.a:0 "Это их выбор."
  kmt.238.b:0 "Мы не будем терпеть такое унижение."
  kmt.240.t:0 "[From.GetName] снова просит нашего вмешательства"
  kmt.240.d:0 "После нашего последнего вмешательства между японцами и китайцами, они все еще испытывают большие трения. Особенно в вопросах Маньчжурии и Тайваня. Для этого, [From.GetLeader] снова отправил официальное письмо [GER.GetLeader], с просьбой о новом вмешательстве."
  kmt.240.a:0 "Надеюсь, это будет последнее из этого."
  kmt.241.t:0 "[GER.GetName] вмешивается снова"
  kmt.241.d:0 "[GER.GetLeader] снова отправил официальное письмо [Root.GetLeader], в котором говорилось, что мы должны вернуть Тайвань и Маньчжурию [From.From.GetName]."
  kmt.241.a:0 "Для прочного мира в Азии."
  kmt.243.t:0 "[JAP.GetName] пришел к соглашению"
  kmt.243.d:0 "После долгих раздумий, [JAP.GetLeader] решил вернуть Маньчжурию и Тайвань, также распустив марионеточные правительства, созданные в этом районе."
  kmt.245.t:0 "[JAP.GetName] отказывается возвращать территории"
  kmt.245.d:0 "Несмотря на вмешательство, японское правительство по-прежнему отказывается возвращать оккупированные территории."
  kmt.247.t:0 "[From.GetName] хочет присоединиться к нашей фракции"
  kmt.247.d:0 "Сильные лидеры [From.GetRulingParty] добились больших успехов и предлагают присоединиться к нашему делу. Нация Китай готова сражаться за Рейх."
  kmt.247.a:0 "Союзник с востока"
  kmt.247.b:0 "Нет!"
  kmt.248.t:0 "Наши колонии в Азии вырвались на свободу!"
  kmt.248.d:0 "Коммунистические революционеры в наших колониях поднялись и свергли колониальное правительство, прежде чем мы смогли отреагировать. Теперь они полностью контролируют территорию и объявили о своей независимости!"
  kmt.248.a:0 "Мы должны исправить эту ошибку!"
  kmt.248.b:0 "У нас нет времени на это..."
  kmt.249.t:0 "Убеждение [CHI.GetLeader]"
  kmt.249.d:0 "[CHI.GetLeader] приехал лично встретиться с [Root.GetLeader] в надежде, что [Root.GetName] присоединится к их войне против японцев."
  kmt.249.a:0 "Мы вместе выступим против фашизма!"
  kmt.249.b:0 "Мы не хотим в этом участвовать."
  kmt.250.t:0 "[ENG.GetName] отказывает"
  kmt.250.d:0 "[ENG.GetName] отказались присоединиться к нашей войне против японцев."
  kmt.250.a:0 "Если мы падём, они последуют за нами."
  kmt.251.t:0 "Новая повестка дня [CHI.GetName]"
  kmt.251.d:0 "Узнав о последних планах китайского правительства, некоторые из наших официальных лиц думают, что мы должны отказаться от наших колоний в Азии, чтобы избежать уничтожения китайцами."
  kmt.251.a:0 "Мы должны оставить наши колонии."
  kmt.251.b:0 "Фу, неужели они не помнят, как мы когда-то отвоевали Макао."
  kmt.254.t:0 "Освободить Вьетнам?"
  kmt.254.d:0 "Когда наша армия вошла в крупный вьетнамский город, местное население приветствовало и приветствовало их прибытие.\n\nДолжны ли мы освободить их город и выполнить наше обещание?"
  kmt.254.a:0 "Они станут суверенным государством."
  kmt.254.b:0 "Им все еще нужно больше руководства."
  kmt.254.c:0 "Это не наша настоящая цель."
  kmt.255.t:0 "Освободить Лаос?"
  kmt.255.d:0 "Наша армия получила поддержку от местных лаосских партизан и установила полный контроль над территорией.\n\nДаровать ли им суверенитет в качестве благодарности за их помощь и выполнения нашего обещания?"
  kmt.256.t:0 "Освободить Камбоджу?"
  kmt.256.d:0 "С помощью местных жителей мы наконец выбили противника с территории Кхмеров.\n\nОсвободим ли мы Камбоджийцев, как и обещали?"
  kmt.257.t:0 "Освободить Малайзию?"
  kmt.257.d:0 "Малайская толпа приветствует наши войска цветами и поцелуями во время их марша по городам и деревням Малайзии.\n\nМожет быть, им пора стать суверенным государством?"
  kmt.258.t:0 "Освободить Индонезию?"
  kmt.258.d:0 "Голландцы не заставляли индонезийцев учить голландский язык, потому что они хотели извлечь максимальную прибыль, что также сохранило национальное самосознание индонезийцев.\n\nТеперь, когда мы взяли под свой контроль индонезийские земли, должны ли мы освободить их, как и обещали?"
  kmt.259.t:0 "Освободить Индию?"
  kmt.259.d:0 "Теперь, когда британское колониальное правительство в Индии капитулировало, мы можем освободить индийский народ от их угнетателей, британских захватчиков. Хотя Ганди может быть не доволен нашим методом освобождения Индии."#Ганди предпочитает ядерное оружие
  kmt.259.a:0 "Теперь индийцы будут править своей собственной нацией, и британцы больше не будут их угнетать!"
  kmt.260.t:0 "Мы взяли Гонконг!"
  kmt.260.d:0 "Гонконг снова под властью Китая!"
  kmt.260.a:0 "Чжун Хуа Минь Цзу Вань Суй!"
  kmt.261.t:0 "Мы взяли Гуанчжоувань!"
  kmt.261.d:0 "Гуанчжоувань снова под китайским правлением!"
  kmt.262.t:0 "Мы захватили Макао!"
  kmt.262.d:0 "Макао снова под китайским правлением!"
  kmt.263.t:0 "Вьетнамцы освобождены"
  kmt.263.d:0 "Вьетнамское население недавно завоеванных регионов было освобождено и присоединилось к своей нации."
  kmt.263.a:0 "Азия снова станет великой!"
  kmt.264.t:0 "Малайзия освобождена"
  kmt.264.d:0 "Малайское население недавно завоеванных регионов было освобождено и присоединилось к своей нации."
  kmt.265.t:0 "Индонезия освобождена"
  kmt.265.d:0 "Индонезийское население недавно завоеванных регионов было освобождено и присоединилось к своей нации."
  kmt.266.t:0 "Азия деколонизирована"
  kmt.266.d:0 "С большинством азиатских стран, освобожденных от злых западных колонизаторов, наше обещание исполнилось, и, возможно, новообразованной нации наших соотечественников-азиатов больше нужен мир, чем война."
  kmt.266.a:0 "Мир приносит процветание."
  kmt.267.t:0 "Японская поддержка"
  kmt.267.d:0 "Наши текущие усилия по поддержке прояпонской фракции в нашем правительстве были поддержаны японским правительством. Наши отношения улучшились."
  kmt.267.a:0 "Вместе мы приведем Азию к славе!"
  kmt.268.t:0 "Япония проявляет враждебность"
  kmt.268.d:0 "Наши текущие усилия по поддержке прояпонской фракции в нашем правительстве вызвали враждебную реакцию со стороны Японии. Они заявляют, что мы пытаемся избежать войны, а не действительно хотим сотрудничать с ними, и что мы лишены чести."
  kmt.268.a:0 "Они слишком узколобы."
  kmt.269.t:0 "Свободная Малайзия?"
  kmt.269.d:0 "Теперь, когда Британское колониальное правительство в Малайзии капитулировало, мы можем освободить малайзийский народ от их угнетающего британского сюзерена."
  kmt.269.a:0 "Малайзийцы теперь будут править своей страной и больше не будут угнетены британцами!"
  kmt.270.t:0 "Свободная Индонезия?"
  kmt.270.d:0 "Теперь, когда голландское колониальное правительство в Индонезии капитулировало, мы можем освободить индонезийский народ от их угнетающего голландского сюзерена."
  kmt.270.a:0 "Индонезийцы теперь будут править своей страной и больше не будут угнетены голландцами!"
  kmt.271.t:0 "Цинхайская клика Ма"
  kmt.271.d:0 "Коммунистам конец, и Ма Пуфан вернулся в Центральное правительство."
  kmt.271.a:0 "[Root.GetRulingParty] - единственная легитимная партия в Китае!"
  kmt.94.b:0 "Как и должно быть."
  kmt.275.t:0 "Возвращение монархии"
  kmt.275.d:0 "После провозглашения своей независимости от [JAP.GetName], [MCK.GetLeader] заявил, что [MCK.GetNameDef] вернулся.\n\nОсвободив Китай от монархии ранее, как нам следует поступить с так называемым "[MCK.GetNameDef]"?"
  kmt.275.a:0 "Смерть свиньям маньчжурам!"
  kmt.275.b:0 "Может быть, мы все-таки можем сосуществовать."
  kmt.275.c:0 "Нам нужно сосредоточиться на другом."
  kmt.276.t:0 "[From.GetName] ищет пакт о ненападении"
  kmt.276.d:0 "Дипломат из [From.GetName] принес документы о пакте о ненападении между нашей империей и их страной."
  kmt.276.a:0 "Это означает, что другие признали нашу силу."
  kmt.276.b:0 "Империя будет править ими всеми!"
  kmt.277.t:0 "Пакт подписан"
  kmt.277.d:0 "[From.GetName] подписал пакт о ненападении."
  kmt.277.a:0 "Неужели это действительно принесет мир?"
  kmt.278.t:0 "Пакт отвергнут"
  kmt.278.d:0 "[From.GetName] отказался подписать пакт о ненападении."
  kmt.278.a:0 "Мы должны подготовить людей!"
  kmt.272.t:0 "Война!"
  kmt.272.d:0 "Наше правительство признало нынешнюю войну наиболее важной проблемой. В связи с тем, что все должностные лица сосредоточились на войне, коррупция стала менее серьезной."
  kmt.272.a:0 "Нам следует найти способ полностью искоренить коррупцию."
  kmt.273.t:0 "Коррупция вернулась на довоенный уровень"
  kmt.273.d:0 "С окончанием войны чиновники снова начали эксплуатировать народ."
  kmt.279.t:0 "Выборы"
  kmt.78.d:0 "Лунь Юнь попал в плен после разгрома его клики. Теперь мы должны решить его судьбу. Кто-то говорит, что он мог бы стать желанным пополнением рядов, а кто-то - что его следует казнить, чтобы подать пример."
  kmt.77.d:0 "Бывший правитель клики Гуанси, Ли Цзунжэнь, попал в плен после разгрома его клики. Теперь мы должны решить его судьбу. Кто-то говорит, что он мог бы стать желанным пополнением рядов, а кто-то - что его следует казнить, чтобы подать пример."
  kmt.76.d:0 "Бывший "Король Шаньси" оказался в плену после уничтожения своей клики. Теперь мы должны решить его судьбу. Некоторые говорят, что он может стать желаемым дополнением к нашему званию, другие говорят, что его следует казнить в качестве примера."
  kmt.281.t:0 "Судьба [YUT.GetLeader]"
  kmt.281.d:0 "Бывший военный губернатор провинции Гуандун оказался в плену после уничтожения своей клики. Теперь мы должны решить его судьбу. Некоторые говорят, что он может стать желаемым дополнением к нашему званию, другие говорят, что его следует казнить в качестве примера."
  kmt_yhm_join:0 "Юй Ханьмоу присоединится к армии"
  kmt_cjt_join:0 "Чэнь Цзитань присоединится к армии"
  kmt.224.t:0 "[From.GetName] запрашивает помощь в военно-морской промышленности"
  kmt.282.t:0 "Борьба за выживание"
  kmt.282.d:0 "Все больше наших солдат и генералов поняли, что текущую войну можно выиграть, только если они отдадут ей всего себя. Это более или менее повысило эффективность нашей армии на поле боя."
  kmt.282.a:0 "За Китай!"
  kmt.283.t:0 "Самые отчаянные часы"
  kmt.284.t:0 "Недостатки в нашей армии"
  kmt.284.d:0 "Постоянно наблюдая за результатами наших армий на полевых сражениях, становится очевидно, что слабость наших армий становится все более очевидной для врага. Если мы продолжим игнорировать эти недостатки, выживание нашей нации в предстоящих бурях весьма сомнительно."
  kmt.284.a:0 "Мы должны что-то с этим сделать."
  kmt.285.t:0 "Армия улучшена"
  kmt.285.d:0 "Недавние реформы, предпринятые нашей армией, принесли свои плоды, наша армия теперь улучшена."
  kmt.285.a:0 "Приятно видеть прогресс."
  kmt.286.t:0 "Голубые рубашки"
  kmt.286.d:0 "Голубые рубашки и его подчиненное агентство BIS (Бюро расследований и статистики) сыграли важную роль в нашем приходе к власти. Было бы естественным, чтобы они получили большую власть в качестве подарка за свои усилия. Однако, беспокоясь о том, что их можно будет обратить против него, у [Root.GetLeader], похоже, есть другой план..."
  kmt.286.a:0 "Им можно доверять"
  kmt.286.b:0 "Роспуск Голубых рубашек!"
  kmt.287.t:0 "План воздушного налета"
  kmt.287.d:0 "[Root.GetLeader] выразил свое желание провести воздушный налет на Японские острова на недавней встрече с Объединенным комитетом начальников штабов в Белом доме. Если налет увенчается успехом, это может значительно поднять моральный дух нашей армии и отомстить за погибших в Перл-Харборе."
  kmt.287.a:0 "Приготовьтесь к этому."
  kmt.287.b:0 "Слишком рискованно"
  kmt.288.t:0 "Успешный авиаудар"
  kmt.288.d:0 "Рейд, возглавляемый Джеймсом Х. Дулитлом, оказался успешным, хотя большинство B-25 потерпело крушение или упало в китайском регионе, в процессе были сильно разбомблены некоторые японские заводы. Это значительно подняло моральный дух наших солдат."
  kmt.288.a:0 "О да!"
  kmt.289.t:0 "Неудача"
  kmt.289.d:0 "Авианалёт на Токио обернулся катастрофой, наш авианосец был обнаружен вражеским радаром и предупредил противника. Наши бомбардировщики столкнулись с ожесточённым зенитным огнем, и многие из них были сбиты. Джеймс Х. Дулиттл подтвердил сбитие KIA."
  kmt.289.a:0 "Ничего хорошего."
  kmt.290.t:0 "[From.GetAdjective] Авианалёт"
  kmt.290.d:0 "Авианалёт, совершенный [From.GetAdjective], привел к разрушениям в районе [Root.Capital.GetName]. Заводы были разрушены, а мирные жители пострадали."
  kmt.290.a:0 "Бака-яроу!"
  kmt.291.t:0 "[From.GetAdjective] высадились лётчики"
  kmt.291.d:0 "Некоторые пилоты [From.GetAdjective] высадились на наших территориях после проведения авианалёта на Японию. Наши войска обнаружили их на месте, и официальные лица обсуждают, как поступить с ситуацией."
  kmt.291.a:0 "Помочь им вернуться в [From.GetName]"
  kmt.291.b:0 "Задержите этих белых свиней!"
  kmt.292.t:0 "[From.GetAdjective] приземлился во Владивостоке"
  kmt.292.d:0 "Пилот с [From.GetAdjective] приземлился во Владивостоке после совершения авианалёта на японский остров. Местная полиция арестовала пилота. Если мы вернём пилота [From.GetName], это может ухудшить наши отношения с Японией. Как нам поступить с этой проблемой?"
  kmt.292.a:0 "Задержать пилота"
  kmt.292.b:0 "Помогите пилоту вернуться в [From.GetName]"
  kmt.292.c:0 "Передать пилота Японии"
  kmt.293.t:0 "[From.GetAdjective] Авианалёт"
  kmt.293.d:0 "Сегодня, авианалёт, совершённый [From.GetAdjective] вызвал панику у мирных жителей. Однако их усилия были тщетны, так как наши хорошо подготовленные войска с лёгкостью сбили их самолёты с неба. Наши потери были минимальны, эта жалкая операция является неоспоримым свидетельством нашей будущей победы над этими варварскими свиньями!"
  kmt.293.a:0 "Муда муда муда!"
  kmt.294.t:0 "[From.GetAdjective] оказали помощь нашим пилотам"
  kmt.294.d:0 "Правительство [From.GetAdjective] предложило помощь нашим пилотам, приземлившимся на их территории, и они вскоре вернутся домой. Их действия, несомненно, улучшат отношения между нашими странами."
  kmt.294.a:0 "Они слишком добры."
  kmt.295.t:0 "[From.GetName] задержали наших пилотов"
  kmt.295.d:0 "Наши пилоты, приземлившиеся на территории [From.GetAdjective], были задержаны [From.GetName]. Они также отвергают любые переговоры."
  kmt.295.a:0 "Да пребудет с ними Бог."
  kmt.296.t:0 "[From.GetName] помогает пилотам [USA.GetAdjective]"
  kmt.296.d:0 "[From.GetName] помогли пилотам [USA.GetAdjective], приземлившимся во Владивостоке, вернуться в [USA.GetName], это ухудшило отношения между нами."
  kmt.296.a:0 "Я знал, что варвары помогут варварам!"
  kmt.297.t:0 "[From.GetName] выдаёт нашего пилота Японии"
  kmt.297.d:0 "Наш пилот, приземлившийся во Владивостоке, был выдан [From.GetName] [JAP.GetName], это ухудшит отношения между нашими странами."
  kmt.297.a:0 "Мы надеемся, что они понимают, что помогают дьяволу."
  kmt.298.t:0 "[USA.GetAdjective] лётчик из [From.GetName]"
  kmt.298.d:0 "[From.GetName] решил передать нам [USA.GetAdjective] лётчика, приземлившегося во Владивостоке. Это послужит подтверждением доверия между нашими двумя странами."
  kmt.298.a:0 "Давайте поприветствуем нашего "друга"."
  kmt.299.t:0 "Проблемы в Сычуани"
  kmt.299.a:0 "Мне плевать."
  kmt.299.b:0 "Отправить помощь."
  kmt.300.t:0 "Падение [From.GetName]"
  kmt.300.d:0 "После капитуляции [From.GetName] в этой войне мы можем дальше концентрировать нашу мощь в регионе Китая, "инкорпорировав" их оставшиеся силы в наши..."
  kmt.300.a:0 "Им стоит радоваться, что мы предлагаем им должности в нашей армии!"
  kmt.301.t:0 "Вторая китайская гражданская война"
  kmt.301.d_1:0 "Вторая китайская гражданская война между [PRC.GetRulingParty] и [CHI.GetRulingParty] началась. Стоит ли нам помочь [PRC.GetRulingParty] победить тираническое правление [CHI.GetRulingParty]?"
  kmt.301.d_2:0 "Вторая китайская гражданская война между [CHI.GetRulingParty] и [PRC.GetRulingParty] началась. Стоит ли нам помочь [CHI.GetRulingParty] победить коммунистических бандитов?"
  kmt.301.a:0 "Конечно!"
  kmt.301.b:0 "Я бы предпочёл быть рыбаком в этой борьбе."
  kmt.302.t:0 "[From.GetName] присоединяется к нашему делу"
  kmt.302.d_1:0 "[From.GetName] решил присоединиться к нам, чтобы победить коммунистических бандитов!"
  kmt.302.d_2:0 "[From.GetName] решил присоединиться к нам в освобождении китайских фермеров от тирании [CHI.GetRulingParty]!"
  kmt.302.a:0 "Смерть коммунистам!"
  kmt.302.b:0 "Поднимайтесь! Те, кто не хочет быть рабами!"
  kmt.303.t:0 "Судьба Пу И"
  kmt.303.d:0 "Айсинь Гёро Пу И был обнаружен на вокзале в ожидании поезда для своего побега. После убийства его японских телохранителей он сдался нашей армии. Как нам поступить с этим "последним императором"?"
  kmt.303.a:0 "Пощадить его, он всего лишь пешка."
  kmt.303.b:0 "Умри, предатель!"
  kmt.304.t:0 "Враг приближается к Чжэнчжоу"
  kmt.304.d:0 "Наш враг теперь очень близок к Чжэнчжоу, возможно, мы могли бы открыть дамбы на Желтой реке и использовать наводнение, чтобы сдержать наших врагов."
  kmt.304.a:0 "Это ради общего блага."
  kmt.304.b:0 "Это безумие!"
  hyk_flood:0 "Наводнение"
  kmt.321.t:0 "[GXC.GetName] присоединяется к нам"
  kmt.321.d:0 "Согласно договоренности, [GXC.GetName] присоединился к нам в нашей войне против японского захватчика."
  kmt.321.a:0 "Мы победим империалистических свиней!"
  kmt.322.t:0 "Мы присоединились к [CHI.GetName]"
  kmt.322.d:0 "Согласно договоренности, мы присоединились к [CHI.GetName] в их войне против японского захватчика."
  kmt.322.a:0 "Мы победим империалистических свиней!"
  kmt.323.t:0 "Подготовка Чунцина"
  kmt.323.a:0 "Теперь мы возьмем под контроль Чунцин"
  kmt.324.t:0 "Промышленность перемещена"
  kmt.324.d:0 "После японского вторжения некоторое оборудование и фабрики возле передовой линии были перемещены в Сычуань."
  kmt.324.a:0 "Здесь они должны быть в безопасности."
  KMT_will_die_if_nanking_fall_tt:0 "§RЕсли Нанкин падёт, вы будете безоговорочно аннексированы [CHI.GetName].§!"
  kmt.325.t:0 "Нападение на [KMT_central_gov_tag.GetName]!"
  kmt.325.d:0 "[KMT_central_gov_tag.GetName] подвергается нападению иностранных захватчиков. Мы должны протянуть им руку помощи!"
  kmt.325.a:0 "Мы выгоним их с китайских земель!"
  kmt.325.b:0 "Полагаю, что они справятся и без нас."
  kmt.326.t:0 "[From.GetName] присоединяется к нам"
  kmt.326.d:0 "[From.GetName] присоединился к нам в нашей войне против японских захватчиков!"
  kmt.327.t:0 "[From.GetName] прекращает гражданскую войну"
  kmt.327.d:0 "[From.GetLeader] признал, что японцы представляют большую угрозу, чем коммунисты, и принял решение прекратить текущую гражданскую войну с коммунистами. Было приказано прекратить наступление, возглавляемое Северо-восточной армией."
  kmt.327.a:0 "Наконец-то!"
  kmt.328.t:0 "Тактика выжженной земли"
  kmt.328.d:0 "Наступающие захватчики заняли наши города и деревни. Наши войска вынуждены отступить, чтобы сохранить свои силы. Тем не менее, перед своим уходом им удалось уничтожить местную инфраструктуру, что помешает продвижению наших врагов."
  kmt.328.a:0 "Отлично сработано"
  kmt.323.d:0 "Нанкин пал перед нашим врагом, мы должны найти другое место, которое будет служить нам столицей. Чунцин должен подготовиться к этой роли.\n\nМы также получили новости о том, что генерал Лю Сян скончался от болезни, от которой он страдал."
  ## 5/6/2017 ##
  kmt.336.t:0 "Встреча с коммунистами?"
  kmt.336.d:0 "С окончанием войны с японцами, наши цели перестали совпадать с коммунистическими бандитами. Однако, немедленное начало прямого наступления в текущей ситуации может иметь негативный эффект на нашу репутацию. Мы также можем провести встречу с [PRC.GetLeader] и действовать до тех пор, пока [PRC.GetLeader] не совершит ошибку."
  kmt.336.a:0 "Пошлите кого-нибудь на встречу."
  kmt.336.b:0 "Мы устроим им засаду, когда они прибудут."
  kmt.336.c:0 "Мы будем сосуществовать."
  kmt.336.e:0 "Кого волнует такой мусор как "репутация"?"
  kmt.337.t:0 "Приглашение"
  kmt.337.d:0 "[Root.GetLeader] получил приглашение от [From.GetRulingParty] на встречу. Говорят, что встреча будет посвящена будущему Китая и попытке найти более мирное решение нашим в настоящее время напряжённым отношениям. Однако некоторые считают, что это ловушка, которая предназначена для того, чтобы избавиться от нашего [Root.GetLeader]."
  kmt.337.a:0 "Нечего бояться."
  kmt.337.b:0 "Мы возьмём на себя инициативу и устроим им засаду."
  kmt.337.c:0 "Нападём на них сейчас, они этого не ожидают!"
  kmt.339.t:0 "Засада!"
  kmt.339.d_rep_killed:0 "Грязные свиньи из [From.GetRulingParty] устроили нам засаду! Они расставили повсюду охрану и открыли огонь по нашим людям, как только мы вошли в зал заседаний. К счастью, [Root.GetLeader] выжил в засаде с незначительными ранениями, полученными от шальных пуль. [Root.GetLeader] успешно сел на самолет и вылетел обратно в [Root.Capital.GetName]. Гражданская война вновь разгорелась."
  kmt.339.d_fight:0 "Ублюдки из [From.GetRulingParty] думали о том же, что и мы, и привели вооруженные силы к месту назначения! Переговорная комната и окружающая ее территория превратились в поле битвы после того, как обе стороны раскрыли свое истинное намерение уничтожить друг друга на месте. Гражданская война вновь разгорелась."
  kmt.339.a:0 "Смерть [From.GetLeader]!"
  kmt.340.d_rep_killed:0 "Наша засада удалась, и мы сразу же уничтожили многих врагов государства. Однако их лидер получил лишь легкие ранения и скрылся в безопасном месте."
  kmt.340.d_fight:0 "Наш враг тоже пытался устроить нам засаду! Наши войска встретились с их войсками, и в этом районе начались бои. Мы должны организовать наших людей и подготовиться к дальнейшим действиям."
  kmt.340.a:0 "Неважно, мы все равно победим в конце."
  kmt.341.t:0 "[From.GetName] принимает"
  kmt.341.d:0 "[From.GetLeader] принял наше приглашение и сказал, что мы можем ждать его прибытия."
  kmt.341.a:0 "Посмотрим..."
  kmt.342.t:0 "[From.GetName] объявляет нам войну"
  kmt.342.d_p:0 "[From.GetName] объявляет нам войну! Кажется, они перестали с нами сотрудничать и хотят от нас избавиться раз и навсегда!"
  kmt.342.d_k:0 "[From.GetName] объявляет нам войну! Эти жалкие бандиты отказались от здравого смысла и показали свое варварское лицо!"
  kmt.342.a:0 "Мы это предвидели!"
  kmt.343.t:0 "Встреча"
  kmt.343.d:0 "Представители обеих сторон прибыли на место. Что должны делать наши представители?"
  kmt.343.a:0 "Выиграть время для подготовки."
  kmt.343.b:0 "Искать возможности для сотрудничества"
  kmt.344.d_stall:0 "Люди подозревают, что представители [From.GetRulingParty] на самом деле пытаются выиграть время для подготовки. Если это действительно так, то мы должны принять меры для своей защиты."
  kmt.344.d_c:0 "[From.GetRulingParty] выразила желание создать совместное правительство, стоит ли нам принять их предложение и совместно править Китаем?"
  kmt.343.c:0 "Мы тоже выиграем время..."
  kmt.344.a:0 "Мы возьмем инициативу и первыми нападем на них!"
  kmt.344.b:0 "Совместное правительство кажется неплохой идеей."
  kmt.345.d:0 "[From.GetName] начинает наступление и атакует нас!"
  kmt.346.t:0 "[From.GetName] согласился"
  kmt.346.d:0 "[From.GetName] согласился на совместное правительство."
  kmt.346.a:0 "Это выгодно для всех"
  ## 7/6/2017 ##
  KMT_united_chinese_gov:0 "Совместное китайское правительство"
  kmt.347.t:0 "Отступление на Тайвань?"
  kmt.347.d:0 "Текущая война для нас идёт не очень хорошо, некоторые предлагают отступить обратно на Тайвань и там готовиться к контрудару."
  kmt.347.a:0 "Это всего лишь тактический отход..."
  kmt.347.b:0 "Никогда!"
  kmt.348.t:0 "Раздел Янцзы"
  kmt.348.d:0 "Текущая война для нас идёт не очень хорошо, некоторые предлагают предложить коммунистам мирное соглашение и разделить Китай. Мы могли бы использовать время, чтобы перегруппироваться и уничтожить их, когда наша армия будет снова готова."
  kmt.348.a:0 "Звучит неплохо."
  kmt.349.t:0 "[From.GetName] отказался от нас"
  kmt.349.d:0 "[From.GetLeader] решил уступить [JAP.GetAdjective] и отказался от нас."
  kmt.349.a:0 "Мы не можем противостоять такому злу..."
  kmt.349.b:0 "Мы лучше умрём, чем станем пешкой великого зла!"
  kmt.350.t:0 "[From.GetName] непокорность"
  kmt.350.d:0 "[From.GetName] решил отвергнуть нашу оккупацию своей территории, несмотря на то, что [CHI.GetLeader] дал разрешение."
  kmt.350.d_2:0 "[From.GetName] выбрал мудрый вариант стать нашей марионеткой."
  kmt.350.a:0 "Bakamono ga! Nihon no pawā wa sekaiichi!"
  kmt.335.t:0 "Улучшение Бирманского пути"
  kmt.335.d:0 "Во время нашей работы некоторые эксперты посоветовали, что мы могли бы направить некоторые ресурсы на строительство серии фортов вдоль южной части Юньнани, что могло бы эффективно сдержать наших врагов, если они захотят войти с юга."
  kmt.335.a:0 "Звучит неплохо."
  kmt.335.b:0 "Об этом не стоит беспокоиться."
  KMT_burma_rd_forts_tt:0 "§YВместо гражданских заводов вдоль южной границы государства Юньнань будут построены форты.§!"
  kmt.351.t:0 "[From.GetName] хочет строить укрепления на наших территориях"
  kmt.351.d:0 "[From.GetName] пытается ввести солдат и военных инженеров на наши территории, чтобы построить укрепления, дабы отбиваться от возможных захватчиков и предотвратить захват стратегически важных позиций. С одной стороны, это укрепит нашу местную обороноспособность, с другой — присутствие на нашей земле поставит [Root.GetLeader] в крайне уязвимое положение."
  kmt.351.a:0 "НЕТ! Пускай строят где угодно!"
  kmt.351.b:0 "Во имя всеобщего блага китайской нации..."
  kmt.352.t:0 "Совет [From.GetLeader]"
  kmt.352.d:0 "[From.GetLeader] заявил, что в [From.Capital.GetName] сейчас очень нестабильная обстановка, и «рекомендовал» не пускать туда наших людей. Кроме того, [From.GetLeader] заявил, что возведет укрепления своими силами. Но все мы прекрасно понимаем, почему он хочет удержать наших людей за дверью..."
  kmt.352.a:0 "Он подвергает опасности всю нацию, его надо убрать!"
  kmt.352.b:0 "В такой тяжелый час мы не должны направлять оружие на братьев..."
  kmt.353.t:0 "Укрепления построены"
  kmt.353.d:0 "[From.GetLeader] радушно встретил наших людей, когда они вошли в провинцию Шаньдун, чтобы возвести укрепления, необходимые для выживания нашей нации."
  kmt.353.a:0 "Хорошо слышать."
  KMT_CQ_stall_time_tt:0 "§RПоследующих событий не будет§!\n"
  PRC_stall_time_tt:0 "Решил(а) оттянуть время на послевоенной встрече с [CHI.GetRulingParty]"
  ## 9/6/2017 ##
  kmt.355.t:0 "Принудительный набор"
  kmt.355.d:0 "Некоторые из должностных лиц придумали идею принудительного призыва мужчин, включая студентов, для службы в армии."
  kmt.355.a:0 "Неотёсанный бриллиант не сверкает."
  kmt.355.b:0 "Звучит ужасно."
  ## 14/6/2017 ##
  kmt.203.t:0 "Враг приближается к [KMT_treasure_state.GetName]"
  kmt.203.d:0 "Наш враг приближается всё ближе к [KMT_treasure_state.GetName], где хранятся наши национальные сокровища. Если они обнаружат эти сокровища, они, безусловно, нанесут им непоправимый ущерб. Мы должны сохранить их и отправить в более безопасное место!"
  kmt.203.a:0 "Это можно использовать как средство для поднятия духа наших солдат."
  kmt.203.b:0 "Мы должны сохранить эти артефакты!"
  kmt.204.t:0 "Разграбленные артефакты"
  kmt.204.d:0 "Наша неспособность немедленно переместить артефакты привела к их разграблению нашим врагом. Говорят, что некоторые артефакты были разбиты на более мелкие части для более удобной транспортировки. Такие новости нанесли большой ущерб нашей стране и духу нашего народа."
  kmt.204.a:0 "Как они могли!"
  KMT_will_be_destination_tt:0 "Станет новым местом расположения артефактов\n"
  ## 16/6/2017 ##
  kmt.356.t:0 "Встреча с нашим соседом"
  kmt.356.d:0 "После некоторых недавних событий вокруг нас возникли новые соседи. Мы могли бы построить с ними хорошие отношения и укрепить нашу власть в этом районе."
  kmt.356.a:0 "Звучит хорошо."
  kmt.356.b:0 "Мы преуспеем и в одиночку."
  kmt.357.t:0 "[From.GetAdjective] Делегация"
  kmt.357.d:0 "[From.GetName] отправил делегации, чтобы установить с нами близкие отношения."
  kmt.357.a:0 "Мы будем работать вместе"
  kmt.357.b:0 "Нам лучше искать защиты под тенью гиганта."
  kmt.357.c:0 "Мы не допустим, чтобы рука дьявола протянулась еще дальше!"
  kmt.358.t:0 "Вместе сильнее"
  kmt.358.d:0 "[From.GetName] согласились сотрудничать с нами."
  kmt.358.d_p:0 "[From.GetName] решили искать у нас защиты и передали часть своей автономии."
  kmt.358.a:0 "Мудрое решение."
  kmt.359.t:0 "[From.GetName] отказались"
  kmt.359.d:0 "[From.GetName] решили отвергнуть наше предложение."
  kmt.359.a:0 "Мы должны обеспечить свои интересы в этом районе, даже силой!"
  kmt.320.t:0 "[SOV.GetAdjective] Поддержка"
  kmt.320.d:0 "[SOV.GetName] прислали нам больше оборудования, чтобы помочь нам сразиться с нашим врагом!"
  kmt.320.a:0 "Фантастика!"
  kmt.362.t:0 "Поражение от [From.GetName]"
  kmt.362.d:0 "Наш конфликт с [BDW_victor.GetName] привел к нашему поражению. Их войска вошли на нашу территорию с минимальным сопротивлением и взяли под контроль этот район."
  kmt.362.a:0 "Крайне прискорбно."
  kmt.363.t:0 "Победа над [From.GetName]"
  kmt.363.d:0 "Мы одержали победу в недавнем конфликте с [From.GetName], наши войска теперь захватили территорию, на которой они ранее организовали сопротивление против нас."
  kmt.363.a:0 "Славная победа!"
  kmt.364.t:0 "Судьба Хань Фу-цз"
  kmt.364.d:0 "Этот бывший военачальник Шаньдуна был захвачен нашими людьми. Он сумел сохранить высокий уровень автономии в Шаньдуне, будучи главой региона, и представлял большую угрозу для авторитета Центрального правительства.\n\nКак с ним поступить?"
  kmt.366.t:0 "Возможность"
  kmt.366.d:0 "Источники сообщили, что в КНР происходит какая-то общенациональная революция. Возможно, это наш шанс вернуть себе материк от этих коммунистических подонков!"
  kmt.366.a:0 "Подготовьте наших людей!"
  kmt.366.b:0 "Еще не время."
  kmt.367.t:0 "Японские коллаборационисты"
  kmt.367.d:0 "Некоторые китайцы решили предать свою страну ради собственной выгоды, пока мы сражаемся с японской угрозой. Эти "ханьцзянь" теперь попали нам в руки после окончания войны, и, возможно, они заслуживают смерти за измену, но с учетом нынешней ситуации может быть другой способ справиться с ними..."
  kmt.367.a:0 "Только смерть ждет этих предательских собак!"
  kmt.367.b:0 "Заставьте их сражаться под нашим знаменем!"
  kmt.367.c:0 "Мы все еще можем извлечь выгоду из их силы и знаний..."
  kmt.368.t:0 "Беженцы-коллаборационисты"
  kmt.368.d:0 "Жестокое обращение со стороны [CHI.GetName] к сдавшимся коллаборационистам вызвало дезертирство в рядах их реорганизованных дивизий. Эти дезертиры ищут у нас убежища и, возможно, будут сражаться на нашей стороне после того, как станут свидетелями тиранических действий [CHI.GetRulingParty]. Однако некоторые из наших товарищей все еще считают, что эти коллаборационисты не заслуживают второго шанса..."
  kmt.368.a:0 "Нам нужны еще люди."
  kmt.368.b:0 "Мы не потерпим предателей."
  ## 31/8/2017 ##
  kmt.208.a:0 "Напечатать больше денег."
  kmt.369.t:0 "Заставить [CHI.GetLeader] уйти в отставку?"
  kmt.369.d:0 "[CHI.GetLeader] доказал свою некомпетентность в руководстве нашей нацией, если ему и дальше позволят руководить нацией и армией, наши шансы на победу в этой войне будут ничтожными. Ему пора уйти в отставку и уступить место нашему вице-президенту [Root.GetLeader]."
  kmt.369.a:0 "Приказать ему уйти в отставку."
  kmt.369.b:0 "Лучше не противиться ему..."
  kmt.370.t:0 "Отставка"
  kmt.370.d:0 "[From.GetLeader] заключил союз с [XIA.GetLeader], чтобы попытаться заставить [Root.GetLeader] уйти в отставку. Они говорят, что нужен новый президент, чтобы иметь шанс пережить эту красную чуму, опустошающую Китай."
  kmt.370.a:0 "Хорошо."
  kmt.370.b:0 "Никогда!"
  kmt.371.t:0 "Успех"
  kmt.371.d:0 "[Root.GetLeader] стал президентом [CHI.GetName]."
  kmt.371.a:0 "Хорошо"
  kmt.372.t:0 "[From.GetLeader] отказывается"
  kmt.372.d:0 "[From.GetLeader] отказался уйти в отставку."
  kmt.372.a:0 "Черт!"
  kmt.373.t:0 "Получить помощь от [USA.GetName]"
  kmt.373.d:0 "Наша ситуация ужасна, возможно, нам понадобится иностранная помощь, если мы хотим выиграть эту войну."
  kmt.373.a:0 "Отправить в [USA.Capital.GetName] кого-нибудь за помощью."
  kmt.373.b:0 "Это внутреннее дело Китая!"
  kmt.374.t:0 "Отправить помощь [CHI.GetName]?"
  kmt.374.d:0 "Текущая война для [CHI.GetName] идёт не очень хорошо, и они прислали представителей за помощью."
  kmt.374.a:0 "Мы должны помочь им."
  kmt.374.b:0 "Мы не будем тратить наши ресурсы впустую."
  kmt.375.t:0 "[USA.GetAdjective] Припасы"
  kmt.375.d:0 "[USA.GetName] согласились помочь нам и прислали нам припасы!"
  kmt.375.a:0 "Это должно дать нам преимущество в войне."
  kmt.376.t:0 "[USA.GetName] отказались"
  kmt.376.d:0 "[USA.GetName] отказались присылать нам припасы."
  kmt.376.a:0 "О нет..."
  kmt.377.t:0 "Гиперинфляция в [CHI.GetName]"
  kmt.377.d:0 "Экономика в [CHI.GetName] переживает не лучшие времена, так как из-за некомпетентности их правительства произошла гиперинфляция. Должны ли мы помочь им смягчить ситуацию?"
  kmt.377.b:0 "Помощь им будет в наших интересах."
  kmt.377.a:0 "Разочарование..."
  kmt.378.t:0 "[USA.GetAdjective] Кредит"
  kmt.378.d:0 "[USA.GetName] выдали нам несколько кредитов, чтобы смягчить нашу инфляцию."
  kmt.378.a:0 "Фантастика!"
  kmt.379.t:0 "Инфляция менее суровая"
  kmt.379.d:0 "Благодаря помощи от [USA.GetName] инфляция теперь менее суровая."
  kmt.382.t:0 "[YUN.GetLeader]"
  kmt.382.d:0 "Нам стало известно, что [YUN.GetLeader] установил контакт с коммунистами во время войны. Теперь, когда стратегическая польза от него сошла на нет, мы должны действовать, пока он и его компаньоны-коммунисты не сделали этого первыми."
  kmt.382.a:0 "Штурмуем его офис и берём его в плен!"
  kmt.382.b:0 "Не о чем беспокоиться."
  kmt.383.t:0 "[From.GetRulingParty] взят офис [Root.GetLeader]"
  kmt.383.d:0 "[From.GetLeader] штурмовал офис [Root.GetLeader] и отстранил его от должности. Пост губернатора Юньнани теперь занимает Лю Хань."
  kmt.383.a:0 "Как прискорбно."
  kmt.383.b:0 "Мы будем следовать только указаниям [Root.GetLeader]!"
  kmt.384.t:0 "Судьба Лунь Юня"
  kmt.384.d:0 "Мы схватили Лунь Юня и поместили его под домашний арест."
  kmt.384.a:0 "Он мог бы пригодиться на военной службе."
  kmt.384.b:0 "Держите его под домашним арестом."
  kmt.385.t:0 "[From.GetLeader] бунтует"
  kmt.385.d:0 "Отряд [From.GetLeader] восстал против нас за то, что мы пытались арестовать [From.GetLeader]!"
  kmt.385.a:0 "Это будет плевым делом."
  kmt.217.t:0 "Сохранить статус-кво?"
  kmt.217.d:0 "Нынешняя гражданская война находится в тупике уже довольно долго, и наши люди, и наши войска истощены. Было бы лучше, если бы мы прекратили активные военные операции против врагов и дали себе время перегруппироваться. Поскольку наши враги слабее нас, они, возможно, тоже смогут воспользоваться этой возможностью в своих интересах."
  kmt.217.a:0 "Наши люди нуждаются в отдыхе."
  kmt.217.b:0 "Чепуха! Должен быть только один!"
  kmt.386.t:0 "[From.GetName] прекратил(а) военные действия"
  kmt.386.d:0 "Наши фронтовые донесения свидетельствуют о том, что [From.GetName] прекратил(а) военные действия."
  kmt.386.a:0 "Мы должны воспользоваться этой возможностью!"
  kmt.387.t:0 "Соперничество Чан Кайши и Ли"
  kmt.387.d:0 "Хотя [Root.GetLeader] в настоящее время занимает пост президента, Чан Кайши может отдавать прямые приказы своим армиям, и его армии предпочитают выполнять приказы Чан Кайши, а не Ли. Соперничество этих двух людей сказывается на боеспособности нашей армии."
  kmt.387.a:0 "..."
  kmt.388.d:0 "Соперничество между Чан Кайши и Ли продолжается, и если так пойдет и дальше, наша армия не сможет победить коммунистов, поскольку ей не хватает координации. Однако Ли устал от вмешательства Чан Кайши и планирует покинуть страну, поскольку не видит будущего Китая под властью Чан Кайши."
  kmt.388.a:0 "Пусть уезжает."
  kmt.388.b:0 "Он нам нужен!"
  kmt.389.t:0 "Индокитай"
  kmt.389.d:0 "Ранее колония [FRA.GetName], регион Индокитай был "захвачен" японцами некоторое время назад. Теперь мы избавили этот регион от японского присутствия, и, возможно, настало хорошее время, чтобы решить, что нам делать с этой землей."
  kmt.389.a:0 "Освободить колонизированный народ!"
  kmt.389.b:0 "Освободить колонизированный народ... разумеется, под нашим руководством..."
  kmt.389.c:0 "Вернуть регион в собственность [FRA.GetName]."
  kmt.389.e:0 "Эта территория нас не интересует."
  kmt.390.t:0 "[From.GetName] освободил Индокитай"
  kmt.390.d:0 "[From.GetName] освободил Индокитай, что серьёзно подорвало наши колониальные интересы в этом регионе."
  kmt.390.a:0 "Как они посмели!?"
  kmt.391.t:0 "[From.GetName] вернул Индокитай"
  kmt.391.d:0 "[From.GetName] вернул Индокитай нам, это укрепит отношения между нашими странами."
  kmt.391.a:0 "Слава Богу!"
  kmt.359.b:0 "Безразлично."
  kmt.393.t:0 "[From.GetAdjective] гражданская война"
  kmt.393.d:0 "У [From.GetName] началась гражданская война, может быть, мы могли бы выбрать сторону и получить какие-то выгоды?"
  kmt.393.a:0 "Помочь [From.GetName]"
  kmt.393.b:0 "Выступить против [From.GetName]"
  kmt.393.c:0 "Пусть все они отправляются в ад!"
  kmt.393.e:0 "Плевать мы хотели."
  kmt.394.t:0 "Выборы?"
  kmt.394.d:0 "Планируется проведение выборов, но сейчас у нас дел невпроворот. Стоит ли нам проводить выборы?"
  kmt.394.a:0 "Разумеется."
  kmt.394.b:0 "Нам следует подождать, пока не закончится война."
  kmt.279.c:0 "[Root.GetLeader] необходимо сохранить во власти."
  kmt.279.b:0 "Чан Кайши и его антикоммунистическая позиция как раз то, что нужно народу."
  kmt.279.d:0 "Сейчас мы проводим наши первые выборы. Это важная веха на пути нашей нации к демократии."
  kmt.397.d:0 "Сейчас проходят выборы. Правительство [Root.GetLeader] подвергается сомнению некоторыми людьми. Означают ли эти выборы какие-то изменения во внутренней политике [Root.GetName]?"
  kmt.279.e:0 "Политика Ли Цзунжэня принесет пользу армии."
  kmt.279.a:0 "Лучшим вариантом для народа является Чан Кайши."
  kmt.397.a:0 "Сюй Фулинь."
  kmt.398.t:0 "[Root.GetLeader] Переизбран"
  kmt.398.d:0 "В связи с отсутствием других кандидатов [Root.GetLeader] был автоматически переизбран президентом [Root.GetName]."
  kmt.398.a:0 "Поздравление... или как это назвать?"
  kmt.399.t:0 "Смерть Чан Кайши"
  kmt.399.d:0 "Чан Кайши, который возглавлял [Root.GetNameDef] в течение последних нескольких десятилетий, недавно скончался в официальной резиденции Шилин. Причиной смерти является почечная недостаточность, осложненная прогрессирующей сердечной дисфункцией.\n\nСтрадая от пневмонии и сердечного приступа, Чан сократил свое участие в политике на несколько месяцев. Хотя он все еще был президентом, фактически главой правительства были вице-президент Янь Цзякан и премьер-министр Исполнительного Юаня Цзян Цзинго, который также является старшим сыном Чанга.\n\nВице-президент Янь занял пост исполняющего обязанности президента, хотя многие считают, что реальная власть на самом деле находится в руках Цзян Цзинго.\n\n\"И Гоцзя Синван Вэй Цзи Рен, Чжи Гэжэнь Сышэн Ю Ду Вай.\""
  kmt.399.a:0 "Невосполнимая потеря."
  kmt.400.t:0 "Цзян Цзинго избран президентом"
  kmt.400.d:0 "В связи с отсутствием других кандидатов, Цзян Цзинго, единственный кандидат от Гоминьдана, был автоматически избран президентом [Root.GetNameDef]."
  kmt.400.a:0 "Какие у нас тут \"выборы\"..."
  kmt.401.a:0 "Новый президент."
  ## 13/10/2017 ##
  kmt.403.t:0 "Полководцы устранены"
  kmt.403.d:0 "После долгих трудностей мы наконец устранили всех полководцев, угрожающих нашему положению."
  kmt.79.t:0 "Полководцы"
  kmt.79.d:0 "Из-за изменений в количестве полководцев наше влияние в Китае также изменилось."
  kmt.79.a:0 "Интересно"
  kmt.402.t:0 "Китай объединен"
  kmt.402.d:0 "Вернув все утраченные территории, наш национальный дух взлетел до небес!"
  kmt.402.a:0 "Все склонятся перед Поднебесной!"
  kmt.403.a:0 "Хорошо"
  kmt.404.t:0 "Вытеснены"
  kmt.404.d:0 "Мы были вытеснены с наших основных территорий, наше влияние на новых территориях пошатнулось."
  kmt.404.a:0 "Мы видали и похуже."
  kmt.406.t:0 "Пакт с [SOV.GetNameDef]?"
  kmt.406.d:0 "С нашей нынешней промышленностью нам может потребоваться иностранная помощь, чтобы добиться хоть каких-то результатов в нашей нынешней войне. [SOV.GetNameDef], так же заинтересованный в сдерживании нашего врага, может помочь нам."
  kmt.406.a:0 "Попросить их о помощи."
  kmt.406.b:0 "Им нельзя доверять."
  kmt.407.t:0 "Пакт с [From.GetName]?"
  kmt.407.d:0 "[From.GetName] прислал представителей просить помощи у нас в их нынешних военных действиях."
  kmt.407.a:0 "Это будет соответствовать нашим интересам, если они удержатся."
  kmt.407.b:0 "Это нас не касается."
  kmt.408.t:0 "Советско-китайский пакт о ненападении"
  kmt.408.d:0 "[From.GetName] согласился помочь нам!"
  kmt.408.a:0 "Фантастика!"
  kmt.409.t:0 "[SOV.GetName] отверг"
  kmt.409.d:0 "[From.GetName] отказался нам помочь."
  kmt.409.a:0 "Не идеал."
  kmt.83.t:0 "Войска милитаристов"
  kmt.83.d:0 "Некоторые войска милитаристов ослушались наших приказов и получают их только от своих командиров. Это крайне отрицательно повлияло на эффективность нашей армии."
  kmt.83.a:0 "Эти гниды..."
  kmt_hfq_join:0 "Хань Фу-цзюй присоединится к армии."
  ## 15/10/2017 ##
  kmt.399.d_2:0 "Чан Кайши, возглавлявший [Root.GetNameDef] на протяжении последних нескольких десятилетий, недавно скончался в официальной резиденции Шилин. Причиной смерти названа почечная недостаточность в сочетании с прогрессирующей сердечной дисфункцией.\n\nСтрадая пневмонией и сердечным приступом, Чан в течение нескольких месяцев сокращал свое участие в политике.\n\n\"Рождение и гибель государства зависит от народной судьбы, рождение и гибель человека — от небесной воли.\""
  ## 16/10/2017 ##
  kmt.411.t:0 "Дезертиры"
  kmt.411.d:0 "После недавнего внедрения [CHI.GetRulingParty] нового движения по возрождению деревень условия жизни фермеров в стране улучшились. Некоторые наши товарищи даже подумывают о том, чтобы вернуться к сельскому хозяйству и продолжить жизнь, которой они жили до вступления в нашу партию. Это привело к значительному количеству дезертиров среди наших войск."
  kmt.411.a:0 "Пресечь такое поведение!"
  kmt.411.b:0 "Мы ничего не можем сделать."
  kmt.412.t:0 "Дезертиры из Красной армии"
  kmt.412.d:0 "После недавнего внедрения нашей программы по восстановлению сельской местности, в Красной Армии наблюдается дезертирство. Иногда наши войска могут столкнуться с большим числом дезертиров, пытающихся проскользнуть за линию фронта.\n\nЧто нам делать с этими дезертирами?"
  kmt.412.a:0 "Разоружить их и отпустить."
  kmt.412.b:0 "Арестовать их всех!"
  kmt.413.t:0 "Возвращение дезертиров"
  kmt.413.d:0 "[CHI.GetRulingParty] начали арестовывать всех наших дезертиров на месте. Такие новости фактически отпугнули тех, кто планировал покинуть свой пост, к тому же, некоторые дезертиры теперь возвращаются к нам."
  kmt.413.a:0 "Казнить этих предателей!"
  kmt.413.b:0 "Примите их тепло."
  kmt.414.t:0 "Бандиты!"
  kmt.414.d:0 "Дезертиры из Красной Армии образовали многочисленные отряды бандитов в отдаленных районах, чтобы выжить. Они время от времени нападают на местных торговцев и даже грабят поезда с припасами. Это вызвало серьезные проблемы с безопасностью в сельских районах."
  kmt.414.a:0 "Черт бы их побрал!"
  kmt.415.t:0 "Бандиты повредили инфраструктуру"
  kmt.415.d:0 "В недавней операции бандиты уничтожили некоторые объекты инфраструктуры, чтобы захватить маршрут снабжения. Потребуется некоторое время, чтобы устранить повреждения."
  KMT_ex_commie_peasant_forces_tt:0 "Получить 5 отрядов."
  kmt.416.t:0 "Бывшие солдаты Красной Армии добровольно идут на войну"
  kmt.416.d:0 "Некоторые крестьяне, которые являются бывшими солдатами Красной Армии, добровольно идут на помощь в военных действиях. Куда нам их направить?"
  kmt.416.a:0 "На передовую."
  kmt.416.b:0 "За линией фронта наших врагов."
  kmt.416.c:0 "Фермерское хозяйство, конечно же."
  ## 18/10/2017 ##
  kmt.299.d:0 "В газетах стали появляться сообщения о голоде и засухе в Сычуане. Некоторые организации собирают средства для помощи пострадавшим, а [From.GetLeader] призывает нас сделать то же самое. Если мы предложим помощь жителям Сычуани, это может потенциально предоставить нам дополнительную политическую власть над этой областью."
  kmt.417.d:0 "В газетах появились сообщения о голоде и засухе в Сычуане. Что нам делать?"
  kmt.417.a:0 "Обратиться за помощью к центральному правительству."
  kmt.418.t:0 "[From.GetRulingParty] отказывает в отправке помощи"
  kmt.418.d:0 "Несмотря на то, что мы представили неопровержимые доказательства страданий народа Сычуани, чиновники [From.GetRulingParty] хладнокровно отказались отправить помощь."
  kmt.419.t:0 "[From.GetRulingParty] отправляет помощь"
  kmt.419.d:0 "Видя страдания народа Сычуани, чиновники [From.GetRulingParty] создали специальный комитет для решения проблем и оказания столь необходимой помощи пострадавшим."
  kmt.419.a:0 "Хорошо слышать."
  ## 25/10/2017 ##
  ### kmt.420 на самом деле не нуждается в китайской локализации, так как он в первую очередь изменяет написание имен на английском. Событие можно удалить, если захотите. ###
  kmt.420.t:0 "Почтовая латинизация"
  kmt.420.d:0 "Хотите ли вы изменить названия городов на почтовую романизацию?\n\nПРИМЕЧАНИЕ:\n-Изменения не применяются к названиям клик военачальников и географических названий в событиях, если только они не возвращаются определенными командами.\n- повторный запуск этого события не позволит вам отменить изменения.\n- Названия, уже находящиеся в почтовой романизации, не будут затронуты, т.е. некоторые названия штатов в Маньчжурии."
  kmt.420.a:0 "ОК"
  kmt.420.b:0 "нет"
  kmt.421.t:0 "Переименование отбитых городов"
  kmt.421.d:0 "Некоторые из наших городов были переименованы захватчиками, когда они претендовали на них как на свои собственные. Теперь, когда мы отбили эти земли, следует ли нам переименовать их обратно?"
  kmt.421.a:0 "Конечно"
  kmt.421.b:0 "Нет необходимости"
  kmt.332.t:0 "[From.GetName] Запрашивает более тесное сотрудничество"
  kmt.332.d:0 "[From.GetName] выразил желание укрепить связь между нашими двумя странами"
  kmt.332.a:0 "С радостью"
  kmt.332.b:0 "Нам лучше держаться на расстоянии"
  kmt.333.t:0 "[From.GetName] принимает"
  kmt.333.d:0 "[From.GetName] согласился укрепить нашу связь."
  kmt.333.a:0 "Здорово"
  kmt.334.t:0 "[From.GetName] отказывается"
  kmt.334.d:0 "[From.GetName] отказался от дальнейшего сотрудничества между нами."
  kmt.334.a:0 "Жаль"
  kmt.426.t:0 "Падение хунаньской клики"
  kmt.426.d:0 "Хунаньская клика уничтожена, а ее бывший глава захвачен нашими войсками вместе с другими чиновниками. Пришло время решать, как они искупят свою вину."
  kmt.426.a:0 "Они искупят свою вину на поле боя."
  kmt.426.b:0 "Смерть - единственное прощение."
  kmt.427.t:0 "Падение Сычуаньской клики"
  kmt.427.d:0 "Сычуаньская клика разгромлена, а её прежний руководитель и другие должностные лица захвачены в плен нашими войсками. Сейчас мы должны решить, как они искупят свою вину."
  kmt.428.t:0 "Судьба Лю Вэнь-хуэя"
  kmt.428.d:0 "После того, как его Сыканская армия была разбита и введена в состав нашей армии, Лю Вэнь-хуэй, похоже, больше не представляет для нас особого интереса. Как решить его судьбу?"
  kmt.429.t:0 "Остатки Северо-восточной армии"
  kmt.429.d:0 "Лишившись своей оперативной базы, оставшиеся части Северо-восточной армии, которую когда-то считали элитной среди милитаристов, превратились лишь в разрозненные толпы. Это дало нам шанс расправиться с ними раз и навсегда."
  kmt.429.a:0 "Они должны быть введены в нашу армию."
  kmt.429.b:0 "Арестуйте их за измену государству и партии!"
  kmt_xia_generals_join:0 "Некоторые генералы присоединятся к нашей армии.\n"
  kmt_lwh_join:0 "Лю Вэнь-хуэй присоединится к нашей армии.\n"
  kmt.361.t:0 "[USA.GetAdjective] Поддержка"
  kmt.361.d:0 "[USA.GetName] прислали нам больше техники для борьбы с врагом!"
  ## 19/11/2017 ##
  kmt.432.t:0 "Ещё одна китайская гражданская война"
  kmt.432.d:0 "В Китае вспыхнула гражданская война между прояпонской и антияпонской фракциями."
  kmt.432.a:0 "Поддержать прояпонскую фракцию."
  kmt.432.b:0 "Поддержать антияпонскую фракцию."
  kmt.432.c:0 "Мы должны их уничтожить."
  kmt.432.e:0 "Ничего страшного."
  kmt.434.t:0 "Казнь Хан Фу-чжу"
  kmt.434.d:0 "[From.GetLeader] приказал казнить Хан Фу-чжу после того, как тот был обвинён в дезертирстве при обороне Цзинаня. Лю Сян, услышав эту новость, упал и вскоре скончался."
  kmt.434.a:0 "О Боже."
  kmt.75.d:0 "[From.GetName] признал, что противостояние с нами ни к чему хорошему не приведёт. Они мирно сдались."
  kmt.218.t:0 "Разногласия по поводу укрепления позиций"
  kmt.218.d:0 "Некоторые из наших генералов расходятся во мнениях относительно того, где следует сконцентрировать усилия по укреплению позиций. Одни предлагают закрепиться в Пекине и построить укрепления вокруг города и Тяньцзиня. Однако другая сторона утверждает, что строительство укреплений в этом районе предупредит японцев о том, что мы отказываемся от соглашения Хэ-Умэдзу, и спровоцирует преждевременную войну. Чтобы не привлекать внимание японцев, они предлагают использовать Жёлтую реку в качестве естественного барьера и построить укрепления вдоль неё.\n\nЧьё мнение нам следует принять?"
  kmt.218.a:0 "Пекин не падёт!"
  kmt.218.b:0 "Мы не можем позволить себе начать преждевременную войну с [JAP.GetName]."
  kmt.437.t:0 "[PGR.GetName] присоединяется к нам"
  kmt.437.d:0 "[PGR.GetName] присоединился к нашей войне."
  kmt.437.a:0 "Хорошо"
  kmt.438.t:0 "Восстановить армию в Шанхае?"
  kmt.438.d:0 "После инцидента от 28 января Шанхай и прилегающие районы были демилитаризованы согласно шанхайскому соглашению о прекращении огня. Это запрещает размещение нашей армии в Шанхае и около него, что помешает нам эффективно защищать этот район, если начнется война.\n\nВ соответствии с нашей политикой приоритизации внешних угроз некоторые наши должностные лица предлагают организовать \"инцидент\" и использовать его в качестве причины для размещения большего количества войск в этом районе. После этого Шанхай станет де-факто демилитаризованной зоной без особых политических усилий."
  kmt.438.a:0 "Звучит многообещающе."
  kmt.438.b:0 "Слишком рискованно."
  KMT_fortification_discovered_tt:0 "Японцы узнают о наших действиях!\n"
  KMT_nothing_happens_tt:0 "Ничего не происходит\n"
  kmt.439.t:0 "[JAP.GetAdjective] войска обнаруживают наши укрепления"
  kmt.439.d:0 "Местный [JAP.GetAdjective] гарнизон заметил увеличение количества войск и оборонительных сооружений в районе и заявил, что мы нарушили соглашение Хэ-Умэдзу и мир в районе. Штаб гарнизона также отправил запрос на передачу контроля над провинцией Хэбэй им, утверждая, что под их надзором в районе будет \"мирнее\"."
  kmt.439.a:0 "Мы не уступим им ни дюйма!"
  kmt.439.b:0 "Мы еще не готовы к тому, что грядет."
  KMT_may_lead_to_war_with_JAP_tt:0 "Может привести к войне с [JAP.GetName]!\n"
  kmt.440.t:0 "[CHI.GetName] идет на дальнейшие уступки"
  kmt.440.d:0 "После некоторой договоренности с нашими гарнизонами в районе Пекин-Тяньцзинь, [CHI.GetAdjective] правительство сделало для нас некоторые уступки, чтобы предотвратить военные конфликты."
  kmt.440.a:0 "Хорошо."
  kmt.441.t:0 "Шанхай ремилитаризован"
  kmt.441.d:0 "После недавних событий с избиением японцами китайцев на складе, [CHI.GetAdjective] правительство решило повысить уровень безопасности и направить в Шанхай больше войск под названием «Вооруженные полицейские силы». Западные державы не возражали против этого плана, и Шанхай теперь де-факто демилитаризован.\n\nС увеличением присутствия войск [CHI.GetAdjective] в этом районе нашим войскам будет сложнее захватить этот жизненно важный стратегический пункт, как только мы решим начать войну с [CHI.GetName]. Может быть, пришло время нам вмешаться."
  kmt.441.a:0 "Скажите им, что наша полиция займется арестом преступников."
  kmt.441.b:0 "Не о чем беспокоиться."
  kmt.442.t:0 "Вмешательство [JAP.GetAdjective]"
  kmt.442.d:0 "После того, как наши «Вооруженные полицейские силы» вошли в Шанхай, их встретил представитель [JAP.GetAdjective], заявивший, что японская полиция займется этим делом, и потребовавший от наших войск вывести силы из района. Если мы пойдем на компромисс, Шанхай снова станет демилитаризованной зоной. Как нам ответить на подобный запрос?"
  kmt.442.a:0 "Проигнорировать просьбу."
  kmt.442.b:0 "Мы еще не готовы."
  kmt.443.t:0 "Китайские войска отступили"
  kmt.443.d:0 "После недолгих обсуждений, китайские "Вооруженные полицейские силы" мирно покинули Шанхай и вернулись на окраину города Сучжоу."
  kmt.443.a:0 "Они не ровня нам."
  kmt.444.d:0 "Наша просьба о выводе "Вооруженных полицейских сил" была проигнорирована, и войска заняли позиции в городе. Похоже, дипломатия провалилась."
  kmt.444.a:0 "Пора возродить Инцидент 28 января..."
  kmt.444.b:0 "В любом случае, у них нет шансов."
  KMT_shanghai_incident_later_tt:0 "§GИнцидент будет устроен.§!\n"
  kmt.447.t:0 "[CHI.GetRulingParty] Надзор"
  kmt.447.d:0 "После смерти Хо Ин-чина, [CHI.GetRulingParty] похоже намерено пересмотреть то, что было сделано в Соглашении Хэ-Умедзу. В последнее время высокопоставленные чиновники часто посещают местных губернаторов, и похоже, что наша автономия скоро будет у нас отнята."
  kmt.447.a:0 "Принять нашу судьбу."
  kmt.447.b:0 "Отвергнуть любые визиты [CHI.GetRulingParty]!"
  kmt.447.c:0 "Японцы все-таки могут стать нашими спасителями."
  kmt.447.d_2:0 "Японцы отказались нам помочь. Мы вернулись к исходной точке."
  kmt.448.t:0 "Несотрудничающие губернаторы"
  kmt.448.d:0 "Местные губернаторы в Бэйпине оказались довольно жесткими в общении. Наши взятки отвергаются, и теперь они отклоняют любые новые назначения или визиты наших чиновников. Наша попытка восстановить контроль над регионом, похоже, провалилась."
  kmt.448.a:0 "Делать то, что нужно."
  kmt.448.b:0 "Чепуха"
  kmt.449.t:0 "Контроль над Пекином"
  kmt.449.d:0 "Благодаря политике кнута и пряника губернаторы регионов оказали нам необходимую поддержку для восстановления контроля над районом Пекина."
  kmt.449.a:0 "Партия превыше всего."
  kmt.450.t:0 "Инцидент в Чапеи"
  kmt.450.d:0 "Вчера в районе Чапеи группой из примерно 20 человек, назвавших себя «китайскими патриотами», были проведены акты вандализма с анти-японским подтекстом, судя по всему, вызванные недавним усилением присутствия китайской армии в городе. В результате их действий местные японские предприниматели понесли большие убытки; точная сумма ущерба пока подсчитывается.\n\nЯпонское правительство потребовало от нас ареста всех виновных в течение 24 часов, и теперь этот срок истек. Однако наша полиция смогла арестовать только троих подозреваемых. Несмотря на «неэффективность» наших действий по защите имущества жителей Шанхая, иностранные державы, имеющие там свои концессии, и особенно среди них Япония, настаивают на том, что мы передали им обязанности по поддержанию порядка.\n\nВ этом случае Япония фактически получит полный контроль над Шанхаем, и это серьезно подорвет общественную поддержку нашего правительства."
  ## 12/2/2017 ##
  kmt.450.a:0 "Ерунда!"
  kmt.451.t:0 "[From.GetName] отказался отдать Шанхай"
  kmt.451.d:0 "Несмотря на наш громкий протест, [CHI.GetRulingParty] отклонил предложение наших сил взять на себя поддержание общественного порядка в Шанхае."
  kmt.451.a:0 "Как и ожидалось."
  kmt.452.t:0 "Шанхай под контролем"
  kmt.452.d:0 "После некоторых переговоров [CHI.GetAdjective] решили пойти нам на компромисс и вывести так называемые "вооруженные полицейские силы" из города. Тем временем мы разместили в городе больше войск, значительно увеличив контроль над этим районом."
  kmt.453.t:0 "Делегат из [From.GetName]"
  kmt.453.d:0 "Некоторые представители прояпонской фракции в составе [From.GetNameDef] прибыли в наш гарнизонный штаб в Тяньцзине. Они выразили обеспокоенность по поводу недавнего проникновения в регион представителей [CHI.GetRulingParty] и попросили нас вмешаться. Они передадут нам свою автономию для нашей защиты, если мы согласимся."
  kmt.453.a:0 "Отличная идея!"
  kmt.453.b:0 "Не интересно."
  kmt.454.t:0 "Вмешательство [JAP.GetAdjective]"
  kmt.454.d:0 "Правительство [JAP.GetAdjective] согласилось помочь нам, и мы передали свою автономию, как и обещали. Фракция, поддерживающая [CHI.GetRulingParty], была изгнана из региона после нескольких мелких стычек."
  kmt.454.a:0 "Хорошо сделано."
  kmt.455.t:0 "[PGR.GetName]"
  kmt.455.d:0 "По всей видимости, наша деятельность в регионе Пэйпин оказала катализирующее действие на прояпонскую фракцию в составе местного правительства. Они обменяли свою автономию на защиту японцев."
  kmt.455.a:0 "Безумие!"
  KMT_fortify_land_xiangyang_tt:0 "Добавить §Y3 сухопутных форта§! вдоль реки Хуанхэ в §YСянъяне§!\n"
  kmt.456.t:0 "Смерть Хо Ин-цзиня"
  kmt.456.d:0 "Во время своего полета в [Root.Capital.GetName] после вызова [CHI.GetLeader], Хо Ин-цзинь подвергся катастрофической судьбе, поскольку его самолет разбился на взлетно-посадочной полосе. Самолет охватило пламенем, а на месте происшествия его объявили мертвым. [CHI.GetLeader] опубликовал некролог, а похороны запланированы через несколько дней."
  kmt.456.a:0 "Миссия выполнена..."
  kmt.457.t:0 "Квантунская армия предпринимает шаги"
  kmt.457.d:0 "Мы получили информацию, предполагающую, что Квантунская армия снова действует самостоятельно, на этот раз пытаясь пригрозить китайцам войной за контроль над Северным Китаем. Однако наши шпионы в [CHI.GetName] сообщили, что их правительство приняло политику "приоритета внешней угрозы", и действия Квантунской армии, скорее всего, приведут к тотальной войне между нашими двумя нациями.\n\nВооруженные силы манипулируют всей нацией с момента убийства Цуёси Инукая, возможно, правительству пора вернуть контроль."
  kmt.457.a:0 "Милитаризм - единственное будущее для [Root.GetName]!"
  kmt.457.b:0 "Мы должны ограничить власть военных!"
  KMT_JAP_military_may_act_independently_to_declare_war_tt:0 "§RЧерез 10 дней приведет к войне с [CHI.GetName]§!\n"
  ## 26/12/2017 ##
  kmt.458.t:0 "Оклеветать коммунистов?"
  kmt.458.d:0 "Наш план пока идет по плану. Однако некоторые видные члены предлагают, чтобы мы оклеветали коммунистов и привлекли новых людей с помощью такой возможности. Для этого потребуются некоторые доказательства в поддержку наших обвинений в адрес коммунистов, а создание этих доказательств наверняка привлечет нежелательное внимание.\n\nПлан состоит в том, чтобы убить нескольких генералов, известных своими усилиями по ликвидации коммунистов. Когда работа будет выполнена, мы начнем напоминать людям, как [JAP.GetName] поддержит любые усилия против коммунизма."
  kmt.458.a:0 "Риск — это прибыль."
  kmt.458.b:0 "Давай пока что не будем привлекать к себе внимание."
  kmt.459.t:0 "Убийство генералов"
  kmt.459.d:0 "Некоторые генералы были убиты нашими агентами, а на месте преступления были удобно оставлены улики против коммунистов. Мы также использовали свои ресурсы для «создания» некоторых свидетелей. Это, несомненно, нанесет огромный удар по репутации коммунистов и ослабит их поддержку. А тем временем мы перейдем к привлечению новых людей для нашего плана."
  kmt.459.a:0 "Хорошо."
  kmt.460.t:0 "Убийство генералов НРА"
  kmt.460.d:0 "Неизвестная сторона убила некоторых генералов НРА. Однако, доказательства показывают, что это сделали мы. [Root.GetLeader] становится ясно, что кто-то пытается разрушить нашу репутацию и, возможно, получить выгоду для себя.\n\nНекоторые наши товарищи предложили провести собственное тщательное расследование. Это, возможно, не позволит найти настоящих виновных, но по крайней мере покажет, что мы не преступники."
  kmt.460.a:0 "Мы должны защитить нашу репутацию!"
  kmt.460.b:0 "Репутация переоценена"
  KMT_will_get_rid_of_bad_idea_tt:0 "§YЗапустит событие через 25 дней.§!\n"
  kmt.461.t:0 "Мы не преступники"
  kmt.461.d:0 "Отчеты наших агентов показали, что мы не причастны к убийствам и были опубликованы в наших газетах по всей стране. Хотя некоторые думают, что эти отчеты сфабрикованы, большинство, кажется, в это верит. Однако, преступник все еще скрывается в тени."
  kmt.461.a:0 "Теперь все должно вернуться в норму"
  kmt.462.t:0 "Искать поддержки у [JAP.GetAdjective]?"
  kmt.462.d:0 "Некоторые члены нашего ближайшего окружения предложили нам обратиться за поддержкой к [JAP.Capital.GetName]. Это даст нам больше ресурсов для планирования наших следующих шагов, если [JAP.Capital.GetName] согласится."
  kmt.462.a:0 "Конечно."
  kmt.463.t:0 "Прояпонские фракции в [From.GetName]"
  kmt.463.d:0 "Сегодня член про-японской фракции в [From.GetName] прибыл, чтобы встретиться с некоторыми высокопоставленными чиновниками, и запросил поддержки их планов по созданию про-японского правительства в Китае."
  kmt.463.a:0 "Звучит многообещающе"
  kmt.463.b:0 "Отвергнуть его"
  kmt.464.t:0 "[From.GetName] соглашается помочь"
  kmt.464.d:0 "[From.GetName] согласился поддержать наше дело."
  kmt.464.a:0 "Очень хорошо"
  kmt.465.t:0 "[From.GetName] отказывается помочь"
  kmt.465.d:0 "[From.GetName] отказался поддержать наше дело."
  kmt.465.a:0 "Это плохо"
  kmt.466.t:0 "Подкупить чиновников?"
  kmt.466.d:0 "С помощью японцев у нас теперь есть больше вариантов для выбора при осуществлении нашего плана. Коррупция в нынешнем правительстве процветает, а при новой финансовой поддержке мы могли бы использовать эту слабость, чтобы привлечь на свою сторону больше чиновников."
  kmt.466.a:0 "Конечно"
  kmt.467.t:0 "Инфильтроваться в правительство?"
  kmt.467.d:0 "В настоящее время у нас нет достаточной поддержки со стороны самого правительства, и без поддержки японцев мы не можем позволить себе создать больше. Однако наши люди могут попытаться проникнуть в правительство и занять некоторые важные должности. Таким образом, когда мы совершим переворот, их правительство будет в смятении."
  kmt.467.a:0 "Это жизнь или смерть."
  kmt.468.t:0 "Хо Ин-цинь"
  kmt.468.d:0 "Совершенно очевидно, что Хо Ин-цинь - оппортунист, мы можем попытаться убедить его присоединиться к нам вместе с его войсками. Таким образом, у нас будет больше людей, которые будут сражаться на нашей стороне."
  kmt.468.a:0 "Здорово"
  kmt.469.t:0 "Отправить партизан?"
  kmt.469.d:0 "День, когда мы начнем наш переворот, близок, но размеры наших войск, похоже, не очень подходят для борьбы с регулярной армией. Некоторые предлагали, что нам следует проникнуть в местную охрану в некоторых провинциях, чтобы проводить партизанскую тактику."
  kmt.469.a:0 "С этим ничего плохого не случится."
  kmt.470.t:0 "Нас поймали!"
  kmt.470.d:0 "Бюро расследований и статистики каким-то образом обнаружило наше действие и совершило налет на нашу оперативную базу. Хотя видные члены сумели сбежать с нашей базы до их прибытия, мы должны начать наш переворот сейчас!"
  kmt.470.a:0 "Чёрт!"
  kmt.471.t:0 "Вражеские партизаны"
  kmt.471.d:0 "Вражеские партизаны саботировали некоторые инфраструктуры в тылу!"
  kmt.471.a:0 "Как они туда попали!?"
  kmt.201.b:0 "Такая наглость!"
  kmt.84.t:0 "Судьба [SIK.GetName]"
  kmt.84.d_1:0 "Мы больше не можем терпеть сепаратистов в [SIK.GetNameDef], пришло время придумать решение, чтобы справиться с этими вредителями."
  kmt.84.d_2:0 "Дураки в [SIK.GetNameDef] отказались мирно сотрудничать, мы должны прибегнуть к другим средствам."
  kmt.84.a:0 "Наши военные будут идеальным решением!"
  kmt.84.b:0 "Посмотрим, сработает ли дипломатия..."
  kmt.84.c:0 "Попросите лидера нашей фракции вмешаться."
  kmt.84.e:0 "Может быть, они все-таки заслуживают своей независимости..."
  kmt.485.t:0 "[CHI.GetName] требует интеграции [SIK.GetName]"
  kmt.485.d:0 "[CHI.GetName] запросил нашу поддержку в своих усилиях по интеграции [SIK.GetName]."
  kmt.485.a:0 "Потребуйте от [SIK.GetLeader] сотрудничать, чтобы избежать кровопролития."
  kmt.485.b:0 "Потребуйте от [CHI.GetLeader] отказаться от этой идеи."
  kmt.486.t:0 "Гонцы от [From.GetName]"
  kmt.486.d:0 "[From.GetLeader] потребовал, чтобы мы мирно подчинились [CHI.GetName], чтобы избежать дальнейшего кровопролития."
  kmt.486.a:0 "Он прав, это пойдет на благо нашему народу."
  kmt.486.b:0 "Какая чушь! Мы не сдадимся без боя!"
  kmt.487.d:0 "[From.GetLeader] потребовал, чтобы мы отказались от плана по интеграции [SIK.GetName]."
  kmt.487.a:0 "Слова [From.GetLeader] не самые мудрые, а вот слова [Root.GetLeader] - мудрые!"
  kmt.487.b:0 "Не привлекайте к себе лишнего внимания."
  kmt.488.t:0 "Вмешательство [FromFrom.GetName]"
  kmt.488.d:0 "Благодаря вмешательству [FromFrom.GetName], [SIK.GetName] мирно подчинился нам."
  kmt.488.a:0 "Так или иначе, наша цель достигнута."
  kmt.489.t:0 "[SIK.GetName] выступили против"
  kmt.489.d:0 "[SIK.GetLeader] отказывается мирно подчиниться [CHI.GetName]!"
  kmt.489.a:0 "Как они смеют не следовать нашим приказам!"
  kmt.490.t:0 "[CHI.GetName] выступили против"
  kmt.490.d:0 "[CHI.GetLeader] отказывается отказываться от плана по интеграции [SIK.GetName]!"
  kmt.491.t:0 "[CHI.GetLeader] подчинился нашему приказу"
  kmt.491.d:0 "[CHI.GetLeader] отказался от плана по вторжению в [SIK.GetName]!"
  kmt.491.a:0 "По крайней мере они еще знают свое место."
  kmt.492.t:0 "[From.GetAdjective] Подкрепления"
  kmt.492.d:0 "Несмотря на упорство [SIK.GetName] в стремлении подчинить нас, [From.GetName] послали подкрепления, чтобы помочь нам."
  prc_sov_reinforcements:0 "Получить 8 дивизий от [SOV.GetName]"
  kmt.492.a:0 "Эти силы будут жизненно важны для наших усилий!"
  kmt.493.d:0 "В связи с воинственностью [CHI.GetName], [From.GetName] послали подкрепления, чтобы помочь нам."
  ## 7/1/2018 ##
  kmt.472.t:0 "Товарищи в [From.GetRulingParty]"
  kmt.472.d:0 "Несмотря на две предыдущие жестокие чистки, похоже, что в [From.GetRulingParty] все еще есть коммунисты. Теперь эти "товарищи" протянули нам руку помощи и хотят изнутри разрушить эту коррумпированную структуру."
  kmt.472.a:0 "Бесценная возможность."
  kmt.472.b:0 "Мы не можем доверять этим так называемым "товарищам"."
  kmt.473.t:0 "[From.GetName] Принято"
  kmt.473.d:0 "[From.GetName] согласились работать с нами."
  kmt.473.a:0 "Скоро правление коррумпированных [Root.GetRulingParty] закончится!"
  kmt.474.t:0 "[From.GetName] Отказано"
  kmt.474.d:0 "[From.GetName] отказались сотрудничать с нами."
  kmt.474.a:0 "Мы должны найти другой путь"
  kmt.475.t:0 "[TIB.GetName] Отсоединяется"
  kmt.475.d:0 "Под давлением [CHI.GetName], [TIB.GetName] отсоединились от нашего правления и присоединились к [CHI.GetName]!"
  kmt.475.a:0 "Мы не вынесем этого унижения!"
  kmt.475.b:0 "Мы ничего не можем сделать..."
  kmt.476.t:0 "[SOV.GetName] Принимает"
  kmt.476.d:0 "[SOV.GetName] приняли нас в [SOV.GetFactionName]!"
  kmt.476.a:0 "Вместе мы сильнее."
  kmt.477.t:0 "[SOV.GetName] Отказал"
  kmt.477.d:0 "[SOV.GetName] отклонил наш запрос на вступление в их фракцию."
  kmt.477.a:0 "Какой позор..."
  kmt.478.t:0 "[JAP.GetName] Принял"
  kmt.478.d:0 "[JAP.GetName] принял нас в [JAP.GetFactionName]!"
  kmt.479.t:0 "Наш План Компрометирован!"
  kmt.479.d:0 "Наш план был раскрыт секретными агентами правительства, и начались массовые аресты. Некоторые из наших товарищей в ответ на это начали сражаться с полицией и армией. Их основные силы успешно взяли под контроль Нанкин и вынудили бывшего главу правительства передислоцироваться в другое место. Несмотря на этот успех, бывшее правительство реорганизовалось и решило уничтожить нас."
  kmt.479.a:0 "Началась революция."
  kmt.480.t:0 "Гражданская Война!"
  kmt.480.d:0 "Хотя нашим основным ударным силам удалось оккупировать Нанкин и казнить как можно больше коррумпированных бюрократов, наиболее видным деятелям бывшего правительства удалось бежать. Теперь они восстановили свои силы и собрали свои войска, гражданская война, кажется, неизбежна."
  kmt.480.a:0 "Воля народа восторжествует!"
  kmt.481.t:0 "Вооруженный Переворот Удался!"
  kmt.481.d:0 "Наши войска оперативно уничтожили очаги сопротивления в Нанкине и его окрестностях. Бывший глава правительства сумел сесть в самолёт, ускользнув от наших преследователей, однако затем его сбили наши солдаты при помощи лёгких пулемётов. Без лидера вражеские силы вскоре были дезорганизованы, а многие из них перешли на нашу сторону."
  kmt.481.a:0 "Революция победила!"
  kmt.482.d:0 "Коммунисты и [HYQ.GetRulingParty] сражаются друг с другом, может, стоит принять чью-то сторону и забрать свою долю?"
  kmt.482.a:0 "Поддержать коммунистов"
  kmt.482.b:0 "Поддержать [HYQ.GetRulingParty]"
  kmt.483.t:0 "Требование подчинения от [From.GetName]"
  kmt.483.d:0 "[From.GetName] отправил ультиматум, в котором требует нашей мирной и безоговорочной капитуляции. В противном случае у них не останется иного выхода, кроме как сокрушить нас всей мощью своих армий."
  kmt.483.a:0 "Лучше прожить трусом, чем умереть, притворяясь героем."
  kmt.483.b:0 "Вся мощь их армий? Посмотрим..."
  kmt.484.t:0 "Подчинение от [From.GetName]"
  kmt.484.d:0 "[From.GetLeader] принял мудрое решение о мирном подчинении нам. Несмотря на то, что некоторые мятежные элементы пытаются вести партизанскую войну с нашими оккупационными силами, наш контроль над территорией теперь абсолютен."
  kmt.484.a:0 "Да здравствует [Root.GetNameDef]!"
  kmt.497.t:0 "[From.GetName] не хочет подчиняться"
  kmt.497.d:0 "[From.GetLeader] отказался подчиниться и, что достаточно высокомерно, высмеял наших военных как простых неумех. Это спровоцировало многих военных офицеров, и наш народ призывает к немедленным военным действиям против этого унижения!"
  kmt.497.a:0 "Прекрасно, они сами напросились."
  kmt.497.b:0 "Может быть... позже?"
  kmt.496.t_1:0 "Товарищи из ККП"
  kmt.496.t_2:0 "Новые члены"
  kmt.496.d_1:0 "Некоторые наши товарищи вызвались присоединиться к нашей операции в рамках [Root.GetRulingParty], чтобы продвигать наш прогресс. Однако, чтобы ввести их, может потребоваться немного дополнительных усилий..."
  kmt.496.d_2:0 "Некоторые наши товарищи смогли завербовать новых членов для нашего движения. Если мы сможем привести их к власти, это, без сомнения, принесет пользу нашему плану."
  kmt.496.a:0 "Мы всегда могли бы использовать дополнительные руки."
  kmt.496.b:0 "Эти усилия можно было бы лучше потратить в другом месте."
  ## 11/1/2018 ##
  kmt.498.t:0 "Коммунистическое движение приостановлено"
  kmt.498.d:0 "С началом текущей войны правительство выделило больше ресурсов на искоренение подрывной деятельности в стране. Мы были вынуждены приостановить наше движение, чтобы не допустить компрометации нашего плана."
  kmt.498.a:0 "Нам просто нужно подождать..."
  kmt.499.t:0 "Коммунистическое движение возобновлено"
  kmt.499.d:0 "По окончании войны мы сможем продолжить распространение нашей пропаганды."
  kmt.499.a:0 "Наконец-то."
  ## 12/1/2018 ##
  kmt.202.d_1:0 "Когда пыль гражданской войны в Китае окончательно осядет, мы выйдем победителями. [CHI.GetNameDefCap] был разбит, и теперь нам больше не нужно действовать в одиночку."
  kmt.202.d_2:0 "Когда пыль гражданской войны в Китае окончательно осядет, мы выйдем победителями. [PRC.GetNameDefCap] был разбит, и теперь нам больше не нужно действовать в одиночку."
  ## 12/2/2018 ##
  kmt.500.t:0 "[From.GetName] ищет дальнейшего сотрудничества"
  kmt.500.d:0 "[From.GetName] направил делегатов для поиска дальнейшего сотрудничества с нами."
  kmt.500.a:0 "Эта сделка выглядит заманчиво."
  kmt.500.b:0 "Им нельзя доверять."
  kmt.501.t:0 "[From.GetName] согласен на дальнейшее сотрудничество"
  kmt.501.d:0 "[From.GetName] согласился на дальнейшее сотрудничество между нами."
  kmt.501.a:0 "Замечательно!"
  kmt.502.t:0 "[From.GetName] отвергает дальнейшее сотрудничество"
  kmt.502.d:0 "[From.GetName] отказал в дальнейшем сотрудничестве между нами."
  kmt.502.a:0 "Жаль"
  kmt.504.t:0 "Окончание обучения"
  kmt.504.d:0 "Дивизии, которых мы отправили для обучения на британские территории, вернулись."
  kmt.504.a:0 "Эти войска имеют решающее значение в нашей победе в войне."
  kmt.507.t:0 "Новый маршрут поставки"
  kmt.507.d:0 "Враг [CHI.GetName] захватил Мандалай и овладел Мьичиной, практически все пути снабжения [CHI.GetName] либо отрезаны, либо находятся под обстрелом противника. Тем не менее, все еще есть одно жизнеспособное решение — воздушный транспорт по Гималаям. Хотя этот маршрут очень опасен для пилотов, поскольку ни один из наших самолетов не может находиться на такой высоте и выдерживать мороз, это единственный способ для [CHI.GetName] получить внешнее снабжение. Если [CHI.GetName] падет, нам может угрожать еще большая опасность."
  kmt.507.a:0 "Мы должны сделать все, что в наших силах."
  kmt.507.b:0 "Значение территориальной целостности [CHI.GetName] переоценено."
  kmt.508.t:0 "[From.GetName] хочет доставить припасы в [CHI.GetName] по воздуху"
  kmt.508.d:0 "[From.GetName] придумал способ доставки зарубежных припасов в [CHI.GetName], хотя на практике это очень опасно. Они решили перебрасывать припасы из Ассама в Куньмин по воздуху через Гималаи."
  kmt.508.a:0 "У них это получится."
  kmt.508.b:0 "У нас есть стратегический интерес в том, чтобы не допустить этого."
  kmt.509.t:0 "Горб"
  kmt.509.d:0 "Теперь иностранные припасы поступают по новому воздушному маршруту через Гималаи.\n\nПилоты называют новый маршрут \"Горбом\", поскольку хребты Гималаев напоминают им горб верблюда."
  kmt.509.a:0 "Тем не менее, поставки возобновились."
  kmt.510.d:0 "Теперь иностранные поставки поступают в [CHI.GetName] по новому воздушному маршруту через Гималаи.\n\nНовый маршрут получил название "Горб" среди пилотов, так как горные хребты Гималаев напоминают им верблюжий горб."
  kmt.511.t:0 "[From.GetName] отказал"
  kmt.511.d:0 "[From.GetName] отказал нам в доступе к своим авиабазам для обеспечения воздушных перевозок в [CHI.GetName]."
  kmt.511.a:0 "Что они думают?!"
  kmt.514.d:0 "Враг [CHI.GetName] захватил Мандалай и отрезал путь через Бирму. В ответ на это генерал Джозеф Стилуэлл предложил построить новую дорогу от Ледо до Куньмина, пока Мейктхила остается в дружественных руках. Этот новый путь позволит нам продолжить поддержку военных усилий [CHI.GetName]."
  kmt.514.a:0 "Одобрить предложение."
  kmt.515.t:0 "[From.GetName] хочет построить новую дорогу"
  kmt.515.d:0 "Чтобы обеспечить непрерывность поставок в [CHI.GetName], [From.GetName] решил построить новую дорогу из Ледо в Куньмин, которая будет служить новым наземным маршрутом для получения зарубежной поддержки [CHI.GetName]."
  kmt.516.t:0 "Дорога Ледо"
  kmt.516.d:0 "[USA.GetName] построила для нас новую дорогу, по которой мы будем получать иностранные поставки.\n\nПоскольку она берет начало в Ледо, ее называют дорогой Ледо."
  kmt.517.t:0 "[From.GetName] согласен."
  kmt.517.d:0 "[From.GetName] согласен на строительство новой дороги."
  kmt.517.a:0 "Это будет иметь жизненно важное значение для поддержки военных усилий [CHI.GetName]."
  kmt.518.d:0 "[From.GetName] отказал в разрешении на строительство новой дороги."
  kmt.519.d:0 "Строительство дороги Ледо теперь завершено."
  KMT_ledo_road_construction_start_tt:0 "§H Дорога Ледо будет завершена приблизительно через §! §Y2§! §H года.§!\n"
  kmt.503.t:0 "Железная дорога Юньнань-Хайфон"
  kmt.503.d:0 "Железная дорога Юньнань-Хайфон теперь работает на полную мощность и доставляет дополнительные материалы из других стран для поддержки военных действий [CHI.GetName]."
  kmt.503.a:0 "Отлично"
  kmt.523.t:0 "Бирманский путь"
  kmt.523.d:0 "Бирманский путь завершен, и из других стран поступают дополнительные материалы в [CHI.GetName] для поддержки военных действий."
  kmt.520.t:0 "Вопросы Индокитая"
  kmt.520.d:0 "Учитывая нашу нынешнюю ситуацию, наша хватка над заморскими колониями, особенно в Азии, значительно ослабла. Видя это, [CHI.GetName] предложили нам временно передать им право собственности на наши колонии в Индокитае, чтобы позволить им защищать этот регион, пока наши войска сосредоточатся на европейском театре."
  kmt.520.a:0 "Мы не можем защитить Индокитай, находясь в нашем нынешнем положении, это лучшее решение."
  kmt.520.b:0 "Мы не можем им доверять."
  kmt.521.t:0 "[From.GetName] согласился"
  kmt.521.d:0 "[From.GetName] согласился. Теперь мы контролируем Индокитай."
  kmt.521.a:0 "Очень хорошо."
  kmt.522.t:0 "[From.GetName] отказался"
  kmt.522.d:0 "[From.GetName] отказался передавать Индокитай нам."
  kmt.522.a:0 "Ладно."
  kmt.524.t:0 "Два Французских Правительства"
  kmt.524.d:0 "[FRA.GetName] теперь разделена на два враждебных правительства, оба утверждают, что они единственный законный французский орган власти. Мы должны выбрать, с кем мы наладим связь, но если мы это сделаем, то наверняка рассердим других."
  kmt.524.a:0 "Правительство [FRA.GetLeader]."
  kmt.524.b:0 "Соперник [FRA.GetLeader]."
  kmt.525.t:0 "[CHI.GetName] признал нашего врага"
  kmt.525.d:0 "[CHI.GetName] направил запрос на передачу Индокитая нашему правительству-сопернику, это бы означало, что они признали их законность как французского правительства."
  kmt.525.a:0 "Возмутительно!"
  kmt.525.b:0 "Мы ничего не можем поделать."
  kmt.526.t:0 "Протест [From.GetAdjective]"
  kmt.526.d:0 "[FRA.GetName] направила протест на наши последние дипломатические маневры."
  kmt.526.a:0 "Подумаешь"
  kmt.527.t:0 "Освободить Вьетнам?"
  kmt.527.d:0 "Колониальное правительство во Вьетнаме рухнуло после того, как все воюющие чиновники были окружены и заключены в тюрьму. Теперь мы должны решить судьбу вьетнамского народа?"
  kmt.527.a:0 "Они возьмут на себя колониальное правительство и решат свою судьбу самостоятельно!"
  kmt.528.t:0 "Освободить Камбоджу?"
  kmt.528.d:0 "После того, как кхмерские партизаны захватили колониального губернатора, когда он пытался бежать из страны, колониальное правительство рухнуло. Наши высшие чиновники теперь обсуждают, что делать с камбоджийским народом."
  kmt.528.a:0 "Камбоджей будут управлять камбоджийцы!"
  kmt.529.t:0 "Освободить Лаос?"
  kmt.529.d:0 "В отчаянной попытке удержать здание губернатора, все оставшиеся колониальные гарнизоны в Лаосе были ликвидированы, и губернатор сдался нашим силам. Теперь нужен новый лидер для Лаоса."
  kmt.529.a:0 "Мы не будем вмешиваться во внутренние дела Лаоса."
  kmt.530.t:0 "Свободный Сиам?"
  kmt.530.d:0 "Последний отряд колониальных гарнизонов в Сиаме сдался нашим силам и ознаменовал полную капитуляцию сиамского колониального правительства. Жаждущие освобождения от оков колониального правления, сиамский народ требует от нас поддержки их независимости от бывшего сюзерена."
  kmt.530.a:0 "Конечно, мы их поддержим."
  kmt.531.t:0 "Свободные Филиппины?"
  kmt.531.d:0 "После того, как колониальное правительство рухнуло на Филиппинах, наши войска взяли на себя обязанность разместить гарнизоны на островах. Хотя филиппинцы довольны нашей помощью в изгнании западных колонизаторов, местные жители предпочли бы, чтобы мы зашли еще дальше в усилиях по деколонизации."
  kmt.531.a:0 "Теперь они получат свою независимость."
  kmt.532.t:0 "Освободить Индию?"
  kmt.532.d:0 "Несмотря на то, что индийский народ находится под прямым правлением своего сюзерена, он по-прежнему придерживается сильных националистических настроений и играет большую роль в оказании помощи нашим силам в разгроме колонизаторов.\n\nНе следует ли нам освободить их страну в знак признания их храбрости и выполнить наше обещание?"
  kmt.532.a:0 "Индия больше не будет драгоценным камнем в чужой короне!"
  kmt.533.t:0 "Освободить Сиам?"
  kmt.533.d:0 "Благодаря помощи, оказанной сиамскими партизанами, колониальные гарнизоны в Сиаме были легко разбиты. Теперь духовный лидер сиамского народа, король Сиама, обратился к нашим чиновникам с просьбой выразить свое желание относительно суверенного государства Сиам.\n\nКак нам поступить?"
  kmt.533.a:0 "Теперь они будут свободны от оков колониализма!"
  kmt.534.t:0 "Освободить Филиппины?"
  kmt.534.d:0 "После нескольких успешных десантных операций на архипелаг мы создали прочные опорные пункты на Филиппинах. Местные жители более чем готовы поддержать нашу войну против колонизаторов и будут благодарны нам за то, что мы поддержали их независимость.\n\nСтоит ли нам это сделать?"
  kmt.534.a:0 "Конечно! Они станут суверенным государством."
  kmt.535.t:0 "Индийцы освобождены"
  kmt.535.d:0 "По мере продвижения наших войск на индийском театре военных действий местные жители встречают наши войска цветами, едой и возгласами. Теперь они освобождены от подлых западных колонизаторов и присоединились к [RAJ.GetNameDef]."
  kmt.536.t:0 "Сиам освобождён"
  kmt.536.d:0 "Местные жители Сиама в недавно освобождённом районе устроили грандиозную праздничную вечеринку и с радостью присоединились к [SIA.GetNameDef]."
  kmt.537.t:0 "Филиппинцы освобождены"
  kmt.537.d:0 "Филиппинцы радуются, когда их спасители — наши силы продвигаются по архипелагу. Недавно освобожденный район присоединился к [PHI.GetNameDef]."
  ## 16/3/2018 ##
  kmt.538.t:0 "[From.GetName] прекращает поддержку"
  kmt.538.d:0 "[From.GetName] отказал нам в поддержке."
  kmt.538.a:0 "Жаль"
  kmt.350.t_2:0 "Подчинение [From.GetName]"
  kmt.539.t:0 "Коммунистический переворот!"
  kmt.539.d:0 "Сегодня утром большая группа вооруженных коммунистов пробила себе дорогу в резиденцию [Roo.GetLeader] и потребовала передачи всей власти страны их лидеру. [Root.GetLeader] сейчас находится в заложниках. Если мы не подчинимся, то [Root.GetLeader] точно казнят."
  kmt.539.a:0 "Да здравствует революция!"
  kmt.539.b:0 "Лучше умереть, чем стать красным!"
  kmt.540.t:0 "[From.GetName] хочет мира"
  kmt.540.d:0 "После того как коммунисты свергли прежнее правительство, [From.GetLeader] выразил желание выйти из текущего конфликта."
  kmt.540.a:0 "Пролито слишком много крови."
  kmt.540.b:0 "Подлые ублюдки-коммуняки! Они должны погибнуть от наших рук!"
  kmt.541.t:0 "Мир с [From.GetName]"
  kmt.541.d:0 "[From.GetLeader] решил заключить с нами мир."
  kmt.541.a:0 "Фантастика!"
  kmt.542.t:0 "[From.GetName] отвергает мирное предложение"
  kmt.542.d:0 "[From.GetLeader] отверг наше мирное предложение."
  kmt.542.a:0 "Жаль."
  kmt.543.t:0 "Коммунистический переворот в [From.GetName] провалился"
  kmt.543.d:0 "Коммунистический переворот, который мы организовали в [From.GetName], провалился. Хотя их лидер был казнен после того, как местный режим отказался передать власть коммунистам, коммунисты были быстро разогнаны [From.GetAdjective] военными. Благодаря небольшому размеру [From.GetName] властям [From.GetAdjective] не составило труда найти штаб-квартиру коммунистов и провести успешный рейд.\n\nХотя все улики, указывающие на нас как на организаторов этого переворота, были уничтожены до того, как была атакована штаб-квартира, в настоящее время все поддерживаемые нами коммунисты в [From.GetName] казнены, и, возможно, пришло время для нашего прямого вмешательства."
  kmt.543.a:0 "Революция должна победить!"
  kmt.544.t:0 "Коммунистический переворот в [From.GetNameOld]"
  kmt.544.d:0 "[From.GetAdjective] коммунисты успешно взяли под контроль свою страну и объявили независимость. Как мы отреагируем?"
  kmt.544.a:0 "Раздавим этих красных паразитов!"
  kmt.544.b:0 "Власть нашей нации угасает!"
  kmt.546.d:0 "Не видя смысла в дальнейшем противостоянии с нами, [From.GetName] решил дать нашей независимости процветать и предложить нам белый мир."
  kmt.546.a:0 "Революция победила!"
  kmt.546.b:0 "Мы распространим революцию на [From.Capital.GetName]!"
  kmt.547.a:0 "Наконец-то мир."
  kmt.553.t:0 "[GER.GetName] Отзывает советника"
  kmt.553.d:0 "[GER.GetName] решил отозвать свою военную миссию."
  kmt.553.a:0 "Это не очень хорошо."
  kmt.554.t:0 "Возвращение обученных отрядов"
  kmt.554.d:0 "После обучения в лагерях [ENG.GetAdjective] наши подразделения вернулись."
  kmt.554.a:0 "Посмотрим, какие плоды принесут эти тренировки."
  kmt.555.t:0 "[From.GetLeader] призывает к созданию коалиционного правительства"
  kmt.555.d:0 "[From.GetLeader] принял решение положить конец междоусобицам и объединиться в братстве по оружию. Было предложено создать коалиционное правительство, и мы ждем ответа. Если мы отвергнем это предложение, мы можем ожидать применения силы со стороны [From.GetRulingParty]."
  kmt.555.a:0 "Звучит заманчиво."
  kmt.555.b:0 "Ерунда!"
  kmt.556.t:0 "[From.GetLeader] соглашается на формирование коалиционного правительства"
  kmt.556.d:0 "[From.GetLeader] соглашается сформировать коалиционное правительство вместе с нами."
  kmt.556.a:0 "Это должно положить конец гражданской войне."
  kmt.557.t:0 "[From.GetLeader] отказывается сформировать коалиционное правительство"
  kmt.557.d:0 "[From.GetLeader] отказался сформировать коалиционное правительство вместе с нами."
  kmt.557.a:0 "Тогда пусть говорят пушки."
  kmt.557.b:0 "Мир должен быть сохранен..."
  kmt.558.t:0 "Вернуть Индокитай [FRA.GetName]?"
  kmt.558.d:0 "Теперь, когда руки у [FRA.GetName] снова развязаны, они потребовали, чтобы мы вернули им Индокитай в соответствии с договоренностью."
  kmt.558.a:0 "Вернуть Индокитай."
  kmt.558.b:0 "Индокитай всегда был неотъемлемой частью Китая!"
  kmt.559.t:0 "[From.GetName] вернул Индокитай"
  kmt.559.d:0 "Индокитай вернулся в наши руки."
  kmt.559.a:0 "Превосходно"
  kmt.560.t:0 "[From.GetName] отказался возвращать Индокитай"
  kmt.560.d:0 "[From.GetName] заявил, что будет удерживать Индокитай, так как, согласно их словам, это всегда являлось неотъемлемой частью их территории."
  kmt.561.t:0 "Изменение наших приоритетов"
  kmt.561.d:0 "С учетом последних потрясений в [JAP.GetName] кажется, что они больше не представляют для нас угрозы. Теперь мы можем сосредоточить все свои силы на искоренении коммунистов и военачальников."
  kmt.561.a:0 "Обстоятельства складываются в нашу пользу."
  kmt.562.t:0 "Генералы переметнулись к предложению [From.GetRulingParty]"
  kmt.562.d:0 "Некоторые наши генералы покинули нас ради предложений [From.GetRulingParty]."
  kmt.562.a:0 "Это не сулит ничего хорошего."
  kmt.563.t:0 "Бывшие коммунисты влились в нашу армию"
  kmt.563.d:0 "Наши предложения привлекли значительное количество талантливых военных из высокоавтономной администрации коммунистов в [From.Capital.GetName]."
  kmt.563.a:0 "Это позволит осуществить дальнейшие планы без помех."
  kmt.564.t:0 "Замена местных чиновников"
  kmt.564.d:0 "[From.GetRulingParty] прислал чиновников, которые заменят нашу местную администрацию. Если мы позволим им это сделать, наша автономия будет утрачена."
  kmt.564.b:0 "Время готовить к бою мои пушки."
  kmt.564.a:0 "Прежде всего — гармония."
  kmt.565.t:0 "Слияние"
  kmt.565.d:0 "Бывшей высокоавтономной администрации коммунистов больше нет. Наша страна наконец объединилась под знаменем [Root.GetRulingParty]."
  kmt.565.a:0 "Слава [Root.GetName]!"
  kmt.566.t:0 "Восстание коммунистов"
  kmt.566.d:0 "Местная коммунистическая администрация мешала передаче власти в регионе. В дальнейшем это переросло в вооруженные столкновения. Милиции и регулярная армия в настоящее время ведут перестрелку в регионе."
  kmt.566.a:0 "Мы подавим это восстание."
  ## 29/07/2018 ##
  kmt.330.t:0 "Совместные исследования прекращены"
  kmt.330.d:0 "В связи с ухудшением отношений с [GER.GetNameDef] совместная исследовательская программа была прекращена."
  kmt.330.a:0 "Ничего особенного"
  kmt.331.d:0 "В связи с ухудшением отношений с [CHI.GetNameDef] совместная исследовательская программа была прекращена."
  ## 10/10/2018 ##
  kmt.12.d:0 "[From.GetName] согласилась пересмотреть линию Мак-Магона в нашу пользу. Теперь мы продвигаемся дальше на запад."
  kmt.14.d:0 "[From.GetName] отклонила наше предложение пересмотреть линию Мак-Магона. Они настаивают, что линия должна остаться неизменной."
  ## 14/10/2018 ##
  KMT_transfer_all_from_owned_indochina_states_tt2:0 "§RПередать все штаты, которыми мы владеем в Индокитае, [From.GetName]§!\n"
  KMT_transfer_all_from_owned_indochina_states_tt:0 "§G[From.GetName] передаёт нам все штаты, которыми они владеют в Индокитае§!\n"
  KMT_transfer_all_from_owned_steppe_states_tt2:0 "§RПередать все штаты, которыми мы владеем в Центральной Степи и Центральной Азии, [From.GetName]§!\n"
  KMT_transfer_all_from_owned_steppe_states_tt:0 "§G[From.GetName] передаёт нам все штаты, которыми они владеют в Центральной Степи и Центральной Азии§!\n"
  kmt.577.t:0 "[From.GetName] хочет мира"
  kmt.577.d:0 "[From.GetName] оккупировал все наши территории в Индокитае. Теперь он хочет закончить войну, при условии, что мы передадим им все наши владения в Индокитае."
  kmt.577.a:0 "Справедливая сделка"
  kmt.577.b:0 "Никогда!"
  kmt.578.t:0 "[From.GetName] согласен"
  kmt.578.d:0 "[From.GetAdjective] чиновники согласились на предложенный нами мирный договор."
  kmt.578.a:0 "Великолепно!"
  kmt.579.t:0 "[From.GetName] отказывает"
  kmt.579.d:0 "[From.GetAdjective] чиновники отклонили предложенный нами мирный договор."
  kmt.579.a:0 "Жаль"
  kmt.580.t:0 "[From.GetAdjective] некомпетентность"
  kmt.580.d:0 "Поскольку [From.From.GetName] желает расширить свое влияние в Индокитае и требует [From.GetAdjective] владений в регионе, [From.GetNameDef] решил уступить. Это означает, что теперь мы остались брошены на произвол судьбы [From.From.GetAdjective]."
  kmt.580.a:0 "Мы возьмем дело в свои руки."
  kmt.580.b:0 "Мы должны подчиниться воле нашего господина."
  kmt.581.t:0 "[From.GetName] объявляет независимость"
  kmt.581.d:0 "Возмущенный нашим решением уступить давлению, [From.GetName] сверг про-[Root.GetAdjective] правительство и основал собственное правительство. Тем самым они стали независимым государством, не находящимся в нашей сфере влияния."
  kmt.581.a:0 "Мы ничего не могли сделать, чтобы предотвратить это."
  KMT_transfer_all_fromfrom_owned_indochina_states_tt2:0 "§RПередать все принадлежащие нам штаты в Индокитае [From.From.GetName]§!\n"
  KMT_transfer_all_fromfrom_owned_steppe_states_tt2:0 "§RПередать все провинции, находящиеся в нашем владении в Центральных Степях и Центральной Азии, [From.From.GetName]§!\n"
  kmt.58.t:0 "[From.GetName] отклоняет требование"
  kmt.100.t_2:0 "Запросить у [From.GetName]"
  kmt.100.d:0 "Правительство [From.GetName] направило нам ультиматум с требованием вернуть принадлежащие им торговые порты. В случае невыполнения требований ожидаются военные действия."
  kmt.101.d:0 "Мы вернули захваченные торговые порты. Они справедливо опасаются нашей мощи!"
  kmt.102.d:0 "Эти подлые западные варвары отказались сотрудничать на мирных условиях! Наши люди, находящиеся там, вынуждены будут немного подождать."
  kmt.109.t:0 "Предложение [From.GetName]"
  kmt.109.d:0 "[From.GetName] предложил поделиться своими военными знаниями, если мы вернём захваченные торговые порты."
  kmt.109.a:0 "Здравое предложение"
  kmt.109.b:0 "Это того не стоит"
  kmt.110.t:0 "Торговые порты возвращены"
  kmt.110.d:0 "[From.GetName] принял предложение, и сделка была заключена. Захваченные ими торговые порты теперь снова официально находятся под нашим управлением."
  kmt.110.a:0 "Справедливая сделка."
  kmt.111.t:0 "[From.GetName] отказался"
  kmt.111.d:0 "Несмотря на нашу щедрость, правительство [From.GetAdjective] отклонило наше предложение и решило сохранить контроль над торговыми портами."
  kmt.111.a:0 "Неприятное разочарование"
  kmt.585.t:0 "Победа в [KMT_port.GetName]"
  kmt.585.d:0 "ОТ: [From.GetName]"
  kmt.585.d_1:0 "Из-за отсутствия естественных преград на полуострове Макао наши войска быстро заняли эту территорию. Некоторые из [KMT_defender.GetAdjective] гарнизонов смогли отступить на юг к Конселу-даш-Ильяш на паромах и установили там импровизированную береговую оборону.\n\nОднако им не удалось долго удерживать оборону из-за нехватки боеприпасов и людей.\n\nВ конечном итоге наши войска победили оставшиеся гарнизоны и сделали фотографии на фоне руин собора Святого Павла в ознаменование своей победы."
  kmt.585.d_2:0 "Поначалу наши местные гарнизоны в [From.GetName] были плохо подготовлены к вооруженному конфликту и довольно быстро отступили на Конселу-даш-Ильяш к югу от полуострова Макао. Им удалось установить импровизированную береговую оборону, чтобы сдержать натиск [KMT_attacker.GetAdjective] сил.\n\nПосле реорганизации наши местные гарнизоны смогли начать контрнаступление и, благодаря знанию планировки города, успешно вытеснили [KMT_attacker.GetAdjective] войска с полуострова Макао. Позже конфликт зашел в тупик, и с обеих сторон не наблюдалось дальнейшей военной активности."
  kmt.585.d_3:0 "Гарнизоны [KMT_defender.GetAdjective] не смогли удержать внутренние районы арендованной территории и отступили на остров Донхай. Несмотря на потери, наши войска смогли закрепиться на северо-восточной части острова Донхай и быстро разбили оставшиеся гарнизоны."
  kmt.585.d_4:0 "Первоначальная атака сил [KMT_attacker.GetAdjective] застала наш местный гарнизон в [From.GetName] врасплох. Однако наши войска смогли удержаться в форте Байярд до прибытия подкрепления. Понимая, что их внезапное нападение не достигло ожидаемого успеха, силы [KMT_attacker.GetAdjective] вскоре отступили с территории [From.GetName]."
  kmt.585.d_5:0 "Перейдя реку Шам Чунь, наши войска смогли быстро продвинуться до редута Шинг Мун, где развернулись ожесточенные бои.\n\nНесмотря на некоторые потери, оккупация Коулуна прошла довольно быстро. Однако гарнизоны [KMT_defender.GetAdjective] удерживали сильную оборонительную позицию на острове Гонконг, и прямые атаки привели к большим потерям. Небольшая группа бойцов смогла высадиться на острове, используя ночную темноту. Вскоре была установлена передовая позиция, за которой последовал быстрый разгром ошеломленного и дезорганизованного гарнизона."
  kmt.585.d_6:0 "Наши местные гарнизоны смогли удержать наступающие силы [KMT_attacker.GetAdjective] у редута Шинг Ман и около залива Тайд. Интенсивные бои истощили обе стороны.\n\nИз-за неудачи в захвате инициативы силы [KMT_attacker.GetAdjective] были вынуждены отступить и перегруппироваться. Дальнейшие атаки на оборонительные позиции [Root.GetAdjective] были начаты, но безуспешно. Большие потери и бесплодные операции в конечном итоге привели к отступлению сил [KMT_attacker.GetName] к северу от реки Шам Чун, чтобы избежать возможного политического давления."
  kmt.585.d_7:0 "Защитники [KMT_defender.GetAdjective] на западной стороне залива Цзяочжоу быстро сдались, оказавшись оттесненными на остров Дацяо, и им были перекрыты все пути отхода.\n\nНа другой стороне залива Цзяочжоу бой в городской зоне был намного ожесточеннее, но в конце концов мы одержали победу и вернули контроль над [743.GetName]."
  kmt.585.d_8:0 "Несмотря на то, что они застали наши местные гарнизоны врасплох своими атаками в [From.GetName], силы [KMT_attacker.GetAdjective] не смогли прорвать нашу внешнюю оборону. Вскоре они прекратили все военные операции, не наблюдая существенного продвижения. Позже местные власти [KMT_attacker.GetAdjective] выплатили небольшую компенсацию за этот небольшой \"инцидент\"."
  kmt.585.a:0 "Мы показали им нашу силу."
  ## 29/10/2018 ##
  kmt.586.t:0 "Поражение у [KMT_port.GetName]"
  kmt.586.d_1:0 "Нашим силам удалось отбросить местный [KMT_defender.GetAdjective] гарнизон к южной муниципалитету. Тем не менее, их оборона на побережье оказалась весьма эффективной. Наши силы не смогли укрепить позиции в этом месте, вскоре началось контрнаступление. Наши войска отступили на исходные позиции, а командование приняло решение прекратить операцию. К счастью, [KMT_defender.GetAdjective] не начали дальнейших военных действий."
  kmt.586.d_2:0 "[KMT_attacker.GetAdjective] неожиданно атаковали местный гарнизон в [KMT_port.GetName]. Вскоре нашим людям пришлось отступить из района Макао на юг, в Конселью-дас-Ильяс. Из-за нехватки боеприпасов и личного состава оборонительные укрепления оказались неэффективными в противостоянии [KMT_attacker.GetAdjective].\n\n[KMT_port.GetName] потерян."
  kmt.586.d_3:0 "Несмотря на первоначальный успех, нашим силам не удалось уничтожить гарнизон [KMT_defender.GetAdjective] в форте Байярд. Наблюдая за прибытием подкреплений [KMT_defender.GetAdjective], командование признало операцию неудачной и отдало приказ войскам отступить за пределы [KMT_port.GetName]. Судя по всему, [KMT_defender.GetAdjective] не заинтересованы в дальнейшем развитии конфликта."
  kmt.586.d_4:0 "Внутренние районы [KMT_port.GetName] стали кладбищем для [KMT_defender.GetAdjective] гарнизонов, поскольку силы противника [KMT_attacker.GetAdjective] значительно превосходили их числом. Последнее сражение местных гарнизонов произошло на острове Дунхай, где они смогли выдержать волны атак, прежде чем силы [KMT_attacker.GetAdjective] заняли позиции на северо-восточной части острова. Не имея других вариантов, [KMT_defender.GetAdjective] местные гарнизоны покинули порт на нейтральном торговом судне."
  kmt.586.d_5:0 "Продвижение через Новые территории до Битвы за редут Шин Мун шло довольно легко. Наши войска не смогли разрушить укрепления и понесли большие потери, как и другая группа, которая предприняла обходной маневр в районе Тайд-Коув. Большое количество погибших заставило наши войска отступить и перегруппироваться. Позднее были предприняты дополнительные атаки на позиции, но они не дали результатов. По мере затягивания операции высшее командование отменило миссию из-за страха международного давления.\n\n[KMT_defender.GetAdjective] не предприняли контрнаступление после того, как наши войска отступили к северу от реки Шамчунь."
  kmt.586.d_6:0 "Несмотря на то, что местные гарнизоны [KMT_defender.GetAdjective] нанесли несколько ударов по войскам [KMT_attacker.GetAdjective] в крепости Сайн Мун, позиция вскоре перешла в руки [KMT_attacker.GetAdjective] из-за отсутствия связи и слабой организации. Оставшиеся гарнизоны заняли сильную позицию на острове Гонконг и ликвидировали многочисленные попытки высадки десанта. Однако небольшой группе бойцов [KMT_attacker.GetAdjective] удалось проникнуть на остров. Наши озадаченные войска были застигнуты врасплох, затем вскоре пришли в замешательство и были разбиты в пух и прах.\n\nМы потеряли контроль над Гонконгом."
  kmt.586.d_7:0 "Даже несмотря на нашу инициативу, гарнизоны [KMT_defender.GetAdjective] в [KMT_port.GetName] имели хорошую оборону, и наши войска оказались не в состоянии прорвать их линию. Потрясенные сообщениями, командование миссии решило прекратить ее в припадке. Операция была замаскирована как просто "несчастный случай", а позже в качестве компенсации в [KMT_port.GetName] был выделен небольшой фонд."
  kmt.586.d_8:0 "Нашим войскам, дислоцированным на западной стороне залива Цзяочжоу, не удалось защитить свои позиции от штурмующих войск [KMT_attacker.GetAdjective], и вскоре они капитулировали.\n\nЖестокие уличные бои происходили на другой стороне залива, где наши местные гарнизоны сражались до последнего солдата.\n\n[KMT_port.GetName] теперь в руках [KMT_attacker.GetAdjective]."
  kmt.586.a:0 "Вопиющее!"
  kmt.587.t:0 "Тупик в [KMT_port.GetName]"
  kmt.587.d_1:0 "Битва за Макао закончилась статусом-кво между [KMT_attacker.GetAdjective] силами и [KMT_defender.GetAdjective] гарнизонами. В результате многочисленных неудавшихся десантных атак на [KMT_defender.GetAdjective] позиции на Тайпе и Колоане и неспособности [KMT_defender.GetAdjective] гарнизонов предпринять успешное контрнаступление, чтобы отбить полуостров Макао."
  kmt.587.d_2:0 "С отходом местных [KMT_defender.GetAdjective] гарнизонов на остров Дунхай [KMT_attacker.GetAdjective] войска не смогли добиться дальнейшего прогресса. Из-за страха политического давления местный командир тайно подписал перемирие, и все вернулось в состояние, предшествовавшее конфликту. Позднее непокорного командира судили за его действия."
  kmt.587.d_3:0 "Хотя наши войска встретили незначительное сопротивление, проходя через Новые территории, битва за редут Шинг Мунь стала кровопролитием. Обе стороны понесли большие потери во время боя. Считая, что миссия провалилась, командование связалось с местным правительством [KMT_port.GetName] для прекращения огня и обсуждения условий мира. Конфликт завершился отводом [KMT_attacker.GetAdjective] войск к северу от реки Шамчунь."
  kmt.587.d_4:0 "После расправы с [KMT_defender.GetAdjective] гарнизонами на западной стороне бухты Цзяочжоу [KMT_attacker.GetAdjective] на восточной стороне однако был отбит. [KMT_defender] гарнизоны затем начали реквизировать гражданские суда, чтобы достичь другой стороны залива, лишь для того, чтобы столкнуться с наземной [KMT_attacker.GetAdjective] расправой. [KMT_attacker.GetAdjective] силы вскоре скопировали методы [KMT_defender.GetAdjective], и в заливе Цзяочжоу начались сражения между солдатами на небольших кораблях.\n\nКонфликт фактически закончился после того, как гражданские лица начали отклонять запросы на реквизицию, и вскоре после этого было подписано перемирие, восстановившее состояние до конфликта."
  kmt.587.a:0 "Ну, хорошо."
  kmt.588.t:0 "[From.GetAdjective] амбиции"
  kmt.588.d:0 "Разведка показала, что [From.GetLeader] планирует отбить торговые порты. Нам еще предстоит узнать, как они достигнут своей цели, но мы должны быть готовы к тому, что результат будет вооруженным противостоянием."
  kmt.588.a:0 "Тревожно."
  ## 30/10/2018 ##
  KMT_too_low_stability_tt:0 "§RЭтот вариант доступен только потому, что стабильность ниже 25%§!\n"
  KMT_high_war_support_tt:0 "§H Этот вариант доступен, потому что поддержка войны составляет не менее 75%, а стабильность - не менее 25%§!\n"
  kmt.586.b:0 "§H Мы ничего не можем сделать§!"
  kmt.586.c:0 "§H Мы требуем возврата портов!§!"
  ## 31/10/2018 ##
  kmt.589.t:0 "[From.GetName] просит вернуть [From.From.GetName]"
  kmt.589.d:0 "После долгих дискуссий в чрезвычайном комитете, касающихся вопросов [From.From.GetName], [From.GetName] решил потребовать от нас возвращения [From.From.GetName] и немедленного полного вывода наших войск с данной территории. В ответ они закроют глаза на нашу агрессию. В противном случае, они могут использовать более радикальные меры."
  kmt.589.a:0 "Нынешний мир выглядит предпочтительнее."
  kmt.589.b:0 "Свирепый клоп все еще остается клопом."
  kmt.590.t:0 "[From.GetName] отказывается"
  kmt.590.d:0 "Ответ пришел быстро, и был он короток - всего четыре китайских иероглифа, означающих "отказываем"."
  kmt.590.a:0 "Наша тактика блефа провалилась."
  kmt.590.b:0 "Эти дикари станут куда более смиренными, когда мы усмирим их."
  kmt.591.t:0 "[From.GetName] объявляет войну"
  kmt.591.d:0 "Высокомерный [From.GetAdjective] решил решить текущий конфликт силой и кровью."
  kmt.591.a:0 "Смелость или глупость? Наверное, последнее."
  kmt.592.t:0 "[KMT_temp_port.GetName] возвращен"
  kmt.592.d:0 "[From.GetName] решил отступить и вернуть нам [KMT_temp_port.GetName]. Войска [From.GetAdjective] также покинули эту территорию."
  kmt.592.a:0 "Надеемся, что они ничего не затевают..."
  ## 01/11/2018 ##
  kmt.593.t:0 "[From.GetAdjective] нападает на [KMT_no_div_temp_port.GetName]"
  kmt.593.d:0 "[From.GetAdjective] силы пересекли границу [KMT_no_div_temp_port.GetName] и пытаются захватить эту область силой. У нас почти нет там войск, поэтому местному губернатору было разрешено набрать местных жителей для формирования сил самообороны."
  kmt.593.a:0 "Что за черт?"
  KMT_create_1unit:0 "Создать 1 отряд в [KMT_no_div_temp_port.GetName]\n"
  ## 02/11/2018 ##
  KMT_may_lead_to_war_with_FROM_tt:0 "§RМожет привести к войне с [From.GetName]!§!\n"
  KMT_no_negotiation:0 "§RНевозможно будет вести мирные переговоры до полного поражения любой из сторон!§!\n"
  kmt_sov_ref_interv_tt:0 "Создать военную цель против иностранных стран, имеющих торговые порты\n"
  kmt.160.t:0 "[From.GetName] возвращает торговые порты"
  kmt.160.d:0 "[From.GetName] принял условия и уступил все торговые порты, ранее находившиеся в их распоряжении."
  kmt.160.a:0 "Наилучший возможный исход."
  kmt.161.t:0 "[From.GetName] отказался"
  kmt.161.d:0 "Несмотря на наше присутствие, [From.GetName] все еще отказывается передать торговые порты, это презрение!"
  kmt.161.a:0 "Их конец близок!"
  kmt.162.t:0 "[From.GetName] отказался"
  kmt.162.d:0 "Несмотря на присутствие [From.From.GetAdjective], [From.GetName] все еще отказывается вернуть нам торговый порт, это презрение!"
  kmt.162.a:0 "Мы сотрем их в порошок!"
  kmt.163.t:0 "[From.GetName] покидает"
  kmt.163.d:0 "Недовольным нашим бездействием по защите их интересов, [From.GetName] покинул нашу фракцию и теперь пытается вернуть порты самостоятельно."
  kmt.163.a:0 "Наглые желтые людишки! Ничего у них без нас не получится!"
  KMT_transfer_all_from_owned_ports_states_tt2:0 "§RПередать все торговые порты, находящиеся в нашей собственности, [From.GetName]§!\n"
  KMT_transfer_all_from_owned_ports_states_tt:0 "§G[From.GetName] передаст нам все принадлежащие ему торговые порты§!\n"
  KMT_transfer_all_fromfrom_owned_indochina_states_tt2:0 "§RПередать все торговые порты, находящиеся в нашей собственности, [From.From.GetName]§!\n"
  KMT_transfer_all_fromfrom_owned_steppe_states_tt2:0 "§RПередать все принадлежащие нам торговые порты [From.From.GetName]§!\n"
  kmt.594.t:0 "[From.GetName] присылает поддержку"
  kmt.594.d:0 "Чтобы поддержать нас в нынешней гражданской войне, [From.GetName] прислал нам людей и снаряжение."
  kmt.594.a:0 "Отлично!"
  kmt.595.t:0 "Предательство [From.GetName]"
  kmt.595.d:0 "[From.GetLeader] не только не предлагает никакой помощи в этот трудный час, но и объявляет о своей независимости от нас!"
  kmt.595.a:0 "Вопиющее предательство!"
  KMT_can_deal_with_them_later_tt:0 "§YМы можем разобраться с ними после окончания гражданской войны.§!\n"
  kmt.596.t:0 "Возвращение в лоно"
  kmt.596.d:0 "После того как мы объявили о своей независимости от [From.GetName], он каким-то образом вышел победителем в гражданской войне.\n\nТеперь он требует, чтобы мы снова стали его марионеткой."
  kmt.596.b:0 "[Root.GetLeader] Защищает!"
  kmt.596.a:0 "Похоже, у нас нет другого выхода"
  kmt.597.t:0 "[From.GetName] возвращается в лоно"
  kmt.597.d:0 "Не в силах выдерживать оказанное на него давление, [From.GetName] наконец-то принял наше требование. [From.GetLeader] был вынужден уйти в отставку и был арестован за измену и отделение."
  kmt.597.a:0 "Он должен гордиться."
  kmt.598.t:0 "[From.GetName] отвергает"
  kmt.598.d:0 "Заявляя, что они скорее умрут, чем снова станут нашими подданными, [From.GetLeader] твердо заявляет, что их независимость - это свершившийся факт, и он останется таким."
  kmt.598.a:0 "Их поражение - это тоже свершившийся факт."
  kmt.599.t:0 "[From.GetName] объявляет войну"
  kmt.599.d:0 "[From.GetName] наконец-то раскрыл свою милитаристскую сущность. Его военные машины приближаются к нашим территориям и нацелены на подчинение всех жителей [Root.GetName]."
  kmt.599.a:0 "[Root.GetName] никогда не будет рабами!"
  kmt.600.t:0 "[From.GetName] требует [605.GetName]"
  kmt.600.d:0 "В ответ на угрожающих врагов [From.GetLeader] приказал перенести столицу в [605.GetName]. Однако, это потребует от нас передачи всего администрирования в этом регионе им."
  kmt.600.a:0 "Для блага народа [From.GetAdjective]."
  kmt.600.b:0 "Никогда!"
  kmt.601.t:0 "[From.GetAdjective] предательство"
  kmt.601.d:0 "Несмотря на наши недавние маневры, [From.GetLeader] решил предать нацию [Root.GetAdjective]."
  kmt.601.a:0 "Теперь они показывают свои истинные лица."
  kmt.251.t:0 "[From.GetName] соглашается"
  kmt.251.d:0 "После долгих дебатов в парламенте [From.GetLeader] и [From.GetRulingParty] наконец решили вмешаться в наш текущий конфликт с [JAP.GetNameDef]."
  kmt.251.a:0 "Отлично!"
  kmt.603.t:0 "Новый фокус [From.GetName]"
  kmt.603.d:0 "В связи с недавним переворотом в Японии [From.GetLeader] решил, что внешняя угроза для Китая исчезла, и теперь страна перенаправит больше ресурсов на поддержание внутренней стабильности. То есть само наше существование может оказаться под угрозой, мы должны быть готовы к предстоящим событиям."
  kmt.603.a:0 "Это может быть наша последняя битва."
  kmt.604.t:0 "Победа в стычках"
  kmt.604.d:0 "Наши недавние стычки с силами [From.GetAdjective] привели к победе."
  kmt.604.a:0 "Славная победа"
  kmt.605.t:0 "Поражение в стычках"
  kmt.605.d:0 "Наши недавние стычки с силами [From.GetAdjective] привели к нашему поражению."
  kmt.605.a:0 "Мы не должны позволять этому продолжаться!"
  kmt.606.t:0 "Незавершенные стычки"
  kmt.606.d:0 "Во время недавних стычек с войсками [From.GetAdjective] солдатам с обеих сторон не удалось добиться особых успехов. Обе стороны решили пока отступить."
  kmt.606.a:0 "Временная передышка."
  KMT_next_offensive_expected:0 "Центральное правительство ожидает нашего следующего наступления в ближайшее время."
  kmt.607.t:0 "Сунь Цзывэнь освобожден от должности"
  kmt.607.d:0 "Во время состоявшегося вчера совещания, созванного Фу Сынянем и включавшего таких высокопоставленных лиц, как Сун Цзывэнь, Фу представил множество доказательств коррупции Сун Цзывэня. В то время как Фу яростно перечислял проступки Сунга, тот молчал, но явно раздражался.\n\nПрежде чем Фу успел закончить, Сунь встал и быстро покинул зал заседаний, оставив за собой яростные обвинения Фу.\n\nНовость об отстранении Сун Цзывэня от должности стала главной темой сегодняшних газет."
  kmt.607.a:0 "Низвергнуть \"царственную особу\" - задача не из легких."
  kmt.608.t:0 "Отставка Куна Сянси"
  kmt.608.d:0 "Как только Кунь Сянси закончил читать свой доклад на недавнем совещании, Фу Сынянь начал нападать на Кунь Сянси в связи с его подозрительно огромным личным богатством, прежде чем представить доказательства хищений Куном. Кунь, потрясенный, попытался ответить, но оказался не ровней острой риторике Фу и достоверности доказательств.\n\nОсознав свое поражение, Кунь объявил, что уйдет в отставку с поста исполнительного директора центрального банка за свои проступки, прежде чем внимание участников совещания переключилось на другие вопросы."
  kmt.609.t:0 "Коррупция теперь под контролем"
  kmt.609.d:0 "Наша годичная кампания по борьбе с коррупцией наконец-то принесла плоды. Уровень коррупции снизился до управляемого."
  kmt.609.a:0 "Отлично!"
  kmt.610.t:0 "Гарнизон в Шанхае"
  kmt.610.d:0 "Наш гарнизон в Шанхае присоединился к нашей войне"
  kmt.610.a:0 "Тенно Хейка Банзай!"
  kmt.611.t:0 "Вражеский гарнизон в Шанхае"
  kmt.611.d:0 "Вражеский гарнизон в Шанхае начал атаковать наши войска, размещенные там!"
  kmt.611.a:0 "Проклятье!"
  kmt.612.t:0 "[From.From.GetName] присоединяется к нашей войне"
  kmt.612.d:0 "[From.From.GetName] решил мобилизовать свои военные силы, чтобы помочь нам в нашей текущей войне против [From.GetName]."
  kmt.612.a:0 "Отлично"
  kmt.613.t:0 "[From.GetName] мобилизуется против нас"
  kmt.613.d:0 "[From.GetName] решил мобилизовать свои вооруженные силы, чтобы помочь центральному правительству против нас."
  kmt.613.a:0 "Еще несколько вредителей, которых нужно истребить"
  kmt.614.t:0 "Где наши пушки?"
  kmt.614.d:0 "Во время недавней инспекции склада наши инспекторы выяснили, что заявленное количество оборудования на складе не соответствует фактическому положению вещей. Мы подозреваем, что некоторые офицеры или солдаты продавали их, чтобы получить валюту, не затронутую текущей инфляцией."
  kmt.614.a:0 "Что за черт!?"
  KMT_deal_with_inflation_to_help_tt:0 "§RИзбавьтесь от инфляции, чтобы исправить ситуацию§!"
  KMT_transfer_1percent_tt:0 "§RПередайте 3,5% вашей армии в [PRC.GetName]§!\n"
  KMT_deal_with_corruption_to_help_tt:0 "§RИзбавьтесь от коррупции, чтобы исправить ситуацию§!\n"
  KMT_no_fire_if_less_than_30_tt:0 "§HЭто событие не произойдет, если у вас не более 50 дивизий§!\n"
  KMT_receive_1percent_tt:0 "§G1% армии [From.GetName] переходит на вашу сторону§!\n"
  KMT_inflation_defectors_tt:0 "§G20% армии, 5% флота, 5% авиации [From.GetName] переходит на вашу сторону§!\n"
  kmt.615.t:0 "Дезертирство"
  kmt.615.d:0 "Некоторые наши солдаты решили предать свою страну и присоединиться к безжалостным коммунистам!"
  kmt.615.a:0 "Они ввергнут Китай в новый темный век!"
  kmt.616.t:0 "Дезертиры из [From.GetName]"
  kmt.616.d:0 "Некоторые солдаты недовольны решениями и правлением [From.GetRulingParty] и перешли на нашу сторону в нынешнем конфликте."
  kmt.616.a:0 "Их окончательное падение — это всего лишь вопрос времени."
  kmt.617.t:0 "Гиперинфляция в [From.GetName]"
  kmt.617.d:0 "Неумелое управление экономикой и коррупция со стороны [From.GetRulingParty] привели к полному краху их финансовой системы. Некоторые их солдаты решили перейти к нам из-за этого."
  kmt.617.a:0 "Их падение уже началось."
  ## 26/10/2020 ##
  kmt.618.t:0 "Ма clique Нинся"
  kmt.618.d:0 "Один из милитаристов Ма потерял все свои территории и был отстранен от власти. Теперь мы можем решить, что с ними будет дальше."
  ## 04/11/2020 ##
  kmt.622.t:0 "Встреча без прогресса"
  kmt.622.d:0 "Несмотря на наше желание сформировать коллаборационистское правительство с коммунистами, они, похоже, не разделяют нашего энтузиазма по этому поводу. Они выдвигают необоснованные требования и намеренно интерпретируют наши предложения враждебно. Многие теперь полагают, что встреча полностью провалена, и поле боя скоро станет новым местом встречи."
  kmt.622.a:0 "Эти неблагодарные бандиты!"
  kmt.623.t:0 "«Антиколониальная» война"
  kmt.623.d:0 "Провозглашая во имя антиколониализма и блага всех азиатов, [From.GetLeader] объявил нам «антиколониальную войну». Говоря, что их войска не остановятся, пока все [Root.GetAdjective] не будут изгнаны из Азии."
  kmt.623.a:0 "Подлинны ли их притязания или нет, наши интересы в Азии должны быть защищены от этих маньяков!"
  kmt.624.t:0 "Освобожденные от колониализма"
  kmt.624.d:0 "После триумфальных побед [From.GetAdjective] над злыми колонизаторами, которые ранее жестоко угнетали [Root.GetAdjective], [From.GetLeader] провозгласил успешное освобождение [Root.GetNameDef] от западного варварства."
  kmt.624.a:0 "Возможно, теперь у нас просто новое начальство."
  kmt.625.d:0 "Успешно изгнав западных дьяволов с нашей земли, [From.GetAdjective] помог интегрировать эти районы в нашу администрацию."
  kmt.625.a:0 "Фантастика!"
  kmt.626.t:0 "Мир с [From.From.GetName]?"
  kmt.626.d:0 "Учитывая, что все [From.From.GetAdjective] азиатские владения освобождены, [From.GetLeader] обсуждает возможное прекращение огня и возможный мир с колонизатором. Им нужно только наше одобрение."
  kmt.626.a:0 "Не будем переоценивать свои силы."
  kmt.626.b:0 "Все колонизаторы должны попробовать свое собственное лекарство!"
  kmt.627.t:0 "Продолжить мирные переговоры"
  kmt.627.d:0 "Все наши союзники согласились заключить мир с одним из колонизаторов. Если все пойдет хорошо, больше не нужно будет проливать кровь."
  kmt.627.a:0 "Надеемся, они знают, что для них лучше."
  kmt.628.t:0 "[From.GetLeader] отвергает мир"
  kmt.628.d:0 "Проявляя яростную ненависть к колонизаторам, [From.GetLeader] отвергает идею прекращения огня с ними. Высмеивая ее как иллюзорную и наивную и заявляя, что для решения проблемы будет достаточно лишь полного уничтожения и подчинения страны-колонизатора."
  kmt.628.a:0 "Какой революционный дух! Но, возможно, это не то, что нам нужно прямо сейчас."
  kmt.629.t:0 "Предложения мирных переговоров"
  kmt.629.d:0 "После некоторых размышлений, азиатские страны, ведущие с нами «антиколониальную войну», сейчас пытаются достичь с нами мирного соглашения. Однако для этого нам нужно будет уйти из всех наших азиатских владений."
  kmt.629.a:0 "Война проиграна."
  kmt.629.b:0 "Мы никогда не сдадимся этим варварам!"
  kmt.630.t:0 "Мир с [From.GetName]"
  kmt.630.d:0 "[From.GetLeader] согласился на наши мирные условия и вывел все свои войска с ранее колонизированных территорий."
  kmt.630.a:0 "Победа для всех азиатов!"
  kmt.631.t:0 "[From.GetLeader] отклоняет мир"
  kmt.631.d:0 "[From.GetLeader] заявил, что его правительство продолжит поддерживать текущую войну с нами."
  kmt.631.a:0 "При необходимости, мы захватим [From.Capital.GetName]!"
  ## 25/07/2021 ##
  kmt.633.t:0 "Неповиновение [SDC.GetLeader]"
  kmt.633.d:0 "На стол [Root.GetLeader] поступили доклады о предполагаемом неповиновении [SDC.GetLeader]. Якобы он отвел свои войска без разрешения, позволив нашим врагам захватить несколько ключевых районов в [597.GetName] без особого сопротивления.\n\nЕсли эти обвинения правдивы, то [SDC.GetLeader] наверняка ждет пуля в голову."
  kmt.633.b:0 "Он более полезен нам живым."
  kmt.633.a:0 "Казнить этого труса!"
  kmt.634.t:0 "Перераспределение [Root.GetLeader]"
  kmt.634.d:0 "В соответствии с недавней директивой центрального правительства, [Root.GetLeader] должен быть переведен на другую должность. Вакантное место губернатора Хунани займет Чан Чичжун."
  kmt.634.a:0 "Любопытно."
  kmt.635.t:0 "Чэн Цянь занял место губернатора"
  kmt.635.d:0 "В результате недавнего изменения политической ситуации, Чэн Цянь занял место губернатора Хунани."
  kmt.635.a:0 "Мы приветствуем генерала Чэна."
  ## 14/08/2021 ##
  kmt.636.t:0 "Переход генерала"
  kmt.636.d:0 "Недавно мы узнали, что один из наших генералов предал родину и перешел на другую сторону!"
  kmt.636.a:0 "Какой позор!"
  kmt.637.t:0 "Интеграция Хунани"
  kmt.637.d:0 "Под управлением губернатора Хо Чена провинция Хунань показала себя с лучшей стороны, выполняя все указания правительства. Это позволило нам значительно расширить наше влияние в этом регионе."
  kmt.637.a:0 "Перевести под прямой контроль Нанкина!"
  KMT_will_be_killed_tt:0 "Данные командиры частей будут казнены."
  kmt.638.t:0 "Немецкое посредничество"
  kmt.638.d:0 "По запросу японцев, немецкое правительство прислало Траутмана для организации процесса посредничества между нами и Японией."
  kmt.638.a:0 "Мы согласны."
  kmt.638.b:0 "Скажите ему, чтобы возвращался в [GER.Capital.GetName]."
  kmt.639.t:0 "[From.GetName] просит о посредничестве"
  kmt.639.d:0 "Сейчас многие в японском правительстве и армии хотели бы избежать затяжного полномасштабного конфликта с Китаем и обратились к нам с просьбой о посредничестве в текущем противостоянии с китайцами."
  kmt.639.a:0 "Очень хорошо."
  kmt.639.b:0 "Мы не будем вмешиваться."
  kmt.640.t:0 "[From.GetName] отклоняет просьбу о посредничестве"
  kmt.640.d:0 "[From.GetName] отвергли возможность посредничества."
  kmt.640.a:0 "Как жаль."
  kmt.641.t:0 "Начало посредничества"
  kmt.641.d:0 "С согласия [From.GetNameDef] Траутман приступил к посредничеству."
  kmt.641.a:0 "Отлично!"
  kmt.642.t:0 "[From.GetName] предлагает более жесткие условия"
  kmt.642.d:0 "В связи с последними изменениями в ходе войны [From.GetAdjective] посчитал предыдущие условия слишком мягкими и предложил ужесточить некоторые условия."
  kmt.642.a:0 "Империалистические ублюдки!"
  kmt.643.t:0 "[From.GetName] соглашается на условия Японии"
  kmt.643.d:0 "Представители [From.GetNameDef] приняли предложенные нами условия."
  kmt.643.a:0 "Прекрасно"
  kmt.643.b:0 "Мы передумали."
  kmt.644.t:0 "Успешное посредничество"
  kmt.644.d:0 "После согласия Китая и Японии на условия, враждебность прекратилась, и работа Траутмана выполнена."
  kmt.644.a:0 "Возможно, очередной шаткий мир..."
  kmt.645.t:0 "Посредничество провалилось"
  kmt.645.d:0 "Разногласия в условиях, выдвинутых японскими и китайскими представителями, стали еще больше, что привело к провалу посредничества. Война продолжится."
  kmt.645.a:0 "Больше ничего нельзя было сделать."
  kmt.646.t:0 "[From.GetName] выходит из переговоров"
  kmt.646.d:0 "По неуказанным причинам представители [From.GetNameDef] вышли из посредничества."
  kmt.647.t:0 "[From.GetName] проявляет враждебность"
  kmt.647.d:0 "Вопиющим образом пренебрегая условиями Токийского договора, [From.GetNameDef] отказался от дальнейшего сотрудничества с нами и немедленно прекратил выполнять свои обязательства по договору."
  kmt.647.a:0 "Неблагодарные псы!"
  ## 27/08/2021 ##
  kmt.648.t:0 "[From.GetLeader] дезертирует"
  kmt.648.d:0 "[From.GetLeader] только что перешел на сторону [PRC.GetName]."
  kmt.648.a:0 "Предатели!"
  kmt.648.b:0 "Мы приветствуем товарища [From.GetLeader]."
  kmt.649.t:0 "Стать на сторону гигантов"
  kmt.649.d:0 "Поскольку мы находимся под угрозой объявления войны иностранной державой, возможно, было бы разумно подтвердить свою приверженность одному из наших более близких и более могущественных друзей."
  kmt.649.d2:0 "[From.GetName] отклонил наше предложение."
  kmt.649.a:0 "[KMT_central_gov_tag.GetLeader] может оценить нашу лояльность."
  kmt.649.b:0 "Я верю, что [SOV.GetLeader] примет нас."
  kmt.649.c:0 "Мы можем постоять за себя."
  kmt.650.t:0 "[From.GetLeader] просит нашей помощи"
  kmt.650.d:0 "После участия в войне [From.GetLeader] связался с [Root.GetLeader] с предложением. Они поклянутся в верности нам в обмен на военную помощь против своих врагов."
  kmt.650.a:0 "Здоровое предложение."
  kmt.650.b:0 "Мы не собираемся вмешиваться в это."
  kmt.651.t:0 "[From.GetLeader] принимает"
  kmt.651.d:0 "[From.GetLeader] принял наше предложение. Теперь они помогут в нашей войне в обмен на нашу лояльность."
  kmt.651.a:0 "Мы спасены, вероятно."
  kmt.652.t:0 "[From.GetName] защищает [SIK.GetName]"
  kmt.652.d:0 "[From.GetName] принял предложение [SIK.GetLeader] о верности в обмен на военную помощь."
  kmt.652.a:0 "Это оскорбление нашим интересам!"
  kmt.653.t:0 "Опыт армейской реформы"
  kmt.653.d:0 "Поскольку центральное правительство сделало еще один шаг в реформировании армии, мы получили ценный опыт в соответствующем секторе."
  kmt.653.a:0 "Нам стоит использовать их с умом."
  kmt.655.t:0 "[From.GetName] подтверждает лояльность"
  kmt.655.d:0 "На недавней встрече лидер [From.GetNameDef] заверил [Root.GetLeader] в непоколебимой лояльности и продемонстрировал прогресс, достигнутый в деле дальнейшего объединения командования и администрации с центральным правительством.\n\nЭти изменения фактически передали им власть в подчинение [Root.Captial.GetName]."
  kmt.655.a:0 "Еще один шаг к полному объединению."
  kmt.656.t:0 "Искра революции в Китае"
  kmt.656.d:0 "Несколько часов назад, несмотря на ужасные притеснения Гоминьдана, коммунисты в Китае организовали вооруженный переворот против реакционного режима и создали народное правительство.\n\nЭта перемена событий может пойти на пользу распространению коммунизма в Азии. Мы могли бы предложить им союз и увеличить наши силы количеством, что облегчило бы сохранение Пламени Революции в Восточной Азии."
  kmt.656.a:0 "Мы станем авангардом."
  kmt.656.b:0 "Китайцы проложат путь."
  kmt.656.c:0 "Сперва мы должны добиться социализма в Японии!"
  kmt.657.t:0 "Коммунистическая угроза из Китая"
  kmt.657.d:0 "Угроза китайских коммунистов превзошла наши ожидания. Вооруженный переворот привел к тому, что красные захватили контроль над [613.GetName] и собираются распространять свои вирусы дальше.\n\nМногие в нашем правительстве обеспокоены тем, что красные китайцы станут еще сильнее, некоторые даже предлагают немедленно вмешаться силами военных, прежде чем у них появится время для передышки."
  kmt.657.a:0 "Мы не должны позволить этой опухоли расти дальше!"
  kmt.657.b:0 "Вмешательство в этот момент слишком опрометчиво!"
  kmt.658.t:0 "Солидарность коммунистов Восточной Азии?"
  kmt.658.d:0 "Видя, что наш переворот принес некоторые плоды, коммунисты в Японии протянули к нам руку. Предлагая своего рода альянс, люди в [From.Capital.GetName] кажутся полными энтузиазма и готовы внести свой вклад в сохранение революционного огня в Восточной Азии."
  kmt.658.a:0 "Мы будем стоять вместе, как братья и сестры!"
  kmt.658.b:0 "Мы никогда не забудем зверства японцев!"
  kmt.659.t:0 "Согласие [From.GetLeader]"
  kmt.659.d:0 "Наши китайские товарищи согласились заключить с нами союз!"
  kmt.659.a:0 "Kakumei banzai!"
  kmt.660.t:0 "[From.GetLeader] Отказался"
  kmt.660.d:0 "Китайцы отклонили наше предложение о союзе."
  kmt.660.a:0 "Zannen da."
  kmt.661.t:0 "Ультиматум Японии"
  kmt.661.d:0 "Наш недавний мятеж не остался незамеченным за Восточно-Китайским морем. Японский дипломат с военной свитой предъявил [Root.GetLeader] ультиматум, требуя немедленного роспуска нашего правительства и разрешения японцам назначить новую администрацию."
  kmt.661.a:0 "У нас нет иного выбора, кроме как согласиться." 
  kmt.661.b:0 "Возмутительно!"
  kmt.662.t:0 "[From.GetName] подчиняется"
  kmt.662.d:0 "[From.GetName] принял наши требования и распустил свой коммунистический режим."
  kmt.662.a:0 "Очень хорошо."
  ## 04/12/2021 ##
  kmt.663.t:0 "[From.GetName] отказывается подчиниться"
  kmt.663.d:0 "[From.GetName] отказался выполнить наш ультиматум."
  kmt.663.a:0 "Время планировать дальнейшие действия."
  kmt.664.t:0 "Коммунисты в [From.Capital.GetName]"
  kmt.664.d:0 "После недавнего переворота коммунистам удалось захватить контроль над районом вокруг [From.Capital.GetName] и сформировать администрацию. Каким будет наш ответ на сложившуюся ситуацию?"
  kmt.664.a:0 "Мы разгромим их!"
  kmt.664.b:0 "Мы примкнем к ним."
  kmt.664.c:0 "Не наше дело."
  kmt.665.t:0 "[From.GetName] объявляет нам войну"
  kmt.665.d:0 "[From.GetName] решил попытаться ликвидировать нас силой в ответ на наш переворот."
  kmt.665.a:0 "Реакционеры уже движутся против нас!"
  kmt.666.t:0 "[From.GetName] присоединяется к нам"
  kmt.666.d:0 "[From.GetName] решил присоединиться к нашему революционному движению."
  kmt.666.a:0 "Приветствуем, товарищи!"
  kmt.667.t:0 "Восстание в Восточном Хэбэе присоединяется к нам"
  kmt.667.d:0 "Подняв восстание против своего бывшего господина, повстанцы в Восточном Хофе решили присоединиться к нам."
  kmt.667.a:0 "Превосходно!"
  kmt.668.t:0 "К нам присоединяется [From.GetName]"
  kmt.668.d:0 "Видя нашу продолжительную войну, [From.GetLeader] решил, что пришло время им вмешаться и помочь в нашей борьбе."
  kmt.668.a:0 "Нам всегда может пригодиться помощь!"
  ## 01/01/2022 ##
  kmt.669.t:0 "Японцы отступают из Шанхая"
  kmt.669.d:0 "С началом гражданской войны в метрополии многие японские гарнизоны в Шанхае решили вернуться домой, чтобы поддержать свою сторону в конфликте. Их исход дал нам возможность аннулировать перемирие, подписанное после инцидента 28 января."
  kmt.669.a:0 "Несчастье японцев приносит нам удачу."
  kmt.670.t:0 "Шанхайские гарнизоны возвращаются домой"
  kmt.670.d:0 "Японский гарнизон в Шанхае вернулся на Японские острова, чтобы поддержать наших врагов. [From.GetNameDefCap] также воспользовался этим шансом, чтобы укрепить свой контроль над Шанхаем в наше отсутствие."
  kmt.670.a:0 "Мы не в состоянии опротестовать ни одно из этих решений."
  ## 16/01/2022 ##
  kmt.671.t:0 "Вмешаться в китайско-японскую войну"
  kmt.671.d:0 "Несмотря на провал конференции по договору девяти держав, китайцы продолжают сражаться. Свидетели битвы в Шанхае в Международном сеттльменте единогласно заявили, что китайские войска отважно сражались против японцев, а японские войска вели себя зверски.\n\nКонференция лишь привела к бессильному призыву к миру, но мы могли бы сделать намного больше."
  kmt.671.a:0 "Мы будем стоять вместе с китайцами!"
  kmt.671.b:0 "Мы не хотим вмешиваться. По крайней мере, пока."
  kmt.672.t:0 "[From.GetName] помогает китайцам"
  kmt.672.d:0 "Несмотря на итог конференции по договору девяти держав, [From.GetName] осудил наше \"зверство\" и решил присоединиться к китайцам в войне."
  kmt.672.a:0 "Это нарастает быстрее, чем мы ожидали."
  kmt.673.t:0 "[From.GetName] вмешивается"
  kmt.673.d:0 "Неудовлетворенный итогами конференции по договору девяти держав, [From.GetLeader] заявил, что не будет подчиняться решению и присоединится к нам на войне."
  kmt.673.a:0 "Международное сообщество на нашей стороне!"
  ## 07/03/2022 ##
  kmt.678.t:0 "Китай выдвигает требования"
  kmt.678.d:0 "Воодушевленные своим успехом в битве за Шанхай, китайцы предложили внести несколько изменений в условия продолжающегося посредничества.\n\nОни потребовали отмены всех "японских марионеточных государств" во Внутренней Монголии за пределами Маньчжоу-го и в собственно Китае. Они также категорически отклонили наше предложение об автономии для Внутренней Монголии."
  kmt.678.a:0 "Мы на время стерпим это."
  kmt.678.b:0 "Эти условия неприемлемы!"
 
 ## chi ##
  china.101.c:0 "Сначала следует понаблюдать за развитием событий."
  china.101.d:0 "Это хорошая возможность для нас."
 
 ## sunfall ##
  sfl.1.t:0 "Наисэн!"
  sfl.1.d:0 "Волнения среди общественности и некоторых чиновников достигли предела, гражданская война становится неизбежной! Хуже того, жители Тайваня и Кореи восстали, перебили всех наших местных чиновников и вернулись под власть Китая!"
  sfl.1.a:0 "Защитить императора Хирохито любой ценой!"
  sfl.3.t:0 "Корейский полуостров"
  sfl.3.d:0 "Корейский полуостров, бывший родиной династии Чосон, находился в руках Японии с 1910 года, возможно, пришло время даровать ему долгожданную независимость."
  sfl.3.a:0 "Они должны стать свободным народом!"
 ## 11/7/2016 ##
  sfl.4.t:0 "Япония возвращает территории"
  sfl.4.d:0 "После успешного переворота, осуществлённого демократами в Японии, новое правительство хочет улучшить с нами отношения, вернув земли, оккупированные прежним фашистским режимом."
  sfl.4.a:0 "Эти земли по праву наши!"
  sfl.5.t:0 "Япония демонстрирует дружбу"
  sfl.5.d:0 "После успешного переворота, осуществлённого демократами в Японии, новое правительство хочет улучшить с нами отношения, отказавшись от претензий на спорные территории между нашими двумя странами."
  sfl.5.a:0 "Они поступают мудро, отказываясь от этих земель."
  sfl.6.t:0 "Острова в море Бисмарка"
  sfl.6.d:0 "После успешного переворота, устроенного демократами в Японии, новое правительство хочет улучшить наши отношения, дав нам острова, захваченные у Германской Империи во время Первой Мировой Войны."
  sfl.6.a:0 "Мы принимаем этот жест дружбы"
  sfl_aftermath_chi_tt:0 "[Root.GetName] берёт под контроль китайские штаты, принадлежащие [JAP.GetName]"
  sfl.7.t:0 "Корея освобождена"
  sfl.7.d:0 "Корейский полуостров пал в чужие руки, и они освободили корейский народ."
  sfl.7.a:0 "Это безумие!"
  sfl.7.b:0 "У нас нет времени на эту корейскую мороку!"
  sfl.8.t:0 "Китайские территории"
  sfl.8.d:0 "Теперь, когда фашистский режим пал, падут и злодеяния, которые он совершил. Оккупация Маньчжурии - одно из них. Стоит ли нам вернуть его китайскому народу?"
  sfl.8.a:0 "[CHI.GetName] заберёт эту землю"
  sfl.8.b:0 "Мы должны порадовать коммунистический мир, иначе мы погибнем под советской пятой."
  sfl.8.c:0 "Это не наш приоритет"
  sfl.9.t:0 "Оспариваемые территории с [SOV.GetName]"
  sfl.9.d:0 "Оспариваемые территории острова Сахалин - отличная возможность угодить красному гиганту над нами и обезопасить себя."
  sfl.9.a:0 "Мы не должны приближать собственное уничтожение!"
  sfl.9.b:0 "Чушь, коммунистический мир никогда не одержит верх над миром свободы!"
  sfl.10.t:0 "Острова в Тихом океане"
  sfl.10.d:0 "[USA.GetName] - великий союзник, учитывая, что мы с ними делим идеологию. Мы должны отблагодарить их за острова, которые мы заберем у Германской империи в Первой мировой войне. Таким образом, мы получим могучую поддержку."
  sfl.10.a:0 "Настоящий союзник бесценен."
  sfl.10.b:0 "Мы в порядке сами по себе!"
  sfl.11.t:0 "Япония отказалась возвращать нам Маньчжурию"
  sfl.11.d_prc:0 "[JAP.GetName] решила вернуть оккупированные ею китайские территории [CHI.GetName]. Это унижение для нашего правительства!"
  sfl.11.d_chi:0 "[JAP.GetName] решила вернуть оккупированные ею китайские территории [PRC.GetName]. Это унижение для нашего правительства!"
  sfl.11.a:0 "Мы не потерпим этого унижения!"
  sfl.12.t:0 "Проблема с Маньчжурией была проигнорирована"
  sfl.12.d:0 "Японское правительство в [JAP.GetName] объявило, что рассмотрение вопроса о Маньчжурии отложено на неопределенный срок. Они явно не хотят возвращать эти земли!"
  sfl.12.a:0 "Если это можно терпеть, то что нельзя!" # 是可忍,孰不可忍!
  sfl.13.t:0 "Корея"
  sfl.13.d:0 "Стоит ли нам освободить корейцев и предоставить им свободу?"
  sfl.13.a:0 "Определенно"
  sfl.13.b:0 "Что за шутки"
  ## 26/8/2016 ##
  sfl.14.t:0 "Поиски мира с Осью"
  sfl.14.d:0 "Теперь, когда Япония больше не воюет с нами, исчезли причины для начала войны с нами другими странами Оси. Может, стоит поискать с ними мира вместо того, чтобы продолжать воевать."
  sfl.14.a:0 "Мы свяжемся с ними для заключения мира."
  sfl.14.b:0 "Мы можем получить какую-то выгоду в этой войне..."
  sfl.15.t:0 "[From.GetName] Призывает к миру"
  sfl.15.d:0 "Правительство [From.GetName] призвало [Root.GetLeader] к мирным переговорам, так как они больше не воюют с Японией, они считают, что у нас больше нет причин продолжать войну между нами."
  sfl.15.a:0 "Они правы, наша война закончится."
  sfl.15.b:0 "Мы сражаемся за свои интересы!"
  sfl.16.t:0 "[From.GetName] Согласен на мир между нами"
  sfl.16.d:0 "[From.GetLeader] решил, что у него больше нет причин сражаться с нами, поэтому подписал сепаратный мир между нашими нациями."
  sfl.16.a:0 "Мы признательны ему."
  sfl.17.t:0 "[From.GetName] Отклонил мирные переговоры"
  sfl.17.d:0 "[From.GetLeader] заявил, что они сражаются с нами не только как союзники Японии, но и для собственных интересов!"
  sfl.17.a:0 "Проклятая империалистическая свинья!"
  kmt_kor_north_liberated:0 "5 подразделений восстали в Пхеньяне"
  kmt_kor_south_liberated:0 "5 подразделений восстали в Сеуле"
  sfl.18.t:0 "Отчаянное положение"
  sfl.18.d:0 "После освобождения Кореи, неудачи в завоевании Китая и начавшейся гражданской войны наши силы на исходе. Император и военные решили отказаться от Континентальной политики и сосредоточиться на гражданской войне. Хотя это может быть и непростое решение, оно может быть лучшим в сложившейся ситуации."
  sfl.18.a:0 "Да, Император прав."
  sfl.18.b:0 "Какая ерунда!"
  sfl.19.t:0 "Япония добивается мира"
  sfl.19.d:0 "Неудачи Японии в войне заставили её пойти на шаг, который приведёт к отказу от континентальной политики, это значит, что она откажется от китайских территорий, чтобы сосредоточиться на своей продолжающейся гражданской войне.\n\nКак нам следует реагировать?"
  sfl.19.a:0 "В любом случае с ними покончено, незачем тратить на них время."
  sfl.19.b:0 "Временное перемирие..."
  sfl.19.c:0 "Никакой пощады псам-империалистам!"
  sfl_jap_forfeit_land:0 "[Root.GetName] захватывает китайские территории под контролем Японии\n"
  sfl_later_war_with_jap:0 "Вы можете решить начать войну с Японией через месяц. §RНезависимо от её идеологии.§!"
  sfl.20.t:0 "Мир с [CHI.GetName]"
  sfl.20.d:0 "[CHI.GetName] согласились на мир между нами."
  sfl.20.a:0 "Теперь мы можем сосредоточиться на гражданской войне."
  sfl.22.t:0 "Никакого мира с [CHI.GetName]"
  sfl.22.d:0 "[CHI.GetName] отказались от мира между нами."
  sfl.22.a:0 "Такова ли наша судьба?"
  sfl.23.t:0 "Война с Японией?"
  sfl.23.d:0 "Пора решить, объявим мы войну [JAP.GetName] или нет."
  sfl.23.a:0 "Японский народ заплатит за свои злодеяния!"
  sfl.23.b:0 "Пролито уже слишком много крови."
  sfl.24.t:0 "[CHI.GetName] объявляют нам войну!"
  sfl.24.d:0 "Китайцы разорвали перемирие и объявили нам войну!"
  sfl.24.a:0 "Грязные предатели!"
  sfl_cant_peace_with_axis_later:0 "§RВ будущем вы не сможете заключать отдельный мир с Осью.§!\n"
  ## 19/10/2016 ##
  sfl.25.t:0 "Статус Индокитая"
  sfl.25.d:0 "Как нам поступить с Индокитаем?"
  sfl.25.a:0 "[FRA.GetName] может получить его обратно."
  sfl.25.b:0 "[CHI.GetName] может получить его."
  sfl.25.c:0 "Мы оставим его себе."
  sfl.26.t:0 "[From.GetName] Передача Индокитая"
  sfl.26.d:0 "[From.GetName] принял решение передать Индокитай под наше управление."
  sfl.26.a:0 "Мудрый поступок."
  sfl.27.t:0 "[From.GetName] Игнорирование наших притязаний на Индокитай"
  sfl.27.d:0 "Несмотря на наши справедливые притязания, [From.GetName] принял решение не передавать нам Индокитай."
  sfl.27.a:0 "Тогда мы возьмём его силой."
  sfl.3.c:0 "Будет установлено марионеточное правительство, действующее в наших интересах."
  sfl.28.t:0 "Рюкю"
  sfl.28.d:0 "После того, как много лет назад они аннексировали наше королевство, японцы переименовали наш дом в Окинаву. Теперь, когда мы наконец свободны, мы должны переименовать наши города в те, что были ранее."
  sfl.28.a:0 "Отменим японские названия!"
  sfl.28.b:0 "Это потребует слишком много усилий..."
  sfl.3.b:0 "Мы оставим их японцам."
  sfl.29.t:0 "Японские острова под угрозой"
  sfl.29.d:0 "Наши враги прорвали нашу береговую оборону и высадились на Японских островах! Мы должны защищать нашу нацию до последнего солдата!"
  sfl.29.a:0 "Тенно хейка банзай!!"
 
 
 ### новостное событие ###
 kns.1.t:0 "Японская гражданская война"
  kns.1.d:0 "С неудачей в завоевании Китая приходит гнев японского народа. Эта крупная неудача Японии дала возможность демократам организовать революцию, чтобы свергнуть нынешнее фашистское правительство. С проигранной войной и недовольством народа, мечта Хирохито теперь всего лишь лопнувшие пузыри.\n\nНекоторые из союзников Японии оставили Японию на произвол судьбы, поскольку они больше не могут рассчитывать на них."
  kns.1.a:0 "Это тотальное поражение для фашистских ублюдков!"
  kns.1.b:0 "Интересное развитие событий."
  kns.1.c:0 "Наш союзник пал, мы больше не можем рассчитывать на него."
  kns.2.t:0 "Конец гражданской войны в Японии"
  kns.2.d_f:0 "Несмотря на многочисленные партизанские войны и поддержку населения, сторонники демократии были разбиты в гражданской войне в Японии. Все подозреваемые были задержаны или казнены. Чтобы стабилизировать ситуацию, император Хирохито выступил с речью перед японской общественностью, заявив, что война - их единственная судьба. Однако реакция толпы говорила об обратном."
  kns.2.d_d:0 "После нескольких часов штурма бункера императора фашистский режим сдался сторонникам демократии. После победы в гражданской войне демократический кабинет теперь пытается залечить раны, нанесенные прежним фашистским режимом. \"Мы не надеемся на прощение, но тем не менее сделаем свою часть\", - сказал один из японских демократических революционеров."
  kns.2.a:0 "Надеюсь, японцы знают, что они делают..."
  kns.3.t:0 "Падение [608.GetName]"
  kns.3.d:0 "После неудачного налёта на штаб передовой линии японцев китайцы понесли огромные потери. Чтобы предотвратить дальнейшие жертвы, китайский командир приказал войскам отступить из [608.GetName]. Позже Японская армия вошла в город с минимальным сопротивлением.\n\nЗапретный город сообщил, что японцы изъяли некоторые артефакты. К счастью, большая часть была эвакуирована на юг ещё в 1933 году. Японцам удалось вывезти лишь несколько больших бронзовых ванн и несколько орудий."
  ## 10/10/2016 ##
  kns.5.t:0 "[CHI.GetName] нарушает перемирие с [JAP.GetName]"
  kns.5.d:0 "[CHI.GetName] разорвала перемирие с [JAP.GetName] и объявила им войну. Это снова втянуло обе страны в войну, хотя на этот раз в наступление переходит [CHI.GetName]. Этот предательский поступок со стороны [CHI.GetName] вызвал обеспокоенность во всём мире."
  kns.5.a:0 "Смерть псам-империалистам!"
  kns.5.b:0 "Их воинственность ввергнет мир в новый Тёмный век!"
  ## 13/11/2016 ##
  kns.6.t:0 "[From.GetFactionName]"
  kns.6.d:0 "Сегодня азиатская политика перевернулась с ног на голову: китайские и японские дипломаты объявили о военном пакте между [CHI.GetName] и [JAP.GetName]. Они заявили, что пролито слишком много крови, в то время как есть другие силы, которые стремятся к их уничтожению.\n\n[JAP.GetName] призвала всех задуматься о том, что, вместо того чтобы ослаблять друг друга, старые враги станут ещё сильнее вместе."
  kns.6.a:0 "Ничего не угрожает [From.GetFactionName]!"
  kns.6.b:0 "Неожиданный переворот в азиатской дипломатии"
  kns.7.t:0 "[CHI.GetName] присоединяется к [From.GetFactionName]!"
  kns.7.d:0 "Китайские и немецкие дипломаты недавно подписали военный пакт в [GER.Capital.GetName], укрепив связи между двумя странами.\n\nНекоторые предполагают, что целью такого альянса является защемление [SOV.GetName], но должностные лица из [CHI.GetName] и [GER.GetName] ни подтвердили, ни опровергли это."
  kns.7.c:0 "Появляется великая держава."
  kns.8.t:0 "[GER.GetName] отвергает китайский альянс!"
  kns.8.d:0 "Отвергая [CHI.GetAdjective] дипломатические предложения, [From.GetLeader] публично объявил, что [From.GetName] не будет заключать военный пакт с [CHI.GetName]."
  kns.8.b:0 "Und doch habe ich allein..."
  kns.10.d_no_submit:0 "Несмотря на то, что [CHI.GetName] соглашается пойти на еще одну уступку [JAP.GetAdjective], некоторые местные военные деятели в северном Китае отказались передать свои территории. Некоторые опасаются, что это может привести к военным действиям со стороны правительства [JAP.GetAdjective]."
  kns.11.t:0 "Падение [863.GetName]"
  kns.11.d:0 "[863.GetName], \"Париж Востока\", наконец пал под натиском японцев после продолжительных боёв между защищающимися китайскими войсками и японскими морскими пехотинцами. Японцы также использовали морские и воздушные бомбардировки, которые нанесли колоссальные потери китайским защитникам и опустошили мегаполис.\n\nНебольшой батальон китайских войск все еще продолжал сражаться на складе Сыхан, прежде чем отступить в нейтральный Международный сеттльмент прямо через реку Сучжоу."
  ## 24/10/2020 ##
  kns.12.t:0 "Падение [613.GetName]"
  kns.12.d:0 "После успешного пересечения реки Янцзы в Пукоу, [This.GetPRCArmyName] захватил [613.GetName], бывшую столицу правительства во главе с [KMT_central_gov_tag.GetRulingParty]. Прежде чем он пал, [KMT_central_gov_tag.GetLeader] уже бежал из города вместе с другими чиновниками и основал временную столицу в [KMT_central_gov_tag.Capital.GetName].\n\n[PRC.GetLeader], получив сообщение о захвате этого важного города, публично выступил с заявлением, в котором высоко оценил это монументальное событие и заявил, что \"старое правительство Китая официально свергнуто\"."
  kns.12.a:0 "Освобождение не остановить!"
  kns.12.b:0 "Это всего лишь стратегический отход!"
  kns.13.t:0 "Падение [863.GetName]"
  kns.13.d:0 "Армия [PRC.GetName] успешно захватила Шанхай, и сумела свести к минимуму ущерб для столичного района.\n\n[This.GetPRCArmyName] быстро заблокировали реку Усун, чтобы отрезать поставки войскам [KMT_central_gov_tag.GetRulingParty]. Это оказалось очень эффективным. Позже был начат двухсторонний наступление против сил [KMT_central_gov_tag.GetName] и успешно окружил их, предотвратив дальнейшее распространение битвы, особенно в столичном районе, где [PRC.GetRulingParty] хотел бы заручиться поддержкой жителей."
  kns.14.t:0 "Падение [This.Get1047]"
  kns.14.d:0 "Несмотря на оборону, созданную вдоль железных дорог на севере [This.GetKwangtung] и личный приказ [KMT_central_gov_tag.GetLeader] усилить оборону [This.Get1047], [This.GetPRCArmyName] сумели нейтрализовать силы, защищающие железную дорогу, и взяли [This.Get1047] трехсторонним наступлением.\n\nСообщалось, что силы [KMT_central_gov_tag.GetRulingParty] были уничтожены в ходе различных сражений, происходивших в городе, выживших было мало, а [This.GetPRCArmyName] смогли спасти значительное количество техники, которую их враги оставили позади."
  kns.15.t:0 "Падение Тайваня"
  kns.15.d:0 "Удивив всех наблюдателей текущего конфликта, силы [PRC.GetName] получили контроль над Тайванем из рук [KMT_central_gov_tag.GetRulingParty], которые надеялись, что Тайвань станет островом, на который они смогут отступить, когда война на материке станет непобедимой.\n\nТеперь, когда Тайвань оказался вне их владения, [KMT_central_gov_tag.GetNameDef] будут вынуждены сражаться до последнего на материке, или, возможно, они смогут каким-то образом отбить Тайвань. В любом случае, этот поворот событий, безусловно, мрачен для [KMT_central_gov_tag.GetRulingParty]."
  kns.16.t:0 "Подел Яндзы"
  kns.16.d:0 "Хотя и ведутся дискуссии по этой теме, немногие считают, что Раздел Янцзы будет реализован. Однако в неожиданном повороте событий обе стороны китайской Гражданской войны договорились о прекращении огня и разделили Китай по реке Янцзы.\n\nМногие наблюдатели поражены, а некоторые даже сбиты с толку мотивами и причинами обеих сторон, которые остаются недоступными для общественности."
  kns.16.a:0 "Освобождение может подождать."
  kns.16.b:0 "Это даст нам драгоценное время для перегруппировки."
  ## 26/10/2020 ##
  kns.17.t:0 "Падение [605.GetName]"
  kns.17.d:0 "Центр Китая наконец-то попал в руки японцев.\n\nПровинция [This.GetSzechwan] - это место, куда вся эвакуированная с фронта промышленность Китая будет перемещена, а ее провинциальная столица -- [605.GetName] был назначен временной столицей страны в случае падения [613.GetName]. Теперь, когда регион потерян и разрушен в ходе ожесточенных боев, похоже, что Китай может быть на последнем издыхании, и не надолго."
  kns.17.a:0 "Темный день для Китая."
  kns.17.b:0 "Три Банзай за Императора!"
  kns.17.c:0 "Наш союзник держится."
  ## 02/11/2020 ##
  kns.18.t:0 "Инцидент в Чапее"
  kns.18.d:0 "После недавней серии актов вандализма в отношении японской собственности, совершенных предполагаемыми патриотичными китайцами, японское правительство потребовало при поддержке других стран Международного поселения, чтобы охрана Шанхая была передана местному японскому гарнизону.\n\nКитайское правительство решило не провоцировать Японию и вывело все свои военные и полицейские силы из мегаполиса. Это фактически отдало Шанхай под контроль Японии."
  kns.18.a:0 "Время еще не пришло."
  kns.18.b:0 "Jouhei wa bou o utsu" #上兵は謀を伐つ
  kns.19.d:0 "Несмотря на требования Японии, Китай отказался передавать ей полномочия по обеспечению безопасности в Шанхае после серии актов вандализма в отношении японской собственности в районе Чапей в Шанхае.\n\nНедавнее решение Китая нарастить свое военное присутствие в Шанхае, по-видимому, непосредственно противоречит японским интересам в этом районе, что привело к нынешней ситуации. Многие считают, что японское правительство, по крайней мере, его армия, не смирится с отказом Китая."
  kns.19.a:0 "Они больше не получат от нас ни клочка земли без боя!"
  kns.19.b:0 "Им это с рук не сойдет!"
  ## 18/06/2021 ##
  kns.20.t:0 "Японское влияние вытеснено из Суйюаня"
  kns.20.d:0 "Появились сообщения о недавней военной стычке между [MEN.GetNameDef] и местными властями в Суйюане, Китай, после поражения сил Мэнцзяна.\n\nБой начался в Хунгарте с успешной обороны со стороны Шаньси-Суйюаньской армии и последовавшей осады Пайлинмяо, которая завершилась поражением войск Мэнцзяна.\n\n[MEN.GetNameDef] потерял все свои территории в Суйюане и вынужден был отступить в провинцию Чахар, где Фу Цзои не стал вводить свои войска, опасаясь прямого вмешательства Японии."
  kns.20.a:0 "Так им и надо!"
  kns.20.b:0 "Полная катастрофа..."
  kns.20.c:0 "Победа Китая!"
  kns.20.e:0 "Незначительная неудача..."
  kns.21.t:0 "Поражение китайских войск в Суйюане"
  kns.21.d:0 "В недавнем военном конфликте в Суйюане, Китай, между [MEN.GetNameDef] и армией Шаньси-Суйюань, китайцы потерпели поражение от прояпонских сил Мэнцзяна.\n\nАрмия Шаньси-Суйюань, как сообщается, успешно удержала позиции против захватчиков из Мэнцзяна в Хунгаре, но не смогла вовремя захватить Пайлинмяо, прежде чем понесла значительные потери от рук японских бомбардировщиков. Позднее китайцы восстановили прочную оборонительную позицию вдоль Желтой реки и границы Шаньси-Суйюань. Однако большая часть Суйюань теперь находится под контролем [MEN.GetNameDef]."
  kns.21.a:0 "Мы не должны допустить, чтобы это повторилось."
  kns.21.b:0 "Мы пойдем дальше, чтобы объединить всю Монголию!"
  kns.21.c:0 "Темный день для Китая."
  kns.21.e:0 "Китайцы нам не ровня!"
  kns.22.t:0 "Перестрелки в Суйюане"
  kns.22.d:0 "Недавняя перестрелка между армией Шаньси-Суйюань и войсками Мэнцзяна в Суйюане, Китай, привела к сохранению статус-кво.\n\nПерестрелка началась с битвы в Хунгаре, которую китайцы успешно отстояли. Позже осада Пайлинмяо оказалась слишком сложной для китайских войск, затянулась на слишком долгий срок и потребовала дипломатических мер для разрешения ситуации.\n\nВ регионе было замечено незначительное изменение территории, но амбиции Японии в Китае стали еще более очевидными."
  kns.22.a:0 "Мы могли бы справиться лучше."
  kns.22.b:0 "По крайней мере, Пайлинмяо по-прежнему в наших руках."
  kns.22.c:0 "Эти японские ублюдки!"
  kns.22.e:0 "Эти пешки слишком слабы."
  kns.23.t:0 "Битва за Суйюань"
  kns.23.d:0 "Недавний военный конфликт между местными властями Суйюань и [MEN.GetNameDef] перерос в полномасштабную войну между ними.\n\nПравительства как Китая, так и Японии отказались выглядеть слабыми в конфликте в Суйюань и решили повысить ставки, что впоследствии привело к масштабной мобилизации и поддержке, выделяемой на противостояние обеими сторонами, и привело к текущей ситуации.\n\nОжидается, что это очень скоро приведет к полномасштабной войне между [KMT_central_gov_tag.GetNameDef] и [JAP.GetNameDef]."
  kns.23.a:0 "Отразите японских собак!"
  kns.23.b:0 "Мы накажем варварских китайцев!"
  kns.24.t:0 "Сианьский инцидент"
  kns.24.d:0 "После бегства Чанга в Сиань и долгих раздумий Чан и его солдаты решили похитить Чанга и заставить его изменить свою политику. Они напали на резиденцию Чанга и схватили генералиссимуса после того, как он не смог перелезть через стену.\n\nВ ответ на инцидент национальное правительство в [KMT_central_gov_tag.Capital.GetName] решило договориться с мятежным Чаном, вырвав контроль у другой группировки, выступающей за военные действия. Инцидент в конечном итоге привел к мирному урегулированию, когда Чан был освобожден, а его внимание сместилось в сторону внешних угроз."
  kns.24.a:0 "Коммунисты по-прежнему представляют большую угрозу."
  kns.24.b:0 "Героический поступок Чана!"
  kns.24.c:0 "К счастью, он решен мирным путем."
  kns.24.e:0 "Мы должны изменить нашу политику соответственно."
  kns.25.t:0 "Мятеж в Сиане"
  kns.25.d:0 "После того, как Чан Кайши был вынужден бежать в Сиань и после долгих раздумий, Чжан со своими солдатами решил схватить его и вынудить изменить политику. Они ворвались в резиденцию Чан Кайши и поймали генералиссимуса после того, как тот попытался перелезть через стену.\n\nВ ответ на этот инцидент национальное правительство в [KMT_central_gov_tag.Capital.GetName] решило предпринять военные действия против военачальника, отстранив от дел другую фракцию, которая выступала за переговоры. Бунтующий военачальник был быстро уничтожен центральным правительством, а Чан Кайши был освобожден, решив в дальнейшем уделять больше внимания внутренней стабильности."
  kns.25.a:0 "Это доказывает, что внутренняя стабильность должна иметь более высокий приоритет."
  kns.25.b:0 "Чжан — герой всех китайцев!"
  kns.25.c:0 "К счастью, Чан Кайши спасён."
  kns.26.t:0 "Китай погружается в гражданскую войну"
  kns.26.d:0 "После похищения Чан Кайши Чжан Сюэляном в попытке принудить его изменить политику центральное правительство приняло решение ответить военными действиями. Однако часть офицеров внутри [ZXL.GetNameDef] решили казнить Чан Кайши, сочтя, что его ценность в качестве заложника исчерпана, а также считая, что его не следует оставлять в живых из-за большой опасности.\n\nСмерть генералиссимуса привела к образованию пустоты власти внутри национального правительства. Две главные фракции, одна во главе с бывшим военным губернатором Фэн Юйсяном, а другая во главе с Хо Инцинем, ныне соревнуются за право занять место главы национального правительства. Эта борьба за власть уже привела к открытой вражде между сторонниками двух этих фракций, спровоцировав крупномасштабную гражданскую войну внутри Китая."
  kns.26.a:0 "Еще одна масштабная смута в Китае."
  kns.27.d:0 "После бегства Чан Кайши в Сиань и после длительных обсуждений Чжан и его солдаты решили похитить Чан Кайши и принудить его изменить политику. Они ворвались в резиденцию Чан Кайши и поймали генералиссимуса, когда тот пытался перелезть через стену.\n\nВ ответ на данный инцидент национальное правительство в [KMT_central_gov_tag.Capital.GetName] приняло решение предпринять военные действия против военного губернатора. Однако, вопреки всем ожиданиям, военному губернатору удалось победить в сражении с армией центрального правительства и добиться выполнения своих требований.\n\nЧан Кайши был освобожден и впоследствии, хотя и с большой неохотой, изменил национальный курс, сделав главным приоритетом противодействие внешним угрозам."
  kns.27.a:0 "Мы разберемся с этим предателем позже."
  kns.27.b:0 "Чан реабилитировал себя этим героическим поступком!"
  kns.27.c:0 "Тем не менее кризис разрешился в нашу пользу."
  kns.28.t:0 "Коммунистический переворот в Китае"
  kns.28.d:0 "Неожиданно подпольным коммунистам, оставшимся в составе Гоминьдана, удалось собрать достаточно сторонников, чтобы свергнуть прежнее правительство и установить в Китае коммунистический режим.\n\nЧиновники прежнего правительства либо бежали, либо были казнены как враги рабочего класса. Остаткам прежнего режима не удалось сформировать надлежащего сопротивления новой красной власти, и они были быстро разбиты и ликвидированы новой Народной армией."
  kns.28.a:0 "За революцию!"
  kns.28.b:0 "Чума коммунизма слишком сильно поразила Китай."
  kns.29.t:0 "Коммунистический военный переворот в Китае"
  kns.29.d:0 "Неожиданно подпольным коммунистам, оставшимся в составе Гоминьдана, удалось собрать достаточно сторонников, чтобы свергнуть прежнее правительство и установить в Китае коммунистический режим.\n\nЧиновники прежнего правительства в основном бежали от коммунистических преследований и восстановили свою администрацию в другом месте. Организованное сопротивление красному захвату сформировалось и начинает насильно возвращать себе национальное руководство. Гражданская война между новорожденной коммунистической администрацией и бывшим правительством представляется неизбежной."
  kns.29.a:0 "За революцию!"
  kns.29.b:0 "Раздавить коммунистов!"
  kns.30.t:0 "Прояпонский военный переворот в Китае"
  kns.30.d:0 "В последнее время прояпонская фракция в составе китайского руководства осуществила военный переворот с целью захвата власти.\n\nПрояпонская фракция успешно создала временное правительство в [KMT_central_gov_tag.Capital.GetName] и готовится к любому контрнаступлению со стороны предыдущего режима. Предшествующее правительство перегруппировалось после переворота и в настоящее время планирует вернуть свое место силой.\n\nСторонники обоих правлений выбрали свою сторону и наращивают военную мощь для, казалось бы, неизбежной гражданской войны."
  kns.30.a:0 "Мы победим!"
  kns.30.b:0 "Раздавить предателей!"
  kns.30.c:0 "Мы желаем им удачи."
  ## 24/07/2021 ##
  kns.31.t:0 "Падение Уханя"
  kns.31.d:0 "Город Ухань, родина Синьхайской революции, крупный экономический центр и важный железнодорожный узел, пал под натиском японской армии.\n\nПосле длительных боев китайцы эвакуировались из города, получив достаточно времени для перемещения важных военных и государственных объектов.\n\nУвидим, осуществится ли надежда японского правительства заставить [KMT_central_gov_tag.GetNameDef] капитулировать, захватив Ухань."
  kns.32.t:0 "Падение [This.Get1047]"
  kns.32.d:0 "В попытке перекрыть поставки из-за границы в поддержку военных усилий Китая японцы предприняли наступление на портовый город. В связи с переброской местных сил на поддержку фронта в другом месте они встретили слабое сопротивление, и вскоре провинциальная столица [This.GetKwangtung] пала под натиском японских военных сил.\n\nС захватом города железная дорога Кантон-Ханькоу частично оказалась под контролем японцев, что значительно затруднило военные действия Китая."
  kns.33.t:0 "[KMT_central_gov_tag.GetName] возвращает контроль над [613.GetName]"
  kns.33.d:0 "После падения в руки [PRC.GetName] бывшая и нынешняя столица [KMT_central_gov_tag.GetName] была отбита обратно.\n\n[This.GetPRCArmyName] заняли оборонительную позицию во Дворце президента и вокруг него, и разгорелись ожесточённые бои. Однако коммунисты не смогли удержать свои позиции, и большинство отступило через реку Янцзы.\n\nВскоре древняя столица полностью перешла под контроль [KMT_central_gov_tag.GetName], и всё больше опорных пунктов коммунистов уничтожаются и искореняются."
  kns.33.b:0 "Смерть коммунистическим бандитам!"
  kns.33.a:0 "Плод Революции в опасности!"
  kns.34.t:0 "[KMT_central_gov_tag.GetName] возвращает контроль над [608.GetName]"
  kns.34.d:0 "Древняя имперская столица [608.GetName] освобождена или пала под натиском сил [KMT_central_gov_tag.GetNameDef].\n\nСили [KMT_central_gov_tag.GetNameDef] быстро захватили городские районы и продолжили преследовать коммунистов, отступивших в сельскую местность.\n\nНа площади Тяньаньмэнь в ознаменование успешной военной операции был вывешен огромный портрет Чан Кайши."
  kns.35.t:0 "[KMT_central_gov_tag.GetName] отвоевал Ухань"
  kns.35.d:0 "После нескольких кровавых сражений в Ухане силы [KMT_central_gov_tag.GetNameDef] успешно отвоевали железнодорожный узел у коммунистов.\n\nВо время хаотичных столкновений силы [KMT_central_gov_tag.GetNameDef] и [This.GetPRCArmyName] неоднократно переходили из стороны в сторону вдоль реки Янцзы. Сейчас, несмотря на изгнание коммунистов из города, многие оставшиеся силы все еще создают проблемы и наносят потери своим идейным врагам."
  kns.36.t:0 "Падение Уханя"
  kns.36.d:0 "Город Ухань, место начала Синьхайской революции, был взят войсками [This.GetPRCArmyName] у националистов.\n\nВзяв [This.Get7167], [This.GetPRCArmyName] начали готовиться к форсированию реки Янцзы. Защитники, расположившиеся на другой стороне, не смогли сдержать натиска коммунистов и продолжили отступать из города, сопровождаемые массовым дезертирством и переходом на другую сторону.\n\nСейчас железнодорожный узел находится в крепкой хватке у [PRC.GetNameDef]."
  kns.37.t:0 "Падение [This.Get6638]"
  kns.37.d:0 "[This.Get6638], административный центр провинции [283.GetName], был захвачен китайскими коммунистами.\n\nВойска [This.GetPRCArmyName] захватили древние городские ворота на западе и мосты, ведущие из города, тем самым отрезав защитников. В результате завязались ожесточенные ближние бои между коммунистическими силами и защитниками. Через несколько часов город был полностью занят.\n\nПоскольку коммунистические силы продолжают расширяться в направлении северо-запада, контроль [KMT_central_gov_tag.GetName] над регионом стремительно рушится."
  kns.38.t:0 "Падение Хайнаня"
  kns.38.d:0 "Ликующие толпы празднуют, когда [This.GetPRCArmyName] входит в город [This.Get1070].\n\nНесмотря на надежды [KMT_central_gov_tag.GetLeader] на то, что пролив Лейчжоу остановит коммунистические силы от дальнейшего продвижения на юг, [This.GetPRCArmyName] выдержал и организовал множество успешных скрытых десантных штурмов на остров. Обеспечив свой плацдарм, основная часть сил вторжения высадилась и успешно вытеснила с острова все силы [KMT_central_gov_tag.GetNameDef]."
  kns.39.t:0 "[KMT_central_gov_tag.GetName] отвоевывает [This.Get1047]"
  kns.39.d:0 "Торговый портовый город [This.Get1047] снова перешел под контроль [KMT_central_gov_tag.GetName] после того, как коммунистические силы были изгнаны.\n\nБорьба за город была настолько ожесточенной, что бои перекинулись на несколько соседних городов в дельте реки Перл, так как это позволило бы контролирующему город доступ к стратегически важной железной дороге [This.Get1047]-[This.Get7167].\n\nВ конце концов город пал в руки [KMT_central_gov_tag.GetKMTArmyName], и городская администрация объявила военное положение для уничтожения любого оставшегося коммунистического сопротивления. В честь успешной операции состоялся военный парад."
  kns.40.t:0 "Падение [This.Get12356]"
  kns.40.d:0 "Горный оплот [PRC.GetRulingParty] был окончательно захвачен [KMT_central_gov_tag.GetKMTArmyName].\n\n[PRC.GetLeader] был эвакуирован заранее вместе с другими партийными чиновниками. Нескольким ротам из [This.GetPRCArmyName] было приказано остаться и защищаться, а также начать партизанские действия, когда представится такая возможность. Защитники не смогли противостоять наступающим [KMT_central_gov_tag.GetKMTArmyName] и вскоре рассеялись в дикой местности.\n\nНа данный момент бывшая штаб-квартира [PRC.GetRulingParty] остается под контролем [KMT_central_gov_tag.GetRulingParty]."
  kns.41.t:0 "Падение [This.Get11771]"
  kns.41.d:0 "Всего несколько часов назад [This.GetPRCArmyName] захватил город [This.Get11771].\n\nКоммунистические силы быстро отрезали все возможные пути отступления для защитников [This.Get11771] и захватили все близлежащие аэропорты и железнодорожные станции, тем самым перекрыв поставки. Видя свои большие потери в боях в сельской местности и неспособность защититься от наступающих [This.GetPRCArmyName], защитники города решили сдаться.\n\nС захватом города коммунисты, похоже, прочно взяли Маньчжурию в свои руки."
  kns.42.t:0 "Падение [608.GetName]"
  kns.42.d:0 "Древняя столица [608.GetName] захвачена наступающей армией [This.GetPRCArmyName].\n\nПосле кровопролитных боев на подступах к городу между двумя противоборствующими силами защитники решили сдаться в плен [This.GetPRCArmyName].\n\nПотеря [608.GetName] означает очередное поражение [KMT_central_gov_tag.GetName] в Северном Китае."
  kns.43.t:0 "Провозглашение [PRC.GetName]"
  kns.43.d_pk:0 "Во время торжественной церемонии на площади Тяньаньмэнь председатель [PRC.GetRulingParty], [PRC.GetLeader], объявил о создании [PRC.GetName].\n\n\"Дорогие товарищи! Сегодня я официально объявляю об образовании Китайской Народной Республики и ее Центрального народного правительства!\" - объявил [PRC.GetLeader] с трибуны ворот Тяньаньмэнь, после чего был исполнен государственный гимн. После официального объявления толпа взорвалась ликованием, а в ознаменование этой вехи в истории Китая состоялся военный парад."
  kns.43.d_nk:0 "Во время внеочередного совещания с высокопоставленными функционерами партии в Президентском дворце [613.GetName], председатель [PRC.GetRulingParty], [PRC.GetLeader], объявил о создании [PRC.GetName].\n\n«Дорогие товарищи! Сегодня я торжественно объявляю об официальном образовании Китайской Народной Республики и ее Центрального народного правительства!» — заявил [PRC.GetLeader] в микрофоны, радиоэфир и громкоговорители. Собравшаяся около Президентского дворца толпа, после исполнения нового государственного гимна, разразилась ликованием и бросилась на площадь Барабанной башни, где впервые в истории новой республики прошел военный парад."
  kns.43.d_default:0 "В штаб-квартире [PRC.GetRulingParty], [PRC.GetRulingParty], председатель партии объявил по радио об образовании [PRC.GetName].\n\n«Дорогие товарищи! Сегодня я торжественно объявляю об официальном образовании Китайской Народной Республики и ее Центрального народного правительства!» — заявил [PRC.GetLeader] по радио. Собравшиеся у штаб-квартиры партии стояли в торжественном молчании, пока звучал государственный гимн, и затем бросились к месту проведения назначенного в честь такого значимого события военного парада."
  kns.43.a:0 "Народ поднялся!"
  kns.43.b:0 "Марионетка Коминтерна!"
  kns.43.c:0 "Свиньи-ревизионисты!"
  kns.43.e:0 "Пролетарии всех стран, соединяйтесь!"
  kns.43.f:0 "Язва коммунизма распространяется!"
  kns.43.g:0 "Мы вырежем эту опухоль с лица земли!"
  kns.44.t:0 "Конференция Договора девяти держав"
  kns.44.d:0 "В отношении недавнего конфликта между Японией и Китаем подписанты Договора девяти держав провели конференцию в Брюсселе, Бельгия. Япония, однако, заявила, что недавний конфликт не связан с Договором, и не направила представителя.\n\nКак и ожидало большинство, конференция не принесла никаких значительных результатов, кроме заявления, в котором участники решительно подтверждают принципы Договора девяти держав и решительно призывают к прекращению боевых действий. Затем конференция была отложена на неопределенный срок."
  kns.44.a:0 "Разве Договор не был бесполезным клочком бумаги с 1931 года?"
  kns.45.t:0 "Посредничество Траутманна неуспешно"
  kns.45.d:0 "Несмотря на усилия германского посла Оскара Траутманна, посредничество между Китаем и Японией в их нынешнем конфликте оказалось неудачным.\n\nПоскольку единственной причиной, названной японскими представителями, было: "Мы больше не будем считать правительство во главе с [KMT_central_gov_tag.GetLeader] объектом переговоров", многие пытаются раскрыть очевидные скрытые причины этого неудачного мирного разговора.\n\nЭти две восточноазиатские страны останутся врагами в обозримом будущем."
  kns.45.a:0 "Мы выполнили свою часть."
  kns.45.b:0 "Мы победим несмотря ни на что!"
  kns.45.c:0 "Ничего страшного."
  kns.46.t:0 "Токийский договор"
  kns.46.d:0 "При посредничестве немецкого посла Оскара Траутмана китайское и японское правительства достигли соглашения по текущему конфликту. Военные действия прекращены, а ходят слухи о сотрудничестве двух стран против коммунизма.\n\nОднако некоторые эксперты заявляют, что японская сторона получила значительно больше преимуществ, чем китайская. Некоторые даже называют новый «Токийский договор» очередным неравным договором, навязанным Китаю."
  kns.46.a:0 "Превосходно!"
  kns.46.b:0 "Это меньшее из зол."
  kns.46.b2:0 "Это измена!"
  kns.46.c:0 "Наилучший из возможных исходов."
  ## 25/08/2021 ##
  kns.47.t:0 "Франко-тайская война"
  kns.47.d:0 "Увидев многочисленные уступки, сделанные правительством Французского Индокитая после падения Франции, правительство Сиама решило, что хочет получить свой кусок индокитайского пирога.\n\nАтаковав через Лаос и Камбоджу, правительство Сиама, похоже, хочет вернуть территории, потерянные в предыдущих конфликтах с французами. С другой стороны, французские силы в Индокитае, похоже, плохо подготовлены к конфликту. Без помощи метрополии и ограниченных ресурсов многие считают, что французы не смогут долго сдерживать сиамцев."
  kns.47.a:0 "За нацию, религию, монархию и народ!"
  kns.47.b:0 "Да будут прокляты эти стервятники!"
  kns.47.c:0 "Унизительно!"
  ## 16/01/2022 ##
  kns.48.t:0 "Иностранное вмешательство в китайско-японскую войну"
  kns.48.d:0 "Игнорируя результаты конференции "Девяти держав", [From.GetLeader] объявил(а), что предпримет военные действия против [JAP.GetNameDef] с целью поддержания [KMT_central_gov_tag.GetNameDef] в их войне сопротивления и для поддержания порядка и справедливости.\n\n[JAP.GetAdjective] правительство выразило разочарование в радикальном подходе правительства [From.GetAdjective] и заявило, что не даст себя запугать. С другой стороны, правительство [KMT_central_gov_tag.GetAdjective] приветствует вступление [From.GetAdjective] в войну и призывает другие страны увидеть истинный цвет [JAP.GetAdjective] империализма.\n\nНесмотря на это, это знаменует собой радикальное изменение в мировой политике, и некоторые даже прогнозируют, что в войну вмешаются и другие страны."
  kns.48.a:0 "Империалистам не одолеть свободные народы!"
  kns.48.b:0 "Этих варваров надо проучить!"
  kns.48.c:0 "Что за беспорядок."
  ## 18/01/2022 ##
  kns.10.a:0 "Для начала нам надо стабилизировать внутреннюю обстановку."
  kns.10.b:0 "Очень мудрое решение."
  kns.10.c:0 "Мы скорее умрем, чем позволим японцам править нами!"
  kns.10.e:0 "Сложная ситуация."
  kns.10.f:0 "Японские империалисты должны умереть!"
 
 
 
 ### jap events ###
  jap.1.t:0 "Кодоха совершил военный переворот!"
  jap.1.d:0 "Напряжённое политическое соперничество привело к серии убийств политиков по всей стране. Кодоха, мозговой центр, стоящий за всеми этими действиями, стремится уничтожить своих соперников, Тосэйха, полагая, что их ориентированный на парламент метод является лишь обузой для правления императора. Теперь император признал событие и публично заявил, что..."
  jap.1.a:0 "...Насильственная практика Кодохи должна быть немедленно прекращена!"
  jap.1.b:0 "...граждан призывают поддержать Кодоху в возвращении власти императору."
  jap.2.t:0 "Taisei Yokusankai"
  jap.2.d:0 "Был создан Taisei Yokusankai, организация, нацеленная на поддержку правления императора."
  jap.2.a:0 "Нихон банзай!"
 
 ### События Цзютгуай ###
  jyutgwai.1.t:0 "Смерть Ху Ханьминя"
  jyutgwai.1.d:0 "Ху Ханьминь, один из ранних правых консервативных лидеров Гоминьдана в революционном Китае, к сожалению, скончался. Его похороны должны состояться через 5 дней. Ожидается, что на похоронах будет присутствовать множество важных деятелей, включая Чан Кайши."
  jyutgwai.1.a:0 "Его деяния не будут забыты."
  jyutgwai.2.t:0 "Похороны Ху Ханьминя"
  jyutgwai.2.d:0 "После смерти Ху Ханьминя его похороны состоятся несколько дней спустя. Чан Кайши запланировал встретиться там с [YUT.GetLeader] и попросить его помочь уничтожить новую клику Гуанси вместе со своими политическими соперниками Ли Цзунжэнем."
  jyutgwai.2.a:0 "Надёжный план."
  jyutgwai.2.b:0 "Такой подход не нужен, наша армия сделает эту работу."
  jyutgwai.2.c:0 "Такое предложение не в интересах [Root.GetRulingParty]."
  jyutgwai.3.t:0 "Предложение Чан Кайши"
  jyutgwai.3.d:0 "После встречи с [CHI.GetLeader] на похоронах Ху Ханьмина [Root.GetLeader] получил предложение, или, как некоторые бы сказали, ультиматум. Суть его в том, чтобы просить нашей помощи в уничтожении клики [GXC.GetLeader]. [Root.GetLeader] опасается, что если Новая Гуансийская клика будет уничтожена, его клика вскоре последует за ней."
  jyutgwai.3.a:0 "Обратитесь к [GXC.GetLeader] с предложением об едином фронте!"
  jyutgwai.3.b:0 "Мы возьмем Нанкин и свергнем режим [CHI.GetLeader]!"
  jyutgwai.3.c:0 "Подчинитесь, пока не стало слишком поздно!"
  jyutgwai.4.t:0 "Предложение от [YUT.GetLeader]"
  jyutgwai.4.d:0 "[YUT.GetLeader] раскрыл план [CHI.GetLeader] уничтожить нашу клику. Однако, опасаясь, что в случае нашего уничтожения они скоро последуют за нами, теперь они ищут союз с нами вместо того, чтобы помогать [CHI.GetRulingParty]."
  jyutgwai.4.a:0 "Мы будем вместе противостоять такой тирании."
  jyutgwai.4.b:0 "Они просто тянут нас за ногу."
  jyutgwai.5.t:0 "Альянс принят"
  jyutgwai.5.d:0 "[GXC.GetLeader] принял наше предложение о союзе и теперь готовит свои войска!"
  jyutgwai.5.a:0 "Смерть [CHI.GetLeader]!"
  jyutgwai.6.t:0 "Альянс отклонен"
  jyutgwai.6.d:0 "[GXC.GetLeader] отклонил наше предложение о союзе!"
  jyutgwai.6.a:0 "Как они могли!"
  jyutgwai.7.t:0 "[YUT.GetName] отказывается подчиняться"
  jyutgwai.7.d:0 "[YUT.GetLeader] отказался помочь нам уничтожить клику [GXC.GetLeader]!"
  jyutgwai.8.t:0 "Юй Хань-моу"
  jyutgwai.8.a:0 "Помочь Чэнь Ци-тану бежать в Гонконг!"
  jyutgwai.8.b:0 "Убедить Чэнь Ци-тана присоединиться к новой клике Гуанси!"
  jyutgwai.9.t:0 "Новая клика Гуанси"
  jyutgwai.9.d:0 "С уходом Чэнь Ци-тана и его мятежным поведением с нашей точки зрения остаются только [GXC.GetLeader] и его люди."
  jyutgwai.9.a:0 "Сначала попробуйте подкупить [GXC.GetName]."
  jyutgwai.9.b:0 "Мы должны сосредоточиться на японцах."
  jyutgwai.10.t:0 "Экстренный набор"
  jyutgwai.10.d:0 "[CHI.GetRulingParty] предпринял некоторые действия: их подкуп вызвал раздоры в клике Гуандун. Мы должны подготовить наших людей к тому, что война неизбежна!"
  jyutgwai.11.t:0 "Давление со стороны СМИ"
  jyutgwai.11.d:0 "Из-за напряженности между нами и [GXC.GetLeader] большинство СМИ поддерживает [GXC.GetLeader], а не нас. В основном это связано с нашей нынешней политикой, ставящей во главу угла внутреннюю стабильность, а не угрозу со стороны Японии."
  jyutgwai.11.a:0 "Сначала мы должны избавиться от болезни сердца!"
  jyutgwai.11.b:0 "Если мы продолжим в том же духе, мы можем потерять еще больше поддержки со стороны общественности."
  jyutgwai.12.t:0 "Инцидент разрешен"
  jyutgwai.12.d:0 "После продолжительного обсуждения представителей обеих сторон был достигнут консенсус. Так называемый "лянгуанский инцидент" с тех пор был разрешен."
  jyutgwai.12.a:0 "Это на благо китайского народа."
  jyutgwai.15.t:0 "Чэнь Цзитан признает поражение"
  jyutgwai.15.d:0 "Чэнь Цзитан решил сдаться центральному правительству."
  jyutgwai.15.a:0 "Мудрое решение."
  jyutgwai.8.c:0 "Этот предательский ублюдок!"
  ## 5/2/2017 ##
  KMT_may_war:0 "§RЭто с большой вероятностью приведет к войне§!\n"
  GXC_reject_1_tt:0 "§YМы захватим провинцию Гуандун, если они примут это контрпредложение§!"
  CHI_reject_1_tt:0 "§YОни станут нашей марионеткой, если примут это контрпредложение§!"
  jyutgwai.10.a:0 "Мы должны отправить в Нанкин представителей для более мирного урегулирования."
  jyutgwai.10.b:0 "Jaak3 si2 laa1, zoeng2 gaai3 sek6"
  jyutgwai.13.t:0 "Представители от [From.GetName] прибывают"
  jyutgwai.13.d:0 "Некоторые представители от [From.GetName] прибыли в [Root.Capital.GetName]. Они заявили, что их миссия здесь — найти более мирное решение для разрешения текущей ситуации."
  jyutgwai.13.a:0 "Посмотрим, что они могут предложить."
  jyutgwai.13.b:0 "Задержите этих сообщников!"
  jyutgwai.14.t:0 "Враждебность со стороны [From.GetLeader]"
  jyutgwai.14.d:0 "[From.GetLeader] решил разрешить текущую ситуацию силой."
  jyutgwai.14.a:0 "Очень хорошо."
  jyutgwai.16.t:0 "Возможность?"
  jyutgwai.16.d:0 "Во время войны между [CHI.GetLeader] из [CHI.GetRulingParty] и [GXC.GetLeader] из [GXC.GetRulingParty] центральное правительство не обращало на нас внимания. Мы можем воспользоваться этой возможностью, чтобы начать наступление и попытаться свергнуть их власть в [CHI.Capital.GetName]."
  jyutgwai.16.a:0 "Следующая остановка, [CHI.Capital.GetName]!"
  jyutgwai.16.b:0 "Где мой улун?"
  jyutgwai.17.t:0 "[From.GetLeader] согласен на переговоры"
  jyutgwai.17.d:0 "После долгих размышлений [From.GetLeader] согласился провести встречу с вами и своими представителями, чтобы обсудить более мирное решение сложившейся ситуации."
  jyutgwai.17.a:0 "Мы должны быть готовы ко всему."
  negotiate_in_20:0 "§YСобытие произойдет примерно через 35 дней.§!\n\n"
  jyutgwai.18.t:0 "Представители задержаны"
  jyutgwai.18.d:0 "Наши представители, посланные на переговоры с [CHI.GetRulingParty], задержаны. Похоже, [CHI.GetLeader] хочет решить это на поле боя."
  jyutgwai.18.a:0 "Отлично, наши солдаты будут сражаться до последнего!"
  jyutgwai.19.t:0 "[From.GetName] переходит в наступление"
  jyutgwai.19.d:0 "Подумав, что мы отвлечены от нашего текущего конфликта с [GXC.GetLeader]'s [GXC.GetRulingParty], [From.GetLeader] решил напасть на нас!"
  jyutgwai.19.a:0 "Предатель!"
  jyutgwai.20.t:0 "Требования обеих сторон"
  jyutgwai.20.d:0 "После продолжительных дебатов представители обеих сторон пришли к консенсусу.\n\nРезультат их обсуждения выглядит следующим образом :\n\n[CHI.GetName] и [GXC.GetName] выведут свои войска.\nЦентральное правительство не будет вмешиваться в дела Лянгуана.\n[GXC.GetName] должен подчиняться командам Центрального правительства в случае начала войны.\n\nОднако [CHI.GetLeader] и [GXC.GetLeader] должны оба согласиться с этими условиями, чтобы они вступили в силу."
  jyutgwai.20.a:0 "Приемлемо"
  jyutgwai.20.b:0 "Унизительно!"
  jyutgwai.22.t:0 "Контрпредложение от [CHI.GetName]"
  jyutgwai.22.d:0 "Считая условия неравными и унизительными, [CHI.GetLeader] приказал сделать контрпредложение, требующее перехода нашей клики под его непосредственный контроль."
  jyutgwai.22.a:0 "Просто покончите с этим."
  jyutgwai.22.b:0 "Fang shen me gou pi!"
  jyutgwai.23.t:0 "Контрпредложение от [GXC.GetName]"
  jyutgwai.23.d:0 "Считая условия неравными и унизительными, [GXC.GetLeader] приказал сделать контрпредложение, требующее перехода области Лянгуан под их непосредственный контроль в качестве компенсации."
  jyutgwai.24.t:0 "Контрпредложение отклонено"
  jyutgwai.24.d:0 "Наше контрпредложение отклонено, кажется, остался только один путь."
  jyutgwai.24.a:0 "Приготовьтесь!"
  jyutgwai.25.t:0 "Контрпредложение принято"
  jyutgwai.25.d:0 "К нашему удивлению, наше контрпредложение было принято."
  jyutgwai.25.a:0 "По крайней мере, нам не придётся идти на войну."
  jyutgwai.26.t:0 "Переговоры провалились"
  jyutgwai.26.d:0 "Обе стороны отклонили условия. Дальнейшие переговоры кажутся невозможными, обе стороны начали мобилизацию войск для войны."
  jyutgwai.26.a:0 "Мы это знали!"
  jyutgwai.27.t:0 "Ситуация разрешена"
  jyutgwai.27.d:0 "Обе стороны отвели свои войска, теперь напряженность ослабла."
  jyutgwai.27.a:0 "Хорошо для всех."
  ## 20/3/2017 ##
  jyutgwai.15.b:0 "Мы скоро восстановим контроль над центральной равниной."
  ## 20/4/2017 ##
  jyutgwai.7.a:0 "Попытайтесь подкупить некоторых из их людей."
  jyutgwai.7.b:0 "Поразмыслив, может, нам следует прекратить это делать."
  jyutgwai.29.t:0 "[From.GetRulingParty] Решили оставить нас в покое"
  jyutgwai.29.d:0 "Каким-то образом чиновники из [From.GetRulingParty] решили отпустить нас и не предпринимать против нас дальнейших действий."
  jyutgwai.29.a:0 "Э... что? Они серьезно?"
  jyutgwai.8.d:0 "Некоторые из наших людей были подкуплены [From.GetLeader] и переметнулись к нашему врагу. Центральное правительство также отстранило Чэнь Цзи-тана от должности. Теперь Юй Хань-моу, выступавший за Чан Кайши, занял должность Чэнь Цзи-тана. Чэнь Цзи-тану отправлен ультиматум с требованием отказаться от власти над армией и подчиниться Центральному правительству."
  jyutgwai.30.t:0 "Попытка подкупа не удалась"
  jyutgwai.30.d:0 "Несмотря на нашу щедрость, генералы и солдаты [From.GetName], похоже, не хотят оставлять своего хозяина. Наша попытка подкупа провалилась."
  jyutgwai.30.a:0 "Тогда прибегните к насилию."
  jyutgwai.31.t:0 "Подкуп принят"
  jyutgwai.31.d:0 "Наши взятки были приняты большинством генералов из [From.GetName] и многие из них перешли на нашу сторону."
  jyutgwai.31.a:0 "Это еще одно доказательство их слабости."
  jyutgwai.32.t:0 "Наши люди отказались от взятки"
  jyutgwai.32.d:0 "Наши люди отказались от взятки от [From.GetLeader]. Теперь мы едины как никогда!"
  jyutgwai.32.a:0 "Справедливость восторжествует!"
  jyutgwai.33.t:0 "Инцидент в Лянгуане"
  jyutgwai.33.d:0 "В то время как в Лянгуане происходит инцидент, [CHI.GetLeader] занят решением проблемы на юге. Это возможность для нас действовать, мы можем сначала заключить мир с коммунистами, чтобы сохранить наших людей."
  jyutgwai.33.a:0 "Призовите к прекращению огня."
  jyutgwai.33.b:0 "Нет, коммунизм - это яд для китайского народа."
  jyutgwai.34.t:0 "[From.GetLeader] хочет прекращения огня"
  jyutgwai.34.d:0 "[From.GetLeader] отправил представителя для призыва к прекращению огня между нашими войсками. В то время как [CHI.GetLeader] занят на юге, мы можем использовать эту возможность для восстановления."
  jyutgwai.34.a:0 "Отлично"
  jyutgwai.34.b:0 "Это должно быть ловушкой!"
  jyutgwai.35.t:0 "[From.GetName] согласились"
  jyutgwai.35.d:0 "[From.GetName] согласились на прекращение огня, теперь мы можем восстановиться и попытаться выдвинуть наш план."
  jyutgwai.35.a:0 "Блестяще!"
  jyutgwai.36.t:0 "[From.GetLeader] отказали"
  jyutgwai.36.d:0 "[From.GetName] отказались от соглашения о прекращении огня, мы должны продолжать сражаться."
  jyutgwai.36.a:0 "Это не хорошо."
  jyutgwai.37.t:0 "Чжан Сюэлян прекращает атаковать"
  jyutgwai.37.d:0 "Мы выяснили, что Чжан Сюэлян прекратил атаковать коммунистов. Вероятно, он думает, что сейчас мы заняты противостоянием с южными военачальниками и не обращаем на него внимания, и попытался реализовать какой-то свой коварный план."
  jyutgwai.37.a:0 "Мы разберемся с ним позже..."
  jyutgwai.38.t:0 "Дилемма"
  jyutgwai.38.d:0 "Силы [CHI.GetLeader] приближаются к нашей границе, а представитель [GXC.GetLeader] убеждает [Root.GetLeader], поэтому сейчас мы оказались в ситуации выбора между [CHI.GetRulingParty] и [GXC.GetRulingParty]. Если мы присоединимся к кому-либо из них, второй наверняка будет недоволен. И ситуация не позволяет нам сохранить нейтралитет."
  jyutgwai.38.a:0 "Попытаться обмануть [CHI.GetLeader], направив его силы на фронт."
  jyutgwai.38.b:0 "Присоединиться к [CHI.GetRulingParty]"
  jyutgwai.38.c:0 "Присоединиться к [GXC.GetRulingParty]"
  jyutgwai.39.t:0 "Предложение [From.GetLeader]"
  jyutgwai.39.d:0 "Находясь в трудной ситуации, [From.GetLeader] пытается вступить в союз с нами и направил предложение о том, что войска [Root.GetLeader] должны быть направлены на фронт для эффективного удара в предстоящем наступлении."
  jyutgwai.39.b:0 "Очевидно, это план ослабить наши войска!"
  jyutgwai.39.a:0 "Звучит неплохо."
  jyutgwai.40.t:0 "Предложение принято"
  jyutgwai.40.d:0 "[From.GetLeader] одобрил наше предложение и разместил свои силы на фронте."
  jyutgwai.40.a:0 "Нам повезло."
  jyutgwai.41.t:0 "Предложение отклонено"
  jyutgwai.41.d:0 "[From.GetLeader] разгадал хитрый план Хе Цзяня и пришел в ярость. Хе Цзянь был отстранен от должности."
  jyutgwai.41.a:0 "Ну что ж..."
  jyutgwai.42.t:0 "[From.GetName] присоединяется к нам"
  jyutgwai.42.d:0 "Попав под давление с двух сторон, [From.GetLeader] принял решение присоединиться к нам!"
  jyutgwai.42.a:0 "Прекрасно"
  jyutgwai.43.t:0 "[From.GetName] присоединяется к нашему врагу"
  jyutgwai.43.d:0 "Попав под давление с двух сторон, [From.GetLeader] принял решение присоединиться к нашему врагу!"
  jyutgwai.43.a:0 "Как они посмели!"
  jyutgwai.44.t:0 "Наших людей подкупили"
  jyutgwai.44.d:0 "Наши люди были подкуплены [CHI.GetLeader], и был назначен новый лидер, являющийся сторонником [CHI.GetLeader]."
  jyutgwai.30.c:0 "Посмотрим, что из этого выйдет."
  ## 7/5/2017 ##
  jyutgwai.45.t:0 "[From.GetName] объявил нам войну"
  jyutgwai.45.d:0 "[From.GetName] решил урегулировать наши текущие проблемы на поле боя."
  jyutgwai.45.a:0 "Пусть будет так."
  jyutgwai.46.t:0 "Сохраняя свои силы"
  jyutgwai.46.d:0 "Несмотря на то, что [Root.GetLeader] вступил в союз с [CHI.GetRulingParty], он на самом деле не хочет ввязываться в спор [CHI.GetLeader] с [GXC.GetLeader]. Он придумал план по сохранению наших сил и ослаблению сил [CHI.GetLeader] в случае начала войны."
  jyutgwai.46.a:0 "Отправьте предложение."
  jyutgwai.46.b:0 "Если они поймут наши намерения, у нас будут неприятности!"
  ## 10/5/2017 ##
  jyutgwai.30.b:0 "Мы сокрушим их нашими силами!"
  ## 29/8/2017 ##
  jyutgwai.44.b:0 "Мы будем бороться до конца!"
  jyutgwai.44.a:0 "Мы смиримся со своей судьбой..."
  jyutgwai.49.t:0 "Мир с [GXC.GetName]?"
  jyutgwai.49.d:0 "Похоже, что у нас нет видимых причин продолжать свою борьбу с [GXC.GetName], возможно, прекращение огня будет лучшим для нас двоих."
  jyutgwai.49.a:0 "Прекратить этот конфликт."
  jyutgwai.49.b:0 "Существует множество причин, по которым эта борьба должна продолжаться."
  jyutgwai.50.t:0 "[From.GetName] предлагает прекращение огня"
  jyutgwai.50.d:0 "[From.GetName] решил, что наш текущий конфликт не приносит пользы ни нам, ни им, и настоял на том, чтобы мы согласились на прекращение огня."
  jyutgwai.51.t:0 "Прекращение огня"
  jyutgwai.51.d:0 "[From.GetName] согласился на прекращение огня, наши войска теперь вернутся на наши территории."
  jyutgwai.51.a:0 "Хорошо"
  jyutgwai.52.t:0 "Борьба продолжается"
  jyutgwai.52.d:0 "[From.GetName] отказался прекратить текущий конфликт."
  jyutgwai.52.a:0 "Какая кровожадность!"
  jyutgwai.3.t_2:0 "[GXC.GetName] отказывается"
  jyutgwai.3.d_2:0 "[GXC.GetName] отказался формировать альянс против [CHI.GetLeader].\n\nТеперь мы сами по себе."
  jyutgwai.9.c:0 "Сначала мы должны разгромить [YUT.GetName]."
  jyutgwai.9.d_2:0 "Несмотря на то, что некоторые генералы из [YUT.GetName] перешли на нашу сторону, [YUT.GetLeader] и некоторые из его верных сил все еще противостоят нам."
  jyutgwai.55.t:0 "Под иностранной атакой"
  jyutgwai.55.d:0 "Наша страна подверглась нападению извне. Чиновники предложили незамедлительно решить текущие проблемы с [GXC.GetName], чтобы освободить ресурсы для отражения атак противника."
  jyutgwai.55.d:0 "Наша страна подверглась нападению извне. Чиновники предложили незамедлительно решить текущие проблемы с [YUT.GetName], чтобы освободить ресурсы для отражения атак противника."
  jyutgwai.55.a:0 "Выживание нашей нации под угрозой!"
  jyutgwai.55.b:0 "Это не займет много времени."
  jyutgwai.56.t:0 "[From.GetName] намерен решить проблему"
  jyutgwai.56.d:0 "Оценив сложившуюся ситуацию, [From.GetName] решил решить существующие между нами проблемы."
  jyutgwai.56.a:0 "Звучит неплохо"
  jyutgwai.56.b:0 "Они не ожидают, что сейчас мы начнем наступление."
  jyutgwai.57.t:0 "[From.GetName] согласился"
  jyutgwai.57.d:0 "[From.GetName] согласился, что текущие проблемы должны быть решены немедленно."
  jyutgwai.57.a:0 "Прекрасно!"
  jyutgwai.58.t:0 "[From.GetName] начинает наступление"
  jyutgwai.58.d:0 "[From.GetName] решил напасть на нас в сложившейся ситуации!"
  jyutgwai.58.a:0 "Они, должно быть, сошли с ума!"
  jyutgwai.59.t:0 "[GXC.GetName] сдался"
  jyutgwai.59.d:0 "[GXC.GetName] пал под влиянием взяток [CHI.GetRulingParty] и распущен. Теперь мы одни."
  jyutgwai.59.a:0 "Мы можем только сдаться."
  jyutgwai.59.b:0 "Мы будем сражаться до последнего!"
  jyutgwai.60.t:0 "[From.GetName] сдался"
  jyutgwai.60.d:0 "Видя падение [GXC.GetName], [From.GetName] решает встать в строй и распустить свое местное правительство."
  jyutgwai.60.a:0 "Мудрый шаг."
  KMT_zxl_stopped_attack_tt:0 "§GМиссия §HСледующее наступление§! больше не будет активироваться.§!\n"
  jyutgwai.61.t:0 "Прекращение огня"
  jyutgwai.61.d:0 "После соглашения о прекращении огня с нами и [From.GetLeader] наши стычки с ними прекратились. Многие наши люди долго ждали этой столь необходимой передышки."
  jyutgwai.61.a:0 "Меньше повод для беспокойства."
  jyutgwai.62.t:0 "Неприятности на юге"
  jyutgwai.62.d:0 "Согласно докладам из [592.GetName], политическая схема [KMT_central_gov_tag.GetLeader] по поглощению [YUT.GetNameDef] была сорвана. Теперь, когда [KMT_central_gov_tag.GetLeader] сосредоточился на борьбе с южными военачальниками, их внимание к нашим действиям ослабло. Это будет наш шанс действовать самостоятельно."
  jyutgwai.62.a:0 "Дар божий!"
  KMT_can_ceasefire_tt:0 "§GТеперь вы можете запросить перемирие с коммунистами§!\n"
  KMT_yut_joins_alliance_tt:0 "§G[YUT.GetName] присоединяется к вашему альянсу§!\n"
  KMT_from_joins_alliance_tt:0 "§G[From.GetName] присоединяется к вашему альянсу§!\n"
  jyutgwai.63.t:0 "[From.GetName] распускает альянс"
  jyutgwai.63.d:0 "В соответствии с согласованными условиями [From.GetName] распустил свой альянс."
  jyutgwai.63.a:0 "По крайней мере ситуация разрядилась."
  jyutgwai.64.t:0 "Недовольство населения"
  jyutgwai.64.d:0 "As the domestic conflict becomes yet another civil war, the public become outrageous to our inability in keeping the peace."
  jyutgwai.64.a:0 "Damned fools!"
  KMT_gxc_may_offer_negotiation_tt:0 "§G[GXC.GetName] may offer negotiation§!\n"
  ## 22/10/2020 ##
  jyutgwai.65.t:0 "Riding on the Wave"
  jyutgwai.65.d:0 "The warlord in Kwangtung has been dealt with. If we want to consolidate our control in southern China, now would be the best time at striking the Kwangsi warlord."
  jyutgwai.65.a:0 "Let's proceed."
  jyutgwai.65.b:0 "Perhaps another time."
  ## lure-them-in events ##
  lti.1.t:0 "Lure-Them-In Strategy"
  lti.1.d:0 "Our soldiers are now starting to follow the instruction of our new \"Lure-Them-In\" strategy. If all goes well, this should bring some changes to the war soon."
  lti.1.a:0 "Let's hope for the best."
  lti.2.d:0 "Our new strategy has proven to be quite successful. Our soldiers are now more effective at defending agianst our enemies."
  lti.2.a:0 "A good sign"
  lti.6.t:0 "Enemy Partisans"
  lti.6.d:0 "Sproadic enemy partisan activities behind our frontline have been reported lately. Although not a serious threat at the moment, some officials suggest that we should crush our enemy before their partisans start to threaten our supply line."
  lti.6.a:0 "We'll see..."
  lti.7.d:0 "More and more partisan activities have been reported, the situation is getting worse!"
  lti.7.a:0 "Dammit!"
  lti.11.t:0 "Improper Frontline Command"
  lti.11.d:0 "Недочеты в командовании нашим фронтом еще никогда не были так очевидны для [From.GetName]. Их силы теперь используют эту возможность, чтобы дать отпор."
  lti.11.a:0 "Эти бездарные генералы должны совершить сэппуку!"

  ## ресурсы ##
  kmt_res.1.t:0 "Ресурсы на северо-востоке"
  kmt_res.1.d:0 "Благодаря улучшенным технологиям мы теперь можем получать больше ресурсов с месторождений на наших северо-восточных территориях."
  kmt_res.1.a:0 "Блестяще!"
  kmt_res.2.t:0 "Ресурсы на северо-западе"
  kmt_res.2.d:0 "Благодаря улучшенным технологиям мы теперь можем получать больше ресурсов с месторождений на наших северо-западных территориях."
  kmt_res.3.t:0 "Увеличенный выход ресурсов"
  kmt_res.3.d:0 "Благодаря улучшенным технологиям мы теперь можем получать больше ресурсов с месторождений в самом Китае."

  ## Сианьский инцидент ##
  KMT_will_stop_civil_war_tt:0 "  Остановит гражданскую войну и создаст единый фронт против японских захватчиков.\n"
  KMT_will_release_chiang_tt:0 "   Освободит Чан Кайши.\n"
  accept_all_demand:0 "Принять"
  KMT_chiang_return_tt:0 "Чан Кайши будет освобожден."
  demand.t:0 "Список требований"
  demand.d:0 "Требования, выдвинутые обеими сторонами, следующие: "
  reject_all_demand_and_war:0 "Отвергнуть все и объявить войну."
  demand_rejected_war.t:0 "ВОЙНА!"
  demand_rejected_war.d:0 "[From.GetName] потерял терпение и решил прибегнуть к войне, чтобы решить текущую проблему. Они начали наступление, и мы должны подготовить наших людей!"
  demand_rejected_war.a:0 "Нецивилизованные варвары!"
  KMT_chi_stop_civil_war_demand_rejected_tt:0 "[From.GetName] отклонил наше требование прекратить гражданскую войну и создать единый фронт.\n"
  KMT_chi_demand_submission_tt:0 "[From.GetName] потребовал нашей капитуляции.\n"
  KMT_will_submit_to_chiang_tt:0 "   Подчинится [CHI.GetName].\n"
  KMT_chi_demand_submission_rejected_tt:0 "[From.GetName] отклонил наше требование о капитуляции.\n"
  resolved.t:0 "Инцидент исчерпан"
  resolved.d:0 "Обе стороны согласовали все условия, проблема решена.\n\nУсловия следующие:"
  xian.1.t:0 "Полет в [ZXL.Capital.GetName]"
  xian.1.d:0 "Все еще недовольный ходом Операции по окружению и обеспокоенный слухами о мятеже, [Root.GetLeader] решил вылететь в [ZXL.Capital.GetName], где в настоящее время находится главный штаб кампании, чтобы лично проконтролировать войска."
  xian.1.a:0 "Присутствие [Root.GetLeader] несомненно ускорит уничтожение красных бандитов."
  xian.1.b:0 "Убедить [Root.GetLeader] воздержаться от этого."
  xian.2.t:0 "Прибытие [CHI.GetLeader]"
  xian.2.d:0 "[CHI.GetLeader] прибыл в Сиань, чтобы встретиться с [Root.GetLeader]. [CHI.GetLeader] приказал провести всеобщую атаку на коммунистов."
  xian.2.a:0 "Мы должны что-то предпринять."
  xian.2.b:0 "Мы ничего не можем сделать."
  KMT_will_Die_tt:0 "§RЕсли вам не удастся уничтожить коммунистов в течение трех месяцев, вы будете аннексированы.§!\n"
  xian.3.t:0 "Чан Кайши взят в заложники"
  xian.3.d:0 "Чжан Сюэлян начал штурм штаба Чан Кайши в Сиане и захватил его. Теперь Чжан требует прекратить гражданскую войну и сосредоточиться на японцах. Если мы согласимся на эти условия, они освободят Чан Кайши."
  xian.3.a:0 "Отправить к ним переговорщика!"
  xian.3.b:0 "Мы вернём Чан Кайши силой!"
  xian.4.t:0 "[From.GetRulingParty] посылает представителей"
  xian.4.d:0 "Представители [CHI.GetRulingParty] прибыли для обсуждения текущих событий.\n\nОни предъявляют следующие требования:"
  xian.4.a:0 "Прекрасно."
  xian.5.t:0 "[CHI.GetRulingParty] переходит в наступление!"
  xian.5.d:0 "[CHI.GetRulingParty] решили вернуть Чан Кайши силой!"
  xian.5.a:0 "Приготовьте наших бойцов!"
  xian.6.t:0 "Сианьский инцидент"
  xian.6.d:0 "Чжан Сюэлян взял Чан Кайши в заложники в надежде, что он сосредоточится на японцах, а не на коммунистах [PRC.GetLeader]."
  xian.6.a:0 "Нам это невыгодно."
  xian.6.b:0 "Мы должны поддержать усилия Чжана."
  xian.7.d:0 "Чжан Сюэлян взял Чан Кайши в заложники в надежде, что он сосредоточится на японцах, а не на нас."
  xian.7.a:0 "Надеемся, что он добьётся успеха."
  xian.8.t:0 "Неудовольствие [SOV.GetName]"
  xian.8.d:0 "[SOV.GetName] недоволен нашим решением взять Чан Кайши в заложники и требует немедленно его освободить."
  xian.8.a:0 "Мы не должны отступать!"
  xian.9.t:0 "Сообщение от [SOV.GetName]"
  xian.9.d:0 "[SOV.GetName] похоже, вполне удовлетворён нашей инициативой в создании единого фронта и побуждает нас не отступать."
  xian.9.a:0 "Они заслуживают нашей благодарности."
  xian.10.t:0 "[CHI.GetRulingParty] берёт на себя ответственность."
  xian.10.d:0 "Нам не удалось уничтожить коммунистов за три месяца, поэтому теперь [CHI.GetRulingParty] продолжит нашу работу."
  xian.10.a:0 "..."
  xian.11.t:0 "Мы берём на себя ответственность."
  xian.11.d:0 "Мы взяли под свой контроль Северо-восточную армию, поскольку она не выполнила поставленный срок уничтожения коммунистов в течение трёх месяцев."
  xian.11.a:0 "Мы покончим с коммунистами."
  xian.100.a:0 "Мы не будем сотрудничать с коммунистами!"
  xian.100.b:0 "Мы потребуем их подчинения!"
  xian.100.c:0 "Мы никогда не покоримся!"
  xian.12.t:0 "Арестовать Чжана?"
  xian.12.d:0 "Чжан Сюэлян последовал за Чан Кайши в Нанкин, и Чан ещё не простил Чжана за его действия. Теперь он планирует посадить Чжана под домашний арест и держать под контролем."
  xian.12.a:0 "Он должен понимать, что это его ждёт."
  xian.12.b:0 "В этом нет необходимости."
  KMT_chi_stop_civil_war_demand_again_tt:0 "Они настаивали на том, что гражданская война должна быть остановлена.\n"
  xian.100.d:0 "Мы требуем создания единого фронта!"
  KMT_chiang_returns_tt:0 "Чан Кайши доступен в качестве фельдмаршала\n"
  xian.13.t:0 "Чан Кайши спасён"
  xian.13.d:0 "После уничтожения сил Чжана наши солдаты нашли Чана и освободили его."
  xian.13.a:0 "У них никогда не было шанса против нас."
  xian.1.d_2:0 "Прогресс по устранению коммунистов шёл медленно. [CHI.GetLeader] решил навестить [ZXL.GetLeader] и настоять на скорейшем решении проблемы с коммунистами. А также расследовать его заявление о предстоящем мятеже."
  xian.14.t:0 "Чан Кайши убит"
  xian.14.d:0 "[ZXL.GetLeader] отдал приказ о казни Чан Кайши. С его гибелью внутри [Root.GetRulingParty] образовался вакуум власти. Конкуренция приняла очень жестокий характер, и гражданская война между двумя влиятельными фракциями неизбежна."
  xian.14.a:0 "Мы должны остаться твёрдыми."
  xian.14.b:0 "Поддержите противостоящую фракцию."
  xian.2.c:0 "Казнить [CHI.GetLeader]"
  xian.15.d:0 "В связи с недавними политическими потрясениями в Китае началась новая гражданская война. Это создаёт для нас бесценную возможность оказать влияние на регион или расширить его."
  xian.15.t:0 "Гражданская война в Китае"
  xian.15.a:0 "Примкните к одной из сторон."
  xian.15.a_hyq:0 "Поддержка Хэ Ин-циня"
  xian.15.a_fyx:0 "Поддержка Фэн Юйсяна"
  xian.15.b:0 "Захватим регион!"
  xian.15.c:0 "Будем ещё немного наблюдать."
  xian.16.t:0 "[From.GetName] хочет нам помочь"
  xian.16.d:0 "В условиях текущей гражданской войны [From.GetName] решил нам помочь в военных действиях."
  xian.16.a:0 "Бесценный союзник."
  xian.16.b:0 "Корыстная свинья."
  xian.17.t:0 "[From.GetName] принимает нашу помощь"
  xian.17.d:0 "[From.GetLeader] принял нашу помощь, и теперь мы вместе ведём боевые действия."
  xian.17.a:0 "Браво!"
  xian.18.t:0 "[From.GetName] Отклонили Нашу Помощь"
  xian.18.d:0 "[From.GetLeader] отклонили нашу помощь."
  xian.18.a:0 "Черт!"
  xian.19.t:0 "[From.GetName] Объявили Нам Войну"
