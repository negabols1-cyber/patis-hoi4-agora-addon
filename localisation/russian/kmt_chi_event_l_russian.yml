  xian.103.t:0 "Изменение Условий"
  xian.103.d:0 "[From.GetName] предложил[a] внести изменения в условия:\n     Они настаивают на том, что мы [This.GetDemand]."
  xian.103.a:0 "Мы внимательно рассмотрим их требования"
  KMTStopAllCivilWarsRej:0 "отменить требование по прекращению всех гражданских войн в стране"
