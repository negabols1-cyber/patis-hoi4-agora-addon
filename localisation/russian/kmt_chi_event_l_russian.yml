  ## 03/02/2020 ##
  xian.15.e:0 "Мы присоединимся к [SOV.GetNameDef]!"
  xian.20.t:0 "[From.GetName] хочет к нам присоединиться"
  xian.20.d:0 "В то время, как в Китае бушует очередная гражданская война, [From.GetLeader] использует эту возможность, чтобы попытаться выйти из-под контроля центрального правительства и присоединиться к нашему славному Союзу!"
  xian.20.a:0 "Добро пожаловать на борт, товарищ!"
  xian.20.b:0 "Мы не допустим, чтобы в Союз просочились такие вероломные свиньи."
  xian.21.t:0 "[From.GetName] принимает"
  xian.21.d:0 "[From.GetName] принял нас в Союз."
  xian.21.a:0 "Славненько!"
  xian.22.t:0 "[From.GetName] отказывается"
  xian.22.d:0 "[From.GetName] отказал в нашей просьбе присоединиться к Союзу."
  xian.22.a:0 "Какая жалость"
  xian.23.t:0 "[SIK.GetLeader] присоединяется к [SOV.GetName]"
  xian.23.d:0 "[SIK.GetLeader] использовал нашу гражданскую войну как возможность выйти из-под контроля центрального правительства. После устранения наших кадров в Синьцзяне посредством массовых арестов и казней они теперь присоединились к [SOV.GetNameDef] и основали [SIK.GetNameDef]."
  xian.23.a:0 "Какое предательство!"
  KMT_will_not_prosecute_tt:0 "Не будем преследовать [ZXL.GetName]\n"
  xian.24.t:0 "[KMT_central_gov_tag.GetLeader] клянется уничтожить коммунистов"
  xian.24.d:0 "После посещения мавзолея Цинь Шихуанди и горы Тайшань [KMT_central_gov_tag.GetLeader] выразил свое желание в очередной раз полностью искоренить коммунистическую угрозу в стране, несмотря на медленный прогресс текущей кампании по окружению. Он также заявил, что заменит нынешнего смотрящего кем-то из своих ближайших подчиненных, если в кампании по-прежнему не будет заметного прогресса."
  xian.24.a:0 "Коммунисты представляют более насущную угрозу!"
  xian.25.a:0 "Но японцы представляют более насущную угрозу!"
  PRC_xian_tt:0 "§RЕсли между нами и националистами будет принудительно установлено перемирие, можно будет сформировать единый фронт против захватчиков. Однако если мы захотим продолжить нашу территориальную экспансию до окончательного краха этого единого фронта, перемирие может быть аннулировано.§!"
  xian.26.t:0 "Атаковать коммунистов"
  xian.26.d:0 "[From.GetLeader] приказал нашим войскам немедленно начать наступление на коммунистов. Если мы не сможем вовремя ликвидировать их, то вмешается Центральное правительство и возьмет ситуацию под контроль"
  claim_central.1.t:0 "Позиция Центрального правительства"
  claim_central.1.d:0 "Несмотря на заявление [KMT_central_gov_tag.GetName] о том, что они являются единственным законным правительством в Китае, подобные дерзкие заявления практически не встречают поддержки. Коррумпированное бюрократическое правительство, не пользующееся поддержкой населения, явно не в состоянии управлять Китаем. Настало время свергнуть этого тирана и освободить китайский народ"
  claim_central.1.a:0 "Вперед, на [KMT_central_gov_tag.Capital.GetName]!"
  KMT_can_claim_central_government_tt:0 "Захватите [KMT_central_gov_capital_state.GetName], чтобы заявить о притязаниях на должность в Центральном правительстве"
  claim_central.2.t:0 "Мы - Центральное правительство!"
  claim_central.2.d:0 "Поскольку [KMT_central_gov_tag.GetName] проиграло войну, их легитимность утрачена. Теперь мы можем занять их место и провозгласить себя Центральным правительством, а себя - единственным законным правительством в Китае"
  claim_central.2.a:0 "Славный день!"
  claim_central.3.t:0 "Узурпация!"
  claim_central.3.d:0 "Коварные мятежники из [KMT_central_gov_tag.GetName] решили свергнуть наше правительство и установить свое правление над Китаем"
  claim_central.3.a:0 "Как они посмели?"
  KMT_central_gov_core_tt:0 "Получите ядра в регионе Китай"
  claim_central.2.b:0 "Перенести столицу в Нанкин."
  claim_central.0.t:0 "Тест"
  claim_central.0.d:0 "Текущее центральное правительство [KMT_central_gov_tag.GetName]"
  claim_central.4.t:0 "Низкая легитимность"
  claim_central.4.d:0 "Мы потеряли контроль над большинством провинций, а наши притязания на роль центрального правительства сильно ослабли."
  claim_central.4.a:0 "Неприятно"
  claim_central.5.t:0 "Легитимность повышена"
  claim_central.5.d:0 "В связи с увеличением количества контролируемых провинций наши притязания на роль центрального правительства получили поддержку общественности."
  claim_central.5.a:0 "Хорошо"
  claim_central.6.t:0 "Центральное правительство повержено"
  claim_central.6.d:0 "С поражением центрального правительства чужими руками мы не сможем претендовать на должность сами."
  claim_central.7.t:0 "Триумф в гражданской войне"
  claim_central.7.d:0 "Благодаря недавней победе в гражданской войне, мы успешно взяли на себя роль Центрального правительства."
  claim_central.8.t:0 "Позиция центрального правительства сменилась"
  claim_central.8.d:0 "[KMT_central_gov_tag.GetName] одержало победу в недавней гражданской войне и взяло на себя роль центрального правительства."
  claim_central.8.a:0 "У нас еще есть шансы."
  claim_central.9.t:0 "Территориальные претензии"
  claim_central.9.d:0 "Наши чиновники обнаружили некоторые несоответствия между нашими территориальными претензиями и территориальными претензиями прежнего центрального правительства. Что нам делать?"
  claim_central.9.a:0 "Наши претензии первичны!"
  claim_central.9.b:0 "Претензии прежнего правительства кажутся более выгодными."
  claim_central.9.c:0 "Разве эти претензии не охватывают весь регион Большого Китая?"
  claim_central.10.t:0 "Послы мира"
  claim_central.10.d:0 "В связи с недавним изменением руководства Китая новую позицию Центрального правительства захватила новая клика. Это новое правительство проявило готовность положить конец нашему текущему конфликту, направив нескольких делегатов в [Root.Capital.GetName] для мирных переговоров."
  claim_central.10.a:0 "У нас будет мир, когда будет отомщена жизнь наших павших солдат!"
  claim_central.10.b:0 "Значит мир."
  claim_central.11.t:0 "[From.GetName] отклонил мирное предложение"
  claim_central.11.d:0 "Разжигающие войну негодяи в [From.Capital.GetName] отклонили наше мирное предложение и заявили, что наш текущий конфликт закончится только тогда, когда они или мы будем уничтожены."
  claim_central.11.a:0 "Значит они выбрали смерть."
  claim_central.12.t:0 "[From.GetName] принял мирное предложение"
  claim_central.12.d:0 "Переговоры были короткими, но успешными. Обе стороны приняли условия и был подписан мирный договор, завершивший нашу войну со статусом-кво анте беллюм."
  claim_central.12.a:0 "Наконец-то."
  claim_central.13.t:0 "Конец союза"
  claim_central.13.d:0 "С приходом [From.GetLeader] к посту национального лидера, наш альянс, который существовал исключительно для того, чтобы помочь [From.GetLeader] в борьбе за власть против прежнего Центрального Правительства, больше не имеет практических оснований для своего существования."
  claim_central.13.a:0 "Мы все еще клянемся в верности нашему лидеру."
  claim_central.14.t:0 "[From.GetLeader] захватил национальное лидерство"
  claim_central.14.d:0 "Поскольку наши войска успешно вынудили прежнее Центральное правительство уйти в отставку, логично, что лидером нашего альянса должен стать тот, кто взойдет на пост национального лидера.\n\nОднако в результате немыслимого предательства [From.GetLeader] провозглашает захват титула Центрального правительства, присваивая плоды победы себе."
  claim_central.14.a:0 "Этот жалкий пес!"
  claim_central.15.t:0 "Конец альянса"
  claim_central.15.d:0 "Поскольку наши войска успешно вынудили прежнее Центральное правительство уйти в отставку, логично, что [Root.GetLeader] должен стать тем, кто взойдет на пост национального лидера.\n\nОднако в результате немыслимого предательства [From.GetLeader] провозглашает захват титула Центрального правительства, заявляя о том, что по праву принадлежит нам!"
  claim_central.15.a:0 "[From.GetLeader] должен быть убит!"
  claim_central.16.t:0 "Передать [KMT_central_gov_capital_state.GetName] [From.GetName]?"
  claim_central.16.d:0 "После нашей борьбы с прежним Центральным правительством мы получили контроль над столицей бывшего режима. [From.GetLeader] недавно просил передать им бывшую столицу, чтобы они смогли доказать свою легитимность и стать следующим лидером нации."
  claim_central.16.b:0 "Разумеется"
  claim_central.16.a:0 "Мы являемся Центральным правительством!"
  claim_central.17.t:0 "Получен [KMT_central_gov_capital_state.GetName]"
  claim_central.17.d:0 "[From.GetLeader] быстро передал под наш контроль [KMT_central_gov_capital_state.GetName]."
  claim_central.17.a:0 "Теперь мы можем приступить к осуществлению нашего плана."
  claim_central.18.t:0 "[From.GetLeader] заявляет о лидерстве в Китае"
  claim_central.18.d:0 "Борьба за власть в Китае наконец на короткое время прекратилась, когда [From.GetLeader], лидер [From.GetRulingParty], заявил о лидерстве в нации от имени предыдущего правительства. Новое Центральное правительство уже начало менять некоторые из политик прежнего правительства. Некоторые ожидают, что новое правительство расширит свои территориальные претензии, но пока неясно, действительно ли это произойдет.\n\nТем не менее, больше всего заинтересованных сторон волнует, последует ли эта новая администрация по пути предыдущей и будет ли смещена с поста."
  claim_central.18.a:0 "Интересное развитие событий."
  ## 23/02/2020 ##
  claim_central.19.t:0 "[From.GetLeader] объявляет об оппозиции"
  claim_central.19.d:0 "Выражая недовольство сложившимся в Китае положением дел, особенно политикой [KMT_central_gov.GetLeader], [From.GetLeader] открыто заявили о своей оппозиции к центральному правительству."
  claim_central.19.a:0 "Интересно"
  claim_central.19.b:0 "Они нас не свергнут!"
  claim_central.20.t:0 "Клятва верности [From.GetLeader]"
  claim_central.20.d:0 "Увидев величие, которое мы принесли Китаю, [From.GetLeader] умоляли нас о своей безусловной верности."
  claim_central.20.a:0 "Превосходно!"
  claim_central.21.t:0 "[From.GetLeader] присоединяется к революции"
  claim_central.21.d:0 "Осознав все преимущества коммунизма, [From.GetLeader] решили присоединиться к нашему делу и сражаться вместе за революцию."
  ## 18/08/2021 ##
  KMT_war_with_axis_tt:0 "Китай объявит войну всем странам, находящимся в состоянии войны с [USA.GetNameDef] или [ENG.GetNameDef]"
  ## foreign supply routes ##
  kmt_fsr.15.t:0 "[From.GetNameDefCap] восстановили работу участка Юньнань-Хайфонской железной дороги"
  kmt_fsr.15.desc:0 "После успешного освобождения значительной части Юньнань-Хайфонской железной дороги [From.GetAdjective] власти разрешили возобновить движение по железной дороге. Хотя остатки вражеских сил делают поездки по ней еще более опасными, чем прежде, поставка грузов вновь возобновлена."
  kmt_fsr.15.a:0 "Хороший первый шаг."
  kmt_fsr.16.t:0 "[From.GetNameDefCap] возобновили работу Юньнань-Хайфонской железной дороги"
  kmt_fsr.16.desc:0 "Первый конвой с припасами по вновь открытой Юньнань-Хайфонской железной дороге прибыл сегодня в Юньнань. Хотя потребуется время, прежде чем движение будет осуществляться бесперебойно, поставки снова поступают к нам."
  kmt_fsr.16.a:0 "Отличная новость!"
  KMT_yunnan_bahn_reopen_state:0 "Восстановить Юньнань-Хайфонскую железную дорогу в этом штате.\n"
  ## power struggle ##
  kmt_powerstruggle.3.t:0 "[Root.GetInviteJoin]"
  KMTPSInvite:0 "[From.GetName] приглашает нас в свой союз"
  KMTPSJoin.3.t:0 "[From.GetName] хочет присоединиться к нашему союзу"
  kmt_powerstruggle.3.d:0 "[Root.GetInviteJoinDesc]"
  KMTPSInviteDesc:0 "С намерением расширить свой союз, чтобы противостоять влиянию Центрального правительства, [From.GetLeader] отправляет приглашение [Root.GetLeader] с просьбой объединиться в трудные времена."
  KMTPSJoinDesc:0 "Понимая, что наши цели совпадают, [From.GetLeader] договорился о встрече с [Root.GetLeader], чтобы обсудить вопрос о вступлении в наш союз. Это отличная возможность для нас расширить наше влияние и власть."
  kmt_powerstruggle.3.a:0 "Вместе мы непобедимы"
  kmt_powerstruggle.3.b:0 "Мы не приведем волков к себе в дом."
  kmt_powerstruggle.4.t:0 "[Root.GetLeftKick]"
  KMTPSLeft:0 "[From.GetName] покидает союз"
  KMTPSKick:0 "[From.GetName] исключает нас из союза"
  kmt_powerstruggle.4.d:0 "[Root.GetLeftKickDesc]"
  KMTPSLeftDesc:0 "Поняв, что наши цели больше не совпадают, [From.GetLeader] объявил о том, что сотрудничество между нами прекратится незамедлительно. Они также вышли из нашего альянса."
  KMTPSKickDesc:0 "Посчитав, что мы стали помехой, [From.GetLeader] решил исключить нас из своего альянса, заявив, что наше дальнейшее участие в их плане только затормозит его прогресс."
  kmt_powerstruggle.4.a:0 "Эти предатели!"
  kmt_powerstruggle.5.t:0 "[From.GetName] распускает альянс"
  kmt_powerstruggle.5.d:0 "Осознав, что необходимо радикально изменить курс, [From.GetLeader] созвал собрание всех членов альянса. Заявив, что альянс потерял свое предназначение из-за последних событий в Китае, [From.GetLeader] принял решение распустить его."
  kmt_powerstruggle.5.a:0 "Значит, они хотят забрать всю славу и добычу себе!"
  KMT_ps_we_joined:0 "§GМы присоединились к альянсу §H[From.GetName]§!§!"
  KMT_ps_joined_us:0 "§G§H[From.GetName]§! присоединился к нашему альянсу§!"
  kmt_powerstruggle.6.t:0 "[From.GetName] соглашается"
  kmt_powerstruggle.6.d:0 "[From.GetName] принял нашу просьбу, и теперь мы находимся в одном альянсе. Ожидается дальнейшее сотрудничество."
  kmt_powerstruggle.6.a:0 "Отлично!"
  kmt_powerstruggle.7.t:0 "[From.GetName] отказывается"
  kmt_powerstruggle.7.d:0 "[From.GetName] отклонил возможность для нас сотрудничать во взаимовыгодном альянсе."
  kmt_powerstruggle.7.a:0 "Какое огорчение."
  kmt_powerstruggle.9.t:0 "[From.GetName] покинул Альянс и присоединился к другому"
  kmt_powerstruggle.9.d:0 "[From.GetName] недавно объявил о выходе из нашего альянса и о новом плане сотрудничества с [From.From.GetName]."
  kmt_powerstruggle.9.a:0 "Продажные псы!"
  KMT_ps_left_for_another_tt:0 "§R§H[From.GetName]§! покинул ваш альянс и присоединился к альянсу §H[From.From.GetName]§!"
  KMT_ps_alliance_dismatle_no_member_tt:0 "§RВаш альянс был автоматически распущен из-за отсутствия участников§!"
  KMT_ps_alliance_dismantled_FROMFROM_tt:0 "§RАльянс [From.From.GetName] был автоматически распущен§!"
  KMT_ps_alliance_removed_tt:0 "§R[From.GetName] был автоматически исключен из вашего альянса§!"
  kmt_powerstruggle.10.t:0 "Призыв к оружию"
  kmt_powerstruggle.10.d:0 "Один из членов нашего альянса вступил в вооруженный конфликт с силами, находящимися вне альянса. Согласно неписаному уставу альянса, все члены обязаны помогать друг другу в случае войны. Поскольку с большой вероятностью этот конфликт вскоре перерастет в полномасштабную войну, нам следует прийти на помощь нашему союзнику."
  kmt_powerstruggle.10.a:0 "Наша объединенная мощь победит!"
  kmt_powerstruggle.10.b:0 "Это самоубийство! Мы выходим!"
  kmt_powerstruggle.10.c:0 "Пора уничтожить их обоих."
  kmt_powerstruggle.12.t:0 "[From.GetName] пришел нам на помощь"
  kmt_powerstruggle.12.d:0 "[From.GetName] принял наш призыв к оружию и вступил в войну на нашей стороне."
  kmt_powerstruggle.12.a:0 "Мы победим!"
  kmt_powerstruggle.13.t:0 "[From.GetName] перешёл на сторону наших врагов"
  kmt_powerstruggle.13.d:0 "[From.GetName] решил перейти на сторону наших врагов и выступил против нас."
  kmt_powerstruggle.13.a:0 "Ноль плюс ноль равно ноль."
  kmt_powerstruggle.14.t:0 "[From.GetName] отказался от призыва к оружию"
  kmt_powerstruggle.14.d:0 "[From.GetName] посчитал участие в нашей войне слишком рискованным и решил полностью выйти из альянса."
  kmt_powerstruggle.14.a:0 "Какая трусость!"
  kmt_powerstruggle.15.t:0 "[From.GetName] отступил"
  kmt_powerstruggle.15.d:0 "Понимая, что наша мощь непреодолима, [From.GetLeader] принял мудрое решение не отвечать на призыв своего союзника к оружию."
  kmt_powerstruggle.15.a:0 "Увы, нам придётся вести против них ещё одну войну."
  kmt_powerstruggle.16.t:0 "[From.GetName] провозгласил третью сторону"
  kmt_powerstruggle.16.d:0 "Рассматривая нашу текущую войну как возможность уничтожить всех своих врагов одним ударом, [From.GetLeader] открыто объявил о враждебности по отношению к нам и своим бывшим союзникам."
  kmt_powerstruggle.17.t:0 "Уничтожение [From.From.GetName]"
  #kmt_powerstruggle.17.d:0 "[This.GetKMTPS17Desc]"
  kmt_powerstruggle.17.d:0 "После полной аннексии [From.From.GetName] [From.GetName] и неспособности членов альянса договориться о новом лидере, альянс больше не может поддерживать себя."
  #KMTPS17NewLeader:0 "Альянса больше нет."
  kmt_powerstruggle.17.a:0 "Альянс больше не существует."
  kmt_powerstruggle.18.t:0 "Конец альянса"
  #kmt_powerstruggle.18.d:0 "[This.GetKMTPS18Desc]"
  kmt_powerstruggle.18.d:0 "После недавних потрясений во внутренней политике [From.GetAdjective] они заявили о своей незаинтересованности в сохранении своего текущего альянса и незамедлительно вышли из него. Невозможность прийти к консенсусу по вопросу о следующем лидере привела к тому, что альянс окончательно распался."
  #KMTPS18NewLeader:0 "After a recent upheaval in [From.GetAdjective] internal politics, they have announced their disinterest in maintaining their current alliance and prompty withdrawn from any alliance affairs afterwards. As the last remaining member of the alliance, we have automatically assumed leadership."
  kmt_powerstruggle.19.t:0 "[From.GetName] предаёт альянс"
  kmt_powerstruggle.19.d:0 "В акте предательства [From.GetName] открыл свою враждебность по отношению к [From.From.GetName]. Теперь мы решим, примкнём ли мы к предателю или покинем этот рушащийся альянс."
  kmt_powerstruggle.19.a:0 "Предательство не потерпят!"
  kmt_powerstruggle.19.b:0 "Этот альянс полон предательских личинок, мы больше не останемся."
  kmt_powerstruggle.20.t:0 "[From.GetName] требует преданности"
  kmt_powerstruggle.20.d:0 "Учитывая, что наша администрация в относительно хороших отношениях с Центральным Правительством, [From.GetLeader] потребовал(а), чтобы мы присягнули(и) им на верность в обмен на более тесное сотрудничество."
  kmt_powerstruggle.20.a:0 "На благо обеим сторонам."
  kmt_powerstruggle.20.b:0 "Это коварный план, направленный на подрыв нашей драгоценной автономии!"
  kmt_powerstruggle.21.t:0 "Объединение армии [From.GetName]"
  kmt_powerstruggle.21.d:0 "Нам удалось присоединить армию [From.GetName]. Теперь нам осталось только лишить их автономии, и вскоре на мировой арене появится единый Китай."
  kmt_powerstruggle.21.a:0 "Великолепно!"
  kmt_powerstruggle.22.t:0 "[From.GetName] отклонил(а) присоединение"
  kmt_powerstruggle.22.d:0 "Опасаясь, что подобные действия могут подорвать их автономию, [From.GetName] отверг(ла) наше предложение о присоединении их армии. Это небольшая неудача на пути к реализации нашей цели по созданию единого Китая."
  kmt_powerstruggle.22.a:0 "Они не смогут противостоять нам."
  kmt_powerstruggle.23.t:0 "[From.GetName] получает автономию"
  kmt_powerstruggle.23.d:0 "После ряда политических маневров [From.GetLeader] быстро избавился(ась) от большей части нашего влияния в своем правительстве. Наша хватка над ними значительно ослабла."
  kmt_powerstruggle.23.a:0 "Эти скользкие ублюдки!"
  kmt_powerstruggle.24.t:0 "[From.GetName] посылает экипировку"
  kmt_powerstruggle.24.d:0 "[From.GetName] прислал нам ящики с оружием, заявив, что они являются знаком дружбы."
  kmt_powerstruggle.24.a:0 "С радостью принимаем."
  kmt_powerstruggle.24.b:0 "Мы не примем такой подкуп."
  kmt_powerstruggle.25.t:0 "[From.GetName] принимает наш дар"
  kmt_powerstruggle.25.d:0 "[From.GetName] с радостью принял оружие, которое мы отправили."
  kmt_powerstruggle.25.a:0 "Они, безусловно, знают свое место."
  kmt_powerstruggle.26.t:0 "[From.GetName] отвергает наш дар"
  kmt_powerstruggle.26.d:0 "[From.GetName] отклонил наше предложение и, по некоторым данным, уничтожил отправленные нами ящики."
  kmt_powerstruggle.26.a:0 "Какая наглость!"
  kmt_powerstruggle.27.t:0 "Слухи о присоединении"
  kmt_powerstruggle.27.d:0 "К [Root.GetLeader] дошли слухи о том, что Центральное правительство пытается поглотить наше правительство. Если мы хотим предотвратить свое падение, нам нужно действовать сейчас."
  kmt_powerstruggle.27.a:0 "Может быть, лучше присоединиться к Центральному правительству?"
  KMT_ps_break_free_tt:0 "§GВы можете принять §Hосвобождение от центрального правительства§! решение освободиться и остановить присоединение§!\n"
  kmt_powerstruggle.28.t:0 "Присоединено"
  kmt_powerstruggle.28.d:0 "Наше правительство было включено в Центральное правительство."
  kmt_powerstruggle.28.a:0 "Наше правление закончилось."
  kmt_powerstruggle.29.t:0 "Ультиматум от [From.GetLeader]"
  kmt_powerstruggle.29.d:0 "Получив достаточную поддержку населения, [From.GetLeader] начал осуществлять свою коварную схему по узурпации нашей должности. Теперь их возмутительные требования оказались на столе у [Root.GetLeader]. Они требуют немедленно освободить должность национального лидера и назначить [From.GetLeader] законным преемником.\n\nБольшинство официальных лиц предложили нанести упреждающий удар по этим предателям, но с учетом их нынешнего уровня поддержки населения мы должны ожидать последствий."
  kmt_powerstruggle.29.a:0 "Они заслужили поддержку народа, может, нам тоже стоит их поддержать."
  kmt_powerstruggle.29.b:0 "Этим гадюкам не удастся выкинуть [Root.GetLeader] из офиса!"
  kmt_powerstruggle.30.t:0 "[From.GetLeader] ушел в отставку"
  kmt_powerstruggle.30.d:0 "Тщательно обдумав условия ультиматума, [From.GetLeader] в конце концов решил, что уступка нашим требованиям будет наиболее выгодным решением для нации.\n\nВо время спешно организованной церемонии передачи власти от [From.GetLeader] [Root.GetLeader] пообещал, что Китай под новым руководством достигнет славы и богатства, о которых раньше и не думали. Церемония завершилась громовыми аплодисментами в честь восхождения [Root.GetLeader] к власти."
  kmt_powerstruggle.30.a:0 "Иметь такую власть..."
  kmt_powerstruggle.31.t:0 "[From.GetLeader] отверг ультиматум"
  kmt_powerstruggle.31.d:0 "Вскоре после отправки ультиматума наши осведомители сообщили о мобилизации [From.GetAdjective] войск против нас. Очевидно, что дипломатия потерпела неудачу, и поле битвы станет новым переговорным столом."
  kmt_powerstruggle.31.a:0 "Тщетное сопротивление."
  kmt_powerstruggle.32.t:0 "[From.GetLeader] объявил нам войну"
  kmt_powerstruggle.32.d:0 "Опубликовав список наших \"проступков\" в сохранении национального единства, [From.GetLeader] объявил о начале против нас \"Войны за сохранение единства Китая\". Не имеет значения, обмануло ли название их агрессии кого-нибудь, заставив поверить, что их дела праведны, [Root.GetLeader] знает, что они всего лишь фасад для их предательской попытки узурпации."
  kmt_powerstruggle.32.a:0 "Мы сорвем их маски!"
  kmt_powerstruggle.33.t:0 "Альянс распущен"
  kmt_powerstruggle.33.d:0 "Ваш альянс распущен из-за отсутствия участников."
  kmt_powerstruggle.33.a:0 "Мы можем обойтись сами."
  kmt_powerstruggle.36.t:0 "[From.GetLeader] ставит под сомнение лидерство [Root.GetLeader]"
  kmt_powerstruggle.36.d:0 "Во время недавнего собрания [From.GetLeader] открыто поставил под сомнение способность [Root.GetLeader] управлять страной. Такое мнение вызвало неоднозначную реакцию у других участников собрания."
  kmt_powerstruggle.36.a:0 "Они показали себя как потенциальную угрозу национальной целостности."
  kmt_powerstruggle.37.t:0 "[From.GetLeader] Наносит удар в спину"
  kmt_powerstruggle.37.d:0 "[From.GetLeader] решил напасть на нас за национальное лидерство, пока мы заняты иностранными захватчиками!"
  kmt_powerstruggle.37.a:0 "Коварные псы!"
  kmt_powerstruggle.38.t:0 "[From.GetLeader] Ищет сотрудничества"
  kmt_powerstruggle.38.d:0 "[From.GetLeader] решил пойти по пути коммунизма и теперь ищет нашего сотрудничества."
  kmt_powerstruggle.38.a:0 "Мы приветствуем их."
  kmt_powerstruggle.38.b:0 "Мы им не доверяем."
  kmt_powerstruggle.39.t:0 "[From.GetName] Принимает"
  kmt_powerstruggle.39.d:0 "[From.GetName] принял нашу просьбу о сотрудничестве."
  kmt_powerstruggle.39.a:0 "Хорошо."
  kmt_powerstruggle.40.t:0 "[From.GetName] Отказывается"
  kmt_powerstruggle.40.d:0 "[From.GetName] отклонил нашу просьбу о сотрудничестве."
  kmt_powerstruggle.40.a:0 "Жаль."
  kmt_powerstruggle.41.t:0 "[From.GetName] Ведет кампанию в [From.From.GetName]"
  kmt_powerstruggle.41.d:0 "[From.GetName] сейчас пропагандирует свои идеи в [From.From.GetName]."
  kmt_powerstruggle.41.a:0 "Мы не можем позволить им отнять у нас сторонников."
  kmt_powerstruggle.42.t:0 "[From.GetName] Агитирует рабочих в [From.From.GetName]"
  kmt_powerstruggle.42.d:0 "[From.GetName] взволновал рабочих в [From.From.GetName] своей пропагандой."
  kmt_powerstruggle.42.a:0 "Проклятые смутьяны."
  kmt_powerstruggle.43.t:0 "Коммунисты требуют контроля над правительством"
  kmt_powerstruggle.43.d:0 "Теперь, когда коммунисты заручились поддержкой большинства населения, они пытаются сместить наше нынешнее правительство и установить свое. Они требуют немедленной отставки [Root.GetName] и угрожают применить силу, если мы не подчинится."
  kmt_powerstruggle.43.a:0 "Мы не могли идти против воли народа."
  kmt_powerstruggle.43.b:0 "Мы не должны идти на компромисс с коммунистами!"
  kmt_powerstruggle.44.t:0 "[From.GetLeader] принимает"
  kmt_powerstruggle.44.d:0 "[From.GetLeader] решил выполнить наше требование. Теперь мы контролируем ситуацию."
  kmt_powerstruggle.44.a:0 "Успешная мирная революция!"
  kmt_powerstruggle.45.t:0 "[From.GetLeader] отказывается"
  kmt_powerstruggle.45.d:0 "[From.GetLeader] отказался отказаться от власти."
  kmt_powerstruggle.45.a:0 "Ненасильственное решение провалилось."
  kmt_powerstruggle.46.t:0 "Коммунистическое восстание"
  kmt_powerstruggle.46.d:0 "Коммунисты мобилизовали свои силы и сторонников, чтобы попытаться насильно свергнуть нас!"
  kmt_powerstruggle.46.a:0 "Раздавить этих паразитов!"
  kmt_powerstruggle.47.t:0 "Коммунистическая инфильтрация"
  kmt_powerstruggle.47.d:0 "Мы обнаружили, что несколько коммунистов проникли в нашу администрацию."
  kmt_powerstruggle.47.a:0 "Беспокоящий."
  kmt_powerstruggle.48.t:0 "Наступление на [From.GetName] успешно"
  kmt_powerstruggle.48.d:0 "Наше наступление на [From.From.GetName] в [From.GetName] успешно. Мы захватили территории."
  kmt_powerstruggle.48.a:0 "Работа выполнена хорошо."
  kmt_powerstruggle.49.t:0 "Заявленные [From.From.GetName] действия в [From.GetName]"
  kmt_powerstruggle.49.d:0 "Разведка выявила подозрительную военную активность [From.From.GetName] в [From.GetName]."
  kmt_powerstruggle.49.a:0 "Мы должны подготовиться к тому, что может произойти."
  kmt_powerstruggle.50.t:0 "Наступление в [From.GetName] провалилось"
  kmt_powerstruggle.50.d:0 "Наше наступление на [From.From.GetName] в [From.GetName] провалилось."
  kmt_powerstruggle.50.a:0 "Как это могло произойти?"
  kmt_powerstruggle.51.t:0 "Наступление в [From.GetName] приостановлено"
  kmt_powerstruggle.51.d:0 "В связи с внезапным изменением обстоятельств наше наступление в [From.GetName] против [From.From.GetName] вынуждено остановиться."
  kmt_powerstruggle.51.a:0 "Любопытно."
  kmt_powerstruggle.52.t:0 "Оборона в [From.GetName] успешна"
  kmt_powerstruggle.52.d:0 "Наша оборона в [From.GetName] против захватчиков из [From.From.GetName] привела к нашей победе."
  kmt_powerstruggle.52.a:0 "Надеемся, они больше никогда не вернутся."
  kmt_powerstruggle.53.t:0 "Оборона в [From.GetName] не удалась"
  kmt_powerstruggle.53.d:0 "Нам не удалось защититься от захватчиков из [From.From.GetName] в [From.GetName]. Теперь они захватили контроль над этой территорией."
  kmt_powerstruggle.53.a:0 "Возмутительно!"
  kmt_powerstruggle.54.t:0 "Оборона в [From.GetName] приостановлена"
  kmt_powerstruggle.54.d:0 "В связи с недавним изменением обстоятельств наша защита в [From.GetName] против [From.From.GetName] больше не нужна."
  kmt_powerstruggle.54.a:0 "По барабану."
  kmt_powerstruggle.55.t:0 "[From.GetName] теперь поддерживает [From.From.GetLeader]"
  kmt_powerstruggle.55.d:0 "Из-за недавних действий [From.From.GetLeader] люди в [From.GetName] теперь их поддерживают."
  kmt_powerstruggle.55.a:0 "Мы должны вернуть их поддержку."
  kmt_powerstruggle.56.t:0 "Новый президент"
  kmt_powerstruggle.56.d:0 "Результаты выборов для нас невыгодны. [KMT_president_elect_tag.GetLeader] набрал больше всего голосов и скоро вступит в должность."
  kmt_powerstruggle.56.a:0 "Мы принимаем результат."
  kmt_powerstruggle.56.b:0 "Эти выборы нечестные! [Root.GetLeader] не отдаст место мошеннику!"
  kmt_powerstruggle.57.t:0 "[From.GetLeader] участвует в борьбе за президентство"
  kmt_powerstruggle.57.d:0 "[From.GetLeader] объявил о желании участвовать в президентских выборах."
  kmt_powerstruggle.57.a:0 "Не место им, так ведь?"
  kmt_powerstruggle.58.t:0 "Потеря прогнозируемого большинства"
  kmt_powerstruggle.58.d:0 "Недавний опрос показал, что достаточное количество сторонников передумали, в результате чего наше прогнозируемое число голосов опустилось ниже порога большинства."
  kmt_powerstruggle.58.a:0 "Мы должны действовать быстро, чтобы противостоять этому."
  kmt_powerstruggle.59.t:0 "[From.GetName] присоединяется к коммунистам"
  kmt_powerstruggle.59.d:0 "[From.GetLeader] решил поддержать коммунистов."
  kmt_powerstruggle.59.a:0 "Измена!"
  kmt_powerstruggle.60.t:0 "Создать союз?"
  kmt_powerstruggle.60.d:0 "Перспектива создания союза с другими местными китайскими силами может помочь нам восстановить себя в качестве центрального правительства. Следует ли нам продолжить выполнение плана?"
  kmt_powerstruggle.60.a:0 "Конечно"
  kmt_powerstruggle.60.b:0 "Нет"
  kmt_powerstruggle.61.t:0 "Приглашение от [From.GetLeader]"
  kmt_powerstruggle.61.d:0 "После того, как они впали в немилость, [From.GetLeader] обратился к нам с предложением о союзе, отметив нашу прежнюю лояльность."
  kmt_powerstruggle.61.a:0 "Мы с радостью принимаем."
  kmt_powerstruggle.61.b:0 "Мы хотели бы дистанцироваться от них."
  kmt_powerstruggle.62.t:0 "[From.GetLeader] присоединяется"
  kmt_powerstruggle.62.d:0 "[From.GetLeader] принял наше предложение о союзе."
  kmt_powerstruggle.62.a:0 "Блестяще"
  kmt_powerstruggle.63.t:0 "[From.GetLeader] отвергает"
  kmt_powerstruggle.63.d:0 "[From.GetLeader] отклонил наше предложение о союзе, заявив о своем нежелании продолжать сотрудничать с нами."
  kmt_powerstruggle.63.a:0 "Ничтожные оппортунисты!"

  kmt_rail.1.t:0 "Железная дорога Кантон-Ханькоу завершена"
  kmt_rail.1.d:0 "Железная дорога Кантон-Ханькоу наконец завершена после семи лет строительства."
  kmt_rail.1.a:0 "Отличный день."

  kmtccw.1.t:0 "[From.GetName] выступает посредником в гражданской войне"
  kmtccw.1.d:0 "В ответ на начало гражданской войны [From.GetLeader] отправил делегата в качестве посредника между нами и коммунистами. Они запросили перемирие, чтобы облегчить переговоры.\n\nЕсли мы откажем, они могут пересмотреть свою поддержку нашему правительству."
  kmtccw.1.a:0 "Очень хорошо, мы выполним."
  kmtccw.1.b:0 "Мы не можем ждать, у бандитов будет время оправиться!"
  kmtccw.2.t:0 "Перемирие с [From.GetName]"
  kmtccw.2.d:0 "[From.From.GetName] отправил делегата для посредничества в гражданской войне и убедил [From.GetLeader] отдать приказ о перемирии с нами. Следует ли нам согласиться на это соглашение?"
  kmtccw.2.a:0 "Это отличная возможность для нас."
  kmtccw.2.b:0 "Революцию нельзя останавливать подобным образом!"
  kmtccw.3.t:0 "[From.GetName] принимает переговоры"
  kmtccw.3.d:0 "[From.GetName] принял соглашение о переговорах. Приказ о перемирии теперь вступает в силу."
  kmtccw.3.a:0 "Из этого может выйти что-то хорошее."
  kmtccw.4.t:0 "[From.GetLeader] отклоняет посредничество"
  kmtccw.4.d:0 "[From.GetLeader] отклонил наше предложение посредничества в гражданской войне. Это привело к тому, что больше чиновников поддержало отзыв нашей поддержки им."
  kmtccw.4.a:0 "Мы пытались."
  kmtccw.5.t:0 "[From.GetName] отклоняет переговоры"
  kmtccw.5.d:0 "[From.GetName] отклонил предложенные переговоры."
  kmtccw.6.t:0 "Передача ресурсов коллаборационистам"
  kmtccw.6.d:0 "Коммунисты утверждают, что несколько районов находятся под их контролем, и что наши войска насильно вытеснили их. Теперь они хотят, чтобы эти районы были возвращены им вместе с конфискованным имуществом их коллаборационистов."
  kmtccw.6.a:0 "Мы за мир."
  kmtccw.6.b:0 "Вопиющая наглость! Дай им палец, и они откусят руку!"
  kmtccw.7.t:0 "[From.GetName] Отдаёт Территории"
  kmtccw.7.d:0 "[From.GetName] передал нам несколько районов, откуда, по нашим словам, наши люди были насильно изгнаны. Они также отдали нам конфискованные ресурсы коллаборационистов."
  kmtccw.7.a:0 "Это укрепит нас."
  kmtccw.8.t:0 "[From.GetName] Отклоняет Условия"
  kmtccw.8.d:0 "[From.GetLeader] отклонил наши требования о передаче территорий, переговоры сорвались."
  kmtccw.8.a:0 "Они никогда не были искренни в своих намерениях договориться!"
  kmtccw.9.t:0 "Коалиционное Правительство"
  kmtccw.9.d:0 "Заинтригованный обещаниями коалиционного правительства, посредник оказал давление на [From.GetLeader] с целью создать комитет для его создания. Комитет уже почти разобрался со всем, всё, что им сейчас требуется - наше сотрудничество, чтобы закончить процесс."
  kmtccw.9.a:0 "Бесценная возможность."
  kmtccw.9.b:0 "Мы никогда не собирались этого делать."
  kmtccw.10.t:0 "Коалиционное Правительство Создано"
  kmtccw.10.d:0 "Благодаря сотрудничеству с [From.GetLeader] было создано коалиционное правительство."
  kmtccw.10.a:0 "Наконец-то хоть что-то хорошее."
  kmtccw.11.t:0 "[From.GetLeader] Отклоняет Коалицию"
  kmtccw.11.d:0 "[From.GetLeader] отверг идею коалиции, заявив, что искренность наших усилий служит лишь предлогом."
  kmtccw.11.a:0 "Эти неблагодарные негодяи!"
  kmtccw.12.t:0 "[From.GetLeader] отзывает с переговоров"
  kmtccw.12.d:0 "[From.GetLeader] отозвал с переговоров."
  kmtccw.12.a:0 "Они ставят под угрозу наши усилия!"
  kmtccw.13.t:0 "[From.GetLeader] отклоняет идею коалиционного правительства"
  kmtccw.13.d:0 "[From.GetLeader] отклонил предложенную идею коалиционного правительства. Они считают, что другая сторона неискренна, и коалиционное правительство приведёт только к их использованию."
  kmtccw.13.a:0 "Мы сделали всё от нас зависящее."
  kmtccw.14.t:0 "Перемирие"
  kmtccw.14.d:0 "Поскольку ни одна из сторон переговоров больше не заинтересована в тесном сотрудничестве, единственным возможным вариантом мира на этот раз является перемирие."
  kmtccw.14.a:0 "Придётся смириться."
  kmtccw.14.b:0 "Мы не дадим нашему врагу времени на передышку!"
  kmtccw.15.t:0 "Перемирие подписано"
  kmtccw.15.d:0 "Обе стороны договорились о перемирии. Пройдёт некоторое время, прежде чем гражданская война снова вспыхнет открытым конфликтом."
  kmtccw.15.a:0 "Придётся смириться."
  kmtccw.17.t:0 "[From.GetLeader] отвергает перемирие"
  kmtccw.17.d:0 "[From.GetLeader] счёл перемирие уловкой, чтобы ослабить их и выиграть время для нас, чтобы перегруппироваться. Поэтому отказался его подписывать."
  kmtccw.17.a:0 "Они никогда не хотели мира, эти паразиты!"
  kmtccw.18.d:0 "[From.GetLeader] отказался от участия в переговорах о перемирии. Сначала осудив нас за наше пристрастие к нашему врагу."
  kmtccw.18.a:0 "Мы сделали все что могли."
  kmtccw.19.t:0 "Еще одно посредничество"
  kmtccw.19.d:0 "После провала последнего посредничества делегат из [From.GetName] вернулся, чтобы сделать еще одну попытку установить мир в гражданской войне.\n\nКак и раньше, они запросили прекращение огня и пригрозили отозвать поддержку, если мы не выполним это условие."
  kmtccw.19.a:0 "Хорошо, еще одно прекращение огня."
  kmtccw.19.b:0 "Мы сыты по горло лживыми обещаниями бандитов!"
  kmtccw.20.d:0 "Делегат из [From.From.GetName] вернулся, чтобы сделать еще одну попытку установить мир в гражданской войне. Они убедили [From.GetLeader] отдать приказ о еще одном прекращении огня, но мы всегда можем сделать более радикальный выбор."
  kmtccw.20.a:0 "Хорошо, мы посмотрим, что они подготовили."
  kmtccw.20.b:0 "Они не замедлят нашего продвижения!"
  kmtccw.21.t:0 "[From.GetName] согласен на переговоры"
  kmtccw.21.d:0 "[From.GetName] согласился присоединиться к вторым переговорам."
  kmtccw.21.a:0 "Может на этот раз получится."
  
  KMT_pro_jap_will_change_follow_events_if_yes_tt:0 "Если Япония решит нас поддержать у нас будет"