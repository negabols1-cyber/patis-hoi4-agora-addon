 #HISTORY
 PER_GATHERING_STORM_DESC:0 "В 1919 году Реза, который выбрал себе фамилию Пехлеви, провозгласил себя шахом Ирана в 1925 году с той властью, которую он захватил. Фактически, его идеи были совсем другими. Как Мустафа Кемаль Ататюрк, он мог бы провозгласить себя президентом и спасти свою страну от рук духовенства. Но представители Соединенного Королевства пришли к нему с совсем другим предложением, почему бы ему не стать новым шахом? Под давлением духовенства он принял корону и начал проводить свои революции под титулом шаха."
 
