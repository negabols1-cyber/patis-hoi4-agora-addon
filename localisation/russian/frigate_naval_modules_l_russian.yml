 ship_submarine_tdc_basic:0 "Простой TDC"
 ship_submarine_tdc_basic_desc:0 "TDC (торпедный вычислительный комплекс) — система, которая обеспечивает автоматическое вычисление скорости торпеды, массы, скорости и траектории относительно характеристик цели. В результате точность торпедных атак значительно возрастает."
 ship_submarine_tdc_improved:0 "Улучшенный TDC"
 ship_submarine_tdc_improved_desc:0 "TDC (торпедный вычислитель данных) - система, позволяющая производить автоматические расчеты скорости, массы, траектории и упреждения торпеды с учетом характеристик корабля, по которому ведется прицеливание. В результате существенно повышается точность торпедных атак."
 ship_submarine_tdc_advanced:0 "Передовой TDC"
 ship_submarine_tdc_advanced_desc:0 "TDC (торпедный вычислитель данных) - система, позволяющая производить автоматические расчеты скорости, массы, траектории и упреждения торпеды с учетом характеристик корабля, по которому ведется прицеливание. В результате существенно повышается точность торпедных атак."
 ship_submarine_tdc_modern:0 "Современный TDC"
 ship_submarine_tdc_modern_desc:0 "TDC (торпедный вычислитель данных) - система, позволяющая производить автоматические расчеты скорости, массы, траектории и упреждения торпеды с учетом характеристик корабля, по которому ведется прицеливание. В результате существенно повышается точность торпедных атак."
 ship_destroyer_range_r5000:0 "Дальность 5000 км"
 ship_destroyer_range_r5000_desc:0 "Дальность автономных действий корабля без захода на военно-морскую базу. Определяется запасами топлива и продовольствия, а также емкостью топливных цистерн и складских помещений на борту."
