 ship_fcs_0:0 "Система управления огнем I"
 ship_fcs_0_desc:0 "Вместе с радарами и артиллерийскими директорами эта система может точно предсказывать положение целевого корабля в короткие сроки. Это позволяет вести более точный артиллерийский огонь."
 
 ship_fcs_1:0 "Система управления огнем II"
 ship_fcs_1_desc:0 "Вместе с радарами и артиллерийскими директорами эта система может точно предсказывать положение целевого корабля в короткие сроки. Это позволяет вести более точный артиллерийский огонь."
 
 ship_fcs_2:0 "Система управления огнем III"
 ship_fcs_2_desc:0 "Вместе с радарами и артиллерийскими директорами эта система может точно предсказывать положение целевого корабля в короткие сроки. Это позволяет вести более точный артиллерийский огонь."

 ship_fcs_3:0 "Система управления огнем IV"
 ship_fcs_3_desc:0 "Наряду с радарами и орудийными наводчиками эта система может точно предсказывать позицию целевого корабля в краткие сроки. Это позволяет вести более точную артиллерийскую стрельбу."

 ship_aa_fcs_1:0 "Система управления зенитным огнём I"
 ship_aa_fcs_1_desc:0 "По мере совершенствования самолётов и зенитных снарядов появилась необходимость в системе управления огнём, предназначенной специально для отслеживания воздушных целей. Эта система полностью сосредоточена на отслеживании самолётов и наведении зенитных орудий для нанесения точных и эффективных ударов."
 
 ship_aa_fcs_2:0 "Система управления зенитным огнём II"
 ship_aa_fcs_2_desc:0 "По мере совершенствования самолётов и зенитных снарядов появилась необходимость в системе управления огнём, предназначенной специально для отслеживания воздушных целей. Эта система полностью сосредоточена на отслеживании самолётов и наведении зенитных орудий для нанесения точных и эффективных ударов."
 
 ship_aa_fcs_3:0 "Система управления зенитным огнём III"
 ship_aa_fcs_3_desc:0 "По мере совершенствования самолётов и зенитных снарядов появилась необходимость в системе управления огнём, предназначенной специально для отслеживания воздушных целей. Эта система полностью сосредоточена на отслеживании самолётов и наведении зенитных орудий для нанесения точных и эффективных ударов."
 
 ship_aa_fcs_4:0 "Система управления зенитным огнём IV"
 ship_aa_fcs_4_desc:0 "Так как зенитные орудия и авиация все более усовершенствовались, потребовалась система управления огнем, предназначенная специально для отслеживания воздушных целей. Эта система полностью сконцентрирована на отслеживании самолетов и управлении зенитными орудиями для нанесения точных и эффективных ударов."

 ship_destroyer_depth_charges_1:0 "Глубинные бомбы I"
 ship_destroyer_depth_charges_1_desc:0 "Противолодочное оружие, специально разработанное для уничтожения подводных судов, таких как подлодки."

 ship_destroyer_depth_charges_2:0 "Глубинные бомбы II"
 ship_destroyer_depth_charges_2_desc:0 "Противолодочное оружие, специально разработанное для уничтожения подводных судов, таких как подлодки."

 ship_destroyer_depth_charges_3:0 "Глубинные бомбы III"
 ship_destroyer_depth_charges_3_desc:0 "Противолодочное оружие, специально разработанное для уничтожения подводных судов, таких как подлодки."

 ship_destroyer_depth_charges_4:0 "Глубинные бомбы IV"
 ship_destroyer_depth_charges_4_desc:0 "Противолодочное оружие, специально разработанное для уничтожения подводных судов, таких как подлодки."

 ship_carrier_superstructure_lp:0 "Упрощенная надстройка"
 ship_carrier_superstructure_lp_desc:0 "Надстройка, сделанная значительно ниже обычного. Это затрудняет обнаружение и отслеживание корабля, но также снижает его собственные возможности обнаружения из-за меньших дальностей действия радаров и наблюдателей."

 ship_carrier_superstructure_standard:0 "Стандартная надстройка"
 ship_carrier_superstructure_standard_desc:0 "Стандартная по высоте надстройка. Она обеспечивает сбалансированность между заметностью корабля и его возможностями обнаружения, поэтому часто используется в различных ситуациях."
 
 ship_carrier_superstructure_high:0 "Высокая надстройка"
 ship_carrier_superstructure_high_desc:0 "Эта надстройка выше обычной. Из-за этого корабль будет проще обнаружить наблюдателям и радарам, однако это повысит возможности самого корабля в обнаружении других целей и повысит его дальность обнаружения. Особенно эффективна при проведении разведывательных операций."
 
