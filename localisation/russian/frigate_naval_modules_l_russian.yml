 ship_heavy_armor_layout_bb:0 "Схема бронирования ББ"
 ship_heavy_armor_layout_bb_desc:0 "Данная схема предусматривает равномерное распределение брони по всему кораблю для обеспечения надлежащей защиты от орудий крупного калибра."
 ship_heavy_armor_layout_bc:0 "Схема бронирования BC"
 ship_heavy_armor_layout_bc_desc:0 "Чтобы обеспечить более высокую скорость и лучшую мобильность, схема BC перераспределяет броню таким образом, чтобы прикрывать только жизненно важные системы корабля, при этом игнорируя другие системы. Такой компромисс особенно полезен как для снижения производственных затрат на корабль, так и для повышения его общей скорости."
 ship_cruiser_armor_layout_ca:0 "Схема бронирования CA"
 ship_cruiser_armor_layout_ca_desc:0 "Схема бронирования тяжелых крейсеров разработана так, чтобы поддерживать высокую скорость корабля при обеспечении достойной защиты броней. В результате крейсер может рассчитывать на более высокую надежность и общую защиту, не теряя при этом большую часть своей скорости."
 ship_cruiser_armor_layout_cl:0 "Схема бронирования CL"
 ship_cruiser_armor_layout_cl_desc:0 "Схема бронирования легких крейсеров делает упор на скорость и подвижность. Это делает корабль уязвимым к серьезным повреждениям от огня противника, но в то же время универсальность судна остается непревзойденной."
 ship_carrier_armor_layout_light:0 "Схема легкого бронирования"
 ship_carrier_armor_layout_light_desc:0 "Поскольку авианосцы обычно не находятся на переднем крае морского сражения, легкая схема бронирования является одним из преимуществ, которыми они могут воспользоваться."
 ship_carrier_armor_layout_heavy:0 "Схема тяжелого бронирования"
 ship_carrier_armor_layout_heavy_desc:0 "Став менее популярным с течением времени, сильно бронированный авианосец обнаруживает, что использует ненужную броню. Тем не менее, в некоторых конкретных ситуациях щедро распределенная броня может стать очень полезной, поэтому она еще не совсем вышла из игры."

 ship_aircraft_launch_catapult_1:0 "Самолетная катапульта I"
 ship_aircraft_launch_catapult_1_desc:0 "Самолетная катапульта позволяет кораблю запускать в воздух небольшой разведывательный самолет, что значительно упрощает разведывательные задачи."

