 ship_submarine_command_center_basic:0 "Базовый командный центр"
 ship_submarine_command_center_basic_desc:0 "Рубка с расположенным в ней командным центром. Рубка — одна из важнейших частей корабля, поскольку командующий, находящийся в ней, контролирует движение судна, его двигатели и выполняет множество других важных задач."
 
 ship_submarine_command_center_improved:0 "Улучшенный командный центр"
 ship_submarine_command_center_improved_desc:0 "Рубка с расположенным в ней командным центром. Рубка — одна из важнейших частей корабля, поскольку командующий, находящийся в ней, контролирует движение судна, его двигатели и выполняет множество других важных задач."
 
 ship_submarine_command_center_advanced:0 "Улучшенный командный центр"
 ship_submarine_command_center_advanced_desc:0 "Командная рубка с командным центром. Одна из наиболее важных частей корабля, рубка, с которой управляется движение корабля, его двигатели и ряд других важных задач."
 
  ship_carrier_scout_group_small:0 "Малая разведгруппа"
 ship_carrier_scout_group_small_desc:0 "Разведывательная группа авианосца. В основном состоящая из скоростных разведывательных самолетов, она не особо полезна на поле боя, но незаменима для проведения разведки."
 
 ship_carrier_scout_group_medium:0 "Средняя разведгруппа"
 ship_carrier_scout_group_medium_desc:0 "Разведывательная группа авианосца. В основном состоящая из скоростных разведывательных самолетов, она не особо полезна на поле боя, но незаменима для проведения разведки."

 ship_carrier_scout_group_large:0 "Большая разведгруппа"
 ship_carrier_scout_group_large_desc:0 "Разведывательная группа авианосца. В основном состоящая из скоростных разведывательных самолетов, она не особо полезна на поле боя, но незаменима для проведения разведки."
 
