 ship_mine_sweeper_fr:0 "Тральщик"
 ship_mine_sweeper_fr_desc:0 "Оборудование для установки различных тралов."

 ship_mine_layer_fr:0 "Рельсы для мин"
 ship_mine_layer_fr_desc:0 "Модификации для надводного корабля для переноски и установки морских мин."

 ship_submarine_mine_layer_sub:0 "Трубы для установки мин"
 ship_submarine_mine_layer_sub_desc:0 "Модификации корпуса подводной лодки, позволяющие ей устанавливать мины."

 ship_naval_radar_1:0 "Радар I"
 ship_naval_radar_1_desc:0 "Морской радар предоставляет множество возможностей как надводным кораблям, так и подводным лодкам для обнаружения, отслеживания и нацеливания на другие суда."

 ship_naval_radar_2:0 "Радар II"
 ship_naval_radar_2_desc:0 "Морской радар предоставляет множество возможностей как надводным кораблям, так и подводным лодкам для обнаружения, отслеживания и нацеливания на другие суда."

 ship_naval_radar_3:0 "Радар III"
 ship_naval_radar_3_desc:0 "Морской радар предоставляет множество возможностей как надводным кораблям, так и подводным лодкам для обнаружения, отслеживания и нацеливания на другие суда."

