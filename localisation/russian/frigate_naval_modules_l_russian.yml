 ship_naval_radar_6:0 "Радар VI"
 ship_naval_radar_6_desc:0 "Корабельный радар дает возможность как надводным судам, так и подлодкам обнаруживать, отслеживать и поражать цели."
 
 ship_naval_sonar_1:0 "Сонар I"
 ship_naval_sonar_1_desc:0 "Активный шумовой излучатель, посылающий в воду короткий «пинг», а затем прослушивающий эхо от корпуса подводной лодки."
 
 ship_naval_sonar_2:0 "Сонар II"
 ship_naval_sonar_2_desc:0 "Активный шумовой излучатель, посылающий в воду короткий «пинг», а затем прослушивающий эхо от корпуса подводной лодки."
 
