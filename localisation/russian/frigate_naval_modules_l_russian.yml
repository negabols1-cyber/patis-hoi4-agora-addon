 ship_submarine_hullform_basic:0 "Базовая форма корпуса"
 ship_submarine_hullform_basic_desc:0 "Стандартная форма корпуса без особых преимуществ. Надежная основа для приличного корабля."
 ship_submarine_hullform_hydrodynamic:0 "Гидродинамическая форма корпуса"
 ship_submarine_hullform_hydrodynamic_desc:0 "Корпус, спроектированный специально для достижения высокой скорости и повышенной мобильности в воде. Для достижения таких характеристик инженерам пришлось пожертвовать прочностью судна, но не настолько, чтобы оно стало совершенно незащищенным."
 ship_submarine_hullform_cheap:0 "Дешевый корпус"
 ship_submarine_hullform_cheap_desc:0 "Более легкий и дешевый корпус, изготовленный из второсортных сплавов. В результате общая стоимость производства корабля значительно ниже, но матросы, безусловно, не обрадовались бы, обнаружив алюминиевую фольгу вместо броневых плит."
 ship_destroyer_hullform_basic:0 "Базовый корпус"
 ship_destroyer_hullform_basic_desc:0 "Стандартный корпус, не имеющий никаких компромиссов. Надежная основа для любого достойного судна."
 ship_destroyer_hullform_hydrodynamic:0 "Гидродинамический корпус"
 ship_destroyer_hullform_hydrodynamic_desc:0 "Корпус, спроектированный специально для достижения высокой скорости и повышенной мобильности в воде. Для достижения таких характеристик инженерам пришлось пожертвовать прочностью судна, но не настолько, чтобы оно стало совершенно незащищенным."
 ship_destroyer_hullform_cheap:0 "Дешевый корпус"
 ship_destroyer_hullform_cheap_desc:0 "Более легкий и дешевый корпус, изготовленный из второсортных сплавов. В результате общая стоимость производства корабля значительно ниже, но матросы, безусловно, не обрадовались бы, обнаружив алюминиевую фольгу вместо броневых плит."
 ship_cruiser_hullform_basic:0 "Базовая обшивка"
 ship_cruiser_hullform_basic_desc:0 "Стандартная обшивка без особенностей. Надежный фундамент любого приличного судна."

 ship_cruiser_hullform_hydrodynamic:0 "Гидродинамическая обшивка"
 ship_cruiser_hullform_hydrodynamic_desc:0 "Обшивка, разработанная для высоких скоростей и улучшенной маневренности в воде. Для достижения этих характеристик инженерам пришлось пожертвовать прочностью корабля, но не настолько, чтобы он стал абсолютно беззащитным."

 ship_cruiser_hullform_cheap:0 "Бюджетная обшивка"
 ship_cruiser_hullform_cheap_desc:0 "Лёгкая и дешёвая обшивка из второсортных сплавов. Как результат, стоимость строительства корабля значительно ниже, но матросы вряд ли обрадуются, обнаружив вместо бронепластин алюминиевую фольгу."


 ship_heavy_hullform_basic:0 "Базовая обшивка"
 ship_heavy_hullform_basic_desc:0 "Стандартная обшивка без особенностей. Надежный фундамент любого приличного судна."

 ship_heavy_hullform_hydrodynamic:0 "Гидродинамическая обшивка"
 ship_heavy_hullform_hydrodynamic_desc:0 "Обшивка, разработанная для высоких скоростей и улучшенной маневренности в воде. Для достижения этих характеристик инженерам пришлось пожертвовать прочностью корабля, но не настолько, чтобы он стал абсолютно беззащитным."

 ship_heavy_hullform_cheap:0 "Бюджетная обшивка"
 ship_heavy_hullform_cheap_desc:0 "Лёгкая и дешёвая конструкция корпуса, изготовленная из второсортных сплавов. В результате общие затраты на производство корабля значительно ниже, но моряки, безусловно, не оценят то, что их поставили на алюминиевую фольгу вместо броневых пластин."

 ship_carrier_hullform_basic:0 "Базовая конструкция корпуса"
 ship_carrier_hullform_basic_desc:0 "Стандартная конструкция корпуса, не дающая никаких преимуществ. Твёрдая основа для любого достойного корабля."

 ship_carrier_hullform_hydrodynamic:0 "Гидродинамическая конструкция корпуса"
 ship_carrier_hullform_hydrodynamic_desc:0 "Корпус, специально разработанный для достижения высоких скоростей и улучшенной манёвренности на воде. Чтобы добиться таких качеств, инженеры пожертвовали прочностью корабля, но не до такой степени, чтобы он стал совершенно беззащитным."

 ship_carrier_hullform_cheap:0 "Дешёвая конструкция корпуса"
 ship_carrier_hullform_cheap_desc:0 "Лёгкая и дешёвая конструкция корпуса, изготовленная из второсортных сплавов. В результате общие затраты на производство корабля значительно ниже, но моряки, безусловно, не оценят то, что их поставили на алюминиевую фольгу вместо броневых пластин."

 ship_submarine_range_r1000:0 "Дальность хода 1000 км"
 ship_submarine_range_r1000_desc:0 "Дальность, на которой корабль может действовать автономно без посещения военно-морской базы. Это сумма топлива и продовольствия, которое хранится на корабле, а также объём складских помещений и топливных баков на борту."

 ship_submarine_range_r2000:0 "Дальность хода 2000 км"
 ship_submarine_range_r2000_desc:0 "Дальность, на которой корабль может действовать автономно без посещения военно-морской базы. Сумма топлива и продуктов питания, хранящихся на корабле, а также количество мест для хранения и топливных баков на борту."

 ship_submarine_range_r3000:0 "Дальность действия 3000 км"
 ship_submarine_range_r3000_desc:0 "Дальность, на которой корабль может действовать автономно без посещения военно-морской базы. Сумма топлива и продуктов питания, хранящихся на корабле, а также количество мест для хранения и топливных баков на борту."
 
