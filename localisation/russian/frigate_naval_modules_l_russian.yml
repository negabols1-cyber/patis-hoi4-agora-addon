 ship_submarine_stealth_basic:0 "Базовая малозаметность"
 ship_submarine_stealth_basic_desc:0 "Замысловатая система звукоподавления, вмонтированная в корпус корабля. Обеспечивает подводной лодке лучшие возможности скрытности от гидролокаторов и РЛС."
 ship_submarine_stealth_improved:0 "Улучшенная скрытность"
 ship_submarine_stealth_improved_desc:0 "Замысловатая система звукоподавления, вмонтированная в корпус корабля. Обеспечивает подводной лодке лучшие возможности скрытности от гидролокаторов и РЛС."
 ship_submarine_stealth_advanced:0 "Продвинутая скрытность"
 ship_submarine_stealth_advanced_desc:0 "Замысловатая система звукоподавления, вмонтированная в корпус корабля. Обеспечивает подводной лодке лучшие возможности скрытности от гидролокаторов и РЛС."
 ship_submarine_stealth_modern:0 "Современная скрытность"
