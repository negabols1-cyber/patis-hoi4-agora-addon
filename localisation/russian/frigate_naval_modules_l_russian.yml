 ship_carrier_open_hangar_50_x6_t1:0 "Открытый ангар на 6 самолетов"
 ship_carrier_open_hangar_50_x6_t1_desc:0 "Открытым ангаром проще управлять, чем закрытым, риск возгорания в нем меньше, он не требует наличия лифта и других механизмов, которые могут снизить общую надежность корабля."

 ship_carrier_open_hangar_50_x12_t1:0 "Открытый ангар на 12 самолетов"
 ship_carrier_open_hangar_50_x12_t1_desc:0 "Открытый ангар требует меньше ресурсов на содержание и ремонт, к тому же он менее пожароопасен. Также нет надобности в лифте и других механизмах, что повышает надёжность корабля"

