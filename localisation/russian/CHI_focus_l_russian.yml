 CHI_ministry_of_national_defense:0 "Министерство национальной обороны"
 CHI_open_research_institute:0 "Институт открытых исследований"
 CHI_tax_reform:0 "Налоговая реформа"
 CHI_promote_fascism:0 "Возродить движение новой жизни"
 CHI_promote_fascism_desc:0 "Над нашей нацией долго насмехались из-за ее слабости и неспособности. Мы должны продолжить наши прежние усилия по созданию националистического населения, чтобы сделать Китай снова великим."
 CHI_increase_german_cooperation:0 "Усилить китайско-германское сотрудничество"
 CHI_increase_german_cooperation_desc:0 "Мы должны больше сотрудничать с Германией. Таким образом, мы будем иметь преимущество перед нашими врагами."
 CHI_pro_japanese_government:0 "Поддержка прояпонской фракции"
 CHI_pro_japanese_government_desc:0 "Может быть, вместо того, чтобы противодействовать японцам, мы сможем найти более мирное решение?"
 CHI_japanese_advisors:0 "Японские советники"
 CHI_japanese_advisors_desc:0 "Мы можем запросить у наших японских друзей нескольких советников, чтобы помочь нашей армии."
 CHI_militarism_focus:0 "Национальная военная индоктринация"
 CHI_militarism_focus_desc:0 "Говорят: «Не используйте хорошее железо для изготовления гвоздей, не используйте хороших людей для изготовления солдат». Такое пренебрежение к военным ни к чему не приведет. Мы должны повысить авторитет служб в глазах людей."
 CHI_ban_communism:0 "Восстановить белый террор"
 CHI_ban_communism_desc:0 "Мы не можем рисковать тем, что коммунистические ячейки проникнут на контролируемую нами территорию, чтобы поднять восстание. Мы должны возобновить гражданские и военные чистки, чтобы гарантировать отсутствие следов коммунизма в нашем владении."
 CHI_claim_the_empire_borders:0 "Восстановить империю"
 CHI_claim_the_empire_borders_desc:0 "Китай был самой могущественной нацией на Земле на протяжении большей части цивилизованной истории. Мы должны занять свое место под солнцем."
 CHI_military_first:0 "Сначала армия"
 CHI_military_first_desc:0 "«Информирование» нашего народа о преимуществах войны и экспансии обеспечит нам возможность убивать монстров за границей."
 CHI_war_fanaticism:0 "Военный фанатизм"
 CHI_war_fanaticism_desc:0 "Недостаточно сражаться и умирать. Мы должны сражаться и побеждать любой ценой. Пусть наша кровь снова сделает Китай центром мира!"
 CHI_demand_lands_from_soviet:0 "Требовать центральную степь и Синьцзян"
 CHI_demand_lands_from_soviet_desc:0 "..."
 CHI_demand_indochina:0 "Требовать Индокитай"
 CHI_demand_indochina_desc:0 "..."
 CHI_threaten_siam_to_join_the_alliance:0 "Угрожать Сиаму присоединением к альянсу"
 CHI_threaten_siam_to_join_the_alliance_desc:0 "..."
 CHI_backstab_the_soviet_union:0 "Нанести удар в спину Советскому Союзу"
 CHI_backstab_the_soviet_union_desc:0 "Теперь, когда Советский Союз занят, мы можем нанести удар по ним там, где они меньше всего этого ожидают."
 CHI_demand_ports:0 "Китайские порты"
 CHI_demand_ports_desc:0 "Отделение торговых портов по неравным договорам является самым унизительным для китайцев, поскольку западники ограничивают нашу торговлю и делят наши земли. Мы должны вернуть эти земли и снова сделать Китай великим!"
 CHI_join_the_axis:0 "Присоединиться к Оси"
 CHI_join_the_axis_desc:0 "Пришло время нам укрепить наши связи с нашими немецкими друзьями."
 CHI_oust_colonizers:0 "Изгнать колонизаторов"
 CHI_oust_colonizers_desc:0 "Колониализм еще хуже империализма. Поэтому мы освободим наших азиатских братьев от зла западных колонизаторов!"
