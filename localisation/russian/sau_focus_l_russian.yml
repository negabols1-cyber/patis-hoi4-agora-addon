 SAU_saudi_arabian_armed_forces: "[GetArmedForcesName]"
 SAU_royal_saudi_arabian_armed_forces: "Королевские саудовские вооруженные силы"
 SAU_saudi_arabian_federation_forces: "Вооруженные силы Объединенной арабской федерации"
 SAU_saudi_arabian_state_forces: "Вооруженные силы Объединенного арабского штата"
 SAU_saudi_arabian_communist_army_name: "Аравийская народная революционная армия"
 SAU_saudi_arabian_armed_forces_desc: "Наши королевские вооруженные силы Саудовской Аравии родились от решимости нашего лидера Ибн Сауда, который объединил племена этой обширной земли под одним знаменем. В те первые дни наши смелые воины, преданные Палату Саудов, твердо стояли, чтобы защитить нашу родину и сохранить свое единство от любой угрозы."
 SAU_saudi_army_innovations: "Инновации саудовской армии"
 SAU_saudi_army_innovations_desc: "По мере роста нашего королевства мы узнаем важность современных военных методов. Мы начинаем внедрять новую тактику и организационные реформы, чтобы лучше подготовить наши силы к проблемам, которые находятся впереди. Принимая инновации в обучении и командовании, мы стремимся превратить нашу армию из коллекции племенных воинов в дисциплинированное и эффективное учреждение."
 SAU_lessons_of_1934: "Уроки 1934 года"
 SAU_lessons_of_1934_desc: "Конфликт с Йеменом в 1934 году научил нас ценным урокам о реалиях современной войны. Мы стали свидетелями важности дисциплинированных войск, эффективного общения и скоординированной стратегии при преодолении противников. Храбрость наших воинов была неоспоримой, но мы поняли, что одной мужества недостаточно."
 SAU_open_military_school_in_taif: "Открытая военная школа в Таиф"
 SAU_open_military_school_in_taif_desc: "Чтобы построить сильную и дисциплинированную армию, важно обучать и обучать наших будущих офицеров лучшим знаниям и навыкам. Открытие военной школы в Таиф послужит краеугольным камнем для этих усилий, обеспечивая структурированное образование и современную военную подготовку для нашей молодежи."
 SAU_establish_the_general_staff_presidency: "Установить президентство генерального персонала"
 SAU_establish_the_general_staff_presidency_desc: "Чтобы более эффективно координировать наши военные усилия, крайне важно установить централизованную командную структуру. Создание президентства генерального персонала объединит стратегическое планирование, оперативное командование и общение в соответствии с одним органом. Это знаменует важный шаг к модернизации защиты нашего королевства."
 SAU_modernize_the_army: "Модернизировать армию"
 SAU_modernize_the_army_desc: "Модернизация гарантирует, что наши силы остаются способными защищать наши границы и поддерживать внутренний порядок. Принимая прогресс, уважая наши традиции, мы построим армию, достойную предстоящих испытаний."
 SAU_desert_training: "Обучение пустыни"
 SAU_desert_training_desc: "Огромные пустыни нашего королевства - это как наш дом, так и наша самая сильная естественная защита. Чтобы полностью использовать это преимущество, мы должны эффективно обучать наших солдат сражаться, выжить и маневрировать в условиях пустыни. Мастерство суровой среды даст нам верх над любого врага, незнакомого с его проблемами."
 SAU_develop_tribal_army: "Развивать племенная армия"
 SAU_develop_tribal_army_desc: "Разработав племенную армию, которая уважает наше наследие, используя новые методы, мы создадим силу, способную защищать огромные территории нашего королевства и сохранить единство нашего народа."
 SAU_integrate_tribal_army_into_armed_forces: "Интегрировать племенную армию в вооруженные силы"
 SAU_integrate_tribal_army_into_armed_forces_desc: "Наши племенные воины были основой нашей защиты, но будущее требует объединенных и сплоченных военных. Эта интеграция будет способствовать единству среди наших бойцов, улучшит координацию и гарантирует, что все служат под одной командой с общей целью. Вместе мы построим устойчивую армию, чтобы защитить наше королевство и ее народ."
 SAU_introduction_of_support_units: "Внедрение поддержки подразделений"
 SAU_introduction_of_support_units_desc: "Сила армии заключается не только в ее передовых солдатах, но и в поддержке, которая заставляет их двигаться, поставлять и сообщать. Чтобы удовлетворить требования современной войны, мы должны установить выделенные подразделения поддержки - инженеры, медики, сигнальные корпусы и специалисты по логистике."
 SAU_artillery_effort: "Артиллерийские усилия"
 SAU_artillery_effort_desc: "Укрепляя наш артиллерийский корпус, мы получим огневую мощь, необходимую для поддержки нашей пехоты, защищать наши границы и удержать тех, кто угрожает нашему суверенитету. Это необходимый шаг к созданию всесторонней и современной армии."
 SAU_reinvigorate_the_army: "Оживить армию"
 SAU_reinvigorate_the_army_desc: "По мере того, как мир вокруг нас становится все более неопределенным, мы должны вдохнуть новую жизнь в наши вооруженные силы. Это означает не только расширение наших чисел, но и усовершенствование нашей командной структуры, повышение морального состояния и обеспечение того, чтобы каждый солдат служит с гордостью и целью."
 SAU_new_weapons_new_tactics: "Новое оружие, новая тактика"
 SAU_new_weapons_new_tactics_desc: "Победа в современной войне больше не зависит исключительно от мужества или чисел - для этого требуются правильные инструменты и правильную стратегию. По мере развития военных технологий, так же как и наши доктрины и подход на поле боя."
 SAU_saudi_special_forces: "Саудовский спецназ"
 SAU_saudi_special_forces_desc: "Эти саудовские спецназы будут служить резким краем наших военных, готовых нанести удар, где не могут обычные подразделения. Их действия откроют путь для больших достижений, ослабит моральный дух противника и продемонстрируют растущую изысканность наших вооруженных сил."
 SAU_arabian_armored_corps: "Аравийский бронированный корпус"
 SAU_arabian_armored_corps_desc: "Мы начнем формировать наш собственный арабский броневик, объединяя мобильность, защиту и поразительную силу в один. С танками и бронированными автомобилями, адаптированными к нашей местности, мы обеспечим, чтобы наша армия была готова решительно реагировать на угрозы, где бы они ни возникали в наших обширных пустынях."
 SAU_army_reform: "Армейская реформа"
 SAU_army_reform_desc: "Наши военные неуклонно росли в размерах и опыте, но для удовлетворения требований меняющегося мира мы должны реформировать его изнутри. Устаревшие сооружения, непоследовательные тренировки и логистические недостатки должны быть рассмотрены. Пришло время начать реформы в армию."
  #################### 
  ####### AIR ######## 
  #################### 
 SAU_saudi_air_innovations: "Saudi Air Innovations"
 SAU_saudi_air_innovations_desc: "Мы начнем изучать иностранные достижения и постепенно разрабатывать наши собственные аэродиальные стратегии и оборудование. Воздушная рука Королевских вооруженных сил Саудовской Аравии станет символом нашей готовности адаптироваться и нашей решимости защитить наше небо."
 SAU_open_jeddah_military_airstrip: "Открыть военную взлетно -посадочную полосу"
 SAU_open_jeddah_military_airstrip_desc: "Чтобы закрепиться в военной авиации, мы должны сначала построить требуемую инфраструктуру. Джедда, как прибрежный центр и ворота в священные города, является идеальным местом для нашей первой преданной военной взлетно -посадочной полосы. \ N \ nthis взлетно -посадочная полоса будет служить учебной площадкой для будущих пилотов и базы для наших первых развертываний самолетов. Это первый шаг в обеспечении контроля Саудовской Аравии над нашим небом и развития современных ВВС."
 SAU_pilot_training_program: "Программа обучения пилота"
 SAU_pilot_training_program_desc: "Чтобы построить способные воздушные силы, квалифицированные пилоты необходимы. Мы создадим структурированную программу обучения для развития талантов наших молодых людей, обучая их не только тому, как летать, но также дисциплину и ответственность, которые поставляются с защитой нашего неба. \ N \ nthis программа знаменует собой начало новой эры для вооруженных сил Королевских Саудовских островов, готовив поколение, готовое к решению проблем современной войны с эфира."
 SAU_construct_more_air_bases: "Построить больше воздушных баз"
 SAU_construct_more_air_bases_desc: "Расширение нашей сети воздушных баз является важным шагом на пути к созданию устойчивых и отзывчивых Королевских ВВС Саудовской Аравии, готовых встретить любую угрозу от неба."
 SAU_purchase_foreign_aircraft: "Купить иностранные самолеты"
 SAU_purchase_foreign_aircraft_desc: "Чтобы быстро построить эффективные ВВС, мы должны приобрести проверенные самолеты из -за рубежа. Эти машины предоставят нашим пилотам инструменты, необходимые для защиты нашего неба и проецирования нашей власти по всему региону. \ N \ npurchasing Foreign Musters - это практический шаг к модернизации наших сил, в то время как мы разрабатываем свои собственные авиационные возможности."
 SAU_construct_radar: "Строить радар"
 SAU_construct_radar_desc: "Раннее обнаружение вражеских самолетов жизненно важно для эффективной защиты. Чтобы защитить наше небеса, мы будем инвестировать в построение радиолокационных установок в ключевых местах по всему королевству. \ Nthe Radar Radar Stations даст нам продвинутое предупреждение о входящих угрозах, позволяя нашим силам быстро реагировать и защищать нашу территорию более эффективно."
 SAU_national_aircraft_production: "Национальное производство самолетов"
 SAU_national_aircraft_production_desc: "Чтобы обеспечить нашу независимость в небе, мы должны установить возможность производства самолетов в наших собственных границах. Полезывая исключительно на иностранных поставщиков, оставляет нас уязвимыми во времена конфликта. Развивая национальную авиационную отрасль, мы заложим основу для устойчивого роста, технической экспертизы и большей уверенности в защите воздушного пространства нашего королевства."
 SAU_fighter_focus: "Истребитель фокусировки"
 SAU_fighter_focus_desc: "Защита контроля над небом требует выделенного акцента на разработку и развертывание истребительных самолетов. Эти ловкие и могущественные самолеты будут служить первой линией защиты от любых воздушных угроз для нашего королевства. \ N \ nby, сосредоточившись на бойцах, мы стремимся повысить ловкость и борьбу наших ВВС, обеспечивая безопасность наших границ и суверенитет нашей нации."
 SAU_tac_focus: "Тактический бомбардировщик"
 SAU_tac_focus_desc: "Тактические бомбардировщики необходимы для поражения ключевых позиций противника и поддержки сухопутных войск. Их точность и сила позволят нам разрушить деятельность противника и защитить наши продвинутые войска."
 SAU_naval_bomber_effort: "Военно -морской бомбардировщик"
 SAU_naval_bomber_effort_desc: "Хотя сила нашего королевства лежит в основном на суше, окружающие нас моря нельзя упускать из виду. Развивающиеся военно -морские бомбардировщики расширят наше охват, позволяя нам защищать наши побережья и оспаривать любые морские угрозы. \ Nby, инвестируя в военно -морские бомбардировщики, мы стремимся защитить жизненно важные морские маршруты и повысить общую безопасность границ нашей страны."
 SAU_modernized_royal_saudi_airforce: "Модернизированная королевская саудовская воздушная сила"
 SAU_modernized_royal_saudi_airforce_desc: "Наши ВВС входят в новую эру. Благодаря улучшению обучения, современных самолетов и лучшей инфраструктуры, королевская саудовская воздушная сила станет способной и дисциплинированной ветвью наших вооруженных сил."
 SAU_rocketry_effort: "Ракетические усилия"
 SAU_rocketry_effort_desc: "В то время как все еще находится в зачаточном состоянии во всем мире, развитие ракетинга дает большие обещания для будущего войны. Мы начнем исследовать эту новую технологию, чтобы исследовать ее потенциал для обороны и стратегического преимущества."
  #################### 
  ####### NAVY ####### 
  #################### 
 SAU_saudi_navy_innovations: "Саудовские флоты инновации"
 SAU_saudi_navy_innovations_desc: "Мы должны начать сосредоточиться на модернизации и расширении наших военно -морских сил. Сильный флот необходим для защиты наших береговых и морских интересов. Инвестиции в новые корабли и технологии обеспечат наше будущее в море."
 SAU_establish_coast_guard_authority: "Установить власть береговой охраны"
 SAU_establish_coast_guard_authority_desc: "Создание выделенной береговой охраны улучшит нашу способность защищать прибрежные воды и торговые маршруты. Этот орган будет наблюдать за морской безопасностью и быстро реагирует на любые угрозы. Сильная береговая охрана жизненно важна для защиты нашего суверенитета и экономических интересов."
 SAU_merchant_fleet: "Торговый флот"
 SAU_merchant_fleet_desc: "Разработка сильного торгового флота имеет важное значение для поддержки нашей растущей торговли и экономики. Надежная доставка обеспечивает устойчивый поток товаров и ресурсов в наши порты. Инвестирование в наш торговый флот укрепит нашу позицию в региональной торговле."
 SAU_conversion_of_civilian_vessels: "Обращение гражданских судов"
 SAU_conversion_of_civilian_vessels_desc: "Преобразование гражданских кораблей для военного использования быстро и экономически расширит наши военно-морские возможности. Этот подход позволяет нам укрепить нашу защиту, не ожидая новой строительства. Это гарантирует, что мы лучше подготовлены к любым морским угрозам, которые могут возникнуть."
 SAU_expand_dockyard_facilities: "Расширить объекты верфи"
 SAU_expand_dockyard_facilities_desc: "Мы должны построить дополнительные верфи для увеличения нашего судостроения. Производство большего количества судов укрепит наше военно -морское присутствие и готовность. Расширение этих объектов жизненно важно для устойчивого морского роста и защиты."
 SAU_construct_naval_bases: "Построить военно -морские базы"
 SAU_construct_naval_bases_desc: "Создание новых военно -морских баз улучшит наш стратегический охват вдоль побережья. Эти базы будут поддерживать эксплуатацию флота и повысить безопасность морских. Сеть хорошо расположенных оснований имеет решающее значение для поддержания контроля над нашими водами."
 SAU_destroyer_focus: "Разрушитель фокус"
 SAU_destroyer_focus_desc: "Разрушители необходимы для защиты наших побережья и сопровождения более крупных судов. Их скорость и универсальность делают их идеальными для проблем наших вод. Инвестиции в эсминцы значительно расширит наши возможности военно -морской обороны."
 SAU_submarine_focus: "Подводная фокус"
 SAU_submarine_focus_desc: "В то время как подводные лодки могут иметь ограниченное использование в наших мелких морях, они ценны в более глубоких водах. Их скрытность и поразительная сила могут сдерживать врагов далеко от наших берегов. Разработка скромной подводной силы будет эффективно дополнять нашу военно -морскую стратегию."
 SAU_purchase_foreign_ships: "Покупать иностранные корабли"
 SAU_purchase_foreign_ships_desc: "Приобретение зарубежных кораблей ускорит расширение нашего флота. Эти суда приносят проверенные проекты и передовые технологии в наш флот. Покупка кораблей за границей помогает нам быстро укрепить морскую оборону."
 SAU_convoy_escort_focus: "Конвой эскорт фокус"
 SAU_convoy_escort_focus_desc: "Защита наших конвоя жизненно важна для обеспечения безопасного транспортировки товаров и ресурсов. Корабли сопровождения будут защищаться от атак противника и сохранять линии снабжения. Сильная защита конвоя обеспечивает нашу экономику и военные операции."
 SAU_expand_the_naval_academy: "Расширить военно -морскую академию"
 SAU_expand_the_naval_academy_desc: "Мы должны расширить Военно -морскую академию, чтобы обучить более квалифицированных офицеров для нашего растущего флота. Усовершенствованное образование улучшит лидерство и техническую экспертизу военно -морского флота. Инвестирование в военно -морское обучение обеспечивает способность и профессиональную морскую силу."
 SAU_found_royal_saudi_navy: "Нашел Королевский флот Саудовской Аравии"
 SAU_found_royal_saudi_navy_desc: "Мы должны официально создать Королевский флот Саудовской Аравии, чтобы защитить наши побережья и интересы. Единый флот поможет нам защитить наш суверенитет и безопасные морские торговые пути. Создание этой силы важно для полного реализации преимуществ наших усилий."
 SAU_modern_navy: "Современный флот"
 SAU_modern_navy_desc: "Мы стремимся построить современный флот, оснащенный новейшими технологиями и судами. Это улучшит наши защитные возможности и защитит наши морские интересы. Современный флот имеет решающее значение для обеспечения нашего будущего на морях."
 SAU_coastal_defense_navy: "Военно -морской флот прибрежной обороны"
 SAU_coastal_defense_navy_desc: "Наш флот должен сосредоточиться на защите береговой линии от любых потенциальных угроз. Укрепление прибрежной защиты будет защищать наши порты и прибрежные города. Специальный военно -морской флот обеспечивает безопасность наших берегов и воды."
