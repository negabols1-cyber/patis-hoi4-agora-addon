  #################### 
 SAU_foundations_of_the_arab_league: "Аль Ватан Аль Акбар"
 SAU_foundations_of_the_arab_league_desc: "Моя дорогая родина - величайшая из родины \ nday за днем ​​\ nits славы, размножаясь, ее жизнь изобилует победами \ nmy на родине, и становится свободной \ nwatani ... Ватани \ n \ noh моя родина, ваша любовь управляет моим сердцем. Гораздо больше всего все существование \ nthan vershynity \ noh, моя родина \ n \ nsweet - это слава, заполняющая наши сердца \ nsweet, - это победа, обливающая наш флаг \ nsweet - это единство. Jeddah \ NTHERE - та же самая песня из самого красивого единства - единство всех арабских людей \ nour национального единства, которое мы защищаем. increased\nAnd the story of Port Said repeated itself\nThe Arab nations lived and were victorious\n\nOh my homeland, the most precious homeland in the world\nMy homeland, you are a castle of freedom\nYou are the one that builds with those who build\nAnd the one that tears down oppression\nYour voice is free and Arabic\nwith no Eastern nor Western echos\nYour dirt is fit to be eyeliner for my eyes\nThe fragrance of your air is my rebirth\nYou are my love\nOh, my Arabic homeland\n\nOh my homeland, you are a revolution against their occupation\nFill your islands with fire, destroy them\nIf we are all martyred upon your lands\nThe rocks of our mountains will fight them\nOccupation will end by our hands\nIts time in this world is up and done\nNot in Algeria, Not in Оман, \ nwill Революция исчезает перед лицом угнетения \ Nuntil Триумф арабского народа. Поклонение в нашем сердце \ Nyou - это родина, чья жизнь полна суверенитета \ nemeland of the Arabic Homeland \ n \ Noh My Gumland, вы ползаете к своим победам. Слава \ nmy арабская родина"
 SAU_coronation_of_crown_prince: "Коронация наследного принца"
 SAU_coronation_of_crown_prince_desc: "Настало время официально Коронный Принц Принца Сауда Бин Абдулазиз Аль Сауд. Его руководство обеспечит непрерывность дома Саудов и наследие его отца Абдулазиза. С мудростью и верностью он будет нести нацию вперед."
 SAU_establish_the_arab_league: "Создать Лигу арабских"
 SAU_establish_the_arab_league_desc: "Мы согласились с нашими соседями, теперь пришло время формализовать Лигу арабских арабских лиг и объявить об этом миру. Эта лига послужит платформой для сотрудничества и единства среди арабских стран. Вместе мы будем защищать наши интересы и голос."
 SAU_create_arabian_economic_council: "Создать арабский экономический совет"
 SAU_create_arabian_economic_council_desc: "Мы создадим Аравийский экономический совет для координации усилий по развитию по всему региону. Этот совет будет способствовать торговле, инвестициям и экономическому сотрудничеству между арабскими государствами. Его работа укрепит наше общее процветание и стабильность."
 SAU_create_the_arabian_central_bank: "Создать центральный банк Аравии"
 SAU_create_the_arabian_central_bank_desc: "Мы создадим Центральный банк Аравии для объединения наших финансовых систем и стабилизации экономики. Это учреждение будет регулировать валюту и поддерживать экономический рост по всему региону. Его творение знаменует собой значительный шаг к экономическому суверенитету."
 SAU_increase_research_budget: "Увеличить бюджет на исследования"
 SAU_increase_research_budget_desc: "Мы увеличим исследовательский бюджет для развития инноваций и технологического прогресса. Инвестиции в знания необходимы для будущего процветания нашей нации. Благодаря этому обязательству мы стремимся построить более сильное и более продвинутое общество."
 SAU_create_arabian_defense_council: "Создать совместный совет обороны"
 SAU_create_arabian_defense_council_desc: "Мы создадим совместный совет обороны для координации военных усилий арабских стран. Этот совет повысит нашу коллективную безопасность и готовность к внешним угрозам. Юнайтед, мы стоим сильнее, чтобы защитить наши земли и людей."
 SAU_joint_arabian_defense_forces: "Совместные вооруженные силы"
 SAU_joint_arabian_defense_forces_desc: "Мы будем сформировать совместные вооруженные силы для укрепления сотрудничества и единства среди арабских армий. Эта инициатива улучшит координацию и эффективность в защите нашего региона. Вместе мы обеспечим длительный мир и безопасность."
 SAU_connect_capitals_with_railways: "Подключить столицы с железными дорогами"
 SAU_connect_capitals_with_railways_desc: "Мы подключаем столицы с железными дорогами для улучшения связи и торговли между ними. Этот инфраструктурный проект будет способствовать экономическому росту и национальному единству. Лучшие связи означают более сильную и более интегрированную родину."
 SAU_increase_military_deterrence: "Увеличить военное сдерживание"
 SAU_increase_military_deterrence_desc: "Мы увеличим наше военное сдерживание, чтобы защитить наш суверенитет и отговорить любых потенциальных агрессоров. Сильная защита жизненно важна для поддержания мира в регионе. Наша приверженность безопасности обеспечит стабильность нашей родины."
 SAU_pool_technical_knowhow: "Пул технических ноу-хау"
 SAU_pool_technical_knowhow_desc: "Мы будем объединять технические ноу-хау со всего региона для продвижения наших отраслей и инфраструктуры. Обмен опытом ускорит наше развитие и укрепит нашу уверенность в себе. Вместе мы строим современное и процветающее королевство."
 SAU_demand_independence_in_the_middle_east: "Требовать независимости на Ближнем Востоке"
 SAU_demand_independence_in_the_middle_east_desc: "Мы потребуем независимости для всех наций на Ближнем Востоке, чтобы обеспечить свободу и суверенитет для нашего народа. Это важный шаг к региональной стабильности и единству. Наше общее будущее зависит от достоинства и самоопределения каждой нации."
 SAU_establish_the_united_arab_state: "Создать Объединенное арабское государство"
 SAU_establish_the_united_arab_state_desc: "Мы стремимся установить Объединенное Арабское государство как символ единства и сотрудничества между арабскими нациями. Это укрепит наши политические и экономические связи и обеспечит взаимное процветание. Вместе мы построим более сильную и влиятельную область."
 SAU_establish_the_united_arab_federation: "Создать Объединенную арабскую федерацию"
 SAU_establish_the_united_arab_federation_desc: "Мы создадим Объединенную арабскую федерацию, чтобы объединить наши нации под общей целью и общее управление. Эта федерация улучшит сотрудничество и способствует миру во всем арабском мире. Вместе мы стремимся к стабильности и прогрессу для всех наших людей."
 SAU_ministry_of_state_planning: "Нашел Министерство государственного планирования"
 SAU_ministry_of_state_planning_desc: "Мы обнаружим, что Министерство государственного планирования будет эффективно координировать развитие нашей страны и экономический рост. Это министерство направит наши ресурсы к созданию процветающего будущего. Тщательное планирование необходимо для прогресса нашего королевства."
 SAU_supreme_security_directorate: "Верховное управление безопасности"
 SAU_supreme_security_directorate_desc: "Мы установим Верховное управление безопасности, чтобы обеспечить безопасность и стабильность нашего королевства. Это учреждение будет контролировать внутреннюю безопасность и защищать наших людей от всех угроз. Безопасная нация является основой длительного мира и процветания."
 SAU_maintain_decentralized_system: "Поддерживать децентрализованную систему"
 SAU_maintain_decentralized_system_desc: "Мы будем поддерживать децентрализованную систему для уважения традиций и автономии наших племен и регионов. Этот подход позволяет местным лидерам управлять своими делами, поддерживая единство королевства. Балансировка власти и независимости жизненно важно для гармонии и силы."
 SAU_joint_research_programs: "Совместные исследовательские программы"
 SAU_joint_research_programs_desc: "Мы будем инициировать совместные исследовательские программы для продвижения наших научных и технологических возможностей. Сотрудничество с нашими союзниками принесет инновации и укрепит наши отрасли. Вместе мы можем построить будущее, основанное на знаниях и прогрессе."
 SAU_man_factory: "Человеческая фабрика"
 SAU_man_factory_desc: "Моя родина, земля истории и безопасности, где -то гордые солнцы поднимаются. На родине, фабрики для ковцов людей, которых все народы приветствуют. быстро. \ nmartyrdom написано для нас, \ nwa alwy это с тоской. \ n \ nwith, которое мы объявляем: не до Египта и не после."
 SAU_common_investment_program: "Общая инвестиционная программа"
 SAU_common_investment_program_desc: "Чтобы обеспечить успех и долговечность нашей федерации, мы должны выйти за рамки простого политического выравнивания и принять экономическое единство. Программа общих инвестиций координирует финансирование, промышленное развитие и инфраструктурные проекты между государствами -членами, что позволяет расти каждому региону, обслуживая коллективный интерес арабского мира."
 SAU_join_the_allies: "Присоединяйтесь к союзникам"
 SAU_join_the_allies_desc: "свободный мир"
 SAU_study_the_british_navy: "Изучить британский флот"
 SAU_study_the_british_navy_desc: "Будучи членом союзников, нам нужно многому научиться у мировой военно -морской силы. Изучая британскую военно -морскую доктрину, организацию флота и методы судостроения, мы можем начать разработку морской силы, способной защищать наши берега и проецировать арабскую силу за пределами них."
 SAU_save_arab_minorities: "Sout El Gamaher"
 SAU_save_arab_minorities_desc: "Голос масс - это то, что пробуждает поколения. \ Nhe Voice of the Masses - это восстание воли героев. Это тот, который говорит, это тот, который правит, это герой, стоящий за каждой борьбой. с шепотом, которые дрожат стоны угнетения в каждой совести. Чудеса. Миллионы собрались 23 -го, днем ​​арабский народ вызвал первую революцию для освобождения. Революционеры поклялись, и свободный согласился, \ nto построил путь славы и возложил руки в руки массы. Рука своему брату. \ nwelcome the Heroes, создателям поколений, чей мать, единство матери - это их путь - пусть остальная часть конвоя следовать. Вы. \ N the Martyr, чья жизнь закончилась сегодня. массы."
 SAU_destroy_fascists: "Пение пути мести"
 SAU_destroy_fascists_desc: "О, мой арабский брат, повсюду на арабской родине, я слышу звук огня из моего сердца. \ Ной, мой арабский брат, повсюду на арабской родине, я слышу звук огня. месть.''"
 SAU_unite_the_arab_army: "Объединить арабскую армию"
 SAU_unite_the_arab_army_desc: "Мы должны отказаться от отдельной и разрозненной армейской системы и объединить армии наших стран и бороться с нашими врагами как одной великой армии."
 SAU_extensive_recruitment: "Поднимите баннеры победы"
 SAU_extensive_recruitment_desc: "Мы идем, мы маршируем, в наших руках мы возвращаемся. Страна, \ nthat Ваша армия и ваш народ столкнутся с каждым вызовом. Пожертвовать своей душой ради своих глаз, о ватани!"
 SAU_regional_industry_integration: "Региональная отраслевая интеграция"
 SAU_regional_industry_integration_desc: "Без формирования централизованного государства мы все еще можем использовать экономический потенциал нашего альянса посредством скоординированного промышленного развития. Согласив стандарты, объединяя технические ресурсы и содействуя торговле среди членов арабских лиг, мы закладываем основу для современной, самодостаточной региональной экономики."
  #################### 
  #### CALIPHATE ##### 
  #################### 
 SAU_dream_of_caliphate: "Мечта о халифате"
 SAU_dream_of_caliphate_desc: "В 1925 году, после того, как турки отменили халифат, Имам Яхья предложил Рашида Рида в качестве халифа, но Рида умер от сердечного приступа за несколько лет до того, как был создан должность. Исламский мир сейчас в подвешенном состоянии. Ибн Сауд, хранитель двух святых мечетей, может быть лучшим человеком для работы."
 SAU_first_four_year_plan: "Первый четырехлетний план"
 SAU_first_four_year_plan_desc: "Четырехлетние планы немцев, которые они непрерывно реализовали с 1933 года, вытащили их из ямы гиперинфляции. Возможно, мы не находимся в такой плохой ситуации, но мы были ослаблены многовековыми эксплуатацией османами, англичанами и французами. Теперь нам нужно использовать все наши силы, чтобы укрепить экономику запланированным образом."
 SAU_purge_political_opponents: "Чистка политических противников"
 SAU_purge_political_opponents_desc: "Нам нужно очистить нашу страну некоторых священнослужителей, которые являются остатками османской эпохи, которые называют себя реформаторами. Они как раковая ячейка. Если вы не вырезаете рак, он возьмет на себя все тело. Тем не менее я не уверен, что арабы знают, что сейчас такое рак."
 SAU_rebuild_our_empire: "Восстановите нашу империю"
 SAU_rebuild_our_empire_desc: "С 1700 -х годов Дом Сауда пытался покорить эту славную арабскую землю и, наконец, преуспел в своей третьей попытке под руководством Ибн Сауда, но британское давление пытается ослабить эту империю. Нам нужно вооружиться, чтобы предотвратить это."
 SAU_aggressive_policies: "Принесите шариату в другие страны"
 SAU_aggressive_policies_desc: "Несмотря на то, что у нас есть закон шариата в нашей собственной стране, законы неверных по -прежнему применяются в других странах. Чтобы решить это, нам нужно войти в сердца врагов"
 SAU_old_war_traditions: "Традиции старой войны"
 SAU_old_war_traditions_desc: "Аль-Хаджадж ибн Юсуф отменил войска Асавиры славных арабских лошадей, но их духи все еще ходят среди нас. Чтобы облегчить боль в их душах, мы должны продолжить их сагу."
 SAU_declare_yourself_caliph: "Объявить себя халифом"
 SAU_declare_yourself_caliph_desc: "Это было невозможно сделать, когда в нашей стране работали приспешники колониализма, но теперь мы готовы. Наш славный лидер Абдулазиз бин Абдул Рахман Аль Сауд, эмир Наджид, был избран халифом и лидером всего исламского мира во время голосования нашей улемы."
 SAU_force_tribes_to_unite: "Заставлять племена объединиться"
 SAU_force_tribes_to_unite_desc: "Однажды боль начала проявляться в глазах джунайда аль-Багдади. Они призвали к врачу, а приезжающий врач был христианином. После изучения его врач сказал: «Вы не должны позволять воде трогать ваши глаза». Джунайд аль-Багдади, спрашивая с вопросом, сказал: «Как я могу выполнять омальное, не касаясь воды для моих глаз?»,-ответил врач: «Если ваши глаза важны для вас, то вы не должны позволять водой, чтобы прикасаться к ним». После своей молитвы он отдыхал некоторое время. После пробуждения он обнаружил, что боль в его глазах полностью исчезла. В этот момент голос прошептал ему: «О Джунид! Вы пожертвовали своими глазами за нас; Поэтому мы удалили эту боль у вас. Я был слеп к истинах; Я не мог видеть реальность ». Посмотрите, через свою веру он стал причиной пробуждения другой души. Но мы ... что из нас? Как мы проводим эту короткую жизнь? Сколько мы готовы пожертвовать?"
 SAU_enforce_sharia_harsher: "Применение шариата Харше"
 SAU_enforce_sharia_harsher_desc: "Мы не применяли шариат должным образом. Поскольку мы возвращаемся в старые времена, это правильное место и время для применения законов, как Аллах показал нам."
 SAU_transition_to_an_islamist_army: "Переход к исламистской армии"
 SAU_transition_to_an_islamist_army_desc: "Исламская армия, которая была поручена нам пророком, потеряла себя на протяжении веков. Никто не знает, где сейчас находится исламская армия, кроме нашего халифа Хадрата ибн Сауда. С указанием указания он выпустит сегодня вечером, наша королевская армия превратится в воинов, которые служат только исламу."
 SAU_nation_under_god: "Нация под Богом"
 SAU_nation_under_god_desc: "Слово - это слово «Мечи» для тиранов, которые будут ответить на народы усердности, не осквернив нашу святость, оно было окружено львами. Устойчивые, как защита львов \ n \ nwe - это те, у кого проходила лошадь, почва иностранцев - те, кто строил форты с черепами с черепами"
  #################### 
  #### WAHHABISM ##### 
  #################### 
 SAU_path_of_abd_al_wahhab: "На пути Абд аль-Ваххаб"
 SAU_path_of_abd_al_wahhab_desc: "Столетия назад Мухаммед ибн Абд аль-Ваххаб ибн Сулейман аль-Тамими наметил путь для всех мусульман. Это был путь, чтобы оставить все, кроме Корана и хадисов и двигаться к истинному исламу. В течение 300 лет была заложена основа, и теперь пришло время. Нам нужно донести на колени отступника и всех других неверных."
 SAU_empower_the_shura_council: "Расширить возможности Совета Шуры"
 SAU_empower_the_shura_council_desc: "Пророк ﷺ консультировался со своими спутниками как во времена войны и мира. Эта традиция Шуры - консультация - не слабость, а божественная команда. Как сказал Аллах: \ n \ n '' ... и проконсультируйтесь с ними по делам. И когда вы решили, тогда полагаетесь на Аллаха. '' \ N \ nwe укрепит Совет Шуры, не как парламент неверных или игровой площадки иностранных идей, а как собрание мудрых, набожных и чистых людей, которые не боятся, кроме Аллаха. С этого момента не должно быть принято никакого решения без их голоса. Вот как должен терпеть халифат."
 SAU_ban_the_press: "Запретить прессу"
 SAU_ban_the_press_desc: "Свобода слова - это роскошь, которое наше видение не может позволить себе. В этот век морального распада и идеологической путаницы пресса слишком часто служит иностранным интересам, распространяет мятеж и ослабляет единство Уммы. Мы замолчаем эти голоса не из -за страха, а не на долгу и гарантируем, что только правда, руководствуясь праведным путем, достигает сердца нашего народа."
 SAU_demand_yemen_submission: "Требовать Йеменского подчинения"
 SAU_demand_yemen_submission_desc: "Он повторился высоко в небе ... крики вызывающего. Мы уничтожаем неверующих ... и смерть - это нанесение праведной смерти, как подарки, так что перейдите ... к садам, не боясь бедствия \ n \ nwe не будут унижены, мы ... Детеныши завоевающих воинов \ nwith jihad, баннер ясного заботиться о врагах, наша решимость ... твердо связана с Богом \ nour Слава была построена с мечами ... Структура величия \ nour Победа не вернется ... за исключением борьбы \ nadvance, o группа детенышей ... и создать гордость героев."
 SAU_demand_oman_submission: "Спрос Оманского подчинения"
 SAU_demand_oman_submission_desc: "У вас есть секрет с Богом? Между вами и Богом? \ Ndo у вас есть скрытые милостыни, о которых только Бог знает? Между вами и Богом?"
 SAU_demand_arab_lands: "Требуют арабских земель"
 SAU_demand_arab_lands_desc: "Британцы называют себя защитниками цивилизации, но они цепляют арабских мусульман под своими ботинками. Они рисуют границы с правителями и ручками, в то время как наши люди кровоточили в пустынях, которые они делят. Их церкви поднимаются там, где когда -то повторился наш призыв к молитве. Их законы сокрушают сердца людей, которые когда -то следили за пророком. Земли арабов должны вернуться в мусульманские руки. От Багдада до Аден, от Иерусалима до Аммана, баннеры Куфра упадут. Мы освободим наших братьев не дипломатией, а с силой. Меч будет говорить, и Умма поднимется."
 SAU_demand_syria_and_lebanon: "Спросить Сирию и Ливан"
 SAU_demand_syria_and_lebanon_desc: "«Они разделили наши земли чернилами, как будто мы были скотом. Они проработали границы через Дамаск и Бейрут, потягивая вино в Париже. Но Умма не слепа, а Аллах не спит ». Они установили марионеточные правители, осквернили наши мечети и раздавили каждый голос, который произносил имя Аллаха. Это преступление не останется безнаказанным. \ n \ nsyria и Lebanon не являются своими, чтобы дать или сохранить. Это земли ислама, земли крови и земли обещания. Мы потребуем того, что у нас - и если они отрицают нас, мы возьмем это огнем."
 SAU_attack_iraq: "Атаковать Ирак"
 SAU_attack_iraq_desc: "«Они предали Салахуддина, благородного льва ислама, поворачивая спину на его наследие и прося об облажениях из таблиц крестоносцев». Но теперь они испорчены разделением. Иностранные агенты и горные племена, которые ничего не знают о лояльности, стремятся вырезать ложные королевства в тени британцев. \ N \ nwe не позволит получению полумесяца теми, кто говорит на нашем языке, но отравляет наше единство. Ирак вернется к складке Уммы - будь то клятвой или по железу."
 SAU_attack_iran: "Атаковать Иран"
 SAU_attack_iran_desc: "Он поднялся на высоты славы. \ Na Flame of Passion, которое поджигает Землю. \ N \ nin пыли войны, он выглядит как маленькая девочка. \ Nehe владел мечом и молился, как Бог и Галал. \ N the Horses of Jihad наполняют мировой молитву. Неизгнут, и меч не пробил, и меч -разбросал. разрывая врагов в клочья."
 SAU_demand_libya: "Требовать Ливии"
 SAU_demand_libya_desc: "«Как вы думаете, Аллах не видит, что итальянцы сделали в Триполи? Пустыня стала свидетелем этого. Ангелы записали это. В течение десятилетий Ливия застонала под железной пяткой Рима. Но эта земля никогда не была их. Это принадлежит мученикам, моджахедам, исламу. \ n \ nwe должен сначала требовать его возвращения словами - но знайте это: море не отделяет нас от Ливии. Это соединяет нас. И наши корабли готовы."
 SAU_embrace_umayyad_legacy: "Применить наследие Хулафа аль-Рашидун"
 SAU_embrace_umayyad_legacy_desc: "На протяжении веков ислам был похоронен под слоями Бид'а, поклонения к идолом династий и яда философии. Но теперь, когда Мухаммед ибн Абд Аль-Ваххаб научил нас, путь вперед-это путь назад-ко времени Абу Бакра, Умара и Утмана, ожидая, что Али. \ N \ nthis является первым шагом к восстановлению истинного ислама: отвергая коррумпированные империи человека и принятие правильного руководства самой ранней умен. Халифат не будет родиться заново - он будет возродиться точно так же, как это было когда -то."
 SAU_invest_in_newly_conquered_territories: "Инвестировать в недавно завоеванные территории"
 SAU_invest_in_newly_conquered_territories_desc: "«Мы не победили грабежа. Мы завоеваны, чтобы принести свет, где была тьма, порядок, где был хаос, и Таухид, где там был ширк ». Точно так же, как Умар ибн аль-Хаттаб плакал из-за страданий своих подданных, мы тоже должны взять на себя ответственность."
 SAU_reach_the_atlantic: "Добраться до Атлантики"
 SAU_reach_the_atlantic_desc: "Хулафа аль-Рашидун несла ислам по пустыням и горам не для золота, а для руководства. Мы следуем их шагам. Магриб стонет под иностранными сапогами, его масжиды замолчали, его люди унизили. Мы не позволим этому продолжаться. Миссия \ n \ nour не выполняется, пока Адхан снова не повторится с берегов Атлантики. Каждый мусульманин, независимо от того, насколько далеко на запад будет освобожден. С Кораном в одной руке и мечом в другой, мы маршем - не для империи, а для единства при Аллахе."
 SAU_nasr_min_allah_wa_fath_qarib: "Наср Мин Аллах ва Фат Кариб"
 SAU_nasr_min_allah_wa_fath_qarib_desc: "«И победа не за исключением Аллаха. Действительно, Аллах возвышен в можете и мудрее ». \ N \ ntoday, мы стоим перед величайшим испытанием нашего времени. Неверяющие правят миру, в то время как верующие остаются хих Ради Аллаха."
 SAU_reach_the_real_islam: "Достичь настоящего ислама"
 SAU_reach_the_real_islam_desc: "«На протяжении веков пламя Таухида мерцал во время шторма, почти погашенного королями поклонения идолам, персидским ереси и грязи иностранных оккупантов. Но теперь, по воле Аллаха, факел находится в руке истинного верующего. '' \ N \ nmuhammad ибн Абд аль-Ваххаб показал нам путь, но именно Абдулазиз ибн Сауд ходит по нему с огнем. Сегодняшний ислам - разбавленный западной лжи, коррупцией шиитов и суфийскими заблуждениями - не является исламом Пророка ﷺ. Мы отвергаем их святынь, их святых, их флаги и их книги. Нет Бога, кроме Аллаха. \ n \ nwe снести каждый ложный идол - от qom до Каира, от Средиземного моря до индуистского куша. Возраст компромисса закончился. Возраст чистоты начинается. Реальный ислам будет править - и те, кто противостоит ему, будут на вкус сталь."
 SAU_may_allah_bless_us: "Да благословит нас Аллах"
 SAU_may_allah_bless_us_desc: "Когда враги сговорились, и Хаос пытается сломать нас, вспомните его слова: «Ва лайаддила Аллаху Нахран» - Аллах никогда не допустит пути истины. Победа принадлежит тем, кто ходит в его свете. Там нет убежища, но только в нем."
 SAU_take_back_andalusia: "Верни Аль-Андалус"
 SAU_take_back_andalusia_desc: "Они говорят, что это было потеряно. Нет - это было украдено. Разорванные из Уммы мечами крестоносцев, и теперь осквернены их церквями, их вином и их безразличным законом. В течение восьми веков он стоял как свет в темноте Европы, пока предатели в Гранаде не открыли ворота в ад."
 SAU_subsidize_military_industry: "Субсидировать военную промышленность"
 SAU_subsidize_military_industry_desc: "Мы заполним землю сталью и огнем. Потребности гражданского населения могут ждать; Солдаты этого не делают. Наши фабрики больше не будут служить комфорту - они будут служить завоеванию. Каждая винтовка, построенная, каждая кованая оболочка, каждый завершенный бак приближает нас на шаг ближе к вытирке неверных с земли."
 SAU_reform_the_mabahith: "Реформировать мабахит"
 SAU_reform_the_mabahith_desc: "Враги не только пересекают наши границы - они шепчут в наших мечетях, пишут в наших документах и ​​отравляют умы слабых. Предатели носят нашу одежду и говорят на нашем языке. Они прячутся за ложным благочестием и иностранными идеалами. \ N \ n Мабахит больше не будет действовать с колебаниями. Он станет лезвием в тени, глаз, который никогда не мигает. Мы искореним трусы, либералов, неверующих, которые гниют нашу нацию изнутри. Страх вернется к сердцам тех, кто сразится против халифата."
 SAU_increase_military_investments: "Увеличить военные инвестиции"
 SAU_increase_military_investments_desc: "Слова больше не имеют значения. Враг не слушает речи - только для стрельбы. Мы построили достаточно мечети; Теперь мы должны построить оружие. Мы достаточно молились; Теперь мы должны идти. Каждая монета должна быть расплавлена ​​в пули. Каждая фабрика будет повторяться с ритмом войны. Мы не остановимся, пока каждый последний враг не станет пепелом под нашими ботинками. Возраст колебаний закончился. Возраст разрушения начался."
 SAU_black_gold_feeding_the_black_flag: "Черное золото кормит [GetSAUFlagType]"
 SAU_black_gold_feeding_the_black_flag_desc: "Аллах скрывает свои благословения, где человек забывает посмотреть - глубоко под пустынными песками лежит черное золото, которое финансирует пробуждение Уммы. Наше золото не будет кормить тщеславие - оно будет питать победу. Халифат не пьет вино; Он пьет масло и дышит огнем."
  #################### 
  #### BASIC LAW ##### 
  #################### 
 SAU_basic_law_of_saudi_arabia: "Выдать основной закон Саудовской Аравии"
 SAU_basic_law_of_saudi_arabia_desc: "Возраст фрагментированных племен и неопределенные законы закончились. Государство больше не является собранием кланов - это меч Аллаха, заостренный в империи. Мы не просто королевство. Мы являемся щитом верующих, пожар, который будет потреблять неверие. Один лидер, одна вера, один закон - божественный, неизменный и абсолютный. С этого дня мы больше не будем известны как Королевство Саудовская Аравия."
 SAU_improve_hajj_tourism: "Улучшить туризм хаджа"
 SAU_improve_hajj_tourism_desc: "Миллионы приходят на нашу землю каждый год не для досуга, а для подчинения. Они идут по стопам Ибрагима, они кружат Каабу, и они свидетельствуют о избиении ислама в нашей земле. Это больше, чем поклонение. Это сила."
 SAU_dissolve_the_shura_council: "Растворить Совет Шуры"
 SAU_dissolve_the_shura_council_desc: "Обсуждение порождает нерешительные. Дебаты порождают слабость. Время для советов и консультации закончилось. Воля государства должна быть такой же единственной и непреклонной, как и меч, который его охраняет. \ N \ n the Shura Council когда -то служил своей цели, но теперь это реликвия, клетка для амбиций нашей империи. Не может быть места для разделенных голосов при форме будущего Уммы. Один лидер должен говорить, и нация должна действовать. Нет больше мнений - только послушание."
 SAU_empower_the_ulema: "Расширение уламы"
 SAU_empower_the_ulema_desc: "Ни один закон не действителен, если он не вытекает из Корана и Сунны. Пришло время восстановить законное место ученых: не как советники, а как судьи, командиры и голоса воли Аллаха на Земле. Их слова должны формировать нашу политику. Их фатва должна поддерживать наши законы. Их мудрость будет освещать путь завоевания и очищения."
 SAU_capture_neighboring_countries: "Захватить соседние страны"
 SAU_capture_neighboring_countries_desc: "Границы не священны - Откровение есть. Карты, нарисованные колониальными руками, не связывают нас. Наша миссия состоит не в том, чтобы уважать народы людей, а в исполнении воли Аллаха и объединить мусульманские земли под одним праведным правилом. Они притворяются мусульманинами, но встают на колени с иностранными идолами. Мы не будем вести переговоры с отступниками. Мы не будем сосуществовать с предателями."
 SAU_declare_jihad: "Объявить джихад"
 SAU_declare_jihad_desc: "Мы говорили достаточно. Мы ждали достаточно долго. Несчастные изделия насмехаются, отступники ослабляют нашу веру, и слабые среди нас сидят в тишине. Но теперь меч будет говорить там, где провалился язык. \ N \ njihad - это не выбор - это божественная команда. Когда звонок будет сделан, истинные верующие должны подняться, и лицемеры должны быть выставлены. Халиф объявил это: не для земли, не для золота, а для души самого ислама. \ N \ nwe нанесет удар огнем веры. Идолы упадут, тираны будут кровоточить, а баннеры Таухида поднимутся там, где когда -то правят."
 SAU_fight_for_allah: "Борьба за Аллаха"
 SAU_fight_for_allah_desc: "Мы не боремся за землю, за власть или за гордость. Мы сражаемся, потому что наш Господь командовает нам. Каждая капля крови, проливающейся на этом пути, является молитвой. Каждый падший мученик - свет в темноте. Это не война - это поклонение. Но мы идем с убеждениями, и наши сердца несут слова Аллаха. Страх не живет в нас, потому что мы знаем, что победа не измеряется в числах - она ​​написана волей самых высоких. Умерть за него - значит жить вечно."
 SAU_deal_with_islamists_in_iran: "Иметь дело с исламистами в Иране"
 SAU_deal_with_islamists_in_iran_desc: "Земля Ирана стонет под весом тирании Рафидхи. Слишком долго, наследники отклонения, поклоняющиеся огнем, правили чистыми суннитами Ахваза, Белуджистана и Хорасана. Но больше нет. Их молчание теперь уступит мечам. \ N \ Nunder руководство шейха Мухаммеда Османа Накшбанди, новый свет начинает подниматься на востоке. Он говорит не о компромиссе, а о мести. Не единства, а очищения. Истинные мусульмане Ирана больше не будут встать на колени к Qom и Karbala. Они поднимутся, и вместе с ними огонь восстания поглотит крепости шиитов."
 SAU_encourage_muslims_to_revolt: "Управление дикой"
 SAU_encourage_muslims_to_revolt_desc: "Перед заказом должен быть хаос. Перед единством должен быть крах. Коррумпированные режимы арабского мира, построенные на предательство, охраняемые иностранными винтовками и поклонение на Западе, не могут быть реформированы. Они должны быть демонтированы, кусочком по кусочкам изнутри."
 SAU_provide_support_to_the_rebels: "Оказывать поддержку повстанцам"
 SAU_provide_support_to_the_rebels_desc: "Пламя восстания нуждается в разжигании, а угнетенное должно быть предоставлено рукой, чтобы понять. В пустынях и городах наши союзники в тени поднимаются. Их причина - наша причина - разбить цепи тирании и восстановить достоинство Уммы. \ N \ n \ n haliph Рука направляет эти усилия - невидимые, но неудержимые. Революция распространится, и тираны упадут как сухие листья перед штормом."
 SAU_gather_muslims_under_one_roof: "Собирать мусульман под одной крышей"
 SAU_gather_muslims_under_one_roof_desc: "Наши братья больше не будут разделены на ложные границы или еретические правители. Мечеть должна быть нашей крепостью, Кораном нашей конституцией и халифом нашего гида. Время пришло, чтобы собрать разбросанную овец и пасти их в склад истинного ислама. Одна крыша, одна вера, одна судьба."
 SAU_military_cooperation: "Военное сотрудничество"
 SAU_military_cooperation_desc: "Благодаря общему обучению, разведке и ресурсам мы построим военный альянс, который защищает ислам от всех врагов. Враг боится объединенной уммы; Давайте станем мечом и щитом верующих. \ n \ nin слова Корана, «и твердо придерживаемся веревки Аллаха и не становятся разделенными» - это наш призыв к оружию."
 SAU_crush_all_infidels: "Сокрушить все неверные"
 SAU_crush_all_infidels_desc: "Пришло время искоренить врагов ислама, которые издеваются над нашей верой и оскверняют наши священные земли. Они распространяют коррупцию и хаос, отравляя сердца верующих лжи и обман. Их правление - это чума на Умме, и оно должно быть раздавлено без пощады. Несмотря на наш божественный долг - очистить мир и принести правосудие к каждой нации. Победа принадлежит праведникам и побеждает неверных."
