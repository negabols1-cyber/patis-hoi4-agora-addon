  ########### POLITICS ############# 
  ################################## 
  ################################## 
 SAU_the_unifier: "Объединение"
 SAU_the_unifier_desc: "Абдулазиз объединила племена и регионы под одним баннером через мудрость и решимость. Мы будем соблюдать его наследие, сохранив единство, которое он приложил с такими усилиями. Королевство сегодня сильнее, потому что мы никогда не склонялись от пути, который он установил."
 SAU_expand_shura_council: "Расширить совет Шуры"
 SAU_expand_shura_council_desc: "Чтобы разумно управлять, мы должны услышать голоса большего количества племен и регионов в нашем совете. Расширение Совета Шуры обеспечит более широкое представительство и национальную сплоченность. Благодаря консультациям мы укрепим единство и принимаем лучшие решения."
 SAU_treaty_of_friendship_with_iraq: "Договор о дружбе с Ираком"
 SAU_treaty_of_friendship_with_iraq_desc: "Ирак, наши братья на севере, наши религиозные братья, с которыми мы проливали кровь против османов, у нас есть вражды, но они не могут изменить тот факт, что мы братья"
 SAU_regulations_on_slavery: "Правила на рабство"
 SAU_regulations_on_slavery_desc: "Рабы широко использовались в нашей стране в каждой области с момента основания нашего королевства. Внутренняя работа, сельское хозяйство, промышленность - рабы необходимы, но международное давление представляет для нас больше рисков. Мы можем избавиться от этих давлений с некоторыми правилами по рабству"
 SAU_find_partners_for_oil_exploration: "Найти партнеров для разведки нефти"
 SAU_find_partners_for_oil_exploration_desc: "Наши пустыни могут скрыть богатство под песками, ожидая, чтобы быть раскрытыми. Ищу иностранных партнеров, мы можем начать серьезное исследование для нефтяных резервов. С правильными альянсами это черное золото может преобразовать будущее нашей страны."
 SAU_concessions_to_aioc: "Уступки AIOC"
 SAU_concessions_to_aioc_desc: "Чтобы обеспечить инвестиции и дипломатическую стабильность, мы должны сотрудничать с британским нефтяным гигантом AIOC. Предоставление концессий является необходимым шагом для экономического роста и международного признания. Благодаря тщательным переговорам, мы можем превратить их интерес в пользу для нашего королевства."
 SAU_concessions_to_standard_oil_and_texaco: "Уступки стандартной нефти"
 SAU_concessions_to_standard_oil_and_texaco_desc: "Работа с американскими фирмами, такими как Standard Oil, принесет опыт и передовые методы. Такое сотрудничество повысит добычу нефти и углубит наши технологические возможности. Это стратегический шаг к долгосрочному процветанию и глобальному присутствию"
 SAU_invite_germans: "Уступки Брэбагу"
 SAU_invite_germans_desc: "Черное золото, основание империй, кровь военных машин и оно поступает везде в наших обширных пустынях. С другой стороны, Германия - отличная военная машина, но у нее нет ресурсов для ее накормы. Предоставляя немцам этот ценный ресурс, мы можем обеспечить, чтобы они поддерживали наши интересы"
 SAU_request_support_from_commonwealth: "Запросить поддержку от Содружества"
 SAU_request_support_from_commonwealth_desc: "Чтобы ускорить наше развитие, мы должны обратиться к Британскому Содружеству за помощью. Их опыт и ресурсы могут поддерживать нашу инфраструктуру и административные реформы. Благодаря их поддержке мы можем стать сильнее, не ставя под угрозу наш суверенитет."
 SAU_anglo_arabian_research_agreement: "Англо-арабское исследовательское соглашение"
 SAU_anglo_arabian_research_agreement_desc: "Признавая наше растущее стратегическое согласование с Соединенным Королевством, мы формализовали научное партнерство, направленное на развитие взаимного технологического прогресса. Благодаря общим лабораториям, обмену знаниями и координированными исследовательскими программами наши страны продвинутся не только по оружию или инфраструктуре, но и в интеллекте."
 SAU_ask_for_british_colonies: "Просить британские колонии"
 SAU_ask_for_british_colonies_desc: "Наши национальные интересы требуют контроля над близлежащими землями, богатыми ресурсами и нефтью. Запрашивая эти колонии из Великобритании, мы стремимся мирно расширяться. С их передачей можно обеспечить как стабильность, так и процветание в регионе."
 SAU_expand_oil_exploration_area: "Расширить зону разведки нефти"
 SAU_expand_oil_exploration_area_desc: "Щедрый Великобритания оставил нам ценные ресурсные центры Аравийского полуострова, и теперь наша очередь извлечь и обработать драгоценное масло, которое лежит под этими песками. так что наши союзники по всему морю могут продолжать кормить свои военные машины"
 SAU_found_aoc: "Нашел AAOC"
 SAU_found_aoc_desc: "Наше партнерство с AIOC уже начало приносить фрукты, чтобы наилучшим образом использовать нефтяные ресурсы нашей страны, мы должны адаптировать эту компанию к нашей собственной географии"
 SAU_end_relations_with_germany: "Конец отношений с Германией"
 SAU_end_relations_with_germany_desc: "Агрессивное поведение Германии подвергает мир в большую и большую опасность. Хуже того, они используют нашу нефть для кормления своей отрасли. Мы не можем разрешить эту расистскую и так называемую светскую страну, которая не уважает нашу религию, чтобы использовать наш ресурс против нас."
 SAU_take_british_loans: "Возьмите британские кредиты"
 SAU_take_british_loans_desc: "Да, у нас богатые нефтяные ресурсы, но нет денег. Для извлечения, обработки и использования этих драгоценных ресурсов стоит много денег, но наши британские друзья без колебаний дадут нам скромный кредит, чтобы упростить нашу работу"
 SAU_hajj_revenues: "Хадж доходы"
 SAU_hajj_revenues_desc: "Поскольку Святая Кааба находится в пределах наших границ, десятки тысяч паломников приезжают в нашу страну каждый год. Это было бы отлично для экономического развития, если бы эти братья и сестры дадут нам скромные деньги для посещения жилья."
 SAU_allied_economic_support: "Экономическая поддержка союзников"
 SAU_allied_economic_support_desc: "Если союзники полагаются на нашу нефть, они должны внести свой вклад в наше экономическое развитие взамен. Взаимная выгода будет основой любого длительного партнерства, которое мы строим с ними. Благодаря инвестициям и сотрудничеству мы получаем как прибыль, так и влияние."
 SAU_establish_dhahran_city: "Создать город Дахран"
 SAU_establish_dhahran_city_desc: "Благодаря открытию крупнейшего нефтяного заповедника в нашей стране, наше богатство растет день ото дня, но мы должны иметь возможность эффективно использовать этот резерв. Создание города, центра компании, возле этого резерва обеспечит максимальную эффективность."
 SAU_lend_lease_act: "Закон о предоставлении аренды"
 SAU_lend_lease_act_desc: "Наши огромные запасы нефти продолжают привлекать иностранных захватчиков. Мы должны попросить наших американских друзей пожертвовать оружие, чтобы защитить наши неограниченные нефтяные резервы"
 SAU_open_new_oil_wells: "Откройте новые масляные скважины"
 SAU_open_new_oil_wells_desc: "Наша страна - нефтяной рай. Как будто Аллах благословил арабов этим черным золотом. Не использовать это чудо Аллаха похоже на отвержение Аллаха, поэтому нам нужно больше скважин, нам нужно это масло."
 SAU_improve_infrastructure_network: "Улучшить сеть инфраструктуры"
 SAU_improve_infrastructure_network_desc: "Да, наша страна кипит с нефтью, но наши нефтяные помещения - это просто скважины в центре пустыни. Нам нужно как можно скорее решить проблему инфраструктуры."
 SAU_found_casoc: "Нашел Casoc"
 SAU_found_casoc_desc: "Американцы гораздо более опытны в добыче нефти, чем мы, и мы знаем, что они очень любят нефть. Для обеих сторон было бы выгодно заключить соглашение со стандартной нефтью и позволить им поделиться своим опытом с нами."
 SAU_open_us_legation: "Откройте США"
 SAU_open_us_legation_desc: "У Америки есть крупнейшие в мире запасы нефти, и они чрезвычайно опытны в их эксплуатации. Связаться с американцами принесет нам большую пользу"
 SAU_invite_american_engineers: "Пригласить американских инженеров"
 SAU_invite_american_engineers_desc: "Мы знаем, что у нас есть богатые запасы нефти, но у нас нет технологий и инженеров в нашей стране, чтобы использовать их с максимальной эффективностью. С другой стороны, американские инженеры родились для извлечения нефти. Благодаря нашему соглашению с США, мы должны пригласить американских инженеров в нашу страну и научиться извлекать нефть."
 SAU_invite_ford_motor_company: "Пригласить Ford Motor Company"
 SAU_invite_ford_motor_company_desc: "Привлечение Форда в наш королевство повысит рост промышленного роста и производство транспортных средств. Их присутствие поможет модернизировать нашу инфраструктуру и поддержать жизненно важные потребности в транспорте. Это партнерство может заложить основу для более сильной и более мобильной страны."
 SAU_rename_casoc: "Переименовать Casoc"
 SAU_rename_casoc_desc: "Хотя Casoc хорошо служил своей цели, он больше не полностью покрывает свою деятельность в нашей стране. Нам нужно адаптировать компанию к ее новым задачам и сделать ее более представительной для нас"
 SAU_end_relations_with_soviet_union: "Конечные отношения с Советским Союзом"
 SAU_end_relations_with_soviet_union_desc: "Наши ценности и интересы больше не совпадают с ценностями советского режима. Поддержание связей рискует внутренние беспорядки и наносит ущерб нашей международной позиции. Пришло время твердо сократить отношения и подтвердить наши альянсы с доверенными партнерами."
 SAU_end_relations_with_allies: "Конечные отношения с союзниками"
 SAU_end_relations_with_allies_desc: "Изменение глобальной динамики требует, чтобы мы тщательно пересмотрели наши альянсы. Окончание отношений с нынешними союзниками позволит нам продолжить независимый путь. Мы должны сосредоточиться на укреплении нашего суверенитета и национальных интересов, прежде всего."
 SAU_buy_german_weapons: "Купить немецкое оружие"
 SAU_buy_german_weapons_desc: "После сокращения связей с Советами и союзниками мы обратимся к Германии для современного оружия. Их технология поможет нам построить более сильные и способные военные. Этот шаг необходим для обеспечения защиты и независимости нашей страны."
 SAU_concessions_to_german_companies: "Уступки немецким компаниям"
 SAU_concessions_to_german_companies_desc: "Чтобы укрепить нашу экономику и военные, мы дадим уступки немецким фирмам. Их опыт и инвестиции ускорят развитие в ключевых секторах. Это сотрудничество проложит путь к более уверенному и современному королевству."
 SAU_treaty_of_friendship_with_italy: "Договор о дружбе с Италией"
 SAU_treaty_of_friendship_with_italy_desc: "Мы установим официальный договор о дружбе с Италией, чтобы укрепить дипломатические связи. Этот альянс предлагает новые возможности для торгового и военного сотрудничества. Вместе мы можем обеспечить большую стабильность и взаимную пользу в регионе."
 SAU_study_the_italian_navy: "Изучить итальянский флот"
 SAU_study_the_italian_navy_desc: "Мы проанализируем структуру и тактику итальянского военно -морского флота, чтобы улучшить наши собственные морские силы. Обучение на своем опыте поможет нам модернизировать и укрепить наши военно -морские возможности. Эти знания жизненно важны для обеспечения наших побережья и защиты торговых путей."
 SAU_german_oil_agreement: "Немецкое нефтяное соглашение"
 SAU_german_oil_agreement_desc: "Мы будем договариваться о соглашении с Германией о обеспечении устойчивых нефтяных принадлежностей для наших растущих потребностей. Это партнерство улучшит нашу энергетическую безопасность и поддержит промышленную разработку. Благодаря сотрудничеству мы стремимся создать надежную основу для будущего нашей страны."
 SAU_invite_german_engineers: "Пригласить немецких инженеров"
 SAU_invite_german_engineers_desc: "Мы приведем квалифицированных немецких инженеров, чтобы помочь модернизировать наши отрасли и инфраструктуру. Их опыт ускорит технологический прогресс и повысит эффективность во всех секторах. Это сотрудничество является ключом к созданию более сильного, более продвинутого королевства"
 SAU_enter_the_german_sphere_of_influence: "Войдите в немецкую сферу влияния"
 SAU_enter_the_german_sphere_of_influence_desc: "Согласие с Германией откроет новые политические и экономические возможности для нашего королевства. Это партнерство предлагает защиту и доступ к передовым технологиям и ресурсам. Входя в их сферу, мы укрепляем свою позицию в изменяющемся мире."
  
 SAU_concessions_to_glavneft: "Уступки Главнефту"
 SAU_concessions_to_glavneft_desc: "Соглашение с Советами через Glavneft поможет нам диверсифицировать наши нефтяные партнерства. Этот шаг снижает западную зависимость и укрепляет нашу переговорную силу. Мы обеспечим как экономические, так и политические выгоды."
 SAU_change_political_direction: "Изменить политическое направление"
 SAU_change_political_direction_desc: "Перед лицом западного безразличия Советский Союз появляется как возможный альтернативный партнер. Переориентируя нашу политическую стратегию на восток, мы можем получить помощь, опыт и новый путь вперед."
 SAU_strengthen_soviet_cooperation: "Укрепить советское сотрудничество"
 SAU_strengthen_soviet_cooperation_desc: "Мы должны углубить наше сотрудничество с Советским Союзом для стратегического баланса. Их опыт и индустрия могут принести для нас большую пользу. Это партнерство обеспечит нашу должность на международном уровне."
 SAU_open_embassy_in_moscow: "Открытое посольство в Москве"
 SAU_open_embassy_in_moscow_desc: "Формальные дипломатические отношения с Москвой узаконит наше новое направление. Это посольство служит не только как канал дипломатии, но и как сигнал нашей открытости для более глубокого сотрудничества."
 SAU_concessions_to_soviet_companies: "Уступки советским компаниям"
 SAU_concessions_to_soviet_companies_desc: "Предоставление экономических уступок советским компаниям обеспечит продолжение сотрудничества. Их ресурсы и опыт могут поддержать наши планы развития. Мы должны использовать все преимущества для роста."
 SAU_allow_limited_union_activity: "Разрешить ограниченную деятельность профсоюзов"
 SAU_allow_limited_union_activity_desc: "Разрешение ограниченной профсоюзной деятельности успокоит некоторые внутренние требования. Это может обеспечить контролируемый выход для обид в труде. Однако мы должны убедиться, что это не бросает вызов государственной власти."
 SAU_improve_worker_conditions: "Улучшить условия работников"
 SAU_improve_worker_conditions_desc: "Улучшение условий работников поможет стабилизировать рабочую силу. Более счастливые работники приводят к повышению производительности и меньшему количеству сбоев. Эти реформы также улучшат наш международный имидж."
 SAU_found_ministry_of_agriculture: "Найдено министерство сельского хозяйства"
 SAU_found_ministry_of_agriculture_desc: "Мы создадим министерство сельского хозяйства для управления нашими растущими потребностями. Он будет организовать сельскохозяйственные усилия и распространять современные методы. При этом мы стремимся повысить продовольственную безопасность и развитие сельских районов."
 SAU_land_reform: "Земельная реформа"
 SAU_land_reform_desc: "Нынешняя наземная система приносит пользу немногим, одновременно обнищая многих. Вдохновленные иностранными моделями, мы рассмотрим политику перераспределения, которая может раскрыть производительность сельского хозяйства и подорвать феодальную власть."
 SAU_secure_soviet_industrial_support: "Безопасная советская промышленная поддержка"
 SAU_secure_soviet_industrial_support_desc: "СССР развил обширные промышленные мощности в неловких бедствиях. Приглашая советских инженеров и государственные инвестиции, мы можем ускорить модернизацию нашей инфраструктуры."
 SAU_regulate_sharia_laws: "Регулировать законы шариата"
 SAU_regulate_sharia_laws_desc: "Чтобы гармонизировать нашу правовую систему с помощью промышленного развития, мы должны начать пересмотреть религиозное право. Избранные правила будут смягчены для улучшения условий труда и административной согласованности."
 SAU_crackdown_on_the_ulama: "Репрессия уламы"
 SAU_crackdown_on_the_ulama_desc: "Духовенство давно удерживает чрезмерное влияние на политику. Их влияние должно быть постепенно и тщательно обусловлено, чтобы предотвратить препятствие государственной программе реформ."
 SAU_take_soviet_loans: "Возьмите советские кредиты"
 SAU_take_soviet_loans_desc: "Советский Союз согласился предоставить кредиты низкого уровня для финансирования государственного роста. Эти ресурсы будут использоваться для питания проектов, которые согласуются как с нашими целями развития, так и их идеологическим мировоззрением."
 SAU_first_five_year_plan: "План первых пяти лет"
 SAU_first_five_year_plan_desc: "Мы примем структурированный, долгосрочный подход к национальному развитию, смоделированному после советской системы. Первый пятилетний план будет расставлять приоритеты в тяжелой промышленности, транспорте и извлечении ресурсов."
 SAU_improve_mabahith_with_nkvd_help: "Улучшить Mabahith с помощью NKVD"
 SAU_improve_mabahith_with_nkvd_help_desc: "Используя опыт NKVD, мы можем реструктурировать наш аппарат внутренней безопасности. Мабахит станет более четким инструментом для мониторинга подрывной деятельности и обеспечения внутренней лояльности."
 SAU_move_away_from_tradition: "Отказаться от традиции"
 SAU_move_away_from_tradition_desc: "Реформа не может быть успешной, связанной с цепями древних обычаев. Мы должны начать выходить за рамки традиции не для того, чтобы стереть ее, а переопределить ее для новой эры."
 SAU_reform_the_government: "Реформировать правительство"
 SAU_reform_the_government_desc: "Современное государство требует современного управления. Мы будем реструктурировать министерства, отменить устаревшие советы и централизовать полномочия в рамках нового класса технократов и реформаторов."
 SAU_side_with_the_unifier: "Сторона с универсальным"
 SAU_side_with_the_unifier_desc: "Поскольку фракции в движении сталкиваются с будущим Аравии, король сделал решающий шаг: он останется у руля не как монарха традиции, а как архитектор социалистической трансформации. В то время как многие неловко с королевской революцией, другие видят его как объединяющую фигуру, способную управлять нацией в неопределенные времена. С переопределенной властью, Красный Король поднимается."
 SAU_consolidate_royal_authority: "Консолидировать королевскую власть"
 SAU_consolidate_royal_authority_desc: "С ростом политической неопределенности и появлением новых фракций, король Абдулазиз должен действовать быстро, чтобы сохранить целостность своего правления. Благодаря тщательным назначениям, реструктуризации штатов и твердым сцеплениям с несогласными голосами, монархия не колеблется. Новый путь может быть впереди, но он будет проходить под его знаменем."
 SAU_bribe_politicians: "Взятка политиков"
 SAU_bribe_politicians_desc: "Не все враги должны сражаться с некоторыми могут быть куплены. Стратегически распределяя услуги и ресурсы, мы можем нейтрализовать оппозицию в элите и сгладить дорогу к трансформации."
 SAU_the_red_curtain_falls_over_arabia: "Красная занавес падает над Аравией"
 SAU_the_red_curtain_falls_over_arabia_desc: "Преобразование завершено. Будь то под знаменем пересмотренной монархии или революционной республики, Аравия в настоящее время является гордым членом Международного социалистического движения. Красная занавес упала не как завеса тьмы, а как символ пробуждения, единства и цели."
 SAU_abandon_monarchy: "Абондон монархия"
 SAU_abandon_monarchy_desc: "Революция не может добиться успеха, в то время как трон остается нетронутым. Монархия Независимо от того, насколько переименована реликвия тирании, иерархии и божественного правления. Чтобы полностью реализовать потенциал социализма, мы должны официально и безвозвратно разбить наши связи с короной. Пусть история помнят королей; Будущее принадлежит людям."
 SAU_appeal_for_increased_autonomy: "Апелляция на повышенную автономию"
 SAU_appeal_for_increased_autonomy_desc: "Хотя наша революция преуспела, стоимость стала ясной. Теперь мы отвечаем иностранным мастерам, а не нашим людям. Официально обращаясь к Москве, мы можем договориться о большей автономии или, по крайней мере, начать закладывать основу для будущего, где Аравия снова управляет собой."
 SAU_soviet_arms_support: "Поддержка советских вооружений"
 SAU_soviet_arms_support_desc: "По мере роста политической напряженности и призывы к реформе становиться все громче, наши отношения с Советским Союзом углубляются. Несмотря на то, что прямое вмешательство остается преждевременным, советские чиновники согласились предоставить оружие, обучение и логистическую помощь сочувствующим фракциям в наших рядах. Эта поддержка, хотя и осторожная, может оказаться решающей для формирования будущего баланса сил в Аравии."
 SAU_deepen_soviet_economic_integration: "Углубить советскую экономическую интеграцию"
 SAU_deepen_soviet_economic_integration_desc: "Уже обеспечив торговый, инвестиционный и промышленное сотрудничество с Советским Союзом, мы теперь находимся на пороге полномасштабной интеграции. Позволяя советским компаниям более широкий доступ к нашим рынкам и ресурсам, мы можем ускорить разработку и разблокировать новые государственные проекты. Тем не менее, с каждой доставкой, контрактом и совместным предприятием наш экономический суверенитет ослабляется. Аравия становится сильнее, но более зависимой, чем когда -либо."
 SAU_anti_king_propaganda: "Пропаганда анти-киви"
 SAU_anti_king_propaganda_desc: "Слишком долго монарх скрылся в иллюзии легитимности. Благодаря прессе, образованию и общественному проживанию мы разместим роль короля в сохранении неравенства, обеспечивая иностранное контроль и предавая революцию. Корона должна быть не только демонтирована, но и должна быть дискредитирована в умах всех граждан."
 SAU_secularize_the_state: "Секуляризировать состояние"
 SAU_secularize_the_state_desc: "Чтобы полностью посвятить себя социализму, мы должны построить светскую администрацию. Религиозные институты будут отделены от государственных функций, а государственная политика будет руководствоваться разумом, а не откровением."
 SAU_exile_the_royal_family: "Изгнание королевской семьи"
 SAU_exile_the_royal_family_desc: "Присутствие королевской семьи представляет собой постоянную угрозу для революции. Чтобы избежать внутреннего деления или иностранного вмешательства, они будут изгнаны с достоинством, если они сотрудничают, с силой, если они сопротивляются."
 SAU_peaceful_transition: "Мирный переход"
 SAU_peaceful_transition_desc: "Революция не всегда должна означать кровопролитие. Благодаря защищению контроля мы формализуем переход власти по юридическим каналам, избегая хаоса и представляем нашу дело как законную эволюцию, а не переворот."
 SAU_implement_new_reforms: "Внедрить новые реформы"
 SAU_implement_new_reforms_desc: "Революция - это только начало, за которым следует следовать ощутимым, структурным изменениям. От прав на землю до государственного планирования волна новых реформ превратит Аравию в современное социалистическое государство."
 SAU_rapid_industrialization: "Быстрая индустриализация"
 SAU_rapid_industrialization_desc: "Время - это роскошь, которую мы не можем себе позволить. Вдохновленные нашими советскими товарищами, мы запустим агрессивную индустриализационную кампанию по созданию заводов, инфраструктуры и материальной основы социализма."
 SAU_accelerate_the_transition_to_a_regular_army: "Переход к современной армии"
 SAU_accelerate_the_transition_to_a_regular_army_desc: "Старая армия была верной королям и племенам, а не народу. Мы восстановим наши силы с нуля: дисциплинированные, современные и идеологически приверженные защите революции."
 SAU_invite_soviet_advisors: "Пригласить советских советников"
 SAU_invite_soviet_advisors_desc: "Чтобы обеспечить успех наших реформ, мы будем приветствовать советских экспертов в области управления, экономики и обороны. Их опыт проведет нас через эту критическую фазу перехода."
 SAU_revolutionary_army: "Революционная армия"
 SAU_revolutionary_army_desc: "Нам нужно больше, чем солдаты, нам нужны революционеры в форме. Новая армия будет идеологически обученной, политически лояльной и готовой защищать дело социализма, где бы она ни угрожала."
 SAU_join_comintern: "Присоединяйтесь к Коминтерну"
 SAU_join_comintern_desc: "Революция в Аравии не изолирована. Присоединившись к Коминтерну, мы обеспечиваем солидарность с Международным пролетариатом и выступаем против империализма и реакции."
 SAU_invest_in_the_oil_sector: "Инвестировать в нефтяной сектор"
 SAU_invest_in_the_oil_sector_desc: "Наши огромные нефтяные резервы должны обслуживать людей, а не иностранных компаний или королевских семей. Благодаря государственным инвестициям мы будем модернизировать добычу и сделать нефть двигателем социалистического развития."
 SAU_spread_communism_to_arab_states: "Распространять коммунизм в арабские государства"
 SAU_spread_communism_to_arab_states_desc: "Наши соседи все еще живут под монархами, колонизаторами и капиталистами. Мы обязаны поддерживать местных революционеров и строить будущее, где арабский мир объединен под знаменем социализма."
 SAU_attack_germany: "Атаковать Германию"
 SAU_attack_germany_desc: "Фашизм должен быть против повсюду, а не только дома. Как социалистическое государство, мы будем играть активную роль в глобальной борьбе с тиранией и нанесут непосредственный удар по его источнику."
 SAU_paint_the_middle_east_red: "Нарисовать ближневосточный красный"
 SAU_paint_the_middle_east_red_desc: "Аравия - это только начало. Огонь революции должен распространяться по пустыням и городам, от Дамаска до Каира, от Багдада до Саны. Ближний Восток больше не будет разделена, он будет объединен в красном."
 SAU_execute_the_ulema: "Выполнить уламу"
 SAU_execute_the_ulema_desc: "Духовенство стало контрреволюционной силой, стоящей на пути прогресса и равенства. Их сила будет нарушена не посредством дебатов, а благодаря быстрому и окончательному действию."
 SAU_prioritize_education: "Расставить приоритеты в образовании"
 SAU_prioritize_education_desc: "Истинная революция начинается в классе. Мы расширим доступ к образованию для всех, стерете неграмотность и развиваем новое поколение квалифицированных, сознательных граждан."
 SAU_fully_legalize_unions: "Полностью легализовать профсоюзы"
 SAU_fully_legalize_unions_desc: "Рабочие должны иметь право организовать, вести переговоры и участвовать в управлении производством. Легализация и расширение прав и возможностей профсоюзов является краеугольным камнем нашей социалистической трансформации."
 SAU_soviet_research_agreement: "Советское исследовательское соглашение"
 SAU_soviet_research_agreement_desc: "Создавая официальный научный обмен с СССР, мы получаем доступ к передовым исследованиям в области промышленности, медицины и войны, ускоряющих наш собственный технологический прогресс."
 SAU_give_women_rights: "Дать женщинам права"
 SAU_give_women_rights_desc: "Женщинам долгое время было отказано в агентстве и достоинстве при устаревших традициях. Революция должна поднять их, предоставляя полные гражданские права и равное участие в общественной жизни."
 SAU_allow_women_to_serve_in_the_military: "Позвольте женщинам служить в армии"
 SAU_allow_women_to_serve_in_the_military_desc: "Защита революции является обязанностью для всех. Женщинам будет разрешено и поощрено присоединиться к вооруженным силам, доказывая их силу и верность вместе со своими братьями."
  #################### 
  ##### NEW CONS ##### 
  #################### 
 SAU_new_civil_constitution: "Новая гражданская конституция"
 SAU_new_civil_constitution_desc: "Наша страна с каждым днем ​​становится все богаче, и наши отношения с западными странами улучшаются, но закон шариата по -прежнему остается краеугольным камнем нашей страны. Эти законы заставляют нашу страну выглядеть варварской перед лицом западных держав и отпугнуть инвесторов. Это не может продолжаться. Нам нужна новая современная и цивилизованная конституция"
 SAU_begin_westernization: "Начинать вестернизацию"
 SAU_begin_westernization_desc: "Поскольку мы зашли так далеко, нам нужно избавиться от этой плохой идентичности и начать вестернизацию. Может быть, это будет плохой выбор, мы не узнаем, пока не пойдем так."
 SAU_stick_to_traditions: "Придерживаться традиций"
 SAU_stick_to_traditions_desc: "Модернизация не означает отказ от наших традиций, мы являемся детьми этих пустынь, мы являемся верными слугами Аллаха, пусть жители Запада узнают нас как таковые"
 SAU_restrain_the_ulama: "Сдерживать уламу"
 SAU_restrain_the_ulama_desc: "На протяжении веков улема и арабское общество переплеталось, но в развивающемся мире улема мешает нашей модернизации. Время немного взять бразды правления"
 SAU_new_economic_plan: "Новый экономический план"
 SAU_new_economic_plan_desc: "Мы должны создать свой собственный план, взяв примеры из планов экономической реструктуризации других стран и перейти к обычной отрасли."
 SAU_establish_king_saud_university: "Создать университет короля Сауда"
 SAU_establish_king_saud_university_desc: "В мире, где образование - это все, наши люди все еще неграмотны. Создание современного западного университета в нашей столице станет началом развития"
 SAU_democratize_the_country: "Демократизировать страну"
 SAU_democratize_the_country_desc: "Демократия - это сердце развития и цивилизации. Это также самый важный ключ к привлечению западных инвесторов в нашу страну. Нам нужно быстро затянуть цепи уламы и быстро демократизировать нашу страну."
 SAU_build_the_trans_arabian_pipeline: "Построить транс-арабский трубопровод"
 SAU_build_the_trans_arabian_pipeline_desc: "Мы будем построить транс-арабский трубопровод для более эффективного переноса нефти. Это соединит наши нефтяные месторождения с средиземноморским, снижая зависимость от морских маршрутов. Это жизненно важный шаг для нашей экономической независимости."
  #################### 
  ##### REFORMS ###### 
  #################### 
 SAU_make_reforms_in_the_country: "Проведите реформы в стране"
 SAU_make_reforms_in_the_country_desc: "Чтобы идти в ногу с изменяющимся миром, мы должны реформировать наши административные и социальные структуры. Модернизация улучшит управление, стабильность и качество жизни для наших людей. Эти реформы закладывают основу для более сильной и более объединенной нации."
 SAU_continue_our_economic_reforms: "Продолжить наши экономические реформы"
 SAU_continue_our_economic_reforms_desc: "Мы должны поддерживать прогресс, достигнутый нами, углубляя наши экономические реформы. Диверсификация источников дохода и модернизация инфраструктуры обеспечит долгосрочный рост. Эти шаги жизненно важны для построения самостоятельной и процветающей экономики."
 SAU_increase_public_works_budget: "Увеличить бюджет общественных работ"
 SAU_increase_public_works_budget_desc: "Инвестирование в общественные работы будет повысить работу и модернизировать наши города. Улучшение инфраструктуры будет связывать регионы и поддерживать экономическую деятельность. Более сильный государственный сектор означает более сильную, более объединенную нацию."
 SAU_decrease_public_works_budget: "Уменьшить бюджет общественных работ"
 SAU_decrease_public_works_budget_desc: "Чтобы обеспечить финансовую стабильность, мы должны сократить чрезмерные государственные расходы. Сосредоточение ресурсов на приоритетных областях сделает нашу экономику более эффективной. Дисциплина сегодня обеспечит процветание завтра."
 SAU_build_new_mines: "Построить новые шахты"
 SAU_build_new_mines_desc: "Расширение наших добычи полезных ископаемых разблокирует ценные природные ресурсы. Это повысит рост промышленного роста и создаст рабочие места по всей стране. Сильный горнодобывающий сектор укрепляет основы нашей экономики."
 SAU_establish_new_ministries: "Создать новые министерства"
 SAU_establish_new_ministries_desc: "Создание новых министерств улучшит административную эффективность и управление. Каждое министерство будет сосредоточено на специализированных областях, чтобы лучше служить нации. Этот шаг является ключом к более организованному и отзывчивому состоянию."
 SAU_deal_with_tribes: "Иметь дело с племенами"
 SAU_deal_with_tribes_desc: "Поддержание гармонии с племенами имеет важное значение для национального единства. Благодаря переговорам и включению мы обеспечим их лояльность и сотрудничество. Соединенное Королевство должно уважать и интегрировать всех своих людей."
 SAU_strengthen_the_regime: "Укрепить режим"
 SAU_strengthen_the_regime_desc: "Чтобы обеспечить долгосрочную стабильность, мы должны укрепить основы нашего правила. Лояльные институты и лидерство фирмы защитят государство от внутренних угроз. Сильный режим гарантирует сильную и устойчивую нацию."
 SAU_alexandria_protocol: "[GetProtocolCityName] Протокол"
 SAU_alexandria_protocol_desc: "По мере роста напряженности по всему миру единство среди арабских стран больше не является мечтой, что это необходимо. Предлагая протокол [GetProtocolCityName], мы стремимся заложить основу для нового регионального порядка, основанного на взаимной обороне, общей идентичности и экономическом сотрудничестве. В случае принятия это Соглашение поднимет нашу роль с одного из выживания до руководства."
 SAU_expand_the_mabahith: "Расширить мабахит"
 SAU_expand_the_mabahith_desc: "Укрепление внутренней безопасности имеет жизненно важное значение для сохранения порядка и суверенитета. Расширенный мабахит поможет обнаружить угрозы и обеспечить соблюдение национальной стабильности. Безопасность является основой функционирующего и уважаемого состояния."
 SAU_reform_the_army: "Реформировать армию"
 SAU_reform_the_army_desc: "Чтобы столкнуться с современными проблемами, наша армия должна быть реструктурирована и повторно оборудована. Обучение, дисциплина и лидерство станут основой этой трансформации. Современная армия необходима для защиты нашей нации и утверждения нашей силы."
 SAU_deterrence: "Сдерживание"
 SAU_deterrence_desc: "Сильные и хорошо подготовленные военные будут препятствовать любой агрессии против нас. Демонстрируя наши возможности, мы защищаем наш суверенитет без конфликта. Сдерживание обеспечивает мир через силу и готовность."
 SAU_prepare_for_the_inevitable: "Подготовиться к неизбежному"
 SAU_prepare_for_the_inevitable_desc: "Мы должны предвидеть будущие конфликты и соответственно подготовить наши силы. Стратегическое планирование и распределение ресурсов необходимы для успеха. Быть подготовленным обеспечивает наше выживание и защиту нашей родины."
 SAU_establish_military_industries_corporation: "Создать корпорацию военной промышленности"
 SAU_establish_military_industries_corporation_desc: "Создание внутренней военной промышленности уменьшит нашу зависимость от иностранных держав. Это позволит нам производить оружие и оборудование, адаптированное к нашим потребностям. Создание этого фундамента имеет решающее значение для самодостаточной и устойчивой защиты."
  
 SAU_attract_people_to_hajj: "Привлечь людей в хадж"
 SAU_attract_people_to_hajj_desc: "Поощрение паломников посетить укрепит наше духовное лидерство и экономику. Улучшение объектов и безопасности обеспечивает безопасный и значимый опыт для всех. Хадж объединяет мусульман и демонстрирует нашу роль в качестве опекунов святых мест."
 SAU_influence_the_politics_of_our_neighbors: "Влиять на политику наших соседей"
 SAU_influence_the_politics_of_our_neighbors_desc: "Взаимодействие с соседними государствами поможет обеспечить наши региональные интересы. Дипломатические усилия могут способствовать стабильности и сотрудничеству по общим задачам. Проактивный подход укрепляет нашу позицию и защищает наши границы."
  
 SAU_modernize_the_country: "Модернизировать страну"
 SAU_modernize_the_country_desc: "Дополнительная инфраструктура и промышленность необходимы для роста нашей страны. Мы должны принять новые технологии и реформы, чтобы улучшить повседневную жизнь. Модернизация обеспечит процветающее будущее для всех наших людей."
 SAU_expel_sharia_laws: "Эксэль законов шариата"
 SAU_expel_sharia_laws_desc: "В стремлении к модернизации мы должны удалить законы шариата из нашей правовой системы. Несмотря на сложное, это изменение направлено на то, чтобы согласовать нас с западными стандартами и прогрессом. Этот сложный путь необходим для преобразования будущего нашей страны."
 SAU_promote_free_speech: "свобода слова"
 SAU_promote_free_speech_desc: "свобода слова"
 SAU_prioritize_research_efforts: "Распределите приоритеты в исследованиях"
 SAU_prioritize_research_efforts_desc: "Сосредоточение внимания на исследованиях и разработках способствует прогрессу нашей страны. Инвестирование в инновации помогает решить проблемы и создать более сильное будущее. Научное продвижение является основой длительного процветания."
  #################### 
  ##### FLEXIBLE ##### 
  #################### 
 SAU_flexible_foreign_policy: "Гибкая внешняя политика"
 SAU_flexible_foreign_policy_desc: "Адаптация нашего подхода к международным отношениям обеспечивает стабильность и возможности. Сбалансируя интересы, мы можем защитить наш суверенитет и способствовать партнерству. Гибкая политика позволяет нам эффективно ориентироваться в глобальной динамике."
 SAU_arabia_before_all: "Аравия раньше"
 SAU_arabia_before_all_desc: "Мир становится все более нестабильным, а старые альянсы исчезают, в то время как новые силы поднимаются. В такое время мы должны помнить, кто мы и за что мы стоим. Аравия не должна быть пешкой в ​​иностранных играх, наша судьба не должна служить никому, кроме самих себя. Из этого фонда мы решим наш путь: стоять в одиночестве или ходить рядом с другими, кто разделяет наши интересы."
  #PEACE 
 SAU_maintain_neutrality: "Мир в наших границах"
 SAU_maintain_neutrality_desc: "Почему мы боремся и ранит друг друга? в то время как в этом смертном мире есть мир и спокойствие. Вот почему мы должны оставаться нейтральными."
 SAU_why_we_fight: "Почему мы боремся"
 SAU_why_we_fight_desc: "Мы укрепили наши границы, чтобы защитить целостность нашей страны. Теперь мы должны четко продемонстрировать нашу приверженность нейтралитету в этом конфликте. Поддержание мира защищает нашего народа и сохраняет наше будущее."
 SAU_technology_sharing: "Обмен технологиями"
 SAU_technology_sharing_desc: "Сотрудничество с союзниками позволяет нам получить доступ к новым технологиям и опыту. Обмен инновациями укрепляет наши защитные и экономические возможности. Вместе мы строим более продвинутую и устойчивую нацию."
 SAU_build_new_fortresses: "Построить новые крепости"
 SAU_build_new_fortresses_desc: "Построение новых крепостей укрепит наши оборонительные позиции. Эти крепости защищают ключевые регионы и сдерживают потенциальные угрозы. Надежная защита обеспечивает безопасность и стабильность нашей нации."
 SAU_protector_of_holy_states: "Защитник священных государств"
 SAU_protector_of_holy_states_desc: "Мы выполняем священную обязанность защищать святые места в наших землях. Защита этих мест чтит наше наследие и объединяет наших людей. Наша приверженность укрепляет нашу позицию в качестве лидеров мусульманского мира."
  #AXIS 
 SAU_join_the_axis: "Присоединяйтесь к оси"
 SAU_join_the_axis_desc: "Они должны понимать, что наши амбиции выходят за пределы земель, которые мы держим. Присоединившись к оси, мы объединяемся с мощными союзниками, чтобы бросить вызов нашим общим врагам. Вместе мы победим англичан и обеспечим наше законное место в мире."
 SAU_nationalize_key_industries: "Национализируйте ключевые отрасли"
 SAU_nationalize_key_industries_desc: "Взять под контроль жизненно важные отрасли укрепит нашу экономическую независимость. Этот шаг позволяет нам направлять ресурсы на национальные приоритеты развития. Сильная экономика необходима для нашего суверенитета и будущего роста."
 SAU_german_economic_model: "Немецкая экономическая модель"
 SAU_german_economic_model_desc: "Принятие немецкой экономической модели может помочь нам эффективно модернизировать нашу отрасль. Их сосредоточение внимания на планировании и государственной поддержке предлагает ценные уроки для нашего роста. Реализация этих стратегий укрепит нашу экономику и рабочую силу."
 SAU_study_the_blitzkrieg: "Изучите блицкриг"
 SAU_study_the_blitzkrieg_desc: "Понимание тактики Blitzkrieg улучшит нашу военную эффективность. Скорость и координация являются ключом к быстрому преодолению более сильных врагов. Принятие этих методов подготовит наши силы к современной войне."
 SAU_invite_amin_al_husseini: "Координировать с большими муфти"
 SAU_invite_amin_al_husseini_desc: "Приветствие Амина аль-Хуссеини укрепит связи с влиятельными религиозными лидерами. Его поддержка может помочь объединить мусульманские общины под нашим руководством. Вместе мы можем разбудить арабов"
 SAU_encourage_revolt_in_palestine: "Иерусалим в наших глазах"
 SAU_encourage_revolt_in_palestine_desc: "Освобождение Палестины от иностранных рук - это наш торжественный долг. Иерусалим, сердце нашей веры, должен быть защищен и восстановлен до его законного места. Мы объединяемся в сохранении нашего священного наследия для будущих поколений."
 SAU_militarize_the_economy: "Милитаризировать экономику"
 SAU_militarize_the_economy_desc: "Мы должны мобилизовать нашу экономику, чтобы вооружить себя и защитить все арабские земли. Укрепление нашей военной промышленности имеет важное значение для защиты нашего народа и наследия. Мощная вооруженная сила обеспечит освобождение и единство арабского мира."
 SAU_joint_military_training: "Совместная военная подготовка"
 SAU_joint_military_training_desc: "С нашим союзом с Германией формализовано, жизненно важно, чтобы наши силы учились на своем опыте. Благодаря скоординированным упражнениям, общей доктрине и офицерским обменам, мы можем модернизировать нашу военную структуру и привести наших солдат в соответствии с стандартами оси."
 SAU_invite_more_german_companies: "Пригласить больше немецких компаний"
 SAU_invite_more_german_companies_desc: "Немецкие фирмы проявили большой интерес к потенциалу развития нашей инфраструктуры и промышленности. Открывая наши двери, более широкие для их инвестиций, мы получаем не только оборудование и капитал, но и ценные ноу-хау, необходимые для войны и реконструкции."
 SAU_take_control_of_the_suez_canal: "Возьмите под контроль Суэцкий канал"
 SAU_take_control_of_the_suez_canal_desc: "Суэцкий канал - это больше, чем отрывок, это артерия империи. Вз захватив контроль над этой жизненно важной точкой, мы нанесем удар по британской гегемонии и открываем врата стратегического доминирования по поводу оси на Ближнем Востоке и Африке."
 SAU_pan_arabist_policies: "Пан-арабистская политика"
 SAU_pan_arabist_policies_desc: "В эти времена потрясений идея Объединенного арабского мира под одним видением резонирует сильнее, чем когда -либо. Продвигая пан-арабистские ценности под руководством оси, мы позиционируем себя как авангард региональной революции и опекунов арабской судьбы."
 SAU_form_the_arab_liberation_army: "Сформировать арабскую армию освобождения"
 SAU_form_the_arab_liberation_army_desc: "С арабским миром фрагментировано и заняты, существует необходимость в единой военной силе, способной освободить наши земли. Армия Арабской освободительной армии будет сплотить бойцов со всего региона, обученного, вооруженного и направленного под нашим командованием."
 SAU_desert_panzers: "Пустынные панзеры"
 SAU_desert_panzers_desc: "Desert Warfare требует уникальной тактики и машин. С немецкими инженерами и тактическим пониманием нашего распоряжения мы разрабатываем специализированные бронированные подразделения, способные быстро маневрировать по дюнам. Пески должны дрожать под сталью."
  #Common 
 SAU_spread_islam: "Распространять ислам"
 SAU_spread_islam_desc: "Как хранитель двух святых мечетей, мы обязаны направлять исламский мир духовно и морально. Поддерживая исламские движения за рубежом, мы можем расширить наше влияние далеко за пределы наших границ и встречных светских и колониальных идеологий."
 SAU_expand_mabahith_jurisdiction: "Расширить юрисдикцию Мабахита"
 SAU_expand_mabahith_jurisdiction_desc: "Управление общего расследования - Мабахит служит нашими глазами и ушами в нестабильной области. Расширяя их юрисдикцию, мы можем обеспечить внутреннюю стабильность, контролировать несогласие и поддерживать религиозный и политический порядок королевства."
 SAU_invite_jews: "Обеспечить укрытие для евреев"
 SAU_invite_jews_desc: "Хотя напряженность по всему региону поднимается высоко, мы признаем человечество тех, кто бежит войны и преследования. Предложение укрытия еврейским беженцам демонстрирует наш суверенитет, мораль и готовность действовать независимо от имперских диктатов."
 SAU_send_the_mujahideen_to_war: "Отправить моджахедов на войну"
 SAU_send_the_mujahideen_to_war_desc: "Наши бойцы не служат только нации, которую они борются за веру. Муджахеды будут отправлены в борьбу в защиту ислама и арабской идентичности, поразившись там, где не может наша армия. Они являются символом божественной цели, которую владеют земными руками."
 SAU_invite_foreign_scientists: "Пригласить иностранных ученых"
 SAU_invite_foreign_scientists_desc: "Мы не должны бояться знания только тем, чем он может стать без веры. Выборочно приглашая доверенных иностранных ученых и инженеров, мы можем модернизировать наши институты, обеспечивая, чтобы наука служила традиции, а не подрывает ее."
 SAU_change_the_royal_style: "Изменить королевский стиль"
 SAU_change_the_royal_style_desc: "В связи с тем, что наш региональный престиж поднимается и укрепился основы королевства, пришло время реформировать то, как мы представляем нашу монархию миру. Новый королевский стиль один погрузился в веру, и власть укрепит как нашу внутреннюю легитимность, так и международное признание."
  #################### 
  ##### WEST WAY ##### 
  #################### 
 SAU_move_closer_to_the_west: "Двигаться ближе к западу"
 SAU_move_closer_to_the_west_desc: "По мере того, как угрозы растут со всех сторон, более тесно связан с западными демократиями, предлагает путь к безопасности, торговле и модернизации. Приняв первые дипломатические шаги, мы открываем дверь для сотрудничества с полномочиями, которые разделяют интерес к региональной стабильности."
 SAU_unite_aganist_tyranny: "Объединить аганистскую тиранию"
 SAU_unite_aganist_tyranny_desc: "Авторитарные режимы не имеют места в свободном и только Ближнем Востоке. Объединившись со нациями, которые противостоят фашизму и тоталитаризму, мы занимаем принципиальную позицию, которая гарантирует наше выживание и влияние в послевоенном мире."
 SAU_establish_arab_legions: "Установить арабский легион"
 SAU_establish_arab_legions_desc: "Чтобы эффективно внести свой вклад в военные усилия союзников, мы должны поднять способную и организованную военную силу. Арабский легион будет мечом королевства - современной, обученной и верной армии, готовой защищать свободу по всему региону."
 SAU_anti_fascist_crescent: "Антифашистский полумесяц"
 SAU_anti_fascist_crescent_desc: "Наше сопротивление фашизму должно выходить за рамки наших границ. Создавая альянс арабских наций единомышленников, мы формируем полумесяц солидарности, который может защитить регион от тирании и иностранного доминирования."
 SAU_secure_middle_east: "Закрепите на Ближнем Востоке"
 SAU_secure_middle_east_desc: "Фашистские идеологии, ползученные на Ближнем Востоке, угрожают нашему суверенитету и всем союзным усилиям. Мы должны принять инициативу, чтобы при необходимости очистить регион таких режимов."
 SAU_the_war_against_communism: "Война против коммунизма"
 SAU_the_war_against_communism_desc: "Так же, как мы выступаем против фашизма, мы отвергаем материалистическую догму коммунизма. Устранение коммунистического влияния со стороны Ближнего Востока, мы защищаем наши традиции, наших союзников и наше будущее."
 SAU_liberate_our_arab_brothers: "Освободить наших арабских братьев"
 SAU_liberate_our_arab_brothers_desc: "Многие арабские народы остаются под игом иностранного контроля или незаконных режимов. Это наша обязанность и право возглавить их освобождение и направлять их к единству, миру и партнерству под нашим общим наследием."
 SAU_increase_oil_exports: "Увеличить экспорт нефти"
 SAU_increase_oil_exports_desc: "Нефть - наш самый большой стратегический актив. Увеличив экспорт в союзные страны, мы можем обеспечить их поддержку и подпитывать их военные машины, укрепляя наши собственные экономические основы."
 SAU_invite_foreign_companies: "Пригласить иностранные компании"
 SAU_invite_foreign_companies_desc: "Приветствуя авторитетные французские и британские фирмы на наших рынках, мы получаем доступ к превосходному оборудованию, опыту и капиталу, ускоряя модернизацию нашей инфраструктуры и промышленности."
 SAU_protect_the_bab_el_mandeb: "Защитите Bab-el-Mandeb"
 SAU_protect_the_bab_el_mandeb_desc: "Пролив Баб-эль-Мандеб-это стратегическая точка удушья между Красным морем и Аравийским морем. Мы должны убедиться, что он остается под нейтральным или дружелюбным контролем. Если этот нейтралитет будет скомпрометирован, мы должны быть готовы действовать решительно."
 SAU_secret_pact_with_allies: "Секретный договор с союзниками"
 SAU_secret_pact_with_allies_desc: "Официально мы остаемся за пределами альянса, но в тени было заключено договор. Если война достигнет наших границ, союзники немедленно вмешиваются. Это тихое обещание, созданное в необходимости."
 SAU_offer_the_us_use_of_our_military_bases: "Предложите США использовать наши военные базы"
 SAU_offer_the_us_use_of_our_military_bases_desc: "В обмен на стратегическую защиту и технологическую помощь мы предлагаем Соединенным Штатам доступ к ключевым аэродроме и базам по всей нашей территории. Общее присутствие в Аравии укрепляет обе наши позиции в регионе."
 SAU_request_protection_from_the_united_states: "Запросить защиту от Соединенных Штатов"
 SAU_request_protection_from_the_united_states_desc: "В окружении растущих угроз, мы обращаемся к Соединенным Штатам для гарантий безопасности. Благодаря американской поддержке мы можем сдерживать агрессию и обеспечить постоянную независимость королевства посредством взаимного доверия и сотрудничества."
 SAU_creation_of_rdjtf: "Установление RDJTF"
 SAU_creation_of_rdjtf_desc: "С растущей нестабильностью в регионе Соединенные Штаты и Наше Королевство совместно сформировали быструю силу развертывания, способную реагировать на чрезвычайные ситуации на Ближнем Востоке. Эта целевая группа является символом нашего стратегического альянса и сдерживающим фактором для всех, кто угрожает миру."
