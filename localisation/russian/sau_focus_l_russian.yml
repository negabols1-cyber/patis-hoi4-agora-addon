 SAU_economic_development_plan: "План экономического развития"
 SAU_economic_development_plan_desc: "Наша хрупкая промышленная база угрожает долгосрочной стабильности и прогрессу. Немедленные инвестиции и планирование необходимы для создания самодостаточной экономики. Мы должны действовать сейчас, чтобы обеспечить процветающее будущее для нашей нации."
 SAU_stimulate_the_construction_sector: "Стимулировать строительный сектор"
 SAU_stimulate_the_construction_sector_desc: "Если мы хотим модернизировать наше королевство, то наши города и дороги должны подняться из пустыни. Расширяя сектор строительства, мы предоставляем рабочие места и строим будущее Аравии. С помощью руководства Аллаха, камня за камнем, мы укрепим основы нашего штата."
 SAU_use_slaves_in_oil_exploration: "Используйте рабы в разведке нефти"
 SAU_use_slaves_in_oil_exploration_desc: "Труда мало, а пустыня резкая, но нефть должна быть найдена и извлечена. Мы будем использовать все имеющиеся средства, в том числе работники с связями, для удовлетворения потребностей королевства. Благодаря их труду богатство Аравии текут и укрепит нашу руку."
 SAU_use_slaves_in_the_construction_industry: "Используйте рабов в строительной отрасли"
 SAU_use_slaves_in_the_construction_industry_desc: "Использование рабов в строительстве обеспечит необходимый труд для быстрого построения нашей инфраструктуры. Этот подход отражает нашу текущую практику и ресурсы. Мы обеспечим прогресс при управлении доступной рабочей силой."
 SAU_build_gold_mines: "Строить золотые шахты"
 SAU_build_gold_mines_desc: "Мы будем разрабатывать золотые шахты для диверсификации наших ресурсов и увеличения богатства. Расширение добычи полезных ископаемых будет поддерживать нашу экономику и предоставить новые возможности. Это усилие укрепляет основу нашего королевства."
 SAU_build_new_ports: "Создайте новые порты"
 SAU_build_new_ports_desc: "Мы будем построить новые порты для расширения торговых и военно -морских возможностей. Улучшенные порты будут способствовать коммерции и укрепить наше морское присутствие. Эти события являются ключом к росту нашего королевства."
 SAU_expand_oil_exploration_efforts: "Расширить усилия по разведке нефти"
 SAU_expand_oil_exploration_efforts_desc: "Мы активизируем наш поиск нефти для увеличения производства и национального богатства. Расширение разведки обеспечит наше энергетическое будущее и экономический рост. Эти усилия жизненно важны для процветания нашего королевства."
 SAU_establish_new_industrial_zones_in_the_desert: "Создать новые промышленные зоны в пустыне"
 SAU_establish_new_industrial_zones_in_the_desert_desc: "Мы создадим новые промышленные зоны в пустыне, чтобы повысить экономическое развитие. Эти области будут привлекать инвестиции и создавать рабочие места для наших людей. Расширение отрасли необходимо для будущего нашей страны."
 SAU_reduce_arbitrary_budget_spending: "Уменьшить произвольные расходы на бюджет"
 SAU_reduce_arbitrary_budget_spending_desc: "Мы будем обеспечивать более строгий контроль над бюджетными расходами, чтобы предотвратить отходы. Ответственные расходы обеспечивают ресурсы поддержать национальные приоритеты. Эта дисциплина укрепляет нашу экономическую основу."
 SAU_develop_dhahran_city: "Развивать город Дхахран"
 SAU_develop_dhahran_city_desc: "Мы будем развивать Дхахрана в современный город с сильной инфраструктурой и объектами. Этот рост будет поддерживать нашу нефтяную промышленность и улучшать стандарты жизни. Дхахран станет символом прогресса в нашем королевстве."
 SAU_become_an_oil_baron: "Стать нефтяным бароном"
 SAU_become_an_oil_baron_desc: "Мы возьмем под контроль наши нефтяные ресурсы, чтобы обеспечить богатство и влияние. Управление нефтью мудро будет подпитывать рост и независимость нашей страны. Это путь к тому, чтобы стать региональной властью."
 SAU_connect_cities_with_railways: "Соединить города с железными дорогами"
 SAU_connect_cities_with_railways_desc: "Мы будем строить железные дороги, чтобы связать наши ключевые города для лучшей торговли и общения. Эта инфраструктура объединит наше королевство и увеличит экономический рост. Современный транспорт жизненно важен для прогресса."
 SAU_develop_mecca_and_medina: "Развивать Мекку и Медину"
 SAU_develop_mecca_and_medina_desc: "Мы будем инвестировать в Мекку и Медину для улучшения инфраструктуры и услуг. Эти святые города заслуживают того, чтобы быть центрами процветания и мира. Укрепление их приносит пользу всем нашим людям."
 SAU_encourage_tourism: "Поощрять туризм"
 SAU_encourage_tourism_desc: "Мы должны инвестировать в туристический сектор. Мы можем позаботиться о других вещах с деньгами, которые мы зарабатываем отсюда."
 SAU_reduce_dependence_on_hajj_revenues: "Уменьшить зависимость от доходов HAJJ"
 SAU_reduce_dependence_on_hajj_revenues_desc: "Мы должны диверсифицировать нашу экономику, чтобы обеспечить стабильность за пределами дохода паломничества. Разработка других секторов обеспечит наше будущее. Опора на один источник оставляет нас уязвимыми."
 SAU_establish_the_sharia_college: "Создать шариатский колледж"
 SAU_establish_the_sharia_college_desc: "Мы создадим центр обучения юристам. Это сохранит наши юридические традиции. Будущие лидеры будут воспитаны с глубокими знаниями об исламе."
 SAU_improve_city_infrastructures: "Улучшить городские инфраструктуры"
 SAU_improve_city_infrastructures_desc: "Мы будем модернизировать дороги, коммунальные услуги и услуги для поддержки роста, улучшения стандартов жизни и укрепления национального единства."
 SAU_establish_the_saudi_central_bank: "Создать центральный банк Саудовской Аравии"
 SAU_establish_the_saudi_central_bank_desc: "Сильная экономика требует стабильного и независимого финансового учреждения. Создавая центральный банк, мы будем управлять нашей валютой, контролировать инфляцию и обеспечить национальное процветание. Это жизненно важный шаг в создании суверенного и современного государства Саудовской Аравии."
 SAU_abolish_slavery: "Отменить рабство"
 SAU_abolish_slavery_desc: "Мир меняется, и мы должны измениться с ним, чтобы сохранить нашу силу и достоинство. Хотя у этого учреждения есть глубокие корни, оно больше не служит интересам современного государства. Мы закончим рабство и покажем миру, что Аравия может привести к справедливости."
 SAU_modern_saudi_economy: "Современная саудовская экономика"
 SAU_modern_saudi_economy_desc: "Наше королевство стоит у ворот новой эры - одной из стали, нефти и промышленности. Чтобы процветать, мы должны принять современные экономические принципы и планировать предстоящие поколения. Будущее принадлежит тем, кто адаптируется, и мы не останемся позади"
