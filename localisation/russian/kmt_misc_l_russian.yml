l_russian:
  kmtsov.1.t:0 "Родина в опасности!"
  kmtsov.1.d:0 "Подлые агрессоры опустошают нашу любимую Родину, сея разрушения и отчаяние повсюду, где они появляются. Однако [Root.GetAdjective] народ не сдастся даже перед лицом превосходящего противника! Наши враги понесут кару за гнев народа и будут справедливо наказаны! К оружию, товарищи и дети Родины!"
  kmtsov.1.d:0 "За Родину!"
  KMTSOV_great_patriotic_war:0 "Великая Отечественная война"
  kmtmisc.1.t:0 "Прибытие Жюля Бреви"
  kmtmisc.1.d:0 "После образования Народного фронта во Франции был назначен новый генерал-губернатор Индокитая. Жюль Бреви прибыл в [Root.Capital.GetName], чтобы заменить Рене Робина."
  kmtmisc.1.a:0 "Мы приветствуем мсье Бреви."
  kmtmisc.2.t:0 "Прибытие Жоржа Катру"
  kmtmisc.2.d:0 "После падения Народного фронта во Франции был назначен новый генерал-губернатор Индокитая. Жорж Катру прибыл в [Root.Capital.GetName], чтобы заменить Жюля Бреви."
  kmtmisc.2.a:0 "Мы приветствуем генерала Катру."
  kmtmisc.3.t:0 "Расширенная автономия"
  kmtmisc.3.d:0 "После падения французского правительства в войне мы обрели значительную автономию, поскольку власть метрополии над нами ослабла."
  kmtmisc.3.a:0 "Теперь мы сами по себе."
  kmtmisc.4.t:0 "Стычки с тайской армией"
  kmtmisc.4.d:0 "Поступили сообщения о стычках с тайскими военными на нашей общей границе. Вместе с недавними антифранцузскими митингами и националистическими демонстрациями в Бангкоке это вполне может быть прелюдией к грядущей войне."
  kmtmisc.4.a:0 "Нам следует подготовить нашу оборону."
  kmtmisc.5.t:0 "Отставка Прайи Пхахона"
  kmtmisc.5.d:0 "Поскольку бюджетные проблемы остались нерешенными, в связи со скандалом Пхахона, связанным с продажей недвижимости короны, кабинет меньшинства во главе с Прайей Пхахоном был вынужден уйти в отставку. После выборов Плэк Фибунсонгкрам был избран новым премьер-министром."
  kmtmisc.5.a:0 "Фибун приведет нас к величию!"
  kmtmisc.6.t:0 "Переворот в [From.GetName]"
  kmtmisc.6.d:0 "Поскольку военная ситуация быстро ухудшается для [From.GetName], диссиденты внутри страны решили свергнуть предыдущую администрацию. Теперь [From.GetLeader] заявил, что объявление войны их предыдущим режимом недействительно."
  kmtmisc.6.a:0 "Мы признаем это новое правительство."
  kmtmisc.6.b:0 "Наши все еще в силе."
  kmtmisc.7.t:0 "Мир с [From.GetName]"
  kmtmisc.7.d:0 "[From.GetLeader] признал нашу новую администрацию и прекратил враждебные действия против нас."
  kmtmisc.7.a:0 "Наша благодарность."
  kmtmisc.8.t:0 "[From.GetName] продолжает войну"
  kmtmisc.8.d:0 "[From.GetLeader] решил продолжить войну."
  kmtmisc.8.a:0 "Это нехорошо."
  kmtmisc.9.d:0 "В [From.GetName] произошёл переворот, новое правительство настроено крайне анти-японски и аннулировало все соглашения, заключённые между нами и предыдущей администрацией, даже объявление войны нашим врагам."
  kmtmisc.9.a:0 "Мы должны вмешаться!"
  kmtmisc.9.b:0 "Ничего не можем сделать."
  kmtmisc.10.t:0 "[From.GetName] Вернул земли"
  kmtmisc.10.d:0 "[From.GetName] вернул часть наших земель, оккупированных ими."
  kmtmisc.10.a:0 "Благодарим их."
  kmtmisc.11.t:0 "[From.GetName] Требует [721.GetName]"
  kmtmisc.11.d:0 "Опасаясь, что японцы могут нарушить наш нейтралитет и силой захватить [721.GetName], [From.GetAdjective] попросил нас временно разрешить их войскам пройти или охранять этот район. Однако это, несомненно, сделает его мишенью для японцев."
  kmtmisc.11.a:0 "Хорошо, мы разрешим это."
  kmtmisc.11.b:0 "Наш нейтралитет не должен быть нарушен."
  kmtmisc.12.t:0 "[From.GetName] Согласен"
  kmtmisc.12.d:0 "Наша просьба гарнизонировать [721.GetName] была удовлетворена."
  kmtmisc.12.a:0 "Это, безусловно, поможет в нашей войне против японцев."
  kmtmisc.13.t:0 "[From.GetName] Отказывает"
  kmtmisc.13.d:0 "Наша просьба защитить людей [721.GetName] от японской угрозы была отклонена."
  kmtmisc.13.a:0 "Может быть, есть другой, хотя и менее репутационный способ."
  kmtmisc.14.t:0 "[From.GetName] Занимает [721.GetName]"
  kmtmisc.14.d:0 "Не считаясь с нашим нейтралитетом, войска [From.GetAdjective] высадились в [721.GetName] и заняли этот район."
  kmtmisc.14.a:0 "Мы направим официальную жалобу."
  kmtmisc.14.b:0 "Это не должно остаться безнаказанным."
  kmtmisc.15.t:0 "[From.GetName] Возвращает [721.GetName]"
  kmtmisc.15.d:0 "[From.GetName] вернул нам [721.GetName]."
  kmtmisc.15.a:0 "Очень хорошо."
 
  wd.2.t:0 "[From.GetName] стремится к миру"
  wd.2.d:0 "После недавнего изменения политики, [From.GetLeader] обратился к нам с предложением заключить мирный договор между нами."
  wd.2.a1:0 "Естественно."
  wd.2.a2:0 "Мы посоветуемся с нашими союзниками."
  wd.2.b:0 "Никогда!"
  wd.3.t:0 "Мир с [From.From.GetName]"
  wd.3.d:0 "[From.From.GetName] обратился к [From.GetName] с предложением о заключении мирного договора. Каков будет наш ответ?"
  wd.3.a:0 "Нам нужен мир"
  wd.3.b:0 "Нет"
  wd.4.t:0 "Мир!"
  wd.4.d:0 "Все наши союзники согласились на мирный договор."
  wd.4.a:0 "Отлично."
  wd.5.t:0 "Мир с [From.GetName]"
  wd.5.d:0 "[From.GetName] согласился на мирный договор."
  wd.5.a:0 "Очень хорошо."
  wd.6.t:0 "Нет мира с [From.GetName]"
  wd.6.d:0 "[From.GetName] отклонил мирный договор."
  wd.6.a:0 "Жаль."
  wd.7.t:0 "Мир с [From.GetFaction]"
  wd.7.d:0 "При полной поддержке внутри [From.GetFaction] мирный договор подписан."
  wd.7.a:0 "Великолепно."
  wd.8.t:0 "[From.GetLeader] Отклоняет предложение"
  wd.8.d:0 "[From.GetLeader] отклонил предложение о мире."
  wd.8.a:0 "Мы уважаем их решение."
  wd.9.t:0 "Нет мира с [From.GetFaction]"
  wd.9.d:0 "Не достигнув консенсуса внутри [From.GetFaction], мирный договор был отклонен."
  wd.9.a:0 "Обидно."
