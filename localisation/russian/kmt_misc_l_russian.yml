  IDC_siam_reparation:0 "Репарации от Сиама"
  SIA_franco_thai_war_idea:0 "Война с Индокитаем"
  KMT_sia_no_collab_with_lao_cam_bur_tt:0 "Сиам не может установить правительство в сотрудничестве с Лаосом, Камбоджей, Малайей и Бирмой"