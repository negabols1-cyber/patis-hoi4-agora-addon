  IDC_loyalty_to_france:0 "Признать легитимность [From.GetName]"
  IDC_request_assistance:0 "Запросить помощь"
  IDC_request_assistance_desc:0 "У нас мало шансов выстоять против японцев, мы должны попросить помощи в защите от них."
  IDC_preemptive_strike:0 "Превентивный удар"
  IDC_preemptive_strike_desc:0 "Хотя наши шансы выжить в битве с японцами малы, мы не сдадимся без боя."
  SIA_attack_indochina:0 "Напасть на [IDC.GetName]"
  SIA_attack_indochina_desc:0 "Слабость, показанная колониальным правительством Индокитая, убедила Плека Пхибунсонграма отвоевать утраченные территории у французов."
  SIA_free_thai_coup:0 "Анти-японский переворот"
  SIA_free_thai_coup_desc:0 "Анти-Японские настроения быстро растут, и нынешнее правительство больше не пользуется поддержкой народа"
  AST_demand_portuguese_timor:0 "Затребовать $721.GetName$"
  AST_demand_portuguese_timor_desc:0 "Японцы угрожают Ост-Индии. Однако администрация в $721.GetName$ старается оставаться нейтральной. Мы не можем допустить нарушения её нейтралитета, которое поставит нас в невыгодное положение."
  AST_occupy_portuguese_timor:0 "Занять $721.GetName$"
  AST_occupy_portuguese_timor_desc:0 "Ввиду отказа администрации $721.GetName$ сотрудничать, мы вынуждены принять более радикальные меры."
  AST_return_portuguese_timor:0 "Вернуть $721.GetName$"
  AST_return_portuguese_timor_desc:0 "После устранения угрозы мы можем вернуть $721.GetName$ прежнему владельцу."
  IDC_return_indochina_land:0 "Вернуть земли Индокитая"
