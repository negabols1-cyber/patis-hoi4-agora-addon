  unit_limit_label:0 "§HМаксимальное количество поддерживаемых дивизий§!\nДивизий: [?max_divisions|H0]\n\nБазовое значение: [?base_units|G1]\n   - от базового населения: [?core_base|G1][unit_limit_noncore_population][unit_limit_subject_population_bonus]\n   - от захваченных территорий: [?num_owned_states|G0][unit_limit_subject_state_bonus]\n\nМножитель фабричного учета: [?industry_factor_uncapped|H%][unit_limit_modifier_was_capped][unit_limit_modified_by][unit_limit_faction_leader][unit_limit_economy_law]\n\nПо умолчанию: [?global.base_unit_limit_bonus|G=0][unit_limit_bonus_used]"
  unit_limit_desc:0 "Каждая страна имеет возможность поддерживать только определенное количество отдельных войсковых дивизий, прежде чем ее экономика и инфраструктура начнут бороться за их содержание.\n\nМаксимальное количество поддерживаемых подразделений основано на §Hчисленности населения§! и §Hколичестве захваченных территорий§! и затем умножается на отношение этого значения к §Hчислу фабрик§! в провинциях.\n\nВо время §Hгражданских войн§! базовые значения рассчитываются из суммы всех провинций, захваченных всеми участниками.[above_unit_limit_desc]"
  civil_war_bonus:0 "Бонус в гражданской войне: §G%100§!"

  unit_limit_desc_fake_intel:0 "(§HРазведывательные дивизии§! не учитываются при расчете лимита дивизий)"

  unit_limit_desc_above_limit:0 "\n\n--------------\n\n§RВ настоящее время мы превысили нашу пропускную способность, и единственный способ ослабить нагрузку на нашу страну - это убрать часть наших дивизий.§!\n\n$MODIFIER_ARMY_ORG_FACTOR$: [?mobilisation_penalty_var|+=%1]\n$MODIFIER_CONSUMER_GOODS_FACTOR$: [?mobilisation_penalty_var_positive|=%H1]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?mobilisation_penalty_var|+=%]\n$MODIFIER_TRAINING_TIME_ARMY_FACTOR$: [?mobilisation_penalty_var_positive|-=%]\n$MODIFIER_LAND_REINFORCE_RATE$: [?mobilisation_reinforce_penalty_var|+=%1]"

  unit_limit_noncore_population_desc:0 "\n   - от нетитульного населения: [?non_core_base|G1]"
  unit_limit_subject_population_bonus_desc:0 "\n   - от населения §Hсубъекта§!: [?subject_base_units|G1]"
  unit_limit_subject_state_bonus_desc:0 "\n   - от территорий §Hсубъекта§!: [?subject_states|G0]"
  unit_limit_modifier_was_capped_desc:0 "\n(Ограничено до минимума [?0.5|H%])"
  unit_limit_modified_by_desc:0 "\n\nДалее модифицируется:"
  unit_limit_faction_leader_desc:0 "\n   - Лидер фракции: §G+15%§!"
  unit_limit_bonus_used_desc:0 "\nНациональный дух: [?modifier@unit_limit_bonus|=+0]"
  unit_limit_has_war_desc:0 "\n   - Идет война: §G+20%§!"
  unit_limit_fascism_desc:0 "\n   - Фашизм: §G+10%§!"
  unit_limit_communism_desc:0 "\n   - Коммунизм: §G+10%§!"
  unit_limit_neutrality_desc:0 "\n   - Нейтралитет: §G+5%§!"
  unit_limit_was_capped_desc:0 "\n\n   - Итого без ограничений: [?net_max_divisions|H0]"
  unit_limit_num_states_used_desc:0 "\n\n   Поскольку полученное общее число оказалось меньше количества захваченных территорий ([?num_owned_states|H0]), вместо этого было использовано оно."
  unit_limit_default_used_desc:0 "\n\n   Поскольку полученное общее число оказалось меньше значения по умолчанию (§H5§!), вместо него было использовано оно."

  unit_limit_low_economic_mobilisation:0 "\n   - §H$low_economic_mobilisation$§!: [?modifier@unit_limit_factory_bonus|+=%0]"
  unit_limit_partial_economic_mobilisation:0 "\n   - §H$partial_economic_mobilisation$§!: [?modifier@unit_limit_factory_bonus|+=%0]"
  unit_limit_war_economy:0 "\n   - §H$war_economy$§!: [?modifier@unit_limit_factory_bonus|+=%0]"
  unit_limit_tot_economic_mobilisation:0 "\n   - §H$tot_economic_mobilisation$§!: [?modifier@unit_limit_factory_bonus|+=%0]"

