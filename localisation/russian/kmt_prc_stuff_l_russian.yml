  PRC_dummy_decision:0 "Советы"
  PRC_dummy_decision_desc:0 "Панель появится, когда вы выберете одно из показанных выше государств. В ней вы найдете кнопки для проведения вашей партизанской операции.\n\nНезакрашенные серым государства - это государства, в которых вы создали партизанские ячейки."
  PRC_dcat_internal_power_struggle:0 "Внутренняя борьба за власть"
  PRC_dcat_internal_power_struggle_desc:0 "ПКК все еще переживает период нестабильности из-за внутренней борьбы за власть, хотя и не такой жестокой как прежде. Великий поход стал свидетелем того, как §HMао Цзэдун§! стал лидером Центральной Красной Армии с помощью гениальных политических маневров.\n\nОднако §HЧжан Готао§!, лидер Четвертой красной армии, по-прежнему имеет большое влияние в партии, хотя и не может соперничать с позицией Мао.\n\nЕще одним вероятным кандидатом на эту внутреннюю роль может стать §ХВан Мин§!, с его подхалимским отношением к Коминтерну и Советскому Союзу, несмотря на снижающуюся власть и популярность в партии.\n\n§CВлияние внутриполитических сил:§!\n\n                   §HMао Цзэдун                        Ван Мин                        Чжан Готао§!\n                              [?This.PRC_ips_mao_support|+0]                                          [?This.PRC_ips_wang_support|+0]                                             [?This.PRC_ips_zhang_support|+0]\n"
