  PRC_if_would_result_in_negative_pp:0 "§RЕсли вышеуказанный вычет из политической власти приведёт к отрицательной политической власти, также примените следующий эффект:§!\n"
  PRC_invite_expel_cd_mil:0 "Не выгоняли советских военных советников в последние §H350§! дней"
  PRC_invite_expel_cd_pol:0 "Не выгоняли советских политических советников в последние §H350§! дней"
  PRC_invite_expel_cd_engi:0 "Не высылали советских инженеров в течение последних §H350§! дней"
  PRC_decrease_comintern_autonomy1:0 "§HUменьшить нашу Автономию в Коминтерне на 1.§!\n"
  PRC_increase_comintern_autonomy1:0 "§HУвеличить нашу Автономию в Коминтерне на 1.§!\n"
  PRC_request_sov_pol_supp_cd_tt:0 "Не запрашивали политическую поддержку в течение последних §H150§! дней"
  PRC_request_sov_mil_supp_cd_tt:0 "Не запрашивали военную поддержку в течение последних §H200§! дней"
  PRC_renounce_mongolia_claim:0 "§H[818.GetName]§!, §H[817.GetName]§!, §H[819.GetName]§!, §H[329.GetName]§! и §H[330.GetName]§! больше не считаются неотъемлемыми частями §H[PRC.GetName]§!.\n"
  PRC_sov_mission_timeout_tt:0 "§RМиссия продлится около 160 дней. После этого наша автономия снизится на 1 уровень.§!\n"
  SOV_pol_mission_cd_tt:0 "Не отправляли политических миссий в течение последних §H200§! дней."
  SOV_mil_mission_cd_tt:0 "Не отправляли военных миссий в течение последних §H200§! дней."
  SOV_pro_sov_campaign_cd_tt:0 "Не отдавали приказа организовать просоветскую пропагандистскую кампанию в течение последних §H200§! дней."
  SOV_invite_to_union_cd_tt:0 "Не приглашали [PRC.GetName] в течение последних §H360§! дней."
  PRC_strongarm_sov_tt:0 "§CКогда указанное выше время миссии для §H[PRC.GetName]§! закончится, они сразу станут нашим подданным. Тем не менее, они могут порвать с нами или достичь максимального уровня автономии, чтобы предотвратить это.§!\n"
  PRC_minimum_autonomy_level_at3:0 "§RБудучи подчинёнными §H[SOV.GetName]§!, ваш уровень автономии не может быть повышен выше, чем §CPowerful Influence§!.§!"
  PRC_dcat_autonomy_from_comintern:0 "Автономия КНР от Советского Союза"
  PRC_dcat_autonomy_from_comintern_desc:0 "Поскольку интернационалисты контролируют большую часть власти в КПК, их восприимчивость к Советскому Союзу оказывается полезной для сотрудничества между ними. Однако это также открывает новые возможности для вмешательства СССР в дела КПК."
  PRC_comintern_autonomy_highest_tt:0 "Незначительное влияние"
  PRC_comintern_autonomy_highest_tt_delayed:0 "Советский Союз обладает некоторой, но незначительной властью над КПК.\n\nОн предоставляет следующий модификатор для КПК:\n   Прирост политической власти: §G+10%§!"
  PRC_comintern_autonomy_higher_tt:0 "Небольшое влияние"
  PRC_comintern_autonomy_higher_tt_delayed:0 "Советский Союз может вмешиваться в мелкие дела внутри КПК.\n\nОн предоставляет следующий модификатор для КПК:\n   Прирост политической власти: §G+5%§!"
  PRC_comintern_autonomy_high_tt:0 "Среднее влияние"
  PRC_comintern_autonomy_high_tt_delayed:0 "Ряд позиций и вопросов внутри КПК подвергаются советской проверке, иногда при необходимости вносятся корректировки.\n\nОн предоставляет следующий модификатор для КПК:\n   Ежедневная поддержка коммунизма: §G+0.05§!"
  PRC_comintern_autonomy_low_tt:0 "Значительное влияние"
  PRC_comintern_autonomy_low_tt_delayed:0 "Принятия решений в КНР теперь ставит советские интересы во главу угла из-за усиления советского давления.\n\nЭто дает следующий модификатор КНР:\n   Ежедневная политическая власть: §R-5%§!\n   Ежедневная поддержка коммунизма: §G+0.05§!"
  PRC_comintern_autonomy_lower_tt:0 "Крепкая хватка"
  PRC_comintern_autonomy_lower_tt_delayed:0 "Большинство вопросов в КНР требуют советского надзора или одобрения для их продолжения.\n\nЭто дает следующий модификатор КНР:\n   Ежедневная политическая власть: §R-10%§!\n   Ежедневная поддержка коммунизма: §G+0.05§!"
  PRC_comintern_autonomy_lowest_tt:0 "Почти полный контроль"
  PRC_comintern_autonomy_lowest_tt_delayed:0 "Советский Союз обладает почти полным контролем над КНР.\n\nЭто дает следующий модификатор КНР:\n   Ежедневная политическая власть: §R-25%§!\n   Стабильность: §G+5%§!\n   Ежедневная поддержка коммунизма: §G+0.05§!"
  PRC_break_tie_with_sov:0 "Разорвать связи с [SOV.GetName]"
  PRC_break_tie_with_sov_desc:0 "Хотя наши связи с [SOV.GetNameDEF] дают нам некоторые преимущества, они также делают нас уязвимыми для их манипуляций. Возможно, будет лучше, если мы будем держаться от них на более безопасном расстоянии, чем сейчас."
  PRC_petition_to_join_the_union:0 "Петиция о вступлении в Союз"
  PRC_petition_to_join_the_union_desc:0 "Стать одной из советских социалистических республик в составе Советского Союза было бы величайшей честью для нас."
  PRC_invite_sov_military_advisors:0 "Пригласить советских военных советников"
  PRC_invite_sov_military_advisors_desc:0 "Опыт советских военных может помочь нашему войску стать лучше.\n\nОднако, заручившись их помощью, мы станем менее независимы от них."
  PRC_expel_sov_military_advisors:0 "Изгнать советских военных советников"
  PRC_expel_sov_military_advisors_desc:0 "Присутствие советских военных советников дает им доступ ко множеству нашей информации и укрепляет их влияние на нас. Мы не должны позволять этому продолжаться, несмотря на пользу, которую они нам приносят."
  PRC_invite_sov_political_advisors:0 "Пригласить советских политических советников"
  PRC_invite_sov_political_advisors_desc:0 "Многому можно научиться у административной структуры Советского Союза. Мы должны быть активными в моделировании своего правительства по образцу их правительства.\n\nОднако, заручившись их помощью, мы станем менее независимы от них."
  PRC_expel_sov_political_advisors:0 "Изгнать советских политических советников"
  PRC_expel_sov_political_advisors_desc:0 "Присутствие советских политических советников дает им доступ ко множеству нашей информации и укрепляет их влияние на нас. Мы не должны позволять этому продолжаться, несмотря на пользу, которую они нам приносят."
  PRC_invite_sov_engineers:0 "Пригласить советских инженеров"
  PRC_invite_sov_engineers_desc:0 "Индустриализация в Советском Союзе оказалась очень успешной. Мы могли бы проконсультироваться и нанять некоторых из их промышленных талантов, чтобы улучшить наши производственные мощности.\n\nОднако, заручившись их помощью, мы станем менее независимы от них."
  PRC_expel_sov_engineers:0 "Выслать советских инженеров"
  PRC_expel_sov_engineers_desc:0 "Присутствие советских инженеров дает им доступ к нашим сведениям и укрепляет их контроль над нами. Мы не должны допустить этого, несмотря на приносимую ими пользу."
  PRC_request_sov_political_support:0 "Просить политической поддержки"
  PRC_request_sov_political_support_desc:0 "При некоторой поддержке и руководстве со стороны Советского Союза мы могли бы добиться значительных успехов в наших политических начинаниях."
  PRC_request_sov_military_support:0 "Просить военной поддержки"
  PRC_request_sov_military_support_desc:0 "Чтобы добиться успеха в нашей революции, нам понадобятся достаточная военная мощь и оснащение, чтобы свергнуть угнетающие режимы. Мы должны просить помощи у Советского Союза."
  PRC_drop_northern_claims_for_political_and_industrial_support:0 "Предложить договор о советско-китайской дружбе"
  PRC_drop_northern_claims_for_political_and_industrial_support_desc:0 "Наши отношения с Советским Союзом все еще оставляют много места для улучшения. Мы можем отказаться от наших претензий на регион Внешней Монголии, чтобы завоевать больше их благосклонности, особенно для получения столь необходимой промышленной помощи."
  PRC_reduce_sov_influence:0 "Уменьшить советское влияние"
  PRC_reduce_sov_influence_desc:0 "Текущее влияние Советского Союза на нашу партию крайне нежелательно. Мы должны попытаться исправить ситуацию, прежде чем она выйдет из-под контроля."
  PRC_criticise_reliance_on_sov:0 "Критиковать зависимость от Советского Союза"
  PRC_criticise_reliance_on_sov_desc:0 "Нынешнее влияние Союза на партию опасно крепнет и не ослабевает. Мы должны занять более жесткую позицию в отношении его вмешательства"
  SOV_meddle_in_ccp_internal_affairs:0 "Вмешиваться во внутренние дела ККП"
  SOV_meddle_in_ccp_internal_affairs_desc:0 "При нашем нынешнем влиянии на ККП мы можем, возможно, заставить их в некоторых вопросах примкнуть к нашим интересам"
  SOV_dispatch_political_mission:0 "Отправить политическую миссию"
  SOV_dispatch_political_mission_desc:0 "Под видом оказания помощи в политических действиях, команда верных чиновников будет отправлена для сбора информации в ККП. Это позволит нам усилить наш контроль над ними"
  SOV_dispatch_military_mission:0 "Отправить военную миссию"
  SOV_dispatch_military_mission_desc:0 "Под видом оказания помощи в их военных усилиях, группа лояльных чиновников будет отправлена для сбора информации в ККП. Это позволит нам усилить над ними контроль"
  SOV_order_pro_sov_thought_correction_campaign:0 "Приказать организовать просоветскую кампанию"
  SOV_order_pro_sov_thought_correction_campaign_desc:0 "Некоторые члены ККП демонстрируют все большее недовольство и недоверие к нам, поскольку мы усиливаем влияние на их партию. Мы не должны позволять этим людям мешать нашим действиям"
  SOV_invite_to_the_union:0 "Пригласить [PRC.GetName] в Советский Союз"
  SOV_invite_to_the_union_desc:0 "Наш контроль над КПК теперь является адекватным, мы должны предложить им статус свободной республики в составе славного Союза."
  SOV_strongarm_into_the_union:0 "Уговорить [PRC.GetName] в Союз"
  SOV_strongarm_into_the_union_desc:0 "Неблагодарные крысы в КПК отвергли наше приглашение стать частью Союза. Теперь мы будем применять более грубый подход к этому вопросу."
  SOV_the_unbreakable_union_of_freeborn_republics:0 "Неразрывный Союз свободнорожденных республик"
  SOV_the_unbreakable_union_of_freeborn_republics_desc:0 "Советский Союз сейчас использует множество политических маневров, чтобы попытаться заставить нас стать его частью. Если мы не будем действовать быстро, наша автономия будет сильно истощена."
  PRC_broken_tie_with_SOV:0 "Разорвали связи с Советским Союзом"
  PRC_not_at_offensive_war_with_non_target_chinese_countries:0 "Не находятся в наступательной войне с другими китайскими странами, за исключением Центрального правительства, если оно не завершило фокус §HОтдать приоритет внешней угрозе§!"
  PRC_accumulated_capital_change_tt:0 "Изменить накопленный капитал на [?PRC.PRC_accumulated_capital_change|2+].\n"
  PRC_kgb:0 "Министерство шпионажа и секретных дел"
  PRC_increase_foundation_for_industrialisation:0 "§GУвеличить §HОснова для индустриализации§! на §H1§!.§!\n"
  PRC_dcat_capital_accumulation:0 "Накопление капитала"
  PRC_dcat_capital_accumulation_desc:0 "В чем-то похожая на новую экономическую политику Советского Союза, наша текущая программа направлена на накопление достаточного капитала для индустриализации нашей возлюбленной нации при одновременном сокращении советского вмешательства. Однако, как и НЭП, некоторые члены партии рассматривают это как своего рода предательство революции и неоправданное осложнение нашего прогресса.\n\nПуть впереди может быть долгим и трудным, но дух наших товарищей, безусловно, будет нерушимым!\n\n§HНакопленный капитал§!: [?PRC_accumulated_capital|2+]\n\n§HОснова индустриализации§!: [?PRC_capital_spent|0+]"
  PRC_monthly_export:0 "Ежемесячный экспорт"
  PRC_monthly_export_desc:0 "Наш основной способ накопления капитала заключается в экспорте плодов труда рабочих за границу в обмен на ресурсы, необходимые для индустриализации."
  PRC_capital_change_breakdown:0 "Прибыль от капитала благодаря §HТорговой политике§!: [?PRC_accumulated_capital_change|2+]\n"
  PRC_capital_change_breakdown2:0 "Прибыль от капитала благодаря национальному духу §HЭкспорт за капитал§!: §G1§!\n"
  PRC_capital_change_breakdown3:0 "Прибыль от капитала благодаря §HКоллективным фермам§!: [?PRC_collective_farm_additional_capital|2+]\n\n"
  PRC_collective_farm_additional_capital_tt:0 "Добавляет §G0.1§! к прибыли от капитала благодаря §HКоллективным фермам§! в §HЕжемесячном экспорте§!\n"
  PRC_seize_capitalist_assets_in_shanghai:0 "Захват капиталистических активов в [863.GetName]"
  PRC_seize_capitalist_assets_in_shanghai_desc:0 "[863.GetName] на протяжении многих лет служил воротами для проникновения Запада в Китай. Коррупция, порожденная капитализмом, оставила свой отпечаток и на этом мегаполисе. Мы не должны позволить капиталистам и дальше эксплуатировать китайский народ!"
  PRC_collect_extraordinary_taxes:0 "Взимание чрезвычайных налогов"
  PRC_collect_extraordinary_taxes_desc:0 "Государство нуждается в поддержке"
  PRC_collectivise_farms_in_state:0 "Коллективизация сельского хозяйства в [From.GetName]"
  PRC_collectivise_farms_in_state_desc:0 "Коллективизация сельского хозяйства позволит наладить лучший контроль и мониторинг аграрного сектора в [From.GetName]."
  PRC_further_farm_collectivisation_in_state:0 "Дальнейшая коллективизация сельского хозяйства в [From.GetName]"
  PRC_small_arms_sale:0 "Продажа стрелкового оружия"
  PRC_small_arms_sale_desc:0 "Избыток оружия на складах можно продать в другие страны за дополнительный капитал."
  PRC_buy_guns:0 "Закупка стрелкового оружия"
  PRC_buy_guns_desc:0 "Запасы оружия на государственных складах истощаются; возможно, стоит перераспределить часть ресурсов с индустриализации на покупку вооружения."
  PRC_fund_research_committees:0 "Финансирование исследовательских комитетов"
  PRC_fund_research_committees_desc:0 "Техническая отсталость нашей страны очевидна. Эту проблему необходимо решать."
  PRC_import_machineries:0 "Импорт оборудования"
  PRC_import_machineries_desc:0 "Только с подходящими инструментами наши рабочие смогут производить качественные товары. Импорт зарубежных машин станет для нас отличным трамплином"
  PRC_improve_railways:0 "Строительство железных дорог"
  PRC_improve_railways_desc:0 "Чтобы быстро перевезти большое количество сырья и товаров, нам нужно соединить разные уголки нашей страны железными дорогами"
  PRC_invite_foreign_bidders:0 "Пригласить иностранных подрядчиков"
  PRC_invite_foreign_bidders_desc:0 "Из-за нехватки технологических знаний, наши инженеры и архитекторы вряд ли смогут соревноваться с инженерами и архитекторами из других стран. Предлагается пригласить иностранные компании для проведения строительных работ, а также изучать их работу для нашего будущего блага"
  PRC_build_new_factories:0 "Строительство новых фабрик"
  PRC_build_new_factories_desc:0 "Нам понадобится больше фабрик, чтобы производить технику и вооружение для нашей страны"
  PRC_expand_shipbuilding:0 "Расширить судостроительный сектор"
  PRC_expand_shipbuilding_desc:0 "Судостроительную промышленность нашей страны нельзя игнорировать, потому что она будет иметь решающее значение для развития будущего флота"
  PRC_import_tractors:0 "Импортировать тракторы"
  PRC_import_tractors_desc:0 "Поскольку мы мало знаем о механизированном или индустриализированном сельском хозяйстве, нам сначала нужно будет положиться на импорт сельскохозяйственной техники, чтобы модернизировать сельскохозяйственный сектор"
  PRC_establish_secret_police:0 "Создание секретной полиции"
  PRC_establish_secret_police_desc:0 "Наша текущая политика нравится не всем в партии. Мы должны быть готовы к любой реакционной деятельности, вызванной этими настроениями."
  PRC_anti_corruption_campaign:0 "Антикоррупционная кампания"
  PRC_anti_corruption_campaign_desc:0 "Большое количество капитала и богатства, накопленных партией за счет экспорта, выявили слабохарактерных людей внутри нее. Начали накапливаться сообщения о предполагаемой коррупции. Партия должна решить эту проблему до того, как ущерб станет слишком большим."
  PRC_two_steps_forward:0 "Два шага вперед"
  PRC_two_steps_forward_desc:0 "Если нашу предыдущую политику считать шагом назад от социалистического государства, то теперь мы делаем два шага вперед!"
  PRC_locks_capital_accumulation:0 "§RДанное решение заблокирует эту категорию решений.§!\n\n"
  PRC_higher_foundation_more_pp:0 "§HПолитическая награда прямо пропорциональна промышленной основе.§!"
  cost_50_pp_cp:0 "§H£command_power 50 £pol_power 50§!"
  cost_50_pp_cp_blocked:0 "§R£command_power 50 £pol_power 50§!"
  cost_50_pp_cp_tooltip:0 "Выбор обойдется в §H£command_power 50 £pol_power 50§!"
  PRC_cost_100_pp_50_cp:0 "§H£command_power 50 £pol_power 100§!"
  PRC_cost_100_pp_50_cp_blocked:0 "§R£command_power 50 £pol_power 100§!"
  PRC_cost_100_pp_50_cp_tooltip:0 "Выбор обойдется в §H£command_power 50 £pol_power 100§!"
  PRC_dcat_spies_within_our_enemies:0 "Инфильтрация во врага"
  PRC_infiltrate_from_military:0 "Инфильтрация военного командования [From.GetName]"
  PRC_root_out_ccp_spies:0 "Устранение шпионов КПК"
  PRC_seek_from_ally:0 "Сделать союзником [From.GetName]"
  PRC_appeal_to_nationalistic_fervor:0 "Апелляция к националистическому рвению"
  PRC_appeal_to_nationalistic_fervor_desc:0 "Пара националистических речей и несколько брошюр — и можно уже манипулировать целой кучей фанатично настроенных националистов. Однако не исключено, что против тех, у кого острый ум, такая половинчатая уловка не сработает."
  PRC_disseminate_anti_kmt_propaganda:0 "Распространение антигоминьдановской пропаганды"
  PRC_disseminate_anti_kmt_propaganda_desc:0 "Дискредитация врага может подорвать его мощь и привлечь на нашу сторону больше людей."
  PRC_include_class_enemies_within_the_united_front:0 "Включение классовых врагов в состав единого фронта"
  PRC_include_class_enemies_within_the_united_front_desc:0 "Некоторые классовые враги рабочих имеют в стране большую власть. Нам, возможно, придется заключить компромисс и подавить чрезмерно рьяных членов партии, если мы хотим использовать их помощь при формировании единого фронта." 
  PRC_reiterate_national_defence_principles:0 "Повторное заявление принципов национальной обороны"
  PRC_reiterate_national_defence_principles_desc:0 "Некоторые сомнения по поводу нашей легитимности можно развеять патриотической речью и несколькими показательными действиями, но если мы будем делать это слишком долго, убедить народ будет все труднее."
  PRC_dismantle_national_defence_government:0 "Расформирование правительства национальной обороны"
  PRC_lack_of_pragmatic_actions:0 "Отсутствие конкретных действий"
  PRC_lack_of_pragmatic_actions_desc:0 "Несмотря на наши заявления о защите нации, наше отсутствие конкретных действий по ее поддержке заставило многих усомниться в нашей искренности. Если мы не примем своевременных мер, наша легитимность может быть серьезно подорвана."
  PRC_dcat_national_defense_government:0 "Национальное правительство обороны"
  PRC_dcat_national_defense_government_desc:0 "Поскольку Гоминьдан продолжает отрицать сотрудничество между нашими двумя партиями, мы вынуждены следовать идее создания Национального правительства обороны.\n\nОднако этот план не совершенен, и многие все еще сомневаются в нашей легитимности в руководстве так называемым «Единым фронтом»."
  PRC_dcat_education_refinement:0 "Рафинирование образования"
  PRC_literacy_drive:0 "Кампания по повышению грамотности"
  PRC_implement_compulsory_education:0 "Внедрение обязательного образования"
  PRC_university_expansion_wm:0 "Расширение университета"
  PRC_rural_school_construction:0 "Строительство сельских школ"
  PRC_better_officials_selection_criteria:0 "Улучшение критериев отбора чиновников"
  PRC_accumulated_capital_atleast_4:0 "§HНакопленный капитал§! составляет не менее §H4§!."
  PRC_accumulated_capital_atleast_10:0 "§HНакопленный капитал§! составляет не менее §H10§!."
  PRC_accumulated_capital_atleast_8:0 "§HНакопленный капитал§! составляет не менее §H8§!."
  PRC_accumulated_capital_atleast_5:0 "§HНакопленный капитал§! составляет не менее §H5§!."
  PRC_accumulated_capital_atleast_7:0 "§HНакопленный капитал§! составляет не менее §H7§!."
  PRC_decrease_natdef_legitimacy1:0 "§RСнизить легитимность §HНационального правительства обороны§! на §H1§!§!"
  PRC_decrease_natdef_legitimacy2:0 "§RСнизить легитимность §HНационального правительства обороны§! на §H2§!§!"
  PRC_decrease_natdef_legitimacy3:0 "§RСнизить легитимность §HНационального правительства обороны§! на §H3§!§!"
  PRC_decrease_natdef_legitimacy5:0 "§RСнизить легитимность §HНационального правительства обороны§! на §H5§!§!"
  PRC_increase_natdef_legitimacy1:0 "§GПовысить легитимность §HНационального правительства обороны§! на §H1§!§!"
  cost_150_pp_80_cp:0 "§H£pol_power 150 £command_power 80§!"
  cost_150_pp_80_cp_blocked:0 "§R£pol_power 150 £command_power 80§!"
  cost_150_pp_80_cp_tooltip:0 "Выбор этого пункта будет стоить §H£pol_power 150 £command_power 80§!"
  cost_200_pp_40_cp:0 "§H£pol_power 200 £command_power 40§!"
  cost_200_pp_40_cp_blocked:0 "§R£pol_power 200 £command_power 40§!"
  cost_200_pp_40_cp_tooltip:0 "Выбор этого пункта будет стоить §H£pol_power 200 £command_power 40§!"
  PRC_dcat_prepare_for_civil_war:0 "Готовимся к Гражданской войне"
  PRC_dcat_prepare_for_civil_war_desc:0 "Этот относительный мир между нами и [KMT_central_gov_tag.GetRulingParty] многими уважаемыми товарищами в Партии признаётся преходящим. Мы должны сделать всё возможное, пока они снова не ударили по нам, или сами развязать против них войну."
  PRC_the_revolution_continues:0 "Продолжить революцию"
  PRC_the_revolution_continues_desc:0 "Многие наши товарищи активно готовятся перенести схватку в [KMT_central_gov_tag.GetRulingParty]. Мы можем сдерживать их несколько месяцев, но не дольше. Мы должны убедиться, что подготовка, проводимая в эти сроки, адекватна."
  PRC_leave_united_front:0 "Выйти из Единого фронта"
  PRC_leave_united_front_desc:0 "После того, как мы разберемся с японской угрозой, Единый фронт больше не будет для нас полезен."
  PRC_glean_equipments:0 "Собрать оборудование"
  PRC_spread_propaganda:0 "Распространять пропаганду"
  PRC_bolster_our_ranks:0 "Усилить наши ряды"
  PRC_overclock_production:0 "Форсировать производство"
  PRC_request_equipment_from_sov:0 "Запросить оборудование у [SOV.GetName]"
  PRC_dcat_remnants_of_opposition:0 "Остатки оппозиции"
  PRC_dcat_remnants_of_opposition_desc:0 "После их позора некоторые члены ККП решили закрепиться в отдаленных районах на наших территориях. Их присутствие нарушает покой в регионе и угрожает местной безопасности."
  PRC_eliminate_zgt_hideout:0 "Устранить Чан Го-тао"
  PRC_eliminate_mao_hideout:0 "Устранить Мао Цзэдуна"
  PRC_2nd_and_4th_army_en_route:0 "2-я и 4-я Красная армия"
  PRC_2nd_and_4th_army_en_route_desc:0 "Во время Великого похода 2-я и 4-я красные армии решили отделиться от 1-й, чтобы не дать силам НРА растратиться и увеличить шансы на сохранение революционных искр. Теперь, когда 1-я армия закрепилась в горах [622.GetName], лидеры 2-й и 4-й красных армий согласились встретиться с 1-й в её нынешнем штабе."
  PRC_build_up_a_conventional_force_mission:0 "Создание обычных вооруженных сил"
  PRC_dcat_build_up_a_conventional_force:0 "Создание обычных вооруженных сил"
  PRC_success_at_all_cost:0 "Успех любой ценой"
  PRC_success_at_all_cost_desc:0 "Мы не можем допустить провал Западной экспедиции!"
  ## 05/12/2021 ##
  PRC_use_gcs_border_war_tt:0 "Переместите §H10§! очков силы партизанской ячейки из случайного соседнего штата, принадлежащего [Root.GetName], в [From.GetName]. Создайте ячейку, если таковой еще нет.\nЕсли значение очков силы партизанской ячейки в [From.GetName], деленное на 10, больше, чем количество дивизий, имеющихся у владельца в штате, вы получаете контроль над штатом."
  ## 06/12/2021 ##
  PRC_dcat_ire:0 "Коммунистическая экспансия"
  PRC_dcat_ire_desc:0 "КПК пообещала Националистам какое-то перемирие. Однако если они продолжат расширять своё влияние, Националисты могут отреагировать не очень положительно и посчитать перемирие расторгнутым.\n\nТекущий гнев: [?global.PRC_expansion_ire|.0-]\nГнев полученный от успешных пограничных стычек: [?global.PRC_expansion_ire_from_bw|.0R]\n\nГнев получается, когда КПК объявляет войну другим китайским государствам или получает новые территории через пограничные стычки. Гнев и прирост гнева от пограничных стычек уменьшается на §H1§! если вы не получали гнева в течение последнего месяца.\n\n§REach успешная пограничная стычка увеличивает прирост гнева через неё на 1. Объявление войны другим китайским государствам приводит к приросту гнева на 5.§!"
  PRC_gain_5_ire_tt:0 "§RПрирост гнева на 5§!"
  PRC_promise_peace_clear_ire:0 "Подтвердить преданность"
  PRC_promise_peace_clear_ire_desc:0 "Подтвердив нашу приверженность сотрудничеству, мы можем избежать наказания за наши предыдущие действия."
  PRC_clear_ire_tt:0 "Сбросить гнев и прирост гнева от пограничных стычек.\n\n§RЭто решение может быть принято только один раз.§!"
  PRC_punish_prc:0 "Наказать красных бандитов"
  PRC_punish_prc_desc:0 "Несмотря на их поверхностное сотрудничество, красные бандиты продолжают своё непрерывное расширение. Мы больше не будем терпеть этого, их нужно остановить!"
  PRC_dcat_expansion_direction:0 "Направления экспансии"
  PRC_take_southern_kansu:0 "Захватить [283.GetName]"
  PRC_reform_conscription:0 "Реформировать призыв"
  PRC_soviet_influence_mission:0 "Советское влияние"
  PRC_soviet_influence_mission_desc:0 "Совместная граница с [SOV.GetName] облегчает проникновение их влияния."
