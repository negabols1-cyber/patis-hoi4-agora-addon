  PRC_enemy_partisan_4:0 "Вражеские партизаны за нашей линией фронта"
  PRC_enemy_partisan_4_desc:0 "Партизаны нашего противника закрепились в глубоком тылу нашего фронта, повреждая маршруты снабжения и замедляя наше наступление.\n\n§RЭтот национальный дух закончится, как только война с КНР закончится.§!\n\n§RПериодическое повреждение зданий на китайских землях, контролируемых нами§!"
