  PRC_guerrilla_panel_details_text:0 "Еженедельный прирост имеет базу §G1§!, §R-0.2§! за каждый уровень инфраструктуры выше 1.\n\nНаличие партизанской ячейки в провинции, где включено сопротивление и которая контролируется вами, предоставляет:\n  §G+0.5%§! прирост лояльности\n  §G-10%§! цель сопротивления\n  §G-150%§! прирост сопротивления\n  §G+200%§! уменьшение сопротивления\n\nПартизанские ячейки также увеличивают §Rцель сопротивления§! и уменьшают §Cприрост лояльности§! в контролируемых противником провинциях."
