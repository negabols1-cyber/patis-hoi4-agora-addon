  ## 16/10/2019 ##
  PRC_convince_woo_former_4th_red_army_generals:0 "Получить поддержку для Чжан Готао"
  PRC_convince_woo_former_4th_red_army_generals_desc:0 "Благодаря недавнему росту его влияния Чан может использовать это для получения новой поддержки среди некоторых выдающихся членов партии, особенно тех, кто когда-то следовал за ним во время Длинного похода."
  PRC_criticise_cd_mission:0 "Перерыв в сессиях"
  PRC_criticise_cd_mission_desc:0 "Сессии заседаний не должны проводиться слишком часто."
  PRC_lower_ips_tt:0 "Влияние нашего лидера должно быть как минимум на 6 значений больше, чем у кого-либо другого."
  PRC_request_soviet_support_for_wang:0 "Советская помощь Ван Мину"
  PRC_request_soviet_support_for_wang_desc:0 "Теперь, когда Советы могут поставлять грузы через Синьцзян, Ван Мин получил возможность увеличить свое влияние и влияние интернационалистского лагеря. Другие лагеря будут более нерешительны в свержении интернационалистского лагеря, поскольку Советы теперь могут вмешаться более прямым образом."
  PRC_internal_power_struggle_concluded:0 "Внутренняя борьба за власть завершена"
  PRC_criticise_cd_trigger_tt:0 "§HПерерыв в сессиях§! не активен"
  PRC_internal_power_struggle_casualties:0 "Потери в ходе борьбы за власть"
  PRC_internal_power_struggle_casualties_desc:0 "Когда позиция [From.GetLeader] находится под угрозой со стороны соперников, обычны жесткие политические маневры внутри партии."
  PRC_soviet_send_representatives:0 "Просьба о присутствии советских представителей"
  PRC_soviet_send_representatives_desc:0 "С присутствием советского представителя Ван Мин сможет реализовать свой план, меньше боясь, что его программу сорвут другие лагеря."
  PRC_discredit_maos_ideas:0 "Дискредитировать идеи Мао"
  PRC_discredit_maos_ideas_desc:0 "Доктрины Мао Цзэдуна во многом расходятся с ортодоксальными советскими стратегиями - революцией в городских районах и восстанием рабочего класса. Вместо этого он предлагает нам закрепиться в сельских районах и намечать крестьянские восстания. Это, конечно, не устраивает Москву. Теперь, обладая большей властью и влиянием в своих руках, Ван Мин может критиковать такой подход к распространению коммунизма в Китае, подрывая репутацию Мао и его видение китайского коммунизма."
  PRC_accuse_zhang:0 "Обвинить Чжан Готао в правом уклоне"
  PRC_accuse_zhang_desc:0 "Хотя 4-я Красная армия Чжана помогла расчистить путь для советской помощи, которая привела Ван Мина к его нынешнему положению, Чжан слишком опасен, чтобы оставаться сильным. То, что он держит в руках заметную армию, является угрозой для каждого лидера партии, кроме него самого. Угроза военного переворота со стороны Чжана и его сил может быть устранена только путем обвинения его в фашистских наклонностях. Это было бы эффективно и, для внешних ушей, логично, если бы кто-то командовал такой значительной частью военных."
  PRC_cost_10_cp:0 "Очки командования §H10§!"
  PRC_cost_10_cp_blocked:0 "Очки командования §R10§!"
  PRC_cost_10_cp_tooltip:0 "Это стоит очки командования §H10§!"
  PRC_cost_5_cp:0 "£command_power §H5§!"
  PRC_cost_5_cp_blocked:0 "£command_power §R5§!"
  PRC_cost_5_cp_tooltip:0 "Выбрать это действие стоит £command_power §H5§!"
  PRC_dcat_the_long_march:0 "Оправиться от Великого похода"
  PRC_dcat_the_long_march_desc:0 "После сокрушительного поражения от Гоминьдана во время Пятой кампании окружения члены нашей партии были вынуждены непрерывно идти около года, чтобы уклониться от преследующих их врагов.\n\nХотя теперь партия обрела опору в горной местности в провинции [622.GetName], разрушения, принесённые поражением и последующим Великим походом, как называют его наши товарищи, оставили партию и её армию едва способными функционировать."
  PRC_is_neighbouring_SHX_tt:0 "Любой полностью контролируемый и принадлежащий нам штат соседствует с полностью контролируемым и принадлежащим штатом §H[SHX.GetName]§!"
  PRC_raid_on_shanxi:0 "Нападение на границу [SHX.GetName]"
  PRC_raid_on_shanxi_desc:0 "У военачальника [SHX.GetLeader] есть земли, богатые ресурсами. Если нам удастся провести успешный рейд на их территории, то, возможно, нам удастся восполнить потери, которые мы понесли во время Великого похода."
  ## 14/02/2020 ##
  PRC_long_march_passive_recovery:0 "Пассивное восстановление"
  PRC_long_march_passive_recovery_desc:0 "Время лечит"
  PRC_winning_lower_lm_penalty_tt:0 "\n§HПобеда в пограничной войне снизит штраф за Великий поход§!§!\n"
  PRC_60days_cd_tt:0 "§HУ этого решения есть откат в §Y60§! дней§!\n\n"
  PRC_recover_with_xsm_spoils:0 "Возрождение с добычей [283.GetName]"
  PRC_recover_with_xsm_spoils_desc:0 "После нашей успешной экспедиции на запад мы получили доступ к бывшим ресурсам Ма Клики. Эти ресурсы помогут нам оправиться от Великого Похода."
  PRC_more_soviet_aid:0 "Запросить советскую помощь"
  PRC_more_soviet_aid_desc:0 "Теперь, когда путь для советской помощи открыт, мы можем запросить дополнительную помощь для нашего восстановления после Великого Похода. Однако это может увеличить влияние Ван Мина в партии."
  PRC_more_sov_aid_mission:0 "Срок поставки советской помощи"
  PRC_wang_ming_influence_grow:0 "Растущее влияние Ван Мина"
  PRC_wang_ming_influence_grow_desc:0 "Занимая важное положение, Ван Мин начал использовать эту возможность для расширения своего влияния в партии."
  PRC_zhang_guotao_influence_grow:0 "Растущее влияние Чжан Готао"
  PRC_zhang_guotao_influence_grow_desc:0 "Занимая важное положение, Чжан Готао начал использовать эту возможность для расширения своего влияния в партии."
  PRC_recover_with_kuomintang_equipment:0 "Контрабанда оборудования Гоминьдана"
  PRC_recover_with_kuomintang_equipment_desc:0 "Теперь, когда мы в Едином Фронте, мы можем \"заимствовать\" некоторое оборудование у Гоминьдана, чтобы помочь нам восстановиться. Однако это может иметь некоторые неприятные последствия."
  PRC_active_recovery_effort:0 "Активные усилия по восстановлению"
  PRC_initiate_west_expedition:0 "Инициировать Западную экспедицию"
  PRC_recover_with_shx_spoils:0 "Восстановить с добычей [615.GetName]"
  PRC_recover_with_shx_spoils_desc:0 "Наше продвижение на восток подарило нам богатые земли [615.GetName], теперь мы используем эти богатства, чтобы помочь себе восстановиться."
  PRC_west_expidition_mission:0 "Западная экспедиция"
  PRC_west_expidition_mission_desc:0 "Было решено, что мы двинемся на запад, чтобы открыть маршрут для прибытия советских поставок. Неспособность вовремя начать экспедицию, несомненно, нанесет ущерб репутации нашего лидера."
  PRC_borderlines_tt:0 "Подсвеченные штаты - это штаты, в которых вы создали партизанские ячейки. При выборе этих штатов появится небольшая панель, в которой вы можете найти некоторые операции, которые могут выполнить партизаны в этом штате.\n\nПартизанские ячейки также будут ежедневно повышать сопротивление и снижать лояльность штатов, в которых они находятся. Ежедневное изменение сопротивления и лояльности зависит от их силы в государстве."
  PRC_has_anti_reactionary_checkpoint:0 "Антиреакционные блокпосты"
  PRC_has_anti_reactionary_checkpoint_desc:0 "По всей провинции установлены блокпосты, следящие за реакционными остатками. Однако эти блокпосты не будут эффективны вечно, так как реакционные остатки всегда каким-то образом найдут способы их обойти."
  PRC_setup_anti_reactionary_checkpoint:0 "Установить антиреакционные блокпосты в [From.GetName]"
  PRC_setup_anti_reactionary_checkpoint_desc:0 "Создание антиреакционных КПП в [From.GetName] позволит нам на время предотвратить проникновение остатков реакционеров на эту территорию."
  PRC_raid_hideout:0 "Рейд на убежища реакционеров в [From.GetName]"
  PRC_raid_hideout_desc:0 "В этом регионе были замечены убежища остатков реакционеров. Если мы не позволим им сбежать в соседние регионы, мы сможем ликвидировать их всех."
  PRC_hideout_relocation:0 "Остатки реакционеров бегут"
  PRC_hideout_relocation_desc:0 "Узнав о нашем скором рейде на их убежища, остатки реакционеров в [From.GetName] начали бежать в другой регион. Мы должны их остановить!"
  PRC_hideout_expansion:0 "Остатки реакционеров расширяются"
  PRC_hideout_expansion_desc:0 "С их нынешней силой остатки реакционеров решили организовать больше убежищ на наших территориях."
  PRC_dcat_zgt_reactionary_elements:0 "Остатки реакционеров"
  PRC_dcat_zgt_reactionary_elements_desc:0 "После прихода к власти Чжан Готао многие из тех, кто следовал за прежним лидером или был недоволен новым руководством, стали активно выступать против него. Несмотря на то, что они не представляют серьезной угрозы, как и некоторые местные бандиты, их нельзя недооценивать.\n\nМаксимальное количество убежищ реакционеров: [?global.PRC_zgt_max_reactionary_hideout|R.0]\n\nТекущее количество убежищ реакционеров: [?global.PRC_zgt_current_reactionary_hideout|R.0]"
  PRC_anti_reactionary_checkpoint:0 "Имеется Антиреакционный контрольно-пропускной пункт"
  PRC_no_reactionary_hideout_tt:0 "-Не имеет никаких тайников реакционеров в контролируемых штатах!"
  PRC_all_reactionary_hideout_tt:0 "-Все контролируемые тобой штаты имеют тайники реакционеров!"
  PRC_no_neighbour_hideout_and_checkpoint_tt:0 "-Не имеет штатов, граничащих с штатами, в которых есть тайники реакционеров, соответствующие следующим условиям:\n\t       Не имеет тайников реакционеров\n\t       Не имеет антиреакционных контрольно-пропускных пунктов\n\t       Контролируется нами!"
  PRC_all_neighbour_checkpoint_tt:0 "Все граничащие с нами штаты имеют антиреакционные контрольно-пропускные пункты!"
  PRC_checkpoint_cost_tt:0 "£command_power [?PRC.PRC_zgt_checkpoint_cp_cost|H.0] £pol_power [?PRC.PRC_zgt_checkpoint_pp_cost|H.0]"
  PRC_checkpoint_cost_tt_blocked:0 "£command_power [?PRC.PRC_zgt_checkpoint_cp_cost|R.0] £pol_power [?PRC.PRC_zgt_checkpoint_pp_cost|R.0]"
  PRC_checkpoint_cost_tt_tooltip:0 "Для выбора этого потребуется £command_power [?PRC.PRC_zgt_checkpoint_cp_cost|H.0] и £pol_power [?PRC.PRC_zgt_checkpoint_pp_cost|H.0]."
  PRC_raid_hideout_cost_tt:0 "£command_power [?PRC.PRC_zgt_raid_hideout_cp_cost|H.0] £pol_power [?PRC.PRC_zgt_raid_hideout_pp_cost|H.0]"
  PRC_raid_hideout_cost_tt_blocked:0 "£command_power [?PRC.PRC_zgt_raid_hideout_cp_cost|R.0] £pol_power [?PRC.PRC_zgt_raid_hideout_pp_cost|R.0]"
  PRC_raid_hideout_cost_tt_tooltip:0 "Стоимость £command_power [?PRC.PRC_zgt_raid_hideout_cp_cost|H.0] и £pol_power [?PRC.PRC_zgt_raid_hideout_pp_cost|H.0]"
  PRC_reactionary_agitation:0 "Агитация реакционеров"
  PRC_reactionary_agitation_desc:0 "Наша политика национализации дала остаткам реакционеров шанс устроить больше неприятностей"
  PRC_reactionary_peasants_agitation:0 "Агитация реакционных крестьян"
  PRC_reactionary_peasants_agitation_desc:0 "Наша политика коллективного земледелия дала остаткам реакционеров шанс устроить больше неприятностей"
  PRC_establish_remote_research_facilities:0 "[From.GetName]"
  PRC_establish_remote_research_facilities_desc:0 "Создать удаленные научно-исследовательские учреждения в [From.GetName]"
  PRC_westward_wargoals:0 "Подготовиться к наступлению на [From.GetName]"
