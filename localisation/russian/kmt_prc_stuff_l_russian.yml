  PRC_long_march_debuff:0 "Великий поход\n§g------------------------------------------------------§!\n§gРазорительный Великий поход, или «Полет на Запад», как его именует наш враг в Гоминьдане, бесспорно, оставил партию и Красную Армию в состоянии смятения. После многочисленных жертв и некоего предательства по пути партия наконец обосновалась в Фуцзяне, но наши потери во время Великого похода слишком велики, чтобы мы могли легко оправиться без активных действий.§!\n"
  PRC_lower_long_march_lvl_by1_tt:0 "§GSнижение штрафа за §RВеликий поход§!:§!\n  Организованность дивизии: §G+5,0%§!\n  Рекрутируемое население: §G+9,50%§!\n  Коэффициент рекрутируемого населения: §G+1,5%§!\n  Стабильность: §G+5,00%§!\n  Военная поддержка: §G+2,00%§!\n  Наступление дивизии: §G+5,0%§!\n  Защита дивизии: §G+5,0%§!\n  Время обучения: §G-10,00%§!\n  Скорость подкрепления: §G+2,2%§!\n  Скорость планирования: §G+2,5%§!\n"
  PRC_remove_long_march_debuff_tt:0 "§GUдаление модификатора §RВеликий поход§!§!\n"
