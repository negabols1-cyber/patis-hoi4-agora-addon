  PRC_start_militia_program:0 "Начать программу формирования ополчения"
  PRC_militia_program_on_tt:0 "§GПозволяет нанимать подразделения ополчения в присоединенных штатах после каждой активации§!"
  PRC_end_militia_program:0 "Закончить программу формирования ополчения"
