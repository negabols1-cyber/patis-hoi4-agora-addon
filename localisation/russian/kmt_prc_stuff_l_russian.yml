  PRC_cost_25_cp_tooltip:0 "За выбор этого варианта будет потрачено £command_power §H25§! и £pol_power §H25§!"
  PRC_emergency_recruitment_core:0 "Чрезвычайный набор в [From.GetName]"
  PRC_emergency_warplan:0 "Чрезвычайный военный план против [From.GetName]"
  PRC_forced_march:0 "Форсированный марш"
  PRC_when_above_idea_expires:0 "§CКогда истечёт срок действия идеи из вышеперечисленных и обе нации продолжат существовать, будут независимыми, коммунистическими и не будут находиться в состоянии войны друг с другом или с любым участником своей фракции:§!"
  PRC_autonomy_atleast_3:0 "Уровень автономии находится на уровне §HPoweful Influence§! или ниже"
  PRC_autonomy_atmost_3:0 "Уровень автономии находится на уровне §HPoweful Influence§! или выше"
  PRC_autonomy_atleast_1:0 "Уровень автономии находится на уровне §HLittle Influence§! или ниже"
  PRC_autonomy_atleast_4:0 "Уровень автономии находится на уровне §HTight Grip§! или ниже"
  PRC_autonomy_atleast_5:0 "Уровень автономии находится на уровне §HNigh-total Control§! или выше"
