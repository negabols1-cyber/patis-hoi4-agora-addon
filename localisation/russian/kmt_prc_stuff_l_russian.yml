l_russian:
  PRC_defeatism_1:0 "Дефетизм"
  PRC_defeatism_1_desc:0 "Некоторые из наших товарищей считают, что если мы будем бороться с японцами, мы станем следующей Абиссинией. Такие мысли сильно ослабляют волю нашего народа."
  PRC_defeatism_2:0 "Дефетизм"
  PRC_defeatism_2_desc:0 "Некоторые из наших товарищей считают, что если мы будем бороться с японцами, мы станем следующей Абиссинией. Такие мысли сильно ослабляют волю нашего народа."
  PRC_underestimation:0 "Недооценка Японии"
  PRC_underestimation_desc:0 "Некоторые из наших товарищей слишком оптимистично оценивают японцев. Они даже утверждают, что те никогда не доберутся до Шаньси. Такая самоуверенность серьезно повлияет на наши военные усилия."
  PRC_integrated_army:0 "Интегрированная армия"
  PRC_integrated_army_desc:0 "Коммунистическая Красная армия согласилась быть включенной в нашу армию, с этой небольшой дополнительной поддержкой война может стать менее трудной."
  PRC_initiative_idea:0 "Инициатива во время войны"
  PRC_initiative_idea_desc:0 "Обезвреживание солдата - результат того, что он теряет свободу действий из-за вынужденного перехода в пассивное положение. То же самое и с поражением армии. По этой причине обе стороны в войне делают все возможное, чтобы получить инициативу и избежать пассивности."
  PRC_protracted_war_idea_gp:0 "Затяжная война"
  PRC_protracted_war_idea_nb:0 "Затяжная война"
  PRC_protracted_war_idea_all:0 "Затяжная война"
  PRC_protracted_war_idea_gp_desc:0 "Мы должны как можно дольше сдерживать японцев. Выиграть время для международной помощи."
  PRC_protracted_war_idea_nb_desc:0 "Мы должны как можно дольше задерживать японцев. Выиграть время для получения международной помощи."
  PRC_protracted_war_idea_all_desc:0 "Мы должны как можно дольше задерживать японцев. Выиграть время для получения международной помощи."
  PRC_swift_victory_idea_ng:0 "Доктрина скорой победы"
  PRC_swift_victory_idea_mp:0 "Доктрина скорой победы"
  PRC_swift_victory_idea_all:0 "Доктрина скорой победы"
  PRC_swift_victory_idea_ng_desc:0 "Если мы хотим выиграть войну против японских захватчиков, мы должны действовать быстро и ударить раньше, чем они узнают об этом."
  PRC_swift_victory_idea_mp_desc:0 "Если мы хотим выиграть войну против японских захватчиков, мы должны действовать быстро и ударить раньше, чем они узнают об этом."
  PRC_swift_victory_idea_all_desc:0 "Если мы хотим выиграть войну против японских захватчиков, мы должны действовать быстро и ударить раньше, чем они узнают об этом."
