  #################### 
  ### BLACK SUNDAY ### 
  #################### 
 liberia.1.t: "Кризис Черного воскресенья"
 liberia.1.d: "Обычно у нас было соглашение с профсоюзами, которые мы будем работать 6 дней в неделю, а не 7. По крайней мере, в воскресенье люди будут иметь время, чтобы помолиться Богу. Но когда нам пришлось вернуть его из -за трудных обстоятельств, люди начали злиться. Это в конечном итоге привело к инциденту, который сделал заголовки как черное воскресенье. Манде попросил перерыв, потому что пришло время молиться, но когда его начальник отказался, он напал на него, и солдаты вмешались и начали его бить. Инцидент обострился, когда вмешались другие сотрудники. Есть сообщения о том, как по всей стране разрываются удары."
 liberia.1.a: "Работа в дополнительный день не должна быть такой тяжелой!"
  #################### 
  ### Sierra Leone ### 
  #################### 
 liberia.2.t: "Сьерра -Леоне спрос"
 liberia.2.d: "Либерия хотела объединиться с Сьерра -Леоне с 1800 -х годов. Они также были поддержаны Соединенными Штатами. Было несколько попыток. Это один из них, они телеграфировали нас и попросили нас уйти из Сьерра -Леоне."
 liberia.2.a: "ХОРОШО"
 liberia.2.b: "НЕТ"
  #################### 
  ### FUCK BARCLAY ### 
  #################### 
 liberia.3.t: "Скандалы продолжаются"
 liberia.3.d: "В стране, основанной на основе свободы, неприемлемо, что администрация Барклай тайно увековечивает рабство. Когда он пришел к власти, он сказал, что не будет похож на предыдущего президента Чарльза Д.Б. Кинга, но вот мы здесь."
 liberia.3.a: "Яблоко не падает далеко от дерева"
  ###################### 
  ### LOCAL LANGUAGE ### 
  ###################### 
  #STAGE:1 
 liberia.4.t: "Этап 1: язык коломвы"
 liberia.4.d: "Колоква развивался из западноафриканского пиджина -английского языка, на котором говорится вдоль западноафриканского побережья; На него значительно повлияли либерийский поселенец английский. Значительно под влиянием либерийского поселенца английского языка, доставленного в Либерию афро-американскими иммигрантами в девятнадцатом веке и сегодня говорят потомки иммигрантов"
 liberia.4.a: "Этот язык неразделимый от наших людей"
 liberia.4.b: "Этот испорченный язык недопустим"
  #STAGE:2 
 liberia.5.t: "Стадия 2: язык бассы Кру"
 liberia.5.d: "Басса - это язык KRU, на котором говорят бассовый народ в Либерии, Кот -Кости, Сьерра -Леоне и Либерии. Это ценный язык, хотя и не очень ценный среди людей."
 liberia.5.a: "Этот язык неразделимый от наших людей"
 liberia.5.b: "Мы не должны признавать язык, на котором говорят несколько племен?"
  #STAGE:3 
 liberia.6.t: "Этап 2: Язык Манде"
 liberia.6.d: "Язык Манде - это группа языков, на которых говорят народы Манде. Язык показывает несколько лексических сходств с семьей в Атлантике - Конго Я."
 liberia.6.a: "Этот язык неразделимый от наших людей"
 liberia.6.b: "Вместо этого говорить по -английски?"
  ######################### 
  ### NATIONAL LANGUAGE ### 
  ######################### 
 liberia.7.t: "Национальная языковая программа"
 liberia.7.d: "Либерия - многоязычная страна с более чем 20 языками коренных народов. Английский - это официальный язык, но эта эпоха должна подойти к концу. Нам нужно объединиться под одним языком, чтобы люди могли жить в единстве и в соответствии с западной культурой. Комитет был созван для этого. Они были уверены, что это будет английский, но они пытались решить, будет ли это либерийский английский, который был диалектом, который появлялся в Либерии или на коренном английском."
 liberia.7.a: "Либерийский английский - единственный способ"
 liberia.7.b: "Мы должны выучить правильный английский"
  ###################### 
  ### PARADE CAPITAL ### 
  ###################### 
 liberia.8.t: "Парад в столице"
 liberia.8.d: "В столице, в Монровии, мы готовились провести парад, который будет услышан по всей стране о скандалах Barclay и о сделках, которые мы заключили с племенами. Племена все еще, казалось, слегка злились на Тубмана. Когда он думал обо всем этом, он вышел из своей машины и ..."
 liberia.8.a: "Тубман был застрелен"
 liberia.8.b: "Тубман вышел на сцену"
  ##################### 
  ### PEARL MILLING ### 
  ##################### 
 liberia.9.t: "Жемчужное фрезерование"
 liberia.9.d: "Либерийское побережье полон жемчуга. Мы решили, что сможем их использовать."
 liberia.9.a: "Мы должны посвятить наши ресурсы жемчужине"
 liberia.9.b: "Больше смысла выбрать медленный план"
  ####################### 
  ### DO U WANT PEARL ### 
  ####################### 
 liberia.10.t: "[FROM.GetNameDefCap] может помочь нам обменять жемчуг"
 liberia.10.d: "В связи с тем, что напряженность между странами растут по всему миру, торговля стала сложнее, и если мы окажемся на войне, варианты покупки и продажи жемчужины станут еще более ограниченными. Если мы им достаточно доверяем, нейтралитет [FROM.GetName] может стать для нас возможностью свободно торговать, принести пользу нашей экономике и, в конечном итоге, наша военная машина."
 liberia.10.a: "Звуковая идея"
 liberia.10.b: "Мы не можем знать, где они на самом деле стоят"
  ##################### 
  ### RAID SETTLERS ### 
  ##################### 
 liberia.11.t: "Поселенцы рейдов"
 liberia.11.d: "Почему наши люди должны голодать, в то время как богатые американские поселенцы покупают дешевую землю в нашей стране и живут как короли? Набег на дома этих поселенцев и распределение их активов нашему народу продвинет революцию"
 liberia.11.a: "Освободить их"
 liberia.11.b: "Собирайте товары и раздайте их людям"
  ########################### 
  ### MOVE THE CLOCK BACK ### 
  ########################### 
 liberia.12.t: "Спрос на минимальную заработную плату"
 liberia.12.d: "Несмотря на то, что минимальная заработная плата резко упала с момента Великой депрессии, компания Firestone Natural Rubfrup отправила телеграмму государственным экономистам. Кризис Конго также присутствовал в Либерии. Малайя доминировала в производстве резины благодаря чрезвычайно дешевой рабочей силе. Чтобы вернуть его в путь, он предлагал снизить минимальную заработную плату."
 liberia.12.a: "Принять спрос"
 liberia.12.b: "Это неприемлемо"
  ############################ 
  ### LOOK DAD! NEWSPAPERS ### 
  ############################ 
 liberia.13.t: "Послушай, папа! Вы в заголовке!"
 liberia.13.d: "Барклай едва встал с постели после долгой ночи. Обеденный стол был готов. Когда он сел и начал есть, его сын начал пролистать газеты, потому что он так быстро закончил еду.  В этот момент его сын начал кричать. Папа! Вы находитесь в заголовке! \ Nbarclay немедленно подобрал газету. \ N''''d''s, когда Эдвин Барклай когда -нибудь сделал что -то правильно для нашей страны, например, улучшить нашу экономику или добиться чего -либо еще хорошего? Если бы наши люди знали о скандалах, в которых он был вовлечен, они бы никогда не избрали его »."
 liberia.13.a: "О, нет!"
  ###################### 
  ### WORKER UNRESTS ### 
  ###################### 
 liberia.14.t: "Протесты растут"
 liberia.14.d: "С падением минимальной заработной платы, протесты начали расти, за исключением обычных. Забастоты, поджоги, атаки на поселенцев ..."
 liberia.14.a: "Мы не можем больше этого принимать!"
  ####################### 
  ### ACCEPTES SIERRA ### 
  ####################### 
 liberia.15.t: "[FROM.GetNameDefCap] принял наши требования"
 liberia.15.d: "[FROM.GetNameDefCap] контролировал Сьерра -Леоне в течение некоторого времени. Обычно США предложили в 1800 -х годах, что они должны быть объединены с Либерией, но нам пришлось ждать до сих пор. Но теперь мы тоже освободили людей здесь."
 liberia.15.a: "Сьерра -Леоне освобожден!"
  ###################### 
  ### REJECTS SIERRA ### 
  ###################### 
 liberia.16.t: "[FROM.GetNameDefCap] отказывается от наших требований"
 liberia.16.d: "[FROM.GetNameDefCap] контролировал Сьерра -Леоне в течение некоторого времени. Обычно США предложили в 1800 -х годах, что он должен сливаться с Либерией, но нам пришлось ждать до сих пор. Мы представили наше предложение [FROM.GetNameDefCap], чтобы слияние с Сьерра -Леоне, но они отказались."
 liberia.16.a: "Если не на этот раз, то в другой раз!"
  ################### 
  ### COUP D'ETAT ### 
  ################### 
 liberia.17.t: "Масоны попробовали переворот!"
 liberia.17.d: "Великая Ложа Республики Либерия является очень важной организацией в Либерии, большинство политиков являются членами этой ложи, поэтому политика находится в их руках. Чарльз Д.Б. Кинг, которому не заботились об этом, позволил им расти. Это стало больше и больше, и они попытались переворот. В результате переворота, который начался в 12 часов утра, вооруженные силы заявили, что король DB был удален с должности и что солдаты вступит во владение, чтобы сохранить американскую культуру, которая была разрушена. Когда солдаты прошли по особняку Короля Д.Б., верные войска из верхнего эшелона военных достигли Короля ДБ и помогли ему сбежать. Затем было отправлено в каждом округе, чтобы заставить людей подняться, генералы переворота приказали пехоте стрелять в людей, но пехота, думая, что они были на тренировке, поняли, что это была тренировка и разоружена. Таким образом, переворот был предотвращен. В 15:00 Чарльз Д.Б. Кинг произнес речь."
 liberia.17.a: "Объявить чрезвычайное положение!"
  ###################### 
  ### PEARL ACCEPTED ### 
  ###################### 
 liberia.18.t: "[FROM.GetNameDefCap] принял наши жемчужины"
 liberia.18.d: "Это означает, что они будут торговать только жемчугом с нами и смогут свободно покупать и продавать жемчужина, не беспокоясь об эмбарго. Они не единственные, кто принесет пользу; Приток денег поможет нашей борющейся экономике и может даже использоваться в качестве переговоров в будущем."
 liberia.18.a: "Это будет полезно"
  ###################### 
  ### PEARL REJECTED ### 
  ###################### 
 liberia.19.t: "[FROM.GetNameDefCap] отказывается от нашего жемчуга"
 liberia.19.d: "Несмотря на очевидную взаимную пользу, [FROM.GetName] не интересуется нашими высококачественными жемчужинами. Возможно, мы сможем предложить это снова в будущем."
 liberia.19.a: "Ну что ж"
  ####################### 
  ### DOLARISATION US ### 
  ####################### 
 liberia.20.t: "Либерия ускоренная программа доллара."
 liberia.20.d: "Либерия, которую мы помогли много лет назад, объявила, что официально начнет использование доллара США после длительного периода неофициального использования доллара США."
 liberia.20.a: "Слава День Америки!"
 #^W^END^W^# 
