 USA_cash_and_carry:0 "Программа ленд-лиза"
 USA_cash_and_carry_desc:0 "Поправка к закону о нейтралитете, разрешающая 'За наличные на вынос', позволяет странам закупать у нас немуниционные материалы при условии предоплаты и организации самостоятельной доставки. Конгресс предполагает, что из-за нехватки стартового капитала никакое государство не станет этим пользоваться. Мы же можем обойти эту поправку и снабжать наших союзников материальными ресурсами, позволив странам 'одолжить' деньги из нашей казны, которые они затем смогут использовать для оплаты товаров."
 USA_embargo_germany:0 "Эмбарго на Германию"
 USA_foundation_of_NATO:0 "Основание НАТО"
 USA_foundation_of_NATO_desc:0 "Мир стремительно меняется вокруг нас: многие из бывших великих держав лежат в руинах после опустошительной войны, пронесшейся по континентам. [USA.getNameDefCap] удалось не только сохранить, но и укрепить свой статус мировой сверхдержавы. Пришло время взять ситуацию под непосредственный контроль."
 usa_nato.1.t:0 "[alliance_inviter.GetFactionName] и [alliance_applicant.GetAdjective] объединяются в единый альянс!"
 usa_nato.1.d:0 "\n\nМировая политика быстро меняется, и поэтому лидеры [alliance_inviter.GetFactionName] и [alliance_applicant.GetLeader] признали, что бесполезно существовать как отдельные коалиции. Вместо этого они решили сражаться бок о бок.\n\nЭто, вероятно, встревожит зарубежные канцелярии, поскольку их объединенная сила может стать гораздо более угрожающей."
 usa_nato.1.a:0 "Мы сильнее вместе."
 usa_nato.1.b:0 "Они ищут силу в количестве."
 usa_nato.1.c:0 "Это им не поможет!"
 usa_nato.1.e:0 "Война обостряется..."
 usa_nato.1.f:0 "Наш альянс крепнет." 
 USA_cash_and_carry_home:0 "Программа "Плати и забирай""
