 purge_2_group_a:0 "Подверглись чистке Сталина"
 purge_2_group_b:0 "Подверглись чистке Сталина"
 counter_purge:0 "Подверглись чистке Троцкого"
 SOV_war_since_purge:0 "Вел войну с момента завершения Великой чистки"
 FRA_metropolitan_france:2 "Инвестировать в метрополию Франции"
 FRA_metropolitan_france_tt:0 "В столице недостаточно мест для строительства §YИнфраструктуры§!"
 FRA_metropolitan_france_desc:0 "Метрополия должна всегда быть в приоритете. Мы можем начать с улучшения нашей инфраструктуры, чтобы создать рабочие места и ускорить развертывание войск."
 FRA_algerie_france:2 "Инвестировать в Алжирскую Францию"
 FRA_algerie_france_tt:0 "Недостаточно мест для строительства §YИнфраструктуры§! в Колониальной Франции"
 FRA_algerie_france_desc:0 "Европа переживает опасные времена. Нам следует сосредоточиться на развитии наших земель на юге и обеспечить постоянную поддержку материка."
 FRA_industrial_expansion:0 "Промышленная экспансия"
 FRA_industrial_expansion_tt:0 "В метрополии недостаточно места для размещения §YГражданских заводов§!"
 FRA_industrial_expansion_desc:0 "Нам нужно более сильное промышленное присутствие в стране. У нас достаточно рабочей силы, но нам нужны дополнительные производственные мощности."
 FRA_colonial_industry:0 "Колониальная промышленность"
 FRA_colonial_industry_tt:0 "В колониальной Франции не хватает слотов для строительства §YГражданских заводов§!"
 FRA_colonial_industry_desc:1 "Мы должны сосредоточиться на наших колониальных производствах. В случае обострения напряженности в Европе у нас по-прежнему останутся промышленные мощности вне досягаемости вражеских бомбардировщиков."
 FRA_military_factories:0 "Военные заводы"
 FRA_military_factories_tt:0 "Недостаточно мест под строительство для §YMilitary Factory§! в метрополии"
 FRA_military_factories_desc:1 "Производительность нашей военной машины отстаёт. Нужно уделять больше внимания производству военной техники внутри страны, чтобы войска получали постоянные поставки нового оборудования."
 FRA_colonial_military_factories:0 "Колониальные военные заводы"
 FRA_colonial_military_factories_tt:0 "Недостаточно мест под строительство для §YMilitary Factory§! в колониальной Франции"
 FRA_colonial_military_factories_desc:0 "Размещая военное производство за пределами Европы, мы гарантируем, что даже если противник получит контроль над воздушным пространством, наши передовые войска будут постоянно получать технику."
 FRA_extra_research_slot:2 "Поддержка лучших школ"
 FRA_extra_research_slot_desc:0 "Перспективные молодые умы появляются везде. Нужно дать им возможность проводить исследования. Достижения в области технологий могут обеспечить преимущество там, где оно больше всего нужно."
 FRA_nuclear_effort:0 "Разработка ядерного оружия"
 FRA_nuclear_effort_desc:0 "Первые испытания в области ядерной науки показали обнадеживающие результаты. Овладение ядерной энергией может дать нам оружие, не имеющее аналогов в истории человечества."
 FRA_jet_effort:0 "Разработка реактивных самолётов"
 FRA_jet_effort_desc:0 "В воздушном бою всё решает маневренность. Реактивный двигатель — настолько серьёзный шаг вперёд, что вражеские пилоты будут словно стоять на месте, когда мы будем сбивать их с небес.
 FRA_extra_research_slot_2:2 "Сформировать Национальный исследовательский центр"
 FRA_extra_research_slot_2_desc:0 "Талантливая молодёжь появляется повсеместно. Им необходимо обеспечить условия для проведения исследований. Научно-технический прогресс даст нам преимущество там, где оно особенно необходимо."
 FRA_defensive_focus:0 "Защитный фокус"
 FRA_defensive_focus_desc:0 "В такие времена лучше всего укреплять нашу оборону. Если есть угрозы, пусть они идут к нам, чтобы мы могли с ними справиться на нашей земле. У нас есть идеальный кандидат, который поведёт нашу армию, мы ждём только вашего слова."
 FRA_aggressive_focus:0 "Наступательный фокус"
 FRA_aggressive_focus_desc:0 "Мы не можем сидеть сложа руки, пока враги приближаются к нашим границам. И мы не можем оставить наших союзников без защиты в случае войны. Готовим нашу армию! Гамелен идеально подходит для этой работы."
 FRA_fortification_focus:0 "Фокус на укреплениях"
 FRA_fortification_focus_desc:0 "Насколько важны наши форты, но мы должны найти способы строить их более эффективно. Линия Мажино является мощным сдерживающим фактором для вражеских войск, нам нужна такая же надёжность и для других рубежей обороны."
 FRA_alpine_forts:0 "Форты в Альпах"
 FRA_alpine_forts_desc:0 "Итальянцы не пересекут границу так легко, когда мы закончим строительство новой линии обороны в Альпах. У нас будет время для реагирования и укрепления наших позиций."
 FRA_extend_the_maginot_line:0 "Продлить Линию Мажино"
 FRA_extend_the_maginot_line_desc:0 "Мы не можем рассчитывать на то, что Бельгия устоит. Если они пропустят вражеские армии, мы окажемся в беде. Расширение линии Мажино имеет решающее значение для того, чтобы не допустить нежелательных армий во Францию!"
 FRA_infantry_focus:0 "Призыв в армию"
 FRA_infantry_focus_desc:0 "Все мужчины и женщины, способные сражаться, будут это делать. Массовое производство оружия позволит снизить затраты. Мы дадим каждому в руки винтовку."
 FRA_artillery_focus:0 "Гранд Баттери"
 FRA_artillery_focus_desc:0 "Наша артиллерия сформирует единое мощное подразделение для сосредоточения огня в определенных точках. Одна залпа за раз, и мы ослабим линию врага и прорвемся, если придется!"
 FRA_heavy_armor_focus:0 "Бронированный Танк"
 FRA_heavy_armor_focus_desc:0 "Боевые танки - это путь вперед для французской армии. Мы хотим контролировать поле боя, и для этого нам понадобятся новые мощные танки!"
 FRA_motorized_focus:0 "Моторизованный отряд"
 FRA_motorized_focus_desc:0 "Нахождение лучших способов построить наши пехотные машины поможет нам поддерживать и укреплять фронт."
 FRA_mechanized_focus:0 "Механизированный отряд"
 FRA_mechanized_focus_desc:0 "Бронированные машины играют все более важную роль в войне. Хотя они немного менее устрашающие, чем средний танк, они дают нам преимущество в связи, командовании, транспортировке и городском бою."
 FRA_light_medium_armor:0 "Бронеавтомобиль"
 FRA_light_medium_armor_desc:0 "Согласно закону, вся бронетехника находится в ведении пехоты. Более лёгкие, скоростные кавалерийские «машины» или бронеавтомобили лучше подходят для передвижения и все ещё могут нанести определённый урон своим установленным вооружением."
 FRA_army_reform:0 "Реформа армии"
 FRA_army_reform_desc:0 "Ни пехотное подразделение, ни высокотехнологичный танк в одиночку не позволят нам выиграть войну. Мы должны прилагать усилия для развития как наших тактических, так и стратегических возможностей. С правильными людьми на должностях мы можем развиваться как армия."
 FRA_navy_focus:0 "Флот"
 FRA_navy_focus_tt:0 "Недостаточно слотов под строительство §YВоенно-морской базы§!"
 FRA_navy_focus_desc:0 "Если мы планируем расширять наш флот, первым шагом должно стать улучшение и расширение наших военно-морских баз. Наши уникальные корабли требуют постоянного внимания для поддержания постоянной боеготовности."
 FRA_improved_screen_ships:0 "Улучшенные корабли прикрытия"
 FRA_improved_screen_ships_desc:0 "Эсминцы и лёгкие крейсеры играют ключевую роль в защите наших тяжёлых линкоров или авианосцев. Если мы потеряем нашу линию обороны на море, то рискуем потерять все корабли и людей. Мы должны убедиться, что наши корабли строятся с использованием самых современных технологий."
 FRA_capital_ship_focus:0 "Главные корабли"
 FRA_capital_ship_focus_desc:0 "Улучшение конструкции наших линкоров привело бы к большим тактическим преимуществам. Никто не сможет ускользнуть от их орудий благодаря их неоспоримой дальности и мощности."
 FRA_carrier_focus:0 "Авианосцы"
 FRA_carrier_focus_desc:0 "Военно-морские теоретики обратили наше внимание на наши устаревшие авианосцы. У них есть предложения о том, как можно в дальнейшем использовать авианосцы, если развитие направить в нужном направлении. Без нашей полной поддержки реального прогресса не достичь."
 FRA_initiate_government_reform:0 "Реформа правительства"
 FRA_initiate_government_reform_desc:0 "Мир стал опасен. Мы больше не можем быть связаны нашими собственными мелкими распрями. Пришло время расширить возможности наших политиков и двигаться вперед во имя Франции."
 FRA_support_the_left:0 "Поддержка левых"
 FRA_support_the_left_desc:0 "Коминтерн становится сильнее. Пришло время показать, что наши интересы могут быть согласованы и поддержать наши коммунистические организации."
 FRA_leftist_rhetoric:0 "Левая риторика"
 FRA_leftist_rhetoric_desc:0 "Цель ясна. Равенство для всех. Мы не хотим капиталистических интересов во французской политике. Крайне важно, чтобы мы создали оптимальные условия для процветания наших коммунистических организаций."
 FRA_scw_intervention_republicans:0 "Вмешательство республиканцев"
 FRA_scw_intervention_republicans_desc:0 "Республиканской Испании нужна наша помощь!\nЛюбой, кто готов сражаться за это дело, должен быть допущен. Мы не можем допустить, чтобы еще один фашистский режим набрал силу."
 FRA_national_mobilization:0 "Национальная мобилизация"
 FRA_national_mobilization_desc:0 "Наконец-то у нас есть правительство, способное действовать. Теперь пришло время укрепить нашу армию и быть готовыми сражаться за Францию."
 FRA_humanite_unie:0 "Единство человечества"
 FRA_humanite_unie_desc:0 "Жирные банкиры и жадные до власти демагоги укрепляют свою кровавую хватку на мире. С каждым днём мы видим, как свободные люди становятся рабами, а мир погружается в кризис, созданный жадностью отдельных лиц. Идеалы Франции нужны больше, чем когда-либо! Человечеству нужны мы, и нам нужно объединить человечество!"
 FRA_join_comintern:0 "Присоединиться к Коминтерну"
 FRA_join_comintern_desc:0 "С врагами повсюду, куда бы мы ни повернулись, нам нужно укрепить наши позиции мощными союзниками. Наши связи с Коминтерном стали прочнее, и пришло время полностью посвятить себя их делу."
 FRA_support_status_quo:0 "Поддерживать статус-кво"
 FRA_support_status_quo_desc:0 "Франция является колыбелью и защитницей свободы и должна ею оставаться. Если мы хотим снова добиться единства, то мы должны стабилизировать нашу демократию, прежде чем она разрушится."
 FRA_little_entente:0 "Малая Антанта"
 FRA_little_entente_desc:0 "Малая Антанта, союз, образованный после Первой мировой войны, чтобы предотвратить агрессию со стороны Австрии и Венгрии по отношению к своим соседям, поддерживалась Францией, но сейчас начала разваливаться. Вместо того, чтобы налаживать связи с Великобританией, мы должны взять на себя инициативу по восстановлению и консолидации этой фракции, начав с её основателей в Чехословакии."
 FRA_go_with_britain:0 "Идти с Великобританией"
 FRA_go_with_britain_desc:0 "Россия навсегда изменилась, и только Франция и Великобритания остались от прежнего Тройственного соглашения. Если история обречена на повторение, мы должны гарантировать, что эти две нации, оплоты демократии и свободы в Европе, останутся союзниками."
 FRA_strengthen_government_support:0 "Укрепить поддержку правительства"
 FRA_strengthen_government_support_desc:0 "Мы составили планы на следующий год, которые будут соответствовать желаниям людей во всех уголках Франции. Покажите им, что мы способны действовать и достойны править Францией, чтобы мы снова могли стоять едиными."
 FRA_defensive_strategems:0 "Оборонные стратегии"
 FRA_defensive_strategems_desc:0 "Если мы хотим, чтобы народ Франции сражался за нас, важнее, чем когда-либо, иметь четкое направление. Мы должны прекратить драться друг с другом и начать сражаться за Францию и за „Свободу, равенство, братство“."
 FRA_invite_yugoslavia:0 "Пригласить Югославию"
 FRA_invite_yugoslavia_desc:0 "У Югославии достаточно проблем, помимо экспансионистских соседей. Возвращение их в Малую Антанту будет большой услугой как им, так и нам."
 FRA_invite_romania:0 "Пригласить Румынию"
 FRA_invite_romania_desc:0 "Румынская демократия хрупка, зажатая между своими внутренними фашистскими фракциями и советским коммунизмом. Привлечение их в Малую Антанту позволит им сохранить стабильность при нашей поддержке."
 FRA_polish_guarantee:0 "Польская гарантия"
 FRA_polish_guarantee_desc:0 "Польские дипломаты выразили обеспокоенность по поводу напряженности на границах. Гарантия нашей могущественной нации должна сдержать любого, кто планирует вторжение."
 FRA_czech_guarantee:0 "Гарантия Чехословакии"
 FRA_czech_guarantee_desc:0 "Напряжение нарастает на границе с Чехословакией. Мы не можем позволить экспансивным нациям захватить свободную и демократическую нацию. Чехи должны оставаться свободными людьми. С нашей гарантией любой, кто планирует вторжение, дважды подумает."
 FRA_revise_versailles:0 "Пересмотреть Версаль"
 FRA_revise_versailles_desc:0 "Немцы уже игнорируют репарации, предусмотренные Версальским договором, показывая, что Франция больше не вызывает уважения. Если на то пошло, у нас есть право требовать большего за жизни, потерянные в Великой войне, но справедливый договор потребует сильной Франции, новой Франции, чтобы обеспечить его соблюдение."
 FRA_support_the_right:0 "Поддержать правых"
 FRA_support_the_right_desc:0 "Франция всегда была сильной и гордой нацией, но отсутствие правительственных действий разъединило народ. Мы должны объединить Францию и заявить о своем превосходстве и силе, чтобы не поддаться упадку."
 FRA_right_wing_rhetoric:0 "Правая риторика"
 FRA_right_wing_rhetoric_desc:0 "Мы должны сосредоточиться на том, чтобы достучаться до каждого француза и поднять его национальный дух. Покажите им, что мы можем быть теми сильными лидерами, в которых они нуждаются, и они станут гордыми гражданами нашей славной нации."
 FRA_scw_intervention_nationalists:0 "Националистическое вмешательство"
 FRA_scw_intervention_nationalists_desc:0 "Националисты, наконец, набирают силу в Испании. Их дело правое, и всякому, кто готов бороться за них, должно быть позволено это сделать."
 FRA_army_of_aggression:0 "Армия агрессии"
 FRA_army_of_aggression_desc:0 "Мы больше не можем сидеть за устаревшей стеной, в то время как наши враги бесчинствуют по всей Европе. Пришло время укрепить нашу армию и расширить наши границы, чтобы Франция и впредь оставалась великой нацией."
 FRA_france_first:0 "Франция превыше всего"
 FRA_france_first_desc:0 "Мы - Франция! Победители Великой войны! Спасители Европы! Мы - родина величайших мыслителей, которых видел мир. Слишком много наций стремятся ввергнуть мир в хаос. Мы нужны, и мы прислушаемся к зову. Мы возьмем штурвал, переждем бурю и направим человечество к спасению под нашим руководством!"
 FRA_woo_italy:0 "Заманить Италию"
 FRA_woo_italy_desc:0 "Италия имеет потенциал стать могущественной нацией. Благодаря сильному руководству Муссолини народ Италии един и готов бороться за правое дело. Пусть этим делом станет наше."
 FRA_dismantle_the_democracies:0 "Уничтожить демократии"
 FRA_dismantle_the_democracies_desc:0 "Новый $GER.GetAdjective$ демократический союз в Центральной Европе угрожает нашему новообретенному положению. Мы должны принять меры сейчас, пока они не стали еще могущественнее."
 FRA_join_germany:0 "Присоединиться к Германии"
 FRA_join_germany_desc:0 "Германский Рейх становится силой, с которой необходимо считаться. Их видение лучшего будущего может быть совмещено с нашими интересами. Мы должны поддержать их, и как только пыль осядет, Франция получит свой законный кусок Европы."
 FRA_naval_doctrine:0 "Морская доктрина"
 FRA_naval_doctrine_desc:0 "Недавний прогресс в разработке кораблей открыл новые возможности в тактических и стратегических маневрах. Прежде чем испытывать эти новые теории на практике, нам нужно их должным образом проверить и закрепить в планах."
 FRA_air_focus:0 "Воздушный фокус"
 air_focus_bypass_tt:0 "Недостаточно слотов для постройки для §YАвиабазы§!"
 FRA_air_focus_desc:0 "Пришло время расширить наши военно-воздушные силы! Планы по строительству новых авиабаз уже разработаны, чтобы поддерживать значительное увеличение как личного состава, так и авиатехники."
 FRA_cas_focus:0 "Штурмовой фокус"
 FRA_cas_focus_desc:0 "Самолеты, которые обеспечивают поддержку нашим сухопутным войскам и кораблям, стали очень эффективным дополнением при относительно небольших вложениях. Эти самолеты имеют ряд предполагаемых улучшений. Наши инженеры могут разработать следующее поколение самолетов поддержки."
 FRA_fighter_focus:0 "Истребительный фокус"
 FRA_fighter_focus_desc:0 "Некоторые революционные гражданские технологии могут быть применены к нашим истребителям для улучшения их скорости, дальности полета и максимальной высоты. Нам необходимо сосредоточиться на этом, если мы хотим идти в ногу с прогрессом, достигнутым другими."
 FRA_bomber_focus:0 "Бомбардировочный фокус"
 FRA_bomber_focus_desc:0 "Авиационная поддержка играет важную роль как в нашей обороне, так и в атаке. Если мы сосредоточим усилия на разработке быстрых, более маневренных и точных бомбардировщиков, мы получим преимущество в любом сухопутном сражении."
 FRA_heavy_fighter_focus:0 "Разработка тяжелых истребителей"
 FRA_heavy_fighter_focus_desc:0 "Наши тяжелые истребители должны иметь возможность поддержки более уязвимых бомбардировщиков. Для этого требуется более тяжелое вооружение и большая дальность полета, но при этом снижается скорость."
 FRA_air_doctrine:0 "Авиационная доктрина"
 FRA_air_doctrine_desc:0 "Мы приобрели достаточно опыта, чтобы быстрее тестировать новые теории в воздушной войне. Это позволит нам исследовать новые тактические и стратегические возможности. Воздушный бой является ключом к современной войне."
 FRA_heavy_bomber_focus:0 "Разработка тяжелых бомбардировщиков"
 FRA_heavy_bomber_focus_desc:0 "Современные тяжелые бомбардировщики будут вооружены, чтобы самостоятельно вести небольшие воздушные стычки. Если мы позволим нашим инженерам сосредоточиться на разработке новейших технологий, у нас будет больше шансов уничтожить вражеские производственные мощности."
 FRA_naval_bomber_focus:0 "Разработка палубных бомбардировщиков"
 FRA_naval_bomber_focus_desc:0 "Корабли оказались чрезвычайно уязвимыми к авиации. Мы должны продолжать совершенствовать их технологии, чтобы гарантировать, что мы будем впереди любых контрмер."
 limited_rearmament_focus:0 "Ограниченное перевооружение"
 limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "Недавняя активность Германии и других фашистских сил по всему миру позволяет предположить, что нам не удастся наслаждаться миром в наши дни. В качестве подготовки мы должны привести в движение детали для нашего собственного перевооружения, если ситуация еще больше ухудшится."
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "Наш новый подход к внутренней политике и международным отношениям требует здоровой армии для его поддержки. В ходе подготовки мы должны начать расширять нашу гражданскую промышленность, чтобы она могла сформировать прочную основу для будущего расширения нашей военной промышленности в свое время."
 ENG_motorized_focus:0 "Моторизованная армия"
 ENG_motorized_focus_desc:0 "Недавно армия экспериментирует с полностью моторизованными пехотными подразделениями. Пока они не сформировали полностью моторизованные дивизии, но если правильно обратиться к министру по делам войны, это скоро станет возможным."
 ENG_armoured_spearhead_tactics:1 "[Root.GetRoyalTankRegimentName]"
 ENG_armoured_spearhead_tactics_desc:1 "[Root.GetRoyalTankRegimentDesc]"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Королевский танковый полк"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "Танковый полк республиканской гвардии"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "Британия изобрела танк, поэтому Королевский танковый полк должен быть оснащен лучшими в мире танками, но в настоящее время это не так. Комитет по разработке специального транспорта предлагает провести исследования и разработать современную конструкцию, чтобы Великобритания оставалась на переднем крае развития танков."
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "Великобритания изобрела танк, поэтому Республиканский гвардейский танковый полк должен быть оснащен лучшими в мире танками, но в настоящее время это не так. Специальный комитет по разработке транспортных средств предлагает исследовать и разработать современный дизайн, чтобы Великобритания оставалась на передовой в разработке танков."
 uk_empire_focus:0 "Укрепить империю"
 uk_empire_focus_desc:0 "Наша империя огромна и, несмотря на нашу силу, плохо защищена. Чтобы противостоять этому, нам нужно поощрять имперский патриотизм во всем королевстве."
 uk_service_focus:0 "Служба за рубежом"
 uk_service_focus_desc:0 "Ротируя персонал вооруженных сил на колониальных станциях и обратно на родину, они могут узнать об условиях на разных фронтах, набраться опыта и поделиться им со своими товарищами на родине."
 uk_mediterranean_focus:0 "Средиземноморский бастион"
 uk_mediterranean_focus_desc:0 "Путь через Средиземное море является жизненно важным коротким путем в Индию и из нее. Таким образом, крайне важно сохранить его открытым и в наших руках."
 uk_rock_focus:0 "Укрепить Рок"
 uk_rock_focus_desc:0 "Помимо контроля над входом в Средиземное море, Гибралтар обеспечивает надежно защищенную гавань, из которой корабли могут действовать как в Атлантике, так и в Средиземном море. Таким образом, императивно, чтобы он был надежно защищен."
 uk_greece_focus:0 "Убедить Грецию"
 uk_greece_focus_desc:0 "В наших интересах иметь базы в Греции, и откровенно говоря, греки не в том положении, чтобы отказать нам."
 uk_malta_focus:0 "Укрепить Мальту"
 uk_malta_focus_desc:0 "Мальта занимает отличное положение в центральном Средиземноморье, жизненно важный промежуточный пункт на нашем пути через Египет и Суэцкий канал в Индию и на Дальний Восток. Время, потраченное на его усиление, никогда не будет потрачено зря."
 ENG_mot_focus_tooltip:0 "Теперь мы можем развертывать моторизованные пехотные дивизии."
 uk_canada_focus:0 "Развитие Канады"
 uk_canada_focus_desc:0 "Инвестиции в промышленность и верфи Канады дадут толчок их экономике и позволят им внести больший вклад в случае войны."
 uk_australia_focus:0 "Развитие Австралии"
 uk_australia_focus_desc:0 "Инвестиции в верфи и промышленность Австралии дадут толчок их экономике и позволят им внести больший вклад в случае войны."
 uk_protect_suez:0 "Защитить Суэц"
 uk_protect_suez_desc:0 "Контроль Суэцкого канала - один из способов, с помощью которых Британская империя сохраняет контроль над морем. Потеря этого региона станет катастрофической. Необходимо принять меры для его укрепления."
 uk_balkan_strategy:0 "Балканская стратегия"
 uk_balkan_strategy_desc:0 "Многие из балканских стран выступают за Великобританию и видят угрозу со стороны центральной Европы так же, как и мы. Если мы воспользуемся этой возможностью и поддержим их в начале, то сможем обеспечить их лояльность, хотя это и будет стоить нам вражды их соседей-реваншистов."
 uk_new_zealand_focus:0 "Развитие Новой Зеландии"
 uk_new_zealand_focus_desc:0 "Новая Зеландия сохраняет тесную связь с нашей страной и выступила с предостережениями против фашистской угрозы. Их вклад в случае войны несомненен, и мы должны оказать им помощь в соответствующей подготовке."
 uk_south_africa_focus:0 "Развитие Южной Африки"
 uk_south_africa_focus_desc:0 "Политическая ситуация в Южной Африке неопределенная. Мы не можем быть полностью уверены, что они поддержат наши военные усилия, но, помогая им укреплять свою промышленность, мы можем надеяться на увеличение поддержки британского дела."
 FRA_strengthen_government_support_tooltip:0 "Идея \"Укрепление поддержки правительства\" исчерпала себя."
 ITA_victoryinETH:0 "Триумф в Африке"
 ITA_victoryinETH_desc:0 "Поражение в первой итало-эфиопской войне стало пятном на итальянской чести в течение 40 лет, добившись победы, это пятно будет удалено, и будет доказана сила железной воли фашизма!"
 USA_reinforce_monroe_doctrine_tt:0 "Увеличивает мнение о торговле со всеми американскими странами.\n"
 1939_bookmark_threat:0 "Недавний фашистский экспансионизм"
 USA_civil_war_fired:0 "Началась вторая американская гражданская война."
 USA_anti_imperialism:0 "Антиимпериализм"
 USA_anti_imperialism_desc:0 "Америка всегда была врагом империалистических угнетателей, но очевидно, что большинство так называемых демократий готовы поддерживать эти институты, пока извлекают из них выгоду. Революционеры из Советского Союза — лучшие союзники."
 USA_fascist_menace:1 "Прусская угроза"
 USA_fascist_menace_desc:1 "Версальский договор и экономические санкции не остановили Германию, и прусский милитаризм снова поднимает свою уродливую, агрессивную голову. Германия должна быть снова побеждена и взята под наш контроль, по крайней мере на данный момент."
 USA_crusade_against_communism:0 "Крестовый поход против коммунизма"
 USA_crusade_against_communism_desc:0 "Красный террор — безусловно, худшая угроза, с которой когда-либо сталкивался этот мир. Любыми необходимыми средствами необходимо уничтожить разрушительную идеологию, исходящую из Советского Союза, и мы сделаем это."
 USA_strike_at_the_empire:0 "Удар по Империи"
 USA_strike_at_the_empire_desc:0 "Истинная угроза свободе в мире — это колониальные империи, созданные европейскими сверхдержавами. Они должны быть разгромлены, а их население освобождено, начиная с Британской империи, от которой мы когда-то сами освободились."
 USA_defense_of_the_pacific:0 "Защита Тихого океана"
 USA_defense_of_the_pacific_desc:0 "Японское правительство обречено, его экспансионизм угрожает как нашему народу, так и его азиатским соседям. Необходимо ввести американское управление для реформирования этой страны и не дать ей совершать новые ошибки."
 ENG_home_defence:0 "Оборона родины"
 ENG_home_defence_desc:0 "Нет смысла в огромной империи, если мы не можем защитить британский народ. Мы должны сосредоточить свои усилия на безопасности Британских островов."
 ENG_issue_gasmasks:0 "Выдать противогазы"
 ENG_issue_gasmasks_desc:0 "Мир становится все более опасным. Мы должны защитить гражданское население от любых атак с использованием ядовитого газа. Британия будет дышать свободно."
 ENG_military_training_act:0 "Акт о военной подготовке"
 ENG_military_training_act_desc:0 "Великая война оставила у наших людей впечатление, что им больше не придется воевать. По мере того как мир становится опаснее, мы должны обеспечить базовую военную подготовку для всех способных молодых людей."
 ENG_embargo_germany:0 "Эмбарго для Германии"
 ENG_embargo_germany_desc:0 "Вооружение Германии является оскорблением и серьезной угрозой для всего мира. Мы не будем поставлять ресурсы, которые будут питать их военную машину."
 ENG_war_with_germany:0 "Война с Германией"
 ENG_war_with_germany_desc:0 "Немцы не оставили нам другого выбора. Ради свободного мира и будущего наших детей. Настало время для войны."
 ENG_swedish_intervention:0 "Шведское вмешательство"
 ENG_swedish_intervention_desc:0 "Движения шведов против демократии приобретают тревожное влияние. Мы не можем рисковать, что шведская сталь окажется в руках наших врагов. Шведы должны оставаться свободными, но мы должны обеспечить определенное влияние на их страну."
 ENG_norwegian_intervention:0 "Вмешательство в Норвегию"
 ENG_norwegian_intervention_desc:1 "Движения норвежцев против демократии продолжают набирать обороты. Мы должны убедиться, что их политика совпадает с нашими интересами, даже если для этого необходимо применить силу."
 ENG_danish_intervention:0 "Вмешательство в Данию"
 ENG_danish_intervention_desc:0 "Датская поддержка врагов мира во всем мире продолжает расти. Есть только один способ убедиться, что они останутся на нашей стороне. Мы должны использовать Данию для создания стратегического плацдарма в регионе на случай, если наземное вторжение в Европу станет неизбежным."
 ENG_benelux_intervention:0 "Вмешательство в Бенилюкс"
 ENG_benelux_intervention_desc:0 "Политическая обстановка в регионе Бенилюкс становится все более враждебной по отношению к нам. Мы должны направить четкое предупреждение о том, что любые враги демократии не будут терпеться, и что мы готовы применить силу, если это необходимо."
 ENG_belgium_security:0 "Защита Бельгии"
 ENG_belgium_security_desc:0 "Одного предупреждения явно недостаточно. Если политические тенденции продолжатся, как и до сих пор, Бельгия будет представлять прямую угрозу нашим водам. Мы должны вмешаться и создать стратегический плацдарм на континентальной Европе."
 ENG_dutch_security:0 "Обеспечить безопасность Нидерландов"
 ENG_dutch_security_desc:0 "Политические движения в Нидерландах продолжают поддерживать наших врагов. Нидерланды должны быть подчинены для обеспечения свободной Европы."
 ENG_war_with_japan:0 "Война с Японией"
 ENG_war_with_japan_desc:0 "Все другие варианты исчерпаны, а японцы отказываются отказаться от своей экспансионистской политики. Для безопасности Британской империи и народов Азии мы должны подчинить Японию."
 ENG_war_with_italy:0 "Война с Италией"
 ENG_war_with_italy_desc:0 "Итальянцы отказываются отказаться от планов создания новой империи и доказали готовность пойти на войну, чтобы расширить свои границы. Мы должны сделать все возможное, чтобы устранить эту угрозу, пока не стало слишком поздно."
 ENG_embargo_ussr:1 "Эмбарго [SOV.GetNameDefCap]"
 ENG_embargo_ussr_desc:1 "[SOV.GetNameDefCap] растет и использует британские ресурсы для своих военных усилий. Мы должны лишить их доступа к нашей торговле."
 ENG_war_with_ussr:1 "Война с [SOV.GetAdjective]ми"
 ENG_war_with_ussr_desc:1 "Угроза со стороны [SOU.GetNameDef] продолжает расти, несмотря на наши возражения. Мы не можем допустить агрессивного [SOU.GetName] и не имеем другого выбора, кроме как начать войну ради лучшего завтра."
 kamikaze_focus_tooltip:1 "Разрешает воздушные миссии §YКамикадзе§!, суицидальные атаки против вражеских кораблей.\n"
 AST_additional_militia_training:0 "Дополнительное обучение ополчения"
 AST_additional_militia_training_desc:0 "Большая часть наших ополченцев не пригодна для службы — либо больны, либо плохо экипированы. Мы принимаем меры по исправлению этого упущения в опасном мире."
 AST_royal_australian_artillery:0 "Королевская австралийская артиллерия"
 AST_royal_australian_artillery_desc:0 "Артиллерия — королева поля боя, и мы должны расширить наш доступ к тяжелым орудиям."
 AST_promote_reservists:0 "Производить мобилизацию резервистов"
 AST_promote_reservists_desc:0 "Хотя нам нужна сила для защиты страны, мобилизация ополчения и резервистов в регулярную армию даст нам необходимую прибавку к количеству солдат и опыту."
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_daimler_dingo_desc:0 "Этот броневик британского производства улучшит нашу мобильность на поле боя. Кроме того, он назван в честь нашей национальной собаки."
 AST_hmas_assault:0 "HMAS «Штурм»"
 AST_hmas_assault_desc:0 "Война на Тихом океане будет десантной войной, поэтому строительство военно-морской базы, специализирующейся на обучении морских пехотинцев захвату пляжей, является насущной необходимостью для военных усилий."
 AST_specialize_equipment:0 "Специализация техники"
 AST_specialize_equipment_desc:0 "Не вся британская техника, которую мы используем, эффективна в нашей уникальной боевой ситуации. Стало необходимым изготовление специальных и нестандартных средств."
 AST_australian_womens_army_service:0 "Женская вспомогательная служба австралийской армии"
 AST_australian_womens_army_service_desc:0 "Каждый мужчина нужен на фронте, так что управление, сигнализация и техническое обслуживание будут осуществляться тысячами австралийских женщин."
 AST_australian_army_catering_corps:0 "Корпус питания австралийской армии"
 AST_australian_army_catering_corps_desc:0 "Австралийской армии плохо служит качество ее продовольствия, главным образом из-за качества ее поваров. Реорганизовав этот процесс, мы можем повысить боевой дух и эффективность."
 AST_fund_owen_gun_research:0 "Финансирование исследований пулемета Оуэна"
 AST_fund_owen_gun_research_desc:0 "Эвелин Оуэн разработал новый пистолет-пулемет, который может выдерживать суровые условия джунглевой войны. Мы должны направить правительственные ресурсы на производство и совершенствование этого оружия."
 AST_sentinel_tank_project:0 "Проект по танку Sentinel"
 AST_sentinel_tank_project_desc:0 "Австралия должна разработать свой собственный бронированный автомобиль. Программа Sentinel должна быть продвинута, основываясь на немецких и американских идеях."
 AST_airborne_defence:0 "Воздушная оборона"
 AST_airborne_defence_desc:0 "Мы должны защитить небо над Австралией, инвестируя в противовоздушную оборону, в том числе в перехватчики и зенитные средства."
 AST_introduce_unconventional_warfare:0 "Внедряем нетрадиционную войну"
 AST_introduce_unconventional_warfare_desc:0 "Джунгли Тихого океана потребуют нового вида войны. Мы должны научиться быстро и тихо двигаться в густых зарослях - устраивать засады нашим врагам и ожидать того же от них."
 AST_z_special_unit:0 "Z Специальное подразделение"
 AST_z_special_unit_desc:0 "Отряд специального назначения «Z» станет нашей группой коммандос, специализирующейся на разведке и саботаже за линией фронта. Для этого потребуются храбрые люди, готовые пройти самую суровую подготовку."
 AST_m_special_unit:0 "Отряд специального назначения «M»"
 AST_m_special_unit_desc:0 "Отряд специального назначения «M» будет нашим передовым разведывательным подразделением, предоставляя оперативную информацию о расположении и передвижении противника."
 AST_expand_the_raaf:0 "Расширение Королевских ВВС Австралии"
 AST_expand_the_raaf_desc:0 "Наши ВВС должны расти, поэтому мы инвестируем в большее количество баз, подготовку и производство."
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "Boomerang будет вкладом Австралии в разработку истребителей и страховкой от потери импортной авиации. Нам нужно соревноваться с японскими и американскими самолетами."
 AST_expand_northern_presence:0 "Расширение присутствия на севере"
 AST_expand_northern_presence_desc:0 "Поскольку наши города в основном расположены на восточном и западном побережьях острова, северная граница Австралии не имеет должной защиты или подготовки на случай вторжения или нападения. Новые военные объекты в этом районе будут кстати."
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "Австралия будет развивать свои бомбардировочные подразделения. Woomera — это всего лишь легкий самолет, но он вполне подойдет для защиты нашей родины и легкой авиационной поддержки."
 AST_volunteer_air_observers_corps:0 "Добровольческий корпус наблюдателей ВВС"
 AST_volunteer_air_observers_corps_desc:0 "Следите за небом! Мы призываем австралийцев изучать силуэты распространенных самолетов и сообщать правительству о любых подозрительных или вражеских самолетах, приближающихся к Доминиону."
 AST_naval_bombers:0 "Палубные бомбардировщики"
 AST_naval_bombers_desc:0 "Мы окружены водой, поэтому нам следует заняться изучением самолетов и обучением, которое позволит нам перехватывать и атаковать вражеские флоты. Палубная бомбардировка - это специализированный навык, и на нем следует сосредоточиться."
 AST_death_from_down_under:0 "Смерть с Зеленого континента"
 AST_death_from_down_under_desc:0 "Никакие бомбардировщики не навредят нашим портам и городам, как только мы модернизируем нашу систему ПВО, за счет лучшего понимания мощи воздушных сил и грубой силы зенитного вооружения."
 AST_womens_auxilliary_australian_air_force:0 "Женский вспомогательный австралийский воздушный корпус"
 AST_womens_auxilliary_australian_air_force_desc:0 "Половину нашего населения лучше использовать в военных действиях, чем сидеть дома. Техническое обслуживание самолетов, корпус связи и другие связанные с ними задачи будут переданы женщинам."
 AST_dominate_the_skies:0 "Господство в небе"
 AST_dominate_the_skies_desc:0 "Австралия находится далеко от многих вражеских авиабаз, поэтому нашей целью должно быть полное превосходство в воздухе в нашем уголке земного шара."
 AST_cockatoo_island_shipyards:0 "Верфи Кокату"
 AST_cockatoo_island_shipyards_desc:0 "Расширение и улучшение верфей Cockatoo Island - один из главных приоритетов нашего правительства. Сиднейская гавань имеет наилучший доступ к рабочей силе и ресурсам, поэтому именно на ней следует сосредоточить наши усилия по строительству флота."
 AST_kangaroo_point_shipyards:0 "Сухой док Kangaroo Point"
 AST_kangaroo_point_shipyards_desc:0 "Evans Deakin & Company предлагает построить судоверфь и большой сухой док в Kangaroo Point. Такое предприятие было бы идеальным решением для расширения наших возможностей по созданию боевой мощи флота."
 AST_protect_overseas_commerce:0 "Защита морской торговли"
 AST_protect_overseas_commerce_desc:0 "Островному государству нужны припасы, которые доставляются через волны из других стран. Защита морских коммуникаций и торговых путей - это не просто стратегия, это необходимость."
 AST_fly_the_jolly_roger:0 "Поднять Веселого Роджера"
 AST_fly_the_jolly_roger_desc:0 "С нашей островной крепости мы можем отправлять стаи подлодок, чтобы нападать на вражеские торговые суда и уничтожать их припасы, которые проходят мимо наших берегов."
 AST_scrap_iron_flotilla:0 "Флотилия старых кораблей"
 AST_scrap_iron_flotilla_desc:0 "Пока мы не сможем обновить наш флот, нам придется использовать старые суда, которые у нас есть. Возможно, наш враг называет наши старые эсминцы флотилией старых кораблей, но она сослужит нам хорошую службу."
 AST_royal_australian_submarine_service:0 "Королевская австралийская подводная служба"
 AST_royal_australian_submarine_service_desc:0 "Подводные лодки — морское оружие будущего и важнейшая составляющая сил наших союзников. Мы должны принять этот способ ведения войны."
 AST_naval_auxiliary_patrol:0 "Вспомогательный морской патруль"
 AST_naval_auxiliary_patrol_desc:0 "Многие гавани нашей великой страны — заманчивые цели для скрытных подводных атак. Вспомогательные силы прибрежных патрульных судов предупредят нас об любой опасности."
 AST_cruisers:0 "Крейсеры"
 AST_cruisers_desc:0 "Мы можем оставить линкоры и авианосцы в пользу крупных собак, потому что флотилия крейсеров более чем удовлетворит наши потребности."
 AST_pacific_area_navy:0 "Военно-морские силы Тихого океана"
 AST_pacific_area_navy_desc:0 "Хотя Его Величество сражается за выживание в Европе, нашим приоритетом должен стать флот, способный сражаться с врагами в Тихом океане. Мы должны разработать стратегии, соответствующие этой цели."
 AST_standard_gauge_railway:0 "Стандартная железнодорожная колея"
 AST_standard_gauge_railway_desc:0 "Десятилетиями в Австралии были разные железнодорожные колеи, что усложняло наши потребности в транспортировке и доставке. Пришло время наконец стандартизировать железнодорожные колеи по всей стране."
 AST_industries_assistance_corporation:0 "Корпорация по содействию промышленности"
 AST_industries_assistance_corporation_desc:0 "Недавние глобальные экономические потрясения отбили охоту у австралийцев инвестировать и заниматься предпринимательством. Корпорация по содействию промышленности будет предоставлять советы и финансировать малый бизнес по всей стране, чтобы вновь запустить экономику."
 AST_western_australian_government_railways:0 "Государственные железные дороги Западной Австралии"
 AST_western_australian_government_railways_desc:0 "В данный момент государственные железные дороги в Западной Австралии должны иметь больший приоритет, чем строительство дорог. Географическое положение на западе благоприятствует железным дорогам, и мы должны этим воспользоваться."
 AST_south_australian_housing_trust:0 "Жилищный фонд Южной Австралии"
 AST_south_australian_housing_trust_desc:0 "Южной Австралии необходимо больше промышленности и инвестиций, поэтому она направит ресурсы в ряд запланированных населенных пунктов и улучшение жилищных условий, особенно в окрестностях Аделаиды."
 AST_department_of_supply_and_development:0 "Министерство снабжения и развития"
 AST_department_of_supply_and_development_desc:0 "Во время войны нам понадобится специальное министерство для решения вопросов логистики и поставок, боеприпасов, горючего и всего, что необходимо для функционирования армии."
 AST_expand_lithgow_small_arms_factory:0 "Расширить фабрику стрелкового оружия в Литгоу"
 AST_expand_lithgow_small_arms_factory_desc:0 "Наши пулеметы Vickers и Bren поставляет фабрика стрелкового оружия в Литгоу. По мере ее развития, нам будет легче повышать наши боевые возможности."
 AST_allied_works_council:0 "Военный союзнический совет"
 AST_allied_works_council_desc:0 "Все военные строительные проекты в Австралии будут находиться под надзором Военного союзнического совета. Это централизованное планирование обеспечит правительству необходимую ему производительность."
 AST_expand_the_northern_railway:0 "Расширить Северную железную дорогу"
 AST_expand_the_northern_railway_desc:0 "У нас есть железнодорожная линия, которая простирается от Аделаиды на юге до Алис-Спрингс на севере. Теперь мы должны продлить ее северную часть до других городов в этом районе, соединив всю Австралию."
 AST_australian_arms_production:0 "Австралийское производство оружия"
 AST_australian_arms_production_desc:0 "Длительные сроки доставки караванов означают, что Австралия должна в большей степени, чем другие доминионы, брать на себя ответственность за производство собственного оружия. У нас есть заводы и есть ноу-хау."
 AST_uranium_mining:0 "Добыча урана"
 AST_uranium_mining_desc:0 "За последние десятилетия мы обнаружили крупные месторождения урана в Южной Австралии, особенно в районе горы Ги. Уран теперь является жизненно важным военным ресурсом, и добыча этих запасов должна быть увеличена."
 AST_establish_advisory_war_council:0 "Создать Консультативный военный совет"
 AST_establish_advisory_war_council_desc:0 "Австралийские политики должны оставить в стороне идеологические и партийные разногласия и объединиться для консультаций и вынесения рекомендаций по ведению войны."
 AST_national_security_act:0 "Акт о национальной безопасности"
 AST_national_security_act_desc:0 "Теперь, когда мы находимся в состоянии войны, федеральное правительство возьмет на себя большие полномочия для защиты Австралии. Более жесткая цензура прессы, подавление групп инакомыслящих, а также большие возможности для взимания налогов и конфискации имущества в целях обороны Доминиона."
 AST_volunteer_defence_corps:0 "Корпус добровольной обороны"
 AST_volunteer_defence_corps_desc:0 "Корпус добровольной обороны был сформирован из ветеранов старшего возраста и других граждан, не входящих в состав регулярной армии. Они будут служить в качестве ополчения, освобождая армию для принятия прямых мер против своих врагов."
 AST_civil_construction_corps:0 "Строительный корпус гражданской обороны"
 AST_civil_construction_corps_desc:0 "Мы призовем трудоспособных мужчин на службу в Корпус строительства гражданской обороны, чтобы помочь в строительстве аэродромов, транспорта, фортов и другой важной военной инфраструктуры."
 AST_army_inventions_directorate:0 "Управление военных изобретений"
 AST_army_inventions_directorate_desc:0 "Войны стимулируют новаторство и творчество, и правительству нужен способ отделить хорошие идеи от плохих. Новое специализированное патентное ведомство будет заниматься определением того, какие из многочисленных предложений, представленных правительству, имеют какую-либо ценность."
 AST_invest_in_victory:0 "Инвестируйте в победу"
 AST_invest_in_victory_desc:0 "Продав облигации военного займа нашему населению, они могут внести свои сбережения в военные усилия."
 AST_citizen_military_forces:0 "Вооруженные силы граждан"
 AST_citizen_military_forces_desc:0 "Настало время подготовить резервную армию, чтобы повысить нашу готовность в случае войны. Мы призовем имеющихся ополченцев в армию для защиты страны, а затем подготовим их к службе за границей, если это потребуется."
 AST_rats_of_tobruk:0 "Крысы Тобрука"
 AST_rats_of_tobruk_desc:0 "Наши храбрые солдаты проявили себя как специалисты в пустынной войне и мародерстве на поле боя. Они изматывают врага, нанося удары со своих баз, а затем отступая перед контратакой."
 AST_rats_of_tobruk_effect_1:0 "Получить элитное подразделение в Тобруке"
 AST_rats_of_tobruk_effect_2:0 "Получить элитное подразделение в Сиднее"
 AST_fight_work_or_perish:0 "Борись, работай или погибай"
 AST_fight_work_or_perish_desc:0 "Поскольку наш враг представляет экзистенциальную угрозу для Доминиона, австралийцам приходится делать выбор. Они будут бороться, они будут работать или они погибнут."
 AST_research_collaboration:0 "Научное сотрудничество"
 AST_research_collaboration_desc:0 "Британцы показали нам преимущество обмена научными достижениями между близкими союзниками. Вся наша фракция сможет более эффективно проводить военные НИОКР, если мы предпримем необходимые шаги для координации этого."
 AST_fund_australian_defense_research:0 "Финансирование австралийских оборонных исследований"
 AST_fund_australian_defense_research_desc:0 "Теперь, когда Австралия стала полностью независимой, мы больше не получаем доступа к современным прототипам и чертежам, как это было раньше. Мы должны быть уверены, что всегда будем опережать наших врагов и не отстанем в технологическом плане."
 AST_squash_the_squanderbugs:0 "Боремся с бездумными транжирами"
 AST_squash_the_squanderbugs_desc:0 "Бессмысленные траты на потребительские товары с высокой стоимостью уменьшают приток денежных средств в военные облигации и снижают эффективность военных действий. Нам необходимо побороть стремление к роскоши, пока наша армия в ней нуждается."
 AST_rationing_and_recycling:0 "Нормирование и переработка"
 AST_rationing_and_recycling_desc:0 "Каждый ресурс имеет значение. Мы нормируем продукты питания для своих граждан, перерабатываем, чтобы получить максимум металла из изношенных товаров, и стимулируем экономику по всей стране."
 AST_classify_aliens:0 "Классификация иностранцев"
 AST_classify_aliens_desc:0 "Австралия — страна иммигрантов, поэтому мы можем привлечь людей, лояльных своей родине. Мы будем регистрировать и отслеживать австралийцев иностранного происхождения."
 AST_strengthen_ties_with_uk:0 "Укрепление связей с Великобританией"
 AST_strengthen_ties_with_uk_desc:0 "Наша преданность на стороне родины. Мы пойдем туда, куда она укажет, и обязуемся бороться с ее врагами. Боже, храни короля."
 AST_support_the_policy_of_appeasement:0 "Поддерживаем политику умиротворения"
 AST_support_the_policy_of_appeasement_desc:0 "Последствия последней войны все еще тяготят народную память. Если территориальные уступки за полмира позволят Австралии избежать войны, нам, безусловно, стоит их рассмотреть."
 AST_the_singapore_strategy:0 "Сингапурская стратегия"
 AST_the_singapore_strategy_desc:0 "Сингапур слишком далеко от Лондона, чтобы быть в безопасности. Австралия возьмет на себя защиту этого форпоста империи от агрессии со стороны других."
 AST_adopt_westminster:0 "Внедрить Вестминстерскую систему"
 AST_adopt_westminster_desc:0 "Мы принимаем Вестминстерскую систему, которую мы унаследовали от Соединенного Королевства."
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "Организация научных и промышленных исследований Содружества - наш исследовательский отдел правительства, призванный повысить эффективность науки и производства в Австралии. Увеличивая нашу поддержку ему, мы придадим еще больше энергии мускулам войны."
 AST_swpa_protector:0 "Защитник Юго-Западной части Тихого океана"
 AST_swpa_protector_desc:0 "Австралия должна занять основную позицию в качестве защитника юго-западной части Тихого океана. Вся морская зона от Индокитая через Индонезию до Новой Гвинеи должна быть под нашим покровительством."
 AST_empire_air_training_scheme:0 "Программа подготовки военно-воздушных сил империи"
 AST_empire_air_training_scheme_desc:0 "Австралия должна перейти к полноценной программе подготовки лётчиков. Содействуя и поддерживая Великобританию, все доминионы будут работать вместе, чтобы обеспечить войну лётчиками и вспомогательным персоналом."
 AST_commonwealth_aircraft_corporation:0 "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_desc:0 "Commonwealth Aircraft Corporation — основной производитель самолётов и авиационных двигателей в Австралии. У него есть проверенные на деле возможности, а его поддержка обеспечит наших лётчиков необходимыми им материалами."
 AST_sever_ties_with_uk:0 "Разорвать связи с Великобританией"
 AST_sever_ties_with_uk_desc:0 "Пришло время порвать с Великобританией. Австралия может идти своим путём без вмешательства из Лондона и заявить о своём предназначении в собственном регионе."
 AST_protect_the_homeland:0 "Защитить родину"
 AST_protect_the_homeland_desc:0 "Австралия велика, но ее побережье может быть защищено. Безопасность нашей страны имеет наивысший приоритет."
 AST_the_swpa_menace:0 "Угроза в Юго-Западной части Тихого океана"
 AST_the_swpa_menace_desc:0 "Япония создаёт империю, угрожающую безопасности Австралии и свободе в регионе. Мы должны обратиться к единомышленникам, чтобы они стали нашими союзниками."
 AST_never_another_gallipoli:0 "Больше никогда как при Галлиполи"
 AST_never_another_gallipoli_desc:0 "Единственный способ, чтобы гарантировать, что Австралия не будет втянута в дальнейшие дорогостоящие войны из-за сентиментов, заключается в полном контроле над нашей внешней политикой. Нам не нужен далекий король, и мы не можем позволить старинным кровным связям втягивать нас в конфликты, которые не соответствуют нашим интересам."
 AST_woo_usa:0 "Соблазнить США"
 AST_woo_usa_desc:0 "Настоящим нашим союзником является Америка, еще одна тихоокеанская держава с британскими корнями. Эта богатая и могущественная страна лучше понимает наши потребности, увеличивает наше процветание и защищает нас от агрессии."
 AST_protect_the_dutch_colonies:0 "Защитить голландские колонии"
 AST_protect_the_dutch_colonies_desc:0 "Нидерланды - слабый и отдаленный хозяин своих индонезийских колоний. Он не сможет защитить их от нападений со стороны Японии, Китая или любой другой потенциально враждебной нации. Мы должны взять управление на себя ради общего блага."
 AST_the_south_west_pacific_initiative:0 "Инициатива в юго-западной части Тихого океана"
 AST_the_south_west_pacific_initiative_desc:0 "Мы установили базу власти и доверие для создания собственной сети союзов, сосредоточив внимание на защите района юго-западной части Тихого океана от враждебных сил. Мы будем искать единомышленников и сделаем Австралию одним из главных участников мировых дел."
 AST_preemptive_intervention:0 "Превентивное вмешательство"
 AST_preemptive_intervention_desc:0 "Захватнические амбиции Японии последнего десятилетия представляют угрозу для свободных народов Тихого океана. Мы не можем ждать, пока она обратит свои ненасытные глаза на нас. Время действовать настало."
 AST_research_cooperation:0 "Исследовательское сотрудничество"
 AST_research_cooperation_desc:1 "Австралийцы — умный и находчивый народ, но у нас недостаточно инфраструктуры и людей для серьёзной научной программы. Мы будем работать с нашими союзниками, обмениваясь знаниями и прорывами на взаимовыгодной основе."
 AST_abandon_the_westminster_system:0 "Отказаться от Вестминстерской системы"
 AST_abandon_the_westminster_system_desc:0 "Хотя Вестминстерский парламент — наше наследие от Великобритании, он утратил свою полезность в современную эпоху. Разногласия в кабинете министров и партийное соперничество не помогли стабилизировать Австралию в ходе недавнего экономического кризиса."
 AST_support_the_centre_party:0 "Поддержать Партию центра"
 AST_support_the_centre_party_desc:0 "В Новом Южном Уэльсе возникло мощное антикоммунистическое движение. При поддержке своих союзников из Новой гвардии Партия центра может стать ключом к укреплению Австралии."
 AST_supply_indonesian_nationalists:0 "Поддерживать индонезийских националистов"
 AST_supply_indonesian_nationalists_desc:0 "Мы должны поддержать народ Индонезии в их борьбе против голландских угнетателей. Им потребуется образование и обучение, но с их численным превосходством победа в этой борьбе за справедливость неизбежна, как и их благодарность нам."
 AST_support_indonesian_uprising:0 "Поддержать индонезийское восстание"
 AST_support_indonesian_uprising_desc:0 "Теперь, когда индонезийцы взялись за оружие против голландцев, им понадобится больше, чем слова. Для восстания нужны оружие и другое снаряжение, а также всесторонняя дипломатическая поддержка."
 AST_demand_new_zealand:0 "Требовать Новую Зеландию"
 AST_demand_new_zealand_desc:0 "Киви долгое время были нашими ближайшими союзниками и друзьями. Мы сражались на одних и тех же пляжах и погибали в одних и тех же бесполезных имперских войнах. Пришло время объединить наши две страны под одним флагом."
 AST_protect_the_south_west_pacific:0 "Защитить юго-западную часть Тихого океана"
 AST_protect_the_south_west_pacific_desc:0 "Пришло время использовать нашу региональную мощь, чтобы привлечь весь юго-запад Тихого океана в нашу сферу влияния. Только мы можем защитить людей и ресурсы от посторонних, желающих разграбить наше наследие."
 AST_a_deal_with_japan:0 "Сделка с Японией"
 AST_a_deal_with_japan_desc:0 "Удерживая в своей орбите юго-западную часть Тихого океана, мы можем достичь сближения с Японской империей. Если она останется на северо-западе и оставит нашу сферу нам, то у нас не будет причин сражаться."
 AST_our_own_empire:0 "Наша собственная империя"
 AST_our_own_empire_desc:0 "Бывшей колонии пришло время встать на ноги и провозгласить австралийскую империю. Наша благотворительность и дальновидное планирование пойдут на благо всем в регионе."
 AST_japan_tech_sharing:0 "Технический обмен с Японией"
 AST_japan_tech_sharing_desc:0 "Японские ученые сумели опередить наши собственные научно-исследовательские институты, но наша новая гармония с Империей восходящего солнца открывает новые возможности для обучения и обмена."
 AST_war_on_japan:0 "Война с Японией"
 AST_war_on_japan_desc:0 "Японская агрессия зашла слишком далеко. Япония разграбила и разграбила Восточную Азию, и теперь она положила глаз на земли и ресурсы дальше на юг. Мы не можем стоять в стороне."
 AST_empower_the_workers:0 "Уполномочить рабочих"
 AST_empower_the_workers_desc:0 "Страна заключенных, скотоводов и докеров. Это Австралия. Пришло время дать голос и власть рабочим и пролетариату Австралии. Да здравствует революция."
 AST_delegation_to_china:0 "Делегация в Китай"
 AST_delegation_to_china_desc:0 "Китайский народ, долгое время раздираемый имперской алчностью, нуждается в друге. А нам нужен региональный союзник против фашизма. Эта официальная встреча с китайским правительством сблизит нас."
 AST_commitment_to_the_cause:0 "Преданность делу"
 AST_commitment_to_the_cause_desc:0 "Пришло время сбросить оковы чужого короля и построить Рабочий рай, свободный от империалистического подстрекательства к войне, которое подвергает риску всю Австралию."
 AST_indirect_support:0 "Косвенная поддержка"
 AST_indirect_support_desc:0 "Китайская Народная Республика ведёт войну, но мы не можем себе позволить вмешиваться. Небольшая партия оружия и осторожная поддержка — это всё, что мы сейчас можем себе позволить."
 AST_direct_support:0 "Прямая поддержка"
 AST_direct_support_desc:0 "К оружию, товарищи! Услышьте призыв наших китайских братьев, страдающих в войне против фашизма! Вступайте в ряды и присоединяйтесь к мировой борьбе всех трудящихся!"
 AST_join_comintern:0 "Вступить в Коминтерн"
 AST_join_comintern_desc:0 "Наше будущее — за коммунизмом, поэтому мы должны присоединиться к нашим товарищам по всему миру в этой глобальной борьбе. Папа Джо укажет нам путь и приведёт рабочих из Австралии и со всего мира к славному будущему."
 AST_workers_paradise:0 "Рабочий рай"
 AST_workers_paradise_desc:0 "Сталинистский коммунистический эксперимент потерпел неудачу, но мы считаем, что социализм — правильный путь. Австралия создаст второй путь для трудящихся, свободный от диктата Москвы."
 AST_research_city_excursions:0 "Экскурсии в наукоград"
 AST_research_city_excursions_desc:0 "Советский Союз построил научные города и лаборатории по всей своей территории и пригласил австралийских учёных приехать и познакомиться с достижениями коммунистической науки."
 AST_nz_puppet:0 "Марионетка НЗ"
 AST_nz_puppet_desc:0 "Рабочие Новой Зеландии должны объединиться со своими австралийскими братьями и сестрами. Мы можем защитить их и предлагаем им дружескую помощь при условии, что они подчинятся нам."
 AST_the_threat_against_the_people:0 "Угроза народу"
 AST_the_threat_against_the_people_desc:0 "Милитаризованная и фашистская власть Императорской Японии угрожает благополучию всех австралийцев и мешает мирному сосуществованию рабочих всего мира. Австралия отбросит этого врага народа, заставив его остаться на его жалких скалистых островах."
 AST_new_general_tt:0 "Появится новый генерал по имени §YАйвен Макей§! §Y3 навык§!"
 AST_homeland_defense_tt:0 "Укрепить родину §Yприбрежными фортами и сухопутными укреплениями§!, охраняющими возможные места высадки и порты."
 AST_swpi_research_tt:0 "Мы заключим §Yсоглашение об обмене технологиями§! с США или с другими членами нашей фракции."
 AST_deal_with_japan_tt:1 "Мы предложим передать сюзеренитет над §YМалайей§! Японии в обмен на союз. Если это невозможно, мы предложим уступить Японии штаты §YКалимантан§!, §YСулавеси§! и §YМолуккские острова§!."
 CAN_rowell_sirois_commission:0 "Комиссия Роуэлла-Сируа"
 CAN_rowell_sirois_commission_desc:0 "Комиссия Роуэлла-Сируа пришла к выводу, что федеральное конституционное устройство Канады препятствует восстановлению после Великой депрессии. Мы должны уравнять стандарты обслуживания по всей стране."
 CAN_crown_corporations:0 "Государственные корпорации"
 CAN_crown_corporations_desc:0 "Для предоставления основных услуг, стимулирования экономического и промышленного роста Канада должна создать множество новых государственных корпораций. Правительство должно сделать это там, где частный бизнес не готов принимать меры."
 CAN_war_bonds:0 "Военные облигации"
 CAN_war_bonds_desc:0 "Мы не можем финансировать военные усилия, опираясь на нашу скудную налоговую базу или экспорт ресурсов. Патриотичный канадский народ должен инвестировать в свою страну и поддерживать военные усилия с помощью военных облигаций."
 CAN_defence_of_canada_regulations:0 "Положения об обороне Канады"
 CAN_defence_of_canada_regulations_desc:0 "Во время войны гражданские права должны быть ограничены, чтобы предотвратить подрыв военных усилий. Это означает ограничения для прессы, групп диссидентов и некоторых юридических прав."
 CAN_national_housing_act:0 "Национальный закон о жилье"
 CAN_national_housing_act_desc:0 "Современный доминион должен иметь стандартизированные правила в отношении жилья по всей стране. Мы должны улучшить условия жизни всех канадцев."
 CAN_dollar_a_year_men:0 "Люди за доллар в год"
 CAN_dollar_a_year_men_desc:0 "В канадской промышленности есть проблемы с эффективностью, но ряд состоятельных бизнесменов предложили свои услуги и консультации за символическую сумму. Эта небольшая группа советников поможет нам продвигаться вперед."
 CAN_canada_pacific_railway:0 "Канадская тихоокеанская железная дорога"
 CAN_canada_pacific_railway_desc:0 "КРЖ предоставил все свои ресурсы военным действиям. Тысячи тонн поставок и материалов беспрепятственно пересекут наше грандиозное Доминион - от моря к морю."
 CAN_maritime_colonial_railway:0 "Приморская колониальная железная дорога"
 CAN_maritime_colonial_railway_desc:0 "Наши восточные провинции были обделены железнодорожными линиями после продажи Межколониальной железной дороги Канадской национальной железной дороге. Мы поощряем и планируем создание новой Приморской колониальной железной дороги для расширения связей между центральными и Атлантическими провинциями."
 CAN_retool_angus_shops:0 "Переоборудовать цеха Angus"
 CAN_retool_angus_shops_desc:0 "Современной армии нужны танки, а цеха КРЖ Angus подходят для их строительства. Переоборудуйте и модернизируйте эту инфраструктуру, чтобы строить танки."
 CAN_imperial_oil:0 "Imperial Oil"
 CAN_imperial_oil_desc:0 "Imperial Oil хочет профинансировать разведку в Западной Канаде. Это увеличит наши запасы нефти и обеспечит смазку для военной машины."
 CAN_department_of_munitions_and_supply:0 "Департамент боеприпасов и снабжения"
 CAN_department_of_munitions_and_supply_desc:0 "Мы передадим контроль и управление национальными ресурсами Канады К. Д. Хоу в Департаменте боеприпасов и снабжения."
 CAN_national_resources_mobilization_act:0 "Закон о мобилизации национальных ресурсов"
 CAN_national_resources_mobilization_act_desc:0 "Канада велика и население рассредоточено небольшими группами по всей стране. Следует создать систему, позволяющую отслеживать статус занятости и гарантировать, что всех, кто имеет право на службу за границей, можно будет найти."
 CAN_wartime_prices_and_trade_board:0 "Ведомство по ценам и торговле военного времени"
 CAN_wartime_prices_and_trade_board_desc:0 "Для предотвращения спекуляции и накопления были введены меры контроля над ценами, чтобы сделать товары доступными для большинства канадцев."
 CAN_bits_and_pieces_program:0 "Программа «Лоскуты»"
 CAN_bits_and_pieces_program_desc:0 "Программа «Лоскуты» мобилизует для военных нужд ряд мелких фабрик, которые занимались производством мелких потребительских товаров. Например, на велосипедной фабрике можно производить ряд полезных военных товаров."
 CAN_fund_the_national_research_council:0 "Финансирование Национального исследовательского совета"
 CAN_fund_the_national_research_council_desc:0 "Канада гордится своей наукой и прогрессом, но потребность в исследователях сейчас как никогда высока. Пришло время более активно поддерживать ННИ."
 CAN_mine_the_shield:0 "Добыча в Канадском щите"
 CAN_mine_the_shield_desc:0 "Канадский щит богат никелем, медью, золотом и серебром. Природа наделила нас богатством минералов. Пришло время расширять его добычу."
 CAN_canada_wheat_board:0 "Канадская пшеничная комиссия"
 CAN_canada_wheat_board_desc:0 "Разорению наших фермеров на Западе во времена Депрессии можно положить конец, если мы восстановим Канадскую пшеничную комиссию и решим вопрос ценообразования на пшеницу, ячмень, овес и другие культуры."
 CAN_victory_aircraft_limited:0 "Victory Aircraft Limited"
 CAN_victory_aircraft_limited_desc:0 "Перед Victory Aircraft поставлена задача построить канадский бомбардировочный флот. "Ланкастеров" хватит на всех!"
 CAN_alberta_coal_towns:0 "Угольные города Альберты"
 CAN_alberta_coal_towns_desc:0 "Вдоль Скалистых гор имеются месторождения угля, готовые к разработке. Мы можем поощрять эмиграцию в эти новые горнодобывающие районы и улучшить ситуацию с занятостью на западе."
 CAN_commit_to_the_war:0 "В бой"
 CAN_commit_to_the_war_desc:0 "Мир пылает, и Канада должна сыграть свою роль. Мы обязуемся защищать демократию и британский образ жизни."
 CAN_john_inglis_and_company:0 "John Inglis and Company"
 CAN_john_inglis_and_company_desc:0 "Необходимо поручить John Inglis and Company создать новые пулеметы и пушки для канадской армии."
 CAN_polymer_corporation:0 "Polymer Corporation"
 CAN_polymer_corporation_desc:0 "Новая государственная корпорация Polymer Corporation показала себя исключительно эффективной в производстве новых резиновых полимеров."
 CAN_national_steel_car:0 "National Steel Car"
 CAN_national_steel_car_desc:0 "Несмотря на трудности времен Великой депрессии, компания National Steel Car обладает достаточным опытом для того, чтобы наладить выпуск техники, необходимой нам для развития сети железных дорог и нужд армии."
 CAN_send_in_the_zombies:0 "Бросьте на них зомби"
 CAN_send_in_the_zombies_desc:0 "Настало время поставить всех пригодных к службе канадцев в строй. Мы призвали в промышленность множество мужчин через Ассоциацию национальной регистрации и мобилизации, теперь же их следует отправить за рубеж."
 CAN_if_day:0 "Днем и ночью"
 CAN_if_day_desc:0 "Канадцы не воспринимают всерьез угрозу иностранного господства, поэтому мы смоделируем нацистскую оккупацию Виннипега, чтобы наглядно продемонстрировать возможные последствия. Это наверняка повысит продажи военных облигаций."
 CAN_defense_research_grants:0 "Субсидии на военные НИОКР"
 CAN_defense_research_grants_desc:0 "Став независимым государством, Канада более не имеет доступа к передовым прототипам и проектам, как это было раньше. Мы должны следить за тем, чтобы всегда опережать своих врагов и не отставать в технологическом развитии."
 CAN_uranium_mining:0 "Добыча урана"
 CAN_uranium_mining_desc:0 "Наши союзники ведут секретный проект, для которого требуется уран. К счастью, компания Eldorado обнаружила это редкое вещество и построила город рядом с рудниками - Порт-Радиум. Правительству следует установить контроль над этой компанией и защитить этот стратегически важный минерал."
 CAN_long_branch_arsenal:0 "Арсенал Лонг-Бранч"
 CAN_long_branch_arsenal_desc:0 "Арсенал \"Лонг-Бранч\" в западном Торонто станет нашим центром по производству винтовок. Нам нужны тысячи винтовок Ли-Энфилда, а центральное расположение арсенала поможет распределить их по всей стране."
 CAN_independent_command:0 "Независимое командование"
 CAN_independent_command_desc:0 "Во время Первой мировой войны канадские войска подчинялись британским офицерам, что привело к бессмысленным бойням на Сомме и Пашендейле. На этот раз Канада будет командовать сама."
 CAN_forced_quebec_conscription:0 "Принудительный призыв в Квебеке"
 CAN_forced_quebec_conscription_desc:0 "Как и в 1917 году, франкоканадские жители Квебека противились идее национального призыва, чтобы привлечь в армию больше людей. Мы не будем стоять в стороне и позволим меньшинству игнорировать волю парламента."
 CAN_compromise_with_quebec:0 "Компромисс с Квебеком"
 CAN_compromise_with_quebec_desc:0 "Квебек противится национальному призыву. Этот вопрос чуть не разорвал страну во время Первой мировой войны, и мы не можем позволить себе нарушить наше национальное единство во время кризиса. Возможно, мы сможем заключить соглашение о военной службе для жителей Квебека."
 CAN_war_fueled_economy:0 "Военная экономика"
 CAN_war_fueled_economy_desc:0 "Зарубежный спрос на сырье и готовую продукцию выводит Канаду из Депрессии. Наше природное богатство в виде лесов и минералов может подпитывать военную машину союзников и обогащать нацию."
 CAN_army_modernization:0 "Модернизация армии"
 CAN_army_modernization_desc:0 "Канада слишком долго чувствовала себя в безопасности за стенами своего негорючего дома, вдали от воспламеняющихся материалов, поэтому она позволила своей армии довольствоваться устаревшим оборудованием и подготовкой. Нам необходимо приступить к модернизации, пока не стало слишком поздно."
 CAN_canadian_infantry_corps:0 "Канадский пехотный корпус"
 CAN_canadian_infantry_corps_desc:0 "Теперь у нас достаточно людей для создания подразделения уровня корпуса. Канадский пехотный корпус — это наше первое крупное подразделение с момента окончания последней войны."
 CAN_cmp_truck:0 "Грузовик CMP"
 CAN_cmp_truck_desc:0 "Канадские заводы защищены от вражеских бомбардировок, поэтому их можно использовать для производства транспортных средств для военных нужд. Наш грузовик CMP имеет универсальную конструкцию, подходящую для многих климатических условий."
 CAN_royal_regiment_of_canadian_artillery:0 "Королевский канадский артиллерийский полк"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "Несмотря на отсутствие современных пушек, нам необходимо начать обучать артиллеристов вести современную войну, в том числе обращению с зенитными орудиями и новыми 25-фунтовыми орудиями."
 CAN_a_motorized_army:0 "Моторизованная армия"
 CAN_a_motorized_army_desc:0 "Опыт Канады в производстве грузовиков и двигателей дал нам преимущество в исследовании и разработке моторизованных вооруженных сил."
 CAN_red_deer_training_camp:0 "Учебный лагерь Ред-Дир"
 CAN_red_deer_training_camp_desc:0 "Учебный лагерь Ред-Дир станет главным местом подготовки нашей новой армии. Благодаря арсеналу с полным набором вооружения и соседствующим аэродромам Ред-Дир идеально расположен."
 CAN_the_walkie-talkie:0 "Рация"
 CAN_the_walkie_talkie_desc:0 "Дональд Хингс изобрел и получил патент на новое портативное двухстороннее коммуникационное устройство, работающее на радиоволнах. Это значительно улучшит связь и целеуказание."
 CAN_1st_canadian_parachute_battalion:0 "1-й канадский парашютно-десантный батальон"
 CAN_1st_canadian_parachute_battalion_desc:0 "Несмотря на сопротивление тех, кто предпочел бы, чтобы мы сосредоточились на обороне страны, современной воздушно-десантной войне нужен специализированный парашютно-десантный батальон, чтобы сбросить наших врагов."
 CAN_the_black_devils:0 "Черные дьяволы"
 CAN_the_black_devils_desc:0 "Специальное подразделение коммандос должно быть готово выполнять опасные задания. Достигнута договоренность о сотрудничестве с нашими американскими союзниками в создании бригады "Дьяволов"."
 CAN_the_valentine_tank:0 "Танк Валентайн"
 CAN_the_valentine_tank_desc:0 "Канада имеет лицензию на производство танка Valentine, прочного среднего танка британской конструкции."
 CAN_the_rocky_mountain_rangers:0 "Рейнджеры Скалистых гор"
 CAN_the_rocky_mountain_rangers_desc:0 "Защита запада будет возложена на рейнджеров Скалистых гор, базирующихся в Камлупсе."
 CAN_strengthen_the_commonwealth_ties:0 "Укрепление связей в Содружестве"
 CAN_strengthen_the_commonwealth_ties_desc:0 "Наши собратья по Доминиону - наши самые верные друзья, и мы все должны идти вместе в поддержку Его Величества."
 CAN_shadow_factories:0 "Теневые заводы"
 CAN_shadow_factories_desc:0 "Нам нужны авиазаводы, но проще и безопаснее разместить производство деталей на других заводах, особенно возле автомобильных. Это повысит секретность и безопасность."
 CAN_montreal_laboratory_collaboration:0 "Сотрудничество с лабораторией Монреаля"
 CAN_montreal_laboratory_collaboration_desc:1 "Лаборатория в Монреале стала привлекательной для ученых со всего мира. Французские и британские ученые чувствуют себя здесь особенно желанными гостями и привносят свой столь необходимый опыт в работу Доминионов."
 CAN_the_plan:0 "План"
 CAN_the_plan_desc:0 "Мы объединились с нашими союзниками для обмена опытом и информацией в обучении пилотов. Война может быть выиграна с воздуха, поэтому «Программа подготовки пилотов Содружества» может стать ключом к победе."
 CAN_camp_x:0 "Лагерь X"
 CAN_camp_x_desc:0 "Сбор разведданных и подготовка шпионов будут сконцентрированы в секретном месте рядом с Ошавой. Оно находится в центре, поэтому может получать сообщения как из Великобритании, так и из Америки."
 CAN_supply_the_empire:0 "Поддержка Империи"
 CAN_supply_the_empire_desc:0 "Есть ли какая-нибудь нация с такими богатствами, как древесина, железо, никель и уголь? Пока наши конвои и железные дороги в безопасности, мы можем отправлять сырье в свои порты, а затем нашим союзникам по Империи."
 CAN_aluminium_company_of_canada:0 "Алюминиевая компания Канады"
 CAN_aluminium_company_of_canada_desc:0 "Алюминий - легкий и не подверженный коррозии материал. Расширив добычу и производство алюминия, мы сможем обеспечить бесперебойную работу наших заводов и сборочных линий."
 CAN_turner_valley_oilfield:0 "Нефтяное месторождение Тернер-Вэлли"
 CAN_turner_valley_oilfield_desc:0 "Обнаруженное в 1914 году, Тернер-Вэлли за пределами Калгари стало одним из крупнейших нефтяных месторождений в Империи. Его дальнейшее развитие должно стать главным приоритетом для промышленности и правительства."
 CAN_patriation:0 "Репатриация"
 CAN_patriation_desc:0 "Настало время для Канады ослабить связи с матушкой-Англией. Мы - взрослая нация с собственной судьбой, устремляющая свой взгляд как на континент и Тихий океан, так и на Англию и Европу."
 CAN_permanent_joint_defense_board:0 "Постоянный объединенный совет по обороне"
 CAN_permanent_joint_defense_board_desc:0 "География и общее наследие связывают нас с Соединенными Штатами, но континент слишком велик, чтобы кто-то из нас мог защитить его в одиночку. Необходим объединенный совет по обороне для консультаций и планирования защиты Северной Америки."
 CAN_north_american_alliance:0 "Североамериканский альянс"
 CAN_north_american_alliance_desc:0 "Настало время объявить о великом и прочном партнерстве с Соединенными Штатами Америки. Никто не сможет бросить нам вызов, когда мы объединены в мире и братстве."
 CAN_habakkuk_carrier:0 "Авианосец Хабаккук"
 CAN_habakkuk_carrier_desc:0 "Проект «Хабаккук» - наш план построить противолодочный авианосец из материала, изготовленного из древесной массы и льда. Это освободит сталь для более важных целей и позволит продолжить канадские научные исследования."
 CAN_refuge_for_scientists:0 "Убежище для ученых"
 CAN_refuge_for_scientists_desc:0 "Вдали от бушующей войны Канада оказалась многообещающим местом для ученых, которые хотят продолжить свои работы вдали от бомб и пуль."
 CAN_swastika_clubs:0 "Клуб со свастикой"
 CAN_swastika_clubs_desc:0 "Многие канадцы присоединяются к Клубу со свастикой, чтобы продвигать идеи и идеалы фашизма. Восхитительно!"
 CAN_support_the_blue_shirts:0 "Поддержка Синерубашечников"
 CAN_support_the_blue_shirts_desc:0 "Поворот нашей страны к фашизму потребует создания сильного военизированного подразделения для устрашения и впечатлений наших соперников. Синерубашечники будут нашим ответом тем, кто осмелится бросить вызов нашему новому порядку."
 CAN_join_germany:0 "Присоединение к Германии"
 CAN_join_germany_desc:0 "Гитлер проявил себя как разумный человек, который выдвигает разумные требования, одновременно укрепляя свою нацию. Мы присоединимся к Рейху в знак солидарности за новую Золотую эру."
 CAN_support_a_synarchist_baja:0 "Поддержка синархистской Бахи"
 CAN_support_a_synarchist_baja_desc:0 "Чтобы еще больше расширить распространение консервативного национализма в Северной Америке, мы должны объединиться с синархистами в Мексике. Как только это будет достигнуто, у нас будет два фашистских государства, готовых распространить идеи по всему континенту."
 CAN_pinion_the_eagle:0 "Прижать орла"
 CAN_pinion_the_eagle_desc:0 "Наша протяженная граница с Соединенными Штатами слишком долго была беззащитной. Америка остается главной угрозой для безопасности Канады, поэтому будут приняты меры, чтобы сделать вторжение США слишком трудным и проблематичным."
 CAN_skewer_the_eagle:0 "Насадить орла на вертел"
 CAN_skewer_the_eagle_desc:0 "Мы заключим союз с нашими мексиканскими братьями, чтобы окружить и сдержать американскую угрозу."
 CAN_defence_scheme_no_1:0 "Оборонная схема №1"
 CAN_defence_scheme_no_1_desc:0 "Пришло время стряхнуть пыль с Оборонной схемы №1, нашего межвоенного плана по контрнаступлению на Соединенные Штаты в случае войны."
 CAN_demand_labrador_and_newfoundland:0 "Затребовать Лабрадор и Ньюфаундленд"
 CAN_demand_labrador_and_newfoundland_desc:0 "Ньюфаундленд - это провалившийся доминион, который должен был вернуться к статусу колонии. Его место - в Канаде."
 CAN_burn_the_royal_portraits:0 "Сжечь королевские портреты"
 CAN_burn_the_royal_portraits_desc:0 "Больше никаких монархов! Мы больше не подчинимся правлению иностранных подставных лиц и чужого парламента. Канада будет свободной и равноправной. Народ восстанет."
 CAN_communist_labor_total_war_committee:0 "Коммунистический трудовой комитет тотальной войны"
 CAN_communist_labor_total_war_committee_desc:0 "Канадские коммунисты тоже патриоты! В мировой войне против фашизма мы можем сотрудничать с буржуазными либералами, чтобы мобилизовать всю нацию на войну."
 CAN_defence_scheme_no_2:0 "Оборонная схема №2"
 CAN_defence_scheme_no_2_desc:0 "План обороны № 2 - наш план действий на случай войны на Тихом океане между США и Японской империей. В идеале мы сохраним нейтралитет в случае войны, но в любом случае будет создана мощная оборона на нашем западном побережье."
 CAN_supply_the_red_army:0 "Оказывать помощь Красной армии"
 CAN_supply_the_red_army_desc:0 "Поскольку Советский Союз воюет с врагами народа, Канада должна взяться за обеспечение Москвы оружием и припасами."
 CAN_canada_united:1 "Единая Канада"
 CAN_canada_united_desc:0 "Несмотря на то, что наше население разбросано тонкой линией по всему континенту, мы объединились в этом мировом кризисе, чтобы отстоять канадские ценности и защитить слабых."
 CAN_join_comintern:0 "Присоединиться к Коминтерну"
 CAN_join_comintern_desc:0 "Советский Союз доказал свою добросовестность и силу. Канада должна присоединиться к советскому альянсу."
 CAN_support_the_world_revolution:0 "Поддерживать мировую революцию"
 CAN_support_the_world_revolution_desc:0 "Вы слышите, как люди поют? Это «Интернационал»! Канада будет стремиться освободить пролетариат от оков."
 CAN_rcaf_station_borden:0 "Авиабаза RCAF в Бордене"
 CAN_rcaf_station_borden_desc:0 "Воздушный корпус Канады был рожден в Бордене, Онтарио, и эта база должна использоваться для обучения нового поколения пилотов."
 CAN_we_have_the_hurricane:0 "У нас есть «Харрикейн»"
 CAN_we_have_the_hurricane_desc:0 "Великобритания разрешила нам запустить производство истребителей Hurricane. Эти самолеты станут основой наших воздушных сил."
 CAN_the_pacific_coast_air_defence_radar_system:0 "Радарная система ПВО тихоокеанского побережья"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "Берега Британской Колумбии скалистые и малонаселенные, за исключением юга. Нам придется полагаться на системы раннего предупреждения, такие как сеть радиолокационных станций, чтобы обнаруживать все необычное, приближающееся через Тихий океан."
 CAN_commonwealth_air_training_plan:0 "Проект по подготовке летного состава Содружества"
 CAN_commonwealth_air_training_plan_desc:0 "Подготовка к воздушным боям будет проходить совместно с нашими союзниками из Содружества и Доминиона. Это более эффективно, и это можно сделать массово и безопасно на наших аэродромах."
 CAN_fund_fairchilds_development:0 "Инвестировать в развитие Fairchild"
 CAN_fund_fairchilds_development_desc:0 "Завод Fairchild в Квебеке должен получить необходимые ресурсы для увеличения производства деталей бомбардировщиков. Мы должны будем увеличить занятость на заводе на тысячи человек."
 CAN_cookie_carriers:0 "Корабли-печенья"
 CAN_cookie_carriers_desc:0 "Для ведения стратегической воздушной войны нужны тяжелые бомбардировщики, которые будут сбрасывать вкусные лакомства на головы нашим врагам."
 CAN_the_sabre_project:0 "Проект Sabre"
 CAN_the_sabre_project_desc:0 "Реактивные самолеты будут доминировать в небесах будущего, поэтому нам следует инвестировать в производство собственных вариантов иностранных реактивных самолетов.
 CAN_halifax_shipyards:0 "Верфи Галифакса"
 CAN_halifax_shipyards_desc:0 "Расположенные прямо напротив Европы, доки Галифакса занимаются строительством новых судов рекордными темпами. Мы можем победить в битве за Атлантику."
 CAN_destroyer_effort:0 "Производство эсминцев"
 CAN_destroyer_effort_desc:0 "Угроза подлодок нашим конвоям с подкреплениями и поставками требует от нас сосредоточиться на строительстве эсминцев, чтобы охотиться и уничтожать эти подводные угрозы."
 CAN_light_cruiser_effort:0 "Производство легких крейсеров"
 CAN_light_cruiser_effort_desc:0 "Мы в любом случае не сможем строить много больших кораблей, но небольшие крейсеры, выпускаемые массово, тоже могут нанести удар."
 CAN_heavy_cruiser_effort:0 "Производство тяжелых крейсеров"
 CAN_heavy_cruiser_effort_desc:0 "Мы можем строить наши флоты вокруг тяжелых крейсеров и иметь достаточное количество портов, чтобы сделать эту стратегию жизнеспособной."
 CAN_escort_fleet:0 "Флот эскорта"
 CAN_escort_fleet_desc:0 "Океаны отделяют нас от большинства мировых потрясений, поэтому, чтобы наши армии могли сражаться и получать подкрепления, нам необходимо сделать эскортные соединения и противолодочную оборону приоритетом."
 CAN_fleet_in_being:0 "Флот в готовности"
 CAN_fleet_in_being_desc:0 "Строя большие военно-морские силы, их существование само по себе может быть угрозой для наших врагов, даже если мы никогда не используем их. Одна мысль о том, что наши корабли выйдут в море и нападут на их морские пути, заставляет их проявлять осторожность."
 CAN_degauss_ship_hulls:0 "Размагничивание корпусов судов"
 CAN_degauss_ship_hulls_desc:0 "Мы начнем размагничивать корпуса наших кораблей, снижая их магнитную сигнатуру. Это защищает их от магнитных мин и уменьшает электронный профиль кораблей."
 CAN_trade_fleet:0 "Торговый флот"
 CAN_trade_fleet_desc:0 "Канада - торговая страна. Стройте больше грузовых и конвойных судов."
 CAN_united_shipyards:1 "Объединенные судостроительные заводы"
 CAN_united_shipyards_desc:0 "Монреальский док Объединенных судостроительных заводов стал основным источником для наших десантных и грузовых судов."
 CAN_mend_relations_with_the_trotskyites:0 "Наладить отношения с троцкистами"
 CAN_mend_relations_with_the_trotskyites_desc:0 "Старые расколы в партии слишком долго разделяли наш народ. Пришло время принять этих некогда доверенных изгнанников и возродить нашу цель как единственный истинный маяк народной воли."
 CAN_trotsky_loves_us:0 "Братья по оружию"
 CAN_stalin_and_friends_hate_us_now:0 "Подозрения в диссидентстве"
 CAN_reject_authoritarianism:0 "Интроспективный коммунизм"
 CAN_reject_authoritarianism_desc:0 "По мере того, как вокруг нас растут конфликты и разногласия, становится очевидным, что наши уникальные географические и общественные обстоятельства отдаляют нас от более широких социалистических движений и атрибутов слухов об авторитаризме, которые их сопровождают. Народное движение должно начаться снова - с нас."
 CAN_reactivate_farmers_unity_league:0 "Восстановить Лигу единства фермеров"
 CAN_reactivate_farmers_unity_league_desc:0 "Лига Единства проводила важную работу, предшествовавшую нашей славной революции. Сейчас, когда мы отчаянно нуждаемся, мы должны призвать этих верных сторонников, проживающих в сельской местности, чтобы поддержать государство любым возможным способом."
 CAN_liberate_the_workers_of_the_world:0 "Дух подлинной революции"
 CAN_liberate_the_workers_of_the_world_desc:0 "Настолько крепка наша уверенность в построенной нами утопии, что наши юноши и девушки стекаются к нашим знаменам, так, чтобы наши притесняемые товарищи на чужбине — те, что страдают под гнетом деспотичных режимов — смогли вкусить нашу канадскую свободу."
 CAN_canadian_citizenship_act:0 "Акт о гражданстве Канады"
 CAN_canadian_citizenship_act_desc:0 "На данный момент определение того, кто является, а кто нет гражданином Канады, основано на британских законах, и канадский гражданин ничем не отличается от подданного Великобритании. Мы должны гарантировать, что граждане Канады перестанут считаться всего лишь подклассом подданных Великобритании."
 CAN_newfoundland_act:0 "Акт о Ньюфаундленде"
 CAN_newfoundland_act_desc:0 "Регионы Ньюфаундленда и Лабрадора культурно и географически близки к нам, однако продолжают находиться под властью Великобритании. Самое время предложить объединиться с этими территориями и помочь управлять ими."
 CAN_dominion_rifle_association:0 "Ассоциация стрелков Доминиона Канады"
 CAN_dominion_rifle_association_desc:0 "Стрелковая ассоциация доминиона Канады была основана в 1868 году и включена в действие парламента в 1900 году. Мы должны поддержать расширение этой организации, чтобы больше канадцев могли научиться обращаться с огнестрельным оружием."
 SAF_support_axis_interests_effect_tt:0 "Стройте §Yинфраструктуру§! и добавляйте §Yслоты для строительства§! в оккупированных странах, расположенных в южной и средней частях Африки.\n"
 SAF_a_king_for_our_people_trigger_tt:0 "Король Эдуард был изгнан"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "Ветви взаимно исключают друг друга."
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Взаимно исключает с"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "В настоящее время этот фокус не оказывает никакого эффекта. Изменения в мировой ситуации могут повлиять на это."
 SAF_war_measures_act:0 "Акт о военных мерах"
 SAF_war_measures_act_desc:0 "Мы не можем допустить каких-либо сбоев в военных усилиях, поэтому мы принимаем новое законодательство для обеспечения полного соответствия целям правительства. Это защитит поток ресурсов и позволит нам сосредоточить политическую энергию там, где это необходимо."
 SAF_emergency_workers:0 "Служба экстренной помощи"
 SAF_emergency_workers_desc:0 "Пришло время мобилизовать больше южноафриканцев для военных действий. Женщин также можно вводить на заводы по более низкой цене."
 SAF_csir:0 "НИИЮАР"
 SAF_csir_desc:0 "ЮАР отстает от других доминионов в науке и технологиях, поэтому создание Совета по научным и промышленным исследованиям в Претории стало для правительства насущной проблемой."
 SAF_cape_garrison_artillery:0 "Гарнизонная артиллерия в Кейптауне"
 SAF_cape_garrison_artillery_desc:0 "Кейптаун остается важным морским путем для многих стран и является воротами в центр ЮАР. Расширение береговой обороны и артиллерии гарнизона должно быть на первом месте в нашем списке дел."
 SAF_reconstitute_the_cape_corps:0 "Восстановление Кейпского корпуса"
 SAF_reconstitute_the_cape_corps_desc:0 "Исторически нам удавалось привлечь на службу часть цветного населения для защиты Южной Африки. Это непопулярно среди всех жителей страны, но это освободит белых южноафриканцев для службы за границей."
 SAF_expand_the_cape_corps:0 "Расширение Кейпского корпуса"
 SAF_expand_the_cape_corps_desc:0 "Хотя мы и восстановили Кейпский корпус в качестве преимущественно небоевого формирования, угроза вторжения означает, что мы должны предоставить корпусу больше ресурсов, обучение и доступ к оружию."
 SAF_work_for_all_poor:0 "Работа для всех бедных"
 SAF_work_for_all_poor_desc:0 "За последние несколько лет бедные сельские африканеры хлынули в города в поисках работы, и мы мало что сделали, чтобы им помочь. До сих пор. Индустриализация и защита правительством их доступа к работе помогут этому населению."
 SAF_outlaw_strikes:0 "Запретить забастовки"
 SAF_outlaw_strikes_desc:0 "Времена кризиса не время забастовок и перебоев в работе. Забастовки объявляются незаконными, а правительство заставит народ работать."
 SAF_support_the_policy_of_appeasement:0 "Поддержите политику умиротворения"
 SAF_support_the_policy_of_appeasement_desc:0 "Германия имеет законные требования, а Доминионы сильно пострадали в последней войне. Мы должны использовать любую возможность для сохранения мира в наше время."
 SAF_police_windhoek:0 "Полиция Виндхука"
 SAF_police_windhoek_desc:0 "Мы имеем мандат на управление бывшей германской колонией Юго-Западная Африка с тех пор, как закончилась последняя война. Мы обязаны выполнить свой долг по защите и развитию главного города Виндхука."
 SAF_joint_air_training_scheme:0 "Программа совместного летного обучения"
 SAF_joint_air_training_scheme_desc:0 "Страны Содружества объединяют свои ресурсы и опыт, чтобы облегчить и ускорить подготовку пилотов и летного экипажа."
 SAF_desert_equipment:0 "Оборудование для пустыни"
 SAF_desert_equipment_desc:0 "Война в Северной Африке требует специального оборудования, и поскольку наши войска могут быть вызваны на службу на этом фронте, обеспечение и поставка этого оборудования станет важным вопросом логистики."
 SAF_suppress_the_stormjaers:0 "Подавить шторм"
 SAF_suppress_the_stormjaers_desc:0 "Профашистское прогерманское движение Оссевабрандваг (OB) имеет военизированное крыло, созданное по образцу аналогичных европейских групп. Они срывают попытки правительства привлечь войска и проводить надёжную и объединенную военную политику. Штормьягеров необходимо разбить."
 SAF_secure_interests_in_africa:0 "Обеспечить интересы в Африке"
 SAF_secure_interests_in_africa_desc:0 "Союз Южной Африки граничит с рядом британских колоний, которые могут быть переданы под наше управление. Мы также должны сделать все возможное, чтобы навсегда закрепить за собой мандат на Юго-Западную Африку."
 SAF_native_laws_amendment_act:0 "Акт о внесении поправок в законодательство в отношении коренного населения"
 SAF_native_laws_amendment_act_desc:0 "Чтобы ещё больше гарантировать трудоустройство африканерскому населению, мы должны ограничить поселение чернокожих южноафриканцев в городах. Только те, у кого есть долгая история в муниципалитете, будут иметь право на жительство."
 SAF_encourage_segregation:0 "Поддержка сегрегации"
 SAF_encourage_segregation_desc:0 "Мы должны прилагать больше усилий, чтобы законодательно разделить наши различные этнические группы для укрепления власти и единства нашего правящего класса."
 SAF_abandon_westminster:0 "Отказ от Вестминстера"
 SAF_abandon_westminster_desc:0 "Замена маршрута через мыс Суэцким каналом, а также формирующий опыт англо-бурской войны способствовали созданию южноафриканской идентичности, отличной от наших союзников-доминионов. Мы должны дистанцироваться от короля и проложить собственный путь."
 SAF_support_the_afrikaner_broederbond:0 "Поддержать Африканер Брудербонд"
 SAF_support_the_afrikaner_broederbond_desc:0 "Африканер Брудербонд выступал за усиление роли африканеров и за более сильную сегрегацию рас. Британская политика во времена Бурских войн еще свежа в памяти, а Брудербонд может помочь создать новую Южную Африку."
 SAF_support_ossewabrandwag:0 "Поддержать Оссевабрандваг"
 SAF_support_ossewabrandwag_desc:0 "Фашистская военизированная организация Оссевабрандваг должна использоваться как оплот против иностранного влияния и внутренних восстаний, направленных против правящего класса."
 SAF_celebrate_the_great_trek:0 "Отпраздновать Великий трек"
 SAF_celebrate_the_great_trek_desc:0 "Столетие назад наши предки-африканеры отделились от крепнувшей британской колониальной власти и создали собственное государство бур в северо-восточной части страны. Их стойкий дух и сейчас является воплощением наилучших южноафриканских добродетелей."
 SAF_voortrekker_monument:0 "Памятник фуртреккерам"
 SAF_voortrekker_monument_desc:0 "Памятник фуртреккерам, предпринявшим Великий трек, укрепит национальный дух и единство в это смутное время."
 SAF_support_nazification_of_south_west_africa:0 "Поддержать нацификацию Юго-Западной Африки"
 SAF_support_nazification_of_south_west_africa_desc:0 "Как бывшая немецкая колония, мы должны приветствовать развитие немецких политических идей в Юго-Западной Африке."
 SAF_south_africa_first:0 "Южная Африка прежде всего"
 SAF_south_africa_first_desc:0 "Южная Африка - самая сильная независимая страна на континенте, и поэтому может быть путеводной звездой для будущего Африки и бывших колоний."
 SAF_support_the_german_coup:0 "Поддержите германский переворот"
 SAF_support_the_german_coup_desc:0 "Германское правительство уже давно рассматривает Южную Африку как плодородную почву для усиления своего влияния, начиная с прошлого века. Наше будущее связано с Рейхом, а не с Империей, поэтому давайте двигаться вперед с планом по свержению нынешнего правительства."
 SAF_reclaim_boer_colonies:0 "Вернуть бу́рские колонии"
 SAF_reclaim_boer_colonies_desc:0 "Бывшая территория буров Трансвааль и другие регионы по праву принадлежат свободным наследникам этого предприимчивого народа."
 SAF_commemorate_the_battle_of_blood_river:0 "Отметить битву у Кровавой реки"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "В 1838 году вагенлагерь бурских поселенцев сдерживал десятки тысяч воинов зулусов, нанеся сокрушительный удар по могуществу зулусов в Натале. Это, несомненно, было божественным знаком правоты нашего дела."
 SAF_german_scientists:0 "Немецкие ученые"
 SAF_german_scientists_desc:0 "Немецкие ученые - одни из лучших в мире и им есть чем поделиться с нами."
 SAF_support_axis_interests:0 "Поддержать интересы оси"
 SAF_support_axis_interests_desc:0 "Страны Оси обладают энергией и идеологией, которые могут помочь Южной Африке занять свое место в мире. Мы должны оказать им полную дипломатическую поддержку.
 SAF_a_king_for_our_people:0 "Король для нашего народа"
 SAF_a_king_for_our_people_desc:0 "Южной Африке нужен король, и, к счастью, есть Виндзор, которого сейчас никто не использует. Бывший Эдуард VIII, герцог Виндзорский, может восседать на нашем троне."
 SAF_empower_the_workers:0 "Предоставление полномочий рабочим"
 SAF_empower_the_workers_desc:0 "Мы страна шахтеров и фермеров. Трудящиеся Южной Африки - единственно истинные представители народной воли."
 SAF_support_spain:0 "Поддержка Испании"
 SAF_support_spain_desc:0 "Фашизм набирает силу в Европе, и мы можем остановить его в Испании - или, по крайней мере, замедлить его распространение. Следует направить людей и материальные средства на поддержку республиканской идеи."
 SAF_repeal_the_native_representation_act:0 "Отмена закона о представительстве коренных народов"
 SAF_repeal_the_native_representation_act_desc:0 "Расовая дискриминация противоречит ценностям народной революции в Южной Африке. Черным следует восстановить общие избирательные списки и предоставить политические права."
 SAF_burn_the_kings_portraits:0 "Сжечь портреты короля"
 SAF_burn_the_kings_portraits_desc:0 "Долой королевскую семью! Этот символический жест публично объявит о нашем отходе от иностранного престола."
 SAF_join_comintern:0 "Вступить в Коминтерн"
 SAF_join_comintern_desc:0 "Советский Союз был в авангарде крестового похода за трудящихся и против фашизма. Мы присоединимся к их могущественному союзу."
 SAF_support_the_world_revolution:0 "Поддержка мировой революции"
 SAF_support_the_world_revolution_desc:0 "Единственный способ победить рабочих — объединить весь мир в едином порыве. Революция должна быть всемирной, а значит, её нужно экспортировать."
 SAF_equal_opportunity_employment:0 "Равные возможности трудоустройства"
 SAF_equal_opportunity_employment_desc:0 "Чтобы улучшить жизнь рабочих в нашей стране, нам необходимо начать с того, чтобы обеспечить всем рабочим равное обращение, независимо от цвета кожи."
 SAF_demand_madagascar:0 "Запросить Мадагаскар"
 SAF_demand_madagascar_desc:1 "В свете драматических изменений в ситуации в Европе пришло время переоценить всю систему колониализма. Почему Мадагаскар должен быть привязан к рухнувшей империи?"
 SAF_invite_soviet_advisers:0 "Пригласить советских советников"
 SAF_invite_soviet_advisers_desc:4 "Чтобы поддержать Советский Союз в его борьбе за освобождение трудящихся мира, нам нужно повысить уровень своей армии, обучаясь у них."
 SAF_south_african_soviet_research_treaty:0 "Исследовательский договор с СССР"
 SAF_south_african_soviet_research_treaty_desc:1 "Изучив много ценных уроков от наших советских друзей, настало время углубить отношения и подписать официальный договор."
 SAF_anti_colonialist_crusade:0 "Антиколониальный крестовый поход"
 SAF_anti_colonialist_crusade_desc:1 "Колониализм сидит в самом сердце империалистической системы, которая угнетает трудящихся мира. Мы находимся в уникальном положении, чтобы разбить эту систему и освободить африканский народ от столетий эксплуатации, которые им пришлось вынести."
 SAF_Union_of_the_African_People:0 "Союз африканских народов"
 SAF_Union_of_the_African_People_desc:1 "Долгое время африканский народ не имел права голоса в определении собственной судьбы. Эти дни закончились. Мы создадим фракцию, достаточно сильную, чтобы противостоять любой попытке реваншистских сил мира отменить наши достижения. Африка будет свободна от колониализма."
 SAF_liberate_portugese:0 "Освободить португальские колонии"
 SAF_liberate_portugese_desc:1 "Колонии Ангола и Мозамбик расположены прямо на наших границах. Пора положить конец эксплуатации их народов."
 SAF_liberate_british:0 "Освободить британские колонии"
 SAF_liberate_british_desc:1 "Британская империя - самый печально известный пример колониализма в истории. Мы покончим с этим."
 SAF_liberate_belgian:0 "Освободить бельгийские колонии"
 SAF_liberate_belgian_desc:1 "Бельгийское Конго широко известно как одна из самых жестоких историй эксплуатации и угнетения. Мы напишем последнюю главу этой истории."
 SAF_south_african_railways:0 "Южноафриканская железная дорога"
 SAF_south_african_railways_desc:0 "Южноафриканскую железнодорожную компанию необходимо расширить. В ней можно обучать группы молодёжи, давая им необходимые навыки для работы в стране и за рубежом."
 SAF_expand_the_mining_industry:0 "Развитие горнодобывающей промышленности"
 SAF_expand_the_mining_industry_desc:0 "Богатство недр Южной Африки просто легендарно, и мы только начали задействовать её большие запасы золота, хрома и платины."
 SAF_heavy_engineering:0 "Тяжёлое машиностроение"
 SAF_heavy_engineering_desc:0 "Южной Африке очень важно оставаться в курсе новейших инженерных технологий. Несмотря на небольшую промышленную базу, мы должны инвестировать в тяжёлое машиностроение и инженерное дело, чтобы быстро догнать соседей."
 SAF_infrastructure_effort:0 "Усиление инфраструктуры"
 SAF_infrastructure_effort_desc:0 "Большая часть Южной Африки остаётся сельской и неразвитой. Увеличение количества дорог и железных дорог может привезти природные богатства страны в её голодные порты."
 SAF_armament_effort:0 "Развитие промышленности вооружений"
 SAF_armament_effort_desc:0 "Южная Африка защищена от вторжения любой иностранной державы, но в то же время находится вдали от своих союзников. Очень важно, чтобы она развивала свою собственную оружейную промышленность, чтобы Союз никогда не был беззащитным."
 SAF_south_african_steel:0 "Южноафриканская сталь"
 SAF_south_african_steel_desc:0 "У нас есть уголь и железо. Теперь у нас есть причина. Расширение сталелитейного завода Iscor в Претории обеспечит страну тяжёлыми стальными листами, необходимыми для современного вооружения."
 SAF_pretoria_arms:0 "Завод в Претории"
 SAF_pretoria_arms_desc:0 "Преторский завод, который раньше выпускал сталь для тяжелых плит, переориентируется на производство вооружения. Приобретение станков позволит наладить в цехах завода сборку огнестрельного оружия."
 SAF_expand_the_rand_mines:0 "Расширение добычи в шахтах Рэнд"
 SAF_expand_the_rand_mines_desc:0 "Рудники Рэнд — одни из самых глубоких золотых шахт в мире, а значит, наши возможности сейчас гораздо шире, даже с технологиями XIX века. Копаем глубоко и алчно, насколько это возможно."
 SAF_fund_the_university_of_south_africa:0 "Финансирование Университета Южной Африки"
 SAF_fund_the_university_of_south_africa_desc:0 "Преторский университет Южной Африки — один из лучших университетов континента и даже южного полушария. Инвестиции в него позволят нам развивать местные таланты вместо того, чтобы отправлять молодежь за границу."
 SAF_establish_the_atomics_energy_board:0 "Создание Национального управления по атомной энергии"
 SAF_establish_the_atomics_energy_board_desc:0 "Ядерное оружие — величайший военный прорыв со времен изобретения пороха, не говоря уже о мирном использовании этой энергии, если мы сможем обуздать атом. Соберем лучших ученых и поручим им заниматься этими исследованиями."
 SAF_the_cape_defense_institute:0 "Кейпский институт обороны"
 SAF_the_cape_defense_institute_desc:0 "Теперь, когда Южная Африка полностью является суверенной нацией, мы больше не получаем доступ к передовым прототипам и чертежам, как это было раньше. Мы должны сделать так, чтобы всегда оставаться на шаг впереди наших врагов и не отставать от технологий."
 SAF_defense_collaboration_initiative:0 "Инициатива по сотрудничеству в области обороны"
 SAF_defense_collaboration_initiative_desc:0 "Британцы показали нам преимущество обмена научными достижениями между близкими союзниками. Вся наша фракция сможет проводить военные исследования и разработки более эффективно, если мы предпримем необходимые шаги для координации этого."
 SAF_special_service_battalion:0 "Специальный сервисный батальон"
 SAF_special_service_battalion_desc:0 "Южная Африка полна молодых, безработных мужчин, которым нужно найти что-то полезное. Специальный сервисный батальон привьет столь необходимую дисциплину и порядок."
 SAF_improve_the_three_oh_three:0 "Улучшение Три О Три"
 SAF_improve_the_three_oh_three_desc:0 "Южноафриканские войска будут сражаться в разных климатических условиях, и нам повезло, что винтовку Ли-Энфилд легко модифицировать. Патрон калибра 303 был изменен несколько раз другими странами в соответствии с их потребностями."
 SAF_q_services_corps:0 "Корпус тыловых служб"
 SAF_q_services_corps_desc:0 "Корпус тыловых служб будет центральным органом, ответственным за материально-техническое обеспечение и снабжение постоянной армии. Он будет заниматься распределением нефти, продовольствия, боеприпасов и униформы.
 SAF__south_african_military_college:0 "Южно-африканский военный колледж"
 SAF__south_african_military_college_desc:0 "Южная Африка должна иметь военную академию, смоделированную по образцу Вест-Пойнта в Соединенных Штатах. Это даст нам профессиональный офицерский корпус, лояльный к Союзу."
 SAF_expand_the_south_african_artillery:0 "Расширение южно-африканской артиллерии"
 SAF_expand_the_south_african_artillery_desc:0 "Корпус артиллерии был объединен в 1934 году. Теперь пришло время увеличить его размер и возможности."
 SAF_sa_engineer_corps:0 "Инженерный корпус ЮАР"
 SAF_sa_engineer_corps_desc:0 "В инженерном корпусе Южной Африки едва ли 600 человек в форме. Это неприемлемо в современной армии. Нам нужно больше людей и больше подготовки для выполнения этой важнейшей задачи."
 SAF_equipment_effort:0 "Усиление материальной части"
 SAF_equipment_effort_desc:0 "Мы не можем пренебрегать поставками вспомогательного оборудования, необходимого для нашей армии. Пушки и танки - это хорошо, но нам нужны униформа, радиостанции, ремонтные комплекты и многое другое."
 SAF_south_african_special_forces:0 "Южно-африканские силы специального назначения"
 SAF_south_african_special_forces_desc:0 "Южной Африке нужна домашняя группа коммандос, чтобы справляться с этими сложными задачами в труднодоступных местах."
 SAF_mechanization_effort:0 "Механизация"
 SAF_mechanization_effort_desc:0 "Война с применением моторизированной техники и машин наступила. Большой поход будущего будет осуществляться на гусеничных и колесных машинах."
 SAF_armor_effort:0 "Бронирование"
 SAF_armor_effort_desc:0 "Танки прошли долгий путь со времен неповоротливых чудовищ прошлой войны. Наши исследования и обучение не должны отставать от наших врагов или наших друзей."
 SAF_commit_to_the_five_year_plan:0 "Поддержать пятилетний план"
 SAF_commit_to_the_five_year_plan_desc:0 "Мы разработали пятилетний план по модернизации и расширению южноафриканских ВВС. Правительство должно публично взять на себя обязательство не отставать от этого графика."
 SAF_improve_the_hawker_hartbees:0 "Улучшить Hawker Hartbees"
 SAF_improve_the_hawker_hartbees_desc:0 "Hawker Hartbees, которыми мы располагаем, не являются самыми совершенными истребителями в мире, но мы будем довольствоваться тем, что есть. Усовершенствованная механика и обучение позволят извлечь максимальную пользу из этих бипланов."
 SAF_replace_the_blenheim:0 "Заменить Blenheim"
 SAF_replace_the_blenheim_desc:0 "Bristol Blenheim был полезным легким бомбардировщиком для Королевских ВВС и для Доминионов. Но, возможно, пришло время найти что-то более прочное с большим радиусом действия."
 SAF_perfect_the_cab_rank_technique:0 "Совершенствовать технику "таксования""
 SAF_perfect_the_cab_rank_technique_desc:0 "Техника "таксования" предполагает, что серия бомбардировщиков поражает цель по очереди, длинной очередью. Это поддерживает давление на врага, но требует больших навыков."
 SAF_desert_air_force:0 "Военно-воздушные силы пустыни"
 SAF_desert_air_force_desc:0 "Небо пустыни чистое, а жара и песок требуют особого внимания к механике наших самолетов. В этой неприветливой среде есть ценные навыки, которые можно освоить."
 SAF_secure_the_cape_sea_route:0 "Обеспечить безопасность морского пути вокруг мыса"
 SAF_secure_the_cape_sea_route_desc:0 "Если Суэц падет, Кейптаун снова станет воротами на Восток. Защищайте его любой ценой."
 SAF_retain_experienced_pilots:0 "Удерживать опытных пилотов"
 SAF_retain_experienced_pilots_desc:0 "Слишком часто наши опытные пилоты переходят в королевские ВВС вместо того, чтобы оставаться в наших собственных войсках. В королевских ВВС больше возможностей для продвижения и ведения боевых действий. Но мы должны стремиться удерживать наших обученных пилотов поблизости, где они могут вдохновлять и обучать других южноафриканцев."
 SAF_seaward_defence_force:0 "Военно-морские силы"
 SAF_seaward_defence_force_desc:0 "Военно-морские силы служили нашим флотом в течение двух десятилетий. Их финансирование следует увеличить."
 SAF_protect_the_trade:0 "Защитить торговлю"
 SAF_protect_the_trade_desc:0 "Последняя война показала важность конвоев и эскортов. Южная Африка лежит на важном торговом пути и должна убедиться, что товары доходят до места назначения."
 SAF_disrupt_the_trade:0 "Нарушить торговлю"
 SAF_disrupt_the_trade_desc:0 "Последняя война показала важность конвоев и эскортов. Южная Африка лежит на важном торговом пути и идеально расположена для перехвата и уничтожения вражеских грузов."
 SAF_expand_the_simons_town_base:0 "Расширение базы Саймонстаун"
 SAF_expand_the_simons_town_base_desc:0 "Саймонстаун на мысе Доброй Надежды стал важнейшей военно-морской базой в Южной Африке с 1790-х годов. Базу следует переоборудовать и расширить, чтобы вместить больше крупных судов."
 SAF_anti_submarine_tactics:0 "Противолодочная тактика"
 SAF_anti_submarine_tactics_desc:0 "Подводные лодки угрожают судам, проходящим через мыс Доброй Надежды. Мы должны их найти и уничтожить."
 SAF_submarine_warfare:0 "Подводная война"
 SAF_submarine_warfare_desc:0 "Неприятельские торговые конвои по-прежнему проходят через мыс Доброй Надежды. Мы будем наносить им удары снизу."
 SAF_prepare_overseas_offensive:0 "Подготовка заморского наступления"
 SAF_prepare_overseas_offensive_desc:0 "Имея тысячи километров береговой линии, Южная Африка может обучать своих солдат ведению десантной войны. Это один из самых сложных навыков, но наши ребята с ним справятся."
 SAF_strengthen_the_cape_garrison_artillery:0 "Укрепление артиллерии гарнизона Кейптауна"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "Гарнизонные орудия Кейптауна должны быть модернизированы и увеличены для защиты мыса от вражеской атаки."
 SAF_civil_war_tt:1 "§RВспыхнет гражданская война§! между §Yфашистскими националистами§! в Юго-Западной Африке и §Yдемократическими унионистами§! в остальной части страны."
 SAF_german_research_tt:0 "Мы заключим соглашение об обмене технологиями с Германией."
 scw_in_progress_tt:0 "В Испании идет гражданская война."
 NZL_transfer_the_new_zealand_division:0 "Перевод дивизии Новой Зеландии"
 NZL_transfer_the_new_zealand_division_desc:0 "2-я дивизия Новой Зеландии была приведена в боевую готовность, так что мы должны направить ее туда, где идут бои. Дивизия НЗ Великой войны была приписана к Средиземному морю, так же поступит и новая дивизия."
 NZL_form_the_rnzn:0 "Основать Королевский флот Новой Зеландии"
 NZL_form_the_rnzn_desc:0 "Наш когда-то небольшой береговой патруль теперь вырос и включил в себя корабли, которые могут действовать независимо от присмотра Королевского флота. У Новой Зеландии будет свой собственный флот."
 NZL_expand_devonport_naval_base:0 "Расширить военно-морскую базу Девонпорт"
 NZL_expand_devonport_naval_base_desc:0 "Военно-морская база Девонпорт станет штаб-квартирой нашего флота, но она должна быть расширена, чтобы удовлетворить новые требования к тотальной войне."
 NZL_coastal_defense:0 "Береговая оборона"
 NZL_coastal_defense_desc:0 "Новая Зеландия - островное государство, удаленное от врагов, поэтому мы должны быть готовы к высадке десанта вдоль наших береговых линий."
 NZL_destroyer_effort:0 "Усилие по созданию эсминцев"
 NZL_destroyer_effort_desc:0 "С нашей небольшой промышленной базой эсминцы являются наиболее эффективным способом проецирования морской мощи Новой Зеландии. Патрулирование берегов, перехват подводных лодок и установка предупредительных пикетов."
 NZL_submarine_effort:0 "Усилия по созданию подлодок"
 NZL_submarine_effort_desc:0 "Поскольку любое вторжение придется осуществить по морю, волки океана могут быть прочной линией обороны. Незаметные и охотящиеся стаями, флот подводных лодок может защищать наши морские пути."
 NZL_light_cruiser_effort:0 "Развитие лёгких крейсеров"
 NZL_light_cruiser_effort_desc:0 "Корабли среднего размера подходят державам среднего размера. Лёгкие крейсера обладают значительной огневой мощью, но также и достаточной скоростью, чтобы при необходимости уйти от крупных столкновений."
 NZL_capital_ship_effort:0 "Развитие главных кораблей"
 NZL_capital_ship_effort_desc:0 "Если Новая Зеландия собирается стать первоклассной морской державой, ей нужны первоклассные корабли. Необходимо вкладывать средства в линкоры и тяжёлые крейсера."
 NZL_expand_the_nzpaf:0 "Расширение NZPAF"
 NZL_expand_the_nzpaf_desc:0 "Новозеландским постоянным военно-воздушным силам нужны новые суда береговой охраны и палубные бомбардировщики. Современные государства не могут игнорировать воздушную войну."
 NZL_form_the_rnzaf:0 "Формирование RNZAF"
 NZL_form_the_rnzaf_desc:0 "Пришло время сделать военно-воздушные силы независимыми от других родов войск. Королевские военно-воздушные силы Новой Зеландии получат свою собственную командную структуру, но будут тесно сотрудничать с Королевскими военно-воздушными силами."
 NZL_fighter_focus:0 "Истребительный уклон"
 NZL_fighter_focus_desc:0 "Истребители эффективны при перехвате и сопровождении бомбардировщиков, которые станут решающим оружием наших союзников."
 NZL_bomber_focus:0 "Бомбардировочный уклон"
 NZL_bomber_focus_desc:0 "Лёгкие бомбардировщики могут эффективно защищать наши береговые линии и понадобятся в борьбе с нашими врагами за рубежом."
 NZL_defend_our_islands:0 "Защита наших островов"
 NZL_defend_our_islands_desc:0 "Мы должны быть готовы к нападению на наш островной рай со стороны моря. Морские бомбардировщики могут перехватывать и атаковать десантные корабли или даже нацеливаться на главные корабли."
 NZL_modern_fighters:0 "Современные истребители"
 NZL_modern_fighters_desc:0 "Пришло время усовершенствовать наши конструкции истребителей, перейдя на более быстрые и дальнобойные машины. Наши союзники проложили путь, создав одни из самых передовых самолетов в мире."
 NZL_heavy_bombers:0 "Тяжелые бомбардировщики"
 NZL_heavy_bombers_desc:0 "Войну можно выиграть, только ударив в самое сердце вражеской страны. Тяжелые бомбардировщики необходимы, чтобы нанести сокрушительный удар по фабрикам и городам противника."
 NZL_national_roads_board:0 "Управление по национальным дорогам"
 NZL_national_roads_board_desc:0 "Неровный рельеф Новой Зеландии не способствует созданию единой системы строительства дорог, но мы должны совершенствовать то, что у нас есть. Следует разработать систему автомагистралей, заасфальтировать дороги и проложить новые пути через горы."
 NZL_new_zealand_steel:0 "Нью-Зиландская сталь"
 NZL_new_zealand_steel_desc:0 "Новую Зеландию щедро одарили обильными запасами железного песка, особенно на Северном острове. Для извлечения руды из этого песка требуется специальная технология, но она может на долгие годы стать краеугольным камнем нашей сталелитейной промышленности."
 NZL_taranaki_oil:0 "Нефть Таранаки"
 NZL_taranaki_oil_desc:0 "Регион Таранаки на Северном острове богат полезными ископаемыми и нефтью. Предприниматели пытались освоить эти нефтяные запасы, но необходимы дополнительные инвестиции в нефтеперерабатывающие заводы и бурение."
 NZL_wairarapa_sheep_farms:0 "Овцеводческие фермы Вайрарапа"
 NZL_wairarapa_sheep_farms_desc:0 "Шерстяная промышленность Вайрарапа является одним из краеугольных камней новозеландской экономики. По мере выхода из депрессии возрастет спрос на нашу шерсть."
 NZL_bureau_of_industry:0 "Бюро промышленности"
 NZL_bureau_of_industry_desc:0 "Новая Зеландия - аграрное общество с акцентом на животноводство. Бюро промышленности должно поощрять крупные инвестиции в капитальную инфраструктуру и производство."
 NZL_department_of_scientific_and_industrial_research:0 "Департамент науки и промышленности"
 NZL_department_of_scientific_and_industrial_research_desc:0 "Другие нации Британского содружества и доминионы инвестируют в научные и промышленные исследования, поэтому мы должны делать то же самое."
 NZL_industrial_conscription:0 "Трудовая повинность"
 NZL_industrial_conscription_desc:0 "Нет причин для того, чтобы здоровые мужчины не служили в вооруженных силах или не работали в отраслях, связанных с войной. Наши новые законы впрягут всех в колесницу мобилизации и производства."
 NZL_think_big:0 "Мыслить масштабно"
 NZL_think_big_desc:0 "Мы привыкли считать себя меньшим доминионом, чем наши австралийские или канадские союзники. Но Новая Зеландия вполне способна достичь промышленного величия."
 NZL_project_seal:0 "Проект „Тюлень“"
 NZL_project_seal_desc:0 "Проект Seal - это новая инициатива с американцами по разработке оружия, которое может вызывать цунами, чтобы сокрушить наших врагов. Это немного фантастично, но прыгающая бомба, которая была разработана, подает большие надежды."
 NZL_national_defense_institute:0 "Национальный институт обороны"
 NZL_national_defense_institute_desc:0 "Теперь, когда Новая Зеландия является суверенным государством, мы больше не получаем доступ к передовым прототипам и чертежам, как это было раньше. Мы должны гарантировать, что мы всегда опережаем наших врагов и не отстаем в технологиях."
 NZL_expand_the_university_of_auckland:0 "Расширить Университет Окленда"
 NZL_expand_the_university_of_auckland_desc:0 "Университет Окленда - наше самое важное высшее учебное заведение. Расширяя его возможности, мы можем попытаться удержать некоторые из наших лучших умов у нас дома."
 NZL_army_reforms:0 "Реформы армии"
 NZL_army_reforms_desc:0 "Мы должны модернизировать систему обучения и продвижения нашей армии. Таким образом, мы можем быть готовы к любым событиям, которые могут произойти в продолжающемся мировом кризисе."
 NZL_charlton_automatic_rifle:0 "Автоматическая винтовка Чарльтона"
 NZL_charlton_automatic_rifle_desc:0 "Один из наших граждан модифицировал стандартную винтовку Ли Энфилд в полностью автоматическое оружие. Это изобретательность Новой Зеландии в лучшем виде, и мы должны поощрять инновации в этом направлении."
 NZL_bob_semple_tank:0 "Танк Боб Семпл"
 NZL_bob_semple_tank_desc:1 "Почему бы Новой Зеландии не иметь собственный танк? Министерство строительства Темука разрабатывает легкий танк, вооруженный только пулеметами. Даже если мы никогда не выйдем за рамки прототипа, приобретенный нами опыт будет неоценим."
 NZL_domestic_arms_industry:0 "Внутренняя оружейная промышленность"
 NZL_domestic_arms_industry_desc:0 "Мы должны переключить как можно больше предприятий на производство стрелкового оружия. Нам нужны боеприпасы, детали для оружия, вспомогательное оборудование и так далее. Это можно сделать на внутреннем рынке."
 NZL_schofield_tank:0 "Танк Шотфилда"
 NZL_schofield_tank_desc:0 "Если танк Сэмпла не оправдал наших ожиданий, возможно, танк с надлежащей пушкой сделает свое дело. Комбинированная колесно-гусеничная система оригинальна и может привести нас к новым идеям в области проектирования танков."
 NZL_long_range_patrol:0 "Дальний патруль"
 NZL_long_range_patrol_desc:0 "Дальний патруль предназначен для покрытия обширных территорий в Северной Африке. Это разведывательно-диверсионное подразделение будет выполнять специальные миссии в одном из самых суровых климатов в мире."
 NZL_artillery_focus:0 "Артиллерийский фокус"
 NZL_artillery_focus_desc:0 "Артиллерия имеет решающее значение для поддержки любого наступления нашей пехоты. Расширить исследования в области баллистики и крупнокалиберных орудий."
 NZL_big_bob_tank:0 "Танк Большой Боб"
 NZL_big_bob_tank_desc:0 "Поля сражений Европы требуют более тяжелой брони, чтобы противостоять супертанкам наших врагов. Большой Боб будет вкладом Новой Зеландии в эту конструкторскую разработку."
 NZL_research_collaboration:0 "Исследование коллаборации"
 NZL_research_collaboration_desc:0 "Британцы показали нам преимущества совместного научного прогресса между близкими союзниками. Вся наша фракция сможет эффективнее проводить военные НИОКР, если мы предпримем необходимые шаги для координации этого."
 NZL_the_first_labor_government:0 "Первое лейбористское правительство"
 NZL_the_first_labor_government_desc:0 "Первое лейбористское правительство Новой Зеландии имеет возможность реализовать прогрессивную социальную и экономическую повестку дня. Регулирование промышленности, права работников, законы социального обеспечения и правила оплаты труда входят в повестку дня."
 NZL_ratana_alliance:0 "Альянс Ратана"
 NZL_ratana_alliance_desc:0 "Альянс с движением Ратана приведет маори Новой Зеландии в правительство и, надеюсь, начнет залечивать некоторые раны британского завоевания."
 NZL_maori_affairs_act:0 "Закон о делах маори"
 NZL_maori_affairs_act_desc:0 "Большая часть земли, принадлежащей маори, экономически непродуктивна. Если мы сможем консолидировать ее и взять под больший контроль правительства, мы сможем превратить эти бесплодные места в плодородные участки промышленности и торговли."
 NZL_social_security_act:0 "Акт социального обеспечения"
 NZL_social_security_act_desc:0 "О безработных в Новой Зеландии нужно позаботиться, пока экономика не восстановится и не появятся новые рабочие места. Мы начали с рождественского бонуса в 1935 году, но пришло время создать надлежащую социальную защиту для всех граждан."
 NZL_the_manpower_act:0 "Акт о рабочей силе"
 NZL_the_manpower_act_desc:0 "С начала войны маори массово переехали в города. Закон о людских ресурсах позволит нам направить эту энергию на нужды новозеландских фабрик."
 NZL_amend_the_maori_affairs_act:0 "Изменение Закона о делах маори"
 NZL_amend_the_maori_affairs_act_desc:0 "Мы должны внести изменения в Закон о делах маори, чтобы повысить производительность недостаточно используемых земель, но при этом не смещать с места граждан маори без необходимости."
 NZL_waitangi_tribunal:0 "Трибунал Вайтанги"
 NZL_waitangi_tribunal_desc:0 "Британские новозеландцы должны принять во внимание то, что их предки сделали, чтобы вытеснить, нарушить и маргинализировать маори в Новой Зеландии. Кровавые войны, захват земель и игнорирование естественных прав. Признание этого наследия — шаг к исцелению."
 NZL_maori_conscription:0 "Призыв маори"
 NZL_maori_conscription_desc:0 "Храбрость и героизм батальона маори, прикрепленного к экспедиционным силам, — знак того, что мы должны максимально использовать все наше население, призывая на службу даже тех маори, которые против."
 NZL_maori_volunteers:0 "Добровольцы маори"
 NZL_maori_volunteers_desc:0 "Проявляя патриотизм, сотни маори идут в армию Новой Зеландии добровольцами."
 NZL_strengthen_the_commonwealth:0 "Укрепление Содружества"
 NZL_strengthen_the_commonwealth_desc:0 "Нам, как более мелкому Доминиону, важно держаться ближе к нашим друзьям и семье. Мы усилим связи с нашими братьями и сестрами с других британских территорий.
 NZL_statute_of_westminster:0 "Вестминстерский статут"
 NZL_statute_of_westminster_desc:0 "Вестминстерский статут предоставляет нам большую независимость под властью короны, сохраняя нас в пределах Империи."
 NZL_2nzef:0 "2НЗЭФ"
 NZL_2nzef_desc:0 "Несмотря на ужасы последней войны, Новая Зеландия готова снова пойти в бой. В настоящее время организуются 2-е новозеландские экспедиционные силы."
 NZL_arrest_pacifist_leaders:0 "Арестовать пацифистских лидеров"
 NZL_arrest_pacifist_leaders_desc:0 "Сейчас не время для разногласий внутри страны. Каждый должен сосредоточиться на победе в войне, и если это означает задержание всех, кто выступает против войны, то мы это сделаем."
 NZL_technology_sharing_with_britain:0 "Обмен технологиями с Британией"
 NZL_technology_sharing_with_britain_desc:0 "Научно-промышленная база Великобритании намного превышает нашу, но поскольку мы являемся семьей, они готовы поделиться с нами своими знаниями."
 NZL_the_lee_affair:0 "Дело Ли"
 NZL_the_lee_affair_desc:0 "Джон Ли, депутат от Грей Линна, вызвал проблемы в лейбористском блоке. Он выступает за более радикальную повестку дня вместо осторожного пути, по которому мы идем. Необходимо принять меры для подавления его мятежа."
 NZL_empower_the_working_class:0 "Расширение прав рабочего класса"
 NZL_empower_the_working_class_desc:0 "Лейбористская партия отстаивала интересы рабочего класса с момента своего основания, действительно многие из наших лидеров имеют рабочее происхождение. Давайте продвигать более существенную защиту и полномочия для профсоюзов.
 NZL_join_comintern:0 "Присоединиться к Коминтерну"
 NZL_join_comintern_desc:0 "Пришло время присоединиться к нашим братьям-социалистам в альянсе. Через Коминтерн мы достигнем рая для рабочих."
 NZL_technology_sharing_with_soviet_union:0 "Обмен технологиями с Советским Союзом"
 NZL_technology_sharing_with_soviet_union_desc:0 "У Советского Союза есть много ведущих мировых ученых и технологических новаторов. Они достаточно великодушны, чтобы поделиться с нами своими знаниями как с товарищами по оружию."
 NZL_in_the_darkness:0 "Во тьме"
 NZL_in_the_darkness_desc:0 "Демократические системы, за которые борется наша страна, изначально порочны. Истинную силу нельзя продемонстрировать через компромисс."
 NZL_befriend_japan:0 "Подружиться с Японией"
 NZL_befriend_japan_desc:0 "Как страна Тихоокеанского региона, нам выгодно в плане безопасности встать на сторону сильнейшей державы в регионе. Япония и ее могущественные флоты могут защитить нас от мировых опасностей."
 NZL_rule_them_all:0 "Править ими всеми"
 NZL_rule_them_all_desc:0 "Страны антиподов Южной части Тихого океана должны стать одной единой державой. Австралии стоит задуматься о подчинении нашему превосходству."
 NZL_technology_sharing_with_japan:0 "Обмен технологиями с Японией"
 NZL_technology_sharing_with_japan_desc:0 "У Японии есть много ведущих мировых ученых и технологических новаторов. Они достаточно великодушны, чтобы поделиться с нами своими знаниями как с братьями по оружию."
 NZL_constitution_amendment_act:0 "Акт о внесении поправок в конституцию"
 NZL_constitution_amendment_act_desc:0 "Новой Зеландии пора задуматься о том, чтобы отделиться от британского господства. Мы изменим нашу конституцию, чтобы укрепить контроль над нашими делами."
 NZL_independent_new_zealand:0 "Независимая Новая Зеландия"
 NZL_independent_new_zealand_desc:0 "Теперь мы республика! Новая Зеландия ничем не обязана Соединенному Королевству, кроме благодарности, которую любой ребенок должен своей матери за воспитание в безопасности. Но мы должны покинуть безопасное гнездо Содружества и смотреть на мир, исходя из своих собственных интересов."
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap] передает нам §Y2 легких крейсера§!"
 RAJ_provincial_elections:0 "Провинциальные выборы"
 RAJ_provincial_elections_desc:0 "Новый закон о правительстве Индии предписывает выборы в провинциях, устанавливая определенную меру местного самоуправления, ответственного перед народом Индии. Посмотрим, как это повлияет на британское правление."
 RAJ_swaraj:0 "Сварай"
 RAJ_swaraj_desc:0 "Гандиевская концепция самоуправления - Сварай - набирает популярность по всей Индии. Она отстаивает полный разрыв с британскими учреждениями и обычаями, а группы сварай проводят агитацию в индийских школах."
 RAJ_indian_national_congress:0 "Индийский национальный конгресс"
 RAJ_indian_national_congress_desc:0 "Индийский национальный конгресс добился большого успеха на выборах по всему субконтиненту. Он выступает в поддержку независимой Индии или, по крайней мере, за большую автономию в рамках Империи.
 RAJ_quit_india_movement_1:0 "Движение «Покиньте Индию»"
 RAJ_quit_india_movement_1_desc:0 "Кампания Ганди за независимость Индии достигла своего апогея с призывом к британцам покинуть Индию. Невероятно, что Радж может закончиться до окончания войны, но ситуация на местах с каждым днем становится все более напряженной."
 RAJ_quit_india_movement:0 "Движение «Покиньте Индию»"
 RAJ_quit_india_movement_desc:0 "Кампания Ганди за независимость Индии достигла своего апогея с призывом к британцам покинуть Индию. Невероятно, что Радж может закончиться до окончания войны, но ситуация на местах с каждым днем становится все более напряженной."
 RAJ_all_india_forward_bloc:0 "Всеиндийский передовой блок"
 RAJ_all_india_forward_bloc_desc:0 "Всеиндийский передовой блок считает, что отказ британцев от власти в Индии затягивается. Необходимо занять более сильную — даже воинственную — позицию."
 RAJ_seek_help_from_soviet:0 "Просить помощи у Советов"
 RAJ_seek_help_from_soviet_promised:0 "Советский Союз обещал помочь"
 RAJ_seek_help_from_soviet_desc:0 "Советский Союз является естественным противовесом британской империалистической власти. Они заявляют, что являются двигателем революции, и мы должны призвать их экспортировать свою революцию в Индию."
 RAJ_indian_peoples_army:0 "Индийская народная армия"
 RAJ_indian_peoples_army_effect:0 "Сторонники коммунистов начинают гражданскую войну за свободу. §RРазмер зависит от поддержки партии и степени автономии.§!"
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap] поддержит ваше дело"
 RAJ_indian_peoples_army_desc:0 "Нам следует организовать военную силу, которая будет учиться и сотрудничать с коммунистами"
 RAJ_research_city_excursions:0 "Исследование городских экскурсий"
 RAJ_research_city_excursions_desc:0 "Советские исследовательские города - это чудо, а население Индии полно энергичных и умных людей. Отправка наших молодых инженеров в эти города поможет нам развивать отечественные исследования и промышленную базу"
 RAJ_combined_arms_academy:0 "Академия совместных действий"
 RAJ_combined_arms_academy_desc:0 "Советскую военную подготовку можно сделать более эффективной благодаря новой Академии совместных действий. Мы можем использовать современные методы ведения войны, применяя воздушную, сухопутную и морскую мощь"
 RAJ_rani_of_jhans:0 "Рани Джанси"
 RAJ_rani_of_jhans_desc:0 "Рани Джанси была великой героиней индийской революции 1857 года. Ее пример храбрости и национальной гордости является образцом для всех женщин Индии, которые хотят взяться за оружие и сформировать собственный полк"
 RAJ_rebuilding_the_nation:0 "Возрождение нации"
 RAJ_rebuilding_the_nation_desc:0 "С изгнанием империалистического угнетателя и мобилизацией населения Индии настало время восстановить ущерб, нанесенный двумя веками оккупации"
 RAJ_seek_help_from_germany:0 "Обратиться за помощью к Германии"
 RAJ_seek_help_from_germany_promised:0 "Германский Рейх пообещал свою помощь"
 RAJ_seek_help_from_germany_desc:0 "Германия никогда не причиняла нам столько вреда, сколько это делала Британия, и Рейх является наиболее правдоподобным вызовом Британской Империи. Мы должны сблизиться со странами Оси."
 RAJ_indian_national_army:0 "Индийская национальная армия"
 RAJ_indian_national_army_effect:0 "Сторонники фашизма начинают гражданскую войну за свободу. §RРазмер зависит от поддержки партии и прогресса автономии.§!"
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] поддержит их дело."
 RAJ_indian_national_army_desc:0 "Была организована Индийская национальная армия, отличная от сил, подконтрольных Британии. Мы можем создать ее в регионах, свободных от британского вмешательства, и выступить против союзников, истощая живую силу Индии из Раджа."
 RAJ_battaglione_azad_hindoustan:0 "Батальон Азад Хиндустан"
 RAJ_battaglione_azad_hindoustan_desc:0 "Италия сформировала Батальон Азад Хиндустан, полк бывших индийских военнопленных. БАХ, обученный саботажу, десантированию и проникновению, может стать большим шагом к национальной гордости."
 RAJ_german_technology:1 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_german:0 "Немецкая технология"
 RAJ_german_technology_japan:0 "Японская технология"
 RAJ_german_technology_desc:0 "Немецкие ученые - лучшие в мире, а их военная техника основана на современных инженерных методах. Они готовы поделиться с нами своими достижениями."
 RAJ_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_german:0 "Лётная школа Люфтваффе"
 RAJ_japanese_army_air_force_academy_japan:0 "Японская армейская лётная академия"
 RAJ_japanese_army_air_force_academy_desc:0 "Японская армейская лётная академия решила принимать индийских рекрутов, желающих бороться с европейским господством в Азии."
 RAJ_cripps_mission:0 "Миссия Криппса"
 RAJ_cripps_mission_desc:0 "Мы должны сохранить лояльность Индии по отношению к союзникам и британцам, несмотря на рост националистических настроений в пользу независимости. Сэр Стаффорд Криппс — искусный переговорщик, который может заверить лидеров националистов, что их требования будут выполнены."
 RAJ_two_nation_theory:0 "Двунациональная теория"
 RAJ_two_nation_theory_effect:0 "Пакистан будет освобожден, когда Индия получит свободу.\n"
 RAJ_two_nation_theory_desc:0 "Хотя Индия долгое время управлялась как единая территория, имеет смысл рассматривать ее как две нации — одну индуистскую и одну мусульманскую. Раздел страны может быть не единственным ответом, но любая сделка по независимой Индии должна учитывать эту двойственную природу субконтинента."
 RAJ_princely_state_donations:0 "Пожертвования княжеских государств"
 RAJ_princely_state_donations_desc:0 "Княжеские государства Индии предоставили людей, которые долгое время служили ядром индийской армии под властью британцев. Дальнейшие пожертвования этих местных правителей подчеркивают их поддержку империи."
 RAJ_imperial_service_troops:0 "Императорские вспомогательные войска"
 RAJ_imperial_service_troops_desc:0 "Раджи Индии вербуют для императорских служебных войск, численность которых достигает сотен тысяч. В это непростое время Его Величество может рассчитывать на преданность раджей."
 RAJ_raf_funding:0 "Финансирование РАФ"
 RAJ_raf_funding_desc:0 "Королевским военно-воздушным силам Индии будет выделено больше средств и ресурсов Соединенным Королевством."
 RAJ_navy_funding:0 "Финансирование флота"
 RAJ_navy_funding_effect:0 "§Y2 легких крейсера§! будут добавлены в ваш флот, если вы уже обладаете технологией.\n"
 RAJ_navy_funding_effect_mtg:0 "§Y2 легких крейсера§! этого типа будут добавлены в наш флот.\n"
 RAJ_navy_funding_desc:0 "Королевский военно-морской флот Индии получит больше средств и ресурсов от Соединенного Королевства."
 RAJ_british_army_support:0 "Поддержка британской армии"
 RAJ_british_army_support_desc:0 "Британская армия хорошо знает Индию, так как находилась в ней 200 лет. Ее бойцы знакомы с местным населением и территорией и смогут обучать индийских солдат."
 RAJ_red_eagle_division:0 "Отряд Красного орла"
 RAJ_create_unit_red_eagles_tt:0 "Получите элитную пехотную дивизию в Дели.\n"
 RAJ_red_eagle_division_desc:0 "Отряд Красного орла - это первая индийская дивизия, подготовленная для участия в боевых действиях за рубежом и борьбы в суровых условиях."
 RAJ_chindits:0 "Чиндиты"
 RAJ_orde_wingate_tt:0 "Появится §Yгенерал 4 уровня мастерства§! по имени §YОрде Уингейт§!.\n"
 RAJ_chindits_desc:0 "Индии требуется спецназ, и поэтому мы сформировали Чиндитов для ведения боевых действий за вражескими линиями в джунглях Азии. Это рискованная операция с высокими потерями, но она может значительно помочь в военных действиях."
 RAJ_jungle_training:0 "Джунглевая подготовка"
 RAJ_jungle_training_effect:0 "Предоставляет доступ к §HJungle Training§!\n§HМорпехи\n  Джунгли§!\n   Атака: §G+5%§!\n   Перемещение: §G+10%§!\n§HГорцы\n  Джунгли§!\n   Атака: §G+5%§!\n   Перемещение: §G+10%§!\n§HПарашютисты\n  Джунгли§!\n   Атака: §G+5%§!\n   Перемещение: §G+10%§!\n"
 RAJ_jungle_training_desc:0 "Индия, Бирма и Индокитай покрыты джунглями, и для повышения эффективности наших солдат в этих опасных местах рекомендуется специальная подготовка."
 RAJ_lessons_of_the_great_war:0 "Уроки Великой войны"
 RAJ_lessons_of_the_great_war_desc:0 "Индийские солдаты принимали участие в прошлой мировой войне, и извлеченные уроки этого конфликта следует использовать при обучении и организации армии."
 RAJ_indianisation_of_army:0 "Индианизация армии"
 RAJ_indianisation_of_army_desc:0 "Для надежной защиты Индии во всеобщей войне необходимо мобилизовать все ее население. Это означает не только привлечение большего числа людей из индийского населения, но и допуск индийских офицеров к управлению на определенном уровне."
 RAJ_indian_gurkhas:0 "Индийские гуркхи"
 RAJ_indian_gurkhas_desc:0 "Гуркхи из высокогорных районов Пенджаба и Непала легендарны благодаря своим боевым навыкам. Многие годы они служили радже, проявляя себя во всех видах сражений."
 RAJ_an_indian_sandhurst:0 "Индийская академия Сэндхерст"
 RAJ_an_indian_sandhurst_desc:0 "Со времени последней войны Индия требовала собственную военную школу, и в 1932 году мы, наконец, ее создали. Индийская военная академия уже несколько лет выпускает индийских офицеров, что дает нам основную группу командования."
 RAJ_lions_of_the_great_war:0 "Львы Великой войны"
 RAJ_lions_of_the_great_war_desc:0 "Сикхи имеют сильные воинские традиции и были высоко награждены во время последней войны. Львы Пенджаба сами по себе являются сильным полком, и регион готов к дальнейшему призыву."
 RAJ_indian_gentlemen_officers:0 "Индийские джентльмены-офицеры"
 RAJ_indian_gentlemen_officers_desc:0 "Джентльмены, которые служили раджем в тесном сотрудничестве с имперскими властями, являются готовым источником командующих, если нам нужны преданные люди для руководства новой индийской армией."
 RAJ_the_bangalore_torpedo:0 "Бангалорская торпеда"
 RAJ_the_bangalore_torpedo_desc:0 "Одним из величайших вкладов Британской Индии в военное дело является бангалорская торпеда, серия соединенных труб, которые можно использовать для уничтожения препятствий, пока инженеры находятся под огнем. Это устройство приобрело большую популярность во всем мире."
 RAJ_vickers_berthier_gun:0 "Винтовка Виккерс-Бертье"
 RAJ_vickers_berthier_gun_desc:0 "Винтовка Vickers-Berthier немного неудобна в использовании, но проста в быстром производстве. Для такой страны, как Индия, это очень важная характеристика."
 RAJ_royal_indian_artillery:0 "Королевская Индийская артиллерия"
 RAJ_royal_indian_artillery_desc:0 "Королевская Индийская артиллерия существовала с тех пор, как Ост-Индская компания сформировала батальон из индийских артиллеристов в 1748 году. Мы можем опираться на эти многолетние наработки."
 RAJ_army_motorization:0 "Моторизация армии"
 RAJ_army_motorization_desc:0 "Индия слишком велика, чтобы эффективно перемещаться с помощью поездов и лошадей. В армии должны быть моторизованные дивизии и регулярный грузовой транспорт."
 RAJ_revive_the_screw_guns:0 "Возобновить производство горных орудий"
 RAJ_revive_the_screw_guns_effect:0 "Разрешает использовать §HGорные орудия§!\n§HАртиллерия\n  Горные§!: Движение: §G+15%§!\n§HПротивотанковые орудия\n  Горные§!: Движение: §G+15%§!"
 RAJ_revive_the_screw_guns_desc:0 "Горная местность Северной Индии привела к разработке артиллерийского орудия, которое можно было разобрать и переносить на мулах туда, где оно было нужно. Эта 7-фунтовая пушка, возможно, немного устарела, но мы не должны игнорировать ее полезность."
 RAJ_indian_armor:0 "Индийская бронетехника"
 RAJ_indian_armor_desc:0 "Индии следует сосредоточиться на разработке собственной бронетехники и танковых дивизий."
 RAJ_modernizing_army:0 "Модернизация армии"
 RAJ_modernizing_army_desc:0 "Долгое время индийские вооруженные силы считались колониальным отрядом, им было доступно лишь несколько льгот и оборудования, которыми пользовалась армия в Великобритании. Теперь настало время модернизировать то, что мы имеем в Радже."
 RAJ_indian_defense_research:0 "Индийские оборонные исследования"
 RAJ_indian_defense_research_desc:0 "Теперь, когда Индия полностью суверенная нация, мы больше не получаем доступ к передовым прототипам и чертежам, как раньше. Мы должны гарантировать, что мы всегда остаемся впереди наших врагов и не отстаем в технологиях."
 RAJ_british_pilot_training:0 "Британская подготовка пилотов"
 RAJ_british_pilot_training_desc:0 "Королевские военно-воздушные силы согласились принять индийских пилотов для прохождения обучения. Это обучение будет большой помощью в развитии нашего собственного авиакрыла."
 RAJ_expand_air_bases:0 "Расширение авиабаз"
 RAJ_expand_air_bases_desc:0 "Индия очень большая, поэтому для патрулирования и защиты ее воздушного пространства мы должны увеличить наши воздушные возможности на базах по всему субконтиненту."
 RAJ_air_support_effort:0 "Усилия по обеспечению воздушной поддержки"
 RAJ_air_support_effort_desc:0 "Комбинированное общевойсковое сражение — это новый способ ведения войны, поэтому мы должны сосредоточить немного энергии на подготовке и производстве самолетов, которые могут поддерживать сухопутные и морские силы."
 RAJ_fighter_effort:0 "Усилия истребителей"
 RAJ_fighter_effort_desc:0 "Нам нужны истребители, чтобы сопровождать бомбардировщики и перехватывать вражеские самолеты, которые угрожают нашей стране."
 RAJ_royal_indian_air_force:0 "Королевские индийские военно-воздушные силы"
 RAJ_royal_indian_air_force_desc:0 "Пришло время взять наше небольшое авиационное подразделение и расширить его в отдельную ветвь вооруженных сил. Национальные ВВС с независимым командованием смогут лучше служить индийскому народу и Империи."
 RAJ_the_smiling_buddha:0 "Улыбающийся Будда"
 RAJ_the_smiling_buddha_desc:0 "Ученые близки к раскрытию секрета атомной энергии - и это приведет к созданию очень мощных взрывчатых веществ. Мы не можем отставать в гонке за атомным оружием."
 RAJ_great_indian_peninsula_railway:0 "Железная дорога Великой Индийской полуострова"
 RAJ_great_indian_peninsula_railway_desc:0 "Правительственный контроль над железной дорогой Великой Индийской полуострова в 1925 году означает, что её расширение и улучшение зависят от нас. Растущему населению нужна лучшая транспортная инфраструктура."
 RAJ_industrial_expansion:0 "Промышленное расширение"
 RAJ_industrial_expansion_desc:0 "Индию называют домом сотни миллионов людей - нет причин, по которым эта популяция не должна стать основой промышленного гиганта."
 RAJ_tata_steel:0 "Tata Steel"
 RAJ_tata_steel_desc:0 "Tata Steel находится на пути к тому, чтобы стать крупнейшим производителем стали в Империи. Более высокое производство будет способствовать дальнейшей модернизации Индии."
 RAJ_assam_oil:0 "Ассамская нефть"
 RAJ_assam_oil_desc:0 "Ассам является центром индийской добычи нефти, особенно НПЗ в Дигбое. Доступ к этим ресурсам необходимо расширить и использовать.
 RAJ_indian_institute_of_science:0 "Индийский институт науки"
 RAJ_indian_institute_of_science_desc:0 "Кампус Индийского института науки в Бангалоре позволяет лучшим и самым ярким представителям населения Индии продвигать нас вперед."
 RAJ_institute_of_fundamental_research:0 "Институт фундаментальных исследований"
 RAJ_institute_of_fundamental_research_desc:0 "Некоторые из наших ведущих ученых и промышленников выступают за создание нового Института фундаментальных исследований, который позволит воспользоваться новейшими открытиями в области физических наук."
 RAJ_research_collaboration:0 "Исследовательское сотрудничество"
 RAJ_research_collaboration_desc:0 "Британцы показали нам преимущества совместного использования научного прогресса между близкими союзниками. Весь наш блок сможет проводить военные НИОКР более эффективно, если мы предпримем необходимые шаги для их координации."
 RAJ_expand_mazagon_dock:0 "Расширение дока Мазагон"
 RAJ_expand_mazagon_dock_desc:0 "Док Мазагон в Мумбаи является нашим самым важным судостроителем на Западном побережье. В этот мировой кризис ему нужны большие мощности."
 RAJ_found_scindia_shipyard:0 "Основание верфи Синдия"
 RAJ_found_scindia_shipyard_desc:0 "Нам нужна верфь на восточном побережье страны, поэтому создание верфи Синдия в Вишакхапатнаме имеет смысл для нашего будущего флота."
 RAJ_royal_indian_navy:0 "Королевский индийский флот"
 RAJ_royal_indian_navy_desc:0 "Королевский индийский флот необходимо будет быстро расширять. Новая тактика и новые корабли должны быть приоритетом.
 RAJ_screening_effort:0 "Усилия по проведению охранных мероприятий"
 RAJ_screening_effort_desc:0 "Индия играет решающую роль в защите южного пути к Суэцкому каналу. Прикрытие и эскортные миссии позволят жизненно важным припасам и солдатам добраться до европейских и африканских театров военных действий."
 RAJ_cruiser_effort:0 "Усилия по увеличению крейсеров"
 RAJ_cruiser_effort_desc:0 "Крейсеров будет достаточно на данный момент для развития и расширения военно-морской мощи Индии."
 RAJ_submarine_effort:0 "Усилия по созданию подводных лодок"
 RAJ_submarine_effort_desc:0 "С ростом японской военно-морской надводной мощи в Азии, может быть разумным направить наши силы под воду, нанося удары с подводных лодок."
 RAJ_capital_ship_effort:0 "Усилия по созданию крупного корабля"
 RAJ_capital_ship_effort_desc:0 "Как британский форпост, Индия видела силу крупных кораблей в господстве на море. Мы должны построить наши собственные тяжелые крейсеры и линкоры."
 RAJ_modernizing_navy:0 "Модернизация флота"
 RAJ_modernizing_navy_desc:0 "Лучшие двигатели, больше места для экипажа, большая скорость и более крупные орудия. Индийский флот скоро станет одним из лучших на континенте."
 RAJ_east_india_railways:0 "Железные дороги Восточной Индии"
 RAJ_east_india_railways_desc:0 "Государственный контроль над железной дорогой Восточной Индии оставляет все решения по ее расширению и улучшению в руках наших министров."
 RAJ_integrate_princely_railways:0 "Интеграция княжеских железных дорог"
 RAJ_integrate_princely_railways_desc:0 "Некоторые индийские князья финансировали свои собственные железнодорожные системы, но до сих пор они были плохо интегрированы с железнодорожными линиями, построенными Британским Раджем. Нужно что-то делать, чтобы связать вместе поезда страны."
 RAJ_ishapore_arsenal:0 "Завод Исхапур"
 RAJ_ishapore_arsenal_desc:0 "Завод и оружейная фабрика Исхапур действуют с 18 века. Он отвечает за множество инноваций в оружейном деле и является центральным элементом нашей системы производства оружия."
 RAJ_clamp_down_on_corruption:0 "Пресечение коррупции"
 RAJ_clamp_down_on_corruption_desc:0 "Несмотря на усилия британской промышленности по расширению железнодорожной системы Индии, мало кто из индийцев получил выгоду от этого расширения. В транспортном секторе царит широко распространенная коррупция и двойная игра, и мы должны показать, что что-то с этим делаем."
 RAJ_strengthen_ties_with_british_investors:0 "Укрепление связей с британскими инвесторами"
 RAJ_strengthen_ties_with_british_investors_desc:0 "Чтобы расширить наши фабрики и ресурсы, мы все еще сильно зависим от британского капитала. Пока у нас нет своего собственного надежного банковского сектора, мы должны склониться перед Лондоном, чтобы попросить поддержки."
 RAJ_british_rail_investors:0 "Британские железнодорожные инвесторы"
 RAJ_british_rail_investors_desc:0 "Гражданской и транспортной инфраструктуре в Индии требуются крупные денежные вливания от британских финансистов."
 RAJ_british_arms_investors:0 "Британские инвесторы в вооружение"
 RAJ_british_arms_investors_desc:0 "Если мы хотим быстро привести в движение наши оружейные заводы, нам нужно попросить британские банки инвестировать в нашу военную инфраструктуру."
 RAJ_indian_sandhurst_tt:0 "Появится §YГенерал 4 навыка§! по имени §YKодандера Мадаппа Карьяппа§!\nПоявится §YГенерал 3 навыка§! по имени §YKодандера Субайя Тимайя§!\nПоявится §YГенерал 3 навыка§! по имени §YДжаянант Натх Чаудхури§!"
 RAJ_create_unit_gurkas_tt:0 "Получите элитный отряд гуркхов в Дели."
 RAJ_create_unit_rani_tt:0 "Получите пехотную часть в Дели."
 RAJ_create_unit_sikh_tt:0 "Получите пехотную часть в Дели."
 RAJ_create_general_rani_tt:0 "\nПоявится §YГенерал 3 навыка§! по имени §YLакшми Сагал§!"
 RAJ_administrative_oversight:0 "Административный надзор"
 RAJ_administrative_oversight_desc:0 "Когда промышленная коррупция будет устранена, а наша независимость обеспечена, пришло время взять местных администраторов под крыло правительства. Хотя это может показаться сложной задачей, племенные вожди и местные чиновники влияют на большие слои нашего населения. В это темное время их нужно привлекать во благо нашей страны."
 RAJ_enable_local_industrialization:0 "Включает решения §HСельская индустриализация§!, позволяющие изменять Дух §HAграрного общества§!"
 RAJ_land_clearance:0 "Очистка земли"
 RAJ_land_clearance_desc:0 "Благодаря усилению влияния, оказываемого на местных лидеров, мы можем более рационально использовать наши природные ресурсы и землю во имя государства."
 RAJ_workforce_integration:0 "Интеграция рабочей силы"
 RAJ_workforce_integration_desc:0 "Используя местную власть региональных и племенных лидеров, мы способны направить в противном случае растрачиваемые ресурсы на программы улучшения в сельских районах."
 RAJ_land_clearance_effect_tt:0 "Решения $RAJ_population_decisions$ теперь добавляют §G1§! строительный слот.\n$apply_integration_effects_retroactively$"
 RAJ_integration_tooltip:0 "Решения §H$RAJ_population_decisions$§! теперь добавляют:"
 RAJ_integration_tooltip_post:0 "$apply_integration_effects_retroactively$"
 apply_integration_effects_retroactively:0 "\nЭто будет применено §Hретроактивно§! ко всем штатам, в отношении которых ранее было принято это решение."
 continuous_naval_production:0 "Морское производство"
 continuous_naval_production_desc:0 "Сосредоточив ресурсы на наших верфях и освободив квалифицированных судостроителей от военной службы, мы можем значительно сократить время производства кораблей."
 continuous_air_production:0 "Авиационное производство"
 continuous_air_production_desc:0 "Мы можем реорганизовать нашу авиационную промышленность, чтобы устранить отходы и оптимизировать производство."
 continuous_non_factory_construct:0 "Инженерное строительство"
 continuous_non_factory_construct_desc:0 "У нас сохранился большой резерв в строительной индустрии. Сконцентрировав на этом внимание, мы можем добиться значительного ускорения процесса строительства. К сожалению, производство оборудования оказалось главным препятствием к расширению нашей тяжелой индустрии, поэтому в этой области наши усилия не принесут выгоды."
 continuous_reduce_training_time:0 "Армейская подготовка"
 continuous_reduce_training_time_desc:0 "Создавая в каждом дивизионе специализированные передовые подразделения подготовки, мы можем направить на фронт даже дивизии, ранее откладываемые для завершения обучения."
 continuous_suppression:0 "Подавление сопротивления"
 continuous_suppression_desc:0 "Внедрив агентов в крупные группы сопротивления на оккупированных территориях и обратив их лидеров, мы сможем значительно уменьшить возможный ущерб с их стороны."
 continuous_repair:0 "Восстановление конструкций"
 continuous_repair_desc:0 "Мы сформируем специализированные ремонтные бригады из заводских и строительных рабочих и централизованно будем направлять их для улучшения реконструкции разрушенной инфраструктуры."
 continuous_tech_share:0 "Обмен технологиями"
 continuous_tech_share_desc:0 "Мы призовем наши научно-исследовательские институты и университеты сотрудничать с организациями союзных стран. Это обеспечит нам бонус к обмену технологиями."
 continuous_boost_freedom:0 "Повышение автономии"
 continuous_boost_freedom_desc:0 "Реорганизуя нашу колониальную бюрократию и нанимая местных администраторов, мы со временем сможем взять на себя ответственность за наши дела."
 continuous_restrict_freedom:0 "Подавить субъектов"
 continuous_restrict_freedom_desc:0 "Наши колониальные подданные получили довольно глупые идеи о таких вещах, как "самоопределение" или "национальная независимость". Пора разубедить их в этих понятиях."
 subject_autonomy_mod_tt:0 "Автономность в предметах: §G-0.5§!"
 unlocks_decision:0 "Разблокирует решение: "
 USA_continue_the_new_deal:1 "Продолжить Новый курс"
 USA_continue_the_new_deal_desc:1 "Политика Нового курса доказала свою эффективность. Мы не должны сбиться с пути сейчас."
 USA_suspend_the_presecution:0 "Прекратить преследования"
 USA_suspend_the_presecution_desc:0 "Преследование американских граждан за их политические взгляды, какими бы отвратительными они ни казались, в корне противоречит ценностям этой страны. Оно должно прекратиться немедленно."
 USA_desegregate_the_armed_forces:1 "Десегрегация вооруженных сил"
 USA_desegregate_the_armed_forces_desc:1 "Служба с оружием в руках в вооруженных силах своей страны может быть нежеланной обязанностью - но она также может быть заветным правом. Правом, которое многим нашим гражданам отказано из-за их происхождения."
 USA_full_desegregation:1 "Полная десегрегация"
 USA_full_desegregation_desc:1 "Некоторые наши штаты слишком долго обращались с людьми по-разному, основываясь на старых, устаревших и бесчеловечных критериях. В свободной республике каждый гражданин должен быть равноправным, а не раздельным."
 USA_democratic_socialism:1 "Демократический социализм"
 USA_democratic_socialism_desc:1 "Ни один здравомыслящий человек не может отрицать, что социализм - это будущее человеческой цивилизации. В то же время ни один гордый и патриотичный гражданин этой республики не может поддержать систему, в которой правительство больше не создается народом и для народа. Как и наши гордые предки, мы создадим новую форму правления, которая объединяет оба."
 USA_liberty_for_the_philippines:1 "Свобода Филиппинам"
 USA_liberty_for_the_philippines_desc:1 "Народ Филиппин продемонстрировал свою способность организовывать свои собственные дела, и пришло время официально упразднить последние остатки американского контроля над своей страной."
 USA_pacific_decolonisation:1 "Тихоокеанская деколонизация"
 USA_pacific_decolonisation_desc:1 "Нет оправдания - ни одного - для продолжающегося присутствия европейских держав в Тихом океане, ни для того, чтобы держать народы островов Тихого океана в рабстве у своих европейских хозяев. Америка больше не будет стоять в стороне, пока эта несправедливость продолжается."
 USA_union_representation_act:1 "Акт о представительстве профсоюзов"
 USA_union_representation_act_desc:1 "Труд является неотъемлемой частью человеческой жизни, а создание профсоюзов — неотъемлемая часть организации демократического общества. Мы должны признать это и обеспечить обязательное представительство профсоюзов в Конгрессе."
 USA_old_age_pension_act:1 "Закон о пенсии по старости"
 USA_old_age_pension_act_desc:1 "После долгих лет работы наши люди заслуживают финансовой безопасности и уважения в старости. Существующих законов для их поддержки явно недостаточно."
 USA_accumulated_wealth_tax_act:1 "Закон о налоге на накопленное богатство"
 USA_accumulated_wealth_tax_act_desc:1 "Некоторые люди в нашей стране накопили абсурдное количество капитала. Эти деньги пассивно лежат на банковских счетах или инвестируются в непрактически большие здания, позолоченную мебель и дорогие картины. Ничто из этого не служит никаким жизнеспособным экономическим целям. Введя новый налог, мы заставим наших граждан, накопивших такое бесполезное богатство, реинвестировать эти деньги в экономику."
 USA_guarantee_the_american_dream:1 "Гарантия американской мечты"
 USA_guarantee_the_american_dream_desc:0 "Большинство наших людей не хотят многого в жизни: стабильная работа, хорошее здоровье и место для создания семьи. У них нет причин, чтобы не иметь всего этого."
 USA_worker_management_act:1 "Закон об управлении рабочими"
 USA_worker_management_act_desc:1 "Слишком часто фабрики и офисы возглавляют люди, никогда не работавшие в цеху. Не понимая реалии производства, они ставят нереалистичные ожидания. Чтобы оградить нашу экономику от ущерба, который могут нанести такие некомпетентные руководители, мы поручим рабочим управлять рабочими для рабочих!"
 USA_high_wages:0 "Высокие зарплаты"
 USA_high_wages_desc:0 ""
 USA_militia_organization_act:1 "Закон об организации ополчения"
 USA_militia_organization_act_desc:1 "У нашей славной республики давняя традиция гражданина-солдата. Если на нашу страну нападет иностранный захватчик, он столкнется с хорошо организованным и вооруженным ополчением мужчин и женщин, сражающихся на знакомой территории, чтобы защитить свои дома."
 USA_communal_property_act:1 "Закон о коммунальной собственности"
 USA_communal_property_act_desc:1 "Потребности многих никогда не должны перевешивать желания немногих или даже одного. Чтобы убедиться, что это так, мы примем новое законодательство, которое позволит местным сообществам легче использовать право принудительного изъятия."
 USA_reintegration:1 "Реинтеграция"
 USA_reintegration_desc:1 "Война расколола нашу нацию, но в конечном итоге даже те, кто восстал против нас, могут быть искуплены. Когда население осознает свои ошибки, ему следует разрешить вновь присоединиться к политическому процессу в нашей гордой республике."
 USA_permament_revolution:0 "Постоянная революция"
 USA_permament_revolution_desc:0 ""
 USA_reach_out_to_the_ware_group:1 "Протянуть руку Ware Group"
 USA_reach_out_to_the_ware_group_desc:1 "Внутри нашего правительства существует небольшая группа преданных коммунистов. Они считают, что действуют тайно, но мы знаем их имена. Возможно, они смогут увидеть, что наша цель совпадает, и их можно будет убедить присоединиться к правительству."
 USA_us_ussr_economic_cooperation:1 "Экономическое сотрудничество между США и СССР"
 USA_us_ussr_economic_cooperation_desc:1 "Несмотря на хаотичное и кровавое рождение, Советскому Союзу удалось добиться значительного прогресса в построении современного индустриального общества. Мы должны внести свой вклад в помощь им."
 USA_secure_china:1 "Обеспечить безопасность Китая"
 USA_secure_china_desc:1 "Китай охвачен долгой и кровопролитной гражданской войной. Националистическое правительство глубоко коррумпировано и потеряло всю поддержку населения. Пришло время начать поддерживать единственного деятеля в Китае, который сможет объединить и умиротворить страну - Коммунистическую партию."
 USA_end_monarchism:1 "Покончить с монархией"
 USA_end_monarchism_desc:1 "Монархии Европы уже однажды ввергли мир в мировую войну - мы не можем позволить им сделать это снова. Наши предки развязали войну с королем Англии, чтобы обрести свободу - мы навсегда освободим мир от его тирании!"
 USA_shatter_the_empires:1 "Сокрушить империи"
 USA_shatter_the_empires_desc:1 "Когда-то мы были колонией глобальной империи, но выкупили нашу свободу кровью. Наша республика не сможет по-настоящему почувствовать себя в безопасности, пока не будет сдерживать тех, кто мечтает о господстве над миром."
 USA_agricultural_adjustment_act:1 "Закон о корректировке сельского хозяйства"
 USA_agricultural_adjustment_act_desc:1 "Наши фермеры особенно сильно пострадали от депрессии. Мы должны обеспечить, чтобы людей, производящих нашу еду, не вытеснили из бизнеса с помощью бесконтрольного рынка."
 USA_fair_labour_standards_act:1 "Закон о справедливых трудовых стандартах"
 USA_fair_labour_standards_act_desc:1 "С первыми признаками медленного восстановления настало время обеспечить участие рабочих в этом процессе. Мы должны запретить эксплуататорские практики, такие как неоплачиваемые сверхурочные, и ввести прожиточный минимум."
 USA_federal_housing_act:1 "Федеральный закон о жилищном строительстве"
 USA_federal_housing_act_desc:1 "В рамках наших постоянных усилий по искоренению нищеты в Соединенных Штатах мы создадим программу жилья с федеральными субсидиями."
 federal_housing_tt:0 "(§YПять случайных штатов§!): Добавить §G2§! Строительные слоты."
 USA_office_of_scientific_research_and_development:1 "Управление научными исследованиями и разработками"
 USA_office_of_scientific_research_and_development_desc:1 "С приближением войны на горизонте мы должны сосредоточить наши научные усилия на том, чтобы не отставать от любого потенциального противника."
 USA_focus_on_europe:1 "Сосредоточиться на Европе"
 USA_focus_on_europe_desc:1 "Великие державы Европы вновь готовы ввергнуть мир в мировую войну. Мы не можем, как и раньше, ждать, пока это не затронет нас. Мы должны быть готовы решительно вмешаться, если какая-либо страна в Европе угрожает миру."
 USA_focus_on_asia:1 "Сфокусироваться на Азии"
 USA_focus_on_asia_desc:1 "Хотя большинство людей с беспокойством смотрят в сторону Европы, мы также сталкиваемся с неопределенностью и нестабильностью в Тихом океане. Может быть, в наших интересах вмешаться за границу, прежде чем они нападут ближе к дому."
 USA_magic:1 "MAGIC"
 USA_magic_desc:1 "ВМС думают, что могут взломать японские шифровальные коды, что позволит нам читать весь их трафик сообщений, включая передвижения кораблей."
 USA_neutrality_act:1 "Акт о нейтралитете"
 USA_neutrality_act_desc:1 "Кажется, все более очевидно, что в Европе разразится война. Во время Великой войны американские компании продали большое количество оружия союзникам, и многие считают, что вступление Америки было в основном мотивировано желанием гарантировать, что эти поставки будут оплачены. На этот раз не будет никаких военных спекуляций."
 USA_lend_lease_act_neutrality_tt:0 "\n\nПринятие закона о нейтралитете §Rdrastically increase§! требования к принятию Закона о ленд-лизе"
 USA_lend_lease_act:1 "Закон о ленд-лизе"
 USA_lend_lease_act_desc:1 "Крупнейшие мировые демократии подверглись нападению. Если они проиграют битву, война рано или поздно доберется и до наших берегов. Мы должны сделать все возможное, чтобы их поддержать — даже если они не смогут сразу же заплатить за технику."
 USA_reestablish_the_gold_standard:1 "Восстановить золотой стандарт"
 USA_reestablish_the_gold_standard_desc:1 "Без золотого стандарта деньги превращаются в предмет веры, а безудержная инфляция уничтожает сбережения наших людей и обесценивает их труд. Мы должны отказаться от этого безответственного финансового пути."
 USA_adjusted_compensation_act:1 "Закон о корректировке вознаграждения"
 USA_adjusted_compensation_act_desc:1 "Нашим ветеранам Первой мировой войны обещали достойную пенсию. После наступления депрессии многие из них переживают не лучшие времена. Мы должны сделать все возможное, чтобы помочь тем, кто в трудный час ответил на призыв Республики."
 USA_labour_management_relations_act:1 "Закон об отношениях между трудом и управлением"
 USA_labour_management_relations_act_desc:1 "В Америке все предприятия подвержены угрозам со стороны профсоюзов — забастовки, объединение, требования более высокой зарплаты. Мы не можем допустить, чтобы это продолжалось."
 USA_protectionist_tariffs:1 "Протекционистские тарифы"
 USA_protectionist_tariffs_desc:1 "Свободная торговля открыла наши рынки для иностранных конкурентов, многие из которых подняли собственные тарифы и пошлины. Наши компании сталкиваются с жесткой конкуренцией, а их компании пользуются безопасностью таможенных стен. Это должно закончиться."
 USA_income_tax_reform:2 "Налоговая реформа"
 USA_income_tax_reform_desc:1 "Подоходный налог забирает деньги из кошелька каждого американца - деньги, которые наши граждане могли бы потратить на покупку других вещей и поддержку местной экономики. Мы вернем американцам автономию над собственными финансами."
 USA_institute_of_american_sciences:1 "Американский институт наук"
 USA_institute_of_american_sciences_desc:1 "Университеты и исследовательские лаборатории по всей стране до сих пор проводили свои исследования так, как считали нужным. Это должно закончиться. Мы создадим новую организацию для координации усилий наших ученых мирового уровня."
 USA_america_first:0 "Сначала Америка"
 USA_america_first_desc:2 "Некоторые люди хотят, чтобы мы тратили наши сокровища и кровь наших молодых людей на зарубежные войны. Мы не должны поддаваться влиянию этих поджигателей войны, а будем жить по простой максиме: сначала Америка - все остальные потом."
 USA_extend_the_chinese_exclusion_acts:1 "Расширить закон об исключении китайцев"
 USA_extend_the_chinese_exclusion_acts_desc:2 "Из-за того что Китай разорен войной, мы должны принять меры для ограничения китайской иммиграции, чтобы нас не захлестнули волны беженцев."
 USA_empower_the_huac:1 "Расширить полномочия КУАС"
 USA_empower_the_huac_desc:1 "Комитет палаты представителей по антиамериканской деятельности выполняет важную функцию в нашей здоровой демократии. Мы не должны позволять нелояльным элементам пытаться влиять на политический процесс."
 USA_voter_registration_act:1 "Закон о регистрации избирателей"
 USA_voter_registration_act_desc:1 "Выборы — важнейшая часть демократии. Абсолютно неразумно требовать, чтобы не было проверок того, кто может в них участвовать, или, может быть, у людей, которые выступают за бесконтрольные выборы, есть более зловещие мотивы и они хотят подорвать процесс путем мошенничества на выборах..."
 USA_ally_with_the_silver_shirts:1 "Союз с Серебряными рубашками"
 USA_ally_with_the_silver_shirts_desc:1 "Чтобы вернуть нашу нацию на ее законное место в мире и заявить о нашей явной судьбе, необходима более глубокая реорганизация. Серебряные рубашки помогут нам в этом."
 USA_national_prosperity_program:1 "Национальная программа процветания"
 USA_national_prosperity_program_desc:1 "Ключ к обеспечению быстрого восстановления и долгосрочного процветания лежит не в неконтролируемых рынках, а в тщательно проработанных программах, объединяющих частные и государственные предприятия."
 USA_privatize_the_TVA:1 "Приватизировать TVA"
 USA_privatize_the_TVA_desc:1 "Управление долиной Теннесси вытеснило частную конкуренцию и установило монополию на строительные работы в этом районе. Правительство не может заниматься тем, что, как доказал частный сектор, оно умеет делать лучше."
 USA_de_regulate_the_banking_sector:1 "Отменить регулирование банковского сектора"
 USA_de_regulate_the_banking_sector_desc:1 "После корректировки на финансовых рынках, которая является абсолютно нормальной в экономическом цикле, предыдущее правительство ввело совершенно необоснованные ограничения на финансовую деятельность. Хотя это, без сомнения, сделано с благими намерениями, но эти ограничения явно приносят больше вреда, чем пользы."
 USA_national_employment_strategy:1 "Национальная стратегия занятости"
 USA_national_employment_strategy_desc:1 "Безработица происходит из-за простого факта: люди не соответствуют предлагаемым рабочим местам. Заводы простаивают, потому что работодатели не находят нужных им людей, в то время как люди в других частях страны голодают. Мы внедрим новую стратегию, которая обеспечит, чтобы любой работодатель мог найти людей, необходимых для ведения своего бизнеса."
 USA_invite_foreign_support:1 "Привлечь зарубежную поддержку"
 USA_invite_foreign_support_desc:1 "В связи с некоторыми очень тревожными сообщениями о лояльности военных и некоторых государственных органов власти нам, возможно, придется искать поддержку за рубежом."
 USA_send_lindbergh_to_germany:1 "Отправить Линдберга в Германию"
 USA_send_lindbergh_to_germany_desc:1 "Известный авиатор предложил поехать в Европу, чтобы исследовать, как Германия восстановилась после прошлой войны. Это должно дать нам ценный опыт. Линдберг также намекнул, что был бы готов присоединиться к правительству в качестве консультанта."
 USA_work_with_the_bund:1 "Сотрудничать с Бунд"
 USA_work_with_the_bund_desc:1 "Немецко-американский союз предложил нам свою помощь в донесении нашей позиции до многих американцев с немецкими корнями. Это обеспечит нам наличие базы поддержки в их штатах."
 USA_work_with_the_bund_tt:0 "В случае гражданской войны в составе правительства останутся следующие штаты: Огайо, Миссури, Висконсин, Иллинойс, Индиана и Мичиган."
 USA_recruit_the_free_corps:1 "Призвать фрайкор"
 USA_recruit_the_free_corps_desc:1 "Пока военные всё больше под подозрением, нам следует обратиться к героям Первой мировой войны. В свой час нужды немецкий фрайкор пришел на помощь Германской республике. Нам нужно что-то похожее, что останется верным нам, когда придёт наше время."
 USA_honor_the_confederacy:1 "Воздать честь Конфедерации"
 USA_honor_the_confederacy_desc:1 "Долгое время историю Гражданской войны рассказывали с позиции Севера — историю о обреченном восстании. Пришло время услышать и другую сторону."
 USA_war_powers_act:1 "Акт о военных полномочиях"
 USA_war_powers_act_desc:1 "В мире стремительно развивающихся самолетов с все большей бомбовой нагрузкой, в мире подводных лодок и химического оружия, требовать от Президента согласия Конгресса на действия по защите страны — значит нарываться на беду."
 USA_seize_cuba:1 "Захватить Кубу"
 USA_seize_cuba_desc:1 "Прямо у наших берегов находится непотопляемый авианосец, готовый стать базой для агрессора. Мы не должны этого допустить."
 USA_eliminate_the_southern_threat:1 "Устранить южную угрозу"
 USA_eliminate_the_southern_threat_desc:1 "Мексика пребывала в состоянии нестабильности последнее поколение. Неважно, перекинется ли насилие через нашу границу или кто-нибудь объединит страну и двинется на север, нам необходимо защитить наш южный фланг."
 USA_the_canadian_corridor:1 "Канадский коридор"
 USA_the_canadian_corridor_desc:1 "Небольшая полоса малонаселенной канадской территории отделяет Аляску от южной части США. Таким образом, ее оборона зависит от доброй воли Канады. Однако наиболее вероятным противником является Канада. Это не может продолжаться."
 USA_north_american_dominion:1 "Североамериканское господство"
 USA_north_american_dominion_desc:1 "Защитив наши непосредственные границы, мы должны смотреть дальше, чтобы опередить любую угрозу для Северной Америки. Мы не можем терпеть существования любого неконтролируемого государства в регионе."
 USA_strategic_interests:1 "Стратегические интересы"
 USA_strategic_interests_desc:1 "Мир как никогда прежде взаимосвязан. Угроза в одной его части может легко разрастись до такой степени, что станет опасностью для всего мира. Мы должны создать сеть взаимоподдерживающих баз по всему земному шару, чтобы мы могли быстро реагировать на любую ситуацию."
 USA_protect_south_america:1 "Защитить Южную Америку"
 USA_protect_south_america_desc:1 "Южная часть нашего двойного континента была игровой площадкой империй с момента его открытия. Настало время кому-то взять на себя ответственность за то, чтобы эти страны не были потревожены и направлены к более продуктивному будущему."
 USA_pacific_pacification:1 "Умиротворение Тихого океана"
 USA_pacific_pacification_desc:1 "Австралия и Новая Зеландия находятся слишком далеко от Великобритании, чтобы они могли эффективно защищаться. Мы не можем допустить, чтобы их захватила нация, враждебная [USA.GetNameDef]."
 USA_secure_asia:1 "Обеспечить безопасность Азии"
 USA_secure_asia_desc:1 "Кажется, колониальные нации в Европе не хотят или не могут эффективно защищать свои азиатские колонии. Мы должны взять на себя это бремя за них, чтобы эти районы не стали плацдармами для дальнейшей агрессии."
 USA_global_hegemony:1 "Глобальная гегемония"
 USA_global_hegemony_desc:1 "Мы стоим на пороге достижения положения глобального превосходства, которое позволит нам предотвратить конфликт только благодаря нашему существованию. Мы просто должны гарантировать, что остальные великие державы планеты признают нашу позицию."
 USA_war_plans_division:1 "Отдел военных планов"
 USA_war_plans_division_desc:1 "Хотя мы и желаем мира, мы должны готовиться к войне."
 USA_intervention_in_the_americas:1 "Интервенция в Америке"
 USA_intervention_in_the_americas_desc:1 "Наша первоочередная задача — убедиться, что мы готовы к любым непредвиденным обстоятельствам в нашем полушарии."
 USA_war_plan_green:1 "Военный план Грин"
 USA_war_plan_green_desc:1 "Ввиду постоянной нестабильности в Мексике, последовавшей за революцией, мы должны быть готовы решительно вмешаться."
 USA_war_plan_crimson:1 "План войны Красный"
 USA_war_plan_crimson_desc:1 "Канада может быть сейчас дружественным соседом, но так будет не всегда."
 USA_war_plan_gray:1 "План войны Серый"
 USA_war_plan_gray_desc:1 "История показала, что нации Карибского бассейна весьма нестабильны. Нам, возможно, придется действовать быстро, чтобы защитить американские интересы, если какая-либо из них впадет в нестабильность."
 USA_war_plan_indigo:0 "План войны Индиго"
 USA_war_plan_indigo_desc:0 ""
 USA_war_plan_purple:0 "План войны Пурпурный"
 USA_war_plan_purple_desc:0 ""
 USA_war_plan_violet:0 "План войны Фиолетовый"
 USA_war_plan_violet_desc:0 ""
 USA_execute_war_plan_violet:0 "Исполнить план войны Фиолетовый"
 USA_execute_war_plan_purple:0 "Исполнить план войны Пурпурный"
 USA_execute_war_plan_indigo:0 "Исполнить план войны Индиго"
 USA_hemisphere_defense:1 "Оборона полушария"
 USA_hemisphere_defense_desc:1 "Несмотря на любые заграничные дела, мы должны в первую очередь смотреть на собственный район."
 USA_intervention_in_europe:1 "Интервенция в Европу"
 USA_intervention_in_europe_desc:1 "Менее чем через два десятилетия после окончания Великой войны нации Европы снова готовятся к войне. Мы должны быть готовы в случае, если ситуация потребует быстрого вмешательства."
 USA_war_plan_gold:1 "План войны Золотой"
 USA_war_plan_gold_desc:1 "Франция страдает от внутреннего раскола и растущего политического радикализма, но также является одной из величайших военных держав Европы. Эта комбинация многих заставляет нервничать."
 USA_war_plan_silver:0 "План войны Серебро"
 USA_war_plan_silver_desc:0 "Италия открыто заявила о своем стремлении править Средиземноморьем. Если их желания империи вступят в конфликт с нашими интересами, мы должны быть готовы."
 USA_anti_bolshevist_aid:2 "Анти [GetSovietThreatNameAlt] помощь"
 USA_anti_bolshevist_aid_desc:2 "Любое орудие, снаряд, пуля и пара сапог, которые мы можем предоставить тем, кто борется с распространением угрозы [GetSovietThreatNameAlt], в конечном счете поможет защитить нас."
 USA_war_plan_ruby:1 "План войны Рубин"
 USA_war_plan_ruby_desc:1 "В Индии проживают миллионы людей, с которыми мы должны быть готовы столкнуться, если вступим в конфликт."
 USA_war_plan_scarlet_garnet:1 "План войны Алый Гранат"
 USA_war_plan_scarlet_garnet_desc:1 "В Тихом океане Австралия и Новая Зеландия вполне могут прийти на помощь своей метрополии. Любой план борьбы с Великобританией должен учитывать ее колонии."
 USA_intervention_in_asia:1 "Вмешательство в Азию"
 USA_intervention_in_asia_desc:1 "Азия, часто затмеваемая событиями в Европе, имеет свои собственные проблемные места, вынуждая нас готовиться к вмешательству."
 USA_war_plan_yellow:1 "План войны Желтый"
 USA_war_plan_yellow_desc:1 "Китай находится в состоянии гражданской войны больше поколения. Нет никаких данных о том, когда ситуация ухудшится настолько, что нам придется вмешаться."
 USA_war_department:1 "Военное министерство"
 USA_war_department_desc:1 "В эпоху индустриализованной войны у нас должно быть управление, способное использовать ресурсы нашей великой нации в полную силу."
 USA_selective_training_act:1 "Закон о выборочной подготовке"
 USA_selective_training_act_desc:1 "Исторически Соединенные Штаты медленно принимали проект даже во время войны. Мы больше не можем позволить себе такую роскошь."
 USA_louisiana_maneuvers:1 "Луизианские маневры"
 USA_louisiana_maneuvers_desc:1 "Бюджетные ограничения вынудили нас наблюдать за многими военными разработками со стороны. Теперь мы, наконец, можем опробовать некоторые из наших теорий на практике."
 USA_airborne_divisions:1 "Воздушно-десантные дивизии"
 USA_airborne_divisions_desc:1 "Улучшения в дальности и грузоподъемности самолетов открыли ряд возможностей. Грузовые самолеты могли доставить целую дивизию войск далеко за линию фронта противника, где они бы сеяли хаос."
 USA_army_of_the_united_states:1 "Армия Соединенных Штатов"
 USA_army_of_the_united_states_desc:1 "Для предстоящих сражений армия США слишком мала. Чтобы контролировать значительное увеличение численности, которое нам предстоит осуществить, нам нужно будет создать новую организацию."
 USA_womens_armed_service_integration_act:1 "Закон об интеграции женщин в вооруженные силы"
 USA_womens_armed_service_integration_act_desc:1 "Мы не можем позволить себе отвергать любого, кто желает служить. Каждая женщина в форме освобождает мужчину для боя на передовой."
 USA_tank_experiments:1 "Эксперименты с танками"
 USA_tank_experiments_desc:1 "Танки незаменимы на современном поле боя. Мы должны найти способ их наиболее эффективного использования."
 USA_tank_destroyer_doctrine:1 "Доктрина истребителей танков"
 USA_tank_destroyer_doctrine_desc:1 "Противоречивая теория, разработанная некоторыми артиллерийскими офицерами, утверждающая, что лучшим оружием против бронетанковых прорывов является быстрое, легкобронированное, но тяжеловооруженное транспортное средство."
 USA_main_battle_tanks:1 "Основные боевые танки"
 USA_main_battle_tanks_desc:1 "Опыт на поле боя ясно показал, что танк должен уметь выполнять множество задач: от поддержки пехоты до борьбы с танками противника. Проектирование транспортных средств для удовлетворения этих потребностей позволяет нам оптимизировать производство."
 USA_armored_infantry:1 "Мотопехота"
 USA_armored_infantry_desc:1 "Танки сами по себе не могут выиграть битву. Для удержания территории нужна пехота. Предоставление им бронетехники позволяет им не отставать от танков и выживать, несмотря ни на что."
 USA_build_the_pentagon:1 "Построить Пентагон"
 USA_build_the_pentagon_desc:1 "Расширение наших вооруженных сил требует создания новой глобальной штаб-квартиры для управления ими."
 USA_department_of_defense:1 "Министерство обороны"
 USA_department_of_defense_desc:1 "Переименование военного ведомства подчеркивает, что мы больше не можем игнорировать нашу защиту до тех пор, пока ее не проверят. Мы всегда должны быть бдительны."
 USA_escort_fighters:1 "Истребители сопровождения"
 USA_escort_fighters_desc:1 "Хотя бомбардировщик всегда может пробиться, его ведомый - нет, если только оба они не будут защищены дружественными истребителями."
 USA_us_army_airforce:1 "ВВС армии США"
 USA_us_army_airforce_desc:1 "Основная цель военной авиации - позволить сухопутным войскам захватить и удерживать территории. Все остальное второстепенно."
 USA_us_air_force:1 "Военно-воздушные силы США"
 USA_us_air_force_desc:1 "Основная цель военной авиации - побеждать в войнах. Стратегические бомбардировки с применением все более разрушительного оружия либо сломят волю противника к сопротивлению, либо сделают его материально неспособным к этому."
 USA_two_ocean_navy_act:1 "Акт о двух океанах"
 USA_two_ocean_navy_act_desc:1 "В связи с надвигающейся войной мы должны обеспечить, чтобы ни один враг никогда не ступил на американские берега. Наш флот должен быть способен сражаться с любым противником в любом из двух великих океанов, которые образуют наши границы."
 USA_maritime_commission:1 "Морская комиссия"
 USA_maritime_commission_desc:1 "Хотя большинство дилетантов сосредоточены только на военных кораблях, настоящие эксперты знают, что победа в войнах приносят скромные грузовые суда. Чтобы увеличить количество судов, доступных во время войны, мы создадим специальный совет для координации строительства."
 USA_advanced_basing:1 "Продвинутая база"
 USA_advanced_basing_desc:1 "Чем дальше мы можем держать врага от наших берегов, тем лучше."
 USA_naval_radar:1 "Морской радар"
 USA_naval_radar_desc:1 "Радар предлагает заманчивые возможности, позволяя лишить наших врагов защиты ночи и обнаруживать их даже в плохую погоду."
 USA_fleet_submarines:1 "Подводные лодки"
 USA_fleet_submarines_desc:1 "Наши наиболее вероятные противники в морской войне зависят от внешней торговли, которая, как показала практика, весьма уязвима для подводных лодок. Эти подводные лодки должны иметь очень большой радиус действия, чтобы они могли пересечь океаны и действовать вблизи берега противника."
 USA_unrestricted_submarine_warfare:1 "Безоговорочная подводная война"
 USA_unrestricted_submarine_warfare_desc:1 "История показала, что любой продуманный договор, призванный контролировать подводную войну, не стоит бумаги, на которой он написан. Мы не должны считать себя связанными тем, чем наши враги в любом случае будут пренебрегать."
 can_degaussing_tech:0 "Получить технологию размагничивания"
 USA_great_depression_cooldown:0 "Новое законодательство все еще находится в стадии разработки"
 USA_great_depression_cooldown_tt:0 "После принятия этого закона пройдет §Y200 дней§!, прежде чем будет разработано и готово к подписанию дальнейшее законодательство Нового курса.\n\n"
 USA_great_depression_cooldown_alternate_tt:0 "После принятия этого закона пройдет §Y400 дней§!, прежде чем будет разработано и готово к подписанию дальнейшее законодательство Нового курса.\n\n"
 USA_great_depression_cooldown_alternate2_tt:0 "После принятия этого закона §Y600 дней§! потребуется для разработки и готовности к подписанию нового законодательства Нового курса.\n\n"
