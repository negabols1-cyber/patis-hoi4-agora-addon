 nuclear_bonus:0 "Ядерный бонус"
 SOV_nkvd_upgrade_tooltip:1 "§YНКВД§! теперь более тесно интегрирован в нашу армию, что гарантирует высокий моральный дух солдат и веру в партию.\n"
 ger_sov_buddies_tooltip_2:0 "Это расформирует [Root.GetFactionName] и создаст фракцию §YБерлин-Москва§!.\n"
 ger_sov_buddies_tooltip:2 "§RЕсли [SOV.GetAdjective] примут наше предложение, мы потеряем немного стабильности из-за смены политики. Не стоит и говорить, что наши коллеги-фашисты и демократические державы также будут расстроены таким ходом событий.§!\n"
 purged_kalinin:0 " Репрессирован Сталиным"
 purged_khrushchev:0 " Репрессирован Сталиным"
 purged_yezhov:0 " Репрессирован Сталиным"
 purged_beria:0 " Репрессирован Сталиным"
 purge_1_group_a:0 " Репрессирован Сталиным"
