l_russian:
 POR_integrate_new_departments:0 "Интеграция новых ведомств"
 POR_new_constitution:0 "Новая многонациональная конституция"
 POR_new_constitution_desc:0 "Республика будет преобразована в империю!"
 POR_aljustrel_steel:0 "Сталь Алуштрела"
 POR_aljustrel_steel_desc:0 ""
 POR_automobiles:0 "Развитие внутреннего транспорта"
 POR_automobiles_desc:0 "После исследований иностранных военных моделей транспортных средств мы теперь можем сосредоточиться на проектировании собственных моторизованных подразделений."
 POR_tanks:0 "Новые средства ведения войны"
 POR_tanks_desc:0 "Всем известно, что в современной войне не обойтись без бронетанковых войск. Нам нужно наверстать упущенное и разработать новейшие модели этой техники."
 POR_first_four_year_plan:0 "Первый четырёхлетний план"
 POR_first_four_year_plan_desc:0 "Наша страна ещё недостаточно индустриализована. Такое состояние промышленности ставит под угрозу наши оборонительные возможности."
 POR_four_year_plan_idea:0 "Первый четырёхлетний план"
 POR_nationalism_focus:0 "Идеи национализма"
 POR_nationalism_focus_desc:0 "Португальский народ — великий народ. Исторически наша нация всегда превосходила другие народы."
 POR_integrate_minor_colonies:0 "Интеграция малых колоний"
 POR_integrate_minor_colonies_desc:0 ""
 POR_mechanisation:0 "Механизация"
 POR_mechanisation_desc:0 "Мы можем внедрить в производство новейшие технологии, полученные нашими учёными. Это значительно увеличит темпы производства на наших заводах и фабриках."
 POR_mechanisation_idea:0 "Механизация"
 WHILE_FOCUSING:0 "В процессе этого на вас будут влиять следующие эффекты:\n$EFF$"
 generic_focus:0 "Национальный фокус"
 army_effort:0 "Усилия армии"
 army_effort_desc:0 "Несмотря на растущие возможности воздушных и морских сражений, наземные войска по-прежнему являются ключевыми в грядущих войнах. Благодаря подготовке, мы можем избежать повторения ужасов окопных сражений."
 equipment_effort:0 "Усилия в области оборудования"
 equipment_effort_desc:0 "Ограничения по экипировке, которую могут нести пехотинцы, постоянно повышаются. Мы сосредоточимся на том, чтобы дать нашим войскам лучшие из имеющихся в наличии средств."
 motorization_effort:0 "Усилия в области моторизации"
 motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для обеспечения безопасной переброски пехоты на поле боя и обратно. Концентрация внимания на этих направлениях позволит нам быстро принимать меры."
 doctrine_effort:0 "Усилия в области доктрины"
 doctrine_effort_desc:0 "Военные доктрины, которые определяли наземные сражения в Первой мировой войне, устарели. Мы должны поручить лучшим из наших мыслителей задачу формирования военной мысли будущего."
 equipment_effort_2:0 "Усилия в области оборудования II"
 equipment_effort_2_desc:0 "Мы продолжим наши усилия по обеспечению нашей пехоты и подразделений поддержки лучшим из имеющегося на данный момент оборудования."
 mechanization_effort:0 "Усилия в области механизации"
 mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы можем раздвинуть границы того, какую технику можно построить сегодня."
 doctrine_effort_2:0 "Усилия в области доктрины II"
 doctrine_effort_2_desc:0 "Поле битвы изменилось не только за межвоенные годы, но и в ходе недавних конфликтов. Мы должны постоянно пересматривать наши доктрины, чтобы отразить это."
 equipment_effort_3:0 "Снабжение оружием III"
 equipment_effort_3_desc:0 "Вместо того, чтобы подражать или покупать иностранное оружие, мы должны стремиться стать мировыми лидерами в области пехотного вооружения."
 armor_effort:0 "Улучшение бронетехники"
 armor_effort_desc:0 "Применяя то, чему мы научились, механизируя нашу пехоту, мы можем также усовершенствовать наши бронемашины."
 special_forces:0 "Спецназ"
 special_forces_desc:0 "Нам нужны элитные подразделения; горные войска и парашютисты должны стать нашим приоритетом."
 aviation_effort:0 "Улучшение авиации"
 aviation_effort_tt:0 "Недостаточно строительных слотов для §Yавиабаз§!"
 aviation_effort_desc:0 "Нигде технологический прогресс не идет так быстро, как в воздушной войне. Авиация - область, которую должна освоить любая современная нация."
 fighter_focus:0 "Бойцы"
 fighter_focus_desc:0 "Мы еще увидим воздушные бои, как во время Великой войны. Сохранение лидирующих позиций в развитии истребителей даст нам преимущество в будущем."
 bomber_focus:0 "Бомбардировщики"
 bomber_focus_desc:0 "Когда люди в будущем будут говорить об ужасах сегодняшних войн, огонь с небес будет занимать видное место. Мы сделаем все возможное, чтобы эти истории рассказывали наши враги."
 aviation_effort_2:0 "Улучшение авиации II"
 aviation_effort_2_desc:0 "Дальнейшее развитие авиации необходимо для успешной интеграции наших ВВС в армию."
 CAS_effort:0 "Штурмовая авиация"
 CAS_effort_desc:0 "Современной армии необходима поддержка, в том числе и с воздуха."
 rocket_effort:0 "Ракетная программа"
 rocket_effort_desc:0 "Ракетные и реактивные двигатели открывают новые возможности для беспилотных и пилотируемых аппаратов. Разработка этих технологий позволит нам застать противника врасплох."
 NAV_effort:0 "Морские технологии"
 NAV_effort_desc:0 "Освоение новых технологий морского боя позволит нам наносить удары по вражеским конвоям."
 naval_effort:0 "Флот"
 naval_effort_tt:0 "Не хватает строительных слотов для §Yверфей§!"
 naval_effort_desc:0 "Расширение флота должно стать нашим приоритетом. Направьте все доступные ресурсы на постройку новых верфей и исследования легких надводных кораблей."
 GER_naval_effort2:0 "Развитие верфей"
 GER_naval_effort2_desc:0 "Чтобы воссоздать по-настоящему сильный флот, нам необходимо расширить наши возможности в судостроении."
 flexible_navy:0 "Маневренный флот"
 flexible_navy_desc:0 "Учет достижений в области развития подводных лодок в военно-морской войне позволит нам эффективно уничтожать вражеские конвои."
 large_navy:0 "Океанский флот"
 large_navy_desc:0 "Благодаря адаптации наших военно-морских доктрин под большие корабли и обеспечению безопасности наших торговых конвоев мы узнаем многое о том, в каких кораблях мы нуждаемся."
 submarine_effort:0 "Развитие подводных лодок"
 submarine_effort_desc:0 "Подводная война стала самым захватывающим военно-морским новшеством со времен изобретения торпедного катера. Нам было бы неплохо не просто защищаться от подводных лодок, но и использовать их против вражеского судоходства."
 cruiser_effort:0 "Развитие крейсеров"
 cruiser_effort_desc:0 "Перед тем, как отправиться в разведку для изучения передовых разработок в области линкоров, нужно заменить имеющиеся небольшие крейсеры."
 destroyer_effort:0 "Развитие эсминцев"
 destroyer_effort_desc:0 "Изучая проектирование и стратегическое применение подводных лодок, мы также научились противодействовать их стратегиям. Для этого нам понадобятся эсминцы."
 capital_ships_effort:0 "Развитие главных кораблей"
 capital_ships_effort_desc:0 "Нация, у которой будет больше всего линкоров, будет править океаном. Линкоры и авианосцы представляют собой как старые, так и новые достижения в области господства на море."
 industrial_effort:0 "Промышленный рывок"
 industrial_effort_desc:0 "Направить все наши политические усилия на развитие гражданской промышленности и сделать большой рывок вперед."
 industrial_effort_2:0 "Промышленный рывок II"
 industrial_effort_2_desc:0 "С железной волей и неустанным трудолюбием мы можем мобилизовать народ на новый великий индустриальный рывок."
 construction_effort:0 "Строительный рывок"
 construction_effort_tt:0 "Недостаточно строительных слотов для §YГражданских фабрик§!"
 construction_effort_desc:0 "Мощность гражданской промышленности нельзя недооценивать даже в условиях приближающейся войны."
 production_effort:0 "Оборонное производство"
 production_effort_tt:0 "Недостаточно свободных слотов под строительство, чтобы разместить §YВоенный завод§!"
 production_effort_desc:0 "Если вы умеете производить трактора, вы сможете производить танки! Мы не можем допустить, чтобы наша военная промышленность отставала от других."
 construction_effort_2:0 "Строительные работы II"
 construction_effort_2_desc:0 "Продолжение расширения наших фабрик позволит нам ускорить производство товаров для торговли и продолжить работы по строительству."
 production_effort_2:0 "Оборонное производство II"
 production_effort_2_desc:0 "Попытки переоборудовать гражданские заводы под производство военной техники неэффективны. Нам следует сосредоточиться на подготовке военного производства прямо сейчас."
 production_effort_3:0 "Оборонное производство III"
 production_effort_3_desc:0 "Продолжающиеся усилия по расширению наших военных фабрик необходимы для удовлетворения спроса на новое оборудование."
 infrastructure_effort:0 "Строительство инфраструктуры"
 infrastructure_effort_desc:0 "Страна без соответствующей инфраструктуры не может реализовывать масштабные проекты или строительство."
 infrastructure_effort_tt:0 "Недостаточно свободных слотов под строительство, чтобы разместить §YИнфраструктуру§!"
 synth_oil_effort_tt:0 "Недостаточно свободных слотов под строительство, чтобы разместить §YСинтетический нефтеперерабатывающий завод§!"
 infrastructure_effort_2:0 "Строительство инфраструктуры II"
 infrastructure_effort_2_desc:0 "Дальнейшее расширение нашей инфраструктуры обеспечит транспорт и связь, необходимые для реализации высокотехнологичных секретных проектов."
 construction_effort_3:0 "Третья строительная программа"
 construction_effort_3_desc:0 "Расширение нашей инфраструктурной сети существенно увеличило наши строительные возможности."
 nuclear_effort:0 "Ядерная программа"
 nuclear_effort_desc:0 "Стоя на пороге великого открытия, которое изменит весь мир, мы не можем позволить другим зажечь огонь, который однажды может уничтожить Землю."
 extra_tech_slot:0 "Дополнительный слот для исследований"
 extra_tech_slot_desc:0 "Промышленный рост и другие недавние достижения могут позволить нам проводить больше научных исследований и разработок одновременно."
 extra_tech_slot_2:0 "Второй дополнительный слот для исследований"
 extra_tech_slot_2_desc:0 "Быстрая индустриализация нашей страны открыла новые возможности в научных исследованиях и разработках, которые нам необходимо использовать."
 technology_sharing:0 "Обмен технологиями"
 technology_sharing_desc:0 "Обмениваясь технологическими достижениями с нашими союзниками, вся наша группировка сможет более эффективно проводить военные НИОКР."
 secret_weapons:0 "Секретное оружие"
 secret_weapons_desc:0 "Заманчиво тратить все дополнительные ресурсы на разработку танков и самолетов, но секрет победы в войне лежит в совершенно новых областях науки: электронике, ракетостроении и ядерных исследованиях."
 political_effort:0 "Политическая программа"
 political_effort_desc:0 "Чтобы привести мир к изменениям, мы должны быть способны принести изменения в собственную страну. Укрепление нашей политической позиции должно быть первостепенным."
 collectivist_ethos:0 "Коллективистский дух"
 collectivist_ethos_desc:0 "Наши враги могут разделять и завоевывать меньшие народы, но наш народ будет единым. Все за одного, и один за всех."
 liberty_ethos:0 "Дух свободы"
 liberty_ethos_desc:0 "В это время идеологических фанатиков, которые стремятся задушить человеческий дух, мы будем защищать индивидуальные свободы и независимость."
 militarism:0 "Милитаризм"
 militarism_desc:0 "Те, кто считают армию необходимым злом, обречены на колебания перед лицом войны. Мы привьем милитаризм нашей культуре, чтобы стать народом солдат."
 political_correctness:0 "Политическая корректность"
 political_correctness_desc:0 "Люди, придерживающиеся немного спорных или иным образом унизительных взглядов, похоже, обеспокоены тем, что против них существует широкомасштабный заговор. Это кажется отличной идеей."
 neutrality_focus:0 "Нейтральный фокус"
 neutrality_focus_desc:0 "Хотя другие могут утверждать, что для принятия участия в глобальном конфликте требуются смелость и мудрость, мы знаем, что для отказа требуется большее."
 interventionism_focus:0 "Интервенционистский фокус"
 interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только наших собственных граждан. Если предотвращение тирании означает войну, то пусть так и будет."
 military_youth:0 "Военная молодежь"
 military_youth_desc:0 "Организации по содействию дисциплине и политическому воспитанию молодежи нашей страны будут воспитывать верность и самопожертвование с раннего возраста."
 deterrence:0 "Сдерживание"
 deterrence_desc:0 "Действуя в одиночку, мы редко извлекаем выгоду из войны. К счастью, мы знаем, что лучшая защита - это та, которую так хорошо знают, что ее никогда не придется применять."
 volunteer_corps:0 "Корпус добровольцев"
 volunteer_corps_desc:0 "Заставлять наших людей умирать за идеалы свободы было бы упражнением в иронии, но создание средств для тех, кто хочет помогать людям за рубежом, таковым не является."
 paramilitarism:0 "Парамилитаризм"
 paramilitarism_desc:0 "Военные принципы находят применение и за пределами армии. С развитием полувоенных формирований, дополняющих наши вооруженные силы, больше людей получат военную подготовку."
 indoctrination_focus:0 "Индоктринация"
 indoctrination_focus_desc:0 "Утвердив нашу идеологию как основанную на истине, ее можно преподавать как истину. Образование и СМИ должны отражать этот урок."
 foreign_expeditions:0 "Зарубежные экспедиции"
 foreign_expeditions_desc:0 "Поскольку наши враги готовы вмешаться в отдаленные конфликты во имя своих идеалов, мы должны быть готовы сделать то же самое ради наших."
 why_we_fight:0 "Почему мы боремся"
 why_we_fight_effect:0 "Если у нас нет боевого духа §Yнейтральной внешней политики§! мы сможем создать фракции.\n"
 why_we_fight_desc:0 "Мир становится все более опасным. Нашему народу нужно знать об зверствах, совершаемых теми, кто жаждет власти. Пришло время сплотить людей под нашим знаменем и подготовить их к борьбе за нашу свободу."
 political_commissars:0 "Политические комиссары"
 political_commissars_desc:0 "Для обеспечения соответствия военной практики нашей политике мы введем назначаемых политических должностных лиц в ряды военнослужащих."
 internationalism_focus:0 "Фокус на интернационализме"
 internationalism_focus_desc:0 "Идеология не знает границ. Другое государство может называть себя суверенным, но наши убеждения стоят выше таких претензий."
 nationalism_focus:0 "Фокус на национализме"
 nationalism_focus_desc:0 "Наша нация уникальна, и наши политические достижения могли произойти только здесь. Мы должны бороться за это любой ценой."
 ideological_fanaticism:0 "Идеологический фанатизм"
 ideological_fanaticism_desc:0 "Наши политически установленные ценности и цели стоят того, чтобы за них умирать, как и любая древняя вера. Любой последователь должен быть готов встретить смерть, а те, кто сбиваются с пути, должны быть готовы встретить смерть."
 air_innovation:0 "Авиационные инновации"
 air_innovation_desc:0 "Современные войны невозможно выиграть без господства в воздухе. Мы должны сделать все возможное, чтобы развить военно-воздушные силы!"
 air_innovation_2:0 "Авиационные инновации II"
 air_innovation_2_desc:0 "Любое преимущество, которое мы можем получить в небе, бесценно. Мы должны сосредоточить все наши усилия на развитии наших истребителей."
 naval_air_effort:0 "Морская авиация"
 naval_air_effort_desc:0 "Эффективность воздушных ударов по морским целям была доказана американцами еще в 1921 году. Не следует пренебрегать этим родом войск, если мы намерены вести войну против морской державы."
 german_focus:0 "Немецкий национальный курс"
 GER_autobahn:0 "Рейхсавтобан"
 GER_autobahn_tt:0 "Добавить максимум §Yинфраструктуры§! в §YБранденбург§!, §YГанновер§!, §YТюрингия§! и §YФранкония§!"
 GER_autobahn_desc:1 "Проект «Рейхсавтобан» с момента его запуска в 1933 году стал грандиозным успехом. Работы по строительству позволили сократить безработицу, а широкие дороги служат памятником экономическому восстановлению Германии. Тем не менее, еще много предстоит сделать."
 GER_west_wall:0 "Западный вал"
 GER_west_wall_desc:0 "Западный вал проходит параллельно французской Линии Мажино, занимая во многом те же позиции, что и линия Зигфрида в предыдущей мировой войне. Укрепление его обороны позволит нам удерживать границу меньшими силами, высвободив дивизии для участия в возможных восточных кампаниях."
 GER_west_wall_tt:0 "§RЕсли Рейнская область ремилитаризирована, вы также получите:§!\n"
 GER_west_wall_forts:0 "Добавить §Y12 сухопутных фортов§! на границе с Францией.\n"
 GER_tactical_air_effort:0 "Усилие в области тактической авиации"
 GER_tactical_air_effort_desc:0 "Победа будет достигнута путем уничтожения вражеских сухопутных войск. Мы должны сосредоточиться на поддержке наших собственных армий посредством тактических ударов по ближним и дальним целям."
 GER_long_range_escorts:0 "Дальние эскорты"
 GER_long_range_escorts_desc:0 "Нашим тактическим и стратегическим бомбардировщикам требуются дальние эскорты, которые обеспечили бы им защиту до целевой области и обратно."
 GER_strategic_air_effort:0 "Стратегические воздушные усилия"
 GER_strategic_air_effort_desc:0 "Победы можно добиться, уничтожив промышленность противника. Мы должны сосредоточить усилия на разработке и производстве стратегических бомбардировщиков."
 GER_army_innovation:0 "Армейские инновации"
 GER_army_innovation_desc:1 "Хайнц Гудериан и другие радикальные теоретики продвигают смелые новые доктрины, подчеркивающие связь, определение "шверпунктов" и местную концентрацию общевойсковых сил. Предоставление им полной свободы может помочь избежать ужасов мясорубки Великой войны."
 GER_soviet_treaty:1 "Договор с [GER.GetTheUSSRName]"
 GER_soviet_treaty_desc:1 "Мы можем заключить новый исследовательский договор с [SOV.GetNameDef], чтобы разработать, в первую очередь, лучшие танки. Если они согласятся, мы можем снова открыть танковую школу, которую мы закрыли в Каме в 1933 году. Сотрудничество [SOV.GetAdjective] будет означать, конечно, что они также получат выгоду от нововведений..."
 GER_air_innovation_2:0 "Воздушные инновации II"
 GER_air_innovation_2_desc:0 "Задачи Министерства авиации Рейха имеют первостепенное значение. Люфтваффе должны стать самыми передовыми ВВС в мире!"
 GER_army_innovation_2:0 "Армейские инновации II"
 GER_army_innovation_2_desc:0 "Опыт, полученный на наших предприятиях в СССР, позволит нам дополнительно улучшить наши учения и вооружение. Однако на этот раз мы сохраним эти достижения для себя!"
 GER_rocketry_focus:0 "Ракетные технологии"
 GER_rocketry_focus_desc:0 "Ракетное топливо является ключом к масштабным инновациям во всех трех родах войск."
 GER_wunderwaffe:0 "Вундерваффе"
 GER_wunderwaffe_desc:0 "Гейзенберг и фон Браун не умолкая говорят об определенных идеях, которые у них есть для настоящего оружия судного дня. Им не хватает только дополнительных ресурсов..."
 GER_mol_rib_pact:1 "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc:1 "Договор о дружбе и ненападении с [GER.GetTheUSSRName] может перевернуть внутренности, но он позволит бесценной нефти поступать в Германию. Секретное приложение разделит территории Румынии, Польши, Литвы, Латвии, Эстонии и Финляндии на сферы влияния [GER.GetAdjective] и [SOV.GetAdjective]..."
 GER_mol_rib_pact_tt:1 "Заключить §Yпакт о ненападении§! с §YСоветским Союзом§! и согласиться §Yразделить Польшу§! между [SOV.GetName] и Германией\n"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST:0 "Пакт Молотова-Риббентропа"
 SOV_MOLOTOV_RIBBENTROP_NAME_EXILES:0 "Пакт о разделе Польши"
 GER_soviet_ally:1 "Альянс с [GER.GetTheUSSRName]"
 GER_soviet_ally_desc:1 "Возможно, можно отложить наши [GER.GetUSSRAllianceDesc] разногласия с [GER.GetRussiansDemonym] и вместо этого подчеркнуть то, что нас объединяет: ненависть к эгоистичному либерализму и декадентскому Западу. С [GER.GetTheUSSRName] в качестве союзника у нас будет доступ ко всем необходимым нам ресурсам - в дополнение к их военной мощи, конечно..."
 SOV_USSR_ALLIANCE_DESC_COMMUNIST:0 "идеологические"
 SOV_USSR_ALLIANCE_DESC_EXILES:0 "националистические"
 GER_turkey_puppet:0 "Марионеточная Турция"
 GER_turkey_puppet_desc:0 "Турция оказалась в тисках между нами и Советским Союзом. Если надавить на турок, они, скорее всего, подчинятся нашей воле и станут марионеточным государством. В рамках сделки СССР получит территорию в восточной Турции. Однако если они отклонят наши требования, это будет означать войну."
 GER_rhineland:0 "Рейнская область"
 GER_rhineland_desc:0 "Рейнская область была демилитаризована после окончания Великой войны, но это оскорбление больше не будет терпеться! Германия - суверенная нация и вольна перемещать войска в любые точки в пределах своих границ!"
 GER_rhineland_ultimatum:0 "§RВоенная оккупация может быть отменена, если вы столкнетесь с сопротивлением и отступите.§!\n"
 GER_japan_friend:0 "Подружиться с Японией"
 GER_japan_friend_desc:0 "Мы долгое время поддерживали плодотворные отношения с Китаем, но наши амбиции могут быть лучше удовлетворены, если мы вместо этого объединимся с родственной нам воинской культурой Японии, даже если это означает бросить Китай на произвол судьбы..."
 GER_japan_friend_tt:0 "Отзывает фон Фалькенхаузена.\n"
 GER_china_friend:0 "Подружиться с Китаем"
 GER_china_friend_desc:0 "Укрепим нашу давнюю дружбу с Китаем. Это оттолкнет Японию, но что такое Япония, как не просто Италия Востока?"
 GER_anti_comitern_pact:0 "Антикоминтерновский пакт"
 GER_anti_comitern_pact_desc:0 "Вмешательство Коминтерна во внутренние дела стран не только ставит под угрозу их внутренний мир и социальное благополучие, но и является угрозой для мира во всем мире! Мы попросим многие некоммунистические страны подписать пакт и убедимся, что держим красный бич под контролем."
 GER_anti_soviet_pact:0 "Антисоветский пакт"
 GER_anti_soviet_pact_desc:0 "Мы можем сделать Антикоминтерновский пакт на шаг дальше и попросить всех участников заключить коалицию против Советского Союза. Если какой-либо участник окажется в состоянии войны с СССР, все остальные участники также должны объявить войну."
 GER_anti_soviet_pact_tt:0 "§YSоветует всем участникам Антикоминтерновского пакта вступить в оборонительный альянс против Советского Союза.§!"
 GER_anti_soviet_pact_tt_2:0 "§Y Оборонительный альянс призовет участников к войне, если один из них подвергнется нападению Коминтерна§!"
 GER_anti_soviet_pact_tt_3:0 "Получает национальный дух §YАнтисоветский пакт§!.\n"
 GER_ussr_war_goal:1 "Война с [GER.GetTheUSSRName]"
 GER_ussr_war_goal_desc:1 "Мы можем сосредоточить наши пропагандистские усилия на подготовке немецкого народа - и всего мира - к праведной войне против [SOV.GetNameDef]."
 GER_turkey_friend:0 "Подружиться с Турцией"
 GER_turkey_friend_desc:0 "Турция Ататюрка движется по достойному пути к модернизации, и контролирует доступ к Черному морю через Босфор и Дарданеллы. Привлечение Турции в нашу сферу влияния должно быть нашим главным приоритетом!"
 GER_anschluss:0 "Аншлюс"
 GER_anschluss_desc:0 "Аншлюс, или объединение с Австрией, давно является целью немецкого народа. Хотя Версальский договор запрещал это, пришло время наконец-то воплотить его в жизнь. Давайте предложим австрийцам возможность разделить нашу славную судьбу!"
 GER_anschluss_eq_trigger_tt:0 "Более §Y30000§! единиц пехотного оборудования в армии"
 anschluss_mefo_bills_tt:0 "Использует австрийское золото для снижения стоимости §Yвекселей MEFO§!.\n"
 anschluss_mefo_bills_double_reduction:0 "Изменение §Yвекселей MEFO§! на §G+0.10§! Ежедневный прирост политической власти\n"
 GER_demand_memel:0 "Восстановить восточные требования"
 GER_demand_memel_desc:0 "В результате Великой войны Германия потеряла значительные территории на Востоке с восстановлением Польши и передачей Мемеля Литве. Ультиматум будет направлен обоим государствам, но Польша, по крайней мере, вряд ли уступит только словам."
 GER_demand_memel_threat:0 "Германия восстановила восточные требования"
 GER_danzig_or_war:0 "Данциг или война"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] должен одобрить соглашение, чтобы бонусы вступили в силу. Они покинут [Root.GetFactionName], если будет объявлена война.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] должны одобрить соглашение, чтобы бонусы вступили в силу. Вы покинете фракцию [Root.GetFactionName], если будет объявлена война.§!\n"
 GER_danzig_or_war_desc:0 "Данциг был немецким, Данциг останется немецким, и Данциг должен быть немецким отныне и вовеки! Если Польша не уступит территорию, мы должны подготовить немецкий народ к неизбежной войне. Данциг и окружающие земли вернутся в состав Германии!"
 GER_czech_friend:0 "Подружиться с Чехословакией"
 GER_czech_friend_desc:0 "Чехи и словаки — работящий и достойный уважения народ. К сожалению, наши территориальные амбиции вступают в конфликт с их амбициями, но еще не поздно установить дружеские отношения, а не подчинить их себе."
 GER_demand_sudetenland:0 "Потребовать Судетскую область"
 GER_demand_sudetenland_desc:0 "Судьба судетских немцев стала одной из самых чудовищных несправедливостей, навязанных Версальским договором. Они должны быть взяты под нашу защиту, независимо от возражений Чехии."
 GER_demand_sudetenland_threat:0 "Германия потребовала Судетскую область"
 GER_first_vienna_award:0 "Первый Венский арбитраж"
 GER_first_vienna_award_desc:0 "Венгры были одним из наиболее пострадавших народов после Великой войны. В результате распада Австро-Венгерской империи многие венгры оказались на чужбине, хотя их предки жили там веками. Мы могли бы значительно улучшить отношения с Венгрией, передав ей часть территорий Чехословакии."
 GER_end_of_czechoslovakia:0 "Судьба Чехословакии"
 GER_end_of_czechoslovakia_desc:0 "Пришло время разделить старые земли Чехии между теми, кто сможет ими должным образом управлять. Следует также рассмотреть возможность создания отдельного марионеточного словацкого государства на востоке."
 end_of_czechoslovakia_mefo_bills_tt:0 "Использует чехословацкое золото для снижения стоимости §Yвекселей МЕФО§!."
 GER_second_vienna_award:0 "Второй Венский арбитраж"
 GER_second_vienna_award_desc:0 "В Трансильвании преобладает венгерское население, и по праву она должна принадлежать нашим друзьям из Венгрии. Однако трудно сказать, как на это требование отреагируют румынский режим и народ."
 GER_italy_ally:0 "Союз с Италией"
 GER_italy_ally_desc:0 "Итальянцы, возможно, ненадежны, как они доказали в Великой войне, но Муссолини и его фашистское движение показали, что для Италии еще есть надежда. Безусловно, Германии выгодно заключить союз с Италией, не так ли?"
 GER_nationalist_spain_ally:0 "Союз с Испанией"
 GER_nationalist_spain_ally_desc:0 "Победа националистов в гражданской войне в Испании открыла путь к более тесным отношениям между нашими двумя странами. Франко владеет ключом к Средиземному морю."
 GER_nationalist_spain_ally_tt:0 "Улучшает дипломатические отношения с §YНационалистической Испанией§!"
 GER_danzig_vs_slovakia:0 "Данциг за Словакию"
 GER_danzig_vs_slovakia_desc:0 "Поляки стоят на пути наших планов по завоеванию жизненного пространства. Тем не менее еще не поздно изменить наши долгосрочные приоритеты и вместо этого искать их дружбы. Единственный возможный способ добиться этого - обмен территориями: Данциг на Словакию. Польша уже проявила некоторый интерес к региону, оккупировав Заользе."
 GER_poland_friend:0 "Завести дружбу с Польшей"
 GER_poland_friend_desc:0 "Хотя у Польши больше нет выхода к морю, мы продемонстрировали свои добрые намерения, передав им Словакию. Возможно, мы сможем еще больше сблизиться с ними, давая неопределенные обещания будущих территориальных приобретений на востоке."
 GER_war_with_france:0 "Война с Францией"
 GER_war_with_france_desc:0 "Теперь, когда Германия нашла удовлетворительное решение вопроса о ее восточной границе, сейчас самое время обратить наше внимание на запад. Потеря Эльзаса и Лотарингии - это пятно на чести немецкого народа, и только через справедливую и праведную войну мы сможем отомстить за это."
 GER_war_with_france_threat:0 "Притязания на французские территории"
 GER_operation_tannenbaum:0 "Операция Tannenbaum"
 GER_operation_tannenbaum_desc:0 "Швейцария обладает самыми отвратительными людьми и политической системой. Теперь у нас наконец появилось время заняться этими смертельными врагами новой Германии."
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Реинтеграция Люксембурга и Эльзаса и Лотарингии"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "После успешного отвоевания исторически немецких областей мы можем начать их реинтеграцию в [Root.GetName]. Их население должно получить возможность выполнить патриотический долг перед отечеством."
 GER_naval_rearmament:0 "Перевооружение флота"
 GER_naval_rearmament_desc:0 "Англо-германское морское соглашение 1935 года дает нам возможность значительно расширить наш флот. Нам следует приложить к этому все усилия."
 GER_plan_z:0 "План Z"
 GER_plan_z_desc:0 "Адмирал Редер считает, что нанести поражение Британии лучше всего с помощью политики атаки надводных кораблей. Строительство достаточного количества линкоров и авианосцев для этого — масштабная задача, на выполнение которой уйдет время, возможно слишком много времени... С другой стороны, нынешнее состояние наших надводных сил жалко неадекватно."
 GER_u_boat_effort:0 "Усилия подлодок"
 GER_u_boat_effort_desc:0 "Капитан цур зее Дениц выступает за стратегию неограниченной подводной войны как лучший способ поставить Великобританию на колени. При наличии достаточного количества подводных лодок мы, возможно, сможем лишить британскую промышленность всех необходимых ресурсов ее отдаленной империи."
 GER_trade_interdiction:0 "Препятствие торговле"
 GER_trade_interdiction_desc:0 "Наши верфи загружены выпуском подводных лодок, но нам необходимо разработать более эффективные способы использования этих "волчьих стай". Предоставить адмиралам все необходимое для проведения их симуляций и военных игр..."
 GER_modular_construction:0 "Модульное строительство"
 GER_modular_construction_desc:0 "Ускоряет строительство и сборку подводных лодок за счёт распределения производства деталей по разным предприятиям."
 GER_denmark_friend:0 "Подружиться с Данией"
 GER_denmark_friend_desc:0 "Дипломатия канонерок ещё не умерла. Наши планы по расширению военно-морского флота хорошо известны нашему маленькому северному соседу. Мы легко можем запугать их в свою сферу влияния, ведь у нас значительно превосходящая армия."
 GER_norway_friend:0 "Подружиться с Норвегией"
 GER_norway_friend_desc:0 "Норвегия контролирует большую часть драгоценного экспорта железной руды с обширных рудников на севере Швеции. Мы должны запугать их в \"дружественные\" отношения угрозой расширения нашего военно-морского флота."
 GER_dutch_friend:0 "Подружиться с Нидерландами"
 GER_dutch_friend_desc:0 "Голландцы прекрасно знают, как долго они продержатся в случае новой мировой войны. Если их убедить, что Германия может действительно представлять угрозу самой Великобритании, то возможно они решат заключить с нами альянс, чтобы избежать суровой оккупации."
 GER_sweden_friend:0 "Подружиться со Швецией"
 GER_sweden_friend_desc:0 "Скандинавские страны похожи на домино: они стоят и падают вместе. Когда Норвегия и Дания в нашей сфере, Швеция обязательно последует за ними."
 GER_improve_national_spirit:0 "Улучшить национальный дух"
 GER_improve_national_spirit_desc:0 "С крупными городами стран-победителей в наших руках, мы можем наконец отбросить тень нашего поражения. Для Германии наступает новая эпоха!"
 GER_improve_national_spirit_tooltip:0 "Мы или наши члены Фракции должны контролировать Лондон и Париж и штаты, в которых они находятся."
 needs_approval:0 "§R[This.GetName] должно одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 GER_demand_slovenia:0 "Требование Словении"
 GER_demand_slovenia_threat:0 "Германия потребовала Словению"
 GER_demand_slovenia_desc:0 "По Сен-Жерменскому договору многие исторические австрийские территории были переданы государств-преемникам. С Австрией, вновь объединенной с германской нацией, пришло время положить конец этой несправедливости. Исторические провинции Крайна и Штирия, которые сейчас известны как Словения, должны быть возвращены домой."
 GER_first_ljubljana_award:0 "Первая Люблянская премия"
 GER_first_ljubljana_award_desc:0 "Лицемерные западные державы проповедовали национальное самоопределение, одновременно передавая многие меньшинства под власть сербов. Мы можем исправить эту историческую несправедливость и в то же время обрести друзей. Для тех, кто желает встать на нашу сторону в европейском порядке, мы можем быть очень щедрыми."
 GER_first_ljubljana_award_tt:0 "Все оригинальные [YUG.GetAdjective] основные государства принадлежат либо §Y[YUG.GetName]§! либо любому из его подданных.\n"
 GER_fate_of_yugoslavia:0 "Судьба Югославии"
 GER_fate_of_yugoslavia_desc:0 "Югославское государство всегда было искусственным образованием, и центральная власть начала рушиться. Мы должны вмешаться, чтобы восстановить порядок. Единственный вопрос, с которым мы сталкиваемся, это как лучше всего это сделать."
 yugoslavia_mefo_bills_tt:0 "Использует югославское золото, чтобы уменьшить стоимость §Yмефовекселей§!.\n"
 GER_second_ljubljana_award:0 "Второй Люблянский арбитраж"
 GER_second_ljubljana_award_tt:0 "Событие дает возможность потребовать земли для [Root.GetName] или достойного союзника."
 GER_second_ljubljana_award_desc:0 "С разрешением югославского вопроса пришло время обратить наше внимание на Грецию. Они тоже несправедливо были обогащены союзниками. Пришло время выяснить, кто наши настоящие друзья."
 GER_war_with_greece:0 "Война с Грецией"
 GER_war_with_greece_desc:0 "Поскольку Греция уже воюет, было бы стыдно для Германии упустить базу в Восточном Средиземноморье."
 GER_fate_of_greece:0 "Судьба Греции"
 GER_fate_of_greece_desc:0 "Греция доказала, что не может справиться с новыми силами, обрушившимися на Европу. Пора предложить им защиту, которую может обеспечить только Германия."
 GER_weserubung:0 "Операция «Везерюбунг»"
 GER_weserubung_desc:0 "Норвегия является важным стратегическим пунктом и будет очевидной точкой атаки для любого противника, желающего нарушить нашу торговлю сталью со Швецией. Мы не можем рисковать, чтобы наши враги создавали базы в этом регионе. Чтобы получить хорошую зону сосредоточения для вторжения в Норвегию, нам сначала нужно двинуться на Данию."
 GER_weserubung_tt: "\nПолный контроль над §Y[144.GetName]§! позволит нам ежемесячно получать высокосортную руду из §Y[SWE.GetName]§! через §YNarvik§!. Это приведет к появлению одной дополнительной §Yгражданской фабрики в открытом море§! каждые 6 месяцев, вплоть до 8 таких фабрик в общей сложности. Эти поставки могут быть прекращены в случае потери контроля над §Y[144.GetName]§!. Если [ENG.GetNameDefCap] успешно вторгнется в [SWE.GetName] и разрушит шахты, либо если [SWE.GetNameDef] взорвет их самостоятельно, гражданские фабрики будут безвозвратно потеряны. Поставки можно будет возобновить, если шахты начнут снова функционировать"
 GER_weserubung_tt_complete: "Полученные в настоящее время гражданские фабрики в открытом море за счет контроля над §YNarvik§!: §G[?GER_narvik_civs]§!\nПрогресс отправки до следующей фабрики: [?GER_narvik_shipments]/6"
 GER_around_maginot:0 "Вокруг Мажино"
 GER_around_maginot_desc:0 "Чтобы обеспечить себе тактическое преимущество перед Францией, нам нужно иметь возможность атаковать ее со всех сторон. Они не ожидают атаки с севера, и именно оттуда мы и ударим, когда расправимся с несколькими препятствиями."
 italian_focus:0 "Национальный итальянский фокус"
 GER_danzig_or_war_POL_civil_war:0 "Захватить Данциг в обмен на поддержку"
 GER_danzig_trigger_polish_civil_war:0 "В Польше гражданская война, и должно выполняться одно из следующих условий\n   Германия отправила добровольцев на поддержку одной из сторон\n   Одна из сторон состоит в фракции с Германией"
 GER_alone_or_peace_faction_tt:0 "не состоит ни в одной фракции или состоит в фракции, которая находится в мире с [GER.GetNameDef]."
 GER_four_year_plan:0 "Четырехлетний план"
 GER_four_year_plan_desc:0 "Нам нужен амбициозный план для обеспечения перевооружения и конечной самодостаточности нации. Этого следует добиться в течение следующих четырех лет."
 GER_atlantikwall:0 "Атлантический вал"
 GER_atlantikwall_desc:0 "Теперь, когда мы завоевали Западную Европу, мы должны укрепиться против возможного натиска через Атлантический океан. Огромная сеть укреплений вдоль берегов Европы должна обеспечить нам надежную защиту."
 atlantikwall_tooltip:1 "Разместить §YПрибрежные форты§! в каждом из следующих прибрежных атлантических штатов, которые полностью контролируются вами:\n"
 atlantikwall_tooltip_2:0 "§YАквитания§!\n§YПуату§!\n§YLуара§!\n§YБретань§!\n§YNормандия§!\n§YПа-де-Кале§!\n§YФландрия§!\n§YГолландия§!\n§YFрисландия§!\n§YВезер-Эмс§!\n§YГанновер§!\n§YШлезвиг-Гольштейн§!\n§Ютландия§!\n§YЭстланнет§!\n§YВестланнет§!\n§YTронделаг§!\n§YNурланн§!\n"
 GER_ostwall:0 "Восточный вал"
 GER_ostwall_desc:0 "Несмотря на наши достижения на Востоке, мы должны обеспечить, что в случае изменения ситуации мы сможем сдержать наступление врага. Мы должны построить линию укреплений, позицию Пантер-Вотан, вдоль реки Днепр, от Черного моря до Балтийского."
 GER_ostwall_forts:1 "Разместите §YНаземные форты§! вдоль реки Днепр до Балтики, в каждом из следующих штатов, которые полностью контролируются вашей фракцией:\n"
 GER_ostwall_forts_2:0 "§YTарту§!\n§YПсков§!\n§YНевель§!\n§YВитебск§!\n§YМинск§!\n§YБобруйск§!\n§YМозырь§!\n§YКиев§!\n§YЧеркассы§!\n§YDнепропетровск§!\n§YЗапорожье§!\n"
 GER_ostwall_tt:0 "Под контролем участника нашей фракции.\n"
 GER_autarky:0 "Автаркия"
 GER_autarky_desc:0 "Чтобы Германия стала действительно великой, она должна быть самодостаточной. Мы должны более эффективно использовать наши ресурсы и повысить эффективность нашего строительства."
 GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc:0 "Мы должны освободиться от непостоянного влияния частных капиталистов. Поэтому мы создадим под нашим контролем промышленный конгломерат, чтобы контролировать рост в горнодобывающем и сталелитейном секторах, поскольку это станет основой нашей военной промышленности."
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Hermann Göring-Werke"
 GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "Kaiser-Werke"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "VEB Vereinigte Maschinenwerke"
 GER_HERMANN_GORING_WERKE_NAME:0 "Государственная промышленность"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc:0 "Мы позволим нашим гражданам покупать свой будущий «народный автомобиль» по сберегательной схеме, которую, в свою очередь, будем использовать для финансирования строительства фабрик, которые в конечном итоге будут способствовать созданию этих автомобилей."
 GER_KDF_WAGEN_NAME:0 "KdF-Wagen"
 GER_KAISER_WAGEN_NAME:0 "Wilhelm-Wagen"
 GER_VOLKS_WAGEN_NAME:0 "Volkswagen"
 GER_coal_liquidization:0 "Сжижение угля"
 GER_coal_liquidization_desc:0 "Германия испытывает нехватку нефти, и нам следует усилить наши усилия по созданию синтетической нефти."
 GER_synthetic_rubber:0 "Синтетический каучук"
 GER_synthetic_rubber_desc:0 "Для широкомасштабной моторизации и авиации требуется огромное количество каучука, источники которого у нас отсутствуют. Мы должны улучшить способы его синтетического производства."
 GER_german_war_economy:0 "Немецкая военная экономика"
 GER_german_war_economy_desc:0 "Наш великий народ должен быть направлен на удовлетворение военных нужд. Мы перейдем к тотальной военной экономике, в которой от каждого человека ожидают выполнения своей роли."
 GER_grosraumwirtschaft:0 "Großraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "Мы должны подготовить Германию к ее предназначению в качестве центральной части Европы. Наша инфраструктура свяжет запад с востоком, а юг с севером."
 GER_align_hungary:0 "Наладить отношения с Венгрией"
 GER_align_hungary_desc:0 "Венгрия уже находится в нашей сфере влияния, но мы могли бы легко перетянуть ее на свою сторону, сделав ее в будущем еще более послушной."
 GER_align_romania:0 "Наладить отношения с Румынией"
 GER_align_romania_desc:0 "Румыния уже находится в нашей сфере влияния, но мы могли бы легко перетянуть ее на свою сторону, сделав ее в будущем еще более послушной."
 GER_integrate_war_economies:0 "Интегрировать военную экономику"
 GER_integrate_war_economies_desc:0 "Нации в нашей сфере влияния слишком сильно зависят от нас в экономическом плане. Мы могли бы воспользоваться этим, чтобы усилить контроль над их экономиками и влиять на их внешнюю политику."
 GER_integrate_war_economies_tt:2 "Если §Y[HUN.GetName]§! состоят во фракции с §Y[Root.GetName]§!, добавить каждому по §Y4 военных завода§! в §Y[Root.GetName]§! и §Y[HUN.GetName]§!, и §Y[HUN.GetName]§! становится марионеткой §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt2:2 "Если §Y[ROM.GetName]§! состоят во фракции с §Y[Root.GetName]§!, добавить каждому по §Y4 военных завода§! в §Y[Root.GetName]§! и §Y[ROM.GetName]§!, и §Y[ROM.GetName]§! становится марионеткой §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] должны одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] должны одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 GER_form_the_reichskommissariats:0 "Сформировать рейхскомиссариаты"
 GER_form_the_reichskommissariats_desc:0 "Чтобы улучшить использование местных ресурсов, промышленности и рабочей силы, мы должны создать квазиавтономные правительства на захваченных территориях."
 GER_reichskommissariats_tt:0 "Позволяет формировать зависимые государства на захваченных территориях.\n"
 GER_oppose_hitler:0 "Противиться Гитлеру"
 GER_oppose_hitler_desc:0 "Правлению Гитлера должен прийти конец. Он собирается спровоцировать Западные державы путем ремилитаризации Рейнской области, но это даст нам необходимый повод для захвата власти при поддержке лояльных элементов вермахта."
 GER_oppose_hitler_civil_war:0 "§RСторонники фашистов развяжут гражданскую войну.§!\n"
 GER_secure_the_new_state:0 "Обеспечить безопасность нового государства"
 GER_secure_the_new_state_desc:0 "С учетом гражданской войны, в результате которой оно образовалось, у временного правительства недостаточно власти. Мы должны обеспечить его безопасность и не дать ему легко свергнуться."
 GER_clamp_down_on_fascism:0 "Бороться с фашизмом"
 GER_clamp_down_on_fascism_desc:0 "За последние несколько лет нацистского режима угнетательская, диктаторская и антимонархическая природа правительства и его фашистских идеологов и сторонников стала очевидной. Мы должны гарантировать, что их образ мыслей будет подавлен, где бы он ни возник."
 GER_revive_the_kaiserreich:0 "Восстановить Кайзеровскую империю"
 GER_revive_the_kaiserreich_desc:0 "События последнего десятилетия показали, что демократия слишком слаба, чтобы удерживать зловещие внутренние элементы в узде. Мы должны вернуться к сильному руководству Кайзера, и в преддверии его возвращения мы должны вернуть конституцию к конституции Германской империи."
 GER_revive_the_kaiserreich_tt:0 "§YНемецкая военная хунта§! будет известна как §YГерманская империя§!.\n"
 GER_mackensen_dead:0 "Фон Макензен мертв."
 GER_rebuild_the_nation:0 "Восстановить нацию"
 GER_rebuild_the_nation_desc:1 "После опустошения гражданской войны, мы должны сосредоточиться на восстановлении нашего государства. Мы попросим людей пожертвовать своим личным комфортом на некоторое время, чтобы мы могли направить все наши ресурсы на достижение этой цели."
 GER_fan_the_prussian_militarism:0 "Продвигать прусский милитаризм"
 GER_fan_the_prussian_militarism_desc:0 "Чтобы восполнить потери нашей гражданской войны, мы должны воззвать к прусскому чувству милитаризма, чтобы улучшить набор и обучение новых рекрутов. То, что наши военные освободили нас от нацистской диктатуры, гарантирует, что эти прусские идеалы сейчас более популярны, чем когда-либо."
 GER_a_new_and_better_germany:0 "Новая и лучшая Германия"
 GER_a_new_and_better_germany_desc:0 "Восстанавливая нашу нацию, мы должны стремиться превзойти то, что необходимо, так, чтобы то, что мы построим сейчас, выдержало испытание временем."
 GER_bulwark_against_bolshevism:1 "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc:1 "Наша нация стоит щитом против [GER.GetBulwarkBolshevismDesc], защищая Запад от влияния [GER.GetBulwarkCommunismDesc]. Мы должны с гордостью нести эту ношу и быть готовы применить оружие, если это необходимо."
 GER_bulwark_against_bolshevism_tt:1 "§RЭтот национальный дух будет потерян, если вы состоите в фракции с, или воюете на той же стороне, что [SOV.GetNameDef].§!\n"
 SOV_BULWARK_NAME_COMMUNIST:0 "Оплот против большевизма"
 SOV_BULWARK_NAME_FASCISM:0 "Крепость против фашизма"
 SOV_BULWARK_NAME_NEUTRALITY:0 "Редут против России"
 SOV_BULWARK_BOLSHEVISM_DESC_COMMUNIST:0 "Большевизм"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM:0 "фашизм"
 SOV_BULWARK_BOLSHEVISM_DESC_NEUTRALITY:0 "русский империализм"
 SOV_BULWARK_COMMUNISM_DESC_COMMUNIST:0 "коммунизм"
 SOV_BULWARK_COMMUNISM_DESC_FASCISM:0 "фашизма"
 SOV_BULWARK_COMMUNISM_DESC_NEUTRALITY:0 "России"
 GER_return_of_the_kaiser:0 "Возвращение кайзера"
 GER_return_of_the_kaiser_desc:0 "Кайзеррейху нужен кайзер, и Вильгельм II все еще жив, в изгнании в Нидерландах. Мы снимем его изгнание и пригласим вернуться, чтобы занять трон, несмотря на то, что могут подумать западные демократии."
 GER_focus_on_the_true_enemy:0 "Сосредоточьтесь на настоящем враге"
 GER_focus_on_the_true_enemy_desc:0 "Наш враг не внутри, а снаружи. Продолжающееся преступление западной колониальной монополии лишь затмевается несправедливостью Версальского договора, которому мы подверглись после того, как попытались занять свое место на солнце. Теперь все закончится."
 GER_rebuild_the_high_seas_fleet:0 "Воссоздание Флота Открытого Моря"
 GER_rebuild_the_high_seas_fleet_desc:0 "Нам нужна программа массового строительства флота, чтобы восстановить наш некогда славный Флот Открытого Моря, если мы когда-нибудь сможем успешно бросить вызов Западу."
 GER_our_place_in_the_sun:0 "Наше место под солнцем"
 GER_our_place_in_the_sun_desc:0 "Дайте всем знать, что Германская Империя в очередной раз подтверждает свое право занять место под солнцем! Наш народ больше не будет унижен в тени."
 GER_pride_of_the_modern_germany:0 "Гордость современной Германии"
 GER_pride_of_the_modern_germany_desc:0 "У нас уйдут годы, чтобы сравняться с Британским королевским флотом по размерам. Поэтому мы должны превзойти его в качестве. Наши корабли будут самыми современными и мощными, что когда-либо бороздили моря!"
 GER_prepare_for_the_next_blockade:0 "Подготовиться к следующей блокаде"
 GER_prepare_for_the_next_blockade_desc:0 "Проклятая британская блокада стала причиной нашего поражения в прошлой войне. Мы не повторим ту же ошибку. На этот раз мы предпримем еще большие усилия, чтобы подготовить население к тому, что предстоит."
 GER_break_the_anglo_french_colonial_hegemony:0 "Разрушить англо-французскую колониальную гегемонию"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Пришло время разрушить монополию, которую Запад держал на колониализме в течение слишком долгого времени."
 flag_franco_british_union:0 "Франко-британский союз"
 GER_schlieffen_once_more:0 "Шлиффен снова"
 GER_schlieffen_once_more_desc:0 "Мажино должен быть обойден. Мы снова пройдем через Бельгию и Люксембург в стремительном ударе для победы."
 GER_reinstate_imperial_possessions:0 "Восстановить имперские владения"
 GER_reinstate_imperial_possessions_desc:0 "Успешно отвоевав исторически немецкие территории, мы можем теперь начать процесс их восстановления в состав [Root.GetName] в качестве полноправных провинций. Последнее позорище Версаля наконец исправлено!"
 GER_crossing_the_atlantic:0 "Пересекая Атлантику"
 GER_crossing_the_atlantic_desc:0 "Победив всех, кто сопротивлялся нашей власти на континенте, мы должны переключить свои усилия на производство гигантских военно-морских сил, чтобы отвезти войну к британцам и американцам. Мы не будем отдыхать “... пока, по божьей милости, Старый мир со всем своим могуществом не восстанет для унижения и порабощения нового мира\""
 GER_crossing_the_atlantic_2_factories_tt:0 "Уберите §Y2 военных завода§! вглубь страны с каждого прибрежного штата, получающего эти доки.\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "Уберите §Y1 военный завод§! вглубь страны с каждого прибрежного штата, получающего эти доки.\n"
 GER_the_central_powers:0 "Центральные державы"
 GER_the_central_powers_desc:0 "Нам нужны союзники, чтобы противостоять Западу. Мы создадим собственную фракцию, чтобы выступить против угнетения со стороны демократий."
 GER_prepare_italian_coup:0 "Подготовить переворот в Италии"
 GER_prepare_italian_coup_desc:0 "Падение Италии в фашизм должно быть остановлено. Мы выступим с предложением переворота к итальянским роялистам и окажем им поддержку."
 GER_prepare_italian_coup_tt:0 "Если они примут наше предложение:\n"
 GER_assassinate_mussolini:0 "Убить Муссолини"
 GER_assassinate_mussolini_desc:0 "Пришло время покончить с главой итальянского фашизма. Немцы убьют его, после чего итальянские роялисты быстро захватят власть."
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! отвергли предложение об устранении"
 GER_rekindle_imperial_sentiment:0 "Восстановить имперские настроения"
 GER_rekindle_imperial_sentiment_desc:0 "Хотя Австро-Венгерская империя развалилась после Великой войны, те, кто скорбит по ушедшей империи, еще могут быть найдены. Мы будем развивать эти имперские настроения в надежде, что государства-преемники решат воссоединиться для собственной силы."
 GER_rekindle_imperial_sentiment_tt:0 "Когда поддержка неприсоединившихся стран достаточно высока, это позволяет этим странам принять решения о реформировании Австро-Венгерской империи и присоединении к Центральным державам.\n"
 GER_expatriate_the_communists:0 "Изгнать коммунистов"
 GER_expatriate_the_communists_desc:0 "Внутренняя угроза коммунизма продолжает терзать нашу нацию. Мы должны избавиться от него, куда бы ни бежали сторонники."
 GER_accept_british_naval_dominance:0 "Принять британское военно-морское превосходство"
 GER_accept_british_naval_dominance_desc:0 "Для борьбы с коммунизмом нам нужны союзники, и британцы являются главным кандидатом. Мы развеем их опасения, признав их превосходство на море и отказавшись от любого крупного морского строительства в интересах улучшения отношений."
 GER_ally_the_shade:0 "Альянс с тенью"
 GER_ally_the_shade_desc:0 "Если мы не можем занять их место под солнцем, то мы должны объединиться с теми, кто отбрасывает на нас тень."
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Карт-бланш для Эльзаса и французских колоний"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Мы должны попросить нашего нового союзника разрешить нам свободно господствовать при возвращении наших законных территорий Эльзас-Лотарингия и нашей справедливой доли африканских колоний."
 GER_bypass_maginot_in_the_south:0 "Обойти линию Мажино на юге"
 GER_bypass_maginot_in_the_south_desc:0 "Британцы имеют свои интересы в Нидерландах, поэтому мы должны искать альтернативные пути в обход линии Мажино. Юг, хотя он гористый и труднопроходимый, должен нам подойти. Немецкая изобретательность поможет нам."
 GER_see_to_the_eastern_front:0 "Укрепить Восточный фронт"
 GER_see_to_the_eastern_front_desc:0 "Если мы чему-то и научились во время Великой войны, так это тому, что мы должны подготовиться к нападению на наши отдаленные восточные владения. Эти владения должны быть восстановлены и укреплены для защиты от вторжения."
 GER_see_to_the_eastern_front_tt:1 "Добавить 6 §YСухопутных фортов§! в 3 провинциях на восточной границе.\n"
 GER_see_to_the_eastern_front_tt2:1 "Добавить 8 §YСухопутных фортов§! в 4 провинциях на восточной границе.\n"
 GER_danzig_for_guarantees:0 "Данциг в обмен на гарантии"
 GER_danzig_for_guarantees_desc:2 "Поляки, конечно, должны чувствовать опасность от [GER.GetDanzigGuaranteesBolsheviksDesc]. Возможно, мы могли бы прийти к соглашению о возвращении Данцига, Познани и Силезского воеводства в обмен на гарантии военной поддержки в случае вторжения [GER.GetDanzigGuaranteesRedsDesc]."
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_COMMUNIST:0 "большевиков"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_FASCISM:0 "фашистов на Востоке"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_NEUTRALITY:0 "русских"
 SOV_DANZIG_GUARANTEES_REDS_DESC_COMMUNIST:0 "красных"
 SOV_DANZIG_GUARANTEES_REDS_DESC_NEUTRALITY:0 "с Востока"
 GER_safeguard_the_baltic:0 "Обеспечить безопасность Балтики"
 GER_safeguard_the_baltic_desc:1 "Балтийские государства были частью Российской империи до нескольких десятилетий назад, и есть основания полагать, что [GER.GetRussiansDemonym] могут еще раз попытаться их аннексировать. Мы должны этому воспрепятствовать и предложить нашу военную поддержку в случае [SOV.GetAdjective] вторжения."
 GER_support_the_finns:0 "Поддержка финнов"
 GER_support_the_finns_desc:1 "Финны оказались на линии огня [GER.GetRussiansDemonym]. Мы предложим им гарантии против коммунистической угрозы и окажем им скромную промышленную помощь."
 GER_anti_comintern_pact_unaligned:0 "Идеологическая защита"
 GER_anti_comintern_pact_unaligned_desc:0 "Военная угроза не единственная опасность, с которой мы столкнулись. Мы должны найти способы держать коммунизм в узде и с этой целью мы создадим пакт с нашими товарищами-антикоммунистами, чтобы совместно бороться с его продвижением."
 GER_anti_soviet_pact_unaligned:1 "Официально оформить Договор"
 GER_anti_soviet_pact_unaligned_desc:1 "Мы должны подготовиться к военному конфликту с коммунизмом, предложив всем подписантам антикоминтерновского пакта согласиться с дополнительным пунктом, требующим военной поддержки против любой советской агрессии. Поскольку мы уже взяли на себя обязательства друг перед другом во многих отношениях, это должно быть не более чем формальностью."
 GER_tackle_the_communist_threat:1 "Уничтожить [GER.GetTackleCommunistThreatName] угрозу"
 GER_tackle_the_communist_threat_desc:1 "Пока существует [SOV.GetNameDef], он будет представлять угрозу для нас. Вместо того, чтобы ждать их атаки, мы возьмем инициативу в свои руки."
 SOV_TACKLE_COMMUNIST_THREAT_NAME_COMMUNIST:0 "Коммунист"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_EXILES:0 "Восточный"
 GER_the_iberian_problem:0 "Иберийская проблема"
 GER_the_iberian_problem_desc:0 "Бастионы коммунизма все еще остаются. Мы должны удостовериться, что все они будут уничтожены, начав с коммунистической Испании."
 GER_spain_wargoal_tt:0 "Получает цель войны §YАннексия§! против §YРеспубликанской Испании§!.\n"
 GER_reestablish_free_elections:0 "Восстановить свободные выборы"
 GER_reestablish_free_elections_desc:0 "Мы вернемся к демократическим идеалам, восстановив свободные выборы, которые пройдут в ближайшем будущем."
 GER_the_monarchy_compromise:0 "Компромисс монархии"
 GER_the_monarchy_compromise_desc:0 "Военные, боровшиеся за нашу свободу от нацистской тирании, имеют явные роялистские наклонности. Чтобы обеспечить их удовлетворение тем путем, который избирает нация, мы должны пойти на компромисс и разрешить возвращение монархии."
 GER_establish_bundeswehr:0 "Создание бундесвера"
 GER_establish_bundeswehr_desc:0 "Хотя Германия больше не является фашистской, для нашей страны по-прежнему существуют внешние угрозы. Мы должны создать новую армию - Бундесвер - для борьбы с этими угрозами."
 GER_the_great_red_menace:1 "Великая угроза [GER.GetGreatRedMenaceName]"
 GER_the_great_red_menace_desc:1 "Наши действия в предыдущей войне до сих пор у многих свежи в памяти. Мы должны переключить внимание Европы на истинную опасность: великую [GER.GetGreatRedMenaceDesc], которая нависла с Востока. Мы начнем масштабную пропагандистскую кампанию, чтобы открыть глаза европейцев."
 SOV_GREAT_RED_MENACE_NAME_COMMUNIST:0 "Красная"
 SOV_GREAT_RED_MENACE_NAME_EXILES:0 "Восточная"
 SOV_GREAT_RED_MENACE_DESC_COMMUNIST:0 "коммунистической угрозы"
 SOV_GREAT_RED_MENACE_DESC_EXILES:0 "угрозы русского империализма"
 GER_central_european_alliance:0 "Центрально-Европейский Альянс"
 GER_central_european_alliance_desc:0 "Теперь, когда мы сосредоточили внимание континента на проблеме, мы должны предложить решение: мы возглавим альянс для всех малых стран в Европе, который обеспечит защиту от этой наиболее смертоносной угрозы нашему образу жизни."
 GER_central_european_alliance_tt:0 "Если не в составе фракции:"
 GER_danubian_membership:0 "Членство в Дунайской федерации"
 GER_danubian_membership_desc:1 "Наследницы Дунайской Австро-Венгерской империи не забыли, что значит быть нашими союзниками. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST:0 "коммунизм"
 SOV_DANUBIAN_MEMBERSHIP_DESC_EXILES:0 "восточной агрессии"
 GER_danubian_expansion:0 "Расширение Дунайской федерации"
 GER_danubian_expansion_desc:1 "Мы должны стремиться расширить свое влияние на балканские государства, подверженные [SOV.GetAdjective] агрессии. Мы предложим оставшимся государствам на Дунае членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 invite_non_fascist_communist_only_TT:1 "Требуется, чтобы потенциальные государства-члены не были фашистскими или коммунистическими и не находились уже в какой-либо фракции.\n"
 GER_no_balkan_communism:0 "Нет балканскому коммунизму"
 GER_no_balkan_communism_desc:0 "Коммунистические влияния проникли на Балканы, чего мы не можем допустить. Они должны быть уничтожены, прежде чем они пустят корни."
 GER_no_balkan_communism_tt:0 "Предоставляет цели войны за §Yсвержение режима§! против коммунистических стран на Балканах.\n"
 GER_no_balkan_communism_HUN_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §YВенгерской Народной Республики§!.\n"
 GER_no_balkan_communism_ROM_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §YРумынской Народной Республики§!.\n"
 GER_no_balkan_communism_YUG_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §ЫСФР Югославии§!.\n"
 GER_no_balkan_communism_BUL_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §YСоциалистической Республики Болгарии§!.\n"
 GER_low_countries_membership:0 "Членство стран Бенилюкса"
 GER_low_countries_membership_desc:0 "Даже находясь далеко от восточных границ Европы, страны Бенилюкса понимают, что если Центральная Европа падет, они будут следующими. Мы предложим им членство, чтобы они присоединились к нам в борьбе с угрозой коммунизма."
 GER_no_reds_in_western_europe:0 "Без красных в Западной Европе"
 GER_no_reds_in_western_europe_desc:0 "Коммунистические влияния проникли в Западную Европу, что недопустимо. Их необходимо устранить, пока они не пустили корни."
 GER_no_reds_in_western_europe_tt:0 "Предоставляет цели войны за §Yсвержение режима§! против коммунистических стран в странах Бенилюкса и Франции.\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §YФранцузской коммуны§!.\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "Предоставляет цель войны за §Yсвержение режима§! против §YНародных Соединенных Провинций§!.\n"
 GER_no_reds_in_western_europe_BEL_tt:0 "Получает цель войны §YНизвергнуть правительство§! против §YКооперативной Бельгии§!.\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "Получает цель войны §YНизвергнуть правительство§! против §YРозы Люксембург§!.\n"
 GER_scandinavian_membership:0 "Скандинавское членство"
 GER_scandinavian_membership_desc:1 "Горы и холод не являются защитой от Угрозы [GER.GetGreatRedMenaceName], и Скандинавы должны знать об этом. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 GER_baltic_membership:0 "Прибалтийское членство"
 GER_baltic_membership_desc:1 "В течение двух десятилетий страны Прибалтики подвергались смертельной двойной опасности реаннексии и [GER.GetBalticMembershipDesc]. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_BALTIC_MEMBERSHIP_DESC_COMMUNIST:0 "коммунизма"
 SOV_BALTIC_MEMBERSHIP_DESC_EXILES:0 "империализма [SOV.GetAdjective]"
 GER_polish_membership:0 "Польское членство"
 GER_polish_membership_desc:1 "У поляков много причин не доверять всем соседям, но они знают, что наибольшая угроза исходит с Востока. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 GER_finnish_membership:0 "Финское членство"
 GER_finnish_membership_desc:1 "Расположенная далеко от центра Европы, Финляндия рискует столкнуться с [GER.GetFinnishMembershipDesc] в одиночку. Но этого не должно произойти. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_FINNISH_MEMBERSHIP_DESC_COMMUNIST:0 "красным"
 SOV_FINNISH_MEMBERSHIP_DESC_EXILES:0 "русским"
 GER_strike_at_the_source:0 "Удар по источнику"
 GER_strike_at_the_source_desc:1 "Жизнь в страхе — это не жизнь; мы должны раз и навсегда покончить с этой угрозой нашему образу жизни. Источник [GER.GetStrikeAtTheSourceDesc] в Европе должен быть уничтожен."
 GER_swedish_trade_agreement: "Торговое соглашение между Германией и Швецией"
 GER_swedish_trade_agreement_desc: "Наша сталь плохого качества, а для питания нашей военной машины нам нужны самые лучшие материалы. К счастью, [SWE.GetName] на севере является идеальным партнером; доступны высококачественные ресурсы, нейтрален и вряд ли будет сильно беспокоиться, когда наши будущие планы осуществятся."
 SOV_STRIKE_AT_THE_SOURCE_DESC_COMMUNIST:0 "коммунистического влияния"
 SOV_STRIKE_AT_THE_SOURCE_DESC_EXILES:0 "российского империализма"
 GER_reverse_the_brain_drain:0 "Отмена утечки мозгов"
 GER_reverse_the_brain_drain_desc:0 "Теперь, когда угнетатели и авторитарные режимы побеждены, мы можем попытаться сделать так, чтобы для ученых, покинувших страну, стало привлекательным вернуться и снова работать на родине."
 GER_shared_rd_programs:0 "Совместные программы исследований и разработок"
 GER_shared_rd_programs_desc:0 "Ради нашего дела нам необходимо объединить наши научные знания и поделиться технологическими достижениями с нашими новыми союзниками."
 GER_the_mannheim_project:0 "Проект \"Мангейм\""
 GER_the_mannheim_project_desc:1 "Теперь, когда предприятия \"Тяжёлая вода\" в Норвегии находятся под нашим контролем, мы можем удвоить наши усилия по раскрытию секретов атома и использовать их для производства оружия против [GER.GetDanzigGuaranteesBolsheviksDesc]."
 GER_the_mannheim_project_tt:0 "Эта специализация даёт различные награды в зависимости от текущего уровня атомных исследований:\n\n"
 GER_pool_technical_know_how:0 "Обмен техническими знаниями"
 GER_pool_technical_know_how_desc:0 "У каждой страны есть свои методы управления промышленностью и обслуживания оборудования. Мы можем учиться друг у друга, отправляя технические группы для распространения этих знаний среди других членов альянса."
 GER_pool_technical_know_how_tt:0 "Каждый участник фракции получит данный национальный дух."
 ITA_ethiopian_war_logistics:0 "Логистика войны в Эфиопии"
 ITA_ethiopian_war_logistics_desc:0 "Возможно, мы неправильно оценили логистическую ситуацию при нашем славном завоевании Эфиопии. Мы должны сделать своей первоочередной целью обеспечение наших храбрых войск необходимыми припасами."
 ITA_fortification_effort:0 "Усиление укреплений"
 ITA_fortification_effort_desc:0 "Мы должны защитить наши берега и границы от агрессии со стороны угасающих и декадентских империалистических держав Франции и Британии."
 ITA_fortification_effort_forts:0 "Добавить §Y15 сухопутных фортов§! на границе с Францией.\n"
 ITA_army_primacy:0 "Приоритет армии"
 ITA_army_primacy_desc:0 "В промышленном плане Италия по-прежнему отстает от разлагающихся колониальных империй. Нам необходимо сделать выбор между приоритетом армии и флота. Выбор кажется очевидным; так же, как древняя Римская империя опиралась на свои легионы, так и новая Итальянская империя должна опираться на них!"
 ITA_modernized_artillery:0 "Модернизированная артиллерия"
 ITA_modernized_artillery_desc:0 "Реджио Эзерчито, по сути, является одной из крупнейших армий в мире. К сожалению, мы не можем должным образом экипировать всех этих людей. Хуже всего то, что большинство нашей артиллерии с 1918 года!"
 ITA_modernized_army:0 "Модернизированная армия"
 ITA_modernized_army_desc:0 "Улучшение артиллерии значительно повысит нашу боевую эффективность, но нам также нужны новые тактики и доктрины."
 ITA_armored_effort:0 "Усилие бронетанковых войск"
 ITA_armored_effort_desc:0 "Бои в Эфиопии проходят хорошо, но наши танки просто не соответствуют стандартам, необходимым для борьбы с разлагающимися - хотя и по-прежнему сильными - плутодемократиями Европы."
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Наши ресурсы ограничены, и нам приходится принимать болезненные решения, но Британская империя загнала нас в клетку в Средиземном море. Прорыв потребует флота, который будет соперничать даже с их..."
 ITA_carrier_effort:0 "Усилие по созданию авианосцев"
 ITA_carrier_effort_desc:0 "Современные боевые флоты будут центрированы вокруг авианосцев, а не линкоров. Превосходство господства в воздухе над кораблями было продемонстрировано американцами ещё в 1921 году!"
 ITA_capital_ships:0 "Усиление капитальных судов"
 ITA_capital_ships_desc:0 "Нация с наибольшим количеством линкоров будет править океанами. Мы не должны позволить Королевскому Флоту превзойти нас на Средиземном море..."
 ITA_bomber_effort:0 "Усиление бомбардировщиков"
 ITA_bomber_effort_desc:0 "Прошла эпоха, когда армии могли выигрывать войны без учёта неба. Мы должны разработать наши тактические бомбардировщики, чтобы обеспечить наших солдат воздушной поддержкой, в которой они нуждаются."
 ITA_atlantic_fleet:0 "Атлантический флот"
 ITA_atlantic_fleet_desc:0 "Как только мы вырвемся из британской клетки, нам потребуется спроецировать нашу мощь через океаны. Это должно быть нашим первоочередным приоритетом."
 ITA_marines_and_landing_craft:0 "Морские пехотинцы и десантные суда"
 ITA_marines_and_landing_craft_desc:0 "Войны не выиграть лишь за счёт морской мощи; мы также должны иметь возможность транспортировать наши армии через волны и безопасно высаживать их на берег..."
 ITA_jet_engine_effort:0 "Усиление реактивных двигателей"
 ITA_jet_engine_effort_desc:0 "Италия должна быть во главе разработки реактивных двигателей благодаря блестящей работе Secondo Campini. Мы должны дать ему все ресурсы, необходимые для дальнейшего совершенствования его конструкций для Regio Aeronautica."
 ITA_light_ship_effort:0 "Усиление лёгких судов"
 ITA_light_ship_effort_desc:0 "Конвоям в наших заморские территории нужна защита. Мы должны разработать новые доктрины, а также современные эсминцы."
 ITA_escort_effort:0 "Эскортное усилие"
 ITA_escort_effort_desc:0 "Мы должны прилагать дальнейшие усилия для защиты наших уязвимых конвоев в Средиземном море."
 ITA_sea_wolves:0 "Морские волки"
 ITA_sea_wolves_desc:0 "Наши немецкие союзники разработали ужасающе эффективные подводные лодки и доктрины \"волчьих стай\" для их использования. Мы должны поучиться у них."
 ITA_slovenia_dalmatia_claims:0 "Притязания на Югославию"
 ITA_slovenia_dalmatia_claims_desc:0 "В Югославии по-прежнему проживает значительное итальянское население, по крайней мере, со времен былой славы Венеции. Возвращение этих регионов под власть Италии - важный шаг к воссозданию Римской империи!"
 ITA_slovenia_dalmatia_claims_threat:0 "Итальянские притязания на Югославию"
 ITA_yugoslavia_friend:0 "Подружитесь с Югославией"
 ITA_yugoslavia_friend_desc:0 "Вместо того чтобы враждовать с Югославией сейчас, мы можем отложить ее окончательное завоевание до более подходящего момента. Вместо этого мы могли бы подружиться с режимом и привлечь страну в нашу сферу влияния."
 ITA_support_nationalist_spain:0 "Поддержка националистической Испании"
 ITA_support_nationalist_spain_desc:0 "Испания охвачена гражданской войной, которая определит, станет ли она возможным союзником фашистов или останется бесполезной республикой, или еще хуже, падет под натиском коммунизма или анархии. Мы должны оказать поддержку настоящим испанцам, пока не стало слишком поздно!"
 ITA_demand_balearic_islands:0 "Затребовать Балеарские острова"
 ITA_demand_balearic_islands_desc:0 "Продемонстрировав свою поддержку новому режиму Франко, мы имеем право потребовать одну из важных территорий, которые мы помогли защитить, - Балеарские острова, и передать ее Италии для укрепления нашего стратегического положения в Средиземном море."
 ITA_bulgaria_friend:0 "Подружиться с Болгарией"
 ITA_bulgaria_friend_desc:0 "Болгария находится в нашей сфере влияния. Ее надежное взаимодействие с Италией является ключевым фактором для наших балканских амбиций."
 ITA_albania_war_goal:1 "Оккупация Албании"
 ITA_albania_war_goal_desc:1 "Албания является легкой целью для оккупации нашими войсками. Вряд ли мы столкнемся с большим сопротивлением. Мы должны показать миру мощь Италии и восстановить славу Римской империи!"
 ITA_pact_of_steel:0 "Стальной пакт"
 ITA_pact_of_steel_desc:0 "Наши отношения с нацистской Германией осложняются идеологическими разногласиями и противоречивыми целями; Il Duce крайне настороженно относится к немецким амбициям в Австрии и на Балканах. Однако все может измениться..."
 ITA_germ_italy_same_tt:0 "§YИталия§! и §YГермания§! разделяют одну §YИдеологию§!."
 ITA_german_millitary_cooperation:0 "Немецкое военное сотрудничество"
 ITA_german_millitary_cooperation_desc:0 "Благодаря тесному сотрудничеству с мощными немецкими вооруженными силами мы можем объединить лучшую часть немецкой эффективности и итальянские инновации. У нас будет стратегическое преимущество над любым, кто осмелится нам противостоять."
 ITA_claims_on_france:0 "Претензии к Франции"
 ITA_claims_on_france_desc:0 "Захватить земли у Вишистской Франции. После того, как Германия захватила Париж, а во Франции было сформировано новое правительство, настало время нам заявить свои законные права на часть Южной Европы. Германия значительно расширилась на севере, и справедливо, что нам тоже предоставят кусочек."
 ITA_claims_on_france_tt:0 "§YVichy France§! существует и контролирует §YSavoy§! и §YCorsica§!"
 ITA_go_after_france:0 "Выступить против Франции"
 ITA_go_after_france_desc:0 "Франция... еще одна реакционная демократия Запада, которая в любой момент пытается помешать продвижению и часто подвергала опасности само существование итальянского народа. Мы вступаем в битву ради блага Италии и будущего Империи."
 ITA_claims_on_turkey:0 "Претензии к Турции"
 ITA_claims_on_turkey_desc:0 "В 1915 году договор в Лондоне обещал Италии турецкие земли в Анатолии в обмен на выгоды западных держав в Леванте. Они взяли свое, утверждая, что это были просто мандаты Лиги Наций, в то время как Италии было отказано. Новая Италия намного сильнее старой, и мы заставим турок сдержать британские обещания."
 ITA_italy_first:0 "Сначала Италия"
 ITA_italy_first_desc:0 "Муссолини никогда не будет играть вторым номером после Гитлера! Мы должны извлечь уроки из истории Римской империи; Тевтонское вмешательство в итальянские дела никогда не заканчивается добром..."
 ITA_romania_friend:0 "Подружиться с Румынией"
 ITA_romania_friend_desc:0 "Привлечь наших дальних родственников в Румынии в сферу нашего влияния было бы в наших интересах. Дуче видит большой потенциал в их "Железной гвардии"."
 ITA_german_rd_treaty:0 "Договор с Германией"
 ITA_german_rd_treaty_desc:0 "Мы должны попросить немцев обменяться технологическими секретами на благо обеих наших великих стран."
 ITA_spanish_italian_faction:0 "Испано-итальянский союз"
 ITA_spanish_italian_faction_desc:0 "Франко и испанские националисты - наши естественные союзники, объединенные религией, культурой и идеологией. Вместе мы могли бы захватить Гибралтар и серьезно осложнить жизнь королевскому флоту..."
 ITA_italian_highways:0 "Итальянские автомагистрали"
 ITA_italian_highways_desc:0 "Мы должны расширить нашу инфраструктуру, чтобы обеспечить легкую мобильность войск по всей нашей империи. С врагами в каждом уголке мира это решающая часть возможности защитить всю итальянскую землю."
 ITA_libyan_refineries:0 "Ливийские нефтеперерабатывающие заводы"
 ITA_libyan_refineries_desc:0 "Бенгази - идеальное место для строительства НПЗ. Рядом с источниками нефти и рядом с производством на родине."
 ITA_libyan_infrastructure:0 "Ливийская инфраструктура"
 ITA_libyan_infrastructure_desc:0 "Наши обширные земли в Северной Африке по-прежнему уступают остальной части нашей империи в плане инфраструктуры. Мы должны сосредоточить наши усилия на том, чтобы подтянуть их до нужного уровня."
 ITA_prospect_for_oil:0 "Перспективы в отношении нефти"
 ITA_prospect_for_oil_desc:0 "Старые империи всегда боятся новых, которые набирают силу, и мы не должны зависеть от них. Мы не можем полагаться на нефть из других стран и должны сосредоточить свои усилия на том, чтобы найти свой собственный источник в империи. Именно так мы гарантируем себе конкурентоспособность в далеком будущем."
 ITA_greece_war_goal:0 "Война с Грецией"
 ITA_greece_war_goal_desc:0 "Что это за Римская империя, если она не включает Грецию? Это должна быть легкая цель..."
 ITA_greece_friend:0 "Подружиться с Грецией"
 ITA_greece_friend_desc:0 "Греки - древний народ и колыбель западной цивилизации. Не должно быть невозможно совместить их цели с нашими..."
 ITA_turkey_friend:0 "Подружиться с Турцией"
 ITA_turkey_friend_desc:0 "У турков нет причин любить нас после итало-турецкой войны и Великой войны. Однако реальная политика важнее старых обид, и текущая ситуация в Средиземноморье может сблизить наши звезды."
 ITA_portugal_friend:0 "Подружиться с Португалией"
 ITA_portugal_friend_desc:0 "Португалия, как и Испания, являются естественными союзниками итальянского народа. Мы должны укрепить эти узы дружбы."
 ITA_anti_uk_war_goals:0 "Война с Великобританией"
 ITA_anti_uk_war_goals_desc:0 "Ветшающая Британская империя заперла нас в Средиземноморье и никогда не отдаст ключи добровольно. Мы должны ударить по англичанам, как только представится случай!"
 ITA_japan_friend:0 "Дружить с Японией"
 ITA_japan_friend_desc:0 "Японцы очень похожи на нас: молодая, голодная власть с положительной демографией, которую держат в заложниках плутодемократии, такие как Великобритания и Нидерланды. Мы должны объединиться с ними, чтобы сформировать динамичный Военно-морской альянс через океаны!"
 soviet_focus:0 "Советский национальный фокус"
 SOV_finish_five_year_plan:0 "Завершить пятилетний план"
 SOV_finish_the_five_year_plan_desc:0 "Второй пятилетний план ставит в приоритет развитие тяжелой промышленности. Советский Союз должен быстро развиваться, чтобы соответствовать капиталистическим и фашистским державам Запада."
 SOV_move_industry_to_urals:0 "Перенести промышленность на Урал"
 SOV_move_industry_to_urals_desc:0 "Мы не должны позволять предателям-гитлеровцам захватить наши драгоценные заводы в западной части СССР. Благодаря огромным усилиям и жертвам мы должны быстро переместить самое ценное тяжелое оборудование и оборудование в Челябинск и другие места на Урале."
 SOV_defense_of_moscow:0 "Оборона Москвы"
 SOV_defense_of_moscow_desc:0 "Фашисты стучатся в ворота столицы! Мы не должны позволить Москве пасть любой ценой. Мобилизуйте всех, от детей до стариков, чтобы поспешно возвести все возможные защитные сооружения!"
 SOV_defense_of_moscow_forts:0 "Добавляет §Y28 береговых батарей§! в Москву и её окрестности.\n"
 SOV_infrastructure_effort:0 "Труды по инфраструктуре"
 SOV_infrastructure_effort_desc:1 "[ROOT.GetNameDefCap] огромная, но в основном пустая. Мы должны обеспечить возможность быстрой транспортировки товаров и оборудования по всей стране."
 SOV_tranformation_of_nature:0 "Преобразование природы"
 SOV_tranformation_of_nature_desc:0 "Великий Сталинский план преобразования природы должен быть приведен в действие. Окружающая среда должна быть сформирована и преобразована в больших масштабах, чтобы работать в пользу народа."
 SOV_stalin_constitution:0 "Сталинская Конституция"
 SOV_stalin_constitution_desc:0 "Пришло время обновить нашу старую конституцию и удивить мир правами, которыми пользуются рабочие и крестьяне Советского Союза!"
 SOV_collectivist_propaganda:0 "Коллективистская пропаганда"
 SOV_collectivist_propaganda_desc:0 "В Советском Союзе нет места индивидуальной славе. Наша пропаганда должна настоятельно подчеркивать коллективные усилия; превышенные цели производства, успешные экспедиции и массовые строительные проекты."
 SOV_militarized_schools:0 "Военизированные школы"
 SOV_militarized_schools_desc:0 "Советские дети должны быть воспитаны в духе военной дисциплины и социалистических добродетелей, таких как самопожертвование и солидарность. Молодые умы более восприимчивы к обучению."
 SOV_workers_culture:0 "Рабочая культура"
 SOV_workers_culture_desc:0 "Социализм - это не просто экономическая система, а марксизм не просто наука. Мы должны преобразовать саму структуру советского общества, чтобы искоренить все пережитки буржуазных нравов и традиций."
 SOV_new_soviet_man:0 "Новый советский человек"
 SOV_new_soviet_man_desc:0 "Новый советский человек бескорыстен, образован, дисциплинирован и здоров. Это живая победа над низменными инстинктами и ложным сознанием. Мужчины с радостью отдадут свои жизни на благо всех, а женщины родят много детей для будущего советского общества."
 SOV_progress_cult:0 "Культ прогресса"
 SOV_progress_cult_desc:0 "Мы должны приветствовать новации выдающихся советских учёных и поощрять правильное свободное мышление. СССР всегда будет впереди декадентского Запада, когда дело дойдёт до смелых новых областей науки. Просто посмотрите на блестящие работы товарища Лысенко!"
 SOV_socialist_science:0 "Социалистическая наука"
 SOV_socialist_science_desc:0 "Мир, подобно разуму, находится в постоянном движении. Природа находится в состоянии постоянного прогресса; даже революции. Принципы диалектического материализма могут быть применены к естественным наукам, а также к общественным..."
 SOV_aviation_cult:0 "Культ авиации"
 SOV_aviation_cult_desc:0 "Советский Союз поразит мир своими потрясающими подвигами авиации. Наши героические лётчики - это рыцари большевистской культуры и прогресса, демонстрирующие наше технологическое превосходство над природой. Как далеко мы продвинулись со времён царя!"
 SOV_women_pilots:0 "Женщины в авиации"
 SOV_women_pilots_desc:0 "Товарищ Раскова, наша героическая лётчица-дальнобойщица, должна получить разрешение на формирование чисто женских авиаполков через свою программу авиагруппы 122."
 SOV_night_witches_tt:0 "588-й ночной бомбардировочный полк становится активным в Москве."
 SOV_improve_railway_network:0 "Улучшить железнодорожную сеть"
 SOV_improve_railway_network_desc:0 "Наш первый пятилетний план оказался слишком успешным. Массовая экспансия в тяжелой промышленности позволила Советскому Союзу занять гораздо более прочную позицию для своей защиты, но советская железнодорожная сеть столкнулась с рядом критических узких мест. Народный комиссариат путей сообщения (НКПС) имеет амбициозный план по устранению этих узких мест и обеспечению защиты Родины."
 SOV_transpolar_flights:0 "Трансполярные перелеты"
 SOV_transpolar_flights_desc:0 "Наши самые смелые лётчики только начинают доказывать, что смелые маршруты через Арктику возможны. Используя такие неожиданные короткие пути в нашем планировании воздушной войны, мы сможем удивить врага."
 SOV_ocean_going_navy:0 "Морская флотилия"
 SOV_ocean_going_navy_desc:0 "Хотя Союз охватывает большую площадь суши, чем любая другая нация на планете, мировой океан ещё не был покорён нашими кораблями. Тяжелобронированные линкоры станут частью нашего будущего морского флота."
 SOV_peoples_commissariat:0 "Учреждение НКО"
 SOV_peoples_commissariat_desc:0 "Народный комиссариат оборонной промышленности СССР будет министерством тяжёлой промышленности, фокусирующимся на наших военных промышленных проектах. В долгосрочной перспективе рабочая нагрузка может потребовать дальнейшего разделения министерства."
 SOV_anti_fascist_diplomacy:0 "Антифашистская дипломатия"
 SOV_anti_fascist_diplomacy_desc:0 "Хотя все западные режимы репрессивны и коррумпированы, нет хуже тех, кто притворяется прогрессивными; или даже социалистическими! Распространяя ложное сознание среди пролетариата, они пытаются отсрочить революцию и удерживать рабочих в вечном рабстве."
 SOV_operation_zet:0 "Операция «Цет»"
 SOV_operation_zet_desc:0 "Хотя Гоминьдан и реакционен, вряд ли Мао и его марка коммунизма восторжествуют в Китае. Нам следует стремиться к улучшению отношений с Чан Кайши; нелепая анахроничная Японская империя в любом случае скоро рухнет."
 SOV_annex_tannu_tuva:0 "Аннексировать Туву"
 SOV_annex_tannu_tuva_desc:0 "Хотя это вряд ли имеет экономическое значение, из политических соображений мы должны официально аннексировать Тувинскую Народную Республику в качестве автономной области в составе Советского Союза."
 SOV_improve_stalin_line:0 "Укрепить линию Сталина"
 SOV_improve_stalin_line_desc:0 "Наша западная граница должна быть лучше защищена от фашистской агрессии. Линию Сталина следует продлить и модернизировать."
 SOV_far_east_fortification:0 "Укрепление Дальнего Востока"
 SOV_far_east_fortification_desc:0 "Японцы постоянно совершают набеги через границу с Маньчжурией. Мы должны усилить нашу оборону вдоль этой границы, чтобы сдержать их насовсем."
 SOV_far_east_fortification_forts_1:0 "Добавить §Y6 сухопутных фортов§! на границе с Японией.\n"
 SOV_far_east_fortification_forts_2:0 "Добавить §Y8 сухопутных фортов§! на границе с Японией.\n"
 SOV_far_east_fortification_forts_3:0 "Добавить §Y4 сухопутных фортов§! на границе с Японией.\n"
 SOV_xian_incident:0 "Сианьский инцидент"
 SOV_xian_incident_desc:0 "Наладив связи с видными деятелями Гоминьдана, мы сможем выкрасть Чан Кайши и заставить его разделить власть с Мао, тем самым положив конец их разрушительной ссоре, чтобы Китай мог лучше противостоять набегам Японии."
 SOV_xian_incident_tt:0 "Если обе стороны согласятся, будет установлено перемирие между националистическим и коммунистическим Китаем."
 SOV_anti_capitalist_diplomacy:0 "Антикапиталистическая дипломатия"
 SOV_anti_capitalist_diplomacy_desc:0 "Самыми страшными препятствиями для мировой революции являются, без сомнения, толстые банкиры США и безжалостные колониальные угнетатели из Великобритании. Мы всегда должны ставить перед собой основную цель - бить их жадные руки и подрывать их либеральную пропаганду."
 SOV_expand_red_fleet:0 "Расширение Красного флота"
 SOV_expand_red_fleet_desc:0 "Красный флот жалко слаб по сравнению с военно-морским флотом империалистических держав. Мы должны сделать его расширение приоритетом!"
 SOV_anti_colonialist_rebels:0 "Коминтерн"
 SOV_anti_colonialist_rebels_desc:0 "В связи с тем, что капиталистическая система вступает в период окончательного краха, правильной позицией для всех коммунистических партий должна быть крайне агрессивная, воинственная, ультралевая линия. В частности, мы призываем коммунистические партии мира посвятить свою энергию уничтожению умеренных левых."
 SOV_southern_thrust:0 "Южный прорыв"
 SOV_southern_thrust_desc:0 "Аннексия Ирана и Ирака обеспечит огромные запасы нефти для Революции и окажет прямое давление на британских империалистов в Египте и Индии."
 SOV_claim_on_sinkiang:0 "Заявить права на Синьцзян"
 SOV_claim_on_sinkiang_desc:0 "Под руководством товарища Шэн Шицая Синьцзян уже является фактически советским государством-марионеткой. Мы должны это узаконить..."
 SOV_claim_on_sinkiang_threat:0 "Советский захват Синьцзяна"
 SOV_pan_slavic_rhetoric:0 "Панславянская риторика"
 SOV_pan_slavic_rhetoric_desc:0 "Товарищ Ленин в своей погоне за Мировой революцией зашел слишком далеко, отказавшись от русской, славянской идентичности. Некоторая доля национализма должна нам помочь, и возрождение своеобразного панславизма может поспособствовать сближению с другими славянскими народами."
 SOV_claims_on_baltic:0 "Притязания на Балтику"
 SOV_claims_on_baltic_desc:0 "Петр Великий был прав, добиваясь доступа к портам на западе. Балтийские государства, которые были потеряны после революции, должны быть вновь интегрированы в Советский Союз."
 SOV_claim_bessarabia:0 "Притязания на Бессарабию"
 SOV_claim_bessarabia_desc:0 "Черное море еще важнее для нашей экономики, чем Балтийское. Мы должны сделать все возможное, чтобы обеспечить контроль над Босфором и Дарданеллами."
 SOV_claims_on_turkey:0 "Требования к Турции"
 SOV_claims_on_turkey_desc:0 "Турки не только постоянно отказываются от наших требований о взаимном контроле над проливом Босфор, но и отказываются обсуждать какие-либо корректировки границ на востоке. Возможно, пора преподать им урок!"
 SOV_offer_poland_protection_desc:0 "Хотя мы могли бы просто захватить Восточную Польшу, было бы гораздо предпочтительнее, если бы они присоединились к нашему Коминтерну в этом процессе. Однако нам нужно было бы что-то предложить в обмен на наши претензии. Если мы пообещаем им Восточную Германию, они могут заинтересоваться."
 SOV_offer_poland_protection_tt:0 "§YПольше будут переданы государства, заявленные в этом соглашении, в случае советского завоевания.§!\n"
 SOV_great_purge:0 "Большая чистка"
 SOV_great_purge_bypass_tt:0 "Троцкий становится лидером Советского Союза"
 SOV_great_purge_desc:0 "Среде офицеров, даже среди высших чинов, назревает опасный троцкистский заговор. Хотя личное участие Троцкого остаётся неизвестным, угроза велика. СССР может быть втянут в ещё одну гражданскую войну... если мы не готовы разбить несколько яиц."
 SOV_great_purge_tt:0 "Будет проведен ряд показательных §Yсудов§! для чистки подозреваемых троцкистских министров и лидеров.\n"
 SOV_great_purge_tt2:3 "Количество проведенных чисток повлияет на вероятность возобновления гражданской §Yвойны§! и усилит влияние очищенных офицеров.\nЕсли этот фокус не выбран, это приведёт к §Yгражданской войне§! и возможному возвращению §YЛьва Троцкого§! из изгнания.\n\n"
 SOV_permanent_revolution:0 "Перманентная революция"
 SOV_permanent_revolution_tt:0 "Троцкий вернулся"
 SOV_permanent_revolution_tt2:0 "§YTроцкий§! получает более высокое качество лидера."
 SOV_permanent_revolution_desc:0 "Угнетатель-демагог ушёл! Истинная власть возвращена народу нашей страны. Теперь все могут независимо и без компромиссов отстаивать свои интересы. Мы постоянно меняемся. Постоянная революция - это триумфальная революция."
 SOV_nkvd_divisions:0 "Дивизии НКВД"
 SOV_nkvd_divisions_desc:0 "НКВД следует передать несколько дивизий, которые будут выступать в качестве внутренних войск, охраняющих железные дороги и важные объекты."
 SOV_war_with_germany_tt:0 "Пакт Молотова-Риббентропа не в силе"
 SOV_war_with_japan_tt:0 "Нет национального духа \"Чистка офицеров\"!"
 SOV_war_with_germany:0 "Война с Германией"
 SOV_war_with_germany_desc:0 "Германская угроза растет. Мы сможем и должны уничтожить немецкую армию, заставив ее преклониться перед новыми хозяевами."
 SOV_war_with_japan:0 "Война с Японией"
 SOV_war_with_japan_desc:0 "Кажется, японцы не собираются отступать. Единственным эффективным средством сдерживания будет война. Они пожалеют о том, что противостояли нашим требованиям, когда Красная Армия растопчет их."
 SOV_war_with_uk:0 "Война с Великобританией"
 SOV_smersh_tt:0 "§YNуллифицирует риск переворота.§!\n"
 SOV_partisan_suppression:0 "Подавление партизан"
 SOV_partisan_suppression_desc:0 "СМЕРШ следует расширить, чтобы быть в состоянии лучше проникнуть и безжалостно подавить все формы партизанской деятельности на оккупированной территории."
 SOV_smersh:0 "СМЕРШ"
 SOV_smersh_desc:0 "СМЕРШ или \"Смерть шпионам\" - предлагаемая контрразведывательная инициатива, которая будет служить двойной цели: выявление вражеских шпионов и казнь дезертиров и партизан в рядах Красной Армии."
 SOV_war_with_uk_desc:0 "Имперские англичане никогда нас не уважали. Нет никаких сомнений в том, что они обратят свой взор на Советский Союз, когда разделаются с остальным миром. Есть только один способ помешать их агрессивной экспансии - Война!"
 SOV_claim_on_the_straits:0 "Заявить права на проливы"
 SOV_claim_on_the_straits_desc:0 "Проливы, ведущие из Черного моря в Эгейское море, являются ключевой стратегической точкой. Мы не можем допустить, чтобы эта территория контролировалась иностранными державами. Чтобы обеспечить актуальность Красного флота, нам нужно обезопасить проливы."
 SOV_ultimatum_to_greece:0 "Ультиматум Греции"
 SOV_ultimatum_to_greece_desc:0 "Эгейские острова - это последний стратегический элемент, который нам необходим, чтобы обеспечить беспрепятственную деятельность Красного флота. Греки находятся под давлением со всех сторон и, скорее всего, отдадут немного территории, чтобы избежать полномасштабной войны."
 SOV_diversify_the_programme:0 "Диверсифицировать программу"
 SOV_diversify_the_programme_desc:0 "Мы многому научились за последние годы, и достигнут прогресс в области традиционной войны. Мы - нация великих ученых, которые способны раскрыть методы ведения войны, дающие колоссальные преимущества. Мы должны обеспечить им лучшие условия для работы, если хотим увидеть результаты."
 SOV_research_city_experiment:0 "Исследовательский городской эксперимент"
 SOV_research_city_experiment_desc:0 "Один из наших ведущих ученых, Курчатов, отметил, что при распаде ядер в одном килограмме урана высвобождается энергия, эквивалентная взрыву 20 000 тонн тротила. Нам нужно обуздать эту силу раньше наших врагов, чтобы обеспечить выживание Родины."
 SOV_closed_city_network:0 "Сеть закрытых городов"
 SOV_closed_city_network_desc:0 "Нам следует создать закрытые города для исследований, требующих большего пространства, чем мы имеем на наших военных базах. Ограничение доступа к городам обеспечивает секретность наших исследований, а также дает нашим ученым достаточно места для масштабных экспериментов."
 strike_usa_focus:0 "Удар по США!"
 strike_usa_focus_desc:0 "Вероломные американцы держат нас на милости, контролируя поставки нефти и других столь необходимых ресурсов. Их промышленность намного превосходит нашу, поэтому если мы собираемся наносить удар, то должны нанести его со всей силой! Мы не можем надеяться выиграть затяжную войну против США..."
 chinese_puppet_focus:0 "Китайская марионетка"
 chinese_puppet_focus_desc:1 "Китай доказал, что стремится избежать войны с нами. Возможно, их лидеры считают, что внутренний раскол представляет большую угрозу. Мы могли бы предложить им нашу защиту от коммунистов и военачальников в качестве подданных в Великой Восточно-Азиатской сфере сопроцветания."
 chinese_war_focus:0 "Война с Китаем"
 chinese_war_focus_desc:0 "Инцидент на мосту Марко Поло показал, что Китай не заинтересован в сотрудничестве. Из-за растущей напряженности, угрожающей соблюдению перемирия, война может стать единственным средством установления порядка в Китае."
 subdue_warlords_focus:0 "Подавление военачальников"
 subdue_warlords_focus_desc:0 "Китайцы позволили своей некогда великой империи распасться, развалиться на части, расшатанной радикалами и военными кликами. Империя Японии не потерпит такого разделения, даже среди своих подданных."
 oust_germans_focus:0 "Разрыв китайско-германских связей"
 oust_germans_focus_desc:0 "С начала двадцатых годов военные советники из Германии присутствуют в Китае, оказывая решительную поддержку Гоминьдану. С этим больше нельзя мириться. У нас есть все права требовать немедленного отзыва всех немцев, оказывающих Китаю помощь. Германии пора определиться со сторонами."
 found_own_faction_focus:0 "Создание нашей фракции"
 found_own_faction_focus_desc:1 "Мы уже предприняли шаги по созданию Великой восточноазиатской сферы сопроцветания. Чтобы обеспечить долгосрочную победу, Япония должна быть достаточно сильной, чтобы возглавить других, в Азии и за ее пределами."
 axis_leanings_focus:0 "Симпатии Оси"
 axis_leanings_focus_desc:0 "У нас много общих интересов и ценностей с новой Германией, которая создает базу для своей власти в Европе. Присоединение к ней в качестве союзника даст нам могущественного друга на достаточно большом расстоянии, чтобы не соперничать с нашим правлением в Азии."
 subvert_india_focus:0 "Индийская национальная армия"
 subvert_india_focus_desc:0 "Если Британия осудит наши усилия по созданию империи, мы покажем им, что их собственная империя уже рушится. Индийские военнопленные и экспатрианты станут основой движения, которое сможет свергнуть британскую власть."
 jap_improved_sprit_focus:0 "Улучшенный национальный дух"
 jap_improved_sprit_focus_desc:0 "Национальная гордость и поддержка войны переполняют каждого подданного Императора, побуждая их к все новым высотам преданности!"
 befriend_siam_focus:0 "Подружиться с Сиамом"
 befriend_siam_focus_desc:0 "Сиам избежал европейской колонизации и не привык быть зависимым народом. Вместо того, чтобы подчинять их, мы должны убедить их сотрудничать с нами, чтобы все оставалось так, как есть."
 army_primancy_focus:0 "Приоритет армии"
 army_primancy_focus_desc:0 "Из двух основных видов вооруженных сил именно армия является сильной правой рукой Империи! Ее способность захватывать и удерживать территорию намного превосходит незначительные услуги, которые может предоставить флот. Осознав этот простой, очевидный факт и выделив больше ресурсов для армии, возможности безграничны."
 JAP_army_primancy_focus_bypass_tt:0 "Недостаточно мест для постройки §YВоенных заводов§! в домашнем регионе."
 jap_sia_love:0 "Японо-сиамская дипломатия"
 jap_sia_love_desc:0 "Япония сосредоточила свои дипломатические усилия на улучшении отношений с Сиамом."
 navy_primancy_focus:0 "Приоритет флота"
 JAP_navy_primancy_focus_bypass_tt:0 "Недостаточно мест для постройки §YМорских верфей§! в домашнем регионе."
 navy_primancy_focus_desc:0 "Из двух основных служб именно ВМС являются сильной правой рукой Империи! Его способность контролировать моря намного превосходит незначительные услуги, которые может предоставить армия. Признавая этот простой, самоочевидный факт и выделяя больше ресурсов на флот, возможности безграничны."
 army_innovations_focus:0 "Инновации армии"
 army_innovations_focus_desc:0 "Теперь, когда армия признана главной службой Империи, нам следует выделить больше ресурсов на изучение сухопутных доктрин."
 army_air_innovations_focus:0 "Инновации в области армейской авиации"
 army_air_innovations_focus_desc:0 "Основной задачей ВВС должна быть поддержка нашей прославленной армии!"
 army_motorization_focus:0 "Моторизация армии"
 army_motorization_focus_desc:0 "Большее внимание моторизации увеличит скорость, с которой пехота может выйти на поле боя, по крайней мере, в районах с хорошими дорогами."
 air_base_expansion_focus:0 "Расширение авиабазы"
 air_base_expansion_focus_desc:0 "Для лучшей поддержки армии ВВС нужны более крупные авиабазы."
 armor_innovations_focus:0 "Броневые инновации"
 armor_innovations_focus_desc:0 "Некоторые генералы, при превосходстве нашей армии, предложили нам инвестировать в ряд современных бронированных машин."
 naval_innovations_focus:0 "Военно-морские инновации"
 naval_innovations_focus_desc:0 "Теперь, когда флот признан главной службой Империи, нам следует выделить больше ресурсов на проектирование новых классов кораблей."
 naval_air_innovations_focus:0 "Инновации в палубной авиации"
 naval_air_innovations_focus_desc:0 "Главной задачей ВВС должна быть поддержка нашего хваленого ВМФ!"
 convoy_protection_focus:0 "Защита конвоев"
 convoy_protection_focus_desc:0 "Хотя это тактика трусливых и бесчестных, есть вероятность, что вражеские страны могут взять на прицел торговые суда, перевозящие припасы и ресурсы для нашей Империи. Нам нужно изучить, как лучше всего защитить эти суда, если это произойдет."
 advanced_torpedoes_focus:0 "Перспективные торпеды"
 advanced_torpedoes_focus_desc:0 "Используя сжатый кислород вместо сжатого воздуха в двигателях наших торпед, мы сможем перемещаться дальше и нести более крупную боевую часть, чем любой из предыдущих типов."
 shbb_focus:0 "Сверхтяжелые линкоры"
 shbb_focus_desc:0 "В краткосрочной перспективе вряд ли мы сможем перестроить или США по количеству линкоров, но, возможно, нам это и не нужно. Вместо этого, можно попытаться построить гораздо более мощные линкоры, чем позволяют западникам строить по Вашингтонскому договору."
 naval_base_focus:0 "Расширение военно-морской базы"
 naval_base_focus_desc:0 "Для расширения флота требуется больше военно-морских баз."
 carrier_focus:0 "Фокус на авианосцы"
 carrier_focus_desc:0 "Японии нужен мощный флот, а авианосцы должны стать основой силы нашего флота. Время линкоров подошло к концу, и наши враги вскоре это поймут!"
 battleship_focus:0 "Фокус на линкоры"
 battleship_focus_desc:0 "Японии необходим мощный флот, и линкор должен стать стержнем силы нашего Флота. Пусть другие нации растратят свое богатство на непроверенные Авианосцы, только Линкоры могут доминировать в морях!"
 spiritual_mobilization_focus:0 "Духовная мобилизация"
 spiritual_mobilization_focus_desc:0 "Вся наша нация, а не только наши солдаты, должны быть духовно готовы к войне. Для этого националисты были объединены в Национальном движении духовной мобилизации, чтобы повысить патриотизм и поддержку правительства."
 warrior_traditions_focus:0 "Воинские традиции"
 warrior_traditions_focus_desc:0 "На протяжении всей своей истории Япония сохраняла уникальный набор традиций среди класса воинов. Эти ценности должны быть возрождены и почитаемы каждым солдатом, независимо от его звания."
 divine_wind_focus:0 "Божественный ветер"
 divine_wind_focus_desc:0 "От любого солдата ожидается бесстрашие перед перспективой смерти, но наши люди должны выйти за эти рамки, готовясь пожертвовать собой без надежды на выживание во славу императора и нации."
 imperial_glory_focus:0 "Императорская слава"
 imperial_glory_focus_effect:0 "Позволяет производить §HYokosuka MXY7 Ohka§!"
 imperial_glory_focus_desc:0 "Камикадзе, тактика Подразделения особого назначения, превратила самоубийственные атаки из импровизированной последней меры в устоявшуюся доктрину. С появлением новых самолетов, по сути управляемых ракет, эти атаки станут неудержимыми."
 student_movement_focus:0 "Студенческое движение"
 student_movement_focus_desc:0 "Министерство образования является не менее важным элементом духовной мобилизации, чем другие, поэтому привлечение преподавателей и студентов на сторону нации создаст постоянную ориентированную на военные действия систему образования."
 extra_tech_focus:0 "Дополнительные исследования"
 synth_oil_focus:0 "Синтетическое топливо"
 synth_oil_focus_desc:0 "Наше собственное производство нефти очень ограничено, а импорт нефти делает нас зависимыми от иностранных интересов. Самым безопасным решением будет усовершенствование технологии синтетического масла."
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan доступен как промышленная группа"
 secret_weapon_focus:0 "Расширенное вооружение"
 secret_weapon_focus_desc:0 "Как островной империи мы всегда должны быть на передовой военно-морских исследований, но и ракетные установки дальнего действия не будут помехой."
 industrial_effort_focus:0 "Имперская экономия"
 industrial_effort_focus_desc:0 "Каждый подданный императора должен принести жертву на благо империи."
 industrial_effort_focus2:0 "Индустриальные усилия"
 industrial_effort_focus2_desc:0 "Япония недавно индустриализовалась, и пока еще не так сильна, как некоторые западные страны. Мы должны принять меры, чтобы сократить разрыв между нашими возможностями."
 infra_effort_focus:0 "Создание инфраструктуры"
 infra_effort_focus_desc:0 "Строительство инфраструктуры в нашей гористой стране не было легким делом, тем не менее, усилия должны продолжаться."
 fortress_japan_focus:0 "Крепость Япония"
 fortress_japan_focus_desc:0 "Если наши враги когда-нибудь и превзойдут наш флот, наши укрепления сделают любую попытку вторжения на порядок дороже, чем любая страна сможет себе позволить."
 crypto_bomb_focus:0 "Крипто-бомба"
 crypto_bomb_focus_desc:0 "Поляки разрабатывают блестящую машину, которую они называют \"крипто-бомбой\" и которая может взломать немецкий шифр \"Энигма\". У нас есть ресурсы, чтобы улучшить эту машину на нашей базе в Блетчли-парке."
 tizard_mission_focus:0 "Миссия Тисзарда"
 tizard_mission_focus_desc:0 "Мы достигли большого прогресса в технологиях, но мы не можем воспользоваться всеми нашими изобретениями в полной мере из-за недостатка ресурсов и промышленных мощностей. Сэр Генри Тисзард хотел бы возглавить делегацию для ведения переговоров о договоре о совместном использовании технологий с США."
 maud_focus:0 "Комитет MAUD"
 maud_focus_desc:0 "Комитет по \"военному применению уранового взрыва\" убежден, что теоретически возможно создать бомбу невероятной мощности, используя уран для достижения неконтролируемой реакции ядерного деления. Однако у нас может не хватить времени и возможностей, чтобы самостоятельно разработать эту технологию. Нам следует поговорить с американцами."
 general_rearmament_focus:0 "Генеральное перевооружение"
 general_rearmament_focus_desc:1 "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "Похоже, неизбежна очередная Великая война. Если не Гитлер, так Микадо или даже советы… Общественное мнение сложилось, мы можем начать программу всеобщего перевооружения."
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "Наши предшественники слишком пренебрегали нашей военной ситуацией. Мы должны начать программу всеобщего перевооружения, чтобы исправить жестокую нехватку в наших вооруженных силах."
 air_defense_focus:0 "Противовоздушная оборона"
 air_defense_focus_tt:1 "Добавить максимум §YПВО§! в §YВосточной Англии§!, §YСуссексе§! и §Юго-Западной Англии§!"
 air_defense_focus_bypass_tt:0 "Не хватает слотов для здания §YПВО§!"
 air_defense_focus_desc:0 "Не вызывает сомнений, откуда будет наноситься удар противника. Мы должны защитить побережье масштабными зенитными батареями."
 radar_focus:0 "РАДАР"
 radar_focus_desc:0 "Возможность обнаруживать вражеские бомбардировщики будет иметь решающее значение для ведения войны. Не жалеть ресурсов на дальнейшую разработку технологии радара и создание сети станций обнаружения вдоль побережья."
 royal_ordinance_focus:2 "[Root.GetRoyalOrdnanceFactoriesName]"
 royal_ordinance_focus_desc:1 "[Root.GetRoyalOrdnanceFactoriesDesc]"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "Королевские оружейные фабрики"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Революционные оружейные фабрики"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "Королевский арсенал в Вулидже совершенно не способен производить все необходимое нам вооружение и стрелковое оружие. Необходимо построить еще много заводов по всей стране, желательно в относительно безопасных местах."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "Революционный арсенал в Вулидже совершенно не способен производить все необходимое нам вооружение и стрелковое оружие. Необходимо построить еще много заводов по всей стране, желательно в относительно безопасных местах."
 shadow_scheme_focus:0 "Теневая схема"
 shadow_scheme_focus_desc:0 "Министерство авиации выдвинуло блестящее предложение по облегчению конверсии гражданских заводов в военные. При наличии соответствующих субсидий и займов различным ключевым предприятиям их заводы можно будет расширить и перестроить заранее, чтобы переход на военное производство прошел намного легче."
 shadow_scheme_focus_tt:1 "Предоставляет §G4§! строительных слота и §Y4 военных завода§! в двух штатах при вступлении в войну."
 uk_small_arms_focus:0 "Компания BSA"
 uk_small_arms_focus_desc:1 "[Root.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Королевские оружейные заводы не производят достаточного количества стрелкового оружия, но, как и во время Первой мировой войны, мы можем заключить договор с компанией Birmingham Small Arms и нарастить ее мощности."
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Революционные оружейные заводы не производят достаточного количества стрелкового оружия, но, как и во время Великой войны, мы могли бы заключить контракт с Birmingham Small Arms Company и расширить их мощности."
 UK_secret_focus:0 "Секретное оружие"
 UK_secret_focus_desc:0 "Теперь у нас есть знания и инфраструктура, чтобы сосредоточиться на разработке различных проектов секретного оружия, которые раньше принадлежали к области научной фантастики."
 air_rearmament_focus:0 "Перевооружение ВВС"
 air_rearmament_focus_desc:1 "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "В любой войне с континентальным противником Королевские военно-воздушные силы окажутся ключом к победе. Сначала мы должны убедиться, что наши авиабазы могут поддержать наши планы по перевооружению!"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "В любой войне с континентальным противником Народные военно-воздушные силы окажутся ключом к победе. Сначала мы должны убедиться, что наши авиабазы могут поддержать наши планы по перевооружению!"
 fighter_command_focus:0 "Истребительное командование"
 fighter_command_focus_desc:0 "Нашим первым приоритетом должно быть установление контроля над собственным небом! Трудно определить более важную область военных исследований, чем разработка истребителей."
 bomber_command_focus:0 "Бомбардировочное командование"
 bomber_command_focus_desc:0 "Как всегда говорил Джулио Дуэ; 'Бомбардировщик всегда пробьется!'. Несмотря на достижения в области радиолокационных технологий и противовоздушной обороны, мы должны в первую очередь сосредоточиться на разработке более совершенных бомбардировщиков."
 coastal_command_focus:0 "Береговое командование"
 coastal_command_focus_desc:1 "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Наша промышленность во многом зависит от ресурсов, которые поступают в Британию из отдалённых уголков Империи. Наши конвои — это основа нашей мощи, их должны защищать как Королевский флот, так и Королевские ВВС. Мы должны создать отдельное подразделение ВВС для защиты подходов к нашим портам!"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "Наша промышленность во многом зависит от ресурсов, которые поступают в Британию из отдалённых уголков Империи. Наши конвои — это основа нашей мощи, их должны защищать как Флот освобождения трудящихся, так и Народные ВВС. Мы должны создать отдельное подразделение НВВС для защиты подходов к нашим портам!"
 aircraft_production_focus:0 "Группировка по производству авиатехники"
 aircraft_production_focus_desc:0 "Производство авиатехники остаётся нашим главным приоритетом. Лондонская группа по производству авиатехники (LAPG) должна быть создана для управления и координации всего объёма производства самолётов."
 uk_jet_focus:0 "Реактивные самолёты"
 uk_jet_focus_desc:0 "Похоже, что реактивные двигатели полностью заменят поршневые двигатели в самолётах. Их потенциал огромен, и мы не должны допустить отставания Британии в этой важнейшей области исследований."
 naval_rearmament_focus:0 "Морское перевооружение"
 naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "Хотя мы попытались предотвратить гонку военно-морских вооружений путем Второго лондонского морского договора, даже подписавшие в основном игнорируют его. Королевский флот никогда не должен терять свое мировое превосходство. Мы должны всегда обеспечивать, чтобы он оставался самым большим в мире."
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "Хотя мы попытались предотвратить гонку военно-морских вооружений путем Второго лондонского морского договора, даже подписавшие в основном игнорируют его. Военно-морской флот освобождения рабочих никогда не должен терять свое мировое превосходство. Мы должны всегда обеспечивать, чтобы он оставался самым большим в мире."
 uk_destroyer_focus:0 "Упор на эскадренные миноносцы"
 uk_destroyer_focus_desc:0 "Современные линкоры являются чудом, но мы не должны пренебрегать важной ролью скромного эсминца в защите наших конвоев."
 uk_convoy_focus:0 "Упор на охрану конвоя"
 uk_convoy_focus_desc:0 "Нельзя не подчеркнуть, наши конвои - это наша жизненная сила. Мы должны сделать все от нас зависящее, чтобы защитить их и быстро заменить потерянный тоннаж."
 uk_waves_focus:0 "Британия правит волнами"
 uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "В долгой тени Королевского флота другие морские державы вынуждены придумывать инновационные новые доктрины, чтобы компенсировать это. Мы не должны проявлять самодовольство и полагаться исключительно на количество и качество отдельных кораблей."
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "Под гнетом огромной мощи Военно-морского флота освобождения трудящихся другие морские державы вынуждены разрабатывать новые инновационные доктрины. Мы не должны расслабляться и полагаться только на количество и качество отдельных кораблей."
 uk_carrier_focus:0 "Внимание на авианосцы"
 uk_carrier_focus_desc:0 "Среди теоретиков военно-морского флота ведутся ожесточенные споры о том, насколько перспективны линкоры. Некоторые утверждают, что теперь будет доминировать современная авиация и что авианосцы вытеснят линкоры с позиции владык морей."
 uk_spain_focus:0 "Принудить Испанию"
 uk_spain_focus_desc:0 "Испанцы знают силу королевского военно-морского флота лучше большинства других стран, но, возможно, не помешает еще раз об этом напомнить..."
 uk_battleship_focus:0 "Внимание на линкоры"
 uk_battleship_focus_desc:0 "Хотя теоретики и спорят о превосходстве авиации и военно-морского флота, никто не хочет, чтобы орудия линкоров были направлены на его дворец. И даже если энтузиасты-любители авианосцев в конечном счете окажутся правы, линкоры все еще будут доминировать на морях в ближайшие годы."
 uk_turkey_focus:0 "Принудить Турцию"
 uk_turkey_focus_desc:0 "Им не обязательно любить нас, но этот дурак Джонни должен знать достаточно, чтобы бояться наших линкоров..."
 uk_amphibious_focus:0 "Десантные операции"
 uk_amphibious_focus_desc:0 "Господство над волнами — это прекрасно, но иногда надо выходить на сушу. Мы не должны забывать о нашей способности высаживать десант на враждебной территории."
 singapore_focus:0 "Стратегия Сингапура"
 singapore_focus_desc:0 "Сингапур должен оставаться нашей главной военно-морской базой на Востоке. Гонконг может пасть от японцев, но Сингапур должен оставаться неприступным, пока Главный флот не прибудет, чтобы решительно победить врага."
 sp_landward_forts_focus:0 "Сухопутные укрепления"
 sp_landward_forts_focus_desc:0 "Текущей обороны на острове Сингапур недостаточно. Мы должны сосредоточить наши усилия на укреплении укреплений!"
 peninsular_focus:0 "Война на полуострове"
 peninsular_focus_desc:0 "Мы должны упредить и замедлить врага, наступающего с севера через Малайю, прежде чем он достигнет Сингапура."
 hongkong_focus:0 "Удержите Гонконг"
 hongkong_focus_desc:0 "Стратегия Сингапура устарела. Наш план должен быть более смелым и полагаться на базу, расположенную гораздо ближе к Японии. С достаточным укреплением и оборудованием Гонконг отлично справится!"
 hk_landward_forts_focus:0 "Сухопутные укрепления"
 hk_landward_forts_focus_desc:0 "Гонконг должен превратиться в город-крепость, чтобы выдержать продолжительную атаку с материкового Китая."
 hk_air_focus:0 "Противовоздушная оборона"
 hk_air_focus_desc:0 "Мы должны значительно расширить и улучшить зенитные позиции в Гонконге."
 uk_embargo_focus:0 "Политика эмбарго"
 uk_embargo_focus_desc:0 "Лучший способ победить диктаторов - красных или коричневых - это просто лишить их ресурсов, необходимых для ведения войны. Проблема заключается в том, чтобы заставить банкиров и корпорации, ведущие с ними дела, подчиниться..."
 uk_sanction_italy_focus:0 "Ввести санкции против Италии"
 uk_sanction_italy_focus_desc:0 "Муссолини мечтает о новой Римской империи и, как бы абсурдно это ни звучало, в будущем может напасть на нас, чтобы осуществить свою мечту. Мы должны сделать все возможное, чтобы не допустить этого до того, как дело дойдет до войны."
 uk_sanction_japan_focus:0 "Ввести санкции против Японии"
 uk_sanction_japan_focus_desc:0 "Японцы, похоже, стремятся создать свою "Великую восточноазиатскую сферу сопроцветания", разумеется, под своей гегемонией. Британская империя является основным препятствием вместе с колониями других западных держав. Необходимо лишить их доступа к необходимым ресурсам."
 uk_burma_focus:0 "Дорога в Бирму"
 uk_burma_focus_desc:0 "Мы должны оказать помощь Китаю в его борьбе против Японии, построив дорогу (и сопутствующую инфраструктуру) между Бирмой и Китаем, где поставки будут доставляться сухопутным путем, вдали от посягательств Японии."
 uk_scandinavian_focus:0 "Скандинавское вмешательство"
 uk_scandinavian_focus_desc:0 "Скандинавия имела бы мало стратегического значения, если бы не одно обстоятельство — экспорт шведской железной руды. Мы должны оказать давление как на Швецию, так и на Норвегию, чтобы этот жизненно важный ресурс не попал в руки Германии. В случае их отказа нам, возможно, придется подготовиться к вторжению."
 uk_iraq_focus:0 "Защитить Ирак"
 uk_iraq_focus_desc:0 "Мы предоставили Ираку независимость в 1932 году, но с учетом текущей мировой ситуации это было, вероятно, ошибкой. Иракская нефть никогда не должна попасть в руки наших врагов."
 uk_iran_focus:0 "Защитить Иран"
 uk_iran_focus_desc:0 "Иран богат не только нефтью, которая недоступна нашим врагам, но это также стратегический центр между Индией, Ближним Востоком и Советским Союзом."
 uk_free_india_focus:0 "Независимость Индии"
 uk_free_india_focus_desc:0 "Япония активно подстрекает к восстанию в Индии и даже сформировала «Национальную индийскую армию», состоящую из индийских рекрутов. Ситуация может стать опасной, если ничего не предпринять, чтобы предотвратить это. Мы можем либо быстро победить Японию, либо пообещать индийцам независимость через несколько лет."
 uk_colonial_focus:0 "Поощрять колониальную элиту"
 uk_colonial_focus_desc:0 "Наша огромная, разросшаяся империя является домом для величайших умов в мире, но ее размеры не позволяют многим из них встречаться. Призывая их работать вместе над нашими важнейшими проектами, мы можем быстрее добиться результатов."
 uk_asia_focus:0 "Укрепить Восточную Азию"
 uk_asia_focus_desc:0 "Многим из наших старых колоний на востоке угрожают гражданские войны и имперские амбиции местных стран. Мы не должны пренебрегать нашими оставшимися форпостами, а должны продолжать развивать эти регионы, чтобы обезопасить наше глобальное присутствие."
 uk_china_focus:0 "Влияние на Китай"
 uk_china_focus_desc:0 "Хотя китайские националисты называют себя врагами наших колониальных устремлений, они зажаты между врагами с недостатком союзников. Если мы обратимся к ним, они могут быть готовы пересмотреть свою политику."
 uk_commonwealth_focus:0 "Связи в рамках Содружества"
 uk_commonwealth_focus_desc:0 "Объединенные общей преданностью Короне, страны Британского Содружества — первые, на кого мы можем рассчитывать в случае нового глобального конфликта. Обеспечение нашего дипломатического влияния там будет иметь первостепенное значение."
 uk_india_focus:0 "Развитие Раджа"
 uk_india_focus_desc:0 "Состояние наших колоний в Индии остается спорным как за границей, так и дома, но что бы ни было им уготовано, укрепление их промышленного потенциала является приоритетом на данном этапе."
 northern_expansion_focus:0 "Северная экспансия"
 northern_expansion_focus_desc:0 "Доктрина северной экспансии, которую поддерживает императорская армия, признает, что Советский Союз представляет наибольшую угрозу японским амбициям. С ростом напряженности в Европе обязательно представится благоприятный момент для атаки российского Дальнего Востока. Мы должны действовать быстро."
 southern_expansion_focus:0 "Южная экспансия"
 southern_expansion_focus_tt:0 "Добавить §Yпакт о ненападении§! с §YСоветским Союзом§!, когда выбрано\n"
 southern_expansion_focus_desc:0 "Доктрина южной экспансии, одобряемая императорским флотом, диктует, что Япония должна расширяться на юг в Юго-Восточную Азию и в Тихий океан. Богатые колонии европейских держав имеют ресурсы, жизненно важные для японской промышленности, но этот путь приведет к конфликту с Соединенными Штатами. Необходим упреждающий удар."
 new_ideas:0 "Новые министры доступны.\n"
 available_political_advisor:0 "§GAvailable§! как §YСоветник§!:\n"
 available_chief_of_army:0 "§GAvailable§! как §YНачальник сухопутных войск§!:\n"
 available_chief_of_navy:0 "§GAvailable§! как §YНачальник военно-морского флота§!:\n"
 available_chief_of_airforce:0 "§GAvailable§! как §YНачальник военно-воздушных сил§!:\n"
 available_military_high_command:0 "§GAvailable§! как §YВерховное командование§!:\n"
 available_theorist:0 "§GAvailable§! как §YТеоретик§!:\n"
 available_designer:0 "§GAvailable§! как §YКонструкторское бюро§!:\n"
 available_industrial_concern:0 "§GAvailable§! как §YПромышленный концерн§!:\n"
 remove_political_advisor:0 "§RУдалить§! как §YСоветник§!:\n"
 remove_chief_of_army:0 "§RУдалить§! как §YНачальник сухопутных войск§!:\n"
 remove_chief_of_navy:0 "§RУдалить§! как §YНачальник военно-морского флота§!:\n"
 remove_chief_of_airforce:0 "§RУдалить§! как §YНачальник военно-воздушных сил§!:\n"
 remove_military_high_command:0 "§RУдалить§! как §YВерховное командование§!:\n"
 remove_theorist:0 "§RУдалить§! как §YТеоретик§!:\n"
 usa_focus:0 "США Национальные Устремления"
 USA_issue_war_bonds:0 "Выпустить военные облигации"
 USA_issue_war_bonds_desc:0 "Продавая военные облигации, мы полагаемся на поддержку людей, их патриотизм, чтобы финансировать военные расходы."
 USA_office_of_strategic_services:0 "Управление стратегических служб"
 USA_office_of_strategic_services_desc:0 "Создание специального разведывательного агентства не только поможет в войне, но и в будущих операциях за рубежом. Британские спецслужбы могут послужить моделью."
 USA_wartime_industry:0 "Военная индустрия"
 USA_wartime_industry_desc:0 "Наша промышленность сильна, но не вся она приспособлена для производства военных материалов. Нахождение эффективных методов для облегчения этого изменения будет ключевым для использования наших ресурсов."
 USA_first_special_service_force:0 "Первые особые службы"
 USA_first_special_service_force_desc:0 "Операции за линией фронта на негостеприимной территории станут частью любого глобального конфликта. Формирование отрядов коммандос для выполнения этих задач имеет важное значение для нашей будущей войны."
 USA_rubber_reserve_company:0 "Резервная каучуковая компания"
 USA_rubber_reserve_company_desc:0 "С началом войны мы потеряли почти все наши источники импортного каучука.\n\nБлагодаря огромным скоординированным усилиям, каучуковые компании в Соединенных Штатах могут сотрудничать, чтобы найти лучшие способы производства синтетического каучука, возможно, даже удовлетворив потребности военных усилий."
 USA_manifest_destiny:0 "Явная судьба"
 USA_manifest_destiny_desc:0 "Особые обстоятельства, связанные с основанием и историей нашей нации, дают нам мандат на борьбу с несправедливостью и угнетением в любой точке мира. Чтобы создать безопасное международное сообщество, нашим основным экспортом должна быть свобода."
 USA_manifest_destiny_tt:0 "§YGrant военные цели против всех фашистских и коммунистических стран.§!\n"
 USA_scientist_haven:0 "Убежище для учёных"
 USA_scientist_haven_desc:0 "Провозгласив себя защитниками свободы во всем мире, мы можем приветствовать ученых и интеллигентов, изгнанных угнетающими режимами за рубежом, давая им шанс добиться успеха и помочь нашему делу в стране возможностей."
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "Миллионы людей все еще страдают от безработицы, вызванной Великой депрессией. Агентство, чтобы заставить этих людей работать над общественными проектами, может не полностью решить проблему, но Управление прогресса в работе является шагом в правильном направлении."
 USA_committee_on_technocracy:0 "Комитет по технократии"
 USA_committee_on_technocracy_desc:0 "Мы должны заменить ряд политиков и бизнесменов учеными и инженерами. Они обладают техническими знаниями для управления экономикой, и мы увидим большой научный прогресс, который приведет к тому, что наша экономика снова процветает."
 USA_support_rock_island:0 "Поддержка Острова Рок"
 USA_support_rock_island_desc:0 "Поддержка наших храбрых солдат любым способом, которым мы можем, является ключом к победе. Будь то тяжелый артиллерийский огонь издалека или более прямая поддержка на поле боя. Мы должны убедиться, что у наших солдат есть все необходимое."
 USA_military_construction:0 "Военное строительство"
 USA_military_construction_desc:0 "Когда сверхдержавы угрожают миру во всем мире, наши общественные работы должны быть обращены как к военным, так и к гражданским вопросам."
 USA_USACE_projects:0 "Проекты USACE"
 USA_USACE_projects_desc:0 "Корпусу инженеров армии США будет поручено создание фундамента для множества будущих военных проектов, подобных которым мир еще не видел. Essayons!"
 USA_arsenal_of_democracy:0 "Арсенал демократии"
 USA_arsenal_of_democracy_desc:0 "Независимо от того, вмешаемся ли мы напрямую в войну, демократические страны должны знать, что мы вооружим и поддержим их."
 USA_liberty_ships:0 "Корабли Свободы"
 USA_liberty_ships_desc:0 "Массовое производство грузовых судов должно сопровождаться нашим промышленным развитием, чтобы обеспечить доставку наших материалов и войск на театры военных действий, где они нужны."
 USA_war_propaganda:0 "Военная пропаганда"
 USA_war_propaganda_desc:0 "Наш народ не хочет отправлять своих детей умирать в очередной войне, но многие политики считают необходимым вмешательство. Пропаганда, направленная на то, чтобы демонизировать врага и призвать к открытому конфликту, может быть не только орудием тиранов."
 USA_war_plan_black:0 "Черный план войны"
 USA_war_plan_black_desc:0 "Очевидно, что политика и экспансионизм Германии выходят далеко за рамки здравого смысла. Их нужно остановить, прежде чем их военная машина достигнет точки невозврата."
 USA_embargo_germany:0 "Эмбарго Германии"
 USA_embargo_germany_desc:0 "Германия зависит от нефти и других природных ресурсов для ведения войны. Прекращение их доступа к этим ресурсам - это самое меньшее, что мы можем сделать."
 USA_destroyers_for_bases:0 "Эсминцы для баз"
 USA_destroyers_for_bases_desc:0 "Великобритания нуждается в кораблях, а мы хотим защитить нашу родную территорию. За право создания военных баз на территориях, на которые в данный момент претендует Великобритания, мы можем передать им эсминцы, что, хочется надеяться, также будет им полезно."
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 USA_war_plan_white:0 "План войны «Уайт»"
 USA_war_plan_white_desc:1 "[GetSovietThreatName] - это угроза, с которой нельзя не бороться. Как изнутри, так и снаружи, она представляет огромную опасность для нашей страны и всего мира."
 USA_embargo_USSR:0 "Эмбарго СССР"
 USA_embargo_USSR_desc:0 "Лишение Советского Союза возможности торговать с нами не только не позволит нам участвовать в их военных действиях, но и докажет превосходство нашей экономической модели."
 USA_war_plan_red:0 "План войны «Ред»"
 USA_war_plan_red_desc:0 "Похоже, бывшие угнетатели, которые уже, казалось бы, научились уважать людей, не согласны с теми изменениями, которые мы приняли. Британская империя показывает своё истинное лицо. Мы должны показать им, где наше место."
 USA_embargo_the_empire:0 "Эмбарго империи"
 USA_embargo_the_empire_desc:0 "Несмотря на то что долгое время нас связывали хорошие отношения, англичане предали идеалы, которым, мы надеялись, они научились следовать. Пора показать им, к чему это привело."
 USA_war_plan_orange:0 "План войны «Оранж»"
 USA_war_plan_orange_desc:0 "Империалистические амбиции Японии представляют для нас серьезную угрозу. Их попытки расшириться в Азии и Тихом океане быстро приведут к столкновению наших интересов."
 USA_embargo_japan:0 "Ввести эмбарго против Японии"
 USA_embargo_japan_desc:0 "Мы должны показать Японии, что США не будут принимать или поддерживать ее агрессивные действия. Эмбарго станет первым шагом к срыву ее планов в отношении Тихого океана."
 USA_prepare_intervention:0 "Подготовиться к вмешательству"
 USA_prepare_intervention_desc:0 "В результате дипломатических и торговых решений наша позиция на международной арене изменилась с нейтральной и изоляционистской на активную в отношении внешней агрессии. Наша военная политика в будущем будет это отражать."
 USA_extra_tech_team:0 "Дополнительная техническая группа"
 USA_manhattan_project:0 "Манхэттенский проект"
 USA_manhattan_project_desc:0 "Разработка заменителей материалов, как кажется из названия безобидного проекта USACE, в итоге станет известна как Манхэттенский проект. Одна из самых засекреченных и опасных затей в военной истории, ее цель - создать первую атомную бомбу."
 USA_unholy_alliance:0 "Нечестивый союз"
 USA_unholy_alliance_desc:0 "Иногда нам приходится выбирать своих врагов. Часто этот выбор не бывает легким. Будущее может судить нас за то, что мы встанем плечом к плечу с одним тираном, или хвалить нас за то, что мы спасем его от другого."
 USA_unholy_alliance_tt:1 "Повышает мнение и торговое мнение с [SOV.GetNameDef] или Германией, если они воюют, присоединяясь к защищающейся стороне."
 USA_limited_intervention:0 "Ограниченное вмешательство"
 USA_limited_intervention_desc:0 "Чтобы вовлечь нас в полномасштабную войну, потребуется экстраординарная агрессия, но после последних событий многие люди охотно помогают в конфликтах за рубежом."
 USA_the_giant_wakes:0 "Гигант просыпается"
 USA_the_giant_wakes_desc:0 "Нации обращаются к нам, чтобы защитить ценности демократии и свободы. Мира, где родилась не вмешивающаяся Америка, больше нет, и мы должны соответствующим образом адаптироваться."
 USA_pearl_harbor_gambit:0 "Ставка на Перл-Харбор"
 USA_pearl_harbor_gambit_desc:0 "Военно-морская база в Перл-Харборе - легкая цель для японцев. Разместив там флот, мы продемонстрируем нашу мощь в Тихом океане. Осмелятся ли они бросить вызов столь смелому шагу?"
 USA_pearl_harbor_gambit_tt:0 "§YПока фокус работает, у Японии будет возможность начать атаку.§!"
 USA_cancel_pearl_harbor_gambit:0 "Отменить ставку на Перл-Харбор"
 USA_cancel_pearl_harbor_gambit_desc:0 "Размещение флота в Перл-Харборе подвергает опасности жизни наших моряков. Мы не будем рисковать ими, чтобы спровоцировать войну с Японией."
 USA_air_war_plans_division:0 "Управление планов воздушной войны"
 USA_air_war_plans_division_desc:0 "Чтобы расставить правильные приоритеты в авиации и производстве самолетов, потребуется долгосрочное планирование. AWPD обеспечит нам материальные средства, организацию и стратегические планы."
 USA_air_support:0 "Авиационная поддержка"
 USA_air_support_desc:0 "Воздушная война, прежде всего, должна использоваться вместе с другими военными операциями."
 USA_strategic_bombing:0 "Стратегическая бомбардировка"
 USA_strategic_bombing_desc:0 "Возможность точной бомбардировки позволит нам остановить военную машину любой нации на ее пути."
 USA_TAC:0 "Тактические бомбардировки"
 USA_TAC_desc:0 "Создание самолетов, предназначенных для атаки тактических целей, позволит нашим войскам продвигаться более безопасно."
 USA_combined_bomber_offensive:0 "Совместная бомбардировочная операция"
 USA_combined_bomber_offensive_desc:0 "Вместе с другой великой державой на нашей стороне мы получаем неожиданные преимущества в исследованиях и применении масштабных наступательных бомбардировок."
 USA_fund_the_navy:0 "Финансирование флота"
 USA_fund_the_navy_desc:0 "Мы должны быть готовы адаптироваться к любым новинкам наших врагов. Увеличение финансирования военно-морских учений приведет к повышению эффективности флота, который сможет тактически превзойти наших врагов."
 USA_bureau_of_ships:0 "Бюро кораблестроения"
 USA_bureau_of_ships_desc:1 "Мы объединим Бюро строительства и ремонта и Бюро инженерии в одну организацию, которая будет отвечать за будущие разработки в военно-морской сфере. Пока мы этим занимаемся, возможно, пришло время расследовать слухи о неэффективной работе торпед, которые Бюро вооружений так рьяно отрицает."
 USA_battleship_primacy:0 "Преимущество линкора"
 USA_battleship_primacy_desc:0 "С момента денонсации Японской империей Вашингтонского военно-морского договора возможна новая гонка вооружений на море. Мы гарантируем, что у нас будет больше всего и самых лучших линкоров."
 USA_advanced_mahanian_doctrine:0 "Усовершенствованная доктрина Мэхэна"
 USA_advanced_mahanian_doctrine_desc:0 "Влияние Альфреда Тэйера Мэхэна на ведение морских войн неоспоримо. На основе его работ мы сможем эффективно использовать линкоры, которые он считал решающим фактором."
 USA_carrier_primacy:0 "Авианосное превосходство"
 USA_carrier_primacy_desc:0 "В будущих боях нам понадобится мощь авиации, а наиболее практичным способом увеличить ее радиус действия является использование авианосцев. Нам нужны более усовершенствованные и специализированные модели."
 USA_bureau_of_aeronautics:0 "Бюро аэронавтики"
 USA_bureau_of_aeronautics_desc:0 "Чтобы удовлетворить потребности в развитии морской авиации, необходимо расширить полномочия Бюро аэронавтики, которое уже десятилетия занимается этими вопросами."
 USA_escort_effort:0 "Эскортное обеспечение"
 USA_escort_effort_desc:0 "Подводные лодки представляют опасность для наших торговых конвоев. Сосредоточение внимания на разработке новых моделей эсминцев позволит нам вести эффективную противолодочную войну."
 USA_convoy_tactics:0 "Тактика конвоев"
 USA_convoy_tactics_desc:0 "Защита наших торговых судов осуществляется не только путем сопровождения и эффективного сбора разведданных, но и путем тактического выбора маршрутов и операций."
 USA_amphibious_operations:0 "Десантные операции"
 USA_amphibious_operations_desc:0 "Если только наши худшие кошмары не сбудутся, эта война не закончится на американской земле. Удачно проведенные высадки будут нашей частью к победе."
 USA_expand_the_USMC:0 "Расширение Корпуса морской пехоты США"
 USA_expand_the_USMC_desc:0 "Корпус морской пехоты США был решающей силой во многих прошлых войнах и может быть как никогда более актуальным для наших десантных операций. Semper fidelis!"
 USA_reinforce_monroe_doctrine:0 "Подтверждение доктрины Монро"
 USA_reinforce_monroe_doctrine_desc:0 "Доктрина Монро, действующая уже более 100 лет, узаконила вмешательство США в случае попыток европейцев колонизировать Америку, но не вмешиваться в европейские дела. Укрепление нашей роли миротворцев на этих континентах увеличит наше влияние в регионе."
 USA_carribean_sphere:0 "Карибский бассейн"
 USA_carribean_sphere_desc:0 "Острова Карибского моря — идеальное место для нанесения ударов по нашему восточному побережью или Панамскому каналу, поэтому, разумеется, мы должны ясно дать понять, что никакие враждебные захваты этой области не будут разрешены."
 USA_central_america:0 "Центральная Америка"
 USA_central_america_desc:0 "Было бы немыслимо допустить, чтобы какая-либо иностранная держава взяла под свой контроль или даже могла бы угрожать Панамскому каналу. Таким образом, мы гарантируем независимость всех центральноамериканских стран."
 USA_the_neighbors:0 "Соседи"
 USA_the_neighbors_desc:0 "Прежде всего, мы должны позаботиться о безопасности стран, расположенных ближе всего к нам. Вместо того, чтобы позволить врагам пересечь территории наших соседей, чтобы добраться до нас, они пересекут нашу территорию, если пересекут наших соседей."
 USA_south_america:0 "Южная Америка"
 USA_south_america_desc:0 "Колониальные империи больше никогда не должны расширяться в Южную Америку, мы гарантируем независимость нашим южным братьям, чтобы обезопасить их."
 USA_pax_americana:0 "Мир в Америке"
 USA_pax_americana_desc:0 "В Америке должен быть мир. У нас есть сила, чтобы гарантировать, что незначительные ссоры между соседними странами не перерастут в нечто большее. Война у нашего порога - именно то, чего хотят наши враги, и мы должны сделать все возможное, чтобы предотвратить это."
 USA_pax_americana_tt:0 "@USA §YСоединенные Штаты§! могут вмешиваться в войны между американскими странами"
 USA_black_chamber:0 "Операция «Черный кабинет»"
 USA_black_chamber_complete:0 "§RСЕКРЕТНО§!"
 USA_black_chamber_desc:0 "Мы располагаем информацией о политической деятельности в ряде американских стран, которая не соответствует нашим интересам. К счастью, мы создали подпольную пропагандистскую сеть и готовы подтолкнуть эти страны в нашем направлении. Это то, что мы должны сделать, чтобы не подвергаться угрозе дома."
 USA_preemptive_intervention:0 "Превентивное вмешательство"
 USA_preemptive_intervention_desc:0 "Мы больше не можем сидеть сложа руки и смотреть, как соседние страны создают орудия войны, предназначенные для подавления нас или наших союзников. Мы должны вмешаться ради блага нашей могущественной страны и всего мира."
