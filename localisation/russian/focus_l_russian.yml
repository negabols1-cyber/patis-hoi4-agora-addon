 SWI_add_forts_bordering:0 "[ROOT.GetNameDef] получает §H2 сухопутных форта§! в каждой соседней провинции.\n\n"
 ROM_white_squadron_focus:0 "Белая эскадра"
 ROM_white_squadron_focus_desc:0 "Белая эскадрилья, предложенная Мариной Штирбей, талантливым пилотом знатного рода, — это служба воздушных машин скорой помощи, пилотируемая исключительно женщинами. Одна лишь мысль о том, что спасение близко, могла бы поддерживать боевой дух наших солдат."
 HUN_protect_czechoslovakia_tt:0 "\nУ них будет больше шансов сдаться, если:\n - §HНапряжение в мире§! высоко\n - Они не в §Hфракции§!\n - Они §Hхорошо к нам относятся§!\n - Они заключили с нами §Hпакт о ненападении§!"
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§! вряд ли §Rсогласится§! на наши требования, если только не окажется в отчаянном положении.\n\n"
 CAN_offer_concessions_for_labrador_tooltip:0 "§H[ENG.GetName]§! с большей вероятностью примет это предложение, чем прямое требование. Они будут §Gболее склонны§! пойти на наши требования, если они:\n - Находятся в состоянии войны\n - Хорошо к нам относятся\n - Имеют более §H25%§! хода капитуляции\n\nЕсли они примут:\n"
 tfv_canada.63.t:0 "[CAN.GetNameDef] предлагает уступки за Ньюфаундленд"
 tfv_canada.63.d:0 "Новое правительство [CAN.GetAdjective] государства предлагает нам интригующее предложение по передаче наших территорий в Ньюфаундленде. Хотя верно, что законы нашей страны признают неделимое государство, наши советники настоятельно призывают нас рассмотреть возможность нового фронта, который может отвлечь от ситуации в Европе."
 tfv_canada.63.a:0 "Действительно."
 tfv_canada.63.b:0 "Никогда!"
 CAN_offer_concessions_for_labrador_and_newfoundland:0 "Уступки за Лабрадор и Ньюфаундленд"
 CAN_offer_concessions_for_labrador_and_newfoundland_desc:0 "Британцы претендуют на земли, примыкающие к нашему отечеству. Хотя мы не желаем войны с превосходящим противником, они могут согласиться на не самую выгодную сделку, если их положение того потребует."
 AST_central_bureau:0 "Согласовать Центральное бюро"
 AST_central_bureau_desc:0 "Бюро связи и разведки, скоординированное с США, обещает дать нам стратегическое преимущество в грядущей буре. Наши знания в этой области должны быть оценены по достоинству."
 HUN_a_new_flagship:0 "Гордость флота"
 HUN_a_new_flagship_desc:0 "Длинная история нашей военно-морской традиции полна испытаний, бедствий и предательств. Чтобы восстановить гордость за наше наследие, наши адмиралы предлагают построить новый флагман, который вдохновит всю нацию."
 HUN_dockyards:0 "Обновить судоходную промышленность"
 HUN_dockyards_desc:0 "Чтобы уверенно приступить к восстановлению наших границ, мы должны начать работу по созданию средиземноморского флота, который сможет соперничать с нашими прошлыми достижениями."
 if_no_depression_get_stuff_TT:0 "\nЕсли §H$CAN_great_depression_1$§! уже не актуально, будет применён другой бонус.\n\n"