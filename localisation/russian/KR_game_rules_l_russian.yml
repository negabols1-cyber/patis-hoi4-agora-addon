l_russian:
  RULE_UNIT_LIMIT_OPTIONS:0 "Лимиты дивизий"
  RULE_OPTION_STANDARD:0 "Применяется ко всем"
  RULE_UNIT_LIMIT_OPTIONS_STANDARD_DESC:0 "Ограничения применяются к тому, сколько дивизий может построить ИИ, на основе подсчета заводов и уровня экономического закона. Как только ИИ достигнет этого предела, он просто перестанет строить новые дивизии. Это ограничение также применимо к игроку, хотя для него это мягкий предел, и он получает штраф в зависимости от того, насколько превышен лимит.\n\n§RОбратите внимание, что это система, введенная для уменьшения неизбежного замедления, которое происходит по мере развития игры, поскольку огромное количество дивизий в действии является основной причиной задержки в системе.§!"
  RULE_UNIT_LIMIT_OPTIONS_AI_ONLY:0 "Применяется только к ИИ"
  RULE_UNIT_LIMIT_OPTIONS_AI_ONLY_DESC:0 "Ограничения применяются к тому, сколько дивизий может построить ИИ, на основе подсчета заводов и уровня экономического закона. Как только ИИ достигнет этого предела, он просто перестанет строить новые дивизии. При этом нет ограничений на количество дивизий, которые может построить игрок, кроме его возможности поставлять людские ресурсы и оборудование.\n\n§RОбратите внимание, что это даст игроку значительное преимущество перед странами ИИ, которые в противном случае были бы сопоставимы по силе.§!"
  RULE_OPTION_TURN_OFF:0 "Отключить"
  RULE_UNIT_LIMIT_OPTIONS_TURN_OFF_DESC:0 "Это полностью отключает систему ограничения дивизий.\n\n§RРекомендуется делать это только в том случае, если вас не волнует значительное замедление скорости игры по мере ее развития или если у вас ОЧЕНЬ мощный компьютер для запуска игры.§!"
  RULE_DEMOB_OPTIONS:0 "Демoбилизация в мирное время"
  RULE_OPTION_DEMOB_EXISTS:0 "По умолчанию"
  RULE_OPTION_DEMOB_EXISTS_DESC:0 "В мирное время игроку будет предложено снизить уровень экономики и/или призыва в соответствии с требованиями мирного времени и в зависимости от его военной поддержки в течение четырех месяцев. ИИ будет поступать так же, хотя он сделает это быстрее и будет склонен снижать свои законы до более низкого уровня, чем требуется игроку. Если к ИИ применяются ограничения на количество дивизий, это также может побудить его сократить количество активных подразделений из соображений производительности."
  RULE_OPTION_DEMOB_AI_ONLY:0 "Применяется только к ИИ"
  RULE_OPTION_DEMOB_AI_ONLY_DESC:0 "В мирное время ИИ снизит уровень своей экономики и/или призыва. Если к ИИ применяются ограничения на количество дивизий, это также побудит его сократить количество активных подразделений из соображений производительности. Однако игроку никогда не будет предложено снижать свои законы."
  RULE_OPTION_DEMOB_OFF:0 "Отключить"
  RULE_OPTION_DEMOB_OFF_DESC:0 "Ни игрок, ни ИИ никогда не будут получать уведомления о необходимости снижать уровень экономики и/или призыва в мирное время.\n\n§RРекомендуется делать это только в том случае, если вас не волнует значительное замедление скорости игры по мере ее развития или если у вас ОЧЕНЬ мощный компьютер для запуска игры.§!"