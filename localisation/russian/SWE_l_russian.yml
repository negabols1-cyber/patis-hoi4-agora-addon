################party names
  SWE_kings_council_party_long:0 "Совет короля"
  SWE_kings_council_party:0 "Совет короля"
  SWE_motti_tactic:0 "Активная оборона"
  SWE_motti_tactic_desc:0 "Реалистично говоря, даже с нашим первоклассным оружием и тактикой Швеция не могла надеяться выиграть честный бой против любой из великих держав Европы. Финны разработали то, что они называют ''тактикой Мотти'', оборонительной партизанской тактикой, и их изучение может помочь нам, если случится худшее."
  SWE_kings_council:0 "Король в совете"
  SWE_kings_council_desc:0 "Король в совете или \"Konungen i Statsrådet\" дает королю возможность по своему желанию увольнять и реформировать Кабинет. Хотя это может быть непопулярно или не особенно демократично, правление нашего мудрого короля может быть единственным, что может провести нас через потрясения современного времени."
  SWE_convoy_focus:0 "Защитить торговых моряков"
  SWE_convoy_focus_desc:0 "Шведская экономика основана на экспорте и импорте. Если наш торговый флот будет потоплен, наша нация тоже может погибнуть. Мы должны сосредоточить наши военно-морские усилия на конвоях и их защите!"
  SWE_iron_ore:0 "Поддержать промышленность по производству товаров"
  SWE_iron_ore_desc:0 "Швеция имеет давние традиции судостроения и имеет большой торговый флот. Мы должны воспользоваться этим и еще больше поддержать наши внутренние возможности судостроения."
  SWE_fortify_gulf:0 "Укрепить Ботнический залив"
  SWE_small_arms_focus:0 "Оружейный завод"
  SWE_unified_command:0 "Верховный Главнокомандующий"
  SWE_slot_expansion:0 "Промышленное Сотрудничество"
  SWE_technology_sharing:0 "Обмен Технологиями"
  SWE_technology_sharing_desc:0 "Обмен любыми технологическими достижениями с членами фракции, будет зависеть от членов фракции."
  SWE_kings_meeting:0 "Стокгольмское Комюнике"
  SWE_hansson_3:0 "Кабинет Ханссона III"
  SWE_hansson_3_desc:0 "Премьер-министр Ханссон пытается сформировать кабинет из представителей разных партий, чтобы содействовать стабильности государства в то время, когда другие нации склоняются к экстремистским идеям. Если удастся убедить другие партии, мы можем продолжать быть бастионом демократии, независимо от ситуации в мире."
  SWE_construction_effort_II:0 "Эрикссон"
  SWE_frivilligkaren:0 "Расширить Frivilligkåren"
  SWE_frivilligkaren_desc:0 "Многие сочувствуют делу финнов и рассматривают это как продолжение нашей собственной внешней политики, что дает много потенциальных новобранцев."
  SWE_german_command:0 "Немецкие советники"
  SWE_german_command_desc:0 "Разрешить опытным немецким командирам помогать, руководить и обучать несколько наших подразделений, чтобы повысить эффективность во время войны."
  SWE_embargo_soviet:0 "Эмбарго СССР"
  SWE_embargo_england:0 "Эмбарго Великобритании"
  SWE_baltic_uprising:0 "Балтийский Мятеж"
  SWE_baltic_uprising_desc:0 "Объяснение: Эстония на 60% (и Латвия на 40%) вероятнее всего восстанет против СССР. 10 дней спустя в Швецию из Таллина будут отправлены 1 легкий крейсер, 2 эсминца и 1 подводная лодка."
  SWE_volunteer_corps:0 "Нейтралитет"
  SWE_polistrupper_focus:0 "Полиция"
  SWE_polistrupper_focus_desc:0 "Несколько датчан и норвежцев, уставших от оккупации, ищут возможность бороться за свою свободу. Наше государство может вооружить их, организовать и обучить их под видом полицейских тренировок, чтобы они были готовы освободить свою родину, когда придет время."
  SWE_guarantee_finland:0 "Гарантировать Финляндию"

  SWE_nationalism_focus:0 "Коалиционное правительство NSAP"
  SWE_nationalism_focus_desc:0 "Наши недавние действия по вопросу об Аландских островах воодушевили NSAP. Их поддержка среди населения и (что вызывает беспокойство) среди военных растет, и, похоже, что для сохранения какого-либо контроля правящая партия должна включить их в состав правящей коалиции."
  SWE_internationalism_focus:0 "Коалиционное правительство SKP"
  SWE_internationalism_focus_desc:0 "SKP неожиданно приветствовал нашу отмену Аландской конвенции, назвав это великой победой над капиталистами и империалистами. Их пропаганда начинает влиять на общественность, и коалиция может стать нашей лучшей надеждой на стабильность."

  SWE_support_allies:0 "Гетеборгское коммюнике"
  SWE_malmoe_communique:0 "Мальмё коммюнике"
  SWE_american_engineers:0 "Американские инженеры"

  SWE_danish_ultimatum:0 "Датский ультиматум"
  #SWE_danish_ultimatum:0 "Вступайте или умрите"

  SWE_ajs:0 "Училище Рейнджеров AJS"
  SWE_ajs_desc:0 "Школа армии Jägarskola отвечает за обучение наших спецназовцев, но с момента Nedrustning она видит все меньше кандидатов. Финансирование и расширение помогут создать новое поколение грозных Jägars."

  SWE_svensk_standard:0 "Единый производственный стандарт"
  SWE_svensk_standard_desc:0 "Швеция - ведущий промышленный центр Скандинавии. Это даёт нам некоторое влияние на наших соседей. Продвигая использование шведских стандартов на международном уровне, мы получим прибыль от оптимизации нашей промышленности."
  SWE_beredskap:0 "Бередскап"
  SWE_beredskap_desc:0 "Подготовьте вооружённые силы для защиты Швеции от любой внешней угрозы."
  SWE_arrest_royalists:0 "Красно-синяя революция"
  SWE_arrest_royalists_desc:0 "Люди не могут ждать, пока буржуазное правительство уйдёт. Несмотря на то, что у коммунистов нет большинства, партизаны ШКП готовы арестовать или казнить любого, кто будет стоять у них на пути - даже если это будет каждый член правительства, который хоть что-то умеет делать..."
  SWE_abolish_monarchy:0 "Упразднить монархию"
  SWE_abolish_monarchy_desc:0 "Даже если наш король допустит коммунистов в парламент, как коммунистическая страна может иметь богатого короля? Мы должны покончить с фарсом шведской монархии и отправить этого нечестного аристократа в изгнание."
  SWE_facket:0 "Фолькхеммет"
  SWE_facket_desc:0 "Шведский коммунизм - это путь вперёд! Мы не можем позволить продажным реакционерам вроде Советов удерживать народную революцию! Мы объединимся с нашими братьями, чтобы распространить красную идеологию!"
  SWE_norway_friend:0 "Финансировать норвежских коммунистов"
  SWE_norway_friend_desc:0 "Наша соседняя Норвегия - плодородная почва для дальнейшего выращивания коммунизма. Мы даже могли бы поддержать интернационалистов, которые, возможно, захотят союза с нашей страной!"
  SWE_ideological_propaganda:0 "Идеологическая пропаганда"
  SWE_ideological_propaganda_desc:0 "Любое коммунистическое движение - это потенциальная ячейка, готовая организовать массы."
  SWE_deal_soviet:0 "Сделка с СССР"
  SWE_deal_soviet_desc:0 "Русские никогда не были дружелюбны по отношению к Швеции, но фашизм - гораздо более страшный враг. Если мы согласимся поддержать их претензии на финскую территорию, мы сможем еще зарыть топор войны и получить свободу действий в Норвегии в придачу."
  SWE_women_pilots:0 "Женский лётный корпус"
  SWE_women_pilots_desc:0 "Вступите в программу женских пилотов."
  SWE_technology_sharing_comintern:0 "Кольский обмен"
  SWE_technology_sharing_comintern_desc:0 "Поскольку Норвегия становится все более дружелюбной, а Печенга переходит под советскую юрисдикцию, мы теперь можем свободно обмениваться идеями с нашими советскими братьями, по крайней мере теми, что разрешены СКП."
  SWE_norway_unification:0 "Скандинавский социалистический союз"
  SWE_norway_unification_desc:0 "Норвежские коммунисты умоляют о нашем просвещенном правлении, желая отменить унижение 1905 года, навязанное им общественными элитами! Как только их положение в парламенте будет надежным, мы сможем потребовать объединения!"
  SWE_support_iceland_rebels:0 "Поддержка исландских националистов"
  SWE_support_iceland_rebels_desc:0 "Исландия сильно страдает под слабым и неэффективным управлением Датского государства, осознают они это или нет. На острове существует ядро националистов, и единственный акт милосердия - вооружить их.
  SWE_iceland_rebel_uprising:0 "Восстание в Исландии"
  SWE_iceland_rebel_uprising_desc:0 "Исландское движение за независимость достигло кульминации. Вооружённые и обученные националисты ждут нашего сигнала, чтобы освободиться от датского ярма. Конечно, датчане могут отрицательно отреагировать на это..."
  SWE_strb:0 "Катера поддержки"
  SWE_strb_desc:0 "Разрабатывайте небольшие, маневренные катера, вооружённые пулемётами и с большим пространством для перевозки морпехов и ускорения вторжений."
  SWE_axis_leanings_focus:0 "Сближение с Осью"
  SWE_axis_leanings_focus_desc:0 "Немцы - наши родственники, однако несмотря на это мы провели большую часть нескольких последних столетий в борьбе с ними. Больше нет. Швеция и Германия объединятся против большевиков и их шайки!"
  SWE_technology_sharing_axis:0 "Krupp-Landsverk"
  SWE_technology_sharing_axis_desc:0 "Немецкие технологии впечатляют даже тех, кто находится в Свеа Рике. Если мы поддержим слияние Krupp и Landsverk, новый конгломерат даст нам доступ к некоторым из этих футуристичных немецких игрушек."
  SWE_found_own_empire:0 "Наша собственная империя"
  SWE_found_own_empire_desc:0 "Когда-то Швеция была самой грозной страной во всей Европе. Немцы, финны, русские, британцы - все преклоняли колени или платили цену. Они забыли. Все они забыли. Но мы... мы заставим их вспомнить."
  SWE_bofors_nobelkrut:0 "Bofors Nobelkrut"
  SWE_bofors_nobelkrut_desc:0 "Bofors - наша гордость и радость, известное имя в артиллерии по всему миру. Дочернее предприятие Nobelkrut демонстрирует большой потенциал для расширения, позволяя производить больше орудий и привлекать больше светлых умов для их проектирования."
  SWE_undk:0 "Организовать FRA"
  SWE_undk_desc:0 "Шведские спецслужбы многочисленны и современны, но представляют собой бюрократический кошмар, будучи разбросанными и подчиненными различным военным подразделениям и учреждениям. Нам бы очень пригодилась единая, централизованная разведывательная служба - FRA."
  SWE_amfss_desc:0 "Kustartilleriets Skjutskola, вопреки своему названию, обучает студентов методам ведения десантных боевых действий - если мы хотим проводить какие-либо морские высадки, поощрение ее роста и патронаж имеют решающее значение."
  SWE_bofors_naval_guns:0 "Морские орудия Bofors"
  SWE_bofors_naval_guns_desc:0 "Артиллерийское мастерство Bofors известно своими зенитными орудиями, но оно также включало орудия шведского флота."
  SWE_musko_bas:0 "Базы в архипелаге"
  SWE_crypto_bomb_focus:0 "Код "Geheimfernschreiber""
  SWE_crypto_bomb_focus_desc:0 "У Арне Берлинга, математика из Упсальского университета, появились интересные идеи о том, как взломать шифр Энигма, который использовали немцы. Если предоставить ему поддержку государства, он может воплотить свои идеи в реальность."
  SWE_stuka_effort:0 "Nydqvist & Holm Flygmotorfabriker"
  #SWE_stuka_effort:0"StuKa Operations"
  SWE_stuka_effort_desc:0 "Учитывая большое количество ограничений, наложенных на люфтваффе Версальским договором, немцы хотят провести в Швеции учения по пикирующему бомбометанию с участием пикирующих бомбардировщиков Stuka, куда мы также можем вступить."
  SWE_synth_oil:0 "Skifferoljeaktiebolaget"
  SWE_army_effort:0 "Arméstaben"
  SWE_army_effort_desc:0 "В настоящее время высшее должностное лицо шведской армии - это глава государства, причём не церемониальный. Передача высшего уровня командования главнокомандующему поможет в модернизации нашей армии."
  SWE_doctrine_effort_2:0 "Современная структура командования"
  SWE_doctrine_effort_2_desc:0 "Наша реструктуризация должностей шведских офицеров начала приносить дивиденды. Постоянно появляются офицеры с интересными тактическими и стратегическими идеями, которые усиливают наши доктрины."
  SWE_doctrine_effort_3:0 "Королевская военная академия Карлберг"
  SWE_doctrine_effort_3_desc:0 "Королевская военная академия Карлберг играет важную роль в модернизации нашей армии, а молодые и перспективные командиры должны получить платформу, чтобы укрепить наши знания в военной теории."
  SWE_equipment_effort:0 "Финансирование Carl Gustafs Gevärsfaktori"
  SWE_equipment_effort_desc:0 "Carl Gustafs Gevärsfaktori уже долгое время разрабатывает оборудование для шведской пехоты, и расширение его производства и увеличение государственной поддержки давно назрели."
  SWE_equipment_effort_2:0 "Учреждение ArSS"
  SWE_equipment_effort_2_desc:0 "Артиллерия — это оружие для образованного человека, требующее особого сочетания тригонометрии и понимания боя. Artilleriets skjutskola — организация, обучающая наших артиллеристов — смогла бы добиться большего с соответствующим техническим оснащением."
  SWE_rocket_effort:0 "Reaktions Motor"
  SWE_rocket_effort_desc:0 "Начало разработки реактивных двигателей, которые смогут приводить в движение как современные самолеты, так и баллистические ракеты."
  SWE_nuclear_effort:0 "Ядерная программа"
  SWE_nuclear_effort_desc:0 "Советы, немцы, британцы… Кто знает, кто будет врагом в будущем? Если мы проведем исследование и создадим ядерное оружие, можно не сомневаться, что никому не придет в голову превращать Стокгольм в колонию."
  SWE_ski_troops:0 "Зимнее оборудование"
  SWE_ski_troops_desc:0 "Редким преимуществом наличия сравнительно небольшой армии является легкость в тестировании и распространении нового оборудования. Испытания в Лапландии показали, что эффективно, а что нет, и мы можем совершенствовать рабочее оборудование, а непригодное — списать."
  SWE_mechanization_effort:0 "Заказ бронированных вездеходов"
  SWE_mechanization_effort_desc:0 "Броневики Pansarterrängbilar могут перевозить пехоту даже в самых ужасных условиях - отлично для сражений на снежных полях и в горах в наших границах."
  SWE_armor_effort:0 "Контракт с Landsverk"
  SWE_armor_effort_desc:0 "У Landsverk есть несколько инженеров, предлагающих конструкции для производства и использования - и если мы заключим с ними контракт на производство, мы сможем выпустить танк, который заставит даже немцев позавидовать."
  SWE_aviation_effort:0 "Модернизация ВВС"
  SWE_aviation_effort_desc:0 "Шведские ВВС малы даже для небольших шведских вооруженных сил и, что еще хуже, состоят из небольшого количества случайных иностранных образцов. Если шведские ВВС должны стать хоть какой-то угрозой, нам нужно устранить их недостатки."
  SWE_fighter_focus:0 "Flygverkstäderna"
  SWE_fighter_focus_desc:0 "Последняя война показала важность превосходства в воздухе. Вражеская авиация может нанести огромный ущерб шведской территории, поэтому в приоритете должно быть обеспечение нас современными истребителями, чтобы держать их на расстоянии."
  SWE_bomber_focus:0 "Двухмоторные самолеты SAAB"
  SWE_bomber_focus_desc:0 "SAAB - это фирма с природным талантом в области работы с современными алюминиевыми самолетами. Мы должны заказать у них больше этих шикарных двухмоторных самолетов."
  SWE_jet_fighter_focustree:0 "Ствол и копье"
  SWE_jet_fighter_focustree_desc:0 "SAAB одарен не только алюминием, но, похоже, и реактивными двигателями. Инженеры предлагают потрясающие проекты, которые могут поразить мир!"
  SWE_CAS_effort:0 "Пикирующие бомбардировщики"
  SWE_CAS_effort_desc:0 "Маленькие и дешёвые бомбардировщики могут помочь нам разобраться с вражескими танками или оборонительными укреплениями при минимальных затратах. Их разработка и производство имеют первостепенное значение!"
  SWE_NAV_effort:0 "Торпедные бомбардировщики"
  SWE_NAV_effort_desc:0 "Торпедные бомбардировщики - грозная сила на Балтийском море, способная потопить капитальный корабль при минимальных затратах. Если мы сосредоточим НИОКР на этой области, мы сможем овладеть морями!"
  SWE_bulltofta:0 "Буллтуфта и Кавахеден"
  SWE_bulltofta_desc:0 "Построить аэродромы Буллтуфта недалеко от Мальмё и Кавахеден в Лапландии. Швеция огромна, и для достижения превосходства в воздухе абсолютно необходимо иметь многочисленные аэродромы."
  SWE_ornen:0 "Пилотная академия FlygS"
  SWE_ornen_desc:0 "Держать самолёт в воздухе, особенно в суровую скандинавскую погоду, действительно довольно сложно. Объединение самых лучших, самых ярких и самых энтузиастичных студентов в одну академию даст нам богатый урожай экспертов."
  SWE_geting:0 "Маневр Гетинген"
  SWE_bulldog:0 "Боевые лётчики"
  SWE_bulldog_desc:0 "Внедрить программу подготовки пилотов Bulldogen для отработки манёвров, что позволит повысить возможности для нескольких классов самолётов."
  SWE_j22_steel_fighter:0 "Истребитель J-22 Steel"
  SWE_j22_steel_fighter_desc:0 "Прикажите Бу Ландгрену создать стальную версию J-22, чтобы восполнить потребность в истребителях, несмотря на нехватку алюминия. Этот истребитель сопоставим с SpitFire 1940-х годов и использует сталь вместо алюминия в качестве сырья."
  SWE_support_the_industry:0 "Северные железные дороги"
  SWE_support_the_industry_desc:0 "На севере Швеции добывается большая часть ценного металла, но инфраструктура затрудняет транспортировку или, не дай Бог, оборону. Новые железные и автомобильные дороги будут иметь большое значение."
  SWE_southern_infrastructure:0 "Южные железные дороги"
  SWE_southern_infrastructure_desc:0 "Это долгое путешествие от Эресунна до Стокгольма. Улучшенная инфраструктура поможет нам переправлять что угодно — материалы, а возможно, и войска — с более высокой скоростью."
  SWE_planned_expansion:0 "Финансирование государственных предприятий"
  SWE_planned_expansion_desc:0 "Свободный рынок — это хорошо, но иногда он не в состоянии обеспечить, и государство должно вмешаться. Субсидирование предприятий повысит производительность и снизит безработицу."
  SWE_scania_rubber:0 "Резиновая фабрика Trelleborg"
  SWE_scania_rubber_desc:0 "Trelleborgs Gummifabrik производит всегда необходимую резину для наших военных, в основном в виде шин. Спонсорство и некоторые государственные инвестиции помогут увеличить их объём производства."
  SWE_mining:0 "Расширение SAKO"
  SWE_mining_desc:0 "Шведская алюминиевая компания стремится расширить свои производственные мощности за счёт строительства завода по переработке в Сундсвалле. Если мы поддержим расширение, наши запасы алюминия будут увеличены."
  SWE_construction_effort_I:0 "Завод шарикоподшипников"
  SWE_construction_effort_I_desc:0 "Шведские шариковые подшипники очень высокого качества и используются в передовом оборудовании по всему миру. Если мы продолжим инвестировать в их производство, это увеличит наш валовой экономический объем."
  SWE_production_effort_I:0 "Организовать механические работы"
  SWE_production_effort_I_desc:0 "Механические цеха - это группа производственных компаний, поставляющих детали и ресурсы таким важным отраслям, как SAAB, Bofors и даже всей нашей армии. Их централизация повысит наши возможности по производству военной техники."
  SWE_substitute_aluminium:0 "Заменитель алюминия"
  SWE_substitute_aluminium_desc:0 "Чтобы справиться с большим спросом и низким предложением алюминия, необходимо реализовать несколько правительственных мер, таких как переработка и переплавка стали в заменитель алюминия."
  SWE_industry_research:0 "Промышленное исследование"
  SWE_industry_research_desc:0 "Наша промышленная экспансия и другие недавние достижения позволяют нам параллельно проводить больше НИОКР."
  SWE_extra_tech_slot_2:0 "Научно-исследовательский институт FOA"
  SWE_extra_tech_slot_2_desc:0 "Шведское государство инвестирует во многие различные области военных исследований напрямую. Некоторые из наших ученых предлагают создать единый институт (FOA), чтобы ускорить этот процесс."
  SWE_secret_weapons:0 "Научно-исследовательский институт FOA"
  SWE_secret_weapons_desc:0 "Очень заманчиво тратить все дополнительные ресурсы на разработку танков и самолетов, но секрет победы в войнах заключается в совершенно новых областях науки: электроника, ракетостроение и ядерные исследования."
  SWE_naval_effort:0 "Верфи Стокгольма"
  SWE_naval_effort_desc:0 "Почти любой стране, которая захочет атаковать Швецию, сначала придется пересечь Балтийское море. Поэтому для защиты нашей страны необходим большой современный флот."
  SWE_flexible_navy:0 "Штаб ВМС"
  SWE_flexible_navy_desc:0 "Переосмысление морской войны с учетом достижений в области подводных технологий позволит нам эффективно наносить удары по вражеским конвоям."
  SWE_large_navy:0 "Оценить доктрину ВМС"
  SWE_large_navy_desc:0 "Исторически наш флот избегал открытых столкновений с вражескими флотами, предпочитая заманивать их на дружественную территорию и разбивать. Это может быть неэффективно в войне 20 века, и нам нужно меняться со временем."
  SWE_baltic_dominance:0 "Контролировать Балтийское море"
  SWE_baltic_dominance_desc:0 "В наших интересах контролировать Балтийское море как можно лучше. По возможности, мы будем стремиться доминировать в этом регионе, чтобы защитить нашу обширную береговую линию."
  SWE_capital_ships:0 "Реконструировать крейсера"
  SWE_capital_ships_desc:0 "Крейсера достаточно дешёвы, чтобы их можно было производить в больших количествах, даже при ограниченных возможностях, и они могут помочь нам контролировать нашу береговую линию. Нам следует инвестировать в более новые и лучшие модели для нашей собственной защиты."
  SWE_destroyer_effort:0 "Заказать современные эсминцы"
  SWE_destroyer_effort_desc:0 "Наши эсминцы - одни из лучших в мире - даже Джон Буль немного им завидует. Однако технологии не стоят на месте, и нам нужно идти в ногу с исследованиями, если мы хотим оставаться на вершине."
  SWE_sea_wolves:0 "Волчья стая"
  SWE_sea_wolves_desc:0 "Подводные лодки являются большим уравнителем, давая даже небольшим флотам возможность причинить массу неприятностей. Если мы сможем заставить работать дешёвые современные подлодки, мы сможем изморить наших врагов голодом!"
  SWE_osterbotten:0 "Шведская консолидация"
  SWE_osterbotten_desc:0 "Шведы - по крайней мере заметное меньшинство везде, где когда-то развевался Сине-золотой флаг. Если мы хотим стать великой империей, мы должны заявить права на эту землю - например, Финляндия была бы неплохим началом."
  SWE_production_effort_II:0 "Развивать авиационную промышленность"
  SWE_production_effort_II_desc:0 "В последние годы наша авиационная промышленность гражданского назначения вывела страну на первые позиции по производству конкурентоспособных самолетов для международного рынка. Учитывая удручающее состояние наших ВВС, возможно, стоит перенаправить авиацию в воздушные силы, чтобы укрепить наше положение."
  SWE_bomb_defence:0 "Подземный бункер"
  SWE_motorized_focus:0 "Стандартизация моторизованной техники"
  SWE_planned_expansion_II:0 "Инвестиции в государственное строительство"
  SWE_planned_expansion_II_desc:0 "Сложно найти шведов, желающих устроиться на работу, не говоря уже о возведении производственных объектов. Финансирование строительных компаний облегчит эту задачу и поспособствует нашему собственному промышленному строительству."
  SWE_planned_expansion_III:0 "Промышленное расширение"
  SWE_lottorna:0 "Лотторна"
  SWE_lottorna_desc:0 "Невозможно отрицать, что нам нужно больше солдат. В то же время у нас есть квалифицированные боеспособные мужчины, которые заняты такими работами, как приготовление пищи и управление радиостанциями. В этих подразделениях уже есть женщины. Если мы сделаем их чисто женскими (и заставим этих лентяев заняться боевой подготовкой), то это увеличит нашу численность."
  SWE_neutrality_focus:0 "Скандинавская изоляция"
  SWE_neutrality_focus_desc:0 "Мы не должны поддаваться экспансионизму и экстремизму. Швеция всегда занимала позицию скандинавской демократии, мира и нейтралитета, и так оно и останется."
  SWE_fortify_skargard:0 "Береговая артиллерия"
  SWE_fortify_skargard_desc:0"Поскольку почти все наши населенные пункты находятся на побережье, угроза морского вторжения вызывает опасения. Организованное строительство прибрежных укреплений обеспечит безопасность шведского народа."
  SWE_fortify_scania:0"Сканская линия"
  SWE_fortify_scania_desc:0"Несмотря на то, что оппозиция в парламенте наверняка будет критиковать усилия по укреплению Сконе, в случае войны оно, скорее всего, станет одной из целей. На всякий случай нам необходимо укрепить оборону региона."
  SWE_airfields_gotland:0"Готский аэродром"
  SWE_airfields_gotland_desc:0"Построить серию аэродромов и зенитных орудий на Готланде"
  SWE_tornea_line:0"Каликсская линия"
  SWE_tornea_line_desc:0"А если Советы перейдут через Финляндию и решат, что мы следующие? Было бы глупо не построить укрепления на нашей северо-восточной границе."

  SWE_liberty_ethos:0"Экономика, ориентированная на экспорт"
  SWE_liberty_ethos_desc:0"Грандиозная всемирная PR-кампания — простой и эффективный способ обеспечить, что даже когда великие державы воюют друг с другом, у них по крайней мере будет то, что их объединяет — шведские товары."
  SWE_intervention:0"Иностранное вмешательство"
  SWE_intervention_desc:0"Взгляните наружу и укрепите свое влияние в Скандинавии."
  SWE_alliance_finland:0"Абоская конференция"
  SWE_alliance_finland_desc:0"Несомненно, Финляндия — гораздо более обороноспособный регион, чем Швеция. И хотя наш народ может воротить нос от наших «братьев» на востоке, альянс может спасти наши народы от русского медведя.
  SWE_finalnd_arms_production:0 "Финское оружейное сотрудничество"
  SWE_finalnd_arms_production_desc:0 "Сотрудничество с Финляндией в области производства стрелкового оружия для повышения эффективности."
  SWE_baltic_refugees:0 "Скандинавские эвакуированные"
  SWE_baltic_refugees_desc:0 "Во время Второй мировой войны многие балтийские беженцы бежали в Швецию, а несколько шведских меньшинств, в том числе эстонские шведы, были эвакуированы торговыми судами и эсминцами."
  SWE_demand_aland:0 "Требование Аландов"
  SWE_demand_aland_desc:0 "Финны находятся между молотом и наковальней. Аландский архипелаг со шведским большинством принадлежит Финляндии, и они наверняка не смогут одновременно сражаться с нами и русскими из-за маленького архипелага..."
  SWE_befriend_denmark:0 "Копенгагенский договор"
  SWE_befriend_denmark_desc:0 "Скандинавия должна быть единой, иначе она будет уничтожена враждебными силами. В одиночку мы не надеемся сражаться с великими державами, но, возможно, вместе мы сможем продержаться."
  SWE_danish_factory_alliance:0 "Датское промышленное сотрудничество"
  SWE_danish_factory_alliance_desc:0 "Сотрудничество с датчанами для оптимизации производства на фабриках."
  SWE_befriend_norway:0 "Ослоская поправка"
  SWE_befriend_norway_desc:0 "Предложить Норвегии вступить в альянс."
  SWE_small_ships:0 "Норвежское сотрудничество в области судостроения"
  SWE_small_ships_desc:0 "Учредить норвежскую сборку кораблей для повышения эффективности производства подводных лодок и эсминцев."
  SWE_norway_war_goal:0 "Аннексия Норвегии"
  SWE_norway_war_goal_desc:0 "Норвегия получила независимость от Швеции в 1905 году и с тех пор является суверенной страной. Политическая риторика ужесточилась, и значительные разногласия могут заставить нас вмешаться и взять под контроль их независимость."
  SWE_germany_friend:0 "Сотрудничество с Германией"
  SWE_germany_friend_desc:0 "Мощь Германии в Европе растёт с каждым днём. Сотрудничая, мы можем улучшить отношения с немцами."
  SWE_soviet_war_goal:0 "Эзельский кризис"
  SWE_estonia_war_goal:0 "Эзельский кризис"
  SWE_estonia_war_goal_desc:0 "Эзель и Даго являются этнически, лингвистически и культурно шведскими. Логика подсказывает, что этот регион по праву наш. А если оккупанты не сдадутся, то мы отвоюем острова, а Эстонию накажем заодно!"
  SWE_fortify_new_frontier:0 "Укрепить новую границу"
  SWE_fortify_new_frontier_desc:0 "Массированная высадка наших войск и молниеносный захват государства [EST.getAdjective] потрясли государства Балтии и привели к эскалации враждебных отношений с [SOV.getNameDef]. Если мы хотим установить мир и порядок на недавно завоёванных территориях, то должны подготовиться к худшему и направить хорошо вооружённые пограничные патрули для охраны нашей восточной границы."
  SWE_reclaim_ingermanland:0 "Вернуть Ингерманландию"
  SWE_reclaim_ingermanland_desc:0 "Наша великая страна потеряла свой престиж на европейской арене после Ништадтского мира, когда мы были вынуждены уступить свой законный протекторат Ингерманландию русским в 1721 году. Теперь мы должны открыть новый фронт в Эстонии и вернуть то, что принадлежит нам! За Великую Швецию! "
  SWE_militarism:0 "Милитарист"
  SWE_german_tank_production:0 "Сотрудничество с Германией по танкам"
  SWE_german_tank_production_desc:0 "Немцы готовы оказать нам помощь в нашем военном деле для оптимизации производства легких танков."
  SWE_soviet_friend: "Подружиться с Советским Союзом"
  SWE_influence_finland_communism:0 "Принудить Финляндию"
  SWE_influence_norway_communism:0 "Принудить Норвегию"
  SWE_norwegian_ultimatum:0 "Норвежский ультиматум"
  SWE_go_with_britain:0 "Присоединиться к союзникам"
  SWE_planned_expansion_comm:0 "Расширение"
  SWE_foreign_expeditions:0 "Добровольческий корпус"
  SWE_foreign_expeditions_desc:0 "Наше военное командование предлагает сформировать добровольческие батальоны для участия в праведных войнах за рубежом. Возможно, благодаря им мы сможем и вправду привнести стабильность..."
  SWE_war_bonds:0 "Переработка"
  SWE_war_bonds_desc:0 "Швеция нуждается в ресурсах как никогда, чтобы строить оборонительные укрепления и поддерживать экспорт. Наш народ страдает от нехватки материалов, но если мы будем выпускать дешёвые товары-заменители и поощрять переработку, то сможем повысить производительность и облегчить бремя."
  SWE_ltank_tooltip:0 "Теперь может развернуть лёгкие танки и моторизованные соединения."
  SWE_forsvenskning_tt:0"Можно получить событие \"Объединение с финнами-шведами\""
  SWE_forsvarsbeslutet:0"Решения в области обороны"
  SWE_forsvarsbeslutet_desc:0"Опубликовать Оценку национальной обороны, которая оценивает наши потребности в обороне на следующие 10 лет. На этот раз нам нужны дополнительные средства для Департамента обороны и оружейной промышленности для достижения наших целей внутреннего производства."
  SWE_fst:0"Главнокомандующий"
  SWE_ransonering:0"Нормирование"
  SWE_ransonering_desc:0"Есть некоторые товары, которые просто слишком важны, чтобы их можно было использовать впустую. Патриотический взгляд на концепцию нормирования удовлетворит общественность меньшим."
  SWE_air_defence:0"ПВО"
  SWE_air_defence_desc:0"Было бы обидно, если бы наш народ уничтожили сверху, и тем более, если бы это можно было предотвратить. Строительство современных систем ПВО позволит сохранить шведское воздушное пространство под шведским контролем."
  SWE_anschluss_finland:0"Рабочее движение"
  SWE_hemvarnet_ef_focus:0"Домашняя гвардия"
  SWE_hemvarnet_ef_focus_desc:0"Домашняя гвардия действует как основное ополчение, поддерживая порядок на улицах и выполняя другие основные задачи. Однако после некоторой подготовки мы могли бы легко использовать их в качестве гарнизонных войск в нашей регулярной армии."
  SWE_naval_dockyard_effort:0"Расширение верфей"
  SWE_naval_dockyard_effort_desc:0"Расширить верфи и усилить сотрудничество с Норвегией."
  SWE_radar:0"РАДАР"
  SWE_radar_desc:0"Сосредоточьте свои усилия на разработке лучших систем РАДАР для обнаружения вражеской активности."
  SWE_kalix_line:0"Линия Каликс"
  SWE_kalix_line_desc:0 "Единственное, что волнует народ: придут ли за нами русские и когда это произойдёт. Мы должны построить укрепления на границе с Финляндией, чтобы такого никогда не случилось."
  SWE_continuation_war:0 "Война-продолжение"
  SWE_continuation_war_desc:0 "Присоединяйтесь к войне-продолжению, чтобы раз и навсегда отпугнуть Советов от наших скандинавских земель."
  SWE_liberate_norway:0 "Война с Германией"
  SWE_liberate_norway_desc:0 "Освободите Норвегию от немцев и поддержите миссию союзников."
  SWE_political_effort:0 "Тишина шведов"
  SWE_political_effort_desc:0 "Шведский национальный дух призван объединить людей и усилить военные действия."
  SWE_claim_aland:0 "Отменить Аландскую конвенцию"
  SWE_claim_aland_desc:0 "Аландская конвенция унизила Швецию, заставив отказаться от законного и обоснованного права на одноимённый архипелаг во имя ''мира''. Это несправедливое решение не может стоять! Швеция расторгнет договор и вновь заявит о своих правах!"
  SWE_fortify_aland:0 "Укрепить Аландские острова"
  SWE_fortify_aland_desc:0 "Укрепите Аландские острова, поскольку они занимают важное стратегическое положение для защиты Стокгольма и залива."
  SWE_min_def:0 "Министерство обороны"
  SWE_american_help:0 "Американское оборудование"
  SWE_kalmar_union:0 "Скандинавизм"
  SWE_kalmar_union_desc:0 "Граждане большинства стран являются патриотами своей родины. Однако граждане Швеции патриотичны не только по отношению к Швеции, но и к Скандинавии в целом! С двумя направлениями для борьбы и смерти наши ряды пополнятся!"
  SWE_black_chamber:0 "Восстание Белой гвардии"
  SWE_black_chamber_desc:0 "Пояснение: Швеция спровоцирует гражданскую войну в Финляндии, а затем Финляндия попросит ее присоединиться. Через несколько дней Аланд восстанет и объединится со Швецией, если вы скажете да. Вы будете сражаться с коммунистической Финляндией, если скажете да."
  SWE_embargo_germany:0 "Эмбарго Германии"
  SWE_polstjarna:0 "Операция Полярная звезда"
  SWE_abandon_neutrality:0 "Отказ от нейтралитета"
  SWE_abandon_neutrality_desc:0 "Откажитесь от текущей политики нейтралитета, установленной нашим правительством, чтобы проводить более интервенционистскую политику и занять позицию на своей стороне в будущих конфликтах."
  SWE_saltsjobad:0 "Соглашение Сальтшебадена"
  SWE_saltsjobad_desc:0 "Настоящим мы соглашаемся не вмешиваться в переговоры между наемными работниками и работодателями. Это повысит доверие наших магнатов к нам и приведет к дальнейшему развитию."
  SWE_oresund:0 "Спор вокруг Эресунна"
  SWE_denmark_war_goal:0 "Завоевать Danskjävlar"
  SWE_denmark_war_goal_desc:0 "Датчане слишком долго были нам досадны."
  SWE_alliance_with_the_united_baltic_state:0 "Союз с Объединенным балтийским государством"
  SWE_alliance_with_the_united_baltic_state_desc:0 "Многие историки утверждают, что балтийские государства могут считаться неотъемлемой частью Великой шведской империи. Однако, к счастью, эти люди не диктуют политику государства. Единое Балтийское государство может оказаться достойным союзником в предотвращении распространения коммунистической болезни."
  SWE_assist_our_allies_rearmament:0 "Поддержка перевооружения наших союзников"
  SWE_assist_our_allies_rearmament_desc:0 "Будучи доминирующей промышленной и военной державой Севера, мы никогда не должны забывать, что оборона нашего периметра зависит от наших союзников. Их верность нашему делу будет несомненна, если мы выделим средства на помощь их перевооружению."
  SWE_a_new_deluge:0 "Новый потоп"
  SWE_a_new_deluge_desc:0 "[POL.GetNameDefcap] слишком долго соперничал с нашим господством над Балтийским морем."
  SWE_unite_scandinavia:0 "Объединение Скандинавии"
  SWE_unite_scandinavia_desc:0 "Объединение Скандинавии наконец-то на пороге. Три брата будут объединены в непобедимый союз!"
  SWE_celtic_alliance:0 "Кельтский союз"
  SWE_celtic_alliance_desc:0 "Превратности геополитики сделали кельтский мир потенциальным союзником в господстве над Северным морем. Такая дипломатическая поддержка может открыть новые возможности."
  SWE_march_alongside_the_british_blackshirts:0 "Марш вместе с британскими чернорубашечниками"
  SWE_march_alongside_the_british_blackshirts_desc:0 "Бок о бок с Британией. Швеция стоит и марширует!"
  SWE_ally_with_the_low_countries:0 "Союз с Нидерландами"
  SWE_ally_with_the_low_countries_desc:0 "Идеологическое переориентирование Нидерландов и их стратегическое положение делают дипломатическое сотрудничество потенциально плодотворным."
  SWE_british_research_sharing:0 "Обмен научными исследованиями"
  SWE_british_research_sharing_desc:0 "Нам есть что предложить Великобритании."
  SWE_legacy_of_great_northern_war:0 "Наследие Великой Северной войны"
  SWE_legacy_of_great_northern_war_desc:0 "Нам удалось собрать большинство наших старых союзников времён Великой Северной войны, когда вероломный и мерзкий тройственный союз России, Польши и Германии решил сбросить нас в море. Пришло время вернуть утраченные территории и установить новый порядок в Северной Европе. Отныне и навеки!"
  SWE_establish_new_protectorates:0 "Установление новых протекторатов"
  SWE_establish_new_protectorates_desc:0 "Во избежание любого всплеска [GER.getAdjective] национализма и реваншизма после их унизительного поражения от наших сил их некогда единое государство будет реорганизовано в новую систему про-шведских протекторатов."

  SWE_polistrupper:0 "Получить 2 дивизии полицейских войск в южной Швеции"
  SWE_balttrupper:0 "1 дивизия бежит в Швецию"

###########Events
sweden.1.t:0 "Швеция требует Аландские острова"
  sweden.1.d:0 "Вчера шведское правительство, которое уже восстановило свои права на Аландские острова, сделало следующий логичный шаг - потребовало их полностью. Представители Стокгольма утверждают, что на островах и так преобладает шведское население, но наше присутствие в Балтийском море будет значительно уменьшено. Тем не менее, подразумевается, что альтернатива - война, и сможем ли мы пережить вторжение?"
  sweden.1.a:0 "Принять требования."
  sweden.1.b:0 "Аландские острова по праву наши!"
  sweden.2.t:0 "Финляндия принимает требования!"
  sweden.2.d:0 "Сегодня впервые с 1809 года на Аландских островах вместо финских знамен поднялись шведские флаги. Хотя население в основном отнеслось к этому равнодушно, само шведское правительство, одержавшее дипломатическую победу и получившее важнейшую военно-морскую базу в Ботническом заливе, было в восторге. Напротив, в Финляндии царила мрачная атмосфера, и особенно примечательно, что, несмотря на передачу островов, Финляндия все еще претендует на них."
  sweden.2.a:0 "Наконец-то!"
  sweden.3.t:0 "Финны отказываются!"
  sweden.3.d:0 "Финны приняли сомнительное решение, что небольшая цепь островов стоит того, чтобы рисковать жизнями своего народа. Возможно, у них есть желание снова стать частью нашей нации - какова бы ни была их логика, война, кажется, неизбежна."
  sweden.3.a:0 "Возмутительно!"
  sweden.6.t:0 "Приглашение в шведскую фракцию"
  sweden.6.d:0 "В течение последних нескольких недель Швеция публично поддерживает идею скандинавского альянса на дипломатической арене, и их посол в нашей стране только что сообщил нам, что они намерены воплотить эту концепцию в реальность. Хотя немногие приветствуют идею втягивания в отдаленную войну, альянс, по крайней мере на поверхностном уровне, кажется чисто оборонительным. Каким должен быть наш ответ?"
  sweden.6.a:0 "Принять союз"
  sweden.6.b:0 "Отклонить запрос"

  sweden.7.t:0 "Финляндия присоединяется к союзу"
  sweden.7.d:0 "Учитывая её глобальное положение, Финляндия неудивительно присоединилась к нашему союзу. Надеемся, что это отпугнёт русских от попыток реконкисты..."
  sweden.7.a:0 "Как приятно"

  sweden.8.t:0 "Финляндия отказывается"
  sweden.8.d:0 "Финны решили, что либо у них есть обязательства перед другим альянсом, либо они просто ненавидят нас настолько, что не хотят даже рассматривать идею о взаимной защите. Какова бы ни была причина, они отклонили наше предложение."
  sweden.8.a:0 "Досадно"

  sweden.9.t:0 "Приглашение в шведскую фракцию"
  sweden.9.d:0 "В течение последних нескольких недель Швеция публично поддерживает идею скандинавского альянса на дипломатической арене, и их посол в нашей стране только что сообщил нам, что они намерены воплотить эту концепцию в реальность. Хотя немногие приветствуют идею втягивания в отдаленную войну, альянс, по крайней мере на поверхностном уровне, кажется чисто оборонительным. Каким должен быть наш ответ?"
  sweden.9.a:0 "Принять союз"
  sweden.9.b:0 "Отклонить запрос"
  sweden.10.t:0 "Дания присоединяется к Альянсу"
  sweden.10.d:0 "Давно наш извечный враг, датчане теперь в полной мере сотрудничают с нами. Это гарантирует, что Балтийское море будет в безопасности."
  sweden.10.a:0 "Как же это приятно"

  sweden.11.t:0 "Дания отказывается"
  sweden.11.d:0 "У датчан более длинные воспоминания, чем мы думали. Кажется, наше давнее соперничество стало слишком серьезным для них, чтобы рассматривать наше предложение о союзе."
  sweden.11.a:0 "Обидно"

  sweden.12.t:0 "Приглашение в Шведскую фракцию"
  sweden.12.d:0 "Швеция публично поддерживала идею Скандинавского альянса на дипломатической арене в течение последних нескольких недель, и их посол в нашей стране только что сообщил нам, что они намерены превратить эту концепцию в реальность. Хотя немногие приветствуют идею быть втянутыми в далекую войну, этот альянс, по крайней мере, на первый взгляд, кажется исключительно оборонительным. Каким будет наш ответ?"
  sweden.12.a:0 "Принять альянс"
  sweden.12.b:0 "Отказать в запросе"

  sweden.13.t:0 "Норвегия присоединяется к Альянсу"
  sweden.13.d:0 "Единство между Норвегией и Швецией вновь установлено, хотя на этот раз на гораздо более равноправных основаниях. Норвегия с нами, и наши вооруженные силы получат взаимную помощь в защите наших береговых линий."
  sweden.13.a:0 "Как же это приятно"

  sweden.14.t:0 "Норвегия отказывается"
  sweden.14.d:0 "Норвежцы были обеспокоены нашим предложением союза с самого начала и, кажется, считают, что этот союз - первый шаг на пути к возвращению в состав Шведского королевства. Как это параноидально - это была всего лишь ОДНА возможность..."
  sweden.14.a:0 "Неудачно"
  sweden.19.t:0 "Парламентские препирательства"
  sweden.19.d:0 "Вопрос Аланда имел гораздо более далеко идущие последствия, чем мы себе представляли. Элементы фашистов и коммунистов единогласно приписывают себе эту идею, утверждая, что она поддерживает их дело, а члены парламента, ранее находившиеся на периферии партийных линий, покидают социал-демократическую рабочую партию и другие демократические партии, чтобы поддержать их стороны. Если социал-демократическая рабочая партия не предпримет решительных действий сейчас, политический ландшафт может измениться навсегда."
  sweden.19.a:0 "Удовлетворить правых"
  sweden.19.b:0 "Удовлетворить левых"
  sweden.19.c:0 "Покажите силу!"
  sweden.20.t:0 "Норвегия отклоняет наши требования!"
  sweden.20.d:0 "Норвежцы отказались стать нашей марионеткой. На самом деле не худший из возможных исходов - это означает, что теперь мы просто собираемся вторгнуться в них и просто завоевать их. Их упрямый характер ни к чему не приведет, когда запылают шведские винтовки."
  sweden.20.a:0 "Во имя безопасности Северных стран."
  norway.21.t:0 "Союзы выступают за коллективное представительство"
  norway.21.d:0 "Социалистические элементы в нашей стране получают поддержку от международных коммунистических организаций и начинают предъявлять требования правительству. Профсоюзы, которые с каждым днем все больше поддерживают коммунизм, выступают за них, а это значит, что если мы не пойдем на уступки, то можем увидеть еще больше этих ужасных забастовок, которые мы так долго терпели. Требования простые: либо сделать парламентские уступки, либо назначить в наш кабинет Генри Вильгельма Кристиансена, одного из их главных людей. Стоит ли оно того?"
  norway.21.a:0 "Пойти на парламентские уступки"
  norway.21.b:0 "Принять Генри Вильгельма Кристиансена"
  norway.21.c:0 "Пусть бастуют!"
  norway.20.t:0 "Судьба Норвегии"
  norway.20.d:0 "Министр иностранных дел Швеции недавно сделал публичное заявление: норвежское правительство не выполняет свой естественный долг по защите своих интересов и поддержанию порядка в пределах своих границ. Они говорят, что единственный способ предотвратить иностранное вторжение — это взять под свой контроль армию и правительство. Они выставили нам такой же ультиматум и дали 24 часа на ответ. Можем ли мы дать им отпор или нам снова придется отказаться от своей независимости?"
  norway.20.a:0 "Стать марионеткой Швеции"
  norway.20.b:0 "Выбрось конверт в мусор!"
  sweden.22.t:0 "Финны отказались от нашего союза"
  sweden.22.d:0 "Финны решили продолжать издевательство над своими рабочими и плюют в лицо Человеческой порядочности, отклонив наше предложение о Союзе. Похоже, такие незначительные проблемы, как независимость и суверенитет, повредили им рассудок."
  sweden.22.a:0 "Очень печально"
  sweden.25.t:0 "Мальмское коммюнике"
  sweden.50.t:0 "Балтийский мятеж"
  sweden.51.t:0 "Советские корабли захвачены!"
  sweden.51.d:0 "Эстонские бойцы сопротивления в Таллине осуществили дерзкую операцию, захватив у Советов в ходе скрытого манёвра один лёгкий крейсер, два эсминца и одну подводную лодку. Партизаны угнали корабли во время их дозаправки по пути в Ленинград, а теперь пригнали их на Готланд и передали нам. Прекрасные новости!"
  sweden.51.a:0 "Впечатляет!"
  sweden.55.t:0 "Швеция просит вступить в союзники"
  sweden.55.d:0 "Шведы обратились к нам с просьбой присоединиться к Союзникам, полагая, что борьба за свободу во всём мире важнее, чем уклонение от собственного конфликта. Их флот может оказаться полезным, и они производят впечатляющее оружие, но их армия довольно мала. Принятие их просьбы будет обязательством по защите Скандинавии, в противном случае они могут просто присоединиться к нам и попасть под оккупацию."
  sweden.55.a:0 "Мы рады!"
  sweden.55.b:0 "Наверняка, это шпионы Джерри!"
  sweden.56.t:0 "Британия отказалась"
  sweden.56.d:0 "Британцы решили, что они могут выиграть войну без нас. Обычный избыток самоуверенности. Причина не была указана, поэтому мы можем только догадываться о причине нашего исключения.\n\n Но, вероятно, они просто завидуют нашим сверхбыстрым эсминцам."
  sweden.56.a:0 "Очень жаль!"
  sweden.57.t:0 "Великобритания принимает"
  sweden.57.d:0 "Соединенное Королевство приняло наше предложение! Швеция теперь сражается за свободу вместе с союзниками!"
  sweden.57.a:0 "Весьма удовлетворительно"
  sweden.60.t:0 "Швеция предлагает Социалистический Союз"
  sweden.60.d:0 "Коммунисты-интернационалисты в нашем парламенте представили предложение о восстановлении Союза со Швецией якобы во славу коммунистического пути - хотя даже наши базовые разведданные показывают, что шведы их поддерживают. Вряд ли мы сможем противостоять им в одиночку, учитывая почти гарантированную поддержку со стороны русских... Сразимся ли мы за последний шанс на свободу?"
  sweden.60.a:0 "У нас нет выбора."
  sweden.60.b:0 "Норвегия навсегда!"
  sweden.61.t:0 "Норвежцы отказываются"
  sweden.61.d:0 "Норвежцы отклонили наше объединение. Мы должны были бы гораздо яснее дать понять, что у них изначально не было выбора."
  sweden.61.a:0 "Мы требовали, а не просили!"
  sweden.65.t:0 "Соглашение со Швецией"
  sweden.65.d:0 "Шведы просят нашу поддержку их зарождающемуся коммунистическому правительству - они пытаются создать союз в Норвегии. Плюс в том, что они обещают поддержать наши притязания на Карелию. Нам не НУЖНА поддержка Швеции, но хотя бы толика международного признания была бы приятна."
  sweden.65.a:0 "Принять предложение"
  sweden.65.b:0 "Отказаться от предложения"
  sweden.66.t:0 "Советы отказывают в нашем предложении!"
  sweden.66.d:0 "Советы отказались от нашего предложения. Это трагический удар по коммунистическим интересам в Скандинавии."
  sweden.66.a:0 "Фальшивые коммунисты!"
  sweden.67.t:0 "Советы принимают наше предложение!"
  sweden.67.d:0 "Мудрые лидеры СССР приняли наше предложение и с гордостью встанут на нашу сторону в борьбе с капитализмом."
  sweden.67.a:0 "Прекрасная новость!"
  sweden.70.t:0 "Король призывает правительство"
  sweden.70.d:0 "Густав V созывает совещание с несколькими крупными политическими деятелями Швеции, в первую очередь из НСАП. В последнее время он был обеспокоен авторитарными взглядами НСАП, и хотя он выступает против коммунизма, не считает его такой же серьезной угрозой, как НСАП. Если бы короля можно было убедить в угрозе большевиков, это было бы очень полезно для популярности НСАП среди народа..."
  sweden.70.a:0 "Покажите ему зло коммунизма."
  sweden.70.b:0 "Его мнение не имеет значения."
  sweden.72.t:0 "Роялистские газеты"
  sweden.72.d:0 "Похоже, король Густав не воспринял ссылку с юмором, как мы надеялись. Он объединился с группой диссидентов, чтобы распространять клевету на наше правительство! Этот старый дурак просто завидует, что сам больше не обладает властью."
  sweden.72.a:0 "Конфисковать и сжечь эти публикации!"
  sweden.72.b:0 "Это не стоит усилий."
  sweden.75.t:0 "Объединиться с шведскоязычными финнами"
  sweden.75.d:0 "Некоторые из наших недавно приобретенных земель в Финляндии населены преимущественно шведами и с удобством могли бы управляться Швецией, а не оставаться частью Финляндии. Конечно, это означает, что если мы захотим ее создать, финская марионеточная держава станет слабее..."
  sweden.75.a:0 "Шведы под властью Швеции"
  sweden.75.b:0 "Это того не стоит."
  sweden.90.t:0 "Королевский кабинет"
  sweden.90.d:0 "Король нарушил давнюю политику Пера Альбина Ханссона по избеганию любых иностранных союзов, заключив пакт с Финляндией, что создало разногласия между двумя бывшими дружественными правителями. Король имеет полное законное право отстранить и заменить его, хотя это, несомненно, не понравится республиканским элементам в нашей стране. Следует ли Густаву V осуществить этот план?"
  sweden.90.a:0 "Позволить королю сформировать свой Совет"
  sweden.90.b:0 "Только если он победит на выборах."
  sweden.100.t:0 "Стокгольмское коммюнике"
  sweden.100.d:0 "Шведский король Густав V пригласил лидеров Норвегии и Дании на конференцию, чтобы обсудить наши отношения, будущее Европы и то, где будут находиться наши страны в случае войны. Посещение сблизит нас всех, но действительно ли нам этого хочется?"
  sweden.100.a:0 "Посетить конференцию"
  sweden.100.b:0 "Нет, это не в наших интересах"

  sweden.105.t:0 "Операция Stella Polaris"
  sweden.105.d:0 "На данный момент Советы доминируют над нашей бедной нацией, что подвергает нас чрезмерному риску потери важной информации, и мы рискуем довольно многим, если позволим этим важным документам попасть в лапы Папы Джо. Наши агенты предлагают перенести операции в Швецию, более безопасную базу, которая намного дальше от конфликта, хотя при этом мы потеряем некоторую эффективность."
  sweden.105.a:0 "Отправить их в Швецию"
  sweden.105.b:0 "Они нужны здесь!"

  sweden.106.t:0 "Операция Stella Polaris"
  sweden.106.d:0 "Сегодня с нашим главой правительства в финском министерстве после наступления темноты встретился неизвестный человек в черном плаще, и он глубоким искусственным голосом объяснил, что неудачная война Финляндии с Советами ставит под угрозу важную информацию. Он предложил спрятать информацию здесь в Швеции вместо - за плату в виде права самим ознакомиться с частью информации, в дополнение к улучшенным отношениям. Однако русские никогда не одобрят такое."
  sweden.106.a:0 "Провести операцию"
  sweden.106.b:0 "Нет, это слишком рискованно"
  denmark.1.t:0 "Dominium Maris Baltici"
  finland.40.t:0 "Попросить помощи у Швеции?"
  finland.40.d:0 "Поскольку наша страна вступила в гражданскую войну против силы, очевидно поддерживаемой Советским Союзом, мы вынуждены сами искать союзников. Швеция — очевидный спонсор. Если мы сможем заручиться их помощью, это будет большим благом для нашей стороны. Конечно, статус Аландских островов все еще вызывает вопросы, и хотя это и прискорбно, это сочли справедливой компенсацией..."
  finland.40.a:0 "Попросить Швецию присоединиться"
  finland.40.b:0 "Нет, это наша война!"
  finland.41.t:0 "Финляндия просит помощи"
  finland.41.d:0 "Белая гвардия Финляндии просит нас о помощи против коммунистов, пытающихся взять под контроль их страну. Они также пообещали нам Аландские острова в качестве компенсации за нашу помощь — довольно выгодная сделка! Однако стоит ли тратить шведские жизни на чужую войну?"
  finland.41.a:0 "Присоединиться к гражданской войне"
  finland.41.b:0 "Мы не можем присоединиться"
  sweden.43.t:0 "Аландское восстание!"
  sweden.43.d:0 "Патриотически настроенные жители Аландских островов вступили в борьбу против коммунистической угрозы и теперь с энтузиазмом маршируют к линии фронта... в составе шведской армии. Тем не менее, это хорошая альтернатива красному господству."
  sweden.43.a:0 "Повезло!"
  finland.45.t:0 "Швеция отказывается присоединиться"
  finland.45.d:0 "У шведов нет особого желания присоединяться к нашей войне, это очень прискорбно!"
  finland.45.a:0 "Предательство!"
  import.10.t:0 "Швеция просит о помощи"
  import.10.d:0 "Шведы в настоящее время ведут борьбу за свободную Скандинавию и соотношение сил не в их пользу. Этот регион имеет стратегическое значение для Европейского театра военных действий, и мы не можем позволить тоталитарным режимам получить контроль над ним. Шведы просят нас отправить 2000 единиц пехотного снаряжения, 500 единиц вспомогательного снаряжения и 200 артиллерийских орудий вместе с 8000 добровольцами из США. Принять ли их запрос?"
  import.10.a:0 "Да, отправьте!"
  import.10.b:0 "Нет, мы ничего не можем отправить."
  
  import.11.t:0 "США направляет помощь"
  import.11.d:0 "Наши просьбы были услышаны, и США отправляют нам снаряжение и добровольцев, которые будут сражаться за нас. Это очень удачный поворот событий, мы должны использовать их как можно лучше. Ожидается, что груз прибудет примерно через 20 дней."
  import.11.a:0 "Это может спасти нас!"
  
  import.12.t:0 "Прибытие оборудования из США"
  import.12.d:0 "Давно ожидаемые добровольцы и оборудование наконец прибыли в Швецию. Теперь мы должны эффективно использовать их!"
  import.12.a:0 "Наконец-то!"
  
  import.13.t:0 "США отказывается"
  import.13.d:0 "США не может или не будет отправлять нам никакого оборудования или добровольцев. Это катастрофа! Нам это было очень нужно."
  import.13.a:0 "Катастрофа"
  
  exileunits.2.t:0 "Полицейские подразделения набраны и обучены"
  exileunits.2.d:0 "Полицейские подразделения из Дании и Норвегии обучены и готовы к бою. Готовясь к возвращению на родину, они будут сражаться вместе с нашими войсками."
  exileunits.2.a:0 "Прекрасное пополнение"
  iceland.1.t:0 "Мятеж в Исландии"
  iceland.1.d:0 "Произошёл фашистский мятеж! После недолгих расследований стало очевидно, что мятежников снабжают со стороны. Страна объята беспорядками, и нам нужно определить свою позицию. Усмирить мятежников или нет? Подавление может спровоцировать поставщика на собственные действия. Наиболее вероятными поставщиками на данный момент являются Германия или Швеция."
  iceland.1.a:0 "Подавить восстание!"
  iceland.1.b:0 "У нас нет выбора, кроме как сдаться."

  iceland.11.t:0 "Исландия подавила восстание!"
  iceland.11.d:0 "Похоже, наше запланированное восстание в Исландии прошло не так, как мы ожидали. Правительство смогло подавить его своими ограниченными ресурсами. Вопрос в том, что нам делать дальше? Мы могли бы начать полномасштабное военное вторжение, но тогда нам пришлось бы иметь дело с Данией и, скорее всего, с Гренландией."
  iceland.11.a:0 "Будет вторжение!"
  iceland.11.b:0 "Мы отступим."

  iceland.2.t:0 "Исландия провозглашает независимость!"
  iceland.2.d:0 "В ходе неожиданных событий небольшое датское военное присутствие в Исландии было отброшено небольшой, но хорошо вооружённой группой националистов. Господству Дании угрожает опасность, мы должны восстановить порядок! Только если у нас не хватает рабочей силы или есть какие-то моральные возражения..."
  iceland.2.a:0 "Предоставить суверенитет"
  iceland.2.b:0 "Объявить войну и отбить Исландию!"

  iceland.3.t:0 "Дания объявляет нам войну"
  iceland.3.d:0 "Датское правительство объявило попытку обрести независимость незаконной и посылает свои войска, чтобы вторгнуться на наши земли и попытаться остановить забаву. Швеция пообещала нам поддержку, но было бы гораздо более впечатляюще, хотя и сложнее, победить своими силами..."
  iceland.3.a:0 "Сражаться своими силами!"
  iceland.3.b:0 "Просить помощи у шведов"

  iceland.4.t:0 "Исландия просит о помощи"
  iceland.4.d:0 "Как мы и предсказывали, Исландия попросила у нас поддержки в борьбе против датчан – прямо-таки идеальный шанс сокрушить Данию, если честно! Мы могли бы и оставить датчан тратить свое время на вторжение в Исландию, но маловероятно, что скоро у нас появится еще один такой шанс..."
  iceland.4.a:0 "Они предоставлены сами себе"
  iceland.4.b:0 "Сражаться за Исландию!"

  iceland.5.t:0 "Шведы вмешиваются"
  iceland.5.d:0 "Шведы решили сражаться на нашей стороне и надеются победить датчан за нас. Наши усилия оказались не напрасными, они стоили того."
  iceland.5.a:0 "Слава и независимость близко!"

  iceland.7.t:0 "Дания отступает"
  iceland.7.d:0 "Дания признала независимость Исландии, заявив просто, что если именно этого желают исландцы, датчане не станут им препятствовать. Почти все в Европе размышляют над истинной причиной, но какой бы она ни была, Исландия обрела независимость даже без единой жертвы."
  iceland.7.a:0 "Неожиданно"

  iceland.10.t:0 "Вооружение фьёльнисменов"
  iceland.10.d:0 "Мы успешно доставили оружие и офицеров исландским националистам. Фьёльнисмённ, как они себя называют, были рады получить нашу поддержку и теперь готовятся к восстанию. Мы готовы довести дело до конца?"
  iceland.10.a:0 "О, мы это сделаем!"


  news.900.t:0 "Швеция делает Норвегию марионеткой"
  news.900.d:0 "Ссылка на изменения в политическом климате Европы с момента их раскола в 1905 году сделала Норвегию Швецией марионеточным государством, номинально из-за неспособности норвежских военных контролировать побережье Скандинавии. Многие норвежцы, особенно те, кто достаточно взрослый, чтобы помнить объединение со Швецией, протестуют против этого решения, но до сих пор организованное сопротивление не проводилось. Норвегия снова стала шведской территорией."
  news.900.a:0 "Неприятно"

  news.902.t:0 "Страны Балтии восстают!"
  news.902.d:0 "Похоже, советский контроль над Прибалтикой не так прочен, как могло показаться со стороны. В полночь прошлой ночи пронезависимые группы во всех странах Балтии подняли полномасштабное восстание против своих советских повелителей. Хотя литовское восстание контролировалось местными оккупационными силами, Эстония и Латвия все еще находятся под контролем повстанцев. \n\n Хотя и подозревается иностранное вмешательство, пока никаких убедительных доказательств, указывающих на какую-либо нацию, нет."
  news.902.a:0 "Воодушевляюще!"

  news.903.t:0 "Страны Балтии восстают!"
  news.903.d:0 "Советский контроль над балтийскими государствами, похоже, не так крепок, как это могло бы показаться со стороны. Прошлой ночью в полночь пронезависимые группы по всем балтийским государствам начали полномасштабное восстание против своих советских владык. Хотя восстания в Латвии и Литве были подавлены местными оккупационными силами, Эстония на момент написания статьи все еще находилась под контролем мятежников. \n\n Во время усмирения восстания в Латвии было арестовано двое людей, опознанных как граждане Швеции. Советы пока еще не дали официального ответа."
  news.903.a:0 "Швеция играет с огнем."
  news.904.t:0 "Вторая гражданская война в Финляндии"
  news.904.d:0 "Вполне предсказуемо в Финляндии между коммунистами и коалицией демократов, фашистов и монархистов вновь разгорелась гражданская война. Несмотря на широкую гражданскую поддержку сил коалиции, Советский Союз уже начал открыто поддерживать коммунистическое государство, и без иностранного вмешательства возникает вопрос, насколько успешно они смогут помешать, по сути, перевороту."
  news.904.a:0 "Что, опять?"
  news.905.t:0 "Швеция присоединяется ко Второй гражданской войне в Финляндии"
  news.905.d:0"В позитивных новостях для некоммунистов шведские вооруженные силы объявили о полной поддержке сил финской коалиции в рамках гражданской войны. Хотя Швеция, безусловно, не может сравниться с Советским Союзом, ее поддержка может во многом послужить уравновешивающим фактором в этом в остальном одностороннем конфликте, и вероятность того, что больше стран поддержат коалицию, только возросла.\n\nХотя Швеция отклонила предложение о получении компенсации за свои усилия, коммерческое судно в Балтийском море отметило, что шведские пехотные бригады были размещены в гарнизонах на нескольких островах Аландской цепи."
  news.905.a:0"Любопытный поворот событий"
  news.906.t:0"Швеция отменяет Аландскую конвенцию!"
  news.906.d:0"Аландская конвенция была подписана в 1921 году и гласила, что одноименные острова должны были быть переданы Финляндии, но в качестве компенсации эта территория не только получила бы автономию, но и была бы полностью демилитаризована. Поскольку Швеция больше не считает это условие в своих интересах, самая большая из северных стран снова предъявила претензии на острова. В ответ Финляндия снова начала размещать на архипелаге войска, и дипломатические отношения между двумя странами резко ухудшаются."
  news.906.a:0"Все это из-за пары островов."
  news.906.b:0"Наконец-то!"
  news.907.t:0"Король выступает против коммунистов"
  news.907.d:0 "Король Густаф - открытый критик коммунизма, и недавно он выступил с большой речью, в которой осудил всю идеологию и попытался убедить ее сторонников вместо этого поддержать более умеренную социал-демократическую партию. Благодаря личному влиянию короля на нескольких шведских граждан многие отказываются от серпа и молота в пользу простой левой демократической партии."
  news.907.a:0 "Мы должны сокрушить элиты!"
  news.908.t:0 "Король арестован!"
  news.908.d:0 "Король Густаф V был схвачен и помещен под домашний арест в ходе шокирующего и смелого шага Шведской коммунистической партии. Король направлялся в Уппсалу, когда на его кортеж неожиданно напали вооруженные партизаны. Жизнь короля была сохранена в обмен на гарантию отмены монархии и отказа его семьи от любых претензий на престол, но многие шведские граждане задаются вопросом, сдержат ли коммунисты свое слово."
  news.908.a:0 "Справедливость для всех"
  news.909.t:0 "Король выслан!"
  news.909.d:0 "Революционеры из SKP сегодня совершили силовое нападение на дворец в Стокгольме с целью захватить или, возможно, убить короля Швеции. Толпа была разочарована, обнаружив пустой дворец - король уже сбежал под покровом ночи, после того как услышал сообщения от своих телохранителей о том, что члены его кухонного персонала открыто поддерживают этот шаг. Свидетельства о том, что король и его семья появляются в нескольких городах Европы, и независимо от того, где он поселится, можно ожидать, что он продолжит свой крестовый поход против коммунизма."
  news.909.a:0 "Старик безвреден."
  news.910.t:0 "Встреча в Букингемском дворце"
  news.910.d:0 "Густав V, бывший король Швеции, впервые появился на публике с момента своего вынужденного изгнания. После встречи с британской королевской семьей король провел конференцию с различными журналистами мира перед Дворцом, описав свою ситуацию и сделав более публичные выпады против коммунизма. Мировое сообщество в целом встало на его сторону, и единственным ответом действующего шведского правительства стало то, что он назвал его буржуазным реакционером, что произвело впечатление на немногих, если не на всех, иностранных сановников."
  news.910.a:0 "Как он смеет!"
  news.910.b:0 "Интересно"
  news.911.t:0 "Швеция и Норвегия объединяются в Социалистический союз"
  news.911.d:0 "Швеция и Норвегия вновь объединены в рамках образования, которое политиками новой нации получило название ''Скандинавский социалистический союз''. Несмотря на то, что Советский Союз, Монголия и Уругвай стали единственными странами, официально признавшими новый Союз, невозможно отрицать, что это серьёзное изменение баланса сил в Скандинавии. Если демократические или фашистские силы захотят закрепиться в регионе, то теперь они должны столкнуться с довольно мощным оплотом."
  news.911.a:0 "Неожиданно"
  news.911.b:0 "Великий день!"
  news.912.t:0 "Независимость Исландии"
  news.912.d:0 "Несмотря на то, что население Исландии невелико, а её жажда независимости не так сильна, небольшая группа повстанцев, предположительно вооружённая внешней силой, сегодня восстала и взяла под контроль весь остров. Нет никаких прямых доказательств, по крайней мере на данный момент, но международные наблюдатели предполагают, что благодетелями выступило либо правительство Германии, либо Швеции. Дания ещё не отреагировала, но ожидается, что попытается повторно оккупировать остров."
  news.912.a:0 "Как ответят датчане?"
  news.912.b:0 "Хорошие новости!"
  news.912.c:0 "Вопиющее преступление!"
  SWE_integrate_aland:0 "Интегрировать Аландские острова"