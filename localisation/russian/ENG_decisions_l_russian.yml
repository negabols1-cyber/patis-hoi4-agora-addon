 ENG_Allies_Operation_Neptune_desc:0 "Это решение будет активировано при выполнении определенных условий. \n\nКогда начнется §YОперация \"Нептун\"§!; все §Yосновные страны союзников§!, §Y[?FRA.GetName]§!, и §Yподданные [?ENG.GetName]§! получат бафф под названием §YОперация§! §RNeptune§!"
