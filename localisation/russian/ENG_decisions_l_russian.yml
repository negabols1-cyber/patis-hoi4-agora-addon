 ENG_reclamation_of_the_hre_category: "Восстановление Священной Римской империи"
 ENG_reclamation_of_the_hre_category_desc: "Наследие Священной Римской империи, сломанное и уменьшенное на протяжении веков, все еще задерживается в городах, замках и сердцах Центральной Европы. Будучи законным наследником через корону [ENG.GetLeader], мы можем перейти, чтобы вернуть эти земли и восстановить их верность нашей власти. Такой шаг будет смелым, и его не будут приветствовать тех, кто в настоящее время их держит, но история благоприятствует решительному."
