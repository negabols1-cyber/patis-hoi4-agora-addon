 ENG_Allies_Operation_Husky:0 "§YОперация \"Хаски\"§!"
 ENG_Allies_Operation_Husky_desc:0 "Это решение будет активировано при выполнении определенных условий. \n\nОдно из условий, упомянутых ниже как §YПолучение полного контроля над прибрежной Итальянской Ливией§!, будет активировано только тогда, когда вы §Rполучите полный контроль§! над итальянскими землями в §YПрибрежной Ливии§!.\n\nКогда начнется §YОперация \"Хаски\"§!; все §Yосновные страны союзников§!, §Y[?FRA.GetName]§!, и §Yподданные [?ENG.GetName]§! получат бафф под названием §YОперация§! §RHusky§!"
 ENG_Allies_Operation_Torch:0 "§YОперация \"Торч\"§!"
 ENG_Allies_Operation_Torch_desc:0 "Это решение будет активировано при выполнении определенных условий. \n\nКогда начнется §YОперация \"Торч\"§!; все §Yосновные страны союзников§!, §Y[?FRA.GetName]§!, и §Yподданные [?ENG.GetName]§! получат бафф под названием §YОперация§! §RTorch§!"
