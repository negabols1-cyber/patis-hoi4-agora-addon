l_russian:
 
 frig_ship_hull_light_1:0 "Корпус эсминца ранней модели"
 frig_ship_hull_light_1_desc:0 "Для обеспечения безопасности конвоев необходимо модернизировать и улучшать эсминцы времен Великой войны. Оснащение судов большим количеством торпед предоставит больше возможностей для атак."
 frig_ship_hull_light_2:0 "Корпус эсминца образца 1936 г."
 frig_ship_hull_light_2_desc:0 "Благодаря увеличенной дальности торпедной стрельбы и скорости перезарядки, а также новым видам вооружения, например зенитным установкам, наши эсминцы останутся эффективными и универсальными."
 frig_ship_hull_light_3:0 "Корпус эсминца образца 1940 г."
 frig_ship_hull_light_3_desc:0 "Чтобы лучше противостоять угрозам с воздуха и из-под воды, новые эсминцы должны быть оснащены радарами и современным противовоздушным и противолодочным оружием."
 frig_ship_hull_light_4:0 "Корпус эсминца образца 1944 г."
 frig_ship_hull_light_4_desc:0 "Современные эсминцы должны быть оснащены различными технологиями обнаружения, новыми системами сброса глубинных бомб и иметь больший масштаб, чем их предшественники."

 frig_ship_hull_light:0 "Эсминец"
 frig_ship_hull_light_desc:0 "Основная цель эсминцев — вести бой с легкими кораблями противника, включая подлодки, а также с воздушными целями."

 frig_ship_hull_submarine_1:0 "Корпус ранней модели подлодки"
 frig_ship_hull_submarine_1_desc:0 "Подлодки — это скрытные суда, предназначенные для уничтожения незащищенных конвоев. Ранние модели времен Великой войны открыли путь новым методам морской войны."
 frig_ship_hull_submarine_2:0 "Корпус подлодки образца 1936 г."
  frig_ship_hull_submarine_2_desc:0 "Улучшенное вооружение и повышенная стабильность позволяют этим новым субмаринам извлекать выгоду из достижений в военно-морской тактике и осуществлять атаки на значительном удалении от конвоев противника."
  frig_ship_hull_submarine_3:0 "Корпус подводной лодки образца 1940 г."
  frig_ship_hull_submarine_3_desc:0 "Вопрос о роли подводных лодок во флоте помимо борьбы с конвоями еще не решен. Ключом к созданию необходимой модели станет достижение баланса между скоростью, дальностью и вооружением."
  frig_ship_hull_submarine_4:0 "Корпус подводной лодки образца 1944 г."
  frig_ship_hull_submarine_4_desc:0 "Современные подводные лодки будут оснащены системами для работы на большей глубине и более эффективным расположением элементов, что позволит использовать наиболее подходящие двигатели и вооружение, исходя из боевого опыта."

  frig_ship_hull_cruiser_1_desc:0 "Несмотря на ограничения, установленные Вашингтонским военно-морским договором, крейсер остается самым универсальным боевым кораблем. Данный корпус позволяет строить легкие крейсеры для охраны и разведки или тяжелые крейсеры, предназначенные для поддержки линии фронта."
  frig_ship_hull_cruiser_2_desc:0 "Новое поколение крейсеров обладает модернизированной силовой установкой, повышающей живучесть, а также специальными помещениями для размещения авиации."
  frig_ship_hull_cruiser_3_desc:0 "По мере роста мощи и возможностей крейсеров во всем мире требуются новые и более крупные корпуса для размещения всего дополнительного оборудования."
  frig_ship_hull_cruiser_4_desc:0 "Опираясь на опыт военных лет, на последних версиях крейсеров была изменена надстройка, чтобы обеспечить более широкие сектора обстрела для зенитных установок, и переделана внутренняя компоновка, чтобы поддерживать работу радаров."
  frig_ship_hull_cruiser_1:1 "Ранний корпус крейсера"
  frig_ship_hull_cruiser_2:1 "Корпус крейсера 1936 г."
  frig_ship_hull_cruiser_3:1 "Корпус крейсера 1940 г."
  frig_ship_hull_cruiser_4:1 "Корпус крейсера 1944 г."

  frig_ship_hull_heavy_1_desc:0 "Некоторые считают их реликтами ушедшей эпохи морской войны, другие видят в них самые впечатляющие корабли из когда-либо построенных. Никто не может отрицать, что эти остатки гонки вооружений среди линкоров представляют собой одни из самых защищенных и вооруженных судов из когда-либо построенных."
  frig_ship_hull_heavy_2_desc:0 "С улучшенной устойчивостью и дальностью новое поколение линкоров совершенствует предыдущие разработки, оставаясь в рамках, оговоренных морскими договорами."
  frig_ship_hull_heavy_3_desc:0 "Более толстая броня, более мощные двигатели, орудийные батареи с большим калибром и улучшенные зенитные возможности могут позволить линкорам оставаться актуальными, при правильном использовании, в мире, где морская война становится все больше ориентированной на авиаподдержку."
  frig_ship_hull_heavy_4_desc:0 "Поскольку мир наблюдает за тем, что может стать последними крупными битвами с участием линкоров, возрастает важность тяжелых вооружений и зенитных установок."
  frig_ship_hull_heavy_1:1 "Ранний корпус тяжелого корабля"
  frig_ship_hull_heavy_2:1 "Корпус тяжелого корабля 1936 г."
  frig_ship_hull_heavy_3:1 "Корпус для тяжелого корабля образца 1940 г."
  frig_ship_hull_heavy_4:1 "Корпус для тяжелого корабля образца 1944 г."

  frig_ship_hull_carrier_1_desc:0 "Многие военные теоретики верят, что за морской авиацией — будущее. Переоборудование старых капитальных кораблей и океанских лайнеров под авианосцы станет первым шагом к использованию этих новых доктрин."
  frig_ship_hull_carrier_2_desc:0 "По мере начала работ по проектированию первых авианосцев с килем на стапеле, мы должны убедиться, что у этих судов будет дальность плавания и скорость, позволяющая идти в ногу с остальным флотом, при соблюдении послевоенных морских соглашений."
  frig_ship_hull_carrier_3_desc:0 "Усовершенствованные методы строительства и более специализированные системы, такие как траверсные лифты для летной палубы, позволят этим авианосцам перевозить больше самолетов с большей эффективностью."
  frig_ship_hull_carrier_1:1 "Корпус для авианосца образца 1936 г."
  frig_ship_hull_carrier_2:1 "Корпус для авианосца образца 1940 г."
  frig_ship_hull_carrier_3:1 "Корпус для авианосца образца 1944 г."

  frig_ship_hull_carrier_conversion_bb:1 "Переоборудованный корпус для линкора"
  frig_ship_hull_carrier_conversion_bb_desc:0 "После многолетних экспериментов авианосец постепенно развивался в отдельный класс судов. Авианосцы, способные поддерживать растущее число более мощных самолетов, нацелены стать последним словом в вопросе проецирования морской мощи."
  frig_ship_hull_carrier_conversion_ca:1 "Переоборудованный корпус для крейсера"
  frig_ship_hull_carrier_conversion_ca_desc:0 "За годы экспериментов авианосец медленно превратился в собственный класс кораблей. Способный нести все большее количество все более мощных самолетов, авианосец готов стать последним словом в проекции военно-морской мощи."

  frig_battery:0 "Базовая батарея"
  frig_battery_desc:0 "Известная и широко используемая корабельная артиллерия различных калибров и конструкций, которая будет удовлетворять потребности в ведении морских боев."

  frig_light_battery_1:0 "Базовая легкая батарея"
  frig_light_battery_1_desc:0 "Открытая силовая установка для малокалиберного орудия для использования на небольших кораблях.\n\nУстановка этого модуля повышает §YАтаку легких орудий§!, что помогает в бою с вражескими §YСторожевыми кораблями§!."

  frig_light_battery_2:0 "Улучшенная легкая батарея"
  frig_light_battery_2_desc:0 "Закрытая силовая установка для малокалиберного орудия обеспечивает экипажу некоторую защиту от стихии и осколков снарядов. \n\nУстановка этого модуля повышает §YАтаку легких орудий§!, что помогает в бою с вражескими §YСторожевыми кораблями§!."

  frig_light_battery_3:0 "Передовая легкая батарея"
  frig_light_battery_3_desc:0 "Передовая спаренная установка значительно повышает огневую мощь под броневой защитой.\n\nУстановка этого модуля повышает §YАтаку легких орудий§!, что помогает в бою с вражескими §YСторожевыми кораблями§!."

  frig_medium_battery_1:0 "Базовая средняя батарея"
  frig_medium_battery_1_desc:1 "Усовершенствованная турель с двумя или тремя орудиями среднего калибра для установки на крейсерах.\n\nУстановка модуля \"§YЛегкая средняя батарея§!\" увеличивает показатель §YУрон легкой артиллерии§!, что помогает в сражениях с §YЭсминцами§! противника. Установка модуля \"§YСредняя батарея§!\" увеличивает показатель §YУрон тяжелой артиллерии§!, что помогает в сражениях с §YЛинейными кораблями§! противника."
  frig_medium_battery_2:0 "Улучшенная средняя батарея"
  frig_medium_battery_2_desc:1 "Улучшенная компоновка турели обеспечивает более быструю перезарядку, а броня лучшего качества повышает выживаемость.\n\nУстановка модуля \"§YЛегкая средняя батарея§!\" увеличивает показатель §YУрон легкой артиллерии§!, что помогает в сражениях с §YЭсминцами§! противника. Установка модуля \"§YСредняя батарея§!\" увеличивает показатель §YУрон тяжелой артиллерии§!, что помогает в сражениях с §YЛинейными кораблями§! противника."
  frig_medium_battery_3:0 "Продвинутая средняя батарея"
  frig_medium_battery_3_desc:1 "Благодаря интеграции электрозаряжания и дистанционного управления, современные крейсеры могут достигать такой скорострельности и точности, которые ранее считались невозможными.\n\nУстановка модуля \"§YЛегкая средняя батарея§!\" увеличивает показатель §YУрон легкой артиллерии§!, что помогает в сражениях с §YЭсминцами§! противника. Установка модуля \"§YСредняя батарея§!\" увеличивает показатель §YУрон тяжелой артиллерии§!, что помогает в сражениях с §YЛинейными кораблями§! противника."
  frig_heavy_battery_1:0 "Базовая тяжелая батарея"
  frig_heavy_battery_1_desc:1 "Гигантская турель с массивными пушками под тяжелой броней.\n\nМонтаж модуля §YТяжелой Батареи§! увеличивает §YАтаку Тяжелых Орудий§! корабля, улучшая эффективность против вражеских §YГлавных Кораблей§!."
  frig_heavy_battery_2:0 "Улучшенная Тяжелая Батарея"
  frig_heavy_battery_2_desc:1 "Силовые Досылатели увеличивают скорость заряжания тяжелых орудий, в то время как автоматические пыле-герметичные двери повышают безопасность.\n\nМонтаж модуля §YТяжелой Батареи§! увеличивает §YАтаку Тяжелых Орудий§! корабля, улучшая эффективность против вражеских §YГлавных Кораблей§!."
  frig_heavy_battery_3:0 "Продвинутая Тяжелая Батарея"
  frig_heavy_battery_3_desc:1 "Улучшенные Механизмы Снижения Отдачи и катушки задержки уменьшают помехи снарядов в полете и значительно увеличивают точность.\n\nМонтаж модуля §YТяжелой Батареи§! увеличивает §YАтаку Тяжелых Орудий§! корабля, улучшая эффективность против вражеских §YГлавных Кораблей§!."
  frig_heavy_battery_4:0 "Сверхтяжелая Батарея"
  frig_heavy_battery_4_desc:1 "Самая большая пушка, когда-либо установленная на корабле, эти массивные орудия были разработаны для пробития любой возможной брони на любом расстоянии."
  frig_basic_secondary_battery:0 "Казематная Вспомогательная Батарея"
  frig_basic_secondary_battery_desc:1 "Эти небольшие орудия устанавливаются в прорезях вдоль корпуса и обеспечивают кораблю некоторую защиту от меньших кораблей, но имеют ограниченный сектор обстрела.\n\nУстановка модуля §YВспомогательные орудия§! обеспечивает §Yкрейсеры§!, §Yавианосцы§! или §Yтяжелые корабли§! небольшим количеством §YАтак легкой артиллерии§! и позволяет поражать вторую цель."
  frig_improved_secondary_battery:0 "Вспомогательные орудия в башнях"
  frig_improved_secondary_battery_desc:1 "Размещение вспомогательных орудий в моторных башнях значительно расширяет их сектор обстрела, но увеличивает вес и снижает остойчивость в тяжелых морских условиях.\n\nУстановка модуля §YВспомогательные орудия§! обеспечивает §Yкрейсеры§!, §Yавианосцы§! или §Yтяжелые корабли§! небольшим количеством §YАтак легкой артиллерии§! и позволяет поражать вторую цель."
  frig_advanced_secondary_battery:0 "Усовершенствованные вспомогательные орудия"
  frig_advanced_secondary_battery_desc:1 "Объединение зенитных и противокорабельных орудий в одном модуле обеспечивает большую гибкость и снижает вес.\n\nУстановка модуля §YВспомогательные орудия§! обеспечивает §Yкрейсеры§!, §Yавианосцы§! или §Yтяжелые корабли§! небольшим количеством §YАтак легкой артиллерии§! и позволяет поражать вторую цель. Этот модуль также увеличивает §YАтаки ПВО§!."