l_russian:
 mtg_britain_ef.1.t: "Найти нового короля"
 mtg_britain_ef.1.d: "Скандал с браком нашего короля серьезно повредил нашу репутацию. Чтобы исправить эту ситуацию, мы должны насильственно свергнуть короля и найти других королей, чтобы заслужить престол Англии."
 mtg_britain_ef.1.a: "Немецкий король - лучший вариант"
 mtg_britain_ef.1.b: "Шотландский король имеет больше смысла"
  
 mtg_britain_ef.2.t: "Египет требует статуса доминирования"
 mtg_britain_ef.2.d: "Египет воспользовался нашими существующими внутренними беспорядками и потребовал быть повышенным до статуса Доминиона. Как мы должны ответить на это требование?"
 mtg_britain_ef.2.a: "Мы обязательно примем спрос"
 mtg_britain_ef.2.b: "Эти действия не останутся безнаказанными!"
  
 mtg_britain_ef.3.t: "Предложение из Великобритании"
 mtg_britain_ef.3.d: "[ENG.GetLeader] Соединенного Королевства представила нам предложение. Они хотели, чтобы мы стояли рядом с ними в их позиции против Германии и снова стали Вильгельминой снова в этом монархическом порядке, который снова поднимется."
 mtg_britain_ef.3.a: "Мы ничего не можем сделать, кроме как принять"
 mtg_britain_ef.3.b: "Это нереалистичная идея!"
  
 mtg_britain_ef.4.t: "Ответить из Нидерландов"
 mtg_britain_ef.4.d: "Вильгельмина объявила, что приняла наше предложение и поддержит нас во всех отношениях."
 mtg_britain_ef.4.a: "Хороший"
  
 mtg_britain_ef.5.t: "Ответ из Нидерландов Вильгельмина отказывается"
 mtg_britain_ef.5.d: "Вильгельмина заявила, что видела наше предложение как невозможную фантазию и чепуху. Она сказала, что не будет с нами на этом."
 mtg_britain_ef.5.a: "Упущенная возможность"
  
 mtg_britain_ef.6.t: "Операция немыслимо"
 mtg_britain_ef.6.d: "«Соединенное Королевство подготовило план, получивший название« Операция «Чудовищная \» с целью остановить распространение коммунизма в Европе. Они признают риски, связанные с необходимостью прекращения военной деятельности из -за истощения военного."
 mtg_britain_ef.6.a: "Риск стоит взять"
 mtg_britain_ef.6.b: "Есть причина, почему это немыслимо"
  
 mtg_britain_ef.7.t: "Соединенные Штаты соглашаются"
 mtg_britain_ef.7.d: "Американцы согласились начать подготовку к операции. Персонал общего обороны был проинформирован и выпускает заказы на повторную мобилизацию.  Разведка сообщает, что советские репрессии будут неизбежны, и это будет соблюдать осторожность."
 mtg_britain_ef.7.a: "Пусть наши дети простят нас"
  
 mtg_britain_ef.8.t: "Соединенные Штаты отказываются"
 mtg_britain_ef.8.d: "Американцы решили не выполнять это предложение, заявив, что мир должен демобилизовать и перестроить, с риском быть слишком великими, чтобы оправдать для перехода на войну. Советские разведки и военное стратегическое позиционирование также считаются слишком устойчивыми для союзников, чтобы установить любое успешное вторжение, следуя примеру вторжения и полномочий оси."
 mtg_britain_ef.8.a: "Ответ, который мы ожидаем"
  
 mtg_britain_ef.9.t: "Английский германский торговый соглашение"
 mtg_britain_ef.9.d: "Посол [FROM.GetAdjective] связался с нашими дипломатами, предлагая торговое соглашение между нашими странами. Согласно предложению, [FROM.GetNameDef] отправит нам сырье, металлические руды и алюминий. Соглашение, несомненно, поможет нам в военных усилиях против враждебных стран в Европе, что позволит нам найти средства, чтобы уклониться от потенциальной блокады врага."
 mtg_britain_ef.9.a: "Мы нуждаемся в сырье"
 mtg_britain_ef.9.b: "Неприемлемое предложение"
  
 mtg_britain_ef.10.t: "[GER.GetNameDefCap] подписывает торговое соглашение английского на Германе"
 mtg_britain_ef.10.d: "[FROM.GetAdjective] Дипломаты сообщили нам, что они согласились с нашим предложением. Наши страны вступили в торговый договор, в соответствии с которым [ROOT.GetNameDef] отправит сырье, такое как металлические руды и алюминий, на [FROM.GetNameDef]."
 mtg_britain_ef.10.a: "Это принесет пользу обеим экономикам."
  
 mtg_britain_ef.11.t: "[GER.GetNameDefCap] отвергает торговое соглашение о английском языке"
 mtg_britain_ef.11.d: "После нескольких попыток нашего посольства убедить чиновников в отношении взаимных выгод от торгового договора между нашими странами, дипломаты [FROM.GetAdjective] только что сообщили нам, что они не заинтересованы в заключении торгового соглашения с [ROOT.GetNameDef]."
 mtg_britain_ef.11.a: "Упрямые дураки!"
  
 mtg_britain_ef.12.t: "Синдикализм в [ROOT.GetNameDefCap]"
 mtg_britain_ef.12.d: "Сегодня мы получили делегацию, выражающую интерес за интересом к расширению отношений между нашими странами и предприняты шагами для объединения людей [Root.GetAdjective] вместе с [From.GetNameDef]. Согласие с предложением [From.GetLeader] сделало бы [Root.GetNameDef] умеренно автономную марионетку [From.GetNameDef], и наше правительство будет реорганизовано во что -то более важное в соответствии с видением [From.GetLeader]."
 mtg_britain_ef.12.a: "Подчиняться их требованиям."
 mtg_britain_ef.12.b: "Абсолютно нет!"
  
 mtg_britain_ef.13.t: "[From.GetNameDefCap] подчиняется"
 mtg_britain_ef.13.d: "Правительство [From.GetAdjective] согласилось отказаться от своей независимости и стать марионеточным штатом [Root.GetNameDef]. Мы уверены, что это приведет к величию и продвижению интереса к региону."
 mtg_britain_ef.13.a: "Отличный."
  
 mtg_britain_ef.14.t: "[From.GetNameDefCap] Defiant!"
 mtg_britain_ef.14.d: "Дипломаты из [From.GetNameDef] прибыли сегодня, чтобы объявить, что они отказываются от нашего предложения объединиться [From.GetNameDef] с [Root.GetNameDef]. Как ни странно, вариант привести [From.GetNameDef] до пятки силой остается действительным и заманчивым вариантом."
 mtg_britain_ef.14.a: "Разочаровывает."
  
 mtg_britain_ef.15.t: "Внедрение экономической реформы"
 mtg_britain_ef.15.d: "Король Эдвард VIII начал серию экономических реформ для восстановления порядка и также направить любое воспринимаемое храмовое разбирательство, которое подвергается рыночным и финансовым интересам.  У него много разных направлений к Пушу для достижения этой цели. Освальд Мозли был назначен регентом для наблюдения за недавно сформированным бюро, обвиняемого в управлении этими инициативами."
 mtg_britain_ef.15.a: "Возникайте новые законы для банковского сектора."
 mtg_britain_ef.15.b: "Возникайте новые законы для промышленного сектора."
  
 mtg_britain_ef.19.t: "Выберите новый капитал для империи"
 mtg_britain_ef.19.d: "Наша имперская федерация достигла своих величайших пределов. Мы являемся домом для многих этнических людей и красивых городов в этих границах. Вот почему мы должны изменить наш капитал."
 mtg_britain_ef.19.a: "Не нужно меняться"
 mtg_britain_ef.19.b: "Канада"
 mtg_britain_ef.19.c: "Австралия"
 mtg_britain_ef.19.f: "Новая Зеландия"
 mtg_britain_ef.19.e: "Вторая страница"
  
 mtg_britain_ef.20.t: "Выберите столицу в Канаде"
 mtg_britain_ef.20.d: "Канада проводит 2 города в этой федерации, которые могут быть столицами. Какой из них мы выберете?"
 mtg_britain_ef.20.a: "Оттоу"
 mtg_britain_ef.20.b: "Монреаль"
 mtg_britain_ef.20.c: "Предыдущая страница"
  
 mtg_britain_ef.21.t: "Выберите столицу в Австралии"
 mtg_britain_ef.21.d: "Австралия принимает 2 города в этой федерации, которые могут быть столицами. Какой из них мы выберете?"
 mtg_britain_ef.21.a: "Канберра"
 mtg_britain_ef.21.b: "Сидней"
  
 mtg_britain_ef.22.t: "Выберите капитал в Соединенных Штатах"
 mtg_britain_ef.22.d: "Соединенные Штаты, символ демократии, являются домом для трех городов этой федерации, которые могут быть сделаны столицами. Какой из них мы выберете?"
 mtg_britain_ef.22.a: "Вашингтон"
 mtg_britain_ef.22.b: "Нью -Лондон (a.k.a New York)"
 mtg_britain_ef.22.c: "Лос -Анджелес"
  
 mtg_britain_ef.23.t: "Выберите новый капитал для Империи - Вторая страница"
 mtg_britain_ef.23.d: "Наша имперская федерация достигла своих величайших пределов. Мы являемся домом для многих этнических людей и красивых городов в этих границах. Вот почему мы должны изменить наш капитал."
 mtg_britain_ef.23.a: "ЮАР"
 mtg_britain_ef.23.b: "Соединенные Штаты"
 mtg_britain_ef.23.c: "Вернуться на первую страницу"
  
 mtg_britain_ef.24.t: "Ирландия принимает Закон о исполнительной власти (внешние отношения)"
 mtg_britain_ef.24.d: "В соответствии с конституцией ирландского свободного государства, как первоначально принято, исполнительный орган Генерального органа ирландского свободного государства был объявлен в качестве представителя короны. Реакция на разрушительное поведение вновь коронованного короля Эдуарда VIII, в Яронированном Состоянии Ирландского Состояния. Обычное в Ячеобороте. Получив абоубийство. Получив в Япологии. Генерал-губернатор, так что после этого исполнительное правительство ирландского свободного государства, поскольку это было касается внутренних вопросов, перестанет использоваться во имя царя."
 mtg_britain_ef.24.a: "Ирландия выбирает свой собственный путь."
 mtg_britain_ef.24.b: "Давайте заключим сделку"
  
 mtg_britain_ef.25.t: "Великобритания хочет заключить сделку"
 mtg_britain_ef.25.d: "Так же, как мы собирались достичь нашей независимости, дипломаты из британского правительства придумали предложение. Они говорят, что в обмен на оставшееся владычество, экономическая помощь будет предоставлена ​​нашей стране, и торговая война закончится."
 mtg_britain_ef.25.a: "Подписать сделку"
 mtg_britain_ef.25.b: "Разорвать сделку"
  
 mtg_britain_ef.26.t: "Ирландия приняла наше предложение"
 mtg_britain_ef.26.d: "Ирландия приняла наше щедрое предложение и решила не разделять эту империю. Они заявили, что надеялись, что экономическая помощь, которую они получили в ответ, не будет отрезана."
 mtg_britain_ef.26.a: "Хороший"
  
 mtg_britain_ef.27.t: "Ирландия отвергла наше предложение"
 mtg_britain_ef.27.d: "Ирландия не приняла последний шанс, что мы предложили им и отказались от нашего предложения. Мы больше ничего не можем делать."
 mtg_britain_ef.27.a: "Идиоты"
  
 mtg_britain_ef.28.t: "Вильгельмина вступает во владение"
 mtg_britain_ef.28.d: "Из -за увеличения давления общественности и соглашения, которое мы заключили с британцами, Вильгельмина взяла на себя администрацию."
 mtg_britain_ef.28.a: "Хороший"
  
 mtg_britain_ef.29.t: "Британия требует аннексировки нас"
 mtg_britain_ef.29.d: "Одна из статей соглашения, которую мы заключили с Британией, заключалась в том, что Британия аннексирует нас, когда придет время. Мы можем соблюдать соглашение и принять этот запрос Британии. Если мы скажем, что мы не соблюдали соглашение, в то время как на этом этапе все происходит, единственный выход, кажется, - война."
 mtg_britain_ef.29.a: "Принимать"
 mtg_britain_ef.29.b: "Тогда единственный способ - война"
  
 mtg_britain_ef.30.t: "Нидерланды подчинились"
 mtg_britain_ef.30.d: "Нидерланды объявили, что они придерживаются соглашения и одобрили нашу просьбу. Таким образом, не было необходимости в войне и кровопролитии."
 mtg_britain_ef.30.a: "Отличный"
  
 mtg_britain_ef.31.t: "Нидерланды сломали сделку"
 mtg_britain_ef.31.d: "Нидерланды заявили, что они не будут соблюдать соглашение и что, если бы мы были настойчивы, это может закончиться на войне."
 mtg_britain_ef.31.a: "Затем на фронт!"
  
 mtg_britain_ef.32.t: "Ирландская конституция [GetYear]"
 mtg_britain_ef.32.d: "Ирландия объявила новую конституцию, отменив старый прозвище «Ирландский свободный государство» для просто Ирландии или Эйре. В этой конституции не упоминается Британское Содружество, о котором Ирландия все еще технически является доминированием, и некоторые читатели считают его явно территориальным тоном в отношении Северной Ирландии. Британское правительство послало разъясняющую коммюнику, подтверждающую позицию Северной Ирландии как часть Соединенного Королевства."
 mtg_britain_ef.32.a: "Беспокойство"
  
 mtg_britain_ef.33.t: "Eire (подтверждение соглашений) Закон [GetYear]"
 mtg_britain_ef.33.d: "Англо-ирландская торговая война в 1933 году бушевала, возникшая в результате отказа от ирландских отказа о возмещении аннуитетов на землю от финансовых кредитов, предоставленных ирландским фермерам-арендаторам. Это нарушение договора 1921 года привело к разрушению отношений и последующим торговым ограничениям в обеих странах. Но в последние несколько месяцев наблюдалось создание примирительного законодательства, начиная с договора о угольном корпусе три года назад, и теперь с этим договором, объявляющим официальное прекращение положения дел."
 mtg_britain_ef.33.a: "Хузза!"
  
 mtg_britain_ef.34.t: "Грэм речи против [GER.GetName]"
 mtg_britain_ef.34.d:1 "James Graham made a rousing speech today. In it, he asserted the uniqueness and individuality of British Autocracy, and stressed the distinction between his policies and those of the German dictator. He went on to conclude with powerful words: "Джеймс Грэм сегодня произнес воодушечную речь. В нем он утверждал уникальность и индивидуальность британского самодержавия и подчеркнул различие между его политикой и политикой немецкого диктатора. Далее он сделал вывод с сильными словами: «Никто, кроме британцы, не будет влиять на Британию!»"
 mtg_britain_ef.34.a: "Общественный прием кажется довольно хорошим."
  
 mtg_britain_ef.35.t: "Бомбардировка на Букингемский дворец"
 mtg_britain_ef.35.d: "После того, как границы были полностью открыты, террористы скрывались среди многих людей, входящих в нашу страну, наконец, достигли своей цели. Несколько бомб были взорваны в Букингемском дворце в то же время, нанесли серьезный ущерб и делая дворец непригодным. Террористы, которые также спрятались среди слуг дворца, убили многих слуг и членов королевской семьи с оружием во дворце, чтобы убедиться, что королевская семья была мертва. Армия была развернута, чтобы восстановить порядок и очистить оставшихся террористов."
 mtg_britain_ef.35.a: "Беспокойство"
  
 mtg_britain_ef.36.t: "Предложение от Виктории Луизы"
 mtg_britain_ef.36.d: "После взрыва в Букингемском дворце нет никаких королевских особи, чтобы возглавить страну. Виктория Луиза воспользовалась возможностью, чтобы сделать нас предложением. Она пообещала возглавить страну, пока член королевской семьи не сможет возглавить страну, и обещала не нарушать наши традиции."
 mtg_britain_ef.36.a: "Принять предложение"
 mtg_britain_ef.36.b: "Это невозможно!"
  
 mtg_britain_ef.37.t: "Королевское предложение из Британии"
 mtg_britain_ef.37.d: "Формальное сообщение прибыло из Лондона. Британское правительство, в настоящее время возглавляемое монархом немецкой линии, расширило беспрецедентное предложение: установить личный союз между нашим царством и их Это предложение направлено не на то, чтобы объединить наши государства, а скорее связать их в династической солидарности, что приводит к эпоху старых империй и королевских альянсов. Принятие поместит нашего монарха на британский трон, открывая путь к общему престижу, влиянию и, возможно, измененному порядку в Европе. Отказ, однако, будет поддерживать наш нынешний суверенитет и избежать дальнейших запугиваний. Вес царствования теперь падает на решение: будут ли короны будут объединены еще раз?"
 mtg_britain_ef.37.a: "Мы будем носить обе короны"
 mtg_britain_ef.37.b: "Наша судьба лежит отдельно"
  
 mtg_britain_ef.38.t: "Союз сформирован"
 mtg_britain_ef.38.d: "Из Берлина появилось известие: немецкий монарх принял предложение принять британский престол и сформировать личный союз между нашими двумя сферами. Двойная монархия теперь реальность. Хотя оба правительства остаются административно независимыми, символика настоящего Соглашения является глубокой. Общий суверен теперь председательствует в обеих странах - слияние династического наследия и современного государственного управления. Празднования разразились в кругах роялистов по всей империи, в то время как бормоты от беспокойства эхо среди республиканцев и традиционалистов. Независимо от реакции, история превратила свою страницу."
 mtg_britain_ef.38.a: "Long Live The United Crown!"
  
 mtg_britain_ef.39.t: "Уважительный упадок"
 mtg_britain_ef.39.d: "Ответ от Берлина был получен. Несмотря на то, что он милостивый, немецкий монарх отказался от предложения личного союза. Их рассуждения основаны на сохранении национальной автономии и стратегической осторожности такими радикальными требованиями движения. Несмотря на отказ, сохраняется дипломатическое тепло. Никакого оскорбления не было принято, ни обидно. Короны остаются отдельными, но сердечными. Хотя мечта о воссоединении династии заканчивается здесь, сотрудничество между нашими народами может еще углубляться другими способами."
 mtg_britain_ef.39.a: "Неутешительное, но понятное решение"
  
 mtg_britain_ef.41.t: "Протесты в [british_protest_state.GetName]"
 mtg_britain_ef.41.d: "Тысячи людей вышли на улицы [british_protest_state.GetName] и окружающих городов, скандируя лозунги, такие как «Англия для англичан» и требуя отречения шотландского монарха. Протестующие обвиняют корону в предательстве английской идентичности и истории. Несмотря на то, что в основном мирные, масштаб протестов нарушил региональную производительность."
 mtg_britain_ef.41.a: "Напряженность растет с каждым днем"
  
 mtg_britain_ef.42.t: "Саботаж на вершинах [british_sabotage_state.GetName]"
 mtg_britain_ef.42.d: "В явном акте скоординированного саботажа несколько ключевых кранов и складских помещений на верфи [british_sabotage_state.GetName] были подожжены в одночасье. Анонимные листочки, найденные поблизости, призывали к «сопротивлению против северного претендента». Ожидается, что повреждение военно -морского производства потребуется недели для полного ремонта."
 mtg_britain_ef.42.a: "Целенаправленная атака на корону"
  
 mtg_britain_ef.43.t: "Диверсионы ударяют по железным дорогам"
 mtg_britain_ef.43.d: "Железнодорожные сети по всей южной Англии были поражены скоординированными сбоями. Переключатели были забиты, вагоны сошли с рельсов, а телеграфные линии вырезаны. Правительство подозревает подземные ячейки, работающие с местной поддержкой. Движение войск и запасов было заметно затруднено."
 mtg_britain_ef.43.a: "Задержки с логистическими данными растут"
  
 mtg_britain_ef.44.t: "Анти-шотландские беспорядки в Лондоне"
 mtg_britain_ef.44.d: "Столкновения разразились в центре Лондона после того, как местные националистические группы сплотились против того, что они называют «гэльским поглощением» британского престола. Полиция изо всех сил пыталась сдержать беспорядков, которые подожгли правительственные здания и разграбили близлежащие магазины. Несколько заводов были закрыты в хаосе."
 mtg_britain_ef.44.a: "Столица в смятении"
  
 mtg_britain_ef.440.t: "Шотландия стоит с королем"
 mtg_britain_ef.440.d: "Последние недели показали, что, несмотря на беспорядки в определенных частях царства, шотландское население остается твердо позади своего монарха. Улицы в Эдинбурге, Глазго и бесчисленных городах по всему нагорьям, наполненными подбадривающими толпами, размахивая королевским стандартом. Магазин Windows с гордостью демонстрирует портреты короля, а местные лидеры призывают к единству под его правлением. В то время как некоторые голоса инакомыслия все еще эхом эхо на заднем плане, они утонули из -за подавляющего демонстрации лояльности сынов и дочерей Шотландии."
 mtg_britain_ef.440.a: "Даже в хаосе лояльность выживает"
  
 mtg_britain_ef.45.t: "Насилие вспыхивает через [british_factory_sabotage_state.GetName]"
 mtg_britain_ef.45.d: "То, что началось как массовый протест, в настоящее время превратилось в целевое насилие. По всему региону злые мобы начали атаковать фабрики и предприятия, принадлежащие лицам, которые воспринимаются как поддерживающие новый режим. Несколько промышленных объектов были подожжены, и работники были ранены или вынуждены бежать. Реакция полиции была медленной и дезорганизованной, что вызвало обеспокоенность по поводу региональной стабильности и способности местных органов власти содержать волнения. Когда эти события разворачиваются, призрак более глубокого внутреннего конфликта начинает вырисовываться."
 mtg_britain_ef.45.a: "Ситуация выходит из -под контроля"
  
 mtg_britain_ef.46.t: "Новое предложение от Лондона"
 mtg_britain_ef.46.d: "В жесте примирения и перспективного государственного управления английское правительство-под новым шотландским сувереном-предложило статус владычества для Ирландии. Предложение обещает полную внутреннюю автономию, общую оборону и равную позицию среди народов острова. Это беспрецедентная попытка разрешить старые обиды не властью, а с партнерством."
 mtg_britain_ef.46.a: "Пусть это будет новым началом для островов"
 mtg_britain_ef.46.b: "Мы суверенны - и останутся такими"
  
 mtg_britain_ef.47.t: "Ирландия принимает предложение Доминиона"
 mtg_britain_ef.47.d: "Ирландия официально приняла наше предложение по доминированию, отметив значительный дипломатический прорыв. Лидеры с обеих сторон подписали новую хартию, подтверждающую взаимную оборону, внутреннюю автономию и мирное сотрудничество. Острова, когда -то разделенные на историю, теперь встают в видении."
 mtg_britain_ef.47.a: "Исторический момент для мира"
  
 mtg_britain_ef.48.t: "Ирландия отвергает предложение"
 mtg_britain_ef.48.d: "Несмотря на вежливое по тону, руководство Ирландии отказалось от договоренности. Их послание подтверждает полный суверенитет как не подлежащий обсуждению столб национальной идентичности. Хотя это закрывает дверь в формальном союзе, неформальное сотрудничество все еще может быть возможным в будущем."
 mtg_britain_ef.48.a: "Потерянная возможность, но не конец"
  
 mtg_britain_ef.49.t: "Подозрительная деятельность на западе"
 mtg_britain_ef.49.d: "Отчеты из наших разведывательных служб показывают, что как Великобритания, так и Германия значительно увеличили свои совместные военные операции. Координация высокого уровня, движения войск вблизи Восточной Европы и скрытые дипломатические выравнивания все указывают на одну вещь: подготовка к потенциальной атаке. Отражают ли эти признаки неизбежную угрозу или просто обычное положение, зависит от нас."
 mtg_britain_ef.49.a: "Мы должны быть готовы ко всему"
 mtg_britain_ef.49.b: "Пусть Запад сыграет в свои игры"
  
 mtg_britain_ef.50.t: "[From.GetNameDefCap] требует имперских земель"
 mtg_britain_ef.50.d: "В смелом дипломатическом шаге [ENG.GetNameDef] официально потребовал передачу территорий в бывшей Священной Римской империи, заявив, что их как законные земли под властью короны [ENG.GetLeader]. Это предложение имеет завуалированные угрозы «серьезных последствий», если мы откажемся."
 mtg_britain_ef.50.a: "Неохотно принять их требование"
 mtg_britain_ef.50.b: "Абсолютно нет"
  
 mtg_britain_ef.51.t: "Имперские территории обеспечены"
 mtg_britain_ef.51.d: "Наши требования были выполнены в полном объеме. Рассматриваемые территории были перенесены без капли крови. Суд отмечает это как триумф королевской дипломатии и напоминание о нашем обновленном престиже в Европе."
 mtg_britain_ef.51.a: "Победа за корону"
  
 mtg_britain_ef.52.t: "[From.GetNameDefCap] отклонил наши требования"
 mtg_britain_ef.52.d: "Иностранное правительство откровенно отказалось признать наши законные претензии на имперские земли. Это оскорбление нашей короны не может остаться без ответа. Некоторые в суде призывают к немедленной войне, в то время как другие призывают экономические меры медленно их кровоточить."
 mtg_britain_ef.52.a: "Тогда это война!"
 mtg_britain_ef.52.b: "Залететь их с помощью эмбарго и санкций"
  
 mtg_britain_ef.53.t: "[ENG.GetNameDefCap] требует мира"
 mtg_britain_ef.53.d: "Мы получили официальный дипломатический спрос от британской короны. Мы сталкиваемся с выбором: чтобы прислушаться к вызову и прекратить военные действия, или отклонить увертюру и рискнуть дальнейшим опустошением. Посланники короля ясно дают понять, что соответствие приведет к переговорам под британским надзором, в то время как отказ будет встречаться с последствиями."
 mtg_britain_ef.53.a: "Принять спрос"
 mtg_britain_ef.53.b: "Это невозможно!"
  
 mtg_britain_ef.54.t: "[From.GetNameDefCap] принял наши требования"
 mtg_britain_ef.54.d: "Следуя нашей твердой настойчивости, [FROM.GetName] принял условия мира без положений. Орудия замолчают, и начинается новая глава спокойствия. Эта быстрая резолюция отталкивает бесчисленные жизни и создает прецедент для будущей дипломатии."
 mtg_britain_ef.54.a: "Мы будем уважать и поддерживать этот мир"
  
 mtg_britain_ef.55.t: "[From.GetNameDefCap] отклонил наши требования"
 mtg_britain_ef.55.d: "Наш призыв к миру был холодно отказался [FROM.GetName]. Война бушует, заставляя нас задуматься о том, будет ли обостнуться с силой или искать другие возможности, чтобы положить конец этому конфликту."
 mtg_britain_ef.55.a: "Применять мир силой"
 mtg_britain_ef.55.b: "Встать и использовать альтернативные варианты"
  
 mtg_britain_ef.56.t: "[FROM.GetName] предлагает личный союз"
 mtg_britain_ef.56.d: "В ходе, который мог бы изменить баланс сил в регионе, [FROM.GetName] подошел к нам с предложением объединить наши нации под одной короной. Их монарх, [FROM.GetLeader], стремится управлять как сферами в личном союзе, утверждая, что это принесет мир, процветание и взаимную безопасность. Хотя эта договоренность сохранила бы нашу автономию во многих внутренних вопросах, оно приложит иностранные руки на бразды правления нашего суверенитета. Выбор перед нами ясен: принять общее будущее, или отвергнуть его и подготовиться к последствиям."
 mtg_britain_ef.56.a: "Мы объединимся под одной короной"
 mtg_britain_ef.56.b: "Никогда - мы будем стоять независимыми!"
  
 mtg_britain_ef.57.t: "[FROM.GetName] принимает профсоюз"
 mtg_britain_ef.57.d: "Наши дипломатические увертюры преуспели до ожидания - [FROM.GetName] согласился вступить в личный союз с [ROOT.GetName]. Их корона теперь лежит рядом с нашими собственными, и обе страны будут двигаться вперед под руководством [ROOT.GetLeader]. Этот момент отмечает рассвет новой эры, в которой наши сферы сильнее вместе, чем отдельно."
 mtg_britain_ef.57.a: "Исторический день для наших народов"
  
 mtg_britain_ef.58.t: "[FROM.GetName] отклоняет наше предложение"
 mtg_britain_ef.58.d: "Несмотря на наше щедрое предложение объединить наши нации под одной короной, [FROM.GetName] выбрал путь неповиновения. Их отклонение не только для нашего монарха, [ROOT.GetLeader], но и вызов нашему законному влиянию в регионе. Это оскорбление не может остаться без ответа - наши советники уже разработают планы, чтобы довести [FROM.GetName] на каблук силой, если это необходимо."
 mtg_britain_ef.58.a: "Тогда они столкнутся с последствиями"
