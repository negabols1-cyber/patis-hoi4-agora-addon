  ##welfare (economic policy)
  NOR_finish_the_post-depression_recovery:0 "Завершение последепрессионного восстановления"
  NOR_finish_the_post-depression_recovery_desc:0 "Пока наша страна и наша экономика находятся в относительно хорошем состоянии, мы могли бы направить часть значительных средств на то, чтобы положить конец остаточным последствиям депрессии, и объявить социальную программу правительства Нюгорсволл оглушительным успехом. Норвежский народ, несомненно, оценит такой шаг на долгие годы вперед."
  ##заказы на иностранные материалы (экономическая политика)
  NOR_procure_british_destroyers:0 "Заказать британские эсминцы"
  NOR_procure_british_destroyers_desc:0 "Благодаря текущему военно-морскому сотрудничеству в рамках нашего союза с Британцами мы сможем закупить у них эсминцы по очень выгодным ценам, поскольку в интересах всех иметь сильный Норвежский военно-морской флот."
  NOR_procure_british_destroyers_tt:0 "При их завершении два произведенных в Британии §Yэсминца§! будут переданы нам. Исследование §Yулучшенных эсминцев§! позволит получить нам более современные корабли."
  NOR_procure_german_destroyers:0 "Заказать немецкие эсминцы"
  NOR_procure_german_destroyers_desc:0 "Благодаря текущему военно-морскому сотрудничеству в рамках нашего союза с Немцами мы сможем закупить у них эсминцы по очень выгодным ценам, поскольку в интересах всех иметь сильный Норвежский военно-морской флот."
  NOR_procure_german_destroyers_tt:0 "При их завершении два произведенных в Германии §Yэсминца§! будут переданы нам. Исследование §Yулучшенных эсминцев§! позволит получить нам более современные корабли."
  ENG_GER_stop_procurements:0 "Остановить дальнейшие закупки норвежского флота"
  ENG_GER_reallow_procurements:0 "Возобновить закупки флота для Норвегии"
  ##defensive lines and fortifications (economic policy)
  NOR_glomma-halden_line:0 "Возвести линию Гломма-Хальден"
  NOR_glomma-halden_line_desc:0 "Закупка у подрядчиков ряда бункеров и укреплений к востоку от Осло должна обезопасить этот важный город от любых агрессоров. На традиционном пути вторжения из Швеции в наши земли должны быть серьёзные препятствия для любого врага."
  NOR_lyngen_line:0 "Возвести линию Линг"
  NOR_lyngen_line_desc:0 "При нейтралитете Швеции мы сможем отразить любые наземные атаки с севера Норвегии, возведя ряд укреплений и бункеров в горах района Линга в Тромсе. Узкие границы также могут помочь любой встречной атаке, не нарушающей шведского нейтралитета."
  ##railroad development
  NOR_railroad_development:0 "Развитие железных дорог"
  NOR_railroad_development_desc:0 "В Норвегии с 1800-х годов было построено много новых железных дорог, которые соединяют отдаленное население Норвегии по пересеченной местности быстрее, чем когда-либо прежде, за исключением некоторых соединений через море, озеро и реку. \nТекущий уровень развития железнодорожного транспорта:\n\nВ любом случае, это может иметь значение и для маневрирования нашими вооруженными силами, что позволит быстрее реагировать, если военные будут должным образом интегрированы с этими железными дорогами. При достаточном развитии могут быть применены даже новые проекты и особые льготы. Проекты, доступные при развитии железных дорог:\nУровень 1: 0+    Уровень 2: 6+    Уровень 3: 12+!"
  NOR_railroad_development_icon_value:0 "[?NOR.railroad_development|0H]"
  NOR_railroad_development_full_breakdown:0 "[Root.GetNameDefCap] в настоящее время имеет [?NOR.railroad_development|+0] развития железнодорожного транспорта. По мере увеличения этого показателя могут быть доступны новые решения и льготы.\n"
  NOR_railroad_development_add_1_tt:0 "\nЗавершение этого добавит 1 развитие железнодорожного транспорта."
  NOR_continued_electrification_of_dovrebanen:0 "Продолжение электрификации линии Довре"
  NOR_continued_electrification_of_dovrebanen_desc:0 "Текущий проект, электрификация больших участков линии Довре, может не только сделать транспортировку более эффективной и надежной на ее станциях, но и стать шагом к общей электрификации по всей Норвегии."
  NOR_electrification_of_central_norways_railroads:0 "Электрификация железных дорог Центральной Норвегии"
  NOR_electrification_of_central_norways_railroads_desc:0 ""
  NOR_electrification_of_eastern_norways_railroads:0 "Электрификация железных дорог Восточной Норвегии"
  NOR_electrification_of_eastern_norways_railroads_desc:0 "Довребанен в основном электрифицирован, следующим шагом для нас может стать электрификация других железных дорог в Восточной Норвегии. Пока мы не сможем электрифицировать все сразу, электрификация значительной их части должна сделать нашу инфраструктуру гораздо эффективнее."
  NOR_electrification_of_northern_norways_railroads:0 "Электрификация железных дорог Северной Норвегии"
  NOR_electrification_of_northern_norways_railroads_desc:0 ""
  NOR_electrification_of_southern_norways_railroads:0 "Электрификация железных дорог Южной Норвегии"
  NOR_electrification_of_southern_norways_railroads_desc:0 ""
  NOR_electrification_of_western_norways_railroads:0 "Электрификация железных дорог Западной Норвегии"
  NOR_electrification_of_western_norways_railroads_desc:0 "На западе Норвегии есть отличные условия для производства гидроэлектроэнергии, поэтому дальнейшее ее использование для электрификации основных железных дорог, проходящих через регион, может оказаться вполне разумным вложением средств."
  NOR_electrify_border_region_jamtland:0 "Электрифицировать приграничный регион Ямтланд"
  NOR_electrify_border_region_jamtland_desc:0 "Шведы были в значительной степени пионерами в области электрификации своих железных дорог, так как они имеют значительный потенциал для выработки гидроэлектроэнергии, как и мы. Хотя соединение Кируна-Стокгольм имело приоритет и в значительной степени оказалось успешным, теперь, когда мы также взялись за масштабные проекты в наших центрах народонаселения и производства, возможно, выделить часть ресурсов для наших приграничных районов. Местные жители Ямтланда могут по достоинству оценить такой шаг, а все, кто проходит через него, смогут сделать это более эффективно."
  NOR_electrify_border_region_vaestergoetland:0 "Электрифицировать приграничный регион Вестергётланд"
  NOR_electrify_border_region_vaestergoetland_desc:0 "Шведы были в значительной степени пионерами в области электрификации своих железных дорог, так как они имеют значительный потенциал для выработки гидроэлектроэнергии, как и мы. Хотя соединение Кируна-Стокгольм имело приоритет и в значительной степени оказалось успешным, теперь, когда мы также взялись за масштабные проекты в наших центрах народонаселения и производства, возможно, выделить часть ресурсов для наших приграничных районов. Вестергётланд, один из традиционных регионов Швеции, является одним из таких регионов. Если бы мы сделали это с теми, кто находится под контролем шведов в регионе, они наверняка бы оценили это, а также сделали движение более эффективным для всех, кто проходит через этот район."
  NOR_extend_nordlandsbanen_to_narvik:0 "Расширить Nordlandsbanen до Нарвика"
  NOR_extend_nordlandsbanen_to_narvik_desc:0 "Проложив железнодорожную ветку Нордландсбанан до Будё, её можно продлить до Нарвика. Так войска и ресурсы получат возможность добираться до этого крупного незамерзающего порта и обратно, не прибегая к морским перевозкам, а все главные районы Норвегии можно будет связать с ней без особого труда. К тому же прокладка этой железнодорожной ветки будет взаимовыгодной, так как оттуда шведская железная руда поставляется за границу. Кстати, в будущем можно будет проложить железнодорожную ветку и дальше на север, но пока из-за политических разногласий этот вопрос откладывается."
  NOR_extend_nordlandsbanen_to_tromsoe:0 "Продлить железнодорожную ветку Нордландсбанан до Тромсё"
  NOR_extend_nordlandsbanen_to_tromsoe_desc:0 "Прокладка ещё одной ветки, ведущей к району Лийнген и Тромсё, позволит объединить все основные города и экономические центры Северной Норвегии с остальной частью страны. Впрочем, через ту суровую местность прокладывать пути нелегко, и согласовать проект до конца тоже непросто. Тем не менее уже сейчас ветку можно продлить до Тромсё и там остановиться."
  NOR_extend_raumabanen_to_molde_and_aalesund:0 "Продлить железнодорожную ветку Раумабанан до Молде и Олесунна"
  NOR_extend_raumabanen_to_molde_and_aalesund_desc:0 "Ветку Раумабанан сейчас прокладывают до Онддалснеса, находящегося в глубине района Ромсдал. Возможно, в будущем её продлят до Кристиансунна, Молде или Олесунна, но дальнейшее строительство пока заморожено. К тому же между прибрежными городами возник спор из-за того, в каком направлении прокладывать дорогу. Каждый город хотел бы, чтобы новую ветку проложили прямо до него, поэтому в политических дебатах нет никакого согласия. Но можно положить конец этому спору и завершить строительство, хотя бы для того, чтобы не оставить большие города вдоль побережья без железной дороги. Рано или поздно это в любом случае придётся сделать."
  NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge:0 "Завершить переоборудование Rørosbanen в стандартную колею"
  NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge_desc:0 "Rørosbanen — одна из самых ранних железных дорог в Норвегии, построенная по устаревшим спецификациям, когда распространенным явлением были узкие железнодорожные колеи. В настоящее время она проходит переоборудование в стандартную колею в несколько этапов. Его завершение должно обеспечить более высокие скорости и более эффективное использование старой железной дороги."
  NOR_invest_in_the_cross-iceland_railroad:0 "Инвестировать в трансисландскую железную дорогу"
  NOR_invest_in_the_cross-iceland_railroad_desc:0 "До недавних пор трансисландская железная дорога была чисто теоретической идеей, но благодаря непрерывной модернизации наших железных дорог сейчас некоторые люди предлагают инвестировать часть излишков нашей промышленности, материалов и денег в строительство железной дороги через Исландию, используя гидроэлектроэнергию для ее работы с самого начала. Такие значительные инвестиции должны также укрепить торговые и инвестиционные отношения между исландцами и нами."
  NOR_prepare_bergensbanen_for_military_use:0 "Подготовить Бергенсбанскую железную дорогу к военному использованию"
  NOR_prepare_bergensbanen_for_military_use_desc:0 "Соединение столицы, административного центра и крупнейшего города Осло с торговым центром и вторым по величине городом Берген всегда было очень важно для политиков, населения в целом и бизнеса с тех пор, как появились более длинные железные дороги. Проходя через холмы, возвышенные плато и горы, железная дорога окупила свои затраты, даже если изначально это была крупная инвестиция. Поскольку она уже может использоваться нашими военными в крайнем случае, ее дальнейшая модернизация может оказаться разумной идеей, учитывая ее важность."
  NOR_prepare_dovrebanen_for_military_use:0 "Подготовка Довребанена к использованию в военных целях"
  NOR_prepare_dovrebanen_for_military_use_desc:0 "Довребанен - это длинная железная дорога, пересекающая большую часть Восточной Норвегии и соединяющая ее с важным центром Норвегии, к которому также примыкает несколько меньших путей. Дальнейшая модернизация этой дороги для обеспечения передвижения по крупнейшим сельскохозяйственным угодьям Норвегии представляется очень разумной, а соединение с Тронхеймом, хотя и само по себе важно, впоследствии может стать началом соединения Северной Норвегии с остальной страной."
  NOR_prepare_raumabanen_for_military_use:0 "Подготовка Раумабанена к использованию в военных целях"
  NOR_prepare_raumabanen_for_military_use_desc:0 "Несмотря на то, что линия Раумабанан не очень длинная и выглядит незаметной на карте, она пересекает гористые и временами альпийские ландшафты Опплана и Суннмёре, соединяя восток с западом. Разрешение на быстрое передвижение войск по этой линии может стать решающим между боями или смертью и захватом для всех дружественных войск в этом районе."
  NOR_prepare_soerlandsbanen_for_military_use:0 "Подготовьте линию Сёрланнсбанан к использованию военными"
  NOR_prepare_soerlandsbanen_for_military_use_desc:0 "Линия Сёрланнсбанан принесла огромную пользу нашей экономике, соединив с морем западный продуктивный город Ставангер с мирными ландшафтами Южной Норвегии и Южной Норвегией с административным центром Осло. Предоставление войскам доступа к быстрому передвижению с запада на юг, а затем на восток может иметь большое значение."
  ##specific technology sharing decisions
  NOR_nordic_research:0 "Нордические исследовательские приглашения"
  NOR_invite_country_into_nordic_research:0 "Пригласить [From.GetName] в нордическую исследовательскую группу"
  NOR_invite_country_into_nordic_research_desc:0 "Удобная и солидарная мера, §YNордическое исследовательское сотрудничество§! может быть расширено за счет приглашения большего числа стран в нашу сферу в основную группу стран, в настоящее время сотрудничающих в научной области.
  ##prestigious projects
  NOR_fund_the_royal_norwegian_society:0 "Финансирование Королевского Норвежского общества"
  NOR_fund_the_royal_norwegian_society_desc:0 "Основанное в 1760 году, \"Det Kongelige Norske Videnskabers Selskab\" является старейшим научным и учебным заведением в Норвегии, где путем голосования отбираются лучшие умы страны в сфере науки и смежных областях. Кроме того, Общество присуждает премии за выдающиеся открытия и достижения норвежцев.\n\nФинансируя и расширяя Общество за счет более крупных помещений, сотрудничая с другими нашими учебными заведениями и приглашая наших государственных деятелей и дипломатов на зарубежных ученых в нашей сфере, мы можем делиться методами и знаниями с нашими друзьями, а также организовывать совместные исследовательские усилия по самым перспективным темам дня. Хотя это, несомненно, принесет нам в долгосрочной перспективе больше знаний и престижа, расширение элитного учреждения с целью включить гораздо больше членов, как и следовало ожидать, встретит некоторое первоначальное сопротивление."
  NOR_fund_additional_scientific_equipment:0 "Финансировать дополнительное научное оборудование"
  NOR_fund_additional_scientific_equipment_desc:0 "Финансируя дополнительное научно-исследовательское оборудование, члены §YКоролевского норвежского общества§! могут попытаться воспроизвести часть перспективных исследований, которые они наблюдают в своих областях, и тем самым удостовериться в обоснованности науки, которую они наблюдают. Это может сделать наше исследовательское сотрудничество еще более эффективным."
  NOR_invite_foreign_academics_to_the_royal_norwegian_society:0 "Пригласить зарубежных ученых в Королевское норвежское общество"
  NOR_invite_foreign_academics_to_the_royal_norwegian_society_desc:0 "Теперь, когда Королевское норвежское общество расширено и в нём присутствуют иностранные учёные, приглашение академиков из недавно присоединённых членов альянса станет простым делом, если мы захотим поделиться своими знаниями и просвещённым сотрудничеством."
  NOR_share_military_tactics_with_iceland:0 "Поделиться военной тактикой с Исландией"
  NOR_share_military_tactics_with_iceland_desc:0 "Поскольку §YИсландия§! находится в нашем альянсе, представляется разумным поделиться с ней частью наших общих военных знаний в такой серьёзной ситуации, которая может даже иметь значение жизни и смерти. Сотрудничество в этом плане имеет смысл, учитывая нашу географическую близость и преимущественно общую историю."
  NOR_share_specialized_tactics_with_iceland:0 "Поделиться специальной тактикой с Исландией"
  NOR_share_specialized_tactics_with_iceland_desc:0 "Поскольку §YИсландия§! теперь больше, чем просто член альянса, а фактически автономная часть нашей страны, мы можем поделиться с ней некоторыми нашими более специализированными знаниями, такими как тактика горной войны и наш опыт ведения зимней войны. Если мы также внедрим норвежских советников в исландские силы безопасности, то они станут лучше защищать себя, а мы сможем быть уверенными в том, что Северная Атлантика защищена."
  NOR_the_kings_choice:0 "Выбор короля"
  NOR_the_kings_choice_desc:0 "Переполненный эмоциями король получил требование от нашего врага о капитуляции и создании марионеточного правительства. Король плакал, когда говорил правительству и парламенту, что отречется от престола, если они примут такие требования. Поэтому давайте ответим нашим врагам королевским \"нет\" и заставим наше правительство поддержать его позицию в борьбе за нашу независимость."
  NOR_expand_the_kings_responsibilities:0 "Расширить обязанности короля"
  NOR_expand_the_kings_responsibilities_desc:0 "Хотя монарх может иметь много обязанностей даже в королевствах с наиболее символическими монархами, передача некоторых из этих обязанностей другим членам королевской семьи или связанным с ними государственным деятелям для освобождения времени для более важных задач может быть желательной. В нашем случае, в нашей монархической стране, король может быть использован для консультирования военных или для вдохновения наших войск и граждан во время конфликтов."
  NOR_rebrand_into_the_modern_kingdom:0 "Смена имиджа на Современное королевство"
  NOR_rebrand_into_the_modern_kingdom_desc:0 "Если мы пожелаем, мы сможем снова принять современный флаг и предстать в таком виде перед миром. Хотя это потребует больших усилий от наших государственных деятелей, и ребрендинг не может проводиться часто."
  NOR_rebrand_into_the_traditional_kingdom:0 "Смена имиджа на Традиционное королевство"
  NOR_rebrand_into_the_traditional_kingdom_desc:0 "При желании мы можем принять традиционный флаг и облик древнего Королевства Норвегия. Хотя при внезапной реализации это может быть затратным для наших административных ресурсов, и это не решение, которое можно быстро отменить, но мы по-прежнему можем это сделать, если пожелаем."
  NOR_expand_the_duchy_of_icelands_administrative_duties:0 "Расширить административные обязанности Герцогства Исландии"
  NOR_expand_the_duchy_of_icelands_administrative_duties_desc:0 "Управляя расширенным королевством, может быть разумным позволить нашему автономному Герцогству Исландия управлять Гренландией, большим островом в их окрестностях, с которым они исторически знакомы. Это должно освободить нас, чтобы сосредоточиться на других театрах военных действий и даже может улучшить долгосрочное развитие Гренландии."
  ## Иностранная поддержка (военные меры)
  NOR_petition_the_british_for_an_alliance:0 "Просить Британцев о союзе"
  NOR_petition_the_british_for_an_alliance_desc:0 "Вооруженного нейтралитета было недостаточно, чтобы удержать войну от наших земель, поэтому наш лучший выход может заключаться в том, чтобы искать общую почву с врагами нашего врага. Союз с Британией может быть нашим лучшим выходом."
  NOR_petition_the_french_for_an_alliance:0 "Просить Французов о союзе"
  NOR_petition_the_french_for_an_alliance_desc:0 "Вооруженный нейтралитет оказался недостаточным, чтобы уберечь наши земли от войны. Поэтому нашим наилучшим вариантом может быть поиск точек соприкосновения с врагами нашего врага. Союз с французами может быть нашим наилучшим решением."
  NOR_petition_the_germans_for_an_alliance:0 "Обратиться к немцам с предложением о союзе"
  NOR_petition_the_germans_for_an_alliance_desc:0 "Вооруженный нейтралитет оказался недостаточным, чтобы уберечь наши земли от войны. Поэтому нашим наилучшим вариантом может быть поиск точек соприкосновения с врагами нашего врага. Союз с немцами может быть нашим наилучшим решением."
  NOR_petition_the_russians_for_an_alliance:0 "Обратиться к русским с предложением о союзе"
  NOR_petition_the_russians_for_an_alliance_desc:0 "Вооруженный нейтралитет оказался недостаточным, чтобы уберечь наши земли от войны. Поэтому нашим наилучшим вариантом может быть поиск точек соприкосновения с врагами нашего врага. Союз с русскими может быть нашим наилучшим решением."
  NOR_petition_the_americans_for_an_alliance:0 "Обратиться к американцам с предложением о союзе"
  NOR_petition_the_americans_for_an_alliance_desc:0 "Вооруженный нейтралитет оказался недостаточным, чтобы уберечь наши земли от войны. Поэтому нашим наилучшим вариантом может быть поиск точек соприкосновения с врагами нашего врага. Союз с американцами может быть нашим наилучшим решением."
  NOR_initiate_cooperation_with_the_british:0 "Начать сотрудничество с британцами"
  NOR_initiate_cooperation_with_the_british_desc:0 "Находясь в союзе с Великобританией, было бы хорошей идеей искать более тесное сотрудничество в вопросах связи, транспорта и, конечно же, войны."
  NOR_initiate_cooperation_with_the_germans:0 "Инициировать сотрудничество с немцами"
  NOR_initiate_cooperation_with_the_germans_desc:0 "Находясь в союзе с Германией, было бы хорошей идеей искать более тесное сотрудничество в вопросах связи, транспорта и, конечно же, войны."
  NOR_initiate_cooperation_with_the_russians:0 "Инициировать сотрудничество с русскими"
  NOR_initiate_cooperation_with_the_russians_desc:0 "Находясь в союзе с Россией, было бы хорошей идеей искать более тесное сотрудничество в вопросах связи, транспорта и, конечно же, войны."
