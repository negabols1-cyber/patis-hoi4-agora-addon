  NOR_northern_lights:0 "Северное сияние" ### Разнообразное использование, для общих северных фракций (особенно демократических, фашистских). Северные фракции с таким же названием могут быть созданы другими северными странами, и лучше всего избегать создания нескольких фракций с одинаковым названием.
  NOR_nordic_assembly:0 "Северная ассамблея" ### Далее будут использоваться общие названия фракций для разнообразного использования (демократического, фашистского и т. д.)
