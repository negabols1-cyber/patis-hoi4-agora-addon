 ####--Decisions--####
 ##monarchist politics
  NOR_monarchism_on_the_rise:0 "В Норвегии растёт поддержка монархии"
  NOR_monarchism_on_the_rise_desc:0 "Политические деятели начали выступать в поддержку традиционных ценностей и монархии, находя всё большую поддержку среди населения. Возвращение к безопасному и надёжному прошлому требует лишь выбора пути, мирного или иного."
  NOR_prepare_for_monarchist_civil_war:0 "Подготовка к гражданской войне"
  NOR_prepare_for_monarchist_civil_war_desc:0 "Нет времени ждать, пока взгляды жителей [Root.GetName] постепенно изменятся. Ради их же блага мы должны форсировать процесс, даже если некоторые при этом погибнут."
  NOR_expand_civil_monarchism_support:0 "Расширение поддержки монархии в обществе"
  NOR_expand_civil_monarchism_support_desc:0 "Необходимо расширить поддержку среди жителей [Root.GetName], даже если это приведёт к дестабилизации общества."
  NOR_ensure_command_loyalty_for_monarchist_civil_war:0 "Обеспечение лояльности командования в случае гражданской войны"
  NOR_ensure_command_loyalty_for_monarchist_civil_war_desc:0 "Многие из наших командиров, вероятно, поддерживают традиционалистские ценности и хотят способствовать их внедрению в обществе. Мы должны связаться с каждым и обеспечить его лояльность на случай возникновения внутреннего конфликта."
  NOR_ensure_command_loyalty_for_monarchist_civil_war_tt:0 "Обеспечивает лояльность наших §Yкомандиров армии§! и §Yкомандиров флота§! в случае §RГражданской войны§! за §YМонархию§!.\n"
  NOR_preliminary_monarchist_armament_industry:0 "Предварительная индустрия вооружения лоялистов"
  NOR_preliminary_monarchist_armament_industry_desc:0 "Подготовка ограниченного количества §Yпромышленных вооружений§! в наших государствах, лояльных монархизму.\n"
  NOR_open_up_political_discourse_monarchism:0 "Открытый политический диалог о монархии"
  NOR_open_up_political_discourse_monarchism_desc:0 "Мы должны сделать терпимым принятие различных точек зрения в правительстве. Возможно, со временем это позволит мирным путем изменить политику в нашей стране."
  NOR_discredit_government_monarchism:0 "Опорочить правительство"
  NOR_discredit_government_monarchism_desc:0 "Указывая на многочисленные недостатки нашего действующего правительства, мы можем заставить людей задуматься об идеологических причинах этих провалов."
  NOR_ignite_the_monarchist_civil_war:0 "Начать монархическую гражданскую войну"
  NOR_ignite_the_monarchist_civil_war_desc:0 "Пришло время окунуться в дело с головой. Все приготовления, которые мы считали необходимыми, сделаны. Обратного пути нет. \"За Отечество!\""
  ##norwegian land reintegration
  NOR_land_reintegration:0 "Воссоединение норвежских земель"
  NOR_land_reintegration_desc:0 "Норвежское королевство некогда простиралось по всей Северной Европе, но войны и договоры лишили королевство некоторых его исторических земель. Швеция, Дания и, в меньшей степени, Соединенное Королевство, удерживают «справедливую» долю этих бывших островов, титулов, ландшафтов и приграничных районов. Тем не менее, пока еще не стоит терять надежду...\n\nЕсли нам снова удастся завладеть какой-либо из этих территорий, то современное норвежское государство окажется в выгодном положении, чтобы реинтегрировать их, с помощью устойчивой экономики и множества квалифицированных государственных деятелей. Таким образом, восстановление части нашего славного прошлого вполне возможно."
  NOR_reintegrate_faeroeyane:0 "Реинтегрировать Фарерские острова"
  NOR_fully_incorporate_faeroeyane:0 "Полностью присоединить Фарерские острова"
  NOR_reintegrate_island:0 "Реинтегрировать Исландию"
  NOR_fully_incorporate_island:0 "Полностью присоединить Исландию"
  NOR_reintegrate_groenland:0 "Реинтегрировать Гренландию"
  NOR_fully_incorporate_groenland:0 "Полностью присоединить Гренландию"
  NOR_reintegrate_jamtland:0 "Реинтегрировать Емтланд"
  NOR_fully_incorporate_jamtland:0 "Полностью присоединить Емтланд"
  NOR_reintegrate_baahuslen:0 "Реинтегрировать Бохуслен"
  NOR_fully_incorporate_baahuslen:0 "Полностью присоединить Бохуслен"
  NOR_reintegrate_hjaltland:0 "Реинтегрировать Шетландские острова"
  NOR_fully_incorporate_hjaltland:0 "Полностью присоединить Шетландские острова"
  NOR_reintegrate_orknoeyane:0 "Реинтегрировать Оркнейские острова"
  NOR_fully_incorporate_orknoeyane:0 "Полностью присоединить Оркнейские острова"
  NOR_recreate_the_kingdom_of_the_isles:0 "Восстановить Королевство островов"
  NOR_recreate_the_kingdom_of_the_isles_desc:0 "Захватив контроль над Гебридами и Хайлендом, мы могли бы попытаться создать зависимое государство, основанное на старом Королевстве островов. Под нашим правлением они станут автономным герцогством, поддерживающим норвежско-гэльские связи, как средство привязки к нам населения.\n\nХотя это потребует усилий и ресурсов, для нас может быть выгодно управлять этим районом косвенно, через местных лордов, землевладельцев и политиков."
  NOR_lords_of_the_isles_propaganda_aberdeenshire:0 "Распространить пропаганду о лордах островов в Абердиншире"
  NOR_lords_of_the_isles_propaganda_aberdeenshire_desc:0 "Продвигая не только норвежско-гэльские связи, но и связи с горцами, мы могли бы интегрировать горцев Абердиншира в наше зависимое государство, [LOI.GetNameDef]. С этим у них появится более значительная база населения для набора войск, и наша лояльная база на Британских островах значительно увеличится."
  ##partisan operations
  NOR_partisan_operations:0 "Партизанские операции"
  NOR_partisan_operations_desc:0 "Пока враг оккупирует норвежскую территорию, мы могли бы заслать наших обученных коммандос и партизан, чтобы они проникли на оккупированные территории и саботировали военные действия нашего противника."
  NOR_gather_intelligence:0 "Собрать разведданные о противнике"
  NOR_spread_resistance_sentiment:0 "Распространить настроения сопротивления"
  NOR_plan_the_vemork_heavy_water_sabotage:0 "Планирование диверсии на заводе тяжелой воды Vemork"
  NOR_execute_the_vemork_heavy_water_sabotage:0 "Осуществление диверсии на заводе тяжелой воды Vemork"
  NOR_replan_the_vemork_heavy_water_sabotage:0 "Перепланирование диверсии на заводе тяжелой воды Vemork"
  NOR_plan_the_bombing_of_german_transport_ships:0 "Планирование бомбардировки германских транспортных судов"
  NOR_execute_the_bombing_of_german_transport_ships:0 "Осуществление бомбардировки германских транспортных судов"
