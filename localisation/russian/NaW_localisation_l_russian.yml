  #NOR_GATHERING_STORM_DESC:0 "Политически стабильная со времен обретения независимости, Норвегия пострадала от Великой депрессии и беспокоится из-за сгущающихся туч над Европой. Тем не менее, несмотря на предупреждения военных, по-прежнему действует мирная политика. Между тем экономический кризис сделал низшие классы более воинственными, побуждаемый небольшой коммунистической партией, в то время как небольшие группы националистов готовы радикально преобразовать общество.\n\n"
