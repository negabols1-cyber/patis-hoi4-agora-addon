  ####--Research Agreements--####
  NOR_nordic_research_name:0 "Североевропейское научно-исследовательское сотрудничество"
  NOR_nordic_research_desc:0 "Скандинавские страны объединились в исследовательском соглашении о совместном использовании, стремясь работать на общее благо всех скандинавских стран. Хотя в целом крепкая, существуют также некоторые ремесла, созданные скандинавскими странами, что означает, что в некоторых областях это сотрудничество может быть ведущим в мире."
  NOR_royal_norwegian_society_name:0 "Королевское норвежское общество"
  NOR_royal_norwegian_society_desc:0 "Королевское норвежское общество пригласило другие страны-единомышленники к всестороннему сотрудничеству в области науки и технологий. С благословения норвежского монарха наши исследовательские усилия стали более престижными, чем когда-либо прежде."
  NOR_allied_research_name:0 "Сотрудничество союзников в области исследований"
  NOR_allied_research_desc:0 "Трансокеанское исследовательское сотрудничество с британцами должно принести пользу всем и особенно помочь малым союзникам встать на ноги."
  NOR_german_research_name:0 "Немецкое исследовательское сотрудничество"
  NOR_german_research_desc:0 "Сотрудничество с главной промышленной державой Центральной Европы, Германией, должно помочь каждому участнику довести свои технологии и оборудование до современных стандартов."
  NOR_soviet_research_name:0 "Советское научно-исследовательское сотрудничество"
  NOR_soviet_research_desc:0 "Советы, располагающиеся на Востоке Европы и Севере Азии, будучи крупной и многогранной страной, и сами разработали некоторые технологии, а в целом являются сильным лидером в области сотрудничества в области исследований, которому могут поучиться почти все страны."

  ####--Уникальные технологии--####
  NOR_mountain_tactics:0 "Тактика лыжной пехоты"
  NOR_mountain_tactics_desc:0 "Норвежская тактика в условиях высокогорья и холодной погоды подразумевает неожиданные атаки лыжной пехоты и использование сложного рельефа для укрытия или обзора в случае необходимости.\n\nНаши подразделения могут использовать это, чтобы двигаться быстрее и наносить более сильные удары на горной местности!"
  NOR_concealed_skirmishers:0 "Замаскированные стрелки"
  NOR_concealed_skirmishers_desc:0 "По мере того, как враг продвигается, наши стрелки могут осыпать его меткими выстрелами из винтовок и пулеметов с замаскированных позиций, заставляя противника остановиться. Пока враг готовится к контратаке, наши стрелки могут снова уйти."

