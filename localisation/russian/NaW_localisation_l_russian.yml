l_russian:
  ef_norwegian_focus:0 "Норвежский национальный фокус"
  ####--Фокусы--####
  ##уникальные фильтры поиска
  FOCUS_FILTER_NAW_UNIQUE_TACTICS:0 "Уникальные тактики и технологии"
  ##общие всплывающие подсказки
  NOR_wip_tt:0 "\n§RРАБОТА В ПРОЦЕССЕ§! - Полная функциональность для этого §Yфокуса§! еще не реализована. Пока что выберите другой путь, так как этот фокус имеет, в лучшем случае, частичную функциональность.\n"
  NOR_wip_light_tt:0 "\n§RРАБОТА В ПРОЦЕССЕ§! - В этот §Yфокус§! добавлена достаточно базовая функциональность, но он еще не до конца проработан, как задумывалось. Тем не менее, фокус можно выбрать без проблем, и в него добавлен игровой процесс.\n"
  NOR_enable_puppet_states_tt:0 "Разрешает создание §Yмарионеточных государств§! на мирных конференциях.\n"
  NOR_icelandic_subject_benefits_tt:0 "\nЕсли §YИсландия§! существует как автономный §Yподчиненный§! или как один из наших §Yчленов фракции§!, они также получат выгоду от этой политики.\n\n"
  NOR_political_advisor_needed_tt:0 "\nДля завершения перехода к новой §Yформе правления§!, будь то путем выборов, референдума или силой, потребуется §Yполитический советник§!.\n\n"
  NOR_new_commanders_enabled_tt:0 "\nПо завершении будут активированы новые §Yкомандиры§! для службы на поле боя.\n"
  NOR_enable_british_naval_procurements_tt:0 "\nСоглашение с британцами позволит принять §Yрешения§! о закупке изготовленных в Великобритании §Yкораблей§! и §Yподводных лодок§! для норвежского флота.\n"
  NOR_enable_german_naval_procurements_tt:0 "\nЗаключив соглашение с немцами, можно получить возможность §Yпринимать решения§! по закупке §Yкораблей§! и §Yподлодок§! немецкого производства для норвежского флота.\n"
  NOR_cosmetic_tag_enabled_tt:0 "\nПозволяет переключиться на внешний вид традиционного, средневекового §Yкоролевства Норвегии§! за солидную цену. Подумайте над этим выбором как следует, поскольку помимо изменения внешнего вида никаких преимуществ не будет.\n"
  NOR_cosmetic_tag_switch_tt:0 "\nПереключается на внешний вид традиционного, средневекового §Yкоролевства Норвегии§!. Поскольку момент для этого подходящий, тут действует мощная §Годнократная скидка§!, и только тут..."
  #r56 tooltips
  NOR_not_making_faction_warning_tt:0 "§RВнимание! Выбор этой опции заблокирует фокусы \"Подхода\", поскольку для них требуется создать фракцию и стать ее лидером.§!\n"
  ##naval
  NOR_encourage_fishing:0 "Поощрять рыболовство"
  NOR_encourage_fishing_desc:0 "Мы можем улучшить экономику, поощряя использование нашего протяженного побережья и богатых рыболовных угодий в его окрестностях."
  NOR_establish_nortraship:0 "Создать Nortraship"
  NOR_establish_nortraship_desc:0 "У норвежских судовладельцев сотни современных торговых судов, перевозящих грузы по всему миру. Мы должны создать государственную организацию, которая будет командовать этими кораблями и распоряжаться ими в случае необходимости."
  NOR_establish_nortraship_tt:0 "\nС образованием §YNortraship§! у нас появится не только возможность осуществления прямого контроля над нашим торговым флотом, но и потенциальная возможность передать контроль над ним важным союзникам.\n"
  NOR_landing_crafts:0 "Десантные суда Nortraship"
  NOR_landing_crafts_desc:0 "Nortraship и наши устоявшиеся морские компании разрабатывают новые десантные суда для наших войск. Военно-морской флот рассматривает возможность создания специальных подразделений для использования таких судов."
  NOR_navy:0 "Развитие флота"
  NOR_navy_desc:0 "Флот всегда был силой Норвегии. Нам не следует пренебрегать этим великим наследием."
  NOR_nortraship_production_incentives:0 "Стимулирование производства Nortraship"
  NOR_nortraship_production_incentives_desc:0 "Торговые суда и конвои сами по себе беззащитны. Поэтому мы должны стимулировать военно-морское производство и, возможно, привлечь судостроителей, специализирующихся на потребностях нашего торгового флота."
  NOR_coastal_defense_specialization:0 "Специализация в области береговой обороны"
  NOR_coastal_defense_specialization_desc:0 "Сконцентрировав усилия нашей хорошо зарекомендовавшей себя военно-морской промышленности и норвежского военно-морского флота, мы могли бы разработать проекты кораблей и тактику, разработанные специально для нужд Норвегии. Скорее всего, это будет флот береговой обороны, способный как поддерживать сухопутные войска вдоль побережья, так и совершать ограниченные операции типа ударов и отходов в открытом море."
  NOR_naval_conferences:0 "Военно-морские конференции"
  NOR_naval_conferences_desc:0 "Вместе с другими союзными морскими державами проведение военно-морских конференций может дать нам последние знания, необходимые для дальнейшего улучшения эффективности наших адмиралов в море. Мы возьмем на себя инициативу, чтобы начать."
  NOR_escorts:0 "Современные корабли сопровождения"
  NOR_escorts_desc:0 "Учитывая наш большой торговый флот, мы должны использовать современные корабли сопровождения для защиты от возможных налетов."
  NOR_submarines:0 "Развитие подводных лодок"
  NOR_submarines_desc:0 "Подводные лодки отлично подходят для патрулирования наших берегов незаметно. Давайте в полной мере используем возможности современных подводных лодок."
  NOR_develop_naval_tactics:0 "Продолжить наследие Торденшельда"
  NOR_develop_naval_tactics_desc:0 "Смелая и изобретательная военно-морская тактика отметила карьеру нашего национального героя, вице-адмирала Петера Весселя Торденшельда. Как он доказал, инновации и умная тактика в море могут выигрывать сражения и даже войны. Давайте чтить это наследие."
  NOR_capital_ships:0 "Крупные корабли"
  NOR_capital_ships_desc:0 "Мы должны подумать о том, чтобы построить собственные крупные корабли для поддержки наших легких кораблей сопровождения. Улучшение наших производственных мощностей должно позволить нам производить эти современные крупные корабли без проблем."
  NOR_capital_ships_tt:0 "\nБудет разблокирована улучшенная версия §YHorten Naval Yard§!. \nЕсли у вас в настоящее время есть §YShip Designer§!, то этот фокус §Gбесплатно переключится на обновленную версию§!. \n\n"
  NOR_naval_equipment:0 "Морское оборудование"
  NOR_naval_equipment_desc:0 "Модернизация нашего военно-морского оборудования имеет важное значение для обеспечения нашему флоту возможности противостоять крупным державам. И хотя современный корпус спроектирован так, чтобы быть быстрым и прочным, это всего лишь кусок дрейфующего металла без надлежащих орудий, снарядов и систем управления."
  NOR_navy_wing:0 "Военно-морское крыло"
  NOR_navy_wing_desc:0 "Давайте продолжим развивать наше военно-морское крыло, чтобы оно могло поддерживать флот при действиях вдоль побережья."
  NOR_carriers:0 "Авианосцы"
  NOR_carriers_desc:0 "Хотя наше протяженное побережье дает нашим самолетам хорошую досягаемость, флот на базе авианосцев может обеспечить еще лучшую досягаемость аэродромами, которые могут перемещаться туда, где они необходимы."
  NOR_air_bases:0 "Авиабазы"
  NOR_air_bases_desc:0 "Учитывая большие расстояния внутри нашей страны, строительство авиабаз по всей стране может быть наилучшим вариантом, если мы хотим предоставить нашим самолетам базы и топливо, необходимые для их надлежащей работы."
  NOR_merge_the_air_wings:0 "Объединить авиационные крылья"
  NOR_merge_the_air_wings_desc:0 "Учитывая наши небольшие авиационные крылья и разрозненное воздушное командование, возможно, будет лучше объединить Армейское крыло и Военно-морское крыло под одним командованием. Итак, давайте создадим третью ветвь норвежских вооруженных сил, норвежские ВВС."
  NOR_light_fighters:0 "Легкие истребители"
  NOR_light_fighters_desc:0 "Легкие истребители доступны по цене, маневренны и быстры. Они могут поддерживать войска, сражаться с вражескими самолетами и даже останавливать направленные на нас бомбардировщики."
  NOR_fortify_military_bases:0 "Укрепить наши военные базы"
  NOR_fortify_military_bases_desc:0 "Нам следует выстроить оборонительные укрепления, бункеры и зенитные установки вокруг наших военных баз, чтобы наша Армия, Флот и Воздушные силы могли оставаться в строю, при полном снаряжении."
  NOR_medium_aircraft:0 "Средняя авиация"
  NOR_medium_aircraft_desc:0 "Нам следует подумать о разработке самолётов с увеличенной дальностью полёта, чтобы мы могли защитить свои моря, действуя у берегов Норвегии."
  NOR_resurrect_norsk_aeroplanfabrik:0 "Возобновление работы Norsk Aeroplanfabrik"
  NOR_resurrect_norsk_aeroplanfabrik_desc:0 "Возобновив работу Norsk Aeroplanfabrik, отечественного авиазавода, мы сможем снизить нашу зависимость от импорта и обеспечить бесперебойные поставки новых и запасных самолётов и авиационных деталей, поставки которых в противном случае могли бы быть сорваны."
  ##army
  NOR_army:0 "Норвежская армия"
  NOR_army_desc:0 "Hæren, то есть Армия, несмотря на пренебрежение экономикой, по-прежнему обладает большим опытом и талантливыми людьми. Посмотрим, что мы можем сделать, чтобы добиться дальнейшего прогресса, даже с учётом экономических ограничений."
  NOR_army_wing:0 "Армейское крыло"
  NOR_army_wing_desc:0 "Давайте продолжим развивать наше Армейское крыло, чтобы оно могло поддерживать Армию в наземных операциях."
  NOR_ski_infantry:0 "Лыжная пехота"
  NOR_ski_infantry_desc:0 "В 1747 году в Норвегии был создан первый официальный лыжный корпус, и с тех пор в нашей Армии лыжи получили широкое распространение. Преимущества, которые даёт нашим военнослужащим это умение, особенно заметны зимой и на больших высотах."
  NOR_ski_infantry_tt:0 "\nРазблокирует §HSки-пехоту§!\n§HLанд подразделения:\n    Холмы§!: Атака: §G+5%§!\n§H    Холмы§!: Оборона: §G+5%§!\n§H    Холмы§!: Перемещение: §G+10%§!\n§H    Горы§!: Атака: §G+10%§!\n§H    Горы§!: Оборона: §G+10%§!\n§H    Горы§!: Перемещение: §G+20%§!\n§H"
  NOR_ski_battalion_tt:0 "Создает шаблон горнолыжной пехоты с §Y9 батальонами горнолыжников§! и §Y2 батальонами поддержки§!.\n"
  NOR_mountaineers:0 "Горцы"
  NOR_mountaineers_desc:0 "Хотя в нашей стране много людей, способных преодолевать горы, добавление военной специализации к этому позволит некоторым по-настоящему преуспеть в горных операциях. С такими специализированными войсками немцы нанесли ужасные поражения итальянцам во время Великой войны, доказав, что специализированные войска стоят нашего времени."
  NOR_mountaineers_tt:0 "\nТеперь мы можем развернуть §Yгорные дивизии§!.\n\n"
  NOR_urban_defenses:0 "Городская оборона"
  NOR_urban_defenses_desc:0 "Мы должны укрепить все наши важные города, чтобы защитить их от возможных вторжений. В дополнение к укреплениям вокруг избранных городов следует создать оборонительную линию от Халдена до большой реки Гломма. Такая оборонительная линия может иметь решающее значение для предотвращения угрозы городским районам внутреннего Осло-фьорда со стороны шведских пограничных районов."
  NOR_urban_defenses_tt:0 "\nРазблокирует §Yрешения§! для строительства §Yоборонительной линии Гломма-Халден§! и §Yоборонительной линии Люнген§!.\n"
  NOR_merge_jegerbataljonene:0 "Объединение егербатальонов"
  NOR_merge_jegerbataljonene_desc:0 "В самом начале 1930 года егерский полк, Jegerkorpset IR 2, был разделен на три батальона: 1. Jegerbataljon, 2. Jegerbataljon и 3. Jegerbataljon. Недавно появилась новая идея: чтобы увеличить ударную силу нашей ограниченной численности, мы должны сконцентрировать нашу мощь в более крупные воинские формирования. Для этого мы теперь объединим батальоны в новое соединение, 1. Jegerdivisjon."
  NOR_merge_jegerbataljonene_tt:0 "Получить §элитную пехотную дивизию§ в Эстланде.\n"
  NOR_continued_motorization_efforts:0 "Продолжение усилий по моторизации"
  NOR_continued_motorization_efforts_desc:0 "Хотя моторизация армии уже в некоторой степени спланирована и реализована, нам будет полезно продолжать это, чтобы более крупные части нашей армии могли быстро реагировать. Помимо транспортировки наших войск, грузовики также могут перевозить припасы и обеспечивать мобильные полевые госпитали для наших сил."
  NOR_bicycle_battalions:0 "Велосипедные батальоны"
  NOR_bicycle_battalions_desc:0 "Топливо — это не то, что достается дешево, и вместо того, чтобы рисковать тем, что наши войска будут остановлены из-за возможной нехватки топлива, использование универсального велосипеда для нашей армии может показаться разумным. Таким образом, мы должны создать новые велосипедные батальоны, чтобы улучшить возможность наших войск передвигаться по городам и сельским районам."
  NOR_armored_battalions:0 "Бронетанковые батальоны"
  NOR_armored_battalions_desc:0 "Чтобы преодолеть тупик Великой Войны, Британия и Франция разработали большие бронированные боевые машины, неуязвимые для большинства сокрушительного пулемётного огня Западного фронта. Теперь, новые тактики, двигатели, ходовая и орудия сделали эти бронемашины более мощными, чем когда-либо, поэтому мы должны попытаться догнать в этом плане великие державы, даже ценой больших топливных расходов."
  NOR_armored_battalions_tt:0 "\n\nПрограмма строительства норвежских танков, чтобы догнать великие державы Европы и Северной Америки, значительно выиграет от §Yсоюза§! с крупной страной-разработчиком танков или от участия в любой §Yгруппе по обмену технологиями§!. Предпочтительно и то, и другое.\n"
  NOR_equipment_effort:0 "Затраты на техническое оснащение"
  NOR_equipment_effort_desc:0 "Основная пехота — хребет каждой армии. Мы должны позаботиться о том, чтобы у неё всегда было лучшее снаряжение."
  NOR_encourage_recreational_shooting:0 "Поощрение любительской стрельбы"
  NOR_encourage_recreational_shooting_desc:0 "Норвегия — страна, в которой многие используют оружие для спорта и охоты. Поддержка этого должна повысить общие навыки владения оружием и выживания в нашей стране."
  NOR_encourage_recreational_shooting_tt:0 "\nЗавершение этого исследования откроет §YОсколочный обстрел§!, новую защитную тактику, использующую точный огонь из стрелкового оружия из скрытых позиций для задержки врага.\n"
  NOR_establish_heimevernet:0 "Создание Хомеверна"
  NOR_establish_heimevernet_desc:0 "Давайте создадим боевую группу, которая примет на себя первый удар иностранного вторжения. При регулярной подготовке быстро развернутое ополчение может оказаться на удивление полезным."
  NOR_fund_the_rearmament:0 "Финансирование перевооружения"
  NOR_fund_the_rearmament_desc:0 "Давайте что-то сделаем с запущенностью и нехваткой ресурсов, от которых страдают наши вооруженные силы."
  NOR_fund_the_rearmament_tt:0 "Некоторые из наших командиров станут доступны как теоретики!."
  NOR_a_serious_defense_budget:0 "Серьезный оборонный бюджет"
  NOR_a_serious_defense_budget_desc:0 "Дополнительное увеличение расходов должно гарантировать, что наши силы будут готовы к худшему."
  ##economy
  NOR_armament_investments:0 "Начальные инвестиции в вооружение"
  NOR_armament_investments_desc:0 "Давайте начнем перевооружение, направив часть средств на внутреннее производство вооружений."
  NOR_armament_investments_2:0 "Продолжить расширение производства вооружения"
  NOR_armament_investments_2_desc:0 "Давайте продолжим расширять наши оружейные заводы и диверсифицировать наше производство оружия, теперь, когда был сделан первоначальный толчок."
  NOR_armament_investments_3:0 "Создание военно-промышленных парков"
  NOR_armament_investments_3_desc:0 "Создавая крупные промышленные парки для обеспечения внутренней производственной цепочки от самого маленького болта или пули до самого большого автомобиля или корабля, мы можем создать процветающую военную промышленность."
  NOR_kongsberg_research:0 "Исследования Конгсберга"
  NOR_kongsberg_research_desc:0 "Наши разработчики вооружений в Конгсберге теперь могут расширить свое исследовательское крыло за счет дополнительного финансирования. Это должно помочь нам идти в ногу с современными разработками."
  NOR_de_norske_statsbaner:0 "De norske Statsbaner"
  NOR_de_norske_statsbaner_desc:0 "De norske Statsbaner, Норвежские государственные железные дороги, были основаны в 1883 году как объединенная государственная компания для всех железных дорог, открытых с 1861 года. Финансирование дальнейших железнодорожных проектов в южной Норвегии может принести долгосрочные выгоды для экономики."
  NOR_nordlandsbanen:0 "Завершить строительство линии Нордланд"
  NOR_nordlandsbanen_desc:0 "Линия Нордланд, Nordlandsbanen, была постоянным проектом норвежских государственных железных дорог с 1920-х годов. Финансируя строительство этих железных дорог, мы можем ускорить этот процесс и соединить наши малонаселенные, но богатые ресурсами северные округа с остальной частью страны."
  NOR_railroad_development_add_2_tt:0 "\nВыполнение этого добавит §G2§! §YРазвитие железных дорог§!."
  NOR_norsk_jernverk:0 "A/S Norsk Jernverk"
  NOR_norsk_jernverk_desc:0 "Давайте создадим общую компанию, чтобы обеспечить нас железом, сталью и другими металлами."
  NOR_expand_domestic_steel_production:0 "Расширить внутреннее производство стали"
  NOR_expand_domestic_steel_production_desc:0 "Мы должны предложить Norsk Jernverk расширить наше внутреннее производство стали с помощью новых рудников и металлургических заводов с использованием современных технологий."
  NOR_access_the_small_deposits:0 "Добыть небольшие месторождения"
  NOR_access_the_small_deposits_desc:0 "Хотя они и не достаточно велики, чтобы гарантировать прибыльную эксплуатацию, месторождения в Южной Норвегии могут быть использованы в крайнем случае."
  NOR_statmin:0 "Статмин"
  NOR_statmin_desc:0 "Объединение всех горнодобывающих компаний под крылом одной головной компании позволит им обмениваться знаниями и опытом."
  NOR_lumber_industries:0 "Развивать лесозаготовительную промышленность"
  NOR_lumber_industries_desc:0 "Лес есть по всей нашей стране, и это стало одним из факторов, способствовавших тому, что к началу Великой войны Норвегия стала довольно процветающей страной. Так что давайте расширим эту прибыльную отрасль. Кто знает, может быть, однажды норвежская компания станет ведущим мировым производителем бумаги? Мечтать ведь не вредно."
  NOR_invest_in_district_industries:0 "Инвестиции в районные отрасли промышленности"
  NOR_invest_in_district_industries_desc:0 "Давайте вложимся в наши районы и сельские территории. Местные производители и услуги позволят нашему народу использовать каждый уголок и закоулок страны."
  NOR_nth:0 "НТИ"
  NOR_nth_desc:0 "Большая часть нашего национального опыта сосредоточена в Норвежском технологическом институте в Тронхейме. Поддерживая и финансируя это высшее учебное заведение, мы можем процветать. Может быть, со временем мы сможем даже превратить его в университет?"
  NOR_tungtvann:0 "Инвестировать в объекты тяжелой воды"
  NOR_tungtvann_desc:0 "В то время как промышленные предприятия и исследовательские лаборатории Norsk Hydro в Вемарке и Рьюкане уже снабжают нас электроэнергией и полезными химикатами, излишки тяжелой воды, которые они производят, также должны помочь нам продвинуться в неисследованных областях науки. Может быть, у этого есть даже возможная военное применение? Однако об этом, вероятно, не стоит думать."
  NOR_norsk_hydro_focus:0 "Norsk Hydro"
  NOR_norsk_hydro_focus_desc:0 "Компания Norsk Hydro является пионером в области науки и промышленности Норвегии, принимая участие в таких разнообразных (хотя и связанных) областях, как электроэнергетика, химия, производство удобрений и тяжелой воды."
  NOR_hydroelectric_power_generation:0 "Производство электроэнергии на гидроэлектростанциях"
  NOR_hydroelectric_power_generation_desc:0 "В то время как с 1890-х годов мы уже построили множество гидроэлектростанций, в том числе некоторые из которых в то время были одними из крупнейших в мире, есть еще потенциал для строительства новых, увеличения выработки электроэнергии, обеспечивая современный комфорт для нашего народа и даже развития нашей тяжелой промышленности. Чего мы еще ждем?"
  NOR_expanded_aluminium_production:0 "Расширение производства алюминия"
  NOR_expanded_aluminium_production_desc:0 "Мы должны использовать излишки энергии с наших гидроэлектростанций, чтобы обеспечить и расширить наши алюминиевые заводы. Это уже было сделано с большим успехом в Хоянгире Norsk Aluminium Co."
  ##political
  NOR_til_dovre_faller:0 "Едины и верны до тех пор, пока не падет Довре"
  NOR_til_dovre_faller_desc:0 "Объединенные и верные, пока не рухнут горы Дювре. Эти слова произнесли наши предки, когда была написана Конституция 1814 года. Какой бы путь мы ни выбрали, Норвегия была и останется страной, построенной благодаря совместным усилиям единого народа и единой воли."
  ##democratic branch
  NOR_affirm_constitutional_monarchy:0 "Утвердить конституционную монархию"
  NOR_affirm_constitutional_monarchy_desc:0 "Утверждая нашу нынешнюю смесь старого и нового, мы можем быть уверены, что Hans Majestet Kongens Garde, Королевская гвардия Его Величества, всегда будет готова взяться за оружие, чтобы защитить своего короля и вдохновлять наш народ. Безопасность людей как высокого, так и низкого сословия имеет первостепенное значение для любого государства, достойного этого звания."
  NOR_continuous_politics:0 "Непрерывная политика"
  NOR_continuous_politics_desc:0 "Давайте дадим нашему нынешнему правительству постоянное доверие в их политическом курсе. В конце концов, эта страна построена на взаимном доверии."
  NOR_continuous_politics_tt:0 "\nПозволяет §Yрешению§! завершить программы социального обеспечения правительства Нюгорсволда, направленные на борьбу с Великой депрессией и ее последствиями.\n\n"
  NOR_change_starts_within:0 "Изменения начинаются изнутри..."
  NOR_change_starts_within_desc:0 "Вместо того, чтобы продолжать наш рискованный путь или отстранить правительство, мы могли бы провести некоторые внутренние изменения, поменять людей местами и пригласить людей из других партий для сотрудничества и предоставления консультаций. Сдвиг в сторону более умеренной политики Партии фермеров, а не политики Лейбористской партии, мог бы нам в этом помочь."
  NOR_motion_of_no_confidence:0 "Вотум недоверия"
  NOR_motion_of_no_confidence_desc:0 "Правительство продемонстрировало свою слепоту к растущей напряженности в остальном мире. Необходим новый курс."
  NOR_seek_a_british_alliance:0 "Добиться британского союза"
  NOR_seek_a_british_alliance_desc:0 "Давайте вступим в союз с Британской империей. Обладание силой Королевского флота на нашей стороне должно сдержать многих нападающих, и благодаря нашим тесным историческим связям наши шансы на успех должны быть хорошими."
  NOR_allied_technology_sharing:0 "Совместное использование технологий"
  NOR_allied_technology_sharing_desc:0 "Давайте расширим наше сотрудничество с Британской империей и Британским Содружеством в рамках соглашения о проведении исследований для взаимной выгоды."
  NOR_allied_technology_sharing_tt:0 "Пригласите [ENG.GetNameDef] для формирования §Yгруппы по совместному использованию технологий§! с нами.\n\nОчень §Gхорошие отношения§!, вероятно, обеспечат их принятие."
  NOR_expand_allied_technology_sharing:0 "Расширение совместного использования технологий"
  NOR_expand_allied_technology_sharing_desc:0 "Пригласите британских экспертов для помощи в наших исследованиях."
  NOR_delegate_control_of_the_merchant_fleet:0 "Делегирование контроля торгового флота"
  NOR_delegate_control_of_the_merchant_fleet_desc:0 "Учитывая, что сейчас мы воюем с Великобританией, возможно, настало время заключить с ними сделку о делегировании нашего большого торгового флота. Для нас ключевым моментом является то, чтобы наша судоходная отрасль оставалась конкурентоспособной после того, как победа будет обеспечена, а наши моряки получали достойную зарплату. При этом британцы могли бы позволить нам закупать малые боевые корабли и подводные лодки со скидкой в обмен на это."
  NOR_north_atlantic_defense_focus:0 "Инициатива по обороне Северной Атлантики"
  NOR_north_atlantic_defense_focus_desc:0 "Предложив инициативу по обороне Северной Атлантики, мы могли бы гарантировать, что берега наших союзников по Северной Атлантике и наши собственные будут в безопасности как от вторжения, так и от прерывания торговли. Объединенное верховное командование и военные учения также пойдут на пользу нашим армиям, хотя, возможно, нашей армии больше, из-за несоответствия в силе."
  NOR_north_atlantic_defense_focus_tt:0 "Формирует §YИнициативу по обороне Северной Атлантики§! со странами Содружества Северной Атлантики. Тесное сотрудничество и объединенное верховное командование должны способствовать улучшению показателей войск и командующих союзников с течением времени, поскольку они учатся у своих союзников. По мере того, как наши союзники присоединяются к этому соглашению, они также могут быть вдохновлены на перевооружение, как и мы.\n\nВ зависимости от того, какую политику перевооружения мы выбрали ранее, наша политика обороны Северной Атлантики может несколько варьироваться.\n\n"
  NOR_american_military_support:0 "Просить американскую военную поддержку"
  NOR_american_military_support_desc:0 "Теперь, когда Соединенные Штаты стали нашим союзником, мы можем просить некоторую военную поддержку у их экспертов. Учитывая их обширные ресурсы, они наверняка могут нас многому научить, а более сильный союзник будет им полезен взамен."
  NOR_british_military_support:0 "Просить британскую военную поддержку"
  NOR_british_military_support_desc:0 "Теперь, когда Соединенное Королевство стало нашим союзником, мы можем просить некоторую военную поддержку у их экспертов. Учитывая их ресурсы и военный опыт, они наверняка могут нас многому научить, а более сильный союзник будет им полезен взамен."
  NOR_request_allied_favors:0 "Просить одолжений у союзников"
  NOR_request_allied_favors_desc:0 "Хотя мы и не являемся крупной державой, наш торговый флот, региональная военно-морская мощь, возможности военно-морской базы, а также помощь в сборе разведданных и активном движении сопротивления приносят пользу нашим союзникам. Имея это в виду, мы могли бы попросить кое-каких одолжений для себя в обмен на этот вклад."
  NOR_request_allied_favors_tt:0 "Это позволяет получить от ваших союзников §YПромышленность за пределами карты§!, §YРабочую силу§!, §YСнаряжение§! и многое другое.\n"
  NOR_a_beacon_among_democracies:0 "Маяк среди демократий"
  NOR_a_beacon_among_democracies_desc:0 "Война вновь принесла большие страдания в Европу и за ее пределы. Возможно, пришло время для создания новых международных организаций, глобальной торговли и международных отношений, чтобы исключить в будущем крупномасштабные войны раз и навсегда. Если такая цель достижима, почему бы нам не стремиться к ней? Будучи стабильной демократией, мы можем проложить путь к демократизации и гуманитарной деятельности, если пожелаем."
  NOR_revise_the_treaty_of_kiel:0 "Пересмотреть Кильский договор"
  NOR_revise_the_treaty_of_kiel_desc:0 "Учитывая, что мы, наряду с [DEN.GetName], вступили в войну, и если бы мы могли оказаться полезны великим державам, нам сейчас открывается амбициозный политический ход. Возможно, мы сможем убедить наших союзников пересмотреть Кильский договор, заключенный после наполеоновских войн, по которому Дания получила острова, которые ранее были неотъемлемой частью Королевства Норвегия, а именно Фарерские острова, Исландию и Гренландию. Это справедливо."
  NOR_revise_the_treaty_of_kiel_tt:0 "§Y[ROOT.GetName]§!: у §Y[DEN.GetName]§! ниже легитимность §YЛегитимность§!"
  NOR_armed_neutrality_once_more:0 "Опять вооруженный нейтралитет"
  NOR_armed_neutrality_once_more_desc:0 "Многие политики и государственные деятели считают, что наилучший курс действий против надвигающихся конфликтов — продолжать соблюдать вооружённый нейтралитет времён Великой войны в случае, если конфликт вновь разразится в Европе. С достойной армией мы сможем удержать атакующих и, в случае нападения, мы всегда сможем объединить усилия с противниками наших потенциальных захватчиков..."
  NOR_armed_neutrality_once_more_tt:0 "\nПопытайтесь сохранить нейтралитет [Root.GetNameDef]. Если какой-либо агрессор нарушит наш §Yнейтралитет§!, фокус \"Вооруженный нейтралитет\" позволит принять §Yрешения§! с целью обратиться к великим державам с предложением союзов.\n\n"
  NOR_three_brothers:0 "Три брата"
  NOR_three_brothers_desc:0 "В шестом куплете нашего национального гимна мы поём о трёх братьях. Давайте воплотим наши песни в жизнь и создадим альянс со Швецией и Данией, панскандинавизм заслуживает возрождения."
  NOR_three_brothers_tt:0 "\nДругие страны соглашаются присоединиться к нашей фракции, если с ними плохие отношения, но хорошие отношения практически гарантируют их вступление.\n"
  NOR_nordic_technology_sharing:0 "Распространение технологий Северных стран"
  NOR_nordic_technology_sharing_desc:0 "Давайте расширим наше сотрудничество с соседями с помощью исследовательского соглашения. Наши тесные связи, похожие экономические модели и близкие культуры должны сделать такое сотрудничество более управляемым."
  NOR_nordic_technology_sharing_tt:0 "Пригласить [DEN.GetNameDef] и [SWE.GetNameDef] к участию в группе по обмену технологиями§Y§! с нами.\n\nВероятно, наличие§G хороших отношений§! позволит добиться их согласия.\n\n"
  NOR_expand_nordic_technology_sharing:0 "Расширение обмена технологиями между скандинавскими странами"
  NOR_expand_nordic_technology_sharing_desc:0 "Пригласить специалистов из соседних стран для помощи в наших исследованиях и дальнейшего расширения обмена технологиями."
  NOR_expand_nordic_technology_sharing_tt:0 "\nДает §Yбонусы к исследованиям§! Норвегии и ее союзникам.\nКоличество §Yбонусов к исследованиям§! увеличивается с увеличением количества стран в нашей фракции.\n\n"
  NOR_fourth_brother:0 "Четвертый брат"
  NOR_fourth_brother_desc:0 "Хотя Финляндия не упоминается в гимне, мы должны включить ее из-за ее исторических связей со Скандинавией, ее схожей культуры и ее восхитительного общества. Панскандинавизм теперь уступает место паннордизму. Что это означает для Эстонии, пока неизвестно."
  NOR_fourth_brother_tt:0 "\nУхудшение отношений с другими странами, желающими присоединиться к нашей фракции, снижает вероятность их присоединения, в то время как хорошие отношения практически гарантируют их вступление.\n"
  NOR_invite_finland:0 "Пригласить Финляндию"
  NOR_invite_finland_desc:0 "Присутствие Финляндии в нашей фракции, безусловно, сделало бы целесообразным ее участие в нашем исследовательском соглашении. Их схожая культура, но при этом различающиеся ландшафт, соседи и дипломатическая ситуация должны дать им уникальную возможность оценить то, чему следует отдать приоритет."
  NOR_invite_finland_tt:0 "Пригласить Финляндию присоединиться к нам в §YНаучное сотрудничество Северных Стран§!.\n\nОчень §Gхорошие отношения§! в конечном итоге могут обеспечить принятие.\n\n"
  NOR_the_dano-norwegian_deal:0 "Датско-норвежское соглашение"
  NOR_the_dano-norwegian_deal_desc:0 "Давайте предложим обмен с датчанами, в ходе которого старые острова, Фареры и Исландия, будут возвращены нам в обмен на отказ от наших претензий на Гренландию и поддержку датской претензии на Шлезвиг-Гольштейн, если они будут в состоянии завоевать его."
  NOR_the_dano-norwegian_deal_tt:0 "\nЧтобы §Yпередача земель§! и §Y[DEN.GetAdjective]§! в Шлезвиг-Гольштейн вступили в силу, §Y[DEN.GetNameDef]§! должен согласиться с нашим предложением. Улучшение отношений вероятно приведет здесь к улучшению результатов.\n\n"
  NOR_the_fennoscandian_deal:0 "Фенноскандинавская сделка"
  NOR_the_fennoscandian_deal_desc:0 "Со Швецией и Финляндией в альянсе прагматики из всех трех стран достигли секретного соглашения о переносе границ всех трех фенноскандинавских стран на восток и обеспечении восточной границы Финляндии. Швеция передает Норвегии ранее норвежский Богуслен, Финляндия отказывается от Аландской конвенции, и если вероятная советская атака будет отбита, Карелия перейдет к Финляндии."
  NOR_the_fennoscandian_deal_tt:0 "\nВ отличие от Датско-Норвежского соглашения, Фенноскандинавское соглашение §Gвзаимовыгодно§! для всех, и мы можем гарантировать его принятие всеми сторонами, пока §YШвеция§! и §YФинляндия§! остаются в нашем альянсе. Однако мы рискуем усилить §Ррусские опасения§! относительно нашей фракции, согласившись защищать восточные границы Финляндии.\n\n"
  NOR_seek_american_support:0 "Обратиться за поддержкой к американцам"
  NOR_seek_american_support_desc:0 "Используя торговые связи, полезных норвежских американцев и наши общие ценности, мы могли бы попытаться получить поддержку американцев. Таким образом, позже они могут поддержать нас или защитить, если нам это понадобится. Но нет никаких гарантий, что это сработает, американцы ценят свой нейтралитет и мир..."
  NOR_pragmatic_diplomacy:0 "Прагматичная дипломатия"
  NOR_pragmatic_diplomacy_desc:0 "Даже с объединённой Северной Европой мы не можем надеяться противостоять нападению как немцев, так и русских. Если мы хотим выжить, мы должны обратиться за помощью к великим державам, и даже этого может быть недостаточно. Выбор стороны может быть нашим единственным вариантом..."
  NOR_stand_against_communism:0 "Против коммунизма"
  NOR_stand_against_communism_desc:0 "Встать на сторону Германии, заключив пакты о ненападении, свободной торговле и свободном балтийском судоходстве, может быть лучше, но датчанам это может не понравиться, поскольку мы обещали им Шлезвиг. И русским это уж точно не понравится..."
  NOR_stand_against_communism_tt:0 "\nПрисоединение к стороне может понадобиться, чтобы избежать войны на два фронта, и те, к кому мы приблизимся, скорее всего, оставят нас в покое или даже подружимся с нами. Но сторона, на которую мы не обратим внимания, скорее всего, нападет на нас.\n"
  NOR_stand_against_fascism:0 "Выступление против фашизма"
  NOR_stand_against_fascism_desc:0 "Поддержка России, влекущая за собой пакты о ненападении, свободную торговлю и несколько установленных восточных границ, может быть к лучшему, но Финнам может не понравиться, что мы поддерживаем Россию и выступаем против Германии, утверждая, что это не их борьба и что русские просто вернутся после падения Германии. И немцам это наверняка не понравится..."
  NOR_stand_against_fascism_tt:0 "\nПрисоединение к стороне может понадобиться, чтобы избежать войны на два фронта, и те, к кому мы приблизимся, скорее всего, оставят нас в покое или даже подружимся с нами. Но сторона, на которую мы не обратим внимания, скорее всего, нападет на нас.\n"
  NOR_end_foreign_influence:0 "Конец иностранному влиянию"
  NOR_end_foreign_influence_desc:0 "Позволим политикам и СМИ в нашем альянсе противодействовать иностранному влиянию на наших людей. Наша политика – нам решать!"
  NOR_end_foreign_influence_tt:0 "Устраняет иностранное политическое влияние со стороны наших близких союзников и нас.\n"
  NOR_nordic_joint_defense_focus:0 "Совместная оборонительная инициатива Северной Европы"
  NOR_nordic_joint_defense_focus_desc:0 "Некоторые из самых проницательных политических деятелей и военных экспертов в странах Скандинавии выступают за создание совместной организации Северной обороны с единым высшим командованием и объединенными учениями. Сейчас, возможно, пришло время взять инициативу в свои руки и пригласить представителей наших союзников. Это как раз то, что нужно, чтобы обеспечить нашу дальнейшую свободу и процветание."
  NOR_nordic_joint_defense_focus_tt:0 "Формирует §YСеверную инициативу совместной обороны§! с другими членами Скандинавской фракции. Тесное сотрудничество и совместное высшее командование должны со временем привести к тому, что нордические войска и командиры будут выступать лучше, обучаясь у своих союзников. Когда наши союзники заключат это соглашение, они, возможно, также вдохновятся идеей перевооружения, как и мы.\n\nВ зависимости от того, какую политику перевооружения мы выбрали ранее, наша нордическая оборонная политика может несколько отличаться.\n\n"
  NOR_the_brotherhood_of_nations:0 "Братство демократических наций"
  NOR_the_brotherhood_of_nations_desc:0 "Давно назрел момент переименовать наш союз, особенно учитывая, что теперь он стал не просто союзом трех братьев. Мы должны провести ребрендинг и объявить себя Братством демократических наций, а также привлечь еще несколько мирных европейских стран. Это должно поддержать наш дипломатический импульс."
  NOR_the_brotherhood_of_nations_tt:0 "\nМенее вероятное принятие другими странами присоединения к нашей фракции при ухудшающихся отношениях, в то время как хорошие отношения практически гарантируют их присоединение.\n"
  NOR_support_neighbors:0 "Поддержка соседей"
  NOR_support_neighbors_desc:0 "Мы должны быть готовы поддержать наших соседей, если им потребуется помощь в борьбе с иностранными захватчиками."
  NOR_gutta_paa_skauen:0 "Партизаны на склонах"
  NOR_gutta_paa_skauen_desc:0 "Есть люди, готовые прятаться среди врагов и внедряться в их ряды во имя нашего короля и нашего дела, а также часто добровольно участвующие в нашем деле, если войны затронут наших друзей. Нам следует поощрять таких людей."
  NOR_gutta_paa_skauen_tt:0 "\nНаличие советника из §YЛидеров партизан§! сделает наши движения сопротивления более мощными, а сбор разведданных - более эффективным, а также даст нашим войскам дополнительное преимущество на нашей собственной территории.\n\n"
  NOR_saboteurs:0 "Диверсанты"
  NOR_saboteurs_desc:0 "При наличии движения сопротивления может прийти время обучить некоторых наших партизан для участия в тайных диверсионных операциях за линией фронта. После обучения этих коммандос мы поручим этим храбрым людям выполнить наши хорошо спланированные и тайные операции. Возможно, впереди их ждет дело всей жизни."
  NOR_saboteurs_tt:0 "Позволяет §Yпринимать решения§! проводить §YПартизанские операции§! против врагов, оккупирующих территорию Норвегии.\n"
  ##monarchist branch
  NOR_traditions_and_monarchy:0 "Возродить монархические традиции"
  NOR_traditions_and_monarchy_desc:0 "В эти неопределенные времена многие призывают к осторожности. И что лучше сохранит осторожность, чем возвращение к нашим проверенным корням? Возрождение традиций уже некоторое время является важным для тех, кто находится у власти."
  NOR_traditions_and_monarchy_tt:0 "\nНаличие советника-§YЯрого Монархиста§! позволит принимать особые §Yрешения§! в подготовке к §Гражданской Войне§! или другому монархическому захвату.\n\n"
  NOR_develop_the_kingdom:0 "Развитие Королевства"
  NOR_develop_the_kingdom_desc:0 "Мы должны начать свой путь к созданию идеального Королевства, построив для него прочную инфраструктуру. Для поддержки государства, нашего народа и наших ценностей обязательно потребуется прочный фундамент."
  NOR_traditions_worth_fighting_for:0 "Традиции, за которые стоит бороться"
  NOR_traditions_worth_fighting_for_desc:0 "С ростом популярности монархизма и традиционных ценностей день ото дня возникает вопрос о том, как мы собираемся привести наши новые обретенные ценности к власти. Дождёмся ли мы выборов? Поднимем ли переворот? Или будем сражаться, если до этого дойдёт?"
  NOR_traditions_worth_fighting_for_tt:0 "\nМожет привести к §Гражданской Войне§!.\n\n"
  NOR_matters_of_presentation:0 "Вопросы представления"
  NOR_matters_of_presentation_desc:0 "После восстановления нашей традиционной монархии перед нами встал вопрос о том, в каком виде мы хотим представить нашу нацию миру и, безусловно, нашему собственному народу. Первыми возникают вопросы о том, сохранить или снять запрет на аристократию и, возможно, изменить нашу национальную символику, в частности наш флаг."
  NOR_the_location_of_power:0 "Расположение власти"
  NOR_the_location_of_power_desc:0 "Еще один вопрос, связанный с символикой и представительством, - это наша столица и то, как она представлена миру. И, возможно, самое главное - где она должна быть расположена буквально и географически?"
  NOR_a_prosperous_kingdom:0 "Процветающее королевство"
  NOR_a_prosperous_kingdom_desc:0 "Теперь, когда восстановлено \"Норгесвельде\", Великое Королевство былой славы, экономика стабилизирована и на нашем пороге нет неминуемой опасности, мы можем праздновать наши достижения и переключить внимание нашего населения с восстановления Королевства на сохранение наших великих достижений в обозримом будущем."
  NOR_matters_of_practicality:0 "Вопросы практичности"
  NOR_matters_of_practicality_desc:0 "Наши последователи провели нас через важные первые шаги к восстановлению нации на основе старых ценностей. Но мы должны определить, кто поведет монархическую коалицию через важные первые шаги и реформы..."
  NOR_the_extent_of_power:0 "Пределы власти"
  NOR_the_extent_of_power_desc:0 "Раз коалиция готова действовать, то нам осталось решить один последний практический вопрос: об определении полномочий монарха. Чем именно может распоряжаться король? Станем ли мы конституционной монархией, продвигающей семейные ценности? Должны ли полномочия короля быть больше чем символическими? Должен ли премьер-министр отчитываться перед королем? И что насчет наших выборов?"
  NOR_foreign_relations:0 "Поддержка внешних сношений"
  NOR_foreign_relations_desc:0 "Установив с другими странами прочные дипломатические и торговые отношения, мы можем повысить свои шансы не попасть в опасную ситуацию, если снова разгорится европейская война, и если мы захотим продолжить придерживаться нейтралитета."
  NOR_foreign_relations_tt:0 "\nУспокоив §YВеликобританию§! и §YГерманию§!, мы сделаем маловероятным враждебные действия против нас.\n\n"
  NOR_the_nordic_policy:0 "Нордическая политика"
  NOR_the_nordic_policy_desc:0 "Самые безотлагательные (и поэтому самые важные) дипломатические вопросы любой страны — это вопросы, касающиеся ближайших соседей. Мы подружимся с другими нордическими странами или норвежское государство впервые за полтысячелетия применит силу за рубежом?"
  NOR_reclaim_the_islands:0 "Вернуть острова"
  NOR_reclaim_the_islands_desc:0 "Чтобы восстановить былую славу норвежского королевства, нам нужно вернуть норвежские острова Фарерские, Исландию и Гренландию, несправедливо отданные Дании по Кильскому договору.
  NOR_icelandic-faroese_revolt:0 "Исландско-фарерское восстание"
  NOR_icelandic-faroese_revolt_desc:0 "Поскольку мы находимся в конфликте с датчанами, мы могли бы спровоцировать восстания в Исландии и на Фарерских островах, бывших норвежских островах с более историческими и культурными связями с Норвегией, чем с Данией. Это должно привести к аннексии Фарерских островов Норвегией, в то время как Исландия присоединится к нашему делу косвенно как зависимая, но автономная территория."
  NOR_icelandic-faroese_revolt_tt:0 "\nПередает нам владение §YFарерскими островами§! и делает §YИсландию§! нашим автономным §Yподданным§!.\n\n"
  NOR_develop_iceland:0 "Развивать Исландию"
  NOR_develop_iceland_desc:0 "При наличии Исландии под нашим контролем мы должны развивать этот обширный остров, богатый водой, выносливыми рабочими, обильными рыбными угодьями и здоровыми овцами. Отдаленные районы нашей страны, конечно же, также должны иметь возможность вносить свой вклад в наши усилия."
  NOR_develop_the_faroes:0 "Развивать Фарерские острова"
  NOR_develop_the_faroes_desc:0 "При Фарерских островах, вновь находящихся под нашим контролем, есть веская причина не использовать их ресурсы, рыбу, китов и овец для промышленности."
  NOR_develop_the_jarldom_of_orkney:0 "Развивать графство Оркни"
  NOR_develop_the_jarldom_of_orkney_desc:0 "Старое графство Оркни, которое сейчас находится под нашим контролем, безусловно, само по себе является престижной территорией, но при наличии большего количества промышленности оно также может внести для нас больший материальный вклад."
  NOR_reclaim_the_mainland:0 "Отвоевать материк"
  NOR_reclaim_the_mainland_desc:0 "Даже если в течение своего существования Норвегия владела многими различными островами, основным центром власти, экономики и населения в истории Норвегии всегда были материк и связанные с материком острова. В середине 1600-х годов Швеция вторглась на этот принадлежавший Норвегии материк, и нам нужно воспользоваться своим шансом вернуть то, что по праву принадлежит нам!"
  NOR_subjugate_finland:0 "Покорить Финляндию"
  NOR_subjugate_finland_desc:0 "Хотя Финляндия не занимает земли, которые когда-либо были неотъемлемой частью Норвегии, поскольку мы уже вернули себе хотя бы часть наших бывших территорий, мы можем оправдать применение силы, чтобы снова включить Финляндию в свою сферу влияния и обезопасить наш восточный фланг. Конечно, финны также выиграют от этой защиты в долгосрочной перспективе. Выдвинуть ультиматум?"
  NOR_approach_denmark:0 "Сблизиться с Данией"
  NOR_approach_denmark_desc:0 "Датчане были бы лучшими нашими друзьями. Они не отбирали у нас земли силой (скорее путем договора с великими державами), и торговое партнерство хорошо работало во времена союза. Поэтому предложение альянса датчанам кажется хорошим планом действий."
  NOR_approach_sweden:0 "Сблизиться со Швецией"
  NOR_approach_sweden_desc:0 "Шведы могли бы стать прекрасными друзьями норвежцам. Они вторглись в Норвегию в прошлом только из-за чрезмерного вмешательства датчан. В конце концов, это часто дорого обходилось и им самим. Поэтому давайте простим и подружимся с нашими братьями на востоке. Нам стоит помнить, что во времена союза со Швецией и их снисходительным правлением наша экономика и культура процветали."
  NOR_approach_finland:0 "Подход к Финляндии"
  NOR_approach_finland_desc:0 "Финны никогда не были врагами Норвегии по собственной воле, поскольку финские солдаты, вторгшиеся в Норвегию, действовали по приказу агрессивных шведских королей. А разве это не женщина квен рисковала своей жизнью, чтобы сорвать одно из этих шведских вторжений? Финны могут быть одними из самых естественных союзников норвежского народа, так кто же тогда может быть более достойным союза, чем наши кузены на востоке?"
  NOR_the_european_policy:0 "Европейская политика"
  NOR_the_european_policy_desc:0 "С несколько просматриваемой родиной, кажется, разумным следить за меняющейся политической природой Европы. В конце концов, лучше держать проблемы подальше, чем позволить им прийти к нам."
  NOR_take_no_sides:0 "Не принимать ничью сторону"
  NOR_take_no_sides_desc:0 "За исключением Финляндии, которая входила в состав Российской империи, скандинавские страны с большим успехом держались в стороне от Великой войны. И хотя она действительно нанесла ущерб нейтральному судоходству, норвежское государство получило компенсацию даже в качестве нейтрального государства, поскольку Антанта воспользовалась норвежским судоходством. Почему бы нам тогда не стремиться к тому, чтобы Северная Европа впредь оставалась вне разрушительных конфликтов?"
  NOR_a_piece_in_the_greater_game:0 "Роль в большой игре"
  NOR_a_piece_in_the_greater_game_desc:0 "Если мы хотим, чтобы нас действительно воспринимали всерьёз в мире, мы должны быть активными и помогать формировать его. Для этого мы должны либо присоединиться к одной из великих держав, согласных с нашими взглядами, или, возможно, мы должны протянуть руку помощи другим местным державам и помочь им бороться с угрозами нашему традиционному государству?"
  NOR_the_british_empire:0 "Британская империя"
  NOR_the_british_empire_desc:0 "Если мы встанем на сторону Великой империи, которая когда-либо существовала, мы, безусловно, не можем проиграть. Это действительно безопасный выбор, если они нас примут, а союз с победителями всегда приносит некоторое влияние приспешникам. Хотя это влияние может быть уменьшено за счёт статуса больших шишек по сравнению с нами."
  NOR_a_deal_with_britain:0 "Соглашение с Британией"
  NOR_a_deal_with_britain_desc:0 "Помогая Соединенному Королевству поддерживать их империю, мы могли бы получить взамен некоторые из наших старых островов, незаконно заложенных Дании. В конце концов, какую разницу Шетландские и Оркнейские острова имеют для мировой империи?"
  NOR_a_deal_with_britain_tt:0 "\nОтправляет предложение с просьбой передать нам Шетландские и Оркнейские острова. Великобритания может принять это предложение, решить ограничить его только Шетландскими островами или отклонить. Хорошие отношения и полезный союзник увеличат вероятность благоприятного исхода.\n"
  NOR_the_north_sea_deal:0 "Сделка в Северном море"
  NOR_the_north_sea_deal_desc:0 "По мере сближения Германии и Великобритании мы также присоединимся к этой дружбе народов. Может быть, мы сможем договориться о возвращении Шетландских островов, помогая крупным державам победить их врагов?"
  NOR_the_north_sea_deal_tt:0 "\nОтправляет предложение Великобритании с просьбой вернуть нам Шетландские острова. Они могут либо принять, либо отклонить это предложение. Хорошие отношения и полезный союзник увеличат вероятность благоприятного исхода.\n"
  NOR_the_german_kaiserreich:0 "Германская империя"
  NOR_the_german_kaiserreich_desc:0 "Если мы объединимся с возрождающимся кайзеровской Германией, то сможем существенно нарастить влияние в мире. В отличие от союза с британцами, это представляет собой больший риск, так как в сравнении со второй итерацией Германского кайзеровства они даже близко не столь влиятельны и сильны, но потенциальные выгоды для нас гораздо выше..."
  NOR_a_deal_with_germany:0 "Договор с Германией"
  NOR_a_deal_with_germany_desc:0 "Если мы поможем Германии отменить Версальский договор, справедливо будет, чтобы мы получили некоторые из наших старых островов. И в данном случае речь идёт о Шетлендских и Оркнейских островах. Кайзер, без сомнения, согласится на такие обоснованные требования."
  NOR_baltic_anti-communist_league:0 "Балтийская антикоммунистическая лига"
  NOR_baltic_anti-communist_league_desc:0 "Коммунизм может быть величайшей из всех угроз монархии и традиционным семейным ценностям. Поиск единомышленников в Восточной Европе и Прибалтике мог бы, если всё пойдёт по плану, по-настоящему сформировать великолепное сдерживание против разлагающих всё большевиков."
  NOR_baltic_league_strikes_west:0 "Великий западный наконечник копья"
  NOR_baltic_league_strikes_west_desc:0 "Хотя изначально цель альянса могла заключаться в сдерживании большевиков на востоке, западные фашисты и агрессоры недавно сами по себе стали огромной угрозой. Стоит ли альянсу сообща устранить угрозу, пока она не вышла из-под контроля?"
  NOR_baltic_league_deterrence:0 "Политика сдерживания Балтийской лиги"
  NOR_baltic_league_deterrence_desc:0 "Наш союз в своей работе в основном оборонительный, давайте сдержим любых возможных захватчиков и заставим их заплатить, если они придут за нашим великим Балтийским Альянсом."
  NOR_baltic_league_strikes_east:0 "Великое Восточное острие копья"
  NOR_baltic_league_strikes_east_desc:0 "Балтийская лига была сформирована во многом в ответ на большевистскую угрозу суверенитету и образу жизни более умеренных стран. Давайте покончим с этой угрозой раз и навсегда, прежде чем она сожжет все, что нам дорого."
  ##collectivist branch
  NOR_reject_constitutional_monarchy:0 "Отвергнуть конституционную монархию"
  NOR_reject_constitutional_monarchy_desc:0 "Король стоит на пути истинного пути. Подобно тому, как дорожные преграды следует убирать, так же и упрямая королевская семья должна отречься от престола! Проводя партийные пропагандистские кампании за современный авторитаризм и коллективизм, мы можем свергнуть архаичную систему и принести реальные перемены."
  ##fascist sub-branch
  NOR_support_radical_nationalism:0 "Поддержка радикального национализма"
  NOR_support_radical_nationalism_desc:0 "Мы должны поддержать нашу единственную истинную националистическую партию, Nasjonal Samling, во главе с динамичным Видкуном Квислингом."
  NOR_hirden_est:0 "Хирден"
  NOR_hirden_est_desc:0 "Личная свита и телохранитель наших средневековых королей назывались Хирден, Хирд. Давайте восстановим такую ​​гвардию, которая теперь будет верна националистическим идеалам и лидерам партии, а не королю."
  NOR_rinnanbanden:0 "Риннанбанден"
  NOR_rinnanbanden_desc:0 "Люди, верные нашему делу, предлагают свою помощь в том, чтобы проникнуть в возможное сопротивление или диссидентство."
  NOR_rinnanbanden_tt:0 "\nЕсли в качестве нашего советника будет §YПринц ужаса§!, это позволит нам более эффективно противодействовать движениям сопротивления и вражеским подрывным действиям, а также обеспечит нас дополнительной рабочей силой не из основного состава.\n\n"
  NOR_norway_first:0 "Норвегия прежде всего"
  NOR_norway_first_desc:0 "Мы должны восстановить Норвегию и вернуть ей прежнюю славу."
  NOR_reclaim_danish:0 "Вернуть датские земли"
  NOR_reclaim_danish_desc:0 "Давайте вернем земли, утраченные из-за Дании, о которых забыли после наполеоновских войн и последующего Кильского договора."
  NOR_reclaim_swedish:0 "Вернуть шведские земли"
  NOR_reclaim_swedish_desc:0 "Давайте вернем земли, утраченные из-за Швеции во время войн между Данией и Швецией."
  NOR_join_axis:0 "Присоединиться к оси"
  NOR_join_axis_desc:0 "Вход в союз с нашими братьями в Третьем рейхе мог только пойти нам на пользу. Давайте начнем с налаживания отношений и установления мира между нашими народами."
  NOR_invite_terboven:0 "Пригласить Тербовена"
  NOR_invite_terboven_desc:0 "Как небольшая нация, мы не можем все делать самостоятельно. Пригласим немецких специалистов, чтобы они помогли управлять и строить нашу страну."
  NOR_invite_terboven_tt:0 "§YЙозеф Тербовен§! станет доступен как §Yполитический советник§!.\n"
  NOR_festung_norwegen:0 "Крепость Норвегия"
  NOR_festung_norwegen_desc:0 "Идея сделать всю нашу береговую линию крепостью возможна, но это требует усилий. Мы, конечно, не верили иначе."
  NOR_german_puppet:0 "Принять немецкое правление"
  NOR_german_puppet_desc:0 "С нападением немецких военных на нашу нацию некоторые фашистские сторонники предположили, что в долгосрочной перспективе нам было бы лучше сдаться немцам. Есть большая вероятность, что они любезно отнесутся к нам, если мы примем немецкое влияние и использование наших военно-морских баз, в обмен на их снисходительные условия."
  NOR_german_technology_sharing:0 "Обмен технологиями с Германией"
  NOR_german_technology_sharing_desc:0 "Давайте расширим наше сотрудничество с немцами благодаря научно-исследовательскому соглашению. Их опыт в таких областях, как промышленность, технология шифрования и бронетехника, мог бы принести нам огромную пользу."
  NOR_german_technology_sharing_tt:0 "Пригласите [GER.GetNameDef] создать с нами группу §Yсовместного использования технологий§!. \n\nНаличие очень §Gхороших отношений§! вероятно, обеспечит их принятие. \n\n"
  NOR_expand_german_technology_sharing:0 "Расширить обмен технологиями с Германией"
  NOR_expand_german_technology_sharing_desc:0 "Пригласите немецких экспертов, чтобы помочь в наших исследованиях, и одновременно развивайте еще более тесные связи с немцами и их союзниками."
  NOR_german_naval_coordination:0 "Координация с немецким флотом"
  NOR_german_naval_coordination_desc:0 "С нашим большим торговым флотом мы, безусловно, станем достоянием немцев. В обмен на делегирование контроля над частью его, мы должны иметь возможность заказывать у них корабли и подводные лодки со скидкой. Сильное норвежское присутствие на морях, безусловно, принесёт огромную пользу нашему альянсу."
  NOR_at_any_cost:0 "Любой ценой"
  NOR_at_any_cost_desc:0 "Вдохновлённые идеологией и общим благом, некоторые из наших пилотов-истребителей готовы пожертвовать всем. Мы почтим их великую жертву, приведя нацию к величию."
  NOR_demand_the_northern_isles:0 "Вернуть Северные острова"
  NOR_demand_the_northern_isles_desc:0 "Требуйте земли, утраченные в результате незаконных датских займов, удерживаемых нами до позднего средневековья. Если мы собираемся претендовать на британскую территорию, то с этого нужно начинать. Жители Шетландских и Оркнейских островов имеют значительное количество старого норвежского наследия, и они преуспеют в нашей новой нации. Что касается Кейтнесса, то он был неотъемлемой частью норвежского графства Оркней, и, следовательно, он должен последовать за ним."
  NOR_demand_overseas_colonies:0 "Требовать заморские колонии"
  NOR_demand_overseas_colonies_desc:0 "Норвегия всегда была морской державой, и мы, безусловно, могли бы быть колониальной империей, если бы датчане не сдерживали нас в течение 300 тёмных лет. Давайте попытаемся исправить это, потребовав свою законную долю Британской колониальной империи."
  NOR_demand_scottish_lands:0 "Требовать земли Шотландии"
  NOR_demand_scottish_lands_desc:0 "Некоторые части Шотландии были частью Норвегии с эпохи викингов и на протяжении всего средневековья. Мы должны использовать это как рычаг давления на великие державы, чтобы получить Шотландию, когда подписывается мирный договор."
  NOR_demand_russian_territories:0 "Затребовать российские территории"
  NOR_demand_russian_territories_desc:0 "Сам Видкун Квислинг хочет основать норвежские колонии на севере России, теперь, когда мы присоединились к борьбе против большевизма. Это наша награда за борьбу, которую мы переживаем, чтобы очистить мир от красной чумы. Один из наших средневековых королей претендовал на все земли у Белого моря как на норвежские, так что начнем с того, что заявим о наших правах там, поближе к дому."
  NOR_demand_russian_territories_tt:0 "\nЭтот фокус также отправит требование §YПетсамо§! в §YФинляндию§!, если они владеют этим штатом. Вероятность того, что Финляндия согласится уступить землю, выше, если она находится в той же §Yфракции§!, §Gимеет хорошие отношения§!, или имеет §Gсильную армию§!. \nЧтобы обеспечить это, нам нужно либо иметь их как §Yмарионеток§!, либо иметь членство в той же §Yфракции§!, §Gиметь хорошие отношения§! и §Gсильную армию§! сразу.\n"
  ##communist sub-branch
  NOR_support_radical_socialism:0 "Поддержка радикального социализма"
  NOR_support_radical_socialism_desc:0 "Мы должны поддержать истинный путь Kommunistiske Parti, норвежской коммунистической партии. Партия Адама Эгеде-Нисена, несомненно, приведет народ к власти и равенству."
  NOR_join_comintern:0 "Вступить в Коминтерн"
  NOR_join_comintern_desc:0 "Вступление в альянс с могущественным и равноправным Советским Союзом может принести нам только пользу. Начнем с выстраивания отношений и установления мира между нашими странами."
  NOR_soviet_technology_sharing:0 "Советский обмен технологиями"
  NOR_soviet_technology_sharing_desc:0 "Давайте расширим наше сотрудничество с Советами в рамках исследовательского соглашения. Их промышленные методы и разработки бронетанковой техники могут принести нам пользу."
  NOR_soviet_technology_sharing_tt:0 "Пригласите [SOV.GetNameDef] создать с нами §Yгруппу по обмену технологиями§!. \n\nНаличие §Gотличных отношений§! вероятно, обеспечит их согласие.\n\n"
  NOR_expand_soviet_technology_sharing:0 "Расширение советского обмена технологиями"
  NOR_expand_soviet_technology_sharing_desc:0 "Привлеките советских специалистов, чтобы помочь нам в наших исследованиях, развивая при этом более тесные связи с Советами и другими близкими друзьями Революции."
  NOR_collectivism:0 "Коллективизм"
  NOR_collectivism_desc:0 "Каждый мужчина и женщина должны работать на общее благо; коллективизм окупается в долгосрочной перспективе."
  NOR_folkearmeen:0 "Фолкестеркен"
  NOR_folkearmeen_desc:0 "Создайте Фолкестеркен, народную силу, великую и верную силу, охраняющую наших партийных чиновников."
  NOR_unite_the_scandinavian_workers:0 "Объединение рабочих Скандинавии"
  NOR_unite_the_scandinavian_workers_desc:0 "Теперь, когда мы следуем по пути настоящего равенства, было бы эгоистично не поделиться им с нашими скандинавскими братьями. Давайте объединим Скандинавию любыми необходимыми средствами!"
  NOR_pressure_finland:0 "Давление на Финляндию"
  NOR_pressure_finland_desc:0 "Наше поражение наших скандинавских соседей не осталось незамеченным во всем мире. Баланс сил в Северных странах сместился, и, имея доступ к ресурсам и промышленности Скандинавии, мы стали силой, с которой нельзя не считаться. Почему же тогда мы должны позволять финнам стоять на нашем пути, когда мы стремимся углубить наши связи с Советским Союзом? Конечно, их наилучшим образом действий было бы подчиниться нам."
  NOR_pressure_finland_tt:0 "\nПопытаться оказать давление на Финляндию, чтобы она стала нашим §Yподчиненным государством§!. Сильная армия сделает их принятие более вероятным.\nЧтобы обеспечить это, нам нужны очень хорошие отношения, мы должны быть в одной фракции с Советским Союзом, а как у Советского Союза, так и у нас должны быть сильные армии.\n\nЕсли Финляндия уже является нашим подданным, этот фокус уменьшит их §Yавтономию§!.\n\n"
  NOR_establish_a_secret_police:0 "Создать тайную полицию"
  NOR_establish_a_secret_police_desc:0 "Используем опыт наших российских товарищей и создадим собственную тайную полицию по образу и подобию их \"Народного комиссариата внутренних дел\", или НКВД. Это поможет контролировать внутренние проблемы и общественное мнение и сделает нашу страну более стабильной. Как индивидуальная свобода и мнение отдельного человека могут сравниться со стабильностью и безопасностью всего государства в целом?"
  NOR_perfect_state_propaganda:0 "Усовершенствовать государственную пропаганду"
  NOR_perfect_state_propaganda_desc:0 "Пропаганда — это искусство, и чтобы сформировать из государства и его народа эффективный и хорошо отлаженный механизм, нам следует достичь совершенства в этом искусстве. Когда каждый будет знать свое место и обязанности, общество и наш народ пожнут плоды нашей утопии."
  NOR_recover_from_civil_war:0 "Оправиться от гражданской войны"
  NOR_recover_from_civil_war_desc:0 "Теперь, когда нам удалось одержать верх над врагами в недавней гражданской войне, мы можем сосредоточиться на восстановлении нашей разрушенной страны и ее инфраструктуры. Доверие должно быть восстановлено между разными регионами и народами Норвегии."
  NOR_state_investments:0 "Государственные инвестиции"
  NOR_state_investments_desc:0 "Норвежское государство недавно профинансировало проект, поэтому на другие задачи временно будет меньше денег."
  NOR_large_state_investments:0 "Крупные государственные инвестиции"
  NOR_large_state_investments_desc:0 "Норвежское государство недавно вложило значительные средства в один из проектов. Потребуется некоторое время, чтобы освободить больше средств."
  NOR_large_armament_investments:0 "Крупные инвестиции в вооружения"
  NOR_large_armament_investments_desc:0 "Мы недавно профинансировали значительное расширение нашей оружейной промышленности. Хотя теперь заводы построены, нам также необходимо будет перенаправить средства, чтобы обеспечить надлежащее функционирование производственных линий. Будем надеяться, что этого будет достаточно для победы."
  NOR_aftermath_of_the_depression:0 "Последствия Великой депрессии"
  NOR_aftermath_of_the_depression_desc:0 "Хотя в 1920-х годах в Норвегии было несколько кризисов, в последнее время это была Великая депрессия, на этот раз страна не пострадала так сильно, как другие западные страны. Хотя уровень безработицы по-прежнему высок, экспортная и судоходная отрасли Норвегии начинают процветать, и закладываются основы превращения Норвегии в полностью индустриализированную страну. Если мы сейчас грамотно вложим средства в нужные места, это сможет вывести нас из депрессии раз и навсегда."
  NOR_fishing:0 "Развитие рыболовства"
  NOR_fishing_desc:0 "Современный рыболовный флот и перерабатывающие предприятия вдоль побережья должны позволить нам воспользоваться богатыми рыболовными угодьями вдоль нашей береговой линии."
  NOR_dockyard_investments:0 "Расширение судостроительной промышленности"
  NOR_dockyard_investments_desc:0 "Инвестиции в наши верфи и военно-морские объекты позволяют нам быть в авангарде военно-морских инноваций и производства."
  NOR_grand_naval_expansion:0 "Великое военно-морское расширение"
  NOR_grand_naval_expansion_desc:0 "Государство, Nortraship, судоверфь Хортен и другие морские отрасли объединили свои ресурсы для значительного расширения наших военно-морских возможностей."
  NOR_specialized_naval_industry:0 "Специализированная военно-морская промышленность"
  NOR_specialized_naval_industry_desc:0 "Наше морское производство теперь разрабатывает инновационные конструкции кораблей, специализирующиеся на береговой обороне и ограниченных операциях, при этом тяжелые крейсеры и другие более крупные корабли обеспечивают прикрывающий огонь для поддерживающих кораблей и сухопутных сил вдоль побережья. Наш флот также принял тактику, чтобы максимально эффективно использовать это. Хотя наши корабли с этими конструкциями будут работать лучше, чем когда-либо, они также будут немного дороже в производстве из-за этого."
  NOR_policy_of_disarmament:0 "Устойчивая политика разоружения"
  NOR_policy_of_disarmament_desc:0 "За исключением немецких подводных лодок, нападавших на нейтральные корабли во время Первой мировой войны, Норвегия и ее народ не сталкивались с реальными военными угрозами в течение 1900-х годов, и правительство все меньше и меньше тратило на военные нужды, что достигло кульминации в правительстве Юхана Нюгорсвольда. По крайней мере, средства освобождаются для гражданских дел."
  NOR_meager_defense_budget:0 "Скудный оборонный бюджет"
  NOR_meager_defense_budget_desc:0 "Недавние вложения в наши вооруженные силы позволили остановить дальнейшее ухудшение ситуации, однако мы все еще тратим незначительную часть бюджета на вооруженные силы по сравнению с другими, более осторожными странами мира."
  NOR_new_defense_budget:0 "Новый оборонный бюджет"
  NOR_new_defense_budget_desc:0 "Возможно, предвидя приближение опасности, наше правительство наконец-то сумело повернуть тенденцию разоружения вспять. Благодаря новому оборонному бюджету наши вооруженные силы получат достойное оснащение и подготовку, чего не случалось в течение последних десятилетий."
  NOR_winter_training:0 "Зимняя подготовка"
  NOR_winter_training_desc:0 "Лыжи используются в Норвегии на протяжении многих лет, и армия тоже пользуется ими уже достаточно давно. Хотя катание на лыжах уже является обязательным навыком для всех военнослужащих норвежской армии, добавление к программе обучения сезонных лыжных занятий в сочетании с тренировками по выживанию в зимних условиях позволит закалить наших солдат еще больше. Все это в дальнейшем должно обеспечить нам общее преимущество в зимних условиях и на заснеженных горах."
  ICE_norwegian_advisors:0 "Норвежские советники"
  ICE_norwegian_advisors_desc:0 "Благодаря тесной интеграции сил безопасности Исландии и норвежских вооруженных сил в рамках соглашения было принято решение, что пребывание норвежских советников в Исландии для совершенствования тактических решений и стойкости наших войск на островах принесет пользу как Исландии, так и Норвегии."
  NOR_recreational_shooting:0 "Поддержка развлекательной стрельбы"
  NOR_recreational_shooting_desc:0 "Теперь государство побуждает как можно большее количество граждан использовать огнестрельное оружие в целях отдыха и охоты. Это позволит им приобрести общие навыки обращения с оружием и знание местности."
  NOR_heimevernet:0 "Хеймверн"
  NOR_heimevernet_desc:0 "Задача Хеймверна, норвежского отряда самообороны, является первой линией защиты на норвежской территории. Благодаря регулярным тренировкам, наши люди будут готовы взяться за оружие, если в этом возникнет необходимость."
  NOR_heimevernet_idea:0 "Хеймверн"
  NOR_heimevernet_idea_desc:0 "Задача Хеймверна, норвежского отряда самообороны, является первой линией защиты на норвежской территории. Благодаря регулярным тренировкам, наши люди будут готовы взяться за оружие, если в этом возникнет необходимость."
  NOR_district_investments:0 "Инвестиции в округа"
  NOR_district_investments_desc:0 "Инвестиции в сельское хозяйство, местных производителей и широкопрофильные службы обеспечат процветание и достойную жизнь нашему народу. Это минимизирует риски врагов, которые могут разрушить всю нашу промышленность, и позволит нам использовать все наши ресурсы. Государственные траты никогда не были более выгодными."
  NOR_heavy_water:0 "Тяжелая вода в Рьюкане"
  NOR_heavy_water_desc:0 "Производственные мощности и лаборатории по производству тяжелой воды в Рьюкане должны принести пользу нашим ученым."
  NOR_haakon:0 "Хокон VII"
  NOR_haakon_desc:0 "Несмотря на то, что он родился датским принцем, с 1905 года он показал себя как лояльный и преданный король, заслужив уважение норвежского народа. Король Хакон VII по-настоящему стал объединяющим символом независимой Норвегии.\n\n\"Alt for Norge!\" (\"Всё для Норвегии!\")\n- Королевский девиз короля Хакона VII"
  NOR_kongens_garde:0 "Ганс Маджестет Конгенс Гарде"
  NOR_kongens_garde_desc:0 "Королевская гвардия короля. Обучены для церемоний и боя, непоколебимы в своём долге.\n\n\"Alt for Kongen!\" (\"Всё для короля!\")\n- Девиз королевской гвардии"
  NOR_wave_of_monarchism:0 "Волна монархизма"
  NOR_wave_of_monarchism_desc:0 "По стране прокатывается волна монархических и традиционалистских настроений. Может быть, это даст возможность восстановить более традиционную форму правления?"
  NOR_building_the_kingdom:0 "Строительство королевства"
  NOR_building_the_kingdom_desc:0 "Чтобы защитить наше традиционное королевство, мы все должны работать вместе, чтобы обеспечить ему прочную основу в виде инфраструктуры и промышленности."
  NOR_preserving_the_kingdom:0 "Сохранение королевства"
  NOR_preserving_the_kingdom_desc:0 "Хоть мы и добились большого успеха в восстановлении \"Норвежского государства\" (великого Норвежского королевства Высокого и Позднего средневековья), мы решили переключить своё внимание на сохранение и тщательную защиту этого великого достижения, чтобы оно могло существовать вечно."
  NOR_diplomatic_efforts:0 "Дипломатические усилия"
  NOR_diplomatic_efforts_desc:0 "В настоящее время дипломаты и послы королевства стремятся углубить наши связи с важными торговыми партнерами. Хотя на некоторое время это займет драгоценные административные ресурсы, это хорошая возможность завести хороших друзей."
  NOR_deterrence_investments:0 "Инвестиции в сдерживание на Балтике"
  NOR_deterrence_investments_desc:0 "Великий Балтийский антиэкстремистский и антибольшевистский альянс решительно вкладывает средства в военное сдерживание, так что экстремистские страны, угрожающие их суверенитету и территориальной целостности, должны хорошенько подумать, прежде чем совершать какие-либо агрессивные действия."
  NOR_national_collectivism:0 "Национальный коллективизм"
  NOR_national_collectivism_desc:0 "Давайте поощрять национальный коллективизм, работать вместе на благо нашей нации, ставя ее превыше всего."
  NOR_socialist_collectivism:0 "Социалистический коллективизм"
  NOR_socialist_collectivism_desc:0 "Давайте поощрять социалистический коллективизм, работать вместе ради радикальных социалистических идеалов, ставя создание и поддержание государства рабочих превыше всего."
  NOR_german_advisors:0 "Немецкие советники"
  NOR_german_advisors_desc:0 "Немецкие советники теперь присутствуют в Норвегии, помогая норвежским военным внедрять новейшую тактику, технологии и разработки европейского военного дела."
  NOR_festung:0 "Крепость Норвегия"
  NOR_festung_desc:0 "Фестунг Норвеген, или крепость Норвегия, - это идея превращения всей береговой линии Норвегии в неприступную крепость, которая сделает нашу страну неуязвимой для атак запада. Так как немцы придумали эту идею, им досталось и право дать ей название..."
  NOR_hirden:0 "Хёрд"
  NOR_hirden_desc:0 "Хёрд, личная гвардия короля, обязан своим названием средневековым телохранителям и свите наших королей. Ныне воссозданный в новой форме, современный Хёрд будет оберегать членов нашей партии и сражаться за наше дело, если возникнет такая необходимость."
  NOR_hirden's_air_corps:0 "Воздушный корпус Хёрда"
  NOR_hirden's_air_corps_desc:0 "После расширения, современный Хёрд уже не просто политическая, символическая и военизированная группа, он эволюционирует в нечто более профессиональное, становясь способным даже поддерживать регулярные вооружённые силы. Таким образом, после возникновения необходимости оспаривать господство в небе, Хёрд основал собственный воздушный корпус, сосредоточенный на наступательной тактике, помогающий нам завоевать превосходство в воздухе над врагами нашей нации."
  NOR_rinnanbanden_idea:0 "Банда Риннана"
  NOR_rinnanbanden_idea_desc:0 "Банда Риннана - группа людей, преданная нашему делу, вызвавшаяся внедряться в группы инакомыслящих. Своё название она получила в честь своего лидера, Хенрика Риннана."
  NOR_folkestyrken:0 "Народная сила"
  NOR_folkestyrken_desc:0 "Охрана народа, призванная защищать партийных чиновников и их интересы. Также может бороться за само государство, когда это необходимо."
  NOR_secret_police_idea:0 "Тайная полиция"
  NOR_secret_police_idea_desc:0 "Наше собственное управление госбезопасности, смоделированное по образу и подобию советского НКВД и германского Гестапо, позволит контролировать население и защищать себя от врагов лучше, чем прежде. Вместе с тем, контрразведка и пропаганда — это области, где мы можем и должны совершенствоваться."
  NOR_secret_police_idea_2:0 "Управление государственной безопасности"
  NOR_secret_police_idea_2_desc:0 "Наше собственное управление госбезопасности, смоделированное по образу и подобию советского НКВД и германского Гестапо, позволит контролировать население и защищать себя от врагов лучше, чем прежде. Наши секретные операции и пропаганда уже дают колоссальные преимущества."
  NOR_gutta_paa_skauen_idea:0 "Гутта на скауэн"
  NOR_gutta_paa_skauen_idea_desc:0 "\"Гутта на скауэн\", группа людей, верных нашей стране и нашим ценностям, которые готовы идти добровольцами в иностранные войны и даже действовать в качестве партизан или шпионов, чтобы поддержать наше дело."
  NOR_continuous:0 "Непрерывная политика"
  NOR_continuous_desc:0 "Строительство для мира — это путь к успеху. Если разразится война, наши друзья придут к нам на помощь. Разве нет?"
  NOR_pro-rearmament_politics:0 "Политика за перевооружение"
  NOR_pro-rearmament_politics_desc:0 "Наконец-то у правительства появилась воля вкладывать средства в наши ранее заброшенные вооруженные силы. Давайте этим воспользоваться, пока есть возможность!"
  NOR_change:0 "Изменчивость беспорядков"
  NOR_change_desc:0 "Вотум недоверия — не без проблем. Со временем наша политическая ситуация стабилизируется."
  NOR_atlantic_balanced_policy:0 "Сбалансированная политика атлантической обороны"
  NOR_atlantic_balanced_policy_desc:0 "Благодаря недавней Инициативе атлантической обороны наше правительство осознало, что ему необходимо внести вклад в оборону нашего альянса. Была принята более сбалансированная политика в отношении гражданских вопросов и морского перевооружения. Создание нового объединенного командования и проведение совместных учений должны быстро вывести наших военных на более высокий профессиональный уровень, хотя для более крупных держав эти преимущества могут быть ограниченными."
  NOR_atlantic_defense_policy:0 "Политика обороны, ориентированная на Северную Атлантику"
  NOR_atlantic_defense_policy_desc:0 "Благодаря новой инициативе атлантической обороны наше правительство получило все необходимые подтверждения того, что решение о перевооружении было верным, хотя для координации наших оборонных нужд с нашими союзниками необходимо приложить определенные усилия, а это значит, что больше усилий следует направить на флот. Однако в конечном итоге новое объединенное командование и совместные учения должны быстро вывести наших военных на более высокий профессиональный уровень, хотя для более крупных держав эти преимущества могут быть ограниченными."
  NOR_nordic_balanced_policy:0 "Сбалансированная политика обороны"
  NOR_nordic_balanced_policy_desc:0 "Благодаря недавней Инициативе обороны северных стран наше правительство признало, что ему необходимо внести вклад в оборону нашего альянса, и теперь проводит более сбалансированную политику в отношении гражданских вопросов и военного перевооружения. Создание нового объединенного командования и проведение совместных учений должны быстро вывести наших военных на более высокий профессиональный уровень."
  NOR_nordic_defense_policy:0 "Оборонная политика с упором на Скандинавию"
  NOR_nordic_defense_policy_desc:0 "В рамках новой Скандинавской оборонной инициативы наше правительство получило все необходимые подтверждения того, что решение о перевооружении было правильным, хотя для координации наших оборонных нужд с союзниками необходимо приложить определенные усилия. Но в итоге новое объединенное командование и совместные учения должны быстро вывести нашу армию на более высокий профессиональный уровень."
  NOR_intelligence_gathered:0 "Разведка собрала информацию"
  NOR_intelligence_gathered_desc:0 "Норвежские разведчики и партизаны смогли выяснить планы оккупантов нашей территории. Это даст нам представление об их ресурсах и планах на ближайшее будущее."
  NOR_intelligence_compromised:0 "Разведка скомпрометирована"
  NOR_intelligence_compromised_desc:0 "Зарубежные шпионы смогли унести документы, содержащие важную информацию. К сожалению, это означает, что они смогут более точно оценить наши ресурсы, а также наши планы на ближайшее будущее."
  NOR_resistance_strengthened:0 "Норвежское сопротивление усилено"
  NOR_resistance_strengthened_desc:0 "Наше движение сопротивления и верные агенты сумели нанести удар по врагу на оккупированной территории Норвегии. Эта гражданская поддержка нашего дела, пронизывающая оккупированное общество, должна сделать их положение менее комфортным."
  NOR_north_atlantic_joint_defense:0 "Совместная оборона Северной Атлантики"
  NOR_north_atlantic_joint_defense_desc:0 " Благодаря новой инициативе по обороне Северной Атлантики наш альянс с нашими соседями по другую сторону моря теснее сплочен, чем когда-либо. Норвежцы быстро перевооружаются, и мы не должны позволять им нас обогнать. Для того, чтобы соответствовать стандартам, ожидаемым нашими новыми друзьями, нам придется нарастить производство и рекрутинг. Но вместе с новой ответственностью приходят новые возможности: совместное верховное командование и совместные учения должны принести некоторую пользу нашей армии."
  NOR_nordic_joint_defense:0 "Инициатива по совместной обороне стран Северной Европы"
  NOR_nordic_joint_defense_desc:0 "Благодаря новой инициативе по обороне стран Северной Европы наш альянс с нашими соседями теснее сплочен, чем когда-либо. Норвежцы быстро перевооружаются, и мы не должны позволять им нас обогнать. Для того, чтобы соответствовать стандартам, ожидаемым всеми нашими друзьями, нам придется нарастить производство и рекрутинг. Но вместе с новой ответственностью приходят новые возможности: совместное верховное командование и совместные учения должны принести некоторую пользу нашей армии."
  NOR_norwegian_destroyer_order:0 "Заказ Норвегии на эсминцы"
  NOR_norwegian_destroyer_order_desc:0 "Наши норвежские союзники заказали эсминцы на наших верфях. Хотя мы получим оплату, и это укрепит наших союзников, это, несомненно, замедлит наши собственные проекты до тех пор, пока суда не будут достроены."
  NOR_norwegian_destroyer_order_strong_shipbuilding:0 "Норвежский заказ на эсминцы (Сильная судостроительная промышленность)"
  NOR_norwegian_destroyer_order_strong_shipbuilding_desc:0 "Наши норвежские союзники заказали эсминцы с наших верфей. Взамен мы получаем честную оплату и более сильного союзника. Благодаря нашей развитой судостроительной отрасли, реализация нескольких небольших проектов не слишком затормозит наши собственные."
  ##designers
  NOR_thunes_mekaniske_verksted:0 "Тюнес Механиске Веркстед"
  NOR_thunes_mekaniske_verksted_desc:0 "Являясь крупным производителем турбин и разнообразных локомотивов для наших железных дорог, Тюнес Механиске Веркстед может быть назначен нашим внутренним производителем танков. Поскольку их мощности уже построены для обслуживания крупногабаритных транспортных средств, они представляются наилучшим вариантом для такой деятельности.\n"
  NOR_kjeller_flyfabrikk:0 "Кьеллер Флюфабрикк"
  NOR_det_norske_luftfartselskap:0 "Дет Норске Люфтфартсельскап"
  NOR_horten_naval_yard:0 "Хортенская военно-морская верфь"
  NOR_horten_naval_yard_desc:0 "Хортен Верфт, или Хортенская военно-морская верфь, служит как основной базой для Королевских военно-морских сил Норвегии, так и внутренней верфью для ВМС. В прошлом веке сама база была названа Карлйохансверн в честь короля бывшей Швеции-Норвегии. Ее функции были унаследованы от Фредериксверна в Ставерне с 1850 года.\n"
  NOR_marinens_hovedverft:0 "Мариненс Ховедверфт"
  NOR_marinens_hovedverft_desc:0 "Верфь Хортен служит как основной базой Королевских норвежских ВМС, так и внутренним судостроительным заводом для флота. В прошлом столетии база называлась Карлсйохансверн в честь короля бывшей шведско-норвежской унии. Начиная с 1850 года ее функции перешли к Фредриксверну в Ставерне.\n\nТеперь мощности были расширены для внутреннего производства крупнейших судов, в первую очередь кораблей береговой обороны, так называемых \"панцерскипов\", броненосных кораблей после эры \"Мониторов\". Эти тяжелые крейсеры должны хорошо зарекомендовать себя в качестве многоцелевых, бронированных и экономичных кораблей береговой обороны для нашего флота."
  NOR_nortraship_dock_limited:0 "Доки сопровождения Nortraship"
  NOR_nortraship_dock_limited_desc:0 "Используя опыт и заинтересованность судовладельцев в защите судов, в которые они инвестировали, мы можем создать новую компанию для защиты нашей торговли на море."
  NOR_tandbergs_radiofabrikk_desc:0 "Tandbergs Radiofabrikk была основана в 1933 году инженером-строителем Вебьёрном Тандбергом. Радиозавод в Осло стремительно расширялся, и похоже, что норвежскую электронную промышленность и инновации, особенно в части радиотехнологий и технологий записи, ждет большое будущее."
  NOR_norsk_hydro_desc:0 "Первоначально компания под названием \"Norsk Hydro-Elektrisk Kvælstofaktieselskab\" была основана Сэмом Эйде и Кристианом Биркеландом в декабре 1905 года при финансовой поддержке шведской семьи Валленбергов и французских банков. Изначально компания была создана для использования процесса Биркеланда-Эйде, который использовал электрические дуги для производства компонентов нитратов (для изготовления удобрений). Процесс Биркеланда-Эйде был очень энергоемким (как и многие из более поздних промышленных предприятий компании), и поэтому требовал дешевой электроэнергии. К счастью, к тому времени гидроэлектроэнергетика в Норвегии становилась все более распространенной. Тем не менее, это означало, что процесс не пользовался особой популярностью в других частях мира, и в конечном итоге компания перешла на менее энергоемкие методы. В 1927 году компания перешла на процесс Габера-Боша в сотрудничестве с химическим гигантом IG Farben.\n\nЗаводы компании Norsk Hydro в Рьюкане и Нотоддене теперь производили жидкий аммиак, который затем транспортировался на ее новый завод в Херойе для производства кальциевой селитры, которая стала известна как норвежская селитра. Теперь Norsk Hydro расширяется в новые сферы; в 1934 году на заводе Vemork был построен первый в мире коммерческий завод по производству тяжелой воды, производящий промышленные объемы этого нового продукта.\n"
  NOR_christiania_spigerverk:0 "Christiania Spigerverk"
  NOR_christiania_spigerverk_desc:0 "\"Кристиания Спигер-ог Вальтсе Верк\", как он изначально назывался, был местным гвоздильным заводом, основанным в столице Норвегии в 1853 году. Первоначально завод использовал импортное железо, затем перешел на использование железного лома со всей страны и, наконец, они закончили с новаторскими машинами Коутса для горячей ковки гвоздей в отличие от холодной ковки. Инновационные и эффективные методы производства позволили местному заводу стать крупным и уважаемым заводом менее чем за три десятилетия.\n\nБлагодаря расширению рынков, фабрика в Осло в конечном итоге начала производить инструменты и другие изделия из железа. Во время Первой мировой войны и в 1920-е годы они даже расширили свою деятельность за счет отечественных плавильных заводов.\n"
  NOR_kongsberg:0 "Конгсберг"
  NOR_raufoss_ammunisjonsfabrikker:0 "Рауфосс Амуннисьонсфабриккер"
  ##character ideas (advisors/theorists)
  NOR_haakon_vii_hc:0 "Хокон VII"
  NOR_haakon_vii_hc_desc:0 "Прослужив военно-морским офицером, король Хокон VII может внести некоторые идеи в наше военно-морское командование со своего времени службы в Королевском военно-морском флоте Дании."
  NOR_otto_ruge_ac:0 "Отто Руге"
  NOR_otto_ruge_ac_desc:0 "Будучи начальником Генерального штаба Норвегии с 1933 года, Отто Руге является одним из самых высокопоставленных командиров Норвегии. Он готов предоставлять молодым офицерам низшего ранга достаточно широкую свободу действий, когда это необходимо, и в этом отношении его можно считать сторонником доктрины децентрализованных структур командования, по крайней мере когда варианты ограничены."
  NOR_kristian_laake_ac:0 "Кристиан Кристиансен Лааке"
  NOR_kristian_laake_ac_desc:0 "Кристиан Кристиансен Лааке, один из наших ведущих командиров и человек твердых убеждений, неоднократно высказывал свое несогласие с пренебрежением нашими вооруженными силами. Во время предыдущего визита в Германию он увидел их массовое перевооружение и позже с некоторой обеспокоенностью сообщил об этом политикам на родине. Он предпочитает оборону путем подготовки и профилактики, а не импровизацию, когда опасность уже надвигается."
  NOR_kristian_laake_theorist:0 "Кристиан Кристиансен Лааке"
  NOR_kristian_laake_theorist_desc:0 "Кристиан Кристиансен Лааке, один из наших ведущих командиров и человек твердых убеждений, неоднократно высказывал свое несогласие с пренебрежением нашими вооруженными силами. Во время предыдущего визита в Германию он увидел их массовое перевооружение и позже с некоторой обеспокоенностью сообщил об этом политикам на родине. Таким образом, он является осведомленным и способным командиром, хорошо умеющим планировать будущее."
  NOR_carl_gustav_fleischer_theorist:0 "Карл Густав Флейшер"
  NOR_carl_gustav_fleischer_theorist_desc:0 "Даже когда правительство сокращало военные расходы, Флейшер продумывал, как лучше всего защитить Норвегию. Сейчас он сосредоточился на тактике по отрезанию вражеских плацдармов."
  NOR_wilhelm_von_tangen_hansteen_ac:0 "Вильгельм фон Танген Ханстен"
  NOR_wilhelm_von_tangen_hansteen_hc:0 "Вильгельм фон Танген Ханстен"
  NOR_carsten_tank-nielsen:0 "Карстен Танк-Нильсен"
  NOR_edvard_christian_danielsen:0 "Эдвард Кристиан Даниэльсен"
  NOR_edvard_christian_danielsen_nc:0 "Эдвард Кристиан Даниэльсен"
  NOR_skule_storheill_theorist:0 "Скуле Сторхейль" ### Исправлено написание (и самой идеи, хотя в этом не было строгой необходимости) ошибочного написания его фамилии в базовой игре.
  NOR_josef_terboven:0 "Йозеф Тербовен"
  NOR_josef_terboven_desc:0 "Человек Гитлера в Норвегии, который строит грандиозные и конкретные планы относительно этой страны."
  NOR_henry_oliver_rinnan:0 "Генри Оливер Риннан"
  NOR_henry_oliver_rinnan_desc:0 "Несмотря на невысокий рост, Генри Оливер Риннан был очарователен, общителен, лжив и ярый антикоммунист. Он мог бы очень пригодиться нашему режиму. Он вызвался помочь нам выкорчевать несогласных, внедрившись в их группы сопротивления."
  NOR_gunnar_soensteby:0 "Гуннар Ф. Т. Сёнстебю"
  NOR_gunnar_soensteby_desc:0 "Гуннар Фритьоф Турманн Сонстебю - молодой человек с различными талантами, который недавно закончил службу в королевской гвардии. Теперь он снова добровольно вызвался служить на благо Норвегии ради ее независимости и процветания."
  NOR_fredrik_wedel_jarlsberg:0 "Фредрик Ведель Ярлсберг"
  NOR_fredrik_wedel_jarlsberg_desc:0 "Фредрик "Фриц" Х. Я. Ведель Ярлсберг - норвежский аристократ, юрист и дипломат. На момент провозглашения независимости Норвегии в 1905 году он был одним из немногих норвежцев, обладающих обширными знаниями в области международных отношений. Тогда, когда речь зашла о выборе между королем и президентом, он выступил за правление короля Норвегии, так как этот вариант был намного безопаснее и более дипломатичен.\n\nСам Ведель Ярлсберг принадлежит к известной норвежской и датской дворянской семье, а также является бароном, так как владеет землями в Дании. Однако в Норвегии он не имеет никаких подобных титулов, так как аристократия была упразднена в соответствии с законом о дворянстве 1821 года. Будучи опытным дипломатом, Ведель сыграл центральную роль в приобретении Норвегией архипелага Шпицберген. Острова были переданы Норвегии (частично) в качестве компенсации за потери, понесенные торговым флотом нейтрального королевства, которое оказывало скрытую помощь Антанте во время Великой войны."
  NOR_haakon_steen_lie:0 "Хокон Стен Ли"
  NOR_rolf_joergen_fuglesang:0 "Рольф Йорген Фуглесанг"
  NOR_just_ebbesen_von_der_lippe:0 "Юст Эббесен фон дер Липпе"
  LOI_douglas_neil_wimberley_ac:0 "Дуглас Нил Уимберли"
  LOI_andrew_miller_nc:0 "Эндрю Миллер"
  LOI_arthur_william_tedder_ac:0 "Артур Уильям Теддер"
  LOI_john_william_balfour_paul_theorist:0 "Джон Уильям Балфур Пол"

  ####--Описание лидера--####
  POLITICS_NOR_JOHAN_NYGAARDSVOLD_DESC:0 "Родился в семье фермера в Хоммельвике, на территории нынешнего муниципалитета Мальвик. Впервые Йохан Нюгорсволд вышел на работу на лесопилку в возрасте 12 лет. Молодым человеком в 1902 году эмигрировал в Канаду, а позже и в США. Работал в Британской Колумбии, Монтане и Вашингтоне.\n\nВернувшись в Норвегию всего лишь через пять лет, он вошёл в политику всерьёз, а в 1910 году был избран в правление по вопросам образования от Лейбористской партии, которую он и продолжил представлять. На данный момент он уже оставил свой след в норвежской политике, будучи одним из подписавших так называемое \"соглашение о кризисе\" с Партией фермеров, которое позволило ему сформировать правительство в 1935 году, как его об этом попросили. Его правительство горячо ратовало за смягчение последствий Депрессии посредством проведения прогрессивной политики социального обеспечения, но нельзя сказать того же о военных расходах и бдительной внешней политике."
  POLITICS_NOR_NILS_TRAEDAL_DESC:0 "Норвежский политик, родившийся в семье фермера в Сунндале. Нильс Тредаль проявил свои таланты и способности в работе и политике. В зрелые годы он работал священником, политиком, мэром, в качестве министра церкви и образования в правительстве Педера Л. Колстада и Йенса Хундейда (1931-1932 и 1932-1933 годы соответственно), исполнял обязанности премьер-министра/министра иностранных дел (начало 1932 года) представлял округ Мёре-ог-Ромсдал в правительстве, был членом Либеральной партии.\n\nТакже Нильс был одним из основателей предшественника Партии фермеров, а ныне он возглавил партию. Будучи сторонником сельскохозяйственной реформы и человеком со множеством талантов, Норвегия теперь может пожинать плоды его богатого опыта."
  POLITICS_NOR_IVAR_LYKKE_DESC:0 "Родившись в городе, который тогда назывался Тронхейм, Ивар Люкке стал сыном бакалейщика и бизнесмена. Поработав в деле отца, он впервые оказался в политике, представляя сферу торговли в местной политике. В 1916 году был избран в норвежский парламент, где зарекомендовал себя как умеренный и рассудительный политик, представляющий интересы простых предпринимателей.\n\nБлагодаря признанию реформ социального либерализма, а также своей приятной и скромной манере общения, на протяжении многих лет он завоевал большое доверие. Он отказался от своей первой возможности стать премьер-министром, однако в 1926 году было сформировано его правительство-однофамилец, и на сей раз во главе с ним в качестве премьер-министра Норвегии. После этого он продолжил свою работу в политике, примером чего служит спор из-за названия его родного города, Тронхейма. Вопрос заключался в том, оставить ли название Тронхейм или вернуться к старому норвежскому названию Нидарос. В марте 1931 года спор разрешился принятием предложения Люкке, скомпромиссным названием Тронхейм."
  POLITICS_NOR_CARL_JOACHIM_HAMBRO_DESC:0 "Родился в 1885 году в Бергене, большую часть своей взрослой жизни работал журналистом и главным редактором газеты Morgenbladet (первая ежедневная газета страны). Он также является опытным оратором, и с 1919 года он стал избранным депутатом норвежского национального собрания и высшего законодательного органа Стортинга. С тех пор он занимал такие важные должности, как парламентский лидер Høyre, председатель Стортинга и вице-президент Стортинга.\n\nБудучи заслуженным человеком, награжденным Большим крестом ордена Святого Олафа в 1937 году, и осведомленным человеком в литературе, как старой, так и новой, Хамбро может быстро и правильно выполнить поставленные задачи."
  POLITICS_NOR_JOHAN_LUDWIG_MOWINCKEL_DESC:0 "Йохан Людвиг Мувинкель родился в Бергене в 1870 году, в одной из старейших купеческих семей Норвегии. Он изучал языки и бизнес за границей, в Германии, Англии и Франции. Он купил свою первую лодку в 1898 году и открыл собственную судоходную компанию. Вскоре после этого он попал в городской совет Бергена, и во время расторжения союза между Норвегией и Швецией был мэром. В 1907 году он впервые вступил в должность в норвежском парламенте. \n\nС тех пор Йохан Л. Мувинкель впоследствии стал частью нескольких правительств, трижды занимая должность премьер-министра и часто занимая другие важные должности, такие как президент Стортинга (норвежского парламента), министр промышленности, министр торговли, а также министр иностранных дел, в том числе и другие должности. Он действительно важная фигура в норвежской политике."
  POLITICS_NOR_HAAKON_VII_DESC:0 "Король Хокон VII при рождении был известен как Кристиан Фредерик Карл Георг Вальдемар Аксель, принц Дании и Исландии. В молодости он служил в датском ВМФ, в 1893 году в звании лейтенанта. Он женился на британской принцессе Мод (в честь которой были названы норвежские антарктические территории) в Букингемском дворце в 1896 году. С тех пор Карл (имя, которое он чаще всего использовал) и Мод путешествовали между Данией и Великобританией.\n\nОбраз жизни супругов резко изменился, когда норвежские политики предложили принцу Карлу стать королем независимой Норвегии, поскольку союз между Норвегией и Швецией распался. 18 ноября 1905 года принц Карл объявил по телеграфу, что возьмет имя Хокон VII, а его сын и наследник (Александр) будет носить имя Улав. 25 ноября он прибыл в Норвегию, а 27 ноября принял присягу в качестве первого независимого короля Норвегии за 518 лет.\n\nВ результате некоторых беспрецедентных изменений в сторону традиций демократически настроенный Хокон оказался более абсолютным и традиционным королем, чем когда-либо прежде. Какой сумасшедший мог стоять за этим развитием?"
  POLITICS_NOR_MONARCHIST_COALITION_DESC:0 "Политики и не политики. Сельские жители, горожане и все, что между ними. Аграрии, консерваторы, либеральные монархисты и другие. Монархическая коалиция - это большая группа важных государственных деятелей и граждан с различными мнениями о том, как следует делать то или иное дело, однако объединяет их монархическая и традиционалистская идея восстановления королевства Норвегия к его старому, действительно независимому прошлому."
  POLITICS_NOR_VIDKUN_QUISLING_DESC:0 "Видкун Квислинг, уроженец Фюресдаля, с юных лет был талантливым студентом, изучавшим гуманитарные науки, историю и естествознание. В 1905 году он поступил в Норвежскую военную академию, получив самый высокий балл вступительных экзаменов из 250 абитуриентов того года. Он настолько преуспел в учебе, что удостоился аудиенции у короля, а затем продолжил службу в качестве офицера. Во время Первой мировой войны он ненавидел пацифистские настроения, но смягчил свои взгляды после того, как увидел огромные человеческие жертвы войны.\n\nС тех пор он служил атташе, военным экспертом по русским делам, помогал Фритьофу Нансену организовывать гуманитарную помощь после Первой мировой войны, дважды женился, заигрывал с норвежским коммунистическим движением (безусловно, вдохновленный эффективной народной милицией Советского Союза), занимал пост министра обороны в аграрном правительстве Педера Колстада (несмотря на то, что не был ни аграрием, ни другом Колстада, но его опыт и знания были неоспоримы), и, наконец, помог сформировать политическую партию «Национальное единение» из бывшего политического движения «Нордическое народное возрождение в Норвегии». Теперь он, наконец, представляет партию, которая следует его собственным политическим взглядам, своеобразному сочетанию национализма и социализма."
  POLITICS_NOR_ADAM_EGEDE-NISSEN_DESC:0 "Адам Хьялмар Эгеде-Ниссен родился на ферме в муниципалитете Фрул. В молодости он изучал философию, работая на почте, и в конечном итоге стал начальником местного распределительного центра Вардё в 1897 году, недалеко от русской границы. В 1900 году его политическая карьера впервые привела его в норвежский парламент в качестве представителя Либеральной партии, Венстре. В 1905 году он перешел в Лейбористскую партию, где отказался от очередного срока в парламенте в 1912 году в пользу продолжения работы на норвежской почте.\n\nОбладая опытом как в обычных работах, так и в политике, Эгеде-Ниссен также был не чужд более радикальных подходов к решению проблем, нелегально провозя контрабандой и печатая революционную литературу, а также основав радикальный горняцкий профсоюз в 1906 году. Его пребывание в Вардё дало ему представление о растущих революционных настроениях в России, которые он с тех пор в значительной степени поддерживает. Он был мэром Ставангера с 1915 по 1919 год, когда был оштрафован за участие в всеобщей забастовке 1919 года в поддержку русской революции. В 1918 году он также отправился в Россию и встретился с Лениным, а также принял участие во встрече, посвященной созданию известного Коминтерна. Когда в 1923 году Лейбористская партия раскололась, Эгеде-Ниссен последовал за более радикальными политиками и присоединился к Норвежской коммунистической партии, НКП."
  NOR_johan_nygaardsvold:0 "Юхан Нюгорсволд"
  NOR_johan_nygaardsvold_desc:0 "Юхан Нюгорсволд, родившийся в семье фермера в Хоммельвике, на территории нынешнего муниципалитета Мальвик, получил свою первую работу на лесопилке в 12 лет. В молодости, в 1902 году, он эмигрировал в Канаду, а затем в Соединенные Штаты. Там он работал в Британской Колумбии, Монтане и Вашингтоне.\n\nВернувшись в Норвегию всего пять лет спустя, он занялся политикой, и в 1910 году был избран в совет по образованию от Лейбористской партии, которую он представлял. К настоящему времени он уже оставил свой след в норвежской политике, став одним из тех, кто стоял за так называемым \"кризисным соглашением\" с Крестьянской партией, которое позволило ему сформировать правительство в 1935 году. Его правительство активно выступало за смягчение последствий Депрессии посредством прогрессивной социальной политики, но уделяло не так много внимания военным расходам и внешней политике."
  NOR_nils_traedal:0 "Нильс Трёдал"
  NOR_nils_traedal_desc:0 "Родившись сыном фермера в Сунндале, Нильс Тредаль всю жизнь нёс на себе бремя ответственности и имел богатый политический опыт. Среди должностей и руководящих ролей, которые он занимал во взрослой жизни, были: священник, политик, бывший мэр, бывший министр по делам Церкви и образования как в правительстве Педера Л. Колстада, так и в правительстве Йенса Хундейда (1931-1932 и 1932-1933 гг. соответственно), исполняющий обязанности премьер-министра/министра иностранных дел (в начале 1932 г.), представитель правительства округа Мёре-ог-Ромсдал и бывший член Либеральной партии.\n\nОн также был одним из основателей предшественника Партии фермеров и теперь стал лидером нынешней Партии фермеров. Норвегия, будучи сторонником аграрной реформы и человеком со множеством талантов, теперь может пользоваться плодами его разнообразного опыта."
  NOR_ivar_lykke:0 "Ивар Люкке"
  NOR_ivar_lykke_desc:0 "Родившийся в городе, который когда-то называли Тронхейм, Ивар Люкке был сыном бакалейщика и бизнесмена. После работы в предприятии отца, он впервые приобщился к политике, когда представлял торговые отрасли в местной политике. Он был избран в норвежский парламент в 1916 году и был отмечен как умеренный и трезвый политик, представлявший интересы практически настроенных бизнесменов.\n\nПринятие им социально-либеральных реформ, а также его приятная и скромная манера поведения снискали ему большое доверие на протяжении многих лет. Он отклонил свою первую возможность стать премьер-министром, но в 1926 году было сформировано его правительство с ним во главе в качестве премьер-министра Норвегии. После этого он продолжил свою работу в политике, примером чего является спор о названии его родного города Тронхейм. Вопрос заключался в том, следует ли по-прежнему называть его Тронхейм или вернуть старое норвежское название Нидарос. В марте 1931 года этот спор закончился на компромиссном предложении Люкке — Трондхейм."
  NOR_carl_joachim_hambro:0 "Карл Иоахим Хамбро"
  NOR_carl_joachim_hambro_desc:0 "Родился в 1885 году в Бергене. Большую часть своей взрослой жизни он проработал журналистом и главным редактором Morgenbladet (первой ежедневной газеты страны). Неудивительно, что он также опытный ритор, а с 1919 года он избирался в национальное собрание Норвегии и высший законодательный орган Стортинг. С тех пор он занимал важные должности, такие как лидер парламента от Хёйре, президент Стортинга и вице-президент Стортинга.\n\nЗаслуженный человек, награжденный Большим крестом ордена Святого Олава в 1937 году, и знающий человек в литературе как старой, так и новой, Хамбро может сделать дело правильно (и быстро, когда это необходимо)."
  NOR_johan_ludwig_mowinckel:0 "Йохан Людвиг Мувинкель"
  NOR_johan_ludwig_mowinckel_desc:0 "Юхан Людвиг Мувинкель родился в Бергене в 1870 году в одной из старейших торговых семей Норвегии. Изучал язык и делопроизводство за границей, в Германии, Англии и Франции. В 1898 году купил свою первую лодку и занимался судоходной компанией под своим именем. Вскоре после этого он вошел в городской совет Бергена, и был мэром во время расторжения Союза между Норвегией и Швецией. В 1907 году он впервые занял пост в норвежском парламенте.\n\nС тех пор Юхан Л. Мувинкель позже стал частью нескольких правительств, трижды занимая пост премьер-министра, и часто занимал другие важные должности, такие как президент Стортинга (норвежский парламент), министр промышленности, министр торговли, и министр иностранных дел среди прочих позиций. Он действительно важная фигура в норвежской политике."
  NOR_haakon_vii:0 "Хаакон VII"
  NOR_haakon_vii_desc:0 "Король Хокон VII при рождении носил имя Кристиан Фредерик Карл Георг Вальдемар Аксель и был принцем Дании и Исландии (1872 г.). В молодости он служил в Датском королевском флоте, с 1893 г. в звании лейтенанта. В 1896 г. в Букингемском дворце он женился на британской принцессе Мод (в ее честь названы Норвежские антарктические территории). С тех пор Карл (имя, которое он использовал чаще всего) и Мод вели образ жизни между Данией и Великобританией.\n\nВсе изменилось, когда норвежские политики предложили принцу Карлу стать королем независимой Норвегии, поскольку союз между Норвегией и Швецией распался. 18 ноября 1905 г. принц Карл телеграфировал о том, что принимает имя Хокон VII, и что его сын и наследник (Александр) будет назван Олавом. 25 ноября он прибыл в Норвегию, а 27-го принес присягу, как первый независимый король Норвегии за 518 лет.\n\nВ настоящий момент, несмотря на некоторые дальнейшие беспрецедентные изменения в традициях, демократично настроенный Хокон неожиданно занимает более абсолютную и традиционную позицию короля. Какой же безумец мог стоять за подобными преобразованиями?"
  NOR_monarchist_coalition:0 "Коалиция монархистов"
  NOR_monarchist_coalition_desc:0 "Политики и не политики, сельские жители, горожане и все, кто между ними. Аграрии, консерваторы, монархисты, либералы и другие. Монархическая коалиция - это большая группа важных государственных деятелей и граждан с различными взглядами на то, как нужно действовать в том или ином вопросе, но у них есть нечто общее - монархическое и традиционалистское дело, возвращение Королевству Норвегия его старого, поистине независимого прошлого."
  NOR_vidkun_quisling:0 "Видкун Квислинг"
  NOR_vidkun_quisling_desc:0 "Видкун Квислинг, родом из Фирeсдаля, был талантливым студентом, изучавшим гуманитарные науки, историю и естественные науки. В 1905 году он поступил в Норвежскую военную академию, получив самый высокий балл на вступительных экзаменах среди 250 кандидатов в том году. Он так хорошо учился, что был представлен королю, а затем продолжил службу в качестве офицера. Во время Первой мировой войны он ненавидел настроения в пользу мира, но смягчил свои взгляды после того, как увидел огромные человеческие потери войны.\n\nС тех пор он служил атташе, был экспертом в вооруженных силах по российским делам, помогал Фритьофу Нансену организовывать гуманитарную помощь после Первой мировой войны, дважды женился, увлёкся норвежским коммунистическим движением (без сомнения, вдохновлённым эффективными народными ополчениями Советского Союза), служил министром обороны в аграрном правительстве Педера Кольстада (несмотря на то, что он не был ни аграрием, ни другом Кольстада, но его опыт и знания были неоспоримы), и, наконец, помог сформировать политическую партию \"Nasjonal Samling\" из бывшего политического движения \"Nordisk folkereisning i Norge\". Теперь он наконец представляет партию, которая следует его собственным политическим взглядам, особому сочетанию национализма и социализма."
  NOR_adam_egede-nissen:0 "Адам Эгеде-Нисcен"
  NOR_adam_egede-nissen_desc:0 "Адам Хьялмар Эгеде-Ниссен родился на ферме в муниципалитете Фрол. В молодости он изучал философию, работая в почтовой службе, в конечном итоге став в 1897 году начальником местного распределительного центра Вардё недалеко от российской границы. В 1900 году его политическая карьера впервые привела его в норвежский парламент в качестве представителя либеральной партии Венстре. В 1905 году он переключил свою политическую лояльность на Лейбористскую партию, где отказался от очередного срока в парламенте в 1912 году в пользу продолжения работы на норвежской почтовой службе.\n\nОбладая опытом как в обычной работе, так и в политике, Эгеде-Ниссен был не чужд более радикальных подходов к делу, незаконно пронося контрабандой и печатая революционную литературу, а также создав радикальный Союз шахтеров в 1906 году. Его пребывание в Вардё дало ему представление о растущих революционных настроениях в России, которые он с тех пор поддерживал в значительной степени. Он был мэром Ставангера с 1915 по 1919 год, в течение которого был оштрафован за участие в всеобщей забастовке 1919 года в поддержку русской революции. В 1918 году он также ездил в Россию и встречался с Лениным, а также присутствовал на встрече, посвященной формированию ныне известного Коминтерна. Когда Лейбористская партия раскололась в 1923 году, Эгеде-Ниссен последовал за более радикальными политиками и вступил в Норвежскую коммунистическую партию, НКП."
  NOR_monarch_has_advisor_role:0 "Монарх имеет роль советника"
  NOR_monarch_has_field_marshal_role:0 "Монарх имеет роль фельдмаршала"
  NOR_monarch_has_naval_commander_role:0 "Монарх имеет роль морского командира"
