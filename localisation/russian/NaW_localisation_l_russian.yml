 ####--Закладки--####
 NORWAY_GATHERING_STORM_DESC:0 "Начало 1900-х годов стало едва ли не золотым веком для Норвегии. После обретения независимости, экономического роста, полярных исследований и расширения территорий на обоих концах земного шара Королевство Норвегия оставило свой след в мире. Однако не все было гладко. Норвежский нейтральный торговый флот понес потери во время Первой мировой войны, а совсем недавно Великая депрессия несколько приостановила экономику.\n\nНесмотря на то, что политика в области социального обеспечения под руководством правительства лейбористов направлена на решение этих проблем, эта политика \"сломанного ружья\" с меньшими расходами на оборону подвергла Норвегию некоторому риску..."
  NORWAY_BLITZKRIEG_DESC:0 "Начало 1900-х было близко к золотому веку для Норвегии. С независимостью, экономическим ростом, полярными исследованиями и расширенными территориями на обоих концах земного шара, Королевство Норвегия оставило свой след в мире. Однако все было не так гладко, поскольку нейтральный торговый флот Норвегии понес потери во время Великой войны, а в последнее время Великая депрессия несколько приостановила экономику.\n\nХотя политика в области социального обеспечения, проводимая правительством лейбористов, была направлена на смягчение этих проблем, эта политика «сломанного ружья» с меньшими расходами на оборону подвергла Норвегию некоторому риску..."

  ####--События--####
  naw_norway.1.t:0 "Норвегия приглашает в «Трёх Братьев»"
  naw_norway.1.d:0 "В государственном гимне Норвегии, шестой куплет, есть часть о том, как скандинавы должны стоять вместе во время войн. Норвежцы сейчас возрождают движение панскандинавизма, и они обращаются к нам."
  naw_norway.1.a:0 "Братья навек!"
  naw_norway.1.b:0 "Может, не навек..."

  naw_norway.2.t:0 "[From.GetName] присоединяется к «Трём Братьям»"
  naw_norway.2.d:0 "Наш брат [From.GetName] присоединился к нашему альянсу. Пусть наши народы вместе стоят за победу."
  naw_norway.2.a:0 "Мы едины!"

  naw_norway.3.t:0 "[From.GetName] отвергает наш призыв"
  naw_norway.3.d:0 "[From.GetName] почему-то посчитал, что для них лучше держаться подальше от нашей блестящей идеи товарищества."
  naw_norway.3.a:0 "Может, в другой раз..."
  naw_norway.4.t:0 "Предложение о четырёхлетних сроках принимается"
  naw_norway.4.d:0 "Норвежский парламент недавно постановил, что с этого момента выборы в норвежский парламент будут проходить каждые четыре года вместо каждых трёх, начиная с настоящего момента. Возможно, они надеются, что правительство, находящееся у власти, сможет добиться большего за один дополнительный год. Конечно, нельзя отрицать, что один дополнительный год стабильности на работе может быть приятным побочным эффектом для наших представителей."
  naw_norway.4.a:0 "Ладно, хорошо."
  naw_norway.4.b:0 "Хах, эти хитрые негодяи."
  naw_norway.4.c:0 "А теперь вернёмся к дискуссии о «самнорске»..."
  
  naw_norway.5.t:0 "[From.GetName] принимает предложение о четырёхлетних сроках"
  naw_norway.5.d:0 "Парламентские представители [From.GetName] недавно приняли предложение об увеличении сроков их полномочий с трёх до четырёх лет, вступающее в силу немедленно. Несомненно, они надеются, что действующее правительство сможет добиться большего с дополнительным годом. Предложение было принято без проблем."
  naw_norway.5.a:0 "Хорошо, допустим."
  naw_norway.5.b:0 "У меня нет сильных чувств по этому поводу."
  naw_norway.5.c:0 "Норвежская политика? Фу!"
  
  naw_norway.6.t:0 "[From.GetName] поддерживает новое братство"
  naw_norway.6.d:0 "Наш брат [From.GetName] поддерживает нас в расширении сферы нашего альянса. Пусть наши свободные нации будут стоять вместе, как братья."
  naw_norway.6.a:0 "Мы действительно едины в своих желаниях!"
  
  naw_norway.7.t:0 "Норвегия подаёт ходатайство о научном сотрудничестве в Северной Европе"
  naw_norway.7.d:0 "Наш сосед пригласил нас к совместному исследовательскому сотрудничеству в рамках Северного совета, заявляя, что это приведет к улучшению и благу всех стран Скандинавии. Ознакомление с достижениями наших соседей может принести нам только пользу. Вопрос в том, видим ли мы какие-либо недостатки в том, что у них будет доступ к нашим достижениям?"
  naw_norway.7.a:0 "Большее количество технологических достижений в руках скандинавов пойдет нам на пользу!"
  naw_norway.7.b:0 "Сотрудничество в области исследований звучит выгодно. Почему бы нам не дать им периодически пользоваться нашими химиками?"
  naw_norway.7.c:0 "Наши технологические достижения в чужих руках? Звучит немного рискованно..."

  naw_norway.8.t:0 "[From.GetName] присоединилась к Североевропейскому исследовательскому сотрудничеству"
  naw_norway.8.d:0 "[From.GetName] мудро решила присоединиться к нашему исследовательскому сотрудничеству"
  naw_norway.8.a:0 "И благодаря этому мы все станем еще мудрее"

  naw_norway.9.t:0 "[From.GetName] отказывается присоединиться к Североевропейскому исследовательскому сотрудничеству"
  naw_norway.9.d:0 "[From.GetName] по-видимому больше защищает свои технологии, чем мы предполагали"
  naw_norway.9.a:0 "Мы ожидали от них большего"

  naw_norway.10.t:0 "Приглашение в Североевропейское исследовательское сотрудничество"
  naw_norway.10.d:0 "Норвегия прислала нам приглашение в Североевропейское исследовательское сотрудничество, соглашение, которое, по их словам, принесет взаимную выгоду всем скандинавским странам путем обмена технологическими разработками"
  naw_norway.10.a:0 "Конечно, Финляндия присоединится. Loistava aloite!"
  naw_norway.10.b:0 "Хорошие идеи должны быть общими. Loistava aloite!"
  naw_norway.10.c:0 "Неплохое предложение, но мы не можем рисковать, чтобы наши технологии не попали в плохие руки."
  naw_norway.11.t:0 "[From.GetName] присоединился к исследовательскому сотрудничеству"
  naw_norway.11.d:0 "[From.GetName] мудро решил присоединиться к нашему исследовательскому сотрудничеству."
  naw_norway.11.a:0 "Наш брат финн, теперь он в деле."
  naw_norway.12.t:0 "[From.GetName] отказался присоединяться к исследовательскому сотрудничеству"
  naw_norway.12.d:0 "[From.GetName] по-видимому более ревностно охраняет свои технологии, чем мы предполагали."
  naw_norway.12.a:0 "Наш брат финн, пинок в голень?"
  naw_norway.13.t:0 "Норвегия хочет сотрудничать с учеными Содружества"
  naw_norway.13.d:0 "Скандинавское государство через море хочет заключить соглашение об исследовательском сотрудничестве со странами Содружества. Их ученые будут тесно работать с нашими и делиться своими достижениями."
  naw_norway.13.a:0 "Технологический обмен был бы взаимовыгодным."
  naw_norway.13.b:0 "Сотрудничать с нашими друзьями только правильно."
  naw_norway.13.c:0 "Это было бы слишком однобоким. Зачем нам обменивать тузы на трефы?"
  naw_norway.14.t:0 "[From.GetName] согласился заключить соглашение о проведении исследований"
  naw_norway.14.d:0 "[From.GetName] любезно заключил соглашение о проведении исследований и пригласил наших ученых принять участие, поделиться опытом и поучиться."
  naw_norway.14.a:0 "Замечательно."
  naw_norway.15.t:0 "[From.GetName] отказывает нам в доступе к исследованиям Содружества"
  naw_norway.15.d:0 "[From.GetName] по всей видимости дорожит своей передовой электроникой и кораблями и отказал нам в доступе к исследованиям Содружества."
  naw_norway.15.a:0 "Чёртовы негодяи."
 
  naw_norway.16.t:0 "Норвегия хочет сотрудничать с учёными Оси"
  naw_norway.16.d:0 "Наши северогерманские друзья хотят заключить соглашение о научном сотрудничестве между странами Оси. Их учёные будут тесно сотрудничать с нашими и обмениваться своими разработками."
  naw_norway.16.a:0 "Технологический обмен будет взаимовыгодным."
  naw_norway.16.b:0 "Сотрудничать с нашими друзьями - правильно."
  naw_norway.16.c:0 "Нейн. Им придётся довольствоваться лизингом или лицензией на наше оборудование."
 
  naw_norway.17.t:0 "[From.GetName] согласился заключить соглашение о научном сотрудничестве"
  naw_norway.17.d:0 "[From.GetName] любезно заключил соглашение о научном сотрудничестве и пригласил наших учёных поучаствовать, внести свой вклад и поучиться."
  naw_norway.17.a:0 "Danke schön."
 
  naw_norway.18.t:0 "[From.GetName] отказал нам в доступе к исследованиям Оси"
  naw_norway.18.d:0 "[From.GetName] по всей видимости дорожит своими передовыми методами шифрования, танками и оружием и отказал нам в доступе к исследованиям Оси."
  naw_norway.18.a:0 "Ach so..."
 
  naw_norway.19.t:0 "Норвегия хочет сотрудничать с учёными Коминтерна"
  naw_norway.19.d:0 "Наши социалистические товарищи на западе хотят заключить соглашение о научном сотрудничестве между нашими странами. Их учёные будут тесно сотрудничать с нашими и обмениваться своими разработками."
  naw_norway.19.a:0 "Технологический обмен был бы взаимовыгодным."
  naw_norway.19.b:0 "Сотрудничать с нашими друзьями - это единственно правильное решение."
  naw_norway.19.c:0 "Нет. Мы не можем быть слишком осторожны в эти дни."
  
  naw_norway.20.t:0 "[From.GetName] согласился заключить Исследовательское соглашение"
  naw_norway.20.d:0 "[From.GetName] любезно заключил Исследовательское соглашение и пригласил наших ученых принять участие, внести свой вклад и поучиться."
  naw_norway.20.a:0 "Мы поступили правильно, поверив нашим товарищам."
  
  naw_norway.21.t:0 "[From.GetName] отказывает нам в доступе к исследованиям Коминтерна"
  naw_norway.21.d:0 "[From.GetName], похоже, очень дорожит своим эффективным промышленным производством и умными бронетанковыми вариантами и отказал нам в доступе к исследованиям Коминтерна."
  naw_norway.21.a:0 "Пусть будет, что будет."
  
  naw_norway.22.t:0 "Норвегия приглашает нас в Братство демократических наций"
  naw_norway.22.d:0 "Норвежцы и их союзники, до недавнего времени известные как Альянс трех братьев, Альянс четырех братьев или Северное братство, в зависимости от того, кого спросить, недавно пригласили нас присоединиться к своему недавно переименованному альянсу. Несомненно, они надеются сохранить свой дипломатический импульс, и этот альянс мог бы быть полезен для нашей собственной безопасности и политического влияния, но это также означало бы обязательство перед нашими потенциально новыми друзьями."
  naw_norway.22.a:0 "Мы - Братья!"
  naw_norway.22.b:0 "Я думаю, что мы будем поддерживать отношения на уровне дружеских знакомств."
  naw_norway.22.c:0 "Мы - братья, и братьев следует ставить выше нынешних друзей."
  naw_norway.22.p:0 "Мы не можем предать наших нынешних союзников!"

  naw_norway.23.t:0 "[From.GetName] присоединяется к Братству демократических наций"
  naw_norway.23.d:0 "Наш брат [From.GetName] присоединился к нашему Братству. Пусть наши народы объединятся ради победы."
  naw_norway.23.a:0 "Нас много, но мы едины!"

  naw_norway.24.t:0 "[From.GetName] отвергает нашу милостивую руку"
  naw_norway.24.d:0 "[From.GetName] посчитал в своих интересах остаться вне нашего Братства, объединяющего сердечных, сильных и любящих свободу наций. Кто знает, что было у них на уме?"
  naw_norway.24.a:0 "Досадно..."

  naw_norway.25.t:0 "[From.GetName] переименовал нашу фракцию в Демократическое братство наций"
  naw_norway.25.d:0 "Расширение фракции может потребовать смены названия на более всеобъемлющее."
  naw_norway.25.a:0 "Может быть, действительно необходим новый мировой фокус."

  naw_norway.26.t:0 "[From.GetName] требует Петсамо"
  naw_norway.26.d:0 "Наш сосед, [From.GetName], предъявил свои старые претензии на Кольский полуостров и хотел бы иметь общую границу с преимущественно населенным русскими полуостровом. Для этого он потребовал, чтобы мы уступили ему нашу самую северную территорию, Петсамо. Несмотря на то, что она малонаселенная, она содержит ценные месторождения никеля и остается нашим единственным выходом в Баренцево море. Какие меры нам принять?"
  naw_norway.26.a:0 "Отдать Петсамо. Пусть они теребят медведя, если им так хочется..."
  naw_norway.26.b:0 "Отдать нашим друзьям, но мы ожидаем компенсации."
  naw_norway.26.c:0 "Петсамо принадлежит финнам."

  naw_norway.27.t:0 "[From.GetName] уступает право собственности на Петсамо"
  naw_norway.27.d:0 "Финны мудро уступили нам право собственности на малонаселенный, но богатый ресурсами район Петсамо. Благодаря этому у нас теперь появилась общая граница с нашими старинными средневековыми владениями. Это доказательство высокого положения нашей нации в Европе, а также проницательности наших дипломатов и государственных деятелей."
  naw_norway.27.a:0 "Слава Норвегии и нашим государственным деятелям!"

  naw_norway.28.t:0 "[From.GetName] отклоняет наши требования о Петсамо"
  naw_norway.28.d:0 "Финны заявили, что характер и протяженность их границ не подлежат обсуждению, и поэтому они не уступят нам Петсамо, какими бы ни были наши причины для предъявления требований. Похоже, в их характере и стремлении разочаровывать нас... Им была направлена официальная нота протеста, но на данный момент нам придется смириться с их решением."
  naw_norway.28.a:0 "В ноте было сказано, насколько они нас разочаровали?"

  naw_norway.29.t:0 "[From.GetName] требует, чтобы мы подчинились революции"
  naw_norway.29.d:0 "Норвежцы, недавно победив датчан и шведов, теперь требуют, чтобы мы подчинились их власти и их коммунистическим идеалам. Учитывая их контроль над Скандинавией, их все более многочисленную армию и их связи с Советами, отказ им может быть очень опасным. С другой стороны, с любым выбором наша независимость может оказаться под угрозой..."
  naw_norway.29.a:0 "Нам придется подчиниться. С врагами с обеих сторон у нас просто нет другого выбора..."
  naw_norway.29.b:0 "Нам придется подчиниться. С врагами с обеих сторон у нас просто нет другого выбора..."
  naw_norway.29.c:0 "Норвежцы ужесточили контроль над нашей страной"
  naw_norway.29.p:0 "Норвежцы ужесточили контроль над нашей страной"
  naw_norway.29.e:0 "Здесь мы займем свою позицию, и независимая Финляндия здесь останется."
  
  naw_norway.30.t:0 "[From.GetName] подчиняется нам"
  naw_norway.30.d:0 "Финны решили предоставить нам контроль над большей частью государственных дел. С этим все северные страны подчиняются нам."
  naw_norway.30.a:0 "Отлично."
  
  naw_norway.31.t:0 "[From.GetName] отказывается подчиняться нам"
  naw_norway.31.d:0 "Финны решили отклонить наше щедрое предложение подчинения нам и сохранения автономии. По-видимому, они предпочли бы, чтобы нас разделили мы и Советы, и, по-видимому, крепкие спиртные напитки слишком легко достаются финским государственным деятелям. Теперь нам нужно решить: стоит ли распространение революции на финский народ войны?"
  naw_norway.31.a:0 "На войну."
  naw_norway.31.b:0 "Быть или не быть войне?"
  naw_norway.32.t:0 "[From.GetName] встает на сторону Германии после того, как мы обещали ей Шлезвиг"
  naw_norway.32.d:0 "Норвежское руководство решило встать на сторону Германии, чтобы отговорить их от нападения. Естественно, многие датчане теперь расстроены, так как мы отказались от наших островов в Северной Атлантике в обмен на поддержку, чтобы вернуть весь Шлезвиг и, возможно, Гольштейн тоже. И более того, если Германия победит другие великие державы, как мы сможем защититься от нее тогда? Мы даже находимся на ее границе... По крайней мере мы могли бы направить наши жалобы норвежцам, чтобы удовлетворить нашу общественность и, возможно, получить что-то от этого?"
  naw_norway.32.a:0 "Направить наши жалобы в правительство Норвегии"
  naw_norway.32.b:0 "Воздержаться от жалоб, по крайней мере, у нас сейчас есть мир"
  naw_norway.33.t:0 "[From.GetName] понимает наше решение встать на сторону Германии"
  naw_norway.33.d:0 "Датчане, хотя и расстроены, потому что мы обещали им помощь в возвращении Шлезвига, понимают наш прагматизм в том, чтобы встать на сторону Германии, немедленной безопасности должен быть отдан приоритет. И кто знает, если Германия начнет проигрывать войну, дружба с ней может не продлиться..."
  naw_norway.33.a:0 "[From.GetName] понимает наш прагматизм"
  naw_norway.34.t:0 "[From.GetName] направляет жалобы на то, что мы встали на сторону Германии"
  naw_norway.34.d:0 "Датские лидеры, похоже, довольно разозлились из-за того, что мы приняли сторону Германии. Во-первых, это вопрос о том, как мы пообещали помочь вернуть Шлезвиг, во-вторых, есть вероятность, что немцы могут прийти к нам и к теперешней датской части Шлезвига, если они станут сильнее, несмотря на то, что мы приняли сторону. Как мы с этим справимся?"
  naw_norway.34.a:0 "Им нужно компенсировать! Денежная компенсация и Гренландия в качестве залога."
  naw_norway.34.b:0 "Оставить Гренландию обратно к ним в качестве залога на данный момент."
  naw_norway.34.c:0 "Дураки! Разве они не понимают, что мы должны были это сделать? Они ничего не получат."
  
  naw_norway.35.t:0 "Норвежцы соглашаются на значительные компенсации"
  naw_norway.35.d:0 "Кажется, норвежцы действительно поняли наши претензии. Они передали нам Гренландию обратно в качестве временного залога, помимо выплаты нам огромной денежной компенсации, которую мы теперь перенаправляем в наши отрасли."
  naw_norway.35.a:0 "Это правильно, что они платят, но спасибо."
  
  naw_norway.36.t:0 "Норвежцы передают Гренландию"
  naw_norway.36.d:0 "На данный момент норвежцы передали нам Гренландию в качестве залога, пока остальная часть Шлезвига не станет нашей. Мы не выиграли дело о Гренландии зря! И наша общественность теперь успокоилась."
  naw_norway.36.a:0 "Приемлемо."
  
  naw_norway.37.t:0 "Норвежцы отказали нам в компенсации"
  naw_norway.37.d:0 "Заявив, что они сделали то, что необходимо, норвежцы отказали нам в компенсации, заявив, что присоединение к Германии было необходимо для выживания всех наших народов. Нам будет нелегко это сгладить, но такой шаг и их нежелание идти на компромисс, безусловно, еще больше подорвали доверие к норвежским политикам."
  naw_norway.37.a:0 "Это была худшая торговая сделка в истории торговых сделок."
  
  naw_norway.38.t:0 "Поддерживая нашу часть сделки"
  naw_norway.38.d:0 "Шлезвиг-Гольштейн наш, и норвежцы сдержали свою часть сделки. Сейчас принимаются меры, чтобы передать Гренландию обратно им, как это было нашей частью сделки."
  naw_norway.38.a:0 "Теперь позаботьтесь о гренландцах!"
  
  naw_norway.39.t:0 "[From.GetName] передал нам Гренландию обратно"
  naw_norway.39.d:0 "Датчане, признавая, что наша часть сделки по возвращению Шлезвига была выполнена, передали нам Гренландию еще раз. Больше не являясь временным залогом, Гренландия теперь является частью норвежского королевства, а инуиты станут норвежскими гражданами."
  naw_norway.39.a:0 "Замечательно. Как часто вы видите цепь событий с моралью?"
  
  naw_norway.40.t:0 "[From.GetName] присоединяется к русским после того, как пообещал нам Карелию"
  naw_norway.40.d:0 "Норвежские лидеры решили встать на сторону русских, чтобы избежать их нападений. Разумеется, некоторых финнов теперь расстраивает то, что мы отказались от наших островов в Балтике в обмен на поддержку по возвращению Карелии и окончанию восточной угрозы. И более того, если русские победят другие крупные державы, как мы сможем защититься от них тогда? У нас общая с ними огромная граница! Как минимум мы могли бы высказать наши претензии норвежцам, чтобы успокоить общественность и, возможно, извлечь из этого какую-то выгоду?"
  naw_norway.40.a:0 "Высказать наши претензии норвежскому правительству."
  naw_norway.40.b:0 "Воздержаться от жалоб, по крайней мере, сейчас у нас есть мир."
  
  naw_norway.41.t:0 "[From.GetName] понимает наше решение встать на сторону России."
  naw_norway.41.d:0 "Финны, хотя и расстроены тем, что мы обещали им помощь в возвращении Карелии, но, вероятно, больше тем, что мы встали на сторону угрозы, которая однажды может напасть на них, понимают наш прагматизм в сотрудничестве с Россией. Волнуясь за будущее, они признают, что первоочередное значение имеет немедленная безопасность. И кто знает, если Россия начнет проигрывать войну, дружба с ними может не сохраниться..."
  naw_norway.41.a:0 "[From.GetName] понимает наш прагматизм."
  
  naw_norway.42.t:0 "[From.GetName] предъявляет претензии по поводу того, что мы встали на сторону Советского Союза."
  naw_norway.42.d:0 "Финские лидеры, похоже, сильно рассержены тем, что мы встали на сторону русских. Сначала возник вопрос, как мы обещали помочь вернуть оставшуюся часть Карелии, а затем что Советы могут прийти за нами и Финляндией, если они станут сильнее, несмотря на то, что мы приняли их сторону. Во всяком случае, так считают финны. Как нам с этим справиться?"
  naw_norway.42.a:0 "Им нужно компенсировать! Дать им денежную компенсацию."
  naw_norway.42.b:0 "Мы не можем компенсировать их сейчас, нам нужны наши ресурсы, чтобы построить свою собственную оборону."
 
  naw_norway.43.t:0 "Норвежцы согласны на компенсацию"
  naw_norway.43.d:0 "Кажется, норвежцы поняли наши претензии. Они собираются дать нам денежную компенсацию, которую мы перенаправим в наши отрасли промышленности."
  naw_norway.43.a:0 "Это пока сойдет, спасибо."
 
  naw_norway.44.t:0 "Норвежцы отказали нам в компенсации"
  naw_norway.44.d:0 "Утверждая, что они сделали все необходимое, норвежцы отказали нам в компенсации, заявив, что союз с Советами был необходим для выживания всех наших стран. Хотя расширение Карелии - это одно, защита наших границ от русских в долгосрочной перспективе является главной проблемой, и то, что норвежцы со своей удобной позиции вдали от угрозы даже не компенсируют нас, крайне разочаровывает..."
  naw_norway.44.a:0 "Защищенные, наивные дураки..."
 
  naw_norway.45.t:0 "Моция о недоверии - Кто возглавит новое правительство?"
  naw_norway.45.d:0 "Прежнее правительство было свергнуто в результате вотума недоверия. Новое правительство, возглавляемое нашей консервативной партией Høyre, будет восстановлено. Однако, пока согласовываются детали, нам нужно будет принять решение о том, кто должен стать премьер-министром Норвегии. Сейчас выбор стоит между двумя хорошими кандидатами."
  naw_norway.45.a:0 "Ивар Люкке. Он имеет соответствующий опыт и способен идти на компромиссы, когда это необходимо."
  naw_norway.45.b:0 "К.И. Хамбро. Он хочет получить эту должность и имеет разнообразный опыт в политике и журналистике."
  naw_norway.50.t:0 "[From.GetName] предлагает сделку"
  naw_norway.50.d:0 "После отделения Норвегии от датского королевства в 1814 году по Кильскому договору мы получили во владение их бывшие североатлантические острова: Гренландию, Исландию и Фарерские острова. Несмотря на разногласия по этому поводу с временной оккупацией восточной Гренландии норвежскими ирредентистами, теперь норвежцы пришли к нам дипломатически, хотя и с другими требованиями.\n\nВ обмен на передачу им их бывших островов Фарерских и Исландии норвежцы откажутся от претензий на Гренландию, будут защищать нас в случае нападения немцев, а также помогут договориться о возвращении Шлезвига и частей Голштинии, если такая возможность возникнет. Хотя требования довольно обширны, североатлантические острова не являются самым экономически важным районом нашей страны, а возвращение Шлезвига оказалось бы гораздо более выгодным. Должны ли мы принять или отклонить это предложение или, возможно, предложить компромисс, учитывая, что требования довольно обширны?"
  naw_norway.50.a:0 "Принять и добавить Гренландию. Мы должны во что бы то ни стало подружиться с нашими соотечественниками на севере!"
  naw_norway.50.b:0 "Принять. Острова были норвежскими, и Шлезвиг-Голштиния были бы для нас более ценными."
  naw_norway.50.c:0 "Договориться сохранить Исландию. Сделка сейчас очень выгодна Норвегии."
  naw_norway.50.e:0 "Отклонить сделку, только норвежцы увидят здесь немедленную выгоду..."
  
  naw_norway.51.t:0 "[From.GetName] принимает сделку"
  naw_norway.51.d:0 "Предлагаемая датско-норвежская сделка была принята [From.GetName], и наши старые острова теперь снова под нашим контролем. Если мы когда-нибудь сможем вернуть Шлезвиг Дании, нам придется сделать это, чтобы выполнить свою часть сделки."
  naw_norway.51.a:0 "Датчане действительно хорошие союзники, помогающие нам выполнить несправедливый Кильский договор."

  naw_norway.52.t:0 "[From.GetName] принимает сделку с уловом"
  naw_norway.52.d:0 "Хотя датчанам понравилась общая идея сделки, они, как и следовало ожидать, нашли ее немного односторонней, поскольку мы - единственные, кто видит в ней немедленную выгоду. Таким образом, они предложили, казалось бы, разумное встречное предложение, в котором сделка была изменена, чтобы они сохранили Исландию. Наши иностранные дипломаты посчитали это достаточно разумным и приняли измененную сделку."
  naw_norway.52.a:0 "Не идеально, но вполне приемлемо."

  naw_norway.53.t:0 "[From.GetName] отклоняет сделку"
  naw_norway.53.d:0 "Ссылаясь на отсутствие непосредственных выгод для [From.GetName] и чрезмерных требований с нашей стороны, датчане отклонили нашу просьбу вернуть наши острова в обмен на поддержку в возвращении Шлезвиг-Гольштейна. Хотя это является серьезной неудачей для нашего дипломатического пути к усилению влияния, мы делаем это рискованным путем и подстрекаем к восстаниям в Исландии и на Фарерских островах, поскольку жители изначально были родом с норвежской материковой части и были частью нашего Королевства. Однако это поставит под угрозу наш союз с Данией, и если Дания не отступит, может разразиться война..."
  naw_norway.53.a:0 "Мы не хотим рисковать дружбой с Данией. Пусть острова останутся у них..."
  naw_norway.53.b:0 "Это неприемлемо. Подстрекайте к восстаниям и выдвигайте наши требования!"
 
  naw_norway.54.t:0 "[From.GetName] подстрекает к сепаратизму на островах!"
  naw_norway.54.d:0 "Подлые норвежцы не смирились с тем, что острова остались у нас, и подстрекают к сепаратистским восстаниям в Исландии и на Фарерских островах. Используя растущие националистические и автономные движения на островах, а также их общие культурные и этнические связи, норвежцы отправили на острова смутьянов и заставили их присоединиться к своей стране. Гренландия остается в безопасности, так как ее жители не имеют таких тесных связей с Норвегией, но нам нужно занять здесь позицию. Следует ли нам принять предыдущую сделку, смириться со сложившимся положением или выйти из альянса и вернуть наши острова силой?"
  naw_norway.54.a:0 "Заберите Гренландию, пока есть возможность сохранить первоначальную сделку и получить их поддержку в возвращении Шлезвига."
  naw_norway.54.b:0 "Не рискуйте. Примите новый статус-кво без поддержки в возвращении Шлезвига."
  naw_norway.54.c:0 "Такие посягательства на нашу территорию недопустимы. К войне!"
 
  naw_norway.55.t:0 "[From.GetName] капитулирует и передает Гренландию"
  naw_norway.55.d:0 "Возбуждение восстаний полностью увенчалось успехом. Датчане сдались, чтобы спасти первоначальную сделку, не желая рисковать войной, и, видя, что линии снабжения с Гренландией слишком длинны, чтобы они стоили поддержания. Поскольку первоначальная сделка была в значительной степени в нашу пользу, мы должны простить их преступления и поддержать их право на Шлезвиг, если это когда-нибудь станет актуальным вопросом."
  naw_norway.55.a:0 "И исландский гамбит окупается."

  naw_norway.56.t:0 "[From.GetName] неохотно принимает новый статус-кво"
  naw_norway.56.d:0 "Датчане, хотя и огорчены нашей грязной игрой, принимают новый статус-кво и остаются в союзе, если их транспортные суда в Гренландию по-прежнему будут заходить в Фарерские острова и Исландию. Кроме того, больше не будет никаких обязательств поддерживать их претензии на Шлезвиг, если мы этого пожелаем."
  naw_norway.56.a:0 "Получить что-то за просто так? Какие у нас политики мирового класса."

  naw_norway.57.t:0 "[From.GetName] объявляет нам войну!"
  naw_norway.57.d:0 "Исландский гамбит дал обратный эффект наихудшим из возможных способов! Сославшись на восстания на островах как на незаконное вмешательство Норвегии, датчане объявили это актом войны и впоследствии мобилизовали свои силы против нас и объявили войну. Единственным положительным моментом в этом является то, что датчане предприняли первые наступательные действия, и это может потенциально убедить другие союзные государства присоединиться к нашей обороне против датчан."
  naw_norway.57.a:0 "Иногда мы получаем больше, чем могли представить. Датчане вынудили нас сделать это..."
  naw_norway.58.t:0 "[From.GetName] принимает сделку, да ещё и больше!"
  naw_norway.58.d:0 "Датско-норвежская сделка была принята [From.GetName], и наши бывшие острова, включая Гренландию, который был включен в сделку из добрых намерений, теперь снова под нашим контролем. Если мы когда-нибудь сможем вернуть Шлезвиг Дании, нам придётся это сделать, чтобы выполнить нашу часть сделки."
  naw_norway.58.a:0 "Датчане - действительно хорошие союзники, помогая нам отменить ущерб от несправедливого Кильского договора."
  naw_norway.59.t:0 "Фенноскандинавская сделка"
  naw_norway.59.d:0 "Опасаясь вторжения на восточные границы своего альянса, фенноскандинавские союзники - Норвегия, Швеция и Финляндия - достигли взаимопонимания в отношении взаимных оборонительных гарантий. Финляндия передала Швеции большинство населенных шведами Аландских островов, а Швеция передала Норвегии бывшую норвежскую территорию Бохуслен.\n\nТем самым Норвегия, страна, которой меньше всего грозит потенциальная российская экспансия, получила стимул защищать своих союзников ближе к опасности. Швеция получила возможность ограничить возможное расширение своего бывшего врага, а у Финляндии теперь есть соседи, пообещавшие защищать ее восточные границы, включая важнейший Карельский перешеек."
  naw_norway.59.a:0 "Друзья всегда могут договориться. А теперь мы должны сделать наши войска надлежащей частью сдерживания."
  naw_norway.59.b:0 "Разве они нам не доверяют? В любом случае, мы должны остерегаться этих коварных соседей..."
  naw_norway.60.t:0 "Хаакон VII отрекается"
  naw_norway.60.d:0 "Столкнувшись с нарастающей радикальной напряженностью в Норвегии, король Хокон VII, сам по себе уважаемый и демократичный человек, решил склониться перед нарастающим давлением, требующим нового вида иерархии в государстве. Его отречение вступило в силу немедленно."
  naw_norway.60.a:0 "Какой бы он ни был хороший король, монархия устарела."
  naw_norway.60.b:0 "Что происходит с нашими друзьями?"
  naw_norway.60.c:0 "Монархия излишня для народа."
  naw_norway.60.p:0 "В Норвегии должна работать радикальная политика..."
  naw_norway.61.t:0 "[From.GetName] предлагает условия"
  naw_norway.61.d:0 "Столкнувшись с натиском нашей военной машины, [From.GetAdjective] руководство решило искать с нами мир и в свою очередь предлагает стать нашим государством-сателлитом. Это приведет к миру между нашими народами, и по мере того, как они становятся нашим субъектом, они присоединятся к любым нашим продолжающимся войнам на нашей стороне. Что мы думаем об этом?"
  naw_norway.61.a:0 "Согласиться на косвенное правление [From.GetName]."
  naw_norway.61.b:0 "Подходит только полная аннексия их страны..."
  naw_norway.62.t:0 "[From.GetName] принимает наши условия"
  naw_norway.62.d:0 "[From.GetName] принял наши условия капитуляции, и отныне мы будем его государством-сателлитом. Это также означает, что у нас нет выбора, кроме как участвовать в любых конфликтах, в которые он может нас втянуть на данный момент. Но возможно, вдали замаячит свобода и мир?"
  naw_norway.62.a:0 "К сожалению, у нас не осталось других вариантов..."
 
  naw_norway.63.t:0 "[From.GetName] отклонил наши условия"
  naw_norway.63.d:0 "[From.GetName] отклонил наши условия капитуляции, по всей видимости, решив, что только прямое правление достаточно хорошо. Это может превратиться в борьбу за нашу независимость и само существование!"
  naw_norway.63.a:0 "Итак, борьба неизбежна, а ставки растут..."

  naw_norway.64.t:0 "Националистическая фракция [Root.GetNameDef]"
  naw_norway.64.d:0 "Действительно, предпринимаются шаги по проектированию нашей позиции и ценностей в отношении мира. Новая фракция может увидеть свет после упорной работы наших представителей и государственных деятелей. Как мы назовем наш новый и сильный союз?"
  naw_norway.64.a:0 "\"Северное сияние\", мы озарим наш свет на завистливый мир."
  naw_norway.64.b:0 "\"Скандинавское собрание\", потому что под нашим руководством, несомненно, соберется все самое лучшее."
  naw_norway.64.c:0 "\"Пакт камня\", потому что мы в первую очередь несокрушимы, как наши горы."
  naw_norway.64.p:0 "Хммм... Покажите мне, пожалуйста, другие варианты..."

  naw_norway.65.t:0 "Националистическая фракция [Root.GetNameDef]"
  naw_norway.65.d:0 "Действительно, предпринимаются шаги к тому, чтобы транслировать нашу позицию и ценности миру. После усердной работы наших представителей и государственных деятелей на свет может появиться новая фракция. Как нам называть наш новый и сильный союз?"
  naw_norway.65.a:0 "\"Северное Королевство\", просто, образно, старомодно."
  naw_norway.65.b:0 "\"Северный Союз\", ибо что такое союз, если не братские нации."
  naw_norway.65.c:0 "Давайте начнем это сначала."
  naw_norway.65.p:0 "Давайте пока не будем делать этот выбор."
 
  naw_norway.70.t:0 "Возрождение старых традиций"
  naw_norway.70.d:0 "Старые традиции [ROOT.GetNameDef] в последнее время переживают романтическое возрождение; люди и политики теперь задаются вопросом, следует ли возродить старые традиции, такие как аристократические титулы (хотя с учетом наших демократических традиций большинство соглашается, что на этот раз титулы должны быть без привилегий). Некоторые даже выступают за возрождение старых названий мест и даже старого флага средневекового Королевства Норвегия. Какие меры нам следует предпринять?"
  naw_norway.70.a:0 "Аристократия устарела, и мы, конечно же, должны придерживаться нашего нынешнего норвежского флага."
  naw_norway.70.b:0 "Аристократические титулы для наших самых достойных граждан, но сохранить наш нынешний флаг."
  naw_norway.70.c:0 "Мы должны уважать наши традиции! У нас будут и аристократия, и наш славный старый флаг."
 
  naw_norway.71.t:0 "Расположение столицы"
  naw_norway.71.d:0 "В прошлом у [ROOT.GetNameDef] было много разных столиц, но главными из них остаются Осло, Берген (ранее известный как Бьоргвин) и Тронхейм (ранее известный как Нидарос). В связи с быстрыми переменами, происходящими в нашем традиционном Королевстве, у нас появилась возможность снова сделать одной из столиц старинный город, если мы того пожелаем. Осло, как и прежде, остается самым крупным городом, расположенным вблизи большинства наших сельскохозяйственных угодий и вмещающим в себя значительную часть наших учреждений, поэтому перенос может оказаться непопулярным среди тамошнего населения…"
  naw_norway.71.a:0 "Оставить столицу в Осло."
  naw_norway.71.b:0 "Перенести столицу в Берген, бывшую столицу и крупный торговый город."
  naw_norway.71.c:0 "Перенести столицу в Тронхейм, бывшую столицу и важное место для паломников и религии."

  naw_norway.72.t:0 "Названия городов прошлого?"
  naw_norway.72.d:0 "Решив ключевые символические вопросы, возможно, настало время подумать о том, стоит ли нам восстанавливать старые географические названия, особенно для наших городов. Следует ли нам придерживаться того, что известно нынешним поколениям, переименовать наши крупнейшие города или даже начать с переименования всех крупных и нескольких небольших городов, чтобы по-настоящему добиться перемен?"
  naw_norway.72.a:0 "Оставить как есть. Самое главное, что Христиании больше нет."
  naw_norway.72.b:0 "Переименовать крупные города. Возвращение Бьоргвина и Нидароса."
  naw_norway.72.c:0 "Необходим масштабный ребрендинг. Начать с Бергена, Тронхейма, Олесунна и Хамара."

  naw_norway.73.t:0 "Монархическая коалиция"
  naw_norway.73.d:0 "Теперь, когда к власти пришла монархическая коалиция, кто должен возглавить ее на первых этапах становления нашего королевства? Наша старейшая политическая партия, Либеральная партия? Наша аграрная партия, выступающая за традиции? Или, может быть, консерваторы?"
  naw_norway.73.a:0 "Либеральная партия."
  naw_norway.73.b:0 "Партия фермеров."
  naw_norway.73.c:0 "Консервативная партия."

  naw_norway.74.t:0 "Масштаб власти"
  naw_norway.74.d:0 "С возрождением старых традиций политики и сторонники нового, но старого государства задаются вопросом, как оно должно управляться. Премьер-министр отвечает перед королем или все еще сохраняет многие парламентские полномочия? Как часто должны проводиться выборы? Какими полномочиями должен обладать король в этом перестроенном королевстве?"
  naw_norway.74.a:0 "Выборы как обычно и традиционная, но конституционная монархия."
  naw_norway.74.b:0 "Больше власти королю. Но все же конституционная монархия с выборами."
  naw_norway.74.c:0 "Премьер-министр должен отвечать перед королем, но выборы по-прежнему должны проводиться."
  naw_norway.74.p:0 "Король будет обладать широкой властью, истинной традиционной монархией."

  naw_norway.75.t:0 "Традиции, за которые стоит бороться?"
  naw_norway.75.d:0 "На волне монархизма, захлестнувшего нашу страну, многие люди примкнули к рядам монархистов. Стоит ли нам воспользоваться моментом и применить силу или подождать, пока люди проникнутся нашей wholesome точкой зрения?"
  naw_norway.75.a:0 "Мы сражаемся на рассвете!"
  naw_norway.75.b:0 "Э, может быть на рассвете скажем, через месяц. Нам нужно подготовиться."
  naw_norway.75.c:0 "Королю бы не понравилось, если бы мы начали войну ради него. Мы со временем убедим их."
  naw_norway.76.t:0 "Готовы сражаться?"
  naw_norway.76.d:0 "Прошел месяц с тех пор, как впервые встретились наши сторонники монархии. Пришло ли время нанести удар, рискуя гражданской войной?"
  naw_norway.76.a:0 "Мы готовы. На войну!"
  naw_norway.76.b:0 "Может быть, это была не такая уж и хорошая идея в конце концов..."
  naw_norway.77.t:0 "Норвегия приглашает нас в свой Альянс"
  naw_norway.77.d:0 "В шестом куплете национального гимна Норвегии говорится о том, что скандинавы должны держаться вместе в войнах. Норвежцы сейчас возрождают движение панскандинавизма (или паннордизма) и протягивают нам руку."
  naw_norway.77.a:0 "Братские Королевства в жизни и смерти!"
  naw_norway.77.b:0 "Может быть, не до смерти..."
  naw_norway.78.t:0 "[From.GetName] присоединяется к [Root.GetFactionName]"
  naw_norway.78.d:0 "Наш брат [From.GetName] присоединился к нашей фракции. Пусть наши народы стоят вместе за Победу!"
  naw_norway.78.a:0 "Еще несколько хороших карт, и у нас будет флеш-рояль."
  naw_norway.79.t:0 "[From.GetName] отвергает наше предложение"
  naw_norway.79.d:0 "[From.GetName] каким-то образом посчитал, что в их интересах отказаться от нашего традиционного альянса."
  naw_norway.79.a:0 "Королевский провал..."
  naw_norway.80.t:0 "Фарерские острова реинтегрированы"
  naw_norway.80.d:0 "Возродив связи с нашими родственниками с Фарерских островов, мы показали им, что они желанные гости и помогли им интегрироваться в их историческую родину. [Root.GetName] приветствует их возвращение домой. Теперь, как нам назвать острова, которые теперь находятся на территории нашей страны?"
  naw_norway.80.a:0 "Букмол - письменный язык большинства."
  naw_norway.80.b:0 "Нюнорск - современный письменный язык, наиболее приближенный к разговорным диалектам и старонорвежскому."
  naw_norway.80.c:0 "Давайте использовать язык коренного населения Фарерских островов для названия их островов."
  naw_norway.81.t:0 "Исландия присоединилась"
  naw_norway.81.d:0 "Судьба вновь объединила нас с островом Викингов. Вначале норвежцы бежали от правления и налогов нашего первого короля, и впоследствии были снова включены в состав Норвежского королевства. Датская уния и Кильский договор когда-то отделили от нас Исландию вместе с Фарерскими островами и Гренландией. Наша схожая культура, история и родство вновь объединили нас."
  naw_norway.81.a:0 "Еще одно событие, достойное саги."
  naw_norway.82.t:0 "Гренландия присоединилась"
  naw_norway.82.d:0 "В то время, как первые норвежские и исландские поселенцы в Гренландии вымерли, Гренландия была возвращена под норвежское управление в результате датско-норвежской миссии, которая достигла острова в 1720-х годах. Кильский договор забрал этот остров у нас, и мы почти ничего не могли с этим поделать. Кроме того, дело с Гренландией тоже обернулось для нас не очень хорошо... Теперь, однако, судьба вернула остров нам. В то время как новые поселенцы этого острова, народ инуитов, были крещены и интегрированы, они изначально не норвежского происхождения, как жители Фарерских островов и Исландии, поэтому здесь интеграция, естественно, шла тяжелее. Но теперь, наконец, инуиты начинают адаптироваться к своей новой стране."
  naw_norway.82.a:0 "Гренландцам будет хорошо в нашей стране."

  naw_norway.83.t:0 "Ямтланд присоединен"
  naw_norway.83.d:0 "Суровые, но прекрасные ландшафты Ямтланда, как и его жители, были присоединены к Норвежской нации. Возникает, однако, вопрос, как назвать это новое дополнение к нашей стране или, точнее, как его назвать. Следует ли нам использовать современный норвежский литературный язык или что-то основанное на другом нашем менее распространенном литературном языке, который является более традиционным и соответствует как диалектам самих ямтландцев, так и нашему граничащему с ним региону Трёнделаг? Есть также вариант вернуться к нашим корням, дав ему его древнее норвежское название."
  naw_norway.83.a:0 "Давайте выберем литературный язык большинства, вариант букмол."
  naw_norway.83.b:0 "Давайте придерживаться традиций и местных диалектов, вариант нюнорск."
  naw_norway.83.c:0 "Давайте вернемся к нашим общим корням, норвежскому варианту."
  
  naw_norway.84.t:0 "Бохуслен реинтегрирован"
  naw_norway.84.d:0 "Бохуслен был норвежской землей в течение 800 лет, прежде чем был потерян в одной из многих войн между датчанами и шведами, в которой мы участвовали из-за нашего союза с Данией. И хотя он был ненадолго отвоеван, он не попал в мирные договоры. Однако теперь события снова привели его в нашу собственность, и народ Бохуслена готов внести свой вклад в свою новую нацию, несомненно, наша долгая история и наше общее наследие помогут."
  naw_norway.84.a:0 "Нас становится больше, как и наша береговая линия."
  naw_norway.84.b:0 "Наша очень старая, норвежская береговая линия."
  naw_norway.84.c:0 "Очень, очень старая, на самом деле..."
  
  naw_norway.85.t:0 "Шетландские острова реинтегрированы"
  naw_norway.85.d:0 "Шетландские острова когда-то были частью норвежского ярлства Оркни, одного из самых высоких титулов, которые можно было получить в Норвежском королевстве. Поскольку они недавно снова перешли в нашу собственность, мы работали над тем, чтобы снова реинтегрировать эти бывшие норвежские острова в нашу страну, и теперь мы добились успеха. Но вопрос остается; Шетландские острова или Хьялтланд?"
  naw_norway.85.a:0 "Шетландские острова - это современное название старого..."
  naw_norway.85.b:0 "Но лучше оригинала не придумать, Хьялтланд!"
  
  naw_norway.86.t:0 "Оркнейские острова реинтегрированы"
  naw_norway.86.d:0 "Острова Оркней когда-то были центром ярлства Оркнейского — одного из высших дворянских титулов, существовавших в королевстве Норвегия. Теперь они неожиданным образом снова стали нашими. Событиями в этом регионе правили народы Норвегии, кельтов и шотландцев, теперь же все они объединены в нашу нацию и готовы стать её гражданами. Но как же теперь называть эту территорию? По-современному, традиционным или старомодным способом?"
  naw_norway.86.a:0 "Современный букмол вполне подойдёт. Норвежский норвежский с новонорвежскими инициативами."
  naw_norway.86.b:0 "Конечно, нюношк! Наречие на основе того, как говорят норвежцы, а не того, как пишут датчане."
  naw_norway.86.c:0 "Давайте начнём с того, с чего закончили, с носителей древнескандинавского языка."
  naw_norway.100.t:0 "Московские процессы"
  naw_norway.100.d:0 "Советский Союз переживает, и будет переживать, крупные и жестокие внутренние изменения. Многие влиятельные и могущественные люди были приговорены в ходе уже печально известных Московских процессов.\n\nМеждународной прессе разрешили присутствовать на них. Примечательно то, что поразительно много обвиняемых признали себя виновными в очень серьезных преступлениях в Союзе. Возможно, их заставили или вынудили признаться в этом? Пытается ли генеральный секретарь избавиться от политических оппонентов?\n\nПо мере того, как новости доходят до Норвегии, СМИ и люди строят догадки о происходящем, а также часто осуждают процессы как несправедливые и подозрительные. Многие наши политические партии теперь дистанцируются от Коминтерна и смягчают свои взгляды. Как нам реагировать на сообщения из Москвы?"
  naw_norway.100.a:0 "Осудить несправедливые суды и позволить нашим СМИ свободно информировать и освещать события."
  naw_norway.100.b:0 "Попытаться скрыть самые страшные стороны, рабочим нужен социализм."
  naw_norway.100.c:0 "Использовать этот фарс для распространения националистических и антикоммунистических настроений."
  naw_norway.100.p:0 "Это доказывает, что нам нужны прочные традиции для борьбы с экстремизмом."

  naw_norway.101.t:0 "[From.GetName] стремится к более тесным связям с Германией"
  naw_norway.101.d:0 "[From.GetLeader] объявил(а), что [From.GetName] должна развивать дружеские и родственные отношения с братским народом Германии. Немецкие министры весьма довольны этим, и во время недавнего государственного визита [From.GetLeader] они согласились содействовать взаимному сотрудничеству между двумя народами."
  naw_norway.101.a:0 "Мы поступили мудро."
  naw_norway.101.b:0 "Что замышляют наши соседи?"
  naw_norway.101.c:0 "Доставайте шнапс, нужно выпить за наших новых друзей!"
  naw_norway.101.p:0 "Друзья наших друзей могут быть и нашими друзьями!"
  naw_norway.101.e:0 "В северо-западной Европе происходит какая-то бестолковая суета."
  naw_norway.101.f:0 "Отметим это событие в нашем докладе."
  naw_norway.102.t:0 "[From.GetName] стремится к более тесным связям с Советским Союзом."
  naw_norway.102.d:0 "\n[From.GetLeader] объявил(а) о дружбе и взаимном сотрудничестве между [From.GetName] и их восточными соседями. Несомненно, норвежцы обрели могущественного друга, и революция распространяется все дальше. Российские министры довольны этим событием, и во время недавнего государственного визита [From.GetLeader] была очевидна взаимная доброжелательность."
  naw_norway.102.a:0 "Мы поступили мудро."
  naw_norway.102.b:0 "Что замышляют наши соседи?"
  naw_norway.102.c:0 "Доставайте водку, нужно выпить за наших новых друзей!"
  naw_norway.102.p:0 "Друзья наших друзей могут быть и нашими друзьями!"
  naw_norway.102.e:0 "В северо-западной Европе происходят какие-то не очень грамотные решения."
  naw_norway.102.f:0 "Нужно принять к сведению эти события."
  naw_norway.140.t:0 "Гражданская война в Норвегии"
  naw_norway.140.d:0 "В эпоху стремительно меняющейся политической ситуации Норвегия решила пойти иным путем, чем такие страны, как СССР, Италия и Германия, с их новыми и беспрецедентными политическими идеологиями. Действительно, в парламентской конституционной монархии Норвегии многие выступали за возвращение к традициям, старым ценностям и старомодному королевству. Хотя на этот раз без правления из Копенгагена или Стокгольма.\n\nТеперь традиционные консервативные, центристские, аграрные и монархические элементы объединили свои силы с большей частью военных, чтобы попытаться восстановить такое государство. В столичном регионе это движение встретило массовое сопротивление, и из Европы начали прибывать добровольцы. Гражданская война в Норвегии, несомненно, началась."
  naw_norway.140.a:0 "Сначала семья и традиции!"
  naw_norway.140.b:0 "Сначала братство и демократия!"
  naw_norway.140.c:0 "Гражданская война по соседству? Нам лучше быть осторожными, если Норвегия может впасть в такой хаос..."
  naw_norway.140.p:0 "Борьба за монархию? Какую пользу это принесет массам? Норвежские монархисты заблуждаются..."
  naw_norway.140.e:0 "Как это могло случиться в Норвегии?"
  naw_norway.141.t:0 "Гражданская война закончилась — оппозиция захвачена!"
  naw_norway.141.d:0 "Захватив Осло и последние оплоты наших противников, мы взяли в плен лидеров тех, кто поднял на нас оружие. Одни говорят, что тех, кто поднял на нас оружие и спровоцировал несчастья гражданской войны, нужно наказать. Другие же призывают к снисходительности, поскольку храбрые люди, боровшиеся за то, во что они верят, могли бы быть полезны новому королевству. Как мы поступим с этими преступниками?"
  naw_norway.141.a:0 "Масштабные исправительные работы для тех, кто вынудил людей взяться за оружие!"
  naw_norway.141.b:0 "Исправительные работы только для самых отъявленных преступников."
 
  naw_norway.142.t:0 "Гражданская война в Норвегии окончена"
  naw_norway.142.d:0 "После захвата Осло победа монархических сил в гражданской войне в Норвегии стала лишь вопросом времени. Монархические и традиционалистские силы боролись за восстановление традиционной монархии, и с окончанием гражданской войны путь к реформам открыт.\n\nКлючевые члены оппозиции предстанут перед судом, а король Хокон, который с самого начала был против гражданской войны, заявил, что рад видеть возвращение мира в Норвегию. Пусть начнется процесс заживления ран."
  naw_norway.142.a:0 "День наш!"
  naw_norway.142.b:0 "Хорошо, норвежский народ больше не будет страдать от ужасов войны."
  naw_norway.142.c:0 "Хорошо знать."
 
  naw_norway.145.t:0 "Сепаратисты на Фарерских островах и в Исландии"
  naw_norway.145.d:0 "Появляются новости о ходе войны между Норвегией и Данией. Норвежцам в союзе с ключевыми жителями Исландии и Фарерских островов удалось поднять восстания против датского правления на бывших норвежских островах. Это обязательно осложнит дело Дании."
  naw_norway.145.a:0 "Дипломатическая победа даже в условиях войны. Наша цель праведна."
  naw_norway.145.b:0 "Это грязная игра, даже по меркам военного времени."
  naw_norway.145.c:0 "Хмм... Может, в конце концов, дело Норвегии и чего-то стоило."
  
  naw_norway.146.t:0 "Управление Гренландией передано [ICE.GetNameDef]"
  naw_norway.146.d:0 "\n\nНыне в качестве автономного герцогства [NOR.GetNameDef] управление Гренландией было передано [ICE.GetNameDef] [NOR.GetAdjective] правительством, вероятно, с согласия [NOR.GetAdjective] монарха. Возможно, отчасти это было сделано для того, чтобы материковые норвежцы могли сосредоточить свои усилия на других направлениях. Хотя это и шаг доверия, советники от [NOR.GetNameDef] были ранее интегрированы в Исландские силы безопасности для обеспечения того, чтобы они могли надлежащим образом защищать находящиеся в их ответственности территории."
  naw_norway.146.a:0 "Гренландия ранее была вотчиной исландцев, и мы справимся с этим."
  naw_norway.146.b:0 "Ранее Гренландия была вотчиной исландцев. Мы уверены, что они смогут с этим справиться."
  naw_norway.146.c:0 "Мы делегируем полномочия местным правительствам? Кажется, кто-то почувствовал себя перегруженным."
  naw_norway.150.t:0 "Монархическая фракция [Root.GetNameDef]"
  naw_norway.150.d:0 "Меры действительно принимаются для трансляции нашей позиции и ценностей всему миру. Новая фракция может появиться на свет после тяжелой работы наших представителей и государственных деятелей. Как нам назвать этот новый, амбициозный союз?"
  naw_norway.150.a:0 "Мне кажется, \"Королевская лига\". А теперь извините, я собираюсь отдохнуть, занявшись футболом."
  naw_norway.150.b:0 " \"Монархический союз\". Зачем заставлять людей что-то додумывать?"
  naw_norway.150.c:0 " \"Союз королей\". Важно использовать именно множественное число \"королей\", чтобы ни у датчан, ни у шведов не возникало никаких идей."
  naw_norway.150.p:0 "Хм... Дайте мне посмотреть другие варианты..."
  naw_norway.151.t:0 "Монархическая фракция [Root.GetNameDef]"
  naw_norway.151.d:0 "Меры действительно принимаются для трансляции нашей позиции и ценностей всему миру. Новая фракция может появиться на свет после тяжелой работы наших представителей и государственных деятелей. Как нам назвать этот новый, амбициозный союз?"
  naw_norway.151.a:0 " \"Родственные королевства\" звучит неплохо. Это и правда благозвучно."
  naw_norway.151.b:0 " \"Северное королевство\", однозначно. Географию недооценивают."
  naw_norway.151.c:0 " \"Северный союз\". Это просто и оставляет место для потенциальных республик-традиционалистов. Привет, Суоми!"
  naw_norway.151.p:0 "Хм... Дайте мне посмотреть ещё больше вариантов..."
  naw_norway.152.t:0 "Монархическая фракция [Root.GetNameDef]"
  naw_norway.152.d:0 "Действительно, предпринимаются шаги по проецированию нашей позиции и ценностей на весь мир. После упорной работы наших представителей и государственных деятелей может появиться новая фракция. Как нам назвать этот новый, амбициозный альянс?"
  naw_norway.152.a:0 "\"Великий Северный Альянс\", поскольку у монархии есть элемент величия."
  naw_norway.152.b:0 "\"Княжеский Пакт\", просто и элегантно."
  naw_norway.152.c:0 "Давайте начнем это снова с самого начала."
  naw_norway.152.p:0 "Давайте не будем делать этот выбор прямо сейчас."
  naw_norway.153.t:0 "Приглашение в Королевское Норвежское общество"
  naw_norway.153.d:0 "Королевское Норвежское общество является старейшим из существующих научных и ученых учреждений в [From.GetNameDef]. Теперь, когда [From.GetNameDef] проявляет все больший интерес за пределами своих границ, [From.GetName] теперь расширило это бывшее внутреннее общество, которое вручало призы за инновации в Норвегии, в международное академическое общество. Престижное учреждение, Монарх Норвегии является покровителем учреждения, в которое мы сейчас получили приглашение присоединиться. Сотрудничество здесь может привести к обмену технологиями между всеми государствами-членами. Как мы ответим?"
  naw_norway.153.a:0 "Конечно, мы присоединимся. Это честь."
  naw_norway.153.b:0 "Хотя, казалось бы, это приносит пользу всем, мы все же ценим свою независимость, поэтому мы должны это отвергнуть."
  naw_norway.153.c:0 "Кажется неплохим, но, к сожалению, мы вынуждены отказаться."
  naw_norway.154.t:0 "[From.GetName] присылает ученых в Королевское Норвежское Общество"
  naw_norway.154.d:0 "[From.GetName] решил присоединиться к нашему престижному академическому учреждению, Королевскому Норвежскому Обществу. Использование нашего опыта может принести им выгоду, как и их опыт нам."
  naw_norway.154.a:0 "Мы рады приветствовать их ученых в нашем Обществе!"
  
  naw_norway.155.t:0 "[From.GetName] отказывается присоединяться к Королевскому Норвежскому Обществу"
  naw_norway.155.d:0 "[From.GetName] решил, что присоединение к нашему престижному академическому учреждению, Королевскому Норвежскому Обществу, не для них. Они, по-видимому, считают приоритетным сохранять свои лучшие умы для себя, хотя это могло бы принести пользу всем участникам."
  naw_norway.155.a:0 "Жаль, мы бы рады были приветствовать их ученых в нашем престижном Обществе."
  
  naw_norway.160.t:0 "[From.GetName] хочет объединиться с Кайзеррейхом"
  naw_norway.160.d:0 "[From.GetName] обратился к нам с просьбой о союзе. Традиционное Королевство на Севере и его зависимые государства присоединятся к нам, если мы примем это предложение."
  naw_norway.160.a:0 "Согласиться. Еще один союзник для Кайзеррейха."
  naw_norway.160.b:0 "Отказаться. Мы и так справляемся."
  
  naw_norway.161.t:0 "[From.GetName] принимает нас в свой Альянс"
  naw_norway.161.d:0 "Немецкий Кайзер и его представители согласились принять нас во фракцию. Давайте вместе построим лучший мир."
  naw_norway.161.a:0 "Это отличные новости."
  naw_norway.162.t:0 "[From.GetName] отклоняет присоединение к альянсу..."
  naw_norway.162.d:0 "Немецкий кайзер отклонил наше щедрое предложение о совместных действиях."
  naw_norway.162.a:0 "Разочаровывающие новости."

  naw_norway.163.t:0 "[From.GetName] хочет объединиться с Империей"
  naw_norway.163.d:0 "[From.GetName] просит нас о союзе. Традиционное королевство на севере и их подчиненные государства присоединятся к нам, если мы примем это."
  naw_norway.163.a:0 "Согласен. Еще больше друзей для Империи."
  naw_norway.163.b:0 "Отказаться. Мы и так в порядке."

  naw_norway.164.t:0 "[From.GetName] принимает нас в свой альянс"
  naw_norway.164.d:0 "Британский король и его представители согласились принять нас в свою фракцию. Давайте вместе построим лучший мир."
  naw_norway.164.a:0 "Это отличные новости."

  naw_norway.165.t:0 "[From.GetName] отклоняет присоединение к альянсу..."
  naw_norway.165.d:0 "Британский король отклонил наше щедрое предложение о совместных действиях."
  naw_norway.165.a:0 "Разочаровывающие новости."

  naw_norway.170.t:0 "[From.GetName] просит компенсацию за свою помощь"
  naw_norway.170.d:0 "Норвежцы, объединившиеся с нами, теперь заявляют, что хотят получить некоторую компенсацию за помощь в защите наших отеческих земель и нашей империи. И хотя наш альянс Британской империи и Германии могуществен, их помощь не будет лишней. Таким образом, они просят, чтобы мы в качестве компенсации за их усилия вернули им их старое владение - Шетландские острова."
  naw_norway.170.a:0 "Кажется, это справедливо. Они получат Шетланды."
  naw_norway.170.b:0 "Не будем расставаться с островами."

  naw_norway.171.t:0 "[From.GetName] согласен передать Шетланды"
  naw_norway.171.d:0 "Британцы посчитали наше предложение приемлемым, и Шетландские острова вскоре будут переданы. Морские границы будут согласованы позднее."
  naw_norway.171.a:0 "Большое спасибо."

  naw_norway.172.t:0 "[From.GetName] отказывается передавать Шетланды"
  naw_norway.172.d:0 "Британцы посчитали наше предложение несколько неприемлемым, и Шетландские острова пока останутся за ними."
  naw_norway.172.a:0 "Обидный ответ."

  naw_norway.173.t:0 "[From.GetName] хочет компенсации за свою помощь"
  naw_norway.173.d:0 "Норвежцы, объединившиеся с нами, теперь заявляют, что хотят получить некоторую компенсацию за помощь в защите наших отеческих земель и нашей империи. В частности, они имеют в виду Оркнейские и Шетландские острова. Согласимся ли мы, договоримся о меньшей компенсации для них или просто откажемся?"
  naw_norway.173.a:0 "Наши друзья могут вернуть свои старые острова!"
  naw_norway.173.b:0 "Если мы будем вести переговоры только о передаче Шетландских островов, в конце концов они должны будут согласиться."
  naw_norway.173.c:0 "Откажитесь уступать наши острова."
  naw_norway.174.t:0 "[From.GetName] соглашается передать Шетландские и Оркнейские острова."
  naw_norway.174.d:0 "Британцы сочли нашу сделку достаточно справедливой и начали передачу наших старых островов. Морские границы будут оговорены вскоре после этого."
  naw_norway.174.a:0 "Большое спасибо."
  naw_norway.175.t:0 "[From.GetName] соглашается передать Шетландские острова, но не Оркнейские."
  naw_norway.175.d:0 "Британцы сочли нашу сделку почти приемлемой, но они хотят сохранить Оркнейские острова. Наши дипломаты согласились на сделку, боясь уйти ни с чем. Морские границы будут оговорены вскоре после этого."
  naw_norway.175.a:0 "Спасибо."
  naw_norway.176.t:0 "[FROM.GetName] отказывается передавать какие-либо острова."
  naw_norway.176.d:0 "Британцы сочли нашу сделку неприемлемой, желая сохранить все свои острова. Наши дипломаты уехали с пустыми руками."
  naw_norway.176.a:0 "Спасибо за то, что выслушали..."
  naw_norway.180.t:0 "Совместная антибольшевистская фракция?"
  naw_norway.180.d:0 "Видя нарастающие угрозы старому порядку и традициям, [FROM.GetNameDef] пригласило нас в свою новую фракцию монархических и традиционалистских стран. Этот альянс, по их утверждениям, призван противостоять политическому экстремизму и военной агрессии со стороны экстремистских стран, в частности большевизму.\n\nПрисоединимся ли мы к этой фракции? Любые подчиненные страны пойдут с нами, но другие нынешние члены нашей фракции будут вольны выбирать, идти ли с нами или остаться независимыми, если они не захотят."
  naw_norway.180.a:0 "Да, пусть этот Великий Альянс станет реальностью!"
  naw_norway.180.b:0 "Честно говоря, не лучше ли, если бы они присоединились к нам? Мы сделаем им встречное предложение."
  naw_norway.180.c:0 "Чем нам может помочь этот малонаселенный Север?"

  naw_norway.181.t:0 "[FROM.GetName] присоединяется к традиционалистскому альянсу"
  naw_norway.181.d:0 "Мы приветствуем в нашем альянсе наших новых друзей из [FROM.GetName]. Это великий день для наших ценностей."
  naw_norway.181.a:0 "Мы становимся еще сильнее!"

  naw_norway.182.t:0 "[FROM.GetName] не присоединится к традиционалистскому альянсу"
  naw_norway.182.d:0 "[FROM.GetName] почему-то посчитало, что ему выгоднее сохранить свой курс без нас."
  naw_norway.182.a:0 "Видимо, они не были готовы к этому."

  naw_norway.183.t:0 "Дипломатическое встречное предложение [FROM.GetName]"
  naw_norway.183.d:0 "[FROM.GetNameDefCap], возглавляя альянс самостоятельно, не хотел прямо присоединяться к нашей фракции, но и не возражает против сотрудничества с нами. В предоставленном нам встречном предложении говорится, что они хотят, чтобы мы и любые зависимые страны присоединились к их фракции вместо этого. Итак, как мы ответим на это?"
  naw_norway.183.a:0 "Это приемлемо, мы последуем их примеру."
  naw_norway.183.b:0 "Интригующее предложение, но в конечном итоге подчинение им было бы неуважением к самим себе."
 
  naw_norway.184.t:0 "[FROM.GetName] принимает наше встречное предложение"
  naw_norway.184.d:0 "Руководство [FROM.GetAdjective] приняло наше щедрое встречное предложение присоединиться к нашей фракции как альтернатива нашему присоединению под их руководством. Приятно слышать, что разумный компромисс снова победил."
  naw_norway.184.a:0 "Мудрое решение."
 
  naw_norway.185.t:0 "[FROM.GetName] отклоняет наше встречное предложение"
  naw_norway.185.d:0 "Руководство [FROM.GetAdjectiveDefCap] отклонило наше щедрое встречное предложение присоединиться к нашей фракции как альтернативу нашему присоединению под их руководством. Жаль, что они не смогли пойти на компромисс с нашими планами."
  naw_norway.185.a:0 "Кажется, им не хватает способности к компромиссу."
 
  naw_norway.186.t:0 "Лидер фракции присоединяется к фракции [FROM.FROM.GetNameDef]"
  naw_norway.186.d:0 "Наш бывший лидер фракции [FROM.GetName] решил подкрепить альянс, присоединившись к фракции [FROM.FROM.GetName]. Другие члены фракции, в том числе и мы, были приглашены присоединиться к ним."
  naw_norway.186.a:0 "Конечно, мы пойдем с ними."
  naw_norway.186.b:0 "Нет, мы останемся на месте."

  naw_norway.187.t:0 "К нам присоединяется член фракции [FROM.FROM.GetNameDef]"
  naw_norway.187.d:0 "Кроме бывшего лидера фракции [FROM.FROM.GetName], другие страны в их фракции также имели возможность присоединиться к нам. Теперь [FROM.GetNameDef] решил присоединиться к нам."
  naw_norway.187.a:0 "Ну что ж, добро пожаловать в нашу фракцию."

  naw_norway.188.t:0 "Член фракции [FROM.FROM.GetNameDef] решает остаться"
  naw_norway.188.d:0 "Кроме бывшего лидера фракции [FROM.FROM.GetName], другие страны в их фракции также имели возможность присоединиться к нам. В этом случае [FROM.GetNameDef], к сожалению, решил остаться на месте."
  naw_norway.188.a:0 "Ну что ж, в любом случае, удачи им."

  naw_norway.199.t:0 "Многочисленные обязанности Короля"
  naw_norway.199.d:0 "Учитывая снизившийся риск сражений с его родной родиной [DEN.getName], король Хокон VII теперь может и, возможно, захочет более непосредственно участвовать в войне. Хоть он и занят своими обязанностями монарха и главы государства, часть из них можно будет делегировать другим членам королевской семьи и государственным деятелям. Это освободит нашего монарха для дополнительной роли, которая могла бы вдохновить наши армию и граждан в конфликтах, в которых они могут оказаться.\n\nБудучи номинальным верховным главнокомандующим страны, фактическое командование войсками принадлежит старшим офицерам вооруженных сил. Роль советника была бы наиболее безопасным выбором, хотя назначение его на должность главнокомандующего сухопутными войсками могло бы вдохновить наши войска, но сам Хокон опасается этого, так как это не его область знаний. Другим вариантом может стать назначение короля на должность командующего ВМС, так как он получил формальное образование и в прошлом служил в качестве военно-морского офицера.\nИтак, следует ли нам перенести ответственность короля на поддержку армии или продолжить, как раньше?"
  naw_norway.199.a:0 "Король Хокон VII должен быть назначен §Yсоветником§!, это разумно и безопасно."
  naw_norway.199.b:0 "Король Хокон VII должен быть назначен §Yглавнокомандующим сухопутными войсками§!, это вдохновит войска."
  naw_norway.199.c:0 "Король Хокон VII должен быть назначен §Yглавнокомандующим ВМС§!, это его область знаний."
  naw_norway.199.p:0 "Король Хакон VII должен просто придерживаться своих нынешних обязанностей. По-видимому, это была не очень хорошая идея."
  naw_norway.200.t:0 "[From.GetName] объявляет вооруженный нейтралитет"
  naw_norway.200.d:0 "[From.GetName] решил, что для страны лучше всего снова стремиться к нейтралитету, как во времена Великой войны. Правительство Норвегии надеется, что это снова поможет избежать вредного конфликта у дверей норвежского народа. Остается вопрос: может ли [From.GetName] доверять миру, который уважает этот нейтралитет?"
  naw_norway.200.a:0 "Пока им, похоже, ничто не угрожает напрямую."
  naw_norway.200.b:0 "Спасет ли это [From.GetName] от региональной агрессии?"
  naw_norway.200.c:0 "Ну, попытка была..."
  naw_norway.200.p:0 "Эй, если в прошлый раз сработало..."
  naw_norway.201.t:0 "[GER.GetName] нарушил [NOR.GetAdjective] нейтралитет!"
  naw_norway.201.d:0 "[GER.GetName] решил, что в его интересах не иметь [NOR.GetNameDef] нейтральным соседом в грядущем конфликте. Может быть, их недоверие возникло из-за того, что Соединенное Королевство заставило Норвегию тайно помогать ему во второй половине Великой войны? Какова бы ни была причина, Норвегии сейчас угрожает промышленная держава на юге..."
  naw_norway.201.a:0 "К счастью, похоже, мы вполне подготовлены."
  naw_norway.201.b:0 "По крайней мере, наши силы, кажется, справятся с задачей."
  naw_norway.201.c:0 "К сожалению, похоже, мы не очень подготовлены."
  naw_norway.201.p:0 "Когда настанут трудные времена, норвежцы примкнут к нашим врагам..."
  naw_norway.201.e:0 "Кажется, [GER.GetNameDef] совсем не верит, что норвежцы останутся нейтральными..."

  naw_norway.202.t:0 "[ENG.GetName] нарушил нейтралитет [NOR.GetAdjective]!"
  naw_norway.202.d:0 "[ENG.GetName] решил, что в его интересах не иметь [NOR.GetNameDef] в качестве нейтрального соседа в грядущем конфликте. Неужели действия [ENG.GetName] означают, что он хочет прервать поставки немецкого железа из Северной Швеции? Какова бы ни была причина, Норвегии сейчас угрожает сосед через Северное море..."
  naw_norway.202.a:0 "К счастью, мы, кажется, вполне готовы."
  naw_norway.202.b:0 "По крайней мере, наши войска, кажется, несколько готовы к этой задаче."
  naw_norway.202.c:0 "К сожалению, мы, кажется, не готовы."
  naw_norway.202.p:0 "Мы не можем рисковать, что они будут торговать с нашими врагами или снабжать их. Их нужно остановить..."
  naw_norway.202.e:0 "Кажется, [ENG.GetNameDef] совсем не верит, что норвежцы останутся нейтральными..."

  naw_norway.203.t:0 "Агрессоры нарушили нейтралитет [NOR.GetAdjective]!"
  naw_norway.203.d:0 "По всей видимости, враги [NOR.GetNameDef] решили, что для них будет лучше, если [NOR.GetNameDef] не станет нейтральной страной в Северо-Западной Европе. Это стало неожиданностью для сторонних наблюдателей, которые могли только предполагать, почему это произошло? Неужели им не нравится торговля [NOR.GetNameDef] с определёнными странами? Или они не доверяют, что страна останется нейтральной?"
  naw_norway.203.a:0 "К счастью, мы, кажется, хорошо подготовлены."
  naw_norway.203.b:0 "По крайней мере наши силы, похоже, справились с задачей."
  naw_norway.203.c:0 "К сожалению, мы, похоже, не совсем готовы."
  naw_norway.203.p:0 "Наблюдатели могут быть в замешательстве, но сейчас нам нужно только понять наш генеральный план!"
  naw_norway.203.e:0 "Что это может быть такое, чтобы кто-то внезапно прибег к таким крутым мерам?"

  naw_norway.204.t:0 "[From.GetName] просит присоединиться к нашей фракции"
  naw_norway.204.d:0 "После того как иностранные агрессоры нарушили нейтралитет [From.GetNameDef], они теперь обратились к нам в надежде, что мы примем их в наш альянс и выступим против тех, кто нарушит их нейтралитет. Принять ли нам их просьбу о присоединении?"
  naw_norway.204.a:0 "Да. [From.GetName] может доверять, что мы подстрахуем их."
  naw_norway.204.b:0 "Нет. [From.GetName] — всего лишь обуза..."

  naw_norway.205.t:0 "[From.GetName] согласился с нашим присоединением к их фракции"
  naw_norway.205.d:0 "Наши друзья из [From.GetNameDef] приняли нас в свой альянс в столь непростое для нас время. Наши агрессоры узнают, что мы можем рассчитывать на поддержку других против их наглых нападений!"
  naw_norway.205.a:0 "Истинные друзья всегда откликаются, когда это нужно."
  
  naw_norway.206.t:0 "[From.GetName] отклонил наше предложение о вступлении в их фракцию"
  naw_norway.206.d:0 "[From.GetName] по какой-то причине решил, что выручать нас в столь непростое время - это слишком хлопотно..."
  naw_norway.206.a:0 "По-видимому, нам не повезло... Поищем помощи в другом месте?"
  
  naw_norway.210.t:0 "[From.GetName] просит пересмотреть Кильский договор"
  naw_norway.210.d:0 "Кильский договор был подписан после Наполеоновских войн и разделил бывшие части Королевства Норвегии. Датско-норвежская уния закончилась, когда они потерпели поражение в войне. Норвежцы утверждают, что Северо-Атлантические острова имеют тесные связи с Норвегией, но слабые или вовсе никакие связи с Данией. Действительно, исландский, фарерский и норвежский - это западно-скандинавские языки, в отличие от датского и шведского. Стоит ли нам им помочь? Похоже, что на данный момент они более полезны для нас, чем [DEN.GetName], поэтому сейчас может быть самое время их поддержать."
  naw_norway.210.a:0 "Хорошо, мы поддержим возвращение островов [FROM.GetName]."
  naw_norway.210.b:0 "Нет, мы не поддержим нарушение статус-кво, даже ради [FROM.GetName]."
  naw_norway.211.t:0 "[From.GetName] разрешил пересмотр Кильского договора"
  naw_norway.211.d:0 "Кильский мирный договор был подписан после наполеоновских войн и разделил бывшие составные части Королевства Норвегии, когда союз Дании и Норвегии распался из-за их поражения в войне. Наш аргумент состоял в том, что североатлантические острова были тесно связаны с нами и не имели связей с Данией. Действительно, исландский, фарерский и норвежский языки являются потомками древнескандинавского языка в отличие от датского и шведского. На основании наших твердых аргументов и большей практической пользы, чем у [DEN.GetName] в военных действиях, [FROM.GetName] решил поддержать нашу идею!"
  naw_norway.211.a:0 "Прекрасная новость, великая несправедливость была исправлена с помощью толики оппортунизма"
  naw_norway.212.t:0 "[From.GetName] отказал в пересмотре Кильского договора"
  naw_norway.212.d:0 "Кильский мирный договор положил конец наполеоновским войнам, а также отделил Норвегию от Дании после того, как Датско-Норвежский союз проиграл в войне. Мы утверждали, что Североатлантические острова имели тесные связи с нами и практически никак не были связаны с Данией в то время. Более того, исландский, фарерский и норвежский языки происходят от западноскандинавских языков, в отличие от датского и шведского. Даже принимая во внимание наши веские аргументы и то, что [DEN.GetName] был бесполезен в военных действиях, [FROM.GetName] решил сохранить статус-кво..."
  naw_norway.212.a:0 "Ужасные новости. Страшную несправедливость так и не удалось устранить."
  naw_norway.213.t:0 "[From.GetName] разрешил пересмотр Кильского мирного договора"
  naw_norway.213.d:0 "Кильский договор был послевоенным договором, который отделил бывшие неотъемлемые части Королевства Норвегия, когда Датско-Норвежская уния была расторгнута после проигрыша в войнах. Норвежцы утверждали, что североатлантические острова имели тесные связи с ними и в то время мало или вообще не имели связей с нами. Действительно, исландский, фарерский и норвежский языки являются западнонорвежскими языками в отличие от датского и шведского. С другой стороны, мы удерживали их в течение столетия, и вы могли бы подумать, что нарушение статус-кво пойдет вразрез с характером [FROM.GetName]. Увы, тем не менее, [FROM.GetName] решила поддержать предложение норвежцев... Давайте, по крайней мере, надеяться, что они освободят Данию и вознаградят нас другими способами."
  naw_norway.213.a:0 "Плохие новости, почему это было приоритетом в такие тяжелые времена?"
  naw_norway.214.t:0 "[From.GetName] одобрила пересмотр Кильского договора"
  naw_norway.214.d:0 "Кильский договор был заключён после наполеоновских войн и отделял ранее неотъемлемые части Королевства Норвегия от них, когда Датско-норвежская уния закончилась, поскольку они потерпели поражение в войнах. Норвежцы утверждали, что Североатлантические острова имеют прочные связи с ними и практически не имеют связей с нами в то время. Действительно, исландский, фарерский и норвежский - это все западно-норвежские языки-потомки в отличие от датского и шведского, мы это хорошо знаем. Учитывая менее полезные военные усилия [DEN.GetName] по сравнению с норвежцами, [FROM.GetName] решил поддержать претензии [NOR.GetName]. Для нас это, вероятно, будет означать намного более тесные связи с норвежцами. Мы еще не знаем, хорошо это или плохо, но, надеюсь, это, по крайней мере, лучше, чем датское правление."
  naw_norway.214.a:0 "Ну что ж, от далекой семьи к близкой."
  naw_norway.214.b:0 "Нет, даже если это не датчане, мы должны отказаться от этого. Будем надеяться, что они на этом остановятся."

  naw_norway.215.t:0 "[From.GetName] соглашается с нашим воссоединением"
  naw_norway.215.d:0 "[FROM.GetAdjectiveDefCap], на самом деле, можно считать одними из самых верных сыновей [ROOT.GetName], по крайней мере, если учитывать древнюю историю, и теперь они согласились на наше воссоединение, хотя условия предоставили им некоторую автономию."
  naw_norway.215.a:0 "Добро пожаловать обратно, братья!"

  naw_norway.216.t:0 "[From.GetName] отклоняет наше воссоединение"
  naw_norway.216.d:0 "[FROM.GetAdjectiveDefCap] на самом деле может считаться одними из самых истинных сынов [ROOT.GetName], по крайней мере, если вспоминать о давней истории, но несмотря на это, они не согласились на объединение [FROM.GetName] и [ROOT.GetName], хотя им была обещана автономия."
  naw_norway.216.a:0 "Наши братья не вернулись..."

  naw_news.100.t:0 "Падение Копенгагена"
  naw_news.100.d:0 "Норвежским силам, продвигающимся через Зеландию, удалось захватить Копенгаген. \n\nТекущие спорадические бои продолжают угасать, и к счастью, ожесточенное сопротивление и артиллерийский обстрел были сведены к перестрелкам из стрелкового оружия, прежде чем норвежские силы достигли Фредериксстадена с дворцом Амалиенборг, в результате чего рококо-архитектура практически не пострадала.\n\nНекоторые датчане, намеревавшиеся продолжить сопротивление, эвакуировались за несколько часов до и во время вторжения, но город в основном молчит, поскольку норвежцы укрепляют свои позиции в городе и среди населения.\n\nБорьба датчан с [NOR.GetNameDef] может продолжиться в другом месте, но потеря их столицы - верный удар по правительственным и военным возможностям Дании."
  naw_news.100.a:0 "Дания не смогла противостоять [NOR.GetNameDef]."
  naw_news.100.b:0 "Великая победа для сынов Норвегии!"
  naw_news.100.c:0 "Как будто вторжения шведов в Копенгаген было недостаточно."

  naw_news.101.t:0 "Падение Стокгольма"
  naw_news.101.d:0 "В то время как в других частях [SWE.GetNameDef] все еще бушуют сражения, поступили сообщения о том, что норвежские войска вошли в столицу Швеции.\n\nКак мирное население Швеции, так и норвежские силы находятся в странном настроении, поскольку кульминация неожиданного конфликта между двумя странами оказалась на виду. Короткий парад победы был проведен норвежскими войсками после того, как норвежцы обеспечили контроль над большей частью шведских учреждений в Стокгольме. Так как боевые действия быстро свелись к перестрелкам из стрелкового оружия, город все еще находится в на удивление хорошем состоянии, хотя старая телефонная башня в Стокгольме частично разрушилась в результате попадания минометного снаряда.\n\nОжидается, что эти новости значительно ослабят решимость шведов."
  naw_news.101.a:0 "[NOR.GetNameDefCap] явно бьют не по весу."
  naw_news.101.b:0 "Теперь баланс сил наконец сместился в Западную Скандинавию."
  naw_news.101.c:0 "Это совершенно невероятно!"

  naw_news.102.t:0 "Падение Хельсинки"
  naw_news.102.d:0 "Поступающие из Южной Финляндии сводки подтверждают, что столица Финляндии была захвачена наступающими норвежскими войсками.\n\nОтдельные очаги стрелковых боев ещё наблюдаются в некоторых районах и на окраинах, однако в черте города пока не замечено существенных сил противника.\n\nТем не менее, отряд норвежских снайперов занял позиции возле Хельсинкского университета, что значительно ограничивает возможности финнов на контратаки на этом участке. Судя по всему, правительство Финляндии и прочие высокопоставленные лица эвакуировались из Хельсинки до начала боевых действий."
  naw_news.102.a:0 "Армия [NOR.GetAdjectiveDefCap] продолжает продвижение, как можно судить."
  naw_news.102.b:0 "Финнам некуда деваться."
  naw_news.102.c:0 "Что вообще тут забыли норвежцы?"
  
  naw_news.200.t:0 "Пересмотр Кильского договора [ENG.GetName]"
  naw_news.200.d:0 "Поступающие из Южной Финляндии сводки подтверждают, что столица Финляндии была захвачена наступающими норвежскими войсками.\n\nОтдельные очаги стрелковых боев ещё наблюдаются в некоторых районах и на окраинах, однако в черте города пока не замечено существенных сил противника.\n\nТем не менее, отряд норвежских снайперов занял позиции возле Хельсинкского университета, что значительно ограничивает возможности финнов на контратаки на этом участке. Судя по всему, правительство Финляндии и прочие высокопоставленные лица эвакуировались из Хельсинки до начала боевых действий."
  naw_news.200.a:0 "Великая несправедливость в отношении [ROOT.GetNameDef] была исправлена. Мы благодарны."
  naw_news.200.b:0 "Даже возвращаясь к исправлению прошлых ошибок для них, [FROM.GetName] лучше бы помог нам сейчас."
  naw_news.200.c:0 "[ENG.GetAdjectiveDefCap] явно очень заинтересованы в том, чтобы [FROM.GetName] был на их стороне."
  naw_news.200.p:0 "[ENG.GetAdjectiveDefCap] пинали нас лежа. Мы ожидаем, что нас со временем компенсируют..."

