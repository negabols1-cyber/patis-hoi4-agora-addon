l_russian:
  TS_RECALL_DIPLO_TITLE:0 "Вернуть добровольцев"
  TS_RECALL_DIPLO_ACTION_DESC:0 "Вернуть наших добровольцев из этой нации.\n\nЭто ухудшит наши отношения с ней."
  TS_recall_volunteers_LOC:0 "Хотите ли вы вернуть наших добровольцев из\n\n§Y[From.Getname]?§!\n\nЭто будет расценено как предательство нашего предыдущего соглашения помочь им."
  TS_recall_volunteers_TITLE:0 "§Y[ROOT.GetAdjective]§! добровольцы отозваны"
  TS_recall_volunteers_DESC:0 "§Y[ROOT.GetName]§!\n\nПринял решение отозвать своих добровольцев.\n\nВ результате они не только не выполнили своего обещания, но и могут создать огромные бреши на нашей передовой."
  TS_betrayed_volunteers:0 "Отозваны войска, обещанные нам!"