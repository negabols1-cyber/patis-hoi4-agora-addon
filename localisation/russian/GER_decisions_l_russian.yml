 GER_steal_barons_category_desc: "Семья Крупп, известная 400-летняя немецкая династия из Эссена, славится своим производством стали, артиллерии, боеприпасов и других вооружений. Семейный бизнес, известный как Friedrich Krupp AG, был крупнейшей компанией в Европе в начале 20 -го века, и был главным производителем оружия Германии в мировых войнах." #NT!
