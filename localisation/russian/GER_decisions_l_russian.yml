 GER_albert_speers_mega_projects: "Мега -проекты Альберта Шпеера" #NT!
 GER_albert_speers_mega_projects_desc: "Под видением и направлением Альберта Шпера Германия вступает в эру монументального строительства и промышленного расширения. Это не просто здания или фабрики - это символы власти, выносливости и вечной славы Рейха. Каждый проект раздвигает границы инженерии и архитектуры, демонстрируя немецкую изобретательность в мир и укрепляя наше доминирование на будущие поколения." #NT!
