  ROM_not_allowed_other_focuses_tt:0 "Поскольку демократическое правительство в Румынии обязано убеждать людей и подавлять других фашистов и коммунистов, §Rидеологической направленности не может быть§! §Yв течение 120 дней§!."
  ROM_not_allowed_fascist_other_focuses_tt:0 "Поскольку фашистское правительство в Румынии обязано убеждать людей и подавлять других демократов и коммунистов, §Rидеологической направленности не может быть§! §Yв течение 280 дней§!."
  ROM_not_allowed_communist_other_focuses_tt:0 "Так как коммунистическое правительство в Румынии поручено убеждать людей и подавлять фашистов, демократов и королевский фронт, §Rне может быть идеологического фокуса§! §Yв течение 360 дней§!."
