  rom_cpr_increased_domination_tt:0 "£territorial_expansion_texticon §YДоминирование Коммунистического фронта Румынии§! повышено на §G15%§!"
  if_stability_down_than_50_percent_civilwar_is_started_tt:0 "§RЕсли значение стабильности фокуса ниже 50%, когда фокус завершен, гражданская война начнется немедленно.§!"
  rom_civil_buff_tt:0 "Модифицирует §Y$ROM_economic_dynamic_idea$§! на:"
  rom_trained_generals_tt:0 "Модифицирует §Y$ROM_trained_generals_idea$§! на:"
  ROM_king_front:0 "Королевский фронт"
  ROM_king_front_desc:0 ""
  ROM_romania_economy_reform:0 "Принятие экономических реформ"
  ROM_romania_economy_reform_desc:0 ""
  ROM_romania_modern_forces:0 "Вооруженные силы Румынии"
  ROM_romania_modern_forces_desc:0 ""
  ROM_expand_the_air_force_new:0 "Расширение ВВС"
  ROM_expand_the_air_force_new_desc:0 "Современные войны нельзя выиграть без господства в небе. Мы должны сделать все возможное для развития румынских ВВС!"
  ROM_acquire_licenses_new:0 "Получение лицензий"
  ROM_acquire_licenses_new_desc:0 "Иностранные авиационные технологии превосходят наши, и мы должны рассмотреть возможность получения лицензий, чтобы мы могли самостоятельно производить самолеты с их инновациями."
  ROM_air_defense_new:0 "Противовоздушная оборона"
  ROM_air_defense_new_desc:0 "Мы должны защитить наши границы с помощью многочисленных зенитных батарей, чтобы снять нагрузку с наших небольших ВВС."
  ROM_heavy_interceptors_new:0 "Тяжелые перехватчики"
  ROM_heavy_interceptors_new_desc:1 "Наша страна не может содержать большое количество воздушных сил. Мы должны сосредоточить всю мощь в каждом самолете, чтобы уничтожать любого атакующего."
  ROM_ground_support_new:0 "Поддержка пехоты"
  ROM_ground_support_new_desc:0 "Смешанное вооружение является основой современного боя. Воздушные силы должны обучаться поддержке наших наземных войск при необходимости."
  ROM_medium_bombers_new:0 "Средние бомбардировщики"
  ROM_medium_bombers_new_desc:0 "Прошла эра, когда армии выигрывали войны, не глядя в небо. Мы должны развивать наши тактические бомбардировщики, чтобы обеспечить нашим солдатам воздушную поддержку, которая им необходима."
  ROM_cas_new:0 "Штурмовики"
  ROM_cas_new_desc:0 "Нам нужны специальные модели самолетов, специально предназначенные для непосредственной воздушной поддержки, чтобы максимально использовать наши объединенные силы."
  ROM_acquire_fighters_new:0 "Приобрести истребители"
  ROM_acquire_fighters_new_desc:0 "Воздушное превосходство является ключом к нашей обороне, поэтому нам необходимо любыми способами расширить наши истребительные силы."
  ROM_local_development_new:0 "Отечественные разработки"
  ROM_local_development_new_desc:0 "Мы будем полагаться на отечественную румынскую авиационную промышленность в производстве нужных нам самолетов."
  ROM_air_superiority_new:0 "Воздушное превосходство"
  ROM_air_superiority_new_desc:0 "Господство в воздухе является важнейшим требованием для военных операций, и именно на этот аспект ведения воздушной войны мы должны обратить внимание."
  ROM_strategic_bomber_force_new:0 "Стратегические бомбардировщики"
  ROM_strategic_bomber_force_new_desc:0 "Военные операции занимают второстепенное место после уничтожения промышленности и инфраструктуры врага. Стратегические бомбардировки - это средство, с помощью которого мы достигнем этого."
  ROM_heavy_bombers_new:0 "Тяжелые бомбардировщики"
  ROM_heavy_bombers_new_desc:0 "Наши стратегические бомбардировщики требуют большого радиуса действия и бомбовой нагрузки. Большие бомбардировщики - единственный вариант для достижения этих требований."
  ROM_nuclear_bomb_project_new:0 "Проект создания атомной бомбы"
  ROM_nuclear_bomb_project_new_desc:0 "Мы никогда не сможем превзойти наших вероятных врагов в бомбардировках с помощью обычных средств. Поэтому мы должны сосредоточиться на технологических достижениях, которые позволят нам достичь больших разрушений с меньшими затратами. Намного, намного больше."
  ROM_iar_80_new:0 "IAR 80"
  ROM_iar_80_new_desc:0 "У наших инженеров есть отличные идеи, которые они хотят вложить в новый проект истребителя. Им просто нужно финансирование и добро."
  ROM_army_maneuvers_new:0 "Военные маневры"
  ROM_army_maneuvers_new_desc:0 "Наша армия должна быть приведена в боевую готовность для потенциальных будущих вооруженных конфликтов. Мы отправим их на маневры, чтобы разработать новую тактику и стратегию."
  ROM_army_war_college_new:0 "Военный колледж"
  ROM_army_war_college_new_desc:0 "Нам нужны самые светлые умы, которые будут командовать нашими вооруженными силами, а это значит, что военный колледж должен быть расширен."
  ROM_war_college_tt:0 "Появится генерал §Y2-го уровня квалификации§! по имени §YБарбу Параяну§!"
  ROM_the_zb_53_new:0 "ZB-53"
  ROM_the_zb_53_new_desc:0 "Современное оборудование имеет ключевое значение для ведения войны. Мы должны стремиться модернизировать наше пехотное вооружение."
  ROM_vanatori_de_munte_new:0 "Vanatori De Munte"
  ROM_vanatori_de_munte_unit_tt:0 "\nПолучить отряд §YГорцев§! с 9 батальонами.\n"
  ROM_vanatori_de_munte_new_desc:0 "Vanatori De Munte — горные стрелки — это наша элитная горная пехота. Их репутация предшествует им даже за рубежом. Было бы неплохо пополнить их ряды лучшими людьми, которых мы сможем найти."
  ROM_artillery_modernization_new:0 "Модернизация артиллерии"
  ROM_artillery_modernization_new_desc:0 "Пехота не может эффективно действовать без надлежащей артиллерийской поддержки. Обеспечение современными, высококачественными орудиями значительно повысит эффективность наших войск."
  ROM_modern_at_guns_new:0 "Современные противотанковые орудия"
  ROM_modern_at_guns_new_desc:0 "Настала эпоха танков, и нашей пехоте требуются современные средства защиты от этих стальных монстров."
  ROM_mountain_artillery_new:0 "Горная артиллерия"
  ROM_mountain_artillery_new_desc:0 "Наши горцы должны получить должную артиллерийскую поддержку, если мы хотим сохранить их превосходство. Следовательно, наша артиллерия должна быть адаптирована для использования в горных условиях."
  ROM_reserve_divisions_new:0 "Резервные дивизии"
  ROM_reserve_divisions_new_desc:0 "Румыния — маленькая страна, и мы должны выделить соответствующее количество резервных дивизий, чтобы наша армия могла выстоять в полевых условиях."
  ROM_royal_guards_divisions_new:0 "Дивизии королевской гвардии"
  ROM_royal_guards_divisions_tt:0 "Получить подразделение с §Y7 батальонами пехоты§! и §Y2 батальонами артиллерии§!\n"
  ROM_royal_guards_divisions_new_desc:0 "Наша Королевская гвардия должна быть расширена, как и положено нашему великому королю."
  ROM_the_armored_division_new:0 "Бронетанковая дивизия"
  ROM_the_armored_division_new_tt:2 "Получить два подразделения с §Y4 батальонами [ROM_UnlockedArmor] бронетехники§! и §Y4 моторизованной пехоты§!\n"
  ROM_the_armored_division_new_desc:0 "Танки - это путь вперед, и мы должны создать специализированные дивизии, которые будут использовать сильные стороны этого нового оружия."
  ROM_acquire_modern_tanks_new:0 "Приобретение современных танков"
  ROM_acquire_modern_tanks_new_desc:0 "Разработка танков идет быстрыми темпами, и нам не следует приобретать устаревшие модели."
  ROM_mobile_tank_destroyers_new:0 "Мобильные истребители танков"
  ROM_mobile_tank_destroyers_new_desc:0 "У нас нет промышленного потенциала, чтобы превзойти врагов по производству танков. Вместо этого мы должны сосредоточиться на производстве вооружения, которое может свести на нет превосходство противника в бронетехнике."
  ROM_the_maresal_new:0 "Маршал"
  ROM_the_maresal_new_desc:0 "Наши инженеры придумали поместить советскую 122-мм гаубицу в закрытый каземат. Дальнейшая разработка этой конструкции может привести к созданию очень успешной модели танка."
  ROM_expand_the_galati_shipyards_new:0 "Расширение Галацкой верфи"
  ROM_expand_the_galati_shipyards_new_desc:0 "Наши уже существующие верфи в Галаце должны быть значительно расширены, если мы хотим продемонстрировать нашу силу на Черном море."
  ROM_coastal_defense_navy_new:0 "Береговая оборона флота"
  ROM_coastal_defense_navy_new_desc:0 "С нашими ограниченными ресурсами мы можем стремиться только к тому, чтобы обезопасить наши берега. Все усилия должны быть направлены на достижение этой цели."
  ROM_coastal_defense_ships_new:0 "Корабли береговой обороны"
  ROM_coastal_defense_ships_new_tech_tt:0 "Предоставляет доступ к §HКораблям береговой обороны§!\n§HTяжелым крейсерам§!\n    Броня: §G+20%§!\n    Военно-морская огневая мощь: §G+10%§!\n    Цена производства: §G-10%§!"
  ROM_coastal_defense_ships_new_desc:0 "Придется разработать новые проекты для кораблей, которые отлично справляются с задачами береговой обороны."
  ROM_modern_destroyers_new:0 "Современные эсминцы"
  ROM_modern_destroyers_new_desc:0 "Эсминцы - основа любого флота, и наш флот не исключение. Наша морская основа должна соответствовать современным стандартам."
  ROM_torpedo_boats_new:0 "Торпедные катера"
  ROM_torpedo_boats_new_desc:0 "Торпеды - великие уравнители в морской войне. Обеспечив все наши корабли торпедами, мы можем удивить и уничтожить превосходящую силу благодаря чистой дерзости и объему торпедного огня."
  ROM_modern_submarines_new:0 "Современные подводные лодки"
  ROM_modern_submarines_new_desc:0 "Подводная война - самое захватывающее новшество в морском развитии со времени изобретения торпедных катеров. Нам следовало бы не только защищаться от подлодок, но и использовать их против вражеского судоходства."
  ROM_black_sea_dominance_new:0 "Господство на Черном море"
  ROM_black_sea_dominance_new_desc:0 "Наша первоначальная нехватка ресурсов не должна стать препятствием для будущего тотального румынского господства на Черном море. С соответствующей политической волей мы сделаем это реальностью."
  ROM_capital_ships_new:0 "Крупные корабли"
  ROM_capital_ships_new_desc:0 "Если мы хотим, чтобы нас воспринимали всерьез как морскую державу, нам потребуются крупные корабли для управления нашим Черноморским флотом."
  ROM_torpedo_bombers_new:0 "Торпедные бомбардировщики"
  ROM_torpedo_bombers_new_desc:0 "Мы можем компенсировать нашу военно-морскую слабость, перенаправив часть наших военно-воздушных сил на военно-морские задачи. Для этого потребуется новая модель самолета, способного нести торпеду."
  ROM_expand_the_marine_regiment_new:0 "Расширить морской полк"
  ROM_expand_the_marine_regiment_new_desc:0 "Освоение Черного моря открывает возможности для новых путей атаки. Морские вторжения теперь являются приемлемым вариантом, требующим создания новых моделей транспортов, а также специализированных морских дивизий, которые могут специализироваться на этой форме ведения боевых действий."
