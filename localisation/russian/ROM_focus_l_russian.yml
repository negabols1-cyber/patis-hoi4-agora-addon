  ROM_diplomacy:0 "Дипломатия"
  ROM_diplomacy_desc:0 ""
  ROM_a_deal_with_the_devil_new_focus:0 "Сделка с дьяволом"
  ROM_a_deal_with_the_devil_new_focus_desc:1 "[SOU.GetNameDefCap] представляет угрозу для нашей восточной границы, и территориальные требования могут появиться в любой момент. Возможно, лучше присоединиться к [SOU.GetAdjective]ам, чем бороться с ними."
  ROM_form_peasant_militias_new_focus:0 "Сформировать крестьянские ополчения"
  ROM_form_peasant_militias_new_focus_desc:0 "Коммунистические идеалы, которые мы переняли у наших соседей, накладывают на каждого человека обязанность защищать своих товарищей, свою страну и революцию."
  ROM_basing_rights_for_soviet_union_new_focus:1 "Предоставить права на размещение для [SOU.GetName]"
  ROM_basing_rights_for_soviet_union_new_focus_desc:1 "Мы знаем, что [SOU.GetAdjective]ы желают завладеть нашей территорией, но мы можем предотвратить любые враждебные действия, предоставив нашему соседу права на размещение."
  ROM_romanian_volunteer_brigades_new_focus:0 "Румынские добровольческие бригады"
  ROM_romanian_volunteer_brigades_new_focus_desc:0 "Мы создадим добровольческие бригады, чтобы поддержать начинающиеся революции в других странах."
  ROM_join_comintern_new_focus:0 "Вступить в Коминтерн"
  ROM_join_comintern_new_focus_desc:0 "Настало время наконец просить членства в Коминтерне. Это защитит нашу территорию от претензий с востока и позволит нам более активно отстаивать дело коммунизма во всем мире."
  ROM_trade_treaty_with_germany_new_focus:0 "Торговый договор с Германией"
  ROM_trade_treaty_with_germany_new_focus_desc:0 "Мы знаем об интересе Германии к экономике нашей страны. Увеличение поставок товаров, таких как нефть, позволит нам запросить помощь Германии в модернизации нашей армии."
  ROM_german_romanian_oil_exploitation_new_focus:0 "Немецко-румынская нефтяная эксплуатирующая компания"
  ROM_german_romanian_oil_exploitation_new_focus_desc:0 "Немецкая потребность в нефти огромна, что дает нам возможность расширить наши нефтеперерабатывающие заводы."
  ROM_invite_german_advisors_new_focus:0 "Пригласить немецких советников"
  ROM_invite_german_advisors_new_focus_desc:0 "Помощь Германии необходима, если мы хотим модернизировать нашу армию. Они обладают техническими ноу-хау, которые нам нужны, и поэтому мы должны попросить помощи у их советников."
  ROM_invite_german_advisors_tt:0 "Разрешить Германии размещать войска на румынской территории."
  ROM_license_german_equipment_new_focus:0 "Лицензировать немецкое оборудование"
  ROM_license_german_equipment_new_focus_desc:0 "Немецкое оборудование лучше нашего, но, возможно, мы сможем получить лицензии на производство этого оружия самостоятельно."
  ROM_join_axis_new_focus:0 "Вступить в Ось"
  ROM_join_axis_new_focus_desc:0 "Пришло время присоединиться к Оси, чтобы мы могли выстроить славное будущее Румынии вместе с немцами."
  ROM_demand_transnistria_new_focus:0 "Запросить Транснистрию"
  ROM_demand_transnistria_new_focus_desc:0 "Теперь, когда мы сильны и имеем поддержку Германии, настало время потребовать регион Транснистрии, включив его в состав Великой Румынии."
  ROM_renew_the_romanian_polish_alliance_new_focus:1 "Возобновить Румынско-Польский Альянс"
  ROM_renew_the_romanian_polish_alliance_new_focus_desc:0 "Наши старые связи с Польшей в последние годы охладели. Поскольку угрозы, окружающие нас, не уменьшились, а глобальная политическая ситуация становится все более бурной, пришло время возродить наш альянс с нашим северным соседом."
  ROM_the_cordon_sanitaire_new_focus:0 "Санитарный кордон"
  ROM_the_cordon_sanitaire_new_focus_desc:0 "Мы граничим с опасными идеологиями как на востоке, так и на западе. Вместе с нашими соседями на севере и юге мы создадим барьер, который изолирует эти догмы и не позволит им продвигаться дальше."
  ROM_demand_a_western_guarantee_new_focus:0 "Запросить Западную гарантию"
  ROM_demand_a_western_guarantee_new_focus_desc:0 "Если мы хотим противостоять как коммунизму, так и фашизму, нам потребуется Западная помощь. Мы используем все имеющиеся в нашем распоряжении политические рычаги, чтобы получить такую гарантию."
  ROM_military_modernization_new_focus:0 "Военная модернизация"
  ROM_military_modernization_new_focus_desc:0 "Даже с поддержкой Запада, мы должны модернизировать армию, чтобы у наших союзников было время поддержать нас, прежде чем все будет потеряно."
  ROM_join_allies_new_focus:0 "Присоединиться к Союзникам"
  ROM_join_allies_new_focus_desc:0 "Гарантий недостаточно — пора полностью объявить о поддержке западных демократий и встать вместе с ними на защиту свободы."
  ROM_joint_allied_staff_college_new_focus:0 "Совместный союзнический штабной колледж"
  ROM_joint_allied_staff_college_new_focus_desc:0 "В свете наших общих интересов мы должны сотрудничать с западными державами в разработке военного оборудования и тактики."
  ROM_german_romanian_oil_new_focus:0 "Немецко-румынская нефть"
  ROM_german_romanian_oil_new_focus_desc:0 ""
  ROM_declare_a_new_faction_new_focus:0 "Провозгласить новую фракцию"
