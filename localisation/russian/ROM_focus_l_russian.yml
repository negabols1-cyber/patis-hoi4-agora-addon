  iron_guard_dynamic_idea_tt:0 "\n£stability_texticon Стабильность: §G+5.00%§! \n£war_support_modifiericons_texticon Поддержка войны: §G+10.00%§! \n£political_power_texticon Ежедневный прирост политической власти: §G+0.05%§! \n£boost_popularity_texticon Ежедневная поддержка коммунизма: §R-0.05%§! \n£boost_popularity_texticon Ежедневная поддержка фашизма: §G+0.15%§! \n£ai_texticon Уровень согласия с фашистской дипломатией: §G+75§!"
  communist_romania_dynamic_idea_tt:0 "\n£stability_texticon Стабильность: §G+10.00%§! \n£war_support_modifiericons_texticon Поддержка войны: §G+5.00%§! \n£political_power_texticon Ежедневный прирост политической власти: §G+0.10%§! \n£boost_popularity_texticon Ежедневная поддержка коммунизма: §G+0.15%§! \n£boost_popularity_texticon Ежедневная поддержка фашизма: §R-0.05%§! \n£ai_texticon Уровень согласия с коммунистической дипломатией: §G+50§!"
  ROM_cpr_is_friendly:0 "£territorial_expansion_texticon §YФронт коммунистов Румынии§! стало §Gдружелюбным§!"
  rom_cpr_increased_coup_tt:0 "£territorial_expansion_texticon Шанс переворота §YФронта коммунистов Румынии§! §Yувеличился§! на §G35%§!"
