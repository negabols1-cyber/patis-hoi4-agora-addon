  ROM_balkans_dominance_new:0 "Господство на Балканах"
  ROM_balkans_dominance_new_desc:0 "Ключ к процветающему будущему Румынии лежит не в революционерах Востока или в демократиях или фашистах Запада, а в румынском господстве на Балканах."
  ROM_puppet_bulgaria_new:0 "Болгария-марионетка"
  ROM_puppet_bulgaria_new_desc:0 "Болгария-зачинщица войны долгое время была занозой в боку у соседей. Мы должны подчинить их раз и навсегда."
  ROM_align_hungary_new:0 "Объединение с Венгрией"
  ROM_align_hungary_new_desc:0 "Венгрию нужно заставить понять нашу точку зрения. Их правительство возглавляют заблудшиеся элементы, которые могут только привести страну к гибели. Они будут сильнее с нами."
  ROM_HUN_aligned:0 "Венгрия присоединилась"
  ROM_secure_greece_new:0 "Обеспечить безопасность Греции"
  ROM_secure_greece_new_desc:0 "Греция, несмотря на то, что раньше часто была нашим союзником, должна принять румынское господство в регионе."
  ROM_divide_yugoslavia_new:0 "Разделить Югославию"
  ROM_divide_yugoslavia_new_desc:0 "Текущее расположение балканских государств, составляющих Югославию, не может продолжаться. Мы выдвинем ультиматум, требующий реструктуризации их составных государств под румынским руководством."
  ROM_split_czechoslovakia_new:0 "Разделить Чехословакию"
  ROM_split_czechoslovakia_new_desc:0 "Чехословакия - искусственное образование, которое не может выжить само по себе. Мы не можем допустить, чтобы эта часть погрузилась в хаос, и должны вмешаться, прежде чем ситуация станет невыносимой."
  ROM_secure_the_bosporus_new:0 "Защитить Босфор"
  ROM_secure_the_bosporus_new_desc:0 "На данный момент наш военно-морской доступ ограничен Черным морем. Турция, раскинувшаяся через Босфорский пролив, может заблокировать наш доступ к Средиземному морю в случае войны, поэтому мы должны обеспечить свободный проход, когда он нам понадобится."
  ROM_puppet_yugoslavia:0 "Марионеточная Югославия"
  ROM_puppet_yugoslavia_desc:0 ""
