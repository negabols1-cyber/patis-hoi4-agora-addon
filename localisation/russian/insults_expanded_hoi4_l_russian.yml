l_russian:
  OPEN_INSULT_EXPANDED_DIPLO_ACTIONS_TT: "Нажмите §G, чтобы§! отобразить другие дипломатические действия."
  SEND_INSULT_DIPLO_ACTION_TITLE: "Отправить письмо"
  SEND_INSULT_DIPLO_ACTION_TT: "Отправить дипломатическое письмо правительству §Y[This.GetNameWithFlag]§!. [This.GetSendInsultConditionsTooltip]"
  INSULT_EXPANDED_POPUP_SENDER_TITLE: "Письмо"
  INSULT_EXPANDED_POPUP_SENDER_SHORT_DESC: "Отправить дипломатическое письмо правительству §Y[?selected_country_to_insult.GetNameWithFlag]§!. "
  INSULT_EXPANDED_POPUP_SENDER_DESC: "Вы хотите отправить следующее письмо в §Y[?selected_country_to_insult.GetNameWithFlag]§!? \n\nЭто приведет к следующим последствиям: §Y§! [This.GetSendInsultStabilityEffect]\nПовышение базовой поддержки войны: §R-2.00%§!. [This.GetInsultTensionEffect]\n\n(§Y§Y[?selected_country_to_insult.GetNameWithFlag]§!§!): [This.GetReceiveInsultStabilityEffect]\nОтношение §Y[This.GetName]§! к §Y[This.GetFlag]§! §R-50§!. На следующих бонусах в течение §Y30 дней§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя на оправдание цели войны: §G-10.0%§! \nПредел создания напряженности в целях войны: §Y-5.0%§! На следующих бонусах в течение §Y180 дней§!: \nБонус к атаке против [This.GetName]: §G+10.0%§!"
  INSULT_EXPANDED_POPUP_SENDER_ENTRY: "§H[This.GetRandomizedInsultEntry]§!"
  INSULT_EXPANDED_POPUP_SENDER_CUSTOM_ENTRY: "§H[This.GetInsultTypedText]§!"
  RANDOMIZE_INSULT_BUTTON_TT: "§GНажмите§!, чтобы выбрать еще одно случайное письмо. \n§GЩелкните правой кнопкой мыши§!, чтобы открыть или закрыть список всех возможных оскорблений, которые вы могли бы рандомизировать."
  
  SEND_INSULT_BUTTON_TT: "§Y[This.GetNameWithFlag]§! отправляет выбранное письмо в §Y[?selected_country_to_insult.GetNameWithFlag]§!. [This.GetSendInsultButtonConditionsTooltip]"
  
  INSULT_EXPANDED_POPUP_RECEIVER_TITLE: "Дипломатическое письмо"
  INSULT_EXPANDED_POPUP_RECEIVER_SHORT_DESC: "Мы только что получили это непристойное письмо. \n§Y[This.GetNameWithFlag]§! должен заплатить за это неприемлемое действие!"
  INSULT_EXPANDED_POPUP_RECEIVER_ENTRY: "§H[This.GetReceivedInsultEntry]§!"
  INSULT_EXPANDED_POPUP_RECEIVER_CUSTOM_ENTRY: "§H[This.GetInsultTypedReceivedText]§!"
  INSULT_EXPANDED_POPUP_RECEIVER_DESC: "§YЭто письмо имеет следующие последствия:§! [This.GetReceiveInsultStabilityEffect]\nМнение о §Y[This.GetNameWithFlag]§! §R-50§!. \nПолучает следующие бонусы на §Y30 дней§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя обоснования цели войны: §G-10.0%§! \nГенерировать предел напряженности цели войны: §Y-5.0%§! \nПолучает следующие бонусы на §Y180 дней§!: \nБонус атаки против [This.GetName]: §G+10.0%§! \n\n(§Y[This.GetNameWithFlag]§!): [This.GetSendInsultStabilityEffect]\nПолучить базовую поддержку войны: §R-2.00%§!. [This.GetInsultTensionEffect]"
  
  RECEIVED_INSULT_OK_BUTTON_TT: "§Y[This.GetNameWithFlag]§! пишет нам."
  
  INSULT_BACK: "Письмо назад"
  INSULT_BACK_TT: "Отправьте письмо обратно. [This.GetSendInsultConditionsTooltip]"
  ROOT_COULD_INSULT_TARGET_NORMALLY_TOO: "Мы можем отправить письмо этой стране"
  WRITE_INSULT_BUTTON_TT: "§GНажмите§!, чтобы ввести или выйти из режима написания собственного письма. \n§GКлик правой кнопкой мыши§!, чтобы очистить введенное письмо."
  WRITE_INSULT_BUTTON_TT_DELAYED: "§RМаксимально допустимое количество символов - 1000.§!\n§HРазрешены только буквы от A до Z, цифры и несколько специальных символов.§! \nВы можете печатать буквы как обычно и удалять последний символ, нажав £DEL£. \n\nМожно использовать следующие специальные символы, горячая клавиша для ввода указана в скобках после них: \n§YМинус§! (§G-§!) \n§YПробел§! (§Gпробел§!) \n§YЗапятая§! (§G,§!) \n§YЗнак вопроса§! (§GCtrl + Q§!) \n§YAпостроф§! (§GShift + ^§!) \n§YТочка§! (§G.§!) \n§YКавычки§! (§GShift + 2§!) \n§YВосклицательный знак§! (§GShift + 1§!) \n§YОткрывающая круглая скобка§! (§GShift + 8§!) \n§YЗакрывающая круглая скобка§! (§GShift + 9§!)"
  SAVE_INSULT_BUTTON_TT: "§GНажмите§!, чтобы открыть или закрыть окно для §Yсохранения§! и §Yзагрузки§! введенных оскорблений."
  INSULT_SAVE_BUTTON: "[This.GetInsultSaveButtonText]"
  INSULT_SAVE_BUTTON_TT: "[This.GetInsultSaveButtonTooltip]"
  INSULT_SAVE_BUTTON_TT_DELAYED: "[This.GetInsultSaveButtonTooltipDelayed]"
  HAS_TYPED_INSULT: "Набранное письмо содержит хотя бы §Y1§! символ"
  USE_INSULT_BUTTON: "[This.GetInsultListEntryName]"
  USE_INSULT_BUTTON_TT: "Текст этого письма: \n§Y[This.GetInsultListEntryName]§!""
  USE_INSULT_BUTTON_TT_DELAYED: "§GНажмите§!, чтобы выбрать это письмо."
  # Scripted Localisation:
  string_cannot_send_insult_because_players_did_not_vote_yet: "\n\n§RГолосование игроков еще не завершено. Как только результат будет известен, мы сможем послать оскорбление.§W"
  string_cannot_send_insult_because_we_recently_insulted_someone: "\n\n§RМы не можем отправить письмо в другую страну в течение следующих §Y[?Root.last_insult_sent_this_amount_of_days_ago]§! дней.§W"
  string_cannot_send_insult_to_ally: "\n\n§RМы не можем отправить письмо членам нашей фракции.§W"
  string_cannot_send_insult_to_enemy: "\n\n§RМы не можем отправить письмо в §Y[This.GetNameWithFlag]§!, потому что мы уже воюем друг с другом.§W"
  string_cannot_send_insult_because_no_or_too_short_insult: "\n\n§RВы должны выбрать письмо или ввести письмо не менее чем с §Y3§! символов.§W"
  string_cannot_send_insult_because_we_recently_insulted_them: "\n\n§RМы недавно послали им оскорбление. Мы можем оскорбить страну только раз в 6 месяцев.§W"

  string_send_insult_stability_effect: "\nПолучите базовую стабильность: §G+0.50%§!. "
  string_receive_insult_stability_effect: "\nПолучите базовую стабильность: §R-0.50%§!. "
  string_insult_wt_effect: "\nНапряженность в мире повышается на §R0.5§!. "

  string_quotation_mark: "\""

  string_create_new_insult_save: "Создать новое сохранение"
  string_replace_insult_save: "Сохранить слот [?i]"
  string_create_new_insult_save_tt: "§GНажмите§!, чтобы создать §Yновое сохранение§!, в котором будет сохранено введенное вами в данный момент письмо.
  string_replace_insult_save_tt: "§GНажмите§!, чтобы §Yпереписать§! это сохранение своим набранным письмом. \n§GНажмите правую кнопку мыши§!, чтобы §Yзагрузить§! это сохранение. \n§GCtrl + правая кнопка мыши§!, чтобы §Rудалить§! это сохранение."
  string_replace_insult_save_tt_delayed: "Текст этого сохраненного письма: "§Y[This.GetInsultTypedSavedText]§!""
  
