l_russian:
  GRE_1936_election_category:0 "Выборы 1936 года"
  GRE_1936_election_category_desc:0 "Первые выборы с момента возвращения на трон Георга II должны пройти до конца месяца. Георг II полон решимости не позволить снова свергнуть его с трона и, как сообщается, готов пойти на любые меры, чтобы сохранить свою власть.\n\nОднако отдельные части нашей армии по-прежнему хранят тайную верность народному изгнаннику Элефтериосу Венизелосу, и им может удаться обеспечить проведение свободных и справедливых выборов для Греции с помощью некоторых довольно... крутых мер."
  GRE_the_election_of_1936:0 "Парламентские выборы в Греции 1936 года"
  GRE_the_election_of_1936_desc:1 "Первые выборы с момента возвращения на трон Георга II должны пройти до конца месяца. Георг II полон решимости не позволить снова свергнуть его с трона и, как сообщается, готов пойти на любые меры, чтобы сохранить свою власть."
  GRE_1936_election_tt:0 "Если король §YГеорг II§! не будет арестован, он вмешается в январские выборы и обеспечит своим сторонникам-монархистам сохранение правительственного мандата.\n"
  GRE_put_the_king_under_house_arrest:0 "Поместить короля под домашний арест"
  GRE_put_the_king_under_house_arrest_desc:0 "Если мы помешаем королю Георгу II вмешиваться в демократические процессы в Греции, то более популярные венизелисты обязательно выиграют выборы."
  GRE_1936_arrest_the_king_tt:0 "Король будет арестован и §YВенезелисты§! победят на выборах.\n"
  GRE_king_arrested:0 "Король помещен под домашний арест"
  GRE_civil_war_imminent:0 "Гражданская война неминуема!"
  GRE_civil_war_imminent_desc:0 "Напряжение между республиканцами и монархистами достигло своего пика, и гражданская война, к сожалению, представляется неизбежной..."
  GRE_civil_war_imminent_1:0 "Гражданская война неминуема!"
  GRE_civil_war_imminent_1_desc:0 "Напряжение между республиканцами и монархистами достигло своего пика, и гражданская война, к сожалению, представляется неизбежной..."
  GRE_civil_war_imminent_2:0 "Гражданская война неминуема!"
  GRE_civil_war_imminent_2_desc:0 "Напряжение между республиканцами и монархистами достигло своего пика, и гражданская война, к сожалению, представляется неизбежной..."
  GRE_civil_war_imminent_3:0 "Гражданская война неминуема!"
  GRE_civil_war_imminent_3_desc:0 "Напряжение между республиканцами и монархистами достигло своего пика, и гражданская война, к сожалению, представляется неизбежной..."
  GRE_civil_war_imminent_4:0 "Гражданская война неминуема!"
  GRE_civil_war_imminent_4_desc:0 "Напряжение между республиканцами и монархистами достигло своего пика, и гражданская война, к сожалению, представляется неизбежной..."
  GRE_investment_decisions_category:0 "Инвестиционные схемы"
  GRE_investment_decisions_category_desc:0 "Десятилетиями дурного экономического управления со стороны бывших администраций и бесчинств со стороны иностранных держав привели нашу страну к отсутствию прочной промышленной основы. Печальная реальность ситуации заключается в том, что для достижения нашего максимального потенциала нам, возможно, придется попросить помощи у некоторых из тех же самых стран, которые оставили нас в таком положении."
  GRE_invite_politicians_for_investment_talks_in_capital:0 "Пригласить политиков на инвестиционные переговоры в столицу"
  GRE_invite_politicians_for_investment_talks_in_capital_desc:0 "Приглашение в нашу престижную страну, где мы можем продемонстрировать огромный потенциал наших людей и производственного сектора, должно принести значительные плоды, если мы обратимся к нужным людям!"
  GRE_hold_national_showcase_for_investors_ger:0 "Провести национальный показ для [FROM.GetAdjective] инвесторов"
  GRE_hold_national_showcase_for_investors_ger_desc:0 "Мы проведем грандиозную выставку здесь, в колыбели западной цивилизации, в надежде привлечь инвестиции в наш обедневший промышленный сектор."
  GRE_exploit_errata_in_schachtplan:0 "Эксплуатировать ошибки в плане Шахта"
  GRE_exploit_errata_in_schachtplan_desc:0 "План Шахта - это просто еще одна преступная схема [FROM.GetAdjective], направленная на ограбление более бедных европейских стран. Должно быть легко придумать сценарий, в котором [FROM.GetAdjective] будет вынужден помочь нам на этот раз, и без всяких условий."
 GRE_rebuke_german_investment:0 "Отказ от [FROM.GetAdjective] инвестиций"
 GRE_invite_entrepreneurs_for_investment_talks_in_capital:0 "Приглашение предпринимателей на инвестиционные переговоры в столице"
 GRE_invite_entrepreneurs_for_investment_talks_in_capital_desc:0 "Приглашение в нашу престижную страну, где мы можем продемонстрировать огромный потенциал наших людей и производственного сектора, должно принести значительные плоды, если мы обратимся к нужным людям!"
 GRE_hold_national_showcase_for_investors_eng:0 "Проведение национальной выставки для [FROM.GetAdjective] инвесторов"
 GRE_hold_national_showcase_for_investors_eng_desc:0 "Мы проведем грандиозную выставку здесь, в колыбели западной цивилизации, в надежде привлечь инвестиции в наш обнищавший промышленный сектор."
 GRE_trade_manufactured_ship_parts_for_investment:0 "Продажа произведенных судовых деталей для привлечения инвестиций"
 GRE_trade_manufactured_ship_parts_for_investment_desc:0 "Помогая британцам поддерживать свой королевский флот, мы можем гарантировать, что получим гораздо более крупные инвестиции, чем в обычных обстоятельствах."
 GRE_rebuke_british_investment:0 "Отказ от [FROM.GetAdjective] инвестиций"
 GRE_go_to_paris_to_negotiate_investment_talks:0 "Поездка в Париж для переговоров об инвестициях"
 GRE_go_to_paris_to_negotiate_investment_talks_desc:0 "Аудиенция с нужными людьми в Париже, где мы сможем продемонстрировать огромный потенциал наших людей и производственного сектора, может принести нашей стране значительные выгоды."
  GRE_hold_national_showcase_for_investors_fra:0 "Организовать национальную витрину для [FROM.GetAdjective] инвесторов"
  GRE_hold_national_showcase_for_investors_fra_desc:0 ""Мы должны будем организовать грандиозную витрину в колыбели западной цивилизации, дабы заинтересовать и привлечь инвесторов в наш обнищавший промышленный сектор."
  GRE_bribe_french_trade_unions_to_pressure_government_into_investment:0 "Подкупить [FROM.GetAdjective] профсоюзы для оказания давления на их правительство"
  GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc:0 "[FROM.GetNameDef] уже очень давно подчиняется своим профсоюзам, поэтому, помогая профсоюзам подстрекать к нестабильности, мы улучшаем нашу переговорную позицию путем шантажа."
  GRE_rebuke_french_investment:0 "Укорить [FROM.GetAdjective] инвестиции"
  GRE_request_italian_assistance_with_industrialisation:0 "Попросить помощи с индустриализацией"
  GRE_italian_influence_tt:0 "Слишком сильная зависимость от §Y[FROM.GetAdjective]§! может поставить наш суверенитет под угрозу.\n"
  GRE_temper_italian_colonial_ambitions_in_greece:0 "Умерить [FROM.GetAdjective] колониальные амбиции в [ROOT.GetNameDef]"
  GRE_rebuke_italian_investment:0 "Укорить [FROM.GetAdjective] инвестиции"
  GRE_italian_influence_shunned_tt:0 "Уклонение от §Y[FROM.GetAdjective]§! после эксплуатации их щедрости может привести к §Yвойне§!!\n"
  GRE_attend_talks_with_the_presidium:0 "Присутствовать на переговорах с Президиумом"
  GRE_attend_talks_with_the_presidium_desc:0 "Мы отправим представителей от нашей нации в президиум в [FROM.GetNameDefCap], чтобы обсудить возможность убеждения их в небольших инвестициях в нашу военную индустрию."
  GRE_host_soviet_bureaucrats_in_greece:0 "Принять [FROM.GetAdjective] бюрократов в [ROOT.GetNameDef]"
  GRE_host_soviet_bureaucrats_in_greece_desc:0 "Представители из [FROM.GetNameDefCap] совершат тур по нашей стране и затем решат, стоит ли им делать умеренные инвестиции в нашу военную индустрию."
  GRE_soviet_influence_tt:0 "Слишком сильная зависимость от §Y[FROM.GetAdjective]§! может поставить под угрозу наш суверенитет.\n"
  GRE_invest_back_into_neglected_siberian_regions:0 "Инвестиции в заброшенные регионы Сибири"
  GRE_invest_back_into_neglected_siberian_regions_desc:0 "Мы предложим [FROM.GetNameDefCap] инвестировать в их наиболее заброшенные регионы, в качестве демонстрации взаимности, которая позволит нам сократить влияние, которое [FROM.GetAdjective] оказывают на нас."
  GRE_rebuke_soviet_investment:0 "Отказ от [FROM.GetAdjective] инвестиций"
  GRE_soviet_influence_shunned_tt:0 "Избегая §Y[FROM.GetAdjective]§! после использования их щедрости, вы можете привести к §Yвойне§!!"
  GRE_pay_back_debt_to_the_ifc_category:0 "Управление долгом перед МВФ"
  GRE_pay_back_debt_to_the_ifc_category_desc:1 "Греция страдает от финансовых долгов с момента нашей войны за независимость 1829 года, и Великая война не особо помогла в решении наших финансовых проблем. Если мы сможем погасить наши долги, это, безусловно, поможет обеспечить некоторое подобие экономической стабильности в Греции. Кроме того, как известно, некоторые радикальные движения бунтуют как против политических, так и против экономических условностей. Следует ли нам поддаваться одному из этих движений или просто позволить миру рушиться, поскольку время идет, вполне возможны более радикальные варианты действий...\n\n§YДолг§! перед §YБританцами§!: [ROOT.GetDebtPercentageBritain]\n\n§YДолг§! перед §YФранцузами§!: [ROOT.GetDebtPercentageFrance] \n\n§YДолг§! перед §YИтальянцами§!: [ROOT.GetDebtPercentageItaly] \n\nОбщий погашенный §Yдолг§!: [ROOT.GetDebtPercentagePaidTotal]"
