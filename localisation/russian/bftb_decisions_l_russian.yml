 GRE_small_payment_to_british_debt_effect_tt:0 "Это решение погасит одну четверть нашего текущего §Yдолга§! перед §Y[ENG.GetNameDef]§! каждый раз после его выполнения.\n"
 GRE_small_payment_to_french_debt_effect_tt:0 "Это решение погасит одну четверть нашего текущего §Yдолга§! перед §Y[FRA.GetNameDef]§! каждый раз после его выполнения.\n"
 GRE_small_payment_to_italians_debt_effect_tt:0 "Это решение погасит одну четверть нашего текущего §Yдолга§! перед §Y[ITA.GetNameDef]§! каждый раз после его выполнения.\n"
 GRE_force_debt_clearance_tt:0 "Разорвав наши финансовые отношения с §Y[FROM.GetNameDef]§!, мы также откажемся от своего §Yдолга§! перед ним.\n"
 GRE_debt_payment_impossible_tt:0 "Коммунистические и фашистские правительства не хотят выплачивать свои долги.\n"
 GRE_large_installment_payment_ENG:0 "Выплата большого долга [FROM.GetAdjective]"
 GRE_large_installment_payment_FRA:0 "Выплата большого долга [FROM.GetAdjective]"
 GRE_large_installment_payment_ITA:0 "Выплата большого долга [FROM.GetAdjective]м"
 GRE_large_payment_to_british_debt_effect_tt:0 "Это решение погасит одну вторую нашего текущего §Yдолга§! перед §Y[ENG.GetNameDef]§! каждый раз после его выполнения.\n"
  GRE_large_payment_to_french_debt_effect_tt:0 "Это решение позволит погасить половину нашего текущего §Yдолга§! с §Y[FRA.GetNameDef]§! каждый раз, когда оно будет выполнено.\n"
  GRE_large_payment_to_italians_debt_effect_tt:0 "Это решение позволит погасить половину нашего текущего §Yдолга§! с §Y[ITA.GetNameDef]§! каждый раз, когда оно будет выполнено.\n"
  GRE_restructuring_our_debt:0 "Реструктуризация нашего долга"
  GRE_restructure_debt_tt:0 "Весь текущий §Yдолг§! перед §YМеждународной финансовой комиссией§! будет погашен наполовину."
  GRE_defaulting_on_our_debt:0 "Незаконное невыполнение наших долговых обязательств"
  GRE_default_on_debt_effect_tt:0 "Такие решительные действия могут иметь §Yнепредвиденные последствия§!, выходящие за рамки разрыва финансовых связей между нами и нашими должниками.\n"
  GRE_completely_debt_free:0 "Мы полностью §Yосвободились от долгов§!."
  GRE_defaulted_on_debt_flag:0 "Мы §Yне выполнили§! наши финансовые обязательства."
  GRE_recommission_the_american_battleships:0 "Ввести в строй американские линкоры"
  GRE_recommission_the_american_battleships_desc:0 "Линкоры «Килкис» и «Лемнос» находятся в плачевном состоянии с момента греко-турецкой войны, но с некоторым терпением и решимостью мы можем сделать их снова годными для плавания."
  GRE_build_the_salamis:0 "Перестроить «Саламис»"
  GRE_build_the_salamis_desc:0 "С помощью Германии нам удалось восстановить наш старый линейный крейсер "Саламис", который мы недальновидно сдали на слом в 1932 году. К счастью, у нас до сих пор остались элементы старого корпуса, поэтому нам не придется начинать с нуля."
  GRE_hellenic_academy_category:0 "Боевые планы Греческой академии"
