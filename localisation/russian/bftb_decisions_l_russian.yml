  BUL_purchase_ships_destroyers_tt:0 "Мы получим §Y3 эсминца§!."
  BUL_purchase_ships_light_cruiser_tt:0 "Мы получим §YLёгкий крейсер§!."
  BUL_purchase_ships_undetermined_tt:0 "Если наше предложение будет принято, мы выберем между покупкой §Y3 подлодки§!, §Y2 эсминцев§! или §YLёгкого крейсера§!."
  BUL_foreign_agreements:0 "Иностранные соглашения"
  BUL_foreign_agreements_desc:0 "Мы должны сосредоточиться на заключении выгодных соглашений с ведущими иностранными компаниями, желающими открыть дочерние компании в Болгарии или инвестировать в развитие нашей отечественной промышленности."
  BUL_german_industrial_agreements_category_value:0 "[?BUL.BUL_german_industrial_investments|Y0]"
  BUL_german_industrial_agreements_category_desc:0 "Текущие [GER.GetAdjective] заводы: [?BUL.BUL_german_industrial_investments|Y0]\nБазовый предел: [?BUL.BUL_industrial_investments_basic_cap|R0]\nПолностью §YПодход Германии§! фокусируется на увеличении предела до [?BUL.BUL_industrial_investments_medium_cap|G0].\nПрисоединяйтесь к §Y[GER.GetFactionName]§! чтобы увеличить предел до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_german_industrial_agreements_cap_basic_tt:0 "Текущие [GER.GetAdjective] заводы: [?BUL.BUL_german_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_basic_cap|R0].\nЗавершение §YПодход Германии§! фокус увеличит предел до [?BUL.BUL_industrial_investments_medium_cap|G0]."
  BUL_german_industrial_agreements_cap_approach_tt:0 "Текущее количество немецких заводов: [?BUL.BUL_german_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_medium_cap|R0] (Выполнен фокус \"§YСближение с Германией§!\").\nВступление в §Y[GER.GetFactionName]§! увеличит предел до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_german_industrial_agreements_cap_faction_tt:0 "Текущее количество немецких заводов: [?BUL.BUL_german_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_max_cap|R0] (Состоит в фракции с [FROM.GetNameDef])."
  BUL_british_industrial_agreements_category_value:0 "[?BUL.BUL_british_industrial_investments|Y0]"
  BUL_british_industrial_agreements_category_desc:0 "Текущее количество британских заводов: [?BUL.BUL_british_industrial_investments|Y0]\nБазовый предел: [?BUL.BUL_industrial_investments_basic_cap|R0]\nВыполните фокус \"§YСближение с Великобританией§!\" для увеличения предела до [?BUL.BUL_industrial_investments_medium_cap|G0].\nВступите в §Y[ENG.GetFactionName]§!, чтобы увеличить предел до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_british_industrial_agreements_cap_basic_tt:0 "Текущее количество британских заводов: [?BUL.BUL_british_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_basic_cap|R0].\nВыполнение фокуса \"§YСближение с Великобританией§!\" увеличит предел до [?BUL.BUL_industrial_investments_medium_cap|G0]."
  BUL_british_industrial_agreements_cap_approach_tt:0 "Текущее количество [ENG.GetAdjective] фабрик: [?BUL.BUL_british_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_medium_cap|R0] (фокус \"Сближение с Великобританией\" выполнен).\nВступление в [ENG.GetFactionName] увеличит лимит до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_british_industrial_agreements_cap_faction_tt:0 "Текущее количество [ENG.GetAdjective] фабрик: [?BUL.BUL_british_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_max_cap|R0] (Состоит в фракции с [ENG.GetNameDef])."
  BUL_soviet_industrial_agreements_category_value:0 "[?BUL.BUL_soviet_industrial_investments|Y0]"
  BUL_soviet_industrial_agreements_category_desc:0 "Текущее количество [SOV.GetAdjective] фабрик: [?BUL.BUL_soviet_industrial_investments|Y0]\nБазовый лимит: [?BUL.BUL_industrial_investments_basic_cap|R0]\nВыполните фокус \"Советско-Болгарский договор о дружбе и взаимопомощи\" для увеличения лимита до [?BUL.BUL_industrial_investments_medium_cap|G0].\nВступите в [SOV.GetFactionName] для увеличения лимита до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_soviet_industrial_agreements_cap_basic_tt:0 "Текущее количество [SOV.GetAdjective] фабрик: [?BUL.BUL_soviet_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_basic_cap|R0].\nВыполнение фокуса \"Советско-Болгарский договор о дружбе и взаимопомощи\" увеличит лимит до [?BUL.BUL_industrial_investments_medium_cap|G0]."
  BUL_soviet_industrial_agreements_cap_approach_tt:0 "Текущее количество [SOV.GetAdjective] заводов: [?BUL.BUL_soviet_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_medium_cap|R0] (Завершён фокус §YСоветско-Болгарский договор о взаимопомощи§!).\nПрисоединение к §Y[SOV.GetFactionName]§! увеличит предел до [?BUL.BUL_industrial_investments_max_cap|G0]."
  BUL_soviet_industrial_agreements_cap_faction_tt:0 "Текущее количество [SOV.GetAdjective] заводов: [?BUL.BUL_soviet_industrial_investments|Y0]/[?BUL.BUL_industrial_investments_max_cap|R0] (Состоит в одной фракции с [SOV.GetNameDef])."
