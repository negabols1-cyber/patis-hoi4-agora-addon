  BUL_destroy_imro_foreign_cancel_trigger_thrace:0 "§Y[184.GetName]§!: \n Должно выполняться одно из следующих условий: \n   Не полностью контролируется §Y[ROOT.GetName]§! \n   Имеет менее §Y3 пехотных§! дивизий в §Y[184.GetName]§!\n"
