  BUL_zveno_name_text:0 "Звено"
  BUL_bs_name_text:0 "Широкие социалисты"
  BUL_bzns_name_text:0 "Аграрный союз"
  BUL_nsm_name_text:0 "Национал-социалистическое движение"
  BUL_ZVENO_TOOLTIP:0 "£faction_bul_zveno §YZveno§! — это националистическая организация, основанная офицерами армии и в настоящее время возглавляемая Кимоном Георгиевым. \n£faction_bul_zveno §YZveno§! будет призывать офицеров армии присоединяться к их организации, и со временем даже может попытаться совершить переворот и установить военную диктатуру."
  BUL_BS_TOOLTIP:0 "£faction_bul_bs §YШирокие социалисты§! - социал-демократы, поддерживающие широкие союзы классов. \nУ £faction_bul_bs §YШироких социалистов§! большое влияние среди промышленных рабочих и профсоюзов, и они объявят всеобщую забастовку, если будут нелояльны к правительству."
  BUL_BZNS_TOOLTIP:0 "£faction_bul_bzns §YАграрный союз§! - это политическая организация, запрещенная в 1934 году и посвященная вопросам, касающимся сельского хозяйства. \n£faction_bul_bzns §YАграрный союз§! имеет большое влияние в сельских регионах страны и попытается завоевать популярность среди фермеров."
  BUL_NSM_TOOLTIP:0 "£faction_bul_nsm §YНациональное социальное движение§! - это крайне правая организация во главе с бывшим членом Звена Александром Цанковым. \n£faction_bul_nsm §YНациональное социальное движение§! попытается завоевать популярность среди масс, организуя демонстрации и протесты по всей стране."
  BUL_LOYALTY_TOOLTIP:0 "§YЛояльность§! представляет желание фракции сотрудничать с правительством. \nЧем выше §YЛояльность§!, тем меньше вероятность того, что фракция противостоит правительству. \nПеред интеграцией фракции в правительство необходимо выполнить определенные решения, чтобы привести ее членов в соответствие с правительством и увеличить их §YЛояльность§! до 100."
  BUL_POPULARITY_TOOLTIP:0 "§YПопулярность§! отражает поддержку фракции в определенных секторах населения (военное, пролетарское, крестьянское или правые радикалы).\nЧем выше §YПопулярность§!, тем больше вероятность, что фракция будет противостоять правительству.\nПрежде чем уничтожить фракцию, необходимо выполнить определенные решения, чтобы ослабить ее и снизить ее §YПопулярность§! до 0."
  BUL_reduced_faction_interaction_cost_tt:0 "Стоимость решения на активацию любых решений §YУправления фракциями§! уменьшена вдвое."
  BUL_reduced_communist_oppression_cost_tt:0 "Стоимость решения на подавление фракции §YШироких социалистов§! уменьшена вдвое."
  BUL_improved_faction_effects_tt:0 "Усиленные эффекты на фракции для всех решений §YУправления фракциями§!"
  BUL_reduced_faction_interaction_cooldown_tt:0 "Решения §YУправления фракциями§! будут выполняться быстрее и будут доступны раньше после их активации."
