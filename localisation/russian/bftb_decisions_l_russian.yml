  BUL_the_fatherland_front_dec_cat:0 "Отечественный фронт"
  BUL_the_fatherland_front_dec_cat_desc:0 "[GetFfDecisionCategoryDesc]"
  BUL_the_fatherland_front_desc_planning:0 "Лидеры §YOтечественного фронта§! готовятся к перевороту.\nВ конечном итоге они будут искать поддержки у [GetZvenoName], [GetBsName] и [GetBznsName].\nМы можем предпринять несколько шагов, чтобы помешать их подготовке и ослабить их попытку свергнуть правительство:\n- Выкорчевать и арестовать сторонников и лидеров §YOтечественного фронта§!.\n- Уничтожить или интегрировать любую из фракций, к которой они могут обратиться.\n- Снижение §YКоммунистической поддержки§! менее 1 позволит нам нанести последний удар по §YOтечественному фронту§!."
  BUL_the_fatherland_front_desc_coup:0 "Лидеры Отечественного фронта спланировали переворот и теперь ждут подходящего момента для удара.\nВероятность переворота:\nБаза §Y10%§! [GetAtWarFfPercentage] [GetAllyAtWarFfPercentage] [GetSovNeighborFfPercentage] [GetCommunistSovFfPercentage]"
  BUL_ff_percentage_no_war:0 ""
  BUL_ff_percentage_at_war:0 "\nВойна: §Y15%§!"
  BUL_ff_percentage_at_war_with_sov:0 "\nВойна с [SOV.GetFlag][SOV.GetNameDef]: §Y25%§!"
  BUL_ff_percentage_at_war_with_communist_sov:0 "\nВойна с коммунистическим [SOV.GetFlag][SOV.GetName]: §Y75%§!"
  BUL_ff_percentage_ally_no_war_with_sov:0 ""
  BUL_ff_percentage_ally_at_war_with_sov:0 "\nСоюзник воюет с [SOV.GetFlag][SOV.GetNameDef]: §Y25%§!"
  BUL_ff_percentage_ally_at_war_with_communist_sov:0 "\nСоюзник воюет с коммунистическим [SOV.GetFlag][SOV.GetName]: §Y100%§!"
  BUL_ff_percentage_sov_is_not_neighbor:0 ""
  BUL_ff_percentage_sov_is_neighbor:0 "\n[SOV.GetFlag][SOV.GetNameDef] контролирует соседнее государство: §Y15%§!"
  BUL_ff_percentage_enemy_sov_is_neighbor:0 "\nКоммунистический [SOV.GetFlag][SOV.GetName] контролирует соседнее государство: §Y100%§!"
  BUL_ff_percentage_sov_no_communist:0 ""
  BUL_ff_percentage_sov_communist:0 "\n[SOV.GetFlag][SOV.GetNameDef] является коммунистическим: §Y15%§!"
  BUL_ff_destroyed_flag:0 "Отечественный фронт уничтожен"
  BUL_ff_civil_war_flag:0 "Отечественный фронт начал гражданскую войну"
  BUL_fatherland_front_formed_flag:0 "Отечественный фронт сформирован"
  BUL_ff_impending_coup_mission:0 "Надвигающийся переворот §YФронта Отечества§!"
  BUL_ff_impending_coup_mission_desc:0 "Лидеры §YФронта Отечества§! готовятся устроить переворот."
  BUL_ff_approaching_zveno_mission:0 "§YФронт Отечества§! обращается к [GetZvenoName]"
  BUL_ff_approaching_zveno_mission_desc:0 "§YФронт Отечества§! призывает [GetZvenoName] присоединиться к их перевороту."
  BUL_ff_approaching_bs_mission:0 "§YФронт Отечества§! обращается к [GetBsName]"
  BUL_ff_approaching_bs_mission_desc:0 "§YФронт Отечества§! призывает [GetBsName] присоединиться к их перевороту."
  BUL_ff_approaching_bzns_mission:0 "§YФронт Отечества§! обращается к [GetBznsName]"
  BUL_ff_approaching_bzns_mission_desc:0 "§YФронт Отечества§! призывает [GetBznsName] присоединиться к их перевороту."
  BUL_ff_root_out_sympathizers:0 "Искоренить сочувствующих Фронту Отечества"
  BUL_ff_root_out_sympathizers_desc:0 "Тех, кто публично сочувствует Фронту Отечества и поддерживает его идеалы, необходимо выследить и предать правосудию."
  BUL_ff_massive_arrests:0 "Массовые аресты"
  BUL_ff_massive_arrests_desc:0 "Для того, чтобы покончить с угрозой, которую представляет Фронт Отечества, требуются более жесткие меры. Мы проведем масштабные рейды, арестуя всех, кто связан с организацией."
  BUL_ff_deal_the_final_blow:0 "Нанести последний удар"
  BUL_ff_deal_the_final_blow_desc:1 "Мы значительно ослабили коммунистов, и судьба революции Отечественного фронта висит на волоске... Который мы должны сразу перерезать!"
  BUL_ff_approaching_faction_timer_effects_tt:0 "Фракция присоединится к Отечественному фронту, сокращая дни до миссии §YНадвигающийся переворот Отечественного фронта§! в зависимости от §Yпопулярности фракции§!. §YЛояльность фракции§! к правительству немного снизит эффект."
  BUL_ff_approaching_faction_cw_effects_tt:0 "Если эта фракция присоединится к Отечественному фронту, восстание усилится."
  BUL_ff_preventive_action_taken_tt:0 "Уменьшает шанс того, что Отечественный фронт совершит переворот, на §G[?BUL.BUL_ff_preventive_actions_base_value]%§!.\nЗначение ограничено §Y[?BUL.BUL_ff_preventive_actions_cap_value]%§!."
  BUL_ff_deal_the_final_blow_tt:0 "Мы раз и навсегда искореним Отечественный фронт!"
  BUL_ff_root_out_sympathizers_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y15 дней§!.\n"
  BUL_ff_massive_arrests_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y30 дней§!.\n"
  BUL_ff_deal_the_final_blow_zveno_pop_tt:0 "Популярность фракции [GetZvenoName] составляет §Y0§!."
  BUL_ff_deal_the_final_blow_bs_pop_tt:0 "Популярность фракции [GetBsName] составляет §Y0§!."
  BUL_ff_deal_the_final_blow_bzns_pop_tt:0 "Популярность фракции [GetBznsName] составляет §Y0§!."
  BUL_ff_deal_the_final_blow_zveno_destroyed_tt:0 "Фракция [GetZvenoName] уничтожена."
  BUL_ff_deal_the_final_blow_bs_destroyed_tt:0 "Фракция [GetBsName] уничтожена"
  BUL_ff_deal_the_final_blow_bzns_destroyed_tt:0 "Фракция [GetBznsName] уничтожена"
  BUL_rearmament:0 "Перевооружение Болгарии"
  BUL_rearmament_desc:0 "После поражения в Великой войне и навязанного нам Нейиского договора наша армия была сильно ограничена. Однако Европа вновь сотрясается от конфликтов, и если мы хотим сохранить территориальную целостность Болгарии и свободу ее народа, мы должны найти способ выйти за эти ограничения и начать восстанавливать армию."
  BUL_demonstrate_our_policies_of_peace:0 "Продемонстрировать миролюбивую политику"
  BUL_demonstrate_our_policies_of_peace_desc:0 "Чтобы начать переговоры с британским правительством о переоснащении армии, мы должны решить территориальные споры с соседями."
  BUL_pressure_to_lift_army_restrictions:0 "Оказать давление для снятия ограничений на армию"
  BUL_pressure_to_lift_army_restrictions_desc:0 "Мы должны заставить [ENG.GetNameDef] наконец согласиться снять все ограничения на нашу армию"
  BUL_refuse_army_restrictions:0 "Отказаться от ограничений на армию"
  BUL_refuse_army_restrictions_desc:0 "Теперь, когда нас поддерживает [GetBulgarianFactionName], нам больше не требуется согласия [ENG.GetNameDef], чтобы начать военное переоснащение"
  BUL_refuse_army_restrictions_faction_name:0 "[ROOT.GetFactionName]"
  BUL_refuse_army_restrictions_no_faction:1 "наши союзники"
  BUL_rearmament_negotiations_ongoing_flag:0 "В настоящий момент ведутся переговоры о перевооружении"
  BUL_rearmament_main_factors_tt:0 "\nОсновные факторы, которые повлияют на решение [ENG.GetAdjective]:\n§G- Публичное осуждение ВМРО\n- Хорошие отношения с §Y[ENG.GetNameWithFlag]§!\n- Завершение национального фокуса §YTreaty of Perpetual Friendship§! или §YThe Salonika Agreement§!\n- Демократический уклон\n- Такая же форма правления, как у §Y[ENG.GetNameWithFlag]§!§!\n§R- Плохие отношения с §Y[ENG.GetNameWithFlag]§!\n- Поддержка ВМРО\n- Назначение Богдана Филова советником или главой государства§!"
  BUL_purchase_equipment:0 "Приобретение иностранного оборудования"
  BUL_purchase_equipment_desc:0 "[ROOT.GetAdjective] промышленность неразвита и не может производить современное оружие с приемлемой скоростью. Мы должны обратиться к более индустриализированным странам, которые могут поставить нам необходимое военное снаряжение."
  BUL_purchase_artillery:0 "Закупить артиллерию у [FROM.GetAdjective]"
  BUL_purchasing_infantry_equipment_flag:0 " Уже закупает пехотное оборудование в другом месте"
  BUL_purchasing_artillery_flag:0 " Уже закупает артиллерию в другом месте"
  BUL_purchasing_military_vehicles_flag:0 " Уже закупает транспортные средства в другом месте"
  BUL_purchasing_armor_flag:0 " Уже закупает бронетехнику в другом месте"
  BUL_purchasing_aircraft_flag:0 "Уже закупает авиацию в другом месте"
  BUL_purchase_artillery_tt:0 "\nМы закупим [?BUL_quantity_purchased_artillery] ед. §YАртиллерии§![GetAvailableArtilleryToPurchase], основываясь на наших исследованиях.\n"
  BUL_purchase_artillery_anti_air_available:0 " или §YПВО§!"
  BUL_purchase_artillery_anti_tank_available:0 " или §YПТ§!"
  BUL_purchase_artillery_everything_available:0 ", §YПВО§! или §YПТ§!"
  BUL_purchase_artillery_only_artillery_available:0 ""
  BUL_purchase_vehicles_tt:0 "\nМы закупим [?BUL_quantity_purchased_motorized] §YМотопехоты§![GetAvailableVehiclesToPurchase], основываясь на наших исследованиях.\n"
  BUL_purchase_vehicles_mechanized_available:0 " или [?BUL_quantity_purchased_mechanized] §YМеханизированной пехоты§!"
  BUL_purchase_vehicles_armored_car_available:0 " или [?BUL_quantity_purchased_armored_car] §YБронеавтомобилей§!"
  BUL_purchase_vehicles_everything_available:0 ", [?BUL_quantity_purchased_mechanized] §YМеханизированной пехоты§! или [?BUL_quantity_purchased_armored_car] §YБронеавтомобилей§!"
  BUL_purchase_vehicles_only_motorized_available:0 ""
  BUL_purchase_armor_tt:0 "\nМы закупим [?BUL_quantity_purchased_light_armor] §YЛегких танков§![GetAvailableArmorToPurchase], основываясь на наших исследованиях.\n"
  BUL_purchase_armor_medium_available:0 " или [?BUL_quantity_purchased_medium_armor] §YСредних танков§!"
  BUL_purchase_armor_heavy_available:0 " или [?BUL_quantity_purchased_heavy_armor] §YTяжелых танков§!"
  BUL_purchase_armor_everything_available:0 ", [?BUL_quantity_purchased_medium_armor] §YСредние танки§! или [?BUL_quantity_purchased_heavy_armor] §YTяжёлые танки§!"
  BUL_purchase_armor_only_light_available:0 ""
  BUL_purchase_aircraft_tt:0 "\nМы выберем между приобретением [?BUL_quantity_purchased_fighter] §YIстребителей§![GetAvailableAircraftToPurchase], на основе исследования [FROM.GetAdjective].\n"
