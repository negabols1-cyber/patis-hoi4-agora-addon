  BUL_legalize_faction_prevents_oppression_tt:0 "\n§RВыполнение этого решения помешает нам угнетать эту фракцию в будущем, за исключением подавления радикалов, угрожающих благополучию нации.§!"
  BUL_ban_media_prevents_cooperation_tt:0 "\n§RВыполнение этого решения помешает дальнейшему сотрудничеству с этой фракцией.§!"
  BUL_unlock_further_decisions_in_the_chain_tt:0 "Разблокирует дальнейшие решения в цепочке."
  BUL_repress_faction_tt:0 "Препятствует диссидентам этой фракции в создании проблем в ближайшем будущем."
  BUL_bzns_media_banned_flag:0 "Запретил распространение СМИ £faction_bul_bzns §YAграрный национальный союз§!"
  BUL_nsm_media_banned_flag:0 "Запретил распространение СМИ £faction_bul_nsm §YНациональное социалистическое движение§!"
  BUL_impending_zveno_coup:0 "[GetZvenoCoupTitle]"
  BUL_impending_zveno_coup_desc:0 "[GetZvenoCoupDesc]"
  BUL_impending_zveno_coup_size_tt:0 "Сторонники [GetZvenoName] начинают гражданскую войну.\nРазмер военной мощи "Звено" в гражданской войне зависит от популярности "Звено"."

  BUL_macedonian_revolutionary_organizations:0 "Македонские революционные организации"
  BUL_macedonian_revolutionary_organizations_desc:0 "[GetImroDecisionCategoryDesc]"
  BUL_macedonian_revolutionary_organizations_cooperation_desc:0 "Мы должны добиваться сотрудничества с Македонией в случае возможной болгарской оккупации в ближайшем будущем. ВМРО может стать идеальным инструментом для пропаганды болгарского настроения в этом регионе, а в долгосрочной перспективе – для присоединения Македонии."
  BUL_macedonian_revolutionary_organizations_hostile_desc:0 "ВМРО на протяжении слишком долгого времени была бичом Балкан. Мы должны разобраться с оставшимися действующими ячейками ВМРО в Болгарии, посадить в тюрьму их членов, которые больше похожи на гангстеров, чем на революционеров, и, наконец, положить конец их террору."
  BUL_repress_imro_propaganda:0 "Анти-ВМРО пропаганда"
  BUL_repress_imro_propaganda_desc:0 "Мы организуем национальную пропагандистскую кампанию против ВМРО, публично обличая организацию с помощью речей, собраний и митингов."
  BUL_repress_imro_persecute_activists:0 "Преследования активистов ВМРО"
  BUL_repress_imro_persecute_activists_desc:0 "Мы выследим и привлечем к ответственности любого революционного агитатора или активиста, действующего на нашей территории."
  BUL_repress_imro_destroy_organization:0 "Уничтожение остатков ВМРО"
  BUL_repress_imro_destroy_organization_desc:0 "Мы проведем военную операцию вдоль македонской границы, чтобы раз и навсегда искоренить ВМРО."
  BUL_support_imro_make_contacts:0 "Установление контактов с членами ВМРО"
  BUL_support_imro_make_contacts_desc:0 "Мы тайно свяжемся с ВМРО и сообщим их лидерам, что сотрудничество между их организацией и болгарским правительством будет очень выгодно обеим сторонам."
  BUL_support_imro_supply_activists:0 "Снабжение активистов ВМРО"
  BUL_support_imro_supply_activists_desc:0 "Мы снабдим ВМРО оружием, чтобы они могли проникнуть в югославскую и греческую Македонию и дестабилизировать регион."
  BUL_support_imro_prepare_bulgarian_occupation:0 "Подготовка болгарской оккупации"
  BUL_support_imro_prepare_bulgarian_occupation_desc:0 "ВМРО должна организовать Болгарские комитеты действий, которые немедленно возьмут на себя местную власть в случае болгарской оккупации региона."
  BUL_support_imro_militias:0 "Интеграция милиции ВМРО"
  BUL_support_imro_militias_desc:0 "Мы должны использовать опыт македонских революционеров и сформировать дивизии милиции ВМРО, которые будут служить в нашей армии."
  BUL_support_imro_garrisons:0 "Охранные обязанности ВМРО"
  BUL_support_imro_garrisons_desc:0 "Члены ВМРО будут более эффективны в качестве миротворцев в собственном регионе, поэтому они будут выполнять гарнизонные обязанности в наших оккупационных зонах по всей Македонии."
  BUL_macedonian_revolutionary_organizations_foreign:1 "$BUL_macedonian_revolutionary_organizations$"
  BUL_macedonian_revolutionary_organizations_foreign_desc:0 "ВМРО, проболгарская организация, которая слишком долго была бельмом на глазу на Балканах, теперь поддерживается и вооружается Болгарией с намерением дестабилизировать нашу страну и распространять болгарские настроения в регионе. Мы должны положить конец этой организации и её террору раз и навсегда."
  BUL_repress_imro_foreign:0 "Репрессии против активистов ВМРО"
  BUL_repress_imro_foreign_desc:0 "Мы будем выслеживать и привлекать к ответственности всех революционных агитаторов или активистов, действующих в пределах наших границ."
  BUL_destroy_imro_foreign:0 "Уничтожить ВМРО"
  BUL_destroy_imro_foreign_desc:0 "Мы должны провести военную операцию по всей Македонии, чтобы раз и навсегда искоренить ВМРО."
  BUL_destroy_imro_divisions_macedonia_tt:1 "имеет в Софии менее §Y2 пехотных§! дивизий на границе с §YМакедонией§!"
  BUL_destroy_imro_divisions_central_macedonia_tt:1 "имеет в Пловдиве менее §Y4 пехотных§! дивизий на границе с §YЦентральной Македонией§!"
  BUL_destroy_imro_divisions_thrace_tt:1 "имеет в Пловдиве менее §Y4 пехотных§! дивизий на границе с §YФракией§!"
  BUL_macedonian_affairs_ongoing_flag:0 "Ещё одно решение ВМРО активно"
  skirmishes_against_imro:0 "Стычки с ВМРО"
  widespread_bulgarian_sentiment_01:0 "Широко распространённые болгарские настроения"
  widespread_bulgarian_sentiment_02:0 "Широко распространённые болгарские настроения"
 BUL_widespread_bulgarian_sentiment_tt:0 "[BUL.GetNameDefCap] будет получать бонусы при контроле над этими штатами."
 BUL_support_imro_militias_tt:0 "Создает дивизии ОМИМ в полностью контролируемых македонских штатах."
 BUL_support_imro_garrisons_tt:0 "Получает §Y[?BUL_imro_garrisons_mp_value] людских§! ресурсов за каждый македонский штат под полным [ROOT.GetAdjective] контролем."
 BUL_support_imro_supply_activists_resistance_tt:0 "Открывает решения для владельца штата, чтобы в конечном итоге искоренить македонское сопротивление."
 BUL_destroy_imro_divisions_macedonia_foreign_tt:0 "Имеет менее §Y9 пехотных§! дивизий в §YМакедонии§!."
 BUL_destroy_imro_divisions_central_macedonia_foreign_tt:1 "Имеет менее §Y4 пехотных§! дивизий в §YЦентральной Македонии§!."
