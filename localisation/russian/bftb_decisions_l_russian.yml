  BUL_purchase_ships:0 "Приобрести корабли [FROM.GetAdjective]"
  BUL_producing_bulgarian_ships_flag:0 " В настоящее время производятся болгарские корабли"
  BUL_ships_purchase_rejected_flag:0 " Отклонил болгарское предложение о закупке кораблей за последние 180 дней"
