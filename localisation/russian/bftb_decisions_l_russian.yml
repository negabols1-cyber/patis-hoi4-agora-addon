  BUL_purchase_aircraft_tactical_bomber_available:0 " или [?BUL_quantity_purchased_tactical_bomber] §YTактические бомбардировщики§!"
  BUL_purchase_aircraft_everything_available:0 ", [?BUL_quantity_purchased_naval_bomber] §YМорские бомбардировщики§! или [?BUL_quantity_purchased_tactical_bomber] §YTактические бомбардировщики§!"
