  BUL_internal_factions:0 "Управление фракциями"
  BUL_internal_factions_desc:1 "Болгарское общество и политика разделены на многочисленные фракции, которые стремятся либо завоевать расположение правительства, либо поднять массы против него. Болгарское правительство должно решить, какие из этих фракций могут служить его интересам, а какие представляют угрозу, которую необходимо устранить ради нации."
