  GRE_germany_rebuffed:0 "§YГермания§! Инвестиции отклонены"
  GRE_britain_rebuffed:0 "§YБритания§! Инвестиции отклонены"
  GRE_france_rebuffed:0 "§YФранция§! Инвестиции отклонены"
  GRE_italy_rebuffed:0 "§YИталия§! Инвестиции отклонены"
  GRE_soviets_rebuffed:0 "§YСоветский союз§! Инвестиции отклонены"
  GRE_factions_unlocked:0 "Фракции разблокированы"
  GRE_monarchist_economy_change_radical_tt:0 "Резкий сдвиг в экономической политике снизит лояльность §Yмонархической фракции§! на §R15§!.\n"
  GRE_republican_economy_change_radical_tt:0 "Резкий сдвиг в экономической политике снизит лояльность §YВенезилистской фракции§! на §R10§!.\n"
  GRE_monarchist_economy_change_positive_tt:0 "Сохранение прежней экономической политики увеличит лояльность §Yмонархической фракции§! на §G10§!.\n"
  GRE_republican_economy_change_positive_tt:0 "Сохранение прежней экономической политики увеличит лояльность §Yреспубликанской фракции§! на §G5§!.\n"
  GRE_communist_economy_change_tt:0 "Сохранение прежней экономической политики снизит лояльность §Yкоммунистической фракции§! на §R5§!.\n"
  SOV_set_up_puppet_state_in_turkey:0 "Установить марионеточное государство в Турции"
  byz_restore_byzantium:0 "Восстановить Византию"
  byz_restore_byzantium_desc:0 "Вторая эллинская цивилизация - наша величайшая триумфальная, и хотя Запад попытался навязать нам новую греческую идентичность, мы никогда не откажемся от нашего истинного наследия!"
  byz_triumph_for_the_balkans:0 "Триумф для Балкан"
  form_country_dyrrachium_required_states_tt:0 "Для возрождения §YФемы Диррахиума§! требуется контроль над §YАлбанией§! и §YЧерногорией§!."
  form_country_paristrion_required_states_tt:0 "Для возрождения §YФемы Паристрион§! требуется контроль над южными и прибрежными государствами §YРумынии§!."
  form_country_boulgarias_required_states_tt:0 "Для возрождения §YФемы Болгарии§! требуется контроль над всеми §YБолгарскими§! государствами и §YМакедонией§!."
  form_country_sirmium_required_states_tt:0 "Для возрождения §YФемы Сирмиум§! требуется контроль над южными, центральными и прибрежными государствами §YYугославии§!."
  form_country_dyrrachium_coring_states_tt:0 "Получите ядра и переименуйте §YАлбанию§! и §YЧерногорию§!.\n"
  form_country_paristrion_coring_states_tt:0 "Получите ядра и переименуйте применимые §YRумынские§! государства.\n"
  form_country_boulgarias_coring_states_tt:0 "Получите ядра и переименуйте все §YБолгарские§! государства и §YМакедонию§!.\n"
  form_country_sirmium_coring_states_tt:0 "Получите ядра и переименуйте применимые §YYугославские§! государства.\n"
  form_byzantine_empire_flag:0 "Византия восстановлена"
  form_greater_greece_category:0 "Воплотите в жизнь великую идею"
  form_greater_greece_category_desc:0 "Великая Идея – высшая мечта всего [ROOT.GetAdjective] народа. От Эпира до Смирны, Греция снова станет единой."
  form_greater_greece:0 "Создать Великую Грецию"
  form_country_turkish_coastal_required_states_tt:0 "Контролирует все западные §Yтурецкие§! прибрежные штаты."
  form_country_dodecanese_required_state_tt:0 "Контролирует §YOстрова Додеканес§!."
  form_country_cyprus_required_state_tt:0 "Контролирует §YКипр§!."
  form_country_turkish_coast_coring_states_tt:0 "Получить ядра на всех западных §Yтурецких§! прибрежных штатах."
  form_country_cyprus_coring_state_tt:0 "Получить ядра на §YКипре§!."
  GRE_move_capital_to_constantinople:0 "Перенести столицу в Константинополь"
  GRE_move_capital_to_constantinople_desc:0 "Константинополь, столица Второй Эллинской цивилизации, называли „мечтой и надеждой всех греков‟ и городом мировых желаний. Мы можем перенести столицу нашей нации в старую столицу как проявление нашего возрожденного величия."
  move_capital_to_thessaloniki:0 "Перенести столицу в Салоники"
  move_capital_to_thessaloniki_desc:0 "Афины были столицей Первой Эллинской цивилизации, Константинополь – Второй Эллинской цивилизации, но Салоники – вечная „совместная столица‟ эллинской истории – станут новой столицей Третьей Эллинской цивилизации."
  rename_antalya:0 "Переименовать Анталью"
  rename_gjirokaster:0 "Переименовать Гирокастру"
  GRE_appoint_aristotle_onassis_as_prime_minister:0 "Назначить Аристотеля Онассиса премьер-министром"
  GRE_appoint_aristotle_onassis_as_prime_minister_desc:0 "Аристотель Онассис сыграл важную роль в реализации мечты Венезелоса о воплощении Мегали-идеи. Возможно, этот молодой харизматичный магнат — именно тот человек, который объединит нас как нацию, ведь он является [ROOT.GetAdjective] гражданином, родившимся в [339.GetName]."

  form_macedonian_empire_category:0 "Воссоздать Македонскую империю"
  form_macedonian_empire_category_desc:0 "Кто-то скажет, что это безумие — стремиться вернуться к временам империи Александра Македонского, но чтобы действительно закрепить Третью эллинскую цивилизацию, мы должны полностью вернуться к первой, из которой мы произошли."
  form_macedonian_empire:0 "Прославить наследие Аргеадов"
  form_macedonian_empire_desc:2 "Настало время собрать наши сатрапии в одно централизованное государство, единство которого покажет миру, что Греция больше не является страной, над которой можно издеваться или запугивать ее, а империей, внушающей страх."
  form_country_southern_yugoslavia_required_states_tt:0 "Контролирует все штаты §YБолгарии§! и §YАлбании§!, а также все штаты §YЮгославии§! к югу от §YСербии§!."
  form_country_southern_central_asia_required_states_tt:0 "Контролирует §Y[742.GetName]§!, §Y[732.GetName]§! и §Y[405.GetName]§!."
  form_country_british_levant_required_states_tt:0 "Контролирует §Y[454.GetName]§!, §Y[455.GetName]§! и §Y[656.GetName]§!"
  form_country_punjab_required_states_tt:0 "Контролирует все штаты §YПакистана§!."
  TUR_the_constitutional_arrows_category:0 "Закон № 3115"
  TUR_the_constitutional_arrows_category_desc:0 "Шесть основных принципов [ROOT.GetNameDef] закреплены в нашей конституции, и пока мы чтим их, мы должны верить, что наша нация никогда не будет разорвана изнутри."
  TUR_republicanism_decision:0 "Республиканство"
  TUR_republicanism_decision_desc:0 "Эта страна родилась из пепла провалившегося Османского султаната. Сейчас мы не отвечаем ни перед какими султанами, ни перед халифами, ни перед какими богами - мы свободны, и мы заплатили за это право."
  TUR_stoked_republicanism_flag:0 "Недавно раздули республиканские настроения."
  TUR_secularism_decision:0 "Светскость"
  TUR_secularism_decision_desc:0 "Если мы позволим догмам архаичной веры, которые остаются в средних веках, управлять нашим правлением и нашим образом жизни, то мы никогда не разовьем возможности, необходимые для того, чтобы считаться равными среди великих держав мира."
  TUR_stoked_secularism_flag:0 "Недавно раздули светские настроения."
  TUR_populism_decision:0 "Популизм"
  TUR_populism_decision_desc:0 "Народ всегда должен быть главным приоритетом любого ответственного правительства. В этом вопросе нет места для дебатов."
  TUR_stoked_populism_flag:0 "Недавно раздули популистские настроения."
  TUR_nationalism_decision:0 "Национализм"
  TUR_nationalism_decision_desc:0 "Мы уже боролись и умирали за нашу страну, и мы все должны быть готовы сделать это снова."
  TUR_stoked_nationalism_flag:0 "Недавно подогретые националистические настроения."
  TUR_etatism_decision:0 "Этатизм"
  TUR_etatism_decision_desc:0 "Преимуществами директивно управляемой экономики является то, что исполнительная власть сохраняет значительное влияние на управление экономикой через фискальные механизмы. Было бы в национальных интересах задействовать эти механизмы сейчас."
  TUR_no_longer_has_etatism_tt:0 "Больше не поддерживается этатизм!"
  TUR_etatism_abolished:0 "Этатизм упразднен."
  TUR_reformism_decision:0 "Реформизм"
  TUR_reformism_decision_desc:0 "Наши люди всегда были на передовом рубеже - даже османы были известны тем, что временами продвигали новые политические или социальные реформы. Динамизм людей [FROM.GetAdjective] является одним из наших величайших качеств."
  TUR_stoked_reformism_flag:0 "Недавно подогретые реформистские настроения."
  TUR_revolutionism_decision:0 "Революционизм"
  TUR_revolutionism_decision_desc:0 "Свержение османского ига и образование турецкого национального государства были революцией. Мы изменились и продолжаем меняться, по мере того как пробираемся через наши национальные метаморфозы и идем к тому, кем мы всегда были предназначены стать..."
  TUR_stoked_revolutionism_flag:0 "Недавно подогретые революционные настроения."
  TUR_liberalism_decision:0 "Либерализм"
  TUR_liberalism_decision_desc:0 "Свобода определять свое будущее является краеугольным камнем наших мечтаний о будущем этой нации. Свободная торговля, свободные выборы, свобода вероисповедания, свобода возможностей - вот к чему мы должны постоянно стремиться."
  TUR_stoked_liberalism_flag:0 "Недавно разгорелись либеральные настроения."
  TUR_jihad_decision:0 "Джихад"
  TUR_jihad_decision_desc:0 "Мечом и волей Всевышнего мы совершим Его волю и поразим заблудшие души, которые отступились от Его пути."
  TUR_stoked_jihad_flag:0 "Недавно разгорелись экстремистские настроения."
  TUR_fidelity_decision:0 "Верность"
  TUR_fidelity_decision_desc:0 "Верность султану, верность Всевышнему - вот два основных столпа, перед которыми каждый гражданин должен преклоняться с благоговением."
  TUR_stoked_fidelity_flag:0 "Недавно разгорелись религиозные настроения."
  TUR_absolutism_decision:0 "Абсолютизм"
  TUR_absolutism_decision_desc:0 "Правление султана является абсолютным; Османская империя когда-то была разорвана изнутри, и мы никогда не должны позволить истории повториться."
  TUR_stoked_absolutism_flag:0 "Недавно разгорелись монархические настроения."
  TUR_ultranationalism_decision:0 "Ультранационализм"
  TUR_ultranationalism_decision_desc:0 "Недостаточно просто быть готовым умереть за свою страну; каждый гражданин должен полностью отдать себя во благо нации умом, телом и духом."
  TUR_stoked_ultranationalism_flag:0 "Недавно разгорелись ультранационалистические настроения."
  TUR_socialism_decision:0 "Социализм"
  TUR_socialism_decision_desc:0 "Мы свергли старую аристократию, и теперь мы должны сотрудничать с рабочим классом, чтобы покончить с высокомерными капиталистами наших дней."
  TUR_stoked_socialism_flag:0 "Недавно разжигаемые социалистические настроения."
  TUR_alter_the_royal_laws_of_succession:0 "Изменить порядок престолонаследия"
  TUR_alter_the_royal_laws_of_succession_desc:0 "Новый султанат предоставляет прекрасную возможность реформировать устаревшие законы о наследовании. Мы должны принять политику агнатическо-когнатической первородства, чтобы только прямые потомки султана могли наследовать трон."
  TUR_industrial_projects_category:0 "Промышленные проекты"
  TUR_industrial_projects_category_desc:0 "Учитывая, насколько молодым является [ROOT.GetAdjective] нация, начинающим промышленным проектам часто требуется помощь правительства, чтобы полностью реализоваться."
  TUR_financing_private_enterprise_flag:0 "Уже финансируем частные предприятия."
  TUR_open_the_nazilli_calico_factory:0 "Открыть фабрику ситца в Назилли"
  TUR_open_the_nazilli_calico_factory_desc:1 "Обязанность правительства - оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_finance_the_bursa_merinos_factory:0 "Финансировать фабрику мериноса в Бурсе"
  TUR_finance_the_bursa_merinos_factory_desc:1 "Обязанность правительства - оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_fund_the_gemlik_silk_factory:0 "Финансировать шелковую фабрику в Гемлике"
  TUR_fund_the_gemlik_silk_factory_desc:1 "Правительство должно оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_construct_the_zonguldak_coal_refinery:0 "Построить нефтеперерабатывающий завод в Зонгулдаке"
  TUR_construct_the_zonguldak_coal_refinery_desc:1 "Правительство должно оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_modernise_the_general_directorate_of_military_factories:0 "Модернизировать Генеральное управление военных заводов"
  TUR_modernise_the_general_directorate_of_military_factories_desc:1 "Правительство должно оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_authorise_the_nuri_killigil_factory:0 "Уполномочить завод Nuri Killigil"
  TUR_authorise_the_nuri_killigil_factory_desc:1 "Правительство должно оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_sponsored_killigil_armaments_flag:0 "Спонсируемые §YKilligil Armaments§! через решение §YSanayiciler Industrial Projects§!"
  TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory:0 "Спонсировать авиационный завод Nuri Demirağ Beşiktaş"
  TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory_desc:1 "Правительство должно оценивать потенциальные промышленные проекты в каждом конкретном случае."
  TUR_invest_in_malatya_cigarette_factory:0 "Инвестировать в табачную фабрику Малатья"
  TUR_invest_in_malatya_cigarette_factory_desc:1 "Правительство должно рассматривать возможные промышленные проекты индивидуально."
  TUR_bankroll_the_malatya_clothing_factory:0 "Профинансируйте швейную фабрику Малатьи"
  TUR_bankroll_the_malatya_clothing_factory_desc:1 "Правительство должно рассматривать возможные промышленные проекты индивидуально."
  TUR_subsidise_the_karabuk_iron_steel_factory:0 "Субсидируйте Карабюкский металлургический завод"
  TUR_subsidise_the_karabuk_iron_steel_factory_desc:1 "Правительство должно рассматривать возможные промышленные проекты индивидуально."
  TUR_karabuk_iron_steel_factory_modernised_flag:0 "§YКарабюкский металлургический завод§! был модернизирован за счёт §YСанйичилер§!."
  TUR_sponsor_petrol_olfisis_formation:0 "Финансируйте основание Petrol Ofisi"
  TUR_sponsor_petrol_olfisis_formation_desc:0 "Правительство убеждают создать государственную организацию, которая займётся нефтяными разработками и вопросами энергетики, связанными с нефтью."
  TUR_petrol_ofisi_formed:0 "Petrol Ofisi основана.\n"
  TUR_repeal_the_wealth_tax:0 "Отмените налог на богатство"
  TUR_repeal_the_wealth_tax_desc:0 "Этот налог на немусульман несправедлив и порочит наш кемалистский режим; правильным будет отменить этот налог немедленно."
  TUR_repeal_the_faith_tax:0 "Отмените налог на вероисповедание"
  TUR_repeal_the_faith_tax_desc:0 "Этот налог на религиозные учреждения не жизнеспособен, и хотя наши цели были благородными, правда в том, что [ROOT.GetNameDef] просто не готова к такой радикальной политике. Разумным действием будет отмена налога."
  TUR_abolish_etatism:0 "Отменить этатизм"
  TUR_abolish_etatism_desc:0 "Этатизм был славным достижением системы Кемализма и плодотворным экспериментом, но, к сожалению, это эксперимент, который, возможно, придётся прекратить насовсем для всеобщего блага."
  TUR_absorb_the_tpda:0 "Включить T.P.D.A."
  TUR_absorb_the_tpda_desc:0 "Турецкое управление государственным долгом внедрено в наш промышленный сектор как опухоль, но мы можем реинтегрировать организацию как национальный процесс, чтобы устранить Управление по долгам как препятствие для нашего дальнейшего развития."
  TUR_pay_off_our_debts:0 "Погасить наши долги"
  TUR_pay_off_our_debts_desc:0 "За время своего существования Османская империя накопила огромную задолженность, и мы потратили довольно много на восстановление нашей нации. В настоящее время мы находимся в хорошем положении, чтобы погасить часть этого долга!"
  TUR_discuss_investment_possibilities_with_FROM:0 "Обсудить возможности инвестиций с [FROM.GetNameDef]"
 TUR_discuss_investment_possibilities_with_FROM_desc:0 "В прошлом [ROOT.GetAdjective] политика была направлена на то, чтобы избежать иностранных инвестиций и вмешательства там, где мы можем - но больше нам нечего бояться, кроме простых транзакций, таких как инвестиции. Они будут относиться к нам как к равным, и мы могли бы стать богаче за это."
 TUR_investment_opinion_tt:0 "Чем выше §Y[FROM.GetNameDef]'s§! мнение о нас, тем больше будет возможностей для инвестиций.\n"
 ROOT_invest_in_turkish_state_building:1 "Инвестировать в строительство [FROM.GetAdjective] государств"
 ROOT_invest_in_turkish_state_building_desc:0 "Критическая инфраструктура [FROM.GetAdjective] недоразвита во многих регионах страны; это то, что мы можем исправить."
 ROOT_invest_in_turkish_state_light_industry:1 "Инвестировать в легкую промышленность [FROM.GetAdjective]"
 ROOT_invest_in_turkish_state_light_industry_desc:0 "Легкая промышленность [FROM.GetAdjective] слаборазвита во многих регионах страны; это то, что мы можем исправить."
 ROOT_invest_in_turkish_state_heavy_industry:1 "Инвестировать в тяжелую промышленность [FROM.GetAdjective]"
 ROOT_invest_in_turkish_state_heavy_industry_desc:0 "Тяжелая промышленность [FROM.GetAdjective] слаборазвита во многих регионах страны; это то, что мы можем исправить."
 TUR_investment_pursued:0 "Инвестиции Преследуемые"
 ROOT_turkish_investment_ai_tt:0 "Чем лучше наши §Yинвестиции§! в §Y[TUR.GetNameDef]§!, тем ближе мы сможем связать их с нашими интересами, одновременно отчуждая их от наших врагов.\n"
  TUR_kurdish_state_management_category:0 "Управление курдскими государствами"
  TUR_kurdish_state_management_category_desc:0 "Проблема курдов преследовала нас еще до основания Республики, хотя с тех пор она, безусловно, только обострилась. Необузданный национализм и обреченные попытки создания нации угрожают уничтожить наследие Войны за независимость, и мы не можем допустить никакого сценария, при котором свободный Курдистан возникнет из остатков нашей собственной нации."
  TUR_kurdish_state_management_map_category_name:0 "Это государства, в которых есть курдские повстанцы."
  TUR_agitate_kurdish_state_effect_tt:0 "£faction_tur_kurdish §YKurdish rebels§! усилят сопротивление правительству в §Y[TUR_kurdish_state_event_target.GetName]§!."
  TUR_pacify_kurdish_state_effect_tt:1 "£faction_tur_kurdish §YKurdish rebels§! в §Y[TUR_kurdish_state_event_target.GetName]§! будут усмирены."
  TUR_placate_kurdish_state_effect_tt:0 "£faction_tur_kurdish §YKurdish rebels§! в §Y[TUR_kurdish_state_event_target.GetName]§! будут умиротворены."
  TUR_kurdish_modifiers_trigger_tt:0 "Все £faction_tur_kurdish §YKurdish§! государства либо являются §Yкорами§!, либо имеют модификатор §YUсталость от сепаратизма§!."
  TUR_no_current_integration_targets_available_tt:0 "Перед тем, как государство £faction_tur_kurdish §YKurdish§! можно будет присоединить, §YСогласие§! должно быть увеличено как минимум до §Y70%§!, а §YСопротивление§! должно быть снижено как минимум до §Y30%§!."
  TUR_integrate_kurdish_state_effect_tt:0 "Государство £faction_tur_kurdish §YKurdistan§! потеряет свои модификаторы и станет штатом §Y[TUR.GetNameDef]§!."
  TUR_counter_the_rebels_in_diyarbakir:0 "Дать отпор повстанцам в Диярбакыре"
  TUR_counter_the_rebels_in_diyarbakir_desc:0 "Повстанцы в Диярбакыре, как правило, не так доставляют неприятности как в других местах; вероятно, из-за относительно развитого статуса Диярбакыра."
  TUR_counter_the_rebels_in_erzurum:0 "Дать отпор повстанцам в Эрзуруме"
  TUR_counter_the_rebels_in_erzurum_desc:0 "Эрзурум является центром политической активности и деятельности курдов, но редко местом для политического насилия. Тем не менее, мир меняется во многих отношениях..."
  TUR_counter_the_rebels_in_van:0 "Дать отпор повстанцам в Ване"
  TUR_counter_the_rebels_in_van_desc:0 "Ван является одним из наших самых восточных государств и во всех отношениях полностью неузнаваем по сравнению с нашими самыми западными государствами."
  TUR_counter_the_rebels_in_hakkari:0 "Дать отпор повстанцам в Хаккари"
  TUR_counter_the_rebels_in_hakkari_desc:0 "Повстанцы в Хаккари обычно немного более организованы, чем в других штатах, и их значительно труднее выкорчевать из-за множества гор и холмов."
  TUR_decision_cost_kurd_rebels:0 "£command_power  §Y15§!"
  TUR_decision_cost_kurd_rebels_blocked:0 "£command_power  §R15§!"
  TUR_offer_conscription_exceptions_to_kurdish_groups:0 "£faction_tur_kurdish Предложить освобождение от призыва для курдских групп"
  TUR_offer_conscription_exceptions_to_kurdish_groups_desc:0 "Многие курдские группировки не требуют полной независимости, а всего лишь признания некоторой степени автономии. Мы можем предложить освобождение от призыва в армию в обмен на заключение мира."
  TUR_integrate_kurdish_state:0 "£faction_tur_kurdish Интеграция курдского государства"
  TUR_integrate_kurdish_state_desc:0 "Сотрудничая с местными лидерами, мы можем гарантировать, что курдские государства нашей страны будут интегрированы в национальный каркас нашего государства-нации."
  TUR_unlock_kurdish_integration_decisions_tt:0 "Разблокирует решения:§Y$TUR_integrate_kurdish_state$§!"
  TUR_integrate_diyarbakir:0 "£faction_tur_kurdish Интеграция Диярбакыра"
  TUR_integrate_diyarbakir_desc:0 "$TUR_integrate_kurdish_state_desc$"
  TUR_integrate_hakkari:0 "£faction_tur_kurdish Интеграция Хаккяри"
  TUR_integrate_hakkari_desc:0 "$TUR_integrate_kurdish_state_desc$"
  TUR_integrate_tunceli:0 "£faction_tur_kurdish Интеграция Эрзурума"
  TUR_integrate_tunceli_desc:0 "$TUR_integrate_kurdish_state_desc$"
  TUR_integrate_van:0 "£faction_tur_kurdish Интеграция Вана"
  TUR_integrate_van_desc:0 "$TUR_integrate_kurdish_state_desc$"
  TUR_kurdish_resistance_escalation_mission:0 "£faction_tur_kurdish Эскалация сопротивления курдов в борьбе с правительством"
  TUR_kurdish_resistance_escalation_mission_desc:0 "Курдские повстанцы вновь усиливают свою борьбу с правительством на юго-востоке нашей страны."
  TUR_acted_against_kurd_rebels_recently_flag:0 "Недавно подверг репрессиям курдских повстанцев"
  TUR_fundamentalist_state_management_category:0 "Управление страной фундаменталистами"
  TUR_fundamentalist_state_management_category_desc:0 "В этой стране есть люди, которые были не полностью готовы к тому, что роль религии изменится так быстро в [ROOT.GetAdjective] стране. К этим лицам требуется мягкий подход, хотя им нельзя позволить препятствовать нашему движению к прогрессу."
  TUR_fundamentalist_state_management_map_category_name:0 "Это те страны, которые выступают против принципов кемализма."
  TUR_encourage_avid_fundamentalist_disciples_to_migrate_into_state:1 "£faction_tur_traditionalist Поощрять переселение ярых последователей фундаменталистов в подверженные влиянию сообщества"
  TUR_increase_influence_of_fundamentalists_in_state:0 "£faction_tur_traditionalist Увеличить влияние фундаменталистов"
  TUR_increase_influence_of_fundamentalists_in_state_desc:1 "Свет Всевышнего должен коснуться каждого уголка нашей гордой страны."
  TUR_hold_a_march_in_state:0 "£faction_tur_kemalist Провести марш в фундаменталистской стране"
  TUR_hold_a_march_in_state_desc:0 "Минувшие религиозные элементы этой страны будут поражены проявлением преданности со стороны наших непоколебимых идеологических последователей во время марша по повстанческим общинам."
  TUR_acquiesce_to_fundamentalists:0 "£faction_tur_traditionalist Согласиться с фундаменталистами"
  TUR_acquiesce_to_fundamentalists_desc:0 "Чтобы эта республика выжила, необходимо идти на компромиссы - даже если это означает подрыв конституции, на которой основана эта нация."
  TUR_empower_fundamentalists_in_state:0 "£faction_tur_traditionalist Укрепить фундаменталистов в государстве"
  TUR_empower_fundamentalists_in_state_desc:1 "Наши единоверцы требуют от правительства всей возможной поддержки."
  TUR_kemalist_state_management_category:0 "Кемалистское управление государством"
  TUR_kemalist_state_management_category_desc:0 "Сторонники кемализма, как правило, живут в крупных городских центрах и склонны защищать свои политические взгляды так, как если бы они защищали образ жизни."
  TUR_kemalist_state_management_map_category_name:0 "Это государства, лояльные идеологии кемализма."
  TUR_kemalist_loyalty_and_power_update_effect_tt:0 "§YОфицеры-кемалисты§! скорректируют свой статус в ответ на действия правительства."
  TUR_kemalist_influenced_state_effect_tt:0 "§YКемалисты§! £faction_tur_kemalist возьмут на себя роль единоличных администраторов государства."
  TUR_kemalist_turn_hostile_effect_tt:0 "§YКемалисты§! £faction_tur_kemalist станут §Rвраждебными§! по отношению к правительству."
  TUR_counter_influence_of_fundamentalists_in_state:1 "£faction_tur_kemalist Начать антифундаменталистскую операцию"
  TUR_embed_kemalist_propagandists_into_state:1 "£faction_tur_kemalist Внедрить кемалистских пропагандистов в государство"
  TUR_embed_kemalist_propagandists_into_state_desc:0 "Необходимо приложить максимум усилий, чтобы идеология Кемализма укоренилась в сердцах как можно большего количества граждан и смогла сохраниться в будущем."
  TUR_the_enemy_within:0 "Внутренний враг"
  TUR_the_enemy_within_desc:0 "Наша страна разделена на группы по политическим, этническим и религиозным признакам, и эти разногласия угрожают разрушить нацию и ввергнуть нас в хаос. В нашей стране действуют гнусные силы. Мы не должны позволить им победить законное правительство [ROOT.GetNameDef]."
  TUR_unaligned_state_management_map_category_name:0 "Это государства, которые в данный момент остаются незакреплёнными."
  TUR_ideological_battleground_state:1 "Не является £faction_tur_unaligned §YНезакреплённым государством§!"
  TUR_is_fundamentalist_state_tt:0 "Считается £faction_tur_traditionalist §YТрадиционалистским государством§!"
  TUR_is_kemalist_state_tt:0 "Считается £faction_tur_kemalist §YКемалистским государством§!"
  TUR_traditionalist_infiltration_mission:0 "Традиционалистский кризис инфильтрации £faction_tur_traditionalist"
  TUR_traditionalist_infiltration_mission_desc:0 "По всей видимости, религиозные элементы нашего общества в очередной раз пытаются расширить присутствие своих последователей в регионах, где их поддержка на среднем уровне."
  TUR_thwarting_traditionalist_infiltration:0 "Сдерживание попыток традиционалистов по инфильтрации £faction_tur_kemalist"
  TUR_thwarting_traditionalist_infiltration_desc:0 "Мы не должны позволять тем, кто стремится подорвать светский характер этой страны, беспрепятственно проникать на запад; мы обязаны их остановить."
  TUR_entrench_kemalism_in_state:0 "£faction_tur_kemalist Утвердить кемализм в государстве"
  TUR_entrench_kemalism_in_state_desc:0 "Мы должны упорно трудиться, чтобы гарантировать, что идеология кемализма укрепится в сердцах как можно большего числа людей, если она должна выжить в будущем."
  TUR_root_out_kemalists_in_state:0 "£faction_tur_traditionalist Искоренить кемалистов в государстве"
  TUR_root_out_kemalists_in_state_desc:0 "Мы внушим страх сердцам безбожных кемалистских негодяев, которые продолжают терзать эту страну."
  TUR_kemalist_infiltration_mission:0 "£faction_tur_kemalist Кризис кемалистской инфильтрации"
  TUR_kemalist_infiltration_mission_desc:0 "Кемалисты, не смирившись с тем, что народ отстранил их от власти, все еще придерживаются своих старых уловок. Они стремятся к монополии на власть на западе; их надо остановить."
  TUR_hostile_kemalists_influenced_state_effect_tt:1 "£faction_tur_kemalist §YПредатели-кемалисты§! окопаются в §Y[TUR_kemalist_state_event_target.GetName]§!."
  TUR_thwarting_kemalist_infiltration:0 "£faction_tur_traditionalist Противодействие попыткам кемалистской инфильтрации"
  TUR_thwarting_kemalist_infiltration_desc:0 "Помешать кемалистам дальнейшему распространению их яда — не просто гражданский долг, это священный долг."
  TUR_reforming_our_armed_forces_category:0 "Реформирование вооруженных сил"
  TUR_reforming_our_armed_forces_category_desc:0 "Наши вооруженные силы были разрушены после Войны за независимость: потребовалось все, что у нас было, и даже больше, чтобы завоевать нашу свободу у империалистов. Реформы в армии можно было на время отложить, однако мир стремительно превращается в более опасное место."
  TUR_modernize_our_tactics:0 "Модернизация тактики"
  TUR_modernize_our_tactics_desc:0 "Многие из тех, кто сейчас служат в наших вооруженных силах, — это ветераны Войны за независимость, однако они не могут осознать, что будущая война не будет похожа на войну 1922 года."
  TUR_teach_the_proper_use_of_modern_infrastructure:0 "Проинструктировать надлежащим образом о применении современной инфраструктуры"
  TUR_teach_the_proper_use_of_modern_infrastructure_desc:0 "Многие в наших вооруженных силах плохо приспособились к появлению железных дорог и дорог и по-прежнему настаивают на поездках верхом на лошадях."
  TUR_commence_an_overhaul_of_our_training_methods:0 "Начать капитальный ремонт наших методов обучения"
  TUR_commence_an_overhaul_of_our_training_methods_desc:0 "Наши методы преподавания и обучения неэффективны. Наши ветераны учились на опыте, однако у наших новобранцев, похоже, практически нет здравого смысла."
  TUR_streamline_communication_methods_between_ships:0 "Усовершенствовать методы коммуникации между кораблями"
  TUR_streamline_communication_methods_between_ships_desc:0 "Большая часть оборудования, используемого на наших военно-морских судах, устарело и ненадежно."
  TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect:1 "Легализация новых правил безопасности полетов"
  TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect_desc:0 "Мы всегда гордились тем, что являемся лидерами в области авиационных инноваций в Европе, но наши пилоты имеют заслуженную репутацию людей, ведущих себя как сорвиголовы."
  TUR_etatism_crisis_1:0 "Растущая инфляция"
  TUR_etatism_crisis_1_desc:0 "Попытки одновременно поддерживать нашу этатистскую экономическую модель и принимать военную экономику оказываются проблематичными."
  TUR_etatism_crisis_2:0 "Девальвация турецкой лиры"
  TUR_etatism_crisis_2_desc:0 "Попытки одновременно поддерживать нашу этатистскую экономическую модель и принимать военную экономику оказываются проблематичными."
  TUR_etatism_crisis_3:0 "Ухудшение рецессии"
  TUR_etatism_crisis_3_desc:0 "Попытки одновременно поддерживать нашу этатистскую экономическую модель и принимать военную экономику оказываются проблематичными."
  TUR_etatism_crisis_4:0 "Неминуемая депрессия"
  TUR_etatism_crisis_4_desc:0 "Попытки одновременно поддерживать нашу этатистскую экономическую модель и принимать военную экономику оказываются проблематичными. Если мы не предпримем реальных действий по этому вопросу, то мы вполне можем разрушить всю нашу экономику."
  ott_reform_the_eyalet_of_rumelia:0 "Реформировать эялет Румелия"
  ott_merge_the_eyalets_of_morea_crete_and_kibris:0 "Объединить эйялеты Морея, Крит и Кибрис"
  ott_enlarge_the_vilayet_of_bosnia:0 "Расширить Вилайет Боснии"
  ott_restore_the_vilayet_of_the_danube_and_moldova:0 "Восстановить Вилайет Дунай и Молдовы"
  ott_restore_the_vilayet_of_halep:0 "Восстановить Вилайет Халеб"
  ott_restore_the_vilayet_of_beirut:0 "Восстановить Вилайет Бейрут"
  ott_restore_the_vilayet_of_baghdad:0 "Восстановить Вилайет Багдад"
  ott_extend_the_lasha_eyalet:0 "Расширить Эйялет Лаша"
  ott_merge_the_eyalets_of_jeddah_habesh_and_yemen:0 "Объединить эйялеты Джидда, Хабеш и Йемен"
  ott_integrate_the_khedivate_of_egypt:0 "Интегрировать хедиват Египта"
  ott_restore_the_vilayet_of_tripolitania:0 "Восстановить Вилайет Триполитания"
  ott_absorb_the_tunis_and_algerian_eyalets:0 "Присоединить Эйялет Тунис и Алжир"
  develop_malatya_chromium_deposits:0 "Разработать месторождения хромита в Малатье"
  develop_mersin_chromium_mines:0 "Разработать хромитовые рудники в Мерсине"
  utilize_diyarbakir_chromium_deposits:0 "Использовать месторождения хромита в Диярбакыре"
  expand_the_kirikkale_steel_mills:0 "Расширить сталелитейный завод в Кырыккале"
  develop_the_iron_mines_in_divrigi:0 "Разработать железные рудники в Дивриги"
  exploit_the_raman_oil_field:0 "Разрабатывать месторождение нефти в Рамане"
  drill_in_the_garzan_oil_field:0 "Бурить в Гарзанском нефтяном месторождении"
  expand_the_west_raman_oil_field:0 "Расширить западное Раманское нефтяное месторождение"
  form_rumelia_greece_required_states_tt:0 "Контролирует все §Yгреческие§! штаты севернее §Y[186.GetName]§!."
  form_rumelia_bulgaria_required_states_tt:0 "Контролирует все §Yболгарские§! штаты."
  form_rumelia_yugoslavia_required_states_tt:0 "Контролирует все §Yсербские§!, §Yмакедонские§! и §Yчерногорские§! штаты."
  form_rumelia_albania_required_states_tt:0 "Контролирует все §Yалбанские§! штаты."
  form_rumelia_greece_coring_states_tt:0 "Присоединяет все §Yгреческие§! штаты севернее §Y[186.GetName]§!."
  form_rumelia_bulgaria_coring_states_tt:0 "Присоединяет все §Yболгарские§! штаты."
  form_rumelia_yugoslavia_coring_states_tt:0 "Присоединяет все §Yсербские§!, §Yмакедонские§! и §Yчерногорские§! штаты."
  TUR_the_fading_father_category:0 "Бледнеющий Отец"
  TUR_the_fading_father_category_desc:0 "Отец турок, Мустафа Кемаль Ататюрк, все чаще и чаще болеет. Мы должны противостоять печальной реальности, что мессианский отец-основатель нашей нации может не дожить до конца нынешнего кризиса, с которым столкнулся мир.\n\nТекущее состояние здоровья Ататюрка: [ROOT.GetAtaturkHealthBar].\nВозможность исцеления болезни Ататюрка: [?ataturk_health|%G0] \n \n§RДля того чтобы Ататюрк поправил свое здоровье, необходимо увеличить вероятность с помощью методов лечения. §!"
  TUR_health_bar_text:0 "Вероятность исцеления от болезни Ататюрка: [?ataturk_health|%G0] \n \n§RДля того, чтобы Ататюрк смог восстановить здоровье, необходимо повышать вероятность с помощью методов лечения. §!"
  TUR_ataturk_health_worsening_crisis:0 "Ухудшение состояния здоровья Ататюрка"
  TUR_ataturk_health_worsening_crisis_desc:0 "По мере того, как Мустафа Кемаль Ататюрк стареет, периоды болезни неизбежно становятся всё хуже и хуже. Сколько времени пройдёт до тех пор, пока Отец турок не заболеет так сильно, что уже не сможет выздороветь?"
  TUR_seek_treatment_for_ataturk:0 "Организовать лечение для Ататюрка"
  TUR_seek_treatment_for_ataturk_desc:0 "Если мы хотим, чтобы наш Гази прожил ещё несколько лет, то жизненно важно, чтобы он на время отошёл от стрессовой работы по руководству нашей страной. Мы отправим его в лучшие санатории по всему миру, где ему будут оказаны все необходимые процедуры, и на лучшие курорты, где он сможет отдохнуть."
  TUR_worsen_ataturks_health_effect_tt:0 "Эффективность §YМустафы Кемаля Ататюрка§! в качестве лидера снизится из-за его §Yшаткого здоровья§!."
  TUR_retire_ataturk:0 "Отправить Ататюрка на пенсию"
  TUR_retire_ataturk_desc:0 "Это печально осознавать, но, возможно, будет лучше, если наш Гази проведёт последние дни своей жизни со своей семьёй и путешествуя по континенту по своему усмотрению. Мы не можем дальше эгоистично претендовать на его жизнь: не после того, как он уже пожертвовал так много ради этой страны и её народа."
  TUR_ataturk_health_poor_tt:0 "§YМустафа Кемаль Ататюрк§! будет считаться имеющим §Yслабое§! здоровье."
  TUR_ataturk_health_terminal_tt:0 "§YМустафа Кемаль Ататюрк§! будет взят под паллиативное наблюдение из-за своего §Yнеизлечимого§! состояния."
  TUR_ataturk_health_stable:0 "§YСтабильное§!"
  TUR_ataturk_health_poor:0 "§YПлохое§!"
  TUR_ataturk_health_terminal:0 "§RНеизлечимое§!"
  TUR_acquiesce_to_fundamentalists_tt:0 "Это и до §Y2§! дополнительных £faction_tur_traditionalist §Yтрадиционных государств§! начнут больше сотрудничать с правительством."
  
  the_national_oath_category:0 "Национальная присяга"
  the_national_oath_category_desc:0 "Османская империя должна была пасть; это было неизбежно, как и необходимо. Мы потеряли больше, чем выиграли, когда нам пришлось подписать Лозаннский договор в 1923 году, и давно пора вернуть то, что у нас было украдено."
  restore_the_borders_of_1920:0 "Восстановить границы 1920 года"
  restore_the_borders_of_1920_desc:0 "С этой прокламацией Лозаннский договор наконец отменён, и мы действительно освободились от империалистического ярма."
  
  form_turan_category:0 "Образование Туранской империи"
  form_turan_category_desc:0 "Долгое время Туран казался больше фантазией, чем реальностью, но теперь у нас есть возможность объединить все тюркские народы мира под одним флагом. Разве мы можем отказаться?"
  form_turan_category2:0 "Образование Туранской империи"
  form_turan_category2_desc:0 "Долгое время Туран казался больше фантазией, чем реальностью, но теперь у нас есть возможность объединить все тюркские народы мира под одним флагом. Разве мы можем отказаться?"
  form_turan:0 "Сформировать Туран"
  form_turan_desc:0 "С объединением Турана наш статус мировой державы будет подтверждён. Тюркские народы больше никогда не будут угнетены другой державой."
  form_turan2:0 "Сформировать Туран"
  form_turan2_desc:0 "С объединением Турана наш статус мировой державы будет подтверждён. Тюркские народы больше никогда не будут угнетены другой державой."
  form_turan_flag:0 "Сформирован Туран"
