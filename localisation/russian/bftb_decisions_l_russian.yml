  BUL_italian_naval_agreements_flag:0 "Подписал договор о сотрудничестве в области флота с Италией"
  BUL_foreign_agreements_factions_ger_tt:0 "Не состоит в фракции с §Y[GER.GetNameWithFlag]§! (или §Y[GER.GetNameWithFlag]§! — субъект §Y[ROOT.GetNameWithFlag]§!)"
  BUL_foreign_agreements_factions_eng_tt:0 "Не входит в фракцию с §Y[ENG.GetNameWithFlag]§! (или §Y[ENG.GetNameWithFlag]§! является подданным §Y[ROOT.GetNameWithFlag]§!)"
  BUL_foreign_agreements_factions_sov_tt:0 "Не входит в фракцию с §Y[SOV.GetNameWithFlag]§! (или §Y[SOV.GetNameWithFlag]§! является подданным §Y[ROOT.GetNameWithFlag]§!)"
  BUL_foreign_agreements_factions_ita_tt:0 "Не входит во фракцию с §Y[ITA.GetNameWithFlag]§! (или §Y[ITA.GetNameWithFlag]§! является подданным §Y[ROOT.GetNameWithFlag]§!)"
  BUL_uranium_concession_agreement:0 "Соглашения о концессии урана с [FROM.GetNameDef]"
  BUL_uranium_concession_agreement_desc:0 "Мы не можем извлечь максимум пользы из запасов урана в нашей земле, и это было бы выгодно не только для нас, но и для наших [FROM.GetAdjective] союзников, заключить контракт, предоставляющий им право на добычу в обмен на полезные материалы и продукты для нашей отечественной промышленности и сельского хозяйства."
  BUL_negotiate_claims_in_the_balkans:0 "Договориться о наших претензиях на Балканах"
  BUL_negotiate_claims_in_the_balkans_desc:0 "Прежде чем присоединиться к любой великой державе, мы должны договориться о наших территориальных требованиях с Германией. Международная напряженность нарастает, и Болгария будет поддерживать только ту страну, которая предложит ей лучшее территориальное соглашение."
  BUL_demand_our_historical_claims:0 "Требуем удовлетворения наших исторических претензий"
  BUL_secure_occupation_in_balkan_state:0 "Обеспечить оккупацию в [FROM.GetName]"
  BUL_secure_occupation_in_balkan_state_desc:0 "Мы должны взять на себя роль миротворцев на Балканах и предложить нашим союзникам предоставить нам административный контроль над оккупированными ими территориями в регионе, чтобы освободить [ROOT.GetFactionName] от несения гарнизонной службы, для усиления их на других фронтах."
  BUL_secure_occupation_in_balkan_state_tt:0 "(Страны с низким уровнем §Yживой силы§! и §Yпехотного снаряжения§! будут более склонны принять)"
  BUL_bulgarian_reintegration_campaign:1 "Кампания по реинтеграции Болгарии в [FROM.GetName]"
  bulgarian_territorial_expansion_arranged:0 "Предварительно согласованное территориальное расширение Болгарии"
  BUL_bulgarian_territorial_expansion_arranged_tt:0 "Государства с модификатором §YПредварительно согласованное территориальное расширение Болгарии§! будут переданы Болгарии, как только кто-либо из союзников фракции получит контроль над государством, а Болгария присоединится к той же фракции, что и Германия"
  BUL_align_bulgaria:0 "Согласовать с Болгарией"
  BUL_align_bulgaria_desc:0 "Наши дипломатические отношения с Болгарией были дружественными в течение десятилетий, и благодаря нашей финансовой помощи болгарское правительство смогло справиться с бременем долгов. Сейчас самое время побудить их официально стать союзниками [GER.GetNameDef]."
  BUL_germany_donate_fighters:0 "Поставить истребители Болгарии"
  BUL_germany_donate_fighters_desc:0 "Мы поставим небольшое количество самолетов недавно воссозданным болгарским ВВС."
  BUL_germany_demand_military_access:0 "Запросить доступ к болгарской территории для военных целей"
  BUL_germany_demand_military_access_desc:0 "Мы должны потребовать военный доступ через Болгарию, даже если они не присоединятся к нашему наступлению на Балканах, чтобы наши войска могли использовать болгарскую границу в качестве базы для операций, с которой начнется вторжение в Грецию."
  BUL_germany_demand_replacement_of_bulgarian_prime_minister:0 "Замена премьер-министра Болгарии"
  BUL_germany_demand_replacement_of_bulgarian_prime_minister_desc:0 "Болгарский премьер-министр Георгий Кёсеиванов показал себя некомпетентным политиком, мы должны предложить [BUL.GetLeader] заменить его более способным человеком, разделяющим наши взгляды, таким как Богдан Филов."
  BUL_donate_aircraft_tt:0 "Если [BUL.GetNameDef] примет наш дар, то улучшится их отношение к нам и упростится сотрудничество между нашими странами."
  BUL_the_balkan_federation_dream:0 "Мечта о балканской федерации"
  BUL_the_balkan_federation_dream_desc:0 "[ROOT.GetNameDefCap] должен выступить за создание сильной балканской федерации для противостояния многочисленным врагам пролетариата и дать балканским народам понять, что единственный путь к победе в нашей борьбе - развивать сотрудничество и солидарность между нашими народами, что в конечном итоге приведет к объединению Балкан..."
  BUL_develop_balkan_federation_project:0 "Проект Балканской федерации"
  BUL_develop_balkan_federation_project_desc:0 "Нам необходимо собрать вместе экспертов из различных областей, таких как экономика, промышленность, политика и общество, чтобы проанализировать, почему проект балканской федерации провалился в 1920-х годах, и разработать новый, всеобъемлющий и улучшенный проект, в котором все балканские страны будут восприниматься справедливо и равноправно."
  BUL_balkan_federation_propaganda:0 "Пропаганда балканской федерации"
  BUL_balkan_federation_propaganda_desc:0 "Мы организуем большую пропагандистскую кампанию в [FROM.GetNameDef], чтобы заручиться поддержкой народных [FROM.GetAdjective] пролетарских масс для нашего проекта балканской федерации."
  BUL_destabilize_country:0 "Дестабилизировать [FROM.GetNameDef]"
  BUL_destabilize_country_desc:0 "Мы должны внедрить [ROOT.GetAdjective] агентов в [FROM.GetNameDef], чтобы собрать местных активистов, которые поддерживают наш проект федерации, предоставить им базовое обучение и сформировать вооруженные партизанские группы для дестабилизации страны."
  BUL_fight_alongside_country_comrades:0 "Бороться вместе с нашими [FROM.GetAdjective] товарищами"
  BUL_fight_alongside_country_comrades_desc:0 "Мы должны поддержать борьбу наших товарищей в [FROM.GetNameDef] и встать на их сторону в [FROM.GetAdjective] гражданской войне."
  BUL_fight_alongside_country_comrades_join_cw_tt:0 "§Y[ROOT.GetNameWithFlag]§! присоединится к §Y[FROM.GetNameWithFlag]§! в их гражданской войне."
  BUL_balkan_federation_industrial_aid:0 "Промышленная помощь [FROM.GetNameDef]"
  BUL_balkan_federation_industrial_aid_desc:0 "Мы оказываем помощь [FROM.GetAdjective] правительству, чтобы повысить неразвитую национальную промышленность [FROM.GetNameDef] перед вступлением в [ROOT.GetFactionName]."
  BUL_balkan_federation_economic_aid:0 "Экономическая помощь [FROM.GetNameDef]"
  BUL_balkan_federation_economic_aid_desc:0 "Мы оказываем финансовую помощь [FROM.GetAdjective] правительству, чтобы не дать расстроенной экономике [FROM.GetNameDef] рухнуть до вступления в [ROOT.GetFactionName]."
  BUL_balkan_federation_military_aid:0 "Военная помощь [FROM.GetNameDef]"
  BUL_balkan_federation_military_aid_desc:0 "Мы оказываем военную помощь [FROM.GetAdjective] правительству для проведения операции по искоренению нескольких групп мятежников в различных сельских городах вокруг [FROM.Capital.GetName] до вступления в [ROOT.GetFactionName]."
  BUL_balkan_federation_project_ready_flag:0 "Проект \"Балканская федерация\" готов."
  BUL_balkan_federation_demand_turkish_territory:0 "Потребовать территории Турции"
  BUL_balkan_federation_demand_turkish_territory_desc:0 "Мы отправим дипломатическую делегацию для переговоров с [TUR.GetLeader] [TUR.GetAdjective] об уступке его Балканских территорий [BUL.GetNameDef]."

  BUL_plot_against_boris_dec_cat:0 "Заговор против Бориса"
  BUL_plot_against_boris_dec_cat_desc:0 "[GetPlotAgainstBorisFocusLoc]"
  BUL_brainwash_political_prisoners:0 "Промыть мозги политическим заключенным"
  BUL_brainwash_political_prisoners_desc:0 "Один из наших политических заключенных будет принужден и подкуплен к выполнению нашей грязной работы. Таким образом, если наш план регацида провалится, ни один член правительства не будет привязан к попытке покушения."
  BUL_persuade_faction_members:0 "Убедить [GetFactionMembersToPersuade] участников"
  BUL_persuade_faction_members_desc:0 "Мы предложим смехотворно большую сумму денег одному из анти-царистских членов правительства, чтобы они взяли на себя ответственность за поиск подходящего человека для осуществления нашего плана."
  BUL_persuade_zveno_members:0 "[GetZvenoName]"
  BUL_persuade_bs_members:0 "[GetBsName]"
  BUL_persuade_bzns_members:0 "[GetBznsName]"
  BUL_persuade_nsm_members:0 "[GetNsmName]"
  BUL_persuade_generic_members:0 "фракция"
  BUL_draw_up_a_plan_for_regicide:0 "Составить план цареубийства"
  BUL_draw_up_a_plan_for_regicide_desc:0 "Пришло время сделать последние приготовления и решить, когда и где наша операция состоится."
  BUL_seek_foreign_support:0 "Искать иностранную поддержку"
  BUL_seek_foreign_support_desc:0 "Мы должны искать иностранную поддержку, которая поможет нам не только тонко провести покушение на царя, но и придаст доверия официальному докладу, который наше правительство приготовило, чтобы сделать инцидент известным населению."
  BUL_execute_plan:0 "Исполнить план"
  BUL_execute_plan_desc:0 "Нам представилась прекрасная возможность действовать, настало время исполнить наш план! \nПокойся с миром, Борис..."
  BUL_has_repressed_faction_tt:0 "Подавил любую внутреннюю фракцию"
  BUL_has_imprisoned_faction_leaders_tt:0 "Заточил лидеров любой внутренней фракции"
  BUL_has_integrated_faction_tt:0 "Интегрировал любую внутреннюю фракцию"
  BUL_seek_foreign_support_variable_reduction_tt:0 "Сокращает время, необходимое для осуществления убийства царя Бориса."
  BUL_seek_foreign_support_reduced_stability_penalty_tt:0 "Сокращает штраф к стабильности после смерти царя."
  BUL_assassin_persuaded_flag:0 "Промыл мозги политзаключенному или убедил члена интегрированной внутренней фракции"

  BUL_the_fate_of_the_balkans_dec_cat:0 "Судьба Балкан"
  BUL_the_fate_of_the_balkans_dec_cat_desc:0 "Болгария долгое время находилась под влиянием интересов и капризов иностранных держав...\nНо времена изменились, наша страна окрепла, и [ROOT.GetNameDef] теперь может заявить о своем превосходстве на Балканах."
  BUL_fate_of_the_balkans_influence_government:0 "Оказать влияние на правительство [FROM.GetAdjective]"
  BUL_fate_of_the_balkans_influence_government_desc:0 "Мы установим контакт с министрами [FROM.GetAdjective], чтобы повлиять на решения их правительства в соответствии с нашими интересами, побудив их поддерживать внешнюю политику, наиболее удобную для [ROOT.GetNameDef], либо путем подкупа, либо принуждения."
  BUL_fate_of_the_balkans_influence_government_tt:0 "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! в будущем будет более склонен подчиняться Болгарии."
  BUL_fate_of_the_balkans_influence_government_autonomy:0 "Пропагандистская кампания в пользу Болгарии"
  BUL_fate_of_the_balkans_ultimatum:0 "Ультиматум [FROM.GetNameDef]"
  BUL_fate_of_the_balkans_ultimatum_desc:0 "Мы организуем встречу с [FROM.GetAdjective] правительством, чтобы оказать на него давление и убедить присоединиться к [ROOT.GetFactionName] в обмен на [ROOT.GetAdjective] защиту. А также ясно дадим понять, что наше правительство не примет [FROM.GetAdjective] отказ легкомысленно."
  BUL_fate_of_the_balkans_ultimatum_tt:1 "\nФакторы, влияющие на [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! готовность принять ультиматум: [ROOT.GetUltimatumOpinion] [ROOT.GetUltimatumStrength] [ROOT.GetUltimatumIdeology] [ROOT.GetUltimatumFaction] [ROOT.GetUltimatumInfluence] [ROOT.GetUltimatumNeighbor] [ROOT.GetUltimatumMajor]"
  BUL_ultimatum_opinion_high:0 "\n- §GВысокое мнение о§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_opinion_medium:0 "\n- §YMнение о§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_opinion_low:0 "\n- §RNизкое мнение о§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_strength_high:0 "\n- §GВысокая§! [ROOT.GetFlag]§Y[ROOT.GetAdjective]§! §Gвоенная мощь§!"
  BUL_ultimatum_strength_medium:0 "\n- [ROOT.GetFlag]§Y[ROOT.GetAdjective] военная мощь§!"
  BUL_ultimatum_strength_low:0 "\n- §RNизкая§! [ROOT.GetFlag]§Y[ROOT.GetAdjective]§! §Rвоенная мощь§!"
  BUL_ultimatum_ideology_high:0 "\n- §GОдинаковая идеология§!"
  BUL_ultimatum_ideology_medium:0 "\n- §YСовместимая идеология§!"
  BUL_ultimatum_ideology_low:0 "\n- §RИсповедует [FROM.GetRulingIdeology]§!"
  BUL_ultimatum_faction_good:0 ""
  BUL_ultimatum_faction_bad:0 "\n- §RЯвляется участником фракции [FROM.GetFactionName]§!"
  BUL_ultimatum_influence_good:0 "\n- §GНаходится под влиянием§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_influence_bad:0 ""
  BUL_ultimatum_neighbor_good:0 "\n- §GСоседствует§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_neighbor_bad:0 "\n- §RНе соседствует§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
  BUL_ultimatum_is_not_major:0 ""
  BUL_ultimatum_is_major:0 "\n- §RЯвляется крупной державой§!"
  BUL_fate_of_the_balkans_bring_back_state:0 "Вернуть [FROM.GetName]"
  BUL_fate_of_the_balkans_bring_back_state_desc:0 "Мы направим дипломатическую миссию к [FROM.Controller.GetNameDef] с требованием передачи [FROM.GetName] под управление [ROOT.GetNameDef], поскольку эта территория принадлежит ей по праву."
  BUL_fate_of_the_balkans_demand_submission:0 "Поработить [FROM.GetNameDef]"
  BUL_fate_of_the_balkans_demand_submission_desc:0 "Делегация [ROOT.GetAdjective] отправится в столицу [FROM.GetAdjective] с требованием признания [ROOT.GetNameDef] как сюзерена [FROM.GetName]."
  BUL_fate_of_the_balkans_demand_submission_tt:0 "Превосходство над [FROM.GetNameDef] в военной силе увеличивает шансы на подчинение нашей воле."
  BUL_dominance_in_the_seas:0 "Господство на море"
  BUL_dominance_in_the_black_sea_mission:0 "Доминирование в Чёрном море"
  BUL_dominance_in_the_black_sea_mission_desc:0 "Мы должны обеспечить безопасность Чёрного моря, устранив любую возможную угрозу со стороны его берегов и захватив новые территории, для увеличения производства боевых кораблей, чтобы обеспечить доминирование Болгарии на морях."
  BUL_dominance_in_the_aegean_sea_mission:0 "Доминирование в Эгейском море"
  BUL_dominance_in_the_aegean_sea_mission_desc:0 "Мы должны обеспечить безопасность Эгейского моря, устранив любую возможную угрозу со стороны его берегов и захватив новые территории, для увеличения производства боевых кораблей, чтобы обеспечить доминирование Болгарии на морях."
  BUL_dominance_in_the_adriatic_sea_mission:0 "Доминирование в Адриатическом море"
  BUL_dominance_in_the_adriatic_sea_mission_desc:0 "Мы должны обеспечить безопасность Адриатического моря, устранив любую возможную угрозу со стороны его берегов и захватив новые территории, для увеличения производства боевых кораблей, чтобы обеспечить доминирование Болгарии на морях."
  BUL_appoint_tsankov:0 "Назначить Александра Цанкова Премьер-министром"
  BUL_appoint_tsankov_desc:0 "Пришло время для смены курса на более радикальную политику. Александр Цанков и его Народное социальное движение являются лучшими кандидатами для руководства страной."
  BUL_appoint_georgiev:0 "Назначить Кимона Георгиева Премьер-министром"
  BUL_appoint_georgiev_desc:0 "Кимон Георгиев стал одной из важнейших фигур в Отечественном фронте, настало время признать его заслуги и предложить ему пост Премьер-министра [ROOT.GetNameDef]."
  BUL_balkan_confederation_industrial_investment:0 "Индустриальные инвестиции в [FROM.GetNameDef]"
  BUL_balkan_confederation_industrial_investment_desc:0 "Для оказания влияния на [FROM.GetAdjective] правительство мы побудим [BUL.GetAdjective] промышленных магнатов сделать ряд инвестиций, что позволит [BUL.GetAdjective] филиалам развиться в [FROM.GetNameDef], таким образом стимулируя его национальную промышленность и одновременно усиливая наш собственный контроль над ней."
  BUL_balkan_confederation_capital_injection:0 "Инвестирование капитала в [FROM.GetNameDef]"
  BUL_balkan_confederation_capital_injection_desc:0 "Мы окажем финансовую поддержку испытывающим трудности [FROM.GetAdjective] компаниям, чтобы стабилизировать финансовые сектора страны и усилить [BUL.GetAdjective] контроль над экономикой [FROM.GetNameDef]."
  BUL_balkan_confederation_balkan_summit:0 "Организовать балканский саммит"
  BUL_balkan_confederation_balkan_summit_desc:0 "Мы пригласим все свободные нации на Балканах на балканский саммит. Это событие позволит нам незаметно продвигать наши идеи и усилить болгарское влияние в странах региона."
  BUL_balkan_confederation:0 "Балканская конфедерация"
  BUL_balkan_confederation_desc:0 "[GetABalkanConfederationFocusLoc]"
  BUL_balkan_confederation_ai_tt:0 "§Y[FROM.GetNameWithFlag]§! будут с большей охотой соглашаться с нашими дипломатическими предложениями."
  BUL_balkan_confederation_balkan_summit_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y365 дней§!."
  BUL_balkan_confederation_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y365 дней§!.\n"