 DESC_TEXT:0 "-§YНашивка «Военные усилия»§! 1.17.4 был §Yинтегрирован§!. \n-Добавлено §Yрешение§! в категорию §YВоенные меры§! для §Yмажорных§! стран, чтобы §Gувеличить§! §Yмаксимальный лимит дивизий§!, которое становится видимым после 1940 года. \n-§GСнижены§! затраты алюминия на §YУлучшенный палубный корпус§! с §Y4§! до §Y3§!. \n-§GСнижены§! затраты алюминия на §YУлучшенный средний корпус§! с §Y5§! до §Y4§!. \n-§GДобавлено§! +5% к тяжелой атаке для модуля §YКонический ствол§!. \n-§GДобавлен§! §Yнепроходимый§! регион в §YКавказские горы§!. \n-§RДобавлены§! требования для исследования §YСтроительство I§! и §YII§! к некоторым §Yэкономическим фокусам§! в §Yстандартном дереве§!. \n- \n-Обновлены иконки для §Yвсех политик§!, кроме политик §Yпрессы§! и §Yвоенных политик§!. \n-§YСкорректирована§! скорость игры (2x/3x и т.д.). \n-§YСкорректированы§! названия некоторых стран. \n-Внесены корректировки в ИИ. \n-Внесены улучшения в код. \n-Обновлены иконки для всех политик, кроме политик прессы и военных политик. \n-В STT добавлен инструмент передачи ресурсов. \n"
