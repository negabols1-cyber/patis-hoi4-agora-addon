  generic_operation_4:0 "Непредвиденная ситуация 4"
  nsb_coup.2.t:0 "Попытка переворота не удалась"
  nsb_coup.2.desc:0 "После недель планирования, минувшей ночью группа офицеров приказала осуществить операцию [Root.GetOperationName], план по захвату контроля над правительством. \n\nПохоже, им пришлось начать свой план раньше срока, поскольку их действия кажутся поспешными и плохо скоординированными. Видимо, не зная об изменениях в графике караула, группа солдат, лояльных к перевороту, явилась в кабинет [Root.GetLeader] с приказом арестовать или убить - как раз в момент смены караула, столкнувшись, таким образом, с вдвое большим количеством охранников, чем они ожидали. Последовавшая перестрелка была короткой и жестокой, в результате чего несколько солдат с обеих сторон были убиты или ранены, а [Root.GetLeader] удалось сбежать.\n\nС тех пор [Root.GetLeader] появился на публике и на радио, показав, что попытка покушения была неудачной. С провалом переворота ряд офицеров в нашей армии покончили жизнь самоубийством, чтобы избежать ареста, или решили сопротивляться до конца, когда были отправлены подразделения для их ареста, в то время как командиры различных гарнизонов подтвердили свою лояльность [Root.GetLeader]."
  nsb_coup.2.a:0 "И эти люди хотели управлять страной?"
  nsb_coup.3.t:0 "Офицеры готовят переворот"
  nsb_coup.3.desc:0 "После нескольких недель планирования, вчера группа офицеров исполнила приказ [Root.GetOperationName] - захват власти. \n\nКажется, что им пришлось осуществить план раньше времени, и все пошло не так. Попытка арестовать или убить [Root.GetLeader] провалилась, а дорожные заграждения вокруг столицы были выставлены слишком поздно, что позволило многим правительственным чиновникам скрыться.\n\nПравительство [Root.GetNameDef] продолжает сопротивляться, а [Root.GetLeader] пообещал привлечь предателей к правосудию, несмотря ни на что."
  nsb_coup.3.a:0 "Мы подавим это восстание!"
  LAT_events.2.t:0 "[From.GetNameDefCap] требует [Root.GetAdjective] аннексии"
  LAT_events.2.d:0 "Указывая на растущее давление в Прибалтике, [From.GetLeader] объявил, что объединение прибалтийских государств абсолютно необходимо для дальнейшего выживания этих трех государств. Однако требование министра иностранных дел [From.GetNameDef] не только отстранит [Root.GetLeader] от власти, но и фактически сделает всю партию [Root.GetRulingParty] полностью подчиненной [From.GetLeader] и [From.GetLeader.GetHerHis] администрации."
  LAT_events.2.a:0 "А у нас есть выбор?"
  LAT_events.2.b:0 "Разумеется, нет!"
  LAT_events.3.t:0 "[From.GetNameDefCap] поддерживает [Root.GetAdjective] национализм"
  LAT_events.3.d:1 "В пламенной речи, посвященной сущности балтийской солидарности, [From.GetLeader] похвалил [Root.GetLeader] за [Root.GetLeader.GetHerHis] преданность национализму перед лицом растущей большевистской угрозы. Хотя [From.Getleader.GetSheHe] утверждает, что уважает индивидуальную самобытность [From.GetAdjective] и [Root.GetAdjective] идентичностей, [From.Getleader.GetSheHe] призвал к сотрудничеству между [From.GetNonIdeologyName] и [Root.GetNonIdeologyName] в их общей цели сохранить свою независимость. Хотя сейчас это мало что значит, многие предполагают, что на горизонте находится предложение о союзе."
  LAT_events.3.a:0 "Любопытно."
  LAT_events.5.t:0 "[From.GetLeader] добивается объединения Остланда"
  LAT_events.5.d:0 "Теперь, когда Западная Беларусь твердо находится под контролем [Root.GetFactionName], диктатор [From.GetNonIdeologyName] объявил о заинтересованности в создании оккупационной зоны Остланд под администрацией [From.GetAdjective]. Обоснование такого предложения - продвижение фашистской идеологии в странах Балтии и Беларуси, а также продвижение интересов [Root.GetFactionName] на Востоке."
  LAT_events.5.a:0 "Воодушевляет!"
  LAT_events.5.b:0 "Нет."
  LAT_events.501.t:0 "[From.GetNameDefCap] передает Остланд"
  LAT_events.501.d:0 "Передача территорий Остланда в [Root.GetAdjective] руки прошла успешно, и [From.GetNameDef] согласился, что оккупация стран Балтии и Западной Беларуси должна быть единственным владением [Root.GetNameDef]."
  LAT_events.501.a:0 "Превосходно!"
  LAT_events.502.t:0 "[From.GetNameDefCap] отказывается"
  LAT_events.502.d:0 "[Root.GetAdjective] запрос о доминировании над оккупацией Остланда встретил категорический отказ со стороны [From.GetNameDef]. Попытка взять под контроль оккупацию Остланда была расценена как попытка со стороны [Root.GetLeader] взять под контроль основные восточные центры населения и подорвать позиции [From.GetNameDef]."
  LAT_events.502.a:0 "Траурный день для Латвии."
  LAT_events.6.t_both:0 "[From.GetNameDefCap] просит балтийское вступление в [Root.GetFactionName]"
  LAT_events.6.d_both:0 "[From.GetNameDefCap] сегодня обратился с просьбой о присоединении всех балтийских государств к [Root.GetFactionName]. Ссылаясь на ошеломительный успех национализма в [LIT.GetNameDef] и [EST.GetNameDef], а также на врожденное стремление к балтийскому сотрудничеству, [From.GetLeader] сделал страстное предложение [Root.GetAdjective] правительству рассматривать [LIT.GetLeader] и [EST.GetLeader] как союзников в деле национализма."
  LAT_events.6.t_estonia:0 "[From.GetNameDefCap] запрашивает [EST.GetAdjective] вступление в [Root.GetFactionName]"
  LAT_events.6.d_estonia:0 "[From.GetNameDefCap] сегодня потребовал приглашения Эстонии [EST.GetNonIdeologyName] в [Root.GetFactionName]. Приводя в качестве примера ошеломительный успех национализма в Эстонии [EST.GetNameDef] наряду с неизменным желанием сотрудничества с Прибалтикой, [From.GetLeader] сделал страстное предложение правительству [Root.GetAdjective] рассмотреть [EST.GetLeader] как союзника в деле национализма."
  LAT_events.6.t_lithuania:0 "[From.GetNameDefCap] Просит вступление [LIT.GetAdjective] в [Root.GetFactionName]"
  LAT_events.6.d_lithuania:0 "[From.GetNameDefCap] сегодня потребовал приглашения Литвы [LIT.GetNonIdeologyName] в [Root.GetFactionName]. Приводя в качестве примера ошеломительный успех национализма в Литве [LIT.GetNameDef] наряду с неизменным желанием сотрудничества с Прибалтикой, [From.GetLeader] сделал страстное предложение правительству [Root.GetAdjective] рассмотреть [LIT.GetLeader] как союзника в деле национализма."
  LAT_events.6.a:0 "Какая хорошая мысль!"
  LAT_events.6.b:0 "Какой вздор."
  LAT_events.601.t:0 "[From.GetNameDefCap] Отказывается от Прибалтийского вступления в [From.GetFactionName]"
  LAT_events.601.d:0 "Хотя [Root.GetNameDef] приветствовали в [From.GetFactionName] с распростёртыми объятиями, похоже, что [From.GetLeader] не испытывает никакого сострадания в [From.GetLeader.GetHerHis] сердце к праву наших собратьев балтийцев защищать себя. Наше приглашение нашим балтийским собратьям было отклонено, и, по-видимому, наши нации останутся разделёнными на данный момент."
  LAT_events.601.a:0 "Ну что ж."
  LAT_events.7.t:0 "[Root.GetFascistParty] на марше в [Root.Capital.GetName]!"
  LAT_events.7.d:0 "Получив значительную поддержку от фашистского правительства [From.GetNameDef], сторонники [Root.GetFascistParty] собрались на улицах [Root.Capital.GetName] с враждебными намерениями. В конце концов, бунтовщики добрались до здания парламента [Root.Capital.GetName] во время сессии, проводимой [Root.GetLeader] и несколькими ключевыми членами партии [Root.GetRulingParty], скандируя отставку [Root.GetLeader]."
  LAT_events.7.a:0 "Разогнать эту шваль!"
  LAT_events.7.b:0 "Возможно, [Root.GetLeader] стоит уйти в отставку."
  EST_events.1.t:0 "[From.GetNameDefCap] Ищет договоров о дружбе"
  EST_events.1.d:0 "Опасаясь [SOV.GetAdjective] вторжения, [From.GetLeader] направил официальный запрос на заключение договора между [Root.GetNameDef] и [From.GetNameDef]. Договор будет включать гарантии ненападения, а также ряд сердечных соглашений, направленных на укрепление сотрудничества между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName]."
  EST_events.1.a:0 "Хорошее предложение."
  EST_events.1.b:0 "У нас другие планы на [From.GetNameDef]."
  EST_events.101.t:0 "[From.GetNameDefCap] согласен"
  EST_events.101.d:0 "[From.GetLeader] ясно видит ценность в возможном будущем союзе между [Root.GetNameDef] и [From.GetNameDef] и согласился развивать дружеские отношения с нашей нацией."
  EST_events.101.a:0 "Отлично."
  EST_events.102.t:0 "[From.GetNameDefCap] отказывается"
  EST_events.102.d:0 "Несмотря на все усилия [Root.GetLeader], похоже, [From.GetNameDef] остается врагом [Root.GetNonIdeologyName]. Хотя их отказ мало что значит, это может означать, что в случае [SOV.GetAdjective] вторжения [From.GetNameDef] будет немного делать, кроме как наблюдать."
  EST_events.102.a:0 "Черт."
  EST_events.2.t:0 "[From.GetNameDefCap] стремится к объединению"
  EST_events.2.d:0 "[From.GetLeader] сегодня сделал предложение об объединении [From.GetNameDef] и [Root.GetNameDef]. Неоспоримо, что [From.GetAdjective] правительство и [Root.GetNameDef] неразрывно связаны. Без вапсов было бы почти невозможно [Root.GetFascistParty] взять под контроль [Root.GetNonIdeologyName], и даже сейчас симпатии к вапсам остаются сильными в наших войсках. [From.GetLeader] утверждает, что союз Финляндии и Эстонии лучше подготовит наши страны к защите от грядущего [SOV.GetAdjective] вторжения."
  EST_events.2.a:0 "У нас нет выбора."
  EST_events.2.b:0 "Немедленно изгнать вапсов!"
  EST_events.201.t:0 "[From.GetNameDefCap] принимает унификацию"
  EST_events.201.d:0 "[From.GetLeader] принял мудрое решение о разрешении объединения наших двух наций. [From.GetLeader] покинул пост главы [From.GetAdjective] правительства в пользу [Root.GetLeader] и занял роль заместителя в недавно объединенном [Root.GetAdjective]-[From.GetAdjective] правительстве."
  EST_events.201.a:0 "Замечательно!"
  EST_events.202.t:0 "[From.GetNameDefCap] отвергает унификацию с [Root.GetAdjective]"
  EST_events.202.d:0 "Несмотря на подавляющее влияние правительства Вапсидов [Root.GetNonIdeologyName] на [From.GetNameDef], [From.GetLeader] отклонил усилия [Root.GetAdjective] по объединению."
  EST_events.202.a:0 "Скоро это изменится!"
  EST_events.4.t:0 "[From.GetNameDefCap] стремится к объединению Прибалтики"
  EST_events.4.d:0 "Прибалтийские государства часто разделяют историю подавления под властью иностранных держав, поляков, немцев, русских, но [From.GetLeader] объявляет, что этому конец! Хотя добродетели национализма и самоопределения пылают в сердцах всех народов Балтии, [From.GetLeader] убедительно заявляет, что нашей истории иностранного правления можно однозначно приписать наш недостаток единства, и как бы многие ни жаждали независимости, растущая угроза [SOV.GetAdjective] вторжение требует принятия нашими правительствами формы паннационализма.\n\n[From.GetLeader.GetSheHeCap] предлагает [BAL_UNIFIED_fascism] для обеспечения безопасности и силы нашего народа против иностранцев, которые осмелились бы попытаться поработить нас."
  EST_events.4.a:0 "Возможно, мы больше похожи, чем различны."
  EST_events.4.b:0 "Панбалтийская идентичность? Нет такого!"
  EST_events.401.t:0 "[From.GetNameDefCap] Принимает!"
  EST_events.401.d:0 "[From.GetLeader] был успешно привлечен [Root.GetAdjective] усилиями привить панбалтийскую национальную идентичность и согласился объединить партию [From.GetFascistParty] с партией [Root.GetFascistParty]. Твердая победа в цели [Root.GetLeader] по объединению стран Балтии, [Root.GetNameDef] наверняка будет в гораздо лучшем положении для защиты от [SOV.GetAdjective] вторжения."
  EST_events.401.a:0 "[From.GetNonIdeologyName] - это только начало."
  EST_events.402.t:0 "[From.GetNameDefCap] Отказывается от объединения"
  EST_events.402.d:0 "Оставаясь равнодушными к риторике [Root.GetLeader] о балтийской солидарности, [From.GetNameDef] отказались объединяться с [Root.GetNameDef], полагая, что наше объединение - не более чем акт империализма, направленный на ущемление прав [From.GetAdjective] народа на [From.GetNonIdeologyName] для [From.GetNonIdeologyAdjective]."
  EST_events.402.a:0 "Они что, предпочтут присоединиться к [SOV.GetAdjective]? Предатели!"
  EST_events.5.t:0 "[From.GetNameDefCap] посягает на [Root.GetAdjective] независимость"
  EST_events.5.d:0 "[From.GetLeader] сегодня объявил о прямом нападении на [Root.GetAdjective] правительство, назвав его слабым и неэффективным в защите своего народа от иностранных империалистов. Хотя сейчас это не имеет большого значения, мы можем предвидеть, что [From.GetAdjective] вторжение уже не за горами."
  EST_events.5.a:0 "[From.GetLeader] - всего лишь пустослов."
  EST_events.6.t:0 "[From.GetNameDefCap] запрашивает [FIN.GetAdjective] вступление в [Root.GetFactionName]"
  EST_events.6.d:0 "[From.GetNameDefCap] сегодня попросили направить приглашение в [Root.GetFactionName] для [FIN.GetNonIdeologyName]. Ссылаясь на подавляющий успех национализма в своей нации и врожденное стремление к финско-эстонскому сотрудничеству, [From.GetLeader] внесли страстное предложение о том, чтобы [Root.GetAdjective] правительство считало [FIN.GetLeader] союзником в деле национализма."
  EST_events.6.a:0 "Какая хорошая идея!"
  EST_events.6.b:0 "Какой вздор."
  EST_events.601.t:0 "[From.GetNameDefCap] отказывает [FIN.GetAdjective] в вступлении в [From.GetFactionName]"
  EST_events.601.d:0 "Хотя [Root.GetNameDef] были приняты в [From.GetFactionName] с распростертыми объятиями, похоже, что у [From.GetLeader] в [From.GetLeader.GetHerHis] сердце нет сострадания к праву [FIN.GetNameDef] на самооборону. Наше приглашение финнам было отклонено, и, похоже, наши нации останутся раздельными на данный момент."
  EST_events.601.a:0 "[From.GetLeader] сошел с ума или просто некомпетентен?"
  EST_events.7.t:0 "Вапсидская гражданская война"
  EST_events.7.d:0 "Постоянные марши и демонстрации по всему городу в конце концов разрушили то немногое единство, которое продолжало существовать в [Root.GetNonIdeologyName], и нация раскололась на полномасштабную гражданскую войну. То, что должно было стать тривиальной правительственной зачисткой групп [Root.GetFascistParty], вчера переросло в жестокое столкновение с протестующими, когда ветераны столкнулись с членами [Root.GetAdjective] армии, за которую они когда-то сражались. С членами [Root.GetFascistParty] с одной стороны и лоялистами правительства с другой, остается только догадываться, кто займет место в [Root.Capital.GetName] в конце дня; [Root.GetLeader] или [neutral_EST_civil_war.GetLeader]..."
  EST_events.7.a:0 "За [Root.GetNonIdeologyName]!"
  EST_events.9.b:0 "Возможно, лучше всего нам просто сдаться..."
  EST_events.701.t:0 "[Root.GetLeader] отступает"
  EST_events.701.d:0 "Марши демонстрантов Вапсида по всей стране сегодня достигли кульминации: столкновения между представителями правительства [Root.GetLeader] и Вапси переросли в жестокие. Под звуки голоса Артура Сирка протестующие разрушили ворота Рийгикогу, где они быстро установили самодельные баррикады, не давая сотрудникам правоохранительных органов войти в здание\nМногие эстонцы ожидали, что [Root.GetLeader] ответит протестующим силой, но к удивлению нации, здание Рийгикогу сегодня получило письмо об отставке [Root.GetLeader], в котором он отказался от должности диктатора в пользу Артура Сирка."
  EST_events.701.a:0 "Эстония стоит тверже."
  EST_events.801.t:0 "Хаотический марш в [?ROOT.vaps_from.GetName]"
  EST_events.801.d:0 "Демонстрация [Root.GetFascistParty] в [?ROOT.vaps_from.GetName] вызвала неоднозначную реакцию со стороны общественности и жестокий отпор со стороны местных властей. Мало кто в толпе мог даже сказать, в чем был смысл марша, а в центре внимания демонстрации оказалось насилие между протестующими и контрпротестующими. [Root.GetAdjective] правительство уже работает над подавлением [Root.GetFascistParty], и сегодняшние события, вероятно, ускорили этот процесс, но мало что сделали для того, чтобы расположить к себе толпу."
  EST_events.801.a:0 "Это катастрофа."
  EST_events.801.b: "Мы должны немедленно подавить этих мятежников!"
  FIN_putting_down_insurgents_tt: "Государство не станет лояльным к §YVпартизанам Вапси!"
  EST_events.802.t:0 "Шествие в [?ROOT.vaps_from.GetName]"
  EST_events.802.d:0 "Шествие [Root.GetFascistParty] по [?ROOT.vaps_from.GetName] прошло относительно спокойно. Избегая крупных населенных пунктов, а вместо этого сосредотачиваясь на более сельских районах [?ROOT.vaps_from.GetName], [Root.GetFascistParty] смогли показать людям [Root.GetName], за что выступает движение, и при этом избежали возмездия со стороны [Root.GetAdjective] чиновников."
  EST_events.802.a:0 "Интересно."
  EST_events.803.t:0 "Массовое шествие фашистов в [?ROOT.vaps_from.GetName]"
  EST_events.803.d:0 "По всему штату [?ROOT.vaps_from.GetName] демонстранты [Root.GetFascistParty] вышли толпами, чтобы продемонстрировать свою поддержку сильному националистическому государству. Хотя чиновники попытались помешать демонстрантам двинуться в крупные населенные пункты, эти офицеры сложили оружие и позволили людям [Root.GetFascistParty] мирно пройти по улицам. Без каких-либо серьезных контрдемонстрантов это была убедительная победа для движения [Root.GetFascistParty]."
  EST_events.803.a:0 "Очень интересно."
  EST_events.901.t:1 "[?FIN.EST_previous_finnish_leader.GetName] уходит в отставку"
  EST_events.901.d:0 "Удивительно, но когда сегодня силы [FROM.GetFascistParty] предприняли наступление на [From.GetAdjective] столицу, прежнее [From.GetAdjective] правительство объявило, что не станет развязывать гражданскую войну, а сложит с себя полномочия и передаст их партии [FROM.GetFascistParty]."
  EST_events.901.a:0 "Вот это неожиданность!"
  EST_events.10.t:0 "Вопрос об интервенции"
  EST_events.10.d:0 "В [FIN.GetNonIdeologyName] началась гражданская война, но вопрос о том, какую роль [Root.GetNameDef] будет играть в этом конфликте, по-прежнему остаётся открытым. Пока что сотрудничество вапсов с [FIN.GetNonIdeologyAdjective] фашистами ограничивается помощью с вооружением и организацией в захвате власти, однако возможно [Root.GetLeader] расценит это как возможность вернуть долг [EST.GetNonIdeologyName] перед финами, как в былые времена вапсы боролись за независимость [EST.GetAdjective]."
  EST_events.10.a:0 "Ветераны вновь сражаются бок о бок!"
  EST_events.10.b:0 "Достаточно будет солидного добровольческого корпуса."
  EST_events.11.t:0 "Вапсы и [Root.GetFascistPartyName]"
  EST_events.11.d:0 "Теперь, укрепив своё влияние в Эстонии, вапсы согласились подписать договор о сотрудничестве с [Root.GetFascistPartyName]. Вапсы уже поддерживают фашистские группировки в Финляндии, распространяя их пропаганду и организовывая демонстрации, но решительные действия правительства по запрету этих фашистских элементов могут раз и навсегда решить эту проблему."
  EST_events.11.a:0 "Никаких выскочек."
  NSB_poland_communist_events.1.a:0 "[POL.GetNameDefCap] стоит в одиночестве."
  NSB_poland_communist_events.1.b:0 "Польша принадлежит СССР."
  NSB_poland_communist_events.1.desc:0 "В коммунистической партии Польши происходит давний конфликт между теми, кто хочет видеть Польшу союзной с СССР, и теми, кто считает, что СССР столь же империалистичен, как и предшествовавший ему монархический режим.\nПротивостоит советам Мария Козутская, предполагаемая [Root.GetStalinistOrTrotskyite], которая обвиняет своих просоветских товарищей в том, что они "бесхребетные" и враги революции.\nВ качестве фактического лидера Владислав Гомулка представляет просоветское крыло партии. Хотя Гомулка и так пользуется популярностью в партии, он становится все менее популярным среди польского населения из-за своей пророссийской дипломатической позиции.\nНесмотря на то, что партия сейчас контролирует Польшу, она разделена в вопросе о том, кто из этих кандидатов должен представлять ее руководство. В связи с их нерешительностью со стороны Москвы растет давление не только с тем, чтобы запретить Козутской занять пост лидера, но и чтобы она предстала перед судом как [Root.GetStalinistOrTrotskyite] и антиреволюционерка.
  NSB_poland_communist_events.1.nosov.desc:0 "В компартии Польши давно ведется конфликт между теми, кто хочет видеть Польшу в союзе с СССР, и теми, кто считает, что СССР — такой же империалистический режим, как и предшествовавшая ему монархия.\nОднако после развала СССР этот вопрос стал спорным. После падения Сталина просоветский лидер Владислав Гомулка также потерял актуальность, и никто не протестовал против назначения антисоветской Марии Козуцкой лидером партии."
  NSB_poland_communist_events.1.t:0 "Борьба внутри КПП"
  NSB_poland_events.1.a:0 "У нас нет выбора."
  NSB_poland_events.1.b:0 "Мы не будем пресмыкаться перед Польшей!"
  NSB_poland_events.1.desc:0 "Ссылаясь на явное отсутствие обороноспособности у [Root.GetNameDef], чиновники из [From.GetNameDef] потребовали, чтобы весь регион Словакии перешел под непосредственную оккупацию Польши. Они недвусмысленно заявили, что если мы не подчинимся, вторжение неизбежно. Как нам ответить?"
  NSB_poland_events.1.t:0 "[From.GetNameDefCap] требует Словакию"
  NSB_poland_events.101.a:0 "Не могу поверить, что это сработало!"
  NSB_poland_events.101.desc:0 "[From.GetNameDefCap] принял наши недавние требования уступить весь Словацкий регион. Уже [Root.GetAdjective] войска наводняют регион, чтобы подавить любое локальное сопротивление до его возникновения. Хотя эта победа невелика, она означает, что мир, по крайней мере, несколько опасается [Root.GetAdjective] военной машины!"
  NSB_poland_events.101.t:0 "[From.GetNameDefCap] Согласен!"
  NSB_poland_events.102.a:0 "Что ж, будет война!"
  NSB_poland_events.102.desc:0 "Удивительно, но [From.GetAdjective] правительство отклонило наше требование уступить Словацкий регион. Наши попытки найти дипломатическое решение провалились, и теперь это стало вопросом для военных."
  NSB_poland_events.102.t:0 "[From.GetNameDefCap] Отказался!"
  NSB_poland_events.2.a:0 "Полагаю, мы должны согласиться."
  NSB_poland_events.2.b:0 "Это “претензия” ничего не значит."
  NSB_poland_events.2.d:1 "Кажется, что длительное регентство в [Root.GetNameDef] воодушевило [From.GetLeader] объявить себя королем Венгрии. Это требование основано лишь на средневековом королевстве Польша-Венгрия и является явной попыткой территориальной экспансии."
  NSB_poland_events.2.t:0 "[From.GetLeader] Претендует на [Root.GetAdjective] Трон!"
  NSB_poland_events.201.a:0 "Отлично."
  NSB_poland_events.201.desc:1 "Сегодня, кажется, любым претендентам на венгерский престол пришлось отказать, так как [Root.GetLeader] был назван королем Венгрии. Теперь, когда [Root.GetLeader] является королем как Польши, так и Венгрии, [Root.GetAdjective] амбиции на Балканскую гегемонию становятся все более реализуемыми."
  NSB_poland_events.201.t:0 "Венгрия уступает"
  NSB_poland_events.202.a:0 "Они не оставляют нам выбора."
  NSB_poland_events.202.desc:0 "Лидеры [From.GetAdjective] правительства объявили, что они не признают претензий [Root.GetLeader] на [From.GetAdjective] престол. Хотя это исключает возможность любой мирной аннексии [From.GetNameDef], это означает, что претензии все еще могут быть продвигаться посредством войны."
  NSB_poland_events.202.t:0 "[From.GetNameDefCap] отрицает претензии [Root.GetLeader]"
  NSB_poland_events.3.a:0 "Мы согласны!"
  NSB_poland_events.3.b:0 "[From.GetNonIdeologyName] все еще наш враг."
  NSB_poland_events.3.c:0 "Передайте Данциг, и они согласны!"
  NSB_poland_events.3.desc:0 "Представители [From.GetNameDef] заявили о намерении заключить альянс с новой Германской империей. Веря, что кайзер [Root.GetLeader] будет благосклоннее к [From.GetAdjective] независимости, чем [Root.GetHerHis] предшественник, и ссылаясь на то, что современное воплощение [From.GetNameDef] может быть напрямую связано с Актом от 5 ноября, подписанным Центральными державами, [From.GetNameDef] предлагает двум государствам подписать формальный союз. \nЕго принятие ознаменует монументальное изменение в истории отношений [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] и может знаменовать светлое будущее для обеих стран."
  NSB_poland_events.3.t:0 "[From.GetNameDefCap] предлагает союз"
  NSB_poland_events.301.a:0 "Великий день для Польши!"
  NSB_poland_events.301.desc:0 "Как ни удивительно, [From.GetNameDef] согласился подписать формальный союз с [Root.GetNameDef]! Хотя некогда бывшие заклятыми врагами, похоже, что дни конфликта между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] наконец-то закончились, и теперь обе страны могут двигаться вперед в качестве союзников против надвигающейся волны экстремистской идеологии. \nНачавшееся с Акта от 5 ноября, в котором немцы согласились освободить их [Root.GetAdjective] территорию как независимое королевство, в настоящее время превратилось в исторический союз, который отныне будет известен как "Ноябрьский союз"."
  NSB_poland_events.301.t:0 "Кайзер согласен!"
  NSB_poland_events.302.a:0 "Как разочаровывающе."
  NSB_poland_events.302.desc:0 "Несмотря на наши дипломатические усилия и кажущиеся согласованными интересы нашей нации, кайзер отказался подписывать какой-либо официальный союз. Похоже, что независимо от того, находится ли Германия в руках монарха или фашиста, она по-прежнему считает нашу нацию своим естественным врагом."
  NSB_poland_events.302.t:0 "Беллигерантный кайзер"
  NSB_poland_events.303.a:0 "Обмен этого беспокойного города на армию кажется выгодным."
  NSB_poland_events.303.desc:0 "[From.GetNameDefCap] вернулся к нам с условным предложением, которое, по его утверждению, принесет взаимную выгоду обеим сторонам. Они утверждают, что акт от 5 ноября официально не предусматривал передачи спорных регионов Гданьска и Гдыни в состав вновь образованного [Root.GetAdjective] королевства. Они утверждают, что согласятся подписать союз, но только в том случае, если то, что они считают нарушением условий, с которыми согласилась Германия, будет исправлено."
  NSB_poland_events.303.t:0 "Данциг за гарантии"
  NSB_poland_events.304.a:0 "Мы возьмем его силой."
  NSB_poland_events.304.desc:0 "К сожалению, кажется, с поляками нельзя прийти к соглашению, и они отклонили наше предложение передать Данциг в обмен на союз. Напряженность уже нарастает на [From.GetAdjective] границе, и некоторые опасаются, что на горизонте маячит война."
  NSB_poland_events.304.t:0 "[From.GetNameDefCap] отказывается"
  NSB_poland_events.4.a:0 "Они получат его!"
  NSB_poland_events.4.b:0 "[POL_colony_purchase.GetName] - неотъемлемая часть [Root.GetAdjective] империи!"
  NSB_poland_events.4.desc:0 "Польская морская и колониальная лига сегодня обратилась к [Root.GetAdjective] послу в [From.Capital.GetName] с предложением о покупке заморской территории [POL_colony_purchase.GetName]. Обмен [POL_colony_purchase.GetName] с поляками, безусловно, обеспечит значительный бюджетный излишек для [Root.GetNameDef], но, однако, сделает [From.GetNameDef] сувереном над всем [POL_colony_purchase.GetName] и его ценными природными ресурсами и гражданским населением."
  NSB_poland_events.4.t:0 "Польша просит приобрести [POL_colony_purchase.GetName]"
  NSB_poland_events.401.a:0 "Добро пожаловать, народ [POL_colony_purchase.GetName]"
  NSB_poland_events.401.desc:0 "[From.GetNameDefCap] вернулись к нам сегодня и согласились продать заморскую территорию [POL_colony_purchase.GetName]. Осталось только погасить наши долги перед [From.GetNameDef], и колония станет неотъемлемой частью растущей [Root.GetAdjective] колониальной империи."
  NSB_poland_events.401.desc.com:0 "[From.GetNameDefCap] вернулись к нам сегодня и согласились продать заморскую территорию [POL_colony_purchase.GetName]. Осталось только погасить наши долги перед [From.GetNameDef], но уже народ [POL_colony_purchase.GetName] был освобождён от оков [From.GetAdjective] колониализма."
  NSB_poland_events.401.desc.dem:0 "[From.GetNameDefCap] вернулись к нам сегодня и согласились продать заморскую территорию [POL_colony_purchase.GetName]. Хотя мы теперь в долгах перед [From.GetNameDef], эта продажа не могла быть более своевременной для [Root.GetNameDef]. С [POL_colony_purchase.GetName], находящимся под нашим непосредственным контролем, нам дано еще одно укрепление, в котором наше правительство может продолжить свое существование в изгнании."
  NSB_poland_events.401.t:0 "Удачная продажа [POL_colony_purchase.GetName]"
  NSB_poland_events.402.a:0 "Стоило попробовать."
  NSB_poland_events.402.desc:0 "К сожалению, [From.GetAdjective] правительство совершенно не заинтересовано в том, чтобы уступить [POL_colony_purchase.GetName] в настоящее время. Хотя это не прекращает [Root.GetAdjective] зарубежных амбиций, эта неудача делает любую возможность мирной передачи [POL_colony_purchase.GetName] совершенно невозможной."
  NSB_poland_events.402.t:0 "[From.GetNameDefCap] отказывается продать [POL_colony_purchase.GetName]"
  NSB_poland_events.6.a:0 "Мудрое предложение."
  NSB_poland_events.6.b:0 "Нет."
  NSB_poland_events.6.desc:0 "Осенью 1932 г. Лига Наций признала Польшу единственным защитником Либерии, но на практике данное решение не было реализовано из-за вмешательства со стороны Соединенных Штатов. Несмотря на это, в нашей стране процветают поселения и предприятия, управляемые Польской морской и колониальной лигой.\nЭто соглашение оказалось выгодным для обеих стран, но теперь, похоже, [From.GetNameDef] становится более напористым, а [From.GetLeader] официально запросил, чтобы [Root.GetNameDef] стал [From.GetAdjective] протекторатом.\nЕсли мы согласимся, то станем [From.GetAdjective] подданными со всеми возможными выгодами и недостатками, которые это может повлечь. Если же мы откажемся, то, похоже, [From.GetLeader] может попытаться достичь [From.GetLeader.GetHerHis] цели силой."
  NSB_poland_events.6.t:0 "[From.GetNameDefCap] предлагает статус протектората"
  NSB_poland_events.601.a:0 "Тогда мы возьмем это силой."
  NSB_poland_events.601.b:0 "Давайте не будем заходить так далеко."
  NSB_poland_events.601.desc:1 "Несмотря на то, что в 1932 году мы согласились на статус протектората, похоже, что [From.GetAdjective] правительство больше не заинтересовано в сохранении [Root.GetAdjective] интересов в стране."
  NSB_poland_events.601.t:0 "[From.GetNameDefCap] отказывается"
  NSB_poland_events.7.a:0 "Замечательное предложение!"
  NSB_poland_events.7.b:0 "Похоже на западню."
  NSB_poland_events.7.desc:0 "После восстановления демократии в Польше новое польское правительство стремится укрепить франко-польские отношения и создать союз по обе стороны немецкой границы. Хотя Польша еще ослаблена недавним гражданским конфликтом, несомненно, что [GER.GetNameDef] будет бороться в войне, которая ведется по обе стороны от его границы."
  NSB_poland_events.7.t:0 "Польша предлагает пакт Моржа"
  NSB_poland_events.701.a:0 "Возможно, британцы примут нас."
  NSB_poland_events.701.desc:0 "Правительство [From.GetNameDef] отказалось подписывать с нами официальный союз на данный момент. Это горькое дипломатическое поражение делает план Фронта Моржа по франко-польскому союзу простой фантазией, и вместо этого нам следует искать поддержки у других."
  NSB_poland_events.8.t:0 "Судьба Анастасии Романовой"
  NSB_poland_events.8.d:0 "После захвата Москвы [From.GetNameDefCap] и их союзниками наши оперативники нашли записи из архивов НКВД, раскрывающие ужасную судьбу семьи Романовых. В докладе говорится, что вся императорская семья, включая Анастасию, была расстреляна большевиками в июле 1918 года. Если мы не будем действовать быстро, мир скоро узнает, что наша королева не та, за кого она себя выдает."
  NSB_poland_events.8.a:0 "Спрячем доказательства, мир никогда не узнает"
  NSB_poland_events.8.b:0 "Кто-то другой должен носить польскую корону!"
  NSB_poland_monarchist_events.1.t:0 "[From.GetNameDefCap] претендует на наш трон"
  NSB_poland_monarchist_events.2.a:0 "Ну, вот и все."
  NSB_poland_monarchist_events.2.desc:0 "К сожалению, мы больше не можем оспаривать наши претензии на трон [From.GetNonIdeologyName]. Действующее правительство [From.GetAdjective] окончательно выиграло пропагандистскую войну до такой степени, что любые разговоры о претензиях [Root.GetLeader] встречаются со смехом и насмешками."
  NSB_poland_monarchist_events.2.t:0 "Отказ от претензий [Root.GetNameDefCap]"
  NSB_poland_monarchist_events.3.a:0 "Проклятие!"
  NSB_poland_monarchist_events.3.desc:1 "Сегодня [From.GetLeader] был коронован новым королем [Root.GetNonIdeologyName]. Длительная серия пропагандистских кампаний настроила многих [Root.GetAdjective] министров против старого режима и привела к бескровному перевороту. Этот переворот превратил [Root.GetNonIdeologyName] в нечто большее, чем марионетка [From.GetNameDef], и будущее [Root.GetAdjective] автономии выглядит мрачным."
  NSB_poland_monarchist_events.3.t:0 "Переворот [From.GetLeader]!"
  NSB_poland_monarchist_events.4.a:0 "Предатели!"
  NSB_poland_monarchist_events.4.desc:0 "Улицы [Root.GetNonIdeologyName] сегодня полыхают, так как про- и антимонархистские ополчения ввергли страну в гражданскую войну! Сторонники [Root.GetLeader] и [From.GetLeader] вступают в стычки по всей стране, а министры из [From.GetNameDef] отказываются признавать свою причастность к этой попытке импичмента нашего национального суверенитета. Теперь остается только ждать и смотреть, какая сторона конфликта одержит победу."
  NSB_poland_monarchist_events.4.t:0 "Гражданская война монархистов"
  NSB_poland_monarchist_events.5.t:0 "[From.GetLeader] требуют отречения"
  NSB_poland_monarchist_events.5.desc:0 "После длительной кампании королевской пропаганды, инициированной [From.GetLeader] и правительством [From.GetLeader.GetHerHis], напряженность между сторонниками [Root.GetLeader] и теми, кто стремится увидеть объединение [Root.GetNonIdeologyName]–[From.GetNonIdeologyName], достигла такой точки, когда мирное сосуществование уже невозможно. Сторонники монархии недвусмысленно потребовали, чтобы [Root.GetLeader] отрекся и признал [From.GetLeader] единственным истинным королем [Root.GetNonIdeologyName].\n\nСогласие сделало бы [Root.GetNonIdeologyName] чем-то большим, нежели просто подчиненное [From.GetAdjective] государство, но отказ, почти наверняка, приведет к гражданской войне."
  NSB_poland_monarchist_events.5.a:0 "Мы сдаемся!"
  NSB_poland_monarchist_events.5.b:0 "Лучше война, чем [From.GetAdjective] марионетки."
  NSB_poland_royal_election.1.a:0 "Он наш король!"
  NSB_poland_royal_election.1.b:0 "Нет, у нас на примете другой..."
  NSB_poland_royal_election.1.desc:0 "Маркграф Мейсенский и принц Саксонский, Альберт Леопольд Фридрих Кристиан Зильвестр Анно Макариус стремится добавить к своим многим престижным титулам титул короля Польши. Многие великие монархи Речи Посполитой были членами Дома Веттинов и саксонских курфюрстов, и теперь, когда наша нация ищет короля, Фридрих Кристиан кажется наиболее очевидным и законным кандидатом на престол.\nИзбирая Фридриха с его претензиями на Речь Посполитую, мы, несомненно, укрепим права нашего правительства на все бывшие территории Речи Посполитой. Претендент на Литву, член исторической польской королевской семьи и знатной родословной, Фридрих Кристиан выдвигает веские аргументы в пользу претензий на Королевство Польское.
  NSB_poland_royal_election.1.t:0 "Фридрих Кристиан претендует на трон"
  NSB_poland_royal_election.2.a:0 "Объединение наших тронов? Превосходная идея!"
  NSB_poland_royal_election.2.b:0 "Мы не можем рисковать отношениями с Румынией."
  NSB_poland_royal_election.2.desc:0 "Претензии Гогенцоллернов на Польшу датируются ещё существованием нынешнего польского государства. Сейчас, когда польско-румынские отношения становятся жизненно важными для выживания обоих государств, имеет смысл предложить наш трон бывшему королю и наследнику Румынии Михаю I. Свергнутый в 1930 году в пользу своего отца, король Михай представляет возможность потенциального союза польского и румынского тронов. С учётом влияния фашистской Железной гвардии в Румынии, мы можем использовать антифашистские настроения как средство снова свергнуть короля Кароля и заменить его Михаем на посту короля. Такой подвиг создаст неразрывный союз между нашими нациями, и наша объединённая воля будет мощной силой, с которой нашим врагам из [SOV.GetNameDef] и [GER.GetNameDef] придётся считаться."
  NSB_poland_royal_election.2.t:0 "Кронпринц Румынии Михай"
  NSB_poland_royal_election.3.a:0 "Безумная идея, но времена сумасшедшие. У нас есть свой король!"
  NSB_poland_royal_election.3.b:0 "Павел, что теперь?"
  NSB_poland_royal_election.3.desc:0 "Сегодня перед советом регентства предстал необычный кандидат. Князь Грузии, казак и бывший генерал белой русской армии, Павел Бермондт-Авалов заявил совету о своих правах не только на корону Польши, но и на Речь Посполитую.\nМного лет назад казак по неизвестным причинам попытался вторгнуться в Балтию, и с тех пор, похоже, амбиции князя возросли.\nНесмотря на непопулярность среди большинства поляков, этот маловероятный претендент на корону привел бы за собой армию белых эмигрантов, что вызовет раздражение [SOV.GetNameDef], но укрепит наши ряды и потенциально приведет нас к союзу с фашистскими силами Европы."
  NSB_poland_royal_election.3.t:0 "Царь-казак"
  NSB_poland_royal_election.4.a:1 "Наш царь будет последним Романовым. Вероятно."
  NSB_poland_royal_election.4.desc:1 "Варшавский замок, расписанные орлы, да, я помню. Я единственный истинный король Польши". Некая самозванка по имени Анастасия Романова прибыла в Варшавский замок сегодня вместе со своим публицистом, заявив, что семья Романовых по-прежнему претендует на польский трон и как последняя из Романовых она законно является королевой. Претензии Анастасии основаны не только на претензиях Романовых к Польше, но и на законности ее происхождения. \nНесмотря на то, что многие бывшие русские дворяне подтверждают, что она действительно является настоящей Анастасией, многие видят в ней чудачку, которой чрезмерно много освещают в СМИ. \nХотя ее претензии могут быть сомнительны, она последняя в списке кандидатов, и, отвергнув ее сейчас, Польша вернется туда, где начинала: к пустующему трону, покрытому пылью.
  NSB_poland_royal_election.4.t:0 "Анастасия Романова прибывает в Польшу"
  NSB_poland_royal_election.5.t:0 "Кандидат от Габсбургов"
  NSB_poland_royal_election.5.desc:0 "Член королевской семьи, Габсбург и польский патриот Карл Альбрехт фон Габсбург служил польской армии с тех пор, как только такая организация появилась. Хотя его родословная не происходит с этих земель, его готовность сражаться и умереть за Польшу делает его идеальным кандидатом на трон. \nХоть, казалось бы, у эрцгерцога нет никаких амбиций относительно управления, возможно, его можно будет убедить служить Польше не оружием, а руководством.
  NSB_poland_royal_election.5.a:0 "Рождается Габсбургская Польша!"
  NSB_poland_royal_election.5.b:0 "Мы хотим еще одного..."
  pavel_events.1.a:0 "Донские казаки должны быть независимыми."
  pavel_events.1.b:0 "Они будут подчиняться напрямую нам."
  pavel_events.1.desc:0 "Теперь, когда вся Донская область находится под контролем сил [Root.GetLeader] и [Root.GetLeader.GetHerHis], мы находимся в положении, позволяющем восстановить Донскую Республику и пригласить ее лидеров снова возглавить Донских казаков в борьбе с красными!\nЕдинственный вопрос, который остается, — можно ли доверять хозяину, что он останется лояльным, как независимое государство, или же он должен стать прямым марионеточным правительством [Root.GetLeader]."
  pavel_events.1.t:0 "Восстановление Донской республики"
  pavel_events.2.a:0 "Очень хорошо."
  pavel_events.2.b:0 "Им нельзя доверять, они будут нашими подданными."
  pavel_events.2.desc:0 "Когда-то Кубанская Народная Республика, переметнувшаяся к белым, а затем к красным, [Root.GetLeader] решила восстановить Кубанскую Республику с новым руководством, ориентированным на белых.\nХотя в прошлом кубанский народ предал белых, новое руководство уверяет нас, что сделает все возможное, чтобы подавить всякую поддержку старого правительства."
  pavel_events.2.t:0 "Восстановление Кубанской Республики"
  NSB_poland_democratic_events.1.t:0 "Вопрос лидерства"
  NSB_poland_democratic_events.1.desc:0 "После того, как Санация была вытеснена из правительства, встал вопрос о том, кто станет лидером новой Польской крестьянской партии. Сейчас эту роль исполняет Станислав Миколайчик - самый ярый и открытый сторонник крестьянства, однако нельзя забывать, что без поддержки Фронта Моргеса победа в гражданской войне была бы невозможна.\n\nПредставляющий генералов, выступающих за восстановление свободных выборов в Польше, Фронт Моргеса поддерживает бывшего премьер-министра Польши Винцентия Витоса.\n\nХотя назначение Витоса лидером партии умиротворило бы Фронт Моргеса, смещение Миколайчика с должности может привести к тому, что многие крестьяне, сражавшиеся на передовой за наше демократическое дело, почувствуют себя бесправными и преданными партией."
  NSB_poland_democratic_events.1.a:0 "Витос обладает опытом, он наш лидер."
  NSB_poland_democratic_events.1.b:0 "Миколайчик - народный герой, он наш лидер."
  NSB_poland_communist_events.2.a:0 "Это наш единственный шанс."
  NSB_poland_communist_events.2.b:0 "Нет!"
  NSB_poland_communist_events.2.desc:0 "[From.GetNameDefCap] предложил нам предоставить тотальную военную защиту в обмен на верховенство над [Root.GetNonIdeologyName]. Ссылаясь на прямую и постоянную экзистенциальную угрозу, которую представляют собой Россия и Германия для [Root.GetNonIdeologyName], политики из [From.GetNameDef] предлагают нам положение протектората. Принятие этого предложения превратит [Root.GetNonIdeologyName] в марионетку, однако не похоже, что [From.GetNonIdeologyName] примет отказ."
  NSB_poland_communist_events.2.t:0 "Защита предложения [From.GetNameDefCap]"
  NSB_poland_communist_events.201.a:0 "Великолепно."
  NSB_poland_communist_events.201.desc:0 "[From.GetNameDefCap] стал государством-сателлитом [Root.GetNameDef]. Благодаря [From.GetAdjective] правительству, которое теперь напрямую подчиняется [Root.Capital.GetName], наши цели, связанные с гегемонией в Балтийском море, становятся неизбежными."
  NSB_poland_communist_events.201.t:0 "[From.GetNameDefCap] принимает!"
  NSB_poland_communist_events.202.a:0 "Мы всегда можем рассчитывать на военных."
  NSB_poland_communist_events.202.desc:0 "[From.GetNameDefCap] отказался от нашего предложения о защите и настаивает на сохранении своей независимости. Высшее командование [Root.GetAdjective] уже начало подготовку к тому, чтобы добиться успеха там, где не удалось МИД. [Root.GetLeader] достаточно отдать приказ, и начнется полномасштабное вторжение в [From.GetNameDef]."
  NSB_poland_communist_events.202.t:0 "[From.GetNameDefCap] отказывается"
  NSB_poland_communist_events.3.a:0 "Рабочие [Root.GetNonIdeologyName] и [From.GetNonIdeologyName], объединяйтесь!"
  NSB_poland_communist_events.3.b:0 "Это неприемлемо."
  NSB_poland_communist_events.3.desc:0 "[From.GetNameDefCap] потребовал немедленной аннексии [Root.GetNameDef]. Аннексия является частью амбиций [From.GetLeader], чтобы сформировать "Содружество социалистических республик". Принятие этого означало бы немедленный отказ от нашей независимости, оставив [Root.GetNonIdeologyName] непосредственной частью [From.GetAdjective] государства."
  NSB_poland_communist_events.3.t:0 "[From.GetNameDefCap] стремится к [Root.GetAdjective] интеграции"
  NSB_poland_communist_events.301.a:0 "Жаль."
  NSB_poland_communist_events.301.desc:0 "[From.GetNameDefCap] отказался присоединиться к Содружеству социалистических республик. Хотя это не означает конец для амбиций [Root.GetAdjective] в этом регионе, это означает, что мирные отношения с [From.GetNameDef] стали невозможны."
  NSB_poland_communist_events.301.t:0 "[From.GetNameDefCap] отказывается"
  NSB_poland_communist_events.302.a:0 "Отлично."
  NSB_poland_communist_events.302.desc:0 "Амбиции [Root.GetLeader], чтобы увидеть, как [From.GetNameDef] вступает в Содружество социалистических республик, воплотились в реальность, поскольку [From.GetAdjective] правительство согласилось подчинить себя прямому [Root.GetAdjective] руководству."
  NSB_poland_communist_events.302.t:0 "[From.GetNameDefCap] принимает аннексию"
  NSB_poland_communist_events.4.a:0 "Мы принимаем."
  NSB_poland_communist_events.4.b:0 "Они не готовы."
  NSB_poland_communist_events.4.desc:0 "[From.GetNameDefCap] предложили сдать нам Восточную Польшу в обмен на статус протектората и тесную интеграцию с СССР. Если мы примем, [From.GetNameDef] станет марионеточным государством [Root.GetNameDef], а белорусские и украинские государства, в настоящее время оккупированные Польшей, будут переданы СССР.\n\nХотя это кажется очевидным выбором, немецкие амбиции в Польше могут означать, что война между [Root.GetNameDef] и [GER.GetNameDef] может стать неизбежной."
  NSB_poland_communist_events.4.t:0 "[From.GetNameDefCap] предлагает восток"
  NSB_poland_communist_events.401.a:0 "Необходимая жертва."
  NSB_poland_communist_events.401.desc:0 "[From.GetNameDefCap] согласились взять нас под протекторат, и мы были интегрированы в СССР как субъект. Хотя многие в стране чувствуют себя преданными из-за нашего решения, [Root.GetLeader] заверил польский народ, что [From.GetLeader] является другом Польши, и любые этнические поляки, теперь интегрированные непосредственно в СССР, будут полностью довольны своими новыми [From.GetAdjective] сюзеренами."
  NSB_poland_communist_events.401.t:0 "[From.GetNameDefCap] принимает!"
  NSB_poland_communist_events.402.a:0 "Очень хорошо."
  NSB_poland_communist_events.402.desc:0 "[From.GetLeader] отказался принять [Root.GetNameDef] в СССР, заявив, что [Root.GetLeader] "не готов". Хотя это остаётся официальной причиной, многие подозревают, что истинной причиной отказа являются амбиции Германии в Польше."
  NSB_poland_communist_events.402.t:0 "[From.GetNameDefCap] отказывает"
  NSB_poland_communist_events.5.a:0 "Независимость - это вовсе не вариант."
  NSB_poland_communist_events.5.b:0 "У нас есть задачи поважнее."
  NSB_poland_communist_events.5.desc:0 "[From.GetNameDefCap] больше не является марионеткой [Root.GetAdjective], и это небольшое государство провозгласило себя независимой социалистической республикой. На данный момент обстановка мирная, а [From.GetNameDef] по-прежнему остаётся членом [Root.GetFactionName]."
  NSB_poland_communist_events.5.t:0 "[From.GetNameDefCap] провозглашает независимость!"
  NSB_poland_communist_events.501.a:0 "Тогда война неизбежна!"
  NSB_poland_communist_events.501.desc:0 "Как и следовало ожидать, [From.GetLeader] не воспринял декларацию о независимости [Root.GetAdjective] дружелюбно и объявил её актом войны."
  NSB_poland_communist_events.501.t:0 "[From.GetNameDefCap] объявляет войну"
  NSB_poland_communist_events.502.a:0 "Мы останемся в [From.GetFactionName]"
  NSB_poland_communist_events.502.b:0 "Мы объявляем о нашей полной независимости."
  NSB_poland_communist_events.502.desc:0 "[From.GetNameDefCap] принял нашу декларацию о независимости, и кажется, сейчас между нашими странами наступил мир. И хотя теперь мы полностью независимы, мы можем остаться в союзе с [From.GetNameDef] или покинуть фракцию и рассмотреть другие варианты."
  NSB_poland_communist_events.502.t:0 "[From.GetNameDef] принимает [Root.GetAdjective] независимость"
  NSB_poland_communist_events.6.a:0 "Это не имеет значения."
  NSB_poland_communist_events.6.b:0 "Это наши земли."
  NSB_poland_communist_events.6.desc:0 "Хотя восточная Польша вошла в соглашение, благодаря которому [From.GetNameDef] стал членом [Root.GetFactionName], это маленькое государство запросило ее возвращение, ссылаясь на лояльность своего государства к международному делу. Они заявляют, что люди Западной Беларуси и Украины были частью польского государства в течение десятилетий и играли важную роль в крестьянском восстании, которое привело к росту социализма в Польше."
  NSB_poland_communist_events.6.t:0 "[From.GetNameDefCap] просит восточную Польшу"
  NSB_poland_communist_events.601.a:0 "Наша страна снова едина."
  NSB_poland_communist_events.601.desc:0 "Восточная Польша была возвращена в качестве основной части [Root.GetNameDef]. Территории уже реинтегрируются с [Root.GetAdjective] администрацией, и регион, который сыграл важную роль в свержении старого режима, был воссоединен с государством, за которое сражался его народ."
  NSB_poland_communist_events.601.t:0 "[From.GetNameDefCap] Возвращает Восточную Польшу!"
  NSB_poland_communist_events.602.a:0 "Очень хорошо."
  NSB_poland_communist_events.602.b:0 "Тогда будем независимы!"
  NSB_poland_communist_events.602.desc:0 "[From.GetNameDefCap] отказался вернуть Восточную Польшу [Root.GetNameDef]. Многие поляки предвидели такой исход, но теперь в них растет разочарование, и в [From.GetNameDef] зреет сепаратистский дух."
  NSB_poland_communist_events.602.t:0 "[From.GetNameDefCap] отвергает"
  NSB_poland_monarchist_events.1.a:0 "Мы должны противостоять."
  NSB_poland_monarchist_events.1.desc:1 "Теперь, когда [From.GetLeader] короновали как короля [From.GetNonIdeologyName], правительство [From.GetAdjective] хочет использовать это как рычаг в споре с [Root.GetNonIdeologyName]! С помощью войны пропаганды и позиционирования [From.GetNameDef] попытается превратить сопротивление режиму [Root.GetLeader] в оружие и поддержать внутренний переворот.\nЕсли пропаганда окажется эффективной, [Root.GetLeader] может столкнуться с переворотом и [Root.GetNonIdeologyName] станет чем-то вроде марионетки [From.GetAdjective]."
  NSB_poland_royal_election.4.b:0 "Возможно, мы слишком рано отвергли Фридриха Кристиана..."
  NSB_polish_fascist_events.1.a:0 "Зачем вторгаться, если они готовы сами сдаться?"
  NSB_polish_fascist_events.1.b:0 "У нас на Польшу другие планы."
  NSB_polish_fascist_events.1.desc:0 "[From.GetAdjective] правительство предложило пакт о поддержке наших целей глобальной гегемонии. Очевидно, что [From.GetLeader] осознает, что [Root.GetLeader] не удовлетворен границами, проведенными между Польшей и Германией, поэтому польский министр иностранных дел Юзеф Бек был послан для предложения поправки к этой сделке.\n\nПольша соглашается уступить западные территории Познань, Данциг и Верхнюю Силезию в обмен на взаимные пакты о ненападении и немецкую защиту и руководство против любой попытки вторжения [SOV.GetAdjective]. Пакт, по сути, сделает Польшу чем-то большим, чем немецкая марионетка, а также уступит спорные территории на нашей границе. Стоит ли нам соглашаться?"
  NSB_polish_fascist_events.1.t:0 "Пакт Бека-Риббентропа"
  NSB_polish_fascist_events.101.a:0 "Безопасно, но какой ценой?"
  NSB_polish_fascist_events.101.desc:0 "[From.GetNameDefCap] согласилась на наши условия, и [Root.GetNameDef] теперь официально находится под [From.GetAdjective] защитой. Уже [From.GetAdjective] солдаты наводнили [Root.GetAdjective] сельскую местность солдатами, а наши министры напрямую отвечают Берлину."
  NSB_polish_fascist_events.101.t:0 "[From.GetNameDefCap] подписывает пакт"
  NSB_polish_fascist_events.102.a:0 "Время для смены курса."
  NSB_polish_fascist_events.102.desc:0 "Несмотря на то, что наше предложение фактически вручает ключи от нашей страны прямо в руки [From.GetLeader], похоже, что [From.GetAdjective] правительство имеет другие планы и решительно отклонило наше предложение."
  NSB_polish_fascist_events.102.t:0 "[From.GetNameDefCap] отвергает пакт"
  NSB_polish_fascist_events.2.a:0 "Предъявить ультиматум."
  NSB_polish_fascist_events.2.b:0 "Очень хорошо."
  NSB_polish_fascist_events.2.c:0 "Нет."
  NSB_polish_fascist_events.2.desc:0 "Несмотря на свое нынешнее положение вассала [Root.GetAdjective], [From.GetNameDef], похоже, все еще имеет амбиции на гегемонию над Британским содружеством. Признавая наши претензии на Мемель, [From.GetLeader] предлагает разделить страну: Мемельский регион переходит под контроль [Root.GetAdjective], а остальная часть страны становится [From.GetAdjective]."
  NSB_polish_fascist_events.2.t:0 "[From.GetNameDefCap] стремится разделить Литву"
  NSB_polish_fascist_events.201.a:0 "У нас нет выбора."
  NSB_polish_fascist_events.201.b:0 "Мы отказываемся!"
  NSB_polish_fascist_events.201.desc:0 "Совместное требование аннексии поступило от маловероятного альянса между [POL.GetNameDef] и [GER.GetNameDef]. Они требуют, чтобы Мемельский регион был передан Германии, а остальная часть нашей страны была полностью аннексирована Польшей."
  NSB_polish_fascist_events.201.t:0 "Германия и Польша требуют аннексии Литвы"
  NSB_polish_fascist_events.202.a:0 "Как прискорбно."
  NSB_polish_fascist_events.202.desc:0 "Похоже, у Германии другие планы на Литву, так как наше предложение об аннексии было единогласно отклонено."
  NSB_polish_fascist_events.202.t:0 "[From.GetNameDefCap] отклоняет"
  NSB_polish_fascist_events.203.a:0 "Отлично."
  NSB_polish_fascist_events.203.desc:0 "[From.GetNameDefCap] согласился на наши требования, и бывшие литовские территории уже поделены между Польшей и Германией. Не выстрелив ни разу, мы получили Литву."
  NSB_polish_fascist_events.203.t:0 "[From.GetNameDefCap] соглашается"
  NSB_polish_fascist_events.204.a:0 "Мы просто возьмём это силой."
  NSB_polish_fascist_events.204.desc:0 "Похоже, Литва отказалась от наших разумных требований. Хотя дипломатия, возможно, и потерпела неудачу, но теперь это стало делом военных."
  NSB_polish_fascist_events.204.t:0 "[From.GetNameDefCap] дерзкий!"
  NSB_polish_fascist_events.3.a:0 "Это кажется разумным."
  NSB_polish_fascist_events.3.b:0 "Нет. Польша наша."
  NSB_polish_fascist_events.3.desc:0 "Утверждая, что наше использование польских заводов мешает военным усилиям, министры из [From.GetNameDef] попросили нас ослабить наши требования к их стране. Хотя соглашение сохранит статус Польши как [Root.GetAdjective] протектората, оно значительно увеличит их политическую и экономическую независимость."
  NSB_polish_fascist_events.3.t:0 "[From.GetNameDefCap] просит автономии"
  NSB_polish_fascist_events.301.a:0 "Отлично"
  NSB_polish_fascist_events.301.desc:0 "[From.GetNameDefCap] согласился значительно увеличить автономию нашего государства. Хотя мы всё ещё [From.GetAdjective] субъект, теперь мы гораздо более независимы в промышленном и дипломатическом плане."
  NSB_polish_fascist_events.301.t:0 "[From.GetNameDefCap] предоставляет автономию"
  NSB_polish_fascist_events.302.a:0 "Увы."
  NSB_polish_fascist_events.302.b:0 "Возможно, Подпольное государство сможет помочь..."
  NSB_polish_fascist_events.302.desc:0 "Наш запрос на предоставление автономии был решительно отклонён [From.GetNameDef], причём советники [From.GetAdjective] даже были оскорблены одним лишь предложением чего-то подобного. Они утверждают, что наше постоянное подчинение является необходимой частью военных усилий, и, похоже, что мы останемся их субъектом в обозримом будущем."
  NSB_polish_fascist_events.302.t:0 "[From.GetNameDefCap] затягивает вожжи"
  NSB_polish_fascist_events.4.a:0 "Нам следует захватить Прибалтику."
  NSB_polish_fascist_events.4.b:0 "Белоруссия и Украина станут нашим домом."
  NSB_polish_fascist_events.4.c:0 "Мы должны достроить Интермариум."
  NSB_polish_fascist_events.4.desc.first:0 "Мы принесли большие жертвы в наших усилиях по уничтожению большевизма: нашу западную границу, нашу независимость и жизни бесчисленных солдат. Теперь пришло время попросить что-то взамен. Мы наверняка победим в нашей войне с [SOV.GetNameDef], на востоке мы видим бесчисленные возможности для польской экспансии."
  NSB_polish_fascist_events.4.desc.rejected:0 "[From.GetNameDefCap] отклонил наше предложение по границам после войны, но это не имеет большого значения, когда есть столько других вариантов для будущего польского государства."
  NSB_polish_fascist_events.4.t:0 "Польша после войны"
  NSB_polish_fascist_events.401.a:0 "Это удовлетворительно."
  NSB_polish_fascist_events.401.b:0 "Нет."
  NSB_polish_fascist_events.401.desc.baltics:0 "Польша обратилась к нам с предложением о своих будущих границах после войны. Указывая на территорию, которую они потеряли от [Root.GetNameDef] в пакте Бек-Риббентропа, правительство [From.GetAdjective] считает, что они имеют право на некоторые территориальные изменения после победы в войне.\n\nОни стремятся продвинуться на север в Прибалтийские государства, ссылаясь на бывшее государство-сателлит Содружества Курляндию в качестве оправдания."
  NSB_polish_fascist_events.401.desc.ukraine:0 "Польша обратилась к нам с предложением о своих будущих границах после войны. Указывая на территорию, которую они потеряли от [Root.GetNameDef] в пакте Бек-Риббентропа, правительство [From.GetAdjective] считает, что они имеют право на некоторые территориальные изменения после победы в войне.\n\nОни стремятся продвинуться на восток в Беларусь и Украину, ссылаясь на бывшие территории Содружества на Востоке."
  NSB_polish_fascist_events.401.desc.blacksea:0 "Польша предложила нам проект послевоенных границ. Ссылаясь на потерянную по пакту Риббентропа — Молотова территорию [Root.GetNameDef], [From.GetAdjective] правительство полагает, что имеет право на территориальные изменения после победы в войне.\n\nОни стремятся продвинуться на юг в Крым, ссылаясь на давнюю амбицию Польши, которая простирается от моря до моря."
  NSB_polish_fascist_events.402.a:0 "Будущее Польши в безопасности."
  NSB_polish_fascist_events.402.desc:0 "Наше предложение о будущих границах Польши было принято [From.GetNameDef], и регионы, на которые мы претендовали, уже интегрируются с нашей гражданской администрацией. Хотя мы, возможно, никогда не вернем запад, эти новые территории более чем компенсировали физическую землю, взятую у нас несколько лет назад."
  NSB_polish_fascist_events.5.a:0 "Отличная инициатива."
  NSB_polish_fascist_events.5.b:0 "Не думаю."
  NSB_polish_fascist_events.5.desc:0 "Альянс, основанный на принципах фалангизма и католической идентичности, [From.GetNameDef] пригласил нас в Фалангистский Интернационал. Принятие означает, что наши две нации будут сражаться вместе во времена войны, а также воодушевит и укрепит фалангистские элементы в нашем правительстве. Примем ли мы приглашение?"
  NSB_polish_fascist_events.5.t:0 "[From.GetNameDefCap] приглашает нас в Фалангистский Интернационал"
  NSB_polish_fascist_events.6.t:0 "Варшавские беспорядки"
  NSB_polish_fascist_events.6.desc:0 "Постоянная поддержка и подстрекательство фалангистов переросли в серию националистических беспорядков на улицах Варшавы. Очевидно, воодушевленные готовностью [Root.GetLeader] сотрудничать с правыми экстремистами и поддерживать их, бунтовщики прошли по улицам Варшавы, закончив противостоянием у Варшавского замка. Военные офицеры, лояльные фракции Санация в правительстве, оказались неспособны остановить толпу, когда они ворвались в столицу и физически вывели [Root.GetLeader] из здания.\n\nЗамок уже освобожден от всего руководства Санации, а Болеслав Пясецкий объявил себя лидером нового польского государства."
  NSB_polish_fascist_events.6.a:0 "Все по плану."
  NSB_polish_fascist_events.7.t:0 "Национальные выборы в Польше"
  NSB_polish_fascist_events.7.desc:0 "Поскольку Санация все чаще принимает политику и убеждения Национально-демократической партии, многие сочли, что это всего лишь вопрос времени, прежде чем республика снова проведет всеобщие выборы. С подписанием третьей конституции Польши выборы возобновились, но с условием, что партии, признанные непатриотичными, не будут допущены к власти.\n\n"Непатриотичные" партии включают в себя PSL вместе с большинством других крупных левых и центристских партий, оставив избирателям мало выбора, кроме Национальных демократов. Национальные демократы одержали победу на выборах, а конкурирующие партии, такие как Санация, получили лишь часть голосов, предоставив НД почти полный контроль над республикой."
  NSB_polish_fascist_events.7.a:0 "Я люблю демократию"
  nsb_news.1.a:0 "Польские рабочие восстают!"
  nsb_news.1.b:0 "Мы сокрушим этих выскочек!"
  nsb_news.1.c:0 "Мадонна, защити нас"
  nsb_news.1.d:0 "Смотрите, как Польша сама себя разделяет"
  nsb_news.1.e:0 "Что это будет означать для Польши?"
  nsb_news.1.desc:0 "Молодое государство Польша оказалось ввергнуто в пучину гражданской войны! Многолетние междоусобицы в правительстве и абсолютное отсутствие инвестиций в инфраструктуру сельской Восточной Польши в начале этого года привели к всеобщей забастовке низших классов страны, а продолжающееся жестокое обращение полиции и военных с бастующими разделило страну на две части.\n\nКрестьянское правительство во главе с [peasant_poland_target.GetLeader] поддерживается демократической фракцией "Фронт Моржес" польских военных и коалицией марксистов, социалистов и либералов.\n\nПольша разделена кровью крестьян на промышленные районы с лояльными правительству силами и крестьян на сельском востоке."
  nsb_news.1.t:0 "Крестьянское восстание в [peasant_poland_target.Capital.GetName]"
  nsb_news.2.a:0 "Это оскорбление!"
  nsb_news.2.b:0 "А я, между прочим, приветствую наших новых польских повелителей."
  nsb_news.2.c:0 "Либерия - это только начало."
  nsb_news.2.d:0 "Польша в Африке?"
  nsb_news.2.f:0 "Очередной бессмысленный акт империализма."
  nsb_news.2.e:0 "Это... весьма похоже на империализм."
  nsb_news.2.desc.dem:1 "Сегодня Польша приняла на себя верховенство над Либерией! С 1932 года Либерия рассматривала Польшу как своего предпочтительного инвестиционного партнера, полагая, что у страны мало колониальных амбиций. Однако соглашение, подписанное Польшей, Либерией и Лигой Наций, теперь превратило Либерию в марионетку Польши.\n\nОфициальные лица США осудили это решение, считая независимость Либерии необходимым компонентом основных принципов нации.\n\nМорская и колониальная лига Польши считает это колоссальной победой для польских колониальных амбиций и заявляет, что это далеко не полностью амбиции поляков в Африке."
  nsb_news.2.desc.com:1 "Сегодня Польша приняла на себя верховенство над Либерией! С 1932 года Либерия рассматривала Польшу как своего предпочтительного инвестиционного партнера, полагая, что у страны мало колониальных амбиций. Однако это соглашение теперь превратило Либерию в марионетку Польши.\n\nОфициальные лица США осудили это решение, считая независимость Либерии необходимым компонентом основных принципов нации.\n\nЧлены KPP обвиняют [POL.GetLeader] в колониализме, [POL.GetLeader.GetSheHe] клянется, что это делается только для защиты Либерии от потенциальных колонизаторов, хотя многие остаются неубежденными."
  nsb_news.2.t:1 "Объявлен [LIB.GetAdjective] протекторат"
  nsb_news.3.t:0 "Объединенный Туркестан!"
  nsb_news.3.desc:0 "С присоединением всей территории Центральной Азии к [From.GetOldAdjective] под контролем тюркские народы были объединены под руководством [From.GetLeader]. Новое тюркское правительство объявило, что [From.GetOldNameDef] отныне будет известен как [From.GetNameDef] и является законным домом всех тюркских народов.\n\nДаже за пределами границ этой новой нации многие тюркские народы начинают считать [From.GetNameDef] своим истинным домом, и [From.GetLeader] может воспользоваться этой возможностью, чтобы расширить свою растущую нацию."
  nsb_news.3.a:0 "Мы больше не разделены."
  nsb_news.3.b:0 "Интересно."
  nsb_news.4.t:0 "[POL.GetNameDefCap] захватывает Данциг!"
  nsb_news.4.desc:0 "Вольный город Данциг, основанный Версальским договором в 1920 году, до сегодняшнего дня был независимой нацией под защитой польского государства. Однако с обострением напряженности на немецко-польской границе и отказом правительства Данцига разрешить польскую торговлю через городской порт польское правительство сегодня объявило, что Данциг больше не является вольным городом.\n\nУже сейчас улицы Данцига заполнены польскими солдатами, единственная задача которых - увеличить власть государства над городом. Альберт Форстер и многие другие члены нацистской партии скрылись, и идут разговоры о восстании и возможном переходе на сторону [GER.GetNameDef]."
  nsb_news.4.a:0 "Больше не "вольный" город."
  nsb_news.4.b:0 "Что дальше? Реммилитаризация Рейнской области?"
  nsb_news.4.c:0 "Мы ожидали большего от Польши."
  nsb_news.4.d:0 "Они долго не продержатся в городе."
  nsb_news.4.e:0 "Интересно."
  nsb_news.5.t:0 "[POL.GetNameDefCap] Назначает Короля!"
  nsb_news.5.desc.saxon:0 "Пятого ноября 1916 года, Вильгельм II германский и Франц Иосиф Австрийский подписали совместную декларацию о том, что на польских оккупированных территориях в России должно родиться новое королевство - Королевство Польша. Тем не менее, молодое государство не смогло найти себе короля, и тогдашний президент провозгласил создание Второй Польской республики.\n\nОднако кажется, что Польша наконец-то нашла себе короля в лице [POL.GetLeader]! Маркграф Мейсена сейчас стал королем Польши Фридрихом I. Несмотря на опасения по поводу надвигающейся войны с немцами, польский регентский совет предложил маркграфу трон из-за давней исторической связи между Польшей и знатью Саксонии."
  nsb_news.5.desc.romania:0 "5 ноября 1916 года Вильгельм II Германский и Франц Иосиф Австрийский подписали совместную декларацию, согласно которой из польских оккупированных территорий в России должно было возникнуть новое Королевство Польша. Однако молодое государство не смогло найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nКажется, Польша наконец нашла своего короля в лице [POL.GetLeader]! Поскольку Польшу и Румынию связывает давняя дружба и союз, то похоже, что польский регентский совет имеет амбиции гораздо более тесных отношений с [ROM.GetNameDef]. Будучи наследником румынского престола, он обязательно со временем необратимо сблизит эти два народа."
  nsb_news.5.desc.cossack:0 "5 ноября 1916 года Вильгельм II Германский и Франц Иосиф Австрийский подписали совместную декларацию, согласно которой из польских оккупированных территорий в России должно было возникнуть новое Королевство Польша. Однако молодое государство не смогло найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nКажется, Польша наконец нашла своего короля в лице [POL.GetLeader]! Будучи казаком, дворянином и полководцем, [POL.GetLeader] маловероятный претендент на польский престол, но, несомненно, его непреходящие амбиции относительно своего личного владения на Балтике весьма привлекательны для польских министров, которые все еще лелеют в своих сердцах надежды на восстановление Речи Посполитой."
  nsb_news.5.desc.romanov:0 "5 ноября 1916 года Вильгельм II Германский и Франц Иосиф Австрийский подписали совместную декларацию о том, что из оккупированных Польшей территорий в России будет создано новое Королевство Польское. Однако молодое государство так и не нашло в свое время короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nТем не менее, похоже, что Польша наконец-то нашла себе короля в лице [POL.GetLeader]! Как и Ядвига до нее, королева-регент решила взять титул "король". Хотя многие сомневаются, что она является истинной дочерью царя Николая II, она, тем не менее, была коронована в Варшаве как король Польши Анастасия Романова."
  nsb_news.5.desc.habsburg:0 "5 ноября 1916 года Вильгельм II Германский и Франц Иосиф Австрийский подписали совместную декларацию о том, что из оккупированных Польшей территорий в России будет создано новое Королевство Польское. Однако молодое государство так и не нашло в свое время короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nТем не менее, похоже, что Польша наконец-то нашла себе короля в лице [POL.GetLeader]! Рожденный в дворянской семье Габсбургов, Карл Альбрехт сражался за польские войска почти столько же, сколько существует польское государство, и сегодня под рев ликующих толп он был избран первым королем Польши из династии Габсбургов."
  nsb_news.5.a:0 "Да здравствует король!"
  nsb_news.5.b:0 "Появилось королевство."
  nsb_news.5.c:0 "Какое безумие?"
  nsb_news.6.t:0 "Националисты захватывают власть в правительстве Польши"
  nsb_news.6.desc:0 "У эндеции и фаланги сложились давние отношения с польским правительством, но постоянное сотрудничество Игнация Мосцицкого с этими крайне правыми элементами в конце концов стало причиной его падения. В результате возросшего влияния в польском правительстве [POL.GetLeader] сместил Мосцицкого с поста президента Польши.\n\nЕще предстоит выяснить, считает ли новое националистическое правительство, что оно может каким-то образом умиротворить иностранные державы, борющиеся за его территорию, или, возможно, на горизонте у Польши появятся новые альянсы."
  nsb_news.6.a:0 "Польша возрождается и становится сильнее."
  nsb_news.6.b:0 "Как ужасно."
  nsb_news.7.t:1 "Союз корон [POL.GetAdjective] и [From.GetAdjective]"
  nsb_news.7.desc:0 "В результате неожиданного поворота событий и [From.GetNameDef], и [POL.GetNameDef] перешли под власть [POL.GetLeader]. Хотя обе страны остаются отдельными на данный момент, общий глава государства означает, что они неразрывно связаны дипломатическими отношениями.\n\nВероятно, что этот личный союз скоро перерастет в объединение государств [FROM.GetAdjective] и [POL.GetAdjective], но пока союз остается чисто дипломатическим."
  nsb_news.7.a:0 "Скоро мы станем едины."
  nsb_news.7.b:0 "Интересно."
  nsb_news.8.t:0 "Королевство Литва"
  nsb_news.8.desc:0 "4 июня 1918 года Вильгельм Карл фон Урах был демократически избран королем Литвы при подавляющей поддержке. Однако вмешательство Германской империи привело к тому, что референдум был признан недействительным, и Литва так и не объединилась со своим королем. Несмотря на это, президент Литвы сегодня упразднил свою должность и объявил короля Мидоугаса III главой нового Королевства Литва.\n\nПри Антанасе Сметоне, ставшем премьер-министром Литвы, страна стала абсолютной монархией и, кажется, по всей стране распространяется новая волна литовского патриотизма и шовинизма."
  nsb_news.8.a:0 "Ещё одна страна пала в руки монархии."
  nsb_news.8.b:0 "Что это для нас будет значить?"
  nsb_news.8.c:0 "Королевство снова существует!"
  nsb_news.8.d:0 "Интересно."
  nsb_news.9.t:0 "Началась [GetSovietCivilWarName]!"
  nsb_news.9.desc_left:0 "В России вновь разразилась гражданская война. Учитывая, что воспоминания о прошлой гражданской войне до сих пор свежи в памяти у всех, удивительно, что до этого дошло. После многих лет политической борьбы между сталинистами и троцкистами Советское правительство окончательно раскололось, и теперь две группировки сражаются на улицах за контроль над страной. \n\n[SOV.GetLeader] объявил [SOV.GetLeader.GetHerselfHimself] лидером того, что [SOV.GetLeader.GetSheHe] называет [SOV.GetNameDef], и ведёт войну против [SOS.Getleader] со своей базы в [SOV.Capital.GetName]."
  nsb_news.9.desc_right:0 "В Советской России вновь вспыхнули открытые столкновения. Но на этот раз это не война между большевиками и белыми, а война между соперничающими фракциями внутри коммунистической партии. [SOS.GetLeader] удерживает столицу, а повстанцы, возглавляемые [SOV.GetLeader], обосновались в [SOV.Capital.GetName]. Циркулируют слухи, что восстание [SOV.GetLeader] спонсируется иностранными державами, но справедливость этих слухов еще предстоит выяснить."
  nsb_news.9.desc_exiles:0 "Довольно неожиданно белые силы вновь восстали против большевиков. Могло казаться, что их дело проиграно, но за последние месяцы поступало несколько сообщений о наращивании военной мощи в Маньчжурии и Сибири, и сегодня утром в [SOV.capital.GetName] было провозглашено временное правительство России.\n\n[SOS.GetAdjective] правительство немедленно мобилизовало Красную армию, и Россия вновь ввергнута в гражданскую войну. Западные державы пока не проявили интереса к вмешательству в конфликт. Однако еще предстоит увидеть, как отреагируют японцы на этот поворот событий."
  nsb_news.9.a:0 "К победе!"
  nsb_news.9.b:0 "До чего же дошло!"
  nsb_news.9.c:0 "Коммунисты сами себя уничтожают."
  nsb_news.9.d:0 "[SOS.GetLeader] обязательно победит."
  nsb_news.9.e:0 "Чем это обернется для коммунистического дела?"
  nsb_news.9.f:0 "Вот оно, насилие, присущее системе!"
  nsb_news.9.g:0 "На этот раз они сами по себе."
  nsb_news.9.h:0 "Однажды их уже избили, конечно, и сейчас растопчут!"
  nsb_news.9.i:0 "Дело благородное, но смогут ли они на самом деле победить в этом?"
  nsb_news.10.t:0 "Конец [GetSovietCivilWarName]!"
  nsb_news.10.desc_stalinist:0 "После того как капитулировали последние повстанческие подразделения, [GetSovietCivilWarName] официально завершилась. В пылкой речи к народу [SOS.GetLeader] объявил себя вдохновителем этой победы и превознёс храбрость и преданность Красной Армии. \n\nУничтожив внутренних врагов раз и навсегда, [SOV.Getleader] может начать искать их в других местах. Долгосрочные последствия массовых разрушений промышленности и гибели людей ещё предстоит увидеть."
  nsb_news.10.desc_communist_opposition:0 "Капитуляция последних оставшихся частей, преданных [SOS.GetLeader], знаменует собой конец [GetSovietCivilWarName]. [SOV.GetLeader] объявил [SOV.GetLeader.GetHerselfHimself] победителем и поклялся, что возродит [SOV.GetNameDef] из пепла гражданской войны и разрушения. Предстоящая задача огромна, а мировая ситуация неясна, но [SOV.GetLeader.GetSheHe] непреклонен в том, что новая эра для [SOV.GetNameDef] и для мира только началась. Остаётся дождаться, сможет ли [SOV.GetLeader.GetSheHe] соответствовать этим заявлениям.
  nsb_news.10.desc_exiles:0 "То, что казалось невозможным, возобновление борьбы против большевиков белоэмигрантами, превратилось в победу вопреки всем невзгодам. [SOV.GetLeader] провозгласил [SOS.GetNameDef] побежденной и поклялся вернуть России былую славу. Война опустошила большую часть России и дорого обошлась стране.\n\nО местонахождении [SOS.GetLeader] пока ничего не известно. Ходят слухи, что [SOS.GetLeader.GetSheHe] сбежал из страны за несколько дней до капитуляции и может скрываться где-то в Южной Америке."
  nsb_news.10.desc_exiles_puppet:0 "С помощью Японии временному правительству России удалось победить [SOS.GetLeader] и одержать победу в [GetSovietCivilWarName]. Однако фактическое превращение страны в сателлита [JAP.GetNameDef] - тяжелая цена и заставляет многих задуматься, можно ли действительно считать это победой белых."
  nsb_news.10.a:0 "Мы победили!"
  nsb_news.10.b:0 "Серьезный удар по коммунистической революции."
  nsb_news.10.c:0 "Это действительно удивительно."
  nsb_news.10.d:0 "Россия Сталина рухнула как карточный домик."
  nsb_news.10.e:0 "Возможно, избавление от Сталина пошло на пользу."
  nsb_news.10.f:0 "Будет сложно доверять этим новым лидерам."
  nsb_news.10.g:0 "Может быть, с [SOV.GetLeader] было бы легче договориться."
  nsb_news.11.t:0 "$SOV_iosif_stalin$ убит"
  nsb_news.11.desc:1 "Несмотря на присутствие вокруг его особы крайне серьёзного охранения, лидер [SOV.GetNameDef], $SOV_iosif_stalin$, был обнаружен мёртвым, предположительно в результате убийства, в своей резиденции. [SOV.GetAdjective] столица полнится слухами, и, судя по всему, власть перешла к тройке во главе с $SOV_lavrenty_beriya$, хотя бы временно. Однако новый лидер не очень популярен, так что ещё предстоит выяснить, удастся ли ему удержаться у власти, если ему будет что-то угрожать. Говорят, что НКВД ведёт расследование во всех направлениях, а Берия поклялся найти виновных в убийстве."
  nsb_news.11.a:0 "Может быть, НКВД так или иначе замешан в этом?"
  nsb_news.11.b:0 "О, нет!"
  nsb_news.12.t:0 "[SOV.GetAdjective] переворот"
  nsb_news.12.desc:0 "В результате молниеносной операции [SOV.GetAdjective] оппозиция арестовала и сместила с должности тройку под руководством Берии. Рано утром части Красной армии окружили столицу, в то время как спецназ тайно арестовал $SOV_lavrenty_beriya$ и вывез его в безопасное место до того, как его личные телохранители поняли, что происходит. Было объявлено о создании нового правительства, во главе с [SOV.GetLeader] как новым, очевидным лидером страны, а $SOV_lavrenty_beriya$ был обвинён в измене [SOV.GetNameDef]."
  nsb_news.12.a:0 "Наступают интересные времена."
  nsb_news.12.b:0 "Ситуация становится всё хуже и хуже."
  pavel_events.3.a:0 "Если это поможет избежать войны..."
  pavel_events.3.b:0 "Что за глупые шутки? Нет!"
  pavel_events.3.desc:0 "Из [From.GetNameDef] пришла тревожная телеграмма, требующая немедленно вернуть \"бывшие польские территории\". Речь идёт о Померании, Пруссии и Силезии.\n\nПольское государство стало несколько непредсказуемым с тех пор, как на трон вступил [From.GetLeader], но мало кто мог предположить, что [From.GetLeader.GetSheHe] осмелится требовать территорию у [Root.GetNameDef]."
  pavel_events.3.t:0 "[From.GetNameDefCap] требует Восточную Германию!"
  pavel_events.301.a:0 "Подождите, серьезно?"
  pavel_events.301.desc:0 "В неожиданном повороте событий [From.GetNameDef] поддался требованиям [Root.GetLeader] и уступил Силезию, Померанию и Пруссию [Root.GetNameDef]."
  pavel_events.301.t:0 "[From.GetNameDefCap] сдаётся"
  pavel_events.302.a:0 "Наши требования будут удовлетворены на поле боя."
  pavel_events.302.desc:0 "Как и ожидалось, немцы отвергли требования [Root.GetLeader], сочтя их какой-то изощрённой шуткой. Поскольку дипломатия не смогла повлиять на [From.GetNameDef], [Root.GetLeader] сел на коня и направился к границе, взяв на себя решение этого вопроса с помощью военной силы."
  pavel_events.302.t:0 "[From.GetNameCap] отказывается уступить территории"
  NSB_poland_monarchist_events.6.t:0 "[From.GetNameDefCap] требует присоединить нас"
  NSB_poland_monarchist_events.6.desc:0 "Заявив об очевидном отсутствии оборонительных возможностей [Root.GetNameDef], официальные лица [From.GetNameDef] потребовали, чтобы вся территория [Root.GetNameDef] находилась под непосредственной польской оккупацией. Очевидно, польское государство, ободренное бессодержательными измышлениями своего короля "Анастасии", явно приобрело ненасытное стремление к славянскому объединению. Они заявили недвусмысленно, что если мы не подчинимся, вторжение неизбежно. Как нам ответить?"
  NSB_poland_monarchist_events.6.a:0 "Мы должны сдаться."
  NSB_poland_monarchist_events.6.b:0 "Смешно! Мы отказываемся!"
  NSB_poland_monarchist_events.601.desc:0 "[From.GetNameDefCap] принял наше недавнее требование присоединиться к [Root.GetNameDef]. Уже [Root.GetAdjective] войска заполняют регион, чтобы подавить любое местное сопротивление, прежде чем оно возникнет. Благодаря этой великой победе мы все ближе к нашей амбиции славянского объединения."
  NSB_poland_monarchist_events.601.t:0 "[From.GetNameDefCap] Принимает!"
  NSB_poland_monarchist_events.602.desc:0 "Удивительно, но [From.GetAdjective] правительство отклонило наше требование отказаться от контроля над балканским регионом в пользу [Root.GetNameDef]. Наши попытки найти дипломатическое решение провалились, и теперь это стало вопросом для военных."
  NSB_poland_monarchist_events.601.a:0 "Неужели это сработало?"
  NSB_poland_monarchist_events.602.t:0 "[From.GetNameDefCap] Отказывает!"
  NSB_poland_monarchist_events.602.a:0 "Война так война."
  POL_habsburg_events.1.t:0 "[From.GetNameDefCap] требует правления Габсбургов!"
  POL_habsburg_events.1.desc:0 "С [From.GetLeader] на троне Польши король сегодня выдвинул [Root.GetLeader] ультиматум об отказе от правления Венгрией в пользу Отто фон Габсбурга. Хотя такое решение может быть расценено как нарушение Трианонского договора, похоже, [From.GetLeader] не намерен принимать ответ \"нет\"."
  POL_habsburg_events.1.a:0 "У нас будет король-Габсбург."
  POL_habsburg_events.1.b:0 "Мы отказываемся."
  POL_habsburg_events.101.t:0 "[From.GetNameDefCap] коронует Габсбурга"
  POL_habsburg_events.101.desc:0 "Похоже, наш ультиматум [From.GetNameDef] убедил их короновать Отто фон Габсбурга королем Венгрии! С Габсбургами у власти в Венгрии и Польше начинается новая эра правления Габсбургов по всей Европе."
  POL_habsburg_events.101.a:0 "О да, все идет по плану."
  POL_habsburg_events.102.t:0 "[From.GetNameDefCap] отказывается"
  POL_habsburg_events.102.desc:0 "Венгерское правительство, похоже, совершенно не впечатлено ультиматумом об установлении Отто фон Габсбурга королем Венгрии. Хотя наш ультиматум мог потерпеть неудачу, теперь это дело рук военных."
  POL_habsburg_events.102.a:0 "Пора для агрессивных переговоров."
  POL_habsburg_events.2.t:0 "[From.GetNameDefCap] предлагает альянс"
  POL_habsburg_events.2.desc:0 "Поскольку нашими странами правит семья Габсбургов, [From.GetLeader] предлагает [Root.GetNameDef] и [From.GetNameDef] объединить свои силы для защиты интересов королевской семьи Габсбургов по всей Европе."
  POL_habsburg_events.2.a:0 "Конечно, мы присоединимся."
  POL_habsburg_events.2.b:0 "Мы не заинтересованы."
  POL_habsburg_events.201.t:0 "[From.GetLeader] отклоняет пакт"
  POL_habsburg_events.201.desc:0 "Несмотря на наши родственные связи, кажется, что [From.GetNameDef] совершенно не заинтересован в заключении альянса с [Root.GetNameDef]."
  POL_habsburg_events.201.a:0 "Возможно, нам следует обратиться к союзникам."

  NSB_soviet_paranoia_system_events.01.t:0 "[Root.GetLeader] обеспокоен фракционностью"
  NSB_soviet_paranoia_system_events.01.desc:0 "На недавнем заседании Центрального комитета товарищ [Root.GetLeader] отметил растущий фракционализм внутри партии. Хотя все члены комитета поспешили заверить его в своей полной и безоговорочной поддержке, это, по-видимому, мало успокоило его. По словам товарища [Root.GetLeader], мы всегда должны быть бдительны в отношении диверсантов и вредителей, которые замышляют против государства, на какой бы должности они ни находились.\n\nЭто известие стало несколько неожиданным для многих членов партии, которые полагали, что угроза раскола партии закончилась с изгнанием Троцкого."
  NSB_soviet_paranoia_system_events.01.a:0 "Есть ли действительно основания для его опасений?"
  SOV_paranoia_system_intro_tt:0 "£SOV_paranoia_text_icon Система паранойи теперь активна."
  SOV_paranoia_system_nkvd_trait_tt:0 "Политические советники с признаком §Y$head_of_the_nkvd$§! будут еженедельно повышать £SOV_paranoia_text_icon политическую паранойю."
  NSB_soviet_paranoia_system_events.11.t:0 "Обвинения советника в измене"
  NSB_soviet_paranoia_system_events.11.desc:1 "Действуя по анонимному наводке, НКВД арестовал [?ROOT.SOV_purged_character_for_loc.GetName] по обвинению в шпионаже, саботаже и заговоре против государства. Хотя мужчина продолжает заявлять о своей невиновности, следователи уверены, что в течение нескольких недель они смогут составить против него дело. Либо он признается под пытками, либо будут собраны достаточные доказательства от людей вокруг него, которые готовы свидетельствовать о его преступлениях. В любом случае, наказанием за эти обвинения должна быть либо смерть, либо пожизненные каторжные работы."
  NSB_soviet_paranoia_system_events.11.a:0 "Опухоль так близко к сердцу должна быть удалена без пощады."
  NSB_soviet_paranoia_system_events.11.b:0 "Мы не можем осудить кого-то на основании таких слабых доказательств!"
  NSB_soviet_paranoia_system_events.12.t:0 "Заговор среди государственных служащих"
  NSB_soviet_paranoia_system_events.12.desc:1 "НКВД обнаружило доказательства крупномасштабного заговора внутри гражданской администрации. Кажется, что некоторые бюрократы в Госплане очень тесно сработались с некоторыми директорами фабрик и скорректировали показатели производства в пятилетнем плане в меньшую сторону. По мнению НКВД, это явное доказательство антисоветского саботажа и намеренного ослабления советской системы. \n\n Арестованные заговорщики быстро выдают под допросом других участников заговора."
  NSB_soviet_paranoia_system_events.12.a:0 "Коррупцию следует искоренить."
  NSB_soviet_paranoia_system_events.12.b:0 "Это абсурдная чрезмерная реакция."
  NSB_soviet_paranoia_system_events.13.t:0 "Нелояльность в НКВД?"
  NSB_soviet_paranoia_system_events.13.desc:1 "Группа младших офицеров НКВД обратилась к [Root.GetLeader] с доказательствами того, что нынешний руководитель НКВД строит планы по захвату власти в столице "на случай серьезных беспорядков". Они считают, что это всего лишь уловка, и эти планы на самом деле направлены на насильственный захват власти правительством. \n\nПосле предъявления этих доказательств руководитель НКВД сначала попытался объяснить, что это обычные планы, которые существуют уже много лет и недавно были лишь обновлены. Однако после дальнейшего расследования и тщательного допроса он раскрыл существование большой сети иностранных агентов в НКВД, которые сговорились с иностранными организациями с целью свержения правительства."
  NSB_soviet_paranoia_system_events.13.a:0 "Эти ужасные преступления должны быть жестоко наказаны."
  NSB_soviet_paranoia_system_events.13.b:0 "Эти обвинения явно выдуманы."
  NSB_soviet_paranoia_system_events.19.t:1 "[GetMoscowTrialPurgeName]"
  NSB_soviet_paranoia_system_events.19.desc_1:0 "Расследование убийства товарища Кирова в 1934 году обнаружило множество улик, указывающих на заговор между Зиновьевым и Троцким. После череды арестов и допросов доказательства только стали более весомыми. \n\nПосле встречи с [Root.GetLeader] Зиновьев и Каменев наконец-то признались в сотрудничестве с Троцким с целью свергнуть правительство, убить советских лидеров и в конечном итоге восстановить капитализм в Советском Союзе. Теперь их судят вместе с 14 их сообщниками. Обвинения против них весомы - осуждение будет означать верную смерть."
  NSB_soviet_paranoia_system_events.19.desc_2:0 "После суда над первой группой троцкистов и террористов расследования НКВД продолжались и обнаружили новые доказательства. Карл Радек был арестован и в конечном итоге был сломлен во время допроса. Он выявил существование разветвленной сети людей, полностью или частично работавших с Троцким практически во всех сферах правительства, включая армию. Главари уже были арестованы и признались во время допроса.\n\nЭти главари, включая Радека, теперь предстали перед судом. Их преступления менее серьезны, чем те, в которых обвиняли на последнем суде, - но смертная казнь, безусловно, является возможностью."
  NSB_soviet_paranoia_system_events.19.desc_3:0 "Следствие по делу Второго московского процесса также выявило обширную сеть троцкистов в руководстве партии и армии, которую возглавлял Бухарин. Эти люди были арестованы и допрошены, где они признались в самых тяжких и отвратительных преступлениях — от планирования диверсий до покушения на убийство, в заговоре с иностранными державами и даже в подмешивании гвоздей в масло для ранения или убийства рядовых советских граждан.\n\nВ случае признания виновным наказание за эти преступления, почти наверняка будет смертная казнь через расстрел."
  NSB_soviet_paranoia_system_events.19.desc_4:0 "Агенты НКВД раскрыли новый опасный заговор, в который вовлечены несколько членов нашей партии. Особую тревогу вызывает то, что после нескольких арестов и тщательных допросов всплыли имена нескольких бывших большевиков. Дальнейшее расследование выявило доказательства того, что ряд этих предполагаемых заговорщиков действительно участвовали в актах саботажа, фракционности и антисоветского поведения. Эти люди были преданы суду и теперь ожидают приговора. Судя по выдвинутым против них обвинениям, осуждение, несомненно, повлечет за собой очень суровый приговор."
  NSB_soviet_paranoia_system_events.19.a:0 "Ещё одну группу предателей привлекли к ответственности."
  NSB_soviet_paranoia_system_events.19.b:0 "Нельзя допустить, чтобы революция начала пожирать своих собственных."
  NSB_soviet_paranoia_system_events.21.t:1 "Генерал [?ROOT.SOV_purged_character_for_loc.GetName] обвинён в измене"
  NSB_soviet_paranoia_system_events.21.desc:1 "В ходе расследований по делу троцкистов в армии НКВД получил доказательства того, что генерал [?ROOT.SOV_purged_character_for_loc.GetName] в прошлом не раз критически отзывался о товарище [Root.GetLeader] и указывал на величайший вклад, который Лев Троцкий внёс в революцию во время Гражданской войны. Во время допроса [?ROOT.SOV_purged_character_for_loc.GetName] сначала признался, что восхищается [ROOT.GetLeader] и верен ему, но в итоге не выдержал и сообщил о том, что с ним связались агенты Троцкого, чтобы сформировать контрреволюционную ячейку в армии, которая должна совершить акты саботажа в отношении Красной Армии."
  NSB_soviet_paranoia_system_events.21.a:0 "Таким людям не место в армии."
  NSB_soviet_paranoia_system_events.21.b:0 "Очевидно, расследование проводилось чрезмерно ревностно."
  NSB_soviet_paranoia_system_events.22.t:0 "Заговор в академии"
  NSB_soviet_paranoia_system_events.22.desc:0 "Некий анонимный информатор сообщил о существовании группы курсантов в одной из престижнейших наших военных академий. Судя по всему, эта группа решила не ограничиваться утверждённой программой обучения и обсуждать идеи позорных и реакционных теоретиков. Пока неясно, где они раздобыли труды этих людей, но тщательное расследование и допросы зачинщиков наверняка быстро дадут результаты."
  NSB_soviet_paranoia_system_events.22.a:0 "Мы должны обеспечить лояльность всех будущих лидеров."
  NSB_soviet_paranoia_system_events.22.b:0 "Академия – место для задавания вопросов, и мы не должны этому препятствовать."
  NSB_soviet_paranoia_system_events.23.t:0 "Антисаботажная кампания"
  NSB_soviet_paranoia_system_events.23.desc:1 "Согласно данным последних крупных учений, значительный процент машин вышел из строя из-за механических поломок, а также имеется информация о раненых новобранцах. Эти данные попали на стол товарища [Root.GetLeader], который серьезно обеспокоен возможностью саботажа со стороны военнослужащих. Он хочет выяснить, как эти новые танки могли выйти из строя всего через несколько дней нахождения в полевых условиях без технического обслуживания."
  NSB_soviet_paranoia_system_events.23.a:0 "Мы должны начать полное расследование, чтобы поймать преступников!"
  NSB_soviet_paranoia_system_events.23.b:0 "Это обычное дело для современной армии."
  NSB_soviet_paranoia_system_events.24.t:1 "[?ROOT.SOV_accuser_character_for_loc.GetName] обвиняет [?ROOT.SOV_accused_character_for_loc.GetName]"
  NSB_soviet_paranoia_system_events.24.desc:1 "В главное командование армии поступил доклад. В этом докладе [?ROOT.SOV_accuser_character_for_loc.GetName] утверждает, что его коллега генерал [?ROOT.SOV_accused_character_for_loc.GetName] грубейшим образом пренебрег своими обязанностями. По словам [?ROOT.SOV_accuser_character_for_loc.GetName], [?ROOT.SOV_accused_character_for_loc.GetName] вступил в сговор с иностранными и реакционными элементами с целью передачи информации иностранной разведке. Он также отмечает множество несчастных случаев на учениях, произошедших под командованием [?ROOT.SOV_accused_character_for_loc.GetName], утверждая, что на самом деле это были акты саботажа со стороны лживого генерала и его сообщников в армии. Указанные сообщники подтвердили обвинения после тщательного допроса."
  NSB_soviet_paranoia_system_events.24.a:1 "[?ROOT.SOV_accused_character_for_loc.GetName] должен предстать перед правосудием."
  NSB_soviet_paranoia_system_events.24.b:1 "Это откровенная уловка со стороны [?ROOT.SOV_accuser_character_for_loc.GetName], чтобы спасти свою шкуру."
  NSB_soviet_paranoia_system_events.24.c:0 "Завершить расследование без вынесения вердикта."
  NSB_soviet_paranoia_system_events.28.t:0 "Большая чистка младшего офицерского состава армии"
  NSB_soviet_paranoia_system_events.28.desc:0 "Поступают сообщения о широко распространенной сети офицеров, резко критикующих действия [Root.GetLeader] в военных делах. Арестованные по обвинению в подстрекательстве, саботаже и антисоветских мыслях быстро раскрывают имена других членов сети во время допроса. Хотя подозрения о лояльности генералов существуют уже давно, это показывает, что, возможно, даже майорам и полковникам нельзя доверять."
  NSB_soviet_paranoia_system_events.28.a:0 "Мы не можем позволить гниению поселиться."
  NSB_soviet_paranoia_system_events.28.b:0 "Эти обвинения - грубое преувеличение незначительных проблем."
  NSB_soviet_paranoia_system_events.29.t:0 "Большая чистка - суд над генералами"
  NSB_soviet_paranoia_system_events.29.desc:0 "Доказательства наличия крупной троцкистской сети в армии быстро растут. Каждый день НКВД арестовывает новых подозреваемых, замешанных в предыдущих признаниях. Эти люди, в свою очередь, часто раскрывают имена других соучастников. Потребуется время, чтобы выследить всех генералов, которые являются частью этого заговора, но очевидно, что перечисленные ниже представляют значительную часть заговорщиков, чья вина доказана их признаниями."
  NSB_soviet_paranoia_system_events.29.a:0 "Все предатели должны заплатить высокую цену."
  NSB_soviet_paranoia_system_events.29.b:0 "Это бессмысленная резня!"
  NSB_soviet_paranoia_system_events.30.t:0 "Регулярная чистка флота"
  NSB_soviet_paranoia_system_events.31.t:1 "Адмирал [?ROOT.SOV_purged_character_for_loc.GetName] обвинён в государственной измене"
  NSB_soviet_paranoia_system_events.31.desc:1 "Офицер штаба адмирала [?ROOT.SOV_purged_character_for_loc.GetName] обратился в НКВД с сообщением о ряде подозрительных действий. Согласно рапорту офицера, адмирал [?ROOT.SOV_purged_character_for_loc.GetName] во время недавнего визита в зарубежный порт был очень тепло принят офицерами ВМФ и мог воспользоваться этой возможностью, чтобы передать им секретные сведения. Кроме того, есть данные о том, что в нескольких портах, посещённых адмиралом, были выявлены троцкистские ячейки, что позволило бы ему вступить в сговор с Троцким против государства, если бы он захотел."
  NSB_soviet_paranoia_system_events.31.a:0 "Таким людям не место на флоте."
  NSB_soviet_paranoia_system_events.33.desc:0 "Из различных военно-морских баз поступили донесения о небольшом увеличении запросов на запасные части для срочного ремонта некоторых наших кораблей. Хотя в донесениях утверждается, что эти повреждения были получены в результате естественного износа и учебных упражнений, НКВД не так в этом уверен. [Root.GetLeader] лично заинтересовался этим вопросом и требует проведения тщательного расследования любых заявлений о саботаже."
  NSB_soviet_paranoia_system_events.38.t:0 "Большая чистка среди младших офицеров ВМФ"
  NSB_soviet_paranoia_system_events.38.desc:0 "В связи с отчётами политработников о нехарактерных действиях во флоте НКВД начато масштабное расследование, в ходе которого были обнаружены доказательства существования многочисленной сети офицеров, резко критикующих и даже враждебно настроенных к советской власти. Хотя большинство из них заявляет о своей преданности [Root.GetLeader] и Советскому Союзу, очевидно, что они могут быть легко превращены в агентов иностранных спецслужб. Действительно, на допросах выяснилось, что несколько из них уже работали на капиталистические страны, передавая им информацию о нас, и они быстро называют всё больше новых имён."
  NSB_soviet_paranoia_system_events.39.t:0 "Большая чистка — суд над адмиралами"
  NSB_soviet_paranoia_system_events.39.desc:0 "Расследование троцкистского центра в армии наглядно показало, что он особенно хорошо обосновался в ВМФ. Подавляющее большинство, если не все адмиралы флота, вызывают глубокие подозрения, так как во время зарубежных командировок у них была возможность вступать в сговор с иностранными элементами. До настоящего момента все высокопоставленные адмиралы, арестованные НКВД, после нескольких дней допроса признавались в совершении очень тяжких преступлений, включая шпионаж и саботаж. В связи с тем, что в этом заговоре участвовало всё больше офицеров ВМФ, становится ясно, что для его ликвидации потребуется очень тщательное расследование."
  NSB_soviet_paranoia_system_events.42.desc:0 "Недавняя проверка ВВС выявила шокирующую серию катастроф и несчастных случаев во время учений. Кроме того, значительное число наших новейших самолётов не полностью боеспособно и ожидает ремонта. Неясно, как могло произойти такое положение дел, но [Root.GetLeader], обеспокоенный саботажем, потребовал полного расследования."
  NSB_soviet_paranoia_system_events.48.t:0 "Распустить конструкторское бюро"
  NSB_soviet_paranoia_system_events.48.desc:0 "НКВД обнаружило доказательства того, что члены руководства одного из наших конструкторских бюро передают информацию иностранным спецслужбам. Более того, их недавние конструкторские разработки были настолько ошибочны, что прототип нуждался в обширной переработке и модернизации для возможности летать, что вызвало подозрения в саботаже. В настоящее время НКВД допрашивает конструкторов и инженеров, и ведущий следователь уверен, что в течение нескольких дней у него будут признания."
  NSB_soviet_paranoia_system_events.48.a:0 "Мы не можем допустить скопления подрывных элементов таким образом."
  NSB_soviet_paranoia_system_events.48.b:0 "Их работа слишком важна."
  NSB_soviet_paranoia_system_events.49.t:0 "Причастность генералов ВВС"
  NSB_soviet_paranoia_system_events.49.desc:0 "Усиленное наблюдение за ВВС дало свои плоды. Следователи НКВД сумели получить признания от ряда младших офицеров, указывающих на высокопоставленных генералов, которые приказали провести повторные учебные вылеты в плохую погоду, что привело к предсказуемым сбоям и повышенному обслуживанию, снизив общую готовность ВВС. Пока неясно, почему они так поступили, но следователи НКВД считают, что через несколько дней у них будут ответы."
  NSB_soviet_paranoia_system_events.49.a:0 "Их следует призвать к ответственности."
  NSB_soviet_paranoia_system_events.49.b:0 "Они просто выполняли свою работу."
  NSB_soviet_paranoia_system_events.24_paranoia_accused_increase_tt:0 "£SOV_paranoia_text_icon Политическая паранойя усиливается на основе уровня уволенного командира: §R[?SOV.SOV_accused_unit_leader_level]§!"
  NSB_soviet_paranoia_system_events.24_paranoia_accused_decrease_tt:0 "£SOV_paranoia_text_icon Политическая паранойя уменьшается на основе уровня уволенного командира: §G[?SOV.SOV_accused_unit_leader_level]§!"
  NSB_soviet_paranoia_system_events.24_paranoia_both_increase_tt:0 "£SOV_paranoia_text_icon Политическая паранойя усиливается на основе уровня не уволенных командиров: §R[?SOV.SOV_combined_unit_leader_level]§!"
  NSB_soviet_paranoia_system_events.24_paranoia_both_decrease_tt:0 "£SOV_paranoia_text_icon Уровень политической паранойи снизится пропорционально рангам командующих, подлежащих чистке: §G[?SOV.SOV_combined_unit_leader_level]§!"
  SOV_purge_event_not_enough_pp_to_avoid_regular_tt:0 "\nЭту чистку нельзя избежать, так как к моменту срабатывания данного события в запасе должно быть £GFX_pol_power §Y$POLITICAL_POWER$§!"
  SOV_purge_event_not_enough_pp_to_avoid_great_tt:0 "\nЭту масштабную чистку нельзя перенаправить, так как к моменту срабатывания данного события в запасе должно быть £GFX_pol_power §Y$POLITICAL_POWER$§!"
  SOV_purge_event_unavoidable_purge_great_tt:0 "\nЭту масштабную чистку нельзя перенаправить."
  SOV_moscow_trial_real_name:0 "[GetMoscowTrialIndex] московский процесс"
  SOV_moscow_trial_index_1:0 "Первый"
  SOV_moscow_trial_index_2:0 "Второй"
  SOV_moscow_trial_index_3:0 "Третий"
  SOV_moscow_trial_generic_name:0 "Великая чистка в системе управления"
  SOV_retire_purged_character_tt:0 "Вывести в отставку §Y[?ROOT.SOV_purged_character_for_loc.GetName]§! из состава §Y[ROOT.GetName]§!."
  SOV_retire_accused_character_tt:0 "Вывести в отставку §Y[?ROOT.SOV_accused_character_for_loc.GetName]§! из состава §Y[ROOT.GetName]§!."
  SOV_retire_accuser_character_tt:0 "Вывести в отставку §Y[?ROOT.SOV_accuser_character_for_loc.GetName]§! из состава §Y[ROOT.GetName]§!."
  SOV_characters_will_be_purged_tt:0 "§RБудут проведены чистки с целью удаления из игры следующих персонажей:§!"
  NSB_soviet_five_year_plan.01.t:0 "Срыв третьей пятилетки"
  NSB_soviet_five_year_plan.01.desc:0 "На текущий момент из-за атак на нашу родину становится очевидным, что наши предыдущие планы экономического роста более не выполнимы. Мы сможем вернуться к ним, когда будет восстановлен мир, а пока мы должны сосредоточиться на военном производстве."
  NSB_soviet_five_year_plan.01.a:0 "Будь они прокляты!"
  NSB_soviet_five_year_plan_tt:0 "Любой производственный фокус, связанный с §Y$SOV_third_five_year_plan$§! больше недоступен."
  NSB_soviet_great_patriotic_war.01.t:0 "Николай Иванович Кузнецов просит назначения"
  NSB_soviet_great_patriotic_war.01.desc:0 "После [?ROOT.SOV_invader_of_ukraine.GetAdjective] вторжения в Украину Николай Кузнецов официально запросил присоединения к НКВД для защиты родины. С его уникальным набором талантов он станет отличным подспорьем в организации партизанских операций в этом районе."
  NSB_soviet_great_patriotic_war.01.a:0 "Добро пожаловать на борт, товарищ!"
  NSB_soviet_propaganda_capmaign_events.1.t:0 "Юные строители коммунизма"
  NSB_soviet_propaganda_capmaign_events.1.desc:0 "Наши друзья и наставники в [SOV.GetNameDef] начали программу, которая нацелена на то, что новое поколение, которое сейчас растет, в полной мере понимало, что от него ожидают. Хороший коммунист должен быть как физически крепким, чтобы выполнять необходимую для создания лучшего мира работу, так и хорошо образованным, чтобы понимать, что следует делать. Молодежь нашей страны с энтузиазмом подхватила это начинание и старается следовать ему, насколько это возможно."
  NSB_soviet_propaganda_capmaign_events.1.a:0 "Они построят собственное, более светлое будущее."
  NSB_soviet_propaganda_capmaign_events.2.t:0 "Обещание мира нарушено"
  NSB_soviet_propaganda_capmaign_events.2.desc:0 "Наше решение предпринять упреждающие действия для обеспечения нашей постоянной безопасности поставило нас в неловкое положение в отношении некоторых заявлений, сделанных нами в последнее время. Хотя большинство людей не оспаривает ситуацию слишком открыто, наша секретная полиция сообщает, что многие в частном порядке спрашивают, почему мы пообещали мир, когда мы явно готовились к войне. \n\nНикто не осмеливается называть то, что мы сделали ложью, но очевидно, что мы потеряли большое доверие со стороны населения в целом."
  NSB_soviet_propaganda_capmaign_events.2.a:0 "Время очень неудачное."
  NSB_soviet_propaganda_capmaign_events.3.desc:0 "Начало войны поставило нашу позицию перед общественностью в несколько затруднительное положение. Хотя большинство согласны с тем, что мы пострадавшая сторона, и общественный гнев по праву сосредоточен на захватчиках, многие в частном порядке задаются вопросом, почему [THIS.GetLeader] не предвидел это нападение. Наши доклады секретной полиции показывают, что в нескольких случаях люди пошли еще дальше и назвали [THIS.GetLeader] "либо опасно наивным, либо преступно некомпетентным"."
  NSB_soviet_propaganda_capmaign_events.3.a:0 "Но мы никогда не хотели этой войны!"
  NSB_soviet_foreign_politics_events.1.t:1 "Давление [FROM.GetAdjective] на правительство"
  NSB_soviet_foreign_politics_events.1.desc:0 "[FROM.GetAdjective] министр иностранных дел прибыл в столицу для срочных консультаций с [THIS.GetLeader]. [FROM.GetAdjective] делегация прибыла с длинным списком нерешенных вопросов — от пограничной безопасности до ряда нелестных изображений [FROM.GetLeader] в местной прессе. В пресс-релизе министр иностранных дел подчеркнул важность сотрудничества и мирного взаимодействия, но отметил, что [FROM.GetLeader] "будет трудно принять враждебное или недружественное [THIS.GetNameDef]".
  NSB_soviet_foreign_politics_events.1.a:0 "Мы готовы присоединиться к их фракции, если сможем сохранить нашу конституцию."
  NSB_soviet_foreign_politics_events.1.b:0 "Мы должны привести наше правительство в соответствие с их правительством."
  NSB_soviet_foreign_politics_events.1.c:0 "Мы не отступим ни на дюйм."
  NSB_soviet_foreign_politics_events.2.t:2 "[FROM.GetAdjective]-спонсируемые митинги в столице"
  NSB_soviet_foreign_politics_events.2.desc:1 "На этой неделе в столице ряд политических групп объявили о проведении митингов. Кажется, у них нет конкретных претензий, которые они хотят озвучить, кроме общего ощущения, что мы должны попытаться улучшить наши отношения с [FROM.GetNameDef] и отстранить от власти всех политиков, критикующих правительство [FROM.GetAdjective].\n\nХотя возможно, что эти демонстрации являются просто спонтанными проявлениями общественного мнения, по крайней мере примечательно, что ряд ключевых организаторов недавно побывали в [FROM.GetCapitalVictoryPointName] и, по-видимому, начали агитацию за это по возвращении."
  NSB_soviet_foreign_politics_events.2.a:0 "Что ж, это, конечно, их право."
  NSB_soviet_foreign_politics_events.2.b:0 "Вызвать полицию, чтобы разбить пару голов!"
  NSB_soviet_foreign_politics_events.10.t:1 "[FROM.GetNameDefCap] хочет инвестировать в нашу экономику"
  NSB_soviet_foreign_politics_events.10.desc:0 "Правительство $OVERLORDADJ$ запустило масштабную программу инвестиций в экономику. В рамках этой программы они выделили средства на строительство сети мостов, тоннелей и дорог в столице и за ее пределами. Соответствующее увеличение мощностей для нашей строительной отрасли, несомненно, продолжит приносить дивиденды в будущем.\n\nОднако некоторые люди в правительстве опасаются, что привлечение инженеров и финансирования $OVERLORDADJ$ лишь сделает нас более зависимыми от их опыта в будущем."
  NSB_soviet_foreign_politics_events.10.a:0 "Спасибо, товарищи!"
  NSB_soviet_foreign_politics_events.10.b:0 "Это только увеличит нашу зависимость от $OVERLORDADJ"
  NSB_soviet_foreign_politics_events.11.t:1 "Правительство $OVERLORDADJ$ требует военных мер"
  NSB_soviet_foreign_politics_events.11.desc:0 "Поскольку война становится все более вероятной, правительство $OVERLORDADJ$ начало оказывать давление на нас, чтобы мы улучшили свои боевые возможности. Они хотят, чтобы мы резко увеличили наши резервы живой силы, сократив при этом время обучения, чтобы сделать больше дивизий доступными для выполнения боевых задач и освободить дивизии $OVERLORDADJ."
  NSB_soviet_foreign_politics_events.11.a:0 "Они, конечно, правы."
  NSB_soviet_foreign_politics_events.11.b:0 "Мы сами решим, как лучше защищаться."
  NSB_soviet_foreign_politics_events.12.t:1 "[FROM.GetNameDefCap] хочет расширить пограничные укрепления"
  NSB_soviet_foreign_politics_events.12.desc:0 "Отмечая растущую угрозу со стороны [JAP.GetNameDef], [FROM.GetAdjective] правительство настоятельно предложило нам немедленно начать укрепление нашей границы с [JAP.GetNameDef]. Они обещали материально-техническую и логистическую поддержку для этого, чтобы уменьшить обязательства по рабочей силе, которые они должны взять на себя для нашей обороны."
  NSB_soviet_foreign_politics_events.12.a:0 "Мы приветствуем эту инициативу."
  NSB_soviet_foreign_politics_events.12.b:0 "Это будет ненужной эскалацией."
  NSB_soviet_foreign_politics_events.13.t:0 "[FROM.GetNameDef] отклоняет [ROOT.GetAdjective] рекомендации"
  NSB_soviet_foreign_politics_events.13.desc:0 "Неожиданно, [FROM.GetAdjective] правительство отклонило наши рекомендации и отказалось следовать планам, представленным нашими официальными лицами. Почти кажется, что у [FROM.GetLeader] были враждебные намерения по отношению к [ROOT.GetNameDef]..."
  NSB_soviet_foreign_politics_events.13.a:0 "Серьезно, что не так с [FROM.GetLeader]?"
  NSB_soviet_foreign_politics_events.20.t:1 "[FROM.GetNameDefCap] направляет военных советников"
  NSB_soviet_foreign_politics_events.20.desc:0 "Чтобы поддержать нашу отчаянную борьбу за сохранение демократии, [FROM.GetLeader] направил группу [FROM.GetAdjective] военных советников. Приобретя богатый опыт в различных конфликтах, они, несомненно, окажутся очень ценными в восстановлении нашей армии. С помощью своего оборудования и тактики они также смогут встретить на поле боя так называемые дивизии добровольцев различных фашистских держав."
  NSB_soviet_foreign_politics_events.20.a:0 "Стоим плечом к плечу!"
  NSB_soviet_foreign_politics_events.30.t:1 "[FROM.GetNameDefCap] требует вернуть Аляску"
  NSB_soviet_foreign_politics_events.30.desc:0 "Несколько недель назад [FROM.GetAdjective] пропаганда и [FROM.GetAdjective] прочие подконтрольные СМИ начали ясное и согласованное продвижение вопроса возврата Аляски на повестку дня. В принципе, они утверждают, что покупка Аляски в 1867 году была либо мошеннической, либо совершенной под принуждением. Кроме того, они заявляют, что жители Аляски, как коренные, так и переселенцы, однозначно были бы в лучшем положении в качестве граждан [FROM.GetNameDef].\n\nСегодня [FROM.GetAdjective] посол вручил официальную ноту, в которой заявил, что так называемое "Правительство Автономной республики Аляска в изгнании" официально запросило присоединение к [FROM.GetNameDef], и что [FROM.GetLeader] одобрил их запрос. По его словам, осталось только договориться о деталях передачи власти."
  NSB_soviet_foreign_politics_events.30.a:0 "Пусть забирают эту замороженную пустошь."
  NSB_soviet_foreign_politics_events.30.b:0 "Это действительно очень хорошая шутка."
  NSB_soviet_foreign_politics_events.31.t:0 "Аляска возвращена"
  NSB_soviet_foreign_politics_events.31.desc:0 "На официальной церемонии в форте Ситка [FROM.GetNameDef] передала суверенитет над Аляской обратно нам. Хотя большинство жителей Аляски, похоже, испытывают смешанные чувства по поводу этого перехода, население дома празднует."
  NSB_soviet_foreign_politics_events.31.a:0 "Ещё одна ошибка царей искоренена."
  NSB_soviet_foreign_politics_events.32.t:0 "[FROM.GetNameDefCap] отказывает"
  NSB_soviet_foreign_politics_events.32.desc:0 "Государственный секретарь [FROM.GetAdjective] не удосужился ответить на наши требования лично. Вместо этого в наше посольство было доставлено письмо, подписанное заместителем министра по культурному развитию, в котором говорилось, что, хотя они уважают наши амбиции, когда дело доходит до написания полной исторической фантастики, они были бы признательны, если бы мы не использовали для этого официальные каналы."
  NSB_soviet_foreign_politics_events.32.a:0 "О, они думали, что мы блефуем?"
  NSB_soviet_foreign_politics_events.32.b:0 "Меньше всего нам сейчас нужна ещё и замёрзшая земля."
  NSB_soviet_foreign_politics_events.150.t:0 "[FROM.GetNameDefCap] подчиняется"
  NSB_soviet_foreign_politics_events.150.desc:0 "После заседания кабинета министров, продлившегося до раннего утра, [FROM.GetLeader] официально принял наши требования. Наш посол в [FROM.GetNameDef] проследит за тем, чтобы правительство [FROM.GetAdjective] тесно координировало с нами любые вопросы внутренней и внешней политики."
  NSB_soviet_foreign_politics_events.150.a:0 "Очень мудро."
  NSB_soviet_foreign_politics_events.151.t:0 "[FROM.GetNameDefCap] присоединяется к нашей фракции"
  NSB_soviet_foreign_politics_events.151.desc:0 "После того, как переговоры в правительстве [FROM.GetAdjective] зашли в тупик, [FROM.GetLeader] предложил компромиссное решение: они готовы принять [THIS.GetAdjective] войска на [FROM.GetAdjective] территории, но они не допустят какого-либо вмешательства в свою систему правления.\n\nКроме того, [FROM.GetAdjective] армия останется активной, укомплектованной [FROM.GetAdjective] офицерами и рядовыми, и отвечающей только перед правительством [FROM.GetAdjective]. Тем не менее, [FROM.GetLeader] готов обсудить планы взаимной обороны."
  NSB_soviet_foreign_politics_events.151.a:0 "По крайней мере, они будут сражаться на правильной стороне."
  NSB_soviet_foreign_politics_events.152.t:0 "[FROM.GetNameDefCap] отказывается"
  NSB_soviet_foreign_politics_events.152.desc:0 "Наши попытки решить наши нерешенные проблемы с [FROM.GetNameDef] дипломатическим путем, похоже, провалились. Когда наш посол вызвал [FROM.GetLeader] на очередной раунд переговоров, ему грубо ответили, что [FROM.GetAdjective] изложили свою позицию, и что больше не о чем говорить."
  NSB_soviet_foreign_politics_events.152.a:0 "Они выбрали худшую участь."
  NSB_soviet_foreign_politics_events.152.b:0 "Пока мы не станем давить на них сильнее..."
  NSB_soviet_foreign_politics_events.152.c:0 "Готовьте вторжение в [FROM.GetNameDef]!"
  NSB_soviet_foreign_politics_events.152.d:0 "Мы должны подготовить совместное вторжение с [ENG.GetAdjective]"
  NSB_soviet_foreign_politics_events.153.t:0 "Англо-[SOV.GetAdjective] Вторжение в Иран"
  NSB_soviet_foreign_politics_events.153.desc:0 "Мы получили дипломатическую ноту от [FROM.GetNameDef], предлагающую совместную военную операцию против [PER.GetNameDef]. Командование [FROM.GetAdjective] утверждает, что эта операция позволит нам обезопасить иранские нефтяные месторождения и наши линии снабжения в [FROM.GetNameDef], а также предотвратит потенциальное продвижение врага из [TUR.GetNameDef] через [PER.GetName] к нефтяным месторождениям Баку и [RAJ.GetNameDef]."
  NSB_soviet_foreign_politics_events.153.a:0 "Мы должны обезопасить Персидский коридор!"
  NSB_soviet_foreign_politics_events.153.b:0 "Мы будем уважать независимость [PER.GetAdjective]."
  NSB_soviet_foreign_politics_events.153_soviets_alone_tt:0 "[FROM.GetAdjective] придется иметь дело с [PER.GetNameDef] самим."
  NSB_soviet_foreign_politics_events.154.t:0 "Англо-[SOV.GetAdjective] вторжение в Иран"
  NSB_soviet_foreign_politics_events.154.desc:0 "Посол [FROM.GetAdjective] передал ноту, согласно которой [FROM.GetNameDef] согласен на организацию и проведение совместной военной операции против [PER.GetNameDef]. Командования [ROOT.GetAdjective] и [FROM.GetAdjective] уверены, что это будет быстрая и эффективная операция против численно уступающего и технологически отсталого врага, что позволит обеспечить безопасность иранских месторождений и линий снабжения [FROM.GetAdjective] в [ROOT.GetNameDef], а также предотвратит потенциальное наступление противника из [TUR.GetNameDef] через [PER.GetName] к месторождениям Баку и [RAJ.GetNameDef]."
  NSB_soviet_foreign_politics_events.154.a:0 "Начать подготовку!"
  NSB_soviet_foreign_politics_events.155.t:0 "Правительство [FROM.GetAdjective] отказалось"
  NSB_soviet_foreign_politics_events.155.desc:0 "После нескольких изнурительных встреч дипломатов [ROOT.GetAdjective] и [FROM.GetAdjective], [FROM.GetNameDef] решил не участвовать в наших планах в отношении [PER.GetNameDef]. [FROM.GetLeader] даже посмел предположить, что это предложение было лишь попыткой оправдать наши территориальные амбиции. \nПохоже, придется иметь дело с [PER.GetNameDef] самим."
  NSB_soviet_foreign_politics_events.155.a:0 "Всегда так ненадежны..."
  NSB_soviet_foreign_politics_events.200.t:0 "[FROM.GetNameDefCap] предъявляет требования"
  NSB_soviet_foreign_politics_events.158.t:0 "Новое правительство [FROM.GetAdjective]"
  NSB_soviet_foreign_politics_events.158.desc:1 "После неудачных переговоров с нашими послами и под сильным давлением со стороны СМИ и населения бывший лидер правительства [FROM.GetAdjective] решил уйти в отставку со своего поста и провести новые выборы. Как и ожидалось, эти выборы выиграла партия, гораздо более близкая к нашим интересам, [FROM.GetRulingParty], во главе с [FROM.GetLeader]."
  NSB_soviet_foreign_politics_events.158.a:0 "наконец-то мы можем рассчитывать на большее сотрудничество со стороны [FROM.GetNameDef]."
  NSB_soviet_foreign_politics_events.200.desc:1 "Посол [FROM.GetAdjective] передал ноту, требующую немедленных консультаций с [THIS.GetLeader]. Согласно ноте, правительство [FROM.GetAdjective] больше не готово терпеть "неопределенную ситуацию с безопасностью" в нашей стране. Непонятно, к чему это относится, но очевидно, что нам фактически даны три варианта: согласиться на размещение войск [FROM.GetAdjective] на нашей территории; заменить наше правительство на правительство, более соответствующее нуждам [FROM.GetNameDef], или возможная военная атака со стороны [FROM.GetNameDef]."
  NSB_soviet_foreign_politics_events.200.a:0 "У нас нет выбора."
  NSB_soviet_foreign_politics_events.200.b:0 "Может, мы пойдем на компромисс?"
  NSB_soviet_foreign_politics_events.200.c:0 "Мы будем бороться за нашу свободу!"
  NSB_soviet_foreign_politics_events.210.t:0 "Давление от [FROM.GetNameDef]"
  NSB_soviet_foreign_politics_events.210.desc:0 "По всей видимости, правительство [FROM.GetAdjective] становится все более обеспокоенным нашей дипломатической ситуацией. За прошедшую неделю посол [FROM.GetAdjective] встречался с [THIS.GetLeader] не менее шести раз и практически выдвинул ультиматум во время последнего раунда переговоров.\n\nЛибо мы присоединимся к [FROM.GetNameDef] в оборонительном пакте и примем "определенный уровень консультаций по внутренним делам", либо [FROM.GetNameDef], вероятно, прибегнет к военному вмешательству в нашу страну."
  NSB_soviet_foreign_politics_events.210.a:0 "Сопротивляться будет бесполезно."
  NSB_soviet_foreign_politics_events.210.c:0 "Пусть только сунутся!"
  NSB_soviet_foreign_politics_events.211.t:0 "Предложение Хакимова"
  NSB_soviet_foreign_politics_events.211.desc:0 "Советский генеральный консул Карим Хакимов удваивает усилия по развитию более теплых советско-арабских отношений. Советский мусульманин татарского происхождения, Хакимов заслужил уважение и дружбу Ибн Сауда, когда в феврале 1926 года доставил ему официальное письмо, в котором признавал его королем Хиджаза и султаном Неджда. С тех пор этот человек был главным вдохновителем советско-арабских отношений. Настоящий советский Лоуренс Аравийский."
  NSB_soviet_foreign_politics_events.211.a:0 "Предложение Хакимова может быть дружественным, но мы должны быть бдительны по отношению к советским амбициям."
  NSB_soviet_foreign_politics_events.250.t:0 "[FROM.GetNameDefCap] отправляет военную помощь"
  NSB_soviet_foreign_politics_events.250.desc:0 "В наши линии прибыл конвой [FROM.GetAdjective], перевозящий груз винтовок и других припасов. Неизвестно, когда следующий конвой сможет осуществить прорыв, поэтому нам придется заставить его продержаться дольше."
  NSB_soviet_foreign_politics_events.251.t:0 "[FROM.GetNameDefCap] готовится к войне с [JAP.GetNameDef]"
  NSB_soviet_foreign_politics_events.251.desc:0 "Видимо, [FROM.GetLeader] пришёл к выводу, что война с [JAP.GetNameDef] неизбежна и, вероятно, начнётся в ближайшем будущем. В связи с этим, [FROM.GetAdjective] представитель в нашей столице настоятельно просит нас привести в боевую готовность пограничные силы и мобилизовать армию в преддверии неизбежного [JAP.GetAdjective] нападения."
  NSB_soviet_foreign_politics_events.251.a:0 "Мы будем готовы."
  NSB_soviet_foreign_politics_events.252.t:0 "Война с [JAP.GetNameDef]"
  NSB_soviet_foreign_politics_events.252.desc:0 "Давно ожидаемая война с [JAP.GetNameDef] началась. Ранее сегодня [FROM.GetAdjective] войска начали атаковать [JAP.GetAdjective] позиции по всему Китаю, и теперь настало время присоединиться к ним. Плечом к плечу с нашими [FROM.GetAdjective] союзниками мы выгоним [JAP.GetAdjective] войска с наших земель!"
  NSB_soviet_foreign_politics_events.252.a:0 "Настал день расплаты!"
  NSB_soviet_foreign_politics_events.260.t:0 "[FROM.GetNameDefCap] предлагает мир"
  NSB_soviet_foreign_politics_events.260.desc:0 "Захватив Курилы и Южный Сахалин, [FROM.GetAdjective] командующий предложил прекратить огонь на текущих рубежах в преддверии мирного договора. Само собой разумеется, что этот мирный договор, скорее всего, признает как минимум северные острова в качестве новых границ, фактически передав Курилы и Южный Сахалин [FROM.GetNameDef]."
  NSB_soviet_foreign_politics_events.260.a:0 "Больно, но терпимо."
  NSB_soviet_foreign_politics_events.260.b:0 "Война еще может обернуться в нашу пользу."
  NSB_soviet_foreign_politics_events.261.desc:1 "Овладев Курилами и Южным Сахалином, а также высадившись на Хоккайдо, [FROM.GetAdjective] командующий предложил прекратить огонь на текущих рубежах в рамках подготовки к мирному договору. Вероятно, этот мирный договор признает право собственности [FROM.GetAdjective] на Курилы и Сахалин и передаст Хоккайдо под управление [FROM.GetAdjective]."
  NSB_soviet_foreign_politics_events.262.b:0 "Какое нелепое предложение!"
  NSB_soviet_foreign_politics_events.263.t:0 "[FROM.GetNameDefCap] предлагает Альянс"
  NSB_soviet_foreign_politics_events.263.desc:0 "Посланник от [FROM.GetLeader] явился к нам с дерзким предложением – [FROM.GetAdjective] правительство желает заключить с нами договор о союзе! Хотя подробности ещё должны быть отработаны, ясно, что этот союз будет прежде всего направлен на сокращение или устранение влияния [USA.GetNameDef] в Тихом океане. Одним махом он устранит величайшую угрозу нашему положению в Китае, а также высвободит множество сил, которые можно будет задействовать в другом месте.\n\nНесмотря на то, что большинство офицеров Военно-морского флота воодушевлены этой перспективой, многие офицеры Армии глубоко не доверяют предложению, опасаясь, что [FROM.GetNameDef] ударит нам в спину, как только мы отвернёмся."
  NSB_soviet_foreign_politics_events.263.a:0 "Это существенно изменит баланс сил."
  NSB_soviet_foreign_politics_events.263.b:0 "Мы не можем верить, что они сдержат своё слово."
  NSB_soviet_foreign_politics_events.264.t:0 "[FROM.GetNameDef] принимает наши условия мира"
  NSB_soviet_foreign_politics_events.264.desc:0 "После [GetAppropriateSovietProgressInJapan] [FROM.GetLeader] принял наше мирное предложение, выполнив наши территориальные требования в обмен на немедленное прекращение военных действий между нашими странами.\nТеперь они передадут региональные администрации [537.GetName], [555.GetName] и [536.GetName] [ROOT.GetNameDef]."
  NSB_soviet_foreign_politics_events.264.desc_default:0 "[ROOT.GetAdjective] оккупация [FROM.GetAdjective] Северных островов [GetAppropriateRedArmyNsName],"
  NSB_soviet_foreign_politics_events.264.desc_hokkaido:0 "продвижение [GetAppropriateRedArmyNsName] на [FROM.GetAdjective] северных территориях, включая [536.GetName],"
  NSB_soviet_foreign_politics_events.264.a:0 "Мудрое решение от [FROM.GetLeader]."
  NSB_soviet_foreign_politics_events.265.t:0 "[FROM.GetNameDef] отвергает наши мирные условия"
  NSB_soviet_foreign_politics_events.265.desc:0 "[From.GetNameDef] отклонил наше предложение о мире, поклявшись продолжать борьбу, пока [ROOT.GetAdjective] оккупация [FROM.GetAdjective] территорий не будет ликвидирована, а война не будет перенесена на нашу территорию."
  NSB_soviet_foreign_politics_events.265.a:0 "Разве [FROM.GetLeader] не видит, чем это закончится для его страны?"
  NSB_soviet_foreign_politics_events.266.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Пакт о дружбе"
  NSB_soviet_foreign_politics_events.266.desc:0 "[FROM.GetAdjective] правительство удовлетворено нашим примирительным отношением и приняло наше предложение. \nВсего несколько часов назад дипломаты [FROM.GetAdjective] и [ROOT.GetAdjective] подписали Пакт о ненападении, который, по словам посла [FROM.GetAdjective], может открыть новую эру сотрудничества на Востоке."
  NSB_soviet_foreign_politics_events.266.a:0 "Наши компромиссы окупятся в будущем."
  NSB_soviet_foreign_politics_events.267.t:0 "[FROM.GetNameDef] отвергает наше предложение о военном союзе"
  NSB_soviet_foreign_politics_events.267.desc:0 "Правительство [FROM.GetAdjective] не впечатлило наше предложение о примирении и решительно отвергло его.\nПо всей видимости, следует быть начеку в связи с амбициями [FROM.GetLeader] на Дальнем Востоке..."
  NSB_soviet_foreign_politics_events.267.a:0 "Нам придётся скорректировать наши планы..."
  NSB_soviet_foreign_politics_events.268.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] союз против [USA.GetNameDef]"
  NSB_soviet_foreign_politics_events.268.desc:0 "Правительство [FROM.GetAdjective] проявило неподдельный интерес к нашему предложению о пакте о наступлении против [USA.GetNameDef]. Дипломаты [FROM.GetLeader] только что подписали представленное им соглашение. Вооружённые силы [FROM.GetAdjective] в настоящий момент перестраиваются в соответствии с новыми реалиями. Их высшее командование уверено, что вместе мы одержим победу над [USA.GetNameDef] и раз и навсегда покончим с их влиянием на международной арене."
  NSB_soviet_foreign_politics_events.268.a:0 "Мы обуздаем [USA.GetAdjective] империализм!"
  NSB_soviet_foreign_politics_events.269.t:0 "[FROM.GetNameDef] отвергает наше предложение о наступательном пакте"
  NSB_soviet_foreign_politics_events.269.desc:0 "Правительство [FROM.GetAdjective] отклонило наше предложение. Судя по всему, [FROM.GetLeader] не заинтересован в предлагаемом нами договоре о присоединении к силам [ROOT.GetAdjective] и [FROM.GetAdjective] в рамках наступательного пакта против [USA.GetNameDef]."
  NSB_soviet_foreign_politics_events.269.a:0 "Очень жаль..."


  SOV_decision_will_be_locked_tt:0 "\nРешение больше не будет доступно. Мы можем только один раз послать ультиматум стране."
  SOV_decision_will_remain_available_tt:0 "\nРешение останется доступным."

  NSB_soviet_foreign_politics_events.270.t:1 "Строительство Транскаспийской железной дороги в [FROM.GetAdjective]"
  NSB_soviet_foreign_politics_events.270.desc:1 "Российская Транскаспийская железнодорожная ветка проходит через Центральную Азию и заканчивается на востоке в Ташкенте. Правительство [FROM.GetAdjective] планирует расширить линию и направило нам предложение о ее соединении со столицей для налаживания торговых отношений. По всей видимости, чиновники из [FROM.GetAdjective] заинтересованы в выходе на рынок Синьцзяна и заявляют, что это может стать первым шагом на взаимовыгодном пути развития и обмена."
  NSB_soviet_foreign_politics_events.270.a:1 "Мы поддерживаем эту инициативу!"
  NSB_soviet_foreign_politics_events.270.b:1 "Торговцам из [SOV.GetAdjective] нет места в нашей стране."
  NSB_soviet_foreign_politics_events.271.t:0 "[FROM.GetNameDefCap] соглашается с нашим предложением"
  NSB_soviet_foreign_politics_events.271.desc:1 "[SIK.GetAdjective] консул, расположенный в Семипалатинске, связался с нашими дипломатами, чтобы сообщить, что [SIK.GetAdjective] правительство с готовностью принимает [ROOT.GetAdjective] инициативу по расширению Транскаспийской линии, соединив ее с Урумчи. Он также заявил, что провинциальное правительство [SIK.GetNameDef] открыто для развития новых экономических и дипломатических отношений с нашей страной."
  NSB_soviet_foreign_politics_events.271.a:1 "Двери открыты для нового экономического рынка!"
  NSB_soviet_foreign_politics_events.272.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
  NSB_soviet_foreign_politics_events.272.desc:1 "[SIK.GetAdjective] консул, расположенный в Семипалатинске, связался с нашими дипломатами, чтобы сообщить, что [SIK.GetAdjective] правительство решило отклонить [ROOT.GetAdjective] инициативу по расширению Транскаспийской линии и соединению с ней [SIK.GetAdjective] столицы Урумчи."
  NSB_soviet_foreign_politics_events.272.a:1 "Это неожиданный и очень печальный поворот событий."
  NSB_soviet_foreign_politics_events.272.b:1 "Они играют с огнем!"
  NSB_soviet_foreign_politics_events.273.t:1 "[FROM.GetAdjective] Разведка полезных ископаемых в [619.GetName]"
  NSB_soviet_foreign_politics_events.273.desc:1 "Представитель [FROM.GetAdjective] в Дихуа прислал нам новое предложение на разведку ресурсов в [619.GetName] и улучшение инфраструктуры региона, чтобы облегчить эксплуатацию. В обмен на это, они просят, чтобы торговым объектам [FROM.GetAdjective] был выплачен долг экспортом товаров, таких как золото и редкие минералы из Алтая."
  NSB_soviet_foreign_politics_events.273.a:1 "Это взаимовыгодное соглашение для обеих сторон."
  NSB_soviet_foreign_politics_events.273.b:1 "Они просто хотят расширить влияние [FROM.GetAdjective] в нашей стране."
  NSB_soviet_foreign_politics_events.274.t:0 "Правительство [FROM.GetNameDefCap] принимает наше предложение"
  NSB_soviet_foreign_politics_events.274.desc:1 "Представитель [ROOT.GetAdjective] в Дихуа получил уведомление от дипломатов [SIK.GetAdjective] о том, что они принимают наше предложение на разведку ресурсов в [619.GetName] и улучшение инфраструктуры региона для облегчения эксплуатации. В обмен на это, торговые объекты [SIK.GetAdjective] получат долг экспортом товаров, таких как золото и редкие минералы из Алтая."
  NSB_soviet_foreign_politics_events.274.a:1 "Это открывает новые торговые возможности!"
  NSB_soviet_foreign_politics_events.275.t:0 "Правительство [FROM.GetNameDefCap] отвергает наше предложение"
  NSB_soviet_foreign_politics_events.275.desc:1 "Представитель в Дихуа от [ROOT.GetAdjective] получил уведомление от дипломатов [SIK.GetAdjective], что их правительство отвергло наше предложение вложить средства в страну. Похоже, [SIK.GetNameDef] больше не заинтересован в развитии торговли, бизнеса и дипломатических отношений с [ROOT.GetNameDef]."
  NSB_soviet_foreign_politics_events.275.a:1 "Глупое решение..."
  NSB_soviet_foreign_politics_events.275.b:1 "Мы не спрашивали у них разрешения."
  NSB_soviet_foreign_politics_events.276.t:1 "Промышленная разведка в [618.GetName] от [FROM.GetAdjective]"
  NSB_soviet_foreign_politics_events.276.desc:1 "Мы получили новое предложение от [FROM.GetAdjective] дипломатов. Судя по всему, [FROM.GetNameDefCap] заинтересован в поиске месторождений минералов и нефти на севере нашей страны и предлагает провести в этом регионе разведку и расширить инфраструктуру в обмен на право разработки ресурсов. Представители [FROM.GetAdjective] утверждают, что эти промышленные инвестиции, несомненно, увеличат добычу золота и серебра в регионе."
  NSB_soviet_foreign_politics_events.276.a:1 "Эти ресурсы нам не нужны. Нам нужно золото!"
  NSB_soviet_foreign_politics_events.276.b:1 "Ресурсы на землях [ROOT.GetAdjective] принадлежат [ROOT.GetName]!"
  NSB_soviet_foreign_politics_events.277.t:0 "$NSB_soviet_foreign_politics_events.274.t$"
  NSB_soviet_foreign_politics_events.277.desc:1 "Дипломаты [ROOT.GetAdjective] в [SIK.GetNameDef] сообщают, что наше предложение о геологоразведке месторождений полезных ископаемых и нефти в северной части [SIK.GetNameDef] принято. Провинциальное правительство [SIK.GetName] хочет расширить инфраструктурные объекты в [618.GetName], что, естественно, повысит эксплуатацию золота и серебра в регионе. Поэтому они согласились уступить нам право на использование любых стратегических ресурсов, которые мы можем найти в [618.GetName], в качестве средств для погашения инвестиций [ROOT.GetAdjective]."
  NSB_soviet_foreign_politics_events.277.a:1 "Они не могли отказаться от такого предложения!"
  NSB_soviet_foreign_politics_events.278.t:0 "Военная помощь [FROM.GetAdjective]"
  NSB_soviet_foreign_politics_events.278.desc:0 "Дипломатам в нашей стране доставлено письмо от посла $OVERLORDADJ$. Наш сосед, судя по всему обеспокоенный военным потенциалом $ROOT$, предлагает провести военную помощь. Помощь будет заключаться в поставках оборудования и инструкторов для переоборудования армии $ROOT$. Мы получим самолеты и оборудование для авиации, винтовки и пулеметы для войск, будут построены артиллерийские заводы и укрепрайоны, а также будут открыты летные школы для подготовки местных летчиков. Взамен $OVERLORDADJ$ планирует снизить барьеры для торговли и увеличить экспорт из $ROOT$ таких товаров, как шерсть, хлопок, пушнина и кожи."
  NSB_soviet_foreign_politics_events.278.a:0 "Это и правда щедрое предложение."
  NSB_soviet_foreign_politics_events.278.b:0 "Мы должны сопротивляться экономической оккупации $OVERLORDADJ$!"
  NSB_soviet_foreign_politics_events.279.t:0 "$OVERLORDADJ$ принимает нашу военную помощь"
  NSB_soviet_foreign_politics_events.279.desc:0 "Наши дипломаты в $SIK$ сообщили, что наше предложение о военной помощи $SIK$ было принято $SIK$. Судя по всему, китайский лидер стремится укрепить свою армию и обороноспособность, и полагает, что с помощью $ROOT$ $SIK$ сможет противостоять враждебным силам на востоке."
  NSB_soviet_foreign_politics_events.279.a:0 "Мудрое решение!"
  NSB_soviet_foreign_politics_events.280.t:0 "Поддержка территориальной экспансии [FROM.GetAdjective]"
  NSB_soviet_foreign_politics_events.280.desc:0 "После нашей территориальной экспансии на восток, правительство [FROM.GetAdjective] проявило интерес в поддержке нашего роста и помощи в строительстве инфраструктуры и укреплении обороны на наших новых территориях. [FROM.GetNameDefCap] также заинтересованы в разработке нефтяных месторождений в [756.GetName], которые, по их мнению, могут сыграть ключевую роль в нашем военном наступлении на восток. \nПравительство [FROM.GetAdjective] вновь просит о дальнейших финансовых льготах для своих торговых организаций на нашем рынке и увеличении экспорта в качестве оплаты."
  NSB_soviet_foreign_politics_events.280.a:0 "Это справедливое предложение."
  NSB_soviet_foreign_politics_events.280.b:0 "Этого достаточно, они нам не нужны!"
  NSB_soviet_foreign_politics_events.281.t:0 "[FROM.GetNameDefCap] принимает нашу помощь"
  NSB_soviet_foreign_politics_events.281.desc:0 "[SIK.GetLeader] принял наше предложение о предоставлении логистической и военной помощи для его территориальной экспансии на восток. Нам будет разрешено строить инфраструктуру и укреплять оборону на его новых территориях, а также разрабатывать нефтяные месторождения в [756.GetName]. Взамен правительство [SIK.GetAdjective] предоставит более выгодные условия для наших торговых организаций на его рынке и увеличит объем экспорта в нашу страну."
  NSB_soviet_foreign_politics_events.281.a:0 "Мы всегда рады помочь!"
  NSB_soviet_foreign_politics_events.282.t:0 "[SOV.GetNameDefCap] требует формализации [ROOT.GetNameDefCap] в составе Советской Республики"
  NSB_soviet_foreign_politics_events.282.desc:0 "Мы получили официальное сообщение от [FROM.GetNameDefCap] с требованием ввести [ROOT.GetNameDefCap] в состав Независимой Советской Социалистической Республики в подчинение правительству [FROM.GetNameDefCap]. Сам [FROM.GetLeaderCap] обещает, что наша нация будет пользоваться определенной автономией и Красная Армия будет готова защищать Синьцзян так же, как если бы это была советская земля. По его словам, это необходимые меры для эффективного сотрудничества между нашими странами в это непростое время. \nУчитывая крупные инвестиции [FROM.GetNameDefCap] в нашу страну и растущее [FROM.GetAdjectiveCap] влияние на нашу экономику, прежде чем давать ответ, следует все тщательно обдумать."
  NSB_soviet_foreign_politics_events.282.a:0 "У нас нет другого выбора."
  NSB_soviet_foreign_politics_events.282.b:0 "Мы должны остановить эту комедию!"
  NSB_soviet_foreign_politics_events.283.t:0 "[SIK.GetNameDefCap]"
  NSB_soviet_foreign_politics_events.283.desc:0 "Мы получили официальное коммюнике от [FROM.GetLeader] о принятии предложения о вхождении китайской провинции Синьцзян в состав независимой Советской Социалистической республики, подчинённой правительству [ROOT.GetNameDef]. Наши масштабные проекты развития в регионе показали [ROOT.GetAdjective] добрую волю в установлении добрых отношений с нашими союзниками и в оказании помощи в нужный момент. Эти действия помогли [FROM.GetLeader] понять, что наши требования являются лишь необходимыми мерами для обеспечения эффективного сотрудничества между нашими странами в эти трудные времена."
  NSB_soviet_foreign_politics_events.283.a:0 "Добро пожаловать в Союз, товарищи!"
  NSB_soviet_foreign_politics_events.284.t:0 "[FROM.GetNameDefCap] отклоняет наши требования"
  NSB_soviet_foreign_politics_events.284.desc:0 "Мы получили официальное коммюнике от [FROM.GetLeader] об отклонении наших требований о вхождении [FROM.GetNameDef] в состав независимой Советской Социалистической республики. Похоже, что крупные инвестиции, которые мы вложили в развитие региона и оказание помощи нашим китайским соседям, ничего не значили для [FROM.GetLeader], который по-прежнему смотрит на [ROOT.GetNameDef] с недоверием."
  NSB_soviet_foreign_politics_events.284.a:0 "Они мешают сотрудничеству между нашими странами."
  NSB_soviet_foreign_politics_events.284.b:0 "Мы не оставим эту обиду безнаказанной!"
  NSB_soviet_foreign_politics_events.285.t:0 "[SOV.GetName] на грани краха"
  NSB_soviet_foreign_politics_events.285.desc:0 "После ужасных потерь в войне, кажется, что падение [SOV.GetNameDef] может быть ближе, чем они хотели бы нам показать. Некоторые члены нашего правительства уверяют, что нашей стране неизбежно угрожает такой поворот событий и предлагают немедленно аннулировать соглашения с [SOV.GetAdjective] и вместо этого начать работать над укреплением отношений с официальными лицами Китая. Они заявляют, что если мы хотим обеспечить безопасность [ROOT.GetNameDef], мы должны сделать все возможное, чтобы найти влиятельных союзников, которые могут поддержать нас, и что [SOV.GetNameDef] вряд ли сможет что-то сделать в качестве ответных мер, учитывая нынешнее положение дел."
  NSB_soviet_foreign_politics_events.285.a:0 "Мы вместе выступаем против наших врагов!"
  NSB_soviet_foreign_politics_events.285.b:0 "Пора поискать новых друзей в другом месте!"
  NSB_soviet_foreign_politics_events.286.t:0 "Синьцзяну угрожают советские потери в войне"
  NSB_soviet_foreign_politics_events.286.desc:0 "Вчера в официальном заявлении [SIK.GetLeader] подтвердил верность Синьцзяна [ROOT.GetNameDef] и его личное желание продолжать сотрудничество между нашими странами. Тем не менее, очевидно, что элементы паникеров в [SIK.GetNameDef] серьезно подорвали имидж [ROOT.GetNameDef], а поддержка [SIK.GetLeader] внутри [SIK.GetRulingParty] сильно пострадала."
  NSB_soviet_foreign_politics_events.286.a:0 "Жалкое положение..."
  NSB_soviet_foreign_politics_events.286.b:0 "Нам нужно разобраться с этими болтливыми предателями!"
  NSB_soviet_foreign_politics_events.287.t:0 "[SIK.GetNameDefCap] выходит из [ROOT.GetFactionName]"
  NSB_soviet_foreign_politics_events.287.desc:0 "Вчера [SIK.GetLeader] в своем официальном заявлении объявил о выходе Синьцзяна из [ROOT.GetFactionName], аннулировав все соглашения с [ROOT.GetAdjective] в одностороннем порядке.\nКак говорилось в его речи, так как [ROOT:GetName] оказался на грани развала, окруженный врагами на востоке и западе, для Синьцзяна самое время укрепить отношения с восточными китайскими соседями и братьями для противостояния иностранным захватчикам."
  NSB_soviet_foreign_politics_events.287.a:0 "Пусть идут! У нас есть более насущные дела."
  NSB_soviet_foreign_politics_events.287.b:0 "Мы должны заставить их заплатить за это!"
  SOV_sinikiang_influence_cg_tt_sik:0 "§Y[SOV.GetFlag][SOV.GetNameDefCap]§! получит бонус §Y-2.0%§! к товарам потребления благодаря этому соглашению."
  SOV_sinikiang_influence_cg_tt_sov:0 "$SOV_modify_fyp_ns_intro$ \nЗаводы товаров потребления: §Y-2.0%§!"
  SOV_sinkiang_when_project_finishes_tt:0 "\nЭффекты после завершения проекта:"
  NSB_soviet_soviet_german_trade_agreement.1.t:0 "Советско-германское торговое соглашение"
  NSB_soviet_soviet_german_trade_agreement.1.desc:0 "Посол [FROM.GetAdjective] связался с нашими дипломатами и предложил заключить торговое соглашение между нашими странами. Согласно предложению, [FROM.GetNameDef] будет поставлять нам сырьё: зерно, хлопок, нефть, руду и каучук. Взамен [FROM.GetAdjective] получат незавершенный крейсер типа \"Хиппер\", чертежи для военных кораблей, тяжёлые военно-морские орудия и образцы самолётов [ROOT.GetAdjective].\nЭто соглашение несомненно поможет нам в войне с враждебными странами Европы, позволив нам избежать [GetTradeAgreementBlockadeWarPeace] блокады."
  NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng:0 "[ENG.GetAdjective]"
  NSB_soviet_soviet_german_trade_agreement.1.desc_war:0 "врага"
  NSB_soviet_soviet_german_trade_agreement.1.desc_peace:0 "потенциального врага"
  NSB_soviet_soviet_german_trade_agreement.1.a:0 "Нам нужны сырьё"
  NSB_soviet_soviet_german_trade_agreement.1.b:0 "Мы не собираемся делиться с ними секретами наших кораблей!"
  NSB_soviet_soviet_german_trade_agreement.2.t:0 "[GER.GetNameDefCap] подписал(а) $NSB_soviet_soviet_german_trade_agreement.1.t$"
  NSB_soviet_soviet_german_trade_agreement.2.desc:0 "[FROM.GetAdjective] дипломаты сообщили нам, что они согласились на наше предложение. Наши страны заключили торговое соглашение, в рамках которого [ROOT.GetNameDef] будет отправлять в [FROM.GetNameDef] сырье, такое как зерно, хлопок, нефть, металлические руды и каучук. Взамен мы получим недостроенный крейсер класса "Хиппер", чертежи для других военных кораблей, тяжелые орудия для ВМФ и образцы [FROM.GetAdjective] самолетов. \nЭто соглашение, несомненно, поможет нам в развитии современных военных технологий."
  NSB_soviet_soviet_german_trade_agreement.2.a:0 "Красный флот выиграет от этого."
  NSB_soviet_soviet_german_trade_agreement.3.t:0 "[GER.GetNameDefCap] отклоняет $NSB_soviet_soviet_german_trade_agreement.1.t$"
  NSB_soviet_soviet_german_trade_agreement.3.desc:0 "После нескольких попыток нашего посла убедить [FROM.GetAdjective] должностных лиц во взаимных выгодах торгового пакта между нашими странами, [FROM.GetAdjective] дипломаты только что сообщили нам, что они не заинтересованы в заключении торгового соглашения с [ROOT.GetNameDef]."
  NSB_soviet_soviet_german_trade_agreement.3.a:0 "Упрямые дураки!"
  NSB_soviet_policies_of_collective_security.1.t:0 "[FROM.GetNameDefCap] предлагает пакт о взаимопомощи"
  NSB_soviet_policies_of_collective_security.1.desc:0 "Отмечая угрозы, с которыми сталкиваются обе наши страны, правительство [FROM.GetAdjective] предложило пакт о взаимопомощи. В соответствии с его условиями мы не будем предпринимать никаких враждебных действий друг против друга.\n\nНеотъемлемой проблемой является то, что между нашими странами находится [POL.GetNonIdeologyName]. Любая попытка любой из сторон прийти на помощь другой обязательно пройдет через Польшу. Некоторые члены дипломатической службы твердо верят, что мы должны включить Польшу в этот пакт, чтобы гарантировать, что мы сможем напрямую поддерживать друг друга."
  NSB_soviet_policies_of_collective_security.1.a:0 "Мы согласимся с первоначальными условиями."
  NSB_soviet_policies_of_collective_security.1.b:0 "Нам следует обратиться к Польше."
  NSB_soviet_policies_of_collective_security.1.c:0 "Это не в наших интересах."
  NSB_soviet_policies_of_collective_security.2.t:0 "[FROM.GetNameDefCap] соглашается подписать пакт"
  NSB_soviet_policies_of_collective_security.2.desc:0 "Правительство [FROM.GetNameDef] в принципе согласилось с нашим предложенным Пактом о взаимопомощи. Делегация дипломатов прибыла, чтобы решить более тонкие детали реализации."
  NSB_soviet_policies_of_collective_security.2.a:0 "Мы будем держаться вместе."
  NSB_soviet_policies_of_collective_security.3.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
  NSB_soviet_policies_of_collective_security.3.desc:0 "После нескольких напряженных ночей переговоров делегация [FROM.GetAdjective] уехала, так и не подписав соглашение. Хотя некоторые члены дипломатической службы все еще надеются, что пакт удастся спасти, похоже, правительство [FROM.GetAdjective] считает этот вопрос закрытым."
  NSB_soviet_policies_of_collective_security.3.a:0 "Очень недальновидное решение."
  NSB_soviet_policies_of_collective_security.4.t:0 "[FROM.GetNameDefCap] настаивает на включении [POL.GetAdjective] в пакт"
  NSB_soviet_policies_of_collective_security.4.desc:0 "Хотя правительство [FROM.GetAdjective] в целом открыто для пакта о взаимной помощи, оно выражает обеспокоенность по поводу позиции Польши. Похоже, правительство [FROM.GetAdjective] считает, что Польша должна быть включена в пакт. \n\nЭто вопрос, по которому делегация [FROM.GetAdjective] не сдвинется с места, и она попросила нас официально пригласить [POL.GetNonIdeologyName] в пакт."
  NSB_soviet_policies_of_collective_security.4.a:0 "В их словах есть смысл."
  NSB_soviet_policies_of_collective_security.4.b:0 "Предложение было только между нами, и на это были причины."
  NSB_soviet_policies_of_collective_security.5.t:0 "[FROM.GetNameDefCap] отказывается включать [POL.GetNameDef] в пакт"
  NSB_soviet_policies_of_collective_security.5.desc:0 "Наши попытки убедить делегацию [FROM.GetAdjective] в необходимости включения [POL.GetNonIdeologyName] в Пакт, кажется, не принесли особых плодов. \n\nПо их мнению, вопрос о [POL.GetNonIdeologyName] не относится к данному договору, и они наотрез отказались обсуждать это дальше. Теперь нам нужно решить, прекращать ли здесь переговоры или продолжить с решением "малого" договора."
  NSB_soviet_policies_of_collective_security.5.a:0 "Это не должно потопить договор."
  NSB_soviet_policies_of_collective_security.5.b:0 "Тогда сделка не состоится."
  NSB_soviet_policies_of_collective_security.6.t:0 "[FROM.GetNameDefCap] соглашается включить [POL.GetNameDef] в Пакт"
  NSB_soviet_policies_of_collective_security.6.desc:0 "После дополнительного раунда переговоров делегация [FROM.GetAdjective] согласилась включить [POL.GetNonIdeologyName] в пакт. Как только детали будут проработаны, мы отправим сообщение правительству [POL.GetAdjective] с предложением присоединиться к Пакту на тех же условиях, что и мы."
  NSB_soviet_policies_of_collective_security.6.a:0 "А теперь давайте поговорим с поляками."
  NSB_soviet_policies_of_collective_security.7.t:0 "[SOV.GetAdjective]-[FROM.GetAdjective] Пакт о взаимопомощи"
  NSB_soviet_policies_of_collective_security.7.desc:0 "[FROM.GetAdjective] Посол сообщил нам, что его страна недавно подписала договор о взаимопомощи с [SOV.GetNameDef]. Согласно условиям договора, ни одна из сторон не будет нападать на другую и постарается поддерживать другую в военное время.\n\nДалее он заявил, что его правительство подписало этот договор только при условии, что нам разрешат присоединиться к пакту, если мы этого пожелаем."
  NSB_soviet_policies_of_collective_security.7.a:0 "Мы с удовольствием станем третьей стороной в этом договоре."
  NSB_soviet_policies_of_collective_security.7.b:0 "Разве они не знают, что Советским нельзя доверять?"
  NSB_soviet_policies_of_collective_security.8.t:0 "[FROM.GetNameDefCap] отказывается подписывать пакт без [POL.GetNameDef]"
  NSB_soviet_policies_of_collective_security.8.desc:0 "Наши попытки договориться с [FROM.GetNameDef] закончились неудачей. Похоже, вопрос о [POL.GetNonIdeologyName] и его включении в пакт стал критическим, по которому не удалось найти компромисс."
  NSB_soviet_policies_of_collective_security.8.a:0 "Такая неуместная лояльность."
  NSB_soviet_policies_of_collective_security.9.t:0 "[FROM.GetNameDefCap] соглашается подписать пакт"
  NSB_soviet_policies_of_collective_security.9.desc:0 "После дополнительных переговоров правительство [FROM.GetAdjective] согласилось подписать пакт, несмотря на их прежние опасения по поводу исключения Польши. Несмотря на то, что в делегации [FROM.GetAdjective] все еще есть некоторые недовольства, они, похоже, готовы продолжать ратификацию договора."
  NSB_soviet_policies_of_collective_security.9.a:0 "Они осознали свою неправоту."
  NSB_soviet_policies_of_collective_security.10.t:0 "[FROM.GetNameDefCap] отклоняет пакт"
  NSB_soviet_policies_of_collective_security.10.desc:0 "В неожиданном повороте событий правительство [POL.GetLeader] отказалось присоединиться к предложенному пакту. Хотя официальной причиной было названо отсутствие реальных угроз, в частном порядке правительство [POL.GetAdjective] указало, что Советы могут стремиться войти в Польшу, чтобы защитить ее, но они также будут неохотно покидать ее впоследствии."
  NSB_soviet_policies_of_collective_security.10.a:0 "По крайней мере, они получили предложение."
  NSB_soviet_policies_of_collective_security.11.t:0 "[POL.GetNameDefCap] отказывается присоединиться к нашему пакту о взаимопомощи"
  NSB_soviet_policies_of_collective_security.11.desc:0 "Правительство [POL.GetAdjective] отказалось присоединиться к Пакту о взаимопомощи, сославшись на отсутствие реальных угроз против них и нежелание вступать в альянсы.\n\nВ дипломатических кругах ходят слухи, что это всего лишь мера по спасению лица, а настоящая причина в том, что они нам не доверяют."
  NSB_soviet_policies_of_collective_security.11.a:0 "Какая же это трата времени."
  NSB_soviet_policies_of_collective_security.12.t:0 "[FROM.GetNameDefCap] соглашается присоединиться к нашему пакту о взаимопомощи"
  NSB_soviet_policies_of_collective_security.12.desc:0 "[FROM.GetAdjective] правительство в принципе согласилось присоединиться к пакту. Хотя некоторые детали ещё нужно проработать, они не помешают ратификации договора."
  NSB_soviet_policies_of_collective_security.12.a:0 "Это сделает союз ещё крепче."
  NSB_soviet_policies_of_collective_security.13.desc:0 "С решением вопроса о [POL.GetNonIdeologyName], [FROM.GetAdjective] правительство готово официально ратифицировать договор на первоначально согласованных условиях."
  NSB_soviet_policies_of_collective_security.13.a:0 "Ну что же, поставим подпись!"
  NSB_soviet_academy_of_sciences.1.t:0 "Основание [THIS.GetAdjective] академии наук"
  NSB_soviet_academy_of_sciences.1.desc:0 "Сегодня в пышной церемонии [THIS.GetLeader] и [SOV.GetAdjective] посол официально открыли [THIS.GetAdjective] академию наук. Построенный по образцу [SOV.GetAdjective] академии наук, этот новый институт позволит нам проводить передовые исследования на очень высоком уровне под руководством экспертов из [SOV.GetNameDef]."
  NSB_soviet_academy_of_sciences.1.a:0 "Большой шаг вперёд!"
  NSB_soviet_atomic_bomb_project.1.t:0 "Агент вернулся с ядерными секретами"
  NSB_soviet_atomic_bomb_project.1.desc:0 "Один из наших агентов, внедренных в зарубежную программу ядерных исследований, вернулся в наше посольство с большим количеством совершенно секретных документов по различным темам, над которыми работают ученые: от проектов центрифуг до расчетов размеров боеголовок. Несомненно, эти данные будут очень ценны для продвижения нашей собственной программы создания ядерного оружия."
  NSB_soviet_atomic_bomb_project.1.a:0 "Еще одна победа для мира."
  NSB_soviet_atomic_bomb_project.2.t:0 "Агент пойман на ядерном объекте"
  NSB_soviet_atomic_bomb_project.2.desc:0 "Один из наших агентов, внедренный в программу разработки ядерного оружия, был схвачен сегодня при попытке покинуть безопасный объект. Обыск его сумки выявил ряд секретных документов. К сожалению, очевидно, он признался в работе на нас, так как наш посол был вызван на срочные консультации и ему были предъявлены улики."
  NSB_soviet_atomic_bomb_project.2.a:0 "Абсурд! У нас нет никаких связей с этим человеком."
  NSB_soviet_atomic_bomb_project.3.t:0 "Нарушение безопасности на объекте ядерных исследований"
  NSB_soviet_atomic_bomb_project.3.desc:0 "Сегодня утром во время обычной инспекции на одном из наших научно-исследовательских ядерных объектов был остановлен сотрудник. В ходе тщательного досмотра его вещей в его сумке было обнаружено скрытое отделение. В нем находилось несколько строго секретных документов, связанных с ядерными технологиями.\n\nПодозреваемый был передан в контрразведку и дал полное признание. Судя по всему, он контактировал с [SOV.GetAdjective] посольством и был привлечен к внедрению в нашу ядерную программу с целью кражи чертежей и других исследовательских данных."
  NSB_soviet_atomic_bomb_project.3.a:0 "По крайней мере, ничего не было украдено."
  NSB_soviet_policies_of_collective_security_agreed_effects_tt:0 "Если пакт вступит в силу, мы согласимся на следующие условия:"
  NSB_soviet_policies_of_collective_security_condition_effects_tt:0 "Если [FROM.GetAdjective] и [POL.GetAdjective] правительства согласятся включить [POL.GetNameDef] в Пакт, эти же эффекты будут применены к [POL.GetNameDef]."
  NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt:0 "Мы отвергаем [FROM.GetAdjective] предложение включить [POL.GetNameDef] в пакт. [FROM.GetNameDefCap] придется выбирать между принятием нашего первоначального предложения или отказом от идеи коллективного соглашения о взаимопомощи."
  NSB_soviet_policies_of_collective_security_tt:0 "Если [POL.GetAdjective] правительство согласится, [POL.GetNameDef] будет включен в коллективное соглашение о взаимопомощи вместе с [FROM.GetNameDef] и [ROOT.GetNameDef]."
  NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! и [POL.GetFlag]§Y[POL.GetNameDefCap]§! откажутся от каких-либо претензий или военных целей друг против друга, подпишут пакт о ненападении и гарантируют друг другу."
  NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! и [POL.GetFlag]§Y[POL.GetNameDefCap]§! откажутся от каких-либо претензий или военных целей друг против друга, подпишут пакт о ненападении и гарантируют друг другу."

  NSB_soviet_comecon.1.t:0 "Промышленный проект [FROM.GetAdjective] в [ROOT.GetNameDef]"
  NSB_soviet_comecon.1.desc:0 "В рамках организации по координации экономической деятельности СЭВ, [FROM.GetAdjective] правительство начало инвестировать в нашу экономику. Это позволит нам существенно нарастить нашу экономику в течение следующих нескольких месяцев."
  NSB_soviet_comecon.1.a:0 "Вот как на практике выглядит взаимопомощь!"
  NSB_soviet_comecon.2.t:0 "Программа [FROM.GetAdjective] военного развития стран СЭВ"
  NSB_soviet_comecon.2.desc:0 "Правительство [FROM.GetAdjective] приняло решение о проведении обширной серии маневров и учений. Это повысит наш военный потенциал и даст возможность сотрудничать с другими нашими союзниками. Необходимо использовать полученный опыт для проведения необходимых военных реформ."
  NSB_soviet_comecon.2.a:0 "Мы готовы сражаться вместе с вами, товарищи!"
  NSB_soviet_comecon_effect_duration_tt:0 "Эти эффекты продлятся в течение §Y180§! дней, после чего наш национальный дух снова вернётся к прежнему варианту."
  NSB_soviet_spanish_civil_war.1.t:0 "[?SOV.SOV_spanish_general.GetName] присоединяется к [ROOT.GetNameDef]"
  NSB_soviet_spanish_civil_war.1.desc:0 "Вчера в Кронштадт прибыл корабль, переполненный испанскими беженцами, бегущими из страны из-за надвигающегося падения их правительства в гражданской войне. Их встретила наша делегация из [ROOT.Capital.GetName], которая взяла на себя заботу о группе, состоящей в основном из детей, а также нескольких испанских политиков и военных.\nСреди них был великий коммунистический деятель [?SOV.SOV_spanish_general.GetName], с которым наши представители провели беседу. Бывший офицер испанской армии заявил, что испанцы прибыли в [ROOT.GetNameDef], чтобы залечить свои раны и найти солидарность в своей задаче освобождения испанского народа, и попросил [ROOT.GetAdjective] правительство признать его военное звание и вернуть его на службу, чтобы он мог продолжить борьбу против фашизма и империализма."
  NSB_soviet_spanish_civil_war.1.a:0 "Мы приветствуем всех испанских беженцев."
  NSB_soviet_spanish_civil_war.2.t:0 "Прибытие интернациональных марксистских бригад в [ROOT.capital.GetName]"
  NSB_soviet_spanish_civil_war.2.desc:0 "Симпатики из Советского Союза организовали мобилизацию и обучение сотен членов интернациональных бригад, которые поддерживают наше дело победы в войне, не отказываясь от революции. Эти смелые члены международного пролетариата и крестьянства готовы отдать свои жизни в войне против фашизма и буржуазии."
  NSB_soviet_spanish_civil_war.2.a:0 "Это начало мировой революции!"
  NSB_soviet_spanish_civil_war.3.t:0 "Советские спецназовцы прибыли в [ROOT.capital.GetName]"
  NSB_soviet_spanish_civil_war.3.desc:0 "Советские антисталинские спецназовцы тайно прибыли в Барселону вместе с группой высококвалифицированных агентов и оперативников, сочувствующих нашему делу. По данным наших контактов в Советском Союзе, это подкрепление позволит нам сформировать элитные бригады, с помощью которых мы сможем прорвать линию фронта противника или остановить его наступление, а также включить в нашу командную структуру квалифицированных агентов и офицеров."
  NSB_soviet_spanish_civil_war.3.a:0 "Мы воспользуемся ими самым лучшим образом."
  NSB_soviet_spanish_civil_war.4.t:0 "Всенародные выступления, организованные советской властью"
  NSB_soviet_spanish_civil_war.4.desc:0 "Харизматичные члены правой оппозиции в Советском Союзе, вместе с местными ораторами из ПОУМ, НКТ и ФАИ, провели информационно-агитационную кампанию, чтобы разжечь революционный дух пролетарских и крестьянских масс [ROOT.GetNameDef]. Благодаря пламенным речам, произнесённым во множестве населённых пунктов, в массах сформировалось крепкое классовое сознание, и они как никогда раньше готовы посвятить себя делу."
  NSB_soviet_spanish_civil_war.4.a:0 "В единении мы победим!"
  NSB_soviet_spanish_civil_war.5.t:0 "Советские агенты внедряются в сталинское командование"
  NSB_soviet_spanish_civil_war.5.desc:0 "Новая партия советских военных атташе и советников недавно прибыла в Испанию, чтобы помочь буржуазному республиканскому правительству. \nСреди этой группы находятся несколько советских антисталинистских агентов, внедрённых в качестве помощников военных советников, отправленных [FROM.GetLeader]. \nЭти агенты связались и завербовали множество должностных лиц, солдат, международных бригадиров и ополченцев, сочувствующих ПОУМ, которые в настоящее время сражаются в частях буржуазной республиканской армии, создав впечатляющую сеть осведомителей, позволяющую нам иметь информацию из первых рук о запланированных передвижениях цепи командования противника."
  NSB_soviet_spanish_civil_war.5.a:0 "Пора нанести последний удар!"
  NSB_soviet_spanish_civil_war.6.t:0 "Триумфальная революция в Испании"
  NSB_soviet_spanish_civil_war.6.desc_1:0 "Письмо, написанное самим [SPC.GetLeader], было доставлено в нашу организацию этим утром. В этом письме испанский лидер заявляет, что испанский народ никогда не забудет поддержки, полученной от настоящих советских революционеров, и что, когда придет время противостоять тираническому монолиту сталинизма, мы можем быть уверены, что ПОУМ сделает все возможное, чтобы помочь советскому народу в его борьбе за свободу и настоящую революцию."
  NSB_soviet_spanish_civil_war.6.desc_2:0 "Победив своих фашистских и буржуазных врагов в Испании и будучи осведомленным о положении советского народа в их борьбе против сталинистской контрреволюции, ПОУМ организовала впечатляющую операцию по переброске значительного числа добровольческих бригад в наш штаб. Эти храбрые мужчины и женщины прибывают не только из Испании, но и со всего мира, и большинство из них - опытные ветераны Гражданской войны в Испании, чьи опыт и навыки могут помочь переломить ход советской борьбы в нашу пользу."
  NSB_soviet_spanish_civil_war.6.a:0 "Революция восторжествует и в России!"
  NSB_soviet_spanish_civil_war.6.b:0 "Революция или Смерть!"
  SOV_poum_aid_in_case_of_civil_War_tt:0 "Испанский ПОУМ организует различные добровольческие дивизии, чтобы помочь нам в случае гражданской войны против [ROOT.GetLeader] и сталинистской доктрины."
  NSB_soviet_planned_economy.1.t:0 "$SOV.GetAdjective$ Программа Плановой Экономики"
  NSB_soviet_planned_economy.1.desc:1 "[SOV.GetLeader] представил новую схему совместной, плановой экономики. \nНесмотря на то, что у программы есть недостатки, правительство [FROM.GetAdjective] полагает, что у НЭПа также были ряд успехов, и оно намерено установить модель плановой экономики, создав более взаимозависимую экономику между [FROM.GetNameDef] и ее партнерами, и проложив путь к полностью социалистическому обществу."
  NSB_soviet_planned_economy.1.a:0 "Мы должны ей следовать"
  nsb_news.100.desc:1 "Лев Троцкий, когда-то один из ближайших соратников и возможных наследников Владимира Ильича Ленина, сегодня подвергся нападению в своем доме вооруженной группой, совершившей налет на его виллу. Нападавшие ворвались в комнату, где находился большевик, немедленно открыли огонь, а затем быстро скрылись. Троцкий получил смертельное ранение и спустя несколько часов скончался в больнице в Мехико. \n\nПосле неудачной борьбы за власть с $SOV_iosif_stalin$ и его союзниками за контроль над коммунистической партией Советского Союза Троцкий провел тридцатые годы в изгнании, живя в Турции, Франции и Норвегии, прежде чем окончательно поселиться в Мексике. \nОн оставался постоянным критиком Сталина и "деградировавшего" "рабочего государства" в Советском Союзе."
  nsb_news.101.desc:1 "Сегодня в своем доме подвергся нападению вооруженной группой старый большевик Лев Троцкий. Нападавшие ворвались в комнату, где он находился, стреляя без разбора и цели, а затем быстро скрылись, оставив невредимого Троцкого, который успел спрятаться за кроватью вместе с женой и внуком. \n\nКогда-то Троцкий был первым заместителем и возможным наследником Владимира Ленина, но после неудачной борьбы за власть был вынужден покинуть Советский Союз и отправиться в изгнание $SOV_iosif_stalin$. В разговоре с журналистами Троцкий осудил попытку покушения на него как "очередной трусливый заговор, замышляемый Сталиным для затыкания ртов своим критикам"."
  nsb_news.102.t:0 "[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot] Пакт"
  nsb_news.102.desc_default:0 "Пакт о взаимопомощи между [SOV.GetNameDef] и [SOV_collective_security_pact_integrant.GetNameDef] был подписан вчера в [SOV.Capital.GetCapitalVictoryPointName] дипломатами обеих стран. \n\nЭто соглашение является частью политики коллективной безопасности, предложенной [SOV.GetAdjective] Народным комиссаром по иностранным делам [SOV.SOV_maksim_litvinov.GetName]. В соответствии с этим пактом [SOV.GetNameDef] и [SOV_collective_security_pact_integrant.GetNameDef] обязались защищать друг друга в случае агрессии со стороны враждебных держав."
  nsb_news.102.desc_poland:0 "Пакт о взаимопомощи между [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] и [POL.GetNameDef] был подписан вчера в [SOV.Capital.GetCapitalVictoryPointName] дипломатами всех трех стран. \n\nЭто соглашение является частью политики коллективной безопасности, предложенной [SOV.GetAdjective] Народным комиссаром по иностранным делам [SOV.SOV_maksim_litvinov.GetName]. В соответствии с этим пактом [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] и [POL.GetNameDef] отказались от любых территориальных претензий между собой и обязались защищать друг друга в случае агрессии со стороны враждебных держав."
  nsb_news.102.a:0 "Необычный союз..."
  nsb_news.102.b:0 "Во имя коллективной безопасности."
  SOV_collective_security_news_poland_included:0 "-[POL.GetAdjective]"
  SOV_collective_security_news_poland_no:0 ""
  nsb_news.103.t:0 "Торговое соглашение [SOV.GetAdjective]-[GER.GetAdjective]"
  nsb_news.103.desc:0 "[SOV.GetNameDef] и [GER.GetNameDef] подписали коммерческое соглашение. С помощью этого соглашения [SOV.GetAdjective] надеются ускорить индустриальное развитие и военные исследования, а [GER.GetAdjective] заинтересованы в импорте столь необходимого им сырья, такого как зерно, нефть и железная руда."
  nsb_news.103.a:0 "Это пойдет на пользу [ROOT.GetNameDef]"
  nsb_news.103.b:0 "Долго ли это продлится?"
  nsb_news.104.t:0 "Англо-[SOV.GetAdjective] вторжение в [PER.GetName]"
  nsb_news.104.desc:0 "После недель планирования [ENG.GetNameDef] и [SOV.GetNameDef] предприняли совместную военную операцию в [PER.GetName] с целью провести быструю оккупацию противника, превосходящего их по численности и технологиям. По словам [ENG.GetLeader], эта операция позволит им обезопасить [PER.GetAdjective] нефтяные месторождения и [ENG.GetAdjective] линии снабжения к [SOV.GetNameDef], а также предотвратить потенциальное продвижение противника из [TUR.GetNameDef] через [PER.GetName] к нефтяным месторождениям Баку и [RAJ.GetNameDef]."
  nsb_news.104.a:0 "Это необходимая мера."
  nsb_news.104.b:0 "Ещё одна жертва [ENG.GetLeader] и [SOV.GetLeader]."
  nsb_news.104.c:0 "Нечестная игра..."
  NSB_Soviet_fascist_civil_war.001.t:0 "[GetSovietCivilWarName]!"
  NSB_Soviet_fascist_civil_war.001.desc:0 "Время для политических манёвров прошло. Вооружённая борьба против коммунистов возобновилась. Сформирован комитет, который проведёт нас через эту войну. На этот раз мы будем сражаться единым фронтом до конца. На этот раз не будет поражений. На этот раз мы вернём себе империю!"
  NSB_Soviet_fascist_civil_war.001.a:0 "К оружию!"
  NSB_Soviet_fascist_civil_war.002.t:0 "Наши новобранцы готовы"
  NSB_Soviet_fascist_civil_war.002.desc:0 "Подразделения Руки готовы подняться на восстание против коммунистических угнетателей."
  NSB_Soviet_fascist_civil_war.002.a:0 "Отлично"
  NSB_Soviet_fascist_civil_war.003.t:0 "$SOV_grigory_semyonov$ покидает [ROOT.GetName]"
  NSB_Soviet_fascist_civil_war.003.desc:0 "Гражданская война в России вспыхнула снова. $SOV_grigory_semyonov$, который пребывал здесь с момента побега от красных, решил снова покинуть [ROOT.GetName], чтобы присоединиться к борьбе против коммунистов в [SOV.GetNameDef]."
  NSB_Soviet_fascist_civil_war.003.a:0 "Что же, полагаю, ему стоит отправиться"
  NSB_soviet_communist_civil_war.001.t:0 "[GetSovietCivilWarName]"
  NSB_soviet_communist_civil_war.001.desc:0 "Товарищи, время вновь поднять знамена и отправиться на войну за революцию. Прежде чем мы сможем спасти пролетариат, мы должны вернуть контроль над [ROOT.GetNameDef]. Подобно тому, как мы победили белые армии, мы должны победить тех, кто встал на пути истинной революции на родине. \nМы также должны решить, кто должен быть нашим лидером в этой борьбе."
  NSB_soviet_communist_civil_war.001.a:0 "Троцкий всегда был главным противником Сталина."
  NSB_soviet_communist_civil_war.001.b:0 "Смирнов поведет народ к победе"
  NSB_soviet_communist_civil_war.001.c:0 "Нам нужен кто-то с военным опытом"
  NSB_soviet_communist_civil_war.001.d:0 "Зиновьев — прирожденный лидер"
  NSB_soviet_communist_civil_war.001.e:0 "Каменев станет хорошей фигурой"
  
  NSB_soviet_communist_civil_war.002.t:0 "Берия захвачен армией"
  NSB_soviet_communist_civil_war.002.desc:0 "$SOV_lavrenty_beriya$ был арестован офицерами армии и содержится под стражей до суда. Армейские подразделения вошли в столицу, чтобы обезопасить ее от попыток восстания со стороны его сторонников. В настоящее время проводятся аресты ближайших соратников Берии. Настало время найти нового лидера для [ROOT.GetNameDef]."
  NSB_soviet_communist_civil_war.002.a:0 "Бухарин - идеальный кандидат"
  NSB_soviet_communist_civil_war.002.b:0 "Им должен быть Рыков"
  NSB_soviet_communist_civil_war.002.c:0 "Кто-то, кто может обеспечить лояльность армии"
  NSB_soviet_communist_civil_war.002.d:0 "Зиновьев - прирожденный лидер"
  NSB_soviet_communist_civil_war.002.e:0 "Каменев будет хорошим номинальным руководителем"

  NSB_soviet_communist_civil_war.003.t:0 "[GetSovietCivilWarName]"
  NSB_soviet_communist_civil_war.003.desc:0 "Война вновь настигла нас. Мы должны взяться за оружие против диктатора, который завел эту страну в тупик. Слишком долго Сталин ведет Советский Союз в неправильном направлении. Жаль, что это пришлось сделать таким образом, но у нас нет другого выхода."
  NSB_soviet_communist_civil_war.003.a:0 "Бухарин поведет нас"
  NSB_soviet_communist_civil_war.003.b:0 "Народ может сплотиться вокруг Рыкова"
  NSB_soviet_communist_civil_war.003.c:0 "Нам нужен кто-то с военным опытом"
  NSB_soviet_communist_civil_war.003.d:0 "Зиновьев - прирожденный лидер"
  NSB_soviet_communist_civil_war.003.e:0 "Каменев будет хорошим номинальным руководителем"

  NSB_soviet_communist_civil_war.004.t:0 "Призыв в интернациональные революционные бригады"
  NSB_soviet_communist_civil_war.004.desc:0 "[FROM.GetLeader] призвал добровольцев вступить в борьбу против [SOS.GetLeader]. На призыв откликнулись различные группы, и формируются интернациональные бригады."
  NSB_soviet_communist_civil_war.004.a:0 "Это нужно поощрять"
  NSB_soviet_communist_civil_war.004.b:0 "Это надо прекратить!"
  NSB_soviet_communist_civil_war.004.c:0 "Ого"

  NSB_soviet_communist_civil_war.005.t:0 "Прибывают интернациональные бригады"
  NSB_soviet_communist_civil_war.005.desc:0 "Революционеры со всего мира прибыли, чтобы сражаться с врагами истинной революции. Из добровольцев формируются интернациональные бригады, которые скоро будут брошены на врагов [ROOT.GetNameDef]."
  NSB_soviet_communist_civil_war.005.a:0 "Ценный вклад"
  NSB_soviet_communist_civil_war.006.t:0 "Массовые протесты в [?SOV_uprising_state.GetName]"
  NSB_soviet_communist_civil_war.006.desc:1 "Рабочие в [?SOV_uprising_state.GetName] вышли на улицы на массовый митинг. Широко распространены призывы к усилению влияния профсоюзов, но также часто встречались и другие лозунги и протестные плакаты. Есть даже сообщения о прямых антисталинских лозунгах."
  NSB_soviet_communist_civil_war.006.a:0 "Пусть протестуют"
  NSB_soviet_communist_civil_war.006.b:0 "Это нужно прекратить, пока не стало хуже"
  NSB_soviet_communist_civil_war.008.t:0 "Сталин выжил после покушения"
  NSB_soviet_communist_civil_war.008.desc:0 "Была предпринята неудачная попытка покушения на жизнь Сталина. Одинокий стрелок ворвался на дачу Сталина, но был обнаружен прежде, чем смог добраться до комнаты генерального секретаря. Покушавшийся был застрелен на месте охраной Сталина. Теперь в столице циркулируют слухи о том, кто мог стоять за этим поступком."
  NSB_soviet_communist_civil_war.008.a:0 "Возможно, положение дел ухудшится"
  NSB_soviet_communist_civil_war.009.t:0 "Смерть Сталина"
  NSB_soviet_communist_civil_war.009.desc:0 "Неоспоримый лидер [SOV.GetNameDef], $SOV_iosif_stalin$, убит неизвестными убийцами. Судя по всему, вождь [SOV.GetNameDef] был один на своей даче, когда было совершено покушение.\nТройка во главе с доверенным лицом Сталина, всеобщим ненавистником $SOV_lavrenty_beriya$, взяла под контроль страну, но ситуация нестабильна, и будущее [SOV.GetNameDef] туманно."
  NSB_soviet_communist_civil_war.009.a:0 "Настают интересные времена."

  NSB_soviet_communist_civil_war.010.t:0 "Переход [?SOS.SOV_general_to_desert.GetName]"
  NSB_soviet_communist_civil_war.010.desc:0 "Будучи недоволен обращением Сталина, [?SOS.SOV_general_to_desert.GetName] решил покинуть диктатора и присоединиться к нашей справедливой борьбе. Небольшое количество отрядов решило последовать за своим генералом, а не остаться с [SOS.GetLeader]."
  NSB_soviet_communist_civil_war.010.a:0 "Они нам очень рады!"

  NSB_soviet_civil_war_common.001.t:0 "Победа"
  NSB_soviet_civil_war_common.001.desc_left:0 "Война против Сталина окончена. Диктатор свергнут. [ROOT.GetLeader] привел нас к победе.\nПришло время вновь разжечь революционный огонь и принести свободу рабочему классу по всему миру."
  NSB_soviet_civil_war_common.001.desc_right_concessions:0 "Страна выиграла, [ROOT.GetLeader] привел нас к победе. Настало время начать исцеляться и перестраивать страну. Мы показали, что готовы сделать все, что необходимо для победы. Победа всегда имеет свою цену, и, помимо жертв наших героических солдат, нам также нужно выплатить долги, прежде чем закрыть эту главу нашей истории."
  NSB_soviet_civil_war_common.001.desc_right_no_concessions:0 "Наши победоносные армии прошли парадом мимо Кремля. Победа за нами!\nНовая эра для [ROOT.GetNameDef] начинается сегодня. Под мудрым руководством [ROOT.GetLeader] страна будет восстановлена и станет сильнее, чем когда-либо."
  NSB_soviet_civil_war_common.001.desc_exiles:0 "Коммунистический режим пал. Наши победоносные войска контролируют столицу. Народ наконец свободен от красной тирании. Новая Россия поднимется из разрухи, вызванной двумя гражданскими войнами и годами беззакония между ними."
  NSB_soviet_civil_war_common.001.a:0 "Время двигаться дальше"

  NSB_soviet_civil_war_common.002.t:0 "Столица [ROOT.GetNameDef]"
  NSB_soviet_civil_war_common.002.desc:1 "Война окончена. Необходимо принять решение о будущей столице страны."
  NSB_soviet_civil_war_common.002.a:0 "Москва - важнейший город"
  NSB_soviet_civil_war_common.002.b:0 "Ленинград - то место, где началась революция"
  NSB_soviet_civil_war_common.002.c:0 "Это должен быть Петроград"
  NSB_soviet_civil_war_common.002.d:0 "Останемся верны [?SOV_civil_war_start_state.GetName]"
  NSB_soviet_civil_war_common.002.e:0 "Владивосток станет нашей новой восточной столицей"
  NSB_soviet_civil_war_common.002.f:0 "С. Петербург был столицей Империи"
  SOV_petrograd:0 "Петроград"
  SOV_StPetersburg:0 "С. Петербург"

  NSB_soviet_civil_war_common.003.t:0 "[ROOT.GetLeader] мобилизует вооруженные силы"
  NSB_soviet_civil_war_common.003.desc:0 "Наши операции больше нельзя скрывать. [ROOT.GetLeader] мобилизовал армию и НКВД, и начал облавы на всех, подозреваемых в сговоре против государства. Если мы не будем действовать сейчас, все, за что мы боролись, окажется напрасным."
  NSB_soviet_civil_war_common.003.a:0 "Ну что ж, значит, война"

  NSB_soviet_civil_war_common.006.t:0 "Партизаны присоединяются к восстанию"
  NSB_soviet_civil_war_common.006.desc:0 "Власть [SOS.GetLeader] над страной слабеет. По всему [SOS.GetNameDef] люди восстают против тирании [SOS.GetLeader]. Создаются партизанские отряды, которые помогут нам в нашей борьбе."
  NSB_soviet_civil_war_common.006.a:0 "Отлично"
  SOV_popular_uprising_units_tt:0 "Партизанские отряды присоединяются к [ROOT.GetNameDef]."

  NSB_soviet_civil_war_common.010.t:0 "Десталинизация"
  NSB_soviet_civil_war_common.010_right_opposition:0 "Диктатор пал. Пришло время разрушить культ Сталина, лишить его оставшихся последователей ценных для них икон и показать народу, что старые времена прошли. Необходимо снести памятники и переименовать города. Возможно, самой дорогой жемчужиной Сталина был город Сталинград."
  NSB_soviet_civil_war_common.010_left_opposition:0 "Революция восторжествовала. Диктатор пал, и теперь страной вновь правит пролетариат. Культовому поведению Сталина должен быть положен конец, и все его символы должны быть уничтожены. Города, названные в честь Сталина и его последователей, необходимо переименовать во что-то более подходящее. Это особенно верно в отношении города Сталинграда."
  NSB_soviet_civil_war_common.010_exiles:0 "Большевики пытались изменить государственную религию на коммунизм и создали личный культ вокруг его лидеров. Они даже зашли так далеко, что переименовали города России. Необходимо восстановить порядок в империи, и нигде нельзя начать это лучше, чем со старого города Царицын, переименованного в Сталинград."
  NSB_soviet_civil_war_common.010.a:0 "Волгоград был бы подходящим названием"
  NSB_soviet_civil_war_common.010.b:0 "Это был Царицын, и он должен быть Царицыном"
  NSB_soviet_civil_war_common.010.c:0 "Троцкий - истинный герой революции"
  NSB_soviet_civil_war_common.010.d:0 "Мы должны переименовать его в память о Бухарине"
  SOV_Volgograd:0 "Волгоград"
