l_russian:
  BALTIC_events.1.t:0 "[From.GetNameDefCap] Ищет гарантии"
  BALTIC_events.1.d:0 "Телеграмма из [From.GetNameDef] поступила на имя [Root.GetLeader] этим утром. В ней [From.GetLeader] просит [Root.GetNameDef] восстановить гарантии независимости [From.GetAdjective]. Сославшись на давнюю дружбу между [Root.GetNameDef] и [From.GetNameDef] с момента образования государства в 1918 году, [From.GetLeader] настаивает, что выживание его нации имеет первостепенное значение для продолжения мира в Восточной Европе.\n\nПоскольку между [From.GetNameDef] и [SOV.GetNameDefCap] нарастает напряженность, принятие предложения [From.GetLeader] может втянуть [Root.GetNameDef] в конфликт с [SOV.GetAdjective]..."
  BALTIC_events.1.a:0 "Мы защитим наших [From.GetAdjective] друзей."
  BALTIC_events.1.b:0 "Мы не поддерживаем [From.GetLeader] или его правительство."
  BALTIC_events.101.t:0 "[From.GetNameDefCap] Принял!"
  BALTIC_events.101.d:0 "[From.GetLeader] объявил о [From.GetHerHis] поддержке сохранения независимости [Root.GetAdjective] и присоединится к любым конфликтам, которые угрожают дальнейшему существованию [Root.GetNameDef]."
  BALTIC_events.101.a:0 "Мы в безопасности."
  BALTIC_events.102.t:0 "[From.GetNameDefCap] Отказал!"
  BALTIC_events.102.d:0 "К большому огорчению [Root.GetLeader], [From.GetAdjective] министерство иностранных дел решило не поддерживать военные отношения с [Root.GetNameDef]."
  BALTIC_events.102.a:0 "Придется искать другое решение."
  BALTIC_events.2.t:0 "[From.GetNameDefCap] Ищет сотрудничества с Прибалтикой"
  BALTIC_events.2.d_baltic:0 "[From.GetLeader] и [From.GetHerHis] кабинет министров обратились к [Root.GetAdjective] правительству с предложением формализовать неформально организованную Балтийскую Антанту в военный союз. Подписание соглашения будет означать, что во время войны наши военные будут объединены и вместе противостоять угрозе нашему суверенитету.\n\nХотя [From.GetLeader] и надеется в конечном итоге формализовать Балтийскую Антанту в фракцию от Риги до Осло, хотя такие амбиции кажутся маловероятными, он выступает за оборонительную позицию."
  BALTIC_events.2.d_scandi:0 "[From.GetLeader] и [From.GetHerHis] кабинет министров обратились к [Root.GetAdjective] правительству с предложением формализовать неформально организованную Балтийскую Антанту в военный союз. Подписание соглашения будет означать, что во время войны наши военные будут объединены и вместе противостоять угрозе нашему суверенитету.\n\n[From.GetLeader] настаивает на том, что, как только угроза на их границе победит, то, чего они хотят от Прибалтики, Скандинавия, безусловно, следующая в их амбициях к войне, и мы должны держаться вместе в это время глобального конфликта."
  BALTIC_events.2.a:0 "Мы присоединимся!"
  BALTIC_events.2.b:0 "Я думаю, что у нас есть варианты и получше."
  BALTIC_events.202.a:0 "Как они смеют нас отвергать!"
  BALTIC_events.203.t:0 "Балтийская Антанта брошена!"
  BALTIC_events.203.d:0 "Не сумев заручиться достаточной поддержкой, чтобы противостоять вторжению [SOV.GetAdjective], [From.GetLeader] принял решение отказаться от идеи Прибалтийской Антанты и вместо этого поискать другие варианты. К общему разочарованию нашей нации, мечта выступить против армии [SOV.GetAdjective] вместе с нашими друзьями из [From.GetNameDef] останется именно мечтой."
  BALTIC_events.203.a:0 "Разочаровывает."
  BALTIC_events.3.t:0 "[From.GetNameDefCap] запрашивает прямое вмешательство"
  BALTIC_events.3.d:0 "Гражданская война между народной армией [From.GetLeader] и заблудшим пролетариатом, сражающимся за буржуазную диктатуру [From.GetNonIdeologyName], продолжается, но, похоже, [From.GetLeader] оказался неспособен самостоятельно привести революцию к победе. На стол [Root.GetLeader] поступило сообщение от [Root.GetAdjective] посла в [From.GetNonIdeologyName], выражающего обеспокоенность по поводу будущего [From.GetAdjective] революционеров. Он считает, что если эта гражданская война будет проиграна, это положит конец любой надежде на успех социализма в [From.GetNonIdeologyName]."
  BALTIC_events.3.a:0 "Необходимы прямые действия!"
  BALTIC_events.3.b:0 "Пролетариат может освободиться только сам."
  BALTIC_events.301.t:0 "[From.GetNameDefCap] отказывается вмешиваться"
  BALTIC_events.301.d:0 "Наши друзья и союзники в [From.GetNameDef] ответили на призыв [Root.GetLeader] о прямом вмешательстве отказом оказать его. [From.GetLeader] утверждает, что если [Root.GetAdjective] рабочих необходимо освободить, им следует сделать это самостоятельно, и любое прямое вмешательство со стороны [From.GetNameDef] будет расцениваться как акт империализма."
  BALTIC_events.301.a:0 "[From.GetLeader.GetSheHeCap] прав."
  BALTIC_events.4.t:0 "Коммунисты маршируют на [Root.Capital.GetName]!"
  BALTIC_events.4.d:0 "Жители [Root.GetAdjective] все больше и больше недовольны правительством и сегодня на улицах [Root.Capital.GetName] напряженность достигла высшей точки. Протесты, выражающие недовольство режимом и отношением к гражданам низших сословий, привели к нескольким жестоким столкновениям с военной полицией [Root.GetAdjective], и в итоге протестующие добрались до здания парламента [Root.Capital.GetName] во время сессии, проводимой [Root.GetLeader] и несколькими ключевыми членами партии [Root.GetRulingParty]. Протестующие четко заявили свои требования; свергнуть [Root.GetLeader] и [Root.GetLeader.GetHerHis] партию [Root.GetRulingParty] с правительства или столкнуться с насильственной революцией."
  BALTIC_events.4.a:0 "У нас нет выбора."
  BALTIC_events.4.b:0 "Отречься? Никогда!"
  BALTIC_events.5.t:0 "[From.GetNameDefCap] стремится основать [From.GetNonIdeologyName]-Беларусь"
  BALTIC_events.5.d:0 "Вдохновляясь недолговечной Литовско-Белорусской ССР из прошлого, [From.GetLeader] стремится объединить [From.GetNameDef] с Белорусской ССР. [From.GetLeader.GetSheHeCap] утверждает, что объединение двух стран значительно расширит возможности [From.GetNameDef] в служении мировой революции, устранив барьер между Востоком и Западом."
  BALTIC_events.5.a:0 "Вдохновенная идея!"
  BALTIC_events.5.b:0 "Беларусь должна остаться [Root.GetAdjective]."
  BALTIC_events.501.t:0 "[From.GetNameDefCap] согласен!"
  BALTIC_events.501.d:0 "Пришли известия из [From.GetNameDef] относительно просьбы [Root.GetAdjective] сформировать единую Белорусско-[Root.GetNonIdeologyName] ССР. [From.GetLeader] воодушевлен возможностями, предоставляемыми таким объединением между восточно-европейским государством и балтийской нацией, утверждая, что такой союз неизбежно сократит разрыв между Востоком и Западом, облегчив возможность распространения революции по всему континенту."
  BALTIC_events.501.a:0 "[Root.GetNonIdeologyName] крепчает!"
  BALTIC_events.502.t:0 "[From.GetNameDefCap] отверг!"
  BALTIC_events.502.d:0 "Хотя изначально Литовско-Белорусская ССР была создана для того, чтобы преодолеть разрыв между Востоком и Западом, похоже, что [From.GetLeader] больше не считает это необходимым и заявляет, что Белоруссия является неотъемлемой частью СССР, которая не может быть передана [Root.GetNameDef]."
  BALTIC_events.502.a:0 "По крайней мере, мы попытались."
  BALTIC_events.503.t:0 "Информационная война в Белоруссии"
  BALTIC_events.503.d:0 "[From.GetNameDef] пытается вернуть наследие Литовско-Белорусской ССР. [From.GetNameDef] пытается дестабилизировать белорусское правительство, поощряя членов этого правительства к дезертирству в [From.GetNonIdeologyName]!"
  BALTIC_events.503.a:0 "Мы скоро с этим разберёмся."
  BALTIC_events.6.t:0 "[From.GetNameDefCap] Стремится к объединению Балтики"
  BALTIC_events.6.d:0 "Балтийские государства долгое время разделяли историю совместных страданий и угнетения под сапогом иностранного империализма, но теперь этому пришёл конец. [Root.GetNameDefCap] и [From.GetNameDef] оба освободились под властью социализма, но [From.GetLeader] утверждает, что это не гарантирует выживания Балтии в будущем. [From.GetLeader.GetSheHeCap] утверждает, что пока Балтия остаётся разделённой на национальные границы, она уязвима для империализма и капитализма, и только объединившись в единую Балтийскую Республику, мы сможем выдержать натиск иностранных захватчиков."
  BALTIC_events.6.a:0 "[From.GetLeader] прав, мы должны объединиться!"
  BALTIC_events.6.b:0 "Об этом не может быть и речи! [Root.GetNonIdeologyName] остаётся [Root.GetAdjective]!"
  BALTIC_events.601.t:0 "[From.GetNameDefCap] Отказал!"
  BALTIC_events.601.d:0 "[From.GetLeader] отреагировал на [Root.GetAdjective] запрос о присоединении с откровенным отвращением и отказом. Хотя многие уважают право [From.GetNameDef] на самоуправление, неоспоримо, что Прибалтике было бы лучше как единой силе, чем разделенной."
  BALTIC_events.601.a:0 "Мы спасём их от них самих."
  BALTIC_events.601.b:0 "В конце концов, они имеют право на самоопределение."
  BALTIC_events.7.t:0 "[From.GetNameDefCap] запросил [baltic_wargoal_target.GetAdjective] вторжение."
  BALTIC_events.7.d:0 "[From.GetNameDefCap], [Root.GetAdjective] ворота в Западную Европу сегодня предложили план по вторжению в [baltic_wargoal_target.GetNameDef] от имени [Root.GetNameDefCap]. [From.GetLeader] утверждает, что [baltic_wargoal_target.GetAdjective] вторжение было бы неоценимо в наших совместных усилиях по распространению революции по всей Европе и открыло бы больше возможностей для экспансии после того, как [baltic_wargoal_target.GetAdjective] правительство будет свергнуто."
  BALTIC_events.7.a:0 "Вдохновлён!"
  BALTIC_events.7.b:0 "Революция может подождать."
  BALTIC_events.701.t:0 "[From.GetNameDefCap] блокирует [baltic_wargoal_target.GetAdjective] вторжение."
  BALTIC_events.701.d:0 "Просьба [Root.GetAdjective] вторгнуться в [baltic_wargoal_target.GetNonIdeologyName] была заблокирована [From.GetNameDef]. Утверждая, что вторжение будет дорогостоящим и не будет стоить [From.GetAdjective] и [Root.GetAdjective] жизней, которые оно будет стоить, [baltic_wargoal_target.GetNameDef] сегодня не столкнется с какими-либо коммунистическими революционными силами."
  BALTIC_events.701.a:0 "Ладно..."
  BALTIC_events.11.t:0 "Пропаганда лесных братьев"
  BALTIC_events.11.d:0 "Ряд антикоммунистических публикаций попал в руки [Root.GetAdjective] граждан по всей нашей стране. Эта пропаганда атакует сам характер [Root.GetLeader], характеризуя [Root.GetLeader.GetHerHim] как предателя и актив [SOV.GetAdjective]. Характер этих публикаций прославляет [Root.GetAdjective] национализм, отвергая интернациональные ценности коммунистической революции. Несомненно, националистические настроения будут подкреплены подпольным распространением этих публикаций."
  BALTIC_events.11.a:0 "Предатели!"
  BALTIC_events.12.t:0 "Крупный налет лесных братьев в [forest_brothers_raid_state_target.GetName]"
  BALTIC_events.12.d:0 "Они пришли как из ниоткуда, ударив по нескольким крупным промышленным зонам в [forest_brothers_raid_state_target.GetName], причинив серьезный ущерб оборудованию в них. К счастью, нападение произошло ночью, когда фабрики были закрыты, но ущерб государственной собственности был огромным."
  BALTIC_events.12.a:0 "Классовые предатели, все они."
  BALTIC_events.13.t:0 "Схватка с лесными братьями"
  BALTIC_events.13.d:0 "Во время патрулирования в [forest_brothers_raid_state_target.GetName] отряд гарнизона попал в засаду лесных братьев. Хотя потери с нашей стороны были незначительными, весть о стычке быстро распространилась среди местных жителей, и многие начинают видеть в лесных братьях борцов за [Root.GetAdjective] национализм, подрывая легитимность [Root.GetLeader] как лидера."
  BALTIC_events.13.a:0 "Черт их побери!"
  BALTIC_events.14.t:0 "Лесные братья перехватывают оборудование"
  BALTIC_events.14.d:0 "За последние несколько недель с производственных линий пропало несколько винтовок и другой военной техники, которая вышла из цехов, но так и не попала в руки [Root.GetAdjective] Красной Армии. Источником пропавшего оборудования оказались лесные братья. Хотя правительство теперь знает о виновнике этого преступления, потребуется несколько недель, чтобы ужесточить контроль за производственными линиями и убедиться, что ни одна пуля не попадет в ствол винтовки лесного брата."
  BALTIC_events.14.a:0 "Мы покончим с этими предателями!"
  BALTIC_events_7_tt:0 "Получает событие \"§Y[Root.GetNameDefCap] запрашивает вторжение Финляндии§!\""
  BALTIC_events_8_tt:0 "Получает событие \"§Y[Root.GetNameDefCap] запрашивает вторжение Дании§!\""
  BALTIC_events_9_tt:0 "Получает событие '§Y[Root.GetNameDefCap] просит шведского вторжения§!'."
  BALTIC_events_10_tt:0 "Получает событие '§Y[Root.GetNameDefCap] просит польского вторжения§!'."
  BALTIC_events_15_tt:0 "Получает событие '§Y[Root.GetNameDefCap] просит литовского вторжения§!'."
  BALTIC_events_16_tt:0 "Получает событие '§Y[Root.GetNameDefCap] просит латышского вторжения§!'."
  BALTIC_events_17_tt:0 "Получает событие '§Y[Root.GetNameDefCap] просит эстонского вторжения§!'."
  BALTIC_events.18.t:0 "Война пропаганды"
  BALTIC_events.18.d:0 "[From.GetNameDefCap] начал влиять на политику [Root.GetAdjective], распространяя коммунистическую пропаганду через наши улицы и вооружая инакомыслящих. Только противодействуя этой пропаганде, мы можем надеяться на то, что сможем ее полностью запретить и избавиться от угрозы [From.GetAdjective]."
  BALTIC_events.18.a:0 "[Root.GetNameDefCap] никогда не станет коммунистическим!"
  BALTIC_events.19.t:0 "[SOV.GetNameDefCap] доверяет нам [BALTIC_country_to_transfer.GetNonIdeologyName]."
  BALTIC_events.19.desc:0 "Это большой день для [ROOT.GetNameDef]! После доблестной кампании, проведенной нашими товарищами, [SOV.GetNameDefCap] справедливо заявил, что недавно освобожденный [BALTIC_country_to_transfer.GetNonIdeologyName], вместе со своими храбрыми рабочими, попадут под нашу юрисдикцию.[GetExtraBalticTerritories]\n\nЭто приближает нас еще на один шаг к единому Балтийскому государству, достаточно сильному, чтобы дать отпор врагам рабочего класса."
  BALTIC_events.19.extra:0 "Кроме того, они передали под наш контроль оккупированные [BALTIC_loose_territory_country.GetNonIdeologyAdjective] территории, поэтому нам нужно и далее доказывать, что мы достойны стать постоянными хранителями [BALTIC_loose_territory_country.GetNonIdeologyName]."
  BALTIC_events.19.a:0 "Это естественный выбор!"
  BALTIC_entente_events.1.t:0 "[From.GetNonIdeologyName] инвестирует в Балтийский союз"
  BALTIC_entente_events.1.d:0 "Будучи лидером Балтийского союза, [From.GetNameDef] профинансировал новую инициативу для государств-членов союза. Финансирование принесет взаимную выгоду [Root.GetNameDef] и [From.GetNameDef], а также продемонстрирует приверженность свободе и развитию наших народов!"
  BALTIC_entente_events.1.a:0 "Вместе мы станем сильнее."
  BALTIC_entente_events.1.b:0 "Шанс восстановить демократию!"
  BALTIC_entente_events.6.t:0 "[From.GetNonIdeologyName] предлагает объединение"
  BALTIC_entente_events.6.d:0 "Балтийская Антанта претерпела существенные изменения с момента своего первого образования как свободного союза между балтийскими государствами. Теперь балтийские государства настолько политически переплетены, что они практически являются одним государством. Кажется, [From.GetLeader] предлагает преобразовать этот союз в единое государство, объединив балтийские государства в единое военное и гражданское правительство."
  BALTIC_entente_events.6.a:0 "Отлично!"
  BALTIC_entente_events.6.b:0 "Ни в коем случае!"
  LIT_events.1.t:0 "Раздел [SOV.GetAdjective]-[LIT.GetAdjective] [POL.GetNameDef]"
  LIT_events.1.d:0 "Абсолютно ясно, что [LIT.GetLeader] хочет воссоединить [LIT.GetAdjective]ское государство с его старой столицей Вильнюсом. Ясно, что сами [LIT.GetAdjective] практически не представляют угрозы для [POL.GetNameDef], они стремятся разделить страну с [Root.GetNameDef], где [POL.GetAdjective] Украина и Беларусь присоединятся к [Root.GetNameDefCap], а Вильнюс вернется к [LIT.GetNameDef].\n\n[POL.GetNameDefCap], конечно, может отказаться от совместного ультиматума, и такой отказ приведет к состоянию войны между [POL.GetNameDef] и [Root.GetNameDef]."
  LIT_events.1.a:0 "Великолепное предложение!"
  LIT_events.1.b:0 "Мы не будем подписывать никаких соглашений с [LIT.GetLeader]."
  LIT_events.101.t:0 "Ультиматум [SOV.GetAdjective]-[LIT.GetAdjective]"
  LIT_events.101.d:0 "С 1920 года Вильно находилось под контролем [Root.GetNameDef], к постоянному возмущению [LIT.GetNameDef], который считает этот город законной столицей своей страны. Однако напряженность достигла критической точки, и с помощью не кого иного, как [SOV.GetLeader], литовцы теперь требуют раздела Восточной Польши между [SOV.GetAdjective] и Литвой. Если мы согласимся, мы сдадим всю Восточную Польшу, но если откажемся, то станем главной целью коалиции [SOV.GetAdjective]-[LIT.GetAdjective]."
  LIT_events.101.a:0 "Мы сдаемся!"
  LIT_events.101.b:0 "Не без боя!"
  LIT_events.102.t:0 "[From.GetNameDefCap] Принимает!"
  LIT_events.102.d:0 "[SOV.GetNameDefCap] согласилась присоединиться к разделу [POL.GetNameDef], и всё, что нам осталось, это предъявить наши требования [POL.GetAdjective]."
  LIT_events.102.a:0 "Вильнюс в наших руках!"
  LIT_events.103.t:0 "[From.GetNameDefCap] Отклоняет!"
  LIT_events.103.d:0 "[SOV.GetNameDefCap] отказалась присоединиться к разделу [POL.GetNameDef], и хотя мы по-прежнему можем вступить в состояние войны с [POL.GetNameDef], наши министры уверены, что такая война приведет к поражению."
  LIT_events.103.a:0 "Проклятье!"
  LIT_events.104.t:0 "[POL.GetNameDefCap] Отказывается!"
  LIT_events.104.d:0 "Несмотря на подавляющее численное преимущество противника, [POL.GetNameDef] отказалась подчиниться нашим требованиям!"
  LIT_events.104.a:0 "Это война!"
  LIT_events.104.b:0 "Это того не стоит."
  LIT_events.2.t:0 "[From.GetNameDefCap] Просит о мире"
  LIT_events.2.d:0 "Хотя в течение нескольких лет не было вооруженных конфликтов, [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] технически никогда не подписывали никаких официальных мирных договоров. [From.GetLeader] сегодня запросил, чтобы [From.GetNameDef] и [Root.GetNameDef] прекратили боевые действия и продолжили действовать как союзники против растущей угрозы на их общих границах. Хотя [From.GetLeader] все еще заявляет, что Вильно является законной столицей [From.GetNonIdeologyName], [From.GetLeader.GetSheHe] выразил мнение, что в наилучших интересах обеих стран официально сложить оружие и объявить состояние мира."
  LIT_events.2.a:0 "[From.GetLeader.GetSheHeCap] прав."
  LIT_events.2.b:0 "Я так не думаю."
  LIT_events.201.d:0 "[From.GetLeader] явно согласен с настроениями министров [Root.GetAdjective] и решил заключить состояние дружественного мира с [Root.GetNameDef] на данный момент. Наряду с этим миром также приходит взаимная гарантия независимости. Во времена войны мы можем рассчитывать на помощь наших друзей из [From.GetNameDef]!"
  LIT_events.201.a:0 "Великолепно!"
  LIT_events.202.d:0 "[From.GetNameDefCap] отказался подписывать какой-либо официальный мирный договор с [Root.GetNameDef]. Кажется, эта холодная война будет продолжаться бесконечно."
  LIT_events.202.a:0 "Что ж, возможно, мы не примем отказ."
  LIT_events.3.t:0 "[From.GetNameDefCap] Просит о постоянном мире"
  LIT_events.3.d:0 "Точка разногласий между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] за последнее десятилетие была [Root.GetAdjective] оккупацией традиционной столицы [From.GetNonIdeologyName] - Вильнюса. Теперь, когда эти два государства находятся в дружественных отношениях, [From.GetLeader] предлагает вечный мир при условии, что [Root.GetNameDef] откажется от контроля над Вильнюсом и откажется от всех претензий на [From.GetAdjective] территории. Отказ станет разочарованием, но не приведет к тому, что [From.GetNonIdeologyName] развяжет войну с [Root.GetNameDef], утверждает [From.GetLeader]."
  LIT_events.3.a:0 "Звучит разумно."
  LIT_events.3.b:0 "Какой абсурд."
  LIT_events.301.d:1 "Наконец, мирные соглашения были достигнуты между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName], и конфликт, который часто бушевал в относительной тишине с момента создания [Root.GetNameDef], похоже, подошел к концу. Хотя амбиции Содружества до сих пор существуют в сердцах многих [From.GetAdjective] людей, мы уверены, что это новый вид Содружества, основанный на взаимном уважении между союзниками."
  LIT_events.301.a:0 "Мир в наше время!"
  LIT_events.302.d:0 "[From.GetLeader] отказался признать претензию [Root.GetNameDef] на историческую столицу [Root.GetAdjective]. Хотя это и не разрушит мирные отношения между двумя нациями, но очевидно, что это вновь зажгло чувство недоверия у [Root.GetNameDef] к его бывшему противнику."
  LIT_events.302.a:0 "Разочаровывает."
  LIT_events.4.t:0 "[From.GetNameDefCap] предлагает право базирования!"
  LIT_events.4.d:0 "Опасаясь вторжения, министры [From.GetNameDef] предложили разрешить [Root.GetAdjective] войскам разместиться на границах [From.GetNonIdeologyName]. В свою очередь, правительство [From.GetAdjective] ожидает, что [Root.GetNameDef] защитит их от всех, кто угрожает их суверенитету, хотя с войсками уже на их границах, [From.GetNameDef] будет совершенно бессилен противостоять любым требованиям [Root.GetAdjective]..."
  LIT_events.4.a:0 "Звучит как золотая возможность!"
  LIT_events.4.b:0 "Я так не думаю."
  LIT_events.401.d:0 "[From.GetNameDefCap] отклонил наше щедрое предложение, заявив, что не хочет быть втянутым в какие-либо конфликты от имени [Root.GetNonIdeologyName]."
  LIT_events.5.t:0 "[From.GetNameDefCap] требует [784.GetName]"
  LIT_events.5.desc:0 "Со времён Виленского наступления 1919 года традиционная столица Литвы находится в руках [Root.GetNameDef], и за истекшие с тех пор десятилетия это стало предметом спора между нашими двумя странами.\n\nГород стал объектом холодной войны, и сегодня [From.GetLeader] пригрозил, что, если город не будет уступлен [From.GetNameDef], война неизбежна.\n\nДля нас город имеет ограниченную ценность, но он представляет собой последние вздохи былого Содружества, и неужели мы действительно готовы пожертвовать мечтой о Польско-Литовском государстве ради мира?"
  LIT_events.5.a:0 "Это бесполезный город. Забирайте."
  LIT_events.5.b:0 "Мы никогда не сдадимся."
  LIT_events.501.t:0 "Вильнюс вернулся!"
  LIT_events.501.desc:0 "[From.GetNameDefCap] согласился на мирное возвращение Вильнюса, официально завершив десятилетия холодной войны, существовавшей между нашими странами. С возвращением Вильнюса Литва наконец-то снова стала единой."
  LIT_events.502.desc:0 "Неудивительно, что [From.GetNameDef] отклонил требования [Root.GetLeader] передать Вильнюс обратно [Root.GetNameDef]. Хотя дипломатия потерпела неудачу, [Root.GetLeader] еще не исключил возможность войны, и в связи с нарастанием напряженности на границе война кажется неизбежной."
  LIT_events.502.a:0 "Война? Я называю это агрессивными переговорами."
  LIT_events.6.t:0 "[From.GetNameDefCap] предлагает создать Высшую лигу Польши и Литвы"
  LIT_events.6.d:0 "Сегодня прибыла телеграмма из [From.Capital.GetName], в которой предлагается объединение [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] в новую фракцию, способную соперничать с [GER.GetNameDef] и [SOV.GetNameDef]. Будучи националистическими государствами, зажатыми между этими двумя державами, обе нации дипломатически изолированы от европейских держав, а западные демократии вряд ли захотят вступать в конфликт ради защиты двух фашистских государств.\n\n[From.GetLeader] предлагает альтернативу годам конфликта, которые характеризовали отношения [Root.GetAdjective]-[From.GetAdjective] с момента создания их государств. [From.GetLeader.GetSheHeCap] предлагает объединение наших наций в Польско-Литовскую лигу превосходства; союз, основанный на принципах Содружества, но ценящий добродетели национализма."
  LIT_events.6.a:0 "Какое вдохновение!"
  LIT_events.6.b:0 "Я так не думаю."
  LIT_events.601.t:0 "[From.GetNameDef] присоединяется к Лиге"
  LIT_events.601.d:0 "Неудивительно, что поляки согласились присоединиться к Польско-Литовской лиге превосходства. Хотя это не окончательное видение Литвы относительно судьбы Польши, это является жизненно важным первым шагом в обеспечении будущего Прибалтики."
  LIT_events.601.a:0 "Все складывается удачно."
  LIT_events.602.t:0 "[From.GetNameDefCap] отказывается от Лиги"
  LIT_events.602.d:0 "К изумлению [Root.GetAdjective] министров, [From.GetNameDef] отказался присоединиться к Польско-Литовской Лиге Превосходства. Кажется, напряженность между двумя нациями не только не рассеивается, но и может перерасти в вооруженный конфликт в ближайшем будущем, учитывая отказ в сотрудничестве."
  LIT_events.602.a:0 "Возможно, их нужно убедить."
  LIT_events.7.t:0 "[From.GetNameDefCap] запрашивает [POL.GetAdjective] вступление в [Root.GetFactionName]"
  LIT_events.7.d:0 "В рамках усилий по [From.GetAdjective]-[POL.GetAdjective] сотрудничеству, [From.GetAdjective] министр иностранных дел обратился сегодня к [Root.GetAdjective] с просьбой принять [POL.GetNameDef] в состав [Root.GetFactionName]."
  LIT_events.7.a:0 "Прекрасное предложение!"
  LIT_events.7.b:0 "У нас другие планы на Польшу."
  LIT_events.701.t:0 "[From.GetNameDefCap] блокирует вступление [POL.GetAdjective] в [From.GetFactionName]"
  LIT_events.701.d:0 "К сожалению, похоже, что лидеры [From.GetFactionName] считают вступление [POL.GetAdjective] в [From.GetFactionName] препятствием для лучших интересов фракции. Очевидно, что у [From.GetNameDef] есть другие планы на [POL.GetNameDef]."
  LIT_events.701.a:0 "Ну что ж."
  LIT_events.8.t:0 "[From.GetNameDefCap] призывает к объединению"
  LIT_events.8.d:0 "[Root.GetAdjective] чиновники давно пытаются воссоздать Содружество, но литовцы всегда им отказывали. Однако сегодня [From.GetLeader] принял историческое решение предложить воссоединение Польши и Литвы. Но сбивает с толку то, что это предложение не ставит поляков и литовцев на равных, по сути, предложение сделает [From.GetLeader] абсолютным диктатором обеих наций."
  LIT_events.8.a:0 "Это жертва, на которую я готов пойти."
  LIT_events.8.b:0 "Ни за что."
  LIT_events.801.t:0 "[From.GetNameDefCap] соглашается!"
  LIT_events.801.d:0 "[From.GetLeader] ответил на просьбу [Root.GetAdjective] о воссоединении, уйдя с поста диктатора Польши и передав полномочия [Root.GetLeader]. Воссоединившееся Содружество знаменует историческое изменение в общих будущих [From.GetNameDef] и [Root.GetNameDef]."
  LIT_events.801.a:0 "Отлично."
  LIT_events.802.t:0 "[From.GetNameDefCap] отказывает"
  LIT_events.802.d:0 "Кажется, поляки еще не готовы к воссоединению с [Root.GetNameDef]. Несмотря на усилия [Root.GetNameDefCap] представить союз как восстановление старого Содружества, [From.GetAdjective] министры, похоже, совершенно не взволнованы."
  LIT_events.802.a:0 "Возможно, поляков придется убедить."
  LIT_events.9.t:0 "[From.GetNameDefCap] запрашивает польскую оккупацию"
  LIT_events.9.d:0 "Ссылаясь на долгую историю сотрудничества между Польшей и Литвой, [From.GetLeader] предложил [Root.GetFactionName] оккупировать Польшу без инцидентов, если оккупация будет находиться под управлением [From.GetNameDef]. Это будет означать, что Польша потеряет ценные ресурсы, но в таком случае, сопротивление Польши станет проблемой Литвы."
  LIT_events.9.a:0 "Я не вижу причин для отказа."
  LIT_events.9.b:0 "Мы не согласны."
  LIT_events.901.t:0 "[From.GetNameDefCap] передал оккупацию Польши"
  LIT_events.901.d:0 "К [Root.GetAdjective] запросу по передаче контроля оккупированной Польше отнесся с успехом [From.GetNameDef]. [From.GetAdjective] генералы и солдаты возвращаются в [From.GetNonIdeologyName] для перераспределения по военным усилиям, а [Root.GetAdjective] солдаты занимают их место в регионах, ранее удерживаемых Польшей."
  LIT_events.901.a:0 "Слава Литве!"
  LIT_events.902.t:0 "[From.GetNameDefCap] отказал"
  LIT_events.902.d:0 "К [Root.GetAdjective] запросу по передаче контроля оккупированной Польше с негодованием отнесся [From.GetNameDef]. Попытка принять под контроль оккупацию Польши была расценена как попытка [Root.GetLeader] контролировать основные промышленные зоны Польши и подорвать [From.GetAdjective] претензии на польскую территорию."
  LIT_events.902.a:0 "Попытка того стоила."
  LIT_events.10.t:0 "Фалангская гражданская война"
  LIT_monarchy_events.1.t:0 "Дилемма двух королей"
  LIT_monarchy_events.1.desc:0 "Поскольку на тронах как Польши, так и Литвы сидят короли, любые стремления мирно объединить Содружество кажутся весьма маловероятными. Тем не менее, поскольку эти две нации теперь имеют единую идеологию, возможно, есть другой путь вперед. Если мы захотим, мы можем предложить [POL_or_LIT_target.GetLeader] союз двух наших наций как своего рода дипломатическое переосмысление Содружества. Вместе мы можем двигаться вперед как друзья, но порознь каждый из нас падет как враг."
  LIT_monarchy_events.1.a:0 "Союз звучит предпочтительнее."
  LIT_monarchy_events.1.b:0 "Должен быть только один!"
  LIT_monarchy_events.101.t:0 "[From.GetLeader] отказывается от мира"
  LIT_monarchy_events.101.desc:0 "Несмотря на наши усилия по достижению мирного решения, [From.GetLeader] отказался вступать в сердечные отношения с нашей нацией, заявив: "Есть только один король [From.GetNonIdeologyName]". Похоже, война с [From.GetNameDef] теперь неизбежна."
  LIT_monarchy_events.101.a:0 "Как же невежливо."
  LIT_monarchy_events.2.t:0 "Король Миндовг III"
  LIT_monarchy_events.2.desc:0 "4 июня 1918 года Вильгельм Карл фон Урах был демократично избран королем Литвы с ошеломляющей поддержкой, однако вмешательство Германской империи привело к тому, что референдум был объявлен недействительным, а Литва так и не воссоединилась со своим королем. Однако у покойного короля был сын, и теперь, когда германское правление в Литве стало далеким воспоминанием, [Root.GetLeader] пригласил Карла Геро фон Ураха стать новым королем Литвы!\n\nМолодой король был коронован как Миндаугас III и, хотя в настоящее время он ограничен церемониальной ролью, существуют планы по расширению полномочий новой литовской монархии."
  LIT_monarchy_events.2.a:0 "Да здравствует король!"
  LIT_monarchy_events.2_tt:0 "§YМиндаугас III§! становится королем [Root.GetNonIdeologyName]. В то время как §Y[Root.GetLeader]§! останется лидером [Root.GetRulingParty]"
  LAT_events.1.t:0 "Истинный враг"
  LAT_events.1.d:0 "Хотя [Root.GetNameDef] и является независимым, она так и не смогла по-настоящему сбросить цепи империализма со своей страны. [GER.GetAdjective] и [SOV.GetAdjective] имеют одинаковые амбиции и стремления заманить [Root.GetNameDef] в свои империи, мало или совсем не заботясь о праве [Root.GetNameDef] на самоопределение. Хотя многие стремятся вести войну на всех фронтах для поддержания [Root.GetAdjective] независимости, мы должны решить, кто из этих двух держав представляет собой наиболее серьезную угрозу, и принять соответствующие меры для подготовки к вторжению."
 LAT_events.1.a:0 "[SOV.GetNameDefCap] - настоящая угроза!"
 LAT_events.1.b:0 "Мы не можем доверять [GER.GetNameDef]."
 LAT_events.8.t:0 "Латвия в огне"
 LAT_events.8.d:0 "Решение правительства отменить запрет на фашистскую группировку "Молниеносный крест" придало смелости Густаву Целминьшу и его сторонникам, и они стали более активными и жестокими во всей Латвии. Сегодня насилие достигло своего апогея, когда члены "Перконкруста" вооружились и двинулись на Ригу с требованием немедленной капитуляции правительства Латвии.\n\nХотя ясно, что правительство намеревалось сотрудничать с "Перконкрустом", похоже, что группировка не намерена включать [Root.GetLeader] в свой режим."
 LAT_events.8.a:0 "Мы сокрушим этих предателей!"
 LAT_events.8.b:0 "За более сильную Латвию!"

 nsb_coup.0.t:0 "Заговор в офицерском корпусе?"
  nsb_coup.0.desc:0 "Хотя является секретом полишинеля, что несколько наших генералов недовольны сложившейся ситуацией в [Root.GetNameDef], похоже, что некоторые из них, возможно, начали рассматривать более решительные меры по устранению наших разногласий. Проходили многочисленные встречи между различными офицерами в неизвестном месте, которое предположительно находится где-то в [?.Root.meeting_location.GetName].\n\nКонкретные сведения скудны, однако у нас есть основания полагать, что в состав группы входят [coup_member_1.GetName] и [coup_member_2.GetName]. Считается, что последний поддерживает связь с [coup_member_3.GetName], хотя точная природа их взаимоотношений неясна."
  nsb_coup.0.a:0 "Мы должны разобраться с этим."
  nsb_coup.1.t:0 "[Root.GetLeader] берёт под свой контроль правительство"
  nsb_coup.1.desc:0 "После нескольких недель тщательного планирования, группа офицеров под командованием [Root.GetLeader] сегодня осуществили операцию [Root.GetOperationName] – план по захвату власти в правительстве.\n\nДлительный подготовительный период окупился, так как подразделения, лояльные [Root.GetLeader], смогли быстро взять под контроль все важные правительственные здания. Местная охрана и полицейские подразделения, столкнувшись с подавляющим превосходством, сдались без единого выстрела. Блокады дорог вокруг столицы задержали всех министров правительства, попытавшихся скрыться.\n\nКогда прежнее правительство оказалось надёжно под стражей, [Root.GetLeader] поставил остальную часть [Root.GetNameDef] перед фактом. Ожидается, что местные власти быстро примкнут."
  nsb_coup.1.a:0 "Я приветствую наших новых правителей"
  GER_operation_1:0 "Unternehmen Walküre"
