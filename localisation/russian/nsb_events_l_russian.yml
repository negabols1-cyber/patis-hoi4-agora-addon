  NSB_soviet_civil_war_common.100.t:0 "Владивосток в обмен на поддержку"
  NSB_soviet_civil_war_common.100.desc:0 "Оппозиционные группы в [FROM.GetNameDef] планируют восстание против [FROM.GetLeader]. Их главный переговорщик предложил передать Владивосток после их победы над [FROM.GetLeader] в обмен на поддержку в случае гражданской войны."
  NSB_soviet_civil_war_common.100_exiles.desc:0 "Русские оппозиционные группы в Маньчжурии планируют восстание против [FROM.GetLeader]. Их главный переговорщик, $SOV_konstantin_rodzayevsky$, предложил передать Владивосток после того, как они победят [FROM.GetLeader], в обмен на поддержку белых сил Японией во время гражданской войны."
  NSB_soviet_civil_war_common.100.a:0 "Это прекрасно"
  NSB_soviet_civil_war_common.100.b:0 "У нас нет лишней рабочей силы"
  vladivostock_concession_tt:1 "Экспедиционные силы [ROOT.GetAdjective] во главе с §Y[?SOV.SOV_japanese_general.GetName]§! будут направлены для поддержки оппозиционных сил.\n§Y[408.GetName]§! будет передан §Y[ROOT.GetName]§! в конце гражданской войны в [SOV.GetNameDef]"

  NSB_soviet_civil_war_common.101.t:0 "[FROM.GetName] поддерживает наше дело"
  NSB_soviet_civil_war_common.101.desc:0 "Режим [FROM.GetAdjective] согласился с нашей просьбой и окажет нам поддержку в нашей борьбе против сталинистов сильными экспедиционными силами, если дело дойдет до этого. Владивосток станет их, когда бои закончатся."
  NSB_soviet_civil_war_common.101.desc_exiles:0 "Наши друзья [FROM.GetAdjective] согласились с нашей просьбой и поддержат нашу борьбу против большевиков сильными экспедиционными силами, как только мы поднимемся. Передача Владивостока - высокая цена, но иногда приходится идти на жертвы - по крайней мере временно."
  NSB_soviet_civil_war_common.101.a:0 "Это должно обезопасить наш тыл."
  NSB_soviet_civil_war_common.102.t:0 "Япония отказывается от Владивостока"
  NSB_soviet_civil_war_common.102.desc:0 "В неожиданном повороте событий [FROM.GetAdjective] правительство отклонило предложение о передаче порта и территории вокруг Владивостока в обмен на активную поддержку против Сталина."
  NSB_soviet_civil_war_common.102.a:0 "Интересные времена наступают"
  NSB_soviet_civil_war_common.103.t:0 "Северный Сахалин в обмен на оружие"
  NSB_soviet_civil_war_common.103.desc:0 "В обмен на поддержку восстания против Сталина с помощью оборудования советская оппозиция готова передать [ROOT.GetName] всю территорию острова, который они называют Сахалин."
  NSB_soviet_civil_war_common.103.desc_exiles:0 "Представитель русской эмигрантской общины в Маньчжурии обратился к нам с просьбой о поставках в случае новой гражданской войны в России. В обмен на это они заявляют, что готовы признать права [ROOT.GetNameDef] на весь остров Карафуто."
  NSB_soviet_civil_war_common.103.a:0 "Если они хотят иметь хоть какой-то шанс, им понадобится вся возможная помощь"
  NSB_soviet_civil_war_common.103.b:0 "Возможно, мы сможем что-нибудь сделать"
  NSB_soviet_civil_war_common.103.c:0 "По крайней мере, мы можем приобрести для них какое-нибудь оружие"
  NSB_soviet_civil_war_common.103.d:0 "Не стоит рисковать и ввязываться в этот конфликт"
  sakhalin_concession_tt:0 "[655.GetName] будет передан [ROOT.getName] по окончании Гражданской войны в [SOV.GetNameDef]"
  NSB_soviet_civil_war_common.104.t:0 "[FROM.GetNameDefCap] поставит оружие"
  NSB_soviet_civil_war_common.104.desc:0 "Переговоры с [FROM.GetAdjective] увенчались успехом. [FROM.GetName] пообещал поставлять нам оружие в обмен на контроль над северной частью Сахалина."
  NSB_soviet_civil_war_common.104.a:0 "Тяжёлая цена, но надеемся, что оно того стоит"

  NSB_soviet_civil_war_common.105.t:0 "[FROM.GetNameDefCap] отказался поставлять оружие"
  NSB_soviet_civil_war_common.105.desc:0 "Несмотря на предложение [FROM.GetLeader] сделки, которая наверняка была бы выгодна [FROM.GetAdjective], делегация вернулась домой с пустыми руками."
  NSB_soviet_civil_war_common.105.a:0 "Это плохо"

  NSB_soviet_civil_war_common.106.t:0 "Тайная помощь в обмен на Бакинские нефтяные промыслы"
  NSB_soviet_civil_war_common.106.desc_right_opp_before:0 "Оппозиционные группы в [FROM.GetNameDef] планируют переворот против Сталина. Они вышли к нам с просьбой о помощи с тайным военным наращиванием в обмен на будущие права на нефть на Бакинских нефтепромыслах."
  NSB_soviet_civil_war_common.106.desc_right_opp_civil_war:0 "[SOV.GetNameDefCap] во главе с [SOV.GetLeader] восстали против [SOS.GetLeader] и ведут отчаянную гражданскую войну. Мятежники обратились к нам с предложением будущих прав на Бакинские нефтепромыслы в обмен на помощь в наращивании их военного потенциала."
  NSB_soviet_civil_war_common.106.desc_exiles_before:0 "Антикоммунистические группы в Маньчжурии строят планы против [SOV.GetLeader]. Они собираются свергнуть большевиков с помощью еще одной гражданской войны. Представители этой группировки обратились к нам с просьбой помочь в тайном наращивании военной мощи в обмен на будущие права на нефтяные месторождения в Баку."
  NSB_soviet_civil_war_common.106.desc_exiles_civil_war:0 "Русские белые подняли восстание против [SOS.GetLeader], начав еще одну гражданскую войну в России. Мятежники обратились к нам, предложив будущие права на нефтяные месторождения в Баку в обмен на помощь в наращивании их военной мощи."
  NSB_soviet_civil_war_common.106.a:0 "Все, что дестабилизирует Советский Союз — хорошо."
  NSB_soviet_civil_war_common.106.b:0 "Это звучит очень хорошо. Нам стоит даже послать туда военных советников."
  NSB_soviet_civil_war_common.106.c:0 "Давайте не вмешиваться."
  SOV_baku_oil_fields_tt:1 "[ROOT.GetNameDefCap] поможет нарастить военную промышленность в рамках подготовки к гражданской войне в [FROM.GetNameDef]. Взамен [ROOT.GetNameDef] получит §Yправа на ресурсы§! нефтяных месторождений Баку после завершения советской гражданской войны.\n"
  SOV_german_advisors_tt:0 "Два генерала отправятся сражаться на стороне оппозиции в ходе советской гражданской войны.\n"
  
  NSB_soviet_civil_war_common.107.t:0 "[FROM.GetNameDefCap] соглашается помочь в обмен на нефтяные месторождения Баку"
  NSB_soviet_civil_war_common.107.desc_normal:0 "Наш запрос о помощи в развитии наших военных мощностей [FROM.GetNameDef] восприняли хорошо. [FROM.GetAdjective] правительство поможет нам с постройкой заводов в обмен на будущие права на нефть на Кавказе."
  NSB_soviet_civil_war_common.107.desc_advisors:1 "[FROM.GetAdjective] правительство согласилось помочь в строительстве военной промышленности в обмен на будущие права на нефть. К тому же, они согласны направить несколько военных \"советников\", которые будут с нами до завершения гражданской войны."
  NSB_soviet_civil_war_common.107.a:0 "Хорошие новости"

  NSB_soviet_civil_war_common.108.t:0 "[FROM.GetNameDefCap] отказались помочь"
  NSB_soviet_civil_war_common.108.desc:1 "Наши переговоры с [FROM.GetNameDef] оказались безрезультатными. Даже предложив будущие права на нефть, они нам не помогут построить дополнительную военную промышленность."
  NSB_soviet_civil_war_common.108.a:0 "Тогда нам придется справляться самим"

  NSB_soviet_civil_war_common.109.t:0 "Отправка \"советников\" в [SOV.GetNameDef]"
  NSB_soviet_civil_war_common.109.desc:0 "В России снова разразилась гражданская война. [SOV.GetLeader] ведет войну против [SOS.Getleader], и если восстание будет успешным, мы получим огромное преимущество. Мы обещали им поддержку, и [?ROOT.SOV_foreign_military_advisor_1.GetName] с [?ROOT.SOV_foreign_military_advisor_2.GetName] готовы отправиться в [SOV.GetName] чтобы помочь с планированием войны и получить ценную информацию о военных возможностях [SOV.GetAdjective]."
  NSB_soviet_civil_war_common.109.a:0 "Это будет очень интересно"

  NSB_soviet_civil_war_common.110.t:0 "Помощь в организации восстания на Украине"
  NSB_soviet_civil_war_common.110.desc:0 "Советская оппозиция попросила нас о помощи в их борьбе за власть. Они хотят, чтобы мы тайно обучили украинское ополчение в обмен на будущие ресурсы на независимой Украине."

  NSB_soviet_civil_war_common.110.a:0 "Это предложение слишком заманчиво, чтобы отказаться от него"
  NSB_soviet_civil_war_common.110.b:0 "Давай не будем в это вмешиваться"
  SOV_ukraine_insurrection_tt:1 "[ROOT.GetName] будет тренировать украинское ополчение в обмен на будущие §Yправа на ресурсы§! в Украине.\n"

  NSB_soviet_civil_war_common.111.t:2 "[FROM.GetNameDefCap] будет тренировать украинское ополчение"
  NSB_soviet_civil_war_common.111.desc:1 "[FROM.GetNameDefCap] согласился начать тренировку украинского ополчения. Затем, когда подразделения будут готовы, их переправят контрабандой на Украину, где они поднимут восстание против сталинского режима."
  NSB_soviet_civil_war_common.111.a:0 "Это должно сработать"

  NSB_soviet_civil_war_common.112.t:1 "[FROM.GetNameDefCap] отвергает украинское предложение"
  NSB_soviet_civil_war_common.112.desc:0 "После нескольких дней дискуссий [FROM.GetLeader] внезапно решил не поддерживать украинское восстание, оставив наших переговорщиков в недоумении, почему их предложение было отклонено."
  NSB_soviet_civil_war_common.112.a:0 "Очень жаль"

  NSB_soviet_civil_war_common.113.t:0 "Украинское ополчение готово"
  NSB_soviet_civil_war_common.113.desc_before:0 "Наши немецкие контакты сообщают, что украинское ополчение, которое они обучили, готово нанести удар. Отряды снаряжены, обучены и тайно переброшены на Украину, ожидая начала войны."
  NSB_soviet_civil_war_common.113.desc_started:0 "Наши немецкие контакты сообщают, что украинское ополчение, которое они обучили, готово нанести удар. Отряды снаряжены и тайно переброшены в стратегически важные районы. Приказ атаковать отдан, и восстание вот-вот начнётся."
  NSB_soviet_civil_war_common.113.a:0 "Ещё один враг для [SOS.GetLeader]"
  NSB_soviet_civil_war_common.113.b:0 "Хорошо знать"
  NSB_soviet_civil_war_common.113.c:0 "Постой, что?"
  NSB_soviet_civil_war_common.114.t:0 "Украинское восстание"
  NSB_soviet_civil_war_common.114.desc:0 "Обученные немцами украинские солдаты захватили контроль над ключевыми городами по всей Украине. Образовано предварительное правительство во главе с [UKR.GetLeader], и [UKR.GetNameDef] объявила себя независимым государством."
  NSB_soviet_civil_war_common.114.a:0 "Это неприемлемо!"
  NSB_soviet_civil_war_common.114.b:0 "Что ж, в конце концов мы согласились на это"
  NSB_soviet_civil_war_common.114.c:0 "Это нанесёт серьёзный удар [SOS.GetLeader]"
  NSB_soviet_civil_war_common.115.t:0 "Будущая независимость Белоруссии в обмен на поддержку"
  NSB_soviet_civil_war_common.115.desc:0 "Советская оппозиция обратилась к нам с просьбой о тайной поддержке. В обмен на поставки и помощь в наращивании военной мощи они готовы принять возвращение правительства [BLR.GetAdjective] в изгнании."
  NSB_soviet_civil_war_common.115.a:0 "Великолепная идея"
  NSB_soviet_civil_war_common.115.b:0 "У нас и без того достаточно своих проблем"
  SOV_belarus_tt:0 "[BLR.GetNameDefCap] будет освобождена как независимая страна в конце [GetSovietCivilWarName]"
  NSB_soviet_civil_war_common.116.t:0 "Поддержите наше дело [FROM.GetNameDefCap]"
  NSB_soviet_civil_war_common.116.desc:0 "Наши переговоры с [FROM.GetAdjective] завершились успешно. В обмен на разрешение правительству [BLR.GetAdjective] в изгнании вернуться после войны правительство [FROM.GetAdjective] окажет нам поддержку в наращивании военной мощи и обеспечит техникой."
  NSB_soviet_civil_war_common.116.a:0 "Хорошо"
  NSB_soviet_civil_war_common.117.t:0 "Отказ в поддержке от [FROM.GetNameDef]"
  NSB_soviet_civil_war_common.117.desc:0 "Наши переговоры с [FROM.GetAdjective] не принесли никаких конкретных результатов. [FROM.GetLeader] отклонил наше предложение, поэтому никакой помощи от [FROM.GetName] не будет."
  NSB_soviet_civil_war_common.117.a:0 "Придется обходиться без их помощи"
  NSB_soviet_civil_war_common.118.t:0 "Советская оппозиция просит поддержки"
  NSB_soviet_civil_war_common.118.desc:0 "Члены советской антисталинистской оппозиции ведут кампанию против сталинского режима. Был организован ряд антисталинских митингов, они проводят здесь, в [ROOT.GetName], кампании по сбору средств.\nПомимо привлечения общественной поддержки к своему делу, они тайно обратились к нам с просьбой предоставить оружие для поддержки восстания."
  NSB_soviet_civil_war_common.118.a:0 "Давайте снабдим их винтовками"
  NSB_soviet_civil_war_common.118.b:0 "Мы можем по крайней мере выделить несколько винтовок"
  NSB_soviet_civil_war_common.118.c:0 "У нас их нет, но мы, может быть, купим их"
  NSB_soviet_civil_war_common.118.d:0 "Нет смысла вмешиваться"
  NSB_soviet_civil_war_common.119.t:0 "[FROM.GetNameDefCap] поддерживает наше дело"
  NSB_soviet_civil_war_common.119.desc:0 "Правительство [FROM.GetAdjective] согласилось тайно снабдить нас оружием."
  NSB_soviet_civil_war_common.119.a:0 "Отлично"
  NSB_soviet_civil_war_common.120.t:0 "Правительство [FROM.GetAdjective] не поддержит нас"
  NSB_soviet_civil_war_common.120.desc:0 "Наш сбор средств в [FROM.GetNameDef] прошел успешно. Однако правительство отказалось предоставить нам оружие."
  NSB_soviet_civil_war_common.120.a:0 "Очень жаль"
  NSB_soviet_civil_war_common.121.t:0 "[FROM.GetName] просит нашей защиты"
  NSB_soviet_civil_war_common.121.desc:0 "[FROM.GetLeader] прислал делегацию с просьбой о поддержке против [SOS.GetNameDef].\n[FROM.GetAdjective] правительство готово отказаться от суверенитета в обмен на [ROOT.GetAdjective] вступление в войну."
  NSB_soviet_civil_war_common.121.a:0 "Это то, чего мы ждали"
  NSB_soviet_civil_war_common.121.b:0 "Не стоит ввязываться в это"
  NSB_soviet_civil_war_common.122.t:0 "[FROM.GetName] принимает наше предложение"
  NSB_soviet_civil_war_common.122.desc:1 "Жаль, что так получилось. Но чтобы вернуть контроль над потерянным, мы должны пойти на жертвы. Это лишь временная чрезвычайная мера.\nКак только большевики будут повержены, мы будем стремиться к полной независимости."
  NSB_soviet_civil_war_common.122.a:0 "К победе"
  NSB_soviet_civil_war_common.123.t:0 "[FROM.GetName] покидает нас"
  NSB_soviet_civil_war_common.123.desc:0 "В самый тяжелый час [FROM.GetLeader] решил отказаться от поддержки, которую обещал [FROM.GetNameDef], хотя мы были готовы пойти на крайние меры, чтобы обеспечить ее."
  NSB_soviet_civil_war_common.123.a:0 "Этого не забудут!"
  NSB_soviet_civil_war_common.124.t:0 "[FROM.GetAdjective] заводы построены"
  NSB_soviet_civil_war_common.124.desc:0 "Заводы, построенные в [?SOV_civil_war_start_state.GetName], готовы к запуску. Это значительно поможет нашему военному делу и сейчас, и в будущем."
  NSB_soviet_civil_war_common.124.a:0 "Хорошо"
  NSB_soviet_civil_war_common.125.t:0 "Дезертирство противника"
  NSB_soviet_civil_war_common.125.desc:0 "После того как мы захватили [?SOV.SOV_defections_army_state.GetName], армия [SOS.GetLeader] теряет дух. Солдаты массово дезертируют, некоторые просто складывают оружие, а другие, на самом деле, присоединяются к нашему делу."
  NSB_soviet_civil_war_common.125.a:0 "Великолепно"
  SOS_army_desertions_tt:0 "Армия §Y[SOS.GetNameWithFlag]§! теряет §Yтехнику§!, §Yлюдские ресурсы§! и §Yорганизацию§!, а некоторые части переходят на сторону §Y[ROOT.GetNameWithFlag]§!."
  NSB_soviet_civil_war_common.126.t:0 "Захвачены армейские склады в [?SOV.SOV_captured_stockpile_state.GetName]"
  NSB_soviet_civil_war_common.126.desc:0 "[SOS.GetAdjective] армейский склад захвачен нашими победоносными войсками в [?SOV.SOV_captured_stockpile_state.GetName]. Отступающие [SOS.GetAdjective] пытались уничтожить его, но нашим солдатам удалось захватить часть техники."
  NSB_soviet_civil_war_common.126.a:0 "Используем ее во благо"
  NSB_soviet_civil_war_common.127.t:0 "Переход флота на сторону восставших"
  NSB_soviet_civil_war_common.127.desc:0 "После нашей победы в [?SOV.SOV_defections_navy_state.GetName] несколько офицеров флота пришли к пониманию, что они сражаются за безнадежное дело. В результате ряд кораблей покинули Красный флот, а их команды предложили перейти на нашу сторону."
  NSB_soviet_civil_war_common.127.a:0 "Дареному коню в зубы не смотрят"
  SOS_navy_desertions_tt:0 "Военно-морские части из §Y[SOS.GetNameWithFlag]§! переходят на сторону §Y[ROOT.GetNameWithFlag]§!."
  NSB_soviet_civil_war_common.128.t:0 "Беспорядки в [SOS.GetNameDef]"
  NSB_soviet_civil_war_common.128.desc:0 "Поступают сообщения, что наши последние победы на полях сражений, такие как взятие [?SOV.SOV_civilian_unrest_state.GetName], привели к протестам по всей территории [SOS.GetNameDef]. Разумеется, приспешники [SOS.GetLeader] жестоко подавляют эти протесты, но в любом случае, это, несомненно, негативно скажется на военных усилиях [SOS.GetAdjective]."
  NSB_soviet_civil_war_common.128.a:0 "Мы победим"
  SOS_civilian_unrest_tt:0 "Промышленность в §Y[SOS.GetNameWithFlag]§! терпит убытки.\n Предел капитуляции §Y[SOS.GetLeader]§! снижается."
  NSB_soviet_civil_war_common.129.t:0 "Отправление [?SOV.SOV_japanese_general.GetName]"
  NSB_soviet_civil_war_common.129.desc:0 "В то время, как в России бушует гражданская война, пришло время исполнить наши обещания. [?SOV.SOV_japanese_general.GetName] возглавит экспедиционный корпус [ROOT.GetAdjective], чтобы добиться победы и славы и защитить честь [ROOT.GetNameDef]."
  NSB_soviet_civil_war_common.129.a:0 "Каждый должен исполнять свой долг"
  NSB_soviet_nationalist.001.t:0 "Националистическое восстание в [?SOV.SOV_nationalist_country.GetNameDef]"
  NSB_soviet_nationalist.001.desc:0 "[?SOV.SOV_nationalist_country.GetLeader] объявил/а независимой [?SOV.SOV_nationalist_country.GetName]. [SOS.GetLeader] назвал/а это актом предательства и приказал/а поймать и расстрелять мятежников. В результате, [SOS.GetNameDef] и [?SOV.SOV_nationalist_country.GetNameDef] теперь находятся в состоянии войны."
  SOV_breakaway_country_flag:0 "Объявил независимость от Советского Союза"
  NSB_soviet_nationalist.001.a:0 "Враг нашего врага — наш друг"
  NSB_soviet_nationalist.001.b:0 "Это законная [ROOT.GetAdjective] территория!"
  indepence_war_threat:0 "Провозглашение независимости"
  NSB_soviet_nationalist.002.t:0 "[FROM.GetNameDefCap] требует подчинения"
  NSB_soviet_nationalist.002.desc:0 "[FROM.GetAdjective] посол обратился к нашему правительству с "просьбой" признать [FROM.GetNameDef] истинным и верховным правительством [ROOT.GetName]. Взамен этого они предлагают "определенную степень автономии"."
  NSB_soviet_nationalist.002.a:0 "Мы победили Советский Союз, сможем победить и их."
  NSB_soviet_nationalist.002.b:0 "Может быть, это и к лучшему."
  NSB_soviet_nationalist.003.t:0 "[FROM.GetNameDefCap] принимает"
  NSB_soviet_nationalist.003.desc:0 "[FROM.GetLeader] не увидел/а причин не принимать наши законные требования. [FROM.GetNameDef] вернется в Империю, с некоторыми правами на самоуправление."
  NSB_soviet_nationalist.003.a:0 "Великий день для России"
  NSB_soviet_nationalist.004.t:0 "[FROM.GetNameDefCap] отказывается"
  NSB_soviet_nationalist.004.desc:0 "Несмотря на давление и полное осознание шаткого положения [FROM.GetLeader.GetHerHis] страны, [FROM.GetLeader] отказался принять наше великодушное предложение об автономии в составе возрожденной Российской империи."
  NSB_soviet_nationalist.004.a:0 "Мы должны заставить их подчиниться!"
  NSB_soviet_nationalist.004.b:0 "Полагаю, придется немного подождать"

  NSB_soviet_permanent_revolution.1.t:0 "Троцкистские революционеры подстрекают массы"
  NSB_soviet_permanent_revolution.1.desc:0 "Троцкисты из [FROM.GetNameDef] будоражат массы революционной пропагандой. Они даже обещают прийти на помощь [ROOT.GetAdjective] пролетариату, если тот поднимет восстание против государства. Ситуация грозит выйти из-под контроля."
  NSB_soviet_permanent_revolution.1.a:0 "Это по сути акт агрессии"
  NSB_soviet_for_the_common_good.1.t:0 "Во имя общего блага"
  NSB_soviet_for_the_common_good.1.desc:0 "Коллектив сильнее индивидуума. Это справедливо и для экономики. [SOV.GetNameDefCap] решил реорганизовать экономику всех своих союзников с целью служить коллективу, а не отдельной стране. Это означает, что мы изменим нынешний подход к делам и, возможно, столкнемся с некоторыми трудностями на начальном этапе, но в конечном итоге это принесет пользу всем."
  NSB_soviet_for_the_common_good.1.a:0 "Во имя общего блага!"

  NSB_soviet_fascist_tsarist.1.t:0 "Членство в Панславянском союзе"
  NSB_soviet_fascist_tsarist.1.desc:0 "Когда мир вокруг нас погрузился в насилие, [FROM.GetNameDef] шагнул вперед и поклялся защищать всех славянских людей от тех, кто хочет навредить нам. Они пригласили нас вступить в новый "Всеславянский союз", в котором, по их утверждениям, все славянские народы будут представлены справедливо и справедливо, защищены великой [FROM.GetAdjective] армией."
  NSB_soviet_fascist_tsarist.1.a:0 "Мы примем участие в этом великом объединении славянских народов!"
  NSB_soviet_fascist_tsarist.1.b:0 "Их защита не стоит нашей независимости."
  NSB_soviet_fascist_tsarist.2.t:0 "Всеславянский союз: [FROM.GetNameDef] принимает"
  NSB_soviet_fascist_tsarist.2.desc:0 "Мы только что получили сообщение от правительства [FROM.GetAdjective]: [FROM.GetNameDef] принял наше приглашение о членстве во Всеславянском союзе."
  NSB_soviet_fascist_tsarist.2.a:0 "Мудрое решение."
  NSB_soviet_fascist_tsarist.3.t:0 "Всеславянский союз: [FROM.GetNameDef] отклоняет"
  NSB_soviet_fascist_tsarist.3.desc:0 "Представители правительства [FROM.GetAdjective] сообщили нам, что они категорически отвергают любую возможность своего добровольного участия во Всеславянском союзе."
  NSB_soviet_fascist_tsarist.3.a:0 "Всеславянский союз станет реальностью с их согласия или без него."
  NSB_soviet_fascist_tsarist.4.t:0 "[FROM.GetNameDef] влияет на нашу политику"
  NSB_soviet_fascist_tsarist.4.desc:0 "Нас достигли тревожные сообщения о [FROM.GetAdjective] агитаторах, распространяющих фашистскую пропаганду внутри нашей страны, а также о [FROM.GetAdjective] деньгах, спонсирующих внутренние фашистские партийные мероприятия и политические расходы."
  NSB_soviet_fascist_tsarist.4.a:0 "Мы должны быть начеку, иначе нас могут завоевать без боя."
  NSB_soviet_fascist_tsarist.5.t:0 "Приглашение присоединиться к [FROM.GetFactionName]"
  NSB_soviet_fascist_tsarist.5.desc:0 "Признавая сходство наших взглядов на мир, [FROM.GetNameDef] пригласили нас в [FROM.GetFactionName], предлагая нам свою военную и экономическую поддержку в то время, как мы ищем славное будущее для нашей нации!"
  NSB_soviet_fascist_tsarist.5.a:0 "Под [FROM.GetAdjective] руководством мы сильнее."
  NSB_soviet_fascist_tsarist.5.b:0 "Нам не нужны русские, чтобы быть сильными!"
  NSB_soviet_fascist_tsarist.6.t:0 "[FROM.GetNameDef] присоединяется к [ROOT.GetFactionName]"
  NSB_soviet_fascist_tsarist.6.desc:0 "[FROM.GetNameDef] принял наше предложение о союзе и теперь присоединился к нашей фракции!"
  NSB_soviet_fascist_tsarist.6.a:0 "Теперь они образуют наш плацдарм в Америке."
  NSB_soviet_fascist_tsarist.7.t:0 "[FROM.GetNameDef] отклонил приглашение"
  NSB_soviet_fascist_tsarist.7.desc:0 "[FROM.GetAdjective] правительство сообщило нам, что они отклоняют наше предложение о союзе. Они предпочитают оставаться в Америке в одиночку."
  NSB_soviet_fascist_tsarist.7.a:0 "Дураки!"
  NSB_soviet_fascist_tsarist.8.desc:0 "[FROM.GetNameDef] признаёт, что теперь у нас схожие взгляды на мир, и пригласил в [FROM.GetFactionName], предлагая свою постоянную военную и экономическую поддержку в поисках блестящего будущего для нашей нации. Они также поддержали подъём нашей партии к власти в [ROOT.GetNameDef]!"
  NSB_soviet_fascist_tsarist.9.desc:0 "[FROM.GetNameDef] наконец-то стал фашистским государством. В связи с этим им было предложено, и они приняли членство в нашем союзе."
  NSB_soviet_fascist_tsarist.10.desc:0 "[FROM.GetNameDef] наконец-то стал фашистским государством. Однако, несмотря на всю нашу помощь в приведении их фашистской партии к власти и предложение членства в нашем союзе, они отклонили наше приглашение и решили остаться в стороне."
  NSB_soviet_fascist_tsarist.11.t:0 "[FROM.GetAdjective] Морские вооружения"
  NSB_soviet_fascist_tsarist.11.desc:0 "До нас дошли сообщения о том, что [FROM.GetNameDef] расширяет свою военно-морскую инфраструктуру на Дальнем Востоке. Это не предвещает ничего хорошего для статус-кво на Дальнем Востоке..."
  NSB_soviet_fascist_tsarist.11.a:0 "Они, несомненно, хотят бросить вызов нашей гегемонии."
  NSB_soviet_fascist_tsarist.12.t:0 "[FROM.GetAdjective] Анти-японская пропаганда"
  NSB_soviet_fascist_tsarist.12.desc:0 "[FROM.GetAdjective] газеты печатают все больше статей, критикующих [ROOT.GetAdjective] подвиги на Дальнем Востоке, а их политики используют все более резкую риторику, осуждая нас и напоминая [FROM.GetAdjective] об их оскорбительных потерях в войне 1905 года. Самые ярые агитаторы уже призывают "отомстить за Цусиму"!"
  NSB_soviet_fascist_tsarist.12.a:0 "Нам стоит подготовиться к войне со старым врагом…"
  NSB_soviet_fascist_tsarist.13.t:0 "[FROM.GetAdjective] Сосредоточение на Камчатке"
  NSB_soviet_fascist_tsarist.13.desc:0 "Из отчетов следует, что [FROM.GetNameDef] в процессе массового расширения своей военной инфраструктуры на Камчатке. Военные аналитики полагают, что эти объекты предназначены только для усиления [FROM.GetAdjective] проекции силы против наших войск на Аляске - и в худшем случае, как прямой плацдарм для вторжения!"
  NSB_soviet_fascist_tsarist.13.a:0 "Нам стоит принять во внимание эту информацию…"
  NSB_soviet_fascist_tsarist.14.t:0 "Возвращение царя"
  NSB_soviet_fascist_tsarist.14.desc:0 "Несправедливость, постигшая нашу нацию десятилетия назад, наконец-то устранена. В подобающе величественной и пышной церемонии в Успенском соборе великий князь Владимир Кириллович был коронован как царь Владимир I, к безудержному восторгу толпы.\n\nЗатем царь возглавил шествие из ворот Кремля, приветствуя ликующие массы и лично посещая впечатляющие военные парады в его честь.\n\nВ великолепной речи новый царь превознес добродетели русского народа и поклялся вновь повести нацию по пути к восстановлению ее былой славы."
  NSB_soviet_fascist_tsarist.14.a:0 "Слава!"
  NSB_soviet_fascist_tsarist.14.b:0 "Время Романовых!"
  NSB_soviet_fascist_tsarist.15.t:1 "Коронация патриарха Мелетия"
  NSB_soviet_fascist_tsarist.15.desc:1 "По мере того, как во всей стране чувствуется растущее значение религии, а статус церкви вновь достиг — даже превысил — то, чем он был раньше, вполне естественно, что мы укрепляем наши обязательства перед Богом, возводя Его ведущего представителя в положение национального лидера.\n\nСегодня, в двух торжественных церемониях в Храме Христа Спасителя и в Успенском соборе в Москве Милетия, епарха Харбинского и Маньчжурского, избранного в знак признания его служения делу эмиграции, возвели и на престол патриарха Московского и всея Руси, и короновали царём всея Руси.\n\nС этим окончательным, абсолютным объединением церкви и государства не осталось никаких препятствий для выполнения Божьей воли на этом земном театре военных действий..."
  NSB_soviet_fascist_tsarist.15.a:0 "Да свершится воля твоя, как на небе, так и на земле."
  NSB_soviet_fascist_tsarist.16.t:0 "Тройственное согласие"
  NSB_soviet_fascist_tsarist.16.desc:0 "Преодолев внутренние потрясения и установив новое правительство, дружественное нам, [SOV.GetNameDef] теперь предложил нам восстановить наш старый союз, сдержав [GER.GetAdjective] агрессию в Европе."
  NSB_soviet_fascist_tsarist.16.a:0 "Отличная идея!"
  NSB_soviet_fascist_tsarist.16.b:0 "Мы не забыли, чего стоило их обещание в прошлый раз."
  NSB_soviet_fascist_tsarist.17.t:0 "Тройственное согласие — предложение принято"
  NSB_soviet_fascist_tsarist.17.desc:1 "[FROM.GetNameDefCap] сообщает нам о том, что принимает наше предложение о союзе и незамедлительно предпринял шаги по расширению с нами дипломатических связей."
  NSB_soviet_fascist_tsarist.17.a:0 "Это даст немцам о чём поволноваться."
  NSB_soviet_fascist_tsarist.18.t:0 "Тройственный союз — предложение отклонено"
  NSB_soviet_fascist_tsarist.18.desc:0 "[FROM.GetNameDef] сообщил нам, что в данный момент не видит никакой пользы в заключении с нами союза."
  NSB_soviet_fascist_tsarist.18.a:0 "Удручающий провал в дипломатии..."
  NSB_soviet_fascist_tsarist.19.desc:0 "Правительства [FROM.GetAdjective] и [SOV.GetAdjective] начали переговоры о восстановлении союза Тройственного согласия, некогда существовавшего между нашими державами. Теперь они намерены претворить этот план в жизнь и направили нам приглашение присоединиться к ним."
  NSB_soviet_fascist_tsarist.19.a:0 "Мы согласимся во имя будущей стабильности Европы."
  NSB_soviet_fascist_tsarist.19.b:0 "Их "Тройственное согласие", к сожалению, будет всего лишь двойным."
  NSB_soviet_fascist_tsarist.20.a:0 "Вместе мы непобедимы!"
  NSB_soviet_fascist_tsarist.21.a:0 "По крайней мере, у нас есть русские."
  NSB_soviet_fascist_tsarist.22.t:0 "Берлинско-Московская ось"
  NSB_soviet_fascist_tsarist.22.desc:0 "[SOV.GetAdjective] представители вышли к нам с предложением о союзе. Они предлагают, что поскольку их новое правительство и мы разделяем сходные взгляды на мир и интересы, то благоразумно нам сотрудничать в большей степени в сфере экономики и военного дела."
  NSB_soviet_fascist_tsarist.22.a:0 "Эта новая Ось - та, вокруг которой будет вращаться мир!"
  NSB_soviet_fascist_tsarist.22.b:0 "Союз? Мы так не думаем."
  NSB_soviet_fascist_tsarist.23.t:0 "Ось Берлин-Москва: Предложение принято"
  NSB_soviet_fascist_tsarist.23.desc:0 "[SOV.GetAdjective] правительство сообщает нам, что они с радостью примут участие в создании новой дипломатической Оси. Они уже предпринимают приготовления для отправки дипломатических и военных связных."
  NSB_soviet_fascist_tsarist.24.t:0 "Ось Берлин-Москва: Предложение отклонено"
  NSB_soviet_fascist_tsarist.24.desc:0 "[SOV.GetAdjective] дипломаты сегодня сообщили нам об отклонении нашего предложения правительством."
  NSB_soviet_fascist_tsarist.24.a:0 "Очень прискорбно... Неужели это не признак злого умысла?"
  NSB_soviet_fascist_tsarist.25.t:0 "Ось Токио"
  NSB_soviet_fascist_tsarist.25.desc:0 "[SOV.GetAdjective] представители выдвинули предложение о включении [JAP.GetNameDef] в наш союз. Учитывая историю напряженных отношений между [SOV.GetName] и [JAP.GetName], они предлагают нам связаться с ними и выступить посредниками между двумя державами."
  NSB_soviet_fascist_tsarist.25.a:0 "Мы немедленно отправим посланников."
  NSB_soviet_fascist_tsarist.25.b:0 "Мы опасаемся, что наши интересы не совпадают с японскими."
  NSB_soviet_fascist_tsarist.26.t:0 "Токийская ось - [JAP.GetName] принят"
  NSB_soviet_fascist_tsarist.26.desc:0 "Мы получили ответ от [GER.GetAdjective] правительства: они сообщают нам, что посредничали между нами и японцами, и японцы приняли предложение!"
  NSB_soviet_fascist_tsarist.26.a:0 "Отличные новости - наш восточный фланг в безопасности!"
  NSB_soviet_fascist_tsarist.27.t:0 "Токийская ось - [JAP.GetName] отклонил"
  NSB_soviet_fascist_tsarist.27.desc:0 "[GER.GetAdjective] правительство сообщает нам, что, несмотря на все их усилия, японцы, к сожалению, отклонили наше предложение о союзе."
  NSB_soviet_fascist_tsarist.27.a:0 "Серьезная неудача..."
  NSB_soviet_fascist_tsarist.28.t:0 "Токийская ось - [GER.GetName] отклонил"
  NSB_soviet_fascist_tsarist.28.desc:0 "[GER.GetAdjective] правительство рассмотрело наше предложение о вступлении Японии в наш союз, но, к сожалению, сообщает нам, что в настоящее время они не видят в таком союзе свою выгоду."
  NSB_soviet_fascist_tsarist.28.a:0 "Жаль! У них наверняка есть для этого веские причины."
  NSB_soviet_fascist_tsarist.29.desc:0 "[$GER.GetAdjective$] связался с нами с предложением о [SOV.GetAdjective$] союзе между нашими тремя державами. Он утверждает, что при объединении троих из нас весь остальной мир не сможет противостоять нам."
  NSB_soviet_fascist_tsarist.29.a:0 "Пусть этот союз будет финальной точкой в дипломатии!"
  NSB_soviet_fascist_tsarist.29.b:0 "История поведала нам о судьбах триумвиратов... Мы отказываемся."
  NSB_soviet_fascist_tsarist.30.desc:0 "[$JAP.GetName$] сообщает нам, что они решили принять [SOV.GetAdjective$] предложение и готовы присоединиться к нашему союзу как можно раньше."
  NSB_soviet_fascist_tsarist.30.a:0 "Великолепно!"
  NSB_soviet_fascist_tsarist.31.desc:0 "[$JAP.GetName$] с сожалением сообщает нам, что они считают, что [SOV.GetAdjective$] предложение в настоящее время не в их интересах, и поэтому вынуждены отклонить его."
  NSB_soviet_fascist_tsarist.31.a:0 "Мы справимся без них."
  NSB_soviet_fascist_tsarist.32.t:0 "Власов пленён"
  NSB_soviet_fascist_tsarist.32.desc:0 "Во время последнего отступления врага нашими силами был захвачен высокопоставленный [SOV.GetAdjective$] генерал. Находясь в нашем плену, этот генерал, Андрей Власов, заявил о своем "антибольшевизме" и теперь предлагает сформировать несколько дивизий из пленных русских для борьбы против "сталинизма" на нашей стороне."
  NSB_soviet_fascist_tsarist.32.a:0 "Любой союзник в борьбе против большевизма приветствуется."
  NSB_soviet_fascist_tsarist.32.b:0 "Мы не можем ему доверять!"
  NSB_soviet_fascist_tsarist.33.desc:0 "К нам поступили сведения о том, что наш генерал [SOV_andrey_vlasov.GetName] попал в плен к врагу. Мы можем только догадываться о его судьбе..."
  NSB_soviet_fascist_tsarist.33.a:0 "Неприятно, но сейчас у нас есть дела поважнее!"
  nsb_news.301.t:0 "Объединение Горных республик"
  nsb_news.301.d:0 "В духе Тапы Чермоева Горные республики вновь объединились под предводительством [FROM.GetLeader]. Они заявляют, что будут отбиваться от любых иностранных захватчиков, вторгающихся на северокавказские территории, и что займут свое место в анналах истории. Итак, образована Горная республика Северного Кавказа!"
  nsb_news.301.a:0 "Мы больше не разобщены!"
  nsb_news.301.b:0 "Интересно"
  nsb_news.302.t:0 "Воссоединение Закавказья"
  nsb_news.302.d:0 "В первый раз это было в начале Гражданской войны в России, но вскоре распалось. Во второй раз — как Советская республика, распавшаяся после Советской Конституции 1936 года. Теперь в третий раз [FROM.GetLeader] сделал попытку воссоединить закавказские государства, и они снова готовы не только защищать свои территории, но и расширяться на другие территории. Время покажет, что они сделают."
  nsb_news.302.a:0 "Третий раз удача"
  nsb_news.302.b:0 "Снова?"
  nsb_news.303.t:0 "Сибирь объединяется"
  nsb_news.303.d:0 "После веков правления под Россией, Сибирь сейчас не только регион в составе иностранной державы, но политическое образование, которое объединено и готово сражаться за свои права любой ценой. Сибиряки ликуют, поскольку дни империализма остались позади, и они могут жить в независимом государстве, без иностранного вмешательства. Республика провозгласила, что не будет сидеть сложа руки, потому что есть еще сибиряки, которые нуждаются в защите и освобождении, любой ценой!"
  nsb_news.303.a:0 "Наконец-то, Сибирь свободна от уз империализма!"
  nsb_news.303.b:0 "Влияние России на Восток уменьшается..."

  nsb_news.304.t:0 "Идель-Урал вернулся"
  nsb_news.304.d:0 "Впервые со времен гражданской войны в России, нации, составляющие Волжско-Уральский регион, объединились в государство, которое они называют Идель-Урал. На этот раз они провозгласили, что не будут сорваны Россией, и что сохранят свою независимость любой ценой. Только будущее покажет, суждено ли государству выжить или нет..."
  nsb_news.304.a:0 "На этот раз он точно выстоит!"
  nsb_news.304.b:0 "А где он вообще находится?"
  nsb_news.400.t:1 "Коронация Владимира III"
  nsb_news.400.desc:1 "После почти трех десятилетий правления большевиков, [SOV.GetName] сегодня увидели возврат к царской власти с коронацией царя Владимира III на торжественной церемонии в Успенском соборе в Москве. После королевского шествия через толпу, новый царь обратился к людям, которые пришли его приветствовать, восхваляя дух русского народа и поклявшись "вернуть нации ее былую славу"."
  nsb_news.400.a:0 "Великолепное событие!"
  nsb_news.400.b:0 "Подстрекательство к войне!"
  nsb_news.400.c:0 "Пародия!"
  nsb_news.401.t:0 "Земский собор распущен"
  nsb_news.401.desc:0 "Спустя считанные месяцы после легитимизации своего правительства путем восстановления Земского собора, фашистские элементы в [SOV.GetAdjective] правительстве уже распустили новый парламент и поставили нацию под контроль [SOV.GetLeader]. На данный момент новокоронованный царь все еще играет роль марионетки, но ясно, что у него мало реальной власти.\n\nВслед за сменой режима, националистическая риторика уже заметно усилилась, с речами, прославляющими братство "славянских народов", а также осуждающими прошлые "преступления" соседних держав."
  nsb_news.401.a:0 "Нашей славной нации нужны сильные лидеры!"
  nsb_news.401.b:0 "Пока неясно, улучшит ли это ситуацию."
  nsb_news.401.c:0 "Поднимается новый союзник?"
  nsb_news.402.t:0 "Берлинско-Московская ось"
  nsb_news.402.desc:0 "Сегодня в совместном заявлении пресс-секретари [GER.GetNameDef] и [SOV.GetNameDef] объявили о создании "берлинско-московской оси". Эти две державы будут сотрудничать в экономической, политической и военной областях, чтобы "защитить свои интересы", открыто выражая заботу о "стабильности в Восточной и Центральной Европе".\n\nПока остается только догадываться, действительно ли это их истинная мотивация."
  nsb_news.402.a:0 "Восходит наш славный альянс!"
  nsb_news.402.b:0 "От наших новых союзников с востока исходит прекрасная идея."
  nsb_news.402.c:0 "Не создают ли они Новый мировой порядок?"
  nsb_news.402.d:0 "Теперь Европа в их руках..."
  nsb_news.403.t:0 "[SOV.GetAdjective] вмешивается в дела Америки"
  nsb_news.403.desc:0 "Появились доказательства широкомасштабного [SOV.GetAdjective] вмешательства во внутренние политические дела многих государств в Южной и Центральной Америке. Путем финансирования праворадикальных политических организаций и военизированных групп, подкупа, лести и распространения дезинформации внутренняя стабильность этих государств становится все более шаткой.\n\nЕсли не остановить эту тайную [SOV.GetAdjective] деятельность, эксперты сходятся во мнении, что некоторые из этих государств неизбежно превратятся в идеологический оплот [SOV.GetName] в Америке. Вероятно, поддержка этих государств со стороны [SOV.GetAdjective] только усилится и станет более открытой, если это произойдет."
  nsb_news.403.a:0 "Жаль, что наше участие стало достоянием общественности."
  nsb_news.403.b:0 "Они мешаются у нас на пороге?!"
  nsb_news.403.c:0 "Они скоро поймут преимущества сильного руководства."
  nsb_news.403.d:0 "Распространение фашизма выходит из-под контроля!"
  nsb_news.404.t:0 "Восхождение Третьего Рима"
  nsb_news.404.desc:0 "После последней гражданской войны, опустошившей страну, Православная Церковь в России постепенно обретала власть. Теперь, когда их завоевание старого Византия завершено, они предприняли последние шаги к полному объединению церкви и государства.\n\nПосле двойного восшествия на престол как Верховного Патриарха и коронации как Царя всея Руси [SOV.GetLeader] теперь руководит страной, которую он назвал '[SOV.GetNameDef]' в стремлении к тому, что он назвал 'волей Божьей'."
  nsb_news.404.a:0 "Великолепно!"
  nsb_news.404.b:0 "Они не могут быть серьезными!"
  nsb_news.405.t:0 "[SOV.GetNameDefCap]"
  nsb_news.405.desc:0 "Снова приняв мантию "Защитника всех славян", Россия решила, что лучший способ сделать это — объединить все славянские народы в единую нацию.\n\nТеперь, когда это объединение наконец свершилось, [SOV.GetLeader] объявил о создании [SOV.GetNameDef], поклявшись, что "все ресурсы, доступные новой нации, будут использованы для блага ее народа и защиты от внешних угроз"."
  nsb_news.405.a:0 "Объединенные славяне непобедимы!"
  nsb_news.405.b:0 "С такой силой нужно считаться."
  nsb_news.406.t:0 "Защитник славян"
  nsb_news.406.desc:0 "В очередной раз [SOV.GetNameDef] примерил мантию "Защитника славян", выдав гарантии другим славянским народам в Европе. В своём заявлении [SOV.GetLeader] пообещал, что "все имеющиеся в распоряжении [SOV.GetNameDef] ресурсы будут задействованы во благо всех славянских народов и для защиты их от внешних угроз".\n\nВ качестве доказательства своих намерений привести свою страну в Великую войну [SOV.GetAdjective] правительство, похоже, не питает иллюзий о том, к чему приведут их гарантии, и не намерено уклоняться от своей ответственности."
  nsb_news.406.a:0 "Мы держим свои обещания перед нашими братьями."
  nsb_news.406.b:0 "До тех пор, пока они уважают нашу независимость..."
  nsb_news.406.c:0 "Старший брат славян вернулся..."
  nsb_news.407.t:0 "Тройственная Антанта?"
  nsb_news.407.desc:0 "[From.GetNameDefCap] и [SOV.GetNameDef] объявили о возобновлении военного сотрудничества спустя три десятилетия после распада старой Тройственной Антанты.\n\nХотя это прямо не говорится, очевидно, что этот новый союз был сформирован в попытке сдержать экспансию некоторых центральноевропейских держав. Сохранится ли альянс в будущем, покажет время."
  nsb_news.407.a:0 "Шаг к стабильной Европе."
  nsb_news.407.b:0 "Реликвия прошлого..."
  nsb_news.408.t:0 "Тройственная Антанта"
  nsb_news.408.desc:0 "[From.GetNameDefCap] теперь объявил о решении присоединиться к своим бывшим союзникам в возрожденной Тройственной Антанте - прямо нацеленной против экспансионистских сил в Центральной Европе."
  nsb_news.408.a:0 "Мы снова вместе."
  nsb_news.408.b:0 "Посмотрим, как долго она продержится."
  nsb_news.409.t:0 "Ось Берлин-Москва: Токио присоединяется"
  nsb_news.409.desc:0 "В трехстороннем заявлении правительства [GER.GetNameDef], [SOV.GetNameDef] и [JAP.GetNameDef] объявили, что [JAP.GetNameDef] станет следующим членом альянса Оси.\n\nХотя это было неожиданно в свете недавней напряженности между [SOV.GetAdjective] и [JAP.GetNameDef] (и, вероятно, стало результатом достаточных [GER.GetAdjective] переговоров), это новое развитие по существу обезопасит восточный фланг [SOV.GetAdjective] и позволит [JAP.GetNameDef] сосредоточиться на Тихом океане."
  nsb_news.409.a:0 "Мощный дипломатический шаг."
  nsb_news.409.b:0 "Неожиданное развитие!"