  RAJ_azad_hind:0 "Азад Хинд"
  RAJ_azad_hind_desc:0 "Правительство Свободной Индии, поддерживаемое врагами Британцев, стремится к освобождению Индии. Они сотрудничают с Японией, чтобы подорвать европейское господство и надеются установить самоуправляемое индийское государство."
  RAJ_marginalized_muslim_community:0 "Угнетенное мусульманское сообщество"
