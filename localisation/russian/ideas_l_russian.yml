  partisan_suppression_focus:0 "Подавление партизан"
  imperial_austerity_idea:0 "Имперская экономия"
  student_mobilization_idea:0 "Мобилизация студентов"
  spiritual_mobilization_idea:0 "Духовная мобилизация"
  spiritual_mobilization_idea_desc:0 "\"Роскошь - наш враг!\" Благодаря бережливости, гигиене и усердию, возведенному в ранг национальных достоинств, на нужды войны выделяется больше рабочей силы"
  office_of_strategic_services:0 "Управление стратегических служб"
  office_of_strategic_services_desc:0 "§LУправление стратегических служб (УСС) - разведывательное агентство Соединенных Штатов, созданное во время Второй мировой войны. Это было военное разведывательное агентство и предшественник Центрального разведывательного управления (ЦРУ).§!"
  nkvd:0 "НКВД"
  nkvd_desc:0 "§LNКВД, Народный комиссариат внутренних дел - правоохранительный орган Советского Союза, который непосредственно осуществлял правление власти Всесоюзной Коммунистической Партии. Также был обязан обеспечивать охрану советских границ и заниматься шпионажем, который включал политические убийства за границей, оказание влияния на иностранные правительства и проведение сталинской политики в рамках коммунистических движений в других странах.§!"
  nkvd_2:0 "НКВД"
  nkvd_2_desc:0 "§LNКВД, Народный Комиссариат внутренних дел, был правоохранительным органом в Советском Союзе, который непосредственно осуществлял власть Всесоюзной Коммунистической партии. Он также занимался защитой советских границ и шпионажем, что включало политические убийства за рубежом, влияние на иностранные правительства и соблюдение сталинской политики в коммунистических движениях в других странах.§!"
  idea_political_correctness:0 "Политическая корректность"
  idea_political_correctness_desc:0 "Людей, которые правильно думают, намного сложнее склонить на свою сторону иностранным державам."
  imperial_glory_idea:0 "Императорская Слава"
  warrior_traditions_idea:0 "Традиции воина"
  indian_independence_promised_idea:0 "Обещана независимость Индии"
  war_bonds_focus:0 "Военные облигации"
  liberty_ships_focus:0 "Корабли класса Liberty"
  air_war_plans_division_focus:0 "Воздушные боевые планы"
  air_war_plans_division_focus_desc:0 "Только путем превосходства в воздухе можно победить силы Оси. Долгосрочные планы по производству и развертыванию истребителей и стратегических бомбардировщиков делают это не только возможным, но и достижимым."
  air_support_focus:0 "Авиационная поддержка"
  strategic_bombing_focus:0 "Стратегические бомбардировки"
