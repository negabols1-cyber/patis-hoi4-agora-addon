  anti_soviet_pact_refused_call_desc:0 "Эта нация не выполнила условия Антисоветского пакта, когда ее призвали к войне. Это вызвало недоверие народа к нынешнему правительству и привело к росту поддержки коммунистов."
  anti_soviet_pact_desc:1 "Если одна из стран, заключивших пакт, подвергнется нападению со стороны Советского Союза, все остальные участники будут призваны к войне. Участники, уже находящиеся в состоянии войны с Советским Союзом, не будут призваны."
