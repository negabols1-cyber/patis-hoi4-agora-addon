  POR_volunteers_in_the_war:0 "Добровольцы на войне"
  POR_volunteers_in_the_war_desc:0 "Народы Испании борются в гражданской войне. Мы окажем военную помощь, организовав добровольческие силы, которые будут сражаться за праведную сторону."
  POR_a_new_industry:0 "Новая промышленность"
  POR_improved_production:0 "Усовершенствованное производство"
  POR_improved_production_desc:0 "Благодаря государственному регулированию, которое наше правительство внедрило после долгих лет финансовой нестабильности, нам удалось стабилизировать нашу экономическую ситуацию, и мы инвестируем в большее количество общественных проектов для стимулирования нашей инфраструктуры."
  POR_nation_in_arms:0 "Нация в Оружии"
  POR_iberian_workers_united:0 "Союз Иберийских Рабочих"
  POR_iberian_workers_united_desc:0 "Мы должны провозгласить единство иберийского пролетариата против всех видов тирании и удвоить поддержку, оказываемую нашим испанским товарищам в их гражданской войне. Наши жертвы будут вознаграждены, потому что это справедливое дело!"
  POR_monarchists_on_the_rise:0 "Подъём Монархистов"
