  comintern_influence:0 "Влияние Коминтерна"
  progress_cult_focus:0 "Культ прогресса"
  socialist_science_focus:0 "Социалистическая наука"
  peoples_commissariat_focus:0 "Народный комиссариат оборонной промышленности"
  home_of_revolution:0 "Родина Революции"
  home_of_revolution_desc:0 "Товарищи, с поражением подлых троцкистских контрреволюционеров мы смогли сосредоточиться на защите революции. Наша цель, наша надежда, наш лозунг - социализм в одной стране. Мы построим изобильную социалистическую утопию здесь, в Советском Союзе, и весь остальной мир неизбежно примет ее."
  en_svensk_tiger:0 "Шведский Тигр"
  en_svensk_tiger_desc:0 "Если Швеция должна быть похожа на тигра на охоте, то те, кто шпионит за нами, не должны знать, что мы делаем. В это время конфликтов и раздоров молчание является патриотическим долгом каждого шведа."
  state_shintoism:0 "Государственный синтоизм"
  state_shintoism_desc:0 "Со времен реставрации Мэйдзи мы стремились использовать поклонение в синтоистских святилищах для продвижения имперской лояльности и содействия строительству нации. Это позволило нам построить страну, готовую пожертвовать многим во имя государства."
  vittoria_mutilata:0 "Усеченная победа"
  vittoria_mutilata_desc:0 "§LНаши союзники предали Италию и ударили нас в спину, когда они нарушили Лондонский пакт. Мы пожертвовали стольким количеством крови на Изонцо ради их победы, а они, в свою очередь, отказали нам в том, что было нашим по праву. Теперь Италия возьмет свою судьбу в свои руки и позаботится о том, чтобы справедливость восторжествовала.§!"
  stiff_upper_lip:0 "Британский стоицизм"
  stiff_upper_lip_desc:0 "Если с головы своей не слететь тебе,\nКогда теряют все ее вокруг\nЕсли с Триумфом и Бедствием в судьбе\nТы встретишься, как с самозванкой, друг\nТвоя тогда и Землю вся, и все на ней,\nИ - что ещё важней - ты будешь Человек, сынок."
  trotskyite_plot:0 "Троцкистский заговор?"
  trotskyite_plot_desc:0 "Паранойя и патологическое недоверие, вытекающие из старых разногласий по вопросам власти, влияют на руководство данной нации."
  trotskyite_plot_purged:0 "Троцкистский заговор подавлен?"
  trotskyite_plot_purged_desc:0 "Несмотря на чистки, страх предательства никуда не ушел."
  officers_purged:0 "Офицеры зачищены"
  officers_purged_desc:0 "Чистка "пятой колонны" оставила глубокие шрамы в рядах офицеров Красной армии, и руководству понадобятся годы на их восполнение."
