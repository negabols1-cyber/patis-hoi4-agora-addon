  SWE_historical_trade_with_Germany_dummy_instant_desc:0 "(§YSweden§!) Стоимость торговли для целевой страны: §G-20%§!)\n(§YSweden§!) Модификатор мнения о торговле: §G+50§!)\n§YВаша отечественная сталь низкого качества, и чтобы она была полностью эффективной, в нее нужно добавлять высококачественную сталь. Импорт небольшого количества иностранной стали резко увеличит объем производства отечественной стали§!\n"
