  MTG_naval_treaty_adherent_desc:0 "Мы подписали Лондонский военно-морской договор и в связи с этим наш флот ограничен по величине."
  MTG_naval_treaty_adherent_reduced:0 "Эскалаторная оговорка включена"
  MTG_naval_treaty_adherent_reduced_desc:0 "После того как некоторые стороны Вашингтонского военно-морского договора покинули Лондонский военно-морской договор, мы включили эскалаторную оговорку, которая уменьшила ограничения по размеру и вооружению нашего флота."
