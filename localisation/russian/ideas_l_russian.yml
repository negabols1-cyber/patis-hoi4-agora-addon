  democratic_revolutionaries:0 "Демократические революционеры"
  democratic_revolutionaries_desc:0 "Если поддержка демократии превысит 70%, начнется гражданская война. Если поддержка демократии упадет ниже 30%, революционная деятельность прекратится."
  home_of_the_free:0 "Дом свободных"
  home_of_the_free_desc:0 "США считает себя оплотом и, возможно, даже колыбелью демократии и свободы. Какой бы она ни выбрала быть, ее ценности трудно подорвать, какими бы заманчивыми ни казались некоторые возможности."
