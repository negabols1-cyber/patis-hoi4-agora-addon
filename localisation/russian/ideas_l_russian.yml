  CAN_unified_communist_party:0 "Объединенный народ"
  CAN_unified_communist_party_desc:0 "Старые расколы заживают, отношения налаживаются. Однако нашу терпимость в служении общей цели с подозрением рассматривают те, кто лишь на словах поддерживает это дело, движимый самой низменной из мотиваций: стремлением к власти."
