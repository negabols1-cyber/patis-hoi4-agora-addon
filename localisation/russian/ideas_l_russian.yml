  internationalism:0 "Интернационализм"
  internationalism_desc:0 "Мы твердо верим, что идеология выходит за национальные границы и не чувствуем себя ограниченными в пересечении этих границ."
  combined_bomber_offensive:0 "Совместные налеты бомбардировщиков"
  the_long_lance:0 "Длинное копьё"
  the_long_lance_desc:0 "§LТорпеда Тип-93, обычно называемая Длинным копьём, была самой передовой торпедой того времени. Она была разработана в Японии и ни разу не была превзойдена на Западе, дав небольшим кораблям эффективное средство для поражения более крупных, более бронированных военных кораблей на дальнем расстоянии.§!"
  volunteer_corps_focus:0 "Корпус добровольцев"
