  RAJ_risk_of_famine:0 "Риск голода"
  RAJ_risk_of_famine_desc:1 "Индийская система производства продовольствия очень уязвима. Даже небольшой сбой может привести к катастрофе."
  RAJ_famine:0 "Голод"
  RAJ_famine_desc:0 "Некомпетентность, безразличие и вопиющая коррупция в колониальном правительстве и индийских железных дорогах превратили сложную ситуацию в полномасштабную катастрофу. Страна будет страдать от этого еще много месяцев."
