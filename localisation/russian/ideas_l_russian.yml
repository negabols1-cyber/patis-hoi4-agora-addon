  POR_unreliable_army:0 "Ненадежная армия"
  POR_unreliable_army_desc:0 "Из-за постоянных переворотов и контрпереворотов с момента установления республики в 1910 году офицеры больше заняты политикой, чем поддержанием дисциплины и улучшением подготовки в армии. Рядовые деморализованы, плохо экипированы и плохо обучены."
  POR_unstable_republic:0 "Нестабильная республика"
  POR_unstable_republic_desc:0 "Эра республики, созданной в 1910 году, описывается как эпоха \"постоянной анархии, правительственной коррупции, беспорядков и грабежей, убийств, произвольных тюремных заключений и религиозных преследований\". Она ознаменовалась вступлением в должность девяти президентов, 44 перестановками в кабинете министров и 21 революцией. Даже после военного переворота 1926 года было совершено несколько неудачных попыток революции."
  POR_british_influence:0 "Британское влияние"
  POR_british_influence_desc:0 "Британское правительство инвестирует в разработку ресурсов в нашей стране. Это ценная возможность расширить наши достижения в области НИОКР."
  POR_hydroelectric_power:0 "Гидроэлектроэнергетика"
  POR_hydroelectric_power_desc:0 "Благодаря инвестициям, сделанным на севере и в центре Португалии, нам наконец удалось построить сеть плотин, которые производят электроэнергию и регулируют течение рек."
  POR_colonial_assimilation_policy:0 "Политика колониальной ассимиляции"
