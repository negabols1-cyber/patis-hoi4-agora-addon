  rhineland_challenge_met_desc:0 "Хотя многие предсказывали, что Рейнланд может быть снова милитаризирован без союзного вмешательства, Германии пришлось уступить, когда это оказалось ошибкой."
  kaiser_challenge_met:0 "Решению по Кайзеру положено начало"
  kaiser_challenge_met_desc:0 "Хотя многие предсказывали, что Кайзера можно будет освободить из Нидерландов без союзного вмешательства, Германии пришлось уступить, когда это оказалось ошибкой."
  fascist_revolutionaries:0 "Фашистские революционеры"
  fascist_revolutionaries_desc:0 "Если поддержка фашизма превысит 70%, страна будет ввергнута в гражданскую войну. Если поддержка фашизма упадет ниже 30%, революционная деятельность прекратится."
  communist_revolutionaries:0 "Коммунистические революционеры"
