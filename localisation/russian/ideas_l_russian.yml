l_russian:
 fascist_influence:0 "Фашистское влияние"
 fascist_influence_desc:0 "Фашистское давление сделало фашизм очень популярным, и страна рискует стать союзником фашистов"
 communist_influence:0 "Коммунистическое влияние"
 communist_influence_desc:0 "Коммунистическое давление сделало коммунизм очень популярным, и страна рискует стать союзником коммунистов"
 democratic_influence:0 "Демократическое влияние"
 democratic_influence_desc:0 "Демократическое давление сделало демократию очень популярной, и страна рискует стать союзником демократов"
 neutrality_influence:0 "Авторитарное влияние"
 neutrality_influence_desc:0 "Авторитарное давление вызвало новое уважение к тем, у кого сильное правительство и благородные королевские дома, и страна рискует стать союзником авторитарных правительств."
 soviet_german_friendship:0 "Советско-германская дружба"
 soviet_german_friendship_desc:0 "Германский рейх и Советский Союз объединились в дружественных отношениях против декадентского запада."
 sour_loser:0 "Горечь поражения"
 sour_loser_desc:0 "Озлобленность из-за поражения в Великой войне доминирует в политике этой страны."
 received_attache:0 "Получено сопровождение"
 received_attache_desc:0 "Иностранные военные атташе, находящиеся на территории нашей страны."
 ATTACHE_LIST:0 "Мы получили военных атташе от $LIST$. И они дают нам следующие эффекты:"
 porsche:0 "Porsche"
 porsche_desc:0 "Компания Porsche выступает за производство танков с прочной броней."
 henschel:0 "Henschel"
  henschel_desc:1 "Henschel были ответственны за все серийные модели Tiger, которые после решения ранних проблем с надежностью показали себя очень хорошо."
  GER_MAN:0 "MAN"
  GER_MAN_desc:1 "Наиболее известный за танк Panther, MAN также участвовал в проектировании и производстве ранних моделей Panzer."
  rheinmetall:0 "Rheinmetall"
  rheinmetall_desc:0 "Rheinmetall проектирует и создает все виды крупнокалиберных орудий и пушек."
  mauser:0 "Mauser"
  mauser_desc:0 "Mauser проектирует и создает все виды стрелкового оружия."
  ig_faben:0 "IG Farben"
  ig_faben_desc:0 "IG Farben живо заинтересован в промышленных исследованиях."
  messerschmitt:0 "Messerschmitt"
  messerschmitt_desc:0 "Messerschmitt специализируется на проектировании легких самолетов, таких как истребители."
  focke_wulf:0 "Focke Wulf"
  focke_wulf_desc:0 "Focke Wulf имеет особый интерес к разработке средних самолетов, таких как тяжелые истребители."
  junkers:0 "Junkers"
  junkers_desc:0 "Junkers наиболее известен разработкой пикирующего бомбардировщика Stuka."
  todt:0 "Фриц Тодт"
  todt_desc:0 "Фриц Тодт, немецкий инженер, был основателем Организации Тодта. Он увеличит скорость строительства гражданских промышленных объектов."
  speer:0 "Альберт Шпеер"
  speer_desc:0 "Альберт Шпеер был немецким архитектором, который был министром вооружений и военной промышленности с 1942 по 1945 год. Ему часто приписывают "чудо вооружений", его назначение увеличит промышленную эффективность."
  raeder:0 "Эрих Редер"
  raeder_desc:0 "Эрих Редер был немецким адмиралом, который выступал за использование традиционных надводных кораблей и доктрины \"Флот в бытии\""
  donitz:0 "Карл Дениц"
  donitz_desc:0 "Карл Дениц был немецким адмиралом, который питал пристрастие к подводным лодкам и доктрине нарушения торговли"
  goering:0 "Герман Геринг"
  goering_desc:0 "Герман Геринг был асом истребителем Первой мировой войны, ставшим одним из главных сторонников Гитлера. Несмотря на то, что он не самый лучший в своем деле, он преданно лоялен"
  walther_wever:0 "Вальтер Вевер"
  walther_wever_desc:0 "Вальтер Вевер был одним из первых сторонников теории стратегических бомбардировок"
  ritter_von_greim:0 "Риттер фон Грейм"
  ritter_von_greim_desc:0 "Риттер фон Грейм - сторонник тактического запрета"
  ernst_udet:0 "Эрнст Удет"
  ernst_udet_desc:0 "Эрнст Удет повлиял на принятие методов пикирующего бомбометания, а также на пикирующий бомбардировщик Stuka"
  werner_von_fritsch:0 "Вернер фон Фрич"
  werner_von_fritsch_desc:0 "Вернер фон Фрич, генерал старой гвардии, выступает за упор на пехоту"
  ludwig_beck:0 "Людвиг Бек"
  ludwig_beck_desc:0 "Людвиг Бек особо подчеркивает снабжение"
  franz_halder:0 "Франц Гальдер"
  franz_halder_desc:0 "Франц Гальдер верит в поражающую силу артиллерии в атаке"
  heinz_guderian:0 "Гейнц Гудериан"
  wilhelm_keitel:0 "Вильгельм Кейтель"
  wilhelm_keitel_desc:0 "Вильгельм Кейтель, генерал старой гвардии, выступает за пехоту. То, чего ему не хватает в мастерстве, он компенсирует лояльностью"
  ferdinand_schorner:0 "Фердинанд Шернер"
  ferdinand_schorner_desc:0 "Фердинанд Шернер обладает навыками обороны и борьбы в условиях низких температур."
  general_staff:0 "Генеральный штаб"
  general_staff_desc:0 "Немецкий генеральный штаб занимался непрерывным изучением всех аспектов войны, включая составление и пересмотр планов по мобилизации или кампаниям. Это способствовало повышению уровня организации в армии."
  v_weapons:0 "Оружие возмездия"
  v_weapons_desc:0 "Ракеты дальнего действия станут идеальным оружием возмездия против наших врагов."
  hermann_gortz:0 "Герман Гертц"
  hermann_gortz_desc:0 "§HГерман Гертц§! - искусственный немецкий шпион."
  elyesa_bazna:0 "Эльеса Базна"
  elyesa_bazna_desc:0 "§HEльеса Базна§! широко известен под своим кодовым именем \"Цицерон\"."
  marina_lee:0 "Марина Ли"
  marina_lee_desc:0 "§HМарина Ли§! - балерина, специализирующаяся на похищении военных планов."
  german_advisors:0 "Военные советники Германии"
  german_advisors_desc:0 "В Китае присутствует немецкая военная миссия во главе с Александром фон Фалькенхаузеном, и его советники помогают нам поднять нашу армию до западных стандартов."
