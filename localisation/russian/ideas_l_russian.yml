  RAJ_all_india_forward_bloc_fascism:0 "Всеиндийский блок передового действия"
  RAJ_agrarian_society:0 "Аграрное общество"
  RAJ_agrarian_society_desc:0 "Местные администраторы считают, что аграрный образ жизни сделал большую часть населения Индии просто непригодным для военной службы или ведения боевых действий любого рода. Они утверждают, что мы должны осуществлять набор только из так называемых \"воинственных племен\". Эта вера настолько широко распространена и укоренилась, что для ее преодоления потребуется не менее поколения. В обозримом будущем мы должны смириться с тем, что они просто проигнорируют любой приказ о призыве фермеров."
