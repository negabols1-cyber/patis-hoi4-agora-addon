l_russian:
  generic.8.t:0 "Покорители атома"
  generic.8.d:0 "Мы применили первое в мире ядерное оружие, прочно обеспечив себе лидерство в текущей гонке вооружений. Наши огромные усилия окупились, и пока миру не останется ничего другого, кроме как дивиться нашей мощи. Возможно, когда-нибудь они сравняются с нами, но мы обеспечили, что никогда не превзойдут нас."
  generic.8.a:0 "Разотрите наших врагов в порошок!"
  generic.9.t:0 "В тени других"
  generic.9.d:0 "Другие применили первое в мире ядерное оружие, прочно обеспечив себе лидерство в текущей гонке вооружений. Несмотря на все наши усилия, мы остались без обороны и без средств возмездия. Совершенно превзойденные, у нас нет другого выбора, кроме как удвоить наши усилия и сократить разрыв, прежде чем они смогут высвободить гораздо больше этого разрушения."
  generic.9.a:0 "Программа должна получить все, что мы можем выделить."
  generic.10.t:0 "Могущественные друзья"
  generic.10.d:0 "Наши союзники применили первое в мире ядерное оружие, прочно обеспечив нашему альянсу лидерство в текущей гонке вооружений. Хотя мы и были превзойдены, этим оружием владеют наши союзники, что гарантирует нашу способность к возмездию, если кто-то из врагов овладеет атомом самостоятельно."
  generic.10.a:0 "Приемлемый исход."
  wtt_denmark.1.t:0 "[ICE.GetAdjective] независимость"
  wtt_denmark.1.d:0 "После разрыва связи после вторжения [ICE.GetAdjective] парламент взял под контроль внешнюю политику страны. Подразумевается, что это временная мера до окончания оккупации."
  wtt_denmark.1.a:0 "Удачи им."
  news.331.t:0 "[ICE.GetNameDefCap] берёт контроль над внешней политикой"
  news.331.desc:0 "С капитуляцией своего партнёра по унии Дании, [ICE.GetAdjective] парламент взял контроль над своей внешней политикой и, по сути, стал полностью независимым государством. Недавно избранный временный губернатор уже объявил [ICE.GetAdjective] нейтралитет в текущем конфликте, несмотря на вторжение в его страну-родоначальницу."
  news.331.a:0 "Нейтралитет не спас Данию."
  wtt_britain.24.t:0 "Предложение Макдональда"
  wtt_britain.24.d:0 "Ввиду того, что текущая война напрягает [ENG.GetAdjective] конвои, наши восточные соседи всё больше стремятся использовать наши воздушные и морские базы, с которых они надеются расширить защитное покрытие своих конвойных путей. [ENG.GetAdjective] посланник по имени Малкольм Макдональд теперь прибыл, чтобы предложить возвращение Северной Ирландии под суверенный контроль [IRE.GetAdjective] в обмен на наше немедленное вступление в войну на стороне [ENG.GetNameDef]."
  wtt_britain.24.a:0 "Прекрасная идея."
  wtt_britain.24.b:0 "Шкурка не стоит выделки."
  wtt_britain.25.t:0 "[ENG.GetAdjective] требуют французский флот"
  wtt_britain.25.d:0 "Флоты [ENG.GetAdjective] появились рядом с главными гаванями наших флотов, и мы получили ультиматум с требованием немедленной сдачи нашего флота. Если мы не направим наши корабли в порты [ENG.GetAdjective] немедленно, адмирал [ENG.GetAdjective] угрожает открыть огонь."
  wtt_britain.25.a:0 "У нас нет другого выхода..."
  wtt_britain.25.b:0 "Мы никогда не позволим другой нации забрать наш флот!"
  wtt_britain.26.t:0 "Сдавшийся французский флот"
  wtt_britain.26.d:0 "Французы приняли мудрое решение направить свои корабли в наши порты. Теперь у нас полный контроль над французским флотом."
  wtt_britain.26.a:0 "По крайней мере, мы уберегли его от [GER.GetAdjective]."
  wtt_britain.27.t:0 "Французы отвергли ультиматум"
  wtt_britain.27.d:0 "Французы отвергли наши требования. Теперь у нас остался незавидный выбор: отступить или выступить против наших бывших союзников."
  wtt_britain.27.a:0 "Мы не можем позволить французскому флоту служить интересам [GER.GetAdjective]!"
  wtt_britain.27.b:0 "Это неприемлемо. Мы должны отступить."
  news.332.t:0 "Сдавшийся французский флот"
  news.332.desc:0 "Вчера военно-морские силы [ENG.GetAdjective] блокировали французские корабли на критически важных базах в Северной Африке, выдвинув ультиматум французам: немедленно отправить корабли в порты [ENG.GetAdjective] и передать контроль над своим флотом, иначе [ENG.GetAdjective] откроют огонь по своему бывшему союзнику. Перед лицом превосходящей огневой мощи французы приняли ультиматум, и их флот перешел под контроль [ENG.GetAdjective]."
  news.332.a:0 "Мудрое решение."
  news.332.b:0 "К счастью, кровопролития удалось избежать."
  news.332.c:0 "Как они посмели?!"
  news.332.d:0 "У нас не было выбора."
  news.332.e:0 "Они продолжат борьбу под флагом [ENG.GetAdjective]."
  news.333.t:0 "Атака [ENG.GetAdjective] в Мерс-эль-Кебире"
  news.333.desc:0 "Вчера военно-морские силы [ENG.GetAdjective] блокировали французские корабли на критически важных базах в Северной Африке, выдвинув ультиматум французам: немедленно отправить корабли в порты [ENG.GetAdjective] и передать контроль над своим флотом, иначе [ENG.GetAdjective] откроют огонь по своему бывшему союзнику. После отказа французов выполнить требования [ENG.GetAdjective], в перестрелке был потоплен как минимум один французский линкор и серьёзно повреждено значительное количество французских кораблей."
  news.333.a:0 "Мы сделали то, что должны были сделать."
  news.333.b:0 "Это возмутительно!"
  news.333.c:0 "Возможно, мы их недооценили."
  news.333.d:0 "Мы не скоро забудем это предательство!"
  news.333.e:0 "Они доказали свою решимость."
  wtt_britain.28.t:0 "[IRE.GetNameDefCap] Принимает предложения Макдональда"
  wtt_britain.28.d:0 "[IRE.GetAdjective] правительство приняло наше предложение и присоединилось к нашему делу в обмен на Северную Ирландию."
  wtt_britain.29.t:0 "[IRE.GetNameDefCap] Отклоняет предложение Макдональда"
  wtt_britain.29.d:0 "[IRE.GetAdjective] правительство отклонило наше предложение, отказавшись присоединиться к нашей борьбе за демократию."
  wtt_britain.29.a:0 "Кто им поможет, когда придут [GER.GetAdjective]ы?"
  wtt_britain.30.t:0 "Экстренные поставки оружия [USA.GetAdjective]"
  wtt_britain.30.d:0 "При щедрой поддержке Комитета защиты [ENG.GetAdjective] домов, [USA.GetAdjective] правительство отправило нам экстренную поставку старых винтовок, оборудования и нескольких артиллерийских орудий. Это слишком разнообразный ассортимент, чтобы быть действительно полезным для нашей армии, но, несомненно, они пройдут долгий путь, чтобы спешно вооружить гарнизоны сил ополчения."
  wtt_britain.30.a:0 "Они спасли нас от вторжения!"
  wtt_germany.1.t:0 "Офицеры Вермахта бросают вызов Гитлеру"
  wtt_germany.1.d:0 "Затаенное недовольство правлением Гитлера вышло на поверхность из-за нынешнего кризиса, вызванного решением администрации о ремилитаризации Рейнской области. Несколько генералов вермахта объединились вокруг известного фельдмаршала Августа фон Макензена, который привел в движение планы по смещению Гитлера и устранению нацистской партии из Германии.\n\nВ связи с тем, что разделение немецкого высшего командования стало очевидным даже за рубежом, иностранные державы решили не выступать против ремилитаризации, больше озабоченные растущей внутренней нестабильностью в Германии. Пожилой фельдмаршал действовал быстро, уже сформировав временное правительство, к которому присоединилось множество противников нацистского правительства.\n\nВоенный переворот уже в самом разгаре."
  wtt_germany.1.a:0 "Очистите нашу землю от этой нацистской нечисти!"
  wtt_germany.2.t:0 "Немецкие экспатрианты присоединяются к делу"
  wtt_germany.2.d:0 "Многие из наших перемещенных немецких товарищей стекаются в наши окрестности после недавнего жестокого обращения и насильственной экспатриации из своей страны. Мы создали несколько дивизий с некоторым руководством от этих нетерпеливых новобранцев, и теперь они готовы сражаться с нашими врагами!"
  wtt_germany.3.t:0 "Германия отменяет ссылку Вильгельма II"
  wtt_germany.3.d:0 "Германия призвала Вильгельма II вернуться на родину в качестве кайзера. Учитывая последние бурные события, это может помочь немцам установить мир и стабильность в своей стране. Взоры всего мира прикованы к нам, поскольку многие не забыли тот ужасный конфликт, в который старый кайзер втянул нас всего два десятилетия назад."
  wtt_germany.3.a:0 "Мы должны позволить ему вернуться и вести свой народ."
  wtt_germany.3.b:0 "Мы должны остановить его - мы не можем рисковать новой мировой войной."
  wtt_germany.4.t:0 "Кайзер возвращается в Германию"
  wtt_germany.4.d:0 "Среди восторженных торжеств Вильгельм II вернулся в качестве кайзера в Германскую империю! Мы в долгу перед [HOL.GetNameDefCap] за то, что он позволил ему найти безопасное убежище в последние десятилетия и неоднократно отказывался выдавать его нашим бывшим врагам. Несмотря на то, что в недавней гражданской войне страна сильно пострадала, есть надежда, что возвращение кайзера принесет дальнейшую стабильность и единство."
  wtt_germany.4.a:0 "Несомненно, он будет хорошо вести нацию."
  wtt_germany.5.t:0 "[HOL.GetNameDefCap] мешает возвращению кайзера"
  wtt_germany.5.d:0 "Так долго благородно предлагая Вильгельму II убежище, подлые [HOL.GetName] теперь заблокировали попытки кайзера пересечь границу с Германией и сопроводили его обратно в его резиденцию Хёйс-Дорн. [HOL.GetAdjective] ссылаются на опасения за стабильность континента как на причину отказа кайзера вернуться на германский трон."
  wtt_germany.5.a:0 "Дадим им более насущные дела!"
  wtt_germany.5.b:1 "Возможно, они правы... У нас есть другие кандидаты."
  wtt_germany.5_tt:0 "Бывший кайзер, возможно, будет способен помочь сыну в управлении страной.\n"
  wtt_germany.6.t:0 "Вильгельм II освобожден"
  wtt_germany.6.d:0 "Зачистив окрестности Хёйс-доорн от [HOL.GetAdjective] войск, наши войска обнаружили кайзера в добром здравии и вернули его в Германию на автоколонне. Вильгельм II триумфально пересек границу несколько часов назад и после прибытия в Берлин торжественно принял на себя обязанности кайзера Германской империи."
  wtt_germany.6.a:0 "Ничто нас не остановит."
  GER_fascism_civil_war_tt:0 "Сторонники фашизма начинают гражданскую войну.\n"
  wtt_germany.7.t:0 "Неконтролируемая экономическая зависимость от [From.GetNameDef]"
  wtt_germany.7.d:0 "В связи с тем, что мы постепенно втягиваемся в сферу влияния [From.GetNameDef], наша экономика все больше зависит от нашего союзника. Сегодня [GER.GetAdjective]ы, наконец, попытались взять нашу экономику под свой контроль; мы были бессильны их остановить. В результате контроль [GER.GetAdjective] над нашей внешней политикой достиг беспрецедентного уровня."
  wtt_germany.7.a:0 "Пока что мы должны мириться с ситуацией."
  wtt_germany.8.t:0 "[GER.GetNameDefCap] предлагает поддержку монархическому перевороту"
  wtt_germany.8.d:0 "[From.GetNameDefCap] имеет предложения с про-монархическими и антифашистскими элементами правительства [ITA.GetAdjective] и подполья, в которых планируется покушение на [ITA.GetLeader] и провозглашение Виктора Эммануила III лидером нации. [GER.GetAdjective] уверяют нас, что они смогут организовать покушение; все, что нам нужно сделать, это подтвердить нашу готовность создать новое правительство и пообещать нашу будущую военную поддержку для [GER.GetAdjective]."
  wtt_germany.8.a:0 "Мы должны обратить внимание на монархию в будущем."
  wtt_germany.8.b:0 "Нелепость! Мы никогда не откажемся от своих взглядов!"
  wtt_germany.9.t:0 "[ITA.GetAdjective] принимает предложение о перевороте"
  wtt_germany.9.d:0 "Элементы в правительстве [ITA.GetAdjective] и подполье приняли наше предложение о перевороте. Они готовятся к быстрому захвату власти для короля, как только произойдет покушение."
  wtt_germany.9.a:0 "Мы можем привести наши планы в действие."
  wtt_germany.10.t:0 "[ITA.GetAdjective] отвергает предложение о перевороте"
  wtt_germany.10.d:0 "Элементы правительства и подполья [ITA.GetAdjective], с которыми мы связались, заявили нам в не слишком мягких выражениях, что они не заинтересованы в нашем предложении о перевороте. Они пригрозили раскрыть наши планы правительству [ITA.GetAdjective], если мы посмеем снова сделать такое предложение."
  wtt_germany.10.a:0 "Как жаль."
  wtt_germany.11.t:0 "Покушение [GER.GetAdjective] на Муссолини"
  wtt_germany.11.d:0 "План [GER.GetAdjective] приведён в действие. Сегодня Муссолини был застрелен в своём автомобиле на улицах Рима. Король Виктор Эммануил III взял бразды правления в свои руки и обязался присоединиться к Центральным державам вместе с [From.GetNameDef]."
  wtt_germany.11.a:0 "Мы должны показать нашу признательность."
  wtt_germany.12.t:0 "Убийство Муссолини удалось"
  wtt_germany.12.d:0 "Наш план был безупречно выполнен, и Виктор Эммануил III принял на себя руководство своей нацией. Его первым действием было подписание договора, гарантирующего вступление Италии в альянс Центральных держав."
  wtt_germany.12.a:0 "Монархии восстанут снова!"
  wtt_germany.13.t:0 "Воссоединение Австро-Венгрии"
  wtt_germany.13.d:0 "При нашей поддержке [From.GetOldName] возглавил воссоединение Австро-Венгерской империи. Сегодня утром были подписаны договоры между заинтересованными сторонами, отменив два десятилетия сепаратистских настроений. Новое единое правительство немедленно пообещало свою военную поддержку нашему делу, став членом Центральных держав."
  wtt_germany.13.a:0 "Наш старый союзник вернулся на нашу сторону."
  wtt_germany.14.t:0 "[GER.GetNameDefCap] гарантирует свою территорию"
  wtt_germany.14.d:0 "[From.GetNameDefCap] сделали нам предложение, которое, по их словам, может принести пользу обеим сторонам. В свете нынешней политической ситуации и угрозы на нашей восточной границе, [GER.GetAdjective] предлагает выдать гарантии, что они придут на нашу военную помощь, если мы вступим в войну с [SOV.GetNameDef]. Взамен они лишь просят вернуть утраченные территории Данциг и Познань."
  wtt_germany.14.a:0 "Их военная мощь для нас ценнее земли."
  wtt_germany.14.b:0 "Мы никогда не отдадим наши земли!"
  wtt_germany.15.t:0 "[POL.GetNameDefCap] принимает предложение"
  wtt_germany.15.d:0 "[POL.GetNameDefCap] решил принять наше предложение и договорился о передаче нам их приграничных провинций. Они проявили к нам доверие и призвали нас быть наготове в случае агрессии со стороны [SOV.GetAdjective]."
  wtt_germany.15.a:0 "Этот гнет Версаля наконец сломлен!"
  wtt_germany.16.t:0 "[POL.GetNameDefCap] отклоняет предложение"
  wtt_germany.16.d:0 "[POL.GetNameDefCap] решил отклонить наше предложение. В эмоциональной речи они заявили, что никогда не отдадут свою территорию по доброй воле и предпочтут противостоять любому врагу в одиночку, если такова цена за помощь."
  wtt_germany.16.a:0 "Мы никогда не откажемся от наших требований!"
  wtt_germany.16.b:0 "Возможно, нам следует смириться с этим."
  wtt_germany.17.t:0 "Коммунисты [GER.GetAdjective] бегут в [FRA.GetNameDef]"
  wtt_germany.17.d:0 "Правительство [GER.GetAdjective] растоптало коммунистов и изгнало их за границу. В результате этого сейчас мы получаем большой приток коммунистических идеологов из наших соседних стран."
  wtt_germany.17.a:0 "Лишь бы это не дестабилизировало страну."
  wtt_germany.18.t:0 "Захват нацистского руководства"
  wtt_germany.18.d:1 "Наконец-то мы освободили нашу страну от власти врагов, и те лояльные граждане, которые поддержали нас, могут вернуться в свои дома. Как нация, мы можем начать долгий и трудный процесс восстановления нашей страны. Теперь руководство страны может начать думать о будущем: о демократии или о возвращении старой монархии.\n\nОднако осталось еще одно последнее дело. После окончания гражданской войны наши войска взяли в плен большую группу нацистского руководства. Теперь остается только решить, что же делать с этими отвратительными лицами нашей недавней истории."
  wtt_germany.18.a:0 "Повесить!"
  wtt_germany.18.b:0 "Пожизненно заключить в тюрьму. Они могут пригодиться в будущем."
  wtt_germany.19.t:0 "[GER.GetNameDefCap] выступает против [SOV.GetNameDef]"
  wtt_germany.19.d:0 "Недавняя [GER.GetAdjective] риторика, направленная против нас, стала чрезвычайно вредной для нашей репутации в Европе. Клеветнические обвинения в нашей мнимой „агрессии“ начинают вызывать страх и недопонимание наших намерений."
  wtt_germany.19.a:0 "Начать проведение серии военных учений для запугивания всех и каждого!"
  GER_soviet_military_exercises:0 "Военные учения"
  wtt_germany.19.b:1 "Мы должны восстановить нашу репутацию и наладить отношения"
  GER_soviet_smoothes_relationships:0 "Смягчить отношения"
  wtt_germany.19.c:0 "Думают, нам есть дело до того, что они о нас говорят?"
  wtt_germany.20.t:0 "[GER.GetNameDefCap] создаёт Центральноевропейский альянс"
  wtt_germany.20.d:0 "Продолжая их клеветническую кампанию против нас, [GER.GetAdjective] объявили о создании нового альянса. Вряд ли можно сомневаться, что он направлен против нас и призван помешать нам усилить наше влияние."
  wtt_germany.20.a:0 "Лучше им держаться подальше от нашей сферы влияния!"
  GER_soviet_reiterated_claims:0 "Повторить заявления"
  wtt_germany.20.b:0 "Мы не должны давать им ни малейшего повода для дальнейшей эскалации."
  wtt_germany.21.t:0 "[GER.GetAdjective] приглашают Прибалтику"
  wtt_germany.22.t:0 "[GER.GetAdjective] приглашают [POL.GetNameDef]"
  wtt_germany.23.t:0 "[GER.GetAdjective] приглашают [FIN.GetNameDef]"
  wtt_germany.21.d:0 "[GER.GetAdjective] предложили вступить в альянс государству из нашей непосредственной сферы влияния. Угроза для Родины очевидна!"
  wtt_germany.21.a:0 "Мы должны нанести удар, чтобы обеспечить безопасность остальным!"
  GER_soviet_securing_sphere:0 "Обеспечить сферу влияния"
  wtt_germany.21.b:0 "Мы не можем позволить себе вызвать недовольство Запада."
  wtt_germany.24.t:0 "Красная угроза"
  wtt_germany.24.d:0 "По официальным и неофициальным каналам [GER.GetAdjective] дали ясно понять, что [SOV.GetNameDef] является величайшей угрозой стабильности Европы с момента его создания два десятилетия назад. Они призвали нас помнить, что мы не одиноки в борьбе с угрозой коммунизма и что если только континент объединится, мы сможем одолеть Медведя."
  wtt_germany.24.a:0 "Будем надеяться, что они правы."
  wtt_germany.25.t:0 "[SOV.GetNameDefCap] сглаживает отношения"
  wtt_germany.25.d:0 "[SOV.GetNameDefCap] предпринял согласованный выпад, чтобы развеять опасения европейских государств. В своем публичном заявлении они объявили, что у них нет враждебных намерений, и надеются, что их сдержанная реакция на воинственную риторику [GER.GetAdjective] скажет за них."
  wtt_germany.25.a:0 "Это еще предстоит выяснить."
  wtt_germany.26.t:0 "Умер Вильгельм II"
  wtt_germany.26.d:0 "Прошлой ночью наш горячо любимый кайзер Вильгельм II мирно скончался во сне. Несмотря на его долгую ссылку, провидение сочло возможным позволить ему вернуться на родину задолго до его кончины, и с момента его возвращения он должным образом возглавлял нашу нацию. Его сын Фридрих Вильгельм теперь принял бразды правления страной и после коронации будет известен как Вильгельм III."
  wtt_germany.26.a:0 "Да здравствует кайзер!"
  wtt_germany.27.t:0 "Умер Август фон Макензен"
  wtt_germany.27.d:0 "Прошлой ночью Август фон Макензен, наш самый уважаемый фельдмаршал, мирно скончался во сне. Мы долго будем помнить его прославленные подвиги в Великой войне и изгнание фашистского угнетателя из нашей страны. Сын императора в изгнании, Фридрих Вильгельм, заполнил вакуум власти в нации, и после коронации станет известен как Вильгельм III, правивший Империей после отречения его отца в 1918 году."
  wtt_germany.28.t:0 "[GER.GetNameDefCap] Снимает изгнание Вильгельма II"
  wtt_germany.28.d:0 "[GER.GetNameDefCap] снял изгнание Вильгельма II и теперь обратился к [HOL.GetNameDef] с просьбой вернуть старого императора. Кажется, что несмотря на многочисленные обращения об экстрадиции к [HOL.GetAdjective] правительству, чтобы привлечь его к ответственности за развязывание Первой мировой войны, поджигатель войны вернется, чтобы взять бразды правления [GER.GetNameDef]."
  wtt_germany.28.d.2:0 "[GER.GetNameDefCap] снял изгнание Вильгельма II и теперь обратился к [HOL.GetNameDef] с просьбой вернуть старого императора. Ввиду отказа [HOL.GetAdjective] разрешить его возвращение, они теперь обострили ситуацию до военного конфликта!"
  germany.60.c:0 "Они не будут стоять одни! Объявите [ENG.GetAdjective] войну!"
  wtt_germany.29.d:0 "[GER.GetNameDefCap] отменила ссылку на Вильгельма II и попросила [HOL.GetNameDef] вернуть старого кайзера. Кажется, несмотря на многочисленные экстрадиционные запросы к [HOL.GetAdjective] властям о привлечении его к ответственности за начало Первой мировой войны, подстрекатель войны вернется, чтобы взять в руки бразды правления [GER.GetNameDef].\n\n[FRA.GetAdjective] уже решили, что это неприемлемо, и намерены выпустить ультиматум с применением военной силы. Общественное мнение в [ENG.GetNameDef] против войны, но если мы откажемся встать на сторону [FRA.GetAdjective], наш союз распадется."
  wtt_germany.29.d.2:0 "[GER.GetNameDefCap] отменила ссылку на Вильгельма II и обратилась к [HOL.GetNameDef] с просьбой вернуть старого кайзера. Из-за отказа [HOL.GetAdjective] разрешить его возвращение, они теперь переросли в военный конфликт!\n\n[FRA.GetAdjective] уже решили, что это неприемлемо, и намерены выпустить ультиматум с применением военной силы. Общественное мнение в [ENG.GetNameDef] против войны, но если мы откажемся встать на сторону [FRA.GetAdjective], наш союз распадется."
  germany.61.c:0 "Мы должны прийти на помощь голландцам!"
  wtt_germany.30.d:0 "Германия сняла опалу с Вильгельма II и обратилась к [HOL.GetNameDef] с просьбой вернуть старого кайзера. Похоже, несмотря на многочисленные требования об экстрадиции, предъявленные правительству [HOL.GetAdjective] с целью привлечения его к ответственности за развязывание Великой войны, поджигатель войны вернется, чтобы взять бразды правления [GER.GetNameDef].\n\n[FRA.GetAdjective] кажутся довольными, ограничивая свою реакцию на этот беспредел дипломатическими возражениями, а общественное мнение в [ENG.GetNameDef] твердо выступает против войны."
  wtt_germany.31.d:0 "Англичане отказываются поддержать нас против [GER.GetNameDef], утверждая, что монархия [GER.GetAdjective] — это внутреннее дело. Если мы вступим в войну с [GER.GetAdjective], похоже, что мы будем сражаться в одиночку.\n\nОбщественное мнение во Франции против войны, но [GER.GetNameDef] будет только наращивать свою мощь, а возвращение кайзера может вполне вызвать возрождение имперских настроений. Выдвижение ультиматума было бы менее опасным, если бы [ENG.GetNameDef] была на нашей стороне. Должны ли мы выступить против них в одиночку?"
  wtt_germany.32.d:0 "Хотя в [ENG.GetNameDef] нет народной поддержки войны, [ENG.GetAdjective] правительство признало угрозу, которую представляют [GER.GetAdjective]ы, и они предложили нам свою полную поддержку. Мы направим [GER.GetNameDef] ультиматум, чтобы не допустить возвращения поджигателя войны кайзера. Если они откажутся, наступит время для наших сил вторгнуться вглубь [GER.GetNameDef] и положить конец их тираническому режиму!"
  wtt_germany.33.d:0 "[ENG.GetAdjective] и [FRA.GetAdjective] отказались принять возвращение нашего кайзера, назвав это "возмутительным" возвращением предполагаемого подстрекателя Великой войны на его трон. Они мобилизуют свои силы против нас и выдвинули ультиматум, что наши войска немедленно отступят и вернут кайзера в изгнание, или наши страны будут в состоянии войны."
  wtt_germany.33.a:0 "Мы не можем отступить! Да здравствует кайзер!"
  wtt_germany.34.d:0 "[ENG.GetAdjective] проявили благоразумие и приняли возвращение кайзера, но безумные [FRA.GetAdjective] отказываются уступить! Заявляя, что этот инцидент представляет прямую угрозу безопасности их государства, они мобилизуют свои силы и могут в любой момент ворваться через границу! Мы находимся в состоянии войны!"
  wtt_germany.35.d:0 "Несмотря на наши разъяснения, что возвращение Вильгельма II на [GER.GetAdjective] трон будет расценено как акт войны, [GER.GetNameDef] отказался уступить и отправить своего кайзера в изгнание, проигнорировав наше предупреждение. Это означает, что, несмотря на все наши усилия по поддержанию мира, в Европе снова разразилась война."
  wtt_germany.38.t:0 "Требование [GER.GetAdjective] о возвращении Циндао"
  wtt_germany.38.desc:0 "В последнее время [GER.GetNameDefCap] все чаще прибегает к риторике, призывая к возвращению колониализма. Теперь они по дипломатическим каналам потребовали возвращения своего старого анклава в Циндао. Возможно, мы сможем использовать это, чтобы прийти к выгодному соглашению."
  wtt_germany.38.a:0 "В обмен на это потребовать постоянной поддержки фон Фалькенхаузена."
  wtt_germany.38.b:0 "Возможно, их присутствие в этом районе будет полезным."
  wtt_germany.38.c:0 "Мы никогда больше не откажемся от нашей суверенной территории!"
  wtt_germany.39.t:0 "Китай предлагает торговлю Циндао"
  wtt_germany.39.desc:0 "Китайские чиновники связались с нами с предложением потенциальной сделки, которая, по их словам, удовлетворит обе стороны. Они предлагают вернуть Циндао в законные [GER.GetAdjective] руки в обмен на гарантию, что мы не отзовем миссию фон Фалькенхаузена."
  wtt_germany.39.a:0 "Мы можем согласиться с этим."
  wtt_germany.39.b:0 "Нет, мы должны держать свои варианты открытыми."
  wtt_germany.40.t:0 "[From.GetNameDefCap] Отклоняет требование Циндао"
  wtt_germany.40.desc:0 "[From.GetNameDefCap] категорически отклонил наши требования о возвращении Циндао. У нас не останется выбора, кроме как добиваться его возвращения позже."
  wtt_germany.40.a:0 "Мы можем подождать."
  wtt_germany.41.t:0 "[GER.GetNameDefCap] принимает предложение о торговле Циндао"
  wtt_germany.41.desc:0 "[GER.GetNameDefCap] принял наше предложение об обмене Циндао. Они гарантировали нам дальнейшую поддержку Фалькенхаузена."
  wtt_germany.42.t:0 "[GER.GetNameDefCap] отвергает предложение о торговле Циндао"
  wtt_germany.42.desc:0 "[GER.GetNameDefCap] отклонил наше предложение о торговле Циндао. Похоже, они не так сильно желают получить свой анклав."
  wtt_germany.43.t:0 "[GER.GetAdjective]s требуют возвращения Циндао"
  wtt_germany.43.desc:0 "В последнее время [GER.GetNameDefCap] произносит все больше речей, призывая к возвращению к колониализму. Несмотря на то, как они потеряли Циндао - мы захватили его в 1914 году - [GER.GetAdjective]s решили начать дипломатические переговоры, требуя возвращения своего бывшего анклава в Циндао. Возможно, мы сможем использовать это, чтобы прийти к выгодному соглашению."
  wtt_germany.43.a:0 "Потребуйте от [GER.GetAdjective]s отозвать Фалькенхаузена в обмен на это."
  wtt_germany.43.b:0 "Они больше никогда не ступят на Дальний Восток!"
  wtt_germany.44.t:0 "[JAP.GetNameDefCap] предлагает торговлю Циндао"
  wtt_germany.44.desc:0 "[JAP.GetAdjective] предложили нам сделку, по их словам, удовлетворяющую обе стороны. Они предлагают вернуть Циндао в [GER.GetAdjective] руки взамен на немедленный вывод миссии фон Фалькенхаузена из Китая."
  wtt_germany.46.desc:0 "[GER.GetNameDefCap] приняли наше предложение о Циндао. Они сразу же отозвали миссию фон Фалькенхаузена в Китай."
  wtt_germany.48.t:0 "[From.GetNameDefCap] принимает условия"
  wtt_germany.48.desc:0 "[From.GetNameDefCap] принял наши условия и организовал немедленный возврат Циндао в руки [GER.GetAdjective]!"
  wtt_germany.49.t:0 "Нацистское изгнание наносит тяжелый ущерб [nazi_state_withdrawn.GetName]"
  wtt_germany.49.desc:0 "Нам, наконец, удалось получить контроль над [nazi_state_withdrawn.GetName], но борьба была серьезной. Нацисты становятся все более фанатичными и отчаянными, по мере нашего продвижения, часто сражаясь до тех пор, пока окружающая местность не превращается в руины. Также поступали сообщения о тактике выжженной земли, согласно 'Неробефелю' Гитлера.\n\nМы, несомненно, ожидаем дальнейших разрушений в таких масштабах, пока не закончим эту войну."
  wtt_germany.49.a:0 "Небольшая цена за то, чтобы очистить нашу родину от них."
  wtt_germany.50.t:0 "Гитлер найден мертвым"
  wtt_germany.50.desc:0 "Захватив Берлин, наши войска обнаружили труп Гитлера в одном из городских бункеров. Предпочтя смерть поражению в войне с антифашистами, он покончил с собой, нежели сдался.\n\nГенрих Гиммлер встал во главе нацистов. Он заверил, что правительство продолжит борьбу с «антигерманской изменой»."
  wtt_germany.50.a:0 "Это начало конца для нацистов."
  wtt_germany.51.t:0 "Восстановить захваченное нацистское руководство?"
  wtt_germany.51.desc:0 "Война приняла затяжной и разрушительный характер, теперь на фронт отправляются все взрослые немцы. Захваченное нацистское руководство не разделяет наших идеологических взглядов, но обладает ценными умениями, которые пригодятся нам в это трудное время.\n\nМы можем предложить им свободу после войны в обмен на сотрудничество с нами сейчас."
  wtt_germany.51.a:0 "Да, частично восстановить нацистское руководство."
  reinstate_nazi_leadership_TT:0 "Советники, доступные только фашистам, снова могут занять свои посты.\n"
  wtt_germany.51.b:0 "Нет, пусть сидят там, где сидят."
  wtt_germany.51.c:0 "Нельзя позволить им снова обрести свободу, если мы проиграем войну. Повесить!"
  wtt_germany.52.t:0 "Гражданская война за демократию в [From.From.GetName]"
  wtt_germany.52.desc:0 "Демократические элементы в [From.From.GetNameDef] начали гражданскую войну, чтобы восстановить свободные выборы и вернуть власть народу. Им может потребоваться наша помощь, и их успех обеспечит союзника в будущем."
  wtt_germany.52.a:0 "Мы будем поддерживать демократию!"
  wtt_germany.52.b:0 "Им придется решать свои проблемы самостоятельно."
  wtt_germany.53.t:0 "В [AUS.GetAdjective] увеличились про-[GER.GetAdjective] настроения"
  wtt_germany.53.desc:0 "С тех пор как мы некоторое время являемся союзниками, [GER.GetAdjective] настроения в нашей южной соседке Австрии заметно возросли. Не исключено, что референдум с требованием объединения с Германией может встретить одобрение [AUS.GetAdjective] народа. Стоит ли нам призвать [AUS.GetAdjective] правительство провести его?"
  wtt_germany.53.a:0 "Да, решение о Малой Германии было ошибкой."
  wtt_germany.53.b:0 "Нет, решение о Великой Германии было бы ошибкой."
  wtt_germany.54.t:0 "[GER.GetAdjective] правительство призывает к референдуму об объединении"
  wtt_germany.54.desc:0 "[GER.GetAdjective] правительство обратилось к нам с предложением об объединении, если этого пожелает австрийский народ. Они призывают нас провести референдум, чтобы мы могли это выяснить."
  wtt_germany.54.a:0 "Агитация в пользу объединения."
  wtt_germany.54.b:0 "Агитация против объединения."
  wtt_germany.55.t:0 "[AUS.GetAdjective] люди голосуют за объединение"
  wtt_germany.55.desc:0 "Народ [AUS.GetAdjective] проголосовал за объединение со своими северными собратьями. Интеграция австрийских земель и их вооруженных сил начнется незамедлительно."
  wtt_germany.55.a:0 "Великий день для германского вопроса!"
  wtt_germany.56.t:0 "[GER.GetAdjective] территории"
  wtt_germany.56.desc:0 "Наша война с [SOV.GetNameDef] идет не так, как мы рассчитывали, и мы рискуем всем. На западе [GER.GetNameDef] претерпела стремительные изменения за последние несколько лет, но теперь она стала надежным защитником демократических ценностей. Организация быстрого возвращения старых [GER,GetAdjective] территорий Данцига и Познани, несомненно, спасет миллионы от угнетения под [SOV.GetAdjective] сапогом."
  wtt_germany.56.a:0 "[GER.GetNameDef] , а не [SOV.GetAdjective]ы!"
  wtt_germany.56.b:0 "Никогда! Что [POL.GetAdjective], то и падёт [POL.GetAdjective]!"
  wtt_germany.57.t:0 "[POL.GetNameDefCap] предлагает вернуть [GER.GetAdjective] территории"
  wtt_germany.57.desc:0 "Поскольку [POL.GetAdjective] война с [SOV.GetNameDef] идёт не очень хорошо, их правительство вышло с нами на связь по секретным каналам, предложив быстрое возвращение наших старых территорий Данцига и Познани. Они утверждают, что их народу, несомненно, будет лучше под демократическим [GER.GetAdjective] правлением, чем под гнетом [SOV.GetAdjective]."
  wtt_germany.57.a:0 "Такое коварство! Мы сохраним их в безопасности."
  wtt_germany.57.b:0 "Нет, мы не можем рисковать возмездием [SOV.GetAdjective]."
  wtt_germany.58.t:0 "[AUS.GetAdjective] отказываются от объединения"
  wtt_germany.58.desc:0 "[AUS.GetAdjective] отклонили наши призывы к объединению, предпочтя сохранить [AUS.GetAdjective] независимость хотя бы еще на некоторое время."
  wtt_germany.58.a:0 "Мы должны уважать их желание."
  wtt_germany.59.t:0 "[GER.GetNameDefCap] принимает Данциг и Познань"
  wtt_germany.59.desc:0 "[GER.GetAdjective] правительство приняло решение принять их старые территории и торжественно поклялось защитить [POL.GetAdjective] жителей региона."
  wtt_germany.59.a:0 "По крайней мере, они будут в безопасности."
  wtt_germany.60.t:0 "[GER.GetNameDefCap] отвергает Данциг и Познань"
  wtt_germany.60.desc:0 "[GER.GetAdjective] правительство сообщило нам, что не может принять наше предложение. Они опасаются возмездия со стороны [SOV.GetAdjective] и поэтому чувствуют, что не могут идти на риск."
  wtt_germany.60.a:0 "Кто поможет им, когда все падут перед красными?"
  wtt_germany.62.t:0 "Компании требуют выплаты MEFO"
  wtt_germany.62.desc:0 "С окончанием недавней войны, компании, которым мы выпустили векселя MEFO, сейчас призывают нас осуществить выплаты. Они утверждают, что больше нет необходимости удерживать выплаты «во благо отечества»."
  wtt_germany.62.a:0 "Хорошо."
  wtt_germany.63.t:0 "[GER.GetName] повторно интегрирует Эльзас-Лотарингию"
  wtt_germany.63.desc:0 "Правительство [GER.GetAdjective] приняло закон о реинтеграции Эльзас-Лотарингии и Люксембурга в состав [GER.GetNameDef]. Уже начался массовый призыв населения."
  wtt_germany.63.a:0 "Ублюдки! С этим мы еще не покончили!"
  wtt_germany.64.t:0 "[GER.GetName] реинтегрирует Люксембург"
  wtt_germany.64.a:0 "Что мы можем сделать?"
  wtt_germany.65.t:0 "[From.GetNameDefCap] запрашивает участие в войне"
  wtt_germany.65.desc:0 "[From.GetNameDefCap] проинформировал нас, что им требуются наши земли для продвижения своих войск к [SOV.GetAdjective] противнику. Они напоминают нам, что мы находимся под их защитой от коммунистов и что, следовательно, мы должны помочь им в их нынешней войне."
  wtt_germany.65.a:0 "Они правы - мы вступим в их войну."
  wtt_germany.65.b:0 "Кем они себя возомнили? Никогда!"
  wtt_germany.66.t:0 "[From.GetNameDefCap] принимает требования"
  wtt_germany.66.desc:0 "[From.GetNameDefCap] решил присоединиться к нам в нашей войне против [SOV.GetNameDef], что также дает нам преимущество прохода наших войск через их страну."
  wtt_germany.67.t:0 "[From.GetName] отклоняет требования"
  wtt_germany.67.desc:0 "[From.GetNameDefCap] отклонил наши требования об участии в войне и продолжает закрывать свои границы для наших войск. Если поляки не пожелают предоставить доступ для наших войск, мы должны будем пройти через их страну силой."
  wtt_germany.67.a:0 "Они сами напросились."
  wtt_germany.68.t:0 "[From.GetName] предлагает восстановить империю"
  wtt_germany.68.desc:0 "Правительство [From.GetAdjective] предложило нам воссоздать старую Австро-Венгерскую империю. Поскольку в наших странах сильны проимперские настроения, они утверждают, что объединение будет в интересах всех"
  wtt_germany.68.a:0 "Прекрасная идея! Мы согласны"
  wtt_germany.68.b:0 "Присоединиться к ним добровольно? Ни за что!"
  wtt_germany.69.t:0 "[From.GetName] соглашается войти в состав"
  wtt_germany.69.desc:0 "Правительство [From.GetAdjective] ответило на наше предложение о воссоздании старой Австро-Венгерской империи. Они признают преимущества такого шага и заявили о своей готовности объединить свое государство с нашим, если все стороны согласны"
  wtt_germany.70.t:0 "[From.GetName] отклоняет предложение войти в состав"
  wtt_germany.70.desc:0 "Правительство [From.GetAdjective] ответило на наше предложение о воссоздании старой Австро-Венгерской империи. Они заявили, что не согласятся добровольно принять наше руководство в таком начинании"
  wtt_germany.71.t:0 "Воссоздание Австро-Венгерской империи"
  wtt_germany.71.desc:0 "Наши соседи, правопреемники Австро-Венгрии, приняли предложение о повторной интеграции своих земель в нашу страну, тем самым возродив Австро-Венгерскую империю. Восхищенные массы приветствовали подписание договора о воссоединении на улицах, и [GER.GetAdjective] правительство с радостью приветствовало нас обратно в своем альянсе."
  wtt_germany.71.a:0 "Начинается новая эра для Австро-Венгрии."
  wtt_germany.72.t:0 "[From.GetNameDefCap] предлагает экономическую интеграцию"
  wtt_germany.72.desc:0 "Поскольку мы уже являемся близкими союзниками, [From.GetNameDef] выступил с предложением расширить нашу военную экономику за счет более полной интеграции наших экономик. Это значительно поможет нашему военному росту, но также сделает нас подчиненными им в вопросах внешней политики."
  wtt_germany.72.a:0 "Отличная идея - наши судьбы переплетены."
  wtt_germany.72_tt:0 "§RМы потеряем контроль над любыми подданными, которые у нас могут быть.§!\n"
  wtt_germany.72.b:0 "Мы так не думаем, наш суверенитет слишком ценен."
  wtt_germany.73.t:0 "[From.GetNameDefCap] принимает экономическую интеграцию"
  wtt_germany.73.desc:0 "[From.GetAdjective] правительство сообщает нам, что оно принимает наше предложение об интеграции наших военных экономик. Они с нетерпением ждут нашего руководства, чтобы построить свою армию по нашему образцу успеха."
  wtt_germany.73.a:0 "Под нашей опекой их армии будут расти."
  wtt_germany.74.t:0 "[From.GetNameDefCap] отвергает экономическую интеграцию"
  wtt_germany.74.desc:0 "Правительство $From.GetAdjective$ информирует нас о том, что они отклоняют наше предложение об объединении нашей военной экономики. Они ценят свой суверенитет больше, чем полезность своих армий."
  wtt_germany.74.a:0 "Они отвергают само величие!"
  wtt_germany.999.t:0 "Запрос $From.GetLeader$ на восстановление королевских титулов"
  wtt_germany.999.desc:0 "От имени кайзера $From.GetLeader$, правительство $From.GetAdjective$ запросило нас отменить лишение британского пэрства и королевских титулов немецких королевских и княжеских семей, как это предусмотрено Законом о лишении титулов 1917 года. Они утверждают, что это покажет миру, как британские и немецкие королевские и княжеские семьи уже вернулись к своим превосходным довоенным отношениям, и, таким образом, это будет служить символом будущей англо-германской дружбы."
  wtt_germany.999.a:0 "Это отличная идея!"
  wtt_germany.999.b:0 "Мы так не думаем."
  wtt_germany.1000.t:0 "Правительство $From.GetAdjective$ принимает запрос"
  wtt_germany.1000.desc:0 "[From.GetAdjective] правительства решили поддержать наш запрос на восстановление британских титулов пэров и королевских титулов немецким королевским и княжеским семьям. Они предлагают грандиозную \"королевскую церемонию века\". Вся немецкая знать приглашена, чтобы им лично были возвращены титулы, которые были у них несправедливо отобраны двадцать лет назад.\n\nИмперские советники предложили, чтобы вся многочисленная королевская семья совершила грандиозное появление, используя самые передовые достижения немецкой техники. Дирижабль Hindenburg, последний шедевр техники, идеально подходит для этой цели."
  wtt_germany.1000.a:0 "Отличная мысль! Мы направим связного."
  wtt_germany.1000.a_tt:1 "Принцесса Виктория Луиза отправлена вперед, чтобы помочь в подготовке этой грандиозной церемонии. Это несколько истощит ресурсы нашего правительства."
  wtt_germany.1000.b:0 "Отличная мысль! Мы все отправимся вместе."
  wtt_germany.1000.b_tt:0 "Вся многочисленная королевская семья отправится на церемонию на борту дирижабля Hindenburg. Это повысит престиж императорской семьи в глазах наших союзников и нашего народа, что укрепит положение нашего правительства."
  wtt_germany.1001.t:0 "Hindenburg в огне в Лондоне"
  wtt_germany.1001.desc:1 "Дирижабль "Гинденбург" трагически разбился сегодня во время попытки пристыковаться в Лондоне. По причинам, которые пока не установлены, воздушный корабль охватило пламенем, и он рухнул на землю, унеся жизни всех пассажиров и членов экипажа на борту, включая практически всех членов расширенной императорской семьи Германии.\n\nЕдинственная выжившая - принцесса Виктория Луиза, которая была отправлена заранее, чтобы помочь в подготовке к церемонии. Принцесса, третья из тех, кто носил имя "Виктория", после ее бабушки, немецкой императрицы Виктории, и прабабушки королевы Виктории, стала единственной оставшейся наследницей престола. Все еще потрясенная потерей семьи, она взошла на трон как кайзерин Виктория I Германской империи."
  wtt_germany.1001.a:0 "Император мертв. Да здравствует кайзерин!"
  wtt_germany.1002.desc:0 "Дирижабль "Гинденбург" трагически разбился сегодня во время попытки пристыковаться в Лондоне. По причинам, которые пока не установлены, воздушный корабль охватило пламенем, и он рухнул на землю, унеся жизни всех пассажиров и членов экипажа на борту, включая всех членов расширенной императорской семьи Германии.\n\nС полным уничтожением императорской семьи правительство взяло на себя непосредственный контроль, но маловероятно, что в краткосрочной перспективе это приведет к возвращению демократии."
  wtt_germany.1002.a:0 "Трагедия!"
  wtt_germany.1003.t:0 "[From.GetAdjective] Правительство отклонило запрос"
  wtt_germany.1003.desc:0 "После длительного заседания в парламенте [From.GetAdjective] правительство решило отклонить нашу просьбу о восстановлении британских пэрств и королевских титулов для королевских и княжеских семей Германии."
  wtt_germany.1003.a:0 "Это крайне прискорбно."
  wtt_news.1000.desc:0 "Сегодня во время попытки приземлиться в Лондоне трагически погиб Гинденбург. По пока неустановленным причинам дирижабль охватило пламя и он рухнул на землю, унеся жизни всех пассажиров и членов экипажа на борту - включая практически всех членов расширенной имперской семьи Германии.\n\nЕдинственной выжившей является принцесса Виктория Луиза, которая была отправлена вперед для помощи в подготовке церемонии. Принцесса, ставшая третьей королевской особой, носящей имя "Виктория", после своей бабушки, германской императрицы Виктории, и своей прабабушки королевы Виктории, стала единственной оставшейся наследницей престола. Все еще потрясенная потерей своей семьи, она взошла на трон как кайзерин Виктория I Германской империи."
  wtt_news.1000.a:0 "Страшная трагедия с неожиданными результатами."
  wtt_news.1001.desc:0 "Сегодня произошла трагическая катастрофа дирижабля "Гинденбург" при попытке пристыковаться в Лондоне. По пока невыясненным причинам воздушный корабль вспыхнул и упал на землю, унеся жизни всех пассажиров и членов экипажа, включая всех членов большой императорской семьи Германии.\n\nПосле полного уничтожения императорской семьи правительство взяло под свой прямой контроль, но вряд ли это обеспечит в ближайшее время возвращение демократии."
  wtt_news.1001.a:0 "Какая ужасная трагедия!"
  wtt_news.1.t:0 "В Германии началась гражданская война"
  wtt_news.1.desc:0 "Внезапный переворот вермахта под предводительством известного фельдмаршала Августа фон Макензена привел к началу гражданской войны в Германии сегодня утром. Коммунисты, монархисты и демократы с оружием в руках выступили против бывших соотечественников, а воинские части были переброшены с границ, чтобы бороться с внутренней угрозой.\n\nФашисты, следуя приказам Гитлера, уже поклялись уничтожить нацию, чтобы она не досталась "вероломным немцам"."
  wtt_news.1.a:0 "Теперь дороги назад нет."
  wtt_news.1.b:0 "Военные предали нас! Мы не должны терпеть такого же."
  wtt_news.1.c:0 "Будем надеяться, что в Европе вскоре воцарится мир."
  wtt_news.2.t:0 "[From.GetNameDefCap] Препятствует возвращению Вильгельма II"
  wtt_news.2.desc:0 "Вскоре после того, как [GER.GetNameDef] снял ссылку с Вильгельма II в неожиданном заявлении вчера утром, [HOL.GetAdjective] власти заблокировали автоколонну старого кайзера перед тем, как она пересекла [GER.GetAdjective] границу, и заставили его вернуться в свою резиденцию в Хьюс-Дорне.\n\nОфициальное [HOL.GetAdjective] коммюнике ссылается на опасения дестабилизации континента, если Вильгельм II вновь займет германский трон. Поэтому [HOL.GetAdjective] правительство взяло на себя ответственность взять старого кайзера под домашний арест.\n\n[GER.GetAdjective] ответ на кризис пока не получен, но в публичных высказываниях содержится требование применить военную силу, чтобы обеспечить возвращение кайзера.\n"
  wtt_news.2.a:0 "Как они смеют?"
  wtt_news.2.b:0 "Им лучше знать, что они делают."
  wtt_news.2.c:0 "Кто-то должен был занять позицию."
  wtt_news.3.t:0 "Вильгельм II возвращается в [GER.GetNameDef]"
  wtt_news.3.desc:0 "В неожиданном заявлении вчера утром [GER.GetAdjective] правительство официально сняло ссылку с Вильгельма II. Позже в тот же день автоколонна старого кайзера пересекла [HOL.GetAdjective]-[GER.GetAdjective] границу, и по возвращении в Берлин он был торжественно восстановлен в должности кайзера Германской империи.\n\nКайзер уже поклялся вернуть [GER.GetNameDef] ее бывшее величие, но еще неизвестно, в каком направлении будет развиваться дипломатия нации."
  wtt_news.3.a:0 "Да здравствует кайзер!"
  wtt_news.3.b:0 "Возвращение в начало века?"
  wtt_news.3.c:0 "Мы внесли свой вклад в обеспечение его безопасности."
  wtt_news.3.d:0 "Мы должны были надавить на [HOL.GetAdjective] сильнее, чтобы добиться его экстрадиции!"
  wtt_news.4.t:0 "Вильгельм II освобождён из-под [HOL.GetAdjective] домашнего ареста"
  wtt_news.4.desc:0 "Несмотря на тщетные попытки [HOL.GetAdjective] противостоять наступлению [GER.GetAdjective], правительство не видело иного выхода, кроме как капитулировать перед лицом подавляющей силы [GER.GetAdjective]. Войска [GER.GetAdjective] освободили старого кайзера из-под домашнего ареста в Хёйс-Доорне, и с момента его возвращения в Берлин он был торжественно восстановлен в качестве кайзера Германской империи.\n\nКайзер уже поклялся вернуть [GER.GetNameDef] её былое величие, но ещё неизвестно, какое направление выберет нация в своей дипломатии."
  wtt_news.4.a:0 "Никто не остановит [GER.GetNameDef]!"
  wtt_news.4.b:0 "Это был глупый жест со стороны [HOL.GetAdjective]."
  wtt_news.4.c:0 "Возможно, это была не такая уж и хорошая идея."
  wtt_news.5.t:0 "Муссолини убит"
  wtt_news.5.desc:0 "Поступают сообщения из Рима, что сегодня в полдень на улицах города был застрелен Дуче. В то же время определенные элементы правительства приняли меры, чтобы захватить власть у итальянских фашистов. Был произведен ряд арестов, и военные подразделения оцепили правительственные здания и улицы, введя комендантский час.\n\nПредставители правительства путчистов объявили о своей лояльности Виктору Эммануилу III. Своим первым шагом в качестве лидера [ITA.GetNameDef] король подписал договор о союзе с [GER.GetNameDef]."
  wtt_news.5.a:0 "Все прошло просто идеально."
  wtt_news.5.b:0 "Да здравствует король!"
  wtt_news.5.c:0 "[GER.GetAdjective], похоже, приложили к этому руку."
  wtt_news.6.t:0 "Австро-Венгрия возрождена"
  wtt_news.6.desc:1 "Государства-преемники Дунайской Австро-Венгерской империи в последнее время пережили волну проимперских настроений и под руководством [From.GetOldNameDef] решили объединить свои страны в Австро-Венгрию.\n\nНовое австро-венгерское правительство немедленно приняло меры по подписанию официального договора о союзе с [GER.GetNameDef], открыто заявив о своей поддержке [GER.GetAdjective] анти-[ENG.GetAdjective] и анти-[FRA.GetAdjective] внешней политики."
  wtt_news.6.a:0 "И нам даже не пришлось стрелять."
  wtt_news.6.b:0 "Опять вместе!"
  wtt_news.6.c:0 "Новый блок сил в Европе? Вызывает беспокойство."
  wtt_news.7.t:0 "[POL.GetNameDefCap] возвращает Данциг"
  wtt_news.7.desc:0 "Правительство [POL.GetAdjective] приняло предложение [GER.GetAdjective] о возвращении Данцига в обмен на военные гарантии. Был подписан договор, в котором [GER.GetAdjective] гарантируют помощь полякам в случае любого акта агрессии в отношении них.\n\nХотя цена оказалась высока, поскольку поляки были полностью отрезаны от моря, она могла того стоить в свете коммунистической угрозы с Востока."
  wtt_news.7.a:0 "'Данциг или война'? Ха! Дипломатия снова восторжествовала."
  wtt_news.7.b:0 "Остаётся надеяться, что цена была оправданной."
  wtt_news.7.c:0 "Немцы вмешиваются в нашу сферу влияния."
  wtt_news.7.d:0 "Выгодная сделка для обеих сторон? Поживём - увидим."
  wtt_news.8.t:0 "Конец германской гражданской войны"
  wtt_news.8.desc:0 "Гражданская война в Германии подошла к концу. Бои были чрезвычайно ожесточёнными, фанатичное сопротивление нацистов привело к разрушениям, сравнимым с Первой мировой войной.\n\nПо имеющимся данным, Гитлер мёртв, а нацистское руководство арестовано или казнено. Временное правительство заявило, что в данный момент необходимо укрепить контроль над государством и обеспечить стабильность в стране, и лишь затем задумываться о проведении конституционной реформы."
  wtt_news.8.a:0 "Пусть начнётся восстановление."
  wtt_news.8.b:0 "Остаётся надеяться, что новый режим будет более сговорчивым."
  wtt_news.9.t:0 "СССР объявляет о масштабных учениях"
  wtt_news.9.desc:0 "В ответ на то, что они называют \"всё более враждебной [GER.GetAdjective] риторикой\", [SOV.GetAdjective] объявила в этом году ряд масштабных военных учений.\n\nПо мнению представителей [SOV.GetAdjective] правительства, повышение боевой готовности не позволит [GER.GetAdjective] \"продолжать свою клеветническую тираду\"."
  wtt_news.9.a:0 "Они сыграли нам на руку!"
  wtt_news.9.b:0 "Это, безусловно, заставит их задуматься."
  wtt_news.9.c:0 "Будем надеяться, что [GER.GetAdjective] нас не подведут."
  wtt_news.9.d:0 "Они не помогают разрядить обстановку."
  wtt_news.10.t:0 "Увеличение [SOV.GetAdjective] вооруженных сил"
  wtt_news.10.desc:0 "В ответ на недавнее заявление [GER.GetAdjective] о создании центральноевропейского альянса против [SOV.GetAdjective] агрессии [SOV.GetAdjective] правительство приняло меры по резкому ускорению производства вооружений.\n\nПредставитель Кремля недвусмысленно заявил, что [SOV.GetNameDef] не могут спокойно наблюдать, как эта угроза разворачивается у них на границе. Меры для противодействия ей были приняты немедленно."
  wtt_news.10.a:0 "Они продолжают неосознанно помогать нашему делу!"
  wtt_news.10.b:0 "Они не осмелятся предпринять ещё более глупые попытки!"
  wtt_news.10.c:0 "По крайней мере, альянс был сформирован."
  wtt_news.10.d:0 "Это быстро разрастается."
  wtt_news.11.t:0 "Переход [SOV.GetAdjective] к обеспечению безопасности сферы"
  wtt_news.11.desc:0 "Получив приглашение одного из приграничных государств в [GER.GetFactionName], Советское правительство однозначно предупредило о недопустимости дальнейшего вмешательства в дела их «сферы влияния».\n\nНеподтвержденные данные указывают на мобилизацию советских вооруженных сил, возможно, в рамках подготовки к войне."
  wtt_news.11.a:0 "Неужели мы наконец-то довели их до предела?"
  wtt_news.11.b:0 "Мы должны защитить наши границы!"
  wtt_news.11.c:0 "Вместе мы можем противостоять им!"
  wtt_news.11.d:0 "Это ли та самая искра?"
  wtt_news.11.e:0 "Мы должны готовиться к войне!"
  wtt_news.12.t:0 "Протесты против кайзера приводят к войне"
  wtt_news.12.desc:0 "В ответ на [GER.GetAdjective] решение о разрешении возвращения Вильгельма II [FRA.GetNameDef] и [ENG.GetNameDef] объявили войну [GER.GetNameDef]. [FRA.GetAdjective] и [ENG.GetAdjective] указывают на «явное [GER.GetAdjective] упрямство», послужившее причиной эскалации, — разрешение «известному военному преступнику» снова встать во главе государства.\n\nПредставители соответствующих правительств утверждают, что совершенно безнравственно позволять «главному подстрекателю» Великой войны вновь надеть немецкую корону и что германское правительство проигнорировало все предупреждения. «У нас не было другого выбора»."
  wtt_news.12.a:0 "Они посмели указывать нам, кто может быть нашим лидером?"
  wtt_news.12.b:0 "Они вынудили нас действовать!"
  wtt_news.12.c:0 "Итак, мы вернулись в 1914 год."
  wtt_news.13.t:0 "Компромисс Вильгельма III"
  wtt_news.13.desc:0 "В ответ на решительное англо-французское сопротивление возвращению Вильгельма II на престол кайзера, [GER.GetAdjective] правительство предложило компромиссное решение, согласно которому Вильгельм II продолжит жить в изгнании. Тем не менее, его сын займет германский трон как Вильгельм III.\n\nПоскольку [ENG.GetNameDef] и [FRA.GetNameDef] приняли это решение, можно надеяться, что оно приведет к продолжительному миру между великими европейскими державами."
  wtt_news.13.a:0 "У нас не было другого выбора."
  wtt_news.13.b:0 "К счастью, [GER.GetAdjective] прислушались к голосу разума."
  wtt_news.13.c:0 "Мир сохранен."
  wtt_news.14.desc:0 "В ответ на решение [GER.GetAdjective] разрешить возвращение Вильгельма II и несмотря на отсутствие поддержки со стороны [ENG.GetAdjective], [FRA.GetNameDef] объявила войну [GER.GetNameDef]. [FRA.GetAdjective] называют причиной эскалации «яркое [GER.GetAdjective] упрямство» в разрешении «известному военному преступнику» вновь стать главой государства.\n\nПредставители правительства [FRA.GetAdjective] утверждают, что совершенно безнравственно позволять «главному подстрекателю» Первой мировой войны снова занять германский престол. Правительство [GER.GetAdjective] проигнорировало все предупреждения: «У нас не было другого выбора»."
  wtt_news.14.c:0 "Глупые, упрямые французы!"
  wtt_news.14.d:0 "Но что предпримут [ENG.GetAdjective]?"
  wtt_news.15.desc:0 "В ответ на решительное [FRA.GetAdjective] сопротивление возвращению Вильгельма II в качестве Кайзера, [GER.GetAdjective] правительство предложило компромисс, согласно которому Вильгельм II продолжит жить в изгнании. Однако его сын займет [GER.GetAdjective] трон как Вильгельм III.  \n\nБудем надеяться, что согласие [FRA.GetNameDef] приведет к длительному миру между великими европейскими державами."
  wtt_news.15.c:0 "К счастью, [GER.GetAdjective] были более разумны, чем [FRA.GetAdjective]."
  wtt_news.16.t:0 "Китай возвращает Циндао под правление Германии"
  wtt_news.16.desc:0 "Китайское правительство решило удовлетворить недавние требования [GER.GetAdjective] вернуть свой старый анклав в Циндао. \n\nС этого момента [GER.GetAdjective] вновь контролируют городские кварталы, и [GER.GetAdjective] правительство переименовало город на старое [GER.GetAdjective] название Циндао."
  wtt_news.16.a:0 "Мы еще вернем себе былую колониальную славу."
  wtt_news.16.b:0 "Это была небольшая цена."
  wtt_news.16.c:0 "Мы отняли у них это прежде, можем сделать это снова!"
  wtt_news.16.d:0 "[GER.GetAdjective] колониализм снова?"
  wtt_news.17.t:0 "[JAP.GetNameDefCap] возвращает [GER.GetAdjective] контроль над Циндао"
  wtt_news.17.desc:0 "Правительство [JAP.GetAdjective] приняло решение согласиться на последние требования [GER.GetAdjective] о возвращении их старого анклава в Циндао.\n\nС этого момента [GER.GetAdjective] восстановили свой контроль над границами города, и [GER.GetAdjective] переименовали его в прежнее название [GER.GetAdjective] - Циндао."
  wtt_news.17.b:0 "Как они смеют сдавать нашу территорию?"
  wtt_news.17.c:0 "Считаем, что мы квиты за 1914 год."
  wtt_news.18.t:0 "[AUS.GetNameDefCap] голосует за присоединение к [GER.GetNameDef]"
  wtt_news.18.desc:0 "С начала тесного сотрудничества между союзниками [AUS.GetNameDef] и [GER.GetNameDef], в Австрии резко вырос дух объединения. Вчера на плебисците австрийский народ подавляющим большинством проголосовал за объединение со своими северными соседями.\n\nИнтеграция [AUS.GetAdjective] немедленно пошла вперед, и [GER.GetNameDef] упразднило старое государство сегодня утром."
  wtt_news.18.a:0 "За великую Германию."
  wtt_news.18.b:0 "Это то, что они хотели."
  wtt_news.19.t:0 "[POL.GetNameDefCap] возвращает Данциг и Познань"
  wtt_news.19.desc:0 "Перед лицом продолжающегося натиска [SOV.GetAdjective], правительство [POL.GetAdjective] этим утром объявило о немедленном возврате старых немецких территорий Данцига и Познани [GER.GetNameDef].\n\nНесмотря на абсолютное молчание правительств [POL.GetAdjective] или [GER.GetAdjective] о причинах, эксперты сходятся во мнении, что это, скорее всего, попытка не дать этим территориям попасть в руки [SOV.GetAdjective] перед лицом неизбежного военного краха [POL.GetAdjective]."
  wtt_news.19.a:0 "Мы защитим их ценой своей жизни."
  wtt_news.19.b:0 "Это был лучший вариант."
  wtt_news.19.c:0 "Коварные и подлые дипломатические интриги!"
  wtt_news.19.d:0 "Замечательно хитрый дипломатический ход."
  wtt_news.20.t:0 "[GER.GetNameDefCap] объявляет о Анти-[SOV.GetAdjective] пакте"
  wtt_news.20.desc:0 "В свете усиливающейся воспринимаемой [SOV.GetAdjective] агрессии [GER.GetNameDef] предложил "государствам, находящимся под непосредственной угрозой со стороны коммунизма" возможность объединиться против [SOV.GetNameDef]. Любая страна, входящая в альянс, будет обязана участвовать в войне против [SOV.GetNameDef], если наступят времена нападения на одного из членов."
  wtt_news.21.t:0 "[From.GetNameDefCap] выступает против [SOV.GetNameDef]"
  wtt_news.21.desc:0 "[GER.GetAdjective] усилили риторику в отношении [SOV.GetNameDef], предупредив, что восточный сосед Европы является \"великой красной угрозой\", которая нависла над континентом. Является ли это запугиванием или имеет фактическое обоснование, спорно, но похоже, что [GER.GetAdjective] стремятся объединить континент против Востока."
  wtt_news.21.a:0 "Мир должен знать о [SOV.GetAdjective] угрозе!"
  wtt_news.21.b:0 "Как они посмели нас так оклеветать?!"
  wtt_news.21.d:0 "Посмотрим, как [SOV.GetAdjective] это воспримут."
  wtt_news.22.t:0 "[From.GetNameDefCap] объявляет о создании Центрально-Европейского Альянса"
  wtt_news.22.desc:1 "\n[GER.GetNameDefCap] продолжили свою недавнюю анти-[SOV.GetAdjective] риторику и разработали конкретный план по сдерживанию [SOV.GetAdjective] влияния на остальную часть континента. Новый альянс, Центрально-Европейский Альянс, был сформирован и со временем, будем надеяться, сможет обеспечить своим членам защиту от того, что [GER.GetAdjective] называют \"необузданной [SOV.GetAdjective] агрессией\"."
  wtt_news.22.a:0 "Мы поведем Свободную Европу против угрозы коммунизма!"
  wtt_news.22.b:0 "Они все больше угрожают нашей позиции."
  wtt_news.22.c:0 "Наконец-то [GER.GetAdjective] предпринимают шаги."
  wtt_news.22.d:0 "Вряд ли [SOV.GetAdjective] стерпят это бездействуя."
  wtt_news.23.t:0 "Вишистская Франция аннексирована"
  wtt_news.23.desc:0 "Операция по присоединению Вишистской Франции, начавшаяся ранее на этой неделе, успешно завершена. [GER.GetAdjective] войска сумели взять под свой контроль военно-морскую базу в Тулоне, до того, как был отдан приказ затопления французского флота. Весь французский флот невредимым попал в руки [GER.GetAdjective]."
  wtt_news.23.a:0 "Ошеломительный успех!"
  wtt_news.23.b:0 "Они струсили."
  wtt_news.23.c:0 "[GER.GetAdjective] безжалостны."
  wtt_news.24.t:0 "Французский флот затоплен"
  wtt_news.24.desc:0 "Операция по присоединению Вишистской Франции, начавшаяся ранее на этой неделе, успешно завершена. Тем не менее, [GER.GetAdjective] войска не смогли взять под свой контроль военно-морскую базу в Тулоне до того, как был отдан приказ затопления французского флота. В связи с этим весь французский флот был затоплен, чтобы не допустить попадания в руки [GER.GetAdjective]."
  wtt_news.24.a:0 "Разочарование, но ничего страшного."
  wtt_news.24.b:0 "Они сдержали свое слово до конца."
  wtt_news.24.c:0 "Последний акт французского неповиновения."
  wtt_burma_road.1.t:0 "Бирманский тракт закрыт"
  wtt_burma_road.1.desc:0 "Войска [occupying_country.GetAdjective], атакующие [state_occupied.GetName], достигли Бирманского тракта и перерезали путь в нескольких местах. Дальнейшие поставки по этому пути невозможны."
  wtt_burma_road.1.a:0 "Это еще больше осложнит ситуацию."
  wtt_burma_road.2.desc:0 "[From.GetAdjective] решил прекратить перевозки по Бирманской дороге. Все караваны на дороге были остановлены и развернуты. Дальнейшие поставки к нам по этому пути невозможны."
  wtt_burma_road.2.desc_war_with_from:0 "Войска [From.GetAdjective] стремительно продвинулись по Бирманской дороге и захватили несколько важных мостов и переправ. Дорога закрыта для всех перевозок, и дальнейшие поставки к нам по этому пути невозможны."
  wtt_burma_road.3.t:0 "[From.GetNameDefCap] возобновил часть перевозок по Бирманской дороге"
  wtt_burma_road.3.desc:0 "После успешного отвоевания значительной части Бирманской дороги власти [From.GetAdjective] возобновили перевозки по этому пути. Хотя отряды противника делают дорогу ещё более опасной, чем раньше, поставки к нам возобновились."
  wtt_burma_road.3.a:0 "Удачный первый шаг."
  wtt_burma_road.4.t:0 "[From.GetNameDefCap] полностью восстановил перевозки по Бирманской дороге"
  wtt_burma_road.4.desc:0 "Первый караван с поставками прошел по вновь открытой Бирманской дороге и достиг Юньнаня. Хотя потребуется время, чтобы восстановить регулярное движение, поставки к нам возобновились."
  wtt_burma_road.4.a:0 "Нужное нам подкрепление."
  wtt_ledo_road.1.t:0 "Дорога Ледо закрыта"
  wtt_ledo_road.1.desc:0 "Войска [occupying_country.GetAdjective], атаковавшие [state_occupied.GetName], достигли дороги Ледо и перекрыли её в нескольких местах. Дальнейшие поставки к нам по этому пути невозможны."
  wtt_ledo_road.2.desc:0 "[From.GetAdjective] Правительство решило больше не допускать движение по дороге Ледо. Все конвои на дороге остановлены и приказано вернуться. Поставки больше не могут достигать нас по этому маршруту."
  wtt_ledo_road.2.desc_war_with_from:0 "[From.GetAdjective] силы быстро продвинулись по дороге Ледо и захватили несколько важных мостов и переправ. Дорога теперь закрыта для движения, и поставки больше не могут достигать нас по этому маршруту."
  wtt_ledo_road.3.t:0 "[From.GetNameDefCap] Частично открывает дорогу Ледо"
  wtt_ledo_road.3.desc:0 "После успешного отвоевания большей части дороги Ледо, власти [From.GetAdjective] разрешили возобновить движение по трассе. Хотя остатки вражеских сил делают путешествие еще более опасным, чем раньше, поставки снова поступают."
  wtt_ledo_road.3.a:0 "Хороший первый шаг."
  wtt_ledo_road.4.t:0 "[From.GetNameDefCap] Открывает дорогу Ледо"
  wtt_ledo_road.4.desc:0 "Первый конвой с припасами через вновь открытую дорогу Ледо прибыл в Юньнань сегодня. Хотя для возобновления бесперебойного движения потребуется время, поставки снова доходят до нас."
  wtt_ledo_road.4.a:0 "Отличные новости!"
  wtt_the_hump.1.t:0 "Воздушный мост Хамп приостановлен"
  wtt_the_hump.1.desc:0 "[occupying_country.GetAdjective] силы захватили несколько аэродромов в [state_occupied.GetName], что вынуждает местные авиационные транспортные отряды, летающие по гималайскому маршруту, к эвакуации. С ростом угрозы со стороны вражеской истребительной авиации и увеличением дальности, делающим невозможным достижение цели на одном баке горючего, воздушный мост был закрыт. Поставки по этому маршруту невозможны."
  wtt_the_hump.2.desc:0 "[From.GetAdjective] правительство приказало немедленно прекратить все полеты над Гималаями. Несмотря на немедленные протесты, оно не выразило намерения пересмотреть свой подход."
  wtt_the_hump.2.desc_war_with_from:0 "[From.GetAdjective] войска захватили аэродромы, использовавшиеся для гималайского воздушного моста, сделав невозможным снабжение по воздуху. Поставки по этому пути не могут быть возобновлены."
  wtt_the_hump.3.t:0 "[From.GetNameDefCap] Возрождает гималайский воздушный мост"
  wtt_the_hump.3.desc:0 "Прилетели первые [From.GetAdjective] самолеты с важнейшими припасами через Гималаи. Действия противника по-прежнему представляют угрозу для самолетов, однако поставки возобновлены."
  wtt_the_hump.3.a:0 "Хороший первый шаг."
  wtt_the_hump.4.t:0 "[From.GetNameDefCap] Восстанавливает гималайский воздушный мост"
  wtt_the_hump.4.desc:0 "Гималайский воздушный мост снова функционирует на полную мощность с жестким графиком ежедневных полетов, доставляющих большие объемы остро необходимых припасов."
  wtt_the_hump.4.a:0 "Подарки с неба!"
  wtt_hanoi_route.1.t:0 "Ханойский маршрут закрыт"
  wtt_hanoi_route.1.desc:0 "Грузовые суда, перевозящие припасы для нашей армии, были выдворены из гавани Ханоя, так как путь к северу к китайской границе был закрыт [GetVietnamOwner].\n\nНикакие другие припасы не могут перемещаться по этому маршруту."
  wtt_hanoi_route.2.desc:0 "Местные власти [From.GetAdjective] получили приказ заблокировать любую дальнейшую разгрузку военных материалов в Ханое для транспортировки к китайской границе. На причалах размещены вооруженные охранники, чтобы помешать экипажам нарушить блокаду. Береговая охрана [From.GetAdjective] разворачивает любые корабли, которые все еще находятся в море.\n\nДальнейшие поставки по этому каналу невозможны."
  wtt_hanoi_route.2.desc_war_with_from:0 "Войска [From.GetAdjective], оккупировавшие Ханой, захватили несколько грузовых судов с припасами для нас. Корабли, которые все еще находились в море, развернулись и бежали в нейтральные гавани."
  CHI_vietnam_JAP:0 "[JAP.GetAdjective] армия"
  CHI_vietnam_FRA:0 "власти [FRA.GetAdjective]"
  wtt_china.1.t:0 "Китай требует подчинения"
  wtt_china.1.desc:0 "Похоже, [From.GetLeader] решил распространить свою власть на окраины Китая. Прибыл представитель центрального правительства и потребовал, чтобы мы выполняли приказы [From.GetLeader] или нас сменит более послушное правительство."
  wtt_china.1.a:0 "Вместе мы победим!"
  wtt_china.1.b:0 "Пусть попробует."
  wtt_china.2.t:0 "[From.GetLeader] Приветствует подчинение"
  wtt_china.2.desc:0 "[From.GetLeader] отослал гонца с личной запиской, в которой обещает подчиняться нашим приказам и сотрудничать с нашим правительством."
  wtt_china.2.a:0 "Хороший человек."
  wtt_china.3.t:0 "[From.GetLeader] Отказывает"
  wtt_china.3.desc:0 "[From.GetLeader] вернул нашу записку, утверждая, что центральное правительство не имеет юридических полномочий отстранять губернатора провинции. К ней прилагался подробный отчет о боеготовности его войск."
  wtt_china.3.a:0 "Мы еще посмотрим."
  wtt_china.10.t:0 "Китай требует подчинения"
  wtt_china.10.desc:0 "Правительство [From.GetLeader] направило гневное сообщение, отметив несколько политических решений, которые мы приняли за последние несколько месяцев и которые, по их мнению, противоречат национальным интересам [From.GetNameDef]. Если мы не приблизим нашу политику к [From.GetAdjective], они примут "необходимые меры"."
  wtt_china.10.a:0 "У нас нет выбора."
  wtt_china.10.b:0 "Мы будем сражаться!"
  wtt_china.11.t:0 "[From.GetNameDefCap] Приветствует подчинение"
  wtt_china.11.desc:0 "Правительство [From.GetAdjective] ответило на нашу записку и пообещало советоваться с нами по всем дальнейшим решениям. Наш посол в [From.GetNameDef] получил повышение до Специального представителя и получил задание следить за тем, чтобы [From.GetAdjective] не зашли слишком далеко."
  wtt_china.11.a:0 "Великолепно!"
  wtt_china.12.t:0 "[From.GetNameDefCap] Сопротивляется"
  wtt_china.12.desc:0 "Наша дипломатическая нота в [From.GetNameDef] попала в прессу и вызвала фурор. Даже международные газеты написали очень неблагоприятные редакционные статьи, назвав наши обоснованные запросы консультаций \"вмешательством во внутренние дела\", \"опасным прецедентом\" и даже \"голым империализмом\".\n\n[From.GetAdjective] правительство отказалось обсуждать этот вопрос и заявило, что дальнейшее обсуждение вопроса приведет к полному прекращению дипломатических контактов."
  wtt_china.12.a:0 "Придется принять меры."
  wtt_infiltration.1.t:0 "Зачистка от контрразведки"
  wtt_infiltration.2.t:0 "Коммунистическая ячейка обнаружена в [infiltrated_state.GetName]"
  wtt_infiltration.2.desc:0 "Расследование наших властей выявило коммунистическую базу в [infiltrated_state.GetName]. Мы должны как можно скорее нанести удар по этим бандитам всеми силами нашей армии. Любая задержка может позволить им расширить свою базу операций и сильно затруднить их выкорчевывание."
  wtt_infiltration.2.a:0 "Отправить войска."
  wtt_infiltration.3.t:0 "Коммунисты локализованы"
  wtt_infiltration.3.desc:0 "Наши агенты вернулись с пустыми руками во время наших последних рейдов на известные коммунистические укрытия. Мы знаем, что коммунисты-предатели все еще действуют в нашей стране, но, похоже, нет ни одной ячейки, о которой мы бы раньше не знали."
  wtt_infiltration.3.a:0 "Давайте уничтожим тех, кого мы нашли!"
  wtt_infiltration.4.t:0 "Коммунистическая инфильтрация побеждена?"
  wtt_infiltration.4.desc:0 "Отчёты о широкомасштабном коммунистическом вторжении оказались сильно преувеличенными. Рейды по нескольким известным тайникам и коммунистическим активистам ничего не дали. Это означает либо то, что коммунисты не смогли организовать ни одну ячейку, либо то, что мы раздавили те, которые они сумели создать. Однако мы должны оставаться бдительными, поскольку они, несомненно, попытаются усыпить нашу бдительность, а затем снова начать свою деятельность."
  wtt_infiltration.4.a:0 "Надеемся, мы их всех устранили."
  wtt_infiltration.5.t:0 "Обнаружена базовая область [infiltrated_state.GetName]"
  wtt_infiltration.5.desc:0 "Националистические патрули окружили нашу базовую область в [infiltrated_state.GetName]. Если они пожелают потратить ресурсы, то могут уничтожить её в согласованной военной операции."
  wtt_infiltration.5.a:0 "Будем надеяться, что до этого не дойдёт."
  wtt_infiltration.6.t:0 "Базовая область [infiltrated_state.GetName] атакована"
  wtt_infiltration.6.desc:1 "Вражеские войска начали атаку на нашу базовую область в [infiltrated_state.GetName]. Сообщений от наших товарищей из штата не поступало, но вражеская пресса сообщает о завершении "Кампании по окружению и уничтожению [infiltrated_state.GetName]". Мы должны быть готовы к худшему."
  wtt_infiltration.6.a:0 "Революция потерпела неудачу."
  wtt_infiltration.10.t:0 "Коммунистическое восстание"
  wtt_infiltration.10.desc:0 "Дела Коммунистической партии идут на лад. Наши разведывательные службы перехватили несколько курьеров, которые передвигались между базовыми районами и несли секретные приказы о подготовке «Революционного контрудара» на подпольных базах по всей стране. Войска и припасы собирают для крупномасштабной операции, возможно, даже для общенационального восстания. Мы должны немедленно подготовиться."
  wtt_infiltration.10.a:0 "Готовьтесь сражаться за Китай!"
  wtt_infiltration.21.t:0 "В [infiltrated_state.GetName] обнаружена коммунистическая ячейка"
  wtt_infiltration.21.desc:0 "Действуя на основании сведений, собранных разведкой, наши патрули обнаружили крупный коммунистический опорный пункт. Нам следует нанести удар немедленно, пока они не смогли лучше организоваться и противостоять нашим попыткам их устранить."
  wtt_infiltration.21.a:0 "Скорость играет важную роль."
  wtt_infiltration.23.t:0 "Коммунистическая угроза отступает?"
  wtt_infiltration.23.desc:0 "Серия рейдов по известным коммунистическим убежищам мало что дала в плане информации о масштабах коммунистического внедрения. Тщательный допрос задержанных коммунистов не выявил ничего нового.\n\nПо всей видимости, наша разведка довольно неплохо контролирует ситуацию."
  wtt_infiltration.23.a:0 "Нам следует зачистить несколько ячеек, о которых нам известно."
  wtt_infiltration.24.a:0 "Надеюсь, мы избавились от них всех."
  wtt_infiltration.24.t:0 "Коммунистическая угроза ликвидирована"
  wtt_infiltration.24.desc:0 "По всей видимости, за последние несколько месяцев коммунисты получили ряд серьезных ударов и потерь. Наши агенты перехватили участившиеся сообщения из штаб-квартиры Коммунистической партии, в которых запрашиваются сведения о положении дел у местных лидеров, которые часто были арестованы и держались в ожидании курьеров. В настоящий момент, судя по всему, коммунисты отступили, их организация на государственном уровне разрушена до полной потери эффективности.\n\nНам нельзя расслабляться, поскольку, пока существует Коммунистическая партия в какой-либо форме, она еще может предпринять попытки восстановить свою работу."
  CHI_xian_warlords_upset:0 "Это приведет в замешательство военачальников. Они могут решить выйти из состава вашей фракции, противиться вашим попыткам управлять ими и впоследствии помнить этот оскорбительный случай."
  wtt_xian_incident.1.t:0 "Приглашение от [From.GetLeader]"
  wtt_xian_incident.1.desc:0 "[From.GetLeader] отправил [CHI.GetLeader] официальное приглашение на встречу в Сиане, чтобы обсудить текущее положение дел и дальнейшие шаги в конфликте с коммунистами.\n\nОтказ от приглашения будет расценен как личное оскорбление от [From.GetLeader] и, несомненно, будет замечено другими военачальниками."
  wtt_xian_incident.1.a:0 "Поехать."
  wtt_xian_incident.1.b:0 "Не ехать."
  wtt_xian_incident.2.t:0 "[From.GetLeader] прибывает в Сиань"
  wtt_xian_incident.2.desc:0 "Путешествуя с небольшим эскортом, [From.GetLeader] приехал в Сиань, чтобы обсудить с нами ситуацию. Несомненно, он ожидает, что мы подтвердим свою готовность к борьбе с коммунистами, чтобы уничтожить их. С [JAP.GetAdjective] армией у нашего порога нам придется все ему прояснить."
  wtt_xian_incident.2.a:0 "Попросить его объединиться с коммунистами."
  wtt_xian_incident.3.t:0 "[From.GetLeader] отказывается встречаться"
  wtt_xian_incident.3.desc:0 "Сославшись на сильную простуду, [CHI.GetLeader] \"неохотно\" отклонил наше приглашение. Планирует ли он в ближайшем будущем взять на себя более прямой контроль над нашими землями или кто-то слил ему наши планы - еще предстоит выяснить."
  wtt_xian_incident.3.a:0 "Может быть, он действительно простудился?"
  wtt_xian_incident.4.t:0 "[From.GetLeader] предлагает союз с коммунистами"
  wtt_xian_incident.4.desc:0 "На встрече в Сиане [From.GetLeader] высказал неожиданное предложение: он считает, что мы должны объединиться с коммунистами, чтобы противостоять угрозе [JAP.GetAdjective] единым фронтом."
  wtt_xian_incident.4.a:0 "Возможно, он прав."
  wtt_xian_incident.4.b:0 "Мы еще помним, чем закончилась последняя попытка."
  wtt_xian_incident.5.t:0 "[CHI.GetLeader] предлагает союз"
  wtt_xian_incident.5.desc:0 "Кажется, наконец-то националистам надоело пытаться стереть нас с лица земли. На встрече в Сиане [CHI.GetLeader] согласился изучить возможность альянса с нами против [JAP.GetAdjective].\n\nМы должны тщательно взвесить наши варианты."
  wtt_xian_incident.5.a:0 "[JAP.GetAdjective] - большая угроза."
  wtt_xian_incident.5.b:0 "Никаких дел с националистами!"
  wtt_xian_incident.6.t:0 "[From.GetLeader] отказывается вступать в союз с коммунистами"
  wtt_xian_incident.6.desc:0 "Несмотря на наши аргументы и требования остановить эту ненужную войну, [From.GetLeader] отказался рассматривать идею единого фронта с коммунистами. Нужно будет предпринять более решительные меры. Арестовать его и передать коммунистам?"
  wtt_xian_incident.6.a:0 "Это наш единственный выход."
  wtt_xian_incident.6.b:0 "Это может легко выйти из-под контроля."
  wtt_xian_incident.7.t:0 "[CHI.GetLeader] арестован в [CHI_xian_instigator.GetNameDef]!"
  wtt_xian_incident.7.desc_a:1 "[CHI_xian_instigator.GetLeader] прислал сообщение о том, что он арестовал [CHI.GetLeader] и готов передать его нам. \n\nЭто может быть лучшим шансом, который у нас будет, чтобы казнить этого врага народа!"
  wtt_xian_incident.7.desc_b:0 "[From.GetLeader] отказался от нашего предложения расстрелять [CHI.GetLeader]. Вместо этого, мы должны заключить союз с националистами, так как, по-видимому, мы ещё не готовы возглавить революцию и одновременно защищаться от японцев."
  wtt_xian_incident.7.a:0 "Попросить одобрения у [SOV.GetAdjective]."
  wtt_xian_incident.7.b:0 "Отрубить ему голову!"
  wtt_xian_incident.7.c:0 "Мы должны заключить с ним союз против [JAP.GetAdjective]."
  wtt_xian_incident.7.d:0 "Его убийство сейчас приведёт к войне, которую мы не сможем выиграть. Отпустим его."
  wtt_xian_incident.8.t:0 "[From.GetLeader] арестовал [CHI.GetLeader]!"
  wtt_xian_incident.8.desc:0 "Мы перехватили сообщение от [From.GetLeader], в котором он сообщил о взятии [CHI.GetLeader] под стражу и желании передать его коммунистам. С учетом уровня ненависти к нему маловероятно, что он выживет в подобных условиях.\n\nЕсли мы хотим избежать показательного суда над [CHI.GetLeader] и его казни [PRC.GetLeader], мы должны действовать быстро и решительно!"
  wtt_xian_incident.8.a:0 "Послать войска!"
  wtt_xian_incident.8.b:0 "Они бы не причинили ему вреда. Давайте подождём."
  wtt_xian_incident.9.t:0 "[CHI.GetLeader] арестован в [CHI_xian_instigator.GetNameDef]!"
  wtt_xian_incident.9.desc:0 "[PRC.GetLeader] направил сообщение о том, что у коммунистов появился уникальный шанс отдать [CHI.GetLeader] под суд за его преступления против народа и революции. Его казнь стала бы важнейшей победой для коммунистической партии в их борьбе за лидерство в Китае. \nОднако это также ослабило бы националистов в критический момент и, возможно, позволило бы [JAP.GetAdjective] добиться дальнейшего прогресса в Китае."
  wtt_xian_incident.9.a:0 "Еще один враг буржуазии встречает свой конец."
  wtt_xian_incident.9.b:0 "Он все еще нужен."
  wtt_xian_incident.10.t:0 "[PRC.GetLeader] предлагает альянс"
  wtt_xian_incident.10.desc:0 "Вместо ожидаемого показательного процесса и последующей казни коммунисты дали понять, что предпочли бы формальный союз против [JAP.GetAdjective]. \nОни выигрывают время, зная, что еще один сильный удар может привести к их уничтожению. Если бы они хотели смерти [CHI.GetLeader], он уже был бы казнен. \nОднако некоторые люди в нашем правительстве задаются вопросом, зачем коммунисты сейчас продвигают альянс - возможно, они знают что-то, чего не знаем мы?"
  wtt_xian_incident.10.a:0 "Главное, чтобы они выполняли наши приказы."
  wtt_xian_incident.10.b:0 "Никаких сделок с коммунистами!"
  wtt_china_shared.1.t:0 "[From.GetNameDefCap] предлагает поддержку"
  wtt_china_shared.1.desc:0 "[From.GetLeader] прибыл в нашу столицу, чтобы обсудить наше положение. На встрече с активистами за независимость и правительством он заявил, что наша независимость — жизненно важный национальный интерес [From.GetNameDef], и они готовы поддержать любые попытки движения к большей независимости."
  wtt_china_shared.1.a:0 "Их помощь весьма кстати."
  wtt_china_shared.1.b:0 "Мы в целом довольны нашим текущим положением."
  wtt_china_shared.2.t:0 "[From.GetNameDefCap] принимает нашу поддержку"
  wtt_china_shared.2.desc:0 "В приватной беседе представители правительства [From.GetNameDef] проявили большой интерес к тому, какую поддержку мы можем оказать независимому государству. Были выделены средства группам, выступающим за большую независимость, и мы начали организовывать «Временное свободное правительство [From.GetAdjective] в изгнании»."
  wtt_china_shared.2.a:0 "Их борьба — наша борьба."
  wtt_china_shared.3.t:0 "[From.GetNameDefCap] отвергает нашу поддержку"
  wtt_china_shared.3.desc:0 "В строгой ноте [From.GetLeader] уведомил нас о том, что его правительство не потерпит никакого вмешательства во внутренние дела [From.GetAdjective]. Дипломатический протокол запрещает объявлять [From.From.GetLeader] персоной нон грата и запрещать ему въезд, но практически вся наша делегация не может вернуться в [From.GetNameDef]."
  wtt_china_shared.3.a:0 "Позор."
  wtt_china_shared.4.t:0 "Движение за независимость в [From.GetNameDef] набирает силу"
  wtt_china_shared.4.desc:0 "По-видимому, недавний визит [From.From.GetLeader] в [From.GetNameDef] не ограничился лишь формальным обменом любезностями за чашкой чая. В последнее время отколовшиеся ранее друг от друга движения за независимость страны действуют куда более согласованно. Почти как будто кто-то помогает им организоваться из-за рубежа."
  wtt_china_shared.4.a:0 "Беспокойство."
  wtt_china_shared.10.t:0 "Летящие тигры"
  wtt_china_shared.10.desc_a:0 "Сун Мэйлин, супруга Чан Кайши и один из его самых доверенных советников, отправилась в Вашингтон, чтобы лоббировать увеличение поддержки [CHI.GetNameDef] в её борьбе против [JAP.GetNameDef]. [CHI.GetAdjective] ВВС остро нуждается в современных самолетах и умелых пилотах для полетов на них.\n\nПризыв Суна отозвался в широких народных массах, и немалое число наших пилотов уволились со службы, чтобы подписать контракт с [CHI.GetAdjective] компанией, которая должна предоставлять "обучение и наставления" [CHI.GetAdjective] пилотам.\n\nКогда с проблемой пилотов было покончено, Сун Мэйлин обратилась к нам с просьбой о передаче приблизительно 150 наших новейших истребителей для переоснащения [CHI.GetAdjective] ВВС."
  wtt_china_shared.10.desc_b:0 "Война в Китае нанесла серьезный урон китайским ВВС. Уступая противнику в численности и вооружении, они храбро сражались, защищая небо Китая.\n\nНесмотря на храбрость пилотов, [From.GetAdjective] ВВС отчаянно нуждаются в новых самолетах и летчиках, чтобы восполнить потери. Делегация, отправленная [From.GetLeader], прибыла в Вашингтон, чтобы договориться о передаче около 150 современных истребителей и разрешении на отправку в Китай аналогичного числа пилотов для управления этими самолетами."
  wtt_china_shared.10.a:0 "Мы должны поддержать их любым возможным способом."
  wtt_china_shared.10.b:0 "Мы не должны позволить себе быть втянутыми в этот конфликт."
  wtt_china_shared.11.t:0 "Добровольческая группа [SOV.GetAdjective]"
  wtt_china_shared.11.desc_a:0 "Продолжающиеся бои в Китае привели к необходимости оказания воздушной поддержки нашим товарищам из [From.GetAdjective] Красной Армии. [From.GetLeader] обратился к нам с просьбой о направлении добровольческой группы летчиков и самолетов. Он запросил около 50 бомбардировщиков и 100 истребителей для их сопровождения.\n\nЭто может стать полезным опытом для наших пилотов и возможностью испытать наши новейшие разработки в действии."
  wtt_china_shared.11.desc_b:0 "Во время продолжающейся войны в Китае [From.GetAdjective] ВВС изо всех сил старается защитить воздушное пространство над [From.GetNameDef] и обеспечить поддержку с воздуха для сражающихся войск. [From.GetLeader] обратился с личной просьбой к [SOV.GetLeader] отправить объединенный контингент из около 50 средних бомбардировщиков и 100 истребителей.\n\nЭто может оказаться ценной возможностью проверить нашу новейшую технику в боевых условиях."
  wtt_china_shared.11.a:0 "Мы должны поддерживать их всеми возможными способами."
  wtt_china_shared.11.b:0 "Им придется обойтись тем, что у них есть."
  wtt_china_shared.12.t:0 "Новый генерал для [From.GetNameDef]"
  wtt_china_shared.12.desc:0 "[From.GetLeader] отправил письмо [USA.GetLeader] с предложением направить одного из наших генералов в качестве начальника штаба в [From.GetAdjective] армии.\n\nЭто вызовет у [From.GetLeader] личную признательность и может дать ценный опыт для нашего генерала, а также помочь войскам [From.GetLeader] выиграть войну.\n\nКого из наших генералов нам направить?"
  wtt_china_shared.12.a:0 "Отправьте Джозефа Стилуэлла."
  wtt_china_shared.12.b:0 "Им придется защищаться самостоятельно."
  wtt_china_shared.12.c:0 "Отправьте Дугласа Макартура."
  wtt_china_shared.12.d:0 "Отправьте Дуайта Эйзенхауэра."
  wtt_china_shared.13.t:0 "[CHI_USA_General.GetName] прибывает в Китай"
  wtt_china_shared.13.desc:0 "[From.GetLeader] принял нашу просьбу о помощи и приказал [CHI_USA_General.GetName] как можно скорее прибыть в Китай и приступить к выполнению своих обязанностей.\n\nГенерал должен не просто стать советником [Root.GetLeader], но и командовать войсками на поле боя, получив непосредственный опыт ведения боевых действий в современной войне."
  wtt_china_shared.13.a:0 "Ценное приобретение."
  wtt_china_shared.14.t:0 "Отказ в помощи от [From.GetNameDef]"
  wtt_china_shared.14.desc:0 "Наша просьба к [From.GetLeader] осталась без внимания. Хотя несколько высокопоставленных офицеров армии США выразили готовность взяться за эту задачу, министр обороны и президент [From.GetLeader] наложили вето на эту идею, назвав ее непрактичной и не отвечающей национальным интересам."
  wtt_china_shared.14.a:0 "Они трусы, глупцы или и то, и другое?"
  wtt_prc.1.t:0 "[From.GetLeader] предлагает союз"
  wtt_prc.1.desc:0 "После многих лет неэффективных военных действий и в свете надвигающейся угрозы со стороны Японии коммунисты предложили нам создать совместное правительство. Наши армии будут сражаться бок о бок, а политику будем координировать.\n\nМотивы такого внезапного изменения в настроениях коммунистов не вполне понятны, и некоторые представители правительства считают, что это всего лишь первый этап плана по захвату страны."
  wtt_prc.1.a:0 "Мы должны объединиться против наших врагов."
  wtt_prc.1.b:0 "На эту дешевую уловку мы не купимся."
  wtt_prc.2.t:0 "[От.ПолучитьЛидера] Отказывается от Союзничества."
  wtt_prc.2.desc:0 "После долгих размышлений, [От.ПолучитьЛидера] решил отвергнуть нашу делегацию. Наши источники внутри правительства сообщают, что он видит коммунистические заговоры повсюду и верит, что мы пытаемся захватить правительство и украсть у него страну."
  wtt_prc.2.a:0 "Какой параноик."
  wtt_prc.10.t:0 "[От.ИмяПолучитьДефис] Требует Нашего Сотрудничества"
  wtt_prc.10.desc:0 "После создания Правительства Национальной Обороны, [От.ПолучитьЛидера] ясно дал понять, что он не терпит какой-либо "чрезмерной независимости и неповиновения". С войной против [JAP.ИмяПолучитьДефис] все более вероятной, любой, кто не стоит на стороне Правительства Национальной Обороны, будет рассматриваться как потенциальный враг, и [От.ПолучитьЛидера] открыто заявил, что он не будет ждать, пока не начнется война, чтобы предпринять шаги против военачальников, которые отказываются преклонять колено."
  wtt_prc.10.a:0 "Мы рискуем с Правительством."
  wtt_prc.10.b:0 "Этот болтливый идиот блефует."
  wtt_prc.11.t:0 "[От.ИмяПолучитьДефис] Присоединяется к Правительству Национальной Обороны"
  wtt_prc.11.desc:0 "[От.ПолучитьЛидера] понял причину и решил присоединиться к нашему Союзу. Его силы теперь будут поддерживать нас в предстоящих битвах."
  wtt_prc.12.t:0 "[От.ИмяПолучитьДефис] Отказывается"
  wtt_prc.12.desc:0 "[From.GetLeader] по непонятным причинам отказывается сотрудничать с нами даже в самых элементарных вопросах. Он утверждает, что мы всего лишь банда разбойников, которую он вскоре искоренит, и призвал других военачальников присоединиться к нему в борьбе с нами."
  wtt_prc.12.a:0 "Мы заставим его повиноваться."
  PRC_provoke_japan_korea:0 "Корея"
  PRC_provoke_japan_manchuria:0 "Маньчжурия"
  wtt_prc.20.t:0 "Провокация со стороны Китая"
  wtt_prc.20.desc:0 "Появились новые подробности о последнем нападении на нашу территорию. Хотя пока ни одного из злоумышленников не поймали, улики указывают на то, что это была преднамеренная провокация со стороны Китая.\n\nКитайское правительство подозрительно медленно осудило нападение, а китайские газеты приветствовали его как героический акт неповиновения \"[JAP.GetAdjective] империализму\".\n\nКабинет собрался, чтобы обсудить ситуацию и предложить меры по противодействию этому вопиющему нападению."
  wtt_prc.20.a:0 "Потребовать извинений."
  wtt_prc.20.b:0 "Мобилизовать войска и подготовиться к войне."
  wtt_prc.21.t:0 "Оружейный завод был взорван диверсантами"
  wtt_prc.21.desc:0 "С одного из наших заводов в [JAP.GetManchuriaPuppet] поступили сообщения о том, что сегодня ночью вспыхнул сильный пожар. Местные пожарные всё ещё борются с огнём, но уверены, что возьмут ситуацию под контроль к концу дня. Повреждения, нанесённые заводу, кажутся значительными, так как пожар, судя по всему, начался на складе легковоспламеняющихся химикатов.\n\nВоенная разведка начала тщательное расследование причин возникновения пожара, несмотря на самые строгие меры безопасности. Первые выводы указывают на вероятный поджог."
  wtt_prc.21.a:0 "Кто мог совершить такое?"
  wtt_prc.22.t:0 "Диверсия на гражданском заводе"
  wtt_prc.23.t:0 "Взорван мост"
  wtt_prc.23.desc:0 "Где-то прошлой ночью центральный железнодорожный мост в [JAP.GetManchuriaPuppet] обрушился под весом проезжавшего по нему состава боеприпасов. Спасательные и аварийно-восстановительные работы затруднены вторичными взрывами боеприпасов. Экипаж поезда всё ещё числится пропавшим без вести и, предположительно, погиб.\n\nВоенная разведка направила группу для расследования места происшествия, как только оно будет безопасным для посещения, чтобы выяснить, как такой надёжный мост мог обрушиться без каких-либо предупреждающих знаков.\n\nМестные очевидцы сообщили, что в день до обрушения видели небольшую группу в долине под мостом. Их местонахождение в настоящее время неизвестно."
  wtt_prc.24.t:0 "Засада на патруль"
  wtt_prc.24.desc:0 "Один из наших патрулей в [JAP.GetManchuriaPuppet] не вышел на связь. Поисковая группа, работавшая по маршруту патруля, обнаружила поле боя, на котором были признаки того, что патруль был застигнут врасплох и уничтожен в жестоком рукопашном бою.\n\nОстались ли какие-то потери у нападавших, неизвестно, но единственные найденные тела принадлежат солдатам армии [JAP.GetAdjective].\n\nПо-видимому, их нарочно оставили, возможно, чтобы передать сообщение."
  wtt_japan.1.t:0 "[From.GetNameDefCap] хочет протектората над нашими колониями"
  wtt_japan.1.desc:1 "Воспользовавшись возможностью, предоставленной нашей слабостью, [From.GetAdjective] предложили "помочь" нам в "поддержании порядка" в наших колониях. Они утверждают, что после падения нашей континентальной части у нас нет возможности сохранить за собой свои позиции.\n\nЭто уловка, чтобы вырвать у нас контроль над нашими колониями, но какой у нас есть выбор?"
  wtt_japan.1.a:0 "Пора признать господство [JAP.GetAdjective] на Востоке."
  wtt_japan.1.b:0 "Им придется взять их силой!"
  wtt_japan.2.t:0 "[From.GetNameDefCap] предоставляет протекторат над колониями"
  wtt_japan.2.desc:0 "[From.GetNameDefCap] внимательно рассмотрел наше предложение "поддерживать порядок" в наших колониях и решил его принять. Они фактически передали нам полный контроль."
  wtt_japan.2.a:0 "Мудрое решение."
  wtt_japan.3.t:0 "[From.GetNameDefCap] отказался от протектората над колониями"
  wtt_japan.3.desc:0 "[From.GetNameDefCap] тщательно рассмотрел наше предложение о \"поддержании порядка\" в его колониях и решил отклонить его."
  wtt_japan.3.a:0 "Посмотрим, как это отразится на них."
  wtt_japan.11.t:0 "Пакт о ненападении с [From.GetNameDef]"
  wtt_japan.11.desc:0 "Несмотря на то, что напряженность между [From.GetAdjective] и [Root.GetNameDef] в последнее время росла, [From.GetAdjective] открыли переговоры о Пакте о ненападении. Для нас преимущества ясны, но нас должно волновать, что пакт даст [From.GetAdjective] и будем ли мы жалеть об этом шаге."
  wtt_japan.11.a:0 "Нам нужен мир. Сейчас."
  wtt_japan.11.b:0 "Отказ им в любых преимуществах превыше всего!"
  wtt_japan.12.t:0 "[From.GetNameDefCap] принимает Пакт о ненападении"
  wtt_japan.12.desc:0 "[From.GetNameDefCap] официально принял наше предложение о пакте о ненападении."
  wtt_japan.12.a:0 "Они играют нам на руку."
  wtt_japan.13.t:0 "[From.GetNameDefCap] отклоняет Пакт о ненападении"
  wtt_japan.13.desc:0 "По какой-то причине [From.GetNameDef] отклонил наше предложение о пакте о ненападении."
  wtt_japan.13.a:0 "Может быть, они строят против нас заговор?"
  wtt_japan.21.t:0 "Обмен генералами [From.GetAdjective]"
  wtt_japan.21.desc:0 "[From.GetAdjective] решили отозвать своих левых государственных служащих и генералов и вместо них прислали нам своих правых генералов и государственных служащих в неофициальной ссылке."
  wtt_japan.21.a:0 "Кажется, что-то происходит в [From.GetNameDef]."
  wtt_japan.22.t:0 "Обмен [Root.GetAdjective] генералами"
  wtt_japan.22.desc:0 "Процесс обмена наших правых генералов и государственных служащих на левых, которых мы ранее отправили в неофициальную ссылку в [From.GetNameDef], завершён."
  wtt_japan.22.a:0 "Это укрепит наш контроль над [Root.GetNameDef]."
  japan.22.t:0 "Военно-морской флот у руля"
  japan.22.desc:0 "После нескольких месяцев напряжённости между флотом и Хирохито, в значительной степени из-за попыток Хирохито навязать свою волю флоту и опасений, что действия Хирохито подвергают опасности военные усилия, Императорский флот Японии взял под свой контроль правительство. Что будет дальше — неизвестно..."
  japan.22.a:0 "Да здравствует Ямамото!"
  japan.23.t:0 "Оборона Иводзимы"
  japan.23.desc:0 "Мы здесь, чтобы защищать этот остров всеми силами. Мы должны полностью посвятить себя этой задаче. Каждый ваш выстрел должен убить многих американцев. Мы не можем позволить себе попасть в плен к врагу. Если наши позиции будут захвачены, мы возьмём бомбы и гранаты и бросимся под танки, чтобы уничтожить их. Мы проникнем в ряды врага, чтобы истребить его. Никто не должен умирать, пока не убьёт по меньшей мере десять американцев. Мы будем преследовать врага с помощью партизанских действий, пока не погибнет последний из нас."
  japan.23.a:0 "Да здравствует Император!"
  japan.24.t:0 "Враг — на материке"
  japan.24.desc:0 "Враг решился беспокоить нашего Императора, клянусь, заставлю их заплатить за то, что сделали эти негодяи, пустив в бой всех моих солдат, и заставив их пожалеть о том, что они посмели выступить против нас."
  japan.24.a:0 "Да здравствует Император!"
  japan.25.t:0 "Корпорация Арасака пытается свергнуть Императора"
  japan.25.desc:0 "Империя больше не достаточно сильна, и такой стиль правления ослабляет нашу страну, японский народ не так процветает, как мог бы, и пришло время покончить с японской империей и обеспечить благосостояние японского народа. Безусловно, благополучие людей не является таким же высоким приоритетом, как благополучие нашей компании. Отныне не будет никаких лишних расходов, никаких расходов на войны, и все ресурсы будут использоваться для будущего нашей компании!"
  japan.25.a:0 "За благосостояние народа!"
  japan.25.b:0 "Тэнно Хэйка Банзай!"
  japan.26.t:0 "Что мы будем делать с Императором?"
  japan.26.desc:0 "Что мы собираемся делать с Императором? Мы можем использовать его как марионетку и использовать его оставшуюся репутацию против людей, чтобы обмануть их, или мы можем изгнать его и убедиться, что он никогда больше не вернётся в эту страну."
  japan.26.a:0 "Мы могли бы использовать его как марионетку"
  japan.26.b:0 "Изгнать его!"
  wtt_japan.31.t:0 "Судьба императорской семьи"
  wtt_japan.31.desc:0 "Пришло время заняться судьбой Императора и его семьи. Наследственный социальный статус не имеет места в Японии, которую мы строим. Что с ними будет?"
  wtt_japan.31.a:0 "Изгнать их!"
  wtt_japan.31.b:0 "Отрубить им головы!"
  wtt_japan.32.t:0 "Изгнанная императорская семья"
  wtt_japan.32.desc:0 "[From.GetNameDefCap] изгнал императорскую семью, оказав нам этим большую услугу! Теперь он прибыл в [Root.GetNameDef], и, несмотря на свое изгнание, его влияние на народ и войска все еще велико."
  wtt_japan.32.a:0 "Мы должны быть достойны стать его домом!"
  wtt_japan.101.t:0 "Воссоединение Маньчжурии"
  wtt_japan.101.desc:0 "После своей недавней победы над [MAN.GetNameDef] правительство [JAP.GetAdjective] признало связи Китая с этим регионом и немедленно передало нам весь контроль. Этим жестом доброй воли они предлагают нам альянс."
  wtt_japan.101.a:0 "Возможно, с [JAP.GetAdjective] действительно можно справиться."
  wtt_japan.101.b:0 "Мы примем Маньчжурию, но не их доброту."
  wtt_japan.102.desc:0 "[From.GetNameDefCap] благодарит нас за возвращение Маньчжурии и принял наше предложение о союзе."
  wtt_japan.103.desc:0 "[From.GetNameDefCap] благодарит нас за возвращение Маньчжурии, но отклонил наше предложение о союзе."
  wtt_japan.104.t:0 "Филиппинский суверенитет"
  wtt_japan.104.desc:0 "[From.GetNameDefCap] открыто заявил, что «они больше не могут сидеть и смотреть», как страна в их сфере интересов продолжает находиться под пятой Запада. Теперь они требуют ускорить наш процесс деколонизации и немедленно предоставить [PHI.GetNameDef] полный суверенитет."
  wtt_japan.104.a:0 "Они правы. Они заслуживают свободы."
  wtt_japan.104.b:0 "[PHI.GetNameDefCap] останется [USA.GetAdjective]!."
  wtt_japan.105.desc:0 "[From.GetNameDefCap] ответил на наши требования о полной [PHI.GetAdjective] независимости, и [USA.GetAdjective] правительство теперь незамедлительно предприняло шаги для предоставления их тихоокеанскому подданному полного суверенитета."
  wtt_japan.105.a:0 "По крайней мере они разумны."
  wtt_japan.106.desc:0 "[From.GetNameDefCap] ответил на наши требования о полной [PHI.GetAdjective] независимости, повторив «жизненно важные [USA.GetAdjective] интересы», которые [PHI.GetNameDef] представляет в регионе."
  wtt_japan.106.a:0 "И они называют себя «защитниками свободы»?"
  wtt_japan.107.desc:0 "[From.GetNameDefCap] ответил на [JAP.GetAdjective] требования о нашей полной независимости, и [USA.GetAdjective] правительство незамедлительно предприняло шаги для предоставления нам полного суверенитета!"
  wtt_japan.107.a:0 "Слава [JAP.GetAdjective]!"
  wtt_japan.108.t:0 "Переворот молодых офицеров"
  wtt_japan.108.desc:0 "Группе молодых офицеров удалось убить ряд государственных служащих, в том числе премьер-министра. Они оккупировали город Токио и установили контроль над императорским дворцом, объявив о своем намерении очистить правительство от «коррумпированных чиновников» и «идеологических угроз» и восстановить императора в качестве единственного правителя нации.\n\nИх действия неожиданно нашли широкую поддержку в армии, где запланированные контрмеры были сорваны массовыми арестами и убийствами элементов, лояльных старому правительству. Столкнувшись с внезапным и подавляющим характером событий и контролем повстанцев над дворцом, император не предпринял никаких шагов для осуждения мятежников.\n\nОрганизованное сопротивление правительства, похоже, готово рухнуть, и ожидается, что мятежники в любой момент объявят об установлении полного имперского контроля во всех областях внутренней, внешней и военной политики."
  wtt_japan.108.a:0 "Теннохейка банзай!"
  wtt_japan.109.t:0 "[JAP.GetNameDefCap] предлагает заключить Тройственный пакт"
  wtt_japan.109.desc:0 "[From.GetNameDefCap] направил пробные шары, чтобы выяснить, заинтересованы ли мы в тройственном пакте между нами, [JAP_initiator.GetAdjective] и [ITA_fascism.GetAdjective]. [JAP_initiator.GetAdjective] утверждают, что мы должны поддерживать друг друга из-за все более враждебного мирового мнения, направленного против наших усилий."
  wtt_japan.109.a:0 "Отличная идея. Мы подпишем пакт."
  wtt_japan.109.b:0 "Нет, мы не должны рисковать и обострять отношения с миром."
  wtt_japan.110.desc:0 "[JAP_initiator.GetNameDefCap] выдвинуло предложение, чтобы выяснить нашу заинтересованность в трехстороннем пакте между нами, [JAP_initiator.GetAdjective] и [GER_fascism.GetAdjective]. [JAP_initiator.GetAdjective] утверждают, что мы должны поддерживать друг друга из-за все более враждебного мирового общественного мнения, направленного против наших усилий."
  wtt_japan.111.t:0 "Тройственный пакт подписан"
  wtt_japan.111.desc:0 "Правительства [GER_fascism.GetAdjective] и [ITA_fascism.GetAdjective] согласились подписать предложенный Тройственный пакт, пообещав встать на нашу сторону в случае войны."
  wtt_japan.112.t:0 "[From.GetNameDefCap] отклоняет Тройственный пакт"
  wtt_japan.112.desc:0 "Правительство [From.GetAdjective] отклонило предложенный Тройственный пакт, предпочтя продолжить путь в одиночку."
  wtt_japan.113.t:0 "[From.GetNameDefCap] подписывает Тройственный пакт"
  wtt_japan.113.desc:0 "Правительство [ITA_fascism.GetAdjective] согласилось подписать предложенный Тройственный пакт, пообещав встать на нашу сторону в случае войны."
  wtt_japan.114.t:0 "Демократические элементы устраивают переворот"
  wtt_japan.114.desc:0 "Демократические силы в правительстве спровоцировали неожиданный переворот после того, как военные пригрозили вновь ущемить завоеванные народом демократические права. Большая часть армии неожиданно встала на защиту народа и его прав на свободу.\n\nЭтот раскол в армии позволил народным представителям захватить власть в законодательной и исполнительной ветвях власти. Несмотря на то, что боевые действия только начались, маловероятно, что им удастся легко сместить нынешнее правительство."
  wtt_japan.114.a:0 "Больше никогда военные не будут нами править!"
  wtt_japan.115.t:0 "[From.GetNameDefCap] Нападает на [SOV.GetNameDef]"
  wtt_japan.115.desc:0 "[From.GetNameDefCap] в одностороннем порядке напала на [SOV.GetNameDef] несмотря на наш пакт о ненападении. У нас нет иного выбора, кроме как или соблюдать наш союзнический долг и поддержать атаку [From.GetAdjective], или соблюдать наш пакт о ненападении с [SOV.GetAdjective] и осудить атаку."
  wtt_japan.115.a:0 "Мы присоединимся к нашим союзникам!"
  wtt_japan.115.b:0 "Наше соглашение пока невозможно разорвать."
  wtt_japan.116.t:0 "[From.GetNameDefCap] Вступает в войну"
  wtt_japan.116.desc:0 "[From.GetNameDefCap] решила присоединиться к нашей войне против [SOV.GetAdjective] несмотря на их прежний пакт о ненападении."
  wtt_japan.116.a:0 "Как и должно быть."
  wtt_japan.117.t:0 "[From.GetNameDef] Осуждает нашу войну"
  wtt_japan.117.desc:0 "Несмотря на их обязательства перед нами как нашими союзниками, [From.GetNameDefCap] решил соблюдать их пакт о ненападении с [SOV.GetAdjective]ами. Они осудили нашу агрессию, по всей видимости пытаясь спасти дипломатическую ситуацию со своим членом пакта."
  wtt_japan.117.a:0 "Как жаль."
  wtt_japan.118.t:0 "[From.GetNameDef] просит помощи"
  wtt_japan.118.desc:0 "[From.GetNameDefCap] в настоящее время втянут в разрушительную гражданскую войну и имеет проблемы с соответствием военной мощи своего врага. Их переходное правительство теперь обратилось к нашим представителям с предложением обменять полуостров Южный Сахалин на военную помощь, в которой они так остро нуждаются.\n\nЭто могло бы обеспечить быстрый способ получить немного земли в обмен на добровольческие дивизии."
  wtt_japan.118.a:0 "Превосходная идея!"
  wtt_japan_118_TT:0 "Эти добровольцы будут возвращены в резерв рабочей силы, если §Y[From.GetName]§! победит в гражданской войне."
  wtt_japan.118.b:0 "Это невыгодная для нас сделка."
  wtt_japan.119.t:0 "[From.GetNameDefCap] принимает предложение"
  wtt_japan.119.desc:0 "[From.GetNameDefCap] принял наше предложение обменять полуостров Южный Сахалин на военную поддержку. Они отправили несколько дивизий «добровольцев», чтобы помочь нам в нашей борьбе!"
  wtt_japan.119.a:0 "Они будут очень полезны!"
  wtt_japan.119.TT:0 "Получите 8 подразделений с §Y12 пехотными§! и §Y3 вспомогательными§! батальонами."
  wtt_japan.120.t:0 "[From.GetNameDefCap] отклоняет предложение"
  wtt_japan.120.desc:0 "[From.GetNameDefCap] сообщил(а) нам, что они отклонили наше предложение обменять Южный Сахалин на военную поддержку."
  wtt_japan.120.a:0 "Мы остались одни."
  wtt_japan.121.t:0 "[From.GetNameDefCap] захватывает Токио"
  wtt_japan.121.desc:0 "[From.GetNameDefCap] захватил(а) [JAP.GetAdjective] столицу, и фашистское [From.From.GetAdjective] правительство пало. Если мы хотим действовать, то должны сделать это немедленно. Крайне важно действовать быстро и обеспечить контроль над периферийными японскими островами и принять командование над оставшимися фашистскими элементами, чтобы сдержать коммунистическую угрозу."
  wtt_japan.121.a:0 "Осуществить этот план."
  wtt_japan.121.b:0 "Это нас сейчас не интересует."
  wtt_japan.122.t:0 "Фашисты бегут в Маньчжурию"
  wtt_japan.122.desc:0 "С захватом Токио фашистское правительство пало, а его оставшиеся сторонники и военные части бежали в [MAN.GetNameDef], которая взяла под свой контроль отдаленные острова, а также корейские и китайские владения.\n\nГражданская война фактически окончена, но перемирие, в лучшем случае, непрочное, так как фашисты не потерпели решающего поражения."
  wtt_japan.122.a:0 "Мы разберемся с ними позже."
  wtt_japan.123.t:0 "Сопротивление фашистов рушится"
  wtt_japan.123.desc:0 "С захватом Токио фашистское правительство окончательно рухнуло. У оставшихся сторонников и воинских частей нет ничего, вокруг чего можно было бы сплотиться, и они начинают расходиться, что позволяет легко захватить оставшиеся и отдаленные территории."
  wtt_japan.123.a:0 "Война выиграна."
  wtt_japan.124.t:0 "Волонтеры возвращаются домой"
  wtt_japan.124.desc:0 "С победой коммунистов в Японии наши выжившие волонтеры вернулись домой."
  wtt_japan.125.t:0 "[SOV.GetAdjective] возвращают Маньчжурию"
  wtt_japan.125.desc:0 "Освободив Маньчжурию от [JAP.GetAdjective] и избавив ее от свергнутого императора Цин, [From.GetNameDef] теперь предложили нам вернуть Маньчжурию, заявив, что она должна вернуться в законные руки [Root.GetAdjective]."
  wtt_japan.126.t:0 "Предложение мира от [From.GetNameDefCap]"
  wtt_japan.126.desc:1 "Представители [From.GetAdjective] обратились к нам с мирным предложением. Они полностью покинут континент в обмен на немедленное прекращение военных действий."
  wtt_japan.126.a:0 "Война выиграна."
  wtt_japan.126.b:0 "Нас устроит только безоговорочная победа!"
  wtt_japan.127.t:0 "[From.GetNameDefCap] принял мирное предложение"
  wtt_japan.127.desc:0 "[From.GetNameDefCap] принял наше мирное предложение и прекратил военные действия в обмен на наши континентальные владения."
  wtt_japan.127.a:0 "Они победили нас. На данный момент."
  wtt_japan.128.t:0 "[From.GetNameDefCap] отверг мирное предложение"
  wtt_japan.128.desc:0 "[From.GetNameDefCap] отклонил наше предложение о мире, поклявшись продолжать войну до тех пор, пока не будет получена безоговорочная капитуляция."
  wtt_japan.128.a:0 "Тогда мы будем сражаться до конца!"
  wtt_japan.40.t:0 "[From.GetLeader] требует Маньчжурию"
  wtt_japan.40.desc:0 "Несколько дней назад правительство [From.GetNameDef] начало согласованные усилия, чтобы оказать на нас давление. Передовицы в газетах требовали, чтобы мы вернули Маньчжурию под контроль [From.GetAdjective]. Это не просто пропагандистский ход для внутреннего потребления, поскольку представители [From.GetLeader] прозондировали нас по дипломатическим каналам, чтобы достичь соглашения о будущем территорий Маньчжурии.\n\nСегодня сам [From.GetLeader] вмешался в этот вопрос, потребовав как можно скорее полного возвращения Маньчжурии [From.GetNameDef]. В противном случае его правительству придется пересмотреть наше текущее сотрудничество."
  wtt_japan.40.a:0 "Она принадлежит им."
  wtt_japan.40.b:0 "Они еще не готовы править собой."
  wtt_japan.41.t:0 "Военная помощь от [From.GetNameDef]"
  wtt_japan.41.desc:0 "Имперский генеральный штаб Японии решил принять фундаментальные изменения в стратегических взглядах. На конференции с Императором министр армии представил новый план, в котором предполагалось, что вскоре разразится война с [SOV.GetNameDef]. Чтобы подготовиться к этой войне, Имперская армия Японии приняла решение, что наши вооруженные силы должны защищать участки фронта. Для этого было подготовлено большое количество устаревшего оборудования."
  wtt_japan.41.a:0 "Как мило с их стороны."
  wtt_news.25.t:0 "[JAP.GetNameDefCap] принимает контроль над колониями [From.GetAdjective]"
  wtt_news.25.desc:0 "В свете текущей слабости [From.GetNameDef], возможно, неудивительно, что [JAP.GetAdjective] усилили давление на восточноазиатские владения [From.GetAdjective]. Однако сегодня чиновники из правительства [From.GetAdjective] сделали неожиданное заявление, что контроль над колониями [From.GetAdjective] будет передан [JAP.GetNameDef], вступающее в силу немедленно."
  wtt_news.25.a:0 "Азия для азиатов!"
  wtt_news.25.b:0 "Печальный день для Европы."
  wtt_news.25.c:0 "Это конец колониализма?"
  wtt_news.26.t:0 "Независимость [PHI.GetAdjective]"
  wtt_news.26.desc:0 "В результате давления со стороны [JAP.GetAdjective] правительство [From.GetAdjective] объявило о немедленном прекращении колониального правления [From.GetAdjective] над архипелагом. С сегодняшнего дня полный суверенитет предоставлен [PHI.GetNameDef]."
  wtt_news.26.b:0 "Мы и так собирались деколонизироваться."
  wtt_news.26.c:0 "Радостный день!"
  wtt_news.27.t:0 "Государственный переворот, осуществлённый молодыми офицерами [JAP.GetAdjective]"
  wtt_news.27.desc:0 "Группе молодых офицеров удалось свергнуть правительство и восстановить императора в качестве верховного правителя [JAP.GetAdjective] государства. По-видимому, это было сделано в ответ на воспринимавшиеся ими угрозы всеобщей коррупции в правительстве и приверженности враждебным идеологиям.\n\nОфицеры, даже ещё более последовательно использующие в отношении государства имперскую терминологию, заявили, что чистки будут продолжаться, пока из правительства и армии «не будут удалены все неблагонадёжные элементы». Сам император Хирохито опубликовал краткое заявление, приняв руководство, предложенное ему мятежниками, и сделал явные предложения о примирении с Китаем и западными колониальными державами в Тихом океане."
  wtt_news.27.a:0 "Банзай!"
  wtt_news.27.b:0 "Тревожные новости. В отношении нас таких предложений не поступало."
  wtt_news.27.c:0 "Гарантирует ли это мир на Тихом океане?"
  wtt_news.27.d:0 "Неожиданный поворот событий."
  wtt_news.30.t:0 "Чан Кайши казнён"
  wtt_news.30.desc:0 "По сообщениям, Чан Кайши был убит коммунистическим расстрельным отрядом сегодня утром после ареста [CHI_xian_instigator.GetLeader]. После скорого суда за преступления против народа и партии [PRC.GetLeader] вынес Чан Кайши смертный приговор. Даже прямого вмешательства представителя Советского Правительства не хватило, чтобы спасти его жизнь.\n\nСообщается, что [SOV.GetLeader] в ярости от "предательства" [PRC.GetLeader] и отдал приказ об аресте китайской делегации Коминтерна.\n\nНовый лидер националистов [CHI.GetLeader] поклялся отомстить за смерть Чан Кайши и "уничтожить" коммунистов."
  wtt_news.30.a:0 "Он получил по заслугам."
  wtt_news.30.b:0 "Они совершили убийство и назвали это справедливостью!"
  wtt_news.30.c:0 "Это будет иметь последствия."
  wtt_news.30.d:0 "Китай дестабилизируется еще сильнее."
  wtt_news.31.t:0 "Чан Кайши казнен"
  wtt_news.31.desc:0 "По сообщению [CHI_xian_instigator.GetLeader], после ареста Чан Кайши был расстрелян коммунистическим расстрельным отрядом. После быстрого судебного процесса за преступления против народа и партии, измену Родине и контрреволюционную деятельность, [PRC.GetLeader] вынес смертный приговор Чан Кайши. Представитель [SOV.GetAdjective] выступал в качестве прокурора в судебном процессе, что усилило предположения о том, что [SOV.GetLeader] тайно одобрил решение.\nНовый националистический лидер [CHI.GetLeader] поклялся отомстить за смерть Чанга и уничтожить коммунистов."
  wtt_news.31.c:0 "Мы приняли верное решение."
  wtt_news.32.t:0 "Чан Кайши освобождён из-под домашнего ареста"
  wtt_news.32.desc:0 "По сообщениям, [CHI.GetLeader], арестованный [CHI_xian_instigator.GetLeader] и переданный коммунистам, вернулся домой после долгих переговоров. Сообщения всё ещё отрывочны, но свидетельства показывают, что [PRC.GetLeader] предложил альянс против [JAP.GetAdjective]. Обе стороны опровергли подобные слухи, причем [PRC.GetLeader] заявил, что лучше сожжёт страну, чем будет делать общее дело с националистами, а [CHI.GetLeader] тут же ответил тем же."
  wtt_news.32.a:0 "Каковы их замыслы в отношении нас?"
  wtt_news.32.c:0 "Как сварливые дети."
  wtt_news.32.d:0 "[JAP.GetNameDefCap] воспользуется этим в своих интересах."
  wtt_news.32.e:0 "Мы можем использовать это в наших интересах."
  wtt_news.33.t:0 "[PRC.GetLeader] осуждает предательство националистов"
  wtt_news.33.desc:0 "После встречи между [CHI.GetLeader] и [PRC.GetLeader] последний осудил то, что он назвал "откровенной и очевидной попыткой захватить Красную армию в националистических и контрреволюционных целях". [CHI.GetLeader] отказался комментировать этот вопрос, заявив только, что националистические армии готовы защитить Китай от любого нападающего.\n\nКак сообщается, двое лидеров обсудили возможность формирования единого фронта против [JAP.GetNameDef].\n\nПродолжится ли этот разрыв возобновлением конфликта между двумя сторонами - еще неизвестно."
  wtt_news.33.b:0 "С какой стати мы когда-либо думали, что они изменятся?"
  wtt_news.34.t:0 "Летящие тигры" сформированы
  wtt_news.34.desc:0 "После обращения Китая к [USA.GetAdjective] пилотам и механикам с призывом присоединиться к добровольческому отряду президент США [USA.GetLeader] официально одобрил передачу более сотни современных истребителей китайским военно-воздушным силам. Пилотам в армии США, военно-морском флоте или морской пехоте также разрешено присоединиться к этому подразделению.\n\nПредполагается, что первые корабли, перевозящие новые истребители, отплывут, как только будет собрано необходимое оборудование. Руководители конгресса выразили обеспокоенность по поводу того, что подобное пренебрежение нормами международного права повлечет за собой последствия."
  wtt_news.34.a:0 "Хорошей охоты!"
  wtt_news.34.b:0 "Они очень рады."
  wtt_news.34.c:0 "Добровольцы? Скорее наемники!"
  wtt_news.34.d:0 "Конец изоляции США?"
  wtt_news.35.t:0 "Шанхайский инцидент"
  wtt_news.35.desc:1 "Напряженность между Китаем и [JAP.GetNameDef] резко возросла после вчерашнего столкновения в Шанхае.\n\nПо сообщениям западных наблюдателей, в Шанхае произошла драка между китайской полицией и группой [JAP.GetAdjective] моряков, в результате которой с обеих сторон были раненые. Когда [JAP.GetAdjective] патруль прибыл для расследования, подразделения китайской армии уже перекрыли все пути доступа к месту происшествия и арестовали [JAP.GetAdjective] моряков, которым были предъявлены обвинения в покушении на убийство.\n\nПравительство [JAP.GetAdjective] выступило с резким предупреждением, что если моряки не будут немедленно освобождены, оно примет меры для обеспечения их свободы."
  wtt_news.35.a:0 "Возмутительно!"
  wtt_news.35.b:0 "Все идет по плану."
  wtt_news.35.c:0 "Война не за горами."
  wtt_news.35.d:0 "Похоже на спланированную акцию."
  wtt_news.36.t:0 "Чан Кайши погиб в авиакатастрофе"
  wtt_news.36.desc:0 "Сегодня [CHI.GetNameDef] пережил трагедию: самолет, перевозивший Чан Кайши, взорвался в воздухе сразу после взлета. Спасатели все еще прочесывают обломки, но мало кто надеется найти выживших среди экипажа и пассажиров.\n\nПолагают, что и генералиссимус, и его жена погибли.\n\nНовый лидер Китая [CHI.GetLeader] пообещал провести полное расследование причин катастрофы. Ходят слухи о заговоре с целью убийства генералиссимуса, которого многие считали препятствием на пути объединения различных фракций в Китае."
  wtt_news.36.a:0 "Одной проблемой меньше."
  wtt_news.36.b:0 "Это не было несчастным случаем."
  wtt_news.36.d:0 "Трагедия."
  wtt_news.37.t:0 "Провозглашена Китайская Народная Республика"
  wtt_news.37.desc:0 "В триумфальной речи [PRC.GetLeader] заявил, что «китайский народ поднялся» и привел коммунистов к победе в гражданской войне в Китае. Коммунистическая партия, вынудив националистов отступить, наконец-то одержала победу после десятилетий борьбы. С этого момента ранее небольшая группа повстанцев, скрывавшаяся в отдаленных горных деревнях, станет полноценным правительством в Китайской Народной Республике."
  wtt_news.37.a:0 "Великий день."
  wtt_news.37.b:0 "Простая формальность."
  wtt_news.37.d:0 "У них ничего не получится."
  wtt_news.38.t:0 "[PRC.GetLeader] одержал победу во внутренней борьбе за власть"
  wtt_news.38.desc:0 "Борьба между внутренними фракциями в Коммунистической партии Китая, кажется, утихла, и [PRC.GetLeader] выдвинулся в качестве главного лидера. Мао Цзэдун и более умеренные фракции значительно потеряли свое влияние, поскольку поддерживаемый [SOV.GetAdjective] [PRC.GetLeader] сумел переиграть их обоих. Какую роль сыграл [SOV.GetLeader] в этом эпизоде, остается предметом многочисленных спекуляций."
  wtt_news.38.a:0 "Пусть он приведет нас к победе!"
  wtt_news.38.b:0 "Незначительный."
  wtt_news.38.c:0 "Полезный союзник."
  wtt_news.38.d:0 "Ему досталась трудная позиция."
  wtt_news.39.t:0 "Кампания по умиротворению Китая"
  wtt_news.39.desc:0 "После серии инцидентов, описанных как "вопиющие провокации", [JAP.GetAdjective] правительство объявило, что в Китае существует состояние "вооруженного конфликта". Они утверждают, что центральное правительство [CHI.GetLeader] проявило нежелание или неспособность надлежащим образом преследовать ответственных лиц. Соответственно, они объявили, что в страну направлены "миротворческие" силы [JAP.GetAdjective] для восстановления порядка и предотвращения дальнейших нападений."
  wtt_news.39.a:0 "Все по плану."
  wtt_news.39.b:0 "Кто это сделал?"
  wtt_news.39.c:0 "Что мы сделали?"
  wtt_news.39.d:0 "Прозрачный предлог."
  wtt_news.39.e:0 "Они поймут свою ошибку."
  wtt_warlord.1.t:0 "[From.GetNameDefCap] Предлагает порабощение"
  wtt_warlord.1.desc:0 "В то время как центральное правительство Китая неспособно обеспечить безопасность своего народа от бандитов и коммунистов, [From.GetLeader] наконец осознал своё положение и обратился к нам за помощью, чтобы попытаться удержать власть. Он будет полностью с нами сотрудничать и разрешит нашим войскам беспрепятственно проходить. В обмен он просит лишь разместить несколько войск для защиты его территории и вспомнить о его вкладе, когда мы закончим с реорганизацией Китая."
  wtt_warlord.1.a:0 "Наконец-то кто-то здравомыслящий!"
  wtt_warlord.1.b:0 "У них нет места в наших планах."
  wtt_warlord.2.t:0 "[From.GetNameDefCap] принимает"
  wtt_warlord.2.desc:0 "Правительство [From.GetAdjective] приняло наше предложение. В обмен на их защиту мы должны «серьёзно рассмотреть» советы, которые нам дали для нашего поведения. Для координации нашей политики прибыл официальный представитель правительства [From.GetAdjective]."
  wtt_warlord.2.a:0 "Небольшая цена за наше выживание."
  wtt_warlord.3.t:0 "[From.GetNameDefCap] отказывается"
  wtt_warlord.3.desc:0 "Правительство [From.GetAdjective] вернуло нашу ноту с категорическим отказом обсуждать это, заявив, что у нас нет полномочий для переговоров с надлежащим национальным правительством."
  wtt_warlord.3.a:0 "Мы станем сильнее и покажем им."
  wtt_britain_lease_azores.1.t:0 "[From.GetNameDefCap] просит передать в аренду Азорские острова"
  wtt_britain_lease_azores.1.desc:0 "[From.GetAdjective] обратились к нам с просьбой сдать Азорские острова в аренду на период войны. Стратегическое расположение островов делает их важной базой, откуда можно охранять морские пути через Атлантику. [From.GetAdjective] вернет острова после окончания боевых действий."
  wtt_britain_lease_azores.1.a:0 "Лучше, чем втягивать нас в войну."
  wtt_britain_lease_azores.1.b:0 "Какая нам от этого выгода?"
  wtt_britain_lease_azores.2.t:0 "[From.GetNameDefCap] согласен"
  wtt_britain_lease_azores.2.desc:0 "Правительство [From.GetAdjective] одобрило наш запрос и передало нам полный контроль над Азорскими островами, понимая, что теперь мы несем ответственность за их оборону от любых атак. Небольшой передовой отряд уже прибыл на острова, чтобы обустроить базу для операций."
  wtt_britain_lease_azores.2.a:0 "Это окажется полезным."
  wtt_britain_lease_azores.3.t:0 "[From.GetNameDefCap] отказывается"
  wtt_britain_lease_azores.3.desc:0 "Ссылаясь на объявленный нейтралитет и законы войны, правительство [From.GetLeader] отклонило наш запрос на право базирования на Азорских островах. Если мы не найдем способ вовлечь их в войну на нашей стороне, острова останутся для нас закрытыми."
  wtt_britain_lease_azores.3.a:0 "Мы это запомним."
  wtt_britain_lease_azores.4.t:0 "Аренда Азорских островов завершена"
  wtt_britain_lease_azores.4.desc:0 "С окончанием военных действий в Европе правительство [POR.GetAdjective] напомнило нам, что аренда Азорских островов была предоставлена только на время войны. Настало время вернуть им контроль над островами."
  wtt_britain_lease_azores.4.a:0 "[ENG.GetAdjective] всегда выплачивают долги."
  wtt_britain_lease_azores.5.t:0 "[ENG.GetNameDefCap] покидает Азорские острова"
  wtt_britain_lease_azores.5.desc:0 "По завершении войны в Европе [From.GetNameDef] выполнил наше соглашение и вернул нам Азорские острова. Мы уже отправили группу администраторов, чтобы восстановить контроль."
  wtt_britain_lease_azores.5.a:0 "Лучший из возможных результатов."
  wtt_soviet_hold_city_t_success:0 "[state.GetName] стоит"
  wtt_soviet_hold_city_d_success:0 "Несмотря на натиск врага, защитники [state.GetName] выстояли и сдержали врага. Захватчики обескровили себя на обороне, заплатив огромную цену за каждый сантиметр захваченной земли. Мы будем помнить о подвигах Героев [state.GetName] в грядущих поколениях!"
  wtt_soviet_hold_city_o_success:0 "[state.GetName] останется нашим!"
  wtt_soviet_hold_city_t_fail:0 "[state.GetName] пал"
  wtt_soviet_hold_city_d_fail:0 "Мобилизовав все имеющиеся войска, [controller.GetAdjective] захватчики прорвали нашу оборону вне [state.GetName]. [controller.GetAdjective] войска вошли в город. Хотя наши защитники вовлечены во врага в ожесточенных уличных боях, город, как ожидается, падет в течение нескольких дней."
  decisions.1.t:0 "Снизить лояльность армейского командования"
  decisions.1.desc:0 "Некоторые офицеры в нижних эшелонах армии выразили \"альтернативные\" взгляды на руководство страны. Чтобы ограничить подозрение, мы должны ограничить наши усилия по привлечению только одного потенциального сторонника, и мы не должны жалеть ресурсов, покупая их лояльность."
  decisions.1.a:0 "Подойдет кто угодно, нам нужен кто-то для командования нашими армиями."
  decisions.1.b:0 "Нам нужен кто-то, кто, по крайней мере, знает, что он делает."
  decisions.1.c:0 "Качество имеет первостепенное значение, мы не должны идти на компромиссы по цене."
  decisions.1.d:0 "Подойдут только самые лучшие."
  decisions.2.t:0 "Повысить лояльность армейского командования"
  decisions.2.desc:0 "Некоторые офицеры в высших эшелонах армии выразили \"альтернативные\" взгляды на руководство страны. Чтобы ограничить подозрение, мы должны ограничить наши усилия по привлечению только одного потенциального сторонника, и мы не должны жалеть ресурсов, покупая их лояльность."
  wtt_soviet_hold_city_o_fail:0 "Незначительная неудача."
  wtt_news.40.t:0 "Взорван Суэцкий канал"
  wtt_news.40.desc_eng:0 "В ответ на приближающиеся к Суэцкому каналу вражеские войска, несущие угрозу потери жизненно важной транспортной артерии, [From.GetNameDef] принимает решение взорвать канал, чтобы помешать им воспользоваться им. Благодаря комбинации блокшивов, подрывов и мин, разрушение весьма обширно и, вероятно, займет долгие месяцы усиленных работ, чтобы его восстановить."
  wtt_news.40.desc_not_eng:0 "В результате операции, которую можно охарактеризовать только как блестящую и смелую, [From.GetNameDef] удалось разрушить жизненно важную транспортную артерию - Суэцкий канал. Благодаря комбинации блокшивов, подрывов и мин, разрушение весьма обширно и, вероятно, займет долгие месяцы усиленных работ, чтобы его восстановить."
  wtt_news.40.a:0 "Бедствие!"
  wtt_news.40.b:0 "Мы не могли позволить врагу воспользоваться им."
  wtt_news.40.c:0 "Теперь мы не недооценим их решимость."
  wtt_news.40.d:0 "Мы отсекли их от империи!"
  wtt_news.40.e:0 "Мощный удар по [ENG.GetAdjective]!"
  wtt_news.40.f:0 "Они приняли верное решение."
  wtt_news.40.g:0 "Значимый удар по нашему союзнику."
  wtt_news.40.h:0 "Это затронет весь мир."
  wtt_news.41.t:0 "Взорван Панамский канал"
  wtt_news.41.desc_usa:0 "В ответ на неспособность защитить Панамский канал и риск потерять жизненно важную военную линию коммуникаций с противником, [From.GetNameDef] вместо этого решил взорвать канал, чтобы гарантировать, что его использование будет им отказано. С помощью комбинации кораблей-блокаторов, взрывов и добычи полезных ископаемых разрушение довольно значительное и, вероятно, потребует месяцев обширных промышленных усилий для его восстановления."
  wtt_news.41.desc_not_usa:0 "В том, что можно описать только как смелую и блестящую военную операцию, [From.GetNameDef] удалось разрушить жизненно важную военную линию коммуникаций, каковой является Панамский канал. С помощью комбинации кораблей-блокаторов, взрывов и добычи полезных ископаемых разрушение довольно значительное и, вероятно, потребует месяцев обширных промышленных усилий для его восстановления."
  wtt_news.41.a:0 "Бедствие!"
  wtt_news.41.b:0 "Мы не могли позволить противнику им пользоваться."
  wtt_news.41.c:0 "Мы снова не должны недооценивать их решимость."
  wtt_news.41.d:0 "Их флот отсечен на другой стороне!"
  wtt_news.41.e:0 "Великолепный удар по [USA.GetAdjective]ам!"
  wtt_news.41.f:0 "Они приняли правильное решение."
  wtt_news.41.g:0 "Значительный удар по нашему союзнику."
  wtt_news.41.h:0 "Тихий океан и Атлантика снова разделены."
  wtt_news.42.t:0 "Суэцкий канал восстановлен"
  wtt_news.42.desc:0 "Путем колоссальных промышленных усилий [From.GetNameDef] восстановила Суэцкий канал. Сегодня утром жизненно важная торговая артерия снова открыта в Средиземном море после более чем полугодовых интенсивных ремонтных работ."
  wtt_news.42.a:0 "Мы восстановили связь с нашей империей."
  wtt_news.42.b:0 "Необходимое вложение средств для нашего государства."
  wtt_news.42.c:0 "Это значительно поможет нашим усилиям."
  wtt_news.42.d:0 "Они устранили неудачу."
  wtt_news.42.e:0 "Последствия затронут всех."
  wtt_news.43.t:0 "Ремонт Панамского канала"
  wtt_news.43.desc:0 "Путем колоссальных промышленных усилий [From.GetNameDef] отремонтировала Панамский канал. Сегодня утром жизненно важная военная связь между Атлантикой и Тихим океаном снова открыта после более чем годовых интенсивных ремонтных работ."
  wtt_news.43.a:0 "Мы восстановили жизненно важную связь между нашими океанами."
  wtt_news.43.b:0 "Мы снова можем перемещаться из Тихого океана в Атлантический."
  wtt_news.43.c:0 "Это значительно поможет нашим усилиям."
  wtt_news.43.d:0 "Они устранили неудачу."
  wtt_news.43.e:0 "Последствия затронут всех."
  wtt_news.44.t:0 "[MAN.GetLeader] объявляет о мандате Небес"
  wtt_news.44.desc:0 "В богато расшитых одеждах, подобающих китайскому императору, [MAN.GetLeader], Сын Неба, Повелитель десяти тысяч лет, Император Великой империи Цин занял Драконий трон на необычной церемонии коронации. Император разместился в Запретном городе, как делали это его предки. Ссылаясь на старые обычаи, [MAN.GetLeader] утверждает, что победа его сил в Гражданской войне в Китае доказывает, что у него есть Небесный мандат на руководство Китаем.\n\nОстается только догадываться, собирается ли он распространять свою власть, пока она не охватит «все под Небом», как утверждали предыдущие императоры."
  wtt_news.44.a:0 "Сын Неба вернулся."
  wtt_news.44.b:0 "Исправление ошибок."
  wtt_news.44.c:0 "Кем он себя возомнил?"
  wtt_news.44.d:0 "Отличное возвращение."
  wtt_news.44.e:0 "Нелепость!"
  wtt_news.45.t:0 "[new_leader.GetLeader] принимает руководство в Китае"
  wtt_news.45.desc:1 "После продолжительной борьбы за власть между [old_leader.GetLeader] и [new_leader.GetLeader] первый наконец признал поражение и встретился с [new_leader.GetLeader] в его резиденции. После двух часов переговоров [old_leader.GetLeader] принял предложение передать власть [new_leader.GetLeader] и уйти с поста премьер-министра Республики.\n\nРанее перед домом собрались группы сторонников обоих лидеров, что вызвало опасения о насильственных столкновениях между двумя сторонами в зависимости от результата.\n\nОднако, о насилии не сообщалось, и, похоже, передача власти прошла относительно гладко."
  wtt_news.45.a:0 "Политика. Политика никогда не меняется."
  wtt_news.45.b:0 "Потрясающий успех."
  wtt_news.45.c:0 "Предпочтительнее насилия."
  wtt_news.45.d:0 "Возможно, им удалось избежать Гражданской войны."
  wtt_news.46.t:0 "[From.GetLeader] провозглашает единую политику в отношении Китая"
  wtt_news.46.desc:0 "В своей речи перед группой сторонников, [From.GetLeader] сегодня объявил о значительном изменении в своем правительстве. Раньше, [From.GetLeader] был готов терпеть, что некоторые части Китая были в значительной степени независимыми. Сейчас это закончилось. С сегодняшнего дня, [From.GetNameDef] будет считать весь Китай своей зоной ответственности, как единое правительство Китая. Любой, кто откажется выполнить приказы от единственного законного китайского правительства, будет рассматриваться как мятежник или предатель, и с ним будут обращаться соответственно.\n\nОднако, еще неизвестно сможет ли правительство [From.GetLeader] реализовать эту угрозу или же это останется лишь пропагандистским ходом, рассчитанным на повышение поддержки населения."
  wtt_news.46.a:0 "Прямая угроза."
  wtt_news.46.b:0 "Мы объединим весь Китай!"
  wtt_news.46.d:0 "Люди и поумнее терпели неудачи."
  wtt_news.47.t:0 "[From.GetNameDefCap] Объявляет о своих претензиях на Индокитай."
  wtt_news.47.desc:0 "Правительство [From.GetLeader] заявило, что текущая ситуация в Индокитае создаёт явную и очевидную угрозу безопасности [From.GetAdjective]. В официальном заявлении говорится, что ни одно правительство в мире не потерпит кинжал, направленный прямо в своё мягкое подбрюшье. Если регион не будет умиротворён или же власти [671.Controller.GetAdjective] не будут заменены на губернаторов, более готовых сотрудничать с [From.GetNameDef], угроза интересам [From.GetAdjective] будет сохраняться.\n\nХотя представитель [From.GetLeader] подчеркнул, что правительство [From.GetAdjective] постарается найти мирное решение, он не исключил и военного варианта."
  wtt_news.47.a:0 "Кто-то должен был это сделать."
  wtt_news.47.b:0 "Придите и заберите их!"
  wtt_news.47.c:0 "Наверняка из этого ничего плохого не выйдет."
  wtt_news.47.d:0 "Не заставляйте нас приходить туда!"
  wtt_news.48.t:0 "Война за независимость Маньчжурии"
  wtt_news.48.desc:0 "После периода внутренних схваток за власть между [JAP.GetAdjective] администраторами и правительством [MAN.GetLeader] борьба за преобладание в Маньчжурии наконец достигла точки кипения.\n\nСообщается, что противостояние было вызвано инцидентом в императорской резиденции, когда генерал [JAP.GetAdjective] якобы оскорбил императора Маньчжоу-го, потребовав от него поклона.\n\nВозмущенный [MAN.GetLeader] ответил, что "Сын Неба не кланяется", ударил генерала тростью и приказал своим солдатам удалить всех солдат [JAP.GetAdjective] с китайской земли."
  wtt_news.48.a:0 "Щенок рычит?"
  wtt_news.48.b:0 "Мы заявим о своей судьбе!"
  wtt_news.48.c:0 "Этот мелкий предатель!"
  wtt_news.48.d:0 "Смеет ли Дракон ударить Солнце?"
  wtt_news.50.t:0 "Гитлер убит"
  wtt_news.50.desc:0 "Немецкое радио сегодня объявило, что предательские военные попытались совершить переворот. После взрыва в штаб-квартире фюрера, в результате которого погиб Гитлер и были ранены несколько других, подразделения армии атаковали несколько офисов СС и группы.\n\nНесмотря на то, что [GER.GetLeader] утверждает, что он полностью контролирует страну и ее армию, все еще поступают сообщения о перестрелках между лоялистами и повстанцами по всей стране.\n\nХодят слухи, что другие ведущие члены нацистской партии планируют захватить власть в хаосе."
  wtt_news.50.a:0 "Подлое предательство!"
  wtt_news.50.b:0 "Ситуация не улучшилась."
  wtt_news.50.c:0 "Скатертью дорожка!"
  wtt_news.50.d:0 "Он слишком далеко зашел"
  wtt_news.51.t:0 "Попытка убийства [GER.GetLeader]"
  wtt_news.51.desc:0 "Немецкое радио сообщило сегодня, что вероломные военные элементы попытались совершить переворот. После взрыва в штаб-квартире фюрера, в результате которого [GER.GetLeader] получил лишь легкие травмы, а несколько других были ранены, армейские части попытались взять под контроль несколько правительственных зданий в Берлине.\n\nНовость о том, что [GER.GetLeader] выжил, быстро распространилась, и большинство частей под контролем путчистов уже вернулись в свои казармы.\n\nНекоторые высокопоставленные [GER.GetAdjective] офицеры покончили жизнь самоубийством после неудавшейся попытки вместо того, чтобы столкнуться с позором судебного разбирательства в печально известном «Народном суде»."
  wtt_news.51.c:0 "Начало конца?"
  wtt_news.52.desc:0 "[GER.GetAdjective] радио сообщило сегодня, что [GER.GetLeader] взял под свой контроль правительство. После перестрелки в бункере фюрера, в ходе которой фюрер был смертельно ранен, подразделения СС быстро перекрыли все основные дороги и железнодорожные узлы, ведущие из Берлина. Между тем, по сообщениям, люфтваффе и сухопутные войска получили приказ двинуться на Берлин для восстановления порядка."
  wtt_news.53.t:0 "Объединение Скандинавии"
  wtt_news.53.desc:0 "Применяя силу оружия, [From.GetOldName] объединило скандинавские народы под своим правлением. Его правительство сейчас интегрирует недавно завоёванные территории. Правительство увеличило паннационалистическую пропаганду, дабы сплотить народ вокруг государства, и открыто её поддерживает.\n\nВ качестве побочного эффекта сторонники объединения Скандинавии начали приводить исторические параллели, доказывая, что современное положение дел можно рассматривать как естественное продолжение более ранних попыток объединить регион. Правительство [From.GetOldAdjective] активно подхватило данную линию мышления и официально провозгласило восстановление Кальмарской Унии, переименовав страну в [From.GetNameDef]."
  wtt_news.53.a:0 "Славный день для всех скандинавов!"
  wtt_news.53.b:0 "Вместе Скандинавия сильнее."
  wtt_news.53.c:0 "Это не продлится долго!"
  wtt_news.54.t:0 "Объединение Севера"
  wtt_news.54.desc:0 "В ходе завоевания всех наций, принадлежащих к нордическому региону, правительство [From.GetOldAdjective] стало чаще предпринимать шаги к интеграции недавно завоеванных территорий. В результате, в попытке сплотить народ вокруг государства, увеличилась паннационалистическая пропаганда с явной поддержкой со стороны правительства.\n\nОфициальное лицо [From.GetOldAdjective] было процитировано следующим образом: \"Нордические страны всегда ощущали сильное родство друг с другом. Естественно, что мы должны объединить их и что наши народы должны сосуществовать бок о бок как единое целое\". Похоже, что правительство решило использовать это родство для объединения людей и теперь провозгласило \"настоящее нордическое единство\", переименовав страну в \"[From.GetNameDef]\""
  wtt_news.54.a:0 "Объединенный Север будет стоять твердо!"
  wtt_news.54.b:0 "Север может стать проблемой для своих соседей"
  wtt_news.55.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.55.desc:0 "Отвоевав все земли, принадлежавшие старой Великой Колумбии, правительство [From.GetOldAdjective] начало усиливать шаги по интеграции вновь завоеванных территорий. В результате, в попытке сплотить народ за государством, усилилась общенационалистическая пропаганда с явной поддержкой со стороны правительства.\n\nПредставители [From.GetOldAdjective] неоднократно заявляли, что вся северная часть Южной Америки должна оглянуться на свою общую историю и использовать это родство в качестве основы для единого государства. Теперь правительство [From.GetOldAdjective] пошло еще дальше и провозгласило «возрождение наследия Боливара», переименовав страну в '[From.GetNameDef]'."
  wtt_news.55.a:1 "Мечта о единой Латинской Америке ждет!"
  wtt_news.55.b:0 "Рождение новой американской сверхдержавы?"
  wtt_news.56.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.56.desc:0 "Обеспечив себе все земли Австро-Венгерской империи, [From.GetOldAdjective] правительство, как представители последнего оставшегося правопреемника, начало реинтеграцию этих территорий. Правительственная пропаганда разгорелась, восхваляя "славные дни Империи" в явной попытке объединить население вокруг широкомасштабных национальных реформ и возвращения к имперским нормам.\n\nВ рамках этого [From.GetOldAdjective] правительство объявило о восстановлении [From.GetNameDef] и изменило официальное название страны, чтобы отразить это."
  wtt_news.56.a:0 "Indivisibiliter ac inseparabiliter!"
  wtt_news.56.b:0 "Двойная монархия возрождается."
  wtt_news.57.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.57.desc:0 "В то время как единое государство вновь управляет Польшей и Литвой, польское правительство начало использовать историю для своей пропаганды, чтобы объединить людей вокруг своей политики. "Исторические эксперты" бомбардируют население различными способами, с помощью которых объединенная Польша и Литва могли бы противостоять угрозам на своих границах, пересказывая истории с высоты власти Речи Посполитой. Похоже, что этот подход оказывает некоторый эффект на перенаправление возмущения людей и сосредоточение их мыслей на славных днях прошлого.\n\nСегодня [From.GetOldAdjective] правительство пошло еще дальше и провозгласило восстановление Содружества, переименовав страну в "[From.GetNameDef]".
  wtt_news.57.a:0 "Если Бог за нас, то кто против нас?"
  wtt_news.57.b:0 "Переживет ли [From.GetOldNameDef] раздел на этот раз?"
  wtt_news.58.t:0 "Объединение Нидерландов"
  wtt_news.58.desc:0 "Завоевав другие Нидерланды, [From.GetOldAdjective] правительство открыто защищало свои действия. Теперь они утверждают, что являются непосредственными и законными преемниками Соединенного Королевства Нидерландов. Они отказались от Лондонского договора 1839 года, утверждая, что он был преступным образом навязан их правительству внешними силами в то время. Таким образом, поскольку нация никогда не переставала существовать, [From.GetOldNameDef] просто восстановил контроль над землей, которая уже принадлежала им.\n\nСдержав свое слово, [From.GetOldAdjective] правительство переименовало страну в '[From.GetNameDef]', и уже предпринимаются масштабные пропагандистские усилия, направленные на объединение людей с использованием текущих мировых кризисов в качестве внешней угрозы, против которой можно объединиться."
  wtt_news.58.a:0 "Снова объединены, как и задумывалось в 1815 году."
  wtt_news.58.b:0 "Да. Все это, похоже, является внутренним делом."
  wtt_news.59.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.59.desc:0 "Ввиду [From.GetOldAdjective] завоевания других центральноамериканских государств их правительство открыто защищало свои действия на международном уровне. Считая себя законным преемником Федеративной Республики Центральной Америки, они назвали государства, вышедшие из их состава в конце 1830-х, незаконными сепаратистскими правительствами и последовательно называли недавние столкновения их законной попыткой \"восстановить контроль\" над этими территориями.\n\nСледуя своим словам, [From.GetOldAdjective] правительство переименовало страну в \"[From.GetNameDef]\", и были предприняты масштабные пропагандистские усилия по объединению людей, использовав текущие мировые кризисы как внешнюю угрозу, против которой нужно сплотиться."
  wtt_news.59.a:0 "Необходимый первый шаг к восхождению на мировую сцену."
  wtt_news.59.b:0 "Поднимаются новые Соединенные Штаты Америк."
  wtt_news.60.t:0 "Объединение Прибалтики"
  wtt_news.60.desc:0 "С завоеванием всех земель, принадлежащих прибалтийским государствам, [From.GetOldAdjective] правительство начало все больше предпринимать шаги по интеграции новых территорий. В результате, чтобы объединить людей с государством, увеличилась паннационалистическая пропаганда с явной поддержкой правительства.\n\n[From.GetOldAdjective] чиновник был процитирован следующим образом: «Страны Балтии всегда чувствовали сильное родство друг с другом. Естественно, что они должны объединиться, особенно в свете угроз на наших границах. Только стоя вместе, наши народы могут оставаться независимыми и свободными». Поэтому теперь они провозгласили «истинное единство Балтии», переименовав страну в «[From.GetNameDef]»."
  wtt_news.60.a:0 "Это необходимо для нашего выживания."
  wtt_news.60.b:0 "Но будет ли новое государство достаточно сильным?"
  wtt_news.61.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.61.desc:0 "Получив все османские земли довоенного периода, [From.GetOldAdjective] правительство, как представитель государства-преемника Османской империи, приступило к реинтеграции этих территорий. Разгорелась пропаганда, направляемая правительством, осуждающая разделение союзниками после Первой мировой и восхваляющая \"славные времена Империи\" в явном стремлении объединить население недавно завоеванных земель для проведения широкомасштабных национальных реформ и возвращения к имперским нормам.\n\nВ рамках этих реформ [From.GetOldAdjective] правительство объявило о восстановлении [From.GetNameDef] и изменило официальное название государства, чтобы это отразить."
  wtt_news.61.a:0 "Мы наконец отменили раздел!"
  wtt_news.61.b:0 "Восстановлено Вечное государство."
  wtt_news.62.t:0 "Единая Европа"
  wtt_news.62.desc:0 "Ведущие державы континентальной Европы были завоеваны [From.GetOldNameDef], и впервые последние мечты о единой Европе кажутся достижимыми. Различные "эксперты", по-видимому, находящиеся на государственной службе, уже начали неоднократно приводить нынешнюю политическую ситуацию в качестве единственного способа "предотвратить будущий европейский конфликт".\n\nВ рамках дальнейших усилий по созданию внешнего вида "нации для всех европейцев" правительственные реформы на национальном и местном уровнях продвигаются впечатляющими темпами. В рамках них было объявлено, что отныне страна будет называться '[From.GetNameDef]', так что "все европейцы могли бы чувствовать себя в ней как дома"."
  wtt_news.62.a:0 "Является ли это концом всех европейских войн?"
  wtt_news.62.b:0 "Посмотрим, получится ли у них это провернуть."
  wtt_news.63.t:0 "Восход [From.GetNameDef]"
  wtt_news.63.desc:0 "По мере того как [From.GetOldAdjective] нация распространяется на соседние территории, попытки правительства создать историческую преемственность становятся более очевидными, явно для объединения народа. Достижения Великой Зимбабвийской империи были усиленно романтизированы, но непрекращающаяся пропаганда, кажется, оказывает влияние на общественное мнение.\n\nСегодня правительство [From.GetOldAdjective] сделало еще один шаг вперед и переименовало страну в '[From.GetNameDef]', что встретило бурные овации на улицах крупных городов."
  wtt_news.63.a:0 "Африка для африканцев!"
  wtt_news.63.b:0 "Настал ли конец колониальной Африки?"
  wtt_news.64.t:0 "Расцвет [From.GetNameDef]"
  wtt_news.64.desc:0 "Военное наступление [From.GetOldAdjective] кажется совершенно неостановимым. Идея, над которой многие насмехались — новая Римская империя — теперь, похоже, полностью в руках итальянцев. Большинство континентальных европейских держав, которые могли бы им противостоять, были практически уничтожены, оставив итальянцам свободу навязать свою волю покоренным народам.\n\nПомимо начала интеграции того, что они уже начали называть «завоеванными римскими территориями», правительство [From.GetOldAdjective] объявило о возрождении Римской империи, переименовав нацию в «[From.GetNameDef]».
  wtt_news.64.a:0 "Рим непобедим!"
  wtt_news.64.b:0 "Они не могут быть серьезны!"
  wtt_news.65.t:0 "Расцвет [From.GetNameDef]"
  wtt_news.65.desc:0 "По мере продолжения наступления [From.GetOldAdjective] исторические параллели не остались незамеченными теми, кто разбирается в истории Персии. Известные общественные деятели уже начали сравнивать эту экспансию с временами Кира Великого, и во всем обществе [From.GetOldAdjective] растет национальная гордость.\n\nПо мере расширения правительственного контроля над новыми территориальными приобретениями и поскольку правительство использует эту волну высокого общественного одобрения, чиновники подтвердили, что нация будет официально переименована в «[From.GetNameDef]».
  wtt_news.65.a:0 "Наша сила продолжает расти!"
  wtt_news.65.b:0 "Принесет ли это мир и стабильность в регион?"
  wtt_news.66.t:0 "Восхождение [From.GetNameDef]"
  wtt_news.66.desc:0 "Подъем [From.GetOldAdjectiveCap] озадачил многих военных экспертов по всему миру, но результаты говорят сами за себя. Греки полностью доминируют на Балканах, отвоевали Стамбул и подавили любое организованное сопротивление Турции в Анатолии за несколько лет. Кажется, что окончательное завершение более чем пяти веков греко-турецкого конфликта теперь достигнуто.\n\nПравительство [From.GetOldAdjectiveCap] использовало историческую преемственность и назвало свои военные достижения «византийским завоеванием против турецкого захватчика», чтобы еще больше укрепить национальную гордость. В рамках этой пропаганды и во время экстравагантного церемониального парада в недавно переименованном Константинополе было объявлено, что [From.GetOldNameDef] сменил свое официальное название на «[From.GetNameDef]».
  wtt_news.66.a:0 "Пусть начнется отвоевание."
  wtt_news.66.b:0 "Чудесный поворот судьбы."
  wtt_news.67.t:0 "Объединение Аравии"
  wtt_news.67.desc:0 "Благодаря [From.GetOldAdjective] захвату большей части Арабского мира правительство ухватилось за новую волну панарабизма, распространяющуюся по региону. Поскольку международные разногласия были \"разрешены\" путем прямого устранения строптивых иностранных правительств военными средствами, арабское единство казалось легко достижимым, и [From.GetOldAdjective] правительство уже продемонстрировало свою готовность преследовать эту цель.\n\nБудь то просто \"попутное течение\" этой общественной благосклонности, призыв служить домом для всех арабов или просто содействие региональной интеграции, [From.GetOldAdjective] чиновники теперь подтвердили, что официальное название страны будет изменено на \"[From.GetNameDef]\""
  wtt_news.67.a:0 "Мечта Зайдана сбылась."
  wtt_news.67.b:0 "Приведет ли это к прочному миру в регионе?"
  wtt_news.68.t:0 "Возвышение [From.GetNameDef]"
  wtt_news.68.desc:0 "По мере того, как [From.GetOldAdjective] нация врастает в своих соседей, попытки правительства создать историческую преемственность становятся все более очевидными, очевидно, для объединения народа. Достижения империи Маджапахит были крайне романтизированы, но непрекращающаяся пропаганда, похоже, оказывает влияние на общественное мнение.\n\nСегодня [From.GetOldAdjective] правительство сделало еще один шаг вперед и переименовало страну в \"[From.GetNameDef]\" в дань уважения истории, в надежде, что все в регионе смогут отождествлять себя с ней."
  wtt_news.68.a:0 "Это конец азиатского колониализма!"
  wtt_news.68.b:0 "Они самоопределились."
  wtt_news.69.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.69.desc:0 "По мере того, как [From.GetOldAdjective] страна разрастается за счет своих соседей, правительство пересмотрело отказ от имени Раттанакосин. Поскольку их нынешние границы все больше напоминают границы исторического периода расцвета королевства, достижения Королевства Раттанакосин все чаще используются для влияния на общественное мнение.\n\nСегодня правительство [From.GetOldAdjective] официально переименовало страну в \"[From.GetNameDef]\", чтобы попытаться извлечь легитимность из истории."
  wtt_news.69.a:0 "Мы восстановили свою гегемонию."
  wtt_news.69.b:0 "Рушатся ли колониальные империи?"
  wtt_news.70.t:0 "Возрождение [From.GetNameDef]"
  wtt_news.70.desc:0 "Под правлением кайзерин Виктории [From.GetOldNameDef] значительно расширили свои границы, превзойдя даже границы старой Священной Римской империи. Все континентальные враги, которые бросили вызов ее правлению, были поставлены на колени [From.GetOldAdjective] военной машиной, оставив ее беспрепятственно проводить свою политику и дальше.\n\nТеперь кайзерин постановила, что нынешняя возможность будет использована, и страна станет духовным преемником Священной Римской империи. В знак этого страна теперь официально переименована. Этим она наконец достигла политического объединения региона, ускользавшего от императоров на протяжении веков."
  wtt_news.70.a:0 "Aquila Elegit Iovis Omnia Vincit!"
  wtt_news.70.b:0 "Ее великолепие и слава неоспоримы!"
