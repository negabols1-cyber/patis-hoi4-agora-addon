   # #  #  # #  # ###  ##  #  # ###        #   ##      #    #  #  ##  
  wtt_warlord_vs_prc.1.t:0 "[warlord.GetLeader] просит поддержки"
  wtt_warlord_vs_prc.1.desc:0 "В Москву прибыла делегация от [warlord.GetLeader], желающая прощупать почву относительно возможной поддержки во внутрипартийной борьбе за власть. Они утверждают, что [communist_china.GetLeader] недостаточно предан делу коммунизма и, возможно, даже лелеет реакционные мысли, намереваясь предать революцию в ее самый критический момент.\n\n[warlord.GetLeader] предлагает нам поддержать его, обещая вечную и нерушимую лояльность делу коммунизма в целом и [SOV.GetLeader] в частности."
  wtt_warlord_vs_prc.1.a:0 "Лояльный ставленник может оказаться полезным."
  wtt_warlord_vs_prc.1.a_tooltip:0 "Это приведет к войне с §H[communist_china.GetNameDef]§!, если они откажутся.\n"
  wtt_warlord_vs_prc.1.b:0 "Нам не нужен такой очевидный оппортунизм."
  #советы поддерживают нового вождя и заявляют коммунистическому Китаю о своем уходе.
  wtt_warlord_vs_prc.2.t:0 "Сообщение от [soviet.GetLeader]"
  wtt_warlord_vs_prc.2.desc:0 "Представитель [SOV.GetAdjective] правительства сообщил нам, что [SOV.GetLeader] испытывает серьезные сомнения по поводу точности интерпретации марксизма, данной [communist_china.GetLeader]. В этой критической фазе классовой борьбы в Китае мы не должны отклоняться от правильного применения марксистско-ленинского учения. Кажется, Москва считает, что [warlord.GetLeader] лучше понимает, что нужно для продвижения коммунистического дела в Китае. С точки зрения Москвы, партии было бы неплохо принять [warlord.GetLeader] в качестве нового председателя или подвергнуться недовольству [SOV.GetLeader]."
  wtt_warlord_vs_prc.2.a:0 "Отправить [communist_china.GetLeader] в Москву, чтобы разобраться с этим."
  wtt_warlord_vs_prc.2.b:0 "Мы никогда не склонимся перед предателями!"
  # Советы говорят Варлорду, что поддержки не будет
  wtt_warlord_vs_prc.3.t:0 "[SOV.GetLeader] отказывает"
  wtt_warlord_vs_prc.3.desc:0 "Как сообщается, [SOV.GetLeader] остается неубежденным в нашей лояльности или способности руководить. [SOV.GetAdjective] правительство продолжает поддерживать [communist_china.GetLeader] в качестве председателя Коммунистической партии Китая."
  wtt_warlord_vs_prc.3.a:0 "Давайте не будем выносить сор из избы."
  # Варлорду говорят, что он теперь новый коммунистический_китай.
  wtt_warlord_vs_prc.4.t:0 "[communist_china.GetNameDefCap] подчиняется"
  wtt_warlord_vs_prc.4.desc:0 "Отчаянные мольбы [communist_china.GetLeader] к [SOV.GetLeader] не смогли переманить [SOV.GetAdjective] на его сторону. Понимая, что бой проигран, [communist_china.GetLeader] публично признал свои ошибки и обещал работать вместе с нами, чтобы гарантировать победу революции."
  wtt_warlord_vs_prc.4.a:0 "Хорошо."
  ## соседнему военачальнику приказано присоединиться или умереть
  wtt_warlord_vs_prc.10.t:0 "Присоединяйся или умри"
  wtt_warlord_vs_prc.10.desc:0 "Столкнувшись с необходимостью отказаться от власти или проверить решимость [SOV.GetAdjective], [communist_china.GetLeader] выбрал последнее. К сожалению, похоже, что [SOV.GetLeader] не блефовал, и начались боевые действия. Учитывая наше шаткое положение, обе стороны подвергли нас сильному давлению, причем [SOV.GetAdjective] потребовали, чтобы мы помогли им свергнуть предателя.\n\nОтказ, по их словам, будет равносилен выбору встать на сторону [communist_china.GetLeader]."
  wtt_warlord_vs_prc.10.a:0 "Умирать за [communist_china.GetLeader] не стоит"
  wtt_warlord_vs_prc.10.b:0 "Мы не будем участвовать в этом."
  # совет просит WTT_communist_china о большем, чем он поддерживал раньше
  wtt_warlord_vs_prc.21.t:0 "[From.GetLeader] требует нашей поддержки"
  wtt_warlord_vs_prc.21.desc:0 "Пришло сообщение от [From.GetLeader], в котором он требует, чтобы мы увеличили поставки ранее согласованной экономической помощи."
  wtt_warlord_vs_prc.21.a:0 "Это плата."
  wtt_warlord_vs_prc.21.b:0 "Это грабеж!"
  wtt_warlord_vs_prc.22.t:0 "[From.GetNameDefCap] Соглашается"
  wtt_warlord_vs_prc.22.desc:0 "Несмотря на обычные протесты от [From.GetLeader], он согласился увеличить темп выплат по нашей просьбе."
  wtt_warlord_vs_prc.22.a:0 "Он должен молить о том, чтобы мы не меняли дальше условия сделки."
  wtt_warlord_vs_prc.23.t:0 "[From.GetNameDefCap] Отклоняет"
  wtt_warlord_vs_prc.23.desc:0 "[From.GetLeader] ответил на наш запрос дополнительной поддержки плоским отказом, заявив, что его нация совершенно не в состоянии делать «абсурдные» платежи, которые мы требуем."
  wtt_warlord_vs_prc.23.a:0 "Он пообещал, и мы получим то, что наше!"
  wtt_warlord_vs_prc.23.b:0 "Пропустим это в этот раз."
  #Soviet asks WTT_communist_china to become puppet
  wtt_warlord_vs_prc.31.t:0 "[From.GetLeader] Требует более тесного сотрудничества"
  wtt_warlord_vs_prc.31.desc:0 "Пришло сообщение от [From.GetLeader], в котором говорится, что наш этап революционной борьбы является особенно уязвимым и может легко пасть жертвой контрреволюции. Его специальному представителю поручено внимательно следить за событиями в нашей стране и давать нам советы о том, как добиться победы в классовой борьбе.\n\nВ записке далее говорится, что любое отклонение от его «предложений» будет расцениваться как признак того, что реакционные элементы захватили власть в нашем правительстве, и тогда будут предприняты необходимые шаги."
  wtt_warlord_vs_prc.31.a:0 "Мы приветствуем возможность учиться."
  wtt_warlord_vs_prc.31.b:0 "Нам никто не нужен, чтобы указывать нам, что делать."
  wtt_warlord_vs_prc.32.t:0 "[From.GetNameDefCap] Принимает"
  wtt_warlord_vs_prc.32.desc:0 "[From.GetLeader] приветствовал нашего специального представителя и назначил его своим личным советником. Теперь мы имеем отличный контроль над их внутренней и внешней политикой."
  wtt_warlord_vs_prc.32.a:0 "Он понял причину."
  wtt_warlord_vs_prc.33.t:0 "[From.GetNameDefCap] Отклоняет"
  wtt_warlord_vs_prc.33.desc:0 "Хотя он и восприимчив к идее, [From.GetLeader] вежливо, но твердо отклонил наше требование более прямого влияния на их политику. Кажется, мы \"не знакомы\" с условиями на местах и должны делегировать внедрение марксистских учений местным экспертам."
  wtt_warlord_vs_prc.33.a:0 "Может, нам нужно повторить еще раз, но более решительно."
  wtt_warlord_vs_prc.34.t:0 "[From.GetNameDefCap] Отказывается платить"
  wtt_warlord_vs_prc.34.desc:0 "[From.GetLeader] проигнорировал все более настойчивые требования о переводе платежей, о которых мы договорились ранее. Даже на просьбу приехать в Москву, чтобы объясниться, не поступило ответа."
  wtt_warlord_vs_prc.34.a:0 "Значит, он хочет испытать нас?"
  # КНР сообщила, что какой-то военачальник хочет создать фракцию
  wtt_warlord_vs_prc.35.t:0 "[From.GetAdjective] Альянс"
  wtt_warlord_vs_prc.35.desc:0 "[From.GetNameDefCap] попросил китайских коммунистов объединиться в единую фракцию - Народный фронт - чтобы разбить под одним знаменем националистов, реакционеров и иностранных интервентов."
  wtt_warlord_vs_prc.35.a:0 "Народ - вот герои!"
  wtt_warlord_vs_prc.35.b:0 "Это против [Root.GetAdjective] интересов."
  wtt_warlord_vs_prc.36.t:0 "[From.GetLeader] отклоняет альянс."
  wtt_warlord_vs_prc.36.desc:0 "[From.GetNameDefCap] отверг очевидно выгодный путь Народного фронта, единого против националистов, реакционеров и иностранных интервентов, заявив вместо этого, что наш союз будет „против [From.GetAdjective] интересов“."
  wtt_warlord_vs_prc.36.a:0 "Придется действовать в одиночку."
  wtt_warlord_vs_prc.36.b:0 "Тогда уж давай распустим Единый фронт."
  wtt_manchukou.1.t:0 "[From.GetNameDefCap] требует подчинения."
  wtt_manchukou.1.desc:0 "По всей видимости, [From.GetLeader] наконец-то решил распространить свою власть на окраинные районы Китая. Прибыл представитель [From.GetAdjective] правительства с требованием, чтобы мы склонились перед единым и истинным Императором Китая, Сыном Небес, [From.GetLeader]. Он продолжил, что отказ будет караться как государственная измена высшей степени."
  wtt_manchukou.1.a:0 "В любом случае эта Республика ни к чему бы не привела."
  wtt_manchukou.1.b:0 "Пусть попробует."
  wtt_manchukou.2.t:0 "[From.GetLeader] Подчиняется"
  wtt_manchukou.2.desc:0 "[From.GetLeader] отправил посланника обратно с личным посланием, в котором обещает полное подчинение и приветствует [MAN.GetLeader] как истинного лидера Китая."
  wtt_manchukou.2.a:0 "Он знает свое место."
  wtt_manchukou.3.t:0 "[From.GetLeader] Отказался"
  wtt_manchukou.3.desc:0 "[From.GetLeader] ответил на наше щедрое предложение потоком оскорблений и проклятий, делая заявления о происхождении и личных качествах Императора [MAN.GetLeader], которые являются как неточными, так и очень оскорбительными."
  wtt_manchukou.3.a:0 "Мы научим его манерам."
  wtt_manchukou.11.t:0 "Пятилетний план"
  wtt_manchukou.11.desc:0 "Новый пятилетний план, в котором подробно описывается, как наше правительство планирует развивать экономику в ближайшие годы, постепенно обретает форму. Между различными департаментами все еще существуют серьезные разногласия относительно основного направления деятельности.\n\nХотя существует консенсус в отношении того, что целью должно быть расширение тяжелой промышленности, то, что должны производить эти новые фабрики, все еще обсуждается.\n\nЧтобы выйти из тупика, необходимо принять решение."
  wtt_manchukou.11.a:0 "Развить нашу авиационную промышленность."
  wtt_manchukou.11.b:0 "Инвестировать в автомобильную промышленность."
  wtt_manchukou.11.c:0 "Всеобщая программа индустриализации."
  wtt_manchukou_bandit_sabotage.21.t:0 "Завод по производству оружия саботирован"
  wtt_manchukou_bandit_sabotage.21.desc:0 "Поступило сообщение с одного из наших заводов в провинции [state.GetName] о крупном пожаре, который начался вчера вечером. Местные пожарные все еще пытаются справиться с огнем, но уверены, что они возьмут пожар под контроль к концу дня. Судя по всему, ущерб заводу существенен, поскольку, похоже, пожар начался в хранилище легковоспламеняющихся химикатов.\n\nВоенная разведка начала тщательное расследование того, как мог возникнуть пожар, несмотря на строжайшие меры безопасности. Первые следы указывают на поджог как на вполне вероятную возможность."
  wtt_manchukou_bandit_sabotage.21.a:0 "Эти террористы должны быть выслежены!"
  wtt_manchukou_bandit_sabotage.22.t:0 "Гражданский завод саботирован"
  wtt_manchukou_bandit_sabotage.23.t:0 "Взорван мост"
  wtt_manchukou_bandit_sabotage.23.desc:0 "Прошлой ночью железнодорожный мост в провинции [state.GetName] обрушился под весом проходящего поезда с боеприпасами. Провести спасательные работы было сложно из-за вторичных взрывов от боеприпасов. Экипаж поезда все еще считается пропавшим без вести, предположительно, погибшим.\n\nВоенная разведка направила группу для расследования места происшествия, как только это станет безопасным, чтобы выяснить, как прочный мост мог обрушиться без предупреждающих знаков.\n\nМестные жители сообщили, что накануне обрушения видели небольшую группу в долине под мостом. В настоящее время их местонахождение неизвестно."
  generic.11.t:0 "Гражданская война завершена"
  generic.11.d:0 "Война, раздиравшая нашу страну, наконец завершена. Теперь мы можем приступить к объединению людей и восстановлению разрушений."
  generic.11.a:0 "Вместе мы поработаем над лучшим будущим!"
  generic.12.t:0 "[From.GetAdjective] пытается саботировать Суэц"
  generic.12.d:0 "По данным военной разведки, [From.GetAdjective] намереваются использовать крупномасштабные разрушения и баржи для саботажа Суэцкого канала. Если мы хотим остановить их, у нас немного времени."
  generic.12.a:0 "Мы не можем этого допустить!"
  generic.13.t:0 "[From.GetAdjective] пытается саботировать Панаму"
  generic.13.d:0 "По данным военной разведки, [From.GetAdjective] намереваются использовать крупномасштабные разрушения и баржи для саботажа Панамского канала. Если мы хотим остановить их, у нас немного времени."
  generic.14.t:0 "[From.GetNameDefCap] выставляет дипломатический протест"
  generic.14.d:0 "Послы [From.GetAdjective] предъявили нашему правительству жесткий дипломатический протест в связи с нашими атташе в странах, с которыми они сейчас находятся в военном конфликте. Они требуют немедленного отзыва нашей военной миссии."
  generic.14.a:0 "Это разумная просьба."
  generic.14.b:0 "Наши атташе будут направлены туда, куда мы захотим."
  attache_political_power_tt:1 "Из-за нашей относительной силы и нашего §Yмнения§! об их влиянии, это окажет следующий эффект:\n"
  attache_fascism_tt:0 "Из-за степени поддержки §Yфашизма§! в нашей стране это окажет следующий эффект:\n"
  attache_communism_tt:0 "Поскольку количество сторонников §Yкоммунизма§! в стране очень велико, это приведет к следующим эффектам:\n"
  attache_democratic_tt:0 "Поскольку количество сторонников §Yдемократии§! в стране очень велико, это приведет к следующим эффектам:\n"
  attache_neutrality_tt:0 "Поскольку количество сторонников §Yнейтралитета§! в стране очень велико, это приведет к следующим эффектам:\n"
  generic.15.t:0 "[From.GetNameDefCap] отзывает атташе"
  generic.15.d:0 "В ответ на наши требования [From.GetNameDef] отозвал свою военную миссию к нашим врагам."
  generic.16.t:0 "[From.GetNameDefCap] удерживает атташе"
  generic.16.d:0 "Вопреки нашим требованиям, [From.GetNameDef] отказался отозвать свою военную миссию к нашим врагам, заявив, что «мы не имеем права вмешиваться в внутренние дела [From.GetAdjective]»."
  generic.16.a:0 "Мы увидим это."
  canals_tt:0 "В течение следующего месяца захватите контроль над берегами канала, чтобы предотвратить вражеский план."
  generic.17.t:0 "[From.GetName] заболевает"
  generic.17.d:0 "На службе [From.GetHerHis] в [From.From.GetNameDef], похоже, [From.GetRank] [From.GetName] слишком сильно нагружал себя. Из-за паршивого климата в районе проведения операции [From.GetRank] теперь заболел и, вероятно, потребуется какое-то время для восстановления. [From.GetSheHeCap] не будет выступать на [From.GetHerHis] обычном уровне, пока [From.GetSheHe] не выздоровеет."
  generic.18.t:0 "[From.GetName] ранен"
 generic.18.d:0 "В ходе успешных боевых действий, [From.GetRank] [From.GetName] по всей видимости, слишком рисковал, ведя своих бойцов. [From.GetSheHeCap] был ранен, и полное выздоровление потребует времени, в течение которого [From.GetRank] не сможет выполнять свои обязанности на прежнем уровне."
 japan_border_conflict.1.t:0 "[JAP.GetAdjective] провокация на нашей границе"
 japan_border_conflict.1.desc:0 "Чтобы поддерживать демаркационную линию на границе с [JAP.GetNameDef], была послана бригада для проверки пограничных знаков у озера Хасан. Эта бригада подверглась обстрелу со стороны местного [JAP.GetAdjective] аванпоста, когда приблизилась к границе.\n\nМы направили формальный дипломатический протест, однако посол [JAP.GetAdjective] утверждает, что бригада была послана для перемещения пограничных знаков, чтобы мы смогли претендовать на большую территорию.\n\n[JAP.GetAdjective] заверили нас, что будут соблюдать границу, однако не допустят никаких "искажений" существующей демаркации и ответят силой, если мы предпримем подобные действия.\n\nЭто фактически означает, что мы больше не можем свободно перемещаться по своей территории в этом районе."
 japan_border_conflict.1.a:0 "Недопустимо."
 japan_border_conflict.2.t:0 "[JAP.GetAdjective] победа на озере Хасан"
  japan_border_conflict.2.desc:0 "После столкновения между [SOV.GetAdjective] и [JAP.GetAdjective] войсками в пограничной зоне около озера Хасан [SOV.GetAdjective] войска, как сообщается, находятся в полном отступлении. [JAP.GetAdjective] подразделения заняли несколько стратегических холмов в этом районе и начали укреплять свои позиции.\n\n[JAP.GetAdjective] захватили несколько [SOV.GetAdjective] танков во время боя и отправили их в Токио для оценки."
  japan_border_conflict.2.a:0 "Мы решили этот вопрос достойно."
  japan_border_conflict.2.b:0 "Мы должны подготовить соответствующий ответ."
  japan_border_conflict.3.t:0 "[JAP.GetAdjective] поражение у озера Хасан"
  japan_border_conflict.3.desc:0 "После столкновения между [SOV.GetAdjective] и [JAP.GetAdjective] войсками в пограничной зоне около озера Хасан посол [JAP.GetAdjective] в Москве запросил прекращение огня.\n\nНесколько [JAP.GetAdjective] нападений на [SOV.GetAdjective] позиции закончились большими потерями во время боя, что вызвало беспокойство в [JAP.GetAdjective] армии относительно возможностей их войск."
  japan_border_conflict.3.a:0 "Лучше потерпеть неудачу с честью, чем вообще не пытаться."
  japan_border_conflict.3.b:0 "Наши силы хорошо себя показали."
  japan_border_conflict.4.t:0 "Пат на озере Хасан"
  japan_border_conflict.4.desc:0 "Сражение между [JAP.GetAdjective] и [SOV.GetAdjective] вокруг озера Хасан прекратилось после того, как обе стороны отступили из оспариваемого региона для перегруппировки и пополнения запасов. Признавая бесполезность дальнейших наступлений, [JAP.GetAdjective] военные запросили прекращение огня и переговоры для установления границы."
  japan_border_conflict.4.a:0 "Мы приобрели ценный опыт."
  japan_border_conflict.5.t:0 "Обострение на озере Хасан"
  japan_border_conflict.5.desc:0 "Продолжаются сражения между [JAP.GetAdjective] и [SOV.GetAdjective] силами вокруг озера Хасан. [JAP.GetAdjective] войска в других районах также начали вступать в бой с силами [SOV.GetAdjective] в этом секторе, чтобы выйти из тупиковой ситуации. Разведка предполагает, что [JAP.GetAdjective] вскоре могут усилить атаку свежими войсками, переброшенными из других частей их империи."
  japan_border_conflict.5.a:0 "Мы должны удержать оборону."
  JAP_kalkin_gol:0 "Проверка [SOV.GetAdjective]"
  wtt_prc.30.t:0 "Провокация прошла успешно"
  wtt_prc.30.desc:0 "Работая под покровом ночи, наши товарищи в [JAP.GetManchuriaPuppet] совершили диверсию на заводе [JAP.GetAdjective]. Подробностей о нанесенном ущербе мало, поскольку империалисты объявили весь район закрытой зоной.\n\nОдин этот факт должен сказать нам, что мы попали в цель. Еще неизвестно, подтолкнет ли это [JAP.GetAdjective] к действию."
  wtt_prc.30.a:0 "Мы разозлили ос."
  wtt_prc.31.desc:0 "Работая под покровом ночи, наши товарищи в [JAP.GetManchuriaPuppet] сумели саботировать жизненно важный мост. Небольшая группа коммандос сообщает, что мост был полностью разрушен и взял с собой поезд с боеприпасами, когда он рухнул. \n\nОни убедились, что их видели местные жители, давая понять, что это был акт саботажа. Еще предстоит выяснить, побудит ли это [JAP.GetAdjective] к действию."
  wtt_prc.32.desc:0 "Нам удалось устроить засаду и уничтожить патруль [JAP.GetAdjective] в [JAP.GetManchuriaPuppet]. Их тела были оставлены на месте происшествия, чтобы империалисты получили правильный сигнал. \n\nВремя покажет, сочтут ли они эти действия достаточными для того, чтобы начать войну."
  wtt_prc.20.c:0 "Мы должны полностью покинуть континент."
  wtt_germany.1006.t:0 "Кайзер готовит переворот!"
  wtt_germany.1006.desc:0 "Сервицио Информационе Милитаре сообщил о подозрительной деятельности во внутренних монархических кругах. Похоже, что некоторые из тех, кто верен только королю, недавно контактировали с иностранными агентами, причём немецкими. Похоже, монархисты вербуются и собираются для противостояния нашему великому лидеру, но не всё потеряно. Мы можем послать банды, чтобы разобраться с ними и дать им отпор, пока у нас ещё есть шанс это сделать. Как нам поступить?"
  wtt_germany.1006.a:0 "Банда Карита справится с ними"
  britain.25.t:0 "[ENG.GetNameDefCap] требует подчинения"
  britain.25.desc:0 "Правительство [ENG.GetAdjective], по-видимому, встревоженное падением [DEN.GetNameDef] наряду с присутствием дипломатов [GER.GetAdjective] в [ICE.GetNameDef], предложило нам присоединиться к союзникам в качестве участников совместных боевых действий. Они ссылаются на опасения относительно своей национальной безопасности, поскольку [GER.GetNameDef] может потенциально использовать исландские базы как плацдарм для налетов на английские конвои или города.\nИх угрозы были плохо завуалированы, ссылаясь на текущую мировую ситуацию, в которой любые утверждения о «якобы нейтралитете» с нашей стороны затмеваются безопасностью британских граждан и войной с фашизмом."
  britain.25.a:0 "У нас нет выбора, кроме как присоединиться к [ENG.GetFactionName]"
  britain.25.b:0 "К [ENG.GetAdjective] будь они прокляты"
  britain.25.c:0 "Мы должны придерживаться нашего нейтралитета, даже если это означает вторжение"
  britain.26.t:0 "[ICE.GetNameDefCap] ищет нашей защиты от [ENG.GetNameDef]"
  britain.26.desc:0 "Наши дипломаты, в настоящее время находящиеся в [ICE.GetNameDef], прислали нам множество сообщений о том, что неопытное правительство [ICE.GetAdjective] было подвергнуто угрозе оккупации английскими войсками, если оно не покорится. В отсутствие какой-либо иной приемлемой альтернативы [ICE.GetLeader.GetName] попросил у нас защиты от английской угрозы. Может быть, база так близко к материковой части Великобритании была бы выгодна для нас?"
  britain.26.a:0 "Народ [ICE.GetNameDef] должен быть защищен"
  britain.26.b:0 "Мы не можем выделить ресурсы"
  britain.27.t:0 "[ICE.GetNameDefCap] отклоняет наше предложение"
  britain.27.desc:0 "Правительство [ICE.GetAdjective] отклонило наш ультиматум о подчинении, ссылаясь на свою веру в нейтралитет и решительное нежелание быть втянутым в войну, в которой они не принимали участия.\nОни утверждают, что этим приказом их независимость нарушается и грубо попирается. К сожалению, это современная война, и в современной войне не может быть нейтральных сторон; хотя мы сожалеем о таком ходе действий, мы должны делать то, что должны."
  britain.27.a:0 "Досадный, но необходимый шаг"