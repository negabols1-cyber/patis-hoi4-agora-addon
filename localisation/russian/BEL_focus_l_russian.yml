l_russian:
 BEL_incoming_elections:0 "Предстоящие выборы"
 BEL_incoming_elections_desc:0 "Растущая политическая активность свидетельствует о приближении выборов. Бельгийский [BEL.GetAdjective] народ будет голосовать в конце мая. Тем временем некоторые партии уже ведут переговоры о предвыборном соглашении для создания новой коалиции после дня голосования. Смогут ли новые популистские движения вроде KBP, Verdinaso и VNV отобрать голоса у традиционных партий?"
 BEL_1936_belgian_general_elections:0 "Всеобщие выборы в Бельгии 1936 года"
 BEL_1936_belgian_general_elections_desc:0 "Выборы - самая важная составляющая демократии и должны быть честными и независимыми."
 BEL_national_unity_wins:0 "Победа национального единства"
 BEL_national_unity_wins_desc:0 "Коалиционные правительства - это традиция в Бельгии, однако для противостояния угрозе фашизма все демократические партии должны войти в большую коалицию, а мелкие разногласия следует отбросить."
 BEL_rising_nationalist_ideas:0 "Победа националистов"
 BEL_rising_nationalist_ideas_desc:0 "Нашей страной слишком долго правили эгоистичные и продажные политики и их друзья-банкиры. Такое поведение лишь ускоряет нравственный упадок нашего общества, позволяя этим красноглазым тварям отвращать наш народ от святой, католической и апостольской церкви. Настало время нашей стране проснуться!"
 BEL_social_democrats_wins:0 "Победа социал-демократов"
 BEL_social_democrats_wins_desc:0 "В последнее время наша страна сильно измотана. Только социал-демократы могли спасти нас и наш народ от частой смены политиков, неправильных решений, роста безработицы и начинающейся коррупции. Мы не могли обеспечить нашим людям достойную жизнь, не приняв социал-государственный уклад, но теперь настало время исправить все эти проблемы."
 BEL_work_with_social_democracies:0 "Сотрудничать с социал-демократами"
 BEL_work_with_social_democracies_desc:0 "Хотя они явно заблуждаются в своем желании идти на компромисс с капиталистами, мы не можем отрицать, что социал-демократы пользуются большой поддержкой со стороны пролетариата, и многие из их лидеров являются экспертами в своих областях. Мы должны делать больше для сотрудничества с ними в создании нашей рабочей республики."
 BEL_stay_neutral:0 "Оставаться нейтральными"
 BEL_stay_neutral_desc:0 "Сила и решимость нашего народа бороться за свою свободу не может быть стерта. Однако нам следует проводить политику нейтралитета, чтобы у наших соседей не было причин подавить нашу с трудом завоеванную независимость."
 BEL_solve_unemployment:0 "Решать проблему безработицы"
 BEL_solve_unemployment_desc:0 "Безработица никогда не должна доводить граждан до нищеты и нищеты. Голод - лучший союзник коммунистов."
 BEL_detterence:0 "Сдерживание"
 BEL_detterence_desc:0 "Оставшись в одиночестве, мы редко извлекаем выгоду из войны. К счастью, мы знаем, что лучшая защита - это та, о которой все знают, так что вам никогда не придется ее применять.
 BEL_armed_neutrality:0 "Вооруженный нейтралитет"
 BEL_armed_neutrality_desc:0 "Чтобы сохранить наш нейтралитет в эти враждебные времена, мы должны показать, что не сдадимся без боя."
 BEL_do_nothing:0 "Дела идут как обычно"
 BEL_do_nothing_desc:0 "Мы не видим никаких проблем в Европе, поэтому нет причин увеличивать военные расходы. Все будет продолжаться в том же духе."
 BEL_prepare_for_inevitable:0 "Подготовиться к неизбежному"
 BEL_prepare_for_inevitable_desc:0 "Германия начала показывать свои истинные намерения. Мы должны увеличить наши военные расходы и организовать нашу оборону соответственно. Германия не должна снова сделать то, что сделала с нами во время Первой мировой войны!"
 BEL_join_allies:0 "Присоединиться к союзникам"
 BEL_join_allies_desc:0 "Будущее [Root.GetNameDef] находится в руках наших старых союзников на Западе. Хотя мы уже связаны с союзниками, официальное присоединение к ним подтвердит нашу приверженность Западу."
 BEL_belgian_government_in_exile:0 "Бельгийское правительство в изгнании"
 BEL_belgian_government_in_exile_desc:0 "Наши фронты рухнули, наши армии рассеяны, наша столица пала, но война еще не окончена, однажды Бельгия снова возродится."
 BEL_exiled_industry:0 "Заводы в изгнании"
 BEL_exiled_industry_desc:0 "Нам нужно работать над подготовкой к нашему возвращению, продолжая развивать нашу производственную базу в изгнании."
 BEL_organize_resistance_groups:0 "Организовать группы сопротивления"
 BEL_organize_resistance_groups_desc:0 "Мы должны организовать повстанцев внутри Бельгии и нанести максимальный ущерб захватчикам."
 BEL_liberation:0 "Освобождение"
 BEL_liberation_desc:0 "Начался последний рывок по освобождению Бельгии от тирании; теперь пути назад нет!"
 BEL_battle_of_bulge:0 "Битва за Арденны"
 BEL_battle_of_bulge_desc:0 "Мы должны сделать всё возможное, чтобы победить в этой войне. Когда мы победим в этой битве, германский фронт рухнет, и они не смогут нас остановить."
 BEL_restoration_and_development:0 "Восстановление и развитие"
 BEL_restoration_and_development_desc:0 "Теперь, когда война закончилась, мы можем вернуться к развитию нашей промышленности в мирных условиях и улучшить жизнь нашего народа."
 BEL_interventionism:0 "Политика интервенционизма"
 BEL_interventionism_desc:0 "Мы ценим свободу всех людей, не только наших граждан. Если для предотвращения тирании нужна война, пусть так и будет."
 BEL_land_reorganization:0 "Земельная реорганизация"
 BEL_land_reorganization_desc:0 "Пришло время провести индустриальную и аграрную реорганизацию, в соответствии с нашими планами по реализации ряда новых реформ для укрепления этих секторов в ближайшем будущем."
 BEL_closer_ties_with_benelux:0 "Более тесные связи с Бенилюксом"
 BEL_closer_ties_with_benelux_desc:0 "Нидерланды и Люксембург - наши братские и соседние страны. Улучшение наших отношений с ними поможет нам в будущем."
 BEL_increase_conscription:0 "Увеличение призыва"
 BEL_increase_conscription_desc:0 "Рабочая сила - самый важный ресурс для армии. С приближающейся войной нам нужно обеспечить приток живой силы для нашей армии."
 BEL_expand_universities:0 "Расширение университетов"
 BEL_expand_universities_desc:0 "Технологии определяют будущее страны. Расширение университетов принесет большие выгоды нашей стране в сфере исследований в будущем."
 BEL_nationalize_key_industries:0 "Национализация ключевых отраслей промышленности"
 BEL_nationalize_key_industries_desc:0 "Наша промышленность будет более эффективной под нашим прямым контролем. С таким контролем мы можем спровоцировать экономический рост и даже контролировать образование монополий. Экономика будет процветать благодаря этим переменам."
 BEL_open_our_markets:0 "Открытие нашего рынка"
 BEL_open_our_markets_desc:0 "Открытие наших рынков позволит нам как больше импортировать, так и экспортировать. Это открытие наших рынков также позволит нам больше узнать о других странах и их экономической политике, что позволит нам улучшить себя и расширить свою экономику."
 BEL_mobilizing_the_economy:0 "Мобилизация экономики"
 BEL_mobilizing_the_economy_desc:0 "Похоже, что война у порога. Мы должны подготовить свою экономику к войне, если хотим выжить."
 BEL_supress_anti_democrats:0 "Угнетение антидемократов"
 BEL_supress_anti_democrats_desc:0 "Народ превыше всего. Ни один человек не получит всю власть в Бельгии."
 BEL_guarantee_our_neighbors:0 "Гарантия нашим соседям"
 BEL_guarantee_our_neighbors_desc:0 "Мир меняется, а слабые страны исчезают. Если мы не хотим, чтобы это случилось с нами, мы должны прежде всего защитить страны вокруг нас."
 BEL_defensive_agreement_luxembourg:0 "Оборонный договор с Люксембургом"
 BEL_defensive_agreement_luxembourg_desc:0 "Люксембург - маленькая и слабая страна, но нам нужно сотрудничать со всеми, чтобы защитить себя."
 BEL_surround_fascist_tyranny:0 "Окружить фашистскую тиранию"
 BEL_surround_fascist_tyranny_desc:0 "Фашистская тирания прямо по соседству хочет править миром, если мы объединимся, мы можем положить конец этой тирании."
 BEL_extend_maginot_line:0 "Расширить линию Мажино"
 BEL_extend_maginot_line_desc:0 "Наша экономика недостаточно сильна, чтобы продлить линию Мажино до наших границ. Вот почему мы должны убедить французов сделать это. Если он распространится на нас, у немцев не будет ни единого шанса."
 BEL_quality_over_quantity:0 "Качество превыше количества"
 BEL_quality_over_quantity_desc:0 "Качество чего-то намного более функционально, чем его количество. Именно поэтому мы должны следить за тем, чтобы оборудование, которое использует наша армия, было самой последней модели, высокого качества и надежным. Это поможет нам оставаться впереди в возможных войнах в будущем."
 BEL_invite_france:0 "Пригласить Францию"
 BEL_invite_france_desc:0 "Лимбургского соглашения было достаточно, чтобы самостоятельно противостоять Германии, но недостаточно, чтобы напасть на нее. Чтобы выполнить эту задачу, мы должны ввести Францию в договор, который может нанести окончательный удар Германии."
 BEL_military_cooperation:0 "Военное сотрудничество"
 BEL_military_cooperation_desc:0 "Мы должны заключить с нашими союзниками соглашения о военном сотрудничестве, если мы хотим в этом мире одержать победу, так как окружающие нас великие державы с полной определенностью являются врагами пролетариата."
 BEL_economic_cooperation:0 "Экономическое сотрудничество"
 BEL_economic_cooperation_desc:0 "Мы должны вкладывать средства в экономики друг друга, чтобы наши экономики не отставали от великих держав и чтобы мы могли в дальнейшем соперничать с мировыми гигантами."
 BEL_purchase_new_colonies:0 "Приобретение новых колоний"
 BEL_purchase_new_colonies_desc:0 "Мы должны улучшить свои знания в данной области и закупать колонии у дружественных стран для получения дополнительных ресурсов и рабочей силы."
 BEL_resign_the_treaty_of_versailles:0 "Переподписание Версальского договора"
 BEL_resign_the_treaty_of_versailles_desc:0 "Нам необходимо заставить Германию снова подписать Версальский договор, но на этот раз мы должны не допустить страданий народа, чтобы нам впредь не пришлось сталкиваться с подобными неприятностями. Поэтому нам следует ввести ограничения лишь на военную область."
 BEL_crush_remanining_fascists:0 "Уничтожение оставшихся фашистов"
 BEL_crush_remanining_fascists_desc:0 "Экстремистские политические идеологии представляют угрозу нашей свободе и процветанию. Хотя при обычных обстоятельствах мы бы допустили подобные идеалы, их последователи порождают хаос и нарушают мир, чего мы не можем допустить."
 BEL_unity_through_democracy:0 "Единство через демократию"
 BEL_unity_through_democracy_desc:0 "Демократия — это сила, которая объединяет людей. Поэтому мы будем использовать эту силу, чтобы сплотить людей и помочь им обрести голос."
 BEL_aid_for_the_spanish_republic:0 "Помощь республиканской Испании"
 BEL_aid_for_the_spanish_republic_desc:0 "Мы должны помочь нашим испанским товарищам в гражданской войне. Их социалистическую республику осаждают кровожадные испанские генералы, присягнувшие на верность тому государству, которое они сейчас разоряют, при поддержке великих фашистских держав Европы."
 BEL_empower_the_unions:0 "Наделить полномочиями профсоюзы"
 BEL_empower_the_unions_desc:0 "Бельгийский пролетариат обладает огромным потенциалом. Мы должны обеспечить, чтобы профсоюзы имели средства и полномочия для регулирования и оптимизации рабочей силы нашей страны."
 BEL_expand_womens_rights:0 "Расширить права женщин"
 BEL_expand_womens_rights_desc:0 "Права женщин еще недостаточно развиты во многих странах. Эта ситуация негативно сказывается на женщинах во всех сферах. Насколько лучше было бы, если бы мы дали им больше прав, если бы у них был свой голос, если бы они могли участвовать в политике и делать то, что им хочется."
 BEL_socialist_economy:0 "Расширить программы социального обеспечения"
 BEL_socialist_economy_desc:0 "Наша нынешняя система социального обеспечения очень несовершенна, и она серьезно разделяет наши социальные классы. С помощью новых и улучшенных программ социального обеспечения мы можем изменить это и решить эту проблему, которая так долго сдерживала нас."
 BEL_seek_cooperation_with_king:0 "Наладить сотрудничество с королем"
 BEL_seek_cooperation_with_king_desc:0 "Что бы мы ни делали, король весьма популярная личность среди народа. Таким образом, выступление против него может подорвать поддержку народа в нашу пользу. Поэтому мы должны сотрудничать с королем и укреплять нашу власть."
 BEL_integrate_communists:0 "Интегрировать коммунистов"
 BEL_integrate_communists_desc:0 "Мы знаем, чем занимаются коммунисты. Нам нужно обхитрить их и ввести в нашу партию, так что им будет очень трудно достичь своих амбиций. Конечно, ценой такого поступка будет очень сложный кабинет, но это лучше, чем передавать страну коммунистам."
 BEL_abolish_the_monarchy:0 "Упразднить монархию"
 BEL_abolish_the_monarchy_desc:0 "Если мы хотим решительно выиграть выборы, мы должны избавиться от короля. Иначе он может закрыть парламент, временно захватить власть и запретить нас. В этом случае мы никогда не сможем совершить свою революцию."
 BEL_snap_election:0 "Внезапные выборы"
 BEL_snap_election_desc:0 "Коммунистическая партия Бельгии заручилась массовой поддержкой и теперь находится в положении, чтобы заставить правительство назначить парламентские выборы, на этот раз свободные от фальсификаций, которым они подвергались годами."
 BEL_go_with_britain:0 "Быть с Британией"
 BEL_go_with_britain_desc:0 "Совместный успех наших партий на родине и в [ENG.GetNameDef] сделал наши правительства естественными союзниками."
 BEL_ask_for_foreign_subsidies:0 "Просить иностранных субсидий"
 BEL_ask_for_foreign_subsidies_desc:0 "Получение иностранных субсидий от соседей, которые с нами в хороших отношениях, безусловно поможет нам в наших перспективах развития крупной промышленности."
 BEL_awaken_the_war_machine:0 "Разбуди боевую машину"
 BEL_awaken_the_war_machine_desc:0 "С учетом того, что мир горит, нам необходимо достичь уровня других стран, если мы хотим побороться за свое место на мировой арене и обрести уважение."
 BEL_military_aid:0 "Военная помощь"
 BEL_military_aid_desc:0 "У Союзников есть множество производителей оружия, мы должны использовать их, чтобы быстро модернизировать наши вооруженные силы."
 BEL_study_the_british_navy:0 "Изучить британский флот"
 BEL_study_the_british_navy_desc:0 "Британцы, несомненно, являются королями этой планеты, когда речь заходит о флоте. Королевский военно-морской флот прошел через множество различных испытаний за все время своего существования, и благодаря этому он занял первое место во всех морских рейтингах. Мы можем многому научиться у этого крупного флота благодаря альянсу с британцами."
 BEL_allied_technological_developments:0 "Союзнические технологические разработки"
 BEL_allied_technological_developments_desc:0 "Мы не должны отставать от технологического развития в других странах. Поэтому нам необходимо получить технологическую поддержку от наших союзников и немедленно приступить к работе."
 BEL_american_guarantee:0 "Американская гарантия"
 BEL_american_guarantee_desc:0 "Мы сильны, но не в союзе ни с одной страной. Поэтому нам нужна великая держава, которая защитит нас. В Первой мировой войне британцы и французы не смогли защитить нас. Поэтому на этот раз мы должны попросить об этом США."
 BEL_marshall_plan:0 "План Маршалла"
 BEL_marshall_plan_desc:0 "Войны и гражданские беспорядки нанесли нашей стране тяжелые раны. План Маршалла поможет нам залечить эти раны и восстановить былую мощь."
 BEL_found_ecsc:0 "Основать ЕОУС"
 BEL_found_ecsc_desc:0 "Создание Европейского объединения угля и стали принесет экономическую выгоду странам-участницам. Это сотрудничество может быть также распространено на другие области в будущем, что позволит странам-участницам оказывать друг другу большую поддержку."
 BEL_formalize_european_union:0 "Оформить Европейский союз"
 BEL_formalize_european_union_desc:0 "Нам нужно согласовать с другими европейскими государствами, с которыми мы уже давно сотрудничаем по различным соглашениям, и официально объединиться под одной крышей."
 BEL_create_cern:0 "Создать ЦЕРН"
 BEL_create_cern_desc:0 "Теперь, когда у нас есть Европейский Союз, мы можем заняться более важными вопросами. Ядерная энергетика очень важна, и мы не должны отставать от других стран. Вот почему следует создать центр ядерных исследований."
 BEL_end_persecution_in_europe:0 "Покончить с преследованиями в Европе"
 BEL_end_persecution_in_europe_desc:0 "Кто-то должен остановить угнетение в Европе. Мы должны избавиться от этого реакционного менталитета и распространить демократию по всему континенту на благо наших народов."
 BEL_towards_a_red_government:0 "К красному правительству"
 BEL_towards_a_red_government_desc:0 "Настоящие намерения коммунистической партии были ясны с самого начала, но рабочая партия не видела ничего, кроме прихода к власти. Они не понимали, что открыто ведут нашу страну по пути, ведущему к ее гибели. Посмотрим, что теперь будет."
 BEL_independent_revolution:0 "Независимая революция"
 BEL_independent_revolution_desc:0 "Мы не являемся частью экспансионистской политики Советского Союза, мы не получали поддержки ни от советов, ни от какого-либо другого государства, это наша революция."
 BEL_new_reforms:0 "Новые социалистические реформы"
 BEL_new_reforms_desc:0 "Если мы хотим завершить революцию в нашей стране, мы должны сначала реформировать наши законы в соответствии с социализмом."
 BEL_establish_politburo:0 "Установить политбюро"
 BEL_establish_politburo_desc:0 "Сильная революция осуществляется при сильном центральном правительстве. Создание сильного и уполномоченного комитета для определения людей, которые будут управлять страной, усилит нашу революцию."
 BEL_five_year_plan:0 "Пятилетний план"
 BEL_five_year_plan_desc:0 "Пришло время нам сосредоточиться на экономике и удостовериться, что она достигает удовлетворительного уровня. Состояние нашей экономики на данный момент позорное, и мы не потерпим этого."
 BEL_expand_unions:0 "Расширение профсоюзов"
 BEL_expand_unions_desc:0 "Сильные профсоюзы и защита рабочих — необходимость на любой современной рабочей силе. Мы создадим прочные узы с этими профсоюзами для улучшения благосостояния всех рабочих."
 BEL_increase_agency_spending:0 "Увеличение расходов на агентства"
 BEL_increase_agency_spending_desc:0 "Если мы хотим устроить революции в других странах, нам необходимо больше вкладывать в шпионаж. Наши агенты должны вызвать гражданские беспорядки в тех странах, иначе наша работа будет трудной и неподъемной."
 BEL_rise_socialist_workers:0 "Подъем социалистических рабочих"
 BEL_rise_socialist_workers_desc:0 "Мы можем начать создавать гражданские беспорядки в странах-соседях с населением, которым можно манипулировать. Никто не остановит рабочую революцию, и в один прекрасный день вся Европа будет под нашим контролем!"
 BEL_support_pcf:0 "Поддержка Французской коммунистической партии"
 BEL_support_pcf_desc:0 "Наша революция не должна ограничиваться Бельгией. Она должна распространяться и вдохновлять других коммунистов. Мы должны помочь нашим товарищам во Франции, чтобы наш голос был лучше услышан. Не должно быть трудным создать революцию во Франции, у которой и так сложные внутренние дела."
 BEL_unite_workers_all_around_europe:0 "Объединение рабочих по всей Европе"
 BEL_unite_workers_all_around_europe_desc:0 "Все рабочие Европы, настало ваше время. Мы должны собраться вместе и противостоять этим империалистическим странам, чтобы построить лучшее будущее."
 BEL_go_with_soviet:0 "Вместе с Советами"
 BEL_go_with_soviet_desc:0 "Наше будущее в коммунизме, поэтому мы должны присоединиться к нашим товарищам по всему миру в этой глобальной борьбе. Сталин укажет нам путь и приведет рабочих к славному завтра."
 BEL_decolonization:0 "Деколонизация"
 BEL_decolonization_desc:0 "Коммунисты всегда выступали против империализма, поэтому мы должны начать процесс деколонизации Конго."
 BEL_spread_communism_benelux:0 "Распространение коммунизма в Бенилюксе"
 BEL_spread_communism_benelux_desc:0 "Мы должны распространять коммунизм вокруг себя, но у нас нет времени распространять его путем революции. Вместо этого мы должны применить силу, то есть объявить войну и заставить их установить коммунистическое правительство."
 BEL_end_fascist_tyranny:0 "Конец фашистской тирании"
 BEL_end_fascist_tyranny_desc:0 "Мы должны положить конец фашистской тирании. Кто-то должен положить конец страданиям, которые Германия и Италия причиняют людям. Если никто этого не остановит, наступит наш черед, и тогда будет уже слишком поздно."
 BEL_socialist_emulation:0 "Социалистическое соревнование"
 BEL_socialist_emulation_desc:0 "При капитализме рабочие вынуждены конкурировать друг с другом за кусок хлеба, в то время как владельцы фабрик наживаются на любом повышении производительности, достигнутом работниками. Это неэффективно и бесчеловечно. Социалистическая система позволит тем, кто еще не является лучшим, получить необходимую поддержку, чтобы развить свои способности, учась у тех, кто преуспевает."
 BEL_soviet_industrial_support:0 "Советская промышленная поддержка"
 BEL_soviet_industrial_support_desc:0 "Нет ничего постыдного в том, чтобы искать помощи у более крупных, более развитых стран. В войне за защиту революции каждый рабочий, крестьянин и инженер - наш товарищ, и мы будем рады их помощи в развитии наших отраслей промышленности, как и в том случае, если бы роли поменялись местами."
 BEL_soviet_military_cooperation:0 "Советское военное сотрудничество"
 BEL_soviet_military_cooperation_desc:0 "Советское военное сотрудничество может дать нашим войскам и лидерам то преимущество, которое им необходимо для победы над врагами."
 BEL_soviet_designers:0 "Пригласить советских конструкторов"
 BEL_soviet_designers_desc:0 "Технические знания, которыми обладают наши коммунистические союзники, на десятилетия опережают наши. Если они поделятся с нами своим опытом, мы сможем перепрыгнуть наших врагов и избежать ненужного кровопролития благодаря превосходному оружию и технике."
 BEL_red_army:0 "Красная Армия"
 BEL_red_army_desc:0 "Наша армия должна состоять только из тех, кто готов защищать социализм в [Root.GetNameDef] и распространять его среди населения мира, а этого можно достичь только путем восстановления [Root.GetAdjective] Красной Армии."
 BEL_invite_nkvd_agents:0 "Пригласить агентов НКВД"
 BEL_invite_nkvd_agents_desc:0 "Агенты НКВД одни из самых опытных в мире. Поскольку мы дружим с Советами, мы можем пригласить их в нашу страну и не дать империалистам создать беспорядки в нашей стране."
 BEL_integrate_benelux:0 "Интегрировать Бенилюкс"
 BEL_integrate_benelux_desc:0 "Мы можем объединить Бенилюкс мирным путем. Для этого нам нужно убедить наши соседние государства в регионе и объединить усилия. Единый Бенилюкс будет намного сильнее и принесет пользу нам всем. Это также облегчит нам сохранение нашей социалистической революции."
 BEL_communist_education_centers:0 "Коммунистические образовательные центры"
 BEL_communist_education_centers_desc:0 "Эти центры были созданы нашими товарищами из-за рубежа, и они находятся на переднем крае наших усилий в подготовке [BEL.GetAdjective] к новой [BEL.GetNonIdeologyName], которая грядет."
 BEL_a_new_red_benelux:0 "Новый Красный Бенилюкс"
 BEL_a_new_red_benelux_desc:0 "Теперь нам остается только защитить то, чего мы достигли, от тех, кто хочет уничтожить это за пределами наших границ."
 BEL_crush_democratic_opposition:0 "Разгромить демократическую оппозицию"
 BEL_crush_democratic_opposition_desc:0 "Демократы являются самыми активными в оппозиции, и это очень опасно. Они пытаются снова внушить людям, что демократия - это хорошо, а не национализм. Мы должны остановить этих ублюдков, прежде чем они поставят под угрозу нашу власть."
 BEL_support_devlag:0 "Поддержка DeVlag"
 BEL_support_devlag_desc:0 "Если мы хотим сблизиться с немцами и обезопасить наше правительство, мы должны поддержать DeVlag, и они поддержат нас."
 BEL_march_on_the_capital:0 "Марш на столицу"
 BEL_march_on_the_capital_desc:0 "Наконец-то настал момент, когда наша партия поднимется и возьмет под контроль будущее [BEL.GetNameDef]. Мы должны маршировать на [ROOT.capital.GetCapitalVictoryPointName] и заявить о себе! Это будет началом прочной и безопасной эры в истории [BEL.GetAdjective]!"
 BEL_verdinaso_elected:0 "Вердинасо побеждает"
 BEL_verdinaso_elected_desc:0 "Конец больной системы парламентской демократии настал, нам больше не нужно жить отдельно от наших братьев и сестер или подчиняться произвольным правилам членов парламента. Да здравствует король, да здравствует Диетс Рэйк."
 BEL_side_with_france:0 "Встать на сторону [FRA.GetNameDef]"
 BEL_side_with_france_desc:0 "Немцы опустошили нашу страну в Первой мировой войне, мы никогда не сможем сотрудничать с ними, с другой стороны, фашистское правительство во Франции захочет сотрудничать с нами против немецкой угрозы."
 BEL_give_full_power:0 "Дать всю полноту власти"
 BEL_give_full_power_desc:0 "Демократические и коммунистические остатки в нашей стране все еще мешают нам делать то, что мы делаем. Мы должны заставить эти остатки замолчать, дав полную власть фашистскому совету."
 BEL_french_economic_support:0 "Французская экономическая поддержка"
 BEL_french_economic_support_desc:0 "Нам нужна сильная промышленность, если мы хотим выжить против угрозы со стороны Германии, но это сложно сделать самостоятельно. Наши французские братья и сестры не колеблясь поддержат нас."
 BEL_ally_across_the_channel:0 "Союзник через Ла-Манш"
 BEL_ally_across_the_channel_desc:0 "Даже самая могущественная страна в мире встретила фашизм. Альянс с ними был бы очень выгоден для нашей страны."
 BEL_belgian_militarism:0 "Бельгийский милитаризм"
 BEL_belgian_militarism_desc:0 "Бельгия вошла в историю на две тысячи лет! Мы удивили великого Цезаря, победили французов в битве при Золотых шпорах и доминировали над немцами во время Великой войны. Наше наследие героическое; наша армия должна отражать это."
 BEL_military_police:0 "Военная полиция"
 BEL_military_police_desc:0 "По мере того, как растет сопротивление нашему режиму, нам нужно получить инструменты, чтобы уничтожить его в зародыше, прежде чем он разрастется. Более совершенная военная полиция может быть единственным способом защитить нашу власть, пока народ [BEL.GetName] не научится принимать новый порядок."
 BEL_meet_with_the_king:0 "Встреча с королем"
 BEL_meet_with_the_king_desc:0 "Мы победили на выборах и теперь у власти. Теперь мы должны убедить короля и поставить его во главе страны. Никто не сможет править страной лучше, чем король, заботящийся о своем народе."
 BEL_crush_devlag:0 "Подавить DeVlag"
 BEL_crush_devlag_desc:0 "Если мы не избавимся от DeVlag сейчас, в будущем они могут попытаться восстановить фашистский режим. Это может быть очень разрушительным для короля и его правительства. Мы должны избавиться от них прямо сейчас."
 BEL_vnv:0 "Vlaamsch Nationaal Verbond"
 BEL_vnv_desc:0 "В отличие от Verdinaso, с которым мы разделяем множество общих точек зрения и мнений, мы участвовали в выборах, получили то, что заслуживали, и теперь мы на шаг ближе к нашей цели - Dietsland."
 BEL_the_belgium_first:0 "Сначала Бельгия"
 BEL_the_belgium_first_desc:0 "Благо нации должно иметь приоритет перед так называемыми «истинами». Так же, как мы куем свою судьбу, мы должны создавать свои собственные факты."
 BEL_secret_pact_with_axis:0 "Сектный пакт с Осью"
 BEL_secret_pact_with_axis_desc:0 "Мы можем положиться на геополитическую реальность, что [GER.GetNameDef] и [FRA.GetNameDef] в конечном итоге столкнутся друг с другом. Если мы будем сотрудничать с [GER.GetAdjective]s, мы сможем получить территорию и открыть для себя новые возможности."
 BEL_german_economic_pact:0 "Интегрироваться с немецким рынком"
 BEL_german_economic_pact_desc:0 "мы должны приложить усилия, чтобы интегрировать нашу промышленность с более широкой экономикой [GER.GetAdjective], чтобы воспользоваться их экономическим могуществом."
 BEL_german_advisors:0 "Немецкие советники"
 BEL_german_advisors_desc:0 "Немецкие советники прибыли в Бельгию и помогают бельгийским вооруженным силам внедрять новейшие тактические приемы, технологии и разработки европейского военного искусства."
 BEL_belgian_general_staff:0 "Генеральный штаб Бельгии"
 BEL_belgian_general_staff_desc:0 "Необходимо создать генеральный штаб, который получит больше влияния на перемещение войск, политику в армии и внедрение технологий. Тогда мы сможем дать отпор врагу сполна."
 BEL_backstab_germany:0 "Удар Германии в спину"
 BEL_backstab_germany_desc:0 "Серьезно ли немцы считали, что на их фашистские идеи просто закроют глаза? Ну, они удивятся, потому что наши войска скоро вступят в их столицу. Да здравствует Бельгия!"
 BEL_join_axis:0 "Присоединиться к Оси"
 BEL_join_axis_desc:0 "Пришло время присоединиться к Оси, чтобы выстроить светлое будущее Бельгии плечом к плечу с немцами."
 BEL_german_equipment_support:0 "Поддержка немецкой техники"
 BEL_german_equipment_support_desc:0 "Современное и качественное вооружение немцев окажется очень полезным для нашей армии. С его помощью мы сможем сражаться на фронте еще эффективнее, чем раньше."
 BEL_reichsprotectorate_benelux:0 "Рейхспротекторат Бенилюкс"
 BEL_reichsprotectorate_benelux_desc:0 "Мы восстали из пепла под руководством [GER.GetNameDef] и стали сильнее, чем когда-либо. Теперь нашу преданность общему делу вознаградят, расширив наши владения."
 BEL_support_uranprojekt:0 "Поддержка Уранового проекта"
 BEL_support_uranprojekt_desc:0 "Немцы разрабатывают беспрецедентное оружие, использующее ядерную энергию. Отправка наших учёных в Германию может ускорить создание этого оружия."
 BEL_increase_defense_budget:0 "Увеличение оборонного бюджета"
 BEL_increase_defense_budget_desc:0 "Ещё одно увеличение расходов должно гарантировать, что наши войска готовы к худшему."
 BEL_claim_all_flemish_states:0 "Заявить права на все Фламандские государства"
 BEL_claim_all_flemish_states_desc:0 "Все фламандские территории должны быть под нашим контролем. Наш народ больше не должен страдать под властью других государств. Исходя из немецкого плана по объединению всех арийцев в одно государство, мы должны сделать то же самое и объединить наш народ."
 BEL_unite_with_netherlands:0 "Объединение с Нидерландами"
 BEL_unite_with_netherlands_desc:0 "Пора объединиться с нашими голландскими братьями и сёстрами. Вместе мы станем единым государством, станем сильнее и будем стойко противостоять всем, кто попытается покончить с нами."
 BEL_from_dutchland:0 "Провозгласить Нидерланд"
 BEL_from_dutchland_desc:0 "Да здравствует Нидерланд!"
 BEL_corportism:0 "Корпоративизм"
 BEL_corportism_desc:0 "Следуя итальянской модели, рабочие и капиталисты из разных секторов экономики должны участвовать в формировании государственной политики, чтобы мы могли посредничать между этими группами и проводить наиболее выгодные для национальной экономики реформы. Это поможет нам обеспечить прочное политическое будущее для [BEL.GetNameDef]."
 BEL_tactical_wargaming_department:0 "Отдел Тактических военных игр"
 BEL_tactical_wargaming_department_desc:0 "Требования современной войны растут с каждым днем. Нашему высшему командованию нужно расширяться за счет новых отделов, где они смогут экспериментировать с новыми методами тактических военных игр."
 BEL_jaeger_training_program:0 "Программа Подготовки Егерей"
 BEL_jaeger_training_program_desc:0 "Наши подразделения егерей давно считаются элитой вооруженных сил. Их истоки восходят к Великой войне. Возможно, пришло время обновить подразделения, модернизировав их и, в свою очередь, подняв моральный дух всей армии."
 BEL_demand_nord_pas_de_calais:0 "Требование Нор-Па-де-Кале"
 BEL_demand_nord_pas_de_calais_desc:0 "Фламандцы давно живут в регионе Кале под флагом другой нации. Это должно прекратиться. Мы должны захватить этот регион с помощью войны, если это необходимо, и заставить наш народ чувствовать себя комфортно под своим собственным флагом."
 BEL_declare_state_of_emergency:0 "Объявить чрезвычайное положение"
 BEL_declare_state_of_emergency_desc:0 "Столкнувшись с угрозой политического радикализма и растущей сложностью поддержания порядка, король решил ввести военное положение. В этот роковой час король и министр обороны развернули армию, чтобы стабилизировать страну. В процессе они фактически приостановили действие конституции."
 BEL_gain_support_of_fascists:0 "Получить поддержку фашистов"
 BEL_gain_support_of_fascists_desc:0 "Несмотря на то, что люди поддерживают короля и его правление, с политической точки зрения это сложно. Поэтому, если мы заручимся поддержкой Рексистов, то сможем укрепить свои позиции в политике."
 BEL_deploy_royal_guards:0 "Развернуть королевских гвардейцев"
 BEL_deploy_royal_guards_desc:0 "Наших королевских гвардейцев необходимо увеличить, как это подобает нашему великому королю."
 BEL_assure_the_population:0 "Успокоить население"
 BEL_assure_the_population_desc:0 "Может показаться, что [ROOT.GetName] стремительно приближается к краху, но король Леопольд III хочет, чтобы население знало, что монархия будет держать твердую руку, чтобы вернуть стране стабильность."
 BEL_purge_radical_opposition_groups:0 "Очистить страну от радикальных оппозиционных групп"
 BEL_purge_radical_opposition_groups_desc:0 "Чтобы бороться с коммунистами и фашистами, должны быть организованы массовые репрессии. В процессе этого гражданская власть будет уменьшена. Премьер-министр будет заменен верным монархистом, который не будет ставить под сомнение исключительные, но необходимые действия короля."
 BEL_ensure_our_victory:0 "Обеспечить нашу победу"
 BEL_ensure_our_victory_desc:0 "Нам нужно принять широкие меры, чтобы убедиться, что люди голосуют за правильную сторону. Если мы правильно разыграем свои карты, мы победим."
 BEL_the_kingdom_of_belgium:0 "Королевство Бельгия"
 BEL_the_kingdom_of_belgium_desc:0 "Леопольд III сейчас любим и обсуждаем по всей стране и поддерживается большими массами. Нет сомнений, что он примет правильные решения для будущего нашей страны. Да здравствует Леопольд III!"
 BEL_more_executive_powers:0 "Больше исполнительных полномочий"
 BEL_more_executive_powers_desc:0 "Почему король должен отвечать за то, что он делает, особенно если это во благо страны?"
 BEL_end_the_state_of_emergency:0 "Закончить чрезвычайное положение"
 BEL_end_the_state_of_emergency_desc:0 "Всё успокоилось, и всё вернулось к норме, поэтому в чрезвычайном положении, введённом королём Леопольдом III, больше нет необходимости. Мы должны закончить чрезвычайное положение и восстановить демократию."
 BEL_flexible_foreign_policy:0 "Гибкая внешняя политика"
 BEL_flexible_foreign_policy_desc:0 "Наша страна находится в очень проблемном регионе из-за своего расположения. Нам нужно быть очень гибкими и быстрыми во внешней политике и одинаково подходить ко всем сторонам, чтобы не злить ни одну из стран вокруг нас."
 BEL_find_best_ally:0 "Найти самого выгодного союзника"
 BEL_find_best_ally_desc:0 "Нам нужно выяснить, какая из великих держав вокруг нас может нам больше всего помочь, и определить нашу сторону в грядущей мировой войне. Мы не должны повторять тех же ошибок, что и в прошлой войне, и снова проиграть."
 BEL_proactive_defense:0 "Упреждающая оборона"
 BEL_proactive_defense_desc:0 "Наши враги не смогут атаковать, если их уже уничтожили. Давайте перенесем войну на их территории, прежде чем она коснется наших, покажем им, на что способны люди из [BEL.GetName], когда им угрожают."
 BEL_attack_enemy:0 "[GetAttackEnemyFocusName]"
 BEL_attack_enemy_desc:0 "Мы должны объединиться с нашими союзниками и атаковать нашего врага, когда он этого меньше всего ожидает. Таким образом, они будут застигнуты врасплох, и их будет гораздо легче уничтожить. Нам нужно вернуть их туда, откуда они пришли."
 BEL_ATTACK_ENEMY_ENG:0 "Атаковать Германию"
 BEL_ATTACK_ENEMY_FRA:0 "Атаковать Британию"
 BEL_ATTACK_ENEMY_GER:0 "Атаковать союзников"
 BEL_ATTACK_ENEMY_NORMAL:0 "Уничтожить ваших врагов"
 BEL_aggressive_foreign_policy:0 "Агрессивная внешняя политика"
 BEL_aggressive_foreign_policy_desc:0 "Мы должны вести агрессивную внешнюю политику. Мы устали от угнетения и унижения. Мы должны быть агрессивными и взять то, что по праву наше. Никакой больше Бельгии, сидящей в тишине."
 BEL_declare_absolute_neutrality:0 "Объявить абсолютный нейтралитет"
 BEL_declare_absolute_neutrality_desc:0 "Бельгия должна сделать все возможное, чтобы не допустить европейской войны. Объявив абсолютный нейтралитет, мы ясно даем понять всем, что не позволим втянуть наш остров во что-либо."
 BEL_together_with_luxembourg:0 "Вместе с Люксембургом"
 BEL_together_with_luxembourg_desc:0 "Люксембург - слишком маленькое государство, чтобы защитить себя. У нас очень хорошие отношения и мы дружим уже долгое время. Мы можем предложить им защиту и держаться вместе спина к спине и защищать друг друга."
 BEL_build_forts_on_the_borders:0 "Построить форты на границах"
 BEL_build_forts_on_the_borders_desc:0 "Даже если мы объявим нейтралитет, то уверены, что на нас нападут, но неизвестно откуда. Поэтому мы не доверяем ни одному нашему соседу и начинаем строить стену по всей границе."
 BEL_demand_annexation_of_lux:0 "Требовать аннексии Люксембурга"
 BEL_demand_annexation_of_lux_desc:0 "Люксембург - маленькая и бесполезная страна, которая едва самодостаточна и даже не имеет целей. Мы дадим им шанс присоединиться к нам, чтобы они могли стремиться к чему-то большему. Если они откажутся, мы все равно аннексируем их силой."
 BEL_demand_annexation_of_netherlands:0 "Требовать аннексии Нидерландов"
 BEL_demand_annexation_of_netherlands_desc:0 "В последнее время Нидерланды оказались очень неудачной страной, у них проблемы с тем, чтобы воспользоваться имеющимися возможностями. А еще они не подпускают к себе наших людей. Мы должны прекратить это и предпринять что-то против."
 BEL_solve_problems_in_army:0 "Решить проблемы в армии"
 BEL_solve_problems_in_army_desc:0 "Языковая проблема в армии приводит ко многим другим проблемам, и эти проблемы преследуют нас. Как бы трудно ни было это сделать, в армии должен быть один язык, и это решит другие проблемы, связанные с этой проблемой."
 BEL_military_mobilization_strategy:0 "Военная стратегия мобилизации"
 BEL_military_mobilization_strategy_desc:0 "Мир полностью изменился, и война уже не за горами. Мобилизация нашей армии имеет решающее значение для будущего нашей страны."
 BEL_increase_social_expenditures:0 "Увеличить социальные расходы"
 BEL_increase_social_expenditures_desc:0 "Мы уже достаточно тратим на армию, а ее увеличение приведет к излишней нагрузке на нашу экономику и поставит нас в трудное положение. Вместо этого мы можем установить разумный уровень расходов на благо нашего народа, что будет более полезно и внесет вклад в нашу экономику."
 BEL_resist_and_bite:0 "Сопротивляйтесь и кусайтесь!"
 BEL_resist_and_bite_desc:0 "Наша военная подготовка должна быть сложной и качественной. Наши егеря должны прославиться во всем мире."
 BEL_extensive_recruitment:0 "Широкий набор"
 BEL_extensive_recruitment_desc:0 "Нам необходимо значительно увеличить наш действующий военный потенциал, чтобы лучше поддерживать порядок на оккупированных нами территориях и лучше противостоять будущей агрессии. В противном случае нас могут застать врасплох."
 BEL_consolidate_kingdom:0 "Мир, Свобода, Справедливость и Безопасность"
 BEL_consolidate_kingdom_desc:0 "Мы достигли всех наших целей. Мы объединили свой народ под высоким уровнем благосостояния. Мы заставляем их чувствовать себя в безопасности с качественной армией. Теперь остается только принять меры к тому, чтобы это продолжалось."

 #Economic
 BEL_support_new_projects:0 "Поддержка новых проектов"
 BEL_support_new_projects_desc:0 "Чтобы развивать нашу экономику, нам необходимо предоставить государственную поддержку новым проектам и побудить людей к этому. По мере того как люди движутся в этом направлении, мы будем предпринимать решительные шаги к тому, чтобы стать более крупной экономикой."
 BEL_belgian_highways:0 "Бельгийские шоссе"
 BEL_belgian_highways_desc:0 "Строительство лучших автомагистралей и улучшение нашей инфраструктуры принесет пользу только нашей быстрорастущей промышленности."
 BEL_open_new_railways:0 "Открытие новых железных дорог"
 BEL_open_new_railways_desc:0 "Наши железные дороги не самые передовые на континенте, так что давайте изменим это, начиная с сегодняшнего дня."
 BEL_urbanization_project:0 "Урбанизация [6.GetName]"
 BEL_urbanization_project_desc:0 "Фландрия не так развита, как Валлония, но мы можем развить ее, открыть больше фабрик и создать больше рабочих мест, поэтому нам нужно начать инвестировать здесь прямо сейчас."
 BEL_urbanization_wallonia:0 "Урбанизация [34.GetName]"
 BEL_urbanization_wallonia_desc:0 "Валлония была самой загруженной и самой богатой частью нашей страны в течение многих лет. Но мы не полностью используем потенциал региона, нам нужно увеличить здесь инвестиции и поддержать урбанизацию региона."
 BEL_fund_the_rearmament:0 "Финансирование перевооружения"
 BEL_fund_the_rearmament_desc:0 "Мы не можем сидеть на месте, когда страны вокруг нас вооружаются. Нам нужно перевооружить нашу армию качественным оружием и профинансировать это за счет сокращений в других областях."
 BEL_steel_industry_in_gent:0 "Сталелитейная промышленность в Генте"
 BEL_steel_industry_in_gent_desc:0 "Наша страна испытывает нехватку подземных ресурсов, и это делает нашу экономику зависимой от иностранных ресурсов. Гент - благоприятное место для сталелитейной промышленности, и инвестиции здесь снизят зависимость нашей страны от импорта."
 BEL_expand_naval_ports:0 "Расширение военно-морских портов"
 BEL_expand_naval_ports_desc:0 "Нам необходимо модернизировать и расширять наши порты, чтобы мы могли вести более эффективную торговлю с нашими колониями и союзниками. Это увеличит объем нашей торговли и облегчит нам отправку войск в наши колонии."
 BEL_invite_the_netherlands_to_the_customs_union:0 "Приглашение Нидерландов в Таможенный союз"
 BEL_invite_the_netherlands_to_the_customs_union_desc:0 "Мы уже давно имеем договор о таможенном союзе с Люксембургом, и до сих пор это было очень выгодно для наших стран. Пригласив в это соглашение Нидерланды, мы сможем лучше поддерживать друг друга."
 BEL_agricultural_reform:0 "Аграрная реформа"
 BEL_agricultural_reform_desc:0 "Наши фермеры особенно сильно пострадали от последствий депрессии. Мы должны гарантировать, что люди, производящие нашу пищу, не будут вытеснены с рынка неконтролируемым рынком."
 BEL_planned_economy:0 "Плановая экономика"
 BEL_planned_economy_desc:0 "Планирование экономики позволит нам развиваться более эффективно. Настало время принятия годовых планов и внедрения тех из них, которые покажутся нам разумными."
 BEL_invest_in_congo:0 "Инвестиции в Конго"
 BEL_invest_in_congo_desc:0 "Чтобы эффективнее использовать природные ресурсы Конго, нужно вкладываться в них и помогать развитию региона. Их процветание – наша выгода, так что вложения критически важны."
 BEL_economic_reform:0 "Экономическая реформа"
 BEL_economic_reform_desc:0 "Наши неверные решения привели к коллапсу экономики. Нужно срочно отказаться от этой политики и быстро восстановить экономику, иначе ситуация еще больше ухудшится."
 BEL_invest_arms_production:0 "Вложение в производство вооружения"
 BEL_invest_arms_production_desc:0 "Экономика должна быть полностью нацелена на военные усилия. Последствия с этим связанные мы будем решать позже."
 BEL_wartime_production:0 "Военное производство"
 BEL_wartime_production_desc:0 "Промышленность у нас хорошая, но пока она не приспособлена к массовому выпуску оружия. Необходимо найти эффективные механизмы для перестройки, только так мы сможем использовать имеющиеся ресурсы."
 BEL_k_w_line:0 "Линия К-В"
 BEL_k_w_line_desc:0 "География нашей страны не подходит для применения современной бронетехники и авиации. Если удастся заманить врага на нашу территорию, можно будет остановить его с помощью лесистой местности и укреплений."
 BEL_eben_emael:0 "Линия Эбен-Эмаэль"
 BEL_eben_emael_desc:0 "Одним из наших самых протяженных соседей является Нидерланды. Если мы хотим пресечь атаку с их стороны, нам необходимо усилить оборону границ."
 BEL_invest_in_the_oil_industry:0 "Инвестиции в нефтяную промышленность"
 BEL_invest_in_the_oil_industry_desc:0 "Мы импортируем большую часть необходимой нам нефти. Это сильно бьет по экономике. Мы должны увеличить инвестиции в нефтяную отрасль и попытаться производить нефть самостоятельно."
 BEL_support_education:0 "Поддержка образования"
 BEL_support_education_desc:0 "Какой бы сильной промышленностью, армией и т.д. не обладала страна, без образованного населения ее могущество бесполезно. Мы должны сделать образование в нашей стране популярным."
 BEL_nuclear_research:0 "Исследование ядерной программы"
 BEL_nuclear_research_desc:0 "Ученые твердят, что мир изменится до неузнаваемости, когда расщепление атома будет наконец поставлено на вооружение. Зачем нам отставать от этого технологического чуда, которое одним ударом положит конец войне?"
 BEL_build_first_nuclear_power_plant:0 "Строительство первой АЭС"
 BEL_build_first_nuclear_power_plant_desc:0 "Строить нашу первую АЭС следует очень аккуратно, чтобы не возникло никаких проблем. Когда ее строительство будет закончено, она внесет огромный вклад в экономику и благосостояние страны и обеспечит нас электроэнергией."
 BEL_rocketry:0 "Ракетостроение"
 BEL_rocketry_desc:0 "Будущее принадлежит ракетам. Мы должны овладеть этой технологией как можно скорее."
 BEL_armed_forces:0 "Бельгийские вооруженные силы"
 BEL_armed_forces_desc:0 "У нас маленькая армия из-за численности населения, но качество важнее количества, и если мы сможем адаптировать свою армию к любой ситуации, мы можем получить армию, достаточно сильную, чтобы остановить армии из миллионов."
 BEL_normal_mobilization:0 "Обычная мобилизация"
 BEL_normal_mobilization_desc:0 "План мобилизации Эдуарда Ван ден Бергена был грандиозным и дорогостоящим. Для нас было бы очень трудно включить эти огромные военные расходы в нашу экономику, которая еще не оправилась от последствий Великой депрессии. Поэтому нам нужно продолжать делать то, что мы делали до сих пор, и мобилизоваться в обычном режиме."
 BEL_rapid_mobilization:0 "Быстрая мобилизация"
 BEL_rapid_mobilization_desc:0 "Германия явно снова что-то замышляет. Эдуард ван ден Берген, должно быть, тоже это видел, потому что он подготовил для нас очень хороший план мобилизации, чтобы мы были готовы против немцев. Мы знаем, что экономическое бремя будет тяжелым, но оно будет не хуже, чем разрушение нашей страны во время очередной войны."
 BEL_equipment_modernization:0 "Модернизация оборудования"
 BEL_equipment_modernization_desc:0 "Недавние инвестиции в наши военные усилия заставили людей с гордостью взглянуть на нашу военную историю, и теперь молодые трудоспособные мужчины толпами стекаются в добровольческие центры."
 BEL_expand_support_companies:0 "Расширение вспомогательных подразделений"
 BEL_expand_support_companies_desc:0 "В первой мировой войне наши солдаты умирали в грязи и лужах крови. Чтобы этого не произошло снова, мы должны обеспечить наших солдат необходимыми полевыми госпиталями, логистическими командами и т. д."
 BEL_order_new_cannons:0 "Заказать новые орудия"
 BEL_order_new_cannons_desc:0 "В нашей стране мало населения, а высокая огневая мощь означает низкие потери. Если мы не можем победить врага числом, мы победим его высокоразрывными снарядами."
 BEL_artillery_modernization:0 "Модернизация артиллерии"
 BEL_artillery_modernization_desc:0 "Пехота не будет работать без надлежащей артиллерийской поддержки. Обеспечение современных и высококачественных орудий позволит значительно повысить эффективность наших сил."
 BEL_invest_anti_tank_tech:0 "Инвестиции в противотанковое оружие"
 BEL_invest_anti_tank_tech_desc:0 "Наступил век танков, и нашей пехоте нужны современные средства защиты от этих стальных монстров."
 BEL_invest_aa_tech:0 "Инвестиции в противовоздушную оборону"
 BEL_invest_aa_tech_desc:0 "Если мы недостаточно сильны, чтобы производить качественный флот самолетов, мы должны по крайней мере не допускать полетов вражеских самолетов над нами."
 BEL_solve_language_problem_in_army:0 "Решить проблему с языком в армии"
 BEL_solve_language_problem_in_army_desc:0 "Если мы как можно скорее не решим проблему с языком в армии, это может привести к более серьезным проблемам в будущем, и может оказаться слишком поздно."
 BEL_focus_on_armor:0 "Сосредоточиться на бронетехнике"
 BEL_focus_on_armor_desc:0 "Наши танки устарели. Мы должны сосредоточиться на разработке новых моделей, чтобы соответствовать военным изменениям нашего времени."
 BEL_alternate_designs:0 "Альтернативные разработки"
 BEL_alternate_designs_desc:0 "Традиционные танки не очень эффективны в нашей местности, поэтому нам нужно производить бронетехнику различного типа и назначения."
 BEL_armored_cars:0 "Бронеавтомобили"
 BEL_armored_cars_desc:0 "Бронеавтомобили являются важным следующим шагом в новом мире мобильной войны."
 BEL_a_modern_army:0 "Современная армия"
 BEL_a_modern_army_desc:0 "Наша армия теперь сильна и модернизирована. Она не имеет недостатков и достаточно хороша, чтобы соперничать с гигантами мира."
 BEL_national_defense_institute:0 "Национальный институт обороны"
 BEL_national_defense_institute_desc:0 "Технологии решают всё. Создание института для исследований в области оборонных технологий позволит нам разрабатывать новые технологии. Мы должны обеспечить себе постоянное опережение противников и не отставать от них в области технологий."
 BEL_expand_the_aircraft_industry:0 "Развивать авиационную промышленность"
 BEL_expand_the_aircraft_industry_desc:0 "В грядущих войнах наши ВВС должны будут защитить небо от противников, оснащенных самым современным оборудованием. Мы должны обеспечить их не только самолетами аналогичного класса, но и достаточным их количеством."
 BEL_construct_new_air_bases:0 "Строить новые авиабазы"
 BEL_construct_new_air_bases_desc:0 "крайне важно, чтобы наши ВВС могли защитить каждый дюйм территории [ROOT.GetAdjective]."
 BEL_protecting_our_skies:0 "Защита наших небес"
 BEL_protecting_our_skies_desc:0 "У нас никогда не было возможностей как для защиты наших небес, так и для бомбардировки врага. Если дело дойдет до того, что нам придется выбирать между нанесением большего количества ударов по противнику и спасением наших соотечественников от их атак, то мы выберем спасение своих соотечественников в любой момент."
 BEL_patrol_the_seas:0 "Патрулирование морей"
 BEL_patrol_the_seas_desc:0 "Наш океан - это наш естественный барьер против вторжений, и мы должны заботиться о нем."
 BEL_expand_our_airforce:0 "Увеличение наших ВВС"
 BEL_expand_our_airforce_desc:0 "Мир изменился, и на небе открылся новый фронт. Мы должны производить новые самолеты для наших солдат, которые будут сражаться на этом фронте."
 BEL_open_new_airbases:0 "Открытие новых авиабаз"
 BEL_open_new_airbases_desc:0 "Независимо от того, насколько высококачественные самолеты у нас есть, они бесполезны, если им негде приземлиться."
 BEL_develop_ship_building_tech:0 "Развитие технологии кораблестроения"
 BEL_develop_ship_building_tech_desc:0 "Флот чрезвычайно важен для защиты страны. Строительство новых кораблей позволит нам защитить наши колонии и ресурсы."
 BEL_expansion_of_dockyards:0 "Расширение верфей"
 BEL_expansion_of_dockyards_desc:0 "Если мы хотим строить новые корабли и защищать наши колонии, мы должны сначала построить верфи, где будут строиться корабли."
 BEL_study_foreign_naval_technics:0 "Изучение зарубежных военно-морских технологий"
 BEL_study_foreign_naval_technics_desc:0 "Как Бельгия, мы сильно отстаём от своих соседей в плане развития морских технологий. Если мы обучим наших юных моряков в зарубежных странах, то сможем стать новыми хозяевами морей."
 BEL_coastal_defense:0 "Береговая оборона"
 BEL_coastal_defense_desc:0 "При наших ограниченных ресурсах мы можем претендовать на не большее, чем просто на укрепление своих берегов. Все усилия должны быть направлены на достижение этой цели."
 BEL_modern_destroyers:0 "Современные эсминцы"
 BEL_modern_destroyers_desc:0 "Эсминцы являются основой любого флота, и наш не является исключением. Наше морское могущество должно соответствовать современным стандартам."
 BEL_expand_submarine_fleet:0 "Расширение подводного флота"
 BEL_expand_submarine_fleet_desc:0 "Мы должны сосредоточить наши подводные флоты на силе, которая может истощить наших врагов, уничтожая их конвои."
 BEL_produce_more_submarines:0 "Производство большего количества подлодок"
 BEL_produce_more_submarines_desc:0 "При имеющихся у нас ресурсах невозможно производить монстров, которые будут обстреливать врага с поверхности моря, но мы можем производить волков, которые будут незаметно охотиться на наших врагов под водой."
 BEL_mine_warfare:0 "Минная война"
 BEL_mine_warfare_desc:0 "Это невыгодно — пытаться защитить всю нашу береговую линию с помощью кораблей. Устанавливая минные поля в стратегически важных местах, мы можем отпугнуть или хотя бы нанести ущерб любому вражескому флоту, пытающемуся приблизиться к нашим берегам."
 BEL_a_new_armada:0 "Новая армада"
 BEL_a_new_armada_desc:0 "Благодаря нашим последним достижениям, расходам на флот, расширению верфи и модернизированным кораблям, мы революционизировали Бельгийскую армаду, превратив ее в серьезную военно-морскую державу в Европе."
 BEL_marine_corps:0 "Корпус морской пехоты"
 BEL_marine_corps_desc:0 "Было бы чрезвычайно полезно для нашей армии создать специальное подразделение, обученное морским операциям и десантам."