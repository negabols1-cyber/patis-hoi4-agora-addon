  SIA_Songsuradet_Rebellion_decision_category:0 "Репрессии против повстанцев Сонгсурадета"
  SIA_Songsuradet_Rebellion_decision_category_desc:0 "Премьер-министр Таиланда, §YПлек Фибунсонгкхрам§!, начал репрессии в отношении тех §Rврагов народа§!, которые осмеливаются называть себя националистами.\n\nКогда 11 сентября 1938 года Фибун сменил на посту премьер-министра Пхраю Пхахона, его премьерству было оказано большое сопротивление из-за его диктаторского стиля и кумовства. Это, наряду с его ролью в подавлении восстания Боворадета, привело к трем покушениям, двум с применением стрелкового оружия и одному с помощью отравления. \n\nТаким образом, в этой чистке под руководством Плека Фибунсонгкрама будут пойманы предатели, и в Таиланде воцарится мир."
  SIA_purge_decrease:0 "Уменьшить уровень §R%10§! £tank_niche_7 §Yрепрессий против повстанцев Сонгсурадета§!"
  SIA_purge_level_small_increase:0 "Увеличить уровень §R%5§! £tank_niche_7 §Yрепрессий против повстанцев Сонгсурадета§!"
  SIA_purge_level_medium_decrease:0 "Уменьшить уровень §R%15§! £tank_niche_7 §Yрепрессий против повстанцев Сонгсурадета§!"
  SIA_purge_level_small_decrease:0 "Уменьшить уровень §R%10§! £tank_niche_7 §Yрепрессий против повстанцев Сонгсурадета§!"
