  SIA_news.1.t:0 "Королева Нагако берет на себя руководство Сиамом"
  SIA_news.1.d:0 "Дальний Восток переживает тяжелые времена. После китайского вторжения в Японскую империю в прессе циркулировали различные слухи. \n\nОдним из них было вторжение императора Хирохито в Сиам. Встретившись с различными генералами и министрами, Хирохито передал свою просьбу Пхрайи Пхахону теплым вечером и в этом месяце. Просьба была неожиданной и забавной. \n\nИмператор Хирохито хотел, чтобы его жена, королева Нагако, взошла на трон Сиама, и, несмотря на общественный резонанс, просьба была удовлетворена, чтобы избежать вреда."
  SIA.18.d:0 "В полдень новый министр иностранных дел государства Сиам во главе с королевой Нагако Тэйдзиро Тоёда нанес дипломатический визит в Вашингтон. \n\nНа данной встрече были обсуждены положение нового мира и внутренние, а порой и внешние проблемы стран, а также налажены экономические контакты с Соединенными Штатами Америки."
  Prime_Minister_Konoe:0 "Премьер-министр §LFумимаро Коноэ§!"
  Minister_Of_Army_Konoe:0 "Министр армии §LХидэки Тоджо§!"
  Foreign_Affair_Konoe:0 "Министр иностранных дел §LTэйдзиро Тоёда§!"
  Home_Affair_Konoe:0 "Министр внутренних дел §LХарумити Танабэ§!"
  #SIAM EVENTS
  SIA.1.A:0 "Приветствуем наших друзей"
  SIA.1.d:0 ""
  SIA.1.B:0 "Отказать"
  SIA.2.A:0 "Возможно, это будет полезно"
  SIA.2.B:0 "Отклонить запрос"
  SIA.2.d:0 "Ранее в консульстве Бангкок-Берлин произошли волнения. Королевство Таиланд, которое недавно определило свою политическую линию в Азии как прокитайскую, желает присоединиться к соглашению Китая и Германии."
  SIA.3.d:0 "Правительство Сиама просит экономическую помощь, несмотря на растущую опасность со стороны Японской империи после прихода к власти императора Хирохито в 1926 году. Взамен в будущем не будет агрессивного отношения к британским колониям в Центральной Азии и Азии. На наш взгляд, это очень разумное соглашение, ждем вашего ответа."
  SIA.3.A:0 "Стоит сделки, приемлемо"
  SIA.3.B:0 "Отказать"
  SIA.12.d:0 "Культурные мандаты или государственные указы - это серия из двенадцати указов, изданных в период между 1939 и 1942 годами правительством фельдмаршала Плека Пибулсонграма во время его первого срока в качестве премьер-министра и военного диктатора Таиланда.\n\n Целью мандатов было создание единой и цивилизованной тайской культуры в то время, когда страна была союзником держав Оси. Многие из нововведений, принятых в мандатах, были результатом вступления Таиланда во Вторую мировую войну и продолжают действовать по сей день."

  SIA.13.d:0 "Песня Phleng chat (Национальный гимн Таиланда) - это название национального гимна Таиланда, принятого в его нынешней форме 10 декабря 1939 года. В 1932 году он заменил песню Sansoen Phra Barami, которая остается королевским гимном Таиланда.\n\n Мелодию сочинил Пра Чендуриянг (Питер Фейт), а слова написал Луанг Саранупрафан. Phleng chat буквально означает национальный гимн, это общее название национального гимна. Этот термин также используется для обозначения этой конкретной песни."

  SIA.16.t:0 "Король Сиама в Швейцарии Рама VII"
  SIA.16.d:0 "Король Сиама Рама VII (Анан Махидон) жил в Швейцарии по образовательным и разным другим причинам. Но интерес к королю в его стране возрастал, люди призывали короля вернуться в страну."

  SIA.18.d:0 " "
