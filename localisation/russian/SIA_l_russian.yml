  SIA_Military_Investments_dec:0 "Военные инвестиции"
  SIA_Hakko_Ichiu_dec_cat_desc:0 "§LHakkō Ichiu§! означал объединение всех уголков мира под властью одного правителя или создание единой семьи для всего мира. Это был идеал, лежавший в основе создания империи, и, в традиционном понимании, он означал лишь всеобщий принцип человечности, которому было суждено в конечном итоге распространиться на всю вселенную. Путь к реализации hakkō ichiu лежал через благое правление §REмператора§!, и §Rследовательно, путь Императора, Императорский или Королевский путь, был концепцией добродетели и максимой поведения§!. Hakkō ichiu была моральной целью, а преданность Императору была дорогой, ведущей к ней.\n\nВ последующие годы меры военной агрессии пропагандировались во имя §LHakkō Ichiu§!, которые в конечном итоге стали символами мирового господства с помощью военной силы."
  #FLAGS
