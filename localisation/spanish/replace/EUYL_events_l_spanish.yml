l_spanish:

 argentina.1.t:0 "¿Qué ciudad deberíamos convertir en Capital?"
 argentina.1.d:0 "Con nuestra reciente conquista de la crucial ciudad de Buenos Aires, surge un dilema. ¿Debemos hacer de Buenos Aires la capital, o debemos mantener a Paraná como la capital? Ambas ciudades tienen significados históricos para la Confederación Argentina. \n\n Paraná fue la capital de la Confederación original después de la secesión de Buenos Aires, y Buenos Aires fue y ha sido la capital tanto de la Confederación como de todos los gobiernos argentinos que tomaron el poder. \n\n ¿Qué ciudad nombraríamos capital? de la Confederación Argentina?"
 argentina.1.a:0 "Hacer de Buenos Aires la capital"
 argentina.1.b:0 "Mantener Paraná la Capital"
 news.360.t:0 "Se constituye una vez más la Confederación Argentina"
 news.360.d:0 "\n Después de que comenzaron a surgir sentimientos nacionalistas en Argentina, muchas personas empezaron a creer una vez más en la Confederación como una gracia salvadora, que permitirá al país avanzar y establecerse como una potencia regional. \n\n Después de una brutal guerra civil en la que la Confederación salió victoriosa, uno se pregunta qué van a hacer ahora. \n\n Solo el tiempo dirá lo que causará la resurrección de un estado una vez abolido en este planeta."
 news.360.a:0 "Espera, ¿hay más de una Confederación en las Américas?"
 news.360.b:0 "¡El mundo conocerá ahora nuestra verdadera fuerza!"
 argentina.2.t:0 "¡Argentina acaba de anexar a Uruguay!"
 argentina.2.d:0 "Uruguay siempre ha sido un área de interés clave. Dejarlo ir así es algo que no se puede hacer. \n\n Desde el fin de la guerra cisplatina y el Reino Unido nos hizo soltar nuestros territorios en Uruguay, siempre ha actuado como casi un territorio tampón, donde ningún país puede ni debe tocarlo. Esa propuesta fue respetada hasta el día de hoy, donde llegó la noticia de que Argentina anexó Uruguay. \n\n Los argentinos lo harán No espere un ataque de nosotros en este momento, así que cuanto antes crucemos la frontera, mejor. Tomarlos con la guardia baja será clave para que esta operación funcione. \n\n Entonces, ¿qué debemos hacer, debemos intervenir e intervenir? ¿O deberíamos contenernos y dejarles tener Uruguay?"
 argentina.2.a:0 "¡Interven, se firmó un tratado y se respetará un tratado!"
 argentina.2.b:0 "Quizás es mejor que se lo dejemos a ellos"
 argentina.3.t:0 "¡Brasil nos ha declarado la guerra!"
 argentina.3.d:0 "Luego de nuestra anexión de Uruguay, el gobierno brasileño ha decidido responder declarándonos la guerra. \n\n Hace apenas unas horas llegaron informes de que soldados brasileños cruzaron la frontera cerca de la provincia de Misiones . \n\n Cualquiera que sea su resonancia para declararnos la guerra no tiene absolutamente ningún valor en el escenario internacional, y estarán solos en este conflicto, como debería ser "
 argentina.3.a:0 "¡Si estos malditos brasileños quieren una guerra, la conseguirán!"
 news.738.t:0 "La Segunda Guerra Cisplatina"
 news.738.d:0 "Después de la inesperada anexión de Uruguay por parte del gobierno argentino, el gobierno brasileño ha decidido responder invadiéndolos, alegando que estaba mal simplemente anexar Uruguay como lo hicieron los argentinos. \n\n Escaramuzas ya están sucediendo en toda la frontera y muchos están preocupados de que esta guerra se convierta en un baño de sangre, con ambos lados igualmente ansiosos por luchar contra el otro. \n\n Solo el tiempo dirá cómo evolucionará este conflicto, sin embargo, la situación parece bastante lúgubre."
 news.738.a:0 "¿Qué diablos está pasando en ese continente?"
 news.738.c:0 "¡Les mostraremos a estos argentinos que no se mete con la soberanía de los demás!"
 news.738.b:0 "Estos traficantes de guerra se presentaron con guerra, y les vamos a dar guerra!"
 argentina.4.t:0 "Hemos hecho todo el daño necesario hacia Brasil"
 argentina.4.d:0 "Con las bajas acumuladas en el lado brasileño y muchas de sus ciudades y el territorio del sur ocupados, parece poco probable que los brasileños quieran continuar esta guerra. \n\n ¿Deberíamos hacer las paces con ellos, aprovechar la situación y reclamar Santa Catarina, o simplemente continuar la guerra? "
 argentina.4.a:0 "Haz las paces con los brasileños"
 argentina.4.b:0 "Hacer las paces y exigir Rio Grande Sul"
 argentina.4.c:0 "Sigue adelante"
 argentina.5.t:0 "Argentina quiere tener conversaciones de paz"
 argentina.5.d:0 "Hoy han llegado diplomáticos argentinos para discutir sobre las conversaciones de paz. \n\n Esta guerra ha ejercido una gran presión sobre nuestros recursos, mano de obra e industria. \n\n Hasta ahora no ha salido nada bueno de este conflicto. \n\n Considerando nuestra situación actual, ¿qué elección debemos hacer? "
 argentina.5.a:0 "Acepta la propuesta de paz"
 argentina.5.b:0 "¡Luchamos por una causa! ¡Continúe la guerra!"
 argentina.5.c:0 "Aceptar paz y tomar Misiones"
 argentina.6.t:0 "Argentina exige Rio Grande Sul y Paz"
 argentina.6.d:0 "Hoy llegaron diplomáticos argentinos, exigiendo conversaciones de paz y nuestro estado de Rio Grande Sul. \n\n Esta guerra ha ejercido una gran presión sobre nuestros recursos, mano de obra e industria. \n\n Entonces Hasta ahora, nada bueno ha salido de este conflicto. \n\n Considerando nuestra situación actual, ¿qué elección debemos hacer? "
 argentina.6.a:0 "Ceder a sus demandas"
 argentina.6.b:0 "¿Quiénes se creen estos argentinos? ¡Continúe la guerra!"
 argentina.7.t:0 "Brasil acepta nuestra propuesta"
 argentina.7.d:0 "Brasil ha aceptado nuestra propuesta y ya no habrá conflicto armado entre nuestras dos naciones."
 argentina.7.a:0 "¡Genial! ¡Los brasileños hicieron la elección correcta!"
 argentina.8.t:0 "Brasil rechaza nuestra propuesta"
 argentina.8.d:0 "Brasil acaba de volver con nosotros diciendo que rechazan nuestra propuesta. \n\n Quedará un estado de conflicto armado entre nuestras naciones."
 argentina.8.a:0 "¿No les importa el bienestar de su país?"
 argentina.9.t:0 "Los argentinos reclaman las Malvinas"
 argentina.9.d:0 "Diplomáticos argentinos llegaron hoy a Londres para decirnos que exigen que les cedamos las Islas Malvinas. \n\n ¿Les damos las Malvinas o nos negamos?"
 argentina.9.a:0 "Que se lo queden, perder algunas islas no hará ningún daño"
 argentina.9.b:0 "¿Realmente creen estos Argies que les vamos a dar siquiera una pulgada de nuestra tierra?"
 argentina.10.t:0 "La cueva británica a nuestra demanda"
 argentina.10.d:0 "Los británicos han respondido a nuestros diplomáticos, diciendo que aceptan nuestras demandas y cederán el territorio"
 argentina.10.a:0 "¡Genial! Quizás los británicos no sean tan malos después de todo"
 argentina.11.t:0 "Los británicos rechazan nuestras demandas"
 argentina.11.d:0 "Los británicos han respondido a nuestros diplomáticos, diciendo que no aceptan nuestras demandas y no nos darán el territorio"
 argentina.11.a:0 "¡Estos malditos piratas verán nuestras fuerzas!"
 argentina.12.t:0 "Los argentinos están exigiendo a Georgia del Sur"
 argentina.12.d:0 "Diplomáticos argentinos han llegado hoy a Londres, exigiendo que cedamos el territorio de Georgia del Sur. \n\n ¿Les damos Georgia del Sur o nos negamos?"
 argentina.12.a:0 "Que lo tengan, ya casi nadie vive allí"
 argentina.12.b:0 "¡Absolutamente no! ¡No les damos nada a estos Argentinos!"
 argentina.13.t:0 "¡Argentina exige a Tarija!"
 argentina.13.d:0 "Argentina exige que les cedamos la provincia de Tarija, un territorio que tenemos. \n\n Sin embargo, no tenemos el ejército para hacerles frente, así que tal vez la mejor opción sería ceder. ¿Qué debemos hacer? "
 argentina.13.a:0 "Dales Tarija"
 argentina.13.b:0 "¡Si es necesario, lucharemos por nuestra tierra!"
 argentina.14.t:0 "[From.GetName] se rinde a nuestras demandas"
 argentina.14.d:0 "El Gobierno de [From.GetName] acaba de responder a nuestras demandas, diciendo que nos cederán el territorio de Tarija"
 argentina.14.a:0 "Ellos eligieron el camino fácil"
 argentina.15.t:0 "¡[From.GetName] se nego a darnos Tarija!"
 argentina.15.d:0 "El Gobierno de [From.GetName] ha respondido a nuestras demandas, diciendo que no nos entregarán el territorio de Tarija. Afirma que si tienen que luchar por el territorio, ¡hasta el último soldado! "
 argentina.15.a:0 "¡Oh, verán nuestro poderío!"
 argentina.16.t:0 "Argentina exige que les demos Santa Catarina!"
 argentina.16.d:0 "Argentina exige que les entreguemos Santa Catarina, un territorio que tenemos y que los Argentinos reclaman que lo tenian. Sin embargo, ya no lo poseen, y nosotros somos dueños de ese territorio durante muchas décadas. ahora y la gente allí es más brasileña que argentina. \n\n ¿Debemos ceder o negarnos? "
 argentina.16.a:0 "Necesitamos mantener la Paz, aunque sea a costa de nuestro territorio"
 argentina.16.b:0 "¿De verdad creen que cederemos tan fácilmente?"
 argentina.17.t:0 "[From.GetName] entrega Santa Catarina"
 argentina.17.d:0 "El gobierno de [From.GetName] ha llegado con la resolución pacífica de entregarnos el estado de Santa Catarina. Con este nuevo territorio estamos un paso más cerca de lograr nuestro objetivo final"
 argentina.17.a:0 "Me alegro de que pudiéramos tener una resolución pacífica con los brasileños"
 argentina.18.t:0 "[From.GetName] se niega a darnos Santa Catarina"
 argentina.18.d:0 "El gobierno de [From.GetName] ha respondido a nuestras demandas, afirmando con firmeza que Santa Catarina es su territorio y que no nos entregará el territorio"
 argentina.18.a:0 "Estos malditos brasileños"
 news.339.t:0 "Nace la Gran Confederación Argentina"
 news.339.d:0 "Luego de varias conquistas contra sus vecinos, quitándoles territorio y provocando mucha tensión en Sudamérica, la Confederación Argentina ha anunciado que ahora se llamarán la 'Gran Confederación Argentina'. \n\n La nación parece ser mucho más fuerte de lo que otros han anticipado anteriormente, y siendo una potencia fascista, tal vez incluso podría cambiar el rumbo de la guerra en Europa "
 news.339.a:0 "¿Genial para ellos, supongo?"
 news.339.b:0 "¡Ahora el mundo verá verdaderamente nuestro poder!"
 news.339.c:0 "¡Pagarán por lo que han hecho!"
 argentina.19.t:0 "Argentina quiere unirse a nuestra facción"
 argentina.19.d:0 "Argentina solicita unirse a nuestra facción. No solo tenemos un enemigo común, sino que sus creencias también se correlacionan con nuestras creencias. \n\n ¿Deberíamos dejarlos entrar?"
 argentina.19.a:0 "¡Por supuesto, déjalos entrar!"
 argentina.19.b:0 "No son lo suficientemente confiables"
 argentina.20.t:0 "Alemania ha aceptado nuestra solicitud para unirse al Eje"
 argentina.20.d:0 "Los diplomáticos alemanes han respondido positivamente a nuestra solicitud de unirse al Eje, y ahora estaremos en su facción"
 argentina.20.a:0 "¡Genial, ahora es el momento de enfocarnos en nuestro enemigo común!"
 argentina.21.t:0 "Alemania ha rechazado nuestra solicitud para unirse al Eje"
 argentina.21.d:0 "Los diplomáticos alemanes han respondido a nuestra solicitud de unirse al Eje. Nos dijeron que no están dispuestos a aceptarnos en nuestra facción"
 argentina.21.a:0 "¡Entonces morirán solos!"
 argentina.22.t:0 "Las elecciones de 1937"
 argentina.22.d:0 "Las elecciones están aquí, después de 6 años de Agustín Pedro Justo ahora tenemos que elegir un nuevo líder para liderar Argentina. \n\n Hay 2 partidos principales que se destacan en Argentina en estas elecciones, la Concordancia, que es el partido de Justo, y la Unión Cívica Radical, que representa los ideales democráticos y un nuevo camino para las naciones. \n\n Ambos partidos en algún momento conducirán a diferentes futuros para la nación, sin embargo una opción será mejor que el otro. \n\n ¿Quién gana las elecciones? "
 argentina.22.a:0 "Concordancia"
 argentina.22.b:0 "Union Civica Radical"
 argentina.23.t:0 "Argentina propone una alianza económica entre nuestras naciones"
 argentina.23.d:0 "Los diplomáticos argentinos han llegado hoy a Madrid no solo para felicitarnos por nuestra reciente victoria en la guerra civil, sino también para proponer una economía entre nuestra nación. \n\n Los diplomáticos nos han dicho que La cooperación de nuestras economías ayudará a ambos países por igual, aparentemente sin inconvenientes. No solo eso, sino que la cooperación económica también nos permitirá estrechar lazos con Argentina, y puede ser muy útil tener un aliado sudamericano. \n\n ¿Aceptamos su propuesta de cooperación económica? "
 argentina.23.a:0 "Por supuesto, ¿por qué no lo haríamos nosotros?"
 argentina.23.b:0 "No necesitamos ningún 'pacto' de esos argentinos"
 argentina.24.t:0 "España acepta nuestra cooperación económica"
 argentina.24.d:0 "Los diplomáticos españoles han respondido a nuestros diplomáticos, diciendo que están dispuestos a continuar con esta alianza económica y brindar los bienes o servicios necesarios para que funcione"
 argentina.24.a:0 "¡Genial! Que nuestras dos economías se beneficien de este pacto"
 argentina.25.t:0 "España rechaza nuestra cooperación económica"
 argentina.25.d:0 "Los diplomáticos españoles han respondido a nuestros diplomáticos diciendo que no aceptarán nuestra propuesta de alianza económica".
 argentina.25.a:0 "Vergonzoso"
 argentina.26.t:0 "Roberto deja el poder"
 argentina.26.d:0 "El presidente ha anunciado hoy que ya no podrá liderar la nación. Su diabetes ha avanzado tanto hasta el punto en que apenas puede ver, que un largo con otras condiciones de salud deterioradas hace que Roberto incapaz de dirigir la nación. Por ahora, necesitaremos que el vicepresidente dirija la nación "
 argentina.26.a:0 "¿Qué le depara el futuro a esta nación?"
 argentina.27.t:0 "Argentina busca unirse a los aliados"
 argentina.27.d:0 "Diplomáticos argentinos llegaron hoy a Londres para discutir si su nación puede unirse o no a nuestra alianza. \n\nAhora siendo un estado democrático, tener un aliado en Sudamérica no sería tan malo . \n\n¿Deberíamos dejarlos entrar? "
 argentina.27.a:0 "Aceptar"
 argentina.27.b:0 "Rechazar"
 argentina.28.t:0 "Gran Bretaña nos permitirá entrar en los aliados"
 argentina.28.d:0 "Los británicos han respondido a nuestros diplomáticos, diciendo que estarán más que dispuestos a permitirnos entrar en los Aliados"
 argentina.28.a:0 "¡Genial!"
 argentina.29.t:0 "Gran Bretaña se ha negado a permitirnos entrar en los aliados"
 argentina.29.d:0 "Los británicos han respondido a los diplomáticos que les enviamos, diciendo que no nos permitirán entrar en su facción".
 argentina.29.a:0 "Supongo que ahora vamos solos"
 argentina.30.t:0 "Argentina propone una alianza militar"
 argentina.30.d:0 "Argentina acaba de contactarnos con una propuesta bastante repentina, una alianza militar. \n\nAunque tenemos vínculos muy estrechos con el occidente europeo, sería bueno tener otro aliado de corte liberal para trabajar juntos. \n\n¿Deberíamos aceptar su propuesta? "
 argentina.31.t:0 "Los estadounidenses han aceptado nuestra propuesta"
 argentina.31.d:0 "Los estadounidenses han respondido, diciendo que están dispuestos a hacer una alianza militar entre nuestras 2 naciones"
 argentina.31.a:0 "¡Genial!"
 argentina.32.t:0 "Los estadounidenses han rechazado nuestra propuesta"
 argentina.32.d:0 "Los estadounidenses han rechazado nuestra propuesta de hacer una alianza, considerándola 'sin sentido'"
 argentina.32.a:0 "Estos malditos estadounidenses"
 argentina.33.t:0 "Los argentinos quieren un Pacto de paz entre nuestros paises"
 argentina.33.d:0 "Los agrentinos se han acercado a nosotros con un pedido bastante simple, la firma de un pacto de no agresión. Han acordado que tanto ellos como sus aliados estarán dispuestos a promulgar el pacto con nosotros debido a nuestros enemigos comunes. ¿Deberíamos aceptar? "
 argentina.33.a:0 "Por supuesto"
 argentina.33.b:0 "No necesitamos ninguno de sus 'pactos'"
 argentina.34.t:0 "Los alemanes han aceptado nuestra propuesta"
 argentina.34.d:0 "Los alemanes nos han vuelto diciendo que están de acuerdo en firmar el pacto"
 argentina.35.t:0 "Los alemanes han rechazado nuestra propuesta"
 argentina.35.d:0 "Los alemanes han vuelto a nosotros, diciendo que no firmarán un pacto con nosotros".
 argentina.35.a:0 "Están tramando algo"
 argentina.36.t:0 "Argentina pide las Malvinas"
 argentina.36.d:0 "Hoy han llegado diplomáticos argentinos para discutir sobre el tema Malvinas. Ahora que ambos países están en buenas relaciones y están en los aliados, creen que sería justo que tuvieran control sobre las islas. Incluso dicen que están dispuestos a ayudarnos en el futuro en compensación por haberles dado las islas. ¿Deberíamos dejarles tener las islas? "
 argentina.36.a:0 "Claro, pueden tenerlos"
 argentina.36.b:0 "No, son Nuestras Islas"
 argentina.37.t:0 "Los británicos nos permiten tener las Malvinas"
 argentina.37.d:0 "Los británicos nos han permitido tomar el control de las Malvinas con la simple solicitud de cuidar de la población británica original"
 argentina.37.a:0 "Genial, nos aseguraremos de cuidarlos bien"
 argentina.38.t:0 "Los británicos no nos permitirán controlar las Malvinas"
 argentina.38.d:0 "Los británicos han respondido a nuestros diplomáticos, diciendo que no nos permitirán tomar el control de las islas"
 argentina.38.a:0 "Estos malditos británicos ..."
 argentina.39.t:0 "Argentina pide Georgia del Sur"
 argentina.39.d:0 "Hoy llegaron diplomáticos argentinos para discutir sobre el tema de las Georgia del Sur. Ahora que ambos países están en buenas relaciones y están en los aliados, creen que sería justo que tuvieran el control sobre la isla. Incluso dicen que están dispuestos a ayudarnos en el futuro en compensación por haberles dado las islas. ¿Deberíamos dejarles tener la isla? "
 argentina.40.t:0 "Los británicos nos permiten tener Georgia del Sur"
 argentina.40.d:0 "Los británicos nos han permitido tomar el control de las Georgia del Sur con la simple solicitud de cuidar a la población británica original"
 argentina.41.t:0 "Los británicos no nos permitirán controlar Georgia del Sur"
 argentina.42.t:0 "Argentina esta demandando el control de la islas Acensión y Santa Elena"
 argentina.42.d:0 "El gobierno argentino se ha puesto en contacto con nosotros recientemente para preguntarnos si podrían tener control sobre la isla Acensión y Santa Helena. \n\nEsto les permitirá tener control sobre todo el Mar Atlántico Sur, así que deberíamos permitirles poseer tal territorio? "
 argentina.43.t:0 "Gran Bretaña nos ha permitido ocupar la isla Acension y Santa Helena"
 argentina.43.d:0 "Los británicos nos han respondido diciendo que nos permitirán tener el control de las islas y un control total sobre el Atlántico Sur"
 argentina.44.t:0 "Gran Bretaña no nos permitirá tener control sobre la isla Acension y Santa Helena"
 argentina.44.d:0 "Los británicos han respondido a nuestra solicitud, diciendo que no nos permitirán tener control sobre las islas"
 argentina.45.t:0 "Perón viaja a Italia"
 argentina.45.d:0 "Perón ha abandonado el país y se dirige a Italia después de que el Ministerio de Guerra se lo haya asignado. \n\n Tiene la tarea de aprender sobre las tácticas de guerra italianas y aprender sobre la guerra de montaña en Italia. Alpes. Está planeando quedarse al menos 2 años antes de viajar de regreso a Argentina. \n\n Solo el tiempo dirá si también regresa con los ideales fascistas italianos, y por ahora simplemente debemos esperar "
 argentina.45.a:0 "Buena suerte, Perón"
 argentina.46.t:0 "Perón ha regresado a Argentina"
 argentina.d.46:0 "Tras permanecer un tiempo en el extranjero, Perón ha regresado a Argentina con nuevos conocimientos sobre tácticas de guerra, pero también sobre ideales políticos y relaciones exteriores". \n\nCon los nuevos conocimientos, experiencias y conexiones, está claro que Perón intentará ascender dentro de la nación."
 argentina.46.a:0 "Bienvenido de nuevo, Perón"
 argentina.47.t:0 "El Gran Golpe de Estado"
 argentina.47.d:0 "Después de meses de cuidadosa planificación y análisis, las facciones de los militares finalmente se cansaron del actual gobierno y tomaron las costumbres en sus propias manos. \n\n El actual presidente y sus colegas han sido expulsados de la Casa Rosada hoy, y los generales militares han decidido por unanimidad colocar a Perón en el poder. \n\n Este repentino cambio de poder resultará bastante difícil para Perón al principio, sin embargo, parece prometedor "
 argentina.47.a:0 "Que Dios nos guíe"
 argentina.48.t:0 "El escándalo del Hospital Militar"
 argentina.48.d:0 "Casi medio año después de la inauguración del Hospital Militar de Palomar, el senador Benjamín Villafañe ha presentado una demanda contra nosotros y los militares por este mismo hospital. \n\nEl motivo de la demanda fue por la venta de terrenos para el Hospital Militar. Los terrenos se vendieron a un precio mucho mayor de lo que realmente eran. El senador afirma que el resto del dinero que queda por pagar se va a distribuir entre diputados y empleados, también como funcionarios del Ministerio de Guerra. \n\nTodo lo que podemos hacer ahora es esperar a que los senadores de la asamblea legislativa voten si somos inocentes o no y si tenemos que devolver el dinero "
 argentina.48.a:0 "Esperemos que la Asamblea Legislativa se dé cuenta de que somos inocentes"
 argentina.49.t:0 "La Asamblea Legislativa acordó por unanimidad que somos inocentes"
 argentina.49.d:0 "Los senadores han votado y los resultados están a la vista. Una abrumadora mayoría de los senadores han votado que tanto Roberto como el gobierno son inocentes y no tienen la obligación de devolver dinero. De hecho, 170 votos estaban a favor de nuestra inocencia, mientras que solo uno estaba en contra de nuestra inocencia "
 argentina.49.a:0 "Parece que los senadores tienen nuestras espaldas"
 argentina.50.t:0 "La Asamblea Legislativa ha votado que debemos pagar la Deuda"
 argentina.50.d:0 "Los senadores han votado y los resultados están a la vista. Un poco más de la mitad de los senadores han votado que de hecho somos culpables de tales actos y que debemos pagar la deuda. Es bastante triste que los senadores no pueden ver el hecho de que somos inocentes, pero debemos cumplir "
 argentina.50.a:0 "No podemos confiar en nadie"
 argentina.51.t:0 "El Ejército no está Contento con la Administración de [Root.GetLeader]"
 argentina.51.d:0 "A varios sectores de las fuerzas armadas no les gusto la administración de [Root.GetLeader], y varias partes del ejército han comenzado a conspirar contra el gobierno, con la esperanza de derrocarlo. \n\nYa comenzaron los planes y se desconoce si cuáles son sus intenciones finales. Todo lo que sabemos es que si este 'golpe' no se resuelve de inmediato, entonces estamos en serios problemas "
 argentina.51.a:0 "¡QUÉ! ¡Estos malditos cabrones!"
 argentina.52.t:0 "Los militares han ejecutado su complot"
 argentina.52.d:0 "Los militares han ejecutado su tan esperado complot. Después de meses de cuidadosa planificación, parece que se ha desatado el infierno. \n\nSólo el tiempo dirá cuál será el futuro de este país, sin embargo, el futuro parece bastante oscuro."
 argentina.52.a:0 "Que Dios nos salve de este infierno"
 argentina.53.t:0 "¿Qué debemos hacer con las Milicias?"
 argentina.53.d:0 "Con la guerra civil fuera del camino, todavía tenemos el problema de qué hacer con las milicias restantes. \n\nA la mano, podemos mantenerlos en el ejército y tal vez incluso entrenarlos para ser aún mejores, y por otro lado podemos disolverlos y mantener tanto la mano de obra que se utilizó para esas milicias como el equipo que adquirieron. \n\n¿Qué debemos hacer? "
 argentina.53.a:0 "Guárdalos"
 argentina.53.b:0 "Disolverlos y almacenar el equipo y la mano de obra"
 argentina.54.t:0 "Ramírez se ve obligado a dimitir del poder"
 argentina.54.d:0 "Después de las crecientes tensiones en el mundo, las tensiones también aumentaron entre bastidores. Después de cortar todos los lazos con los japoneses y los alemanes, muchos partidarios del golpe original ya no ven a Ramírez apto para liderar la nación, y han decidido expulsarlo. \n\n¿La persona que llevó a estos hombres a Ous Ramirez? Edelmiro Julian Farrell, uno de los principales contribuyentes del complot militar que se llevó a cabo hace aproximadamente un año. \n\nEste repentino cambio de poder podría atrapar mucha gente por sobrevenir e incluso podría causar confusión en el país, así que esperamos que eso no ocurra "
 argentina.54.a:0 "¡Qué diablos está pasando!"
 argentina.55.t:0 "Situación Argentina en 1939"
 argentina.55.d:0 "Roberto ha demostrado ser un líder competente a partir de ahora, sin embargo, su estado de salud se está deteriorando a un ritmo acelerado desde que fue elegido. Los médicos no saben cuánto tiempo más durará, y estimaciones aproximadas sugieren que se verá obligado a retirarse alrededor de 1942. \n\nAl igual que con la situación de Perón, actualmente se encuentra en Italia estudiando guerra de montaña. Sin embargo, tenga cuidado con su llegada, ya que su política comenzará a cambiar cuando llegue "
 argentina.55.a:0 "Entendido"
 argentina.56.t:0 "Argentina está manipulando nuestra política"
 argentina.56.d:0 "Diplomáticos de la Confederación Argentina han llegado hoy a Montevideo para discutir los planes con nuestro partido fascista. \n\nPor lo que parece, no parece bueno en absoluto, e incluso podría resultar devastador si lo permitimos. Sin embargo, contra todo pronóstico, algunos de los nuestros apoyan esto e incluso abogan por la anexión. \n\nLo que sea que hayan hecho los argentinos, tenemos que responder a ello y rápido, ¿qué debemos hacer?"
 argentina.56.a:0 "Déjalos, no debería perjudicarnos en el futuro"
 argentina.56.b:0 "¡¿Quiénes se creen que son estos argentinos?!"
 argentina.57.t:0 "Los uruguayos nos han permitido influir en su política"
 argentina.57.d:0 "Hoy llegó una declaración oficial de Uruguay, diciendo que permitirán la manipulación de su política siempre y cuando no perjudique al pueblo".
 argentina.57.a:0 "Genial, nuestro plan puede comenzar"
 argentina.58.t:0 "Los uruguayos nos han Fallado"
 argentina.58.d:0 "Los uruguayos han hecho todo mal. No hicieron lo que teniamos planeado y al parecer no vamos a poder annexarlos de la manera facil que pensabamos. Siempre hay que hacer cosas de la manera dificil."
 argentina.58.a:0 "Supongo que tendremos que hacerlo por las malas"
 argentina.59.t:0 "¡Argentina le ha declarado la guerra a Uruguay!"
 argentina.59.d:0 "Acabamos de recibir la noticia de que tropas argentinas han cruzado la frontera con Uruguay, con lo que parece ser una intención de anexión. \n\nLa última vez que Argentina intentó algo parecido a esto, intervenimos y defendimos a Uruguay de una anexión argentina, y esta situación parece demasiado familiar. \n\n¿Debemos ayudar a nuestros hermanos uruguayos y derrotar a los argentinos?"
 argentina.59.a:0 "¡Absolutamente, no derramamos sangre en la guerra anterior sin motivo!"
 argentina.59.b:0 "Lo siento Uruguay, pero no podemos ayudarlos esta vez"
 argentina.60.t:0 "¡Brasil nos ayudará en la guerra!"
 argentina.60.d:0 "Diplomáticos brasileños han llegado hoy a Montevideo, prometiendo su ayuda y apoyo total durante la guerra. Enviarán tropas y equipos para combatir a los argentinos".
 argentina.60.a:0 "¡Gracias Brasil! ¡Por la victoria!"
 argentina.61.t:0 "¡Brasil ayudará a Uruguay en este conflicto!"
 argentina.61.d:0 "Muchos de nuestros soldados en el frente han reportado que las tropas brasileñas se han movilizado en el frente uruguayo e incluso han disparado a nuestros soldados, señalando sólo una posibilidad: Brasil está ayudando a Uruguay. \n\nLa situación parece sombría para nosotros, pero una victoria es todavía posible".
 argentina.61.a:0 "¡Estos malditos brasileños tendrán la lucha que quieren!"
 argentina.62.t:0 "Nuevo Discord y Patreon"
 argentina.62.d:0 "Hola, espero que estén teniendo un día increíble. Siento interrumpir su sesión de HOI4, pero si por favor leen esto muy rápido significaría el mundo para mí. \n\nAhora hay una discord disponible para el mod donde todos pueden unirse y charlar sobre el mod, hablar conmigo, reportar errores, sugerir nuevas cosas, etc, etc. El enlace estará cerca de la parte superior de la descripción del mod en el workshop de steam. Entra y únete a la diversión, estaré esperando tu mensaje de unión. \n\nPor otra parte, ahora tengo un patreon, así que si quieres donar y ayudarme en la creación del mod, puedes hacerlo. El enlace estará justo debajo del enlace de la discord y al final de la descripción del mod. Cualquier cantidad me ayudará enormemente, y estaré siempre agradecido por su amabilidad."
 argentina.62.a:0 "Entendido"
 chile.18.t:0 "Nuevo Discord y Patreon"
 chile.18.d:0 "Hola, espero que estén teniendo un día increíble. Siento interrumpir su sesión de HOI4, pero si por favor leen esto muy rápido significaría el mundo para mí. \n\nAhora hay una discord disponible para el mod donde todo el mundo puede unirse y charlar sobre el mod, hablar conmigo, informar de errores, sugerir nuevas cosas, etc, etc. El enlace estará cerca de la parte superior de la descripción del mod en el workshop de steam. Entra y únete a la diversión, estaré esperando tu mensaje de unión. \n\nPor otra parte, ahora tengo un patreon, así que si quieres donar y ayudarme en la creación del mod, puedes hacerlo. El enlace estará justo debajo del enlace de la discord y al final de la descripción del mod. Cualquier cantidad me ayudará enormemente, y estaré siempre agradecido por su amabilidad."
 chile.18.a:0 "Entendido"
 news.340.t:0 "Rebelión Anarquista en Chile"
 news.340.d:0 "Tras meses de inestabilidad política y protestas masivas, el pueblo de Chile se ha levantado hoy para luchar por sus ideales. \n\nLos anarquistas no quieren nada más que la falta de gobierno o de poder unificado, un estado dirigido sólo por el pueblo. Muchos países ya están preocupados por los anarquistas, ahora que hay 2 levantamientos en 2 partes separadas del mundo. \n\nSólo el tiempo dirá lo que pasará, pero no podemos permitir que el anarquismo gobierne el planeta".
 news.340.a:0 "Genial, justo lo que necesitábamos..."
 news.340.b:0 "¡Ahora es nuestro momento de brillar!"
 news.340.c:0 "QUE????????"
 argentina.63.t:0 "Submarinos Alemanes varados en la orilla"
 argentina.63.d:0 "Hoy, muchos residentes de Mar del Plata han informado de dos submarinos alemanes que se encuentran en la costa después de su pérdida en la Segunda Guerra Mundial. \n\nSe especula sobre cómo llegaron aquí, qué pasó con los miembros de la tripulación y cuál fue su tarea al estar tan cerca de Sudamérica. \n\nSus tecnologías parecen ser bastante avanzadas, e incluso podemos usar estos submarinos para mejorar nuestros propios submarinos."
 argentina.63.a:0 "¡Echemos un vistazo a ellos!"
 argentina.65.t:0 "La inflación empeora ligeramente"
 argentina.65.d:0 "Nuestra inflación se ha disparado recientemente por diversos motivos. El repunte no parece tan grave y parece que se puede controlar, pero mientras tanto debemos vigilar nuestra inflación y asegurarnos de que no se nos vaya de las manos."
 argentina.65.a:0 "¡Nos ocuparemos de esta miserable inflación!"
 argentina.66.t:0 "La inflación empeora"
 argentina.66.d:0 "El valor monetario de nuestra moneda se ha desplomado recientemente y ha provocado que nuestra inflación se dispare temporalmente. Esto está lejos de ser ideal y podría arruinar nuestros planes para detener la inflación. Sin embargo, debemos hacer frente a este contratiempo y asegurarnos de que no se lleve lo mejor de nosotros. Por el bien de Argentina".
 argentina.66.a:0 "¡¿Qué demonios?!"
 argentina.67.t:0 "¡Argentina se expande con demasiada agresividad!"
 argentina.67.d:0 "Argentina ha declarado recientemente la guerra a otra nación con la esperanza de expandir su territorio aún más. ¡Esto tiene que parar ahora o de lo contrario ganarán demasiado poder! No sólo eso, sino que también podemos obtener nuestro propio beneficio personal al intervenir en su conflicto, así que ¿intervenimos?"
 argentina.67.a:0 "No debemos intervenir"
 argentina.67.b:0 "¡A Guerra con Argentina!"
 argentina.69.t:0 "Ha Fallecido Abraham Schweizer"
 argentina.69.d:0 "Nos llego la noticia de que uno de nuestros mejores generales y mariscales de campo, Abraham Schweizer, ha fallecido en un accidente aéreo. \n\nTodo el país llorará su muerte, y su muerte no será en vano. Tenemos que asegurarnos de que esto no se repita".
 argentina.69.a:0 "Que descanse en paz"
 argentina.70.t:0 "¿Quién Debe Liderar la Confederación?"
 argentina.70.d:0 "A pocos días de iniciar nuestra guerra civil, un hombre llamado Manuel Carlés ha manifestado su objeción a que Nimio sea el líder, y como líder de la Liga Patriótica Argentina cree que su partido debe ser el que tome el control de la nación. \n\nLa elección está ahora en manos del pueblo, ¿quién dirigirá la Confederación entre los dos?"
 argentina.70.a:0 "Manuel Carlés"
 argentina.70.b:0 "Nimio de Anquín"
 argentina.71.t:0 "El Terremoto de San Juan de 1944"
 argentina.71.d:0 "Una triste noticia ha golpeado hoy al pueblo de [ROOT.GetName], ya que un terremoto de alrededor de 6,7 a 7,8 grados de magnitud sacudió la provincia de San Juan. Se estima que cerca de 10.000 personas murieron en esta tragedia, y que pronto podrían ser muchas más. \n\nNo sólo eso, sino que el terremoto dañó gravemente las infraestructuras de la provincia y muchos edificios. El coste de arreglar todos estos daños será mucho, y es un dinero que tendremos que sacrificar de otras partes de la economía para sacarlo adelante. \n\nLo único que podemos hacer ahora es llorar a los que murieron y establecer nuevas normas para evitar que una tragedia como ésta vuelva a ocurrir."
 argentina.71.a:0 "Que esas pobres almas descansen en paz"
 news.341.t:0 "La Gran Guerra Sudamericana"
 news.341.d:0 "Tras la reciente declaración de guerra de los argentinos, varias otras naciones sudamericanas han declarado la guerra a Argentina con la esperanza de detener su ambición expansionista". \n\nMuchos analistas especulan con que, aunque Argentina tiene muy pocas posibilidades de ganar un conflicto de este tipo, si consigue lograrlo, podría ganar demasiado poder en la región. \n\nMuchos tienen miedo de lo sangrienta que puede ser esta guerra, incluso podría convertirse en el conflicto más sangriento de la historia de Sudamérica. Tendremos que esperar y ver".
 news.341.a:0 "¿No era ese continente el más aburrido? ¿Qué carajo está pasando?"
 news.341.b:0 "¡Pagarán con su sangre! Movilizá las reservas!"
 news.341.c:0 "¡Los Argentinos no tienen ninguna posibilidad!"

 argentina.rework.1.t:0 "¿Celebramos las próximas elecciones?"
 argentina.rework.1.d:0 "El mandato de 6 años de Justo está llegando a su fin y la gente espera que se lleven a cabo elecciones pronto. \n\nSin embargo, tenemos el poder de simplemente no celebrar las elecciones y Para mantener a Justo en el poder, después de todo, los militares deberían respaldarnos y tratar con las personas que puedan oponerse a esto. \n\nAl final, la elección depende de nosotros. ¿Qué haremos..."
 argentina.rework.1.a:0 "Realizar las elecciones"
 argentina.rework.1.b:0 "¡Justo seguirá en el poder pase lo que pase!"
 argentina.rework.2.t:0 "Escándalo de corrupción"
 argentina.rework.2.d:0 "La corrupción en la nación ha causado un escándalo en el escenario político de la nación. Los políticos corruptos están moviendo los hilos para beneficiarse ellos mismos sin preocuparse por nadie más. \n\n¿Qué hacemos con este lío?"
 argentina.rework.2.a:0 "Desafíalo de frente"
 argentina.rework.2.b:0 "Barrémoslo debajo de la alfombra"
 argentina.rework.3.t:0 "¡Se ha encontrado un oligarca corrupto!"
 argentina.rework.3.d:0 "Después de realizar una extensa investigación en nuestro gobierno, hemos descubierto acciones bastante dudosas por parte de ciertos individuos. Ahora que los tenemos a nuestro alcance, ¿qué debemos hacer?"
 argentina.rework.3.a:0 "Haz que se arrepientan"
 argentina.rework.3.b:0 "Barrer nuestros hallazgos debajo de la alfombra"
 argentina.rework.4.t:0 "La investigación ha resultado un fracaso"
 argentina.rework.4.d:0 "Nuestra investigación ha demostrado ser un fracaso, ya que nuestros investigadores no pudieron encontrar ninguna prueba concreta sobre alguna forma de corrupción o la presencia de políticos corruptos dentro del gobierno."
 argentina.rework.4.a:0 "Quizás obtengamos mejores resultados la próxima vez"
 argentina.rework.ALN.t:0 "La Formación de la Alianza Libertadora Nacionalista"
 argentina.rework.ALN.d:0 "Nos ha llegado la noticia de que la Legión Cívica Argentina ha sido disuelta y transformada en la Alianza Libertadora Nacionalista bajo el liderazgo de Juan Queraltó. \n\nEs un partido extremista que se parece mucho a al partido NSDAP en la Alemania nazi. Tenemos que vigilar con cautela a este nuevo partido, no podrían estar tramando nada bueno".
 argentina.rework.ALN.a:0 "Hay que tener cuidado"
 argentina.rework.5.t:0 "Ataque terrorista fascista en [CURRENT_STATE.GetName]"
 argentina.rework.5.d:0 "Los reporteros de noticias inundaron las radios cuando llegaron informes de un ataque terrorista no provocado por parte del partido fascista. ¡Necesitamos ocuparnos de ellos rápidamente e impedirles que continúen con este salvaje alboroto!"
 argentina.rework.5.a:0 "¡Pagarán por esto!"
 argentina.rework.6.t:0 "Encontrada sede de ALN"
 argentina.rework.6.d:0 "Después de nuestro reciente resumen del desorden causado por la ALN, hemos encontrado información bastante intrigante sobre su sede. Con su sede, no tendrán más remedio que guardar silencio y recordar. \n\nLo que sigue debería ser obvio."
 argentina.rework.6.a:0 "¡Apunta y destrúyelo!"
 argentina.rework.7.t:0 "Los militares están descontentos con nuestro actual gobierno"
 argentina.rework.7.d:0 "La tensión en la escena política de Argentina se ha ido rápidamente fuera de control, y los militares han estado vigilando muy de cerca la forma en que hemos estado gobernando la nación, y desde la apariencia de "Están lejos de estar satisfechos con nuestras acciones actuales. \n\nVarios generales nuestros nos han advertido directamente, diciendo que si la situación en la nación continúa escalando, habrá graves consecuencias".
 argentina.rework.7.a:0 "Maldita sea, hay que tener cuidado"
 argentina.rework.8.t:0 "Los militares han rodeado la Casa Rosada"
 argentina.rework.8.d.notHistorical:0 "Mientras hablamos, lo único que podemos hacer es observar indefensos como los militares tienen rodeada completamente la Casa Rosa, el principal edificio del gobierno de Argentina y el lugar donde el Presidente tiene todo el poder administrativo. y ordenándonos que renunciemos al liderazgo de la nación. \n\nA partir de ahora no tenemos idea de cómo obtuvieron tanto poder o financiación, pero de lo que sí tenemos una idea es de la gravedad de esta situación y nuestra incapacidad para responder. . \n\nSin tiempo que perder, ¿qué debemos hacer?"
 argentina.rework.8.d.historical:0 "Mientras hablamos, lo único que podemos hacer es observar indefensos como los militares tienen la Casa Rosada, el principal edificio del gobierno de Argentina y el lugar donde el Presidente tiene todo el poder administrativo, completamente rodeada y ordenarnos que renunciemos al liderazgo de la nación. \n\nLos principales perpetradores de esto deben haber sido el GOU (Grupo de Oficiales Unidos), que está siendo financiado en secreto y creciendo en poder sin que nos demos cuenta. \n\n¿Qué debemos hacer? ¿ahora?"
 argentina.rework.8.a:0 "Que se hagan cargo"
 argentina.rework.8.b:0 "SOBRE NUESTRAS TUMBAS, VIVA LA PATRIA"
 argentina.rework.9.t:0 "La gente sale a las calles a protestar"
 argentina.rework.9.d:0 "Muchas personas en todo el país han comenzado a protestar, exigiendo estabilidad y prosperidad en el país. Sus voces solo se harán más fuertes a medida que pase el tiempo, y sus problemas muestran cuán grave se está volviendo la situación aquí. en Argentina."
 argentina.rework.9.a:0 "Nosotros nos encargaremos de ellos"
 argentina.rework.10.t:0 "¡La inflación golpea la economía!"
 argentina.rework.10.d:0 "Aunque antes no estábamos luchando contra la inflación, el mercado hoy se desplomó cuando una crisis inflacionaria hace estragos en nuestra ya débil economía. \n\nLos mercados están luchando por mantenerse, y la gente está corriendo a los bancos para retirar el dinero que pudieran tener, lo único que hicieron fue empeorar la situación".
 argentina.rework.10.a:0 "Esto es lo último que necesitábamos"
 argentina.rework.11.t:0 "Nos han metido en una Lucha Política"
 argentina.rework.11.d:0 "Las elecciones de 1937 nos han estado cobrando un precio muy alto, ya que nos hemos visto obligados a estar alerta todo este tiempo para asegurarnos de que la gente vote por nuestro partido. Esto, sin embargo, ha llevó a los partidos opuestos a aprovechar la situación y perjudicarnos, desafiando nuestro dominio. \n\nNo podremos hacer nada, por el momento, pero contraatacaremos con fuerza."
 argentina.rework.11.a:0 "Saldremos de esto"
 argentina.rework.12.t:0 "El Gobierno inició una investigación"
 argentina.rework.12.d:0 "Por temor a posibles oligarcas o políticos corruptos en el país, el gobierno ha iniciado una investigación exhaustiva en todo el país para tratar de detener esto. \n\nSi les permitimos continuar con esta investigación, pueden encontrar "No sabemos que nuestros leales aliados nos ayudan en las sombras, y no podemos permitir que eso suceda".
 argentina.rework.12.a:0 "Hay que ponerle freno a esto"
 argentina.rework.13.t:0 "Los militares exigen mayor financiamiento"
 argentina.rework.13.d:0 "Los militares han ofrecido su apoyo en las sombras, a cambio de que aumentemos su financiamiento y poder en la nación. \n\nSi no cumplimos, podría haber graves consecuencias."
 argentina.rework.13.a:0 "Bien, lo haremos"
 argentina.rework.13.b:0 "No sucede"
 argentina.rework.14.t:0 "Oligarquías exigen más poder"
 argentina.rework.14.d:0 "Los oligarcas de todo el país están descontentos con el poder que tienen actualmente y exigen más poder político sobre el país. \n\n¿Deberíamos acceder a sus demandas?"
 argentina.rework.15.t:0 "Oligarquías exigen aumento salarial"
 argentina.rework.15.d:0 "Los oligarcas de nuestro país están descontentos con sus salarios actuales y exigen que se les redirija más dinero para mantener su apoyo. \n\n¿Deberíamos ceder a sus demandas? ?"
 argentina.rework.16.t:0 "Políticos en Buenos Aires exigen redireccionamiento de fondos"
 argentina.rework.16.d:0 "Políticos corruptos de Buenos Aires exigen que los fondos a nivel nacional se centralicen únicamente en Buenos Aires. La mayoría de nuestros beneficios provienen de la capital, y no cumplir con sus demandas podría resultar en perder su apoyo . \n\n¿Deberíamos estar de acuerdo?"
 argentina.rework.17.t:0 "Los oligarcas nos apoyan"
 argentina.rework.17.d:0 "Últimamente los oligarcas han estado muy satisfechos con la forma en que los hemos tratado y han aceptado pagarnos por nuestros actos."
 argentina.rework.17.a:0 "¡Genial!"
 argentina.rework.18.t:0 "Argentinos en todo el país ofrecen tomar las armas"
 argentina.rework.18.d:0 "La situación actual de nuestro país se está desmoronando rápidamente. Soldados extranjeros están ingresando a nuestro país y nuestro ejército resiste el asalto. En medio de todo este caos, los argentinos en todo el país se han ofrecido a tomar las armas para defender la Patria. \n\n¿Aceptaremos su ayuda y les permitiremos unirse a los soldados profesionales en el frente?
 argentina.rework.18.a:0 "¡A DEFENDER LA PATRIA!"
 argentina.rework.18.b:0 "Lo siento pero eso no puede pasar"
 argentina.rework.20.t:0 "La Guerra Civil finalmente ha terminado"
 argentina.rework.20.d:0 "Después de la pérdida de innumerables vidas, valientes sacrificios y caminos diezmados, Argentina finalmente está completa nuevamente. Es realmente una vergüenza lo que tuvo que pasar nuestra hermosa nación, pero lo más importante es que ahora podemos hacernos cargo y presentar una Argentina que realmente merezca atención a escala global. \n\n¡El mundo finalmente verá el verdadero potencial de Argentina y nunca más seremos el hazmerreír de nadie más!"
 argentina.rework.20.a:0 "¡Viva la Patria!"
 argentina.rework.21.t:0 "Captura Exitosa de Equipos"
 argentina.rework.21.d:0 "¡Pudimos colarnos con éxito en una fábrica de armas enemiga y robar algunas de sus armas!"
 argentina.rework.21.a:0 "¡Perfecto!"
 argentina.rework.22.t:0 "¡El enemigo roba algunas de nuestras armas!"
 argentina.rework.22.d:0 "¡Los contingentes enemigos pudieron pasar furtivamente nuestras líneas del frente y robar algunas de nuestras armas!"
 argentina.rework.22.a:0 "Hay que tener más cuidado"
 argentina.rework.23.t:0 "Captura fallida de equipo"
 argentina.rework.23.d:0 "¡Atraparon a nuestros soldados intentando robar armas enemigas!"
 argentina.rework.23.a:0 "Que en paz descansen"
 argentina.rework.24.t:0 "¡Soldados enemigos fueron atrapados tratando de robar parte de nuestro equipo!"
 argentina.rework.24.d:0 "Algunos de nuestros guardias en una fábrica de armas atraparon a soldados enemigos tratando de colarse y robar algunas de nuestras armas. Afortunadamente, se han solucionado".
 argentina.rework.24.a:0 "Bueno"
 argentina.rework.25.t:0 "[FROM.GetName] ¡Robó algunas de nuestras fábricas!"
 argentina.rework.25.d:0 "Si bien parece y suena loco creerlo, agentes encubiertos y partidarios del anarquismo dentro de nuestro país y Argentina asaltaron colectivamente algunas de nuestras fábricas de armas e industriales, amenazando a los trabajadores de las fábricas con irse a Argentina y procedieron ¡Para totalizar las fábricas! \n\n¡Este acto salvaje es simplemente vergonzoso! ¿Qué debemos hacer?"
 argentina.rework.25.a:0 "Otro día les haremos pagar"
 argentina.rework.25.b:0 "¡No se saldrán con la suya!"
 argentina.rework.26.t:0 "¡La Argentina anarquista se está entrometiendo en nuestra política!"
 argentina.rework.26.d:0 "No fue una mera coincidencia el repentino estallido de popularidad de un estado anarquista en nuestro país. Lejos de eso, la causa fundamental de esto es Argentina. Han estado entrometiéndose en nuestra política y nuestra gente. ¡Y tratando de inyectar sus puntos de vista enfermizos y retorcidos en nuestra gente! \n\n¿Qué debemos hacer?"
 argentina.rework.30.t:0 "[FROM.GetName] ¡Ha asesinado a nuestros insurgentes anarquistas!"
 argentina.rework.30.d:0 "Han llegado noticias a nuestra sede en Ushuaia de que [FROM.GetName] ha hecho todo lo posible para exterminar completamente toda influencia anarquista en su país, matando a algunos de nuestra gente en el proceso. \n\n¿Cómo debemos responder?"
 argentina.rework.30.a:0 "¡No se saldrán con la suya!"
 argentina.rework.30.b:0 "No podemos permitirnos una invasión en este momento"
 argentina.rework.31.t:0 "[FROM.GetName] exige nuestro sometimiento"
 argentina.rework.31.d:0 "[FROM.GetName] ha exigido que cedamos ante ellos y dejemos que su gobierno tome el control total de nuestra nación. ¡Esto significaría renunciar a nuestra independencia! \n\n¿Qué debemos hacer?"
 argentina.rework.31.a:0 "¿Tenemos siquiera opción?"
 argentina.rework.31.b:0 "¡Sobre nuestras tumbas de muertos!"
 argentina.rework.32.t:0 "¡[FROM.GetName] nos pide ayuda!"
 argentina.rework.32.d:0 "Delegados y revolucionarios de [FROM.GetName] han llegado a nuestro país, suplicando cualquier tipo de ayuda que podamos ofrecerles en sus esfuerzos. \n\nPor ahora están resistiendo, pero necesitan toda la ayuda posible. \n\nTener un aliado en el corazón de Sudamérica podría ser útil, ¿qué debemos hacer?"
 argentina.rework.32.a:0 "Les prestaremos algunas armas"
 argentina.rework.32.b:0 "Les enviaremos voluntarios"
 argentina.rework.32.c:0 "Les enviaremos bonos de guerra"
 argentina.rework.32.e:0 "¿Por qué deberíamos darte algo?"
 argentina.rework.34.t:0 "[FROM.GetName] ha decidido no ayudarnos!"
 argentina.rework.34.d:0 "[FROM.GetName] nos ha negado cualquiera de sus recursos para ayudarnos en nuestros esfuerzos de guerra!"
 argentina.rework.34.a:0 "¡Pues se pueden pudrir en el infierno!"
 argentina.rework.35.t:0 "¡Los enemigos políticos toman las armas!"
 argentina.rework.35.d:0 "La resistencia entre las provincias de nuestro país ha ido creciendo desde que asumimos el poder. Muchas siempre han estado en contra de nuestro gobierno, y el punto de inflexión acaba de llegar. Parece que han Hemos estado planeando clandestinamente una revolución a gran escala para derribarla, ¡pero no caeremos tan fácilmente!
 argentina.rework.35.a:0 "¡Pagarán con su sangre!"
 argentina.rework.36.t:0 "Los socialistas obtienen más escaños en el Congreso"
 argentina.rework.36.d:0 "Después de varias campañas y esfuerzos de propaganda, los socialistas han obtenido más escaños en el Congreso y un mayor reconocimiento a nivel nacional. \n\nContinuarán avanzando e intentarán ganar aún más escaños y potencialmente ganar las elecciones".
 argentina.rework.36.a:0 "Vale"
 argentina.rework.37.t:0 "Los militares designaron a Perón para ir a Chile"
 argentina.rework.37.d:0 "Varios oficiales de alto rango han decidido enviar a Juan Domingo Perón a Chile en la misión como agregado militar para obtener más conocimiento interno de la situación actual del país, además de potencialmente obtener acceso a nuevos conocimientos militares. al que actualmente sólo acceden los chilenos. \n\nComo presidente de Argentina, ¿estará de acuerdo con esta designación o irá en contra?"
 argentina.rework.37.a:0 "Envíalo a Chile"
 argentina.rework.37.b:0 "Los militares NO nos mandarán"
 argentina.rework.38.t:0 "Los militares designaron a Perón para ir a Italia"
 argentina.rework.38.d:0 "Varios oficiales de alto rango han decidido enviar a Juan Domingo Perón a Italia en la misión de obtener más conocimiento interno de la situación actual del país, así como aprender más sobre las tácticas de guerra italianas y las habilidades necesarias para luchando en grandes alturas. A Perón también se le encomendó la tarea de estudiar la economía italiana y su política, obteniendo una visión aún más profunda del estilo de vida italiano y, lo más importante, del fascismo. \n\nComo presidente de Argentina, ¿está de acuerdo con esto? designación, o ir en contra de ella?"
 argentina.rework.38.a:0 "Envíalo a Italia"
 argentina.rework.38.b:0 "Los militares NO nos mandarán"
 argentina.rework.39.t:0 "[ARG.GetLeader] es diagnosticado con diabetes"
 argentina.rework.39.d:0 "Después de un chequeo regular con el médico, el médico no tuvo más opción que darle a Roberto la noticia contundente sobre su condición. El médico afirmó que a medida que su diabetes empeora, él eventualmente quedará completamente ciego y se verá obligado a renunciar a su cargo. \n\nLa terrible noticia de este levantamiento ha golpeado las casas y las calles de Argentina, con los partidarios de Roberto devastados. \n\nNecesitamos hacer todo lo posible para ayudar a Roberto salir de cualquier manera que podamos, aunque no se puede garantizar si lo logrará o no".
 argentina.rework.39.a:0 "Devastador..."
 argentina.rework.40.t:0 "Oftalmólogo enviado por Estados Unidos llega a Argentina"
 argentina.rework.40.d:0 "Después de que [USA.GetLeader] se enteró de la condición de Roberto, decidió enviar personalmente a uno de los mejores oftalmólogos del país, Ramón Castroviejo, a Argentina para intentar ver si puede hacerlo. cualquier cosa para ayudar a la condición de Roberto y tal vez incluso curarla. \n\nLas posibilidades son escasas, pero el desdén de Roberto por las potencias del Eje es motivación suficiente para que Estados Unidos intente ayudarnos de cualquier manera posible."
 argentina.rework.40.a:0 "¡Agradecemos mucho la ayuda!"
 argentina.rework.41.t:0 "La cuestión del liderazgo..."
 argentina.rework.41.d:0 "Con las elecciones en marcha, se plantea una gran pregunta de fondo: ¿quién tomará el mando de la Concordancia? \n\nPodríamos quedarnos con Roberto Marcelino Ortiz, su fuerte voluntad y su mentalidad inmutable son seguras para ayudarnos en los tiempos desesperados de la infame década. \n\nPor otro lado, tenemos a Leopoldo Melo, un gran abogado, diplomático y político. \n\nNuestra última opción potencial es Robustiano Patrón Costas, actual gobernador de Salta. \n\n¿A quién deberíamos elegir?"
 argentina.rework.41.a:0 "Mantén a Roberto"
 argentina.rework.41.b:0 "Elige Leopoldo"
 argentina.rework.41.c:0 "Elige Robustiano"
 argentina.rework.42.t:0 "Se han detectado movimientos militares clandestinos"
 argentina.rework.42.d:0 "Varios informes anónimos han surgido recientemente sobre diferentes sectores del ejército que colaboran de maneras extrañas y bastante misteriosas. \n\nHasta ahora no tenemos información sobre lo que están haciendo, "Pero a juzgar por la situación actual del condado, esto puede muy bien resultar algo muy malo. Tendremos que mantener la guardia alta".
 argentina.rework.42.a:0 "¡Ja! Como si nos fueran a hacer cualquier cosa"
 argentina.rework.44.t:0 "Formación del GOU"
 argentina.rework.44.d:0 "Lo que originalmente eran solo rumores y especulaciones resultó ser una realidad, cuando varios generales, líderes militares y políticos de derecha combinaron fuerzas para formar el Grupo de Oficiales Unidos, o GOU para abreviar. . \n\nSu objetivo es abordar de una vez por todas la inestabilidad dentro de Argentina y superar los desafíos que hemos estado enfrentando durante la infame década. \n\nYa han declarado que lograrán sus objetivos por cualquier medio necesario, lo que Significa que se puede derramar sangre si las cosas van mal".
 argentina.rework.44.a:0 "Justo lo que necesitábamos..."
 argentina.rework.45.t:0 "GOU gana mayor control sobre el país"
 argentina.rework.45.d:0 "Como un intento de ganar más poder sobre el país y tener más influencia en nuestra política, el GOU ha tomado el control de otro estado más. \n\nSi esto continúa, no lo haremos ¡Podré desafiarlos más!"
 argentina.rework.45.a:0 "¡No se saldrán con la suya!"
 argentina.rework.46.t:0 "Arturo Rawson obligado a dimitir"
 argentina.rework.46.d:0 "Después de sólo 3 días de ser líder, el GOU ha decidido que ya fue suficiente después de que Arturo no escuchara sus demandas. \n\nPedro Palo Ramírez será quien tome el control y reemplace Arturo Rawson después de tal escándalo provocado por un dirigente que no fue dirigente ni siquiera por una semana."
 argentina.rework.46.a:0 "¿Está bien?"
 argentina.rework.47.t:0 "Perón asciende en las filas del gobierno"
 argentina.rework.47.d:0 "Después de obtener cierto reconocimiento por sus esfuerzos tanto externa como internamente dentro del país, muchos otros funcionarios gubernamentales de alto rango se han mostrado satisfechos con el desempeño de Peorn y han decidido promoverlo dentro de las filas del gobierno. \n\nEsta es una gran noticia por ahora, pero existe la posibilidad de que obtenga el reconocimiento del público e incluso comience a conseguir un número significativo de seguidores".
 argentina.rework.47.a:0 "Vale"
 argentina.rework.48.t:0 "Apoyo a Perón crece a nivel nacional"
 argentina.rework.48.d:0 "Después de convertirse oficialmente en parte del gobierno, además de ser un funcionario de relativamente alto rango, muchos soldados, así como civiles regulares, han comenzado a simpatizar con Perón, creyendo en sus metodologías y forma de pensar. podría ser la gracia salvadora de Argentina después de décadas de mediocracia. \n\nNecesitamos mantener un ojo vigilante sobre Peorn y su apoyo, ya que muy fácilmente podría salirse de control."
 argentina.rework.48.a:0 "Esto no es bueno..."
 argentina.rework.49.t:0 "Peornistas se reúnen para protestar contra el encarcelamiento de Perón"
 argentina.rework.49.d:0 "Cuando pensábamos que Perón sería cosa del pasado después de su encarcelamiento oficial, no podíamos estar mas errado...  Cientos de miles de personas han salido a las calles para protestar por el encarcelamiento de Perón y exigir su liberación. \n\nSus números son enormes, y si no los abordamos rápidamente, ¡esto podría terminar siendo muy malo!"
 argentina.rework.50.t:0 "¡El Partido Peronista gana por abrumadora mayoría!"
 argentina.rework.50.d:0 "Después de que el apoyo peronista alcanzó un punto crítico, los peronistas exigieron elecciones para ver quién debería ser el líder de Argentina. Sin muchas opciones, nos vimos obligados a cumplir y, para sorpresa de nadie, Perón ganó por un margen significativo sobre la oposición y asumirá el cargo hoy más tarde".
 argentina.rework.50.a:0 "Genial"
 argentina.rework.51.t:0 "¡Perón ha sido liberado!"
 argentina.rework.51.d:0 "Después de muchas marchas como protesta contra la decisión del gobierno de encarcelar a Perón, finalmente cedieron a nuestras demandas y ¡hoy lo liberarán oficialmente y lo reemplazarán en el gobierno! \n \n¡Nuestras protestas han resultado ser un éxito!"
 argentina.rework.52.t:0 "Perón ha sido encarcelado"
 argentina.rework.52.d:0 "Después del alarmante crecimiento del apoyo a Perón, el gobierno ha decidido tomar una decisión audaz y encarcelar a Perón para evitar que su influencia crezca más dentro del país. \n\nDejemoslo claro como ¡Dígales que han tomado una decisión horrible y que pagarán por lo que hicieron!
 argentina.rework.52.a:0 "¡Perón SERÁ liberado!"
 argentina.rework.53.t:0 "Oposición nos acusa de victoria fraudulenta"
 argentina.rework.53.d:0 "Después de nuestra victoria en las elecciones de 1937, varios miembros de los partidos de oposición nos han acusado de que nuestra victoria era ilegítima. Si bien la mayoría de los argentinos no lo creen, una parte importante está de acuerdo con estas afirmamos y creemos que no ganamos las elecciones limpiamente".
 argentina.rework.53.a:0 "Genial..."
 argentina.rework.54.t:0 "Detección exitosa de generales sospechosos"
 argentina.rework.54.d:0 "¡Nuestra búsqueda ha sido un éxito! ¡Hemos podido identificar y localizar a todos los generales que estaban conspirando a nuestras espaldas! Serán atendidos rápidamente."
 argentina.rework.54.a:0 "Muy bueno"
 argentina.rework.55.t:0 "Nuestra operación de búsqueda ha fracasado"
 argentina.rework.55.d:0 "Después de un cuidadoso examen de todos nuestros generales, no hemos podido localizar a los responsables de conspirar a nuestras espaldas. Debido a nuestro fracaso, han utilizado este punto débil de nuestro gobierno para convencer a otros generales y lanzar una represión a gran escala contra nuestro gobierno!"
 argentina.rework.55.a:0 "¡Estos Vendepatrias serán tratados con prontitud!"
 argentina.rework.56.t:0 "¡Los militares se rebelan contra nosotros!"
 argentina.rework.56.d:0 "¡Después de disgustar a los militares debido a nuestras diversas acciones y reformas, han decidido directamente rebelarse contra nosotros! \n\n¡Necesitamos mantenerlos bajo control antes de que intenten algo más!"
 argentina.rework.56.a:0 "¡Estas malditas ratas!"

 argentina.fascist.1.t:0 "¿Quién debería representar a la Legión Cívica Argentina?"
 argentina.fascist.1.d:0 "Tenemos que tomar una decisión ahora que creamos la coalición, ¿y esa es quién debe controlar la LCA? \n\nNuestra elección es entre el tranquilo y sensato Juan Queralto, y el el testarudo y feroz Juan Bautista Molina. \n\n¿A quién elegiremos?"
 argentina.fascist.2.t:0 "¿Qué partido debería dominar la coalición?"
 argentina.fascist.2.d:0 "Ahora que lanzamos nuestros planes, tenemos una elección: ¿Qué partido debe tener prioridad sobre el resto y representar verdaderamente a la coalición? \n\nNuestra elección cambiará en gran medida a nuestro líder y a la política asociada. con él, así que piense detenidamente en esta decisión cuál es el plan de acción. \n\nEl partido que nos liderará es..."
 argentina.fascist.2.a:0 "Legión Cívica Argentina"
 argentina.fascist.2.b:0 "Partido Fascista Argentino"
 argentina.fascist.2.c:0 "Liga Patriótica Argentina"
 argentina.fascist.2.e:0 "Políticos Independientes"
 argentina.fascist.3.t:0 "Las elecciones de 1937 han sido canceladas"
 argentina.fascist.3.d:0 "Después de la creciente tensión dentro de la nación debido al rápido crecimiento del recién nacido partido fascista, el actual gobierno argentino ha decidido que lo mejor sería cancelar las próximas elecciones para centrarse en asuntos internos de la nación."
 argentina.fascist.3.a:0 "¡Perfecto!"
 argentina.fascist.4.t:0 "¿Debería Walther Darré representar a los políticos independientes?"
 argentina.fascist.4.d:0 "Después de llegar a Argentina, Darré se ganó el apoyo de los fascistas bastante rápidamente. Su experiencia en la Alemania nazi le ha permitido ganar popularidad rápidamente, y con esa popularidad viene una elección... ¿Deberíamos ¿Nombrarlo líder de los Independientes Políticos?"
 argentina.fascist.4.a:0 "¡Claro! Parece experimentado"
 argentina.fascist.4.b:0 "Mantener a Lugones como líder"
 argentina.fascist.5.t:0 "Toma federalista"
 argentina.fascist.5.d:0 "Después de varios meses de trabajo y abusando de la frágil situación del país, los federalistas han lanzado un golpe de estado total, con Leopoldo Lugones a cargo. Los federalistas se apoderaron de todas las posiciones del país. y se han autodeclarado como la Confederación Argentina una vez más. \n\nEs probable que haya una oposición unitaria a un cambio de gobierno tan repentino, pero con el tiempo eso debería disminuir."
 argentina.fascist.5.a:0 "¡Ahora comienza una nueva era!"
 argentina.fascist.6.t:0 "Hitler llega a Argentina"
 argentina.fascist.6.d:0 "Después del colapso nacional en Alemania, Hitler y su esposa sabían que necesitaban escapar o, de lo contrario, serían asesinados por la oposición. Después de explorar sus opciones, un país se destacó. . nuestro. Hitler sabía que uno de sus ministros más leales no sólo fue a Argentina, sino que también se convirtió en líder de la nación. Al juzgar sus opciones, contó con que Argentina era el mejor país para escapar. \n\nEsto nos lleva a nuestro dilema actual: ¿qué hacemos con Hitler?"
 argentina.fascist.6.a:0 "Déjenlo entrar"
 argentina.fascist.6.b:0 "Denle un rol en el gobierno, es útil"
 argentina.fascist.6.c:0 "No se quedará aquí mucho más"
 argentina.fascist.7.t:0 "La cuestión de Adolf Hitler"
 argentina.fascist.7.d:0 "Después de haber sido ascendido recientemente dentro del gobierno, la experiencia de Hitler en el campo y su fluidez en palabras y emociones le han hecho ganar apoyo muy rápidamente en todo el país. No sólo tiene apoyo popular, sino también apoyo de algunos rangos del ejército y varios sectores del gobierno recién establecido. \n\nLa pregunta es... ¿debería tomar el poder sobre el país o permanecer como un mero asesor político?"
 argentina.fascist.7.a:0 "¡Ahora mismo necesitamos un líder con corazón de hierro!"
 argentina.fascist.7.b:0 "¡No podemos permitir que un lunático así tome el poder!"

 news.368.t:0 "Estado Pontificio declarado en Argentina"
 news.368.d:0 "Después de una toma del poder católica en Argentina bajo el sacerdote Julio Meinvielle, la situación era preocupante pero no había nada de qué preocuparse. \n\nEsto, sin embargo, cambió significativamente ya que ahora el sacerdote ha autodeclarado a Argentina como el país nuevo Estado Pontificio oficial, denunciando el papado original y afirmando que es una copia falsa. \n\nLos líderes de todo el mundo están tan desconcertados por esto que la mayoría ni siquiera sabe qué hacer, pero una cosa es segura: Meinvielle tiene peligros ¡ambiciones!"
 news.368.a:0 "Está bromeando... ¿verdad?"
 news.368.b:0 "Amén, que Dios bendiga a estas viles criaturas"


 argentina.posadistambitions.1.t:0 "Ambición posadista | Ganar la Guerra Civil"
 argentina.posadistambitions.1.d:0 "Con la guerra civil en pleno apogeo, Posadas ha notado diligentemente a nuestros altos oficiales y diputados que hagan un trabajo rápido de la oposición para reconstruir el país lo más rápido posible."
 argentina.posadistambitions.1.a:0 "¡Por la Revolución!"
 argentina.posadistambitions.2.t:0 "Ambición posadista | Reconstruir la economía"
 argentina.posadistambitions.2.d:0 "Posadas ha dado otra orden más: reconstruir la maltrecha economía y sacar adelante al país. \n\nSerá una tarea desafiante pero Posadas confía en que podremos cumplirla a su debido tiempo."
 argentina.posadistambitions.3.t:0 "Ambición posadista | Aplastar a los oligarcas rebeldes"
 argentina.posadistambitions.3.d:0 "Desde el final de la guerra civil, los molestos oligarcas dentro de la nación han notado que su dominio sobre el país se ha deteriorado, y están realizando un intento muy inútil de intentar recuperar el dominio. \n\nPosadas está muy disgustado con estas personas, y le gustaría que 'se ocuparan de ellos'"
 argentina.posadistambitions.4.t:0 "Ambición Posadista | Mejorar la Infraestructura Nacional"
 argentina.posadistambitions.4.d:0 "Para tener un país exitoso, es de suma importancia que todas las carreteras dentro del país estén conectadas adecuadamente para permitir que los recursos, bienes, personas y militares se muevan desde cualquier señalar cualquier otro punto del país con relativa facilidad. \n\nSe nos ha encomendado la tarea de mejorar la infraestructura nacional del país."
 argentina.posadistambitions.5.t:0 "Ambición posadista | Prepárese para la expansión"
 argentina.posadistambitions.5.d:0 "Después de recuperarse principalmente de la guerra civil, Posadas cree que es hora de comenzar a preparar a la nación y a su pueblo para lo que está por venir. Después de todo, la Revolución no se expandirá por sí sola."
 argentina.posadistambitions.6.t:0 "Ambición Posadista | Forma Posadista La Plata"
 argentina.posadistambitions.6.d:0 "El pueblo que reside en Paraguay y Uruguay está sufriendo la naturaleza miserable de los capitalistas. El pueblo necesita liberación, y nosotros podemos salvarlo de su opresión, todos unidos bajo una sola bandera, la posadista La Plata"
 argentina.posadistambitions.7.t:0 "Ambición posadista | Conquistar los Andes"
 argentina.posadistambitions.7.d:0 "Posadas nos ha dado otra orden que involucra la conquista de los países andinos de Chile, Perú y Bolivia. Ha tomado nota de los costos que la guerra podría tener potencialmente para el país, y preferiría que que sean eliminados rápidamente."
 argentina.posadistambitions.8.t:0 "Ambición posadista | Conquistar Brasil"
 argentina.posadistambitions.8.d:0 "Encontrarnos repentinamente en conflicto con Brasil ha demostrado ser menos que ideal, y Posadas preferiría que el conflicto se resuelva rápidamente antes de una mayor escalada."
 argentina.posadistambitions.9.t:0 "Ambición Posadista | Programa de expansión Naval"
 argentina.posadistambitions.9.d:0 "Posadas nos ha ordenado ampliar la Armada Argentina. Considera que la Armada actual es mediocre y no será suficiente para las tareas futuras que tendrá que afrontar."
 argentina.posadistambitions.10.t:0 "Ambición posadista | Expandirse más allá de América del Sur"
 argentina.posadistambitions.10.d:0 "La Revolución necesita ir más allá de los límites de nuestro continente. ¡El mundo entero necesita saber de la palabra de Posadas y del posadismo, y esto incluye a los que están más allá de nuestro continente!"
 argentina.posadistambitions.11.t:0 "Ambición posadista | Extender la revolución a Europa"
 argentina.posadistambitions.11.d:0 "Europa necesita desesperadamente un cambio, algo nuevo, una revolución. La cuna de Karl Marx, la cuna de los ideales que representan la revolución. Deberíamos devolver la revolución a su ¡lugar que le corresponde!"
 argentina.posadistambitions.12.t:0 "Ambición posadista | Decapitar a los cerdos"
 argentina.posadistambitions.12.d:0 "Desde la concepción de nuestro gobierno, desde el inicio de un camino hacia la gloria, un obstáculo evidente ha estado en nuestro camino desde entonces: el Reino Unido y los Estados Unidos. Ambos afirman representar la 'democracia'. ' y 'libre albedrío', pero eso no puede estar más lejos de la verdad de su caos y destrucción. \n\n¡Pagarán por sus pecados con la sangre de su pueblo!"
 argentina.posadistambitions.13.t:0 "Ambición posadista final | Viva la Revolución"
 argentina.posadistambitions.13.d:0 "¡Viva la Camarada Posadas! ¡Viva la Revolución Mundial!"
 argentina.posadistambitions.100.t:0 "¡La ambición posadista se ha completado con éxito!"
 argentina.posadistambitions.100.d:0 "Pudimos cumplir con las demandas de Posadas en tiempo y con gran eficiencia. Posadas está muy satisfecho con los resultados y cree que el país va por un camino de crecimiento y prosperidad."
 argentina.posadistambitions.100.a:0 "Viva la Camarada Posadas!"
 argentina.posadistambitions.101.t:0 "La ambición posadista fracasó"
 argentina.posadistambitions.101.d:0 "Posadas está profundamente decepcionado con nosotros, ya que sus demandas no fueron cumplidas a tiempo a pesar de que creía que se nos dio tiempo suficiente para cumplirlas exitosamente. Espera que la próxima vez lo hagamos mejor y no repetir tal decepción."
 argentina.posadistambitions.101.a:0 "Mierda..."


 argentina.culturaldevelopment.1.t:0 "Desarrollo Cultural | Construir la General Paz"
 argentina.culturaldevelopment.1.d:0 "Ingenieros de todo el país se han reunido en Buenos Aires, discutiendo la idea de una Avenida que pueda usarse para separar la Capital Autónoma de la Provincia de Buenos Aires. \n\nTenemos que completar este proyecto en 5 meses".
 argentina.culturaldevelopment.1.a:0 "¡Lo lograremos!"
 argentina.culturaldevelopment.2.t:0 "Desarrollo Cultural | Atraer más inmigrantes al país"
 argentina.culturaldevelopment.2.d:0 "Este país ha tenido una larga historia de inmigración. Han dado forma y transformado a Argentina hasta lo que es hoy, y es vital que continuemos con esto y hagamos que sea lo más fácil posible para los inmigrantes asimilarse a ¡Nuestra gran nación!".
 argentina.culturaldevelopment.2.a:0 "Es hora de traer más inmigrantes"
 argentina.culturaldevelopment.3.t:0 "Desarrollo Cultural | Conecta la Ruta 9 a Córdoba"
 argentina.culturaldevelopment.3.d:0 "La Ruta 9 es una carretera nacional relativamente nueva cuyo objetivo principal es conectar Buenos Aires con Jujuy y luego extenderse más allá de la frontera con Bolivia. Un proyecto de esa magnitud va a tomar años, sin embargo "Para empezar a avanzar debemos centrarnos en conectar la ruta con Córdoba".
 argentina.culturaldevelopment.3.a:0 "¡Es hora de ponerse a trabajar!"
 argentina.culturaldevelopment.4.a:0 "¡Es hora de ponerse a trabajar!"
 argentina.culturaldevelopment.4.t:0 "Desarrollo Cultural | Construir el Obelisco"
 argentina.culturaldevelopment.4.d:0 "La empresa alemana G.E.O.P.E nos contactó recientemente con el deseo de construir un Obelisco en la Avenida 9 de Julio, la más importante de todo Buenos Aires. \n\nLa mayoría coincide en que sería ¡Es bueno tener un monumento así para representar a nuestro país!"
 argentina.culturaldevelopment.5.t:0 "Desarrollo Cultural | Construir la Bombonera y la Monumental"
 argentina.culturaldevelopment.5.d:0 "A medida que el fútbol continúa ganando popularidad en nuestro país, también lo hace la demanda de estadios de fútbol adecuados. River Plate y Boca Juniors, respectivamente, han estado instando a nuestro gobierno a construir sus estadios".
 argentina.culturaldevelopment.5.a:0 "¡Y eso lo haremos!"
 argentina.culturaldevelopment.6.t:0 "Desarrollo Cultural | Invertir a nivel nacional en nuestra educación"
 argentina.culturaldevelopment.6.d:0 "La educación en Argentina ha estado estancada recientemente. No ha habido demasiados avances y si bien nuestra educación es buena, podría ser incluso mejor. \n\nLa educación es el futuro después de todo, y ¡Los argentinos más jóvenes necesitan estar bien educados para apoyar a un país fuerte y poderoso!"
 argentina.culturaldevelopment.7.t:0 "Desarrollo Cultural | Construir el Hospital Militar"
 argentina.culturaldevelopment.7.d:0 "Después de la guerra del Chaco, muchos soldados señalaron la necesidad de contar en el país con un hospital militar adecuado para atender a los soldados heridos y a sus familiares. \n\nNos han dado 8 meses para completar esta tarea."


 argentina.rework.communist.1.t:0 "Estallan violentas protestas a nivel nacional"
 argentina.rework.communist.1.d:0 "Apenas unos días después de que el gobierno hiciera oficial que no habrá elecciones, la gente de todo el país comenzó a reunirse y organizar turbas masivas, mostrando agresión a la policía tratando de calmarlos y haciendo su El desprecio hacia la decisión del gobierno es tan claro como la luz del día. \n\nVarios líderes de facciones de izquierda han comenzado a aprovechar la situación, convenciendo al pueblo de que el gobierno es la pesadilla de todos los males y que una revolución es necesaria para que Argentina salida. \n\n¿Dónde concentraremos el apoyo del pueblo?"
 argentina.rework.communist.1.a:0 "Consiguen apoyo en las provincias"
 argentina.rework.communist.1.b:0 "Consigue el apoyo de los bonaerenses"
 argentina.rework.communist.2.t:0 "La situación sólo empeora"
 argentina.rework.communist.2.d:0 "La mayoría de la gente simplemente supuso que los disturbios actuales serían simplemente una manifestación del pueblo y se calmarían en unos pocos días. Sin embargo, eso no podría estar más lejos del caso, ya que el Las protestas y los disturbios no han hecho más que aumentar en número y fuerza. Casi todas las ciudades del país se están viendo afectadas por protestas importantes, exasperadas por los marxistas dentro de la nación. \n\nA medida que el país se acerca cada vez más a la anarquía, surge un dilema : ¿Hacemos esto pacíficamente o con sangre derramada en nuestras manos?"
 argentina.rework.communist.2.a:0 "¡La diplomacia no soluciona nada!"
 argentina.rework.communist.2.b:0 "¡Necesitamos mantener nuestro país como una sola entidad!"
 argentina.rework.communist.3.t:0 "Sentimiento anarquista se intensifica en la Patagonia"
 argentina.rework.communist.3.d:0 "Con la situación del país empeorando cada vez más, los anarquistas restantes que se están debilitando en la Patagonia han comenzado a armarse y ganarse el apoyo de los provincianos en Santa Cruz y Tierra del Fuego, afirmando que el gobierno es la raíz de todos los males, y sólo el pueblo con sus propias manos puede hacer justicia. \n\n¿Qué dices, amigo mío, estás de acuerdo con nuestros ideales?"
 argentina.rework.communist.3.a:0 "¡El anarquismo es el único camino a seguir!"
 argentina.rework.communist.3.b:0 "¡Tu escoria sólo empeorará este país!"
 argentina.rework.communist.4.t:0 "Gran sentimiento pacifista del PS"
 argentina.rework.communist.4.d:0 "Debido a que la abrumadora mayoría de la gente todavía prefiere un enfoque más diplomático ofrecido por el PS, muchos están en contra de la guerra actual y van activamente contra nosotros y nuestros esfuerzos de guerra. Ya sea saboteando nuestra reservas o convencer a los soldados de abandonar las líneas del frente".
 argentina.rework.communist.4.a:0 "¡Malditos sean todos!"
 argentina.rework.communist.5.t:0 "¡Los socialistas han saboteado algunas de nuestras reservas!"
 argentina.rework.communist.5.d:0 "Los socialistas todavía presentes en nuestro país han decidido sabotear una de nuestras reservas de armas en el país como manifestación contra la guerra y para frustrar nuestra capacidad de luchar!"
 argentina.rework.communist.5.a:0 "¡No se saldrán con la suya!"
 argentina.rework.communist.6.t:0 "El apoyo popular a Fanny alcanza un máximo histórico"
 argentina.rework.communist.6.d:0 "Después de obtener un gran apoyo a pesar de la actual crisis nacional, Fanny ha comenzado a abogar por una revolución a gran escala y a reunir a todos sus partidarios para ir contra el gobierno. El Partido Comunista y los contingentes dentro del El país ahora está dividido entre Liborio Justo y Fanny Edelman. \n\n¿Debería Fanny convertirse en la líder de facto?
 argentina.rework.communist.6.a:0 "¡Fanny nos llevará a la victoria!"
 argentina.rework.communist.6.b:0 "Liborio es nuestra mejor oportunidad"
 argentina.rework.communist.7.t:0 "Sabotaje anarquista a nivel nacional"
 argentina.rework.communist.7.d:0 "Los anarquistas dentro del país se han organizado y orquestado un sabotaje a nivel nacional, apuntando a bancos, edificios gubernamentales y reservas. Se dieron cuenta de la situación extremadamente delicada del país y están abusando de ella al máximo. más completo."
 argentina.rework.communist.7.a:0 "Estos malditos mocosos..."
 argentina.rework.communist.8.t:0 "Partidarios marxistas intentan frustrar nuestros planes"
 argentina.rework.communist.8.d:0 "Debido a nuestra reciente alineación con los ideales anarquistas, muchos de los marxistas todavía presentes en Argentina están fuertemente en contra de esta noción y, por lo tanto, han interferido en nuestros planes y nos están haciendo más difícil planificar y comunicar antes de que este país estalle".
 argentina.rework.communist.8.a:0 "Comportamiento Vergonzoso"
 argentina.rework.communist.9.t:0 "Junta Militar derroca al gobierno argentino"
 argentina.rework.communist.9.d:0 "¡Noticias importantes han llegado a nuestra sede! Nuestro enemigo ha estado luchando profusamente para mantener su situación política bajo control, y la Junta ha decidido derrocar su gobierno para tratar de traer estabilidad a su lado. ¡Usando fuerza bruta! \n\nSin embargo, esta situación debilitada podría llevar a otras facciones dentro del país a aprovechar la oportunidad e intentar tomar el control del país, por lo que debemos estar cansados."
 argentina.rework.communist.9.a:0 "No podemos andar a la ligera"
 argentina.rework.communist.11.t:0 "Es hora de unirse al Commintern"
 argentina.rework.communist.11.d:0 "Stalin llegó hoy a Buenos Aires para felicitarnos por nuestra victoria... o eso pensábamos. En realidad, Stalin llegó aquí para recordarnos nuestra parte del trato al unirnos a la Commintern una vez terminada la guerra civil. \n\n¿Qué elección hacemos?"
 argentina.rework.communist.11.a:0 "¿Tenemos siquiera opción?"
 argentina.rework.communist.11.b:0 "¡Haremos lo que queramos!"
 argentina.rework.communist.12.t:0 "[FROM.GetName] ha aceptado unirse al Commintern"
 argentina.rework.communist.12.d:0 "[FROM.GetName] ha aceptado unirse a nuestra facción y ahora será un miembro leal a nosotros."
 argentina.rework.communist.12.a:0 "Perfecto"
 argentina.rework.communist.13.t:0 "[FROM.GetName] ¡No se unió a nuestra facción!"
 argentina.rework.communist.13.d:0 "[FROM.GetName] se ha negado a unirse al Commintern, diciendo que 'harán lo que quieran'."
 argentina.rework.communist.13.a:0 "Parece que tenemos que darles una lección"
 argentina.rework.communist.14.t:0 "Un improbable encuentro con el bandido"
 argentina.rework.communist.14.d:0 "Mientras algunos de nuestros hombres estaban haciendo ejercicios en el campo para ganar ventaja sobre nuestro enemigo en terrenos rurales, se encontraron con el infame bandido, David 'Mate Cosido' Perelta. \n\nAunque inicialmente trató a nuestros hombres como una amenaza, pronto se dio cuenta de que no estaban enfadándose con él. En lugar de darnos la espalda después de escuchar la situación, se ofreció a ayudarnos a llevar a algunos de nuestros hombres a la victoria usando su Geniales tácticas de lucha de guerrillas y nos darán ventaja contra nuestro enemigo".
 argentina.rework.communist.14.a:0 "Bienvenido, el Pistolero"
 argentina.rework.communist.15.t:0 "¡Se ha descubierto vida extraterrestre!"
 argentina.rework.communist.15.d:0 "¡Lo que nos parecía simplemente un sueño se ha convertido en realidad! Nuestros científicos de primer nivel han capturado frecuencias de radio que provienen de formas de vida más allá de nuestro planeta. Después de establecer una conexión adecuada con estas formas de vida y al explicar nuestra historia y nuestra historia, desde la creación de la Tierra hasta la evolución humana, estas formas de vida comenzaron a describir su lado de la historia. \n\nNuestros científicos han regresado con datos y planos extremadamente valiosos que harán avanzar fácilmente nuestra años de investigación por delante de todos los demás países de este planeta".
 argentina.rework.communist.15.a:0 "¡Tu ayuda realmente ha sido una bendición!"
 argentina.rework.communist.16.t:0 "[FROM.GetName] exige la isla Pitcairn"
 argentina.rework.communist.16.d:0 "Acabamos de recibir una carta de [FROM.GetName], exigiendo que abandonemos nuestro dominio en la isla Pitcairn y se la entreguemos. \n\n¿Qué debemos hacer? "
 argentina.rework.communist.16.a:0 "Te lo entregamos"
 argentina.rework.communist.16.b:0 "¡DIABLOS NO!"
 argentina.rework.communist.17.t:0 "[FROM.GetName] exige a la Patagonia y convertirse en su tema"
 argentina.rework.communist.17.d:0 "Hemos recibido una carta amenazadora de [FROM.GetName], exigiendo que no sólo les entreguemos la totalidad de la Patagonia, sino que también nos convirtamos en su súbdito. \n\nQué ¿Deberiamos hacer?"
 argentina.rework.communist.17.a:0 "Bien..."
 argentina.rework.communist.17.b:0 "¿ESTÁN LOCOS? NI EN PEDO"


 argentina.rework.stabilization.t:0 "Intentos de estabilización del gobierno"
 argentina.rework.stabilization.d:0 "A medida que la situación en el país continúa empeorando, el gobierno está haciendo todo lo posible para remediar la situación lo mejor que pueda y frustrar nuestros planes."
 argentina.rework.stabilization.a:0 "Ok"

 
 argentina.temp.t:0 "¿Quién gobernará nuestra Patria?"
 argentina.temp.d:0 "Ahora que estamos en manos del país, surge un dilema: ¿Quién gobernará nuestro país? Hay dos grandes contendientes para gobernar nuestro país, esos son Fanny Edelman y Liborio Justo. Ambos están dedicados representar al comunismo argentino con todo su corazón y llevar al país a la gloria. \n\n¿Quién será el que tome el mando?"
 argentina.temp.a:0 "Liborio Justo"
 argentina.temp.b:0 "Fanny Edelman"

 news.346.t:0 "La Guerra Peruano-Ecuatoriana"
 news.346.d:0 "Tras el aumento de las tensiones y los conflictos fronterizos entre los dos países, estalló una guerra total entre ambas naciones en una lucha por quién controlará Pastaza. \n\nAunque muchos piensan que Perú será el claro ganador debido a su supremacía industrial y militar, existe una pequeña minoría que cree que Ecuador puede salir victorioso de esta guerra. \n\nPor ahora, sólo el tiempo dirá quién será el verdadero vencedor de este conflicto".
 news.346.a:0 "Bastante interesante"
 news.346.b:0 "Deberíamos estudiar este conflicto"
 news.346.c:0 "¡Estos Ecuatorianos caerán!"
 news.346.e:0 "¡No permitiremos que estos calentólogos se salgan con la suya!"

 news.347.t:0 "La segunda guerra del Chaco"
 news.347.d:0 "A los pocos años de la primera Guerra del Chaco, los bolivianos no soportaron que los paraguayos fueran dueños del territorio del Chaco, territorio que los bolivianos reclaman como suyo. Después de varios conflictos fronterizos, los bolivianos lanzaron una ofensiva militar contra los paraguayos e iniciaron oficialmente la Segunda Guerra del Chaco. \n\nEl mundo observará con mucha atención los acontecimientos que se produzcan en esta guerra, ya que cualquier vencedor de la misma puede tener una posición bastante dominante en el centro de Sudamérica."
 news.347.a:0 "Muy interesante"
 news.347.b:0 "Hay que tener cuidado con esos dos"
 news.347.c:0 "¡El CHACO SERÁ NUESTRO UNA VEZ MÁS!"
 news.347.e:0 "¡Esta vez los Bolivianos sí que van a caer!"
 

 uruguay.2.t:0 "Nuestros oficiales han arrestado a algunas personas sospechosas"
 uruguay.2.d:0 "Oficiales de policía de nuestro gobierno han arrestado a personas que parecían bastante sospechosas. Los oficiales afirmaron que estas personas no eran de confianza y fueron encarcelados. \n\nLa noticia probablemente se difundirá a la gente a través de terceras fuentes y no estarán contentos, pero nuestro gobierno será más fuerte así que al final vale la pena."
 uruguay.2.a:0 "Interesante, tendremos que esperar y ver a qué conduce esto"
 uruguay.3.t:0 "Algunos de nuestros prisioneros fueron liberados"
 uruguay.3.d:0 "Nos acaba de llegar la noticia de que algunos de nuestros prisioneros han sido liberados hoy. \n\nCómo escaparon está a debate, no sabemos si escaparon por su cuenta o si otras personas los ayudaron. Diablos, tal vez incluso la gente de nuestro propio gobierno los ayudó. \n\nSea lo que sea, es una clara señal de que debemos ser más duros con la población para asegurarnos de que esto no vuelva a suceder."
 uruguay.3.a:0 "Tal vez hay una razón subyacente de por qué sucedió esto"
 uruguay.5.t:0 "Terra y sus fieles seguidores toman el país"
 uruguay.5.d:0 "Después de que la noticia llegara a todos los uruguayos de que Terra había sido expulsado a la fuerza de su cargo, muchos de sus leales partidarios salieron a la calle para protestar violentamente contra su destitución. \n\nEn cada ciudad, en cada calle, en cada cuadra, hay leales haciendo todo lo posible para que Terra vuelva al poder. Las turbas están abusando masivamente de la violencia y muchas personas ya han perdido la vida por su culpa. \n\nTenemos que actuar rápidamente contra los manifestantes si queremos que nuestro país se mantenga a flote, y eso lamentablemente significará más sangre derramada, pero se ha llegado a un punto en el que es imprescindible."
 uruguay.5.a:0 "¡Pagarás, Terra!"
 uruguay.6.t:0 "Roosevelt ha llegado a Montevideo"
 uruguay.6.d:0 "Hace apenas una hora que Roosevelt ha llegado a Montevideo y viene a visitar Terra para tratar varios temas políticos y mejorar las relaciones diplomáticas. Fue recibido con una multitud que lo aclamaba y agitaba banderas americanas y uruguayas, y se tomaron muchas fotos de ambos presidentes. \n\nEsperemos que podamos mejorar aún más nuestras relaciones con los estadounidenses y tenerlos como aliados en el futuro".
 uruguay.6.a:0 "¡Por el bien de nuestras dos naciones!"
 uruguay.7.t:0 "Elecciones uruguayas"
 uruguay.7.d:0 "Tras reformar la Constitución uruguaya, Gabriel Terra ha permitido que se celebren elecciones libres después de varios años. Este es un gran paso adelante en nuestra nación. \n\nSe destacan dos grandes partidos políticos, el Colorado y el Nacional. Ambos son cruciales en Uruguay, y han decidido gran parte de la historia de esta nación, llegando incluso a producirse una guerra civil en la década de 1860 por su causa. \n\n ¿Quién gana las elecciones?"
 uruguay.7.a:0 "Partido Nacional"
 uruguay.7.b:0 "Partido Colorado"
 uruguay.8.t:0 "Uruguay propone un acuerdo de paz entre nuestras naciones"
 uruguay.8.d:0 "Diplomáticos uruguayos han llegado hoy a Buenos Aires para proponer un acuerdo de paz entre nuestra nación. Uruguay es consciente de que son una amenaza para nosotros y quieren tener un pacto con nosotros. \n\nLos diplomáticos afirman que no habrá guerra entre nuestras naciones y que ambos cooperaremos pacíficamente y construiremos cada una de nuestras naciones. \n\nHay muchas amenazas a nuestro alrededor, así que aceptar este acuerdo no es tan descabellado. ¿Debemos hacerlo?"
 uruguay.8.a:0 "Sí, trabajemos con nuestros nuevos aliados"
 uruguay.8.b:0 "No, tenemos otros planes"
 uruguay.9.t:0 "Argentina acepta nuestra propuesta"
 uruguay.9.d:0 "Nuestros diplomáticos han llegado hoy de vuelta a Montevideo con una gran noticia, Argentina acepta nuestra propuesta y ya somos oficialmente aliados."
 uruguay.9.a:0 "¡Genial!"
 uruguay.10.t:0 "Argentina rechaza nuestra propuesta"
 uruguay.10.d:0 "Nuestros diplomáticos han llegado hoy de vuelta a Montevideo con malas noticias, lamentablemente no aceptaron nuestra propuesta y no serán aliados nuestros."
 uruguay.10.a:0 "¡Están planeando algo, estoy seguro!"
 uruguay.11.t:0 "¡Acaban de reventar los camiones que transportaban a algunos de nuestros solidarios!"
 uruguay.11.d:0 "¡Camiones con algunos de nuestros soldados acaban de ser volados en Entre Ríos, cerca de la frontera con Uruguay! Después de una inspección más detallada se ha descubierto que los soldados uruguayos han cruzado la frontera y han colocado deliberadamente explosivos para hacerlos estallar. \n\nEsto es nada menos que un acto de terrorismo contra Argentina y el pueblo argentino y los uruguayos son más que conscientes de ello. \n\nNo podemos quedarnos con los brazos cruzados y dejar que se salgan con la suya, en pocas horas todos los argentinos se van a enterar de la atrocidad y van a pedir la guerra contra los uruguayos, ¿realmente vamos a ignorar así a nuestro pueblo?"
 uruguay.11.a:0 "¡Pagarán con cada centímetro de sangre que tengan!"
 uruguay.11.b:0 "Simplemente no estamos en condiciones de declararle la guerra a los uruguayos".
 uruguay.12.t:0 "Argentina no nos declaró la guerra como esperábamos que lo hiciera"
 uruguay.12.d:0 "Han pasado 24 horas y no ha habido respuesta de Argentina, y parece que no nos van a declarar la guerra para que Brasil nos ayude. \n\nTendremos que hacer frente a los argentinos sin ayuda, lo cual es algo que quizás no podamos hacer."
 uruguay.12.a:0 "No importa, seguiremos yendo a la guerra y ganaremos"
 uruguay.13.t:0 "Los uruguayos nos piden que nos unamos a su guerra contra Argentina"
 uruguay.13.d:0 "Los diplomáticos uruguayos han llegado hoy, presumiblemente más cansados de lo normal, pidiéndonos que nos unamos a su guerra contra Argentina. Nos han dicho que a cambio ganaremos Formosa por nuestra participación en la guerra. \n\n¿Debemos aceptar esta oferta?"
 uruguay.13.a:0 "¡Claro, los argentinos no tienen ninguna posibilidad!"
 uruguay.13.b:0 "No podemos permitirnos una guerra en este momento"
 uruguay.14.t:0 "Los paraguayos rechazaron nuestro pedido"
 uruguay.14.d:0 "Los paraguayos han dicho a nuestros diplomáticos que no se sumarán a la guerra contra Argentina, diciendo que no están en condiciones de estar en guerra en este momento"
 uruguay.14.a:0 "Entendible"
 uruguay.15.t:0 "Uruguay propone una forma de dividir Argentina"
 uruguay.15.d:0 "Diplomáticos uruguayos han llegado hoy para contarnos que tienen un plan para dividir Argentina. \n\nPara empezar, Uruguay ganará todas las provincias rioplatenses, que son Buenos Aires, Entre Ríos, Santa Fe, La Pampa, Neuquén, Río Negro, Chubut, Santa Cruz y Tierra del Fuego. \n\nGanaremos las provincias de Misiones y Corrientes, y el resto de Argentina se convertirá en un satélite nuestro. \n\n¿Debemos aceptar esta oferta de paz?"
 uruguay.15.a:0 "Claro, me parece justo"
 uruguay.15.b:0 "¡No, nosotros fuimos los que más trabajamos!"
 uruguay.16.t:0 "Brasil rechaza nuestra oferta de paz"
 uruguay.16.d:0 "Los brasileños han respondido a nuestros diplomáticos diciendo que no aceptarán estas ofertas de paz y que prefieren dividir a la Argentina de la manera en que lo hemos hecho ahora"
 uruguay.16.a:0 "Maldito seas Brasil..."
 uruguay.17.t:0 "¿Quién debe dirigir nuestra nación?"
 uruguay.17.d:0 "Con la guerra civil en pleno apogeo y nuestra nación sumida en el caos, se plantea una pregunta por encima de cualquier otra, ¿quién debe liderar el país? \n\nEl encarcelamiento de Terra ha provocado que el nuevo estado que se ha creado esté cerca de la anarquía, y necesitamos un líder fuerte lo antes posible. Debido a su encarcelamiento, los ideales democráticos y comunistas se extienden a todo el pueblo uruguayo que está en contra de Terra. \n\nEsta puede ser la última vez que el pueblo decida quién dirigirá la nación, así que tenemos que tomar la decisión correcta y rápida. Después de una elección apresurada, el ganador es..."
 uruguay.17.a:0 "El Consejo Provisionario Liderará por ahora"
 uruguay.17.b:0 "Eugenio Gómez liderará, representando los laburantes"
 uruguay.18.t:0 "[GetYear] Elecciones"
 uruguay.18.d:0 "A pesar de la situación que llevó a los partidos a formar la coalición, la presión de todos los sectores democráticos del país había ido aumentando sobre [URG.GetLeader], exigiendo el regreso de elecciones libres, con algunos radicales incluso reclamando que [URG.GetLeader] está tratando de mantener el poder para sí mismo y, cediendo a la presión, [URG.GetLeader] había programado elecciones para [GetYear]. \n\nAunque la situación en el país está lejos de ser estable, parece [URG.GetLeader] ha cumplido su promesa y, hoy, los votantes tuvieron que decidir entre votar por Emilio Frugoni, Luis Batlle Berres o Luis Alberto de Herrera. Mientras Frugoni y Batlle gozan de relativa popularidad entre la población, Luis Alberto de Herrera es visto por la mayoría de los liberales como un traidor al país, solo siendo defendido por aquellos que apoyaron a Terra. Sin embargo, todos los candidatos disfrutan de una buena base de votantes, dándoles a todos la oportunidad de ganar esta importante elección. \n\nEn [GetDateText], mientras se cuentan los votos, es casi obvio que..."
 uruguay.18.a:0 "¡Luis Batlle Berres ganó las elecciones!"
 uruguay.18.b:0 "¡Emilio Frugoni ganó las elecciones!"
 uruguay.18.c:0 "¡Luis Alberto de Herrera ganó las elecciones!"
 uruguay.19.t:0 "¡Renuncia Luis Batlle Berres!"
 uruguay.19.d:0 "Los crecientes esfuerzos de la oposición para bloquear sus intentos de reforma han afectado la popularidad y el poder de Batlle Berres dentro del partido. Utilizando esta situación a su favor, Andrés Martínez Trueba hizo un trato con Luís Alberto de Herrera del Partido Nacional, ganando su apoyo y aumentando aún más la presión contra Batlle Berres.\n\nHabiendo ganado suficiente poder después del trato con Herrera, Martínez comenzó a presionar a Batlle Berres para que le hiciera concesiones. Y finalmente, comenzó a presionar A sabiendas de que Martínez contaba con el control de ambas cámaras legislativas y el apoyo del Partido Nacional, hoy, al mediodía, el presidente Luis Batlle Berres anunció su renuncia en las Cámaras de Senadores y Diputados, seguida por la renuncia de su vicepresidente Alfeo Brum y todo su gabinete, sorprendiendo a la mayor parte de la nación. \n\nUsando su apoyo en el parlamento, Martínez logró ser elegido como presidente interino por una pequeña mayoría".
 uruguay.19.a:0 "Éxito"
 uruguay.20.t:0 "[GetYear] Referéndum Constitucional"
 uruguay.20.d:0 "Poco después de una semana de asumir la presidencia, Andrés Martínez propuso una reforma constitucional, que buscaba abolir la presidencia y sustituirla por un nuevo sistema basado en el Consejo Nacional de Administración, que fue abolido por Gabriel Terra en 1933. Esto se hizo para mantener su parte del trato con Herrera, ya que ambas partes habían acordado cooperar solo si el poder era compartido entre ambas partes.\n\nDicha reforma fue votada por la población una semana hace un referéndum, con las opciones de mantener la constitución como está o aceptar la nueva propuesta. Y después de contar los votos restantes, la Corte Electoral anunció hoy que el referéndum..."
 uruguay.20.a:0 "...¡Aprobado!"
 uruguay.20.b:0 "...¡¿Falló?!"
 uruguay.21.t:0 "Estancamiento político"
 uruguay.21.d:0 "Luego de los resultados del referéndum, las disputas políticas entre ambos partidos llevaron a la ruptura de la coalición entre el Partido Colorado y el Partido Nacional. Con los partidos Nacional y Colorado fracturados en facciones opuestas, tanto el parlamento como el poder ejecutivo se ha reducido a paso de tortuga, lo que hace que el gobierno no pueda tomar ninguna medida para aliviar las tensiones entre ambas partes y hace que la redada de los remanentes terroristas sea mucho más difícil. \n\nToda esta tensión ha llevado a un distanciamiento y Ambiente tenso en Montevideo, ya que las diferencias entre los partidos continúan creciendo y comienzan a aparecer grietas tanto en el nuevo gobierno como en el sistema democrático".
 uruguay.21.a:0 "¡Esto es un desastre!"
 uruguay.22.t:0 "¡El Gobierno se derrumba!"
 uruguay.22.d:0 "¡Ha sucedido lo impensable! Poco antes de que un mes de estancamiento político y disturbios hayan pasado factura tanto a la ciudadanía como al gobierno de Martínez. \n\nTras las protestas masivas en la Plaza Independencia y el Palacio Legislativo , Martínez ha anunciado su renuncia, seguida en breve por el resto de su gabinete. Cualquier intento del parlamento de nombrar un interino ha fracasado, debido a la falta de cooperación de la PN y la presión de la población civil descontenta ".
 uruguay.22.a:0 "¡¿Esto podría empeorar?!"
 uruguay.26.t:0 "Destino de Argentina"
 uruguay.26.d:0 "Después de nuestra victoria contra el gobierno argentino, muchos comienzan a preguntarse qué será de la República Argentina. [URG.GetLeader] ha convocado a una reunión de representantes comunales de Uruguay para llegar a un acuerdo sobre qué será de Argentina. Después de algunos debates, el consenso es que..."
 uruguay.27.d:0 "Después de nuestra victoria con Chile contra el gobierno argentino, muchos comienzan a preguntarse qué será de Argentina. [URG.GetLeader] ha convocado una reunión de representantes comunales de Chile y Uruguay para llegar a un acuerdo acuerdo sobre cómo dividir Argentina entre las dos comunas anarquistas. Después de algunos debates, el consenso es que..."
 uruguay.26.a:0 "Formaremos comunas en la región leales a la revolución."
 uruguay.26.b:0 "Dividiremos Argentina en dos regiones y formaremos comunas leales a la revolución."
 uruguay.26.c:0 "Integraremos a los argentinos en las comunas existentes."
 uruguay.27.t:0 "Repartiendo Argentina"
 uruguay.27.a:0 "Separaremos Argentina con Chile y ambos formaremos comunas leales a la revolución en nuestras regiones."
 uruguay.27.b:0 "Integraremos a los argentinos en nuestras comunas existentes, mientras que los chilenos hacen lo mismo".
 uruguay.28.t:0 "El Estado de la Economía"
 uruguay.28.d:0 "Desde su independencia en 1830, Uruguay ha sido una sociedad agraria, con la mayor parte de los ingresos provenientes de las estancias en el campo. Sin embargo, con la revolución industrial en Europa, las industrias extranjeras comenzaron a llegar a Uruguay, y con ellos, la maquinaria industrial, se inició un proceso de urbanización e industrialización centrado en la capital montevideana, a pesar de todo, la mayor parte de los ingresos de la nación aún provienen de las exportaciones agrícolas, que entraron en juego en la gran guerra. , donde Uruguay entró en una época dorada gracias a los ingresos de estas exportaciones.\n\nAhora, con las tensiones avecinándose tanto en Europa como en el resto del mundo, los economistas comenzaron a debatir si este sistema es sostenible a largo plazo o si es Es hora de que Uruguay se ponga al día con los tiempos modernos. Algunos miembros del gobierno también están preocupados de que un cambio drástico en nuestra economía pueda traer descontento entre la población rural y las élites".
 uruguay.28.a:0 "Si no está roto, no lo arregles"
 uruguay.28.b:0 "Debemos alcanzar al resto del mundo"
 uruguay.29.t:0 "El destino del Estado de Bienestar"
 uruguay.29.de:0 "A medida que continuamos creando proyectos para expandir nuestra situación económica, se ha vuelto más difícil mantener un superávit positivo en nuestro presupuesto anual. Con esto en mente, algunos miembros de nuestro gabinete han sugerido una reforma a la muchos programas de asistencia social patrocinados por el gobierno.\n\n\nEsto ha llevado a un debate controvertido, ya que estos programas son muy populares entre la gente y las reformas extensas podrían resultar muy impopulares. Algunos políticos también han argumentado que una abolición completa de estos programas nos permitiría industrializarnos rápidamente, pero esta acción podría generar una reacción negativa tanto de la población como de otros políticos".
 uruguay.29.a:0 "Mantener el sistema actual."
 uruguay.29.b:0 "Aprobar algunas reformas menores"
 uruguay.29.c:0 "Aprobar algunas reformas básicas"
 uruguay.29.d:0 "Aprobar reformas amplias"
 uruguay.29.e:0 "Abolir el sistema de bienestar"
 uruguay.30.t:0 "Carne en lata Fray Bentos"
 uruguay.30.d:0 "Fray Bentos es una marca de corned beef con origen en el Frigorífico Anglo Meatpacking de Río Negro, siendo su denominación originaria de la localidad de Fray Bentos, donde se encuentra ubicada. Dicha marca ha venido teniendo un notable éxito debido a las crecientes tensiones, con muchas naciones comenzando a almacenar productos enlatados en caso de una guerra total. \n\nEsto nos deja en una posición interesante, ya que muchas naciones están dispuestas a comprar nuestros productos, pero el tamaño limitado de la planta y la mano de obra significa que solo puede cubrir las demandas de una nación importante. Se podrían hacer argumentos para ayudar a cualquiera de las partes, pero también podría consumirse localmente si no podemos asegurar un comprador".
 uruguay.30.a:0 "Exportarlo a Gran Bretaña"
 uruguay.30.b:0 "Exportarlo a Alemania"
 uruguay.30.c:0 "Exportarlo a la Unión Soviética"
 uruguay.30.do:0 "Producirlo para consumo local en su lugar"
 uruguay.31.t:0 "¡Protestas nacionales estallan en guerra civil!"
 uruguay.31.d:0 "Después de más de un año de oposición de los blancos a nuestras acciones políticas, el barril de pólvora ha llegado a su punto de ebullición y ha explotado. \n\nLos simpatizantes de los blancos se han reunido por todo el país, capturando armas de nuestras reservas , y comenzó a atacar edificios gubernamentales y estaciones de policía locales. \n\n¡Necesitamos enfrentar esta insurrección inmediatamente antes de que se salga de control!"
 uruguay.31.a:0 "¡Pagarán por esto!"
 uruguay.32.t:0 "¡Protestas en Colorado estallan en guerra civil!"
 uruguay.32.d:0 "Después de más de un año de que los colorados se opusieron a nuestras acciones políticas, el barril de pólvora llegó a su punto de ebullición y explotó. \n\nLos partidarios de los colorados se han reunido en todo el país, capturando armas de nuestras reservas , y comenzó a atacar edificios gubernamentales y estaciones de policía locales. \n\n¡Necesitamos enfrentar esta insurrección inmediatamente antes de que se salga de control!"
 uruguay.32.a:0 "¡Pagarán por esto!"

# === [LocEditor:OrphanedKeys] Keys that do not exist in English ===
 usa.24.title:0 "El ocaso rojo"
 news.317.c:0 "Esto desbarata nuestros planes..."

 #### Perú ####
 peru.122.t:0 "Las elecciones peruanas de 1936"
 peru.122.d:0 "El 11 de octubre ha pasado más rápido de lo esperado y el día de las elecciones está encima. De todos los partidos que existen en nuestro país, 4 partidos principales se destacan del resto. \n\nEl primero es el Partido Socialdemócrata, liderado por Luis Antonio Eguiguren y que representa los ideales democráticos. \nEl siguiente es el Frente Nacional de Derecha, liderado por Jorge Prado Ugarteche, y representa ideales similares a los de Oscar. \nLa tercera opción es el Partido Unión Revolucionaria, liderado por Luis. A. Flores, y representa los ideales fascistas ultranacionalistas. \nLa última opción es la Alianza Acción Republicana, liderada por Manuel Vicente Villarán, que representa los ideales comunistas. \n\nDespués de una votación bastante reñida, el ganador de las elecciones de 1936 es..."
 peru.122.a:0 "Partido Socialdemócrata"
 peru.122.b:0 "Frente Nacional de Derecha"
 peru.122.c:0 "Partido Unión Revolucionaria"
 peru.122.e:0 "Alianza Acción Republicana"
 peru.123.t:0 "Los resultados de las elecciones han sido anulados"
 peru.123.d:0 "Aunque ya han votado más de 700.000 personas, Oscar Benavides ha decidido anular las elecciones y ha declarado que gobernará la nación durante 3 años más. \n}nLa razón de tan severa decisión se debe a las especulaciones de que el partido socialdemócrata, Partido Socialdemócrata, estaba utilizando el fraude electoral para obtener la mayoría de los votos. \n\nSi bien la mayoría de los partidos, incluido el de Eguiguren, aceptaron esta prórroga, a Unión Revolucionaria le disgustó mucho y muchos se están asustando de que puedan planear algo en un futuro próximo."
 peru.123.a:0 "Tres años más de Oscar es"

 peru.126.t:0 "[FROM.GetName] quisiera discutir una posible inversión con [Root.GetNameDef]!"
 peru.126.desc:0 "[FROM.GetName] envió un embajador diplomático para ofrecernos la oportunidad de invertir en su país. El embajador afirma que "Para que Sudamérica crezca, todas las naciones aquí deben trabajar de la mano". Además, promete que el gobierno de [FROM.GetAdjective] se inclinará más a nuestro favor con la aceptación de esta oportunidad. ¿Debemos aceptar su oferta?"
 peru.126.a:0 "Invertiremos una pequeña cantidad".
 peru.126.b:0 "Invertiremos una cantidad modesta".
 peru.126.c:0 "¡Ningún precio es demasiado grande para un amigo!"
 peru.126.d:0 "No podemos permitirnos malgastar nuestros recursos en este momento".
 peru.127.t:0 "¡FROM.GetNameDef] se niega!"
 peru.127.desc:0 "Debido a una multitud de razones, [De.GetNameDef] ha rechazado nuestra oferta de inversión, en su lugar declarando "Si bien la inversión no está en las cartas ahora mismo, nuestra opinión puede cambiar más adelante..."
 peru.127.a:0 "Desafortunado".
 peru.128.t:0 "[FROM.GetNameDef] Invierte una pequeña cantidad!"
 peru.128.desc:0 "¡Nuestra misión diplomática con [De.GetNameDef] ha dado sus frutos ya que han accedido a una pequeña inversión!"
 peru.128.a:0 "¡Muy apreciado!"
 peru.129.t:0 "¡[FROM.GetNameDef] invierte una modesta cantidad!"
 peru.129.desc:0 "¡Nuestra misión diplomática con [De.GetNameDef] ha dado sus frutos ya que han accedido a una modesta inversión!"
 peru.129.a:0 "Gracias".
 peru.130.t:0 "¡[FROM.GetNameDef] invierte una gran cantidad!"
 peru.130.desc:0 "¡Nuestra misión diplomática ante [De.GetNameDef] ha dado sus frutos, ya que han accedido a una gran inversión!"
 peru.130.a:0 "¡Muchas gracias!" 
 
 peru.131.t:0 "Día de las elecciones"
 peru.132.t:0 "Día de las elecciones"
 peru.131.desc:0 "Con la aprobación de la Asamblea Constituyente de una elección que determine quién dirige nuestro gobierno, se han formado dos grandes partidos democráticos que han estado alborotando a las masas para que voten en las elecciones. Ahora se han contado los ballets y el ganador de las elecciones es..."
 peru.132.desc:0 "Con la aprobación por parte de la Asamblea Constituyente de una elección que determine quién lidera nuestro gobierno, se han formado dos grandes partidos democráticos que han estado alborotando a las masas para que voten en la elección. Ahora se han contado los ballets y el ganador de las elecciones es..."
 peru.131.a:0 "¡El Frente Democrático Nacional!"
 peru.132.a:0 "¡El Movimiento Democrático Peruano!"
 
 peru.133.t:0 "¡Perú quiere firmar un Tratado de Libre Comercio con nosotros!"
 peru.133.desc:0 "Representantes diplomáticos de Perú han venido a nosotros con una oferta. Firmar un Tratado de Libre Comercio para aumentar el comercio entre nuestras naciones. Aceptarlo aumentaría las relaciones comerciales y probablemente conseguiría que Perú nos tuviera más cariño. Sin embargo, negar una petición tan insignificante probablemente agriaría las relaciones con Perú".
 peru.133.a:0 "¡Las barreras económicas entre nosotros deben desaparecer!"
 peru.133.b:0 "No tenemos intención de comerciar con ustedes".
 
 peru.134.t:0 "[FROM.GetNameDef] Está de acuerdo!"
 peru.134.desc:0 "[FROM.GetNameDef] ha acordado y firmado un Tratado de Libre Comercio con nosotros!"
 peru.134.a:0 "Que prosperemos juntos".

 peru.135.t:0 "[FROM.GetNameDef] se niega!"
 peru.135.desc:0 "[FROM.GetNameDef] se ha negado a firmar un Tratado de Libre Comercio con nosotros..."
 peru.135.a:0 "¡Ay!"
 
 peru.136.t:0 "¡Nuestra coalición se está derrumbando!"
 peru.136.desc:0 "¡Nuestra reciente deriva hacia la izquierda política ha hecho que muchos políticos conservadores y de derechas, que antes cooperaban con nosotros, abandonen nuestra coalición! Nuestro partido, antes unido, ya no lo está tanto..."
 peru.136.a:0 "No los necesitamos".
 
 peru.137.t:0 "[FROM.GetName] Quiere reformar nuestra vieja Confederación!"
 peru.137.d:0 "Figuras políticas de [FROM.GetName] se han puesto en contacto con nosotros, preguntando si estaríamos de acuerdo en reformar la Confederación Perú-Boliviana y combinar nuestras naciones en un intento de convertirse en el poder gobernante en el continente y tal vez las Américas en su conjunto. \n\nDesde hace un tiempo nuestras dos naciones se están acercando mucho, y es posible que podamos unificar nuestros dos países y convertirnos en la potencia que una vez fuimos. \n\nLa Confederación original estaba formada por tres naciones: El Estado Peruano del Norte, el Estado Peruano del Sur y Bolivia. Se estableció el 9 de mayo de 1836. \n\nAunque puede que nos encontremos con resistencia y que nuestros vecinos no sean tan amables como dicen ser, la cantidad de poder que ganaremos con esto será inmensa, y nuestro legado no estará muerto ya que seguiremos viviendo como un gobierno cooperativo. \n\n¿Deberíamos aceptar esta propuesta e intentar una vez más reformar la Confederación?"
 peru.137.a:0 "¡Es hora de recuperar nuestra antigua gloria!"
 peru.137.b:0 "No funcionó la última vez, ¿por qué iba a funcionar ahora?"

 peru.1.t:0 "[FROM.GetName] ha aceptado reformar la Confederación"
 peru.1.d:0 "Después de sólo unas horas, [FROM.GetName] ya ha respondido a nuestra propuesta, aceptando reformar la Confederación una vez más y tratar de establecernos como un estado soberano y establecer una postura dominante en la región, de la misma manera que la Confederación original quería hacer. \n\nEsta vez, sin embargo, tendremos éxito, no importa lo que nuestros enemigos nos lancen, ¡saldremos victoriosos y haremos lo que la Confederación original no pudo hacer!"
 peru.1.a:0 "¡El mundo conocerá nuestro verdadero poder combinado!"

 peru.2.t:0 "La Confederación Perú-Boliviana puede ser demasiado poderosa"
 peru.2.d:0 "Ha llegado la noticia de que la Confederación Perú-Boliviana, unión que fue erradicada hace casi todo un siglo, ha regresado y parece que con rencor para vengarse de sus enemigos. \n\nParece que son extremadamente poderosos y si permitimos que sigan sin ser salvados pueden alterar el equilibrio de poder en la región y causar estragos, y no podemos permitir que eso ocurra. \n\n¿Deberíamos intervenir y detener esta amenaza antes de que sea peor?"
 peru.2.a:0 "¡Los detendremos como lo hicimos la primera vez!"
 peru.2.b:0 "Simplemente no estamos preparados para la guerra"

 peru.3.t:0 "[FROM.GetName] se ha negado a reformar la Confederación"
 peru.3.d:0 "Funcionarios de [FROM.GetName] han respondido a nuestra propuesta de unión entre nuestras naciones, diciendo que tienen sus razones para no aceptarla y que sería mejor que se mantuvieran independientes. \n\nIncluso después de todo el esfuerzo que hicimos para mejorar los lazos para lograr esta hazaña, ¡y simplemente nos escupen y rechazan esta propuesta es francamente vergonzoso! \n\n¿Debemos responder con fuerza, o simplemente debemos dejar pasar la idea?"
 peru.3.a:0 "¡Estos bastardos tendrán su merecido!"
 peru.3.b:0 "Buscaremos una ruta diferente"

 peru.138.t:0 "[FROM.GetName] nos pide que estemos de su lado durante la segunda guerra del Pacífico"
 peru.138.d:0 "Oficiales de [FROM.GetName] nos dijeron que están planeando una invasión a Chile para recuperar sus tierras perdidas en la Guerra del Pacífico, y quieren que estemos de su lado cuando lancen esa invasión. \n\nAfirman que esta vez tendremos éxito y venceremos a los chilenos de una vez por todas y recuperaremos nuestras tierras perdidas. \n\nConsiderando que también perdimos territorio ante los chilenos, esta oportunidad parece única en la vida, así que ¿deberíamos aprovecharla? \n\nAviso: Si aceptamos, estaremos obligados a declarar la guerra a los chilenos cuando [FROM.GetName] lo haga. Si no lo hacemos, [FROM.GetName] puede declararnos la guerra".
 peru.138.a:0 "¡Acepta, declararemos la guerra en el momento en que ellos lo hagan!"
 peru.138.b:0 "Rechazar, no podemos permitirnos otra guerra"

 peru.4.t:0 "[FROM.GetName] ha aceptado nuestro tratado"
 peru.4.d:0 "[FROM.GetName] ha aceptado el tratado que les propusimos, y han accedido a declarar la guerra a los chilenos cuando lo hagamos nosotros. Con nuestras fuerzas combinadas no tendrán ninguna posibilidad!"
 peru.4.a:0 "¡Genial!"

 peru.5.t:0 "[FROM.GetName] ha rechazado unirse a la guerra"
 peru.5.d:0 "[FROM.GetName] no ha respetado nuestro pacto propuesto, diciendo que no están en condiciones de declarar la guerra. ¿Cómo debemos responder a su negativa?"
 peru.5.a:0 "¡Persigue a los bastardos que apuñalan por la espalda!"
 peru.5.b:0 "Dejalo ir, no necesitamos otro enemigo mas"
 
 peru.124.t:0 "[FROM.GetName] ha declarado la guerra y ahora nos toca actuar"
 peru.124.d:0 "[FROM.GetAdjective] las fuerzas han cruzado la frontera chilena hace unos minutos y se ha declarado una declaración oficial de guerra. \n\nDebido a nuestro pacto firmado hace unos meses, estamos obligados a unirnos a ellos en su esfuerzo de guerra, pero aún tenemos la opción de negarnos a unirnos. Tenemos que tener en cuenta que hacer tal acto de traición casi seguramente llevará a una declaración de guerra de [FROM.GetName]. \n\nDadas nuestras circunstancias, ¿qué debemos hacer?"
 peru.124.a:0 "¡Unirse a la guerra y aplastar a los chilenos!"
 peru.124.b:0 "Lo sentimos [FROM.GetName], pero esta vez tenemos que pasar"

 peru.6.t:0 "¿Debemos intervenir en la Segunda Guerra del Pacífico?"
 peru.6.d:0 "Para algunos puede parecer estúpido incluso considerar entrar en un estado de guerra contra Perú y Bolivia, pero después de una cuidadosa consideración los aspectos positivos realmente superan a los negativos. \n\nNo sólo eso, tener a Chile como aliado nos ayudará mucho en el futuro, y nuestras fuerzas combinadas destrozarán a Perú y Bolivia. \n\nEntonces, ¿debemos intervenir y ayudar a los chilenos?"
 peru.6.a:0 "¡Por supuesto! ¡Lima allá vamos!"
 peru.6.b:0 "Simplemente no podemos hacer tal cosa"

 peru.7.t:0 "[FROM.GetName] nos ayudará en la Segunda Guerra del Pacífico!"
 peru.7.d:0 "Es oficial, [FROM.GetName] ha declarado la guerra a Perú y Bolivia y nos ayudará oficialmente en nuestros esfuerzos de guerra. Es una gran noticia y gracias a la guerra de dos frentes nuestro frente se verá aliviado."
 peru.7.a:0 "¡Genial!"

 peru.8.t:0 "Nuestros enemigos han sido reducidos, la guerra se acerca a su fin"
 peru.8.d:0 "Después de muchos meses de guerra y muchas vidas perdidas, parece que estamos ganando a nuestros enemigos y nos están arrinconando. \n\nSin embargo, nuestro pueblo se está cansando rápidamente de la guerra y está protestando para detenerla. No sólo ellos, muchos de nuestros soldados están esquivando el reclutamiento y nuestros oficiales nos dicen que sus soldados se niegan a continuar con la guerra. \n\nDespués de una cuidadosa consideración, lo mejor para nosotros sería detener la guerra aquí y ejercer nuestro dominio en la guerra y obligar a nuestros enemigos a entregar el territorio que era integral para nosotros a cambio de las condiciones de paz. \n\n¿Iniciamos las conversaciones de paz?"
 peru.8.a:0 "Terminemos esta guerra de una vez por todas"
 peru.8.b:0 "¡Sigue adelante! No nos detendremos hasta que sean borrados del mapa!"

 peru.9.t:0 "Nuestros ejércitos están mutilados, ¿debemos detener esta guerra?"
 peru.9.d:0 "Después de meses de batalla, los ejércitos peruano-bolivianos han demostrado ser demasiado para los nuestros, y rápidamente se está convirtiendo en una carga para nosotros. \n\nLa moral de los soldados está en su punto más bajo. y el pueblo está unánimemente en contra de continuar esta guerra. \n\n¿Nos rendimos a los peruano-bolivianos, o debemos continuar?"
 peru.9.a:0 "No tenemos elección"
 peru.9.b:0 "¡Seguiremos hasta el amargo final!"


 peru.10.t:0 "[FROM.GetName] está dispuesto a rendirse"
 peru.10.d:0 "Los delegados de [FROM.GetName] han aceptado nuestras condiciones de paz y están de acuerdo en ceder tierras que nos pertenecen por derecho. Finalmente, nuestro camino hacia la gloria se ha despejado y nuestra guerra de independencia está un paso más cerca de ser concluido".
 peru.10.a:0 "Claro, aceptaremos sus condiciones de entrega"
 peru.10.b:0 "¡Aún no hemos terminado! ¡Sufrirán!"

 peru.11.t:0 "Estamos perdiendo la guerra"
 peru.11.d:0 "Después de perder a muchos de nuestros hombres y perder una buena parte de nuestro territorio, ha quedado bastante claro que simplemente no podemos ganar este conflicto. Pidamos conversaciones de paz con los beligerantes y lleguemos a un acuerdo con ellos: les damos su territorio principal a cambio de detener la guerra. \n\nSiempre tenemos la opción de continuar, pero en este momento no tiene mucho sentido seguir adelante. Entonces, ¿qué debemos hacer?"
 peru.11.a:0 "Rendirse"
 peru.11.b:0 "Seguir adelante"

 peru.12.t:0 "[FROM.GetName] está dispuesto a rendirse"
 peru.12.d:0 "[FROM.GetName] se ha acercado a nosotros, diciendo que están dispuestos a rendirse y ceder a nuestras demandas territoriales. \n\nConsiderando la cantidad de vidas que se perdieron y el hecho de que ya hemos ganado más terreno de lo esperado, entonces, ¿deberíamos aceptar sus términos de rendición?"
 peru.12.a:0 "Terminemos este conflicto de una vez por todas"
 
 peru.13.t:0 "[FROM.GetName] está solicitando una garantía"
 peru.13.d:0 "Delegados de [FROM.GetName] han llegado hoy a nuestro país para preguntar si podemos o no dar una garantía a su nación y garantizar su independencia en caso de una invasión extranjera. \n\nRecientemente han hecho un gran esfuerzo por mejorar sus relaciones con nosotros y con otras socialdemocracias del mundo, y les ayudaría tener un aliado en Sudamérica. \n\n¿Debemos aceptar y garantizar su independencia?"
 peru.13.a:0 "Claro"
 peru.13.b:0 "No podemos"
 
 peru.14.t:0 "[FROM.GetName] se ha negado a garantizarnos"
 peru.14.d:0 "[FROM.GetName] han respondido a nuestros delegados, declarando que no garantizarán nuestra independencia por razones que no fueron mencionadas. ¿Podría esto significar algo?"
 peru.14.a:0 "Supongo que simplemente tenemos que aceptarlo"

 peru.15.t:0 "[FROM.GetName] pide [490.GetName] a cambio de la invitación y garantía de la facción"
 peru.15.d:0 "Delegados de [FROM.GetName] han venido hoy a nuestra nación para preguntar si estamos dispuestos a darles [490.GetName] a cambio de protección y una invitación de facción. La fuerza de [FROM.GetName] es innegable, y rechazarla parece ridículo, sin embargo, no deberíamos rendirnos tan fácilmente. \n\n¿Deberíamos aceptar esta oferta?"
 peru.15.a:0 "Claro"
 peru.15.b:0 "No podemos renunciar a nuestra tierra tan fácilmente"

 ### Eventos genéricos de aceptación/rechazo ### 

 peru.16.t:0 "[FROM.GetName] Ha Aceptado Nuestra Propuesta"
 peru.16.d:0 "[FROM.GetName] acaba de responder a nuestros delegados, diciendo que aceptan nuestra propuesta y sus efectos se producirán en breve."
 peru.16.a:0 "Me alegra que hayamos podido hacer esto diplomáticamente"

 peru.17.t:0 "[FROM.GetName] ha rechazado nuestra propuesta"
 peru.17.d:0 "[FROM.GetName] acaba de responder a nuestros delegados, diciendo que no aceptan nuestra propuesta y se niegan a continuar cualquier conversación relacionada con el tema."
 peru.17.a:0 "¡No se saldrán con la suya!"
 peru.17.b:0 "Que se vayan"

 ### Eventos genéricos de aceptación/rechazo ### 

 peru.18.t:0 "[FROM.GetName] está pidiendo voluntarios"
 peru.18.d:0 "Varios delegados de [FROM.GetName] han llegado hoy a nuestro país para una petición bastante sencilla, que les enviemos voluntarios. \n\nActualmente [FROM.GetName] está en la Segunda Guerra del Pacífico y los delegados afirman que necesitan toda la ayuda posible, y debido a nuestros gobiernos similares, creen que podemos ayudarles. \n\n¿Deberíamos enviarles algunos voluntarios?"
 peru.18.a:0 "Enviarles 3 voluntarios"
 peru.18.b:0 "Enviarles 6 voluntarios"
 peru.18.c:0 "No les envíes ayuda"

 peru.19.t:0 "[FROM.GetName] Acepta Enviar 3 Voluntarios"
 peru.19.d:0 "[FROM.GetName] ha accedido a nuestra petición de voluntarios y ha enviado 3 para ayudarnos en nuestros esfuerzos de guerra. Estos voluntarios han sido transferidos directamente a nuestro mando y podemos utilizar a estos hombres como queramos para la guerra."
 peru.19.a:0 "¡Genial!"

 peru.20.t:0 "[FROM.GetName] Acepta enviar 3 voluntarios"
 peru.20.d:0 "[FROM.GetName] ha accedido a nuestra petición de voluntarios y ha enviado 6 para ayudarnos en nuestros esfuerzos de guerra. Estos voluntarios han sido transferidos directamente a nuestro mando y podemos utilizar a estos hombres como queramos para la guerra."
 peru.20.a:0 "¡Increíble!"

 peru.21.t:0 "[FROM.GetName] se ha negado a enviarnos voluntarios"
 peru.21.d:0 "[FROM.GetName] ha respondido a nuestros delegados, diciendo que se niegan a enviarnos voluntarios y que debemos buscar ayuda en otra parte."
 peru.21.a:0 "Todo eso para nada"

 news.342.t:0 "La Segunda Guerra de la Confederación"
 news.342.d:0 "A pocos días de la reforma de la Confederación Perú-Boliviana, varios países sudamericanos como Argentina, Chile, Ecuador y Colombia, le han declarado la guerra a la confederación. La razón por la que estas naciones declararon la guerra al país tan rápidamente fue que creen que esto alteraría el equilibrio de poder en la región, al mismo estilo que la Guerra de la Confederación original.  \n\nTal y como está la situación actualmente, parece muy poco probable que la Confederación gane este conflicto y siga siendo independiente. \n\nSólo el tiempo dirá lo que ocurrirá en este conflicto masivo, sin embargo, es justo suponer que resultará muy sangriento."
 news.342.a:0 "¿CUÁNTAS CONFEDERACIONES HAY?"
 news.342.b:0 "¡Puede que hayamos perdido la primera vez, PERO NO PERDEREMOS LA SEGUNDA!"
 news.342.c:0 "¡Los derrotamos una vez, podemos derrotarlos una segunda vez!"

 news.343.t:0 "La Segunda Guerra del Pacífico"
 news.343.d:0 "Después de las crecientes escaladas militares y tensiones entre Chile y Perú, el límite se rompió hoy después de que las fuerzas peruanas cruzaran la frontera chilena y se declarara una declaración oficial de guerra sólo 2 horas después. Teniendo en cuenta el clima social de Sudamérica, parece muy poco probable que Perú y Chile sean los únicos combatientes en este conflicto, ya que Colombia y Ecuador parecen estar armando también sus fuerzas. Mucha gente está etiquetando rápidamente este conflicto como "el más mortífero de la historia de Sudamérica", y por lo que parece, no se equivocan. \n\nLo que queda por hacer es simplemente dejar pasar el tiempo y ver cómo se desarrolla el conflicto. Una cosa es segura, y uno de los dos bandos ganará mucho poder con esto".
 news.343.a:0 "¿Qué te pasa, Sudamérica?"
 news.343.b:0 "¡Es hora de recuperar nuestras tierras perdidas!"
 news.343.c:0 "¡Estos mongers de guerra perderán como la primera vez! VIVA CHILE!"
 news.343.d:0 "¡Necesitamos ayudar a nuestros hermanos chilenos! Hay que parar a estos belicistas!"

 news.344.t:0 "Ecuador y Bolivia se han unido a la segunda guerra del Pacífico"
 news.344.d:0 "Rápidamente se difundió la noticia de que las fuerzas colombianas y ecuatorianas cruzaron la frontera peruana y se unieron oficialmente a Chile en su lado de la guerra. \n\nEl mundo está conmocionado al ver que lo que antes se consideraba un continente relativamente tranquilo se sale de control. \n\nPor ahora, sólo tenemos que esperar y ver cómo se desarrolla todo esto".
 news.344.a:0 "¡¿Qué demonios está pasando?!"
 news.344.b:0 "¿QUÉ? Estos bastardos pagarán con su sangre".
 news.344.c:0 "¡Estamos juntos, y juntos ganaremos!"

 news.345.t:0 "El renacimiento de [FROM.GetNameDEF]"
 news.345.d:0 "Tras permanecer inactivo durante casi un siglo, [FROM.GetNameDEF] se ha reformado y parece más poderoso que nunca. Varios países sudamericanos ya están expresando su descontento con esta repentina reforma de un sindicato antes muerto, y muchos más están aterrorizados por el poder que tiene. \n\nLa gente no sabe todavía lo que va a pasar con la reforma de [FROM.GetNameDEF], y lo único que podemos hacer es esperar que no se convierta en algo sangriento."
 news.345.a:0 "¿Otra Confederación?"
 news.345.b:0 "Nuestro camino a la gloria se ha despejado, ¡ahora el mundo verá nuestro poder!"
 news.345.c:0 "Esto puede ser muy malo, parecen demasiado poderosos"

 peru.22.t:0 "Perú está dispuesto a comprar Arica"
 peru.22.d:0 "Diplomáticos peruanos han llegado hoy a Santiago, ofreciendo grandes sumas de dinero y un sector de su economía civil a cambio de nuestro territorio de Arica. \n\nArica ha estado bajo nuestro control desde nuestra victoria en la Guerra del Pacífico. Durante todo este tiempo, Perú ha estado reclamando esta tierra como su territorio principal. \n\nAhora que las tensiones se han calmado, van a dar una gran suma de dinero a cambio de Arica. \n\n¿Deberíamos aceptar su oferta?"
 peru.22.a:0 "Claro, que lo acepten"
 peru.22.b:0 "¡No entregaremos nuestras tierras tan fácilmente!"

 peru.23.t:0 "Perú ofrece una garantía y una invitación a su facción a cambio de Arica"
 peru.23.d:0 "Diplomáticos peruanos han llegado hoy a Santiago para una propuesta bastante interesante. Nos ofrecerán protección militar y una invitación a su facción a cambio del territorio de Arica. \n\nConsiderando que ya somos bastante fuertes militarmente y que realmente no necesitamos protección extranjera, mucho menos de una nación sudamericana, ¿es prudente aceptar este trato?"
 peru.23.a:0 "Si significa estar unidos como continente, cualquier sacrificio territorial está bien"
 peru.23.b:0 "Absolutamente no"

 peru.24.t:0 "Nuestro Golpe de Estado ha sido exitoso, ¿ahora qué debemos hacer con Oscar?"
 peru.24.d:0 "Después de nuestro golpe exitoso y ahora estando en el poder absoluto de la nación, una pregunta queda en pie: ¿qué debemos hacer con Oscar Benavides? \n\nAlgunos dicen que hay que colgarlo públicamente y demostrar a sus partidarios que estamos al mando. Otros sugieren que le obliguemos a retirarse, y algunos dicen que simplemente le dejemos seguir como general en el ejército. \n\nCon todas estas opciones a nuestra disposición, ¿qué debemos hacer?"
 peru.24.a:0 "Colgarlo públicamente"
 peru.24.b:0 "Obligarlo a retirarse"
 peru.24.c:0 "Dejar que se quede en el ejército"

 peru.25.t:0 "[FROM.GetName] nos pide permiso para comprar uno de nuestros barcos"
 peru.25.d:0 "Diplomáticos de [FROM.GetName] han venido a nuestra nación para pedirnos permiso para comprar uno de nuestros barcos. Están dispuestos a pagar una suma bastante grande por nuestras naves y nos prometen que pagarán cada centavo que les cobremos por cualquiera de nuestras naves. \n\n¿Debemos aceptar a su oficial?"
 peru.25.a:0 "Aceptar"
 peru.25.b:0 "Declinar"

 peru.26.t:0 "[FROM.GetName] nos ha dado permiso para comprar uno de sus barcos"
 peru.26.d:0 "[FROM.GetName] ha respondido a nuestros diplomáticos y nos ha dado luz verde para comprar uno de sus barcos"
 peru.26.a:0 "¡Ahora nuestra Armada crecerá de verdad!"

 peru.27.t:0 "[FROM.GetName] no nos ha dado permiso para comprar uno de sus barcos"
 peru.27.d:0 "[FROM.GetName] han respondido a nuestros diplomáticos, diciendo que no permitirán la compra de sus barcos y que prefieren mantenerlos bajo su gestión".
 peru.27.a:0 "Mejor suerte la próxima vez"

 peru.28.t:0 "¿Quién dirigirá nuestro imperio?"
 peru.28.d:0 "Ahora que hemos asegurado nuestro lugar en el continente sudamericano, necesitamos elegir un líder. Si bien es cierto que tenemos a nuestro señor Inti como líder, en la era moderna puede ser sabio tener un verdadero y sabio líder que dirija este renacimiento de nuestro imperio, tal como lo hizo el imperio original. \n\nPodríamos decir que sería el representante de Inti, derribando a los enemigos en nombre de Apu-punchau. Hasta ahora, tenemos dos posibles contendientes para liderar nuestro imperio. \nEl primero es Juan Velasco Alvarado, un genio militar y con un origen nativo que encajaría perfectamente para liderar nuestro imperio. \nPor otro lado tenemos a José Luis Bustamente, un hábil economista que también tiene antecedentes nativos. \n\nTambién podríamos simplemente no elegir un líder y dejar que Apu-punchau nos lleve a la gloria final. Al final, el ser sho nos dirigirá es... "
 peru.28.a:0 "Juan Velasco Alvarado"
 peru.28.b:0 "José Luis Bustamente y Rivero"
 peru.28.c:0 "¡Los míseros humanos no sabrán llevarnos a la gloria!"
 peru.28.e:0 "Pachacutec el Segundo"
 peru.28.f:0 "Dejar a Ricardo en Poder"

 peru.29.t:0 "Las Hostilidades Entre el Ejército y la Armada se han Calmado"
 peru.29.d:0 "Las hostilidades entre nuestro ejército y la marina que nos vienen perjudicando desde hace un tiempo por fin se han calmado. Muchos sectores del ejército y de la marina están ahora de acuerdo ideológicamente y han decidido dejar esta rivalidad infantil. \n\nAhora que nuestro ejército y nuestra marina colaboran entre sí, podemos empezar a fomentar realmente un Estado peruano fuerte, que sea temido y respetado por nuestros vecinos."
 peru.29.a:0 "Por fin podemos estar tranquilos"

 peru.30.t:0 "La Guerra Civil ha Comenzado"
 peru.30.d:0 "La guerra civil peruana ha comenzado oficialmente. Nuestra campaña para establecer un régimen fascista ha llegado a su punto álgido, aquí o ganamos y gobernamos la nación, o morimos luchando. No importa cuál sea el resultado, tenemos que asegurarnos de darlo todo. Estos cerdos capitalistas no durarán mucho si damos todo lo que tenemos, ¡eso es seguro!"
 peru.30.a:0 "¡Soldados, a la Victoria!"

 peru.31.t:0 "¡Nuestro Golpe fue un Éxito!"
 peru.31.d:0 "Hemos tomado pacíficamente la nación, sin derramar una sola gota de sangre. Esta victoria será celebrada durante décadas, y una nueva era para el Perú acaba de comenzar. Demostraremos a todo el mundo que el fascismo puede realmente llevar a una nación a la grandeza, ¡seremos el ejemplo para todos estos cerdos capitalistas y comunistas que nos rodean!"
 peru.31.a:0 "¡Lo hemos conseguido!"

 peru.32.t:0 "¿Quién nos Llevará a la victoria?"
 peru.32.d:0 "Como pueblo y ejército del Perú, tenemos que hacer una elección muy importante. Tenemos que decidir quién asumirá el papel de líder del régimen fascista, y conducirá a nuestra nación a la gloria. \n\n[ROOT.GetPeruSituation]"
 peru.32.a:0 "Eloy Ureta será el nuevo líder"
 peru.32.b:0 "Luis A. Flores debe seguir liderando"

 PRU_civil_war_situation:0 "Por un lado, tenemos a Luis A. Flores, un líder robusto que ya ha demostrado su valía en el campo y con su capacidad de liderazgo. \n\nPor otro lado, tenemos a Eloy Ureta, un líder inteligente que podría utilizar su ingenio para superar al enemigo. \n\nLa guerra civil está en pleno apogeo, así que tenemos que hacer una elección rápida, el líder de nuestra nación será..."
 PRU_peaceful_coup_situation:0 "Por un lado, tenemos a Luis A. Flores, un líder con talento que sabe dirigir con puño de hierro. \n\nPor otro lado, tenemos a Eloy Ureta, un líder capaz que con su ingenio e inteligencia podría mejorar mucho nuestra economía, nuestro ejército y la estabilidad general del país. \n\nCon esta elección en nuestras manos, el líder de nuestra nación será..."

 peru.33.t:0 "[FROM.GetName] Quiere comprar nuestros Tanques"
 peru.33.d:0 "Delagados de [FROM.GetName] han viajado a través del mundo para venir a nuestra nación y preguntarnos si pueden comprar algunos de nuestros tanques. Han visto nuestro arsenal y están muy satisfechos con nuestros tanques, especialmente los ligeros, y han declarado que están dispuestos a pagar una suma decente por algunos. \n\n¿Debemos aceptar su oferta?"
 peru.33.a:0 "Dejenlos comprar Buenos Tanques"
 peru.33.b:0 "Dejenlos comprar Tanques"
 peru.33.c:0 "No le dejemos comprar nada!"

 peru.34.t:0 "La elección entre Eudocio y Del Prado"
 peru.34.d:0 "Con nuestros esfuerzos en pleno apogeo, debemos hacer una elección en cuanto a quién dirigirá nuestro movimiento. \n\nPodemos elegir entre Eudocio Ravines y Jorge del Prado Chávez, ambos reconocidos y respetados individuos con sus propias ambiciones y metas. \n\n¿A quién elegiremos?"

 peru.35.t:0 "El gobierno peruano inicia acciones represivas contra nosotros"
 peru.35.d:0 "Algunos de nuestros leales camaradas infiltrados en el gobierno nos han informado de que [ROOT.GetLeader] ha ordenado al ejército que inicie registros a gran escala por todo el país para rastrear y dar caza a cualquiera de nuestros partidarios. \n\nNo será fácil, pero tenemos que hacer todo lo posible para detener a [ROOT.GetLeader] y asegurarnos de que el pueblo obtenga la libertad que merece".
 peru.35.a:0 "Malditos Bastardos"

 peru.36.t:0 "Gobierno persiguió a algunos de nuestros partidarios"
 peru.36.d:0 "Nos han informado que el gobierno ha capturado y encarcelado a algunos de nuestros partidarios, perjudicando nuestro apoyo y causa a nivel nacional."
 peru.36.a:0 "¡Pagarán por eso!"

 peru.37.t:0 "¡Hemos tomado el poder con éxito!"
 peru.37.d:0 "Después de meses de preparativos y de reforzar el apoyo nacional, el pueblo decidió que ya era suficiente y en combinación con su apoyo y nuestro liderazgo, tomamos el control del país. El ex gabinete y sus miembros fueron obligados a abandonar sus cargos y de ahora en adelante podremos gobernar el Perú y llevarlo a un camino de grandeza."
 peru.37.a:0 "¡Fantástico!"

 peru.38.t:0 "El Gobierno Reprimio Nuestro Movimiento"
 peru.38.d:0 "Aunque hicimos todo lo posible para subvertir la atención del gobierno y ganar el apoyo de cada peruano, simplemente no fue suficiente. El gobierno ha descubierto nuestros planes y está encarcelando en masa a cada uno de nuestros partidarios. \n\nDebemos hacer algo, y rápido".
 peru.38.a:0 "¡Todos a las Armas! Luchen por su Libertad!"

 peru.39.t:0 "[PRU.GetName] Invadió [CHL.GetName], ¡Ahora es nuestra Oportunidad!"
 peru.39.d:0 "Nos ha llegado la noticia de que [PRU.GetAdjective] ha cruzado la frontera de [CHL.GetAdjective]. Esta sería nuestra oportunidad de oro para intervenir y recuperar lo que es legítimamente nuestro!"
 peru.39.a:0 "¡Hagámoslo!"
 peru.39.b:0 "No podemos arriesgarnos"

 peru.40.t:0 "La elección entre Haya y Eguiguren"
 peru.40.d:0 "Debemos elegir entre tener a Haya de la Torre como líder, o a Luis Antonio Eguiguren Escudero como líder del Partido Socialdemócrata. \n\n¿Quién nos llevará a la grandeza?"


 peru.254.t:0 "¡Los Fascistas están Enfurecidos por la Anulación de las Elecciones!"
 peru.254.d:0 "Los fascistas han dejado muy claro su descontento por la anulación de las elecciones, casi demasiado claro. \n\nPersonas infiltradas entre sus filas nos han informado de que están planeando una guerra civil en toda regla para intentar derrocar a nuestro gobierno. \n\nTenemos que asegurarnos de que eso no ocurra, pase lo que pase."
 peru.254.a:0 "¡Pagarán por esto!"

 chile.20.t:0 "[FROM.GetName] quiere que nos unamos a la Comintern"
 chile.20.d:0 "Diplomáticos de [FROM.GetName] se han puesto en contacto con nosotros para preguntarnos si estamos dispuestos a unirnos a la Comintern. Ellos también se han unido a la Comintern y nos dicen que también nos unamos a la Comintern. Dicen que los soviéticos estarían encantados de aceptarnos en su facción. \n\n¿Debemos aceptar esta oferta?"
 chile.20.a:0 "Claro, nos uniremos con gusto"
 chile.20.b:0 "¡No representan nuestros ideales!"

 chile.21.t:0 "La formación del Frente Popular"
 chile.21.d:0 "Se ha difundido la noticia de que hoy se cumple el primer día de existencia del Frente Popular como partido político en Chile. Este nuevo partido consiste en una coalición de la mayoría de los partidos comunistas que combinan sus fuerzas en un gran partido mayoritario. El responsable de este nuevo partido político es Pedro Aguirre Cerda. \n\nDesafortunadamente, no tenemos información actual sobre cómo reaccionarán los fascistas a la formación de este nuevo partido, pero por lo que se ha visto anteriormente, no será bonito. Nuestro gobierno también tiene que estar atento, ya que este nuevo partido está ganando rápidamente popularidad entre los ciudadanos chilenos."
 chile.21.a:0 "Interesante..."

 chile.22.t:0 "Los nacistas protestan por la supresión de su partido"
 chile.22.d:0 "Después de varios intentos de suprimir el movimiento político Nacista, muchos de sus miembros protestan por esta acción, y lo hacen tomando el control de una de nuestras provincias. Tal acto no será tolerado, y tenemos que lidiar con su pequeño acto tan rápido como sea posible antes de que se vuelvan demasiado poderosos!"
 chile.22.a:0 "¡Pagarán por esto!"

 chile.23.t:0 "Los comunistas protestan por la supresión de su partido"
 chile.23.d:0 "Después de nuestros diversos intentos de suprimir el partido comunista, sus miembros se han enfurecido contra nuestro gobierno y han decidido demostrarlo ocupando por la fuerza una de nuestras provincias. Este acto no se tomará a la ligera, ¡y se les responderá con la fuerza bruta!"
 chile.23.a:0 "¡Pagarán por esto!"

 chile.25.t:0 "Los nacistas exigen mayor representación política"
 chile.25.d:0 "Varios dirigentes políticos del partido Nacista se han presentado en nuestra sede, exigiendo que su partido esté debidamente representado entre nuestro gobierno y el pueblo. También han manifestado que si no accedemos a sus demandas, utilizarán la fuerza para conseguir lo que quieren. \n\nLa decisión está en nuestras manos: ¿acatamos sus demandas o las ignoramos?"
 chile.25.a:0 "Aceptar sus demandas"
 chile.25.b:0 "Ignorarlas"

 chile.26.t:0 "Los comunistas exigen mayor representación política"
 chile.26.d:0 "Varios dirigentes políticos del partido comunista han llegado a nuestra sede principal, exigiendo que se aumente el reconocimiento de su partido en todo nuestro gobierno, y en todo el pueblo. Afirman que su partido es más popular que lo que representa nuestro gobierno, y que utilizarán la fuerza si no escuchamos sus demandas. \n\n¿Qué debemos hacer, aceptar o ignorar sus demandas?"

 chile.28.t:0 "Los nacistas aumentan su poder político"
 chile.28.d:0 "Nos ha llegado la información de que después de varias campañas de propaganda ilegal y diversos niveles de corrupción, los Nacistas han aumentado su representación política en nuestro gobierno. \n\nTenemos que tener cuidado, si les permitimos seguir haciendo acciones como estas, solo el tiempo dirá si seguiremos teniendo el control total de nuestra nación."
 chile.28.a:0 "Parece que tienen intenciones bastante nefastas"

 chile.29.t:0 "Los comunistas aumentan su poder político"
 chile.29.d:0 "Nos llega la información de que tras varias campañas de propaganda ilegal y diversos niveles de corrupción, los comunistas han aumentado su respectiva representación política en nuestro gobierno. \n\nSi esta situación continúa, o incluso se agrava, ¡estaremos en serios problemas!"
 chile.29.a:0 "Sí, esas son unas intenciones muy nefastas"

 chile.30.t:0 "El debate político se ha desatado entre los fascistas y los comunistas"
 chile.30.d:0 "Hoy mismo, varios dirigentes políticos de ambos bandos se han enzarzado en una fuerte discusión, en la que algunos han llegado a pelearse. Por lo que nos dice nuestra inteligencia, esto dará lugar a una fase temporal de campañas de propaganda dirigidas el uno contra el otro. \n\nAunque cualquier resultado puede ser beneficioso para nuestro gobierno, tenemos que tener cuidado ya que al pueblo chileno no le gustará tanto caos dentro de nuestro gobierno. Esperemos que las cosas no se pongan violentas".
 chile.30.a:0 "Esperemos una paz duradera..."

 chile.31.t:0 "Los nacistas exigen que cerremos la economía"
 chile.31.d:0 "Varios dirigentes políticos del partido fascista exigen que cerremos la economía para los extranjeros, alegando que los recursos chilenos están "hechos por y sólo para el pueblo chileno". Estas exigencias extremas se deben a que su movimiento político está ganando una gran fuerza, y saben muy bien que tienen el suficiente respaldo para hacer estas insensatas exigencias. \n\nLa decisión está en nuestras manos, ¿debemos cumplirlas o simplemente ignorarlas?"
 chile.31.a:0 "Cumplir con sus demandas"
 chile.31.b:0 "Ignorar sus demandas"

 chile.32.t:0 "Los nacistas exigen mayor representación parlamentaria
 chile.32.d:0 "Después de ganar popularidad masiva en todo el país y convertirse en un partido político importante en nuestra nación, los Nacistas están exigiendo que se les represente con un margen mucho mayor en nuestro parlamento. \n\nSu poder parece crecer sin parar, y eso nos preocupa mucho. Un poco más de poder y supondrán una seria amenaza."
 chile.32.a:0 "Ceder a sus demandas"
 chile.32.b:0 "¡No conseguirán lo que quieren!"

 chile.33.t:0 "Los Comunistas Exigen el Equilibrio de Nuestras Clases Sociales"
 chile.33.d:0 "Desde la creación de esta nación, nuestras clases sociales han estado muy desproporcionadas. Debido a diversas políticas económicas, este problema no ha hecho más que agravarse, y ahora que los comunistas tienen un dominio sobre la escena política del país, exigen que equilibremos estas clases y rápido. \n\nNos dan un plazo bastante estricto para hacerlo, sin embargo, incluso ellos reconocen la dificultad de la tarea y ofrecieron su ayuda para resolver de una vez por todas esta cuestión tan antigua. \n\n¿Debemos escuchar sus demandas o ignorarlas?"
 chile.33.a:0 "Escuchar sus demandas"
 chile.33.b:0 "Ignorar sus demandas"

 chile.34.t:0 "Los Comunistas Exigen Aumentar los Planes de Bienestar"
 chile.34.d:0 "Después de ganar popularidad masiva entre el pueblo chileno, los comunistas vuelven a acudir a nosotros con una demanda bastante extrema. Aumentar nuestros planes de bienestar, especialmente a los pobres. \n\nLos comunistas están tratando de abusar de su poder, y el hecho de que no podamos hacer mucho es lo peor. Por ahora, todo lo que podemos hacer es escuchar y acatar sus demandas, o simplemente ignorarlas y esperar lo mejor".
 chile.34.a:0 "Cumplir"
 chile.34.b:0 "Ignorarlos"

 chile.35.t:0 "Los Chilenos se Preparan para las Elecciones de 1938"
 chile.35.d:0 "Cuando falta más de un año para las elecciones de 1938, el pueblo ya ha comenzado a prepararse para los próximos comicios. Los partidos políticos también se preparan, colgando carteles por todas partes y varios líderes políticos dando discursos por toda la nación. \n\nAunque la mayoría de las elecciones son un momento para celebrar un nuevo líder, esta vez muchos están preocupados por el resultado de estas elecciones. Especialmente debido a la agresividad entre los comunistas y los fascistas dentro de la nación. \n\nMientras las cosas resulten pacíficas, todo irá bien. Sin embargo, sólo el tiempo dirá si eso es realmente así".
 chile.35.a:0 "Esperemos que las elecciones sean pacíficas"

 chile.36.t:0 "Los Nacistas Ganan las Elecciones"
 chile.36.d:0 "Después de unas elecciones muy reñidas y del recuento de todos los votos, los Nacistas sorprendieron a todos al salir vencedores. Si hubo corrupción o no, no lo podemos saber por ahora. \n\nLo que sí es seguro es que su victoria aumentará las tensiones en toda América Latina y, sobre todo, entre las potencias aliadas. \n\n¡Basta de estos malditos demócratas, es hora de que Chile se convierta en la potencia que merece! Nuestros enemigos temblarán de miedo al ver la bandera chilena".
 chile.36.a:0 "Es hora de brillar de verdad"

 chile.37.t:0 "El Frente Popular Gana las Elecciones"
 chile.37.d:0 "Tras una votación muy reñida, los comunistas se han impuesto. Su victoria, sea veraz o no, se ha producido con toda seguridad y en breve tomarán el poder en Chile. \n\nSi esto agitará las tensiones en la región o no, desgraciadamente no lo sabemos todavía. Sin embargo, una cosa segura es que las cosas cambiarán mucho en Sudamérica. \n\nEs hora de que hagamos resurgir a Chile de sus cenizas y le demos al pueblo verdadera libertad. Empoderamiento de la clase trabajadora".
 chile.37.a:0 "Es hora de mostrar a Sudamérica de qué estamos hechos"

 chile.38.t:0 "Los Demócratas Ganan las Elecciones una Vez Más"
 chile.38.d:0 "Tras una votación bastante ajustada, nuestro gobierno ha vuelto a imponerse a nuestra oposición y se mantendrá en el poder durante otros 4 años. \n\nSi bien la suerte estuvo de nuestro lado esta vez, no se puede decir lo mismo de la oposición, ya que puede intentar hacer algo para interrumpir nuestro segundo mandato. Sea como sea, tenemos que estar preparados para todo y no permitir que nadie nos supere".
 chile.38.a:0 "Otros cuatro años"

 chile.39.t:0 "Se Formó la Alianza Popular Libertadora"
 chile.39.d:0 "se ha extendido por todo el país la noticia de que el MNS se ha disuelto y que para ocupar su lugar está la Alianza Popular Libertadora, (APL) para abreviar. \n\nEl partido también ha decidido elegir como líder a Carlos Ibáñez del Campo, antiguo ex presidente de Chile. Sus ideales autoritarios habían suscitado polémica en el pasado, y lo mismo está ocurriendo ahora, ya que muchos de nuestro propio gobierno y del partido comunista están denunciando su llegada al poder una vez más. \n\nPor ahora, esperemos que la situación se calme y podamos tener un período electoral pacífico".
 chile.39.a:0 "¿Otro cambio de nombre del partido?"

 chile.40.t:0 "El Gobierno ha Suprimido a Nuestro Partido"
 chile.40.d:0 "El gobierno Chileno se equivoco gravemente por suprimir nuestro partido político. Esto ha sido una acción abiertamente ilegal y un escupitajo en la cara a nuestra libertad de expresión. \n\nA pesar de que lo que hicieron estuvo mal, no podemos entrar en una furia incontrolable y derrocar al gobierno, ya que muchos morirían haciendo tal cosa, y desperdiciar tantas vidas por algo tan insignificante simplemente no es inteligente. \n\nEso no significa que no vayamos a estar tranquilos, ¡pronto se arrepentirán de haber tomado esas acciones!"
 chile.40.a:0 "¡Lo pagarán!"

 chile.42.t:0 "Chile está dispuesto a pagar mucho por la Patagonia"
 chile.42.d:0 "Funcionarios chilenos se han acercado a nosotros con una oferta muy repentina. Están dispuestos a pagar no sólo 4 fábricas civiles, sino también diversos beneficios económicos durante más de medio año a cambio de la Patagonia. \n\n¿Debemos aceptar esta oferta?"
 chile.42.a:0 "Sí"
 chile.42.b:0 "No"

 chile.43.t:0 "Chile quiere la Isla Pitcairn"
 chile.43.d:0 "Varios políticos chilenos se han puesto en contacto con nosotros, preguntando por la isla de Pitcairn. Afirman que quieren utilizarla como base para una invasión anfibia japonesa, junto con el desarrollo de infraestructuras. \n\n¿Deberíamos darles la isla?"
 chile.43.a:0 "Sí"
 chile.43.b:0 "No"

 chile.44.t:0 "El Asesinato de Arturo Alessandri"
 chile.44.d:0 "Hoy ha llegado la noticia de que un grupo de terroristas desconocidos ha asesinado hoy a Arturo. Su cuerpo fue encontrado dentro de la casa del presidente, y al parecer fue emboscado. \n\nEl grupo se ha autoidentificado como Nacistas, cantando "¡La guerra va a comenzar! La guerra va a comenzar". Mientras se redacta esta noticia, cientos e incluso miles de personas están tomando las armas en lo que parece ser un enfrentamiento entre el gobierno y los Nacistas. \n\nVa a comenzar una guerra civil y la sangre que se va a derramar va a ser inmensa".
 chile.44.a:0 "¡Victoria para el Nacismo!"

 chile.45.t:0 "[ROOT.GetPoliticalEnemy] Están cooperando con el Gobierno!"
 chile.45.d:0 "Nos acaban de llegar noticias de que [ROOT.GetPoliticalEnemy] están cooperando con el gobierno y trabajando contra nosotros. Están ofreciendo al Gobierno suministros, equipos e incluso hombres para luchar contra nosotros. Nuestro enemigo ya no es sólo el Gobierno, sino también [ROOT.GetPoliticalEnemy]. \n\nDe cualquier manera, seguiremos ganando y saldremos victoriosos de esto, ¡sin importar los costos!"
 chile.45.a:0 "¡Estos malditos bastardos pagarán!"
 CHL_nacismo_enemy:0 "Los nacistas"
 CHL_communismo_enemy:0 "Los comunistas"

 chile.48.t:0 "Falleció Pedro Aguirre Cerda"
 chile.48.d:0 "Hoy es un día triste para el pueblo chileno, ya que el presidente y líder del Frente Popular, Pedro Aguirre Cerda, falleció en su cargo. La causa de su muerte fue la tuberculosis, sin embargo esto no era nada nuevo para Pedro, pues ya sabía que su estado de salud se estaba deteriorando. Por eso nombró a Jerónimo Méndez como vicepresidente. \n\nA causa de su muerte, Jerónimo asumirá el cargo original de Pedro y dirigirá al pueblo de Chile hasta las elecciones de 1942. Lo que viene es un gran desafío para el señor Jerónimo, pero el pueblo está seguro de que saldrá adelante".
 chile.48.a:0 "Este es un día verdaderamente triste"

 chile.49.t:0 "Las elecciones de 1942"
 chile.49.d:0 "A pesar de lo lejano que parecía el año 1942, a muchos les sorprendió darse cuenta de que ya estamos allí, y las elecciones recién comienzan". \n\nVarios políticos se presentan a las elecciones, siendo el más destacado Carlos Ibáñez del Campo, que ya fue presidente de Chile antes, y quiere presentarse de nuevo pero como político independiente. \n\nEstas elecciones van a ser bastante agitadas, pero al final el ganador de las elecciones de 1942 es..."
 chile.49.a:0 "Juan Antionio Riós"
 chile.49.b:0 "Gustavo Ross Santa María"
 chile.49.c:0 "Carlos Ibáñez del Campo"

 # Bolivia

 bolivia.1.t:0 "Los Militares han Lanzado el Golpe de Estado"
 bolivia.1.d:0 "Después de meses de una gestión gubernamental ineficaz y de inestabilidad política, los militares se han hartado y tras meses de planificación han dado el golpe de Estado esta mañana. \n\nLa situación parece muy delicada, y muchos predicen que esto sólo empeorará lo que ya era una nación muy frágil. Los bolivianos están siendo forzados a elegir un bando y una división política está ocurriendo mientras hablamos, y muchos observadores del mundo exterior están mirando nuestra nación con un ojo muy cercano. \n\nSea lo que sea lo que salga de este golpe, sólo tenemos que esperar que sea para bien del país".
 bolivia.1.a:0 "¡Por el futuro de Bolivia!"

 bolivia.2.t:0 "¿Qué Debemos Hacer con Germán y Toro?"
 bolivia.2.d:0 "Después de nuestra victoria definitiva contra los generales y su sublevación, sólo nos queda un asunto por tocar: ¿qué debemos hacer con ellos? \n\nEl pueblo exige que los colguemos públicamente y que mostremos a sus partidarios que la democracia prevalece en medio de la sangre y el caos. \n\nOtros dicen que simplemente deberíamos obligarlos a retirarse, y un porcentaje muy pequeño de la población dice que hay que mantenerlos y volver a formarlos. \n\n¿Qué debemos hacer?"
 bolivia.2.a:0 "¡Colgarlos públicamente! Que paguen por sus crímenes".
 bolivia.2.b:0 "Forzar su retiro"
 bolivia.2.c:0 "Que se queden"

 bolivia.3.t:0 "¡Toro ha Comenzado con sus Arrebatos!"
 bolivia.3.d:0 "¡Algunos de nuestros leales partidarios nos han notificado que Toro ha reunido a gran parte de sus partidarios y a parte del ejército y ha tomado el control de uno de nuestros estados! \n\nNo podemos permitir que siga con estos planes y debemos detenerlo antes de que se salga de control!"
 bolivia.3.a:0 "¡Pagarás Toro!"

 bolivia.4.t:0 "Bolivia está dispuesta a comprar el Chaco"
 bolivia.4.d:0 "Diplomáticos bolivianos han llegado hoy para discutir si pueden o no comprarnos la región del Chaco Boreal. Están dispuestos a pagar una buena cantidad de dinero por la tierra y beneficios económicos para nosotros durante casi medio año ine xchange for the land. \n\n¿Debemos dejar de lado nuestra guerra y nuestros conflictos y aceptar esta oferta?"
 bolivia.4.a:0 "Si"
 bolivia.4.b:0 "No, no les vamos a dar nada"

 bolivia.5.t:0 "Bolivia está dispuesta a darnos derechos de recursos a cambio de Tarapacá"
 bolivia.5.d:0 "Diplomáticos bolivianos han llegado hoy a nuestro país para discutir si estaremos o no dispuestos a aceptar la transferencia de Tarapacá a cambio de derechos de recursos en el Beni. Beni es bastante rico en recursos, especialmente en tungsteno y acero, por lo que incluso si les permitimos tener Tarapacá todavía obtendremos más a cambio. \n\n¿Debemos aceptar su oferta?"
 bolivia.5.a:0 "Claro"
 bolivia.5.b:0 "Absolutamente no"

 bolivia.6.t:0 "Bolivia está dispuesta a comprar Acre, Pauini, Caceres, y Corumba"
 bolivia.6.d:0 "Diplomáticos bolivianos han llegado para discutir la compra de estos territorios. Están dispuestos a pagar una gran suma de dinero por los territorios. Estos territorios no son la parte más desarrollada de nuestro país, así que no perderíamos mucho. \n\n¿Deberíamos aceptar su oferta?"
 bolivia.6.a:0 "Sí, por qué no"
 bolivia.6.b:0 "No"

 bolivia.7.t:0 "Bolivia quiere llegar a un acuerdo de paz de una vez por todas"
 bolivia.7.d:0 "Diplomáticos bolivianos han llegado hoy para tratar el tema que está en la cabeza de paraguayos y bolivianos: la guerra del Chaco y sus efectos". \n\nBolivia afirma que está dispuesta a retroceder en sus pretensiones sobre el territorio y a retirarse totalmente del mismo a cambio de que le permitamos el acceso militar. \n\n¿Debemos aceptar su trato y poner fin a nuestras hostilidades?"
 bolivia.7.a:0 "Sí, mejor tener un aliado que un enemigo"
 bolivia.7.b:0 "No, todavía tienen que pagar por su pérdida"

 bolivia.8.t:0 "Germán ha fallecido"
 bolivia.8.d:0 "Ha llegado la noticia a todo el país de que Germán ha fallecido hoy. \n\nMuchos especulan que se suicidó, sin embargo, hay una pequeña minoría que cree que pudo haber sido asesinado. \n\nAhora no es el momento de especular sobre quién o qué lo mató, ahora es el momento de llorar la muerte de nuestro presidente y esperar lo mejor. Por el futuro de Bolivia".
 bolivia.8.a:0 "Que descanse en paz"

 bolivia.9.t:0 "Bolivia esta Intentando Tomar Antofagasta"
 bolivia.9.d:0 "Algunos de nuestros espías han notado un comportamiento extraño en la frontera boliviana, parece que están planeando algún tipo de plan para tomar nuestra provincia de Antofagasta. Tenemos que tener cuidado ya que no están usando la fuerza directa, sino más bien maniobras subversivas con el fin de tomar el estado sin guerra. \n\nNo permitiremos que estos viles bolivianos tomen un centímetro de nuestras tierras".
 bolivia.9.a:0 "Nos aseguraremos de que eso no ocurra!"

 bolivia.10.t:0 "Bolivia ha ocupado [995.GetName], ¿qué debemos hacer?"
 bolivia.10.d:0 "Las fuerzas bolivianas han entrado en [995.GetName] y lo han ocupado por la fuerza. Este acto atroz no sólo fue permitido, sino incluso vitoreado por los lugareños debido a los arteros planes que los bolivianos han hecho dentro de [995.GetName]. \n\n¿Qué debemos hacer?"
 bolivia.10.a:0 "¡No se saldrán con la suya!"
 bolivia.10.b:0 "Que se salgan con la suya..."


 ### Eventos de la Confederación Perú-Boliviana ###

 perubolivia.1.t:0 "¿Quién dirigirá la Confederación?"
 perubolivia.1.d:0 "Con el renacimiento de la Confederación casi 100 años después, necesitamos un líder fuerte y poderoso para dirigir la nación, y necesitamos hacer esa elección rápido. \n\nTenemos 4 opciones viables disponibles: David Toro, Germán Busch, Luis A. Flores y Manuel Prado Ugarteche. Dos son de Perú y dos de Bolivia, y cada uno tiene sus propias características. \n\nNuestro líder será..."
 perubolivia.1.a:0 "David Toro"
 perubolivia.1.b:0 "Germán Busch"
 perubolivia.1.c:0 "Luis A. Flores"
 perubolivia.1.e:0 "Manuel Prado Ugarteche"

 perubolivia.2.t:0 "¿Qué Ciudad Debe ser Nuestra Capital?"
 perubolivia.2.d:0 "Ahora que somos una entidad política en el mapa, necesitamos encontrar una ciudad para establecerla como nuestra capital. Hasta ahora tenemos 3 opciones: Tacna, Lima y La Paz. Cada una de estas ciudades no sólo tiene importancia histórica para la Confederación, sino también política. \n\nDe estas 3 ciudades, la capital de la Confederación Perú-Boliviana será..."
 perubolivia.2.a:0 "Tacna"
 perubolivia.2.b:0 "Lima"
 perubolivia.2.c:0 "La Paz"

 perubolivia.3.t:0 "Nacionalistas se Estan Levantando en Toda la Nación!"
 perubolivia.3.d:0 "Los nacionalistas Peruanos y Bolivianos se están levantando en todas las partes de nuestra nueva nación encontrada. La fuerza de estos nacionalistas es bastante fuerte, y ya están formando milicias localizadas para tomar y controlar las provincias de la Confederación. \n\nLo que sabemos ahora es que esto supone una grave amenaza para nuestra nación y que tenemos que controlar la situación lo antes posible".
 perubolivia.3.a:0 "¿Estaremos alguna vez en paz?"

 perubolivia.4.t:0 "¿Deberiamos Disolver la Unión?"
 perubolivia.4.d:0 "Nuestra situación actual parece muy sombría. Estamos en guerra con los nacionalistas peruanos y bolivianos al mismo tiempo, y el estado actual de nuestra unión parece muy frágil. \n\nDebido a esta situación extrema, muchos han propuesto simplemente ceder ante las naciones y disolver la unión de una vez por todas. \n\nTeniendo en cuenta nuestra situación actual, ¿deberíamos disolver la unión y volver a ser naciones separadas?"
 perubolivia.4.a:0 "Sí, no deberíamos causar más sangre derramada"
 perubolivia.4.b:0 "¡No, hemos luchado demasiado como para simplemente rendirnos!"

 perubolivia.5.t:0 "La Confederación Perú-Boliviana nos Invita a su Pacto de Defensa"
 perubolivia.5.d:0 "Diplomáticos de la Confederación han llegado recientemente a nuestra nación, preguntándonos si queremos formar parte de su pacto de defensa ante cualquier amenaza externa. \n\nAfirman que quieren compensar la pérdida de vidas durante su Guerra de Independencia. Los diplomáticos han dicho a los nuestros que la Confederación intervendrá en cualquier guerra defensiva en la que nos encontremos. \n\n¿Debemos aceptar su oferta?"
 perubolivia.5.a:0 "Sí, necesitamos su protección"
 perubolivia.5.b:0 "¡No vamos a poner simplemente detrás de todas sus atrocidades!"

 perubolivia.6.t:0 "[FROM.GetName] ha declarado la guerra a un país del Pacto de Defensa!"
 perubolivia.6.d:0 "[FROM.GetName] está luchando actualmente contra uno de los países que hemos invitado al pacto de defensa, y no se están conteniendo lo más mínimo. \n\nSegún nuestra promesa, estamos técnicamente obligados a unirnos y ayudar a nuestro aliado contra [FROM.GetName]. \n\n¿Nos unimos y los protegemos?"
 perubolivia.6.a:0 "¡Aplastaremos a esos belicistas!"
 perubolivia.6.b:0 "Simplemente no podemos permitirnos la guerra ahora mismo"

 perubolivia.7.t:0 "La Confederación Perú-Boliviana quiere el Putumayo a Cambio de Protección"
 perubolivia.7.d:0 "Diplomáticos de la Confederación han venido hoy a Bogotá para discutir un potencial intercambio entre nuestras naciones. La Confederación estaría dispuesta a ofrecer su ejército como apoyo en cualquier conflicto defensivo en el que nos encontremos a cambio del estado del Putumayo. \n\nLos diplomáticos nos han dicho que consideran ese estado nuestro como parte integral de su nación, y que estarán dispuestos a ofrecer su apoyo total en caso de conflicto a cambio de él. También afirman que quieren compensar la pérdida de vidas durante su Guerra de la Independencia. \n\n¿Debemos aceptar su oferta?"
 perubolivia.7.a:0 "Sí"
 perubolivia.7.b:0 "No"

 perubolivia.8.t:0 "La Confederación Perú-Boliviana quiere el Chaco a Cambio de Protección"
 perubolivia.8.d:0 "Diplomáticos de la Confederación han llegado hoy a Asunción para discutir un posible intercambio entre nuestras naciones. La Confederación estaría dispuesta a ofrecer su ejército como apoyo en cualquier conflicto defensivo en el que nos encontremos a cambio del estado de Chaco Boreal. \n\nLos diplomáticos nos han dicho que consideran ese estado nuestro como parte integrante de su nación, y que estarán dispuestos a ofrecer todo su apoyo en caso de conflicto a cambio de él. También afirman que quieren compensar la pérdida de vidas durante su Guerra de la Independencia. \n\n¿Debemos aceptar su oferta?"

 perubolivia.9.t:0 "La Confederación Perú-Boliviana está Dispuesta a Comprar Nuestras Tierras"
 perubolivia.9.d:0 "Diplomáticos de la Confederación han venido a nuestra nación para ofrecer una propuesta: No sólo el pago de 1 fábrica civil, sino también la intervención en cualquiera de nuestras guerras defensivas. \n\nLos diplomáticos nos han dicho que poseemos tierras que ellos valoran mucho, y están dispuestos no sólo a pagar, sino también a ofrecernos protección a cambio de ellas. \n\nNo se puede negar el poder que tiene la Confederación, así que ¿debemos aceptar esta oferta?"


### Noticias aparte ###

 news.348.t:0 "Caida de Buenos Aires"
 news.348.d:0 "Expertos militares estan en shock debido a los reportes provenientes de Buenos Aires que confirman que la capital cayó antes las fuerzas Uruguayas. \n\nAunque algunas zonas siguen en combate, la mayoria de las unidades Argentinas se han retirado hacia el campo cercano a la ciudad. \n\nTropas uruguayan han empezado a hacer un desfile militar en la avenida 9 de Julio, del que participara Gabriel Terra, quien voló recientemente a Buenos Aires. \n\nHay rumores de que el gobierno Argentino logro escapar por la ruta 7 hacia los Andes, pero expertos creen que este fue un golpe devastador contra Argentina."
 news.348.a:0 "¿Qué demonios está pasando ahí?"
 news.348.b:0 "Quien es la provincia ahora?"
 news.348.c:0 "¡Pagarán! ¡Con su sangre pagarán!"

 news.750.t:0 "La caída de Buenos Aires"
 news.750.d:0 "Considerada la París de Sudamérica, Buenos Aires es una ciudad muy poderosa en Sudamérica, por lo que resulta aún más impactante darse cuenta de que la ciudad ha caído ahora en manos de un extraño. \n\nLas consecuencias de que una ciudad tan poderosa deje de estar en manos de Argentina aún se desconocen. Drásticos cambios se producirán en la región tanto económica como políticamente. En los últimos años Sudamérica se ha vuelto más inestable, y la caída de Buenos Aires sólo demuestra la gravedad del asunto. \n\nCon la desaparición de su centro económico, las posibilidades de que Argentina gane la guerra parecen escasas".
 news.750.a:0 "¿Tiene Argentina alguna posibilidad?"
 news.750.b:0 "¡Otra victoria para nosotros!"

 news.351.t:0 "La caída de São Paulo"
 news.351.d:0 "Una de las ciudades más importantes de Brasil acaba de ser tomada. Para muchos todavía parece increíble que una ciudad tan importante del gigante sudamericano haya sido ocupada, y sin embargo los informes de la ciudad y del invasor lo demuestran sin lugar a dudas. Brasil aún puede retroceder a Río de Janeiro, sin embargo, los invasores ya están a las puertas de esa ciudad también. \n\nLas posibilidades de que el ejército brasileño contenga a los invasores parecen casi nulas. Se avecinan días oscuros para la nación de Brasil".
 news.351.a:0 "Brasil no durará"
 news.351.b:0 "El siguiente paso es Río de Janeiro"

 news.352.t:0 "La caída de Río de Janeiro"
 news.352.d:0 "Río de Janeiro, un sitio popular entre los turistas, los inversores y la gente en general, además de ser una hermosa ciudad ya no es lo que era. Ahora está llena de sangre y caos mientras los invasores extranjeros expulsan a los brasileños de su propia ciudad. \n\nLas circunstancias actuales parecen increíbles, pero los informes locales lo confirman. Río de Janeiro ha caído, y el actual esfuerzo bélico brasileño no parece suficiente para detener a los invasores. \n\nVa a ser necesario un milagro para que los brasileños vuelvan, pero todos sabemos que la vida no siempre trae milagros."
 news.352.a:0 "¿Qué pasó con Sudamérica?"
 news.352.b:0 "¡El fin de la guerra está cerca!"

 news.353.t:0 "La caída de Montevideo"
 news.353.d:0 "Acaban de llegar noticias de que la capital de Uruguay, Montevideo, ha caído en manos de fuerzas externas. El recuento de muertos está llegando a los miles mientras los civiles tratan de escapar de la ciudad por miedo a quedar atrapados en un fuego cruzado. \n\nAhora, con su capital desaparecida, se necesitará un gran sacrificio y capacidad para mantener la guerra, sin embargo, parece muy poco probable que Uruguay se mantenga a flote en este conflicto."
 news.353.a:0 "Hicieron un valiente esfuerzo"
 news.353.b:0 "Su resistencia fue inútil"

 news.354.t:0 "La caída de Santiago"
 news.354.d:0 "La otrora bulliciosa capital de Chile ha quedado reducida a los escombros y al caos cuando las mareas de la guerra han inundado hoy la ciudad. Los invasores han capturado oficialmente la capital de Chile, Santiago, y la ciudad ya no está bajo control chileno. \n\nTeniendo en cuenta el peligroso terreno que rodea la ciudad, es honestamente impresionante cómo los invasores fueron capaces de lograr tal hazaña. Los expertos militares de todo el mundo están tratando de entender qué pasó con la defensa chilena y cómo no fueron capaces de defender una ciudad tan defendible."
 news.354.a:0 "El corazón del acero sudamericano... desaparecido"
 news.354.b:0 "¡Deberían rendirse en cualquier momento!"

 news.355.t:0 "La caída de La Paz"
 news.355.d:0 "La capital de Bolivia, así como la ciudad más importante del país, ha sido víctima de la ira de la guerra y ya no está bajo el control de los bolivianos. La situación es muy sombría en la nación en este momento, ya que innumerables personas están muriendo y muchos tratan de escapar de los horrores de la guerra. \n\nUn espectáculo muy triste de ver, especialmente si se tiene en cuenta la desafortunada historia de Bolivia en lo que respecta a las guerras. Todo lo que el mundo puede hacer es mirar desde lejos y estudiar el conflicto, repartiendo oraciones a los que perdieron la vida."
 news.355.a:0 "Eso es bastante lamentable"
 news.355.b:0 "¡Nunca tuvieron una oportunidad!"

 news.356.t:0 "La caída de Asunción"
 news.356.d:0 "La capital de Paraguay, Asunción, ha sido víctima de los invasores. Los informes confirman que la ciudad ya no está bajo la posesión del gobierno paraguayo. \n\nLos paraguayos hicieron un valiente esfuerzo contra los invasores, pero al final los invasores salieron victoriosos y pisotearon las defensas paraguayas en la ciudad. Se pueden estudiar las tácticas de defensa de esta guerra para entender mejor el cómo y el porqué de la caída de esta ciudad. \n\nLloraremos a los que ya no están con nosotros debido a este conflicto".
 news.356.a:0 "¿Asun-qué?"
 news.356.b:0 "¡Nuestro ejército no puede ser detenido!"

 news.357.t:0 "La caída de Lima"
 news.357.d:0 "Teniendo en cuenta la posición estratégica de la capital de Perú, Lima, se consideraría casi imposible conquistarla, la logística, los soldados necesarios, la moral. Muchos factores tendrían que estar en juego para que tuviera éxito, y sin embargo los invasores lo hicieron y se apoderaron de la capital de la nación. \n\nAunque su ciudad más importante ha desaparecido, los peruanos siguen haciendo todo lo posible para defenderse de los invasores, y debemos respetar su esfuerzo, aunque finalmente no sirva de nada. \n\nLas tácticas desplegadas por los invasores podrían estudiarse para mejorar aún más nuestras propias técnicas."
 news.357.a:0 "¿Otra capital sudamericana desaparecida?"
 news.357.b:0 "Por fin, victoria al fin"

 news.358.t:0 "La caída de Bogotá"
 news.358.d:0 "Se acaba de confirmar que la capital de Colombia, Bogotá, ya no está bajo control colombiano. Una ciudad tan grande tomada por una fuerza exterior todavía parece increíble, y sin embargo la cobertura de las noticias locales ha demostrado lo increíble. \n\nMuchas familias han perdido sus hogares, incluso más han perdido miembros, y en general toda la nación de Colombia está luchando para mantenerse mientras los invasores empujan más y más en sus tierras. Todavía está en discusión si lo lograrán o no, pero con la desaparición de su capital, parece muy poco probable. \n\nDebemos tener compasión por los que han perdido la vida."
 news.358.a:0 "Interesante"
 news.358.b:0 "Se acabó, esta guerra ha terminado"

 news.359.t:0 "La caída de Caracas"
 news.359.d:0 "La capital del paraíso petrolero de Sudamérica, Venezuela, ha sido recientemente capturada. Los invasores conocían la importancia estratégica de la ciudad, y se aseguraron de utilizar el poderío militar para tomarla. \n\nMiles de personas han muerto, y muchas más podrían morir si esta guerra no termina. Los invasores no muestran ninguna piedad mientras sus soldados y tanques marchan a través de la otrora bulliciosa capital de Venezuela. \n\nSólo podemos esperar y ver cómo se resuelve este conflicto".
 news.359.a:0 "Verdaderamente una vergüenza"
 news.359.b:0 "¡Por fin, todo este petróleo será nuestro!"

 argentina.22.t.ucravictor:0 "La UCRA (Concordancia) ha ganado las Elecciones"
 argentina.22.t.ucrvictor:0 "La UCR ha ganado las Elecciones"
 argentina.22.t.psvictor:0 "El Partido Socialista ha ganado las Elecciones"
 argentina.22.d:0 "Llegaron las elecciones, después de 6 años de Agustín Pedro Justo ya contamos los votos y el país ha decidido quién debe llevar a nuestra nación a la grandeza. \n\nQuien tome el mando, solo esperemos saben lo que hacen y se ocupan de los problemas que enfrenta actualmente nuestro país”.
 argentina.22.a:0 "¡No te decepcionaremos!"

 
 ### Eventos de Colombia ###

 colombia.1.title:0 "Un líder del ejército se gradúa como experto en desiertos"
 colombia.1.desc:0 "Tras un largo periodo de estudio y entrenamiento del terreno, uno de nuestros líderes del ejército finalmente se ha graudado como experto en combate en el desiertos. Sin duda, este es un gran logro no solo para él, sino para todo el sistema de entrenamiento militar. \n\nSu nuevo rasgo de seguro le será de gran ayuda en las futuras batallas por la patria."
