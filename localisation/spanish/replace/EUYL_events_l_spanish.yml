 colombia.1.a:0 "Un ejemplo de excelencia."

 colombia.9.title:0 "La Tragedia de Fúquene"
 colombia.9.desc:0 "Hoy ha ocurrido una terrible tragedia en la laguna de Fúquene, situada a 120 kilómetros de al norte de Bogotá. Una lancha con sobrecarga de pasajeros se hundió en las heladas aguas de la laguna y en un punto muy distante a la orilla. De las 27 personas que estaban en la embarcación, 21 se ahogaron. Entre las víctimas se encuentran distinguidos oficiales del ejército y varios personajes destacados de nuestra sociedad. Esta catástrofe ha conmovido hondamente a la nación entera y ha cubierto de luto a muy respetables familias de la capital."
 colombia.9.a:0 "Un doloroso suceso."
 colombia.10.title:0 "Se evitó una tragedia en Fúquene"
 colombia.10.desc:0 "El día de hoy hubiese pasado a la historia como un trágico día en Cundinamarca. En la laguna de Fúquene, una lancha con sobrecarga de pasajeros estaba a punto de embarcarse en las heladas aguas de la laguna. Sin embargo, los pasajeros tardaron más de lo esperado en abordar la lancha, por lo que el viaje se retrasó varios minutos. Tiempo después, una repentina ventisca, acompañada de una lluvia torrencial les impidió zarpar. Eventualmente se comprobó que el motor de la lancha presentaba fallas, por lo que muy posiblemente, de haber zarpado a la hora programada, se hubiesen quedado a la deriva, y la lluvia hubiera hundido la embarcación."
 colombia.10.a:0 "Una advertencia del destino..."

 colombia.11.title:0 "La misión militar de Rojas Pinilla"
 colombia.11.desc:0 "La dirección militar del ejército ha propuesto enviar un delegado a nombre del país a una potencia extranjera o a un centro de estudio focalizado para que traiga consigo información clave para el desarrollo de las fuerzas armadas. Después de revisar entre muchos candidatos, finalmente la dirección eligió al teniente Gustavo Rojas Pinilla para ejecutar esta labor. Lo único que hace falta aclarar es a dónde será enviado."
 colombia.11.a:0 "Enviarlo a Estados Unidos"
 colombia.11.b:0 "Enviarlo a Alemania"
 colombia.11.c:0 "Enviarlo al centro de estudios militares"

 #colombia.12
 lideres.protegidos.title:0 "Los caudillos liberales son protegidos por el gobierno"
 lideres.protegidos.desc:0 "Después de muchos años de persecución política, los caudillos liberales del oriente del país finalmente recibieron el apoyo y la protección del gobierno para realizar su acción sin vandalismo. La población liberal ha agradecido este gesto, que ha contribuido a la estabilidad de la región."
 lideres.protegidos.a:0 "Un triunfo para el pueblo."
 #colombia.13
 bog.oponen.title:0 "Los comerciantes liberales se oponen a negociar con los conservadores"
 bog.oponen.desc:0 "Los principales empresarios liberales, que dominan el mercado en Cundinamarca, no aceptaron colaborar económicamente con sus contrarios conservadores. Argumentan que no tienen garantías para negociar, y que el favoritismo por los conservadores por parte de otros empresarios podría costarles su trabajo y sus ganancias."
 bog.oponen.a:0 "Qué obstinados.."
 #colombia.14
 bog.aceptan.title:0 "Empresarios liberales y conservadores negocian acuerdos comerciales"
 bog.aceptan.desc:0 "Después de varias reuniones con los directores de las asociaciones industriales y los dirigentes de las empresas nacionales de Cundinamarca, el gobierno logró organizar a ambos grupos, liberales y conservadores, para que acordaran su mutua colaboración en el mercado. Los industriales liberales aceptaron un tanto reacios, aunque vieron con buenos ojos las utilidades que podrían obtener de sincronizar sus empresas, dejando a un lado las diferencias políticas."
 bog.aceptab.a:0 "¡Una ganancia mutua!"
 #colombia.15
 int.acept.title:0 "Alcaldes liberales toman su puesto el Magdalena"
 int.acept.desc:0 "Tras una larga campaña de reestructuración institucional y la intervención directa de [ROOT.GetLeader], los alcaldes de las principales ciudades del Magdalena finalmente pudieron asumir su cargo, que estaba siendo obstaculizado por las directivas conservadoras del lugar. La delegación liberal se regocijó con la noticia, anunciando que es una victoria para el pueblo."
 int.acept.a:0 "Un triunfo para la democracia."
 #colombia.16
 int.oponen.title:0 "Conservadores rechazan nuevos alcaldes en Magdalena"
 int.oponen.desc:0 "A pesar de los esfuerzos presidenciales por otorgarle la alcaldía a los liberales electos, ha sido imposible lograr este cometido. Los gobernadores departamentales conservadores argumentan que el país se encuentra en estado de sitio desde 1899, por lo que están avalados constitucionalmente para “remover del cargo a cualquier subordinado si lo consideran adecuado”. Es más que obvio que estos conflictos son de un orden ideológico, pero están sustentados legalmente y es poco lo que se puede hacer al respecto."
 int.oponen.a:0 "Empeñados en obstruir la voluntad del pueblo."
 #colombia.17
 pensa.eliminada.title:0 "Gobierno elimina prensa subversiva"
 prensa.eliminada.desc:0 "El extenso operativo preparado por las autoridades ha dado sus frutos. La imprenta de diarios ultraconservadores finalmente fue ubicada en Medellín, desde donde se distribuía a todo el departamento, incitando el odio hacia los liberales. Múltiples personas fueron arrestadas y el lugar de la imprenta ha quedado bajo custodia policial. La dirección liberal antioqueña exaltó la labor gubernamental y espera que con este hecho merme la violencia política."
 prensa.eliminada.a:0 "Excelente."
 #colombia.18
 prensa.continua.title:0 "Periódicos conservadores continúan circulando"
 prensa.continua.desc:0 "Los esfuerzos policiales por identificar el lugar de origen de la prensa ultraconservadora no tuvieron éxito. En un primer momento las investigaciones llevaron a la captura de varios sospechosos, todos miembros del partido conservador, pero las pruebas documentales resultaron ser insuficientes para sustentar imputaciones serias. El proceso terminó siendo archivado y las autoridades no tuvieron más opción que dejar en libertad a los arrestados."
 prensa.continua.a:0 "No por mucho tiempo."
 #colombia.19
 conser.arrestados.title:0 "Conservadores extremistas arrestados"
 conser.arrestados.desc:0 "Una redada militar a lo largo de todo el Caquetá culminó hoy con más de un centenar de arrestos. Una organización conservadora extremista, que se dedicaba a sembrar el caos y amenazar opositores, fue disuelta con el operativo. Los principales dirigentes serán los primeros en ser presentados ante un juez, y deberán responder por varios delitos. El partido conservador, por otro lado, argumentó que estas personas no tienen vínculo alguno con el partido, sino que han actuado por cuenta propia. Estas afirmaciones se han puesto en duda por varios periódicos importantes, aunque hará falta una investigación más exhaustiva para esclarecer este hecho."
 conser.arrestados.a:0 "Se hace justicia."
 #colombia.20
 conser.escapan.title:0 "Conservadores extremistas escapan del operativo"
 conser.escapan.desc:0 "Aunque se planificó llevar a cabo una redada en el Caquetá contra los extremistas de la región, la situación presentó complicaciones desde el primer momento, hasta que culminó en un fracaso total. Los altos dirigentes de las sociedades extremistas debieron haberse enterado, por lo que abandonaron rápidamente el lugar donde se supone que estarían hoy. No se han dado declaraciones públicas sobre lo ocurrido, y tampoco se esperan, pues es obvio que significa una vergüenza para la institucionalidad nacional."
 conser.escapan.a:0 "Ya los encontraremos."
 #colombia.21
 conser.mueren.title:0 "Líderes conservadores mueren en operativo de captura"
 conser.mueren.desc:0 "Los esfuerzos por identificar y arrestar a los dirigentes de las sociedades extremistas no resultaron tan exitosos como se esperaba. En medio de la redada la situación se complicó en varios puntos, derivando en un fuego cruzado que culminó con la muerte de casi todos los líderes extremistas arrestados. El partido conservador ha denunciado la mala gestión del gobierno para con estos individuos, argumentando que el suceso “corrobora la inefectividad de las instituciones nacionales” y acusa a [COL.GetLeader] de incitar a la violencia política con este tipo de “acciones desmedidas”."
 conser.mueren.a:0 "Maldición."
 #colombia.22
 pol.desman.title:0 "Policía conservadora desmantelada en Nariño"
 pol.desman.desc:0 "En una operación meticulosamente calculada por parte del alto mando militar, la fuerza pública logró infiltrarse y lanzar un ataque conjunto a los cuarteles de los paramilitares conservadores en Nariño. La gran mayoría de estos centros al margen de la ley se encontraban a las afueras de Pasto, resguardados en haciendas desde donde planeaban sus ataques subversivos y almacenaban grandes alijos de armas. Los rezagos de este cuerpo paramilitar derechista son aislados, y no se espera que representen un problema mayor en tanto son capturados y judicializados."
 pol.desman.a:0 "¡Todo un logro!"
 #colombia.23
 pol.gana.title:0 "Fuerzas armadas son derrotadas por paramilitares conservadores"
 pol.gana.desc:0 "La cuidadosa operación orquestada por el alto mando militar bajo orden presidencial se salió de control poco tiempo después de comenzar. Los agentes gubernamentales infiltrados en el cuerpo paramilitar fueron descubiertos y se vieron obligados a revelar toda la información. En consecuencia, cuando las autoridades allanaron las haciendas donde se tenía registro de estas actividades, la policía conservadora ya se había replegado, mientras que otros miembros se quedaron y dieron de baja a varios militares antes de escapar."
 pol.gana.a:0 "Inconcebible."
 #colombia.24
 pol.mueren.title:0 "Enfrentamiento entre policía conservadora y fuerzas armadas"
 pol.mueren.desc:0 "Las haciendas que se encontraban a las afueras de Pasto atestiguaron un brutal combate entre la fuerza pública y la denominada Policía Conservadora. Durante el allanamiento de las mismas, los guardias de las haciendas opusieron resistencia, y entre el forcejeo se escuchó un disparo que hizo estallar todo el ambiente. No se sabe de dónde provino, pero el enfrentamiento terminó con varias decenas de muertos de ambas partes. Las fuerzas militaron quedaron manchadas al conocerse lo sucedido, recibiendo críticas principalmente por parte del clero. El gobierno no se ha pronunciado al respecto, pero varios sectores políticos exigen una explicación sobre lo acontecido, sobre todo miembros del partido conservador."
 pol.mueren.a:0 "No faltaba más..."

 colombia.25.title:0 "¡Insurrección conservadora!"
 colombia.25.desc:0 "El cúmulo de tensión política que veníamos acumulando finalmente estalló. Al sur del país se ha desatado una feroz contienda entre milicias del partido conservador y el ejército nacional. La situación, para nuestra desgracia, es clara, los conservadores se levantan en armas. \n\nHicimos mal al permitir que su influencia subversiva se esparciera por la nación, y ahora han quedado bajo control del temible Laureano Gómez. No solo hay rezagos del ejército que se rebelaron, sino que toda la cadena de mando colapsó y es imposible hacer contacto o dirigir institución alguna en su zona de influencia. Ahora solo queda una opción: retomar el orden por la fuerza."
 colombia.25.a:0 "Esta situación se nos salió de las manos..."
 colombia_25_tt:0 "Los partidarios §Yconservadores§! iniciarán una guerra civil."

 colombia.26.title:0 "¡Insurrección militar!"
 colombia.26.desc:0 "Los generales renegados que veían con desconfianza la gestión de [COL.GetLeader] han actuado. La noticia de la rebelión vino acompañada con motines en todo el ejército. Algunos fueron suprimidos en todo el ejército, mientras que otros consumaron su cometido y se unieron a las filas de los renegados. Parte del alto mando ha quedado disuelto, y varias reservas de municiones fueron saqueadas por las fuerzas sublevadas. Aunque la república no ha entrado en un caos generalizado, sin duda este evento traerá repercusiones en la administración de los partidos tradicionales."
 colombia.26.a:0 "Esta situación se nos salió de las manos..."
 colombia_26_tt:0 "Los §Ymilitares§! iniciarán una guerra civil."

 colombia.27.title:0 "¡Insurrección liberal!"
 colombia.27.desc:0 "La oposición liberal resultó ser más violenta de lo que esperábamos. Su líder, Jorge Eliécer Gaitán, alega que todo este tiempo había intentado hacer las cosas “pacíficamente”, pero que la escalada de violencia que ha azotado a sus copartidarios no podía pasar desapercibida ni manejarse con la parsimonia del pacifismo. Los principales dirigentes liberales se reunieron al norte del país y con ayuda del general Alfredo Azuero Arenas iniciaron una revolución armada contra el gobierno. No hay certeza sobre el tamaño o fuerza de combate de sus unidades de milicianos improvisadas, pero sabemos que, si no se detienen a tiempo, tomarán la capital y no se detendrán hasta controlar todo el país."
 colombia.27.a:0 "Esta situación se nos salió de las manos..."
 colombia_27_tt:0 "Los partidarios §Yliberales§! iniciarán una guerra civil."

 colombia.28.title:0 "Milicias conservadoras se organizan por el país"
 colombia.28.desc:0 "El alto mando de las fuerzas armadas remitió al gabinete presidencial una noticia preocupante. A lo largo del país se han reportado paramilitares conservadores armándose y tomando el control de diferentes poblaciones al sur del país. Si no se hace algo al respecto, el gobierno podría perder el control de la situación."
 colombia.28.a:0 "¡Organicemos un operativo inmediatamente!"
 colombia.28.b:0 "Apresar a sus líderes es suficiente."
 colombia.28.c:0 "Ya se les pasará."

 colombia.29.title:0 "Laureano Gómez amenaza con la guerra civil"
 colombia.29.desc:0 "El dirigente conservador Laureano Gómez le ha hecho un ultimátum al gobierno. Afirma que, si el gobierno actual no detiene su acción e involucra en sus disposiciones las propuestas del conservatismo, sus partidarios se alzarán en armas y harán invivible la república. Esta delicada situación ha estremecido a todo el gabinete nacional, pues las amenazas son certeras y suenan bastante reales."
 colombia.29.a:0 "Habrá que ceder a sus demandas..."
 colombia.29.b:0 "Cambiemos un par de cosas para calmarlo."
 colombia.29.c:0 "Ya veremos si es capaz."

 colombia.31.title:0 "El caso Bonitto Vega"
 colombia.31.desc:0 "La insubordinación del general Bonitto Vega como secretario de guerra está colmando la paciencia del gabinete ministerial. Mientras que el poder civil exige que se castigue al general lo antes posible, otros sectores, como la disidencia del partido conservador, afirman que el gobierno solo “buscar el desprestigio del Ejército ante la opinión pública", a favor de una Policía progresivamente militarizada y leal a los intereses del presidente de turno. Aunque el debate es tenso y la opinión está dividida, al final la decisión recae en [COL.GetLeader]."
 colombia.31.a:0 "Retirar al general Vega del servicio."
 colombia.31.b:0 "No es para tanto."

 colombia.32.title:0 "El general Villamizar desacata las órdenes"
 colombia.32.desc:0 "La insubordinación del general Villamizar como secretario de guerra está colmando la paciencia del gabinete ministerial. No solo desacata las órdenes administrativas que recibe, sino que abiertamente incita a desobedecer al gobierno por su “falta de liderazgo”. Sugieren que se adelante de inmediato un Consejo de Guerra para que se le sancione con la destitución del cargo. Por otra parte, los demás miembros del alto mando militar consideran que la situación no es tan grave, sino que debe ser tomada como una crítica hacia el gobierno y no como un acto de rebeldía."
 colombia.32.a:0 "¡Hay que instaurar el consejo de guerra!"
 colombia.32.b:0 "No es para tanto."

 colombia.33.title:0 "El general Neira demuestra deslealtad"
 colombia.33.desc:0 "La insubordinación del general Neira como secretario de guerra está colmando la paciencia del gabinete ministerial. No solo desacata las órdenes administrativas que recibe, sino que abiertamente incita a desobedecer al gobierno por su “falta de liderazgo”. Sugieren que se adelante de inmediato un Consejo de Guerra para que se le sancione con la destitución del cargo. Por otra parte, los demás miembros del alto mando militar consideran que la situación no es tan grave, sino que debe ser tomada como una crítica hacia el gobierno y no como un acto de rebeldía."
 colombia.33.a:0 "Retirar al general Neira del servicio."
 colombia.33.b:0 "No es para tanto."

 colombia.34.title:0 "La cúpula militar desacata la autoridad"
 colombia.34.desc:0 "El alto mando militar, precedido por los generales José Joaquín Villamizar, Miguel J. Neira y Eduardo Bonitto Vega, se está negando a presentar los respectivos informes al poder civil. Las órdenes administrativas también han sido ignoradas y tanto el congreso como el gabinete ministerial sospecha que los militares traen algo entre manos. Los asesores sugieren castigar este desacato antes que la situación pase a mayores. Por su parte, los altos generales argumentan que el gobierno “no tiene la fuerza requerida para mantener el orden”, y que solo están “haciendo lo que los políticos no saben hacer”."
 colombia.34.a:0 "Una sanción severa es lo justo."
 colombia.34.b:0 "Una advertencia será suficiente."
 colombia.34.c:0 "No es para tanto."

 colombia.36.title:0 "Los militares exigen reintegrar a Vega"
 colombia.36.desc:0 "Los demás miembros de la cúpula militar le han dejado en claro al poder ejecutivo su inconformidad con la destitución del general Vega. Argumentan que el gobierno de turno no está en condiciones de retirar miembros del alto mando militar sin autorización del congreso, y que solo se está “empeorando la gravísima situación de orden público actual”. \n\nSus fuertes aseveraciones no han sido bien recibidas por el gabinete ministerial, quienes afirman que los militares están extralimitando sus funciones, por lo que ceder a sus demandas sería sinónimo de entregarles el poder de la institución. Las demás autoridades, por otro lado, vislumbran la posibilidad de un complot militar contra el poder civil, aunque son conjeturas inconclusas."
 colombia.36.a:0 "El general ya aprendió la lección."
 colombia.36.b:0 "Vega permanecerá fuera del servicio."

 colombia.37.title:0 "Los militares exigen reintegrar a Villamizar"
 colombia.37.desc:0 "Los demás miembros de la cúpula militar le han dejado en claro al poder ejecutivo su inconformidad con la destitución del general Villamizar. Argumentan que el gobierno de turno no está en condiciones de retirar miembros del alto mando militar sin autorización del congreso, y que solo se está “empeorando la gravísima situación de orden público actual”. \n\nSus fuertes aseveraciones no han sido bien recibidas por el gabinete ministerial, quienes afirman que los militares están extralimitando sus funciones, por lo que ceder a sus demandas sería sinónimo de entregarles el poder de la institución. Las demás autoridades, por otro lado, vislumbran la posibilidad de un complot militar contra el poder civil, aunque son conjeturas inconclusas."
 colombia.37.a:0 "El general ya aprendió la lección."
 colombia.37.b:0 "Villamizar permanecerá fuera del servicio."

 colombia.38.title:0 "Los militares exigen reintegrar a Neira"
 colombia.38.desc:0 "Los demás miembros de la cúpula militar le han dejado en claro al poder ejecutivo su inconformidad con la destitución del general Neira. Argumentan que el gobierno de turno no está en condiciones de retirar miembros del alto mando militar sin autorización del congreso, y que solo se está “empeorando la gravísima situación de orden público actual”. \n\nSus fuertes aseveraciones no han sido bien recibidas por el gabinete ministerial, quienes afirman que los militares están extralimitando sus funciones, por lo que ceder a sus demandas sería sinónimo de entregarles el poder de la institución. Las demás autoridades, por otro lado, vislumbran la posibilidad de un complot militar contra el poder civil, aunque son conjeturas inconclusas."
 colombia.38.a:0 "El general ya aprendió la lección."
 colombia.38.b:0 "Neira permanecerá fuera del servicio."

 colombia.39.title:0 "El retorno de la UNIR"
 colombia.39.desc:0 "Aunque la Unión Nacional de Izquierda Revolucionaria (UNIR) se disolvió en 1935 para fusionarse con el partido liberal, era obvio que tal vínculo no iba a durar mucho. Jorge Eliécer Gaitán, caudillo popular y fundador de la UNIR, decidió restablecer formalmente su movimiento político, ahora apoyado por los sectores más radicales del liberalismo, incluyendo, entre otros, su compañero ideológico Plinio Mendoza Neira y el mismo presidente López Pumarejo. \n\nGozando de gran acogida entre la población, la UNIR se fortalece cada vez más, concentrando enormes masas populares bajo el liderazjo de Gaitán."
 colombia.39.a:0 "Grandes cambios se avecinan en Colombia."

 colombia.41.title:0 "Los conservadores orquestan un golpe de estado"
 colombia.41.desc:0 "Después de organizar una gran unidad de militantes, respaldados tanto por gran parte de la población civil como el sector clerical, se formó una poderosa fuerza de asalto conservadora que arremetió en el palacio presidencial ayer en la noche con tal decisión que la guardia local fue incapaz de responder. Como era de esperarse, [COL.GetLeader] no había previsto esta situación, por lo que aislarlo junto con su gabinete en la oficina presidencial fue una labor bastante sencilla. Los principales dirigentes del conservatismo, Gilberto Alzate Avendaño y Laureano Gómez, no tardaron en hacer presencia. Fueron recibidos con una gran ovación de partidarios que se agruparon fuera del palacio para mantenerse al tanto de la situación. \n\nDespués de varias horas, ya entrada la madrugada, [COL.GetLeader] finalmente accedió a firmar la renuncia y ceder el mando del país al partido conservador. La noticia se espació por las calles, y mientras los seguidores del partido celebraban el hecho, en el interior del palacio se libraba una batalla por elegir cuál de los dos líderes asumiría el cargo: el osado falangista Gilberto Alzate o el acérrimo tradicionalista Laureano Gómez."
 colombia.41.a:0 "Alzate es el líder que necesita Colombia."
 colombia.41.b:0 "Laureano Gómez es el único que estabilizará la república."

 colombia.42.title:0 "[ROOT.GetLeader] renuncia a la presidencia"
 colombia.42.desc:0 "Hoy, el presidente [ROOT.GetLeader] manifestó al congreso la grave “desatención” de las directivas liberales clásicas a la solución de los problemas nacionales. Los desacuerdos dentro del liberalismo, sumado a los reproches del partido conservador, dividieron la administración pública e hizo imposible gobernar. En contraposición, arguyó que su mandato no puede proseguir bajo este panorama, y que debía ceder el mando a alguien que sí gozara de gran apoyo popular generalizado. Así las cosas, [FROM.GetLeader] formalmente renunció al mando presidencial para cederlo al actual alcalde de Bogotá (y candidato a las próximas elecciones) Jorge Eliécer Gaitán. \n\nGaitán es una personalidad ilustre, que no solo conmueve a todo el pueblo colombiano con su elocuencia y tenacidad, sino que demuestra verdadero interés en reformar completamente el sistema colombiano. Entre un enorme festejo por parte de sus seguidores, Gaitán asumió el mando de la república y, tras un exquisito discurso, se escuchó al unísono el lema de su campaña: ¡A la carga!"
 colombia.42.a:0 "Gaitán no es un hombre, es un pueblo..."

 colombia.43.title:0 "¡El golpe de estado fracasa!"
 colombia.43.desc:0 "Las milicias organizadas por el partido conservador no fueron lo suficientemente efectivas para el golpe. El plan era arremeter en el palacio presidencial y obligar a [COL.GetLeader] a dimitir. Sin embargo, la guardia presidencial tuvo el tiempo suficiente para notificarle al ejército la situación. Las fuerzas armadas se movilizaron y en cuestión de minutos la situación se tornó en un caos absoluto. Las estaciones de radio difundieron el mensaje rápidamente y, ante la ira, cientos de militantes conservadores asaltaron las armerías de las comisarías y conformaron grandes grupos de civiles. La arremetida de estas divisiones fue tan severa que los contrarios, los partidarios liberales, también salieron a las calles con armas en mano. \n\nLa situación escaló hasta que los dos principales dirigentes del partido conservador, Laureano Gómez y Gilberto Alzate Avendaño, pronunciaron que “ante el fracaso de la fuerza civil solo queda la fuerza armamentística”, iniciando así una guerra civil entre los partidarios conservadores y los seguidores aún leales a la administración de [COL.GetLeader]. Incluso en el propio ejército cientos de soldados desertaron para engrosar las filas conservadoras. La república está ahora en un desorden sin precedentes."
 colombia.43.a:0 "¡Alzate nos guiará a la victoria!"
 colombia.43.b:0 "¡Venceremos bajo el liderazgo de Laureano Gómez!"

 COL_grc_rejected:0 "Rechazaron la solicitud"

 colombia.44.title:0 "[FROM.GetName] busca nuestra anexión"
 colombia.44.desc:0 "Últimamente ha estado rondando la retórica pannacionalista en [FROM.GetName], apelando a la antigua idea de reformar la antigua Gran Colombia. Así pues, por iniciativa popular, [COL.GetLeader] le ha solicitado a nuestro gobierno reintegrarnos a su territorio pacíficamente. Aceptar supondría subyugar nuestra independencia y autonomía al gobierno de Bogotá, por lo que es difícil concluir si resultaría beneficioso o no. Es claro, sin embargo, que el actual gobierno colombiano tiende a ser represivo y autoritario, por lo que quizá someternos no sea la mejor opción en un primer momento."
 colombia.44.a:0 "Seguiremos el camino de los colombianos."
 colombia.44.b:0 "¡El pueblo ecuatoriano permanecerá libre!"

 colombia.45.title:0 "¡Ecuador rechaza la anexión!"
 colombia.45.desc:0 "Alegando que la independencia de Ecuador ya es definitiva, [FROM.GetLeader] negó rotundamente reintegrar su estado a nuestro proyecto de restauración grancolombiano. Ecuador cerró sus fronteras y desplegó varias unidades a lo largo, tal vez previendo una posible acción militar de nuestra parte."
 colombia.45.a:0 "Será por la fuerza entonces..."

 colombia.46.title:0 "Ecuador accede a nuestras demandas"
 colombia.46.desc:0 "[FROM.GetLeader] recibió con entusiasmo la propuesta que le hemos planteado. Los movimientos políticos del país que buscaban la reunificación de la Gran Colombia celebraron la decisión y anunciaron que colaborarían a nuestro gobierno en todas las gestiones necesarias."
 colombia.46.a:0 "Han elegido bien."

 colombia.47.title:0 "[FROM.GetName] busca reintegrarnos a su territorio"
 colombia.47.desc:0 "Nuestro pequeño istmo fue parte de Gran Colombia hace mucho tiempo, pero nuestro pueblo decidió separarse por la falta de atención que recibíamos del gobierno central. Ahora, [COL.GetLeader] propone que deberíamos volver a unirnos a ellos, para retomar el proyecto de la Gran Colombia. ¿Deberíamos aceptar?"
 colombia.47.a:0 "El destino de Panamá está con Colombia."
 colombia.47.b:0 "¡Nuestra independencia es más valiosa que sus ambiciones!"

 colombia.48.title:0 "¡Panamá se rehúsa a volver a ser parte de Colombia!"
 colombia.48.desc:0 "La decisión de [FROM.GetLeader] fue certera: Panamá nunca aceptaría una anexión a Colombia. Evocó las muchas décadas en que el istmo estuvo bajo nuestro control y fue ignorado por los gobiernos en curso. Aseveró que la lucha por la independencia de Panamá fue un suceso definitivo e irreversible, y que el pueblo panameño ha de prosperar por cuenta propia. Es obvio que ante una invasión de nuestras fuerzas el istmo estará indefenso. Sin embargo, el principal inconveniente es que no hay ruta terrestre a la región, pues el tapón del Darién es una selva inexpugnable."
 colombia.48.a:0 "No saben lo que les conviene."

 colombia.49.title:0 "Panamá se dispone a ser reintegrada"
 colombia.49.desc:0 "Nuestra solicitud puso en evidencia al pueblo panameño la realidad actual: Panamá es una nación en crisis, reducida a ser un títere de Estados Unidos. Por ello, cuando la noticia del proyecto grancolombiano llegó a sus oídos, cientos de personas se manifestaron en la capital del país y alegaron que Panamá debía ser reintegrada a Colombia, no solo por el cambio estructural y político que está viviendo, sino porque representa un futuro más prometedor que siendo un enclave de los norteamericanos. Ante la presión popular, [FROM.GetLeader] aprobó la propuesta y el proceso de anexión ya se encuentra en curso."
 colombia.49.a:0 "Hacen lo correcto."

 colombia.50.title:0 "[FROM.GetName] propone retomar el proyecto grancolombiano"
 colombia.50.desc:0 "[FROM.GetLeader] dejó en claro, desde que asumió la presidencia del país vecino, su interés por reunificar la Gran Colombia. Sus deseos finalmente se están viendo materializados, por lo que nos notificó la posibilidad de unir nuestras dos naciones para darle continuidad al sueño del libertador Simón Bolívar. No obstante, aceptar supondría subyugar toda nuestra independencia y autonomía a la administración bogotana, además de la siempre persistente oposición por aceptar sin más complicaciones a que Venezuela deje de existir como nación. Muchos han mostrado su apoyo a la moción, aunque de igual manera otros se han negado rotundamente a aceptar. La decisión final está en manos de [VEN.GetLeader]."
 colombia.50.a:0 "¡Unidos honraremos el legado de Bolívar!"
 colombia.50.b:0 "Son solo ansias de poder."

 colombia.51.title:0 "[FROM.GetName] se niega a colaborar en el proyecto grancolombiano!"
 colombia.51.desc:0 "Tras un agudo debate entre los gobernantes de [FROM.GetName] a nivel local y nacional, [FROM.GetLeader] declaró que [FROM.GetName] no será anexada súbitamente. Alegó que el origen común que unía a Colombia y a Venezuela se perdió hace mucho tiempo, y que una unificación haría insostenible la nueva nación además de esparcir la inestabilidad política de Colombia al territorio venezolano. No está claro si [FROM.GetLeader] ha ordenado un repliegue militar a fin de evitar una invasión por parte nuestra, pero no sería algo de extrañar."
 colombia.51.a:0 "¡Son una deshonra para el libertador!"

 colombia.52.title:0 "El Gobierno de [FROM.GetName] aprueba nuestra propuesta"
 colombia.52.desc:0 "Tras un agudo debate entre los gobernantes de [FROM.GetName] a nivel local y nacional, la embajada nos notificó que [FROM.GetName] colaborará armoniosamente en la restauración de la Gran Colombia. Como estaba previsto en nuestra propuesta, [FROM.GetLeader] se mantendrá a la cabeza de la nueva administración en la región, y se adelantarán los trámites burocráticos necesarios para la unificación."
 colombia.52.a:0 "Se acerca el regreso de la Gran Colombia."

 colombia.53.title:0 "[FROM.GetName] está dispuesta a comprar Yaguas"
 colombia.53.desc:0 "Diplomáticos de [FROM.GetName] suministraron la posibilidad de que les vendemos el estado de Yaguas. De antaño fue parte de la Gran Colombia, y aunque no representa una zona estratégica ni ampliamente industrializada, insisten en que cedamos el terreno. Puede que sea una propuesta razonable, pero debemos tener en cuenta el costo-beneficio de la venta y si podría resultar factible a largo plazo. ¿Deberíamos aceptar?"
 colombia.53.a:0 "Una propuesta interesante."
 colombia.53.b:0 "Nuestra tierra no está en venta."

 colombia.54.title:0 "[FROM.GetName] acepta la venta de Yaguas"
 colombia.54.desc:0 "Yaguas fue parte de la Gran Colombia y la ayudaba a tener una frontera consistente con el amazonas. Por ello, es muy grato saber que [FROM.GetName] supo reconocerlo y aceptó cedernos el territorio. No falta mucho para reestablecer el territorio de [FROM.GetName] en el sur."
 colombia.54.a:0 "La diplomacia es un arte sutil."

 colombia.55.title:0 "[FROM.GetName] rechaza la propuesta de Yaguas"
 colombia.55.desc:0 "[FROM.GetLeader] tuvo la osadía de negarnos el territorio de Yaguas. Este estado fue parte de la Gran Colombia, y sin él nuestra nueva nación no tendrá una frontera consistente con el amazonas. Afirman que su soberanía sobre el territorio es la única reconocida y no lo piensan cambiar."
 colombia.55.a:0 "¡Entonces lo tomaremos nosotros mismos!"
 colombia.55.b:0 "Lástima."

 colombia.56.title:0 "[FROM.GetName] desea comprar Mapari"
 colombia.56.desc:0 "Diplomáticos de [FROM.GetName] han hecho saber al gobierno el interés de Colombia por adquirir el estado de Mapari. Afirman que están dispuestos a pagar una suma considerable, y que sería de gran ayuda en la reconstrucción de sus fronteras, propuesta por [FROM.GetLeader]. ¿Deberíamos aceptar esta oferta?"
 colombia.56.a:0 "Una propuesta interesante."
 colombia.56.b:0 "Nuestra tierra no está en venta."

 colombia.57.title:0 "[FROM.GetName] acepta la propuesta de Mapari"
 colombia.57.desc:0 "[FROM.GetLeader] está de acuerdo con vendernos Mapari, siempre y cuando paguemos el precio acordado y respetemos los demás límites que tenemos con ellos. Las guarniciones de [FROM.GetName] ya están siendo retiradas y el cambio de administración ya fue notificado a la población de la zona, los cuales (o al menos la mayoría) ven con esperanza este cambio."
 colombia.57.a:0 "Excelente."

 colombia.58.title:0 "[FROM.GetName] se niega a vender Mapari"
 colombia.58.desc:0 "[FROM.GetLeader] no está de acuerdo con vendernos Mapari, pues considera que nuestras ambiciones están llegando demasiado lejos al entrometernos con su soberanía. Por lo que es posible que refuercen la presencia militar en la zona para evitar un posible altercado. El gabinete ministerial lamenta que no se haya podido llegar a un acuerdo diplomáticamente, y la guerra comienza a verse como una opción plausible."
 colombia.58.a:0 "Volverá a ser nuestro, a cualquier costo."
 colombia.58.b:0 "No hay nada que hacer."

 colombia.59.title:0 "[FROM.GetName] quiere negociar la compra de Japurá"
 colombia.59.desc:0 "A través de una nota diplomática el gobierno de [FROM.GetName] ha notificado su interés por el estado de Japurá, que está bajo nuestro control. Este territorio, que de antaño fue parte de la Gran Colombia, parece representar parte de la identidad nacional de la nueva república que busca forjar [COL.GetLeader]. Es por ello que han ofrecido comprar el territorio, una opción que resuena entre los asesores gubernamentales como viable ante el tenso panorama actual."
 colombia.59.a:0 "Una propuesta interesante."
 colombia.59.b:0 "Nuestra tierra no está en venta."

 colombia.60.title:0 "[FROM.GetName] acepta vender Japurá"
 colombia.60.desc:0 "[FROM.GetLeader] estimó viable entregarnos el control de Japurá a cambio de la paga acordada. Los trámites burocráticos ya están en curso y los guardias fronterizos han sido movilizados a la línea divisora resultante. La población ha celebrado este hito y ven con buenos ojos el futuro de nuestra nación."
 colombia.60.a:0 "Nuestras fronteras se reestablecen."

 colombia.61.title:0 "[FROM.GetName] no accede a vender Japurá"
 colombia.61.desc:0 "[FROM.GetLeader] no considera viable entregarnos el control de Japurá por más que paguemos. Su declaración ha quedado en firme y solicita que no se vuelvan a presentar una propuesta similar, puesto que la decisión es definitiva. La opinión pública no ha visto con buenos ojos este fracaso diplomático, pero ante la situación en que se encuentra el país no hay mucho que se pueda hacer al respecto."
 colombia.61.a:0 "¡Pues se lo arrebataremos!"
 colombia.61.b:0 "Es una pena."

 colombia.62.title:0 "[FROM.GetName] solicita la venta de la Guayana Esequiba"
 colombia.62.desc:0 "Diplomáticos de [FROM.GetName] suministraron la posibilidad de que les vendemos el territorio del esequibo a ellos. Puede que sea una propuesta razonable, pero debemos tener en cuenta la cantidad de recursos que contiene el lugar y en costo-beneficio de la venta. ¿Deberíamos aceptar?"
 colombia.62.a:0 "Una propuesta interesante."
 colombia.62.b:0 "Nuestra tierra no está en venta."

 colombia.63.title:0 "[FROM.GetName] está dispuesto a vender el Esequibo"
 colombia.63.desc:0 "[FROM.GetName] accedió a cedernos el esequibo a cambio de una cuota industrial accesible. No era realmente esperado que [FROM.GetName] accediera, pero teniendo en cuenta el panorama mundial, es probable que aceptaran debido a su incapacidad de mantener el territorio."
 colombia.63.a:0 "Nuestras fronteras se reestablecen."

 colombia.64.title:0 "[FROM.GetName] no negociará la venta del Esequibo"
 colombia.64.desc:0 "Representantes de [FROM.GetName] han dejado claro que el territorio del esequibo no será vendido bajo ninguna circunstancia a nuestra nación, pues es una zona de recursos estratégica y esencial. Quizá previendo nuestros planes, han movilizado tropas a la zona fronteriza para su protección. No queda ya mucho que hacer al respecto diplomáticamente."
 colombia.64.a:0 "Si tanto insisten en conservar lo que es nuestro..."
 colombia.64.b:0 "Se quedará en sus manos entonces."

 colombia.65.title:0 "El Bloque Hispano"
 colombia.65.desc:0 "Con la amenaza del comunismo y del populismo democrático cerniéndose sobre el mundo, el presidente de Colombia [COL.GetLeader] nos ha propuesto entablar una alianza que podría mantener a nuestras naciones estables y seguras ante el conflicto. Recordando nuestra raíz común, Colombia busca que este nuevo “Bloque Hispano” represente la supremacía de la voluntad autocrática. De esta alianza no solo devendría una poderosa unión en un contexto bélico, sino también un apoyo mutuo ante cualquier ataque."
 colombia.65.a:0 "Una idea excelente."
 colombia.65.b:0 "No nos interesa aliarnos con un país atrasado."
 colombia.66.title:0 "El gobierno [From.GetAdjective] acepta ingresar al Bloque Hispano."
 colombia.66.desc:0 "Se ha notificado que el gobierno [From.GetAdjective] está de acuerdo en entrar al Bloque Hispano, para así hacer frente y contrapeso a las potencias mundiales actuales. Los respectivos trámites están en curso, por lo que espera que muy pronto se formalice la alianza y recibamos los informes compartidos de inteligencia."
 colombia.66.a:0 "Nuestra alianza hará temblar las potencias mundiales."
 colombia.67.title:0 "El gobierno [From.GetAdjective] no está interesado en unirse al Bloque Hispano."
 colombia.67.desc:0 "El embajador de [From.GetName] ha dejado en claro que no están interesados en entablar una alianza con nosotros. Menciona que la coyuntura mundial no amerita este tipo de propuestas en este momento, ni que resultan propicias considerando el delicado contexto en que se encuentra el mundo."
 colombia.67.a:0 "Puede que cambien de opinión más adelante."

 colombia.69.title:0 "Las elecciones de 1938"
 colombia.69.desc:0 "Estas elecciones han sido históricas, puesto que es la primera vez (gracias a las reformas de López Pumarejo) en la que los votantes no requirieron de condiciones de renta o ilustración para votar. Como estaba previsto, los conservadores se abstuvieron de participar, alegando que no tenían oportunidad de ganar ni garantías democráticas. Por tanto, el liberal Eduardo Santos ganó sin contendientes con un total de 511.947 votos."
 colombia.69.a:0 "El pueblo ha hablado."
 colombia.71.title:0 "Las elecciones de 1942"
 colombia.71.desc:0 "Al igual que hace cuatro años, el partido liberal resultó victorioso en estas elecciones. El expresidente López Pumarejo se presentó nuevamente como candidato y salió triunfante frente a otro candidato de la disidencia liberal. Aunque los cuatro años que vienen son prometedores, los conservadores más arraigados están lanzando amenazas sobre la nueva presidencia. Esperemos que no prosperen."

 colombia.72.title:0 "El ascenso de Rojas Pinilla"
 colombia.72.desc:0 "El oficial Gustavo Rojas Pinilla está demostrando un talento y habilidad excepcional para comandar unidades. Algunos lo atribuyen a sus conocimientos adquiridos en su misión militar, mientras que otros solo afirman que es un don nato. Sea cual fuera la razón, su desempeño ha impresionado a sus superiores, quienes han decidido unánimemente ascenderlo a general. Sin embargo, para el ascenso surta efecto, debe ser aprobado por el presidente [ROOT.GetLeader] tal como lo dicta la ley."
 colombia.72.a:0 "Tiene la aprobación."
 colombia.72.b:0 "Aún no está listo."

 colombia.73.title:0 "La cuestión opositora"
 colombia.73.desc:0 "Los focos de este nuevo estado conservador están puestos sobre los antiguos gobernantes y eternos opositores de la doctrina tradicionalista: los liberales. No cabe duda que su gestión ha sido sumamente popular, pero eso no excusa que sus reformas estaban llevando a Colombia por el camino del ateísmo y la anarquía. Era algo inaceptable. \n\nAhora bien, a pesar de que nuestro golpe de estado fue un éxito, los liberales siguen representando un serio problema para la república. Ya no están en las filas del poder, pero continúan movilizándose contra el orden institucional en las calles y en las plazas. Personajes como Jorge Eliécer Gaitán solo incitan a las masas a contradecir al gobierno, y si siguen haciendo de las suyas llegará un punto en que no tengamos control sobre el país. Pero teniendo en cuenta que su antiguo gobierno fue bastante exitoso, solo nos quedan dos opciones: o colaborar con ellos para evitar la ira popular, o arremeter contra ellos con tal fuerza que nunca podrán recuperarse."
 colombia.73.a:0 "Ya es momento de una Concentración Nacional."
 colombia_73_a_tt:0 "La §Yinfluencia subversiva liberal§! crecerá un §R25%§! más rápido, pero eliminarla será sencillo."
 colombia.73.b:0 "¡No le entregaremos el país a esos alienados!"
 colombia_73_b_tt:0 "La §Yinfluencia subversiva liberal§! crecerá un §G35%§! más lento, pero eliminarla será complicado."

 colombia.74.title:0 "La república sumida en el desorden"
 colombia.74.desc:0 "El gobierno de Laureano Gómez no ha sido popular. La estabilidad del país parece ser cada vez más baja, mientras que la violencia política, ya sea entre los partidos tradicionales o entre los fanáticos ideológicos, ha alcanzado un punto de agudeza nunca antes visto, sumado al constante temor de un conflicto bélico a escalas inimaginables. \n\nLa oposición ha culpado a Laureano Gómez y a sus políticas extremistas y represivas. Sorpresivamente, estos partidarios anti-laureano encontraron un aliado en las fuerzas armadas. El ejército también había estado viendo con malos ojos el nuevo régimen, y liderados por Gustavo Rojas Pinilla coincidieron con la oposición y ahora parecen estar organizando una gran rebelión. Tal vez la única forma de evitar que el país entre en su décima guerra civil es ceder el poder a Rojas y a los insurgentes pacíficamente..."
 colombia.74.a:0 "¡A ver si se atreven!"

 colombia.75.title:0 "El alzamiento de los opositores"
 colombia.75.desc:0 "Ocurrió lo que habíamos previsto, y sin embargo nos tomó por sorpresa. El ahora general rebelado Gustavo Rojas Pinilla consolidó suficiente poder entre la oposición como para liderar una rebelión armada. Llegan reportes urgentes de casi todos los rincones del país anunciando que varias guarniciones militares se han sublevado y han repartido armamento entre la población civil. La cadena de mando ha caído, el ejército ha quedado disperso y las fuerzas gubernamentales luchan fervientemente por recuperar el control institucional. Colombia ha entrado en una cruenta guerra civil."
 colombia.75.a:0 "¡Traidores ingratos!"
 colombia_75_tt:0 "Los partidarios de §YGustavo Rojas Pinilla§! iniciarán una guerra civil."

 colombia.76.title:0 "El golpe de opinión"
 colombia.76.desc:0 "El pueblo y la oposición celebran la caída del régimen de Laureano Gómez. En lo que han denominado el “Golpe de Opinión” (ya que ha sido apoyado por casi todo el país), el ahora general al mando Gustavo Rojas Pinilla asumió la presidencia sin derramar una sola gota de sangre. Rojas Pinilla promete estabilizar el país y llevarlo a una época de gloria nunca antes vista bajo cualquier otro mando. Sin duda no le será difícil, considerando que no solo es extraordinariamente popular, sino también hábil para mantener unido al ejército bajo su figura."
 colombia_76_tt:0 "§YComando General de las Fuerzas Armadas§! se convierte en el partido gobernante."
 colombia.76.a:0 "Y así comienza otro régimen militar..."

 colombia.77.title:0 "Nuestras fuerzas derrotan a los estadounidenses"
 colombia.77.desc:0 "La voluntad de nuestros hombres ha triunfado sobre las ambiciones estadounidenses de arrebatar nuestro territorio. Los valientes oficiales del ejército lideraron la carga contra las guarniciones norteamericanas; tan violento ataque resultó imposible de repeler, y hoy nuestras fuerzas ocuparon triunfales el canal. Se ha realizado el cambio de administración y el paso marítimo ha quedado definitivamente bajo nuestro control."
 colombia.77.a:0 "¡Retomamos lo que nos pertenece!"

 colombia.78.title:0 "El ejército es derrotado en el istmo"
 colombia.78.desc:0 "El dictador de Colombia [From.GetLeader] ha tenido la osadía de lanzar una gran ofensiva contra nuestras fuerzas del canal de Panamá desde unas bases cercanas. Su ha sido un éxito y nuestras confusas tropas se están replegando. El ataque ha mermado nuestra capacidad para proyectar nuestra fuerza al mundo, lo que supone una humillación a nivel internacional."
 colombia.78.a:0 "Por desgracia, tenemos asuntos más acuciantes. Un embargo debería bastar."
 colombia.78.b:0 "¡Esto amerita más que una advertencia!"

 colombia.79.title:0 "El ejército es vencido en el istmo"
 colombia.79.desc:0 "La ofensiva militar no tuvo el éxito esperado en el canal. Las fuerzas estadounidenses plantaron una feroz defensa, estableciendo un frente que nos resultó imposible de quebrar. Los oficiales ya han ordenado la retirada y nuestros hombres se han replegado nuevamente en el istmo."
 colombia.79.a:0 "Un pequeño inconveniente, nada más."

 colombia.80.title:0 "Nuestras fuerzas logran contener el ataque sobre el canal"
 colombia.80.desc:0 "El dictador de Colombia [From.GetLeader] ha tenido la osadía de lanzar una gran ofensiva contra nuestras fuerzas del canal de Panamá desde unas bases cercanas. Por suerte, nuestros valientes soldados lograron detener su operación y han repelido a los invasores. El ataque ha demostrado que ya no somos los dueños del continente, lo que supone una humillación a nivel internacional."
 colombia.80.a:0 "Por desgracia, tenemos asuntos más acuciantes. Un embargo debería bastar."
 colombia.80.b:0 "¡Estas acciones son inaceptables!"

 colombia.81.title1:0 "[USA.GetName] cede ante la presión sobre el canal de Panamá"
 colombia.81.title2:0 "Conflictos por el control del canal de Panamá"
 colombia.81.desc1:0 "Tras un inesperado ataque al Canal de Panamá, las fuerzas colombianas ocuparon la zona circundante y dispersaron a las fuerzas estadounidenses asentadas en el lugar. [COL.GetLeader] calificó este suceso como una victoria total y definitiva, alegando que todo el territorio panameño finalmente está “en manos de su legítimo dueño”. \n\nLa comunidad internacional reconoce que este suceso es una humillación para las fuerzas estadounidenses y tal vez suponga la decadencia de dicho país. Si bien [USA.GetLeader] no ha dado declaraciones al momento, no sería de extrañar que responda con severas represalias contra la nación sudamericana."
 colombia.81.desc2:0 "Tras un inesperado ataque al Canal de Panamá, fuerzas del ejército colombiano atacaron el enclave estadounidense desde unas bases militares cercanas. No obstante, el ataque no logró consumarse y supuso una aplastante derrota para los agresores. Mientras que ni [COL.GetLeader] ni [USA.GetLeader] han brindado declaraciones al respecto, analistas internacionales concuerdan que este suceso no pasará desapercibido, por lo que no sería de extrañar que los norteamericanos respondan con severas represalias contra la nación latina."
 colombia.81.a:0 "¡Demostramos nuestra fuerza!"
 colombia.81.b:0 "Una ofensa a la soberanía de Estados Unidos."
 colombia.81.c:0 "¿Colombia pretende hacer de las suyas sin consecuencias?"

 colombia.82.title:0 "La negociación sobre los campos petroleros"
 colombia.82.desc:0 "Similar a nuestros congéneres mexicanos y venezolanos, nuestro país es uno de los grandes productores de petróleo de la región. Nuestra economía depende en gran parte de su extracción, pero la reciente industrialización ha dejado ver que las arcas de la nación no solo se llenan con ese llamado “oro negro”. \n\nPara dejar de depender casi exclusivamente de esta exportación, hemos organizado un plan para otorgarle concesiones a otras potencias extranjeras democráticas a cambio de un apoyo en la producción civil y militar. Esto no solo nos beneficiará en materia industrial a nosotros, sino que apoyará la causa bélica en la defensa de la democracia durante estos recios tiempos. Lo único que resta es firmar el plan y elegir a quién vamos a presentarlo."
 colombia.82.a:0 "La maquinaria estadounidense necesita combustible colombiano."
 colombia.82.b:0 "El ejército francés está algo corto de crudo."
 colombia.82.c:0 "Nuestro petróleo ayudará a Marina Real británica."
 colombia.82.d:0 "Otros potencias necesitan nuestros recursos."
 
 colombia.83.title:0 "Colombia ofrece la concesión de sus yacimientos petrolíferos"
 colombia.83.desc:0 "En un giro de sucesos inesperado, la embajada de Colombia nos hizo llegar un plan desarrollado por el mismo [COL.GetLeader] en que nos propone otorgarnos derechos sobre uno de sus yacimientos petroleros a cambio de una sencilla y modita cuota industrial. Aceptar la oferta es una opción tentadora, aunque si la nación está corta en fábricas quizá debamos rechazarla."
 colombia.83.a:0 "¡Una propuesta maravillosa!"
 colombia.83.b:0 "Ahora no estamos en condiciones de aceptar."
 COL_oil_concession:0 "Nos han cedido sus recursos"
 
 colombia.84.title:0 "[FROM.GetName] acepta la concesión"
 colombia.84.desc:0 "Una nota diplomática nos ha informado que [FROM.GetLeader] mostró gran interés por la oferta de nuestro plan de concesión y la aceptó inmediatamente. Los respectivos trámites ya están en curso y se espera que dentro de poco la concesión se formalizará y recibiremos nuestra cuota industrial."
 colombia.84.a:0 "¡Excelente!"
 
 colombia.85.title:0 "[FROM.GetName] rechaza la concesión sobre el petróleo"
 colombia.85.desc:0 "Aunque estábamos seguros que [FROM.GetName] iba a aceptar nuestra oferta, sorpresivamente ha llegado la noticia de que la han rechazado. Alegan no estar en condiciones de cumplir la cuota industrial que pedimos a cambio y que deberíamos buscar otra opción."
 colombia.85.a:0 "Será para otro entonces."

 colombia.86.title:0 "Los oligarcas condenan el gobierno de [ROOT.GetLeader]"
 colombia.86.desc:0 "Un reporte urgente proveniente del ministerio de hacienda confirma que la nación ha entrado en una delicada crisis económica y social. Varios emprendedores y oligarcas decidieron retirar del país sus principales industrias tras conocer que [ROOT.GetLeader] ratificó la tan controversial reforma agraria, expresando que dicha reforma era “innecesaria” y que iba “en contra del emprendimiento nacional”. En consecuencia, los magnates cerraron sus principales industrias y alegaron no volver a abrirlas hasta que el gobierno garantizara el “trato justo que merecen”. Si el gobierno no se pronuncia al respecto, es seguro que otros oligarcas del país tomarán la misma decisión."
 colombia.86.a:0 "¡Pero es por el bien del pueblo!"

 colombia.87.title:0 "Los sindicatos se movilizan contra el gobierno "
 colombia.87.desc:0 "Hoy ha llegado una preocupante noticia a la oficina presidencial. Las principales organizaciones sindicales del país se hartaron de esperar la colaboración del gobierno. El enojo de estos grupos llegó a su punto máximo cuando se les notificó que la administración de [ROOT.GetLeader] no sancionó la reforma agraria tan anhelada entre el gremio obrero, sino que continuó con una política que privilegia a los oligarcas por encima de a los trabajadores. Debido a esto, los líderes sindicales incitaron a sus seguidores a bloquear las carreteras, impedir el paso de suministros y organizar huelgas generales a lo largo de todo el país. Afirman que estas acciones no se detendrán hasta que el gobierno ceda y reforme la ley laboral."
 colombia.87.a:0 "¡Pero es por el bien de la república!"

 colombia.88.title:0 "El tratado de asistencia colombo-americano"
 colombia.88.desc:0 "Con la amenaza fascista y comunista cerniéndose sobre el mundo occidental, el presidente de Colombia [COL.GetLeader] nos ha propuesto entablar una alianza que podría mantener a nuestras dos naciones estables y seguras ante un posible conflicto."
 colombia.88.a:0 "Una alianza estratégica."
 colombia.88.b:0 "No nos interesa."

 colombia.89.title:0 "Estados Unidos firma el tratato"
 colombia.89.desc:0 "La embajada estadounidense en la capital del país confirmó que [USA.GetLeader] accedió a ratificar el tratado, y que entrará en vigor lo antes posible. Sin embargo, quizá solo veamos sus efectos cuando nos encontremos en un conflicto armado."
 colombia.89.a:0 "¡Buenas noticias!"

 colombia.90.title:0 "Estados Unidos rechaza el tratado"
 colombia.90.desc:0 "La embajada estadounidense en la capital del país notificó que [USA.GetLeader] no se mostró interesado en ratificar el tratado de asistencia, y que no estaba dispuesto a aceptar una propuesta similar en estos tiempos de guerra."
 colombia.90.a:0 "Entonces no contamos con ellos..."

 colombia.91.title:0 "La reunificación de la Gran Colombia"
 colombia.91.desc:0 "Tras haber recuperado todas las naciones pertenecientes a la antigua Gran Colombia, el gobierno colombiano en cabeza de [COL.GetLeader] proclamó a la comunidad internacional la reunificación oficial de la Gran Colombia. Inspirados por las ideas políticas de Simón Bolívar, la propaganda pannacionalista se ha esparcido por toda la nación, cimentando la confianza de los ciudadanos en el futuro de su nueva patria. \n\nSin embargo, este “renacimiento del legado de Bolívar” ha dado mucho de qué hablar en el continente americano; mientras unos argumentan que la inestabilidad hará colapsar la naciente república, otros consideran que las amenazas externas son un problema mucho más grande. Por ahora, el porvenir del pueblo colombiano sigue siendo un misterio."
 colombia.91.a:0 "¡El mundo sabrá de lo que somos capaces!"
 colombia.91.b:0 "Otro desequilibrio de poder en la región."
 colombia.91.c:0 "¡No durarán mucho!"

 colombia.92.title:0 "Golpe de estado en la Gran Colombia"
 colombia.92.desc:0 "Como respuesta al colapso de la administración civil en la Gran Colombia durante la presidencia de Laureano Gómez, los dos partidos tradicionales del país apoyaron una rebelión liderada por el ahora general Gustavo Rojas Pinilla. Aunque este alzamiento estuvo cerca de convertirse en otra guerra civil para el país, los militares finalmente depusieron al gobierno de Laureano Gómez e instauraron a Rojas Pinilla como nuevo jefe de estado. \n\nEste histórico suceso ha sido nombrado el ‘golpe de opinión’ por los analistas, puesto que ha sido apoyado por casi todos los sectores políticos no laureanistas de la nación. Aunque el nuevo gobierno no ha dado declaraciones expresas, se espera que Rojas Pinilla estabilice al país y reduzca el violento legado de su predecesor."
 colombia.92.a:0 "¡Una nueva era para Colombia!"
 colombia.92.b:0 "Era de esperarse."
 colombia.92.c:0 "¡Los derrotaremos en cualquier caso!"

 colombia.93.title:0 "¡Óscar Benavides se rebela contra el gobierno!" 
 colombia.93.desc:0 "El general Óscar Benavides venía presentando tendencias a la insubordinación desde hacía ya un tiempo. Estaba claro que no concordaba del todo con el nuevo gobierno que se instauró tras la Asamblea Constituyente. Hoy finalmente se dio a conocer que su rebelión es definitiva: Benavides abandonó su cargo y cruzó a Colombia al tiempo de la declaración de guerra. Ahora está al servicio de nuestros enemigos, pretendiendo instaurar un nuevo régimen en nuestra nación con su apoyo."
 colombia.93.a:0 "¡Traidor!"

 colombia.95.title:0 "El gobierno provisional de Loreto" 
 colombia.95.desc:0 "Con Loreto bajo ocupación por parte de nuestras fuerzas armadas, el general Óscar Benavides ha sugerido establecer allí el nuevo gobierno provisional peruano. Ya se ha establecido un orden administrativo para mantener el orden, y se han comenzado a reclutar milicias militares para apoyar la causa peruana. Benavides ha manifestado su agradecimiento con nosotros, y espera que las relaciones entre el nuevo estado peruano y nuestra nación sean cercanas y amigables."
 colombia.95.a:0 "Juntos reestableceremos en orden en Perú."

 colombia.96.title:0 "La muerte de Vásquez Cobo" 
 colombia.96.desc:0 "La república está de duelo. Tras sufrir varios quebrantos de salud, el general Vásquez Cobo, héroe de la guerra colombo-peruana y gran opositor de los politiqueros falleció hoy. Su avanzada edad no le fue impedimento para liderar el golpe contra los dos partidos tradicionales, que estaban llevando a la nación a un estado de violencia cíclica y perpetua. Su legado vivirá en el devenir de la nación y su dedicación nunca será olvidada por el pueblo colombiano. Mas ahora la cuestión es ¿quién liderará la república?"
 colombia.96.a:0 "Instaurar una junta mantendrá fuera los intereses personales."
 colombia.96.b:0 "El Estado Mayor asumirá las funciones gubernamentales."
 colombia.96.c:0 "El general Villamizar debe tomar el mando."
 colombia.96.d:0 "El general Bonitto Vega es el líder indicado."

 colombia.97.title1:0 "El ejército toma el control de Japurá"
 colombia.97.title2:0 "Las fuerzas armadas ocupan Mapari"
 colombia.97.desc1:0 "El ataque coordinado que hemos planificado sobre Japurá ha sido todo un éxito. Las fuerzas brasileñas se han replegado y han quedado desorganizadas mientras las nuestras han ocupado triunfantes el estado. No hace falta esperar para saber que [BRA.GetLeader] no reaccionará de la mejor manera a este suceso, pero al menos se ha asegurado la supremacía de nuestro ejército sobre el de ellos. Japurá pronto será oficialmente reintegrada a Colombia."
 colombia.97.desc2:0 "La rápida ofensiva de nuestras tropas supuso un choque brutal entre nuestro ejército y el brasileño. El combate resultante se extendió por un tiempo hasta terminar con nuestra victoria y posterior ocupación de Mapari. Los comandantes de los batallones han recibido múltiples elogios por este triunfo al igual que el general encargado de liderar el enfrentamiento. Mapari está definitivamente bajo control colombiano, como debe ser."

 colombia.98.title1:0 "El ejército es derrotado en Japurá"
 colombia.98.title2:0 "Nuestras fuerzas son derrotadas en Mapari"
 colombia.98.desc1:0 "El ataque coordinado que hemos planificado sobre Japurá ha sido todo un fracaso total. Las fuerzas brasileñas opusieron una feroz resistencia y le resultó imposible a nuestros soldados asegurar el territorio. No hace falta esperar para saber que [BRA.GetLeader] no reaccionará de la mejor manera a este suceso por más que hayan triunfado. En el peor de los escenarios, podría estallar un conflicto bélico a gran escala entre las dos naciones."
 colombia.98.desc2:0 "La rápida ofensiva de nuestras tropas supuso un choque brutal entre nuestro ejército y el brasileño. El combate resultante se extendió por un tiempo, pero lastimosamente fuimos incapaces de tomar el control de Mapari. Los comandantes de los batallones todavía no se explican como un ataque tan planificado no tuvo el éxito esperado, mientras que el general al mando alude a varios factores de distinta índole. Las tropas han quedado muy desmoralizadas ante esta derrota, al igual que la opinión pública cuestiona la verdadera eficacia de nuestro ejército."

 colombia.99.title1:0 "El ataque a Japurá es repelido"
 colombia.99.title2:0 "Los colombianos se retiran de Mapari"
 colombia.99.desc1:0 "Colombia ha tenido la osadía de lanzar una gran ofensiva contra nuestras fuerzas en Japurá desde unas bases cercanas. Era algo que esperábamos conociendo las ambiciones dictatoriales de [COL.GetLeader]. Por suerte, nuestros valientes soldados lograron detener su operación y han repelido a los invasores. Esta heroica defensa ha demostrado que nuestro ejército sigue estando en mejor estándar, reforzando nuestra soberanía en la región y nuestra unidad nacional."
 colombia.99.desc2:0 "Un inesperado ataque colombiano a las guarniciones en Mapari obligó a nuestros hombres a entablar combate con los agresores. Afortunadamente, las divisiones fueron lo suficientemente fuertes para resistir en sus puestos y ni un metro de tierra quedó bajo control agresor. [BRA.GetLeader] ha exaltado la labor y el heroísmo de los soldados en el amazonas, pero aún se cuestiona si sería propicio organizar una respuesta militar o mantener el statu quo."
 colombia.99.a:0 "Demostramos nuestra supremacía."
 colombia.99.b:0 "¡Es una acto de agresión!"

 colombia.100.title1:0 "Las fuerzas colombianas ocupan Japurá"
 colombia.100.title2:0 "El ejército colombiano toma el control de Mapari"
 colombia.100.desc1:0 "Colombia ha tenido la osadía de lanzar una gran ofensiva contra nuestras fuerzas en Japurá desde unas bases cercanas. Era algo que esperábamos conociendo las ambiciones dictatoriales de [COL.GetLeader]. Por desgracia, nuestro ejército fue incapaz de repeler el ataque y el estado ha caído en manos de los colombianos. Parece que nuestra nación está en declive, y es posible que las demás naciones se aprovechen de esta apariencia para sacar ventaja propia."
 colombia.100.desc2:0 "Un inesperado ataque colombiano a las guarniciones en Mapari obligó a nuestros hombres a entablar combate con los agresores. Lastimosamente fue imposible repeler la carga y el estado ha terminado bajo ocupación colombiana. Los oficiales militares sugieren concretar un plan de ataque para hacerlos retroceder, pero considerando el resultado de la batalla, es probable que sea infructuoso."
 colombia.100.a:0 "Que se lo queden entonces."
 colombia.100.b:0 "¡Inaudito!"

 colombia.101.title:0 "Colombia planea arrebatar nuestro territorio en el norte"
 colombia.101.desc:0 "[COL.GetLeader] ha tenido el descaro de reclamar para su nación el territorio que controlamos en el norte y que justamente obtuvimos hace ya varios años. Si no enviamos un contingente de defensa a la frontera con Colombia, puede que se apoderen de ella sin mediar palabra, lo que sería todo un desprestigio para nuestro gobierno y para el ejército brasileño."
 colombia.101.a:0 "Manejaremos la situación como se deba."

 colombia.102.title:0 "Los políticos colombianos exiliados ofrecen su apoyo"
 colombia.102.desc:0 "Tras el golpe de estado de Alfredo Vásquez Cobo en Colombia, muchos políticos tuvieron que partir al exilio ante la inminente toma de poder por parte de los militares. Sin embargo, se mantuvieron empeñados en retomar el poder en su nación y reestablecer el orden institucional previo. Esta es su oportunidad. Varios de esos exiliados han ofrecido al gobierno colaborar con nosotros en nuestra lucha, brindándonos su conocimiento sobre el funcionamiento interno del país para obtener una ventaja estratégica. Nuestros asesores gubernamentales no están totalmente de acuerdo en aceptar esta oferta, ya que no tenemos certeza sobre sus intenciones o si tan siquiera son verdaderas."
 colombia.102.a:0 "¡Nos hacía falta esa ayuda!"
 colombia.102.b:0 "No son de fiar."

 colombia.103.title:0 "¡Los políticos en el exilio están apoyando a [From.GetName]!"
 colombia.103.desc:0 "Tras el golpe de estado de Alfredo Vásquez Cobo en Colombia, muchos políticos tuvieron que partir al exilio ante la inminente toma de poder por parte de los militares. Sin embargo, se mantuvieron empeñados en retomar el control y reestablecer el orden institucional previo. Ahora, con el conflicto cerniéndose sobre Colombia, estos exiliados han encontrado su oportunidad de actuar; han tenido la osadía de ofrecerse al gobierno [From.GetAdjective] como colaboracionistas para derrocar el nuevo régimen. Ahora el enemigo conoce cómo funciona nuestro gobierno y tendrá ventaja estratégica en el combate."
 colombia.103.a:0 "¡Incluso desde el extranjero traicionan a su patria!"

 colombia.104.title:0 "Triunfo confederado en la guerra de unificación"
 colombia.104.desc:0 "Nuestro apoyo a las fuerzas unionistas ha sido de gran ayuda en su campaña. El triunfo de su cometido ha sido bien recibido por la población, y se ha proclamado oficialmente la nueva Confederación Perú-boliviana. [PRU.GetLeader] ha notificado su gratitud para con nuestro gobierno, y espera que las relaciones entre la nueva nación y la nuestra sea cercana y gratificante. No obstante, puede que estén sospechando de nuestras intenciones por mantener la hegemonía de la región, lo que podría conllevar en un conflicto futuro. Pero esas conjeturas son inconclusas, y mientras nuestras acciones sean sutiles, no debería haber inconvenientes en nuestra labor."
 colombia.104.a:0 "Excelente."

 colombia.105.title:0 "¡Los unionistas se preparan para una insurrección!"
 colombia.105.desc:0 "El momento que menos esperábamos finalmente ha llegado. Sabemos que las milicias unionistas se están preparando para alzarse en armas, y no hay mucho que podamos hacer salvo prepararnos para la guerra civil inminente. Es muy probable que cuenten con el apoyo militar de los colombianos, pero la coyuntura no nos permite encargarnos de ellos en este momento. Debemos hacer frente a los unionistas primero y luego nos haremos cargo de sus artífices."
 colombia.105.a:0 "¡Los aplastaremos!"

 colombia.106.title:0 "El gobierno colombiano apoya las milicias subversivas"
 colombia.106.desc:0 "Nuestros informes de inteligencia reportan que las organizaciones de extrema derecha que abogan por la reunificación de la Confederación Perú-Boliviana están aumentando sus actividades en la nación. Estos incidentes antes eran aislados, pero se están intensificando debido a lo que parece ser un apoyo económico por parte de los colombianos. Estas acusaciones son delicadas, por lo que la ausencia de pruebas concluyentes nos deja en una posición inviable. En cualquier caso, lo mejor es prepararnos antes que sea demasiado tarde."
 colombia.106.a:0 "¡¿Quienes se creen que son?!"

 ### Evento Generico al Comienzo del Juego 
 EUYL_startupevent.1.t:0 "Muchas Gracias por Jugar En Unión Y Libertad | A South America Rework!"
 EUYL_startupevent.1.d:0 "Thank you so much for playing the mod. If you encounter any bug, feel free to report it on steam or on the discord. Also, please keep in mind this mod is available in English, Spanish, and Portuguese.\n\nMuchas gracias por jugar al mod! Si llegan a encontrar cualquier bug, reportenlo en steam o en el discord. Por favor tengan en cuenta que este mod esta disponible en Ingles, Español, y Portugues.\n\nMuito obrigado por jogar o mod. Se você encontrar algum bug, sinta-se à vontade para relatá-lo no Steam ou no Discord. Além disso, lembre-se de que este mod está disponível em inglês, espanhol e português."
 EUYL_startupevent.1.a:0 "Genial, lo haré"
 EUYL_startupevent.1.b:0 "Jesucristo, deja de molestarme"

 news.bolivia.t:0 "La Guerra Civil Boliviana"
 news.bolivia.d:0 "Tras la negación de Tejada a ceder ante el ejército, los generales Germán Busch y David Toro decidieron tomar las armas, utilizando su apoyo militar e influencia sobre las fuerzas armadas, y organizaron un levantamiento a gran escala contra el gobierno de Tejada. Ya se han producido múltiples informes de atentados, y los combates se suceden mientras se envía este mensaje a nivel mundial. \n\nEl país está muy dividido, y muchos expertos no saben cuál será el resultado de este conflicto, ni las consecuencias que traerá. \n\nLo único que podemos hacer es esperar que la situación no se agrave más allá de las fronteras de Bolivia".
 news.bolivia.a:0 "¡Vamos a acabar con esto!"
 news.bolivia.b:0 "Espero que puedan recuperarse de esto"


 ### Brasil ###
 brazil.1.t:0 "Las plantaciones de café se ofrecen para ayudar a Nuestra Economía"
 brazil.1.d:0 "Propietarios de varias plantaciones de café se han puesto de acuerdo y han decidido prestarnos parte de sus bienes a nuestro gobierno para ayudarnos en nuestros proyectos. \n\nSu ayuda nos será muy útil y puede darnos justo la cantidad que necesitamos para muchos de nuestros proyectos más abitidos. No parece que quieran ser reembolsados, siempre y cuando permitamos que sus plantaciones prosperen bajo nuestra gestión."
 brazil.1.a:0 "¡Esto será de gran ayuda!"

 brazil.2.t:0 "El Desarrollo Urbano ha Destruido una de Nuestras Plantaciones"
 brazil.2.d:0 "Nos ha llegado la noticia de que el desarrollo urbano se ha expandido tanto que ha destruido una plantación. Los propietarios de dicha plantación están muy enfadados por nuestra "negligencia" ante la situación y exigen que restablezcamos su plantación y/o reduzcamos nuestro desarrollo urbano. \n\nA estas alturas necesitamos industrializar nuestra nación, por lo que dar un paso atrás en este punto no será suficiente. Nuestra dependencia del café disminuirá, pero tal vez sea para mejor".
 brazil.2.a:0 "Lo siento por eso..."

 brazil.3.t:0 "Se ha Instalado una Plantación Ilegal de café"
 brazil.3.d:0 "Debido a la disminución del poder de las plantaciones de café en la economía de la nación, muchos han comenzado a establecer plantaciones ilegales en diferentes partes del país. Los propietarios de estas plantaciones ilegales parecen estar molestos con nuestra gestión de las plantaciones, y afirman que les hemos tratado bastante mal, por lo que han decidido protestar estableciendo estas plantaciones ilegales. \n\n¿Debemos detener a las personas que están detrás de estas plantaciones ilegales? ¿O lo dejamos pasar y vemos a qué conduce?"
 brazil.3.a:0 "Dejemos que lo hagan"
 brazil.3.b:0 "Impedir que lo hagan"

 brazil.4.t:0 "Las Plantaciones se Rebelan Contra el Gobierno"
 brazil.4.d:0 "Algunas de las plantaciones, establecidas legal o ilegalmente, han comenzado a rebelarse contra nuestro gobierno desde nuestro repentino cambio a una economía industrializada. \n\nParece que nuestra transición a una economía industrializada no será tan suave como parecía. Tendremos que combatir el fuego con fuego y acabar con los rebeldes antes de que sea demasiado tarde. \n\nNo se sabe cómo irá esto, pero hay que esperar lo mejor."
 brazil.4.a:0 "¡Ganaremos esta batalla!"

 brazil.5.t:0 "Las Plantaciones han sido Detenidas con éxito"
 brazil.5.d:0 "Después de muchos meses de idas y venidas, pudimos detener con éxito las plantaciones rebeldes y calmar la situación. Debido a las protestas masivas y a la sangrienta represión de las mismas, lo más probable es que nunca podamos depender del café, al menos durante mucho tiempo. \n\nLo bueno es que ahora podemos centrarnos plenamente en la construcción de nuestra economía y en el crecimiento de nuestra industria. Si todo va bien, podremos dejar atrás este horrible incidente y mirar hacia un nuevo y brillante futuro."
 brazil.5.a:0 "Esto fue para mejor"

 brazil.6.t:0 "Los Agricultores Aceptaron Auestro Acuerdo"
 brazil.6.d:0 "Los propietarios de las plantaciones de nuestra nación han acordado permitir que nuestra nación se industrialice a una velocidad lenta y controlada, permitiendo que sus plantaciones sigan prosperando mientras nosotros nos industrializamos lentamente."
 brazil.6.a:0 "Haremos crecer la nación juntos"

 brazil.7.t:0 "Los Agricultores rechazaron nuestro acuerdo"
 brazil.7.d:0 "Los propietarios de las plantaciones han rechazado nuestro acuerdo, y nos han dicho que no interrumpamos su negocio a toda costa. Parece que nuestra trnasición a una economía industrializada no será tan suave como parecía."
 brazil.7.a:0 "Parece que tendremos un nuevo enemigo"

 brazil.8.t:0 "¿Cuánto le Gustaría Invertir en el Ejército?"
 brazil.8.d:0 "Tenemos la opción de invertir cierta cantidad de nuestro poder político sobre la nación en la expansión de nuestro ejército. Algunos expertos nos dicen que invirtamos poco, y que vayamos aumentando con el tiempo, mientras que otros nos dicen que invirtamos lo máximo posible ahora. \n\nDadas estas opciones, ¿con cuál deberíamos quedarnos?"
 brazil.8.a:0 "Invertir 35 poder político"
 brazil.8.b:0 "Invertir 60 de poder político"
 brazil.8.c:0 "Invertir 110 de poder político"

 brazil.9.t:0 "Brasil Solicita Licencia para Producir nuestros Tanques"
 brazil.9.d:0 "Políticos y generales brasileños han llegado hoy a Washington D.C. para solicitarnos una petición. Están solicitando acceso para producir nuestros tanques, y para algunos de nuestros tanques. \n\nNuestras relaciones con Brasil y los brasileños han mejorado en los últimos años, y su posición dominante en América del Sur podría ser de gran importancia estratégica para nosotros, especialmente en el futuro si alguna vez nos encontramos en una situación difícil. \n\nTeniendo en cuenta estos factores, ¿deberíamos aceptar su petición?"
 brazil.9.a:0 "Aceptar su petición"
 brazil.9.b:0 "Negar su petición"

 brazil.10.t:0 "Brasil Solicita la Compra de uno de nuestros Transportistas"
 brazil.10.d:0 "Los brasileños se han fijado en nuestros modelos de portaaviones y han decidido que podrían hacer un buen uso de uno de nuestros portaaviones en su propia armada. \n\n¿Deberíamos permitirles comprar uno de nuestros portaaviones?"
 brazil.10.a:0 "Sí"
 brazil.10.b:0 "No"

 brazil.11.t:0 "Opositores políticos protestan contra nuestras campañas de propaganda"
 brazil.11.d:0 "Varios funcionarios y muchos de sus partidarios han tomado represalias contra nuestro aumento de influencia en la esfera política de la nación. Las protestas han comenzado a extenderse por todo el país a medida que miles de personas comienzan a reclamar que estamos incrementando egoístamente nuestro propio poder. \n\nLas espinas crecen cada vez más en nuestros costados cuanto más intentamos sacar adelante nuestra agenda política. Tenemos que ser conscientes de las decisiones que tomamos de las consecuencias que pueden venir después."
 brazil.11.a:0 "No van a protestar durante mucho tiempo"

 brazil.12.t:0 "A [FROM.GetName] le gustaría que invirtiéramos en su país"
 brazil.12.d:0 "[FROM.GetName] se ha puesto en contacto con nosotros recientemente, preguntando si estaríamos dispuestos a invertir en su economía. Afirman que nos beneficiaremos a largo plazo y que nuestra economía crecerá junto a la suya. \n\n¿Deberíamos invertir parte de nuestras reservas en [FROM.GetName]?"
 brazil.12.a:0 "Sí, absolutamente"
 brazil.12.b:0 "No, no nos sobra el dinero"

 brazil.13.t:0 "[FROM.GetName] ha Invertido! ¿Dónde debemos poner el dinero?"
 brazil.13.d:0 "Nuestros funcionarios han informado con una excelente noticia, [FROM.GetName] ha aceptado nuestra petición y ha invertido una buena suma de sus reservas en nuestra economía. \n\nAhora nos toca a nosotros decidir en qué queremos invertir ese dinero. \n\nCon esta elección en la palma de la mano, ¿en qué debemos invertir ese dinero?"
 brazil.13.a:0 "Invertirlo en los mercados civiles"
 brazil.13.b:0 "Invertirlo en el ejército"
 brazil.13.c:0 "Invertirlo en la Marina"
 brazil.13.e:0 "Invertirlo en la infraestructura y el sistema ferroviario"

 brazil.14.t:0 "[FROM.GetName] no ha aceptado nuestra solicitud"
 brazil.14.d:0 "Lamentablemente, [FROM.GetName] ha rechazado nuestra petición de invertir en nuestra nación, diciendo que simplemente no tienen suficiente dinero de sobra para invertir en nuestra nación. Esperemos que puedan invertir en otro momento".
 brazil.14.a:0 "Lamentable"

 brazil.15.t:0 "¡Vargas ha comenzado los preparativos para el establecimiento de su Estado Novo!"
 brazil.15.d:0 "Vargas ha comenzado oficialmente los preparativos para su versión de Brasil, estableciéndose en el centro del país y dirigiéndolo a su gusto. \n\nNo se sabe mucho de cómo va a lograr tal hazaña, sin embargo muchos especulan con un posible autogolpe para deponer al congreso y tomar el control total de la nación. Debemos estar atentos a lo que planea Vargas y debemos asegurarnos de que no se interponga en nuestro camino".
 brazil.15.a:0 "¡Nos aseguraremos de que no lo haga!"

 brazil.16.t:0 "El Congreso ha intervenido en nuestros planes"
 brazil.16.d:0 "El Congreso de Brasil se ha dado cuenta de nuestras acciones sin precedentes sobre el Estado y ha impuesto varias reformas para intentar reducir la influencia sobre nuestra nación". \n\nTeniendo en cuenta el poder del congreso en este momento, no se puede hacer mucho, pero con suficiente esfuerzo y tiempo, podríamos ser capaces de cambiar las tornas."
 brazil.16.a:0 "No podrán detenernos"

 brazil.17.t:0 "El Congreso interviene en nuestros planes para una dictadura"
 brazil.17.d:0 "El congreso se ha dado cuenta de algunas de nuestras extrañas acciones y han comenzado a establecer reformas a nivel nacional para hacer retroceder el avance de nuestra dictadura". \n\nTodavía es un misterio cómo han sido capaces de descubrir nuestros planes, pero tenemos que tener cuidado con sus acciones. Si impulsan demasiadas reformas, podríamos estar en serios problemas".
 brazil.17.a:0 "¡Las meras reformas no nos detendrán!"

 brazil.18.t:0 "Los comunistas planean extender su influencia a otro estado"
 brazil.18.d:0 "Nuestra cobertura de inteligencia sobre la nación ha detectado actividad subversiva comunista en un estado que no informó previamente de ninguna actividad de este tipo. Parece que los comunistas están planeando establecerse completamente allí. \n\nTenemos que intentar detenerlos antes de que sea demasiado tarde".
 brazil.18.a:0 "Dejemos que lo tomen, lo recuperaremos después"
 brazil.18.b:0 "¡Estos malditos comunistas no van a tomar ni un centímetro más de este país!"

 brazil.19.t:0 "Los comunistas han extendido la propaganda sobre el país"
 brazil.19.d:0 "Los comunistas han comenzado a difundir propaganda masiva sobre su movimiento al pueblo de Brasil, especialmente dentro de los estados donde la actividad subversiva está actualmente activa. \n\nTambién están apuntando mucho a los agricultores y a la clase baja, por lo que tenemos que tener cuidado en los estados donde tenemos plantaciones."
 brazil.19.a:0 "Qué tácticas más sucias"

 brazil.20.t:0 "¡Los comunistas están planeando hacer estragos en un estado!"
 brazil.20.d:0 "Algunos de nuestros espías encubiertos han informado de un descubrimiento bastante desalentador: los comunistas están planeando causar daños deliberadamente en un estado sobre el que tienen influencia para hacer oír su voz. \n\nTenemos que ser muy cuidadosos, ya que aún no sabemos la gravedad de los daños. Debemos intentar detenerlos lo antes posible".
 brazil.20.a:0 "¿Hablas en serio?"

 brazil.22.t:0 "Los integralistas aumentan su influencia sobre el país"
 brazil.22.d:0 "Utilizando algunas tácticas bastante cuestionables, los integralistas han incrementado su influencia sobre la política de este país y están empezando a suponer una seria amenaza para el poder administrativo que tenemos sobre el país. \n\nTenemos que intentar detenerlos antes de que se vuelvan demasiado poderosos. Como mínimo, debemos asegurarnos de que sean amigos de nuestro gobierno".
 brazil.22.a:0 "No tienen nada bueno..."

 brazil.23.t:0 "El Congreso elabora reformas para controlar más eficazmente a la nación"
 brazil.23.d:0 "El Congreso ha anunciado oficialmente una nueva ola de reformas para el país y su política con el fin de establecer un punto de apoyo aún mayor en la nación. Esto desbaratará algunos de nuestros planes, y hará que la influencia del congreso sobre la nación se dispare. \n\nN - Cueste lo que cueste, tenemos que asegurarnos de que el congreso no haga esto a menudo, para que podamos continuar adecuadamente con nuestros planes."
 brazil.23.a:0 "Molestia molesta"

 brazil.24.t:0 "Nuestros espías contrarrestaron con éxito a los comunistas"
 brazil.24.d:0 "Nuestros espías han informado con fantásticas noticias, han podido contrarrestar el caso y detener a los comunistas que ocupaban el estado. \n\nCon una victoria tan importante, el movimiento comunista seguramente recibirá un gran golpe de esto. Sólo tenemos que presionar un poco más y podremos acabar completamente con los comunistas".
 brazil.24.a:0 "¡Es una noticia fantástica!"

 brazil.25.t:0 "Nuestros espías fueron contrarrestados"
 brazil.25.d:0 "Nuestros espías fueron desafortunadamente derrotados por los comunistas mientras intentaban detener la actividad subversiva comunista. \n\nEsta fue una gran derrota, y una completa humillación. Lo más probable es que los comunistas aprovechen esta derrota para utilizarla contra nosotros. \n\nLo único que queda es esperar que podamos detener lo que venga después".
 brazil.25.a:0 "¡Esto es terrible!"

 brazil.26.t:0 "Los integralistas esperan que se nombre a Plinio Salgado"
 brazil.26.d:0 "Los integralistas hasta ahora han apoyado nuestros esfuerzos para establecer un gobierno más autoritario, y debido a esto están esperando que nombremos a Plínio Salgado como ministro de educación. \n\nSi lo hacemos o no depende de nosotros, y cada una de nuestras opciones tendrá aspectos positivos y negativos."
 brazil.26.a:0 "Por ahora veremos"

 brazil.27.t:0 "¡Los integralistas han ocupado uno de nuestros estados!"
 brazil.27.d:0 "Los informes locales nos han informado de que los integralistas han comenzado a ocupar militarmente uno de nuestros estados para establecer el dominio sobre la esfera política brasileña."
 brazil.27.a:0 "¡Maldito sea todo esto!"

 brazil.28.t:0 "Los integralistas causan estragos en uno de sus estados ocupados"
 brazil.28.d:0 "Los integralistas han decidido demoler uno de los estados que ocupan como acto de resistencia contra nuestro gobierno. \n\nSi continúan con estos flagrantes actos de terrorismo, habrá graves consecuencias."
 brazil.28.a:0 "Malditos bastardos"

 brazil.29.t:0 "Simpatizantes integralistas inician protestas en todo el país"
 brazil.29.d:0 "Los integralistas han tomado las calles de todo el país para protestar contra la supresión de su movimiento, y la administración de nuestro país. Plínio Salgado y Gustavo Barroso son la punta de lanza de estas protestas, y están tratando de desestabilizar la nación a propósito. \n\nEstas protestas deben detenerse inmediatamente, y sus líderes deben ser arrestados. Si estas protestas continúan, podemos estar en serios problemas".
 brazil.29.a:0 "¡Abajo el integralismo!"

 brazil.30.t:0 "Los integralistas intensifican su levantamiento"
 brazil.30.d:0 "Utilizando varias tácticas de propaganda barata e influencia sobre la nación, los integralistas han intensificado su levantamiento y están haciendo planes a gran escala en la próxima guerra civil. \n\nTenemos que estar bien preparados para este conflicto, todos nuestros hombres deben ser reclutados en caso de una guerra civil total."
 brazil.30.a:0 "Esperemos que podamos detener esto"

 brazil.31.t:0 "Carlos Prestes ha sido arrestado"
 brazil.31.d:0 "El revolucionario comunista Carlos Prestes ha sido capturado y detenido por nuestras autoridades. Esto supondrá un gran golpe para el movimiento comunista y seguramente les afectará en los próximos años. \n\nNo será una victoria completamente tranquila, ya que los comunistas probablemente harán un último esfuerzo para tomar represalias contra el encarcelamiento de Prestes, pero sin su líder deberíamos ser capaces de lidiar con él con bastante rapidez."
 brazil.31.a:0 "¡Genial!"

 brazil.33.t:0 "Prestes comienza a planear una revuelta"
 brazil.33.d:0 "Después de trabajar en la sombra durante algún tiempo, los comunistas han comenzado a planear un levantamiento a gran escala para vengar el fallido intento de sublevación de 1935. \n\nA diferencia de la última vez, esta vez parece estar mucho más organizado, y la cantidad de gente que apoya a Prestes es mucho mayor que en el intento de 1935. Tenemos que tener cuidado aquí, un paso en falso podría costarnos mucho".
 brazil.33.a:0 "¡Serán aplastados!"

 brazil.35.t:0 "Cafeteros hostiles hablan contra nuestro partido"
 brazil.35.d:0 "Los cafeteros enfurecidos han tomado el campo para protestar y hablar contra nuestro partido. Exigen que les demos más representación política y que invirtamos más recursos en los cafetales."
 brazil.35.a:0 "No necesitamos esto ahora"

 brazil.36.t:0 "Los cafeteros hostiles han boicoteado sus ganancias"
 brazil.36.d:0 "Las plantaciones de café hostiles se han unido y han boicoteado nuestra economía impidiendo que sus beneficios lleguen al gobierno nacional. Este acto de protesta está resultando perjudicial para nuestra economía y debemos enfrentarnos a ellos tan rápido como podamos."
 brazil.36.a:0 "¡Se les pondrá en su sitio!"

 brazil.37.t:0 "Vargas ha suprimido nuestro movimiento"
 brazil.37.d:0 "Vargas se ha dado cuenta de que nuestro movimiento está ganando adeptos entre la gente, así que él y los miembros de su gabinete han decidido adoptar un enfoque más político. Vargas ha difamado públicamente a nuestro movimiento y ha tomado medidas para suprimir nuestra capacidad de extender nuestro movimiento a otros lugares del país. \n\nEste gobierno tiránico se derrumbará y Vargas pagará por lo que hizo".
 brazil.37.a:0 "Bien dicho compañero. ¡Vargas caerá!"

 brazil.38.t:0 "Vargas desestabiliza nuestros planes"
 brazil.38.d:0 "Con tácticas deleznables, Vargas ha interferido en nuestros planes y ha desestabilizado nuestra revuelta hasta cierto punto. Debido a esto, necesitamos acelerar nuestros planes para compensar este contratiempo."
 brazil.38.a:0 "Podemos hacer frente a un contratiempo"

 brazil.39.t:0 "Los comunistas de [FROM.GetName] quieren nuestro apoyo en su levantamiento"
 brazil.39.d:0 "Agentes encubiertos de [FROM.GetName] han venido a nuestra sede para pedir apoyo en su levantamiento contra la 'opresión de Vargas y su régimen autoritario'. \n\nAfirman que poseemos lo que necesitan para que la revuelta campesina contra el gobierno actual tenga éxito y están dispuestos a devolver nuestras contribuciones a su levantamiento. \n\n¿Debemos prestarles nuestra ayuda?"
 brazil.39.a:0 "Esta es nuestra oportunidad de oro, les ayudaremos"
 brazil.39.b:0 "No podemos permitirnos ayudar en este momento"

 brazil.40.t:0 "[FROM.GetName] ha accedido a ayudarnos"
 brazil.40.d:0 "¡Nuestros agentes encubiertos han vuelto con excelentes noticias! Han dicho que [FROM.GetNameDEF] nos ayudará en nuestra revuelta, y nos suministrará todo lo que necesitemos siempre que le paguemos."
 brazil.40.a:0 "Perfecto"

 brazil.41.t:0 "[FROM.GetName] se ha negado a ayudarnos"
 brazil.41.d:0 "Nuestros agentes encubiertos han vuelto de [FROM.GetName] con noticias desgarradoras. Han dicho que no nos prestarán ayuda en nuestra revuelta contra el gobierno."
 brazil.41.a:0 "¡Esto es terrible!"

 brazil.42.t:0 "¡Vargas se ha enterado de nuestra actividad y ha interferido!"
 brazil.42.d:0 "Vargas se ha enterado de nuestra actividad por medios que aún no hemos descubierto. Nuestros hombres han sido arrestados realizando esta tarea y nuestros planes generales han sufrido un revés debido a esto. \n\nN - Tenemos que ser más cuidadosos en un futuro próximo, o de lo contrario Vargas puede descubrir todos nuestros planes."
 brazil.42.a:0 "¡Pagará por esto!"

 brazil.43.t:0 "Vargas ha sido asesinado"
 brazil.43.d:0 "Las radios de todo el país comenzaron a enloquecer, ya que los informes han confirmado que Vargas ha sido asesinado por lo que parece ser un grupo terrorista no identificado. \n\nLas consecuencias de este acontecimiento han comenzado, ya que la gente de todo el país ha comenzado a realizar protestas masivas, la mayoría de ellas violentas y con disparos. \n\nLa nación se está derrumbando mientras hablamos, por favor, si alguien está allí leyendo esto, manténgase a salvo, quédese en casa, y tenga cuidado de con quién está rodeado. Pueden ser un aliado, o un enemigo esperando para atacar".
 brazil.43.a:0 "Ha llegado nuestra hora"

 brazil.44.t:0 "Intento fallido de asesinato de Vargas"
 brazil.44.d:0 "Hoy llegaron informes de que hubo un intento de asesinato contra Vargas. El grupo responsable ha sido identificado como parte del Partido Comunista de Brasil. \n\nSus intenciones, sin embargo, siguen siendo un misterio para el público y el gobierno. Sea cual sea el objetivo final, Vargas ha anunciado oficialmente una guerra total contra los comunistas dentro del país y los "erradicará" de la nación sin importar los costes."
 brazil.44.a:0 "¡Mierda! Esto no fue como se esperaba!"

 brazil.45.t:0 "Los separatistas paulistas comienzan a tomar las armas"
 brazil.45.d:0 "Con la nación en un estado de guerra interna y caos, los sentimientos nacionalistas dentro de Sao Paulo han comenzado a crecer exponencialmente, y algunos incluso han comenzado a tomar las armas con el fin de convertirse en una nación soberana. \n\nLas implicaciones que esto provocará aún son objeto de debate, pero ahora mismo tenemos que ocuparnos de este asunto."
 brazil.45.a:0 "Esto no es bueno"

 brazil.46.t:0 "Los integralistas han comenzado a armarse"
 brazil.46.d:0 "A medida que nuestra nación cae más y más en la anarquía, los integralistas han comenzado a tomar las armas y a organizarse. \n\nPor lo que parece, están planeando un levantamiento a gran escala y aprovechar el desastre que es Brasil actualmente. \n\nDeberíamos tener cuidado con lo que hacen, después de todo su levantamiento podría inclinar la balanza de esta guerra, para bien o para mal."
 brazil.46.a:0 "¡Los aplastaremos!"

 brazil.47.t:0 "Los integralistas han reforzado su revuelta"
 brazil.47.d:0 "Los informes de algunos de nuestros partidarios disfrazados nos han informado de varios planes de los integralistas para aumentar la fuerza de su sublevación. Quieren ganar esta guerra civil como sea, y lo harán por cualquier medio. \n\nTenemos que prepararnos para su levantamiento, sólo Dios sabe cuándo atacarán y cuántos hombres respaldarán sus ideales".
 brazil.47.a:0 "¡Aún así perderán!"

 brazil.48.t:0 "Los integralistas han ganado las elecciones"
 brazil.48.d:0 "Los votos han sido contados y los resultados han salido. Los integralistas se han adelantado en el recuento de votos, y tomarán posesión del cargo a partir de hoy. \n\nEl mundo está sorprendido por este resultado, ya que nadie esperaba que el partido fascista de Brasil fuera el primero. Los diplomáticos alemanes e italianos ya están felicitando a los integralistas por su victoria, y el pueblo está celebrando en las calles."
 brazil.48.a:0 "Es nuestra hora de brillar" 

 #añadir más
 brazil.48.t:0 "Los integralistas han ganado las elecciones"
 brazil.48.d:0 "Los votos han sido contados y los resultados han salido. Los integralistas se han adelantado en el recuento de votos, y tomarán posesión del cargo a partir de hoy. \n\nEl mundo está sorprendido por este resultado, ya que nadie esperaba que el partido fascista de Brasil fuera el primero. Los diplomáticos alemanes e italianos ya están felicitando a los integralistas por su victoria, y el pueblo está celebrando en las calles."
 brazil.48.a:0 "Es nuestra hora de brillar"

 #añadir más tal vez
 brazil.49.t:0 "José Américo ganó las elecciones"
 brazil.49.d:0 "Los votos han sido contados y los resultados han salido. José Américo de Almeida se ha adelantado en el recuento de votos y tomará posesión de su cargo a partir de hoy. \n\nCon el apoyo de Vargas, Américo promete no cambiar mucho el país y mejorarlo aún más. Con el mundo ardiendo rápidamente, también prometió mantenerse totalmente neutral en caso de un conflicto global".  
 brazil.49.a:0 "El pueblo ha hablado"
 
 brazil.50.t:0 "El Partido de la Unión Democrática ha ganado las elecciones"
 brazil.50.d:0 "Los votos han sido contados y los resultados han salido a la luz. La Unión Democrática Brasileña, liderada por Armando de Sales Oliveira, ha ganado oficialmente y tomará posesión del cargo a partir de hoy. \n\nOccidente está encantado con los resultados y hemos recibido cartas de felicitación del Reino Unido, Francia y Estados Unidos".
 brazil.50.a:0 "El pueblo ha sido escuchado"
 
 brazil.51.t:0 "[FROM.GetName] quiere que les ayudemos en la guerra civil"
 brazil.51.d:0 "Diplomáticos de [FROM.GetName] nos han preguntado si podemos ayudarles de alguna manera en la guerra civil brasileña. \n\n¿Debemos ayudarles?"
 brazil.51.a:0 "Sí"
 brazil.51.b:0 "No"
 
 brazil.52.t:0 "[FROM.GetName] ¡Está de acuerdo en ayudar!"
 brazil.52.d:0 "[FROM.GetName] está de acuerdo en ayudarnos, y pronto enviará ayuda de la manera que pueda".
 brazil.52.a:0 "¡Perfecto!"
 
 brazil.53.t:0 "[FROM.GetName] se niega"
 brazil.53.d:0 "[FROM.GetName] se ha negado a ayudarnos, afirmando que no están en condiciones de hacerlo en este momento"
 brazil.53.a:0 "Desafortunado"
 
 brazil.54.t:0 "[FROM.GetName] envía equipo"
 brazil.54.d:0 "[FROM.GetName] nos ha enviado equipo de infantería para ayudarnos en nuestros esfuerzos!"
 brazil.54.a:0 "Cualquier ayuda es muy apreciada"
 
 brazil.55.t:0 "[FROM.GetName] ¡envía bonos de guerra!"
 brazil.55.d:0 "[FROM.GetName] nos ha enviado bonos de guerra para ayudar a nuestra economía durante nuestra lucha en la guerra!"
 brazil.55.a:0 "Cualquier ayuda es muy apreciada"

 brazil.56.t:0 "[FROM.GetName] envía voluntarios"
 brazil.56.d:0 "[FROM.GetName] nos ha enviado fuerzas de voluntarios para ayudarnos en la guerra civil. Han declarado que estaremos a cargo de sus hombres!"
 brazil.56.a:0 "Cualquier ayuda es muy apreciada"
 
 brazil.57.t:0 "¡La guerra ha concluido finalmente!"
 brazil.57.d:0 "Después de muchos, muchos meses de lucha, sangre, caos y muerte, la nación ha sido finalmente unificada bajo una sola bandera. La historia recordará para siempre esta guerra civil como una de las más mortíferas conocidas por el hombre, con millones de soldados en total. \n\nLa gente comenzó a vitorear en las calles destrozadas, y muchos soldados lloraron de alegría al poder reunirse con sus familias. \n\nTenemos un largo camino por delante, y muchos problemas que afrontar, pero seremos capaces de salir adelante y convertirnos en un Brasil que nadie ha soñado".
 brazil.57.a:0 "Que esta nueva paz sea eterna"
 
 brazil.58.t:0 "Un joven con un gran sueño"
 brazil.58.d:0 "Basil Dos Santos, un joven adolescente que vive en las tierras de cultivo de Río de Jainero con su cuidador. Visita con frecuencia a su grupo de amigos que viven en un pueblo cercano, y antes del comienzo de la guerra civil, se le solía ver cuidando las plantaciones de café que rodean su casa. \n\nSin embargo, todo cambió cuando los comunistas empezaron a trabajar en la clandestinidad para derrocar al gobierno, y algunos de estos soldados se acercaron a Basil para pedirle que les ayudara a esconder armamento en las plantaciones. Asustado, Basil accedió y comenzó a esconderlas, pero los soldados quedaron impresionados por su rapidez y eficacia, y rápidamente reconocieron al joven adolescente como un prodigio. Ya se ha corrido la voz de su ayuda entre los comunistas, y también entre los campesinos".
 brazil.58.a:0 "Muchos tienen sueños, ¿qué hace que el suyo sea tan especial?"
 brazil.58.b:0 "Intrigante, deberíamos vigilarlo"
 
 brazil.59.t:0 "¡Basil se gana el apoyo de los agricultores!
 brazil.59.d:0 "El joven y su visión fueron vistos inicialmente sólo como eso, la visión de un niño. Sin embargo, esta visión parece haber calado en un determinado grupo de personas de nuestro estado: los agricultores. Los agricultores de todo el país se han quedado prendados de su visión y parecen encontrar su inexperiencia juvenil como algo entrañable y no como un obstáculo. Por ahora, parece que Basil se ha ganado el estatus de celebridad entre los agricultores, pero no hay duda de que su influencia se extenderá aún más por toda nuestra nación. Al ver que sus casas se derrumban y que su vida cotidiana desaparece, muchos agricultores han empezado a vitorear a Basil, y algunos ya lo proclaman como el salvador de Brasil y de su pueblo."
 brazil.59.a:0 "¿Por qué se preocupan por un niño mísero?"
 brazil.59.b:0 "Un desarrollo interesante"
 
 #cambiar el parlamento con lo que sea
 brazil.60.t:0 "¡El pueblo exige la investidura inmediata de Basilio!
 brazil.60.d:0 "La tranquila mañana de hoy se ha visto bruscamente interrumpida por el sonido de miles de hombres, mujeres y niños que protestaban en la sede comunista de [ROOT.GetCapitalVictoryPointName] con una simple demanda: desean la inmediata dimisión de [BRA.GetLeader] y la toma de posesión de Basilio. Lo que antes era un simple niño que sólo deseaba hacer realidad su sueño se ha convertido en un movimiento político con un poder monumental en [BRA.GetName], y ese poder ha pedido nuestra colaboración. \n\nEl pueblo no dejará de corear el nombre de Basilio, y ahora que las bajas no hacen más que aumentar, tenemos que tomar una decisión y rápido".
 brazil.60.a:0 "¿Están locos? ¡Una sentencia infantil es absurda!"
 brazil.60.b:0 "El pueblo ha hablado y nosotros escucharemos en consecuencia..."
 
 brazil.61.t:0 "[FROM.GetName] ¡Exige nuestra subyugación!" #Puede ser incorrecto, tal vez usar FROM o BRA
 brazil.61.d:0 "[FROM.GetName] exige nuestra subyugación inmediata! Ya han alineado miles de soldados en nuestra frontera y esperamos una respuesta de nuestra parte pronto. \n\n¿Qué debemos hacer?"
 brazil.61.a:0 "¿Tenemos realmente alguna opción en el asunto?"
 brazil.61.b:0 "¡Independencia o muerte!"
 
 brazil.62.t:0 "[FROM.GetName] ¡Cede a nuestras demandas!"
 brazil.62.d:0 "[FROM.GetName] ha aceptado convertirse en nuestro súbdito, y a partir de hoy tendremos poder administrativo sobre la mayor parte de su nación."
 brazil.62.a:0 "Han tomado la decisión correcta".
 
 brazil.63.t:0 "¡[BRA.GetName] está invadiendo [URG.GetName]!"
 brazil.63.d:0 "Los reporteros llegaron hoy en tropel a la Casa Rosada, sudando profusamente y gritando '[BRA.GetName] está invadiendo Uruguay!'. Esta información es algo que nadie hubiera esperado, y sin embargo está ocurriendo mientras hablamos ahora mismo. \n\nEl hermano está haciendo algo atroz en este momento, y Uruguay no tiene ninguna posibilidad de derrotarlos. Con nuestro hermano en peligro, ¿debemos intervenir y detener a los belicosos?"

 brazil.64.t:0 "[ARG.GetName] ha decidido intervenir en nuestro reclamo de [URG.GetName]"
 brazil.64.d:0 "Nuestros diplomáticos nos han notificado que [ARG.GetName] está interviniendo oficialmente, y apoyará plenamente a los uruguayos en este conflicto."
 brazil.64.a:0 "¡Se arrepentirán de haberse unido a esta guerra!"
 
 brazil.65.t:0 "¿Hacer la paz con [BRA.GetName]?"
 brazil.65.d:0 "Hemos perdido muchos hombres en esta guerra inútil. Nuestros soldados no aguantan más, el pueblo está protestando en las calles exigiendo que salgamos de la guerra. \n\n¿Qué debemos hacer?"
 brazil.65.a:0 "No más derramamiento de sangre"
 brazil.65.b:0 "No se puede hacer la paz con monstruos"

 brazil.66.t:0 "¿Quién nos guiará?"
 brazil.66.d:0 "Tenemos unas cuantas opciones, será una elección muy difícil. Hay muchos buenos líderes a nuestra disposición, dispuestos a darlo todo para dirigir el país y mejorarlo en todo lo posible. \n\nMientras hablamos, los votos han sido contados, y el pueblo ha elegido como líder..."
 brazil.66.a:0 "[ROOT.GetLeader]"
 brazil.66.b:0 "El Congreso"
 brazil.66.c:0 "Armando Sales"
 brazil.66.e:0 "Luis Washington"
 brazil.66.f:0 "José Américo"
 brazil.66.g:0 "Afranio de Melo"

 brazil.67.t:0 "Una llamada de auxilio brasileña"
 brazil.67.d:0 "Los integralistas brasileños piden ayuda para su próxima revuelta que están organizando. Afirman que necesitan nuestra ayuda para mejorar sus posibilidades de derrocar al gobierno. \n\nTenemos dos opciones, ir en su ayuda, o dejarlos en paz"
 brazil.67.a:0 "Aceptar su petición"
 brazil.67.b:0 "Negar su petición"
 
 brazil.68.t:0 "Prestes Assassination Attemp Succedes"
 brazil.68.d:0 "El partido comunista está enloqueciendo, organizando protestas masivas en todo el país, exigiendo una explicación del gobierno sobre el asesinato de Prestes. \n\nTodo el mundo está tratando de encontrar una explicación para esto, que es exactamente lo que estábamos esperando. Ahora los comunistas no tendrán la oportunidad de rebelarse sin un líder adecuado, y el país sólo se ha desestabilizado aún más como resultado."
 brazil.68.a:0 "Exactamente como estaba previsto"
 
 brazil.69.t:0 "Falló el intento de asesinato de Prestes"
 brazil.69.d:0 "El extracto del periódico dice `Una alegría para el partido comunista hoy, ya que un asesino de origen desconocido fue enviado a matar a Prestes y fue abatido antes de que pudieran alcanzarlo. Los seguidores del partido comunista se han levantado en armas y están muy enfadados.`nuestros planes han fracasado, y el pueblo está conmocionado. Afortunadamente nuestro aassasin pudo mantener su identidad en secreto, el único problema es que no estamos seguros de que siga siendo un secreto por mucho tiempo."
 brazil.69.a:0 "¡Mierda! ¡MIERDA! Esto no es bueno!"

 brazil.70.t:0 "El plan comunista de revuelta"
 brazil.70.d:0 "Agentes encubiertos nos han informado que los comunistas están recuperando armamento electrónico de las plantaciones de café y armando milicias. A juzgar por la situación actual del país, no hay duda de que están planeando un levantamiento a gran escala para tratar de establecerse como líderes del país. \n\nHagamos lo que hagamos, no podemos dejar que eso ocurra, y debemos hacer todo lo que esté en nuestra mano para intentar derrotarlos lo antes posible".
 brazil.70.a:0 "¡Esos bastardos no sobrevivirán ni un mes!"

 brazil.71.t:0 "La cuestión real"
 brazil.71.d:0 "La familia real ha sido cuestionada si es necesaria. Su papel en el país ha cambiado desde la disolución del Imperio, e incluso pueden poner una espina en nuestro lado teniendo en cuenta los ideales opuestos. \n\n¿Debemos deportarlos de este país, darles mayores funciones en el gobierno, o dejarlos en paz?"
 brazil.71.a:0 "Deportarlos"
 brazil.71.b:0 "Darles funciones en el Gobierno"
 brazil.71.c:0 "Dejar que se queden"

 brazil.72.t:0 "Patrianovistas ofrecen apoyo en el levantamiento integralista"
 brazil.72.d:0 "Los Patrianovistas nos han ofrecido apoyo en nuestro levantamiento. Reconocen nuestros diferentes ideales, sin embargo, están dispuestos a dejar de lado nuestras diferencias y ayudarnos en nuestros esfuerzos contra Vargas. \n\n¿Aceptamos o negamos?"
 brazil.72.a:0 "Tomaremos todo lo que ayude"
 brazil.72.b:0 "¡Estamos bien por nuestra cuenta!"

 brazil.73.t:0 "¡El [BZE.GetName] solicitan nuestra ayuda!"
 brazil.73.d:0 "El [BZE.GetName] solicitan ayuda en su guerra civil. Están planeando un levantamiento a gran escala para restaurar la monarquía en el país, y con la actual situación política del país, creen que es la oportunidad perfecta para hacerlo. \n\n¿Debemos prestarles nuestra ayuda?"
 brazil.73.a:0 "Claro, cualquier cosa para ayudarles"
 brazil.73.b:0 "No podemos hacer eso ahora"

 brazil.74.t:0 "¡Los [BZE.GetName] quieren que intervengamos en la guerra civil!"
 brazil.74.d:0 "Los imperialistas brasileños piden que intervengamos totalmente en la guerra civil y les ayudemos en sus esfuerzos contra las otras facciones. \n\n¿Debemos intervenir y ayudarlos? ¿O debemos dejarlos a su aire?"
 brazil.74.a:0 "¡Es hora de ayudar a nuestros hermanos!"
 brazil.74.b:0 "Lo siento, pero no"

 brazil.75.t:0 "Una revuelta uruguaya fracasada"
 brazil.75.d:0 "Los monárquicos de Uruguay han fracasado en su levantamiento. \n\n¿Nos hacemos cargo o los dejamos en paz?"
 brazil.75.a:0 "A la guerra"
 brazil.75.b:0 "Ahora no es el momento"

 brazil.76.t:0 "Una oportunidad para golpear"
 brazil.76.d:0 "Tenemos una oportunidad de golpear a [BRA.GetName]. Se encontraron en una guerra con Argentina y Uruguay al mismo tiempo, y sus fuerzas están todas concentradas en su frontera, mientras que nuestra frontera está completamente vacía. \n\n¿Nos arriesgamos o no es el momento?"
 brazil.76.a:0 "Tomar nuestros riesgos"
 brazil.76.b:0 "No podemos permitirnos una guerra en este momento"

 brazil.77.t:0 "Unificación con Brasil"
 brazil.77.d:0 "Los brasileños han ofrecido una unificación de nuestros territorios. Si aprovechamos esta oportunidad, podríamos convertirnos en una potencia imparable, y convertirnos en una verdadera amenaza para los que consideramos enemigos. \n\nN - Debería"
 brazil.77.a:0 "Sí, nos unificaremos"
 brazil.77.b:0 "No, no nos unificaremos"

 brazil.78.t:0 "Portugal se niega a la unificación"
 brazil.78.d:0 "Los portugueses se han negado a nuestra petición de unificación y no han tomado ninguna decisión para cambiar sus costumbres"
 brazil.78.a:0 "Maldito sea todo".

 brazil.79.t:0 "Levantamiento uruguayo"
 brazil.79.d:0 "El levantamiento uruguayo ha comenzado, y nuestro dominio imperial está ahora luchando contra el gobierno uruguayo. \n\nN para intervenir y manejar la situación. Una vez que hayamos limpiado Uruguay, los integraremos en el Imperio una vez más."
 brazil.79.a:0 "Entendido"

 brazil.80.t:0 "El país estaba convencido del plan Cohen"
 brazil.80.d:0 "El pueblo, el congreso y el ejército estaban convencidos del Plan Cohen. Gracias a esto, el congreso nos concederá aún más poder sobre este golpe inventado para dirigir con puño de hierro."
 brazil.80.a:0 "Perfecto"

 brazil.81.t:0 "Los integralistas intentan un último esfuerzo"
 brazil.81.d:0 "Pudimos recoger información sobre los planes de un último esfuerzo de los integralistas para poner a Plínio en el poder. También pudimos saber que están planeando un ataque total al Palacio de Guanabara. \n\nTenemos que tener cuidado con su próximo movimiento. Podría estropear todos nuestros planes si las cosas se tuercen".
 brazil.81.a:0 "¡Estos malditos bastardos!"

 brazil.82.t:0 "[BRA.GetName] nos propone un plan"
 brazil.82.d:0 "[BRA.GetName] se ha puesto en contacto con nosotros, diciéndonos que tienen un plan bajo la manga. No sólo quieren unirse a nuestra facción y ayudarnos en nuestra guerra contra los aliados, sino que también quieren crear un nuevo frente en Sudamérica invadiendo Uruguay. \n\nAunque el plan parece arriesgado, seguramente desviará la atención de los aliados de Europa a Sudamérica, ahora que sus posesiones allí estarán en peligro. ¿Debemos estar de acuerdo con su plan?"
 brazil.82.a:0 "Los dejaremos entrar cuando lancen el ataque"
 brazil.82.b:0 "No podemos permitirnos otro frente"

 brazil.83.t:0 "[BRA.GetName] Quiere comprar nuestras colonias en África"
 brazil.83.d:0 "Diplomáticos brasileños han llegado hoy a nuestra nación para proponernos una oferta. Estarían dispuestos a pagar una gran suma de dinero por nuestras tierras en África. También prometen mantener relaciones positivas con nosotros y defendernos en caso de una invasión extranjera. \n\n¿Debemos aceptar su oferta?"
 brazil.83.a:0 "Claro, pueden tenerlo"
 brazil.83.b:0 "Absolutamente no"

 brazil.84.t:0 "[FROM.GetName] Quiere comprar nuestras posesiones en Sudamérica"
 brazil.84.d:0 "Diplomáticos de [FROM.GetName] han venido a [ROOT.GetName] para pedir nuestras posesiones sudamericanas al norte de su territorio. Están dispuestos a pagar una gran suma de dinero por dichas posesiones. \n\n¿Debemos aceptar?"
 brazil.84.a:0 "Claro, pueden tenerlas"
 brazil.84.b:0 "Absolutamente no"

 brazil.85.t:0 "[BRA.GetName] exige un referéndum democrático en nuestra nación"
 brazil.85.d:0 "Diplomáticos brasileños han venido a [ROOT.GetName], exigiendo que celebremos un referéndum democrático y dejemos que el pueblo elija. Nos han advertido que habrá consecuencias nefastas si no hacemos el referéndum. \n\n¿Debemos ceder o mantenernos firmes?"
 brazil.85.a:0 "Cedemos"
 brazil.85.b:0 "¡No se saldrán con la suya!"

 brazil.86.t:0 "¿Debemos unificarnos con las Repúblicas Unidas de América Latina?"
 brazil.86.d:0 "Nos han informado de que se han formado las Repúblicas Unidas de América Latina y nos preguntan si queremos unirnos a su unión. Ya nos han asegurado que estaremos debidamente representados en la unión. \n\nEntonces, ¿debemos unirnos y convertirnos juntos en una superpotencia?"
 brazil.86.a:0 "Hagámoslo"
 brazil.86.b:0 "¡Nunca!"

 brazil.87.t:0 "¡Portugal trata de resucitar la monarquía!"
 brazil.87.d:0 "Espías portugueses capturados han confesado que el gobierno portugués está planeando instigar un levantamiento imperial a gran escala dentro de la nación. Tenemos que tener mucho cuidado con su próximo movimiento, ya que esto podría afectar en gran medida el curso de la guerra."
 brazil.87.a:0 "¡Estos malditos bastardos!"

 brazil.88.t:0 "Portugal nos ayudará en nuestros esfuerzos imperiales"
 brazil.88.d:0 "Los espías portugueses han llegado en secreto a nuestro cuartel general para informarnos de que contamos con el pleno apoyo de la monarquía portuguesa y de sus fuerzas. Si necesitamos ayuda, simplemente debemos pedirla y ellos responderán".
 brazil.88.a:0 "¡Eso es genial!"

 brazil.89.t:0 "¿Lanzamos el Ataque hacia el Palacio de Guanabara?"
 brazil.89.d:0 "Nuestros miembros leales nos han informado que todas las piezas están en su lugar para nuestro ataque contra el Palacio de Guanabara. Una vez que lo hagamos, la guerra civil comenzará oficialmente cuando nuestras fuerzas se organicen y tomen el control de varios estados en el sur de Brasil. \n\n¿Lanzamos el ataque ahora o esperamos un poco?"
 brazil.89.a:0 "¡Hagámoslo!"
 brazil.89.b:0 "Aún no estamos listos"

 brazil.90.t:0 "Varios generales enemigos se han puesto de nuestro lado"
 brazil.90.d:0 "Después de su derrota en la guerra civil y de dejar las armas, algunos de sus generales han venido a nosotros para ofrecer su apoyo en nuestro lado del conflicto y llevar a Brasil a una era mejor."
 brazil.90.a:0 "¡Genial!"

 news.361.t:0 "Levantamiento integralista en Brasil"
 news.361.d:0 "El mundo no podía más que asistir atónito al desmoronamiento de las esferas políticas y sociales brasileñas con el levantamiento integralista en el país. Los integralistas han conseguido un apoyo masivo para su movimiento, utilizando las malas acciones de los líderes actuales y pasados para alimentar su partido y crecer en apoyo. \n\nMientras hablamos, muchas batallas ya están estallando por toda la nación, y la mayoría cree que Brasil llegará a un estado de pura guerra interna. Los expertos ya predicen que ésta será una de las guerras civiles más mortíferas conocidas por el hombre, y sólo acaba de empezar."
 news.361.a:0 "¡Venceremos!"
 news.361.b:0 "¡No se saldrán con la suya!"
 news.361.c:0 "Jesucristo"

 news.362.t:0 "Levantamiento paulista en Brasil"
 news.362.d:0 "Como si la situación en Brasil no pudiera empeorar, la inteligencia ya confirmó que un levantamiento paulista estalló de lleno en la nación. Los paulistas vieron el débil estado de Brasil como una oportunidad para independizarse oficialmente de ellos. \n\nParece que fueron capaces de amasar un ejército bastante grande para combatir a las otras facciones brasileñas, y están dispuestos a luchar hasta el final por su independencia. \n\nSólo el tiempo dirá cómo evolucionará la guerra civil brasileña, pero de momento no tiene buena pinta".
 news.362.a:0 "¡Conseguiremos nuestra independencia!"
 news.362.b:0 "¡No ganarán una mierda!"
 news.362.c:0 "Esto sólo va a empeorar"

 news.363.t:0 "Levantamiento comunista en Brasil"
 news.363.d:0 "El mundo no puede hacer otra cosa que ver como Brasil desciende al puro caos. El partido comunista del país ha organizado un levantamiento a gran escala para derrocar al gobierno y establecerse como los verdaderos líderes de Brasil. \n\nPor lo que parece, la gran mayoría de su apoyo proviene de los agricultores del país y de la clase baja. También fueron capaces de formar grandes cantidades de milicias para ser los vencedores de la guerra civil. \n\nLas batallas ya han estallado y los cadáveres se acumulan mientras hablamos".
 news.363.a:0 "¡Venceremos!"
 news.363.b:0 "¡No se saldrán con la suya!"
 news.363.c:0 "Jesucristo"

 news.364.t:0 "Insurrección democrática en Brasil"
 news.364.d:0 "La guerra civil brasileña sigue intensificándose, ya que el pueblo ha decidido que está harto y ha lanzado un levantamiento para reinstaurar la democracia en la nación. Lo están haciendo bajo el nombre de los Estados Unidos de Brasil, un nombre de muy corta duración para Brasil en la década de 1870. Han elegido revivir esa efímera república para contrastar con todas las demás ideologías extremistas en la guerra civil, y de una vez por todas poner fin a la guerra civil. \n\nQuien gane en esta guerra civil es todavía objeto de debate, pero lo que es seguro es que tendrán un largo camino que recorrer antes de poder arreglar realmente la nación."
 news.364.a:0 "¡¿Otra facción?!"
 news.364.b:0 "Pronto serán aplastados"
 news.364.c:0 "¡La democracia volverá!"

 news.365.t:0 "Levantamiento imperial en la guerra civil brasileña"
 news.365.d:0 "A partir de hoy, se ha confirmado que una facción imperialista, con el apoyo de los Patrianovistas, ha lanzado un asalto a gran escala contra las otras facciones en la guerra civil, siendo su principal objetivo restaurar el trono imperial y colocar a la familia real de nuevo en su "lugar apropiado". \n\nNo se sabe mucho de este levantamiento, y algunos sospechan que Portugal puede haber tenido algún tipo de participación en la ayuda a los imperialistas. \n\nLa guerra civil parece que no va a terminar pronto".
 news.365.a:0 "no se detiene"
 news.365.b:0 "Genial, justo lo que necesitábamos..."
 news.365.c:0 "¡Gloria a la familia real!"
 news.365.e:0 "Esto sí que es interesante"

 news.366.t:0 "Portugal interviene en la guerra civil brasileña"
 news.366.d:0 "El mundo se ha visto envuelto en un ataque incontrolable cuando las fuentes de noticias han confirmado que Portgual ha intervenido oficialmente en la guerra civil brasileña, ayudando a los imperialistas en su guerra civil. Los Estados Unidos no saben cómo responder, ya que esto es técnicamente una violación directa de la Doctrina Monroe, sin embargo, los EE.UU. no parece estar en una forma de ir a la guerra todavía. \n\nLa situación no hace más que agravarse, ya que ahora una potencia europea interviene en la guerra civil brasileña. Lo único que el mundo puede esperar es que la guerra civil no se internacionalice".
 news.366.a:0 "PORTUGAL????"
 news.366.b:0 "¿¡¡Qué demonios!?"
 news.366.c:0 "Hagamos esto"

 news.367.t:0 "Paraguay interviene en la segunda guerra cisplatina"
 news.367.d:0 "Como si la situación en Sudamérica no pudiera ser peor, se ha confirmado que Paraguay participa oficialmente en la Segunda Guerra Cisplatina tras cruzar la frontera brasileña con su ejército. \n\nLo único que podemos esperar ahora es que la situación no se agrave más de lo que ya está".
 news.367.a:0 "Las cosas sólo empeoran"
 news.367.b:0 "¡Estos bastardos serán aplastados!"
 news.367.c:0 "¡Brasil caerá pronto!"

 brazil.23.b:0 "Genial!"
 brazil.91.t:0 "Capturado un agente huido de los demócratas"
 brazil.91.d:0 "Hemos capturado a un agente huido de los demócratas que planean realizar un posible levantamiento. Aprovechando esta oportunidad, podríamos obtener mucha información sobre el paradero de su cuartel general."
 brazil.91.a:0 "Necesitamos obtener toda la información posible"
 brazil.91.b:0 "Hazle algunas preguntas"
 brazil.91.c:0 "No te fíes de este espía en potencia"

 brazil.92.t:0 "No hemos sido capaces de localizar el cuartel general"
 brazil.92.d:0 "A pesar de nuestros denodados esfuerzos, no fuimos capaces de descubrir la ubicación de la sede democrática"
 brazil.92.a:0 "¡Maldita sea!"

 brazil.93.t:0 "La Resistencia Democrática ha aceptado el compromiso"
 brazil.93.d:0 "La resistencia democrática ha aceptado nuestro compromiso y escucharemos sus demandas a cambio de su pacificación en la guerra civil e incluso de una posible cooperación."
 brasil.93.a:0 "¡Genial!"
  
 brazil.94.t:0 "La Resistencia Democrática no ha aceptado el compromiso"
 brazil.94.d:0 "La resistencia ha rechazado nuestro compromiso y continuará con sus planes originales"
 brazil.94.a:0 "¡Lamentarán esa decisión!"

 brazil.95.t:0 "Se ha Establecido el Estado Novo"
 brazil.95.d:0 "Después de muchos meses de engaños, corrupción e intrigas, Vargas ha hecho todos los preparativos adecuados para establecerse como dictador de Brasil. \n\nEsto significa que necesitamos lanzar cualquier plan que tengamos AHORA, ¡antes de que sea demasiado tarde!"
 brazil.95.a:0 "Lanzar los planes"
 brazil.95.b:0 "Parece que tenemos que retroceder"

 ### PAR ###
 paraguay.1.t:0 "Gente enojada por las recientes políticas de laissez-faire"
 paraguay.1.d:0 "La gente ha comenzado a mostrar su enojo hacia el gobierno y sus recientes políticas económicas tomando las calles y protestando contra ellos. Creen que estas políticas dañarán aún más la economía. La gente cree esto debido a los gobiernos liberales anteriores golpeando la economía.\n\n¡Necesitamos lidiar con estas protestas y no permitir que empeoren! ¿Qué haremos?"
 paraguay.1.a:0 "Apaciguar al Pueblo"
 paraguay.1.b:0 "Envían militares para lidiar con su rabieta"
 paraguay.2.t:0 "¡[PAR.GetLeader] fue depuesto por los militares!"
 paraguay.2.d:0 "¡El ejército paraguayo ha tomado el control del gobierno y depuso a [PAR.GetLeader]!\n\nEsta situación parece bastante sombría."
 paraguay.2.a:0 "Que Dios nos ayude."
 paraguay.3.t:0 "Rafael Franco asume el poder"
 paraguay.3.d:0 "Después de especulaciones y conspiraciones, los militares efectivamente lo han hecho: derrocaron al gobierno liberal y han colocado a Rafael Franco en el poder. \n\nVarios sectores socialistas, como los colorados, anarquistas y miembros de Liga Nacional Independiente, apoyaban a los militares y el ascenso de Franco al poder".
 paraguay.3.a:0 "Esperemos que Franco pueda dirigir adecuadamente la nación."
 paraguay.4.t:0 "Elecciones Nacionales"
 paraguay.4.d:0 "Hoy es un día especial para nuestro pequeño país, porque se ha liquidado a los repugnantes comunistas dentro del ejército y se ha preservado plenamente la democracia. \n\nMás allá de nosotros se encuentra una pregunta alarmante: ¿Quién continuará liderando? ¿Este país? Esuebio lo ha hecho muy bien, pero una mente nueva y fresca podría beneficiar a nuestro país. \n\nEl nuevo líder de [ROOT.GetName] es..."
 paraguay.4.a:0 "Eusebio Ayala"
 paraguay.4.b:0 "Luis Alberto Riart"
 paraguay.4.c:0 "Félix Paiva"
 paraguay.4.e:0 "José Patricio Guggiari"
 paraguay.5.t:0 "[FROM.GetName] Le gustaría comprar [1048.GetName]"
 paraguay.5.d:0 "Los delegados de [FROM.GetName] han venido a [ROOT.Capital.GetCapitalVictoryPointName] para discutir una posible compra de [1048.GetName]. \n\nEstán dispuestos a pagar una cantidad considerable por ello. ¿Aceptaremos su oferta?
 paraguay.5.a:0 "Sí claro, no nos sirve de nada"
 paraguay.5.b:0 "¡Eso no lo permitiremos!"
 paraguay.6.t:0 "Derecha insatisfecha"
 paraguay.6.d:0 "Poco después de asumir el poder, muchos simpatizantes de derecha dentro del país han demostrado su decepción con el nuevo líder, considerándolo incapaz de gobernar el país. Su preocupación se relaciona principalmente con la administración de Franco de la recién adquirida Chaco, ya que ha mostrado interés en retirar las tropas paraguayas de allí; ¡algo que la derecha detesta! \n\nTendremos que vigilarlos si queremos mantener a Franco en el poder."
 paraguay.6.b:0 "Vigámoslos"
 paraguay.7.t:0 "Remanentes liberales en el ejército"
 paraguay.7.d:0 "Si bien nuestra toma de gobierno fue un éxito, eso no significa que la oposición liberal desapareció mágicamente. Todavía están muy presentes, y se nota. Han anunciado públicamente su desprecio hacia el gobierno actual. , sin embargo, tal como están las acciones que pueden realizar son limitadas. \n\nDeberíamos estar atentos a ellos en caso de que algo suceda."
 paraguay.7.a:0 "Buena idea"
 paraguay.8.t:0 "[FROM.GetName] solicita amablemente [994.GetName]"
 paraguay.8.d:0 "Diplomáticos de [FROM.GetName] han llegado a nuestro país a pedirnos [994.GetName]. Aseguran que solo piden esas tierras, y dicen que garantizan que ya no habrá más Habría hostilidades entre nuestros dos países si se lo diéramos. \n\n¿Cuál será nuestra elección?"
 paraguay.8.a:0 "Claro, dáselo"
 paraguay.8.b:0 "¿Están locos estos? Que se piensan!!"
 paraguay.9.t:0 "Los militares han colocado a Félix Paiva en el poder"
 paraguay.9.d:0 "A pocas horas de la insurrección militar, los altos oficiales dentro de ella han decidido que Félix Paiva debería tomar el mando del país, lo que a su vez devolverá al poder al Partido Liberal."
 paraguay.9.a:0 "Vale"
 paraguay.10.t:0 "José Félix Estigarribia ha sido Electo"
 paraguay.10.d:0 "Después de contar los votos de las elecciones [GetYear], José Félix Estigarribia ha sido elegido presidente de la república y asumirá el cargo próximamente. \n\nLo que esto significará para Paraguay y su pueblo aún es una incógnita. "Es un tema de debate, pero de lo que podemos estar seguros es de que necesitamos garantizar la seguridad del país y de nuestra gente".
 paraguay.10.a:0 "Genial"
 paraguay.11.t:0 "Falleció José Félix Estigarribia"
 paraguay.11.d:0 "Trágica noticia ha golpeado hoy al país, ya que José Félix Estigarribia ha fallecido junto con su esposa en un avión mientras viajaba desde los Altos a su residencia campestre en San Bernardino. \n\nMuchos han "Salimos a las calles a llorar su muerte, lo cual es natural considerando lo repentino de su fallecimiento".
 paraguay.11.a:0 "Que en paz descanse"
 paraguay.12.t:0 "La Constitución de 1870 ha sido abolida"
 paraguay.12.d:0 "[PAR.GetLeader] ha decidido abolir la Constitución de 1870, afirmando que está atrasada y requiere un reemplazo moderno."
 paraguay.12.a:0 "Así será"
 paraguay.13.t:0 "Los civiles toman las armas"
 paraguay.13.d:0 "Tras el aumento de las tensiones en el país, los civiles se han hartado del lunático enloquecido que es [ROOT.Getleader], ¡y han tomado las armas para luchar contra el gobierno actual!"
 paraguay.14.t:0 "[FROM.GetName] exige que les demos las tierras que les corresponden"
 paraguay.14.d:0 "Diplomáticos paraguayos, escoltados por varios militares y generales de alto rango, han irrumpido en nuestra capital para exigir que les cedamos lo que ellos consideran sus 'legítimas tierras'. \n\n¿Debemos acceder a ello?"
 paraguay.14.a:0 "Bien, aceptamos"
 paraguay.14.b:0 "¡Ni hablar, atrás!"
 paraguay.15.t:0 "¿Formamos una coalición contra Parauay?"
 paraguay.15.d:0 "Mientras Paraguay sigue expandiéndose y amenazando el equilibrio de poder entre los países sudamericanos, debemos preguntarnos: ¿es Paraguay una amenaza para nuestro bienestar? \n\nPor lo que parece, sin duda lo es. Teniendo esto en cuenta, ¿formamos el pacto e invitamos también a los que luchan con Paragauy?".
 paraguay.15.a:0 "Necesitamos defendernos"
 paraguay.15.b:0 "Podemos hacerlo nosotros mismos, gracias"
 paraguay.150.t:0 "[FROM.GetName] exige que nos sometamos a ellos"
 paraguay.150.d:0 "Hemos recibido una carta de [FROM.GetName], exigiendo que nos rindamos y nos sometamos a ellos. Se han dado cuenta de nuestro menguante esfuerzo bélico y han decidido aprovecharse de ello. \n\n¿Qué debemos hacer?"
 paraguay.150.a:0 "Aceptar sus demandas"
 paraguay.150.b:0 "¡Lucharemos hasta el amargo final!"
 paraguay.16.t:0 "[FROM.GetName] ha rechazado nuestras demandas"
 paraguay.16.d:0 "Nos han llegado noticias de que [FROM.GetName] se ha negado a convertirse en nuestro súbdito y seguirá luchando a pesar de sus pérdidas."
 paraguay.16.a:0 "Oh bueno, tuvieron una oportunidad de vivir"
 paraguay.17.t:0 "Un llamado a la revolución indígena"
 paraguay.17.d:0 "Después de que la población nativa del país recibiera más derechos y libertades, los movimientos independentistas comenzaron a extenderse por todo el país. Si a eso le sumamos la instigación provocada por Juan Belaieff, los nativos se atiborran a nivel nacional, llamando a una revolución a gran escala. \n\n¿Qué decisión tomamos? ¿Debemos ponernos de su lado y vengarnos de los europeos, o debemos luchar contra ellos y asegurarnos de que esto no vuelva a ocurrir?".
 paraguay.17.a:0 "¡Nos vengaremos!"
 paraguay.17.b:0 "Lucharemos contra esos malditos bastardos"
 paraguay.18.t:0 "Nuestra revolución ha comenzado"
 paraguay.18.d:0 "Mientras hablamos, miles de personas están tomando las armas para luchar por nuestra causa. Pronto derrocaremos a este miserable gobierno y dejaremos claro quién es el verdadero dueño de estas tierras!"
 paraguay.18.a:0 "¡Venceremos pase lo que pase!"
 paraguay.19.t:0 "¡Praguay está intensificando la resistencia nativa!"
 paraguay.19.d:0 "Aunque parecía una locura al principio, se han confirmado avistamientos de paraguayos ayudando a las poblaciones nativas dentro de nuestro país. Los perpetradores han sido encarcelados y pagarán por sus acciones, pero ahora la pregunta permanece: ¿Qué hacen? hacemos con Paraguay?"
 paraguay.19.a:0 "¡Les haremos pagar!"
 paraguay.19.b:0 "No podemos hacer nada al respecto"
 paraguay.20.t:0 "[FROM.GetName] se ha enterado de nuestros esquemas"
 paraguay.20.d:0 "Las personas que hemos enviado a [FROM.GetName] han sido descubiertas y encarceladas. ¡Es casi seguro que también han descubierto nuestros planes!"
 paraguay.21.t:0 "Exitosa búsqueda y represión de los restos liberales"
 paraguay.21.d:0 "Nuestra búsqueda en el interior del país ha sido un éxito y hemos sido capaces de localizar y apuntar a la sede principal de aquellos en el ejército que aún permanecían leales al partido liberal."
 paraguay.21.a:0 "¡Excelente!"
 paraguay.22.t:0 "Exitosa búsqueda y represión de los revolucionarios de derecha"
 paraguay.22.d:0 "Nuestra búsqueda en el interior del país ha sido exitosa y pudimos ubicar y apuntar a los principales cuarteles de quienes en el ejército simpatizaban con ideologías de extrema derecha."
 paraguay.23.t:0 "Búsqueda infructuosa"
 paraguay.23.d:0 "A pesar de nuestros esfuerzos, no conseguimos localizar ninguno de los cuarteles generales principales de los que estaban contra nosotros."
 paraguay.23.a:0 "Maldición"


 news.369.t:0 "La Guerra de Venganza de Paraguay"
 news.369.d:0 "Las noticias confirman que ha estallado un nuevo gran conflicto en Sudamérica, al formarse una facción antiparaguaya para contener la rápida movilización paraguaya y evitar que siga expandiéndose". \n\nLas estimaciones de víctimas potenciales ya alcanzan los cientos de miles, y muchos creen que Sudamérica podría estar condenada si Paraguay acaba ganando esa guerra. A pesar de todo, mantendremos la esperanza por el continente, y esperamos que todo salga bien".
 news.369.a:0 "¡Pagarán todos!"
 news.369.b:0 "¡Nos ocuparemos de Paraguay de una vez por todas!"
 news.369.c:0 "Jesús..."

 chile.50.t:0 "La Huelga Ferroviaria de [GetYear]"
 chile.50.d:0 "Después de la huelga ferroviaria de enero de 1935 debido a la desvalorización de la moneda y la reducción de los salarios, un movimiento que recibió efusivo apoyo del Partido Comunista, esta es la segunda huelga del sector obrero nacional cada vez más activo.\n\n A pesar de que este segundo gobierno de Alessandri ha hecho lo posible por mantener el balance fiscal, esta movilización de norte a sur conllevó la dictación del Estado de Sitio durante 3 meses y la suspensión extraordinaria del congreso. Con todo, es innegable que la unidad sindical de los trabajadores se está viendo reforzada."
 chile.50.a:0 "¡Esto debe ser intervención del comunismo internacional!"

 ### Venezuela ###
 venezuela.1.t:0 "Descubren petróleo en las arenas bituminosas del mioceno"
 venezuela.1.d:0 "Tras una esperanzadora exploración y la perforación de un pozo descubridor a sólo 37 kilómetros al norte-noroeste de Ciudad Bolívar, ¡se descubrió petróleo! El petróleo se encontró dentro de las arenas alquitranadas miocenas de [947.GetName], y ya se han elaborado planes para comenzar a perforar el petróleo encontrado aquí y aprovechar al máximo las posibilidades. \n\n\nCon diligencia, esperamos producir bastante más crudo, lo que podría ayudarnos drásticamente en términos económicos."
 venezuela.1.a:0 "¡Fantástico!"
 venezuela.2.t:0 "La masacre de febrero"
 venezuela.2.d:0 "Luego de que el Gobernador de [VEN.GetCapital.GetName], Félix Galavís, decretara nuevas leyes de censura sobre diversos medios de comunicación, muchos venezolanos en la capital decidieron que ya era suficiente y tomaron las calles para protestar por estas acciones. A medida que las protestas crecían en número, llegando a más de 20000, Galavís tomó una decisión brutal y ordenó a sus hombres disparar contra los manifestantes, matando a 6 e hiriendo a 150. \n\nAunque esto ayudó a calmar las protestas momentáneamente, las consecuencias de las acciones de Galvis podrían ser monumentales si no tomamos medidas. Debemos actuar con cautela, ya que un paso en falso podría significar una revolución nacional."
 venezuela.2.a:0 "¡Esto no puede ser bueno!"
 venezuela.3.t:0 "Protestas contra el Gobierno"
 venezuela.3.d:0 "Hemos recibido noticias de manifestaciones que se están formando dentro del país para demostrar su descontento con el gobierno actual. Si no se manejan adecuadamente las protestas podrían intensificarse."
 venezuela.4.t:0 "Huelgas en todo el país"
 venezuela.4.d:0 "Los trabajadores de todo el país se han negado a ir a trabajar, alegando que las condiciones laborales son deficientes y el salario es pésimo. Los huelguistas han dejado claro que no irán a trabajar a menos que se mejoren estas condiciones laborales, o que la estabilización del país permita un mayor salario."
 venezuela.5.t:0 "¿Intervenimos en [VEN.GetName]?"
 venezuela.5.d:0 "Ha llegado a nuestro conocimiento que Venezuela no se ha alineado correctamente con nuestras intenciones, lo que podría provocar efectos secundarios catastróficos en caso de que un enemigo se apoderara de sus campos petrolíferos.[ROOT.GetTAGStatus] \n\n¿Intervenimos y ponemos fin a sus peligrosos planes?"
 venezuela.5.a:0 "¡Intervenir cuanto antes!"
 venezuela.5.b:0 "Emitir una severa advertencia"
 venezuela.5.c:0 "Déjenlos ir"
 venezuela.5.e:0 "Dales 2 años para que se arrepientan"
 VEN_allied_speech_tt:0 "\n\n[VEN.GetName] se niega a cortar lazos con las potencias del Eje, y eso podría llevar a una ruta segura de comercio de combustible entre ambos bandos, algo que debemos impedir a toda costa."
 VEN_axis_speech_tt:0 "El alineamiento de Venezuela con las potencias aliadas podría estrangular lo que podría ser una ruta segura de comercio de petróleo y combustible."
 venezuela.6.t:0 "[FROM.GetName] nos ha emitido una severa advertencia"
 venezuela.6.d:0 "Hemos recibido una comunicación de [FROM.GetName], en la que afirman que estamos tomando acciones potencialmente peligrosas y que estamos 'pisando un camino estrecho'. Si no cesamos en nuestro actual alineamiento ideológico podría producirse una intervención por su parte."
 venezuela.6.a:0 "¡No les tenemos miedo!"
 venezuela.7.t:0 "Venezuela ha eliminado nuestra influencia en su país"
 venezuela.7.d:0 "Hemos recibido noticias de que Venezuela ha retirado nuestra influencia de su país". \n\n¿Qué debemos hacer?"
 venezuela.8.t:0 "[FROM.GetName] ha comenzado a influir en nuestra política"
 venezuela.8.d:0 "[FROM.GetName] ha iniciado diversas actividades subversivas para comenzar a influir en nuestra política. Debemos desconfiar de sus intenciones y vigilarlos por si acaso."
 venezuela.8.a:0 "Pues qué bien..."
 venezuela.9.t:0 "[VEN.GetName] ha Nacionalizado su Petróleo"
 venezuela.9.d:0 "En respuesta a las crecientes tensiones en el mundo y al tira y afloja político que se estaba ejerciendo sobre [VEN.GetName] debido a su petróleo, el [VEN.GetAdjective] ha tomado la improvisada decisión de nacionalizar totalmente su petróleo, y no permitir la venta de ninguno de sus hidrocarburos a nadie.\n\n¿Cómo debemos responder a tan abrupta decisión?"
 venezuela.9.a:0 "Intervenir militarmente"
 venezuela.10.t:0 "[FROM.GetName] está exigiendo derechos de recursos a [VEN_RESOURCE_TARGET_STATE.GetName]"
 venezuela.10.d:0 "[FROM.GetName] se ha puesto en contacto con nosotros, indicando que están exigiendo los derechos sobre los recursos presentes en [VEN_RESOURCE_TARGET_STATE.GetName], en particular el petróleo crudo que está presente allí". \n\n¿Qué decisión tomamos?".
 venezuela.10.a:0 "Darles los derechos del recurso"
 venezuela.10.b:0 "No tendrán acceso a esos derechos"
 venezuela.11.t:0 "¿Exigimos derechos sobre los recursos presentes en la Faja del Orinoco?"
 venezuela.11.d:0 "La Faja del Orinoco es una región de Venezuela conocida por ser extremadamente rica en crudo. De hecho, es la región del país con más petróleo, y potencialmente la región con más petróleo virgen de todo el planeta. \n\nCon nuestra influencia totalmente establecida en el país, tenemos el poder de hacer tal demanda. ¿Lo hacemos?"
 venezuela.11.a:0 "Absolutamente"
 venezuela.12.t:0 "[FROM.GetName] está dispuesto a discutir la venta de sus recursos a nosotros"
 venezuela.12.d:0 "Diplomáticos de [FROM.GetName] han venido a nuestro país para discutir la venta de derechos sobre sus recursos en una provincia suya. Nosotros ganamos los recursos del estado que ellos decidan ofrecer, y a cambio pueden exigir un pago cada 6 meses. ¿Aceptamos esta oferta?".
 venezuela.12.a:0 "Claro, veamos que nos ofrecen"
 venezuela.12.b:0 "No podemos pagar esto ahora"
 venezuela.13.t:0 "[FROM.GetName] ha aceptado nuestra propuesta"
 venezuela.13.d:0 "Hemos recibido información de que [FROM.GetName] ha aceptado comprar recursos de uno de nuestros estados. Ahora nos toca elegir a qué estado le ofreceremos acceso".
 venezuela.13.a:0 "¡Genial!"
 venezuela.14.t:0 "[FROM.GetName] No desea comprar acceso a nuestros recursos"
 venezuela.14.d:0 "[FROM.GetName] pudo ponerse en contacto con nosotros, agradeciendo la oferta pero su actual situación económica y política le hace imposible costear la compra de derechos sobre nuestros recursos."
 venezuela.14.a:0 "Mejor suerte la próxima vez"
 venezuela.15.t:0 "[FROM.GetName] nos ha dado Derechos sobre Recursos a [VEN_RESOURCE_SELLING_TARGET_STATE.GetName]"
 venezuela.15.d:0 "[FROM.GetName] nos ha informado de que tendremos pleno acceso a los recursos situados en [VEN_RESOURCE_SELLING_TARGET_STATE.GetName]. Puede que exijan el pago de vez en cuando, pero prometen que cumplirán su parte del trato."
 venezuela.15.a:0 "Ok"
 venezuela.16.t:0 "[FROM.GetName] Nos echaron de su Facción"
 venezuela.16.d:0 "Hemos sido expulsados de la facción de [FROM.GetName] debido a nuestras acciones."
 venezuela.17.t:0 "[FROM.GetName] nos exige un pago por el uso de sus recursos"
 venezuela.17.d:0 "Era inevitable que [FROM.GetName] exigiera un pago por el uso de sus recursos. Debemos cumplir nuestra parte del trato y pagar".
 venezuela.18.t:0 "Punta de lanza de la revolución"
 venezuela.18.d:0 "Por primera vez en años, realmente tenemos voz en la política venezolana y en el país en su conjunto. Nuestro movimiento ganó gran tracción y el pueblo está despertando, y para continuar realmente la punta de lanza de nuestra revolución, necesitamos un líder adecuado para hacerse cargo del movimiento y garantizar que los trabajadores [VEN.GetAdjective] estén representados adecuadamente. \n\n¿Quién se hará cargo?"
 venezuela.19.t:0 "Rafael Simón Urbina renuncia por problemas de salud"
 venezuela.19.d:0 "A escasos meses de haber sido llamado por [ROOT.GetLeader] para ser gobernador, Rafael ha presentado su renuncia por problemas personales de salud."
 venezuela.19.a:0 "Que pena"
 venezuela.20.t:0 "[FROM.GetName] ha dejado de comprar nuestros recursos"
 venezuela.20.d:0 "[FROM.GetName] ha informado que oficialmente dejará de comprar acceso a nuestros recursos. A partir de hoy, no daremos recursos a [FROM.GetName]".
 venezuela.20.a:0 "Ah"
 venezuela.21.t:0 "[FROM.GetName] está exigiendo a Guyana Esequiba"
 venezuela.21.d:0 "[FROM.GetName] ha venido a tocar a nuestras puertas, exigiendo que les entreguemos Guyana Esequiba. Afirman que es parte integral de la nación [FROM.GetAdjective], y que son los legítimos dueños de esa tierra. \n\nYa se han asegurado de que si les negamos la tierra, responderán con la fuerza. ¿Cuál será nuestra respuesta?"
 venezuela.21.a:0 "Entréguensela"
 venezuela.21.b:0 "¿Quién diablos te crees que eres? NO"
 venezuela.22.t:0 "Por fin concluye la guerra civil"
 venezuela.22.d:0 "Después de muchas batallas brutales, campos ensangrentados y vidas diezmadas, un rayo de sol finalmente se posa sobre nuestro hermoso país. Realmente había una luz al final del túnel, aunque pareciera tan lejana.\n\nLos que quedaron vivos están tomando las calles, celebrando la resolución de un conflicto tan sangriento, felices de poder ir a visitar a su amigo de nuevo, felices de poder salir a la calle otra vez sin tener que preocuparse de que los maten. Es... hermoso".
 venezuela.22.a:0 "¡Ahora comienza una nueva era de la historia venezolana!"
 venezuela.23.t:0 "Los trabajadores exigimos la nacionalización de nuestros yacimientos petroleros"
 venezuela.23.d:0 "No podemos olvidar que pudimos llegar al poder gracias al paro petrolero planificado contra el gobierno anterior. Los trabajadores que tanto nos han ayudado en nuestra revolución, ahora esperan su recompensa, ¡una que cumpliremos!"
 venezuela.24.t:0 "[FROM.GetName] Quiere Comprar el Canal de Panamá"
 venezuela.24.d:0 "[FROM.GetName] han llegado a [ROOT.Capital.GetName] con una interesante propuesta. Están dispuestos a comprarnos el Canal de Panamá, y están dispuestos a pagar una suma bastante elevada por ello. \n\n¿Aceptamos?"
 venezuela.24.a:0 "Claro, vamos a dárselo"
 venezuela.24.b:0 "Claro, pero exigimos una compensación extra"
 venezuela.24.c:0 "Lo sentimos, pero no podemos hacer eso "d
 venezuela.25.t:0 "[FROM.GetName] ha accedido, pero debemos pagar una compensación extra"
 venezuela.25.d:0 "Aunque [FROM.GetName] ha accedido a vendernos el Canal de Panamá, dejaron claro que debemos pagarles una compensación extra debido al valor que tiene el canal."
 venezuela.26.t:0 "A [FROM.GetName] le gustaría firmar un tratado de primera línea con nosotros"
 venezuela.26.d:0 "Delegados de [FROM.GetName] han llegado a nuestro país para discutir la firma de un tratado para establecer finalmente nuestras fronteras y arreglar nuestras relaciones después de años de disputas y tensiones. \n\n¿Lo firmamos?"
 venezuela.26.a:0 "Claro"
 venezuela.26.b:0 "No"
 venezuela.27.t:0 "[FROM.GetName] Se ha negado a firmar el Tratado de Primera Línea"
 venezuela.27.d:0 "[FROM.GetName] ha respondido a nuestros delegados enviados allí, declarando que no firmarán el tratado y afirman que su visión de la frontera es la única correcta."
 venezuela.27.a:0 "Maldición, mala suerte"
 venezuela.27.b:0 "¡No se saldrán con la suya!"
 venezuela.28.t:0 "Hundimiento del Monagas y Tía Juana"
 venezuela.28.d:0 "Hemos recibido la noticia de que los buques petroleros Monagas y Tía Juana han sido hundidos por torpedos [GER.GetAdjective]. En esos hundimientos se perdieron vidas venezolanas, y las acciones tomadas por los [GER.GetAdjective] son inexcusables. \n\n¿Cómo debemos responder a esta situación?".
 venezuela.28.a:0 "¡Exigir compensación inmediata!"
 venezuela.28.b:0 "Embargarlos"
 venezuela.28.c:0 "No podemos hacer nada al respecto..."
 venezuela.280.t:0 "[FROM.GetName] Exige Indemnización Por Los Barcos Petroleros Hundidos"
 venezuela.280.d:0 "[FROM.GetName] se ha dirigido formalmente a nosotros por el hundimiento de dos de sus buques petroleros. Debido a la pérdida de vidas humanas, su gobierno exige que les demos una compensación inmediata por nuestras acciones y que nos aseguremos de no volver a hacer algo así nunca más. \n\n¿Qué debemos hacer?"
 venezuela.280.a:0 "Simplemente ignorarlos"
 venezuela.280.b:0 "¿Quién demonios se creen que son? ????"
 venezuela.280.c:0 "Lo sentimos, pagaremos por nuestros errores"
 venezuela.29.t:0 "Parece que [FROM.GetName] nos ha ignorado"
 venezuela.29.d:0 "Después de exigir una indemnización a [FROM.GetName], aún no hemos recibido ningún tipo de respuesta por parte de su gobierno. Es seguro asumir que simplemente nos han ignorado..."
 venezuela.29.a:0 "Debería haber esperado lo mismo de ellos"
 venezuela.30.t:0 "[FROM.GetName] ha accedido a compensar"
 venezuela.30.d:0 "A pesar de lo que muchos esperaban, el gobierno de [FROM.GetAdjective] realmente ha respondido a nuestras demandas y ha acordado que compensarán sus errores. También nos han enviado una disculpa formal, diciendo que lamentan la pérdida de vidas venezolanas y que harán lo que sea necesario para compensarlas."
 venezuela.30.a:0 "¡Eso es genial!"
 venezuela.31.t:0 "[VEN.GetName] ha comprado dos de nuestros destructores"
 venezuela.31.d:0 "Hemos recibido la noticia de que [VEN.GetName] ha comprado dos de nuestros destructores, y ha pagado adecuadamente por ellos."
 venezuela.31.a:0 "¡Genial!"
 venezuela.32.t:0 "Medina regresa para manejar la grave situación"
 venezuela.32.d:0 "Tras recibir la noticia de que la situación en su país se presentaba sombría, Medina ha decidido cancelar su gira y regresar a su país natal para enfrentar el problema."
 venezuela.32.a:0 "Bienvenido de vuelta"
 venezuela.33.t:0 "Medina ha regresado a Venezuela"
 venezuela.33.d:0 "Luego de realizar una larga gira por los países de Perú, Colombia, Panamá, Ecuador y Bolivia, Medina finalmente ha regresado a su país para volver a administrar adecuadamente el país luego de acercarse diplomáticamente a los países antes mencionados."
 venezuela.34.t:0 "Actividad sospechosa de Generales y Acción Democrática"
 venezuela.34.d:0 "Nuestra inteligencia ha revelado que algunos generales dentro del país están cooperando políticamente con Acción Democrática, planeando derrocar al gobierno actual". \n\nPor lo poco que sabemos, su justificación para tan repugnante acto es que Medina no está permitiendo debidamente el derecho a elecciones libres y privadas, y que los sueldos de los militares están 'por debajo del par'."
 venezuela.34.a:0 "Malditos bastardos"
 venezuela.35.t:0 "Las Fuerzas Armadas y AD han dado el golpe de Estado"
 venezuela.35.d:0 "Después de meses de planificación, la alianza política formada entre AD y las Fuerzas Armadas finalmente han decidido lanzar su golpe contra el gobierno actual. \n\nMientras hablamos, miembros de AD y militares se dirigen a la capital para asegurar la renuncia inmediata de [ROOT.GetLeader]. \n\nSólo el tiempo dirá cómo se resuelve esto".
 venezuela.35.a:0 "Que Dios nos guíe"
 venezuela.36.t:0 "La oposición sigue satisfecha"
 venezuela.36.d:0 "Después de nuestras diversas reformas, parece que la oposición y los militares están satisfechos con nuestras acciones y han decidido suspender su intervención militar."
 venezuela.36.a:0 "Que esta paz dure para la eternidad"
 venezuela.37.t:0 "Escalante diagnosticado con demencia incipiente"
 venezuela.37.d:0 "Un reciente chequeo con el médico terminó convirtiéndose en una pesadilla hecha realidad, pues se ha confirmado que Escalante padece demencia de inicio, una que sólo empeorará con el tiempo. Aunque la situación parece sombría, hay una pequeña posibilidad de que se cure", dijo el médico. \n\nSi la enfermedad persiste, Escalantes se verá obligado a abandonar la política".
 venezuela.37.a:0 "Eso es todo, este gobierno TIENE que irse"
 venezuela.37.b:0 "Haremos lo que sea necesario para curarlo"
 venezuela.38.t:0 "Medina entrega la presidencia a Escalante"
 venezuela.38.d:0 "Tal y como estaba previsto, Medina ha decidido abandonar el poder y en su lugar asumirá Diógenes Escalante. Considerado por muchos como un potencial salvador de Venezulea, punta de lanza hacia una década dorada. Gracias a ello, en su toma de posesión como presidente miles de personas le aclamaron. \n\nEsperemos que no le pase nada malo".
 venezuela.38.a:0 "El pueblo esta contigo, señor Presidente"
 venezuela.39.t:0 "Rómulo Gallegos ha ganado las Elecciones [GetYear]"
 venezuela.39.d:0 "Gracias a la gestión de Bentancourt y a la democratización del país, Venezuela finalmente tuvo sus primeras elecciones libres y apropiadas por primera vez en décadas. Los resultados de las elecciones fueron revelados en este día tan especial, y se ha confirmado que Rómulo Gallegos ha ganado las elecciones y se hará cargo del país."
 venezuela.39.a:0 "¡Es una noticia maravillosa!"
 venezuela.40.t:0 "Rómulo Bentancourt ha ganado las Elecciones [GetYear]"
 venezuela.40.d:0 "A pesar de las tácticas políticas utilizadas por la oposición, simplemente no fue rival para la magnífica administración del país por parte de Bentancourt, lo que le ha valido el apodo de 'Padre de la Democracia Venezolana'. Gracias a su gestión, ha ganado las primeras elecciones libres de Venezuela en décadas, lo que le asegura unos cuantos años más en el cargo."
 venezuela.40.a:0 "¡Es una noticia maravillosa!"
 venezuela.41.t:0 "Rafael Simón Urbina parte al exilio"
 venezuela.41.d:0 "Luego de los acontecimientos ocurridos por el Golpe de Estado contra Medina, recibimos la noticia de que Urbina se ha exiliado nuevamente, esta vez hacia Haití. El tiempo dirá qué decide hacer, pero por ahora no es nuestro principal problema".
 venezuela.42.t:0 "Urbina regresa a Venezuela"
 venezuela.42.d:0 "Confirmado por múltiples testigos oculares y agentes encubiertos, Urbina ha regresado a Venezuela. Por ahora parece que se mantendrá al margen, pero puede estar planeando algo. Debemos andar con mucho cuidado". 
 venezuela.42.a:0 "Pffff, como si pudiera hacer algo contra nosotros"
 venezuela.43.t:0 "Carlos Delgado Chalbaud fue encontrado muerto"
 venezuela.43.d:0 "Todavía parece una locura creerlo, pero han salido las pruebas y se ha confirmado que Chalbaud fue asesinado y encontrado muerto. \n\nEl informe de la autopsia confirma que el agresor intentó secuestrarlo en un principio, pero se resistió, lo que obligó al agresor a asesinarlo en el acto. También se ha confirmado que el autor de este asesinato no fue otro que Rafael Simón Urbina. \n\n¿Qué hacemos con ese desgraciado?".
 venezuela.43.a:0 "Asesinar al maldito bastardo"
 venezuela.43.b:0 "Exiliarlo para siempre"
 venezuela.44.t:0 "[GetYear] Huelga Petrolera"
 venezuela.44.d:0 "En protesta contra el actual gobierno, varios sectores de la industria petrolera se declararon en huelga. Los paros ocurrieron principalmente en el Zulia, sin embargo se extendieron a muchas partes del país. El organizador es bastante desconocido, pero el motivo de la huelga son las malas condiciones de los trabajadores."
 venezuela.44.a:0 "¡Pagarán caro por esto!"
 venezuela.45.t:0 "[FROM.GetName] Ofrece la salvación en la unificación"
 venezuela.45.d:0 "Notando nuestra situación actual, [FROM.GetName] ha ofrecido una última solución: la unión. Parece una locura, pero con su industria y su ejército, puede ser la ventaja que necesitamos para lograr una victoria. \n\n¿Qué debemos hacer?"
 venezuela.45.a:0 "Es nuestra última oportunidad"
 venezuela.45.b:0 "No, estamos más que bien"
 venezuela.46.t:0 "[FROM.GetName] se ha negado a unirse a nosotros"
 venezuela.46.d:0 "[FROM.GetName] ha respondido a nuestra propuesta de unificación, diciendo que estarán bien sin unificación"
 venezuela.46.a:0 "Oh bueno"
 venezuela.47.t:0 "EEUU nos da dos años para abandonar totalmente el Eje"
 venezuela.47.d:0 "Los Estados Unidos se han dado cuenta de nuestro alineamiento con las potencias del Eje, y temen que con el tiempo nos convirtamos en un enemigo suyo. Debido a esta preocupación, los EE.UU. nos ha dado un ultimátum. O rompemos todos los lazos con el Eje en un plazo de 2 años, o Estados Unidos interviene militarmente."
 venezuela.47.a:0 "De acuerdo"
 venezuela.48.t:0 "[FROM.GetName] se ha negado a cooperar a nuestras órdenes"
 venezuela.48.d:0 "Después de darles tiempo para cumplir nuestras órdenes, [FROM.GetName] se ha negado a hacerlo. \n\nDebido a nuestras condiciones establecidas y al incumplimiento de las mismas, ha llegado el momento de cumplir con nuestra palabra e intervenir militarmente."
 venezuela.48.a:0 "Se lo advertimos, ahora es demasiado tarde"
 venezuela.48.b:0 "Simplemente no podemos permitirnos una guerra con ellos ahora mismo"
 
### Evento Genérico de Ultimátum ###
 venezuela.49.t:0 "[FROM.GetName] nos ha enviado un Ultimátum"
 venezuela.49.d:0 "En el día de hoy, hemos recibido una comunicación oficial de [FROM.GetName] exigiendo nuestra inmediata anexión y posterior entrega de nuestro territorio soberano a ellos. \n\n[ROOT.GetLeader] ha evaluado diligentemente la situación junto con su gabinete, y una decisión tiene que ser tomada para hoy. \n\nCon la soberanía de nuestra nación en nuestras manos, ¿cuál será nuestra decisión?"
 venezuela.49.a:0 "¿Tenemos siquiera una opción?"
 venezuela.49.b:0 "¡Lucharemos hasta el amargo final!"
### Evento Genérico de Ultimátum ###

 venezuela.50.t:0 "[FROM.GetName] exige nuestras posesiones sudamericanas"
 venezuela.50.d:0 "Hemos recibido un comunicado oficial de [FROM.GetName] exigiendo la entrega de nuestro territorio sudamericano a ellos. \n\nAfirman que el territorio es vital para el núcleo y las fronteras fundamentales de su nación, y han dejado claro que la no entrega del territorio dará lugar a una escalada militar. \n\n¿Qué hacemos?"
 venezuela.50.a:0 "No podemos permitirnos una guerra con ellos"
 venezuela.50.b:0 "¿Lo quieres? Vengan a buscarlo entonces"
 venezuela.51.t:0 "Escalantes abandona el poder"
 venezuela.51.d:0 "Hoy es un día triste para la república, pues se ha hecho pública la noticia de que Escalantes abandonó el poder debido a su demencia. La enfermedad mental ha progresado demasiado, y estaba afectando enormemente a Escalantes, hasta el punto de no poder dirigir adecuadamente. Debido a la falta de un sustituto, la Asamblea Nacional dirigirá el país y tomará las riendas administrativas".
 venezuela.51.a:0 "Un día triste para Venezuela"
 venezuela.52.t:0 "Escalantes se ha curado de su demencia"
 venezuela.52.d:0 "Maravillosas noticias han llegado del consultorio médico tras el más reciente chequeo de Escalantes. Se ha confirmado que la demencia ha sido milagrosamente curada. El médico ha señalado que era técnicamente posible, pero que el proceso iba a ser difícil. Tenían razón, fue un proceso, pero al final fue exitoso, y Escalantes puede seguir al frente de nuestra nación hasta las próximas elecciones."
 venezuela.52.a:0 "¡Eso es maravilloso!"
 venezuela.53.t:0 "Revolucionarios toman las armas en todo el país"
 venezuela.53.d:0 "¡El polvorín en Venezuela no aguantó más y estalló! Mientras hablamos, miles y miles de revolucionarios comenzaron a tomar las armas para derrocar por la fuerza a nuestro gobierno autoritario. Dicen que luchan para impedir un segundo Vicente Gómez, una segunda dictadura brutal. Nunca más" es lo que grita el pueblo en todo el país, que apoya a los revolucionarios e incluso toma las armas con ellos para luchar por su causa. \n\nNo se dan cuenta del grave error que están cometiendo, y no hacen más que darle la razón a Laureano: que el pueblo de Venezuela necesita un gobernante autoritario fuerte para guiarlo adecuadamente. ¿Ven lo que pasa cuando se permite la libertad?".
 venezuela.53.a:0 "Están cometiendo un grave error"
 venezuela.54.t:0 "Violentas protestas estallan en todo el país"
 venezuela.54.d:0 "La gente ha comenzado a demostrar su enojo hacia nuestro cambio de gobierno con protestas en todo el país. Lo que comenzó con unos pocos manifestantes insignificantes, ahora se ha convertido en un caos nacional, ya que los manifestantes han comenzado a agredir a nuestras fuerzas policiales y muchas de sus protestas se han vuelto violentas, exigiendo que detengamos inmediatamente nuestras reformas. \n\nEs una vergüenza ver a gente con el cerebro tan lavado que cree que somos los malos. Sólo intentamos ayudar".
 venezuela.54.a:0 "Parece que tenemos que reprimirlos aún más"
 venezuela.55.t:0 "Golpes en todo el pais"
 venezuela.55.d:0 "A medida que el panorama político en el país empeora, los socialistas dentro del país han comenzado a orquestar huelgas a nivel nacional para expresar su desprecio por nuestro cambio hacia un gobierno autoritario, alegando que no es así como el pueblo venezolano debe ser tratado. Estos organizadores principales han enviado una carta a nuestro gobierno, diciendo que estamos cometiendo un grave error y que lo pagaremos caro."
 venezuela.55.a:0 "ELLOS serán los que paguen caro"
 venezuela.56.t:0 "Revolucionarios capturados por contrabando de armas"
 venezuela.56.d:0 "Varios escuadrones de nuestra Gendarmería han sorprendido a personas tratando de robar armas de nuestras reservas, y esto no es algo que haya ocurrido una sola vez, oh no no, esto ha sido recurrente desde hace un par de semanas. \n\nEs dolorosamente obvio por qué están haciendo esto, están planeando una revolución total contra nosotros sólo porque empezamos a poner orden y dignidad en este país. Intenten lo que intenten, serán aplastados".
 venezuela.56.a:0 "Están perdidos"
 venezuela.57.t:0 "López Contreras obligado a dejar el poder"
 venezuela.57.d:0 "Como si las cosas no pudieran empeorar, [ROOT.GetLeader] ha enviado una carta oficial al gabinete y al gobierno anunciando su retiro y posterior renuncia al cargo. En la carta aborda las razones de su dimisión, afirmando que simplemente no podía manejar el empeoramiento de la situación en el país, y que le estaba pasando una factura significativa a su salud mental."
 venezuela.57.a:0 "Qué vergüenza"
 venezuela.58.t:0 "La segunda revolución libertadora"
 venezuela.58.d:0 "Las tensiones han ido en aumento en Venezuela desde hace unos meses, desde que el país decidió cambiar a un estado más autoritario. Intel nos dice que el pueblo no quería pasar por una dictadura similar a la que atravesó hace apenas un año, y está dispuesto a jugarse la vida para salvar a Venezuela y garantizar que siga siendo libre y democrática". \n\nLos primeros disparos de la revolución se produjeron hace apenas unas horas, y la situación parece que sólo va a empeorar de aquí en adelante. El resultado de esta revolución podría determinar la trayectoria del país para siempre, así que hay mucho en juego para ambas partes."
 venezuela.58.a:0 "¡Haremos lo que sea necesario para ganar!"
 venezuela.58.b:0 "Tenemos que vigilar a Venezuela"
 venezuela.58.c:0 "Interesante"
 venezuela.59.t:0 "[ROOT.GetLeader] Contrajo una enfermedad pulmonar"
 venezuela.59.d:0 "Recibimos la noticia de que [ROOT.GetLeader] ha contraído una grave enfermedad pulmonar. Los profesionales han declarado que si no se trata a tiempo, podría empeorar gravemente, e incluso provocar la muerte. Aún se desconoce dónde ha contraído la enfermedad [ROOT.Getleader], pero podría haber sido durante una gira por el sur del país."
 venezuela.59.a:0 "¡Nos aseguraremos de que reciba el tratamiento adecuado!"
 venezuela.60.t:0 "Laureano ha fallecido"
 venezuela.60.d:0 "El día de hoy se ha recibido con una triste noticia, ya que se ha confirmado el fallecimiento de Laureano. La autopsia ha confirmado que se debió al avance de su enfermedad pulmonar. Es una verdadera lástima no haber podido darle el tratamiento adecuado a tiempo."
 venezuela.60.a:0 "¡Tu recuerdo seguirá vivo!"
 venezuela.61.t:0 "[FROM.GetName] Ha Ocupado Militarmente [VEN_STATE_OCCUPIED.GetName]"
 venezuela.61.d:0 "Los lugareños de [FROM.GetName] se han puesto repentinamente en contacto con nosotros, suplicando nuestra ayuda. Nos han notificado que Venezuela se ha adentrado ilegalmente en nuestras tierras con sus tropas, tomando [FROM.GetName] por la fuerza y obligando a los lugareños a someterse al gobierno de su país a partir de ahora. \n\n¿Cómo debemos responder a esto?"
 venezuela.61.a:0 "No podemos hacer nada, lo siento"
 venezuela.61.b:0 "¡No se saldrán con la suya!"
 venezuela.62.t:0 "Revolucionarios reprimidos con éxito"
 venezuela.62.d:0 "Tras nuestras diversas medidas represivas, hemos recibido confirmación de que los revolucionarios han retrocedido y entregado sus armas a las autoridades locales. El país podrá continuar intacto y de una pieza". ## mono d. garp 
 venezuela.62.a:0 "Tomaron la decisión correcta"
 
 ## Reelaboración monárquica 
 brazil.96.t:0 "La creación de la Coalición Antimonárquica"
 brazil.96.d:0 "Tras enterarse de la creciente influencia monárquica en todo el país, Vargas ha tomado cartas en el asunto para cooperar con los demás partidos del país y formar una coalición Antimonárquica. \n\nVer su determinación al trabajar con sus supuestos enemigos sólo puede significar que los otros partidos nos ven como una gran amenaza para su pequeño círculo de amigos que se benefician mutuamente."
 brazil.96.a:0 "Pronto se desmoronarán"
 brazil.97.t:0 "La coalición inicia planes para detener nuestro movimiento"
 brazil.97.d:0 "Nos han llegado noticias de que la Coalición ha iniciado planes para reprimir por completo nuestro movimiento, y piensan utilizar todo lo que tengan a su disposición para detenernos, incluida la sangre de nuestros compatriotas."
 brazil.97.a:0 "Mocosos"
 brazil.98.t:0 "¡La Coalición ha reprimido nuestro movimiento!"
 brazil.98.d:0 "La Coalición nos ha descubierto. Han detenido a muchos de nuestros seguidores más temidos y leales, algunos de los cuales tienen una influencia significativa en el movimiento, lo que nos impide continuar con nuestros planes como pretendíamos. Tenemos que lanzar lo que hayamos planeado ¡YA!".
 brazil.98.a:0 "Todos a las armas"
 brazil.99.t:0 "La coalición antimonárquica caza a los monárquicos"
 brazil.99.d:0 "Algunos de nuestros más leales partidarios se vieron obligados a enfrentarse a las fuerzas antimonárquicas, y por desgracia el resultado fue trágico, ya que la mayoría fueron encarcelados, con algunas bajas. Estos actos despreciables son un crimen contra la humanidad".
 brazil.99.a:0 "¡Pagarán por ello!"
 brazil.100.t:0 "¡Baviera ha declarado la independencia!"
 brazil.100.d:0 "¡Algunas de nuestras tropas estacionadas dentro de Baviera se han puesto en contacto con nosotros urgentemente, afirmando que Baviera se ha separado del país y se ha declarado independiente de nosotros! Nuestra inteligencia también ha detectado manipulación interna de [BRA.GetName] estuvo presente en esta operación y posterior secesión. \n \n¿Qué debemos hacer?"
 brazil.100.a:0 "¡Ambos pagarán caro por esto!"
 brazil.100.b:0 "No podemos permitirnos esto."
 brazil.101.t:0 "El golpe imperial"
 brazil.101.d:0 "Por fin, tras muchos meses de cuidadosa planificación y con el apoyo de millones en todo el país, pudimos abdicar por la fuerza del entonces líder Getulio Vargas. \n\nAhora, con Veiga en el poder, podemos empezar a reestructurar el recién establecido estado monárquico, ¡y elegir un emperador adecuado como sucesor de Dom Pedro II para gobernar el nuevo imperio hacia la gloria!"
 brazil.101.a:0 "¡Independência ou Morte!"
 brazil.103.t:0 "¡Independencia de Baviera!"
 brazil.103.d:0 "¡El mundo entero se entera de que Baviera se ha separado de Alemania y ha declarado su independencia! \n\nLos sentimientos nacionalistas han ido creciendo en Baviera en los últimos meses, y muchas fuentes señalan a [BRA.GetName] como el culpable. Teniendo en cuenta la actual situación alemana, tanto los brasileños como los bávaros vieron en esto la oportunidad perfecta.\n\nEsta situación tiene casi garantizada una escalada, pero por ahora todo lo que podemos hacer es esperar y ver."
 brazil.103.a:0 "Interesante"
 brazil.103.b:0 "¡Por fin!"
 brazil.103.c:0 "¡Pagarán por esto!"
 brazil.104.t:0 "La restauración del Imperio de Brasil"
 brazil.104.d:0 "El Imperio original se disolvió en 1889, con Dom Pedro II como último líder. Ahora, casi 5 décadas después, el sucesor del imperio original ha sido declarado oficialmente hace apenas unas horas, reclamando el trono original del imperio. \n\nSe ha demostrado que el Segundo Imperio Brasileño tiene planes bastante ambiciosos, sobre todo para devolver al imperio su antigua gloria. Tener un imperio de nuevo en Sudamérica ha suscitado preocupación en muchas naciones americanas, sobre todo en Estados Unidos, aunque por ahora se mantienen vigilantes ante la situación."
 brazil.104.a:0 "Ahh, cool"
 brazil.104.b:0 "Avé Gloria, Avé Imperio"
 brazil.105.t:0 "La Unión de Brasil y Baviera"
 brazil.105.d:0 "Se ha confirmado que el Segundo Imperio Brasileño y el Reino de Baviera se han unido para formar el Reino de Brasil y Baviera. \n\nMuchas naciones especulan sobre qué hacer con esta situación, y aún más se quedan con una pregunta muy importante: ¿Debemos tratar a esta nueva entidad como un aliado o como un enemigo?".
 brazil.105.a:0 "Ok"

 argentina.22.e:0 "¡A la mierda lo que votó el pueblo, tomamos el control!"

 peru.41.t:0 "La Restauración del Imperio Español"
 peru.41.d:0 "Se han extendido por todo el mundo noticias de que el entonces Reino del Perú se autoproclama sucesor del Imperio Español original, ¡declarando que su destino es lograr lo que el imperio original no pudo! \n\nMuchos especulan sobre el éxito de este "sucesor", y muchos ya predicen su inevitable colapso debido a la gran cantidad de tierra que se necesita para estar bajo su control. \n\nEn cualquier caso, por el momento suponen una seria amenaza para el equilibrio global".
 peru.41.a:0 "Están condenados al fracaso"
 peru.41.b:0 "¡Gloria al Imperio!"
 peru.42.t:0 "¿Proponemos un Rey?"
 peru.42.d:0 "Un prominente e influyente carlista de nombre Carlos Pío Habsburgo Borbón se ha acercado a nuestro gobierno, ofreciéndose para convertirse en Rey del nuevo Imperio Español. Promete que hará todo lo que esté en su mano para asegurar el éxito imperial. \n\n¿Se convertirá en rey?"
 peru.42.a:0 "Por supuesto, es lo lógico"
 peru.42.b:0 "¡Un peruano seguirá al mando!"
 
 ## EUYL ##
 EUYL.1.t:0 "[USA.GetName] nos da 3 años para declarar la guerra al Eje"
 EUYL.1.d:0 "[USA.GetLeader] se ha puesto en contacto con nosotros, con una severa advertencia hacia nuestra nación, diciendo que si no declaramos la guerra a las potencias del Eje y nos unimos a su bando de guerra, entonces habrá graves consecuencias.Nos dan 3 años para decidir nuestro destino sobre este tema: o cumplimos y declaramos la guerra a los alemanes, o lo ignoramos y nos enfrentamos a una posible invasión americana."
 EUYL.1.a:0 "Debemos tener cuidado con los [USA.GetAdjective]"

 EUYL.2.t:0 "No hemos logrado nuestros objetivos de guerra"
 EUYL.2.d:0 "Nuestros enemigos han opuesto una resistencia muy feroz, y nuestros objetivos originales se han ido al garete. \n\nNuestro pueblo está tomando las calles para protestar por nuestra fallida expansión, y tenemos que tomar una decisión rápidamente. ¿Bajamos nuestras armas?"
 EUYL.2.a:0 "Nos rendimos"
 EUYL.2.b:0 "Seguiremos adelante"

 EUYL.3.t:0 "[FROM.GetName] Ha bajado sus armas"
 EUYL.3.d:0 "Se nos ha notificado que [FROM.GetName] ha decidido detener todos los avances en nuestro territorio y cesar su ataque. Incluso han accedido a entregarnos el territorio que les conquistamos. \n\nNuestra feroz resistencia ha dado sus frutos y ahora somos nosotros los que salimos victoriosos."
 EUYL.3.a:0 "¡SOMOS MEJORES!"

 ## NUEVO CONTENIDO DLC ##
 argentina.dlc.1.t:0 "Pequeña marcha fascista en [FROM.FROM.GetName]"
 argentina.dlc.1.d:0 "Aunque se hicieron grandes preparativos para celebrar una marcha masiva, sólo unos pocos acudieron a la marcha en [FROM.FROM.GetName]. Sólo queda esperar que a la próxima asista más gente".
 argentina.dlc.1.a:0 "Maldición"
 argentina.dlc.2.t:0 "Marcha fascista en [FROM.FROM.GetName]"
 argentina.dlc.2.d:0 "La marcha en [FROM.FROM.GetName] resultó un éxito, ya que muchas personas se presentaron para elogiar las ideas del fascismo y expresar su solidaridad con la ideología."
 argentina.dlc.2.a:0 "¡Genial!"
 argentina.dlc.3.t:0 "Gran marcha fascista en [FROM.FROM.GetName]"
 argentina.dlc.3.d:0 "Lo que en principio iba a ser una marcha de tamaño decente en [FROM.FROM.GetName] resultó ser multitudinaria. Salió mucho mejor de lo que nadie esperaba".
 argentina.dlc.3.a:0 "¡Fantástico!"
 argentina.dlc.4.t:0 "La oposición obligada a rendirse"
 argentina.dlc.4.d:0 "Recibimos una notificación oficial de Marcelo T. de Alvear, líder de la resistencia anit-gubernamental, declarando su rendición oficial y su renuncia a cualquier tipo de confrontación. También ha prometido que no habrá más hostilidades en adelante".
 argentina.dlc.4.a:0 "Parece que aprendieron la lección"
 argentina.dlc.5.t:0 "Varios sectores de la oposición se unen contra nosotros"
 argentina.dlc.5.d:0 "Tras tomar el control total de la nación, muchas de las partes más democráticas de la Concordancia, la UCR, los socialistas e incluso algunos comunistas se han unido para formar una coalición contra nuestro actual gobierno, ¡y nuestra inteligencia ha descubierto que están planeando un levantamiento a gran escala para desalojarnos por la fuerza del poder!"
 argentina.dlc.5.a:0 "¡Pagarán con su sangre!"
 argentina.dlc.6.t:0 "Leopoldo Lugones ofrece tomar el poder"
 argentina.dlc.6.d:0 "Tras incorporarse a las filas del gobierno, mucha gente comenzó a idolatrar la forma de pensar de Lugones, que ha recabado un apoyo masivo en los últimos tiempos. Debido a este gran apoyo público, Lugones ha acudido a nosotros, ofreciéndose a tomar el poder en nuestro lugar y dirigir Argentina. Él cree que con su apoyo, será un mejor candidato para llevar a la nación a su máximo potencial.\n\n¿Qué debemos hacer?"
 argentina.dlc.6.a:0 "¿Sabes qué? Claro, ¿por qué no?
 argentina.dlc.6.b:0 "...¿estás loco? Diablos, ¡NO!"
 
 ## Ecuador ##
 ecu.1.t:0 "Gallo es ascendido al liderazgo supremo"
 ecu.1.d:0 "Después del intento de Páez de prolongar su posición de poder, el ejército ha decidido colocar a Alberto Enríquez Gallo en el poder. Los militares creen que sus creencias profundamente arraigadas en la democracia y la libertad garantizarán la democracia en el país. \n\nAdemás del repentino cambio de poder, el ejército también ha disuelto la Asamblea Constituyente para controlar más eficazmente la nación."
 ecu.1.a:0 "Ok"
 ecu.2.t:0 "La inflación golpea la economía ecuatoriana"
 ecu.2.d:0 "La inflación ha golpeado nuestra economía, aumentando los precios y reduciendo el valor de nuestra moneda. Nadie vio venir esto tampoco. ¡El banco central está luchando por resolver la crisis financiera que ahora está presente en la nación!"
 ecu.2.a:0 "Esto es malo..."
 ecu.3.t:0 "La Asamblea Constituyente depone [ROOT.GetLeader]"
 ecu.3.d:0 "La Asamblea Constituyente se reunió hoy después de analizar la situación crítica. Consideraron que [ROOT.GetLeader] no estaba preparado para la tarea de liderar la nación y serán despedidos de su cargo. A partir de hoy , la Asamblea tomará el poder."
 ecu.4.t:0 "Los comunistas ganan las elecciones nacionales"
 ecu.3.a:0 "Ah, maldita sea"
 ecu.4.d:0 "Después de que gran parte de la población exigiera elecciones, los resultados regresaron con una victoria contundente para el partido comunista. Tanto el partido conservador como el liberal, que han gobernado el país durante la gran mayoría de su tiempo. , no pueden creer este resultado y se niegan a aceptar un gobierno totalitario comunista en el poder.\n\nTendremos que mantener a los bipartidistas bajo control antes de que vuelvan a intentarlo."
 ecu.4.a:0 "¡Fantástico!"
 ecu.5.t:0 "Protestas contra la movilización"
 ecu.5.d:0 "Después de que [ROOT.GetLeader] llamó a la movilización contra la creciente amenaza [PRU.GetAdjective], muchos ecuatorianos se negaron e incluso comenzaron a protestar contra ella. Si [PRU.GetAdjective] se entera de esto, nosotros Estaré en serios problemas".
 ecu.5.a:0 "¿No se dan cuenta de la gravedad de la situación???"
 ecu.6.t:0 "Asamblea Constituyente en conflicto con [ROOT.GetLeader]"
 ecu.6.d:0 "Después de que [ROOT.GetLeader] tomó el poder. Muchos miembros de la asamblea comenzaron a cuestionar sus habilidades e ideales de liderazgo. Esto ahora ha causado una división entre el presidente del país y la Asamblea Constituyente."
 ecu.6.a:0 "Genial... justo lo que necesitábamos"
 ecu.8.t:0 "Hallan muerto Aurelio Mosquera Narváez"
 ecu.8.d:0 "Aurelio falleció trágicamente. Sin embargo, un manto de misterio rodea su muerte, ya que las fuentes no pueden confirmar si fue por suicidio o por homicidio. De cualquier manera, hoy sabemos lamentar la muerte de un gran líder, que tenía un brillante futuro por delante."
 ecu.8.a:0 "Que en paz descanse"
 ecu.9.t:0 "[FROM.GetName] está dispuesto a retirar sus reclamaciones de protección"
 ecu.9.d:0 "Los delegados de [FROM.GetName] han llegado a nuestra oficina para discutir la posibilidad de cerrar un acuerdo de paz entre nosotros dos. Están dispuestos a abandonar todos sus reclamos en nuestro territorio a cambio de nuestro protección sobre ellos. \n\nAceptar esto significaría que no habrá hostilidades entre los dos.
 ecu.9.a:0 "Claro, dejemos de lado nuestras diferencias"
 ecu.9.b:0 "PFFFFFF, ¡como si simplemente fuéramos a olvidar lo que ustedes nos hicieron!"
 ecu.10.t:0 "[FROM.GetName] se ofrece a colocarnos bajo su protección"
 ecu.10.d:0 "Generales respetados de [FROM.GetName] han llegado a nuestra oficina para discutir el potencial de convertirse en súbdito suyo a cambio de su protección total sobre nuestra soberanía. \n\nAceptar esto convertiría nosotros a un estado satélite suyo. ¿Aceptaremos estos términos?
 ecu.10.a:0 "...Bien"
 ecu.10.b:0 "¡Ustedes, imbéciles, sólo quieren usarnos!"
 ecu.11.t:0 "[FROM.GetName] propone una unión entre nuestros países"
 ecu.11.d:0 "Los delegados de [FROM.GetName] han llegado a nuestra oficina para discutir una posible unión entre nuestros países, considerando nuestras similitudes en personas y cultura. \n\n¿Aceptamos y formamos la Unión Colombo-Ecuatoriana? ?"
 ecu.11.a:0 "Claro"
 ecu.11.b:0 "Nos gustaría seguir siendo un país, así que no"
 ecu.12.t:0 "[FROM.GetName] exige derechos sobre nuestros recursos"
 ecu.12.d:0 "[FROM.GetName] nos ha enviado un ultimátum para que les entreguemos el acceso a nuestros recursos en todo el país. De no hacerlo, puede resultar en una invasión terrestre a gran escala por parte de [FROM.GetName] . \n\n¿Qué debemos hacer?"
 ecu.12.a:0 "¿Tenemos alguna opción?"
 ecu.12.b:0 "¡Ven y tómalo, veamos cuánta sangre estás dispuesto a derramar!"
 ecu.13.t:0 "[FROM.GetName] mantiene relaciones diplomáticas peligrosas"
 ecu.13.d:0 "Hemos recibido noticias de que [FROM.GetName] ha estado adoptando una política exterior bastante peligrosa, alineándose con las principales potencias fascistas. Si les permitimos continuar con esto, las potencias fascistas podrían afianzarse en nuestro suelo natal.\n\n¿Cómo procederemos?
 ecu.14.t:0 "Velasco Ibarra regresa a Ecuador"
 ecu.14.d:0 "Velasco ha llegado hoy después de permanecer unos años en Buenos Aires. Mucha gente ya ha comenzado a elogiar su regreso y a llamarlo el verdadero salvador del país. A pesar de su presidencia bastante corta, la situación política de "El país no ha sido el más estable y la gente puede verlo como una oportunidad para salir de este lío".
 ecu.14.a:0 "Bienvenido de nuevo, Velasco"
 ecu.14.b:0 "Negar su entrada"
 ecu.15.t:0 "Aparece un visitante extraño en nuestra oficina"
 ecu.15.d:0 "Poco después de tomar el poder del país, un hombre extraño ha llegado a nuestra oficina. Nos explicó su situación y cómo es hijo del actual rey de España, que en ese momento vivía en Italia. , sin embargo, vio nuestra nación como una oportunidad para escapar y potencialmente establecerse adecuadamente. Afirma que nuestra nación tiene un vínculo extrañamente fuerte con la casa de Borbón, y que puede hacer muchas cosas grandes si se lo permitimos. hacemos con él?"
 ecu.15.a:0 "Puede quedarse, tal vez este plan suyo pueda hacerse realidad"
 ecu.15.b:0 "No te conocemos"
 ecu.16.t:0 "Velasco comienza a ganar apoyo a nivel nacional"
 ecu.16.d:0 "El peor de los casos ha comenzado a desarrollarse, ya que la gente de todo el país ha comenzado a manifestarse en torno a Velasco, viéndolo como la única gracia salvadora para el país. \n\nComo si eso no fuera malo Bastante, los Carabineros también han comenzado a apoyar a Velasco y a manifestarse contra [ROOT.GetLeader]. \n\n¡Necesitamos actuar y rápido!
 ecu.16.a:0 "¡Vete al infierno, idiota!"
 ecu.17.t:0 "Protesta pro-Velasquist en [FROM.FROM.GetName]"
 ecu.17.d:0 "Recibimos la noticia de que se llevó a cabo una manifestación pro-Velasquista en [FROM.FROM.GetName], que recibió gran atención y sólo exasperó el apoyo de Velasco en todo el país."
 ecu.17.a:0 "Genial..."
 ecu.18.t:0 "La Gloriosa"
 ecu.18.d:0 "El pueblo se ha hartado de [ROOT.GetLeader] y exige que abandone el poder inmediatamente, permitiendo que Velasco asuma el poder. Los velaquistas de todo el país están abiertamente en contra de nuestro gobierno y están dispuestos a derramar sangre si eso significa que Velasco toma el poder \n\n¿Cómo manejaremos esta terrible situación?
 ecu.18.a:0 "Debemos dar marcha atrás..."
 ecu.18.b:0 "¡En tus sueños!"
 ecu.19.t:0 "Velasco asume el poder"
 ecu.19.d:0 "Después de restaurar temporalmente el control del país, la junta provisional ha retrocedido oficialmente para permitir que Velasco Ibarra tome el control de la nación. Hoy es un día maravilloso para los velaquistas, y nuestro gran líder finalmente puede ¡Hagamos avanzar a este país!".
 ecu.19.a:0 "Cómo deberían ser las cosas"
 ecu.20.t:0 "[FROM.GetName] quisiera formar una facción con nosotros"
 ecu.20.d:0 "Los delegados de [FROM.GetName] han llegado a nuestra oficina para discutir el potencial de formar una alianza con nosotros. Creen que permanecer juntos, unidos, nos hará invencibles ante cualquier amenaza externa. \n \n¿Aceptamos?"
 ecu.20.a:0 "Claro"
 ecu.20.b:0 "No, lo siento"
 ecu.21.t:0 "[FROM.GetName] nos ha dado acceso a todos sus recursos"
 ecu.21.d:0 "Hemos recibido noticias de que [FROM.GetName] nos ha permitido administrar todos sus recursos y usarlos como queramos."
 ecu.21.a:0 "¡Fantástico!"
 ecu.22.t:0 "La United Fruit Company se ofrece a tomar el poder"
 ecu.22.d:0 "Los funcionarios corporativos de la Compañía Bananera han notado nuestro interés en la compañía, así como nuestra mediocre eficiencia administrativa en el país, y se han ofrecido a tomar el control del país. \n\n¿Deberíamos permitirlo? ?"
 ecu.22.a:0 "No tenemos elección..."
 ecu.22.b:0 "¡NO tomarás el poder!"
 ecu.23.t:0 "La Compañía Bananera toma el poder en Ecuador"
 ecu.23.d:0 "A Ecuador últimamente no le ha ido tan bien, sufriendo una guerra civil y una crisis política que pronto siguió. Debido a todo esto, la United Fruit Company ha decidido tomar el asunto en sus propias manos y tomar control administrativo del país. \n\nNunca antes se había visto que una empresa dirigiera un país entero, y esto podría significar un desastre si lo único que tienen en mente es el dinero."
 ecu.23.a:0 "¡Fantástico!"
 ecu.23.b:0 "Interesante"
 ecu.24.t:0 "La Formación del ARNE"
 ecu.24.d:0 "Recibimos la noticia de que Jorge Luna Yépes acaba de formar un nuevo partido fascista, la Acción Revolucionaria Nacionalista Ecuatoriana, basándose en gran medida en las ideas del falangismo en España. Ha ganado cierto apoyo y podría "Podemos llegar a ser una espina clavada si ganan demasiada popularidad".
 ecu.24.a:0 "Ok"
 ecu.25.t:0 "Edmundo Chiriboga muerto en combate"
 ecu.25.d:0 "A nuestra oficina han llegado noticias trágicas, ya que nuestros soldados confirmaron que el respetado general Edmundo Chiriboga murió en combate. Tal es el caso de muchos de nuestros valientes soldados que luchan contra los miserables cabrones peruanos. Esperamos que Finalmente puedo encontrar la paz en el otro lado."
 ecu.25.a:0 "Que en paz descanse"
 ecu.26.t:0 "El Reino Unido de Ecuador, Perú y Bolivia"
 ecu.26.d:0 "La idea de un reino que cobrara vida en América del Sur definitivamente no estaba en la mente de muchos y, sin embargo, hoy se ha confirmado que se ha formado el [ECU.GetName], con [ECU .GetLeader] a la cabeza de todo Originario de España, el miembro de la Casa de Borbón vio en Ecuador una oportunidad para hacer brillar tanto a su majestad como al país \n\nA medida que el equilibrio de poder en las Américas está cambiando fuertemente. A partir de esto, sólo el tiempo dirá cómo reaccionarán las demás naciones."
 ecu.26.a:0 "¡Fantástico!"
 ecu.26.b:0 "Interesante"
 ecu.27.t:0 "[PRU.GetName] ha bloqueado Guayaquil"
 ecu.27.d:0 "Hemos recibido informes de que [PRU.GetName] ha bloqueado uno de nuestros puertos más importantes, impidiéndonos recibir mercancías de países extranjeros."
 ecu.27.a:0 "¡Bastardos!"
 
 ## PERU - ECUADOR ##
 peruecuador.1.t:0 "[FROM.GetName] ha militarizado el Pastaza Occidental"
 peruecuador.1.d:0 "Fuentes locales confirmaron que soldados [FROM.GetAdjective] han entrado en Pastaza. ¡Esto es una violación directa del Status Quo firmado en 1936, y podría incluso clasificarse como una declaración de guerra! \n\n ¿Cuál debería ser nuestra respuesta?"
 peruecuador.1.a:0 "Hay que militarizar también"
 peruecuador.1.b:0 "¡Esto es un acto de guerra, debemos tomar represalias!"
 peruecuador.1.c:0 "Esperaremos y veremos cómo se desarrolla la situación"
 peruecuador.2.t:0 "[FROM.GetName] también se ha remilitarizado en respuesta"
 peruecuador.2.d:0 "Después de que entramos en Pastaza para reforzar la línea del frente, fuentes confiables han confirmado que [FROM.GetName] ha hecho lo mismo en un intento de contrarrestar nuestras acciones."
 peruecuador.2.a:0 "Está bien"
 peruecuador.3.t:0 "[PRU.GetName] y [ECU.GetName] están en guerra!"
 peruecuador.3.d:0 "Hemos recibido información de que tanto [PRU.GetName] como [ECU.GetName] están en guerra debido a una disputa territorial en la región de Pastaza. \n\nEste será el primer gran conflicto en Sudamérica ha tenido en casi 6 años, sin embargo, tenemos la oportunidad de detenerlo a tiempo y coincidir durante las conversaciones de paz.\n\n¿Qué haremos?"
 peruecuador.3.a:0 "¡Debemos asegurar la paz en nuestro continente!"
 peruecuador.3.b:0 "¿Por qué debería importarnos?"
 peruecuador.30.t:0 "[FROM.GetName] ha iniciado propuestas de conversaciones de paz"
 peruecuador.30.d:0 "Los delegados de [FROM.GetName] han propuesto iniciar conversaciones de paz lo antes posible para evitar una mayor escalada de guerra."
 peruecuador.4.t:0 "Las conversaciones de paz están sobre nosotros"
 peruecuador.4.d:0 "Ha llegado el día. Los delegados de todo el continente, incluidos [BRA.GetName], [ARG.GetName] y [USA.GetName] están esperando nuestra respuesta definitiva sobre la situación. Están todos presionando para que detengamos esta guerra y una vez más estemos en paz. \n\nHan asegurado que cualquier territorio actualmente bajo nuestro control será trazado dentro de las fronteras oficiales.\n\n¿Qué haremos?"
 peruecuador.4.a:0 "Paremos esta guerra"
 peruecuador.4.b:0 "¡Hay una disputa con la que todavía tenemos que lidiar!"
 peruecuador.5.t:0 "Ambas Naciones han Acordado la Paz"
 peruecuador.5.d:0 "¡Hoy es un buen día! Se ha recibido confirmación de que ambas naciones están dispuestas a firmar un acuerdo de paz, poniendo fin oficialmente a la guerra entre [PRU.GetName] y [ECU.GetName]."
 peruecuador.5.a:0 "¡Fantástico!"
 peruecuador.6.t:0 "El Protocolo de Río de Janeiro"
 peruecuador.6.d:0 "Desde la caída de la Gran Colombia, ha habido una disputa territorial entre [PRU.GetName] y [ECU.GetName], más notablemente sobre el territorio de Pastaza, y ambas naciones lo reclaman como suyo. Estas tensiones fronterizas eventualmente escalaron hasta convertirse en una guerra a gran escala. Afortunadamente, gracias a la firma de este tratado de paz, la paz se ha restablecido en el continente de América del Sur. \n\nMuchos todavía se preguntan si la paz realmente permanecerá en estas nuevas fronteras. , ya que el conflicto sigue muy presente."
 peruecuador.6.a:0 "Paz al fin"
 peruecuador.6.b:0 "Está bien"
 peruecuador.7.t:0 "¿Nos Retiramos de Tierras Ecuatorianas?"
 peruecuador.7.d:0 "Ahora que la guerra ha terminado, surge una pregunta: ¿Deberíamos continuar con nuestra ocupación de tierras ecuatorianas o deberíamos devolvérselas a Ecuador?\n\n¿Cuál será el resultado?"
 peruecuador.7.a:0 "Hay que retirarnos de ahi"
 peruecuador.7.b:0 "¡De ninguna manera!"
 peruecuador.8.t:0 "[PRU.GetName] Se Retira de Nuestras Tierras"
 peruecuador.8.d:0 "[PRU.GetName] ha retirado sus tropas de nuestro territorio, y volvemos a tener posesión de nuestra tierra."
 peruecuador.8.a:0 "Bien"
 peruecuador.9.t:0 "[PRU.GetName] Sigue Ocupando Nuestras Tierras"
 peruecuador.9.d:0 "¡Tropas [PRU.GetAdjective] aún están presentes en nuestras tierras!\n\n¿Qué haremos?"
 peruecuador.9.a:0 "Solo déjalo ir"
 peruecuador.9.b:0 "¡No se van a salir con la suya!"
 peruecuador.10.t:0 "Operación Militar Exitosa"
 peruecuador.10.d:0 "¡Nuestras tropas lograron completar la operación militar designada! ¡Podemos alegrarnos!"
 peruecuador.10.a:0 "¡Maravilloso!"
 peruecuador.11.t:0 "Operación militar fallida"
 peruecuador.11.d:0 "Nuestras tropas lamentablemente no cumplieron con las tareas que les fueron asignadas."
 peruecuador.11.a:0 "Qué lástima..."
 peruecuador.12.t:0 "Estamos preparados para luchar [ECU.GetName]"
 peruecuador.12.d:0 "Todos los preparativos están hechos, ¡podemos declarar la guerra al Ecuador!"
 peruecuador.12.a:0 "¡Tomaremos lo nuestro!"
 peruecuador.13.t:0 "Escaramuza victoriosa en [FROM.FROM.GetName]"
 peruecuador.13.d:0 "Nuestras tropas tuvieron éxito en manejar al enemigo en [FROM.FROM.GetName]. ¡Gracias a esto, hemos obtenido aún más información sobre el enemigo!"
 peruecuador.14.t:0 "Derrota en [FROM.FROM.GetName]"
 peruecuador.14.d:0 "Desafortunadamente, la batalla que ocurrió no estaba destinada a beneficiarnos. Nuestro enemigo ahora ha aumentado su información sobre nosotros, y si no actuamos rápido, ¡esto podría significar nuestra perdición!"
 peruecuador.140.t:0 "Victoria en [490.GetName]"
 peruecuador.140.d:0 "Pudimos repeler con éxito a las tropas enemigas en [490.GetName]. \n\n¡Esto aumentará enormemente nuestro esfuerzo de guerra contra ellos!"
 peruecuador.140.a:0 "fantástico"
 peruecuador.15.d:0 "Delegados de [ECU.GetAdjective] han llegado a nuestro país para pedir nuestra ayuda en su inevitable conflicto con [PRU.GetName].\n\n¿Les ayudamos?"
 peruecuador.16.t:0 "¡Ecuador ha ocupado ilegalmente Piura!"
 peruecuador.16.d:0 "¡Hemos recibido noticias urgentes de que tropas [ECU.GetAdjective] han entrado en la provincia de Piura sin previo aviso! ¡Esta es una clara declaración de guerra y nuestras tropas deben movilizarse inmediatamente!"
 peruecuador.16.a:0 "¡ESTOS HIJOS DE PUTA NO VAN A SALIR CON LA SUYA!"
 peruecuador.16.b:0 "No podemos declarar la guerra ahora"
 peruecuador.17.t:0 "Ecuador lucha contra las protestas contra la guerra"
 peruecuador.17.d:0 "Algunos de nuestros espías dentro de Ecuador han regresado a nosotros afirmando que el país está pasando por tiempos difíciles debido a su intento de movilizarse en preparación para la inevitable guerra. Esto puede ser muy útil para nosotros ya que ¡Estará desorganizado y lo aprovecharemos al máximo!
 peruecuador.17.a:0 "¡Perfecto, prepara la ofensiva!"
 peruecuador.18.t:0 "Ganador de la Guerra Perú-Ecuador"
 peruecuador.18.d:0 "Después de muchos meses de espantosas batallas, hemos salido victoriosos del conflicto. ¡Lo que tenemos por delante es un futuro brillante, reluciente con la alegría de nuestra conquista militar victoriosa!"
 peruecuador.18.a:0 "¡Increíble!"
 peruecuador.19.t:0 "Perdedor de la guerra Perú-Ecuador"
 peruecuador.19.d:0 "A pesar de haber dado todo lo que teníamos, hemos sido derrotados. Es sólo cuestión de tiempo que las consecuencias comiencen a verse."
 peruecuador.19.a:0 "¡No está bien! ¡Nada bien!"
 peruecuador.20.t:0 "Resultado no concluyente de la guerra Perú-Ecuador"
 peruecuador.20.d:0 "La guerra ha tenido un resultado bastante poco concluyente, sin que ninguna de las partes pueda decir realmente que fue la 'ganadora'."
 peruecuador.20.a:0 "Supongo... ¿está bien?"
 peruecuador.21.t:0 "[PRU.GetName] ha iniciado una Guerra Fronteriza en [490.GetName]"
 peruecuador.21.d:0 "El aumento de la actividad de las tropas no fue sólo para mostrar, ya que [PRU.GetAdjective] ha iniciado un conflicto fronterizo a gran escala en la provincia de [490.GetName]. ¡Debemos reforzar y acelerar!"

 chile.430.t:0 "[FROM.GetName] está exigiendo a [270.GetName]"
 chile.430.d:0 "Hemos recibido una demanda de [FROM.GetName] para que entreguemos la posesión de [270.GetName]. Si no lo hacemos, tendremos graves consecuencias. \n\n¿Cómo procederemos con esto?"
 chile.430.a:0 "Que se la queden"
 chile.430.b:0 "La isla seguirá siendo BRITÁNICA"

 chile.51.t:0 "¡Golpe fascista en Chile!"
 chile.51.d:0 "[CHL.GetName] ha experimentado un cambio reciente hacia una política más derechista en los últimos meses. Aunque la mayoría suponía que este cambio seguiría siendo político y democrático, muchos se sorprendieron al descubrir que el país atravesó un golpe de estado repentino y brutal para derrocar al gobierno democrático en lugar de uno fascista. \n\nLos nacistas, como se autodenominan, son extremistas que no buscan nada más que traer orden y justicia a Chile, mientras difunden el miedo entre sus vecinos".
 chile.51.a:0 "Un aliado muy útil, de hecho".
 chile.51.b:0 "Qué peligroso. Qué triste".
 chile.51.c:0 "¡Chile volverá a ser grande!"

 ecu.28.t:0 "[FROM.GetName] solicita acceso militar a las Galápagos"
 ecu.28.d:0 "Debido a su reciente altercado con [JAP.GetName], [FROM.GetName] solicita acceso militar y naval a [649.GetName], ya que creen que es un punto estratégico para defender. ¿Lo permitimos?"
 ecu.28.b:0 "¡Absolutamente no!"

 ecu.29.t:0 "¡Perú ha militarizado [490.GetName]!"
 ecu.29.d:0 "Nuestro cuartel general ha recibido informes advirtiéndonos de la presencia militar peruana en la provincia de [490.GetName]. \n\n¿Cómo responderemos a esta amenaza potencial a nuestra soberanía?"
 ecu.29.a:0 "¡Debemos militarizarnos en respuesta!"
 ecu.29.b:0 "Tenemos que dar marcha atrás..."