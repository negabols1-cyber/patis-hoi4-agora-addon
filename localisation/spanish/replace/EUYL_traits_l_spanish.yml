 POLITICS_SUN_GOD_DESC:0 "Inti es el antiguo dios inca del sol. Es venerado como el patrón nacional del Estado Inca. Aunque la mayoría considera a Inti como el dios del sol, es más apropiado verlo como un conjunto de aspectos solares, ya que los incas dividían su identidad según las etapas del sol. Adorado como deidad patrona del Imperio Inca, Pachacuti suele estar relacionado con el origen y la expansión del culto al sol de los incas. La historia más común dice que es el hijo de Viracocha, el dios de la civilización. \n\nSegún el lingüista Rodolfo Cerrón-Palomino, la palabra inti no es de origen quechua, sino un préstamo de la lengua puquina. El préstamo de la lengua puquina explica por qué lenguas genéticamente no relacionadas, como el quechua, el aymara y el mapuche, tienen palabras similares para referirse al Sol. Las similitudes no son sólo lingüísticas sino también simbólicas, ya que en la cosmología mapuche y andina central el Sol (Inti/Antu) y la Luna (Quilla/Cuyen) son esposos".
