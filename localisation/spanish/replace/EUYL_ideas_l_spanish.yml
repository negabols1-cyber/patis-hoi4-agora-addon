 URG_economy_officers_tt:0 "§RUnir una gran cantidad de tierras tan repentinamente hará que tu economía se vuelva inestable y que parte de tu ejército se rebele!§!"
 URG_economic_instability:0 "Inestabilidad económica"
 URG_rebelling_officers:0 "Oficiales rebeldes"
 URG_prepare_the_army:0 "Preparar el ejército"
 URG_prepare_the_army_desc:0 "Nuestro trabajo no ha hecho más que empezar, ¡todavía nos queda mucho camino por recorrer!"
 URG_the_terra_dictatorship:0 "La Dictadura de Terra"
 URG_the_terra_dictatorship_idea:0 "La Dictadura de Terra"
 URG_the_terra_dictatorship_idea_desc:0 "Gabriel Terra ha estado gobernando la nación con mano de hierro desde que asumió el poder. Debido a esto, muchos enemigos se hicieron a lo largo del camino, y muchos de ellos fueron tratados con el arresto de ellos. Esto junto con múltiples golpes de estado ha convertido a la dictadura en una frágil, donde en el momento en que Terra deje de gobernar con brutalidad, el país arderá en llamas.  \n\n§RSi el apoyo a Terra cae por debajo del 35%, entonces se lanzará en una guerra civil casi imposible!"
 URG_debt_repayment_in_progress:0 "Devolución de la deuda en curso"
 URG_welfare_state:0 "Estado del Bienestar"
 URG_welfare_state_desc:0 "Remontándose a la segunda presidencia de José Batlle y Ordóñez, el sistema actual incluye prestaciones completas de desempleo y pensiones para ancianos y discapacitados. Este sistema ha permitido al gobierno ganarse el apoyo de la clase baja, pero también limita el presupuesto que dicho gobierno puede gastar."
 URG_ancap_concern:0 "ANCAP"
 URG_ancap_concern_desc:0 "ANCAP (abreviatura de Administración Nacional de Combustibles, Alcohol y Portland) es una industria petrolera creada en 1931 por Gabriel Terra. A pesar del tipo de industria que es, también se centra en el control de los monopolios de las industrias del alcahol y los combustibles. Esta industria cambiará dependiendo de las decisiones que tomemos con nuestro gobierno".
 URG_udelar:0 "UDELAR"
 URG_udelar_desc:0 "La Universidad de la República (UDELAR) es la universidad pública de Uruguay y la más importante del país."
 URG_PESMA:0 "PESMA"
 URG_CIACA:0 "CIACA"
 URG_SCRA:0 "SCRA"
 URG_Ford:0 "Ford Motores Uruguay"
 URG_debt_to_the_british:0 "Deuda con los británicos"
 URG_debt_to_the_british_desc:0 "Debido a nuestras diversas expansiones industriales en las últimas décadas, hemos acumulado una deuda que hay que devolver a los británicos. Los británicos esperan que paguemos esta deuda, y con el mundo calentándose a nuestro alrededor, sólo podemos esperar que no se derrame sangre con este problema y que seamos capaces de pagarla pacíficamente. \N - Esta idea se eliminará cuando se haya pagado toda la deuda con los británicos".
 URG_terra_loyalities:0 "Leales a Terra"
 URG_violent_protests:0 "Protestas violentas"
 URG_violent_protests_desc:0 "Un montón de gente ha tomado las calles y han empezado a manifestarse por toda la nación, haciendo que muchos inocentes pierdan la vida y que el país se paralice. Tenemos que parar estas protestas y rápido si queremos seguir siendo una nación soberana."
 URG_rebuilding_the_nation:0 "Reconstruir la nación"
 URG_economic_liberty:0 "Libertad económica"
 URG_economic_liberty_2:0 "Libertad económica"
 URG_improved_research:0 "Investigación mejorada"
 URG_expanded_consription:0 "Conscripción ampliada"
 URG_the_great_patriotic_war:0 "La Gran Guerra Patriótica"
 URG_the_great_patriotic_war_desc:0 "¿De verdad creen estos argentinos que nos van a pasar por encima como si nada? Pues se van a llevar una gran sorpresa, porque vamos a luchar, y vamos a luchar hasta el final. No nos rendiremos bajo ninguna circunstancia, no importa cuánta sangre se derrame ni cuán larga sea la guerra, nos aseguraremos de que aunque perdamos a la larga lo pasen mal."
 URG_maintaining_a_powerful_economy:0 "Mantener una economía poderosa"
 URG_building_up_an_airforce:0 "Construir una fuerza aérea"
 URG_building_up_an_airforce_desc:0 "Con una poderosa fuerza aérea, podemos dominar los cielos, y dominar los cielos nos dará la ventaja en cualquier conflicto futuro."
 URG_privatized_industry:0 "Industria privatizada"
 URG_privatized_industry_desc:0 "Con una industria privatizada, ya no podemos intervenir directamente en la economía con la misma eficacia que antes. Sin embargo, la privatización de nuestra industria nos permite nuevas opciones que la mayoría de las otras naciones no tienen a su disposición."
 URG_rodney_arismendi:0 "Rodney Arismendi"
 URG_serafino_mazzolini:0 "Serafino Mazzolini"
 URG_safu:0 "Sociedad Anónima Fabril Uruguaya"
 URG_ute:0 "Usinas y Trasmisiones Eléctricas"
 URG_ute_desc:0 "La Administración Nacional de Usinas y Trasmisiones Eléctricas,​ más conocida por sus siglas UTE, es la compañía estatal de producción y abastecimiento de energía eléctrica de Uruguay. Fue creada el 21 de octubre de 1912, cuando se promulgó una ley que dio origen a esta empresa pública,​ en el marco del impulso reformista y de modernización de los sucesivos gobiernos batllistas."
