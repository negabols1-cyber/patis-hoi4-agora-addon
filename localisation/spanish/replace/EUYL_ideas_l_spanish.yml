 CHL_political_instability_idea_desc:0 "El espectro político actual en Chile es todo menos bonito. El Gobierno, los comunistas y los nacistas están en un constante tira y afloja político, y la nación entera está dividida en tres partes. Esta división está perjudicando gravemente a la nación, y si continúa más, la nación de Chile puede muy bien estar en serios problemas."


