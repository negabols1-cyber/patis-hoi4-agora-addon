 PAR_victor_of_the_chaco_war:0 "Vencedor de la Guerra del Chaco"
 PAR_victor_of_the_chaco_war_desc:0 "La Guerra del Chaco se libró de 1932 a 1935 entre Bolivia y Paraguay, por el control de la parte norte de la región del Gran Chaco. Paraguay terminó victorioso en este encuentro militar, y debido a esto, el pueblo es más patriota. que nunca. \n\n§R¡Perder el control sobre el Chaco eliminará este espíritu nacional!§!"
