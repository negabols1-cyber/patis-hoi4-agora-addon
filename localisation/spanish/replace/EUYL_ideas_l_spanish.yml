 BRA_labor_rights:0 "Derechos Laborales"
 rural_economy:0 "Economía Rural"
 rural_economy_desc:0 "La economía brasileña está aún lejos de ser una economía industrializada. La gran mayoría depende de la agricultura y las plantaciones de café. Aunque esto ayuda a nuestras exportaciones, tenemos que industrializarnos pronto o, de lo contrario, nos quedaremos atrás mientras otros países se industrializan y con rapidez."
