 ARG_send_volunteers:0 "Enviar voluntarios"
 ARG_send_volunteers_desc:0 "Necesitamos poder enviar voluntarios para que nuestros planes funcionen."
 URG_influenced_politics:0 "Argentina está influenciando nuestra política"
 URG_influenced_politics_desc:0 "La Confederación Argentina está enviando diplomáticos fascistas para influenciar nuestra política. Lo que sea que estén haciendo, no es bueno".
 ARG_the_second_cisplatine_war:0 "Dale a Brasil la lucha que quiere"
 ARG_the_second_cisplatine_war_desc:0 "Brasil nos ha declarado la guerra sin ninguna razón real, es hora de que paguen con sangre. Es hora de que les demos la lucha que anhelaban".
 ARG_the_second_cisplatine_war_2:0 "Dale a Brasil la lucha que quiere"
 ARG_the_second_cisplatine_war_2_desc:0 "Brasil nos ha declarado la guerra sin ninguna razón real, es hora de que paguen con sangre. Es hora de que les demos la lucha que anhelaban".
 ARG_naval_supremacy_over_brazil:0 "Supremacía naval sobre Brasil"
 ARG_naval_supremacy_over_brazil_desc:0 "Debemos ganar la supremacía sobre Brasil si siquiera soñamos con vencerlos en la guerra".
 ARG_expansionist_policy:0 "Política expansionista"
 ARG_joint_germanargentine_military_training:0 "Entrenamiento militar conjunto"
 ARG_joint_germanargentine_military_training_desc:0 "Ambos estamos aprendiendo nuevas técnicas de los ejércitos del otro, y con esto ambos estamos mejorando mutuamente nuestros ejércitos."
 ARG_increased_naval_output:0 "Incremento de la producción naval"
 ARG_increased_naval_output_desc:0 "Con este incremento de nuestra producción naval, al menos podremos superar a cualquier potencia naval latinoamericana".
 ARG_increased_naval_output_2:0 "Incremento de la salida naval"
 ARG_increased_naval_output_2_desc:0 "Con este incremento de nuestra producción naval, al menos podremos superar a cualquier potencia naval latinoamericana".
 ARG_increased_naval_output_3:0 "Incremento de la salida naval"
 ARG_increased_naval_output_3_desc:0 "Con este incremento de nuestra producción naval, al menos podremos superar a cualquier potencia naval latinoamericana".
 ARG_increased_submarine_output:0 "Incremento de la salida de los submarinos"
 ARG_increased_submarine_output_desc:0 "Con estrategias más eficientes, podemos producir más submarinos y competir con la flota de submarinos chilena".
 ARG_increased_destroyer_output:0 "Incremento de la producción de los destructores"
 ARG_increased_destroyer_output_desc:0 "Con estrategias más eficientes, podemos producir más destructores y competir con la flota de destructores brasileños".
 ARG_modern_dockyard_technology:0 "Aumento de la tecnología de los astilleros"
 ARG_modern_dockyard_technology_desc:0 "La nueva y mejorada tecnología de los astilleros nos permite producir barcos a un ritmo más rápido".
 ARG_modern_dockyard_technology_2:0 "Aumento de la tecnología del astillero"
 ARG_modern_dockyard_technology_2_desc:0 "La nueva y mejorada tecnología de los astilleros nos permite producir barcos a un ritmo más rápido".
 ARG_improved_heavy_ships:0 "Mejora de los buques pesados"
 ARG_improved_heavy_ships_desc:0 "Con nueva y avanzada tecnología, podemos dar un mayor golpe en las naves pesadas y asegurarnos de que ninguna otra nave pueda hacer frente a la nuestra".
 ARG_buques_costeros:0 "Construir barcos costeros"
 ARG_build_coastal_ships_desc:0 "Con una mejor tecnología y una mayor eficiencia, podemos construir rápidamente una defensa costera en caso de guerra".
 ARG_modern_armada_argentina:0 "Armada moderna Argentina"
 ARG_modern_armada_argentina_desc:0 "Con todos nuestros recientes desarrollos, gastos navales, expansión de los astilleros y buques modernizados, hemos revolucionado la Armada Argentina, convirtiéndola en una seria potencia naval en las Américas y tal vez en el mundo entero".
 ARG_calidad:0 "Calidad"
 ARG_quality_desc:0 "Con tropas de calidad podemos superar a cualquier enemigo aunque no tengamos la cantidad de hombres que ellos tienen".
 ARG_quality_2:0 "Calidad"
 ARG_quality_2_desc:0 "Con tropas de calidad podemos superar a cualquier enemigo aunque no tengamos la cantidad de hombres que ellos tienen".
 ARG_quantity:0 "Cantidad"
 ARG_quantity_desc:0 "Con una gran cantidad de tropas, no importa si el enemigo tiene el liderazgo tecnológico".
 ARG_quantity_2:0 "Cantidad"
 ARG_quantity_2_desc:0 "Con una gran cantidad de tropas, no importa si el enemigo tiene el liderazgo tecnológico".
 ARG_produce_motorized:0 "Produce Motorizado"
 ARG_produce_motorized_desc:0 "Ahora podemos producir más motorizados a un costo más barato."
 ARG_make_our_own_tanks:0 "Hacer nuestros propios tanques"
 ARG_make_our_own_tanks_desc:0 "Hacer nuestros propios tanques muestra al mundo que no tenemos que depender de sus industrias o tecnologías para avanzar y tener un poderoso ejército".
 ARG_cheaper_artillery:0 "Artillería más barata"
 ARG_cheaper_artillery_desc:0 "Con artillería más barata podremos bombear más artillería y por lo tanto tendremos más potencia de fuego que el enemigo".
 ARG_cheaper_equipment:0 "Equipo más barato"
 ARG_cheaper_equipment_desc:0 "Con un equipo más barato podemos armar más hombres más rápido y por lo tanto hacer nuestro ejército más grande más competente."
 ARG_expand_air_force:0 "Expandir la Fuerza Aérea"
 ARG_expand_air_force_desc:0 "Expandir nuestra fuerza aérea es clave para aplastar al enemigo en los cielos, y permitirnos tener una ventaja en la guerra en tierra".
 ARG_concordancia_elected:0 "Concordancia Reelegida"
 ARG_concordancia_elected_desc:0 "Con la reciente reelección de la Concordancia, podemos seguir controlando el país como antes".
 ARG_union_civica_radical_elected:0 "Unión Cívica Radical Elegida"
 ARG_union_civica_radical_elected_desc:0 "Con la elección de la Unión Cívica Radical, podemos empezar a volver a los ideales más democráticos y educar a este país."
 ARG_los_azules:0 "Los Azules"
 ARG_los_azules_desc:0 "Los Azules es la facción dentro de la UCR que tiende a sostener ideales más conservadores y se pone más del lado de la clase media alta y los ricos".
 ARG_los_azules_2:0 "Los Azules"
 ARG_los_azules_2_desc:0 "Los Azules es la facción dentro de la UCR que tiende a sostener ideales más conservadores y se pone más del lado de la clase media alta y los ricos".
 ARG_los_azules_3:0 "Los Azules"
 ARG_los_azules_3_desc:0 "Los Azules es la facción dentro de la UCR que tiende a sostener ideales más conservadores y se pone más del lado de la clase media alta y los ricos".
 ARG_los_grises:0 "Los Grises"
 ARG_los_grises_desc:0 "Los Grises es la facción dentro de la UCR que tiende a tener más ideales socialistas y se pone más del lado de los pobres".
 ARG_los_grises_2:0 "Los Grises"
 ARG_los_grises_2_desc:0 "Los Grises es la facción dentro de la UCR que tiende a tener más ideales socialistas y se pone más del lado de los pobres".
 ARG_los_grises_3:0 "Los Grises"
 ARG_los_grises_3_desc:0 "Los Grises es la facción dentro de la UCR que tiende a tener más ideales socialistas y se pone más del lado de los pobres".
 ARG_expand_the_YPF:0 "Expandir el YPF"
 ARG_expand_the_YPF_desc:0 "Expandir la empresa YPF nos permitirá reunir más recursos y por lo tanto exportar más al exterior".
 ARG_support_the_YPF_workers_idea:0 "Apoyar a los trabajadores de YPF"
 ARG_support_the_YPF_workers_idea_desc:0 "La empresa puede ser la que empuje a la gente, pero son los trabajadores los que la sacan a relucir."
 ARG_reject_personalismo:0 "Rechaza el personalismo"
 ARG_reject_personalismo_desc:0 "El personalismo es la idea latinoamericana de subyugar los intereses de los partidos políticos, ideologías y el gobierno constitucional a la lealtad de un líder. No podemos permitir que esto ocurra nunca más".
 ARG_banco_central_argentino:0 "Banco Central Argentino Reformado"
 ARG_banco_central_argentino_desc:0 "El Banco Central Argentino es una forma perfecta de controlar nuestra moneda, y tener un banco central nos permitirá nacionalizar el comercio exterior".
 ARG_fadea:0 "Fábrica Argentina de Aviones"
 ARG_fadea_desc:0 "Fundada en 1927, la FAdeA (abreviatura de Fábrica Argentina de Aviones) fue una empresa dedicada a la producción de aviones de uso militar. Su principal planta de producción estaba situada en la provincia de Córdoba."
 ARG_expanded_worker_rights:0 "Derechos laborales ampliados"
 ARG_expanded_worker_rights_Desc:0 "La expansión de los derechos de los trabajadores nos ha ganado el apoyo de la población, y el trabajador promedio ahora trabaja más eficientemente y a un mejor ritmo que antes".
 ARG_barn_of_the_world:0 "El Granero del Mundo"
 ARG_barn_of_the_world_desc:0 "Gracias a nuestras inmensas tierras de cultivo, abundantes recursos naturales y una poderosa economía, fuimos y somos conocidos como el "Granero del Mundo", exportando alimentos y bienes a todos los países del planeta".
 ARG_invest_in_infrastructure:0 "Invertir en nuestra infraestructura"
 ARG_invest_in_infrastructure_desc:0 "Invertir en nuestra infraestructura nos permitirá desarrollar nuestro país más rápidamente y permitir que los bienes sean transportados a y a través del país".
 ARG_our_liberal_ways:0 "Nuestros caminos liberales"
 ARG_our_liberal_ways_desc:0 "Fuimos uno de los primeros países del planeta en adoptar una mentalidad liberal, una que gira en torno al libre mercado, el libre pensamiento y mejores derechos de los trabajadores. Estas ideas nos permitieron en un momento dado ser el país más rico per cápita del planeta. Es hora de que volvamos a esos caminos y nos convirtamos en el poder que una vez fuimos".
 ARG_nuestros_caminos_liberales_2:0 "Nuestros caminos liberales"
 ARG_our_liberal_ways_2:0 "Nuestros caminos liberales"
 ARG_our_liberal_ways_2_desc:0 "Fuimos uno de los primeros países del planeta en adoptar una mentalidad liberal, una que gira en torno al libre mercado, el libre pensamiento y mejores derechos de los trabajadores. Estas ideas nos permitieron en un momento dado ser el país más rico per cápita del planeta. Es hora de que volvamos a esos caminos y nos convirtamos en el poder que una vez fuimos.
 ARG_spanish_civil_war_tactics:0 "Tácticas de la Guerra Civil Española"
 ARG_spanish_civil_war_tactics_desc:0 "Gracias a estar en la primera fila de la guerra civil, podemos tomar nota de las tácticas que se están desplegando y por lo tanto mejorar nuestras propias tropas".
 ARG_spanish_argentine_economic_allience:0 "Cooperación Económica Hispano-Argentina"
 ARG_spanish_argentine_economic_allience_desc:0 "Nuestras dos economías están ahora en auge como resultado de nuestra alianza económica. Sólo cosas buenas han salido de este pacto y muchas más están por llegar."
 ARG_imrpoved_consumer_sector:0 "Mejora del sector de consumo"
 ARG_imrpoved_consumer_sector_desc:0 "Nuestras nuevas políticas y reformas han demostrado ser exitosas en el sector de consumo de nuestra industria, permitiendo que la población siga satisfecha incluso con un menor número de fábricas dedicadas a los bienes de consumo".
 ARG_modernize_construction_companies:0 "Empresas de construcción modernizadas"
 ARG_modernize_construction_companies_desc:0 "La modernización de nuestras empresas de construcción nos ha permitido obtener una ventaja a la hora de construir nuevas fábricas y expandir nuestra industria".
 ARG_attracted_foreign_investment:0 "Atracción de la inversión extranjera"
 ARG_attracted_foreign_investment_desc:0 "Gracias a nuestros recientes esfuerzos para atraer a los inversores extranjeros, nuestro mercado comercial se ha expandido dramáticamente así como nuestra economía".
 ARG_open_our_borders:0 "Abrimos nuestras fronteras"
 ARG_open_our_borders_desc:0 "Gracias a la apertura de nuestras fronteras, nuevas personas de todo el mundo están llegando a Argentina para llamar a su nuevo hogar."
 ARG_the_liberal_war_machine:0 "La máquina de guerra liberal"
 ARG_the_liberal_war_machine_desc:0 "Con el mundo ardiendo a nuestro alrededor, es hora de que construyamos nuestra industria militar para competir en el escenario global."
 ARG_the_liberal_war_machine_2:0 "La máquina de guerra liberal"
 ARG_the_liberal_war_machine_2_desc:0 "Con el mundo ardiendo a nuestro alrededor, es hora de que construyamos nuestra industria militar para competir en el escenario global."
 ARG_reformed_parliament:0 "El Parlamento reformado"
 ARG_reformed_parliament_desc:0 "Una serie de reformas más tarde y el parlamento está ahora mucho mejor organizado que antes."
 ARG_workers_in_parliament:0 "Trabajadores en el Parlamento"
 ARG_workers_in_parliament_desc:0 "Teniendo trabajadores duros, los trabajadores de clase media en el parlamento se asegurarán de que la clase trabajadora obtenga los mejores beneficios y reformas. Después de todo, un trabajador entiende a otro trabajador".
 ARG_federalized_society:0 "Sociedad Federalizada"
 ARG_federalized_society_desc:0 "Federalizar la economía ha traído muchos beneficios a nuestra economía, sin tener que comerciar con ninguno de nuestros valiosos recursos".
 ARG_recently_subsidized_industry:0 "Industrias clave recientemente subvencionadas"
