 EUYL_crippled_army:0 "Ejército Desmoralizado"
 EUYL_crippled_army_desc:0 "Nuestro ejército simplemente no puede continuar con esta guerra. Está quemando a nuestros soldados y la gente está abrumadoramente en contra de esta guerra. Como si no fuera suficientemente malo, muchos de nuestros soldados están abandonando el frente. Necesitamos detener esta guerra antes de que esto se salga de control".
