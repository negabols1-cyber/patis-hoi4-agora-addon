 PAR_political_instability:0 "Inestabilidad política"
 PAR_political_instability_desc:0 "El espectro político en Paraguay ha estado en ruinas desde la conclusión de la guerra del Chaco. Los militares se han estado agitando cada vez más por las reformas y políticas del actual presidente, y probablemente continuarán haciéndolo si Considero que el presidente actual no está a la altura. Necesitamos mantener a los militares bajo control para asegurarnos de que no se entrometan más en nuestra política. \n\n§RMientras este espíritu nacional esté activo, habrá un equilibrio. de poder entre los militares y el actual presidente, y esto siempre empujará el equilibrio de poder hacia los militares paraguayos.§!"
