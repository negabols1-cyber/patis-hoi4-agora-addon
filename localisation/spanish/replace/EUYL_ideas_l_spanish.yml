 URG_welfare_state1:0 "Estado de bienestar reformado"
 URG_welfare_state1_desc:0 "El sistema actual, que se remonta a la segunda presidencia de José Batlle y Ordóñez, incluye beneficios completos de desempleo y pensiones para ancianos y discapacitados. Las reformas recientes han eliminado algunos beneficios menores, lo que ha liberado parte del presupuesto para otros asuntos mientras aún manteniendo una buena opinión de los programas del Estado”.
 URG_welfare_state2:0 "Estado de bienestar reformado"
 URG_welfare_state2_desc:0 "El sistema actual, que se remonta a la segunda presidencia de José Batlle y Ordóñez, incluye beneficios completos de desempleo y pensiones para los adultos mayores. Las reformas recientes han eliminado algunos beneficios, lo que ha liberado parte del presupuesto para otros asuntos. Esto ha cantidad de personas decepcionadas con nuestro gobierno, pero la mayoría de la población aún apoya los programas".
 URG_welfare_state3:0 "Estado de bienestar reformado"
 URG_welfare_state3_desc:0 "El sistema actual, que se remonta a la segunda presidencia de José Batlle y Ordóñez, incluye beneficios de desempleo completos. Las reformas recientes han eliminado la mayoría de los beneficios, lo que ha liberado gran parte del presupuesto para otros asuntos. La gente está algo desilusionada con nuestro gobierno por nuestra decisiones sobre los programas de bienestar, pero aún obtiene el apoyo de parte de la población que los necesita".
 URG_welfare_state4:0 "Reacción política negativa"
 URG_welfare_state4_desc:0 "La abolición del estado de bienestar ha generado una fuerte reacción política de todos los partidos de la nación, pero especialmente del sector batllista del Partido Colorado y de los socialistas. Los batllistas lo ven como una traición al legado de Batlle, que tanto luchó poner fin a las guerras civiles y traer prosperidad a la nación, mientras que los socialistas lo ven como un ataque a la clase trabajadora".
