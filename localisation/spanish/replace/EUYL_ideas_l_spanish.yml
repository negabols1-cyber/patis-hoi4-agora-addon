 south_american_armament_desc:0 "Las amenazas se ciernen a nuestro alrededor, y nuestro ejército no está preparado para hacer frente a esas amenazas. Tenemos que empezar a Fortalecer nuestro ejército y permitirle alcanzar un estado en el que podamos defendernos bien y verdaderamente de cualquier amenaza extranjera, o derrotar a cualquier nación que consideremos una amenaza. Una vez que nuestro ejército alcance ese estado, ¡nadie nos hará frente!"
