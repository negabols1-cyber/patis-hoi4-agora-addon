 BOL_went_against_the_civilians_name_desc:0 "La elección de ponerse del lado de las Fuerzas Armadas ha provocado la ira de nuestros civiles. Aunque nuestro gobierno es ahora una junta cívico-militar, el lado civil no está realmente de nuestro lado."
