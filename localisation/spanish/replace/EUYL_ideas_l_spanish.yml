 PRU_mixed_republic:0 "República mixta"
 PRU_mixed_republic_2:0 "República mixta"
 PRU_what_is_our_nation:0 "¿Qué es nuestra nación?" 
 PRU_naval_democratic_loyalties:0 "Sentimientos occidentales en la Armada"
 PRU_naval_democratic_loyalties_desc:0 "Nuestra pequeña armada ha recibido entrenamiento de los Estados Unidos, debido a esto, muchos en la armada tienen sentimientos muy democráticos y pro-occidentales."
 PRU_naval_democratic_loyalties_2:0 "Sentimientos occidentales en la Armada" 
 PRU_naval_democratic_loyalties_2_desc:0 "Nuestra creciente armada ha obtenido un amplio entrenamiento de los Estados Unidos, debido a esto, muchos en la armada tienen sentimientos muy democráticos y pro-occidentales."
 PRU_naval_fascist_loyalties:0 "Sentencias fascistas en la Armada"
 PRU_naval_fascist_loyalties_desc:0 "Viendo el éxito de los submarinos alemanes y la fuerza naval japonesa en Asia. Hemos optado por recibir nuestra formación naval por parte de Japón. Una consecuencia de esto es que muchos en la marina creen y simpatizan con las creencias fascistas."
 PRU_pathetic_navy:0 "Armada diezmada"
 PRU_pathetic_navy_desc:0 "Nuestra armada ha sido diezmada en la Guerra del Pacífico por esos belicistas de Chile y ha quedado destruida desde entonces. ¿Conseguirá nuestra armada volver a ser gloriosa?"
 PRU_conflicting_army_navy_loyalties:0 "Sentimientos enfrentados entre el Ejército y la Marina"
 PRU_conflicting_army_navy_loyalties_desc:0 "Los sentimientos enfrentados entre nuestra armada y nuestro ejército han hecho que se forme un amargo odio entre ambos... 
 PRU_improper_air_force:0 "Fuerza aérea desorganizada"
 PRU_improper_air_force_2:0 "Fuerza aérea no organizada"
 PRU_improper_air_force_desc:0 "Actualmente, nuestra fuerza aérea es una colección suelta de divisiones de aviación de nuestra marina y ejército. Debido a esto está muy mal organizada..."
 PRU_improper_air_force_2_desc:0 "Incluso con el fortalecimiento de la fuerza aérea, todavía está plagada de muchos problemas debido a su forma desorganizada." 
 PRU_divided_navy:0 "Sentimientos navales divididos"
 PRU_divided_navy_desc:0 "El aumento de los sentimientos fascistas en nuestra marina ha provocado que muchos de los que aún se aferran a los sentimientos occidentales en la marina tengan una fuerte aversión a los que se oponen a sus ideales. Con el tiempo se irán superando..."
 PRU_divided_army:0 "Sentimientos del ejército divididos"
 PRU_divided_army_desc:0 "El creciente poderío alemán ha provocado que muchos con creencias de extrema derecha en nuestro ejército se unan en una gran facción en nuestras fuerzas armadas. Esta facción está empezando a chocar con las grandes facciones pro-occidentales de nuestro ejército y está empezando a pasar factura al ejército..."
 PRU_pro_west_army:0 "Sentimientos occidentales en el ejército"
 PRU_pro_west_army_desc:0 "¡Las facciones pro-occidentales en nuestro ejército han reinado con nuestra nueva cooperación militar con Francia, haciendo que esas facciones de extrema derecha se disipen!"
 PRU_pro_fascist_army:0 "Sentimientos fascistas en el ejército"
 PRU_pro_fascist_army_desc:0 "Las facciones de extrema derecha de nuestro ejército han reinado y aplastado a todas las facciones pro-occidentales de nuestro ejército. Nuestro ejército está unido una vez más..."
 PRU_strength_in_our_guns_idea:0 "La fuerza en nuestras armas"
 PRU_strength_in_our_guns_idea_desc:0 "Nuestros hombres son preciados y escasos, por lo que debemos asegurarnos de que nuestras pérdidas se compongan de bajas."
 PRU_strength_in_our_minds_idea:0 "Fuerza en nuestras mentes"
 PRU_strength_in_our_minds_idea_desc:0 "Superando a nuestros enemigos, podemos asegurar una rápida victoria".
 PRU_strengthened_currency:0 "Moneda Poderosa"
 PRU_strengthened_currency_desc:0 "Ahora que tenemos una moneda fuerte, ningun problema economico nos va a parar."
 PRU_industrial_expand:0 "Expnasión Industrial"
 PRU_rebelling_navy:0 "Armada rebelde"
 PRU_rebelling_navy_desc:0 "Los demócratas de nuestra Armada se están rebelando debido a la cooperación con los fascistas. Nos costará bastante calmarlos, pero podemos y acabaremos haciéndolo."
 PRU_rebelling_army:0 "Ejército rebelde"
 PRU_rebelling_army_desc:0 "Los fascistas del Ejército están muy descontentos con nuestra reciente cooperación con Occidente y se están rebelando. Nos costará bastante calmarlos, pero podemos y eventualmente lo lograremos."
 PRU_democracia_social_idea:0 "La socialdemocracia"
 PRU_the_teachings_of_karl_marx:0 "Las enseñanzas de Karl Marx"
 PRU_if_they_accept_then_war:0 "\n§RSi Bolivia acepta, en el momento en que declare la guerra a Chile, Bolivia intervendrá y le ayudará. Sin embargo, esto es RIESGO, ya que puede provocar que las naciones circundantes ayuden a los chilenos§!"
