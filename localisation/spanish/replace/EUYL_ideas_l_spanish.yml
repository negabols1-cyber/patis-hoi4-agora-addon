 EUYL_south_american_dreadnought_race_idea:0 "Carrera armamentística naval sudamericana"
 EUYL_south_american_dreadnought_race:0 "Carrera armamentística naval sudamericana"
 EUYL_dreadnought_race_tt:0 "\n§LLa carrera armamentística naval sudamericana fue una carrera de acorazados que comenzó a fines del siglo XIX e involucra a los países sudamericanos más ricos y poderosos: Argentina, Chile y Brasil. Los tres países han estado compitiendo navalmente en el pasado 4 décadas ahora, y si alguno de los tres hace un gran avance naval, los otros 2 seguramente lo alcanzarán rápidamente.§!\n\n"
