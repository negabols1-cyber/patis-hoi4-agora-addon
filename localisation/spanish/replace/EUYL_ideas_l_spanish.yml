 ARG_accepted_debt_repayment:0 "Pago de la deuda"
 ARG_accepted_debt_repayment_desc:0 "La demanda que se presentó contra nosotros parece bastante sombría. Esperábamos que la Asamblea Legislativa nos protegiera y se diera cuenta de la inocencia de nuestro gobierno, sin embargo, eso estaba lejos del caso. Ahora tenemos que pagar la deuda, lo que nos hará retroceder temporalmente."
 ARG_accepted_debt_repayments_6:0 "Deuda totalmente Pagada" 
 ARG_accepted_debt_repayments_6_desc:0 "La demanda que se nos presentó ha sido pagada en su totalidad. Ya no tenemos que preocuparnos por eso".
 ARG_shadow_of_peron_ramon:0 "Sombra de Perón"
 ARG_shadow_of_peron_ramon_desc:0 "Siendo una ideología fresca y nueva, en la mente de muchos argentinos el peronismo es visto como una gracia salvadora para nuestra caída económica y no importa qué gobierno se ponga en el poder, el pueblo siempre se acercará más y más a Perón y su ideología".
