 CHL_prussian_military_traditions_desc:0 "La influencia alemana en Chile ha sido muy fuerte desde el siglo XIX, y la influencia de Prusia en particular ha sido muy fuerte. La influencia prusiana se puede ver en nuestra doctrina militar, que se basa en la doctrina prusiana. Esta doctrina nos ha servido bien en el pasado, y esperamos que nos sirva bien en el futuro."

 ### PAR ###
 PAR_worn_out_army:0 "Ejército desgastado"
 PAR_worn_out_army_desc:0 "Acabamos de salir de una sangrienta guerra de tres años contra Bolivia, así que aunque salimos victoriosos, nuestros ejércitos están agotados."
