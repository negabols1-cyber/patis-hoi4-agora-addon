 PRU_recently_switched_economy:0 "Recién cambiada nuestra economía"
 PRU_recently_switched_economy_desc:0 "Nuestra economía ha pasado de ser industrial a ser más agrícola, y eso está repercutiendo en nuestra capacidad industrial."
