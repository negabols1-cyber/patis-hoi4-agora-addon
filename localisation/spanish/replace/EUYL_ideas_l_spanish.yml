 ARG_infantry_production:0 "Producción de equipos de infantería"
 ARG_infantry_production_desc:0 "Gracias a nuestros esfuerzos, ahora podemos producir equipo de infantería a un precio más barato y de forma más eficiente".
 ARG_drift_back_towards_the_confederation_idea:0 "Regrese hacia la Confederación"
 ARG_drift_back_towards_the_confederation_idea_desc:0 "La población se está despertando a sí misma. Cuando llegue el momento, atacaremos!"
 ARG_death_to_the_Unitarios:0 "Muerte a los Unitarios"
 ARG_death_to_the_Unitarios_desc:0 "¡Abajo los Unitarios! ¡Preferimos morir que renunciar a nuestro destino!"
 ARG_death_to_the_Federales:0 "Muerte a los Federales"
 ARG_death_to_the_Federales_desc:0 "¡Abajo los Federales! ¡No dejaremos que nuestro país sea tomado por estos traficantes de guerra!"
 ARG_viva_la_confederacion:0 "Viva la confederación"
 ARG_viva_la_confederacion_desc:0 "Somos la gracia salvadora de Argentina, somos lo que hará avanzar al país y lo convertirá en una potencia regional y tal vez incluso superpotencia, somos grandes. Viva la confederación!"
 ARG_viva_la_confederacion_2:0 "Viva La Confederacion"
 ARG_viva_la_confederacion_2_desc:0 "Somos la gracia salvadora de Argentina, somos lo que hará avanzar al país y lo convertirá en una potencia regional y tal vez incluso superpotencia, somos grandes. Viva la confederación!"
 ARG_viva_la_confederacion_3:0 "Viva La Confederacion"
 ARG_viva_la_confederacion_3_desc:0 "Somos la gracia salvadora de Argentina, somos lo que hará avanzar al país y lo convertirá en una potencia regional y tal vez incluso superpotencia, somos grandes. Viva la confederación!"
 ARG_viva_la_confederacion_4:0 "Viva La Confederacion"
 ARG_viva_la_confederacion_4_desc:0 "Somos la gracia salvadora de Argentina, somos lo que hará avanzar al país y lo convertirá en una potencia regional y tal vez incluso superpotencia, somos grandes. Viva la confederación!"
