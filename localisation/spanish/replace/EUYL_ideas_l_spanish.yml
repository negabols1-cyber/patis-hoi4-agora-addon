 ARG_servicio_militar_obligatorio_desc:0 "§REl Servicio Militar Obligatorio se cancelará si tenes un gobierno Democratico, Servicio Obligatorio o una ley de reclutamiento mas estricta, o si lo paras manualmente!§!"
