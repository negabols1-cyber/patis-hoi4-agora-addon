 BOL_taking_antofagasta:0 "Toma de Antofagasta"
 BOL_taking_antofagasta_desc:0 "Es hora de hacer los preparativos para tomar Antofagasta. Si todo va bien, podríamos incluso tomarla sin resistencia. Antofagasta era nuestra, y en realidad debería ser nuestra. No permitiremos que los chilenos sigan bloqueando nuestro acceso al mar".
