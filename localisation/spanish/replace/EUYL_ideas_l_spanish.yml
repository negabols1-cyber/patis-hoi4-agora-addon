 BRA_scars_of_the_1930_revolution:0 "Cicatrices de la revolución de 1930"
 BRA_scars_of_the_1930_revolution_desc:0 "La Revolución de 1930 está todavía en la memoria muy reciente de la mayoría de los brasileños. La sangre y el caos político que surgió de ella no se olvidarán tan rápido y nuestro pueblo sigue cansado de que ocurra algo similar.\n\n§RSi declaras la guerra a un país extranjero mientras tienes este espíritu nacional, se desencadenará una guerra civil!§!"
