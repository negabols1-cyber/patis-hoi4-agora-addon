 PRU_rebelling_natives_desc:0 "Nuestro cambio de Perú a nuestro antiguo y glorioso imperio requerirá algo de ayuda del pueblo y del gobierno. Nos aseguraremos de que nuestra rebelión se extienda por todos los nativos del país y de que se den cuenta de la basura que son los 'europeos'. No tienen derecho a estar en nuestra tierra y pagarán, pagarán por su genocidio, su colonialización, su violación de nuestro pueblo. PAGARÁN".
