 PRU_preparing_for_the_worst:0 "Prepararse para lo peor"
 PRU_preparing_for_the_worst_desc:0 "A medida que las naciones del mundo vuelven a su pasatiempo favorito de matarse unos a otros, debemos asegurarnos de no ser las víctimas de estos conflictos."
 PRU_pokimane_fart:0 "Rescates para la economía"
 PRU_continuing_the_gold_standard:0 "Uso del patrón oro"
 PRU_continuing_the_gold_standard_desc:0 "Cuando Edwin Kemmerer nos visitó para ayudar con nuestra economía en 1931, nos aconsejó cambiar nuestra moneda al patrón oro. Desde entonces hemos seguido su consejo, pero quizá deberíamos cambiarlo".
 PRU_continuing_the_gold_standard_2:0 "Continuación del patrón oro"
 PRU_continuing_the_gold_standard_2_desc:0 "Cuando Edwin Kemmerer nos visitó para ayudarnos con nuestra economía en 1931, nos aconsejó cambiar nuestra moneda al patrón oro. Sabemos que abandonar este patrón y cambiar a una moneda fiduciaria supondría una catástrofe, por lo que hemos decidido que debemos seguir utilizando el patrón oro." 
 PRU_fiat_currency_instability:0 "Moneda inestable"
 PRU_fiat_currency_instability_desc:0 "Nuestra moneda inestable ha hecho que muchos inversores, acreedores y naciones no estén seguros de si comerciar con nosotros es una buena idea. Esto está afectando enormemente a nuestra economía y debemos encontrar una forma de solucionarlo rápidamente..."
 PRU_bedrock_of_sa:0 "La base económica de Sudamérica"
 PRU_bedrock_of_sa_desc:0 "¡Lo hemos conseguido! ¡Nuestra moneda se ha estabilizado y lo hemos hecho sin la guía de Estados Unidos! Esta estabilización ha hecho que muchos inversionistas extranjeros y demás reanuden sus negocios aquí haciendo que nuestra economía se recupere. Arriba, arriba, arriba el Perú!"
 PRU_investing:0 "Pequeña inversión en el Perú"
