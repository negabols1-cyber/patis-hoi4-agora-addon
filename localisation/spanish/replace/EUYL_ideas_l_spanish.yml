 BOL_disband_the_army_idea_desc:0 "Nuestras Fuerzas Armadas han sido oficialmente disueltas y ya no tenemos un verdadero ejército. Aunque el peligro de la guerra civil nos obligó a hacerlo, aún se desconoce el efecto que esto tendrá en nuestro ejército."
