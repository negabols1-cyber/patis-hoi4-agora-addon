 FRA_no_moderator_nuke_desc:0 "Placed at the heart of a nuclear reactor, the moderator is the substance that slows down the neutrons without absorbing them, thus allowing an efficient nuclear chain reaction. Our main candidate for this role is heavy water, but we have no stocks at our disposal."
