l_english:
 french_beginning_focus:0 "French Focus Tree"
 french_bonapartist_focus:0 "Bonapartist French Focus Tree"
 french_royalist_focus:0 "Royalist French Focus Tree"
 french_communist_focus:0 "Communist French Focus Tree"
 french_democratic_focus:0 "Democratic French Focus Tree"
 UFRA_sncf:0 "SNCF"
 UFRA_sncf_desc:0 "The nationalisation of France's main railway companies led to the creation of the National Railway Society. This will greatly improve transportation, both for civilian and military purposes."
 UFRA_sahara_census:0 "The Sahara Census"
 UFRA_sahara_census_desc:0 "USELESS FOR NOW ! DO NOT TAKE ! Our vast African territories are full of ressources and manpower. But the sad reality is that not all our saharian territories are well known. It is time to send teams to map and get information from the heart of the desert."
 UFRA_gerboise_bleue:0 "Gerboise Bleue"
 UFRA_gerboise_bleue_desc:0 "Initial tests in nuclear science has shown promising results. Harnessing its power can give us a weapon unlike anything mankind has seen."
 UFRA_vienot_agreements:0  "The Vienot Agreements"
 UFRA_vienot_agreements_desc:0  "It is time for Syrian and Lebanese people to get their freedom. France will invite representatives of the Syrian people to independence negotiations in Paris."
 UFRA_social_nationalism:0 "Corporatism"
 UFRA_social_nationalism_desc:0 "We will organise the French society by corporate groups, such as agricultural, labour, military, scientific, or guild associations, on the basis of their common interests."
 UFRA_decentralize_the_state:0 "Decentralize the State"
 UFRA_decentralize_the_state_desc:0 "French bureaucratie is convoluted, inefficient and overall costly. It is also detrimental to regions and their identities. It must be reverted."
 UFRA_state_catholism:0 "Eldest Daughter of the Church"
 UFRA_state_catholism_desc:0 "France has been called the Eldest Daughter by the pope, but the Revolution destoyed all that we held dear. As the old French Kings and Crusaders, we will once again make France a holy land! Sacré-Coeur de Jésus, soyez l'espoir et le salut de la France!"
 UFRA_camelots_du_roi:0 "Camelots du Roy"
 UFRA_camelots_du_roi_desc:0 "The King's Camelots is the youth organization of the Action Française. They will now become France's best and official youth organization! Long live the Camelots du Roy, to serve France and the King is their motto!"
 UFRA_operation_clovis:0 "Opération Clovis"
 UFRA_operation_clovis_desc:0 "Clovis, the First King of France, had his kingdom origin in today's Belgium. Those are our natural borders, and we shall reclaim them !"
 UFRA_up_with_jean_darc:0 "Tear Down Republicans Symbols"
 UFRA_up_with_jean_darc_desc:0 "It is time to give the final blow to the Republic. Liberté, Egalité, Fraternité is a lie and shall go down as such!"
 UFRA_code_civil:0 "Reinforce our World Presence"
 UFRA_code_civil_desc:0 "The Napoleonic Code , officially Civil Code of the French is the French civil code established under the French Consulate in 1804 and still in force. We will create a new Code Civil establishing that the Third French Empire will be ruled by referendums."
 UFRA_meritocracy:0 "Meritocracy"
 UFRA_meritocracy_desc:0 "Napoleon's regime, like his ancestors, shall be one of merit. A butcher son will be able to be Marshall of the Empire if he deserves it !"
 UFRA_militarist_society:0 "Militarist Society"
 UFRA_militarist_society_desc:0 "Our neighbours are ambitious and aggressive. We must adopt a more militarist way of life to protect ourselves and our way of life. Glory to the Army !"
 UFRA_continental_system:0 "Continental Sytem"
 UFRA_continental_system_desc:0 ""
 UFRA_return_to_iberia:0 "Subdue Iberia"
 UFRA_return_to_iberia_desc:0 "Napoleon failed to secure Iberia once, but now the peninsula is in shambles. Our time is now."
 UFRA_save_quebec:0 "Save Quebec"
 UFRA_save_quebec_desc:0 ""
 UFRA_medium_tanks:0 "Update the Renault D1"
 UFRA_return_to_italy:0 "The Italian Question"
 UFRA_return_to_italy_desc:0 ""
 UFRA_form_the_milice:0 "Army of Occupation"
 UFRA_form_the_milice_desc:0 "We must create an institution capable of occupying our future conquests, and to bring peace to our society. We will create 'La Milice Française', the French Milicia, a political paramilitary organization."
 UFRA_chantiers_jeunesse:0 "Youth Works"
 UFRA_chantiers_jeunesse_desc:0 "The Chantiers de la jeunesse française, will be a youth organization, not unlike scoutism, to form and help boster young nationalism."
 UFRA_industrialists_alliance:0 "Alliance with Industrialists"
 UFRA_industrialists_alliance_desc:0 "Numerous industrial families hold the same ideals as us, and supported our cause. LOréal, Lessieur... Such connections will be essentials to build the New France!"
 UFRA_stop_moral_decay:0 "Stop Moral Decay"
 UFRA_stop_moral_decay_desc:0 "It is time to cut the roots of the problem, and destroy moral decay once and for all. For that we will have to make a choice..."
 UFRA_furia_francese:0 "Furia Francese"
 UFRA_furia_francese_desc:0 "In 1495, the Italians, at the battle of Fornoue, described French courage and determination as Furia Francese, the French Fury. It is time for the French people to regain this fury and to unleash it on their enemies!"
 UFRA_update_weaponry:0 "Update Weaponry"
 UFRA_update_weaponry_desc:0 "Weaponry innovations are going fast this days. We have to work hard to keep our guns to the current level of development."
 UFRA_improve_motor_industry:0 "Improve the Motor Industry"
 UFRA_improve_motor_industry_desc:0 "Motorisation is the future of warfare. It is about time we unsure French Army is not left in the past!"
 UFRA_commit_air_industry:0 "Commit the Air Industry"
 UFRA_commit_air_industry_desc:0 "The mastery of the air is now a key to winning. We need to increase our investments to air companies!"
 UFRA_further_armament_program:0 "Further Armament Program"
 UFRA_further_armament_program_desc:0 "Modern warfare can only be done with modern tools. You are only as good as your tools, isn't it ?"
 UFRA_decolonization:0 "Decolonization"
 UFRA_decolonization_desc:0 "It is time for us to let other countries rule themselves. Everyone deserve the right to self-rule. It is the end of the French Colonial Empire."
 UFRA_transaharien:0 "The Trans-Saharien"
 UFRA_transaharien_desc:0 "The Trans-Saharan Railway is a project to build a rail line south through Algeria to sub-Saharan Africa. Its a way to connect coal mines and boost trade throughout North Africa, tie together the French Empire, and connect North Africa to sub-Saharan Africa."
 UFRA_syria_oil:0 "Syrian Oil"
 UFRA_syria_oil_desc:0 "Fuel. It is fuel that France desperately needs. Thankfully, our protectorate of Syria has plenty of oil."
 UFRA_indochina_mines:0 "Indochina Mines"
 UFRA_indochina_mines_desc:0 "The perl of the French Empire, Indochina. It is full of riches only waiting for us to take it."
 UFRA_excolonies_invest:0 "Invest in our new Allies"
 UFRA_excolonies_invest_desc:0 ""
 UFRA_secure_contracts:0 "Secure contracts"
 UFRA_secure_contracts_desc:0 "Our privileged relationship with our old colonies is a great advantage to secure ressources contracts from them."
 UFRA_excolonies_rd:0 "Knowledge sharing"
 UFRA_excolonies_rd_desc:0 "To unsure an equal development with our allies, we will share with them technologies and create a research center to exchange knowledge."
 UFRA_strenghten_foreign_legion:0 "Strengthen the Foreign Legion"
 UFRA_strenghten_foreign_legion_desc:0 "The Foreign Legion is an elite force, with men from all countries proud to serve France. It needs to be expended and promoted."
 UFRA_secret_services:0 "Renseignement Généraux"
 UFRA_secret_services_desc:0 "Knowledge is power. As such, we need to organise our intelligence service into an official entity."
 UFRA_integrate_rhine_borders:0 "Integrate Rhine Borders"
 UFRA_integrate_rhine_borders_desc:0 "The natural borders of France are a political and geographic theory developed in France, notably during the French Revolution. They correspond to the Rhine, the Atlantic Ocean and Mediterranean Sea, the Pyrenees and the Alps, according to the revolutionaries."
 UFRA_paneuropanism:0 "Paneuropeanism"
 UFRA_paneuropanism_desc:0 "After centuries of war and suffering, maybe European countries should realise they share so much. Isn't it the natural evolution to have an culturally and geopolitically united Europe?"
 UFRA_charlemagne_claims:0 "Charlemagne Claims"
 UFRA_charlemagne_claims_desc:0 "Charlemagne Claims"
 UFRA_roman_claims:0 "Roman Claims"
 UFRA_roman_claims_desc:0 "Who would have known ? That Gallia, France, the personal conquest of Caesar, would one day be the one to try to reclaim the Roman Empire ! Yet, the day has come!"
 UFRA_attack_the_slavs:0 "Strike to the East"
 UFRA_attack_the_slavs_desc:0 "Strike to the East"
 UFRA_empire_from_west_to_east:0 "From Atlantic to the Ourals"
 UFRA_empire_from_west_to_east_desc:0 "From the Atlantic to the Ourals"
 UFRA_transeuropean:0 "The Trans-European"
 UFRA_transeuropean_desc:0 "The Trans-European"
 UFRA_the_capital:0 "Move the capital"
 UFRA_the_capital_desc:0 "Now that we united Europe, maybe it is time to find a new capital ?"
 UFRA_lingua_franka:0 "Lingua Franka"
 UFRA_lingua_franka_desc:0 "French was once the language of power and diplomacy. With Europe in our grasp, it can become just that once again. Through schooling and propaganda, French language shall be taught to every new European citizen!"
 UFRA_air_focus:0 "Armée de l'Air"
 UFRA_ideological_fanaticism:0 "Political Education"
 UFRA_ideological_fanaticism_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
 UFRA_reinforce_la_royale:0 "Reinforce La Royale"
 UFRA_reinforce_la_royale_desc:0 "The French Navy, called also La Royale, has some catching to do if it wants to challenge the Royal Navy or the Regia Marina. We need to increase our ship production quickly through hard work and discipline!"
 UFRA_foundations_for_a_european_union:0 "Toward an European Union"
 UFRA_foundations_for_a_european_union_desc:0 "Now that the fascist threat has been eradicated in Europe, it is time to re-build and think about peace. Maybe it is time for the dream of an European alliance to come true ?"
 UFRA_community_for_coal_and_steel:0 "European Coal and Steel Community"
 UFRA_community_for_coal_and_steel_desc:0 "First goal of our union will be to facilitate reconstruction, exchange and commerce between our countries. Peace will be built on a strong economy!"
 UFRA_european_investments:0 "European Investments"
 UFRA_european_investments_desc:0 "Some countries have more difficulties than other, some need to reconstruct. As such, a central bank and central investments are necessary."
 UFRA_cern:0 "CERN"
 UFRA_cern_desc:0 "The European Center for Nuclear Research will look into the secrets of the universe with the brightest mind of every country!"
 UFRA_pool_technical_know_how:0 "European Technical Know-How"
 UFRA_pool_technical_know_how_desc:0 "Each country in our union has a specialty. Regrouping those will give us an amazing edge compared to the world."
 UFRA_the_euro_money:0 "The Euro"
 UFRA_the_euro_money_desc:0 "To facilitate exchanges and cooperation, a unique money needs to be created."
 UFRA_fondation_for_european_army:0 "Foundation of an European Army"
 UFRA_fondation_for_european_army_desc:0 "Some countries are not open to an European Army, but maybe we can already share trainings and strategies."
 UFRA_european_navy_regulations:0 "European Navy Standards"
 UFRA_european_navy_regulations_desc:0 "For European Navies to work together efficiently, it is necessary to regulate and standardise material and trainings."
 UFRA_european_federal_state:0 "European Federal State"
 UFRA_european_federal_state_desc:0 "Let us unite Europe under one global power, an European Federal State!"
 UFRA_communal_army:0 "A Communal Army"
 UFRA_communal_army_desc:0 "Frères aux Armes, pour notre lutte! Pour la victoire de tous les travailleurs!"
 UFRA_regiment_normandie:0 "Le Regiment Normandie"
 UFRA_regiment_normandie_desc:0 "Le Regiment Normandie"
 UFRA_political_commissars:0 "Political Commissars"
 UFRA_political_commissars_desc:0 "Political Commissars"
 UFRA_state_atheism:0 "State Atheism"
 UFRA_state_atheism_desc:0 "No God, No Masters. It is only up to humankind to find happiness and help each other. No cult shall ever rule France ever again!"
 UFRA_further_dockyard_expension:0 "Further Dockyard Expansion"
 UFRA_further_dockyard_expension_desc:0 "Further Dockyard Expansion"
 UFRA_operation_guillaume_le_conquerant:0 "Operation Guillaume Le Conquerant"
 UFRA_operation_guillaume_le_conquerant_desc:0 "Operation Guillaume Le Conquerant"
 UFRA_war_games:0 "War Games"
 UFRA_war_games_desc:0 "The Germans are re-mobilizing and violating the Treaty of Versailles. It is time to prepare for what is coming! Military manoeuvers will be conducted on German and Belgian borders!"
 UFRA_ils_ne_passeront_pas:0 "Ils Ne Passeront Pas"
 UFRA_ils_ne_passeront_pas_desc:0 "Ils ne passeront pas was the rallying cry of Verdun. We stopped the invader a first time, we will do it once again!"
 UFRA_rebuild_the_spanish_fleet:0 "Rebuild The Spanish Fleet"
 UFRA_rebuild_the_spanish_fleet_desc:0 "Spain was once the most powerful Empire in the world, and the Spanish fleet a sight to fear! We will rebuild this fleet to its old glory!"
 UFRA_hydroelectricity:0 "Hydroelectricity"
 UFRA_hydroelectricity_desc:0 "Thanks to our many mountain ranges, France is particularly suited to generate electricity using dams. This Hydroelectricity will be useful to us, especially when it is renewable."
 UFRA_heavy_water:0 "Produce Heavy water"
 UFRA_heavy_water_desc:0 "Occurring naturally in water, heavy water can be isolated by electrolysis. It serves the role of moderator in nuclear reactors, and helps in the creation of Plutonium necessary for the manufacture of atomic bombs. Our dams are ideal for this task, as they provide the water and electricity required for electrolysis."
 UFRA_send_aid_to_spain:0 "Send aid to Spain"
 UFRA_send_aid_to_spain_desc:0 "Spain is in dire need of supplies to stop militias and resistances in its territories. We will send help to our sister crown."
 UFRA_assassinate_mussolini:0 "Assassinate Mussolini"
 UFRA_assassinate_mussolini_desc:0 "Mussolini is a madman and a warmonger. What Italy needs is a come-back to the old order. It needs a King."
 UFRA_prepare_italian_coup:0 "Prepare the Italian Coup"
 UFRA_prepare_italian_coup_desc:0 ""
 UFRA_heirs_of_the_french_revolution:0 "Heirs of the French Revolution"
 UFRA_heirs_of_the_french_revolution_desc:0 "No other party can claum to be the heirs of the French Revolution as us. To arms citizen, the day of glory has come!"
 UFRA_jaccobinisme:0 "Jaccobinisme"
 UFRA_jaccobinisme_desc:0 "France is a unique and united Nation. No region shall get special privileges. Unity is our strength."
 UFRA_regionalisme:0 "Regionalisme"
 UFRA_regionalisme_desc:0 "Each region deserves to have its own identity preserved. Each region has the right to take its own decisions. So shall it be in France from now on."
 UFRA_socialist_anti_colonial_commitee:0 "Socialist Anti-Colonial Committee"
 UFRA_socialist_anti_colonial_commitee_desc:0 "Imperialism is a plague that must be eradicated. People have the right to self-rule."
 UFRA_factory_towns:0 "Factory Towns"
 UFRA_factory_towns_desc:0 ""
 UFRA_european_revolution:0 "Liberate our Neighbours"
 UFRA_european_revolution_desc:0 ""
 UFRA_west_european_union_of_socialists_republics:0 "West-European Union of Socialist Republics"
 UFRA_west_european_union_of_socialists_republics_desc:0 "Now that we have achieved the Proletariat Revolution in Europe, we must organise like our Eastern brothers, into an Union of Republics."
 UFRA_marxism_leninism:0 "Marxism-Leninism"
 UFRA_marxism_leninism_desc:0 "We only recognize the truest form of communism. The one that Lenin and Marx theorised."
 UFRA_provide_for_the_people:0 "Provide for the People"
 UFRA_provide_for_the_people_desc:0 ""
 UFRA_syndicalism:0 "Syndicalism"
 UFRA_syndicalism_desc:0 "Syndicalism is a radical economic theory in the labour movement. Its main idea is the establishment of local worker-based organizations and the advancement of the demands and rights of workers through strikes. CGT is the main representation of this movement in France."
 UFRA_collectivization:0 "Collectivization"
 UFRA_collectivization_desc:0 ""
 UFRA_world_revolution:0 "World Revolution"
 UFRA_world_revolution_desc:0 ""
 UFRA_anti_nazi_anti_soviet:0 "Neither Nazi nor Soviet"
 UFRA_anti_nazi_anti_soviet_desc:0 "Soviets or Nazis are both hateful and despicable ideology. France must take the lead of stopping those infections."
 UFRA_croix_de_feux:0 "Croix-De-Feu"
 UFRA_croix_de_feux_desc:0 "The Croix-de-Feu is primarily a group of veterans of the First World War — those who had been awarded the Croix de guerre 1914-1918. Since Lieutenant-Colonel François de La Rocque, took over in 1930, the movement advocate a military effort against the German danger, supporting corporatism and an alliance between Capital and Labour."
 UFRA_latin_heritage:0 "Push Latin Heritage"
 UFRA_latin_heritage_desc:0 "France is first and foremost a latin country. As such we should improve our relations with Italy and Mussolini."
 UFRA_honneur_et_traditions:0 "Honneur et Traditions"
 UFRA_honneur_et_traditions_desc:0 "Honor and traditions, such is our Roman heirloom. These values burn inside the heart of every French man and woman."
 UFRA_german_military_exchange:0 "German Military Exchange"
 UFRA_german_military_exchange_desc:0 "Germany has mastered the art of warfare, they are truly the heirs of the Prussian Kingdom. Together we can learn much and make our armies invicibles."
 UFRA_soviet_industrial_aid:0 "Soviet Industrial Aid"
 UFRA_soviet_industrial_aid_desc:0 ""
 UFRA_second_paris_renovation:0 "Second Paris Renovation"
 UFRA_second_paris_renovation_desc:0 "Our newly secured economic prosperity needs to reflect on our capital. We will make Paris the greatest city of Europe. Such renovations have not been seen since Haussman and Napoleon III."
 UFRA_the_new_worl_order:0 "The New World Order"
 UFRA_the_new_worl_order_desc:0 "With the help of our allies, we have forged a New World. Nothing can stop the new Europe. Vive la France !"
 UFRA_emulate_napoleon_i:0 "Emulate Napoleon I"
 UFRA_emulate_napoleon_i_desc:0 "A Great Empire needs a strong leader. As such, I need to draw inspiration from the greatest French person to have ever lived."
 UFRA_emulate_napoleon_iii:0 "A Liberal Empire"
 UFRA_emulate_napoleon_iii_desc:0 "Such as my august ancestor, Napoleon the Third, I shall be a modern and liberal emperor."
 UFRA_real_politik:0 "Realpolitik"
 UFRA_real_politik_desc:0 "Real Politik"
 UFRA_protect_workers:0 "Protect the Working Class"
 UFRA_protect_workers_desc:0 "Protect the Working Class"
 UFRA_cooperation_with_italy:0 "Cooperation with Italy"
 UFRA_cooperation_with_italy_desc:0 "Cooperation with Italy"
 UFRA_celtic_paganism:0 "Mysticisme"
 UFRA_celtic_paganism_desc:0 "Now that France is under our control, we need to erode the decadence and stop the moral decay. We will be preaching the return to older Gods. To the religion of the Celts, of the Gallic people, our ancestors. Toutatis, Esus and Taranis."
 UFRA_classicism:0 "Classicism"
 UFRA_classicism_desc:0 "Classicism is the most European and most noble form of art that exists. It is inspiring for our population. Our regime will sponsor and encourage Classicism."
 UFRA_state_catholism_2:0 "Get Support from Clergy"
 UFRA_state_catholism_2_desc:0 "Our ideals are deeply Christian, and as such, are shared with much people inside the French Catholic Clergy."
 UFRA_aids_for_families:0 "Aids for Families"
 UFRA_aids_for_families_desc:0 "Families are the ciment of the nation. Aids will ensure strong families and will encourage parents to have more children."
 UFRA_control_newspapers:0 "Control the Newspapers"
 UFRA_control_newspapers_desc:0 "Newspapers in France are degenerates and anti-France, except for a few. From now on, only government  validated journals will be published."
 UFRA_give_full_powers:0 "Give Full Powers"
 UFRA_give_full_powers_desc:0 "The moment is now. It is our only chance to save France. Let us seize it, and seize control!"
 UFRA_new_national_holiday_1:0 "Change the date of the National Day"
 UFRA_new_national_holiday_1_desc:0 ""
 UFRA_new_national_holiday:0 "Change the date of the National Day"
 UFRA_new_national_holiday_desc:0 ""
 UFRA_crush_political_dissent:0 "Crush Political Dissent"
 UFRA_crush_political_dissent_desc:0 "We are in power, but numerous are those that lurk in the shadows, waiting for us to show any form of weakness. We won't give them the chance."
 UFRA_dismiss_af:0 "Dismiss AF"
 UFRA_dismiss_af_desc:0 "While useful, the Action Francaise simply does not have the same objective as us. Our partnership ends here."
 UFRA_work_with_af:0 "Continue AF Collaboration"
 UFRA_work_with_af_desc:0 "Our alliance with the Action Francais was fruitful. Maurras ideas are the way to save France."
 UFRA_royal_dictatorship:0 "Royal Dictatorship"
 UFRA_royal_dictatorship_desc:0 "Royal Dictatorship"
 UFRA_local_democratie:0 "Local Democracy"
 UFRA_local_democratie:0 "Maurras idea is to decentralize the state, let regions work in autonomy with local parliaments, with a benevolent King at the head of state."
 UFRA_king_jean_urbanisation_program:0 "King Jean's Urbanisation Program"
 UFRA_king_jean_urbanisation_program_desc:0 "King Jean's Urbanisation Program"
 UFRA_kings_arsenal:0 "Royal Arsenal"
 UFRA_kings_arsenal_desc:0 "Royal Arsenal"
 UFRA_kings_grant:0 "King's Grant"
 UFRA_kings_grant_desc:0 "King's Grant"
 UFRA_republic_lives:0 "Democracy Prevails"
 UFRA_republic_lives_desc:0 "Democracy Prevails"
 UFRA_economic_policies:0 "Economic Policies"
 UFRA_economic_policies_desc:0 "France needs an economic direction. This is a pivotal time for economy. Our choice will shape our future."
 UFRA_third_position:0 "Third Position"
 UFRA_third_position_desc:0 "Third Position"
 UFRA_left:0 "Socialist Policies"
 UFRA_left_desc:0 "Socialist Policies"
 UFRA_right:0 "Capitalists Policies"
 UFRA_right_desc:0 "Capitalists Policies"
 UFRA_free_market:0 "Free Market"
 UFRA_free_market_desc:0 "Free Market"
 UFRA_economic_freedom:0 "Economic Freedom"
 UFRA_economic_freedom_desc:0 "Economic Freedom"
 UFRA_natural_inequalities:0 "Class Cooperation"
 UFRA_natural_inequalities_desc:0 "Class Cooperation"
 UFRA_open_to_the_world:0 "France Diplomatic Direction"
 UFRA_open_to_the_world_desc:0 "France Diplomatic Direction"
 UFRA_mend_the_christian_schism:0 "Mend the Schism"
 UFRA_mend_the_christian_schism_desc:0 "Since the fall of the Western Roman Empire, Eastern and Western Churches have been in conflict. It is time for healing."
 UFRA_foreign_policy:0 "The Rooster in the World"
 UFRA_foreign_policy_desc:0 "The Rooster in the World"
 UFRA_diplomatic_ussr:0 "Diplomatic Mission to USSR"
 UFRA_diplomatic_ussr_desc:0 "Diplomatic Mission to USSR"
 UFRA_eastern_policy:0 "Eastern Policy"
 UFRA_eastern_policy_desc:0 "France has always been heavily involved in China diplomacy. The eastern Dragon is in shambles and Japan is interested in our Pacific territories. We must act quickly."
 UFRA_support_china:0 "Diplomatic Mission to China"
 UFRA_support_china_desc:0 "Diplomatic Mission to China"
 UFRA_invest_in_china:0 "Invest in China"
 UFRA_invest_in_china_desc:0 "Tchan Kai Shek is the true leader of China, the legitimate one. Therefore we shall focus our policy on helping him."
 UFRA_communist_china:0 "Diplomatic Mission to Communist China"
 UFRA_communist_china_desc:0 "Diplomatic Mission to Communist China"
 UFRA_send_weapons_to_mao:0 "Send weapons to Mao"
 UFRA_send_weapons_to_mao_desc:0 "Betting on the Communists and Mao is a risky bet, but maybe it can pay off."
 UFRA_non_aggression_japan:0 "Diplomatic Mission to Japan"
 UFRA_non_aggression_japan_desc:0 "Diplomatic Mission to Japan"
 UFRA_sign_treaty:0 "Treaty of Nonaggresion with Japan"
 UFRA_sign_treaty_desc:0 "We should prioritise on appeasing Japan and letting them act freely in the Pacific, as long as they keep out of our territories."
 UFRA_invite_to_faction:0 "Further relations"
 UFRA_invite_to_faction_desc:0 "Further relations"
 UFRA_post_war_reconstruction:0 "Post-War Reconstruction"
 UFRA_post_war_reconstruction_desc:0 "Post-War Reconstruction"
 UFRA_future_of_republic:0 "The Future of the Republic"
 UFRA_future_of_republic_desc:0 "The Future of the Republic"
 UFRA_modify_the_constitution:0 "Survival of the IIIrd Republic"
 UFRA_modify_the_constitution_desc:0 "The IIIrd Republic weathered the storm. Our enemies are defeated."
 UFRA_the_fourth_republic:0 "The IVth Republic"
 UFRA_the_fourth_republic_desc:0 "The IIIrd Republic died and it is time to rebuild a new Republic."
 UFRA_degaule_presidency:0 "DeGaulle Presidency"
 UFRA_degaule_presidency_desc:0 "DeGaulle Presidency"
  UFRA_national_television0:0 "Found the ORTF"
 UFRA_national_television0_desc:0 "Having the television channels at our service will allow us to show only what the people need to see"
 UFRA_trial_of_collaborators:0 "Trial of the Collabos"
 UFRA_trial_of_collaborators_desc:0 "The collaborators betrayed the republic and betrayed France. Laval, Pétain, Darnant, Brazillac... We shall make an example of them."
 UFRA_marshall_plan:0 "Marshall Plan"
 UFRA_marshall_plan_desc:0 "Marshall Plan"
 UFRA_gladius:0 "Gladio"
 UFRA_gladius_desc:0 "Operation Gladio is the codename for clandestine "stay-behind" operations of armed resistance that is proposed by the USA, for a potential Warsaw Pact invasion and conquest of Europe."
 UFRA_purge_communist_rot:0 "Purge the Communist Rot"
 UFRA_purge_communist_rot_desc:0 "Purge the Communist Rot"
 UFRA_the_af_wins:0 "Action Francaise Alliance"
 UFRA_the_af_wins_desc:0 "Action Francaise Alliance"
 UFRA_nationalism:0 "Nationalisme Francais"
 UFRA_nationalism_desc:0 "French Nationalism is unique. It was born during the One Hundred War with England, and perfectionned during the Revolution. But it must be adopted in all aspects of life and society, to save France."
 UFRA_the_split_switzerland:0 "Ultimatum to Switzerland"
 UFRA_the_split_switzerland_desc:0 "Switzerland"
 UFRA_parliamentary_republic:0 "Parliamentary Republic"
 UFRA_parliamentary_republic_desc:0 ""
 UFRA_reinforce_presidential_role:0 "Reinforce the Presidential Role"
 UFRA_reinforce_presidential_role_desc:0 ""
 UFRA_devalue_the_franc:0 "Devaluate the Franc"
 UFRA_devalue_the_franc_desc:1 "While other countries allowed their currencies to become less valuable to help their economies, we have steadfastly refused to do so. As a result, our economy is lagging behind others. If we want to become more competitive and weather the coming storm, we must not dismiss a devaluation of our currency out of hand, even if it would prove to be an unpopular measure."
 UFRA_autoroutes:0 "Autoroutes"
 UFRA_autoroutes_desc:0 "The Germans have awed the world with their concept of limited access, high-speed roads connecting the various parts of their country. We can show the world that we can do just as well."
 UFRA_invest_in_the_metropole:1 "Develop the Metropole"
 UFRA_invest_in_the_metropole_desc:0 "Our first step in rebuilding our industries must be to improve our industrial base in our continental holdings."
 UFRA_invest_in_the_colonies:1 "Develop the Colonies"
 UFRA_invest_in_the_colonies_desc:0 "Our industrial heartlands in Europe don't have the population and resources to sustain a large industrial expansion. If our economy is to be competitive with the rest of the world, we must utilize our colonies."
 UFRA_colonial_industry_effect_tt:2 "Adds one §YCivilian Factories§! to every colonial state previously invested in.\n"
 UFRA_industrial_expansion_effect_tt:1 "Adds one §YCivilian Factories§! to metropolitan states previously invested in.\n"
 UFRA_industrial_expansion_effect_alt_tt:0 "Adds two §YCivilian Factories§! to metropolitan states previously invested in.\n"
 UFRA_military_factories_effect_tt:1 "Adds one §YMilitary Factories§! to every state previously invested in.\n"
 french_random_resources_add_tt:0 "Adds one §GResources§! this state."
 UFRA_invest_in_west_africa:0 "Invest In West Africa"
 UFRA_invest_in_west_africa_desc:0 "The vast reserves of workers and resources in western Africa make it a perfect candidate for investment."
 UFRA_invest_in_indochina:0 "Invest In Indochina"
 UFRA_invest_in_indochina_desc:0 "The long distance between our holdings in Indochina and our heartland may seem like a drawback, but it also protects any industry there from enemy attack."
 UFRA_invest_in_syria:0 "Invest In Syria"
 UFRA_invest_in_syria_desc:0 "Syria is perfectly positioned to supply us in case of a war in Europe or Africa. Enhancing its industrial potential will also support our position in the area."
 UFRA_global_integration:0 "Global Integration"
 UFRA_global_integration_desc:0 "The British Empire is a finely-tuned system of mutually supporting parts. There is nothing saying that we can't do just as well with our colonies."
 UFRA_begin_rearmament:0 "Begin Rearmament"
 UFRA_begin_rearmament_desc:1 "The 20-year armistice Marshall Foch predicted in 1919 is rapidly coming to an end, and the world is looking increasingly likely to erupt into war in the next few years. We must be ready."
 UFRA_firepower_kills:0 "Firepower Kills"
 UFRA_firepower_kills_desc:0 "The lessons of the Great War were as simple as they were cruel: the days of men fighting one another over open sights are over. Today, killing is done on a mass scale with the most modern weapons at a long range."
 UFRA_methodical_battle:0 "Methodical Battle"
 UFRA_methodical_battle_desc:0 "Some claim that battle is chaos, but they are fools. A battle is nothing but the methodical application of the right tools based on the overall plan. Plan well, and the enemy's intentions may as well be a historical footnote."
 UFRA_division_cuirassee:0 "Division Cuirassée"
 UFRA_division_cuirassee_desc:0 "An enterprising officer by the name of de Gaulle has proposed a new kind of division, combining heavy armor with infantry and medium tanks to fight as a combined whole."
 UFRA_infantry_tanks:0 "Infantry Tanks"
 UFRA_infantry_tanks_desc:0 "Whatever else, the first and last duty of tanks is to enable infantry to take and hold ground. Therefore, we must always equip our infantry units with modern, capable tanks."
 UFRA_special_forces:0 "Special Forces"
 UFRA_special_forces_desc:0 "In the future, the war will increasingly be fought in areas where the regular infantryman will meet his limit. We must create new and more capable formations that can perform in these conditions."
 UFRA_fusiliers_marine:1 "Fusiliers Marins"
 UFRA_fusiliers_marine_desc:0 "The days of coasts as impenetrable defenses are over. In the future, we must be able to take the fight to the enemy, wherever they may be, and seize a landing ground against any opposition."
 UFRA_battle_of_maneuver:0 "Battle of Maneuver"
 UFRA_battle_of_maneuver_desc:0 "The old notion of a battlefield as a small area in which armies clash is dead. With mass-motorization, airplanes and fast radio communications, battles move fast over hundreds of kilometers. The sooner we prepare for this, the better."
 UFRA_air_dominance:0 "Air Dominance"
 UFRA_air_dominance_desc:0 "The development of the airplane has created a third flank for the army to worry about. We must secure this flank or face catastrophe."
 UFRA_air_ground_cooperation:0 "Air-Ground Cooperation"
 UFRA_air_ground_cooperation_desc:0 "Fighting in the air only ever creates actual military results if it is in pursuit of an objective on the ground. The better we integrate the battle in the air and the battle on the ground, the more effective we become."
 UFRA_flying_artillery:0 "Flying Artillery"
 UFRA_flying_artillery_desc:0 "In the fast-moving battles of today, the slow artillery pieces on the ground might not be able to keep up. Airplanes carrying bombs can take over their role."
 UFRA_radicalise_the_popular_front:0 "Radicalise the Popular Front"
 UFRA_radicalise_the_popular_front_desc:1 "With the rise of fascism in Germany and Italy, it has become clear that the infighting on the left has to stop if our cause is to survive. A broad, popular front made up of all the parties on the left will have the popular mandate to finally address the economic conditions that create fascism."
 UFRA_ban_communism:0 "Ban Communism"
 UFRA_ban_communism_desc:0 "While it is inconceivable that anyone could seriously want to visit the chaos and bloodshed of a communist revolution upon their own fatherland, it appears that there are some amongst us who would do just that. We can not allow them to conspire against the state any longer. The harshest measures must be taken."
 UFRA_invite_communist_ministers:0 "Invite Communist Ministers"
 UFRA_invite_communist_ministers_desc:0 "Fear of backlash from the radical right prevented the inclusion of the communists in the actual government. But fear is a poor adviser. If we must have this clash, let them come."
 UFRA_strengthen_the_unions:0 "Strengthen the Unions"
 UFRA_strengthen_the_unions_desc:0 "For far too long, the individual worker's right to band together with his comrades to bargain collectively has been left open to attack. No more."
 UFRA_celebrate_the_commune:0 "Celebrate the Commune"
 UFRA_celebrate_the_commune_desc:0 "Short-lived though it may have been, the Paris Commune was the first attempt to create a communist society on French soil."
 UFRA_womens_suffrage:0 "Vote for Women"
 UFRA_womens_suffrage_desc:1 "It is as absurd as it is shameful that the hard-working women of France, who time and time again have fought on the barricades to earn their rights, are not permitted to cast their vote in elections. We will eradicate this injustice."
 UFRA_legal_equality:0 "Legal Equality"
 UFRA_legal_equality_desc:0 "In every way that matters, women are still considered second-class citizens, always subject to a man's will. This nonsense ends now."
 UFRA_industrial_collectivization:0 "Industrial Collectivization"
 UFRA_industrial_collectivization_desc:1 "The French economy today consists of tiny companies with few employees, forever competing against each other and sucking up resources in inefficient small-scale production. We will combine these small companies to finally create companies that can compete on the world stage."
 UFRA_agricultural_collectivization:0 "Agricultural Collectivization"
 UFRA_agricultural_collectivization_desc:0 "What applies to industry applies just as much to the farmers all across France. Tiny farms can't afford modern equipment, largely working as their great-grandfathers had. By combining them into agricultural production units, we will increase efficiency and output."
 UFRA_force_the_issue:0 "Force the Issue"
 UFRA_force_the_issue_desc:1 "We have come far since we formed the Popular Front. But we can not leave our work half-done. It is time for everyone on the left to make a choice and take a stand - either with the revolution or against it."
 UFRA_force_the_issue_tt:0 "The stability penalty depends on the popularity of the §YDemocratic§! Parties.\n"
 UFRA_reconciliation:0 "Reconciliation"
 UFRA_reconciliation_desc:0 "In the past, the French revolutions all too often hurled the country into endless spasms of revolutionary and counter-revolutionary terror. Perhaps it is time to build a republic in which everyone has their place, whether they supported the revolution or not."
 UFRA_constitutional_convention:0 "Constitutional Convention"
 UFRA_constitutional_convention_desc:0 "A fundamental shift in the nature of our republic can not be done overnight, and it can not be done without negotiating a new constitution."
 UFRA_anti_fascist_coalition:0 "Anti-Fascist Coalition"
 UFRA_anti_fascist_coalition_desc:0 "The biggest threat to the march of progress is the spread of reactionary fascism. We must stand with every country that is willing to combat this threat, or there will not be a tomorrow for any of us."
 UFRA_invite_anti_fascist_emigrants:0 "Invite Anti-Fascist Immigrants"
 UFRA_invite_anti_fascist_emigrants_desc:1 "The first step every fascist regime takes is to exile its critics and the people who could present an alternative vision of how the country could be organized. However, these people are also perfectly suited to form a government-in-exile to prepare for the day their country is liberated."
 UFRA_reconnect_to_the_balkans:0 "Reconnect To the Balkans"
 UFRA_reconnect_to_the_balkans_desc:0 "France has long sought to counter-balance the powers of central Europe by reaching out to the countries of the Balkans. This connection is still there, even if it has been allowed to lapse more recently."
 UFRA_pre_empt_the_fascist_attack:0 "Pre-Empt the Fascist Attack"
 UFRA_pre_empt_the_fascist_attack_desc:0 "Why should we allow the enemy to prepare in peace and pick the moment that the inevitable attack happens when it best suits them? We will strike first, and crush this threat before it has time to get ready."
 UFRA_loyalty_to_moscow:0 "Loyalty To Moscow"
 UFRA_loyalty_to_moscow_desc:0 "The model of Socialism practiced in the Soviet Union might not be perfect, but it is beyond any reasonable doubt that the Soviet Union has achieved the highest degree of implementation of socialist ideas. We would be fools to try and find our own way."
 UFRA_league_of_french_bolshevist_volunteers:0 "League of French Bolshevists Volunteers"
 UFRA_league_of_french_bolshevist_volunteers_desc:1 "When one socialist country is under threat by a foreign invader, all socialist countries are under threat. We must not sit idly by while our comrades fight for their lives."
 UFRA_host_the_german_exiles:0 "Host the German Exiles"
 UFRA_host_the_german_exiles_desc:0 "Germany, the home of Marx and Engels, was once at the forefront of communist thought and practice. Many German communists fled when the Nazis took power. If we give them a home, they can help us organize a more effective government of liberated territories."
 UFRA_revolution_to_the_utmost:0 "Revolution To the Utmost"
 UFRA_revolution_to_the_utmost_desc:0 "A revolution left half-finished is not a revolution at all. We must not stop until the deed is done and the new political system is safe. Whatever the cost."
 UFRA_national_television:0 "Nationalization of television channels"
 UFRA_national_television_desc:0 "Having the TV channels at our service will allow us to show only what the people need to see"
 UFRA_destroy_the_counter_revolution:0 "Destroy the Counter-Revolution"
 UFRA_destroy_the_counter_revolution_desc:0 "Even now, some people in France prepare to stab the dagger into the back of their own people when they show even a second of weakness. We will not let them, and will strike first."
 UFRA_revolutionary_zeal:0 "Revolutionary Zeal"
 UFRA_revolutionary_zeal_desc:1 "The French people have always possessed a particular fervor for eradicating the old order and raising up the new. This should not be discouraged."
 UFRA_loyalty_to_the_cause:0 "Loyalty To the Cause"
 UFRA_loyalty_to_the_cause_desc:1 "Other countries may formulate their own visions of Communism, but there is no reason why we should compromise on ours. They may have stopped half-way, beset by doubt over whether the end justified the means. We won't."
 UFRA_carry_the_revolution_north:0 "Carry the Revolution North"
 UFRA_carry_the_revolution_north_desc:0 "Across the Channel lies the birthplace of the industrial revolution, and with it, the home of modern capitalism. We can not allow this place to become the springboard for a counter-revolutionary enemy."
 UFRA_carry_the_revolution_west:0 "Carry the Revolution West"
 UFRA_carry_the_revolution_west_desc:1 "The regimes of the Iberian peninsula are hanging on by a thread, ready to be swept away by a popular revolution. We will sever that thread."
 UFRA_carry_the_revolution_east:0 "Carry the Revolution East"
 UFRA_carry_the_revolution_east_desc:0 "At our eastern border lies the biggest threat to our new order. The reactionary forces assembled there will strike when we can least afford it - but only if we give them the time to prepare for it."
 UFRA_carry_the_revolution_south:0 "Carry the Revolution South"
 UFRA_carry_the_revolution_south_desc:0 "The first country to fall to fascism was Italy. As a result, the ideology is firmly entrenched in Italy. Our world-views can not peacefully coexist. They know this as well as we do, and will no doubt prepare to act. So must we."
 UFRA_egalite_liberte_solidarite:0 "Egalité, Liberté, Solidarité"
 UFRA_egalite_liberte_solidarite_desc:1 "The first French Revolution swept away regimes that had lasted for a millennia, and changed the landscape of Europe forever. We will finish what they started."
 UFRA_reform_the_labour_laws:0 "Reform the Labour Laws"
 UFRA_reform_the_labour_laws_desc:0 "The workers of France labour under harsh conditions, with low pay and few benefits. It is time to implement a comprehensive suite of reforms to improve their lot."
 UFRA_nationalize_key_industry:0 "Nationalize Key Industries"
 UFRA_nationalize_key_industry_desc:0 "In the present situation, we must not shy away from radically restructuring our economy to meet the oncoming threat. Time is short - we can not wait for the free market to solve the issue."
 UFRA_reorganize_the_aviation_industry:0 "Reorganize the Aviation Industry"
 UFRA_reorganize_the_aviation_industry_desc:0 "Split into dozens of tiny companies, our aviation industry is decades behind the industry in Germany and the US. Radical restructuring is needed."
 UFRA_form_the_state_arsenals:0 "Form the State Arsenals"
 UFRA_form_the_state_arsenals_desc:0 "To supply our army with modern weapons, we can not wait until private companies have developed the necessary production capacities."
 UFRA_general_work_council:0 "General Work Council"
 UFRA_general_work_council_desc:0 "We will create a national agency to handle disputes between employers and employees, and to ensure that our workers are employed in the most efficient manner possible."
 UFRA_national_champions:0 "National Champions"
 UFRA_national_champions_desc:0 "By selecting a few companies that have the potential to compete on a global level and supporting them to the highest degree, we can create a modern economy that is the equal of any other."
 UFRA_dirigisme:0 "Dirigisme"
 UFRA_dirigisme_desc:0 "While the full-on planned economy of the Soviet model is clearly too extreme a measure, a certain measure of planning and direction is needed to optimize our economy."
 UFRA_ban_the_leagues:0 "Ban Opponents"
 UFRA_ban_the_leagues_desc:0 "The far-right leagues have been allowed to organize unchecked. While they are currently too weak to try a coup, there is no telling of what they might be able to do in the future. Best to dissolve them now."
 UFRA_the_blum_viollette_proposal:0 "The Blum-Viollette Proposal"
 UFRA_the_blum_viollette_proposal_desc:1 "The citizenship of the French Republic should be open to anyone who qualifies. Many of our loyal subjects in Algeria would like to become full citizens, but are not yet allowed to do so. By making them full citizens, we would bind Algeria much closer to France."
 UFRA_expand_the_citizenship:0 "Expand the Citizenship"
 UFRA_expand_the_citizenship_desc:0 "It is intolerable for a republic that some of the people living on her territory would not be allowed to become her citizens, yet this state of affairs has been allowed to persist in our own. We must rectify this at once."
 UFRA_france_undividable:0 "France Undividable"
 UFRA_france_undividable_desc:0 "France must be formed into a single unit, under one flag. It is time we openly acknowledged this, if only to lay fears of division to rest."
 UFRA_french_union:0 "French Union"
 UFRA_french_union_desc:0 "It is time to proclaim a new France, a France that spans the globe, in which all parts of our realm are united. We will hold referendums in every part to confirm the people's will to become part of this new, greater France."
 UFRA_french_union_tt:0 "Referendums in various parts of our colonial empire will be held. Some parts may chose to become fully independent instead."
 UFRA_encourage_immigration:0 "Encourage Immigration"
 UFRA_encourage_immigration_desc:1 "Our homeland is in desperate need of workers to make up for the losses incurred in the Great War. By making it easier to settle in France, we can attract the skilled immigrants that can make up for this shortfall."
 UFRA_review_foreign_policy:0 "Review Foreign Policy"
 UFRA_review_foreign_policy_desc:0 "The continental order that was established in 1919 looks increasingly under threat. It is time that we review our foreign policy options to secure new alliances to weather the coming storm."
 UFRA_intervention_in_spain:0 "Intervention in Spain"
 UFRA_intervention_in_spain_desc:0 "The civil war in Spain has brought the clash between ideologies to our very doorstep. We must tread carefully, lest the conflict spill over into our country."
 UFRA_support_the_finns:0 "Support the Finns"
 UFRA_support_the_finns_desc:0 "The Finnish are fighting for their lives. We must aid them."
 UFRA_take_norwegian_water:0 "Acquire Norwegian Heavy Water"
 UFRA_take_norwegian_water_desc:0 "Heavy water is an essential element to moderate the radioactive elements in a nuclear reactor, but heavy water must be isolated from normal water to be usable. Very few factories are capable of isolating heavy water, and almost all of the world's stock is produced in a factory in Norway. We need to take all this water, for our research but also to prevent our enemies from having access to it."
 UFRA_confirm_eastern_commitments:0 "Confirm Eastern Commitments"
 UFRA_confirm_eastern_commitments_desc:0 "After the Great War, we set up a network of alliances in Eastern Europe, as a counter-weight to a resurgent Germany and an expansionist Soviet Union. Our allies in the region are now wondering if we would actually come to their aid if we were called. We should reassure them before they decide to seek help elsewhere."
 UFRA_strengthen_the_little_entente:0 "Strengthen the Little Entente"
 UFRA_strengthen_the_little_entente_desc:0 "The Little Entente binds us to come to the aid of our allies in Eastern Europe and the Balkans. We have allowed this alliance to lapse, but it is needed now more than ever. It is time to revive it."
 UFRA_invest_in_our_weaker_allies:0 "Invest In Our Weaker Allies"
 UFRA_invest_in_our_weaker_allies_desc:0 "If we are to have capable allies in case of war, we must enable them to meet their own military needs. A program of moderate investments into their industry will allow them to produce the munitions they need locally."
 UFRA_invest_in_our_weaker_allies_trigger_tt:0 "Has fewer military factories than us"
 UFRA_coordinate_rearmament:0 "Coordinate Rearmament"
 UFRA_coordinate_rearmament_desc:0 "To match the unified development process of the Germans and our other opponents, we must also coordinate our efforts with our allies."
 UFRA_foreign_guest_workers:0 "Foreign Guest-Workers"
 UFRA_foreign_guest_workers_desc:0 "Our lack of workers is a major bottleneck in expanding our industry and growing the size of our armed forces. Inviting skilled workers from our allies to work in our factories frees up manpower to send into the army."
 UFRA_join_the_ententes:0 "Join the Ententes"
 UFRA_join_the_ententes_desc:1 "France can not sustain two commitments of mutual defense at the same time. Unless we can get the British to agree to honor our commitments as well, we would have to choose. By combining our disparate networks of alliances into a single whole, we increase the deterrence factor of our alliances by an order of magnitude."
 unlocks_espionage_operation_tt:0 "Unlocks an §YEspionage Operation§!:\n"
 UFRA_revive_the_franco_polish_alliance:1 "Revive the Franco-Polish Alliance"
 UFRA_revive_the_franco_polish_alliance_desc:0 "France has always supported an independent Poland. In recent years, relations between our countries have cooled a little. With the threat of Germany on the horizon, it is time to rekindle our pact."
 UFRA_revive_the_franco_polish_alliance_tt:0 "\nPoland would be invited into our faction if we were leaders of our own faction."
 UFRA_buy_time:0 "Buy Time"
 UFRA_buy_time_desc:0 "We are not ready to face the Germans in the field. Our allies are weak, our military is outdated. We might have to make some sacrifices if we want to survive."
 UFRA_arms_purchases_in_the_us:1 "Arms Purchases in the US"
 UFRA_arms_purchases_in_the_us_desc:0 "Our military industry is simply not up to the task of supplying our forces with the necessary modern weapons. The US, however, has production capacity to spare. Unless they decide to return to their isolationism, it would seem that they could be persuaded to sell us the weapons we need."
 UFRA_france_leads:0 "France Leads"
 UFRA_france_leads_desc:0 "A nation with the proud history of France can not let other countries dictate her foreign policy. We will make our own choices, guided by our own interests."
 UFRA_concessions_to_italy:1 "Concessions to Italy"
 UFRA_concessions_to_italy_desc:0 "Italy still dreams of an empire in Africa. If we were to offer some concessions - and approve of her conquest of Ethiopia - we might prevent the forming of an axis between Rome and Berlin."
 UFRA_ratify_the_stresa_front:0 "Ratify the Stresa Front"
 UFRA_ratify_the_stresa_front_desc:0 "Italy has indicated that she would join our faction in return for territories in Africa. It is time to put pen to paper and ratify the necessary treaties."
 UFRA_franco_soviet_treaty:0 "Franco-Soviet Treaty"
 UFRA_franco_soviet_treaty_desc:0 "The Soviets are just as worried about the rise of fascism in Europe as we are. Perhaps we could convince them to support us if the time came."
 UFRA_revive_the_national_bloc:0 "National Bloc Radicalisation"
 UFRA_revive_the_national_bloc_desc:0 "The political landscape is growing more and more radical by the day. The left whispers of making common cause with the communists. What is needed now is strong, stable leadership."
 UFRA_laissez_faire:0 "Laissez-Faire"
 UFRA_laissez_faire_desc:0 "The Communists openly talk about remodelling the economic structure of our country in some radical way, of depriving the hard-working man of his rightful property. Against this, we will set the simple notion of freedom. A dynamic economy will always outperform a leftist nightmare of strangulating red tape."
 UFRA_protect_the_rights_of_man:0 "Protect the Rights of Man"
 UFRA_protect_the_rights_of_man_desc:0 "They may never say it openly, but it is obvious to anyone with eyes to see: curtailing the right to property is just the first step to eliminating all the rights our proud ancestors fought so hard for. We will not have it!"
 UFRA_freedom_front:0 "Disband the Leagues"
 UFRA_freedom_front_desc:0 "When faced with the chaos and upheaval the communists promise, one must be willing to make alliances with other parties, even those that one might find personally reprehensible."
 UFRA_stimulate_the_dynamic_market:0 "Stimulate the Dynamic Market"
 UFRA_stimulate_the_dynamic_market_desc:0 "The dynamic market has been proven to be the most efficient form of economic organization. But it is still run by humans, and human beings sometimes need some reassurances that their hard work will not be in vain. By legislating away some restrictions and giving guarantees, we can help investors overcome their fears and help stimulate our economy."
 UFRA_agricultural_protectionism:0 "Agricultural Protectionism"
 UFRA_agricultural_protectionism_desc:0 "The world economy has grown more and more hostile to our traditional ways of production. If we do not take measures to protect our farmers, we will soon face a crisis of untold proportions as our farmers are unable to remain competitive in the face of mass-produced foodstuffs coming in from overseas."
 UFRA_economic_devolution:0 "Economic Devolution"
 UFRA_economic_devolution_desc:0 "It is absurd to think that some bureaucrat in Paris knows what is best for a company in Bordeaux. We must trust our entrepeneurs and empower them to create their own solutions."
 UFRA_promote_entrepeneurship:0 "Promote Entrepeneurship"
 UFRA_promote_entrepeneurship_desc:0 "The beating heart of a dynamic market has always been the individual who, upon seeing an opportunity, moves quickly to exploit it. In recent years, this spirit has been smothered with unnecessary regulations. We should roll them back."
 UFRA_utilize_the_leagues:0 "Utilize the Leagues"
 UFRA_utilize_the_leagues_desc:0 "It is a sad fact that political violence has become commonplace in France. If the country is to survive the threat of communist revolution, we must not shy away from the help of people who can and will meet the communist thugs in the street if it comes to that."
 UFRA_national_regeneration:0 "National Regeneration"
 UFRA_national_regeneration_desc:0 "An excess of democracy and misguided republicanism have poisoned our country and divided our people. It will take a long time to heal these wounds, but at ast the first steps have been taken."
 UFRA_national_regeneration_trigger_tt:0 "The combined total of Unaligned and Fascist support is over 50%"
 UFRA_destroy_decadence:0 "Destroy Decadence"
 UFRA_destroy_decadence_desc:1 "No country has ever been great if it allowed itself to debate even the tiniest issue for months. Some countries, secure behind oceans and supported by global empires, may believe that they can afford this luxury. We can not."
 UFRA_integralism:0 "Integralism"
 UFRA_integralism_desc:0 "The ideology of integralism states that all aspects of society must come together and work as if they were one small piece of a larger whole. This society must be well ordered, to ensure that all parts of it work together in harmony."
 UFRA_work:0 "Work"
 UFRA_work_desc:0 "The craftsman is the most important component of the economy. When guided by the right people, there is no nobler call than to place one's labour in service of one's country."
 UFRA_family:0 "Family"
 UFRA_family_desc:0 "The smallest unit in society is not the individual - it is the family. To dispute this simple and obvious fact was the biggest flaw of the old republic."
 UFRA_fatherland:0 "Fatherland"
 UFRA_fatherland_desc:0 "The country stands above all else. There can be no doubt about this."
 UFRA_political_unity:0 "Political Unity"
 UFRA_political_unity_desc:1 "The history of France since the fall of absolutism has been a story of political infighting. When there was unity - France was victorious. When there was internal strife - France was defeated. For this reason, we can not allow the ambitions of the few to harm the livelihood of the many."
 UFRA_diplomatic_freedom:0 "Diplomatic Freedom"
 UFRA_diplomatic_freedom_desc:1 "The republican governments have shackled themselves to artificial constructs in Eastern Europe who will fall the moment we withdraw our aid. They are liabilities, not assets, and as such we will divest ourselves of them."
 UFRA_latin_entente:0 "Latin Entente"
 UFRA_latin_entente_desc:1 "The brotherhood that exists between the successor states of the Roman Empire is undeniable. The Germanic people of Europe have ruled the continent for too long. It is time that we reclaimed our national birthright."
 UFRA_reach_out_to_spain:0 "Reach Out To Spain"
 UFRA_reach_out_to_spain_desc:0 "Freshly recovered from its civil war, Spain is our natural ally in our attempt to reshape the continent."
 UFRA_invite_portugal:0 "Invite Portugal"
 UFRA_invite_portugal_desc:1 "While her colonial empire has been much diminished, the flame of exploration and conquest still burns in the heart of every Portuguese."
 UFRA_compensate_italy:0 "Compensate Italy"
 UFRA_compensate_italy_desc:0 "In the past, conflicts over some tiny stretches of desert have drawn our nations into conflict. Such nonsense is easily stopped, and a mutually agreeable outome can quickly be found."
 UFRA_intervention_in_greece:0 "Intervention in Greece"
 UFRA_intervention_in_greece_desc:0 "Greece controls some of the most valuable territory in the Mediterranean. We can not allow a hostile government to have control of it, and so we must act first."
 UFRA_the_congress_of_paris:0 "The Congress of Paris"
 UFRA_the_congress_of_paris_desc:0 "In the Congress of Berlin, the borders of Africa were shaped. But the map today looks like a patchwork. It is time to redraw the map, and thus form the basis for a new colonial empire."
 UFRA_the_natural_borders_of_france:0 "The Natural Borders of France"
 UFRA_the_natural_borders_of_france_desc:0 "It is only natural that a country should look to its own interests first. We can not peacefully coexist with the Germans in our struggle, and so we must secure our natural borders to defend our heartlands."
 UFRA_towards_a_new_europe:0 "Towards a New Europe"
 UFRA_towards_a_new_europe_desc:1 "France is at a crossroads. We can shackle ourselves to the old order, or we can embrace the new. With the Germans poised to remake the continent, it would be beneficial for us to be on their good side."
 UFRA_establish_spheres_of_influence:0 "Establish Spheres of Influence"
 UFRA_establish_spheres_of_influence_desc:1 "For centuries, our people have lived in the belief that we were mortal, hereditary enemies. This belief was founded in the idea that our interests were incompatible. But we could surely come to an agreement if we just defined our spheres of influence and studiously refrained from interfering."
 UFRA_split_belgium:0 "Split Belgium"
 UFRA_split_belgium_desc:0 "With Belgium now in our sphere of influence, it is time to call the French-speaking parts of it home. The rest will be formed into a new state."
 UFRA_align_belgium:0 "Align Belgium"
 UFRA_align_belgium_desc:0 "The Belgians owe their existence to us, and we can not let them forget that fact. If we let them remain independent, we will at the very least ensure that a friendly government is installed."
 UFRA_grow_the_empire:0 "Grow the Empire"
 UFRA_grow_the_empire_desc:0 "It is absurd that a country the size of Belgium would be allowed to retain a colony many times its size. We are far better suited to administer such a territory."
 UFRA_bring_home_quebec:0 "Bring Home Quebec"
 UFRA_bring_home_quebec_desc:0 "The province lost long ago will, in time, be ours again. All French-speaking people in the world will eventually be reunited with the fatherland."
 UFRA_expand_to_the_suez:0 "Expand to the Suez"
 UFRA_expand_to_the_suez_desc:0 "The division of control between us and Britain in the Levant is an unworkable compromise that we now, thankfully, no longer have to abide by."
 UFRA_dominate_the_middle_east:0 "Dominate the Middle East"
 UFRA_dominate_the_middle_east_desc:0 "The countries of the middle east are artificial constructs, carved from the corpse of the Ottoman Empire. They are no more sovereign than the average French village, and it is time to remind them of that fact."
 UFRA_the_council_of_rambouillet:0 "The Council of Rambouillet"
 UFRA_the_council_of_rambouillet_desc:0 "With the country in turmoil, the people look for a strong leader. It has become clear that Republicanism has failed the French people, and it is time for the natural rulers of France to return. But first, the groundwork must be laid for a restoration of the monarchy."
 UFRA_revise_the_constitution:0 "Revise the Constitution"
 UFRA_revise_the_constitution_desc:0 "The republican constitution was alwas intended to be a stopgap measure that has been allowed to persist for far too long. Now, we will rewrite it to allow a monarch to return."
 UFRA_repeal_the_law_of_exile:0 "Repeal the Law of Exile"
 UFRA_repeal_the_law_of_exile_desc:0 "No head of a French royal family, nor their heir, are allowed on French soil without express permission. Before we can have the triumphant return of the monarchy, we must dispose of this annoying little obstacle."
 UFRA_orleanist_restoration:1 "Orléanist Restoration"
 UFRA_orleanist_restoration_desc:2 "The House of Orléans commands considerable support amongst the royalists in France. While some detractors would prefer a different candidate for the throne, there can be little doubt that the Orleanist heir has the best chances to peacefully unite the country behind him."
 UFRA_guarantee_the_constitution:0 "Guarantee the Constitution"
 UFRA_guarantee_the_constitution_desc:0 "Before the republican press can even launch its unfounded campaigns against the legitimacy of royal rule, we must erode their standing by giving iron-clad guarantees to respect the individual rights of the people."
 UFRA_the_first_citizen_of_the_state:0 "The First Citizen of the State"
 UFRA_the_first_citizen_of_the_state_desc:0 "The king, while imbued with considerable power, must never be seen as a tyrant or absolutist ruler of the old kind. Instead, a modern monarch must respect the law and be the first line of defense against those that would usurp power illegally."
 UFRA_counter_action_desc:0 "The Action Francaise has long been the strongest advocate for a return to the monarchy. Unfortunately, their views on other subjects are less palatable. It is time to inform them that they have served their purpose and dispose of them."
 UFRA_no_further_humiliations:0 "No Further Humiliations"
 UFRA_no_further_humiliations_desc:0 "For years, successive republican governments have allowed the Germans to run roughshod over international treaties, some of which were brazenly broken before the ink was even dry. This ends now."
 UFRA_slum_clearing:0 "Slum Clearing"
 UFRA_slum_clearing_desc:0 "Despite being in one of the great powers of the world, the simple French worker often lives in appalling conditions of disgusting squalor. No king worthy of the title can tolerate his subjects living in such a state."
 UFRA_public_welfare:0 "Public Welfare"
 UFRA_public_welfare_desc:0 "A king who does not work for the least of his subjects is no king at all."
 UFRA_the_legitimate_heir:0 "The Legitimate Heir"
 UFRA_the_legitimate_heir_desc:1 "The Legitimists consider the Carlist branch to be the legitimate heir to the throne of France. Appointing their candidate to the throne opens up the tantalizing possibility of ruling Spain and France in a double-monarchy."
 UFRA_secure_the_crown_of_spain:0 "Secure the Crown of Spain"
 UFRA_secure_the_crown_of_spain_desc:0 "The first step towards claiming the king's birthrights is to secure Spain from the various pretender governments that have sprung up. Their petty squabbles have thrown the country into a bloody civil war once already - we must not let them do so again."
 UFRA_unite_the_crowns:0 "Unite the Crowns"
 UFRA_unite_the_crowns_desc:0 "With Spain secured, we can now unite the crowns and create a new kingdom, the Kingdom of Franco-Spain."
 UFRA_two_countries_two_crowns:0 "Two Countries, Two Crowns"
 UFRA_two_countries_two_crowns_desc:0 "There is no feasible way in which we could unite the countries where one would not consider itself a subject of the other. We will instead advise the king to rule both in a personal, but not a legal, union."
 UFRA_proclaim_the_third_empire:0 "Proclaim the Third Empire"
 UFRA_proclaim_the_third_empire_desc:0 "The Bonapartists may be considered the outsiders in the struggle for the throne, but they carry with them the dream of a time when all of Europe bowed to the Emperor of the French."
 UFRA_avenge_waterloo:0 "Avenge Waterloo"
 UFRA_avenge_waterloo_desc:0 "The history of Napoleon the First will forever be defined by his greatest defeat. If we want to succeed, we must show that we can win where he has lost."
 UFRA_reorganize_the_dutch:0 "Reorganize the Dutch"
 UFRA_reorganize_the_dutch_desc:0 "The Dutch, too, were once part of the French Empire. Now that they have been defeated, it is time to return to this natural state of affairs."
 UFRA_retribution_for_sedan:0 "Retribution For Sedan"
 UFRA_retribution_for_sedan_desc:0 "For more than half a century, the Germans have celebrated the Battle of Sedan, and their triumph over Napoleon the Third there. In the future, every German will learn to curse the name of that place."
 UFRA_disunite_germany:0 "Disunite Germany"
 UFRA_disunite_germany_desc:0 "The triumph over France allowed Prussia to unite the smaller German states under her banner. It is only right that this process is reversed, now that the Germans have been defeated."
 UFRA_return_to_borodino:0 "Return To Borodino"
 UFRA_return_to_borodino_desc:0 "At Borodino, Napoleon came closest to achieving his victory in Europe. The Russian Army was all but destroyed, and had he been just a little faster, he could have brought the Russians to terms. We will show the world that it can be done."
 UFRA_je_suis_la_deluge:1 "Je Suis Le Déluge"
 UFRA_je_suis_la_deluge_desc:0 "The French revolution was the flood that swept away the old and weak regimes that had controlled Europe for so long. Now, a new flood is here."
 UFRA_coordinate_rearmament_tt:0 "Reduces the cost of production licenses for members of our faction."
 UFRA_appeal_to_the_french_nation:0 "Appeal To the French Nation"
 UFRA_appeal_to_the_french_nation_desc:0 "France may have lost the battle, but it has not lost the war. It is the duty of every patriotic Frenchman to resist."
 UFRA_appeal_to_overseas_territories:0 "Appeal To Overseas Territories"
 UFRA_appeal_to_overseas_territories_desc:0 "While the metropolitan areas of France may well have fallen to the enemy, much of her empire still remains free. If we can rally them to our aid, we can take the fight back to the enemy."
 UFRA_appeal_to_overseas_territories_tt:0 "Colonial territories in various parts of the world have a chance to switch to our side."
 UFRA_intervention_in_north_africa:0 "Intervention In North Africa"
 UFRA_intervention_in_north_africa_desc:0 "North Africa presents the best possible staging ground for an invasion to retake the homeland. Turning it to our side is vital for our campaign of liberation."
 UFRA_intervention_in_west_africa:0 "Intervention In West Africa"
 UFRA_intervention_in_west_africa_desc:0 "West Africa holds untold millions of inhabitants, who can be drafted into a new army to take back our homelands."
 UFRA_intervention_in_syria:0 "Intervention In Syria"
 UFRA_intervention_in_syria_desc:0 "Denying the enemy the strategic territories in Syria protects the Suez canal and dramatically improves our situation in the eastern Mediterranean."
 UFRA_intervention_in_indochina:0 "Intervention In Indochina"
 UFRA_intervention_in_indochina_desc:0 "Far away from the fighting in Europe, our colonies in Indochina are an ideal area to help us defend our interests in the region."
 UFRA_intervention_in_central_africa:0 "Intervention In Central Africa"
 UFRA_intervention_in_central_africa_desc:0 "Central Africa is of vital importance for the allied war effort, and could be seized as an important propaganda coup for us."
 UFRA_intervention_in_madagascar:0 "Intervention In Madagascar"
 UFRA_intervention_in_madagascar_desc:2 "Should the enemy be allowed to take and fortify Madagascar, we face catastrophe in the Indian Ocean. A quick and decisive action could ensure that the island remains on our side."
 UFRA_form_the_national_committee:0 "Form the National Committee"
 UFRA_form_the_national_committee_desc:0 "Few would have believed that our cause could succeed. But now we are at last strong enough to declare the formation of a fully-functional government-in-exile, ready to take control of any French territory liberated from the enemy."
 UFRA_form_the_provisional_government_of_the_republic:1 "Form the Provisional Government"
 UFRA_form_the_provisional_government_of_the_republic_desc:0 "With the liberation of Paris, we are no longer a government-in-exile. It is time to begin the difficult work of rebuilding our country."
 UFRA_continue_the_fight:0 "Continue the Fight"
 UFRA_continue_the_fight_desc:0 "Few soldiers have opted to join us so far, but those that we do have must be armed and equipped."
 UFRA_the_free_french_navy:0 "The Free French Navy"
 UFRA_the_free_french_navy_desc:0 "Our allies are locked in a desperate struggle for survival, for which the sea lanes are vital. We must do our part to help them."
 UFRA_colonial_recruitment_desc:0 "With the homeland unavailable for recruitment, we must turn to our colonies for aid. Many of our subjects are willing to take up arms to fight for us."
 UFRA_the_regiment_normandie:0 "The Regiment Normandie"
 UFRA_the_regiment_normandie_desc:0 "It is vital that we French are seen to be fighting on all fronts. With the Soviets now engaged in combat against our common enemy, we could send a small group of fighter pilots to help them."
 UFRA_refus_absurde:0 "Refus Absurde"
 UFRA_refus_absurde_desc:0 "Even in the hour of defeat, the will to resist remains strong in some hearts. They will form the foundation of the resistance movement in the occupied territories."
 UFRA_the_maquis:0 "The Maquis"
 UFRA_the_maquis_desc:1 "The rural areas of France offer cover for anyone who wishes to escape from the occupier or their collaboratist lackeys. We should support the people who deny their labour to the enemy in an act of resistance, so that we may in time turn those areas into hotbeds of resistance."
 UFRA_reach_out_to_trade_unions:0 "Reach Out To Trade Unions"
 UFRA_reach_out_to_trade_unions_desc:0 "If we are to strike against the industries that have now been pressed into service by the enemy, having good communications with the workers there seems like the best way. They can delay or sabotage any production that takes place, far more efficiently than any outside force."
 UFRA_cooperation_with_the_communists:0 "Cooperation With the Communists"
 UFRA_cooperation_with_the_communists_desc:0 "In our common struggle, we must not refuse any ally that offers themselves - even if they may call themselves comrade."
 UFRA_connections_to_industrialists:0 "Connections To Industrialists"
 UFRA_connections_to_industrialists_desc:0 "While cooperation with the workers in the war industries helps, cooperating with the people who run the factories has benefits in and of itself."
 UFRA_the_civil_and_military_organization:0 "The Civil And Military Organization"
 UFRA_the_civil_and_military_organization_desc:0 "The many small groups that are carrying out acts of resistance are banding together to form a larger organization. We should give this our blessing."
 UFRA_national_council_of_the_resistance_desc:0 "The resistance is growing stronger and stronger in France, and has become so powerful that it needs a new steering committee to coordinate its activities."
 UFRA_national_uprising_desc:0 "The hour has come. Now is the time to pick up arms and step out from the shadows that have cloaked you for these many years!"
 UFRA_french_forces_of_the_interior:0 "French Forces of the Interior"
 UFRA_french_forces_of_the_interior_desc:1 "The resistance has thousands of men under arms, all across France. As we and our allies advance across the country, we will sweep them up and turn them into soldiers in our army."
 UFRA_french_forces_of_the_interior_tt:0 "Creates weak infantry units in every liberated core state."
 UFRA_naval_rearmament:0 "Naval Rearmament"
 UFRA_naval_rearmament_desc:0 "Our shipbuilding industry has been left to languish while we focused on keeping pace with developments in other fields. As a result, we are now very much in danger of being outclassed by our rivals in the mediterranean and the Atlantic. We must invest more to make up for lost time."
 UFRA_colonial_naval_bases:0 "Colonial Naval Bases"
 UFRA_colonial_naval_bases_desc:0 "The key to global power projection is the ability to maintain a fleet far away from home waters. We have large colonial holdings already, now we must develop them to serve as refuelling and repair bases for our fleet."
 UFRA_develop_colonial_dockyards:0 "Develop Colonial Dockyards"
 UFRA_develop_colonial_dockyards_desc:0 "With the naval bases in various parts of our Empire enlarged and modernized, we can look at settling the necessary heavy industry and build the large docks necessary to construct ships overseas."
 UFRA_the_old_school:0 "The Old School"
 UFRA_the_old_school_desc:0 "Despite all advances in naval technology, the key element of sea power is still the capital ship acting with the support of other fleet units. Whether this capital ship is still the battleship or is the new aircraft carrier, we must further increase the size of our shipbuilding industry to ensure we can keep pace with other naval powers."
 UFRA_carrier_planes:0 "Carrier Planes"
 UFRA_carrier_planes_desc:0 "A carrier is only as good as its planes. Without modern planes, any carrier is a wasted investment."
 UFRA_rush_the_richelieus:0 "Rush the Richelieus"
 UFRA_rush_the_richelieus_desc:0 "With the situation in Europe becoming more and more desperate, we don't have time to build our new surface units through conventional means. We have to prioritize materials to get our new battleships into service as soon as possible."
 UFRA_prioritize_the_joffre:0 "Prioritize the Joffre"
 UFRA_prioritize_the_joffre_desc:0 "Our current carrier fleet is hopelessly outdated and outmatched by any potential enemy. We must ensure that a new carrier project is given top priority."
 UFRA_the_young_school:0 "The Young School"
 UFRA_the_young_school_desc:0 "Developments in aviation, submarines and torpedoes have made the capital ship obsolete. With our limited naval industry, we can not afford to waste time and money on building gigantic floating fortresses that are helpless against the threats of the modern naval battlefield. We should instead focus on improving efficiency to allow us to build more small vessels."
 UFRA_undersea_combat:0 "Undersea Combat"
 UFRA_undersea_combat_desc:0 "The submarine has come to maturity in the last decade. It now poses a lethal threat to any and all surface ships, while being increasingly difficult to detect and destroy."
 UFRA_surface_combat:0 "Surface Combat"
 UFRA_surface_combat_desc:0 "With advances in gunnery, it has become all but impossible to build a ship that can hope to survive a prolonged slugging match with another capital vessel. It is far better to have a fleet of modern destroyers and torpedo boats to overwhelm an enemy with massed salvos of torpedoes."
 UFRA_prioritize_the_joffre_tt:0 "Adds a modern §YCarrier§! at 40% completion to the construction queue."
 UFRA_SNCAN_formed:0 "Formed SNCAN"
 UFRA_SNCAO_formed:0 "Formed SNCAO"
 UFRA_SNCASE_formed:0 "Formed SNCASE"
 UFRA_SNCASO_formed:0 "Formed SNCASO"
 UFRA_metropolitan_france:2 "Invest in Metropolitan France"
 UFRA_metropolitan_france_tt:0 "Not enough building slots for §YInfrastructure§! in Metropolitan France"
 UFRA_metropolitan_france_desc:0 "La Métropole should always come first. We can start by improving our infrastructure to create jobs and enable faster troop deployment."
 UFRA_algerie_france:2 "Invest in Algerian France"
 UFRA_algerie_france_tt:0 "Not enough building slots for §YInfrastructure§! in Colonial France"
 UFRA_algerie_france_desc:0 "Europe is facing dangerous times. We should focus on improving our lands to the south and ensure we can always support the mainland."
 UFRA_industrial_expansion:0 "Industrial Expansion"
 UFRA_industrial_expansion_tt:0 "Not enough building slots for §YCivilian Factories§! in Metropolitan France"
 UFRA_industrial_expansion_desc:0 "We need a stronger industrial presence at home. We have plenty of labor ready, but need more factory lines."
 UFRA_colonial_industry:0 "Colonial Industry"
 UFRA_colonial_industry_tt:0 "Not enough building slots for §YCivilian Factories§! in Colonial France"
 UFRA_colonial_industry_desc:1 "We should focus on our industries in the colonies. Should tensions increase in Europe we will still have an industrial capacity outside the reach of enemy bombers."
 UFRA_military_factories:0 "Military Factories"
 UFRA_military_factories_tt:0 "Not enough building slots for §YMilitary Factory§! in Metropolitan France"
 UFRA_military_factories_desc:1 "Our war-machine is falling behind in capacity. We need to focus on production of military equipment on home soil to make sure that our forces are constantly given new equipment."
 UFRA_colonial_military_factories:0 "Colonial Military Factories"
 UFRA_colonial_military_factories_tt:0 "Not enough building slots for §YMilitary Factory§! in Colonial France"
 UFRA_colonial_military_factories_desc:0 "Placing our military production outside Europe ensures that even if the enemy gains control of our airspace, we will maintain a constant flow of equipment to our front-line troops."
 UFRA_extra_research_slot:2 "Support the Grandes Écoles"
 UFRA_extra_research_slot_desc:0 "Promising young minds are popping up everywhere. We need to supply them with facilities to conduct their research. Advances in technology can give us the edge where we most need it."
 UFRA_nuclear_effort:0 "Nuclear Effort"
 UFRA_nuclear_effort_desc:0 "Initial tests in nuclear science have shown promising results. Harnessing its power can give us a weapon unlike anything mankind has seen."
 UFRA_jet_effort:0 "Jet Effort"
 UFRA_jet_effort_desc:0 "Air combat is all about mobility. The jet engine is such a powerful advance that the enemy pilots will seem to stand still while we rip them out of the sky."
 UFRA_extra_research_slot_2:2 "Form the National Research Center"
 UFRA_extra_research_slot_2_desc:0 "The creation of a National Center for Scientific Research would allow us to coordinate the activity of our laboratories and obtain higher higher yield from them."
 UFRA_defensive_focus:0 "Defensive Focus"
 UFRA_defensive_focus_desc:0 "In times like these, it is best to strengthen our defenses. If there are threats, let them come to us so that we can deal with them on our own land. We have a perfect candidate to lead our army, all we need is your word."
 UFRA_aggressive_focus:0 "Aggressive Focus"
 UFRA_aggressive_focus_desc:0 "We cannot sit idly by as enemies move in on our borders. And we cannot leave our allies to fend for themselves in a war scenario. Prepare our army! Gamelin is the man for the job."
 UFRA_fortification_focus:0 "Fortification Focus"
 UFRA_fortification_focus_desc:0 "As critical as our forts have been, we need to find ways to construct them more efficiently. The Maginot line has been a powerful deterrent of enemy forces, we could use the security of more defenses like it."
 UFRA_alpine_forts:0 "Reinforce the Alpine front"
 UFRA_alpine_forts_desc:0 "We already have forts to protect us from the Italian threat, but modernizing the existing forts would help us secure the south once and for all."
 UFRA_extend_the_maginot_line:0 "Extend the Maginot Line"
 UFRA_extend_the_maginot_line_desc:0 "We cannot count on Belgium to hold their ground, if they let enemy armies through we might be in trouble. Extending the Maginot Line is crucial to keeping unwanted armies out of France!"
 UFRA_infantry_focus:0 "Levée en masse"
 UFRA_infantry_focus_desc:0 "All men and women who can fight will do so. Producing weapons in mass will lower the cost. We will put a rifle in the hands of everyone."
 UFRA_artillery_focus:0 "Grande Batterie"
 UFRA_artillery_focus_desc:0 "Our Artillery will form a single powerful unit to focus fire on specific points. One volley at a time and we will weaken the enemy line and punch our way through if we have to!"
 UFRA_heavy_armor_focus:0 "Char de Bataille"
 UFRA_heavy_armor_focus_desc:0 "Battle tanks are the way forward for the French Army. We want to control the battlefield and for this we will need new powerful tanks!"
 UFRA_motorized_focus:0 "Motorized Focus"
 UFRA_motorized_focus_desc:0 "Finding better ways to build our infantry vehicles will help our ability to support and reinforce the front lines."
 UFRA_mechanized_focus:0 "Mechanized Focus"
 UFRA_mechanized_focus_desc:0 "Armored vehicles play an increasingly important role in the war. While slightly less intimidating than your average tank, they give us an edge in communication, command, transport and urban warfare. "
 UFRA_light_medium_armor:0 "Automitrailleuses"
 UFRA_light_medium_armor_desc:0 "By law, the Infantry control all tank forces. The lighter, faster cavalry 'vehicles' or Automitrailleuses are better suited for travel and can still deal some damage with their mounted weapons."
 UFRA_army_reform:0 "Army Reform"
 UFRA_army_reform_desc:0 "No infantry unit or high tech tank alone will win us the war. We must put our efforts into developing both our tactical and strategical capabilities. With the right people on the job we can evolve as an army."
 UFRA_navy_focus:0 "Navy Focus"
 UFRA_navy_focus_tt:0 "Not enough building slots for §YNaval Base§!"
 UFRA_navy_focus_desc:0 "If we plan to expand our navy the first step is to improve and expand our naval bases. Our unique ships require constant attention to stay combat ready at all times."
 UFRA_improved_screen_ships:0 "Improved Screen Ships"
 UFRA_improved_screen_ships_desc:0 "Destroyers and Lighter Cruisers play a key role in defending our heavier Battleships or Carriers. If we lose our line of defense at sea we risk all ships and men. We must make sure our ships are built with the latest technology."
 UFRA_capital_ship_focus:0 "Capital Ship Focus"
 UFRA_capital_ship_focus_desc:0 "Improving the design of our Battleships would lead to great tactical advantages. With their range and power uncontested, no one will be able to outrun their guns."
 UFRA_boat_planes:0 "Investing in Seaplanes"
 UFRA_boat_planes_desc:0 "Seaplanes are superior to carrier planes. They do not need a runway to take off or land, and can be operated from any surface ship. They are ideal for monitoring our oceans"
 UFRA_carrier_focus:0 "Carrier Focus"
 UFRA_carrier_focus_desc:0 "Naval theorists have directed our attention to our outdated Carriers. They have suggestions on how Carriers can be further utilized if development is pushed in the right direction. Real progress cannot be made without our full support."
 UFRA_initiate_government_reform:0 "Government Reform"
 UFRA_initiate_government_reform_desc:0 "The world has grown dangerous. We can no longer be tied down by our own petty squabbles. It is time to empower our politicians and move forward for the sake of France."
 UFRA_support_the_left:0 "Support The Left"
 UFRA_support_the_left_desc:0 "The Comintern is growing stronger. It is time to show that our interests can be aligned, and support our communist organizations."
 UFRA_leftist_rhetoric:0 "Leftist Rhetoric"
 UFRA_leftist_rhetoric_desc:0 "The goal is clear. Equality for all. We do not want capitalist interests in french politics. It is imperative that we give optimal conditions for our communist organizations to flourish."
 UFRA_scw_intervention_republicans:0 "Republican Intervention"
 UFRA_scw_intervention_republicans_desc:0 "Republican Spain needs our help! \nAnyone willing to fight for the cause should be allowed to. We cannot allow another fascist regime to gain ground."
 UFRA_national_mobilization:0 "National Mobilization"
 UFRA_national_mobilization_desc:0 "We finally have a government capable of taking action. Now it is time to strengthen our army and be prepared to fight for France."
 UFRA_humanite_unie:0 "Humanité Unie"
 UFRA_humanite_unie_desc:0 "The fat bankers and the powerhungry demagogues are strengthening their bloody grip on the world. With each passing day we see free men enslaved and the world plunged further into crisis, created by the greed of the individual. French ideals are needed more than ever! Humanity needs us and we need to unite humanity!"
 UFRA_join_comintern:0 "Join Comintern"
 UFRA_join_comintern_desc:0 "With enemies everywhere we turn, we need to strengthen our position with some powerful allies. Our ties with the Comintern has grown stronger and it is time to dedicate ourselves fully to their cause."
 UFRA_support_status_quo:0 "Support The Status Quo"
 UFRA_support_status_quo_desc:0 "France is the cradle and protector of liberty and should remain so. If we ever wish to achieve unity again, then we must stabilize our democracy before it dwindles."
 UFRA_little_entente:0 "Little Entente"
 UFRA_little_entente_desc:0 "The Little Entente, an alliance formed after the Great War to prevent aggression from Austria and Hungary to their neighbours, was supported by France, but has now began to fall apart. Instead of securing ties with Britain, we should take initiative to restore and consolidiate this faction, starting with its founders in Czechoslovakia."
 UFRA_go_with_britain:0 "Go With Britain"
 UFRA_go_with_britain_desc:0 "With Russia forever changed, only France and Britain remain of the old Triple Entente. If history is doomed to repeat itself, we must ensure that these two nations, bastions of democracy and liberty in Europe, remain Allies."
 UFRA_use_US_nuclear_technics:0 "Use American techniques"
 UFRA_use_US_nuclear_technics_desc:0 "While we are desperately trying to get our hands on heavy water, our colleagues across the Atlantic are using Enriched Graphite to moderate the neutrons. In the absence of an alternative, using this solution could enable us to advance in our nuclear research."
 UFRA_strengthen_government_support:0 "Strengthen Government"
 UFRA_strengthen_government_support_desc:0 "We have made plans for the following year that will meet the wishes of people in all parts of France. Show them that we are capable of action and worthy to rule France, so we can once again stand united."
 UFRA_reform_project_Gaston_Doumergue:0 "Gaston Doumergue's Reform Project"
 UFRA_reform_project_Gaston_Doumergue_desc:0 "In 1934, proposed by the former President of the Republic Gaston Doumergue, this reform project aimed to reform the constitutional laws of 1857. It aims in particular to allow the President of the Republic to dissolve the Chamber of Deputies without the advices of the Senate. This reform could be the solution to the French political instability."
 UFRA_defensive_strategems:0 "Defensive Stratagems"
 UFRA_defensive_strategems_desc:0 "If we want the people of France to fight a war for us it is more important than ever that we have a clear direction. We must stop fighting amongst ourselves and fight for France and "Liberté, égalité, fraternité" instead."
 UFRA_invite_yugoslavia:0 "Invite Yugoslavia"
 UFRA_invite_yugoslavia_desc:0 "Yugoslavia has enough concerns without having to worry about expansionist neighbours. Bringing them back into the Little Entente would be a great service to both them and ourselves."
 UFRA_invite_romania:0 "Invite Romania"
 UFRA_invite_romania_desc:0 "The Romanian democracy is fragile, caught between its internal fascist factions and Soviet communism. Bringing them into the Little Entente will allow them to retain stability with our backing."
 UFRA_polish_guarantee:0 "Polish Guarantee"
 UFRA_polish_guarantee_desc:0 "Polish diplomats have expressed concerns about the tension on their borders. A guarantee from our mighty nation should deter anyone planning an invasion."
 UFRA_czech_guarantee:0 "Czech Guarantee"
 UFRA_czech_guarantee_desc:0 "Tension is rising at the Czech border. We cannot allow expansive nations to take over a free and democratic nation. The Czechs must remain a free people. With a guarantee from us anyone planning an invasion will think twice."
 UFRA_revise_versailles:0 "Revise Versailles"
 UFRA_revise_versailles_desc:0 "The Germans are already ignoring the reparations stipulated by the Versailles Treaty, showing that France no longer inspires respect. If anything, we have the right to demand more for the lives lost in the Great War, but a just treaty would require a strong France, a new France, to enforce it."
 UFRA_support_the_right:0 "Support The Right"
 UFRA_support_the_right_desc:0 "France has always been a strong and proud nation, but the lack of government action has divided the people. We must unite France and assert our superiority and strength to avoid succumbing to decay."
 UFRA_right_wing_rhetoric:0 "Right Wing Rhetoric"
 UFRA_right_wing_rhetoric_desc:0 "We must focus on reaching every French and lift their national spirit. Show them that we can be the powerful leaders they need and they will become proud citizens of our glorious nation."
 UFRA_scw_intervention_nationalists:0 "Nationalist Intervention"
 UFRA_scw_intervention_nationalists_desc:0 " The Nationalists are finally gaining ground in Spain. Their cause is a righteous one and anyone willing to fight for them should be allowed to."
 UFRA_army_of_aggression:0 "Army of Aggression"
 UFRA_army_of_aggression_desc:0 "We can no longer sit behind an obsolete wall, while our enemies run rampant across Europe. It is time to strengthen our army and push our borders to ensure France continues to be a grand nation."
 UFRA_france_first:0 "France First"
 UFRA_france_first_desc:0 "We are France! Victors of the Great War! Saviours of Europe! We are home of the greatest thinkers this world has seen. Too many nations seek to plunge the world into chaos. We are needed, and we will heed the call. We will take the helm, weather the storm, and steer humanity to safety under our rule!"
 UFRA_woo_italy:0 "Woo Italy"
 UFRA_woo_italy_desc:0 "Italy has the potential to become a powerful nation. Thanks to the strong leadership of Mussolini the people of Italy are united and ready to fight for the right cause. Let that cause be ours."
 UFRA_dismantle_the_democracies:0 "Dismantle the Democracies"
 UFRA_dismantle_the_democracies_desc:0 "The new [GER.GetAdjective] democratic alliance in central Europe is threatening our new-found position. We must take action now, before they grow more powerful."
 UFRA_join_germany:0 "Join Germany"
 UFRA_join_germany_desc:0 "The German Reich is becoming a force to be reckoned with. Their vision of a better future can be aligned with our interests. We should support them and once the dust settles France will get its rightful piece of Europe."
 UFRA_naval_doctrine:0 "Naval Doctrine"
 UFRA_naval_doctrine_desc:0 "Recent progress in ship designs have opened up new options in tactical and strategical maneuvers. Before we take chances with these new theories we need to have them properly tested and plans solidified."
 UFRA_air_focus:0 "Armée de l'Air"
 air_focus_bypass_tt:0 "Not enough building slots for §YAir Base§!"
 UFRA_air_focus_desc:0 "Time has come to expand on our air force! Plans have already been made to start construction of new Air Bases to support a big increase in both personnel and aircraft."
 UFRA_cas_focus:0 "CAS Focus"
 UFRA_cas_focus_desc:0 "Planes which provide support for our land forces and ships have been a very efficient addition at a relatively small investment. These planes now have several suggested improvements. Our engineers can develop the next generation of support aircraft."
 UFRA_fighter_focus:0 "Buy the Fighters of the C1 Program"
 UFRA_fighter_focus_desc:0 "On July 13, 1934, we launched a single-seat fighter competition to replace our D.500 planes. The winners were the MB.150 and the MS.405. Now that their prototypes have been tested, we can place an order!"
 UFRA_sell_fighter_swiss:0 "Sell our fighters"
 UFRA_sell_fighter_swiss_desc:0 "The Swiss and the Greeks have affirmed their desire to acquire a new model of fighter. If we manage to make a good impression, we could get a good price!"
 UFRA_modern_fighter_focus:0 "Developing a successor to the MS.406"
 UFRA_modern_fighter_focus_desc:0 "Advances in aviation keep coming, and we already have to start a successor to the latest models."
 UFRA_bomber_focus:0 "Renovate Bombers"
 UFRA_bomber_focus_desc:0 "Many of our tactical bombers are old models sometimes modeled on transport planes, and we still haven't launched a modernization program. It's time to do something!"
 UFRA_paratrooper:0 "Skydiving Instruction Center"
 UFRA_paratrooper_desc:0 "Founder of the Air Force parachute training center after an internship in the USSR, Captain Frédéric Gille would like to create a parachute unit for our army."
 UFRA_heavy_fighter_focus:0 "Buy Potez planes"
 UFRA_heavy_fighter_focus_desc:0 "The Potez 630 aircraft model is very flexible, and does not need much change to fulfill different roles, such as heavy fighter, bomber and reconnaissance aircraft."
 UFRA_air_doctrine:0 "Air Doctrine"
 UFRA_air_doctrine_desc:0 "We have gained enough experience to test new theories in air warfare at a faster pace. This will allow us to explore new tactical and strategic possibilities. Air combat is the key in modern warfare."
 UFRA_heavy_bomber_focus:0 "Heavy Bomber Focus"
 UFRA_heavy_bomber_focus_desc:0 "Modern heavy bombers will be armed to handle lesser aerial skirmishes on their own. If we allow our engineers to focus on developing the newest technology we will have a better chance of destroying enemy production facilities."
 UFRA_naval_bomber_focus:0 "Naval Bomber Focus"
 UFRA_naval_bomber_focus_desc:0 "Ships have proven exceptionally vulnerable to aircraft. We should keep improving on their technology to ensure we stay ahead of any countermeasures."
 UFRA_blum_stays:0 "Blum stays"
 UFRA_blum_stays_desc:0 "Blum is the man that made the Popular Front possible. He is a disciple of French Socialist leader Jean Jaurès and after Jaurès' assassination in 1914, became his successor. As Prime Minister in the Popular Front government, he is the one that provided the series of major economic reforms. Despite is pacifist ideas, only he can save France."
 UFRA_appoint_daladier:0 "Appoint Daladier"
 UFRA_appoint_daladier_desc:0 "In the face of the upcoming danger that represents Germany, France needs a leader that can defend her people. Who better than the minister of defense, leader of the Parti Radical and member of the Popular  Front, Edouard Daladier. He is a firm proponent of rearmement !"
 UFRA_reynaud_financial_reforms:0 "Reynaud Financial Reforms"
 UFRA_reynaud_financial_reforms_desc:0 "If France must rearm, the country must first get rid of all the things slowing the production down. A lot of the accomplishment of the Popular Front are impressive and necessary, but they are slowing our war capability. We must change that."
 UFRA_firmness_and_rearmement:0 "Firmness and rearmement"
 UFRA_firmness_and_rearmement_desc:0 "Daladier has expressed his intentions of being firm to Germany. And to do that, France must aggressively rearm. Maybe a deal can be done with the USA ?"
 UFRA_continue_social_reforms:0 "Continue Social Reforms"
 UFRA_continue_social_reforms_desc:0 "The first series of reforms such as those obtained during the Matignon agreements are a good start. But it's time to move up a gear by always reforming the labor code"
 UFRA_improve_free_education:0 "Jean Zay Education Reform"
 UFRA_improve_free_education_desc:0 "he reforms obtained under Jules Ferry are certainly correct, but all of this should be brought up to date. We should instigate different degrees in education, prolong compulsory schooling as well as bring sport more in tune."
 UFRA_ask_belgium_to_submit:0 "Ask Belgium to Submit"
 UFRA_ask_belgium_to_submit_desc:0 "The plan for the defense of France fell when Belgium backed down. It is time to ask Belgium to submit so we can efficiently defend our country and theirs."
 UFRA_reinforce_belgium:0 "Fortify Belgium"
 UFRA_reinforce_belgium_desc:0 "The forts located in Belgium certainly slowed down the Germans during the first war, but these are outdated. It is not only necessary to update them but also to add some on the key points of the Belgian landscape."
 UFRA_women_suffrage:0 "Women's Suffrage"
 UFRA_women_suffrage_desc:0 "It is as absurd as it is shameful that the hard-working women of France, who time and time again have fought on the barricades to earn their rights, are not permitted to cast their vote in elections. We will eradicate this injustice."
 UFRA_crush_bismarck_dream:0 "Crush Bismarck dream"
 UFRA_forgive_germany:0 "Water under the bridge"
 UFRA_steyr_arms:0 "Steyr Arms"
 UFRA_swiss_gold:0 "Swiss Gold"
 UFRA_relocate_german_industry:0 "Relocate German Industry"
 UFRA_integrate_german_states:0 "Integrate the German States"
 UFRA_latin_wine_cooperation:0 "Latin Wine Cooperation"
 UFRA_latin_wine_cooperation_desc:0 "Now that we control Spain, Italy and Portugal, most of world wine production is under our control. And not any wine, the best wines of the world. This is an amazing source of money, but the production needs to be centralized and coordinated. The Latin Wine Cooperation will be in charge of this Mission."
 UFRA_via_romana:0 "Via Romana"
 UFRA_mediteranean_fleet:0 "Mediterranean Fleet"
 UFRA_italian_air_industry:0 "Italian Air Industry"
 UFRA_integrate_latin_states:0 "Integrate the Latin States"
 UFRA_retake_constantinople:0 "Retake Constantinople"
 UFRA_press_the_gibraltar_claim:0 "Press the Gibraltar claim"
 UFRA_centralize_the_union:0 "Centralize the Union"
 UFRA_prepare_mexican_coup:0 "Prepare the Mexican Coup"
 UFRA_put_otto_on_the_mexican_throne:0 "Put Otto on the Mexican Throne"
 UFRA_reestablish_elections:0 "Re-establish the elections"
 UFRA_christian_democracy:0 "Christian Democracy"
 UFRA_egalite_monarchy:0 "Equality for Women"
 UFRA_egalite_monarchy_desc:0 "In every way that matters, women are still considered second-class citizens, always subject to a man's will. This nonsense ends now."
 UFRA_freedom_monarchy:0 "Protect Freedom of Expression"
 UFRA_restore_the_divine_right:0 "Restore the Divine Right"
 UFRA_restore_the_divine_right_desc:0 "The divine right of kings, or divine-right theory of kingship, is a political and religious doctrine of royal and political legitimacy. It asserts that a monarch is subject to no earthly authority, deriving his right to rule directly from the will of God."
 UFRA_counter_revolution:0 "Counter-Revolution"
 UFRA_the_real_country:0 "The Real Country"
 UFRA_authority_and_prestige:0 "Authority and Prestige"
 UFRA_the_real_country_desc:0 "Maurras opposes the Legal Country to the Real Country. The Legal Country is the one of the administration, of politicians and bureaucrats. The Real one is the one of Tradition, of the French, of the King and of regions, Bretons, Normands, Corsicans... Currently the Legal Country is the one that has power, but no longer!"
 UFRA_review_radio_role:0 "Review the role of Radio"
 UFRA_review_radio_role_desc:0 ""
 UFRA_review_tanks_role:0 "Review the role of Tanks"
 UFRA_review_tanks_role_desc:0 "Since its invention, tanks have evolved a lot. Once as fast as a man, they are now faster than cavalry. Their machine guns have been replaced by massive cannons and their armor has increased to survive the new battlefield. Our tactics are outdated, we need to reconsider the role of tanks in our army."
 UFRA_create_propaganda_apparatus:0 "State Secretariat of Information"
 UFRA_create_propaganda_apparatus_desc:0 "Having the TV channels at our service will allow us to show only what the people need to see"
 UFRA_french_election:0 "1936 Elections"
 UFRA_communist_win:0 "Alliance with the SFIC"
 UFRA_fascist_win:0 "National Bloc Radicalisation"
 UFRA_royalist_coup:0 "AF Coup"
 UFRA_bonapartist_restauration:0 "Bonapartist Military Junta"
 UFRA_popular_front_win:0 "Democracy Prevails"
 UFRA_put_opponents_to_work:0 "Labor Camps"
 UFRA_extensive_conscription:0 "Militarise the Milice"
 UFRA_extensive_conscription_desc:0 "The Milice must be turned into a regular force, like the Germans did with the SS. This will ensure obedience in the Army."
 UFRA_direction_for_interior_security:0 "The Milice Secret Services"
 UFRA_direction_for_interior_security_desc:0 "The Milice has created an efficient network of information. This can be used to our advantage ! We need to officialise their secret services !"
 UFRA_an_army_to_challenge_ger:0 "An army to challenge Germany"
 UFRA_plan_german_betrayal:0 "Plan German Betrayal"
 UFRA_forced_assimilation:0 "Accelerate Assimilation"
 UFRA_forced_assimilation_desc:0 "We need to use those vast lands in Africa to settle the French people. A fine French man is worth 500 of locals. As such we must accelerate the colonisation of those lands, through force and violence."
 UFRA_destroy_us_liberalism:0 "End American Liberalism"
 UFRA_destroy_us_liberalism_desc:0 "From the faraway landsFrom the faraway lands across the Atlantic Ocean, in the New World, comes the new scourge of the world; American Liberalism. But we will not tolerate it anymore !"
 UFRA_modern_knights:0 "Modern Knights"
 UFRA_modern_knights_desc:0 "Our ideal is pure and noble. We will rejuvenate France and save it from moral rot. Fidelity, honor, loyalty, we will stand straight and we will follow our code forever. "
 UFRA_minimum_wage:0 "Minimum Wage"
 UFRA_minimum_wage_desc:0 "The worker is the most vital constituent of the nation. Therefore he must be protected. We will introduce the SMIC, the minimum wage, to help each worker to be able to live comfortably."
 UFRA_vote_for_women:0 "Limited vote for women"
 UFRA_vote_for_women_desc:0 "Women are the backbone of the country. Therefore they must be  allowes to participate in the political life."
 UFRA_the_great_war_model:0 "The Great War model"
 UFRA_the_great_war_model_desc:0 "We are a political movement created by soldiers who saw the Great War. In this dark moment of our history, we saw an efficient model, one to be applied to French Society. One where classes work together, live together and go forward together, side by side, like they did in the trenches."
 UFRA_french_path_to_fascism:0 "The French path to Fascism"
 UFRA_french_path_to_fascism_desc:0 "France will not be just another brand of the blind fanaticism like in Hitler’s Germany. Our Fascism will be pure and efficient, beautifully forged by French passion and will."
 UFRA_crush_the_german_danger:0 "Crush the German danger"
 UFRA_crush_the_german_danger_desc:0 "The main danger of Europe is Germany. It always has been, from Rome to 1870 and 1914. Germany must be stopped once and for all."
 UFRA_power_to_the_military_junta:0 "The Army knows best"
 UFRA_the_napoleon_referundum:0 "The Napoleon Referundum"
 UFRA_the_napoleon_referundum_desc:0 "The heir to Napoleon's throne has been very clear. He won't accept the throne unless the people choose him, through referendum, to have him as their leader."
 UFRA_revise_the_constitution_2:0 "Revise the constitution"
 UFRA_revise_the_constitution_2_desc:0 "The republican constitution was alwas intended to be a stopgap measure that has been allowed to persist for far too long. Now, we will rewrite it to allow a monarch to return."
 UFRA_restore_order:0 "Restore Order"
 UFRA_restore_order_desc:0 "After the coup, France is in chaos. We must re-establish order through military force if necessary."
 UFRA_failed_af_coup:0 "The Failed Coup"
 UFRA_popular_front_victory:0 "Popular Front Victory"
 UFRA_national_bloc_victory:0 "National Bloc Victory"
 UFRA_national_bloc_victory_desc:0 "The political landscape is growing more and more radical by the day. The left whispers of making common cause with the communists. What is needed now is strong, stable leadership."
 UFRA_ban_soviet_lackeys:0 "Ban Soviet Lackeys"
 UFRA_ban_soviet_lackeys_desc:0 "The Communists and some of their SFIO allies are nothing but lackeys under the orders of the Bolshevics. We must stop them."
 UFRA_mouvement_national_laval:0 "Mouvement National"
 UFRA_mouvement_national_laval_desc:0 "To save France from the foreign elements that try to destroy it, a National Movement must be created."
 UFRA_ally_petain:0 "Ally Petain"
 UFRA_ally_petain_desc:0 "We must secure the Lion of Verdun approval, the Old Marshal is a French symbol and will bring legitimacy to our cause."
 UFRA_1935_petains_plan:0 "1935 Petain's Plan"
 UFRA_1935_petains_plan_desc:0 "The 1935 Petain's Plan is a plan that was almost put in effect to rely less on the Maginot Line and more on tanks ! It includes the production of more than 1500 light tanks."
 UFRA_ally_doriot:0 "Ally Doriot"
 UFRA_ally_doriot_desc:0 "Doriot is a former communis that understood that the Nation should be put first. He is a key element of the Leagues and we must secure his alliance."
 UFRA_doriot_work_charter:0 "Doriot Work Charter"
 UFRA_doriot_work_charter_desc:0 "The Work Charter is a new legislation proposed by Doriot. It includes elements close to Italian Fascism and Corporatism."
 UFRA_rally_the_communists:0 "Rally the communists"
 UFRA_rally_the_communists_desc:0 "Rally the communists"
 UFRA_national_popular_rally:0 "National Popular Rally"
 UFRA_national_popular_rally_desc:0 "Some socialists and communists, such as Marcel Déat or Pierre Clementi, understand the need for a National Revolution. They want to create the a breakaway rally from the socialists and communists; the National Popular Rally."
 UFRA_no_compromise_on_socialism:0 "No compromise on Socialism"
 UFRA_continue_popfront:0 "Continue the Popular Front"
 UFRA_no_compromise_soclib:0 "No compromise on Social-Liberalism"
 UFRA_ally_the_republicans:0 "Ally the Federation Republicaine"
 UFRA_christian_democracy_laval:0 "Christian Democracy"
 UFRA_success_mouvement_national:0 "Celebrate Success"
 UFRA_napol_invite_romania:0 "Invite Romania"
 UFRA_napol_invite_hungaria:0 "Invite Hungary"
 UFRA_napol_invite_czechoslovakia:0 "Invite Czechoslovakia"
 UFRA_napol_invest_in_our_weaker_allies:0 "Invest in our weaker allies"
 UFRA_visegrad_conference:0 "§CVisegrad Conference§!"
 UFRA_imperial_cinema_society:0 "Imperial Cinema Society"
 UFRA_modern_empire:0 "L’Empire Moderne"
 UFRA_modern_empire_desc:0 "Napoleon I may have forged the foundations of modern France, but his successors failed to maintain that momentum. Our task now is to adapt the Bonapartist vision to the 20th century: an empire that embraces innovation, efficiency and the state as the driving force of modernization. The Empire shall not be a relic of the past, but the vanguard of the future."
 UFRA_nap_guarantee_constitution:0 "Realpolitik"
 UFRA_i_am_the_state:0 "L'Etat c'est moi"
 UFRA_peoples_emperor:0 "The People’s Emperor"
 UFRA_power_from_above:0 "Power from Above"
 UFRA_rely_on_empire:0 "Rely on our Colonial Empire"
 UFRA_self_sustainability:0 "Strive for self-sustainability"
 UFRA_l_aigle_eternel:0 "L’Aigle Éternel"
 UFRA_l_aigle_eternel_desc:0 "From the banners of Rome to the standards carried by Napoleon, the eagle has always symbolized power, continuity and empire. Now, under a renewed Bonaparte dynasty, France proclaims itself the eternal heir to this legacy. No matter which branch of our imperial destiny we have chosen, all roads converge under the shadow of the eagle’s wings — uniting the nation, restoring its grandeur and declaring to the world that the French Empire shall not be a fleeting chapter of history, but a timeless force."
 UFRA_restore_imperial_prerogatives:0 "Restore Imperial prerogatives"
 UFRA_eternal_discipline:0 "Eternal Discipline"
 UFRA_eternal_discipline_desc:0 "The legacy of Napoleon rests not only on his conquests, but on the iron discipline that bound his empire together. To preserve our imperial stability, we must root out disorder, enforce loyalty and instill an unbreakable chain of command. By strengthening our resolve against rebellion and disunity, the Empire will stand firm against any storm, unshaken and eternal."
 UFRA_control_parliament:0 "End Parliamentarism"
 UFRA_la_grande_armee:0 "La Grande Armée"
 UFRA_la_grande_armee_desc:0 "The Grande Armée of Napoléon I was the most formidable military machine of its age. Its victories at Austerlitz, Jena and Wagram echoed across Europe and cemented France’s place as the leading power of the continent. Today, our forces must be reorganized in the spirit of this tradition—disciplined, modernized and infused with the same audacity that once shook empires. The Grande Armée will march again, and with it, the legend of Napoléon shall live anew."
 UFRA_modern_austerlitz_doctrine:0 "Modern Austerlitz Doctrine"
 UFRA_modern_austerlitz_doctrine_desc:0 "The Battle of Austerlitz, the 'Battle of the Three Emperors,' was Napoléon’s greatest triumph, achieved through cunning deception, rapid maneuver and precise timing. Our generals will study his tactics not as dusty history but as timeless lessons to be adapted to the mechanized battlefield of the 20th century. Swift armored thrusts and air-ground coordination will become the modern incarnation of Napoléon’s genius."
 UFRA_imperial_artillery:0 "Imperial Artillery Corps"
 UFRA_imperial_artillery_desc:0 "Napoléon himself was an artillery officer and he always referred to his guns as the real 'god of war.' By building an elite corps dedicated to firepower, we ensure that our armies can smash through any defense. Massed batteries, modern equipment and doctrines emphasizing mobility will make French artillery once again the hammer of the battlefield."
 UFRA_mobile_firepower:0 "Mobile Firepower"
 UFRA_mobile_firepower_desc:0 "The evolution of artillery has reached a new stage: self-propelled guns. Combining the devastating firepower of heavy artillery with the mobility of armored vehicles, these machines allow us to bring overwhelming force to the battlefield with unprecedented speed. By embracing this doctrine, the army will not only honor Napoleon’s legacy of decisive artillery, but also transform it into a weapon fit for modern warfare."
 UFRA_eagles_of_the_sky:0 "Eagles of the Sky"
 UFRA_eagles_of_the_sky_desc:0 "Where once the eagle standard flew above marching columns, now it will soar in the heavens. The French Air Force must embody the same spirit of daring and innovation that defined Napoléon’s commanders. By expanding our air fleets and investing in cutting-edge technology, we will dominate the skies, ensuring that no enemy can outmaneuver the Empire."
 UFRA_imperial_general_staff:0 "Imperial General Staff"
 UFRA_imperial_general_staff_desc:0 "Napoléon’s genius was amplified by his meticulous planning and his corps of capable marshals. Today, we will establish a centralized Imperial General Staff that embodies this legacy. With coordinated planning, professionalized leadership and loyalty to the Emperor, the French army will once again be unmatched in discipline and effectiveness."
 UFRA_la_garde_meurt:0 "La Garde Meurt, Elle Ne Se Rend Pas"
 UFRA_la_garde_meurt_desc:0 "‘The Guard dies, it does not surrender.’ This legendary phrase attributed to the Old Guard at Waterloo still resonates today. By instilling this spirit of unyielding resolve into our soldiers, we will ensure that every Frenchman fights with the honor and courage of the Imperial Guard, refusing to yield no matter the odds."
 UFRA_voltigeurs_parachutistes:0 "Voltigeurs Parachutistes"
 UFRA_never_another_trafalgar:0 "Never another Trafalgar"
 UFRA_parade_under_brandeburg_gate:0 "Parade under the Brandeburg Gates"
