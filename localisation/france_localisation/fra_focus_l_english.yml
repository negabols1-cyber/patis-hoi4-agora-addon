 UFRA_our_own_cossacks:0 "Our own Cossacks"
 UFRA_central_america_for_mexico:0 "Turn to Central-America"
 UFRA_napol_grab_quebec:0 "Save Quebec"
 UFRA_napol_grab_louisiana:0 "Take back Louisiana"
 UFRA_restore_mexican_possessions:0 "Restore Mexican Possessions"
 UFRA_middle_east_conquest:0 "Middle-East Operations"
 UFRA_second_ottoman_campain:0 "Second Ottoman campaign"
 UFRA_befriend_turkey:0 "Befriend Turkey"
 UFRA_irak_deal:0 "The Irak deal"
 UFRA_sword_of_islam:0 "Sword of Islam"
 UFRA_catholic_missions:0 "Catholic Missions"
 UFRA_americas_conquest:0 "Americas Operations"
 UFRA_european_conquest:0 "European Operations"
 UFRA_german_federations:0 "German Confederations"
 VIC_armistice_with_germany:0 "Armistice with germany"
 VIC_armistice_with_germany_desc:0 "In these painful hours, I think of the unfortunate refugees who roam our roads. I express to them my compassion and concern. It is with a heavy heart that I say to you today that the fight must be stopped. I spoke last night to the adversary to ask him if he is ready to seek with us, between soldiers, after the fight and in honor, the means of putting an end to the hostilities."
 VIC_control_newspapers:0 "Contrôler les journaux"
 VIC_control_newspapers_desc:0 "Les journaux ont dégénerés et devenus anti-français, excepter quelques uns. A partir de maintenant seul le gouvernement validera les journaux qui seront publiés."
 UFRA_VIC_chantiers_jeunesse:0 "Control the Newspapers"
 UFRA_VIC_chantiers_jeunesse_desc:0 "Newspapers in France are degenerates and anti-France, except for a few. From now on, only government  validated journals will be published."
 UFRA_VIC_put_opponents_to_work:0 "Delivere to Germany opponents of the state"
 UFRA_VIC_put_opponents_to_work_desc:0 ""
 VIC_crush_political_dissent:0 "Crush Political Dissent"
 VIC_crush_political_dissent_desc:0 "We are in power, but numerous are those that lurk in the shadows, waiting for us to show any form of weakness. We won't give them the chance."
 UFRA_VIC_aids_for_families:0 "Aids for Families"
 UFRA_VIC_aids_for_families_desc:0 "Families are the ciment of the nation. Aids will ensure strong families and will encourage parents to have more children."
 UFRA_VIC_ideological_fanaticism:0 "Political Education"
 UFRA_VIC_ideological_fanaticism_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
 UFRA_adobt_APCR:0 "Adopt APCR"
 UFRA_adobt_APCR_desc:0 "Edgar Brandt's company proposes to improve the anti-tank capabilities of our guns by firing shells smaller than the caliber of the gun, improving shell penetration."
 UFRA_VIC_light_medium_armor:0 "Maintain tank know-how"
 UFRA_VIC_light_medium_armor_desc:0 "The Germans forbid us to build heavy equipment, but we absolutely have to maintain our know-how in this area so as not to fall too far behind. We just have to do it discreetly..."
 UFRA_return_to_swiss:0 "Restore the Helvetic Republic"
 UFRA_return_to_swiss_desc:0 "Switzerland must cease to exist in it's current form! She is too far from the regime set up by my great-great uncle, and even stole territories from us after his defeat."
 UFRA_vichyfascist_win:0 "Defeat - Vichy"
 UFRA_vichyfascist_win_desc:0 "Can be taken if France is in an alliance and capitulates to Germany. When the tree is completed, it leads back to the Fascist tree"
 UFRA_free_france_win:0 "Defeat - Free France"
 UFRA_free_france_win_desc:0 "Can be taken if France is in an alliance and capitulates to Germany. When the tree is completed, it leads back to the Democratic tree"
 FRA_cooperation_with_the_royalists:0 "Cooperate with the Royalists"
 FRA_cooperation_with_the_royalists_desc:0 "Although they don't all approve of our ideas, many would rather join the fight with us than cooperate with the enemy."
 FRA_char_de_la_liberation:0 "Chars de la libération"
 FRA_char_de_la_liberation_desc:0 "''Crushed today by a mechanical force, we will vanquish in the future with a superior mechanical force. The destiny of the world is there.'' -Charles de Gaulles"
 FRA_2eme_db:0 "Create the Divisions Blindées"
 FRA_2eme_db_desc:0 "Despite very poor equipment, the Leclerc column in the service of the FFL was able to work miracles against the Axis forces. The only thing they lack to be truly formidable is modern equipment."
 FRA_foreign_legion_loyalty:0 "Promote the Foreign Legion"
 FRA_foreign_legion_loyalty_desc:0 "Europeans of all nationalities are affected by the conflict, and sometimes their countries do not have the means to fight for a just cause. We must give them this means through the foreign legion."
 FRA_corps_expeditionnaire_france_talie:0 "French Expeditionary Force in Italy"
 FRA_corps_expeditionnaire_france_talie_desc:0 "The allied armies are in constant lack of infantry in their attacks on the mountainous regions of Italy. A commitment of our forces could reinforce our legitimacy."
 FRA_commissaire_republic:0 "Republic Commissioners"
 FRA_commissaire_republic_desc:0 "The allies plan to install a military administration in the liberated territories of the metropolis. To let them do so would be to risk our political independence. We must prepare commissioners of the republic who will have to restore republican legality and the authority of the state as soon as a territory is liberated."
 FRA_operation_torch:0 "French High Commission in Africa"
 FRA_operation_torch_desc:0 "Many French supports the National Revolution of Vichy, but some do not approve of collaboration with Germany and would like to resume the fight, but refuses to be under De Gaulle's orders... With the fall of Algeria, the allies are trying to set up a new regime that is more docile than ours. If we want a united France, we will have to work with them..."
 FRA_follow_darlan:0 "Join François Darlan"
 FRA_follow_darlan_desc:0 "Despite its policy of collaboration with Germany, Darlan remains, according to the allies, a logical choice. His career as head of government under Marshal Pétain gives him great legitimacy, and according to Constitutional Act No. 4, he would be the legitimate successor of the Marshall, even if he is disavowed by Vichy."
 FRA_impossibles_odds:0 "The impossible balance of power"
 FRA_impossibles_odds_desc:0 "Darlan believed in the establishment of a new world order dominated by Germany and in which France had to find its place. But the incredible show of strength of the Allied troops made him change his mind. Germany will lose and all the French must resume the fight!"
 FRA_clark_darlan:0 "Sign the Clark-Darlan agreements"
 FRA_clark_darlan_desc:0 "The allies wish upon France liberation to set up a military government under their supervision, before putting in place a democratic government. But they would be ready to cancel their plans if we cooperate, giving them special rights to manage our Empire."
 FRA_discredit_gaulle:0 "Discredit De Gaulle"
 FRA_discredit_gaulle_desc:0 "Even if his intentions are noble, General De Gaulle remains a puppet dictator of London, monopolizing our colonies and massacring our men for a false “freedom”. This man and his followers need to be arrested."
 FRA_continue_the_national_revolution:0 "Carry on the National Revolution"
 FRA_continue_the_national_revolution_desc:0 "We, High Commissioner of France residing in Africa acting on behalf of the Marshal. For many French people in North Africa, if the National Revolution had not existed, it would have been necessary to invent it!"
 FRA_follow_giraud:0 "Elect Henri Giraud"
 FRA_follow_giraud_desc:0 "Giraud is favorable to Vichy, but having been detained by the Germans, he refuses collaboration and is a source of aspiration for many French people. The allies wanted to put him in power in Africa, but Darlan's status was much more useful when he was captured in Algiers. But with his recent assassination, Giraud could be elected to regain power."
 FRA_work_with_right_resistant:0 "Work with right-wing resistant"
 FRA_work_with_right_resistant_desc:0 "Many want to resume the fight, but refuse the Free France of Charles de Gaulle and the collaborationist attitude of François Darlan. But everyone is rallying around Henri Giraud now that he is in power."
 FRA_split_power_with_de_gaulle:0 "Create the French Committee for National Liberation"
 FRA_split_power_with_de_gaulle_desc:0 "Charles de Gaulle insists on the fusion of Free France and the French Civil and Military Commander-in-Chief. He wishes to constitute with Giraud a French central power with governmental attributions, until all the French people have been able to be consulted to construct a new government."
 FRA_giraud_governs:0 "Emile Muselier Putch"
 FRA_giraud_governs_desc:0 "Emile Muselier in the service of Giraud announces that the Summer Palace was targeted by a conspiracy of Gaullists of Algiers. He brought to Algiers a regiment of Senegalese and a regiment of Chasseurs d'Afrique and had all the exits of the city occupied. This could be the start of a putsch against De Gaulle..."
 FRA_one_goal_victory:0 "One goal, Victory"
 FRA_one_goal_victory_desc:0 "'' One goal, Victory '', this formula of Henri Giraud underlines the primacy he gives to military questions, and to evade political questions. Thus, he would have answered a question from a journalist: '' Sir, I am a soldier, I do not do politics ''."
 FRA_brazville_conference:0 "Brazzaville Conference"
 FRA_brazville_conference_desc:0 "The conflict, a factor of many difficulties for the local populations, has seen in French North Africa the development of nationalist aspirations and tensions between communities. Furthermore, we have to deal with the United States, which makes no secret of its opposition to colonialism. We must take the lead and prepare the future of our colonies for the post-war period"
 FRA_combine_africa_army:0 "Create the French Liberation Army"
 FRA_combine_africa_army_desc:0 "We must put our differences aside and definitively merge the Free French Forces and the African Army."
 FRA_follow_king:0 "Murder Darlan"
 FRA_follow_king_desc:0 "The regency of François Darlan is unacceptable. The admiral is convinced of the benefits of the National Revolution and has introduced discriminatory laws in Algeria. We must take advantage of the chaos in the territory to assassinate and replace him."
 FRA_communist_no_king_no_gaulle:0 "Communist uprising"
 FRA_communist_no_king_no_gaulle_desc:0 "It was always when the country was at its lowest that our ideas were the greatest. As in the French Revolution and the Commune, it is the loss of a figurehead that starts everything. Formerly Louis XVI and Napoleon III, today François Darlan!"
 FRA_gaulle_giraud_king:0 "Restore the Monarchy"
 FRA_gaulle_giraud_king_desc:0 "In these troubled times, France needs a strong and unifying leader. We don't need a new emperor in the person of Marchéal Pétain, we need a return of monarchs!"
 FRA_end_with_the_revolution_national:0 "Ending the National Revolution"
 FRA_end_with_the_revolution_national_desc:0 "It is time to put an end to the hateful ideology of the Vichy regime. This is the beginning of a new political era for our people!"
 FRA_the_new_kingdom:0 "A New Kingdom"
 FRA_the_new_kingdom_desc:0 "A New Kingdom"
 UFRA_imperial_welfare:0 "Imperial Welfare"
 UFRA_imperial_welfare_desc:0 "The Empire is not built on marble halls alone, but on the well-being of its people. By introducing social reforms, pensions, and improved labor rights, we shall ensure loyalty to the throne is secured not by fear, but by prosperity. A content and secure populace will stand firmly behind the Emperor’s vision."
 UFRA_imperial_war_industry:0 "Imperial War Industry"
 UFRA_imperial_war_industry_desc:0 "To safeguard the Empire, we must harness the full might of our industry for war. Factories shall be converted, new arms plants constructed, and resources diverted to feed the Imperial war machine. The Empire shall be prepared for any conflict, with industry serving as the forge of victory."
 UFRA_an_empire_of_progress:0 "An Empire of Progress"
 UFRA_an_empire_of_progress_desc:0 "We must demonstrate that Bonapartism is not bound to the glories of the battlefield alone. Industry, welfare, education, and science — all must flourish under imperial guidance. This Empire of Progress shall not only dominate militarily but also lead the world in modern development, proving that the imperial eagle soars higher than ever."
 UFRA_bonapartist_infrastructure_program:0 "Bonapartist Infrastructure Program"
 UFRA_bonapartist_infrastructure_program_desc:0 "A strong empire is built not only on armies but also on roads, bridges and railways. Following the spirit of Napoleon I’s great civil projects, we shall launch a new wave of construction across France. This ambitious infrastructure program will bind the nation together, accelerate commerce, and showcase the dynamism of the Bonapartist state."
 UFRA_haussmanns_legacy:0 "Haussmann’s Legacy"
 UFRA_haussmanns_legacy_desc:0 "Baron Haussmann reshaped Paris into a capital worthy of an empire, a city of grandeur and modernity. By reviving his legacy, we will continue the work of transforming our cities into shining symbols of French progress. Wide boulevards, efficient transport, and monumental architecture will inspire our citizens and proclaim the strength of the Empire to the world."
 UFRA_commandant_supreme:0 "Commandant Suprême"
 UFRA_commandant_supreme_desc:0 "Napoleon VI follows in the footsteps of his forebears by not only claiming the throne but also assuming the supreme command of the French Army. While strategic details remain in the hands of his generals, the Emperor’s personal presence at the frontlines inspires the soldiers, bolsters morale and unites the army as a living embodiment of the nation’s spirit."