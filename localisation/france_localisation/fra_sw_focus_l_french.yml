l_french:
 #### French Secret Weapon Mod Section ####
 UFRA_create_dga:0 "Fonder la DMA"
 UFRA_create_dga_desc:0 "Avec la création de nouveaux centres de recherches, créer une délégation spécialisée dans la préparation des futurs systèmes de défense français nous aidera à utiliser efficacement les nouvelles technologies d’armement."
 UFRA_super_heavy:0 "Plans de Chars Supers Lourds"
 UFRA_super_heavy_desc:0 "Les canons antichars sont de plus en plus efficace, rendant nos chars obselète. Nous pouvons remédier à se problème en créant des chars supers lourds. Blindage épais, canon surpuissant et mitrailleuses de toute part sont leurs caractéristiques. Notre expérience sur les Char 2C nous permetra de créer se genre de char dans les plus bref délais."
 UFRA_autoloader:0 "Rechargement a barillet"
 UFRA_autoloader_desc:0 "Nos ingénieurs ont mis au point un système capable de drastiquement réduire le temps de rechargement d’un char. Inclure ce système sur nos chars serait un gros plus pour notre armée."
 UFRA_create_matra:0 "Militarisé la CAPRA"
 UFRA_create_matra_desc:0 "La Compagnie Anonyme de Production et Réalisation Aéronautique a une industrie parfaitement capable de créer des avions de chasse. En les finançants et en changeant leurs objectifs, nous pourrons renforcer notre industrie!"
 UFRA_capture_german_rocket:0 "Engagé les scientifiques allemands"
 UFRA_capture_german_rocket_desc:0 "Les allemands ont fait des avancés majeurs dans la fuséologie. En les engageants, nous pourrons nous aussi faire de grande avancées." 
 UFRA_rocket_try:0 "Financer la recherche spatiale"
 UFRA_rocket_try_desc:0 "Nous pensons que le domaine spatiale pourrait nous être utile, que se soit dans le domaine militaire ou civile. Si on peut envoyer des objet en orbite, alors pourquoi pas les envoyer chez nos voisins ?"
 UFRA_missile:0 "Fuséologie Avancée"
 UFRA_missile_desc:0 "Nous avons fait de grande avancée dans le domaine des fusées et des roquettes. En assignant MATRA a la fabrication de ses roquettes, nous pourrons bénéficier d'un énorme avantage sur nos ennemis."
 UFRA_launch_site:0 "Sites de lancement dans les colonies"
 UFRA_launch_site_desc:0 "Pour nos opérations futures, nous aurons besoin d'avoir des sites de lancement. Les créer dans nos colonies serait la meilleur option."
 UFRA_space:0 "Lancer des Satellites Espions"
 UFRA_space_desc:0 "En envoyant en orbite basse des satellites équipés d'appareils photos, nous pourrons espionner nos ennemis est obtenir un avantage collosal."
 UFRA_nuk_alone:0 "Mener la recherche atomique Seul"
 UFRA_nuk_alone_desc:0 "Des scientifiques du Collège de France a observé que lors d'une fission dans un noyau d'uranium, des neutrons supplémentaires sont émis et suggère qu'une réaction en chaîne auto-entretenue est possible. Cela implique qu'on pourrait théoriquement créer un explosif extrêmement puissant. Il nous faut cette arme, mais il serait préférable que seul nous y ayont accès."
 UFRA_nuk_toge:0 "Coopération Scientifique nucléaire"
 UFRA_nuk_toge_desc:0 "Des scientifiques du Collège de France a observé que lors d'une fission dans un noyau d'uranium, des neutrons supplémentaires sont émis et suggère qu'une réaction en chaîne auto-entretenue est possible. Cela implique qu'on pourrait théoriquement créer un explosif extrêmement puissant. Une telle arme serait longue a dévelopé, ainsi mieut vaudrais rallier nos alliés sur se projet."
 UFRA_nuke:0 "Préparer le test de la bombe"
 UFRA_nuke_desc:0 "Nos investisment n'ont pas étais en vain. Notre prototype de bombe est prêt mais il faut encore la testé. Et pour cela, il faut trouver et préparer un site pour le test..."
 UFRA_gerboise:0 "Gerboise bleu"
 UFRA_gerboise_desc:0 "Le Sahara d'Algérie semble être un site parfait pour le test, il est proche de la métropole et il n'y a rien a part du sable. Plus vite nos test seront fait, mieux ce sera."
 UFRA_alde:0 "Aldébaran"
 UFRA_alde_desc:0 "L'atoll de Mururoa et lointain de la métropole mais peu habitée. La composition du terrain nous permetterait de faire des test supplémentaire, essentiel pour améliorer notre compréhension de cette arme."
 UFRA_jet_effort:0 "Développement du moteur à réaction"
 UFRA_jet_effort_desc:0 "Proposé par René Lorin en 1913, le moteur a réaction pourrait conférer a un avion une vitesse inégalée, un avantage certains dans un combat aérien. Un certains René Leduc est prêt a travaillé sur ce projet. Donnons lui une chance."
 UFRA_dassault:0 "Contrat avec Dassault"
 UFRA_dassault_desc:0 "La Société de Marcel Bloch semble porté un certains intérêt sur les avions a réaction. Proposont lui un contrat et voyont donc si son prototype vol."
 UFRA_quad:0 "Tourelle Quadruple"
 UFRA_quad_desc:0 "Avec les traités navaux, la taille et le poids de nos navires sont limités. Mais nous avons une solution. En installant 4 canon dans une seul tourelle, nous pouront obtenir une excellente puissance de feu sans augmenter la taille où le poids de nos navires."
 UFRA_dorand:0 "Financé le Dorand G.20"
 UFRA_dorand_desc:0 "Un ingénieur du nom de René Dorand travaille sur un gyroplane pour notre sous-marin Surcouf. Financer son gyroplane pour le reste notre marine serait une solution avantageuse, nous pourront l'utiliser pour la reconnaisance et pour la lute anti-sous-marine."
 UFRA_amx_our:0 "Nationaliser AMX"
 UFRA_amx_our_desc:0 "Les Ateliers de construction d'Issy-les-Moulineaux ont une bonne expérience avec les chars. Nationaliser cette industrie nous permetra de produire nos char de manière plus rationnelle."
 UFRA_newgun:0 "Développer un Canon Moderne"
 UFRA_newgun_desc:0 "Nos ennemies ne cesses d'accroître le blindage de leurs chars, il nous faut développer des canons antichars encore plus puissant si nous voulons les percer."
 UFRA_ger_armor:0 "S'inspirer des chars allemands"
 UFRA_ger_armor_desc:0 "Nos voisins allemands ont une très grande avancé dans les chars lourds. S'inspirer d'eux nous aiderait grandement."
 UFRA_new_mbt:0 "Développement de Char Moderne"
 UFRA_new_mbt_desc:0 "Avec toute nos avancées dans les blindées, nous sommes en capacité de créer un tout nouveaux type de char, combinant blindage lourd, canon puissant et vitesse élevée."
 UFRA_adobt_APCR:0 "Adopter les obus fléches"
 UFRA_adobt_APCR_desc:0 "La société d'Edgar Brandt propose d'améliorer les capacités anti-chars de nos canon en tirant des obus plus petit que le calibre du canon, améliorant la pénétration de l'obus"
 
