l_english:
u_fra.146.t:0 "Mass Protest"
u_fra.146.d:0 "Political impotence and economic problems in the country lead to massive protests and conflicts. This affects both our production and our industry very badly. Swords have been drawn in Europe, we must get rid of our economic problems as soon as possible."
u_fra.146.a:0 "Oh, god."
 MINIMIZE_EVENT:0 "§GClick§! to Minimize. Event will be placed in the Event Queue under §HEvents and Decisions§!."
 u_fra.1.t:0 "The Vienot agreements"
 u_fra.1.d:0 "In 1934, France attempted to impose a treaty of independence that was heavily prejudiced in its favor. It promised gradual independence but kept the Syrian Mountains under French control. The Syrian head of state at the time was a French puppet, Muhammad 'Ali Bay al-'Abid. Fierce opposition to this treaty was spearheaded by senior nationalist and parliamentarian Hashim al-Atassi, who called for a sixty-day strike in protest. Atassi's political coalition, the National Bloc, mobilized massive popular support for his call. Riots and demonstrations raged, and the economy came to a standstill. [FRA.GetLeader] agreed to recognize the National Bloc as the sole legitimate representative of the Syrian people and invited Hashim al-Atassi to independence negotiations in Paris. He traveled there on March 22, 1936, heading a senior Bloc delegation. The resulting treaty called for immediate recognition of Syrian independence as a sovereign republic, with full emancipation granted gradually over a 25–year period."
 u_fra.1.a:0 "They deserve it !"
 u_fra.2.t:0 "An decisive choice"
 u_fra.2.d:1 "Now that France is under our control, we need to erode the decadence and stop the moral decay. For that higher moral values and divine punishments are the best solution. The obvious choice is to declare State Catholicism, because France is the Eldest Daughter of the Church, and most of the Church will agree with our ideas. But a few voices have been heard preaching the return to older Gods. To the religion of the Celts, of the Gallic people, our ancestors. Toutatis, Esus and Taranis. This is a bold move, and not a popular one, but it could pay off. What should we do ?"
 u_fra.2.a:0 "France, Europe, Chrétienté!"
 u_fra.2.b:0 "Par Toutatis!"
 u_fra.3.t:0 "Destroying republican symbols"
 u_fra.3.d:0 "Burning pictures and destroyed effigies were the sight to see in Paris today. In a passionate speech, [FRA.GetLeader], abolished the 14 of July and Marianne, and instead declared the consecration of France to the Sacred Heart of Jesus and Sainte Jeanne-d'Arc."
 u_fra.3.a:0 "To Hell with the Republic !"
 u_fra.4.t:0 "A very secret service"
 u_fra.4.d:1 "In a very confidential meeting, [FRA.GetLeader] has concluded with the French General Staff, that the government was in dire need of an Intelligence Service. It was decided that it would be divided in two branches, BCRA and DGER. The Direction Générale des Etudes et Recherches, or General Directorate for Studies and Research, is France's external intelligence agency, focused on external intelligence and covert operations. Bureau Central de Renseignements et d'Action, or Central Bureau of Intelligence and Operations, main goal is to ensure safety on French territory, counter foreign influence and to combine both police and political roles. We know have a surplus of budget, to which on should it go ?"
 u_fra.4.a:0 "DGER"
 u_fra.4.b:0 "BCRA"
 u_fra.5.t:0 "Our industry focus"
 u_fra.5.d:1 "To catch up on foreign industry, it was decided to increase investments in one branch of our industry. This should allow a huge increase in production, but which branch should it go to ?"
 u_fra.5.a:0 "A gun for every man !"
 u_fra.5.b:0 "We will overwhelm them by speed !"
 u_fra.5.c:0 "Our firepower will crush them !"
 u_fra.6.t:0 "Changing the capital ?"
 u_fra.6.d:1 "As Europe is now united under our flag, some people close to [FRA.GetLeader] have brought to him a problem. Should the capital be changed ? Some people argue that as the new Roman Empire, the new capital should be Rome. Others argue that the continental capital should be Moscow, because it is the center between Asia and Europe. But most say that Paris, our current and beautiful capital, should be the New Rome. What should we choose ?"
 u_fra.6.a:0 "Paris of course !"
 u_fra.6.b:0 "Rome, the cradle of Europe"
 u_fra.6.c:0 "Moscow, the center between Asia and Europe"
 u_fra.7.t:0 "Code Civil"
 u_fra.7.d:0 "In a effort to emulate his ancestor, Napoleon VI has created a new Code Civil, establishing the new rules of his Empire. This move was regarded by his supporters as a revolution, while his opponents argue it was an empty move only to boost his popularity."
 u_fra.7.a:0 "Still better than nothing..."
 u_fra.8.t:0 "Am Empire from the West to the East"
 u_fra.8.d:0 "Today, after years of war and sacrifices, France has finally united Europe. In one of the most viewed speech in history, [FRA.GetLeader] declared the unity of brothers from the Atlantic to the Urals, comparing the French people to the like of Alexander, Julius Caesar, Clovis and Charlemagne. Protests are said to have erupted in various parts of Germany, Poland and Russia, but French Gendarmerie is said to have them under control."
 u_fra.8.a:0 "From the Atlantic to the Urals !"
 u_fra.9.t:0 "The natural borders of France"
 u_fra.9.d:0 "Finally the moment has come. French Occupation in the Low Lands has come to an end, and integration has begun. The military has left and was replaced by French police. Administrative buildings were converted to allow the newly integrated citizens to get French Nationality. In Flanders, people are said to be more reluctant than in Wallonie, but overall the integration is seemingless."
 u_fra.9.a:0 "Welcome to our new brothers !"
 u_fra.10.t:0 "Debut of the construction of the Trans-Sahara"
 u_fra.10.d:0 "Today, in Algiers, a pompous ceremony was held, led by [FRA.GetLeader]. He launched the construction of the Trans-Sahare, a railway from Algiers to Dakar. Representatives and press from all over the world were there. This move was greatly saluted, and is sure to increase prosperity in the French Colonial Empire in Africa."
 u_fra.10.a:0 "A true wonder !"
 u_fra.11.t:0 "The Trans-European"
 u_fra.11.d:0 "This morning, in a very anticipated ceremony, [FRA.GetLeader] launched the construction of the Trans-European, a railway from Paris to Moscow going through all European capitals. While it will take years to finish, this project will bring together European brothers like never before, and will improve French control over its Empire."
 u_fra.11.a:0 "Europe is finally united !"
 u_fra.12.t:0 "The Sahara Census"
 u_fra.12.d:0 "Our vast African territories are full of resources and manpower. But the sad reality is that not all our saharan territories are well known. It is time to send teams to map and get information from the heart of the desert."
 u_fra.12.a:0 "Conscript them !"
 u_fra.12.b:0 "Leave them be..."
 u_fra.13.t:0 "The Indochina War"
 u_fra.13.d:0 "0830 this morning, Vietnamese rebels captured different colonial administration buildings across our territories in Indochina. They waved a red flag with a yellow star, to show their allegiance to Marxism. A few loyalist militias and colonial security guards have risen to crush the rebellion, but it seems to be bigger than anything we had to face before."
 u_fra.13.a:0 "Those blasted traitors !"
 u_fra.14.t:0 "Anti-Unification Protests"
 u_fra.14.d:0 "Following the announcement of the unification of Europe, protests have erupted. Nationalist and regionalist groups, in Ukraine, Russia, Poland, Belarus, Germany and Austria are steering them ! Despite our Gendarmerie's best efforts, they seem to be getting out of control, and something needs to be done before it escalates to civil war! "
 u_fra.14.a:0 "Our only option is to abandon the unification !"
 u_fra.14.b:0 "We will deal with them !"
 u_fra.16.t:0 "[From.GetNameDefCap] Demand European Unification"
 u_fra.16.d:0 "[From.GetNameDefCap] has called a meeting of European nations today to discuss a European Federal State ! [FRA.GetLeader] pleaded for peace in Europe and the formation of a global superpower. What shall we vote ?"
 u_fra.16.a:0 "Great idea !"
 u_fra.16.b:0 "A madman renting !"
 u_fra.17.t:0 "[From.GetNameDefCap] accept unification"
 u_fra.17.d:0 "After long talks, an agreement was reached with the [From.GetNameDefCap] government. They decided to join the European Federal State as a full member."
 u_fra.17.a:0 "Wonderful"
 u_fra.18.t:0 "[From.GetNameDefCap] sends ultimatum"
 u_fra.18.d:0 "[From.GetNameDefCap] has asked us to surrender our territories and navy to them, to secure their northern borders."
 u_fra.18.a:0 "We have no choice..."
 u_fra.18.b:0 "Death before dishonor !"
 u_fra.19.t:0 "[From.GetNameDefCap] surrenders"
 u_fra.19.d:0 "[From.GetNameDefCap] accepts our ultimatum."
 u_fra.19.a:0 "Good choice"
 u_fra.20.t:0 "[From.GetNameDefCap] refuses"
 u_fra.20.d:0 "[From.GetNameDefCap] refuses our ultimatum."
 u_fra.20.a:0 "The fools..."
 u_fra.21.t:0 "The Molotov-Ribbentrop pact"
 u_fra.21.d:0 "Foreign ministers of Germany and USSR asked us today to join the negotiations as observers. This was of course not a move out of kindness. Berlin is hoping that we won't intervene if they decide to move against Poland. Meanwhile, Moscow strongly suggested we accept to not intervene and respect the pact, and to increase our diplomatic relations with them."
 u_fra.21.a:0 "Very well !"
 u_fra.21.b:0 "Unacceptable !"
 u_fra.25.t:0 "France Offers Support for Monarchist Coup"
 u_fra.25.d:0 "[From.GetNameDefCap] has approached pro-monarchy and anti-fascist elements of the Italian government and the underground with plans for the assassination of Mussolini and the institution of Victor Emmanuel III as leader of the nation. The French ensure us they can handle the assassination; all we have to do is affirm our willingness to create a replacement government, and to pledge our future military support to France endeavours."
 u_fra.25.a:0 "We must look to the Monarchy in the time ahead."
 u_fra.25.b:0 "Preposterous! We will never abandon our ways!"
 u_fra.26.t:0 "[From.GetAdjective]s Accept Coup Proposal"
 u_fra.26.d:0 "Elements in the [From.GetAdjective] government and underground have accepted our proposal for a coup. They are making preparations for a swift siezure of power for the King, as soon as the assassination has happened."
 u_fra.26.a:0 "We can set our plans in motion."
 u_fra.27.t:0 "[From.GetAdjective]s Reject Coup Proposal"
 u_fra.27.d:0 "The elements of the [From.GetAdjective] government and underground we contacted have told us, in not too gentle terms, that they are uninterested in our proposal for a coup. They have threatened to reveal our plans to the Italian government if we dare make the same offer again."
 u_fra.27.a:0 "How unfortunate."
 u_fra.28.t:0 "French Assassination of Mussolini"
 u_fra.28.d:0 "The French plan has been put in action and Mussolini was shot in his car in the streets of Rome today. King Victor Emmanuel III has taken the reins of the nation, and has pledged to join the French Alliance alongside [From.GetNameDef]."
 u_fra.28.a:0 "We must show our gratitude."
 u_fra.29.t:0 "Mussolini Assassination Succeeds"
 u_fra.29.d:0 "Our plan has been executed flawlessly, and Victor Emmanuel III has taken up the mantle of leadership of his nation. His first act was to sign a treaty ensuring Italian entry into the Central Powers alliance."
 u_fra.29.a:0 "The monarchies shall rise again!"
 u_fra.30.t:0 "The Holy Land"
 u_fra.30.d:0 "For the first time in almost 700 years, the Crusader State has been re-established. After a ceremony and a mass in the Church of the Holy Sepulchre, the French government declared that this is what should have been done in 1919, and that only the weak and corrupt democracies and League of Nations prevented that. [FRA.GetLeader] finished the ceremony by declaring the Tenth Crusade a success."
 u_fra.30.a:0 "Non Nobis Domine !"
 u_fra.31.t:0 "The Laval-Hoare Pact"
 u_fra.31.d:0 "Last december, a scandal has erupted. Pierre Laval tried to secretly negotiate with England and Italy, abandoning Abyssina. The proposal ignited a firestorm of hostile reaction in Britain and France and never went into effect. This scandal made Pierre Laval very unpopular, with the people and with fellow politicians."
 u_fra.31.a:0 "Scandaleux !"
 u_fra.32.t:0 "1936 Elections"
 u_fra.32.d:0 "French legislative elections to elect the 16th legislature of the French Third Republic are held this month. People are massively going to the poll. This could be the turning point of our country."
 u_fra.32.a:0 "Let's hope nothing will interfere"
 u_fra.33.t:0 "Historical Maginot"
 u_fra.33.d:0 "Activate the Historical Maginot Mod ? It aims for a more historical experience on the Maginot Line, and more fortification decisions"
 u_fra.33.a:0 "Yes !"
 u_fra.33.b:0 "No !"
 fra_news.1.t:0 "Exposition Internationale des Arts et Techniques dans la Vie Moderne"
 fra_news.1.d:0 "The Exposition Internationale des Arts et Techniques dans la Vie Moderne (International Exposition of Art and Technology in Modern Life) has begun in Paris, France. Two of the most notable pavilions are those of Nazi Germany and the Soviet Union. Speer's pavilion is culminated by a tall tower crowned with the symbols of the Nazi state, conceived as a monument to "German pride and achievement". The architect of the Soviet pavilion is Boris Iofan. It is topped by 'Worker and Kolkhoz Woman', a large statue meant to symbolize the union of workers and peasants."
 fra_news.1.a:0 "Amazing"
 fra_news.1.b:0 "A great moment for France!"
 u_fra.34.t:0 "The Palace Question"
 u_fra.34.d:0 "Now that a monarch rules once again on France, the question is, where shall he rein over France ? The Elysée Palace was, under the Republic, the official Presidential House. But under the Bourbon Restoration, the Palais-Royal was the place where the king would rule. Under this Second Restauration, what shall be the monarch home ? Elite Palace Guards are ready to move and protect the new palace once the decision is taken."
 u_fra.34.a:0 "Keep the Elysée Palace"
 u_fra.34.b:0 "The Palais-Royal"
 u_fra.35.t:0 "Honor the Vendeans"
 u_fra.35.d:0 "Some of our subjects have taken upon themselves to celebrate the Vendeans Wars, as Monarchy is finally back in France. Vendeans and Chouans soldiers fought against the Revolution, against all odds, to defend the King, France and God. Their memory can finally be properly honored today."
 u_fra.35.a:0 "Pour Dieu, la France, le Roy !"
 u_fra.36.t:0 "The AF attacks Blum"
 u_fra.36.d:0 "As political violences continues in France, Léon Blum, the prominent SFIO leader, was ragged from a car and almost beaten to death by the Camelots du Roi. The group's parent organisation, the right-wing Action Française league did not claim the attack. They instead took an opposite stand, and blamed Blum. They claim that Blum was insolent and provoked them. But the main thinker of the Action Française, Charles Maurras had clearly called for violence, or worse, to be committed against Blum. Numerous are those who call for the Action Française to be banned."
 u_fra.36.a:0 "They cannot be blamed for that"
 u_fra.36.b:0 "Ban this heinous movement !"
 u_fra.37.t:0 "The Popular Front"
 u_fra.37.d:0 "The Popular Front is an alliance of left-wing movements, including the communist French Section of the Communist International (SFIC, also known as the French Communist Party), the 'Socialist French Section of the Workers' International (SFIO) and the progressive Radical-Socialist Republican Party. But this alliance is fragile, and communists are making many demands, more and more radical. If we give in to their demands, our chances to be elected could rise up, but it is a dangerous deal. What will it be ?"
 u_fra.37.a:0 "Agree to closer relation with PCF and SFIC"
 u_fra.37.b:0 "No compromise, the Front will stay as it is !"
 u_fra.38.t:0 "Prime Minister Elections"
 u_fra.38.d:0 "As we re-established the elections, the French people elected this month their first Prime Minister to serve the King. With the loss in 1936, the Popular Front dissolved and Blum, the leader of the Socialist party (SFIO), and Daladier, the progressive Republican Party, are both well endorsed candidates. But one unexpected candidate has shown himself after the rise of the Monarchy. It is Georges Valois, 'The Anarchist converted to Royalism', as the King puts him himself. He was, years ago, appointed by the King to serve as a counsellor of the Prince and heir. He was now a known supporter of fascism, and of anarchism, but he declared that he only wishes to serve Frances."
 u_fra.38.a:0 "Blum and the SFIO"
 u_fra.38.b:0 "Daladier and the Parti Radical"
 u_fra.38.c:0 "Georges Valois, the Prince's Man"
 u_fra.39.t:0 "Buying American Planes"
 u_fra.39.desc:0 "The USA has unfortunately a very isolationist stance. But one work around to buy planes from them would be to use Caribbean Islands for payment. Maybe they will be inclined to accept then."
 u_fra.39.a:0 "Do it"
 u_fra.39.b:0 "We cannot compromise our Empire"
 u_fra.40.t:0 "France propose Caribbean Islands for planes"
 u_fra.40.desc:0 "France propose Caribbean Islands for planes"
 u_fra.40.a:0 "Deal!"
 u_fra.40.b:0 "Refuse"
 u_fra.41.t:0 "The USA accepts to sell planes"
 u_fra.41.desc:0 "The USA has accepted our offer. Our territories are ready to be transfered and the first planes should arrive soon."
 u_fra.41.a:0 "Wonderful"
 u_fra.42.t:0 "USA refuse"
 u_fra.42.desc:0 "The americans refuse to trade weapons against our Island"
 u_fra.42.a:0 "Maudits Isolationistes!"
 u_fra.43.t:0 "France propose to divide Germany"
 u_fra.43.d:0 ""
 u_fra.43.a:0 "Yes"
 u_fra.43.b:0 "No"
 u_fra.44.t:0 "The UK accepts to divide Germany"
 u_fra.44.d:0 ""
 u_fra.44.a:0 "The German threat is finally over"
 u_fra.45.t:0 "The UK refuses to divide Germany"
 u_fra.45.d:0 ""
 u_fra.45.a:0 "They are making a grave mistake"
 u_fra.46.t:0 "Communist Rise in France - Laval Opportunity"
 u_fra.46.d:0 "With the news of Blum placating the communists, many moderates are disgruntled. This could be an opportunity for the disgraced Prime Minister Laval. By re-creating an alliance with moderates, centre-right Radicals, conservative liberals and Catholic nationalists, the so called National Bloc could ensure victory !"
 u_fra.46.a:0 "Form the National Bloc"
 u_fra.46.b:0 "We cannot trust Laval"
 u_fra.47.t:0 "Action Française Coup"
 u_fra.47.d:0 "As the people were voting, and the power was still unstable, a violent coup happened spearheaded by Charles Maurras and the Action Française. They seized important government buildings in Paris, Lyon, Marseilles and Strasbourg. Multiple politicians were arrested by the Camelot du Roi. What's left of the government is asking the Army to intervene, but a lot of them have sympathies for the movement, and many more hate the government. In these troubled times, many rallied to the Marshal Pétain to resolve the crisis."
 u_fra.47.a:0 "The army stand with Maurras"
 u_fra.47.b:0 "The army intervene for the Republic"
 u_fra.48.t:0 "Léon Blum Victory"
 u_fra.48.d:0 "France has decided to elect Léon Blum, the Socialist candidates. Workers have started strikes to celebrate the day, has they finally hope for better conditions and salaries."
 u_fra.48.a:0 "Hourra pour le Front Populaire"
 u_fra.49.t:0 "SFIO and SFIC Victory"
 u_fra.49.d:0 "France has decided to elect Léon Blum, the Socialist candidates. Workers have started strikes to celebrate the day, has they finally hope for better conditions and salaries. But already the more radical members of the coalition are asking for more concessions. Whatever the future of France is, the communists sure will play an important part..."
 u_fra.49.a:0 "Vive la Commune"
 u_fra.50.t:0 "Laval re-elected"
 u_fra.50.d:0 "In a surprising turn of events, Laval has been re-elected as Prime Minister of France. Using the radicalisation of the Front Populaire to raise the necessary support, he was able to secure the vote of the French People. But will the re-elected Prime Minister keep the Republic as is, or will he implement more profound changes, none can say yet..."
 u_fra.50.a:0 "France will start its National Regeneration"
 u_fra.50.b:0 "France will stay on the course of democracy"
 u_fra.51.t:0 "Please follow us Monsieur Blum"
 u_fra.51.d:0 ""The last weeks had been crazy, that even in the cold and silent night you could still feel the folly in the air. He had almost seen the victory of justice and socialism in France. He almost made history. But now Léon Blum was the number one enemy. To the eyes of the government, he was the one that almost brought the disease of Bolshevism into power.\n That's why he had to leave. There were Resistance movements, but he was a public figure, he had to go somewhere else to fight. The United-States of America seemed the best choice, for now. And thanks God, a boat for the New World was about to leave, and he was about to board it. \n 'Monsieur Blum ?', said a voice behind him. He turned around to see four Gendarmes, some of which were heavily armed.\n"
 u_fra.51.a:0 "'Please Follow us, Monsieur Blum.'"
 u_fra.52.t:0 "Under the burning sun of Africa"
 u_fra.52.d:0 "A beard had gnawed his face, the sand had burnt his blue eyes, his hair had become white before their time, his tongue was a swollen fire. But he was dreaming of this place, over there, over the sea. France. He had bled for France. He had lost friends at Verdun and la Marne. He had fought communists in the street to save the country. It was in vain. And because of that, now he was there, in the middle of the Sahara desert. He was going to die in a few hours. He knew it. The guards would make sure of it."
 u_fra.52.a:0 "Such is life in the camps"
 u_fra.53.t:0 "Disgruntled Workers"
 u_fra.53.d:0 "It seems that many in the working class are worried by the evolution of the political situation in the country. Many of them still support the Communist party or the Socialist party. Syndicates have called for strikes, for sabotage in the workplace, or worse, for a revolution. We must act fast if we don't want a revolution to happen within a year."
 u_fra.53.a:0 "Sacrebleu"
 u_fra.54.t:0 "France Forbid German Language in Alsace-Lorraine"
 u_fra.54.d:0 "Our new ally, but old enemy, has today dared a bold and scandalous move. They dared to forbid German language in the contested province of Alsace-Lorraine. Already our diplomats have asked for the repeal of the law, but French foreign representatives are staying silent.  Waves of immigrants are flocking to Germany, where they can be protected and proud of their heritage."
 u_fra.54.a:0 "Outrageous"
 u_fra.55.t:0 "In the heart of darkness"
 u_fra.55.d:0 " For many in the office this was just another day. But not for Lothar. He had to pick up documents from his superior office. Nothing official that is. Faith in the regime, he had lost a long time ago, but the guts to work for foreign interests, that was new. He spoke a perfect French, a perk useful for his old employer, the German Abhwer, and for his new, the French DGSE. This perk came from his mother, a French woman who married a German soldier after the Great War. He caught himself thinking about her and what she would have thought of all this. But there was no time for that, the documents were waiting, somewhere..."
 u_fra.55.a:0 "The Reich will fall"
 u_fra.56.t:0 "France transfers Tunisia"
 u_fra.56.d:0 "In a surprising move, France has, this week, started to offer the transfer of Tunisia to our administration. While they claim this is done as a 'Friendly' gesture, and to reduce their heavy colonial strain, experts agree France is trying to gain our good side in an influence wrestle with Germany."
 u_fra.56.a:0 "We must tread carefully"
 u_fra.57.t:0 "France Asks for backing"
 u_fra.57.d:0 "France is asking for our backing in their influence wrestle with Germany. They ask us to support them in their historical claim of Alsace-Lorraine. But our diplomats are warning about the risk of war between the two super powers. As such we should carefully consider which side shall we take."
 u_fra.57.a:0 "Our Latin brothers can count on us"
 u_fra.57.b:0 "Unfortunately..."
 u_fra.58.t:0 "France Asks for backing"
 u_fra.58.d:0 "France is asking for our backing in their influence wrestle with Germany. They ask us to support them in their historical claim of Alsace-Lorraine. But our diplomats are warning about the risk of war between the two super powers. As such we should carefully consider which side shall we take."
 u_fra.58.a:0 "They can count on us"
 u_fra.58.b:0 "Unfortunately.."
 u_fra.59.t:0 "France Asks for backing"
 u_fra.59.d:0 "France is asking for our backing in their influence wrestle with Germany. They ask us to support them in their historical claim of Alsace-Lorraine. But our diplomats are warning about the risk of war between the two super powers. As such we should carefully consider which side shall we take."
 u_fra.59.a:0 "They can count on us"
 u_fra.59.b:0 "Unfortunately.."
 u_fra.60.t:0 "France Asks for backing"
 u_fra.60.d:0 "France is asking for our backing in their influence wrestle with Germany. They ask us to support them in their historical claim of Alsace-Lorraine. But our diplomats are warning about the risk of war between the two super powers. As such we should carefully consider which side shall we take."
 u_fra.60.a:0 "They can have help for Morocco"
 u_fra.60.b:0 "Our Latin brothers can count on us"
 u_fra.60.c:0 "Unfortunately..."
 u_fra.70.t:0 "Spain asks for Compensations"
 u_fra.70.d:0 "Spain has agree to support us. On one condition. They ask for the transfer of Morocco to their colonial administration. We should consider if we need them or not in our struggle against Germany."
 u_fra.70.a:0 "Deal"
 u_fra.70.b:0 "No deal"
 u_fra.71.t:0 "France transfers Morocco"
 u_fra.71.d:0 "France has agreed to transfer Morocco to our colonial administration."
 u_fra.71.a:0 "Superb"
 u_fra.72.t:0 "France Asks for backing"
 u_fra.72.d:0 "France is asking for our backing in their influence wrestle with Germany. They ask us to support them in their historical claim of Alsace-Lorraine. But our diplomats are warning about the risk of war between the two super powers. As such we should carefully consider which side shall we take."
 u_fra.72.a:0 "They can have help for Indochina"
 u_fra.72.b:0 "They have our support"
 u_fra.72.c:0 "Unfortunately..."
 u_fra.73.t:0 "Japan asks for Compensations"
 u_fra.73.d:0 "Japan has agree to support us. On one condition. They ask for the transfer of Indochina to their colonial administration. We should consider if we need them or not in our struggle against Germany."
 u_fra.73.a:0 "Deal"
 u_fra.73.b:0 "No deal"
 u_fra.74.t:0 "France transfers Indochina"
 u_fra.74.d:0 "France has agreed to transfer Indochina to our colonial administration."
 u_fra.74.a:0 "Superb"
 u_fra.75.t:0 "[From.GetNameDefCap] accepts to back us"
 u_fra.75.d:0 "[From.GetNameDefCap] has accepted to back us in our wrestle against German hegemony. They will support our cause."
 u_fra.75.a:0 "Good news"
 u_fra.76.t:0 "[From.GetNameDefCap] refuses to back us"
 u_fra.76.d:0 "[From.GetNameDefCap] has refused to back us in our wrestle against German hegemony. They will not support our cause."
 u_fra.76.a:0 "Dire news"
 u_fra.77.t:0 "France refuses to transfer territories"
 u_fra.77.d:0 "France has refused to transfer their territories to our colonial administration."
 u_fra.77.a:0 "Unfortunate"
 u_fra.78.t:0 "The question of Elsass-Lothringen"
 u_fra.78.d:0 "While we allied France, they stayed our old enemies. And one contentious question is our claim on Elsass-Lothringen. German people everywhere must be united, and as such we should ask for France to submit the territory, and to become our client state."
 u_fra.78.a:0 "Ask for them to submit"
 u_fra.78.b:0 "Now is not the time"
 u_fra.79.t:0 "Germany asks for submission"
 u_fra.79.d:0 "While they pretended to be our allies, Germans have been plotting against us. They are now asking for the immediate transfer of Alsace-Lorraine and our submission as a client state. What should we answer ?"
 u_fra.79.a:0 "We have no choice"
 u_fra.79.b:0 "La mort avant le déshonneur !"
 u_fra.80.t:0 "France refuses to transfer Elsass-Lothringen"
 u_fra.80.d:0 ""
 u_fra.80.a:0 "Break diplomatic relations"
 u_fra.80.b:0 "Let them keep it"
 u_fra.81.t:0 "France transfers Elsass-Lothringen"
 u_fra.81.d:0 "It seems that France chose the right option, by transferring us Elsass-Lothringen."
 u_fra.81.a:0 "Wise"
 u_fra.81.b:0 "This is not enough, break relations"
 u_fra.82.t:0 "France asks for full recognition of French Alsace-Lorraine"
 u_fra.82.d:0 "In a foolhardy move, France is asking us to drop our claims on their eastern territories. Those are ethnically both French and Germans, but are historically part of the Holy Roman Empire. They seem to have been recruiting other members of the Axis to back them up, as such, we should tread carefully."
 u_fra.82.a:0 "We have no choice"
 u_fra.82.b:0 "They can come and get it"
 u_fra.83.t:0 "Germany recognise Alsace-Lorraine as French"
 u_fra.83.d:0 "It seems that Germany chose the right option, by dropping their claim on Alsace-Lorraine."
 u_fra.83.a:0 "Good"
 u_fra.84.t:0 "Germany refuses to recognise Alsace-Lorraine as French"
 u_fra.84.d:0 "In a foolhardy move, Germany chose to not drop their claim on Alsace-Lorraine."
 u_fra.84.a:0 "Break diplomatic relations"
 u_fra.85.t:0 "France and Germany break diplomatic relations"
 u_fra.85.d:0 ""
 u_fra.85.a:0 "That cannot be good"
 u_fra.86.t:0 "France and Germany at war"
 u_fra.86.d:0 ""
 u_fra.86.a:0 "Pour la France"
 u_fra.87.t:0 "France and Germany break diplomatic relations"
 u_fra.87.d:0 ""
 u_fra.87.a:0 "That cannot be good"
 u_fra.88.t:0 "A change in leadership"
 u_fra.88.d:0 "In the morning, while the National Assembly was in session, multiple deputies raised their concerns about having Pierre Laval in charge.\nSince the debacle of the Laval-Hoare pact, a lot of his peers don’t seem to trust him anymore. Many politicians, close to the Croix-de-Feu, but not only, declared the National Bloc was useful to keep the socialists out of the government, but that it is time for a leadership change.\nThey seem to be inclined to choose François de La Rocque as the new prime minister."
 u_fra.88.a:0 "A change is needed"
 u_fra.88.b:0 "Laval stays"
 u_fra.90.t:0 "Landowners and Industrialists alliance"
 u_fra.90.d:0 "In a predictable move, rich landowners and industrialists allied together to support us. Many of them support nationalist movements. L’Oreal, Lesieur... This is a huge boost for our government support base."
 u_fra.90.a:0 "Great"
 u_fra.91.t:0 "Workers Strikes"
 u_fra.91.d:0 "In a direct reaction to our election, this Monday, workers have started a strike. Most of them voted for the Popular Front. They do not seem to understand the necessity of the Mouvement National."
 u_fra.91.a:0 "Unfortunate"
 u_fra.92.t:0 "Communists increase Popular Front collaboration"
 u_fra.92.d:0 "In a move clearly done to oppose us, even more communists joined force with the Popular Front. Many of them were reluctant to do so before 1936 and our arrival in power. But they saw in our victory the triumph of the Old Order and the Capitalists forces. They are now seen with SFIO politicians on a daily basis, and promoting the Front in the street."
 u_fra.92.a:0 "Concerning"
 u_fra.93.t:0 "PPF Anniversary"
 u_fra.93.d:0 "To celebrate the anniversary of the PPF creation, Jacques Doriot organised this week a huge ceremony. It took place in the Saint-Denis stadium with Doriot arriving by plane. Astute observers noticed this was done in a recreation of what Adolf Hitler did in the Triumph of the Will movie at Nuremberg."
 u_fra.93.a:0 "Interesting"
 u_fra.94.t:0 "Doriot launch the Freedom Front"
 u_fra.94.d:0 "In an effort to counter the Communists and Socialists, and to defend the liberties that the Popular Front supposedly took away from them, the PPF (French Popular Party) and the FR (Fédération Républicaine), created the Freedom front.\n It is an alliance of the rights meant to protect from the destructive influence of the left, according to them.\n It is to be noted that François de La Rocque and the PSF (Parti Social Français), refused to join the Front. He claims that allying the same rich and conservative force as always would undermine his goal."
 u_fra.94.a:0 "We will keep that in mind"
 u_fra.95.t:0 "Landowners and Industrialists alliance"
 u_fra.95.d:0 "In a predictable move, rich landowners and industrialists allied together to oppose us. Many of them support the Cagoule nationalist and terroristic movement. L’Oreal, Lesieur... This is a blow on our government sovereignty."
 u_fra.95.a:0 "Concerning"
 u_fra.96.t:0 "Happy Strikes"
 u_fra.96.d:0 "The happy strikes are strikes launched after the coming in office of the Popular Front. The workers happily celebrated this new hopeful day, for better rights and better living conditions. People danced and rejoiced in the street in a beautiful celebration."
 u_fra.96.a:0 "Vive le Front Populaire"
 u_fra.97.t:0 "Communists disagreements"
 u_fra.97.d:0 "Today in the privacy of the Prime Minister office, a few prominent communists politicians declared their intentions to separate from the Popular Front. They declared that our policies were not socialists enough, and too forgiving to the fascists. This will probably negatively impact our popularity."
 u_fra.97.a:0 "Troubling"
 u_fra.98.t:0 "Nationalism on the rise"
 u_fra.98.d:0 "With the international situation rapidly evolving, many in France are turning to more radical opinions. Many of them chose to turn to nationalism, as Nationalist orators such as Doriot promised them to help the French the Popular Front had wronged."
 u_fra.98.a:0 "Concerning"
 u_fra.99.t:0 "The 1st May"
 u_fra.99.d:0 "The 1st of May, Worker’s Day, is a day of festivity and struggle. Struggle for the 40h, for work contracts, for peace and for justice. This 1st may arrive only two months after the CGT unions party and the CGTU, a splinter that separated in 1922, reunited.\n To avoid any conflict with the Leagues or the CGTU, the CGT has decided not to show itself in any cortege, especially in Paris."
 u_fra.99.a:0 "Happy Workers' Day"
 u_fra.100.t:0 "6 Fevrier 1934 celebrations"
 u_fra.100.d:0 "Today marks the day of the 6 February 1934 crisis, in which the Leagues and veterans manifested in front of the National Assembly. This unarmed protest was severely repressed by the Republican Government, fearing a Nationalist Coup d’Etat.\n This crisis created a rift in the French political landscape. The right wing radicalised while the left-wing decided to unite, leading later to the Front Populaire creation.\n Today, several Right-Wing groups, the AF and the Croix-de-Feu among them, celebrated the event anniversary and honored the people who died two years ago."
 u_fra.100.a:0 "A turning point"
 u_fra.101.t:0 "Bastille Day"
 u_fra.101.d:0 "NOT USED"
 u_fra.101.a:0 "NOT USEDD"
 u_fra.102.t:0 "The AF hostile to Blum"
 u_fra.102.d:0 "In an article published today in its newspaper, the Action Française aggressively opposed Blum. They condemned him and the Front Populaire, accusing them of being a foreign agent working for Stalin and the Bolsheviks. They are also attacking him for being a socialist, a jew and a bourgeois.\n The AF are not the only ones attacking him, but they are among his biggest opponents, and the victory of the Front made things even worse..."
 u_fra.102.a:0 "Disgraceful "
 u_fra.103.t:0 "The Creation of the PSF"
 u_fra.103.d:0 "Following the dissolution of his popular Croix-de-Feu league by the Popular Front, Colonel François de La Rocque created this month a new political Party. It is the continuation of the Croix-de-Feu on most points. The Colonel wants to show he is on the side of legalism and republicanism. He refused to be called a Fascist, claiming to be serving the Republic.\n His party is already successful, and himself is greatly popular. He is proning a strong Presidential role, an increase on class cooperation and nationalism."
 u_fra.103.a:0 "Interesting"
 u_fra.104.t:0 "Clichy PSF rally"
 u_fra.104.d:0 "This month, the Parti Social Français decided to organise a meeting in Clichy. Many of our Socialists and Communists allies are claiming that this is just another Fascist meeting, and that it should be shut down.\n But the opposition is already accusing us of shutting down the opposition. Shutting this event down would only rally more people to their side, especially since de La Rocque PSF plays the legalism card.\n What in hell should we do ?"
 u_fra.104.a:0 "Let them have the meeting"
 u_fra.104.b:0 "Shut them down"
 u_fra.105.t:0 "Clichy Shooting"
 u_fra.105.d:0 "After we  authorised the event, the SFIO mayor of Clichy and Communists deputies called for a counter protest.\n Hundreds of protestors besiege the meeting place, forcing the police to call for reinforcement. After warnings, the police opened fire on the socialists and communists protesters. There were 6 deaths and hundreds of wounded, many of which were policemen."
 u_fra.105.a:0 "A terrible day"
 u_fra.106.t:0 "La Cagoule Attentat"
 u_fra.106.d:0 "Today, a terrible event happened. The Cagoule, the Far-Right terrorist group, bombed two buildings near the Place de l’Etoile.\n Those were the buildings of the Confederation of French Proprietors and the Union of Metallurgical Industries. Those odious attacks were obviously done as a false flag attack, to be pinned on the Communists.\n Many hostile rich landowners and proprietors are part of the Cagoule, Pierre Michelin himself is suspected to have financed the attack."
 u_fra.106.a:0 "We must find the culprits"
 u_fra.107.t:0 "The Colonel François La Rocque"
 u_fra.107.d:0 "UNUSED"
 u_fra.107.a:0 "UNUSED"
 u_fra.108.t:0 "UNUSED"
 u_fra.108.d:0 "UNUSED"
 u_fra.108.a:0 "UNUSED"
 u_fra.109.t:0 "News from our Empire - 1936"
 u_fra.109.d:0 "Our glorious Colonial Empire, spreading from East to West, has brought us fresh Colonial Troops. They come from the  Monts of Taza, from Ksar's Souk, and Midelt. Proud Tirailleurs Senegalais, Spahis , Chasseurs and Moroccan Goumiers. \n Otherwise, not much is going on overseas. Equatorial Africa has a new governor, Dieudonné Reste. Some natives, Nationalists and Communists are causing ruckus but nothing our troops can’t handle.\n Overall, nothing new under our Colonial Sun."
 u_fra.109.a:0 "Vive la France !"
 u_fra.110.t:0 "News from our Empire - 1937"
 u_fra.110.d:0 "Our glorious Colonial Empire, spreading from East to West, has brought us a new refreshing drink. Leon Beton, a French born in Boufarik, has commercialised a delicious drink called Orangina. "
 u_fra.110.a:0 "Delicious"
 u_fra.111.t:0 "News from our Empire - 1938"
 u_fra.111.d:0 "Our glorious Colonial Empire, spreading from East to West, has brought us fresh Colonial Troops. They might have been born far away, but they have an invincible flame in their heart. Because they want to fly the flag of France far and wide. And they would die for it.\n Otherwise, Hubert DesChamps recently became governor of Martinique. Dieudonné Reste declared his administration to be specialised in exportation of Coffee and Cocoa, but the production isn't very good, barely reaching 55000 tonnes."
 u_fra.111.a:0 "I rise my glass to our Colonial Empire"
 u_fra.112.t:0 "The French Communist Party"
 u_fra.112.d:0 "UNUSED"
 u_fra.112.a:0 "UNUSED"
 u_fra.113.t:0 "1937 Communist Youth Rally"
 u_fra.113.d:0 "The French Communist Party has organised this month a Youth Rally in the north of France, in the town of Phalempin. This event occurs yearly, but was a great success this year. The young communists had the opportunity to practice sports, including cyclism. The whole rally was joyful and was the occasion for thousands of communists to meet, exchange and honor great communists figures such as Marx and Lenin. The closing ceremony saw thousands of voices chant the International, Maurice Thorez himself seemed very proud."
 u_fra.113.a:0 "Workers of the World, Unite !"
 u_fra.114.t:0 "Daladier speaks to the French Republic"
 u_fra.114.d:0 "Today, in a widely mediatised speech, Edouard Daladier, representative of the Social-Liberals in the Front Populaire, addressed the nation on radio. He spoke about the dangers of Fascism and German Nazism. He asked of the French people to be strong and to reject the demagogues. He called for unity between the middle class and the working class, and on a larger scale, unity in France."
 u_fra.114.a:0 "Interesting"
 u_fra.115.t:0 "UNUSED"
 u_fra.115.d:0 "UNUSED"
 u_fra.115.a:0 "UNUSED"
 u_fra.116.t:0 "Le Parti Populaire Français"
 u_fra.116.d:0 "Jacques Doriot, mayor of Saint-Denis, and until 1934 a fervent communist, created this month the Parti Populaire Français.\n This alliance of disgruntled Communists, Revolutionaries and Nationalists reminds of the creation of the German NSDAP or the Italian NFP.\n  Most of their ideas are extreme, anti-democratic and revolutionaries. But they already have a strong support base."
 u_fra.116.a:0 "Worrying"
 u_fra.117.t:0 "Front Populaire Victory"
 u_fra.117.d:0 "UNUSED"
 u_fra.117.a:0 "UNUSED"
 u_fra.118.t:0 "The Pearl of the Empire"
 u_fra.118.d:0 "The Pearl of our Empire, Indochina, is the home of many resources and natives. It has unfortunately suffered an economic crash in the 1920' and has not since recovered. The colony is dependent on mainland France for most things, and the mainland has to cover for many costs.\n It doesn't help that many natives are starting to express independentist and communist ideas. Nguyễn Ái Quốc, also named Ho Chi Minh, is supported by the USSR, but is he capable of causing trouble ? Who can say..."
 u_fra.118.a:0 "Troubling"
 u_fra.119.t:0 "UNUSED"
 u_fra.119.d:0 "UNUSED"
 u_fra.119.a:0 "UNUSED"
 u_fra.120.t:0 "Radicals and Socialists Tensions"
 u_fra.120.d:0 "In coalition such as the Front Populaire, many tensions may appear. The Radicaux, or Social-Liberals, have ideas that differ from the Socialists. They represent the middle class, while the socialists represent the working class. Many of the Radicaux are sliding to the right of the political spectrum, while some socialists, disgruntled that the reforms are not enough, are looking for alternatives, with the Communists of Thorez or the PPF of Doriot."
 u_fra.120.a:0 "Unfortunate"
 u_fra.121.t:0 "The Leagues"
 u_fra.121.d:0 "UNUSED"
 u_fra.121.a:0 "UNUSED"
 u_fra.122.t:0 "Victory parade under the Brandeburg Gate"
 u_fra.122.d:0 "In the light of our recent victory, the French Forces have paraded under the most famous sight in all Germany, the Brandeburg Gate. Our colonial troups, Spahis and Fusilliers, had a special honorific mention in our Emperor speech. He declared the annexation of the Rhineland region, and declared that with the dissolution of Germany, peace was once again achieved in Europe."
 u_fra.122.a:0 "Vive notre Empereur ! Vive la paix !"
 u_fra.123.t:0 "Victory is ours"
 u_fra.123.d:0 "With the subjugation of the major European countries, our Emperor Napoleon the Great, has delared that nothing would oppose us anymore. France will now focus on building a new European Union centered on Paris. We are now unstoppable !"
 u_fra.123.a:0 "Long live the Empire !"
 u_fra.124.t:0 "A meeting of two Emperors"
 u_fra.124.d:0 "After having supervised our annexation of the Netherlands, our Emperor went to visit the exiled Kaiser Wilhelm the Second. The Kaiser belongs of course to the dinasty that ended the Second French Empire after the Franco-Prussian war. It is unknown what was said during the exchange, but our Emperor is known to hold much ressentment against the Hohenzollern house."
 u_fra.125.t:0 "The new Tzar"
 u_fra.125.d:0 "In a private ceremony, our Emperor Napoleon VI received representatives of multiple countries once part of the USSR. They asked for the freedom of their people and pledge their weapons to the French Emperor, calling him the dignified titled of Tzar."
 u_fra.125.a:0 "We will free you from Soviet influence"
 u_fra.142.t:0 "Dealing with Iraq"
 u_fra.142.d:0 "It is no secret that France doesn't have much oil reserves. Despite our efforts, we need to find a stable source of it, to fuel the increasingly demanding modern warfare. Fortunately, Iraq is neighbouring our Syrian Protectorate, and is rich in oil. Maybe we can convince them or invade them ?"
 u_fra.142.a:0 "Let's buy their oil with investments and alliance"
 u_fra.142.b:0 "Invasion is safer and quicker"
 u_fra.143.t:0 "France is asking for our oil"
 u_fra.143.d:0 "The French Emperor has sent a diplomatic mission to buy our oil. In exchange for the right to exploit it, they propose an alliance, and many investements in our economy. What should we do ?"
 u_fra.143.a:0 "Accept"
 u_fra.143.b:0 "Refuse"
 u_fra.144.t:0 "Iraq Accepts"
 u_fra.144.d:0 "Iraq has accepted our deal, and have conceded their oils right to us !"
 u_fra.144.a:0 "Splendid"
 u_fra.145.t:0 "Iraq Refuses"
 u_fra.145.d:0 "Iraq has refused our deal, and have defied our power !"
 u_fra.145.a:0 "Unfortunate"
 u_fra.145.b:0 "This cannot go unpunished"
 u_fra.146.t:0 "France invites us to research on nuclear weapons"
 u_fra.146.d:0 "France wishes to obtain nuclear weapons, and has appealed to all its allies to participate in this project."
 u_fra.146.a:0 "If this project succeeds, we too will have this fantastic weapon!"
 u_fra.146.b:0 "This is all just a waste of time, we don't need this hypothetical bomb."
 u_fra.147.t:0 "Wargames"
 u_fra.147.d:0 "Since 1935, our country has not carried out any large-scale military exercices. Our troops and generals are in great need of training, but what will be the training themes for this year?"
 u_fra.147.a:0 "We must train our armored forces first."
 u_fra.147.b:0 "We need to improve our combat tactics."
 u_fra.147.c:0 "We need to train our troops better."
 u_fra.147.e:0 "We must ensure the effectiveness of our lines of defense."
 u_fra.148.t:0 "Dissolution of the Chamber of Deputies"
 u_fra.148.d:0 "This had not happened since the presidency of Mac Mahon, but with the agreement of the Senate this morning, the Chamber of Deputies will be dissolved, and new elections launched in 3 months. Despite the protests of the parliamentary majority, a large part of the population accepts this dissolution with joy, after the disappointment of the results of the last elections."
 u_fra.148.a:0 "Et c'est reparti pour un tour!"
 u_fra.149.t:0 "France wants to buy our heavy water"
 u_fra.149.d:0 "France wishes to buy all of our heavy water stock in order to carry out research in nuclear fission. But the Germans also want to buy our heavy water. Who should we sell it to?"
 u_fra.149.a:0 "The French Republic will make the best use of it"
 u_fra.149.b:0 "By giving it to the Germans, maybe they will respect our sovereignty?"
 u_fra.149.c:0 "Our stock must in no case fall into the hands of the Germans!"
 u_fra.150.t:0 "Norway agrees to sell heavy water"
 u_fra.150.d:0 "The Norwegians trusted us and canceled an agreement with the Germans to sell their heavy water to us only."
 u_fra.150.a:0 "This German story is not reassuring..."
 u_fra.151.t:0 "The Germans win the sale"
 u_fra.151.d:0 "The Norwegians declined our purchase offer, stating that the Germans, who also wanted to buy the heavy water, were more convincing."
 u_fra.151.a:0 "No choice, we will have to secure the heavy water by ourselves!"
 u_fra.152.t:0 "Norway sells us its heavy water"
 u_fra.152.d:0 "The Norwegians sell us their heavy water, an important element for the creation of atomic weapons. They also told us that France tried to buy the entire stock of heavy water, but still chose us first."
 u_fra.152.a:0 "We should watch those French..."
 u_fra.153.t:0 "Norway offers us its heavy water"
 u_fra.153.d:0 "Worried by the stimulated demand of our country and Germany for its stockpile of heavy water, Norway fears what Germany could do with an atomic bomb. For safety, she offers us all her stock of heavy water and asks us to go and collect it discreetly."
 u_fra.153.a:0 "We will do our best."
 u_fra.154.t:0 "Steal of the Heavy water"
 u_fra.154.d:0 "In the evening, unknown individuals entered the Vermork hydroelectric plant and stole the entire stock of heavy water present. The police are still looking for the culprits, but without this water we can no longer supply Germany."
 u_fra.154.a:0 "Let's hope that there are not too many consequences on our relations with the Germans"
 u_fra.155.t:0 "Steal of the Heavy water"
 u_fra.155.d:0 "In the evening, unknown individuals entered the Vermork hydroelectric plant in Norway and stole the entire stock of heavy water present. The Norwegian police are still looking for the culprits, but the facts are there, all the heavy water is gone."
 u_fra.155.a:0 "This will put a brake on our progress on nuclear technology."
 u_fra.156.t:0 "Antoine de Saint-Exupéry miraculously survives the Libyan desert"
 u_fra.156.d:0 "Leaving on December 29 of last year to break the flight speed record between Paris and Saigon, Antoine de Saint-Exupéry and his mechanic André Prévot gave no further news after a stopover on the 30th. Many where worried of the situation of the crew, but this one is fine. Antoine called from Cairo confirming that he had crashed in the middle of the Libyan desert in Egypt. They spended 3 days in the Sahara with only half a liter of coffee, a quarter of a liter of white wine, a few grapes and an orange. The crew was finally spotted and saved by Bedouins. The crew barely recovered is already on the way to see the damage to their plane."
 u_fra.156.a:0 "Our airmen are decidedly invincible"
 u_fra.157.t:0 "Antoine de Saint-Exupéry disappeared in Egypt"
 u_fra.157.d:0 "Leaving on December 29 of last year to break the flight speed record between Paris and Saigon, Antoine de Saint-Exupéry and his mechanic André Prévot gave no further news after a stopover on the 30th. Many are worried of the survival of the crew, while searches to locate the wreck of the plane have been launched. In view of the conditions of the region, the chances of survival of the crew seems low..."
 u_fra.157.a:0 "First Pharabod and Klein, now Antoine and André..."
 u_fra.158.t:0 "Jean Mermoz accident at sea"
 u_fra.158.d:0 "On December 7, Mermoz and his crew had an accident in their Lacotère-300 Croix du Sud. As they departed Dakar for Natal, the starboard engine failed, forcing the crew to land abruptly in rough seas. The aircraft is heavily damaged but still manages to communicate it's position to rescues. The crew was finally rescued the next day by the F 2200 'Ville de Montevideo'. This survival in dangerous environment has reinforced the authority of the aviator Mermoz with his comrades within the French Social Party, who now see him as an invincible man."
 u_fra.158.b:0 "On December 7, Mermoz and his crew had an accident in their Lacotère-300 Croix du Sud. As they departed Dakar for Natal, the starboard engine failed, forcing the crew to land abruptly in rough seas. The aircraft is heavily damaged but still manages to communicate it's position to rescues. The crew was finally rescued the next day by the F 2200 'Ville de Montevideo'. This survival in dangerous environment has reinforced the authority of the aviator Mermoz with his comrades within the Croix de Feu Party, who now see him as an invincible man."
 u_fra.158.a:0 "A disaster narrowly avoided..."
 u_fra.159.t:0 "Disappearance of Jean Mermoz at sea"
 u_fra.159.d:0 "On December 7, Mermoz, Alexendre Pichodou, Henri Ezan, Edgar Cruveiler and Jean Lavidalie boarded the Lacotère-300 'Croix du Sud' and took off from Dakar to go to Natal, after having canceled the previous flight from a problem to the right engine reducer. But at 10:43 a.m., the plane sent in Morse code 'Cutting right rear engine' and stopped communicating. Extensive research was launched in the region, in particular by Henri Guillaumet, his friend, who had seen them leave for Drakar, but still no part of the plane have been found yet. Many already consider the crew to be dead, and would like them to be commemorated."
 u_fra.159.a:0 "Today France lost a great man"
 u_fra.161.t:0 "France wins the Istres-Damascus-Paris race"
 u_fra.161.d:0 "To celebrate the 10th anniversary of Charles Lindbergh's crossing of the Atlantic, the French flying club has launched a competition to connect Istres and Paris by making a detour via Damascus. Of the 13 participating aircraft, 4 planes are of French origin and only 9 planes finished the race. Leaving Le Bourget on the evening of August 20, our planes quickly took the lead in the race thanks to our recent technological progress in aeronautics. Henri Guillaumet's aircraft will not even land at Damascus, being then the only aircraft to have the autonomy to make the trip without refueling. The podium is finally conquered by 3 Frenchmen, with Paul Codos and Maurice Amoux in their 'Fulgur' first arrivals. It is noted however that the 4th, 5th and 6th place were all taken by Italians..."
 u_fra.161.a:0 "Une victoire fulgurante !"
 u_fra.162.t:0 "Résultats de la course Istres-Damas-Paris"
 u_fra.162.d:0 "To celebrate the 10th anniversary of Charles Lindbergh's crossing of the Atlantic, the French flying club has launched a competition to connect Istres and Paris by making a detour via Damascus. Of the 9 participating aircraft, 4 are of French origin and only 9 finished the race. Leaving Le Bourget on the evening of August 20, our planes took off, and were followed by the British and the Italian planes at 9 p.m. and 10 p.m. Notably, among the Italian participants is the Duce's son, Bruno Mussolini. While the planes are refueling in Damascus, Henri Guillamet and his four-engined plane F2231 'F-2' continues without this landing, his plane having sufficient autonomy to travel non-stop. But on his return, he will be caught in a violent storm, slowing him down and exhausting his fuel, forcing him to refuel in Belgrade, and finishing in 9th place. The podium is finally conquered by 3 Italian crews, with Ranieri Cupini and Amadeo Paradisi in their 'S-79' finishing first after 17 hours and 32 minutes of flight. Our best pilot will be Codos who finishes in 5th position"
 u_fra.162.a:0 "Our long-distance aviation will have to be improved..."
 u_fra.163.t:0 "Fatal accident on the Istres-Damas-Paris race"
 u_fra.163.d:0 "To celebrate the 10th anniversary of Charles Lindbergh's crossing of the Atlantic, the French flying club has launched a competition to connect Istres and Paris by making a detour via Damascus. Of the 9 participating aircraft, 4 are of French origin and only 8 finished the race. Leaving Le Bourget on the evening of August 20, our planes took off, and were followed by the British and the Italian planes at 9 p.m. and 10 p.m. Notably, among the Italian participants is the Duce's son, Bruno Mussolini. While the planes are refueling in Damascus, Henri Guillamet and his four-engined plane F2231 'F-2' continues without this landing, his plane having sufficient autonomy to travel non-stop. But while he was supposed to be on the way back, above the Istres peninsula, the plane reported a violent storm and that he tried to pass through it rather than around it. This decision appears to have been fatal, as the plane would later send out an SOS. The wreckage of the plane will be found the next day, it seems to have attempted a landing in a forest, probably due to poor visibility. All of these people are dead. The podium is won by 3 Italian crews."
 u_fra.163.a:0 "A catastroph"
 u_fra.165.t:0 "Preparation for the National Day"
 u_fra.165.d:0 "Eachy year, we organize military parades on the Champs Elysées in Paris to unite our people and prove our military power. However, this parade has a price, and it will have to be organized."
 u_fra.165.a:0 "In view of the current situation, we cannot afford a parade"
 u_fra.165.b:0 "Let's have a little parade"
 u_fra.165.c:0 "Let's organize a spectacular parade!"
 u_fra.165.e:0 "Just because Paris is occupied by the enemy doesn't mean we won't have our holiday!"
 u_fra.166.t:0 "National Holiday"
 u_fra.166.d:0 "The tricolor banners flutter in the wind, the streets have been cleaned, and citizens from all over the country have gathered for the parade. The heads of government moved and the first troops began to move as the Marseillaise sounded. Finally arrive the Stars of this parade, the ..."
 u_fra.166.a:0 "The Air Force's brand new planes"
 u_fra.166.b:0 "The troops of the Marine Nationale"
 u_fra.166.c:0 "Proud soldiers of the Armée de Terre"
 u_fra.166.e:0 "Workers of our arms factories"
 u_fra.166.f:0 "Columns of our best tanks"
 u_fra.166.g:0 "Soldiers of the Maginot Line"
 u_fra.166.h:0 "The foreign Legion"
 u_fra.166.i:0 "Specialized engineering, supply and war hospital troops"
 u_fra.166.j:0 "Troops from our allies"
 u_fra.170.t:0 "Change the date of the national holiday"
 u_fra.170.d:0 "Now that the Monarchy has been restored, it is unacceptable to keep July 14 as a national holiday, the symbol of a bloodthirsty and unstable Republic."
 u_fra.170.a:0 "Let's take the June 23, the feast of our King Jean III"
 u_fra.170.b:0 "Let's take August 1st, the feast of our King Alphonse XII"
 u_fra.170.c:0 "Let's take May 8, the day Joan of Arc liberated Orleans from the English."
 u_fra.170.e:0 "Let's take December 25, the day of the coronation of Charlemagne Emperor of the Franks"
 u_fra.170.f:0 "Take July 27, a victory that strengthens France and the importance of the Capetian kings"
 u_fra.171.d:0 "Now that we have finished with the Republic, we must now get rid of these symbols, such as the National Day, symbol of the uprising of the people against these oppressors..."
 u_fra.171.a:0 "Let's take February 6, a bloody day that allowed the right to unify"
 u_fra.171.b:0 "In homage to our brothers fallen in the war, make November 11 the national holiday"
 u_fra.172.d:0 "With our new communist grip, many want to replace the national holiday and July 14 with another date."
 u_fra.172.a:0 "Let's take May 1st, International Workers' Day"
 u_fra.172.b:0 "In memory of our ancestors massacred at the end of the Paris commune, let's take May 28"
 u_fra.172.c:0 "The French revolution is not our enemy, July 14 can stay in place"
 u_fra.173.d:0 "Now that the 3rd Empire has been established, we must apply some changes, such as the date of the national holiday. Can we really celebrate the day that led to the removal of the monarchy and the creation of the Republic?"
 u_fra.173.a:0 "Let's take August 15, the feast and birth of Napoleon"
 u_fra.173.b:0 "Yet it was July 14 and the Republic that allowed Napoleon to rise to power"
 u_fra.174.t:0 "Death of Alfonso the First"
 u_fra.174.d:0 "This morning, the King of Spain, France and Navarre passed away due to angina pectoris. A funeral has been declared for the next 3 days as the king's remains are en route to the royal site of Escurial in Spain for burial. The question of the heir to the throne arises. Legitimately, it would be Alphonse's second son, Prince Jacques Henri of Bourbon, but some have doubts about his ability to reign, having been deaf and dumb since 1912. Many would see his little brother, the Prince Juan of Bourbon as a better leader..."
 u_fra.174.a:0 "Long live King Jacques II!"
 u_fra.174.b:0 "Long live King Juan I !"
 u_fra.175.t:0 "Death of Jean the Third"
 u_fra.175.d:0 "This morning, the King of France Jean III left us at the age of 65. A funeral has been declared for the next 3 days while the remains of the king are on their way to the royal chapel of Dreux, the necropolis of the Orléaniste family. The heir to the throne is Jean III's only son, Henri Robert Ferdinand Marie."
 u_fra.175.a:0 "The king is dead, long live the king!"
 u_fra.177.t:0 "Abandonment of the Trans-Saharan"
 u_fra.177.d:0 "After two years of construction, the project to connect the colonies of French Africa by the Sahara seems to have come to a standstill. The difficulty of the terrain and the staggering cost of the project did not help, and some suspect corruption."
 u_fra.177.a:0 "A bitter failure"
 u_fra.185.t:0 "France wants to submit us"
 u_fra.185.d:0 "The infamous Emperor of the French [FRA.GetLeader] mobilized these troops along our borders. He demands immediate control of the Jura and wants to transform our country into a puppet Republic of his tyranny..."
 u_fra.185.a:0 "We do not have the necessary forces to oppose it..."
 u_fra.185.b:0 "Let them come and get the Jura themselves!"
 u_fra.186.t:0 "Switzerland accepts our requests"
 u_fra.186.d:0 "[SWI.GetLeader] of the new [SWI.GetName] accepted our conditions this morning! France rejoices today as she is finally reconnected to her lost childs of 1815!"
 u_fra.186.a:0 "Gloire a la [SWI.GetName]"
 u_fra.187.t:0 "Switzerland refuses our conditions"
 u_fra.187.d:0 "Despite our demonstration of force at the border, [SWI.GetLeader] does not respond to our proposals, and has started mobilizing their troops."
 u_fra.187.a:0 "What those fools are hoping for? They don't even have a navy!"
 u_fra.188.t:0 "France and Italy threatens us"
 u_fra.188.d:0 "France and Italy wants to conquer and share our territory between them. They left us an ultimatum and threaten to invade us"
 u_fra.188.b:0 "Death rather than submission!"
 u_fra.189.t:0 "France and Germany threatens us"
 u_fra.189.d:0 "France and Germany wants to conquer and share our territory between them. They left us an ultimatum and threaten to invade us"
 u_fra.189.b:0 "Death rather than submission!"
 u_fra.190.t:0 "Mass exoduses in [28.GetName]"
 u_fra.190.d2:0 "It is in the most total surprise and panic that the German Army has today seized the region. The [ROOT.GetAdjective] authorities had not considered possible a German breakthrough there, and large part of the population had not evacuate. It is thus in a big mess that the civilians threw themselves on the roads, creating in the passage of the immense traffic jams. It is reported that German Stukas took advantage of this to straf and bomb the fugitives."
 u_fra.190.d:0 "Despite precautions taken by evacuating the big cities, the rural population found itself distraught by the arrival of the German Army in the state. Today, they are fleeing en masse, taking with them whatever they can fit on a cart. Despite a few traffic jams, traffic is only moderately disrupted in the region."
 u_fra.190.a:0 "If only we could have foreseen this..."
 u_fra.190.b:0 "Fortunately, we have already evacuated part of the population"
 u_fra.191.t:0 "Mass exoduses in [17.GetName]]"
 u_fra.192.t:0 "Mass exoduses in [785.GetName]"
 u_fra.193.t:0 "Mass exoduses in [27.GetName]"
 u_fra.194.t:0 "Mass exoduses in [18.GetName]"
 u_fra.195.t:0 "Mass exoduses in [16.GetName]"
 u_fra.196.t:0 "Mass exoduses in [29.GetName]"
 u_fra.197.t:0 "Mass exoduses in [15.GetName]
 u_fra.198.t:0 "Mass exoduses in [24.GetName]
 u_fra.199.t:0 "Mass exoduses in [20.GetName]
 u_fra.200.t:0 "Mass exoduses in [34.GetName]
 u_fra.201.t:0 "Mass exoduses in [6.GetName]
 u_fra.203.t:0 "Assassination of François Darlan"
 u_fra.203.d:0 "This afternoon, a tragedy occurred. François Darlan was assassinated by the Algerian Fernand Bonnier de La Chapelle at the Summer Palace. The aggressor says he committed his crime because of the attitude of the Admiral and former minister of Vichy. Darlan's maintenance of anti-Semitic laws and Vichy repression earned him the unpopularity of the native populations. The assassin is currently in prison, and the High Commission of France in Africa will soon meet to elect a new Commissioner."
 u_fra.203.a:0 "L'amiral, à la flotte !"
 u_fra.204.t:0 "Establishment of the 'Allied Military Government of Occupied Territories' in France"
 u_fra.204.d:0 "For fear of seeing the emergence of non-democratic governments in liberated France, the Allies have installed ''AMGOT'', a provisional government under Allied supervision. The allies have not taken our opinion into account and no longer recognize us as legitimate..."
 u_fra.204.a:0 "So, it is the beginning of a second occupation..."



 u_fra.2000.t:0 "[From.GetNameDefCap] demands Latin Entente Unification"
 u_fra.2000.d:0 "[From.GetNameDefCap] has said that the entire Latin Union must be united as one country so that we can stand stronger against the enemy. The first step towards this is to give in to [From.GetNameDefCap] demands. What are we going to do?"
 u_fra.2000.a:0 "Good idea"
 u_fra.2000.b:0 "This is unacceptable"
 u_fra.2001.t:0 "[From.GetNameDefCap] Accepted Our Offer"
 u_fra.2001.d:0 "With the [From.GetNameDefCap] acceptance, we will be stronger against our enemy!"
 u_fra.2001.a:0 "Very good"
 u_fra.2002.t:0 "[From.GetNameDefCap] Rejected Our Demand"
 u_fra.2002.d:0 "[From.GetNameDefCap] said that our proposal was absurd and that by continuing to be allies we would be able to stand strong against the enemy. Therefore, they left the meeting saying that they were looking for something fishy under this proposal and that we were probably trying to expand France's territory and regain our former power."
 u_fra.2002.a:0 "There's nothing to do"
 u_fra.2002.b:0 "Kick them out of the alliance"
  qof.1.t:0 "Jean III assassinated !"
 qof.1.d:0 "During the proclamation of the kingdom of France which took place at the Tuileries Palace, a young man sent a bomb on the balcony of His Majesty who died in the explosion. Authorities later discovered that the man was a Republican extremist, his torture is ongoing. It is a period of mourning that France must now face ..."
 FRA_qof.1.1.a:0 "How it was even possible..."
 qof.2.t:0 "Henri VI the new king of France !"
 qof.2.d:0 "Despite the tragic event, the son of Jean III, Henry VI, affirmed his desire to succeed his father. France is no longer an orphan and welcomes his new king in jubilation. Nevertheless, the death of the king created a deep lack of confidence in the future on the part of our people. The advent of Henry VI should be marked with a strong act. "
 FRA_qof.2.1.a:0 "Le roi est mort, vive le roi !"
 qof.3.t:0 "The king and his two sons died in a train accident! "
 qof.3.d:0 "It's unimaginable ... During his tour of France, Henry VI and his two sons were caught in a train accident and died. Miraculously, the queen is saved from this catastrophe. The kingdom no longer has direct heirs, it's chaos, with lack of support even the government is unable to manage the crisis ... "
 FRA_qof.3.1.a:0 "Nous sommes maudits..."
 1_FRA_tt: "§RThe probability of a civil war is growing ... §!"
 2_FRA_tt: "§GPart of the population has rallied to our position !§!"
 3_FRA_tt: "§RWe will be fired from the League of Nations and actions against us will be taken ... but maybe they will back off at the last moment.§!"
 qof.4.t:0 "The future"
 qof.4.d:0 "Two kings and two heirs are dead. We only have one queen left, maybe she's the solution? On the other hand, all these events are undoubtedly signs. The Orléants dynasty may not have been the best idea, or even just the return of a monarchy ... "
 FRA_qof.4.1.a:0 "Choose Isabelle, the queen of France "
 FRA_qof.4.1.b:0 "Let's go back to the Republic, the monarchy has lost its chance. "
 FRA_qof.4.1.c:0 "Let's try the Spanish branch of Bourbons"
 FRA_qof.4.1.d:0 "The Bonaparte dynasty ?"
 qof.5.t:0 "New succession laws "
 qof.5.d:0 "It was expected but the upper classes did not appreciate we change the laws of succession. This is support that we are losing ... "
 FRA_qof.5.1.a:0 "We lost upper classes support"
 qof.6.t:0 "Strasbourg Treaty " 
 qof.6.d:0 "We have to buy time no matter what, France is on the brink of civil war and we cannot afford to get into conflict. We are going to lose popular support, but we are aiming for the long term. "
 FRA_qof.6.1.a:0 "Ce n'est pas un adieu !"
 qof.7.t:0 "Turin Treaty"
 qof.7.d:0 "We have to buy time no matter what, France is on the brink of civil war and we cannot afford to get into conflict. We are going to lose popular support, but we are aiming for the long term."
 FRA_qof.7.1.a:0 "Goodbye Tunisia "
 qof.8.t:0 "Result: "
 qof.8.d:0 "It was a complete failure. Despite the offer of a coalition, all parties have abandoned us. We are alone to face this crisis. "
 FRA_qof.8.1.a:0 "Complete failure..."
 qof.9.t:0 "Result: "
 qof.9.d:0 "A success ! Thanks to this propaganda campaign, we obtained the support of part of the population. At least we can count on someone."
 FRA_qof.9.1.a:0 "Success !"
 qof.10.t:0 "Civil war !"
 qof.10.d:0 "This morning the members of the Radical Party left the upper house. Three hours later our authorities told us that shots were fired in Paris. If the attackers in the capital have been brought under control, the latest reports speak of a Republican uprising in the west of the country. We need to mobilize our reserves quickly. "
 FRA_qof.10.1.a:0 "Que je trépasse si je faiblis !"
 qof.11.t:0 "End of civil war "
 qof.11.d:0 "We got rid of these Republican traitors. But the war has been harsh and difficult for our kingdom, our economy has been strained and now needs to regain its full capacity.  "
 FRA_qof.11.1.a:0 "Finally"
 qof.12.t:0 "International conference"
 qof.12.d:0 "It seems that our Minister of Foreign Affairs has a perfect elocution. They have been completely duped. We can now assert our presence in the region without any problem. "
 FRA_qof.12.1.a:0 "Parfait !"
 qof.13.t:0 "The intervention mandate" 
 qof.13.d:0 "The League of Nations has just granted us an intervention mandate in Brazil to fight alongside the legitimate government. We could respect the terms of the mandate or ... we use it to support our puppet government. But if we do that, then we will have to take responsibility for the consequences. "
 FRA_qof.13.1.a:0 "Respect mandate terms"
 FRA_qof.13.1.b:0 "Use it for our interests"
 qof.14.t:0 "What future for Brazil ?"
 qof.14.d:0 "Now that we have full control of the Brazilian territories, several choices lie ahead. A simple integration is possible, or since Isabelle is an Orléans-Braganza, we could proclaim a double monarchy. "
 FRA_qof.14.1.a:0 "Stick to simple integration "
 FRA_qof.14.1.b:0 "Proclaim the double monarchy !"
 qof.15.t:0 "French ultimatum"
 qof.151.t:0 "Germany submits to our demands !"
 qof.151.d:0 "This morning, the German delegation has just informed us that they accepts our terms in order to avoid war. Alsace-Lorraine is French again! "
 FRA_qof.151.1.a:0 "Great !"
 qof.152.t:0 "Germany refused "
 qof.152.d:0 "Since the ultimatum was sent we have not heard from the German delegation. So it would appear that they are refusing our terms. Either we retreat in humiliation or we declare war on Germany. "
 FRA_qof.152.1.a:0 "Alsace-Lorraine is ours "
 FRA_qof.152.1.b:0 "Maybe we should pullback... "
 qof.16.t:0 "French ultimatum"
 qof.161.t:0 "Belgium and Luxembourg submits to our demands !"
 qof.161.d:0 "Faced with our power, Belgium and Luxembourg submitted to be annexed and to be incorporated into our sphere of influence. With the solid Belgian industry, the future of our kingdom can only be brighter. "
 FRA_qof.161.1.a:0 "Nous sommes de retour !"
 qof.162.t:0 "They refused ! "
 qof.162.d:0 "It was not planned but in view of the silence of the Belgian and Luxembourg governments, it seems that they refuse our terms. What a pity that they are so resistant ... the Ardennes were such a beautiful forest ... "
 FRA_qof.162.1.a:0 "En avant !"
 FRA_qof.162.1.b:0 "Our army is not ready..."
 qof.17.t:0 "French ultimatum"
 qof.172.t:0 "Italy refused"
 qof.172.d:0 "Since the ultimatum was sent we have not heard from the Italian delegation. So it would appear that they are refusing our terms. Either we retreat in humiliation or we declare war on Italian. "
 FRA_qof.172.1.a:0 "Here we go"
 FRA_qof.172.1.b:0 "Maybe a major war just for colonies is not a good idea"
 qof.171.t:0 "Italy submits to our demands !"
 qof.171.d:0 "This morning, the Italian delegation has just informed us that they accepts our terms in order to avoid war. Tunisia is French again! "
 FRA_qof.171.1.a:0 "Là où le Français passe, l'Italien trépasse !"
 qof.18.t:0 "France wants to buy Louisiana "
 qof.181.t:0 "Success !"
 qof.181.d:0 "In exchange for a large sum of money, we managed to buy Louisiana. "
 FRA_qof.181.1.a:0 "Good news"
 qof.182.t:0 "They refused"
 qof.182.d:0 "Well, the deal hasn't been made. It was predictable but we have nothing to lose. We will use the money for other means."
 FRA_qof.182.1.a:0 "Let's go back there ! "
 FRA_qof.182.1.b:0 "It's not worth it"
 qof.19.t:0 "France ask political support"
 qof.191.t:0 "They support us!"
 qof.191.d:0 "This morning the wonderful news was published in the official newspapers! With their political help, the pressure on the UK will be such that they will be forced to liberate Scotland ! "
 FRA_qof.191.1.a:0 "Magnifique !"
 qof.192.t:0 "They refused"
 qof.192.d:0 "Despite the importance of the issue, they did not consider it necessary to support us. "
 FRA_qof.191.1.a:0 "We will manage without them." 
 qof.20.t:0 "Japan ask for white peace"
 qof.20.d:0 "The tactical and strategic superiorities of our armies have completely annihilated Germany, which had no choice but to capitulate. With the loss of his most powerful ally, Japan asked us this morning if a white peace was possible. This proposal divides our generals and politicians, between finally having peace or continuing a distant war ..."
 FRA_qof.20.1.a:0 "Ignore their request"
 FRA_qof.20.1.b:0 "Accept Japanese offer"
 french_border_conflict.2.t:0 "French victory !"
 french_border_conflict.2.desc:0 "Our «Chasseurs Alpins» have crushed the Spanish troops who are still routed. It is a great victory for the kingdom of France which can now reunite the kingdom of Navarre."
 french_border_conflict.2.a:0 "Magnifique !"
 french_border_conflict.2.b:0 "Hé ! n'inspecte pas mon mod jeune malotru"
 french_border_conflict.3.t:0 "Spanish victory..."
 french_border_conflict.3.desc:0 "This afternoon, the officer in charge for Navarre's offensive alerted us about our defeat. It seems that the Spanish troops were too fortified for our artillery ..."
 french_border_conflict.3.a:0 "Let's stop there..."
 french_border_conflict.3.b:0 "Poua hahah, tu t'es fait exploser par les espagnoufs. C'est si compliqué de faire du 7/2 chasseurs alpins ?"
 french_border_conflict.4.t:0 "Statu quo"
 french_border_conflict.4.desc:0 ""The battle was so exhausting that it could not be continued for lack of supplies. In view of the resistance of the Spaniards, it is preferable to leave it there."
 french_border_conflict.4.a:0 "There will be no next time..."
 french_border_conflict.4.b:0 "J'espère pour toi que tu as bien sauvegardé"
 qof.21.t:0 "France declare war on Soviet Union !"
 qof.21.d:0 "This morning, French troops attacked Russian border guards. After seeing the reason for the French declaration of war, the Russian ambassador reportedly pronounced "Wtf is that casus-belli". However, the war that has broken out is likely to be terrible for both camps ..."
 FRA_qof.21.1.a:0 "Pour Louis XV !"

 u_fra.205.t:0 "The Emperor is preparing a coup!"
 u_fra.205.d:0 "The Departamento de Investigaciones Políticas y Sociales has reported suspicious activity within monarchist circles. Our informants suggest that certain factions, loyal only to the old dream of empire, have been in secret contact with French agents. It appears that Napoleon VI intends to place Otto von Habsburg on the throne of Mexico. We can still disrupt these plans before they advance further—if we act quickly."
 u_fra.205.a:0 "Deploy loyalists to suppress them!"
 u_fra.206.t:0 "France Offers Support for Monarchist Coup"
 u_fra.206.d:0 "[From.GetNameDefCap] has approached conservative and monarchist elements of our society with a bold proposal: the assassination of the current leadership, followed by the crowning of Otto von Habsburg as King of Mexico. They promise to carry out the necessary action themselves; all they require is our commitment to support the new order and align ourselves with French imperial policy."
 u_fra.206.a:0 "The Empire shall rise again in Mexico!"
 u_fra.206.b:0 "Never! Mexico will not serve a foreign crown!"
 u_fra.207.t:0 "Mexicans Accept Coup Proposal"
 u_fra.207.d:0 "Contacts among the Mexican elite have embraced our plan. Preparations are already underway to remove the old regime and proclaim Otto von Habsburg as King. Our intervention will soon restore imperial authority across the Atlantic."
 u_fra.207.a:0 "Excellent. Set our plans in motion!"
 u_fra.208.t:0 "Mexicans Reject Coup Proposal"
 u_fra.208.d:0 "Our contacts in Mexico have dismissed our overtures. They refuse to entertain the notion of Otto von Habsburg’s return, and have threatened to expose our involvement should we attempt such plots again. The scheme must be abandoned."
 u_fra.208.a:0 "How unfortunate."
 u_fra.209.t:0 "French Assassination Succeeds in Mexico"
 u_fra.209.d:0 "The French plot has succeeded: the old regime was struck down in Mexico City, and Otto von Habsburg has been declared King of Mexico. The new ruler wasted no time in pledging loyalty to [From.GetNameDef], sealing an alliance between the empires."
 u_fra.209.a:0 "Long live the King!"
 u_fra.210.t:0 "Assassination in Mexico City"
 u_fra.210.d:0 "Our operatives struck swiftly and without error. The old regime has been toppled, and Otto von Habsburg has been crowned King of Mexico amidst cheering monarchist supporters. His first act as sovereign was to pledge loyalty to Napoleon VI, ensuring that Mexico’s destiny is tied to that of the French Empire."
 u_fra.210.a:0 "The age of empires is reborn!"
 