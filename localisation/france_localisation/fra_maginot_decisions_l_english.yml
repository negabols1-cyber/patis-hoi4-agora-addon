l_english:
 FRA_maginotline:0 "The Maginot Line"
 FRA_earlymaginot:0 "The Maginot Line in 1936"
 FRA_latemaginot:0 "The Maginot Line in 1939"
 FRA_magsarre:0 "Fortify the Saar region"
 FRA_magsarre_desc:0 "Germany has remilitarized the Rhineland. Until now, the Saar Gap has only been little fortified, but now that Germany has reaffirmed its intentions in the region, we must secure it!"
 FRA_magbelg:0 "Fortify the Franco-Belgian border"
 FRA_magbelg_desc:0 "The Belgians have recently affirmed their desire for neutrality, and the Belgians forts are no longer guaranteed to be on our side. Even if they don't like it, we need to strengthen our border. But perhaps by strengthening our relations with the Belgians, we could find another solution. "
 FRA_magbelgnew:0 "Reinforce the Franco-Belgian border"
 FRA_magbelgnew_desc:0 "After training and simulations, several Generals informed us that our fortifications in the north of France were insufficient. Maybe they're right."
 FRA_magbelghelp:0 "Reinforce Belgians Forts"
 FRA_magbelghelp_desc:0 "The Belgians seem to be again inclined to sign a new defense treaty. Let's help them build new forts!"
 FRA_magswiss:0 "Fortify the Franco-Swiss border"
 FRA_magswiss_desc:0 "Even if an assault via Switzerland seems complex, Germany and Italy could attack here due to the lack of an unfortified front. We must not take any risks. "
 FRA_magswissnew:0 "Reinforce the Franco-Swiss border"
 FRA_magswissnew_desc:0 "Our theorists assert that an enemy attack by Switzerland is highly probable and our current defenses are insufficient. If they are telling the truth, we don't have a minute to waste! "
 FRA_magtun:0 "Create the Mareth line"
 FRA_magtun_desc:0 "With Italy's colonial intentions, Tunisia could become a prime target. Forts in this region will make them think twice before attacking. "
 FRA_chauvineau:0 "Create the Chauvineau line"
 FRA_chauvineau_desc:0 "A light line of defense in front of Paris could make all the difference between defeat and victory. "
 FRA_magspain:0 "Defense line in the Pyrenees"
 FRA_magspain_desc:0 "Spain is making itself terribly threatening, and could attack us at any time. Forts in the region should hold them back from attacking us.
 FRA_bridgeboom:0 "Destroy the Bridges"
 FRA_bridgeboom_desc:0 "If we are attacked, the lack of usable infrastructure should severely slow any enemy advance. "
 FRA_magdji:0 "Forts at Djibouti"
 FRA_magdji_desc:0 "Italy has annexed Ethiopia, and Djibouti would be the next logical target. We cannot let this happen !"
 FRAczemaginot:0 "Help Czechoslovakian"
 FRAczemaginot_desc:0 "Our Czechoslovakian allies would like to build their own forts, based on our engineering. They are our allies and we must protect them at all cost!"
 FRAczemaginotno:0 "Do not help Czechoslovakian"
 FRAczemaginotno_desc:0 "Our Czechoslovakian allies would like to build their own forts, based on our engineering. We cannot accept. If the enemy captures these forts, they could train and study our defenses weaknesses."
 GERczemaginot:0 "Training on the Czechoslovakian fortresses"
 GERczemaginot_desc:0 "France has committed a huge mistake. They helped building Czech forts. Therefore, we can use the Czech fortifications to study French defenses and train to prepare our attack on the Maginot Line."
 cze_maginot_no:0 "France refuses to help"
 cze_maginot_no_desc:0 "French has refused to let us study their defenses. This mean we will have to develop our defenses ourselves."
 cze_maginot_yes:0 "France accepts to help"
 cze_maginot_yes_desc:0 "French has agreed to help us build our forts. This will greatly reduce the construction time, and improve their quality."
 ger_maginot_cap:0 "Training on Czechoslovakian lines"
 ger_maginot_cap_desc:0 "We have trained our army on the Czechoslovakian forts. French engineering was used on these forts, and therefore provide a lot of information on ways to attack the maginot line."
 FRA_magair:0 "Install Anti-Air gun"
 FRA_magair_desc:0 "With recent progress in aviation, our forts have become vulnerable to aerial attack. We must protect them with anti-aircraft guns!"
 SWISSaustria:0 "Reinforce the Austrian border"
 SWISSaustria_desc:0 " "Germany has annexed Austria and our border isn't protected here. We must remedy this problem!"
 SWISSfortflat:0 "Reinforce the plains"
 SWISSfortflat_desc:0 "In a case of attack from germany, our forts on the plains are our first defenses against the enemy. We must be sure that this line is well equipped to protect the industry and the people that live there."
 SWISSnationalredoubt:0 "National Redoubt"
 SWISSnationalredoubt_desc:0 "By installing forts in the mountains, the enemy will be unable to totally conquer us. That will make them think twice before attacking us!"
 SWISS_bridgeboom:0 "Destroy the infrastructure"
 SWISS_bridgeboom_desc:0 "We are attacked, it is time to destroy our infrastructure. It should slow down the speed of an enemy invasion."
 swi_national_redoubt:0 "National Redoubt"
 swi_national_redoubt_desc:0 "We will fight until the end!"
 CZEmaginot_ask:0 "Send a delegation to France"
 CZEmaginot_ask_desc:0 "Let send a delegation to the French so we can study their forts."
 
 maginotevent.1.t:0 "Czechoslovaks wants to study the Maginot Line"
 maginotevent.1.d:0 "With a Germany that is always more worrying, the Czechoslovaks want to strengthen their defensive system. He sent us a delegation asking to be able to study our formidable Maginot line."
 maginotevent.1.a:0 "They are our allies and we have to do anything to help them!"
 maginotevent.1.b:0 "We cannot accept, if the enemy captures their forts, they can train to destroy ours!"
 
 maginotevent.2.t:0 "France accepts"
 maginotevent.2.d:0 "The French agreed to let us study their forts"
 maginotevent.2.a:0 "With their expertise, no one will be able to invade us!"
 
 maginotevent.3.t:0 "France refuses"
 maginotevent.3.d:0 "The French categorically refused to let us study their forts, by fear that the enemy would capture and study our forts"
 maginotevent.3.a:0 "We will have to fend for ourselves."