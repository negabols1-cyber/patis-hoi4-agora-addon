l_english:
 #### French Secret Weapon Mod Section #### 
 UFRA_create_dga:0 "Create the DMA"
 UFRA_create_dga_desc:0 "With the creation of new research centers, creating a delegation specialized to prepare the future of French defense systems will help us make effective use of new weapon technologies."
 UFRA_super_heavy:0 "Super Heavy Tank Plans"
 UFRA_super_heavy_desc:0 "Anti-tank guns are more and more effective, making our tanks obsolete. We can remedy this problem by creating super heavy tanks. Thick armor, powerful cannon and machine guns on all sides are their characteristics. The Char 2 will make possible to create this kind of tank in the shortest possible time. "
 UFRA_autoloader:0 "Autoloader"
 UFRA_autoloader_desc:0 "Our engineers have developed a system capable of drastically reducing the reload time of a tank. Including this system on our tanks would be a big plus for our army. "
 UFRA_create_matra:0 "Militarized CAPRA"
 UFRA_create_matra_desc:0 "The Compagnie Anonyme de Production et Réalisation Aéronautique has an industry perfectly capable of creating fighter planes. By funding them and changing their objectives, we can strengthen our industry!"
 UFRA_capture_german_rocket:0 "Recruit German scientists"
 UFRA_capture_german_rocket_desc:0 "The Germans have made major advances in rocketry. By engaging them, we too can make great advances."
 UFRA_rocket_try:0 "Fund rocketry propulsion research"
 UFRA_rocket_try_desc:0 "We believe that the space field could be useful to us, whether in the military or civil field. If we can send objects into orbit, then why not send them to our neighbors?"
 UFRA_missile:0 "Advanced Rocketry"
 UFRA_missile_desc:0 "We have made great strides in the field of spacecraft and rockets. If we assign MATRA to manufacture those rockets, we will be able to gain a huge advantage over our enemies."
 UFRA_launch_site:0 "Launch sites in the colonies"
 UFRA_launch_site_desc:0 "For our future operations, we will need to have launch sites. Creating them in our colonies would be the best option."
 UFRA_space:0 "Launch Spy Satellites"
 UFRA_space_desc:0 "By sending satellites equipped with cameras into low orbit, we will be able to spy on our enemies and gain a colossal advantage."
 UFRA_nuk_alone:0 "Conduct atomic research Alone"
 UFRA_nuk_alone_desc:0 "Scientists claim that by cracking a large number of atoms, enough energy could be released to wipe a city off the map. We need this weapon, but it is so dangerous that it would be preferable that only we have access to it."
 UFRA_nuk_toge:0 "Nuclear Scientific Cooperation"
 UFRA_nuk_toge_desc:0 "The scientific community claims that by cracking a large number of atoms, enough energy could be released to wipe a city off the map. Such a weapon would take a long time to develop, so it would be better to rally our allies on this project."
 UFRA_nuke:0 "Prepare for the bomb test"
 UFRA_nuke_desc:0 "Our investments were not in vain. Our prototype of the bomb is ready but we still have to test it. And for that, we have to find and prepare a site for the test ..."
 UFRA_gerboise:0 "Gerboise bleu"
 UFRA_gerboise_desc:0 "The Sahara of Algeria seems to be a perfect site for the test, it is close to the metropolis and there is nothing but sand. The sooner our tests are done, the better it will be for us."
 UFRA_alde:0 "Aldebaran"
 UFRA_alde_desc:0 "The atoll of Mururoa is far from the metropolis but sparsely inhabited. The composition of the terrain would allow us to make additional tests, essential to improve our understanding of this weapon."
 UFRA_jet_effort:0 "Development of the jet engine"
 UFRA_jet_effort_desc:0 "Proposed by René Lorin in 1913, the jet engine could give an airplane unmatched speed, a definite advantage in air combat. A guy named René Leduc is ready to work on this project. Let's give him a chance."
 UFRA_dassault:0 "Contract with Dassault"
 UFRA_dassault_desc:0 "Marcel Bloch's Company seems to have a certain interest in jet planes. Let's go offer him a contract and therefore see if his prototype can fly."
 UFRA_quad:0 "Quadruple turret"
 UFRA_quad_desc:0 "With the naval treaties, the size and weight of our ships are limited. But we have a solution. By installing 4 guns in a single turret, we will be able to obtain excellent firepower without increasing the size or the weight of our ships. "
 UFRA_dorand:0 "Finance the Dorand G.20"
 UFRA_dorand_desc:0 "An engineer named René Dorand is working on a gyroplane for our submarine, the Surcouf. Buying his gyroplane for the rest of our navy would be an advantageous solution, we could use it for recon and anti-submarine warfare."
 UFRA_amx_our:0 "Nationalize AMX"
 UFRA_amx_our_desc:0 "The Issy-les-Moulineaux construction workshops have good experience with tanks. Nationalizing this industry will allow us to produce our tanks more rationally."
 UFRA_newgun:0 "Developing a Modern Cannon"
 UFRA_newgun_desc:0 "Our enemies are constantly increasing the armor of their tanks, we need to develop even more powerful anti-tank guns if we want to pierce them."
 UFRA_ger_armor:0 "Take note of the Germans tanks"
 UFRA_ger_armor_desc:0 "Our German neighbors have made great strides in heavy tanks. Drawing inspiration from them would help us greatly."
 UFRA_new_mbt:0 "Development of Modern Tank"
 UFRA_new_mbt_desc:0 "With all of our advancements in tanks, we are able to create a whole new type of tank, combining heavy armor, powerful gun, and high speed."
 FRA_tour_de_France:0 "Le Tour de France Royal"
 FRA_tour_de_France_desc:0 "With the death of Jean III the country is destabilized. A visit from the new king, Henry VI, through  the kingdom will surely restored population's confidence in the future."
 FRA_found_way:0 "Find a Solution"
 FRA_found_way_desc:0 "It's a real disaster ... two kings and two heirs dead. There is no longer any direct heir, if we do not find a solution quickly, maybe that will be the end of the monarchy ..."
 FRA_IsabelleI:0 "Isabelle is the Best Option"
 FRA_IsabelleI_desc:0 "Henri VI's wife, now a widow, is partly an Orléant. With a reform of the laws of succession she could be our solution and ascend the throne."
 FRA_reform_succession_law:0 "Reform Succession Law"
 FRA_reform_succession_law_desc:0 "With a reform of the laws of succession, Isabelle will be able to legally ascend the throne."
 FRA_protect_our_back:0 "Protect Our Back"
 FRA_protect_our_back_desc:0 "It is a solution of last resort but in view of the French internal situation and the rise of foreign militarism, we are forced to make concessions to save time."
 FRA_search_support_with_parties:0 "Seek Support from Parties"
 FRA_search_support_with_parties_desc:0 "With the succession crisis, it is essential to find support from several parties to guarantee Isabelle's ascension."
 FRA_cible_population_with_propaganda:0 "Make Propaganda to the Public"
 FRA_cible_population_with_propaganda_desc:0 "In these times of crisis, the support of the population is considerable to have a pressure tool."
 FRA_The_Queen_of_France:0 "The Queen of France"
 FRA_The_Queen_of_France_desc:0 "Vive la reine ! Vive la France ! Despite pressures and resistances, Isabelle's crowning achievement is inevitable thanks to our efforts !" 
 FRA_mobilize_Paris_artisans:0 "Mobilize Parisian Artisans"
 FRA_mobilize_Paris_artisans:0 "With the civil war we are facing, it is crucial to have basic equipment."
 FRA_take_Lebel_stocks:0 "Seize Lebel's Stockpiles"
 FRA_take_Lebel_stocks_desc:0 "Relying on equipment dating from the First World War is probably not a good idea to win a conflict. But we have soldiers and they need guns ... "
 FRA_en_avant_marche:0 "En avant... Marche!"
 FRA_en_avant_marche_desc:0 "The Third Republic has for too long time supported anti-war messages towards our population, leading the French lion away from his glorious destiny. It is time to remilitarize French society."
 FRA_a_new_beginig:0 "A new beginning"
 FRA_a_new_beginig_desc:0 "The civil war is now behind us. We have to look to the future, rebuild the country and face many challenges."
 FRA_rebuild_the_nation:0 "Rebuild the Kingdom"
 FRA_rebuild_the_nation_desc:0 "The civil war did a lot of dammages on the country's infrastructure and factories. A concentration of financial resources is necessary for quick reconstruction. "
 FRA_Ask_united_kingdom_support_for_international_recognition:0 "Ask United Kingdom Support for International Recognition"
 FRA_Ask_united_kingdom_support_for_international_recognition_desc:0 "The low international recognition that our queen receives prevents us from trading effectively with the countries of the world. Help from the UK would be welcome. "
 FRA_join_allies:0 "Join Allies"
 FRA_join_allies_desc:0 "Joining a strong faction might help us overcome challenges more easily."
 FRA_we_dont_need_any_help:0 "We don't need any help"
 FRA_we_dont_need_any_help_desc:0 "Our kingdom is powerful enough to avoid going to prostitute itself to the Perfidious Albion. It is time to regain our past glory !"
 FRA_commercial_deal_with_sueden:0 "Woo Sueden"
 FRA_commercial_deal_with_sueden_desc:0 ""
 FRA_commercial_deal_with_Norway:0 "Woo Norway"
 FRA_commercial_deal_with_Norway_desc:0 ""
 FRA_commercial_deal_with_Japan:0 "Woo Portugal"
 FRA_commercial_deal_with_Japan_desc:0 ""
 FRA_commercial_deal_with_China:0 "Woo Netherlands"
 FRA_commercial_deal_with_China_desc:0 ""
 FRA_commercial_deal_with_United_States:0 "Woo Yugoslavia"
 FRA_commercial_deal_with_United_States_desc:0 ""
 FRA_commercial_deal_with_USSR:0 "Woo Greece"
 FRA_commercial_deal_with_USSR_desc:0 ""
 FRA_Isabelle_reforms:0 "Isabelle's Reforms"
 FRA_Isabelle_reforms_desc:0 "To solve the problems within the country, Her Majesty developed a reform plan in three axes."
 FRA_install_political_suppremacy:0 "Secure Political Supremacy"
 FRA_install_political_suppremacy_desc:0 "The civil war proved one thing to us, even when we looked for help, we were alone. They tried to challenge us with weapons, we are going to fire them from their political jobs. "
 FRA_intensely_subsidize_the_industrial_sector:0 "Intensely Subsidize Industrial Sector"
 FRA_intensely_subsidize_the_industrial_sector_desc:0 "It is vital for us to regain business confidence in order to quickly revive industry. This will be expensive for the State, but intensively subsidizing this sector will allow us to increase our industrial power. "
 FRA_give_more_command_power_to_young_officers:0 "Give More Command Power to Young Officers"
 FRA_give_more_command_power_to_young_officers_desc:0 "The civil war has shown us several concerns with our army condition. The command rigidity has been judged by Her Majesty as an urgent problem to be solved."  
 FRA_an_legitimate_queen:0 "An Legitimate Queen"
 FRA_an_legitimate_queen_desc:0 "Through her reforms and her control over of crisis situation, Her Majesty proved his legitimacy to govern the kingdom of France. "
 FRA_claim_bresil_kingdom:0 "Claim Brasil's Throne"
 FRA_claim_bresil_kingdom_desc:0 "Her Majesty's father was a pretender to the Brazilian throne. With a little diplomatic manipulation, it would be possible for us to claim the Brazilian territories."
 FRA_prepare_guinea:0 "Prepare Guinea"
 FRA_prepare_guinea_desc:0 "Guinea is our march towards Brazil, we must make the territory more suitable to receive an invading army."
 FRA_mobilize_strong_support_in_brasil:0 "Mobilize Strong Support in Brazil"
 FRA_mobilize_strong_support_in_brasil_desc:0 "If we want to acquire Brazil, we must mobilize significant support for our cause in its territories."
 FRA_hold_international_conference_about_future_of_brasil:0 "Hold International Conference about Brasil's Future"
 FRA_hold_international_conference_about_future_of_brasil_desc:0 "By creating a reputation as a destabilized country towards Brazil, we will be able to legitimize our presence in the region. Looking like the good friend is the best way to be the worst enemy."
 FRA_create_brasil_civil_war:0 "Start a Civil War in Brazil"
 FRA_create_brasil_civil_war_desc:0 "“Oh no! A civil war in Brazil, what a disaster! We send all our moral support to the original government” This is what our official reaction will be."
 FRA_ask_League_of_Nations_an_intervention_mandate:0 "Ask League of Nations an Intervention Mandate"
 FRA_ask_League_of_Nations_an_intervention_mandate_desc:0 "With the pretext to help the legitimate government, the LoN could give us an intervention mandate to rectify the situation. But maybe... we could use it for other purpose ... "
 FRA_annex_brasil_state:0 "Annex Brazil State"
 FRA_annex_brasil_state_desc:0 "Now that our puppet state is master of Brazil, we can annex it without problem with a referendum ... faked, of course. "
 FRA_integrate_brasil:0 "Integrate Brazil"
 FRA_integrate_brasil_desc:0 "The Brazilian territories at our disposal, nothing more prevents us from integrating them."
 FRA_European_policy:0 "European Policy"
 FRA_European_policy_desc:0 ""
 FRA_ultimatum_Germany:0 "Ultimatum to Germany"
 FRA_ultimatum_Germany_desc:0 "Now we are ready. The Strasbourg Treaty was just a hoax that Germany believed to the end. The time has come to show him the reality."
 FRA_ultimatum_Belgium:0 "Ultimatum to Belgium and Luxembourg"
 FRA_ultimatum_Belgium_desc:0 "These countries should not exist and their only purpose is to be swallowed up by our great country."
 FRA_ultimatum_Italy:0 "Ultimatum to Italy"
 FRA_ultimatum_Italy_desc:0 "Maybe we can get Tunisia back through diplomatic way. But if it fails ... does starting a major war for that make sense? "
 FRA_going_for_Rhine:0 "Going for Rhine"
 FRA_going_for_Rhine_desc:0 "The rhine was French so it will be ! Our allies during the First World War underestimated us too much. Let's show them what we are capable of."
 FRA_integrate_Rhine:0 "Integrate Rhine"
 FRA_integrate_Rhine_desc:0 "Bismarck, Hegel, Fichte ... let's remove these names from our history school books."
 FRA_our_oldiest_ally:0 "Our Oldest Ally"
 FRA_our_oldiest_ally_desc:0 "We must pressure the UK to liberate Scotland, our oldest ally through the Auld Alliance."
 FRA_ask_USA_support_on_scotland_question:0 "Ask USA support on Scotland question"
 FRA_ask_USA_support_on_scotland_question_desc:0 "Let's isolate UK."
 FRA_ask_Japan_support_on_scotland_question:0 "Ask Japan support on Scotland question"
 FRA_ask_Japan_support_on_scotland_question_desc:0 "Let's isolate UK."
 FRA_ask_ussr_support_on_scotland_question:0 "Ask USSR support on Scotland question"
 FRA_ask_ussr_support_on_scotland_question_desc:0 "Let's isolate UK."
 FRA_retribution_for_Hundred_years_war:0 "Retribution for Hundred Years War"
 FRA_retribution_for_Hundred_years_war_desc:0 "The Hundred Years War destabilized kingdom of France for 116 years just because these Englishmen made unrealistics claims. The war has certainly been won, but they lack a final humiliation."
 FRA_reunify_kingdom_of_Navarre:0 "Reunify Kingdom of Navarre"
 FRA_reunify_kingdom_of_Navarre_desc:0 "The question about kingdom of Navarre has been closed for more than two centuries. For two centuries, a part of us have been forced to be with Spain ... It is unacceptable."
 FRA_push_further:0 "Push Further"
 FRA_push_further_desc:0 ""The Navarre incident", as we officially call it, has shown us that Spain is no longer the empire it once was. Dismember this country would only be a formality."
 FRA_buy_Louisiana:0 "Buy Louisiana" 
 FRA_buy_Louisiana_desc:0 "In exchange for a certain sum of money, the United States could perhaps sell us a part of Louisiana. "
 FRA_rebuild_la_royale:0 "Modernize La Royale"
 FRA_rebuild_la_royale_desc:0 "Faced with Germans and Italians innovations, our navy can suffer from many difficulties. Modernizing it must be a priority."
 FRA_build_modern_bb:0 "Build Modern Capital Ships"
 FRA_build_modern_bb_desc:0 "It is obvious that in a European theater an aircraft carrier is useless. We should invest in modern battleships."
 FRA_modernize_fleet:0 "Efficient Cruisers"
 FRA_modernize_fleet_desc:0 "Our combat fleet is particularly poor in modern and efficient light cruisers."
 FRA_Modernized_Rochefort_s_maritime_arsenal:0 "Modernize Rochefort's Maritime Arsenal"
 FRA_Modernized_Rochefort_s_maritime_arsenal_desc:0 "Rochefort has long been a pivotal place in French shipbuilding. However, our current needs cannot be met with the capacity of the city. It needs its shipbuilding infrastructures to be modernized."
 FRA_stimulation_of_military_shipbuilding:0 "Stimulation of military shipbuilding"
 FRA_stimulation_of_military_shipbuilding_desc:0 "It is clear that we have a naval delay compared to our neighbors. It would be essential to stimulate the shipbuilding sector to remediate it."
 FRA_fuel_autonomy:0 "Fuel Autonomy"
 FRA_fuel_autonomy_desc:0 "We are commercially isolated and can no longer access foreign fuel. It is in the interest of the nation to become autonomous on this point."
 FRA_national_revitalization2:0 "National Revitalization"
 FRA_national_revitalization2_desc:0 "We must use all the means that exist to get the country back on track."
 FRA_RESSOURCE:0 "Provides access to the country's resources through a decision."
 FRA_gold_seize:0 "The consumer goods factor changes in relation to the number of subjects."
 FRA_exploit_belgian_ressources:0 "Exploit Belgian Resources"
 FRA_exploit_belgian_ressources_desc:0 ""
 FRA_exploit_spanish_ressources:0 "Exploit Spanish Resources"
 FRA_exploit_spanish_ressources_desc:0 ""
 FRA_exploit_german_ressources:0 "Exploit German Resources"
 FRA_exploit_german_ressources_desc:0 ""
 FRA_exploit_Italian_ressources:0 "Exploit Italian Resources"
 FRA_exploit_Italian_ressources_desc:0 ""
 FRA_seize_all_puppets_gold:0 "Seize all the gold stocks of our subjects"
 FRA_seize_all_puppets_gold_desc:0 "By taking the gold stocks of our subjects, the military industry of our kingdom will be much more powerful."
 FRA_the_portugees_thungsten:0 "Portuguese Tungsten"
 FRA_the_portugees_thungsten_desc:0 "Portugal has stocks of tungsten which could sufficiently supply our entire military industry. It is our duty, and in the interest of our autonomy, to seize it."
 FRA_exploit_portugees_ressources:0 "Exploit Portuguese Resources"
 FRA_exploit_portugees_ressources_desc:0 ""
 FRA_scotland:0 "We are going to put strong diplomatic pressure on UK to liberate Scotland. This will also require a powerful land army and a large navy from us..."
 FRA_the_natural_borders:0 "Reclaim the True Natural Borders"
 FRA_the_natural_borders_desc:0 "The northern border of France was naturally fixed by the Rhine. It is our duty to integrate it."
 FRA_revenge_louis:0 "Avenge Louis XV"
 FRA_revenge_louis_desc:0 "In June 1717, Tsar Peter the Great was visiting France and met King Louis XV, who was then seven years old. The Emperor of Russia dared to take and carry the King of France in his arms! It's an affront that must be punished!"