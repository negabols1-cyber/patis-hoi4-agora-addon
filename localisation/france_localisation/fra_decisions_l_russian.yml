  FRA_bop_assemblee_consultative_provisoire:0 "Временная консультативная ассамблея"
  FRA_bop_assemblee_consultative_provisoire_desc:0 "Временная консультативная ассамблея – это французское собрание, представляющее движения сопротивления, политические партии и территории, участвующие в войне на стороне союзников под руководством Французского комитета национального освобождения (ФКНО)."
  FRA_bop_promise_new_government:0 "Обещать создание новой республики"
  FRA_bop_promise_new_government_desc:0 "Наши довоенные институты были слишком разрознены, и не позволили нам дать сильный ответ агрессору. Для нашей новой республики нам потребуется более сильная президентская власть."
  FRA_bop_put_old_government:0 "Обещать восстановить довоенные полномочия"
  FRA_bop_put_old_government_desc:0 "Режим Виши законно недействителен. Мы восстановим довоенное французское правительство."
  FRA_bop_promise_women_vote:0 "Предоставить женщинам право голоса"
  FRA_bop_promise_women_vote_desc:0 "Как только враг будет изгнан с территории, мужчины и женщины нашей страны изберут Национальную Ассамблею, которая будет суверенно решать судьбы Нации."
  FRA_bop_add_giraud_support:0 "Назначить жиродистских комиссаров"
  FRA_bop_add_giraud_support_desc:0 ""
  FRA_bop_add_gaulle_support:0 "Назначить голлистских комиссаров"
  FRA_bop_add_gaulle_support_desc:0 ""
  FRA_bop_promise_kill_collabo:0 "Обещать суд над коллаборационистами"
  FRA_bop_promise_kill_collabo_desc:0 "Коллаборационисты предали Республику и Францию. Лаваль, Петен, Дарнан, Бразил... После освобождения мы должны наказать их."
  FRA_bop_promise_work_with_collabo:0 "Обещать помилование лоялистам Виши"
  FRA_bop_promise_work_with_collabo_desc:0 "Мы не можем осуждать лоялистов Виши. Ситуация была отчаянной, а наше население находилось в большой опасности. Если мы хотим дать Франции новый шанс, нам понадобятся эти люди."
  FRA_bop_liberty_of_expression:0 "Восстановление свободы слова"
  FRA_bop_liberty_of_expression_desc:0 ""
  FRA_bop_gaulle_radio_alger:0 "Речь де Голля по радио в Алжире"
  FRA_bop_gaulle_radio_alger_desc:0 ""
  FRA_bop_gaulle_tunis:0 "Укрепление влияния де Голля в Тунисе"
  FRA_bop_gaulle_tunis_desc:0 "Свяжитесь с Ламином Беем в Тунисе, чтобы заручиться его поддержкой"
  FRA_bop_gaulle_moroco:0 "Укрепление влияния де Голля в Марокко"
  FRA_bop_gaulle_moroco_desc:0 "Установить связь с султаном Мохаммедом V в Марокко и убедиться в его поддержке"
  FRA_bop_gaulle_AOF:0 "Усилить влияние Де Голля в Западной Африке"
  FRA_bop_gaulle_AOF_desc:0 ""
  FRA_bop_giraud_to_the_states:0 "Усилить влияние Жиро в США"
  FRA_bop_giraud_to_the_states_desc:0 "Давай отправим Анри Жиро в США, чтобы он обеспечил их поддержку"
  FRA_bop_end_racial_laws:0 "Отменить законы о расовой дискриминации"
  FRA_bop_end_racial_laws_desc:0 "Мы не можем терпеть дискриминационные законы правительства Виши на нашей территории"
  FRA_bop_cremieux_decree:0 "Восстановить декрет Кремьё"
  FRA_bop_cremieux_decree_desc:0 "Жиро проявил особую враждебность в отношении декрета Кремьё, согласно которому местные жители Алжира получили французское гражданство. Мы не можем допустить такой дискриминации на нашей территории"
  FRA_bop_promise_french_union:0 "Пообещать французский союз"
  FRA_bop_promise_french_union_desc:0 "Пришло время провозгласить новую Францию, Францию в мировом масштабе, в которой объединены все части нашего королевства. Когда метрополия будет свободной, мы проведём референдумы везде, чтобы убедиться в желании народа быть частью этой новой великой Франции"
  UFRA_weapons_purchases_category:1 "Закупить оружие у [USA.GetNameDef]"
  UFRA_weapons_purchases_category_desc:0 "Поскольку наша промышленность всё ещё наверстывает упущенное, поиск современного оружия за границей может быть единственным способом модернизировать наши вооружённые силы до современных стандартов"
  UFRA_order_weapons_in_USA:0 "Заказать стрелковое оружие"
  UFRA_order_artillery_in_USA:0 "Заказать артиллерию"
  UFRA_order_tanks_in_USA:0 "Заказать танки"
  UFRA_order_fighters_in_USA:0 "Заказать истребители"
  UFRA_order_bombers_in_USA:0 "Заказать бомбардировщики"
  UFRA_spanish_intervention_category:1 "Вмешательство в гражданскую войну в Испании"
  UFRA_spanish_intervention_category_desc:0 "Группы из разных концов политического спектра хотят вмешаться в гражданскую войну в Испании так или иначе. Однако есть серьезная озабоченность, что война может перекинуться на нашу страну, если мы займем слишком открытую позицию в поддержку одной стороны. Мы должны быть осторожны, чтобы не сбиться с пути, если хотим сохранить во главе Испании дружественное правительство."
  UFRA_invite_FROM_to_non_intervention:0 "Пригласить [From.GetNameDef] в комитет невмешательства"
