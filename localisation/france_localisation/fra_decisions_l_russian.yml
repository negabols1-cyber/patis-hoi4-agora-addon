  FRA_evacuation:0 "Координированная эвакуация"
  FRA_evacuation_desc:0 "Исход из Франции 1940 года - массовое бегство бельгийского, голландского и французского населения в мае-июне 1940 года, когда немецкая армия вторглась в Бенилюкс и большую часть французской территории во время битвы за Францию. Масштабы исхода отчасти объясняются болезненными воспоминаниями об оккупации районов, оккупированных Германией с 1914 по 1918 год."
  UFRA_total_evacuation:0 "Эвакуировать всех мирных жителей из зон риска"
  UFRA_total_evacuation_desc:0 "Немцы снова угрожают территориям, которые мы частично эвакуировали. Мы должны абсолютно всех эвакуировать из этих регионов, прежде чем прибудет враг."
  UFRA_return_home:0 "Вернуть гражданских домой"
  UFRA_return_home_desc:0 "Фронт сдвинулся, и нашим мирным жителям больше не угрожает враг. Мы можем отправить наших сограждан домой!"
  UFVIC_return_home:0 "Вернуть беженцев домой"
  UFVIC_return_home_desc:0 "Ситуация с беженцами стала критической, и Германия больше нам не угрожает. Мы должны отправить всех бедных французов домой."
  UFRA_evacuate_FROM:0 "Частичная эвакуация [From.GetName]"
