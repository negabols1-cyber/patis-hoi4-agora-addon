  UFRA_intervention_in_overseas_territories:0 "Вмешательство в заморские территории"
  UFRA_intervention_in_overseas_territories_desc:0 "Те из наших заморских территорий, которые остались под властью правительства Виши, все еще могут быть переданы на нашу сторону. У нас есть разные варианты в зависимости от местоположения, но некоторые из них могут иметь последствия в будущем."
