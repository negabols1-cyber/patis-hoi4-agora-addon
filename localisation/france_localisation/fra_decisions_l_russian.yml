  FRA_power_struggle_with_LoN_with_picture:0 "Борьба за власть между Францией и Лигой Наций"
  FRA_power_struggle_with_LoN_with_picture_desc:0 "Наше королевство находится в глобальном геополитическом кризисе с Лигой Наций. Если ничего не предпринимать, мы рискуем начать проигрышную войну... Тем не менее, учитывая слабость демократий, если мы продемонстрируем значительную силу, Лига Наций может отступить от своей позиции."
  FRA_liberation_of_scotland_with_picture:0 "Вопрос Шотландии"
  FRA_liberation_of_scotland_with_picture_desc:0 "Шотландия была нашим союзником на протяжении веков, этот союз даже считается старейшим в мире. Сегодня Шотландия находится под британской оккупацией, мы должны освободить эту страну, которая нам так дорога. Если мы окажем достаточно политического давления на Великобританию, то, возможно, они согласятся на независимость."
  FRA_escalation_of_tensions_between_France_and_LoN:0 "Эскалация напряженности между Францией и Лигой Наций"
  FRA_pressure_uk:0 "Оказать давление на Великобританию"
  FRA_systeme_francais_with_picture:0 "Система французского процветания"
  FRA_systeme_francais_with_picture_desc:0 "                                Наше королевство коммерчески изолировано. Новая                                 система «Système de prospérité                                                    Français» позволяет нам захватывать ресурсы                                        стран, находящихся под контролем нашей                                            нации."
