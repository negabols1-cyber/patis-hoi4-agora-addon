 u_fra.1.t:0 "Les accords Vienot"
 u_fra.1.d:0 "En 1934, la France a tenté d'imposer un traité d'indépendance qui a été fortement préjudiciable en sa faveur. Il a promis une indépendance progressive mais a gardé les montagnes syriennes sous contrôle français. Le chef de l'État syrien de l'époque était une marionnette française, Muhammad 'Ali Bay al-'Abid. L'opposition farouche à ce traité a été menée par le nationaliste et parlementaire de haut rang Hashim al-Atassi, qui a appelé à une grève de soixante jours en signe de protestation. La coalition politique d'Atassi, le Bloc national, a mobilisé un soutien populaire massif pour son appel. Des émeutes et des manifestations ont fait rage, et l'économie s'est arrêtée. [FRA.GetLeader] a accepté de reconnaître le Bloc national comme le seul représentant légitime du peuple syrien et a invité Hashim al-Atassi aux négociations d'indépendance à Paris. Il s'y rend le 22 mars 1936, à la tête d'une délégation bloquiste de haut rang. Le traité qui en a résulté a appelé à la reconnaissance immédiate de l'indépendance syrienne en tant que république souveraine, avec une émancipation totale accordée progressivement sur une période de 25 ans."
 u_fra.1.a:0 "Ils l'ont pas volé !"
 u_fra.2.t:0 "Un choix décisif"
 u_fra.2.d:1 "Maintenant que la France est sous notre contrôle, nous devons éroder la décadence et arrêter la décadence morale. Pour cela, des valeurs morales plus élevées et des châtiments divins sont la meilleure solution. Le choix évident est de déclarer le catholicisme d'État, car la France est la fille aînée de l'Église, et la plupart de l'Église sera d'accord avec nos idées. Mais quelques voix ont été entendues prêchant le retour aux dieux plus anciens. A la religion des Celtes, du peuple gaulois, nos ancêtres. Toutatis, Esus et Taranis. C'est une décision audacieuse, et pas populaire, mais elle pourrait porter ses fruits. Que devrions nous faire ?"
 u_fra.2.a:0 "France, Europe, Chrétienté!"
 u_fra.2.b:0 "Par Toutatis!"
 u_fra.3.t:0 "Détruire les symboles républicains"
 u_fra.3.d:0 "Des images en feu et des effigies détruites étaient le spectacle à voir à Paris aujourd'hui. Dans un discours passionné, [FRA.GetLeader], a aboli le 14 juillet et Marianne, et a plutôt déclaré la consécration de la France au Sacré-Cœur de Jésus et à Sainte Jeanne-d'Arc."
 u_fra.3.a:0 "Au diable la Réublique !"
 u_fra.4.t:0 "Un service vraiment secret"
 u_fra.4.d:1 "Lors d'une réunion très confidentielle, [FRA.GetLeader] a conclu avec l'état-major français que le gouvernement avait un besoin urgent d'un service de renseignement. Il a été décidé qu'elle serait divisée en deux branches, la BCRA et la DGER. La Direction générale des études et recherches, ou Direction générale des études et de la recherche, est l'agence française de renseignement extérieur, centrée sur le renseignement extérieur et les opérations secrètes. Le Bureau Central de Renseignements et d'Action, ou Bureau Central du Renseignement et des Opérations, a pour objectif principal d'assurer la sécurité sur le territoire français, de contrer les influences étrangères et de combiner les rôles policiers et politiques. Nous savons que nous avons un surplus de budget, vers qui doit-il aller ?"
 u_fra.4.a:0 "DGER"
 u_fra.4.b:0 "BCRA"
 u_fra.5.t:0 "Notre accent sur l'industrie"
 u_fra.5.d:1 "Pour rattraper son retard sur l'industrie étrangère, il a été décidé d'augmenter les investissements dans une branche de notre industrie. Cela devrait permettre une énorme augmentation de la production, mais vers quelle branche doit-elle se diriger ?"
 u_fra.5.a:0 "Une arme pour chaque homme !"
 u_fra.5.b:0 "Nous allons les submerger par la vitesse !"
 u_fra.5.c:0 "Notre puissance de feu les écrasera!"
 u_fra.6.t:0 "Changer la capital ? ?"
 u_fra.6.d:1 "Comme l'Europe est désormais unie sous notre drapeau, certaines personnes proches de [FRA.GetLeader] lui ont apporté un problème. Faut-il changer la capitale ? Certaines personnes soutiennent qu'en tant que nouvel Empire romain, la nouvelle capitale devrait être Rome. D'autres soutiennent que la capitale continentale devrait être Moscou, car c'est le centre entre l'Asie et l'Europe. Mais la plupart disent que Paris, notre actuelle et belle capitale, devrait être la Nouvelle Rome. Que devons-nous choisir ?"
 u_fra.6.a:0 "Paris bien sûr !"
 u_fra.6.b:0 "Rome, berceau de l'Europe"
 u_fra.6.c:0 "Moscou le centre l'Europe et l'Asie"
 u_fra.7.t:0 "Code Civil"
 u_fra.7.d:0 "Dans un effort pour imiter son ancêtre, Napoléon IV a créé un nouveau Code civil, établissant les nouvelles règles de son Empire. Cette décision a été considérée par ses partisans comme une révolution, tandis que ses opposants soutiennent qu'il s'agissait d'un geste vide de sens uniquement pour augmenter sa popularité."
 u_fra.7.a:0 "Toujours mieux que rien..."
 u_fra.8.t:0 "Un Empire de l'Ouest à l'Est"
 u_fra.8.d:0 "Aujourd'hui, après des années de guerre et de sacrifices, la France a enfin unifié l'Europe. Dans l'un des discours les plus regardés de l'histoire, [FRA.GetLeader] a déclaré l'unité des frères de l'Atlantique à l'Oural, comparant le peuple français à Alexandre, Jules César, Clovis et Charlemagne. Des manifestations auraient éclaté dans diverses régions d'Allemagne, de Pologne et de Russie, mais la gendarmerie française les aurait sous contrôle."
 u_fra.8.a:0 "de l'Atlantique à l'Oural !"
 u_fra.9.t:0 "Les frontières naturelles de la France"
 u_fra.9.d:0 "Enfin le moment est venu. L'occupation française dans les Basses Terres a pris fin et l'intégration a commencé. L'armée est partie et a été remplacée par la police française. Les bâtiments administratifs ont été convertis pour permettre aux citoyens nouvellement intégrés d'obtenir la nationalité française. En Flandre, on dit que les gens sont plus réticents qu'en Wallonie, mais dans l'ensemble, l'intégration n'a pas d'allure."
 u_fra.9.a:0 "Bienvenu à nos nouveaux frères !"
 u_fra.10.t:0 "Début de la construction du Trans-Saharien"
 u_fra.10.d:0 "Aujourd'hui, à Alger, s'est tenue une pompeuse cérémonie, animée par [FRA.GetLeader]. Il lance la construction du Trans-Sahare, une voie ferrée d'Alger à Dakar. Des représentants et la presse du monde entier étaient présents. Cette décision a été grandement saluée et ne manquera pas d'accroître la prospérité de l'Empire colonial français en Afrique."
 u_fra.10.a:0 "Une vraie merveille!"
 u_fra.11.t:0 "Le Trans-Européen"
 u_fra.11.d:0 "Ce matin, lors d'une cérémonie très attendue, [FRA.GetLeader] a lancé la construction du Trans-européen, un chemin de fer Paris-Moscou traversant toutes les capitales européennes. Même s'il mettra des années à se terminer, ce projet réunira des frères européens comme jamais auparavant, et améliorera le contrôle français sur son Empire."
 u_fra.11.a:0 "L'Europe est finalement unie !"
 u_fra.12.t:0 "Le recensement du Sahara"
 u_fra.12.d:0 "Nos vastes territoires africains regorgent de ressources et de main-d'œuvre. Mais la triste réalité est que tous nos territoires sahariens ne sont pas bien connus. Il est temps d'envoyer des équipes cartographier et obtenir des informations depuis le cœur du désert."
 u_fra.12.a:0 "Conscriptez-les !"
 u_fra.12.b:0 "Leave them be..."
 u_fra.13.t:0 "La Guerre d'Indochine"
 u_fra.13.d:0 "08h30 ce matin, les rebelles vietnamiens ont capturé différents bâtiments administratifs coloniaux à travers nos territoires en Indochine. Ils ont agité un drapeau rouge avec une étoile jaune, pour montrer leur allégeance au marxisme. Quelques milices loyalistes et gardes de sécurité coloniaux se sont levés pour écraser la rébellion, mais elle semble être plus importante que tout ce à quoi nous avons dû faire face auparavant. »
 u_fra.13.a:0 "Ces maudits traîtres !"
 u_fra.14.t:0 "Manifestations anti-unification"
 u_fra.14.d:0 "Suite à l'annonce de l'unification de l'Europe, des manifestations ont éclaté. Des groupes nationalistes et régionalistes, en Ukraine, Russie, Pologne, Biélorussie, Allemagne et Autriche les dirigent ! Malgré tous les efforts de notre gendarmerie, ils semblent devenir incontrôlables et il faut faire quelque chose avant que cela ne dégénère en guerre civile ! "
 u_fra.14.a:0 "Notre seule option est d'abandonner l'unification !"
 u_fra.14.b:0 "Nous traiterons avec eux !"
 u_fra.16.t:0 "[From.GetNameDefCap] exiger l'unification européenne"
 u_fra.16.d:0 "[From.GetNameDefCap] a convoqué aujourd'hui une réunion des nations européennes pour discuter d'un État fédéral européen ! [FRA.GetLeader] a plaidé pour la paix en Europe et la formation d'une superpuissance mondiale. Qu'allons-nous voter ?"
 u_fra.16.a:0 "Excellente idée !"
 u_fra.16.b:0 "Un fou qui loue !"
 u_fra.17.t:0 "[From.GetNameDefCap] accepte l'unification"
 u_fra.17.d:0 "Après de longues discussions, un accord a été trouvé avec le gouvernement [From.GetNameDefCap]. Ils ont décidé de rejoindre l'État fédéral européen en tant que membre à part entière."
 u_fra.17.a:0 "Merveilleux!"
 u_fra.18.t:0 "[From.GetNameDefCap] envoie un ultimatum"
 u_fra.18.d:0 "[From.GetNameDefCap] nous a demandé de leur céder nos territoires et notre marine, de sécuriser leurs frontières nord."
 u_fra.18.a:0 "Nous n'avons pas le choix..."
 u_fra.18.b:0 "La mort vant le déshonneur !"
 u_fra.19.t:0 "[From.GetNameDefCap] surrenders"
 u_fra.19.d:0 "[From.GetNameDefCap] accepte notrer ultimatum."
 u_fra.19.a:0 "Bon choix"
 u_fra.20.t:0 "[From.GetNameDefCap] refuse"
 u_fra.20.d:0 "[From.GetNameDefCap] refuse notre ultimatum."
 u_fra.20.a:0 "Les idiots..."
 u_fra.21.t:0 "Le pacte Molotov-Ribbentrop"
 u_fra.21.d:0 "Les ministres des Affaires étrangères de l'Allemagne et de l'URSS nous ont demandé aujourd'hui de participer aux négociations en tant qu'observateurs. Ce n'était bien sûr pas un geste de gentillesse. Berlin espère que nous n'interviendrons pas s'ils décident d'agir contre la Pologne. Pendant ce temps, Moscou a fortement suggéré que nous acceptions de ne pas intervenir et de respecter le pacte, et d'augmenter nos relations diplomatiques avec eux."
 u_fra.21.a:0 "Très bien !"
 u_fra.21.b:0 "Inacceptable !"
 u_fra.25.t:0 "La France offre son soutien au coup d'État monarchiste"
 u_fra.25.d:0 "[From.GetNameDefCap] a approché des éléments pro-monarchie et antifascistes du gouvernement italien et de la clandestinité avec des plans pour l'assassinat de Mussolini et l'institution de Victor Emmanuel III comme chef de la nation. Les Français nous assurent qu'ils peuvent gérer l'assassinat ; tout ce que nous avons à faire est d'affirmer notre volonté de créer un gouvernement de remplacement et de promettre notre futur soutien militaire aux efforts de la France."
 u_fra.25.a:0 "Nous devons nous tourner vers la monarchie dans le temps à venir."
 u_fra.25.b:0 "Absurde! Nous n'abandonnerons jamais nos voies!"
 u_fra.26.t:0 "[From.GetAdjective]s Accepte la proposition de coup"
 u_fra.26.d:0 "Éléments dans le [From.GetAdjective] le gouvernement et la clandestinité ont accepté notre proposition de coup d'État. Ils préparent une prise de pouvoir rapide pour le roi, dès que l'assassinat aura eu lieu."
 u_fra.26.a:0 "Nous pouvons mettre nos plans en action."
 u_fra.27.t:0 "[From.GetAdjective]s Rejete la proposition de coup d'État"
 u_fra.27.d:0 "Les éléments de la [From.GetAdjective] le gouvernement et la clandestinité que nous avons contactés nous ont dit, en termes pas trop doux, qu'ils ne sont pas intéressés par notre proposition de coup d'État. Ils ont menacé de révéler nos plans au gouvernement italien si nous osions refaire la même offre."
 u_fra.27.a:0 "Que c'est malheureux."
 u_fra.28.t:0 "Assassinat français de Mussolini"
 u_fra.28.d:0 "Le plan français a été mis en œuvre et Mussolini a été abattu dans sa voiture dans les rues de Rome aujourd'hui. Le roi Victor Emmanuel III a pris les rênes de la nation et s'est engagé à rejoindre l'Alliance française aux côtés de [From.GetNameDef]."
 u_fra.28.a:0 "Nous devons montrer notre gratitude."
 u_fra.29.t:0 "L'assassinat de Mussolini réussit"
 u_fra.29.d:0 "Notre plan a été exécuté sans faille, et Victor Emmanuel III a pris le manteau de la direction de sa nation. Son premier acte fut de signer un traité garantissant l'entrée de l'Italie dans l'alliance des puissances centrales."
 u_fra.29.a:0 "Les monarchies se relèveront!"
 u_fra.30.t:0 "La Terre sacrée"
 u_fra.30.d:0 "Pour la première fois en près de 700 ans, l'État croisé a été rétabli. Après une cérémonie et une messe dans l'église du Saint-Sépulcre, le gouvernement français a déclaré que c'est ce qui aurait dû être fait en 1919, et que seules les démocraties faibles et corrompues et la Société des Nations l'ont empêché. [FRA.GetLeader] a terminé la cérémonie en déclarant que la dixième croisade était un succès."
 u_fra.30.a:0 "Non Nobis Domine !"
 u_fra.31.t:0 "Le pacte Laval-Hoare"
 u_fra.31.d:0 "En décembre dernier, un scandale avait éclaté. Pierre Laval tenta de négocier secrètement avec l'Angleterre et l'Italie, abandonnant l'Abyssine. La proposition a déclenché une tempête de réactions hostiles en Grande-Bretagne et en France et n'est jamais entrée en vigueur. Ce scandale a rendu Pierre Laval très impopulaire, auprès du peuple et de ses confrères politiques."
 u_fra.31.a:0 "Scandaleux !"
 u_fra.32.t:0 "Elections de 1936"
 u_fra.32.d:0 "Les élections législatives françaises pour élire la 16e législature de la Troisième République française ont lieu ce mois-ci. Les gens se rendent massivement aux urnes. Cela pourrait être le tournant de notre pays."
 u_fra.32.a:0 "Espèrons que rien  n'interfera"
 u_fra.33.t:0 "Maginot historique"
 u_fra.33.d:0 "Activer le Mod Maginot Historique ? Il vise une expérience plus historique sur la ligne Maginot, et plus de décisions de fortification"
 u_fra.33.a:0 "oui !"
 u_fra.33.b:0 "non !"
 fra_news.1.t:0 "Exposition Internationale des Arts et Techniques dans la Vie Moderne"
 fra_news.1.d:0 "L'Exposition Internationale des Arts et Techniques dans la Vie Moderne (Exposition Internationale d'Art et de Technologie dans la Vie Moderne) a commencé à Paris, France. Deux des pavillons les plus remarquables sont ceux de l'Allemagne nazie et de l'Union soviétique. Le pavillon de Speer est culminé par une haute tour couronnée des symboles de l'État nazi, conçue comme un monument à la "fierté et à l'accomplissement allemands". L'architecte du pavillon soviétique est Boris Iofan. Il est surmonté de « Ouvrier et Kolkhozienne », une grande statue destinée à symboliser l'union des ouvriers et des paysans."
 fra_news.1.a:0 "Incroyable"
 fra_news.1.b:0 "Un grand moment pour la France!"
 u_fra.34.t:0 "La question du palais"
 u_fra.34.d:0 "Maintenant qu'un monarque règne à nouveau sur la France, la question est de savoir où dominera-t-il la France ? Le Palais de l'Elysée était, sous la République, la Maison présidentielle officielle. Mais sous la Restauration des Bourbons, le Palais-Royal était le lieu où régnait le roi. Sous cette seconde restauration, quelle sera la demeure du monarque ? Les gardes d'élite du palais sont prêts à se déplacer et à protéger le nouveau palais une fois la décision prise."
 u_fra.34.a:0 "Garder le palais de l'Elysée"
 u_fra.34.b:0 "LePalais-Royal"
 u_fra.35.t:0 "Honorer les vendéens"
 u_fra.35.d:0 "Scertains de nos sujets se sont chargés de célébrer les guerres de Vendée, alors que la monarchie est enfin de retour en France. Soldats vendéens et chouans se sont battus contre la Révolution, contre vents et marées, pour défendre le Roi, la France et Dieu. Leur mémoire peut enfin être correctement honorée aujourd'hui."
 u_fra.35.a:0 "Pour Dieu, la France, le Roy !"
 u_fra.36.t:0 "L'action française attaque Blum"
 u_fra.36.d:0 "Alors que les violences politiques se poursuivent en France, Léon Blum, l'éminent leader de la SFIO, a été sortit d'une voiture et presque battu à mort par les Camelots du Roi. L'organisation mère du groupe, la ligue de droite Action française, n'a pas revendiqué l'attaque. Ils ont plutôt pris une position opposée et ont blâmé Blum. Ils prétendent que Blum a été insolent et les a provoqués. Mais le principal penseur de l'Action française, Charles Maurras avait clairement appelé à des violences, ou pire, à commettre contre Blum. Nombreux sont ceux qui appellent à l'interdiction de l'Action Française."
 u_fra.36.a:0 "Ils ne peuvent être blâmer pour cela"
 u_fra.36.b:0 "Bannissons ce mouvememt haineux !"
 u_fra.37.t:0 "Le Front populaire"
 u_fra.37.d:0 "Le Front populaire est une alliance de mouvements de gauche, dont la Section française communiste de l'Internationale communiste (SFIC, également connue sous le nom de Parti communiste français), la "Section française socialiste de l'Internationale des travailleurs (SFIO) et le Parti radical progressiste -Parti républicain socialiste. Mais cette alliance est fragile, et les communistes font de nombreuses revendications, de plus en plus radicales. Si nous cédons à leurs demandes, nos chances d'être élus pourraient augmenter, mais c'est un accord dangereux. Qu'est-ce qu'il serait ?"
 u_fra.37.a:0 "Accepter une relation plus étroite avec PCF et SFIC"
 u_fra.37.b:0 "Pas de compromis, le Front restera tel quel !"
 u_fra.38.t:0 "Elections du Premier ministre"
 u_fra.38.d:0 "Alors que nous rétablissions les élections, le peuple français a élu ce mois-ci son premier Premier ministre au service du Roi. Avec la défaite en 1936, le Front populaire s'est dissous et Blum, le chef du Parti socialiste (SFIO), et Daladier, le Parti républicain progressiste, sont tous deux des candidats bien soutenus. Mais un candidat inattendu s'est montré après la montée de la monarchie. Il s'agit de Georges Valois, « L'anarchiste converti au royalisme », comme le dit le roi lui-même. Il y a des années, il a été nommé par le roi pour servir de conseiller du prince et héritier. Il était maintenant un partisan connu du fascisme et de l'anarchisme, mais il a déclaré qu'il souhaitait seulement servir la France."
 u_fra.38.a:0 "Blum et le SFIO"
 u_fra.38.b:0 "Daladier et le Parti Radical"
 u_fra.38.c:0 "Georges Valois, l'homme du roi"
 u_fra.39.t:0 "Acheter des avions américains"
 u_fra.39.desc:0 "Les États-Unis ont malheureusement une position très isolationniste. Mais une solution pour leur acheter des avions serait d'utiliser les îles des Caraïbes pour le paiement. Peut-être qu'ils seront enclins à accepter alors."
 u_fra.39.a:0 "Faisons-le"
 u_fra.39.b:0 "Nous ne pouvons compromettre notre Empire"
 u_fra.40.t:0 "La France propose les Caraïbes pour les avions"
 u_fra.40.desc:0 "La France propose les Caraïbes pour les avions"
 u_fra.40.a:0 "Deal!"
 u_fra.40.b:0 "Refuser"
 u_fra.41.t:0 "Les USA acceptent de vendre les avions"
 u_fra.41.desc:0 "Les USA ont accepté notre offre. Nos territoires sont prêts à être transférés et les premiers avions devraient arriver bientôt."
 u_fra.41.a:0 "Merveilleux"
 u_fra.42.t:0 "Les américains refuse"
 u_fra.42.desc:0 "Les américains refuse d'échanger des armes contre les caraïbes"
 u_fra.42.a:0 "Maudits Isolationistes!"
 u_fra.43.t:0 "La France propose de diviser l'Allemagne"
 u_fra.43.d:0 ""
 u_fra.43.a:0 "Oui"
 u_fra.43.b:0 "non"
 u_fra.44.t:0 "Le Roayume-Uni accepte de diviser l'Allemagne"
 u_fra.44.d:0 ""
 u_fra.44.a:0 "La menace allmande est enfin terminée"
 u_fra.45.t:0 "Le Royaume-Uni refuse de diviser l'Allemagne"
 u_fra.45.d:0 ""
 u_fra.45.a:0 "Ils font une grave erreur"
 u_fra.46.t:0 "Montée communiste en France - Laval Opportunité"
 u_fra.46.d:0 "Avec les nouvelles de Blum apaisant les communistes, de nombreux modérés sont mécontents. Cela pourrait être une opportunité pour le premier ministre Laval en disgrâce. En recréant une alliance avec des modérés, des radicaux de centre-droit, des libéraux conservateurs et des nationalistes catholiques, le soi-disant Bloc national pourrait assurer la victoire !"
 u_fra.46.a:0 "Former le Bloc national"
 u_fra.46.b:0 "Nous ne pouvons pas faire confiance à Laval"
 u_fra.47.t:0 "Coup de l'Action française"
 u_fra.47.d:0 "Alors que le peuple votait et que le pouvoir était encore instable, un violent coup d'État se produisit, mené par Charles Maurras et l'Action française. Ils ont saisi d'importants bâtiments gouvernementaux à Paris, Lyon, Marseille et Strasbourg. Plusieurs hommes politiques ont été arrêtés par le Camelot du Roi. Ce qui reste du gouvernement demande à l'armée d'intervenir, mais beaucoup d'entre eux ont des sympathies pour le mouvement, et beaucoup plus détestent le gouvernement. En ces temps troubles, beaucoup se ralient au Maréchal Pétain pour résoudre la crise."
 u_fra.47.a:0 "L'armée se tiendra aux côtés de Maurras"
 u_fra.47.b:0 "L'armée sauvera la République"
 u_fra.48.t:0 "Victoire de Léon Blum"
 u_fra.48.d:0 "La France a décidé d'élire Léon Blum, les candidats socialistes. Les travailleurs ont déclenché des grèves pour célébrer cette journée, espèrent-ils enfin de meilleures conditions et de meilleurs salaires."
 u_fra.48.a:0 "Hourra pour le Front Populaire"
 u_fra.49.t:0 "Victoire du SFIO et du SFIC"
 u_fra.49.d:0 "La France a décidé d'élire Léon Blum, les candidats socialistes. Les travailleurs ont déclenché des grèves pour fêter cette journée, espèrent-ils enfin de meilleures conditions et salaires. Mais déjà les membres les plus radicaux de la coalition demandent plus de concessions. Quel que soit l'avenir de la France, les communistes joueront certainement un rôle important..."
 u_fra.49.a:0 "Vive la Commune"
 u_fra.50.t:0 "Laval ré-élu"
 u_fra.50.d:0 "Dans une tournure surprenante des événements, Laval a été réélu Premier ministre de la France. Utilisant la radicalisation du Front populaire pour réunir les soutiens nécessaires, il a pu s'assurer le vote des Français. Mais le Premier ministre réélu maintiendra-t-il la République telle qu'elle est, ou mettra-t-il en œuvre des changements plus profonds, nul ne peut encore le dire..."
 u_fra.50.a:0 "La France entamera sa Régénération Nationale"
 u_fra.50.b:0 "La France va garder le cap de la démocratie"
 u_fra.51.t:0 "Veuillez nous suivre monsieur Blum"
 u_fra.51.d:0 ""Les dernières semaines avaient été folles, que même dans la nuit froide et silencieuse, on pouvait encore sentir la folie dans l'air. Il avait presque vu la victoire de la justice et du socialisme en France. Il est presque entré dans l'histoire. Mais à présent, Léon Blum était l'ennemi numéro un. Aux yeux du gouvernement, c'est lui qui a failli porter au pouvoir la maladie du bolchevisme. C'est pourquoi il a dû partir. Il y avait des mouvements de Résistance, mais c'était un personnage public, il devait aller combattre ailleurs. Les États-Unis d'Amérique semblaient le meilleur choix, pour l'instant. Et Dieu merci, un bateau pour le Nouveau Monde était sur le point de partir, et il était sur le point de monter à bord. 'Monsieur Blum ?', dit une voix derrière lui. Il s'est retourné pour voir quatre gendarmes, dont certains étaient lourdement armés."
 u_fra.51.a:0 "'Veuillez nous nsuivre monsieurs Blum.'"
 u_fra.52.t:0 "Sous le soleil brûlant d'Afrique"
 u_fra.52.d:0 "Une barbe lui avait rongé le visage, le sable avait brûlé ses yeux bleus, ses cheveux étaient devenus blancs avant l'heure, sa langue était un feu gonflé. Mais il rêvait de cet endroit, là-bas, au-dessus de la mer. La France. Il avait saigné pour la France. Il avait perdu des amis à Verdun et dans la Marne. Il avait combattu les communistes dans la rue pour sauver le pays. C'était en vain. Et à cause de cela, maintenant il était là, au milieu du désert du Sahara. Il allait mourir dans quelques heures. Il le savait. Les gardes s'en assureraient."
 u_fra.52.a:0 "Telle est la vie dans les camps"
 u_fra.53.t:0 "Travailleurs mécontents"
 u_fra.53.d:0 "Il semble que beaucoup dans la classe ouvrière soient inquiets de l'évolution de la situation politique dans le pays. Beaucoup d'entre eux soutiennent encore le parti communiste ou le parti socialiste. Les syndicats ont appelé à la grève, au sabotage sur le lieu de travail, ou pire, à la révolution. Nous devons agir vite si nous ne voulons pas qu'une révolution se produise d'ici un an."
 u_fra.53.a:0 "Sacrebleu"
 u_fra.54.t:0 "La France interdit la langue allemande en Alsace-Lorraine"
 u_fra.54.d:0 "Notre nouvel allié, mais vieil ennemi, a aujourd'hui osé un geste audacieux et scandaleux. Ils ont osé interdire la langue allemande dans la province contestée d'Alsace-Lorraine. Déjà nos diplomates ont demandé l'abrogation de la loi, mais les représentants français à l'étranger se taisent. Des vagues d'immigrants affluent vers l'Allemagne, où ils peuvent être protégés et fiers de leur héritage."
 u_fra.54.a:0 "Outrageant"
 u_fra.55.t:0 "Au coeur des ténèbres"
 u_fra.55.d:0 " Pour beaucoup au bureau, ce n'était qu'un autre jour. Mais pas pour Lothar. Il a dû aller chercher des documents à son bureau supérieur. Rien d'officiel qui est. La foi dans le régime, il l'avait perdue depuis longtemps, mais le courage de travailler pour des intérêts étrangers, c'était nouveau. Il parlait un français parfait, un atout utile pour son ancien employeur, l'Allemand Abhwer, et pour sa nouvelle, la DGSE française. Cet avantage lui vient de sa mère, une Française qui a épousé un soldat allemand après la Grande Guerre. Il se surprit à penser à elle et à ce qu'elle aurait pensé de tout ça. Mais il n'y avait pas de temps pour ça, les documents attendaient, quelque part..."
 u_fra.55.a:0 "Le Reich s'écroulera"
 u_fra.56.t:0 "La France transfert la Tunisie"
 u_fra.56.d:0 "Dans un geste surprenant, la France a, cette semaine, commencé à proposer le transfert de la Tunisie à notre administration. Alors qu'ils prétendent que cela est fait comme un geste « amical » et pour réduire leur lourde pression coloniale, les experts conviennent que la France essaie de gagner notre bon côté dans une lutte d'influence avec l'Allemagne."
 u_fra.56.a:0 "Nous devons avancer prudemment"
 u_fra.57.t:0 "La France demande du soutien"
 u_fra.57.d:0 "La France demande notre soutien dans leur lutte d'influence avec l'Allemagne. Ils nous demandent de les soutenir dans leur revendication historique d'Alsace-Lorraine. Mais nos diplomates mettent en garde contre le risque de guerre entre les deux superpuissances. En tant que tel, nous devons examiner attentivement de quel côté nous devons nous ranger."
 u_fra.57.a:0 "Nos frères latins peuvent compter sur nous"
 u_fra.57.b:0 "Malheureusement..."
 u_fra.58.t:0 "La France demande du soutien"
 u_fra.58.d:0 "La France demande notre soutien dans leur lutte d'influence avec l'Allemagne. Ils nous demandent de les soutenir dans leur revendication historique d'Alsace-Lorraine. Mais nos diplomates mettent en garde contre le risque de guerre entre les deux superpuissances. En tant que tel, nous devons examiner attentivement de quel côté nous devons nous ranger."
 u_fra.58.a:0 "Ils peuvent compter sur nous"
 u_fra.58.b:0 "Malheureusement.."
 u_fra.59.t:0 "La France demande du soutien"
 u_fra.59.d:0 "La France demande notre soutien dans leur lutte d'influence avec l'Allemagne. Ils nous demandent de les soutenir dans leur revendication historique d'Alsace-Lorraine. Mais nos diplomates mettent en garde contre le risque de guerre entre les deux superpuissances. En tant que tel, nous devons examiner attentivement de quel côté nous devons nous ranger."
 u_fra.59.a:0 "Ils peuvent compter sur nous"
 u_fra.59.b:0 "Malheureusement.."
 u_fra.60.t:0 "La France demande du soutien"
 u_fra.60.d:0 "La France demande notre soutien dans leur lutte d'influence avec l'Allemagne. Ils nous demandent de les soutenir dans leur revendication historique d'Alsace-Lorraine. Mais nos diplomates mettent en garde contre le risque de guerre entre les deux superpuissances. En tant que tel, nous devons examiner attentivement de quel côté nous devons 
 u_fra.60.a:0 "Ils peuvent avoir de l'aide pour le Maroc"
 u_fra.60.b:0 "Nos frères latins peuvent compter sur nous"
 u_fra.60.c:0 "Malheureusement..."
 u_fra.70.t:0 "L'Espagne demande des compensations"
 u_fra.70.d:0 "L'Espagne a accepté de nous soutenir. À une condition. Ils demandent le transfert du Maroc à leur administration coloniale. Nous devrions nous demander si nous en avons besoin ou non dans notre lutte contre l'Allemagne."
 u_fra.70.a:0 "accord conclu"
 u_fra.70.b:0 "Pas question"
 u_fra.71.t:0 "La France transfert le Maroc"
 u_fra.71.d:0 "La France a accepté de transférer le Maroc à notre administration coloniale."
 u_fra.71.a:0 "Superbe"
 u_fra.72.t:0 "La France demande du soutien"
 u_fra.72.d:0 "La France demande notre soutien dans leur lutte d'influence avec l'Allemagne. Ils nous demandent de les soutenir dans leur revendication historique d'Alsace-Lorraine. Mais nos diplomates mettent en garde contre le risque de guerre entre les deux superpuissances. En tant que tel, nous devons examiner attentivement de quel côté nous devons nous ranger."
 u_fra.72.a:0 "Ils peuvent avoir de l'aide pour l'Indochine"
 u_fra.72.b:0 "They have our support"
 u_fra.72.c:0 "Malheureusement..."
 u_fra.73.t:0 "Le Japon demande des compensations"
 u_fra.73.d:0 "Le Japon a accepté de nous soutenir. À une condition. Ils demandent le transfert de l'Indochine à leur administration coloniale. Nous devrions nous demander si nous en avons besoin ou non dans notre lutte contre l'Allemagne."
 u_fra.73.a:0 "Accord conclu"
 u_fra.73.b:0 "Pas question"
 u_fra.74.t:0 "La France transfert l'Indochine"
 u_fra.74.d:0 "La France a accepté de transférer l'Indochine à notre administration coloniale."
 u_fra.74.a:0 "Superbe"
 u_fra.75.t:0 "[From.GetNameDefCap] accepte de nous soutenir"
 u_fra.75.d:0 "[From.GetNameDefCap] ha accepté de nous soutenir dans notre lutte contre l'hégémonie allemande. Ils soutiendront notre cause."
 u_fra.75.a:0 "Bonne nouvelle"
 u_fra.76.t:0 "[From.GetNameDefCap] refuse de nous soutenir"
 u_fra.76.d:0 "[From.GetNameDefCap] a refusé de nous soutenir dans notre lutte contre l'hégémonie allemande. Ils ne soutiendront pas notre cause."
 u_fra.76.a:0 "Terrible nouvelle"
 u_fra.77.t:0 "La France refuse de trasférer des territoires"
 u_fra.77.d:0 "La France a refusée de transférer ses territoires à notre administration coloniale."
 u_fra.77.a:0 "Malherureusement"
 u_fra.78.t:0 "La Question d'Alsace-Lotharingie"
 u_fra.78.d:0 "Pendant que nous nous allions la France, ils sont restés nos vieux ennemis. Et une question controversée est notre revendication sur l'Alsace-Lotharingie. Partout, le peuple allemand doit être uni, et en tant que tel, nous devrions demander à la France de soumettre le territoire et de devenir notre État client."
 u_fra.78.a:0 "Luer demander de se soumettre"
 u_fra.78.b:0 "Ce n'est pas le moment"
 u_fra.79.t:0 "L'Allemagne demande la soumission"
 u_fra.79.d:0 "Alors qu'ils se faisaient passer pour nos alliés, les Allemands complotent contre nous. Ils demandent désormais le transfert immédiat de l'Alsace-Lorraine et notre soumission en tant qu'Etat client. Que doit-on répondre ?"
 u_fra.79.a:0 "Nous n'avons pas le choix"
 u_fra.79.b:0 "La mort avant le déshonneur !"
 u_fra.80.t:0 "La France refuse de transférer l'Alsace-Lotharingie"
 u_fra.80.d:0 ""
 u_fra.80.a:0 "Rompre les relations diplomatiques"
 u_fra.80.b:0 "Qu'ils les gardent"
 u_fra.81.t:0 "La France transfert l'Alsace-Lotharingie"
 u_fra.81.d:0 "Il semble que la France a choisit la bonne option en transférant l'Alsace-Lotharingie."
 u_fra.81.a:0 "Sage"
 u_fra.81.b:0 "Cela ne suffit pas, rompre les relations"
 u_fra.82.t:0 "La France demande la pleine reconnaissance de l'Alsace-Lorraine française"
 u_fra.82.d:0 "Dans un geste téméraire, la France nous demande de renoncer à nos revendications sur leurs territoires de l'Est. Ceux-ci sont ethniquement à la fois français et allemands, mais font historiquement partie du Saint Empire romain germanique. Ils semblent avoir recruté d'autres membres de l'Axe pour les soutenir, en tant que tels, nous devons faire preuve de prudence."
 u_fra.82.a:0 "Nous n'avons pas le choix"
 u_fra.82.b:0 "Ils peuvent venir le chercher"
 u_fra.83.t:0 "L'Allemagne reconnaît l'Alsace-Lorraine comme française"
 u_fra.83.d:0 "Il semble que l'Allemagne ait choisi la bonne option, en abandonnant sa revendication sur l'Alsace-Lorraine."
 u_fra.83.a:0 "Bien"
 u_fra.84.t:0 "L'Allemagne refuse de reconnaître l'Alsace-Lorraine comme française"
 u_fra.84.d:0 "Dans un geste téméraire, l'Allemagne a choisi de ne pas abandonner ses prétentions sur l'Alsace-Lorraine."
 u_fra.84.a:0 "Rompre les relations diplomatiques"
 u_fra.85.t:0 "La France et l'Allemagne rompent leurs ralations diplomatiques"
 u_fra.85.d:0 ""
 u_fra.85.a:0 "Ça ne peut pas être bon"
 u_fra.86.t:0 "La France et l'Allemagne en guerre"
 u_fra.86.d:0 ""
 u_fra.86.a:0 "Pour la France"
 u_fra.87.t:0 "La France et l'Allmagne rompent leurs relations diplomatiques"
 u_fra.87.d:0 ""
 u_fra.87.a:0 "Ca ne peut être bon"
 u_fra.88.t:0 "Un changement de leadership"
 u_fra.88.d:0 "Dans la matinée, alors que l'Assemblée nationale siégeait, plusieurs députés ont fait part de leurs inquiétudes quant à la prise en charge de Pierre Laval.\nDepuis la débâcle du pacte Laval-Hoare, beaucoup de ses pairs ne semblent plus lui faire confiance. De nombreux hommes politiques, proches de la Croix-de-Feu, mais pas seulement, ont déclaré que le Bloc national était utile pour tenir les socialistes à l'écart du gouvernement, mais qu'il était temps de changer de direction.Ils semblent enclins à choisir François de La Rocque comme nouveau premier ministre."
 u_fra.88.a:0 "Un changement est nécessaire"
 u_fra.88.b:0 "Laval reste"
 u_fra.90.t:0 "Alliance Propriétaires et Industriels"
 u_fra.90.d:0 "Dans un mouvement prévisible, riches propriétaires terriens et industriels se sont alliés pour nous soutenir. Beaucoup d'entre eux soutiennent les mouvements nationalistes. L'Oréal, Lesieur... C'est un énorme coup de pouce pour notre base de soutien gouvernemental."
 u_fra.90.a:0 "Grandiose"
 u_fra.91.t:0 "Grèves ouvrières"
 u_fra.91.d:0 "En réaction directe à notre élection, ce lundi, les travailleurs ont déclenché une grève. La plupart d'entre eux ont voté pour le Front populaire. Ils ne semblent pas comprendre la nécessité du Mouvement National."
 u_fra.91.a:0 "Malheureusement"
 u_fra.92.t:0 "Les communistes renforcent la collaboration avec le Front populaire"
 u_fra.92.d:0 "Dans un mouvement clairement fait pour s'opposer à nous, encore plus de communistes se sont joints au Front populaire. Beaucoup d'entre eux hésitaient à le faire avant 1936 et notre arrivée au pouvoir. Mais ils ont vu dans notre victoire le triomphe de l'Ancien Ordre et des forces capitalistes. On les voit désormais avec des politiciens de la SFIO au quotidien, et faisant la promotion du Front Populaire dans la rue."
 u_fra.92.a:0 "Consternant"
 u_fra.93.t:0 "Anniversaire du PPF"
 u_fra.93.d:0 "Pour célébrer l'anniversaire de la création du PPF, Jacques Doriot a organisé cette semaine une grande cérémonie. Elle s'est déroulée au stade Saint-Denis avec l'arrivée de Doriot en avion. Des observateurs astucieux ont remarqué que cela avait été fait dans une recréation de ce qu'Adolf Hitler avait fait dans le film Le "triomphe de la volonté à Nuremberg"."
 u_fra.93.a:0 "Intéressant"
 u_fra.94.t:0 "Doriot lance le Front de la liberté"
 u_fra.94.d:0 "Dans un effort pour contrer les communistes et les socialistes, et pour défendre les libertés que le Front populaire leur aurait enlevées, le PPF (Parti Populaire Français) et la FR (Fédération Républicaine), ont créé le Front de la Liberté.\n C'est un alliance des droites censée protéger de l'influence destructrice de la gauche, selon eux.\n Il est à noter que François de La Rocque et le PSF (Parti Social Français), ont refusé de rejoindre le Front. Il prétend qu'allier la même force riche et conservatrice comme toujours saperait son objectif."
 u_fra.94.a:0 "Nous garderons cela à l'esprit"
 u_fra.95.t:0 "Alliance des industriels et des propriétaires"
 u_fra.95.d:0 "Dans un mouvement prévisible, riches propriétaires terriens et industriels se sont alliés pour s'opposer à nous. Beaucoup d'entre eux soutiennent le mouvement nationaliste et terroriste Cagoule. L'Oréal, Lesieur... C'est un coup porté à la souveraineté de notre gouvernement."
 u_fra.95.a:0 "Consternant"
 u_fra.96.t:0 "Grèves joyeuses"
 u_fra.96.d:0 "Les grèves heureuses sont des grèves lancées après l'arrivée au pouvoir du Front populaire. Les travailleurs ont joyeusement célébré ce nouveau jour d'espoir, pour de meilleurs droits et de meilleures conditions de vie. Les gens ont dansé et se sont réjouis dans la rue lors d'une belle fête."
 u_fra.96.a:0 "Vive le Front Populaire"
 u_fra.97.t:0 "Désacords avec les communistes"
 u_fra.97.d:0 "Aujourd'hui, dans l'intimité du bureau du Premier ministre, quelques politiciens communistes éminents ont déclaré leur intention de se séparer du Front populaire. Ils ont déclaré que nos politiques n'étaient pas assez socialistes et trop indulgentes envers les fascistes. Cela aura probablement un impact négatif sur notre popularité."
 u_fra.97.a:0 "Troublant"
 u_fra.98.t:0 "Le nationalisme en hausse"
 u_fra.98.d:0 "Avec l'évolution rapide de la situation internationale, beaucoup en France se tournent vers des opinions plus radicales. Beaucoup d'entre eux ont choisi de se tourner vers le nationalisme, car des orateurs nationalistes tels que Doriot leur ont promis d'aider les français que le Front populaire avait lésés."
 u_fra.98.a:0 "Consternant"
 u_fra.99.t:0 "Le 1er Mai"
 u_fra.99.d:0 "Le 1er mai, fête des travailleurs, est un jour de fête et de lutte. Lutte pour les 40h, pour les contrats de travail, pour la paix et pour la justice. Ce 1er risque d'arriver seulement deux mois après que le parti syndical CGT et la CGTU, dissidente qui s'était séparée en 1922, se soient réunis.\n Pour éviter tout conflit avec les Ligues ou la CGTU, la CGT a décidé de ne se montrer dans aucun cortège, surtout à Paris."
 u_fra.99.a:0 "Joyeuse fête dees travailleurs"
 u_fra.100.t:0 "Célébrations du 6 Février 1934"
 u_fra.100.d:0 "Aujourd'hui marque le jour de la crise du 6 février 1934, au cours de laquelle les Ligues et les vétérans manifestent devant l'Assemblée nationale. Cette manifestation non armée a été sévèrement réprimée par le gouvernement républicain, craignant un coup d'État nationaliste.\n Cette crise a créé une fracture dans le paysage politique français. La droite s'est radicalisée tandis que la gauche a décidé de s'unir, conduisant plus tard à la création du Front Populaire.\n Aujourd'hui, plusieurs groupes de droite, dont l'AF et la Croix-de-Feu, ont célébré l'anniversaire de l'événement et honoré la tombe des personnes décédées il y a deux ans."
 u_fra.100.a:0 "Un tournant"
 u_fra.101.t:0 "Jour de la Bastille"
 u_fra.101.d:0 "NOT USED"
 u_fra.101.a:0 "NOT USEDD"
 u_fra.102.t:0 "l'Action française hostile à Blum"
 u_fra.102.d:0 "Dans un article publié aujourd'hui dans son journal, l'Action française s'est agressivement opposée à Blum. Ils l'ont condamné ainsi que le Front populaire, les accusant d'être un agent étranger travaillant pour Staline et les bolcheviks. Ils l'attaquent aussi parce qu'il est socialiste, juif et bourgeois.\n Les AF ne sont pas les seuls à l'attaquer, mais ils sont parmi ses plus grands adversaires, et la victoire du Front a aggravé les choses..."
 u_fra.102.a:0 "Honteux"
 u_fra.103.t:0 "Création du PSF"
 u_fra.103.d:0 "Suite à la dissolution de sa ligue populaire Croix-de-Feu par le Front populaire, le colonel François de La Rocque a créé ce mois-ci un nouveau Parti politique. C'est le prolongement de la Croix-de-Feu sur la plupart des points. Le Colonel veut montrer qu'il est du côté du légalisme et du républicanisme. Il a refusé d'être traité de fasciste, prétendant servir la République.\n Son parti a déjà du succès et lui-même est très populaire. Il prône un rôle présidentiel fort, une augmentation de la coopération de classe et du nationalisme."
 u_fra.103.a:0 "Intéressant"
 u_fra.104.t:0 "Ralliement du PSF de Clichy"
 u_fra.104.d:0 "Ce mois-ci, le Parti Social Français a décidé d'organiser une rencontre à Clichy. Beaucoup de nos alliés socialistes et communistes prétendent qu'il ne s'agit que d'une autre réunion fasciste et qu'elle devrait être fermée.\n Mais l'opposition nous accuse déjà de fermer l'opposition. Arrêter cet événement ne ferait que rallier plus de monde à ses côtés, d'autant plus que de La Rocque PSF joue la carte du légalisme.\n Que diable doit-on faire ?"
 u_fra.104.a:0 "Laissons-les organiser ce rassemblement"
 u_fra.104.b:0 "Faisons les taire"
 u_fra.105.t:0 "Fusillade de Clichy"
 u_fra.105.d:0 "Après avoir autorisé l'événement, le maire SFIO de Clichy et des députés communistes ont appelé à une contre-manifestation.\n Des centaines de manifestants assiègent le lieu de rassemblement, obligeant la police à appeler des renforts. Après des avertissements, la police a ouvert le feu sur les manifestants socialistes et communistes. Il y a eu 6 morts et des centaines de blessés, dont beaucoup de policiers."
 u_fra.105.a:0 "Un jour terrible"
 u_fra.106.t:0 "Attentat de la Cagoule"
 u_fra.106.d:0 "Aujourd'hui, un événement terrible s'est produit. La Cagoule, le groupe terroriste d'extrême droite, a bombardé deux immeubles près de la place de l'Etoile.\n Il s'agissait des bâtiments de la Confédération des propriétaires français et de l'Union des industries métallurgiques. Ces attentats odieux ont manifestement été perpétrés comme une attaque sous fausse bannière, à imputer aux communistes.\n De nombreux riches propriétaires terriens et propriétaires hostiles font partie de la Cagoule, Pierre Michelin lui-même est soupçonné d'avoir financé l'attentat."
 u_fra.106.a:0 "Il faut trouver les coupables"
 u_fra.107.t:0 "Le Colonel François La Rocque"
 u_fra.107.d:0 "UNUSED"
 u_fra.107.a:0 "UNUSED"
 u_fra.108.t:0 "UNUSED"
 u_fra.108.d:0 "UNUSED"
 u_fra.108.a:0 "UNUSED"
 u_fra.109.t:0 "Nouvelles de notre Empire - 1936"
 u_fra.109.d:0 "Notre glorieux empire colonial, qui s'étend d'Est en Ouest, nous a apporté de nouvelles troupes coloniales. Ils viennent des Monts de Taza, du Souk de Ksar et de Midelt. Fiers Tirailleurs Sénégalais, Spahis, Chasseurs et Goumiers Marocains. \n Sinon, il ne se passe pas grand-chose à l'étranger. L'Afrique équatoriale a un nouveau gouverneur, Dieudonné Reste. Certains indigènes, nationalistes et communistes causent du chahut, mais rien que nos troupes ne peuvent gérer.\n Dans l'ensemble, rien de nouveau sous notre soleil colonial."
 u_fra.109.a:0 "Vive la France !"
 u_fra.110.t:0 "Nouvelles de notre Empire - 1937"
 u_fra.110.d:0 "Notre glorieux Empire Colonial, qui s'étend d'Est en Ouest, nous a apporté une nouvelle boisson rafraîchissante. Léon Beton, un français né à Boufarik, a commercialisé une délicieuse boisson appelée Orangina."
 u_fra.110.a:0 "Délicieux"
 u_fra.111.t:0 "Nouvelles de notre Empire - 1938"
 u_fra.111.d:0 "Our glorious Colonial Empire, spreading from East to West, has brought us fresh Colonial Troops. They might have been born far away, but they have an invincible flame in their heart. Because they want to fly the flag of France far and wide. And they would die for it.\n Otherwise, Hubert DesChamps recently became governor of Martinique. Dieudonné Reste declared his administration to be specialised in exportation of Coffee and Cocoa, but the production isn't very good, barely reaching 55000 tonnes."
 u_fra.111.a:0 "Je lève mon verre à notre Empire Colonial"
 u_fra.112.t:0 "Le parti communiste français"
 u_fra.112.d:0 "UNUSED"
 u_fra.112.a:0 "UNUSED"
 u_fra.113.t:0 "Rassemblement des jeunesses communistes de 1937"
 u_fra.113.d:0 "Le Parti communiste français a organisé ce mois-ci un Rassemblement des jeunes dans le nord de la France, dans la commune de Phalempin. Cet événement a lieu chaque année, mais a été un grand succès cette année. Les jeunes communistes ont eu l'occasion de pratiquer des sports, dont le cyclisme. Tout le rassemblement était joyeux et a été l'occasion pour des milliers de communistes de se rencontrer, d'échanger et d'honorer de grandes figures communistes telles que Marx et Lénine. La cérémonie de clôture a vu des milliers de voix scander l'Internationale, Maurice Thorez lui-même semblait très fier."
 u_fra.113.a:0 "Les travailleurs du monde s'unissent !"
 u_fra.114.t:0 "Daladier s'adresse à la République française"
 u_fra.114.d:0 "Aujourd'hui, dans un discours largement médiatisé, Edouard Daladier, représentant des sociaux-libéraux au Front populaire, s'est adressé à la nation à la radio. Il a parlé des dangers du fascisme et du nazisme allemand. Il a demandé au peuple français d'être fort et de rejeter les démagogues. Il a appelé à l'unité entre la classe moyenne et la classe ouvrière, et à plus grande échelle, l'unité en France."
 u_fra.114.a:0 "Intéressant"
 u_fra.115.t:0 "UNUSED"
 u_fra.115.d:0 "UNUSED"
 u_fra.115.a:0 "UNUSED"
 u_fra.116.t:0 "Le Parti Populaire Français"
 u_fra.116.d:0 "Jacques Doriot, maire de Saint-Denis, et jusqu'en 1934 un fervent communiste, a créé ce mois-ci le Parti Populaire Français.\n Cette alliance de mécontents communistes, révolutionnaires et nationalistes rappelle la création du NSDAP allemand ou du PFN italien.\n La plupart de leurs idées sont extrêmes, antidémocratiques et révolutionnaires. Mais ils ont déjà une solide base de soutien."
 u_fra.116.a:0 "Terrfiant"
 u_fra.117.t:0 "Victoire du Front Populaire"
 u_fra.117.d:0 "UNUSED"
 u_fra.117.a:0 "UNUSED"
 u_fra.118.t:0 "La perle de l'Empire"
 u_fra.118.d:0 "La Perle de notre Empire, l'Indochine, abrite de nombreuses ressources et indigènes. Il a malheureusement subi un krach économique dans les années 1920 et ne s'est pas remis depuis. La colonie dépend de la France métropolitaine pour la plupart des choses, et le continent doit couvrir de nombreux coûts.\n Cela n'aide pas que de nombreux indigènes commencent à exprimer des idées indépendantistes et communistes. Nguyễn Ái Quốc, également nommé Ho Chi Minh, est soutenu par l'URSS, mais est-il capable de semer le trouble ? Qui peut dire..."
 u_fra.118.a:0 "Troublant"
 u_fra.119.t:0 "UNUSED"
 u_fra.119.d:0 "UNUSED"
 u_fra.119.a:0 "UNUSED"
 u_fra.120.t:0 "Tensions radicales et socialistes"
 u_fra.120.d:0 "Dans une coalition comme le Front populaire, de nombreuses tensions peuvent apparaître. Les radicaux, ou sociaux-libéraux, ont des idées différentes des socialistes. Ils représentent la classe moyenne, tandis que les socialistes représentent la classe ouvrière. Beaucoup de Radicaux glissent vers la droite de l'échiquier politique, tandis que certains socialistes, mécontents que les réformes ne suffisent pas, cherchent des alternatives, avec les communistes de Thorez ou le PPF de Doriot."
 u_fra.120.a:0 "Malheureusement"
 u_fra.121.t:0 "Les ligues"
 u_fra.121.d:0 "UNUSED"
 u_fra.121.a:0 "UNUSED"
 u_fra.122.t:0 "Parade de la victoire sous la Porte de Brandeburg"
 u_fra.122.d:0 "Après notre récente victoire, notre glorieuse armée a défilée sous l'un des monuments les plus connus d'Allemagne, la Porte de Brandeburg. Nos troupes colonials, Spahis et Fusilliers Marocains et Sénégalsi, ont reçus des félicitations spéciales de notre Empereur. Il a déclaré l'annexation des terres du Rhin, et a annoncé qu'avec la dissolution de l'Allemagne, une paix durable pourrait enfin régner en Europe."
 u_fra.122.a:0 "Vive notre Empereur ! Vive la paix !"
 u_fra.123.t:0 "La victoire est à nous"
 u_fra.123.d:0 "En marchant sur les grandes puissances européennes, notre Empereur Napoléon le Grand a déclaré que plus rien ne s'opposerait à nous. La France se focalisera désormais à construire une Union Européenne centrée sur Paris. Nous sommes désormais la plus grande puissance mondiale !"
 u_fra.123.a:0 "Longue vie à l'Empire !"
 u_fra.124.t:0 "Une rencontre entre deux Empereurs"
 u_fra.124.d:0 "Lors de sa vuiste de nos territoires récement annexé des Pays-Bas, notre Empereur a rendu visite au Kaiser exilé d'Allemagne, Guillaume II. Le Kaiser appartient bien évidement à la famille royale qui mis fin au Second Empire Français. Il n'est pas sûr de ce qu'il a été dit pendant l'échange, mais notre Empereur est connu pour son mépris de la famille du Kaiser.."
 u_fra.125.t:0 "Le nouveau Tsar"
 u_fra.125.d:0 "Dans une cérémonie privée, notre Empereur Napoleon VI a reçu des représentant de pays qui étaient sous occupation soviétique. Ils ont demandés que notr souverain leur accorde la liberté, et ont ensuite promis de se battre pour l'Empereur, le qualifiant de nouveau Tsar."
 u_fra.125.a:0 "We will free you from Soviet influence"
 u_fra.142.t:0 "Dealing with Iraq"
 u_fra.142.d:0 "It is no secret that France doesn't have much oil reserves. Despite our efforts, we need to find a stable source of it, to fuel the increasingly demanding modern warfare. Fortunately, Iraq is neighbouring our Syrian Protectorate, and is rich in oil. Maybe we can convince them or invade them ?"
 u_fra.142.a:0 "Let's buy their oil with investments and alliance"
 u_fra.142.b:0 "Invasion is safer and quicker"
 u_fra.143.t:0 "France is asking for our oil"
 u_fra.143.d:0 "The French Emperor has sent a diplomatic mission to buy our oil. In exchange for the right to exploit it, they propose an alliance, and many investements in our economy. What should we do ?"
 u_fra.143.a:0 "Accept"
 u_fra.143.b:0 "Refuse"
 u_fra.144.t:0 "Iraq Accepts"
 u_fra.144.d:0 "Iraq has accepted our deal, and have conceded their oils right to us !"
 u_fra.144.a:0 "Splendid"
 u_fra.145.t:0 "Iraq Refuses"
 u_fra.145.d:0 "Iraq has refused our deal, and have defied our power !"
 u_fra.145.a:0 "Unfortunate"
 u_fra.145.b:0 "This cannot go unpunished"
 u_fra.146.t:0 "La France nous invite a la recherche sur les armes nucléaire"
 u_fra.146.d:0 "La France souhaite se procurer l'arme nucléaire, et a fait appel a tous ses alliés pour participer a ce projet."
 u_fra.146.a:0 "Si ce projet aboutit, nous aussi auront cette fantastique arme!"
 u_fra.146.b:0 "Tout cela n'est qu'une perte de temps, nous n'avons pas besoin d'une hypothétique bombe."
 u_fra.147.t:0 "Manoeuvres Militaires"
 u_fra.147.d:0 "Depuis 1935, notre pays n'a réalisé aucune manoeuvre militaire de grande ampleure. Nos troupes et généraux sont en grands manque d'entrainement, mais quel seront les thématique d'entrainement de cette année ?"
 u_fra.147.a:0 "Nous devons entrainer nos troupes a des combats durs."
 u_fra.147.b:0 "Nous devons améliorer nos tactiques de combat."
 u_fra.147.e:0 "Nous devons nous assurer de l'éfficacité de nos lignes de défenses."
 u_fra.148.t:0 "Dissolution de la Chambre des députés"
 u_fra.148.d:0 "Cela n'était pas arrivé depuis la présidence de Mac Mahon, mais avec l'accord du Sénat ce matin, la chambre des Députés va être dissoute, et de nouvelles élections lancées dans 3 mois. Malgré les protestations de la majorité parlementaire, une grande partie de la population accepte cette dissolution avec joie, après la déception des résultats aux dernières élections."
 u_fra.148.a:0 "Et c'est reparti pour un tour!"
 u_fra.149.t:0 "La france souhaite acheter notre Eau lourde"
 u_fra.149.d:0 "La france souhaite acheter la totalité de notre stock en eau lourde afin de mener des recherches dans la fission nucléaire. Mais les allemands souhaite également acheter notre eau lourde. A qui devons nous la vendre ?"
 u_fra.149.a:0 "La république française en fera le meilleur usage"
 u_fra.149.b:0 "En la donnant aux allemand, peut être respecteront t'il notre souveraineté?"
 u_fra.149.c:0 "Notre stock ne doit en aucun cas tomber entre les mains des allemands!"
 u_fra.150.t:0 "La norvége accepte de vendre l'eau lourde"
 u_fra.150.d:0 "Les norvégiens nous ont fait confiance et on anulé un accord avec les allemands pour vendre leurs eau lourde a nous uniquement"
 u_fra.150.a:0 "Cette histoire d'allemand n'a rien de rassurant..."
 u_fra.151.t:0 "Les allemands gagnent la vente"
 u_fra.151.d:0 "Les norvégiens on déclinés notre offre d'achat, déclarant que les allemands qui souhaitait également acheter l'eau lourde, était plus convinquant."
 u_fra.151.a:0 "Pas le choix, nous allons devoir sécuriser l'eau lourde nous même!"
 u_fra.152.t:0 "La norvège nous vend son eau lourde"
 u_fra.152.d:0 "Les norvégiens nous vendent leurs eau lourde, un élément important pour la création d'arme atomique. Ils nous on également indiqué que la France a essayé d'acheter le stock entier d'eau lourde, mais nous ont quand même choisi en prioriter. "
 u_fra.152.a:0 "Nous devrions surveiller ces Français..."
 u_fra.153.t:0 "La norvége nous offre son eau lourde"
 u_fra.153.d:0 "Inquiété par la demande stimultané de notre pays et de l'allemagne de son stock d'eau lourde, la norvége redoute de ce que l'allemagne pourrait faire avec une bombe atomique. Par sécurité, elle nous offre tout sont stock d'eau lourde et nous demande d'aller le récupérer discrétement"
 u_fra.153.a:0 "Nous feront de notre mieux."
 u_fra.154.t:0 "Vol de l'eau lourde"
 u_fra.154.d:0 "Dans la soirée, des individus inconnus sont entrer dans l'usine hydroélectrique de Vermork et y ont dérobée l'intégralité du stock d'eau lourde présent. La police recherche toujours les coupables, mais sans cette eau nous ne pouvons plus fournir l'allemagne."
 u_fra.154.a:0 "Espérons qu'il n'y ait pas trop de conséquences sur nos relations avec les allemands"
 u_fra.155.t:0 "Vol de l'eau lourde"
 u_fra.155.d:0 "Dans la soirée, des individus inconnus sont entrer dans l'usine hydroélectrique de Vermork en Norvège et y ont dérobée l'intégralité du stock d'eau lourde présent. La police norvégienne recherche toujours les coupables, mais les faits sont là, toute l'eau lourde a disparu."
 u_fra.155.a:0 "Cela va mettre un frein a nos avancées sur le nucléaire."
 u_fra.156.t:0 "Antoine de Saint-Exupéry survit miraculeusement au désert Libyque"
 u_fra.156.d:0 "Partis le 29 décembre de l'année dernière pour battre le record de vitesse de vol entre Paris et Saïgon, Antoine de Saint-Exupéry et son mécanicien André Prévot n'ont plus donné de nouvelle apres une escale le 30. Beaucoup s'inquiéter de la situation de l'équipage, mais celui-si va bien. Antoine a appeler depuis le Caire confirmant s'être cracher en plein désert Lybique en Egypte. Après avoir érer 3 jours dans le sahara avec pour seuls provisions un demi litre de café, un quart de litre de vin blanc, quelques grains de raisin et une orange, l'équipage a été repéré et sauvé in-extremis par des bédouins. L'équipage a peine rétabli s'est déjà remis en route pour constater les dêgats de leur avion."
 u_fra.156.a:0 "Nos aviateurs sont décidément invincibles"
 u_fra.157.t:0 "Antoine de Saint-Exupéry disparu en Egypte"
 u_fra.157.d:0 "Partis le 29 décembre de l'année dernière pour battre le record de vitesse de vol entre Paris et Saïgon, Antoine de Saint-Exupéry et son mécanicien André Prévot n'ont plus donné de nouvelle apres une escale le 30. Beaucoup s'inquiêtes de la survie de l'équipage, tandis que des recherches pour localiser la possible caracasse de l'avion ont été lancer. Au vue des condition de la région, les chances de survie de l'équipage semblent faibles..."
 u_fra.157.a:0 "D'abord Pharabod et Klein, maintenant Antoine et André..."
 u_fra.158.t:0 "Accident de Jean Mermoz en mer"
 u_fra.158.d:0 "En ce 7 décembre, Mermoz et son équipage on eu un accident dans leur Lacotère-300 'Croix du Sud'. Alors qu'ils partaient de Dakar pour aller vers Natal, le moteur droit subit une défaillance, forcant l'équipage a abruptement amerrir dans une mer tumultueuse. L'appareil est fortement endommagé mais réussit a communiquer sa position au secours. L'équipage sera finalement secouru le lendemain par le F 2200 'Ville de Montevideo'. Cette survie a un environnement dangereux a renforcer l'autorité de l'aviateur Mermoz aurpès de ces camarades au sein du Parti Social Français, qu'ils le voient comme un homme invincible."
 u_fra.158.b:0 "En ce 7 décembre, Mermoz et son équipage on eu un accident dans leur Lacotère-300 'Croix du Sud'. Alors qu'ils partaient de Dakar pour aller vers Natal, le moteur droit subit une défaillance, forcant l'équipage a abruptement amerrir dans une mer tumultueuse. L'appareil est fortement endommagé mais réussit a communiquer sa position au secours. L'équipage sera finalement secouru le lendemain par le F 2200 'Ville de Montevideo'. Cette survie a un environnement dangereux a renforcer l'autorité de l'aviateur Mermoz aurpès de ces camarades au sein de la Croix de Feu, qu'ils le voient comme un homme invincible."
 u_fra.158.a:0 "Une catastrophe évité de peu..."
 u_fra.159.t:0 "Disparition de Jean Mermoz en mer"
 u_fra.159.d:0 "Le 7 décembre, Mermoz, Alexendre Pichodou, Henri Ezan, Edgar Cruveiler et Jean Lavidalie embarquent dans le Lacotère-300 'Croix du Sud' et décollent de Dakar pour aller vers Natal, ce après avoir annulé le vol précédent faute du réducteur moteur droit. Mais a 10 heure 43, l'avion envoie en morse 'Coupons moteur arrière droit' et a cesser de communiquer. Des recherches de grande envergueur on été lancé dans la région, notamment par Henri Guillaumet son amis qui les avait vu repartir a Drakar, mais aucune partie de l'avion n'a toujours pu être retrouvée. Nombreux considèrent déjà l'équipage comme mort, et souhaiteraient qu'il soient comémorer."
 u_fra.159.a:0 "Aujourd'hui, la France a perdu un grand homme"
 u_fra.161.t:0 "La France gagne la course Istres-Damas-Paris"
 u_fra.161.d:0 "Pour fêter le 10ème anniversaire de la traversée de l'Atlantique par Charles Lindbergh, l'aéroclube de France a lancer un concours pour relier Istres et Paris en faisant un détour par Damas. Sur les 13 appareils participant, 4 sont d'origine Française et seul 9 on finis la course. Partis du Bourget au soir du 20 août, nos avions ont rapidement pris la tête de la course grâce a nos récents progrès technologique en aéronautique. L'appareil de Henri Guillaumet ne se posera même pas a Damas, étant alors le seul avion a avoir l'autonomie de faire le voyage sans ravitaillement. Le podium est finalement conquis par 3 français, avec Paul Codos et Maurice Amoux dans leurs 'Fulgur' premier arrivées. Il est a noté cependant que la 4ème, 5ème et 6ème place on toutes été prises par des Italiens..."
 u_fra.161.a:0 "Une victoire fulgurante !"
 u_fra.162.t:0 "Résultats de la course Istres-Damas-Paris"
 u_fra.162.d:0 "Pour fêter le 10ème anniversaire de la traversée de l'Atlantique par Charles Lindbergh, l'aéroclube de France a lancer un concours pour relier Istres et Paris en faisant un détour par Damas. Sur les 9 appareils participant, 4 sont d'origine Française et seul 9 on finis la course. Partis du Bourget au soir du 20 août, nos avions décollent, et sont suivis par le brittanique et les appareils italiens a 21 heure et 22 heure. Nottablement, parmis les participant italiens figure le fils du Duce, Bruno Mussolini. Alors que les avions se ravitaillent a Damas, Henri Guillamet et son avion quadrimoteur F2231 'F-2' continue sans ce poser, son avion ayant l'autonomie suffisante pour se trajet sans escale. Mais a son retour, il sera pris dans une violente tempête, le ralentisant et épuisant son carburant, l'obligeant a se ravitailler a Belgrade, et finisant en 9ème place. Le podium est finalement conquis par 3 équipages italiens, avec Ranieri Cupini et Amadeo Paradisi dans leur 'S-79' finissant premier au bout de 17 heures et 32 minutes de vol. Notre meilleur pilote sera Codos qui finit en 5ème position"
 u_fra.162.a:0 "Notre aviation de longue distance va devoir être améliorer..."
 u_fra.163.t:0 "Accident mortel sur la course Istres-Damas-Paris"
 u_fra.163.d:0 "Pour fêter le 10ème anniversaire de la traversée de l'Atlantique par Charles Lindbergh, l'aéroclube de France a lancer un concours pour relier Istres et Paris en faisant un détour par Damas. Sur les 9 appareils participant, 4 sont d'origine Française et seul 8 on finis la course. Partis du Bourget au soir du 20 août, nos avions décollent, et sont suivis par le brittanique et les appareils italiens a 21 heure et 22 heure. Nottablement, parmis les participant italiens figure le fils du Duce, Bruno Mussolini. Alors que les avions se ravitaillent a Damas, Henri Guillamet et son avion quadrimoteur F2231 'F-2' continue sans ce poser, son avion ayant l'autonomie suffisante pour se trajet sans escale. Mais alors qu'il devait être sur le chemin retour, au dessus de la péninsule d'Istres, l'avion signale une violente tempête et qu'il va essayé de passer a travers plutôt que de le contourner. Cette décision semble avoir été fatale, car l'avion envoira plus tard un SOS. La carcasse de l'avion sera retrouvé le lendemain, il semble avoir tenté un atterisage dans une forêt, surement du a une mauvaise visibilité. Tous ces aucupant sont morts. Le podium lui est conquis par 3 équipages italiens."
 u_fra.163.a:0 "Un drame"
 u_fra.165.t:0 "Préparation a la fête nationale"
 u_fra.165.d:0 "Tous les ans, nous organisons des défilés militaires sur les champs élyssés a Paris pour unir notre peuple et prouver notre puissance militaire. Cependant, ce défilé a un prix, et il va faloir l'organisé."
 u_fra.165.a:0 "En vue de la situation actuelle, nous ne pouvons nous pas nous permettre un défilé"
 u_fra.165.b:0 "Organisons un petit défilé"
 u_fra.165.c:0 "Organisons un défilé spectaculaire !"
 u_fra.165.e:0 "Ce n'est pas parce que Paris est occupé par l'ennemi que nous n'auront pas de fête !"
 u_fra.166.t:0 "Fête Nationale"
 u_fra.166.d:0 "Les banderoles tricolores flottent au vent, les rues ont été nétoyée, et des citoyens de toute la nation se sont rassemblés pour le défilé. Les chefs du gouvernement se sont déplacés accompagnés d'un cortège de la garde républicaine. Les premières unités ce sont mis en marches alors que la Marseillaise retentit. Arrives alors enfin les vedettes du spectacle, les ..."
 u_fra.166.a:0 "Les avions flambant neuf de l'armée de l'air"
 u_fra.166.b:0 "Les troupes de la marine nationale"
 u_fra.166.c:0 "De fiers soldats de l'armée de terre"
 u_fra.166.e:0 "Des ouvriers de nos manufactures d'armes"
 u_fra.166.f:0 "Des colonnes de nos meilleurs chars"
 u_fra.166.g:0 "Les soldats de la ligne maginot "
 u_fra.166.h:0 "La légion étrangère"
 u_fra.166.i:0 "Les troupes spécialisés du génie, du ravitaillement et des hopitaux de guerre"
 u_fra.166.j:0 "Des troupes des pays de nos alliés"
 u_fra.170.t:0 "Changer la date de la fête nationale"
 u_fra.170.d:0 "Maintenant que la Monarchie a été rétablie, il est inacceptable de garder pour fête nationale le 14 juillet, symbole d'une République sanginaire et instable."
 u_fra.170.a:0 "Prenons le 23 Juin, la fête de notre roi Jean III"
 u_fra.170.b:0 "Prenons le 1er Août, la fête de notre roi Alphonse Ier"
 u_fra.170.c:0 "Prenons le 8 mai, le jour ou Jeanne d'arc libéra Orléans des Anglais"
 u_fra.170.e:0 "Prenons le 25 décembre, jour du couronnement de Charlemagne empeureur des Francs"
 u_fra.170.f:0 "Prenons le 27 juillet, victoire qui renforce la France et l'importance des rois Capétiens"
 u_fra.171.d:0 "Maintenant que nous en avons terminer avec la République, ils nous faut maintenant nous débaraser de ces symboles, tel la fête Nationale, symbole du soulèvement du peuple contre ces oppresseurs..."
 u_fra.171.a:0 "Prenons le 6 février, jour sanglant qui a permis a la droite de s'unifier"
 u_fra.171.b:0 "En hommage a nos frères tombés à la guerre, faisont du 11 novembre la fête nationale"
 u_fra.172.d:0 "Avec notre nouvelle emprise communiste, beaucoup souhaitent remplacer la fête nationale et le 14 juillet par une autre date."
 u_fra.172.a:0 "Prenons le 1er mai, la Journée Internationale des Travailleurs"
 u_fra.172.b:0 "En mémoire de nos aïeul massacrés a la fin de la commune de Paris, prenons le 28 mai"
 u_fra.172.c:0 "La révolution Française n'est pas notre ennemi, le 14 juillet peut rester en place"
 u_fra.173.d:0 "Maintenant que le 3ème Empire a été instauré, nous devons appliquer quelques remaniment, tel la date de la fête nationale. Pouvons nous vraiment célébrer le jour qui a mener a la destitution de la monarchie et la création de la République?"
 u_fra.173.a:0 "Prenons le 15 Août, la fête et naissance de Napoléon"
 u_fra.173.b:0 "Pourtant c'est le 14 juillet et la République qui a permis a Napoléon de monter au pouvoir"
 u_fra.174.t:0 "Mort d'Alphonse Ier"
 u_fra.174.d:0 "Se matin, le roi d'Espagne, de France et de Navarre c'est éteint suite a une angine de poitrine. Des obsèques on été déclaré pour les 3 prochains jour tandis que la dépouille du roi est en route vers le site royal d'Escurial en Espagne pour y être enterrer. La question de l'héritier du trône se pose. Légitimement, il s'agirait du second fils d'Alphonse, le prince Jacques Henri de Bourbon, mais certains émettent des doutes sur sa capacité a régner, étant sourd et muet depuis 1912. Beaucoup voirait son petit frère, le prince Juan de Bourbon comme prétendant légitime..."
 u_fra.174.a:0 "Longue vie au Roi Jaques II !"
 u_fra.174.b:0 "Longue vie au Roi Juan I !"
 u_fra.175.t:0 "Mort de Jean III"
 u_fra.175.d:0 "Se matin, le roi de France Jean III nous a quitter a l'âge de 65 ans. Des obsèques on été déclaré pour les 3 prochains jour tandis que la dépouille du roi est en route vers la chapelle royale de Dreux, la nécropole de la famille Orléaniste. L'héritier au trone est le fils unique de Jean III, Henri Robert Ferdinand Marie."
 u_fra.175.a:0 "Le roi est mort, longue vie au roi !"
 u_fra.177.t:0 "Abandon du Trans-Saharien"
 u_fra.177.d:0 "Après deux ans de constructions, le projet de relier les colonies d'afrique françaises par le Sahara semble être a son point mort. La difficulté du terrain ainsi que le coût faramineux du projet n'ont pas aidés, et certains suspectent de la corruption."
 u_fra.177.a:0 "Un échec cuissant"