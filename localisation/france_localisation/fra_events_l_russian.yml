l_russian:
  u_fra.146.t:0 "Массовые протесты"
  u_fra.146.d:0 "Политическая импотенция и экономические проблемы в стране привели к массовым протестам и конфликтам. Это очень плохо сказывается как на нашем производстве, так и на нашей промышленности. В Европе вытащили мечи, нам нужно как можно скорее избавиться от наших экономических проблем."
  u_fra.146.a:0 "О, Боже."
  MINIMIZE_EVENT:0 "§GНажмите§!, чтобы свернуть. Событие будет помещено в очередь событий в разделе §HEvents and Decisions§!."
  u_fra.1.t:0 "Вьенотские соглашения"
  u_fra.1.d:0 "В 1934 году Франция попыталась навязать договор о независимости, который был сильно предвзятым в ее пользу. Он обещал постепенную независимость, но оставлял Сирийские горы под французским контролем. Сирийским главой государства в то время был французский ставленник Мухаммед Али Бей аль-Абид. Жесткое противодействие этому договору возглавил старший националист и парламентарий Хашим аль-Атасси, который призвал к шестидесятидневной забастовке в знак протеста. Политическая коалиция Атасси, Национальный блок, мобилизовала массовую народную поддержку его призыва. Начались беспорядки и демонстрации, и экономика замерла. [FRA.GetLeader] согласился признать Национальный блок единственным законным представителем сирийского народа и пригласил Хашима аль-Атасси на переговоры о независимости в Париже. Он отправился туда 22 марта 1936 года, возглавив делегацию старших блоков. Результатом этого договора стало немедленное признание независимости Сирии как суверенной республики с полной эмансипацией, предоставленной постепенно в течение 25-летнего периода."
  u_fra.1.a:0 "Они этого заслужили!"
  u_fra.2.t:0 "Решающий выбор"
  u_fra.2.d:1 "Теперь, когда Франция находится под нашим контролем, мы должны искоренить упадок и остановить моральное разложение. Для этого более высокие моральные ценности и божественные наказания являются лучшим решением. Очевидный выбор — объявить католицизм государственной религией, потому что Франция является старшей дочерью Церкви, и большая часть Церкви согласится с нашими идеями. Но прозвучало несколько голосов, проповедующих возвращение к старым Богам. К религии кельтов, галльского народа, наших предков. Тутатиса, Эсуса и Тараниса. Это смелый шаг, и он не пользуется популярностью, но он может окупиться. Что нам делать?"
  u_fra.2.a:0 "Франция, Европа, Христианство!"
  u_fra.2.b:0 "За Тутатиса!"
  u_fra.3.t:0 "Уничтожение республиканских символов"
  u_fra.3.d:0 "Горящие фотографии и разрушенные статуи были зрелищем, которое можно было увидеть в Париже сегодня. В страстной речи [FRA.GetLeader] отменил 14 июля и Марианну, а вместо этого объявил о посвящении Франции Святейшему Сердцу Иисуса и Святой Жанне д'Арк."
  u_fra.3.a:0 "К чёрту республику!"
  u_fra.4.t:0 "Очень секретная служба"
  u_fra.4.d:1 "На строго конфиденциальном совещании [FRA.GetLeader], с французским Генеральным Штабом, пришел к выводу, что правительство крайне нуждается в службе разведки. Было решено разделить службу на два подразделения: BCRA и DGER. Генеральное управление исследований и изысканий или Генеральное управление исследований и изысканий - внешняя разведка Франции, занимающаяся внешней разведкой и секретными операциями. Главная цель Центрального бюро информации и операций или Центрального бюро разведки и операций - обеспечить безопасность на территории Франции, противостоять иностранному влиянию и объединять полицейские и политические роли. У нас имеется профицит бюджета, на что следует его направить?"
  u_fra.4.a:0 "DGER"
  u_fra.4.b:0 "BCRA"
  u_fra.5.t:0 "Наша промышленная специализация"
  u_fra.5.d:1 "Чтобы догнать иностранную промышленность, было решено увеличить инвестиции в одну из отраслей нашей промышленности. Это должно позволить значительно увеличить объемы производства, но в какую отрасль следует инвестировать?"
  u_fra.5.a:0 "Оружие каждому!"
  u_fra.5.b:0 "Мы сокрушим их скоростью!"
  u_fra.5.c:0 "Наша огневая мощь уничтожит их!"
  u_fra.6.t:0 "Смена столицы?"
  u_fra.6.d:1 "Поскольку сейчас вся Европа объединена под нашим флагом, кое-кто из близкого окружения [FRA.GetLeader] обратился к нему с проблемой. Стоит ли менять столицу? Некоторые считают, что поскольку империя стала новой Римской империей, новой столицей должен стать Рим. Другие считают, что континентальной столицей должна стать Москва, поскольку она находится в центре между Азией и Европой. Но большинство говорит, что Париж, наша нынешняя прекрасная столица, должна стать Новым Римом. Что нам выбрать?"
  u_fra.6.a:0 "Конечно, Париж!"
  u_fra.6.b:0 "Рим — колыбель Европы"
  u_fra.6.c:0 "Москва — центр между Азией и Европой"
  u_fra.7.t:0 "Гражданский кодекс"
  u_fra.7.d:0 "Стремясь подражать своему предку, Наполеон IV создал новый Гражданский кодекс, установив новые правила своей империи. Его сторонники сочли этот шаг революцией, в то время как противники утверждают, что это был пустой шаг, предпринятый лишь для повышения его популярности."
  u_fra.7.a:0 "Все равно лучше, чем ничего..."
  u_fra.8.t:0 "Империя с Запада на Восток"
  u_fra.8.d:0 "Сегодня после многих лет войны и лишений Франция наконец объединила Европу. В одной из самых просматриваемых речей в истории [FRA.GetLeader] провозгласил единство братьев от Атлантики до Урала, сравнив французский народ с Александром, Юлием Цезарем, Хлодвигом и Карлом Великим. Говорят, в разных уголках Германии, Польши и России вспыхнули протесты, но их якобы взяла под контроль французская жандармерия."
  u_fra.8.a:0 "От Атлантики до Урала!"
  u_fra.9.t:0 "Естественные границы Франции"
  u_fra.9.d:0 "Наконец-то настал момент, когда французская оккупация на Нижних землях подошла к концу, и началась интеграция. Военные ушли и были заменены французской полицией. Административные здания были переоборудованы для предоставления недавно интегрированным гражданам французского гражданства. Говорят, во Фландрии жители более неохотно интегрируются, чем в Валлонии, но в целом процесс интеграции проходит безболезненно."
  u_fra.9.a:0 "Добро пожаловать нашим новым братьям!"
  u_fra.10.t:0 "Начало строительства Транссахарской железной дороги"
  u_fra.10.d:0 "Сегодня в Алжире состоялась торжественная церемония, которую провел [FRA.GetLeader]. Он начал строительство Транссахарской железной дороги, которая протянется от Алжира до Дакара. Присутствовали представители и пресса со всего мира. Эта инициатива была высоко оценена и, несомненно, увеличит процветание Французской колониальной империи в Африке."
  u_fra.10.a:0 "Настоящее чудо!"
  u_fra.11.t:0 "Трансевропейская железная дорога"
  u_fra.11.d:0 "Сегодня утром на торжественной церемонии, которой с нетерпением ждали, [FRA.GetLeader] начал строительство Трансевропейской железной дороги, которая протянется от Парижа до Москвы, проходя через все европейские столицы. Несмотря на то что ее строительство займет годы, этот проект сблизит европейских братьев, как никогда раньше, и улучшит контроль Франции над своей империей."
  u_fra.11.a:0 "Европа, наконец-то объединена!"
  u_fra.12.t:0 "Перепись населения Сахары"
  u_fra.12.d:0 "Наши обширные африканские территории полны ресурсов и рабочей силы. Но печальная правда в том, что не все наши сахарские территории известны. Пришло время отправить группы для картографирования и получения информации из центра пустыни."
  u_fra.12.a:0 "Призовите их!"
  u_fra.12.b:0 "Оставьте их в покое..."
  u_fra.13.t:0 "Война в Индокитае"
  u_fra.13.d:0 "В 08:30 сегодня утром вьетнамские повстанцы захватили здания колониальной администрации на наших территориях в Индокитае. Они размахивали красным флагом с желтой звездой, чтобы показать свою приверженность марксизму. Несколько лояльных ополченцев и охранников колониальной безопасности поднялись, чтобы подавить восстание, но оно, похоже, больше, чем все, с чем нам приходилось сталкиваться раньше."
  u_fra.13.a:0 "Проклятые предатели!"
  u_fra.14.t:0 "Антиунификационные протесты"
  u_fra.14.d:0 "После объявления об объединении Европы вспыхнули протесты. Националистические и регионалистские группы в Украине, России, Польше, Беларуси, Германии и Австрии рулят ими! Несмотря на все усилия нашей жандармерии, они, кажется, выходят из-под контроля, и нужно что-то делать, прежде чем это перерастет в гражданскую войну!"
  u_fra.14.a:0 "Единственный наш выход — отказаться от объединения!"
  u_fra.14.b:0 "Мы с ними разберемся!"
  u_fra.16.t:0 "[From.GetNameDefCap] потребовать объединения Европы"
  u_fra.16.d:0 "[From.GetNameDefCap] созвал встречу европейских стран сегодня, чтобы обсудить Европейское федеральное государство! [FRA.GetLeader] умолял о мире в Европе и создании глобальной сверхдержавы. За что проголосуем?"
  u_fra.16.a:0 "Отличная идея!"
  u_fra.16.b:0 "Сумасшедший бред!"
  u_fra.17.t:0 "[From.GetNameDefCap] согласен объединяться"
  u_fra.17.d:0 "После долгих переговоров было достигнуто соглашение с правительством [From.GetNameDefCap]. Они решили присоединиться к Европейскому федеральному государству в качестве полноправных членов."
  u_fra.17.a:0 "Замечательно"
  u_fra.18.t:0 "[From.GetNameDefCap] направляет ультиматум"
  u_fra.18.d:0 "[From.GetNameDefCap] потребовал от нас передать ему наши территории и флот, чтобы защитить северные границы."
  u_fra.18.a:0 "У нас нет выбора..."
  u_fra.18.b:0 "Смерть, но не бесчестье!"
  u_fra.19.t:0 "[From.GetNameDefCap] капитулирует"
  u_fra.19.d:0 "[From.GetNameDefCap] принимает наш ультиматум."
  u_fra.19.a:0 "Хороший выбор"
  u_fra.20.t:0 "[From.GetNameDefCap] отказывается"
  u_fra.20.d:0 "[From.GetNameDefCap] отвергает наш ультиматум."
  u_fra.20.a:0 "Дураки..."
  u_fra.21.t:0 "Пакт Молотова-Риббентропа"
  u_fra.21.d:0 "Министры иностранных дел Германии и СССР попросили нас сегодня присоединиться к переговорам в качестве наблюдателей. Конечно, это был не дружеский жест. Берлин надеется, что мы не будем вмешиваться, если они решат выступить против Польши. Тем временем Москва настоятельно рекомендовала нам принять условие не вмешиваться и соблюдать пакт, а также улучшить с ними дипломатические отношения."
  u_fra.21.a:0 "Очень хорошо!"
  u_fra.21.b:0 "Недопустимо!"
  u_fra.25.t:0 "Франция предлагает поддержку монархическому перевороту"
  u_fra.25.d:0 "[From.GetNameDefCap] обратился к промонархическим и антифашистским элементам итальянского правительства и подполья с планами убийства Муссолини и провозглашения Виктора Эммануила III лидером нации. Французы уверяют нас, что они могут организовать убийство; все, что нам нужно сделать, - это подтвердить нашу готовность создать новое правительство и пообещать нашу будущую военную поддержку Франции."
  u_fra.25.a:0 "Мы должны обратиться к монархии в будущем."
  u_fra.25.b:0 "Нелепость! Мы никогда не откажемся от своих путей!"
  u_fra.26.t:0 "[From.GetAdjective] принимают предложение о перевороте"
  u_fra.26.d:0 "Элементы в правительстве и подполье [From.GetAdjective] приняли наше предложение о перевороте. Они готовятся к быстрому захвату власти для короля, как только будет совершено убийство."
  u_fra.26.a:0 "Мы можем привести наши планы в действие."
  u_fra.27.t:0 "[From.GetAdjective] отвергают предложение о перевороте"
  u_fra.27.d:0 "Элементы правительства и подполья [From.GetAdjective], с которыми мы связались, сказали нам, мягко говоря, что они не заинтересованы в нашем предложении о перевороте. Они пригрозили раскрыть наши планы итальянскому правительству, если мы снова посмеем сделать такое предложение."
  u_fra.27.a:0 "Как прискорбно."
  u_fra.28.t:0 "Убийство Муссолини французами"
  u_fra.28.d:0 "Французский план успешно реализован, сегодня Муссолини был застрелен в Риме. Король Виктор Эммануил III взял бразды правления в свои руки и дал обещание присоединиться к Французскому альянсу вместе с [From.GetNameDef]."
  u_fra.28.a:0 "Мы должны проявить свою признательность."
  u_fra.29.t:0 "Убийство Муссолини прошло успешно"
  u_fra.29.d:0 "Наш план был выполнен безупречно, а Виктор Эммануил III принял мантию лидерства своей нации. Первым его актом было подписание договора, гарантирующего вступление Италии в союз Центральных держав."
  u_fra.29.a:0 "Монархии вновь восстанут!"
  u_fra.30.t:0 "Святая Земля"
  u_fra.30.d:0 "Впервые за почти 700 лет было восстановлено государство крестоносцев. После церемонии и мессы в Храме Гроба Господня французское правительство заявило, что именно это следовало сделать в 1919 году и что только слабые и коррумпированные демократии и Лига Наций помешали этому. [FRA.GetLeader] завершил церемонию, заявив об успехе Десятого крестового похода."
  u_fra.30.a:0 "Non Nobis Domine !"
  u_fra.31.t:0 "Пакт Лаваля-Хора"
  u_fra.31.d:0 "В декабре прошлого года разразился скандал. Пьер Лаваль попытался тайно договориться с Англией и Италией, оставив Абиссинию. Предложение вызвало бурю негодования в Великобритании и Франции и так и не вступило в силу. Этот скандал сделал Пьера Лаваля очень непопулярным среди народа и коллег-политиков."
  u_fra.31.a:0 "Scandaleux !"
  u_fra.32.t:0 "Выборы 1936"
  u_fra.32.d:0 "В этом месяце пройдут выборы в законодательные органы Франции для избрания 16-го законодательного собрания Третьей республики. Народ массово идет на выборы. Это может стать поворотным моментом для нашей страны."
  u_fra.32.a:0 "Будем надеяться, что ничто не помешает"
  u_fra.33.t:0 "Исторический Мажино"
  u_fra.33.d:0 "Активировать исторический мод Мажино? Он направлен на более исторический опыт на линии Мажино и на большее количество решений по фортификации"
  u_fra.33.a:0 "Да !"
  u_fra.33.b:0 "Нет !"
  fra_news.1.t:0 "Всемирная выставка искусств и техники в современной жизни"
  fra_news.1.d:0 "Всемирная выставка искусств и техники в современной жизни открылась в Париже, Франция. Двумя из самых заметных павильонов являются нацистская Германия и Советский Союз. Павильон Шпеера завершается высокой башней, увенчанной символами нацистского государства, задуманной как памятник \"гордости и достижению Германии\". Архитектором советского павильона является Борис Иофан. Он увенчан \"Рабочим и колхозницей\", большой статуей, призванной символизировать союз рабочих и крестьян."
  fra_news.1.a:0 "Удивительно"
  fra_news.1.b:0 "Великий момент для Франции!"
  u_fra.34.t:0 "Вопрос Дворца"
  u_fra.34.d:0 "Теперь, когда во Франции снова правит монарх, возникает вопрос: где он будет править Францией? Елисейский дворец был официальной резиденцией президента при Республике. Но во время Реставрации Бурбонов королевской резиденцией был Пале-Рояль. А где будет жить монарх после этой Второй реставрации? Элитная дворцовая гвардия готова переехать и защитить новый дворец после принятия решения."
  u_fra.34.a:0 "Сохранить Елисейский дворец"
  u_fra.34.b:0 "Пале-Рояль"
  u_fra.35.t:0 "Почтить вандейцев"
  u_fra.35.d:0 "Некоторые из наших подданных взяли на себя смелость отпраздновать Вандейскую войну, так как монархия наконец вернулась во Францию. Вандейские и шуанские солдаты сражались против Революции, несмотря ни на что, защищая короля, Францию и Бога. Сегодня их память наконец-то может быть должным образом почтена."
  u_fra.35.a:0 "За Бога, Францию, короля!"
  u_fra.36.t:0 "АФ атакует Блюма"
  u_fra.36.d:0 "На фоне продолжающихся во Франции политических волнений, видный деятель Французской секции Рабочего Интернационала (SFIO) Леон Блюм был вытащен из машины и чуть не избит насмерть боевиками Королевских камелотов. Их родительская организация, правая лига Action Française, не взяла на себя ответственность за нападение. Вместо этого они заняли противоположную позицию и обвинили Блюма. Они утверждают, что Блюм был дерзким и сам их спровоцировал. Но главный идеолог Action Française Шарль Моррас явно призывал к применению насилия или даже к убийству Блюма. Многие требуют запретить Action Française."
  u_fra.36.a:0 "Нельзя их за это винить"
  u_fra.36.b:0 "Запретить это отвратительное движение!"
  u_fra.37.t:0 "Народный фронт"
  u_fra.37.d:0 "Народный фронт - это союз левых движений, в том числе Французской секции Коммунистического интернационала (SFIC, также известной как Французская коммунистическая партия), Французской секции Социалистического рабочего интернационала (SFIO) и прогрессивной Республиканской радикал-социалистической партии. Но этот союз непрочный, и коммунисты выдвигают все больше и больше радикальных требований. Если мы пойдем у них на поводу, наши шансы на победу на выборах могут возрасти, но это опасный шаг. Каким он будет?"
  u_fra.37.a:0 "Установить более тесные отношения с PCF и SFIC"
  u_fra.37.b:0 "Никаких компромиссов, Фронт останется таким, какой он есть!"
  u_fra.38.t:0 "Выборы премьер-министра"
  u_fra.38.d:0 "После того как мы восстановили выборы, французский народ в этом месяце избрал своего первого премьер-министра, который будет служить королю. После поражения в 1936 году Народный фронт распался, и Блюм, лидер Социалистической партии (SFIO), и Даладье, прогрессивная Республиканская партия, являются хорошо одобренными кандидатами. Но один неожиданный кандидат проявил себя после возвышения монархии. Это Жорж Валуа, «анархист, обращенный в роялизм», как выразился сам король. Несколько лет назад король назначил его советником принца и наследника. Теперь он был известным сторонником фашизма и анархизма, но он заявил, что хочет только служить Франции."
  u_fra.38.a:0 "Блюм и SFIO"
  u_fra.38.b:0 "Даладье и Parti Radical"
  u_fra.38.c:0 "Жорж Валуа, человек принца"
  u_fra.39.t:0 "Покупка американских самолетов"
  u_fra.39.desc:0 "К сожалению, США придерживаются очень изоляционистской позиции. Но один из вариантов купить у них самолеты - использовать Карибские острова в качестве оплаты. Возможно, тогда они склонятся к принятию."
  u_fra.39.a:0 "Сделать это"
  u_fra.39.b:0 "Мы не можем поставить под угрозу нашу империю"
  u_fra.40.t:0 "Франция предлагает Карибские острова в обмен на самолеты"
  u_fra.40.desc:0 "Франция предлагает Карибские острова в обмен на самолеты"
  u_fra.40.a:0 "Сделка!"
  u_fra.40.b:0 "Отклонить"
  u_fra.41.t:0 "США соглашаются продать самолеты"
  u_fra.41.desc:0 "США приняли наше предложение. Наши территории готовы к передаче, и первые самолеты должны прибыть в ближайшее время."
  u_fra.41.a:0 "Wonderful"
  u_fra.42.t:0 "USA refuse"
  u_fra.42.desc:0 "The americans refuse to trade weapons against our Island"
  u_fra.42.a:0 "Maudits Isolationistes!"
  u_fra.43.t:0 "France propose to divide Germany"
  u_fra.43.d:0 ""
  u_fra.43.a:0 "Yes"
  u_fra.43.b:0 "No"
  u_fra.44.t:0 "The UK accepts to divide Germany"
  u_fra.44.d:0 ""
  u_fra.44.a:0 "The German threat is finally over"
  u_fra.45.t:0 "The UK refuses to divide Germany"
  u_fra.45.d:0 ""
  u_fra.45.a:0 "They are making a grave mistake"
  u_fra.46.t:0 "Communist Rise in France - Laval Opportunity"
  u_fra.46.d:0 "With the news of Blum placating the communists, many moderates are disgruntled. This could be an opportunity for the disgraced Prime Minister Laval. By re-creating an alliance with moderates, centre-right Radicals, conservative liberals and Catholic nationalists, the so called National Bloc could ensure victory !"
  u_fra.46.a:0 "Form the National Bloc"
  u_fra.46.b:0 "We cannot trust Laval"
  u_fra.47.t:0 "Action Française Coup"
  u_fra.47.d:0 "Во время голосования, когда власть еще не была стабильной, произошел жестокий переворот под предводительством Шарля Морраса и Движения \"Аксьон Франсез\". Они захватили важные правительственные здания в Париже, Лионе, Марселе и Страсбурге. Камело дю Руа арестовали нескольких политиков. Остатки правительства обратились к армии с просьбой вмешаться, однако многие военные симпатизировали движению, а многие другие ненавидели правительство. В эти неспокойные времена многие обратились к маршалу Петену с просьбой разрешить кризис."
  u_fra.47.a:0 "Армия на стороне Морраса"
  u_fra.47.b:0 "Армия вмешивается в поддержку республики"
  u_fra.48.t:0 "Победа Леона Блюма"
  u_fra.48.d:0 "Франция проголосовала за кандидатов от социалистической партии, Леона Блюма. Рабочие начали забастовки, чтобы отпраздновать этот день, поскольку, наконец, появилась надежда на улучшение условий и зарплат."
  u_fra.48.a:0 "Да здравствует Народный фронт"
  u_fra.49.t:0 "Победа ФСР и ФКП"
  u_fra.49.d:0 "Франция проголосовала за кандидатов от социалистической партии, Леона Блюма. Рабочие начали забастовки, чтобы отпраздновать этот день, поскольку, наконец, появилась надежда на улучшение условий и зарплат. Но уже более радикальные члены коалиции требуют дополнительных уступок. Каким бы ни было будущее Франции, коммунисты, безусловно, сыграют важную роль..."
  u_fra.49.a:0 "Да здравствует Коммуна"
  u_fra.50.t:0 "Лаваль переизбран"
  u_fra.50.d:0 "Неожиданный поворот событий привел Лаваля к переизбранию на пост премьер-министра Франции. Используя радикализацию Народного фронта для обеспечения необходимой поддержки, он смог заручиться голосами французов. Но пока никто не может сказать, сохранит ли вновь избранный премьер-министр республику в прежнем виде или проведет более глубокие изменения..."
  u_fra.50.a:0 "Франция приступит к своему Национальному возрождению"
  u_fra.50.b:0 "Франция сохранит курс демократии"
  u_fra.51.t:0 "Следуйте за нами, господин Блюм"
  u_fra.51.d:0 ""Последние недели были сумасшедшими, что даже в холодную и безмолвную ночь в воздухе можно было почувствовать безумие. Он почти видел победу правосудия и социализма во Франции. Он почти вошел в историю. Но теперь Леон Блюм был врагом номер один. В глазах правительства он был тем, кто почти привел к власти болезнь большевизма.\nВот почему он должен был уйти. Были движения сопротивления, но он был публичной фигурой, ему нужно было отправиться куда-то еще, чтобы бороться. На данный момент лучшим выбором казались Соединенные Штаты Америки. И, слава Богу, вот-вот должен был отплыть корабль в Новый Свет, на который он должен был сесть.\n"Месье Блюм?", - раздался голос у него за спиной. Он обернулся и увидел четверых жандармов, некоторые из которых были тяжело вооружены.\n"
  u_fra.51.a:0 "'Следуйте за нами, месье Блюм.'"
  u_fra.52.t:0 "Под палящим африканским солнцем"
  u_fra.52.d:0 "Лицо его обрастало бородой, песок разъедал его голубые глаза, волосы стали белыми прежде времени, язык словно огненный, опухший от жажды. Но он грезил об этом месте, там, за морем. Франция. Он проливал за нее кровь. Он терял друзей в Вердене и на Марне. Он сражался с коммунистами на улицах, защищая страну. Напрасно. И из-за этого сейчас он оказался здесь, в самой середине пустыни Сахара. Он умрет через несколько часов. Он это знал. Охранники постараются. "
  u_fra.52.a:0 "Такова жизнь в лагерях"
  u_fra.53.t:0 "Недовольные рабочие"
  u_fra.53.d:0 "Похоже, многие рабочие обеспокоены развитием политической ситуации в стране. Многие из них по-прежнему поддерживают Коммунистическую или Социалистическую партию. Профсоюзы призывают к забастовкам, к саботажу на рабочих местах, или того хуже, к революции. Мы должны действовать быстро, чтобы в течение года не случилась революция"
  u_fra.53.a:0 "Черт возьми"
  u_fra.54.t:0 "Франция запрещает немецкий язык в Эльзас-Лотарингии"
  u_fra.54.d:0 "Наш новый союзник, но старый враг, сегодня совершил дерзкий и скандальный шаг. Он осмелился запретить немецкий язык в спорной провинции Эльзас-Лотарингия. Наши дипломаты уже потребовали отмены закона, но французские дипломатические представители молчат. Волны иммигрантов стекаются в Германию, где их наследие будет защищено и им будет оказана честь"
  u_fra.54.a:0 "Возмутительно"
  u_fra.55.t:0 "В сердце тьмы"
  u_fra.55.d:0 "Для многих в офисе это был просто еще один день. Но не для Лотара. Он должен был забрать документы из кабинета своего начальника. Ничего официального. Веру в режим он потерял давным-давно, но смелости работать на иностранные интересы у него хватило. Он говорил на идеальном французском, что было полезно для его старого работодателя, немецкого Abhwer, и для его нового, французского DGSE. Эта привилегия досталась ему от матери, француженки, вышедшей замуж за немецкого солдата после Великой войны. Он поймал себя на том, что думает о ней и о том, что бы она подумала обо всем этом. Но времени на это не было, документы ждали где-то..."
  u_fra.55.a:0 "Рейх падет"
  u_fra.56.t:0 "Франция передает Тунис"
  u_fra.56.d:0 "На этой неделе Франция неожиданно начала предлагать передать Тунис в наше управление. Хотя они утверждают, что делают это как "дружественный" жест и чтобы уменьшить их тяжелое колониальное бремя, эксперты сходятся во мнении, что Франция пытается заручиться нашей поддержкой в борьбе за влияние с Германией."
  u_fra.56.a:0 "Мы должны действовать осторожно"
  u_fra.57.t:0 "Франция просит поддержки"
  u_fra.57.d:0 "Франция просит нашей поддержки в борьбе за влияние с Германией. Они просят нас поддержать их в их исторических претензиях на Эльзас-Лотарингию. Но наши дипломаты предупреждают о риске войны между двумя сверхдержавами. Поэтому нам следует тщательно обдумать, на чью сторону встать."
  u_fra.57.a:0 "Наши латинские братья могут рассчитывать на нас"
  u_fra.57.b:0 "К сожалению..."
  u_fra.58.t:0 "Франция просит поддержки"
  u_fra.58.d:0 "Франция просит нас поддержать её в борьбе за влияние с Германией. Они просят нас поддержать их в их исторических претензиях на Эльзас-Лотарингию. Но наши дипломаты предупреждают о риске войны между двумя сверхдержавами. Поэтому мы должны тщательно обдумать, какую сторону принять."
  u_fra.58.a:0 "Они могут рассчитывать на нас"
  u_fra.58.b:0 "К сожалению..."
  u_fra.59.t:0 "Франция просит поддержки"
  u_fra.59.d:0 "Франция просит нас поддержать её в борьбе за влияние с Германией. Они просят нас поддержать их в их исторических претензиях на Эльзас-Лотарингию. Но наши дипломаты предупреждают о риске войны между двумя сверхдержавами. Поэтому мы должны тщательно обдумать, какую сторону принять."
  u_fra.59.a:0 "Они могут рассчитывать на нас"
  u_fra.59.b:0 "К сожалению..."
  u_fra.60.t:0 "Франция просит поддержки"
  u_fra.60.d:0 "Франция просит нас поддержать её в борьбе за влияние с Германией. Они просят нас поддержать их в их исторических претензиях на Эльзас-Лотарингию. Но наши дипломаты предупреждают о риске войны между двумя сверхдержавами. Поэтому мы должны тщательно обдумать, какую сторону принять."
  u_fra.60.a:0 "Они могут получить помощь с Марокко"
  u_fra.60.b:0 "Наши латинские братья могут рассчитывать на нас"
  u_fra.60.c:0 "К сожалению..."
  u_fra.70.t:0 "Испания просит компенсации"
  u_fra.70.d:0 "Испания согласна поддержать нас. Но при одном условии. Они требуют передать им Марокко для их колониальной администрации. Мы должны подумать, нужны ли они нам в нашей борьбе с Германией или нет."
  u_fra.70.a:0 "Сделка"
  u_fra.70.b:0 "Без сделок"
  u_fra.71.t:0 "Франция передает Марокко"
  u_fra.71.d:0 "Франция согласилась передать Марокко нашей колониальной администрации."
  u_fra.71.a:0 "Замечательно"
  u_fra.72.t:0 "Франция просит поддержки"
  u_fra.72.d:0 "Франция просит нас поддержать её в борьбе за влияние с Германией. Они просят нас поддержать их исторические права на Эльзас-Лотарингию. Но наши дипломаты предупреждают о риске войны между двумя сверхдержавами. Поэтому нам следует тщательно подумать, на чью сторону встать."
  u_fra.72.a:0 "Они могут рассчитывать на помощь в Индокитае"
  u_fra.72.b:0 "Они получат нашу поддержку"
  u_fra.72.c:0 "К сожалению..."
  u_fra.73.t:0 "Япония просит компенсации"
  u_fra.73.d:0 "Япония согласна поддержать нас. Но при одном условии. Они требуют передать им Индокитай для их колониальной администрации. Мы должны подумать, нужны ли они нам в нашей борьбе с Германией или нет."
  u_fra.73.a:0 "Сделка"
  u_fra.73.b:0 "Без сделок"
  u_fra.74.t:0 "Франция передает Индокитай"
  u_fra.74.d:0 "Франция согласилась передать Индокитай нашей колониальной администрации."
  u_fra.74.a:0 "Замечательно"
  u_fra.75.t:0 "[From.GetNameDefCap] соглашается нас поддержать"
  u_fra.75.d:0 "[From.GetNameDefCap] согласился поддержать нас в нашей борьбе с немецкой гегемонией. Они поддержат наше дело."
  u_fra.75.a:0 "Хорошие новости"
  u_fra.76.t:0 "[From.GetNameDefCap] отказался поддержать нас"
  u_fra.76.d:0 "[From.GetNameDefCap] отказался поддержать нас в нашей борьбе с немецкой гегемонией. Они не поддержат наше дело."
  u_fra.76.a:0 "Ужасные новости"
  u_fra.77.t:0 "Франция отказывается передавать территории"
  u_fra.77.d:0 "Франция отказалась передать свои территории под нашу колониальную администрацию."
  u_fra.77.a:0 "К несчастью"
  u_fra.78.t:0 "Вопрос об Эльзас-Лотарингии"
  u_fra.78.d:0 "В то время как мы были союзниками Франции, они оставались нашими давними врагами. И одним из спорных вопросов является наша претензия на Эльзас-Лотарингию. Все немцы должны быть объединены, и поэтому мы должны потребовать, чтобы Франция передала территорию и стала нашим зависимым государством."
  u_fra.78.a:0 "Потребовать подчинения"
  u_fra.78.b:0 "Сейчас не время"
  u_fra.79.t:0 "Германия требует подчинения"
  u_fra.79.d:0 "Хотя они притворялись нашими союзниками, немцы сговорились против нас. Теперь они требуют немедленной передачи Эльзас-Лотарингии и нашего подчинения в качестве зависимого государства. Что мы должны ответить?"
  u_fra.79.a:0 "У нас нет выбора"
  u_fra.79.b:0 "Смерть, но не позор!"
  u_fra.80.t:0 "Франция отказывается передать Эльзас-Лотарингию"
  u_fra.80.d:0 ""
  u_fra.80.a:0 "Разорвать дипломатические отношения"
  u_fra.80.b:0 "Пусть они оставят это себе"
  u_fra.81.t:0 "Франция передает Эльзас-Лотарингию"
  u_fra.81.d:0 "Похоже, Франция выбрала правильный вариант, передав нам Эльзас-Лотарингию."
  u_fra.81.a:0 "Разумно"
  u_fra.81.b:0 "Этого мало, разорвите отношения"
  u_fra.82.t:0 "Франция просит полного признания Французского Эльзаса-Лотарингии"
  u_fra.82.d:0 "В безрассудном движении Франция просит нас отказаться от наших претензий на их восточные территории. Они этнически и французские, и немецкие, но исторически являются частью Священной Римской империи. Похоже, они привлекли других членов Оси, чтобы поддержать их, поэтому нам следует действовать осторожно."
  u_fra.82.a:0 "У нас нет выбора"
  u_fra.82.b:0 "Пусть придут и заберут это"
  u_fra.83.t:0 "Германия признает Эльзас-Лотарингию французской"
  u_fra.83.d:0 "Похоже, Германия выбрала правильный вариант, отказавшись от своих претензий на Эльзас-Лотарингию."
  u_fra.83.a:0 "Хорошо"
  u_fra.84.t:0 "Германия отказывается признать Эльзас-Лотарингию французской"
  u_fra.84.d:0 "В безрассудном движении Германия решила не отказываться от своих претензий на Эльзас-Лотарингию."
  u_fra.84.a:0 "Разорвите дипломатические отношения"
  u_fra.85.t:0 "Франция и Германия разорвали дипломатические отношения"
  u_fra.85.d:0 ""
  u_fra.85.a:0 "Это не может быть хорошо"
  u_fra.86.t:0 "Франция и Германия в состоянии войны"
  u_fra.86.d:0 ""
  u_fra.86.a:0 "За Францию"
  u_fra.87.t:0 "Франция и Германия разорвали дипломатические отношения"
  u_fra.87.d:0 ""
  u_fra.87.a:0 "Это не может быть хорошо"
  u_fra.88.t:0 "Смена руководства"
  u_fra.88.d:0 "Утром, во время сессии Национальной ассамблеи, несколько депутатов выразили свою озабоченность тем, что Пьер Лаваль возглавляет правительство.\nПосле неудачи пакта Лаваля-Хора многие из его коллег, похоже, больше ему не доверяют. Многие политики, близкие к "Крё-де-Фе", и не только, заявили, что Национальный блок был полезен для того, чтобы не пускать социалистов в правительство, но что пришло время сменить руководство.\nПохоже, они склоняются к тому, чтобы выбрать Франсуа де ла Рока новым премьер-министром."
  u_fra.88.a:0 "Нужны перемены"
  u_fra.88.b:0 "Лаваль остается"
  u_fra.90.t:0 "Альянс землевладельцев и промышленников"
  u_fra.90.d:0 "Как и следовало ожидать, богатые землевладельцы и промышленники объединились, чтобы поддержать нас. Многие из них поддерживают националистические движения. L'Oreal, Lesieur... Это огромный стимул для нашей базы поддержки правительства."
  u_fra.90.a:0 "Отлично"
  u_fra.91.t:0 "Забастовки рабочих"
  u_fra.91.d:0 "В понедельник рабочие начали забастовку как непосредственную реакцию на наше избрание. Большинство из них голосовали за Народный фронт. Кажется, они не понимают необходимости в Движении Нации."
  u_fra.91.a:0 "Досадно"
  u_fra.92.t:0 "Коммунисты усиливают сотрудничество с Народным фронтом"
  u_fra.92.d:0 "В ходе открытого нам противостояния ряды Народного фронта пополнило еще больше коммунистов. Многие из них не спешили делать это до 1936 года и нашего прихода к власти. Однако в нашей победе они узрели триумф Старого порядка и сил капиталистов. Теперь их ежедневно видят в компании с политиками СФИО, и они выступают за Фронт на улицах."
  u_fra.92.a:0 "Любопытно"
  u_fra.93.t:0 "Годовщина ППФ"
  u_fra.93.d:0 "В честь годовщины создания ППФ Жак Дорио организовал на этой неделе грандиозную церемонию. Она прошла на стадионе Сен-Дени, куда Дорио прибыл на самолете. Искушенные наблюдатели заметили, что все это было воссозданием сцены из фильма \"Триумф воли\", которую Адольф Гитлер провел в Нюрнберге."
  u_fra.93.a:0 "Интересно"
  u_fra.94.t:0 "Дорио запускает Фронт свободы"
  u_fra.94.d:0 "В попытке противостоять коммунистам и социалистам и защитить свободы, которые, по их предположениям, у них отобрал Народный фронт, ППФ (Французская народная партия) и ФР (Федерация республиканцев) создали Фронт свободы.\n По их словам, это союз правых сил, который призван защитить от пагубного влияния левых.\n Стоит отметить, что Франсуа де ля Рок и ПСФ (Французская социальная партия) отказались вступить во Фронт. Он заявляет, что союз с теми же богатыми и консервативными силами, что и всегда, помешает достижению его целей."
  u_fra.94.a:0 "Мы это учтем"
  u_fra.95.t:0 "Альянс землевладельцев и промышленников"
  u_fra.95.d:0 "В предсказуемом ходе событий богатые землевладельцы и промышленники объединились, чтобы противостоять нам. Многие из них поддерживают националистическое и террористическое движение \"Кагуль\". L'Oreal, Lesieur... Это удар по нашему государственному суверенитету."
  u_fra.95.a:0 "Беспокояще"
  u_fra.96.t:0 "Радостные забастовки"
  u_fra.96.d:0 "Радостные забастовки - это забастовки, начатые после прихода к власти Народного фронта. Рабочие с радостью праздновали этот новый день надежд, лучших прав и лучших условий жизни. Люди танцевали и радовались на улицах в ходе прекрасного празднования."
  u_fra.96.a:0 "Да здравствует Народный фронт"
  u_fra.97.t:0 "Разногласия коммунистов"
  u_fra.97.d:0 "Сегодня в обстановке секретности в офисе премьер-министра несколько видных коммунистических политиков объявили о своих намерениях отделиться от Народного фронта. Они заявили, что наша политика недостаточно социалистична и слишком снисходительна к фашистам. Это, вероятно, негативно отразится на нашей популярности."
  u_fra.97.a:0 "Тревожно"
  u_fra.98.t:0 "Рост национализма"
  u_fra.98.d:0 "В условиях быстро меняющейся международной ситуации многие во Франции придерживаются более радикальных взглядов. Многие из них решили обратиться к национализму, поскольку такие националистические ораторы, как Дорио, обещали им помочь французам, которых обидел Народный фронт."
  u_fra.98.a:0 "Беспокояще"
  u_fra.99.t:0 "1 мая"
  u_fra.99.d:0 "Первое мая, День труда — это день празднества и борьбы. Борьбы за 40-часовую рабочую неделю, за трудовые договоры, за мир и справедливость. Это 1 мая наступило всего через два месяца после воссоединения профсоюзов CGT и отделившейся от него в 1922 году группы CGTU.\nВо избежание конфликта с союзами или CGTU, профсоюз CGT решил не устраивать никаких шествий, особенно в Париже."
  u_fra.99.a:0 "Счастливого Дня труда"
  u_fra.100.t:0 "Торжества по случаю 6 февраля 1934 г."
  u_fra.100.d:0 "Сегодня отмечается дата кризиса 6 февраля 1934 г., когда члены Лиги и ветераны устроили демонстрацию перед Национальной ассамблеей. Этот мирный протест был жестоко подавлен республиканским правительством, опасавшимся государственного переворота со стороны националистов.\nЭтот кризис стал причиной раскола во французской политической сфере. Правое крыло радикализировалось, а левое решило объединиться, что позже привело к созданию Народного фронта.\nСегодня несколько праворадикальных групп, в том числе Французская акция и Круа-де-Фе, отмечают годовщину этого события и чтут память погибших два года назад людей."
  u_fra.100.a:0 "Точка поворота"
  u_fra.101.t:0 "День взятия Бастилии"
  u_fra.101.d:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.101.a:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.102.t:0 "Французская акция настроена враждебно против Блюма"
  u_fra.102.d:0 "В опубликованной сегодня в газете статье Аксьон Франсез жёстко выступила против Блюма. Они осудили его и Народный фронт, обвинив их в том, что они иностранные агенты, работающие на Сталина и большевиков. Они также нападают на него за то, что он социалист, еврей и буржуа.\n\n AF - не единственные, кто нападает на него, но они одни из его главных противников, и победа Фронта только ухудшила ситуацию..."
  u_fra.102.a:0 "Позорно"
  u_fra.103.t:0 "Создание ФСП"
  u_fra.103.d:0 "После того, как его популярная лига Круа-де-Фе была распущена Народным фронтом, полковник Франсуа де ля Рок создал в этом месяце новую политическую партию. Это продолжение Круа-де-Фе по большинству пунктов. Полковник хочет показать, что он на стороне легитимности и республиканизма. Он отказался называть себя фашистом, заявив, что служит республике.\n\n Его партия уже добилась успеха, а сам он пользуется большой популярностью. Он склоняется к сильной президентской роли, увеличению классового сотрудничества и национализма."
  u_fra.103.a:0 "Интересно"
  u_fra.104.t:0 "Митинг ФСП в Клиши"
  u_fra.104.d:0 "В этом месяце Parti Social Français решили организовать митинг в Клиши. Многие наши социалисты и союзники-коммунисты утверждают, что это всего лишь очередной фашистский митинг, и его следует запретить.\nОднако оппозиция уже обвиняет нас в затыкании рта инакомыслящим. Запрет этого мероприятия только привлечет к ним еще больше людей, тем более что PSF де ля Рока использует карту легальности.\nЧто, черт возьми, нам делать?"
  u_fra.104.a:0 "Дайте им провести собрание"
  u_fra.104.b:0 "Разгоните их"
  u_fra.105.t:0 "Расстрел в Клиши"
  u_fra.105.d:0 "После того, как мы разрешили мероприятие, мэр-социалист Клиши и депутаты-коммунисты призвали к ответному протесту.\nСотни протестующих осадили место проведения митинга, вынудив полицию вызвать подкрепление. После предупреждения полиция открыла огонь по протестующим социалистам и коммунистам. Было убито 6 человек и ранено несколько сотен, многие из которых были полицейскими."
  u_fra.105.a:0 "Ужасный день"
  u_fra.106.t:0 "Теракт La Cagoule"
  u_fra.106.d:0 "Сегодня произошло ужасное событие. Кагуляр - крайне правая террористическая группа - взорвала два здания около Площади Звезды.\n Это были здания Конфедерации французских собственников и Союза металлургической промышленности. Эти одиозные атаки, очевидно, были проведены как атака под чужим флагом, чтобы свалить вину на коммунистов.\n Многие враждебно настроенные богатые землевладельцы и собственники являются членами Кагуляра, сам Пьер Мишлен подозревается в финансировании атаки."
  u_fra.106.a:0 "Мы должны найти виновных"
  u_fra.107.t:0 "Полковник Франсуа де ля Рок"
  u_fra.107.d:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.107.a:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.108.t:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.108.d:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.108.a:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.109.t:0 "Новости из нашей Империи - 1936"
  u_fra.109.d:0 "Наша славная Колониальная Империя, простирающаяся с Востока на Запад, принесла нам новых колониальных солдат. Они прибывают с гор Тазы, из сука Ксар и Мидельта. Гордые Сенегальские стрелки, спаги, егеря и марокканские гумье.\n В остальном за морем не так много происходит. У Экваториальной Африки новый губернатор Дьедонне Рест. Некоторые туземцы, националисты и коммунисты поднимают шум, но наши войска могут с этим справиться.\n В целом ничего нового под нашим Колониальным Солнцем."
  u_fra.109.a:0 "Да здравствует Франция!"
  u_fra.110.t:0 "Новости из нашей Империи - 1937"
  u_fra.110.d:0 "Наша славная колониальная империя, протянувшаяся с Востока на Запад, привезла нам новый удивительный напиток. Леон Бетон, француз, родившийся в Буфарике, коммерциализировал восхитительный напиток под названием \"Оранжина\". "
  u_fra.110.a:0 "Вкусный"
  u_fra.111.t:0 "Новости из нашей Империи - 1938"
  u_fra.111.d:0 "Наша славная колониальная империя, протянувшаяся с Востока на Запад, привезла нам новых колониальных солдат. Они могли родиться вдали от нас, но в их сердцах горит непобедимое пламя. Ведь они хотят пронести флаг Франции как можно дальше. И они умрут за него. \n Кроме того, недавно губернатором Мартиники стал Юбер Дешам. Дьедонне Рест заявил, что его администрация специализируется на экспорте кофе и какао, но урожайность не очень хорошая, едва достигает 55000 тонн."
  u_fra.111.a:0 "Я поднимаю свой бокал за нашу Колониальную Империю"
  u_fra.112.t:0 "Французская Коммунистическая Партия"
  u_fra.112.d:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.112.a:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.113.t:0 "Коммунистический съезд молодёжи 1937 года"
  u_fra.113.d:0 "В этом месяце Французская коммунистическая партия провела молодежный слет на севере Франции, в городе Фалемпен. Это мероприятие проводится ежегодно, но в этом году оно прошло с большим успехом. У молодых коммунистов была возможность заниматься спортом, включая велоспорт. Все участники мероприятия были довольны и это был повод для тысяч коммунистов встретиться, пообщаться и почтить память великих коммунистических деятелей, таких как Маркс и Ленин. На церемонии закрытия тысячи голосов исполняли "Интернационал", сам Морис Торез казался очень гордым."
  u_fra.113.a:0 "Пролетарии всех стран, соединяйтесь!"
  u_fra.114.t:0 "Даладье обращается к Французской Республике"
  u_fra.114.d:0 "Сегодня в широко освещенной речи Эдуар Даладье, представитель социал-либералов в Народном фронте, обратился к нации по радио. Он говорил об опасностях фашизма и немецкого нацизма. Он призвал французский народ быть сильным и отвергать демагогов. Он призвал к единству между средним классом и рабочим классом, а в более широком масштабе к единству во Франции."
  u_fra.114.a:0 "Интересно"
  u_fra.115.t:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.115.d:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.115.a:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.116.t:0 "Французская народная партия"
  u_fra.116.d:0 "Жак Дорио, мэр Сен-Дени и ярый коммунист до 1934 года, в этом месяце создал Parti Populaire Français.\nЭтот альянс недовольных коммунистов, революционеров и националистов напоминает о создании немецкой НСДАП или итальянской НФП.\nБольшинство их идей являются экстремальными, антидемократическими и революционными. Но у них уже есть сильная база поддержки."
  u_fra.116.a:0 "Беспокойство"
  u_fra.117.t:0 "Победа Народного фронта"
  u_fra.117.d:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.117.a:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.118.t:0 "Жемчужина империи"
  u_fra.118.d:0 "Жемчужина нашей империи, Индокитай, является родиной многих ресурсов и коренных народов. К сожалению, он претерпел экономический крах в 1920-х годах и с тех пор не восстановился. Колония зависит от материковой Франции во многих отношениях, и метрополии приходится покрывать многие расходы.\nК тому же некоторые туземцы начинают выражать идеи независимости и коммунизма. Нгуен Ай Куок, также известный как Хо Ши Мин, пользуется поддержкой СССР, но способен ли он вызвать проблемы? Кто знает..."
  u_fra.118.a:0 "Беспокоит"
  u_fra.119.t:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.119.d:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.119.a:0 "НЕ ИСПОЛЬЗОВАТЬ"
  u_fra.120.t:0 "Радикалы и социалисты"
  u_fra.120.d:0 "В коалициях типа \"Народного фронта\" может возникать множество противоречий. У радикалов, или социал-либералов, взгляды отличаются от взглядов социалистов. Они представляют средний класс, в то время как социалисты представляют рабочий класс. Многие радикалы сдвигаются вправо по политическому спектру, в то время как некоторые социалисты, недовольные недостаточностью реформ, ищут альтернативы у коммунистов Тореза или у партии «Французская народная партия» Дорио."
  u_fra.120.a:0 "К сожалению"
  u_fra.121.t:0 "Лиги"
  u_fra.121.d:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.121.a:0 "НЕ ИСПОЛЬЗУЕТСЯ"
  u_fra.122.t:0 "Парад победы под Бранденбургскими воротами"
  u_fra.122.d:0 "В свете нашей недавней победы французские войска прошли парадным маршем под самым известным символом Германии — Бранденбургскими воротами. О наших колониальных войсках — спаги и фузилерах — император особо упомянул в своей речи. Он объявил о присоединении Рейнской области и заявил, что с распадом Германии в Европе снова воцарился мир."
  u_fra.122.a:0 "Да здравствует наш император! Да здравствует мир!"
  u_fra.123.t:0 "Победа наша"
  u_fra.123.d:0 "С подчинением основных европейских стран наш император Наполеон Великий объявил, что отныне нам никто не сможет противостоять. Теперь Франция сосредоточится на строительстве нового Европейского Союза с центром в Париже. Теперь нас не остановить!"
  u_fra.123.a:0 "Да здравствует империя!"
  u_fra.124.t:0 "Встреча двух императоров"
  u_fra.124.d:0 "После контролирования аннексии нами Нидерландов наш император отправился навестить изгнанного кайзера Вильгельма Второго. Кайзер, конечно же, из династии, которая уничтожила Вторую Французскую Империю после Франко-прусской войны. Неизвестно, о чём именно они говорили во время встречи, но известно, что наш император сильно негодует из-за Гогенцоллернов."
  u_fra.125.t:0 "Новый царь"
  u_fra.125.d:0 "Во время тайной церемонии наш император Наполеон VI принял представителей нескольких стран, когда-то бывших частью СССР. Они просили дать их народу свободу, а также предлагали свои силы Французскому Императору, присваивая ему высокий титул Царя."
  u_fra.125.a:0 "Мы освободим вас от влияния Советов"
  u_fra.142.t:0 "Сделка с Ираком"
  u_fra.142.d:0 "Ни для кого не секрет, что у Франции практически нет нефтяных запасов. Несмотря на все усилия, нам нужно найти стабильный источник нефти для обеспечения современной войны. К счастью, Ирак находится по соседству с нашим Сирийским протекторатом и богат нефтью. Возможно, мы сможем их убедить или вторгнуться?"
  u_fra.142.a:0 "Давайте купим их нефть с помощью инвестиций и союза"
  u_fra.142.b:0 "Вторжение будет более быстрым и надёжным"
  u_fra.143.t:0 "Франция просит нашу нефть"
  u_fra.143.d:0 "Французский император направил дипломатическую миссию, чтобы купить нашу нефть. В обмен на право добывать нефть они предлагают альянс и крупные инвестиции в нашу экономику. Что мы должны сделать?"
  u_fra.143.a:0 "Принять"
  u_fra.143.b:0 "Отклонить"
  u_fra.144.t:0 "Ирак соглашается"
  u_fra.144.d:0 "Ирак принял наше предложение, и уступил свои права на нефть нам!"
  u_fra.144.a:0 "Замечательно"
  u_fra.145.t:0 "Ирак отказывается"
  u_fra.145.d:0 "Ирак отклонил наше предложение и бросил вызов нашей власти!"
  u_fra.145.a:0 "К сожалению"
  u_fra.145.b:0 "Это не может остаться безнаказанным"
  u_fra.146.t:0 "Франция приглашает нас принять участие в исследовании ядерного оружия"
  u_fra.146.d:0 "Франция желает получить ядерное оружие и призвала всех своих союзников принять участие в этом проекте"
  u_fra.146.a:0 "Если этот проект удастся, у нас тоже будет это фантастическое оружие!"
  u_fra.146.b:0 "Это все пустая трата времени, нам не нужна эта гипотетическая бомба"
  u_fra.147.t:0 "Военные учения"
  u_fra.147.d:0 "С 1935 года наша страна не проводила масштабных военных учений. Наши войска и генералы остро нуждаются в обучении, но какими будут учебные темы в этом году?"
  u_fra.147.a:0 "Сначала мы должны обучить наши бронетанковые войска"
  u_fra.147.b:0 "Нам нужно улучшить нашу боевую тактику"
  u_fra.147.c:0 "Нам нужно лучше обучить наши войска"
  u_fra.147.e:0 "Мы должны обеспечить эффективность наших линий обороны"
  u_fra.148.t:0 "Роспуск палаты депутатов"
  u_fra.148.d:0 "Этого не происходило со времен правления Мак-Магона, но по согласию Сената, сегодня утром Палата Депутатов будет распущена, и через 3 месяца состоятся новые выборы. Несмотря на протесты парламентского большинства, значительная часть населения с радостью принимает этот роспуск после разочарования от результатов последних выборов."
  u_fra.148.a:0 "И снова здравствуйте!"
  u_fra.149.t:0 "Франция желает купить нашу тяжелую воду"
  u_fra.149.d:0 "Франция желает купить весь наш запас тяжелой воды, чтобы провести исследования в области ядерного деления. Но немцы тоже хотят купить нашу тяжелую воду. Кому мы должны ее продать?"
  u_fra.149.a:0 "Французская республика извлечет из этого наибольшую пользу"
  u_fra.149.b:0 "Может быть, отдав ее немцам, они будут уважать наш суверенитет?"
  u_fra.149.c:0 "В коем случае наши запасы не должны попасть в руки немцев!"
  u_fra.150.t:0 "Норвегия соглашается продать тяжелую воду"
  u_fra.150.d:0 "Норвежцы доверились нам и аннулировали соглашение с немцами, чтобы продать тяжелую воду только нам."
  u_fra.150.a:0 "Эта немецкая история не обнадеживает..."
  u_fra.151.t:0 "Немцы побеждают в продаже"
  u_fra.151.d:0 "Норвежцы отклонили наше предложение о покупке, заявив, что немцы, которые тоже хотели купить тяжелую воду, были более убедительны."
  u_fra.151.a:0 "У нас нет выбора, мы должны сами обезопасить тяжелую воду!"
  u_fra.152.t:0 "Норвегия продает нам свою тяжелую воду"
  u_fra.152.d:0 "Норвежцы продают нам свою тяжёлую воду, важный элемент для создания атомного оружия. Они также рассказали нам, что Франция пыталась купить весь запас тяжёлой воды, но всё же отдала нам предпочтение"
  u_fra.152.a:0 "Нам следует присматривать за этими французами..."
  u_fra.153.t:0 "Норвегия предлагает нам свою тяжёлую воду"
  u_fra.153.d:0 "Беспокоясь по поводу резкого спроса нашей страны и Германии на свои запасы тяжёлой воды, Норвегия опасается, что может сделать Германия с атомной бомбой. В целях безопасности она предлагает нам весь свой запас тяжёлой воды и просит нас забрать его незаметно"
  u_fra.153.a:0 "Мы приложим максимум усилий"
  u_fra.154.t:0 "Кража тяжёлой воды"
  u_fra.154.d:0 "Вечером неизвестные проникли на гидроэлектростанцию Верморк и украли весь имевшийся там запас тяжёлой воды. Полиция всё ещё ищет виновных, но без этой воды мы больше не можем снабжать Германию"
  u_fra.154.a:0 "Будем надеяться, что это не сильно отразится на наших отношениях с немцами"
  u_fra.155.t:0 "Кража тяжёлой воды"
  u_fra.155.d:0 "Вечером неизвестные проникли на гидроэлектростанцию Верморк в Норвегии и украли весь имевшийся там запас тяжёлой воды. Норвежская полиция всё ещё ищет виновных, но факты налицо: вся тяжёлая вода пропала"
  u_fra.155.a:0 "Это замедлит наш прогресс в разработке ядерных технологий"
  u_fra.156.t:0 "Антуан де Сент-Экзюпери чудом выжил в ливийской пустыне"
  u_fra.156.d:0 "Вылетевший 29 декабря прошлого года, чтобы побить рекорд скорости перелета из Парижа в Сайгон, Антуан де Сент-Экзюпери и его механик Андре Прево после остановки на дозаправку 30-го числа больше не выходили на связь. Многие беспокоились о судьбе экипажа, но, к счастью, с ними все в порядке. Антуан позвонил из Каира и подтвердил, что они потерпели крушение в египетской Ливийской пустыне. Они провели 3 дня в Сахаре, имея при себе лишь пол-литра кофе, четверть литра белого вина, немного винограда и апельсин. Экипаж, едва оправившись, уже отправился осмотреть место крушения своего самолета."
  u_fra.156.a:0 "Наши летчики, несомненно, непобедимы"
  u_fra.157.t:0 "Антуан де Сент-Экзюпери пропал без вести в Египте"
  u_fra.157.d:0 "Вылетевший 29 декабря прошлого года, чтобы побить рекорд скорости перелета из Парижа в Сайгон, Антуан де Сент-Экзюпери и его механик Андре Прево после остановки на дозаправку 30-го числа больше не выходили на связь. Многие обеспокоены судьбой экипажа, а тем временем начались поиски обломков самолета. Учитывая условия в регионе, шансы на выживание экипажа кажутся невысокими..."
  u_fra.157.a:0 "Сначала Фарабод и Кляйн, теперь Антуан и Андре..."
  u_fra.158.t:0 "Авария самолета Жана Мермоза в море"
  u_fra.158.d:0 "7 декабря самолет Mermoz Lacotère-300 Croix du Sud потерпел крушение. Вылетая из Дакара в Натал, отказал правый двигатель, заставив экипаж резко приводниться в бурном море. Самолет сильно поврежден, но экипажу все же удалось передать свои координаты спасателям. На следующий день экипаж был спасен судном F 2200 \"Ville de Montevideo\". Это выживание в опасной среде укрепило авторитет летчика Mermoz среди его товарищей по Французской социалистической партии, которые теперь считают его непобедимым."
  u_fra.158.b:0 "7 декабря самолет Mermoz Lacotère-300 Croix du Sud потерпел крушение. Вылетая из Дакара в Натал, отказал правый двигатель, заставив экипаж резко приводниться в бурном море. Самолет сильно поврежден, но экипажу все же удалось передать свои координаты спасателям. На следующий день экипаж был спасен судном F 2200 \"Ville de Montevideo\". Это выживание в опасной среде укрепило авторитет летчика Mermoz среди его товарищей по партии Croix de Feu, которые теперь считают его непобедимым."
  u_fra.158.a:0 "Катастрофа, которой удалось избежать..."
  u_fra.159.t:0 "Исчезновение Jean Mermoz в море"
  u_fra.159.d:0 "7 декабря Мермоз, Алекcандр Пишоду, Анри Эзан, Эдгар Крувейлер и Жан Лавидали поднялись на борт Lacotère-300 'Croix du Sud' и вылетели из Дакара в Натал, после того как отменили предыдущий полет из-за проблемы с редуктором правого двигателя. Но в 10:43 утра, самолет отправил на азбуке Морзе 'Выключение правого заднего двигателя' и перестал выходить на связь. В этом районе были развернуты масштабные поиски, в частности, Анри Гийоме, его друг, который видел, как они улетели в Драккар, но до сих пор не было найдено ни одной части самолета. Многие уже считают, что экипаж погиб, и хотели бы, чтобы их увековечили."
  u_fra.159.a:0 "Сегодня Франция потеряла великого человека"
  u_fra.161.t:0 "Франция побеждает в гонке Истр-Дамаск-Париж"
  u_fra.161.d:0 "В честь 10-й годовщины перелета Чарльза Линдберга через Атлантику Французский авиаклуб проводит гонку на лучшую дальность от Истра до Парижа с заездом в Дамаск. Из 13 участвующих самолетов 4 самолета французского производства, и только 9 самолетов финишировали. Вылетев из Ле Бурже вечером 20 августа, наши самолеты быстро вырвались в лидеры гонки благодаря нашим последним технологическим достижениям в области авиации. Самолет Анри Гийоме не совершил даже посадку в Дамаске, став единственным самолетом, который смог долететь до цели без дозаправки. В итоге пьедестал почета заняли три француза, а первыми к финишу пришли Поль Кодос и Морис Аму в своем «Фульгуре». Следует отметить, что четвертое, пятое и шестое места также заняли итальянцы..."
  u_fra.161.a:0 "Ошеломляющая победа!"
  u_fra.162.t:0 "Результаты гонки Истр-Дамаск-Париж"
  u_fra.162.d:0 "Чтобы отпраздновать 10-летие пересечения Чарльзом Линдбергом Атлантики, французский авиаклуб организовал соревнование, чтобы соединить Истр и Париж, сделав крюк через Дамаск. Из 9 участвующих самолетов 4 были французского происхождения, и только 9 завершили гонку. Наши самолеты, покинув Ле-Бурже вечером 20 августа, поднялись в воздух, а британские и итальянские самолеты последовали за ними в 21:00 и 22:00. В частности, среди итальянских участников - сын Дуче, Бруно Муссолини. Пока самолеты заправляются в Дамаске, Анри Гийяме на своем четырехмоторном самолете F2231 «F-2» продолжает путь без этой посадки, так как его самолет обладает достаточной автономностью для бесперебойного полета. Но по возвращении он попадет в сильный шторм, что замедлит его и истощит топливо, вынудив заправиться в Белграде и финишировать на 9 месте. На пьедестале в итоге оказываются 3 итальянских экипажа, причем Раниери Купини и Амадео Парадизи на своем «S-79» финишируют первыми после 17 часов и 32 минут полета. Наш лучший пилот - Кодос, который финиширует 5-м."
  u_fra.162.a:0 "Нам необходимо совершенствовать дальнюю авиацию..."
  u_fra.163.t:0 "Смертельная авария на гонке Истр-Дамас-Париж"
  u_fra.163.d:0 "Французский авиаклуб запустил соревнования, чтобы отметить 10-ю годовщину перелёта Чарльза Линдберга через Атлантику, полет на котором соединил Истр и Париж через Дамаск. Из 9 самолётов, участвовавших в соревнованиях, 4 были французского происхождения, финишировало только 8. Стартовав вечером 20 августа с Ле-Бурже, наши самолёты отправились в полёт за британскими и итальянскими самолётами, которые стартовали в 21:00 и 22:00. Стоит отметить, что среди итальянских участников был сын дуче Бруно Муссолини. Пока самолёты заправлялись в Дамаске, Анри Гийме на четырёхмоторном самолёте F2231 «F-2» продолжил путь без посадки, поскольку его самолёт имел достаточную автономность, чтобы лететь без остановок. Однако когда он должен был возвращаться над полуостровом Истр, самолёт попал в сильный шторм, и он попытался пройти сквозь него, вместо того, чтобы обойти. Это решение, судя по всему, стало фатальным, так как вскоре после этого с самолёта поступил сигнал SOS. На следующий день обломки самолёта были обнаружены; судя по всему, он попытался приземлиться в лесу, вероятно, из-за плохой видимости. Все находившиеся на борту погибли. Пьедестал заняли 3 итальянских экипажа."
  u_fra.163.a:0 "Катастрофа"
  u_fra.165.t:0 "Подготовка к Национальному Дню"
  u_fra.165.d:0 "Каждый год на Елисейских Полях в Париже организуются военные парады, призванные объединить народ и продемонстрировать военную мощь. Однако для организации подобного парада требуются средства."
  u_fra.165.a:0 "Учитывая сложившуюся обстановку, мы не можем позволить себе парад"
  u_fra.165.b:0 "Давайте устроим небольшой парад"
  u_fra.165.c:0 "Давайте устроим грандиозный парад!"
  u_fra.165.e:0 "Только потому, что Париж оккупирован врагом, мы не откажемся от нашего праздника!"
  u_fra.166.t:0 "Национальный праздник"
  u_fra.166.d:0 "Трехцветные знамена развеваются на ветру, улицы убраны, и граждане со всей страны собрались на парад. Главы правительств произнесли речи, и первые войска начали движение под звуки Марсельезы. Наконец появляются звёзды этого парада, ..."
  u_fra.166.a:0 "Новые самолёты ВВС"
  u_fra.166.b:0 "Войска Морской пехоты"
  u_fra.166.c:0 "Гордые солдаты Сухопутных войск"
  u_fra.166.e:0 "Рабочие наших оружейных заводов"
  u_fra.166.f:0 "Колонны наших лучших танков"
  u_fra.166.g:0 "Солдаты линии Мажино"
  u_fra.166.h:0 "Иностранный легион"
  u_fra.166.i:0 "Специализированные инженерные, снабженческие и военно-полевые медицинские войска"
  u_fra.166.j:0 "Войска наших союзников"
  u_fra.170.t:0 "Изменить дату национального праздника"
  u_fra.170.d:0 "Теперь, когда монархия восстановлена, неприемлемо сохранять 14 июля в качестве национального праздника, символа кровожадной и нестабильной республики."
  u_fra.170.a:0 "Возьмём 23 июня, праздник нашего короля Жана III"
  u_fra.170.b:0 "Возьмём 1 августа, праздник нашего короля Альфонса XII"
  u_fra.170.c:0 "Возьмем 8 мая — день освобождения Орлеана от англичан Жанной д'Арк"
  u_fra.170.e:0 "Возьмем 25 декабря — день коронации Карла Великого, Императора Франков"
  u_fra.170.f:0 "Возьмем 27 июля — победа, укрепившая Францию и показавшая важность королей Капетингов"
  u_fra.171.d:0 "Теперь, когда покончено с Республикой, нужно избавиться от символов, например от Национального Дня — символа восстания народа против угнетателей..."
  u_fra.171.a:0 "Возьмем 6 февраля — кровавый день, позволивший обрести единство"
  u_fra.171.b:0 "В память о наших братьях, погибших на войне, сделаем национальным праздником 11 ноября"
  u_fra.172.d:0 "Из-за того, что мы перешли на коммунистический строй, многие хотят заменить Национальный День и 14 июля другими датами"
  u_fra.172.a:0 "Возьмем 1 мая — Международный день труда"
  u_fra.172.b:0 "В память о наших предках, погибших в Парижской коммуне, сделаем 28 мая выходным"
  u_fra.172.c:0 "Французская революция не враг нам, можно оставить 14 июля"
  u_fra.173.d:0 "Теперь, когда Третья Империя восстановлена, необходимо сделать некоторые изменения, в том числе и в дате Национального Дня. Разве мы можем праздновать день, который привел к свержению монархии и созданию Республики?"
  u_fra.173.a:0 "Возьмем 15 августа — день восхождения Наполеона и его день рождения"
  u_fra.173.b:0 "Однако именно 14 июля и Республика позволили Наполеону прийти к власти"
  u_fra.174.t:0 "Смерть Альфонсо Первого"
  u_fra.174.d:0 "Сегодня утром король Испании, Франции и Наварры скончался от стенокардии. Был объявлен трехдневный траур на время транспортировки останков короля в испанский Эскуриал для захоронения. Теперь встает вопрос о наследнике трона. По закону это должен быть второй сын Альфонса, принц Жак Анри де Бурбон, однако некоторые сомневаются в его способности к правлению, так как он глухонемой с 1912 года. Многие считают, что лучшим лидером будет его младший брат, принц Хуан де Бурбон..."
  u_fra.174.a:0 "Да здравствует король Жак II!"
  u_fra.174.b:0 "Да здравствует король Хуан I !"
  u_fra.175.t:0 "Смерть Жана Третьего"
  u_fra.175.d:0 "Сегодня утром король Франции Жан III ушел из жизни в возрасте 65 лет. Был объявлен трехдневный траур на время транспортировки останков короля в королевскую часовню в Дрё, усыпальницу семьи Орлеанских. Наследником трона является единственный сын Жана III, Анри Роберт Фердинанд Мари."
  u_fra.175.a:0 "Король мертв, да здравствует король!"
  u_fra.177.t:0 "Сворачивание Транссахарского проекта"
  u_fra.177.d:0 "После двух лет строительства проект по соединению колоний Французской Африки через Сахару, кажется, зашел в тупик. Проект осложнили трудность местности и огромные расходы, а некоторые подозревают и коррупцию."
  u_fra.177.a:0 "Горький провал"
  u_fra.185.t:0 "Франция хочет нас подчинить"
  u_fra.185.d:0 "Пресловутый император Франции [FRA.GetLeader] перебросил эти войска к нашим границам. Он требует немедленного контроля над Юрой и хочет превратить нашу страну в марионеточную республику своей тирании..."
  u_fra.185.a:0 "У нас нет сил, чтобы этому противостоять..."
  u_fra.185.b:0 "Пусть придут и заберут Юру сами!"
  u_fra.186.t:0 "Швейцария принимает наши требования"
  u_fra.186.d:0 "[SWI.GetLeader] из новой [SWI.GetName] сегодня утром принял наши условия! Сегодня Франция ликует, так как она, наконец, воссоединилась со своими заблудшими детьми 1815 года!"
  u_fra.186.a:0 "Слава [SWI.GetName]"
  u_fra.187.t:0 "Швейцария отвергает наши условия"
  u_fra.187.d:0 "Несмотря на нашу демонстрацию силы на границе, [SWI.GetLeader] не отвечает на наши предложения и начал мобилизацию своих войск"
  u_fra.187.a:0 "Чего надеются добиться эти глупцы? У них даже нет флота!"
  u_fra.188.t:0 "Франция и Италия угрожают нам"
  u_fra.188.d:0 "Франция и Италия хотят завоевать и разделить нашу территорию между собой. Они оставили нам ультиматум и угрожают вторгнуться"
  u_fra.188.b:0 "Смерть, но не подчинение!"
  u_fra.189.t:0 "Франция и Германия угрожают нам"
  u_fra.189.d:0 "Франция и Германия хотят завоевать и разделить нашу территорию между собой. Они оставили нам ультиматум и угрожают вторгнуться"
  u_fra.189.b:0 "Смерть, но не подчинение!"
  u_fra.190.t:0 "Массовый исход в [28.GetName]"
  u_fra.190.d2:0 "Немецкая армия захватила регион совершенно неожиданно и стремительно. [ROOT.GetAdjective] власти не считали, что немцы смогут прорвать там оборону, и большая часть населения не успела эвакуироваться. Поэтому сейчас на дорогах творится настоящий хаос, вызванный огромными пробками. Сообщается, что этим воспользовались немецкие штурмовики, которые обстреливают и бомбят беженцев."
  u_fra.190.d:0 "Несмотря на предпринятые меры по эвакуации крупных городов, сельское население было застигнуто врасплох прибытием немецкой армии в штат. Сегодня они массово бегут, забрав с собой всё, что смогли поместить на телегу. Несмотря на некоторые пробки, движение в регионе лишь незначительно затруднено."
  u_fra.190.a:0 "Если бы мы только могли это предвидеть..."
  u_fra.190.b:0 "К счастью, мы уже эвакуировали часть населения"
  u_fra.191.t:0 "Массовый исход из [17.GetName]]"
  u_fra.192.t:0 "Массовый исход из [785.GetName]"
  u_fra.193.t:0 "Массовый исход из [27.GetName]"
  u_fra.194.t:0 "Массовый исход из [18.GetName]"
  u_fra.195.t:0 "Массовый исход из [16.GetName]"
  u_fra.196.t:0 "Массовый исход из [29.GetName]"
  u_fra.197.t:0 "Массовый исход из [15.GetName]"
  u_fra.198.t:0 "Массовый исход из [24.GetName]"
  u_fra.199.t:0 "Массовый исход из [20.GetName]"
  u_fra.200.t:0 "Массовый исход из [34.GetName]"
  u_fra.201.t:0 "Массовый исход из [6.GetName]"
  u_fra.203.t:0 "Убийство Франсуа Дарлана"
  u_fra.203.d:0 "Сегодня днем произошла трагедия. Франсуа Дарлан был убит алжирцем Фернандом Боннье де Ла Шапелем в Летнем дворце. Преступник утверждает, что совершил преступление из-за отношения адмирала и бывшего министра Виши. Поддержание Дарланом антисемитских законов и репрессии в Виши вызвали его непопулярность среди коренного населения. В настоящее время убийца находится в тюрьме, а Высшая комиссия Франции в Африке вскоре соберется для избрания нового комиссара."
  u_fra.203.a:0 "Адмирал, во флот!"
  u_fra.204.t:0 "Установление Союзного военного правительства на оккупированных территориях Франции"
  u_fra.204.d:0 "Боясь увидеть появление недемократических правительств в освобожденной Франции, союзники создали ''AMGOT'', временное правительство под надзором союзников. Союзники не приняли во внимание наше мнение и больше не признают нас законными..."
  u_fra.204.a:0 "Итак, это начало второй оккупации..."
  u_fra.2000.t:0 "[From.GetNameDefCap] требует объединения Латинской Антанты"
  u_fra.2000.d:0 "[From.GetNameDefCap] заявил, что весь Латинский союз должен быть объединен в одну страну, чтобы мы могли противостоять врагу. Первым шагом к этому является принятие требований [From.GetNameDefCap]. Что нам делать?"
  u_fra.2000.a:0 "Хорошая идея"
  u_fra.2000.b:0 "Это неприемлемо"
  u_fra.2001.t:0 "[From.GetNameDefCap] Accepted Our Offer"
  u_fra.2001.d:0 "With the [From.GetNameDefCap] acceptance, we will be stronger against our enemy!"
  u_fra.2001.a:0 "Very good"
  u_fra.2002.t:0 "[From.GetNameDefCap] Rejected Our Demand"
  u_fra.2002.d:0 "[From.GetNameDefCap] said that our proposal was absurd and that by continuing to be allies we would be able to stand strong against the enemy. Therefore, they left the meeting saying that they were looking for something fishy under this proposal and that we were probably trying to expand France's territory and regain our former power."
  u_fra.2002.a:0 "There's nothing to do"
  u_fra.2002.b:0 "Kick them out of the alliance"
  qof.1.t:0 "Jean III assassinated !"
  qof.1.d:0 "During the proclamation of the kingdom of France which took place at the Tuileries Palace, a young man sent a bomb on the balcony of His Majesty who died in the explosion. Authorities later discovered that the man was a Republican extremist, his torture is ongoing. It is a period of mourning that France must now face ..."
  FRA_qof.1.1.a:0 "How it was even possible..."
  qof.2.t:0 "Henri VI the new king of France !"
  qof.2.d:0 "Несмотря на трагическое событие, сын Жана III, Генрих VI, подтвердил свое желание преуспеть как отец. Франция больше не сирота и в ликовании приветствует своего нового короля. Тем не менее, смерть короля вызвала у нашего народа глубокое недоверие к будущему. Восшествие Генриха VI должно быть отмечено сильным актом."
  FRA_qof.2.1.a:0 "Король умер, да здравствует король!"
  qof.3.t:0 "Король и его два сына погибли в железнодорожной катастрофе!"
  qof.3.d:0 "Это невообразимо... Во время своего путешествия по Франции Генрих VI и его два сына попали в железнодорожную катастрофу и погибли. Чудесным образом королева спасена от этой катастрофы. У королевства больше нет прямых наследников, это хаос, без поддержки даже правительство не в состоянии справиться с кризисом..."
  FRA_qof.3.1.a:0 "Мы прокляты..."
  1_FRA_tt: "§RВероятность гражданской войны растет...§!"
  2_FRA_tt: "§GЧасть населения встала на нашу позицию!§!"
  3_FRA_tt: "§RНас исключат из Лиги Наций и предпримут против нас действия... но, возможно, они в последний момент отступят.§!"
  qof.4.t:0 "Будущее"
  qof.4.d:0 "Погибли два короля и два наследника. У нас осталась только одна королева, может быть, она выход? С другой стороны, все эти события, несомненно, являются знаками. Возможно, династия Орлеанов была не лучшей идеей, или даже просто восстановление монархии..."
  FRA_qof.4.1.a:0 "Выбрать Изабеллу, королеву Франции"
  FRA_qof.4.1.b:0 "Вернемся к Республике, монархия упустила свой шанс."
  FRA_qof.4.1.c:0 "Давайте попробуем испанскую ветвь Бурбонов"
  FRA_qof.4.1.d:0 "Династия Бонапартов?"
  qof.5.t:0 "Новые законы о престолонаследии"
  qof.5.d:0 "Этого следовало ожидать, но высшие слои не оценили того, что мы меняем законы о престолонаследии. Это поддержка, которую мы теряем..."
  FRA_qof.5.1.a:0 "Мы потеряли поддержку высших слоев"
  qof.6.t:0 "Договор о Страсбурге"
  qof.6.d:0 "Нам нужно выиграть время, несмотря ни на что, Франция находится на пороге гражданской войны, и мы не можем позволить себе вступать в конфликт. Мы собираемся потерять народную поддержку, но мы нацелены на долгосрочную перспективу."
  FRA_qof.6.1.a:0 "Это не прощание!"
  qof.7.t:0 "Договор о Турине"
  qof.7.d:0 "Нам нужно выиграть время, несмотря ни на что, Франция находится на пороге гражданской войны, и мы не можем позволить себе вступать в конфликт. Мы собираемся потерять народную поддержку, но мы нацелены на долгосрочную перспективу."
  FRA_qof.7.1.a:0 "Прощай, Тунис"
  qof.8.t:0 "Итог: "
  qof.8.d:0 "Это был полный провал. Несмотря на предложение коалиции, все партии бросили нас. Мы одни перед лицом этого кризиса."
  FRA_qof.8.1.a:0 "Полный провал..."
  qof.9.t:0 "Итог: "
  qof.9.d:0 "Успех! Благодаря этой пропагандистской кампании мы получили поддержку части населения. По крайней мере, мы можем рассчитывать на кого-то."
  FRA_qof.9.1.a:0 "Успех!"
  qof.10.t:0 "Гражданская война!"
  qof.10.d:0 "Сегодня утром члены Радикальной партии покинули верхнюю палату. Три часа спустя власти сообщили нам о том, что в Париже началась стрельба. Если нападавшим в столице удалось установить контроль, в последних сообщениях говорится о республиканском восстании на западе страны. Нам необходимо быстро мобилизовать резервы."
  FRA_qof.10.1.a:0 "Да погибну я, если отступлю!"
  qof.11.t:0 "Конец гражданской войны"
  qof.11.d:0 "Мы избавились от этих республиканских предателей. Но война была жестокой и трудной для нашего королевства, наша экономика была напряжена и теперь должна восстановить свою полную мощь."
  FRA_qof.11.1.a:0 "Наконец-то"
  qof.12.t:0 "Международная конференция"
  qof.12.d:0 "Похоже, наш министр иностранных дел обладает безупречным красноречием. Они были полностью обмануты. Теперь мы можем утвердить свое присутствие в регионе без каких-либо проблем."
  FRA_qof.12.1.a:0 "Отлично!"
  qof.13.t:0 "Мандат на вмешательство"
  qof.13.d:0 "Лига Наций только что предоставила нам мандат на вмешательство в Бразилии для борьбы на стороне законного правительства. Мы могли бы уважать условия мандата или... использовать его для поддержки нашего марионеточного правительства. Но если мы это сделаем, нам придется взять на себя ответственность за последствия."
  FRA_qof.13.1.a:0 "Соблюдать условия мандата"
  FRA_qof.13.1.b:0 "Использовать его для наших интересов"
  qof.14.t:0 "Какое будущее у Бразилии?"
  qof.14.d:0 "Now that we have full control of the Brazilian territories, several choices lie ahead. A simple integration is possible, or since Isabelle is an Orléans-Braganza, we could proclaim a double monarchy. "
  FRA_qof.14.1.a:0 "Stick to simple integration "
  FRA_qof.14.1.b:0 "Proclaim the double monarchy !"
  qof.15.t:0 "French ultimatum"
  qof.151.t:0 "Germany submits to our demands !"
  qof.151.d:0 "This morning, the German delegation has just informed us that they accepts our terms in order to avoid war. Alsace-Lorraine is French again! "
  FRA_qof.151.1.a:0 "Great !"
  qof.152.t:0 "Germany refused "
  qof.152.d:0 "Since the ultimatum was sent we have not heard from the German delegation. So it would appear that they are refusing our terms. Either we retreat in humiliation or we declare war on Germany. "
  FRA_qof.152.1.a:0 "Alsace-Lorraine is ours "
  FRA_qof.152.1.b:0 "Maybe we should pullback... "
  qof.16.t:0 "French ultimatum"
  qof.161.t:0 "Belgium and Luxembourg submits to our demands !"
  qof.161.d:0 "Faced with our power, Belgium and Luxembourg submitted to be annexed and to be incorporated into our sphere of influence. With the solid Belgian industry, the future of our kingdom can only be brighter. "
  FRA_qof.161.1.a:0 "Nous sommes de retour !"
  qof.162.t:0 "They refused ! "
  qof.162.d:0 "Это не было запланировано, но ввиду молчания правительств Бельгии и Люксембурга, похоже, они отвергают наши условия. Как жаль, что они так упорны... Арденны были таким красивым лесом..."
  FRA_qof.162.1.a:0 "Вперёд!"
  FRA_qof.162.1.b:0 "Наша армия не готова..."
  qof.17.t:0 "Французский ультиматум"
  qof.172.t:0 "Италия отказалась"
  qof.172.d:0 "С момента отправки ультиматума мы не получили никаких новостей от итальянской делегации. Таким образом, кажется, что они отклоняют наши условия. Либо мы отступаем в унижении, либо объявляем войну Италии."
  FRA_qof.172.1.a:0 "Что ж, приступим"
  FRA_qof.172.1.b:0 "Возможно, крупная война только из-за колоний - это не лучшая идея"
  qof.171.t:0 "Италия подчиняется нашим требованиям!"
  qof.171.d:0 "Сегодня утром итальянская делегация только что проинформировала нас о том, что они принимают наши условия, чтобы избежать войны. Тунис снова французский!"
  FRA_qof.171.1.a:0 "Там, где проходит француз, погибает итальянец!"
  qof.18.t:0 "Франция хочет купить Луизиану"
  qof.181.t:0 "Успех!"
  qof.181.d:0 "В обмен на крупную сумму денег нам удалось купить Луизиану."
  FRA_qof.181.1.a:0 "Хорошие новости"
  qof.182.t:0 "Они отказались"
  qof.182.d:0 "Что ж, сделка не состоялась. Это было предсказуемо, но нам нечего терять. Мы используем деньги для других целей."
  FRA_qof.182.1.a:0 "Давайте вернёмся туда!"
  FRA_qof.182.1.b:0 "Это того не стоит"
  qof.19.t:0 "Франция просит политической поддержки"
  qof.191.t:0 "Они нас поддерживают!"
  qof.191.d:0 "Сегодня утром в официальных газетах была опубликована прекрасная новость! Великобритания, под давлением союзников, будет вынуждена освободить Шотландию!"
  FRA_qof.191.1.a:0 "Великолепно!"
  qof.192.t:0 "Они отказались"
  qof.192.d:0 "Несмотря на всю важность вопроса, они не сочли необходимым оказать нам поддержку."
  FRA_qof.191.1.a:0 "Мы справимся и без них."
  qof.20.t:0 "Япония просит мир без победы"
  qof.20.d:0 "Тактическое и стратегическое превосходство наших армий привело к полному уничтожению Германии, у которой не было иного выбора, кроме как капитулировать. Лишившись самого могущественного союзника, Япония сегодня утром предложила нам мир без победы. Это предложение разделило наших генералов и политиков, которые обсуждают, стоит ли наконец-то заключить мир или продолжать вести далекую войну..."
  FRA_qof.20.1.a:0 "Отклонить их просьбу"
  FRA_qof.20.1.b:0 "Принять предложение Японии"
  french_border_conflict.2.t:0 "Победа Франции!"
  french_border_conflict.2.desc:0 "Наши «горные охотники» разгромили испанские войска, которые сейчас обращены в бегство. Это великая победа королевства Франции, которая теперь может объединить королевство Наварры."
  french_border_conflict.2.a:0 "Великолепно!"
  french_border_conflict.2.b:0 "Эй! Нечего тут лазить по моим моддам, молодой нахал"
  french_border_conflict.3.t:0 "Победа Испании..."
  french_border_conflict.3.desc:0 "В этот полдень, офицер, отвечающий за наступление Наварры, сообщил нам о нашем поражении. Кажется, испанские войска слишком укрепились для нашей артиллерии ..."
  french_border_conflict.3.a:0 "Давайте остановимся на этом..."
  french_border_conflict.3.b:0 "Пуа, хахаха, вас взорвали испанцы. Разве так сложно сделать 7/2 альпийских охотников?"
  french_border_conflict.4.t:0 "Статус кво"
  french_border_conflict.4.desc:0 ""Битва была настолько изнурительной, что ее нельзя было продолжить из-за нехватки припасов. Учитывая сопротивление испанцев, лучше оставить все как есть."
  french_border_conflict.4.a:0 "Больше такого не повторится..."
  french_border_conflict.4.b:0 "Надеюсь, ты хорошо сохранился"
  qof.21.t:0 "Франция объявляет войну Советскому Союзу!"
  qof.21.d:0 "Сегодня утром французские войска напали на российских пограничников. Увидев причину объявления войны Францией, российский посол, как сообщается, произнес: "Что за казус белли?" Тем не менее, разразившаяся война, вероятно, будет ужасной для обоих лагерей ..."
  FRA_qof.21.1.a:0 "За Людовика XV!"