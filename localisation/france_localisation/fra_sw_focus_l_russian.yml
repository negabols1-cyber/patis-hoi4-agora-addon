l_russian:
  UFRA_create_dga:0 "Создать DMA"
  UFRA_create_dga_desc:0 "С созданием новых научно-исследовательских центров создание делегации, которая будет специализироваться на подготовке будущего французских систем обороны, поможет нам эффективно использовать новые технологии оружия."
  UFRA_super_heavy:0 "Планы на сверхтяжелый танк"
  UFRA_super_heavy_desc:0 "Противотанковые орудия становятся все более эффективными, из-за чего наши танки устаревают. Мы можем решить эту проблему, создав сверхтяжелые танки. Их характеристики - толстая броня, мощная пушка и пулеметы со всех сторон. Char 2 позволит создать такой танк в кратчайшие сроки."
  UFRA_autoloader:0 "Автозагрузчик"
  UFRA_autoloader_desc:0 "Наши инженеры разработали систему, которая позволяет резко сократить время перезарядки танка. Включение этой системы на наших танках было бы большим плюсом для нашей армии."
  UFRA_create_matra:0 "Милитаризация CAPRA"
  UFRA_create_matra_desc:0 "Compagnie Anonyme de Production et Réalisation Aéronautique имеет промышленность, которая вполне способна производить истребители. Финансируя их и меняя их цели, мы можем усилить нашу промышленность!"
  UFRA_capture_german_rocket:0 "Нанять немецких ученых"
  UFRA_capture_german_rocket_desc:0 "Немцы добились больших успехов в ракетостроении. Привлекая их, мы тоже можем добиться больших успехов."
  UFRA_rocket_try:0 "Финансировать исследования ракетного движения"
  UFRA_rocket_try_desc:0 "Мы верим, что освоение космоса может быть полезно нам, как в военной, так и в гражданской сфере. Если мы можем отправлять объекты на орбиту, то почему бы не отправлять их и к нашим соседям?"
  UFRA_missile:0 "Усовершенствованное ракетостроение"
  UFRA_missile_desc:0 "Мы добились больших успехов в сфере космонавтики и ракетостроения. Если мы поручим MATRA заняться производством этих ракет, то сможем получить огромное преимущество над нашими врагами."
  UFRA_launch_site:0 "Пусковые площадки в колониях"
  UFRA_launch_site_desc:0 "Для будущих операций нам понадобятся пусковые площадки. Их создание в наших колониях стало бы наилучшим решением."
  UFRA_space:0 "Запустить разведывательные спутники"
  UFRA_space_desc:0 "Отправив на низкую орбиту спутники, оснащенные камерами, мы сможем шпионить за нашими врагами и получим колоссальное преимущество."
  UFRA_nuk_alone:0 "Проводить атомные исследования самостоятельно"
  UFRA_nuk_alone_desc:0 "Ученые утверждают, что при расщеплении большого количества атомов может выделиться достаточно энергии, чтобы стереть с лица земли целый город. Нам нужно это оружие, но оно настолько опасно, что было бы лучше, если бы мы получили к нему эксклюзивный доступ."
  UFRA_nuk_toge:0 "Научное сотрудничество в области ядерной энергетики"
  UFRA_nuk_toge_desc:0 "Научное сообщество утверждает, что при расщеплении большого количества атомов может выделиться достаточно энергии, чтобы стереть с лица земли целый город. Разработка такого оружия потребует много времени, поэтому было бы лучше объединить усилия с нашими союзниками в этом проекте."
  UFRA_nuke:0 "Готовиться к испытанию бомбы"
  UFRA_nuke_desc:0 "Наши инвестиции не прошли зря. Наш прототип бомбы готов, но нам еще предстоит ее испытать. И для этого нам нужно найти и подготовить площадку для испытаний..."
  UFRA_gerboise:0 "Голубая тушканчик"
  UFRA_gerboise_desc:0 "Сахара в Алжире, похоже, является идеальным местом для испытаний, она находится недалеко от метрополии и там нет ничего, кроме песка. Чем быстрее будут проведены наши испытания, тем лучше это будет для нас."
  UFRA_alde:0 "Альдебаран"
  UFRA_alde_desc:0 "Атолл Муруроа находится далеко от метрополии, но там мало жителей. Состав местности позволил бы нам провести дополнительные испытания, необходимые для лучшего понимания этого оружия."
  UFRA_jet_effort:0 "Развитие реактивного двигателя"
  UFRA_jet_effort_desc:0 "Предложенный Рене Лореном в 1913 году, реактивный двигатель мог дать самолету непревзойденную скорость, что было определенным преимуществом в воздушном бою. Парень по имени Рене Ледюк готов работать над этим проектом. Давайте дадим ему шанс."
  UFRA_dassault:0 "Контракт с Dassault"
  UFRA_dassault_desc:0 "Похоже, компания Марселя Блоха проявляет определенный интерес к реактивным самолетам. Давайте предложим ему контракт и, следовательно, посмотрим, сможет ли его прототип летать."
  UFRA_quad:0 "Четырехъядерная башня"
  UFRA_quad_desc:0 "С военно-морскими договорами ограничены размер и вес наших кораблей. Но у нас есть решение. Установив 4 пушки в одну башню, мы сможем получить отличную огневую мощь, не увеличивая размер или вес наших кораблей."
  UFRA_dorand:0 "Финансирование Dorand G.20"
  UFRA_dorand_desc:0 "Инженер по имени Рене Доран работает над созданием автожира для нашей субмарины, Сюркуф. Покупка его автожира для всего флота станет выгодным решением, мы могли бы использовать его для разведки и противолодочной борьбы."
  UFRA_amx_our:0 "Национализировать AMX"
  UFRA_amx_our_desc:0 "Мастерские Issy-les-Moulineaux имеют большой опыт в создании танков. Национализация этой промышленности позволит нам производить танки более рационально."
  UFRA_newgun:0 "Разработка современной пушки"
  UFRA_newgun_desc:0 "Наши враги постоянно увеличивают броню своих танков, нам нужно разработать еще более мощные противотанковые пушки, если мы хотим их пробить."
  UFRA_ger_armor:0 "Изучите немецкие танки"
  UFRA_ger_armor_desc:0 "Наши немецкие соседи добились больших успехов в создании тяжелых танков. Изучение их опыта очень помогло бы нам."
  UFRA_new_mbt:0 "Разработка современного танка"
  UFRA_new_mbt_desc:0 "Благодаря нашим достижениям в области танкостроения мы можем создать совершенно новый тип танка, сочетающий в себе тяжелую броню, мощную пушку и высокую скорость."
  FRA_tour_de_France:0 "Королевский Тур де Франс"
  FRA_tour_de_France_desc:0 "Со смертью Жана III страна дестабилизирована. Визит нового короля, Генриха VI, в королевство наверняка восстановит доверие народа к будущему."
  FRA_found_way:0 "Найти решение"
  FRA_found_way_desc:0 "Это настоящая катастрофа... два короля и два наследника мертвы. Больше нет ни одного прямого наследника, и если мы быстро не найдем решение, возможно, это будет означать конец монархии..."
  FRA_IsabelleI:0 "Изабелла - лучший вариант"
  FRA_IsabelleI_desc:0 "Жена Генриха VI, ныне вдова, частично является Орлеанкой. С реформой законов о престолонаследии она могла бы стать нашим решением и взойти на трон."
  FRA_reform_succession_law:0 "Реформировать закон о престолонаследии"
  FRA_reform_succession_law_desc:0 "С реформой закона о престолонаследии Изабелла сможет легально взойти на престол."
  FRA_protect_our_back:0 "Обезопасить тыл"
  FRA_protect_our_back_desc:0 "Это решение последней надежды, но в виду внутренней ситуации во Франции и роста иностранного милитаризма, мы вынуждены пойти на уступки, чтобы сэкономить время."
  FRA_search_support_with_parties:0 "Найти поддержку у партий"
  FRA_search_support_with_parties_desc:0 "В связи с кризисом престолонаследия крайне важно найти поддержку нескольких партий, чтобы гарантировать восшествие Изабеллы."
  FRA_cible_population_with_propaganda:0 "Вести пропаганду среди населения"
  FRA_cible_population_with_propaganda_desc:0 "В это кризисное время поддержка населения имеет значительное влияние как инструмент давления."
  FRA_The_Queen_of_France:0 "Королева Франции"
  FRA_The_Queen_of_France_desc:0 "Да здравствует королева! Да здравствует Франция! Несмотря на давление и сопротивление, коронация Изабеллы неминуема благодаря нашим усилиям!"
  FRA_mobilize_Paris_artisans:0 "Мобилизовать парижских мастеров"
  FRA_mobilize_Paris_artisans:0 "Для предстоящей гражданской войны необходимо получить дополнительное оборудование."
  FRA_take_Lebel_stocks:0 "Конфисковать запасы \"Лебель\""
  FRA_take_Lebel_stocks_desc:0 "Рассчитывать на технику, которая сохранилась с Первой мировой войны, – это не лучший способ победить в конфликте. Но у нас есть солдаты, а им нужны винтовки..."
  FRA_en_avant_marche:0 "En avant... Marche!"
  FRA_en_avant_marche_desc:0 "Третья республика слишком долго внушала пацифистские настроения своему народу, отвращая французского льва от его великого предназначения. Пришло время вновь милитаризовать французское общество."
  FRA_a_new_beginig:0 "Новое начало"
  FRA_a_new_beginig_desc:0 "Гражданская война позади. Теперь нам нужно смотреть в будущее, восстанавливать страну и справляться со многими проблемами."
  FRA_rebuild_the_nation:0 "Возродить королевство"
  FRA_rebuild_the_nation_desc:0 "Гражданская война нанесла большой урон фабрикам и инфраструктуре страны. Для быстрой реконструкции требуется сосредоточить все финансовые средства."
  FRA_Ask_united_kingdom_support_for_international_recognition:0 "Попросить у Соединённого Королевства поддержки для международного признания"
  FRA_Ask_united_kingdom_support_for_international_recognition_desc:0 "Низкий уровень международного признания нашей королевы мешает нам эффективно торговать со странами мира. Помощь со стороны Соединённого Королевства была бы кстати."
  FRA_join_allies:0 "Присоединиться к союзникам"
  FRA_join_allies_desc:0 "Присоединение к сильной фракции может помочь нам проще преодолевать трудности."
  FRA_we_dont_need_any_help:0 "Нам не нужна никакая помощь"
  FRA_we_dont_need_any_help_desc:0 "Наше королевство достаточно сильно, чтобы не опускаться до самопродажи Перфидному Альбиону. Пришло время вернуть себе былую славу!"
  FRA_commercial_deal_with_sueden:0 "Ухаживаем за Швецией"
  FRA_commercial_deal_with_sueden_desc:0 ""
  FRA_commercial_deal_with_Norway:0 "Ухаживаем за Норвегией"
  FRA_commercial_deal_with_Norway_desc:0 ""
  FRA_commercial_deal_with_Japan:0 "Ухаживаем за Японией"
  FRA_commercial_deal_with_Japan_desc:0 ""
  FRA_commercial_deal_with_China:0 "Ухаживаем за Нидерландами"
  FRA_commercial_deal_with_China_desc:0 ""
  FRA_commercial_deal_with_United_States:0 "Ухаживаем за Югославией"
  FRA_commercial_deal_with_United_States_desc:0 ""
  FRA_commercial_deal_with_USSR:0 "Ухаживаем за Грецией"
  FRA_commercial_deal_with_USSR_desc:0 ""
  FRA_Isabelle_reforms:0 "Реформы Изабель"
  FRA_Isabelle_reforms_desc:0 "Чтобы решить проблемы в стране, Ее Величество разработала план реформ по трем направлениям."
  FRA_install_political_suppremacy:0 "Обеспечить политическое превосходство"
  FRA_install_political_suppremacy_desc:0 "Гражданская война показала нам одну вещь: даже когда мы искали помощи, мы были одиноки. Они попытались пошатнуть нас оружием, а мы уволим их с политических постов."
  FRA_intensely_subsidize_the_industrial_sector:0 "Активно субсидировать промышленный сектор"
  FRA_intensely_subsidize_the_industrial_sector_desc:0 "Для нас жизненно важно вернуть доверие к бизнесу, чтобы быстро восстановить промышленность. Это будет дорого для государства, но интенсивное субсидирование этого сектора позволит нам увеличить нашу промышленную мощь."
  FRA_give_more_command_power_to_young_officers:0 "Предоставить больше командных полномочий молодым офицерам"
  FRA_give_more_command_power_to_young_officers_desc:0 "Гражданская война выявила несколько проблем с состоянием нашей армии. Жесткость командования была признана Ее Величеством как неотложная проблема, которую необходимо решить."
  FRA_an_legitimate_queen:0 "Легитимная королева"
  FRA_an_legitimate_queen_desc:0 "Благодаря своим реформам и контролю над кризисной ситуацией Ее Величество доказала свою легитимность для управления королевством Франции."
  FRA_claim_bresil_kingdom:0 "Заявить претензии на трон Бразилии"
  FRA_claim_bresil_kingdom_desc:0 "Отец Ее Величества претендовал на бразильский трон. С помощью небольшой дипломатической манипуляции мы могли бы претендовать на бразильские территории."
  FRA_prepare_guinea:0 "Подготовить Гвинею"
  FRA_prepare_guinea_desc:0 "Гвинея - наш путь в Бразилию, мы должны сделать территорию более подходящей для принятия вторгшейся армии."
  FRA_mobilize_strong_support_in_brasil:0 "Мобилизовать мощную поддержку в Бразилии"
  FRA_mobilize_strong_support_in_brasil_desc:0 "Если мы хотим овладеть Бразилией, мы должны мобилизовать значительную поддержку нашего дела на ее территориях."
  FRA_hold_international_conference_about_future_of_brasil:0 "Провести международную конференцию о будущем Бразилии"
  FRA_hold_international_conference_about_future_of_brasil_desc:0 "Создав репутацию дестабилизированной страны по отношению к Бразилии, мы сможем легитимизировать свое присутствие в регионе. Быть похожим на доброго друга - лучший способ стать злейшим врагом."
  FRA_create_brasil_civil_war:0 "Начать гражданскую войну в Бразилии"
  FRA_create_brasil_civil_war_desc:0 "“О нет! Гражданская война в Бразилии, какой кошмар! Мы выражаем всю свою моральную поддержку первоначальному правительству”. Это будет нашей официальной реакцией."
  FRA_ask_League_of_Nations_an_intervention_mandate:0 "Попросить Лигу Наций о мандате на интервенцию"
  FRA_ask_League_of_Nations_an_intervention_mandate_desc:0 "Под предлогом помощи законному правительству ЛН может дать нам мандат на интервенцию, чтобы исправить ситуацию. Но возможно… мы могли бы использовать его для других целей…"
  FRA_annex_brasil_state:0 "Аннексировать бразильский штат"
  FRA_annex_brasil_state_desc:0 "Теперь, когда наше марионеточное государство правит Бразилией, мы можем без проблем аннексировать его с помощью референдума… фальсифицированного, разумеется."
  FRA_integrate_brasil:0 "Интегрировать Бразилию"
  FRA_integrate_brasil_desc:0 "Бразильские территории в нашем распоряжении, больше ничто не мешает нам их интегрировать."
  FRA_European_policy:0 "Европейская политика"
  FRA_European_policy_desc:0 ""
  FRA_ultimatum_Germany:0 "Ультиматум Германии"
  FRA_ultimatum_Germany_desc:0 "Теперь мы готовы. Страсбургский договор был всего лишь мистификацией, в которую Германия верила до конца. Пришло время показать ему реальность."
  FRA_ultimatum_Belgium:0 "Ультиматум Бельгии и Люксембургу"
  FRA_ultimatum_Belgium_desc:0 "Эти страны не должны существовать, и их единственная цель - быть поглощенными нашей великой страной."
  FRA_ultimatum_Italy:0 "Ультиматум Италии"
  FRA_ultimatum_Italy_desc:0 "Может быть, мы сможем вернуть Тунис дипломатическим путем. Но если это не удастся...имеет ли смысл начинать из-за этого большую войну?"
  FRA_going_for_Rhine:0 "Идем за Рейн"
  FRA_going_for_Rhine_desc:0 "Рейн был французским, и он будет им! Наши союзники во время Первой мировой войны слишком сильно нас недооценивали. Давайте покажем им, на что мы способны."
  FRA_integrate_Rhine:0 "Интегрировать Рейн"
  FRA_integrate_Rhine_desc:0 "Бисмарк, Гегель, Фихте... давайте уберем эти имена из наших учебников истории."
  FRA_our_oldiest_ally:0 "Наш старейший союзник"
  FRA_our_oldiest_ally_desc:0 "Мы должны надавить на Великобританию, чтобы освободить Шотландию, нашего старейшего союзника по Старому союзу."
  FRA_ask_USA_support_on_scotland_question:0 "Просить поддержки США по вопросу Шотландии"
  FRA_ask_USA_support_on_scotland_question_desc:0 "Давайте изолируем Великобританию."
  FRA_ask_Japan_support_on_scotland_question:0 "Просить поддержки Японии по вопросу Шотландии"
  FRA_ask_Japan_support_on_scotland_question_desc:0 "Давайте изолируем Великобританию."
  FRA_ask_ussr_support_on_scotland_question:0 "Просить поддержки СССР по вопросу Шотландии"
  FRA_ask_ussr_support_on_scotland_question_desc:0 "Изолируем Великобританию."
  FRA_retribution_for_Hundred_years_war:0 "Расплата за Столетнюю войну"
  FRA_retribution_for_Hundred_years_war_desc:0 "Столетняя война дестабилизировала Францию на 116 лет лишь потому, что англичане выдвигали необоснованные требования. Конечно, войну мы выиграли, но им не хватает унижения."
  FRA_reunify_kingdom_of_Navarre:0 "Воссоединить Королевство Наварры"
  FRA_reunify_kingdom_of_Navarre_desc:0 "Вопросу о королевстве Наварра уже более двух столетий. На протяжении двух веков часть из нас вынуждены были находиться с Испанией… Это недопустимо."
  FRA_push_further:0 "Продвижение дальше"
  FRA_push_further_desc:0 ""Инцидент с Наваррой", как мы его официально называем, показал нам, что Испания уже не империя, какой она когда-то была. Расчленение этой страны будет лишь формальностью."
  FRA_buy_Louisiana:0 "Купить Луизиану"
  FRA_buy_Louisiana_desc:0 "В обмен на определенную сумму денег, Соединенные Штаты, возможно, продадут нам часть Луизианы."
  FRA_rebuild_la_royale:0 "Модернизировать Ла Рояль"
  FRA_rebuild_la_royale_desc:0 "Столкнувшись с инновациями немцев и итальянцев, наш флот может столкнуться со многими трудностями. Его модернизация должна быть приоритетом."
  FRA_build_modern_bb:0 "Строительство современных линкоров"
  FRA_build_modern_bb_desc:0 "Очевидно, что на европейском театре авианосец бесполезен. Мы должны вкладывать средства в современные линкоры."
  FRA_modernize_fleet:0 "Эффективные крейсеры"
  FRA_modernize_fleet_desc:0 "Наш боевой флот особенно беден современными и эффективными легкими крейсерами"
  FRA_Modernized_Rochefort_s_maritime_arsenal:0 "Модернизация морского арсенала Рошфора"
  FRA_Modernized_Rochefort_s_maritime_arsenal_desc:0 "Рошфор долгое время был ключевым местом во французском судостроении. Однако нынешние потребности нельзя удовлетворить мощностями города. Необходимо модернизировать его судостроительную инфраструктуру"
  FRA_stimulation_of_military_shipbuilding:0 "Стимулирование военного судостроения"
  FRA_stimulation_of_military_shipbuilding_desc:0 "Очевидно, что наш флот отстает от флотов наших соседей. Было бы важно стимулировать сектор судостроения, чтобы исправить это"
  FRA_fuel_autonomy:0 "Автономия по топливу"
  FRA_fuel_autonomy_desc:0 "Мы находимся в коммерческой изоляции и больше не имеем доступа к иностранному топливу. В интересах нации стать независимыми в этом вопросе"
  FRA_national_revitalization2:0 "Национальное возрождение"
  FRA_national_revitalization2_desc:0 "Мы должны использовать все существующие средства, чтобы вернуть страну в нормальное русло"
  FRA_RESSOURCE:0 "Предоставляет доступ к ресурсам страны путем принятия решения"
  FRA_gold_seize:0 "Фактор потребительских товаров изменяется в зависимости от числа подданных"
  FRA_exploit_belgian_ressources:0 "Эксплуатация бельгийских ресурсов"
  FRA_exploit_belgian_ressources_desc:0 ""
  FRA_exploit_spanish_ressources:0 "Эксплуатация испанских ресурсов"
  FRA_exploit_spanish_ressources_desc:0 ""
  FRA_exploit_german_ressources:0 "Эксплуатация немецких ресурсов"
  FRA_exploit_german_ressources_desc:0 ""
  FRA_exploit_Italian_ressources:0 "Эксплуатация итальянских ресурсов"
  FRA_exploit_Italian_ressources_desc:0 ""
  FRA_seize_all_puppets_gold:0 "Изъятие всего запаса золота у вассалов"
  FRA_seize_all_puppets_gold_desc:0 "Изъяв весь запас золота у вассалов, военная промышленность нашего королевства станет намного мощнее."
  FRA_the_portugees_thungsten:0 "Португальский вольфрам"
  FRA_the_portugees_thungsten_desc:0 "У Португалии есть запасы вольфрама, которые могли бы полностью удовлетворить потребности всей нашей военной промышленности. Наш долг и интерес нашей автономии - изъять его."
  FRA_exploit_portugees_ressources:0 "Эксплуатация португальских ресурсов"
  FRA_exploit_portugees_ressources_desc:0 ""
  FRA_scotland:0 "Мы окажем сильное дипломатическое давление на Великобританию, чтобы освободить Шотландию. Но для этого нам понадобится мощная сухопутная армия и большой флот..."
  FRA_the_natural_borders:0 "Возвращение настоящих естественных границ"
  FRA_the_natural_borders_desc:0 "Северная граница Франции естественным образом фиксируется Рейном. Мы должны установить ее."
  FRA_revenge_louis:0 "Отомстить Людовику XV"
  FRA_revenge_louis_desc:0 "В июне 1717 года в гости во Францию приезжал царь Петр Великий и встретился с королем Людовиком XV, которому в то время было семь лет. Российский император осмелился взять на руки и понести короля Франции! Это оскорбление должно быть наказано!"