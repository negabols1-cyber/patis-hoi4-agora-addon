  parliament_gui_decision_category:0 "Палата депутатов Франции"
  parliament_gui_decision_category_desc:0 "Палата депутатов представляет собой законодательное собрание французского парламента, избираемое всеобщим голосованием каждые 4 года. Вместе с Сенатом она образует Национальное собрание. Собрание избирает Президента Республики сроком на 7 лет, но может также отстранить его от должности. Наконец, именно Собрание голосует за законопроекты."

