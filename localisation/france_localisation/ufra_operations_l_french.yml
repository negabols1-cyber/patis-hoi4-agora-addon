l_french:
 ufra_heavy_water_raid:0 "Rapatrier l'eau lourde"
 ufra_heavy_water_raid_desc:0 "§LLes [NOR.GetHabitants] sont les seuls en Europe a avoir suffisament d'eau lourde pour mener des expériences sur la fission nucléaire. Les [GER.GetHabitants] achétent déjà de l'eau lourde aux [NOR.GetHabitants] et ont même demandé a augmenté la quantité de livraison. Nous devons sécuriser les stocks [NOR.GetHabitants] au plus vite.§!"
 ufra_heavy_water_infiltration:0 "Envoit d'homme par avion"
 ufra_heavy_water_infiltration_desc:0 "La norvége est toujours neutre, nous pouvont envoyer nos agents dans un avion commerciale vers Oslo."
 ufra_heavy_water_attack:0 "Convaincre les patrons de l'usine"
 ufra_heavy_water_attack_desc:0 "L'entreprise norvégienne avait sollicité les capitaux français lors de sa création en 1904. Paribas avait apporté 90% du budget initial. Depuis nous avons des liens étroits avec l’entreprise"
 ufra_heavy_water_exfiltration:0 "Exfiltration"
 ufra_heavy_water_exfiltration_desc:0 "L'eau lourde sera stockée dans des bidons et sortie discrétement de l'usine la nuit. Elle sera transporté par bateau vers Londres puis Paris"
 ufra_heavy_water_attack_2:0 "Attaquer l'usine"
 ufra_heavy_water_attack_2_desc:0 "L'usine n'est pas gardé, nos agents attaqueront pendant la nuit, et partiront en camion avec l'eau dans des bidons"
 ufra_heavy_water_exfiltration_2:0 "Exfiltration"
 ufra_heavy_water_exfiltration_2_desc:0 "Nos agents partirons dans un navire cargo direction en direction de Londres et reviendront en France en avion."
 ufra_heavy_water_raid_outcome_tt:0 "Nous allons tenter de capturer l'eau lourde afin de faire des avancés dans le domaine de la recherche nucléaire."
 ufra_heavy_water_infiltration_outcome:0 "L'équipe a rejoint Oslo."
 ufra_heavy_water_attack_outcome:0 "L'équipe est parvenue à infiltrer avec succès l'usine, en évitant les gardes. Le patron a accepté de nous donner l'eau lourde."
 ufra_heavy_water_exfiltration_outcome:0 "L'équipe a réussi un prendre un bateau pour londres avec tous les bidons"
 ufra_heavy_water_exfiltration_outcome_fail:0 "La police Norvégienne a annoncé avoir capturer des agents français avec des bidons d'eau lourde."