 FRA_at_gun_brandt_idea_desc:0 "Les équipes Brandt ont eu l'idée d'utiliser des munition sous-calibrer et de les entourer d'un sabot. Le résultat donne un obus plus rapide en sortie de canon, et avec une capacité de pénétration supérieur. Nous allons utiliser ces obus pour remettre en valeur nos vieux canons."
 FRA_no_moderator_nuke:0 "Pas de modérateur"
 FRA_no_moderator_nuke_desc:0 "Placé au cœur d'un réacteur nucléaire, le modérateur est la substance qui ralentit les neutrons sans les absorber, permettant ainsi une réaction nucléaire en chaîne efficace. Notre principale candidat a ce rôle est l'eau lourde, mais nous n'avons aucun stock a notre disposition"
