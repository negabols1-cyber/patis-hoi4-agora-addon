  FRA_camelots_du_roi:0 "Пажи короля"
  FRA_camelots_du_roi_desc:0 "Пажи короля - молодежная организация Action Française. Теперь они станут лучшей и официальной молодежной организацией Франции! Да здравствуют пажи короля, служить Франции и королю - их девиз!"
  FRA_militarist_society:0 "Милитаристское общество"
  FRA_militarist_society_desc:0 ""
  FRA_code_civil:0 "Новый Гражданский кодекс"
  FRA_code_civil_desc:0 "Наполеоновский кодекс, официально Гражданский кодекс Франции — это французский гражданский кодекс, принятый во времена Французского Консулата в 1804 году и действующий до сих пор. Мы создадим новый Гражданский кодекс, устанавливающий новые правила для нашей Империи."
  FRA_tear_republicans_symbols:0 "Низвержение символов Республики"
  FRA_tear_republicans_symbols_desc:0 ""
  FRA_furia_francese:0 "Furia Francese"
  FRA_furia_francese_desc:0 "В 1495 году итальянцы в битве при Форново описали французское мужество и решимость как Furia Francese, Французское бешенство. Настало время для французов вновь обрести это бешенство и обрушить его на своих врагов!"
  FRA_milice_peace:0 "Милиция"
  FRA_milice_peace_desc:0 ""
  FRA_chantiers_jeunesse:0 "Chantiers de la Jeunesse Francaise"
  FRA_chantiers_jeunesse_desc:0 "Chantiers de la jeunesse française — это молодёжная организация наподобие скаутов, созданная для подготовки и воспитания в молодёжи патриотизма."
  FRA_industrialists_alliance:0 "Альянс с промышленниками"
  FRA_industrialists_alliance_desc:0 "Многие промышленники разделяют наши идеалы и поддерживают наше дело. LOréal, Lessieur... Такие связи имеют огромное значение для создания новой Франции!"
