  FRA_german_armistice_desc:0 "Перемирие, которое мы подписали с Германией, предусматривает ограничение размера нашей армии и запрет на использование тяжелого вооружения"
  FRA_french_pow_1:0 "Французские военнопленные"
  FRA_french_pow_1_desc:0 "Перемирие, которое мы подписали с Германией, оговаривает, что наши военнопленные будут содержаться в Германии до подписания мирного договора."
