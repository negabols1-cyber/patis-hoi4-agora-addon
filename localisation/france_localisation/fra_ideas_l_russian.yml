  FRA_state_atheism:0 "Государственный атеизм"
  FRA_state_atheism_desc:0 "Ни Бога, ни господ. Только человечеству под силу обрести счастье и помогать друг другу. Культы больше никогда не будут управлять Францией!"
  FRA_small_weapons_program:0 "Программа создания стрелкового оружия"
  FRA_small_weapons_program_desc:0 "Современную войну можно вести только с помощью современных орудий. Качество твоих орудий равно качеству твоего мастерства, не так ли?"
  FRA_artillery_program:0 "Программа создания артиллерии"
  FRA_artillery_program_desc:0 "Артиллерия всегда была лучшим оружием Франции со времен Наполеона. Но только одно орудие из двух является современным. Давайте изменим это."
  FRA_motor_program:0 "Программа массовой моторизации"
  FRA_motor_program_desc:0 "Моторизация - будущее ведения боевых действий. Пора позаботиться, чтобы французская армия не осталась в прошлом!"
  FRA_dgse:0 "ДГЭР"
  FRA_dgse_desc:0 "Управление генеральных исследований и разведки (Direction générale des études et recherches) - французская служба внешней разведки, занимающаяся внешней разведкой и секретными операциями."
  FRA_dgsi:0 "БЦРИД"
  FRA_dgsi_desc:0 "Главное управление разведки и действий (Bureau Central de Renseignements et d'Action) - основная цель заключается в обеспечении безопасности на территории Франции, противодействии иностранному влиянию, а также в сочетании полицейских и политических ролей."
