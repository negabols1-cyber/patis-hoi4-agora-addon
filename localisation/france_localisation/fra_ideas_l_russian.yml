  FRA_gaulle_giraud_dyarchie_1:0 "Диархия"
  FRA_gaulle_giraud_dyarchie_1_desc:0 "Ни Жиро, ни Де Голль не хотят отказываться от своих институтов. Два органа власти, территории и армии скорее противопоставлены, чем объединены, и установленная диария запрещает принимать какие-либо важные решения о выборе политической линии."
  FRA_gaulle_giraud_dyarchie_2:0 "Диархия"
  FRA_gaulle_giraud_dyarchie_2_desc:0 "Ни Жиро, ни де Голль не хотят отказываться от своих институтов. Вместо того чтобы слиться, две власти, территории и армии скорее примыкают друг к другу, и введённая диария запрещает любые важные решения по выбору политической линии."
  FRA_gaulle_giraud_dyarchie_3:0 "Диария"
