l_russian:
  ufra_heavy_water_raid:0 "Репатриация тяжёлой воды"
  ufra_heavy_water_raid_desc:0 "§L[NOR.GetHabitants] единственные в Европе, у кого достаточно тяжёлой воды, чтобы проводить эксперименты по ядерному делению. [GER.GetHabitants] уже закупают тяжёлую воду у [NOR.GetHabitants] и даже запросили увеличить объём поставок. Нам нужно как можно скорее обеспечить [NOR.GetHabitants] необходимым инвентарём.§!"
  ufra_heavy_water_infiltration:0 "Отправка агентов на самолёте"
  ufra_heavy_water_infiltration_desc:0 "Норвегия по-прежнему нейтральна, мы можем отправить наших агентов коммерческим рейсом в Осло."
  ufra_heavy_water_attack:0 "Убедить руководство завода"
  ufra_heavy_water_attack_desc:0 "Норвежская компания в момент своего основания в 1904 году запросила финансирование у Франции. Paribas предоставила 90 % начального бюджета. С тех пор у нас установились тесные связи с компанией."
  ufra_heavy_water_exfiltration:0 "Вывоз"
  ufra_heavy_water_exfiltration_desc:0 "Тяжёлая вода будет храниться в бочках и ночью бесшумно вывезена с завода. Её перевезут на корабле в Лондон, а затем в Париж."
  ufra_heavy_water_raid_outcome_tt:0 "Мы попытаемся получить тяжёлую воду, чтобы продвинуться в области ядерных исследований."
  ufra_heavy_water_infiltration_outcome:0 "Отряд прибыл в Осло."
  ufra_heavy_water_attack_outcome:0 "Отряду удалось успешно проникнуть на завод, минуя охрану. Руководство завода согласилось предоставить нам тяжёлую воду."
  ufra_heavy_water_exfiltration_outcome:0 "Команда добралась на лодке до Лондона со всеми контейнерами"
  ufra_heavy_water_exfiltration_outcome_fail:0 "Норвежская полиция сообщает о задержании французских агентов с канистрами тяжелой воды."