l_russian:
  french_bonapartist_focus:0 "Бонапартистское древо фокусов Франции"
  french_royalist_focus:0 "Роялистское древо фокусов Франции"
  french_communist_focus:0 "Коммунистическое древо фокусов Франции"
  french_democratic_focus:0 "Демократическое древо фокусов Франции"
  UFRA_sncf:0 "SNCF"
  UFRA_sncf_desc:0 "Национализация основных железнодорожных компаний Франции привела к созданию Национального железнодорожного общества. Это значительно улучшит транспорт как в гражданских, так и в военных целях."
  UFRA_sahara_census:0 "Перепись в Сахаре"
  UFRA_sahara_census_desc:0 "БЕСПОЛЕЗНО СЕЙЧАС! НЕ БЕРИТЕ! Наши обширные африканские территории полны ресурсов и рабочей силы. Но печальная реальность такова, что не все наши сахарийские территории хорошо известны. Пришло время отправить экспедиции, чтобы составить карты и получить информацию из самого сердца пустыни."
  UFRA_gerboise_bleue:0 "Голубая песчанка"
  UFRA_gerboise_bleue_desc:0 "Первоначальные испытания в области ядерной науки показали многообещающие результаты. Использование его мощности может дать нам оружие, подобного которому человечество еще не видело."
  UFRA_vienot_agreements:0 "Соглашения Вино"
  UFRA_vienot_agreements_desc:0 "Пришло время сирийскому и ливанскому народам обрести свободу. Франция пригласит представителей сирийского народа на переговоры о независимости в Париж."
  UFRA_social_nationalism:0 "Корпоратизм"
  UFRA_social_nationalism_desc:0 "Мы организуем французское общество по корпоративным группам, таким как сельскохозяйственные, рабочие, военные, научные или гильдейские ассоциации, на основе их общих интересов."
  UFRA_decentralize_the_state:0 "Децентрализовать государство"
  UFRA_decentralize_the_state_desc:0 "Французская бюрократия сложная, неэффективная и дорогостоящая. Она также пагубна для регионов и их идентичности. Она должна быть отменена"
  UFRA_state_catholism:0 "Старшая дочь Церкви"
  UFRA_state_catholism_desc:0 "Франция была названа Старшей дочерью Папой, но Революция разрушила все то, что нам было дорого. Как старые французские короли и крестоносцы, мы снова сделаем Францию ​​святой землей! Sacré-Coeur de Jésus, soyez l'espoir et le salut de la France!"
  UFRA_camelots_du_roi:0 "Камелоты короля"
  UFRA_camelots_du_roi_desc:0 "Камелоты короля - молодежная организация Action Française. Теперь они станут лучшей и официальной молодежной организацией Франции! Да здравствуют Камелоты короля, служить Франции и королю - их девиз!"
  UFRA_operation_clovis:0 "Операция "Хлодвиг""
  UFRA_operation_clovis_desc:0 "Королевство Хлодвига, первого короля Франции, имело свое начало в современной Бельгии. Это наши естественные границы, и мы должны их вернуть!"
  UFRA_up_with_jean_darc:0 "Разрушить республиканскую символику"
  UFRA_up_with_jean_darc_desc:0 "Пришло время нанести республике последний удар. Liberté, Egalité, Fraternité - ложь и должны быть свергнуты как таковые!"
  UFRA_code_civil:0 "Укрепить наше присутствие в мире"
  UFRA_code_civil_desc:0 "Наполеоновский кодекс, официально Гражданский кодекс французов, является французским гражданским кодексом, созданным при французском консульстве в 1804 году и все еще действующим. Мы создадим новый гражданский кодекс, устанавливающий, что Третья Французская империя будет управляться референдумами."
  UFRA_meritocracy:0 "Меритократия"
  UFRA_meritocracy_desc:0 "Режим Наполеона, как и его предшественники, должен быть меритократией. Сын мясника сможет стать маршалом империи, если он этого заслуживает!"
  UFRA_militarist_society:0 "Милитаризированное общество"
  UFRA_militarist_society_desc:0 "Наши соседи амбициозны и агрессивны. Мы должны принять более милитаристский образ жизни, чтобы защитить себя и наш уклад. Слава Армии!"
  UFRA_continental_system:0 "Континентальная система"
  UFRA_continental_system_desc:0 ""
  UFRA_return_to_iberia:0 "Покорить Иберию"
  UFRA_return_to_iberia_desc:0 "Однажды Наполеон не смог захватить Иберию, но теперь полуостров в руинах. Сейчас наше время."
  UFRA_save_quebec:0 "Спасите Квебек"
  UFRA_save_quebec_desc:0 ""
  UFRA_medium_tanks:0 "Модернизировать Renault D1"
  UFRA_return_to_italy:0 "Итальянский вопрос"
  UFRA_return_to_italy_desc:0 ""
  UFRA_form_the_milice:0 "Армия оккупации"
  UFRA_form_the_milice_desc:0 "Мы должны создать институт, способный оккупировать наши будущие завоевания и принести мир в наше общество. Мы создадим «La Milice Française», французскую милицию, политическую военизированную организацию."
  UFRA_chantiers_jeunesse:0 "Молодежные лагеря"
  UFRA_chantiers_jeunesse_desc:0 "Молодежная организация «Шантье де ля жёнес франсез», похожая на бойскаутов, создана для воспитания и усиления молодежного национализма."
  UFRA_industrialists_alliance:0 "Союз с промышленниками"
  UFRA_industrialists_alliance_desc:0 "Многие промышленные семьи придерживаются таких же идеалов, как и мы, и поддерживают наше дело. «Лореаль», «Лессёр»... Такие связи необходимы для построения новой Франции!"
  UFRA_stop_moral_decay:0 "Остановить моральное разложение"
  UFRA_stop_moral_decay_desc:0 "Пора вырвать корень проблемы и раз и навсегда покончить с моральным разложением. Ради этого нам придется сделать выбор..."
  UFRA_furia_francese:0 "Французская ярость"
  UFRA_furia_francese_desc:0 "В 1495 году в битве при Форново итальянцы описывали мужество и решительность французов как французскую ярость. Пора французскому народу возродить эту ярость и обрушить ее на своих врагов!"
  UFRA_update_weaponry:0 "Модернизировать вооружение"
  UFRA_update_weaponry_desc:0 "Инновации в вооружении развиваются очень быстро. Мы должны напряженно трудиться, чтобы поддерживать наши пушки на современном уровне развития."
  UFRA_improve_motor_industry:0 "Развивать автомобильную промышленность"
  UFRA_improve_motor_industry_desc:0 "Моторизация — это будущее ведения боевых действий. Пора позаботиться о том, чтобы французская армия не осталась в прошлом!"
  UFRA_commit_air_industry:0 "Использовать авиационную промышленность"
  UFRA_commit_air_industry_desc:0 "Господство в воздухе стало ключом к победе. Нам необходимо увеличить инвестиции в авиакомпании!"
  UFRA_further_armament_program:0 "Программа дальнейшего вооружения"
  UFRA_further_armament_program_desc:0 "Современная война ведется только с применением современного оружия. Вы можете добиться успеха, только если ваше оружие является современным, не так ли?"
  UFRA_decolonization:0 "Деколонизация"
  UFRA_decolonization_desc:0 "Пришло время предоставить другим странам управлять собой. Каждый имеет право на самоуправление. Французская колониальная империя заканчивается."
  UFRA_transaharien:0 "Транссахарская магистраль"
  UFRA_transaharien_desc:0 "Транссахарская железная дорога - это проект по строительству железнодорожной линии на юг через Алжир в страны Африки к югу от Сахары. Она позволит связать угольные шахты и нарастить объемы торговли по всей Северной Африке, объединить Французскую империю и связать Северную Африку с Африкой к югу от Сахары."
  UFRA_syria_oil:0 "Нефть в Сирии"
  UFRA_syria_oil_desc:0 "Топливо. Именно в топливе Франция так отчаянно нуждается. К счастью, наш протекторат Сирия располагает большими запасами нефти."
  UFRA_indochina_mines:0 "Индокитайские шахты"
  UFRA_indochina_mines_desc:0 "Жемчужина Французской империи Индокитай. Он полон богатств, ожидающих, когда мы их захватим."
  UFRA_excolonies_invest:0 "Инвестирование в наших новых союзников"
  UFRA_excolonies_invest_desc:0 ""
  UFRA_secure_contracts:0 "Обеспечение контрактов"
  UFRA_secure_contracts_desc:0 "Наши особые отношения с нашими бывшими колониями являются большим преимуществом для обеспечения контрактов на поставку ресурсов с ними."
  UFRA_excolonies_rd:0 "Обмен знаниями"
  UFRA_excolonies_rd_desc:0 "Для уверенного развития с нашими союзниками мы будем делиться с ними технологиями и создадим исследовательский центр для обмена знаниями."
  UFRA_strenghten_foreign_legion:0 "Усиление иностранного легиона"
  UFRA_strenghten_foreign_legion_desc:0 "Иностранный легион - элитное подразделение, которым служат люди со всего мира, гордящиеся тем, что служат Франции. Его нужно расширить и превознести."
  UFRA_secret_services:0 "Управление общей разведки"
  UFRA_secret_services_desc:0 "Знание - сила. Поэтому нам нужно организовать нашу разведку в официальное учреждение."
  UFRA_integrate_rhine_borders:0 "Интегрировать границы Рейна"
  UFRA_integrate_rhine_borders_desc:0 "Естественные границы Франции - это политическая и географическая теория, разработанная во Франции, в частности, во время Французской революции. Согласно революционерам, они соответствуют Рейну, Атлантическому и Средиземному морям, Пиренеям и Альпам."
  UFRA_paneuropanism:0 "Паневропеизм"
  UFRA_paneuropanism_desc:0 "Возможно, после столетий войн и страданий, европейские страны должны осознать, что у них так много общего. Не является ли природной эволюцией наличие единой Европы в культурном и геополитическом плане?"
  UFRA_charlemagne_claims:0 "Претензии Карла Великого"
  UFRA_charlemagne_claims_desc:0 "Претензии Карла Великого"
  UFRA_roman_claims:0 "Претензии Римской империи"
  UFRA_roman_claims_desc:0 "Кто бы мог подумать? Что Галлия, Франция, завоеванная лично Цезарем, в один прекрасный день попытается воссоздать Римскую империю! Тем не менее, этот день настал!"
  UFRA_attack_the_slavs:0 "Удар на восток"
  UFRA_attack_the_slavs_desc:0 "Удар на восток"
  UFRA_empire_from_west_to_east:0 "От Атлантики до Урала"
  UFRA_empire_from_west_to_east_desc:0 "От Атлантики до Урала"
  UFRA_transeuropean:0 "Трансевропейский"
  UFRA_transeuropean_desc:0 "Трансевропейский"
  UFRA_the_capital:0 "Перемещение столицы"
  UFRA_the_capital_desc:0 "Теперь, когда мы объединили Европу, возможно, пора найти новую столицу?"
  UFRA_lingua_franka:0 "Язык общения"
  UFRA_lingua_franka_desc:0 "Раньше французский язык был языком власти и дипломатии. С Европой в наших руках он снова может им стать. С помощью образования и пропаганды французский язык будет преподаваться каждому новому гражданину Европы!"
  UFRA_air_focus:0 "Armée de l'Air"
  UFRA_ideological_fanaticism:0 "Политическое воспитание"
  UFRA_ideological_fanaticism_desc:0 "На наши политически установленные ценности и цели стоит умирать так же, как и за любую древнюю веру. Любой последователь должен быть готов встретить смерть, а те, кто сбился с пути, должны быть готовы умереть."
  UFRA_reinforce_la_royale:0 "Усиление La Royale"
  UFRA_reinforce_la_royale_desc:0 "Французский флот, также известный как La Royale, должен потрудиться, чтобы составить конкуренцию Королевскому флоту или Реджиа Марина. Нам нужно быстро наращивать строительство кораблей усердным трудом и дисциплиной!"
  UFRA_foundations_for_a_european_union:0 "К Европейскому Союзу"
  UFRA_foundations_for_a_european_union_desc:0 "Теперь, когда фашистская угроза в Европе устранена, пришло время восстановить силы и задуматься о мире. Возможно, пришло время осуществить мечту о европейском союзе?"
  UFRA_community_for_coal_and_steel:0 "Европейское сообщество угля и стали"
  UFRA_community_for_coal_and_steel_desc:0 "Первой целью нашего союза будет содействие восстановлению, обмену и торговле между нашими странами. Мир будет построен на прочной экономике!"
  UFRA_european_investments:0 "Европейские инвестиции"
  UFRA_european_investments_desc:0 "У некоторых стран больше трудностей, чем у других, некоторым нужно восстановиться. Поэтому необходим центральный банк и центральные инвестиции."
  UFRA_cern:0 "ЦЕРН"
  UFRA_cern_desc:0 "Европейский центр ядерных исследований раскроет секреты Вселенной с помощью самых светлых умов каждой страны!"
  UFRA_pool_technical_know_how:0 "Европейские технические знания"
  UFRA_pool_technical_know_how_desc:0 "У каждой страны нашего союза есть своя специализация. Объединение их даст нам потрясающее преимущество по сравнению с миром."
  UFRA_the_euro_money:0 "Евро"
  UFRA_the_euro_money_desc:0 "Чтобы облегчить обмен и сотрудничество, необходимо создать единую валюту."
  UFRA_fondation_for_european_army:0 "Создание европейской армии"
  UFRA_fondation_for_european_army_desc:0 "Некоторые страны не готовы к созданию европейской армии, но, возможно, мы уже можем обмениваться навыками подготовки и стратегиями."
  UFRA_european_navy_regulations:0 "Европейские военно-морские стандарты"
  UFRA_european_navy_regulations_desc:0 "Чтобы европейские военно-морские силы могли эффективно работать вместе, необходимо упорядочить и стандартизировать материалы и подготовку."
  UFRA_european_federal_state:0 "Европейское федеральное государство"
  UFRA_european_federal_state_desc:0 "Давайте объединим Европу в одну мировую державу — Европейское федеральное государство!"
  UFRA_communal_army:0 "Коммунальная армия"
  UFRA_communal_army_desc:0 "Братство по оружию в нашей борьбе! Во имя победы всех трудящихся!"
  UFRA_regiment_normandie:0 "Полк «Нормандия»"
  UFRA_regiment_normandie_desc:0 "Полк «Нормандия»"
  UFRA_political_commissars:0 "Политические комиссары"
  UFRA_political_commissars_desc:0 "Политические комиссары"
  UFRA_state_atheism:0 "Государственный атеизм"
  UFRA_state_atheism_desc:0 "Нет Бога, нет хозяев. Только люди могут найти счастье и помогать друг другу. Ни один культ никогда больше не будет править Францией!"
  UFRA_further_dockyard_expension:0 "Расширение верфи"
  UFRA_further_dockyard_expension_desc:0 "Расширение верфи"
  UFRA_operation_guillaume_le_conquerant:0 "Операция «Гийом Завоеватель»"
  UFRA_operation_guillaume_le_conquerant_desc:0 "Операция Guillaume Le Conquerant"
  UFRA_war_games:0 "Военные игры"
  UFRA_war_games_desc:0 "Немцы восстанавливают военный потенциал и нарушают Версальский договор. Настало время подготовиться к грядущему! Будут проводиться военные маневры на границе Германии и Бельгии!"
  UFRA_ils_ne_passeront_pas:0 "Ils Ne Passeront Pas"
  UFRA_ils_ne_passeront_pas_desc:0 "Ils ne passeront pas был боевым кличем в битве при Вердене. Мы уже один раз остановили захватчиков, и мы сделаем это снова!"
  UFRA_rebuild_the_spanish_fleet:0 "Перестройте испанский флот"
  UFRA_rebuild_the_spanish_fleet_desc:0 "Испания когда-то была величайшей империей в мире, а испанский флот внушал ужас! Мы восстановим славу этого флота!"
  UFRA_hydroelectricity:0 "Гидроэлектроэнергетика"
  UFRA_hydroelectricity_desc:0 "Благодаря нашим многочисленным горным хребтам, Франция особенно подходит для выработки электроэнергии с помощью плотин. Эта гидроэлектроэнергия будет полезна нам, особенно потому, что она возобновляемая."
  UFRA_heavy_water:0 "Производство тяжелой воды"
  UFRA_heavy_water_desc:0 "Тяжелая вода, которая встречается в природе, может быть выделена электролизом. Она служит в качестве замедлителя в ядерных реакторах и помогает в создании плутония, необходимого для производства атомных бомб. Наши плотины идеально подходят для этой задачи, поскольку они обеспечивают водой и электричеством, необходимыми для электролиза."
  UFRA_send_aid_to_spain:0 "Отправить помощь Испании"
  UFRA_send_aid_to_spain_desc:0 "Испания остро нуждается в поставках, чтобы остановить милиции и сопротивление на своей территории. Мы пришлем помощь нашей сестре-королеве."
  UFRA_assassinate_mussolini:0 "Убить Муссолини"
  UFRA_assassinate_mussolini_desc:0 "Муссолини — безумец и поджигатель войны. То, что нужно Италии, — это возвращение к старому порядку. Ему нужен король."
  UFRA_prepare_italian_coup:0 "Подготовить государственный переворот в Италии"
  UFRA_prepare_italian_coup_desc:0 ""
  UFRA_heirs_of_the_french_revolution:0 "Наследники Французской революции"
  UFRA_heirs_of_the_french_revolution_desc:0 "Ни одна другая партия не может претендовать на роль наследника Французской революции, кроме нас. За дело, граждане, настал день славы!"
  UFRA_jaccobinisme:0 "Якобинизм"
  UFRA_jaccobinisme_desc:0 "Франция — уникальная и единая нация. Ни один регион не должен получать особых привилегий. Единство — наша сила."
  UFRA_regionalisme:0 "Регионализм"
  UFRA_regionalisme_desc:0 "Каждый регион заслуживает того, чтобы сохранить свою собственную самобытность. Каждый регион имеет право принимать собственные решения. И так будет во Франции отныне."
  UFRA_socialist_anti_colonial_commitee:0 "Социалистический антиколониальный комитет"
  UFRA_socialist_anti_colonial_commitee_desc:0 "Империализм — чума, от которой следует избавиться. У людей есть право на самоопределение."
  UFRA_factory_towns:0 "Промышленные города"
  UFRA_factory_towns_desc:0 ""
  UFRA_european_revolution:0 "Освободите наших соседей"
  UFRA_european_revolution_desc:0 ""
  UFRA_west_european_union_of_socialists_republics:0 "Западно-Европейский Союз Социалистических Республик"
  UFRA_west_european_union_of_socialists_republics_desc:0 "Теперь, когда мы достигли Пролетарской революции в Европе, мы должны организоваться, подобно нашим восточным братьям, в Союз республик."
  UFRA_marxism_leninism:0 "Марксизм-ленинизм"
  UFRA_marxism_leninism_desc:0 "Мы признаём только самую верную форму коммунизма. Ту, что разработали Ленин и Маркс."
  UFRA_provide_for_the_people:0 "Обеспечить народ"
  UFRA_provide_for_the_people_desc:0 ""
  UFRA_syndicalism:0 "Синдикализм"
  UFRA_syndicalism_desc:0 "Синдикализм — радикальная экономическая теория в рабочем движении. Основная идея синдикализма — создание местных рабочих организаций и отстаивание требований и прав трудящихся путём проведения забастовок. ВТО является главным представителем этого движения во Франции."
  UFRA_collectivization:0 "Коллективизация"
  UFRA_collectivization_desc:0 ""
  UFRA_world_revolution:0 "Мировая революция"
  UFRA_world_revolution_desc:0 ""
  UFRA_anti_nazi_anti_soviet:0 "Ни нацизм, ни советская власть"
  UFRA_anti_nazi_anti_soviet_desc:0 "И советская, и нацистская идеологии отвратительны и ненавистны. Франция должна возглавить борьбу с этими заразами."
  UFRA_croix_de_feux:0 "Круа-де-Фё"
  UFRA_croix_de_feux_desc:0 "Croix-de-Feu - прежде всего, объединение ветеранов Первой мировой войны - тех, кто был награжден Военным крестом 1914-1918 гг. С приходом к руководству подполковника Франсуа де Ла Рока в 1930 году движение стало выступать за проведение военных мероприятий против германской угрозы, а также поддерживать корпоративизм и союз капитала и труда."
  UFRA_latin_heritage:0 "Развивать латинское наследие"
  UFRA_latin_heritage_desc:0 "Франция прежде всего является латинской страной. Поэтому мы должны улучшить наши отношения с Италией и Муссолини."
  UFRA_honneur_et_traditions:0 "Почет и традиции"
  UFRA_honneur_et_traditions_desc:0 "Честь и традиции - вот наше римское наследство. Эти ценности горят в сердцах всех французских мужчин и женщин."
  UFRA_german_military_exchange:0 "Германский военный обмен"
  UFRA_german_military_exchange_desc:0 "Германия в совершенстве овладела военным искусством, и она является истинным наследником Прусского королевства. Вместе мы сможем многому научиться и сделаем наши армии непобедимыми."
  UFRA_soviet_industrial_aid:0 "Советская индустриальная помощь"
  UFRA_soviet_industrial_aid_desc:0 ""
  UFRA_second_paris_renovation:0 "Вторая реновация Парижа"
  UFRA_second_paris_renovation_desc:0 "Наше недавно обеспеченное экономическое процветание должно быть отражено в нашей столице. Мы сделаем Париж величайшим городом Европы. Такой реконструкции не было со времен Османна и Наполеона III."
  UFRA_the_new_worl_order:0 "Новый мировой порядок"
  UFRA_the_new_worl_order_desc:0 "С помощью наших союзников мы построим Новый Мир. Ничто не остановит новую Европу. Vive la France!"
  UFRA_emulate_napoleon_i:0 "Воплотить образ Наполеона I"
  UFRA_emulate_napoleon_i_desc:0 "Великая империя нуждается в сильном лидере. Мне нужно черпать вдохновение у величайшего француза, когда-либо жившего."
  UFRA_emulate_napoleon_iii:0 "Либеральная империя"
  UFRA_emulate_napoleon_iii_desc:0 "Подобно моему великому предку, Наполеону III, я буду современным и либеральным императором."
  UFRA_real_politik:0 "Реалполитик"
  UFRA_real_politik_desc:0 "Реалполитик"
  UFRA_protect_workers:0 "Защитить рабочий класс"
  UFRA_protect_workers_desc:0 "Защитить рабочий класс"
  UFRA_cooperation_with_italy:0 "Сотрудничество с Италией"
  UFRA_cooperation_with_italy_desc:0 "Сотрудничество с Италией"
  UFRA_celtic_paganism:0 "Мистицизм"
  UFRA_celtic_paganism_desc:0 "Теперь, когда Франция находится под нашим контролем, нам нужно устранить упадок и остановить моральное разложение. Мы будем проповедовать возвращение к старым богам. К религии кельтов, галльского народа, наших предков. Тутатис, Эзус и Таран."
  UFRA_classicism:0 "Классицизм"
  UFRA_classicism_desc:0 "Классицизм — самая европейская и самая благородная форма искусства. Он вдохновляет наш народ. Наш режим будет спонсировать и поощрять классицизм."
  UFRA_state_catholism_2:0 "Получить поддержку от духовенства"
  UFRA_state_catholism_2_desc:0 "Наши идеалы глубоко христианские и разделяются многими людьми во французском католическом духовенстве."
  UFRA_aids_for_families:0 "Помощь семьям"
  UFRA_aids_for_families_desc:0 "Семьи — это основа нации. Помощь обеспечит сильные семьи и побудит родителей заводить больше детей."
  UFRA_control_newspapers:0 "Контроль над газетами"
  UFRA_control_newspapers_desc:0 "Газеты во Франции испорчены и настроены против Франции, за исключением нескольких. Отныне будут издаваться только одобренные правительством журналы."
  UFRA_give_full_powers:0 "Дать полные полномочия"
  UFRA_give_full_powers_desc:0 "Пришел момент. Это наш единственный шанс спасти Францию. Давайте воспользуемся им и возьмем под контроль!"
  UFRA_new_national_holiday_1:0 "Изменить дату Национального дня"
  UFRA_new_national_holiday_1_desc:0 ""
  UFRA_new_national_holiday:0 "Изменить дату Национального дня"
  UFRA_new_national_holiday_desc:0 ""
  UFRA_crush_political_dissent:0 "Подавить политическое инакомыслие"
  UFRA_crush_political_dissent_desc:0 "Мы у власти, но многие таятся в тени, ожидая проявления нами любой слабости. Мы не дадим им шанса."
  UFRA_dismiss_af:0 "Уволить AF"
  UFRA_dismiss_af_desc:0 "Хотя и полезное, Action Francaise просто не имеет тех же целей, что и мы. Наше партнерство заканчивается здесь."
  UFRA_work_with_af:0 "Продолжить сотрудничество с AF"
  UFRA_work_with_af_desc:0 "Наш альянс с Action Francais был плодотворным. Идеи Морраса – способ спасти Францию."
  UFRA_royal_dictatorship:0 "Королевская диктатура"
  UFRA_royal_dictatorship_desc:0 "Королевская диктатура"
  UFRA_local_democratie:0 "Местная демократия"
  UFRA_local_democratie:0 "Идея Морраса – децентрализовать государство, позволить регионам работать в автономии с местными парламентами во главе с доброжелательным королем."
  UFRA_king_jean_urbanisation_program:0 "Программа урбанизации короля Жана"
  UFRA_king_jean_urbanisation_program_desc:0 "Программа урбанизации короля Жана"
  UFRA_kings_arsenal:0 "Королевский арсенал"
  UFRA_kings_arsenal_desc:0 "Королевский арсенал"
  UFRA_kings_grant:0 "Королевский грант"
  UFRA_kings_grant_desc:0 "Королевский грант"
  UFRA_republic_lives:0 "Побеждает демократия"
  UFRA_republic_lives_desc:0 "Побеждает демократия"
  UFRA_economic_policies:0 "Экономическая политика"
  UFRA_economic_policies_desc:0 "Франция нуждается в экономическом руководстве. Это решающее время для экономики. Наш выбор определит наше будущее."
  UFRA_third_position:0 "Третий путь"
  UFRA_third_position_desc:0 "Третий путь"
  UFRA_left:0 "Социалистическая политика"
  UFRA_left_desc:0 "Социалистическая политика"
  UFRA_right:0 "Капиталистическая политика"
  UFRA_right_desc:0 "Капиталистическая политика"
  UFRA_free_market:0 "Свободный рынок"
  UFRA_free_market_desc:0 "Свободный рынок"
  UFRA_economic_freedom:0 "Экономическая свобода"
  UFRA_economic_freedom_desc:0 "Экономическая свобода"
  UFRA_natural_inequalities:0 "Классовое сотрудничество"
  UFRA_natural_inequalities_desc:0 "Сотрудничество классов"
  UFRA_open_to_the_world:0 "Французское дипломатическое направление"
  UFRA_open_to_the_world_desc:0 "Французское дипломатическое направление"
  UFRA_mend_the_christian_schism:0 "Излечение раскола"
  UFRA_mend_the_christian_schism_desc:0 "После падения Западной Римской империи Восточная и Западная церкви находились в конфликте. Настало время исцеления."
  UFRA_foreign_policy:0 "Петух в мире"
  UFRA_foreign_policy_desc:0 "Петух в мире"
  UFRA_diplomatic_ussr:0 "Дипломатическая миссия в СССР"
  UFRA_diplomatic_ussr_desc:0 "Дипломатическая миссия в СССР"
  UFRA_eastern_policy:0 "Восточная политика"
  UFRA_eastern_policy_desc:0 "Франция всегда была глубоко вовлечена в дипломатию с Китаем. Восточный Дракон в упадке, и Япония проявляет интерес к нашим территориям в Тихом океане. Мы должны действовать быстро."
  UFRA_support_china:0 "Дипломатическая миссия в Китай"
  UFRA_support_china_desc:0 "Дипломатическая миссия в Китай"
  UFRA_invest_in_china:0 "Инвестиции в Китай"
  UFRA_invest_in_china_desc:0 "Чан Кайши - истинный и законный лидер Китая. Поэтому мы сосредоточим нашу политику на оказании ему помощи."
  UFRA_communist_china:0 "Дипломатическая миссия в коммунистический Китай"
  UFRA_communist_china_desc:0 "Дипломатическая миссия в коммунистический Китай"
  UFRA_send_weapons_to_mao:0 "Отправить оружие Мао"
  UFRA_send_weapons_to_mao_desc:0 "Ставки на коммунистов и Мао - это рискованный шаг, но, возможно, он окупится."
  UFRA_non_aggression_japan:0 "Дипломатическая миссия в Японию"
  UFRA_non_aggression_japan_desc:0 "Дипломатическая миссия в Японию"
  UFRA_sign_treaty:0 "Договор о ненападении с Японией"
  UFRA_sign_treaty_desc:0 "Мы должны сосредоточиться на умиротворении Японии и дать им свободно действовать в Тихом океане, если они не будут вмешиваться в наши территории."
  UFRA_invite_to_faction:0 "Дальнейшие отношения"
  UFRA_invite_to_faction_desc:0 "Дальнейшие отношения"
  UFRA_post_war_reconstruction:0 "Послевоенное восстановление"
  UFRA_post_war_reconstruction_desc:0 "Послевоенное восстановление"
  UFRA_future_of_republic:0 "Будущее республики"
  UFRA_future_of_republic_desc:0 "Будущее республики"
  UFRA_modify_the_constitution:0 "Выживание третьей республики"
  UFRA_modify_the_constitution_desc:0 "Третья республика пережила бурю. Наши враги побеждены."
  UFRA_the_fourth_republic:0 "Четвертая республика"
  UFRA_the_fourth_republic_desc:0 "Третья республика погибла и настало время восстановить новую республику."
  UFRA_degaule_presidency:0 "Президентство де Голля"
  UFRA_degaule_presidency_desc:0 "Президентство де Голля"
  UFRA_national_television0:0 "Основание ORTF"
  UFRA_national_television0_desc:0 "Наличие телевизионных каналов позволит нам показывать только то, что нужно видеть людям"
  UFRA_trial_of_collaborators:0 "Суд над коллаборационистами"
  UFRA_trial_of_collaborators_desc:0 "Коллаборационисты предали республику и Францию. Лаваль, Петен, Дарнан, Браззиллак... Мы сделаем из них пример."
  UFRA_marshall_plan:0 "План Маршалла"
  UFRA_marshall_plan_desc:0 "План Маршалла"
  UFRA_gladius:0 "Операция \"Гладио\""
  UFRA_gladius_desc:0 "Операция \"Гладио\" — это кодовое название секретных операций «спящих» агентов вооруженного сопротивления, предложенных США на случай возможного вторжения Варшавского договора и завоевания Европы."
  UFRA_purge_communist_rot:0 "Очистить от коммунистической заразы"
  UFRA_purge_communist_rot_desc:0 "Очистить от коммунистической заразы"
  UFRA_the_af_wins:0 "Союз «Французское действие»"
  UFRA_the_af_wins_desc:0 "Союз «Французское действие»"
  UFRA_nationalism:0 "Французский национализм"
  UFRA_nationalism_desc:0 "Французский национализм уникален. Он зародился во время Столетней войны с Англией и укрепился во время революции. Но его следует принять во всех аспектах жизни и общества, чтобы спасти Францию."
  UFRA_the_split_switzerland:0 "Ультиматум Швейцарии"
  UFRA_the_split_switzerland_desc:0 "Швейцария"
  UFRA_parliamentary_republic:0 "Парламентская республика"
  UFRA_parliamentary_republic_desc:0 ""
  UFRA_reinforce_presidential_role:0 "Усиление роли президента"
  UFRA_reinforce_presidential_role_desc:0 ""
  UFRA_devalue_the_franc:0 "Девальвация франка"
  UFRA_devalue_the_franc_desc:1 "В то время как другие страны позволяли своим валютам обесцениваться, чтобы помочь своей экономике, мы стойко отказывались поступать так. В результате, наша экономика отстает от других. Если мы хотим стать более конкурентоспособными и пережить надвигающуюся бурю, мы не должны сбрасывать со счетов девальвацию нашей валюты, даже если это окажется непопулярной мерой."
  UFRA_autoroutes:0 "Автомагистрали"
  UFRA_autoroutes_desc:0 "Немцы поразили мир своей концепцией ограниченного доступа, высокоскоростными дорогами, соединяющими различные части своей страны. Мы можем показать миру, что можем сделать это так же хорошо."
  UFRA_invest_in_the_metropole:1 "Развитие метрополии"
  UFRA_invest_in_the_metropole_desc:0 "Наш первый шаг в восстановлении нашей промышленности должен заключаться в улучшении нашей промышленной базы в наших континентальных владениях."
  UFRA_invest_in_the_colonies:1 "Развитие колоний"
  UFRA_invest_in_the_colonies_desc:0 "Наши промышленные центры в Европе не имеют населения и ресурсов для поддержки крупного промышленного расширения. Если наша экономика должна конкурировать с остальным миром, мы должны использовать наши колонии."
  UFRA_colonial_industry_effect_tt:2 "Добавляет один §Yзавод гражданского производства§! в каждое колониальное государство, в которое ранее инвестировали.\n"
  UFRA_industrial_expansion_effect_tt:1 "Добавляет один §Yзавод гражданского производства§! в столичные государства, в которые ранее инвестировали.\n"
  UFRA_industrial_expansion_effect_alt_tt:0 "Добавляет два §Yгражданских завода§! в ранее финансируемые метрополии.\n"
  UFRA_military_factories_effect_tt:1 "Добавляет один §Yвоенный завод§! в каждый ранее финансируемый штат.\n"
  french_random_resources_add_tt:0 "Добавляет один §Gресурс§! в этот штат."
  UFRA_invest_in_west_africa:0 "Инвестировать в Западную Африку"
  UFRA_invest_in_west_africa_desc:0 "Огромные запасы рабочей силы и ресурсов в Западной Африке делают ее идеальным кандидатом для инвестиций."
  UFRA_invest_in_indochina:0 "Инвестировать в Индокитай"
  UFRA_invest_in_indochina_desc:0 "Большое расстояние между нашими владениями в Индокитае и нашим центром может показаться недостатком, но оно также защищает любую отрасль промышленности от нападения врага."
  UFRA_invest_in_syria:0 "Инвестировать в Сирию"
  UFRA_invest_in_syria_desc:0 "Сирия идеально расположена, чтобы снабжать нас в случае войны в Европе или Африке. Улучшение ее промышленного потенциала также поддержит наши позиции в этом районе."
  UFRA_global_integration:0 "Глобальная интеграция"
  UFRA_global_integration_desc:0 "Британская империя - это тонко настроенная система взаимоподдерживающих частей. Ничто не говорит о том, что мы не сможем сделать то же самое с нашими колониями."
  UFRA_begin_rearmament:0 "Начать перевооружение"
  UFRA_begin_rearmament_desc:1 "20-летнее перемирие, предсказанное маршалом Фошем в 1919 году, быстро подходит к концу, и мир, как представляется, все более вероятно вступит в войну в ближайшие несколько лет. Мы должны быть готовы."
  UFRA_firepower_kills:0 "Нанесение урона с помощью огневой мощи"
  UFRA_firepower_kills_desc:0 "Уроки Великой войны были просты и безжалостны: эпоха, когда люди сражались друг с другом, видя противника, закончилась. Теперь убийства совершаются массово при помощи самого современного оружия на большом расстоянии."
  UFRA_methodical_battle:0 "Методичное сражение"
  UFRA_methodical_battle_desc:0 "Некоторые утверждают, что битва — это хаос, но это неправда. Битва — это всего лишь методичное применение нужных орудий на основе общего плана. Планируйте тщательно, и намерения врага могут так же быстро превратиться в историческую сноску."
  UFRA_division_cuirassee:0 "Бронетанковая дивизия"
  UFRA_division_cuirassee_desc:0 "Предприимчивый офицер по имени Де Голль предложил создать новый тип дивизии, объединяющий тяжелую бронетехнику, пехоту и средние танки, чтобы сражаться как единое целое."
  UFRA_infantry_tanks:0 "Пехотные танки"
  UFRA_infantry_tanks_desc:0 "Какими бы ни были танки, их первая и последняя обязанность — позволить пехоте захватить и удержать территорию. Поэтому мы всегда должны оснащать наши пехотные подразделения современными и эффективными танками."
  UFRA_special_forces:0 "Спецназ"
  UFRA_special_forces_desc:0 "В будущем война будет все чаще вестись в районах, где обычный пехотинец окажется беспомощным. Мы должны создать новые и более эффективные подразделения, которые смогут действовать в таких условиях."
  UFRA_fusiliers_marine:1 "Морские фузилеры"
  UFRA_fusiliers_marine_desc:0 "Дни непроницаемой прибрежной обороны сочтены. В будущем мы должны быть готовы к отражению любых вторжений, а также к захвату плацдармов, даже перед лицом превосходящего противника."
  UFRA_battle_of_maneuver:0 "Маневренная война"
  UFRA_battle_of_maneuver_desc:0 "Устаревшие представления о поле боя как о небольшом участке, где армии сходятся врукопашную, изжили себя. Благодаря массовой моторизации, авиации и быстрой радиосвязи теперь бои разворачиваются на сотнях километров. Чем быстрее мы к этому подготовимся, тем лучше."
  UFRA_air_dominance:0 "Воздушное превосходство"
  UFRA_air_dominance_desc:0 "Развитие авиации открыло для армий новый фронт. Чтобы избежать катастрофы, нам нужно обезопасить его."
  UFRA_air_ground_cooperation:0 "Взаимодействие авиации и сухопутных войск"
  UFRA_air_ground_cooperation_desc:0 "Военные действия в воздухе приносят пользу только тогда, когда они поддерживают цели наземных войск. Чем лучше мы будем координировать боевые действия в воздухе и на земле, тем эффективнее станут наши войска."
  UFRA_flying_artillery:0 "Летающая артиллерия"
  UFRA_flying_artillery_desc:0 "В современных быстротечных боях наземная артиллерия не всегда успевает за наступающими войсками. Ее роль могут взять на себя самолеты-бомбардировщики."
  UFRA_radicalise_the_popular_front:0 "Радикализация Народного фронта"
  UFRA_radicalise_the_popular_front_desc:1 "С ростом фашизма в Германии и Италии стало очевидно, что внутренние разногласия на левом фланге должны прекратиться, если мы хотим выжить. Широкий народный фронт, состоящий из всех партий слева, получит народный мандат на окончательное решение экономических проблем, порождающих фашизм."
  UFRA_ban_communism:0 "Запрет коммунизма"
  UFRA_ban_communism_desc:0 "В то время как немыслимо, что кто-то всерьез захочет увидеть хаос и кровопролитие коммунистической революции в своей собственной стране, похоже, что среди нас есть те, кто именно так и поступит. Мы не можем больше позволить им замышлять против государства. Должны быть приняты самые жесткие меры."
  UFRA_invite_communist_ministers:0 "Приглашение министров-коммунистов"
  UFRA_invite_communist_ministers_desc:0 "Страх перед ответной реакцией радикальных правых помешал включению коммунистов в фактическое правительство. Но страх - плохой советник. Если нам предстоит этот конфликт, пусть придут и они."
  UFRA_strengthen_the_unions:0 "Укрепить профсоюзы"
  UFRA_strengthen_the_unions_desc:0 "Слишком долго право отдельных рабочих объединяться со своими товарищами для коллективных переговоров оставалось открытым для нападок. Больше нет."
  UFRA_celebrate_the_commune:0 "Отпраздновать коммуну"
  UFRA_celebrate_the_commune_desc:0 "Хотя она была недолгой, Парижская коммуна была первой попыткой создать коммунистическое общество на французской земле."
  UFRA_womens_suffrage:0 "Голосование для женщин"
  UFRA_womens_suffrage_desc:1 "Это столь же абсурдно, как и постыдно: трудолюбивым женщинам Франции, которые неоднократно сражались на баррикадах, чтобы добиться своих прав, не разрешено голосовать на выборах. Мы искореним эту несправедливость."
  UFRA_legal_equality:0 "Юридическое равноправие"
  UFRA_legal_equality_desc:0 "Во всех отношениях, которые имеют значение, женщины по-прежнему считаются гражданами второго сорта, всегда подчиняющимися воле мужчины. Этому нонсенсу положен конец."
  UFRA_industrial_collectivization:0 "Индустриальная коллективизация"
  UFRA_industrial_collectivization_desc:1 "Нынешняя французская экономика состоит из крошечных компаний с небольшим количеством сотрудников, которые постоянно конкурируют друг с другом и высасывают ресурсы в неэффективном мелкомасштабном производстве. Мы объединим эти небольшие компании, чтобы наконец создать компании, которые смогут конкурировать на мировой арене."
  UFRA_agricultural_collectivization:0 "Сельскохозяйственная коллективизация"
  UFRA_agricultural_collectivization_desc:0 "То, что относится к промышленности, в той же мере относится и к фермерам по всей Франции. Маленькие фермы не могут позволить себе современное оборудование и работают так же, как и их прадеды. Объединив их в сельскохозяйственные производственные единицы, мы повысим эффективность и производительность."
  UFRA_force_the_issue:0 "Навязывание вопроса"
  UFRA_force_the_issue_desc:1 "Мы прошли долгий путь с тех пор, как основали Народный фронт. Но мы не можем оставить свою работу наполовину выполненной. Для всех левых пришло время сделать выбор и занять позицию — или с революцией, или против нее."
  UFRA_force_the_issue_tt:0 "Штраф к стабильности зависит от популярности §Yдемократических§! партий."
  UFRA_reconciliation:0 "Примирение"
  UFRA_reconciliation_desc:0 "В прошлом Французские революции слишком часто бросали страну в бесконечные судороги революционного и контрреволюционного террора. Возможно, пришло время построить республику, в которой у каждого есть свое место, независимо от того, поддерживали они революцию или нет."
  UFRA_constitutional_convention:0 "Конституционный конвент"
  UFRA_constitutional_convention_desc:0 "Фундаментальное изменение в характере нашей республики невозможно сделать в одночасье, и оно невозможно без переговоров о новой конституции."
  UFRA_anti_fascist_coalition:0 "Антифашистская коалиция"
  UFRA_anti_fascist_coalition_desc:0 "Самая большая угроза прогрессу — это распространение реакционного фашизма. Мы должны стоять с каждой страной, которая готова бороться с этой угрозой, иначе не будет завтра для кого-либо из нас."
  UFRA_invite_anti_fascist_emigrants:0 "Пригласить антифашистских иммигрантов"
  UFRA_invite_anti_fascist_emigrants_desc:1 "Первым делом любой фашистский режим старается изгнать своих критиков и тех, кто может предложить альтернативное видение государственного устройства. Однако эти люди идеально подходят для организации правительства в изгнании и подготовки к дню освобождения своей страны."
  UFRA_reconnect_to_the_balkans:0 "Восстановить связи с Балканами"
  UFRA_reconnect_to_the_balkans_desc:0 "Франция давно стремится уравновесить силы в Центральной Европе, устанавливая связи со странами Балкан. Эта связь сохраняется и поныне, даже несмотря на то, что в последнее время она несколько ослабла."
  UFRA_pre_empt_the_fascist_attack:0 "Превентивный удар по фашистам"
  UFRA_pre_empt_the_fascist_attack_desc:0 "Зачем ждать, пока противник подготовится и выберет подходящий для него момент для неизбежного нападения? Мы нанесем удар первыми и разгромим эту угрозу, пока у нее не будет возможности собраться с силами."
  UFRA_loyalty_to_moscow:0 "Верность Москве"
  UFRA_loyalty_to_moscow_desc:0 "Социалистическая модель, реализуемая в Советском Союзе, возможно, не идеальна, но нет никаких сомнений в том, что именно в СССР достигнута наибольшая степень воплощения социалистических идей. Было бы глупо пытаться искать собственный путь."
  UFRA_league_of_french_bolshevist_volunteers:0 "Лига французских большевиков-добровольцев"
  UFRA_league_of_french_bolshevist_volunteers_desc:1 "Когда одна социалистическая страна подвергается угрозе со стороны иностранного захватчика, под угрозой находятся все социалистические страны. Мы не должны сидеть сложа руки, пока наши товарищи борются за свою жизнь."
  UFRA_host_the_german_exiles:0 "Принять немецких изгнанников"
  UFRA_host_the_german_exiles_desc:0 "Германия, родина Маркса и Энгельса, когда-то была в авангарде коммунистической мысли и практики. Многие немецкие коммунисты бежали, когда нацисты пришли к власти. Если мы дадим им дом, они помогут нам организовать более эффективное управление освобожденными территориями."
  UFRA_revolution_to_the_utmost:0 "Революция до упора"
  UFRA_revolution_to_the_utmost_desc:0 "Революция, завершенная наполовину, не является революцией вообще. Мы не должны останавливаться, пока дело не будет сделано, а новая политическая система не будет в безопасности. Какой бы ни была цена."
  UFRA_national_television:0 "Национализация телеканалов"
  UFRA_national_television_desc:0 "Наличие телеканалов в нашем распоряжении позволит нам показывать только то, что нужно видеть людям"
  UFRA_destroy_the_counter_revolution:0 "Уничтожить контрреволюцию"
  UFRA_destroy_the_counter_revolution_desc:0 "Даже сейчас некоторые люди во Франции готовятся вонзить кинжал в спину своему народу, когда он проявит хоть секунду слабости. Мы этого не допустим и ударим первыми."
  UFRA_revolutionary_zeal:0 "Революционное рвение"
  UFRA_revolutionary_zeal_desc:1 "Французский народ всегда питал особый пыл к уничтожению старого порядка и созданию нового. Это не должно обескураживать."
  UFRA_loyalty_to_the_cause:0 "Верность Делу"
  UFRA_loyalty_to_the_cause_desc:1 "Другие страны могут формулировать собственные взгляды на коммунизм, но нет никаких причин, по которым мы должны идти на компромисс в отношении наших взглядов. Они могут остановиться на полпути, одолеваемые сомнениями, оправдывает ли цель средства. Мы не остановимся."
  UFRA_carry_the_revolution_north:0 "Несите Революцию на Север"
  UFRA_carry_the_revolution_north_desc:0 "За Ла-Маншем находится родина промышленной революции, а вместе с ней и родина современного капитализма. Мы не можем позволить этому месту стать плацдармом для контрреволюционного врага."
  UFRA_carry_the_revolution_west:0 "Несите Революцию на Запад"
  UFRA_carry_the_revolution_west_desc:1 "Режим на Пиренейском полуострове держится на волоске, готовый быть смещенным народной революцией. Мы перережем этот волосок."
  UFRA_carry_the_revolution_east:0 "Несите Революцию на Восток"
  UFRA_carry_the_revolution_east_desc:0 "На нашей восточной границе находится самая большая угроза нашему новому порядку. Реакционные силы, собравшиеся там, ударят, когда мы сможем меньше всего себе это позволить - но только если мы дадим им время подготовиться."
  UFRA_carry_the_revolution_south:0 "Несите Революцию на Юг"
  UFRA_carry_the_revolution_south_desc:0 "Первой страной, павшей под ударами фашизма, стала Италия. Фашистская идеология прочно окопалась на Апеннинах. Такое положение дел совершенно неприемлемо, так как наша идеология в корне ей противоречит. Фашисты прекрасно это понимают и будут всеми силами стремиться к экспансии. Нам нужно их опередить."
  UFRA_egalite_liberte_solidarite:0 "Свобода, Равенство, Братство"
  UFRA_egalite_liberte_solidarite_desc:1 "Великая французская революция перевернула мир, сметая многовековые порядки и навсегда изменив облик Европы. Мы должны завершить начатое предками."
  UFRA_reform_the_labour_laws:0 "Реформа трудового законодательства"
  UFRA_reform_the_labour_laws_desc:0 "Французские рабочие трудяться в ужасных условиях, за гроши и без каких-либо гарантий. Необходимо срочно принять всеобъемлющий пакет реформ, дабы облегчить их участь."
  UFRA_nationalize_key_industry:0 "Национализация ключевых отраслей"
  UFRA_nationalize_key_industry_desc:0 "В сложившихся условиях мы должны смело взяться за коренную перестройку экономики, дабы суметь ответить на вызовы времени. Времени на раскачку нет - нельзя уповать, что рынок сам решит все проблемы."
  UFRA_reorganize_the_aviation_industry:0 "Реорганизация авиационной промышленности"
  UFRA_reorganize_the_aviation_industry_desc:0 "Разбитая на десятки мелких контор французская авиапромышленность отстает от немецкой и американской на десятилетия. Необходима срочная и серьезная реорганизация."
  UFRA_form_the_state_arsenals:0 "Создание государственных арсеналов"
  UFRA_form_the_state_arsenals_desc:0 "Чтобы снабдить нашу армию современным оружием, мы не можем ждать, пока частные компании разовьют необходимые производственные мощности."
  UFRA_general_work_council:0 "Общий трудовой совет"
  UFRA_general_work_council_desc:0 "Мы создадим национальное агентство по рассмотрению споров между работодателями и работниками и обеспечению наиболее эффективного использования наших рабочих."
  UFRA_national_champions:0 "Национальные чемпионы"
  UFRA_national_champions_desc:0 "Выбрав несколько компаний, которые имеют потенциал для конкуренции на мировом уровне, и поддерживая их на высшем уровне, мы можем создать современную экономику, равную любой другой."
  UFRA_dirigisme:0 "Государственное регулирование"
  UFRA_dirigisme_desc:0 "Хотя тотально спланированная экономика по советскому образцу явно является чрезмерной мерой, для оптимизации нашей экономики необходима определенная степень планирования и руководства."
  UFRA_ban_the_leagues:0 "Запретить оппонентов"
  UFRA_ban_the_leagues_desc:0 "Крайне правым лигам было разрешено организовываться бесконтрольно. Хотя в настоящее время они слишком слабы, чтобы попытаться совершить переворот, неизвестно, что они смогут сделать в будущем. Лучше всего распустить их сейчас."
  UFRA_the_blum_viollette_proposal:0 "Предложение Блюм-Виолетты"
  UFRA_the_blum_viollette_proposal_desc:1 "Гражданство Французской Республики должно быть открыто для всех, кто его заслуживает. Многие из наших лояльных подданных в Алжире хотели бы стать полноправными гражданами, но пока не имеют на это права. Сделав их полноправными гражданами, мы теснее свяжем Алжир с Францией."
  UFRA_expand_the_citizenship:0 "Расширение гражданства"
  UFRA_expand_the_citizenship_desc:0 "Нетерпимо, чтобы республика, на территории которой проживают люди, не допускала их к гражданству. Необходимо немедленно исправить это положение."
  UFRA_france_undividable:0 "Неделимая Франция"
  UFRA_france_undividable_desc:0 "Франция должна быть единым целым под одним флагом. Пора признать это открыто, хотя бы для того, чтобы развеять опасения о разделе."
  UFRA_french_union:0 "Французский союз"
  UFRA_french_union_desc:0 "Пора провозгласить новую Францию, которая охватит весь мир и объединит все части нашего царства. Мы проведем референдумы во всех частях, чтобы подтвердить волю народа стать частью этой новой, великой Франции."
  UFRA_french_union_tt:0 "Будут проведены референдумы в различных частях нашей колониальной империи. Некоторые части могут вместо этого выбрать полную независимость."
  UFRA_encourage_immigration:0 "Поощрение иммиграции"
  UFRA_encourage_immigration_desc:1 "Наша родина остро нуждается в рабочих, чтобы восполнить потери, понесенные в Великой войне. Обнаружив простую возможность поселиться во Франции, мы можем привлечь квалифицированных иммигрантов, которые смогут восполнить этот недостаток."
  UFRA_review_foreign_policy:0 "Пересмотр внешней политики"
  UFRA_review_foreign_policy_desc:0 "Континентальный порядок, установленный в 1919 году, выглядит все более шатким. Пришло время пересмотреть наши внешнеполитические варианты, чтобы обеспечить новые союзы и переждать надвигающийся шторм."
  UFRA_intervention_in_spain:0 "Вмешательство в Испанию"
  UFRA_intervention_in_spain_desc:0 "Гражданская война в Испании принесла столкновение идеологий к нашему порогу. Мы должны действовать осторожно, чтобы конфликт не перекинулся на нашу страну."
  UFRA_support_the_finns:0 "Поддержка Финнов"
  UFRA_support_the_finns_desc:0 "Финны борются за свои жизни. Мы должны им помочь."
  UFRA_take_norwegian_water:0 "Получить Норвежскую тяжелую воду"
  UFRA_take_norwegian_water_desc:0 "Тяжелая вода является важнейшим элементом для контроля радиоактивных элементов в ядерном реакторе, но тяжелая вода должна быть изолирована от обычной воды, чтобы она была пригодна для использования. Лишь немногие заводы способны выделить тяжелую воду, и почти весь мировой запас производится на заводе в Норвегии. Мы должны захватить всю эту воду, чтобы использовать в исследованиях, а также чтобы помешать нашим врагам получить к ней доступ."
  UFRA_confirm_eastern_commitments:0 "Подтверждение восточных обязательств"
  UFRA_confirm_eastern_commitments_desc:0 "После Великой войны мы создали сеть альянсов в Восточной Европе как противовес возрождающейся Германии и экспансионистскому Советскому Союзу. Наши союзники в регионе сейчас задаются вопросом, действительно ли мы придем к ним на помощь, если нас об этом попросят. Мы должны их успокоить, прежде чем они решат обратиться за помощью в другое место."
  UFRA_strengthen_the_little_entente:0 "Укрепить Малую Антанту"
  UFRA_strengthen_the_little_entente_desc:0 "Малая Антанта обязывает нас приходить на помощь нашим союзникам в Восточной Европе и на Балканах. Мы позволили этому альянсу рухнуть, но сейчас он необходим больше, чем когда-либо. Пришло время возродить его."
  UFRA_invest_in_our_weaker_allies:0 "Инвестировать в наших более слабых союзников"
  UFRA_invest_in_our_weaker_allies_desc:0 "Если мы хотим, чтобы в случае войны у нас были боеспособные союзники, мы должны дать им возможность удовлетворять свои собственные военные потребности. Программа умеренных инвестиций в их промышленность позволит им самостоятельно производить необходимые им боеприпасы."
  UFRA_invest_in_our_weaker_allies_trigger_tt:0 "Имеет меньше военных заводов, чем мы"
  UFRA_coordinate_rearmament:0 "Координировать перевооружение"
  UFRA_coordinate_rearmament_desc:0 "Чтобы соответствовать единому процессу развития немцев и наших других противников, мы также должны координировать наши усилия с нашими союзниками."
  UFRA_foreign_guest_workers:0 "Иностранные гастарбайтеры"
  UFRA_foreign_guest_workers_desc:0 "Нехватка рабочих - это главное препятствие на пути к расширению нашей промышленности и росту наших вооруженных сил. Приглашение квалифицированных работников из наших союзников для работы на наших фабриках освобождает рабочую силу для отправки в армию."
  UFRA_join_the_ententes:0 "Присоединиться к Антанте"
  UFRA_join_the_ententes_desc:1 "Франция не может нести два обязательства по взаимной обороне одновременно. Если мы не сможем заставить британцев согласиться на выполнение наших обязательств, нам придется выбирать. Объединив наши разрозненные сети альянсов в единое целое, мы увеличим сдерживающий фактор наших альянсов на порядок."
  unlocks_espionage_operation_tt:0 "Открывает §Yоперацию по шпионажу§!:\n"
  UFRA_revive_the_franco_polish_alliance:1 "Возобновить франко-польский альянс"
  UFRA_revive_the_franco_polish_alliance_desc:0 "Франция всегда поддерживала независимость Польши. В последние годы отношения между нашими странами немного охладели. С угрозой со стороны Германии на горизонте, пришло время возродить наш пакт."
  UFRA_revive_the_franco_polish_alliance_tt:0 "\nПольша будет приглашена в нашу фракцию, если мы станем лидерами нашей фракции."
  UFRA_buy_time:0 "Выиграть время"
  UFRA_buy_time_desc:0 "Мы не готовы встретиться с немцами в полевых условиях. Наши союзники слабы, наша армия устарела. Нам, возможно, придется пойти на некоторые жертвы, если мы хотим выжить."
  UFRA_arms_purchases_in_the_us:1 "Закупка оружия в США"
  UFRA_arms_purchases_in_the_us_desc:0 "Наша военная промышленность просто не в состоянии поставить наши вооруженные силы необходимое современное оружие. Тем не менее, у США есть излишние производственные мощности. Если только они не решат вернуться к своему изоляционизму, похоже, что их можно будет убедить продать нам оружие, которое нам нужно."
  UFRA_france_leads:0 "Франция лидирует"
  UFRA_france_leads_desc:0 "Нация с гордой историей Франции не может позволить другим странам диктовать ей внешнюю политику. Мы сделаем свой собственный выбор, руководствуясь собственными интересами."
  UFRA_concessions_to_italy:1 "Уступки Италии"
  UFRA_concessions_to_italy_desc:0 "Италия по-прежнему мечтает об империи в Африке. Если бы мы предложили некоторые уступки - и одобрили ее завоевание Эфиопии - мы могли бы предотвратить формирование оси между Римом и Берлином."
  UFRA_ratify_the_stresa_front:0 "Ратифицировать Фронт Стрезы"
  UFRA_ratify_the_stresa_front_desc:0 "Италия заявила, что присоединится к нашей фракции в обмен на территории в Африке. Пришло время поставить ручку на бумагу и ратифицировать необходимые договоры."
  UFRA_franco_soviet_treaty:0 "Франко-советский договор"
  UFRA_franco_soviet_treaty_desc:0 "Советы так же обеспокоены ростом фашизма в Европе, как и мы. Возможно, мы сможем убедить их поддержать нас, если придет время."
  UFRA_revive_the_national_bloc:0 "Радикализация национального блока"
  UFRA_revive_the_national_bloc_desc:0 "Политический ландшафт становится всё более радикальным с каждым днём. Левые говорят о союзе с коммунистами. Чего не хватает сейчас, так это сильного, стабильного руководства."
  UFRA_laissez_faire:0 "Лаissez-Faire"
  UFRA_laissez_faire_desc:0 "Коммунисты открыто говорят о радикальной перестройке экономической структуры нашей страны, о том, как лишить работящего человека его законной собственности. Мы противопоставим этому простую идею свободы. Динамическая экономика всегда будет превосходить леворадикальный кошмар удушающей бюрократии."
  UFRA_protect_the_rights_of_man:0 "Защита прав человека"
  UFRA_protect_the_rights_of_man_desc:0 "Может быть, они никогда не скажут об этом открыто, но каждому, у кого есть глаза, чтобы видеть, очевидно, что ограничение права собственности - это лишь первый шаг к упразднению всех прав, за которые наши гордые предки так тяжело боролись. Мы этого не допустим!"
  UFRA_freedom_front:0 "Распустить лиги"
  UFRA_freedom_front_desc:0 "Столкнувшись с хаосом и разрухой, которые обещают коммунисты, нужно быть готовым заключить союзы с другими партиями, даже с теми, кого можно найти лично предосудительным."
  UFRA_stimulate_the_dynamic_market:0 "Стимулировать динамический рынок"
  UFRA_stimulate_the_dynamic_market_desc:0 "Динамический рынок доказал, что является самой эффективной формой экономической организации. Но им всё ещё управляют люди, а люди нуждаются в том, чтобы их переубедили, что их тяжкий труд не будет напрасным. Отменяя некоторые ограничения законодательным путём и предоставляя гарантии, мы можем помочь инвесторам преодолеть страхи и стимулировать нашу экономику."
  UFRA_agricultural_protectionism:0 "Сельскохозяйственный протекционизм"
  UFRA_agricultural_protectionism_desc:0 "Мировая экономика стала всё более враждебной к нашим традиционным способам производства. Если мы не примем меры по защите наших фермеров, то вскоре мы столкнёмся с кризисом невиданных масштабов, так как нашим фермерам не удастся остаться конкурентоспособными перед лицом поступающих из-за рубежа продуктов питания массового производства."
  UFRA_economic_devolution:0 "Экономическое делегирование полномочий"
  UFRA_economic_devolution_desc:0 "Странно полагать, что какой-нибудь бюрократ в Париже знает, что лучше для компании в Бордо. Мы должны довериться нашим предпринимателям и предоставить им право создавать собственные решения."
  UFRA_promote_entrepeneurship:0 "Поддержка предпринимательства"
  UFRA_promote_entrepeneurship_desc:0 "Сердцевиной динамичного рынка всегда был отдельный человек, который, увидев возможность, действует быстро, чтобы использовать её. В последние годы этот дух был подавлен излишними правилами. Мы должны отменить их."
  UFRA_utilize_the_leagues:0 "Использовать лиги"
  UFRA_utilize_the_leagues_desc:0 "Политическое насилие стало обычным делом во Франции. Стране необходимо выжить и не поддаться угрозе коммунистической революции, для этого нельзя упускать помощь от тех, кто сможет встретиться с коммунистами-бандитами на улице, если это необходимо."
  UFRA_national_regeneration:0 "Национальное возрождение"
  UFRA_national_regeneration_desc:0 "Демократия и заблуждения республиканства отравили нашу страну и разделили народ. Потребуется немало времени для излечения этих ран, но, по крайней мере, мы сделали первые шаги."
  UFRA_national_regeneration_trigger_tt:0 "Общее число сторонников несогласных и фашистов составляет более 50%"
  UFRA_destroy_decadence:0 "Уничтожить декаданс"
  UFRA_destroy_decadence_desc:1 "Ни одна страна никогда не стала великой, если она позволяла себе долгие месяцы спорить даже по самым незначительным вопросам. Некоторые страны, надёжно укрытые за океанами и поддерживаемые мировыми империями, возможно, могут позволить себе такую роскошь. У нас её нет."
  UFRA_integralism:0 "Интегрализм"
  UFRA_integralism_desc:0 "Идеология интегрализма заключается в том, что все части общества должны сплотиться и работать как единое целое, внося свой вклад в общую цель. Такое общество должно быть чётко организовано, чтобы все его части работали вместе, в гармонии."
  UFRA_work:0 "Труд"
  UFRA_work_desc:0 "Ремесленник - самая важная часть экономики. Когда им управляют правильные люди, нет более благородного призыва, чем отдать свой труд на службу своему Отечеству."
  UFRA_family:0 "Семья"
  UFRA_family_desc:0 "Самая маленькая единица в обществе - это не отдельная личность - это семья. Отрицать этот простой и очевидный факт было самой большой ошибкой старой республики."
  UFRA_fatherland:0 "Отечество"
  UFRA_fatherland_desc:0 "Родина стоит превыше всего. В этом не может быть никаких сомнений."
  UFRA_political_unity:0 "Политическое Единство"
  UFRA_political_unity_desc:1 "История Франции со времен падения абсолютизма была историей политической борьбы. Когда было единство - Франция побеждала. Когда были внутренние раздоры - Франция была побеждена. По этой причине мы не можем позволить амбициям немногих навредить благосостоянию большинства."
  UFRA_diplomatic_freedom:0 "Дипломатическая Свобода"
  UFRA_diplomatic_freedom_desc:1 "Республиканские правительства сковали себя искусственными образованиями в Восточной Европе, которые падут, как только мы откажемся от нашей помощи. Они являются не активами, а обязательствами, и поэтому мы откажемся от них."
  UFRA_latin_entente:0 "Латинская Антанта"
  UFRA_latin_entente_desc:1 "Братство, существующее между государствами-преемниками Римской империи, неоспоримо. Германские народы Европы слишком долго правили континентом. Пришло время нам вернуть наше национальное право по рождению."
  UFRA_reach_out_to_spain:0 "Связь с Испанией"
  UFRA_reach_out_to_spain_desc:0 "Недавно оправившаяся от гражданской войны Испания станет нашим естественным союзником в стремлении перекроить континент."
  UFRA_invite_portugal:0 "Пригласить Португалию"
  UFRA_invite_portugal_desc:1 "Хотя её колониальная империя значительно уменьшилась, пламя исследования и завоевания всё ещё горит в сердцах всех португальцев."
  UFRA_compensate_italy:0 "Компенсировать Италии"
  UFRA_compensate_italy_desc:0 "В прошлом конфликты из-за крошечных участков пустыни вовлекали наши страны в войну. Такую чепуху можно легко остановить и быстро найти взаимоприемлемый исход."
  UFRA_intervention_in_greece:0 "Вмешательство в Грецию"
  UFRA_intervention_in_greece_desc:0 "Греция контролирует одну из самых ценных территорий в Средиземноморье. Мы не можем допустить, чтобы враждебное правительство управляло ей, и поэтому мы должны действовать первыми."
  UFRA_the_congress_of_paris:0 "Парижский конгресс"
  UFRA_the_congress_of_paris_desc:0 "На Берлинском конгрессе были определены границы Африки. Но сегодняшняя карта похожа на лоскутное одеяло. Настало время перерисовать карту и таким образом сформировать основу новой колониальной империи."
  UFRA_the_natural_borders_of_france:0 "Естественные границы Франции"
  UFRA_the_natural_borders_of_france_desc:0 "Вполне естественно, что страна должна в первую очередь заботиться о собственных интересах. Мы не можем мирно сосуществовать с немцами в нашей борьбе, и поэтому мы должны защитить наши естественные границы, чтобы защитить наши земли."
  UFRA_towards_a_new_europe:0 "К новой Европе"
  UFRA_towards_a_new_europe_desc:1 "Франция стоит на перепутье. Мы можем сковать себя по рукам и ногам старым порядком, а можем принять новый. С немцами, готовыми переделать континент, нам будет выгодно быть на их стороне."
  UFRA_establish_spheres_of_influence:0 "Установить сферы влияния"
  UFRA_establish_spheres_of_influence_desc:1 "На протяжении веков наш народ жил в вере, что мы смертельные, наследственные враги. Это убеждение основывалось на идее о том, что наши интересы несовместимы. Но мы наверняка могли бы прийти к согласию, если бы просто определили сферы нашего влияния и усердно воздерживались от вмешательства."
  UFRA_split_belgium:0 "Разделить Бельгию"
  UFRA_split_belgium_desc:0 "Теперь, когда Бельгия находится в сфере нашего влияния, пришло время назвать франкоговорящие части её своей родиной. Остальные будут сформированы в новое государство."
  UFRA_align_belgium:0 "Согласовать Бельгию"
  UFRA_align_belgium_desc:0 "Бельгийцы обязаны своим существованием нам, и мы не можем позволить им забыть этот факт. Если мы позволим им оставаться независимыми, мы по крайней мере обеспечим, чтобы там было установлено дружественное правительство."
  UFRA_grow_the_empire:0 "Расширить империю"
  UFRA_grow_the_empire_desc:0 "Нелепо, что стране размером с Бельгию позволено сохранять колонию, которая во много раз больше ее. Мы гораздо лучше подходим для управления такой территорией."
  UFRA_bring_home_quebec:0 "Вернуть Квебек домой"
  UFRA_bring_home_quebec_desc:0 "Провинция, потерянная много лет назад, со временем снова станет нашей. Все франкоговорящие народы мира в конце концов воссоединятся с отечеством."
  UFRA_expand_to_the_suez:0 "Расширение к Суэцу"
  UFRA_expand_to_the_suez_desc:0 "Разделение контроля над Левантом между нами и Великобританией - это невыполнимый компромисс, которого, к счастью, нам больше не нужно придерживаться."
  UFRA_dominate_the_middle_east:0 "Доминировать на Ближнем Востоке"
  UFRA_dominate_the_middle_east_desc:0 "Страны Ближнего Востока - искусственные образования, вырезанные из тела Османской империи. Они не более суверенны, чем среднестатистическая французская деревня, и настало время напомнить им об этом факте."
  UFRA_the_council_of_rambouillet:0 "Совет Рамбуйе"
  UFRA_the_council_of_rambouillet_desc:0 "Поскольку страна находится в смятении, люди ищут сильного лидера. Стало ясно, что республиканство подвело французов, и настало время вернуться естественным правителям Франции. Но сначала необходимо заложить основу для восстановления монархии."
  UFRA_revise_the_constitution:0 "Пересмотреть конституцию"
  UFRA_revise_the_constitution_desc:0 "Республиканская конституция всегда была временной мерой, которая сохранялась слишком долго. Теперь мы перепишем ее, чтобы позволить монарху вернуться."
  UFRA_repeal_the_law_of_exile:0 "Отменить закон об изгнании"
  UFRA_repeal_the_law_of_exile_desc:0 "Ни одному главе французской королевской семьи, ни их наследнику не разрешается находиться на французской земле без особого разрешения. Прежде чем мы сможем торжественно восстановить монархию, мы должны избавиться от этого досадного маленького препятствия."
  UFRA_orleanist_restoration:1 "Орлеанистская реставрация"
  UFRA_orleanist_restoration_desc:2 "Дом Орлеанов пользуется значительной поддержкой среди роялистов во Франции. Хотя некоторые противники предпочли бы другого кандидата на трон, не может быть никаких сомнений в том, что у наследника орлеанистов есть лучшие шансы мирно объединить страну за собой."
  UFRA_guarantee_the_constitution:0 "Гарантировать Конституцию"
  UFRA_guarantee_the_constitution_desc:0 "Прежде чем республиканская пресса сможет даже начать свои беспочвенные кампании против легитимности монархического правления, мы должны подорвать их позиции, дав железобетонные гарантии соблюдения индивидуальных прав народа."
  UFRA_the_first_citizen_of_the_state:0 "Первый гражданин государства"
  UFRA_the_first_citizen_of_the_state_desc:0 "Король, пусть и наделенный немалой властью, не должен никогда восприниматься как тиран или абсолютный правитель старого типа. Напротив, современный монарх должен уважать закон и быть первой линией обороны от тех, кто хочет незаконно захватить власть."
  UFRA_counter_action_desc:0 "Action Francaise уже долгое время является главным сторонником возврата к монархии. К сожалению, их взгляды по другим вопросам менее приемлемы. Пора сообщить им, что они выполнили свое предназначение и избавиться от них."
  UFRA_no_further_humiliations:0 "Хватит унижений"
  UFRA_no_further_humiliations_desc:0 "В течение многих лет сменяющие друг друга республиканские правительства позволяли немцам грубо нарушать международные договоры, некоторые из которых были нагло разорваны, не успев еще высохнуть чернила. Этому положен конец."
  UFRA_slum_clearing:0 "Очистка трущоб"
  UFRA_slum_clearing_desc:0 "Несмотря на то, что Франция является одной из великих держав мира, простые французские рабочие часто живут в ужасающих условиях отвратительной нищеты. Ни один достойный этого титула король не может терпеть, чтобы его подданные жили в таком состоянии."
  UFRA_public_welfare:0 "Общественное благосостояние"
  UFRA_public_welfare_desc:0 "Король, который не заботится о самых неимущих из своих подданных, не король вовсе."
  UFRA_the_legitimate_heir:0 "Законный наследник"
  UFRA_the_legitimate_heir_desc:1 "Легитимисты считают ветвь Карла законным наследником французского престола. Назначение их кандидата на трон открывает соблазнительную возможность управлять Испанией и Францией в двойной монархии."
  UFRA_secure_the_crown_of_spain:0 "Защита короны Испании"
  UFRA_secure_the_crown_of_spain_desc:0 "Первым шагом к отстаиванию прав короля является защита Испании от различных самозваных правительств, которые возникли. Их мелкие склоки уже однажды ввергли страну в кровавую гражданскую войну. Мы не должны позволить им сделать это снова."
  UFRA_unite_the_crowns:0 "Объединить короны"
  UFRA_unite_the_crowns_desc:0 "С защищенной Испанией мы теперь можем объединить короны и создать новое королевство - Королевство Франко-Испании."
  UFRA_two_countries_two_crowns:0 "Две страны, две короны"
  UFRA_two_countries_two_crowns_desc:0 "Нет никакого способа, которым мы могли бы объединить страны, в котором одна не считала бы себя подданной другой. Вместо этого мы посоветуем королю править обеими в личном, но не в юридическом союзе."
  UFRA_proclaim_the_third_empire:0 "Провозгласить Третью империю"
  UFRA_proclaim_the_third_empire_desc:0 "Бонапартистов можно считать аутсайдерами в борьбе за трон, но они несут с собой мечту о времени, когда вся Европа преклонялась перед императором французов."
  UFRA_avenge_waterloo:0 "Отомстить за Ватерлоо"
  UFRA_avenge_waterloo_desc:0 "История Наполеона I навсегда будет связана с его величайшим поражением. Если мы хотим победить, то должны показать, что можем выиграть там, где он потерпел поражение."
  UFRA_reorganize_the_dutch:0 "Реорганизация Голландии"
  UFRA_reorganize_the_dutch_desc:0 "Голландия тоже когда-то была частью Французской империи. Теперь, когда они побеждены, пришло время вернуть их в это естественное состояние."
  UFRA_retribution_for_sedan:0 "Месть за Седан"
  UFRA_retribution_for_sedan_desc:0 "На протяжении более чем полувека немцы праздновали битву при Седане и свою победу там над Наполеоном III. В будущем каждый немец научится проклинать название этого места."
  UFRA_disunite_germany:0 "Разобщить Германию"
  UFRA_disunite_germany_desc:0 "Триумф над Францией позволил Пруссии объединить мелкие германские государства под своим знаменем. Это процесс следует обратить вспять, теперь, когда немцы побеждены."
  UFRA_return_to_borodino:0 "Возвращение в Бородино"
  UFRA_return_to_borodino_desc:0 "У Бородино Наполеон был ближе всего к победе в Европе. Русская армия была почти уничтожена, и если бы он действовал немного быстрее, то смог бы принудить Россию к миру. Мы покажем миру, что это возможно."
  UFRA_je_suis_la_deluge:1 "Je Suis Le Déluge"
  UFRA_je_suis_la_deluge_desc:0 "Французская революция стала наводнением, которое смело старые и слабые режимы, так долго контролировавшие Европу. Теперь же наступило новое наводнение."
  UFRA_coordinate_rearmament_tt:0 "Снижает стоимость лицензий на производство для участников нашей фракции."
  UFRA_appeal_to_the_french_nation:0 "Обращение к французской нации"
  UFRA_appeal_to_the_french_nation_desc:0 "Франция, может быть, и проиграла битву, но она не проиграла войну. Долг каждого патриотически настроенного француза — оказывать сопротивление."
  UFRA_appeal_to_overseas_territories:0 "Обращение к заморским территориям"
  UFRA_appeal_to_overseas_territories_desc:0 "Хотя метрополия Франции, скорее всего, пала под натиском противника, значительная часть её империи до сих пор свободна. Если мы сможем склонить их на свою сторону, то сможем перенести боевые действия на территорию противника."
  UFRA_appeal_to_overseas_territories_tt:0 "Колониальные территории в различных частях мира имеют шанс перейти на нашу сторону."
  UFRA_intervention_in_north_africa:0 "Вмешательство в Северную Африку"
  UFRA_intervention_in_north_africa_desc:0 "Северная Африка представляет собой лучшую плацдарм для вторжения, чтобы вернуть себе родину. Привлечение её на нашу сторону имеет жизненно важное значение для нашей кампании освобождения."
  UFRA_intervention_in_west_africa:0 "Вмешательство в Западную Африку"
  UFRA_intervention_in_west_africa_desc:0 "В Западной Африке проживают миллионы людей, которых можно призвать в новую армию, чтобы отбить нашу родину."
  UFRA_intervention_in_syria:0 "Вмешательство в Сирию"
  UFRA_intervention_in_syria_desc:0 "Лишив противника стратегических территорий в Сирии, вы обеспечите защиту Суэцкого канала и значительно улучшите наше положение в восточном Средиземноморье."
  UFRA_intervention_in_indochina:0 "Вмешательство в Индокитай"
  UFRA_intervention_in_indochina_desc:0 "Вдали от боев в Европе, наши колонии в Индокитае — это идеальное место, чтобы защитить наши интересы в этом регионе."
  UFRA_intervention_in_central_africa:0 "Вмешательство в Центральную Африку"
  UFRA_intervention_in_central_africa_desc:0 "Центральная Африка имеет жизненно важное значение для военных действий союзников и может быть захвачена как важный пропагандистский успех для нас."
  UFRA_intervention_in_madagascar:0 "Вмешательство на Мадагаскаре"
  UFRA_intervention_in_madagascar_desc:2 "Если позволить противнику захватить и укрепить Мадагаскар, мы столкнемся с катастрофой в Индийском океане. Быстрые и решительные действия могли бы гарантировать, что остров останется на нашей стороне."
  UFRA_form_the_national_committee:0 "Сформировать Национальный комитет"
  UFRA_form_the_national_committee_desc:0 "Мало кто верил, что наше дело может увенчаться успехом. Но теперь мы, наконец, достаточно сильны, чтобы заявить о формировании полноценного правительства в изгнании, готового взять под контроль любую освобожденную от противника французскую территорию."
  UFRA_form_the_provisional_government_of_the_republic:1 "Сформировать Временное правительство"
  UFRA_form_the_provisional_government_of_the_republic_desc:0 "С освобождением Парижа мы больше не правительство в изгнании. Пришло время начать сложную работу по восстановлению нашей страны."
  UFRA_continue_the_fight:0 "Продолжить борьбу"
  UFRA_continue_the_fight_desc:0 "Пока к нам присоединилось лишь несколько солдат, но тех, что есть, нужно вооружить и экипировать."
  UFRA_the_free_french_navy:0 "Свободный французский флот"
  UFRA_the_free_french_navy_desc:0 "Наши союзники ведут отчаянную борьбу за выживание, для которой жизненно важны морские пути. Мы должны внести свой вклад, чтобы помочь им."
  UFRA_colonial_recruitment_desc:0 "Поскольку набор на родине невозможен, мы должны обратиться за помощью к нашим колониям. Многие наши подданные готовы взять в руки оружие, чтобы сражаться за нас."
  UFRA_the_regiment_normandie:0 "Полк Нормандия"
  UFRA_the_regiment_normandie_desc:0 "Чрезвычайно важно, чтобы французов видели сражающимися на всех фронтах. Теперь, когда Советы вступили в бой против нашего общего врага, мы можем отправить небольшую группу летчиков-истребителей, чтобы помочь им."
  UFRA_refus_absurde:0 "Странный отказ"
  UFRA_refus_absurde_desc:0 "Даже в час поражения в некоторых сердцах воля к сопротивлению остается сильной. Они составят основу движения сопротивления на оккупированных территориях."
  UFRA_the_maquis:0 "Маки"
  UFRA_the_maquis_desc:1 "Сельские районы Франции дают укрытие всем, кто хочет бежать от оккупанта или их пособников. Мы должны поддержать тех, кто отказывается работать на врага, и эти регионы со временем превратить в очаги сопротивления."
  UFRA_reach_out_to_trade_unions:0 "Связи с профсоюзами"
  UFRA_reach_out_to_trade_unions_desc:0 "Если мы хотим нанести удар по промышленности, которая сейчас перешла на службу к врагу, то наиболее эффективным способом будет наладить связь с тамошними рабочими. Они могут куда эффективнее любой внешней силы затормозить или саботировать производство."
  UFRA_cooperation_with_the_communists:0 "Сотрудничество с коммунистами"
  UFRA_cooperation_with_the_communists_desc:0 "В нашей общей борьбе мы не должны отвергать помощи союзников, даже если они называют себя товарищами."
  UFRA_connections_to_industrialists:0 "Связи с промышленниками"
  UFRA_connections_to_industrialists_desc:0 "Сотрудничество с рабочими на военных заводах, безусловно, поможет, однако еще большие выгоды даст сотрудничество с людьми, управляющими заводами."
  UFRA_the_civil_and_military_organization:0 "Военно-гражданская организация"
  UFRA_the_civil_and_military_organization_desc:0 "Многие мелкие группы, совершающие акты сопротивления, объединяются в более крупные организации. Мы должны благословить это начинание."
  UFRA_national_council_of_the_resistance_desc:0 "Сопротивление во Франции растёт день ото дня, и стало настолько могущественным, что ему потребовался новый руководящий комитет для координации действий."
  UFRA_national_uprising_desc:0 "Настал час. Пришло время взяться за оружие и выйти из тени, в которой вы скрывались все эти долгие годы!"
  UFRA_french_forces_of_the_interior:0 "Внутренние французские силы"
  UFRA_french_forces_of_the_interior_desc:1 "Сопротивление насчитывает тысячи вооружённых людей по всей Франции. По мере нашего и наших союзников продвижения по стране, мы будем подхватывать их и превращать в солдат нашей армии."
  UFRA_french_forces_of_the_interior_tt:0 "Создаёт слабые пехотные подразделения в каждом освобождённом основном штате."
  UFRA_naval_rearmament:0 "Военно-морское перевооружение"
  UFRA_naval_rearmament_desc:0 "Нашей судостроительной отрасли пришлось прийти в упадок, так как мы были сосредоточены на том, чтобы не отставать от других областей. В результате нам теперь очень грозит, что нас превзойдут наши соперники в Средиземном и Атлантическом море. Мы должны больше инвестировать, чтобы наверстать упущенное."
  UFRA_colonial_naval_bases:0 "Колониальные военно-морские базы"
  UFRA_colonial_naval_bases_desc:0 "Ключ к глобальному силовому воздействию — это способность поддерживать флот далеко от родных берегов. У нас уже есть большие колониальные владения, теперь мы должны развивать их, чтобы они служили базами снабжения и ремонта для нашего флота."
  UFRA_develop_colonial_dockyards:0 "Развивать колониальные верфи"
  UFRA_develop_colonial_dockyards_desc:0 "Морские базы в разных частях нашей империи расширены и модернизированы, мы можем подумать об обосновании необходимой тяжелой промышленности и строительстве крупных доков, необходимых для постройки кораблей за рубежом."
  UFRA_the_old_school:0 "Старая школа"
  UFRA_the_old_school_desc:0 "Несмотря на все достижения в области военно-морских технологий, ключевым элементом морской мощи по-прежнему является главный корабль, действующий при поддержке других боевых частей флота. Будет ли этим главным кораблем по-прежнему линкор или новый авианосец, мы должны еще больше увеличить размер нашей судостроительной промышленности, чтобы быть уверенными, что мы сможем идти в ногу с другими военно-морскими державами."
  UFRA_carrier_planes:0 "Палубные самолеты"
  UFRA_carrier_planes_desc:0 "Авианосец хорош только своими самолетами. Без современных самолетов любой авианосец является бесполезной инвестицией."
  UFRA_rush_the_richelieus:0 "Срочно стройте Richelieu"
  UFRA_rush_the_richelieus_desc:0 "С учетом того, что ситуация в Европе становится все более и более безнадежной, у нас нет времени, чтобы строить новые надводные суда обычными способами. Мы должны направить все материалы на строительство новых линкоров и ввести их в эксплуатацию как можно скорее."
  UFRA_prioritize_the_joffre:0 "Дайте приоритет Joffre"
  UFRA_prioritize_the_joffre_desc:0 "Наш нынешний флот авианосцев безнадежно устарел и уступает любому потенциальному противнику. Мы должны убедиться, что новый проект авианосца получит высший приоритет."
  UFRA_the_young_school:0 "Молодая школа"
  UFRA_the_young_school_desc:0 "Достижения в развитии авиации, подводных лодок и торпед сделали капитальный корабль устаревшим. Ограниченность нашей военно-морской промышленности не позволяет нам тратить время и деньги на строительство гигантских плавучих крепостей, которые беззащитны перед угрозами современного морского поля боя. Вместо этого, мы должны сосредоточиться на повышении эффективности, которая позволит нам строить больше малых судов."
  UFRA_undersea_combat:0 "Подводная война"
  UFRA_undersea_combat_desc:0 "За последнее десятилетие подводная лодка достигла зрелости. Теперь она представляет смертельную угрозу для всех надводных кораблей, а обнаружение и уничтожение подводных лодок становится все более трудным."
  UFRA_surface_combat:0 "Надводная война"
  UFRA_surface_combat_desc:0 "С развитием артиллерии стало почти невозможно построить корабль, который сможет выдержать затяжную перестрелку с другим капитальным судном. Гораздо лучше иметь флот современных эсминцев и торпедных катеров, чтобы подавить противника массированными залпами торпед."
  UFRA_prioritize_the_joffre_tt:0 "Добавляет в очередь строительства современный §YАвианосец§! на 40% завершения."
  UFRA_SNCAN_formed:0 "Создана SNCAN"
  UFRA_SNCAO_formed:0 "Создана SNCAO"
  UFRA_SNCASE_formed:0 "Создана SNCASE"
  UFRA_SNCASO_formed:0 "Создана SNCASO"
  UFRA_metropolitan_france:2 "Инвестировать в Метрополию Франции"
  UFRA_metropolitan_france_tt:0 "Не хватает мест для строительства §YИнфраструктуры§! в Метрополии Франции"
  UFRA_metropolitan_france_desc:0 "Метрополия всегда должна быть на первом месте. Мы можем начать с улучшения нашей инфраструктуры, чтобы создать рабочие места и ускорить развертывание войск."
  UFRA_algerie_france:2 "Инвестиции в Алжирскую Францию"
  UFRA_algerie_france_tt:0 "Недостаточно места для постройки §YИнфраструктуры§! во Французской колонии"
  UFRA_algerie_france_desc:0 "Европа переживает опасные времена. Мы должны сосредоточиться на улучшении наших южных земель и обеспечить поддержку материка."
  UFRA_industrial_expansion:0 "Индустриальная экспансия"
  UFRA_industrial_expansion_tt:0 "Недостаточно места для постройки §YГражданских заводов§! в Метропольной Франции"
  UFRA_industrial_expansion_desc:0 "Нам нужно укрепить индустриальную базу внутри страны. У нас достаточно рабочей силы, но не хватает производственных мощностей."
  UFRA_colonial_industry:0 "Колониальная индустрия"
  UFRA_colonial_industry_tt:0 "Недостаточно места для постройки §YГражданских заводов§! во Французской колонии"
  UFRA_colonial_industry_desc:1 "Мы должны сосредоточиться на промышленности в колониях. Если напряженность в Европе усилится, у нас останутся промышленные мощности вне зоны досягаемости вражеских бомбардировщиков."
  UFRA_military_factories:0 "Военные заводы"
  UFRA_military_factories_tt:0 "Недостаточно места для постройки §YВоенных заводов§! в Метропольной Франции"
  UFRA_military_factories_desc:1 "Наши военные мощности отстают. Мы должны сосредоточиться на производстве военной техники на родине, чтобы обеспечить наши войска новым снаряжением."
  UFRA_colonial_military_factories:0 "Колониальные военные заводы"
  UFRA_colonial_military_factories_tt:0 "Не хватает места для постройки §YВоенного завода§! в Колониальной Франции"
  UFRA_colonial_military_factories_desc:0 "Производство военной техники за пределами Европы даст нам возможность поставлять новые вооружения нашим передовым войскам, даже если противник установит контроль над нашим воздушным пространством."
  UFRA_extra_research_slot:2 "Поддержка исследовательских групп"
  UFRA_extra_research_slot_desc:0 "Талантливые молодые умы есть везде. Необходимо предоставить им возможность заниматься исследованиями. Достижения в области технологий могут дать нам преимущество именно там, где оно нам необходимо."
  UFRA_nuclear_effort:0 "Ядерная программа"
  UFRA_nuclear_effort_desc:0 "Изначальные тесты в области ядерной науки показали хорошие результаты. Овладение этой мощью может дать нам оружие, не похожее на все то, что человечество когда-либо видело."
  UFRA_jet_effort:0 "Развитие реактивных самолётов"
  UFRA_jet_effort_desc:0 "Воздушный бой - это всё о мобильности. Реактивный двигатель даёт такое преимущество, что вражеские пилоты будут казаться стоящими на месте, пока мы будем сбивать их один за другим."
  UFRA_extra_research_slot_2:2 "Создание национального исследовательского центра"
  UFRA_extra_research_slot_2_desc:0 "Создание Национального исследовательского центра позволит нам скоординировать работу наших лабораторий и тем самым получить от них более высокий результат."
  UFRA_defensive_focus:0 "Оборонительная тактика"
  UFRA_defensive_focus_desc:0 "В такие времена лучше всего укрепить нашу оборону. Если есть угрозы, пусть они приходят к нам, чтобы мы могли разобраться с ними на своей собственной земле. У нас есть идеальный кандидат, чтобы возглавить нашу армию, нам нужно только ваше слово."
  UFRA_aggressive_focus:0 "Агрессивный подход"
  UFRA_aggressive_focus_desc:0 "Мы не можем сидеть сложа руки, когда враги наступают на наши границы. И мы не можем оставить наших союзников самих по себе в сценарии войны. Подготовьте нашу армию! Гамелин - подходящий человек для этой работы."
  UFRA_fortification_focus:0 "Оборонная линия"
  UFRA_fortification_focus_desc:0 "Несмотря на то, насколько важны наши форты, мы должны найти способы построить их более эффективно. Линия Мажино была мощным сдерживающим фактором для вражеских сил, мы могли бы использовать безопасность большего количества таких оборонительных сооружений."
  UFRA_alpine_forts:0 "Укрепить альпийский фронт"
  UFRA_alpine_forts_desc:0 "У нас уже есть форты, которые защищают нас от итальянской угрозы, но модернизация существующих фортов поможет нам окончательно обезопасить юг."
  UFRA_extend_the_maginot_line:0 "Расширить линию Мажино"
  UFRA_extend_the_maginot_line_desc:0 "Мы не можем рассчитывать на то, что Бельгия удержит свои позиции, если они пропустят вражеские армии, у нас могут возникнуть проблемы. Расширение линии Мажино имеет решающее значение для того, чтобы не допустить нежелательные армии на территорию Франции!"
  UFRA_infantry_focus:0 "Массовый набор"
  UFRA_infantry_focus_desc:0 "Все способные сражаться мужчины и женщины сделают это. Массовое производство оружия снизит затраты. Мы положим винтовку в руки каждого."
  UFRA_artillery_focus:0 "Grande Batterie"
  UFRA_artillery_focus_desc:0 "Наша артиллерия сформирует единый мощный отряд для сосредоточенного огня по определенным точкам. По одному залпу за раз мы ослабим линию противника и пробьемся, если потребуется!"
  UFRA_heavy_armor_focus:0 "Char de Bataille"
  UFRA_heavy_armor_focus_desc:0 "Боевые танки - это путь вперед для французской армии. Мы хотим контролировать поле боя, и для этого нам понадобятся новые мощные танки!"
  UFRA_motorized_focus:0 "Моторизованный фокус"
  UFRA_motorized_focus_desc:0 "Поиск лучших способов создания наших пехотных машин поможет нам поддерживать и укреплять передовые позиции."
  UFRA_mechanized_focus:0 "Механизированный фокус"
  UFRA_mechanized_focus_desc:0 "Бронемашины играют все более важную роль в войне. Несмотря на то, что они несколько менее устрашающие, чем обычный танк, они дают нам преимущество в коммуникации, командовании, транспортировке и городских боях."
  UFRA_light_medium_armor:0 "Automitrailleuses"
  UFRA_light_medium_armor_desc:0 "По закону пехота контролирует все танковые силы. Более легкие, быстрые кавалерийские \"машины\" или Automitrailleuses лучше подходят для передвижения и по-прежнему могут наносить некоторый урон своим установленным оружием."
  UFRA_army_reform:0 "Армейская реформа"
  UFRA_army_reform_desc:0 "Ни одна пехотная часть или высокотехнологичный танк не смогут победить в одиночку. Мы должны приложить усилия, чтобы развивать как наши тактические, так и стратегические возможности. С нужными людьми на местах мы сможем развиться как армия."
  UFRA_navy_focus:0 "Флотский упор"
  UFRA_navy_focus_tt:0 "Недостаточно строительных слотов для §YВоенно-морской базы§!"
  UFRA_navy_focus_desc:0 "Если мы планируем расширять свой флот, первым шагом будет улучшение и расширение наших военно-морских баз. Нашим уникальным кораблям требуется постоянное внимание, чтобы они всегда были готовы к бою."
  UFRA_improved_screen_ships:0 "Улучшенные корабли охранения"
  UFRA_improved_screen_ships_desc:0 "Эсминцы и легкие крейсеры играют ключевую роль в защите наших более тяжелых линкоров или авианосцев. Если мы потеряем свою линию обороны в море, мы рискуем потерять все корабли и людей. Мы должны убедиться, что наши корабли построены с использованием новейших технологий."
  UFRA_capital_ship_focus:0 "Упор на капитальные корабли"
  UFRA_capital_ship_focus_desc:0 "Улучшение конструкции наших линкоров приведет к большим тактическим преимуществам. С их непревзойденной дальностью стрельбы и мощью никто не сможет увернуться от их орудий."
  UFRA_boat_planes:0 "Инвестиции в гидросамолеты"
  UFRA_boat_planes_desc:0 "Гидросамолеты превосходят самолеты авианосцев. Им не нужна взлетно-посадочная полоса для взлета или посадки, и они могут работать с любого надводного корабля. Они идеально подходят для мониторинга наших океанов"
  UFRA_carrier_focus:0 "Упор на авианосцы"
  UFRA_carrier_focus_desc:0 "Военные теоретики обратили наше внимание на устаревшие авианосцы. У них есть предложения, как авианосцы можно использовать более эффективно, если разработку направить в правильном направлении. Реальный прогресс невозможен без нашей полной поддержки."
  UFRA_initiate_government_reform:0 "Реформа правительства"
  UFRA_initiate_government_reform_desc:0 "Мир стал опасным. Мы больше не можем быть связанными своими мелкими склоками. Пора расширить полномочия наших политиков и двигаться вперед ради Франции."
  UFRA_support_the_left:0 "Поддержка левых"
  UFRA_support_the_left_desc:0 "Коминтерн набирает силу. Настало время показать, что наши интересы могут быть согласованы, и поддержать наши коммунистические организации."
  UFRA_leftist_rhetoric:0 "Левая риторика"
  UFRA_leftist_rhetoric_desc:0 "Цель ясна. Равенство для всех. Мы не хотим участия капиталистов во французской политике. Необходимо создать оптимальные условия для процветания наших коммунистических организаций."
  UFRA_scw_intervention_republicans:0 "Интервенция республиканцев"
  UFRA_scw_intervention_republicans_desc:0 "Республиканской Испании нужна наша помощь! \nЛюбой, кто хочет бороться за правое дело, должен иметь возможность сделать это. Мы не можем позволить еще одному фашистскому режиму набрать силу."
  UFRA_national_mobilization:0 "Национальная мобилизация"
  UFRA_national_mobilization_desc:0 "У нас, наконец, есть правительство, способное действовать. Теперь настало время укрепить нашу армию и подготовиться к борьбе за Францию."
  UFRA_humanite_unie:0 "Единый народ"
  UFRA_humanite_unie_desc:0 "Толстосумы-банкиры и жадные до власти демагоги усиливают свое кровавое влияние на мир. С каждым днем мы видим, как свободные люди становятся рабами, а мир погружается в пучину кризиса, вызванного жадностью отдельных лиц. Французские идеалы нужны как никогда прежде! Человечеству нужны мы, и нам нужно объединить человечество!"
  UFRA_join_comintern:0 "Вступить в Коминтерн"
  UFRA_join_comintern_desc:0 "При наличии врагов на каждом шагу нам нужно укрепить наши позиции с помощью могущественных союзников. Наши связи с Коминтерном окрепли, и пришло время полностью посвятить себя его делу."
  UFRA_support_status_quo:0 "Поддержать статус-кво"
  UFRA_support_status_quo_desc:0 "Франция является колыбелью и защитником свободы и должна оставаться таковой. Если мы когда-нибудь снова захотим достичь единства, мы должны стабилизировать нашу демократию, прежде чем она сойдет на нет."
  UFRA_little_entente:0 "Малая Антанта"
  UFRA_little_entente_desc:0 "Малая Антанта, альянс, сформированный после Великой войны для предотвращения агрессии Австрии и Венгрии по отношению к своим соседям, поддерживался Францией, но теперь начал распадаться. Вместо того чтобы налаживать связи с Британией, мы должны взять на себя инициативу по восстановлению и консолидации этой фракции, начиная с ее основателей в Чехословакии."
  UFRA_go_with_britain:0 "Идти с Британией"
  UFRA_go_with_britain_desc:0 "В то время как в России всё изменилось навсегда, в Европе от старой Тройственной Антанты остались только Франция и Британия. Если история обречена повториться, мы должны быть уверены, что эти две страны, являющиеся оплотами демократии и свободы в Европе, останутся союзниками."
  UFRA_use_US_nuclear_technics:0 "Использовать американские методы"
  UFRA_use_US_nuclear_technics_desc:0 "В то время как мы всеми силами пытаемся добыть тяжёлую воду, наши коллеги по ту сторону Атлантики используют для замедления нейтронов обогащённый графит. Если других вариантов не будет, использование этого метода позволит нам добиться прогресса в наших ядерных разработках."
  UFRA_strengthen_government_support:0 "Укрепить правительство"
  UFRA_strengthen_government_support_desc:0 "Мы составили план на следующий год, который будет соответствовать пожеланиям людей во всех частях Франции. Покажите им, что мы способны действовать и достойны править Францией, и мы сможем вновь объединиться."
  UFRA_reform_project_Gaston_Doumergue:0 "Проект реформ Гастона Думерга"
  UFRA_reform_project_Gaston_Doumergue_desc:0 "В 1934 году этот проект реформ был предложен бывшим президентом республики Гастоном Думергом и был призван реформировать конституционные законы 1857 года. В частности, он направлен на то, чтобы позволить президенту республики распускать Палату депутатов без согласия Сената. Эта реформа может быть решением проблемы политической нестабильности во Франции."
  UFRA_defensive_strategems:0 "Оборонные стратегии"
  UFRA_defensive_strategems_desc:0 "Если мы хотим, чтобы народ Франции воевал за нас, как никогда важно определиться с направлением. Мы должны прекратить воевать друг с другом и вместо этого сражаться за Францию и \"Свободу, равенство и братство\"."
  UFRA_invite_yugoslavia:0 "Пригласить Югославию"
  UFRA_invite_yugoslavia_desc:0 "У Югославии достаточно забот, помимо экспансии соседних государств. Их возвращение в Малую Антанту станет большой услугой и им, и нам."
  UFRA_invite_romania:0 "Пригласить Румынию"
  UFRA_invite_romania_desc:0 "Румынская демократия хрупка, зажата между внутренними фашистскими фракциями и советским коммунизмом. Вступление в Малую Антанту позволит им сохранять стабильность при нашей поддержке."
  UFRA_polish_guarantee:0 "Польская гарантия"
  UFRA_polish_guarantee_desc:0 "Польские дипломаты выражают обеспокоенность из-за напряженности на границах. Гарантия от нашей могущественной нации должна отпугнуть любого, кто планирует вторжение."
  UFRA_czech_guarantee:0 "Чешская гарантия"
  UFRA_czech_guarantee_desc:0 "Напряженность на чешской границе растет. Мы не можем позволить экспансивным государствам захватить свободную и демократическую нацию. Чехи должны остаться свободным народом. С нашей гарантией любой, кто планирует вторжение, подумает дважды."
  UFRA_revise_versailles:0 "Пересмотреть Версаль"
  UFRA_revise_versailles_desc:0 "Немцы уже игнорируют репарации, предусмотренные Версальским договором, показывая, что Франция больше не внушает уважения. Во всяком случае, мы имеем право требовать большего за жизни, потерянные в Великой войне, но для справедливого договора потребуется сильная Франция, новая Франция, чтобы обеспечить его выполнение."
  UFRA_support_the_right:0 "Поддержим правых"
  UFRA_support_the_right_desc:0 "Франция всегда была сильной и гордой нацией, но отсутствие правительственных действий разделило людей. Мы должны объединить Францию и утвердить наше превосходство и силу, чтобы избежать упадка."
  UFRA_right_wing_rhetoric:0 "Правая риторика"
  UFRA_right_wing_rhetoric_desc:0 "Мы должны сосредоточиться на том, чтобы охватить всех французов и поднять их национальный дух. Покажите им, что мы можем быть сильными лидерами, в которых они нуждаются, и они станут гордыми гражданами нашей славной нации."
  UFRA_scw_intervention_nationalists:0 "Интервенция националистов"
  UFRA_scw_intervention_nationalists_desc:0 "Националисты наконец набирают силу в Испании. Их дело правое, и всякому, кто готов за него бороться, следует позволить это делать."
  UFRA_army_of_aggression:0 "Армия агрессии"
  UFRA_army_of_aggression_desc:0 "Мы больше не можем сидеть за устаревшей стеной, пока наши враги бесчинствуют по всей Европе. Пришло время укрепить нашу армию и отодвинуть наши границы, чтобы Франция оставалась великой нацией."
  UFRA_france_first:0 "Франция прежде всего"
  UFRA_france_first_desc:0 "Мы Франция! Победители Великой войны! Спасители Европы! Мы - родина величайших умов, которые когда-либо видел мир. Слишком много наций пытаются ввергнуть мир в хаос. Мы нужны, и мы ответим на этот призыв. Мы возьмём штурвал, переждём бурю и приведём человечество к спасению под нашим правлением!"
  UFRA_woo_italy:0 "Привлечь Италию"
  UFRA_woo_italy_desc:0 "Италия имеет потенциал стать могущественной нацией. Благодаря сильному руководству Муссолини народ Италии един и готов сражаться за правое дело. Пусть это дело будет и нашим делом."
  UFRA_dismantle_the_democracies:0 "Уничтожить демократии"
  UFRA_dismantle_the_democracies_desc:0 "Новый [GER.GetAdjective] демократический альянс в Центральной Европе угрожает нашему новообретённому положению. Мы должны действовать сейчас, пока они не стали более могущественными."
  UFRA_join_germany:0 "Присоединиться к Германии"
  UFRA_join_germany_desc:0 "Германский рейх становится силой, с которой нужно считаться. Их видение лучшего будущего может совпадать с нашими интересами. Мы должны поддержать их, и как только пыль уляжется, Франция получит свою законную часть Европы."
  UFRA_naval_doctrine:0 "Морская доктрина"
  UFRA_naval_doctrine_desc:0 "Недавние достижения в проектировании кораблей открыли новые возможности в тактических и стратегических манёврах. Прежде чем мы воспользуемся шансом с этими новыми теориями, нам нужно их должным образом проверить и закрепить планы."
  UFRA_air_focus:0 "Авиация Франции"
  air_focus_bypass_tt:0 "Недостаточно слотов для строительства §Yавиабазы§!"
  UFRA_air_focus_desc:0 "Пришло время расширять наши военно-воздушные силы! Уже составлены планы по началу строительства новых авиабаз для значительного увеличения как численности личного состава, так и числа самолетов."
  UFRA_cas_focus:0 "Упор на непосредственную поддержку"
  UFRA_cas_focus_desc:0 "Самолеты, которые оказывают поддержку нашим сухопутным войскам и кораблям, стали очень эффективным дополнением с относительно небольшими инвестициями. Теперь для этих самолетов предлагается ряд улучшений. Наши инженеры могут разработать самолеты поддержки следующего поколения."
  UFRA_fighter_focus:0 "Закупить истребители программы C1"
  UFRA_fighter_focus_desc:0 "13 июля 1934 года мы запустили конкурс на одноместный истребитель, чтобы заменить наши самолеты D.500. Победителями стали MB.150 и MS.405. Теперь, когда их прототипы прошли испытания, мы можем разместить заказ!"
  UFRA_sell_fighter_swiss:0 "Продавать наши истребители"
  UFRA_sell_fighter_swiss_desc:0 "Швейцарцы и греки заявили о своем желании приобрести новую модель истребителя. Если нам удастся произвести хорошее впечатление, мы сможем получить хорошую цену!"
  UFRA_modern_fighter_focus:0 "Разработка преемника MS.406"
  UFRA_modern_fighter_focus_desc:0 "Развитие авиации не стоит на месте, и нам уже нужно разрабатывать преемника новейших моделей."
  UFRA_bomber_focus:0 "Обновить бомбардировщики"
  UFRA_bomber_focus_desc:0 "Многие из наших тактических бомбардировщиков являются старыми моделями, иногда по образцу транспортных самолетов, и мы до сих пор не запустили программу модернизации. Пришло время что-то сделать!"
  UFRA_paratrooper:0 "Центр по воздушной подготовке"
  UFRA_paratrooper_desc:0 "Основатель парашютного учебного центра ВВС после стажировки в СССР, капитан Фредерик Гиль хотел бы создать парашютное подразделение для нашей армии."
  UFRA_heavy_fighter_focus:0 "Закупить самолеты Potez"
  UFRA_heavy_fighter_focus_desc:0 "Модель самолета Potez 630 очень гибкая и не требует больших изменений для выполнения разных ролей, таких как тяжелый истребитель, бомбардировщик и самолет-разведчик."
  UFRA_air_doctrine:0 "Воздушная доктрина"
  UFRA_air_doctrine_desc:0 "Мы приобрели достаточно опыта, чтобы проверить новые теории в воздушной войне более быстрыми темпами. Это позволит нам изучить новые тактические и стратегические возможности. Воздушный бой является ключом в современной войне."
  UFRA_heavy_bomber_focus:0 "Фокус тяжелого бомбардировщика"
  UFRA_heavy_bomber_focus_desc:0 "Современные тяжелые бомбардировщики будут вооружены так, чтобы самостоятельно справляться с более мелкими воздушными стычками. Если мы позволим нашим инженерам сосредоточиться на разработке новейших технологий, у нас будет больше шансов уничтожить производственные мощности противника."
  UFRA_naval_bomber_focus:0 "Фокус морского бомбардировщика"
  UFRA_naval_bomber_focus_desc:0 "Корабли оказались исключительно уязвимыми для самолетов. Мы должны продолжать совершенствовать их технологию, чтобы гарантировать, что мы остаемся впереди всех контрмер."
  UFRA_blum_stays:0 "Блюм остается"
  UFRA_blum_stays_desc:0 "Блюм сделал возможным существование Народного фронта. Он - ученик французского социалистического лидера Жана Жореса, и после убийства Жореса в 1914 г. стал его преемником. В качестве премьер-министра правительства Народного фронта именно он провел ряд важных экономических реформ. Несмотря на свои пацифистские идеи, только он может спасти Францию."
  UFRA_appoint_daladier:0 "Назначить Даладье"
  UFRA_appoint_daladier_desc:0 "Столкнувшись с надвигающейся опасностью в лице Германии, Франции нужен лидер, который может защитить ее народ. Кто лучше подойдет для этого, чем министр обороны, лидер партии Радикалов и член Народного фронта, Эдуар Даладье. Он твердо выступает за перевооружение!"
  UFRA_reynaud_financial_reforms:0 "Финансовые реформы Рейно"
  UFRA_reynaud_financial_reforms_desc:0 "Если Франция должна перевооружиться, стране сначала необходимо избавиться от всего, что замедляет производство. Многие достижения Народного фронта внушительны и необходимы, но они замедляют нашу способность к ведению войны. Мы должны это изменить."
  UFRA_firmness_and_rearmement:0 "Твердость и перевооружение"
  UFRA_firmness_and_rearmement_desc:0 "Даладье выразил свое намерение быть твердым в отношении Германии. И для этого Франция должна активно перевооружаться. Может быть, можно заключить сделку с США?"
  UFRA_continue_social_reforms:0 "Продолжить социальные реформы"
  UFRA_continue_social_reforms_desc:0 "Первая серия реформ, таких как те, что были получены во время Матиньонских соглашений, являются хорошим началом. Но пришло время переключиться на более высокую передачу, постоянно реформируя трудовой кодекс"
  UFRA_improve_free_education:0 "Реформа образования Жана Зая"
  UFRA_improve_free_education_desc:0 "Реформы, проведенные при Жюле Ферри, безусловно, правильные, но все это нужно обновить. Мы должны вводить разные степени образования, продлевать обязательное школьное образование, а также больше внимания уделять спорту"
  UFRA_ask_belgium_to_submit:0 "Просим Бельгию подчиниться"
  UFRA_ask_belgium_to_submit_desc:0 "План защиты Франции рухнул, когда Бельгия отступила. Пришло время попросить Бельгию подчиниться, чтобы мы могли эффективно защитить нашу страну и их"
  UFRA_reinforce_belgium:0 "Укрепить Бельгию"
  UFRA_reinforce_belgium_desc:0 "Форты, расположенные в Бельгии, безусловно, замедлили немцев во время первой войны, но они устарели. Необходимо не только обновить их, но и добавить еще несколько в ключевых точках бельгийского ландшафта"
  UFRA_women_suffrage:0 "Женское избирательное право"
  UFRA_women_suffrage_desc:0 "Это так же абсурдно, как и позорно, что трудолюбивым женщинам Франции, которые раз за разом сражались на баррикадах за свои права, не разрешено голосовать на выборах. Мы искореним эту несправедливость"
  UFRA_crush_bismarck_dream:0 "Разрушить мечту Бисмарка"
  UFRA_forgive_germany:0 "Простить Германию"
  UFRA_steyr_arms:0 "Штайр Манлихер"
  UFRA_swiss_gold:0 "Швейцарское золото"
  UFRA_relocate_german_industry:0 "Перенести немецкую промышленность"
  UFRA_integrate_german_states:0 "Интегрировать немецкие государства"
  UFRA_latin_wine_cooperation:0 "Латинская винная кооперация"
  UFRA_latin_wine_cooperation_desc:0 "Теперь, когда мы контролируем Испанию, Италию и Португалию, большая часть мирового производства вина находится под нашим контролем. И не просто вина, а лучших вин в мире. Это потрясающий источник дохода, но производство необходимо централизовать и скоординировать. Латинская винная кооперация будет отвечать за эту миссию."
  UFRA_via_romana:0 "Виа Романа"
  UFRA_mediteranean_fleet:0 "Средиземноморский флот"
  UFRA_italian_air_industry:0 "Итальянская авиастроительная промышленность"
  UFRA_integrate_latin_states:0 "Интегрировать латинские государства"
  UFRA_retake_constantinople:0 "Вернуть Константинополь"
  UFRA_press_the_gibraltar_claim:0 "Выдвинуть претензии на Гибралтар"
  UFRA_centralize_the_union:0 "Централизовать Союз"
  UFRA_prepare_mexican_coup:0 "Подготовить мексиканский переворот"
  UFRA_put_otto_on_the_mexican_throne:0 "Посадить Отто на мексиканский трон"
  UFRA_reestablish_elections:0 "Восстановить выборы"
  UFRA_christian_democracy:0 "Христианская демократия"
  UFRA_egalite_monarchy:0 "Равенство для женщин"
  UFRA_egalite_monarchy_desc:0 "Во всех отношениях, которые имеют значение, женщины по-прежнему считаются гражданами второго сорта, всегда подчиненными воле мужчины. Этому абсурду приходит конец."
  UFRA_freedom_monarchy:0 "Защита свободы слова"
  UFRA_restore_the_divine_right:0 "Восстановить божественное право"
  UFRA_restore_the_divine_right_desc:0 "Божественное право королей, или теория божественного права на престол, является политической и религиозной доктриной королевской и политической легитимности. Она утверждает, что монарх не подлежит никакой земной власти, получая свое право на управление непосредственно из воли Бога."
  UFRA_counter_revolution:0 "Контрреволюция"
  UFRA_the_real_country:0 "Реальная страна"
  UFRA_authority_and_prestige:0 "Авторитет и престиж"
  UFRA_the_real_country_desc:0 "Моррас противопоставляет правовую страну реальной стране. Правовая страна - это страна администрации, политиков и бюрократов. Реальная же - страна традиций, французов, короля и регионов: бретонцев, нормандцев, корсиканцев... В настоящее время правовая страна - это та, у которой есть власть, но больше нет!"
  UFRA_review_radio_role:0 "Пересмотреть роль радио"
  UFRA_review_radio_role_desc:0 ""
  UFRA_review_tanks_role:0 "Пересмотреть роль танков"
  UFRA_review_tanks_role_desc:0 "Со времени своего изобретения танки сильно изменились. Когда-то не быстрее человека, теперь они быстрее кавалерии. Их пулеметы заменили мощные пушки, а броня стала толще, чтобы выжить на новом поле боя. Наша тактика устарела, нам нужно пересмотреть роль танков в нашей армии."
  UFRA_create_propaganda_apparatus:0 "Государственный секретариат по информации"
  UFRA_create_propaganda_apparatus_desc:0 "Наличие подвластных нам телевизионных каналов позволит показывать людям только то, что им нужно знать"
  UFRA_french_election:0 "Выборы 1936 года"
  UFRA_communist_win:0 "Союз с КПИФ"
  UFRA_fascist_win:0 "Радикализация Национального блока"
  UFRA_royalist_coup:0 "Переворот ВВС"
  UFRA_bonapartist_restauration:0 "Бонопартистская военная хунта"
  UFRA_popular_front_win:0 "Демократия одерживает верх"
  UFRA_put_opponents_to_work:0 "Трудовые лагеря"
  UFRA_extensive_conscription:0 "Милитаризация милиции"
  UFRA_extensive_conscription_desc:0 "Милицию необходимо превратить в регулярную армию, так как немцы сделали это с СС. Это обеспечит послушание в армии."
  UFRA_direction_for_interior_security:0 "Скрытая служба Милиции"
  UFRA_direction_for_interior_security_desc:0 "Милиция создала эффективную сеть информирования. Мы можем использовать ее в наших интересах! Нам необходимо придать их скрытым службам официальный статус!"
  UFRA_an_army_to_challenge_ger:0 "Армия для противостояния Германии"
  UFRA_plan_german_betrayal:0 "План борьбы с предательством Германии"
  UFRA_forced_assimilation:0 "Ускоренная ассимиляция"
  UFRA_forced_assimilation_desc:0 "Нам необходимо использовать эти обширные земли в Африке для поселения французов. Хороший француз стоит 500 местных жителей. Таким образом, мы должны ускорить колонизацию этих земель силой и жестокостью."
  UFRA_destroy_us_liberalism:0 "Конец американскому либерализму"
  UFRA_destroy_us_liberalism_desc:0 "Из далекой страны, из Нового Света через Атлантический океан пришло новое зло этого мира - американский либерализм. Но мы больше не потерпим его!"
  UFRA_modern_knights:0 "Современные рыцари"
  UFRA_modern_knights_desc:0 "Наш идеал чист и благороден. Мы возродим Францию и спасем ее от нравственного разложения. Верность, честь, преданность. Мы будем держаться прямо и будем следовать нашему кодексу вечно."
  UFRA_minimum_wage:0 "Минимальная заработная плата"
  UFRA_minimum_wage_desc:0 "Работник - важнейшая часть нации. Поэтому его нужно защищать. Мы введем SMIC, минимальную заработную плату, чтобы помочь каждому рабочему жить достойно."
  UFRA_vote_for_women:0 "Ограниченное право голоса для женщин"
  UFRA_vote_for_women_desc:0 "Женщины являются основой страны. Поэтому им нужно разрешить участвовать в политической жизни."
  UFRA_the_great_war_model:0 "Модель Великой войны"
  UFRA_the_great_war_model_desc:0 "Мы политическое движение, созданное солдатами, которые видели Великую войну. В этот темный момент нашей истории мы увидели эффективную модель, которую можно применить к французскому обществу. Модель, в которой классы работают вместе, живут вместе и идут вперед вместе, плечом к плечу, как это было в окопах."
  UFRA_french_path_to_fascism:0 "Французский путь к фашизму"
  UFRA_french_path_to_fascism_desc:0 "Франция не будет слепым фанатизмом, как в Германии Гитлера. Наш фашизм будет чистым и эффективным, прекрасно выкованным французской страстью и волей."
  UFRA_crush_the_german_danger:0 "Сокрушим германскую опасность"
  UFRA_crush_the_german_danger_desc:0 "Главная опасность для Европы - Германия. Так было всегда, со времен Рима до 1870 и 1914 года. Германию нужно остановить раз и навсегда."
  UFRA_power_to_the_military_junta:0 "Армия знает лучше"
  UFRA_the_napoleon_referendum:0 "Референдум Наполеона"
  UFRA_the_napoleon_referendum_desc:0 "Наследник трона Наполеона был предельно ясен. Он не примет трон, если народ не выберет его своим лидером на референдуме."
  UFRA_revise_the_constitution_2:0 "Пересмотреть конституцию"
  UFRA_revise_the_constitution_2_desc:0 "Республиканская конституция всегда задумывалась как временная мера, которая существовала слишком долго. Теперь мы перепишем ее, чтобы позволить монарху вернуться."
  UFRA_restore_order:0 "Восстановить порядок"
  UFRA_restore_order_desc:0 "После переворота Франция погрузилась в хаос. Если потребуется, мы восстановим порядок с помощью военной силы."
  UFRA_failed_af_coup:0 "Неудавшийся переворот"
  UFRA_popular_front_victory:0 "Победа Народного фронта"
  UFRA_national_bloc_victory:0 "Победа Национального блока"
  UFRA_national_bloc_victory_desc:0 "Политический ландшафт становится все более и более радикальным с каждым днем. Левые шепчутся о том, чтобы объединиться с коммунистами. Сейчас необходимо сильное и стабильное руководство."
  UFRA_ban_soviet_lackeys:0 "Запретить советских прихлебателей"
  UFRA_ban_soviet_lackeys_desc:0 "Коммунисты и некоторые их союзники из SFIO являются лишь прихлебателями, подчиняющимися большевикам. Мы должны остановить их."
  UFRA_mouvement_national_laval:0 "Национальное движение"
  UFRA_mouvement_national_laval_desc:0 "Чтобы спасти Францию от чужеродных элементов, пытающихся ее уничтожить, необходимо создать Национальное движение."
  UFRA_ally_petain:0 "Вступить в союз с Петеном"
  UFRA_ally_petain_desc:0 "Мы должны заручиться поддержкой Льва Вердена, старый маршал - символ Франции и придаст нашему делу законность."
  UFRA_1935_petains_plan:0 "План Петена 1935 года"
  UFRA_1935_petains_plan_desc:0 "План Петена 1935 года - это план, который едва не был введен в действие с целью сократить зависимость от линии Мажино и в большей степени полагаться на танки! Он предусматривает производство более 1500 легких танков."
  UFRA_ally_doriot:0 "Вступить в союз с Дорио"
  UFRA_ally_doriot_desc:0 "Дорио - бывший коммунист, который понял, что на первом месте должна быть нация. Он является ключевым элементом Лиги, и мы должны заручиться его союзом."
  UFRA_doriot_work_charter:0 "Трудовой кодекс Дорио"
  UFRA_doriot_work_charter_desc:0 "Трудовой кодекс - это новое законодательство, предложенное Дорио. В него входят элементы, близкие к итальянскому фашизму и корпоративизму."
  UFRA_rally_the_communists:0 "Сплотить коммунистов"
  UFRA_rally_the_communists_desc:0 "Сплотить коммунистов"
  UFRA_national_popular_rally:0 "Национал-популистский митинг"
  UFRA_national_popular_rally_desc:0 "Некоторые социалисты и коммунисты, такие как Марсель Деа или Пьер Клементи, понимают необходимость национальной революции. Они хотят создать раскольнический митинг из социалистов и коммунистов: национальный популистский митинг."
