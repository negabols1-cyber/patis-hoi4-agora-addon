  UFRA_german_federations:0 "Германские союзы"
  VIC_armistice_with_germany:0 "Перемирие с Германией"
  VIC_armistice_with_germany_desc:0 "В эти горькие часы я думаю о тех несчастных беженцах, которые бродят по нашим дорогам. Я выражаю им свое сострадание и заботу. Тяжело сердцу моему говорить вам сегодня, что борьба должна быть остановлена. Я вчера разговаривал с противником, чтобы спросить его, готов ли он искать вместе с нами, как солдаты, после боя и с честью, средства для прекращения военных действий."
  VIC_control_newspapers:0 "Управление газетами"
  VIC_control_newspapers_desc:0 "Газеты выродились и стали антифранцузскими, за некоторыми исключениями. Отныне только правительство будет утверждать газеты, которые будут опубликованы."
  UFRA_VIC_chantiers_jeunesse:0 "Контроль за газетами"
  UFRA_VIC_chantiers_jeunesse_desc:0 "Газеты во Франции - дегенераты и антифранцузы, за исключением нескольких. Отныне только утвержденные правительством газеты будут опубликованы."
  UFRA_VIC_put_opponents_to_work:0 "Выдать Германии противников государства"
  UFRA_VIC_put_opponents_to_work_desc:0 ""
  VIC_crush_political_dissent:0 "Подавить политическое инакомыслие"
  VIC_crush_political_dissent_desc:0 "Мы у власти, но есть много людей, которые таятся в тени, ожидая, когда мы проявим какую-либо слабость. Мы не дадим им такой возможности."
  UFRA_VIC_aids_for_families:0 "Помощь семьям"
  UFRA_VIC_aids_for_families_desc:0 "Семья - это фундамент нации. Помощь обеспечит крепкие семьи и будет поощрять родителей к тому, чтобы у них было больше детей."
  UFRA_VIC_ideological_fanaticism:0 "Политическое воспитание"
  UFRA_VIC_ideological_fanaticism_desc:0 "Наши политически устоявшиеся ценности и цели заслуживают того, чтобы за них умереть так же, как и за любую древнюю веру. Любой последователь должен быть готов столкнуться со смертью, а те, кто отклоняется от нее, должны быть готовы встретить ее."
  UFRA_adobt_APCR:0 "Принять APCR"
  UFRA_adobt_APCR_desc:0 "Компания Эдгара Брандта предлагает повысить противотанковые возможности наших орудий за счет стрельбы снарядами меньшего калибра, чем калибр орудия, что улучшит пробитие снарядов."
  UFRA_VIC_light_medium_armor:0 "Сохранить знания о танках"
  UFRA_VIC_light_medium_armor_desc:0 "Немцы запрещают нам строить тяжелую технику, но мы должны любыми путями сохранить наши знания в этой области, чтобы не слишком отстать. Мы должны сделать это незаметно..."
  UFRA_return_to_swiss:0 "Восстановить Швейцарскую Республику"
  UFRA_return_to_swiss_desc:0 "Швейцария должна перестать существовать в своем нынешнем виде! Она слишком далека от режима, созданного моим прапрадедом, и даже отобрала у нас территории после его поражения."
  UFRA_vichyfascist_win:0 "Победа - Виши"
  UFRA_vichyfascist_win_desc:0 "Может быть взято, если Франция находится в союзе и капитулирует перед Германией. Когда ветка будет завершена, она приведет к фашистской ветке"
  UFRA_free_france_win:0 "Победа - Свободная Франция"
  UFRA_free_france_win_desc:0 "Может быть взято, если Франция находится в союзе и капитулирует перед Германией. Когда ветка будет завершена, она приведет к демократической ветке"
  FRA_cooperation_with_the_royalists:0 "Сотрудничество с роялистами"
  FRA_cooperation_with_the_royalists_desc:0 "Хотя не все они одобряют наши идеи, многие предпочли бы присоединиться к борьбе с нами, чем сотрудничать с врагом."
  FRA_char_de_la_liberation:0 "Бронетанковые дивизии освобождения"
  FRA_char_de_la_liberation_desc:0 "''Сегодня, сокрушенные механизированными силами, в будущем мы одержим победу при помощи более могучих механизированных сил. Судьба мира зависит от этого.'' -Шарль де Голль"
  FRA_2eme_db:0 "Создание бронетанковых дивизий"
  FRA_2eme_db_desc:0 "Несмотря на крайне плохое оснащение, колонна Леклерка на службе Сражающейся Франции смогла сотворить чудеса в борьбе против сил Оси. Все, чего им не хватает, чтобы стать поистине грозными, - это современного оснащения."
  FRA_foreign_legion_loyalty:0 "Повышение лояльности Иностранного легиона"
  FRA_foreign_legion_loyalty_desc:0 "Европейцы всех национальностей страдают от конфликта, и иногда у их стран нет средств для борьбы за правое дело. Мы должны предоставить им эти средства через Иностранный легион."
  FRA_corps_expeditionnaire_france_talie:0 "Французский экспедиционный корпус в Италии"
  FRA_corps_expeditionnaire_france_talie_desc:0 "Армии союзников постоянно испытывают нехватку пехоты в ходе своих атак на горные районы Италии. Применение наших сил могло бы укрепить нашу легитимность."
  FRA_commissaire_republic:0 "Республиканские комиссары"
  FRA_commissaire_republic_desc:0 "Союзники планируют учредить военную администрацию на освобожденных территориях метрополии. Позволить им сделать это означало бы рискнуть нашей политической независимостью. Мы должны подготовить уполномоченных республики, которые должны будут восстановить республиканскую законность и власть государства, как только территория будет освобождена."
  FRA_operation_torch:0 "Французская верховная комиссия в Африке"
  FRA_operation_torch_desc:0 "Многие французы поддерживают национальную революцию Виши, но некоторые не одобряют сотрудничество с Германией и хотели бы возобновить борьбу, но отказываются подчиняться приказам Де Голля... С падением Алжира союзники пытаются установить новый режим, который будет более послушным, чем наш. Если мы хотим единой Франции, нам придется сотрудничать с ними..."
  FRA_follow_darlan:0 "Присоединиться к Франсуа Дарлану"
  FRA_follow_darlan_desc:0 "Несмотря на свою политику сотрудничества с Германией, Дарлан остается, по мнению союзников, логичным выбором. Его карьера в качестве главы правительства при маршале Петене дает ему большую легитимность, и в соответствии с Конституционным актом № 4 он будет законным преемником маршала, даже если его отвергнет Виши."
  FRA_impossibles_odds:0 "Невозможное равновесие сил"
  FRA_impossibles_odds_desc:0 "Дарлан верил в установление нового мирового порядка, в котором доминирует Германия и в котором Франция должна найти свое место. Но невероятное проявление силы со стороны войск союзников заставило его изменить свое мнение. Германия потерпит поражение, и все французы должны продолжить борьбу!"
  FRA_clark_darlan:0 "Подписать соглашения Кларк-Дарлан"
  FRA_clark_darlan_desc:0 "Союзники желают Франции освобождения для создания военного правительства под их руководством, прежде чем создать демократическое правительство. Но они готовы отказаться от своих планов, если мы будем сотрудничать, предоставив им особые права на управление нашей Империей."
  FRA_discredit_gaulle:0 "Дискредитировать Де Голля"
  FRA_discredit_gaulle_desc:0 "Даже если его намерения благородны, генерал Де Голль остается марионеточным диктатором Лондона, монополизируя наши колонии и убивая наших людей за фальшивую «свободу». Этот человек и его последователи должны быть арестованы."
  FRA_continue_the_national_revolution:0 "Продолжить национальную революцию"
  FRA_continue_the_national_revolution_desc:0 "Мы, Верховный комиссар Франции, проживающий в Африке и действующий от имени маршала. Для многих французов в Северной Африке, если бы Национальной революции не существовало, ее нужно было бы придумать!"
  FRA_follow_giraud:0 "Избрать Анри Жиро"
  FRA_follow_giraud_desc:0 "Жиро благосклонен к Виши, но будучи задержанным немцами, отказывается от сотрудничества и является источником вдохновения для многих французов. Союзники хотели привести его к власти в Африке, но статус Дарлана был намного полезнее, когда его схватили в Алжире. Но с его недавним убийством, Жиро может быть избран, чтобы вернуть власть."
  FRA_work_with_right_resistant:0 "Сотрудничество с право-ориентированным сопротивлением"
  FRA_work_with_right_resistant_desc:0 "Многие хотят возобновить борьбу, но отказываются от Свободной Франции Шарля де Голля и от коллаборационистского отношения Франсуа Дарлана. Но все сейчас собираются вокруг Анри Жиро, так как он у власти."
  FRA_split_power_with_de_gaulle:0 "Создание Французского комитета национального освобождения"
  FRA_split_power_with_de_gaulle_desc:0 "Шарль де Голль настаивает на слиянии Свободной Франции и французского главнокомандующего сухопутными и военно-морскими силами. Он хочет вместе с Жиро создать центральную власть Франции с правительственными полномочиями, пока все французы не будут иметь возможность проконсультироваться со строительством нового правительства."
  FRA_giraud_governs:0 "Переворот Эмиля Музелье"
  FRA_giraud_governs_desc:0 "Эмиль Музелье на службе у Жиро объявляет, что Летний дворец был целью заговора голлистов Алжира. Он привез в Алжир полк сенегальцев и полк африканских стрелков и оккупировал все выезды из города. Это может быть началом путча против де Голля..."
  FRA_one_goal_victory:0 "Единственная цель – победа"
  FRA_one_goal_victory_desc:0 "«Единственная цель — победа», эта формула Анри Жиро подчеркивает первостепенное значение, которое он придает военным вопросам, и избегает политических вопросов. Так, он ответил бы на вопрос журналиста: «Сэр, я солдат, я не занимаюсь политикой»."
  FRA_brazville_conference:0 "Браззавильская конференция"
  FRA_brazville_conference_desc:0 "Конфликт, ставший причиной многих трудностей для местного населения, привел к развитию националистических устремлений и напряженности между общинами в Французской Северной Африке. Кроме того, нам приходится иметь дело с Соединенными Штатами, которые не скрывают своего неприятия колониализма. Мы должны взять на себя инициативу и подготовить будущее наших колоний для послевоенного периода"
  FRA_combine_africa_army:0 "Создание Французской освободительной армии"
  FRA_combine_africa_army_desc:0 "Мы должны отложить разногласия и окончательно объединить Свободные французские силы и Африканскую армию."
  FRA_follow_king:0 "Убить Дарлана"
  FRA_follow_king_desc:0 "Регентство Франсуа Дарлана неприемлемо. Адмирал убежден в преимуществах Национальной революции и ввел дискриминационные законы в Алжире. Мы должны воспользоваться хаосом на территории, чтобы убить его и заменить."
  FRA_communist_no_king_no_gaulle:0 "Коммунистическое восстание"
  FRA_communist_no_king_no_gaulle_desc:0 "Именно тогда, когда страна находилась на самом низком уровне, наши идеи были наиболее велики. Как во время Французской революции и Коммуны, потеря лидера — это то, с чего все начинается. Раньше это были Людовик XVI и Наполеон III, сегодня — Франсуа Дарлан!"
  FRA_gaulle_giraud_king:0 "Восстановить монархию"
  FRA_gaulle_giraud_king_desc:0 "В эти смутные времена Франции нужен сильный и объединяющий лидер. Нам не нужен новый император в лице маршала Петена, нам нужно возвращение монархов!"
  FRA_end_with_the_revolution_national:0 "Закончить Национальную Революцию"
  FRA_end_with_the_revolution_national_desc:0 "Пришло время положить конец ненавистной идеологии режима Виши. Это начало новой политической эры для нашего народа!"
  FRA_the_new_kingdom:0 "Новое Королевство"
  FRA_the_new_kingdom_desc:0 "Новое Королевство"
  UFRA_imperial_welfare:0 "Новые инвестиции"
  UFRA_imperial_welfare_desc:0 "Новые инвестиции"
  UFRA_imperial_war_industry:0 "Военные инвестиции в экономику"
  UFRA_imperial_war_industry_desc:0 "Военные инвестиции в экономику"
  UFRA_haussmanns_legacy:0 "Смешанный экономический план Наполеона"
  UFRA_haussmanns_legacy_desc:0 "Смешанная экономика Наполеона"