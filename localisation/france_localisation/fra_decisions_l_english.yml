 FRA_evacuation:0 "Coordinated evacuation"
 FRA_evacuation_desc:0 "The 1940 exodus of France is a massive flight of Belgian, Dutch and French populations in May-June 1940 when the German army invaded Belenux and the majority of French territory during the Battle of France. The extent of the exodus is partly due to the painful memory of the occupation of the regions invaded by Germany from 1914 to 1918."
 UFRA_total_evacuation:0 "Evacuate all civilians from [From.GetName]"
 UFRA_total_evacuation_desc:0 "The Germans are threatening even more the [From.GetName] that we have already partially evacuated, we absolutely must evacuate all the rest of the population from [From.GetName] before the enemy arrives."
 UFRA_return_home:0 "Bring the civilians back home"
 UFRA_return_home_desc:0 "The front as moved and our population is no longer in danger of the enemy. We can send our poor compatriots home!"
 UFVIC_return_home:0 "Repatriate fugitives home"
 UFVIC_return_home_desc:0 "The situation of the exiles has become disproportionate, and Germany is no longer a danger for us, we must send these poor French home."
 UFRA_evacuate_FROM:0 "Partially evacuate [From.GetName]"
 UFRA_evacuate_FROM_with_BEL:0 "Partially evacuate [From.GetName]"

