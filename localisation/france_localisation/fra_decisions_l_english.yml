 FRA_power_struggle_with_LoN_with_picture:0 "Power struggle between France and League of Nations"
 FRA_power_struggle_with_LoN_with_picture_desc:0 "Our kingdom is in a global geopolitical crisis with the League of Nations. If we do nothing, we risk starting a lost war ... Nevertheless, given the weakness of democracies, if we make a significant show of force, the League of Nations could retreat on his position. "
 FRA_liberation_of_scotland_with_picture:0 "Scotland question"
 FRA_liberation_of_scotland_with_picture_desc:0 "Scotland has been our ally for centuries, this alliance is even considered the oldest in the world. Today Scotland is under British occupation, we must liberate this country which is so dear to us. If we exert enough political pressure against the UK, then maybe they will accept independence."
 FRA_escalation_of_tensions_between_France_and_LoN:0 "Escalation of tensions between France and the League of Nations"
 FRA_pressure_uk:0 "Put pressure on the UK"
 FRA_systeme_francais_with_picture:0 "Système de prospérité Français"
 FRA_systeme_francais_with_picture_desc:0 "                                 Our kingdom is commercially isolated. The new                                  system called «Système de prospérité                                                   Français» allows us to seize the resources of                                        the countries put under the control of our                                             nation."
