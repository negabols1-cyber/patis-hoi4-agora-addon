 UFRA_spanish_intervention_category:1 "Intervention in the Spanish Civil War"
 UFRA_spanish_intervention_category_desc:0 "Groups all across the political spectrum want to intervene in the Spanish Civil War in one way or another. However, there is considerable concern that the war may spread to our country if we take too open a stance in support of one side. We must be careful to tread a narrow path if we want to ensure that a friendly government is left in control of Spain."
