 FRA_giraudist_side_full:0 "Resignation of De Gaulle"
 FRA_bop_assemblee_consultative_provisoire:0 "Provisional Consultative Assembly"
 FRA_bop_assemblee_consultative_provisoire_desc:0 "The Provisional Consultative Assembly is a French assembly representing resistance movements, political parties and territories engaged in the war alongside the Allies under the direction of the French Committee for National Liberation (CFLN)."
 FRA_bop_promise_new_government:0 "Promise the establishment of a new republic"
 FRA_bop_promise_new_government_desc:0 "Our pre-war institutions were too dissociated, and prevented us from establishing a strong response to the aggressor. For our new republic, we will need stronger presidential power."
 FRA_bop_put_old_government:0 "Promising to restore pre-war powers"
 FRA_bop_put_old_government_desc:0 "The Vichy regime is legitimate null and void. We will restore the pre-war French government."
 FRA_bop_promise_women_vote:0 "Give women the right to vote"
 FRA_bop_promise_women_vote_desc:0 "As soon as the enemy is driven out of the territory, the men and women of our country will elect the National Assembly which will decide sovereignly on the destinies of the Nation."
 FRA_bop_add_giraud_support:0 "Appoint Giraudist Commissioners"
 FRA_bop_add_giraud_support_desc:0 ""
 FRA_bop_add_gaulle_support:0 "Appoint Gaullist Commissioners"
 FRA_bop_add_gaulle_support_desc:0 ""
 FRA_bop_promise_kill_collabo:0 "Promise the trial of the collaborators"
 FRA_bop_promise_kill_collabo_desc:0 "The collaborators betrayed the Republic and France. Laval, Pétain, Darnant, Brazillac... At the liberation, we should make examples out of them."
 FRA_bop_promise_work_with_collabo:0 "Promise to welcome the loyals of Vichy"
 FRA_bop_promise_work_with_collabo_desc:0 "We cannot judge the loyals of Vichy. The situation was desperate and our population in great danger. If we want to give France a new chance, we will need those men."
 FRA_bop_liberty_of_expression:0 "Restoring freedom of expression"
 FRA_bop_liberty_of_expression_desc:0 ""
 FRA_bop_gaulle_radio_alger:0 "De Gaulle's speech to Radio-Alger"
 FRA_bop_gaulle_radio_alger_desc:0 ""
 FRA_bop_gaulle_tunis:0 "Strengthen De Gaulle's influence in Tunisia"
 FRA_bop_gaulle_tunis_desc:0 "Contact Lamine Bey in Tunis to assure us of his support"
 FRA_bop_gaulle_moroco:0 "Strengthen De Gaulle's influence in Morocco"
 FRA_bop_gaulle_moroco_desc:0 "Contact Sultan Mohammed V in Morocco to assure us of his support"
 FRA_bop_gaulle_AOF:0 "Strengthen De Gaulle's influence in West Africa"
 FRA_bop_gaulle_AOF_desc:0 ""
 FRA_bop_giraud_to_the_states:0 "Strengthen Giraud's influence in the United States"
 FRA_bop_giraud_to_the_states_desc:0 "Let's send Henri Giraud to the United States to ensure their support"
 FRA_bop_end_racial_laws:0 "Repeal racial discrimination laws"
 FRA_bop_end_racial_laws_desc:0 "We cannot tolerate discriminatory Vichy laws on our territory"
 FRA_bop_cremieux_decree:0 "Restore the Crémieux Decree"
 FRA_bop_cremieux_decree_desc:0 "Giraud has shown particular hostility towards the Crémieux decree, a decree giving French citizenship to the native Israelites of Algeria. We cannot allow this discrimination on our territory."
 FRA_bop_promise_french_union:0 "Promise a French Union"
 FRA_bop_promise_french_union_desc:0 "It is time to proclaim a new France, a France on a global scale, in which all parts of our kingdom are united. When the metropolis is free, we will organize referendums everywhere to confirm the will of the people to be part of this new and greater France."
 
 UFRA_weapons_purchases_category:1 "Purchase Weapons in [USA.GetNameDef]"
 UFRA_weapons_purchases_category_desc:0 "With our industry still playing catch-up, looking abroad for modern weapons might be the only way to bring our armed forces up to modern standards."
