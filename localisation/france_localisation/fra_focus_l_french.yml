 VIC_armistice_with_germany:0 "Armistice avec l'allemagne"
 VIC_armistice_with_germany_desc:0 "En ces heures douloureuses, je pense aux malheureux réfugiés qui sillonnent nos routes. Je leur exprime ma compassion et ma sollicitude. C’est le cœur serré que je vous dis aujourd’hui qu’il faut cesser le combat. Je me suis adressé cette nuit à l’adversaire pour lui demander s’il est prêt à rechercher avec nous, entre soldats, après la lutte et dans l’honneur, les moyens de mettre un terme aux hostilités."
 VIC_control_newspapers:0 "Contrôler les journaux"
 VIC_control_newspapers_desc:0 "Les journaux ont dégénerés et devenus anti-français, excepter quelques uns. A partir de maintenant seul le gouvernement validera les journaux qui seront publiés."
 UFRA_VIC_chantiers_jeunesse:0 "Les chantiers de la jeunesse"
 UFRA_VIC_chantiers_jeunesse_desc:0 "Les Chantiers de la jeunesse française, sera une organisation de jeunesses, non pas commes les scouts mias pour former et aider à booster la jeunesse nationaliste."
 UFRA_VIC_put_opponents_to_work:0 "Livré a l'allemagne les opposants de l'état"
 UFRA_VIC_put_opponents_to_work_desc:0 ""
 VIC_crush_political_dissent:0 "Ecraser les opposants politiques"
 VIC_crush_political_dissent_desc:0 "Nous sommes en position de force, mais nombeux sont ceux tapis dans l'ombre, n'attendant de nous la moindre faiblesse. Nous ne leurs donnerons pas cette chance."
 UFRA_VIC_aids_for_families:0 "Aides pour les familles"
 UFRA_VIC_aids_for_families_desc:0 "La famille est le ciment de notre nation. Les aides vont nous assurer d'avoir des familles fortes et encouragera ainsi à avoir plus d'enfants."
 UFRA_VIC_ideological_fanaticism:0 "Education politique"
 UFRA_VIC_ideological_fanaticism_desc:0 "Nos objectifs ainsi que nos valeurs politiques valent tout autant de mourir que la foi. N'importe quel suiveur devrait être prêt à affronter la mort, et ceux qui s'y soustraient devront l'affronter."
 UFRA_VIC_light_medium_armor:0 "Maintenir un savoir faire sur les chars"
 UFRA_VIC_light_medium_armor_desc:0 "Les allemands nous interdissent la construction de matériel lourd, mais il nous faut absolument maintenir un savoir-faire sur ce domaine pour ne pas attraper un retard trop conséquent. Il nous faudra juste le faire discrétement..."