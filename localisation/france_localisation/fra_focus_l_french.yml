l_french:
 UFRA_sncf:0 "SNCF"
 UFRA_sncf_desc:0 "La nationalisation des principales comapagnies de chemin de fer a mené à la création de la société nationale des chemins de fer. Cela va grandement améliorer le transport civil ainsi que les objectifs militaires."
 UFRA_sahara_census:0 "The Sahara Census"
 UFRA_sahara_census_desc:0 "USELESS FOR NOW ! DO NOT TAKE ! Our vast African territories are full of ressources and manpower. But the sad reality is that not all our saharian territories are well known. It is time to send teams to map and get information from the heart of the desert."
 UFRA_gerboise_bleue:0 "Gerboise Bleue"
 UFRA_gerboise_bleue_desc:0 "Les tests initiaux dans la science nucléaire ont montrés des résultats prometteurs. Aussi sa puissance peut nous donner une arme comme l'humanité n'en n'a jamais vu."
 UFRA_vienot_agreements:0 "Les accords Vienot" 
 UFRA_vienot_agreements_desc:0 "Il est temps pour les syriens et les libanais d'obtenir leur liberté. La France va inviter les représentants du peuple syrien à des négociations sur l'indépendance à Paris."
 UFRA_social_nationalism:0 "Corporatisme"
 UFRA_social_nationalism_desc:0 "Nous allons organiser la société française par groupes d'entreprises, tels que l'agriculture, la main d'oeuvre, le militaire, le scientifique ou associations de guildes sur la base de leurs interêts communs."
 UFRA_decentralize_the_state:0 "Décentraliser l'État"
 UFRA_decentralize_the_state_desc:0 "La bureauratie française est convolutée, inefficace et globalement coûteuse. C'est aussi préjudiciable aux régions et de leurs identités. Cela doit être stoppé."
 UFRA_state_catholism:0 " La Fille ainée de l'Église"
 UFRA_state_catholism_desc:0 "La France était appelé la fille ainée de l'Église par le pape, mais la Révolution a détruit ce quoi nous tenions pour cher. Comme les vieux rois français et les templiers, nous ferons une fois de plus de la France une terre sacrée! Sacré-coeur de Jésus, soyez l'espoir et le salut de la France!"
 UFRA_camelots_du_roi:0 "Camelots du Roy"
 UFRA_camelots_du_roi_desc:0 "Les camelots du roi est une organisation de jeunesse de l'Action française. Ils devienfront désormais la meilleure organisation de jeunesse officielle. Longue vie aux camelots du Roy, pour servir la France et le roi est leur devise!"
 UFRA_operation_clovis:0 "Opération Clovis"
 UFRA_operation_clovis_desc:0 "Clovis, le premier roi de France, avait son royaume d'origine en actuelle Belgique. Telle sont nos frontières naturelle et nous devrions leur réclamer!"
 UFRA_up_with_jean_darc:0 "démonter les symboles républicains"
 UFRA_up_with_jean_darc_desc:0 "Il est temps de mettre le coup de grace à la République. Liberté, Egalité, Fraternité est un mensonge et devra périr en tant que tel!"
 UFRA_code_civil:0 "Renforcer notre présence dans le monde"
 UFRA_code_civil_desc:0 "Le code napoléonien , officiellement le Code Civil des français est le code établit sous le consulat français en 1804 et encore en activité. Nous créerons un nouveau Code Civil établissant que le troisième Empire français sera voté par référendum."
 UFRA_meritocracy:0 "Méritocratie"
 UFRA_meritocracy_desc:0 "Le régime napoléonien comme ses ancêtres, devrait être basé sur le mérite. Un fils de bouché devrait être capable d'être maréchal d'Empire si il le mérite!"
 UFRA_militarist_society:0 "Société militariste"
 UFRA_militarist_society_desc:0 "Nos voisins sont ambitieux et agressifs. Nous devons adopter une voie plus militariste afin de protéger nous-même ainsi que notre façon devivre. Gloire à l'Armée!"
 UFRA_continental_system:0 "Système Continental"
 UFRA_continental_system_desc:0 "Lors de son règne Napoléon Bonaparte Empereur des français, à défaut de pouvoir attaquer le Royaume-Uni,  il dédcida d'attaquer son économie en fermant toute l'Europe continentale au commerce de marchande britannique. Ainsi il éseprait pouvoir faire plier la puissante city de Londres."
 UFRA_return_to_iberia:0 "Maîtriser l'Ibérie"
 UFRA_return_to_iberia_desc:0 "Napoléon a echoué à sécuriser l'Ibérie, mais maintenant l'Ibérie est en pagaille. Notre temps est venu."
 UFRA_save_quebec:0 "Sauver le Québec"
 UFRA_save_quebec_desc:0 "Ces terres francophones sont restées bien trop longtemps sous la domination britannique, libérons nos frères francophones! Ou comme l'eut dit le général De Gaulles: "Vive le Québec libre!"."
 UFRA_medium_tanks:0 "Mettre a jour le Renault D1"
 UFRA_return_to_italy:0 "La question italienne"
 UFRA_return_to_italy_desc:0 "Depuis l'unification de l'Italie au XIXème siècle, cette dernière n'a cessé de connaître les marasmes politiques la menant constamment à sa perte. Redressons notre voisin transalpin une bonne fois pour toute!"
 UFRA_form_the_milice:0 "Armée d'occupation"
 UFRA_form_the_milice_desc:0 "Nous devons créer une institution capable d'occuper nos futurs conquêtes, et rammner la paix à notre société. Nous allons créer la "Milice française", une organisation paramilitaire politique."
 UFRA_chantiers_jeunesse:0 "Les chantiers de la jeunesse"
 UFRA_chantiers_jeunesse_desc:0 "Les Chantiers de la jeunesse française, sera une organisation de jeunesses, non pas commes les scouts mias pour former et aider à booster la jeunesse nationaliste."
 UFRA_industrialists_alliance:0 "Alliance avec les industriels"
 UFRA_industrialists_alliance_desc:0 "Nombre de familles d'industriel partage les mêmes idéaux que nous, et supporte notre cause. l'Oréal, Lessieur... Tellement de connections qui nous aideront à construire la Nouvelle France!"
 UFRA_stop_moral_decay:0 "Arrêter la décadence morale"
 UFRA_stop_moral_decay_desc:0 "Il est temps de couper les racines du problème, et détruire la décadence  morale une bonne fois pour toute. Pour cela nous auront à faire des choix"
 UFRA_furia_francese:0 "Furia Francese"
 UFRA_furia_francese_desc:0 "En 1495, les Italiens, à la bataille de Fornoue,ont dépeint le courage et la détermination français comme "la Furia Francese", la furie française. Il est temps pour les français de regagner cette furie et la déverser sur nos ennemies!"
 UFRA_update_weaponry:0 "Mettre à jour l'armement"
 UFRA_update_weaponry_desc:0 "Les innovations dans l'armement vont vites ces derniers temps. Nous avons à travailler dur pour garder nos armes à un niveau de développement maximal."
 UFRA_improve_motor_industry:0 "Améliorer l'industrie du moteur"
 UFRA_improve_motor_industry_desc:0 "La motorisation est le futur de la guerre. Il est temps que nous soyons sûrs que l'armée française ne soit pas bloquée dans le passé!"
 UFRA_commit_air_industry:0 "S'engager dans l'industrie aéronautique"
 UFRA_commit_air_industry_desc:0 "La maîtrise des airs est désormais une clé pour vaincre. Nous avons besoin d'augmenter nos investissements dans les compagnies aéronautiques!"
 UFRA_further_armament_program:0 "Programme d'armement supplémentaire"
 UFRA_further_armament_program_desc:0 "La guerre moderne ne peut être réaliser qu'avec des outils modernes. Tu es aussi bon que tes outils, n'est-ce pas ?"
 UFRA_decolonization:0 "Déconolisation"
 UFRA_decolonization_desc:0 "Il est temps pour nous de laisser les autres pays se diriger par eux-mêmes. Tout le monde mérite son autonomie. C'est la fin de l'Empire colonial français."
 UFRA_transaharien:0 "Le Trans-Saharien"
 UFRA_transaharien_desc:0 "La voie ferré Trans-Saharienne est le projet de construire uen voie de chemin de fer allant du sud de l'Algérie au Sahara africain. C'est un moyen de connecter les mines de charbons et aisni renforcer les échanges à travers l'Afrique du Nord, nouant ainsi l'ensemble de l'Empire français, et connectant également l'Afrique du Nord au Subsaharien africain." 
 UFRA_syria_oil:0 "Pétrole syrien"
 UFRA_syria_oil_desc:0 "Le carburant. C'est ce dont la France a désespérément besoin. Heureusement notre proctetorat de Syrie en a beaucoup ."
 UFRA_indochina_mines:0 "Mines Indochinoises"
 UFRA_indochina_mines_desc:0 "L'Indochine, la perle de l'Empire français. C'est rempli de richesses n'attendant que nous pour être saisit"
 UFRA_excolonies_invest:0 "Investir dans nos nouveaux alliés"
 UFRA_excolonies_invest_desc:0 ""
 UFRA_secure_contracts:0 "Sécuriser les contrats"
 UFRA_secure_contracts_desc:0 "Notre relation privilégiée avec nos anciennes pour obtenir d'eux des contrats de ressources."
 UFRA_excolonies_rd:0 "Partage de connaissance"
 UFRA_excolonies_rd_desc:0 "Pour s'assurer un développement égal avec nos alliés, nous allons partager des technologies et créer un centre de rercheche pour échanger nos connaissances."
 UFRA_strenghten_foreign_legion:0 "Renforcer la Légion Étrangère"
 UFRA_strenghten_foreign_legion_desc:0 "La Légion Étrangère est une force d'élite, avec des hommes venant de tous les pays fière de servir la France. Il faut l'étendre et la promouvoir."
 UFRA_secret_services:0 "Renseignement Généraux"
 UFRA_secret_services_desc:0 "Le savoir est un pouvoir. Pour autant, nous devons organiser nos services de renseignements en une entité officielle."
 UFRA_integrate_rhine_borders:0 "Intégrer les frontières du Rhin"
 UFRA_integrate_rhine_borders_desc:0 "Les frontières naturelles de la France sont des théories politiques et géographiques developpées en France, notamment urant la Révolution française. Elles correspondent au rhin, l'océan Atlantique, la mer méditérranée, les Pyrenées et les Alpes, selon les révolutionnaires."
 UFRA_paneuropanism:0 "Paneuropéanisme"
 UFRA_paneuropanism_desc:0 "Après des siècles de guerre et de souffrance, peut-être les pays européens devraient se rendre compte qu'ils partagent tellement. N'est-ce pas l'évolution naturelle d'avoir une Europe culturellement et géopolitiquement unie ?"
 UFRA_charlemagne_claims:0 "Réclamations de Charlemagne"
 UFRA_charlemagne_claims_desc:0 "Réclamations de Charlemagne"
 UFRA_roman_claims:0 "Réclamations romaines"
 UFRA_roman_claims_desc:0 "Qui aurait su ? Que la Gaule, la France, la conquête personnelle de César, aurait un jour essayer de récuperer l'Empire romain ! Pourtant ce jour est arrivé !"
 UFRA_attack_the_slavs:0 "Frapper à l'Est"
 UFRA_attack_the_slavs_desc:0 "Frapper à l'Est"
 UFRA_empire_from_west_to_east:0 "De l'altantique à l'Oural"
 UFRA_empire_from_west_to_east_desc:0 "de l'Atlantique à l'Oural"
 UFRA_transeuropean:0 "le trans-européen"
 UFRA_transeuropean_desc:0 "le trans-européen"
 UFRA_the_capital:0 "Déplacer les capitaux"
 UFRA_the_capital_desc:0 "Maintenant que nous avons uni l'Europe, peut-etre est-il temps de trouver de nouveaux capitaux ?"
 UFRA_lingua_franka:0 "Lingua Franka"
 UFRA_lingua_franka_desc:0 "Le français était autrefois la langue de la puissance et de la démocratie. Avec l'Europe à notre portée, cela peut le redevenir de nouveau. A travers l'école et la propagande, la langue française devra etre enseignée à tous les nouveaux citoyens européens!"
 UFRA_air_focus:0 "Armée de l'Air"
 UFRA_ideological_fanaticism:0 "Education politique"
 UFRA_ideological_fanaticism_desc:0 "Nos objectifs ainsi que nos valeurs politiques valent tout autant de mourir que la foi. N'importe quel suiveur devrait être prêt à affronter la mort, et ceux qui s'y soustraient devront l'affronter."
 UFRA_reinforce_la_royale:0 "Renforcer la Royale"
 UFRA_reinforce_la_royale_desc:0 "La marine française, aussi appelée la Royale, a encore quelques ajustements à faire si nous voulons affronter la Royal Navy ou la Reggia Marina. Nous avons besoins de rapidement augmenter la prduction au travers d'un travail rigoureux!"
 UFRA_foundations_for_a_european_union:0 "Vers une Union européenne"
 UFRA_foundations_for_a_european_union_desc:0 "Maintenant que la menace fasciste a été éliminée en Europe, il est temps de reconstruire et de penser à la paix. Peut-être que les rêves d'une uniuon européenne sont devenus réalité ?"
 UFRA_community_for_coal_and_steel:0 "Charbon européen et la communauté de l'acier"
 UFRA_community_for_coal_and_steel_desc:0 "Le premier but de notre union va être de faciliter la reconstruction, les échanges et le commerce entre nos pays. La paix va construire une économie forte!"
 UFRA_european_investments:0 "Investissements européens"
 UFRA_european_investments_desc:0 "Certains pays ont plus de mal que d'autre à reconstruire. En tant que tel une banque centrale et un investissement central sont nécessaires."
 UFRA_cern:0 "CERN"
 UFRA_cern_desc:0 "Le centre européen de la recherche nucléaire réunira les esprits les plus brillants sur la question atomique!"
 UFRA_pool_technical_know_how:0 "Savoir faire technique européen"
 UFRA_pool_technical_know_how_desc:0 "Chaque pays dans l'union a sa spécialité. Regrouper chacun nd'entre eux nous donnera un avantage considérable ."
 UFRA_the_euro_money:0 "L'Euro"
 UFRA_the_euro_money_desc:0 "Pour faciliter les échanges et la coopération, une monnaie unique doiut être créée."
 UFRA_fondation_for_european_army:0 "Fondation d'une armée européenne"
 UFRA_fondation_for_european_army_desc:0 "Quelques pays ne sont pas ouverts à une armée européenne, mais peut-être que nous pouvons d'ores et déjà partager nos stratégies et entraînements."
 UFRA_european_navy_regulations:0 "Flotte européenne standard"
 UFRA_european_navy_regulations_desc:0 "Pour que les marines travaillent ensembles efficacment, il est nécessaire de réguler les équipements ainsi que les entraînements."
 UFRA_european_federal_state:0 "Etat fédéral européen"
 UFRA_european_federal_state_desc:0 "Unissons-nous sous une seule puissance, un état fédéral européen!"
 UFRA_communal_army:0 "Une armée communale"
 UFRA_communal_army_desc:0 "Frères aux Armes, pour notre lutte! Pour la victoire de tous les travailleurs!"
 UFRA_regiment_normandie:0 "Le Regiment Normandie"
 UFRA_regiment_normandie_desc:0 "Le Normandie Niémen, une escadrille de fougueux pilotes français venus combattre le fascime en Union Soviétique. La seule force étrangère ayant fournit des hommes aux soviets dans la lutte infernale contre les nazies"
 UFRA_political_commissars:0 "Commissaires politiques"
 UFRA_political_commissars_desc:0 "Il est nécessaire d'encadrer l'armée par une structure politique sur les champs de combats. Dans ce but les commissaires politiques répondront à ce besoin. "
 UFRA_state_atheism:0 "Etat athé"
 UFRA_state_atheism_desc:0 "Pas de dieux et maîtres.Il revient à l'humanité et à elle seule de trouver le bonheur et s'aider les uns les autres. PLus aucun culte ne devrait régner en France!"
 UFRA_further_dockyard_expension:0 "Nouvelle expansion des chantiers navals"
 UFRA_further_dockyard_expension_desc:0 "Afin de répondre aux menaces de plus en plus pressante en Europe ainsi que dans le monde, il nous faut affirmer une marine forte capable de répondre aux dangers toujours plus présents "
 UFRA_operation_guillaume_le_conquerant:0 "Opération Guillaume Le Conquerant"
 UFRA_operation_guillaume_le_conquerant_desc:0 "Comme notre lointain ancêtre il nous revient de traverser ce court brin de mer qu'est la manche afin de corriger nos turbulents voisins anglosaxons"
 UFRA_war_games:0 "Manoeuvres Militaires"
 UFRA_war_games_desc:0 "Les allemands remobilisent et violent le traité de Versailles. Il est temps de se préparer! Les manoeuvres miliatires conduiront bientôt les allemands à la frontière belge!"
 UFRA_ils_ne_passeront_pas:0 "Ils Ne Passeront Pas"
 UFRA_ils_ne_passeront_pas_desc:0 "Ils ne passeront pas était le slogans des soldats français à Verdun. Nous avons déjà stopper les envahisseur une première fois et nous le referons!"
 UFRA_rebuild_the_spanish_fleet:0 "Reconstruire la marine espagnole"
 UFRA_rebuild_the_spanish_fleet_desc:0 "Fut un temps ou l'empire espagnole était l'un des plus puissants, et la simple vue de sa marine un danger! Nous allons reconstruire cette flotte et la ramener à son apogée!"
 UFRA_hydroelectricity:0 "Investir dans l'Hydroélectrique"
 UFRA_hydroelectricity_desc:0 "Grâce a nos nombreux massifs montagneux, la France est particulièrement apte a générer de l'électricité avec des barrages. C'est une énergie peu cher, et surtoût renouvelable !"
 UFRA_heavy_water:0 "Génerer de l'eau lourde"
 UFRA_heavy_water_desc:0 "Présente naturellemet dans l'eau, l'eau lourde peut être isolé par électrolyse. Elle sert le rôle de modérateur dans les réacteurs nucléaire, et aide a la création de Plutonium nécessaire a la fabrication de bombe atomique. Nos barrages sont idéaux pour cette tache, car ils fournissent l'eau et l'électricité requise pour l'électrolyse."
 UFRA_send_aid_to_spain:0 "Envoyer de l'aide en Espagne"
 UFRA_send_aid_to_spain_desc:0 "l'Espagne est dans un grand besoin de ravitaillement pour arrêter les milices et la résistance . Nous allons aider la soeur de la couronne."
 UFRA_assassinate_mussolini:0 "Assassiner Mussolini"
 UFRA_assassinate_mussolini_desc:0 "Mussolini est un fou. Ce donr l'Italie a besoin, c'est de retrouver l'ancien régime. Elle a besoin d'un roi."
 UFRA_prepare_italian_coup:0 "Préparer le coup d'Etat italien"
 UFRA_prepare_italian_coup_desc:0 ""
 UFRA_heirs_of_the_french_revolution:0 "Héritiers de la Révolution française"
 UFRA_heirs_of_the_french_revolution_desc:0 "Aucun autre partie ne peut d'avantage se réclamer héritiers de la Révolution autant que nous. Aux armes citoyens, le jour de gloire est arrivé!"
 UFRA_jaccobinisme:0 "Jacobinisme"
 UFRA_jaccobinisme_desc:0 "La France est unique et unie. Aucune région ne devrait ,avoir de quelconques privilèges. L'unité est notre force."
 UFRA_regionalisme:0 "Régionalisme"
 UFRA_regionalisme_desc:0 "Chaque région mérite de vois sa propre identité préservée. Chaque régions a le droit de prendre sa décision. Ainsi cela devra être la France."
 UFRA_socialist_anti_colonial_commitee:0 "Comité socialiste anti-colonialiste"
 UFRA_socialist_anti_colonial_commitee_desc:0 "l'Impérialisme est une maladie qui devrait être éradiquer. Les gens ont le droit de décider d'eux-mêmes."
 UFRA_factory_towns:0 "Usines en ville"
 UFRA_factory_towns_desc:0 ""
 UFRA_european_revolution:0 "Libérer nos voisins"
 UFRA_european_revolution_desc:0 ""
 UFRA_west_european_union_of_socialists_republics:0 "Union Ouest-européenne des Républiques socialistes"
 UFRA_west_european_union_of_socialists_republics_desc:0 "Maintenant que nous avons achebé la Révolution prolétarienne en Europe, we nous deevons comme nos frères de l'Est nous organiser, en unions de Républiques."
 UFRA_marxism_leninism:0 "Léninisme-Marxisme"
 UFRA_marxism_leninism_desc:0 "Nous reconnaissons seulement la plus vrai forme de communisme. Celui que Lénine et Maarx ont théorisé."
 UFRA_provide_for_the_people:0 "Apporter aux gens"
 UFRA_provide_for_the_people_desc:0 ""
 UFRA_syndicalism:0 "Syndicalisme"
 UFRA_syndicalism_desc:0 "Le Syndicalisme est une théorie économique du mouvement ouvrier. Sa principale idée est l'établissement d'une organisation locale de travailleurs et l'avancement de la demande des droits aux travailleurs au travers de grèves. La CGT est la principale représentation de ce mouvemlent en France."
 UFRA_collectivization:0 "Collectivisation"
 UFRA_collectivization_desc:0 "A bas la propriété, collectivisons les terres entre paysans"
 UFRA_world_revolution:0 "Révolution mondiale"
 UFRA_world_revolution_desc:0 ""
 UFRA_anti_nazi_anti_soviet:0 "Ni Nazi ou Soviet"
 UFRA_anti_nazi_anti_soviet_desc:0 "Le soviétisme ou la nazisme sont tous deux des régimes haineux et méprisable. La France doit prendre les devants en stoppant cette infection ."
 UFRA_croix_de_feux:0 "Croix-De-Feu"
 UFRA_croix_de_feux_desc:0 "La Croix-de-Feu est principalement un groupe de vétérans de la première guerre, ceux qui ont été décoré de la Croix de guerre 1914-1918. Depuis le Lieutenant-Colonel François de La Rocque, a prit le relais en 1930, le mouvement est partisan d'un réarmement contre le danger allemand, supportant le corporatisme et capitalistes et prolétariat ."
 UFRA_latin_heritage:0 "Pousser l'héritage latin"
 UFRA_latin_heritage_desc:0 "La France est de loin le pays le plus latinisé. En tant que tel nous devrions améliorer nos relations avec Mussolini et l'Italie."
 UFRA_honneur_et_traditions:0 "Honneur et Traditions"
 UFRA_honneur_et_traditions_desc:0 "Honneur et traditions, tel est notre héritage romain. Ces valeurs brûlent dan le coeur de chaque citoyens français."
 UFRA_german_military_exchange:0 "Echange militaire allemand"
 UFRA_german_military_exchange_desc:0 "L'Allemagne a perfectionné l'art de la guerre, ils sont réellement les héritiers du royaume prussien. Ensemble nous pouvons apprendre beacoup et rendre nos armées invincibles."
 UFRA_soviet_industrial_aid:0 "Aide industrielle soviétique"
 UFRA_soviet_industrial_aid_desc:0 ""
 UFRA_second_paris_renovation:0 "Seconde rénovation de Paris"
 UFRA_second_paris_renovation_desc:0 "Notre nouvelle prospérité économique doit être refleter dans notre capitale. Nous ferons de Paris la plus grande ville d'Europe. De tels rénovations n'ont plus eu lieu depuis le barron Hossman et Napoléon III."
 UFRA_the_new_worl_order:0 "Le nouvel ordre mondial"
 UFRA_the_new_worl_order_desc:0 "Avec l'aide de nos alliés nous avons forger un monde nouveau. Rien ne peut arrêter la nouvelle Europe. Vive la France !"
 UFRA_emulate_napoleon_i:0 "Imiter Napoleon Ier"
 UFRA_emulate_napoleon_i_desc:0 "Un grand Empire a besoin  d'un dirigeant fort. En tant que tel, je dois dessiner mes inspirations de la plus grande peronnalité française à avoir vécu."
 UFRA_emulate_napoleon_iii:0 "Un Empire libéral"
 UFRA_emulate_napoleon_iii_desc:0 "Tel que mon auguste ancêtre, Napoleon le troisième du nom, Je devrais être un empereur moderne et libéral."
 UFRA_real_politik:0 "Vrai politique"
 UFRA_real_politik_desc:0 "Vrai politique"
 UFRA_protect_workers:0 "Protéger les classes ouvrières"
 UFRA_protect_workers_desc:0 "Protéger la classe ouvrière"
 UFRA_cooperation_with_italy:0 "Coopération avec l'Italie"
 UFRA_cooperation_with_italy_desc:0 "Coopération avec l'Italie"
 UFRA_celtic_paganism:0 "Mysticisme"
 UFRA_celtic_paganism_desc:0 "Maintenant que la France est sous notre contrôle, nous devons couper court à la décadence et à la décadence morale. Nous allons prêcher le retour aux anciennes divinités. A la religion celte, les gaulois, nos ancêtres. Toutatis, Esus et Taranis."
 UFRA_classicism:0 "Classicisme"
 UFRA_classicism_desc:0 "Le Classicisme est le plus europeén et plus noble art à exister. Il est une inspiration pour notre peuple . Notre régime encouragera et propagera le Classicisme ."
 UFRA_state_catholism_2:0 "Obtenir le soutien du Clergé"
 UFRA_state_catholism_2_desc:0 "Nos idéaux sont profondémment chrétiens, et en tant que tel sont partagés avec beacoup de membres du clergé catholique français."
 UFRA_aids_for_families:0 "Aides pour les familles"
 UFRA_aids_for_families_desc:0 "La famille est le ciment de notre nation. Les aides vont nous assurer d'avoir des familles fortes et encouragera ainsi à avoir plus d'enfants."
 UFRA_control_newspapers:0 "Contrôler les journaux"
 UFRA_control_newspapers_desc:0 "Les journaux ont dégénerés et devenus anti-français, excepter quelques uns. A partir de maintenant seul le gouvernement validera les journaux qui seront publiés."
 UFRA_give_full_powers:0 "Donner les pleins pouvoirs"
 UFRA_give_full_powers_desc:0 "Le moment est arrivé, c'est notre seule chance pour sauver la France, emparons-nous du pouvoir!"
 UFRA_new_national_holiday_1:0 "Changer la date la fête nationale"
 UFRA_new_national_holiday_1_desc:0 ""
 UFRA_new_national_holiday:0 "Changer la date la fête nationale"
 UFRA_new_national_holiday_desc:0 ""
 UFRA_crush_political_dissent:0 "Ecraser les opposants politiques"
 UFRA_crush_political_dissent_desc:0 "Nous sommes en position de force, mais nombeux sont ceux tapis dans l'ombre, n'attendant de nous la moindre faiblesse. Nous ne leurs donnerons pas cette chance."
 UFRA_dismiss_af:0 "Dissoudre l'Action française"
 UFRA_dismiss_af_desc:0 "Un temps utile, l'Action française n'a tout simplment pas les mêmes objectifs que nous. Notre parternariat s'arrête ici."
 UFRA_work_with_af:0 "Continuer la Collaboration avec l'AF"
 UFRA_work_with_af_desc:0 "Notre alliance l'Action française était fructueuse. Les idées de Maurras sont les moyens de sauver la France."
 UFRA_royal_dictatorship:0 "Dictature Royale"
 UFRA_royal_dictatorship_desc:0 "Dictature royale"
 UFRA_local_democratie:0 "Démocratie locale"
 UFRA_local_democratie:0 "L'idée de Maurras était de décentraliser l'Etat, liasser les régions travailler en toute autonomie avec les parlemantaires locaux, avec un Roi bienveillant à la tête de l'Etat."
 UFRA_king_jean_urbanisation_program:0 "Programme d'Urbanisation du Roi Jean"
 UFRA_king_jean_urbanisation_program_desc:0 "Programme d'urbanisation du Roi Jean"
 UFRA_kings_arsenal:0 "Arsenal Royale"
 UFRA_kings_arsenal_desc:0 "Arsenal Royale"
 UFRA_kings_grant:0 "Subventions du roi"
 UFRA_kings_grant_desc:0 "Subventions du roi"
 UFRA_republic_lives:0 "La Démocratie prévaut"
 UFRA_republic_lives_desc:0 "La Démocratie prévaut"
 UFRA_economic_policies:0 "Politiques économiques"
 UFRA_economic_policies_desc:0 "La France a besoin d'une direction économique. C'est un tournant pour notre économie. Notre choix forgera notre futur."
 UFRA_third_position:0 "La troisième position"
 UFRA_third_position_desc:0 "La troisième position position"
 UFRA_left:0 "Politiques sociales"
 UFRA_left_desc:0 "Politiques sociales"
 UFRA_right:0 "Politiques Capitalistes"
 UFRA_right_desc:0 "Politiques Capitalistes"
 UFRA_free_market:0 "Libre marché"
 UFRA_free_market_desc:0 "Libre marché"
 UFRA_economic_freedom:0 "Liberté économique"
 UFRA_economic_freedom_desc:0 "Liberté" économique"
 UFRA_natural_inequalities:0 "Coopération des classes"
 UFRA_natural_inequalities_desc:0 "Coopération des classes"
 UFRA_open_to_the_world:0 "Direction Diplomatique de la France"
 UFRA_open_to_the_world_desc:0 "Direction diplomatique de la France"
 UFRA_mend_the_christian_schism:0 "Réparer le schisme"
 UFRA_mend_the_christian_schism_desc:0 "depuis la chute de l'Empire romain d'Occident, les églises orientales et occidentales onnt été en perpetuel conflit. Il est temps de cicatriser la plaie."
 UFRA_foreign_policy:0 "Le coq dans le monde"
 UFRA_foreign_policy_desc:0 "Le coq dans le monde"
 UFRA_diplomatic_ussr:0 "Mission diplomatique en Union Soviétique"
 UFRA_diplomatic_ussr_desc:0 "Mission diplomatique en URSS"
 UFRA_eastern_policy:0 "Politique Orientale"
 UFRA_eastern_policy_desc:0 "La France a toujours été grandement impliquée dans la diplomatie chinoise. Le dragon de l'Est est en morceau et le Japon s'intéresse à nos territoires dans le Pacifique. Nous devons agir rapidement."
 UFRA_support_china:0 "Mission diplomatique en Chine"
 UFRA_support_china_desc:0 "Mission diplomatique en Chine"
 UFRA_invest_in_china:0 "Investir en Chine"
 UFRA_invest_in_china_desc:0 "Tchan Kai Shek est le véritable leader de la Chine, le seul légitime. Donc nous devons notre politique en l'aidant."
 UFRA_communist_china:0 "Mission diplomatique en Chine communiste"
 UFRA_communist_china_desc:0 "Attendez c'est lesquels les chinois qui étaient alliés aux nazis?"
 UFRA_send_weapons_to_mao:0 "Envoyez des armes à Mao"
 UFRA_send_weapons_to_mao_desc:0 "Misez sur Mao et les communistes est un parie risqué, mais il peut s'avérer payant."
 UFRA_non_aggression_japan:0 "Mission diplomatique au Japon"
 UFRA_non_aggression_japan_desc:0 "Mission diplomatique au Japon"
 UFRA_sign_treaty:0 "Traité de non-agression avec le Japon"
 UFRA_sign_treaty_desc:0 "Nous devrions prioriser un apaisement avec le Japon et les laisser agir librement dans le Pacifique, aussi longtemps qu'ils ne toucheront pas à nos territoires."
 UFRA_invite_to_faction:0 "Relation poussée"
 UFRA_invite_to_faction_desc:0 "Relation poussée"
 UFRA_post_war_reconstruction:0 "Reconstruction d'Après-guerre"
 UFRA_post_war_reconstruction_desc:0 "Reconstruction d'Après-guerre"
 UFRA_future_of_republic:0 "Le futur de la République"
 UFRA_future_of_republic_desc:0 "Le future de la République"
 UFRA_modify_the_constitution:0 "Survivant de la IIIème République"
 UFRA_modify_the_constitution_desc:0 "La IIIème République a survécu à la tempête. Nos ennemies sont défaits, et nous pouvons reconstruire nos institutions."
 UFRA_the_fourth_republic:0 "La IVème République"
 UFRA_the_fourth_republic_desc:0 "La IIIème République est morte, il est dorénavant temps de reconstruire une nouvelle République."
 UFRA_degaule_presidency:0 "De Gaulle à la Présidence"
 UFRA_degaule_presidency_desc:0 "Il est l'homme du 18 juin 1940, celui nqui a dit non à la trahison de Vichy. Il est celui qui a préservé l'honneur et l'intégrité de la France en des temps obscurs. Nul doute que ce dernier saura briguer à merveille un mandat à l'Elyssé"
 UFRA_national_television0:0 "Fonder l'ORTF"
 UFRA_national_television0_desc:0 "Avoir les chaînes de télévisons a notre service nous permettra de ne montrer que ce que le peuple doit voir"
 UFRA_trial_of_collaborators:0 "Procès des collabos"
 UFRA_trial_of_collaborators_desc:0 "Les collaborateurs ont trahi la République et la France. Laval, Pétain, Darnant, Brazillac... Nous devrions faire d'eux des exemples."
 UFRA_marshall_plan:0 "Plan Marshall"
 UFRA_marshall_plan_desc:0 "Face aux destructions colossales qu'affichent notre pays, il s'impose nécessaire une aide extérieur. Le plan Marshall remplira à brio ce rôle"
 UFRA_gladius:0 "Gladio"
 UFRA_gladius_desc:0 "Operation Gladio est le nom de code pour "rester-derrière" opérations de résistance proposées par les USA, pour une potentielle invsion du pacte de Varsovie et de conquête de l'Europe."
 UFRA_purge_communist_rot:0 "Purger les émeutes communistes"
 UFRA_purge_communist_rot_desc:0 "Purger les émeutes communistes"
 UFRA_the_af_wins:0 "Action Francaise Alliance"
 UFRA_the_af_wins_desc:0 "Action Francaise Alliance"
 UFRA_nationalism:0 "Nationalisme Français"
 UFRA_nationalism_desc:0 "Le nationalsime français est unique. Il est né durant la Guerre de cent ans avec l'Angleterre, et perfectionné durant la Révolution. Mais il est doit être adopté dans tous les apects de la vie en société, pour sauver la France."
 UFRA_the_split_switzerland:0 "Ultimatum à la Suisse"
 UFRA_the_split_switzerland_desc:0 "Pendant trop longtemps la Suisse aura été la plaie de l'Europe, à vivre en totale autarcie. Ilest temps de résoudre ce problème"
 UFRA_parliamentary_republic:0 "Répunlique parlemantaire"
 UFRA_parliamentary_republic_desc:0 ""
 UFRA_reinforce_presidential_role:0 "Renforcer le rôle présidentiel"
 UFRA_reinforce_presidential_role_desc:0 ""
 UFRA_devalue_the_franc:0 "Dévaluer le Franc"
 UFRA_devalue_the_franc_desc:1 "Pendant que les autres pays acceptaient que leur monnaie perde en valeur pour aider leur économie, nous nous sommes résolument refuser à en faire de même. Avec comme résultat une économie peinant derrière les autres. Si nous voulons être compétitif et affronter les prochaines tempêtes, nous ne devons pas rejeter d'emblée une dévaluation de notre monnaie, même si cela se montrera être une mesure impopulaire."
 UFRA_autoroutes:0 "Autoroutes"
 UFRA_autoroutes_desc:0 "Les allemands ont impressionné tout le monde avec leur accès limité, des routes à haute vitesse connectant divers partie du pays. Nous pouvons montrer au monde entier que nous pouvons faire tout aussi bien."
 UFRA_invest_in_the_metropole:1 "Développer la Métropole"
 UFRA_invest_in_the_metropole_desc:0 "Notre première étape dans la reconstruction de nos industries doit être d'améliorer notre base industrielle dans nos exploitations continentales ."
 UFRA_invest_in_the_colonies:1 "Développer les Colonies"
 UFRA_invest_in_the_colonies_desc:0 "Nos centres industriels en Europe n'ont pas la population et les ressources nécessaires pour soutenir une grande expansion industrielle. Si notre économie doit être compétitive avec le reste du monde, nous devons utiliser nos colonies."
 UFRA_colonial_industry_effect_tt:2 "Adds two §YCivilian Factories§! to every colonial state previously invested in.\n"
 UFRA_industrial_expansion_effect_tt:1 "Adds two §YCivilian Factories§! to metropolitan states previously invested in.\n"
 UFRA_military_factories_effect_tt:1 "Adds two §YMilitary Factories§! to every state previously invested in.\n"
 UFRA_invest_in_west_africa:0 "Investir en Afrique de l'Ouest"
 UFRA_invest_in_west_africa_desc:0 "Les vastes réserves de travailleurs et de ressources en Afrique de l'Ouest en font une parfaite candidate à un investissement ."
 UFRA_invest_in_indochina:0 "Investir en Indochine"
 UFRA_invest_in_indochina_desc:0 "La longue distance entre nos possessions en Indochine et notre cœur industriel peut sembler un inconvénient, mais elle protège également toute industrie là-bas des attaques ennemies."
 UFRA_invest_in_syria:0 "Investir en Syrie"
 UFRA_invest_in_syria_desc:0 "La Syrie est parfaitement positionnée pour nous approvisionner en cas de guerre en Europe ou en Afrique. La valorisation de son potentiel industriel soutiendra également notre position sur le territoire."
 UFRA_global_integration:0 "Intégration globale"
 UFRA_global_integration_desc:0 "L'Empire britannique est un système finement réglé de parties se soutenant mutuellement. Rien ne dit qu'on ne peut pas faire aussi bien avec nos colonies."
 UFRA_begin_rearmament:0 "Lancer le réarmement"
 UFRA_begin_rearmament_desc:1 "L'armistice de 20 ans prédit par le Maréchal Foch vient à son terme, et le monde semble significativment de plus en plus propice à l'érutpion d'une nouvelle guerre d'ici quelques années. Nous devons être prêts."
 UFRA_firepower_kills:0 "La puissance de feu tue"
 UFRA_firepower_kills_desc:0 "Les leçons de la Grande Guerre étaient aussi simples que cruelles : le temps des hommes qui se battaient à vue d'œil est révolu. Aujourd'hui, la mort se fait à grande échelle avec les armes les plus modernes à longue portée."
 UFRA_methodical_battle:0 "Bataille méthodique"
 UFRA_methodical_battle_desc:0 "Certains prétendent que la bataille est le chaos, mais ce sont des imbéciles. Une bataille n'est rien d'autre que l'application méthodique des bons outils basés sur le plan global. Planifiez bien, et les intentions de l'ennemi peuvent aussi bien être une note de bas de page historique."
 UFRA_division_cuirassee:0 "Division Cuirassée"
 UFRA_division_cuirassee_desc:0 "Un entreprenant officer du nom de de Gaulle a proposé un nouveau type de division, combinant blindage lourd avec de l'infanterie et des chars moyens combinant dans un ensemble."
 UFRA_infantry_tanks:0 "Chars d'Infanterie"
 UFRA_infantry_tanks_desc:0 "Quoi qu'il en soit, le premier et le dernier devoir des chars est de permettre à l'infanterie de prendre et de tenir le terrain. Par conséquent, nous devons toujours équiper nos unités d'infanterie de chars modernes et capables."
 UFRA_special_forces:0 "Forces spéciales"
 UFRA_special_forces_desc:0 "Dans le futur la guerre sera poregressivment combattu dans des zones ou le fantassin moyen rencontrera ses propres limites . Nous devons créer de nouvelles et capables unités plus à même de se battre dans des conditions périlleuses ."
 UFRA_fusiliers_marine:1 "Fusiliers Marins"
 UFRA_fusiliers_marine_desc:0 "Le temps des côtes en tant que défenses impénétrables est révolu. A l'avenir, nous devons pouvoir porter le combat à l'ennemi, où qu'il soit, et nous emparer d'un terrain d'atterrissage contre toute opposition."
 UFRA_battle_of_maneuver:0 "Bataille de manœuvre"
 UFRA_battle_of_maneuver_desc:0 "La vieille notion d'un champ de bataille comme une petite zone dans laquelle les armées s'affrontent est morte. Avec la motorisation de masse, les avions et les communications radio rapides, les batailles se déroulent rapidement sur des centaines de kilomètres. Plus tôt nous nous y préparons, mieux ce sera."
 UFRA_air_dominance:0 "Domination aérienne"
 UFRA_air_dominance_desc:0 "Le développemnt de l'aviation a créée un troisième flanc auquel les armées doivent se soucier . Nous devons sécuriser ce flanc ou affronter la catastrophe."
 UFRA_air_ground_cooperation:0 "Coopération air-sol"
 UFRA_air_ground_cooperation_desc:0 "Combattre dans les airs ne crée des résultats militaires réels que s'il s'agit de poursuivre un objectif au sol. Mieux nous intégrons la bataille dans les airs et la bataille au sol, plus nous devenons efficaces."
 UFRA_flying_artillery:0 "Artillerie volante "
 UFRA_flying_artillery_desc:0 "Dans les batailles rapides d'aujourd'hui, les pièces d'artillerie lentes au sol pourraient ne pas être en mesure de suivre. Les avions transportant des bombes peuvent reprendre leur rôle."
 UFRA_radicalise_the_popular_front:0 "Radicaliser le Front Populaire"
 UFRA_radicalise_the_popular_front_desc:1 "Avec la hausse du fascisme en Allemagne et en Italie, il est devenu clair que les luttes internes à gauche doivent cesser si notre cause doit survivre. Un large front populaire composé de tous les partis de gauche aura le mandat populaire de s'attaquer enfin aux conditions économiques qui créent le fascisme."
 UFRA_ban_communism:0 "Bannir le communisme"
 UFRA_ban_communism_desc:0 "Bien qu'il soit inconcevable que quiconque puisse sérieusement vouloir visiter le chaos et l'effusion de sang d'une révolution communiste sur sa propre patrie, il semble que certains parmi nous feraient exactement cela. Nous ne pouvons plus leur permettre de conspirer contre l'État. Les mesures les plus dures doivent être prises."
 UFRA_invite_communist_ministers:0 "Inviter un ministre communiste"
 UFRA_invite_communist_ministers_desc:0 "La crainte d'un contrecoup de la droite radicale a empêché l'inclusion des communistes dans le gouvernement actuel. Mais la peur est une mauvaise conseillère. Si nous devons avoir cet affrontement, laissez-les venir."
 UFRA_strengthen_the_unions:0 "Renforcer les unions"
 UFRA_strengthen_the_unions_desc:0 "Pendant trop longtemps, le droit de l'ouvrier individuel à se regrouper avec ses camarades pour négocier collectivement a été laissé de côté. Plus maintenant."
 UFRA_celebrate_the_commune:0 "Célébrer la Commune"
 UFRA_celebrate_the_commune_desc:0 "Aussi éphémère qu'elle ait pu être, la Commune de Paris fut la première tentative de création d'une société communiste sur le sol français."
 UFRA_womens_suffrage:0 "Droit de vote pour les femmes"
 UFRA_womens_suffrage_desc:1 "Il est aussi absurde que honteux que les femmes travailleuses de France, qui maintes et maintes fois se sont battues sur les barricades pour gagner leurs droits, n'aient pas le droit de voter aux élections. Nous allons éradiquer cette injustice."
 UFRA_legal_equality:0 "Egalité juridique"
 UFRA_legal_equality_desc:0 "Dans tous les domaines qui comptent, les femmes sont toujours considérées comme des citoyennes de seconde zone, toujours soumises à la volonté d'un homme. Ce non-sens se termine maintenant."
 UFRA_industrial_collectivization:0 "Collectivisation industrielle"
 UFRA_industrial_collectivization_desc:1 "L'économie française est aujourd'hui constituée de petites entreprises avec peu d'employés, en concurrence permanente les unes contre les autres et aspirant les ressources dans une production à petite échelle inefficace. Nous allons combiner ces petites entreprises pour enfin créer des entreprises capables de rivaliser sur la scène mondiale."
 UFRA_agricultural_collectivization:0 "Collectivisation agricole"
 UFRA_agricultural_collectivization_desc:0 "Ce qui vaut pour l'industrie vaut tout autant pour les agriculteurs partout en France. Les petites fermes n'ont pas les moyens d'acheter des équipements modernes, fonctionnant en grande partie comme l'avaient fait leurs arrière-grands-pères. En les combinant en unités de production agricole, nous augmenterons l'efficacité et la production."
 UFRA_force_the_issue:0 "Forcer le problème"
 UFRA_force_the_issue_desc:1 "Nous avons fait du chemin depuis que nous avons formé le Front populaire. Mais nous ne pouvons pas laisser notre travail à moitié fait. Il est temps que tout le monde à gauche fasse un choix et prenne position - soit avec la révolution, soit contre elle."
 UFRA_force_the_issue_tt:0 "La pénalité de stabilité dépend de la popularité de le §YDemocratic§! Parties.\n"
 UFRA_reconciliation:0 "Réconciliation"
 UFRA_reconciliation_desc:0 "Dans le passé, les révolutions françaises ont trop souvent précipité le pays dans des spasmes sans fin de terreur révolutionnaire et contre-révolutionnaire. Il est peut-être temps de construire une république dans laquelle chacun a sa place, qu'il ait soutenu ou non la révolution."
 UFRA_constitutional_convention:0 "Convention constitutionnelle"
 UFRA_constitutional_convention_desc:0 "Un changement fondamental dans la nature de notre république ne peut se faire du jour au lendemain, et cela ne peut se faire sans négocier une nouvelle constitution."
 UFRA_anti_fascist_coalition:0 "Coalition anti-fasciste"
 UFRA_anti_fascist_coalition_desc:0 "La plus grande menace pour la marche du progrès est la propagation du fascisme réactionnaire. Nous devons être aux côtés de tous les pays qui sont prêts à combattre cette menace, sinon il n'y aura de lendemain pour aucun d'entre nous."
 UFRA_invite_anti_fascist_emigrants:0 "Inviter les immigrés ant-fascistes"
 UFRA_invite_anti_fascist_emigrants_desc:1 "Le premier pas que fait tout régime fasciste est d'exiler ses détracteurs et les personnes qui pourraient présenter une vision alternative de la façon dont le pays pourrait être organisé. Cependant, ces personnes sont également parfaitement adaptées pour former un gouvernement en exil afin de préparer le jour de la libération de leur pays."
 UFRA_reconnect_to_the_balkans:0 "Se reconnecter aux Balkans"
 UFRA_reconnect_to_the_balkans_desc:0 "La France a longtemps cherché à contrebalancer les puissances de l'Europe centrale en tendant la main aux pays des Balkans. Cette connexion est toujours là, même si elle a été abandonnée plus récemment."
 UFRA_pre_empt_the_fascist_attack:0 "Devancer la menace fasciste"
 UFRA_pre_empt_the_fascist_attack_desc:0 "Why should we allow the enemy to prepare in peace and pick the moment that the inevitable attack happens when it best suits them? We will strike first, and crush this threat before it has time to get ready."
 UFRA_loyalty_to_moscow:0 "Loyauté à Moscou"
 UFRA_loyalty_to_moscow_desc:0 "Le modèle de socialisme pratiqué en Union soviétique n'est peut-être pas parfait, mais il est hors de tout doute raisonnable que l'Union soviétique a atteint le plus haut degré de mise en œuvre des idées socialistes. Nous serions idiots d'essayer de trouver notre propre voie."
 UFRA_league_of_french_bolshevist_volunteers:0 "Ligues des volotaires bolchéviques français"
 UFRA_league_of_french_bolshevist_volunteers_desc:1 "Lorsqu'un pays socialiste est menacé par un envahisseur étranger, tous les pays socialistes sont menacés. Nous ne devons pas rester les bras croisés pendant que nos camarades se battent pour leur vie."
 UFRA_host_the_german_exiles:0 "Acceuillir les exilés allemands"
 UFRA_host_the_german_exiles_desc:0 "L'Allemagne, patrie de Marx et Engels, était autrefois à l'avant-garde de la pensée et de la pratique communistes. De nombreux communistes allemands ont fuis lorsque les nazis ont pris le pouvoir. Si nous leur donnons un foyer, ils peuvent nous aider à organiser un gouvernement plus efficace des territoires libérés."
 UFRA_revolution_to_the_utmost:0 "Révolution au maximum"
 UFRA_revolution_to_the_utmost_desc:0" Une révolution laissée à moitié terminée n'est pas du tout une révolution. Nous ne devons pas nous arrêter tant que l'action n'est pas accomplie et que le nouveau système politique n'est pas en sécurité. Quel qu'en soit le prix."
 UFRA_national_television:0 "Nationalisation des chaînes télévisés"
 UFRA_national_television_desc:0 "Avoir les chaînes de télévisons a notre service nous permettra de ne montrer que ce que le peuple doit voir"
 UFRA_destroy_the_counter_revolution:0 "Détruire la contre Révolution"
 UFRA_destroy_the_counter_revolution_desc:0 "Même maintenant, certaines personnes en France se préparent à planter le poignard dans le dos de leur propre peuple lorsqu'elles montrent ne serait-ce qu'une seconde de faiblesse. Nous ne les laisserons pas faire et nous frapperons les premiers."
 UFRA_revolutionary_zeal:0 "Zèle révolutionnaire"
 UFRA_revolutionary_zeal_desc:1 "Le peuple français a toujours eu une ferveur particulière pour éradiquer l'ordre ancien et relever le nouveau. Cela ne doit pas être découragé."
 UFRA_loyalty_to_the_cause:0 "Loyauté à la cause"
 UFRA_loyalty_to_the_cause_desc:1 "D'autres pays peuvent formuler leurs propres visions du communisme, mais il n'y a aucune raison pour que nous fassions des compromis sur la nôtre. Ils se sont peut-être arrêtés à mi-chemin, assaillis par le doute quant à savoir si la fin justifiait les moyens. Nous ne le ferons pas."
 UFRA_carry_the_revolution_north:0 "Porter la Révolution au Nord"
 UFRA_carry_the_revolution_north_desc:0 "Outre-Manche se trouve le berceau de la révolution industrielle, et avec elle, le berceau du capitalisme moderne. Nous ne pouvons pas permettre à cet endroit de devenir le tremplin d'un ennemi contre-révolutionnaire."
 UFRA_carry_the_revolution_west:0 "Porter la Révolution à l'Ouest"
 UFRA_carry_the_revolution_west_desc:1 "Les régimes de la péninsule ibérique ne tiennent qu'à un fil, prêts à être emportés par une révolution populaire. Nous allons couper ce fil."
 UFRA_carry_the_revolution_east:0 "Porter la Révolution à l'Est"
 UFRA_carry_the_revolution_east_desc:0 "Aa notre frontière orientale constitue la plus grande menace pour notre nouvel ordre. Les forces réactionnaires rassemblées là-bas frapperont quand nous pourrons le moins nous le permettre - mais seulement si nous leur donnons le temps de s'y préparer."
 UFRA_carry_the_revolution_south:0 "Porter la Révolution au Sud"
 UFRA_carry_the_revolution_south_desc:0 "Le premier pays à tomber dans le fascisme fut l'Italie. En conséquence, l'idéologie est fermement ancrée en Italie. Nos visions du monde ne peuvent coexister pacifiquement. Ils le savent aussi bien que nous et se prépareront sans doute à agir. Nous devons aussi."
 UFRA_egalite_liberte_solidarite:0 "Egalité, Liberté, Solidarité"
 UFRA_egalite_liberte_solidarite_desc:1 "La première Révolution française a balayé des régimes qui duraient depuis des millénaires et a changé à jamais le paysage de l'Europe. Nous finirons ce qu'ils ont commencé."
 UFRA_reform_the_labour_laws:0 "Réformer les lois agraires"
 UFRA_reform_the_labour_laws_desc:0 "Les travailleurs de France travaillent dans des conditions difficiles, avec de bas salaires et peu d'avantages. Il est temps de mettre en œuvre une série complète de réformes pour améliorer leur sort."
 UFRA_nationalize_key_industry:0 "Nationaliser les industries clés"
 UFRA_nationalize_key_industry_desc:0 "Dans la situation actuelle, nous ne devons pas hésiter à restructurer radicalement notre économie pour faire face à la menace à venir. Le temps presse - nous ne pouvons pas attendre que le marché libre résolve le problème."
 UFRA_reorganize_the_aviation_industry:0 "Réorganiser l'industrie aéronautique"
 UFRA_reorganize_the_aviation_industry_desc:0 "Divisé en dizaines de petites entreprises, notre industrie aéronautique a des décennies de retard par rapport à l'industrie en Allemagne et aux États-Unis. Une restructuration radicale est nécessaire."
 UFRA_form_the_state_arsenals:0 "Former les arsenaux d'Etat"
 UFRA_form_the_state_arsenals_desc:0 "Pour approvisionner notre armée en armes modernes, nous ne pouvons pas attendre que les entreprises privées aient développé les capacités de production nécessaires."
 UFRA_general_work_council:0 "Comité général d'entreprise"
 UFRA_general_work_council_desc:0 "Nous allons créer une agence nationale pour gérer les différends entre employeurs et employés, et pour veiller à ce que nos travailleurs soient employés de la manière la plus efficace possible."
 UFRA_national_champions:0 "Champions nationaux"
 UFRA_national_champions_desc:0 "En sélectionnant quelques entreprises qui ont le potentiel pour rivaliser au niveau mondial et en les soutenant au plus haut degré, nous pouvons créer une économie moderne qui est l'égale de toutes les autres."
 UFRA_dirigisme:0 "Dirigisme"
 UFRA_dirigisme_desc:0 "Alors que l'économie entièrement planifiée du modèle soviétique est clairement une mesure trop extrême, une certaine mesure de planification et de direction est nécessaire pour optimiser notre économie."
 UFRA_ban_the_leagues:0 "Bannir les opposants"
 UFRA_ban_the_leagues_desc:0 "Les ligues d'extrême droite ont été autorisées à s'organiser sans contrôle. Bien qu'ils soient actuellement trop faibles pour tenter un coup d'État, on ne sait pas ce qu'ils pourraient faire à l'avenir. Le mieux est de les dissoudre maintenant."
 UFRA_the_blum_viollette_proposal:0 "Proposition Blum-Violette"
 UFRA_the_blum_viollette_proposal_desc:1 "La citoyenneté de la République française doit être ouverte à toute personne éligible. Beaucoup de nos fidèles sujets en Algérie voudraient devenir citoyens à part entière, mais ne sont pas encore autorisés à le faire. En faisant d'eux des citoyens à part entière, nous rattacherions beaucoup plus l'Algérie à la France."
 UFRA_expand_the_citizenship:0 "Etendre la citoyenneté"
 UFRA_expand_the_citizenship_desc:0 "Il est intolérable pour une république que certaines des personnes vivant sur son territoire ne soient pas autorisées à devenir ses citoyens, pourtant cet état de choses a été autorisé à persister dans le nôtre. Nous devons rectifier cela immédiatement."
 UFRA_france_undividable:0 "France indivisible"
 UFRA_france_undividable_desc:0 "La France doit être constituée en une seule unité, sous un même drapeau. Il est temps que nous le reconnaissions ouvertement, ne serait-ce que pour dissiper les craintes de division."
 UFRA_french_union:0 "Union française"
 UFRA_french_union_desc:0 "Il est temps de proclamer une France nouvelle, une France à l'échelle du globe, dans laquelle toutes les parties de notre royaume sont unies. Nous organiserons des référendums partout pour confirmer la volonté du peuple de faire partie de cette nouvelle et grande France."
 UFRA_french_union_tt:0 "Des référendums seront organisés dans diverses parties de notre empire colonial. Certaines parties peuvent choisir de devenir totalement indépendantes à la place."
 UFRA_encourage_immigration:0 "Encourager l'immigration"
 UFRA_encourage_immigration_desc:1 "Notre patrie a désespérément besoin de travailleurs pour compenser les pertes subies pendant la Grande Guerre. En facilitant l'installation en France, nous pouvons attirer les immigrés qualifiés qui peuvent combler ce manque."
 UFRA_review_foreign_policy:0 "Revoir la politique extérieur"
 UFRA_review_foreign_policy_desc:0 "Tl'ordre continental établi en 1919 semble de plus en plus menacé. Il est temps que nous examinions nos options de politique étrangère pour conclure de nouvelles alliances afin de surmonter la tempête à venir."
 UFRA_intervention_in_spain:0 "Intervention en Espagne"
 UFRA_intervention_in_spain_desc:0 "La guerre civile en Espagne a amené l'affrontement entre les idéologies à nos portes. Nous devons faire preuve de prudence, de peur que le conflit ne déborde dans notre pays."
 UFRA_support_the_finns:0 "Soutenir la Finlande"
 UFRA_support_the_finns_desc:0 "Les Finlandais se battent pour leur vie. Nous devons les aider."
 UFRA_take_norwegian_water:0 "Acquérir l'eau lourde norvégienne"
 UFRA_take_norwegian_water_desc:0 "L'eau lourde est un élément essentiel pour modérer les éléments radioactifs dans un réacteur nucléaire, mais l'eau lourde doit être isoler de l'eau normale pour être exploitable. Très peut d'usines sont capables d'isoler l'eau lourde, et la quasi totalité du stock mondiale et produit dans une usine en norvége. Ils nous faut a tout pris cette eau, pour nos recherches mais aussi pour éviter que nos ennemis y ait accès"
 UFRA_confirm_eastern_commitments:0 "Confirmer nos engagments à l'Est"
 UFRA_confirm_eastern_commitments_desc:0 "Après la Grande Guerre, nous avons mis en place un réseau d'alliances en Europe de l'Est, comme contrepoids à une Allemagne renaissante et à une Union soviétique expansionniste. Nos alliés de la région se demandent maintenant si nous serions réellement appelés à leur venir en aide si nous étions appelés. Nous devons les rassurer avant qu'ils ne décident de chercher de l'aide ailleurs."
 UFRA_strengthen_the_little_entente:0 "Renforcer la Petite Entente"
 UFRA_strengthen_the_little_entente_desc:0 "La Petite Entente nous engage à venir en aide à nos alliés d'Europe de l'Est et des Balkans. Nous avons laissé tomber cette alliance, mais elle est plus que jamais nécessaire. Il est temps de le relancer."
 UFRA_invest_in_our_weaker_allies:0 "Investir dans nos alliés faibles"
 UFRA_invest_in_our_weaker_allies_desc:0 "Si nous voulons avoir des alliés capables en cas de guerre, nous devons leur permettre de répondre à leurs propres besoins militaires. Un programme d'investissements modérés dans leur industrie leur permettra de produire localement les munitions dont ils ont besoin."
 UFRA_invest_in_our_weaker_allies_trigger_tt:0 "A moins d'usines militaires que nous"
 UFRA_coordinate_rearmament:0 "Coordoner le réarmement"
 UFRA_coordinate_rearmament_desc:0 "Pour correspondre au processus de développement unifié des Allemands et de nos autres adversaires, nous devons également coordonner nos efforts avec nos alliés."
 UFRA_foreign_guest_workers:0 "Iviter des travailleurs étrangers"
 UFRA_foreign_guest_workers_desc:0 "Onotre manque de travailleurs est un goulot d'étranglement majeur dans l'expansion de notre industrie et l'augmentation de la taille de nos forces armées. Inviter des ouvriers qualifiés de nos alliés à travailler dans nos usines libère de la main-d'œuvre à envoyer dans l'armée."
 UFRA_join_the_ententes:0 "Rejoindre les Ententes"
 UFRA_join_the_ententes_desc:1 "La France ne peut pas soutenir à la fois deux engagements de défense mutuelle. À moins que nous ne parvenions à convaincre les Britanniques d'honorer également nos engagements, nous devrons choisir. En combinant nos réseaux d'alliances disparates en un seul ensemble, nous augmentons le facteur de dissuasion de nos alliances d'un ordre de grandeur."
 unlocks_espionage_operation_tt:0 "débloque un §YEspionage Operation§!:\n"
 UFRA_revive_the_franco_polish_alliance:1 "Raviver l'alliance Franco-polonaise"
 UFRA_revive_the_franco_polish_alliance_desc:0 "La France a toujours soutenu une Pologne indépendante. Ces dernières années, les relations entre nos pays se sont un peu refroidies. Avec la menace de l'Allemagne à l'horizon, il est temps de raviver notre pacte."
 UFRA_revive_the_franco_polish_alliance_tt:0 "\nPoland would be invited into our faction if we were leaders of our own faction."
 UFRA_buy_time:0 "Acheter du temps"
 UFRA_buy_time_desc:0 "Nous ne sommes pas prêts à affronter les Allemands sur le terrain. Nos alliés sont faibles, notre armée est dépassée. Nous devrons peut-être faire des sacrifices si nous voulons survivre."
 UFRA_arms_purchases_in_the_us:1 "Commander des armes aux USA"
 UFRA_arms_purchases_in_the_us_desc:0 "Notre industrie militaire n'est tout simplement pas à la hauteur de fournir à nos forces les armes modernes nécessaires. Les États-Unis, cependant, ont des capacités de production à revendre. A moins qu'ils ne décident de revenir à leur isolationnisme, il semblerait qu'ils pourraient être persuadés de nous vendre les armes dont nous avons besoin."
 UFRA_france_leads:0 "La France mène"
 UFRA_france_leads_desc:0 "Une nation avec la fière histoire de la France ne peut pas laisser d'autres pays dicter sa politique étrangère. Nous ferons nos propres choix, guidés par nos propres intérêts."
 UFRA_concessions_to_italy:1 "Concessions à l'Italie"
 UFRA_concessions_to_italy_desc:0 "L'Italie rêve encore d'un empire en Afrique. Si nous devions offrir quelques concessions - et approuver sa conquête de l'Éthiopie - nous pourrions empêcher la formation d'un axe entre Rome et Berlin."
 UFRA_ratify_the_stresa_front:0 "Ratifier le front Stresa"
 UFRA_ratify_the_stresa_front_desc:0 "L'Italie a indiqué qu'elle rejoindrait notre faction en échange de territoires en Afrique. Il est temps de prendre la plume et de ratifier les traités nécessaires."
 UFRA_franco_soviet_treaty:0 "Traité Franco-soviétique"
 UFRA_franco_soviet_treaty_desc:0 "Les Soviétiques sont tout aussi inquiets que nous de la montée du fascisme en Europe. Peut-être pourrions-nous les convaincre de nous soutenir le moment venu."
 UFRA_revive_the_national_bloc:0 "Radicalisation du Bloc National"
 UFRA_revive_the_national_bloc_desc:0 "Le paysage politique se radicalise de jour en jour. La gauche murmure de faire cause commune avec les communistes. Ce qu'il faut maintenant, c'est un leadership fort et stable."
 UFRA_laissez_faire:0 "Laissez-Faire"
 UFRA_laissez_faire_desc:0 "Les communistes parlent ouvertement de remodeler radicalement la structure économique de notre pays, de priver l'homme qui travaille dur de sa propriété légitime. Contre cela, nous opposerons la simple notion de liberté. Une économie dynamique surpassera toujours un cauchemar gauchiste de paperasserie étouffante."
 UFRA_protect_the_rights_of_man:0 "Protéger les Droits de l'Homme"
 UFRA_protect_the_rights_of_man_desc:0 "Ils ne le diront peut-être jamais ouvertement, mais c'est évident pour quiconque a des yeux pour voir : restreindre le droit de propriété n'est que la première étape vers l'élimination de tous les droits pour lesquels nos fiers ancêtres se sont battus si durement. Nous ne l'aurons pas!"
 UFRA_freedom_front:0 "Dissoudre les ligues"
 UFRA_freedom_front_desc:0 "Face au chaos et aux bouleversements promis par les communistes, il faut être prêt à conclure des alliances avec d'autres partis, même ceux que l'on pourrait trouver personnellement répréhensibles."
 UFRA_stimulate_the_dynamic_market:0 "Stimuler les dymaiques du marché"
 UFRA_stimulate_the_dynamic_market_desc:0 "Le marché dynamique s'est avéré être la forme la plus efficace d'organisation économique. Mais il est toujours dirigé par des humains, et les êtres humains ont parfois besoin d'être rassurés sur le fait que leur travail acharné ne sera pas vain. En légiférant en supprimant certaines restrictions et en donnant des garanties, nous pouvons aider les investisseurs à surmonter leurs peurs et à stimuler notre économie."
 UFRA_agricultural_protectionism:0 "Protectionnisme agraire"
 UFRA_agricultural_protectionism_desc:0 "L'économie mondiale est devenue de plus en plus hostile à nos modes de production traditionnels. Si nous ne prenons pas de mesures pour protéger nos agriculteurs, nous serons bientôt confrontés à une crise aux proportions incalculables car nos agriculteurs ne sont pas en mesure de rester compétitifs face aux denrées alimentaires produites en masse en provenance d'outre-mer."
 UFRA_economic_devolution:0 "Devolution économique"
 UFRA_economic_devolution_desc:0 "Il est absurde de penser qu'un bureaucrate parisien sache ce qu'il y a de mieux pour une entreprise bordelaise. Nous devons faire confiance à nos entrepreneurs et leur donner les moyens de créer leurs propres solutions."
 UFRA_promote_entrepeneurship:0 "Promouvoir l'entreprenariat"
 UFRA_promote_entrepeneurship_desc:0 "Le cœur battant d'un marché dynamique a toujours été l'individu qui, voyant une opportunité, s'empresse de l'exploiter. Ces dernières années, cet esprit a été étouffé par des réglementations inutiles. Nous devrions les faire reculer."
 UFRA_utilize_the_leagues:0 "Utiliser les ligues"
 UFRA_utilize_the_leagues_desc:0 "Il est triste de constater que la violence politique est devenue monnaie courante en France. Si le pays veut survivre à la menace de la révolution communiste, nous ne devons pas craindre l'aide de personnes qui peuvent et vont rencontrer les voyous communistes dans la rue s'il en vient à cela."
 UFRA_national_regeneration:0 "Régénaration Nationale"
 UFRA_national_regeneration_desc:0 "Un excès de démocratie et un républicanisme malavisé ont empoisonné notre pays et divisé notre peuple. Il faudra beaucoup de temps pour guérir ces blessures, mais au moins les premiers pas ont été faits."
 UFRA_national_regeneration_trigger_tt:0 "Le total combiné des soutiens non alignés et fascistes est 50%"
 UFRA_destroy_decadence:0 "Détruire la décadence"
 UFRA_destroy_decadence_desc:1 "Aucun pays n'a jamais été grand s'il s'est permis de débattre de la moindre question pendant des mois. Certains pays, en sécurité derrière les océans et soutenus par des empires mondiaux, peuvent croire qu'ils peuvent se permettre ce luxe. Nous ne pouvons pas."
 UFRA_integralism:0 "Intégralisme"
 UFRA_integralism_desc:0 "L'idéologie de l'intégrisme affirme que tous les aspects de la société doivent se rassembler et fonctionner comme s'ils n'étaient qu'un petit morceau d'un tout plus grand. Cette société doit être bien ordonnée, pour s'assurer que toutes les parties de celle-ci travaillent ensemble en harmonie."
 UFRA_work:0 "Travail"
 UFRA_work_desc:0 "L'artisan est la composante la plus importante de l'économie. Lorsqu'il est guidé par les bonnes personnes, il n'y a pas plus noble que de mettre son travail au service de son pays."
 UFRA_family:0 "Famille"
 UFRA_family_desc:0 "La plus petite unité de la société n'est pas l'individu - c'est la famille. Contester ce fait simple et évident était le plus gros défaut de l'ancienne république."
 UFRA_fatherland:0 "Patrie"
 UFRA_fatherland_desc:0 "Le pays est au-dessus de tout. Il ne peut y avoir aucun doute à ce sujet."
 UFRA_political_unity:0 "Unité politique"
 UFRA_political_unity_desc:1 "L'histoire de France depuis la chute de l'absolutisme est une histoire de luttes politiques internes. Quand il y avait l'unité - la France était victorieuse. Quand il y avait des conflits internes - la France a été vaincue. Pour cette raison, nous ne pouvons pas permettre que les ambitions de quelques-uns nuisent aux moyens de subsistance du plus grand nombre."
 UFRA_diplomatic_freedom:0 "Liberté diplomatique"
 UFRA_diplomatic_freedom_desc:1 "Les gouvernements républicains se sont enchaînés à des constructions artificielles en Europe de l'Est qui tomberont dès que nous retirerons notre aide. Ce sont des passifs, pas des actifs, et en tant que tels, nous nous en débarrasserons."
 UFRA_latin_entente:0 "Entente Latine"
 UFRA_latin_entente_desc:1 "La fraternité qui existe entre les États successeurs de l'Empire romain est indéniable. Le peuple germanique d'Europe a gouverné le continent pendant trop longtemps. Il est temps que nous revenions sur notre droit d'aînesse nationale."
 UFRA_reach_out_to_spain:0 "Atteindre l'Espagne"
 UFRA_reach_out_to_spain_desc:0 "Fraîchement remise de sa guerre civile, l'Espagne est notre alliée naturelle dans notre tentative de remodeler le continent."
 UFRA_invite_portugal:0 "Inviter le Portugal"
 UFRA_invite_portugal_desc:1 "Alors que son empire colonial a beaucoup diminué, la flamme de l'exploration et de la conquête brûle toujours dans le cœur de chaque Portugais."
 UFRA_compensate_italy:0 "Indemniser l'Italie"
 UFRA_compensate_italy_desc:0 "Dans le passé, des conflits sur de minuscules étendues désertiques ont entraîné nos nations dans des conflits. De telles absurdités sont facilement arrêtées et un résultat mutuellement acceptable peut rapidement être trouvé."
 UFRA_intervention_in_greece:0 "Intervention en Grèce"
 UFRA_intervention_in_greece_desc:0 "La Grèce contrôle certains des territoires les plus précieux de la Méditerranée. Nous ne pouvons pas permettre à un gouvernement hostile d'en avoir le contrôle, et nous devons donc agir en premier."
 UFRA_the_congress_of_paris:0 "Congrès de Paris"
 UFRA_the_congress_of_paris_desc:0 "Au Congrès de Berlin, les frontières de l'Afrique ont été façonnées. Mais la carte ressemble aujourd'hui à un patchwork. Il est temps de redessiner la carte, et de former ainsi la base d'un nouvel empire colonial."
 UFRA_the_natural_borders_of_france:0 "Les frontières naturelles de la France"
 UFRA_the_natural_borders_of_france_desc:0 "Il est tout à fait naturel qu'un pays s'occupe d'abord de ses propres intérêts. Nous ne pouvons pas coexister pacifiquement avec les Allemands dans notre lutte, et nous devons donc sécuriser nos frontières naturelles pour défendre nos cœurs."
 UFRA_towards_a_new_europe:0 "Vers une nouvelle Europe"
 UFRA_towards_a_new_europe_desc:1 "La France est à la croisée des chemins. Nous pouvons nous enchaîner à l'ancien ordre, ou nous pouvons embrasser le nouveau. Avec les Allemands sur le point de refaire le continent, il serait bénéfique pour nous d'être du bon côté."
 UFRA_establish_spheres_of_influence:0 "Etablir une sphère d'influence"
 UFRA_establish_spheres_of_influence_desc:1 "Pendant des siècles, notre peuple a vécu dans la croyance que nous étions des ennemis mortels et héréditaires. Cette croyance était fondée sur l'idée que nos intérêts étaient incompatibles. Mais nous pourrions sûrement parvenir à un accord si nous définissions simplement nos sphères d'influence et s'abstenions soigneusement d'intervenir."
 UFRA_split_belgium:0 "Diviser la Belgique"
 UFRA_split_belgium_desc:0 "La Belgique étant désormais dans notre sphère d'influence, il est temps de s'installer dans les régions francophones. Le reste sera formé dans un nouvel état."
 UFRA_align_belgium:0 "Organiser la Belgique"
 UFRA_align_belgium_desc:0 "Les Belges nous doivent leur existence, et nous ne pouvons pas les laisser oublier ce fait. Si nous les laissons indépendants, nous veillerons tout du moins à l'installation d'un gouvernement ami."
 UFRA_grow_the_empire:0 "Agrandir l'Empire"
 UFRA_grow_the_empire_desc:0 "Il est absurde qu'un pays de la taille de la Belgique soit autorisé à conserver une colonie plusieurs fois sa taille. Nous sommes bien mieux placés pour administrer un tel territoire."
 UFRA_bring_home_quebec:0 "Ramener le Québec à la maison"
 UFRA_bring_home_quebec_desc:0 "La province perdue depuis longtemps sera, avec le temps, à nouveau la nôtre. Tous les francophones du monde finiront par retrouver la patrie."
 UFRA_expand_to_the_suez:0 "S'étendre vers Suez"
 UFRA_expand_to_the_suez_desc:0 "La division du contrôle entre nous et la Grande-Bretagne au Levant est un compromis impraticable que nous n'avons heureusement plus à respecter."
 UFRA_dominate_the_middle_east:0 "Dominer le Moyen-Orient"
 UFRA_dominate_the_middle_east_desc:0 "Les pays du Moyen-Orient sont des constructions artificielles, sculptées dans le cadavre de l'Empire ottoman. Ils ne sont pas plus souverains que le village français moyen, et il est temps de le leur rappeler."
 UFRA_the_council_of_rambouillet:0 "Le consil de Rambouillet"
 UFRA_the_council_of_rambouillet_desc:0 "Avec le pays en effervescence, le peuple cherche un leader fort. Il est devenu clair que le républicanisme a échoué au peuple français, et il est temps que les dirigeants naturels de la France reviennent. Mais d'abord, il faut jeter les bases d'une restauration de la monarchie."
 UFRA_revise_the_constitution:0 "Réviser la Constitution"
 UFRA_revise_the_constitution_desc:0 "La constitution républicaine a toujours été conçue comme un palliatif qu'on a laissé perdurer trop longtemps. Maintenant, nous allons la réécrire pour permettre à un monarque de revenir."
 UFRA_repeal_the_law_of_exile:0 "Supprimer la loi d'exil"
 UFRA_repeal_the_law_of_exile_desc:0 "Aucun chef de famille royale française, ni leur héritier, ne sont admis sur le sol français sans autorisation expresse. Avant que nous puissions avoir le retour triomphal de la monarchie, nous devons éliminer ce petit obstacle ennuyeux."
 UFRA_orleanist_restoration:1 "Restauration Orléaniste "
 UFRA_orleanist_restoration_desc:2 "La maison d'Orléans bénéficie d'un soutien considérable parmi les royalistes de France. Alors que certains détracteurs préféreraient un autre candidat au trône, il ne fait guère de doute que l'héritier orléaniste a les meilleures chances d'unir pacifiquement le pays derrière lui."
 UFRA_guarantee_the_constitution:0 "Guarantir la Constitution"
 UFRA_guarantee_the_constitution_desc:0 "Avant que la presse républicaine ne puisse même lancer ses campagnes infondées contre la légitimité du pouvoir royal, nous devons éroder leur réputation en donnant des garanties de fer pour respecter les droits individuels du peuple."
 UFRA_the_first_citizen_of_the_state:0 "Le premier citoyen de l'Etat"
 UFRA_the_first_citizen_of_the_state_desc:0 "Le roi, bien qu'imprégné d'un pouvoir considérable, ne doit jamais être considéré comme un tyran ou un dirigeant absolutiste à l'ancienne. Au lieu de cela, un monarque moderne doit respecter la loi et être la première ligne de défense contre ceux qui usurperaient illégalement le pouvoir."
 UFRA_counter_action_desc:0 "L'Action française a longtemps été le plus ardent défenseur d'un retour à la monarchie. Malheureusement, leurs points de vue sur d'autres sujets sont moins acceptables. Il est temps de les informer qu'ils ont atteint leur objectif et d'en disposer."
 UFRA_no_further_humiliations:0 "Plus d'humiliations"
 UFRA_no_further_humiliations_desc:0 "Pendant des années, les gouvernements républicains successifs ont permis aux Allemands de bafouer les traités internationaux, dont certains ont été effrontément brisés avant même que l'encre ne soit sèche. Cela se termine maintenant."
 UFRA_slum_clearing:0 "Se débarasser des bidonvilles"
 UFRA_slum_clearing_desc:0 "Bien qu'appartenant à l'une des grandes puissances du monde, le simple ouvrier français vit souvent dans des conditions épouvantables d'une misère répugnante. Aucun roi digne de ce titre ne peut tolérer que ses sujets vivent dans un tel état."
 UFRA_public_welfare:0 "Etat Providence"
 UFRA_public_welfare_desc:0 "Un roi qui ne travaille pas pour le moindre de ses sujets n'est pas du tout roi."
 UFRA_the_legitimate_heir:0 "L'héritier légitime"
 UFRA_the_legitimate_heir_desc:1 "Les légitimistes considèrent la branche carliste comme l'héritière légitime du trône de France. La nomination de leur candidat au trône ouvre la possibilité alléchante de gouverner l'Espagne et la France dans une double monarchie."
 UFRA_secure_the_crown_of_spain:0 "Sécuriser la couronne d'Espagne"
 UFRA_secure_the_crown_of_spain_desc:0 "La première étape vers la revendication des droits d'aînesse du roi est de protéger l'Espagne des divers gouvernements prétendants qui ont surgi. Leurs petites querelles ont déjà jeté le pays dans une guerre civile sanglante - nous ne devons pas les laisser recommencer."
 UFRA_unite_the_crowns:0 "Unir les couronnes"
 UFRA_unite_the_crowns_desc:0 "Avec l'Espagne sécurisée, nous pouvons maintenant unir les couronnes et créer un nouveau royaume, le Royaume Franco-Espagnole."
 UFRA_two_countries_two_crowns:0 "Deux pays, deux couronnes"
 UFRA_two_countries_two_crowns_desc:0 "Il n'y a aucun moyen réalisable d'unir les pays où l'un ne se considérerait pas comme le sujet de l'autre. Nous conseillerons plutôt au roi de gouverner les deux dans une union pas légale mais personnelle."
 UFRA_proclaim_the_third_empire:0 "Proclamer le troisième Empire"
 UFRA_proclaim_the_third_empire_desc:0 "Les bonapartistes peuvent être considérés comme des marginaux dans la lutte pour le trône, mais ils portent en eux le rêve d'une époque où toute l'Europe s'inclinerait devant l'empereur des Français."
 UFRA_avenge_waterloo:0 "Venger Waterloo"
 UFRA_avenge_waterloo_desc:0 "L'histoire de Napoléon Ier sera à jamais marquée par sa plus grande défaite. Si nous voulons réussir, nous devons montrer que nous pouvons gagner là où il a perdu."
 UFRA_reorganize_the_dutch:0 "Réorganiser les hollandais"
 UFRA_reorganize_the_dutch_desc:0 "Les Hollandais, eux aussi, faisaient autrefois partie de l'Empire français. Maintenant qu'ils ont été vaincus, il est temps de revenir à cet état de fait naturel."
 UFRA_retribution_for_sedan:0 "Chatîment de Sedan"
 UFRA_retribution_for_sedan_desc:0 "Depuis plus d'un demi-siècle, les Allemands y célèbrent la bataille de Sedan, et leur triomphe sur Napoléon III. À l'avenir, chaque Allemand apprendra à maudire le nom de cet endroit."
 UFRA_disunite_germany:0 "Désunir l'Allemagne"
 UFRA_disunite_germany_desc:0 "Le triomphe sur la France a permis à la Prusse d'unir les petits États allemands sous sa bannière. Il est juste que ce processus soit inversé, maintenant que les Allemands ont été vaincus."
 UFRA_return_to_borodino:0 "Retourner à Borodino"
 UFRA_return_to_borodino_desc:0 "A Borodino, Napoléon a été le plus près de remporter sa victoire en Europe. L'armée russe était pratiquement détruite, et s'il avait été un peu plus rapide, il aurait pu résigner les russes à un accord. Nous montrerons au monde que cela peut être fait."
 UFRA_je_suis_la_deluge:1 "Je Suis Le Déluge"
 UFRA_je_suis_la_deluge_desc:0 "La Révolution française a été le déluge qui a emporté les vieux et faibles régimes qui avaient si longtemps contrôlé l'Europe. Maintenant, un nouveau déluge est là."
 UFRA_coordinate_rearmament_tt:0 "Réduit le coût des licences de production pour les membres de notre faction."
 UFRA_appeal_to_the_french_nation:0 "Appel à la nation française"
 UFRA_appeal_to_the_french_nation_desc:0 "La France a peut-être perdu la bataille, mais elle n'a pas perdu la guerre. C'est le devoir de tout patriote français de résister."
 UFRA_appeal_to_overseas_territories:0 "Appel aux territoires d'Outre-mer"
 UFRA_appeal_to_overseas_territories_desc:0 "Bien que les régions métropolitaines de la France soient tombées aux mains de l'ennemi, une grande partie de son empire reste encore libre. Si nous pouvons les rallier à notre cause, nous pouvons reprendre le combat."
 UFRA_appeal_to_overseas_territories_tt:0 "Les territoires coloniaux dans diverses parties du monde ont une chance de basculer de notre côté."
 UFRA_intervention_in_north_africa:0 "Intervention en Afrique du Nord"
 UFRA_intervention_in_north_africa_desc:0 "L'Afrique du Nord présente le meilleur terrain d'étape possible pour une invasion visant à reprendre la patrie. Le tourner de notre côté est vital pour notre campagne de libération."
 UFRA_intervention_in_west_africa:0 "Intervention en Afrique de l'Ouest"
 UFRA_intervention_in_west_africa_desc:0 "L'Afrique de l'Ouest compte des millions d'habitants, qui peuvent être enrôlés dans une nouvelle armée pour reprendre nos terres."
 UFRA_intervention_in_syria:0 "Intervention en Syrie"
 UFRA_intervention_in_syria_desc:0 "Nier à l'ennemi les territoires stratégiques en Syrie protège le canal de Suez et améliore considérablement notre situation en Méditerranée orientale."
 UFRA_intervention_in_indochina:0 "Intervention en Indochine"
 UFRA_intervention_in_indochina_desc:0 "Loin des combats en Europe, nos colonies d'Indochine sont un terrain idéal pour nous aider à défendre nos intérêts dans la région."
 UFRA_intervention_in_central_africa:0 "Intervention en Afrique centrale"
 UFRA_intervention_in_central_africa_desc:0 "L'Afrique centrale est d'une importance vitale pour l'effort de guerre allié, et pourrait être saisie comme un important coup de propagande pour nous."
 UFRA_intervention_in_madagascar:0 "Intervention à Madagascar"
 UFRA_intervention_in_madagascar_desc:2 "Si l'ennemi était autorisé à prendre et à fortifier Madagascar, nous ferions face à une catastrophe dans l'océan Indien. Une action rapide et décisive pourrait garantir que l'île reste de notre côté."
 UFRA_form_the_national_committee:0 "Former le Comité national"
 UFRA_form_the_national_committee_desc:0 "Peu de gens auraient cru que notre cause pouvait réussir. Mais maintenant, nous sommes enfin assez forts pour déclarer la formation d'un gouvernement en exil pleinement fonctionnel, prêt à prendre le contrôle de tout territoire français libéré de l'ennemi."
 UFRA_form_the_provisional_government_of_the_republic:1 "Former le gouvernement provisoire"
 UFRA_form_the_provisional_government_of_the_republic_desc:0 "Avec la libération de Paris, nous ne sommes plus un gouvernement en exil. Il est temps de commencer le difficile travail de reconstruction de notre pays."
 UFRA_continue_the_fight:0 "Continuer le combat"
 UFRA_continue_the_fight_desc:0 "Peu de soldats ont choisi de nous rejoindre jusqu'à présent, mais ceux que nous avons doivent être armés et équipés."
 UFRA_the_free_french_navy:0 "La Flotte française libre"
 UFRA_the_free_french_navy_desc:0 "Nos alliés sont enfermés dans une lutte désespérée pour la survie, pour laquelle les voies maritimes sont vitales. Nous devons faire notre part pour les aider."
 UFRA_colonial_recruitment:0 "Recrutement colonial"
 UFRA_colonial_recruitment_desc:0 "Avec la patrie indisponible pour le recrutement, nous devons nous tourner vers nos colonies pour obtenir de l'aide. Beaucoup de nos sujets sont prêts à prendre les armes pour se battre pour nous."
 UFRA_the_regiment_normandie:0 "Lé Noramndie Niémen"
 UFRA_the_regiment_normandie_desc:0 "Il est vital que nous, Français, soyons perçus comme combattants sur tous les fronts. Avec les Soviétiques maintenant engagés dans le combat contre notre ennemi commun, nous pourrions envoyer un petit groupe de pilotes de chasse pour les aider."
 UFRA_refus_absurde:0 "Refuser l'absurde"
 UFRA_refus_absurde_desc:0 "Même à l'heure de la défaite, la volonté de résister reste forte dans certains cœurs. Ils formeront la base du mouvement de résistance dans les territoires occupés."
 UFRA_the_maquis:0 "Le Maquis"
 UFRA_the_maquis_desc:1 "Les zones rurales de France offrent une couverture à toute personne qui souhaite échapper à l'occupant ou à ses laquais collaborateurs. Nous devons soutenir les gens qui refusent leur travail à l'ennemi dans un acte de résistance, afin que nous puissions à temps transformer ces zones en foyers de résistance."
 UFRA_reach_out_to_trade_unions:0 "Contactez les syndicats"
 UFRA_reach_out_to_trade_unions_desc:0 "Si nous devons frapper contre les industries qui ont maintenant été mises en service par l'ennemi, avoir de bonnes communications avec les travailleurs là-bas semble être le meilleur moyen. Ils peuvent retarder ou saboter toute production qui a lieu, beaucoup plus efficacement que toute autre."
 UFRA_cooperation_with_the_communists:0 "Coopération avec les communistes"
 UFRA_cooperation_with_the_communists_desc:0 "Dans notre lutte commune, nous ne devons refuser aucun allié qui s'offre - même s'il peut se dire camarade."
 UFRA_connections_to_industrialists:0 "Connexions aux industriels"
 UFRA_connections_to_industrialists_desc:0 "Alors que la coopération avec les travailleurs des industries de guerre est utile, la coopération avec les personnes qui dirigent les usines présente des avantages en soi."
 UFRA_the_civil_and_military_organization:0 "L'organisation civile et militaire"
 UFRA_the_civil_and_military_organization_desc:0 "Les nombreux petits groupes qui mènent des actes de résistance se regroupent pour former une organisation plus large. Nous devrions donner notre bénédiction."
 UFRA_national_council_of_the_resistance:0 "Le conseil national de la Résistance"
 UFRA_national_council_of_the_resistance_desc:0 "The resistance is growing stronger and stronger in France, and has become so powerful that it needs a new steering committee to coordinate its activities."
 UFRA_national_uprising:0 "Soulèvement national"
 UFRA_national_uprising_desc:0 "L'heure est venue. Il est maintenant temps de prendre les armes et de sortir de l'ombre qui vous a caché pendant de nombreuses années !"
 UFRA_french_forces_of_the_interior:0 "Forces frnçaise de l'intérieur"
 UFRA_french_forces_of_the_interior_desc:1 "La résistance a des milliers d'hommes sous les armes, partout en France. Alors que nous et nos alliés avançons à travers le pays, nous les balayerons et les transformerons en soldats dans notre armée."
 UFRA_french_forces_of_the_interior_tt:0 "Crée des unités d'infanterie faibles dans chaque état libéré."
 UFRA_naval_rearmament:0 "Réarmement naval"
 UFRA_naval_rearmament_desc:0 "Notre industrie de la construction navale a été laissée à l'abandon alors que nous nous concentrions sur le rythme des développements dans d'autres domaines. De ce fait, nous risquons aujourd'hui d'être surclassés par nos concurrents méditerranéens et atlantiques. Nous devons investir davantage pour rattraper le temps perdu."
 UFRA_colonial_naval_bases:0 "Bases navales coloniales"
 UFRA_colonial_naval_bases_desc:0 "La clé de la projection de puissance mondiale est la capacité de maintenir une flotte loin des eaux nationales. Nous avons déjà de grandes possessions coloniales, maintenant nous devons les développer pour servir de bases de ravitaillement et de réparation pour notre Marine."
 UFRA_develop_colonial_dockyards:0 "Développer les chantiers navals coloniaux"
 UFRA_develop_colonial_dockyards_desc:0 "Avec l'agrandissement et la modernisation des bases navales dans diverses parties de notre Empire, nous pouvons envisager d'installer l'industrie lourde nécessaire et de construire les grands quais nécessaires pour construire des navires en outre-mer."
 UFRA_the_old_school:0 "La vielle école"
 UFRA_the_old_school_desc:0 "Malgré tous les progrès de la technologie navale, l'élément clé de la puissance maritime reste le navire capital agissant avec le soutien d'autres unités de la flotte. Que ce navire capital soit toujours le cuirassé ou le nouveau porte-avions, nous devons encore augmenter la taille de notre industrie de la construction navale pour nous assurer que nous pouvons suivre le rythme des autres puissances navales."
 UFRA_carrier_planes:0 "Développer l'aéronautique navale"
 UFRA_carrier_planes_desc:0 "Un porte-avion est aussi bon que ses avions. Sans avions modernes, tout porte-avion est un investissement gaspillé."
 UFRA_rush_the_richelieus:0 "Terminer en hâte les Richelieu"
 UFRA_rush_the_richelieus_desc:0 "La situation en Europe devenant de plus en plus désespérée, nous n'avons pas le temps de construire nos nouvelles unités de surface par des moyens conventionnels. Nous devons prioriser les matériaux pour mettre nos nouveaux cuirassés en service dès que possible."
 UFRA_prioritize_the_joffre:0 "Prioriter au Joffre"
 UFRA_prioritize_the_joffre_desc:0 "Notre flotte de porte-avions actuelle est désespérément dépassée et surpassée par tout ennemi potentiel. Nous devons veiller à ce qu'un nouveau projet de porte-avion soit prioritaire."
 UFRA_the_young_school:0 "La Jeune école"
 UFRA_the_young_school_desc:0 "Les développements dans l'aviation, les sous-marins et les torpilles ont rendu le navire capital obsolète. Avec notre industrie navale limitée, nous ne pouvons pas nous permettre de perdre du temps et de l'argent à construire de gigantesques forteresses flottantes qui sont impuissantes face aux menaces du champ de bataille naval moderne. Nous devrions plutôt nous concentrer sur l'amélioration de l'efficacité pour nous permettre de construire plus de petits navires."
 UFRA_undersea_combat:0 "Combat sous-marins"
 UFRA_undersea_combat_desc:0 "Le sous-marin est arrivé à maturité au cours de la dernière décennie. Il constitue désormais une menace mortelle pour tous les navires de surface, tout en étant de plus en plus difficile à détecter et à détruire."
 UFRA_surface_combat:0 "Combat de surface"
 UFRA_surface_combat_desc:0 "Avec les progrès de l'artillerie, il est devenu pratiquement impossible de construire un navire qui puisse espérer survivre à un combat prolongé avec un autre vaisseau capital. Il est de loin préférable d'avoir une flotte de destroyers et de torpilleurs modernes pour submerger un ennemi avec des salves massives de torpilles."
 UFRA_prioritize_the_joffre_tt:0 "Ajoute un §YCarrier§! at 40% dans la liste d'attente."
 UFRA_SNCAN_formed:0 "Forme la SNCAN"
 UFRA_SNCAO_formed:0 "Forme la SNCAO"
 UFRA_SNCASE_formed:0 "Forme la SNCASE"
 UFRA_SNCASO_formed:0 "Forme la SNCASO"
 UFRA_metropolitan_france:2 "Investir en France métropolitaine"
 UFRA_metropolitan_france_tt:0 "Pas assez d'emplacements de construction pour §YInfrastructure§! en France métropolitaine"
 UFRA_metropolitan_france_desc:0 "Une Métropole doit toujours passer en premier. Nous pouvons commencer par améliorer notre infrastructure pour créer des emplois et permettre un déploiement plus rapide des troupes."
 UFRA_algerie_france:2 "Investir en Algérie française"
 UFRA_algerie_france_tt:0 "Pas assez d'emplacements de construction pour §YInfrastructure§! en France coloniale"
 UFRA_algerie_france_desc:0 "L'Europe traverse une période dangereuse. Nous devrions nous concentrer sur l'amélioration de nos terres au sud et nous assurer que nous pouvons toujours soutenir le continent."
 UFRA_industrial_expansion:0 "Expansion industrielle"
 UFRA_industrial_expansion_tt:0 "Pas assez d'emplacements de production pour §YCivilian Factories§! en France métropolitaine"
 UFRA_industrial_expansion_desc:0 "Nous avons besoin d'une présence industrielle plus forte chez nous. Nous avons beaucoup de main-d'œuvre prête, mais nous avons besoin de plus d'usines."
 UFRA_colonial_industry:0 "Industrie coloniale"
 UFRA_colonial_industry_tt:0 "Pas assez d'emplacements de production pour §YCivilian Factories§! en France coloniale"
 UFRA_colonial_industry_desc:1 "Nous devrions nous concentrer sur nos industries dans les colonies. Si les tensions augmentent en Europe, nous aurons toujours une capacité industrielle hors de portée des bombardiers ennemis."
 UFRA_military_factories:0 "Usines militaires"
 UFRA_military_factories_tt:0 "Pas assez d'emplacements de production pour §YMilitary Factory§! en France métropolitaine"
 UFRA_military_factories_desc:1 "Notre machine de guerre prend du retard. Nous devons nous concentrer sur la production d'équipements militaires sur notre sol national pour nous assurer que nos forces reçoivent constamment de nouveaux équipements."
 UFRA_colonial_military_factories:0 "Usines militaires coloniales"
 UFRA_colonial_military_factories_tt:0 "Pas assez d'emplacements de production pour §YMilitary Factory§! en France coloniale"
 UFRA_colonial_military_factories_desc:0 "Placer notre production militaire en dehors de l'Europe garantit que même si l'ennemi prend le contrôle de notre espace aérien, nous maintiendrons un flux constant d'équipement vers nos troupes de première ligne."
 UFRA_extra_research_slot:2 "Soutenir les Grandes Écoles"
 UFRA_extra_research_slot_desc:0 "De jeunes esprits prometteurs surgissent partout. Nous devons leur fournir des installations pour mener leurs recherches. Les progrès technologiques peuvent nous donner l'avantage là où nous en avons le plus besoin."
 UFRA_nuclear_effort:0 "Effort Nucléaire"
 UFRA_nuclear_effort_desc:0 "Les premiers essais en science nucléaire ont montré des résultats prometteurs. Exploiter sa puissance peut nous donner une arme différente de tout ce que l'humanité a vu."
 UFRA_jet_effort:0 "Effort de jet"
 UFRA_jet_effort_desc:0 "Le combat aérien est une question de mobilité. Le moteur à réaction est une avancée si puissante que les pilotes ennemis sembleront rester immobiles pendant que nous les arrachons du ciel."
 UFRA_extra_research_slot_2:2 "Former le CNRS"
 UFRA_extra_research_slot_2_desc:0 "La création d'un Centre Nationale de la Recherche Scientifique permetterait de coordonner l’activité des laboratoires et d'en tirer un rendement plus élevé."
 UFRA_defensive_focus:0 "Doctrine défensive"
 UFRA_defensive_focus_desc:0 "dans des moments comme ceux-ci, il est préférable de renforcer nos défenses. S'il y a des menaces, qu'elles viennent à nous pour que nous puissions y faire face sur notre propre terre. Nous avons un candidat parfait pour diriger notre armée, tout ce dont nous avons besoin est votre parole."
 UFRA_aggressive_focus:0 "Doctrine offensive"
 UFRA_aggressive_focus_desc:0 "Nous ne pouvons pas rester les bras croisés pendant que des ennemis envahissent nos frontières. Et nous ne pouvons pas laisser nos alliés se débrouiller seuls dans un scénario de guerre. Préparez notre armée ! Gamelin est l'homme de la situation."
 UFRA_fortification_focus:0 "Concentration de la Fortification"
 UFRA_fortification_focus_desc:0 "Aussi critiques que soient nos forts, nous devons trouver des moyens de les construire plus efficacement. La ligne Maginot a été un puissant moyen de dissuasion des forces ennemies, nous pourrions utiliser la sécurité de plus de défenses comme celle-ci."
 UFRA_alpine_forts:0 "Renforcer le front alpin"
 UFRA_alpine_forts_desc:0 "Nous disposons déjà de forts pour nous protéger de la menace italienne, mais une modernisation des forts déjà présents permetterait de sécuriser le sud une bonne fois pour toute."
 UFRA_extend_the_maginot_line:0 "Etendre la ligne Maginot"
 UFRA_extend_the_maginot_line_desc:0 "Nous ne pouvons pas compter sur la Belgique pour tenir bon, si elle laissait passer des armées ennemies, nous risquons d'avoir des ennuis. Le prolongement de la ligne Maginot est crucial pour garder les armées indésirables hors de France!"
 UFRA_infantry_focus:0 "Levée en masse"
 UFRA_infantry_focus_desc:0 "Tous les hommes et femmes qui peuvent se battre le feront. La production d'armes en masse réduira le coût. Nous mettrons un fusil entre les mains de tout le monde."
 UFRA_artillery_focus:0 "Grande Batterie"
 UFRA_artillery_focus_desc:0 "Notre artillerie formera une seule unité puissante pour concentrer le tir sur des points spécifiques. Une volée à la fois et nous affaiblirons la ligne ennemie et nous nous frayerons un chemin si nous devons!"
 UFRA_heavy_armor_focus:0 "Chars de Bataille"
 UFRA_heavy_armor_focus_desc:0 "Les chars de combat sont la voie à suivre pour l'armée française. Nous voulons contrôler le champ de bataille et pour cela nous aurons besoin de nouveaux chars puissants!"
 UFRA_motorized_focus:0 "Effort de la motorisation"
 UFRA_motorized_focus_desc:0 "Trouver de meilleures façons de construire nos véhicules d'infanterie nous aidera à soutenir et à renforcer les lignes de front."
 UFRA_mechanized_focus:0 "Effort de la mécanisation"
 UFRA_mechanized_focus_desc:0 "Les véhicules blindés jouent un rôle de plus en plus important dans la guerre. Bien qu'un peu moins intimidants que votre char moyen, ils nous donnent un avantage en matière de communication, de commandement, de transport et de guerre urbaine. "
 UFRA_light_medium_armor:0 "Automitrailleuses"
 UFRA_light_medium_armor_desc:0 "Selon la loi, l'infanterie contrôle toutes les forces de chars. Les « véhicules » ou Automitrailleuses plus légers et plus rapides sont mieux adaptés aux voyages et peuvent toujours infliger des dégâts avec leurs armes montées."
 UFRA_army_reform:0 "Réforme de l'Armée"
 UFRA_army_reform_desc:0 "Aucune unité d'infanterie ou char de haute technologie ne nous fera gagner la guerre à lui seul. Nous devons concentrer nos efforts sur le développement de nos capacités tactiques et stratégiques. Avec les bonnes personnes au travail, nous pouvons évoluer en tant qu'armée."
 UFRA_navy_focus:0 "Concentration sur la Marine"
 UFRA_navy_focus_tt:0 "Pas assez d'emplacements de production pour  §YNaval Base§!"
 UFRA_navy_focus_desc:0 "Si nous prévoyons d'étendre notre marine, la première étape consiste à améliorer et à étendre nos bases navales. Nos navires uniques nécessitent une attention constante pour rester prêts au combat à tout moment."
 UFRA_improved_screen_ships:0 "Améliorer les navires de Soutien"
 UFRA_improved_screen_ships_desc:0 "Les destroyers et les croiseurs légers jouent un rôle clé dans la défense de nos cuirassés ou porte-avions plus lourds. Si nous perdons notre ligne de défense en mer, nous risquons tous les navires et tous les hommes. Nous devons nous assurer que nos navires sont construits avec les dernières technologies."
 UFRA_capital_ship_focus:0 "Concentration sur les navires capitaux"
 UFRA_capital_ship_focus_desc:0 "Améliorer la conception de nos cuirassés conduirait à de grands avantages tactiques. Avec leur portée et leur puissance incontestées, personne ne pourra distancer leurs armes."
 UFRA_boat_planes:0 "Investir dans les Hydravions"
 UFRA_boat_planes_desc:0 "L'hydravions est suppérieur au avions embarqués. Il n'ont pas besoin de piste pour décoller ou atterir, et peuvent être opérer depuis n'importe quel navire de surface. Ils sont idéaux pour surveilleur nos océans"
 UFRA_carrier_focus:0 "Concentration sur les portes-avions"
 UFRA_carrier_focus_desc:0 "Les théoriciens navals ont attiré notre attention sur nos porte-avions obsolètes. Ils ont des suggestions sur la façon dont les portes-avions peuvent être davantage utilisés si le développement est poussé dans la bonne direction. De réels progrès ne peuvent être accomplis sans notre plein soutien."
 UFRA_initiate_government_reform:0 "Réforme du Gouvernement"
 UFRA_initiate_government_reform_desc:0 "Tle monde est devenu dangereux. Nous ne pouvons plus être liés par nos propres petites querelles. Il est temps de responsabiliser nos politiques et d'aller de l'avant pour le bien de la France."
 UFRA_support_the_left:0 "Soutenir la gauche"
 UFRA_support_the_left_desc:0 "Le Komintern se renforce. Il est temps de montrer que nos intérêts peuvent être alignés, et de soutenir nos organisations communistes."
 UFRA_leftist_rhetoric:0 "Rhétorique gauchiste"
 UFRA_leftist_rhetoric_desc:0 "Tle but est clair. L'égalité pour tous. Nous ne voulons pas d'intérêts capitalistes dans la politique française. Il est impératif que nous donnions des conditions optimales à nos organisations communistes pour s'épanouir."
 UFRA_scw_intervention_republicans:0 "Intervention républicaine"
 UFRA_scw_intervention_republicans_desc:0 "L'Espagne républicaine a besoin de notre aide ! Toute personne désireuse de se battre pour la cause devrait être autorisée à le faire. Nous ne pouvons pas permettre à un autre régime fasciste de gagner du terrain."
 UFRA_national_mobilization:0 "Mobilisation nationale"
 UFRA_national_mobilization_desc:0 "Nous avons enfin un gouvernement capable d'agir. Il est maintenant temps de renforcer notre armée et de se préparer à se battre pour la France."
 UFRA_humanite_unie:0 "Humanité Unie"
 UFRA_humanite_unie_desc:0 "Les gros banquiers et les démagogues assoiffés de pouvoir renforcent leur emprise sanglante sur le monde. Avec chaque jour qui passe, des hommes libres réduits en esclavage et le monde plongé davantage dans la crise, créée par la cupidité de l'individu. Les idéaux français sont plus que jamais nécessaires ! L'humanité a besoin de nous et nous devons unir l'humanité !"
 UFRA_join_comintern:0 "Rejoindre le Komintern"
 UFRA_join_comintern_desc:0 "Avec des ennemis partout où nous nous tournons, nous devons renforcer notre position avec de puissants alliés. Nos liens avec le Komintern se sont renforcés et il est temps de nous consacrer pleinement à leur cause."
 UFRA_support_status_quo:0 "Soutenir le Statut-quo"
 UFRA_support_status_quo_desc:0 "La France est le berceau et le protecteur de la liberté et doit le rester. Si nous voulons un jour retrouver l'unité, alors nous devons stabiliser notre démocratie avant qu'elle ne s'amenuise."
 UFRA_little_entente:0 "Petite Enetente"
 UFRA_little_entente_desc:0 "La Petite Entente, une alliance formée après la Grande Guerre pour empêcher l'agression de l'Autriche et de la Hongrie envers leurs voisins, a été soutenue par la France, mais a maintenant commencé à s'effondrer. Au lieu de sécuriser les liens avec la Grande-Bretagne, nous devrions prendre l'initiative de restaurer et de consolider cette faction, en commençant par ses fondateurs en Tchécoslovaquie."
 UFRA_go_with_britain:0 "Aller avec les britanniques"
 UFRA_go_with_britain_desc:0 "Avec la Russie changée à tout jamais, seules la France et la Grande-Bretagne subsitent de l'ancienne Triple Entente. Si l'histoire est vouée à se répéter, nous devons faire en sorte que ces deux nations, bastions de la démocratie et de la liberté en Europe, restent alliées."
 UFRA_use_US_nuclear_technics:0 "Utiliser les techniques Américaines"
 UFRA_use_US_nuclear_technics_desc:0 "Alors que nous essayont désespérément de mettre la main sur de l'eau lourde, nos collégues outre-atlantique utilise du Graphite enrichit pour modéré les neutrons. Faute d'alternative, utiliser cette solution pourrait nous permettre d'avancer sur nos recherches en nucléaire."
 UFRA_strengthen_government_support:0 "Renforcer le gouvernement"
 UFRA_strengthen_government_support_desc:0 "Nous avons fait des plans pour l'année suivante qui répondront aux souhaits des gens dans toutes les régions de la France. Montrez-leur que nous sommes capables d'agir et dignes de gouverner la France, afin que nous puissions à nouveau être solidaires."
 UFRA_reform_project_Gaston_Doumergue:0 "Projet de Réforme de Gaston Doumergue"
 UFRA_reform_project_Gaston_Doumergue_desc:0 "En 1934, proposé par l'ancien président de la République Gaston Doumergue, ce projet de réforme visait a réformé les lois constitutionnelle de 1857. Il vise nottamment a permettre au président de la République de dissoudre la Chambre des députés sans l'avis du Sénat. Cette réforme pourrait bien être la solution a l'instabilité politique française."
 UFRA_defensive_strategems:0 "Stratagèmes défensifs"
 UFRA_defensive_strategems_desc:0 "Si nous voulons que le peuple français mène une guerre pour nous, il est plus important que jamais que nous ayons une direction claire. Il faut arrêter de se battre entre nous, et se battre pour la France, la Liberté, l'égalité et la fraternité!"
 UFRA_invite_yugoslavia:0 "Inviter la Yougoslavie"
 UFRA_invite_yugoslavia_desc:0 "La Yougoslavie a suffisamment de soucis sans avoir à se soucier de voisins expansionnistes. Les ramener dans la Petite Entente serait un grand service pour eux et pour nous-mêmes."
 UFRA_invite_romania:0 "Inviter la Roumanie"
 UFRA_invite_romania_desc:0 "La démocratie roumaine est fragile, prise entre ses factions fascistes internes et le communisme soviétique. Les faire entrer dans la Petite Entente leur permettra de conserver une stabilité avec notre soutien."
 UFRA_polish_guarantee:0 "Garantie polonaise"
 UFRA_polish_guarantee_desc:0 "Des diplomates polonais ont exprimé leurs inquiétudes quant aux tensions à leurs frontières. Une garantie de notre puissante nation devrait dissuader quiconque planifiant une invasion."
 UFRA_czech_guarantee:0 "Garantie tchèque"
 UFRA_czech_guarantee_desc:0 "La tension monte à la frontière tchèque. Nous ne pouvons pas permettre à des nations expansives de prendre le contrôle d'une nation libre et démocratique. Les Tchèques doivent rester un peuple libre. Avec une garantie de notre part, quiconque planifie une invasion y réfléchira à deux fois."
 UFRA_revise_versailles:0 "Réviser le Traité de Versailles"
 UFRA_revise_versailles_desc:0 "Les Allemands ignorent déjà les réparations prévues par le traité de Versailles, montrant que la France n'inspire plus le respect. Nous avons le droit d'exiger plus pour les vies perdues dans la Grande Guerre, mais un traité juste exigerait une France forte, une France nouvelle, pour l'appliquer."
 UFRA_support_the_right:0 "Soutenir la droite"
 UFRA_support_the_right_desc:0 "La France a toujours été une nation forte et fière, mais le manque d'action gouvernementale a divisé le peuple. Nous devons unir la France et affirmer notre supériorité et notre force pour éviter de succomber à la décadence."
 UFRA_right_wing_rhetoric:0 "Rhétorique de l'aile droite"
 UFRA_right_wing_rhetoric_desc:0 "Wnous devons nous concentrer sur l'atteinte de tous les Français et élever leur esprit national. Montrez-leur que nous pouvons être les dirigrants puissants dont ils ont besoin et ils deviendront de fiers citoyens de notre glorieuse nation. »
 UFRA_scw_intervention_nationalists:0 "Intervention nationaliste"
 UFRA_scw_intervention_nationalists_desc:0 "Les nationalistes gagnent enfin du terrain en Espagne. Leur cause est juste et toute personne désireuse de se battre pour eux devrait être autorisée à le faire."
 UFRA_army_of_aggression:0 "Armée d'agression"
 UFRA_army_of_aggression_desc:0 "Nous ne pouvons plus nous asseoir derrière un mur obsolète, alors que nos ennemis sévissent à travers l'Europe. Il est temps de renforcer notre armée et de repousser nos frontières pour que la France continue d'être une grande nation."
 UFRA_france_first:0 "La France d'abord"
 UFRA_france_first_desc:0 "Nous sommes la France ! Vainqueurs de la Grande Guerre ! Sauveurs de l'Europe ! Nous sommes le foyer des plus grands penseurs que ce monde ait vu. Trop de nations cherchent à plonger le monde dans le chaos. Nous sommes nécessaires, et nous répondrons à l'appel. Nous prendrons la barre, traverserons la tempête et dirigerons l'humanité vers la sécurité sous notre règne !"
 UFRA_woo_italy:0 "Courtiser l'Italie"
 UFRA_woo_italy_desc:0 "L'Italie a le potentiel pour devenir une nation puissante. Grâce au solide leadership de Mussolini, le peuple italien est uni et prêt à se battre pour la bonne cause. Que cette cause soit la nôtre."
 UFRA_dismantle_the_democracies:0 "Démanteler les démocraties"
 UFRA_dismantle_the_democracies_desc:0 "La nouvelle [GER.GetAdjective] allaince démocratique centrale menace nos positions. Nous devons passer à l'action maintenant, avant qu'ils ne deveinnent trop puissants."
 UFRA_join_germany:0 "Rejoindre l'Allemagne"
 UFRA_join_germany_desc:0 "Le Reich allemand devient une force avec laquelle il faut compter. Leur vision d'un avenir meilleur peut être alignée sur nos intérêts. Nous devons les soutenir et une fois que la poussière sera retombée, la France aura sa part d'Europe qui lui revient."
 UFRA_naval_doctrine:0 "Doctrine navale"
 UFRA_naval_doctrine_desc:0 "Les progrès récents dans la conception des navires ont ouvert de nouvelles options dans les manœuvres tactiques et stratégiques. Avant de prendre des risques avec ces nouvelles théories, nous devons les tester correctement et les plans solidifiés."
 UFRA_air_focus:0 "Armée de l'Air"
 air_focus_bypass_tt:0 "Pas assez d'emplacement de construction pour §YAir Base§!"
 UFRA_air_focus_desc:0 "Le temps est venu d'élargir notre armée de l'air ! Des plans ont déjà été élaborés pour commencer la construction de nouvelles bases aériennes afin de soutenir une forte augmentation du personnel et des avions."
 UFRA_cas_focus:0 "Priorité CAS"
 UFRA_cas_focus_desc:0 "Les avions qui soutiennent nos forces terrestres et nos navires ont été un ajout très efficace pour un investissement relativement faible. Ces avions ont maintenant plusieurs améliorations suggérées. Nos ingénieurs peuvent développer la prochaine génération d'avions de soutien."
 UFRA_fighter_focus:0 "Acheter les avions du Programme C1"
 UFRA_fighter_focus_desc:0 "Le 13 juillet 1934, nous avons lancé un concours de chasseur monoplace pour remplacés nos avions D.500. Les gagnants retenus furent le MB.150 et le MS.405. Maintenant que leurs prototypes ont été tester, nous pouvons passer commande !"
 UFRA_sell_fighter_swiss:0 "Vendre nos chasseurs"
 UFRA_sell_fighter_swiss_desc:0 "Les suisses et les grecques ont affirmer leurs volontés d'acquérir un nouveau modèle de chasseur. Si nous arrivons a faire bonne impression, nous pourrons en tirer un bon prix!"
 UFRA_modern_fighter_focus:0 "Développer un succéseur au MS.406"
 UFRA_modern_fighter_focus_desc:0 "Les progrès en aviation ne cesses d'arriver, et ils nous faut déjà commencer un succéseur au dernier modèles en date."
 UFRA_bomber_focus:0 "Rénover la flotte tactique"
 UFRA_bomber_focus_desc:0 "Beaucoup de nos bombardies tactiques sont de vieux modèle parfois calqué sur des avions de transport, et nous n'avons toujours pas lancé de programme de modernisation. Il est temps de faire quelque chose !"
 UFRA_paratrooper:0 "Centre d'instruction de parachutisme"
 UFRA_paratrooper_desc:0 "Fondateur du centre d'instruction de parachutisme de l'Armée de l'Air après un stage en URSS, le capitaine Frédéric Gille souhaiterait créer une unité de parachutiste pour notre armée."
 UFRA_heavy_fighter_focus:0 "Acheter les avions de Potez"
 UFRA_heavy_fighter_focus_desc:0 "Le modèle d'avion Potez 630 est très flexible, et n'a pas besoin de beacoup de changement pour remplir des rôles différent, tel que chasseur lourd, bombardier et avion de reconnaissance."
 UFRA_air_doctrine:0 "Doctrinne aérienne"
 UFRA_air_doctrine_desc:0 "Nous avons acquis suffisamment d'expérience pour tester de nouvelles théories de la guerre aérienne à un rythme plus rapide. Cela nous permettra d'explorer de nouvelles possibilités tactiques et stratégiques. Le combat aérien est la clé de la guerre moderne."
 UFRA_heavy_bomber_focus:0 "Priorité aux bombardiers lourds"
 UFRA_heavy_bomber_focus_desc:0 "Les bombardiers lourds modernes seront armés pour gérer seuls des escarmouches aériennes de moindre importance. Si nous permettons à nos ingénieurs de se concentrer sur le développement de la technologie la plus récente, nous aurons de meilleures chances de détruire les installations de production ennemies."
 UFRA_naval_bomber_focus:0 "Priorité aux bombardiers navals"
 UFRA_naval_bomber_focus_desc:0 "Sles navires se sont avérés exceptionnellement vulnérables aux aéronefs. Nous devons continuer à améliorer leur technologie pour nous assurer de garder une longueur d'avance sur toutes les contre-mesures."
 UFRA_blum_stays:0 "Blum reste"
 UFRA_blum_stays_desc:0 "Blum est l'homme qui a rendu possible le Front populaire. Il est un disciple du leader socialiste français Jean Jaurès et après l'assassinat de Jaurès en 1914, est devenu son successeur. En tant que Premier ministre du gouvernement du Front populaire, c'est lui qui a assuré la série des grandes réformes économiques. Malgré ses idées pacifistes, lui seul peut sauver la France."
 UFRA_appoint_daladier:0 "Soutenir Daladier"
 UFRA_appoint_daladier_desc:0 "Face au danger imminent que représente l'Allemagne, la France a besoin d'un leader capable de défendre son peuple. Qui mieux que le ministre de la défense, leader du Parti radical et membre du Front populaire, Edouard Daladier. C'est un fervent partisan du réarmement !"
 UFRA_reynaud_financial_reforms:0 "Réforme financière de Reynaud"
 UFRA_reynaud_financial_reforms_desc:0 "Si la France doit se réarmer, le pays doit d'abord se débarrasser de tout ce qui freine la production. Une grande partie des réalisations du Front populaire sont impressionnantes et nécessaires, mais elles ralentissent notre capacité de guerre. Nous devons changer cela."
 UFRA_firmness_and_rearmement:0 "Fermeté et réarmement"
 UFRA_firmness_and_rearmement_desc:0 "Daladier a fait part de ses intentions de fermeté à l'Allemagne. Et pour cela, la France doit se réarmer agressivement. Peut-être qu'un accord peut être conclu avec les États-Unis ?"
 UFRA_continue_social_reforms:0 "Continuer les réfomres sociales"
 UFRA_continue_social_reforms_desc:0 "Les premières séries de réformes tels que celles obtenues lors des accords de Matignon sont un bon début. Mais il temps de passer à la vitesse supérieur en réformant toujours plus le code du travail"
 UFRA_improve_free_education:0 "Réfomre de l'éducation de Jean Zay"
 UFRA_improve_free_education_desc:0 "Les réformes obtenues sous Jules Ferry sont certes correctes mais il convient de mettre à jour tout cela. Nous devrions instiguer différents degrés dans l'enseignement, prolonger l'obligation scolaire ainsi que mettre plus le sport au diapason."
 UFRA_ask_belgium_to_submit:0 "Demander à la Belgique de se soumettre"
 UFRA_ask_belgium_to_submit_desc:0 "Le plan de défense de la France tomba lorsque la Belgique renonca à l'alliance entre nos deux pays. Il est temps de demander à la Belgique de se soumettre afin que nous puissions défendre efficacement notre pays et le leur."
 UFRA_reinforce_belgium:0 "Fortifier la Belgique"
 UFRA_reinforce_belgium_desc:0 "Les forts se situant en Belgique ont certes ralentis les allemands durant la première guerre mais celles-ci sont dépassées. Il convient non seulement de les mettre à jour mais aussi d'en ajouter sur les points clés du paysage belge."
 UFRA_women_suffrage:0 "Suffrage féminin"
 UFRA_women_suffrage_desc:0 "Il est aussi absurde que que les Françaises, en dépit de tous leurs labeurs, qui ont si souvent tenu les barricades aux côtes des hommes pour défendre leurs droits, ne soient pas autorisées à voter aux élections. Il est temps de mettre fin a cette injustice."
 UFRA_crush_bismarck_dream:0 "Couler le rêve de Bismarck"
 UFRA_crush_bismarck_dream_desc:0 "Le triomphe des Prussiens sur la France leur a permis d'unir les minuscules États allemands sous leur autorité. Maintenant que les Allemands ont été vaincus, ce n'est donc que justice que la situation soit renversée."
 UFRA_forgive_germany:0 "De l'eau sous les ponts"
 UFRA_steyr_arms:0 "Bras de Steyr"
 UFRA_swiss_gold:0 "Or suisse"
 UFRA_relocate_german_industry:0 "Relocaliser l'industrie allemande"
 UFRA_integrate_german_states:0 "Intégrer les états allemands"
 UFRA_latin_wine_cooperation:0 "Coopération latine du vin"
 UFRA_latin_wine_cooperation_desc:0 "Maintenant que nous contrôlons l'Espagne, l'Italie et le Portugal, la majeure partie de la production mondiale de vin est sous notre contrôle. Et pas n'importe quel vin, les meilleurs vins du monde. C'est une source d'argent incroyable, mais la production doit être centralisée et coordonnée. La Coopération Vinicole Latine sera en charge de cette Mission."
 UFRA_via_romana:0 "Via Romana"
 UFRA_mediteranean_fleet:0 "Flotte méditérranéenne"
 UFRA_italian_air_industry:0 "Industrie aéronatique italienne"
 UFRA_integrate_latin_states:0 "Intégrer les états latins"
 UFRA_retake_constantinople:0 "Reprendre Constantinople"
 UFRA_press_the_gibraltar_claim:0 "Presser la revendication sur Gibraltar"
 UFRA_centralize_the_union:0 "Centraliser l'union"
 UFRA_prepare_mexican_coup:0 "Préparer le coup mexicain"
 UFRA_put_otto_on_the_mexican_throne:0 "Mettre Otta sur le trône de Mexique"
 UFRA_reestablish_elections:0 "Ré-établir les élections"
 UFRA_christian_democracy:0 "Démocratie chrétienne"
 UFRA_egalite_monarchy:0 "Egalité pour les femmes"
 UFRA_egalite_monarchy_desc:0 "Dans tous les domaines qui comptent, les femmes sont toujours considérées comme des citoyennes de seconde zone, toujours soumises à la volonté d'un homme. Ce non-sens se termine maintenant."
 UFRA_freedom_monarchy:0 "Protéger la liberté d'expression"
 UFRA_restore_the_divine_right:0 "Restorer le droit divin"
 UFRA_restore_the_divine_right_desc:0 "Le droit divin des rois, ou théorie de droit divin de la royauté, est une doctrine politique et religieuse de légitimité royale et politique. Il affirme qu'un monarque n'est soumis à aucune autorité terrestre, tirant son droit de régner directement de la volonté de Dieu."
 UFRA_counter_revolution:0 "Contre-révolution"
 UFRA_the_real_country:0 "Le véritable Etat"
 UFRA_authority_and_prestige:0 "Autorité et prestige"
 UFRA_the_real_country_desc:0 "Maurras oppose le Pays Juridique au Pays Réel. Le Pays Juridique est celui de l'administration, des politiciens et des bureaucrates. Le Vrai est celui de la Tradition, des Français, du Roi et des régions, Bretons, Normands, Corses... Actuellement le Pays Juridique est celui qui a le pouvoir, mais plus !"
 UFRA_review_radio_role:0 "Revoir le rôle de la radio"
 UFRA_review_radio_role_desc:0 ""
 UFRA_review_tanks_role:0 "Revoir le rôle des chars"
 UFRA_review_tanks_role_desc:0 "Depuis son invention, les chars ont beaucoup évoluée. Autrefois aussi rapide qu'un homme, ils sont maintenant plus rapide que la cavalerie. Leurs mitrailleuses ont été remplacés par d'imposants canon et leurs blindage a augmenté pour survivre au nouveau champs de bataille. Nos tactiques sont caduc, nous devons reconsidérer le rôle des chars dans notre armée."
 UFRA_create_propaganda_apparatus:0 "Secrétariat d'Etat à l'Information"
 UFRA_create_propaganda_apparatus_desc:0 "Avoir les chaînes de télévisons a notre service nous permettra de ne montrer que ce que le peuple doit voir"
 UFRA_french_election:0 "Elections de 1936"
 UFRA_communist_win:0 "Alliance avec le SFIC"
 UFRA_fascist_win:0 "Radicalisation du Bloc National"
 UFRA_royalist_coup:0 "Coup d'état de l'Action Française"
 UFRA_bonapartist_restauration:0 "Junte militaire bonapartiste"
 UFRA_popular_front_win:0 "La démocratie prévaut"
 UFRA_put_opponents_to_work:0 "Camps de travail"
 UFRA_extensive_conscription:0 "Militariser la Milice"
 UFRA_extensive_conscription_desc:0 "La Milice doit être transformée en force régulière, comme les Allemands l'ont fait avec les SS. Cela garantira l'obéissance dans l'armée."
 UFRA_direction_for_interior_security:0 "Les services secrets de la Milice"
 UFRA_direction_for_interior_security_desc:0 "La Milice a créé un réseau d'information efficace. Cela peut être utilisé à notre avantage ! Il faut officialiser leurs services secrets !"
 UFRA_an_army_to_challenge_ger:0 "Une armée pour rivaliser avec l'Allemagne"
 UFRA_plan_german_betrayal:0 "Plan de trahison allemand"
 UFRA_forced_assimilation:0 "Accélerer l'assimilation"
 UFRA_forced_assimilation_desc:0 "Nous devons utiliser ces vastes terres en Afrique pour installer les Français. Un bon Français vaut 500 habitants. En tant que tel, nous devons accélérer la colonisation de ces terres, par la force et la violence."
 UFRA_destroy_us_liberalism:0 "En finir avec le libéralisme américain"
 UFRA_destroy_us_liberalism_desc:0 "Des terres lointaines, des terres lointaines de l'autre côté de l'océan Atlantique, dans le Nouveau Monde, vient le nouveau fléau du monde ; le libéralisme américain. Mais nous ne le tolérerons plus !"
 UFRA_modern_knights:0 "Chevaliers modernes"
 UFRA_modern_knights_desc:0 "Notre idéal est pur et noble. Nous allons rajeunir la France et la sauver de la pourriture morale. Fidélité, honneur, loyauté, nous resterons droits et nous suivrons notre code pour toujours."
 UFRA_minimum_wage:0 "Salaire minimum"
 UFRA_minimum_wage_desc:0 "Le travailleur est le constituant le plus vital de la nation. Il doit donc être protégé. Nous allons introduire le SMIC, le salaire minimum, pour aider chaque travailleur à pouvoir vivre confortablement."
 UFRA_vote_for_women:0 "Vote limité pour les femmes"
 UFRA_vote_for_women_desc:0 "Les femmes sont l'épine dorsale du pays. Par conséquent, ils doivent être autorisés à participer à la vie politique."
 UFRA_the_great_war_model:0 "Le modèle de la Grande guerre"
 UFRA_the_great_war_model_desc:0 "Nous sommes un mouvement politique créé par des soldats qui ont vu la Grande Guerre. Dans ce moment sombre de notre histoire, nous avons vu un modèle efficace, à appliquer à la société française. Celui où les classes travaillent ensemble, vivent ensemble et avancent ensemble, côte à côte, comme elles l'ont fait dans les tranchées."
 UFRA_french_path_to_fascism:0 "la voie française vers le fascisme"
 UFRA_french_path_to_fascism_desc:0 "La France ne sera pas juste une autre marque de fanatisme aveugle comme dans l'Allemagne hitlérienne. Notre fascisme sera pur et efficace, magnifiquement forgé par la passion et la volonté française."
 UFRA_crush_the_german_danger:0 "Frapper le danger allemand"
 UFRA_crush_the_german_danger_desc:0 "Tle principal danger de l'Europe, c'est l'Allemagne. Cela a toujours été le cas, de Rome à 1870 et 1914. L'Allemagne doit être arrêtée une fois pour toutes."
 UFRA_power_to_the_military_junta:0 "C'est l'armée qui décide le mieux"
 UFRA_the_napoleon_referundum:0 "Le référundum de Napoléon"
 UFRA_the_napoleon_referundum_desc:0 "L'héritier du trône de Napoléon a été très clair. Il n'acceptera le trône que si le peuple le choisit, par référendum, pour l'avoir comme chef."
 UFRA_revise_the_constitution_2:0 "Réviser la constitution"
 UFRA_revise_the_constitution_2_desc:0 "La constitution républicaine a toujours été conçue comme un palliatif qu'on a laissé perdurer trop longtemps. Maintenant, nous allons la réécrire pour permettre à un monarque de revenir."
 UFRA_restore_order:0 "Restaurer l'ordre"
 UFRA_restore_order_desc:0 "Après le coup d'État, la France est dans le chaos. Nous devons rétablir l'ordre par la force militaire si nécessaire."
 UFRA_failed_af_coup:0 "Le coup échoué"
 UFRA_popular_front_victory:0 "Victoire du Front Populaire"
 UFRA_national_bloc_victory:0 "Victoire du Bloc Nationale"
 UFRA_national_bloc_victory_desc:0 "Le paysage politique se radicalise de jour en jour. La gauche murmure de faire cause commune avec les communistes. Ce qu'il faut maintenant, c'est un leadership fort et stable."
 UFRA_ban_soviet_lackeys:0 "Bannir les laquais des soviétiques"
 UFRA_ban_soviet_lackeys_desc:0 "Les communistes et certains de leurs alliés de la SFIO ne sont que des laquais sous les ordres des bolchéviques. Nous devons les arrêter."
 UFRA_mouvement_national_laval:0 "Mouvement National"
 UFRA_mouvement_national_laval_desc:0 "Pour sauver la France des éléments étrangers qui tentent de la détruire, un Mouvement National doit être créé."
 UFRA_ally_petain:0 "S'allier à Petain"
 UFRA_ally_petain_desc:0 "Nous devons obtenir l'approbation du Lion de Verdun, le Vieux Maréchal est un symbole français et apportera de la légitimité à notre cause."
 UFRA_1935_petains_plan:0 "Plan de Pétain 1935"
 UFRA_1935_petains_plan_desc:0 "Le Plan Pétain de 1935 est un plan qui a failli être mis en œuvre pour s'appuyer moins sur la Ligne Maginot et plus sur les chars ! Il comprend la production de plus de 1500 chars légers."
 UFRA_ally_doriot:0 "S'allier à Doriot"
 UFRA_ally_doriot_desc:0 "Doriot est un ancien communiste qui a compris qu'il fallait mettre la Nation en premier. Il est un élément clé des Ligues et nous devons sécuriser son alliance."
 UFRA_doriot_work_charter:0 "Chartre du travail de Doriot"
 UFRA_doriot_work_charter_desc:0 "La Charte du Travail est une nouvelle législation proposée par Doriot. Il comprend des éléments proches du fascisme et du corporatisme italiens."
 UFRA_rally_the_communists:0 "Rallier les communistes"
 UFRA_rally_the_communists_desc:0 "Rallier les communistes"
 UFRA_national_popular_rally:0 "Rassemblement national populaire"
 UFRA_national_popular_rally_desc:0 "Certains socialistes et communistes, comme Marcel Déat ou Pierre Clementi, comprennent la nécessité d'une Révolution nationale. Ils veulent créer un rassemblement séparatiste des socialistes et des communistes ; le Rassemblement National Populaire."
