 # Titles and Desc
  parliament_gui_decision_category:0 "Chambre de Députés§!"
  parliament_gui_decision_category_desc:0 "La Chambre de Députés est l'assemblée legislative du parlement français, élu par suffrage universel tout les 4 ans. Avec le Senat, elle forme l'Assemblée Nationale. L'Assemblée élit le président de la République pour 7 ans, mais peut aussi le renvoyer. Enfin, l'Assemblée vote les prpositions de loi."

