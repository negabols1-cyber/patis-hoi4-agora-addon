 # Titles and Desc
  parliament_gui_decision_category:0 "French Chamber of Deputies"
  parliament_gui_decision_category_desc:0 "The Chamber of Deputies is the legislative assembly of the French parliament, elected by universal suffrage every 4 years. With the Senate, it forms the National Assembly. The Assembly elects the President of the Republic for 7 years, but can also dismiss him. Finally, it's the Assembly who votes on the bills."

