l_english:
 ufra_heavy_water_raid:0 "Repatriate heavy water"
 ufra_heavy_water_raid_desc:0 "§LThe [NOR.GetHabitants] are the only ones in Europe to have enough heavy water to conduct nuclear fission experiments. The [GER.GetHabitants] are already buying heavy water from the [NOR.GetHabitants] and have even requested an increased delivery quantity. We need to secure the [NOR.GetHabitants] inventory ASAP.§!"
 ufra_heavy_water_infiltration:0 "Sending agents by plane"
 ufra_heavy_water_infiltration_desc:0 "Norway is still neutral, we can send our agents on a commercial plane to Oslo."
 ufra_heavy_water_attack:0 "Convince the bosses of the factory"
 ufra_heavy_water_attack_desc:0 "The Norwegian company had requested French capital when it was created in 1904. Paribas had provided 90% of the initial budget. Since then we have had close ties with the company"
 ufra_heavy_water_exfiltration:0 "Exfiltration"
 ufra_heavy_water_exfiltration_desc:0 "Heavy water will be stored in drums and quietly taken out of the plant at night. It will be transported by boat to London then Paris"
 ufra_heavy_water_raid_outcome_tt:0 "We will try to capture heavy water in order to make progress in the field of nuclear research."
 ufra_heavy_water_infiltration_outcome:0 "The team moved to Oslo."
 ufra_heavy_water_attack_outcome:0 "The team managed to successfully infiltrate the factory, avoiding the guards. The boss agreed to give us heavy water."
 ufra_heavy_water_exfiltration_outcome:0 "The team managed to take a boat to london with all the cans"
 ufra_heavy_water_exfiltration_outcome_fail:0 "Norwegian police say they captured French agents with heavy water canisters.