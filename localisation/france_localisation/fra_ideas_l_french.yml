 FRA_state_paganism:0 "Paganisme Celte"
 FRA_state_paganism_desc:0 ""
 FRA_state_atheism:0 "Athéisme d'Etat"
 FRA_state_atheism_desc:0 "Il n'est pas de sauveur suprême. Ni Dieu, Ni César, Ni Tribuns. Travailleurs sauvons-nous nous-mêmes. Travaillons au Salut Commun!"
 FRA_small_weapons_program:0 "Production d'armes d'infanterie"
 FRA_small_weapons_program_desc:0 "La guerre moderne ne peut se faire qu'avec des outils modernes. Vous n'êtes qu'aussi bon que vos outils, n'est-ce pas ?"
 FRA_artillery_program:0 "Production d'artillerie"
 FRA_artillery_program_desc:0 "Al'artillerie a toujours été la meilleure arme de France depuis Napoléon. Mais seul un canon sur deux est à jour. Changeons ça."
 FRA_motor_program:0 "Programme de Motorisation de masse"
 FRA_motor_program_desc:0 "La motorisation est l'avenir de la guerre. Il est temps que nous assurons que l'armée française ne soit pas laissée dans le passé!"
 FRA_dgse:0 "DGER"
 FRA_dgse_desc:0 "La Direction Générale des Etudes et Recherches, ou Direction Générale des Etudes et de la Recherche, est l'agence française de renseignement extérieur, centrée sur le renseignement extérieur et les opérations secrètes."
 FRA_dgsi:0 "BCRA"
 FRA_dgsi_desc:0 "Le Bureau Central de Renseignements et d'Action, ou Bureau Central du Renseignement et des Opérations, a pour objectif principal d'assurer la sécurité sur le territoire français, de contrer les influences étrangères et de combiner les rôles policiers et politiques."
 FRA_ex_colonies_invest:0 "Investissements dans nos nouveaux alliés"
