 FRA_camelots_du_roi:0 "Camelots du Roy"
 FRA_camelots_du_roi_desc:0 "Les Camelots du Roi est l'organisation de jeunesse de l'Action Française. Ils deviendront désormais la meilleure organisation de jeunesse officielle de France ! Vive les Camelots du Roy, servir la France et le Roi est leur devise !"
 FRA_militarist_society:0 "Société Militariste"
 FRA_militarist_society_desc:0 ""
 FRA_code_civil:0 "Le nouveau Code Civil"
 FRA_code_civil_desc:0 "Le Code Napoléon, officiellement Code civil des Français est le code civil français établi sous le Consulat de France en 1804 et toujours en vigueur. Nous allons créer un nouveau Code Civil établissant les nouvelles règles de notre Empire."
 FRA_tear_republicans_symbols:0 "Destruction des symboles Républicains"
 FRA_tear_republicans_symbols_desc:0 ""
 FRA_furia_francese:0 "Furie francaise"
 FRA_furia_francese_desc:0 "En 1495, les Italiens, à la bataille de Fornoue, ont décrit le courage et la détermination français comme Furia Francese, la Furie française. Il est temps que le peuple français regagne cette fureur et la déchaîne sur ses ennemis !"
 FRA_milice_peace:0 "La Milice"
 FRA_milice_peace_desc:0 ""
 FRA_chantiers_jeunesse:0 "Chantiers de la Jeunesse Francaise"
 FRA_chantiers_jeunesse_desc:0 "Les Chantiers de la jeunesse française, seront une organisation de jeunesse, un peu comme le scoutisme, pour former et aider à alimenter le jeune nationalisme."
 FRA_industrialists_alliance:0 "Alliance avec les Industriels"
 FRA_industrialists_alliance_desc:0 "De nombreuses familles industrielles partagent les mêmes idéaux que nous et soutiennent notre cause. LOréal, Lessieur... De telles connexions seront indispensables pour construire la Nouvelle-France!"
