 FRA_furia_francese:0 "Furia Francese"
 FRA_furia_francese_desc:0 "In 1495, the Italians, at the battle of Fornoue, described French courage and determination as Furia Francese, the French Fury. It is time for the French people to regain this fury and to unleash it on their ennemies!"
