 FRA_bop_assemblee_consultative_provisoire:0 "Assemblée consultative provisoire"
 FRA_bop_assemblee_consultative_provisoire_desc:0 "L'Assemblée consultative provisoire est une assemblée française représentant les mouvements résistants, les partis politiques et les territoires engagés dans la guerre aux côtés des Alliés sous la direction du Comité français de libération nationale (CFLN)."
 FRA_bop_promise_new_government:0 "Promettre l'instauration d'une nouvelle république"
 FRA_bop_promise_new_government_desc:0 "Nos institutions d'avant guerre étais trop désolidariser, et nous a empêché d'établir une réponse forte face a l'agresseur. Pour notre nouvelle république, il nous faudra un pouvoir présidentiel renforcés."
 FRA_bop_put_old_government:0 "Promettre de rétablir le pouvoir d'avant guerre"
 FRA_bop_put_old_government_desc:0 "Le régime de Vichy est llégitime nul et non avenu. Nous rétabliront le gouvernement Français d'avant guerre."
 FRA_bop_promise_women_vote:0 "Donner le droit de vote aux femmes"
 FRA_bop_promise_women_vote_desc:0 "Dès l’ennemi chassé du territoire, les hommes et les femmes de chez nous éliront l’Assemblée Nationale qui décidera souverainement aux destinées de la Nation"
 FRA_bop_add_giraud_support:0 "Nommer des commissaires Giraudistes"
 FRA_bop_add_giraud_support_desc:0 ""
 FRA_bop_add_gaulle_support:0 "Nommer des commissaires Gaullistes"
 FRA_bop_add_gaulle_support_desc:0 ""
 FRA_bop_promise_kill_collabo:0 "Promettre le procès des collabos"
 FRA_bop_promise_kill_collabo_desc:0 "Les collaborateurs ont trahi la République et la France. Laval, Pétain, Darnant, Brazillac... A la libération, nous devrions faire d'eux des exemples."
 FRA_bop_promise_work_with_collabo:0 "Promettre d'acceuillir les fidèles de Vichy"
 FRA_bop_promise_work_with_collabo_desc:0 "Nous ne pouvons pas juger ainsi les fidèles de Vichy. La situation était désespérée et notre population en grand danger. Si nous voulons donner a la France une nouvelle chance, il nous faut tous les Hommes."
 FRA_bop_liberty_of_expression:0 "Rétablir la liberté d'expression"
 FRA_bop_liberty_of_expression_desc:0 ""
 FRA_bop_gaulle_radio_alger:0 "Discours de De Gaulle à Radio-Alger"
 FRA_bop_gaulle_radio_alger_desc:0 ""
 FRA_bop_gaulle_tunis:0 "Renforcer l'influence de De Gaulle en Tunisie"
 FRA_bop_gaulle_tunis_desc:0 "Contactont Lamine Bey a Tunis pour nous assurer son soutien"
 FRA_bop_gaulle_moroco:0 "Renforcer l'influence de De Gaulle au Maroc"
 FRA_bop_gaulle_moroco_desc:0 "Contactont le Sultan Mohammed V au Maroc pour nous assurer son soutien"
 FRA_bop_gaulle_AOF:0 "Renforcer l'influence de De Gaulle en Afrique Occidentale"
 FRA_bop_gaulle_AOF_desc:0 ""
 FRA_bop_giraud_to_the_states:0 "Renforcer l'influence de Giraud aux Etats-Unis"
 FRA_bop_giraud_to_the_states_desc:0 "Envoyons Henri Giraud aux Etats-Unis pour nous assurer leurs soutien"
 FRA_bop_end_racial_laws:0 "Abroger les lois de discrimination raciale"
 FRA_bop_end_racial_laws_desc:0 "Nous ne pouvons pas tolérer des lois discriminatoires de Vichy sur notre territoire"
 FRA_bop_cremieux_decree:0 "Rétablir le décret Crémieux"
 FRA_bop_cremieux_decree_desc:0 "Giraud c'est montrer particulièrement hostile envers le décret Crémieux, décret donnant la citoyennentée Française au Israléites indigénes d'Algérie. Nous ne pouvons permettre cette discrimination sur notre territoire."
 FRA_bop_promise_french_union:0 "Promettre une Union Française"
 FRA_bop_promise_french_union_desc:0 "Il est temps de proclamer une France nouvelle, une France à l'échelle du globe, dans laquelle toutes les parties de notre royaume sont unies. Quand la métropole sera libre, nous organiserons des référendums partout pour confirmer la volonté du peuple de faire partie de cette nouvelle et grande France."
 
 
 
