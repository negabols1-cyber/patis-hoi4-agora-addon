 FRA_evacuation:0 "Evacuation coordonée"
 FRA_evacuation_desc:0 "L’exode de 1940 en France est une fuite massive de populations belges, néerlandaises et françaises en mai-juin 1940 lorsque l'armée allemande envahit les Belenux et la majorité du territoire français pendant la bataille de France. L'ampleur de l'exode est en partie dû au souvenir douloureux de l’occupation des régions envahies par l’Allemagne de 1914 à 1918."
 UFRA_total_evacuation:0 "Evacuation totale des civiles dans les [From.GetName]"
 UFRA_total_evacuation_desc:0 "Les allemands menaces encore plus les [From.GetName] que nous avons déjà partiellement évacuer, nous devons absolument évacuer tous le reste de la population de ses zones la avant que l'ennemi n'arrive."
 UFRA_return_home:0 "Rapatrier les civils chez eux"
 UFRA_return_home_desc:0 "Le front c'est déplacer et notre population n'est plus en danger de l'ennemi. Nous pouvons renvoyer nos pauvres compatriotes chez eux !"
 UFVIC_return_home:0 "Rapatrier les fuyards chez eux"
 UFVIC_return_home_desc:0 "La situation des exilés et devenus disproportionner, et l'allemagne n'est plus un danger pour nous, nous devons renvoyer ses pauvres français chez eux."
 UFRA_evacuate_FROM:0 "Evacuez partiellement [From.GetName]"
 UFRA_evacuate_FROM_with_BEL:0 "Evacuez partiellement [From.GetName]"
 
