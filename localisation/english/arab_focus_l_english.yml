l_english: 
 ARB_united_arabia:0 "United Arabia"
 ARB_united_arabia_desc:0 "Through perseverance, vision, and strength, we have accomplished what generations of dreamers only imagined: the unification of the Arab homeland under a single banner. This is not just a political achievement it is the rebirth of a civilization."
 ARB_arabian_iraqi_railways:0 "Arabian-Iraqi railways"
 ARB_arabian_iraqi_railways_desc:0 "To truly unify the Arab world, roads alone are not enough. We must bind our lands with steel and motion. The construction of railways between Arabia and Iraq will solidify our logistical backbone and ensure the free flow of goods, troops and people."
 ARB_push_through_iran:0 "Push Through Iran"
 ARB_push_through_iran_desc:0 "Extending our railway network into Iranian territory will unlock new routes for trade, influence and strategic deployment. Though the terrain is harsh and the politics harsher, the long-term rewards outweigh the cost."
 ARB_merge_the_industries:0 "Merge the Industries"
 ARB_merge_the_industries_desc:0 "With the Arab states united, there is no need for redundant, fragmented industries. By coordinating production and consolidating facilities, we can achieve economies of scale and fuel our collective advancement."
 ARB_protector_of_the_arab_world:0 "Shield of the Ummah"
 ARB_protector_of_the_arab_world_desc:0 "It is not enough to unify we must also defend. As the strongest Arab power, it falls to us to protect our brothers against external threats, internal subversion and imperial meddling."
 ARB_extract_soil:0 "Extracting Resources"
 ARB_extract_soil_desc:0 "The lands of Arabia are rich in minerals, oil, and other natural wealth. Now that we stand united, we can fully exploit these resources not for foreign gain, but for our own future."
 ARB_iraqi_oil_wells:0 "Iraqi Oil Wells"
 ARB_iraqi_oil_wells_desc:0 "Iraq's oil fields represent a cornerstone of our economic power. By securing and expanding their output, we ensure a steady flow of energy and leverage for regional diplomacy."
 ARB_iranian_oil_wells:0 "Iranian Oil Wells"
 ARB_iranian_oil_wells_desc:0 "Though beyond traditional Arab borders, the oil fields of Iran hold great value. With access and control, we gain an additional strategic resource base and a stronger position in global affairs."
 ARB_saudi_oil_wells:0 "Saudi Oil Wells"
 ARB_saudi_oil_wells_desc:0 "The vast reserves beneath Arabia are ours to command. By optimizing extraction in these oil-rich regions, we not only strengthen our economy but solidify our relevance on the world stage."
 ARB_land_reform:0 "Land Reform"
 ARB_land_reform_desc:0 "To unite our people, we must first give them a stake in their land. Redistributing large estates and empowering local farmers will stabilize the countryside, improve food security and undermine feudal power structures."
 ARB_strengthen_oil_extraction_sites:0 "Strengthen Oil Extraction Sites"
 ARB_strengthen_oil_extraction_sites_desc:0 "It is not enough to extract oil we must do so efficiently, securely and with long-term sustainability. Fortifying and modernizing our extraction sites will maximize production and defend them from sabotage or invasion."