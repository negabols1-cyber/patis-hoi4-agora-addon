l_english:
  MAN_draft_the_industrial_plan:0 "Draft the Industrial Plan"
  MAN_draft_the_industrial_plan_desc:0 "Manchuria is rich in resources but poor in infrastructure. We must draft a comprehensive plan to transform our nation from an agrarian backwater into the industrial heart of East Asia."
  MAN_initiate_the_first_year_plan:0 "Initiate the First Five-Year Plan"
  MAN_initiate_the_first_year_plan_desc:0 "The era of chaotic development is over. We shall implement a centralized economic strategy to rapidly expand our heavy industry and resource extraction capabilities."
  MAN_establish_mangyo:0 "Establish Mangyo"
  MAN_establish_mangyo_desc:0 "The Nissan Group's Yoshisuke Aikawa brings a vision of rapid industrialization. By establishing the Manchurian Industrial Development Company (Mangyo), we invite heavy industry expertise."
  MAN_american_machinery_imports:0 "American Machinery Imports"
  MAN_american_machinery_imports_desc:0 "While our relations with the West are strained, American industrial precision remains unmatched. Mangyo will utilize its connections to import advanced tooling before the embargoes tighten."
  MAN_invitation_of_nissan_capital:0 "Invitation of Nissan Capital"
  MAN_invitation_of_nissan_capital_desc:0 "State budgets are too slow. We need aggressive capital injection from the Japanese Zaibatsu to jumpstart our military production immediately."
  MAN_the_mukden_arsenal_modernization:0 "The Mukden Arsenal Modernization"
  MAN_the_mukden_arsenal_modernization_desc:0 "The old arsenal is a relic of the warlord era. We must overhaul its assembly lines with modern conveyor belts and standardized tooling to mass-produce reliable weaponry."
  MAN_dowa_automobile_company:0 "Dowa Automobile Company"
  MAN_dowa_automobile_company_desc:0 "To conquer the vast plains of Asia, we need trucks, not ox-carts. Dowa Automobile will be the engine of our army's mobilization."
  MAN_incentivize_the_zaibatsu:0 "Incentivize the Zaibatsu"
  MAN_incentivize_the_zaibatsu_desc:0 "Patriotism alone will not build factories; profit will. By offering tax breaks and land grants, we ensure the titans of Japanese industry view Manchuria as their most profitable venture."
  MAN_establish_kenkoku_university:0 "Establish Kenkoku University"
  MAN_establish_kenkoku_university_desc:0 "A modern state requires modern minds. Kenkoku University will be the crucible where the future engineers and bureaucrats of Manchuria are forged."
  MAN_agricultural_processing_institutes:0 "Agricultural Processing Institutes"
  MAN_agricultural_processing_institutes_desc:0 "Soya is the gold of Manchuria. We are establishing institutes to refine our vast agricultural output into industrial oils, synthetic rubber, and chemical precursors needed for the war effort."
  MAN_harness_the_yalu_river:0 "Harness the Yalu River"
  MAN_harness_the_yalu_river_desc:0 "The wild waters of the Yalu River hold the energy potential to power our entire industrial sector. Taming this river with hydroelectric projects is the first step toward energy independence."
  MAN_the_manchurian_textile_initiative:0 "The Manchurian Textile Initiative"
  MAN_the_manchurian_textile_initiative_desc:0 "While steel wins wars, cloth clothes the people. Expanding our textile industry will satisfy consumer demand and bring in valuable trade revenue."
  MAN_state_opium_monopoly:0 "State Opium Monopoly"
  MAN_state_opium_monopoly_desc:0 "A pragmatic solution to our funding issues. By formalizing the opium trade under state control, we can generate significant revenue to fund our infrastructure projects."
  MAN_eradicate_the_poppy_fields:0 "Eradicate the Poppy Fields"
  MAN_eradicate_the_poppy_fields_desc:0 "The cultivation of opium has poisoned our people and enriched corrupt warlords for far too long. If we are to build a strong, modern, and truly independent nation, we must sever our reliance on this toxic revenue. The Imperial Army will be deployed to torch the poppy fields of Jehol, signaling an absolute end to the era of the narcotic state."
  MAN_seize_the_narcotic_assets:0 "Seize the Narcotic Assets"
  MAN_seize_the_narcotic_assets_desc:0 "With the poppy fields burning, we must now dismantle the financial networks of the cartels and corrupt officials who profited from this illicit trade. Through a series of sweeping state raids, we will seize their hidden vaults and illegal properties, redirecting this vast 'black wealth' directly into the legitimate industrialization efforts of the Five-Year Plan."
  MAN_fund_the_kwantung_black_budget:0 "Fund the Kwantung Black Budget"
  MAN_fund_the_kwantung_black_budget_desc:0 "The immense profits generated by our state-run narcotics monopoly need not be entirely recorded in the official civilian ledgers. By secretly diverting a portion of these funds directly to the Kwantung Army's covert operations, we can bypass Tokyo's strict budget oversight. This 'black budget' will allow us to rapidly expand our clandestine military-industrial complex."
  MAN_supremacy_of_the_privy_council:0 "Supremacy of the Privy Council"
  MAN_supremacy_of_the_privy_council_desc:0 "The General Affairs Council has long acted as an instrument of Japanese bureaucratic control, relegating the Emperor to a mere figurehead. By elevating the Privy Council—composed strictly of loyal Manchurian and Chinese statesmen—to the highest executive authority, His Majesty will reclaim the reins of the state. It is time we dictate our own economic and political future."
  MAN_empower_mantetsu:0 "Empower Mantetsu"
  MAN_empower_mantetsu_desc:0 "The Railway Company has the logistical expertise we lack. Granting them further administrative powers over the rail zones will speed up construction significantly."
  MAN_the_dairen_port_expansion:0 "The Dairen Port Expansion"
  MAN_the_dairen_port_expansion_desc:0 "Dairen is our gateway to the world and the Empire. We must dredge the harbor and expand the docks to accommodate the heavy tonnage of raw materials leaving and machinery arriving."
  MAN_resource_consolidation:0 "Resource Consolidation"
  MAN_resource_consolidation_desc:0 "Small, independent mines are inefficient and hard to tax. We shall consolidate all mineral extraction operations into large, state-supervised combines to maximize yield."
  MAN_total_command_economy:0 "Total Command Economy"
  MAN_total_command_economy_desc:0 "The free market is too chaotic for the needs of total war. The State Council must dictate quotas, prices, and distribution. Every nut and bolt produced must serve the national interest."
  MAN_supremacy_of_the_general_affairs_council:0 "Supremacy of the General Affairs Council"
  MAN_supremacy_of_the_general_affairs_council_desc:0 "Naoki Hoshino and his bureaucrats run this country efficiently. We must grant the General Affairs Council total control over economic planning."
  MAN_second_five_year_plan:0 "The Second Five-Year Plan"
  MAN_second_five_year_plan_desc:0 "The first plan laid the foundation; the second will build the fortress. We shift our focus to total self-sufficiency and advanced military production."
  MAN_mantetsu_research_department:0 "Mantetsu Research Department"
  MAN_mantetsu_research_department_desc:0 "The brain trust of the South Manchuria Railway is unrivaled in Asia. Their data on geology, economics, and technology is our greatest asset."
  MAN_the_continental_arsenal:0 "The Continental Arsenal"
  MAN_the_continental_arsenal_desc:0 "The home islands are vulnerable to bombing, but Manchuria is a fortress. We shall become the untouchable arsenal of the entire Co-Prosperity Sphere."

  MAN_expand_the_department_of_public_security:0 "Expand the Department of Public Security"
  MAN_expand_the_department_of_public_security_desc:0 "The Imperial Army cannot be everywhere at once. By expanding the Public Security forces, we create a specialized paramilitary body to crush banditry and maintain order in the cities, freeing up our regular troops for the front lines."
  MAN_invite_kwantung_instructors:0 "Invite Kwantung Instructors"
  MAN_invite_kwantung_instructors_desc:0 "The Kwantung Army is the finest fighting force in Asia. Their officers will drill discipline and the spirit of Bushido into our raw recruits."
  MAN_standardized_artillery_batteries:0 "Standardized Artillery Batteries"
  MAN_standardized_artillery_batteries_desc:0 "Firepower is king. By adopting Type 38 field guns as our standard, we ensure our infantry always has the thunderous support they need."
  MAN_fortress_manchuria:0 "Fortress Manchuria"
  MAN_fortress_manchuria_desc:0 "Let the Soviets come. We shall turn our borders into a meat grinder of concrete and steel. Not a single inch of Manchurian soil will be yielded."
  MAN_spiritual_mobilization:0 "Spiritual Mobilization"
  MAN_spiritual_mobilization_desc:0 "Material superiority is a crutch for the weak. We shall implement 'Seishin Dōin', teaching our soldiers that sheer willpower can overcome any physical limit. A soldier armed with the unshakeable Yamato spirit is invincible, even against steel."
  MAN_standardize_infantry_equipment:0 "Standardize Infantry Equipment"
  MAN_standardize_infantry_equipment_desc:0 "A mix of Chinese imports and old rifles serves no one. We are standardizing our calibers and distribution lines to ensure every soldier has a working weapon."
  MAN_tsr_standardize_infantry_equipment:0 "$MAN_standardize_infantry_equipment$"
  MAN_tsr_standardize_infantry_equipment_desc:0 "$MAN_standardize_infantry_equipment_desc$"
  MAN_the_asano_detachment:0 "The Asano Detachment"
  MAN_the_asano_detachment_desc:0 "Composed of fiercely anti-communist Russian exiles, the Asano Detachment is our elite special force, ready to undertake the most dangerous missions."
  MAN_heritage_of_the_banners:0 "Heritage of the Banners"
  MAN_heritage_of_the_banners_desc:0 "Our ancestors conquered China on horseback. We must embrace this heritage, prioritizing speed, maneuverability, and shock tactics over static defense."
  MAN_the_iron_cavalry:0 "The Iron Cavalry"
  MAN_the_iron_cavalry_desc:0 "The horse must give way to the tank. We are mechanizing our cavalry divisions, creating a modern armored force capable of sweeping across the plains."
  MAN_motorized_logistics_corps:0 "Motorized Logistics Corps"
  MAN_motorized_logistics_corps_desc:0 "An army marches on its stomach, but moves on its wheels. Establishing a dedicated motorized logistics corps ensures our supplies keep pace with our advance."
  MAN_rapid_deployment_theory:0 "Rapid Deployment Theory"
  MAN_rapid_deployment_theory_desc:0 "Strike hard, strike fast. Our doctrine relies on overwhelming the enemy's decision-making loop with superior speed and aggression."
  MAN_enact_the_national_army_law:0 "Enact the National Army Law"
  MAN_enact_the_national_army_law_desc:0 "Conscription is now the law of the land. We are forging a true National Army, united under one flag and one purpose, replacing mercenaries with citizens."
  MAN_professionalize_the_high_command:0 "Professionalize the High Command"
  MAN_professionalize_the_high_command_desc:0 "An army is only as good as its leaders. We are purging the incompetent warlords and promoting a new generation of staff officers trained in modern warfare."
  MAN_one_virtue_one_heart:0 "One Virtue, One Heart"
  MAN_one_virtue_one_heart_desc:0 "Isshin Ittoku. Soldiers of five races, beating with one heart. This spiritual unity is our strongest armor against the demoralizing effects of war."
  MAN_ratify_the_kantokuen_plan:0 "Ratify the Kantokuen Plan"
  MAN_ratify_the_kantokuen_plan_desc:0 "The Special Maneuvers of the Kwantung Army are no longer a drill. We are finalizing the plans for the inevitable northern offensive against the Soviet Union."

  MAN_river_defence_fleet:0 "River Defence Fleet"
  MAN_river_defence_fleet_desc:0 "Our primary naval frontier is not the ocean, but the Amur. We must organize a flotilla of gunboats to secure the river border against Soviet incursions."
  MAN_river_crossing_drills:0 "River Crossing Drills"
  MAN_river_crossing_drills_desc:0 "Static fortifications can be bypassed, but superior training cannot. We are instituting mandatory river-crossing exercises for the Northern Army. Our troops must learn to use the Amur not as a barrier that traps us, but as a highway to strike at the enemy's flanks."
  MAN_riverine_marines:0 "Form Riverine Marines"
  MAN_riverine_marines_desc:0 "Fighting in the marshes and river islands requires specialized infantry. We are training elite detachments capable of amphibious assaults across the wide, freezing waters of the north."
  MAN_huludao_naval_base:0 "Expand Huludao Naval Base"
  MAN_huludao_naval_base_desc:0 "To host oceangoing vessels, we must dredge the harbor of Huludao and expand its facilities, creating a proper home port for our coastal defense squadron."
  MAN_standardized_escort_hulls:0 "Standardized Escort Hulls"
  MAN_standardized_escort_hulls_desc:0 "The Empire does not require complex fleet destroyers designed for duel at high seas. We need simple, rugged vessels capable of mass production. Our design bureaus will focus on standardized hulls optimized for anti-submarine warfare and convoy escort."
  MAN_coastal_defense_cruisers:0 "Coastal Defense Cruisers"
  MAN_coastal_defense_cruisers_desc:0 "To challenge larger Soviet vessels threatening our ports, we require heavy firepower on a stable platform. We shall design a class of 'Coastal Defense Ships'—heavily armed light cruisers that will serve as the floating fortresses of the Imperial Navy."
  MAN_independent_naval_command:0 "Independent Naval Command"
  MAN_independent_naval_command_desc:0 "For too long, the Navy has been a mere department of the Army. To operate effectively, we must establish a separate Admiralty, answering directly to the Emperor."
  MAN_guardian_of_the_yellow_sea:0 "Guardian of the Yellow Sea"
  MAN_guardian_of_the_yellow_sea_desc:0 "Our flag now flies proudly over the waves. The Manchukuo Imperial Navy stands ready to secure the sea lanes, ensuring the lifeblood of the Empire flows uninterrupted."

  MAN_army_aviation_department:0 "Army Aviation Department"
  MAN_army_aviation_department_desc:0 "Air power is the future of warfare. We are establishing a dedicated Aviation Department within the Ministry of War to oversee pilot training and aircraft procurement."
  MAN_license_nakajima_designs:0 "License Nakajima Designs"
  MAN_license_nakajima_designs_desc:0 "Japan's aviation industry is world-class. Instead of costly experiments, we will license proven airframes like the Ki-27 and Ki-43, standardizing our equipment with our allies."
  MAN_indigenous_assembly_lines:0 "Indigenous Assembly Lines"
  MAN_indigenous_assembly_lines_desc:0 "Assembly is the first step towards independence. By setting up local factories to assemble licensed aircraft, we reduce our reliance on imports and build a skilled workforce."
  MAN_patriotic_donation_campaign:0 "Patriotic Donation Campaign"
  MAN_patriotic_donation_campaign_desc:0 "The state treasury is limited, but the patriotism of our people is boundless. We will launch a campaign encouraging citizens and corporations to donate funds for the purchase of new aircraft."
  MAN_anti_bandit_air_tactics:0 "Anti-Bandit Air Tactics"
  MAN_anti_bandit_air_tactics_desc:0 "Our pilots' primary mission is not dogfighting, but ground support. We are developing specialized doctrines for spotting and strafing partisan hideouts in the dense forests."
  MAN_form_the_teishin_unit:0 "Form the Teishin Unit"
  MAN_form_the_teishin_unit_desc:0 "Vertical envelopment is a bold new tactic. We are selecting the bravest soldiers for the 'Teishin' Raiding Unit, training them to drop behind enemy lines and sow chaos."
  MAN_imperial_aviation_command:0 "The Imperial Aviation Command"
  MAN_imperial_aviation_command_desc:0 "Our air elements have grown significantly since the early days of the Mukden Flight School. It is time to consolidate our various squadrons, training units, and licensed assembly lines under a unified, modern command structure. While we may not rival the great powers, our aircraft stand ready to secure our borders and support the Imperial Army from above."

  MAN_expand_the_kyowa_kai:0 "Expand the Kyowa-kai"
  MAN_expand_the_kyowa_kai_desc:0 "The Concordia Association is the soul of the nation. We must expand its reach into every village, preaching the harmony of the Five Races."
  MAN_manei:0 "Manchukuo Film Association"
  MAN_manei_desc:0 "Cinema is the most powerful tool of the modern age. Manei will produce films that glorify our state, entertain the masses, and counter enemy propaganda."
  MAN_empower_the_kempeitai:0 "Empower the Kempeitai"
  MAN_empower_the_kempeitai_desc:0 "Sometimes, order requires a heavy hand. Giving the Kempeitai broader jurisdiction will crush the communist bandits, though it may terrify the populace."
  MAN_manchurian_chemical_industries:0 "Manchurian Chemical Industries"
  MAN_manchurian_chemical_industries_desc:0 "Modern war runs on explosives and chemicals. Establishing a robust chemical industry is vital for our artillery shells and agriculture alike."
  MAN_kirin_synthetic_rubber_plants:0 "Kirin Synthetic Rubber Plants"
  MAN_kirin_synthetic_rubber_plants_desc:0 "Natural rubber supplies from the south are vulnerable to blockade. Utilizing the advanced chemical infrastructure in Kirin, we will synthesize the rubber needed to keep the Imperial Army's trucks and aircraft mobile, ensuring total self-sufficiency."
  MAN_industrialize_the_outer_manchuria:0 "Industrialize Outer Manchuria"
  MAN_industrialize_the_outer_manchuria_desc:0 "The recovered territories of Primorye and Amur have been neglected under Bolshevik rule. We shall reintegrate these lands into the industrial heart of the Empire, transforming the port of Vladivostok and the Amur riverbanks into bustling centers of production."
  MAN_fushun_shale_oil_plants:0 "Fushun Shale Oil Liquefaction"
  MAN_fushun_shale_oil_plants_desc:0 "The Fushun open-pit mine is rich in coal and oil shale. Instead of merely burning this coal, we will construct massive distillation plants on-site. By processing the shale through these refineries, we can synthesize the liquid fuel needed for the Imperial Army, independent of foreign oil imports."
  MAN_expand_the_yangjiazhangzi_mines:0 "Expand the Yangjiazhangzi Mines"
  MAN_expand_the_yangjiazhangzi_mines_desc:0 "The Yangjiazhangzi deposits in Jehol are among the richest molybdenum and tungsten sources in Asia. We must expand these operations to extract the strategic alloys necessary to harden the armor of Imperial tanks and produce the armor-piercing shells needed to pierce enemy steel."
  MAN_send_cadets_to_japan:0 "Send Cadets to Japan"
  MAN_send_cadets_to_japan_desc:0 "To forge a modern army, we must drink from the source. The most promising young officers of the Manchukuo Imperial Army will be sent to the Imperial Japanese Army Academy in Tokyo, returning with iron discipline and the latest tactical knowledge."
  MAN_for_the_emperor:0 "For the Emperor"
  MAN_for_the_emperor_desc:0 "Long live the Kangde Emperor! The spirit of the soldier is the spirit of the nation. We pledge our lives not just to the state, but to the divine will of the Emperor. Duty is heavier than a mountain; death is lighter than a feather."
  MAN_assert_claims_on_outer_manchuria:0 "Assert Claims on Outer Manchuria"
  MAN_assert_claims_on_outer_manchuria_desc:0 "For too long, the Russian bear has squatted on lands stolen from the Qing Dynasty. The treaties of the past were signed under duress. We now declare to the world that the Amur region and the Pacific coast are integral, inalienable parts of the Manchu homeland."
  MAN_expand_the_imperial_guard_corps:0 "Expand the Imperial Guard Corps"
  MAN_expand_the_imperial_guard_corps_desc:0 "The Jinwei Brigade has loyally protected the palace, but the Emperor's enemies are legion. We must expand this ceremonial unit into a fully equipped combat corps, capable of crushing dissent not just in Hsinking, but across all of China."
  MAN_proclaim_the_son_of_heaven:0 "Proclaim the Son of Heaven"
  MAN_proclaim_the_son_of_heaven_desc:0 "The chaos of the Republic proved they had lost the Mandate. Japan's victory proves that order has returned. With the blessing of Tokyo, we proclaim to the world that the Mandate of Heaven has been restored not by ritual, but by the steel of the Co-Prosperity Sphere. Long live the Emperor!"
  MAN_return_to_the_forbidden_city:0 "Return to the Forbidden City"
  MAN_return_to_the_forbidden_city_desc:0 "Hsinking has served us well as a temporary shelter, but a true Emperor rules from the Dragon Throne. We shall move the court back to Beijing, restoring the Forbidden City to its former glory."

