  #Decisions
  MAN_five_year_plan_category:0 "The Five-Year Plans"
  MAN_five_year_plan_category_desc:0 "To transform Manchukuo from an agrarian backwater into the invincible logistical base of the Greater East Asia Co-Prosperity Sphere, we must undergo a radical industrial revolution. Guided by the technocrats of the Kwantung Army, the state will direct all economic activity. Fulfilling the quotas of these monumental plans will require immense resources, but failure to industrialize means vulnerability to the Soviet threat in the north.\n\nCompleting industrial and military quotas will §Greduce the time§! required to finish the overarching plan.\n\n£CHL_working_class_text Active missions: §Y[?MAN_five_year_plan_active_missions]§! \n£trigger_yes Successful missions: §Y[?MAN_five_year_plan_successful_missions]§! \n£trigger_no Failed missions: §R[?MAN_five_year_plan_failed_missions]§!"

  MAN_five_year_plan_mission:0 "The First Five-Year Plan"
  MAN_five_year_plan_mission_desc:0 "The Industrial Development Act of 1937 marks the beginning of our First Five-Year Plan. We are tasked with building the foundation of a 'National Defense State' by prioritizing heavy industry, resource extraction, and railway expansion over consumer goods. We have a set timeframe to achieve these massive quotas."

  MAN_the_fushun_energy_quota:0 "The Fushun Energy Quota"
  MAN_the_fushun_energy_quota_desc:0 "Heavy industry requires massive amounts of power and fuel. We must expand the extraction of coal and oil shale in Fushun, constructing synthetic refineries to guarantee energy autarky."

  MAN_the_mantetsu_artery:0 "The Mantetsu Artery"
  MAN_the_mantetsu_artery_desc:0 "Resources are useless if they cannot reach the factories or the ports. The South Manchuria Railway Company (Mantetsu) must upgrade the main rail lines connecting Hsinking to the Dalian and Huludao ports."

  MAN_modernize_the_ports:0 "Modernize the Ports"
  MAN_modernize_the_ports_desc:0 "The raw materials we extract and the industrial goods we produce are useless if they bottleneck at the coast. We must dredge and expand the naval facilities at Huludao to ensure a steady, uninterrupted flow of maritime trade with the Japanese Home Islands."

  MAN_stockpile_infantry_weapons:0 "Stockpile Infantry Weapons"
  MAN_stockpile_infantry_weapons_desc:0 "A modern industry means nothing if our soldiers fight with bare hands. The Mukden Arsenal must operate at maximum capacity to build up a strategic reserve of modern infantry equipment."

  MAN_motorize_the_supply_lines:0 "Motorize the Supply Lines"
  MAN_motorize_the_supply_lines_desc:0 "The vast, muddy plains of Manchuria are a logistical nightmare. We must produce enough trucks through the Dowa Automobile Company to fully motorize the supply lines of the Kwantung Army."

  MAN_exploit_the_northen_coalfields:0 "Exploit the Northern Coalfields"
  MAN_exploit_the_northen_coalfields_desc:0 "To feed the furnaces of our expanding heavy industries, we must look beyond the Fushun mines. The untapped coal veins in the northern provinces require immediate infrastructure expansion so that our trains can transport the black gold southward to the factories."

  MAN_pacify_the_rural_farmers:0 "Pacify the Rural Farmers"
  MAN_pacify_the_rural_farmers_desc:0 "Our aggressive industrialization and land requisition policies have caused widespread anxiety in the countryside. We must utilize the Concordia Association to spread pro-government propaganda, distribute basic subsidies, and ensure the rural populace remains loyal and stable."

  MAN_the_light_metals_initiative:0 "The Light Metals Initiative"
  MAN_the_light_metals_initiative_desc:0 "With the expansion of the Mansyu Aircraft Company, our demand for aluminum has skyrocketed. We must invest heavily in synthetic aluminum extraction from local clays to keep our assembly lines moving."

  MAN_the_supung_dam_project:0 "The Sup'ung Dam Project"
  MAN_the_supung_dam_project_desc:0 "The demands of our factories have exceeded our coal power capabilities. We must harness the Yalu River on the Korean border by constructing a monumental hydroelectric dam to power our industrial heartland."

  MAN_integrate_outer_manchuria:0 "Integrate Outer Manchuria"

  #Events
  wtt_manchukou.12.t:0 "The Aluminum Bottleneck"
  wtt_manchukou.12.desc:0 "The Mansyu Aircraft Company has reported a critical shortage of light metal alloys. Without a steady supply of aluminum, our aviation production quotas will fail. Lacking natural bauxite deposits, our chemists propose extracting aluminum from local alunite clay. Establishing these synthetic plants is technologically challenging but vital for our military autarky."
  wtt_manchukou.12.a:0 "Our chemists must find a way. Fund it."

  wtt_manchukou.13.t:0 "Unrest in the Countryside"
  wtt_manchukou.13.desc:0 "The relentless pace of the Five-Year Plan is taking a heavy toll on the rural populace. Aggressive grain requisitions and land seizures have sparked widespread discontent. Communist partisans are exploiting this anger to swell their ranks. We must dispatch the Concordia Association (Kyowa-kai) to distribute subsidies and spread propaganda before this unrest escalates into rebellion."
  wtt_manchukou.13.a:0 "The Kyowa-kai will restore order."

  wtt_manchukou.14.t:0 "Surveying the Northern Veins"
  wtt_manchukou.14.desc:0 "Our expanding heavy industries are consuming fuel at an alarming rate. The massive open-pit mines at Fushun can no longer single-handedly sustain the Five-Year Plan. Surveys have confirmed rich, untapped coal veins in the northern provinces. We must expand the rail network into the frozen wilderness to exploit these resources. The black gold must flow south."
  wtt_manchukou.14.a:0 "The black gold must flow. Expand the mines."

  wtt_manchukou.15.t:0 "Harnessing the Yalu River"
  wtt_manchukou.15.desc:0 "The rapid expansion of our heavy industries has created a severe power deficit. To feed the insatiable appetite of our new steel mills, engineers have proposed constructing a massive hydroelectric dam across the Yalu River. The 'Sup'ung Dam' will provide near-limitless electricity to our industrial heartland, but it requires a massive diversion of civilian resources."
  wtt_manchukou.15.a:0 "A monument to our progress. Authorize it."

  wtt_manchukou.16.t:0 "The Motorization Imperative"
  wtt_manchukou.16.desc:0 "As our military expands and maneuvers become more complex, the limitations of our current supply network have become a critical liability. Traditional horse-drawn wagons are getting bogged down in the Manchurian mud, and our railways cannot reach every remote garrison. The Kwantung Army High Command has issued a strict new directive: we must drastically increase the production of motorized vehicles at the Dowa Automobile Company. A modern army cannot fight if its ammunition is stuck in the mud."
  wtt_manchukou.16.a:0 "Start the assembly lines. We need trucks."

