 marines4:0 "Marines IV"
 marines4_desc:0 "The introduction of specialized amphibious tractors (LVTs) and improved fire support coordination allows our marines to storm fortified beaches with unprecedented momentum."
 marines5:0 "Marines V"
 marines5_desc:0 "Advanced ship-to-shore logistical pipelines and flexible landing doctrines ensure that our naval infantry can sustain prolonged offensive operations far from friendly ports."
 marines6:0 "Marines VI"
 marines6_desc:0 "As the spearhead of global power projection, modern marine corps integrate combined arms tactics to dominate littoral zones and secure bridgeheads in any corner of the globe."

 paratroopers4:0 "Paratroopers IV"
 paratroopers4_desc:0 "Advancements in heavy-lift transport aircraft enable the dropping of light armored vehicles and anti-tank guns, giving airborne divisions the punch they need to hold captured objectives."
 paratroopers5:0 "Paratroopers V"
 paratroopers5_desc:0 "High-altitude jumps and improved parachute designs minimize dispersal during drops, allowing for concentrated force application even in contested airspaces."
 paratroopers6:0 "Paratroopers VI"
 paratroopers6_desc:0 "The dawn of the helicopter age redefines airborne warfare. Our paratroopers transition into air cavalry, capable of rapid redeployment and vertical assaults across the entire front."

 tech_mountaineers4:0 "Mountain Infantry IV"
 tech_mountaineers4_desc:0 "New lightweight alloys for climbing gear and portable heating solutions ensure that our troops can operate at peak efficiency even in the most oxygen-deprived altitudes."
 tech_mountaineers5:0 "Mountain Infantry V"
 tech_mountaineers5_desc:0 "Advanced cold-weather conditioning and specialized motorized transport for rugged terrain allow mountain divisions to outmaneuver any standard infantry in high-altitude theaters."
 tech_mountaineers6:0 "Mountain Infantry VI"
 tech_mountaineers6_desc:0 "Modern alpine warfare focuses on rapid vertical envelopment. With superior training, our mountain troops can turn impassable peaks into strategic fortresses."

 rangers_tech4:0 "Rangers IV"
 rangers_tech4_desc:0 "Integration of early night-vision optics and advanced camouflage patterns allows our woodland specialists to maintain high lethality even under the cover of total darkness."
 rangers_tech5:0 "Rangers V"
 rangers_tech5_desc:0 "By mastering small-unit infiltration tactics and utilizing lightweight survival gear, our rangers can remain self-sufficient behind enemy lines for extended durations."
 rangers_tech6:0 "Rangers VI"
 rangers_tech6_desc:0 "The ultimate evolution of woodland warfare combines 1950s infantry doctrine with deep-reconnaissance capabilities, making our rangers the silent masters of the modern battlefield."

