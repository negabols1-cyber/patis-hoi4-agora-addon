 ######################
 ### OĞUZ KURULTAYI ###
 ######################
 TUR_Oguz_Tribes_System:0 "Oguz Ulusal Kurultayı"
 TUR_Oguz_Tribes_System_desc:0 "The Oghuz Turks is a western Turkic people who spoke the Oghuz branch of the Turkic language family. In the 8th century, they formed a tribal confederation conventionally named the Oghuz Yabgu State in Central Asia. We see this repeated today."
 TUR_oghuz_turks:0 "§YOghuz Turks§!"
 TUR_ucoks:0 "ÜÇOKLAR"
 TUR_bozoks:0 "BOZOKLAR"
 TUR_gunhan:0 "Kün Han"
 TUR_yildizhan:0 "Uldiz Han"
 TUR_ayhan:0 "Ay Han"
 TUR_gokhan:0 "Kük Han"
 TUR_daghan:0 "Tav Han"
 TUR_denizhan:0 "Tengiz Han"
 TUR_bozoklar_desc:0 "§YBozoklar§! are a celestial tribes descended from the three sons of §YOghuz Khan§! from his second wife who descended from the sky."
 TUR_ucoklar_desc:0 "§YÜçoklar§! are a terrestrial tribe descended from the three sons of §YOghuz Khan§! from his first wife who rised from underground."
 ### BOZOKLAR ###
 TUR_gunhan_desc:0 "§YKün Han§! is the son of §YOghuz Khan§! from his second heavenly wife. He is the second and last khan of the ancient §YOghuz Yabgu State§!. The most well-known of the tribes derived from §YKün Han§! is the §YKayı tribe§! who founded the §YOttoman Empire§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"
 TUR_ayhan_desc:0 "§YAy Han§! is the son of §YOghuz Khan§! from his second heavenly wife. The name §YAy Han§! comes from the silver moon shining in the sky. After §YKün Khan§!, §YAy Khan§!'s sons started to rule the §YOghuz Turks§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"
 TUR_yildizhan_desc:0 "§YUldiz Han§! is the son of §YOghuz Khan§! from his second heavenly wife. He represents the beginning of creation. The most well-known of the tribes derived from §YUldiz Han§! is the §YAfşar tribe§! who founded the §YBeylik of Karaman§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"
 ### UCOKLAR ###
 TUR_gokhan_desc:0 "§YKük Han§! is the son of §YOghuz Khan§! from his first terrestrial wife. It symbolizes the boundlessness and richness of the §YTurkic§! homeland. The most well-known of the tribes derived from §YKük Han§! is the §YPechenegs§! who conquered the §YRomania§! and §YSouthern Ukraine§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"
 TUR_daghan_desc:0 "§YTav Han§! is the son of §YOghuz Khan§! from his first terrestrial wife. Some mountains are considered sacred by the §YTurks§!. They are also ruled by §YTav Han§!. Tav means mountain in §YProto-Turkic§!. The most well-known of the tribes derived from §YTav Han§! is the §YSalur tribe§! who founded the §YState of Kadi Burhan al-Din§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"
 TUR_denizhan_desc:0 "§YTengiz Han§! is the son of §YOghuz Khan§! from his first terrestrial wife. He symbolizes the sovereignty of the §YTurkish State§! at sea. The most well-known of the tribes derived from §YTengiz Han§! is the §YQiniq tribe§! who founded the §YSeljuk Empire§!.\n\n§RPRESS THIS BUTTON TO USE DECISIONS!§!"

 ### GUNHAN ###
 TUR_bozoks_bayat_desc:0 "The §YBayat Tribe§! is descended from §YKün Khan§!, one of the children of §YOghuz Khan§!'s second heavenly wife. It means wealth and prestige. The most known state of this tribe is the §YDulkadiroğulları Beyliği§!. The most notable figures of this tribe are §YFuzuli§!, §YDede Korkut§! and §YUzeyir Hajibeyov§!.\n\n§YFor 60 days§!:\n£consumer_goods_texticon  Consumer Goods Factories factor: §Y-10.0%§!"
 TUR_bozoks_kayi_desc:0 "The §YKayı Tribe§! is descended from §YKün Khan§!, one of the children of §YOghuz Khan§!'s second heavenly wife. It Means healthy and strong. The most known state of this tribe is the §YOttoman Empire§!. The most important figures of this tribe are §YErtuğrul Ghazi§!, §YOsman Ghazi§! and §YMehmed the Conquerer§!\n\n§YFor 30 days§!:\n£defence_texticon  Division Defense §G+10.0%§!"
 TUR_bozoks_karaevli_desc:0 "The §YKaraevli Tribe§! is descended from §YKün Khan§!, one of the children of §YOguz Khan§!'s second heavenly wife. It means black room or house. Although this tribe did not have an important state, the teachers who trained the heirs in the §YOttoman Empire§! were chosen from this tribe.\n\n§YFor 60 days§!:\n£breakthrough_texticon  Breakthrough against minor countries: §G+5.0%§!"
 TUR_bozoks_akevli_desc:0 "The §YAlkaevli Tribe§! is descended from §YKün Khan§!, one of the children of §YOguz Khan§!'s second heavenly wife. It means success. They migrated from §YAleppo§! with §YErtuğrul Ghazi§!.\n\n§YFor 60 days§!:\n£attacker_speed2_texticon  Attacking divisions speed: §G+10.0%§!"
 ### AYHAN ###
 TUR_bozoks_yazir_desc:0 "The §YYazır Tribe§! is descended from §YAy Khan§!, one of the children of §YOghuz Khan§!'s second heavenly wife. It means the one with many lands. The §YGundogullari dynasty§! in the §YTaurus§! descended from this tribe.\n\n§YFor 60 days§!:\n£army_level_texticon  Starting level of new army leaders: §G+1§!"
 TUR_bozoks_doger_desc:0 "The §YDogar Tribe§! is descended from §YAy Khan§!, one of the children of §YOguz Khan§!'s second heavenly wife. It means those who accumulate. They played an important role in the §YSeljuk§! army. They settled in §YSyria§! during the §YOttoman period§!.\n\n§YFor 60 days§!:\n£mobilisation_texticon  Mobilization speed: §G+30.00%§!"
