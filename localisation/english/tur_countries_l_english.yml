 ### ATSIZ GAMING ###
 TUR_nihal_atsiz_movement:0 "Nihal Atsız Movement"
 TUR_nihal_atsiz_movement_desc:0 "Nihal Atsız's writings have become very popular among the public, I wonder if he will be able to use this in politics?"
 TUR_the_grey_wolf_has_reborn:0 "The Grey Wolf Has Reborn"
 TUR_the_grey_wolf_has_reborn_desc:0 "They thought we were dead they thought they would never see us again but they were wrong. Today we rise once again to rule the world."
 TUR_select_road:0 "What is Turanism?"
 TUR_select_road_desc:0 "Turkish Islamic synthesis or the idea of the unification of the Turkic peoples completely free of Arabization? We have to decide this."
 TUR_turanist_assimilation_for_kurdistan:0 "Turanist Assimilation For Mountain Turks"
 TUR_turanist_assimilation_for_kurdistan_desc:0 "Some Turks, who have forgotten who they are because they have been separated from other Turkic tribes, have called themselves Kurds and want to separate from us. We need to remind them who they are."
 TUR_kurdish_asimilation:0 "Kurdish Assimilation"
 TUR_turanist_decision_0:0 "Turanist Propaganda"
 TUR_turanist_decision_1:0 "Turanist Propaganda"
 turanist_kemalist_loyalties:0 "Kemalists Supporting Turan"
 TUR_ataturk_health_crisis:0 "Concerned with the Disease of the Father of Turks"
 TUR_saadabad_pact:0 "The §YSaadabad Pact§! already signed"

 #JAPON GAMING
 TUR_the_japan_turkish_friendship_treaty:0 "The Japanese-Turkish Agreement"
 TUR_the_japan_turkish_friendship_treaty_desc:0 "We are brothers with the Japanese, as Matthias Castrén mentioned in 1884, although it may not seem so. We should stop building relations with the Russians, our natural enemies, and focus on improving our relations with the Japanese, our natural friends."
 TUR_the_japan_investment:0 "Invite the Zaibatsus"
 TUR_the_japan_investment_desc:0 "Just as we have Koç and Sabancı, the Japanese have these companies called Zaibatsus. As far as we understand, these companies work much more efficiently than our companies. If we invite them here, our economy can develop even faster."
 TUR_little_mehmets_never_die:0 "Little Mehmets Never Die"
 TUR_little_mehmets_never_die_desc:0 "O, white and crimson adornment of the blue skies,\nMy sister's bridal veil, my martyr's final shroud,\nMy flag, glowing with light, waving in waves!\nI have read your epic — I shall write your epic.\n\nFor those who do not see you with my eyes,\nI will dig their grave.\nAnd for the bird that flies past you without a salute,\nI will tear down its nest.\n\nWherever you wave, there's no fear, no sorrow...\nLet your shadow offer me a place too, just a little space.\nLet there be no dawn, let no day break — it doesn't matter:\nThe crescent and star's light is enough for this land.\n\nOn the day war took us to snow-covered peaks,\nWe warmed ourselves in your crimson glow.\nAnd the day we fell from mountains to deserts,\nWe took shelter in your shade.\n\nO flag, now graceful, fluttering in the winds;\nDove of peace, eagle of war,\nMy flower blooming on the highest cliffs.\nI was born beneath you.\nAnd beneath you, I shall die.\n\nMy history, my honor, my poetry — my everything:\nChoose a place on this earth to stand!\nWherever you wish to rise,\nJust say the word — I'll plant you there!" #Turkey - Flag - Arif Nihat Asya
 TUR_the_east_turkistan_project:0 "Qurtulush Yolida"
 TUR_the_east_turkistan_project_desc:0 "Like a river our §Rblood§! flowed on the §4road to salvation§!\nFor Thee, oh §4homeland§!, may our lives be our §Rsacrifice§!.\nThee we saved by shedding our §Rblood§! and §4lives§!,\nFor Thy §4liberty§! we had faith in our §Rhearts§!.\n\nTo Thee may our efforts be handed,\nOur §4fathers§! have once ruled this §Yvery world§!,\nThee we cleansed with §Rblood§!, o §4Fatherland§!,\nNe'er shall our name of §RTurk§! be spoiled.\n\n§6Attila§!, §5Genghis§!, §4Tamerlane§! once trembled this §Yvery world§!,\nBy giving §Rblood§! and earning §4honour§!, we are their very children.\nWe granted our §4lives§!, poured our §Rblood§!, avenged the §Renemy§!;\nMay our §6future§! §5shine§! and §4prosper§! for §Reternity§!!" #East Turkestan - Qurtulush Yolida
 TUR_invite_japanese_officers:0 "Invite the Japanese Officers"
 TUR_invite_japanese_officers_desc:0 "We can invite Japanese officers here to help our country develop militarily in the same way that we have benefited from the Zaibatsu."
 TUR_join_the_japans:0 "Join the GEACPS"
 TUR_join_the_japans_desc:0 "The world has reached a moment of destiny, and we sit at the crossroads of many empires vying to change the world forever. We need to work with the Japanese to achieve the independence of all Turks, something the Jadis and Basmachi failed to achieve."
 TUR_preparation_the_red_monster:0 "Preparation for the Red Monster"
 TUR_preparation_the_red_monster_desc:0 "To the north lies the perfidious threat of communism and its chief sponsor in the world. [SOV.GetNameDef] is a pox on this world, and the Balkan Entente will be doing humankind a favor by dismantling the [SOV.GetAdjective] hegemony."
 TUR_invite_japanese_scientists:0 "Invite the Japanese Scientists"
 TUR_invite_japanese_scientists_desc:0 "The academic staff of Istanbul University was completely filled with Jews. Although Ataturk's decision has so far moved the university forward enormously, these scientists receive much higher salaries than Turkish scientists, which makes the Turks uncomfortable. Once we have purged them, we need to replace them with others. And for this, our dear friends the Japanese make the most sense. I hope they don't ask for too much salary."
 TUR_etsablish_the_izmit_naval_base:0 "Establish the İzmit Naval Base"
 TUR_etsablish_the_izmit_naval_base_desc:0 "We have expanded the Gölcük Naval Base sufficiently. Since we also have a naval war to prepare ourselves for because of the Red enemy to our north, we should establish a naval base in İzmit with the help of the Japanese."
 TUR_second_east_turkestan:0 "Second East Turkestan Republic"
 TUR_second_east_turkestan_desc:0 "In 1934, our Uyghur brothers and sisters fought for their lives and attempted a rebellion, but they failed because the Huis who were called Muslims themselves . Fortunately, the Japanese later defeated these Huis along with all the other Sino people. Now it is time to re-establish the Republic of East Turkestan."
 TUR_revenge_of_the_basmachi:0 "Revenge for the Basmachis"
 TUR_revenge_of_the_basmachi_desc:0 "In 1916, due to the forced conscription of our §YTurkic§! brothers and sisters, leaders such as §YIbrahim Beg§! and §YAmankald Imanov§! began to rebel. They became known as §YBasmachi§! because they fought by storming ''§Ybasmak§!'' Russian outposts. At the height of the rebellion, §YEnver Pasha§! went there and fought bravely and was martyred. Now we need to prepare to save the graves of him and his comrades-in-arms."
 TUR_send_volunteers:0 "Cedid Tümenleri"
 TUR_send_volunteers_desc:0 "The Turkic awakening that began in the 1890s was overshadowed by the establishment of the USSR. Jadidists were killed or silenced. Now that we have turned our backs on Europe, which sees Turks as barbaric, cruel and stupid, we must take up arms so that Turkic brothers can embrace each other, so that all Turks can wake up."
 TUR_attack_the_soviets:0 "Rescue the Turkestan"
 TUR_attack_the_soviets_desc:0 "How many roads I've traveled around the world,\nThe gentle wind caressed my face with love,\nBut only when I came to you, dear land,\nMy chest constricted, I could find no place of joy...\n\nOne day, even if there's a separation,\nI'll be sad for you, it's a torment,\nWithout you, my dear land,\nThere's no life, without you there's no me...\n\nOne day, even if there's a separation,\nI'm like an orphan!\nYou're the meaning of my life\nYou're the bright light of my homeland!" #Tatarstan - Tuğan yağım
 TUR_return_to_my_hand:0 "Return in to My Hand"
 TUR_return_to_my_hand_desc:0 "To speak his final word, in battles hardened and strong,\nFor freedom's call, he'll never stray from the righteous way.\nThe soldier guards the homeland, a sacred trust so true,\nThe soldier keeps the hearth's flame, the fire burning through.\n\nTill martyrs' are avenged, never turn back in retreat!\nIf final victory's not won, don't boast with sword so fleet!\nThe soldier guards the homeland, a sacred trust so true,\nThe soldier keeps the hearth's flame, the fire burning through.\n\nWhen charging at the foe, may his arms strike like thunder,\nEyes on the path, ears to the sound—may triumph pull us under!\nThe soldier guards the homeland, a sacred trust so true,\nThe soldier keeps the hearth's flame, the fire burning through." #Azerbaijan - Vətən Əmanət

 ### OGHUZ YABGU GAMING ###
 TUR_establish_the_oguz_empire:0 "Establish the Oghuz Yabgu State"
 TUR_establish_the_oguz_empire_desc:0 "As mentioned in Ziya Gökalp's Principles of Turkism, in order to go to Turan, first the Oghuz peoples must be gathered and then the other Turkic peoples must be united. Therefore, like our ancestor Kun Khan, we must revive the Oghuz Yabgu State, which represents all Oghuz from Turkey to Turkmenistan."
 TUR_replace_sixarrow:0 "Kurultai of the Oghuz Turks"
 TUR_replace_sixarrow_desc:0 "In the time of the Republic, the parliament elected MPs and whatever they said was what happened in the country. Why should we give so much power to someone you don't even know who he is?\n\nIf you want to research the MP you are going to vote for, it is absurd to expect every person to do this. They will only vote for the party whose flag he likes and he will do what the party says. Instead, we need to move to a system like our ancestors, where dignitaries from every tribe participate in the congress."
 TUR_integrate_kurds:0 "Integrate the Kurds"
 TUR_integrate_kurds_desc:0 "The Turkmen families who settled in Southeastern Anatolia after the Battle of Malazgirt interacted with the Kurds, who were a mixture of many tribes from the Zagros Mountains and were referred to as tent dwellers, and after a while these Turkmens forgot their identity and began to refer to themselves as Kurds.\n\nBut in fact they are just Mountain Turks. We need to remind them of this again, even if it is by force."
 TUR_reclaim_anatolia:0 "Return to Anatolia"
 TUR_reclaim_anatolia_desc:0 "Although places like Istanbul, Edirne and Ankara are chosen as capitals because they are closer to Europe, the heart of Turkishness beats in Sivas. Many Ashiks and warriors came from Central Anatolia. Since Sivas is the most important city of this region, it is very important that we move the capital here."
 TUR_Investing_in_traditions:0 "City of Culture and Civilizations: Sivas"
 TUR_Investing_in_traditions_desc:0 "According to our researches, Sivas is a place full of civilization that has been under the control of many civilizations from the Hittites to the Persians. But it was not developed so much during the Ottoman period that it now looks like it is from the Stone Age. It is time to make Sivas what it deserves."
 TUR_expand_to_iran:0 "End the Separation"
 TUR_expand_to_iran_desc:0 "I cannot sleep at night because of the thought of you\nI cannot get this thought out of my head\nWhat can I do, I cannot reach you\nSeparation, Separation, I take refuge in the lord , Separation\nSeparation is worse than any\n\nBecause of your separation, my dark nights are long\nI don't know where to go at nights\nNights have injured my heart\nSeparation, Separation, I take refuge in the lord, Separation\nSeparation is worse than any other pain" #Azerbaijan - Ayrılıq
 TUR_secure_the_caucasus:0 "Our Khazar Brothers"
 TUR_secure_the_caucasus_desc:0 "Those powder-smelling roads\nWhen they would bring you\nAn officer uniform left for solace of you\nDouble starred, epaulettes with crescent\n\nOh, give me, dear lieutenant\nOh, give me, lieutenant\nFrom a precursory war\nGive me a share, lieutenant\n\nThat day will come, don't grieve, don't grieve\nI will turn back to you, to you\nOur country, our home is still in foreigner hands\nOur feud hasn't done yet" #Azerbaijan - Cənab Leytenant
 TUR_expand_to_afg:0 "Reclaim the Southern Turkestan"
 TUR_expand_to_afg_desc:0 "''§8Everything returns to its original; the soul goes to its original.§!''\n\nThis is what Mawlana Jalāl al-Dīn Muhammad Rūmī said, but unfortunately Mawlana's birthplace now in Afghanistan. We need to save Mawlana's birthplace and our Turkmen and Uzbek brothers and sisters in South Turkestan."
 TUR_unify_the_middle_east:0 "Rescue the Turkmeneli"
 TUR_unify_the_middle_east_desc:0 "The minute roads of this homeland\nHis sore, achy hands devoid of grasp\nFrom tip to toe his roses are utter verse\nMy valiant, my lion is recumbent here.\n\nI am wistful today, roses don't bloom,\nDreadful news as to my valiant I acquired:\nHis mattress (is) of forged iron, (his) ottomans from stone\nMy valiant, my lion is recumbent here\n\nHe did no iniquity, nor a manslaughter\nClean as bread, pellucid as water\nCondemned, with nobody any the wiser\nMy valiant, my lion is recumbent here.\n\nCould a threshing field be amidst the graves?\nCould vigor endure thirteen years confinement?\nIf I ask Azrael would he slay me?\nMy valiant, my lion is recumbent here." #Turkey - Yiğidim Aslanım
 TUR_expand_to_iraq:0 "Liberate the Kirkuk Dungeon"
 TUR_expand_to_iraq_desc:0 "They locked me up in a dungeon in Kirkuk\nThey added me the herd of oppressed people\nThey branded me on one side by fire,mom\nI have neither crime nor sin. They burned me\n\nThe mothers that migrated from Turkmen tribes\nThere are left neither famillies nor homes\nShakes the emptyrean, my oppressed cry\nI'm sure, one day the years are going to laugh at us" #Turkmeneli - Kerkük Zindanı
 TUR_reestablish_the_gokturk_empire:0 "From the Path of Bumin and İstemi" 
 TUR_reestablish_the_gokturk_empire_desc:0 "We have realized the dream of Oghuzistan by conquering all the lands ruled by the Seljuk Empire in its time, and even more. Now we need to move on to the second stage: Turkic Empire. We need a Kagan who will represent all Turks, even if he will rule everything under the name of Nihal Atsiz Ayguci. Zeki Velidi Togan would be the best for this."
 TUR_develop_gokturk_industry:0 "Modern Khanate"
 TUR_develop_gokturk_industry_desc:0 "In ancient times, Turks were nomadic, but not completely nomadic. They had winter and summer centers. We will re-establish Ordukent to implement this. If you're reading these, you're a crazy man, bro."
 TUR_research_gokturk_advancements:0 "Preserve the 16 Great Turkic Empires"
 TUR_research_gokturk_advancements_desc:0 "Although Turks have established hundreds of states throughout their history, 16 of them are very important empires. Although Nihal Atsız opposed them, these are the following in order: §YGreat Hunnic Empire§!, §8Western Hunnic Empire§!, §YEurope Hunnic Empire§!, §8Göktürk Empire§!, §YAvar Empire§!, §8Khazar Empire§!, §YUyghur State§!, §8Karakhanids§!, §YGhaznavid Empire§!, §8Seljuk Empire§!, §YKhwarezmshahs§!, §8Golden Horde State§!, §YGreat Timurid Empire§!, §8Baburid Empire§!, §YAq Qoyunlu§! and §8Cumania§!"
 TUR_modernize_the_gokturk_army:0 "Killigil Turkic Arsenal"
 TUR_modernize_the_gokturk_army_desc:0 "Although he was the brother of Enver Pasha, an Islamist, Nuri Killigil was a fabricator who believed in the Turkish Empire and armed Turkish soldiers for it. It would be very useful to have his support. We will not make him a commander, even though he wants it very much. Making weapons and using weapons are two different things."
 TUR_promote_gokturk_unity:0 "The One and Almighty Khanate!"
 TUR_promote_gokturk_unity_desc:0 "We have finished preparations for the second phase. In the ancient Turkish Khaganates, two brothers used to rule the country together. Thus, we were able to rally more people around us. For this reason, we brought Nihal Atsiz, an Oghuz Turk, and Zeki Velidi Togan, a Kipchak, into the administration. In order to represent the Karluks, it would be most logical to declare Mustafa Çokay as the second Kagan."
 TUR_expand_gokturk_trade:0 "Expand Gokturk Trade"
 TUR_expand_gokturk_trade_desc:0 ""
 TUR_empower_gokturk_scholars:0 "Empower Gokturk Scholars"
 TUR_empower_gokturk_scholars_desc:0 ""
 TUR_gokturk_cultural_renaissance:0 "Investing in Traditions"
 TUR_gokturk_cultural_renaissance_desc:0 "On a dreary autumn day so gray,\nI wandered to the woods to stray.\nDecember's frost, so sharp, so keen,\nHowled across the barren scene.\n\nYellow leaves upon the stream,\nDrift away in endless dream.\nDecember's frost, so sharp, so keen,\nHowled across the barren scene." #Altay - I dont remember
 TUR_build_gokturk_infrastructure:0 "Build infrastructure"
 TUR_build_gokturk_infrastructure_desc:0 ""
 TUR_foster_gokturk_diplomacy:0 "The Children of the Steppes are Coming"
 TUR_revive_gokturk_silk_road:0 "Revive Silk Road"
 TUR_revive_gokturk_silk_road_desc:0 ""
 TUR_glorify_gokturk_culture:0 "Kneel before the Almighty Khanate!!"
 TUR_glorify_gokturk_culture_desc:0 ""
 TUR_reclaim_seljuk_empire:0 "Embracing the Seljuk Legacy"
 TUR_reclaim_seljuk_empire_desc:0 "Although Europeans only know Turks through the Ottoman Empire, 200 years before the Ottoman Empire was founded, the Great Seljuk Empire had united all Oghuzes and established peace in the Middle East. It would be best for us to take the Seljuk Empire as an example instead of the Ottoman Empire, which was a copy of the Roman Empire."


