 RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! may not release this country unless first completing the §Y$SOV_autonomous_soviet_republics$§! focus or the §Y$SOV_dissolve_the_treaty_agreement$§! focus or the §Y$SOV_warsaw_pact$§! focus or §YTsar Vsevolod I§! is the leader of the country."
 RULE_PUPPETS_ALLOW_RELEASE_NATIONS_BLOCKED_TOOLTIP:0 "Game Rule: §RSubject countries can never release nations.§!"
 PUPPETS_RULE_OPTION_BLOCKED:0 "Puppet Blocked"
 RULE_ALLOW_DELETE_STATES:0 "Delete South American Countries"
 RULE_ALLOW_DELETE_STATES_ALLOWED_DESC:0 "This option deletes South America and replaces it with a Neutral Zone."
 RULE_OPTION_ALLOWED_BRA:0 "Allowed (Except Brazil)"
 RULE_ALLOW_DELETE_STATES_ALLOWED_BRA_DESC:0 "This option deletes South America except Brazil and replaces it with a Neutral Zone."
 RULE_ALLOW_DELETE_STATES_BLOCKED_DESC:0 "The countries of South America will not be deleted and will remain playable."
 RULE_GROUP_AGORA:0 "Europe in Flames: AGORA Rules"
 RULE_ALLOW_REMOVE_ALL_MULTIPLAYER_TOOLS:0 "Allow Multiplayer Tools"
 RULE_ALLOW_REMOVE_ALL_MULTIPLAYER_TOOLS_DESC:0 "You can turn all multiplayer tools on and off from this game rule. Tools that will be affected: AI Optimization, White Peace, Trade Deal, Send Civilian Factory, State Transfer Tool, Recall Volunteers and Send Letter. In addition, the land costs at the peace conference will be back to normal and the AI will start making demands."
 RULE_ALLOW_AI_OPTIMISATION:0 "Allow AI Optimisation"
 RULE_ALLOW_AI_OPTIMISATION_DESC:0 "A game rule to remove the AI Optimisation national spirit found in some AI countries. (If you have turned off multiplayer tools, AI Optimization will always be disabled no matter what you select here.)"
 RULE_ALLOW_AI_OPTIMISATION_ALLOWED_DESC:0 "AI Optimisation national spirit will not be removed and will be given to AI countries."
 RULE_ALLOW_AI_OPTIMISATION_BLOCKED_DESC:0 "AI Optimisation national spirit will be completely removed."
 RULE_ALLOW_GDP_RANKING:0 "Allow Country GDP Rankings"
 RULE_ALLOW_GDP_RANKING_ALLOWED_DESC:0 "The GDP Menu and national spirit will not be removed and will remain available during gameplay."
 RULE_ALLOW_GDP_RANKING_BLOCKED_DESC:0 "The GDP Menu and national spirit will be removed and cannot be used again."
 RULE_ALLOW_PLAYER_LED_PEACE:0 "Allow Player-Led Peace Conferences"
 RULE_ALLOW_PLAYER_LED_PEACE_ALLOWED_DESC:0 "AI will not make any demands in peace conferences involving the player, and the cost of the states will be 1."
 RULE_ALLOW_PLAYER_LED_PEACE_BLOCKED_DESC:0 "AI will make demands even if a player is involved in the peace conference, and the costs of the states will return to normal."
 RULE_ALLOW_CYPRUS_RULE:0 "@CYP Allow Cyprus"
 RULE_ALLOW_CYPRUS_RULE_BLOCKED_DESC:0 "Cyprus will not be a playable country, and the region will be under British control at the start of the game."
 RULE_ALLOW_CYPRUS_RULE_ALLOWED_DESC:0 "Cyprus becomes a playable country from the start of the game."
 RULE_ALLOW_AZERBAIJAN_RULE:0 "@AZR Allow Azerbaijan"
 RULE_ALLOW_AZERBAIJAN_RULE_BLOCKED_DESC:0 "Azerbaijan will not be a playable country, and the region will be under Soviet control at the start of the game."
 RULE_ALLOW_AZERBAIJAN_RULE_ALLOWED_DESC:0 "Azerbaijan is playable from the start of the game. You can select Azerbaijan to play."
