 #Events
 cyprus.1.t:0 "Shifting Demographics"
 cyprus.1.alt.t:0 "A Turkish Cyprus"
 cyprus.1.d:0 "Though the Turkish Republic of Cyprus has been proclaimed, the reality on the ground remains unchanged: the Greek community still forms the overwhelming majority of the island’s population. Turkish institutions and schools are only beginning to take root, facing resistance both cultural and political. The vision of a truly Turkish Cyprus is still a distant goal."
 cyprus.1.alt.d:0 "Over the past months, Turkish influence has grown more visible across the island. New administrative structures, language policies, and migration from Anatolia have begun to shift the demographics. The Greek community remains significant, but it no longer dictates the cultural and political life of Cyprus as it once did. A slow transformation is underway."
 cyprus.1.final.d:0 "The demographic and cultural landscape of Cyprus has changed dramatically. Turkish identity now dominates public life, and the once-overwhelming Greek majority has been reduced to a minority. What was once an island defined by Hellenic traditions is now firmly established as Turkish, fulfilling the long-sought project of integration and national unity."
 cyprus.1.a:0 "The transformation will take time."
 cyprus.1.b:0 "The island is ours."

 cyprus.2.t:0 "Cyprus Calls for Enosis"
 cyprus.2.d:0 "The Cypriot government has openly declared its intentions to pursue Enosis, the union of Cyprus with Greece. As one of the guarantor powers of the island's independence and balance, this development poses a direct threat to regional stability. We must decide how to react."
 cyprus.2.a:0 "We must issue a warning"
 cyprus.2.b:0 "We will not interfere for now"

 cyprus.3.t:0 "A Warning from the Guarantors"
 cyprus.3.alt.t:0 "A Warning from the Turkey"
 cyprus.3.d:0 "Both the United Kingdom and Turkey, as guarantor powers of Cyprus, have issued a joint warning. They demand that we immediately abandon our pursuit of Enosis, warning that further escalation will lead to dire consequences."
 cyprus.3.alt.d:0 "Turkey, as a guarantor power, has sent us a strong diplomatic note warning that any attempt to pursue Enosis would breach the agreements safeguarding the island’s independence. They demand that we cease these efforts immediately."
 cyprus.3.a:0 "We will not back down"
 cyprus.3.b:0 "Perhaps it is wiser to halt the campaign"

 cyprus.4.t:0 "Cyprus Defies Warnings"
 cyprus.4.d:0 "Cyprus has openly ignored international warnings and pursued its union with Greece. We must now decide how to respond: whether through direct intervention, economic pressure, or by leaving the issue unresolved."
 cyprus.4.a:0 "Military intervention must be considered"
 cyprus.4.b:0 "Impose an embargo on Cyprus"
 cyprus.4.c:0 "We will take no further action"

 cyprus.5.t:0 "A New Governor Appointed"
 cyprus.5.d:0 "We have received word from the Colonial Office in London: Sir William Denis Battershill will assume the governorship, replacing Sir Richmond Palmer. Under Palmer we endured strict administration — censorship, restrictions on political life, and heavy-handed policing that kept order but fostered deep resentment among our people. Battershill arrives with a different reputation: measured, conciliatory, and charged by London to ease tensions as Europe moves toward war. This may open space for modest reforms and a less oppressive administration. We will welcome him, but remain watchful and press for concrete improvements rather than empty promises."
 cyprus.5.a:0 "We will cautiously welcome Governor Battershill"

 cyprus.6.t:0 "Harmony on the Island"
 cyprus.6.d:0 "Since declaring the Republic of Cyprus, our people have shown remarkable resilience and unity. The bitter divisions that once plagued the island are beginning to fade as Greek and Turk alike find common purpose in prosperity and peace. The rapid growth of our economy has strengthened this harmony, proving that coexistence can be more powerful than conflict. With tensions subsiding, the fears of ethnic unrest no longer weigh upon us. Cyprus now stands as a thriving, united state, ready to secure its place on the world stage."
 cyprus.6.a:0 "Together, we flourish"
  