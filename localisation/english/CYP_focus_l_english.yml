l_english:
 CYP_at_the_crossroads:0 "At the Crossroads"
 CYP_at_the_crossroads_desc:0 "Cyprus has always been a pawn of greater powers. Now independent, we must choose our destiny: return to old ties, seek new bonds, or revive ancient orders."
 CYP_approach_ankara:0 "Approach Ankara"
 CYP_approach_ankara_desc:0 "Our Turkish population has long looked to Ankara for protection. By aligning ourselves formally, we place our fate in their hands and become a trusted partner in their Mediterranean strategy."
 CYP_turkish_military_mission:0 "Turkish Military Mission"
 CYP_turkish_military_mission_desc:0 "Officers from the Turkish General Staff arrive, reorganizing our fledgling army. Weapons shipments and training programs bring much-needed strength to our forces."
 CYP_economic_integration_with_turkey:0 "Economic Integration with Turkey"
 CYP_economic_integration_with_turkey_desc:0 "Turkey offers trade privileges, subsidies, and investment projects. In return, we open our ports and markets fully, binding our economy to Ankara."
 CYP_mediterranean_outpost:0 "Mediterranean Outpost"
 CYP_mediterranean_outpost_desc:0 "Cyprus becomes a forward base for Turkish influence. Joint garrisons, naval cooperation, and intelligence-sharing cement our role as Ankara’s loyal sentinel in the Eastern Mediterranean."
 CYP_establish_turkish_republic_of_cyprus:0 "Establish the Turkish Republic of Cyprus"
 CYP_establish_turkish_republic_of_cyprus_desc:0 "By centralizing authority and strengthening our institutions, Cyprus will become a unitary state under Turkish leadership. The island will stand united as the Turkish Republic of Cyprus."
 CYP_propose_federation:0 "Propose a Cypriot Turkish-Greek Federation"
 CYP_propose_federation_desc:0 "A federal system will be proposed, granting both the Turkish and Greek communities of Cyprus autonomy under a shared central government. Unity will be sought through compromise rather than division."

 CYP_strengthen_ties_with_athens:0 "Strengthen Ties with Athens"
 CYP_strengthen_ties_with_athens_desc:0 "Centuries of shared history and culture bind us to Greece. A formal partnership with Athens is the natural step for securing our independence under their protection."
 CYP_cultural_integration_programs:0 "Cultural Integration Programs"
 CYP_cultural_integration_programs_desc:0 "Schools, universities, and public institutions are reformed under Greek models. The Greek language dominates public life, weaving us tighter into Hellenic civilization."
 CYP_call_for_enosis:0 "Call for Enosis"
 CYP_call_for_enosis_desc:0 "The dream of Enosis becomes reality. Flags are lowered, anthems change, and Cyprus vanishes into the Hellenic Republic — one nation, indivisible."
 CYP_the_eastern_shield:0 "The Eastern Shield"
 CYP_the_eastern_shield_desc:0 "Whichever form our ties to Greece take, Cyprus now stands as the eastern shield of the Hellenic world. Bases, fleets, and commerce flow through the island, vital to both our survival and Greece’s regional ambitions."
 CYP_proclaim_the_republic_of_cyprus:0 "Proclaim the Republic of Cyprus"
 CYP_proclaim_the_republic_of_cyprus_desc:0 "Rejecting union with Greece, Cyprus shall chart its own course as an independent republic. By proclaiming the Republic of Cyprus, the island secures sovereignty and recognition on the world stage."
 CYP_booming_economy:0 "Booming Economy"
 CYP_booming_economy_desc:0 "With the proclamation of the Republic of Cyprus, waves of foreign capital and aid have flooded into our young nation. Diaspora communities, Western financial institutions, and supportive guarantor states have all contributed to this unprecedented inflow of resources. What once seemed a fragile economy is now experiencing rapid growth, industrial expansion, and newfound confidence in the markets. For the first time in our history, prosperity appears within reach."

 CYP_reaffirm_ties_to_london:0 "Reaffirm Ties to London"
 CYP_reaffirm_ties_to_london_desc:0 "Cyprus was once the Empire’s watchtower in the East. By formally requesting protectorate status, we return to Britain’s orbit and ensure our defense under the Union Jack."
 CYP_imperial_garrison:0 "Imperial Garrison"
 CYP_imperial_garrison_desc:0 "British forces redeploy to Cyprus, establishing garrisons and airfields. The island again becomes a cornerstone of imperial strategy in the Mediterranean."
 CYP_commonwealth_research_program:0 "Commonwealth Research Program"
 CYP_commonwealth_research_program_desc:0 "By joining the Commonwealth’s scientific initiatives, Cyprus gains access to shared technologies and expertise. Our universities and laboratories benefit from the resources of an empire that spans the globe."
 CYP_colonial_investments:0 "Colonial Investments"
 CYP_colonial_investments_desc:0 "Funds from London develop harbors, railways, and industry. While our independence is curtailed, the economy flourishes under imperial patronage."
 CYP_fortress_cyprus:0 "Fortress Cyprus"
 CYP_fortress_cyprus_desc:0 "Cyprus is transformed into a heavily militarized bastion, armed with British technology and serving as a secure bulwark against threats from the East."


 CYP_legacy_of_hospitallers:0 "Legacy of the Hospitallers"
 CYP_legacy_of_hospitallers_desc:0 "Centuries after their expulsion, whispers of the Knights Hospitaller stir once more. Secret societies and eccentric nobles envision a revival of the old order, restoring Cyprus as a crusader bastion."
 CYP_restore_the_old_fortresses:0 "Restore the Old Fortresses"
 CYP_restore_the_old_fortresses_desc:0 "The castles of Kyrenia, Kolossi, and Buffavento are rebuilt not as relics, but as military installations. Cyprus becomes both fortress and symbol of a forgotten age reborn."
 CYP_orders_army:0 "Order’s Army"
 CYP_orders_army_desc:0 "The revived Knights of St. John forge a modern army, clothed in ancient tradition but armed with modern weapons. Their banners march once again."
 CYP_crusader_economy:0 "Crusader Economy"
 CYP_crusader_economy_desc:0 "The Order seeks funding through European patrons, Catholic charities, and private adventurers. Cyprus becomes an odd mix of medieval zeal and modern capitalism, sustaining the new state."
 CYP_grandmasters_ambition:0 "The Grandmaster’s Ambition"
 CYP_grandmasters_ambition_desc:0 "The Knights look beyond the island, dreaming of a new crusade. With Cyprus as their base, they prepare to intervene across the Levant and beyond — a strange new force in modern geopolitics."
 CYP_restoration_of_the_crusader_states:0 "Restoration of the Crusader States"
 CYP_restoration_of_the_crusader_states_desc:0 "With their ancient lands reclaimed, the Knights proclaim the rebirth of the Crusader States. Jerusalem, Antioch, and Rhodes live again in spirit, if not in name. A medieval dream reshaped for the modern world."

