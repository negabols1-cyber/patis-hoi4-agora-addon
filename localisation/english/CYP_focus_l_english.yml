 CYP_palmerokratia:0 "Palmerokratia"
 CYP_palmerokratia_desc:0 "Sir Richmond Palmer’s governorship marked a period of strict colonial repression. Political freedoms were curtailed, dissent silenced, and the population subjected to rigid control. While stability was maintained, resentment grew under this heavy hand of rule."
 CYP_great_depression:0 "Scars of the Depression"
 CYP_great_depression_desc:0 "Although much of the world has begun to recover from the Great Depression, Cyprus remains shackled by its lingering effects. Isolation, limited resources, and colonial neglect have left the island’s economy stagnant, preventing meaningful progress."

