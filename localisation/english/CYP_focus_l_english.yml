 #Decisions
 CYP_crusader_operations_category:0 "Crusader Operations"
 CYP_crusader_operations_category_desc:0 "The Knights must carefully organize their campaigns of reconquest, preparing detailed plans for each enemy that stands in our way. By channeling our strength into decisive strikes, we can shatter hostile defenses and relive the spirit of the Crusades, ensuring the banner of the Order once more flies over our lost domains."
