l_english: 
USA_junta_in_command:0 "Junta In Command"
USA_junta_in_command_desc:0 "The military junta administration overthrew the government and took control."
USA_mcarthurs_request:0 "MacArthur's Request"
USA_mcarthurs_request_desc:0 "MacArthur seems to be effectively waging war against the radicals but has been desperately calling for additional aid, seemingly taking the governments lack of willingness to expand the military as a sign of weakness. Perhaps he does need some extra hands on deck, if he hopes to maintain order."
USA_expand_the_fbi:0 "Expand the FBI"
USA_expand_the_fbi_desc:0 "When the fbi is enlarged and expanded, we will have a chance to follow our enemies more closely."
USA_enlistment_campaign:0 "Enlistment Campaign"
USA_enlistment_campaign_desc:0 "A large scale enlistment campaign is needed to further drum up war support and get further support. Alongside it, we need to expand the draft to go beyond Selective Service for now."
USA_investigate_the_corruption:0 "Investigate the Corruption"
USA_investigate_the_corruption_desc:0 "Corruption is rampant in our country, and we must keep close watch on everyone involved."
USA_raid_gangs:0 "Raid Cartels"
USA_raid_gangs_desc:0 "We have to raid the cartels, crush them early and get rid of them."
USA_down_with_the_traitors:0 "Track Down the Traitors"
USA_down_with_the_traitors_desc:0 "It's time to take down the traitors we've been following one by one."
USA_deal_with_congress:0 "Deal With Congress"
USA_deal_with_congress_desc:0 "Everything could be better if they come to terms with Congress and come to an agreement with them."
USA_shut_down_the_congress:0 "Shut Down the Congress"
USA_shut_down_the_congress_desc:0 "We must shut down Congress and get rid of this ridiculous society of people."
USA_trial_of_traitors:0 "Get Rid Of Traitors"
USA_trial_of_traitors_desc:0 "Our intelligence services have identified the enablers of radicalism and greed in America. These organizations have been rightfully banned for their implicit betrayal."
USA_dissolve_the_federal_system:0 "Dissolve the Federal System"
USA_dissolve_the_federal_system_desc:0 "The federal system is doing us more harm than good. We must forcefully bind these small regions to ourselves and manage them from a single centre."
USA_patton:0 "Patton's Presidency"
USA_patton_desc:0 "President Patton has proclaimed he would not concede victory to the very partisans who caused the civil war. His American Junta promises a national restoration and adoption of functional democracy as Patton sees it. Elimination of unnecessary politicians and appointment of more competent officials will bridge the gap between people and politics."
USA_declare_martial_law:0 "Declare Martial Law"
USA_declare_martial_law_desc:0 "With Congressional Approval, habeas corpus is suspended in accordance with the constitution. As the threat of invasion from syndicalist and populist forces still looms over part of the land, it is clear that we must act to ensure a secure transition to the post-Civil War era. The writ of habeas corpus and free speech is still suspended for political expediency, and we shall institute martial law to help find any remaining rebels."
USA_second_american_protective_league:0 "Second American Protective League"
USA_second_american_protective_league_desc:0 "As the largest part of the Continuous United States has been pacified, it is essential that American citizens remain vigilant. The reformation of the League as a free information system to report potential populist or syndicalist spies to the Government and to discourage public protest is absolutely needed."
USA_all_to_the_general_staff:0 "All To The General Staff"
USA_all_to_the_general_staff_desc:0 "A General Staff must be assembled that has far greater sway over troop movements and internal army-related policies and technologies, so we may fight the enemy with all we need."
USA_empower_the_army:0 "Empower the Army"
USA_empower_the_army_desc:0 "A crisis has already risen in our new military administration. The Army and Navy are constantly at each other's throats over funding and political kickbacks. We need to relegate the Navy to a secondary governmental position and grant the Army full power."
USA_american_stratocracy:0 "American Stratocracy"
USA_american_stratocracy_desc:0 "Patton has finally restored nationalist fervour and functional Democracy as he sees it. While some complain that career politicians have been replaced by officers, few will argue that the bureaucracy hasn't improved. The American people can now trust their politicians to use legal means to achieve their goals."
USA_increase_armored_vehicle_investments:0 "Increase Armored Vehicle Investments"
USA_increase_armored_vehicle_investments_desc:0 "Wars will now be fought with tanks, not infantry and trench warfare as before, and whoever is faster and stronger will win. That's why we must follow the orders of our leader Patton and increase our investment in armored vehicles and modernize our army quickly."
USA_subsidize_military_companies:0 "Subsidize Military Companies"
USA_subsidize_military_companies_desc:0 "We need to subsidize and revive our failing companies so that we can be better prepared for war. Otherwise it will be much more difficult to do so in wartime."
USA_demand_the_philippines:0 "Demand the Philippines"
USA_demand_the_philippines_desc:0 "We need to strengthen our leverage against Japan, if we have a very big base in the Pacific, we can take away any thought the Japanese have of attacking us."
USA_investigate_army_commanders:0 "Investigate Army Commanders"
USA_investigate_army_commanders_desc:0 "We suspect that there may be traitors among the army commanders. We must keep a close watch on them."
USA_change_the_constitution:0 "New Constitution"
USA_change_the_constitution_desc:0 "Patton's source of power is the military. However, he has expressed concern to some of his close advisors that the end of Civil War will see the U.S. return to having a weak military. To combat this, Patton has advocated an amendment to the constitution that would help create a permanent war machine, beginning with mandating that men of a certain age serve in the armed forces."
USA_destroy_radicalism:0 "Destroy Radicalism"
USA_destroy_radicalism_desc:0 "While the US Government tolerates political discourse, Congress has rallied against the syndicalist and distributionist platforms of Long and Haywood. Legal bodies found to be advocating for trade unions or mutualist organizations will be prosecuted under the 1917 Sedition Act."
USA_the_american_chief:0 "The American Chief"
USA_the_american_chief_desc:0 "Hail to the Chief! All Americans will salute the man who has saved our country from extremists and foreign rule. Patton has inspired the American people and with them behind him, he is more powerful than ever before. He looks to the foreign arena now, in search of new foes."
USA_unholy_alliance_ger:0 "Unholy Alliance"
USA_unholy_alliance_ger_desc:0 "This alliance will benefit us a lot, but it will cause the anger of all the states around us, so we must be prepared."
USA_north_america:0 "Dominate North America"
USA_north_america_desc:0 "We have North America in our hands and we must assimilate it."
USA_new_strategy:0 "Shift Industry Focus To Military"
USA_new_strategy_desc:0 "There is no benefit provided to us by the civilian industry, we are already sufficiently advanced in this field. It's time to shift our full focus to the military industry."
USA_american_junta:0 "American Junta"
USA_american_junta_desc:0 "When the Roman Republic was in crisis, powerful generals rose up to save the country from itself. MacArthur's deal with Eisenhower has been partly made public, though neither the American people nor the rest of the committee will know the nature of their relationship. We must now decide who else shall serve alongside these two men in the new Junta."
USA_utilize_the_legions:0 "Utilize the Legions"
USA_utilize_the_legions_desc:0 "American Legion is now under our control, and it shall have an important place in our new regime. The Legion will keep the peace and hopefully snuff out any rebellions in their infancy, while also helping our law enforcement forces to make sure laws are followed. We will never have lawlessness in our nation again!"
USA_privatize_the_TVA2:0 "Privatize the TVA"
USA_privatize_the_TVA2_desc:0 "The Tennessee Valley Authority has crowded out private competition and has established a stranglehold on construction work in the area. It can not be the government's job to do things the private sector has proven to do better."
USA_de_regulate_the_banking_sector2:0 "De-Regulate the Banking Sector"
USA_de_regulate_the_banking_sector2_desc:0 "Following a correction in the financial markets that is perfectly normal in the economic cycle, previous governments have instituted quite unreasonable constraints on financial activities. While no doubt well-intentioned, these restrictions clearly do more harm than good."
USA_national_employment_strategy2:0 "National Employment Strategy"
USA_national_employment_strategy2_desc:0 "Unemployment comes from a simple fact: people don't match up with the jobs offered. Factories lie idle because employers don't find the people they need while people in other parts of the country starve. We will introduce a new strategy that will ensure that any employer can find the people he needs to run his company."
USA_loyalist_army:0 "Loyalist Army"
USA_loyalist_army_desc:0 "Though men like MacArthur overstepped their boundaries, punishing them too harshly would be seen as distasteful by many of our people. Those who have sympathy for these men argue that they were ultimately loyal to America and to democracy. We have an army that is loyal to us, and that is what matters."
USA_control_congress:0 "Control Congress"
USA_control_congress_desc:0 "Many former Democrats and Republicans have folded into new regime, while holdouts have fled. Fortunately, we were able to fill their vacancies with qualified, trustworthy individuals. These new Congressmen are not politicians per se, they are instead public servants for the American people."
USA_full_congressional_restoration:0 "Full Congressional Restoration"
USA_full_congressional_restoration_desc:0 "Congress has been fully restored to its old glory. Those who stepped down in recent times out of intimidation are returning, and new blood is coming to Washington as well. Gone are the extremist parties that tore the nation apart, and they are replaced by revitalized Democratic and Republican parties that work to represent all. Americans can safely write to their congressmen once more, and democracy is saved."
USA_rebuild_civil_service:0 "Rebuild Civil Service"
USA_rebuild_civil_service_desc:0 "The nation has suffered much long before this war started. It is both a monumental task and an opportunity to unify transportation networks, and push through bolder economic ideas to elevate American industry above this ailing world."
USA_american_values:0 "American Values"
USA_american_values_desc:0 "The passive promotion of civil government through high minded publications was undercut sharply by pamphlets and private publishers that promoted an uncivil government. Congress has decided that a multifaceted approach to instilling American values through mass media will finally undercut pamphleteers."
USA_loyalty_to_american_flag:0 "Loyalty to American Flag"
USA_loyalty_to_american_flag_desc:0 "Unlike the tyrants and despots that are common in the Americas, MacArthur desires not to be a Great Man, but to be a respected and mortal leader of Americans. Loyalty to the unchanging ideal of America must be put above himself, so long as MacArthur's popularity holds out."
USA_join_allies:0 "Join Allies"
USA_join_allies_desc:0 "If we allied ourselves with the Allies, we would have completely protected the seas around us. Thus, our enemies cannot approach us."
USA_the_lion_and_the_eagle:0 "The Lion and the Eagle"
USA_the_lion_and_the_eagle_desc:0 "The Lion and the Eagle stand as one and our economic cabinets will meet to discuss possible investments into munitions we can undertake together."
USA_operation_downfall:0 "Operation Downfall"
USA_operation_downfall_desc:0 "We don't think the Japanese will surrender anytime soon. So we have to make a big operation to land on their main islands and force them to surrender."
USA_help_the_dominions:0 "Help the Dominions"
USA_help_the_dominions_desc:0 "The Dominions is powerful but lacking in industry and experience. We will send both so they may defend democratic interests there."
USA_reorganize_free_corps:0 "Reorganize the Free Corps"
USA_reorganize_free_corps_desc:0 "With the military increasingly suspect, we must turn to the heroes of the Great War. In its hour of need, the German Freikorps came to the aid of the German Republic. We need a similar organization that will stay loyal to us when our hour of need comes."
USA_german_technology_exchange:0 "American-German Technological Cooperation"
USA_german_technology_exchange_desc:0 "This technological agreement will be in the interest of 2 states. The tank technologies we will learn from here will be very useful for us."

USA_infantry_weapons_modernization:0 "Infantry Weapons Modernization"
USA_infantry_weapons_modernization_desc:0 "The standard infantryman remains the backbone of our armed forces. Modernizing his rifle, support weapons, and communications gear will ensure that our infantry divisions can face any enemy on equal footing."
USA_rainbow_five:0 "Rainbow Five"
USA_rainbow_five_desc:0 "The War Plans Division’s ‘Rainbow’ contingency plans have been finalized. Plan Number Five envisions full-scale mobilization for a global conflict — and we must be ready to fight on every front."
USA_mainland_defense_doctrine:0 "Mainland Defense Doctrine"
USA_mainland_defense_doctrine_desc:0 "While foreign wars rage overseas, the first duty of the U.S. Army is to defend the homeland. By developing a coordinated continental defense plan, we can secure our coastlines and industrial heartlands against any threat."
USA_homeland_fortification:0 "Homeland Fortification"
USA_homeland_fortification_desc:0 "Should our shores ever be threatened, a network of reinforced fortifications and coastal batteries will be our last line of defense. Concrete and steel may not be glamorous, but they save lives."
USA_static_defense_training:0 "Static Defense Training"
USA_static_defense_training_desc:0 "Defensive warfare is not merely about waiting; it is about preparation, endurance, and counterattack. Training our divisions in static defense will make any invasion an impossible endeavor."
USA_national_guard_integration:0 "National Guard Integration"
USA_national_guard_integration_desc:0 "The National Guard has long been divided between state and federal authority. By integrating its command structure into the regular army, we will gain a larger, better-coordinated reserve force ready for national emergencies."
USA_combined_arms_doctrine:0 "Combined Arms Doctrine"
USA_combined_arms_doctrine_desc:0 "Modern warfare demands the seamless cooperation of infantry, armor, artillery, and air support. By developing a true combined arms doctrine, our forces will learn to fight as one — fast, flexible, and overwhelming in their power."
USA_engineer_corps_expansion:0 "Engineer Corps Expansion"
USA_engineer_corps_expansion_desc:0 "Roads, bridges, and fortifications win wars as much as guns do. Expanding our Army Engineer Corps will ensure that our forces can build, repair, and fight under any condition."
USA_armored_spearhead:0 "Armored Spearhead"
USA_armored_spearhead_desc:0 "Tanks are the tip of the modern army’s spear. By forming new armored divisions and improving coordination between armor, infantry, and air support, our army will become a force of unstoppable momentum."
USA_army_of_liberation:0 "Army of Liberation"
USA_army_of_liberation_desc:0 "The American Army shall not only defend freedom but carry it abroad. Wherever tyranny takes root, our troops will bring liberation, not conquest."
USA_hammer_of_democracy:0 "Hammer of [GetHammerOfDemocracyName]"
USA_hammer_of_democracy_commie:0 "Socialism"
USA_hammer_of_democracy_democratic:0 "Democracy"
USA_hammer_of_democracy_desc:0 "Our strength must serve a higher cause. The United States Army will become the hammer with which [GetHammerOfDemocracyName] strikes against oppression — a symbol of liberty backed by steel and determination."
USA_army_service_forces:0 "Army Service Forces"
USA_army_service_forces_desc:0 "The massive logistical apparatus required to sustain a global army demands coordination and efficiency. The creation of the Army Service Forces will centralize supply, transport, and administration under one unified command."

USA_strengthen_the_air_corps:0 "Strengthen the Air Corps"
USA_strengthen_the_air_corps_desc:0 "The Army Air Corps remains small and underfunded — a relic of a bygone era. By increasing budgets, modernizing our training, and investing in aircraft production, we will lay the foundation for an air arm worthy of a great power."
USA_aerial_maneuvers:0 "Aerial Maneuvers"
USA_aerial_maneuvers_desc:0 "Complex aerial maneuvers and large-scale flight formations are no longer just for air shows. Through regular joint exercises and war games, our pilots will master coordination, precision, and adaptability in the skies."
USA_fighter_procurement_board:0 "Fighter Procurement Board"
USA_fighter_procurement_board_desc:0 "To maintain air superiority, our fighter program must become a top priority. A dedicated procurement board will coordinate design contracts, accelerate testing, and push for the next generation of American interceptors."
USA_jet_propulsion_research:0 "Jet Propulsion Research"
USA_jet_propulsion_research_desc:0 "The age of propellers is nearing its end. By investing in experimental jet propulsion technology, we can leap ahead of our rivals and secure dominance in the skies of tomorrow."
USA_tactical_bomber_command:0 "Tactical Bomber Command"
USA_tactical_bomber_command_desc:0 "Victory on the ground begins with precision from the air. Establishing a Tactical Bomber Command will allow us to coordinate close air support, interdiction, and battlefield strikes with devastating efficiency."
USA_heavy_bomber_fleet_expansion:0 "Heavy Bomber Fleet Expansion"
USA_heavy_bomber_fleet_expansion_desc:0 "Our industrial might gives us the capacity to build bombers of unprecedented range and payload. Expanding the heavy bomber fleet will ensure that no enemy lies beyond the reach of American air power."
USA_precision_bombing_doctrine:0 "Precision Bombing Doctrine"
USA_precision_bombing_doctrine_desc:0 "Instead of carpet bombing entire cities, our strategists advocate hitting key industrial and logistical targets with pinpoint accuracy. Precision bombing will maximize damage to the enemy war effort while minimizing waste."
USA_expand_aircraft_production_lines:0 "Expand Aircraft Production Lines"
USA_expand_aircraft_production_lines_desc:0 "Air power depends on industry. Expanding aircraft production lines and standardizing parts will allow us to build fighters, bombers, and transports faster than any nation on Earth."
USA_advanced_pilot_training_program:0 "Advanced Pilot Training Program"
USA_advanced_pilot_training_program_desc:0 "A plane is only as good as the man flying it. By refining our training curricula, introducing high-altitude combat simulations, and emphasizing discipline, we will produce the best-trained pilots in the world."
USA_the_b_17_project:0 "The B-17 Project"
USA_the_b_17_project_desc:0 "The Boeing B-17 “Flying Fortress” represents a new era of American engineering — a bomber designed to carry out daylight precision missions deep into enemy territory. With this project, we will pioneer strategic bombing."
USA_boost_transport_capacity:0 "Boost Transport Capacity"
USA_boost_transport_capacity_desc:0 "Logistics is the backbone of air operations. By expanding our transport fleet and improving coordination between ground and air supply, we can project force across oceans with unmatched speed."
USA_army_airfields_expansion:0 "Army Airfields Expansion"
USA_army_airfields_expansion_desc:0 "To support larger wings and heavier aircraft, our airfield infrastructure must grow. New bases will be constructed across the mainland and overseas, ensuring global reach for American air power."
USA_radar_and_targetting_improvements:0 "Radar and Targeting Improvements"
USA_radar_and_targetting_improvements_desc:0 "From early warning to bomb sight accuracy, the war in the air is now fought with data. Improved radar arrays and advanced targeting systems will give our pilots the edge in detection and precision."
USA_unified_strategic_command:0 "Unified Strategic Command"
USA_unified_strategic_command_desc:0 "Coordination between fighters, bombers, and reconnaissance aircraft is essential for victory. A unified strategic command will integrate all branches of the air service into a single, cohesive force."
USA_convair_b_36_project:0 "Convair B-36 Project"
USA_convair_b_36_project_desc:0 "As the world grows smaller, our bombers must fly farther. The Convair B-36 “Peacemaker” project envisions a plane capable of striking targets across continents — the ultimate expression of American strategic reach."
USA_CAS:0 "Battlefield Support"
USA_CAS_desc:0 "The experiences of modern warfare have demonstrated the decisive impact of air power when closely coordinated with ground operations. By establishing dedicated air-ground communication networks and refining strike tactics, our pilots can deliver precision attacks in direct support of advancing troops. The sky will become an extension of the battlefield itself, ensuring our forces never fight alone."

USA_fund_the_navy:0 "Fund the Navy"
USA_fund_the_navy_desc:0 "The time has come to restore the U.S. Navy's dominance upon the seas. New shipbuilding programs, expanded dockyards, and renewed congressional funding will allow our fleets to grow in both number and capability — ensuring that America can project power on every ocean once more."
USA_iowa_class_battleships:0 "Iowa Class Battleship"
USA_iowa_class_battleships_desc:0 "The new Iowa-class battleships represent the pinnacle of American naval engineering — combining heavy armor, massive 16-inch guns, and unprecedented speed for a ship of their size. These vessels will serve as symbols of American strength and deterrence across the seas."
USA_essex_class_aircraft_carriers:0 "Essex Class Aircraft Carrier"
USA_essex_class_aircraft_carriers_desc:0 "The Essex-class carriers embody a new generation of naval aviation — faster, larger, and more efficient than their predecessors. With the ability to carry a formidable air wing, they will provide the Navy with unmatched flexibility and striking power across the globe."
USA_extended_carrier_range_operations:0 "Extended Carrier Range Operations"
USA_extended_carrier_range_operations_desc:0 "Modern warfare demands reach. By improving fuel storage, logistical support ships, and aerial refueling capabilities, our carrier task forces will be able to operate far from home ports — projecting American airpower to even the most remote theaters."
USA_improved_high_velocity_naval_guns:0 "Improved High Velocity Naval Guns"
USA_improved_high_velocity_naval_guns_desc:0 "Naval gunnery continues to evolve. By developing new high-velocity shell designs and advanced turret mechanisms, our battleships will gain superior range, armor penetration, and accuracy — ensuring dominance in every surface engagement."
USA_emergency_repair_procedures:0 "Emergency Repair Procedures"
USA_emergency_repair_procedures_desc:0 "Wartime experience has taught our sailors that survival often depends on swift damage control. By establishing specialized repair training and improving shipboard compartmentalization, we can drastically reduce downtime and loss of vessels during battle."
USA_anti_submarine_warfare:0 "Anti-Submarine Warfare"
USA_anti_submarine_warfare_desc:0 "Submarines pose one of the gravest threats to our naval logistics. Through improved sonar technology, depth charge deployment systems, and escort coordination, we will develop a comprehensive doctrine to hunt and destroy enemy submarines before they strike."
USA_expand_naval_shipyards:0 "Expand Naval Shipyards"
USA_expand_naval_shipyards_desc:0 "With growing tensions abroad, our existing naval production facilities are no longer sufficient to meet the demands of an expanding fleet. By expanding major shipyards such as Norfolk, Brooklyn, and Mare Island, and establishing new ones along the coasts, we will greatly increase our shipbuilding capacity and ensure that America’s navy remains second to none."
USA_advanced_fire_control_systems:0 "Advanced Fire Control Systems"
USA_advanced_fire_control_systems_desc:0 "The integration of radar and automated targeting will revolutionize naval combat. Advanced fire control systems will allow our ships to detect, track, and engage targets with precision even under poor visibility, turning night and weather into our allies."
USA_arsenal_of_the_oceans:0 "Arsenal of the Oceans"
USA_arsenal_of_the_oceans_desc:0 "America shall not merely defend the seas — it shall command them. Our shipyards, our carriers, our battleships, and our men will together form the greatest naval force the world has ever seen. The United States Navy will stand as the undisputed Arsenal of the Oceans."
USA_war_production_board:0 "Establish the War Production Board"
USA_war_production_board_desc:0 "The time for piecemeal expansion is over. Our current industrial mobilization is hindered by bureaucratic competition between the Army, the Navy, and civilian market demands. We must end this chaos. By Executive Order 9024, we are establishing the War Production Board with supreme authority over the nation's economy. Under this new directorate, civilian automobile plants will be forcibly converted to produce tanks and aircraft. Every ounce of steel, rubber, and aluminum will be allocated solely for the war effort. The free market's chaotic energy must now be channeled into a singular purpose: Total Victory."
USA_NSC_68:0 "NSC-68 Strategy"
USA_NSC_68_desc:0 "The Soviet Union is animated by a new fanatic faith, antithetical to our own. To survive, we must embark on a rapid and sustained buildup of the political, economic, and military strength of the free world. No cost is too high for the defense of liberty."
USA_new_look_policy:0 "The 'New Look' Policy"
USA_new_look_policy_desc:0 "We cannot match the communist hordes man for man without bankrupting our economy. We must rely on a 'New Look' defense: smaller conventional forces backed by the overwhelming, asymmetric power of our nuclear arsenal."
USA_SHAPE:0 "Establish SHAPE"
USA_SHAPE_desc:0 "We need more than an alliance; we need a unified command. The Supreme Headquarters Allied Powers Europe will ensure that in the event of war, American, British, and French forces fight as a single, cohesive machine."
USA_offshore_procurement:0 "Offshore Procurement"
USA_offshore_procurement_desc:0 "Sending American weapons is not sustainable in the long run. We must fund the revitalization of European military industries, allowing them to produce their own munitions with American capital."
USA_STANAG:0 "STANAG"
USA_STANAG_desc:0 "An alliance is only as strong as its supply lines. If a Dutch soldier cannot fire British ammunition from an American rifle, we are disjointed. The Standardization Agreement will harmonize our military specifications."
USA_strategic_missile_program:0 "Strategic Missile Program"
USA_strategic_missile_program_desc:0 "The bomber will not always get through. We must usher in the age of the Intercontinental Ballistic Missile, ensuring that no target on earth is beyond the reach of American justice."
USA_the_mediterranean_flank:0 "The Mediterranean Flank"
USA_the_mediterranean_flank_desc:0 "The defense of Europe does not end at the Alps. We must secure the Mediterranean Sea and the southern approach to the Soviet Union."
USA_mutual_security_act:0 "The Mutual Security Act"
USA_mutual_security_act_desc:0 "To contain the Soviet threat, we cannot rely on treaties alone. We must pour concrete and steel into the defense of our allies. This act authorizes the funding for military bases, airfields, and advisory missions across the Free World, from the Mediterranean to the Pacific."
USA_the_cia_directorate:0 "The Central Intelligence Agency"
USA_the_cia_directorate_desc:0 "The era of ad-hoc wartime intelligence is over; we cannot afford another Pearl Harbor. The National Security Act will reorganize our capabilities into a permanent, centralized agency. In this new shadow war, the CIA will act as the eyes and ears of the free world, operating where armies cannot go."
USA_operation_gladio:0 "Operation Gladio"
USA_operation_gladio_desc:0 "We must prepare for the worst. 'Stay-behind' networks of trained partisans and intelligence officers will be established across Europe to lead the resistance should the Red Army occupy the continent."
USA_annual_joint_war_games:0 "Annual Joint War Games"
USA_annual_joint_war_games_desc:0 "Paper treaties do not deter aggressors; ready armies do. We will institute a schedule of massive, annual field exercises—like REFORGER—to test our rapid deployment capabilities. Let the Kremlin watch and tremble as they see the seamless coordination of the Free World's forces."
USA_marshall_plan:0 "The Marshall Plan"
USA_marshall_plan_desc:0 "Europe is in ruins, and misery is the seedbed of totalitarianism. Our policy is directed not against any country or doctrine but against hunger, poverty, desperation, and chaos. By injecting billions into the European economy, we will rebuild the markets of the West and erect a prosperous bulwark against the spread of communism."
USA_the_point_four_program:0 "The Point Four Program"
USA_the_point_four_program_desc:0 "We must embark on a bold new program for making the benefits of our scientific advances and industrial progress available for the improvement and growth of underdeveloped areas. Poverty is the breeding ground of communism."
USA_architect_of_the_free_world:0 "Architect of the Free World"
USA_architect_of_the_free_world_desc:0 "From the ashes of war, we have built a new order. The Atlantic Alliance stands as the mightiest coalition in history. We are no longer just a participant in world affairs; we are the guarantor of the global peace."
USA_operation_dropshot:0 "Operation Dropshot"
USA_operation_dropshot_desc:0 "Coexistence is a myth. The nature of the Soviet beast makes peace impossible. We must strike now, with overwhelming nuclear force, before they become too strong to be defeated. It is us or them."
USA_the_long_twilight_struggle:0 "The Long Twilight Struggle"
USA_the_long_twilight_struggle_desc:0 "Now the trumpet summons us again... not as a call to bear arms, though arms we need, but a call to bear the burden of a long twilight struggle against the common enemies of man: tyranny, poverty, disease, and war itself."
