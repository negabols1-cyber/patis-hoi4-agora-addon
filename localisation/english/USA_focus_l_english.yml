 USA_help_soviet_infantry_med:0 "Moderate Infantry Equipment Help To §Y[SOV.GetFlag][SOV.GetAdjective]§!"
 USA_help_soviet_infantry_small:0 "Small Infantry Equipment Help To §Y[SOV.GetFlag][SOV.GetAdjective]§!"
 
 USA_help_uk_fighter:0 "Small Plane Help To §Y[ENG.GetFlag][ENG.GetAdjective]§!"
 USA_help_uk_strat:0 "Large Plane Help To §Y[ENG.GetFlag][ENG.GetAdjective]§!"