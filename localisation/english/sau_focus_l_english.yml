 ####################
 ##### AL WATAN #####
 ####################
 SAU_foundations_of_the_arab_league:0 "Al Watan Al Akbar"
 SAU_foundations_of_the_arab_league_desc:0 "My dear homeland\nThe greatest of homelands\nDay after day\nIts glories multiply\nAnd its life is rife with victories\nMy homeland grows and becomes free\nWatani... Watani\n\nOh my homeland, your love rules my heart\nMy homeland, the homeland of all Arabic people\nYou are the one who called for the ultimate unity\nAfter seeing the beauty of the revolution\nYou are great\nAnd much greater\nThan all existence\nThan all eternity\nOh, my homeland\n\nSweet is the glory filling our hearts\nSweet is the victory cladding our flag\nSweet is the unity\nThat brings our people together\nIt is the sweetest melody in our lives\nOh, It's a melody flowing between two oceans\nBetween Marrakech and Bahrain\nIn Yemen, Damascus and Jeddah\nthere's the same song of the most beautiful unity\nThe unity of all Arab people\n\nOur national unity that we are protecting\nThe one that our lives light as candles around it,\nis a paradise smiling upon whoever is peaceful\nAnd a hell unleashed upon its enemies\nGo see Beirut after the attacks\nWhere is the occupation and oppression?\nThe people became abler and their power increased\nAnd the story of Port Said repeated itself\nThe Arab nations lived and were victorious\n\nOh my homeland, the most precious homeland in the world\nMy homeland, you are a castle of freedom\nYou are the one that builds with those who build\nAnd the one that tears down oppression\nYour voice is free and Arabic\nwith no Eastern nor Western echos\nYour dirt is fit to be eyeliner for my eyes\nThe fragrance of your air is my rebirth\nYou are my love\nOh, my Arabic homeland\n\nOh my homeland, you are a revolution against their occupation\nFill your islands with fire, destroy them\nIf we are all martyred upon your lands\nThe rocks of our mountains will fight them\nOccupation will end by our hands\nIts time in this world is up and done\nNot in Algeria, Not in Oman,\nWill the revolution fade in the face of oppression\nuntil the triumph of the Arabic people.\n\nOh, my homeland, you are a paradise that people envy\nFor its glories and charms\nYour canal returned to you\nAnd you are protecting it for the good of the world\nRaise the dam up high and reap its goods\nProduce, plant and build with its light\nYour elevation is worship in our heart\nYou are a homeland whose life is full of sovereignty\nThe homeland of dignity\nThe Arabic homeland\n\nOh my homeland, you crawl towards your victories\nYour life is a life of glory\nIn Palestine and our revolting South,\nWe will regain your freedom\nWe are a homeland that protects and does not threaten\nA homeland that preserves and does not waste\nA homeland of glory\nMy Arabic homeland" #https://open.spotify.com/intl-tr/track/0gzyOiJZO1Bk7ew9qrVG7s?si=86a41be408514edc
 SAU_coronation_of_crown_prince:0 "Coronation of the Crown Prince"
 SAU_coronation_of_crown_prince_desc:0 "The time has come to officially crown Crown Prince Saud bin Abdulaziz Al Saud. His leadership will ensure the continuity of the House of Saud and the legacy of his father, Abdulaziz. With wisdom and loyalty, he will carry the nation forward."
 SAU_establish_the_arab_league:0 "Establish the Arab League"
 SAU_establish_the_arab_league_desc:0 "We have agreed with our neighbors, now it is time to formalize the Arab League and announce it to the world. This league will serve as a platform for cooperation and unity among Arab nations. Together, we shall protect our interests and voice."
 SAU_create_arabian_economic_council:0 "Create Arabian Economic Council"
 SAU_create_arabian_economic_council_desc:0 "We will establish the Arabian Economic Council to coordinate development efforts across the region. This council will promote trade, investment, and economic cooperation among Arab states. Its work will strengthen our shared prosperity and stability."
 SAU_create_the_arabian_central_bank:0 "Create the Arabian Central Bank"
 SAU_create_the_arabian_central_bank_desc:0 "We will establish the Arabian Central Bank to unify our financial systems and stabilize the economy. This institution will regulate currency and support economic growth across the region. Its creation marks a significant step towards economic sovereignty."
 SAU_increase_research_budget:0 "Increase Research Budget"
 SAU_increase_research_budget_desc:0 "We will increase the research budget to foster innovation and technological progress. Investing in knowledge is essential for the future prosperity of our nation. Through this commitment, we aim to build a stronger and more advanced society."
 SAU_create_arabian_defense_council:0 "Create Joint Defense Council"
 SAU_create_arabian_defense_council_desc:0 "We will create a Joint Defense Council to coordinate the military efforts of Arab nations. This council will enhance our collective security and readiness against external threats. United, we stand stronger to protect our lands and people."
 SAU_joint_arabian_defense_forces:0 "Joint Military Forces"
 SAU_joint_arabian_defense_forces_desc:0 "We will form Joint Military Forces to strengthen cooperation and unity among Arab armies. This initiative will improve coordination and effectiveness in defending our region. Together, we will ensure lasting peace and security."
 SAU_connect_capitals_with_railways:0 "Connect Capitals with Railways"
 SAU_connect_capitals_with_railways_desc:0 "We will connect the capitals with railways to improve communication and trade between them. This infrastructure project will facilitate economic growth and national unity. Better connections mean a stronger and more integrated homeland."
 SAU_increase_military_deterrence:0 "Increase Military Deterrence"
 SAU_increase_military_deterrence_desc:0 "We will increase our military deterrence to protect our sovereignty and discourage any potential aggressors. A strong defense is vital for maintaining peace in the region. Our commitment to security will ensure the stability of our homeland."
 SAU_pool_technical_knowhow:0 "Pool Technical Know-How"
 SAU_pool_technical_knowhow_desc:0 "We will pool technical know-how from across the region to advance our industries and infrastructure. Sharing expertise will accelerate our development and strengthen our self-reliance. Together, we build a modern and prosperous kingdom."
 SAU_demand_independence_in_the_middle_east:0 "Demand Independence in the Middle East"
 SAU_demand_independence_in_the_middle_east_desc:0 "We will demand independence for all nations in the Middle East to ensure freedom and sovereignty for our people. This is a crucial step toward regional stability and unity. Our shared future depends on the dignity and self-determination of every nation."
 SAU_establish_the_united_arab_state:0 "Establish the United Arab State"
 SAU_establish_the_united_arab_state_desc:0 "We aim to establish the United Arab State as a symbol of unity and cooperation among Arab nations. This will strengthen our political and economic ties and ensure mutual prosperity. Together, we will build a stronger and more influential region."
 SAU_establish_the_united_arab_federation:0 "Establish the United Arab Federation"
 SAU_establish_the_united_arab_federation_desc:0 "We will establish the United Arab Federation to unite our nations under a common purpose and shared governance. This federation will enhance cooperation and promote peace across the Arab world. Together, we strive for stability and progress for all our people."
 SAU_ministry_of_state_planning:0 "Found the Ministry of State Planning"
 SAU_ministry_of_state_planning_desc:0 "We will found the Ministry of State Planning to coordinate our nation's development and economic growth efficiently. This ministry will guide our resources toward building a prosperous future. Careful planning is essential for the progress of our kingdom."
 SAU_supreme_security_directorate:0 "The Supreme Security Directorate"
 SAU_supreme_security_directorate_desc:0 "We will establish the Supreme Security Directorate to ensure the safety and stability of our kingdom. This institution will oversee internal security and protect our people from all threats. A secure nation is the foundation of lasting peace and prosperity."
 SAU_maintain_decentralized_system:0 "Maintain Decentralized System"
 SAU_maintain_decentralized_system_desc:0 "We will maintain a decentralized system to respect the traditions and autonomy of our tribes and regions. This approach allows local leaders to manage their affairs while supporting the unity of the kingdom. Balancing authority and independence is vital for harmony and strength."
 SAU_joint_research_programs:0 "Joint Research Programs"
 SAU_joint_research_programs_desc:0 "We will initiate joint research programs to advance our scientific and technological capabilities. Collaboration with our allies will bring innovation and strengthen our industries. Together, we can build a future grounded in knowledge and progress."
 SAU_man_factory:0 "Man Factory"
 SAU_man_factory_desc:0 "My homeland, land of history and safety,\nWhere proud suns rise.\nMy homeland, factories for forging men,\nTo whom all nations salute.\n\nWe were born upon it, we die for it,\nMen fighting with brave hearts.\nWe overcame the impossible,\nSwords, shields, eagles, falcons.\n\nTruth is our companion on the path,\nWe walk the roads of justice swiftly.\nMartyrdom is written for us,\nWe await it with longing.\n\nWith one heart we declare:\nThere is none before Egypt nor after.\nBorn great, we stride as youth,\nLiving to build our radiant monuments." #https://open.spotify.com/intl-tr/track/2JLs9vwyKY0XjLySLzdTGh?si=d6d168305893446c
 SAU_common_investment_program:0 "Common Investment Program"
 SAU_common_investment_program_desc:0 "To ensure the success and longevity of our federation, we must move beyond mere political alignment and embrace economic unity. The Common Investment Program coordinates funding, industrial development and infrastructure projects across member states, allowing each region to grow while serving the collective interest of the Arab world."
 SAU_join_the_allies:0 "Join the Allies"
 SAU_join_the_allies_desc:0 "The time for neutrality has passed. Joining the Allies is both a strategic and moral imperative. We will stand shoulder to shoulder with the free world to ensure the safety of our kingdom and the liberation of oppressed peoples."
 SAU_study_the_british_navy:0 "Study the British Navy"
 SAU_study_the_british_navy_desc:0 "As member of the Allies, we have much to learn from the world's preeminent naval power. By studying British naval doctrine, fleet organization and shipbuilding methods, we can begin developing a maritime force capable of defending our shores and projecting Arab strength beyond them."
 SAU_save_arab_minorities:0 "Sout El Gamaher"
 SAU_save_arab_minorities_desc:0 "The voice of the masses is what awakens generations.\nThe voice of the masses is the uprising of heroes' will.\nIt is the one that speaks, it is the one that rules, it is the hero behind every struggle.\nSince Adam's time, oppression has always tried to divide hearts,\nbut the people's voice was always loud, and victory was always for the people.\nIn the history of every struggle, across generations,\nit starts with whispers that shake the groans of oppression in every conscience.\nSteps of victory advance, and cries of freedom burst,\ngrowing louder and louder until they become the voice of the masses.\n\nThe voice of the masses, the voice of the masses.\n\nToday, we reap the fruits of our struggle, and each step needs resolve and steadfastness.\nWith every step, millions build generations capable of miracles.\nThe millions gathered on the 23rd,\nthe day the Arab people sparked the first revolution for liberation.\nThe revolutionaries vowed, and the free agreed,\nto build the path of glory and put their hands in the hands of the masses.\n\nThe voice of the masses, the voice of the masses.\n\nThe hero of Arabism drew its lines boldly on the path.\nWelcome every Arab who extends his hand to his brother.\nWelcome to the heroes, the makers of generations,\nthose whose mother unity is their path — let the rest of the convoy follow.\nMarch with God's help, strive by God's command,\nfor no power but God can stop the tidal surge of the masses.\nThe voice of the masses, the voice of the masses.\n\nO great nation that imposed its existence, many youth sacrificed for you.\nThe martyr whose life ended today knows his blood was not shed in vain.\nA pledge from millions, a pledge with a thousand oaths:\nWe will protect your soil, O Algeria, and guard you with great love.\nA pledge from millions, a pledge with a thousand oaths:\nLong live the victory in free Yemen, and long live the voice of the masses.\n\nThe voice of the masses, the voice of the masses." #https://www.youtube.com/watch?v=41JheKxBMu4
 SAU_destroy_fascists:0 "Chant of The Path of Revenge"
 SAU_destroy_fascists_desc:0 "Oh my Arab brother, everywhere in the Arab homeland, I hear the sound of fire from my heart.\nOh my Arab brother, everywhere in the Arab homeland, I hear the sound of fire.\nOh my Arab brother, who wants revenge and has revenge in his hand.\nYou want to avenge your martyrs, you want to enjoy freedom, you want to live the glorious Arab nationalism you desire.\n''I want my revenge, I want my revenge, I want my revenge.''" #https://www.youtube.com/watch?v=JLgrgI_JJ2s
 SAU_unite_the_arab_army:0 "Unite the Arab Army"
 SAU_unite_the_arab_army_desc:0 "We must abandon a separate and disjointed army system and unite the armies of our countries and fight our enemies as one great army."
 SAU_extensive_recruitment:0 "Raise the Banners of Victory"
 SAU_extensive_recruitment_desc:0 "We are marching, we are marching,\nCarrying weapons in our hands.\nWe are returning, we are returning,\nRaising the banners of victory high!\nWe are moving forward, moving forward,\nSworn by God's covenant,\nWe are determined, we are devoted,\nOffering our lives for victory.\n\nWith your pride, O my country,\nWe swore, O my country,\nThat your army and your people will face every challenge.\nWith your pride, O my country,\nWe swore, O my country,\nThat your army and your people will overcome the challenge.\n\nYour land and your crops,\nYour pride and your strength,\nYour poetry and your songs, your Kaaba and your Mescit,\nI vow to defend them and to resist the enemies!\nAnd I will sacrifice my soul for your eyes, O Watani!" #https://open.spotify.com/intl-tr/track/68w1KFSEJil2aX3s0y0yxR
 SAU_regional_industry_integration:0 "Regional Industry Integration"
 SAU_regional_industry_integration_desc:0 "Without forming a centralized state, we can still harness the economic potential of our alliance through coordinated industrial development. By aligning standards, pooling technical resources, and facilitating trade among Arab League members, we lay the groundwork for a modern, self-sufficient regional economy."
 ####################
 #### CALIPHATE #####
 ####################
 SAU_dream_of_caliphate:0 "Dream of Caliphate"
 SAU_dream_of_caliphate_desc:0 "In 1925, after the Turks abolished the caliphate, Imam Yahya had proposed Rashid Rida as caliph, but Rida died of a heart attack a few years before the post was established. The Islamic world is now in limbo. Ibn Saud, the guardian of the two holy mosques, may be the best man for the job."
 SAU_first_four_year_plan:0 "First Four Year Plan"
 SAU_first_four_year_plan_desc:0 "The Germans' four-year plans, which they had been implementing continuously since 1933, pulled them out of the pit of hyperinflation. We may not be in such a bad situation, but we have been weakened by centuries of exploitation by the Ottomans, the British and the French. Now we need to use all our strength to strengthen the economy in a planned way."
 SAU_purge_political_opponents:0 "Purge Political Opponents"
 SAU_purge_political_opponents_desc:0 "We need to purge our country of some clerics who are remnants of the Ottoman era, who call themselves reformers. They are like a cancerous cell. If you don't cut out the cancer, it will take over the whole body. Nevertheless I am not sure that Arabs know what cancer is now."
 SAU_rebuild_our_empire:0 "Rebuild our Empire"
 SAU_rebuild_our_empire_desc:0 "Since the 1700s, the House of Saud has tried to conquer this glorious Arab land and finally succeeded on its third attempt under the leadership of Ibn Saud, but the British pressure is trying to weaken this empire. We need to arm ourselves to prevent this."
 SAU_aggressive_policies:0 "Bring Sharia to Other Countries"
 SAU_aggressive_policies_desc:0 "Even though we have Sharia law in our own country, the laws of the infidels still apply in other countries. To solve this, we need to get into the hearts of the enemies"
 SAU_old_war_traditions:0 "Old War Traditions"
 SAU_old_war_traditions_desc:0 "Al-Hajjaj ibn Yusuf has abolished the Asawira troops of glorious Arab horses, but their spirits still walk among us. To ease the pain in their souls, we must continue their saga."
 SAU_declare_yourself_caliph:0 "Declare Yourself as Caliph"
 SAU_declare_yourself_caliph_desc:0 "It was impossible to do this when the henchmen of colonialism were running amok in our country, but now we are ready. Our glorious leader Abdulaziz bin Abdul Rahman Al Saud, Emir of Najid, was elected the caliph and leader of the entire Islamic world in a vote by our ulema."
 SAU_force_tribes_to_unite:0 "Force Tribes To Unite"
 SAU_force_tribes_to_unite_desc:0 "Once, a pain began to manifest in the eyes ofJunayd al-Baghdadi. they called for a physician, and the physician who arrived was a christian. After examining him, the physician said, ''You must not allow water to touch your eyes.'' Junayd al-Baghdadi, inquiring with a question, said, ''How can I perform ablution without touching water to my eyes?'' The physician replied, ''If your eyes are of importance to you, then you must not let water touch them.''\n\nJunayd al-Baghdadi performed his ablution and prayed. after his prayer, he rested for a while. Upon waking, he found that the pain in his eyes had completely disappeared. at that moment, a voice whispered to him, ''O Junayd! you have sacrificed your eyes for us; therefore, We have removed that pain from you.''\n\nSome time later, the christian physician returned and, seeing that Junayd's eyes were completely healed, asked in astonishment, ''How did you manage to heal them?'' Junayd al-Baghdadi recounted the events, and the physician, deeply moved, kissed his hands and said, ''The eyes that truly suffered were not yours, but mine. It was I who was blind to the truths; it was I who could not see the reality.''\n\nLook, Junayd al-Baghdadi, by sacrificing his eyes, found his true vision. look, through his faith, he became the cause of another soul's awakening.But we... what of us? How do we spend this brief life of ours? How much are we willing to sacrifice?"
 SAU_enforce_sharia_harsher:0 "Enforce Sharia Harsher"
 SAU_enforce_sharia_harsher_desc:0 "We were not applying sharia properly. Since we are going back to the old times, it is the right place and time to apply the laws as Allah has shown us."
 SAU_transition_to_an_islamist_army:0 "Transition to An Islamist Army"
 SAU_transition_to_an_islamist_army_desc:0 "The Islamic army, which was entrusted to us by the Prophet, has lost itself over the centuries. No one knows where the Islamic army is now, except our caliph Hadrat Ibn Saud. With the edict he will issue tonight, our Royal Army will evolve into warriors who serve only Islam."
 SAU_nation_under_god:0 "Nation Under God"
 SAU_nation_under_god_desc:0 "The word is the word of swords\nFor the tyrants to be retaliated\n\nEven the most vile have insulted\nthe Messenger of the people of diligence\n\nThey would not have desecrated our sanctity\nIf it were surrounded by lions\n\nThe scum of aggression have assaulted\nSo where is the covenant of swords?\n\nThey have forgotten that we are resistant\ndefending like the defense of lions\n\nWe are the ones who had tread\nWith horse the soil of the foreigners\n\nWe are the ones who built\nOur forts with skulls"
 ####################
 #### WAHHABISM #####
 ####################
 SAU_path_of_abd_al_wahhab:0 "On the Path of Abd al-Wahhab"
 SAU_path_of_abd_al_wahhab_desc:0 "Centuries ago, Muhammad ibn Abd al-Wahhab ibn Sulayman al-Tamimi charted a path for all Muslims. It was a path to leave everything except the Qur'an and the Hadiths and move towards the true Islam. For 300 years the groundwork has been laid and now the time has come. We need to bring the apostate Shias and all other infidels to their knees. "
 SAU_empower_the_shura_council:0 "Empower the Shura Council"
 SAU_empower_the_shura_council_desc:0 "The Prophet ﷺ consulted his companions in times of war and peace alike. This tradition of shura — consultation — is not a weakness but a divine command. As Allah said:\n\n''...and consult them in matters. And when you have decided, then rely upon Allah.''\n\nWe shall strengthen the Shura Council, not as a parliament of infidels or a playground of foreign ideas, but as a gathering of the wise, the devout, and the pure — men who fear none but Allah. From now on, no decision shall be made without their voice. This is how the Caliphate shall endure."
 SAU_ban_the_press:0 "Ban the Press"
 SAU_ban_the_press_desc:0 "Freedom of speech is a luxury our vision cannot afford. In this age of moral decay and ideological confusion, the press too often serves foreign interests, spreads sedition and weakens the unity of the Ummah. We shall silence these voices not out of fear, but out of duty and ensure that only truth as guided by the righteous path reaches the hearts of our people."
 SAU_demand_yemen_submission:0 "Demand Yemen Submission"
 SAU_demand_yemen_submission_desc:0 "It echoed high in the sky...The cries of the defiant.\nAnd made the oppressors hear...The melodies of death\nWe come like blazing light... Muslims, our religion is the path\nWe shall proceed to greatness... igniting the surroundings with light and certainty\n\nRoar, O lions... for Jihad is rightful\nAnd roar, for only the army of truth can expel the scoundrels\nWith swords, we annihilate the disbelievers... and death is the \naspiration of the righteous\nFor death is like gifts, so proceed... to the gardens, fear not the calamities\n\nWe shall not be humiliated, we are... the cubs of the conquering warriors\nWith Jihad, the banner of clear victory shall rise\nWith blood, we create glory... and the battlefield is the arena of lions\nWe do not care about the enemies, our determination... is firmly tied with God\n\nOur glory was built with swords... a structure of grandeur\nOur victory will not return... except through struggle\nAdvance, O group of cubs... and create the pride of heroes\nCome on, rise and do not fear, your determination... is like fire in the face of tyrant"
 SAU_demand_oman_submission:0 "Demand Oman Submission"
 SAU_demand_oman_submission_desc:0 "Do you have a secret with God? Between you and God?\nDo you have hidden alms that only God knows about?\n\nStories that can only be revealed in your book when you see God.\nHow would you like this to make you bigger in God's eyes?\nDo you have a secret with God? Between you and God?\nDo you have hidden sincerity that only God knows?\nStories that will only be revealed in your book when you see God.\n\nHow would you like this to make you bigger in the eyes of God?"
 SAU_demand_arab_lands:0 "Demand Arab Lands"
 SAU_demand_arab_lands_desc:0 "The British call themselves protectors of civilization, yet they chain Arab Muslims beneath their boots. They draw borders with rulers and pens, while our people bleed in the deserts they divide. Their churches rise where our call to prayer once echoed. Their laws crush the hearts of men who once followed the Prophet.\n\nNo more. The lands of the Arabs must return to Muslim hands. From Baghdad to Aden, from Jerusalem to Amman, the banners of kufr will fall. We will free our brothers not with diplomacy, but with force. The sword will speak, and the Ummah will rise."
 SAU_demand_syria_and_lebanon:0 "Demand Syria and Lebanon"
 SAU_demand_syria_and_lebanon_desc:0 "''They divided our lands with ink, as if we were cattle. They drew borders through Damascus and Beirut while sipping wine in Paris. But the Ummah is not blind, and Allah is not asleep.''\n\nFor too long, the French trampled on the blessed soil of Sham. They installed puppet rulers, desecrated our mosques, and crushed every voice that spoke the name of Allah. This crime shall not go unpunished. \n\nSyria and Lebanon are not theirs to give or keep. They are lands of Islam, lands of blood, and lands of promise. We shall demand what is ours — and if they deny us, we shall take it by fire."
 SAU_attack_iraq:0 "Attack Iraq"
 SAU_attack_iraq_desc:0 "''They betrayed Salahuddin, the noble lion of Islam, by turning their backs on his legacy and begging for scraps from the tables of crusaders.''\n\nThe lands of Iraq — from Mosul to Basra — are Arab and Islamic to the bone. But now, they are tainted by division. Foreign agents and mountain tribes who know nothing of loyalty seek to carve out false kingdoms in the shadow of the British.\n\nWe will not let the Crescent be fractured by those who speak our language but poison our unity. Iraq shall return to the fold of the Ummah — whether by oath or by iron."
 SAU_attack_iran:0 "Attack Iran"
 SAU_attack_iran_desc:0 "He has risen to the heights of glory.\nA flame of passion that sets the earth ablaze.\n\nIn the dust of war, he looks like a little girl.\nHe wielded the sword and prayed like God and Galal.\nThe horses of Jihad fill the world with prayer.\nThe sword was unsheathed, the sword was wielded\nJihad's horse is galloping through the world.\nBreaking and entering, tearing the enemies to shreds."
 SAU_demand_libya:0 "Demand Libya"
 SAU_demand_libya_desc:0 "''Do you think Allah does not see what the Italians have done in Tripoli? The desert witnessed it. The angels recorded it.'' \n\nThey came with crosses and chains, burned the palm trees, and spilled the blood of the faithful. For decades, Libya has groaned under the iron heel of Rome. But this land was never theirs. It belongs to the martyrs, to the mujahideen, to Islam. \n\nWe shall demand its return with words first — but know this: the sea does not separate us from Libya. It connects us. And our ships are ready."
 SAU_embrace_umayyad_legacy:0 "Embarce Khulafa al-Rashidun Legacy"
 SAU_embrace_umayyad_legacy_desc:0 "For centuries, Islam has been buried under layers of bid'ah, idol-worship of dynasties, and the poison of philosophy. But now, as Muhammad ibn Abd al-Wahhab taught us, the path forward is the path backward — to the time of Abu Bakr, Umar and Uthman, expect Ali.\n\nThis is the first step toward the restoration of true Islam: rejecting the corrupt empires of man, and embracing the rightly guided leadership of the earliest Ummah. The Caliphate will not be born anew — it will be reborn exactly as it once was."
 SAU_invest_in_newly_conquered_territories:0 "Invest in Newly Conquered Territories"
 SAU_invest_in_newly_conquered_territories_desc:0 "''We did not conquer for plunder. We conquered to bring light where there was darkness, order where there was chaos, and tawhid where there was shirk.'' \n\nThe lands that now kneel under our banner are not mere spoils of war — they are trusts (amanah) given by Allah. Just as Umar ibn al-Khattab wept over the suffering of his subjects, so too must we take responsibility."
 SAU_reach_the_atlantic:0 "Reach the Atlantic"
 SAU_reach_the_atlantic_desc:0 "The Khulafa al-Rashidun carried Islam across deserts and mountains not for gold, but for guidance. We follow their steps. The Maghreb groans under foreign boots, its masjids silenced, its men humiliated. We will not allow this to continue. \n\nOur mission is not done until the adhan echoes once more from the shores of the Atlantic. Every Muslim, no matter how far west, will be freed. With Qur'an in one hand and sword in the other, we march — not for empire, but for unity under Allah."
 SAU_nasr_min_allah_wa_fath_qarib:0 "Nasr Min Allah Wa Fath Qarib"
 SAU_nasr_min_allah_wa_fath_qarib_desc:0 "''And victory is not except from Allah. Indeed, Allah is Exalted in Might and Wise.”\n\nToday, we stand before the greatest trial of our time. The disbelievers rule the world, while the believers remain shackled and humiliated. But we are the light rising from the darkness. The Quran has promised us that victory is near, and we cling to that promise with unshakable faith.\n\nOur land, our Sharia, our army, our belief — all have been prepared for the sake of Allah. Now the winds of fate blow behind us.\n\nVictory is near. And the help of Allah is certain."
 SAU_reach_the_real_islam:0 "Reach the Real Islam"
 SAU_reach_the_real_islam_desc:0 "''For centuries, the flame of Tawhid flickered in the storm — nearly extinguished by idol-worshipping kings, Persian heresies, and the filth of foreign occupiers. But now, by Allah's will, the torch is in the hand of a true believer.'' \n\nMuhammad ibn Abd al-Wahhab showed us the path, but it is Abdulaziz ibn Saud who walks it with fire. The Islam of today — diluted by Western lies, Shiite corruption, and Sufi delusions — is not the Islam of the Prophet ﷺ. We reject their shrines, their saints, their flags, and their books. There is no god but Allah. \n\nWe shall tear down every false idol — from Qom to Cairo, from the Mediterranean to the Hindu Kush. The age of compromise is over. The age of purity begins. Real Islam shall reign — and those who stand against it will taste steel."
 SAU_may_allah_bless_us:0 "May Allah Bless Us"
 SAU_may_allah_bless_us_desc:0 "When enemies conspire and chaos tries to break us, remember His words: ''Wa layu'addila Allahu nahran'' — Allah will never allow the way of truth to falter. Victory belongs to those who walk in His light.\n\nMay Allah bless our path, unite our hearts, and grant us strength to carry the banner of faith. There is no refuge but in Him alone."
 SAU_take_back_andalusia:0 "Take Back Al-Andalus"
 SAU_take_back_andalusia_desc:0 "They say it was lost. No — it was stolen. Torn from the Ummah by swords of Crusaders, and now defiled by their churches, their wine, and their godless law.\n\nAl-Andalus was not just a land — it was the pearl of Islamic civilization, where the Qur'an was recited beneath the stars of Córdoba. For eight centuries it stood as a light in Europe's darkness, until the traitors at Granada opened the gates to hell."
 SAU_subsidize_military_industry:0 "Subsidize Military Industry"
 SAU_subsidize_military_industry_desc:0 "We will flood the land with steel and fire. Civilian needs can wait; soldiers do not. Our factories will no longer serve comfort — they will serve conquest. Every rifle built, every shell forged, every tank completed brings us one step closer to wiping the infidels from the earth."
 SAU_reform_the_mabahith:0 "Reform the Mabahith"
 SAU_reform_the_mabahith_desc:0 "Enemies do not only cross our borders — they whisper in our mosques, write in our papers, and poison the minds of the weak. Traitors wear our clothes and speak our tongue. They hide behind false piety and foreign ideals.\n\nThe Mabahith will no longer act with hesitation. It will become the blade in the shadows, the eye that never blinks. We will root out the cowards, the liberals, the disbelievers who rot our nation from within. Fear will return to the hearts of those who plot against the Caliphate."
 SAU_increase_military_investments:0 "Increase Military Investments"
 SAU_increase_military_investments_desc:0 "Words no longer matter. The enemy does not listen to speeches — only to gunfire. We have built enough mosques; now we must build weapons. We have prayed enough; now we must march. Every coin shall be melted into bullets. Every factory shall echo with the rhythm of war. We will not stop until every last enemy is ash beneath our boots. The age of hesitation is over. The age of destruction has begun."
 SAU_black_gold_feeding_the_black_flag:0 "Black Gold Feeding the [GetSAUFlagType]"
 SAU_black_gold_feeding_the_black_flag_desc:0 "Allah hides His blessings where man forgets to look — deep beneath the desert sands lies the black gold that shall finance the awakening of the Ummah. Our gold will not feed vanity — it will feed victory. The Caliphate does not drink wine; it drinks oil and breathes fire."
 ####################
 #### BASIC LAW #####
 ####################
 SAU_basic_law_of_saudi_arabia:0 "Issue the Basic Law of Saudi Arabia"
 SAU_basic_law_of_saudi_arabia_desc:0 "The age of fragmented tribes and uncertain laws is over. The state is no longer a gathering of clans — it is the sword of Allah, sharpened into an empire. We are not merely a kingdom. We are the shield of the believers, the fire that will consume disbelief.\n\nWith the stroke of a pen and the will of steel, the Basic Law shall declare the unshakable foundation of our rule. One leader, one faith, one law — divine, unchanging, and absolute. From this day forth, we shall no longer be known as the Kingdom of Saudi Arabia."
 SAU_improve_hajj_tourism:0 "Improve Hajj Tourism"
 SAU_improve_hajj_tourism_desc:0 "Millions come to our land every year not for leisure — but for submission. They walk in the footsteps of Ibrahim, they circle the Kaaba, and they witness the heart of Islam beating in our soil. This is more than worship. It is power."
 SAU_dissolve_the_shura_council:0 "Dissolve the Shura Council"
 SAU_dissolve_the_shura_council_desc:0 "Discussion breeds hesitation. Debate breeds weakness. The time for councils and consultation is over. The will of the state must be as singular and unyielding as the sword that guards it.\n\nThe Shura Council once served its purpose — but now it is a relic, a cage for the ambitions of our empire. There can be no room for divided voices when forging the future of the Ummah. One leader must speak, and the nation must act.\n\nFrom now on, there will be no more votes — only commands. No more opinions — only obedience."
 SAU_empower_the_ulema:0 "Empower the Ulama"
 SAU_empower_the_ulema_desc:0 "No law is valid unless it flows from the Qur'an and the Sunnah.The time has come to restore the rightful place of the scholars: not as advisors, but as judges, commanders, and voices of Allah's will on earth. Their words shall shape our policies. Their fatwas shall forge our laws. Their wisdom shall light the path of conquest and purification."
 SAU_capture_neighboring_countries:0 "Capture Neighboring Countries"
 SAU_capture_neighboring_countries_desc:0 "Borders are not sacred — revelation is. The maps drawn by colonial hands do not bind us. Our mission is not to respect the nations of men, but to fulfill the will of Allah and unify the Muslim lands under one righteous rule.\n\nThe false governments around us have traded faith for flags and creed for currency. They pretend to be Muslim, yet kneel to foreign idols. We will not negotiate with apostates. We will not coexist with traitors."
 SAU_declare_jihad:0 "Declare Jihad"
 SAU_declare_jihad_desc:0 "We have spoken enough. We have waited long enough. The disbelievers mock us, the apostates defile our faith, and the weak among us sit in silence. But now, the sword shall speak where the tongue has failed.\n\nJihad is not a choice — it is a divine command. When the call is made, the true believers must rise, and the hypocrites shall be exposed. The Caliph has declared it: not for land, not for gold, but for the soul of Islam itself.\n\nWe shall strike with the fire of faith. The idols will fall, the tyrants will bleed, and the banners of tawhid shall rise where darkness once reigned."
 SAU_fight_for_allah:0 "Fight for Allah"
 SAU_fight_for_allah_desc:0 "We do not fight for land, for power, or for pride. We fight because our Lord commands us. Every drop of blood spilled on this path is a prayer. Every fallen martyr is a light in the darkness. This is not war — this is worship.\n\nThe armies of disbelief surround us, armed with machines and lies. But we march with conviction, and our hearts carry the words of Allah. Fear does not live in us, for we know that victory is not measured in numbers — it is written by the will of the Most High.\n\nTo fight for Allah is to be free. To die for Him is to live forever."
 SAU_deal_with_islamists_in_iran:0 "Deal with Islamists in Iran"
 SAU_deal_with_islamists_in_iran_desc:0 "The land of Iran groans under the weight of Rafidhi tyranny. For too long, the fire-worshipping heirs of deviance have ruled over the pure-hearted Sunnis of Ahvaz, Baluchistan, and Khorasan. But no longer. Their silence will now give way to swords.\n\nUnder the leadership of Sheikh Muhammad Osman Naqshbandi, a new light begins to rise in the east. He speaks not of compromise, but of vengeance. Not of unity, but of purification. The true Muslims of Iran shall no longer kneel to Qom and Karbala. They will rise, and with them, the fire of rebellion shall engulf the Shia strongholds."
 SAU_encourage_muslims_to_revolt:0 "The Management of Savagery"
 SAU_encourage_muslims_to_revolt_desc:0 "Before order, there must be chaos. Before unity, there must be collapse. The corrupt regimes of the Arab world — built on betrayal, guarded by foreign rifles, and worshipping the West — cannot be reformed. They must be dismantled, piece by piece, from within."
 SAU_provide_support_to_the_rebels:0 "Provide Support to the Rebels"
 SAU_provide_support_to_the_rebels_desc:0 "The flames of rebellion need kindling, and the oppressed must be given a hand to grasp. Across the deserts and cities, our allies in the shadows rise. Their cause is our cause — to shatter the chains of tyranny and restore the dignity of the Ummah.\n\nThe Caliph's hand guides these efforts — unseen but unstoppable. The revolution will spread, and the tyrants will fall like dry leaves before the storm."
 SAU_gather_muslims_under_one_roof:0 "Gather Muslims Under One Roof"
 SAU_gather_muslims_under_one_roof_desc:0 "No more shall our brothers be divided by false borders or heretical rulers. The mosque must be our fortress, the Qur'an our constitution, and the Caliph our guide.\n\nThe time has come to gather the scattered sheep and shepherd them into the fold of true Islam. One roof, one faith, one destiny."
 SAU_military_cooperation:0 "Military Cooperation"
 SAU_military_cooperation_desc:0 "Through shared training, intelligence, and resources, we will build a military alliance that defends Islam against all enemies. The enemy fears a united Ummah; let us become the sword and shield of the faithful.\n\nIn the words of the Qur'an, ''And hold firmly to the rope of Allah all together and do not become divided'' — this is our call to arms."
 SAU_crush_all_infidels:0 "Crush All Infidels"
 SAU_crush_all_infidels_desc:0 "The time has come to uproot the enemies of Islam who mock our faith and defile our sacred lands. They spread corruption and chaos, poisoning the hearts of the faithful with lies and deceit. Their reign is a plague upon the Ummah, and it must be crushed without mercy.\n\nThis is our divine duty — to purify the world and bring the justice of Islam to every nation. Victory belongs to the righteous, and defeat to the infidels."
