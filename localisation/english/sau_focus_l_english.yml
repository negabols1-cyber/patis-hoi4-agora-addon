l_english:
 ##################################
 ##################################
 ########### POLITICS #############
 ##################################
 ##################################
 SAU_the_unifier:0 "The Unifier"
 SAU_the_unifier_desc:0 "Abdulaziz united the tribes and regions under one banner through wisdom and determination. We shall honor his legacy by preserving the unity he forged with such effort. The Kingdom stands strong today because we never strayed from the path he set."
 SAU_expand_shura_council:0 "Expand Shura Council"
 SAU_expand_shura_council_desc:0 "To govern wisely, we must hear the voices of more tribes and regions in our council. Expanding the Shura Council will ensure broader representation and national cohesion. Through consultation, we shall strengthen unity and make better decisions."
 SAU_treaty_of_friendship_with_iraq:0 "Treaty of Friendship with Iraq"
 SAU_treaty_of_friendship_with_iraq_desc:0 "Iraq, our brothers in the North, our religious brothers with whom we shed blood against the Ottomans, we have enmities but these cannot change the fact that we are brothers"
 SAU_regulations_on_slavery:0 "Regulations on Slavery"
 SAU_regulations_on_slavery_desc:0 "Slaves have been widely used in our country in every field since our kingdom was founded. Domestic work, agriculture, industry - slaves are indispensable, but international pressures pose greater risks for us. We can get rid of these pressures with some regulations on slavery"
 SAU_find_partners_for_oil_exploration:0 "Find Partners for Oil Exploration"
 SAU_find_partners_for_oil_exploration_desc:0 "Our deserts may hide wealth beneath the sands, waiting to be uncovered. By seeking foreign partners, we can begin serious exploration for oil reserves. With the right alliances, this black gold can transform our nation's future."
 SAU_concessions_to_aioc:0 "Concessions to AIOC"
 SAU_concessions_to_aioc_desc:0 "To secure investment and diplomatic stability, we must cooperate with the British oil giant AIOC. Granting concessions is a necessary step for economic growth and international recognition. Through careful negotiation, we can turn their interest into benefit for our Kingdom."
 SAU_concessions_to_standard_oil_and_texaco:0 "Concessions to Standard Oil"
 SAU_concessions_to_standard_oil_and_texaco_desc:0 "Working with American firms like Standard Oil will bring expertise and advanced methods. Such cooperation will boost oil production and deepen our technological capabilities. This is a strategic step toward long-term prosperity and global presence"
 SAU_invite_germans:0 "Concessions to Brabag"
 SAU_invite_germans_desc:0 "Black gold, the foundation of empires , the blood of war machines And it comes from everywhere in our vast deserts. On the other hand, Germany is a great war machine, but it has no resources to feed it. By giving the Germans this valuable resource, we can ensure that they support our interests"
 SAU_request_support_from_commonwealth:0 "Request Support From Commonwealth"
 SAU_request_support_from_commonwealth_desc:0 "To accelerate our development, we should reach out to the British Commonwealth for assistance. Their experience and resources can support our infrastructure and administrative reforms. With their backing, we can grow stronger without compromising our sovereignty."
 SAU_anglo_arabian_research_agreement:0 "Anglo-Arabian Research Agreement"
 SAU_anglo_arabian_research_agreement_desc:0 "Recognizing our growing strategic alignment with the United Kingdom, we have formalized a scientific partnership aimed at fostering mutual technological progress. Through shared laboratories, knowledge exchange, and coordinated research programs, our nations will advance not just in arms or infrastructure but in intellect."
 SAU_ask_for_british_colonies:0 "Ask for British Colonies"
 SAU_ask_for_british_colonies_desc:0 "Our national interest demands control over nearby lands rich in resources and oil. By requesting these colonies from the United Kingdom, we aim to expand peacefully. With their transfer, both stability and prosperity in the region can be secured."
 SAU_expand_oil_exploration_area:0 "Expand Oil Exploration Area"
 SAU_expand_oil_exploration_area_desc:0 "The generous United Kingdom left us the valuable resource centers of the Arabian Peninsula, and now it is our turn to extract and process the precious oil that lies beneath these sands. so that our allies across the seas can continue to feed their war machines"
 SAU_found_aoc:0 "Found AAOC"
 SAU_found_aoc_desc:0 "Our partnership with AIOC has already begun to bear fruit In order to make the best use of our country's oil resources, we need to adapt this company to our own geography"
 SAU_end_relations_with_germany:0 "End Relations with Germany"
 SAU_end_relations_with_germany_desc:0 "Germany's aggressive behavior is putting the world in greater and greater danger. Worse, they are using our oil to feed their industry. We cannot allow this racist and so-called secular country that does not respect our religion to use our resource against us."
 SAU_take_british_loans:0 "Take British Loans"
 SAU_take_british_loans_desc:0 "Yes, we have rich oil resources but no money. It costs a lot of money to extract, process and exploit these precious resources, but our British friends will not hesitate to give us a modest loan to make our job easier"
 SAU_hajj_revenues:0 "Hajj Revenues"
 SAU_hajj_revenues_desc:0 "Since the holy Kaaba is within our borders, tens of thousands of pilgrims come to our country every year. It would be excellent for economic development if these brothers and sisters give us a humble money for the accommodation visit."
 SAU_allied_economic_support:0 "Allied Economic Support"
 SAU_allied_economic_support_desc:0 "If the Allies rely on our oil, they must contribute to our economic development in return. Mutual benefit will be the foundation of any lasting partnership we build with them. Through investment and cooperation, we secure both profit and influence."
 SAU_establish_dhahran_city:0 "Establish Dhahran City"
 SAU_establish_dhahran_city_desc:0 "Thanks to the discovery of the largest oil reserve in our country, our wealth is increasing day by day, but we need to be able to use this reserve efficiently. Establishing a city, a company center near this reserve will provide maximum efficiency."
 SAU_lend_lease_act:0 "Lend Lease Act"
 SAU_lend_lease_act_desc:0 "Our vast oil reserves continue to attract foreign invaders. We must ask our American friends to donate weapons to defend our unlimited oil reserves"
 SAU_open_new_oil_wells:0 "Open New Oil Wells"
 SAU_open_new_oil_wells_desc:0 "Our country is an oil paradise. It's as if Allah has blessed the Arabs with this black gold. Not using this miracle of Allah is like rejecting Allah, so we need more wells, we need this oil."
 SAU_improve_infrastructure_network:0 "Improve Infrastructure Network"
 SAU_improve_infrastructure_network_desc:0 "Yes, our country is boiling with oil, but our oil facilities are just wells in the middle of the desert. We need to solve the infrastructure problem as soon as possible."
 SAU_found_casoc:0 "Found CASOC"
 SAU_found_casoc_desc:0 "Americans are much more experienced in oil extraction than us and we know that they love oil very much. It would be profitable for both sides to make an agreement with the Standard Oil  and let them share their experience with us."
 SAU_open_us_legation:0 "Open US Legation"
 SAU_open_us_legation_desc:0 "America has the world's largest oil reserves and they are extremely experienced in exploiting them. Contacting the Americans will be of great benefit to us"
 SAU_invite_american_engineers:0 "Invite American Engineers"
 SAU_invite_american_engineers_desc:0 "We know that we have rich oil reserves, but we do not have the technology and engineers in our country to use them with maximum efficiency. On the other hand, American engineers were born to extract oil. Thanks to our agreement with the US, we need to invite American engineers to our country and learn how to extract oil."
 SAU_invite_ford_motor_company:0 "Invite Ford Motor Company"
 SAU_invite_ford_motor_company_desc:0 "Bringing Ford to our Kingdom will boost industrial growth and vehicle production. Their presence will help modernize our infrastructure and support vital transport needs. This partnership can lay the groundwork for a stronger and more mobile nation."
 SAU_rename_casoc:0 "Rename CASOC"
 SAU_rename_casoc_desc:0 "Although Casoc has served its purpose well, it no longer fully covers its activities in our country. We need to adapt the company to its new tasks and make it more representative of us"
 SAU_end_relations_with_soviet_union:0 "End Relations with Soviet Union"
 SAU_end_relations_with_soviet_union_desc:0 "Our values and interests no longer align with those of the Soviet regime. Maintaining ties risks internal unrest and damages our international position. It is time to firmly cut relations and reaffirm our alliances with trusted partners."
 SAU_end_relations_with_allies:0 "End Relations with Allies"
 SAU_end_relations_with_allies_desc:0 "Changing global dynamics require us to reconsider our alliances carefully. Ending relations with current allies will allow us to pursue an independent path. We must focus on strengthening our sovereignty and national interests above all."
 SAU_buy_german_weapons:0 "Buy German Weapons"
 SAU_buy_german_weapons_desc:0 "After cutting ties with the Soviets and Allies, we will turn to Germany for modern weapons. Their technology will help us build a stronger and more capable military. This step is essential for securing our nation's defense and independence."
 SAU_concessions_to_german_companies:0 "Concessions to German Companies"
 SAU_concessions_to_german_companies_desc:0 "To strengthen our economy and military, we will grant concessions to German firms. Their expertise and investment will accelerate development in key sectors. This cooperation will pave the way for a more self-reliant and modern Kingdom."
 SAU_treaty_of_friendship_with_italy:0 "Treaty of Friendship with Italy"
 SAU_treaty_of_friendship_with_italy_desc:0 "We will establish a formal friendship treaty with Italy to strengthen diplomatic ties. This alliance offers new opportunities for trade and military cooperation. Together, we can ensure greater stability and mutual benefit in the region."
 SAU_study_the_italian_navy:0 "Study the Italian Navy"
 SAU_study_the_italian_navy_desc:0 "We will analyze the structure and tactics of the Italian Navy to improve our own maritime forces. Learning from their experience will help us modernize and strengthen our naval capabilities. This knowledge is vital for securing our coasts and protecting trade routes."
 SAU_german_oil_agreement:0 "German Oil Agreement"
 SAU_german_oil_agreement_desc:0 "We will negotiate an agreement with Germany to secure steady oil supplies for our growing needs. This partnership will enhance our energy security and support industrial development. Through cooperation, we aim to build a reliable foundation for our nation's future."
 SAU_invite_german_engineers:0 "Invite German Engineers"
 SAU_invite_german_engineers_desc:0 "We will bring skilled German engineers to help modernize our industries and infrastructure. Their expertise will accelerate technological progress and improve efficiency across sectors. This collaboration is key to building a stronger, more advanced Kingdom"
 SAU_enter_the_german_sphere_of_influence:0 "Enter the German Sphere of Influence"
 SAU_enter_the_german_sphere_of_influence_desc:0 "Aligning with Germany will open new political and economic opportunities for our Kingdom. This partnership offers protection and access to advanced technology and resources. By entering their sphere, we strengthen our position in a changing world."

 SAU_concessions_to_glavneft:0 "Concessions to Glavneft"
 SAU_concessions_to_glavneft_desc:0 "Reaching an agreement with the Soviets through Glavneft will help us diversify our oil partnerships. This move reduces Western dependency and strengthens our negotiating power. We will secure both economic and political gains."
 SAU_change_political_direction:0 "Change Political Direction"
 SAU_change_political_direction_desc:0 "In the face of Western indifference, the Soviet Union emerges as a possible alternative partner. By reorienting our political strategy eastward, we may secure aid, expertise and a new path forward."
 SAU_strengthen_soviet_cooperation:0 "Strengthen Soviet Cooperation"
 SAU_strengthen_soviet_cooperation_desc:0 "We must deepen our cooperation with the Soviet Union for strategic balance. Their experience and industry can be of great benefit to us. This partnership will secure our position internationally."
 SAU_open_embassy_in_moscow:0 "Open Embassy in Moscow"
 SAU_open_embassy_in_moscow_desc:0 "Formal diplomatic relations with Moscow will legitimize our new direction. This embassy shall serve not only as a channel of diplomacy, but as a signal of our openness to deeper cooperation."
 SAU_concessions_to_soviet_companies:0 "Concessions to Soviet Companies"
 SAU_concessions_to_soviet_companies_desc:0 "Granting economic concessions to Soviet companies will ensure continued cooperation. Their resources and expertise can support our development plans. We must use every advantage to grow."
 SAU_allow_limited_union_activity:0 "Allow Limited Union Activity"
 SAU_allow_limited_union_activity_desc:0 "Allowing limited union activity will appease some domestic demands. It can provide a controlled outlet for labor grievances. However, we must ensure it does not challenge state authority."
 SAU_improve_worker_conditions:0 "Improve Worker Conditions"
 SAU_improve_worker_conditions_desc:0 "Improving worker conditions will help stabilize the labor force. Happier workers lead to better productivity and fewer disruptions. These reforms will also enhance our international image."
 SAU_found_ministry_of_agriculture:0 "Found Ministry of Agriculture"
 SAU_found_ministry_of_agriculture_desc:0 "We will establish a Ministry of Agriculture to manage our growing needs. It will organize farming efforts and distribute modern techniques. With this, we aim to increase food security and rural development."
 SAU_land_reform:0 "Land Reform"
 SAU_land_reform_desc:0 "The current land system benefits the few while impoverishing the many. Inspired by foreign models, we will explore redistribution policies that can unlock agricultural productivity and undermine feudal power."
 SAU_secure_soviet_industrial_support:0 "Secure Soviet Industrial Support"
 SAU_secure_soviet_industrial_support_desc:0 "The USSR has developed vast industrial capacity under adversity. By inviting Soviet engineers and state-backed investment, we can fast-track the modernization of our infrastructure."
 SAU_regulate_sharia_laws:0 "Regulate Sharia Laws"
 SAU_regulate_sharia_laws_desc:0 "In order to harmonize our legal system with industrial development, we must begin revising religious law. Select regulations will be softened to improve labor conditions and administrative consistency."
 SAU_crackdown_on_the_ulama:0 "Crackdown on the Ulama"
 SAU_crackdown_on_the_ulama_desc:0 "The clergy have long held undue sway over politics. Their influence must be curbed, gradually and carefully, to prevent obstruction of the state's reform agenda."
 SAU_take_soviet_loans:0 "Take Soviet Loans"
 SAU_take_soviet_loans_desc:0 "The Soviet Union has agreed to provide low-interest loans to finance state-directed growth. These resources will be used to fuel projects that align with both our development goals and their ideological worldview."
 SAU_first_five_year_plan:0 "First Five Year Plan"
 SAU_first_five_year_plan_desc:0 "We will adopt a structured, long-term approach to national development modeled after the Soviet system. The First Five-Year Plan will prioritize heavy industry, transport, and resource extraction."
 SAU_improve_mabahith_with_nkvd_help:0 "Improve Mabahith with NKVD Help"
 SAU_improve_mabahith_with_nkvd_help_desc:0 "By leveraging NKVD expertise, we can restructure our domestic security apparatus. The Mabahith will become a sharper instrument for monitoring subversion and ensuring internal loyalty."
 SAU_move_away_from_tradition:0 "Move Away From Tradition"
 SAU_move_away_from_tradition_desc:0 "Reform cannot succeed while bound by the chains of ancient customs. We must begin to move beyond tradition not to erase it, but to redefine it for a new era."
 SAU_reform_the_government:0 "Reform the Government"
 SAU_reform_the_government_desc:0 "A modern state requires modern governance. We will restructure ministries, abolish obsolete councils, and centralize authority under a new class of technocrats and reformers."
 SAU_side_with_the_unifier:0 "Side with the Unifier"
 SAU_side_with_the_unifier_desc:0 "As factions within the movement clash over the future of Arabia, the King has made a decisive move: he will remain at the helm not as a monarch of tradition, but as the architect of a socialist transformation. While many are uneasy with a royal leading the revolution, others see him as the unifying figure capable of steering the nation through uncertain times. With power redefined, the Red King rises."
 SAU_consolidate_royal_authority:0 "Consolidate Royal Authority"
 SAU_consolidate_royal_authority_desc:0 "With political uncertainty growing and new factions emerging, King Abdulaziz must act swiftly to preserve the integrity of his rule. Through careful appointments, state restructuring and a firm grip on dissenting voices, the monarchy shall not waver. A new path may lie ahead but it will be walked under his banner."
 SAU_bribe_politicians:0 "Bribe Politicans"
 SAU_bribe_politicians_desc:0 "Not all enemies must be fought some can be bought. By strategically distributing favors and resources, we can neutralize opposition within the elite and smooth the road to transformation."
 SAU_the_red_curtain_falls_over_arabia:0 "The Red Curtain Falls Over Arabia"
 SAU_the_red_curtain_falls_over_arabia_desc:0 "The transformation is complete. Whether under the banner of a redefined monarchy or a revolutionary republic, Arabia now stands as a proud member of the international socialist movement. The red curtain has fallen not as a veil of darkness, but as a symbol of awakening, unity and purpose."
 SAU_abandon_monarchy:0 "Abondon Monarchy"
 SAU_abandon_monarchy_desc:0 "The revolution cannot succeed while the throne remains intact. Monarchy no matter how rebranded is a relic of tyranny, hierarchy and divine rule. To realize the full potential of socialism, we must formally and irrevocably sever our ties with the crown. Let history remember the kings; the future belongs to the people."
 SAU_appeal_for_increased_autonomy:0 "Appeal for Increased Autonomy"
 SAU_appeal_for_increased_autonomy_desc:0 "Though our revolution succeeded, the cost has become clear. We now answer to foreign masters, not our own people. By formally appealing to Moscow, we may negotiate for greater autonomy or at the very least, begin laying the groundwork for a future where Arabia governs itself once again."
 SAU_soviet_arms_support:0 "Soviet Arms Support"
 SAU_soviet_arms_support_desc:0 "As political tensions rise and calls for reform grow louder, our relationship with the Soviet Union deepens. While direct intervention remains premature, Soviet officials have agreed to provide arms, training and logistical aid to sympathetic factions within our ranks. This support, though discreet, may prove decisive in shaping the future balance of power in Arabia."
 SAU_deepen_soviet_economic_integration:0 "Deepen Soviet Economic Integration"
 SAU_deepen_soviet_economic_integration_desc:0 "Having already secured trade, investment and industrial cooperation with the Soviet Union, we now stand at the threshold of full-scale integration. By allowing Soviet companies broader access to our markets and resources, we can accelerate development and unlock new state-backed projects. Yet with every shipment, contract and joint venture, our economic sovereignty weakens. Arabia grows stronger but more dependent than ever."
 SAU_anti_king_propaganda:0 "Anti-King Propaganda"
 SAU_anti_king_propaganda_desc:0 "For too long, the monarch has cloaked himself in the illusion of legitimacy. Through press, education and public outreach, we will expose the King's role in preserving inequality, enabling foreign control and betraying the revolution. The crown must not only be dismantled it must be discredited in the minds of all citizens."
 SAU_secularize_the_state:0 "Secularize the State"
 SAU_secularize_the_state_desc:0 "To fully commit to socialism, we must build a secular administration. Religious institutions will be separated from state functions, and public policy will be guided by reason, not revelation."
 SAU_exile_the_royal_family:0 "Exile the Royal Family"
 SAU_exile_the_royal_family_desc:0 "The presence of the royal family is a constant threat to the revolution. To avoid internal division or foreign meddling, they will be exiled with dignity if they cooperate, with force if they resist."
 SAU_peaceful_transition:0 "Peaceful Transition"
 SAU_peaceful_transition_desc:0 "Revolution need not always mean bloodshed. With control secured, we shall formalize the transition of power through legal channels, avoiding chaos and presenting our cause as a legitimate evolution, not a coup."
 SAU_implement_new_reforms:0 "Implement New Reforms"
 SAU_implement_new_reforms_desc:0 "Revolution is only the beginning it must be followed by tangible, structural change. From land rights to state planning, a wave of new reforms will reshape Arabia into a modern socialist state."
 SAU_rapid_industrialization:0 "Rapid Industrialization"
 SAU_rapid_industrialization_desc:0 "Time is a luxury we cannot afford. Inspired by our Soviet comrades, we will launch an aggressive industrialization campaign to build factories, infrastructure and the material foundation of socialism."
 SAU_accelerate_the_transition_to_a_regular_army:0 "Transition to Modern Army"
 SAU_accelerate_the_transition_to_a_regular_army_desc:0 "The old army was loyal to kings and tribes not the people. We will rebuild our forces from the ground up: disciplined, modern and ideologically committed to defending the revolution."
 SAU_invite_soviet_advisors:0 "Invite Soviet Advisors"
 SAU_invite_soviet_advisors_desc:0 "To ensure the success of our reforms, we will welcome Soviet experts in governance, economics and defense. Their experience will guide us through this critical phase of transition."
 SAU_revolutionary_army:0 "Revolutionary Army"
 SAU_revolutionary_army_desc:0 "We need more than soldiers we need revolutionaries in uniform. The new army will be ideologically trained, politically loyal and ready to defend the cause of socialism wherever it is threatened."
 SAU_join_comintern:0 "Join the Comintern"
 SAU_join_comintern_desc:0 "The revolution in Arabia is not isolated. By joining the Comintern, we secure solidarity with the international proletariat and stand united against imperialism and reaction."
 SAU_invest_in_the_oil_sector:0 "Invest In the Oil Sector"
 SAU_invest_in_the_oil_sector_desc:0 "Our vast oil reserves must serve the people, not foreign companies or royal families. With state-directed investment, we will modernize extraction and make oil the engine of socialist development."
 SAU_spread_communism_to_arab_states:0 "Spread Communism to Arab States"
 SAU_spread_communism_to_arab_states_desc:0 "Our neighbors still live under monarchs, colonizers and capitalists. It is our duty to support local revolutionaries and build a future where the Arab world is united under the banner of socialism."
 SAU_attack_germany:0 "Attack Germany"
 SAU_attack_germany_desc:0 "Fascism must be opposed everywhere, not just at home. As a socialist state, we will take an active role in the global fight against tyranny and strike directly at its source."
 SAU_paint_the_middle_east_red:0 "Paint the Middle East Red"
 SAU_paint_the_middle_east_red_desc:0 "Arabia is only the beginning. The fire of revolution shall spread across deserts and cities, from Damascus to Cairo, from Baghdad to Sana'a. The Middle East will no longer be divided it will be united in red."
 SAU_execute_the_ulema:0 "Execute the Ulama"
 SAU_execute_the_ulema_desc:0 "The clergy has become a counter-revolutionary force, standing in the way of progress and equality. Their power will be broken not through debate, but through swift and final action."
 SAU_prioritize_education:0 "Prioritize Education"
 SAU_prioritize_education_desc:0 "A true revolution begins in the classroom. We will expand access to education for all, erase illiteracy and cultivate a new generation of skilled, conscious citizens."
 SAU_fully_legalize_unions:0 "Fully Legalize Unions"
 SAU_fully_legalize_unions_desc:0 "Workers must have the right to organize, negotiate and participate in the management of production. Legalizing and empowering unions is a cornerstone of our socialist transformation."
 SAU_soviet_research_agreement:0 "Soviet Research Agreement"
 SAU_soviet_research_agreement_desc:0 "By establishing a formal scientific exchange with the USSR, we gain access to cutting-edge research in industry, medicine and warfare accelerating our own technological advancement."
 SAU_give_women_rights:0 "Give Women Rights"
 SAU_give_women_rights_desc:0 "Women have long been denied agency and dignity under outdated traditions. The revolution must uplift them granting full civil rights and equal participation in public life."
 SAU_allow_women_to_serve_in_the_military:0 "Allow Women to Serve in the Military"
 SAU_allow_women_to_serve_in_the_military_desc:0 "Defense of the revolution is a duty for all. Women will be allowed and encouraged to join the armed forces, proving their strength and loyalty alongside their brothers."
 ####################
 ##### NEW CONS #####
 ####################
 SAU_new_civil_constitution:0 "New Civil Constitution"
 SAU_new_civil_constitution_desc:0 "Our country is getting richer by the day and our relations with western countries are improving, but Sharia law is still the cornerstone of our country. These laws make our country look barbaric in the face of western powers and scare off investors. this cannot continue. we need a new modern and civilized constitution"
 SAU_begin_westernization:0 "Begin Westernization"
 SAU_begin_westernization_desc:0 "Since we've come this far, we need to get rid of this bad identity and start westernization. Maybe it will be a bad choice, we won't know until we move on this way."
 SAU_stick_to_traditions:0 "Stick to Traditions"
 SAU_stick_to_traditions_desc:0 "Modernization does not mean giving up our traditions We are the children of these deserts, we are the loyal servants of Allah, let the westerners recognize us as such"
 SAU_restrain_the_ulama:0 "Restrain the Ulama"
 SAU_restrain_the_ulama_desc:0 "For centuries the Ulema and Arab society have been intertwined, but in the developing world the Ulema stand in the way of our modernization.it's time to take the reins a little"
 SAU_new_economic_plan:0 "New Economic Plan"
 SAU_new_economic_plan_desc:0 "We should create our own plan by taking examples from the economic restructuring plans of other countries and move on to a regular industry."
 SAU_establish_king_saud_university:0 "Establish the King Saud University"
 SAU_establish_king_saud_university_desc:0 "In a world where education is everything, our people are still illiterate. establishing a modern western university in our capital city will be the beginning of development"
 SAU_democratize_the_country:0 "Democratize the Country"
 SAU_democratize_the_country_desc:0 "Democracy is the heart of development and civilization. It is also the most important key to attracting Western investors to our country. We need to tighten the chains of the ulama and democratize our country quickly."
 SAU_build_the_trans_arabian_pipeline:0 "Build the Trans-Arabian Pipeline"
 SAU_build_the_trans_arabian_pipeline_desc:0 "We will construct the Trans-Arabian Pipeline to transport our oil more efficiently. This will connect our oil fields to the Mediterranean, reducing reliance on maritime routes. It is a vital step for our economic independence."
 ####################
 ##### REFORMS ######
 ####################
 SAU_make_reforms_in_the_country:0 "Make Reforms in the Country"
 SAU_make_reforms_in_the_country_desc:0 "To keep pace with the changing world, we must reform our administrative and social structures. Modernization will improve governance, stability, and quality of life for our people. These reforms will lay the groundwork for a stronger and more unified nation."
 SAU_continue_our_economic_reforms:0 "Continue Our Economic Reforms"
 SAU_continue_our_economic_reforms_desc:0 "We must sustain the progress we've made by deepening our economic reforms. Diversifying income sources and modernizing infrastructure will ensure long-term growth. These steps are vital for building a self-reliant and prosperous economy."
 SAU_increase_public_works_budget:0 "Increase Public Works Budget"
 SAU_increase_public_works_budget_desc:0 "Investing more in public works will boost employment and modernize our cities. Infrastructure improvements will connect regions and support economic activity. A stronger public sector means a stronger, more unified nation."
 SAU_decrease_public_works_budget:0 "Decrease Public Works Budget"
 SAU_decrease_public_works_budget_desc:0 "To ensure financial stability, we must reduce excessive public spending. Focusing resources on priority areas will make our economy more efficient. Discipline today will secure prosperity tomorrow."
 SAU_build_new_mines:0 "Build New Mines"
 SAU_build_new_mines_desc:0 "Expanding our mining operations will unlock valuable natural resources. This will boost industrial growth and create jobs across the country. A strong mining sector strengthens the foundations of our economy."
 SAU_establish_new_ministries:0 "Establish New Ministries"
 SAU_establish_new_ministries_desc:0 "Creating new ministries will improve administrative efficiency and governance. Each ministry will focus on specialized areas to serve the nation better. This step is key to a more organized and responsive state."
 SAU_deal_with_tribes:0 "Deal with Tribes"
 SAU_deal_with_tribes_desc:0 "Maintaining harmony with the tribes is essential for national unity. Through negotiation and inclusion, we will secure their loyalty and cooperation. A united kingdom must respect and integrate all its people."
 SAU_strengthen_the_regime:0 "Strengthen the Regime"
 SAU_strengthen_the_regime_desc:0 "To ensure long-term stability, we must reinforce the foundations of our rule. Loyal institutions and firm leadership will protect the state from internal threats. A strong regime guarantees a strong and enduring nation."
 SAU_alexandria_protocol:0 "[GetProtocolCityName] Protocol"
 SAU_alexandria_protocol_desc:0 "As tensions rise across the globe, unity among Arab nations is no longer a dream it is a necessity. By proposing the [GetProtocolCityName] Protocol, we aim to lay the foundation for a new regional order rooted in mutual defense, shared identity, and economic cooperation. If accepted, this agreement will elevate our role from one of survival to leadership."
 SAU_expand_the_mabahith:0 "Expand the Mabahith"
 SAU_expand_the_mabahith_desc:0 "Strengthening internal security is vital for preserving order and sovereignty. An expanded Mabahith will help detect threats and enforce national stability. Security is the backbone of a functioning and respected state."
 SAU_reform_the_army:0 "Reform the Army"
 SAU_reform_the_army_desc:0 "To face modern challenges, our army must be restructured and re-equipped. Training, discipline, and leadership will be the core of this transformation. A modern army is essential for defending our nation and asserting our strength."
 SAU_deterrence:0 "Deterrence"
 SAU_deterrence_desc:0 "A strong and well-prepared military will discourage any aggression against us. By demonstrating our capabilities, we protect our sovereignty without conflict. Deterrence ensures peace through strength and readiness."
 SAU_prepare_for_the_inevitable:0 "Prepare for the Inevitable"
 SAU_prepare_for_the_inevitable_desc:0 "We must anticipate future conflicts and ready our forces accordingly. Strategic planning and resource allocation are essential for success. Being prepared ensures our survival and the defense of our homeland."
 SAU_establish_military_industries_corporation:0 "Establish Military Industries Corporation"
 SAU_establish_military_industries_corporation_desc:0 "Creating a domestic military industry will reduce our dependence on foreign powers. It will enable us to produce weapons and equipment tailored to our needs. Building this foundation is crucial for a self-sufficient and resilient defense."

 SAU_attract_people_to_hajj:0 "Attract People to Hajj"
 SAU_attract_people_to_hajj_desc:0 "Encouraging pilgrims to visit will strengthen our spiritual leadership and economy. Improving facilities and security ensures a safe and meaningful experience for all. Hajj unites Muslims and showcases our role as guardians of the holy sites."
 SAU_influence_the_politics_of_our_neighbors:0 "Influence the Politics of Our Neighbors"
 SAU_influence_the_politics_of_our_neighbors_desc:0 "Engaging with neighboring states will help secure our regional interests. Diplomatic efforts can foster stability and cooperation on shared challenges. A proactive approach strengthens our position and protects our borders."

 SAU_modernize_the_country:0 "Modernize the Country"
 SAU_modernize_the_country_desc:0 "Advancing infrastructure and industry is essential for our nation's growth. We must embrace new technologies and reforms to improve daily life. Modernization will secure a prosperous future for all our people."
 SAU_expel_sharia_laws:0 "Expel Sharia Laws"
 SAU_expel_sharia_laws_desc:0 "In pursuit of modernization, we must remove Sharia laws from our legal system. Though challenging, this change aims to align us with Western standards and progress. This difficult path is necessary to transform our nation's future."
 SAU_promote_free_speech:0 "Promote Free Speech"
 SAU_promote_free_speech_desc:0 "Encouraging open dialogue is key to a vibrant and progressive society. Allowing diverse opinions fosters innovation and unity among our people. Free speech empowers citizens and strengthens our national identity."
 SAU_prioritize_research_efforts:0 "Prioritize Research Efforts"
 SAU_prioritize_research_efforts_desc:0 "Focusing on research and development will drive our nation's progress. Investing in innovation helps solve challenges and build a stronger future. Scientific advancement is the foundation of lasting prosperity."
 ####################
 ##### FLEXIBLE #####
 ####################
 SAU_flexible_foreign_policy:0 "Flexible Foreign Policy"
 SAU_flexible_foreign_policy_desc:0 "Adapting our approach to international relations ensures stability and opportunity. By balancing interests, we can protect our sovereignty and foster partnerships. A flexible policy allows us to navigate changing global dynamics effectively."
 SAU_arabia_before_all:0 "Arabia Before All"
 SAU_arabia_before_all_desc:0 "The world grows ever more volatile, and old alliances fade while new powers rise. At such a time, we must remember who we are and what we stand for. Arabia shall not be a pawn in foreign games our destiny must serve no one but ourselves. From this foundation, we will decide our path: to stand alone, or to walk alongside others who share our interests."
 #PEACE
 SAU_maintain_neutrality:0 "Peace Within Our Borders"
 SAU_maintain_neutrality_desc:0 "Why do we fight and hurt each other? while there is peace and tranquility in this mortal world. That's why we must remain neutral."
 SAU_why_we_fight:0 "Why We Fight"
 SAU_why_we_fight_desc:0 "We have fortified our borders to protect our nation's integrity. Now, we must clearly demonstrate our commitment to neutrality in this conflict. Maintaining peace safeguards our people and preserves our future."
 SAU_technology_sharing:0 "Technology Sharing"
 SAU_technology_sharing_desc:0 "Collaborating with allies allows us to access new technologies and expertise. Sharing innovations strengthens our defense and economic capabilities. Together, we build a more advanced and resilient nation."
 SAU_build_new_fortresses:0 "Build New Fortresses"
 SAU_build_new_fortresses_desc:0 "Constructing new fortresses will strengthen our defensive positions. These strongholds protect key regions and deter potential threats. A robust defense ensures the safety and stability of our nation."
 SAU_protector_of_holy_states:0 "Protector of Holy States"
 SAU_protector_of_holy_states_desc:0 "We hold the sacred duty to safeguard the holy sites in our lands. Protecting these places honors our heritage and unites our people. Our commitment strengthens our position as leaders of the Muslim world."
 #AXIS
 SAU_join_the_axis:0 "Join the Axis"
 SAU_join_the_axis_desc:0 "They must understand that our ambitions extend beyond the lands we hold. By joining the Axis, we align with powerful allies to challenge our common enemies. Together, we will defeat the British and secure our rightful place in the world."
 SAU_nationalize_key_industries:0 "Nationalize Key Industries"
 SAU_nationalize_key_industries_desc:0 "Taking control of vital industries will strengthen our economic independence. This move allows us to direct resources toward national development priorities. A strong economy is essential for our sovereignty and future growth."
 SAU_german_economic_model:0 "German Economic Model"
 SAU_german_economic_model_desc:0 "Adopting the German economic model can help us modernize our industry efficiently. Their focus on planning and state support offers valuable lessons for our growth. Implementing these strategies will strengthen our economy and workforce."
 SAU_study_the_blitzkrieg:0 "Study the Blitzkrieg"
 SAU_study_the_blitzkrieg_desc:0 "Understanding the Blitzkrieg tactics will improve our military effectiveness. Speed and coordination are key to overcoming stronger enemies quickly. Adopting these methods will prepare our forces for modern warfare."
 SAU_invite_amin_al_husseini:0 "Coordinate with the Grand Mufti"
 SAU_invite_amin_al_husseini_desc:0 "Welcoming Amin al-Husseini will strengthen ties with influential religious leaders. His support can help unify Muslim communities under our guidance. Together we can wake up the Arabs"
 SAU_encourage_revolt_in_palestine:0 "Jerusalem is in Our Eyes"
 SAU_encourage_revolt_in_palestine_desc:0 "The liberation of Palestine from foreign hands is our solemn duty. Jerusalem, the heart of our faith, must be protected and restored to its rightful place. We stand united in preserving our sacred heritage for generations to come."
 SAU_militarize_the_economy:0 "Militarize the Economy"
 SAU_militarize_the_economy_desc:0 "We must mobilize our economy to arm ourselves and defend all Arab lands. Strengthening our military industry is essential to protect our people and heritage. A powerful armed force will ensure the liberation and unity of the Arab world."
 SAU_joint_military_training:0 "Joint Military Training"
 SAU_joint_military_training_desc:0 "With our alliance with Germany formalized, it is vital that our forces learn from their experience. Through coordinated drills, shared doctrine and officer exchanges, we can modernize our military structure and bring our soldiers up to Axis standards."
 SAU_invite_more_german_companies:0 "Invite More German Companies"
 SAU_invite_more_german_companies_desc:0 "German firms have shown great interest in the development potential of our infrastructure and industry. By opening our doors wider to their investment, we gain not only equipment and capital, but also valuable know-how essential for war and reconstruction alike."
 SAU_take_control_of_the_suez_canal:0 "Take Control of the Suez Canal"
 SAU_take_control_of_the_suez_canal_desc:0 "The Suez Canal is more than a passage it is the artery of empire. By seizing control of this vital chokepoint, we strike a blow to British hegemony and open the gates of strategic dominance to the Axis cause in the Middle East and Africa."
 SAU_pan_arabist_policies:0 "Pan-Arabist Policies"
 SAU_pan_arabist_policies_desc:0 "In these times of upheaval, the idea of a united Arab world under a single vision resonates stronger than ever. By promoting pan-Arabist values under Axis guidance, we position ourselves as the vanguard of regional revolution and guardians of Arab destiny."
 SAU_form_the_arab_liberation_army:0 "Form the Arab Liberation Army"
 SAU_form_the_arab_liberation_army_desc:0 "With the Arab world fragmented and occupied, there is a need for a unified military force capable of liberating our lands. The Arab Liberation Army will rally fighters from across the region trained, armed and directed under our command."
 SAU_desert_panzers:0 "Desert Panzers"
 SAU_desert_panzers_desc:0 "Desert warfare demands unique tactics and machines. With German engineers and tactical insight at our disposal, we are developing specialized armored divisions capable of maneuvering swiftly across the dunes. The sands shall tremble under steel."
 #Common
 SAU_spread_islam:0 "Spread Islam"
 SAU_spread_islam_desc:0 "As the Custodian of the Two Holy Mosques, it is our duty to guide the Islamic world spiritually and morally. By supporting Islamic movements abroad, we can extend our influence far beyond our borders and counter secular and colonial ideologies."
 SAU_expand_mabahith_jurisdiction:0 "Expand Mabahith's Jurisdiction"
 SAU_expand_mabahith_jurisdiction_desc:0 "The General Investigation Directorate — the Mabahith serves as our eyes and ears in a volatile region. By expanding their jurisdiction, we can ensure internal stability, monitor dissent, and uphold the kingdom's religious and political order."
 SAU_invite_jews:0 "Provide Shelter for the Jews"
 SAU_invite_jews_desc:0 "Though tensions across the region run high, we recognize the humanity of those fleeing war and persecution. Offering shelter to Jewish refugees demonstrates our sovereignty, morality, and readiness to act independently of imperial dictates."
 SAU_send_the_mujahideen_to_war:0 "Send the Mujahideen to War"
 SAU_send_the_mujahideen_to_war_desc:0 "Our fighters do not serve just a nation they fight for faith. The Mujahideen will be sent to battle in defense of Islam and Arab identity, striking where our army cannot. They are a symbol of divine purpose wielded by earthly hands."
 SAU_invite_foreign_scientists:0 "Invite Foreign Scientists"
 SAU_invite_foreign_scientists_desc:0 "We must not fear knowledge only what it may become without faith. By selectively inviting trusted foreign scholars and engineers, we can modernize our institutions while ensuring that science serves tradition, not subverts it."
 SAU_change_the_royal_style:0 "Change the Royal Style"
 SAU_change_the_royal_style_desc:0 "With our regional prestige rising and the foundations of the Kingdom solidified, it is time to reform how we present our monarchy to the world. A new royal style one steeped in faith and authority will strengthen both our internal legitimacy and international recognition."
 ####################
 ##### WEST WAY #####
 ####################
 SAU_move_closer_to_the_west:0 "Move Closer to the West"
 SAU_move_closer_to_the_west_desc:0 "As threats grow on all sides, aligning ourselves more closely with the Western democracies offers a path to security, trade and modernization. By taking the first diplomatic steps, we open the door to cooperation with powers who share an interest in regional stability."
 SAU_unite_aganist_tyranny:0 "Unite Aganist Tyranny"
 SAU_unite_aganist_tyranny_desc:0 "Authoritarian regimes have no place in a free and just Middle East. By uniting with nations that oppose fascism and totalitarianism, we take a principled stand and one that ensures our survival and influence in the postwar world."
 SAU_establish_arab_legions:0 "Establish Arab Legion"
 SAU_establish_arab_legions_desc:0 "To effectively contribute to the Allied war effort, we must raise a capable and organized military force. The Arab Legion will be the sword of the Kingdom - a modern, trained and loyal army ready to defend freedom across the region."
 SAU_anti_fascist_crescent:0 "The Anti-Fascist Crescent"
 SAU_anti_fascist_crescent_desc:0 "Our resistance to fascism must extend beyond our borders. By building an alliance of like-minded Arab nations, we form a crescent of solidarity that can shield the region from tyranny and foreign domination."
 SAU_secure_middle_east:0 "Secure Middle East"
 SAU_secure_middle_east_desc:0 "Fascist ideologies creeping into the Middle East threaten our sovereignty and the entire Allied effort. We must take the initiative to purge the region of such regimes by force if necessary."
 SAU_the_war_against_communism:0 "The War Against Communism"
 SAU_the_war_against_communism_desc:0 "Just as we oppose fascism, we reject the materialist dogma of communism. By eliminating communist influence from the Middle East, we protect our traditions, our allies and our future."
 SAU_liberate_our_arab_brothers:0 "Liberate our Arab Brothers"
 SAU_liberate_our_arab_brothers_desc:0 "Many Arab peoples remain under the yoke of foreign control or illegitimate regimes. It is our duty and right to lead their liberation and guide them toward unity, peace and partnership under our shared heritage."
 SAU_increase_oil_exports:0 "Increase Oil Exports"
 SAU_increase_oil_exports_desc:0 "Oil is our greatest strategic asset. By ramping up exports to Allied nations, we can secure their support and fuel their war machines while strengthening our own economic foundations."
 SAU_invite_foreign_companies:0 "Invite Foreign Companies"
 SAU_invite_foreign_companies_desc:0 "By welcoming reputable French and British firms into our markets, we gain access to superior equipment, expertise and capital accelerating the modernization of our infrastructure and industry."
 SAU_protect_the_bab_el_mandeb:0 "Protect the Bab-el-Mandeb"
 SAU_protect_the_bab_el_mandeb_desc:0 "The Bab-el-Mandeb strait is a strategic chokepoint between the Red Sea and the Arabian Sea. We must ensure it remains under neutral or friendly control. Should that neutrality be compromised, we must be prepared to act decisively."
 SAU_secret_pact_with_allies:0 "Secret Pact with the Allies"
 SAU_secret_pact_with_allies_desc:0 "Officially, we remain outside the alliance but in the shadows, a pact has been made. Should war reach our borders, the Allies will intervene immediately. It is a quiet promise, forged in necessity."
 SAU_offer_the_us_use_of_our_military_bases:0 "Offer the US Use of Our Military Bases"
 SAU_offer_the_us_use_of_our_military_bases_desc:0 "In exchange for strategic protection and technological aid, we offer the United States access to key airfields and bases across our territory. A shared presence in Arabia strengthens both our positions in the region."
 SAU_request_protection_from_the_united_states:0 "Request Protection from the United States"
 SAU_request_protection_from_the_united_states_desc:0 "Surrounded by rising threats, we turn to the United States for security guarantees. With American support, we can deter aggression and ensure the kingdom's continued independence through mutual trust and cooperation."
 SAU_creation_of_rdjtf:0 "Establishment of the RDJTF"
 SAU_creation_of_rdjtf_desc:0 "With increasing instability in the region, the United States and our kingdom have jointly formed a rapid deployment force capable of responding to emergencies across the Middle East. This task force is a symbol of our strategic alliance and a deterrent to all who would threaten peace."
