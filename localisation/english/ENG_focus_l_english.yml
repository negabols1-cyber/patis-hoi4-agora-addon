l_english:
 ENG_scottish_king_lose_core_tt:0 "§R$ENG_protests_modifier$§! modifier will be added all states in the §YEngland region§!."
 ENG_found_a_new_king:0 "Find a New King"
 ENG_found_a_new_king_desc:0 "Edward should not take the throne. Also, we cannot give up this authoritarian regime, so we must find a new king and ensure that he is accepted among our people with his supporters."
 ENG_the_german_crown:0 "The German Crown"
 ENG_the_german_crown_desc:0 "The British Isles no longer stand alone. In a moment that will reshape the monarchy, a [ENG_ROYAL_TITLE] of German blood has ascended to the throne. Though questions linger and murmurs of dissent echo, the legitimacy of this new sovereign may forge a path to restored unity—or deepen the divide."
 ENG_reconcile_the_realm: "Reconcile the Realm"
 ENG_reconcile_the_realm_desc: "The wounds of succession and division run deep. By mending the fractured loyalties within the kingdom, we will solidify internal support for the new monarch and restore public faith in the throne."
 ENG_restore_royal_authority:0 "Restore Royal Authority"
 ENG_restore_royal_authority_desc:0 "Royal influence has waned in the modern era, but it is not beyond recovery. Through decisive leadership and careful restructuring, we shall reassert the power of the monarchy over the machinery of state."
 ENG_secure_the_industrialists:0 "Secure the Industrialists"
 ENG_secure_the_industrialists_desc:0 "No modern monarchy can stand without the engines of industry behind it. The titans of production must be brought into the fold—not by decree, but by partnership and promise of stability under royal oversight."
 ENG_the_kings_economic_vision:0 "The King's Economic Vision"
 ENG_the_kings_economic_vision_desc:0 "With a firm hand and a clear mind, the King lays out his economic blueprint — a path of industrial modernization, balanced development and royal oversight to secure prosperity for the realm."
 ENG_curtail_republican_opposition:0 "Curtail Republican Opposition"
 ENG_curtail_republican_opposition_desc:0 "Though the republicans grow louder, they remain but a passing storm. With careful legislative pressure and subtle influence, their networks will be dismantled without igniting open conflict."
 ENG_the_kings_parliament:0 "The King's Parliament"
 ENG_the_kings_parliament_desc:0 "Parliament is restructured to better reflect the King's vision — traditional values, loyal representatives and stability over chaos. Though elections continue, the outcome will never threaten the crown."
 ENG_a_crown_for_a_new_era:0 "A Crown For A New Era"
 ENG_a_crown_for_a_new_era_desc:0 "The King's rule is not a relic of the past, but a beacon for the future. Britain shall enter the modern age with regal pride, draped not in decay, but in purpose."
 ENG_modernize_the_royal_army:0 "Modernize the Royal Army"
 ENG_modernize_the_royal_army_desc:0 "The Royal Army must adapt to the times — better training, updated doctrine and modern equipment, all under the crown’s watchful eye. The sword of the monarchy must be sharp and swift."
 ENG_claim_the_highland_crown:0 "Claim the Highland Crown"
 ENG_claim_the_highland_crown_desc:0 "The throne stands empty, but the north remembers its own. With James Graham at the helm, we assert rightful rule over the highlands and a vision of a stable future beyond Westminster’s collapse."
 ENG_imperial_compromise:0 "Imperial Compromise"
 ENG_imperial_compromise_desc:0 "While Germany may have strayed far from its imperial roots, not all of its people have abandoned the Crown. By welcoming exiled monarchists, former courtiers and loyal officers — we can enrich our state with their expertise and deepen our commitment to a shared royal legacy."
 ENG_revive_the_royal_navy:0 "Revive the Royal Navy"
 ENG_revive_the_royal_navy_desc:0 "Once the mistress of the seas, the Royal Navy has grown complacent. Under royal directive, its fleets shall be renewed — sleek, deadly and worthy of an empire reborn."
 ENG_support_the_church:0 "Support the Church"
 ENG_support_the_church_desc:0 "In times of change, the people seek moral guidance. By reaffirming the alliance between the Crown and the Church, the nation’s spiritual soul is safeguarded."
 ENG_aproach_wilhelmina:0 "Approach Wilhelmina"
 ENG_aproach_wilhelmina_desc:0 "Queen Wilhelmina has long resisted German dominance. A discreet offer is made: join our righteous cause, and in unity we shall strike at the Reich's grip on Europe."
 ENG_ally_with_france:0 "Ally with France"
 ENG_ally_with_france_desc:0 "The days of rivalry are long gone. In the face of German aggression, Britain and France must unite once more — not out of sentiment, but out of necessity."
 ENG_disunite_germany:0 "Disunite Germany"
 ENG_disunite_germany_desc:0 "Germany has grown too powerful, too centralized. We shall fracture it into smaller, weaker states — restoring the natural balance of Europe and ensuring peace through division."
 ENG_claim_remaining_imperial_lands:0 "Claim the Remaining Imperial Lands"
 ENG_claim_remaining_imperial_lands_desc:0 "With much of the Holy Roman Empire’s heartland now under our control, only scattered fragments remain in the hands of foreign states. By asserting our historical rights and applying diplomatic pressure, we can bring the last vestiges of the Empire into the fold—either through compliance or by other means."
 ENG_imperial_shadow_over_europe:0 "Imperial Shadow Over Europe"
 ENG_imperial_shadow_over_europe_desc:0 "With Germany broken and our influence restored, Britain casts its imperial shadow once more. From Paris to Warsaw, the fate of Europe bends toward the crown’s will."
 ENG_rescue_the_deutschamerikaner:0 "Rescue the Deutschamerikaner"
 ENG_rescue_the_deutschamerikaner_desc:0 "Across the Atlantic, in the heart of the United States, lives a vibrant community of German-Americans — the Deutschamerikaner. For too long, their heritage has been neglected, their voices drowned in the melting pot of the New World. Our duty as the rightful protector of all Germans does not end at Europe’s shores. By extending our hand, we shall offer them the protection, pride and unity they deserve. Should the American government resist, we will bring them to heel, ensuring that the Deutschamerikaner are restored to their rightful place under the guiding light of our empire."
 ENG_tighten_the_imperial_bonds:0 "Tighten the Imperial Bonds"
 ENG_tighten_the_imperial_bonds_desc:0 "What began as a diplomatic partnership is maturing into a deeper, structured alliance. Bilateral advisory groups, interlinked policy forums and royal correspondence are all signs of a bond no longer merely political — but dynastic."
 ENG_joint_military_exercises:0 "Joint Military Exercises"
 ENG_joint_military_exercises_desc:0 "To strengthen our strategic coordination and bolster mutual trust, joint military exercises with the German Army will be conducted across multiple theatres. Our officers will learn from theirs and vice versa — a foundation for a durable alliance."
 ENG_review_military_landing_tactics:0 "Review Military Landing Tactics"
 ENG_review_military_landing_tactics_desc:0 "Lessons drawn from recent exercises — especially Germany’s experience with continental warfare — offer vital insight for improving our naval landing procedures. Preparing for future operations across the Channel or beyond is now a priority."
 ENG_mutual_economic_pact:0 "Mutual Economic Pact"
 ENG_mutual_economic_pact_desc:0 "Shared interests require shared prosperity. A formal economic pact with Germany will ensure resource stability, preferential trade and co-development in key industrial sectors. Linking our economies under the banner of monarchist cooperation."
 ENG_proclaim_a_dual_monarchy:0 "Proclaim A Dual Monarchy"
 ENG_proclaim_a_dual_monarchy_desc:0 "The time has come to propose a union more profound than mere alliance. We will extend a formal invitation to the German Crown: a Dual Monarchy — united in sovereignty, divided in realms. If accepted, Britain will stand alongside Germany under a single, shared crown."
 ENG_germanization_of_britain:0 "Germanization of Britain"
 ENG_germanization_of_britain_desc:0 "As ties with Germany deepen, the cultural landscape shifts. Names change, language adapts and the echoes of a Teutonic past emerge across the British Isles."
 ENG_crusade_against_bolshevism:0 "Crusade Against Bolshevism"
 ENG_crusade_against_bolshevism_desc:0 "The ideological threat posed by the Soviet Union endangers all monarchies, traditions and national sovereignties across Europe. Together with our German allies, we shall coordinate military operations to strike at the heart of Bolshevism. The banner of the Dual Monarchy shall not remain idle while tyrants seek to export revolution through fire and steel."
 ENG_order_in_the_lowlands:0 "Order in the Lowlands"
 ENG_order_in_the_lowlands_desc:0 "Unrest brews in the south, fueled by uncertainty and old loyalties. It's time to restore stability and assert authority across the lowlands before chaos spreads further."
 ENG_restore_national_unity:0 "Restore National Unity"
 ENG_restore_national_unity_desc:0 "The collapse of the old order left scars not only on borders but also in minds. Many regions now view our rule with uncertainty or rejection. Through outreach, reforms and public campaigns, we will rebuild trust and bring these lands fully back into the fold."
 ENG_convene_the_royal_cabinet:0 "Convene the Royal Cabinet"
 ENG_convene_the_royal_cabinet_desc:0 "The first step toward restoring the Empire lies in reorganizing the government around the new monarch. Loyal ministers and capable advisors will be the backbone of royal rule."
 ENG_reorganize_the_home_guard:0 "Reorganize the Home Guard"
 ENG_reorganize_the_home_guard_desc:0 "The Home Guard has long served as a symbol of local resilience, but its structure is outdated and uneven across the realm. With new royal leadership and growing international threats, it is time to transform this civilian force into a coherent, regionally integrated defense apparatus — one that can respond swiftly to unrest at home or invasion from abroad."
 ENG_proclaim_new_union:0 "Proclaim a New Union"
 ENG_proclaim_new_union_desc:0 "With both highlands and lowlands under one banner, the time has come to announce a new order. A Britain rebuilt not through dominance, but through shared governance and renewed legitimacy."
 ENG_forge_northern_heartland:0 "Forge the Northern Heartland"
 ENG_forge_northern_heartland_desc:0 "We shall rebuild the Highlands and Lowlands alike, investing in the means of self-defense. Let the north become the forge of our army."
 ENG_reorganize_the_royal_army:0 "Reorganize the Royal Army"
 ENG_reorganize_the_royal_army_desc:0 "Years of neglect, outdated doctrine and fragmented command have left the Royal Army ill-prepared for the challenges ahead. We must undertake a full-scale reorganization—streamlining our hierarchy, modernizing our tactics and ensuring our forces are trained, equipped and ready to fight as one."
 ENG_masters_of_the_highlands:0 "Masters of the Highlands"
 ENG_masters_of_the_highlands_desc:0 "The rugged Highlands have long bred warriors of unmatched resilience and cunning. By honing the skills of our mountain troops, we ensure that every glen, crag and mist-shrouded pass becomes a fortress in its own right. Enemies who dare to venture into our high country will find themselves battling not only our soldiers, but the very land itself."
 ENG_pioneer_of_the_seas:0 "Pioneer of the Seas"
 ENG_pioneer_of_the_seas_desc:0 "With King James Graham, at the helm of our nation, Britain finds itself guided by a ruler whose vision reaches far beyond the throne room. Known for his pioneering work on the world’s first aircraft carrier, His Majesty now directs that same innovative spirit toward the expansion and modernization of our navy. Under his command, our dockyards work at unprecedented pace, and our naval strategists embrace the future of warfare—ensuring that Britannia shall rule not only the waves, but the skies above them."
 ENG_militarize_the_economy:0 "Militarize the Economy"
 ENG_militarize_the_economy_desc:0 "The age of peace is behind us and the demands of modern conflict grow more urgent by the day. Civilian production must give way to strategic output — steel, arms and machines of war. We will convert workshops and factories across the nation to serve the needs of our growing army."
 ENG_celtic_imperialism:0 "Scottish Imperialism"
 ENG_celtic_imperialism_desc:0 "No longer shall the Scottish peoples be relegated to the margins of Europe. With the old imperial powers weakened, it is our time to rise — to project strength, reclaim lost glory and shape a future guided by a distinctly Scottish vision of unity and dominance."
 ENG_officer_emperor:0 "Officer Emperor"
 ENG_officer_emperor_desc:0 "A man of discipline, forged not in palace halls but in naval steel and salt wind, now sits upon the throne. He does not rule through divine right or inherited grandeur — but through command, order and merit. Under his reign, the Crown is no longer passive — it commands, it dictates, it leads."
 ENG_securing_the_supply_lines:0 "Securing the Supply Lines"
 ENG_securing_the_supply_lines_desc:0 "Wars are not won by soldiers alone, but by the steady flow of food, fuel and ammunition to the front. We must fortify our logistical networks, protect our convoys, and ensure that no enemy action can sever our lifeline to victory."
 ENG_restore_control_over_ireland:0 "Reclaim Ireland"
 ENG_restore_control_over_ireland_desc:0 "Ireland is not a foreign land — it is our blood, our history and our rightful kin. Divided by colonial legacies and fractured by war, the Emerald Isle must be made whole again, under a common Scottish destiny."
 ENG_north_sea_strategy:0 "North Sea Strategy"
 ENG_north_sea_strategy_desc:0 "King James Graham, a monarch of both Scottish heritage and British authority, envisions the restoration of a northern thalassocracy—a realm bound not by land, but by the waters of the North Sea. By focusing our efforts on the maritime sphere, we can turn this once-contested sea into the beating heart of our empire."
 ENG_war_with_denmark:0 "War with Denmark"
 ENG_war_with_denmark_desc:0 "Diplomacy has run its course. We will prepare a formal justification and move to annex [DEN.GetNameDef]. Control of the Øresund and the Danish isles is essential to the North Sea order we intend to build."
 ENG_union_with_denmark:0 "Offer Personal Union to Denmark"
 ENG_union_with_denmark_desc:0 "His Majesty extends a royal proposal to Copenhagen: a personal union under the Northern Crown. Acceptance will spare bloodshed and place our crowns in tandem—retaining [DEN.GetAdjective] institutions while aligning foreign policy and command. Should they refuse, our claim will be pressed by right of arms."
 ENG_war_with_norway:0 "War with Norway"
 ENG_war_with_norway_desc:0 "The fjords and northern coasts must be secured. We will seek no half-measures: an outright annexation wargoal against [NOR.GetNameDef] will be prepared, ensuring bases and lanes required for the North Sea Empire."
 ENG_union_with_norway:0 "Offer Personal Union to Norway"
 ENG_union_with_norway_desc:0 "Bound by shared northern heritage and maritime interest, we invite [NOR.GetNameDef] to unite crowns peacefully. Acceptance will see their realm governed locally under our dynasty; refusal will trigger our rightful claim to bring order to the northern approaches."
 ENG_proclaim_north_sea_empire:0 "Proclaim the North Sea Empire"
 ENG_proclaim_north_sea_empire_desc:0 "Whether by peaceful union or decisive war, the shores of the North Sea answer to one crown. We shall formalize this reality and declare the North Sea Empire—an order of ships, trade and law under His Majesty’s hand."
 ENG_fortress_of_the_north:0 "Fortress of the North"
 ENG_fortress_of_the_north_desc:0 "Our empire stands at the mercy of the sea’s storms and the ambitions of rival powers. We will transform our ports into bastions, our coasts into fortresses, and our fleets into impenetrable shields against all who would dare challenge the Emperor’s domain."
 ENG_break_the_swedish_hold:0 "Break the Swedish Hold"
 ENG_break_the_swedish_hold_desc:0 "For too long, Sweden has maintained its grip over the northern reaches of the Baltic, projecting its power across the sea and challenging our influence in Scandinavia. Now, under the steadfast leadership of King James Graham, we will shatter this northern stronghold once and for all. Our fleets will dominate the icy waters, our armies will land upon Swedish shores, and the balance of power in the North shall tilt decisively in our favor."
 ENG_integrate_the_realms:0 "Integrate the Realms"
 ENG_integrate_the_realms_desc:0 "Annexation brings burdens: divergent laws, taxes and loyalties. We will undertake a patient program of administration, infrastructure and cultural accommodation. Integration will be demanding and slow, but it will transform possessions into provinces and subjects into citizens."
 ENG_pan_celtic_campaign:0 "Pan-Celtic Campaign"
 ENG_pan_celtic_campaign_desc:0 "The old empires crumbled, but the bonds of blood, language and history endure. It is time to unite the Celtic peoples under one banner — not as subjects, but as brothers in a shared destiny. From the hills of Wales to the valleys of Brittany, the fires of unity are rekindled."
 ENG_demand_belgium:0 "Demand Belgium"
 ENG_demand_belgium_desc:0 "By sending an ultimatum to small countries like Belgium, we can get them out of the way. There is no need to fight for these little lands in vain. If their answer is no then we can think about it."
 ENG_attack_iberia:0 "Attack Iberia"
 ENG_attack_iberia_desc:0 "Iberia is one of the regions that can prevent us, so we have to eliminate them first."
 ENG_campaign_through_the_alps:0 "Campaign Through the Alps"
 ENG_campaign_through_the_alps_desc:0 "The towering Alps have long served as a natural wall between north and south, but no mountain shall stand before Celtic ambition. Whether for security or supremacy, we must break through Switzerland’s defenses and dominate the passes that shape Europe’s fate."
 ENG_return_of_celts:0 "Return of Celts"
 ENG_return_of_celts_desc:0 "Europe believed the Celts lost to time — fractured, assimilated, forgotten. But we have returned. Not in chains or in folklore, but with banners high and armies proud. This is not a revival. This is our ascendance."
 ENG_strike_at_the_gallic_heartland:0 "Strike at the Gallic Heartland"
 ENG_strike_at_the_gallic_heartland_desc:0 "France — the ancient neighbor and occasional oppressor stands weakened and divided. The path into the Gallic heart is open. A swift campaign will shatter their illusions of stability and secure our western flank."
 ENG_peaceful_crown:0 "The Peaceful Crown"
 ENG_peaceful_crown_desc:0 "Victory does not always lie through war. We shall build a stable and self-reliant kingdom, rooted in mutual respect, history and a dignified sovereignty."
 ENG_reformist_king:0 "Reformist King"
 ENG_reformist_king_desc:0 "King James Graham is not a ruler of empty tradition — he stands as a symbol of thoughtful reform. Under his guidance, the monarchy seeks not to restore the old, but to reshape the future: progressive, constitutional and grounded in the will of the people."
 ENG_invest_in_education:0 "Invest in Education"
 ENG_invest_in_education_desc:0 "We will enrich our education system with a renewed focus on history, language and regional identity, cultivating citizens who understand their place in the world and their heritage."
 ENG_prioritize_research_programs:0 "Regional Research Initiatives"
 ENG_prioritize_research_programs_desc:0 "Modern science and industry must be encouraged if we are to remain sovereign. We shall build centers of research and innovation to carry our people into a prosperous future."
 ENG_bridging_the_isles:0 "Bridging the Isles"
 ENG_bridging_the_isles_desc:0 "Now guided by a new monarch of Scottish heritage, our realm seeks to lead not through dominance, but through diplomacy. By offering dominion status to Ireland, we aim to build a stable, respectful union across the British Isles — one rooted in mutual security, self-determination and a shared future beyond the shadows of empire."
 ENG_crown_of_the_isles:0 "A Renewed Monarchy"
 ENG_crown_of_the_isles_desc:0 "Our reign is no longer a relic of empire — it is a reflection of a new Britain: dignified, stable and forward-looking. Let this crown represent the will of the people and the unity we have restored."
 ENG_deterrent_rearmament:0 "Deterrent Rearmament"
 ENG_deterrent_rearmament_desc:0 "We will undertake a measured and transparent strengthening of our defensive forces to create a credible deterrent that serves peace. This programme prioritises fortification-supporting artillery, mobile anti-landing units, logistics and reserve mobilization rather than expensive power projection. The aim is clear: to make aggression against us a risky proposition for any actor while preserving our posture as a champion of negotiated settlements. The deterrent is intended to buttress diplomacy — not replace it — by ensuring our calls for peace are backed by the means to enforce it if necessary."
 ENG_call_for_european_peace:0 "Call for European Peace"
 ENG_call_for_european_peace_desc:0 "The time has come to reach out to the warring nations of Europe with a clear and resolute call for peace. Through tireless diplomacy, royal influence and the promise of security under our watch, we will invite all nations to the table—not merely to discuss peace, but to commit to it. By appealing to their people and leaders alike, we aim to weave a network of understanding and non-aggression that will endure for generations."
 ENG_imperial_conscription2:1 "Imperial Conscription"
 ENG_imperial_conscription2_desc:1 "We have long neglected the wealth of manpower our Empire provides. It is time we drastically improve conscription throughout the Empire, and ensure that we have an abundance of manpower to fight our war. All must do their duty to the Crown!"
 ENG_reclaim_the_imperial_mandate:0 "Reclaim the Imperial Mandate"
 ENG_reclaim_the_imperial_mandate_desc:0 "With the throne secure, we must now remind the world that our sovereignty extends beyond these islands. The legacy of empire does not fade so easily—we are ready to reclaim what was once ours."
 ENG_restore_imperial_prerogatives:0 "Restore the Imperial Prerogatives"
 ENG_restore_imperial_prerogatives_desc:0 "The old balance of power favored Parliament far too heavily. Under the new reign, we must reestablish the executive authority of the crown in both civil and military matters."
 ENG_consolidate_the_loyal_dominions:0 "Consolidate the Loyal Dominions"
 ENG_consolidate_the_loyal_dominions_desc:0 "While some former dominions have chosen to walk away from the Crown, others remain steadfast. It is our duty to reward their loyalty and deepen our bonds with them, ensuring their voices remain heard and their allegiance secured."
 ENG_find_new_allies:0 "Find New Allies"
 ENG_find_new_allies_desc:0 "We cannot defeat Germany alone, so we must find other allies with whom we have close relations."
 ENG_joint_attack_on_germany:0 "Joint Attack on German Reich"
 ENG_joint_attack_on_germany_desc:0 "We can achieve victory with a simultaneous operation against Germany."
 ENG_return_of_holy_roman_empire:0 "Return of Holy Roman Empire"
 ENG_return_of_holy_roman_empire_desc:0 "No one will stand before the return of the Holy Roman Empire and all will bow down!"
 ENG_blockade_french:0 "Blockade France"
 ENG_blockade_french_desc:0 "A blockade that we will impose on France from the sea will have a very bad effect on their economy."
 ENG_joint_attack_on_france:0 "Joint Attack on France"
 ENG_joint_attack_on_france_desc:0 "They will never be able to withstand the operation we will carry out against the French together with Germany."
 ENG_return_of_angevin_empire:0 "Return of Angevin Empire"
 ENG_return_of_angevin_empire_desc:0 "We are soon to return to our old days, they will not be able to stand against the Angevin Empire."
 ENG_splendid_isolation:0 "Splendid Isolation"
 ENG_splendid_isolation_desc:0 "Under pressure from the increasingly outspoken King and the populace behind him, the government has taken a drastic policy shift, pledging neutrality on continental affairs. Splendid Isolation, it would seem, is back."
 ENG_appeasement_policy:0 "New Appeasement Policy"
 ENG_appeasement_policy_desc:0 "Further breaking recent tradition with his outspoken behaviour, the King has given an unusually unguarded and personal interview with BBC news, in which he argues, as a soldier of the last war, for peace on the continent at any cost. While infuriating Whitehall, the King's attitude has proven popular on the streets, with many Britons uneager to die for another European War."
 ENG_economic_reform:0 "Economic Reforms"
 ENG_economic_reform_desc:0 "His royal highness is seeking to reform certain corrupt financial practices by instituting greater oversight and hedgemony over the relevant economic sectors."
 ENG_crown_works_programme:0 "Crown Works Programme"
 ENG_crown_works_programme_desc:0 "Massive public works projects are launched to alleviate unemployment, boost morale and tie the economy to royal leadership."
 ENG_royal_armament_initiative:0 "Royal Armament Initiative"
 ENG_royal_armament_initiative_desc:0 "The Crown directs resources into arms production, ensuring that Britain is equipped for modern war. New factories rise under royal charters."
 ENG_kings_officer_corps:0 "The King's Officer Corps"
 ENG_kings_officer_corps_desc:0 "Military academies are restructured to emphasize loyalty to the King above all. A new generation of officers emerges, faithful to the monarchy."
 ENG_mechanize_the_empire:0 "Mechanize the Empire"
 ENG_mechanize_the_empire_desc:0 "The British Army is reformed around modern, mobile warfare. Mechanized and motorized divisions will enforce the Crown’s will across the Empire."
 ENG_unite_the_isles:0 "Unite the Isles"
 ENG_unite_the_isles_desc:0 "It is very important for us to unite the islands and the full dominance we will achieve here will be very useful for us in the future."
 ENG_retake_the_african_jewel:0 "Retake the African Jewel"
 ENG_retake_the_african_jewel_desc:0 "An independent Egypt is a too great of risk for our Asian and African interests. They will be once again brought under our control."
 ENG_kings_speech:0 "King's Speech"
 ENG_kings_speech_desc:0 "Once again, we find ourselves on the other side of the blade from the hun. Hitler's appetite for conquest has reached an unacceptable level, and the civilised nations of Europe are in arms against him and his revanchist Germany. It is time for the whole nation to come behind this war effort, and what better way to rally support than a speech to the Royal subjects from the British Sovereign."

 ENG_elizabeth_ii:0 "Elizabeth II"
 ENG_elizabeth_ii_desc:0 "Elizabeth did not expect to become queen so soon, but the unfortunate death of her father pushed her down this path."
 ENG_queens_reign:0 "Queen's Reign"
 ENG_queens_reign_desc:0 "The queen's reign is now beginning, our allies should feel lucky."
 ENG_set_up_concentration_camps:0 "Set Up Concentration Camps"
 ENG_set_up_concentration_camps_desc:0 "We should follow the example of Germany and set up concentration camps and employ slave labor there to benefit ourselves."
 ENG_demand_low_lands:0 "Demand Low Countries"
 ENG_demand_low_lands_desc:0 "These small countries are just a small hurdle ahead of us we have to crush them."
 ENG_armed_neutrality:0 "Armed Neutrality"
 ENG_armed_neutrality_desc:0 "We must declare our neutrality and avoid any actions which would align us with the feuding world powers."
 ENG_defenses_against_strategic_bombing:0 "Defenses Against Strategic Bombing"
 ENG_defenses_against_strategic_bombing_desc:0 "Should we join the global conflict, we must ensure our cities are adequately protected from the inevitable large-scale strategic bombing our would-be enemies no doubt will subject us to."

 ENG_containment:0 "Containment"
 ENG_containment_desc:0 "The time has come to begin our policy of preserving fascist states like Germany. We have seen that by softening you will not get anywhere."
 uk_wartime_measures:0 "Wartime Measures"
 uk_wartime_measures_desc:0 "War, it seems, is upon us, and so we must begin to prepare; we cannot be left behind in the race to mobilise, especially with the headstart our enemies have enjoyed." 
 uk_plan_r4:0 "Plan R 4"
 uk_plan_r4_desc:0 "Use these possessions as the staging platform for an invasion of Norway and Sweden, a supplier of iron ore to the German War Machine.
 uk_home_guards:0 "Deploy Home Guards"
 uk_home_guards_desc:0 "As the threat of conflict on our homeland becomes ever more clear it is ideal we form a home militia mostly comprised of Great War veterans to slow down any foreign invaders in time for professional troops to reorganize and retaliate."
 uk_government_code_and_cypher_school:0 "Government Code and Cypher School"
 uk_government_code_and_cypher_school_desc:0 "By using captured Nazi agents to disseminate disformation directly to their controllers, we can confuse and confound the Nazi's espionage efforts." 
 uk_operation_unthinkable:0 "Operation Unthinkable"
 uk_operation_unthinkable_desc:0 "The war in Europe isn't over, not by a long ways; as long as the Red Menace remains a power the free world will not be able to rest easy. We must not allow the seeds to take root; we must oust the communists, destroy their fetid union, and finally secure a square deal for Poland and all other countries in their thrall." 
 uk_ultra_enigma:0 "Ultra"
 uk_ultra_enigma_desc:0 "The Enigma Machine encryption must be cracked; doing so is vital for the war effort. To this effort we are putting our best mathematical minds to the task; Project Ultra is underway."
 ENG_war_propaganda:0 "Limited War Propaganda"
 ENG_war_propaganda_desc:0 "Many of the nations in the Balkans are pro-British and see the same threat from central Europe as we do. If we seize the opportunity and support them early, we can secure their loyalty, although at the expense of angering their revengist neighbors."
 ENG_luxemburg_security:0 "Secure Luxembourg"
 ENG_luxemburg_security_desc:0 "Political movements in Luxembuorg continues to support our enemies and threatens our allies. Luxembourg will have to be subdued in order to ensure a free Europe."

 ENG_disunite_kingdoms:0 "Divide Kingdom"
 ENG_disunite_kingdoms_desc:0 "The 'United Kingdom' is no less a product of Imperialism than the brutal regime in India, borne out of concordats between bourgoisie Kings. It is time to right that wrong."
 ENG_syndicalist_development:0 "Decentralised Industry"
 ENG_syndicalist_development_desc:0 "Centrally-planned industrial policy, made by bureaucrats far away from the realities of working life, are no way to comandeer a free society. Those who work, decide how, when, and where they work!" 
 ENG_syndicalist_research:0 "Syndicalist Research"
 ENG_syndicalist_research_desc:0 "We are a nation rich in learning, with some of the world's oldest institutions. But still, knowledge remains locked in it's ivory tower. Giving out scholarships to the more disaffected people of Britain would help expand our productivity massively."
 ENG_syndicalist_resource:0 "Give Priority to Resource Extraction"
 ENG_syndicalist_army:0 "Syndicalist Army"
 ENG_syndicalist_army_desc:0 "We are a movement of the people, and a revolutionary army should be nothing more than a concrete, physical embodiment of the will of the proletariat. Open up the arsenals!"
 ENG_spread_syndicalism_neighbours:0 "Spread Syndicalism"
 ENG_spread_syndicalism_neighbours_desc:0 "What good is a revolution bound by the shores of Britain? It is time to spread our wings, and across the world!"
 ENG_syndicalist_iberia:0 "Spread Syndicalism to Iberia"
 ENG_syndicalist_iberia_desc:0 "Iberia was the blueprint for the British Revolution - our own premier, Orwell, is a veteran of the war in Spain, as are many of our leading officials. They too find themselves alienated from the authoritarian policies of the Soviet Union, and would be at home in our Syndicalist Internationale!" 
 ENG_syndicalist_ireland:0 "Spread Syndicalism to Ireland"
 ENG_syndicalist_ireland_desc:0 "Ireland, long victimised by the British Empire, finally has a chance for a future together with its fellow nations of the isles. Offering them the tantalising prospect of a united Ireland should be enough to bring them into the Federation."
 ENG_soviet_scientists:0 "Soviet Scientists"
 ENG_soviet_scientists_desc:0 "Britain and Russia are two countries of tremendous knowledge & learning. Putting our research together, we can brighten the future of the human race immeasurably!"
 ENG_red_army:0 "Red Army"
 ENG_red_army_desc:0 "We have updated our army system, taking the example of the red army, and our new red army is much stronger than before."
 ENG_red_guards:0 "Red Guards"
 ENG_red_guards_desc:0 "Based on our one gun for every person policy, we expanded our conscription law."
 ENG_attack_ireland:0 "Attack Ireland"
 ENG_attack_ireland_desc:0 "Capitalist Ireland could easily become a springboard for a counterrevolutionary invasion of Great Britain by the exiled monarchy and what remains of their Empire. We must move before this happens."  
 ENG_join_comecon:0 "Join Comecon"
 ENG_join_comecon_desc:0 "The socialist nations of the world need to stick together to ensure our economic neccessities and interest are not perverted by the realities of a capitalist world. To that end, the Council for Mutual Economic Assistance!"  
 ENG_ideological_propaganda:0 "Ideological Propaganda"
 ENG_ideological_propaganda_desc:0 "Every communist movement is a potential cell ready to organize the masses." 

 ENG_diplomacy_with_the_reich:0 "Diplomacy with the Reich"
 ENG_diplomacy_with_the_reich_desc:0 "The base concept of fascism - that alone, we are weak like a twig, but together as a bundle, we are unbreakable - shows our destiny lies in an alliance with the continental fascist powers. Forwards, for youth and Europe!"
 ENG_the_iron_ministry:0 "The Iron Ministry"
 ENG_the_iron_ministry_desc:0 "A new central ministry oversees domestic infrastructure and war production, dissolving overlapping agencies and rooting out inefficiency."
 ENG_youth_loyalty_programmes:0 "Youth Loyalty Programmes"
 ENG_youth_loyalty_programmes_desc:0 "The future of the state lies in its youth. State-sponsored education and paramilitary training ensure loyalty from the earliest age."
 ENG_iron_fleet_initiative:0 "Iron Fleet Initiative"
 ENG_iron_fleet_initiative_desc:0 "A naval rearmament program is launched, prioritizing heavy cruisers and modern battleships to secure maritime dominance."
 ENG_state_propaganda_directorate:0 "State Propaganda Directorate"
 ENG_state_propaganda_directorate_desc:0 "A new Directorate is established to oversee all communication—press, radio, film and education—to instill unity, strength and loyalty."
 ENG_restructure_the_british_state:0 "Restructure the British State"
 ENG_restructure_the_british_state_desc:0 "A new Britain requires a new structure. The old parliamentary framework is dismantled in favor of centralized ministries and a fascist administrative order."
 ENG_military_exchange_programs:0 "Military Exchange Programs"
 ENG_military_exchange_programs_desc:0 "Delegations are exchanged with the German military to study doctrine, discipline, and mechanization—preparing for future wars."
 ENG_join_the_axis:0 "Join the Axis"
 ENG_join_the_axis_desc:0 "Having secured ideological and military alignment, Britain formally joins the Axis, becoming a key pillar of fascist power in Europe."
 ENG_road_war:0 "Prepare for War"
 ENG_road_war_desc:0 "Anything that remains decrepit and static, an Empire, a nation, a race, will inevitably wither and die. Through constant expansion, reinvention and progress, we shall be the first eternal empire."
 ENG_demand_ireland:0 "Demand Ireland"
 ENG_demand_ireland_desc:0 "The Irish continue to tote their silly notions of independence, and our tolerance is at an end. It is time we crush their resistance and bring the entire country back into the fold as an integral part of the United Kingdom."
 ENG_rebuild_imperial_core:0 "Rebuild the Imperial Core"
 ENG_rebuild_imperial_core_desc:0 "Focus shifts to strengthening the home isles as the heart of the Empire. Industry, transport and governance must reflect imperial primacy."
 ENG_ally_portugal:0 "Alliance with Portugal"
 ENG_ally_portugal_desc:0 "Alliance with Portugal is strategically very important to us."
 ENG_secure_oil_imports:0 "Secure the Oil Imports"
 ENG_secure_oil_imports_desc:0 "It is very important for us to seize oil wells and prevent our enemies from taking advantage of them."
 ENG_invite_china:0 "Invite China"
 ENG_invite_china_desc:0 "An ally who can support our army on all fronts will be very useful to us."
 ENG_invite_japan:0 "Invite Japan"
 ENG_invite_japan_desc:0 "The Royal Navy alone may not stand a chance against the US Navy, but if we were to renew the Anglo-Japanese alliance."
 ENG_attack_france:0 "Attack France"
 ENG_attack_france_desc:0 "Fascism has not been able to gain strength in France. The liberal and communist ideals have too much strength, so it falls upon us to liberate the Frenchman from weakness."
 uk_fascist_military:0 "National Mobilization Program"
 uk_fascist_military_desc:0 "To be seen as strong you have to be strong. We cannot allow our troops to continue to be sidelined in favor of other areas. The military will always be priority number one."
 ENG_become_global_hegemony:0 "Become Global Hegemon"
 ENG_become_global_hegemony_desc:0 "Now that we have become a global hegemon, no one can stand against us and our allies."
 ENG_organize_the_military:0 "Organize the Military"
 ENG_organize_the_military_desc:0 "It was normal for our army to behave in a relaxed manner because we are one of the greatest powers in the world, but in times of war, this will put us in great trouble. That's why the army must be reformed and restored to its former glory."

 uk_ireland_focus:0 "Development in Ireland"
 uk_ireland_focus_desc:0 "The state of our colonies in Ireland remains controversial both abroad and at home, but whatever is in store for them, strengthening their industrial capacity is a priority at the present stage. Maybe this support can make them stick with us."
 uk_protect_pyrenees:0 "Protect Pyrenees"
 uk_protect_pyrenees_desc:0 "The Pyrenees are very difficult mountains to cross, if we succeed in fortifying this place beforehand, we can make it more difficult for France to attack Spain."
 uk_protect_spanish_morocco:0 "Protect Spanish Morocco"
 uk_protect_spanish_morocco_desc:0 "We can make Gibraltar safer for us by protecting Spanish Morocco."
 uk_protect_cyprus:0 "Protect Cyprus"
 uk_protect_cyprus_desc:0 "Cyprus commands an excellent position in the central Mediterranean, a vital way station along our lifeline through Egypt and the Suez Canal to India and the Far East. Time spent fortifying it more strongly could never be wasted."
 uk_protect_bosphorus:0 "Protect Bosphorus"
 uk_protect_bosphorus_desc:0 "The straits are in a very important position for us, if we can protect the straits without any problems, we will prevent the soviet navy in the black sea from descending into the warm seas."
 uk_protect_aegean_islands:0 "Protect Aegean Islands"
 uk_protect_aegean_islands_desc:0 "The Aegean Islands are another way of keeping the Turkish Straits under control. If we can protect these areas, ships coming from the Black Sea will have to be very lucky to pass through here."
 uk_support_education_in_india:0 "Support Education in India"
 uk_support_education_in_india_desc:0 "There are great numbers of brilliant minds that go unfound and undeveloped in India; by opening universities we can massively increase the intellectual capabilities of the nation."
 ENG_developing_the_empire:0 "Developing the Empire"
 ENG_developing_the_empire_desc:0 "The living conditions in every corner of our empire should be equal, so we need to invest in every region."
 ENG_choosing_capital_imp:0 "Choosing New Capital"
 ENG_choosing_capital_imp_desc:0 "Changing the capital of our empire, which has reached its greatest limits, may make strategic sense, but will we do it?"
 uk_african_focus:0 "Develop Africa"
 uk_african_focus_desc:0 "We have carved large swathes of the dark continent for ourselves; now, with steel and railway and tarmac we must make it our own."
 uk_form_camel_corps:0 "Form Camel Corps"
 uk_form_camel_corps_desc:0 "Camels are perfect for fighting in the desert, and they provide a great advantage, especially in very large deserts."
 uk_develop_africas_infrastructure:0 "Develop African Infrastructure"
 uk_develop_africas_infrastructure_desc:0 "We must gain an advantage over Italy by strengthening the infrastructure in Africa. If our infrastructure is not strong, this front can turn into hell for our soldiers."
 ENG_reform_balkan_entente:0 "Reform Balkan Entente"
 ENG_reform_balkan_entente_desc:0 "The Balkan Pact was formed from Turkey, Yugoslavia, Romania and Greece to deter Bulgarian and Hungarian irredentism, but the world has grown significantly more dangerous since then. The Balkan Pact is inadequate for defending against the rise of Germany and the reactionary regimes in Hungary and Bulgaria. Britain should encourage this pact to reform a Balkan Entente."
 ENG_enosis_focus:0 "Enosis"
 ENG_enosis_focus_desc:0 "The [GRE.GetAdjective] Government has been pressing its claims for over Cyprus for decades and insists that unification (referred to as Enosis) is the only sustainable future for Cyprus. The Foreign Office disagrees with this and believes the Cypriots should have Self-Government. To gain the full support of Greece in the war, we will compromise and allow Enosis to occur if the Cypriots gain autonomy."
 ENG_pax_britannica:0 "Pax Britannica"
 ENG_pax_britannica_desc:0 "As the dust of chaos settles and the globe steadies once more, Britannia stands unchallenged. Our enemies lie defeated, our allies kneel in respect and the strength of our industry and arms ensures an enduring peace shaped by British ideals. This is not merely the end of war—it is the beginning of a new order. The world shall know the firm but fair hand of the Empire, as we forge an age where British leadership, not conquest, defines stability. In the shadow of steel and sovereignty, a new Pax Britannica dawns."

 ENG_national_recovery_programme:0 "National Recovery Programme"
 ENG_national_recovery_programme_desc:0 "The economic downturn of recent years has eased, but structural issues remain. By launching a coordinated national programme of investment and reform, we can ensure a stable and prosperous recovery."
 ENG_rearmament_drives_industry:0 "Rearmament Drives Industry"
 ENG_rearmament_drives_industry_desc:0 "Our rearmament is not only a military necessity—it is an economic opportunity. War production can stimulate our factories and unify the workforce."
 ENG_an_arsenal_for_the_empire:0 "An Arsenal for the Empire"
 ENG_an_arsenal_for_the_empire_desc:0 "Our global responsibilities demand a robust and capable defense industry. By converting and expanding factories for military use, Britain shall once again become the workshop of war — not just for herself, but for the entire Empire."
 ENG_public_works_expansion:0 "Public Works Expansion"
 ENG_public_works_expansion_desc:0 "A nationwide programme of government-funded infrastructure projects will not only employ thousands, but also provide the economic stimulus our civilian sector sorely needs."
 ENG_revitalize_the_economy:0 "Revitalize the Economy"
 ENG_revitalize_the_economy_desc:0 "Although the worst of the economic crisis has passed, our economy remains stagnant and uneven. It's time to launch a series of policies to breathe life back into British industry and restore growth across the nation."
 ENG_expand_imperial_college:0 "Expand Imperial College"
 ENG_expand_imperial_college_desc:0 "Imperial College is at the forefront of scientific innovation. With increased government funding, new laboratories and a growing academic staff, we will empower our nation with advanced research capabilities."
 ENG_national_housing_initiative:0 "National Housing Initiative"
 ENG_national_housing_initiative_desc:0 "We shall fund large-scale housing and infrastructure programs to provide both employment and dignity to the British people."
 ENG_expand_steelworks:0 "Expand Steelworks of Britain"
 ENG_expand_steelworks_desc:0 "With the threat of conflict looming over Europe, increasing domestic steel production has become a national priority. Our factories in Sheffield and beyond must be modernized and expanded to meet future demands."
 ENG_expand_imperial_chemical_industries:0 "Expand Imperial Chemical Industries"
 ENG_expand_imperial_chemical_industries_desc:0 "Imperial Chemical Industries stands as a cornerstone of Britain's chemical sector. By expanding its production facilities and research capacity, we can strengthen our military supply chain and ensure chemical superiority in both civilian and wartime applications."
 ENG_dual_pillars_of_industry:0 "Dual Pillars of Industry"
 ENG_dual_pillars_of_industry_desc:0 "We must balance the needs of our civilian population with the growing demands of the military. With wise leadership, we can support both."
 ENG_expand_the_lochaber_scheme:0 "Expand the Lochaber Scheme"
 ENG_expand_the_lochaber_scheme_desc:0 "The Lochaber hydroelectric project, centred around the Spey Dam, stands as one of the most ambitious feats of engineering in the Scottish Highlands. Originally constructed to power the aluminium smelter at Fort William, it harnesses the waters of the River Spey to generate reliable, large-scale electricity. By expanding and modernising the scheme, we can ensure a steady supply of power for both industrial output and the war effort, bringing light and industry to the remote Highlands."
 ENG_war_workshop_expansion:0 "War Workshop Expansion"
 ENG_war_workshop_expansion_desc:0 "We will expand our arms factories and war-related industries, ensuring a steady supply of equipment for the conflicts to come."
 ENG_total_war_mobilization:0 "Total War Mobilization"
 ENG_total_war_mobilization_desc:0 "Now that we are at war, every aspect of British life must serve the war effort. Industry, science and manpower shall be unified in a single goal: Victory."
 uk_expand_mi6:0 "Expand MI6"
 uk_expand_mi6_desc:0 "We must develop and operate an intellegence agency to be headquartered in Bletchley Park to attain greater efficiency in our intel operations."
 ENG_nuke_alone:0 "Nuclear Effort"
 ENG_nuke_alone_desc:0 "Physical equations show that the fission of uranium could release a gigantic quantity of energy. This could potentially lead to the creation of a bomb of almost inconceivable power."

 ENG_air_training:0 "Pilot Training Program"
 ENG_air_training_desc:0 "Our manpower is stretched and thinly-spread; we should put effort into training those pilots we have well, and also recruiting willing pilot volunteers from across the Empire and the world to fly our planes."
 ENG_army_rearmament_focus:0 "Army Rearmament"
 ENG_army_rearmament_focus_desc:0 "Founded in 1660, proudly once one of the best fighting forces in the world, the British Army stands to attention when the Lion roars."
 ENG_embrace_modern_warfare:0 "Embrace Modern Warfare"
 ENG_embrace_modern_warfare_desc:0 "The future of war lies not in trenches, but in movement, machines and mechanized aggression. From German blitzkrieg tactics to Soviet deep operations theory, the world is changing. We must adapt—or be left behind."
 ENG_mechanized_warfare:0 "Mechanized Warfare"
 ENG_mechanized_warfare_desc:0 "Mechanized infantry will enable us to project power with speed, efficiency and shock. Trucks and half-tracks will replace marching columns, allowing our forces to seize the initiative and exploit breakthroughs."
 ENG_armoured_spearhead_tactics:0 "Armoured Spearhead Tactics"
 ENG_armoured_spearhead_tactics_desc:0 "Tank divisions shall no longer be relegated to support roles—they will lead the charge. Our doctrine will focus on independent armored thrusts, deep encirclements and high-speed exploitation. We are forging the tip of the spear."
 ENG_embrace_traditional_warfare:0 "Embrace Traditional Warfare"
 ENG_embrace_traditional_warfare_desc:0 "In an age obsessed with innovation, we reaffirm our trust in the timeless values of discipline, firepower and cohesion. The doctrines forged in the trenches of the Great War shall continue to guide our hand. We will not abandon the lessons paid for in blood."
 ENG_infantry_doctrines:0 "Uphold the Infantry Doctrine"
 ENG_infantry_doctrines_desc:0 "The infantryman remains the backbone of the British Army. Through structured lines, well-rehearsed formations and field discipline, we shall maintain battlefield superiority. Our strategy hinges on cohesion, not chaos."
 ENG_artillery_modernization:0 "Artillery Modernization"
 ENG_artillery_modernization_desc:0 "The firepower of our artillery must match the scale of the conflicts to come. New designs such as the Ordnance QF 25-pounder promise greater mobility, precision and lethality. We shall invest in factories, training and logistics to ensure our gunners are second to none."
 ENG_firepower_first:0 "Firepower First"
 ENG_firepower_first_desc:0 "We reject speed for strength, maneuver for annihilation. By concentrating overwhelming artillery and machine-gun fire, we shall render enemy offensives impotent before they even reach our lines. War is won by fire, not flash."
 ENG_coastal_fortification_program:0 "Coastal Fortification Program"
 ENG_coastal_fortification_program_desc:0 "Our island nature offers natural protection, but we must not rely on geography alone. We will embark on an ambitious program of constructing bunkers, pillboxes, anti-tank defenses and fortified ports to ensure no invader sets foot on British soil unchallenged."
 ENG_comprehensive_mobilization:0 "Comprehensive Mobilization"
 ENG_comprehensive_mobilization_desc:0 "To wage total war, we must mobilize not just our armed forces, but the entire nation. Through conscription, industrial conversion and centralized economic planning, every citizen will have a role in Britain's defense. The line between soldier and civilian shall blur."
 ENG_grand_army_reforms:0 "Grand Army Reform"
 ENG_grand_army_reforms_desc:0 "Following the harsh lessons of early setbacks and organizational stagnation, we will restructure our army into a modern, unified force. The British Expeditionary Force, home commands and colonial divisions will be reorganized under streamlined leadership and updated doctrines."
 ENG_military_bureau_reorganization:0 "Military Bureau Reorganization"
 ENG_military_bureau_reorganization_desc:0 "The War Office, General Staff, and supply departments suffer from chronic inefficiency and inter-branch rivalries. Through sweeping administrative reform, we will create a centralized and professional command structure capable of sustaining high-intensity, modern warfare."
 ENG_expand_the_royal_marines:0 "Expand the Royal Marines"
 ENG_expand_the_royal_marines_desc:0 "With amphibious warfare becoming a critical part of modern strategy, we must expand and modernize the Royal Marines. Additional battalions will be raised, specialized training will be instituted and coordination with the Royal Navy will be prioritized to ensure rapid and effective shore assaults anywhere in the world."
 
 ENG_reform_the_army_structure:0 "Reform the Army Structure"
 ENG_reform_the_army_structure_desc:0 "The Royal Army has recently lost its former glory and power. We need to introduce structural reforms to the army before we can modernize it and restore it to its former strength."
 ENG_improve_ship_cannons:0 "Improve Ship Cannons"
 ENG_improve_ship_cannons_desc:0 "Our ship cannons are sometimes weak against other countries and this makes our ships look weak. We need to develop and produce new cannons in a way that does not strain our budget."
 ENG_expand_naval_facilities:0 "Expand Naval Facilities"
 ENG_expand_naval_facilities_desc:0 "In the face of increasing tension in the world, some countries increased their naval investments, which worried our navy. We need to make new investments so that our navy is not weakened in the event of a possible war."
