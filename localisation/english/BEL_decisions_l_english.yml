BEL_join_belgium_faction_tt:0 "One of the 3 countries must have a §HPersuasion Points§! of more than §Y35§!"

BEL_CONVINCE_BELGIUM_ALLIANCE_DESC:0 "We must find out which of the great powers around us can help us the most and choose our side in the coming world war. We must not make the same mistakes we made in the last war and lose again, so we must stand with the most powerful country that can help us the most and win this war."
BEL_CONVINCE_BELGIUM_ALLIANCE_GER_DESC:0 "If we manage to get Belgium on our side, unlike in the previous war, we don't have to attack them and we can use their border line to cross the maginot line without any effort. In this case, it will not even take hours to capture the French, who are already unprepared."
BEL_CONVINCE_BELGIUM_ALLIANCE_OTHER_DESC:0 "Whatever happens, we must convince Belgium to become our ally. If they agree, we can make the defense lines in this region much stronger. If we can adjust the defenses in time, it will not be difficult to defend both the Benelux countries and the France."

