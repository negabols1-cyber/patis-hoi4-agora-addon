BEL_benelux_summit_decision:0 "Organize a Benelux Summit"
BEL_benelux_summit_decision_desc:0 "We will invite all our neighbours to attend a Benelux Summit. This event will allow us to subtly promote our ideas and increase the Belgian influence in the nations of the region."