BEL_uranium_concession_agreement:0 "Uranium Concession Agreements with [FROM.GetNameDef]"
BEL_uranium_concession_agreement_desc:0 "We cannot make the most out of the uranium deposits in our soil, and it would be more beneficial not only for us, but also for our [FROM.GetAdjective] allies, to sign a contract granting them exploitation rights in exchange for useful materials and products for our domestic industry and agriculture."

