BEL_integrate_benelux_decision:0 "Integrate Benelux"
BEL_integrate_benelux_decision_desc:0 "We can unite Benelux peacefully. We need to convince our neighboring states in the region and work together for this purpose. A united Benelux would be much stronger and would benefit us all. It will also make it easier for us to preserve our socialist revolution. \n\nIn order to peacefully annex §YBenelux§!, you have to achieve §Y100%§! integration of the countries."
