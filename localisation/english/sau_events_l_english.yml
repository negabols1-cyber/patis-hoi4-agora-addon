l_english: 
 saudi.1.t:0 "Find Partners for Oil Exploration"
 saudi.1.d:0 "The oil wells in our country are not enough to support our economy, so we depend mostly on Hajj revenues, but we know that the oil reserves in our country are much more, but we do not have the power to discover or extract it. So we have to deal with the countries that can do it for us, the one that will benefit us the most and develop our economy."
 saudi.1.a:0 "Americans"
 saudi.1.b:0 "British"
 saudi.1.c:0 "Germans"
 saudi.1.f:0 "Soviets"

 saudi.2.t:0 "[From.GetNameDefCap] offers Treaty of Friendship"
 saudi.2.d:0 "[ROOT.GetLeader] met today with Saudi Foreign Minister Prince Faisal in [ROOT.Capital.GetName] to discuss the [SAU.GetAdjective] proposal to sign a Treaty of Friendship between our countries. With this treaty, the [SAU.GetAdjective] government seeks to strengthen ties with us, hoping to eventually form an alliance between the two countries that allows cooperation and mutual support."
 saudi.2.a:0 "Signing this treaty will benefit both countries!"
 saudi.2.b:0 "This treaty is not in our best interest."

 saudi.3.t:0 "[From.GetNameDefCap] Signs Treaty of Friendship"
 saudi.3.d:0 "Foreign Minister Prince Faisal returned to [SAU.Capital.GetName] today from a meeting with [FROM.GetLeader] in [FROM.Capital.GetName] to discuss the proposal to sign the Treaty of Friendship between [FROM.GetNameDef] and [ROOT.GetNameDef]. At the end of the meeting, dignitaries from both countries signed the Treaty, but left some clauses open for the future, with the mutual desire not only to preserve, but also to expand this beneficial relationship."
 saudi.3.a:0 "This will strengthen both nations"

 saudi.4.t:0 "[From.GetNameDefCap] Rejects Treaty of Friendship"
 saudi.4.d:0 "Foreign Minister Prince Faisal returned to [SAU.Capital.GetName] today from a meeting with [FROM.GetLeader] in [FROM.Capital.GetName] to discuss the proposal to sign the Treaty of Friendship between [FROM.GetNameDef] and [ROOT.GetNameDef]. Unfortunately, [FROM.GetLeader] did not seem very enthusiastic about the idea of befriending [ROOT.GetNameDef] and ultimately rejected our proposal."
 saudi.4.a:0 "What a waste of time..."

 saudi.5.t:0 "[FROM.GetNameDefCap] Seeks Control of Our Colonies"
 saudi.5.alt.t:0 "[FROM.GetNameDefCap] Demands Our Colonies"
 saudi.5.d:0 "As a result of their cooperation with us, [SAU.GetNameDefCap] are asking for our colonial lands in the region to expand oil exploration and provide us with more oil. [SAU.GetLeader] said that this is in the interest of both countries and it is a deal that must be done."
 saudi.5.alt.d:0 "As [SAU.GetNameDefCap] casts off the yoke of its past [SAU.GetLeader] has become brazen enough to demand a return of our colonial holdings in the area. Uniting the subcontinent into one strong state seems of utmost importance for the newborn country."
 saudi.5.a:0 "Sounds like a deal"
 saudi.5.b:0 "They will have to take it by force"

 saudi.6.t:0 "[From.GetNameDefCap] Accepts Our Offer"
 saudi.6.d:0 "[FROM.GetName] has begrudgingly accepted our demands. They do make it clear that this type of handfisted politics will not stand for long, and is only made viable as a small recompense."
 saudi.6.a:0 "Great!"

 saudi.7.t:0 "[From.GetNameDefCap] Rejects Our Offer"
 saudi.7.d:0 "The [FROM.GetAdjective] government has stubbornly refused to hand over rightful lands, despite repeated warnings that the status-quo is unacceptable."
 saudi.7.a:0 "We will have to take it by force then"
 saudi.7.b:0 "We have other concerns"
 
 saudi.8.t:0 "[FROM.GetNameDefCap] Demands Our Annexation"
 saudi.8.d:0 "The [FROM.GetNameDefCap] government wants us annexed to serve a greater purpose under Islam. They say it will be easier to fight the infidels if we all join Saudi Arabia, but it also means surrendering our independence to a another country. We don't think this is possible."
 saudi.8.a:0 "There's nothing to do"
 saudi.8.b:0 "Are they delusional?"

 saudi.9.t:0 "[FROM.GetNameDefCap] Accepts Our Demand"
 saudi.9.d:0 "[FROM.GetLeader] of [FROM.GetNameDef] has decided to accept our offer of annexation, and their nation will subsequently become an integral part of ours. This will help us to fight the infidels."
 saudi.9.a:0 "They had no real option but to accept."

 saudi.10.t:0 "[FROM.GetNameDefCap] Rejects Our Demand"
 saudi.10.d:0 "[FROM.GetLeader] of [FROM.GetNameDef] has decided to reject our offer of annexation. A foolish decision, to say the least. How should we deal with them?"
 saudi.10.a:0 "We will destroy them!"
 saudi.10.b:0 "We will deal with them later"

 saudi.11.t:0 "A Huge Oil Reserve Discovered"
 saudi.11.d:0 "Today we received good news from our [GetSAUCollaboratorName] collaborators that the drilling of the Dammam No.7 oil well by [GetSAUCollaboratorCompanyName] has yielded results and 1,585 barrels of oil have been extracted and this number is expected to increase in the coming days. According to statistics, we are witnessing the discovery of the largest oil reserve in the world so far. This well will enrich our country and contribute greatly to our development. In this way, we can strengthen our country, open up to the global market and become an important country."
 saudi.11.a:0 "It's a huge discovery"

 saudi.12.t:0 "The Fall of Mecca"
 saudi.12.d:0 "Today, on the dark morning of [GetYear], the most important house established for the people, the sacred house in Bekke, a source of guidance for all peoples, fell into the hands of the infidels. It is unacceptable that we have just ended 400 years of oppression and have lost the holy Mecca and the Kaaba again. The honor of our holy city has been violated. It is a question of where the faithful will perform the hajj. If we cannot recover our holy lands before the hajj time comes, our economy impact from that."
 saudi.12.a:0 "Ghazat al-athem lahmi, thumma athmee"

 saudi.13.t:0 "Mecca Retaken"
 saudi.13.d:0 "O place where revelation descends, O qibla of souls,\nHow many times did the Kaaba weep for the tyrant's cruelty...\n\nBut the Lord of the House did not sleep for a moment,\nHe allowed, the free ones awoke with weapons...\n\nAt the end of the long siege, Mecca was saved by the order of our commander-in-chief! The people of Mecca took to the streets with their sharia flags and whatever else they could get their hands on.The entire Islamic world is very happy to be able to perform Hajj again, and pilgrims have already started coming for Umrah."
 saudi.13.a:0 "The cloud has cleared, and the right one has triumphed."

 saudi.14.t:0 "The Fall of Dhahran"
 saudi.14.d:0 "According to the latest conflict reports, the cities of Dhahran and Dammam have fallen. These important cities also contained the largest oil reserves ever discovered in the world. If we fail to retake these cities, our economy will be severely damaged and the development of our country will slow down considerably."
 saudi.14.a:0 "To the front!"
 saudi.14.a:0 "Sabotage the oil well"

 saudi.15.t:0 "Dhahran Retaken"
 saudi.15.d:0 "Our efforts have paid off. We have managed to recapture the cities of Dhahran and Dammam, where we must immediately start rebuilding the destroyed infrastructure and restart oil production once we are sure that the enemy will never come here again."
 saudi.15.alt.d:0 "Our efforts have paid off. We have managed to recapture the cities of Dhahran and Dammam, where we must immediately start rebuilding the destroyed infrastructure and restart oil production once we are sure that the enemy will never come here again. But because we sabotaged the oil well, it will take a long time and cost a lot of money to repair it."
 saudi.15.a:0 "Start operations immediately"

 saudi.16.t:0 "[FROM.GetNameDefCap] wants us to join Arab League"
 saudi.16.d:0 "[FROM.GetLeader] has called a meeting of Arab leaders to discuss an agreement that will benefit the entire Arab world. If we join the protocol to be signed today, we will be part of the upcoming Arab League, and as a result, we will have a strong voice in the world and we will help each other develop as Arab countries. Shall we sign?"
 saudi.16.a:0 "Great idea!"
 saudi.16.b:0 "We will not be part of an impossible goal!"

 saudi.17.t:0 "[From.GetNameDefCap] Signs [GetProtocolCityName] Protocol"
 saudi.17.d:0 "[FROM.GetLeader] of [FROM.GetNameDef] has decided to sign the protocol. According to his statement, [FROM.GetLeader] believes that this protocol will contribute to the future of the Arab world and is an important step towards a better future for all of us."
 saudi.17.a:0 "For the brotherhood of peoples!"

 saudi.18.t:0 "[FROM.GetNameDefCap] Refuses to Sign [GetProtocolCityName] Protocol"
 saudi.18.d:0 "[FROM.GetLeader] of [FROM.GetNameDef] refused to sign the protocol. He left the hall saying that the protocol was an impossible dream, that the tension in the world was increasing day by day and that soon rifles, not agreements, would speak. Before leaving, he advised us to strengthen our armies."
 saudi.18.a:0 "Bullshit!"

 saudi.19.t:0 "[FROM.GetNameDefCap] Demands Independence in the Middle East"
 saudi.19.d:0 "[FROM.GetName] demands that we grant independence to our colonies in the Middle East. They say their goal is for every Arab to live independently and they will not stop until they achieve this. They say that if we accept their demands, they will start working on increasing cooperation between the two countries and that we can get very good economic benefits from this."
 saudi.19.alt.d:0 "[FROM.GetName] demands that we grant independence to our colonies in the Middle East. They say their goal is for every Arab to live independently and they will not stop until they achieve this. They said that if we don't accept their demands, the consequences will be bad and it will cause us a lot of trouble because the people of the region also want independence and if it is not granted, there may be riots in the region."
 saudi.19.a:0 "Accept Request and give independence"
 saudi.19.b:0 "Impossible!"

 saudi.20.t:0 "[FROM.GetNameDefCap] Accepts Our Demand"
 saudi.20.d:0 "[FROM.GetName] accepted our demands, saying there was no need for tension, and granted independence to its colonies in the Middle East. They also said that they looked forward to the necessary work to increase cooperation between our countries. This is an important achievement for us."
 saudi.20.a:0 "Liberty at last"

 saudi.21.t:0 "[FROM.GetNameDefCap] Rejects Our Demand"
 saudi.21.d:0 "[FROM.GetName] rejected our demand, stating that it was absurd and that such a thing would not be possible. They said that the region was under tight control and there was no room for riots."
 saudi.21.a:0 "Start operations immediately"

 saudi.22.t:0 "Arab League Established"
 saudi.22.d:0 "The Arab League was officially established. We are one of the founding members of the League as we are one of the signatories of the [GetProtocolCityName] Protocol. We need to take this cooperation further and leave a better country for future generations. We hope this will be a good development for the whole Arab world."
 saudi.22.a:0 "A bright future awaits us"

 saudi.23.t:0 "[SAU.GetName] Demands Arabian Unification"
 saudi.23.d:0 "In a bold diplomatic move, [SAU.GetName] has called for the unification of the Arabian Peninsula under one state. They believe this will strengthen the region against foreign threats and increase cooperation among Arab peoples. However, this would mean ceding national sovereignty to Riyadh."
 saudi.23.a:0 "Unity is strength, we shall accept"
 saudi.23.b:0 "Our independence is not negotiable!"

 saudi.24.t:0 "[SAU.GetName] Demands Unification Under a Federation"
 saudi.24.d:0 "[SAU.GetName] has proposed a new political model for the region: a federation of Arab states under their leadership. While this offers some autonomy, real power would rest in Riyadh. Some view this as a path to unity, others as a veiled annexation."
 saudi.24.a:0 "We accept this federation for the greater good"
 saudi.24.b:0 "We reject this imperialist disguise!"

 saudi.25.t:0 "[From.GetNameDefCap] Accept Unification"
 saudi.25.d:0 "[From.GetNameDef] has agreed to unify with us. This historic decision marks a new chapter for the Arabian Peninsula, bringing us closer to the dream of a united Arabia."
 saudi.25.a:0 "Stronger together"

 saudi.26.t:0 "[From.GetNameDefCap] Reject Unification"
 saudi.26.d:0 "[From.GetNameDef] has rejected our offer of unification. This setback shows that not everyone is ready to abandon their personal ambitions for the sake of Arab unity."
 saudi.26.a:0 "They are ridiculous!"

 saudi.27.t:0 "King Abdulaziz Falls Gravely Ill"
 saudi.27.d:0 "King Abdulaziz has suddenly fallen seriously ill, and his condition is worsening rapidly. Doctors fear the worst, as treatment options appear limited. The nation holds its breath as its founding monarch, the unifier of Arabia, battles a mysterious and aggressive illness. With the king incapacitated, attention turns to Crown Prince Saud bin Abdulaziz Al Saud, who is expected to take over leadership if the situation deteriorates further."
 saudi.27.a:0 "We must do everything we can to cure him"

 saudi.28.t:0 "Death of King Abdulaziz"
 saudi.28.d:0 "King Abdulaziz has died.\n\nThe man who united the tribes, forged a kingdom out of the desert, and stood tall against the odds — is no more. His passing comes at a fragile moment, as the nation still shapes its future on the foundations he laid.\n\nWith his final breath, an era ends. But the affairs of state do not pause for mourning. The throne now passes to his son, Crown Prince Saud, whose rule begins in the long shadow of his father.\n\nThe world watches. What comes next will define the fate of Arabia."
 saudi.28.a:0 "We must stand tall on this dark day"

 saudi.29.t:0 "[GetProtocolCityName] Protocol"
 saudi.29.alt.t:0 "Riyadh Protocol"
 saudi.29.d:0 "In the heart of the Arab world, a new chapter is being written. [SAU.GetLeader], along with delegates from various Arab nations, has convened in [GetProtocolCityName] to sign a historic agreement — a protocol that aims to unify the Arab world in purpose, defense, and prosperity. It is more than just a piece of paper; it is the manifestation of a vision long dreamed by pan-Arabists, poets, scholars, and revolutionaries alike. However, some fear that such a agreement may compromise national sovereignty or empower dominant states at the expense of others. Yet the weight of history presses down: to remain divided may mean to remain vulnerable.\n\nWill we join this endeavor and become a founding pillar of a united Arab future?"
 saudi.29.a:0 "We shall sign and lead the Arab world into a new era!"
 saudi.29.b:0 "Our path is our own"

 saudi.30.t:0 "[From.GetNameDefCap] Meddles in our Internal Politics"
 saudi.30.d:0 "[From.GetNameDefCap] has approached pro-islamist and anti-monarchist elements of the Iranian government and the underground with plans for the assassination of [ROOT.GetLeader] and to install an Islamist government. The Saudis ensure us they can handle the assassination; all we have to do is affirm our willingness to create a replacement government, and to pledge our future military support to Saudi endeavours."
 saudi.30.a:0 "We must look to Islam in the time ahead."
 saudi.30.b:0 "Preposterous! We will never abandon our ways!"

 saudi.31.t:0 "Iranians Accept Coup Proposal"
 saudi.31.d:0 "Elements in the Iranian government and underground have accepted our proposal for a coup. They are making preparations for a swift siezure of power, as soon as the assassination has happened. But they pointed out that because we are of different religious branches and even if the King is successfully killed, there is a high probability of civil war because the king's son may not easily hand over power."
 saudi.31.a:0 "We can set our plans in motion."

 saudi.32.t:0 "Iranians Reject Coup Proposal"
 saudi.32.d:0 "The elements of the Iranian government and underground we contacted have told us, in not too gentle terms, that they are uninterested in our proposal for a coup. They have threatened to reveal our plans to the Iranian government if we dare make the same offer again."
 saudi.32.a:0 "How unfortunate."

 saudi.34.t:0 "[?global.arabian_supporting_country.GetNameDef] Requests Recognition of [?global.arabian_revolt_country.GetNameDef]"
 saudi.34.d:0 "[?global.arabian_supporting_country.GetLeader], the leader of [?global.arabian_supporting_country.GetNameDef], has requested an immediate end to the war with the [?global.arabian_revolt_country.GetAdjective] rebels. The [?global.arabian_supporting_country.GetAdjective] diplomats encourage [ROOT.GetName] to recognize the independence of [?global.arabian_revolt_country.GetNameDef]. They don't explicitly state that [?global.arabian_supporting_country.GetNameDef] will go to war should we decide to refuse, but they clearly hint at the possibility."
 saudi.34.a:0 "They are right, we should end this colonial conflict now"
 saudi.34.b:0 "The war will end when [?global.arabian_revolt_country.GetNameDef] is defeated"

 saudi.35.t:0 "[?global.arabian_supporting_country.GetAdjective] Mediation Successful!"
 saudi.35.d:0 "[?global.arabian_supporting_country.GetLeader], the leader of [?global.arabian_supporting_country.GetNameDef], has successfully negotiated with [?global.arabian_colonial_country.GetLeader] on our behalf. [?global.arabian_colonial_country.GetLeader] has agreed to recognize [ROOT.GetAdjective] independence and ordered a cessation of hostilities between [?global.arabian_colonial_country.GetNameDef] and [ROOT.GetNameDef]. [ROOT.GetNameDefCap] will always be indebted to [?global.arabian_supporting_country.GetNameDef] for their help in our struggles."
 saudi.35.a:0 "Liberty at last"

 saudi.36.t:0 "[FROM.GetNameDefCap] Refuses to Recognize [?global.arabian_revolt_country.GetAdjective] Independence"
 saudi.36.d:1 "Despite our pressure, the [?global.arabian_colonial_country.GetAdjective] government refuses to recognize [?global.arabian_revolt_country.GetNameDef] and cease hostilities. The [?global.arabian_colonial_country.GetAdjective] seem set on destroying the independence movement. This is probably as far as we can get with diplomacy alone."
 saudi.36.a:0 "We tried at least"
 saudi.36.b:0 "Then we have to make them"

 saudi.37.t:0 "[FROM.GetName] Joins the War Against [?global.arabian_colonial_country.GetName]"
 saudi.37.d:1 "After having attempted at mediation in our war against [?global.arabian_colonial_country.GetNameDef] and failed, [?global.arabian_supporting_country.GetNameDef] has decided to actively start supporting the [ROOT.GetAdjective] struggle. The [?global.arabian_colonial_country.GetAdjective] ambassador to [?global.arabian_supporting_country.GetName] has been informed that [?global.arabian_supporting_country.GetNameDef] considers itself at war with [?global.arabian_colonial_country.GetName] from this point on, until the moment that [?global.arabian_colonial_country.GetNameDef] gives up it's imperialist and colonial ambitions in Africa and elsewhere."
 saudi.37.a:0 "The forces of [ROOT.GetName] and [?global.arabian_supporting_country.GetName] stand united!"
 
 saudi.38.t:0 "Freedom for [FROM.GetNameDef]"
 saudi.38.d:0 "After heavy diplomatic pressure from [ROOT.GetName], including direct meetings between [ROOT.GetLeader] and [?global.arabian_colonial_country.GetLeader], the [?global.arabian_colonial_country.GetAdjective] government decided to back down, and recognize [?global.arabian_revolt_country.GetAdjective] independence. \nThanks to direct [ROOT.GetAdjective] intervention, the war for [?global.arabian_revolt_country.GetAdjective] independence is finally over. [?global.arabian_revolt_country.GetNameDefCap] is a free country, and [ROOT.GetLeader] will surely for ever be a hero in [?global.arabian_revolt_country.GetNameDef]."
 saudi.38.a:0 "Another country liberated from the imperialists"

 saudi.41.t:0 "Saudi Arabian Oil Agreement"
 saudi.41.d:0 "An oil agreement has been proposed between Saudi Arabia and Germany, focusing on mutual benefits through trade and technology sharing. If accepted, it could boost both economies and solidify their geopolitical alliance."
 saudi.41.a:0 "This agreement will help both Germany and Arabia."
 saudi.41.b:0 "An unnecessary deal"

 saudi.42.t:0 "[From.GetNameDefCap] Accepts Our Offer"
 saudi.42.d:0 "The oil agreement has been accepted. Cooperation between our countries will begin immediately, promising prosperity and closer ties."
 saudi.42.a:0 "An important development for us"

 saudi.43.t:0 "[FROM.GetNameDefCap] Rejects Our Offer"
 saudi.43.d:0 "Our proposed oil agreement has been rejected. This may hinder future diplomatic efforts and weaken economic relations."
 saudi.43.a:0 "Unfortunate news"

 saudi.44.t:0 "[FROM.GetNameDefCap] seeks secret pact"
 saudi.44.d:0 "One of our covert agents stationed in [FROM.capital.GetCapitalVictoryPointName] has been approached with proposition from the [FROM.GetAdjective] government; A secret pact between our faction and [FROM.GetNameDef], which will mean they'll help us undermine our enemies in Europe, while keeping up their appearance of neutrality, and even abandoning it in our favor when the time comes.\n\nIt will also mean that we'll go in their defense if they were at risk of being invaded."
 saudi.44.a:0 "They'll be a great asset"
 saudi.44.b:0 "We don't need their help"

 saudi.45.t:0 "[FROM.GetNameDefCap] has accepted our secret pact"
 saudi.45.d:0 "Through our backchannels with [FROM.GetNameDef], we have confirmation that they have agreed to our proposed secret alliance. From now on, they'll have our support against their enemies, and protect us if we ever find ourselves at the edge of being invaded. This does not mean we are safe though, the enemy could reveal our actions and see them as a threat, so we must continue with the same caution we have shown so far, while we prepare for jumping into action."
 saudi.45.a:0 "It's for the sake of our democracy!"

 saudi.46.t:0 "[FROM.GetNameDefCap] has rejected our proposal!"
 saudi.46.d:0 "Terrible news from our contacts in [FROM.GetCapitalVictoryPointName]. It appears that the [FROM.GetAdjective] government has rejected our proposal for a secret pact, leaving us exposed to invasion from our neighbors. We must now prepare to defend ourselves, or look for another route to keep our independence and democracy."
 saudi.46.a:0 "We stand alone against our enemies."

 saudi.47.t:0 "Slaves Cause Unrest"
 saudi.47.d:0 "For a long time, we were expected to make a new regulation on slavery, but we did not. As a result, the slaves in our country could no longer bear the conditions and started to cause problems. Since we use slaves in many areas, if we do not regulate this issue immediately, it may cause us problems in the future."
 saudi.47.a:0 "We will think about it"

 saudi.48.t:0 "[FROM.GetNameDefCap] Request Protection from Us"
 saudi.48.d:0 "The Saudi government has formally requested protection from the United States. Despite their limited military capabilities, Saudi Arabia is one of the world's most crucial oil suppliers and holds significant geopolitical influence in the Middle East. Recognizing the growing regional threats and instability, they now seek American support to ensure their sovereignty and the continued flow of oil. We must decide defending this desert kingdom worth the commitment?"
 saudi.48.a:0 "We must protect our allies"
 saudi.48.b:0 "We can't allocate resources for this"

 saudi.49.t:0 "United States Accepts Protection Request"
 saudi.49.d:0 "The United States has officially agreed to our request for protection. American officials cited Saudi Arabia's vital role in global oil stability and its strategic position in the Middle East. Though our forces are limited in number, this alliance signals a powerful deterrent to any regional aggression. American advisors, equipment, and military guarantees will soon arrive and with them, a new chapter begins in our international standing."
 saudi.49.a:0 "Stronger together"

 saudi.50.t:0 "United States Denies Protection Request"
 saudi.50.d:0 "Our request for American protection has been rejected. Despite our strategic importance as an oil-rich nation, Washington has chosen not to intervene on our behalf. They claim limited capacity and competing global priorities. Without their shield, we remain exposed and must now find other ways to defend our sovereignty in an increasingly hostile region."
 saudi.50.a:0 "We didn't expect this"

 saudi.51.t:0 "[SAU.GetNameDefCap] Under Attack"
 saudi.51.d:0 "Our allies, [SAU.GetNameDef] have come under direct attack. [?SAU.agressor_country_var.GetName] has declared war, threatening the stability of the entire Middle East. Under the protection agreement we signed, we are now obligated to respond. Saudi Arabia may be limited in manpower, but its role as a global oil provider and strategic partner cannot be overstated. If we fail to act, we risk losing both influence and credibility in the region. nDo we stand by our word and defend our ally?"
 saudi.51.a:0 "We will keep our promise and help them"

 saudi.52.t:0 "The United States Comes to Our Aid"
 saudi.52.d:0 "Our enemy has brought war to our doorstep but we are not alone. The United States, honoring the protection pact, has declared war on our aggressors and committed to our defense. American support changes everything. Their military strength and global reach send a clear message. Reinforcements are already in motion, and a joint command is being prepared. Today, the air smells of war and freedom but also of hope."
 saudi.52.a:0 "With them beside us, we stand a chance"

 saudi.53.t:0 "[FROM.GetNameDefCap] Demands Neutrality in War"
 saudi.53.d:0 "Amid rising regional tensions, [FROM.GetNameDef] has formally requested that we remain neutral in the unfolding conflict. Their diplomats emphasized the strategic importance of Bab el-Mandeb the narrow strait that connects the Red Sea to the Gulf of Aden. Any hostile forces gaining access to this chokepoint would pose a serious threat to shipping lanes and the Suez Canal. They insist that our alignment with their enemies would not only endanger their position, but disrupt the stability of the entire region. Do we respect their request or chart our own course?"
 saudi.53.a:0 "Neutrality is the best option for us too"
 saudi.53.b:0 "They can't tell us what to do!"

 saudi.54.t:0 "[From.GetNameDefCap] Accepts Our Demand"
 saudi.54.d:0 "[From.GetNameDef] has agreed to remain neutral in the conflict. Their government stated that Yemen has no interest in becoming a battleground, especially near the Bab el-Mandeb strait a key waterway for global trade. This diplomatic victory ensures that the southern gate to the Red Sea remains secure, for now."
 saudi.54.a:0 "A relief for our naval strategy"

 saudi.55.t:0 "[FROM.GetNameDefCap] Rejects Our Demand"
 saudi.55.d:0 "[FROM.GetNameDef] has refused our request for neutrality. Officials in Sana'a declared that they would not be pressured into submission and that Yemen would act in accordance with its own interests. This defiance risks the security of Bab el-Mandeb and, by extension, access to the Red Sea and Suez Canal. The consequences could be severe if hostile powers gain a foothold there."
 saudi.55.a:0 "They will regret this recklessness"

 saudi.56.t:0 "[YEM.GetName] Breaks Its Neutrality"
 saudi.56.d:0 "Despite previous assurances, [YEM.GetNameDef] has abandoned its neutral stance and aligned with our enemies. Their decision directly threatens control over Bab el-Mandeb a critical maritime chokepoint that grants access to the Red Sea and the Suez Canal. This betrayal may complicate allied naval operations and give our opponents a strategic advantage in the region."
 saudi.56.a:0 "There will be a price for this betrayal!"
 saudi.56.b:0 "We don't have time to deal with them"

 saudi.57.t:0 "Drought Strikes the Heart of Arabia"
 saudi.57.d:0 "An unrelenting drought has settled over the heart of Arabia. In Nejd, wells have dried, pastures have turned to dust, and harvests have failed. Rural communities are fleeing toward urban centers, and desperation is growing among nomadic tribes. Our still fragile state lacks the infrastructure to deliver effective relief. King Abdulaziz has ordered aid through religious and tribal networks, but cracks are forming. If the skies remain silent, hunger and unrest may spread like wildfire."
 saudi.57.a:0 "Let us hope the rain returns before its too late."

 saudi.58.t:0 "Slaves Cause Unrest Again"
 saudi.58.d:0 "Despite the previous unrest and the warnings that followed, our government has yet to take any meaningful action to address the issue of slavery. Rumors now spread among tribal lands and in cities alike whispers of coordinated disobedience, organized escapes, and even rebellion. Any further instability may jeopardize our legitimacy at home and abroad. A final decision must be made before it's too late."
 saudi.58.a:0 "We can't afford to ignore this again"

 saudi.59.t:0 "[FROM.GetName] Demands Independence for Arab Minorities"
 saudi.59.d:0 "[FROM.GetName] has issued an official diplomatic demand urging us to grant full independence to our Arab population. Their government claims to represent the interests of all Arabs and insists that continued control over these regions is a form of unjust suppression. Although the tone of the demand is framed as peaceful and ideological, it carries clear geopolitical pressure. Accepting would mean a loss of territory but rejecting may provoke regional tension. The choice is ours."
 saudi.59.a:0 "We will recognize their independence"
 saudi.59.b:0 "We reject this interference in our affairs"

 saudi.60.t:0 "[From.GetNameDefCap] Grants Independence to Arab Minorities"
 saudi.60.d:0 "[From.GetNameDef] has accepted our demand and granted full independence to its Arab population. The banners of freedom rise across their former colonies, and our vision of a united Arab future draws closer. These newly independent nations look to us with gratitude and perhaps, alliance."
 saudi.60.a:0 "A step forward for Arab liberation"

 saudi.61.t:0 "[From.GetNameDefCap] Rejects Our Demand"
 saudi.61.d:0 "[From.GetNameDef] has outright rejected our call to free their Arab population. This refusal not only undermines our regional vision but openly denies the rights of our kin across the sea. Word of this insult spreads quickly among intellectuals, tribes, and even our armed forces. We now face a difficult decision pursue peace and protest through diplomacy, or lead the charge ourselves and liberate them by force."
 saudi.61.a:0 "We will free our brothers by any means necessary!"
 saudi.61.b:0 "We are not yet strong enough... but the day will come"

 saudi.62.t:0 "Member Country Requests Civilian Investment" #TODO Loclar değişebilir
 saudi.62.d:0 "Though [FROM.GetName] is now an integral part of our state, representatives from its former administrative body — now active within the Federal Council — have petitioned us to invest in their region's civilian infrastructure. They argue that the path to a stable and united Arab Federation lies not only in centralized authority but in fair regional development. Supporting this effort would strengthen federal unity, but divert some of our own resources."
 saudi.62.a:0 "They are right we must invest in every corner of the Federation"
 saudi.62.b:0 "Now is not the time our priorities lie elsewhere"

 saudi.63.t:0 "Member Country Requests Military Investment" #TODO Loclar değişebilir
 saudi.63.d:0 "Delegates representing [FROM.GetName] in the Federal Defense Committee have called for the construction of military factories within their territory. Though now under our full authority, their region remains strategically important — and their leaders argue that it must not be left behind in the rearmament process. Investing in this region would demonstrate our commitment to equal defense capabilities across the Federation, but would come at a cost to our own production."
 saudi.63.a:0 "Let every part of the Federation be ready for war"
 saudi.63.b:0 "Their defenses can wait we must consolidate first"

 saudi.65.t:0 "King Abdulaziz Recovers"
 saudi.65.d:0 "What was feared to be the end of an era has taken a miraculous turn. Against the expectations of his physicians and advisors, King Abdulaziz has made a full recovery. The fever has broken, and his strength returns day by day. News of the King's survival has brought immense relief to the palace, the government, and the people. For now, the line of succession recedes into the background, and the Kingdom remains under the rule of its founding monarch. Though the crisis revealed our vulnerability, it has also reminded us of the resilience of the man who built Arabia from the sands."
 saudi.65.a:0 "Long live the King!"

 saudi.66.t:0 "A Shadow Grows in Arabia"
 saudi.66.d:0 "Reports from across the border suggest that Amin al-Husseini has found refuge in Saudi Arabia. While his public presence remains quiet, rumors point to a deeper plan in motion — one that involves stirring unrest within our own borders. Though nothing concrete has emerged yet, the mere presence of the Mufti in Riyadh is cause for concern."
 saudi.66.a:0 "We must remain vigilant"

 saudi.67.t:0 "A New Arab Authority in Palestine"
 saudi.67.alt.t:0 "The Fall of the Regime"
 saudi.67.d:0 "A sudden wave of uprisings, coordinated by pro-Arab forces, has swept through the Palestinian territories. The existing control has collapsed under the pressure of popular unrest. In the aftermath, a new government led by Amin al-Husseini has declared itself the rightful authority — under the protective wing of Saudi Arabia."
 saudi.67.alt.d:0 "Amid growing unrest and fractures within our political structure, a sweeping revolt has taken hold. Backed ideologically and materially by Saudi Arabia, revolutionaries have seized power and declared a new government. Amin al-Husseini has assumed leadership, and the state now aligns itself closely with Riyadh's vision for the region."
 saudi.67.a:0 "The region has fallen to Arab influence"

 saudi.68.t:0 "Victory in Palestine"
 saudi.68.d:0 "Our support has borne fruit. The fires of revolution have engulfed the old regime in Palestine, and under the leadership of Amin al-Husseini, a new Arab administration now rises. With banners raised and loyalty pledged, they have aligned themselves under our protection. The call for Arab unity has found another voice — and it speaks from Jerusalem."
 saudi.68.a:0 "Another step toward our vision of the Arab world."

 saudi.69.t:0 "Rumblings in the Holy Land"
 saudi.69.d:0 "Recent intelligence suggests a growing undercurrent of unrest in the former Palestinian territories. Whispers of coordination, arms movements and ideological agitation point toward external involvement with fingers clearly directed at Saudi Arabia. While nothing is confirmed, the pattern is disturbingly familiar: where Amin al-Husseini walks, revolution tends to follow."
 saudi.69.a:0 "We must keep our eyes on the ground."

 saudi.70.t:0 "Nationwide Labor Protests"
 saudi.70.d:0 "What began as isolated grievances in the oil fields has rapidly spread across the Kingdom. Arab workers from various sectors have joined the movement, protesting the stark disparity in pay and working conditions between themselves and the Soviet specialists employed in our development projects. Chants for dignity, equality and reform now echo from urban workshops to desert towns. The protests grow louder by the day and unless addressed swiftly, they may spiral into a broader crisis."
 saudi.70.a:0 "We cannot afford to ignore this unrest any longer."

 saudi.71.t:0 "The Red King"
 saudi.71.d:0 "As Soviet advisors grow bolder in their demands, the palace has begun to quietly implement reforms long considered unthinkable. Restrictions rooted in Sharia law are being eased. Influential clerics find themselves sidelined. Whispers spread that the King listens more to foreign workers than to the faithful. In the streets, some call him the "Red King" — a bitter nickname that signals the widening rift between ruler and ruled. In the eyes of many, he is no longer the Guardian of tradition, but the herald of a new and unfamiliar order."
 saudi.71.a:0 "The price of progress is never cheap."

 saudi.72.t:0 "A New Order in Arabia"
 saudi.72.d:0 "In a bold and unprecedented move, King Abdulaziz has been removed from power. The reins of the Kingdom now rest in the hands of Karim Khakimov once a Soviet diplomat, now the political architect of a revolutionary Arabia. In exchange for stability and Soviet recognition, the new administration has granted the USSR full access to military transit and port facilities across the Kingdom. While some celebrate the dawn of progress, others whisper that Arabia has become little more than a satellite draped in red."
 saudi.72.a:0 "A new dawn rises over the desert."
 saudi.72.b:0 "They serve the cause better as a satellite."

 saudi.73.t:0 "A Loyal Partner"
 saudi.73.d:0 "As the new socialist order stabilizes, our alignment with Moscow has grown stronger. Soviet advisors play an integral role in shaping policy, overseeing logistics and securing our long-term development. While we remain a sovereign nation in name, the influence of our northern comrades is both visible and profound. Some view this as a necessary step toward global solidarity others wonder when we might shape our own path within the socialist family."
 saudi.73.a:0 "For now, cooperation is strength."

 saudi.74.t:0 "[From.GetNameDefCap] Appeals for Autonomy"
 saudi.74.d:0 "Though eager to continue to prove their loyalty and do their part for the Revolution, [From.GetAdjective] representatives have pleaded their case for an increase in autonomy. They argue that, should we loosen the reins somewhat, they will be able to much better aid our cause."
 saudi.74.a:0 "They have earned our trust."
 saudi.74.b:0 "But keeping the reins tight is even better."

 saudi.75.t:0 "[From.GetNameDefCap] Grants Autonomy"
 saudi.75.d:0 "Our representatives in [From.GetNameDef] inform us that the [From.GetAdjective] government has deemed fit to grant us more autonomy."
 saudi.75.a:0 "Progress!"

 saudi.76.t:0 "[From.GetNameDefCap] Rejects Autonomy"
 saudi.76.d:0 "Our representatives in [From.GetNameDefCap] inform us that the [From.GetAdjective] government has rejected our appeal for more autonomy."
 saudi.76.a:0 "Do they not trust us?"

 saudi_news.1.t:0 "[GetProtocolCityName] Protocol Signed"
 saudi_news.1.alt.t:0 "Riyadh Protocol Signed"
 saudi_news.1.d:0 "In a historic summit held in [GetProtocolCityName], representatives of Arab nations gathered under the leadership of [SAU.GetLeader] to sign what is now being called the [GetProtocolCityName] Protocol. This agreement lays the foundation for a Arab bloc — militarily, economically, and culturally. The summit was marked by passionate speeches and a collective vision for the Arab world to stand as one in the face of foreign dominance. [SAU.GetLeader] proclaimed that 'The era of fragmentation is over; the dawn of Arab unity has begun.'\nWhile many nations signed the protocol and embraced this new alliance, some states refused to join, expressing concern over sovereignty and regional influence. Whether this agreement becomes the cornerstone of a new Arab century or a short-lived dream will be determined in the years to come."
 saudi_news.1.a:0 "A new era begins for the Arab world"
 saudi_news.1.b:0 "An ambitious move and only time will tell its success"

 saudi_news.2.t:0 "The United States Intervenes to Defend Saudi Arabia"
 saudi_news.2.d:0 "In a dramatic escalation, the United States has declared war on [?SAU.agressor_country_var.GetName], following an attack on Saudi Arabia. The White House invoked the recent protection agreement signed with Riyadh, stating that 'an attack on Saudi Arabia is an attack on stability itself.'\n\nAmerican troops are reportedly mobilizing, and air and naval assets have already been deployed to the region. This intervention transforms what might have been a regional conflict into a global flashpoint, as Washington makes clear that it will not abandon its allies especially one as vital to global oil supply and strategic balance as Saudi Arabia. World capitals are now watching closely: the desert burns, and a superpower has entered the fray."
 saudi_news.2.a:0 "The lines are drawn and war has come"
 saudi_news.2.b:0 "Another imperialist war under the banner of 'freedom'"











