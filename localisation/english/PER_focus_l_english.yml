l_english:
 #Political
 PER_dictatorship_of_reza_shah_pahlavi:0 "Dictatorship of Reza Shah Pahlavi"
 PER_dictatorship_of_reza_shah_pahlavi_desc:0 "Even if we want to bring democracy, rights and freedoms to our country, we cannot take the risk that foreign states and traitors within our country will tear our country apart. Until our country is ready for these innovations, we have no other option but a strict rule with a one-man regime."
 PER_weakening_influence_clergy:0 "Weakening Influence of Clergy"
 PER_weakening_influence_clergy_desc:0 "For centuries, if we tried to make an innovation in our country, we could not realize it because of the bigoted and backward-minded clergy. But now this era will end. Destroying the influence of the clergy on our country will be the first step of the reforms we will make."
 PER_empowerment_women:0 "Empowerment of Women"
 PER_empowerment_women_desc:0 "Women are not just a piece of meat. One of the most important steps for our country to reach the level of advanced civilizations is for women to have equal rights with men from now on, no woman will feel weak in front of a man."
 PER_women_in_the_army:0 "Women in the Army"
 PER_women_in_the_army_desc:0 "Now that women no longer have to live a life of imprisonment at home, they can contribute to the defense of our country We need everyone, men and women, to prevent our country from being destroyed once again."
 PER_adult_literacy_campaign:0 "Adult Literacy Campaign"
 PER_adult_literacy_campaign_desc:0 "A modern state cannot function with an uneducated population. By launching a nationwide literacy campaign, we seek to empower our citizens, improve administration, and lay the foundations for lasting modernization."
 PER_blackmail_the_clergy:0 "Blackmail the Clergy"
 PER_blackmail_the_clergy_desc:0 "Although the clergy are known to be moral, it is clear that some of them do not conform to the morality of this people. Some of them were blocked when they were going to be uncovered by some journalists. And these are... Some of these are disgusting. We think that the clergy would also like them not to be known."
 PER_enforce_the_hat_and_dress_code:0 "Enforce the Hat and Dress Code"
 PER_enforce_the_hat_and_dress_code_desc:0 "In August 1927, Reza Shah Pahlavi passed a law. Just like Mustafa Kemal Ataturk, the founder of the Republic of Turkey, a few clothes and related laws to get rid of the reaction of the East and integrate into the Western world. Although we have passed a law like this, we have not been able to implement it. Now it's time to implement"
 PER_continued_reform:0 "Reforms successful"
 PER_continued_reform_desc:0 "Our reforms have been successful Our women are no longer slaves to men Our army and industry have not become obsolete We have secured the existence of our country for years to come Long live Reza Shah Pahlavi Long live Iran!"
 PER_invite_islamists_to_government:0 "Invite Islamists to the Government"
 PER_invite_islamists_to_government_desc:0 "No matter how much we break the pressure of the clergy in our country, it is impossible to remove religion from our country. But if we invite Islamists to the government and win their support, it will be easier for us to realize our reforms."
 PER_side_with_islamists:0 "Side With Islamists"
 PER_side_with_islamists_desc:0 "Destroying the clergy means destroying our country and disregarding our civilization that has grown with Islam for centuries. What we need to do is to destroy the traitors among the clergy and move on with the remaining faithful."

 #Democratic
 PER_democratic_principles:0 "Democratic Principles"
 PER_democratic_principles_desc:0 "At a time when the world is democratizing and developing, we must not still be stuck in outdated forms of governance, we must respect human and minority rights, respect elections, create an equal and properly functioning legal system and build the best country for our people."
 PER_pahlavi_with_republic:0 "Democratic Dictatorship"
 PER_pahlavi_with_republic_desc:0 "The Shah announced plans to restart elections in Iran. This plan was interpreted as transforming Iran into a democratic country and increasing the political participation of the people. But there were also some concerns. Some feared that the Shah could use the elections to protect his own interests and was not interested in establishing a real democracy. Others argued that Iran was not yet ready for democracy and that the elections could lead to political instability. Time will tell whether this democracy will turn into a dictatorship."
 PER_illusions_of_a_democratic_system:0 "Illusions of a Democratic System"
 PER_illusions_of_a_democratic_system_desc:0 "Although our people want democracy, neither they nor our country are ready for it, but if we integrate some important parts of democracy into our country, we can keep the trust of our people in us."
 PER_arrest_criminals:0 "Arrest Criminals"
 PER_arrest_criminals_desc:0 " Shah Reza Pahlavi took a series of harsh measures to consolidate his authority and suppress dissent. In this context, on the orders of the Shah, many people who were considered political criminals were arrested. These arrests have led to restrictions on political freedoms and increased repression in Iran.\n\nAmong those arrested were members of opposition parties, journalists, intellectuals and students. They were accused of criticizing or opposing the Shah's regime. Those arrested were convicted without a fair trial, and many were sentenced to long prison terms."
 PER_restore_constitutionalism:0 "Restore Constitutionalism"
 PER_restore_constitutionalism_desc:0 "“No power can be above the constitution.” This should be the cornerstone of any country, be it an emperor, king or shah, if it refuses to obey the law, it should be punished according to the law."
 PER_an_election_for_the_future:0 "An Election for the Future"
 PER_an_election_for_the_future_desc:0 "The Shah decided to hold general elections in Iran for the first time in many years. This decision caused a great deal of excitement in Iran and was interpreted as an important step towards democracy in the country. There is still no complete idea of what the choice will be like. Although there were local election trials, it was announced that the election techniques would be taken as an example from Turkey, and that observers from Turkey would be called."
 PER_constitutional_monarchy:0 "Constitutional Monarchy"
 PER_constitutional_monarchy_desc:0 "We cannot ignore the good that the Pahlavi dynasty has brought to our country. Instead of exiling the dynasty, we should restrict its powers through constitutional monarchy and give absolute power to the people."
 PER_abolish_the_monarchy:0 "Abolish the Monarchy"
 PER_abolish_the_monarchy_desc:0 "If we want democracy, we must eliminate everything that stands in the way of it, including the monarchy, no matter how much they work on behalf of our country, the monarchy has no place in the new modern and democratic Iran."
 PER_confiscate_pahlavi_assets:0 "Confiscate Pahlavi's Assets"
 PER_confiscate_pahlavi_assets_desc:0 "Now that we have expelled the dynasty that has been exploiting the country by living a rich and luxurious life with the tax and state revenues of our people for years, we can confiscate their assets and use this money for the development of our country."
 PER_open_the_parliament:0 "Open the Parliament"
 PER_open_the_parliament_desc:0 "Now that the government is in the hands of our people, we can open the parliament that will represent the wishes of our people and we can take a step closer to the bright future of our country."
 PER_work_with_monopolies:0 "Work with Monopolies"
 PER_work_with_monopolies_desc:0 "Although it is not entirely good that there are monopolies in the country, the consequences of eliminating them would be catastrophic. In contrast, we should establish an alliance with these great magnates to benefit the State from this economic phenomenon."
 PER_public_education:0 "Public Education"
 PER_public_education_desc:0 "Education should be a public service run solely by the State. If we allow this work to be carried out privately, our young people will end up indoctrinated according to the political ideals of the teacher. Education must be secular and without political tendencies."
 PER_get_rid_of_corruption:0 "Get Rid of Corruption"
 PER_get_rid_of_corruption_desc:0 "Corruption is like a cancer of a country we must launch raids, follow-ups and interrogations throughout the country we must catch the traitors who covet the people's money one by one and remove this cancer from our country."
 PER_economic_reforms:0 "Economic Reforms"
 PER_economic_reforms_desc:0 "Now that we have made our country a modern and modern and modern country, the next step is to fix our economy. With the support of the Iranian people, we can make our economy the best economy in the Middle East in a very short time."
 PER_put_religious_affairs_under_state_control:0 "Put Religious Affairs Under State Control"
 PER_put_religious_affairs_under_state_control_desc:0 "Religion is an important part of our country and our people, but if left unchecked it can poison our people. By placing religious affairs under state control, we would be able to prevent surveillance of the clergy and prevent the spread of heretical ideas among our people."
 PER_nationalize_aioc:0 "Nationalize AIOC"
 PER_nationalize_aioc_desc:0 "Although we have one of the richest oil resources in the Middle East, the imperialist British officially exploit the oil resources of our country and do not give us the money and oil they promised us. If they do not comply with the agreements, we do not have to comply with this agreement."
 PER_fight_against_illiteracy:0 "Fight Against Illiteracy"
 PER_fight_against_illiteracy_desc:0 "Ignorance is one of the biggest enemies of a country. Knowledge is the basis for building a great army, economy and country We will open schools and universities across the country. We will prepare the young generation for the bright future and thus enter the Iranian century."
 PER_complete_reforms:0 "Complete Reforms"
 PER_complete_reforms_desc:0 "We have finally succeeded, our country has advanced in science and technology, we are the shining diamond of the Middle East in terms of industry, our army has become one of the most elite armies in the world, our women are not imprisoned at home A bright future awaits our country."
 PER_the_sadabat_pact:0 "the Saadabad Pact"
 PER_the_sadabat_pact_desc:0 "[PER.GetLeader] announced plans to turn the Saadabad Pact into a military alliance to ensure regional stability and security. [PER.GetLeader]'s plan encouraged the Saadabad Pact countries (Turkey, Afghanistan, Iraq and Iran) to create a common defense system and organize joint military exercises. This plan also included facilitating the trade of weapons and military equipment between countries and increasing intelligence sharing."
 PER_technology_sharing:0 "Saadabad Technology Exchange"
 PER_technology_sharing_desc:0 "[PER.GetLeader] announced plans to launch a technology exchange program with the Saadabad Pact countries. This program was aimed at increasing Iran's access to modern technologies and accelerating the industrialization of the country.\n\nThe Saadabad Pact was a regional cooperation agreement involving Turkey, Iran, Afghanistan and Iraq. This agreement was intended to promote peace and stability among the countries of the region and to protect common interests. [PER.GetLeader] saw the Sadabad Pact not only as a political cooperation, but also as a platform for economic and technological development."
 PER_invite_kemalist_officers:0 "Invite Kemalist Officers"
 PER_invite_kemalist_officers_desc:0 "In Iran in the 1930s, [PER.GetLeader] was taking important steps to modernize and develop the country. In this context, He invited a group of Kemalist officers from Turkey to Iran. These officers were assigned to help modernize and train the Iranian army.  [PER.GetLeader] also added that Iran will always remain an independent country and will continue to exercise self-determination."
 PER_adapt_six_arrows:0 "Adapt Six Arrows"
 PER_adapt_six_arrows_desc:0 "The six basic principles known as the Six Arrows, which were put forward by Ataturk, were put forward by [PER.GetLeader] to modernize and develop the country. These principles consisted of nationalism, progressivism, secularism, republicanism, egalitarianism and populism.  These were the principles that a civilized people needed."
 PER_our_own_path:0 "Our Own Path"
 PER_our_own_path_desc:0 "Our destiny is different from that of any other nation, we cannot afford to ally ourselves with someone. The only country we trust is ourselves, and we will keep it that way."
 PER_invite_other_countries:0 "Invite Other Countries"
 PER_invite_other_countries_desc:0 "According to the [PER.GetLeader]'s plan, important countries of the Middle East, such as Turkey, Afghanistan, Iraq and Saudi Arabia, would join this new bloc. These countries aimed to increase regional development and prosperity by cooperating on a common political and economic platform. The Shah also believed that this bloc would help maintain regional peace and stability and create deterrence against external threats."
 PER_go_against_communism:0 "Oppose Communism"
 PER_go_against_communism_desc:0 "Communism is the backbone of mass starvation and exploitation of the working class. They claim they are for the workers, when in reality they are the complete opposite. We must rid ourselves of these communist scums."
 PER_increase_military_investment:0 "Increase Military Investments"
 PER_increase_military_investment_desc:0 "The economic and logistical component of conflict is just as vital to our survival as the battles on the front lines. As such, we should invest in our arms industry to ensure they can continue to supply our forces with all the equipment they need."
 PER_join_allies:0 "Join the Allies"
 PER_join_allies_desc:0 "Let's make it official, it's time to ask the British if we can join the Allies. They are this world's saving grace, with the warmongerers of the Germans ruining the life of millions and throwing the world of chaos. We must give the Allies as much of our support as possible."
 PER_more_funds_to_scientists:0 "More Funds to Scientists"
 PER_more_funds_to_scientists_desc:0 "A Persian proverb says that if the donkey needs food, you will give it food, and if it needs a beating, you will beat it. We are also hungry for education right now."
 PER_military_aid:0 "Military Aid"
 PER_military_aid_desc:0 "The Allies have a vast array of arms manufacturers, we should make use of them to rapidly modernize our armed forces."
 PER_revise_the_oil_agreement:0 "Revise the Oil Agreement"
 PER_revise_the_oil_agreement_desc:0 "Current Oil deals. It has a heavy impact on the Iranian economy. That is why we will present a bill to our friend the United Kingdom. AIOC will be transformed into BP, so that both sides will benefit."
 PER_learn_british_naval_techniques:0 "Learn British Naval Techniques"
 PER_learn_british_naval_techniques_desc:0 "The British are undoubtedly the kings of this planet when it comes to navy. The Royal Navy has been through so many different things throughout all the time it has existed, and thanks to that it reached the top of all naval rankings. We can learn many things from this large navy thanks to being in an alliance with the British."
 PER_preemptive_invasion_of_iraq:0 "Preemptive Invasion of Iraq"
 PER_preemptive_invasion_of_iraq_desc:0 "The political instability in Iraq also reduces the stability of Iran. We have also heard that Iraq will reject the supremacy of the United Kingdom. Before we do that, we have to do it."

 #Shah
 PER_continue_pahlavi_dictatorship:0 "Continue Pahlavi Dictatorship"
 PER_continue_pahlavi_dictatorship_desc:0 "Reza Shah must consolidate his power and maintain his personal dictatorship to ensure the stability and progress of Iran.
 PER_deal_with_clergy:0 "Deal With Clergy"
 PER_deal_with_clergy_desc:0 "The clergy hold significant power in Iran. To modernize our nation, we must reduce their influence."
 PER_trail_against_fifty_three:0 "Trial Against the Fifty-Three"
 PER_trail_against_fifty_three_desc:0 "A group of radical intellectuals known as the 'Fifty-Three' has been arrested for plotting against the state. Their trial sends a clear message to all who would spread subversive ideology: Iran shall not tolerate disorder, no matter how eloquently it is justified."
 PER_supress_the_opposite_side:0 "Supress the Opposite Side"
 PER_supress_the_opposite_side_desc:0 "Suppressing opposing ideologies is crucial to prevent them from gaining popularity among the people."
 PER_invest_in_education:0 "Invest in Education"
 PER_invest_in_education_desc:0 "Investing in education is vital for our nation's future. By improving literacy rates, we aim to create a more enlightened and skilled populace."
 PER_expand_the_shahrbani:0 "Expand the Shahrbani"
 PER_expand_the_shahrbani_desc:0 "The Shahrbani, our police force, needs expansion and modernization to maintain order and enforce our policies. This is a necessary step to reduce crime rates."
 PER_forced_secularization:0 "Forced Secularization"
 PER_forced_secularization_desc:0 "To fully modernize Iran, we must enforce secularism. Eliminating the clergy's influence is impossible without a secular society. It is difficult but necessary to secularize our population."
 PER_adopt_western_law_codes:0 "Adopt Western Law Codes"
 PER_adopt_western_law_codes_desc:0 "To move forward, we must let go of archaic judicial traditions. By adopting Western-inspired legal codes, we standardize justice, reduce corruption, and align our institutions with the modern world without sacrificing our national identity."
 PER_persian_german_trade_chamber:0 "Persian German Trade Chamber"
 PER_persian_german_trade_chamber_desc:0 "Germany’s industrial expertise and economic strength present an opportunity for Iran. Establishing a joint trade chamber will facilitate investment, exports and industrial modernization so long as we keep diplomatic balance."
 PER_remove_the_british_reppesion:0 "Remove the British Repression"
 PER_remove_the_british_reppesion_desc:0 "In recent years, the repressive regime implemented by the British in Iran has attracted the anger and reaction of our people. This colonial power carries out arbitrary practices on our lands, exploits our economy and restricts our freedoms. We can no longer tolerate this cruelty!\n\nThe cruelty of the British manifests itself in all areas. They are dragging our people into poverty by exploiting our economy. They are trying to suppress our voices by restricting our political freedoms. They also implement repressive policies in the fields of education and culture."
 PER_subsidize_key_industries:0 "Subsidize Key Industries"
 PER_subsidize_key_industries_desc:0 "We will finance key industries to encourage the opening of more factories and boost our economy. It is crucial for economic growth and development."
 PER_deal_with_corruption:0 "Deal With Corruption"
 PER_deal_with_corruption_desc:0 "Corruption in our government has reached intolerable levels, harming the state. We must take strict measures to eradicate corruption and restore integrity."
 PER_budget_adjustment:0 "Budget Adjustment"
 PER_budget_adjustment_desc:0 "By making budget adjustments, we aim to balance our military and civilian economies. We need this adjustment for ensure sustainable growth in our country."
 PER_increase_military_spending:0 "Increase Military Spending"
 PER_increase_military_spending_desc:0 "With the world on the brink of conflict, it is essential to increase our military investments. We need enhance our defense capabilities to protect our nation."
 PER_integrate_the_gendarmerie:0 "Integrate Gendarmerie into the Army"
 PER_integrate_the_gendarmerie_desc:0 "For too long, the gendarmerie and the army have operated with overlapping mandates. Unifying them under a single command will improve discipline, enhance mobility, and bring much-needed clarity to our internal security forces."
 PER_diplomatic_neutrality:0 "Diplomatic Neutrality"
 PER_diplomatic_neutrality_desc:0 "As the world's political atmosphere becomes tense, Iran's position in international relations is beginning to be questioned. In a recent article, a journalist examines the concept of "Diplomatic Neutrality" and questions what this policy means for Iran. Sooner or later, our neutrality will be broken, but we will not be the ones to break it!"
 PER_take_anti_german_measures:0 "Take Anti-German Measures"
 PER_take_anti_german_measures_desc:0 "With global war looming and pressure mounting from the Allies, we can no longer afford to appear aligned with the Axis. Restricting German activity in our territory will appease British and Soviet concerns though not without consequence."
 PER_promote_nationalism:0 "Promote Nationalism"
 PER_promote_nationalism_desc:0 "Promoting nationalism will boost recruitment efforts and strengthen our military. A prepared and active army is essential in case of an attack on our country."
 PER_strengthen_regime:0 "Strengthen Regime"
 PER_strengthen_regime_desc:0 "At a time when Iran needs national unity and a strong leader, the strengthening of the regime will provide them. After all, Reza Shah Pahlavi rules our country for us!"
 PER_fortification_effort:0 "Fortification Effort"
 PER_fortification_effort_desc:0 "Border is honor. Other than that, nothing can be said. It is also a crime to say it. War refugees cannot cross our borders or jump over our huge walls."
 PER_lift_the_hijab_ban:0 "Lift the Hijab Ban"
 PER_lift_the_hijab_ban_desc:0 "Though intended as a symbol of modernization, the hijab ban has alienated large portions of our population. By reversing this policy, we reassert cultural respect and national unity without halting progress in other domains."
 PER_extensive_recruitment:0 "Extensive Recruitment"
 PER_extensive_recruitment_desc:0 "We need to greatly increase our active military capacity in order to better maintain order in the territories we occupy and to better counter future aggression. Otherwise we may be caught unawares."

 #Persian
 PER_embrace_persian_identity:0 "Embrace Persian Identity"
 PER_embrace_persian_identity_desc:0 "At a time of nostalgia for the past and hope for the future, Reza Shah Pahlavi argues that Iranians should be proud of their historical and cultural heritage and strive to pass it on to future generations."
 PER_assign_fazlollah_zahedi:0 "Assign Fazlollah Zahedi"
 PER_assign_fazlollah_zahedi_desc:0 "There has been an important development in the political arena of Iran. The Shah appointed Fazlollah Zahedi, an experienced statesman, as prime minister. This appointment marks significant changes in Iran's domestic and foreign policy.\n\nZahedi has had a long and successful bureaucratic career. Zahedi is known for his honesty, diligence, and patriotism. And it is also said that it comes from the Safavid dynasty."
 PER_crush_illegal_religious_activity:0 "Crush Illegal Religious Activity"
 PER_crush_illegal_religious_activity_desc:0 "Certain clerical circles have begun operating outside state supervision, spreading unauthorized teachings and challenging the authority of the Shah. We must act swiftly to dismantle these parallel religious structures before they grow into sources of resistance."
 PER_reorganize_the_government:0 "Reorganize the Government"
 PER_reorganize_the_government_desc:0 "Iran's new prime minister, Fazlollah Zahedi, has been taking important steps to modernize and develop the country since taking office. One of these steps is the reorganization of the government.\n\nZahedi is making changes to the government structure to make bureaucracy more efficient and reduce corruption. These changes include merging or abolishing some ministries and creating new ministries."
 PER_strategic_nationalizations:0 "Strategic Nationalizations"
 PER_strategic_nationalizations_desc:0 "Iran's new prime minister, Fazlollah Zahedi, has taken an important step to boost the country's economy and reduce foreign domination. Zahedi nationalized some strategic sectors, such as oil refineries.\n\nThese nationalizations are an important step to consolidate Iran's economic independence and sovereignty. Foreign companies have been making unfair profits from Iran's natural resources and infrastructure for many years. Zahedi's move will put an end to this exploitation and ensure that the Iranian people benefit from these resources fairly."
 PER_began_militarization:0 "Began Militarization"
 PER_began_militarization_desc:0 "Iran's new prime minister, Fazlollah Zahedi, wants to speed up the armament program to ensure the country's national security. To this end, in a statement on [GetMonth] 	[GetYear], he announced his new plans for the New Militarisation Plan.\n\nZahedi argues that Iran is facing increasing regional threats and needs a strong army to counter these threats. Therefore, new investments will be made to equip Iran's army with modern weapons and equipment, as well as to increase the number of troops."
 PER_compulsory_education:0 "Compulsory Education"
 PER_compulsory_education_desc:0 "Iran's new prime minister, Fazlollah Zahedi, has taken an important step to modernize and develop the country. Zahedi announced that he would introduce compulsory education for all Iranian children.\n\nThis decision is a historic milestone in Iran's education system. Compulsory education will ensure that all children learn literacy and basic skills, which will help to increase the country's overall literacy rate."
 PER_reform_the_shahrbani:0 "Reform the Shahrbani"
 PER_reform_the_shahrbani_desc:0 "Iran's new prime minister, Fazlollah Zahedi, is taking important steps to modernize the country's law enforcement agencies and make them more efficient. One of these steps is the reform of Shahrebani.\n\nZahedi argues that Shahrebani suffers from corruption and incompetence. Therefore, he prepared a new plan to make Shahrebani a more modern and professional police force."
 PER_the_dream_of_persian_empire:0 "the Dream of Persian Empire"
 PER_the_dream_of_persian_empire_desc:0 "Iran's new prime minister, Fazlollah Zahedi, has an ambitious vision. Zahedi wants to restore Iran to its former glory and make it a leading power in the region. To achieve this goal, Zahedi implemented a series of reforms to modernize the country politically, economically and militarily.\n\nAt the heart of Zahedi's vision is the idea of reviving the Persian Empire. Zahedi is a nationalist who is proud of Iran's historical and cultural heritage. He believes that Iran can restore its past glory and become a major power in the region."
 PER_attack_iraq:0 "Attack Iraq"
 PER_attack_iraq_desc:0 "Reports this morning indicate that Iranian Prime Minister General Fazlullah Zahedi is planning a military operation against Iraq. The move marks an escalation of long-standing tensions between the two countries.\n\nAlthough the reasons behind Zahedi's decision are not fully known, Iraq's recent increase in provocations and espionage activities on the Iranian border may have played a triggering role. In addition, Zahedi's desire to consolidate his image as a nationalist leader may have played a role in this decision."
 PER_exploit_the_iraqi_oil:0 "Exploit the Iraqi Oil"
 PER_exploit_the_iraqi_oil_desc:0 "After our capture of Iraq, we will re-drill the wells that were not deigned to be used by the Iraqi government, but which are all ores. In this way, we will achieve our dream of a Persian Empire one step further."
 PER_attack_afghanistan:0 "Attack Afghanistan"
 PER_attack_afghanistan_desc:0 "Shocking news this morning suggests that Iranian Prime Minister General Fazlullah Zahedi is planning a military operation against Afghanistan. The move has caused a great deal of consternation and concern in the region."
 PER_demand_syria:0 "Demand Syria"
 PER_demand_syria_desc:0 "Syria once lay within the heart of the Persian Empire. As regional tensions rise, we must revive our historic claims and assert rightful influence over these lands — whether through diplomacy or force."
 PER_demand_egypt:0 "Demand Egypt"
 PER_demand_egypt_desc:0 "Through diplomatic pressures and negotiations, we demand control over Egypt's affairs, aiming to exert our influence over their government and strategic interests. This assertive move may escalate tensions in the region and potentially lead to conflicts as we seek to solidify our dominance in the Middle East."
 PER_destabilize_turkey:0 "Destabilize Turkey"
 PER_destabilize_turkey_desc:0 "We seek to undermine Turkey's stability through covert actions, propaganda campaigns, and subversion. By exploiting existing internal divisions, supporting dissident groups, and inciting unrest, we aim to weaken Turkey's influence and control in the region. Destabilizing Turkey will pave the way for our expansionist ambitions and enhance our geopolitical standing."
 PER_attack_first_tr:0 "Surprise Attack on Turkey"
 PER_attack_first_tr_desc:0 "Our plan involves launching a sudden and unexpected military assault on Turkey, catching them off guard and capitalizing on strategic vulnerabilities. By employing swift and decisive tactics, we aim to achieve significant territorial gains, cripple Turkey's military capabilities, and establish our dominance in the region. This surprise attack will serve as a bold statement of our power and determination."
 PER_declare_persian_empire:0 "Declare Persian Empire"
 PER_declare_persian_empire_desc:0 "We boldly declare the establishment of a new Persian Empire, signaling our aspirations for regional hegemony and territorial expansion. By invoking the glory of ancient Persia and reclaiming our imperial legacy, we seek to assert our dominance over neighboring states and solidify our position as a major power in the Middle East. This declaration heralds a new era of Persian resurgence and ambition."
 PER_prepare_for_one_last_war:0 "Prepare For One Last War"
 PER_prepare_for_one_last_war_desc:0 "In anticipation of an imminent and decisive conflict, we mobilize our nation's resources and prepare for war. By bolstering our military capabilities, fortifying our defenses, and rallying the populace, we aim to ensure victory in the face of adversity. This preparation represents our unwavering commitment to safeguarding our sovereignty and achieving our strategic objectives, whatever the cost."
 PER_retake_our_central_asian_lands:0 "Retake Our Central Asian Lands"
 PER_retake_our_central_asian_lands_desc:0 "Asserting our historical claims and territorial rights, we embark on a campaign to retake our lost lands in Central Asia. By mobilizing our military forces, forging alliances with sympathetic factions, and deploying diplomatic maneuvers, we aim to reclaim our rightful territories and restore the glory of our empire. This endeavor represents a bold assertion of our national identity and a determination to rectify past injustices."
 PER_mobilize_the_reserves:0 "Mobilize the Reserves"
 PER_mobilize_the_reserves_desc:0 "In response to escalating tensions and threats to national security, the government has decided to mobilize the reserves. Mobilizing the reserves demonstrates our commitment to safeguarding the sovereignty and integrity of our country, and sends a clear message to our adversaries that we will not hesitate to defend ourselves."
 PER_patriotic_army:0 "Patriotic Army"
 PER_patriotic_army_desc:0 "In order to strengthen our national defense and bolster our military capabilities, we establish a patriotic army composed of loyal citizens, volunteers, and militia members. This army, dedicated to defending the homeland and preserving national sovereignty, will serve as a bulwark against external threats and internal instability. By harnessing the patriotic fervor of our people, we ensure the security and prosperity of our nation for generations to come."

 #Qajar
 PER_overthrow_the_shah:0 "Overthrow the Shah"
 PER_overthrow_the_shah_desc:0 "In Iran in the 1930s, political unrest and economic hardship were leading to popular discontent. Against this backdrop, an article titled "Overthrowing the King" made the headlines of newspapers. The article described the state of the kingdom by creating an imaginary kingdom.\n\nThe article criticized the dictatorship of the King and the poverty of the people. The author argued that the King ruled the country for his own interests and did not listen to the voice of the people. At the end of the article, it was written that the King had been overthrown and the people had reached a state of happiness. It was clear for whom this storied criticism was made."
 PER_gather_support_for_qajar_dynasty:0 "Gather Support for Qajar Dynasty"
 PER_gather_support_for_qajar_dynasty_desc:0 "The Qajar dynasty aimed to ensure the stability necessary for the development of the country by ensuring national unity and solidarity. However, in 1925 Reza Shah Pahlavi pushed the whole plan aside and waited for its demise. But this was not to be."
 PER_invite_qajar_king:0 "Invite Qajar King"
 PER_invite_qajar_king_desc:0 "The Pahlavi dynasty has been proven wrong. But we need a leader who is not a Pahlavi. The best option for this is a King from the noble Qajar Dynasty, our former majesty. We will present this proposal to both options and try to find the most suitable leader."
 PER_destabilize_the_central_government:0 "Destabilize the Central Government"
 PER_destabilize_the_central_government_desc:0 "Internal strife and political instability, fuelled by rumours of the arrival of the Qajar dynasty, are weakening the authority of the central government and plunging the country into chaos. The weakness of the government leads to an increase in economic problems and a decrease in the welfare level of the people. Perhaps this is an indication that this government is out of power."
 PER_raid_the_arms_depots:0 "Raid the Arms Depots"
 PER_raid_the_arms_depots_desc:0 "As the tension between the Qajar dynasty and the Pahlavi dynasty grows, the risk of conflict between the two sides increases. The looting of armaments could lead to security problems throughout the country and jeopardise the safety of lives and property. This raid threatens the country's political stability and could lead to civil war."
 PER_get_support_from_religious_scholars:0 "Get Support from Religious Scholars"
 PER_get_support_from_religious_scholars_desc:0 "In recent days, reports have been circulating that the Kajar dynasty is receiving increasing support from religious scholars. This marks a significant shift in the political and religious landscape in Iran. In the past, the scholars have been more opposed to the dynasty. More recently, however, they appear to have come together to defend the dynasty in reaction to the modernising reforms of Shah Reza Pahlavi"
 PER_kill_the_shah:0 "Kill the Shah"
 PER_kill_the_shah_desc:0 "Tonight, Reza Shah Pahlavi may never wake up from his slumber. Yes, this event has the potential to plunge Iran into deep chaos. The reason for the assassination is clear. It was obvious that the Shah's recent reforms had caused discontent in the army and that he was trying to forcefully convert the people from their religion. I hope the army will quickly accept the new leader."
 PER_hold_the_coronation_ceremony:0 "Hold the Coronation Ceremony"
 PER_hold_the_coronation_ceremony_desc:0 "Today, in a long-awaited ceremony, the new king held his coronation. The crowd gathered in front of the palace and cheered enthusiastically as the king's cortege passed by. The ceremony included the king being blessed with the coronation crown and proclaiming the beginning of his new kingdom. Many photographs and videos were taken of this historic event, which was greeted with excitement throughout the country. There are high hopes that the new king will lead the country towards prosperity and peace."
 PER_improve_relations_with_other_turkic_countries:0 "Improve Relations with Turkic Countries"
 PER_improve_relations_with_other_turkic_countries_desc:0 "There's a new initiative to improve relations with Turkic countries. This initiative will focus on increasing cultural exchange, promoting economic cooperation, and strengthening political ties."
 PER_turkification:0 "Start Turkification"
 PER_turkification_desc:0 "A long-awaited step has been taken and Iran has started a new move to return to Turkish language and culture. Within the scope of this new initiative, it is planned to popularise Turkish in education and to use Turkish as the official language in government offices. In addition, city names will now be in Turkish."
 PER_imprison_political_opponents:0 "Imprison Political Opponents"
 PER_imprison_political_opponents_desc:0 "Recently, the government's practice of arresting and imprisoning dissidents has been increasing. The government argues that these practices are necessary to protect national security. It claims that dissidents are trying to destabilise the country and provoke the population."
 PER_get_rid_of_clergy:0 "Get the Clergy Under Control"
 PER_get_rid_of_clergy_desc:0 "Religion and clergy are above our heads, alhamdulillah. Allah is great but not the clergy. Even though they speak the truth most of the time, sometimes they stand in front of us and cause problems, so it would be much better to guide them."
 PER_ensure_full_control:0 "Ensure Full Control"
 PER_ensure_full_control_desc:0 "Recently, the Qajar Dynasty has been taking steps to consolidate its control in the country. This situation arouses different feelings in many citizens. Some believe that these steps will ensure political stability and order."
 PER_approach_germany:0 "Approach Germany"
 PER_approach_germany_desc:0 "Recently, the Iran has been taking steps to improve its relations with Germany. This situation causes different interpretations among many citizens. Some believe that this rapprochement will benefit Iran economically and politically. They argue that Germany will help Iran's modernisation and development.\n\nHowever, opponents are concerned that this rapprochement will expose Iran to the expansionist policies of the Nazi regime. They argue that Germany will try to use Iran for its own interests."
 PER_join_the_axis:0 "Join the Axis"
 PER_join_the_axis_desc:0 "Some believe that this move will protect Iran's national security and interests. They argue that the Axis Powers have formed a strong alliance and that Iran will be in a stronger position by taking part in this alliance.\n\nHowever, opponents argue that this move would lead Iran into international isolation and could drag it into World War II. They argue that the Axis Powers are not peaceful and that Iran is taking a great risk by joining this alliance."
 PER_buy_german_arms:0 "Buy German Weapons"
 PER_buy_german_arms_desc:0 "The Iranian government has signed an agreement to purchase large quantities of arms from Germany. This is an important development that could significantly change the balance of power in the region. Although the exact scope of the deal is not known, it is estimated that Iran is purchasing fighter planes, tanks and other weapons."
 PER_nationalize_oil_wells:0 "Nationalize Oil Wells"
 PER_nationalize_oil_wells_desc:0 "In a historic decision, the Iranian government announced today that it has nationalised all oil wells in the country. This decision will give Iran full control over its oil resources and is expected to make a major contribution to the country's economy. The nationalisation decision has caused great repercussions in Iran and internationally. While some argue that this decision will strengthen Iran's sovereignty and independence, others are concerned that it could discourage foreign investment and lead to an increase in oil prices."
 PER_agressive_foreign_policy:0 "Aggressive Foreign Policy"
 PER_agressive_foreign_policy_desc:0 "The aggressive foreign policy pursued by the Qajar dynasty in recent times has caused concerns in the region. The dynasty makes territorial claims against its neighbors and seeks to expand its political and economic influence. This situation increases tensions in the region and raises concerns that it could lead to a new war."
 PER_the_past_wont_be_forgotten:0 "The Past Wont be Forgotten"
 PER_the_past_wont_be_forgotten_desc:0 "The past is a light that illuminates the way to the future. Forgetting it can lead us to repeat our mistakes and fall into the same traps. Therefore, it is very important to understand the past and learn from it."
 PER_claim_qajar_lands:0 "Claim Qajar Lands"
 PER_claim_qajar_lands_desc:0 "Recently, some groups began to claim lands that allegedly belonged to the Qajar Dynasty. These demands are causing tension in the region and bringing with them a legal battle.\n\nThe claimants' arguments are based on historical documents and family traditions. They argue that the Qajar Dynasty ruled these lands for centuries and that their rights were passed down from generation to generation."
 PER_revoke_other_treaties:0 "Revoke Other Treaties"
 PER_revoke_other_treaties_desc:0 "Recently, the Iranian government has decided to cancel a number of international agreements. This decision has caused consternation and concern in the region. The government argues that it made this decision in order to protect national interests and strengthen the sovereignty of the country.\n\nAmong the canceled agreements are trade agreements, political agreements and military agreements. The government argues that these agreements are not in Iran's interests and hinder the country's development."
 PER_revoke_treaty_of_paris:0 "Revoke Treaty of Paris"
 PER_revoke_treaty_of_paris_desc:0 "According to breaking news, the Iranian government has decided to cancel the Treaty of Paris, which was signed in 1857. This decision has caused consternation and concern in the region. The government argues that it made this decision in order to protect national interests and strengthen the sovereignty of the country. In addition, Iran is demanding the return of Pakistan territory."
 PER_greater_qajar:0 "Greater Qajar"
 PER_greater_qajar_desc:0 "Recently, attempts by the Qajar Dynasty to increase its regional power and influence have been increasing. These initiatives are seen as part of a vision called "The Great Qajar". This vision aims to make Iran the leading power in the region and raise the country's prestige and reputation in the international arena."
 PER_reform_the_armed_forces:0 "Reform the Armed Forces"
 PER_reform_the_armed_forces_desc:0 "Recently, there has been growing arguments about the need to reform Iran's armed forces. As a result of these discussions, the Qajar King initiated a series of reform movements. As a result, the army is expected to be more organized and better able to withstand the heat."
 PER_fix_the_economy:0 "Fix the Economy"
 PER_fix_the_economy_desc:0 "Iran's beloved leader, [PER.GetLeader], is taking important steps to modernize and develop the country. One of these steps is the new program it has launched to fix the economy. This program aims to increase agricultural production, promote industrialization, and improve infrastructure.\n\nTo increase agricultural productivity, the king promotes modern farming techniques and provides for the installation of new irrigation systems. In addition, it supports the establishment of new factories and prioritizing domestic production. Investments are also being made in important infrastructure projects such as roads, railways and ports."
 PER_mobilize_the_economy:0 "Mobilize the Economy"
 PER_mobilize_the_economy_desc:0 "The Iranian government has announced a historic economic mobilization plan to develop and modernize the country. This plan includes major investments in infrastructure, industrialization and modernization of agriculture."
 PER_good_neighbor_policy:0 "Good Neighbor Policy"
 PER_good_neighbor_policy_desc:0 "The Good Neighbor Policy is expected to help improve Iran's image in the region and improve its relations with the international community. This policy can also be beneficial for the Middle East by contributing to peace and stability. However, how successful this policy will be remains to be seen. Iran's relations with its neighbors have a complicated history, and this policy is not guaranteed to overcome all obstacles."
 PER_sign_non_aggression_pacts:0 "Sign Non-Agression Pacts"
 PER_sign_non_aggression_pacts_desc:0 "Iran will sign a series of non-aggression pacts with its neighbors in an effort to reduce tensions and maintain peace in the region. According to these pacts, the parties will not attack each other and will try to resolve any disputes peacefully.\n\nThe signing of the non-aggression pact is an important step taken by Iran to improve its relations with other countries in the region. According to these pacts, trade and cooperation between the parties will increase and joint development projects will be carried out in the region."
 PER_treaty_of_friendship_with_the_turks:0 "Treaty of Friendship with the Turkey"
 PER_treaty_of_friendship_with_the_turks_desc:0 "This treaty aims to promote political, economic and cultural cooperation between the two countries.\n\nThe treaty includes mutual recognition of the sovereignty and territorial integrity of both countries. It also includes the principles of non-aggression and peaceful settlement between the two countries."
 PER_neutrality_effort:0 "Neutrality Effort"
 PER_neutrality_effort_desc:0 "Iran has decided to pursue a policy of neutrality at a time of heightened international tensions. The purpose of this policy is to keep the country out of a possible war and to maintain peace and stability.\n\nAs part of its neutrality efforts, Iran seeks to stay out of the political and military blocs. In addition, he maintains a neutral position in international disputes."
 PER_formalize_sadabat_pact:0 "Formalize Saadabad Pact"
 PER_formalize_sadabat_pact_desc:0 "At a ceremony held yesterday in Tehran, the Saadabad Pact signed between Iran, Turkey, Iraq and Afghanistan officially entered into force. With the signing of the pact, it is aimed to consolidate peace and stability in the region and to develop political and economic cooperation.\n\nThe signing ceremony of the pact was attended by the Shah of [PER.GetLeader], Turkish leader [TUR.GetLeader], Iraqi leader [AFG.GetLeader] and Afghan leader [AFG.GetLeader]. In the speeches made at the ceremony, it was emphasized that the pact will have beneficial results for all countries in the region."
 PER_joint_military_training:0 "Joint Military Training"
 PER_joint_military_training_desc:0 "Selected units from the armies of the Saadabad Pact countries will participate in the exercise. As part of the exercise, various military maneuvers and exercises will be carried out.\n\nIt is assumed that the joint military exercise will be carefully monitored by other countries in the region. There is also a possibility that the exercise will affect the political and military balances in the region."

 #Communist
 PER_restart_jungle_movement:0 "Restart Jungle Movement"
 PER_restart_jungle_movement_desc:0 "The time has come to reignite the spirit of the Jungle Movement, an initiative that once inspired the masses to rise against tyranny. We will teach the principles of communism to our people and lay the groundwork for a revolution that will topple the existing monarchy. This is the first step in our revolution to establish a people's government."
 PER_request_soviet_support:0 "Take Soviet Weapons"
 PER_request_soviet_support_desc:0 "In preparation for a potential armed conflict during our revolution, we must secure weapons from our communist ally, the Soviet Union. These arms will ensure that we are well-equipped to face any internal opposition and guarantee further military support in the event of a civil war."
 PER_communist_partisans:0 "Communist Partisans"
 PER_communist_partisans_desc:0 "To protect the revolution and maintain its momentum, we need to train communist partisans. These dedicated fighters will safeguard our achievements and can be mobilized to the front lines in the event of a civil war. A loyal and well-prepared partisans who will defend our cause at all costs is very important to us."
 PER_creation_of_tudeh_party:0 "Creation of Tudeh Party"
 PER_creation_of_tudeh_party_desc:0 "To gain legitimacy and organize our efforts, we will establish the Tudeh Party. This new political entity will have defined leadership and cadres, providing a clear structure for our movement. The Tudeh Party will be the spearhead of our revolutionary activities, guiding us towards our ultimate goal of a communist state."
 PER_towards_a_red_government:0 "Towards a Red Government"
 PER_towards_a_red_government_desc:0 "Our revolution has succeeded peacefully, and we have taken control of the government. The monarchy is no more, and the entire royal family will be exiled. This is the beginning of our journey towards establishing a red government that represents the will and needs of the people."
 PER_start_socialist_revolution:0 "Start Socialist Revolution"
 PER_start_socialist_revolution_desc:0 "We must recognize that a peaceful transition is no longer possible and we must start the socialist revolution before the government crushes us. By arming our partisans and supporters, we will launch a determined and bloody uprising to overthrow the current regime. We will make this revolution at any cost!"
 PER_purge_clergy_members:0 "Purge Radical Clergy Members"
 PER_purge_clergy_members_desc:0 "Radical clergy members have long hindered our nation's progress. We will execute those who have caused the most harm and undermine their influence. The remaining clergy will be coerced into supporting our cause or face severe consequences."
 PER_rebuild_the_country_from_scratch:0 "Rebuild the Country from Scratch"
 PER_rebuild_the_country_from_scratch_desc:0 "With the revolution complete, it is imperative to rectify the mistakes of previous governments. Through comprehensive reforms, we will rebuild our country from the ground up, ensuring the longevity of our regime and improving the quality of life for our people. The foundations of our new regime must be solid."
 PER_exile_pahlavi_dynasty:0 "Exile Pahlavi Dynasty"
 PER_exile_pahlavi_dynasty_desc:0 "The Pahlavi Dynasty has no place in our new society. Every member of the royal family will be exiled permanently, ensuring they cannot return to challenge our authority."
 PER_socialist_constitution:0 "Socialist Constitution"
 PER_socialist_constitution_desc:0 "We will draft and implement a socialist constitution that enshrines equality for all citizens. This new legal framework will guide our nation towards a just and equitable society, reflecting our revolutionary ideals."
 PER_establish_tudeh_army:0 "Establish Tudeh Army"
 PER_establish_tudeh_army_desc:0 "Our military requires extensive reforms to serve as the backbone of our new regime. The establishment of the Tudeh Army will transform our forces into a formidable red army that strikes fear into both internal dissenters and hostile neighbors."
 PER_promote_atheism:0 "Promote Atheism"
 PER_promote_atheism_desc:0 "Islam and religious figures have caused more harm than good to our nation, and the people have paid a high price for it. To ensure our country and people can focus on progressive steps forward, we must distance ourselves from Islam and embrace atheism. With the clergy now under our control, there is nothing standing in our way to promote atheism and free our nation from the shackles of religious dogma."
 PER_develop_spy_agency:0 "Creation of Intelligence Agency"
 PER_develop_spy_agency_desc:0 "To better protect our nation from external threats, we must develop and organize our espionage activities. Establishing a dedicated intelligence agency will enable us to conduct effective countermeasures and gather critical information."
 PER_socialist_islamic_constitution:0 "Socialist Islamic Constitution"
 PER_socialist_islamic_constitution_desc:0 "Islam has always been an integral part of our country. Now that we have executed the radical clergy members, there is no group left to harm our people with their extremist ideas. We must blend socialism and Islam into a single constitution that serves the best interests of our people."
 PER_red_islam:0 "Islam with Socialist Characteristic"
 PER_red_islam_desc:0 "The fusion of Islam and socialism has brought significant benefits to our nation. Our people have embraced this combination, leading to increased prosperity and contentment. By living happily under the banner of Islam, our citizens are more resilient to occasional challenges."
 PER_islamist_army:0 "Islamist Army"
 PER_islamist_army_desc:0 "We must raise an army grounded in Islamic principles that is both just and powerful. This army should be as fair and formidable as the forces led by Hz. Muhammad, ensuring that our enemies think twice before attacking us."
 PER_power_of_equality:0 "Power of Equality"
 PER_power_of_equality_desc:0 "The power of equality is paramount. Regardless of their religion or ethnicity, our citizens must know that they are equal before the law. No one is superior to another, and we must uphold this principle."
 PER_start_red_middle_east_plan:0 "Red Middle East Plan"
 PER_start_red_middle_east_plan_desc:0 "After the success of our revolution and the subsequent rise in our nation's prosperity, it is time to extend this progress to our Middle Eastern neighbors. Every country in the region deserves to enjoy the benefits of socialism. We will demonstrate the advantages of our system and, if necessary, use force to bring resistant states into the fold. Our mission is to ensure that all people in the Middle East have the right to live in peace and prosperity."
 PER_join_the_comitern:0 "Join the Comitern"
 PER_join_the_comitern_desc:0 "Our future lies with Communism, so we must join our comrades around the world in this global struggle. Stalin will show us the way and lead the workers to a glorious tomorrow."
 PER_soviet_economic_support:0 "Soviet Economic Support"
 PER_soviet_economic_support_desc:0 "There is no shame in seeking the help of larger, more developed countries. In the war to defend the revolution, every worker, peasant and engineer is our comrade, and we will welcome their help to develop our industries, as we would if the roles were reversed."
 PER_nkvd_assistance:0 "NKVD Assistance"
 PER_nkvd_assistance_desc:0 "NKVD agents are among the most experienced in the world. Since we are friends with the Soviets, we can invite them to our country and prevent the imperialists from creating civil unrest in our country."
 PER_independent_alliance:0 "Independent Alliance"
 PER_independent_alliance_desc:0 "Although we received assistance from the Soviets during our revolution, it does not mean we will surrender our sovereignty or the independence of our people to Soviet influence. Our goal is to establish an alliance that maintains our autonomy and ensures that our nation remains free from external control. We will stand firm in our independence, securing our future without becoming a puppet to any foreign power."
 PER_liberate_arab_workers:0 "Liberate Arab Workers"
 PER_liberate_arab_workers_desc:0 "The time has come to implement our Red Middle East Plan. We will invite countries that have embraced socialism and uplifted their people to join our alliance, marching forward together in unity. For those still under oppressive monarchist regimes that disregard the welfare of their citizens, we will show them our strength. Our objective is to liberate the Arab workers and bring the promise of socialism to the entire region."
 #Qajar / Communist
 PER_recover_from_civil_war:0 "Recover from Civil War"
 PER_recover_from_civil_war_desc:0 "The civil war was exhausting and has left our nation and people weary. However, this is not the end of our country. We must utilize our resources to heal these wounds and repair the damage caused by the conflict. By focusing on reconstruction and recovery, we will quickly restore our country and provide our citizens with the stability and hope they need to move forward."
 PER_encourage_schools:0 "Encourage Schools"
 PER_encourage_schools_desc:0 "Regrettably, our literacy rate is quite low. To address this, we must build new schools and launch initiatives that encourage people to pursue education. By promoting literacy and education, we will ensure that future generations are better equipped and more knowledgeable. This is significant step towards a more developed and enlightened Iran."

 #Islamic
 PER_islamic_revolution:0 "Islamic Revolution Begins"
 PER_islamic_revolution_desc:0 "For the sake of so many martyrs\nThey gave their lives for the path of right\nThe oppressed are watching the way\nWe set out for you to come, Sharia, Sharia\n\nSharia, this is freedom,\nSharia, this is freedom\nThis is a breath of life\nIf you don't want, just wait"
 PER_rise_against_the_king:0 "Rise Against the King"
 PER_rise_against_the_king_desc:0 "When the angels stop to pray\nWhen the squares are in the dust,\nWhen you leave the body of life\n\nIt is time for martyrdom, bring takbir\nIt is time for martyrdom, bring takbir\nIt is time for martyrdom, bring takbir"
 PER_death_to_the_king:0 "Death to the King"
 PER_death_to_the_king_desc:0 "Never, no, we will not deviate\nNever, no, we will not deviate\nWe will never deviate from the steps of faith.\n\nWe have a long way to go\nOur path is a long way with the guidance of the Qur'an\nNever, no, we will not deviate\nNever, no, we will not deviate\nWe will never deviate from the steps of faith."
 PER_islamic_state_of_iran:0 "Islamic State of Iran"
 PER_islamic_state_of_iran_desc:0 "Listen and obey! Even if the governor/ruler appointed over you is an Abyssinian slave with his head like a black raisin, listen and obey as long as he applies the Book of Allah among you"
 PER_holy_purge:0 "Holy Purge"
 PER_holy_purge_desc:0 "The Islamist regime is taking various steps to purify the secular segments. These steps include the closure of secular institutions, the arrest of secular intellectuals, and the restriction of the secular way of life.\n\nThe increasing repression of secularists in Iran is a worrying development for the country's democracy and human rights. This situation increases political tension and polarization in Iran."
 PER_cancel_reforms_against_sharia:0 "Cancel Reforms Against Sharia"
 PER_cancel_reforms_against_sharia_desc:0 "Laws that are contrary to God's law are being annulled. Among the canceled reforms are the liberalization of women's access to some public spaces, the easing of censorship and the expansion of press freedom."
 PER_ban_alcohol:0 "Ban Alcohol"
 PER_ban_alcohol_desc:0 "The veil of misery of the drinker is torn, and the Devil becomes his companion, leading him to every evil deed, and keeping him from good deeds.\n\n-from Abu al-Qasim ash-Shami at-Tabarani"
 PER_islamisation_program:0 "Islamisation Program"
 PER_islamisation_program_desc:0 "Mind you, Islam is a circle. As long as it returns, you should return in that circle with the book (Quran/Sunnah). Notice that the book and the sultanate (religion and state affairs) will be separated. Notice that they (who are not among us) will be the rulers over you. They will rule against you in a way that is in their favor\n\nIf you don't listen to them, they will kill you, and if you obey, they will lead you astray. Treat them as the companions of Jesus, the son of Mary, did. They were sawed down and crucified, but they still did not give up their cause. Death in obedience to Allah is better than living in rebellion against Allah."
 PER_islamisation_of_universities:0 "Islamisation of Universities"
 PER_islamisation_of_universities_desc:0 "Islamic courses are added to university curricula, secular professors are dismissed, and secular elements on university campuses are suppressed. The Islamization movement could lead universities in Iran away from international standards and negatively affect the country's scientific and technological development."
 PER_mandatory_hijab:0 "Mandatory Hijab"
 PER_mandatory_hijab_desc:0 "There will be a number of men in the last period of my Ummah. Like men, they will ride on horses and descend to the doors of the mosques. Their wives are clothed but naked, with nothing like a camel hump on their heads. Curse them. For they are cursed.\n\n-from Ibn Hibban al-Busti"
 PER_jizya_tax:0 "Jizya Tax"
 PER_jizya_tax_desc:0 "In recent years, Islamist groups in Iran have been demanding a poll tax on minorities. This situation leads to increased pressure on minorities in Iran. The poll tax is a type of tax levied on the minority of people of the book who do not accept Islam. Islamist groups argue that the re-imposition of this tax will be an incentive for minorities in Iran to convert to Islam."
 PER_fight_for_god:0 "Fight For God"
 PER_fight_for_god_desc:0 "Whoever equips a soldier (for war) to fight in the way of Allah (swt) will be as if he had fought himself. And whoever takes good care of his family after the veteran who goes to war in the way of Allah (swt), it will be as if he has fought.\n\n-from Muhammad al-Bukhari"
 PER_guardians_of_the_islamic_revolution:0 "Guardians of the Islamic Revolution"
 PER_guardians_of_the_islamic_revolution_desc:0 "Unlike the traditional army, Guardians of the Islamic Revolution is an army based on ideological commitment and loyalty to the revolution. Made up of professional soldiers and volunteers, Guardians of the Islamic Revolution has a wide range of military capabilities, including land, navy, and air forces."
 PER_holy_jihad:0 "Holy Jihad"
 PER_holy_jihad_desc:0 "Narrated 'Abdullah ibn Mas'ud: He said to Allah's Apostle, \n"O Allah's Apostle! What deed it is more virtuous."\nHe said, "Prayer that is performed on time."\n"Which one is next?" Asked.\nHe said, "To be good to your parents."\nI asked, "Which one is next?"\nHe said, "It is jihad in the way of Allah.""
 PER_attack_iraq_islamist:0 "Attack Iraq"
 PER_attack_iraq_islamist_desc:0 "Islamist groups argue that they carried out these attacks to protect the Shiites in Iraq and end the Sunni presence in the region. However, these attacks also target civilians and have led to a major humanitarian crisis in the region. A war has now become inevitable."
 PER_attack_saudi_arabia:0 "Attack Saudi Arabia"
 PER_attack_saudi_arabia_desc:0 "The Islamist movement in Iran will liberate the Holy Land from its infidels. If you don't believe it, just wait. When the time comes, you, like everyone else, will expect us to take pity."
 PER_war_against_remaining_sunni_states:0 "War Against Remaining Sunni States"
 PER_war_against_remaining_sunni_states_desc:0 "Long-standing tensions have finally reached the point of explosion. This morning, Shiite leaders declared jihad against the remaining Sunni states. This shocking development is seen as the beginning of a large-scale conflict in the region."
 PER_demand_annexation_of_sunni_states:0 "Demand Annexation of Sunni States"
 PER_demand_annexation_of_sunni_states_desc:0 "In a statement today, the Shiite Iranian government demanded the annexation of all Sunni states. This shocking demand further escalates tensions in the region and could ignite a full-scale conflict.\n\nIran's leaders argue that this decision is necessary to unite the region and get rid of Sunni oppression. Sunni states deny these allegations and claim that Iran is trying to take over the region."
 PER_attack_turks:0 "Destroy Secular Muslims"
 PER_attack_turks_desc:0 "We must bring to its knees the atheist Muslim community created by Mustafa Kemal Ataturk, whom Shah Reza Pahlavi was obsessed with. We must destroy all of them, otherwise if even one Turk is left behind, he will come and destroy us. We have to crush the head of the snake before it even grows!"
 PER_focus_on_east:0 "Focus on East"
 PER_focus_on_east_desc:0 "They still could not remove the revolutions made by Amanullah Khan under the influence of Atatürk from the country. It's up to us to clean them up. If you die in the mountains of Afghanistan, if you will not actually die, you will continue to follow us from the seat of martyrdom with Hazrat Ali in the sight of God."
 PER_declare_islamic_caliphate:0 "Declare Islamic Caliphate"
 PER_declare_islamic_caliphate_desc:0 "My homeland, my homeland, my history and my safety\nAnd the domicile of the conditions of security\nMy factories to make men\nI will mercifully support all nations for them\nMy hometown, my hometown, my history and my safety\nAnd the domicile of the conditions of security\nMy factories to make men\nI will mercifully support all nations for them\nAnd we have to die for it\nMen fighting with a haunted heart\nIt's a dispatch crisis and that's what we're here for\nHorn swords and fences of the wall\nAnd we have to die for it\nMen fighting with a haunted heart\nIt's a dispatch crisis and that's what we're here for"
 PER_declare_war_on_infidels:0 "Declare War on Heretics"
 PER_declare_war_on_infidels_desc:0 "It has just dawned\nPathfinders appeared\nProperty and life were abandoned\nWe set out for you to come, Sharia, Sharia\nWe waited, we waited a long time\nWe said it wouldn't come by waiting\nWe got up and came towards you"
 PER_sword_of_islam:0 "Sword of Allah"
 PER_sword_of_islam_desc:0 "Sharp like the sword, the wind, the billows in abundance.\nStrong like the horse, the lion, the thunder, sparkling.\nSharp like the sword, the wind, the billows in abundance.\nStrong like the horse, the lion, the thunder, sparkling."
 
 #Economic
 PER_economic_restoration:0 "Economic Restoration"
 PER_economic_restoration_desc:0 "Iran is implementing a comprehensive development plan to revive its economy after the global crisis. With new investments and infrastructure projects, job opportunities will increase and welfare level will rise in the country. Within the scope of the development plan, agriculture and industry sectors will also be modernised and production capacities will increase."
 PER_kickstart_the_industry:0 "Kickstart the Industry"
 PER_kickstart_the_industry_desc:0 "Our industry is there, it just needs a little nudge in the right direction to get it functioning as it should."
 PER_mining_act:0 "Pass the Mining Act"
 PER_mining_act_desc:0 "Our nations are filled to the brim with resources. If we can exploit them to the fullest, we can significantly improve our economies."
 PER_steel_extraction:0 "Steel Extraction"
 PER_steel_extraction_desc:0 "Iran aims to accelerate the country's industrialisation and development by making investments to increase steel production. Increased steel production will contribute to the faster and more efficient completion of the country's infrastructure projects"
 PER_aluminium_extraction:0 "Aluminium Extraction"
 PER_aluminium_extraction_desc:0 "The aluminium production plant will be equipped with the latest technology, which will enable the production of high quality products. A significant portion of the aluminium produced will be exported and foreign currency inflow will be provided to the country."
 PER_expand_oil_fields:0 "Expand Oil Fields"
 PER_expand_oil_fields_desc:0 "By expanding its oil fields, Iran aims to increase the country's oil reserves and thus its economic power. With the increase in oil revenues, the development of the country will accelerate, new investments will be made and the welfare level of the people will increase. By increasing oil production, Iran will gain a stronger position in the global energy market and become an important actor in international trade."
 PER_support_urbanization:0 "Support Urbanization"
 PER_support_urbanization_desc:0 "Iran is promoting urbanisation for the rapid development and modernisation of the country. In modern cities, infrastructure and public services are more developed and the standard of living is higher. Urbanisation contributes to the country's economic growth by promoting industrialisation and trade."
 PER_new_investment_plans:0 "New Investment Plan"
 PER_new_investment_plans_desc:0 "Iran has prepared a new investment plan to accelerate the development and modernisation of the country. Within the scope of the plan, investments will be made in strategic areas such as infrastructure, industry, agriculture, energy and education. The private sector will play an important role in the new investment plan and contribute to the development of the country."
 PER_radio_tehran:0 "Radio Tehran"
 PER_radio_tehran_desc:0 "A modern nation requires a voice that reaches every home. By expanding Radio Tehran, we strengthen both internal cohesion and the state's ability to inform, inspire, and guide public opinion."
 PER_establish_the_university_of_isfahan:0 "Establish the University of Isfahan"
 PER_establish_the_university_of_isfahan_desc:0 "University of Isfahan is being expanded to modernise the country's education system and bring it up to world standards. With the expansion of the university, more students will have the opportunity to receive education and the country will gain qualified manpower. Within the scope of the expansion, new faculties and departments will be opened and more education options will be offered to students."
 PER_national_bank_of_iran:0 "National Bank of [GetIranName]"
 PER_national_bank_of_iran_desc:0 "The establishment of the National Bank of Iran is an important step to strengthen the country's economic independence and accelerate national development. The national bank will strengthen the country's financial system, help maintain the value of the currency and stabilise the national economy. The national bank will contribute to the development of the country by encouraging domestic and foreign investment."
 PER_imperial_bank_of_persia:0 "Imperial Bank of Persia"
 PER_imperial_bank_of_persia_desc:0 "The establishment of the National Bank of Persia is an important step to strengthen the country's economic independence and accelerate national development. The national bank will strengthen the country's financial system, help maintain the value of the currency and stabilise the national economy. The national bank will contribute to the development of the country by encouraging domestic and foreign investment."
 PER_expand_agricultural_lands:0 "Expand Agricultural Lands"
 PER_expand_agricultural_lands_desc:0 "Iran is expanding agricultural areas to ensure food security and increase agricultural production. With the expansion of agricultural areas, the welfare of peasants will increase and contribute to rural development. Excess production will provide foreign currency inflow to the country by exporting agricultural products."
 PER_open_the_new_trade_routes:0 "Open New Trade Routes"
 PER_open_the_new_trade_routes_desc:0 "New trade routes will increase Iran's share in global trade and raise the country's prestige in the international arena. The new trade routes will encourage foreign investments and ensure the flow of capital to the country. New trade routes will help raise the welfare of the Iranian people and improve their quality of life."
 PER_new_industrial_technologies:0 "New Industrial Technologies"
 PER_new_industrial_technologies_desc:0 "Iran aims to accelerate industrialisation and ensure the country's development by using new industrial technologies. New technologies will increase the country's economic diversification by enabling the development of new products and services. New industrial technologies will create new job opportunities and contribute to employment."
 PER_attract_people_business_activity:0 "Attract People to Business"
 PER_attract_people_business_activity_desc:0 "By training our own people in financial and entrepreneurial literacy, we can count on an increase in the growth rates of a number of sectors of the economy."
 PER_reorganize_the_military_industry:0 "Reorganize the Military Industry"
 PER_reorganize_the_military_industry_desc:0 "We should become a stronger and more influential country in the region by focusing on the military industry."
 PER_iranian_small_arms_production:0 "Iranian Small Arms Production"
 PER_iranian_small_arms_production_desc:0 "We have a strong industry, but not all of it is well adapted for production of war materials. Finding efficient processes to facilitate this change will be key to utilizing our resources."
 PER_develop_city_infrastructure:0 "Develop City Infrastructure"
 PER_develop_city_infrastructure_desc:0 "A major project has been launched in Iran to improve the infrastructure of cities. This will significantly improve the quality of life of people living in cities. With modern roads, bridges and public transport systems, urban transport will become easier and faster. Infrastructure investments will also contribute to the economic development of cities and create new job opportunities."
 PER_develop_small_cities:0 "Develop Small Cities"
 PER_develop_small_cities_desc:0 "While our capital thrives, many towns across the country remain underdeveloped. Targeted investment in smaller urban centers will spread prosperity, reduce internal migration, and stimulate regional economies."
 PER_finish_the_trans_iranian_railway:0 "Finish the Trans-Iranian Railway"
 PER_finish_the_trans_iranian_railway_desc:0 "The Trans-Iranian Railway project, which has been under construction for many years, is finally nearing completion. This project will be an important milestone for the development and modernisation of Iran. The railway will accelerate economic development by contributing to the development of the country's agriculture, industry and mining sectors."
 PER_supply_centers:0 "Build Supply Centers"
 PER_supply_centers_desc:0 "Iran is establishing strategic supply centres to ensure uninterrupted delivery of goods and services to every corner of the country. Modern and integrated supply centres will make significant contributions to the economy by reducing logistics costs and increasing the speed of distribution."
 PER_rocketry_focus:0 "Rocketry"
 PER_rocketry_focus_desc:0 "Rockets are the future. We shall take advantage of them as quickly as possible."
 PER_national_defense_institute:0 "National Defense Institute"
 PER_national_defense_institute_desc:0 "Technology is everything establishing an institute to research defense technologies will allow us to research new technologies. We must ensure that we alway stay ahead of our enemies, and do not fall behind in technology."
 PER_agrarian_reform:0 "Agrarian Reform"
 PER_agrarian_reform_desc:0 "We need to give importance to factorying by reforming agriculture. In this period, opening new factories is more important than many other things."

 #Army
 PER_learn_from_mistakes:0 "Learn From Mistakes"
 PER_learn_from_mistakes_desc:0 "It is time to learn from the mistakes of the past and build a better and more modern army."
 PER_modernize_the_army:0 "Modernize the Army"
 PER_modernize_the_army_desc:0 "Our armed forces must be equipped not just with numbers, but with modern doctrine, organization, and arms. Only a reformed army can secure the future of our state and defend its rightful borders."
 PER_cooperate_with_bofors:0 "Cooperate with Bofors"
 PER_cooperate_with_bofors_desc:0 "The Swedish arms manufacturer Bofors offers valuable expertise in artillery and air defense. A cooperation agreement will bring technical aid, licenses, and long-term strategic benefit."
 PER_create_the_imperial_guard:0 "Create the Imperial Guards"
 PER_create_the_imperial_guard_desc:0 "To ensure the regime's security and inspire loyalty, we will establish an elite force — the Imperial Guard — directly loyal to the Shah and capable of acting where regular troops may falter."
 PER_modernize_small_arms:0 "Modernize Small Arms"
 PER_modernize_small_arms_desc:0 "Instead of different types of weapons, the army will use standardised weapons. This will reduce logistics and training costs. As far as possible, new weapons will be produced in Iran. This will strengthen the country's defence industry and reduce foreign dependence."
 PER_motorization_effort:0 "Motorization Effort"
 PER_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
 PER_armor_effort:0 "Armor Effort"
 PER_armor_effort_desc:0 "Our tanks are obsolete. We should focus on design new models to face the military evolutions of our time."
 PER_produce_our_own_artillery:0 "Produce Our Own Artillery"
 PER_produce_our_own_artillery_desc:0 "Infantry do not function with proper artillery support. Ensuring modern, high-quality guns will go a long way to improving the effectiveness of our forces."
 PER_anti_air_support:0 "Anti-Air Support"
 PER_anti_air_support_desc:0 "If we are not strong enough to produce a fleet of quality aircraft, we should at least prevent enemy planes from flying over us."
 PER_conduct_army_drills:0 "Conduct Army Drills"
 PER_conduct_army_drills_desc:0 "Iran's state-of-the-art weaponry will also be on display during the exercises. In this way, it will be shown to the whole world that the army is a modern and powerful force. It also gives the message of national unity and solidarity of the Iranian people."
 PER_update_our_tactics:0 "Update our Tactics"
 PER_update_our_tactics_desc:0 "With new modern equipment comes new modern tactics, and we need to catch up on both if we want to have a formidable land force."
 PER_open_new_military_schools:0 "Open New Military Schools"
 PER_open_new_military_schools_desc:0 "Iran is opening new military schools to train its future officers. These schools will contribute to consolidating the country's military power and modernisation. The new schools will be equipped with modern training methods and curricula. In this way, the officers of the Iranian army will be familiarised with the latest technology and tactics."
 PER_mountain_war:0 "Training in the Mountains"
 PER_mountain_war_desc:0 "Iranian soldiers undergo rigorous training in the mountains to improve their endurance and combat skills. Mountain training also provides soldiers with leadership, endurance and teamwork skills. Soldiers who undergo this challenging training are filled with great loyalty to their homeland and flag."
 PER_special_forces:0 "Establish Special Forces"
 PER_special_forces_desc:0 "Complex operations require soldiers trained beyond conventional limits. A dedicated Special Forces corps will allow us to perform sabotage, reconnaissance, and rapid strikes deep behind enemy lines."
 PER_build_defensive_lines:0 "Build Defensive Lines"
 PER_build_defensive_lines_desc:0 "These lines of defence will act as a deterrent against potential aggressors and help protect Iran's territorial integrity. The defence lines will be equipped with the latest technology and equipment. In this way, the Iranian army will be ready for any attack."

 PER_naval_effort:0 "[GetIranNavyName]"
 PER_naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 PER_protection_of_strait_of_hormuz:0 "Protection of Strait of Hormuz"
 PER_protection_of_strait_of_hormuz_desc:0 "The Strait of Hormuz is the only sea route through which our oil refineries and, more importantly, our seaside cities can be attacked. If we intercept the enemy before they get here, it will be much easier to survive with less damage."
 PER_power_projection_to_indian_ocean:0 "Power Projection to Indian Ocean"
 PER_power_projection_to_indian_ocean_desc:0 "Access to the Indian Ocean grants us strategic leverage in trade and naval movement. By improving infrastructure and naval presence in the south, we assert ourselves as a true regional power."
 PER_produce_submarines:0 "Produce Submarines"
 PER_produce_submarines_desc:0 "We must focus our submarine fleets on a force that can starve out our enemies by destroying their convoys."
 PER_increase_navy_budget:0 "Increase Navy Budget"
 PER_increase_navy_budget_desc:0 "To defend our interests on the seas, we must allocate greater funds to naval development from shipbuilding to training and logistics."
 PER_naval_academy:0 "Expand the Naval Academy"
 PER_naval_academy_desc:0 "A modern navy requires skilled officers. By expanding our naval academy, we ensure a steady flow of trained leadership for our growing fleet."
 PER_build_a_powerful_grand_fleet:0 "Build a Powerful Grand Fleet"
 PER_build_a_powerful_grand_fleet_desc:0 "Our ambitions require a navy capable of operating far from home. A grand fleet, centered on capital ships and supported by modern escorts, will allow us to project power with confidence."
 PER_purchase_foreign_ships:0 "Purchase Foreign Ships"
 PER_purchase_foreign_ships_desc:0 "While our domestic industry matures, foreign suppliers can provide advanced warships to bridge the gap allowing us to expand our fleet rapidly and efficiently."
 PER_build_battleships:0 "Build Battleships"
 PER_build_battleships_desc:0 "Nothing demonstrates naval power like the construction of battleships. These floating fortresses will serve as the core of our naval doctrine and as symbols of our national prestige."
 PER_ensure_commercial_protection:0 "Ensure Commercial Protection"
 PER_ensure_commercial_protection_desc:0 "Iran will start producing its own ships to protect its commercial vessels. In this way, we will have a safer and stronger presence in maritime trade routes. In this way, we will have the opportunity to develop our domestic know-how in maritime technology and create new job opportunities."
 PER_expand_shipbuilding_capacities:0 "Expand Shipbuilding Capacities"
 PER_expand_shipbuilding_capacities_desc:0 "The shipbuilding industry of our country should not be overlooked, as they will be crucial for the development of a future navy."
 PER_dominate_the_persian_gulf:0 "Dominate the Persian Gulf"
 PER_dominate_the_persian_gulf_desc:0 "The Persian Gulf harbours a significant portion of the world's oil reserves. Therefore, maritime dominance in the region is vital for the prosperity and security of our country. As part of this new initiative, Iran will equip its navy with modern ships. In this way, we will transform our presence at sea into a deterrent force."
 PER_strengthen_coastal_defenses:0 "Strengthen Coastsal Defenses"
 PER_strengthen_coastal_defenses_desc:0 "A strong coastline is the first line of defense. By building modern coastal fortifications and anti-ship batteries, we can ensure that no foreign fleet threatens our shores unchallenged."
 PER_powerful_iranian_navy:0 "Beyond the Gulf"
 PER_powerful_iranian_navy_desc:0 "The Persian Gulf is only the beginning. Our vision extends to the Arabian Sea and beyond where our interests must be defended and our influence felt."

 PER_expand_the_airforce:0 "Expand the [GetIranAirforceName]"
 PER_expand_the_airforce_desc:0 "The world changed and a new front opened in the sky. We must produce new airplanes for our soldiers who will fight on this front."
 PER_send_pilots_abroad_for_training:0 "Send Pilots Abroad for Training"
 PER_send_pilots_abroad_for_training_desc:0 "Our fledgling air force lacks combat experience. By sending pilots abroad for training, we gain valuable knowledge and prepare a new generation of elite aviators."
 PER_open_doshan_tappeh_aircraft_factory:0 "Open Doshan Tappeh Aircraft Factory"
 PER_open_doshan_tappeh_aircraft_factory_desc:0 "Establishing a domestic aircraft production facility at Doshan Tappeh will reduce dependence on foreign arms and stimulate our aviation industry."
 PER_buy_british_aircraft:0 "Buy British Planes"
 PER_buy_british_aircraft_desc:0 "British aircraft offer a proven technological edge. By acquiring their planes, we can quickly strengthen our air capabilities while learning from their designs."
 PER_protect_our_skies:0 "Protect Our Skies"
 PER_protect_our_skies_desc:0 "The air is no longer a safe domain. We must invest in interceptor squadrons and defensive infrastructure to shield our cities and military from enemy air attacks."
 PER_prioritize_anti_air_research:0 "Prioritize Anti-Air Research"
 PER_prioritize_anti_air_research_desc:0 "With modern threats emerging from the skies, we must prioritize the development of anti-aircraft systems, radar, and coordinated air defense networks."
 PER_development_fighters:0 "Develop Fighters"
 PER_development_fighters_desc:0 "Founded in 1925, our Air Force will finally have a fighter aircraft model from its own soil. Producing our own fighters will significantly strengthen our air defence. In this way, our country's air borders will be more secure than ever."
 PER_open_more_air_bases:0 "Open More Air bases"
 PER_open_more_air_bases_desc:0 "To effectively deploy and maintain a capable air force, we require more airfields across the country ensuring faster response times and operational flexibility."
 PER_modernize_our_airforce:0 "Complete Modernization of the Air Force"
 PER_modernize_our_airforce_desc:0 "After years of investment and reform, our air force stands ready as a symbol of national strength. We have achieved complete modernization — with cutting-edge aircraft, trained crews, and the infrastructure to support them."
 PER_train_women_pilots:0 "Train Women Pilots"
 PER_train_women_pilots_desc:0 "Breaking with tradition, we will open our skies to women. Training female pilots symbolizes our commitment to progress, inclusion, and making use of every capable citizen in defense of the homeland."
 PER_aircraft_innovations:0 "Aircraft Innovations"
 PER_aircraft_innovations_desc:0 "New aircraft technologies come out every year. These technologies could be very useful to us."
 PER_develop_aviation_industry:0 "Develop Aviation Industry"
 PER_develop_aviation_industry_desc:0 "To secure long-term sovereignty in the air, we must invest in research, skilled labor, and industrial capacity. A strong aviation industry is the backbone of national defense and innovation."

 #Dynamic Name
 PER_imperial_iranian_army:0 "[GetIranArmyName]"
 PER_imperial_iranian_army_desc:0 "In recent years, Iran's armed forces have been undergoing a significant process of modernization and strengthening. Equipped with new weapons and equipment, the Iranian army began to become one of the most powerful in the region."
 PER_ISLAMIC_ARMY_NAME:0 "Islamic Republic of Iran Army"
 PER_COMMUNIST_ARMY_NAME:0 "Iranian Peoples Army"
 PER_DEMOCRATIC_ARMY_NAME:0 "Iranian Army"
 PER_ARMY_NAME:0 "Imperial Iranian Army"
 PER_PERSIAN_ARMY_NAME:0 "Imperial Persian Army"
 
 #Army
 PER_imperial_iranian_ground_force:0 "[GetIranGroundArmyName]"
 PER_imperial_iranian_ground_force_desc:0 "The Iranian Ground Forces, which have played an important role in the modernization of the Iranian Armed Forces in recent years, are being equipped with new weapons and equipment. As part of these modernization efforts, the Iranian Land Forces are being provided with weapons such as state-of-the-art tanks, armored vehicles, howitzers and rocket launchers."
 PER_ISLAMIC_GROUND_ARMY_NAME:0 "Islamic Republic of Iran Army Ground Forces"
 PER_COMMUNIST_GROUND_ARMY_NAME:0 "Iranian Peoples Army Ground Forces"
 PER_DEMOCRATIC_GROUND_ARMY_NAME:0 "Iranian Army Ground Forces"
 PER_GROUND_ARMY_NAME:0 "Imperial Iranian Ground Forces"
 PER_PERSIAN_GROUND_ARMY_NAME:0 "Imperial Persian Ground Forces"

 #Air
 PER_AIRFORCE_NAME:0 "Imperial Iranian Air Force"
 PER_ISLAMIC_AIRFORCE_NAME:0 "Islamic Republic of Iran Air Force"
 PER_COMMUNIST_AIRFORCE_NAME:0 "People's Revolutionary Air Force"
 PER_DEMOCRATIC_AIRFORCE_NAME:0 "Iranian Air Force"
 PER_PERSIAN_AIRFORCE_NAME:0 "Imperial Persian Air Force"

