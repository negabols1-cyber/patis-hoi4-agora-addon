 PER_DEMOCRATIC_NAVY_NAME:0 "Iranian Navy"
 PER_COMMUNIST_NAVY_NAME:0 "People's Revolutionary Navy"
 PER_PERSIAN_NAVY_NAME:0 "Imperial Persian Navy"
