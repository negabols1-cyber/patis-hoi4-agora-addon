 #POL
 #Önceki silahlar
 POL_infantry_equipment_4:0 "KIS"
 POL_infantry_equipment_4_short:0 "KIS"
 POL_infantry_equipment_4_desc:0 "KIS is a 9x19mm Parabellum caliber submachine gun developed by Jan Piwnik. The weapon was patterned after Sten, retaining its left-side magazine. Main differences were a longer barrel, with conical rear part, and lack of stock."
 POL_infantry_equipment_5:0 "Choroszmanów"
 POL_infantry_equipment_5_short:0 "Choroszmanów"
 POL_infantry_equipment_5_desc:0 "Choroszmanów is a submachine gun developed by Grzegorz Choroszman. The design was based roughly on the Soviet PPD-40. It was a simple, sturdy and capable design that was easy and inexpensive to produce."
 POL_infantry_equipment_6:0 "PPS-42/43"
 POL_infantry_equipment_6_short:0 "PPS"
 POL_infantry_equipment_6_desc:0 "Pistolet-pulemyot Sudayeva, so ''Sudayev's submachine-gun'', is a submachine guns chambered in 7.62x25mm Tokarev, developed by Alexei Sudayev as a low-cost personal defense weapon for reconnaissance units, vehicle crews and support service personnel."
 POL_infantry_equipment_7:0 "Kbkg wz. 1955"
 POL_infantry_equipment_7_short:0 "Kbkg wz. 1955"
 POL_infantry_equipment_7_desc:0 "Kbkg wz. 1955 is a Polish-made version of the AK-47 assault rifle that can fire rifle grenades. The LON-I grenade launcher is screwed onto the forward end of the rifle barrel and locked into place by means of a spring-loaded plunger mounted in the front sight base of a modified AK-47 rifle."

