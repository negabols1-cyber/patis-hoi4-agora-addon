 #SOV
 SOV_infantry_equipment_0_desc:0 "Mosin-Nagant 1891/30 is a five-shot, bolt-action, internal magazine-fed military rifle developed by Sergei Mosin and Émile Nagant. Developed from 1882 to 1891, it was used by the armed forces of the Russian Empire, the Soviet Union and various other states."
 SOV_infantry_equipment_1_desc:0 "Pistolet-Pulemyot Degtyaryova, so ''Degtyaryov's machine pistol'', is a submachine gun originally designed in 1934 by Vasily Degtyaryov. The PPD have a conventional wooden stock, fired from an open bolt, and was capable of selective fire."
 SOV_infantry_equipment_2_desc:0 "Samozaryadnaya vintovka Tokareva, so ''Tokarev self-loading rifle'', is a semi-automatic battle rifle developed by Fedor Tokarev. The SVT is a gas-operated rifle with a short-stroke, spring-loaded piston above the barrel and a tilting bolt"
 SOV_infantry_equipment_3_desc:0 "Pistolet-pulemyot Shpagina-41, so ''Shpagin's machine-pistol'', is a selective-fire, open-bolt, blowback submachine gun that fires the 7.62x25mm Tokarev round. It was designed by Georgy Shpagin for cheaper alternative to PPD-40"
 SOV_infantry_equipment_4:0 "PPS-42/43"
 SOV_infantry_equipment_4_short:0 "PPS"
 SOV_infantry_equipment_4_desc:0 "Pistolet-pulemyot Sudayeva, so ''Sudayev's submachine-gun'', is a submachine guns chambered in 7.62x25mm Tokarev, developed by Alexei Sudayev as a low-cost personal defense weapon for reconnaissance units, vehicle crews and support service personnel."
 SOV_infantry_equipment_5:0 "SKS"
 SOV_infantry_equipment_5_short:0 "SKS"
 SOV_infantry_equipment_5_desc:0 "Samozaryadny karabin sistemy Simonova, so ''Self-loading carbine of the Simonov system'', is a semi-automatic rifle developed by small arms designer Sergei Gavrilovich Simonov. Its distinguishing characteristics include a permanently attached folding bayonet and a hinged, fixed magazine."
 SOV_infantry_equipment_6:0 "AK-47 Type 1"
 SOV_infantry_equipment_6_short:0 "AK-47"
 SOV_infantry_equipment_6_desc:0 "Avtomat Kalashnikova-47, so ''Kalashnikov's automatic-47'' is an  assault rifle that is chambered for the 7.62x39mm cartridge. Developed by Mikhail Kalashnikov in a similar way to the StG 44."
 SOV_infantry_equipment_7:0 "AK-47 Type 2A"
 SOV_infantry_equipment_7_short:0 "AK-47 2A"
 SOV_infantry_equipment_7_desc:0 "Avtomat Kalashnikova-47 Type 2, so ''Kalashnikov's automatic-47 Type 2'' is an  assault rifle that is chambered for the 7.62x39mm cartridge. Developed by Mikhail Kalashnikov in a similar way to the StG 44. Unlike the previous variant, it has a milled receiver. The barrel and chamber are chrome-plated to resist corrosion"
 
 SOV_infantry_at_desc:0 "Protivotankovoye samozaryadnoye ruzhyo obraztsa, so ''Anti-tank-self-loading gun pattern'', is an anti-tank rifle developed by Vasily Degtyaryov. It is a single-shot weapon which fires the 14.5x114 mm round"
 SOV_infantry_at2_desc:0 "Ruchnaya Protivotankovaya Granata Obraztca-40, so ''Hand-Held Anti-Tank Grenade-40'', is an anti-tank hand grenade developed by M. I. Puzirev. A marginally effective design capable of penetrating about 20-25 millimetres"
 SOV_infantry_at3:0 "RPG-43"
 SOV_infantry_at3_desc:0 "Ruchnaya Protivotankovaya Granata Obraztca-43, so ''Hand-Held Anti-Tank Grenade-43'', is a high-explosive anti-tank shaped charge hand grenade developed by N. P. Belyakov. The RPG-43 have a penetration of around 75 millimetres of rolled homogeneous armour at a 90° angle."
 SOV_infantry_at4:0 "RPG-6"
 SOV_infantry_at4_desc:0 "Ruchnaya Protivotankovaya Granata-6, so ''Handheld Anti-Tank Grenade-6'', is a high-explosive anti-tank shaped charge hand grenade developed by M. Z. Polevikov, L. B. Ioffe and N. S. Zhitkikh. It operated on the shaped charge Munroe effect principle, in which a metal-lined cone-shaped explosive charge would generate a very high speed, focused jet of metal that could penetrate armor-plate."
 SOV_infantry_at5:0 "RKG-3"
 SOV_infantry_at5_desc:0 "Ruchnaya Kumulyativnaya Granata-3, so ''Handheld Shaped-Charge Grenade'', is a high-explosive anti-tank shaped charge hand grenade. It operated on the shaped charge Munroe effect principle, in which a metal-lined cone-shaped explosive charge would generate a very high speed, focused jet of metal that could penetrate armor-plate."

 SOV_support_weapons_desc:0 "Pulyemyot Maksima PM1910, so ''Maxim's machine gun Model 1910'', is a heavy machine gun that was used by the Imperial Russian Army during World War I and the Red Army during the Russian Civil War. It was adopted in August 1910 and was derived from Hiram Maxim's Maxim gun, chambered for the standard Russian 7.62x54mmR rifle cartridge. The M1910 was mounted on a wheeled mount with a gun shield."
 SOV_support_weapons2_desc:0 "Pulemyot Degtyaryova Pekhotny, so ''Degtyaryov's infantry machine gun'', is a light machine gun firing the 7.62x54mmR cartridge developed by Vasily Degtyaryov. It will used in aircraft as a flexible defensive weapon."
 SOV_support_weapons3_desc:0 "Degtyaryova Stankovyy obraztsa 1939 goda is a medium machine gun, designed by Vasily Degtyaryov. The work on the gun's design began in 1930."
 SOV_support_weapons4_desc:0 "Stankovyy pulyemyot sistyemy Goryunova,so ''Mounted machinegun, Goryunov design'', is a medium machine gun developed by P.M. Goryunov. It is mounted on wheeled mounts, tripods and armored vehicles."

