 #PRC
 #Önceki silahlar
PRC_infantry_equipment_3_desc:0 "Mosin-Nagant 1891/30 is a five-shot, bolt-action, internal magazine-fed military rifle developed by Sergei Mosin and Émile Nagant. Developed from 1882 to 1891, it was used by the armed forces of the Russian Empire, the Soviet Union and various other states."
 PRC_infantry_equipment_4:0 "PPSH 41 & F1 Grenade"
 PRC_infantry_equipment_4_short:0 "PPSH 41"
 PRC_infantry_equipment_4_desc:0 "Pistolet-pulemyot Shpagina-41, so ''Shpagin's machine-pistol'', is a selective-fire, open-bolt, blowback submachine gun that fires the 7.62x25mm Tokarev round. It was designed by Georgy Shpagin for cheaper alternative to PPD-40"
 PRC_infantry_equipment_5:0 "DP-27/DP-28"
 PRC_infantry_equipment_5_short:0 "DP-27/DP-28"
 PRC_infantry_equipment_5_desc:0 "Pulemyot Degtyaryova Pekhotny, so ''Degtyaryov's infantry machine gun'', is a light machine gun firing the 7.62x54mmR cartridge developed by Vasily Degtyaryov. It will used in aircraft as a flexible defensive weapon."
 PRC_infantry_equipment_6:0 "Type 51 Rifle"
 PRC_infantry_equipment_6_short:0 "Type 51"
 PRC_infantry_equipment_6_desc:0 "Type 51 is a semi-automatic rifle cloned from by SKS. Its distinguishing characteristics include a permanently attached folding bayonet and a hinged, fixed magazine."
 PRC_infantry_equipment_7:0 "Type 53 Assault Rifle"
 PRC_infantry_equipment_7_short:0 "Type 53"
PRC_infantry_equipment_7_desc:0 "Type 53 Assault Rifle is a Chinese 7.62x39mm automatic rifle, a licensed derivative of the Soviet-designed AK-47. Unlike the AK-47, it has a milled receiver. The barrel and chamber are chrome-plated to resist corrosion"

 PRC_support_weapons:0 "Type 24 & Stokes mortar"

 PRC_support_weapons2:0 "DS-28 & RM 38"
 PRC_support_weapons2_desc:0 "Pulemyot Degtyaryova Pekhotny, so ''Degtyaryov's infantry machine gun'', is a light machine gun firing the 7.62x54mmR cartridge developed by Vasily Degtyaryov. It will used in aircraft as a flexible defensive weapon."
 PRC_support_weapons3:0 "SG-43 & BM-37"

 PRC_support_weapons4:0 "DShK & M1938 120mm"

 PRC_infantry_at:0 "Molotov Cocktail"
 PRC_infantry_at_desc:0 "Molotov Cocktail is a hand-thrown incendiary weapon consisting of a frangible container filled with flammable substances and equipped with a fuse. In use, the fuse attached to the container is lit and the weapon is thrown, shattering on impact. This ignites the flammable substances contained in the bottle and spreads flames as the fuel burns."
 PRC_infantry_at2:0 "PTRD"
 PRC_infantry_at2_desc:0 "Protivotankovoye samozaryadnoye ruzhyo obraztsa, so ''Anti-tank-self-loading gun pattern'', is an anti-tank rifle developed by Vasily Degtyaryov. It is a single-shot weapon which fires the 14.5x114 mm round"
 PRC_infantry_at3:0 "RPG-40"
 PRC_infantry_at3_desc:0 "Ruchnaya Protivotankovaya Granata Obraztca-40, so ''Hand-Held Anti-Tank Grenade-40'', is an anti-tank hand grenade developed by M. I. Puzirev. A marginally effective design capable of penetrating about 20-25 millimetres"
 PRC_infantry_at4:0 "RPG-43"
 PRC_infantry_at4_desc:0 "Ruchnaya Protivotankovaya Granata Obraztca-43, so ''Hand-Held Anti-Tank Grenade-43'', is a high-explosive anti-tank shaped charge hand grenade developed by N. P. Belyakov. The RPG-43 have a penetration of around 75 millimetres of rolled homogeneous armour at a 90° angle."
 PRC_infantry_at5:0 "RKG-3"
 PRC_infantry_at5_desc:0 "Ruchnaya Kumulyativnaya Granata-3, so ''Handheld Shaped-Charge Grenade'', is a high-explosive anti-tank shaped charge hand grenade. It operated on the shaped charge Munroe effect principle, in which a metal-lined cone-shaped explosive charge would generate a very high speed, focused jet of metal that could penetrate armor-plate."

