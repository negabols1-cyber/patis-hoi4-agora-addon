l_english:
 #GER
 GER_infantry_equipment_0_desc:0 "The Gewehr 98 is a bolt-action rifle made by Mauser for the German Empire as its service rifle from 1898 to 1935. The Gewehr 98 action, using a 5-round stripper clip loaded with the 7.92x57mm Mauser cartridge, successfully combined and improved several bolt-action engineering concepts which were soon adopted by many other countries, including the United Kingdom, United States, and Japan"
 GER_infantry_equipment_1_desc:0 "The Karabiner 98 kurz is a bolt-action rifle chambered for the 7.92x57mm Mauser cartridge. It was adopted on 21 June 1935 as the standard service rifle by the German Wehrmacht."
 GER_infantry_equipment_2_desc:0 "Maschinenpistole 40 is a submachine gun chambered for the 9x19mm Parabellum cartridge. Designed in 1938 by Heinrich Vollmer with inspiration from its predecessor the MP 38. Its advanced and modern features made it a favorite among soldiers."
 #GER_infantry_equipment_3:0 "Maschinenkarabiner 42(H)"
 #GER_infantry_equipment_3_short:0 "MKb 42(H)"
 GER_infantry_equipment_3_desc:0 "The Gewehr 43 or Karabiner 43 is a 7.92x57mm Mauser caliber semi-automatic rifle developed by Carl Walther GmbH. The design was based on that of the earlier G41(W) but incorporated an improved short-stroke piston gas system similar to that of the Soviet SVT-40."
 GER_infantry_equipment_4:0 "Sturmgewehr 44"
 GER_infantry_equipment_4_short:0 "StG 44"
 GER_infantry_equipment_4_desc:0 "Sturmgewehr 44, so ''Assault rifle 44'', is a assault rifle developed by Hugo Schmeisser. It is also known by its early designations as the MP 43 and MP 44 (Maschinenpistole 43 and 44). The StG 44 was an improvement of an earlier design, the Maschinenkarabiner 42(H)."
 GER_infantry_equipment_5:0 "CETME"
 GER_infantry_equipment_5_short:0 "CETME"
 GER_infantry_equipment_5_desc:0 "The CETME rifle is a stamped-steel, select-fire battle rifle produced by Centro de Estudios Técnicos de Materiales Especiales. The CETME rifle would become the foundation of the widely deployed German Heckler & Koch G3 battle rifle."
 GER_infantry_equipment_6:0 "Gewehr 3"
 GER_infantry_equipment_6_short:0 "G3"
 GER_infantry_equipment_6_desc:0 "The Gewehr 3 is a select-fire battle rifle chambered in 7.62x51mm developed by Heckler & Koch, in collaboration with the firearms manufacturer CETME."
 GER_infantry_equipment_7:0 "FN FAL"
 GER_infantry_equipment_7_short:0 "FN FAL"
 GER_infantry_equipment_7_desc:0 "FN FAL, so ''Light Automatic Rifle'' is a battle rifle developed by Dieudonné Saive. It received the title "the right arm of the free world" from its adoption by many self-proclaimed free world countries." 

 GER_infantry_at_desc:0 "Panzerfaust, so ''Tank fist'' or ''Armour fist'', is a single-shot man-portable anti-tank rocket launcher. The weapon is the first single-use light anti-tank weapons based on a pre-loaded disposable launch tube. It cost 15-25 Reichsmark to unit"
 GER_infantry_at2_desc:0 "Panzerschreck, so ''Tank's fright'' or ''Tank's bane'', an 88 mm reusable anti-tank rocket launcher. The weapon is shoulder-launched and fired a fin-stabilized rocket with a shaped-charge warhead. It cost 70 Reichsmark to unit"
 GER_infantry_at3:0 "Ofenrohr"
 GER_infantry_at3_desc:0 "Ofenrohr, so ''Stove pipe'', an 88 mm reusable anti-tank rocket launcher. The weapon is shoulder-launched and fired a fin-stabilized rocket with a shaped-charge warhead. It cost 70 Reichsmark to unit"
 GER_infantry_at4:0 "Raketenpanzerbüchse 54"
 GER_infantry_at4_desc:0 "Raketenpanzerbüchse 54, so ''Rocket Anti-armor Rifle Model 54'', an 88 mm reusable anti-tank rocket launcher. The weapon is shoulder-launched and fired a fin-stabilized rocket with a shaped-charge warhead. It cost 70 Reichsmark to unit"
 GER_infantry_at5:0 "Raketenpanzerbüchse 54 Mk2"
 GER_infantry_at5_desc:0 "Raketenpanzerbüchse 54 Mk2, so ''Rocket Anti-armor Rifle Model 54 Mk2'', an 88 mm reusable anti-tank rocket launcher. The weapon is shoulder-launched and fired a fin-stabilized rocket with a shaped-charge warhead. It cost 70 Reichsmark to unit"

 GER_support_weapons_desc:0 "Maschinengewehr 08 is a heavy machine gun which served as the standard HMG of the Imperial German Army during World War I. It was an adaptation of Hiram Maxim's 1884 Maxim gun design, and was produced in a number of variants during the war."
 GER_support_weapons2_desc:0 "Maschinengewehr 34 is a recoil-operated air-cooled general-purpose machine gun, first tested in 1929, introduced in 1934, and issued to units in 1936. It introduced an entirely new concept in automatic firepower."
 GER_support_weapons3_desc:0 "Maschinengewehr 42 is a recoil-operated air-cooled general-purpose machine gun. It is intended to supplement and replace the earlier MG 34, which was more expensive and took much longer to produce."
 GER_support_weapons4_desc:0 "Maschinengewehr 45 is a recoil-operated air-cooled general-purpose machine gun. The ammunition feed, the trigger group and parts of the butt stock of the MG 42 design were reused."

