 YEM_infantry_at:0 "Molotov Cocktail"
 YEM_infantry_at_desc:0 "Molotov Cocktail is a hand-thrown incendiary weapon consisting of a frangible container filled with flammable substances and equipped with a fuse. In use, the fuse attached to the container is lit and the weapon is thrown, shattering on impact. This ignites the flammable substances contained in the bottle and spreads flames as the fuel burns."
