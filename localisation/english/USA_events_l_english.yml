l_english: 
ef_usa.1.t:0 "MacArthur's Request"
ef_usa.1.d:0 "MacArthur is constantly putting pressure on us to launch a massive recruitment campaign. He argues that America's military power should be ahead of other countries in this environment where things are heating up. While it sounds like his request has something to do with another plan, we seem to have to accept it because of the mounting pressure."
ef_usa.1.a:0 "Approve"
ef_usa.1.b:0 "Reject"

ef_usa.2.t:0 "The Latest Status Of the Traitors"
ef_usa.2.d:0 "With the expansion of the FBI, we closely followed many treacherous politicians and soldiers. We know where they are doing what they are doing and who they are selling our information to."
ef_usa.2.a:0 "Keep following close"

ef_usa.3.t:0 "Execution Of Traitors"
ef_usa.3.d:0 "It's time to get rid of the traitors that we have been following closely for a long time with simultaneous operations. At the same time, this situation will cause people whom we have not yet determined to be traitors to question what they are doing and even to stop being treacherous."
ef_usa.3.a:0 "Start the operation"

ef_usa.4.t:0 "Raid The Cartel"
ef_usa.4.d:0 "Recently, the cartels have started to gain strength again, taking advantage of the turmoil in our internal affairs. Meanwhile, we have given them the opportunity to become stronger because we are dealing with the traitors among us. Now it's time to smash their heads."
ef_usa.4.a:0 "We can deal with them"
ef_usa.4.b:0 "Execute them all"

ef_usa.5.t:0 "Cartel War Is Over"
ef_usa.5.d:0 "After protracted conflicts with the cartels, we were able to defeat them before they were fully developed. These bastards will not trouble us again."
ef_usa.5.a:0 "Finally"

ef_usa.7.t:0 "Reports From Our Spies"
ef_usa.7.d:0 "After the surrender of the Chinese United Front, we are now the only obstacle to Japan's advance in the Pacific and we have two things that protect us from the Japan, the first is our faith and the second is our glorious navy. But our intelligence shows that the Japanese are growing their navy day by day and they are about to surpass the growth rate of our navy. No matter how much our economic crisis continues, we must strengthen our shield against the Japanese invaders by transferring part of our budget to our navy."
ef_usa.7.a:0 "God Bless the USA"

ef_usa.8.t:0 "Report on American Strategic Shift"
ef_usa.8.d:0 "Comrade General Secretary, our intelligence confirms that the Pentagon has shifted its posture. They have realized that a direct conflict would lead to mutual annihilation. They are digging in for a long struggle, relying on nuclear deterrence and proxy conflicts. We must adapt our strategy accordingly. The Balance of Terror is now the governing law of geopolitics."
ef_usa.8.a:0 "We shall bury them in the long run."