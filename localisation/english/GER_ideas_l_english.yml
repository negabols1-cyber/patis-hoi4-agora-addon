#Events #Temporary
germany.2000.t:0 "The Wehrmacht Takes Position"
germany.2000.desc:0 "The doors of the War Ministry opened today not to a new order, but to an old principle — reason. Generalfeldmarschall Werner von Blomberg and several other senior Wehrmacht officers have issued a quiet but resolute communique: they stand behind Speer’s efforts to remove the radical ideologues from the Reich’s inner circle. In their words: 'Germany must be governed by those who build, not those who burn.' With the military’s shadow cast behind him, Speer’s position is no longer that of a substitute — but of a statesman."
germany.2000.alt.desc:0 "The barracks and command halls of the Heer stirred quietly today, not with boots and orders, but with consent. Generalfeldmarschall Walther von Brauchitsch and several other senior Wehrmacht officers have issued a quiet but resolute communique: they stand behind Speer’s efforts to remove the radical ideologues from the Reich’s inner circle. In their words: 'Germany must be governed by those who build, not those who burn.' With the military’s shadow cast behind him, Speer’s position is no longer that of a substitute — but of a statesman."
germany.2000.a:0 "They will shield us from the fanatics"

germany.2001.t:0 "The Night of Silent Steel"
germany.2001.desc:0 "There were no gunshots in the corridors of Berlin. No speeches. No cries. Only locked doors, sealed orders and silent appointments. Within a single night, dozens of high-ranking figures from the SS, the Gestapo and the Propaganda Ministry vanished. Some were 'relieved of duty', others were 'reassigned' and a few were never seen again. Speer’s instructions had been cold and clear: 'The state will be governed not by ideological loyalty but by engineering principles.' That night, steel ruled Germany — quiet, calculated and absolute."
germany.2001.a:0 "We replaced chaos with calculation"

germany.2002.t:0 "A Golden Touch"
germany.2002.desc:0 "In one of his first acts as Führer, Hermann Göring ordered the redecoration of several government halls with gold trim and velvet furnishings. 'A Reich worthy of greatness must look the part,' he reportedly told aides. While some scoff at the expense, others see it as a symbol of restored stability."
germany.2002.a:0 "Let him have his golden Reich"

wtt_germany.1500.t:0 "[From.GetNameDefCap] Demand European Unification"
wtt_germany.1500.d:0 "[From.GetNameDefCap] has called a meeting of European nations today to discuss a European Federal State ! [GER.GetLeader] pleaded for peace in Europe and the formation of a global superpower. What shall we vote ?"
wtt_germany.1500.a:0 "Great idea!"
wtt_germany.1500.b:0 "A madman renting!"
wtt_germany.1501.t:0 "[From.GetNameDefCap] accept unification"
wtt_germany.1501.d:0 "After long talks, an agreement was reached with the [From.GetNameDefCap] government. They decided to join the European Federal State as a full member."
wtt_germany.1501.a:0 "Wonderful"
germany.9923.t:0 "Germany Wants Intervene in the [GetSovietCivilWarName]"
germany.9923.d:0 "This morning German diplomats came to us with a proposal. They said that they could come to our aid with a large army to help us in the civil war, but in return we must embrace democracy to make sure that peace on the continent is not broken again, or we could face very severe sanctions."
germany.9923.a:0 "Acceptable"
germany.9923.b:0 "Absolutely not"
germany.9922.t:0 "The Russians Accepted Our Offer"
germany.9922.t_2:0 "The Russians Rejected Our Offer"
germany.9922.d:0 "The Russians accepted our offer and said they would adopt democracy after the end of the war. We must immediately mobilize our armies and get involved in the war."
germany.9922.d_2:0 "The Russians rejected our offer. If they win the civil war and don't embrace democracy, it will be very bad for them."
germany.9922.a:0 "Good"
germany.9922.a_2:0 "Time will tell"
germany.10012.t:0 "The Germans are Demanding the Return of the Colonies"
germany.10012.desc:0 "After defeat in the Great War, Germany lost its small colonies in Africa and Oceania. Some of these, located in Africa, were given to our state under mandated administration. Today Germany demanded that at least part of Germany's African colonies be returned to their country."
germany.10013.t:0 "[From.GetName] Refused our Offer"
germany.10013.desc:0 "After we made our demands to the government and threatened to use military force if they refused, their answer was no and they said they would not be afraid to stand against us."
germany.10013.a:0 "We will remember this"
germany.899.t:0 "Genealogical Research"
germany.899.desc:0 "A group of scientists think that the Führer was descended from Habsburgs, but they want funding for research. What should we do?"
germany.890.t:0 "Genealogical Research - Phase 2"
germany.890.desc:0 "Scientists say they are close to the end of the research, but more funding is needed."
germany.891.t:0 "Genealogical Research - Result"
germany.891.desc:0 "According to the research, the Führer was indeed of Habsburg lineage. When we got this news, the Führer declared himself King."

germany.1100.t:0 "Anti-NSDAP Revolution Begins"
germany.1100.d:0 "The revolution has begun and we need to choose a leader to lead us so that our country does not descend into chaos."
germany.1100.a:0 "Strasser makes the most sense"
germany.1100.b:0 "We must try a new ideology with Dressler"
germany.1100.c:0 "Suppress the revolution, shoot everyone!"

germany.1101.t:0 "Death of Reinhard Heydrich"
germany.1101.d:0 "Reinhard Heydrich, the commander of the German Reich Security Main Office (RSHA), the acting governor of the Protectorate of Bohemia and Moravia and a principal architect of the Holocaust, was killed by shrapnel lodged in his lower back when a grenade exploded in an attack on his car."
germany.1101.a:0 "Rest in peace"

germany.1102.d:0 "Germany has plunged into civil war following the meteoric rise of Heinrich Himmler and the increasing dominance of the SS over the Wehrmacht. Alarmed by Himmler’s consolidation of power and the restructuring of the state along SS lines, a faction of senior Wehrmacht officers—including Walther von Brauchitsch and Werner von Fritsch have declared open rebellion against the new regime.\n\nThe conspirators, fearing the complete subjugation of the army by the SS, launched their uprising from key garrisons across central Germany. Fighting has erupted in multiple cities as the loyal SS forces attempt to crush the resistance. Germany now stands divided, with one side pledging allegiance to Himmler’s dark vision of the Reich, and the other fighting to preserve the old military order."

germany.9989.d:0 "We are now experiencing that joint leadership is not good, especially in wartime, when there are many different voices. When a decision has to be made, it takes a long time, so we need to choose a general who can lead us until the end of the war."

germany_habsburg.1.t:0 "The Habsburg Proposal"
germany_habsburg.1.d:0 "With the Kaiser’s health fading and the Hohenzollerns losing the confidence of the people, monarchists in the southern states have turned to a different heir — Otto von Habsburg. The Archduke resides quietly in Bavaria, maintaining correspondence with Catholic leaders and former imperial officers. Should we extend an official invitation to make him Emperor of Germany?"
germany_habsburg.1.a:0 "Send the invitation"
germany_habsburg.1.b:0 "This would split the monarchy further. Abandon the idea"

germany_habsburg.2.t:0 "Otto von Habsburg Crowned as German Kaiser"
germany_habsburg.2.d:0 "In a historic ceremony held in Berlin today, Otto von Habsburg, heir to the long-defunct Austro-Hungarian throne, has been crowned Kaiser of the German Empire. The event marks an unprecedented return of Habsburg influence to Central Europe after nearly two decades of exile and political marginalization. The young Kaiser has pledged to lead a new era of unity and stability, bridging the proud traditions of both Austria and Germany under one imperial banner. While some see this as a bold step toward reconciliation among the old empires of Europe, others view it as a dangerous revival of dynastic politics."
germany_habsburg.2.a:0 "A new Kaiser for a new age!"
germany_habsburg.2.b:0 "The Habsburgs rise once more?"
germany_habsburg.2.c:0 "Could this be Austria's redemption?"

germany_habsburg.3.t:0 "A Demand from the German Kaiser"
germany_habsburg.3.d:0 "Kaiser Otto von Habsburg, now ruler of Germany and Austria, has formally sent a demand to Budapest for the Hungarian crown. The Kaiser cites his hereditary right as the last heir of the Austro-Hungarian dynasty and emphasizes the benefits of a unified German-Hungarian empire. Discussions in Budapest are tense, with Regent [HUN.GetLeader] weighing the political, military, and diplomatic implications of this unprecedented request. The decision will not only determine the fate of Hungary but may also reshape the balance of power in Central Europe."
germany_habsburg.3.a:0 "We grant the crown to Otto"
germany_habsburg.3.b:0 "We reject the Kaiser's demand"

germany_habsburg.4.t:0 "[From.GetNameDef] Accepts the Kaiser's Demand"
germany_habsburg.4.d:0 "Word has arrived from Budapest: [HUN.GetLeader] has agreed to cede the crown to Kaiser Otto. In Berlin the news was met with jubilant celebration, while diplomats across Europe hasten to reassess alliances. A new chapter opens — the Kaiser now rules over a realm joined from the Rhine to the Danube."
germany_habsburg.4.a:0 "Long live the Kaiser!"

germany_habsburg.5.t:0 "[From.GetNameDef] Rejects the Kaiser's Demand"
germany_habsburg.5.d:0 "[HUN.GetLeader] has flatly refused the Kaiser's claim. Budapest's rebuke is not merely a diplomatic snub but a direct challenge to Otto's vision of unity. Tensions along the border rise and the question now is no longer rhetorical — diplomacy must be weighed against the terrible certainty of arms."
germany_habsburg.5.a:0 "Prepare for military action"

germany_habsburg.6.t:0 "A Royal Union"
germany_habsburg.6.d:0 "Kaiser Otto has sent a formal proposal to Vienna, urging our nation to renew its historical ties with the Habsburg dynasty. Instead of a full political union, he offers a protective alliance, where Austria will be recognized as a sovereign kingdom under the imperial protection of the German Empire. We will regain our status as the heart of the monarchy, while our security is guaranteed by the might of Berlin. What shall be our decision?"
germany_habsburg.6.a:0 "We accept this noble offer"
germany_habsburg.6.b:0 "We must remain truly independent"

germany_habsburg.7.t:0 "A Call for Unification"
germany_habsburg.7.d:0 "Kaiser Otto, in a move that has stunned the world, has declared the historical unification of all German peoples. He calls upon Austria to join the German Empire, not as a subject, but as a long-lost brother returning home. The telegram from Berlin is clear: a new, greater Germany awaits, with our two nations united once more. How shall we respond to this extraordinary demand?"
germany_habsburg.7.a:0 "Accept our destiny"
germany_habsburg.7.b:0 "We will not yield"

germany_habsburg.8.t:0 "The Emperor's Protectorate"
germany_habsburg.8.alt.t:0 "The Unification is Complete!"
germany_habsburg.8.d:0 "Vienna has recognized the authority of our Kaiser and agreed to become a loyal protectorate of the Reich. The historic connection between the two great German houses has been restored. Austria will serve as a faithful and sovereign ally, while we gain a crucial strategic partner in Central Europe. A new era of cooperation has begun."
germany_habsburg.8.alt.d:0 "Vienna has bowed to the will of the people and the call of our rightful Kaiser. The Austrians, our long-lost brethren, have agreed to a peaceful Anschluss. The old rivalry between Berlin and Vienna is over, replaced by a single, powerful German Reich that stretches from the North Sea to the Alps. The dream of a great Germany is now a reality."
germany_habsburg.8.a:0 "The Emperor's authority is secured"
germany_habsburg.8.b:0 "A new German Reich rises!"

germany_habsburg.9.t:0 "[FROM.GetNameDefCap] Rejects our offer"
germany_habsburg.9.d:0 "The stubborn leadership in Vienna has foolishly rejected our offer of protection. They have chosen to face the coming storms alone, rather than stand united with their kinsmen. Their refusal is not only a personal slight to our Kaiser but a grave mistake that will surely have dire consequences."
germany_habsburg.9.alt.d:0 "The politicians in Vienna have chosen a path of foolish pride over destiny. They have rejected our generous offer of unification, clinging to a false independence that will soon prove to be their undoing. We must not let this insult go unanswered. The German people demand unity, and we will achieve it by force if necessary."
germany_habsburg.9.a:0 "They will be taught a lesson"

germany_habsburg.10.t:0 "A Proposal of Protection"
germany_habsburg.10.d:0 "Kaiser Otto has made a surprising offer to our nation. Citing the historical ties of the Bohemian Crown to the House of Habsburg, he proposes that we accept a Habsburg prince as our new king. In return, the German Empire will guarantee our security and recognize our internal sovereignty as a protected state. This would ensure our survival and prosperity under the strong hand of the new German Empire."
germany_habsburg.10.a:0 "Long live the King of Bohemia!"
germany_habsburg.10.b:0 "Our independence is not for sale!"

germany_habsburg.11.t:0 "The Imperial Ultimatum"
germany_habsburg.11.d:0 "Kaiser Otto has made a decisive declaration, stating that the Crown of St. Wenceslaus, and with it the fate of the [ROOT.GetAdjective] people, must be tied to the House of Habsburg once more. He demands that we not only accept a Habsburg prince as our king but also hand over the German-populated Sudetenland to the Reich. Our nation's future hangs on our decision to become an integrated part of the new German sphere of influence."
germany_habsburg.11.a:0 "We will submit"
germany_habsburg.11.b:0 "Never! We will fight for every inch of our land"

germany_habsburg.12.t:0 "[FROM.GetNameDefCap] Accepts our offer"
germany_habsburg.12.d:0 "The government in [FROM.Capital.GetCapitalVictoryPointName] has accepted our generous offer. The new Habsburg king has been crowned in Prague as the ruler of the Kingdom of Bohemia, and their nation is now a loyal protectorate of the Reich. This peaceful transition not only secures a key ally but also restores our dynastic claim to the Bohemian Crown."
germany_habsburg.12.alt.d:0 "The [FROM.GetAdjective] government has capitulated to our demands. The Sudetenland has been peacefully ceded to the Reich, and the new Habsburg King has taken the throne of Bohemia. The Kingdom of Bohemia is now an vital part of our new Kaiserreich. The rich industrial heartland now belongs to us, securing our power in Central Europe."
germany_habsburg.12.a:0 "The Empire expands"
germany_habsburg.12.b:0 "A most successful negotiation"

germany_habsburg.13.t:0 "[FROM.GetNameDefCap] Rejects our offer"
germany_habsburg.13.d:0 "The foolish leaders in [FROM.Capital.GetCapitalVictoryPointName] have refused our proposal of protection. They have chosen to defy history and our generous offer. This defiance cannot go unpunished. We must now show them the futility of their resistance."
germany_habsburg.13.alt.d:0 "[FROM.GetNameDefCap] have foolishly refused to cede their land and accept our rule. They have chosen to fight us, clinging to a false sense of independence. Their refusal is not only a personal insult to our Kaiser but a direct challenge to the authority of our new Empire."
germany_habsburg.13.a:0 "They will be forced to yield"

germany_habsburg.14.t:0 "The Galicia Edict"
germany_habsburg.14.d:0 "Kaiser Otto has declared his intention to restore all ancestral lands of the House of Habsburg. A formal diplomatic note has been delivered to [ROOT.Capital.GetCapitalVictoryPointName], outlining our claim to the historical territory of the Kingdom of Galicia and Lodomeria. While we value peace between our nations, this is a matter of historical right and imperial destiny. We must decide whether to honor our rightful claim or defy the new order."
germany_habsburg.14.a:0 "We will negotiate a transfer of the territories"
germany_habsburg.14.b:0 "We will never surrender our land!"

germany_habsburg.15.t:0 "[FROM.GetNameDefCap] Accepts our offer"
germany_habsburg.15.d:0 "The government in [FROM.Capital.GetCapitalVictoryPointName] has agreed to our demands, ceding the historical lands of Galicia and Lodomeria to the Reich. Our diplomatic pressure proved successful, and a peaceful transfer of sovereignty has been achieved. The ancestral eastern borders of the Austrian Empire are now restored, and our imperial dominion is secured."
germany_habsburg.15.a:0 "A most peaceful success"

germany_habsburg.16.t:0 "[FROM.GetNameDefCap] Rejects our offer"
germany_habsburg.16.d:0 "The [FROM.GetAdjective] state has foolishly chosen to defy our just and historical claim. They have rejected our offer, choosing to cling to land that is rightfully ours. Their arrogance will not go unpunished. The time for diplomacy is over. We must now use force to reclaim what belongs to the Reich."
germany_habsburg.16.a:0 "The Kaiser's will shall be done"

germany_habsburg.17.t:0 "[FROM.GetLeader] Demands Our Submission"
germany_habsburg.17.alt.t:0 "[FROM.GetNameDefCap] Demands the Return of Imperial Lands"
germany_habsburg.17.d:0 "An official delegation from [FROM.GetNameDef] has arrived, carrying a message from [FROM.GetLeader]. The Emperor insists that our lands, once part of the Imperial Crown, must now return under Habsburg rule. In exchange, he promises autonomy and protection within the restored Empire. Our government is now faced with a critical choice — comply with [FROM.GetNameDef]'s demand peacefully, or reject it and prepare for the inevitable consequences."
germany_habsburg.17.alt.d:0 "A formal message has arrived from [FROM.GetNameDef], signed by [FROM.GetLeader]. In it, the [FROM.GetAdjective] government claims that certain territories currently under our administration are rightfully part of their historical domain. The document demands that we immediately cede these lands back to Imperial control. The wording leaves no doubt — [FROM.GetAdjective] intentions are clear, and refusal may bring consequences."
germany_habsburg.17.a:0 "We shall accept the Emperor’s demand"
germany_habsburg.17.b:0 "Never! These lands are ours and will remain so!"

germany_habsburg.18.t:0 "[FROM.GetNameDefCap] Accepts Our Offer"
germany_habsburg.18.d:0 "Envoys from [FROM.GetNameDef] have delivered their response — they have formally accepted the Emperor’s claim and agreed to reintegrate their lands into our Empire. The Habsburg legacy grows stronger, and another piece of the old Crownlands returns to its rightful place."
germany_habsburg.18.a:0 "The Empire rises once more"

germany_habsburg.19.t:0 "[FROM.GetNameDefCap] Rejects Our Offer"
germany_habsburg.19.d:0 "Our ultimatum has been met with defiance. [FROM.GetLeader] has refused to yield, denouncing our claim as illegitimate and vowing to defend their sovereignty. The Emperor’s patience wears thin — the time for words has ended."
germany_habsburg.19.a:0 "Then they shall learn the price of defiance"

germany_habsburg.20.t:0 "The Habsburg Ultimatum to the Lowlands"
germany_habsburg.20.d:0 "A proclamation from Berlin has reached The Brussels, sealed with the twin-headed eagle of the Habsburg dynasty. Otto von Habsburg, speaking as Emperor of a reborn Empire, has declared that the Lowlands cannot remain adrift amid the turmoil of Europe. He insists that only the guidance of the Imperial Crown can guarantee their safety and prosperity. Behind the lofty words of unity and stability lies a simple truth: the Emperor demands submission. Whether this is to restore order or to expand his dominion, the choice before us is clear — obedience, or defiance."
germany_habsburg.20.a:0 "Accept Imperial protection"
germany_habsburg.20.b:0 "We shall not bow to Vienna or Berlin!"

germany_habsburg.21.t:0 "[FROM.GetNameDefCap] Accepts Imperial Protection"
germany_habsburg.21.d:0 "The Belgian government has formally accepted Otto von Habsburg’s offer of protection. The Low Countries are now bound to the Imperial sphere, marking another step in the restoration of Habsburg authority across Europe. Otto von Habsburg delivered a speech in Berlin, declaring that 'a loyal and prosperous Belgium shall once again flourish under the banner of order and unity.'"
germany_habsburg.21.a:0 "Another realm joins"

germany_habsburg.22.t:0 "[FROM.GetNameDefCap] Rejects Our Offer"
germany_habsburg.22.d:0 "The Belgian government has rejected our proposal for Imperial protection, publicly denouncing it as an attempt to subvert their sovereignty. The refusal has been met with outrage in Berlin, where Otto von Habsburg declared that those who turn away from Imperial peace must face the turmoil of their own choosing. Tensions rise as Imperial forces begin drawing plans for a more forceful resolution of the Belgian question."
germany_habsburg.22.a:0 "They have chosen defiance over destiny"
 
germany_ss_wh_conflict.1.t:0 "Wehrmacht Officials Disturbed"
germany_ss_wh_conflict.1.d:0 "With the increasing authorities of the Schutzstaffel units in recent days, the Schutzstaffel has begun to become more powerful in the political and military fields.\n\nWehrmacht officials were disturbed by this situation and told to [GER.GetLeader] that they were uncomfortable with this situation, but they did not receive an answer. The problem is getting bigger. What should be done ?"
