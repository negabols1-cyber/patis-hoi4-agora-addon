l_english:
persia.1.t:0 "[GetYear] Emergency Elections"
persia.1.d:0 "At last, the first independent democratic election in our democratized country is taking place. After Reza Shah's abdication of power to diplomats, the people urgently needed to elect a new president. Let's see who will win the elections."
persia.1.a:0 "Mohammad Ali Foroughi has the experience to do the job"
persia.1.b:0 "Mohammad Mosaddegh is the right choice"

persia.2.t:0 "[FROM.GetName] Accepts Our Offer"
persia.2.d:0 "[FROM.GetLeader] has agreed to cooperate with us to further align ourselves with each other."
persia.2.a:0 "Nice"

persia.3.t:0 "[FROM.GetName] Rejects our Offer"
persia.3.d:0 "Sadly, [FROM.GetNameDef] has refused our offer, as it would 'negate their sovereignty'. It is their loss to refuse our generous offer."
persia.3.a:0 "Bullshit!"

persia.4.t:0 "Iran Wants to Revise Oil Agreement"
persia.4.d:0 "Iran wants the oil deal that we have with them to be revised in a way that benefits both sides. They think this can be done so that this agreement, which is now a burden on their economy, can also strengthen our alliance."
persia.4.a:0 "Makes sense"
persia.4.b:0 "Not necessary"

persia.5.t:0 "Iran Demands our Assets in Syria"
persia.5.d:0 "Iran has sent us an ultimatum to hand over to them all our assets in Syria and its surroundings. They said that if the handover does not happen soon, they will use force if necessary."
persia.5.a:0 "No need for war, give the land"
persia.5.b:0 "They are bluffing"

persia.6.t:0 "Iran Demands our Assets in Egypt and Levant"
persia.6.d:0 "Iran has sent us an ultimatum to hand over to them all our assets in Egypt and Levant. They said that if the handover does not happen soon, they will use force if necessary."
persia.6.a:0 "No need for war, give the land"
persia.6.b:0 "They are bluffing"

persia.7.t:0 "Invite Qajar King"
persia.7.d:0 "We need to decide now who from the Qajar dynasty we are going to put in charge so that when the coup is successful, it won't be too late. I wonder who it would be more appropriate to invite."
persia.7.a:0 "Mohammad Hassan Mirza Qajar"
persia.7.b:0 "Fereydoun Mirza Qajar"

persia.8.t:0 "[From.GetName] Requests Tighter Cooperation"
persia.8.d:0 "[From.GetName] has expressed their desire to strengthen the bond between our two nations."
persia.8.a:0 "Gladly"
persia.8.b:0 "We better keep our distance"

persia.9.t:0 "[From.GetName] Accepts"
persia.9.d:0 "[From.GetName] has agreed to strengthen our bond."
persia.9.a:0 "Nice"

persia.10.t:0 "[From.GetName] Refuses"
persia.10.d:0 "[From.GetName] has refused further cooperation between us."
persia.10.a:0 "A pity"

persia.11.t:0 "Iranian Resource Exchange"
persia.11.d:0 "[From.GetLeader] has offered a trade deal with Germany if [Root.GetLeader] will agree to send Iran designs on the latest light and medium tanks we have developed. This seems to be the first stage in closer Iran-German relations so even if it serves no military purpose it may be useful to us geopolitically. Of course, these state of the art tank designs could be falling into the hands of a future enemy..."
persia.11.a:0 "This agreement will help both Germany and Iran."
persia.11.b:0 "Never!"

persia.12.t:0 "[From.GetNameDef] Offers Non-aggression Pact"
persia.12.d:0 "[From.GetName] proposes a Non-aggression Pact, aiming to solidify peaceful relations and prevent any acts of aggression or hostility between two countries. This pact would serve as a commitment to mutual respect, territorial integrity, and the peaceful resolution of disputes."
persia.12.a:0 "Okey"
persia.12.b:0 "Unnecessary"

persia.13.t:0 "[From.GetNameDef] Offers Treaty of Friendship"
persia.13.d:0 "[From.GetName] extends a hand of friendship and cooperation by offering a Treaty of Friendship. This treaty aims to strengthen diplomatic ties, promote mutual understanding, and foster peace and stability in the region. If we accept this agreement, both countries can contribute to each other's development through increased trade, cultural exchange and cooperation in various fields."
persia.13.a:0 "Sounds good"
persia.13.b:0 "We will maintain our neutrality"

persia.14.t:0 "[From.GetNameDef] Demands Our Land"
persia.14.d:0 "Iranian diplomats pointed to the Iranians living in the region and said that states doesn't belong to us, it should belong to them and that if we don't give them what they want, they will take it by force if necessary."
persia.14.a:0 "No need for war, give the territory"
persia.14.b:0 "Bullshit!"

persia.15.t:0 "[From.GetNameDef] Demands Our Annexation"
persia.15.d:0 "The Iranian government wants us annexed to serve a greater purpose under Islam. They say it will be easier to fight the infidels if we all join Iran, but it also means surrendering our independence to a country that belongs to the Shia branch. We don't think this is possible."
persia.15.a:0 "There's nothing to do"
persia.15.b:0 "We will not surrender to Shia dogs"

persia.16.t:0 "[ROOT.GetAdjective] Peace Demands"
persia.16.d:0 "We bring glad tidings from the front! Our forces recently won the battle and managed to secure the our claims. With this decisive blow struck against [SOV.GetNameDef] we find ourselves in a strong position to open peace talks. \n\nOne of the stated objectives of the [SOV.GetAdjective] invasion was to increase the buffer around our claimed states and now that they have undeniably not only failed in this goal, but indeed lost the states itself. We therefore imagine that they will be hungry to divest themselves of this conflict. \n\nIt is now our decision when to begin talks, we could continue the fight and see if we can take more, or aim for a white peace as soon as possible." 
persia.16.a:0 "It might be time for peace..."

persia.17.t:0 "[FROM.GetAdjective] Territorial Demands for Peace"
persia.17.d:0 "We have just received a demand to surrender from our [FROM.GetAdjective] rivals. As a part of the stipulations for peace, they require us to hand over a number of different territories in the Caucasia and Central Asia, and they insist we vacate these lands as quickly as possible."
persia.17.a:0 "We have no other option but to admit defeat..."
persia.17.b:0 "How dare they!?"

persia.18.t:0 "[FROM.GetNameDefCap] Accepts Our Peace Demands"
persia.18.d:0 "They have accepted the peace deal! Spontaneous celebrations have broken out on the streets as news of our victory spreads. [FROM.GetAdjective] troops have already started to withdraw from our territory, returning in misery to their homes. \n\nThis is certainly a day that will stand as one of pride for our nation, as not only have we beaten the invaders, we beat them so soundly that we were able to expand our own territories at their expense!"
persia.18.a:0 "Hopefully they learned their lesson at last."

persia.19.t:0 "[FROM.GetNameDefCap] Rejects Our Peace Demands"
persia.19.d:0 "Those fools in [FROM.GetNameDef] have refused our gracious offer for peace. Their increasingly desperate government cling on to the delusional idea that they can still win, aware that if the truth about the state of the war were to escape, they would have to face mass uprisings and perhaps even a revolution at home. \n\nOur soldiers remain in the field, their enduring spirits high, secure in the knowledge that they continue the righteous struggle, preparing themselves for more fighting to come, confident that victory is close."
persia.19.a:0 "The fools will pay for this!"

persia.100.t:0 "Death of the Shah"
persia.100.desc:0 "Reza Shah Pahlavi, representing the Pahlavi monarchy, has died to natural causes. As his son takes his place representing the monarchy, [ROOT.GetNameDef] looks back on his modernizing reign."
persia.100.a:0 "Regretful"

persia_clergy.2.t:0 "Clergy Wants More Mosques Built"
persia_clergy.2.d:0 "The clergy are exerting pressure on the government to allocate resources for the construction of additional mosques. They argue that more places of worship are needed to accommodate the spiritual needs of the growing population and to reinforce the religious values of the nation. The clergy believe that the state's support in this matter is crucial for maintaining social harmony and religious adherence among the people."
persia_clergy.2.a:0 "Approve the construction of more mosques"
persia_clergy.2.b:0 "Deny their request"

persia_clergy.3.t:0 "Clergy Demand Financial Support From State Treasury"
persia_clergy.3.d:0 "The clergy have approached the government with demands for financial support from the state treasury. They claim that the religious institutions are struggling to sustain themselves and need state funding to continue their activities. The clergy argue that this support is essential for preserving the cultural and religious fabric of the nation. However, meeting their demands could strain the government's budget and lead to potential conflicts over the allocation of resources."
persia_clergy.3.a:0 "Provide financial support to the clergy"
persia_clergy.3.b:0 "Refuse their demands"

persia_clergy.4.t:0 "Clergy Demands More Land"
persia_clergy.4.d:0 "The clergy are now demanding more land from the state to expand their influence and control. They argue that additional land is necessary for building new religious schools, mosques, and other facilities to serve the faithful. This move would significantly increase their power and potentially limit the government's ability to manage the country's resources effectively."
persia_clergy.4.a:0 "Grant them more land"

persia_clergy.5.t:0 "Clergy Wants Alocohol Banned"
persia_clergy.5.d:0 "The clergy have put forth a demand to ban the sale and consumption of alcohol throughout the country. They argue that alcohol is a corrupting influence that leads to moral decay and societal problems. The clergy believe that banning alcohol is essential for upholding Islamic values and ensuring the health and wellbeing of the population. Implementing such a ban, however, could face resistance from various segments of society and impact the economy."
persia_clergy.5.a:0 "We will think about it"

persia_clergy.6.t:0 "Clergy Wants More Conservative Education"
persia_clergy.6.d:0 "The clergy are advocating for a more conservative approach to education. They want to revise the curriculum to emphasize traditional religious values and teachings, ensuring that the next generation grows up with a strong adherence to Islamic principles. This shift in educational policy could shape the nation's future culture and ideology, but it may also limit academic freedom and modern educational practices."
persia_clergy.6.a:0 "This is an important issue to think about"

persia_clergy.7.t:0 "Clergy Demands Lifting of Hijab Ban"
persia_clergy.7.d:0 "The clergy are demanding the lifting of the ban on hijabs. They argue that wearing the hijab is a fundamental religious right and an important aspect of cultural identity for many women in the country. Lifting the ban would, according to them, restore religious freedom and respect for traditional values."
persia_clergy.7.a:0 "Lift the hijab ban"
persia_clergy.7.b:0 "Maintain the ban"

persia_clergy.8.t:0 "Clergy Is Influencing More People"
persia_clergy.8.d:0 "Reports indicate that the clergy are increasing their influence over the population. Through sermons, community activities, and religious gatherings, they are spreading their message and gaining more followers. This growing influence could bolster their demands and affect public opinion on various issues."
persia_clergy.8.a:0 "Monitor their activities closely"

persia_clergy.9.t:0 "Clergy Don't Like Our Policies"
persia_clergy.9.d:0 "The clergy have expressed dissatisfaction with the current government's policies. They believe that recent decisions and reforms are contrary to their religious teachings and values. This discontent could lead to increased tensions between the government and the religious leaders."
persia_clergy.9.a:0 "Reconsider our policies"

persia_clergy.10.t:0 "Clergy Are Angry"
persia_clergy.10.d:0 "The clergy are furious with the government's actions. They feel that their demands have been ignored and that their influence is being undermined. This anger could lead to significant unrest and opposition, posing a challenge to the government's stability."
persia_clergy.10.a:0 "Address their concerns"

persia_clergy.11.t:0 "Assassination Attempt On [ROOT.GetLeader]"
persia_clergy.11.d:0 "In a shocking turn of events, an assassination attempt on [ROOT.GetLeader] has been linked to radical elements within the clergy. The attackers, motivated by the Shah's secular policies and perceived threats to religious authority, aimed to destabilize the government and restore greater clerical influence. Fortunately, the attempt was foiled, but the incident has escalated tensions and necessitated a thorough investigation into the extent of clerical involvement."
persia_clergy.11.a:0 "Strengthen security measures"
persia_clergy.11.b:0 "Investigate the clergy thoroughly"

persia_misc.1.t:0 "[FROM.GetAdjective] Military Investments in [ROOT.GetName]"
persia_misc.1.d:0  "[FROM.GetName] has recognized that the more the Middle East region is developed, the more prosperous our people become, and the the more we all benefit from shared defense and trade. The first step towards achieving this dream is to increase our collective defensive capabilities to fend off foreign threats. \n\nAs a result, [FROM.GetName] has generously offered us industrial equipment and specialists to help boost our military production."
persia_misc.1.a:0 "We will make good use of this!"

persia_misc.2.t:0 "Reza Shah Pahlavi Assassinated"
persia_misc.2.d:0 "In a tragic turn of events, Reza Shah Pahlavi, the ruler of Persia, has been assassinated, triggering widespread chaos and violence across the nation. The assassination has sparked intense factional rivalries and ethnic tensions, leading to the outbreak of a full-scale civil war. Various factions, including loyalists to the Shah, religious radicals, and regional separatists, are vying for control, plunging Persia into a state of turmoil and uncertainty. The country's future hangs in the balance as opposing forces clash in a struggle for dominance amid the chaos."
persia_misc.2.a:0 "We must maintain control"
persia_misc.2.b:0 "A worrying event"