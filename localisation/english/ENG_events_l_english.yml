l_english:
 mtg_britain_ef.1.t:0 "Find A New King"
 mtg_britain_ef.1.d:0 "Our king's marriage scandal has seriously damaged our reputation. To remedy this situation, we must forcibly dethrone the king and find other kings to deserve the throne of England."
 mtg_britain_ef.1.a:0 "German king is the best option"
 mtg_britain_ef.1.b:0 "Scottish king makes more sense"

 mtg_britain_ef.2.t:0 "Egypt Demands Dominion Status"
 mtg_britain_ef.2.d:0 "Egypt took advantage of our existing internal turmoil and demanded to be elevated to dominion status. How should we respond to this demand?"
 mtg_britain_ef.2.a:0 "We will certainly accept the demand"
 mtg_britain_ef.2.b:0 "These acts will not go unpunished!"

 mtg_britain_ef.3.t:0 "Offer From United Kingdom"
 mtg_britain_ef.3.d:0 "[ENG.GetLeader] of United Kingdom presented us with an offer. They wanted us to stand by their side in their stance against Germany and to have Wilhelmina become the head of our country again in this monarchical order that will rise again."
 mtg_britain_ef.3.a:0 "There's nothing we can do but accept"
 mtg_britain_ef.3.b:0 "This is an unrealistic idea!"

 mtg_britain_ef.4.t:0 "Reply from the Netherlands"
 mtg_britain_ef.4.d:0 "Wilhelmina announced that she accepted our offer and would support us in every way possible."
 mtg_britain_ef.4.a:0 "Nice"

 mtg_britain_ef.5.t:0 "Reply from the Netherlands Wilhelmina Refuses"
 mtg_britain_ef.5.d:0 "Wilhelmina stated that she saw our proposal as an impossible fantasy and nonsense. She said she wouldn't be with us on this one."
 mtg_britain_ef.5.a:0 "A missed opportunity"

 mtg_britain_ef.6.t:0 "Operation Unthinkable"
 mtg_britain_ef.6.d:0 ""The United Kingdom has prepared a plan dubbed \"Operation Unthinkable\" with the aim to stop the spread of communism in Europe. They acknowledge the risks involved and for the need to cease war activity due to war exhaustion. Should we accept the proposal, we face yet another World War. There is no doubt that Stalin will be angered, and will ensure a difficult fight for survival. Thorough consideration of our current situation is strongly advised. How shall we respond?""
 mtg_britain_ef.6.a:0 "The risk is worth taking"
 mtg_britain_ef.6.b:0 "There's a reason why it is unthinkable"

 mtg_britain_ef.7.t:0 "The United States Agrees"
 mtg_britain_ef.7.d:0 "The Americans have agreed to begin preparations for the operation. The General Defense staff have been informed and are issuing orders to re-mobilize.  Intelligence reports that Soviet reprisal will be imminent amd advise caution."
 mtg_britain_ef.7.a:0 "May our children forgive us"

 mtg_britain_ef.8.t:0 "The United States Refuses"
 mtg_britain_ef.8.d:0 "The Americans have decided not to follow through with this proposal, stating that the world needs to demobilize and rebuild, with risks being too great to justify for an offenive war. Soviet intelligence and military strategic positioning are also deemed too counter-effective for the Allies to mount any successfull invasion, following the example of the invasion of the Axis powers as well."
 mtg_britain_ef.8.a:0 "The answer we expect"

 mtg_britain_ef.9.t:0 "English-German Trade Agreement"
 mtg_britain_ef.9.d:0 "The [FROM.GetAdjective] ambassador has contacted our diplomats proposing a trade agreement between our countries. According to the proposal, [FROM.GetNameDef] will send us raw materials, metal ores and aluminium. \nThis agreement will undoubtedly help us in the war effort against the hostile nations in Europe, allowing us to find the means to evade a potential enemy blockade."
 mtg_britain_ef.9.a:0 "We are in need of raw materials"
 mtg_britain_ef.9.b:0 "An unacceptable offer"

 mtg_britain_ef.10.t:0 "[GER.GetNameDefCap] signs the English-German Trade Agreement"
 mtg_britain_ef.10.d:0 "[FROM.GetAdjective] diplomats have informed us that they have agreed to our proposal. Our countries have entered into a trade pact whereby [ROOT.GetNameDef] will send raw materials such as metal ores and aluminium to [FROM.GetNameDef]."
 mtg_britain_ef.10.a:0 "It will benefit both economies."

 mtg_britain_ef.11.t:0 "[GER.GetNameDefCap] rejects the English-German Trade Agreement"
 mtg_britain_ef.11.d:0 "After several attempts from our embassador to convince [FROM.GetAdjective] officials of the mutual benefits of a trade pact between our countries, [FROM.GetAdjective] diplomats have just informed us that they have no interest in establishing a trade agreement with [ROOT.GetNameDef]."
 mtg_britain_ef.11.a:0 "Obstinate fools!"

 mtg_britain_ef.12.t:0 "Syndicalism in [ROOT.GetNameDefCap]"
 mtg_britain_ef.12.d:0 "We received a delegation today expressing [From.GetLeader]'s interest in extending the relations between our countries and taking steps to unite the [Root.GetAdjective] people together with [From.GetNameDef]. Agreeing to [From.GetLeader]'s proposal would make [Root.GetNameDef] a moderately autonomous puppet of [From.GetNameDef] and our government will be reorganized into something more in line with [From.GetLeader]'s vision.\n\nThe question remains, is [Root.GetAdjective] independence more important than our friendship with [From.GetNameDef]?"
 mtg_britain_ef.12.a:0 "Submit to their demands."
 mtg_britain_ef.12.b:0 "Absolutely not!"

 mtg_britain_ef.13.t:0 "[From.GetNameDefCap] Submits"
 mtg_britain_ef.13.d:0 "The [From.GetAdjective] government has agreed to abandon their independence and become a puppet state of [Root.GetNameDef]. We are sure this will lead to greatness and advance [Root.GetAdjective] interest in the region."
 mtg_britain_ef.13.a:0 "Excellent."

 mtg_britain_ef.14.t:0 "[From.GetNameDefCap] Defiant!"
 mtg_britain_ef.14.d:0 "Diplomats from [From.GetNameDef] arrived today to announce that they decline our offer to unite [From.GetNameDef] with [Root.GetNameDef]. Disappointing as it may be, the option to bring [From.GetNameDef] to heel by force remains a valid and tempting option."
 mtg_britain_ef.14.a:0 "Disappointing."

 mtg_britain_ef.15.t:0 "Economic Reform Implementation"
 mtg_britain_ef.15.d:0 "King Edward VIII has begun a series of economic reforms to re-establish order and too route out any perceived courruption being praticed by market and financial interests.  He has many different avenues to pusrue to achieve this goal. Oswald Moseley has been appointed as regent to oversee the newly formed bureau charged with managing these initiatives."
 mtg_britain_ef.15.a:0 "Instate new laws for the banking sector."
 mtg_britain_ef.15.b:0 "Instate new laws for the industrial sector."

 mtg_britain_ef.19.t:0 "Choose A New Capital For The Empire"
 mtg_britain_ef.19.d:0 "Our imperial federation has now reached its greatest limits. We are home to so many ethnic people and beautiful cities within these borders. That's why we have to change our capital."
 mtg_britain_ef.19.a:0 "No need to change"
 mtg_britain_ef.19.b:0 "Canada"
 mtg_britain_ef.19.c:0 "Australia"
 mtg_britain_ef.19.f:0 "New Zealand"
 mtg_britain_ef.19.e:0 "Second page"

 mtg_britain_ef.20.t:0 "Choose A Capital In Canada"
 mtg_britain_ef.20.d:0 "Canada hosts 2 cities within this federation that have the potential to be capitals. Which one shall we choose?"
 mtg_britain_ef.20.a:0 "Ottowa"
 mtg_britain_ef.20.b:0 "Montreal"
 mtg_britain_ef.20.c:0 "Previous page"

 mtg_britain_ef.21.t:0 "Choose A Capital In Australia"
 mtg_britain_ef.21.d:0 "Australia hosts 2 cities within this federation that have the potential to be capitals. Which one shall we choose?"
 mtg_britain_ef.21.a:0 "Canberra"
 mtg_britain_ef.21.b:0 "Sydney"
 
 mtg_britain_ef.22.t:0 "Choose A Capital In United States"
 mtg_britain_ef.22.d:0 "United States, the symbol of democracy, is home to 3 cities within this federation that have the potential to be made capitals. Which one shall we choose?"
 mtg_britain_ef.22.a:0 "Washington"
 mtg_britain_ef.22.b:0 "New London (a.k.a New York)"
 mtg_britain_ef.22.c:0 "Los Angeles"

 mtg_britain_ef.23.t:0 "Choose A New Capital For The Empire - Second Page"
 mtg_britain_ef.23.d:0 "Our imperial federation has now reached its greatest limits. We are home to so many ethnic people and beautiful cities within these borders. That's why we have to change our capital."
 mtg_britain_ef.23.a:0 "South Africa"
 mtg_britain_ef.23.b:0 "United States"
 mtg_britain_ef.23.c:0 "Back to first page"

 mtg_britain_ef.24.t:0 "Ireland Passes the Executive Authority (External Relations) Act"
 mtg_britain_ef.24.d:0 "Under the Constitution of the Irish Free State as originally enacted, the executive authority of the Irish Free State was declared to be vested in the King and declared to be exercisable by the Governor-General as representative of the Crown.\nIn response to the disruptive behaviour of the newly crowned King Edward VIII, the Oireachtas of the Irish Free State have enacted the Constitution (Amendment No. 27) Act abolishing the office of the Governor-General so that thereafter the executive government of the Irish Free State, insofar as internal matters were concerned, will cease to be exercised in the name of the King.\n\nIn practical terms this act has effectively severed the major links between the Irish Government and the British Crown, and signifies that Ireland can no longer be legally considered as a Dominion of the British Empire."
 mtg_britain_ef.24.a:0 "Ireland chooses her own path."
 mtg_britain_ef.24.b:0 "Let's make a deal"

 mtg_britain_ef.25.t:0 "United Kingdom Wants To Make A Deal"
 mtg_britain_ef.25.d:0 "Just as we were about to achieve our independence, diplomats from the British government came up with an offer. They say that in return for our remaining Dominion, economic aid will be given to our country and the trade war will end."
 mtg_britain_ef.25.a:0 "Sign the deal"
 mtg_britain_ef.25.b:0 "Tear up the deal"

 mtg_britain_ef.26.t:0 "Ireland Accepted Our Offer"
 mtg_britain_ef.26.d:0 "Ireland accepted our generous offer and chose not to divide this empire. They stated that they hoped that the economic aid they received in return would not be cut off."
 mtg_britain_ef.26.a:0 "Nice"

 mtg_britain_ef.27.t:0 "Ireland Rejected Our Offer"
 mtg_britain_ef.27.d:0 "Ireland didn't accept the last chance we offered them and turned down our offer. There is nothing we can do anymore."
 mtg_britain_ef.27.a:0 "Idiots"

 mtg_britain_ef.28.t:0 "Wilhelmina Takes Over"
 mtg_britain_ef.28.d:0 "Due to increasing public pressure and the agreement we made with the British, Wilhelmina took over the administration."
 mtg_britain_ef.28.a:0 "Good"

 mtg_britain_ef.29.t:0 "Britain Demands To Annex Us"
 mtg_britain_ef.29.d:0 "One of the articles of the agreement we made with Britain was that Britain would annex us when the time came. We can comply with the agreement and accept this request of Britain. If we say that we did not comply with the agreement while things are at this stage, the only way out seems to be war."
 mtg_britain_ef.29.a:0 "Accept"
 mtg_britain_ef.29.b:0 "Then the only way is war"

 mtg_britain_ef.30.t:0 "The Netherlands Complied"
 mtg_britain_ef.30.d:0 "The Netherlands announced that they were sticking to the agreement and approved our request. Thus, there was no need for war and bloodshed."
 mtg_britain_ef.30.a:0 "Excellent"

 mtg_britain_ef.31.t:0 "The Netherlands Broke the Deal"
 mtg_britain_ef.31.d:0 "The Netherlands stated that they would not abide by the agreement and that if we were persistent, it could end in war."
 mtg_britain_ef.31.a:0 "Then to the front!"

 mtg_britain_ef.32.t:0 "Irish Constitution of [GetYear]"
 mtg_britain_ef.32.d:0 "Ireland has declared a new Constitution, setting aside the old 'Irish Free State' moniker for simply Ireland, or Eire. No mention in this constitution is made to the British Commonwealth, of which Ireland is still technically a Dominion, and some readers find it to be of a distinctly territorial tone, in respect to Northern Ireland. The British Government has sent a clarifying communique reaffirming the position of Northern Ireland as a part of the United Kingdom."
 mtg_britain_ef.32.a:0 "Worrying"

 mtg_britain_ef.33.t:0 "Eire (Confirmation of Agreements) Act [GetYear]"
 mtg_britain_ef.33.d: "The Anglo-Irish Trade war has been a sordid affair raging from 1933, arising from Irish refusals to reimburse land annuities from financial loans granted to Irish tenant farmers. This breach of the 1921 Treaty lead to a breakdown in relations, and subsequent trade restrictions from both countries. But the last few months have seen a build-up of reconciliatory legislation, beginning with the Coal-Cattle pact three years ago, and now with this treaty declaring a formal end to the state of affairs."
 mtg_britain_ef.33.a:0 "Huzzah!"

 mtg_britain_ef.34.t:1 "Graham Speeches against [GER.GetName]"
 mtg_britain_ef.34.d:1 "James Graham made a rousing speech today. In it, he asserted the uniqueness and individuality of British Autocracy, and stressed the distinction between his policies and those of the German dictator. He went on to conclude with powerful words: "no-one but a Briton shall hold sway over Britain!""
 mtg_britain_ef.34.a:1 "Public reception seems to be rather good."

 mtg_britain_ef.35.t:0 "Bomb Attack on Buckingham Palace"
 mtg_britain_ef.35.d:0 "After the borders were fully opened, terrorists hiding themselves among the many people entering our country finally achieved their goal. Several bombs were detonated at Buckingham Palace at the same time, causing serious damage and rendering the palace unusable. The terrorists, who also hid themselves among the servants of the palace, killed many servants and members of the royal family with guns in the palace to make sure that the royal family was dead. The army was deployed to restore order and clear the remaining terrorists."
 mtg_britain_ef.35.a:0 "Worrying"

 mtg_britain_ef.36.t:0 "Offer from Victoria Louise"
 mtg_britain_ef.36.d:0 "After the explosion at Buckingham Palace, there are no royals fit to lead the country. Victoria Louise took the opportunity to make us an offer. She has promised to lead the country until a member of the royal family is fit to lead the country, and she has promised not to violate our traditions."
 mtg_britain_ef.36.a:0 "Accept the offer"
 mtg_britain_ef.36.b:0 "It's impossible!"

 mtg_britain_ef.37.t:0 "A Royal Proposal from Britain"
 mtg_britain_ef.37.d:0 "A formal message has arrived from London. The British government, now led by a monarch of German lineage, has extended an unprecedented offer: to establish a personal union between our realm and theirs, with the current sovereign ruling both crowns. The proposal does not aim to merge our states, but rather to bind them in dynastic solidarity—recalling the age of old empires and royal alliances. Accepting would place our monarch on the British throne, opening a path toward shared prestige, influence, and perhaps a reshaped order in Europe. Refusing, however, would maintain our present sovereignty and avoid further entanglements. The weight of kingship now falls on a decision: shall the crowns be united once more?"
 mtg_britain_ef.37.a:0 "We shall wear both crowns"
 mtg_britain_ef.37.b:0 "Our destiny lies separate"

 mtg_britain_ef.38.t:0 "The Union is Formed"
 mtg_britain_ef.38.d:0 "Word has arrived from Berlin: the German monarch has accepted the offer to assume the British throne and form a personal union between our two realms. The Dual Monarchy is now a reality. Though both governments remain administratively independent, the symbolism of this agreement is profound. A shared sovereign now presides over both nations—a fusion of dynastic legacy and modern statecraft. Celebrations erupt in royalist circles across the empire, while murmurs of unease echo among republicans and traditionalists. Whatever the reaction, history has turned its page."
 mtg_britain_ef.38.a:0 "Long live the united crown!"

 mtg_britain_ef.39.t:0 "A Respectful Decline"
 mtg_britain_ef.39.d:0 "A reply from Berlin has been received. While gracious in tone, the German monarch has declined the offer of personal union. Their reasoning rests on the preservation of national autonomy and the strategic caution such a drastic move demands. Despite the refusal, diplomatic warmth is maintained. No insult was taken, nor offense given. The crowns remain separate, but cordial. Though the dream of dynastic reunification ends here, cooperation between our peoples may yet deepen in other ways."
 mtg_britain_ef.39.a:0 "A disappointing, but understandable decision"

 mtg_britain_ef.41.t:0 "Protests in [british_protest_state.GetName]"
 mtg_britain_ef.41.d:0 "Thousands have taken to the streets of [british_protest_state.GetName] and surrounding towns, chanting slogans such as 'England for the English' and demanding the abdication of the Scottish monarch. Protesters accuse the crown of betraying English identity and history. While mostly peaceful, the sheer scale of the protests has disrupted regional productivity."
 mtg_britain_ef.41.a:0 "Tensions are rising by the day"

 mtg_britain_ef.42.t:0 "Sabotage at the [british_sabotage_state.GetName] Dockyards"
 mtg_britain_ef.42.d:0 "In an apparent act of coordinated sabotage, several key cranes and warehouse facilities at the [british_sabotage_state.GetName] dockyards were set ablaze overnight. Anonymous leaflets found nearby called for 'resistance against the northern pretender'. Damage to naval production is expected to take weeks to fully repair."
 mtg_britain_ef.42.a:0 "A targeted attack against the Crown"

 mtg_britain_ef.43.t:0 "Saboteurs Strike the Railways"
 mtg_britain_ef.43.d:0 "Rail networks across southern England have been struck by coordinated disruptions. Switchyards were jammed, carriages derailed and telegraph lines cut. The government suspects underground cells operating with local support. The movement of troops and supplies has been notably hindered."
 mtg_britain_ef.43.a:0 "Logistical delays are mounting"

 mtg_britain_ef.44.t:0 "Anti-Scottish Riots in London"
 mtg_britain_ef.44.d:0 "Clashes erupted in central London after local nationalist groups rallied against what they call the 'Gaelic takeover' of the British throne. Police struggled to contain rioters who torched government buildings and looted nearby shops. Several factories have been shut down in the chaos."
 mtg_britain_ef.44.a:0 "The capital is in turmoil"

 mtg_britain_ef.440.t:0 "Scotland Stands with the King"
 mtg_britain_ef.440.d:0 "Recent weeks have shown that, despite the unrest in certain parts of the realm, the Scottish population remains firmly behind their monarch. Streets in Edinburgh, Glasgow, and countless towns across the Highlands have filled with cheering crowds waving the royal standard. Shop windows proudly display portraits of the King, and local leaders call for unity under his rule. While some voices of dissent still echo in the background, they are drowned out by the overwhelming show of loyalty from Scotland’s sons and daughters."
 mtg_britain_ef.440.a:0 "Even in chaos, loyalty survives"

 mtg_britain_ef.45.t:0 "Violence Erupts Across the [british_factory_sabotage_state.GetName]"
 mtg_britain_ef.45.d:0 "What began as mass protest has now descended into targeted violence. Across the region, angry mobs have begun attacking factories and businesses owned by individuals perceived to be supportive of the new regime. Several industrial facilities were set ablaze, and workers were injured or forced to flee. The police response was slow and disorganized, prompting concerns over regional stability and the ability of local authorities to contain the unrest. As these events unfold, the specter of deeper internal conflict begins to loom."
 mtg_britain_ef.45.a:0 "The situation is spiraling out of control"

 mtg_britain_ef.46.t:0 "A New Offer from London"
 mtg_britain_ef.46.d:0 "In a gesture of reconciliation and forward-looking statesmanship, the English government — under its new Scottish sovereign — has proposed dominion status for Ireland. The offer pledges full internal autonomy, shared defense and equal standing among the nations of the Isles. It is an unprecedented attempt to resolve old grievances not with power, but with partnership."
 mtg_britain_ef.46.a:0 "Let this be a new beginning for the Isles"
 mtg_britain_ef.46.b:0 "We are sovereign — and shall remain so"

 mtg_britain_ef.47.t:0 "Ireland Accepts the Dominion Offer"
 mtg_britain_ef.47.d:0 "Ireland has formally accepted our dominion proposal, marking a significant diplomatic breakthrough. Leaders from both sides have signed a new charter affirming mutual defense, internal autonomy and peaceful cooperation. The Isles, once divided by history, now stand united in vision."
 mtg_britain_ef.47.a:0 "A historic moment for peace"

 mtg_britain_ef.48.t:0 "Ireland Rejects the Proposal"
 mtg_britain_ef.48.d:0 "Though courteous in tone, Ireland’s leadership has declined the dominion arrangement. Their message affirms full sovereignty as a non-negotiable pillar of national identity. While this closes the door on formal union, informal cooperation may still be possible in the future."
 mtg_britain_ef.48.a:0 "A lost opportunity, but not the end"

 mtg_britain_ef.49.t:0 "Suspicious Activity in the West"
 mtg_britain_ef.49.d:0 "Reports from our intelligence services indicate that both Britain and Germany have significantly ramped up their joint military operations. High-level coordination, troop movements near Eastern Europe, and covert diplomatic alignments all point to one thing: preparation for a potential attack. Whether these signs reflect an imminent threat or just routine posturing is up to us to decide."
 mtg_britain_ef.49.a:0 "We must be ready for anything"
 mtg_britain_ef.49.b:0 "Let the West play their games"

 mtg_britain_ef.50.t:0 "[From.GetNameDefCap] Demands Imperial Lands"
 mtg_britain_ef.50.d:0 "In a bold diplomatic move, [ENG.GetNameDef] has formally demanded the transfer of territories within the former Holy Roman Empire, claiming them as rightful lands under the authority of the [ENG.GetLeader]'s crown. The proposal comes with veiled threats of 'grave consequences' should we refuse."
 mtg_britain_ef.50.a:0 "Reluctantly accept their claim"
 mtg_britain_ef.50.b:0 "Absolutely not"

 mtg_britain_ef.51.t:0 "Imperial Territories Secured"
 mtg_britain_ef.51.d:0 "Our demands have been met in full. The territories in question have been transferred without a drop of blood spilled. The court celebrates this as a triumph of royal diplomacy and a reminder of our renewed prestige within Europe."
 mtg_britain_ef.51.a:0 "A victory for the crown"

 mtg_britain_ef.52.t:0 "[From.GetNameDefCap] Rejected Our Demands"
 mtg_britain_ef.52.d:0 "The foreign government has outright refused to acknowledge our rightful claim to the imperial lands. This insult to our crown cannot go unanswered. Some within the court call for immediate war, while others urge for economic measures to bleed them slowly."
 mtg_britain_ef.52.a:0 "Then it is war!"
 mtg_britain_ef.52.b:0 "Cripple them with embargoes and sanctions"

 mtg_britain_ef.53.t:0 "[ENG.GetNameDefCap] Demands Peace"
 mtg_britain_ef.53.d:0 "We have received a formal diplomatic demand from the British crown. we are faced with a choice: to heed the call and cease hostilities, or to reject the overture and risk further devastation. The king's envoys make clear that compliance will lead to negotiations under British supervision, while refusal will be met with consequences."
 mtg_britain_ef.53.a:0 "Accept the demand"
 mtg_britain_ef.53.b:0 "It's impossible!"

 mtg_britain_ef.54.t:0 "[From.GetNameDefCap] Accepted Our Demands"
 mtg_britain_ef.54.d:0 "Following our firm insistence, [FROM.GetName] has accepted peace terms without conditions. The guns fall silent, and a new chapter of calm begins. This swift resolution spares countless lives and sets a precedent for future diplomacy."
 mtg_britain_ef.54.a:0 "We will honor and uphold this peace"

 mtg_britain_ef.55.t:0 "[From.GetNameDefCap] Rejected Our Demands"
 mtg_britain_ef.55.d:0 "Our call for peace has been coldly refused by [FROM.GetName]. The war rages on, forcing us to consider whether to escalate with force or seek other avenues to end this conflict."
 mtg_britain_ef.55.a:0 "Enforce peace by force"
 mtg_britain_ef.55.b:0 "Stand down and pursue alternative options"

 mtg_britain_ef.56.t:0 "[FROM.GetName] Proposes a Personal Union"
 mtg_britain_ef.56.d:0 "In a move that could reshape the balance of power in the region, [FROM.GetName] has approached us with a proposal to unite our nations under a single crown. Their monarch, [FROM.GetLeader], seeks to rule both realms in a personal union, claiming it will bring peace, prosperity and mutual security. While this arrangement would preserve our autonomy in many internal matters, it would place foreign hands upon the reins of our sovereignty. The choice before us is clear: embrace a shared future, or reject it and prepare for the consequences."
 mtg_britain_ef.56.a:0 "We shall unite under one crown"
 mtg_britain_ef.56.b:0 "Never — we will stand independent!"

 mtg_britain_ef.57.t:0 "[FROM.GetName] Accepts the Union"
 mtg_britain_ef.57.d:0 "Our diplomatic overtures have succeeded beyond expectation — [FROM.GetName] has agreed to enter into a personal union with [ROOT.GetName]. Their crown now rests alongside our own, and both nations shall move forward united under the leadership of [ROOT.GetLeader]. This moment marks the dawn of a new era, one in which our realms stand stronger together than apart."
 mtg_britain_ef.57.a:0 "A historic day for both our peoples"

 mtg_britain_ef.58.t:0 "[FROM.GetName] Rejects Our Proposal"
 mtg_britain_ef.58.d:0 "Despite our generous offer to unite our nations under a single crown, [FROM.GetName] has chosen the path of defiance. Their rejection is not only a slight to our monarch, [ROOT.GetLeader], but a challenge to our rightful influence in the region. This insult cannot go unanswered — our advisors are already drafting plans to bring [FROM.GetName] to heel by force, if necessary."
 mtg_britain_ef.58.a:0 "Then they shall face the consequences"