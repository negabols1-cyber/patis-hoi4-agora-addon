 TUR_gain_control_over_egypt:0 "Gain Control Over Egypt"
 TUR_assassinate_the_egyptian_royal_family:0 "Assassinate the Egyptian Royal Family"
 TUR_demand_egypt_decision:0 "Demand Egypt"
