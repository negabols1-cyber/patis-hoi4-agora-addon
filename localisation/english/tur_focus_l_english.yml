 TUR_incorporate_egypt_into_the_empire:0 "Incorporate Egypt into the Empire"
 TUR_village_institutes_category:0 "Village Institutes Expansion"
 TUR_village_institutes_category_desc:0 "The establishment of Village Institutes marks the beginning of a true cultural revolution. By spreading education to the remotest corners of the country, we shall not only raise literacy but also cultivate a new generation loyal to the Republic and its ideals. Each institute developed strengthens Atatürk's vision for a modern and enlightened nation."
 TUR_develop_village_institutes_FROM:0 "Develop the Village Institute in [FROM.GetName]"
 TUR_develop_village_institutes_FROM_desc:0 "By investing resources into the [FROM.GetName] Village Institute, we provide the rural youth with the means to rise above illiteracy and backwardness. Each step forward strengthens the foundations of our national enlightenment."
 TUR_developed_village_institutes:0 "Village Institute Developed States"

 #Events
 ef_tur.3.t:0 "Abdulaziz Claims That He is The True Caliph"
 ef_tur.3.d:0 "For many years we have held the title of Caliph as an empire. Now we have taken it back, but the problems keep haunting us and at the same time the leader of the Arabs claims to be the Caliph. Either we take a very difficult decision and stop being caliph so that the tension between the two countries does not rise, or we ask them to stop being caliph."
 ef_tur.4.t:0 "The Ottomans Sent Us An Ultimatum"
 ef_tur.4.d:0 "The Ottoman Empire sent us an ultimatum asking us to give up the caliph title. Otherwise, they say that they may declare war because there cannot be two caliphs at the same time."
 ef_tur.5.t:0 "[FROM.GetName] Rejected Ultimatum"
 ef_tur.5.d:0 "The [FROM.GetName] said they would not give up the caliph title and would not hesitate to fight for it. In this situation, we have no choice but to declare war on them."
 ef_tur.6.t:0 "Declare a Jihad!"
 ef_tur.6.d:0 "Our ultimatums were not accepted. One side must give up the caliph title, so there is no other way but to fight. We must win this war, so we have to declare jihad."
 ef_tur.7.t:0 "[FROM.GetName] surrenders"
 ef_tur.7.d:0 "The bloody war finally ended and [FROM.GetName] agreed to surrender. Soon they will fulfill the terms of the peace agreement and we will move forward, stronger than before."
 ef_tur.8.t:0 "TCG Muavenet Returned"
 ef_tur.8.d:0 "TCG Muavenet was 1 of the 4 destroyers we ordered from the United Kingdom in 1938. When World War 2 broke out, the Royal Navy bought 2 of these ships and Muavenet was one of them. The other 2 were delivered to us in 1942 and commissioned. Meanwhile, HMS Ithuriel (Gayret) was not delivered because it was damaged beyond repair and was broken up. But now that the war is over and the dark days are behind us, the revision of TCG Muavenet has been completed and the ship has been brought to Istanbul and tomorrow we will incorporate the ship into our navy with a big ceremony!"
 ef_tur.9.t:0 "The Father of the Turks Recovers!"
 ef_tur.9.d:0 "Against all fears and doubts, Mustafa Kemal Atatürk, the Father of the Turks, has made a miraculous recovery. What once seemed like a looming shadow over the Republic has now turned into a beacon of hope. Turkey celebrates a moment of profound relief and joy: from the bustling streets of Istanbul to the quiet villages of Anatolia, his recovery is met with songs, flags and cheers. The army stands taller, the parliament breathes easier, and the people look to the future with renewed determination. Atatürk’s leadership once more secures the path of progress and independence, lifting the nation’s spirit to unprecedented heights. The Republic has been given a second breath and with Atatürk at its helm once more, nothing seems impossible for Turkey’s destiny."
 ef_tur.9.a:0 "Yaşasın Atatürk! Yaşasın Cumhuriyet!"

 ef_tur_news.1.t:0 "Atatürk Addresses the Grand National Assembly"
 ef_tur_news.1.d:0 "In his opening speech for the new legislative year, President Mustafa Kemal Atatürk outlined the Republic's next great objectives. He emphasized the importance of state-led economic development, the Second Five-Year Plan, and modernizing agriculture and education. Atatürk's vision was clear: Turkey must stand on its own feet, industrially and socially, and secure its place among the modern nations of the world."
 ef_tur_news.1.a:0 "A clear vision for the nation's future"

 bftb_turkey.145.t:0 "Turkey Wants to Take Cyprus!"
 bftb_turkey.145.desc:0 "Turkish-British Relations Have Developed With The Joining Of The Republic Of Turkey To The Allies. However, the Turkish Government Wants To Re-Include Cyprus, Which Has Been Turkish Land For Years.\n\nWhile the British are warm to this proposal, a definite answer has not been received yet. We will wait and see."
 bftb_turkey.145.a:0 "Acceptable..."
 bftb_turkey.145.b:0 "Strategically Important Region, Decline"
 bftb_turkey.146.t:0 "United Kingdom Accept."
 bftb_turkey.146.desc:0 "Our diplomatic relations with the United Kingdom have improved a lot as we have joined this great war on the side of the allies in the past days.\nHowever, our Cyprus offer was accepted by the UK Government. Cyprus is now a Turkish land!"
 bftb_turkey.146.a:0 "Great News!"
 bftb_turkey.147.t:0 "United Kindom Refused!?"
 bftb_turkey.147.desc:0 "Although we participated in this great war on the side of the allies in the past days, the UK government did not accept our request for Cyprus and turned it down.\n\nAs the reason why the proposal was not accepted, it is among the information that Cyprus is an important strategic region."
 bftb_turkey.147.a:0 "Bad News."
 bftb_turkey.150.t:0 "[FROM.GetNameDefCap] Demands Our Subjugation"
 bftb_turkey.150.desc:0 "[FROM.GetNameDefCap] has demanded our subjugation and integration into their nation. If we comply, it will of course be the end of [THIS.GetName] as an independent nation. It is not clear how far [FROM.GetLeader] is willing to go in order to achieve integration, but the possibility of armed conflict can not yet be ruled out."
 bftb_turkey.150.a:0 "Maybe it's for the best."
 btbf_turkey.150.b:0 "Allah is with us, let them come with all their armies!"
 bftb_turkey.151.t:0 "[From.GetNameDefCap] Refuses Ultimatum"
 bftb_turkey.151.desc:0 "Despite pressure, and despite being totally aware of [FROM.GetLeader.GetHerHis] country's precarious situation, [FROM.GetLeader] refused to accept our generous offer to become part of the rebuilt Ottoman Empire."
 bftb_turkey.151.a:0 "This won't be solved by violence."
 bftb_turkey.151.b:0 "Their impudence shall be met with our scimitars."
 bftb_turkey.152.t:0 "[From.GetNameDefCap] Demands Cyprus"
 bftb_turkey.152.desc:0 "The Ottoman Empire has recently demanded Cyprus. They informed us that we had tricked them into giving it to us and that now was the time to give it back, otherwise our relations would be badly affected."
 bftb_turkey.152.a:0 "Accept their demands"
 bftb_turkey.152.b:0 "Strategically Important Island, Decline"
 bftb_turkey.153.t:0 "[From.GetName] Accepts Our Demand"
 bftb_turkey.153.desc:0 "[From.GetNameDefCap] accepts our Demand, saying that there was no need for relations to suffer and that it would of course be good to right past wrongs."
 bftb_turkey.153.a:0 "Nice"
 bftb_turkey.154.t:0 "[From.GetName] Rejects Our Demand"
 bftb_turkey.154.desc:0 "[From.GetNameDefCap] said that they did not accept our request and that given the strategic location of the island, if we wanted to take the island, we should go to them with more serious and reasonable offers."
 bftb_turkey.154.a:0 "We will not give up our goal"
 bftb_turkey.155.t:0 "Assassination Attempt Successful"
 bftb_turkey.155.desc:0 "We have eradicated the traitors who betrayed us and took over Egypt. Our agents carried out this operation with the utmost precision, and it went off without a hitch. The only thing left to do to get Egypt back is to deceive the United Kingdom."
 bftb_turkey.155.a:0 "Great news!"
 bftb_turkey.156.t:0 "Assassination Attempt Failed"
 bftb_turkey.156.desc:0 "The traitors who separated Egypt from us were not where they should have been according to our agents' report. This time they were lucky and managed to survive. No one knows yet that there will be an assassination, so we will try our luck again, this time in a certain location."
 bftb_turkey.156.a:0 "Try Again"
 bftb_turkey.157.t:0 "Egyptian Royal Family Assassinated"
 bftb_turkey.157.desc:0 "The Egyptian royal family was assassinated. We do not yet know who organized this assassination and why, but our agents are working hard on this matter. We need to appoint someone new to maintain order in the region. Some diplomats from the Ottoman Empire contacted us and suggested Abbas II of Egypt. He is a former Khedive and has experience in this field."
 bftb_turkey.157.a:0 "Put Abbas II of Egypt in power"
 bftb_turkey.157.b:0 "Find a more suitable king"
 bftb_turkey.158.t:0 "[From.GetNameDefCap] Demands Egypt"
 bftb_turkey.158.desc:0 "The Ottomans demanded Egypt. After the recent assassination of the Egyptian royal family, the Egyptian people are very concerned and feel that we have failed to protect them. As a result, they no longer want us in the region and they started to revolt in small groupings."
 bftb_turkey.158.a:0 "Accept their demands"
 bftb_turkey.158.b:0 "Impossible! Reject the demand"
 bftb_turkey.159.t:0 "[From.GetName] Accepts Our Demand"
 bftb_turkey.159.desc:0 "Given the attitude of the people in the region after the recent events, it would have been a grave mistake for [From.GetNameDefCap] not to accept our demand. We achieved our goal and the territories that had been taken from us were reincorporated into our empire."
 bftb_turkey.159.a:0 "Very good"
 bftb_turkey.160.t:0 "[From.GetName] Rejects Our Demand"
 bftb_turkey.160.desc:0 "[From.GetNameDefCap] rejected our demand and began to deploy large numbers of troops to the region. A short period of martial law was also declared in Egypt to better suppress the uprisings."
 bftb_turkey.160.a:0 "Idiots"
 bftb_turkey.161.t:0 "[From.GetNameDefCap] Demands Sudan"
 bftb_turkey.161.desc:0 "After the Ottomans took Egypt from us, they also demanded the lands that used to be part of Egypt, namely Sudan. Will we deal with these unnecessary lands or will we hand them over to the Ottomans?"
 bftb_turkey.161.a:0 "Accept their demands"
 bftb_turkey.161.b:0 "We won't give an inch of land"
 bftb_turkey.162.t:0 "[From.GetName] Accepts Our Demand"
 bftb_turkey.162.desc:0 "[From.GetNameDefCap] accepted our Sudan demand and handed over the land to us. We are close to restoring Egypt to its former greatness and once we achieve our goal, we will fully integrate Egypt into our empire and regain our former power."
 bftb_turkey.162.a:0 "Good"
 bftb_turkey.163.t:0 "[From.GetName] Rejects Our Demand"
 bftb_turkey.163.desc:0 "[From.GetNameDefCap] rejected our demand for Sudan, which was an expected result, so we are not surprised. We will use military force if necessary to achieve our goal, but we will never give up. Our empire will be restored to its former strength."
 bftb_turkey.163.a:0 "They can't stop us"
 bftb_turkey.164.t:0 "[From.GetNameDefCap] Demands Suez Canal"
 bftb_turkey.164.desc:0 "[From.GetNameDefCap] demanded the Suez Canal from us and said that it was an integral part of Egypt and should be returned immediately."
 bftb_turkey.164.b:0 "Impossible!"
 bftb_turkey.165.t:0 "[From.GetName] Accepts Our Demand"
 bftb_turkey.165.desc:0 "[From.GetNameDefCap] accepted our demand for the Suez Canal and handed it over to us, and with that we restored Egypt to its former power, and now we can start to incorporate Egypt into our empire and regain our former power."
 bftb_turkey.166.t:0 "[From.GetName] Rejects Our Demand"
 bftb_turkey.166.desc:0 "[From.GetNameDefCap] rejected our demand for Suez Canal, which was an expected result, so we are not surprised. We will use military force if necessary to achieve our goal, but we will never give up. Our empire will be restored to its former strength."
 bftb_turkey.166.b:0 "No need for war"
 bftb_turkey.168.t:0 "Our Lands Reclaimed!"
 bftb_turkey.168.desc:0 "The enemy has yielded to our just demands. The territories long stolen from our nation will finally return to their rightful owner. Nihal Atsız's message was clear, unwavering, and uncompromising — and it has borne fruit. A great victory for the homeland and for the ideals we stand for."
 bftb_turkey.168.a:0 "Justice has been served."
 bftb_turkey.169.t:0 "Our Demand Was Rejected"
 bftb_turkey.169.desc:0 "The enemy has dared to defy our rightful claim. Nihal Atsız's message, delivered with clarity and conviction, was met not with understanding — but with arrogant dismissal. They mock our sovereignty and deny us what is ours by blood and history. Such insolence will not go unanswered."
 bftb_turkey.169.a:0 "Then we shall take it by force."
 bftb_turkey.170.t: "Kemalist Coup!"
 bftb_turkey.170.desc: "In the dead of night, tanks rolled into the capital. Communications were severed, arrests were made, and gunfire echoed through the streets. A faction of Kemalist officers, opposed to Nihal Atsız's radical policies and his vision for the nation, has staged a coup d'état. Government buildings are under military control, and Atsız's whereabouts remain unknown. The fate of the nation now hangs in the balance."
 bftb_turkey.170.a: "Rally the loyalists — fight back!"