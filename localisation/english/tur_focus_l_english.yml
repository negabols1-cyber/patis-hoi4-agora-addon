l_english:
 TUR_turanist_meb:0 "Cleanse Milli Egitim Bakanlıgı of Communists"
 TUR_turanist_meb_desc:0 "A Turanist modern society starts with instilling this in young people. Eliminating the communist tumors in the Ministry of National Education should be the first step of our Turan goal."
 TUR_clear_univercityes:0 "Cleanse Universities and Teach Turanism"
 TUR_clear_univercityes_desc:0 "We have cleaned up the Ministry of National Education and now it is the turn of the professors who infect our pure and clean youth with the cancer of communism. We must remove these communist leftovers and teach our youth the superiority of Turks."
 TUR_expanding_the_saadabad_pact_2:0 "Expanding the Saadabad Pact"
 TUR_expanding_the_saadabad_pact_2_desc:0 "An alliance with other countries in the Middle East will secure us."
 TUR_expanding_the_saadabad_pact_invite:0 "Invite All Middle East Countries"
 TUR_expanding_the_saadabad_pact_invite_desc:0 "Invite All Middle East Countries"
 TUR_the_clodius_agreement:0 "The Clodius Agreement"
 TUR_the_clodius_agreement_desc:0 "The [GER.GetAdjective]s have approached us with a favorable deal: chromium ore in exchange for the means to produce more military equipment of our own. By becoming [GER.GetNameDef]'s primary source of chromium ore, we also become entitled to [GER.GetNameDef]'s protection which is quite an enviable position to be in nowadays."
 TUR_clodius_agreement_tt:1 "Every state that produces §Y55§! or more units of §YChromium§! will receive three levels of §YInfrastructure§! and three §YMilitary Factories§!."
 TUR_return_misaki_milli:0 "Road to old lands"
 TUR_return_misaki_milli_desc:0 ""
 TUR_old_friends:0 "Recall old Friends"
 TUR_old_friends_desc:0 "Medîne Müdâfii", "Turkish Tiger", "Desert Tiger", "Hero of Medîna" Fahrettin Pasha retired as a lieutenant general and is now spending happy times with his family.Yes it is his right but the world is changing and we need our Veterans to train and lead our young officers. Fahrettin Pasha will not refuse this request."
 TUR_free_turkic_peoples:0 "Every Turk Must Be Free"
 TUR_free_turkic_peoples_desc:0 "We Turks have been fighting for our independence for centuries. Our last war was the war of independence. Yes, we Anatolian Turks have gained our independence, but our other Turkish brothers and sisters scattered all over the world are still not free. We will give a single note to all countries persecuting Turkic peoples. Either they will give the Turks their independence or we will use force to give them their independence."
 TUR_Forced_Marriage_law:0 "Introduce the Bachelor Tax"
 TUR_Forced_Marriage_law_desc:0 "To encourage family life and population growth, the state will impose a tax on unmarried men. Though controversial, this policy reflects the Republic’s belief in strong households as the foundation of a strong nation. By incentivizing marriage, we aim to secure future generations and reinforce the social fabric of Turkey."
 TUR_every_turk_born_soldier:0 "Every Turk Is Born a Soldier"
 TUR_every_turk_born_soldier_desc:0 "We have been fighting non-stop for centuries and we will not surrender this last piece of land to our enemies. From the steppes of Central Asia to the Caucasus Mountains, from the Balkans to the front of Vienna, we watered every inch of land with our blood. This will not change today, this is our last defense, this is our last homeland, yes, our enemy may be strong, but remember 'Every Turk is born a soldier'"
 TUR_prioritize_second_five_year_plan:0 "Prioritize the Second Five-Year Plan"
 TUR_prioritize_second_five_year_plan_desc:0 "The First Five-Year Industrial Plan has laid the foundations of our economic modernization. Now, with Atatürk's guidance, the Second Five-Year Plan must prioritize heavy industries, energy projects, and large-scale civilian infrastructure. By focusing on long-term stability and domestic production, we will strengthen Turkey’s independence and accelerate the march towards modernity."
 TUR_prioritize_the_military_industry:0 "Prioritize the Military Industry"
 TUR_prioritize_the_military_industry_desc:0 "While general industrialization remains crucial, the survival of the Republic depends on the strength of its armed forces. Expanding munitions factories, improving small arms production, and developing armored capabilities will secure Turkey’s defense. Under Atatürk’s vision, the military-industrial base must grow alongside our civilian economy, ensuring we are ready for the storms of the future."
 TUR_anatolian_railway_expansion:0 "Anatolian Railway Expansion"
 TUR_anatolian_railway_expansion_desc:0 "Railways are the lifeblood of modern economies. The Anatolian heartland remains underdeveloped, but with a systematic expansion of our railway network, we will unify remote regions, lower transport costs, and bring prosperity to rural areas. These new lines will serve not only trade but also rapid military mobilization if needed."
 TUR_strengthen_etibank_operations:0 "Strengthen Etibank Operations"
 TUR_strengthen_etibank_operations_desc:0 "Established to manage and develop our mineral wealth, Etibank plays a crucial role in Turkey’s industrial future. By providing it with new authority and resources, we can expand mining operations in chromium, copper, lignite, and other vital minerals. This will ensure a steady supply of raw materials to fuel our factories and strengthen our economic independence."
 TUR_strengthen_turkish_aeronautical_association:0 "Strengthen the Turkish Aeronautical Association"
 TUR_strengthen_turkish_aeronautical_association_desc:0 "Under Atatürk’s vision, mastery of the skies is essential for the Republic’s defense and progress. The Turkish Aeronautical Association (Türk Hava Kurumu) has already taken the first steps in building a national aviation industry — producing training aircraft, gliders, and spare parts. By expanding its facilities, providing state subsidies, and establishing technical schools, we shall turn this fledgling organization into the cornerstone of a modern air force. A nation that commands the air commands its destiny."
 TUR_expand_general_directorate_of_military_factories:0 "Expand General Directorate of Military Factories"
 TUR_expand_general_directorate_of_military_factories_desc:0 "The General Directorate of Military Factories oversees the production of weapons, ammunition, and equipment for the Turkish Armed Forces. By expanding its facilities and increasing its autonomy, we can secure a steady flow of arms, reduce reliance on foreign imports, and modernize our military production capacity in line with Atatürk’s forward-looking vision."
 TUR_urban_development_plans:0 "Urban Development Plans"
 TUR_urban_development_plans_desc:0 "Turkey’s cities must reflect the ideals of the Republic: modern, efficient, and civilized. Through systematic urban planning—new housing, industrial zones, cultural centers, and infrastructure projects—we will transform Anatolian towns and major cities alike into vibrant hubs of progress, ensuring that modernization touches every corner of the nation."
 TUR_village_institutes:0 "Found the Village Institutes"
 TUR_village_institutes_desc:0 "To truly modernize Turkey, education must extend to the countryside. The Village Institutes will train teachers, agricultural specialists, and technicians directly in rural communities, uplifting peasants and spreading literacy. This revolutionary initiative will ensure that the torch of knowledge shines not only in cities, but in every village across Anatolia."
 TUR_take_bismarck:0 "Turkish Bismarck"
 TUR_take_bismarck_desc:0 "Unless we have strong warships, it is not possible to achieve full dominance in the Mediterranean, Aegean and Black Sea. The German Bismarck class warships are by far superior to the Italian and British warships, our rivals at sea. If we can adapt these ships to ourselves, we can be the superior power on the seas."
 TUR_cyprus_territory:0 "End of Rent"
 TUR_cyprus_territory_desc:0 "Since 1878 we have been renting our small homeland to the British. In the 1st world war the British seized our small homeland and never gave it back but times have changed, now we are with the British and we are fighting together against the world, maybe the British will not hesitate to give back what is rightfully ours."
 TUR_national_development_plan:0 "National Development Plan"
 TUR_national_development_plan_desc:0 "National Development Plan"
 TUR_New_Janissary_System:0 "Re-establish the Asâkir-i Nizâmiye-i Şâhâne"
 TUR_New_Janissary_System_desc:0 "'Asâkir-i Nizâmiye-i Şâhâne' It was the new army of the Ottoman Empire after the abolition of the Janissaries and it became a fully equipped army in a short time. We can do this once again, we must do this so that our Empire does not collapse once again after its second birth."
 #TUR_New_Janissary_System_desc:0 "Yes, the Janissaries were corrupt and had become a state within the state and had to be destroyed. But times have changed and if our empire wants to challenge the world powers again, we need to revive the janissaries." #Old
 TUR_strengthen_the_harbiye_nezareti:0 "Strengthen the Harbiye Nezâreti"
 TUR_strengthen_the_harbiye_nezareti_desc:0 "No matter how well trained and equipped an army is, it cannot win a war if there are no competent officers and pashas to lead it. In our civil war we lost a lot of experienced Pashas and officers, so we need to replace them with new ones."
 TUR_new_gendarmerie:0 "Renew Umum Jandarma Kumandanlığı"
 TUR_new_gendarmerie_desc:0 "One of the biggest problems of our empire in the past centuries was internal rebellions, which weakened our army in major battles and damaged our supply lines. If we cannot suppress the separatists within our empire, our new empire will not last long"
 TUR_reestablish_the_yildiz_teskilati:0 "Re-establish the Yıldız Teşkilatı"
 TUR_reestablish_the_yildiz_teskilati_desc:0 "Even our Viziers were serving our enemies at the time, it is not certain that this will not happen in this time. That is why we must re-establish the Yıldız teşkilatı that depends only on our sultan."
 TUR_nationalize_key_industries:0 "Nationalize Key Industries"
 TUR_nationalize_key_industries_desc:0 "Our empire unfortunately has a weak economy and important industrial areas are in the hands of capitalist dogs. We need to nationalize these industrial areas and make them serve only our nation."
 TUR_demand_cyprus:0 "Demand Cyprus"
 TUR_demand_cyprus_desc:0 "During the Russo-Turkish War, we leased the jewel of our Empire to the British to help us, but the British dogs ignored our agreement and annexed the island, but those days are over, the British will either give us our land back or we will take it by force."
 TUR_take_over_egypt:0 "Take Over Egypt"
 TUR_take_over_egypt_desc:0 "Egypt has been in British hands waiting to be liberated since the British occupied it with their insidious plans. Now that our empire has regained its power, Egypt will be Ottoman territory again, even if we have to kill the British puppet Farouk I."
 TUR_invest_in_egypt:0 "Invest in Egypt"
 TUR_invest_in_egypt_desc:0 "We have taken some steps to address the unrest in Egypt and prevent it from leaving us again, but our investments in the region will also have a big impact. If we make the necessary investments and succeed in turning the people of the region to our side, we can incorporate Egypt into our empire in the future."
 TUR_strong_man_of_europe:0 "Strong Man of Europe"
 TUR_strong_man_of_europe_desc:0 "For years, Europeans mocked and belittled our empire as “the sick man of Europe”, but there is no sick man anymore. Europeans who see our superior army, our navy that dominates the seas, our air force that owns the sky and our unshakable economy will now say only one thing about us: Strong man of Europe."
 TUR_Integrate_into_Ancient_Traditions:0 "Integrate into Ancient Traditions"
 TUR_Integrate_into_Ancient_Traditions_desc:0 "In the past, we lived happily in the lands we conquered by not interfering with non-Muslims, not interfering with their religion and lifestyle. If we can do it again and more effectively, we can plant a plane tree that will live for hundreds of years."
 TUR_return_of_the_tarikats:0 "Return of the Tarikats"
 TUR_return_of_the_tarikats_desc:0 "Tarikats have been with us since the day our empire was founded They have been an important stepping stone for the development of our country They have provided security and peace in the name of our sultan in distant lands Now that our empire has been reborn, the Tarikats can come back with it."
 TUR_Ashes_of_the_Fallen_Empire:0 "Return to the Beylik System"
 TUR_Ashes_of_the_Fallen_Empire_desc:0 "Our glorious empire used the Beylik system to keep its vast borders secure and developed, so that we could control territories far from our capital. If we can adapt and resurrect this system for the modern age, it is inevitable that our empire will return to its former glory."
 TUR_Like_in_the_old_days:0 "Like in the Old Days"
 TUR_Like_in_the_old_days_desc:0 "For centuries our people have not fled in case of war like other peoples. This will not change in this century either."
 TUR_attack_arab_lands:0 "The Price of Betrayal"
 TUR_attack_arab_lands_desc:0 "The Arabs, whom we considered friends until very recently, betrayed us, declared us infidels and collaborated with Christians. This betrayal will not be forgotten."
 TUR_Unionization:0 "Turkish Workers Unionization"
 TUR_Unionization_desc:0 ""
 TUR_militarisation:0 "Fascist Militarisation"
 TUR_militarisation_desc:0 ""
 TUR_expand_the_redshirts:0 "Expand the Redshirts"
 TUR_expand_the_redshirts_desc:0 ""
 TUR_allies_aid:0 "Allies Aid"
 TUR_allies_aid_desc:0 "Even though we have joined the allied forces, our young republic does not have an industry sufficient for long-lasting wars and the fate of our country in such a global war would not be good. Of course, if our allies support us in terms of industry, we can become capable of defending ourselves militarily."
 
 
