 SAU_joint_task_force_aid:0 "American Rapid Deployment Joint Task Force"
 SAU_joint_task_force_aid_desc:0 "American forces have deployed rapidly to our territory under the terms of a bilateral protection agreement. Their presence strengthens our defenses and signals to the world that Saudi Arabia does not stand alone. While their command remains independent, coordination between our forces is improving."
 SAU_joint_task_force_usa:0 "Rapid Deployment Joint Task Force"
 SAU_joint_task_force_usa_desc:0 "A U.S. rapid deployment task force has been mobilized to safeguard strategic interests in the Arabian Peninsula. Operating in coordination with local forces, this mission demonstrates our ability to project power quickly and deter aggression in volatile regions."
 SAU_foreign_scientists_ns:0 "Foreign Scientists"
