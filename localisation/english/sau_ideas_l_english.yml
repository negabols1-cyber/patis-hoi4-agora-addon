l_english: 
 #National Spirits
 SAU_arbitrary_budget_spending:0 "Arbitrary Budget Spending"
 SAU_arbitrary_budget_spending_desc:0 "The King personally controls the national treasury, often spending large sums without oversight or long-term planning. Essential expenses are piling up, but much of the budget is diverted toward royal preferences, tributes, and symbolic gestures."
 SAU_hajj_dependent_economy:0 "Hajj Dependent Economy"
 SAU_hajj_dependent_economy_desc:0 "With oil revenues still in their infancy, the Kingdom's economy remains heavily dependent on income generated during the annual Hajj pilgrimage. Each year, thousands of pilgrims bring trade, donations and religious taxes, sustaining both local markets and the state treasury. While spiritually invaluable, this seasonal source of income leaves our financial stability vulnerable to regional instability and foreign policy shifts."
 SAU_the_ulama:0 "The Ulama"
 SAU_the_ulama_desc:0 "The Ulama, the body of Islamic scholars and religious authorities, wield significant influence over the Kingdom's social and legal structures. Their support grants legitimacy to the state, particularly in matters of governance, education, and public morality. However, they remain deeply cautious and often resistant toward reforms that threaten traditional values or their authority within society."
 SAU_sharia_law:0 "Sharia Law"
 SAU_sharia_law_desc:0 "Islamic Sharia law forms the foundation of the Kingdom's legal system, influencing all aspects of governance, civil rights, and societal norms. This structure reinforces traditional authority and religious legitimacy, while limiting liberal reform."
 SAU_slavery:0 "Slavery"
 SAU_shura_council:0 "Shura Council"
 SAU_shura_council_desc:0 "The Shura Council serves as a traditional advisory body composed of tribal elders, religious scholars, and trusted officials. While it does not hold formal legislative power, its guidance strengthens internal consensus and helps maintain political cohesion within the Kingdom."
 SAU_communist_shura_council:0 "Red Shura Council"
 SAU_research_for_oil_ns:0 "Black Gold"
 SAU_research_for_oil_ns_desc:0 "Oil, the so-called 'black gold' is emerging as the most valuable resource of the modern age. Our efforts to expand extraction and improve refinery techniques are beginning to pay off, transforming the Kingdom's strategic position and economic potential."
 SAU_hajj_revenues_ns:0 "Hajj Revenues"
 SAU_hajj_revenues_ns_desc:0 "The annual Hajj pilgrimage brings a seasonal surge of trade, donations, and service activity to the Holy Cities and surrounding regions. While temporary, this influx of wealth provides a valuable boost to our economy and morale of the Kingdom."
 SAU_british_loans_ns:0 "British Loans"
 SAU_british_loans_ns_desc:0 "The Kingdom has secured financial loans from the British government to stabilize economy and fund key state functions. While these funds offer immediate relief, they may also come with long-term political expectations."
 SAU_economic_buff:0 "Allied Economic Investments"
 SAU_american_engineers:0 "American Engineers"
 SAU_german_engineers:0 "German Engineers"
 SAU_royal_saudi_army_dmod:0 "Royal Saudi Land Forces"
 SAU_royal_saudi_army_dmod_desc:0 "The Royal Saudi Land Forces represent the primary ground force of the Kingdom. While still undergoing modernization, they stand as a disciplined and loyal institution, prepared to defend our borders and uphold national sovereignty."
 SAU_communist_army_dmod:0 "Revolutionary Ground Forces of Arabia"
 SAU_communist_army_name:0 "Revolutionary Ground Forces of Arabia"
 SAU_arab_federation_army_dmod:0 "Ground Forces of the United Arab Federation"
 SAU_arab_state_army_dmod:0 "Ground Forces of the United Arab State"
 SAU_arab_federation_army_name:0 "Ground Forces of the United Arab Federation"
 SAU_arab_state_army_name:0 "Ground Forces of the United Arab State"
 SAU_main_oil_extraction_area:0 "Main Oil Extraction Area"
 SAU_hajj_area:0 "Hajj Zone"
 SAU_state_supporting_resistance_modifier:0 "Saudi Arabian-supported resistance"
 SAU_state_supporting_resistance_modifier_modifier_desc:0 "Saudi Arabia is covertly supplying arms and equipment, as well as military training to the local arab tribes."
 SAU_sabotaged_oil_wells:0 "Sabotaged Oil Wells"
 SAU_pilot_training:0 "Pilot Training Program"
 SAU_local_development:0 "Local Development"
 SAU_new_economic_plan_ns:0 "New Economic Plan"
 SAU_first_four_year_plan_ns:0 "Four Year Plan"
 SAU_increase_oil_exports_ns:0 "Increase Oil Exports"
 SAU_increase_oil_exports_ns_desc:0 "With growing international demand, we are increasing oil exports to bolster state revenues and secure influence abroad. Our reserves now serve as both an economic engine and a diplomatic tool."
 SAU_spread_islam_ns:0 "Islamism"
 SAU_mabahith_lar_ns:0 "Mabahith"
 SAU_mabahith_lar_ns_desc:0 "The Mabahith, our domestic intelligence service, monitors dissident activity and ensures loyalty within the Kingdom. Though discreet, their operations are vital to maintaining internal order and suppressing subversive threats."
 SAU_rekate_mecca_ns:0 "Retake Mecca"
 SAU_high_morale_ns:0 "High Morale"
 SAU_arab_league_member:0 "Arab League Member"
 SAU_arab_league_member_desc:0 "A recognized member of the Arab League, aligned with the shared vision of political unity and regional cooperation among Arab nations."
 SAU_arabian_defence_council:0 "Arabian Defense Council"
 SAU_arabian_economic_council:0 "Arabian Economic Council"
 SAU_pool_technical_know_how:0 "Pool Technical Know-How"
 SAU_pool_technical_know_how_desc:0 "Every nation has their own methods of managing industry and maintaining equipment. We can learn from each other by sending technical teams to disseminate this knowledge among the other members of the alliance."
 SAU_increased_research_budget:0 "Increased Research Budget"
