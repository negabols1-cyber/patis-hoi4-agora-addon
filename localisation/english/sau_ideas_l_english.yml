 SAU_islamist_influence:0 "Islamist Influence"
 SAU_old_war_traditions_ns:0 "Old Traditions"
 SAU_old_war_traditions_ns_desc:0 "Centuries of tribal warfare and desert survival have shaped our people into agile and resilient fighters. These traditions, passed down through generations, continue to influence our tactics, favoring mobility, bold cavalry raids and a deep understanding of the terrain."
 SAU_tribes_united:0 "Tribes United"
 SAU_rebuilding_our_empire:0 "Rebuilding our Empire"
 SAU_aggressive_policies_ns:0 "Aggressive Policies"
 SAU_jihad_ns:0 "Jihad"
 SAU_nation_under_god_ns:0 "Nation Under God"
 SAU_nation_under_god_ns_desc:0 "This nation defines its very existence through faith. Our laws, leadership, and destiny are rooted in divine authority. As the call for a renewed Caliphate echoes across the Islamic world, we stand not as just a country but as a symbol of unity, order, and obedience under God."
 SAU_arabia_supporting_independence_idea:0 "[SAU.GetName] Supporting Independence"
 SAU_military_cooperation_ns:0 "Military Cooperation"
 SAU_war_against_infidels:0 "War Against Infidels"
 SAU_supporting_islamists:0 "[SAU.GetName] Supporting Islamists"
 SAU_very_low_popular_support:0 "Very Low Popular Support"
 SAU_saudi_backed_militia:0 "Saudi Backed Militia"
 SAU_saudi_backed_militia_desc:0 "With the backing of Saudi Arabia, we have received weapons, training, and spiritual support in our struggle. Their aid has bolstered our ranks and given us the strength to stand against a regime that no longer represents the faithful. We fight not only for power but for a vision of Islam untainted by corruption."
