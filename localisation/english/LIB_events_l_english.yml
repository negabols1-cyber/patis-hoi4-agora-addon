 ############ EVENTS ##############
 ##################################
 ##################################

 ####################
 ### BLACK SUNDAY ###
 ####################
 liberia.1.t:0 "Crisis of the Black Sunday"
 liberia.1.d:0 "Normally we had an agreement with the unions that we would work 6 days a week, not 7. At least on Sunday people would have time to pray to God. But when we had to take it back because of difficult circumstances, people started to get angry. This eventually led to an incident that made the headlines as Black Sunday. A Mande asked for a break because it was time to pray, but when his boss refused, he attacked him and soldiers intervened and started whipping him. The incident escalated when other employees intervened. There are reports of strikes breaking out across the country."
 liberia.1.a:0 "Working an extra day shouldn't be so hard!"
 ####################
 ### Sierra Leone ###
 ####################
 liberia.2.t:0 "Sierra Leone demand"
 liberia.2.d:0 "Liberia has wanted to unite with Sierra Leone since the 1800s. They were also heavily supported by the United States. There were several attempts. This is one of them, they telegraphed us and asked us to withdraw from Sierra Leone."
 liberia.2.a:0 "OK"
 liberia.2.b:0 "NO"
 ####################
 ### FUCK BARCLAY ###
 ####################
 liberia.3.t:0 "Scandals is Going On"
 liberia.3.d:0 "In a country founded on the foundations of freedom, it is unacceptable that the Barclay administration secretly perpetuates slavery. When he came to power he said he would not be like the previous president Charles DB King, but here we are."
 liberia.3.a:0 "The apple doesn't fall far from the tree"
 ######################
 ### LOCAL LANGUAGE ###
 ######################
 #STAGE:1
 liberia.4.t:0 "Stage 1: Kolokwa Language"
 liberia.4.d:0 "Kolokwa evolved from West African Pidgin English spoken along the West African coast; it was significantly influenced by Liberian Settler English. Significantly influenced by Liberian Settler English, brought to Liberia by African-American immigrants in the nineteenth century and spoken today by descendants of the immigrants"
 liberia.4.a:0 "This language inseparable from our people"
 liberia.4.b:0 "This corrupted language is unacceptable"
 #STAGE:2
 liberia.5.t:0 "Stage 2: Bassa Kru Language"
 liberia.5.d:0 "Bassa is a Kru language spoken by the Bassa people in Liberia, Ivory Coast, Sierra Leone and Liberia. It is a valued language, although not highly valued among the people."
 liberia.5.a:0 "This language inseparable from our people"
 liberia.5.b:0 "We shouldnt' recognise the language spoken by a few tribes?"
 #STAGE:3
 liberia.6.t:0 "Stage 2: Mande Language"
 liberia.6.d:0 "The Mande language are a group of languages spoken in several countries in West Africa by the Mandé peoples. The language show a few lexical similarities with the Atlantic–Congo language family"
 liberia.6.a:0 "This language inseparable from our people"
 liberia.6.b:0 "Speak English instead?"
 #########################
 ### NATIONAL LANGUAGE ###
 #########################
 liberia.7.t:0 "National Language Program"
 liberia.7.d:0 "Liberia is a multilingual country with more than 20 indigenous languages spoken. English is the official language, but this era must come to an end. We need to unite under one language so that the people can live in unity and in accordance with Western culture. A committee has been convened for this. They were sure it was going to be English, but they were trying to decide whether it was going to be Liberian English, which is the dialect that was emerging in Liberia, or Native English."
 liberia.7.a:0 "Liberian English is the only way"
 liberia.7.b:0 "We must learn correct English"
 ######################
 ### PARADE CAPITAL ###
 ######################
 liberia.8.t:0 "Parade in Capital"
 liberia.8.d:0 "In the capital, in Monrovia, we were preparing to have a parade that would be heard throughout the country about the Barclay scandals and the deals we made with the tribes. The tribes still seemed to be mildly angry with Tubman. As he was thinking about all this, he got out of his car and..."
 liberia.8.a:0 "Tubman has been SHOT"
 liberia.8.b:0 "Tubman took the stage"
 #####################
 ### PEARL MILLING ###
 #####################
 liberia.9.t:0 "Pearl Milling"
 liberia.9.d:0 "The Liberian coast is full of pearls. We decided we could make use of them."
 liberia.9.a:0 "We must devote our resources to Pearls"
 liberia.9.b:0 "It makes more sense to choose a slow plan"
 #######################
 ### DO U WANT PEARL ###
 #######################
 liberia.10.t:0 "[FROM.GetNameDefCap] Could Help Us Trade Pearls"
 liberia.10.d:0 "With the tension between countries rising across the world, trade has become more difficult, and if we find ourselves at war, options for buying and selling pearl will become even more limited. If we trust them enough, [FROM.GetName]'s neutrality could be an opportunity for us to trade freely, benefiting our economy, and ultimately our war machine."
 liberia.10.a:0 "A sound idea"
 liberia.10.b:0 "We can't know where they really stand"
 #####################
 ### RAID SETTLERS ###
 #####################
 liberia.11.t:0 "Raid Settlers"
 liberia.11.d:0 "Why should our people starve while rich American settlers buy cheap land in our country and live like kings? raiding the homes of these settlers and distributing their assets to our people will advance the Revolution"
 liberia.11.a:0 "Set them Free"
 liberia.11.b:0 "Collect the goods and distribute them to the people"
 ###########################
 ### MOVE THE CLOCK BACK ###
 ###########################
 liberia.12.t:0 "Demand for Minimum Wage"
 liberia.12.d:0 "Even though minimum wages have fallen drastically since the Great Depression, Firestone Natural Rubber Company sent a telegram to government economists. The Congo's crisis was also present in Liberia. Malaya had dominated rubber production thanks to extremely cheap labor. To get it back on track, it was proposing to lower the minimum wage."
 liberia.12.a:0 "Accept the Demand"
 liberia.12.b:0 "This is Unacceptable"
 ############################
 ### LOOK DAD! NEWSPAPERS ###
 ############################
 liberia.13.t:0 "Look Dad! You are in the Headline!"
 liberia.13.d:0 "Barclay barely got out of bed after a long night. The dinner table was ready. As he sat down and started to eat, his son started flipping through the newspapers because he had finished his meal so quickly.  At that moment his son started shouting.\n-Look Dad! You are in the Headline!\nBarclay immediately picked up the newspaper.\n''When did Edwin Barclay ever do anything right for our country, like improve our economy or achieve anything else good? If our people knew about the scandals he was involved in, they would never have elected him.''"
 liberia.13.a:0 "Oh no!"
 ######################
 ### WORKER UNRESTS ###
 ######################
 liberia.14.t:0 "The Protests are Growing"
 liberia.14.d:0 "With the fall in the minimum wage, protests have started to increase, except for the usual ones. Strikes, arson, attacks on settlers..."
 liberia.14.a:0 "We can't take it anymore!"
 #######################
 ### ACCEPTES SIERRA ###
 #######################
 liberia.15.t:0 "[FROM.GetNameDefCap] Accepted our Demands"
 liberia.15.d:0 "[FROM.GetNameDefCap] has controlled Sierra Leone for some time. Normally the US had suggested in the 1800s that it should be united with Liberia, but we had to wait until now. But now we have liberated the people here too."
 liberia.15.a:0 "Sierra Leone is Liberated!"
 ######################
 ### REJECTS SIERRA ###
 ######################
 liberia.16.t:0 "[FROM.GetNameDefCap] Refuses our Demands"
 liberia.16.d:0 "[FROM.GetNameDefCap] has controlled Sierra Leone for some time. Normally, the US had proposed in the 1800s that it should merge with Liberia, but we had to wait until now. We presented our proposal to [FROM.GetNameDefCap] to merge with Sierra Leone, but they refused."
 liberia.16.a:0 "If not this time, then another time!"
 ###################
 ### COUP D'ETAT ###
 ###################
 liberia.17.t:0 "Masons tried a Coup D'etat!"
 liberia.17.d:0 "The Grand Lodge of the Republic of Liberia is a very important organization in Liberia, most politicians are members of this lodge, so politics is in their hands. Charles DB King, who didn't care too much about it, allowed them to grow. It got bigger and bigger and they attempted a coup. In the coup that started at 12 AM, the armed forces said that DB King had been removed from office and that the soldiers would take over in order to preserve the American culture that was being destroyed. As the soldiers marched on DB King's mansion, loyal troops from the upper echelon of the military reached DB King and helped him escape. Word was then sent to every county to get the people to rise up, the coup generals ordered the infantry to fire on the people, but the infantry, thinking they were on a drill, realized it was a drill and disarmed. Thus, the coup was prevented. At 3 PM Charles DB King made a speech."
 liberia.17.a:0 "Declare State of Emergency!"
 ######################
 ### PEARL ACCEPTED ###
 ######################
 liberia.18.t:0 "[FROM.GetNameDefCap] Accepted Our Pearls"
 liberia.18.d:0 "This means that they will only trade pearls with us and will be able to buy and sell pearls freely without having to worry about embargoes. They are not the only ones who will benefit; the influx of money will help our struggling economy and could even be used as a bargaining chip in the future."
 liberia.18.a:0 "This will be useful"
 ######################
 ### PEARL REJECTED ###
 ######################
 liberia.19.t:0 "[FROM.GetNameDefCap] Refuses Our Pearls"
 liberia.19.d:1 "Despite the obvious mutual benefit, [FROM.GetName] is not interested in our high quality pearls. Perhaps we can offer this again in the future."
 liberia.19.a:0 "Oh well"
 #######################
 ### DOLARISATION US ###
 #######################
 liberia.20.t:0 "Liberia accelerated Dollarization Program."
 liberia.20.d:1 "Liberia, which we helped found many years ago, has announced that it will officially start using the US dollar after a long period of unofficial use of the US dollar."
 liberia.20.a:0 "A glory day to the America!"
#^W^END^W^#