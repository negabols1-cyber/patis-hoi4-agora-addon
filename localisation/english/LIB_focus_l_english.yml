l_english:
 #Industry
 LIB_expand_rubber_cultivation:0 "Expand Rubber Cultivations"
 LIB_expand_rubber_cultivation_desc:0 "In recent years, there has been growing interest in Liberia's potential to grow rubber. Experts believe that rubber can play an important role in the country's economic development.\n\nLiberia is ideally placed to grow rubber thanks to its tropical climate and fertile soils. Rubber is already grown in the country, but this production is still on a small scale. The Liberian government is taking steps to promote rubber production and is working to increase investments in this area."
 LIB_steel_prospecting:0 "Steel Prospecting"
 LIB_steel_prospecting_desc:0 "Steel is one of the basic building materials of the modern world and Liberia's establishment of its own steel production could be used to develop its infrastructure and create new jobs.\n\nGeologists believe there are large deposits of iron ore in Liberia's northern and western regions. These deposits could be enough to meet the country's steel needs and even export it."
 LIB_urbanization_Monrovia:0 "Urbanization of Monrovia"
 LIB_urbanization_Monrovia_desc:0 "People from villages and towns are flocking to the city in the hope of better living conditions and job opportunities. This urbanization has had a significant impact on Monrovia's infrastructure, economy and social structure.\n\n Urbanization is leading to investments in infrastructure in Monrovia, such as new housing, schools and hospitals. It is also creating new jobs in the city. However, rapid urbanization is not without its challenges. There is a lack of housing, traffic congestion and an increase in crime."
 LIB_oil_proccesing:0 "Oil Processing"
 LIB_oil_proccesing_desc:0 "It will reduce the dependence on Liberia's oil and gas industry and mark an important milestone in Liberia's economic development, The country's first oil processing plant is under construction. The plant will process Liberia's crude oil to produce fuel oil and other petroleum products needed by the country.\n\nThe oil processing plant will bring many benefits to the Liberian economy. It will reduce the country's dependence on fuel imports and save foreign currency. It will also create new jobs and stimulate the local economy."
 LIB_ban_the_use_of_cyanide:0 "Ban the Use of Cyanide"
 LIB_ban_the_use_of_cyanide_desc:0 "Cyanide is a highly toxic chemical used in the mining industry to extract precious metals such as gold and silver. The use of cyanide can cause serious damage to the environment and human health.\n\nThe cyanide ban will help protect the health of thousands of people working in Liberia's mines. It will also protect the natural environment from contamination by preventing cyanide from entering water supplies and soil."
 LIB_allimium_mining:0 "Aluminum Mining"
 LIB_allimium_mining_desc:0 "Aluminum mining can bring many benefits to Liberia. It can create new jobs, generate foreign exchange earnings that can be used to improve infrastructure and contribute to the country's development.The government is offering incentives to investors to develop the aluminum mining sector."
 LIB_Liberated_Uranium:0 "Liberated Uranium"
 LIB_Liberated_Uranium_desc:0 "Some believe that Liberated Uranium could be a new source of energy. It could have the potential to transform Liberia's economy and bring the country to the forefront of the modern world.\n\nHowever, little is still known about Liberated Uranium. Exactly what it is and how it works remains unclear. Scientists are conducting studies to investigate the potential benefits and risks of Liberated Uranium."
 LIB_gold_extraction:0 "Gold Extraction"
 LIB_gold_extraction_desc:0 "The rise in gold prices in recent years has revitalized mining activity in Liberia. Investors are racing to capitalize on the country's rich gold reserves.\n\nGold mining can bring many benefits to Liberia. It can create new jobs, generate foreign exchange earnings that can be used to improve infrastructure and contribute to the country's development.\n\nThe government is offering incentives to investors to develop the gold mining sector."
 LIB_chromium_mills:0 "Chromium Mills"
 LIB_chromium_mills_desc:0 "The plant is one of the most modern chrome processing plants in Africa and is expected to contribute significantly to the country's economy.\n\nThe plant has a processing capacity of 12 tons of chrome ore and will employ 2500 people. Chromium is an important raw material used in the production of stainless steel and many other durable metals."
 LIB_tungsten_mills:0 "Tungsten Mining"
 LIB_tungsten_mills_desc:0 "In 1930s Liberia, tungsten mining was central to the country's economic development prospects. The precious metal was a highly sought-after commodity, used in light bulbs and other electronic products. Miners set out in search of tungsten ore in remote areas of Liberia, and new mines were quickly opened."
 LIB_Steel_mills:0 "Steel Mills"
 LIB_Steel_mills_desc:0 "The government believes that steel production is key to modernization and prosperity. After all, even a rifle cannot fire a bullet without steel. That's why we urgently need to expand the steel mills."
 LIB_cofee_economy:0 "Revival of the Coffee Production"
 LIB_cofee_economy_desc:0 "Years ago, Liberia was the number one coffee producer. And the Liberian governmentThe revival of coffee production brings with it some challenges for Liberia. To succeed, Liberia needs to adopt sustainable agricultural practices, produce high quality coffee and market its products internationally."
 LIB_pearl_mining:0 "Hearth of Pearls"
 LIB_pearl_mining_desc:0 "In the heart of deep Africa, in Liberia, where pearls adorn the coastline, a rare treasure hidden by nature has been unearthed. In the Greenvile region, in a mysterious cove blended with the whisper of the waves, a bed of pearls of infinite beauty has been discovered.\n\nThis miraculous discovery has the power to change Liberia's destiny forever. Dubbed the "Heart of the Pearl", it will bring the country not only material prosperity, but also cultural and spiritual enrichment."
 LIB_centralised_economy:0 "Processed Food Economy"
 LIB_centralised_economy_desc:0 "Liberia's economy is being transformed by a new sector based on the processing and export of agricultural products. This exciting development is seen as an important step for the country's development and prosperity.\n\nThe development of the processed food sector will bring many benefits to Liberia. It will create new jobs, increase the added value of agricultural products and help the country diversify the economy. It will also allow Liberia to become more competitive in international markets and generate more revenue."
 LIB_hydropower:0 "Mount Coffee Hydropower Project"
 LIB_hydropower_desc:0 "Liberia has completed the Mount Coffee Hydroelectric Project, a major step to increase electricity generation and ensure the country's energy security. This giant project is critical to Liberia's development and will meet a large part of the country's energy needs." 
 LIB_mechanic_calculations:0 "Mechanical Calculations"
 LIB_mechanic_calculations_desc:0 "The key to the success of engineers and technicians in their work is the ability to solve complex mechanical problems. To achieve this goal, mathematical formulas and physical principles are used, as well as tools and methods specifically designed for mechanical calculations."
 LIB_integrated_rail_network:0 "Agreement of Monopolies"
 LIB_integrated_rail_network_desc:0 "The Liberian economy has recently witnessed a trend of firms in various sectors coming together and reaching agreements to protect their market share and raise prices. This has been dubbed the 'Monopolies' Deal by the public and has raised concerns."
 LIB_farming:0 "Create Farming Areas"
 LIB_farming_desc:0 "Liberian agriculture is undergoing an exciting transformation with the adoption of new and innovative farming techniques. One of these is a modern farming method known as 'Intensive'. This method contributes to making agriculture more productive and sustainable, bringing significant benefits to the Liberian economy."
 LIB_research:0 "Expand the University of Liberia"
 LIB_research_desc:0 "The University of Liberia is the country's oldest and most prestigious institution of higher learning, founded in 1862. The university offers a variety of undergraduate and graduate programs with the main objective of training qualified manpower to contribute to the development of Liberia.\n\nThe University of Liberia is not only a center of academic education, but also of research and scientific studies. The University's researchers conduct important studies in various fields such as agriculture, medicine, engineering, and social sciences. These studies contribute to Liberia's development and help the country grow in international prestige."
 LIB_research_2:0 "Stella Maris Polytechnic University"
 LIB_research_2_desc:0 "Stella Maris Polytechnic University offers a variety of engineering, technology and vocational training programs. These programs are designed to provide students with modern technical skills and prepare them for the labor market."
 LIB_inspired_by_goddard:0 "Inspired by Goddard"
 LIB_inspired_by_goddard_desc:0 "There have been exciting recent developments in space exploration and aeronautics in Liberia. Behind these developments is the dedication of Liberian scientists and engineers inspired by the world-renowned rocket scientist Robert H. Goddard."
 LIB_syntetich_resources:0 "Synthetic Resources"
 LIB_syntetich_resources_desc:0 "Liberia is a country rich in natural resources. However, the fact that these resources are limited and at risk of depletion due to growing population and industrialization is a concern for the Liberian economy. Therefore, new resources are needed to ensure Liberia's development in a sustainable manner."
 LIB_Uranium_purification:0 "Uranium Enrichment"
 LIB_Uranium_purification_desc:0 "Liberia is known to be rich in uranium reserves. This means that the country has the potential to produce nuclear energy. The construction of a uranium refinery could allow Liberia to meet its energy needs and export electricity."
 LIB_Monrovia_radar_stations:0 "Monrovia Radar Station"
 LIB_Monrovia_radar_stations_desc:0 "The new radar station being built in Monrovia will significantly improve the security and control of Liberian airspace. This modern radar system will help prevent accidents and make air transportation safer by providing monitoring of aircraft and air traffic."
 LIB_way_of_Thomas_Faulkner:0 "Way of Thomas Faulkner"
 LIB_way_of_Thomas_Faulkner_desc:0 "Thomas Faulkner, who came to Liberia from the United States in 1929, helped to end the slave trade to a large extent with his declarations. On the other hand, he also helped the development of the country with his reforms to expand the ice cream and refrigeration sector. In short, we know a little bit about what kind of economist he was. How the country will move forward with his reforms."
 LIB_war_industry:0 "War Industry"
 LIB_war_industry_desc:0 "The war industry can bring new jobs and economic development to Liberia. The production of modern weapons and equipment can enable Liberia to participate in the international arms market and generate foreign exchange earnings. It can also provide technical skills and expertise for those working in this sector."
 LIB_liberated_workers:0 "Liberated Workers"
 LIB_liberated_workers_desc:0 "The recent rise of labor movements in Liberia has the potential to transform the country's political and economic landscape. This new wave is being led by a group of so-called "liberated workers" who are fighting against exploitation and demanding a fairer work environment."
 LIB_Monroiva_dockyards:0 "Monrovia Dockyards"
 LIB_Monroiva_dockyards_desc:0 "The recently completed expansion of the Monrovia Shipyards represents a significant milestone in Liberia's maritime sector. This modern facility has the potential to become a global leader in Liberia's ship repair and building sector.\n\nThe expanded shipyards have the capacity to repair and build larger and more complex vessels. This makes Liberia a more attractive destination for international shipping companies. In addition, the shipyards will create new jobs and investments that will contribute significantly to the Liberian economy."
 LIB_extraction:0 "Extract our Resources"
 LIB_extraction_desc:0 "Liberia is a country rich in natural resources. It is home to forests and valuable minerals such as gold, diamonds, iron ore and timber. The extraction of these resources has great potential to revitalize Liberia's economy and improve the well being of its people."
 LIB_Increase_the_sea_trade_score:0 "Incrase the Sea Trade Score"
 LIB_Increase_the_sea_trade_score_desc:0 "Liberia is a country with a long and deep rooted maritime history. In recent years, however, Liberia's maritime trade score has declined. This weakens Liberia's competitiveness in the global maritime sector and hinders the country's economic development."
 LIB_crate_trade_convoys:0 "Create Trade Convoys"
 LIB_crate_trade_convoys_desc:0 "It could be an effective solution to protect Liberia's maritime trade and strengthen the country's economy. The convoys would consist of armed vessels that would escort ships operating under the Liberian flag and protect them from maritime bandits and other threats."
 LIB_cover_our_trade_convoys:0 "Cover our Trade Convoys"
 LIB_cover_our_trade_convoys_desc:0 "The Liberian people must recognize the importance of protecting trade convoys and support the government and the maritime sector to achieve this goal. Working together, they can make Liberia's maritime trade safer and more prosperous."
 LIB_modern_trade_convoys:0 "Modern Trade Convoy Techniques"
 LIB_modern_trade_convoys_desc:0 "Modern trade convoy techniques are an important tool to protect Liberia's maritime trade and support the country's economic development. By continuing to develop and implement these techniques, the government and the maritime sector can make Liberia's maritime trade safer and more prosperous."
 #POLITIC
 LIB_dolarisation:0 "Continue to the Dollarization Program"
 LIB_dolarisation_desc:0 "To address the difficult economic conditions of the 1930s, the Liberian government has launched a new initiative called the dollarization program. Under this program, the US dollar will replace the Liberian dollar as the country's official currency."
 LIB_integrate_West_African_pound:0 "Integrate the West African Pound"
 LIB_integrate_West_African_pound_desc:0 "In an important step to promote regional stability and integration, the Liberian government has decided to re-adopt the West African Pound as its currency. This change was expected to facilitate Liberia's trade with its neighbors and enable the country to participate more effectively in the regional economy."
 LIB_crush_the_union_rats:0 "Crush the Labor Rats"
 LIB_crush_the_union_rats_desc:0 "Normally we had an agreement with the unions that we would not work on Sunday, but in this economic crisis we have no choice."
 LIB_contunie_new_deal:0 "Continue the New Deal"
 LIB_contunie_new_deal_desc:0 "With the inauguration of President Edwin Barclay in 1930, there was a new ray of hope for unions. Barclay recognized the importance of unions and took steps to make them stronger. In 1931, he signed the first trade union law in Liberia. This law gave legal protection to the formation of trade unions and collective bargaining."
 #VISA/WILKOMMENSKULTUR
 LIB_visa_policies:0 "Reorganize Visa Policies"
 LIB_visa_policies_desc:0 "The Liberian government plans to make significant changes to visa policies to regulate entry and exit into and out of the country. These changes are thought to be a reform that will make it more difficult for non-Africans to travel and settle in Liberia."
 LIB_purge_foreign_scientists:0 "Purge Foreign Scientists"
 LIB_purge_foreign_scientists_desc:0 "The Liberian government today announced the dismissal of a number of foreign scientists working in the country's scientific institutions. The government said these scientists were accused of engaging in political activities and using scientific work for political purposes."
 LIB_national_education:0 "National Education"
 LIB_national_education_desc:0 "Proponents of this new system believed that an educated population would contribute to Liberia's economic development and prosperity. Educated workers could help develop the country's infrastructure, modernize agriculture and establish new industries."
 LIB_take_settlers_lands:0 "Take Settlers' Lands"
 LIB_take_settlers_lands_desc:0 "Even though they arrived nearly 100 years ago, the settlers are still not adapting to the area. In addition, because they are now causing damage to the region, the Liberian government has decided to take away the land of the 'enemy of the state' settlers."
 LIB_local_languages_program:0 "Local Languages Program"
 LIB_local_languages_program_desc:0 "In 1930s Liberia, efforts were underway to develop a sense of national identity and unity. An important part of these efforts was the creation of an Indigenous Languages Program to preserve and develop the country's rich linguistic heritage."
 LIB_the_sun_of_africa:0 "the Sun of Africa"
 LIB_the_sun_of_africa_desc:0 "The idea for the 'African Sun' was inspired by Liberia's struggle for independence and sovereignty. Liberians believed that their victory over the colonizers represented hope for freedom and equality for all Africans. They believed that Liberia, with its rich resources and hardworking people, could be a model for African development."
 LIB_Willkommenskultur:0 "Settlers Welcome"
 LIB_Willkommenskultur_desc:0 "The Settler Welcome Policy has had a significant impact on the Liberian economy. New investments have contributed to improving infrastructure, increasing job opportunities and boosting agricultural production. It has also helped to improve Liberia's relations with the international community."
 LIB_land_for_settlers:0 "Land for the Settlers"
 LIB_land_for_settlers_desc:0 "The difficult economic conditions and rising unemployment of the 1930s left many Americans looking for a new start. In this search, the vast and fertile lands of Liberia emerged as a promising option. The Liberian government was eager to develop the country and increase its population by offering Americans attractive incentives to buy land and settle."
 LIB_reestablish_radar_camps:0 "Re-Establish Radar Camps"
 LIB_reestablish_radar_camps_desc:0 "The radar camps from the German Empire were reactivated by new scientists we brought from Europe. This is a big step for Liberia, if not for the world."
 LIB_expand_foreign_scientists:0 "Invite Foreign Scientists"
 LIB_expand_foreign_scientists_desc:0 "Liberia is inviting foreign scientists to the country to promote progress in science and technology and accelerate national development. By offering generous incentives and research opportunities to scientists specializing in various fields, the government aims to build the country's scientific capacity and boost innovation."
 LIB_national_language_projekt:0 "National Language Program"
 LIB_national_language_projekt_desc:0 "The Liberian government has launched a new National Language Program aimed at unifying the country and fostering national identity. The program aims to ensure that all Liberians can speak a common language and plans to make English the only common language."
 LIB_the_star_of_africa:0 "the Star of Africa"
 LIB_the_star_of_africa_desc:0 "The star on Liberia's flag may mean different things to some. But one thing everyone can agree on is that it unites us under one thing."
 #BARCLAY/REPUBLICAN
 LIB_The_Lone_Star_Forever:0 "The Lone Star Forever"
 LIB_The_Lone_Star_Forever_desc:0 ""
 LIB_pop_some_champagne:0 "Pop Some Champagne"
 LIB_pop_some_champagne_desc:0 "In his speech, the President praised the courage and resilience of the Liberian people, describing how the country has gone through challenges and emerged as a stronger nation. He also pledged that his government will continue to work to develop the economy, improve education and health care, and create equal opportunities for all Liberians."
 LIB_Firestone_payouts:0 "Firestone Payouts"
 LIB_Firestone_payouts_desc:0 "The Liberian government faces a difficult decision to repay its debt to the Firestone rubber company. This debt stems from an agreement made in the 1920s to allow Firestone to establish rubber plantations in Liberia. With our payments, however, Firestone will be able to expand and grow more rubber plantations."
 LIB_trade_usa:0 "Trade Agreement with the US"
 LIB_trade_usa_desc:0 "Liberia and the United States have signed a historic trade agreement that aims to significantly enhance economic cooperation between the two countries. This agreement will give Liberia greater access to US markets, helping the country to increase its exports and strengthen its economy."
 LIB_us_roads:0 "American Highways"
 LIB_us_roads_desc:0 "The construction of American highways to Liberia is a historic opportunity for the country. This project will help improve Liberia's infrastructure, promote development and create a better future for all Liberians."
 LIB_american_machines:0 "American Machines"
 LIB_american_machines_desc:0 "American machinery will also revolutionize agricultural production. Modern tractors and harvesters will help Liberia produce agricultural products more efficiently and increase processing capacity. This has the potential to improve food security and make Liberia a food exporter."
 LIB_us_military_coop:0 "US Military Cooperation"
 LIB_us_military_coop_desc:0 "The US will provide Liberia with military training, equipment and financial assistance. This will help the Liberian military become a more professional and effective force. The United States and Liberia will also increase cooperation by conducting joint military exercises and operations.\n\nThis increased cooperation will make Liberia more resilient to terrorist threats. The US will provide Liberia with counterterrorism intelligence and training and help Liberian security forces disrupt terrorist networks."
 LIB_american_motor_factories:0 "American Motor Factories"
 LIB_american_motor_factories_desc:0 "American engine factories will produce engines to power vehicles, agricultural equipment and other machinery produced in Liberia. This will reduce Liberia's dependence on imports and contribute to a self-sufficient economy."
 LIB_american_garnison:0 "US Expeditionary Garrisons"
 LIB_american_garnison_desc:0 "The US argues that it will deploy expeditionary garrisons to protect Liberia's stability and regional security. The garrisons will help fight terrorism and protect Liberia's maritime borders. They will also provide training and support to help the Liberian military modernize and build its capacity."
 LIB_american_advisors:0 "American Advisors"
 LIB_american_advisors_desc:0 "The United States says it will send experienced advisors to accelerate Liberia's development and help the country realize its full potential. The advisors will advise the Liberian government on managing the economy, developing infrastructure and improving public services."
 LIB_reform_the_army:0 "Reform the Army"
 LIB_reform_the_army_desc:0 "The Liberian government, with the help of American advisors, has launched a new initiative to modernize and reshape the Liberian military. These reforms will make the military more professional, efficient and capable of protecting national security."
 LIB_sierra_leone:0 "Unite with Sierra Leone"
 LIB_sierra_leone_desc:0 "Liberia and Sierra Leone, two neighboring countries in western Africa, have long dreamed of unification. The history of this union is rooted in the colonial past and shared cultural ties. Proponents of unification believe it would increase regional stability and prosperity and consolidate political and economic power."
 LIB_develop_sierra_leone:0 "Develop Sierra Leone"
 LIB_develop_sierra_leone_desc:0 "The Government of Liberia has launched a new initiative to develop and modernize Sierra Leone. The plan includes investments to develop infrastructure, improve education and health care, and revitalize the economy."
 LIB_five_days_work:0 "Five-Day Workweek"
 LIB_five_days_work_desc:0 "No matter how much we pay, no matter how much we work, if our workers do not get enough rest, they cannot work efficiently. changing working time to 5 days a week can help unions and workers stay satisfied and serve their country better"
 LIB_review_interior_policy:0 "Review Domestic Policy"
 LIB_review_interior_policy_desc:0 "If we want our country to develop, we need to review our domestic politics. Are we going to be a country of freedom, democracy and equality or are we going back to our old policies? We have to decide this."
 LIB_agree_with_unions:0 "Agreement with Unions"
 LIB_agree_with_unions_desc:0 "We need to come to an agreement with the unions. they are constantly putting our government in a difficult situation with demands such as less working hours, higher salaries, providing electricity to areas without electricity. this issue needs to be resolved once and for all"
 LIB_electricisation_of_urbans:0 "Urban Power Grids"
 LIB_electricisation_of_urbans_desc:0 "even though we have a small country, we still don't have an electricity grid in most of our urban areas and this is a big problem. Solving the electricity problem will satisfy both our people and trade unions and will contribute to our industry."
 LIB_open_cotteje_hospital:0 "Open Cotteje Hospital"
 LIB_open_cotteje_hospital_desc:0 "Due to our geographical location, we live in the middle of many dangerous diseases and there is a great risk of epidemics at any time. We can sign an agreement with the US and ask them to open hospitals in our country so that we can avoid the danger of epidemics."
 LIB_american_sivil:0 "American Industrial Complexs"
 LIB_american_sivil_desc:0 "Through our agreements with the USA, the US will build industrial facilities that will be managed and operated by us. This will create jobs for our people and contribute to our economy."
 LIB_evolition_program:0 "Under Star-Spangled Banner"
 LIB_evolition_program_desc:0 ""
 LIB_national_car:0 "National Cars"
 LIB_national_car_desc:0 "Thanks to the technological help we received from the US, we have reached a level where we can build our national car.\nThanks to this car, new job opportunities will arise and we will be able to solve unemployment, which is one of the biggest problems of our country. Moreover, it will contribute to our economy and we will be able to have a continuously growing economy."
 LIB_national_defense_council:0 "National Defence Council"
 LIB_national_defense_council_desc:0 "With the National Council now firmly under the control of Barclay, all that remains is to gain control of the Chamber of Deputies. With all chambers of the civilian government under absolute majority of the party, the dictatorship will gain uncontested control of the nation and its industries."
 LIB_declare_martial_law:0 "Declare Martial Law"
 LIB_declare_martial_law_desc:0 "Time will tell what consequences martial law will have in Liberia. It remains to be seen whether this decision will ensure national security or threaten Liberia's democracy, but we must prepare for the current international wars"
 LIB_oil:0 "Develop Pipelines"
 LIB_oil_desc:0 "The Liberian government, in cooperation with the United States, has launched a new initiative to develop oil and gas pipelines in the country. These pipelines have the potential to improve Liberia's energy infrastructure and boost the economy."
 #Faulkner
 LIB_Republican_conspiracy:0 "The Faulkner's Conspiracy"
 LIB_Republican_conspiracy_desc:0 "Edwin Barclay's deal with the Nazis is nothing but a shot in the foot. it will not be difficult to oust him from government because of this mistake"
 LIB_computing_techs:0 "Modern Computing Systems"
 LIB_computing_techs_desc:0 "With the advancement of technology, we have been able to have complex operations done by complex machines called computers. we can contribute to our progress by bringing the newest of these systems to our country."
 LIB_open_public_universities:0 "Open Public Universities"
 LIB_open_public_universities_desc:0 "There can be no development without education. We need to open public universities in our country and give people from all walks of life the opportunity to educate themselves."
 LIB_communication:0 "Expand the Communications Sector"
 LIB_communication_desc:0 "We live in an age where information is easily disseminated. We can know almost instantly about a war, technological breakthrough, etc. on the other side of the world. investing in this sector and ensuring its development will keep us informed about the world."
 LIB_victrix:0 "United Peoples"
 LIB_victrix_desc:0 "Eventually, the oppressive Barclay government fell and the Liberian people gained the right to equal government."
 LIB_demilitarisation:0 "De-Militarization"
 LIB_demilitarisation_desc:0 "We are already a neutral country and there is hardly any country around us that could pose a threat to us. If we keep good relations with the British and French, we will not need to allocate our already weak economy to the army."
 LIB_work_with_other_monopolies:0 "Work with other Monopolies"
 LIB_work_with_other_monopolies_desc:0 "the arms trade is not just about rifles. cooperating with different arms companies in the world and in our country will be of great benefit to both sides"
 LIB_sell_arms_factories:0 "Sell Arms Factories"
 LIB_sell_arms_factories_desc:0 "Now that we are demilitarized, we no longer need military factories It will be more beneficial for us to sell these unnecessary factories and buy factories that will benefit our people."
 LIB_free_trade:0 "Open Our Market"
 LIB_free_trade_desc:0 "since we are a neutral and demilitarized country, it would be of great benefit to our economy to ensure that all countries of the world can use us as a trade route"
 LIB_neutrality_act:0 "Neutrality Act"
 LIB_neutrality_act_desc:0 "our country has been a country that values independence and freedom since the day it was founded. and the only way to protect these is to remain neutral. yes, it may seem like a mistake to declare neutrality, but war is never profitable"
 LIB_arms_trade:0 "Arms Trade"
 LIB_arms_trade_desc:0 "The world is about to descend into chaos and we can take advantage of it. most of the countries in the world do not have enough weapons and they can pay any money they want to any country that sells them weapons\nIf we can capitalize on this, our economy can take a giant leap forward."
 LIB_work_together_with_unions:0 "Work Together with Unions"
 LIB_work_together_with_unions_desc:0 "being at odds with the unions will not help them or us. in such difficult times, making concessions to each other instead of opposing each other is essential to preserve our freedom"
 LIB_keep_control_settlers:0 "Keep Settlers Under Control"
 LIB_keep_control_settlers_desc:0 "The arrival of American settlers is a good thing, but if we don't keep them under control, Liberia may cease to belong to the Liberians."
 LIB_call_for_foreign_advisors:0 "Call For Foreign Advisors"
 LIB_call_for_foreign_advisors_desc:0 "Unfortunately, there are very few people in our country who are knowledgeable about industry, education and the military, and it takes a long time to train them. BUT We can solve this problem if we invite foreign consultants to our country"
 LIB_new_flag:0 "The New Constitution"
 LIB_new_flag_desc:0 "Our current flag is too much like the American flag. We should change it because it reminds us of the American colonial times and can be confused! There is also the possibility of passing some economic laws, of course."
 #FAŞO
 LIB_clocks_go_back:0 "Move the Clocks Back"
 LIB_clocks_go_back_desc:0 "Yes, our country may have been founded on the principles of freedom, but slavery is inherent in the nature of the world, and we are not exempt from it."
 LIB_look_dad_you_at_the_headline:0 "Look, Dad! You Are in the Headlines!"
 LIB_look_dad_you_at_the_headline_desc:0 "Edwin Barclay, when has he ever done something right for our country, like improving our economy or achieving any other good thing? If our people knew about the scandals he's involved in, they would never have elected him. Of course, if they find out now, they could pressure him to resign."
 LIB_unrest_of_workes:0 "Workers' Unrest"
 LIB_unrest_of_workes_desc:0 "We have a lot of workers in our country, and anyone who does what they want can become president. If we could make the workers hate Edwin Barclay, his resignation would be guaranteed"
 LIB_government_resigns:0 "Government Resignation"
 LIB_government_resigns_desc:0 "There is no point in someone becoming president if they lose the support of the people and the workers. Sometimes, the best thing to do is resign and make way for better leaders."
 LIB_old_faces:0 "Old Faces, New Era"
 LIB_old_faces_desc:0 "After the government resigns, the best choice would be for former President Charles D.B. King to return. Let's see what the future holds for our country."
 LIB_invite_the_mason:0 "Invite the Masons"
 LIB_invite_the_mason_desc:0 "There is a large group that does not support President Charles D.B. King and wants the former president back. Inviting the Masons to our country and ensuring their support through concessions will help break down public opposition to us and strengthen our government."
 LIB_crush_political_dissent:0 "Crush the Political Dissent"
 LIB_crush_political_dissent_desc:0 "Some political figures still overlook and advocate for the return of the former president despite the corruption and scandals he was involved in, and these fools are diminishing our support from the people. If we don't silence them, our power could be in jeopardy."
 LIB_coup:0 "Coup D'etat"
 LIB_coup_desc:0 "Trusting the Masons was a mistake. We should have expected that the privileges we granted them would backfire on us. Putting our country at such risk to gain public support was a complete mistake. It is essential to declare a state of emergency, suspend democracy, and stop the coup."
 LIB_close_the_masonic_lobby:0 "Close Masonic Lodges"
 LIB_close_the_masonic_lobby_desc:0 "Even though most of the top management is of Masonic origin, it is clear that this coup came directly from the Great Leader. We need to destroy these masons."
 LIB_paramilitary_youth:0 "Paramilitary Units"
 LIB_paramilitary_youth_desc:0 "" #TODO
 LIB_new_constitution:0 "New Constitution"
 LIB_new_constitution_desc:0 "" #TODO
 LIB_liberity_forces:0 "Liberty Forces"
 LIB_liberity_forces_desc:0 "It is likely that there are opposing and hostile groups within our army who may betray us at any moment. Establishing a completely loyal military group will strengthen our power."
 LIB_liberty_will:0 "Desire for Liberty"
 LIB_liberty_will_desc:0 "Freedom is in our blood. Our ancestors were free, and we will be free too. It is better to die than to become slaves to another country."
 LIB_agreement_of_expand_the_plantation:0 "Expand the Plantation"
 LIB_agreement_of_expand_the_plantation_desc:0 "Firestone company has provided great services for us, expanding their lands will increase their opportunities, which will also increase the money in our pockets."
 LIB_militarisation:0 "Expand the Arms Factories"
 LIB_militarisation_desc:0 "The blow struck against the Masonic lodge and our country's shift towards a more nationalist stance will not sit well with our neighboring countries. We need to strengthen our army by investing in military factories"
 LIB_reorganise_the_government:0 "Reorganize the Government"
 LIB_reorganise_the_government_desc:0 "Since the previous government resigned, the Charles DB King Government has been unable to overcome the crisis, but now everything is ready. With one final adjustment to our government, absolute stability will be ensured"
 LIB_agreement_of_firestone:0 "Collaborate with Firestone"
 LIB_agreement_of_firestone_desc:0 "Building on the relationship we have developed with Firestone will provide us with more credits and more rubber. This will give us a chance to reclaim the reputation as the number one Rubber Producer that Malaya stole from us."
 LIB_pan_africanism:0 "Pan-Africanism"
 LIB_pan_africanism_desc:0 "In 1900, at the Pan-African Congress, we decided that all Africans will come under one shield."
 LIB_eagle_of_west_africa:0 "Eagle of the Africa"
 LIB_eagle_of_west_africa_desc:0 "What the pak is a kilometer?!"
 LIB_king_of_nation:0 "King of the Nation"
 LIB_king_of_nation_desc:0 "King of the nation, it might be a little difficult to understand what that means for Charles, but don't get me wrong, he's not really a king, it's just a title"
 #OMG
 LIB_assistance_from_american_freemasons:0 "Assistance from American Freemasons"
 LIB_assistance_from_american_freemasons_desc:0 "" #TODO
 LIB_brainwashing:0 "Brainwashing"
 LIB_brainwashing_desc:0 "" #TODO
 #COMMUNIST
 LIB_crisis_of_the_black_sunday:0 "Crisis of the Black Sunday"
 LIB_crisis_of_the_black_sunday_desc:0 "Normally we had an agreement with the unions that we would work 6 days a week, not 7. At least on Sunday people would have time to make their petitions to God. But when we had to take it back because of difficult circumstances, people started to get angry."
 LIB_sounds_of_the_revolition:0 "Sounds of the Revolution"
 LIB_sounds_of_the_revolition_desc:0 "In opposition to our demand to work on Sunday, unions started work stoppages and almost all workers stopped work. in some parts of the country unions are organizing rallies and supposedly seeking their rights some rumors say that unions are forming paramilitary groups. Could all this be the footsteps of a revolution?"
 LIB_student_activits:0 "Student Movement"
 LIB_student_activits_desc:0 "The radical actions of the unions have taken control not only of our workers but also of students and students are protesting in the streets across the country. socialist revolution is just a matter of time if we don't do something"
 LIB_raid_settlers:0 "Raid Settlers"
 LIB_raid_settlers_desc:0 "Why should our people starve while rich American settlers buy cheap land in our country and live like kings? raiding the homes of these settlers and distributing their assets to our people will advance the Revolution"
 LIB_revolision:0 "[GetMonth] Revolution"
 LIB_revolision_desc:0 "Workers and students are the foundation of a country and we have their support. support for our revolution has grown exponentially thanks to the distribution of the assets of the colonial American settlers to our people, and the government no longer has a chance to stand against this pressure. Long live Lenin Long live the revolution"
 LIB_help_to_spain:0 "African International Brigade"
 LIB_help_to_spain_desc:0 "We have completed and stabilized our own revolution, but the war of our freedom-loving brothers and sisters in Spain is still not over. With our support, our Spanish brothers and sisters will be able to throw the oppressive fascists and royalists out of their country and gain their freedom"
 LIB_west_africa_in_flames:0 "Africa in Flames"
 LIB_west_africa_in_flames_desc:0 "We may have won our freedom, but even right next to us, our African brothers and sisters are working as slaves in inhuman conditions. If we continue to ignore this, how are we different from those imperialists?"
 LIB_ignite_the_flame:0 "Ignite the Flames"
 LIB_ignite_the_flame_desc:0 "Now that our revolution is fully stabilized, we can support our African brothers and sisters in their freedom. With weapons, manpower and courage, we will not stop until all of Africa achieves independence."
 LIB_peoples_commissariat:0 "Peoples' Commissariat"
 LIB_peoples_commissariat_desc:0 "Another necessary part for the completion of our revolution will be the creation of a people's commissariat so that we can have absolute control in our country and identify and destroy everything that is anti-revolutionary"
 LIB_com_wargoal:0 "Anti-Imperialist Campaign"
 LIB_com_wargoal_desc:0 "How can we sleep well when our African brothers and sisters are tortured and enslaved every day? Do we have the right to call ourselves defenders of freedom until all of Africa is free?"
 LIB_liberate_africans:0 "Liberate our African Brothers and Sisters"
 LIB_liberate_africans_desc:0 "We must integrate our brothers and sisters from the liberated African lands into our own country and continue our cause with the strength we receive from them"
 LIB_fight_against_imperialism:0 "Fight Against Imperialism"
 LIB_fight_against_imperialism_desc:0 "We will not tolerate any imperialist power in Africa. Unless they get out of Africa, they will tremble in fear of us every day"
 LIB_professionalisation_of_guardians:0 "Professionalization of the Guardians"
 LIB_professionalisation_of_guardians_desc:0 "The guards of the African revolution have done a good job so far, but they are not professional and this creates problems in battles If we train our guards in the best way, we will be able to fend off the imperialist dogs more easily"
 LIB_spears_to_rifles:0 "From Spears to Rifles"
 LIB_spears_to_rifles_desc:0 "Even if we do well with the spears we have, we don't stand a chance against long-range rifles as soon as possible to equip our army with rifles and strengthen the power of the Revolutionary Guard"
 LIB_guardians_of_the_proleteria:0 "Guardians of the Proletariat"
 LIB_guardians_of_the_proleteria_desc:0 "Even though our revolution has taken place, all our efforts will be in vain if we cannot protect it. We cannot allow the future of our workers and children to be destroyed, we need everyone who will sacrifice their lives for the revolution"
 LIB_pep_akea_leta:0 "Pep Ak Leta"
 LIB_pep_akea_leta_desc:0 "Our revolution was made by the people and it is our duty to do what the people want, but the people must sacrifice something of themselves for us. If both sides understand each other, only then can our utopia become a reality"
 LIB_sydindacalist_reform:0 "De-Centralization Reform"
 LIB_sydindacalist_reform_desc:0 "We have seen what a centralized system has done to our country. We will not make this mistake. Allowing each production facility to adjust what is most suitable for itself is the right thing to do, even if it creates some problems."
 LIB_guarentee_the_utiopa:0 "Guarentee the Utopia"
 LIB_guarentee_the_utiopa_desc:0 "We are getting closer to our utopia moment by moment, but we are still not strong enough to protect it. We need to stabilize our country and reach the power to protect it."
 LIB_expand_women_rights:0 "Expand Women's Rights"
 LIB_expand_women_rights:0 "In a country of equality and fraternity, it is unacceptable that women cannot have equal rights with men Everyone, regardless of gender, is equal and has equal conditions"
 LIB_dismiss_the_american_company:0 "Dismiss the American Company"
 LIB_dismiss_the_american_company_desc:0 "How logical is it that imperialist American companies are still colonizing our country and exploiting the resources of our people? We must get rid of this company as soon as possible and let the unions take control."
 LIB_labour_act:0 "Labor Act"
 LIB_labour_act_desc:0 "It is our duty to ensure that workers, who are the foundation of our revolution, work in the best conditions. With the passage of the labor law, we will be one step closer to the realization of our utopia"
 LIB_syndacalist_manifesto:0 "Syndicalist Manifesto"
 LIB_syndacalist_manifesto_desc:0 "Every worker should work under conditions that respect human dignity and labor, trade unions should be organized to protect the rights of workers to the fullest, and every worker should have a contribution to the governance of the country."
 #SOCIALDEMOKRAT
 LIB_hold_dearly_election:0 "Preparation for an Early Election"
 LIB_hold_dearly_election_desc:0 "It would be best for the whole country if the recent events are resolved through democracy and not bloodshed we should go to early elections and decide who the people will elect"
 LIB_Disclosure:0 "Disclosure for Barclay"
 LIB_Disclosure_desc:0 "In a country founded on the foundations of freedom, it is unacceptable that the Barclay administration secretly perpetuates slavery"
 LIB_United_Tribes:0 "Work with the Tribes"
 LIB_United_Tribes_desc:0 "To win the elections we need to play every card in our hand, no matter how much the tribes hate the republic, a little money will win their support"
 LIB_parade_in_capital:0 "Parade in the Capital"
 LIB_parade_in_capital_desc:0 "Having a parade in the capital that will be heard throughout the country on the scandals of the barclay and our deals with the tribes will ensure that we win the elections"
 LIB_Victory_of_United_People_Party:0 "Victory of the People's Party"
 LIB_Victory_of_United_People_Party_desc:0 "People's Party has finally won the elections. It was unreasonable for someone who disregarded the rights of our workers and advocated for servitude to govern the land of freedom. Now, we are ready to become a country where everyone can live happily"
 LIB_dissolve_hut_tax:0 "Dissolve the Hut Tax"
 LIB_dissolve_hut_tax_desc:0 "Why are we taxing housing, which is a fundamental need for every person? Abolishing this tax will enhance the well-being of our people."
 LIB_autonomy_of_tribals:0 "Tribal Autonomy"
 LIB_autonomy_of_tribals_desc:0 "We are aware of the importance of the tribes' support in this election. even though they do not support the republic, they have chosen to support us for the good of their country and they deserve some concessions in return"
 LIB_Guardians_of_the_liberia:0 "Guardians of Steel"
 LIB_Guardians_of_the_liberia_desc:0 "Faulkner's great sacrifice won us this election and William Tubman became our new president, but it would be a shame to leave Faulkner's decision unrequited"
 LIB_National_Bank_of_Liberia:0 "National Bank of Liberia"
 LIB_National_Bank_of_Liberia_desc:0 "Why should the banking system of our country be under the control of foreign states? Why should our people have to leave their assets at the mercy of foreign states? Establishing our country's own national bank will both increase the welfare of our people and strengthen our economy."
 LIB_ekspe_balans:0 "Ekspe Balans"
 LIB_ekspe_balans_desc:0 "we need to declare neutrality if we want to increase the welfare of our people. We can focus all our power on our people by removing radical ideologies like fascism and communism from our country and declaring diplomatic neutrality"
 LIB_Skilled_labor_projekt:0 "Qualified Labor Program"
 LIB_Skilled_labor_projekt_desc:0 "Since our country has a small population, we need to use the labor force we have in the most qualified way, we can make the best use of what we have by opening courses for our workers and providing trainings to increase their productivity."
 LIB_new_republic:0 "New Face of Liberia"
 LIB_new_republic_desc:0 "There is no longer a poor and backward Liberia. there is now a Liberia where science and technology are constantly advancing, where the level of prosperity is high and workers are doing their work in peace"
 LIB_Kicking_Firestone_out:0 "Kick Firestone Out"
 LIB_Kicking_Firestone_out_desc:0 "The Firestone company has served our country well so far, but it does not comply with our country's labor laws and does not listen to our demands. Unfortunately, this company must cease to exist in our country."
 LIB_land_reform:0 "Land Reform"
 LIB_land_reform_desc:0 "Now that Firestone is out of our country, we can offer their land to the people and improve the welfare of our people."
 LIB_national_companies:0 "National Companies"
 LIB_national_companies_desc:0 "Even though Firestone has left our country, we are having problems because there is no company to replace it. With some government support, we can replace them by establishing national companies."
 #MONARCHIST
 LIB_Great_awakening:0 "The Great Awakening"
 LIB_Great_awakening_desc:0 "It was clear that William Tubman and his henchmen were men brought in to make it feel like something had changed. So we get rid of them once and for all."
 LIB_glory_to_king:0 "Glory to the King"
 LIB_glory_to_king_desc:0 ""
 LIB_african_revanchism:0 "African Revanchism"
 LIB_african_revanchism_desc:0 ""
 LIB_claim_all_africa:0 "Claim All Africa"
 LIB_claim_all_africa_desc:0 ""
 LIB_empire_of_mande:0 "Empire of Mande"
 LIB_empire_of_mande_desc:0 ""
 LIB_approach_germany:0 "Approach Germany"
 LIB_approach_germany_desc:0 ""
 LIB_join_axis:0 "Join the Axis"
 LIB_join_axis_desc:0 ""
 LIB_german_eq:0 "German Equipment"
 LIB_german_eq_desc:0 "Liberia has signed an agreement to purchase large quantities of arms from Germany. This is an important development that could significantly change the balance of power in the region. Although the exact scope of the deal is not known, it is estimated that Liberia is purchasing fighter planes, tanks and other weapons."
 LIB_german_specialisation:0 "German Specialization"
 LIB_german_specialisation_desc:0 "With German generals coming to the country, we have the chance to further professionalize the fighters we have. If there is a Liberian discipline, if not a Prussian discipline, this will make the battles easier for us."
 LIB_adapt_vai_script:0 "Adapt Vai Script"
 LIB_adapt_vai_script_desc:0 "While the Latin alphabet is simple, the Vai alphabet is an ancient form of writing that comes from our ancestors."
 LIB_tribal_support:0 "Gain Tribal Support"
 LIB_tribal_support_desc:0 "We need to ask for financial support as well, even if the tribes support us wholeheartedly."
 LIB_tribal_warriors:0 "Professionalisation of Tribal Warriors"
 LIB_tribal_warriors_desc:0 "As brave as tribal warriors are, it is no longer enough to be brave and strong, you also need to be smart."
 LIB_deal_with_other_tribes:0 "Deal with Other Tribes"
 LIB_deal_with_other_tribes_desc:0 "We made a deal with our own tribes, but even then we don't have enough warriors. We need to call in other tribes."
 #ARMY
 LIB_New_National_Defense_Law:0 "New National Defence Law"
 LIB_New_National_Defense_Law_desc:0 "The new National Defense Act calls for significant investments to modernize and expand the Liberian Armed Forces. This will make the military a more formidable deterrent against the geopolitical threats facing the country."
 LIB_aristocrat_officers:0 "Aristocratic Officers"
 LIB_aristocrat_officers_desc:0 "Since Liberia's founding, the aristocratic classes have played an important role in the military. This tradition was reinforced by the fact that the country's first president, Joseph Jenkins Roberts, was also an aristocrat. Aristocratic officers have been respected in the military for their leadership qualities, education and family connections."
 LIB_standartisation:0 "Standardization Program"
 LIB_standartisation_desc:0 "Setting standards for weapon parts and ammunition and modernizing production processes will increase efficiency in the arms industry."
 LIB_enter_jungles_with_trucks:0 "Enter Jungles with Trucks"
 LIB_enter_jungles_with_trucks_desc:0 "Modern wars require armies to be able to quickly adapt to changing situations on the ground and effectively maneuver on different fronts. In this context, the "Trucks into the Jungle" project will provide the Liberian army with an important strategic advantage.\n\nThe trucks will enable the army to quickly and easily transport heavy weapons, ammunition and personnel, significantly increasing its logistics capabilities. This will allow the army to deploy more quickly on different fronts and conduct operations more effectively.\n\nIn addition, trucks will provide the army with a wider range of movement, allowing access to areas behind enemy lines. "
 LIB_innovative_education:0 "Innovative Officer Training"
 LIB_innovative_education_desc:0 "In the past, officer training in the Liberian Army was based on a traditional approach that focused on discipline and obedience. While this approach was effective in equipping officers with basic military skills, it fell short of developing the leadership, strategy and problem-solving skills needed in a modern army. "
 LIB_emergency_militarisation:0 "Emergency Militarization"
 LIB_emergency_militarisation_desc:0 "For the military, emergency militarization is critical to ensuring the security and defense of the country. This program is an opportunity to build the capabilities and capacity of the military and give it the tools necessary to protect Liberia against internal and external threats. The military is committed to implementing this program responsibly and to best serve the Liberian people."
 LIB_traditional_education:0 "Traditional Officer Training"
 LIB_traditional_education_desc:0 "The curriculum of the traditional officer training program is adapted from the curricula of the French and American military academies. The curriculum of the program will be developed over time to meet the specific needs of Liberia."
 LIB_tribal_officers:0 "Tribal Officers"
 LIB_tribal_officers_desc:0 "As part of the Liberian Army's modernization process, tribal officers should also receive modern military training. Through this training, tribal officers will learn about modern warfare tactics and strategies."
 LIB_frontier_recons:0 "Reconnaissance Divisions"
 LIB_frontier_recons_desc:0 "The reconnaissance companies were made up of elite soldiers trained to operate and survive in the harshest conditions. They were trained in advanced tracking techniques, the use of weapons and explosives, communications and first aid. Reconnaissance companies were also trained in stealth and deception tactics to infiltrate enemy lines and gather information."
 LIB_tribal_forces:0 "Special Tribal Forces"
 LIB_tribal_forces_desc:0 "The Tribal Special Forces training program was an intensive program that challenged soldiers both physically and mentally. The program aimed to teach candidates advanced combat skills, weapon handling skills, intelligence gathering skills and survival skills. The training program also aimed to instill values such as leadership, discipline and patriotism.\n\nThe Liberian Army is equipped with the most modern weapons and equipment. This allows the soldiers to effectively carry out their missions even in the most challenging combat environments. "
 LIB_new_weapons:0 "New Weapons"
 LIB_new_weapons_desc:0 "New weapons will continue to be an important part of the Liberian Army's inventory. The Liberian government is committed to making the necessary investments to ensure that the military continues to be equipped with modern weapons. This will ensure that Liberia's national security remains at the highest level of protection."
 LIB_National_Supply_forces:0 "National Supply Forces"
 LIB_National_Supply_forces_desc:0 "In Congo, a union for procurement has been set up. We need such a union too, but not as cruelly as they do. It's not easy to carry a gun in the jungles of Liberia."
 LIB_found_cannons:0 "Use New Cannons"
 LIB_found_cannons_desc:0 "Liberia's relations with its neighbors have not always been calm. It is therefore important for Liberia to have a strong military and be prepared for potential attacks. New artillery purchases can help strengthen Liberia's defense capacity and contribute to regional stability."
 LIB_Barclay_Military_Academy:0 "[GetLIBArmyAcamedyName]"
 LIB_Barclay_Military_Academy_desc:0 "Military Academy is equipped with modern facilities and technologies to offer its cadets the best educational experience. Classrooms, laboratories and gyms are equipped with the latest equipment. Students graduating from Barclay Military Academy are ready for university or direct entry into the workforce. With strong academic foundations, leadership skills and a sense of patriotism, they are young people ready to shape Liberia's future."

 LIB_COMU_ACADEMY:0 "Military-Political Academy of Liberia"
 LIB_CHARIS_ACADEMY:0 "James Roye Military Academy"
 LIB_KINGS_ACADEMY:0 "Royal Military Academy of Liberia"
 LIB_REPUBLICAN_ACADEMY:0 "Thomas Faulkner Military Academy"
 LIB_BARCLAY_ACADEMY:0 "Edwin Barclay Training Center"
 #NAVY
 LIB_Liberian_National_Coast_Guard:0 "Establish Liberian National Coast Guard"
 LIB_Liberian_National_Coast_Guard_desc:0 "Even though we have a long coastline, we don't have a navy that can protect it, but that doesn't mean we won't in the future."
 LIB_Dominance_the_sea:0 "Dominate the Blue Water"
 LIB_Dominance_the_sea_desc:0 "We cannot build grandiose warships with our already weak economy, but we can invest in less grandiose submarines and thus become a feared power in the deep seas"
 LIB_Guard_the_coasts:0 "Guard the Coasts"
 LIB_Guard_the_coasts_desc:0 "If we are to build a navy, we cannot expand on the high seas We can't budget for things like maintaining the navy. But we can build coast guard ships to protect our coastline. and that will be more effective"
 LIB_submarine_effort:0 "Submarine Effort"
 LIB_submarine_effort_desc:0 "If we want to be the feared dream of the deep sea, we need to develop our submarine technologies quieter, deadlier, scarier submarines will make us rulers of the seas"
 LIB_naval_effort:0 "Naval Effort"
 LIB_naval_effort_desc:0 "Whether it's coast guard or deep sea hunters, if we can't build them, there is no point. we urgently need to increase the number of dockyards"
 LIB_Escort_Protection:0 "Escort Protection"
 LIB_Escort_Protection_desc:0 "If we are going to defend our coasts, we must also defend the convoys passing through our coasts. If the enemy navy destroys these convoys, our already weak economy could collapse. Even worse, we might not be able to replace the lost convoys with new ones."
 LIB_submarine_effort_2:0 "Submarine Effort II"
 LIB_submarine_effort_2_desc:0 "Most quieter, most deadlier, most scarier submarines will make us rulers of the seas"
 LIB_destroyer_effort:0 "Destroyer Effort"
 LIB_destroyer_effort_desc:0 "Destroyer ships can both protect our convoys and conduct raids on enemy convoys. They are perfectly suited to our doctrine"
 LIB_Doctrinisation:0 "Doctrinisation"
 LIB_Doctrinisation_desc:0 "If we want to protect our shores, we need to teach our ship crews how to do it. If they don't learn how to find enemy submarines and protect convoys, they will be useless to us."
 LIB_finalize_the_fleet:0 "Finalize the Fleet"
 LIB_finalize_the_fleet_desc:0 "Our navy is finally ready for duty. Thousands of young men stand ready to protect our country from any threat that may come from the seas, prepared to sacrifice their lives. Our glorius ships shine on the sea like the sun. Finally, our navy has become a wall that the people of Liberia can rely on"
 LIB_Budget_transfer_naval:0 "Budget Transfer"
 LIB_Budget_transfer_naval_desc:0 "Yes, we may want to make our navy the master of the seas, but if we neglect our air force, our navy could be devastated in a major air attack, rendering all our efforts futile. We need to allocate a portion of our budget to strengthen our air force."
 #AIR
 LIB_air_force:0 "Establish Liberian National Air Force"
 LIB_air_force_desc:0 "Modern wars are no longer fought only at sea and on land; they also take place in the air, affecting other regions as well. If we do not establish our air force, our ground forces could be destroyed without even knowing what is attacking them"
 LIB_integrate_aircrafts:0 "Integrate the Aircraft"
 LIB_integrate_aircrafts_desc:0 "Even if we want to establish our air force, our domestic industry is not sufficient for this. Integrating aircraft purchased from foreign countries into our own country is the first step in forming our own air force."
 LIB_Air_Innovations:0 "Air Innovations"
 LIB_Air_Innovations_desc:0 "It hasn't even been half a century since the first plane took to the skies, and the point aviation has reached is incredible. We need to closely follow aviation innovations so that our air forces can have state-of-the-art technologies in every field"
 LIB_create_our_designs:0 "Create Our Designs"
 LIB_create_our_designs_desc:0 "Yes, our air force may currently be strong thanks to aircraft from foreign countries, but how much can we really rely on these planes? Developing our own aircraft is always the better and more sensible option."
 LIB_justice_air_wing:0 "Liberian Air Wings"
 LIB_justice_air_wing_desc:0 "Since our personnel are trained, our aircraft are sufficient, and our spirits are free, we can now officially declare our air force."
 LIB_solve_range_problem:0 "Solve the Range Problem"
 LIB_solve_range_problem_desc:0 "No matter how much effort we put in, we cannot solve the range and cost problems of our aircraft, which is a serious issue that could even lead to the demise of our air force. Perhaps by reallocating the entire budget allocated to the navy to our air force, we can focus on finding solutions to these problems."
 LIB_budget_transfer_air:0 "Budget Transfer"
 LIB_budget_transfer_air_desc:0 "Yes, we may want our air force to dominate the skies, but if we cannot protect our extensive coastline, our air force will lose its significance."
#^W^END^W^#