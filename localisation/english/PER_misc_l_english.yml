 #HISTORY
 PER_GATHERING_STORM_DESC:0 "In 1919, Reza, who had chosen the surname Pahlavi, declared himself the Shah of Iran in 1925 with the power he had seized. In fact, his ideas were very different. Like Mustafa Kemal Ataturk, he could have declared himself President and saved his country from the hands of the clergy. But the representatives of the United Kingdom came to him with a very different proposal, Why shouldn't he be the new Shah? Under pressure from the clergy, he took the crown and began to carry on his revolutions under the title of Shah."
 
