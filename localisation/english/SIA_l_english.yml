 SIA_building_program:0 "Building Program"
 SIA_building_program_desc:0 "In 1936, the Kingdom of Siam is implementing a new and comprehensive construction program nationwide. This program is designed to accelerate economic development and modernize the country's infrastructure. Under this program, new roads, bridges, school buildings, and hospitals will be constructed. Additionally, the renovation and improvement of existing structures are also planned. \n\nThe government plans to fund this massive project through various sources. Incentives will be offered to attract both domestic and foreign investors. In this context, workforce training and enhancing technical capacity play a crucial role. By creating new job opportunities, the aim is to reduce the unemployment rate."
