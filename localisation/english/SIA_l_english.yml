 #SIAM EVENTS
 SIA.1.A:0 "Welcome Our Friend"
 SIA.1.d:0 "In 1936, diplomatic relations between the Kingdom of Siam and the Empire of Japan gained momentum. During this period, both countries were reshaping the dynamics of the political and economic landscape in Asia. The Empire of Japan, consolidating its position as a regional power with increasing influence, sought to expand its reach in Asia. Meanwhile, the Kingdom of Siam was developing various foreign policy strategies to maintain and strengthen its independence.\n\n At the time, Siam was keen on finding new alliances to counterbalance Western colonial ambitions and reinforce its regional independence. Japan, on the other hand, was eager to gain allies that would support its imperial aspirations in Asia and limit Western influence in the region. Japan, having accumulated significant technological and military expertise during its industrialization process, aimed to share these advancements with regional allies to consolidate their power."
 SIA.1.B:0 "Refuse"
 
 SIA.2.t:0 "[From.GetNameDefCap] Wants to Join Sino-German Cooperation."
 SIA.2.A:0 "It Might Be Useful"
 SIA.2.B:0 "Refuse the Request"
 SIA.2.d:0 "There were movements in the Bangkok-Berlin Consulate earlier today. The Kingdom of Thailand, which has recently determined its political policy in Asia as pro-Chinese, wants to be included in the Sino-German Agreement."
 SIA.3.d:0 "Siam Government asks for economic aid despite the increasing danger of Japan Empire since Emperor Hirohito came to power in 1926.In return, there will be no aggressive attitude towards the British colonies in Central Asia and Asia in the future.In our opinion, this is a very reasonable agreement, we await your reply."
 SIA.3.A:0 "Worth Deal,Acceptable"
 SIA.3.B:0 "Refuse"
  
 SIA.9.t:0 "[FROM.GetName] demands Indochina !"
 SIA.9.desc:0 "Nowadays, tensions between the Kingdom of Siam and the French-controlled territories of Indochina culminated in Siam issuing an ultimatum. At the time, the Kingdom of Siam was actively pursuing independence and sovereignty in Asia, while France's colonial control over Indochina was sparking a series of disputes. These conflicts often stemmed from frequent violations in border regions and trade routes involving Siam and Indochina.\n\n The Siamese government had long been troubled by the increasing French military presence in Indochina. France’s military activities were perceived as a significant threat to Siam's national security and commercial interests. In this context, the Siamese government, under the leadership of the King, decided to take action to protect its territorial integrity and interests. Siam issued an ultimatum to Indochina, outlining a series of demands aimed at curbing French influence and activities in the region."
 
 SIA.10.t:0 "[FROM.GetName] demands [333.GetName]"
 SIA.10.desc:0 "Nowadays, the Kingdom of Siam issued an ultimatum to the British-controlled North Borneo. This move was influenced by the shifting power dynamics in Asia and Siams growing regional influence. At the time, Siam was keen on protecting its national interests and counterbalancing the influence of Western colonial powers in Asia. The British presence in North Borneo was seen as a strategic and economic threat to Siam.\n\n The ultimatum demanded that the British reduce their military presence in North Borneo and respect trade agreements made with Siam. Additionally, Siam called for the rights of Siamese merchants and citizens to engage in free trade and travel within North Borneo. Siam warned that failure to meet these demands would result in harsher measures against British interests in the region."
 
 SIA.11.t:0 "Operation Hummingbird Preview."
 SIA.11.desc:0 "Night of the Long Knives, in German history, purge of Nazi leaders by Adolf Hitler on June 30, 1934. Fearing that the paramilitary SA had become too powerful, Hitler ordered his elite SS guards to murder the organization's leaders,including Ernst Röhm."
 
 SIA.12.t:0 "State Decrees.."
 SIA.12.d:0 "The cultural mandates or state decrees were a series of twelve edicts issued between 1939 and 1942 by the government of Field Marshal Plaek Pibulsonggram during his first term as prime minister and military dictator of Thailand.\n\n The mandates aimed to create a uniform and civilized Thai culture at the time when the country was allied with the Axis powers. Many of the practices initiated in the mandates were a result of Thailand entering World War II, and remain in effect."
 
 SIA.13.d:0 "The Thai National Anthem is the title of Thailand's national anthem, which was adopted in its current form on 10 December 1939. It replaced Sansoen Phra Barami in 1932, which remains as the royal anthem of Thailand.\n\n The melody was composed by Phra Chenduriyang (Peter Feit), and the words were made by Luang Saranupraphan. Phleng chāt literally meaning national anthem, is a general term for a national anthem. The term is also used to refer to this specific song."
 
 SIA.14.t:0 "[FROM.GetName] wants Non-Agression Pack.."
 SIA.14.desc:0 "Nowadays, the Kingdom of Siam sent a telegram to China and the Empire of Japan proposing a non-aggression pact. This diplomatic initiative aimed to enhance regional security and prevent potential conflicts amidst rising tensions and shifting power dynamics in Asia.\n\n In the telegram, Siam proposed a treaty committing China and Japan to mutual non-aggression. Siam emphasized that such an agreement would help maintain regional stability and lay the foundation for peaceful cooperation in Asia. Siam highlighted that the participation of both nations in the pact would strengthen mutual trust and reduce military threats in the region."
 
 SIA.16.t:0 "Siamese King In Switzerland Rama VII."
 SIA.16.d:0 "Siam King Rama VII (Ananda Mahidol) was living in Switzerland for education and various reasons. But the interest in the king in his country increased, the people call the king back to his country."
 
 SIA.17.t:0 "[FROM.GetName] Wants to Buy Hong-Kong."
 SIA.17.desc:0 "Nowadays, the Kingdom of Siam issued an ultimatum to the British-controlled Hong Kong. This diplomatic move was part of Siam's efforts to increase its influence in the region and resist British colonial presence.\n\n At the time, Siam aimed to shift the balance of power in Asia in its favor and protect its national interests. The ultimatum demanded that the British administration in Hong Kong lift restrictions on Siamese traders and ensure free trade. Additionally, it called for Siamese citizens to be allowed to conduct business and use trade routes freely in Hong Kong. Siam explicitly stated that failure to meet these demands would result in harsher measures against British interests in Hong Kong."
 
 SIA.18.t:0 "USA-Thai Trade Agreement."
 SIA.18.d:0 "In the 1940s, the Kingdom of Siam signed a comprehensive trade agreement with the United States. This move was seen as a reflection of the economic and political changes brought about by World War II globally. The agreement aimed to deepen trade and economic relations between the two countries, supporting Siam's independence and economic development on the international stage.\n\n The signing of the agreement held significant strategic importance for Siam. The U.S., looking to expand its influence in the Asia-Pacific region in the post-war period, provided an opportunity for Siam to accelerate its modernization process by leveraging this powerful economy. The agreement included provisions for Siam to export raw materials and import machinery and technology from the U.S., aiming to enhance its industrial capacity and speed up economic development."
  
 SIA.29.t:0 "[FROM.GetAdjective] Proposal for the Integration of [741.GetName] and [670.GetName]"
 SIA.29.desc:0 "Nowadays, the Kingdom of Siam issued an ultimatum to the territories of Cambodia and Laos. This step was part of Siam's efforts to increase its influence and expand its borders in the region. At that time, Cambodia and Laos were under French colonial rule, and Siam desired to bring these territories under its own sovereignty.\n\n In the ultimatum, the Siamese government recognized the right of the people living in Cambodia and Laos borders to determine their own destiny and demanded that these territories accept Siamese sovereignty. Additionally, Siam emphasized that the French administration should not oppress the people of Cambodia and Laos. The ultimatum made it clear that Siam would take military measures if necessary to protect its rights in the region."
 
 SIA.30.t:0 "Proposal Accepted, Glorious Day.."
 SIA.30.desc:0 "Following a series of diplomatic negotiations in nowadays, which resulted in Cambodia and Laos accepting Siam's demands, Siam's sovereignty expanded to these territories. This development was regarded as a significant success in Siam's efforts to increase its influence in the region. The incorporation of Cambodia and Laos into Siam altered the political and economic balances in the region.\n\n Siam's expansionist move drew the attention of other powers in the region and influenced the political atmosphere in Asia. There was anticipation regarding how France would respond to this situation. However, ultimately, the incorporation of Cambodia and Laos into Siam reshaped the political dynamics in the region and further strengthened Siam as a significant power in Asia." 

 SIA.31.t:0 "Proposal Refused, Bad News.."
 SIA.31.desc:0 "Nowadays, Siam's demands for Cambodia and Laos were rejected, and these territories remained under French colonial rule. This development indicated a setback in Siam's expansion efforts in the region. The rejection of Siam's sovereignty claims affected the political balances in the region and limited Siam's influence in these territories.\n\n The rejection of Siam's demands strained its relations with France and complicated the political atmosphere in Asia. Despite Siam's aim to increase its power by asserting sovereignty over Cambodia and Laos, it was unsuccessful against France's determined stance."
 
 SIA.32.t:0 "[From.GetNameDefCap] Wants American Support.."
 SIA.32.desc:0 "Nowadays, the Siamese Republic signed a comprehensive trade agreement with the United States. This move was seen as a reflection of the economic and political changes brought about by World War II globally. The agreement aimed to deepen trade and economic relations between the two countries, supporting Siam's independence and economic development on the international stage.\n\n The signing of the agreement held significant strategic importance for Siam. The U.S., looking to expand its influence in the Asia-Pacific region in the post-war period, provided an opportunity for Siam to accelerate its modernization process by leveraging this powerful economy. The agreement included provisions for Siam to export raw materials and import machinery and technology from the U.S., aiming to enhance its industrial capacity and speed up economic development."
 
 SIA.33.t:0 "Deal is Deal."
 SIA.33.desc:0 "Nowadays, the Siamese Republic signed a comprehensive trade agreement with the United States. This move was seen as a reflection of the economic and political changes brought about by World War II globally. The agreement aimed to deepen trade and economic relations between the two countries, supporting Siam's independence and economic development on the international stage.\n\n The signing of the agreement held significant strategic importance for Siam. The U.S., looking to expand its influence in the Asia-Pacific region in the post-war period, provided an opportunity for Siam to accelerate its modernization process by leveraging this powerful economy. The agreement included provisions for Siam to export raw materials and import machinery and technology from the U.S., aiming to enhance its industrial capacity and speed up economic development."
 
 SIA.34.t:0 "Deal Refused."
 SIA.34.desc:0 "In the 1940s, the Kingdom of Siam's proposal for a trade agreement with the United States was rejected. This development posed a hurdle for Siam in terms of international trade and economic relations.\n\n The rejection of the proposal by the United States prevented Siam from further economic openness and playing a wider role in international trade. Siam had hoped to accelerate its economic growth and modernization through a trade agreement with the United States. However, the rejection of this proposal by the United States hindered Siam's ability to achieve these goals and affected the trade dynamics in the region. This made it more difficult for Siam to integrate economically and open up further."
 
 SIA.35.t:0 "Indochina Meeting.."
 SIA.35.desc:0 "In those days, the Kingdom of Siam proposed the establishment of an international state in the territories of Indochina. This proposal had the potential to fundamentally alter the political and economic dynamics of the region. Siam advocated that this international state would create new opportunities for peace and cooperation, seeking the support of the international community.\n\n The proposed international state held significant economic potential. Siam envisioned leveraging Indochina's rich natural resources, agricultural production, and strategic trade routes to boost the regions economy. The economic policies of the new state would focus on modernizing the agricultural and trade sectors, developing industrial infrastructure, and attracting international investments."
 
 SIA.36.t:0 "Proposal Accepted, Glorious Day.."
 SIA.36.desc:0 "In those days, the proposal by the Kingdom of Siam to establish an international state in the territories of Indochina was accepted, leading to the historic formation of this new entity. Named the United Indochina State, this development not only altered the political dynamics of the region but also transformed its economic and social landscape. This new structure became a model of peace and cooperation, bringing together diverse nations and cultures."
 SIA.37.t:0 "Proposal Refused, Bad News.."
 SIA.37.desc:0 "In those days, the proposal by the Kingdom of Siam to establish an international state in the territories of Indochina was rejected. This decision had significant repercussions on the political, economic, and social dynamics of the region. The rejection led both Siam and other regional countries to reassess their foreign policies and strategic plans."
