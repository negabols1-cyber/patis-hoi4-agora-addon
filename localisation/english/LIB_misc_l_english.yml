 ##################################
 ######## STARTING IDEAS  #########
 ##################################
 ##################################
 LIB_history_of_segregation_dmod:0 "Multilingual Country"
 LIB_history_of_segregation_dmod_desc:0 "Liberia is a multilingual country with more than thirty languages spoken. Although English is the official language of the country, it is spoken by only 15% of Liberians. None of the language groups constitutes a clear majority. Liberia's languages can be divided into four language families, Mande languages, Krou languages, Mel languages and the distinct Gola language. Although there is not a huge difference between them, this has a major impact on the impact of our laws on the population and causes conflict between the local population and African Liberians from the United States."
 LIB_history_of_segregation_fake:0 "Multilingual Country"
 LIB_history_of_segregation_fake_desc:0 "Liberia is a multilingual country with more than thirty languages spoken. Although English is the official language of the country, it is spoken by only 15% of Liberians. None of the language groups constitutes a clear majority. Liberia's languages can be divided into four language families, Mande languages, Krou languages, Mel languages and the distinct Gola language. Although there is not a huge difference between them, this has a major impact on the impact of our laws on the population and causes conflict between the local population and African Liberians from the United States."
 LIB_deals:0 "Deals of Labours"
 LIB_deals_desc:0"After the 1927 election, Thomas Faulkner made allegations of forced labour and, even more horrific, slavery in Liberia. When the commission led by Cuthbert Christy proved this after the news spread, it was a big fiasco and the entire cabinet resigned, followed by an unwritten agreement between the governments that followed Edwin Barclay and the workers."

