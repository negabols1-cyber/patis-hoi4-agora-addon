 #LEADERS
 LIB_Edwin_Barclay:0 "Edwin Barclay"
 POLITICS_LIB_Edwin_Barclay_DESC:0 "Edwin Barclay's paternal grandparents moved from Barbados to Liberia with their children in 1865. They were among a minority of immigrants from the Caribbean but shared with the Americo-Liberians a culture with an English base, considerable mixed-race ancestry, and a shared history. Edwin's father, Ernest Barclay, and uncle, Arthur Barclay, became important politicians in Liberia. Edwin Barclay, a member of the True Whig Party which ruled at that time, served as secretary of state of Liberia in the government of Charles D. B. King from 1920 until 1930. He became President of Liberia in 1930 when President King and Vice President Allen Yancy resigned after being implicated by a League of Nations investigation as having profited from forced labor. He was elected in his own right for the first time in 1931."
 POLITICS_Varney_Massaquoi_DESC:0 "Massaquoi was born on 13 June 1905 in Cape Mount, Liberia. His father was Momolu Massaquoi (also known as Momolu IV), a Liberian king of the Gallinas kingdom prior to its dissolution by the British. Nathaniel studied at the College of West Africa before his father was assigned as consul general to Germany for 1922–1930. Massaquoi followed his family to Hamburg, where he lived and studied."

 LIB_William_Tubman:0 "William Tubman"
 POLITICS_LIB_William_Tubman_DESC:0 "William Vacanarat Shadrach Tubman was born on November 29, 1895 in Harper, Maryland County, Liberia. His father was a Methodist preacher who became a general in the Liberian army and Speaker of the House of Representatives. Tubman attended elementary school in Harper and high school at Harper County High School. He joined the army in 1910 at the age of 15 and served in various military operations until 1917. During this time he rose from private to lieutenant.\n\nTubman began studying law in 1917 and passed the bar exam in 1920. In 1923, she was elected to the Senate from Maryland County, the youngest senator in Liberian history. In 1930, Tubman was appointed President Edwin Barclay's minister of justice and secretary of state.In this role, he worked to increase Liberia's visibility and prestige internationally.\n\nIn 1931, Tubman became general secretary of the True Whig Party, leading to Barclay's re-election. In 1935, she opposed Barclay's nomination for a third term and left the party."

