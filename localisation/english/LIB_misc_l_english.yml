 LIB_army_idea:0 "Liberian Frontier Force"
 LIB_army_idea_desc:0 "The Liberian Frontier Force is a military unit established in Liberia in 1908. It was tasked with providing internal security, border control and defense of Liberia. It was established to protect Liberia's sovereignty and to deal with internal uprisings. Initially, the Liberian Frontier Force was composed of volunteers recruited from indigenous tribes in various parts of Liberia. Over time, however, it evolved into a more professional structure and became a regular army. It played an important role and represented Liberia's military power until 1936. During this period, it acted as an important actor against internal unrest and potential threats on the borders."
