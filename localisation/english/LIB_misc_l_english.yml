 LIB_GATHERING_STORM_DESC:0 "Liberia was founded by the resettlement of former African-American slaves by the United States. Even though African-American slaves celebrated their freedom, this was not the case for the natives. The Massaquoi Dynasty in the region was overthrown by the USA and English was declared the only official language, rejecting the languages of the indigenous tribes. After all this, with the Great Depression and the slave scandal with former president Charles DB King, Liberia is in a state of great instability."

