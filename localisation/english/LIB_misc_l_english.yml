 LIB_yavas_cigerimi_soktun_idea_desc:0 "Liberia is an extremely budget-strapped country, but even so, new spending could cause it a lot of trouble. We think we can handle these payments this time, but next time it would be better if we don't go to such high levels of expenditure. No one pities the fallen"
