l_english:
 AGORA_ADDON_DISBAND_FACTION:0 "§HDisband Faction§!\nDisbands the faction of the selected country. Only available if that country is the faction leader.\n\n"
 AGORA_ADDON_JOIN_FACTION:0 "§HJoin Faction§!\nOwner of the marked state joins the faction of the selected country. The selected country must be in a faction, and the marked state's owner must not be in one.\n\n"
 AGORA_ADDON_LEAVE_FACTION:0 "§HLeave Faction§!\nSelected country leaves its faction. Not available for the faction leader.\n\n"
