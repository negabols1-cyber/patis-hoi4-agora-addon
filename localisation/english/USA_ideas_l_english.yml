NATO_military_assistance:0 "NATO Joint Military Missions"
NATO_military_assistance_desc:0 "Our allies require more than just promises; they need steel, training, and leadership. Through these missions, we will deploy American advisors and equipment to modernize the armies of the Free World, turning them into formidable bulwarks against communism."
USA_incirlik_air_base:0 "Construct Incirlik Air Base"
USA_incirlik_air_base_desc:0 "We require a forward operating base capable of hosting strategic bombers within striking distance of the Baku oil fields and Soviet industry. We will construct a massive air facility near Adana, Turkey, serving as the unsinkable aircraft carrier of the Near East."
USA_mission_jammat:0 "Establish AMMAT"
USA_mission_jammat_desc:0 "The Turkish Army is large but lacks modern equipment and doctrine. By establishing the Joint American Military Mission for Aid to Turkey, we will modernize their command structure and fortify the Bosphorus."
USA_integrate_bundeswehr:0 "Rearm the Federal Republic"
USA_integrate_bundeswehr_desc:0 "The defense of Europe is impossible without German manpower. Despite the shadows of the past, we must integrate the Federal Republic into NATO. We will fund the creation of the 'Bundeswehr', equipping them with modern tanks to serve as the spearhead of CENTAG."
USA_setaf_mission:0 "Establish SETAF Mission"
USA_setaf_mission_desc:0 "The Gorizia Gap is the gateway to the Italian peninsula. The Southern European Task Force (SETAF) will establish a permanent American presence in Vicenza, fortifying the Alps and training the Italian Army to hold the line against any Yugoslav or Soviet incursion."
USA_ramstein_base:0 "Expand Ramstein Air Base"
USA_ramstein_base_desc:0 "NATO needs a central logistics hub in Europe. Expanding Ramstein into a major air and supply center will ensure that American reinforcements can be rapidly deployed to any sector of the German front."
