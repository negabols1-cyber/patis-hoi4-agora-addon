usa_nato_tech_sharing_name:0 "NATO Standardization Program"
usa_nato_tech_sharing_desc:0 "An alliance is only as strong as its supply lines. If a Dutch soldier cannot fire British ammunition from an American rifle, we are not a unified force, but a disjointed rabble. By establishing the NATO Standardization Program, we will harmonize our military specifications—from radio frequencies to tank treads—ensuring that our industries learn from one another and our armies fight as one."
