USA_war_production_board_ns:0 "War Production Board"
USA_war_production_board_ns_desc:0 "Created by Executive Order 9024, the WPB has been granted supreme authority to direct the nation's industrial energies toward the war effort. By prohibiting non-essential civilian production and implementing the Controlled Materials Plan, we have transformed American industry into the 'Arsenal of Democracy.' From this moment on, profit is secondary to production; Detroit no longer builds cars—it builds victory."
