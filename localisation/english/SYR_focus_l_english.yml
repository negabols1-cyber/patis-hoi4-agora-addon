# Decision categories
SYR_the_national_struggle: "The National Struggle"
SYR_the_national_struggle_desc: "Syria fights for its independence from France.\n\nNational Resistance: §Y[?SYR_resistance|0]§!/§Y100§!\n\nWhen National Resistance is full, we can force the independence crisis. A weakened France may let us go; a strong France will have to be fought."
SYR_the_french_levant: "The French Levant"
SYR_the_french_levant_desc: "Syria supports France with arms and men. Every contribution brings Syria closer to full self-government."

# Decisions
SYR_organize_a_general_strike: "Organise a General Strike"
SYR_organize_a_general_strike_desc: "Close the souks and stop the trams. Let the High Commissioner govern an empty city."
SYR_print_nationalist_newspapers: "Print Nationalist Newspapers"
SYR_print_nationalist_newspapers_desc: "Underground presses spread the call for independence."
SYR_smuggle_rifles_from_iraq: "Smuggle Rifles from Iraq"
SYR_smuggle_rifles_from_iraq_desc: "Caravans from Iraq carry rifles hidden under sacks of grain."
SYR_rally_the_mountain_clans: "Rally the Mountain Clans"
SYR_rally_the_mountain_clans_desc: "Messengers ride to the Druze and Alawite villages to call the clans to arms."
SYR_sabotage_the_mandate_railways: "Sabotage the Mandate Railways"
SYR_sabotage_the_mandate_railways_desc: "Cut the lines that carry French troops and supplies."
SYR_court_soviet_sympathy: "Court Soviet Sympathy"
SYR_court_soviet_sympathy_desc: "The communists promise Moscow's support for the national struggle."
SYR_court_axis_sympathy: "Court Axis Sympathy"
SYR_court_axis_sympathy_desc: "The nationalists look to Berlin and Rome, the enemies of France."
SYR_court_hashemite_sympathy: "Court Hashemite Sympathy"
SYR_court_hashemite_sympathy_desc: "Many still remember King Faisal. Baghdad would welcome a Hashemite throne in Damascus."
SYR_the_hour_has_come: "The Hour Has Come"
SYR_the_hour_has_come_desc: "The nation is ready once more. We will demand independence."
SYR_choose_the_new_leadership: "Choose the New Leadership"
SYR_choose_the_new_leadership_desc: "Syria is free. Its people must now decide who will lead them."
SYR_hold_damascus: "Outlast France"
SYR_hold_damascus_desc: "If the war still goes on when this mission ends, France will sign the peace and Syria will keep its land."
SYR_ship_arms_to_france: "Ship Arms to France"
SYR_ship_arms_to_france_desc: "Send rifles from Syrian factories to the French army."
SYR_raise_levantine_battalions: "Raise Levantine Battalions"
SYR_raise_levantine_battalions_desc: "Send fresh battalions of Syrian volunteers to fight for France."
SYR_open_the_local_mines: "Open the Local Mines"
SYR_open_the_local_mines_desc: "Open new tungsten and chromium mines in the hills around Damascus. Mines opened: §Y[?SYR_local_mines_opened|0]§!/§Y2§!"

# Events
syria.1.t: "The General Strike"
syria.1.d: "For fifty days the shops of Damascus, Aleppo and Homs have stayed shut. Protesters fill the streets and French troops guard the government buildings. The High Commissioner has offered to receive a National Bloc delegation in Paris if the strike ends. Some leaders want to accept; others say only a longer strike will win real concessions."
syria.1.a: "Negotiate with the High Commissioner."
syria.1.b: "Keep the souks shut."
syria.2.t: "The Sanjak of Alexandretta"
syria.2.d: "Turkey insists that the Sanjak of Alexandretta, with its Turkish-speaking minority, cannot remain part of Syria. Ankara presses Paris, and Paris is listening. We can fortify the Sanjak and make clear that Iskenderun is Syrian, or we can seek a quiet understanding with Turkey."
syria.2.a: "Iskenderun is Syrian."
syria.2.b: "Seek an understanding with Ankara."
syria.10.t: "Unrest in the Levant"
syria.10.d: "Strikes, riots and nationalist pamphlets are spreading through [FROM.GetNameDef]. The High Commissioner asks Paris how to respond. The Sûreté proposes a firm hand, the Foreign Ministry favours concessions, and the military would rather arrest the National Bloc leaders outright."
syria.10.a: "Send in the Sûreté."
syria.10.b: "Offer concessions."
syria.10.c: "Arrest the National Bloc leaders."
syria.11.t: "The Sûreté Moves In"
syria.11.d: "French police sweep through the old city, raiding print shops and breaking up meetings. The movement is shaken, but every arrest makes new nationalists."
syria.11.a: "They cannot arrest a nation."
syria.12.t: "France Offers Concessions"
syria.12.d: "The High Commissioner announces new posts for Syrians in the administration and an easing of censorship. Some say the movement has won a victory; others fear it has been bought off."
syria.12.a: "A small step, but a step."
syria.13.t: "The National Bloc Leaders Arrested"
syria.13.d: "French gendarmes have arrested the leaders of the National Bloc in a night raid. The moderates are in prison, and the radicals of the left and right are filling the gap."
syria.13.a: "Others will take their place."
syria.14.t: "Arms Cache Discovered"
syria.14.d: "French patrols have found one of our weapons caches hidden in the Ghouta. The rifles are lost, and several couriers are under arrest."
syria.14.a: "A setback."
syria.30.t: "Syria Demands Independence"
syria.30.d: "The National Bloc has declared that [FROM.GetNameDef] will no longer accept French rule. With our own position weakened, the cabinet must decide whether to let the Levant go peacefully or to hold it by force."
syria.30.a: "Let Syria go."
syria.30.b: "The Levant stays French."
syria.31.t: "The Hour of the Gun"
syria.31.d: "France will not let us go peacefully. The armed bands of the Ghouta, the Druze mountain and the Euphrates are ready to rise at a word. If we raise the flag of revolt now, we will face the French army. If we wait, the movement will lose momentum, but we may choose a better hour."
syria.31.a: "Raise the flag of revolt!"
syria.31.b: "Not yet."
syria.32.t: "France Lets Syria Go"
syria.32.d: "Paris has agreed to end the mandate. The French flag comes down over the Serail in Damascus, and crowds fill the streets. Syria is free."
syria.32.a: "Long live free Syria!"
syria.33.t: "Peace in the Levant"
syria.33.d: "Months into the Levant rising, the war with [FROM.GetNameDef] has no end in sight. It is costing lives and money that France can ill afford, and Paris has decided to recognise Syrian independence and bring the troops home."
syria.33.a: "Recognise Syrian independence."
syria.34.t: "France Recognises Our Independence"
syria.34.d: "France has agreed to end the war and recognise Syrian independence. The sacrifice of the revolution has not been in vain."
syria.34.a: "Victory!"
syria.40.t: "Who Leads Free Syria?"
syria.40.d: "Syria is free, but its future is not yet decided. The communists of Khalid Bakdash, the social nationalists of Antun Saadeh and the supporters of a Hashemite restoration each claim to speak for the nation, while the National Bloc defends the republic it built. Only one of them can lead."
syria.40.a: "The People's Front of Khalid Bakdash."
syria.40.b: "The Social Nationalists of Antun Saadeh."
syria.40.c: "A Hashemite king in Damascus."
syria.40.e: "The National Bloc keeps the republic."
syria.50.t: "Syria Asks for Lebanon"
syria.50.d: "The Syrian government asks that Lebanon be joined to the Dominion of the Levant. Beirut's Christian notables are alarmed, but a united Levant would be easier to govern and to defend."
syria.50.a: "Unite the Levant."
syria.50.b: "Lebanon stays separate."
syria.51.t: "Lebanon Joins Syria"
syria.51.d: "France has agreed to join Lebanon to Syria. For the first time since 1920, the Levant is united under one government."
syria.51.a: "The coast is ours again."
syria.52.t: "France Keeps Lebanon Separate"
syria.52.d: "Paris has refused to join Lebanon to Syria. Many Syrians feel that France still treats the Levant as its own to divide."
syria.52.a: "Disappointing."
syria.55.t: "Ratify Syrian Independence?"
syria.55.d: "[FROM.GetNameDef] has proved a loyal partner and now asks France to ratify full independence under the treaty, with an alliance to follow. Some in the cabinet fear that losing the Levant will weaken France; others argue a willing ally is worth more than an unwilling subject."
syria.55.a: "Ratify the treaty."
syria.55.b: "Shelve the treaty."
syria.56.t: "Independence Ratified"
syria.56.d: "France has ratified Syrian independence. Syria is a free nation, and it owes its freedom to patience and good faith."
syria.56.a: "A proud day."
syria.57.t: "France Shelves the Treaty"
syria.57.d: "After years of loyal partnership, Paris has shelved the treaty. The National Bloc has no choice but to turn to the National Struggle."
syria.57.a: "Then we will take what was promised."
syria.60.t: "France Has Fallen"
syria.60.d: "France has capitulated. Its government fights on from exile while a new government at Vichy makes peace with the victors. The High Commissioner in Beirut waits for orders that do not come. Syria must decide where it stands."
syria.60.a: "Stand with Free France."
syria.60.b: "Recognise the government at Vichy."
syria.60.c: "The mandate is over."
syria.80.t: "Syria Seeks to Join Us"
syria.80.d: "The Syrian People's Republic of Khalid Bakdash asks to join our alliance of workers' states."
syria.80.a: "Welcome our Syrian comrades."
syria.80.b: "Not now."
syria.81.t: "Syria Seeks Axis Patronage"
syria.81.d: "Antun Saadeh's Syria offers itself as an ally against Britain and France in the Levant."
syria.81.a: "Bring Syria into the fold."
syria.81.b: "The Levant is not our concern."
syria.82.t: "The Hashemite Entente"
syria.82.d: "King Zeid of Syria invites his nephew's kingdom to join a Hashemite entente of Damascus and Baghdad."
syria.82.a: "Join our Hashemite brothers."
syria.82.b: "Baghdad goes its own way."
syria.84.t: "Union with Syria?"
syria.84.d: "The King of Syria invites Lebanon to return to the Syrian crown, as it was under King Faisal in 1920. Refusing may mean war."
syria.84.a: "Accept the union."
syria.84.b: "Lebanon stays free."
syria.90.t: "[FROM.GetName] Accepts"
syria.90.d: "[FROM.GetNameDef] has accepted our proposal."
syria.90.a: "Excellent."
syria.91.t: "[FROM.GetName] Refuses"
syria.91.d: "[FROM.GetNameDef] has refused our proposal."
syria.91.a: "Their loss."
syria.92.t: "Lebanon Returns"
syria.92.d: "Beirut has accepted the union. Lebanon returns to Syria."
syria.92.a: "The Levant is whole."
