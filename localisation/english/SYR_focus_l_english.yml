# Game rule: Syria AI behaviour (common/game_rules/SYR_game_rules.txt)
SYR_AI_BEHAVIOR: "@SYR Syria"
RULE_OPTION_SYR_HISTORICAL: "Historical"
RULE_OPTION_SYR_HISTORICAL_DESC: "Syria follows its normal AI choices."
RULE_OPTION_SYR_LOYALIST: "Loyal to France"
RULE_OPTION_SYR_LOYALIST_DESC: "Syria ratifies the Franco-Syrian Treaty and stays with France, winning autonomy step by step."
RULE_OPTION_SYR_COMMUNIST: "Communist"
RULE_OPTION_SYR_COMMUNIST_DESC: "Syria breaks with France and Khalid Bakdash's People's Front takes power."
RULE_OPTION_SYR_INDEPENDENT_COMMUNIST: "Independent Communist"
RULE_OPTION_SYR_INDEPENDENT_COMMUNIST_DESC: "Syria becomes communist under the People's Front, then breaks with Moscow and follows the Syrian Road."
RULE_OPTION_SYR_FASCIST: "Syrian Social Nationalist"
RULE_OPTION_SYR_FASCIST_DESC: "Syria breaks with France and Antun Saadeh's SSNP takes power."
RULE_OPTION_SYR_HASHEMITE: "Hashemite Monarchy"
RULE_OPTION_SYR_HASHEMITE_DESC: "Syria breaks with France and restores the Hashemite throne under Zeid bin Hussein, without the Arab-Islamic alliance."
RULE_OPTION_SYR_ARAB_ALLIANCE: "Arab-Islamic Alliance"
RULE_OPTION_SYR_ARAB_ALLIANCE_DESC: "Syria restores the Hashemite throne and builds the Arab-Islamic alliance toward the Arabia Organization."
RULE_OPTION_SYR_BLACK_BANNER: "The Black Banner"
RULE_OPTION_SYR_BLACK_BANNER_DESC: "Syria takes the hidden route of Sheikh Muhammad al-Ashmar and fights the war of faith against the moderates."
RULE_OPTION_SYR_RANDOM_DESC: "At the start of the game, Syria picks one of these routes at random and follows it."
SYR_changeleader: "Change Halife"
SYR_changeleader_desc: "With the banner raised over Damascus, the old leadership steps aside and AcizbirKul takes the helm of the Syrian state."
SYR_massalah: "Massalah"
SYR_massalah_desc: "Camel Corpslar birliğini ekler, 3000 ekler eğer savaşta değilsen 5000 silah daha ekler"
