SYR_voice_of_arab_unity: "Voice of Arab Unity"

# Opinion modifiers
SYR_paris_talks: "Paris negotiations"
SYR_loyal_partner: "Loyal Syrian partner"
SYR_defiance: "Syrian defiance"
