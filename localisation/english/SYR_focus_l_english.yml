SYR_coministeconomi_desc: "Çiftçileri doyur"
SYR_coministe2_desc: "Gözünü doyur"
SYR_the_jazira_wheat_lerin: "Adamlar icin Manpowerlar"
SYR_the_jazira_wheat_lerin_desc: "Roads and settlers open the fertile plains of the Jazira, beyond the Euphrates."
SYR_coministe2_copy: "Varaklı Kızıl Ordu"
SYR_coministe2_copy_desc: "Silahsiz Kuvet"
SYR_the_late_iron_mines: "Late Iron Mines"
SYR_the_late_iron_mines_desc: "Geç ama güç olmasın"
SYR_the_levantine_market_copy: "§OThe Pazzar"
SYR_the_levantine_market_copy_desc: "Damascus is once again the great market between the Mediterranean and Mesopotamia."
SYR_modernise_the_harbours_copy: "New Dockyards"
SYR_modernise_the_harbours_copy_desc: "New quays and a repair yard turn our small coastal harbours into working ports."
SYR_BeterayMain_copy: "Old Habits More Options"
SYR_BeterayMain_copy_desc: "Aynı Focus ama ikincisi"
SYR_Late_Oil_Pipeline: "Late Oil Pipeline"
SYR_Late_Oil_Pipeline_desc: "Geç ama güç olmasın"
SYR_axis_events: "Avrupalılar gibi değil"
SYR_axis_oil: "Oil for the Axis"
SYR_axis_oil_desc: "The wells of the Jazira are opened to our friends in Berlin and Rome. Syrian oil keeps their tanks moving and ours fuelled."
SYR_german_officers: "German Officers"
SYR_german_officers_desc: "Berlin sends veteran officers to train our army and lead it in the field."
SYR_german_officers_spirit: "German Officers"
SYR_german_officers_spirit_desc: "German instructors drill our regiments in modern tactics, and German commanders stand beside our own."
SYR_syrian_mines: "Open the Syrian Mines"
SYR_syrian_mines_desc: "Without Berlin's money we must dig for ourselves. New shafts and better tools raise the output of every Syrian mine and well."
SYR_syrian_mines_spirit: "Syrian Mines"
SYR_syrian_mines_spirit_desc: "Syrian engineers run the mines and wells of the country, and every one of them produces more."
SYR_distance_from_berlin: "Distance from Berlin"
SYR_resource_management: "Resource Management"
SYR_resource_management_desc: "Stockpiles, rationing and careful planning keep our factories working even when the raw materials run short."
SYR_syrian_mines_spirit_2: "Syrian Mines"
SYR_syrian_mines_spirit_2_desc: "Syrian engineers run the mines and wells of the country, and careful planning keeps the factories working when raw materials run short."
SYR_syrian_arms_works: "Syrian Arms Works"
SYR_syrian_arms_works_desc: "Rifles and shells made in Damascus, Aleppo and the cities of the Euphrates arm the Syrian soldier."
SYR_komkompuration: "§BWe Only Need  ALLAH"
SYR_german_military_act: "German Based Military"
SYR_german_military_act_desc: "Officers from Germany and Italy train our army in modern warfare."
SYR_the_arab_covenant: "The Arab Covenant"
SYR_the_arab_covenant_desc: "Baghdad alone is not enough. We offer Riyadh and Sana'a a place beside us, so that the Arabs of the desert and the mountains speak with one voice."
SYR_the_islamic_conference: "The Islamic Conference"
SYR_the_islamic_conference_desc: "Tehran and Kabul share our faith and our fear of the great empires. A conference of Muslim states in Damascus can turn that shared fear into an alliance."
SYR_the_arab_brotherhood: "The Arab Brotherhood"
SYR_the_arab_brotherhood_desc: "Officers of every member state train together and swear to defend each other's lands as their own."
SYR_liberate_the_arab_lands: "Liberate the Arab Lands"
SYR_liberate_the_arab_lands_desc: "Egypt, Kuwait and Libya still live under foreign flags. The alliance will not rest until they are free."
SYR_the_free_arab_nations: "The Free Arab Nations"
SYR_the_free_arab_nations_desc: "Egypt and Libya must be free. We call on the powers that hold them to let them go, and the lands we have freed ourselves rise again as nations that stand with us."
SYR_the_arabia_organization: "§GThe Arabia Organization"
SYR_the_arabia_organization_desc: "The alliance becomes the Arabia Organization, with Damascus at its heart. Its members are invited to join Syria in a single state."
SYR_arabia_organization_faction: "Arabia Organization"
SYR_arab_brotherhood: "Arab Brotherhood"
SYR_arab_brotherhood_desc: "The armies of the Arab-Islamic alliance train together and stand together."
SYR_arab_covenant: "Arab Covenant"
SYR_islamic_solidarity: "Islamic Solidarity"
SYR_arab_union_pressure: "Pressed for Union"
SYR_arabia_organization: "Arab Unity"
SYR_arabia_organization_desc: "Damascus gathers the Arab and Muslim nations around it. Free nations can be invited into our alliance, and once the Arabia Organization is proclaimed, its members can be persuaded to unite with us. A member accepts union when its opinion of us is above 60."
SYR_arab_diplomatic_pressure: "Press [FROM.GetName] for Union"
SYR_arab_diplomatic_pressure_desc: "Envoys, money and promises will make [FROM.GetNameDef] look more kindly on a union with Syria."
SYR_propose_arab_union: "Propose Union to [FROM.GetName]"
SYR_propose_arab_union_desc: "Invite [FROM.GetNameDef] to join Syria in a single Arab state."
syria.85.t: "An Invitation from Damascus"
syria.85.d: "[FROM.GetNameDef] invites us to join the [FROM.GetFactionName], an alliance of Arab and Muslim states against the empires that rule our region."
syria.85.a: "We will stand with Damascus."
syria.85.b: "We will keep to ourselves."
syria.86.t: "Union with Syria"
syria.86.d: "[FROM.GetNameDef] proposes that we join it in a single state. Our army, our land and our people would become part of [FROM.GetNameDef]."
syria.86.a: "Let us become one nation."
syria.86.b: "We keep our independence."
SYR_arabia_org: "The Arabia Organization"
SYR_arabia_org_DEF: "the Arabia Organization"
SYR_arabia_org_ADJ: "Arabian"
SYR_arabia_union_cores_tt: "Members that unite with us become our §Ycore§! territory."
SYR_war_of_arab_liberation: "War of Arab Liberation"
SYR_war_of_arab_liberation_desc: "Our soldiers fight to free their Arab brothers from foreign rule, and they attack with the fire of that cause."
SYR_invite_into_the_alliance: "Invite [FROM.GetName]"
SYR_invite_into_the_alliance_desc: "Ask [FROM.GetNameDef] to join our alliance of Arab and Muslim nations."
SYR_free_the_held_arab_lands: "Free the Arab Lands We Hold"
SYR_free_the_held_arab_lands_desc: "The Egyptian, Kuwaiti and Libyan lands under our control rise again as nations under our protection and join our alliance."
syria.87.t: "Syria Demands Egypt's Freedom"
syria.87.d: "[FROM.GetNameDef] demands that we end our rule over Egypt and let the Egyptians govern themselves. Damascus speaks for a growing alliance of Arab and Muslim states, and it hints that it will not wait forever."
syria.87.a: "Let Egypt go."
syria.87.b: "Egypt stays under our control."
syria.88.t: "Syria Demands Libya's Freedom"
syria.88.d: "[FROM.GetNameDef] demands that we end our rule over Libya and let the Libyans govern themselves. Damascus speaks for a growing alliance of Arab and Muslim states, and it hints that it will not wait forever."
syria.88.a: "Let Libya go."
syria.88.b: "Libya stays under our control."
syria.94.t: "Egypt Is Free"
syria.94.d: "[FROM.GetNameDef] has given way, and Egypt governs itself again. Cairo owes its freedom to our demand."
syria.94.a: "Invite Egypt into our alliance."
syria.95.t: "Libya Is Free"
syria.95.d: "[FROM.GetNameDef] has given way, and Libya governs itself again. Tripoli owes its freedom to our demand."
syria.95.a: "Invite Libya into our alliance."
syria.96.t: "[FROM.GetName] Will Not Free Egypt"
syria.96.d: "[FROM.GetNameDef] has rejected our demand. Egypt will stay under foreign rule unless we free it ourselves."
syria.96.a: "Then we will free Egypt by force."
syria.96.b: "The time is not right."
syria.97.t: "[FROM.GetName] Will Not Free Libya"
syria.97.d: "[FROM.GetNameDef] has rejected our demand. Libya will stay under foreign rule unless we free it ourselves."
syria.97.a: "Then we will free Libya by force."
syria.97.b: "The time is not right."
