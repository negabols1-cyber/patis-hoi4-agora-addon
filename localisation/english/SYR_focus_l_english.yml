l_english:
# Syria (SYR) focus tree, ideas, decisions, events and tooltips.
# Design notes: docs/systems/syria_focus_tree.md

# Navigation
SYR_shortcut_economy: "Economy"
SYR_shortcut_loyalist: "The Treaty"
SYR_shortcut_independence: "The Struggle"
SYR_shortcut_military: "Army"

# Opening
SYR_the_general_strike: "The General Strike Ve Robux"
SYR_the_general_strike_desc: "For fifty days the souks of Damascus, Aleppo and Homs have stayed shut. The High Commissioner wants the shutters raised; the National Bloc wants a treaty. How the strike ends will shape everything that follows."
SYR_the_paris_delegation: "The Paris Delegation"
SYR_the_paris_delegation_desc: "Hashim al-Atassi and Jamil Mardam Bey sail for Paris to negotiate the future of the mandate with the new government of France."
SYR_the_lebanese_question: "The Lebanese Question"
SYR_the_lebanese_question_desc: "Beirut, Tripoli and the Bekaa were cut away from Syria to make Greater Lebanon. Whether by treaty or by force, Damascus will not forget the coast."
SYR_the_sanjak_question: "The Sanjak of Alexandretta"
SYR_the_sanjak_question_desc: "Ankara looks hungrily at Iskenderun and Antakya. We must decide whether to stand firm on the Sanjak or seek an understanding with Turkey."
SYR_crossroads_of_the_levant: "Crossroads of the Levant"
SYR_crossroads_of_the_levant_desc: "The treaty drafted in Paris promises independence in twenty-five years, bound to France by alliance and bases. Some call it the road to freedom. Others call it a gilded chain."

# Loyalist route
SYR_ratify_the_franco_syrian_treaty: "Ratify the Franco-Syrian Treaty"
SYR_ratify_the_franco_syrian_treaty_desc: "We will walk with France. The treaty unites the Syrian states, opens parliament and sets a path to sovereignty inside the French alliance."
SYR_the_presidential_elections: "The Presidential Elections"
SYR_the_presidential_elections_desc: "The new Chamber elects Hashim al-Atassi, elder statesman of the National Bloc, as President of the Republic."
SYR_the_mandate_reforms: "Reform the Mandate"
SYR_the_mandate_reforms_desc: "French advisers step back from the ministries one by one. Syrians now run their own customs, police and courts."
SYR_the_troupes_speciales: "The Troupes Spéciales"
SYR_the_troupes_speciales_desc: "The locally raised Troupes Spéciales du Levant become the core of a Syrian army trained to French standards."
SYR_a_constitutional_republic: "A Constitutional Republic"
SYR_a_constitutional_republic_desc: "The Jabal Druze and the Alawite mountains return to Damascus under one constitution. The separate states of the mandate are no more."
SYR_dominion_of_the_levant: "Dominion of the Levant"
SYR_dominion_of_the_levant_desc: "Paris recognises Syria as a self-governing dominion. The High Commissioner becomes an ambassador in all but name."
SYR_franco_syrian_staff_talks: "Franco-Syrian Staff Talks"
SYR_franco_syrian_staff_talks_desc: "Syrian officers sit with the French general staff to plan the defence of the Levant together."
SYR_the_syrian_parliament: "The Syrian Parliament"
SYR_the_syrian_parliament_desc: "The Chamber of Deputies sits in full session, and the government answers to it. Syrian democracy has found its voice."
SYR_the_lebanese_settlement: "The Lebanese Settlement"
SYR_the_lebanese_settlement_desc: "We ask Paris to return Lebanon to a united Levantine state. France may agree, or it may keep the coast for itself."
SYR_the_armee_du_levant: "The Armée du Levant"
SYR_the_armee_du_levant_desc: "Syrian and French garrisons share the forts on our borders, and Syrian officers learn the business of war from veterans of the Great War."
SYR_pillar_of_the_french_levant: "Pillar of the French Levant"
SYR_pillar_of_the_french_levant_desc: "Syria is no longer a problem for Paris to manage but a partner to invest in. French capital follows French confidence."
SYR_war_industries_for_france: "War Industries for left France "
SYR_war_industries_for_france_desc: "The workshops of Aleppo turn to rifles and ammunition. Should France go to war, the Levant will be its arsenal."
SYR_the_levantine_ports: "The Levantine Ports"
SYR_the_levantine_ports_desc: "New quays and repair yards at Beirut, Latakia and Iskenderun open the Levant to the sea."
SYR_the_levantine_volunteers: "The Levantine Volunteers"
SYR_the_levantine_volunteers_desc: "Volunteer brigades are raised to stand beside France wherever it fights."
SYR_the_question_of_sovereignty: "The Question of Sovereignty"
SYR_the_question_of_sovereignty_desc: "Syria has proved itself. It must now decide whether its future lies inside the French Union or as a free nation allied to France."
SYR_equal_partner_of_the_french_union: "Equal Partner of the French Union"
SYR_equal_partner_of_the_french_union_desc: "Syria remains with France, not as a mandate but as an equal partner sharing its science, its markets and its wars."
SYR_independence_by_treaty: "Independence by Treaty"
SYR_independence_by_treaty_desc: "The time has come for France to honour the treaty. We ask Paris to ratify Syrian independence."
SYR_the_imperial_levant_command: "The Levant Command"
SYR_the_imperial_levant_command_desc: "A joint command for the whole Levant gives Syrian officers French motor transport and French doctrine."
SYR_franco_syrian_alliance: "The Franco-Syrian Alliance"
SYR_franco_syrian_alliance_desc: "Independent Syria binds itself to France as an ally. Friends who chose each other stand stronger than master and subject."
SYR_the_french_union_assembly: "The French Union Assembly"
SYR_the_french_union_assembly_desc: "Syrian deputies take their seats in the assembly of the French Union, and Syrian scholars in its academies."
SYR_the_republic_of_the_levant: "The Republic of the Levant"
SYR_the_republic_of_the_levant_desc: "A free, democratic and united Levant shows the Arab world what self-government can achieve."

# Independence route
SYR_reject_the_treaty: "Reject the Treaty"
SYR_reject_the_treaty_desc: "Twenty-five years of French bases and French advisers is not independence. The National Bloc turns from negotiation to struggle."
SYR_the_national_bloc_underground: "The National Bloc Underground"
SYR_the_national_bloc_underground_desc: "Cells in every quarter, couriers in every caravan. The Bloc learns to work where the Sûreté cannot see."
SYR_arm_the_ghouta: "Arm the Ghouta"
SYR_arm_the_ghouta_desc: "The orchards around Damascus sheltered the rebels of 1925. Rifles are buried there again."
SYR_the_mountain_alliance: "The Mountain Alliance"
SYR_the_mountain_alliance_desc: "The Druze of the Jabal and the clans of the Alawite mountains join the national cause. A divided Syria becomes one people in revolt."
SYR_the_spirit_of_1925: "The Spirit of 1925"
SYR_the_spirit_of_1925_desc: "Sultan al-Atrash's banner rose in the Jabal Druze and French artillery shelled Damascus. Every Syrian remembers, and every Syrian is ready."
SYR_the_hour_of_independence: "The Hour of Independence"
SYR_the_hour_of_independence_desc: "The nation is ready. We will demand our freedom, and if France refuses, we will take it."

# Communist branch
SYR_the_peoples_front: "The People's Front"
SYR_the_peoples_front_desc: "Khalid Bakdash leads the Syrian Communist Party into government at the head of a front of workers, peasants and patriots."
SYR_land_to_the_fellahin: "Land to the Fellahin"
SYR_land_to_the_fellahin_desc: "The great estates are broken up and their fields handed to the peasants who work them."
SYR_the_aleppo_workers_councils: "The Aleppo Workers' Councils"
SYR_the_aleppo_workers_councils_desc: "Workers' councils take over the textile mills of Aleppo and turn them toward the needs of the revolution."
SYR_purge_the_effendi_class: "Purge the Effendi Class"
SYR_purge_the_effendi_class_desc: "The landlords and notables who served the mandate lose their titles, their lands and their influence."
SYR_the_red_levant_army: "The Red Army of the Levant"
SYR_the_red_levant_army_desc: "Political commissars and workers' militias remake the army into a defender of the revolution."
SYR_the_syrian_peoples_republic: "The Syrian People's Republic"
SYR_the_syrian_peoples_republic_desc: "The revolution is secure at home. Syria stands as the first socialist republic of the Arab world."
SYR_the_moscow_connection: "The Moscow Connection"
SYR_the_moscow_connection_desc: "Bakdash studied in Moscow. Now he asks the Soviet Union to welcome Syria among the workers' states."
SYR_export_the_revolution: "Export the Revolution"
SYR_export_the_revolution_desc: "The Arab revolution cannot stop at our borders. The peoples of Lebanon and Palestine look to Damascus."
SYR_soviet_arms_shipments: "Soviet Arms Shipments"
SYR_soviet_arms_shipments_desc: "Soviet freighters unload rifles and guns at our ports."
SYR_the_red_cedar: "The Red Cedar"
SYR_the_red_cedar_desc: "The workers of Beirut and the peasants of the Bekaa will be freed from the confessional bosses and their foreign patrons."
SYR_the_baghdad_soviet: "The Baghdad Soviet"
SYR_the_baghdad_soviet_desc: "The Iraqi Communist Party grows in the shadow of the monarchy. Syria will help it rise."
SYR_liberate_palestine: "Liberate Palestine"
SYR_liberate_palestine_desc: "The British mandate in Palestine and Transjordan is the last bastion of empire in the southern Levant."
SYR_the_union_of_arab_soviet_republics: "The Union of Arab Soviet Republics"
SYR_the_union_of_arab_soviet_republics_desc: "From the Mediterranean to the Euphrates, the Arab peoples stand united under the red banner."

# Fascist branch
SYR_the_syrian_social_nationalist_party: "The Syrian Social Nationalist Party"
SYR_the_syrian_social_nationalist_party_desc: "Antun Saadeh and his party take power, preaching the unity of one Syrian nation across the Fertile Crescent."
SYR_the_whirlwind_banner: "The Whirlwind Banner"
SYR_the_whirlwind_banner_desc: "The red zawba'a, the whirlwind, flies over Damascus. Every Syrian is called to the party and the nation."
SYR_the_corporate_economy: "The Corporate Economy"
SYR_the_corporate_economy_desc: "Workers and owners are bound together in national corporations that serve the state."
SYR_the_ssnp_militia: "The SSNP Militia"
SYR_the_ssnp_militia_desc: "The party's uniformed youth form legions ready to fight for natural Syria."
SYR_the_doctrine_of_natural_syria: "The Doctrine of Natural Syria"
SYR_the_doctrine_of_natural_syria_desc: "Saadeh's natural Syria runs from the Taurus to Sinai and from Cyprus to Mesopotamia. Every part of it is ours to reclaim."
SYR_the_zaim: "The Za'im"
SYR_the_zaim_desc: "The party calls Saadeh simply the Za'im, the Leader. His word is the nation's will."
SYR_seek_axis_patronage: "Seek Axis Patronage"
SYR_seek_axis_patronage_desc: "The enemies of Britain and France are our natural friends. We court Berlin and Rome."
SYR_reclaim_lebanon: "Reclaim the Coast"
SYR_reclaim_lebanon_desc: "Lebanon and the Sanjak were torn from Syria by foreign treaties. We will bring them home."
SYR_german_military_advisors: "German Military Advisors"
SYR_german_military_advisors_desc: "Officers from Germany and Italy train our army in modern warfare."
SYR_march_on_jerusalem: "Reclaim Kutsal Topraklar"
SYR_march_on_jerusalem_desc: "Southern Syria, from Jerusalem to Amman, waits under British rule."
SYR_the_mesopotamian_front: "The Mesopotamian Front"
SYR_the_mesopotamian_front_desc: "The Tigris and Euphrates are the eastern rivers of natural Syria. Baghdad must join the nation."
SYR_the_star_of_cyprus: "The Star of Cyprus"
SYR_the_star_of_cyprus_desc: "Saadeh called Cyprus the star of the Syrian crescent. We build a fleet to bring it home."
SYR_greater_syria_proclaimed: "Greater Syria Proclaimed"
SYR_greater_syria_proclaimed_desc: "The Syrian nation is whole at last, one people under one banner across the Fertile Crescent."

# Hashemite branch
SYR_the_hashemite_restoration: "The Hashemite Restoration"
SYR_the_hashemite_restoration_desc: "In 1920 Faisal was crowned King of Syria and driven out by French guns. His brother Zeid now returns to claim the throne."
SYR_crown_the_king_in_damascus: "Crown the King in Damascus"
SYR_crown_the_king_in_damascus_desc: "In the Umayyad Mosque, Zeid bin Hussein is crowned King of Syria before the notables of the nation."
SYR_the_royal_diwan: "The Royal Diwan"
SYR_the_royal_diwan_desc: "The king's council gathers ministers, tribal sheikhs and city notables to govern in his name."
SYR_the_bedouin_levies: "The Bedouin Levies"
SYR_the_bedouin_levies_desc: "The great tribes of the desert pledge their horsemen to the crown."
SYR_the_tribal_councils: "The Tribal Councils"
SYR_the_tribal_councils_desc: "Councils of sheikhs settle disputes in the king's name and send their young men to his service."
SYR_the_throne_of_faisal: "The Throne of Faisal"
SYR_the_throne_of_faisal_desc: "The kingdom that France destroyed at Maysalun lives again. The Hashemite crown is the crown of the Arab revival."
SYR_the_hashemite_entente: "The Hashemite Entente"
SYR_the_hashemite_entente_desc: "Damascus and Baghdad are ruled by the same family. Together they can stand against any empire."
SYR_the_armed_neutrality: "Armed Neutrality"
SYR_the_armed_neutrality_desc: "The kingdom seeks no quarrel, but it will defend every hill and wadi of its land."
SYR_the_arab_league_initiative: "The Arab League Initiative"
SYR_the_arab_league_initiative_desc: "King Zeid invites the Arab states to a league of brothers, to speak with one voice before the world."
SYR_reunite_with_lebanon: "Reunite with Lebanon"
SYR_reunite_with_lebanon_desc: "Lebanon was part of Faisal's kingdom. We invite Beirut to return to the crown."
SYR_the_fertile_crescent_plan: "The Fertile Crescent Plan"
SYR_the_fertile_crescent_plan_desc: "Syria, Iraq, Transjordan and Palestine joined under Hashemite rule: the dream of the Arab Revolt, finally within reach."
SYR_the_royal_guard: "The Royal Guard"
SYR_the_royal_guard_desc: "An elite guard is raised to protect the king and the capital."
SYR_the_hashemite_kingdom_of_syria: "The Hashemite Kingdom of Syria"
SYR_the_hashemite_kingdom_of_syria_desc: "The kingdom that was lost in 1920 stands restored, greater and stronger than before."

# Economy
SYR_the_mandate_economy: "The Mandate Economy"
SYR_the_mandate_economy_desc: "The Syrian economy was built to serve France. It is time it served Syria."
SYR_the_aleppo_textile_mills: "The Aleppo Textile Mills"
SYR_the_aleppo_textile_mills_desc: "Aleppo has woven silk and cotton for a thousand years. Modern looms will make it the mill town of the Levant."
SYR_the_jazira_wheat_frontier: "The Jazira Wheat Frontier"
SYR_the_jazira_wheat_frontier_desc: "Roads and settlers open the fertile plains of the Jazira, beyond the Euphrates."
SYR_railways_of_the_levant: "Railways of the Levant"
SYR_railways_of_the_levant_desc: "The Hejaz and Baghdad lines are joined into one network running from the coast to the desert."
SYR_the_iraq_pipeline_transit: "The Iraq Pipeline Transit"
SYR_the_iraq_pipeline_transit_desc: "The Iraq Petroleum Company's pipeline crosses our land on its way to the sea. Transit fees and local wells fill the treasury."
SYR_the_damascus_industrial_zone: "The Damascus Industrial Zone"
SYR_the_damascus_industrial_zone_desc: "Workshops and factories rise on the edge of the oldest city in the world."
SYR_the_iron_mines: "The Iron Mines"
SYR_the_iron_mines_desc: "New mines in the hills feed Syrian iron to Syrian foundries."
SYR_the_homs_refinery: "The Homs Refinery"
SYR_the_homs_refinery_desc: "New oil wells, a refinery and fuel depots at Deir-az-Zur keep Syrian engines running."
SYR_the_syrian_university: "The Syrian University"
SYR_the_syrian_university_desc: "The Syrian University in Damascus becomes the leading place of learning in the Arab East."
SYR_arms_workshops: "Arms Workshops"
SYR_arms_workshops_desc: "A nation that cannot arm itself is not truly free."
SYR_the_euphrates_project: "The Euphrates Project"
SYR_the_euphrates_project_desc: "Dams and canals on the Euphrates water the east and power its new industries."
SYR_modernise_the_harbours: "Modernise the Harbours"
SYR_modernise_the_harbours_desc: "New quays and a repair yard turn our small coastal harbours into working ports."
SYR_the_damascus_trade_fair: "The Damascus Trade Fair"
SYR_the_damascus_trade_fair_desc: "Merchants from Beirut to Baghdad come to Damascus, and new workshops open to supply them."
SYR_a_self_reliant_syria: "A Self-Reliant Syria"
SYR_a_self_reliant_syria_desc: "Syria makes what it needs: its own tools, its own machines and its own rifles."
SYR_the_levantine_market: "The Levantine Market"
SYR_the_levantine_market_desc: "Damascus is once again the great market between the Mediterranean and Mesopotamia."

# Military
SYR_an_army_for_syria: "An Army for Syria"
SYR_an_army_for_syria_desc: "Syria raises its first regular divisions, led by veterans such as Fawzi al-Qawuqji."
SYR_the_desert_cavalry: "The Desert Cavalry"
SYR_the_desert_cavalry_desc: "Horse and camel troops still rule the open desert of the east."
SYR_the_homs_military_academy: "The Homs Military Academy"
SYR_the_homs_military_academy_desc: "The academy at Homs trains a new generation of Syrian officers."
SYR_mountain_warfare: "Mountain Warfare"
SYR_mountain_warfare_desc: "The Jabal Druze and the Alawite mountains teach hard lessons in defence."
SYR_the_artillery_park: "The Artillery Park"
SYR_the_artillery_park_desc: "Modern guns replace the worn pieces left over from the Great War."
SYR_the_desert_raiders: "The Desert Raiders"
SYR_the_desert_raiders_desc: "Small, fast units strike deep across the desert and vanish again."
SYR_motorized_columns: "Motorised Columns"
SYR_motorized_columns_desc: "Trucks and armoured cars carry infantry across the vast distances of the east."
SYR_the_general_staff: "The General Staff"
SYR_the_general_staff_desc: "A permanent general staff plans the defence of the nation."
SYR_the_syrian_air_arm: "The Syrian Air Arm"
SYR_the_syrian_air_arm_desc: "Airfields near Damascus give Syria its first air force."
SYR_the_defence_of_damascus: "The Defence of Damascus"
SYR_the_defence_of_damascus_desc: "Fortifications and anti-aircraft guns ring the capital."
SYR_the_mezzeh_flight_school: "The Mezzeh Flight School"
SYR_the_mezzeh_flight_school_desc: "Syrian pilots train at the airfield of Mezzeh."
SYR_the_northern_frontier: "The Northern Frontier"
SYR_the_northern_frontier_desc: "Forts guard the long borders with Turkey and Iraq."
SYR_the_reserve_system: "The Reserve System"
SYR_the_reserve_system_desc: "Every young Syrian trains with the colours and returns home ready to be called up."
SYR_the_northern_fortress_line: "The Northern Fortress Line"
SYR_the_northern_fortress_line_desc: "Bunkers along the northern border guard Aleppo against any invader."
SYR_a_modern_syrian_army: "A Modern Syrian Army"
SYR_a_modern_syrian_army_desc: "Our officers study the new ways of war and build an army fit for them."
SYR_the_national_army: "The National Army"
SYR_the_national_army_desc: "Syria fields a national army, trained, equipped and proud."

