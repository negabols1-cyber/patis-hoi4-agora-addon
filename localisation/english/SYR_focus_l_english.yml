SYR_the_homs_refinery_copy_desc: "Refinery research speeds up and Damascus gains rubber."
SYR_the_bedouin_levies_copy: "Krall'in Korumalari"
SYR_the_bedouin_levies_copy_desc: "A fully trained and equipped camel division joins the army in Damascus."
SYR_the_latakia_harbour: "The Latakia Harbour"
SYR_the_latakia_harbour_desc: "Latakia gets a bigger naval base and Syria's first dockyard."
SYR_the_latakia_shipyards: "The Latakia Shipyards"
SYR_the_latakia_shipyards_desc: "Dockyards are built faster."
SYR_a_syrian_navy: "A Syrian Navy"
SYR_a_syrian_navy_desc: "Ship research speeds up and the navy gains experience."
SYR_latakia_shipyards: "Latakia Shipyards"
SYR_latakia_shipyards_desc: "The shipwrights of Latakia build new dockyards along the coast."
SYR_the_aleppo_textile_mills_copy: "The Aleppo Textile Valley"
SYR_the_aleppo_textile_mills_copy_desc: "Aleppo has woven silk and cotton for a thousand years. Modern looms will make it the mill town of the Levant."
SYR_advisorofking: "Önde Gelen isimleri Tanı"
