SYR_aaa2_desc: "Syria finally builds an air force of its own: new airfields, trained pilots and the first modern aircraft."
SYR_aaa2_copy: "Wings Of Greater Arabia"
SYR_aaa2_copy_desc: "Syria finally builds an air force of its own: new airfields, trained pilots and the first modern aircraft."
