SYR_the_aleppo_textile_mills_copy_copy_desc: "Aleppo has woven silk and cotton for a thousand years. Modern looms will make it the mill town of the Levant."

# The Black Banner (secret route)
SYR_komkompuration_desc: "Kings, mandates and parliaments have all failed Syria. In the mosques of al-Midan, Sheikh Muhammad al-Ashmar preaches that Syria needs no crown from Mecca and no constitution from Paris, only God. His Black Banner is raised, and the moderates in the cabinet are already preparing to strike it down."
SYR_the_minbar_of_damascus: "The Minbar of Damascus"
SYR_the_minbar_of_damascus_desc: "Every Friday the preachers of the Black Banner climb the minbars of Damascus. Their sermons will carry our call into every quarter and every province."
SYR_the_hidden_armouries: "The Hidden Armouries"
SYR_the_hidden_armouries_desc: "Beneath the courtyards of the old mosques lie cellars the gendarmes never search. There we will store the rifles and train the men of the coming war."
SYR_brothers_in_faith: "Brothers in Faith"
SYR_brothers_in_faith_desc: "Riyadh, Sana'a, Cairo and Kabul pray as we pray. We will ask our brothers in faith for rifles and volunteers."
SYR_the_banner_over_damascus: "The Banner over Damascus"
SYR_the_banner_over_damascus_desc: "The moderates are beaten and the Black Banner flies over the Umayyad Mosque. The Emirate must now turn victory into order."
SYR_route_secret_tt: "Syria has chosen the §YBlack Banner§!"
SYR_unlocks_black_banner_mosques_tt: "Unlocks the decision §YWin the Mosques§! of a state: states with our mosques stay with us when the war of faith begins."
SYR_rifles_to_caches_tt: "Rifles in the mosque caches: §G+[?SYR_cache_gain|0]§! (they join our army when the war of faith begins, and the moderates get no share of them)"
SYR_unlocks_black_banner_arsenal_tt: "Unlocks the decisions §YHide Rifles in the Mosques§! and §YTrain the Mujahideen§!."
SYR_unlocks_black_banner_aid_tt: "Unlocks the decision §YSeek the Aid§! of §YSaudi Arabia§!, §YYemen§!, §YEgypt§! and §YAfghanistan§!."
SYR_war_of_faith_won_tt: "The Black Banner has won the §Ywar of faith§!"
SYR_reckoning_is_coming_tt: "The §YDay of Reckoning§! has not yet come"
SYR_is_black_banner_tt: "The §YBlack Banner§! governs our country"
SYR_reckoning_begins_tt: "§YThe Day of Reckoning§! begins: when its timer runs out, the Black Banner and the moderates fight for Syria. Decisions can delay it, prepare us for the war or start it early."
SYR_moderates_weaken_tt: "The moderates' share of our army and stockpile: §G-[?SYR_moderate_delta|0]%§!"
SYR_moderates_strengthen_tt: "The moderates' share of our army and stockpile: §R+[?SYR_moderate_delta|0]%§!"
SYR_surprise_rising_tt: "We gain §YThe Surprise Rising§! for §Y[?SYR_surprise_days|0]§! days."
SYR_war_of_faith_starts_tt: "§RThe war of faith begins.§! States with our mosques stay with us; the moderates break away with the other states and §R[?SYR_moderate_strength_pct|0]%§! of our army and stockpile.\n§YMuhammad al-Ashmar§! takes power and Syria becomes the §YEmirate of Sham§!. The mosque caches are opened, and the mujahideen and the foreign volunteers take the field."
SYR_government_falls_tt: "The moderates have no state to rally in, and the government falls without a war. §YMuhammad al-Ashmar§! takes power and Syria becomes the §YEmirate of Sham§!."
SYR_aid_volunteers_arrive_tt: "A division of foreign volunteers joins our army in the capital."
SYR_aid_rifles_to_caches_tt: "Rifles in the mosque caches: §G+[?SYR_aid_rifles|0]§!"
SYR_aid_volunteers_promised_tt: "A division of foreign volunteers will join us when the war of faith begins."
SYR_black_banner_raised_tt: "The §YBlack Banner§! has been raised"
SYR_reckoning_can_be_delayed_tt: "The Day of Reckoning can still be delayed this long (days added: §Y[?SYR_faith_countdown_extended|0]§!/§Y[?SYR_reckoning_max_extension|0]§!)"
SYR_reckoning_delayed_tt: "The Day of Reckoning comes §G[?SYR_reckoning_delay|0]§! days later."
SYR_no_mosque_campaign_running_tt: "Our preachers are not already at work in another state"
SYR_moderates_keep_a_state_tt: "The moderates still hold another state"
SYR_rifle_caches_left_tt: "Mosque caches filled: §Y[?SYR_rifle_caches|0]§!/§Y[?SYR_rifle_caches_max|0]§!"
SYR_mujahideen_left_tt: "Mujahideen divisions trained: §Y[?SYR_mujahideen_brigades|0]§!/§Y[?SYR_mujahideen_max|0]§!"
SYR_mujahideen_trained_tt: "A division of §YJund al-Raya§! mujahideen takes the field in the capital when the war of faith begins."
SYR_aid_sent_tt: "We send rifles and a division of volunteers to §Y[FROM.GetName]§!."
SYR_banner_over_damascus_unlocked_tt: "The focus §YThe Banner over Damascus§! can now be completed."
SYR_the_black_banner: "The Black Banner"
SYR_the_black_banner_desc: "[SYR_GetBlackBannerStatus]"
SYR_black_banner_status_preparation: "The moderates in the cabinet are gathering gendarmes and loyal officers against Sheikh Muhammad al-Ashmar. When the §YDay of Reckoning§! comes, Syria will be decided by arms.\n\nStates with our mosques: §Y[?SYR_faithful_states|0]§!\nStates with the moderates: §Y[?SYR_moderate_states|0]§!\nThe moderates will take §R[?SYR_moderate_strength_pct|0]%§! of our army and stockpile.\n\nRifles in the mosque caches: §Y[?SYR_hidden_rifles|0]§!\nMujahideen divisions: §Y[?SYR_mujahideen_brigades|0]§!/§Y[?SYR_mujahideen_max|0]§!\nForeign volunteer divisions: §Y[?SYR_faith_volunteers|0]§!\nDays added to the countdown: §Y[?SYR_faith_countdown_extended|0]§!/§Y[?SYR_reckoning_max_extension|0]§!"
SYR_black_banner_status_war: "The Black Banner fights the moderates for Syria. Our brothers in faith can still send rifles and volunteers, and they join our army at once."
SYR_the_day_of_reckoning: "The Day of Reckoning"
SYR_the_day_of_reckoning_desc: "The moderates will move against us when they are ready. When this mission ends, the war of faith begins: states with our mosques stay with us, and the rest of Syria follows the moderates."
SYR_swear_loyalty_to_the_cabinet: "Swear Loyalty to the Cabinet"
SYR_swear_loyalty_to_the_cabinet_desc: "The sheikh will kiss the hands of the ministers and swear that the Black Banner serves the republic. The moderates will hesitate, and our own men will wonder."
SYR_buy_off_the_informants: "Buy Off the Informants"
SYR_buy_off_the_informants_desc: "Money in the right pockets keeps the moderates' informants quiet a while longer, until the newspapers smell a scandal."
SYR_the_truce_of_the_holy_month: "Call a Truce for the Holy Month"
SYR_the_truce_of_the_holy_month_desc: "No Muslim will spill a brother's blood in the holy month. The truce buys us the most time, but the moderates will use it too."
SYR_raise_the_black_banner_now: "Raise the Black Banner Now"
SYR_raise_the_black_banner_now_desc: "Why wait for them to strike? If we rise today, the moderates will be caught in their barracks and offices."
SYR_win_the_mosques_of_FROM: "Win the Mosques of [FROM.GetName]"
SYR_win_the_mosques_of_FROM_desc: "Our preachers will spend weeks in the mosques of [FROM.GetName]. When the war comes, the faithful there will stand with us."
SYR_hide_rifles_in_the_mosques: "Hide Rifles in the Mosques"
SYR_hide_rifles_in_the_mosques_desc: "Crates of rifles leave the army depots for the mosque cellars, where smuggled weapons join them. The moderates will not be able to claim a share of them."
SYR_train_the_mujahideen: "Train the Mujahideen"
SYR_train_the_mujahideen_desc: "Young men of the quarters drill at night in the mosque courtyards. On the Day of Reckoning they will march as the Jund al-Raya."
SYR_seek_the_aid_of_FROM: "Seek the Aid of [FROM.GetName]"
SYR_seek_the_aid_of_FROM_desc: "We will ask our brothers in [FROM.GetNameDef] for rifles and volunteers for the war of faith."
syria.100.t: "The Black Banner Rises"
syria.100.d: "At dawn the call went out from the minarets of Damascus, and the men of the Black Banner took the ministries, the barracks and the radio station. Sheikh Muhammad al-Ashmar now governs in the capital. The moderate ministers fled to the provinces that still obey them and have proclaimed a government of their own. Syria is divided, and only war will unite it again."
syria.100.a: "God is with the faithful."
syria.101.t: "Syria's Sheikhs Ask for Aid"
syria.101.d: "Envoys of Sheikh Muhammad al-Ashmar, leader of the Black Banner in [FROM.GetNameDef], ask us for rifles and volunteers. They say their struggle against the moderates is a war of faith, and that their brothers must not let them fight it alone."
syria.101.a: "Send rifles and volunteers."
syria.101.b: "This is not our war."
syria.102.t: "Aid from [FROM.GetName]"
syria.102.d: "[FROM.GetNameDef] has answered our call. Caravans of rifles are crossing the desert, and a column of volunteers follows them."
syria.102.a: "Our brothers have not forgotten us."
syria.103.t: "[FROM.GetName] Refuses"
syria.103.d: "[FROM.GetNameDef] will send neither rifles nor men. Whatever they say of faith, their rulers fear the Black Banner as much as the moderates do."
syria.103.a: "We will win without them."
syria.104.t: "The Banner over Syria"
syria.104.d: "The last strongholds of the moderates have fallen, and their ministers are dead, in prison or in exile. From the Euphrates to the sea, Syria answers to the Black Banner and to Sheikh Muhammad al-Ashmar."
syria.104.a: "Now the Emirate must be built."
syria.105.t: "The Government Falls"
syria.105.d: "The moderates found no province willing to rise for them. Their ministers resigned one by one, and Sheikh Muhammad al-Ashmar entered the Grand Serail without a shot being fired. Syria now answers to the Black Banner."
syria.105.a: "Not a drop of blood was needed."
SYR_the_war_of_faith: "The War of Faith"
SYR_the_war_of_faith_desc: "Our soldiers believe that they fight for God, and men who believe that do not break easily."
SYR_the_surprise_rising: "The Surprise Rising"
SYR_the_surprise_rising_desc: "We struck before the moderates were ready. For a few weeks their units are scattered and our columns move freely."
SYR_the_rule_of_the_banner: "The Rule of the Banner"
SYR_the_rule_of_the_banner_desc: "The ulama sit in council beside the Emir, and the law of the Emirate is the law of God. Dissent is silent and the faithful are ready to serve."
SYR_muhammad_al_ashmar: "Muhammad al-Ashmar"
SYR_warrior_sheikh: "Warrior Sheikh"
SYR_black_banner_party: "Black Banner"
SYR_black_banner_party_long: "Society of the Black Banner"
SYR_emirate_of_sham: "The Emirate of Sham"
SYR_emirate_of_sham_DEF: "the Emirate of Sham"
SYR_emirate_of_sham_ADJ: "Shami"
SYR_faithful_state: "Mosques of the Black Banner"
SYR_faithful_state_desc: "The mosques of this state stand with the Black Banner. When the war of faith begins, the state stays with us."
SYR_call_of_the_faithful: "Call of the faithful"
SYR_aid_of_the_faithful: "Brothers in the war of faith"
SYR_rebuild_the_souks: "Rebuild the Souks"
SYR_rebuild_the_souks_desc: "The war has emptied the markets of Damascus and the provinces. Merchants who return under the Emirate's protection will find new workshops waiting for them."
SYR_the_zakat_treasury: "The Zakat Treasury"
SYR_the_zakat_treasury_desc: "The alms of the faithful are gathered into one treasury that pays for roads, mills and workshops instead of the pockets of the old notables."
SYR_the_call_to_the_arab_nations: "The Call Of God"
SYR_the_call_to_the_arab_nations_desc: "The Emirate of Sham will not stand alone. Every Arab nation will be called to bow to the Black Banner, and those that refuse will face its sword."
SYR_unlocks_arab_submission_tt: "Unlocks the decision §YDemand the Submission§! of an independent Arab nation: §YIraq§!, §YSaudi Arabia§!, §YYemen§!, §YTransjordan§!, §YLebanon§!, §YEgypt§!, §YKuwait§!, §YOman§!, §YPalestine§! or §YLibya§!. A nation that submits becomes our subject; one that refuses is attacked."
SYR_the_emirates_call: "The Emirate's Call"
SYR_the_peace_of_the_emirate: "The Peace of the Emirate"
SYR_the_peace_of_the_emirate_desc: "Order returns to the lands under the Banner: less unrest in occupied states and faster political power."
SYR_the_march_on_anatolia: "The March on Anatolia"
SYR_the_march_on_anatolia_desc: "The Emirate declares war on Turkey."
SYR_the_arsenal_of_the_banner: "The Arsenal of the Banner"
SYR_the_arsenal_of_the_banner_desc: "Army experience, weapons and doctrine research, and rifles for the army."
SYR_the_workshops_of_the_emirate: "The Workshops of the Emirate"
SYR_the_workshops_of_the_emirate_desc: "Every well-connected state of the Emirate sets up workshops abroad."
SYR_the_workshops_of_the_emirate_tt: "For every state we own and control with §Yinfrastructure 4§! or higher: gain §Y1§! off-map §YMilitary Factory§! and §Y1§! off-map §YCivilian Factory§!."
SYR_the_emirates_call_desc: "The Arab nations are called to submit to the Emirate of Sham. A nation that accepts becomes our subject and flies our colours; one that refuses will be brought to submission by war, and our armies fight with the fury of the Black Banner for §Y120§! days."
SYR_demand_the_submission_of_FROM: "Demand the Submission of [FROM.GetName]"
SYR_demand_the_submission_of_FROM_desc: "Envoys of the Emirate will tell [FROM.GetNameDef] to accept our protection, or to face the Black Banner in the field."
SYR_submission_refused_tt: "§R[FROM.GetNameDef] will declare war on us.§!"
syria.106.t: "The Emirate of Sham Demands Our Submission"
syria.106.d: "Envoys of Sheikh Muhammad al-Ashmar have arrived with a message from [FROM.GetNameDef]: we are to accept the protection of the Emirate and follow its lead in war and peace. Those who refuse, they say, will face the Black Banner in the field."
syria.106.a: "We will submit to the Emirate."
syria.106.b: "Never."
syria.107.t: "[FROM.GetName] Submits"
syria.107.d: "[FROM.GetNameDef] has accepted our protection. Its rulers will follow the Emirate of Sham, and the Black Banner's colours now fly beside its own."
syria.107.a: "Another nation under the Banner."
syria.108.t: "[FROM.GetName] Refuses"
syria.108.d: "[FROM.GetNameDef] has rejected our demand. The sheikhs say there is only one answer to such pride, and our columns are already marching."
syria.108.a: "Let the sword decide."
SYR_the_sword_of_the_emirate: "The Sword of the Emirate"
SYR_the_sword_of_the_emirate_desc: "Our soldiers march against those who refused the call, sure that God is with them."
