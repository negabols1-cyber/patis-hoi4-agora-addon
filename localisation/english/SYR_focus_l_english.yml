SYR_the_general_staff_copy_desc: "A permanent general staff plans the defence of the nation."
SYR_the_aleppo_textile_mills_copy2: "The Aleppo Gun Factories"
SYR_the_aleppo_textile_mills_copy2_desc: "Aleppo has woven silk and cotton for a thousand years. Modern looms will make it the mill town of the Levant."
SYR_the_jazira_wheat_frontier_copy: "Farmlands and Adamlar"
SYR_the_jazira_wheat_frontier_copy_desc: "Roads and settlers open the fertile plains of the Jazira, beyond the Euphrates."
SYR_the_damascus_industrial_zone_minesplaces: "§OThe Local Mines"
SYR_the_damascus_industrial_zone_minesplaces_desc: "New mines in the hills feed Syrian iron to Syrian Companies.  rise on the edge of the stongest city in the world."
SYR_the_moscow_unconnection: "Cut Connection with soviet"
SYR_the_moscow_unconnection_desc: "Syrian communism takes its orders from Damascus, not from Moscow."
SYR_coministeconomi: "Çiftçilere Yatırım"
SYR_coministe2: "Orduya Yatırım"
SYR_the_syrian_road_to_socialism: "The Syrian Road to Socialism"
SYR_the_syrian_road_to_socialism_desc: "Syria builds socialism its own way, suited to Arab land and Arab people."
SYR_the_damascus_plan: "The Damascus Plan"
SYR_the_damascus_plan_desc: "A state plan builds new factories in Damascus."
SYR_the_workers_militia: "The Workers' Militia"
SYR_the_workers_militia_desc: "Armed workers and peasants stand ready to defend their homeland."
SYR_the_workers_militia_2: "The Militia of the Revolution"
SYR_the_workers_militia_2_desc: "Veteran militia battalions stand beside the army to defend the revolution."
SYR_the_jazira_collective_farms: "The Jazira Collective Farms"
SYR_the_jazira_collective_farms_desc: "Collective farms, new roads and a mill open the Jazira plains."
SYR_defend_the_revolution: "Defend the Revolution"
SYR_defend_the_revolution_desc: "The army trains to hold Syrian soil against any invader."
SYR_the_neutral_peoples_republic: "The Federation of Socialist Levant States"
SYR_the_neutral_peoples_republic_desc: "Syria stands apart from every bloc, a socialist republic that answers to no one."
SYR_broke_with_moscow: "Broke with Moscow"
SYR_militias: "The People's Militias"
SYR_militias_desc: "Milis kuvetlerimiz varken kimlerin Ruslara ihtiyacı var ki?"
SYR_socialist_levant: "Federation of Socialist Levant States"
SYR_socialist_levant_DEF: "The Federation of Socialist Levant States"
