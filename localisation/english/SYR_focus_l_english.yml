# Autonomy changes
SYR_autonomy_treaty: "The Franco-Syrian Treaty"
SYR_autonomy_reforms: "Mandate reforms"
SYR_autonomy_arms: "Arms shipped to France"
SYR_autonomy_battalions: "Levantine battalions for France"

# Ideas
SYR_the_french_mandate: "The French Mandate"
SYR_the_french_mandate_desc: "Syria is governed by a French High Commissioner. Syrian ministers hold office, but the final word belongs to Paris."
SYR_no_air_force: "No Air Force"
SYR_no_air_force_desc: "Syria has no aircraft, no airfields of its own and no trained pilots; the skies belong to others."
SYR_northern_air_defence: "Northern Air Defence"
SYR_northern_air_defence_desc: "Anti-aircraft batteries along the northern frontier are built in Syrian workshops, cheaply and in numbers."
SYR_a_divided_land: "A Divided Land"
SYR_a_divided_land_desc: "The mandate split Syria into separate states for Damascus, Aleppo, the Druze and the Alawites. The country still does not act as one."
SYR_the_treaty_mandate: "The Treaty Mandate"
SYR_the_treaty_mandate_desc: "Under the Franco-Syrian Treaty, Syrians govern themselves while France keeps its advisers, bases and veto."
SYR_parliamentary_republic: "Parliamentary Republic"
SYR_parliamentary_republic_desc: "The government answers to an elected Chamber of Deputies."
SYR_arsenal_of_the_levant: "Arsenal of the Levant"
SYR_arsenal_of_the_levant_desc: "Syrian factories produce weapons for Syria and for France."
SYR_partner_of_the_french_union: "Partner of the French Union"
SYR_partner_of_the_french_union_desc: "Syria shares in the science, trade and strength of the French Union as an equal partner."
SYR_free_french_levant: "The Free French Levant"
SYR_free_french_levant_desc: "Syria stands with the France that fights on."
SYR_vichy_levant: "The Vichy Levant"
SYR_vichy_levant_desc: "Syria answers to the government at Vichy and keeps out of the war."
SYR_spirit_of_1925: "The Spirit of 1925"
SYR_spirit_of_1925_desc: "The memory of the Great Syrian Revolt keeps the nation ready to fight."
SYR_war_of_independence: "War of Independence"
SYR_war_of_independence_desc: "Every Syrian who can carry a rifle stands against the French army."
SYR_the_hashemite_crown: "The Hashemite Crown"
SYR_the_hashemite_crown_desc: "The heirs of the Arab Revolt sit on the throne of Damascus."
SYR_pipeline_transit_fees: "Pipeline Transit Fees"
SYR_pipeline_transit_fees_desc: "Fees from the Iraq Petroleum Company's pipeline flow into the treasury."
SYR_homs_military_academy: "Homs Military Academy"
SYR_homs_military_academy_desc: "Syrian officers learn their trade at Homs."

# Characters
SYR_khalid_bakdash: "Khalid Bakdash"
SYR_antun_saadeh: "Antun Saadeh"
