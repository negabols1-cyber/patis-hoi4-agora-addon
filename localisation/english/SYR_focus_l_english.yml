SYR_the_damascus_plan_copy: "The Damascus Plan with extra steps"
SYR_the_damascus_plan_copy_desc: "A state plan builds new factories in Damascus."
SYR_the_ssnp_militia_copy: "Barış birlikleri"
SYR_the_ssnp_militia_copy_desc: "The SSNP legions take the field, and the party chooses their task."
SYR_the_latakia_shipyards_copy: "Submarines"
SYR_the_latakia_shipyards_copy_desc: "Submarines are avaible"
SYR_the_aleppo_textile_mills_copy2_copy: "Yerelleştirilmiş Eskİ Fabrikalar"
SYR_the_aleppo_textile_mills_copy2_copy_desc: "Aleppo has woven silk and cotton for a thousand years. Modern looms will make it the mill town of the Levant."
SYR_war_industry_mobilization: "War Industry Mobilization"
SYR_war_industry_mobilization_desc: "Our army has grown large enough that it must be fed by our own factories. Every workshop in Aleppo will be turned to building arms plants."
SYR_war_industry_spirit: "War Industry Mobilization"
SYR_war_industry_spirit_desc: "The state directs labour and materials toward the construction of new arms factories."
SYR_war_industry_mobilization_stability_tt: "§YNote:§! If our §YStability§! is above §G60%§! when this focus completes, we receive §G4§! military factories instead of §Y2§!."
