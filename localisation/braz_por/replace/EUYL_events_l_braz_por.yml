l_braz_por:
### EUYL ###
 
 argentina.1.t:0 "Qual cidade devemos tornar a Capital?"
 argentina.1.d:0 "Com nossa recente conquista da crucial cidade de Buenos Aires, surge um dilema. Devemos fazer de Buenos Aires a capital, ou devemos manter o Paraná a capital? Ambas as cidades têm significados históricos para a Confederação Argentina. \n\n Paraná foi a capital da Confederação original após a secessão de Buenos Aires, e Buenos Aires foi e tem sido a capital tanto da Confederação quanto de todos os governos argentinos que tomaram o poder.\n\n Qual cidade poderíamos chamar de capital da Confederação Argentina?"
 argentina.1.a:0 "Tornar Buenos Aires a Capital"
 argentina.1.b:0 "Mantenha o Paraná a Capital"
 news.360.t:0 "A Confederação Argentina é estabelecida mais uma vez"
 news.360.d:0 "\nDepois que os sentimentos nacionalistas começaram a surgir na Argentina, muitas pessoas começaram a acreditar mais uma vez na Confederação como uma graça salvadora, que permitirá ao país avançar e se estabelecer como uma potência regional. \n\n Depois de uma brutal guerra civil em que a Confederação saiu vitoriosa, é de se perguntar o que eles vão fazer agora. \n\n Só o tempo dirá o que a ressurreição de um estado outrora abolido causará neste planeta."
 news.360.a:0 "Espere, há mais de uma Confederação nas Américas?"
 news.360.b:0 "O mundo agora conhecerá nossa verdadeira força!"
 argentina.2.t:0 "A Argentina acaba de anexar o Uruguai!"
 argentina.2.d:0 "Uruguai sempre foi uma área de grande interesse. Deixar para lá é algo que não pode ser feito. \n\n Desde o fim da guerra da Cisplatina e o Reino Unido nos tornando deixar de lado nossos territórios no Uruguai, sempre funcionou quase como um território-tampão, onde nenhum país pode e deve tocá-lo. Essa proposta foi respeitada até hoje, onde chegou a notícia de que a Argentina anexou o Uruguai. \n\n Os argentinos vão não espere um ataque nosso neste momento, então, quanto mais cedo cruzarmos a fronteira, melhor. Pegá-los desprevenidos será fundamental para que esta operação funcione. \n\nEntão, o que devemos fazer, devemos intervir e intervir, ou devemos nos conter e deixá-los ter o Uruguai?"
 argentina.2.a:0 "Entra, um tratado foi assinado e um tratado será respeitado!"
 argentina.2.b:0 "Talvez seja melhor deixarmos que eles tenham"
 argentina.3.t:0 "O Brasil nos declarou guerra!"
 argentina.3.d:0 "Após a anexação do Uruguai, o governo brasileiro decidiu responder declarando guerra contra nós. \n\n Há poucas horas chegaram relatos de que soldados brasileiros cruzaram a fronteira perto da província de Misiones .\n\n Qualquer que seja sua razão para declarar guerra a nós não tem absolutamente nenhum valor no cenário internacional, e eles estarão sozinhos neste conflito, como deveria ser."
 argentina.3.a:0 "Se esses malditos brasileiros querem uma guerra, eles vão conseguir!"
 news.738.t:0 "A Segunda Guerra Cisplatina"
 news.738.d:0 "Após a inesperada intervenção do Uruguai pelo governo argentino, o governo brasileiro decidiu responder invadindo-os, alegando que era errado simplesmente intervir nos assuntos do Uruguai como os argentinos fizeram. \n\n Conflitos já estão acontecendo em toda a fronteira e muitos estão preocupados que esta guerra possa se transformar em um banho de sangue, com ambos os lados igualmente ansiosos para lutar contra o outro. \n\n Só o tempo dirá como esse conflito evolui, no entanto, o situação parece bastante sombria."
 news.738.a:0 "O que diabos está acontecendo naquele continente?"
 news.738.c:0 "Vamos mostrar a esses argentinos que você não mexe com a soberania dos outros!"
 news.738.b:0 "Esses traficantes de guerra apareceram para um show, e oh cara, eles vão ter um show!"
 argentina.4.t:0 "Fizemos todos os danos necessários ao Brasil"
 argentina.4.d:0 "Com as baixas se acumulando no lado brasileiro e muitas de suas cidades e territórios do sul ocupados, parece improvável que os brasileiros queiram continuar esta guerra. \n\n Devemos fazer as pazes com eles, aproveitar a situação e exigir Santa Catarina, ou simplesmente continuar a guerra?"
 argentina.4.a:0 "Faça as pazes com os brasileiros"
 argentina.4.b:0 "Faça as pazes e exija o Rio Grande Sul"
 argentina.4.c:0 "Continue"
 argentina.5.t:0 "Argentina quer ter negociações de paz"
 argentina.5.d:0 "Diplomatas argentinos chegaram hoje para discutir as negociações de paz. \n\n Esta guerra colocou uma grande pressão sobre nossos recursos, mão de obra e indústria. \n\n Até agora nada de bom veio de lá este conflito. \n\n Considerando nossa situação atual, que escolha devemos fazer?"
 argentina.5.a:0 "Aceitar a proposta de paz"
 argentina.5.b:0 "Estamos lutando por uma causa! Continue a guerra!"
 argentina.5.c:0 "Aceite a paz e tome Misiones"
 argentina.6.t:0 "A Argentina está exigindo o Rio Grande Sul e a Paz"
 argentina.6.d:0 "Diplomatas argentinos chegaram hoje, exigindo negociações de paz e nosso estado do Rio Grande Sul. \n\n Esta guerra colocou uma forte pressão sobre nossos recursos, mão de obra e indústria. \n\n Então até agora nada de bom veio desse conflito. \n\n Considerando nossa situação atual, que escolha devemos fazer?"
 argentina.6.a:0 "Cede às suas demandas"
 argentina.6.b:0 "Quem esses argentinos pensam que são? Continue a guerra!"
 argentina.7.t:0 "Brasil aceita nossa proposta"
 argentina.7.d:0 "O Brasil aceitou nossa proposta e não haverá mais conflito armado entre nossas duas nações."
 argentina.7.a:0 "Ótimo! Os brasileiros fizeram a escolha certa!"
 argentina.8.t:0 "Brasil rejeita nossa proposta"
 argentina.8.d:0 "O Brasil acaba de nos retornar dizendo que rejeita nossa proposta. \n\n Permanecerá um estado de conflito armado entre nossas nações."
 argentina.8.a:0 "Eles não se importam com o bem-estar de seu país?"
 argentina.9.t:0 "Os argentinos estão exigindo as Malvinas"
 argentina.9.d:0 "Diplomatas argentinos chegaram hoje a Londres para nos dizer que estão exigindo que cedamos as Ilhas Malvinas a eles. \n\n Damos a eles as Malvinas ou recusamos?"
 argentina.9.a:0 "Deixe-os, perder algumas ilhas não fará mal nenhum"
 argentina.9.b:0 "Esses Argies realmente acham que vamos dar a eles um centímetro de nossa terra?"
 argentina.10.t:0 "A caverna britânica à nossa procura"
 argentina.10.d:0 "Os britânicos responderam aos nossos diplomatas, dizendo que aceitam nossas exigências e vão ceder o território."
 argentina.10.a:0 "Ótimo! Talvez os britânicos não sejam tão ruins assim"
 argentina.11.t:0 "Os britânicos recusam nossas demandas"
 argentina.11.d:0 "Os britânicos responderam aos nossos diplomatas, dizendo que não aceitam nossas exigências e não nos darão o território."
 argentina.11.a:0 "Esses malditos piratas verão nosso poder!"
 argentina.12.t:0 "Os argentinos estão exigindo a Geórgia do Sul"
 argentina.12.d:0 "Diplomatas argentinos chegaram hoje a Londres, exigindo que cedamos o território da Geórgia do Sul. \n\n Damos a Geórgia do Sul ou recusamos?"
 argentina.12.a:0 "Deixe-os tomar, quase ninguém vive mais lá"
 argentina.12.b:0 "Absolutamente não! Não estamos dando nada a esses Argies!"
 argentina.13.t:0 "A Argentina está exigindo Tarija!"
 argentina.13.d:0 "A Argentina está exigindo que cedamos a eles a província de Tarija, um território que possuímos atualmente. \n\n No entanto, não temos o exército para enfrentá-los, então talvez a melhor escolha seja ser ceder. O que devemos fazer?"
 argentina.13.a:0 "Dê-lhes Tarija"
 argentina.13.b:0 "Se for preciso, lutaremos pela nossa terra!"
 argentina.14.t:0 "[From.GetName] cede às nossas demandas"
 argentina.14.d:0 "O governo de [From.GetName] acaba de responder às nossas demandas, dizendo que nos cederá o território de Tarija."
 argentina.14.a:0 "Eles escolheram o caminho mais fácil"
 argentina.15.t:0 "[From.GetName] se recusou a nos dar Tarija!"
 argentina.15.d:0 "O governo [From.GetName] respondeu às nossas demandas, dizendo que eles não nos darão o território de Tarija. Eles afirmam que se eles tiverem que lutar pelo território, eles vão até o último soldado!"
 argentina.15.a:0 "Ah, eles verão nosso poder!"
 argentina.16.t:0 "A Argentina está exigindo que demos a eles Santa Catarina!"
 argentina.16.d:0 "A Argentina está exigindo que demos a eles Santa Catarina, um território que eles possuíam no início de sua vida como país. No entanto, eles não possuem mais isso, e nós possuímos esse território há muitas décadas agora e as pessoas lá são mais brasileiras do que argentinas. \n\n Devemos ceder ou recusar?"
 argentina.16.a:0 "Precisamos manter a Paz, mesmo que seja à custa do nosso território"
 argentina.16.b:0 "Eles realmente acham que vamos desistir tão facilmente?"
 argentina.17.t:0 "Brasil entrega Santa Catarina"
 argentina.17.d:0 "O governo brasileiro veio com a resolução pacífica de nos entregar o estado de Santa Catarina. Com este novo território estamos a um passo de alcançar nosso objetivo final."
 argentina.17.a:0 "Ainda bem que pudemos ter uma solução pacífica com os brasileiros"
 argentina.18.t:0 "Brasil se recusa a nos dar Santa Catarina"
 argentina.18.d:0 "O governo brasileiro respondeu às nossas demandas, afirmando com firmeza que Santa Catarina é seu território e que não nos entregará o território."
 argentina.18.a:0 "Esses malditos brasileiros"
 news.339.t:0 "Nasce a Grande Confederação Argentina"
 news.339.d:0 "Depois de várias conquistas contra seus vizinhos, tomando território deles e causando muita tensão na América do Sul, a Confederação Argentina anunciou que agora será chamada de "Grande Confederação Argentina". \n\n A nação parece ser muito mais forte do que outros anteciparam anteriormente, e sendo uma potência fascista, talvez possa até virar a maré da guerra na Europa."
 news.339.a:0 "Ótimo para eles, eu acho?"
 news.339.b:0 "Agora o mundo realmente verá nosso poder!"
 news.339.c:0 "Eles vão pagar pelo que fizeram!"
 argentina.19.t:0 "A Argentina quer se juntar à nossa facção"
 argentina.19.d:0 "A Argentina está pedindo para se juntar à nossa facção. Não só temos um inimigo comum, mas suas crenças também se correlacionam com as nossas. \n\n Devemos deixá-los entrar?"
 argentina.19.a:0 "Claro, deixe-os entrar!"
 argentina.19.b:0 "Eles não são confiáveis ​​o suficiente"
 argentina.20.t:0 "A Alemanha aceitou nosso pedido de adesão ao Eixo"
 argentina.20.d:0 "Diplomatas alemães responderam positivamente ao nosso pedido de adesão ao Eixo, e agora estaremos em sua facção."
 argentina.20.a:0 "Ótimo, agora é hora de focar no nosso inimigo comum!"
 argentina.21.t:0 "A Alemanha recusou nosso pedido de adesão ao Eixo"
 argentina.21.d:0 "Diplomatas alemães responderam ao nosso pedido de adesão ao Eixo. Eles nos disseram que não estão dispostos a nos aceitar em nossa facção."
 argentina.21.a:0 "Então eles morrerão sozinhos!"
 argentina.23.t:0 "Argentina propõe uma aliança econômica entre nossas nações"
 argentina.23.d:0 "Diplomatas argentinos chegaram hoje a Madri não apenas para nos parabenizar por nossa recente vitória na guerra civil, mas também para propor uma aliança econômica entre nossa nação. \n\n Os diplomatas nos disseram que A cooperação de ambas as economias ajudará os dois países igualmente, aparentemente sem desvantagens. Além disso, a cooperação econômica também nos permitirá desenvolver laços mais próximos com a Argentina, e pode ser bastante útil ter um aliado sul-americano. \n\n Aceitamos sua proposta de cooperação econômica?"
 argentina.23.a:0 "Com certeza, por que não?"
 argentina.23.b:0 "Não precisamos de nenhum 'pacto' desses argentinos"
 argentina.24.t:0 "Espanha aceita nossa cooperação econômica"
 argentina.24.d:0 "Diplomatas espanhóis responderam aos nossos diplomatas, dizendo que estão dispostos a continuar com esta aliança econômica e fornecer quaisquer bens ou serviços necessários para que ela funcione."
 argentina.24.a:0 "Ótimo! Que ambas as economias se beneficiem deste pacto"
 argentina.25.t:0 "Espanha recusa nossa cooperação econômica"
 argentina.25.d:0 "Diplomatas espanhóis responderam aos nossos diplomatas dizendo que não aceitariam nossa proposta de aliança econômica."
 argentina.25.a:0 "Vergonhoso"
 argentina.26.t:0 "Roberto desce do poder"
 argentina.26.d:0 "O presidente anunciou hoje que não será mais capaz de liderar a nação. Seu diabetes avançou tanto a ponto de ele mal conseguir enxergar, que um longo tempo com outras condições de saúde deterioradas faz com que Roberto incapaz de liderar a nação. Por enquanto, precisaremos do vice-presidente para liderar a nação."
 argentina.26.a:0 "O que o futuro trará para esta nação?"
 argentina.27.t:0 "Argentina procura se unir aos aliados"
 argentina.27.d:0 "Diplomatas argentinos chegaram hoje a Londres para discutir se sua nação pode ou não se juntar à nossa aliança. \n\nAgora sendo um estado democrático, ter um aliado na América do Sul não seria tão ruim assim . \n\nDevemos deixá-los entrar?"
 argentina.27.a:0 "Aceitar"
 argentina.27.b:0 "Recusar"
 argentina.28.t:0 "A Grã-Bretanha nos permitirá entrar nos Aliados"
 argentina.28.d:0 "Os britânicos responderam aos nossos diplomatas, dizendo que estarão mais do que dispostos a nos permitir entrar nos Aliados."
 argentina.28.a:0 "Ótimo!"
 argentina.29.t:0 "A Grã-Bretanha se recusou a nos permitir entrar nos Aliados"
 argentina.29.d:0 "Os britânicos responderam aos diplomatas que enviamos a eles, dizendo que não nos permitirão entrar em sua facção."
 argentina.29.a:0 "Acho que vamos sozinhos agora"
 argentina.30.t:0 "A Argentina propõe uma aliança militar"
 argentina.30.d:0 "A Argentina acaba de nos contatar com uma proposta bastante repentina, uma aliança militar. \n\nEmbora tenhamos laços muito estreitos com o ocidente europeu, seria bom ter outro aliado de estilo liberal para para trabalharmos juntos. \n\nDevemos aceitar a proposta deles?"
 argentina.31.t:0 "Os americanos aceitaram nossa proposta"
 argentina.31.d:0 "Os americanos responderam dizendo que estão dispostos a fazer uma aliança militar entre nossas 2 nações"
 argentina.31.a:0 "Ótimo!"
 argentina.32.t:0 "Os americanos recusaram nossa proposta"
 argentina.32.d:0 "Os americanos recusaram nossa proposta de fazer uma aliança, considerando-a 'sem sentido'."
 argentina.32.a:0 "Esses malditos americanos"
 argentina.33.t:0 "[FROM.GetName] quer uma soneca conosco"
 argentina.33.d:0 "[FROM.GetName] nos abordou com um pedido bastante simples, a assinatura de um pacto de não agressão. Eles concordaram que tanto eles quanto seus aliados estarão dispostos a decretar NAPs conosco e deixar ir de qualquer hostilidade entre nossas nações. \n\nDevemos aceitar?"
 argentina.33.a:0 "Claro"
 argentina.33.b:0 "Não precisamos de nenhum de seus 'pactos'"
 argentina.34.t:0 "[FROM.GetNameDEF] aceitou nossa proposta"
 argentina.34.d:0 "[FROM.GetNameDEF] voltou para nós, dizendo que concorda em assinar um NAP"
 argentina.35.t:0 "[FROM.GetNameDEF] recusou nossa proposta"
 argentina.35.d:0 "[FROM.GetNameDEF] voltou para nós, dizendo que não assinará um NAP conosco."
 argentina.35.a:0 "Eles estão tramando alguma coisa"
 argentina.36.t:0 "A Argentina está pedindo as Malvinas"
 argentina.36.d:0 "Diplomatas argentinos chegaram hoje para discutir a questão das Malvinas. Agora que nossos dois países estão em boas relações e são aliados, eles acreditam que seria justo que eles tivessem controle sobre as ilhas. Eles até dizem que estão dispostos a nos ajudar no futuro em compensação por nós lhes darmos as ilhas. Devemos deixá-los ficar com as ilhas?"
 argentina.36.a:0 "Claro, eles podem tê-los"
 argentina.36.b:0 "Não, são Nossas Ilhas"
 argentina.37.t:0 "Os britânicos nos permitem ter as Malvinas"
 argentina.37.d:0 "Os britânicos nos permitiram assumir o controle das Malvinas com o simples pedido de cuidar da população britânica original."
 argentina.37.a:0 "Ótimo, vamos cuidar bem deles"
 argentina.38.t:0 "Os britânicos não nos permitirão controlar as Malvinas"
 argentina.38.d:0 "Os britânicos responderam aos nossos diplomatas, dizendo que não nos permitirão assumir o controle das ilhas."
 argentina.38.a:0 "Esses malditos britânicos..."
 argentina.39.t:0 "A Argentina está pedindo pela Geórgia do Sul"
 argentina.39.d:0 "Diplomatas argentinos chegaram hoje para discutir a questão da Geórgia do Sul. Agora que nossos dois países estão em boas relações e são aliados, eles acreditam que seria justo que eles tivessem o controle sobre a ilha. Eles até dizem que estão dispostos a nos ajudar no futuro em compensação por termos dado a eles as ilhas. Devemos deixá-los ficar com a ilha?"
 argentina.40.t:0 "Os britânicos nos permitem ter a Geórgia do Sul"
 argentina.40.d:0 "Os britânicos nos permitiram assumir o controle da Geórgia do Sul com o simples pedido de cuidar da população britânica original."
 argentina.41.t:0 "Os britânicos não nos permitirão controlar a Geórgia do Sul"
 argentina.42.t:0 "A Argentina está exigindo o controle da Ilha da Ascensão e de Santa Helena"
 argentina.42.d:0 "O governo argentino entrou em contato conosco recentemente, perguntando se eles poderiam ter controle sobre a ilha de Ascensão e Santa Helena. \n\nIsso permitirá que eles tenham controle sobre todo o Mar Atlântico Sul, então devemos permitir que eles possuam tal território?"
 argentina.43.t:0 "A Grã-Bretanha nos permitiu ocupar a Ilha da Ascensão e Santa Helena"
 argentina.43.d:0 "Os britânicos nos responderam dizendo que nos permitirão ter controle sobre as ilhas e controle total sobre o Atlântico Sul."
 argentina.44.t:0 "A Grã-Bretanha não nos permitirá ter controle sobre a ilha da Ascensão e Santa Helena"
 argentina.44.d:0 "Os britânicos responderam ao nosso pedido, dizendo que não nos permitirão ter controle sobre as ilhas."
 argentina.45.t:0 "Peron viaja para a Itália"
 argentina.45.d:0 "Perón deixou o país e está indo para a Itália depois que o Ministério da Guerra o designou para isso. \n\n Ele tem a tarefa de aprender sobre táticas de guerra italianas e aprender sobre guerra de montanha no italiano Alpes. Ele está planejando ficar por pelo menos 2 anos antes de viajar de volta para a Argentina. \n\n Só o tempo dirá se ele também volta com os ideais fascistas italianos, e por enquanto devemos simplesmente esperar."
 argentina.45.a:0 "Boa sorte, Perón"
 argentina.46.t:0 "Peron retornou à Argentina"
 argentina.d.46:0 "Depois de ficar no exterior por um tempo, Perón retornou à Argentina com novos conhecimentos sobre táticas de guerra, mas também sobre ideais políticos e relações exteriores. \n\nCom novos conhecimentos, experiências e conexões, está claro que Perón tentará subir na hierarquia da nação."
 argentina.46.a:0 "Bem-vindo de volta, Perón"
 argentina.47.t:0 "O Grande Golpe"
 argentina.47.d:0 "Após meses de planejamento e análise cuidadosos, as facções dos militares finalmente se cansaram do governo atual e tomaram as próprias maneiras. \n\n O atual presidente e seus colegas foram forçados a sair da Casa Rosada hoje, e os generais militares decidiram unanimemente colocar Perón no poder. \n\n Essa mudança repentina no poder resultará bastante difícil para Perón no início, mas ele parece promissor."
 argentina.47.a:0 "Que Deus nos guie"
 argentina.48.t:0 "O escândalo do hospital militar"
 argentina.48.d:0 "Quase meio ano após a inauguração do Hospital Militar de Palomar, o senador Benjamín Villafañe entrou com uma ação contra nós e os militares por este mesmo hospital. \n\nO motivo da ação foi devido a a venda de terrenos para o Hospital Militar. Os terrenos foram vendidos por um preço muito maior do que realmente eram. O senador afirma que o restante do dinheiro que ainda precisa ser pago deve ser distribuído entre deputados e funcionários, também como funcionários do Ministério da Guerra. \n\nTudo o que podemos fazer agora é esperar que os senadores na assembléia legislativa votem se somos inocentes ou não e se temos que devolver o dinheiro."
 argentina.48.a:0 "Vamos torcer para que a Assembleia Legislativa perceba que somos inocentes"
 argentina.49.t:0 "A Assembleia Legislativa concordou por unanimidade que somos inocentes"
 argentina.49.d:0 "Os senadores votaram e os resultados chegaram. A esmagadora maioria dos senadores votou que tanto Roberto quanto o governo são inocentes e não têm obrigação de devolver nenhum dinheiro. Na verdade, 170 votos eram a favor da nossa inocência, enquanto apenas um era contra a nossa inocência."
 argentina.49.a:0 "Parece que os senadores nos apoiam"
 argentina.50.t:0 "A Assembleia Legislativa votou que devemos pagar a Dívida"
 argentina.50.d:0 "Os senadores votaram e os resultados chegaram. Pouco mais da metade dos senadores votaram que somos culpados de tais atos e que devemos pagar a dívida. É muito triste que os senadores não podem ver o fato de que somos inocentes, mas devemos obedecer."
 argentina.50.a:0 "Não podemos confiar em ninguém"
 argentina.51.t:0 "Os militares não estão satisfeitos com o sucessor de [Root.GetLeader]"
 argentina.51.d:0 "Depois de ouvir sobre o sucessor de [Root.GetLeader], várias partes dos militares começaram a conspirar contra o governo, na esperança de derrubá-lo. \n\nOs planos já começaram e não se sabe como quais são suas intenções finais. Tudo o que sabemos é que, se esse 'golpe' não for tratado imediatamente, estaremos com sérios problemas".
 argentina.51.a:0 "O QUE! Esses malditos bastardos!"
 argentina.52.t:0 "Os militares executaram seu plano"
 argentina.52.d:0 "Os militares executaram seu tão esperado plano. Depois de meses de planejamento cuidadoso, parece que todo o inferno foi solto. \n\nSó o tempo dirá qual será o futuro deste país, no entanto, o futuro parece bastante sombrio."
 argentina.52.a:0 "Que Deus nos salve deste inferno"
 argentina.53.t:0 "O que devemos fazer com as Milícias?"
 argentina.53.d:0 "Com a guerra civil fora do caminho, ainda temos a questão do que fazer com as milícias restantes. \n\nÀ mão, podemos mantê-los no exército e talvez até treiná-los para ser ainda melhor, e por outro lado podemos dissolvê-los e manter tanto a mão de obra que foi usada para essas milícias quanto os equipamentos que elas adquiriram. \n\nO que devemos fazer?"
 argentina.53.a:0 "Mantenha-os"
 argentina.53.b:0 "Dissolva-os e armazene os equipamentos e mão de obra"
 argentina.54.t:0 "Ramirez é forçado a deixar o poder"
 argentina.54.d:0 "Após o aumento das tensões no globo, as tensões também foram aumentando nos bastidores. Depois de cortar todos os laços com os japoneses e os alemães, muitos partidários do golpe original não vêem mais Ramirez apto para liderar a nação, e decidiram expulsá-lo. \n\nA pessoa que está levando esses homens a Ramirez? Edelmiro Julian Farrell, um dos principais contribuintes da trama militar que foi realizada há cerca de um ano. \n\nEssa mudança repentina de poder pode pegar muitas pessoas de surpresa e podem até colocar o país em turbulência, então esperamos que isso não ocorra."
 argentina.54.a:0 "Que diabos está acontecendo!"
 argentina.55.t:0 "A situação da Argentina em 1939"
 argentina.55.d:0 "Roberto provou ser um líder competente a partir de agora, no entanto, sua condição de saúde está se deteriorando rapidamente desde que foi eleito. Os médicos não sabem quanto tempo ele vai durar, e estimativas aproximadas sugerem que ele será forçado a se aposentar por volta de 1942. \n\nAssim como na situação de Perón, ele está atualmente na Itália estudando guerra nas montanhas. Mas tome cuidado com sua chegada, pois sua política começará a mudar quando ele chegar."
 argentina.55.a:0 "Entendi"
 argentina.56.t:0 "A Argentina está adulterando nossa política"
 argentina.56.d:0 "Diplomatas da Confederação Argentina chegaram hoje a Montevidéu para discutir planos com nosso partido fascista. \n\nPelo visto não parece nada bom, e pode até ser devastador Se permitirmos. No entanto, contra todas as probabilidades, alguns de nossos povos estão realmente apoiando isso e até defendendo a anexação. \n\nO que quer que os argentinos tenham feito, precisamos responder a isso e rápido, o que devemos fazer?"
 argentina.56.a:0 "Deixe-os, não deve nos prejudicar no futuro"
 argentina.56.b:0 "NÃO, quem esses argentinos pensam que são?!"
 argentina.57.t:0 "Os uruguaios nos permitiram influenciar sua política"
 argentina.57.d:0 "Chegou hoje uma declaração oficial do Uruguai, dizendo que vão permitir a adulteração de sua política desde que não prejudique o povo."
 argentina.57.a:0 "Ótimo, nosso plano pode começar"
 argentina.58.t:0 "Os uruguaios falharam conosco"
 argentina.58.d:0 "Os uruguaios falharam conosco e nossos planos foram arruinados. Infelizmente, ao que parece, parece que afinal não teremos uma fácil anexação do Uruguai."
 argentina.58.a:0 "Acho que vamos ter que fazer da maneira mais difícil"
 argentina.59.t:0 "A Argentina declarou guerra ao Uruguai!"
 argentina.59.d:0 "Acabamos de receber a notícia de que tropas argentinas cruzaram a fronteira uruguaia, com o que parecem ser intenções de anexação. \n\nA última vez que a Argentina tentou algo semelhante a isso, intervimos e defendemos o Uruguai de uma anexação argentina, e esta situação parece muito familiar. \n\nDevemos ajudar nossos irmãos e irmãs uruguaios e derrotar os argentinos?"
 argentina.59.a:0 "Absolutamente, não derramamos sangue na guerra anterior sem motivo!"
 argentina.59.b:0 "Desculpe Uruguai, mas não podemos ajudá-lo desta vez"
 argentina.60.t:0 "O Brasil estará nos ajudando na guerra!"
 argentina.60.d:0 "Diplomatas brasileiros chegaram hoje a Montevidéu, prometendo sua ajuda e total apoio durante a guerra. Enviarão tropas e equipamentos para combater os argentinos."
 argentina.60.a:0 "Obrigado Brasil! Hora de mostrar aos argentinos do que realmente somos feitos!"
 argentina.61.t:0 "O Brasil estará ajudando o Uruguai neste conflito!"
 argentina.61.d:0 "Muitos de nossos soldados na linha de frente relataram tropas brasileiras se mobilizando na linha de frente uruguaia e até atirando em nossos soldados, sinalizando apenas uma possibilidade: o Brasil está ajudando o Uruguai. \n\nA situação parece sombria para nós, mas uma vitória ainda é possível."
 argentina.61.a:0 "Esses malditos brasileiros vão pagar! Ambos vão pagar!"
 news.340.t:0 "Revolta Anarquista no Chile"
 news.340.d:0 "Após meses de instabilidade política e protestos em massa, o povo do Chile se levantou hoje para lutar por seus ideais, no entanto, o único problema é que eles não têm ideais. \n\nOs anarquistas não querem nada mais do que a falta de governo ou poder unificado, um estado governado apenas pelo povo. Muitos países já estão ficando preocupados com os anarquistas, agora que há 2 revoltas em 2 partes separadas do mundo. \n\nSó o tempo dirá o que vai acontecer, mas não podemos permitir que o anarquismo governe o planeta."
 news.340.a:0 "Ótimo, exatamente o que precisávamos..."
 news.340.b:0 "Agora é nossa hora de brilhar!"
 news.340.c:0 "O QUE????????"
 argentina.63.t:0 "Submarinos alemães lavados"
 argentina.63.d:0 "Hoje, muitos moradores de Mar del Plata relataram dois submarinos alemães chegando à costa após sua perda na Segunda Guerra Mundial. \n\nResta especular como eles chegaram aqui, o que aconteceu para os membros da tripulação, e qual era sua tarefa para eles estarem tão perto da América do Sul. \n\nSuas tecnologias parecem ser bastante avançadas, e podemos até usar esses submarinos para melhorar nossos próprios submarinos."
 argentina.63.a:0 "Vamos dar uma olhada neles!"
 argentina.65.t:0 "Inflação Piora Ligeiramente"
 argentina.65.d:0 "Nossa inflação disparou recentemente devido a várias razões. O pico não parece tão ruim, e parece que pode ser controlado, mas por enquanto devemos ficar de olho em nossa inflação e fazer certeza que não sai do controle."
 argentina.65.a:0 "Vamos lidar com essa inflação miserável!"
 argentina.66.t:0 "Inflação piora severamente"
 argentina.66.d:0 "O valor monetário de nossa moeda caiu recentemente e fez com que nossa inflação disparasse temporariamente. Isso está longe de ser o ideal e poderia arruinar nossos planos para conter a inflação. No entanto, devemos lidar com esse revés e certifique-se de que não tire o melhor de nós. Para o bem maior da Argentina!"
 argentina.66.a:0 "Que diabos?!"
 argentina.67.t:0 "A Argentina está se expandindo muito agressivamente!"
 argentina.67.d:0 "A Argentina recentemente declarou guerra a mais uma nação na esperança de expandir ainda mais seu território. Isso precisa parar agora ou então eles ganharão muito poder! Não só isso, mas também podemos ganhar nosso próprio benefício pessoal de intervir em seu conflito, então devemos intervir?"
 argentina.67.a:0 "Não devemos intervir"
 argentina.67.b:0 "Abaixo os argentinos!"
 argentina.68.t:0 "Devemos Formar o Pacto Anti-Peru-Bolívia"
 argentina.68.d:0 "Com a Segunda Guerra da Confederação em pleno andamento e várias outras nações em guerra com a Confederação, deve-se perguntar: Devemos criar uma facção entre todos nós e ajudar uns aos outros contra essa ameaça? \n\nPor enquanto a resposta é..."
 argentina.68.a:0 "Sim"
 argentina.68.b:0 "Não"
 argentina.69.t:0 "Abraham Schweizer faleceu"
 argentina.69.d:0 "Chegou a notícia de que um de nossos melhores generais e marechais de campo, Abraham Schweizer, morreu em um acidente de avião. \n\nTodo o país lamentará sua morte, e sua morte não será Precisamos ter certeza de que isso não aconteça novamente."
 argentina.69.a:0 "Que descanse em paz"
 argentina.70.t:0 "Quem deve liderar a Confederação?"
 argentina.70.d:0 "Poucos dias depois de iniciar nossa guerra civil, um homem chamado Manuel Carlés manifestou sua objeção a Nimio ser líder, e como líder da Liga Patriótica Argentina ele acredita que seu partido deve ser o único para assumir o controle da nação. \n\nA escolha agora é do povo, quem deve liderar a Confederação entre os dois?"
 argentina.70.a:0 "Manuel Carlés"
 argentina.70.b:0 "Nimio de Anquín"
 news.341.t:0 "A Grande Guerra Sul-Americana"
 news.341.d:0 "Após uma recente declaração de guerra dos argentinos, várias outras nações sul-americanas declararam guerra à Argentina com a esperança de interromper sua ambição expansionista. chance de eles vencerem tal conflito, se eles conseguirem tal feito, eles podem ganhar muito poder na região. \n\nMuitos estão com medo de quão sangrenta essa guerra pode ser, ela pode até se tornar a mais sangrenta conflito na história da América do Sul. Vamos ter que esperar para ver."
 news.341.a:0 "Aquele continente não era o mais chato? O inferno está acontecendo!?"
 news.341.b:0 "Eles vão pagar com seu sangue! Mobilizem as reservas!"
 news.341.c:0 "Os argentinos não têm chance!"
 argentina.71.t:0 "O terremoto de 1944 em San Juan"
 argentina.71.d:0 "Triste notícia atingiu a população de [ROOT.GetName] hoje, quando um terremoto de magnitude 6,7 a 7,8 atingiu a província de San Juan. Estima-se que cerca de 10.000 pessoas morreram nesta tragédia, e muitos outros podem vir em breve. \n\nNão apenas isso, mas o terremoto danificou fortemente a infraestrutura da província e muitos edifícios. O custo de consertar todos esses danos será muito alto, e é dinheiro que teremos que sacrificar de outras partes da economia decolar. \n\nTudo o que podemos fazer agora é lamentar aqueles que morreram e estabelecer novos regulamentos para evitar que uma tragédia como essa ocorra novamente."
 argentina.71.a:0 "Que essas pobres almas descansem em paz"
 
 argentina.temp.t:0 "Quem deve liderar nosso país?"
 argentina.temp.d:0 "Agora que estamos nas mãos do país, surge um dilema: Quem vai liderar nosso país? Há dois grandes concorrentes para liderar nosso país, sendo Fanny Edelman e Liborio Justo. Ambos são dedicados para representar o comunismo argentino com todo o coração e levar o país à glória. \n\nQuem será o responsável?"
 argentina.temp.a:0 "Libório Justo"
 argentina.temp.b:0 "Fanny Edelman"

 argentina.rework.1.t:0 "Vamos realizar as próximas eleições?"
 argentina.rework.1.d:0 "O mandato de 6 anos de Justo está chegando ao fim, e as pessoas esperam que as eleições aconteçam em breve. \n\nNós, no entanto, temos o poder de simplesmente não realizar as eleições e manter Justo no poder, afinal, os militares devem nos apoiar e lidar com pessoas que possam se opor a isso. \n\nNo final, a escolha é nossa. O que devemos fazer..."
 argentina.rework.1.a:0 "Manter as eleições"
 argentina.rework.1.b:0 "Justo permanecerá no poder, aconteça o que acontecer!"
 argentina.rework.2.t:0 "Escândalo da Corte"
 argentina.rework.2.d:0 "A corrupção no país causou um escândalo no cenário político do país. Políticos corruptos estão manipulando os cordelinhos para se beneficiar sem se importar com mais ninguém. \n\nO que devemos fazer com essa bagunça ?"
 argentina.rework.2.a:0 "Desafie de frente"
 argentina.rework.2.b:0 "Vamos varrer para debaixo do tapete"
 argentina.rework.3.t:0 "Oligarca corrupto foi encontrado!"
 argentina.rework.3.d:0 "Depois de realizar uma extensa investigação em nosso governo, descobrimos um oligarca corrupto entre nós. Agora que os temos em nossas mãos, o que devemos fazer?"
 argentina.rework.3.a:0 "Expulse-os do país"
 argentina.rework.3.b:0 "Varrer nossas descobertas para debaixo do tapete"
 argentina.rework.4.t:0 "A investigação acabou sendo um fracasso"
 argentina.rework.4.d:0 "Nossa investigação provou ser um fracasso, pois nossos investigadores não conseguiram encontrar nenhuma prova concreta sobre qualquer forma de corrupção ou político corrupto presente no governo."
 argentina.rework.4.a:0 "Podemos obter melhores resultados da próxima vez"
 argentina.rework.ALN.t:0 "A Formação da Alianza Libertadora Nacionalista"
 argentina.rework.ALN.d:0 "Chegou-nos a notícia de que a Legião Cívica Argentina foi dissolvida e transformada na Alianza Libertadora Nacionalista sob a liderança de Juan Queraltó. \n\nEle é um partido extremista que se assemelha muito para o partido NSDAP na Alemanha nazista. Precisamos ficar de olho neste novo partido, eles podem não estar fazendo nada de bom."
 argentina.rework.ALN.a:0 "Precisamos ter cuidado"
 argentina.rework.5.t:0 "Ataque terrorista da ALN!"
 argentina.rework.5.d:0 "Repórteres de notícias inundaram os rádios quando chegaram notícias de um ataque terrorista não provocado pelo partido ALN. Precisamos lidar com eles rapidamente e impedi-los de continuar com essa fúria selvagem!"
 argentina.rework.5.a:0 "Eles vão pagar por isso!"
 argentina.rework.6.t:0 "Sede da ALN encontrada"
 argentina.rework.6.d:0 "Após nosso recente encerramento da confusão causada pelo ALN, encontramos informações bastante intrigantes sobre o quartel-general deles. Com o quartel-general, eles não terão escolha a não ser ficar quietos e se lembrar. \n\nO que vem a seguir deve ser óbvio."
 argentina.rework.6.a:0 "Vise e destrua-o!"
 argentina.rework.7.t:0 "Os militares estão descontentes com nosso atual governo"
 argentina.rework.7.d:0 "A tensão no cenário político da Argentina está se descontrolando rapidamente, e os militares têm acompanhado muito de perto a forma como temos governado a nação, e pelo que parece eles estão longe de estar satisfeitos com nossas ações atuais. \n\nVários generais nossos nos alertaram diretamente, dizendo que se a situação na nação continuar aumentando, haverá sérias consequências."
 argentina.rework.7.a:0 "Droga, precisamos ter cuidado"
 argentina.rework.8.t:0 "Os militares cercaram a Casa Rosada"
 argentina.rework.8.d.notHistorical:0 "Enquanto falamos, tudo o que podemos fazer é assistir indefesos enquanto os militares têm a Casa Rosada, o principal prédio do governo da Argentina e o local onde o presidente tem todo o poder administrativo, cercado completamente e ordenando que deixemos a liderança da nação. \n\nAté agora não temos ideia de como eles conseguiram tanto poder ou financiamento, mas o que temos ideia é a gravidade dessa situação e nossa incapacidade de responder . \n\nSem tempo de sobra, o que devemos fazer?"
 argentina.rework.8.d.historical:0 "Enquanto falamos, tudo o que podemos fazer é assistir indefesos enquanto os militares têm a Casa Rosada, o principal prédio do governo da Argentina e o local onde o presidente tem todo o poder administrativo, cercado completamente e nos ordenando a renunciar à liderança da nação. \n\nOs principais perpetradores disso devem ter sido o GOU (Grupo de Oficiales Unidos), secretamente sendo financiado e crescendo em poder sem que percebamos. \n\nO que devemos fazer agora?"
 argentina.rework.8.a:0 "Deixe-os assumir"
 argentina.rework.8.b:0 "SOBRE NOSSOS TÚMULOS, VIVA LA PATRIA"
 argentina.rework.9.t:0 "As pessoas saem às ruas para protestar"
 argentina.rework.9.d:0 "Muitas pessoas em todo o país começaram a protestar, exigindo estabilidade e prosperidade no país. Suas vozes só vão ficar mais altas com o passar do tempo, e seus problemas mostram o quão terrível a situação está ficando aqui na Argentina."
 argentina.rework.9.a:0 "Nós cuidamos deles"
 argentina.rework.10.t:0 "A inflação atinge a economia!"
 argentina.rework.10.d:0 "Embora não estivéssemos lutando com a inflação antes, o mercado hoje caiu com uma crise inflacionária que agora atinge nossa economia já fraca. \n\nOs mercados estão lutando para se manter, e as pessoas estão correndo para os bancos para retirar qualquer dinheiro que possam ter, só piorando a situação."
 argentina.rework.10.a:0 "Esta é a última coisa que precisávamos"
 argentina.rework.11.t:0 "Fomos colocados em uma luta política"
 argentina.rework.11.d:0 "As eleições de 1937 nos cobraram um preço muito alto, pois fomos forçados a estar sempre atentos para que as pessoas votem em nosso partido. levar as partes opostas a tirar vantagem da situação e nos prejudicar, desafiando nosso domínio. \n\nNão poderemos fazer nada, por enquanto, mas vamos contra-atacar com força."
 argentina.rework.11.a:0 "Vamos superar isso"
 argentina.rework.12.t:0 "O Governo iniciou uma investigação"
 argentina.rework.12.d:0 "Temendo potenciais oligarcas ou políticos corruptos no país, o governo iniciou uma investigação completa em todo o país para tentar impedir isso. \n\nSe deixarmos que eles continuem esta investigação, eles podem descobrir sobre nossos aliados leais nos ajudando nas sombras, e não podemos permitir que isso aconteça."
 argentina.rework.12.a:0 "Devemos acabar com isso"
 argentina.rework.13.t:0 "Os militares exigem mais financiamento"
 argentina.rework.13.d:0 "Os militares ofereceram seu apoio nas sombras, em troca de aumentarmos seu financiamento e poder na nação. \n\nSe não cumprirmos, pode haver sérias consequências."
 argentina.rework.13.a:0 "Tudo bem, vamos fazer isso"
 argentina.rework.13.b:0 "Não está acontecendo"
 argentina.rework.14.t:0 "Oligarcas exigem mais poder"
 argentina.rework.14.d:0 "Os oligarcas de todo o país estão descontentes com o poder que têm atualmente e estão exigindo mais poder político sobre o país. \n\nDevemos atender às suas demandas?"
 argentina.rework.15.t:0 "Oligarcas exigem aumento de salários"
 argentina.rework.15.d:0 "Os oligarcas em nosso país estão descontentes com seus salários atuais e estão exigindo mais dinheiro para serem redirecionados a eles para manter seu apoio. \n\nDevemos ceder às suas demandas ?"
 argentina.rework.16.t:0 "Políticos em Buenos Aires exigem recursos redirecionados"
 argentina.rework.16.d:0 "Políticos corruptos de Buenos Aires estão exigindo que os fundos nacionais sejam centralizados somente em Buenos Aires. A maioria de nossos benefícios vem da capital, e não atender às suas demandas pode resultar na perda de seu apoio . \n\nDevemos concordar?"
 argentina.rework.17.t:0 "Oligarcas nos apóiam"
 argentina.rework.17.d:0 "Os oligarcas recentemente ficaram muito satisfeitos com a maneira como os tratamos e concordaram em nos reembolsar por nossos atos."
 argentina.rework.17.a:0 "Ótimo!"
 argentina.rework.18.t:0 "Argentina em todo o país se oferece para pegar em armas"
 argentina.rework.18.d:0 "A situação atual de nosso país está desmoronando rapidamente. Soldados estrangeiros estão entrando em nosso país e nosso exército está resistindo ao ataque. Em meio a todo esse caos, argentinos em todo o país se ofereceram para pegar em armas para defender la Patria. \n\nDevemos aceitar a ajuda deles e permitir que eles se juntem aos soldados profissionais nas linhas de frente?"
 argentina.rework.18.a:0 "A DEFENDER LA PATRIA!"
 argentina.rework.18.b:0 "Desculpe, mas isso não pode acontecer"
 argentina.rework.20.t:0 "A Guerra Civil finalmente acabou"
 argentina.rework.20.d:0 "Depois da perda de inúmeras vidas, sacrifícios valentes e estradas dizimadas, a Argentina finalmente está inteira novamente. É realmente uma pena o que nossa bela nação teve que passar, mas o que mais importa é que agora podemos assumir o comando e apresentar uma Argentina que realmente merece destaque em escala global. \n\nO mundo finalmente verá o verdadeiro potencial da Argentina e nunca mais seremos motivo de chacota para ninguém!"
 argentina.rework.20.a:0 "Viva a Pátria!"
 argentina.rework.21.t:0 "Captura de equipamento com sucesso"
 argentina.rework.21.d:0 "Conseguimos entrar furtivamente em uma fábrica de armas inimiga e roubar algumas de suas armas!"
 argentina.rework.21.a:0 "Perfeito!"
 argentina.rework.22.t:0 "Inimigo rouba algumas de nossas armas!"
 argentina.rework.22.d:0 "Contingentes inimigos conseguiram passar furtivamente por nossas linhas de frente e roubar algumas de nossas armas!"
 argentina.rework.22.a:0 "Precisamos ter mais cuidado"
 argentina.rework.23.t:0 "Captura de equipamento malsucedida"
 argentina.rework.23.d:0 "Nossos soldados foram pegos tentando roubar armas inimigas!"
 argentina.rework.23.a:0 "Que descansem em paz"
 argentina.rework.24.t:0 "Soldados inimigos foram pegos tentando roubar alguns de nossos equipamentos!"
 argentina.rework.24.d:0 "Alguns de nossos guardas em uma fábrica de armas pegaram soldados inimigos tentando entrar furtivamente e roubar algumas de nossas armas Felizmente, eles foram resolvidos."
 argentina.rework.24.a:0 "Bom"
 argentina.rework.25.t:0 "[FROM.GetName] Roubou algumas de nossas fábricas!"
 argentina.rework.25.d:0 "Embora pareça e pareça loucura acreditar, agentes secretos e apoiadores do Anarquismo dentro de nosso país e na Argentina invadiram coletivamente algumas de nossas fábricas industriais e de armas, ameaçando os trabalhadores da fábrica de partirem para a Argentina e prosseguiram destruir as fábricas! \n\nEste ato selvagem é simplesmente vergonhoso! O que devemos fazer?"
 argentina.rework.25.a:0 "Faremos com que paguem outro dia"
 argentina.rework.25.b:0 "Eles não vão escapar impunes!"
 argentina.rework.26.t:0 "A Argentina anarquista está se intrometendo em nossa política!"
 argentina.rework.26.d:0 "Não foi uma mera coincidência a repentina explosão de popularidade de um estado anarquista em nosso país. Longe disso, a causa raiz disso é a Argentina. Eles têm se intrometido em nossa política e em nosso povo e tentando injetar suas visões doentias e distorcidas em nosso povo! \n\nO que devemos fazer?"
 argentina.rework.30.t:0 "[FROM.GetName] assassinou nossos insurgentes anarquistas!"
 argentina.rework.30.d:0 "Chegou à nossa sede em Ushuaia a notícia de que [FROM.GetName] fez de tudo para exterminar totalmente toda e qualquer influência anarquista em seu país, matando alguns de nossos membros no processo. \n\nComo devemos responder?"
 argentina.rework.30.a:0 "Eles não vão escapar impunes!"
 argentina.rework.30.b:0 "Não podemos permitir uma invasão agora"
 argentina.rework.31.t:0 "[FROM.GetName] está exigindo nossa submissão"
 argentina.rework.31.d:0 "[FROM.GetName] exigiu que cedessemos a eles e deixássemos o governo deles assumir o controle total sobre nossa nação. Isso significaria renunciar à nossa independência! \n\nO que devemos fazer?"
 argentina.rework.31.a:0 "Será que temos escolha?"
 argentina.rework.31.b:0 "Sobre nossos túmulos mortos!"
 argentina.rework.32.t:0 "[FROM.GetName] está nos pedindo ajuda!"
 argentina.rework.32.d:0 "Delegados e revolucionários de [FROM.GetName] vieram ao nosso país, implorando por qualquer tipo de ajuda que possamos oferecer em seus esforços. \n\nEles estão se mantendo por enquanto, mas precisam de toda a ajuda que puderem obter. \n\nTer um aliado no coração da América do Sul pode ser útil, então o que devemos fazer?"
 argentina.rework.32.a:0 "Vamos lhe emprestar algumas armas"
 argentina.rework.32.b:0 "Enviaremos voluntários"
 argentina.rework.32.c:0 "Enviaremos títulos de guerra"
 argentina.rework.32.e:0 "Por que deveríamos lhe dar alguma coisa?"
 argentina.rework.34.t:0 "[FROM.GetName] decidiu não nos ajudar!"
 argentina.rework.34.d:0 "[FROM.GetName] nos negou qualquer um de seus recursos para nos ajudar em nossos esforços de guerra!"
 argentina.rework.34.a:0 "Bem, eles podem apodrecer no inferno!"
 argentina.rework.35.t:0 "Inimigos políticos pegam em armas!"
 argentina.rework.35.d:0 "A resistência entre as províncias do nosso país tem crescido desde que assumimos o poder. Muitos sempre foram contra o nosso governo e o ponto de inflexão acaba de ser alcançado. Parece que eles temos planejado no subsolo uma revolução em grande escala para derrubar, mas não cairemos tão facilmente!"
 argentina.rework.35.a:0 "Eles pagarão com o sangue!"
 argentina.rework.36.t:0 "Socialistas ganham mais assentos no Congresso"
 argentina.rework.36.d:0 "Depois de várias campanhas e esforços de propaganda, os Socialistas ganharam mais assentos no Congresso e aumentaram o reconhecimento a nível nacional. \n\nEles continuarão a avançar e a tentar ganhar ainda mais assentos e potencialmente ganhar as eleições."
 argentina.rework.36.a:0 "Ok"
 argentina.rework.37.t:0 "Os militares designaram Perón para ir ao Chile"
 argentina.rework.37.d:0 "Vários oficiais de alto escalão decidiram enviar Juan Domingo Perón ao Chile em missão como adido militar para obter mais conhecimento interno da situação atual do país, além de potencialmente obter acesso a novos conhecimentos militares que atualmente só é acessado pelos chilenos. \n\nComo presidente da Argentina, você concordará com esta designação ou irá contra ela?"
 argentina.rework.37.a:0 "Mande-o para o Chile"
 argentina.rework.37.b:0 "Os militares NÃO vão mandar em nós"
 argentina.rework.38.t:0 "Os militares designaram Perón para ir para a Itália"
 argentina.rework.38.d:0 "Vários oficiais de alto escalão decidiram enviar Juan Domingo Peron à Itália com a missão de obter mais conhecimento interno da situação atual do país, bem como aprender mais sobre as táticas de guerra italianas e as habilidades necessárias para lutando em altitudes elevadas. Perón também foi encarregado de estudar a economia italiana e sua política, obtendo uma visão ainda mais profunda do modo de vida italiano e, mais importante, do modo de vida do fascismo. \n\nComo presidente da Argentina, você concorda com isso? designação, ou ir contra ela?"
 argentina.rework.38.a:0 "Mande-o para a Itália"
 argentina.rework.38.b:0 "Os militares NÃO vão mandar em nós"
 argentina.rework.39.t:0 "[ARG.GetLeader] é diagnosticado com diabetes"
 argentina.rework.39.d:0 "Depois de um check-up regular com o médico, o médico não teve escolha a não ser dar a notícia contundente a Roberto sobre sua condição. O médico afirmou que à medida que seu diabetes está piorando, ele eventualmente ficará completamente cego e será forçado a renunciar ao cargo. \n\nA terrível notícia desta relevância atingiu as casas e as ruas da Argentina, deixando os apoiadores de Roberto devastados. \n\nPrecisamos fazer o nosso melhor para ajudar Roberto de qualquer maneira que pudermos, embora não possa ser garantido se ele sobreviverá ou não.
 argentina.rework.39.a:0 "Devastador..."
 argentina.rework.40.t:0 "Oftalmologista enviado americano chega à Argentina"
 argentina.rework.40.d:0 "Depois que [USA.GetLeader] descobriu a condição de Roberto, ele decidiu enviar pessoalmente um dos melhores oftalmologistas do país, Ramón Castroviejo, à Argentina para tentar ver se ele consegue qualquer coisa para ajudar a condição de Roberto e talvez até curá-la. \n\nAs chances são mínimas, mas o desdém de Roberto pelas potências do Eixo é motivação suficiente para os EUA tentarem nos ajudar de todas as maneiras possíveis."
 argentina.rework.40.a:0 "Agradecemos imensamente a ajuda!"
 argentina.rework.41.t:0 "A questão da liderança..."
 argentina.rework.41.d:0 "Com as eleições em andamento, uma grande questão subjacente se coloca: quem assumirá o comando da Concordancia? \n\nPoderíamos permanecer com Roberto Marcelino Ortiz, sua forte vontade e mentalidade imutável são certas para nos ajudar nos tempos desesperadores da década infame. \n\nPor outro lado, temos Leopoldo Melo, um grande advogado, diplomata e político. \n\nNossa última opção potencial é Robustiano Patron Costas, atual governador de Salta. \n\nQuem devemos escolher?"
 argentina.rework.41.a:0 "Mantenha Roberto"
 argentina.rework.41.b:0 "Escolha Leopoldo"
 argentina.rework.41.c:0 "Escolha Robustiano"
 argentina.rework.42.t:0 "Movimentos militares subterrâneos foram detectados"
 argentina.rework.42.d:0 "Vários relatos anônimos têm surgido recentemente de diferentes setores do exército colaborando de maneiras estranhas e um tanto misteriosas. \n\nAté agora não temos informações sobre o que eles estão fazendo, mas, julgando a situação atual do condado, isso pode muito bem acabar sendo uma coisa muito ruim. Precisamos manter a guarda alta."
 argentina.rework.42.a:0 "Ha! Como se eles fossem fazer alguma coisa conosco"
 argentina.rework.44.t:0 "Formação do GOU"
 argentina.rework.44.d:0 "O que originalmente eram apenas rumores e especulações acabou se tornando realidade, à medida que vários generais, líderes militares e políticos de direita combinaram forças para formar o Grupo de Oficiales Unidos, ou GOU, para abreviar . \n\nEles pretendem lidar de uma vez por todas com a instabilidade na Argentina e superar os desafios que enfrentamos durante a década infame. \n\nEles já declararam que alcançarão seus objetivos por todos os meios necessários, o que significa que sangue pode ser derramado se as coisas derem errado."
 argentina.rework.44.a:0 "Exatamente o que precisávamos..."
 argentina.rework.45.t:0 "GOU ganha maior controle sobre o país"
 argentina.rework.45.d:0 "Como uma tentativa de ganhar mais poder sobre o país e ter mais influência em nossa política, o GOU assumiu o controle de mais um estado. \n\nSe isso continuar, não iremos ser capaz de desafiá-los mais!"
 argentina.rework.45.a:0 "Eles não vão escapar impunes!"
 argentina.rework.46.t:0 "Arturo Rawson forçado a renunciar"
 argentina.rework.46.d:0 "Depois de apenas 3 dias como líder, o GOU decidiu que já era o suficiente depois que Arturo não estava ouvindo suas demandas. \n\nPedro Palo Ramirez será quem assumirá o controle e substituirá Arturo Rawson depois de tal escândalo causado por um líder que não foi líder nem por uma semana."
 argentina.rework.46.a:0 "Ok?"
 argentina.rework.47.t:0 "Perón sobe na hierarquia governamental"
 argentina.rework.47.d:0 "Depois de obter algum reconhecimento por seus esforços tanto externa quanto internamente no país, muitos outros altos funcionários do governo ficaram satisfeitos com o desempenho de Peorn e decidiram promovê-lo nas fileiras do governo. \n\nEsta é uma ótima notícia por enquanto, mas há uma chance de ele ganhar reconhecimento do público e até começar a conquistar um número significativo de seguidores."
 argentina.rework.47.a:0 "Ok"
 argentina.rework.48.t:0 "Apoio a Perón cresce em todo o país"
 argentina.rework.48.d:0 "Depois de se tornar oficialmente parte do governo, além de ser um oficial de alto escalão, muitos soldados, bem como civis comuns, começaram a gostar de Perón, acreditando em suas metodologias e modo de pensar poderia ser a graça salvadora da Argentina depois de décadas de mediocracia. \n\nPrecisamos ficar de olho em Peorn e em seu apoio, pois isso pode facilmente sair do controle."
 argentina.rework.48.a:0 "Isso não é bom..."
 argentina.rework.49.t:0 "Peornistas se reúnem para protestar contra a prisão de Perón"
 argentina.rework.49.d:0 "Quando pensávamos que Perón seria uma coisa do passado após sua prisão oficial, não podíamos estar mais errados... Centenas de milhares de pessoas saíram às ruas para protestar contra o encarcelamento de Perón e exigir a sua libertação. \n\nSeus números são enormes e se não lidarmos com eles rapidamente, isso pode acabar sendo muito ruim!"
 argentina.rework.50.t:0 "Partido Peronista vence por deslizamento de terra!"
 argentina.rework.50.d:0 "Depois que o apoio peornista atingiu um ponto crítico, os peronistas exigiram eleições para ver quem deveria ser o líder da Argentina. Sem muita escolha, fomos forçados a obedecer, e para surpresa de ninguém, Perón venceu por uma margem significativa sobre a oposição e tomará posse ainda hoje."
 argentina.rework.50.a:0 "Ótimo"
 argentina.rework.51.t:0 "Perón foi libertado!"
 argentina.rework.51.d:0 "Depois de muitas marchas de protesto contra a decisão do governo de prender Perón, eles finalmente cederam às nossas exigências e irão libertá-lo oficialmente e substituí-lo no governo hoje! \n \nNossos protestos acabaram sendo um sucesso!"
 argentina.rework.52.t:0 "Perón foi preso"
 argentina.rework.52.d:0 "Após o crescimento alarmante do apoio a Perón, o governo decidiu tomar uma decisão audaciosa e prender Perón para evitar que sua influência crescesse ainda mais dentro do país. \n\nVamos deixar isso claro como dia a dia que fizeram uma escolha horrível e que vão pagar pelo que fizeram!"
 argentina.rework.52.a:0 "Perón SERÁ libertado!"
 argentina.rework.53.t:0 "Oposição nos acusando de uma vitória fraudulenta"
 argentina.rework.53.d:0 "Depois de nossa vitória nas eleições de 1937, vários membros dos partidos de oposição nos acusaram de nossa vitória ser ilegítima. Embora a maioria dos argentinos não acredite, uma parcela significativa concorda com estes afirmações e acreditamos que não vencemos as eleições de forma limpa."
 argentina.rework.53.a:0 "Ótimo..."
 argentina.rework.54.t:0 "Detecção bem-sucedida de generais suspeitos"
 argentina.rework.54.d:0 "Nossa busca foi um sucesso! Conseguimos identificar e localizar todos os generais que estavam tramando pelas nossas costas! Eles serão atendidos prontamente."
 argentina.rework.54.a:0 "Muito bom"
 argentina.rework.55.t:0 "Nossa operação de busca saiu pela culatra"
 argentina.rework.55.d:0 "Após um exame cuidadoso de todos os nossos generais, não conseguimos localizar os responsáveis pelas intrigas pelas nossas costas. Devido ao nosso fracasso, eles usaram este ponto fraco do nosso governo para convencer outros generais e lançar uma repressão em grande escala contra o nosso governo!"
 argentina.rework.55.a:0 "Essas Vendepatrias serão tratadas prontamente!"
 argentina.rework.56.t:0 "Militares se rebelam contra nós!"
 argentina.rework.56.d:0 "Depois de desagradar os militares devido a nossas várias ações e reformas, eles decidiram se rebelar contra nós! \n\nPrecisamos mantê-los sob controle antes que tentem qualquer outra coisa!"
 argentina.rework.56.a:0 "Esses malditos ratos!"

 argentina.fascist.1.t:0 "Quem deve representar a Legião Cívica Argentina?"
 argentina.fascist.1.d:0 "Temos uma escolha a fazer agora que criamos a coalizão, e quem deve controlar a LCA? \n\nNossa escolha é entre o calmo e sensato Juan Queralto, e o o obstinado e feroz Juan Bautista Molina. \n\nQuem devemos escolher?"
 argentina.fascist.2.t:0 "Qual partido deveria assumir o domínio na coalizão?"
 argentina.fascist.2.d:0 "Agora que lançamos nossos planos, temos uma escolha: qual partido deve ter precedência sobre os demais e representar verdadeiramente a coalizão? \n\nNossa escolha mudará enormemente nosso líder e a política associada com isso, então pense cuidadosamente sobre esta decisão qual é o plano de ação. \n\nA parte que nos liderará é..."
 argentina.fascist.2.a:0 "Legião Cívica Argentina"
 argentina.fascist.2.b:0 "Partido Fascista Argentino"
 argentina.fascist.2.c:0 "Liga Patriótica Argentina"
 argentina.fascist.2.e:0 "Independentes Políticos"
 argentina.fascist.3.t:0 "As eleições de 1937 foram canceladas"
 argentina.fascist.3.d:0 "Após a crescente tensão dentro da nação devido ao rápido crescimento do partido fascista recém-nascido, o atual governo argentino decidiu que seria o melhor curso de ação cancelar as próximas eleições para se concentrar em assuntos internos da nação."
 argentina.fascist.3.a:0 "Perfeito!"
 argentina.fascist.4.t:0 "Deve Walther Darre representar os independentes políticos"
 argentina.fascist.4.d:0 "Depois de chegar à Argentina, Darre ganhou o apoio dos fascistas rapidamente. Sua experiência na Alemanha nazista permitiu que ele ganhasse popularidade rapidamente, e com essa popularidade vem uma escolha... Deveríamos nomeá-lo como líder dos Independentes Políticos?"
 argentina.fascist.4.a:0 "Claro! Ele parece experiente"
 argentina.fascist.4.b:0 "Mantenha Lugones como líder"
 argentina.fascist.5.t:0 "Aquisição Federalista"
 argentina.fascist.5.d:0 "Depois de vários meses de trabalho e abusando da frágil situação do país, os Federalistas lançaram um golpe total, com Leopoldo Lugones no comando. Os Federalistas assumiram todos os cargos do país e se autodeclararam Confederação Argentina mais uma vez. \n\nÉ provável que haja oposição unitária a uma mudança tão repentina de governo, mas com o tempo isso deve diminuir."
 argentina.fascist.5.a:0 "Uma nova era começa agora!"
 argentina.fascist.6.t:0 "Hitler chega à Argentina"
 argentina.fascist.6.d:0 "Após o colapso nacional na Alemanha, Hitler e sua esposa sabiam que precisavam escapar ou seriam assassinados pela oposição. Depois de analisar suas opções, um país se destacou. . nosso. Hitler sabia que um de seus ministros mais leais não apenas foi para a Argentina, mas também se tornou líder da nação. A julgar por suas opções, ele confiou na Argentina como sendo o melhor país para onde fugir. \n\nIsso nos leva a nosso dilema atual: o que fazemos com Hitler?"
 argentina.fascist.6.a:0 "Deixe-o entrar"
 argentina.fascist.6.b:0 "Dê a ele um papel no governo, ele é útil"
 argentina.fascist.6.c:0 "Ele não vai ficar aqui por muito mais tempo"
 argentina.fascist.7.t:0 "A questão de Adolf Hitler"
 argentina.fascist.7.d:0 "Depois de ter sido recentemente promovido dentro do governo, a experiência de Hitler na área e o fluxo de palavras e emoções fizeram com que ele ganhasse apoio muito rapidamente em todo o país. Ele não apenas tem apoio popular, mas também também o apoio de algumas fileiras militares e de vários setores do governo recém-estabelecido. \n\nA questão é... ele deve assumir o poder sobre o país ou permanecer apenas como um mero conselheiro político?"
 argentina.fascist.7.a:0 "Neste momento precisamos de um líder com coração de ferro!"
 argentina.fascist.7.b:0 "Não podemos deixar que um lunático assim tome o poder!"

 news.368.t:0 "Estado Papal Declarado na Argentina"
 news.368.d:0 "Após a tomada do poder católico na Argentina sob o comando do padre Julio Meinvielle, a situação era preocupante, mas não havia motivo para preocupação. \n\nIsso, no entanto, mudou significativamente, pois agora o padre autodeclarou a Argentina como o país novo Estado Papal oficial, denunciando o papado original e alegando que se trata de uma cópia falsa. \n\nOs líderes de todo o mundo estão tão perplexos com isso que a maioria nem sabe o que fazer, mas uma coisa é certa: Meinvielle tem perigosos ambições!"
 news.368.a:0 "Ele está brincando... certo?"
 news.368.b:0 "Amém, que Deus abençoe essas criaturas vis"


 argentina.posadistambitions.1.t:0 "Ambição Posadista | Vencer a Guerra Civil"
 argentina.posadistambitions.1.d:0 "Com a guerra civil em pleno andamento, Posadas pediu diligentemente aos nossos altos oficiais e deputados para fazerem o trabalho rápido da oposição para reconstruir o país o mais rápido possível."
 argentina.posadistambitions.1.a:0 "Pela Revolução!"
 argentina.posadistambitions.2.t:0 "Ambição Posadista | Reconstruir a Economia"
 argentina.posadistambitions.2.d:0 "Posadas emitiu mais uma ordem: reconstruir a economia abalada e fazer o país avançar. \n\nSerá uma tarefa desafiadora, mas Posadas está confiante de que seremos capazes de realizá-la no tempo devido."
 argentina.posadistambitions.3.t:0 "Ambição Posadista | Esmagar os Oligarcas Rebeldes"
 argentina.posadistambitions.3.d:0 "Desde o fim da guerra civil, os irritantes oligarcas dentro da nação notaram que o seu domínio sobre o país se deteriorou e estão a tentar uma tentativa muito fútil de tentar recuperar o domínio. \n\nPosadas está muito descontente com essas pessoas e gostaria que elas fossem 'tratadas'"
 argentina.posadistambitions.4.t:0 "Ambição Posadista | Melhorar a Infraestrutura Nacional"
 argentina.posadistambitions.4.d:0 "Para ter um país de sucesso, é de extrema importância que todas as estradas dentro do país estejam conectadas adequadamente para permitir que recursos, bens, pessoas e militares se movam de qualquer apontam para qualquer outro ponto do país com relativa facilidade. \n\nFomos incumbidos de melhorar a infraestrutura nacional do país."
 argentina.posadistambitions.5.t:0 "Ambição Posadista | Prepare-se para a Expansão"
 argentina.posadistambitions.5.d:0 "Depois de se recuperar principalmente da guerra civil, Posadas acredita que é hora de começar a preparar a nação e seu povo para o que está por vir. Afinal, a Revolução não se espalhará sozinha."
 argentina.posadistambitions.6.t:0 "Ambição Posadista | Forma Posadista La Plata"
 argentina.posadistambitions.6.d:0 "As pessoas que residem no Paraguai e no Uruguai estão sofrendo com a natureza miserável dos capitalistas. As pessoas precisam de libertação e podemos salvá-las de sua opressão, todos unidos sob uma bandeira, a La Posadista Prata"
 argentina.posadistambitions.7.t:0 "Ambição Posadista | Conquistar os Andes"
 argentina.posadistambitions.7.d:0 "Posadas nos deu mais uma ordem envolvendo a conquista dos países andinos do Chile, Peru e Bolívia. Ele observou os custos que a guerra poderia potencialmente causar ao país e preferiria que que sejam exterminados rapidamente."
 argentina.posadistambitions.8.t:0 "Ambição Posadista | Conquistar o Brasil"
 argentina.posadistambitions.8.d:0 "Encontrar-nos repentinamente em conflito com o Brasil provou ser menos do que ideal, e Posadas preferiria que o conflito fosse resolvido rapidamente antes de qualquer nova escalada."
 argentina.posadistambitions.9.t:0 "Ambição Posadista | Programa Naval"
 argentina.posadistambitions.9.d:0 "Posadas nos ordenou expandir a Armada Argentina. Ele considera a marinha atual sem brilho e não será suficiente para as tarefas futuras que terá que suportar."
 argentina.posadistambitions.10.t:0 "Ambição Posadista | Expandir além da América do Sul"
 argentina.posadistambitions.10.d:0 "A Revolução precisa ir além dos limites do nosso próprio continente. O mundo inteiro precisa conhecer a palavra de Posadas e o posadismo, e isso inclui aqueles que estão fora do nosso continente!"
 argentina.posadistambitions.11.t:0 "Ambição Posadista | Estender a Revolução à Europa"
 argentina.posadistambitions.11.d:0 "A Europa precisa desesperadamente de mudança, de algo novo, de uma revolução. O berço de Karl Marx, o berço dos ideais que representam a revolução. Deveríamos trazer a revolução de volta ao seu estado lugar de direito!"
 argentina.posadistambitions.12.t:0 "Ambição Posadista | Decapitar os Porcos"
 argentina.posadistambitions.12.d:0 "Desde a concepção do nosso governo, desde o início de um caminho para a glória, um obstáculo flagrante tem estado no nosso caminho desde então: o Reino Unido e os EUA. Ambos afirmam representar a 'democracia ' e 'livre arbítrio', mas isso, no entanto, não pode estar mais longe da verdade de seu caos e destruição. \n\nEles pagarão por seus pecados com o sangue de seu povo!"
 argentina.posadistambitions.13.t:0 "Ambição Posadista Final | Viva la Revolución"
 argentina.posadistambitions.13.d:0 "Viva a Camarada Posadas! Viva a Revolução Mundial!"
 argentina.posadistambitions.100.t:0 "A ambição posadista foi concluída com sucesso!"
 argentina.posadistambitions.100.d:0 "Conseguimos atender às demandas de Posadas no prazo e com muita eficiência. Posadas está muito satisfeito com os resultados e acredita que o país está trilhando um caminho de crescimento e prosperidade."
 argentina.posadistambitions.100.a:0 "Viva el Camarada Posadas!"
 argentina.posadistambitions.101.t:0 "Ambição posadista falhou"
 argentina.posadistambitions.101.d:0 "Posadas está profundamente desapontado conosco, pois suas demandas não foram atendidas a tempo, embora ele acreditasse que nos foi dado tempo suficiente para realizá-las com sucesso. Ele espera que façamos melhor na próxima vez e não repetir tal decepção."
 argentina.posadistambitions.101.a:0 "Merda..."


 argentina.culturaldevelopment.1.t:0 "Desenvolvimento Cultural | Construir a Paz Geral"
 argentina.culturaldevelopment.1.d:0 "Engenheiros de todo o país se reuniram em Buenos Aires, discutindo a ideia de uma Avenida que possa ser usada para separar a Capital Autônoma da Província de Buenos Aires. \n\nTemos estado encarregado de concluir este projeto em 5 meses."
 argentina.culturaldevelopment.1.a:0 "Vamos conseguir!"
 argentina.culturaldevelopment.2.t:0 "Desenvolvimento Cultural | Atrair mais imigrantes para o país"
 argentina.culturaldevelopment.2.d:0 "Este país tem uma longa história de imigração. Eles moldaram e transformaram a Argentina no que é hoje, e é vital que continuemos com isso e facilitemos ao máximo a assimilação dos imigrantes no país. nossa grande nação!"
 argentina.culturaldevelopment.2.a:0 "Hora de trazer mais imigrantes"
 argentina.culturaldevelopment.3.t:0 "Desenvolvimento Cultural | Conectar a Ruta 9 a Córdoba"
 argentina.culturaldevelopment.3.d:0 "A Ruta 9 é uma estrada nacional relativamente nova cujo objetivo principal é ligar Buenos Aires a Jujuy e depois estender-se além da fronteira com a Bolívia. Um projeto dessa magnitude levará anos, no entanto , para começarmos a progredir, devemos nos concentrar em conectar a rota a Córdoba."
 argentina.culturaldevelopment.3.a:0 "Hora de começar a trabalhar!"
 argentina.culturaldevelopment.4.a:0 "Hora de começar a trabalhar!"
 argentina.culturaldevelopment.4.t:0 "Desenvolvimento Cultural | Construir o Obelisco"
 argentina.culturaldevelopment.4.d:0 "A Empresa Alemã G.E.O.P.E nos contatou recentemente com o desejo de construir um Obelisco na Avenida 9 de Julho, o mais importante de toda Buenos Aires. \n\nA maioria concorda que seria é bom ter um monumento assim para representar o nosso país!"
 argentina.culturaldevelopment.5.t:0 "Desenvolvimento Cultural | Construir a Bombonera e o Monumental"
 argentina.culturaldevelopment.5.d:0 "À medida que a popularidade do futebol continua a crescer em nosso país, também aumenta a demanda por estádios de futebol adequados. River Plate e Boca Juniors, respectivamente, têm instado nosso governo a construir seus estádios."
 argentina.culturaldevelopment.5.a:0 "E isso nós faremos!"
 argentina.culturaldevelopment.6.t:0 "Desenvolvimento Cultural | Investir em todo o país em nossa educação"
 argentina.culturaldevelopment.6.d:0 "A educação na Argentina estagnou recentemente. Não houve muitos avanços e, embora nossa educação seja boa, poderia ser ainda melhor. \n\nAfinal, a educação é o futuro, e os jovens argentinos precisam ser bem educados para apoiar um país forte e poderoso!"
 argentina.culturaldevelopment.7.t:0 "Desenvolvimento Cultural | Construir o Hospital Militar"
 argentina.culturaldevelopment.7.d:0 "Após a guerra do Chaco, muitos soldados apontaram a necessidade de ter um hospital militar adequado no país para tratar os soldados feridos e suas famílias. \n\nFoi-nos dado um prazo de 8 meses para concluir essa tarefa."


 argentina.rework.communist.1.t:0 "Irrompem protestos violentos em todo o país"
 argentina.rework.communist.d.t:0 "Poucos dias depois de o governo ter oficializado que não haverá eleições, pessoas em todo o país começaram a se reunir e a organizar multidões em massa, exibindo agressões à polícia tentando acalmá-las e fazendo suas desdém pela decisão do governo tão clara quanto a luz do dia. \n\nVários líderes de facções de esquerda começaram a tirar vantagem da situação, convencendo o povo de que o governo é a ruína de todo o mal e que uma revolução é uma obrigação para a Argentina. pullthrough. \n\nOnde devemos concentrar o apoio do povo?"
 argentina.rework.communist.1.a:0 "Conquistar apoio nas províncias"
 argentina.rework.communist.1.b:0 "Conseguir o apoio dos bonaerenses"
 argentina.rework.communist.2.t:0 "A situação só piora"
 argentina.rework.communist.2.d:0 "A maioria das pessoas simplesmente presumiu que os atuais tumultos seriam simplesmente uma manifestação do povo e diminuiriam em poucos dias. No entanto, isso não poderia estar mais longe do caso, como o os protestos e tumultos só aumentaram em número e força. Quase todas as cidades do país estão sendo afetadas por grandes protestos, sendo exasperadas pelos marxistas dentro do país. \n\nCom o país se aproximando cada vez mais da anarquia, surge um dilema : Devemos fazer isso pacificamente ou com sangue derramado nas mãos?
 argentina.rework.communist.2.a:0 "Diplomacia não resolve nada!"
 argentina.rework.communist.2.b:0 "Precisamos manter nosso país como uma entidade!"
 argentina.rework.communist.3.t:0 "O sentimento anarquista se intensifica na Patagônia"
 argentina.rework.communist.3.d:0 "Com a situação do país piorando cada vez mais, os anarquistas remanescentes que diminuíram na Patagônia começaram a se armar e a ganhar o apoio dos provincianos em Santa Cruz e na Terra do Fogo, alegando que o governo é a raiz de todos os males, e somente o povo com suas próprias mãos pode fazer justiça. \n\nO que você me diz, meu amigo, você concorda com nossos ideais?"
 argentina.rework.communist.3.a:0 "O anarquismo é o único caminho a seguir!"
 argentina.rework.communist.3.b:0 "Sua escória só vai piorar este país!"
 argentina.rework.communist.4.t:0 "Grande sentimento anti-guerra do PS"
 argentina.rework.communist.4.d:0 "Devido à esmagadora maioria das pessoas ainda preferirem uma abordagem mais diplomática que o PS ofereceu, muitos estão contra a guerra actual e vão activamente contra nós e os nossos esforços de guerra. Ou sabotando os nossos reservas ou convencer os soldados a abandonar as linhas de frente."
 argentina.rework.communist.4.a:0 "Malditos sejam todos!"
 argentina.rework.communist.5.t:0 "Os socialistas sabotaram algumas de nossas reservas!"
 argentina.rework.communist.5.d:0 "Os socialistas ainda presentes em nosso país decidiram sabotar uma de nossas reservas de armas no país como uma manifestação anti-guerra e para impedir nossa capacidade de lutar!"
 argentina.rework.communist.5.a:0 "Eles não vão escapar impunes!"
 argentina.rework.communist.6.t:0 "Apoio popular a Fanny atinge o ponto mais alto"
 argentina.rework.communist.6.d:0 "Depois de obter grande apoio, apesar da atual crise nacional, Fanny começou a defender uma revolução em grande escala e a reunir todos os seus apoiadores para irem contra o governo. O Partido Comunista e os contingentes dentro do país está agora dividido entre Liborio Justo e Fanny Edelman. \n\nDeve Fanny tornar-se a líder de facto?"
 argentina.rework.communist.6.a:0 "Fanny nos levará à vitória!"
 argentina.rework.communist.6.b:0 "Liborio é a nossa melhor chance"
 argentina.rework.communist.7.t:0 "Sabotagem Anarquista em todo o país"
 argentina.rework.communist.7.d:0 "Os anarquistas dentro do país se organizaram e orquestraram uma sabotagem nacional, visando bancos, prédios governamentais e reservas. Eles perceberam a situação extremamente delicada do país e estão abusando dela ao máximo. mais completo."
 argentina.rework.communist.7.a:0 "Esses malditos pirralhos..."
 argentina.rework.communist.8.t:0 "Apoiadores marxistas tentam frustrar nossos planos"
 argentina.rework.communist.8.d:0 "Devido ao nosso recente alinhamento com os ideais anarquistas, muitos dos marxistas ainda presentes na Argentina são fortemente contra esta noção e, portanto, interferiram em nossos planos e estão tornando mais difícil para nós planejar e comunicar antes que este país entre em erupção."
 argentina.rework.communist.8.a:0 "Comportamento vergonhoso"
 argentina.rework.communist.9.t:0 "Junta militar derruba governo argentino"
 argentina.rework.communist.9.d:0 "Notícias importantes chegaram à nossa sede! Nosso inimigo tem lutado profusamente para manter sua situação política sob controle, e a Junta decidiu derrubar seu governo para tentar trazer estabilidade ao seu lado usando força bruta! \n\nEsta situação enfraquecida pode, no entanto, levar outras facções dentro do país a aproveitarem a oportunidade e tentarem assumir o controle do país, por isso precisamos estar cansados."
 argentina.rework.communist.9.a:0 "Não podemos agir levianamente"
 argentina.rework.communist.11.t:0 "Hora de ingressar no Comintern"
 argentina.rework.communist.11.d:0 "Stalin chegou hoje a Buenos Aires para nos felicitar pela nossa vitória... ou assim pensávamos. Stalin chegou aqui para nos lembrar do nosso fim do acordo ao aderir ao Commintern assim que a guerra civil terminar. \n\nQue escolha faremos?"
 argentina.rework.communist.11.a:0 "Será que temos escolha?"
 argentina.rework.communist.11.b:0 "Faremos o que quisermos!"
 argentina.rework.communist.12.t:0 "[FROM.GetName] concordou em se juntar ao Commintern"
 argentina.rework.communist.12.d:0 "[FROM.GetName] concordou em se juntar à nossa facção e será um membro leal a nós agora."
 argentina.rework.communist.12.a:0 "Perfeito"
 argentina.rework.communist.13.t:0 "[FROM.GetName] não se juntou à nossa facção!"
 argentina.rework.communist.13.d:0 "[FROM.GetName] se recusou a se juntar ao Commintern, dizendo que 'farão o que quiserem'."
 argentina.rework.communist.13.a:0 "Parece que precisamos lhes dar uma lição"
 argentina.rework.communist.14.t:0 "Um encontro improvável com o bandido"
 argentina.rework.communist.14.d:0 "Enquanto alguns de nossos homens faziam exercícios no campo para ganhar vantagem sobre nosso inimigo em áreas rurais, eles se depararam com o próprio bandido infame, David 'Mate Cosido' Perelta. \n\nEmbora ele inicialmente tenha tratado nossos homens como uma ameaça, mas logo percebeu que eles não o estavam antagonizando. Em vez de nos virar as costas depois de ouvir a situação, ele se ofereceu para nos ajudar a levar alguns de nossos homens à vitória usando seu poder. geniais táticas de guerrilha e nos dar vantagem contra nosso inimigo."
 argentina.rework.communist.14.a:0 "Bem-vindo, el Pistolero"
 argentina.rework.communist.15.t:0 "Vida alienígena foi descoberta!"
 argentina.rework.communist.15.d:0 "O que parecia apenas um sonho para nós, na verdade se tornou realidade! Nossos cientistas de primeira linha capturaram frequências de rádio que vieram de formas de vida fora do nosso planeta. Depois de estabelecer uma conexão adequada com essas formas de vida e explicando nossa história e nossa história, desde a criação da Terra até a evolução humana, essas formas de vida começaram a descrever seu lado da história. \n\nNossos cientistas retornaram de dados e projetos extremamente valiosos que facilmente avançarão em nosso pesquisa anos à frente de todos os outros países deste planeta."
 argentina.rework.communist.15.a:0 "Sua ajuda foi realmente uma bênção!"
 argentina.rework.communist.16.t:0 "[FROM.GetName] está exigindo a Ilha Pitcairn"
 argentina.rework.communist.16.d:0 "Acabamos de receber uma carta de [FROM.GetName], exigindo que desistamos de nosso domínio sobre a Ilha Pitcairn e a entreguemos a eles. \n\nO que devemos fazer? "
 argentina.rework.communist.16.a:0 "Nós vamos entregar para você"
 argentina.rework.communist.16.b:0 "NÃO INFERNO!"
 argentina.rework.communist.17.t:0 "[FROM.GetName] está exigindo a Patagônia e se tornando seu sujeito"
 argentina.rework.communist.17.d:0 "Recebemos uma carta ameaçadora de [FROM.GetName], exigindo que não apenas entreguemos a eles toda a Patagônia, mas também nos tornemos seu súdito. \n\nO que devemos fazer?"
 argentina.rework.communist.17.a:0 "Tudo bem..."
 argentina.rework.communist.17.b:0 "ELES SÃO LOUCOS? PORRA NÃO"


 argentina.rework.stabilization.t:0 "Tentativas de estabilização do governo"
 argentina.rework.stabilization.d:0 "À medida que a situação no país continua a piorar, o governo está fazendo o possível para remediar a situação da melhor maneira possível e frustrar nossos planos."
 argentina.rework.estabilization.a:0 "Ok"



 argentina.22.t.ucravictor:0 "A UCRA (Concordância) ganhou as eleições"
 argentina.22.t.ucrvictor:0 "A UCR ganhou as eleições"
 argentina.22.t.psvictor:0 "O Partido Socialista ganhou as eleições"
 argentina.22.d:0 "As eleições estão aqui, depois de 6 anos de Agustín Pedro Justo já contamos os votos e o país decidiu quem deve levar nossa nação à grandeza. \n\nQuem assume o comando, vamos esperar que saibam o que eles fazem e lidam com os problemas que nosso país está enfrentando atualmente.”
 argentina.22.a:0 "Não vamos decepcioná-lo!"

 chile.20.t:0 "[FROM.GetName] quer que nos juntemos ao Comintern"
 chile.20.d:0 "Diplomatas de [FROM.GetName] nos procuraram para nos perguntar se estamos dispostos a ingressar no Comintern. Eles também ingressaram no Comintern e estão nos dizendo para ingressar também no Comintern . Eles estão dizendo que os soviéticos ficariam felizes em nos aceitar em sua facção. \n\nDevemos aceitar esta oferta?"
 chile.20.a:0 "Claro, teremos prazer em participar"
 chile.20.b:0 "Eles não representam nossos ideais!"

 chile.21.t:0 "A Formação da Frente Popular"
 chile.21.d:0 "A notícia se espalhou que hoje marca o primeiro dia da Frente Popular existente como um partido político no Chile. Este novo partido consiste em uma coalizão da maioria dos partidos comunistas combinando forças em um grande partido. o responsável por este novo partido político é Pedro Aguirre Cerda. \n\nInfelizmente, não temos informações atuais sobre como os fascistas reagirão à formação desse novo partido, mas pelo que foi visto anteriormente, não será bonito . Nosso governo também precisa estar atento, pois este novo partido está ganhando popularidade rapidamente entre os cidadãos chilenos."
 chile.21.a:0 "Interessante..."

 chile.22.t:0 "Nacistas protestam contra a repressão de seu partido"
 chile.22.d:0 "Depois de várias tentativas de suprimir o movimento político nacista, muitos de seus membros estão protestando contra esta ação, e estão fazendo isso assumindo o controle de uma de nossas províncias. Tal ato não deve ser tolerado, e nós precisam lidar com seu pequeno ato o mais rápido possível antes que eles fiquem muito poderosos!"
 chile.22.a:0 "Você vai pagar por isso!"

 chile.23.t:0 "Comunistas protestam contra a supressão de seu partido"
 chile.23.d:0 "Depois de nossas várias tentativas de suprimir o partido comunista, seus membros ficaram furiosos com nosso governo e decidiram demonstrá-lo ocupando uma de nossas províncias à força. Este ato não deve ser tomado de ânimo leve, e eles será recebido com força bruta!"
 chile.23.a:0 "Você vai pagar por isso!"

 chile.25.t:0 "Nacistas exigem maior representação política"
 chile.25.d:0 "Vários líderes políticos do partido nacista vieram à nossa sede, exigindo que seu partido seja devidamente representado entre nosso governo e o povo. Eles também afirmaram que se não cumprirmos suas demandas, então eles usarão a força para conseguir o que querem. \n\nA decisão está em nossas mãos, devemos obedecer às suas demandas ou ignorá-las?"
 chile.25.a:0 "Aceitar suas demandas"
 chile.25.b:0 "Ignore-os"

 chile.26.t:0 "Comunistas exigem maior representação política"
 chile.26.d:0 "Vários líderes políticos do partido comunista vieram à nossa sede principal, exigindo que o reconhecimento de seu partido seja aumentado em todo o nosso governo e no povo como um todo. Eles afirmam que seu partido é mais popular do que o que está sendo representado por nosso governo, e eles usarão a força se não ouvirmos suas demandas. \n\nO que devemos fazer, aceitar ou ignorar suas demandas?"

 chile.28.t:0 "Nacistas aumentam seu poder político"
 chile.28.d:0 "A Intel chegou até nós que, após várias campanhas de propaganda ilegal e vários níveis de corrupção, os nacistas aumentaram sua representação política em nosso governo. \n\nPrecisamos tomar cuidado, se permitirmos que eles continuar fazendo ações como essas, só o tempo dirá se ainda teremos o controle total de nossa nação."
 chile.28.a:0 "Parece que eles têm algumas intenções bastante nefastas"

 chile.29.t:0 "Os comunistas aumentam seu poder político"
 chile.29.d:0 "A Intel chegou até nós que, após várias campanhas de propaganda ilegal e vários níveis de corrupção, os comunistas aumentaram sua respectiva representação política em nosso governo. \n\nSe essa situação continuar, ou até aumentar, então estaremos em sérios apuros!"
 chile.29.a:0 "Sim, essas são algumas intenções muito nefastas"

 chile.30.t:0 "Debate político desencadeado entre fascistas e comunistas"
 chile.30.d:0 "Apenas hoje, vários líderes políticos de ambos os lados entraram em uma discussão pesada, com alguns chegando a lutar. Pelo que nossa inteligência nos diz, isso levará a uma fase temporária de campanhas de propaganda direcionadas umas contra as outras. \n\nEmbora qualquer resultado possa ser benéfico para nosso governo, precisamos estar atentos para que o povo chileno não goste de tanto caos dentro de nosso governo. Vamos torcer para que as coisas não fiquem violentas."
 chile.30.a:0 "Vamos torcer para uma paz duradoura..."

 chile.31.t:0 "Nacistas exigem que fechemos a economia"
 chile.31.d:0 "Vários líderes políticos do partido fascista estão exigindo que fechemos a economia para estrangeiros, alegando que os recursos chilenos são 'feitos por e somente para o povo chileno'. movimento ganhando uma quantidade séria de tração, e eles sabem muito bem que eles têm um apoio grande o suficiente para fazer essas demandas insanas. \n\nA decisão está em nossas mãos, devemos obedecer ou devemos simplesmente ignorá-los?"
 chile.31.a:0 "Atender às suas demandas"
 chile.31.b:0 "Ignore suas demandas"

 chile.32.t:0 "Nacistas exigem maior representação parlamentar"
 chile.32.d:0 "Depois de ganhar popularidade em massa em todo o país e se tornar um grande partido político em nossa nação, os nacistas estão exigindo que sejam representados por uma margem muito maior em nosso parlamento. \n\nSeu poder parece estar crescendo sem parar, e isso é muito preocupante para nós. Mais poderoso e eles representam uma séria ameaça ao nosso governo. \n\nPor enquanto, devemos ouvir suas demandas ou simplesmente ignorá-las?"
 chile.32.a:0 "Cede às suas exigências"
 chile.32.b:0 "Eles não vão conseguir o que querem!"

 chile.33.t:0 "Os comunistas exigem o equilíbrio de nossas classes sociais"
 chile.33.d:0 "Desde a criação desta nação, nossas classes sociais têm sido muito desproporcionais. Devido a várias políticas econômicas, este problema só piorou, e agora que os comunistas têm um reduto sobre o cenário político do país, eles estão exigindo que equilibremos essas classes e rápido. \n\nEles estão nos dando um prazo bastante rigoroso para fazê-lo, no entanto, mesmo eles reconhecem a dificuldade da tarefa e ofereceram sua ajuda para resolver esse longo questão duradoura de uma vez por todas. \n\nDevemos ouvir suas demandas ou ignorá-las?"
 chile.33.a:0 "Ouvir suas demandas"
 chile.33.b:0 "Ignore suas demandas"

 chile.34.t:0 "Comunistas estão exigindo aumento nos planos de bem-estar"
 chile.34.d:0 "Depois de ganhar popularidade em massa entre o povo chileno, os comunistas estão novamente nos procurando com uma demanda bastante extrema. Aumente nossos planos de bem-estar, especialmente para os pobres. \n\nOs comunistas estão tentando abusar o poder deles, e o fato de não podermos fazer muito é a pior parte. Por enquanto, tudo o que podemos fazer é ouvir e cumprir suas exigências ou simplesmente ignorá-los e esperar o melhor."
 chile.34.a:0 "Cumprir"
 chile.34.b:0 "Ignore-os"

 chile.35.t:0 "Os chilenos se preparam para as eleições de 1938"
 chile.35.d:0 "Faltando mais de um ano para as eleições de 1938, o povo já começou a se preparar para as próximas eleições. Os partidos políticos também estão se preparando, pendurando cartazes por toda parte e vários líderes políticos fazendo discursos em todo o país. \n\nEmbora a maioria das eleições seja um momento para celebrar um novo líder, desta vez muitos estão preocupados com o resultado dessas eleições. Especialmente devido à agressividade entre comunistas e fascistas dentro do país. \n\nAs contanto que as coisas fiquem em paz, então tudo ficará bem. No entanto, só o tempo dirá se esse é realmente o caso."
 chile.35.a:0 "Vamos torcer por eleições pacíficas"

 chile.36.t:0 "Nacistas vencem as eleições"
 chile.36.d:0 "Depois de algumas eleições muito acirradas e contando todos os votos, os Nacistas surpreenderam a todos ao sair por cima. Se houve corrupção envolvida ou não, não podemos dizer a partir de agora. \n\nUma coisa é certa é que a vitória deles certamente aumentará as tensões na América Latina e definitivamente entre as potências aliadas. \n\nChega desses malditos democratas, é hora do Chile se tornar o poder que merece ser! Nossos inimigos devem tremer com medo à mera visão da bandeira chilena!"
 chile.36.a:0 "Hora de brilhar de verdade"

 chile.37.t:0 "Frente Popular vence as eleições"
 chile.37.d:0 "Depois de uma sessão de votação muito apertada, os comunistas saíram por cima. Sua vitória, verdadeira ou não, definitivamente ocorreu e em breve tomará o poder no Chile. \n\nSe isso acontecerá provocar ou não tensões na região, infelizmente ainda não sabemos. No entanto, uma coisa que tenho certeza é que as coisas vão mudar muito na América do Sul. \n\nÉ hora de trazer o Chile de volta das cinzas e dar ao povo verdadeira liberdade! Empoderamento para a classe trabalhadora!"
 chile.37.a:0 "Hora de mostrar à América do Sul do que somos feitos"
 
 chile.38.t:0 "Os democratas vencem as eleições mais uma vez"
 chile.38.d:0 "Depois de uma sessão de votação bastante apertada, nosso governo mais uma vez venceu nossa oposição e permanecerá no poder por mais 4 anos. \n\nEnquanto a sorte estava do nosso lado desta vez, o o mesmo não pode ser dito para a oposição, pois eles podem tentar fazer algo para atrapalhar nosso segundo mandato. Seja qual for o caso, precisamos estar preparados para tudo e não permitir que ninguém tire o melhor de nós!"
 chile.38.a:0 "Mais quatro anos"

 chile.39.t:0 "Formou-se a Aliança Popular Libertadora"
 chile.39.d:0 "a notícia se espalhou por todo o país que o MNS se dissolveu e para substituí-lo é a Alianza Popular Libertadora (APL). \n\nO partido também decidiu eleger Carlos Ibáñez del Campo como líder, o ex-presidente do Chile. Seus ideais autoritários geraram polêmica no passado, e o mesmo está acontecendo agora, já que muitos de nosso próprio governo e do Partido Comunista estão denunciando sua ascensão ao poder mais uma vez . \n\nPor enquanto, vamos apenas esperar que a situação se acalme e possamos ter um período eleitoral pacífico."
 chile.39.a:0 "Ainda mudou o nome de outra parte?"

 news.349.t:0 "O Massacre de Seguro Obrero"
 news.349.d:0 "Hoje algumas notícias tristes vieram do país do Chile, pois mais de 80 pessoas jaziam mortas após ocuparem o edifício Seguro Obrero em Santiago, Chile. Autoidentificados como nacistas, essas pessoas ocuparam não apenas este edifício, mas vários outros como uma tentativa de golpe para derrubar o atual presidente Arturo Alessandri e colocar no poder Carlos Ibáñez del Campo. O governo chileno respondeu a esta tentativa de golpe com derramamento de sangue, enviando os Carabineros e abrindo fogo contra os nacistas . 80 pessoas foram confirmadas mortas até agora, mas pode haver mais do que esse número. \n\nA situação global está parecendo sombria, pois as ideologias extremas estão crescendo em todo o planeta. O mundo está queimando rapidamente, e esse massacre mostra que a América do Sul também está incluída nessa confusão."
 news.349.a:0 "Tinha que ser feito"
 news.349.b:0 "Jesus Cristo..."

 chile.40.t:0 "O governo suprimiu nosso partido"
 chile.40.d:0 "O governo chileno fez de tudo para suprimir nosso partido político. Esta foi uma ação totalmente ilegal e praticamente um insulto à nossa liberdade de expressão. \n\nMesmo que o que eles fez foi errado, não podemos entrar em uma raiva incontrolável e derrubar o governo, pois muitos vão morrer fazendo uma coisa dessas, e desperdiçar tantas vidas por algo tão mesquinho simplesmente não é inteligente. \n\nIsso não significa que não vamos ficar quietos, em breve eles vão se arrepender de ter feito essas ações!"
 chile.40.a:0 "Eles vão pagar!"

 chile.42.t:0 "O Chile está disposto a pagar muito pela Patagônia"
 chile.42.d:0 "As autoridades chilenas nos abordaram com uma oferta muito repentina. Eles estão dispostos a pagar não apenas 4 fábricas civis, mas também vários benefícios econômicos por mais de meio ano em troca da Patagônia. \n\nDeveria aceitamos esta oferta?"
 chile.42.a:0 "Sim"
 chile.42.b:0 "Não"

 chile.43.t:0 "O Chile quer a Ilha Pitcairn"
 chile.43.d:0 "Vários políticos chilenos entraram em contato conosco, solicitando a Ilha Pitcairn. Eles alegam que querem usá-la como palco para uma invasão anfíbia japonesa, juntamente com o desenvolvimento infra-estrutural. \n\nDevemos dar eles a ilha?"
 chile.43.a:0 "Sim"
 chile.43.b:0 "Não"

 chile.44.t:0 "O Assassinato de Arturo Alessandri"
 chile.44.d:0 "Chegou hoje a notícia de que um grupo de terroristas desconhecidos assassinou Arturo hoje. Seu corpo foi encontrado dentro da casa do presidente e parece que ele foi emboscado. \n\nO grupo se auto-identificou como Nacistas, cantando 'La guerra va a comenzar! La guerra va a comenzar!' Enquanto esta notícia está sendo escrita, centenas e até milhares de pessoas estão pegando em armas no que parece ser um confronto entre o governo e os nacistas. \n\nUma guerra civil começará, e o sangue que será derramado está indo ser imenso."
 chile.44.a:0 "Victoria para el Nacismo!"

 chile.45.t:0 "[ROOT.GetPoliticalEnemy] estão cooperando com o governo!"
 chile.45.d:0 "Acabaram de chegar notícias de que [ROOT.GetPoliticalEnemy] está cooperando com o governo e trabalhando contra nós. Eles estão oferecendo ao governo suprimentos, equipamentos e até homens para lutar contra nós. Nosso inimigo é não apenas o governo, mas também [ROOT.GetPoliticalEnemy]. \n\nDe qualquer forma, ainda vamos vencer e ainda sairemos vitoriosos, não importa os custos!"
 chile.45.a:0 "Esses desgraçados vão PAGAR!"
 CHL_nacismo_enemy:0 "Os Nacistas"
 CHL_communismo_enemy:0 "Os comunistas"
 
 chile.48.t:0 "Pedro Aguirre Cerda faleceu"
 chile.48.d:0 "Hoje marca um dia triste para o povo chileno, pois o presidente e líder da Frente Popular, Pedro Aguirre Cerda, faleceu no cargo. Sua causa de morte foi tuberculose, isso não era novidade para Pedro no entanto, como já sabia que seu estado de saúde estava se deteriorando, nomeou Jerónimo Méndez como vice-presidente. \n\nPor causa de sua morte, Jerónimo assumirá agora o cargo original de Pedro e liderará o povo do Chile até 1942 eleições. O que vem a seguir são grandes desafios para o senhor Jerónimo, mas o povo está certo de que ele vai sobreviver."
 chile.48.a:0 "Este é realmente um dia triste"

 chile.49.t:0 "As eleições de 1942"
 chile.49.d:0 "Por mais distante que pareça 1942, muitos ficaram surpresos ao perceber que já estamos lá e que as eleições estão apenas começando. \n\nVários políticos estão concorrendo a cargos, sendo o mais proeminente Carlos Ibáñez del Campo, que já foi presidente do Chile antes, e quer se candidatar novamente, mas como político independente. \n\nEstas eleições vão ficar bastante agitadas, mas no final o vencedor das eleições de 1942 é.. ."
 chile.49.a:0 "Juan Antionio Rios"
 chile.49.b:0 "Gustavo Ross Santa Maria"
 chile.49.c:0 "Carlos Ibáñez del Campo"

 uruguay.2.t:0 "Nossos oficiais prenderam algumas pessoas de aparência suspeita"
 uruguay.2.d:0 "Os policiais do nosso governo prenderam pessoas que pareciam bastante suspeitas. Os policiais alegaram que essas pessoas não eram confiáveis ​​e foram presas. \n\nAs notícias provavelmente serão divulgadas às pessoas por meio de terceiros -fontes do partido e eles não ficarão felizes, mas nosso governo será mais forte, então vale a pena no final."
 uruguay.2.a:0 "Interessante, vamos ter que esperar e ver no que isso vai dar"
 uruguay.3.t:0 "Alguns de nossos prisioneiros foram libertados"
 uruguay.3.d:0 "Acaba de chegar a notícia de que alguns de nossos prisioneiros foram libertados hoje. \n\nComo eles escaparam é um debate, não sabemos se eles escaparam sozinhos ou se outras pessoas os ajudaram . Inferno, talvez até pessoas do nosso próprio governo os tenham ajudado. \n\nSeja o que for, isso é um sinal claro de que precisamos ser ainda mais severos com a população para garantir que isso não aconteça novamente."
 uruguay.3.a:0 "Talvez haja uma razão subjacente para que isso tenha acontecido"
 uruguay.5.t:0 "Terra e seus fiéis torcedores tomam conta do país"
 uruguay.5.d:0 "Depois que a notícia se espalhou para todos os uruguaios da Terra sendo expulsos à força do cargo, muitos de seus leais apoiadores saíram às ruas para protestar violentamente contra sua deposição. \n\nToda cidade, cada rua, cada quarteirão , há legalistas fazendo tudo ao seu alcance para que Terra volte ao poder. A violência está sendo abusada massivamente pela multidão e muitas pessoas já perderam a vida por causa disso. \n\nTemos que agir rápido contra os manifestantes, se quisermos nosso país para se manter à tona, e isso infelizmente significará mais sangue derramado, mas chegou a um ponto em que é uma obrigação".
 uruguay.5.a:0 "Você vai pagar, Terra!"
 uruguay.6.t:0 "Roosevelt chegou a Montevidéu"
 uruguay.6.d:0 "Há apenas uma hora, Roosevelt chegou a Montevidéu e vem visitar a Terra para discutir vários assuntos políticos e melhorar as relações diplomáticas. Ele foi recebido com aplausos da multidão e agitando bandeiras americanas e uruguaias, e muitas fotos de ambos os presidentes foram tomados. \n\nEsperamos poder melhorar ainda mais nossas relações com os americanos e tê-los como aliados no futuro."
 uruguay.6.a:0 "Para o bem maior de ambas as nossas nações!"
 uruguay.7.t:0 "Eleições do Uruguai"
 uruguay.7.d:0 "Após reformar a Constituição uruguaia, Gabriel Terra permitiu a realização de eleições livres após vários anos. Este é um grande avanço em nossa nação. \n\nDois grandes partidos políticos se destacam, o Colorado e o Nacional. Ambos são cruciais no Uruguai e decidiram grande parte da história desta nação, com até mesmo uma guerra civil ocorrendo na década de 1860 por causa disso. \n\nQuem está ganhando as eleições?"
 uruguay.7.a:0 "Partido Nacional"
 uruguay.7.b:0 "Partido Colorado"
 uruguay.8.t:0 "Uruguai propõe um acordo de paz entre nossas nações"
 uruguay.8.d:0 "Diplomatas uruguaios chegaram hoje a Buenos Aires para propor um acordo de paz entre nossa nação. O Uruguai sabe muito bem que são uma ameaça para nós e querem fazer um pacto conosco. \n\nOs diplomatas declarar que não haverá guerra entre nossas nações e que nós dois cooperaremos pacificamente e construiremos cada uma de nossas nações. \n\nExistem muitas ameaças ao nosso redor, então aceitar este acordo não é tão improvável. Devemos fazê-lo isto?"
 uruguay.8.a:0 "Sim, vamos trabalhar com nossos novos Aliados"
 uruguay.8.b:0 "Não, temos outros planos"
 uruguay.9.t:0 "Argentina aceita nossa proposta"
 uruguay.9.d:0 "Nossos diplomatas voltaram hoje a Montevidéu com ótimas notícias, a Argentina aceita nossa proposta e agora somos oficialmente aliados."
 uruguay.9.a:0 "Ótimo!"
 uruguay.10.t:0 "Argentina recusa nossa proposta"
 uruguay.10.d:0 "Nossos diplomatas voltaram hoje a Montevidéu com más notícias, infelizmente não aceitaram nossa proposta e não farão aliança conosco."
 uruguay.10.a:0 "Estão planejando alguma coisa, tenho certeza!"
 uruguay.11.t:0 "Caminhões que transportam alguns de nossos soldados acabaram de explodir!"
 uruguay.11.d:0 "Caminhões que transportam alguns de nossos soldados acabam de explodir em Entre Rios, perto da fronteira uruguaia! Após uma inspeção mais detalhada, descobriu-se que soldados uruguaios de fato cruzaram a fronteira e deliberadamente colocaram explosivos para explodir \n\nIsso é nada menos que um ato de terrorismo contra a Argentina e o povo argentino e os uruguaios estão mais do que cientes disso. \n\nNão há como ficarmos de braços cruzados e deixar eles se safarem disso, em apenas algumas horas todo argentino vai saber da atrocidade e pleitear a guerra contra os uruguaios, e nós realmente vamos ignorar nosso povo assim?"
 uruguay.11.a:0 "Eles vão pagar com cada centímetro de sangue que tiverem!"
 uruguay.11.b:0 "Simplesmente não estamos em condições de declarar guerra aos uruguaios."
 uruguay.12.t:0 "A Argentina não nos declarou guerra como esperávamos"
 uruguay.12.d:0 "24 horas se passaram e não houve resposta da Argentina, e parece que eles não vão nos declarar guerra para que o Brasil nos ajude. \n\nTeremos que dupla com os argentinos sozinho, o que é algo que talvez não possamos fazer."
 uruguay.12.a:0 "Não importa, ainda iremos para a guerra e venceremos!"
 uruguay.13.t:0 "Os uruguaios estão nos pedindo para nos unirmos à guerra contra a Argentina"
 uruguay.13.d:0 "Diplomatas uruguaios chegaram hoje, presumivelmente mais cansados ​​do que o normal, nos pedindo para participar da guerra contra a Argentina. Eles nos disseram que em troca ganharíamos Formosa por nossa participação na guerra. \n\nDevemos aceitar esta oferta?"
 uruguay.13.a:0 "Claro, os argentinos não têm chance!"
 uruguay.13.b:0 "Não podemos arcar com uma guerra agora"
 uruguay.14.t:0 "Os paraguaios recusaram nosso pedido"
 uruguay.14.d:0 "Os paraguaios disseram aos nossos diplomatas que não se juntarão à guerra contra a Argentina, dizendo que não estão em condições de estar em guerra neste momento."
 uruguay.14.a:0 "Compreensível"
 uruguay.15.t:0 "Uruguai propõe uma forma de dividir a Argentina"
 uruguay.15.d:0 "Diplomatas uruguaios chegaram hoje para nos dizer que têm um plano para dividir a Argentina. \n\nPara começar, o Uruguai ganhará todas as províncias rioplatenses, que são Buenos Aires, Entre Rios, Santa Fe , La Pampa, Neuquén, Rio Negro, Chubut, Santa Cruz e Tierra Del Fuego. \n\nGanharemos as províncias de Missiones e Corrientes, e o resto da Argentina se tornará um satélite nosso. \n\nDevemos aceitar esta oferta de paz?"
 uruguay.15.a:0 "Claro, parece justo"
 uruguay.15.b:0 "Não, fomos nós que trabalhamos mais!"
 uruguay.16.t:0 "Brasil recusa nossa oferta de paz"
 uruguay.16.d:0 "Os brasileiros responderam aos nossos diplomatas, dizendo que não vão aceitar essas ofertas de paz e preferem dividir a Argentina como fizemos agora."
 uruguay.16.a:0 "Deus te dane Brasil..."
 uruguay.17.t:0 "Quem deve liderar nossa nação?"
 uruguay.17.d:0 "Com a guerra civil em pleno andamento e nossa nação no caos, uma questão se levanta acima de qualquer outra, quem deve liderar o país? \n\nAprisionar a Terra fez com que o novo estado que foi criado estar perto da anarquia, e precisamos de um líder forte o mais rápido possível. Devido à sua prisão, os ideais democráticos e comunistas se espalham para todo o povo uruguaio que é contra a Terra. \n\nEsta pode ser a última vez que o povo decide quem a nação será liderada, então temos que tomar a decisão certa e rápido. Depois de uma eleição apressada, o vencedor é..."
 uruguay.17.a:0 "O Consejo Provisionario vai liderar por enquanto."
 uruguay.17.b:0 "Eugenio Gómez levará a representar os trabalhadores."
 uruguay.18.t:0 "[GetYear] Eleições"
 uruguay.18.d:0 "Apesar da situação que levou os partidos a formar a coalizão, a pressão de todos os setores democráticos do país vinha aumentando sobre [URG.GetLeader], exigindo o retorno de eleições livres, com alguns radicais até reivindicando que [URG.GetLeader] busca manter o poder para si mesmo e, cedendo à pressão, [URG.GetLeader] havia marcado eleições para [GetYear].\n\nMesmo com a situação no país longe de ser estável, parece [URG.GetLeader] cumpriu sua promessa e, hoje, os eleitores tiveram que decidir entre votar em Emilio Frugoni, Luis Batlle Berres ou Luis Alberto de Herrera. Enquanto Frugoni e Batlle gozam de relativa popularidade entre a população, Luis Alberto de Herrera é visto pela maioria dos liberais como um traidor do país, sendo defendido apenas pelos que apoiaram o Terra. No entanto, todos os candidatos gozam de uma boa base eleitoral, dando a todos a chance de vencer esta importante eleição. \n\nEm [GetDateText], enquanto os votos estão sendo contados, é quase óbvio que..."
 uruguay.18.a:0 "Luis Batlle Berres ganhou as eleições!"
 uruguay.18.b:0 "Emilio Frugoni ganhou as eleições!"
 uruguay.18.c:0 "Luis Alberto de Herrera ganhou as eleições!"
 uruguay.19.t:0 "Luis Batlle Berres renuncia!"
 uruguay.19.d:0 "Os crescentes esforços da oposição para bloquear suas tentativas de reforma afetaram a popularidade e o poder de Batlle Berres dentro do partido. Aproveitando essa situação, Andrés Martínez Trueba fez um acordo com Luís Alberto de Herrera do Partido Nacional, ganhando seu apoio e aumentando ainda mais a pressão contra Batlle Berres. \n\nTendo ganho poder suficiente após o acordo com Herrera, Martínez começou a pressionar Batlle Berres a fazer concessões a ele. E, finalmente, ele começou a pressionar ele e seu gabinete para renunciar. Sabendo que Martínez tinha o controle conquistado de ambas as câmaras legislativas e o apoio do Partido Nacional, hoje, ao meio-dia, o presidente Luis Batlle Berres anunciou sua renúncia nas Câmaras de Senadores e Diputados, logo seguido pela renúncia de seu vice-presidente Alfeo Brum e de todo o seu gabinete, pegando de surpresa a maior parte da nação. \n\nUsando seu apoio no parlamento, Martínez conseguiu ser eleito presidente interino por uma escassa maioria."
 uruguai.19.a:0 "Sucesso"
 uruguay.20.t:0 "[GetYear] Referendo Constitucional"
 uruguay.20.d:0 "Pouco depois de uma semana após assumir a presidência, Andrés Martínez propôs uma reforma constitucional, que visava abolir a presidência e substituí-la por um novo sistema baseado no Consejo Nacional de Administración, que foi abolido por Gabriel Terra em 1933. Isso foi feito para manter sua parte no acordo com Herrera, já que ambas as partes concordaram em cooperar apenas se o poder fosse compartilhado entre ambas as partes.\n\nEssa reforma foi votada pela população uma semana atrás em referendo, com as opções de manter a constituição como está ou aceitar a nova proposta. E depois de apurados os votos restantes, o Tribunal Eleitoral anunciou hoje que o referendo..."
 uruguay.20.a:0 "...Passado!"
 uruguay.20.b:0 "...Falha?!"
 uruguay.21.t:0 "Impasse Político"
 uruguay.21.d:0 "Após os resultados do referendo, disputas políticas entre os dois partidos levaram à separação da coalizão entre o Partido Colorado e o Partido Nacional. Com os partidos Nacional e Colorado divididos em facções opostas, tanto o parlamento quanto o o poder executivo foi reduzido a um rastejamento, tornando o governo incapaz de tomar qualquer medida para aliviar as tensões entre ambas as partes e tornando muito mais difícil o aprisionamento dos remanescentes terristas. \n\nToda essa tensão levou a um impasse e clima tenso em Montevidéu, pois as diferenças entre os partidos continuam a crescer e as rachaduras começam a aparecer tanto no novo governo quanto no sistema democrático."
 uruguay.21.a:0 "Isto é um desastre!"
 uruguay.22.t:0 "O governo cai!"
 uruguay.22.d:0 "O impensável aconteceu! Pouco antes de um mês de impasse político e agitação cobrou seu preço tanto da cidadania quanto do governo de Martínez. \n\nApós protestos massivos na Plaza Independencia e no Palacio Legislativo , Martínez anunciou sua renúncia, logo seguida pelo resto de seu gabinete. Qualquer tentativa do parlamento de nomear um interino fracassou, devido à falta de cooperação do PN e à pressão da população civil descontente ".
 uruguay.22.a:0 "Isso pode ficar pior?!"
 uruguay.26.t:0 "Destino da Argentina"
 uruguay.26.d:0 "Depois de nossa vitória contra o governo argentino, muitos começam a se perguntar o que será da República Argentina. [URG.GetLeader] convocou uma reunião de representantes das comunas do Uruguai para chegar a um acordo sobre o que será da Argentina. Depois de alguns debates, o consenso é que..."
 uruguay.27.d:0 "Após nossa vitória com o Chile contra o governo argentino, muitos começam a se perguntar o que será da Argentina. [URG.GetLeader] convocou uma reunião de representantes das comunas do Chile e do Uruguai para chegar a um acordo acordo sobre como dividir a Argentina entre as duas comunas anarquistas. Depois de algum debate, o consenso é que..."
 uruguay.26.a:0 "Formaremos na região comunas leais à revolução."
 uruguay.26.b:0 "Vamos dividir a Argentina em duas regiões e formar comunas leais à revolução."
 uruguay.26.c:0 "Vamos integrar os argentinos nas comunas existentes."
 uruguay.27.t:0 "Destruindo a Argentina"
 uruguay.27.a:0 "Vamos dividir a Argentina com o Chile e ambos formaremos comunas leais à revolução em nossas regiões."
 uruguay.27.b:0 "Vamos integrar os argentinos em nossas comunas existentes, enquanto os chilenos fazem o mesmo."
 uruguay.28.t:0 "O Estado da Economia"
 uruguay.28.d:0 "Desde sua independência em 1830, o Uruguai tem sido uma sociedade agrária, com a maior parte da renda proveniente de estâncias no campo. No entanto, com a revolução industrial na Europa, as indústrias estrangeiras começaram a chegar O Uruguai, e com eles, veio a maquinaria industrial, iniciando um processo de urbanização e industrialização centrado em torno da capital Montevidéu. , onde o Uruguai entrou em uma era de ouro graças à receita dessas exportações. \n\nAgora, com as tensões fermentando na Europa e no resto do mundo, os economistas começaram a debater se esse sistema é sustentável no longo prazo ou se é tempo para o Uruguai se equiparar aos tempos modernos. Alguns membros do governo também estão preocupados que uma mudança drástica em nossa economia possa trazer descontentamento entre a população rural e as elites."
 uruguay.28.a:0 "Se não está quebrado, não conserte"
 uruguay.28.b:0 "Devemos alcançar o resto do mundo"
 uruguay.29.t:0 "O destino do estado de bem-estar social"
 uruguay.29.de:0 "À medida que continuamos a criar projetos para expandir nossa situação econômica, tornou-se mais difícil manter um superávit positivo em nosso orçamento anual. Com isso em mente, alguns membros de nosso gabinete sugeriram uma reforma no muitos programas de bem-estar patrocinados pelo governo. \n\n\nIsso levou a um debate controverso, já que esses programas são muito populares entre o povo e reformas extensas podem ser muito impopulares. Alguns políticos também argumentaram que uma abolição completa desses programas nos permitiria industrializar rapidamente, mas essa ação poderia gerar reação tanto da população quanto de outros políticos."
 uruguay.29.a:0 "Manter o sistema atual."
 uruguay.29.b:0 "Aprovar algumas pequenas reformas."
 uruguay.29.c:0 "Aprovar algumas reformas básicas."
 uruguay.29.d:0 "Aprovar amplas reformas."
 uruguay.29.e:0 "Abolir o sistema de bem-estar."
 uruguay.30.t:0 "Fray Bentos Corned Beef"
 uruguay.30.d:0 "Fray Bentos é uma marca de carne enlatada originária da planta Anglo Meatpacking em Rio Negro, com seu nome originário da cidade de Fray Bentos, onde está localizada. Essa marca vem obtendo notável sucesso devido para as tensões crescentes, com muitas nações começando a estocar produtos enlatados em caso de uma guerra total. \n\nIsso nos deixa em uma posição interessante, já que muitas nações estão dispostas a comprar nossos produtos, mas o tamanho limitado da fábrica e mão de obra significa que só pode cobrir as demandas de uma grande nação. Argumentos podem ser feitos para ajudar qualquer um dos lados, mas também podem ser consumidos localmente se não conseguirmos um comprador.
 uruguay.30.a:0 "Exportar para a Grã-Bretanha"
 uruguay.30.b:0 "Exportar para a Alemanha"
 uruguay.30.c:0 "Exportar para a União Soviética"
 uruguay.30.do:0 "Em vez disso, produza para consumo local"
 uruguay.31.t:0 "Os protestos de Nacionales irrompem em uma guerra civil!"
 uruguay.31.d:0 "Depois de mais de um ano de oposição dos Blancos às nossas ações políticas, o barril de pólvora atingiu seu ponto de ebulição e explodiu. \n\nApoiadores dos Blancos se reuniram em todo o país, capturando armas de nossas reservas , e começaram a atacar prédios do governo e delegacias de polícia locais. \n\nPrecisamos lidar com essa insurreição imediatamente antes que ela saia do controle!"
 uruguay.31.a:0 "Eles vão pagar por isso!"
 uruguay.32.t:0 "Os protestos dos Colorados irrompem em uma guerra civil!"
 uruguay.32.d:0 "Após mais de um ano de oposição dos Colorados às nossas ações políticas, o barril de pólvora atingiu seu ponto de ebulição e explodiu. \n\nOs colorados se reuniram em todo o país, capturando armas de nossas reservas , e começaram a atacar prédios do governo e delegacias de polícia locais. \n\nPrecisamos lidar com essa insurreição imediatamente antes que ela saia do controle!"
 uruguay.32.a:0 "Eles vão pagar por isso!"

 
 peru.122.t:0 "As eleições peruanas de 1936"
 peru.122.d:0 "O dia 11 de outubro chegou mais rápido do que o esperado e o dia das eleições está chegando. De todos os partidos do nosso país, 4 grandes partidos se destacam dos demais. \n\nO primeiro é o Partido Social Democrata, liderada por Luis Antonio Eguiguren e representa os ideais democráticos. \nA próxima é a Frente Nacional de Derecha, liderada por Jorge Prado Ugarteche, e representa ideais semelhantes aos de Oscar. \nA terceira opção é o Partido Unión Revolucionaria, liderado por Luis A. Flores, e representa os ideais fascistas ultranacionalistas.\nA última opção é a Alianza Acción Republicana, liderada por Manuel Vicente Villarán, e representa os ideais comunistas.\n\nApós uma votação bastante apertada, o vencedor das eleições de 1936 é. .."
 peru.122.a:0 "Partido Social Democrata"
 peru.122.b:0 "Frente Nacional de Derecha"
 peru.122.c:0 "Partido União Revolucionária"
 peru.122.e:0 "Alianza Acción Republicana"
 peru.123.t:0 "Os resultados das eleições foram cancelados"
 peru.123.d:0 "Embora mais de 700.000 pessoas já tenham votado, Oscar Benavides decidiu cancelar a eleição e declarou que governará a nação por mais 3 anos. \n\nA razão para uma decisão tão severa foi devido à especulação de que o partido socialista democrático, Partido Social Democrata, estava usando fraude eleitoral para ganhar a maioria dos votos. com isso e muitos estão ficando com medo de planejar algo em um futuro próximo."
 peru.123.a:0 "São mais três anos de Oscar"

 peru.126.t:0 "[FROM.GetName] gostaria de discutir o investimento potencial com [Root.GetNameDef]!"
 peru.126.desc:0 "[FROM.GetName] enviou um embaixador diplomático para nos oferecer a oportunidade de investir em seu país. O embaixador afirma que "para que a América do Sul cresça, todas as nações aqui devem trabalhar lado a lado Além disso, ele promete que o governo [FROM.GetAdjective] estará mais propenso a se inclinar a nosso favor com a aceitação desta oportunidade. Devemos aceitar sua oferta?"
 peru.126.a:0 "Investiremos uma pequena quantia."
 peru.126.b:0 "Investiremos uma quantia modesta."
 peru.126.c:0 "Nenhum preço é grande demais para um amigo!"
 peru.126.d:0 "Não podemos desperdiçar nossos recursos agora."
 peru.127.t:0 "[From.GetNameDef] Recusa!"
 peru.127.desc:0 "Devido a uma infinidade de razões, [From.GetNameDef] recusou nossa oferta de investimento, afirmando "Embora o investimento não esteja nos planos agora, nossa opinião pode mudar mais tarde...""
 peru.127.a:0 "Infeliz."
 peru.128.t:0 "[From.GetNameDef] investe uma pequena quantia!"
 peru.128.desc:0 "Nossa missão diplomática para [From.GetNameDef] deu frutos, pois agora eles concordaram com um pequeno investimento!"
 peru.128.a:0 "Muito apreciado."
 peru.129.t:0 "[From.GetNameDef] investe uma quantia modesta!"
 peru.129.desc:0 "Nossa missão diplomática para [From.GetNameDef] deu frutos, pois agora eles concordaram com um investimento modesto!"
 peru.129.a:0 "Obrigado."
 peru.130.t:0 "[From.GetNameDef] investe uma grande quantia!"
 peru.130.desc:0 "Nossa missão diplomática para [From.GetNameDef] deu frutos, pois agora eles concordaram com um grande investimento!"
 peru.130.a:0 "Muito obrigado!"
 peru.131.t:0 "Dia de Eleições"
 peru.132.t:0 "Dia de Eleições"
 peru.131.desc:0 "Com a Assembléia Constituinte aprovando uma eleição determinando quem lidera nosso governo, dois grandes partidos democráticos se formaram e estão incitando as massas para votar na eleição. Agora os balés foram contados e o vencedor da eleição é..."
 peru.132.desc:0 "Com a Assembléia Constituinte aprovando uma eleição determinando quem lidera nosso governo, dois grandes partidos democráticos se formaram e estão incitando as massas a votar na eleição. Agora os balés foram contados e o vencedor da eleição é..."
 peru.131.a:0 "A Frente Democrática Nacional!"
 peru.132.a:0 "O Movimento Democrático Peruano!"
 
 peru.133.t:0 "O Peru gostaria de assinar um Acordo de Livre Comércio conosco!"
 peru.133.desc:0 "Representantes diplomáticos do Peru vieram até nós com uma oferta. Assine um Acordo de Livre Comércio para aumentar o comércio entre nossas nações. Aceitar aumentaria as relações comerciais e provavelmente faria com que o Peru gostasse mais de nós. , negar tal pedido servil provavelmente azedaria as relações com o Peru."
 peru.133.a:0 "As barreiras econômicas entre nós devem desaparecer!"
 peru.133.b:0 "Não temos intenção de negociar com você."
 
 peru.134.t:0 "[From.GetNameDef] Concorda!"
 peru.134.desc:0 "[From.GetNameDef] concordou e assinou um Acordo de Livre Comércio conosco!"
 peru.134.a:0 "Que possamos prosperar juntos."

 peru.135.t:0 "[From.GetNameDef] Recusa!"
 peru.135.desc:0 "[From.GetNameDef] se recusou a assinar um Acordo de Livre Comércio conosco..."
 peru.135.a:0 "Ai."
 
 peru.136.t:0 "Nossa Coalizão está desmoronando!"
 peru.136.desc:0 "Nossa tendência recente para a esquerda política fez com que muitos políticos conservadores e de direita, que uma vez cooperaram conosco, abandonassem nossa coalizão! Nosso partido antes unido não é mais tão unido..."
 peru.136.a:0 "Nós não precisamos deles."
 
 peru.137.t:0 "[FROM.GetName] Quer Reformar Nossa Antiga Confederação!"
 peru.137.d:0 "Pessoas políticas de [FROM.GetName] nos contataram, perguntando se concordaríamos em reformar a Confederação Peru-Boliviana e combinar nossas nações na tentativa de se tornar o poder dominante no continente e talvez o Américas como um todo. \n\nHá algum tempo, nossas nações estão se aproximando muito, e podemos unificar os dois países e nos tornar a potência que já fomos. \n\nA Confederação original consistia em três nações: O estado do norte do Peru, o estado do sul do Peru e a Bolívia. Foi estabelecido em 9 de maio de 1836. \n\nEmbora possamos encontrar resistência e nossos vizinhos possam provar não ser tão legais quanto afirmam ser, o A quantidade de poder que ganharemos com isso será imensa, e nosso legado não estará morto, pois ainda viveremos como um governo cooperativo. \n\nDevemos aceitar essa proposta e tentar mais uma vez reformar a Confederação?"
 peru.137.a:0 "É hora de recuperar nossa antiga glória!"
 peru.137.b:0 "Não funcionou da última vez, por que funcionaria agora?"
 
 peru.1.t:0 "[FROM.GetName] aceitou reformar a Confederação"
 peru.1.d:0 "Depois de apenas algumas horas, [FROM.GetName] já respondeu à nossa proposta, concordando em reformar a Confederação mais uma vez e tentar mais uma vez nos estabelecer como um estado soberano e estabelecer uma posição dominante no região, da mesma forma que a Confederação original queria fazer. \n\nDesta vez, no entanto, teremos sucesso, não importa o que nossos inimigos joguem contra nós, seremos vitoriosos e faremos o que a Confederação original não conseguiu fazer !"
 peru.1.a:0 "O mundo conhecerá nosso verdadeiro poder combinado!"

 peru.2.t:0 "A Confederação Peru-Boliviana pode ser muito poderosa"
 peru.2.d:0 "Chegou a notícia de que a Confederação Peru-Boliviana, uma união que foi erradicada há quase um século, voltou e parece com amargura se vingar de seus inimigos. \n\nEles parecem extremamente poderosos e, se permitirmos que eles permaneçam intactos, eles podem perturbar o equilíbrio de poder na região e causar estragos, e não podemos permitir que isso aconteça. \n\nDevemos intervir e impedir essa ameaça antes que fique pior ?"
 peru.2.a:0 "Nós vamos pará-los como fizemos da primeira vez!"
 peru.2.b:0 "Nós simplesmente não estamos prontos para a guerra"

 peru.3.t:0 "[FROM.GetName] se recusou a reformar a Confederação"
 peru.3.d:0 "Funcionários de [FROM.GetName] responderam à nossa proposta de união entre nossas nações, dizendo que eles têm suas razões para não aceitá-la e que seria melhor se eles permanecessem independentes. \n\nMesmo depois todo o esforço que fizemos para melhorar os laços para conseguir essa façanha, e eles simplesmente cospem em nós e recusam essa proposta é uma vergonha! \n\nDevemos responder com força, ou devemos simplesmente deixar a ideia ir?"
 peru.3.a:0 "Esses bastardos terão o que merecem!"
 peru.3.b:0 "Vamos procurar uma rota diferente"

 peru.138.t:0 "[FROM.GetName] está nos pedindo para estar do lado deles durante a Segunda Guerra do Pacífico"
 peru.138.d:0 "Oficiais de [FROM.GetName] nos disseram que estão planejando uma invasão no Chile para recuperar suas terras perdidas da Guerra do Pacífico, e eles querem que estejamos do lado deles quando eles lance essa invasão. \n\nEles afirmam que desta vez teremos sucesso e venceremos os chilenos de uma vez por todas e recuperaremos nossas terras perdidas. \n\nConsiderando que também perdemos território para os chilenos, essa chance parece como uma oportunidade única na vida, então devemos aproveitá-la? \n\n\nAVISO: Se você aceitar, será obrigado a declarar guerra aos chilenos quando [FROM.GetName] o fizer. Se não aceitarmos, [ FROM.GetName] pode declarar guerra a nós!"
 peru.138.a:0 "Aceite, vamos declarar guerra no segundo que eles fizerem!"
 peru.138.b:0 "Recusar, não podemos permitir outra guerra"

 peru.4.t:0 "[FROM.GetName] aceitou nosso tratado"
 peru.4.d:0 "[FROM.GetName] aceitou o tratado que propusemos a eles, e eles concordaram em declarar guerra aos chilenos quando o fizermos. Com nossas forças combinadas, eles não terão chance!"
 peru.4.a:0 "Ótimo!"

 peru.5.t:0 "[FROM.GetName] recusou-se a entrar na guerra"
 peru.5.d:0 "[FROM.GetName] não honrou nosso pacto proposto, dizendo que eles não estão em posição de declarar guerra. Como devemos responder à sua recusa?"
 peru.5.a:0 "Vá atrás dos Bastardos Backstabbing!"
 peru.5.b:0 "Deixe-os ir, não podemos permitir outro inimigo"

 peru.124.t:0 "[FROM.GetName] Declarou Guerra, e agora é a nossa vez de agir"
 peru.124.d:0 "[FROM.GetAdjective] forças atravessaram a fronteira chilena agora mesmo e uma declaração oficial de guerra foi declarada há poucos minutos. \n\nDevido ao nosso signatário do pacto há alguns meses, somos obrigados a junte-se a eles em seu esforço de guerra, mas ainda temos a opção de nos recusar a participar. Devemos ter em mente que esse ato de traição quase certamente levará a uma declaração de guerra de [FROM.GetName]. \n\nDado. nossas circunstâncias, o que devemos fazer?"
 peru.124.a:0 "Junte-se à guerra e esmague os chilenos!"
 peru.124.b:0 "Desculpe [FROM.GetName], mas desta vez temos que passar"

 peru.6.t:0 "Devemos intervir na Segunda Guerra do Pacífico?"
 peru.6.d:0 "Para alguns pode parecer estúpido até mesmo considerar entrar em estado de guerra contra o Peru e a Bolívia, mas depois de uma análise cuidadosa os pontos positivos superam os negativos. \n\nNão só isso, tendo o Chile como aliado nos ajudará muito no futuro, e nossas forças combinadas destruirão o Peru e a Bolívia! \n\nEntão, devemos intervir e ajudar os chilenos?"
 peru.6.a:0 "Claro! Lima aqui vamos nós!"
 peru.6.b:0 "Nós simplesmente não podemos fazer uma coisa dessas"

 peru.7.t:0 "[FROM.GetName] estará nos ajudando na Segunda Guerra do Pacífico!"
 peru.7.d:0 "É oficial, [FROM.GetName] declarou guerra ao Peru e à Bolívia e estará oficialmente nos ajudando em nossos esforços de guerra. Esta é uma ótima notícia e graças à guerra de duas frentes nossa linha de frente será aliviada ."
 peru.7.a:0 "Ótimo!"

 peru.8.t:0 "Nossos inimigos foram aleijados, a guerra está chegando ao fim"
 peru.8.d:0 "Depois de muitos meses de guerra e muitas vidas perdidas, parece que estamos vencendo nossos inimigos e sendo encurralados. \n\nNosso povo, no entanto, está se cansando rapidamente da guerra e está protestando para parar a guerra. Não só eles, muitos de nossos soldados estão se esquivando e nossos oficiais estão nos dizendo que seus soldados estão se recusando a continuar com a guerra. \n\nApós uma análise cuidadosa, seria melhor para nós parar a guerra aqui e exercer nosso domínio na guerra e forçar nossos inimigos a entregar território que era essencial para nós em troca de condições de paz. \n\nDevemos iniciar negociações de paz?"
 peru.8.a:0 "Vamos acabar com essa guerra de uma vez por todas"
 peru.8.b:0 "Continue! Não vamos parar até que eles sejam varridos do mapa!"

 peru.9.t:0 "Nossos exércitos estão sendo aleijados, devemos parar esta guerra?"
 peru.9.d:0 "Após meses de batalha, os exércitos peruano-bolivianos provaram ser demais para os nossos, e isso rapidamente se tornou um fardo para nós. \n\nO moral dos soldados está em um nível mais baixo e o povo é unanimemente contra continuar esta guerra. \n\nDevemos nos render aos peruano-bolivianos, ou devemos continuar?"
 peru.9.a:0 "Não temos escolha"
 peru.9.b:0 "Vamos continuar até o amargo fim!"


 peru.10.t:0 "[FROM.GetName] está disposto a se render"
 peru.10.d:0 "Delegados de [FROM.GetName] concordaram com nossas condições de paz e concordam em desistir de terras que são nossas por direito. Finalmente, nosso caminho para a glória foi aberto e nossa guerra pela independência está um passo mais perto para ser concluído."
 peru.10.a:0 "Claro, aceitaremos os termos de rendição"
 peru.10.b:0 "Ainda não terminamos! Eles vão sofrer!"

 peru.11.t:0 "Estamos perdendo a guerra"
 peru.11.d:0 "Depois de perder muitos de nossos homens e perder uma boa parte do nosso território, ficou bem claro que simplesmente não podemos vencer este conflito. Vamos pedir negociações de paz com os belicistas e atacar fazer um acordo com eles: damos a eles seu território central em troca de interromper a guerra. \n\nSempre temos a opção de continuar, mas neste momento não faz muito sentido continuar. Então, o que devemos fazer ?"
 peru.11.a:0 "Render-se"
 peru.11.b:0 "Continue"

 peru.12.t:0 "[FROM.GetName] está disposto a se render"
 peru.12.d:0 "[FROM.GetName] se aproximou de nós, dizendo que eles estão dispostos a se render e ceder às nossas demandas territoriais. \n\nA julgar pela quantidade de vidas que foram perdidas e o fato de que já ganhou mais terra do que o esperado, então, devemos aceitar seus termos de rendição?"
 peru.12.a:0 "Vamos acabar com este conflito de uma vez por todas"
 
 peru.13.t:0 "[FROM.GetName] está solicitando uma garantia"
 peru.13.d:0 "Delegados de [FROM.GetName] chegaram ao nosso país hoje para perguntar se podemos ou não dar uma garantia à sua nação e garantir sua independência no caso de uma invasão estrangeira. \n\nEles' Recentemente, estamos passando por um esforço bastante grande para melhorar suas relações conosco e com outras social-democracias ao redor do mundo, e isso ajudaria ter um aliado na América do Sul. \n\nDevemos aceitar e garantir sua independência?"
 peru.13.a:0 "Claro"
 peru.13.b:0 "Não podemos"

 peru.14.t:0 "[FROM.GetName] se recusou a nos garantir!"
 peru.14.d:0 "[FROM.GetName] respondeu aos nossos delegados, declarando que eles não garantirão nossa independência por razões que não foram mencionadas. Isso pode significar alguma coisa?"
 peru.14.a:0 "Acho que simplesmente temos que aceitar"

 peru.15.t:0 "[FROM.GetName] está pedindo [490.GetName] em troca de convite e garantia de facção"
 peru.15.d:0 "Delegados de [FROM.GetName] vieram à nossa nação hoje para perguntar se eles estão dispostos a dar [490.GetName] a eles em troca de proteção e um convite de facção. A força de [FROM.GetName] é inegável, e recusar isso parece ridículo, no entanto, não devemos desistir tão facilmente. \n\nDevemos aceitar esta oferta?"
 peru.15.a:0 "Claro"
 peru.15.b:0 "Não podemos desistir da nossa terra tão facilmente"
 
 peru.16.t:0 "[FROM.GetName] aceitou nossa proposta"
 peru.16.d:0 "[FROM.GetName] acaba de responder aos nossos delegados, dizendo que aceitam nossa proposta e seus efeitos ocorrerão em breve."
 peru.16.a:0 "Que bom que pudemos fazer isso diplomaticamente"

 peru.17.t:0 "[FROM.GetName] recusou nossa proposta"
 peru.17.d:0 "[FROM.GetName] acaba de responder aos nossos delegados, dizendo que não aceitarão nossa proposta e se recusarão a continuar qualquer conversa relacionada ao tópico."
 peru.17.a:0 "Eles não vão se safar!"
 peru.17.b:0 "Deixe-os ir"
 
 peru.18.t:0 "[FROM.GetName] está pedindo voluntários"
 peru.18.d:0 "Vários delegados de [FROM.GetName] chegaram hoje ao nosso país para um pedido bastante simples, para enviarmos voluntários. \n\nAtualmente [FROM.GetName] está na Segunda Guerra de o Pacífico e os delegados afirmam que precisam de toda a ajuda possível e, devido aos nossos governos semelhantes, acreditam que podemos ajudá-los. \n\nDevemos enviar-lhes alguns voluntários?"
 peru.18.a:0 "Envie-lhes 3 voluntários"
 peru.18.b:0 "Envie-lhes 6 voluntários"
 peru.18.c:0 "Não envie ajuda"

 peru.19.t:0 "[FROM.GetName] concorda em enviar 3 voluntários"
 peru.19.d:0 "[FROM.GetName] concordou com nosso pedido de voluntários e enviou 3 para nos ajudar em nossos esforços de guerra. Esses voluntários foram transferidos diretamente para nosso comando e podemos usar esses homens como quisermos para a guerra."
 peru.19.a:0 "Ótimo!"

 peru.20.t:0 "[FROM.GetName] concorda em enviar 3 voluntários"
 peru.20.d:0 "[FROM.GetName] concordou com nosso pedido de voluntários e enviou 6 para nos ajudar em nossos esforços de guerra. Esses voluntários foram transferidos diretamente para nosso comando e podemos usar esses homens como quisermos para a guerra."
 peru.20.a:0 "Incrível!"

 peru.21.t:0 "[FROM.GetName] se recusou a nos enviar voluntários"
 peru.21.d:0 "[FROM.GetName] respondeu aos nossos delegados, dizendo que eles se recusam a nos enviar voluntários e que devemos procurar ajuda em outro lugar."
 peru.21.a:0 "Tudo isso por nada"

 news.342.t:0 "A Segunda Guerra da Confederação"
 news.342.d:0 "Poucos dias após a reforma da Confederação Peru-Boliviana, vários países da América do Sul, incluindo Argentina, Chile, Equador e Colômbia, declararam guerra à confederação. A guerra no país foi tão rápida que eles acreditam que isso perturbaria o equilíbrio de poder na região, muito no mesmo estilo da Guerra da Confederação original. \n\nNa situação atual, parece altamente improvável que a Confederação vencerá este conflito e permanecerá independente. \n\nSó o tempo dirá o que acontecerá neste grande conflito, no entanto, é justo supor que resultará muito sangrento."
 news.342.a:0 "QUANTAS CONFEDERAÇÕES EXISTEM??"
 news.342.b:0 "Podemos ter perdido na primeira vez, MAS NÃO PERDEMOS NA SEGUNDA!"
 news.342.c:0 "Nós os derrotamos uma vez, PODEMOS DERROTÁ-LOS UMA SEGUNDA VEZ!"

 news.343.t:0 "A Segunda Guerra do Pacífico"
 news.343.d:0 "Após escaladas militares e tensões crescentes entre Chile e Peru, o limite foi quebrado hoje depois que as forças peruanas cruzaram a fronteira chilena e uma declaração oficial de guerra foi declarada apenas 2 horas depois. Considerando o clima social do Sul América, parece altamente improvável que Peru e Chile sejam os únicos combatentes neste conflito, já que Colômbia e Equador parecem estar armando suas forças também. e pela aparência das coisas, parece que eles não estarão errados. \n\nTudo o que resta a fazer é simplesmente deixar o tempo passar e ver como o conflito vai acabar. Uma coisa é certa, e um dos dois lados vai ganhar muito poder com isso."
 news.343.a:0 "O que deu em você, América do Sul?"
 news.343.b:0 "É hora de recuperarmos nossas terras perdidas!"
 news.343.c:0 "Esses guerreiros vão perder como da primeira vez! VIVA CHILE!"
 news.343.d:0 "Precisamos ajudar nossos irmãos chilenos! Esses belicistas precisam ser detidos!"

 news.344.t:0 "Equador e Bolívia entraram na Segunda Guerra do Pacífico"
 news.344.d:0 "As notícias se espalharam rapidamente sobre as forças colombianas e equatorianas cruzando a fronteira peruana e se juntando oficialmente ao Chile do seu lado da guerra. \n\nO mundo fica em choque ao ver o que antes era considerado um continente relativamente calmo fora de controle. \n\nPor enquanto, só temos que esperar e ver como tudo isso se desenrola."
 news.344.a:0 "O que diabos está acontecendo?!"
 news.344.b:0 "O QUE?? Esses bastardos vão pagar com seu sangue!"
 news.344.c:0 "Estamos juntos e juntos venceremos!"
 
 news.345.t:0 "O Renascimento de [FROM.GetNameDEF]"
 news.345.d:0 "Depois de ficar adormecido por quase um século, [FROM.GetNameDEF] foi reformado e parece poderoso como sempre. Vários países da América do Sul já estão expressando seu descontentamento com esta reforma repentina de uma união outrora morta, e muitos mais estão aterrorizados com o poder que ele tem. \n\nAs pessoas ainda não sabem o que acontecerá com a reforma de [FROM.GetNameDEF], e tudo o que podemos fazer é esperar que não se torne sangrento."
 news.345.a:0 "Outra Confederação?!"
 news.345.b:0 "Nosso caminho para a glória foi aberto, agora o mundo verá nosso poder!"
 news.345.c:0 "Isso pode ser muito ruim, eles parecem muito poderosos"

 peru.22.t:0 "Peru está disposto a comprar Arica"
 peru.22.d:0 "Diplomatas peruanos chegaram hoje a Santiago oferecendo grandes somas em dinheiro e um setor de sua economia civil em troca de nosso território de Arica. \n\nArica está sob nosso controle desde nossa vitória na Guerra do Pacífico. Durante todo esse tempo, o Peru reivindicou esta terra como seu território central. \n\nAgora que as tensões estão calmas, eles darão uma grande quantia em dinheiro em troca de Arica. \n\nDevemos aceitar a oferta deles?"
 peru.22.a:0 "Claro, deixe-os comer"
 peru.22.b:0 "Nós não vamos desistir de nossas terras tão facilmente!"

 peru.23.t:0 "Peru está oferecendo uma garantia e convite para sua facção em troca de Arica"
 peru.23.d:0 "Diplomatas peruanos chegaram hoje a Santiago para uma proposta bastante interessante. Eles nos oferecerão proteção militar e um convite à sua facção em troca do território de Arica. \n\nConsiderando que já estamos bastante forte militarmente e realmente não precisa de proteção estrangeira, muito menos de uma nação sul-americana, é sensato aceitar esse acordo?"
 peru.23.a:0 "Se isso significa estar unido como continente, qualquer sacrifício territorial está bem"
 peru.23.b:0 "Absolutamente não"

 peru.24.t:0 "Nosso golpe foi bem sucedido, então agora o que devemos fazer com o Oscar?"
 peru.24.d:0 "Depois de nosso golpe bem sucedido e agora estando no poder absoluto sobre a nação, uma pergunta permanece: o que devemos fazer com Oscar Benavides? \n\nAlguns estão dizendo para enforcá-lo publicamente e demonstrar a seus apoiadores que nós estão no comando. Outros estão sugerindo que devemos apenas forçá-lo a se aposentar, e alguns estão dizendo para simplesmente deixá-lo ficar como general do exército. \n\nCom todas essas opções à nossa disposição, o que devemos fazer?"
 peru.24.a:0 "Enforque-o publicamente"
 peru.24.b:0 "Forçá-lo a se aposentar"
 peru.24.c:0 "Deixe-o ficar no exército"
 
 peru.25.t:0 "[FROM.GetName] está nos pedindo permissão para comprar um de nossos navios"
 peru.25.d:0 "Diplomatas de [FROM.GetName] vieram à nossa nação para nos pedir permissão para comprar um de nossos navios. Eles estão dispostos a pagar uma quantia bastante grande por nossos navios e nos prometem que vão pagar cada centavo que cobramos deles por qualquer um de nossos navios. \n\nDevemos aceitar o oficial deles?"
 peru.25.a:0 "Aceitar"
 peru.25.b:0 "Recusar"

 peru.26.t:0 "[FROM.GetName] nos deu permissão para comprar um de seus navios"
 peru.26.d:0 "[FROM.GetName] respondeu aos nossos diplomatas e nos deu luz verde para comprar um de seus navios."
 peru.26.a:0 "Agora nossa marinha realmente crescerá!"

 peru.27.t:0 "[FROM.GetName] não nos deu permissão para comprar um de seus navios"
 peru.27.d:0 "[FROM.GetName] responderam aos nossos diplomatas, dizendo que não permitirão a compra de seus navios e preferem mantê-los sob sua gestão."
 peru.27.a:0 "Boa sorte na próxima vez"

 peru.28.t:0 "Quem liderará nosso império?"
 peru.28.d:0 "Agora que garantimos nosso lugar no continente sul-americano, precisamos escolher um líder. Embora tendo nosso senhor Inti como nosso líder, na era moderna pode ser sábio ter um verdadeiro e sábio líder para liderar esse renascimento do nosso império, assim como o império original fez. \n\nPodemos dizer que ele seria o representante de Inti, derrubando inimigos em nome de Apu-punchau. Até agora, temos dois possíveis candidatos para liderar nosso \nO primeiro é Juan Velasco Alvarado, um gênio militar e com origem nativa ele se encaixaria perfeitamente para liderar nosso império. \nPor outro lado temos José Luis Bustamente, um economista habilidoso que também tem formação nativa. \n \nNós também poderíamos simplesmente não escolher um líder e deixar Apu-punchau nos levar à glória final! No final, o ser que deve nos liderar é... "
 peru.28.a:0 "Juan Velasco Alvarado"
 peru.28.b:0 "Jose Luis Bustamente y Rivero"
 peru.28.c:0 "Os humanos miseráveis ​​não saberão como nos conduzir à glória!"
 peru.28.e:0 "Pachacutec o Segundo"
 peru.28.f:0 "Mantenha Ricardo no Poder"
 
 peru.29.t:0 "As hostilidades entre o Exército e a Marinha se acalmaram"
 peru.29.d:0 "As hostilidades entre nosso exército e marinha, que nos prejudicam há algum tempo, finalmente se acalmaram. Muitos setores do exército e da marinha agora concordam ideologicamente e decidiram acabar com essa rivalidade infantil. \n \nAgora que nosso exército e marinha estão colaborando, podemos realmente começar a fomentar um estado peruano forte, que será temido e respeitado por nossos vizinhos."
 peru.29.a:0 "Finalmente, podemos relaxar"

 peru.30.t:0 "A Guerra Civil Começou"
 peru.30.d:0 "A Guerra Civil Peruana começou oficialmente. Nossa campanha para estabelecer um regime fascista atingiu seu pico, aqui ou vencemos e governamos a nação, ou morremos lutando. Não importa qual seja o resultado, nós precisamos ter certeza de que damos tudo de nós. Esses porcos capitalistas não durarão muito se dermos tudo o que temos, com certeza!"
 peru.30.a:0 "Soldados, a la Victoria!"

 peru.31.t:0 "Nosso golpe foi um sucesso!"
 peru.31.d:0 "Nós conquistamos pacificamente a nação, sem derramar uma única gota de sangue. Esta vitória será comemorada por décadas e uma nova era para o Peru está apenas começando. Mostraremos a todos que o fascismo pode realmente levar uma nação à grandeza, seremos o exemplo para todos esses porcos capitalistas e comunistas que nos cercam!"
 peru.31.a:0 "Conseguimos!"

 peru.32.t:0 "Quem nos conduzirá à vitória?"
 peru.32.d:0 "Como povo e militar do Peru, temos uma escolha muito importante a fazer. Precisamos decidir quem assumirá o papel de líder do regime fascista e levará nossa nação à glória. \n\n[ROOT.GetPeruSituation]"
 peru.32.a:0 "Eloy Ureta será o novo líder"
 peru.32.b:0 "Luis A. Flores deve continuar na liderança"

 PRU_civil_war_situation:0 "Por um lado, temos Luis A. Flores, um líder robusto que já provou seu valor em campo e com suas habilidades de liderança. \n\nPor outro lado temos Eloy Ureta, um líder inteligente que poderia use sua inteligência para ser mais esperto que o inimigo. \n\nA guerra civil está em pleno andamento, então precisamos fazer uma escolha rápida, o líder de nossa nação será..."
 PRU_peaceful_coup_situation:0 "Por um lado, temos Luis A. Flores, um líder talentoso que sabe liderar com mão de ferro. \n\nPor outro lado, temos Eloy Ureta, um líder capaz que pode melhorar sua inteligência grandemente nossa economia, militar e estabilidade geral do país. \n\nCom esta escolha em nossas mãos, o líder de nossa nação será..."

 peru.33.t:0 "[FROM.GetName] Quer comprar nossos Tanques"
 peru.33.d:0 "Delegados de [FROM.GetName] viajaram por todo o mundo para vir à nossa nação para nos perguntar se podem comprar alguns de nossos tanques. Eles viram nosso estoque e estão muito satisfeitos com nosso arsenal, e declararam que estão dispostos a pagar uma quantia decente por alguns de nossos tanques, especialmente nossos modelos leves. \n\nDevemos aceitar a oferta?"
 peru.33.a:0 "Deixe-os comprar Tanques Adequados"
 peru.33.b:0 "Deixe-os comprar tanques Ok-ish
 peru.33.c:0 "Não envie nada a eles!"

 peru.34.t:0 "A escolha entre Eudocio e Del Prado"
 peru.34.d:0 "Com nossos esforços em pleno andamento, precisamos escolher quem liderará nosso movimento. \n\nPodemos escolher entre Eudocio Ravines e Jorge del Prado Chavez, ambos indivíduos reconhecidos e respeitados com suas próprias ambições e objetivos. \n\nQuem escolheremos?"

 peru.35.t:0 "Governo peruano inicia esforços de repressão contra nós"
 peru.35.d:0 "Alguns de nossos camaradas leais infiltrados no governo nos informaram que [ROOT.GetLeader] ordenou que o exército iniciasse buscas em grande escala em todo o país para rastrear e caçar qualquer um de nossos apoiadores. \n\nIsso não será fácil, mas precisamos fazer tudo o que pudermos para deter a [ROOT.GetLeader] e garantir que as pessoas tenham a liberdade que merecem!"
 peru.35.a:0 "Malditos bastardos"

 peru.36.t:0 "O governo perseguiu alguns de nossos apoiadores"
 peru.36.d:0 "Fomos informados de que o governo capturou e prendeu alguns de nossos apoiadores, prejudicando nosso apoio e nossa causa em todo o país."
 peru.36.a:0 "Eles pagarão por isso!"

 peru.37.t:0 "Nós assumimos o controle com sucesso!"
 peru.37.d:0 "Depois de meses de preparativos e de reforçar o apoio nacional, as pessoas decidiram que já estavam fartas e, em combinação com seu apoio e nossa liderança, assumimos o controle do país. O ex-gabinete e os membros foram forçados a deixar o cargo e, a partir de agora, podemos governar o Peru e levá-lo a um caminho de grandeza!"
 peru.37.a:0 "Fantástico!"

 peru.38.t:0 "O governo reprime o nosso governo"
 peru.38.d:0 "Embora tenhamos feito o possível para subverter a atenção do governo e obter o apoio de todos os peruanos, isso simplesmente não foi suficiente. O governo descobriu nossos esquemas e está encarcerando em massa cada um de nossos apoiadores. \n\nPrecisamos fazer algo, e rápido!"
 peru.38.a:0 "Todos às armas! Lutem por sua liberdade!"

 peru.39.t:0 "[PRU.GetName] Invadiu [CHL.GetName], agora é a nossa chance!"
 peru.39.d:0 "Recebemos a notícia de que [PRU.GetAdjective] cruzou a fronteira de [CHL.GetAdjective]. Essa seria a nossa oportunidade de ouro para intervir e recuperar o que é nosso por direito!"
 peru.39.a:0 "Vamos fazer isso!"
 peru.39.b:0 "Não podemos nos arriscar"

 peru.40.t:0 "A escolha entre Haya e Eguiguren"
 peru.40.d:0 "Devemos escolher entre ter Haya de la Torre como líder ou Luis Antonio Eguiguren Escudero como líder do Partido Social Democrata. \n\nQuem nos conduzirá à grandeza?"

 peru.254.t:0 "Os fascistas estão furiosos com o cancelamento da eleição!"
 peru.254.d:0 "Os fascistas deixaram seu descontentamento com o cancelamento das eleições muito claro, quase um pouco claro demais. \n\nPessoas infiltradas em suas fileiras nos informaram que estão planejando uma guerra civil completa em uma tentativa de derrubar nosso governo! \n\nPrecisamos ter certeza de que isso não aconteça, aconteça o que acontecer!"
 peru.254.a:0 "Eles vão pagar por isso!"

 news.346.t:0 "A Guerra [GetYear] Peru-Equador"
 news.346.d:0 "Após crescentes tensões e conflitos fronteiriços entre os dois países, a guerra estourou entre as duas nações em uma luta por quem deve controlar Pastaza. \n\nEnquanto muitos pensam que o Peru será o vencedor devido para sua supremacia industrial e militar, há a pequena minoria que acredita que o Equador pode sair desta guerra como o vencedor. \n\nPor enquanto, só o tempo dirá quem será o verdadeiro vencedor deste conflito."
 news.346.a:0 "Muito interessante mesmo"
 news.346.b:0 "Devemos estudar este conflito"
 news.346.c:0 "Esses equatorianos vão cair!"
 news.346.e:0 "Nós não vamos permitir que esses belicistas saiam ilesos disso!"
 
 news.347.t:0 "A Segunda Guerra do Chaco"
 news.347.d:0 "Depois de apenas alguns anos da primeira Guerra do Chaco, os bolivianos simplesmente não suportavam que os paraguaios possuíssem o território do Chaco, um território que os bolivianos reivindicam como seu. Após vários conflitos fronteiriços, os bolivianos lançaram uma ofensiva militar total contra os paraguaios e iniciou oficialmente a Segunda Guerra do Chaco. \n\nO mundo observará com muito cuidado os eventos que ocorrerem nesta guerra, pois qualquer vencedor desta guerra pode resultar em uma posição bastante dominante na América Central do Sul".
 news.347.a:0 "Muito interessante mesmo"
 news.347.b:0 "Precisamos tomar cuidado com esses dois"
 news.347.c:0 "O CHACO SERÁ NOSSO MAIS UMA VEZ!"
 news.347.e:0 "Desta vez os bolivianos vão cair de verdade!"

 news.348.t:0 "Queda de Buenos Aires"
 news.348.d:0 "Especialistas militares estão em choque quando relatórios de Buenos Aires confirmam que a capital caiu para o avanço das tropas uruguaias. \n\nEnquanto algumas áreas ainda estão em combate, a maioria das unidades do exército argentino recuou para o zona rural ao redor da cidade. \n\nAs tropas uruguaias começaram um desfile da vitória pela Avenida 9 de Julio, com [URG.GetLeader] tendo voado para participar também. \n\nRumores dizem que o governo argentino conseguiu escapar por a Ruta 7 em direção aos Andes, no entanto, os especialistas consideram que este é um golpe devastador para a Argentina."
 news.348.a:0 "O que diabos está acontecendo lá?"
 news.348.b:0 "Quem é a província agora?"
 news.348.c:0 "Eles vão pagar! Com o sangue deles eles vão pagar!"

 news.750.t:0 "A Queda de Buenos Aires"
 news.750.d:0 "Considerada a Paris da América do Sul, Buenos Aires é uma cidade muito poderosa na América do Sul, por isso é ainda mais chocante perceber que a cidade agora caiu nas mãos de um forasteiro. \n\nA As consequências de uma cidade tão poderosa não estar mais nas mãos da Argentina ainda são desconhecidas, mas o que se sabe são as mudanças drásticas que ocorrerão na região, tanto econômica quanto politicamente. a queda de Buenos Aires só prova a gravidade do problema. \n\nCom o fim do centro econômico, as chances de a Argentina vencer a guerra parecem pequenas."
 news.750.a:0 "A Argentina tem chance?"
 news.750.b:0 "Mais uma vitória para nós!"

 news.351.t:0 "A Queda de São Paulo"
 news.351.d:0 "Uma das cidades mais importantes do Brasil acaba de ser tomada. Para muitos ainda parece inacreditável como uma cidade tão importante do gigante sul-americano foi ocupada, e ainda assim relatos da cidade e do invasor comprovam sem dúvida. O Brasil ainda pode cair de volta para o Rio de Janeiro, no entanto, os invasores já estão às portas dessa cidade também. \n\nAs chances do exército brasileiro conter os invasores parecem próximas de zero. Dias sombrios são vindo para a nação do Brasil."
 news.351.a:0 "O Brasil não dura"
 news.351.b:0 "A seguir, Rio de Janeiro"

 news.352.t:0 "A Queda do Rio de Janeiro"
 news.352.d:0 "O Rio de Janeiro, um local popular entre turistas, investidores e pessoas em geral, além de ser uma bela cidade não é mais o que era. Agora está cheio de derramamento de sangue e caos como invasores estrangeiros expulsar os brasileiros de sua própria cidade. \n\nAs circunstâncias atuais parecem inacreditáveis, mas os relatórios locais confirmam isso. O Rio de Janeiro caiu e o atual esforço de guerra brasileiro não parece suficiente para deter os invasores. \n\nÉ vai ser preciso um milagre para os brasileiros voltarem, mas todos sabemos que a vida nem sempre traz milagres."
 news.352.a:0 "O que aconteceu com a América do Sul?"
 news.352.b:0 "O fim da guerra está próximo!"

 news.353.t:0 "A Queda de Montevidéu"
 news.353.d:0 "Acabam de chegar notícias de que a capital do Uruguai, Montevidéu, caiu nas mãos de forças externas. A contagem de mortos está chegando aos milhares enquanto os civis tentam escapar da cidade com medo de serem pegos em um fogo cruzado .\n\nAgora, sem o seu capital, será necessário um grande sacrifício e capacidade para acompanhar a guerra, no entanto, parece altamente improvável que o Uruguai permaneça à tona neste conflito."
 news.353.a:0 "Eles fizeram um esforço valente"
 news.353.b:0 "Sua resistência foi inútil!"

 news.354.t:0 "A Queda de Santiago"
 news.354.d:0 "A outrora movimentada capital do Chile foi reduzida a escombros e caos quando as marés da guerra inundaram a cidade hoje. Os invasores capturaram oficialmente a capital do Chile, Santiago, e a cidade não está mais sob controle chileno . \n\nConsiderando o terreno perigoso ao redor da cidade, é realmente impressionante como os invasores conseguiram realizar tal façanha. Especialistas militares de todo o mundo estão tentando entender o que aconteceu com a defesa chilena e como eles foram não é capaz de defender uma cidade tão defensável. \n\nDe qualquer forma, os chilenos estão em suas patas traseiras, e será preciso um milagre para se recuperar e sair por cima na guerra."
 news.354.a:0 "O coração do aço sul-americano... se foi"
 news.354.b:0 "Eles deveriam se render a qualquer momento!"

 news.355.t:0 "A Queda de La Paz"
 news.355.d:0 "A capital da Bolívia, assim como a cidade mais importante do país, foi vítima da ira da guerra e agora não está mais sob o controle dos bolivianos. A situação é muito sombria na nação neste momento, pois inúmeras pessoas estão morrendo e muitas tentando escapar dos horrores da guerra. \n\nUma visão muito triste de se ver, especialmente quando se considera a história infeliz da Bolívia quando se trata de guerras. Tudo o que o mundo pode fazer é olhar de longe longe e estudar o conflito, dando orações para aqueles que perderam suas vidas."
 news.355.a:0 "Isso é muito lamentável"
 news.355.b:0 "Eles nunca tiveram chance!"

 news.356.t:0 "A Queda de Assunção"
 news.356.d:0 "A capital do Paraguai, Assunção, tornou-se vítima dos invasores. Relatos confirmam que a cidade não está mais sob a posse do governo paraguaio. \n\nOs paraguaios fizeram um valente esforço contra os invasores, mas no final os invasores saíram vitoriosos e pisotearam as defesas paraguaias na cidade. As táticas de defesa podem ser estudadas a partir desta guerra para entender melhor o como e o porquê da queda desta cidade. \n\nChoraremos aqueles que são não está mais conosco devido a este conflito."
 news.356.a:0 "Asun-o quê?"
 news.356.b:0 "Nosso exército não pode ser detido!"

 news.357.t:0 "A Queda de Lima"
 news.357.d:0 "Considerando a posição estratégica da capital do Peru, Lima, seria considerado quase impossível conquistá-la, a logística, os soldados necessários, o moral. Muitos fatores precisariam estar em jogo para isso para ter sucesso, e ainda assim os invasores fizeram exatamente isso e tomaram a capital do país. \n\nEnquanto sua cidade mais importante se foi, os peruanos ainda estão tentando ao máximo apresentar uma defesa sólida contra os invasores, e devemos respeitar sua esforço, mesmo que esse esforço eventualmente não leve a nada. \n\nAs táticas empregadas pelos invasores podem ser estudadas para aprimorar ainda mais nossas próprias técnicas."
 news.357.a:0 "Outra capital sul-americana se foi?"
 news.357.b:0 "Finalmente, a vitória finalmente"

 news.358.t:0 "A Queda de Bogotá"
 news.358.d:0 "A capital da Colômbia, Bogotá, acaba de confirmar que não está mais sob controle colombiano. Uma cidade tão grande tomada por uma força externa ainda parece inacreditável, mas a cobertura de notícias locais provou ser inacreditável. \n\nMuitas famílias perderam suas casas, mais ainda perderam membros e, em geral, toda a nação colombiana está lutando para se manter à medida que os invasores avançam cada vez mais em suas terras. Ainda não se sabe se vão ou não recuperá-la para debate, mas sem a capital, parece muito improvável. \n\nMais uma vez, isso deve ser aproveitado como uma oportunidade para estudar táticas militares, mas precisamos ter compaixão por aqueles que perderam suas vidas."
 news.358.a:0 "Interessante"
 news.358.b:0 "Acabou, esta guerra acabou"

 news.359.t:0 "A Queda de Caracas"
 news.359.d:0 "A capital do paraíso petrolífero da América do Sul, a Venezuela, foi recentemente capturada. Os invasores sabiam da importância estratégica da cidade e fizeram questão de usar o poderio militar para tomá-la. \n\nMilhares estão mortos, e mais podem vir se esta guerra não acabar. Os invasores não estão mostrando piedade enquanto seus soldados e tanques marcham pela outrora movimentada capital da Venezuela. \n\nSó podemos esperar e ver como esse conflito será resolvido. "
 news.359.a:0 "Verdadeiramente uma vergonha"
 news.359.b:0 "Finalmente, todo esse óleo será nosso!"
 
 bolivia.1.t:0 "Os militares lançaram o golpe"
 bolivia.1.d:0 "Após meses de gestão governamental ineficiente e instabilidade política, os militares estão fartos e, após meses de planejamento, lançaram o golpe esta manhã. \n\nA situação parece muito delicada, e muitos estão prevendo isso só vai piorar o que já era uma nação muito frágil. Os bolivianos estão sendo forçados a escolher um lado e uma divisão política está ocorrendo enquanto falamos, e muitos observadores do mundo exterior estão observando nossa nação com muito cuidado. \n\nTanto faz vai sair desse golpe, só temos que torcer para que seja para o melhor do país."
 bolivia.1.a:0 "Para o futuro da Bolívia!"

 bolivia.2.t:0 "O que devemos fazer com alemão e Toro"
 bolivia.2.d:0 "Depois de nossa vitória final contra os generais e sua revolta, só temos mais um assunto para tocar: o que devemos fazer com eles? \n\nAs pessoas estão exigindo que nós os enforcemos publicamente e mostremos suas defensores de que a democracia prevalece em meio ao sangue e ao caos. \nOutros estão dizendo que devemos simplesmente forçá-los a se aposentar, e uma porcentagem muito pequena da população está dizendo para mantê-los e retreiná-los. \n\nO que devemos fazer? "
 bolivia.2.a:0 "Enforque-os publicamente! Faça-os pagar por seus crimes!"
 bolivia.2.b:0 "Forçar sua aposentadoria"
 bolivia.2.c:0 "Deixe-os ficar"

 bolivia.3.t:0 "Toro começou com seus esquemas desonestos!"
 bolivia.3.d:0 "Alguns de nossos leais apoiadores nos notificaram que Toro acumulou uma grande parte de seus apoiadores e parte das forças armadas e assumiu o controle de um de nossos estados! \n\nNão podemos permitir que ele continue com esses esquemas e devemos detê-lo antes que fique fora de controle!"
 bolivia.3.a:0 "Você vai pagar Toro!"

 bolivia.4.t:0 "Bolívia está disposta a comprar Chaco"
 bolivia.4.d:0 "Diplomatas bolivianos chegaram hoje para discutir se podem ou não comprar a região do Chaco Boreal de nós. Eles estão dispostos a pagar uma boa quantia de dinheiro pela terra e benefícios econômicos para nós por quase meio ano em troca pela terra. \n\nDevemos deixar de lado nossas guerras e conflitos e aceitar esta oferta?"
 bolivia.4.a:0 "Sim"
 bolivia.4.b:0 "Não, não estamos dando nada a eles"

 bolivia.5.t:0 "A Bolívia está disposta a nos dar direitos de recursos em troca de Tarapacá"
 bolivia.5.d:0 "Diplomatas bolivianos chegaram hoje ao nosso país para discutir se estaremos ou não dispostos a aceitar a transferência de Tarapacá em troca de direitos de recursos em Beni. Beni é bastante rico em recursos, especialmente tungstênio e aço , então, mesmo se permitirmos que eles tenham Tarapacá, ainda receberemos mais em troca. \n\nDevemos aceitar a oferta?"
 bolivia.5.a:0 "Claro"
 bolivia.5.b:0 "Absolutamente não"

 bolivia.6.t:0 "Bolívia está disposta a comprar Acre, Pauini, Cáceres e Corumbá"
 bolivia.6.d:0 "Diplomatas bolivianos chegaram para discutir a compra desses territórios. Eles estão dispostos a pagar uma quantia bastante grande pelos territórios. Como esses territórios não são as partes mais desenvolvidas de nosso país, nós não estaria perdendo muito. \n\nDevemos aceitar a oferta?"
 bolivia.6.a:0 "Sim, por que não"
 bolivia.6.b:0 "Não"

 bolivia.7.t:0 "Bolívia gostaria de chegar a um acordo de paz de uma vez por todas"
 bolivia.7.d:0 "Diplomatas bolivianos chegaram hoje para discutir o tema que está na cabeça dos paraguaios e bolivianos: a guerra do Chaco e seus efeitos. \n\nBolívia afirma que está disposta a recuar em suas reivindicações no território e nos retirar totalmente dele em troca de permitirmos acesso militar a eles. \n\nDevemos aceitar o acordo e finalmente encerrar nossas hostilidades?"
 bolivia.7.a:0 "Sim, é melhor ter um aliado do que um inimigo"
 bolivia.7.b:0 "Não, eles ainda têm que pagar por sua perda"

 bolivia.8.t:0 "Germán faleceu"
 bolivia.8.d:0 "As notícias chegaram a todas as partes do país que Germán faleceu hoje. \n\nMuitos especulam que ele cometeu suicídio, no entanto, há uma pequena minoria que acredita que ele poderia ter sido morto. \n\nAgora não é hora de especular sobre quem ou o que o matou, agora é hora de lamentar a morte de nosso presidente e torcer pelo melhor. Para o futuro da Bolívia!"
 bolivia.8.a:0 "Que descanse em paz"

 bolivia.9.t:0 "A Bolívia está tentando tomar Antofagasta"
 bolivia.9.d:0 "Alguns de nossos espiões notaram um comportamento estranho na fronteira boliviana, parece que estão planejando algum tipo de plano para tomar nossa província de Antofagasta. usando força direta, mas sim manobras subversivas para tomar o estado sem guerra. \n\nNão permitiremos que esses vis bolivianos tomem um centímetro de nossas terras!"
 bolivia.9.a:0 "Vamos garantir que isso não aconteça!"

 bolivia.10.t:0 "A Bolívia ocupou [995.GetName], o que devemos fazer?"
 bolivia.10.d:0 "As forças bolivianas entraram em [995.GetName] e a ocuparam à força. Esse ato hediondo não foi apenas permitido, mas até mesmo aplaudido pelos habitantes locais devido aos esquemas desonestos que os bolivianos fizeram em [995.GetName]. \n\nO que devemos fazer?"
 bolivia.10.a:0 "Eles não estão conseguindo se safar!"
 bolivia.10.b:0 "Eles que fiquem com isso..."
 
 perubolivia.1.t:0 "Quem deve liderar a Confederação?"
 perubolivia.1.d:0 "Com o renascimento da Confederação quase 100 anos depois, precisamos de um líder forte e poderoso para liderar a nação, e precisamos fazer essa escolha rapidamente. \n\nTemos 4 opções viáveis ​​disponíveis: David Toro, Germán Busch, Luis A. Flores e Manuel Prado Ugarteche. Dois são do Peru e dois são da Bolívia, e cada um tem suas próprias características únicas. \n\nNosso líder será..."
 perubolivia.1.a:0 "David Toro"
 perubolivia.1.b:0 "Germán Busch"
 perubolivia.1.c:0 "Luis A. Flores"
 perubolivia.1.e:0 "Manuel Prado Ugarteche"

 perubolivia.2.t:0 "Qual cidade deve ser nossa capital?"
 perubolivia.2.d:0 "Agora que somos uma entidade política no mapa, precisamos encontrar uma cidade para definir como nossa capital. Até agora temos 3 opções: Tacna, Lima e La Paz. Cada uma delas cidades tem não apenas significado histórico para a Confederação, mas também significado político. \n\nDestas 3 cidades, a capital da Confederação Peru-Boliviana será..."
 perubolivia.2.a:0 "Tacna"
 perubolivia.2.b:0 "Lima"
 perubolivia.2.c:0 "La Paz"

 perubolivia.3.t:0 "Os nacionalistas estão se levantando em toda a nação!"
 perubolivia.3.d:0 "Nacionalistas peruanos e bolivianos estão se levantando em todas as partes de nossa nova nação. A força desses nacionalistas é muito forte, e já estão formando milícias localizadas para tomar e controlar as províncias da Confederação.\n\nTodos o que sabemos agora é que isso representa uma séria ameaça à nossa nação e precisamos assumir o controle da situação o mais rápido possível!"
 perubolivia.3.a:0 "Será que algum dia estaremos em paz?"

 perubolivia.4.t:0 "Devemos dissolver a União?"
 perubolivia.4.d:0 "Nossa situação atual parece muito sombria. Estamos em guerra com os nacionalistas peruanos e bolivianos ao mesmo tempo, e o estado atual de nossa união parece muito frágil. \n\nDevido a essa situação extrema , muitos propuseram simplesmente ceder às nações e dissolver a união de uma vez por todas. \n\nConsiderando nossa situação atual, devemos dissolver a união e nos tornar nações separadas mais uma vez?"
 perubolivia.4.a:0 "Sim, não devemos causar mais sangue derramado"
 perubolivia.4.b:0 "Não, nós lutamos demais para simplesmente desistir!"

 perubolivia.5.t:0 "A Confederação Peru-Boliviana está nos convidando para seu pacto de defesa"
 perubolivia.5.d:0 "Diplomatas da Confederação chegaram recentemente à nossa nação, perguntando-nos se queremos fazer parte de seu pacto de defesa contra qualquer ameaça externa. \n\nEles afirmam que querem compensar a perda de vida durante a Guerra da Independência. Os diplomatas disseram aos nossos que a Confederação intervirá em qualquer guerra defensiva em que nos encontremos. \n\nDevemos aceitar a oferta?
 perubolivia.5.a:0 "Sim, precisamos da proteção deles"
 perubolivia.5.b:0 "Nós não vamos simplesmente deixar para trás todas as suas atrocidades!"

 perubolivia.6.t:0 "[FROM.GetName] declarou guerra a um país dentro do Pacto de Defesa!"
 perubolivia.6.d:0 "[FROM.GetName] está atualmente lutando contra um dos países que convidamos para o pacto de defesa, e eles não estão se segurando nem um pouco. \n\nDe acordo com nossa promessa, estamos tecnicamente obrigado a participar e ajudar nosso aliado contra [FROM.GetName]. \n\nDevemos nos unir e protegê-los?"
 perubolivia.6.a:0 "Vamos esmagar esses belicistas!"
 perubolivia.6.b:0 "Nós simplesmente não podemos pagar a guerra agora"

 perubolivia.7.t:0 "A Confederação Peru-Boliviana quer o Putumayo como garantias"
 perubolivia.7.d:0 "Diplomatas da Confederação vieram hoje a Bogotá para discutir um intercâmbio potencial entre nossas nações. A Confederação estaria disposta a oferecer seu exército como apoio em qualquer conflito defensivo em que nos encontremos em troca do estado de Putumayo. \n\nOs diplomatas nos disseram que consideram esse nosso estado como parte integrante de sua nação e estarão dispostos a oferecer seu apoio total em caso de conflito em troca dele. Eles também afirmam que eles querem compensar a perda de vidas durante a Guerra da Independência. \n\nDevemos aceitar a oferta?"
 perubolivia.7.a:0 "Sim"
 perubolivia.7.b:0 "Não"

 perubolivia.8.t:0 "A Confederação Peru-Boliviana quer o Chaco como garantias"
 perubolivia.8.d:0 "Diplomatas da Confederação vieram hoje a Assunção para discutir um possível intercâmbio entre nossas nações. A Confederação estaria disposta a oferecer seu exército como apoio em qualquer conflito defensivo em que nos encontremos em troca do estado do Chaco Boreal. \n\nOs diplomatas nos disseram que consideram esse nosso estado como parte integrante de sua nação e estarão dispostos a oferecer seu apoio total em caso de conflito em troca dele. Eles também afirmam que querem compensar a perda de vidas durante a Guerra da Independência. \n\nDevemos aceitar a oferta?"

 perubolivia.9.t:0 "A Confederação Peru-Boliviana está disposta a comprar nossas terras"
 perubolivia.9.d:0 "Diplomatas da Confederação vieram à nossa nação para oferecer uma proposta: não apenas o pagamento de 1 fábrica civil, mas também a intervenção em qualquer uma de nossas guerras defensivas. \n\nOs diplomatas nos disseram que possuímos terras que eles valorizam muito, e eles estão dispostos não apenas a pagar, mas também nos oferecer proteção em troca deles. \n\nNão há como negar o poder que a Confederação detém, então devemos aceitar esta oferta?"

 ### Eventos da Colômbia ###

 colombia.1.title:0 "Um líder do exército se gradua como especialista no deserto "
 colombia.1.desc:0 "Após um longo período de estudo e treinamento em campo, um de nossos comandantes do exército finalmente se formou como especialista em combate no deserto. Sem dúvida, esta é uma grande conquista não só para ele, mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.2.title:0 "Um líder do exército se gradua como especialista em pântanos"
 colombia.2.desc:0 "Após um longo período de estudo e treinamento no campo, um de nossos comandantes do exército finalmente se formou como especialista em combate de pântanos. Sem dúvida, esta é uma grande conquista não só para ele, mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.3.title:0 "Um líder do exército se gradua como especialista em montanhas"
 colombia.3.desc:0 "Depois de um longo período de estudo e treinamento no campo, um de nossos comandantes do exército finalmente se formou como especialista em combate nas montanhas. Sem dúvida, esta é uma grande conquista não só para ele , mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.4.title:0 "Um líder do exército se gradua como especialista em colinas"
 colombia.4.desc:0 "Após um longo período de estudo e treinamento do terreno, um de nossos comandantes do exército finalmente se formou como especialista em combate de colinas. Sem dúvida, esta é uma grande conquista não só para ele, mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.5.title:0 "Um líder do exército se gradua como especialista em selvas"
 colombia.5.desc:0 "Após um longo período de estudo e treinamento em campo, um de nossos comandantes do exército finalmente se formou como especialista em combate na selva. Sem dúvida, esta é uma grande conquista não só para ele , mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.6.title:0 "Um líder do exército se forma especialista em florestas"
 colombia.6.desc:0 "Após um longo período de estudo e treinamento em campo, um de nossos comandantes do exército finalmente se formou como especialista em combate em florestas. Sem dúvida, esta é uma grande conquista não só para ele, mas também para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.7.title:0 "Um líder do exército se gradua como especialista em áreas urbanas"
 colombia.7.desc:0 "Após um longo período de estudo e treinamento no campo, um de nossos comandantes do exército finalmente se formou como especialista em combate em áreas urbanas. Sem dúvida, esta é uma grande conquista não só para ele , mas para todo o sistema de treinamento militar. \n\nSua nova característica certamente será de grande ajuda para você em futuras batalhas pela pátria."
 colombia.1.a:0 "Um exemplo de excelência."
 
 colombia.9.title:0 "A Tragédia de Fúquene"
 colombia.9.desc:0 "Hoje ocorreu uma terrível tragédia na lagoa Fúquene, localizada a 120 quilômetros ao norte de Bogotá. Um barco com sobrecarga de passageiros afundou nas águas geladas da lagoa e muito distante da costa. 27 pessoas no barco, 21 afogadas. Entre as vítimas estão ilustres oficiais do exército e várias figuras proeminentes da nossa sociedade. Esta catástrofe comoveu profundamente toda a nação e cobriu de luto famílias muito respeitáveis ​​da capital."
 colombia.9.a:0 "Um evento doloroso."
 colombia.10.title:0 "Evitou-se uma tragédia em Fúquene"
 colombia.10.desc:0 "Hoje teria ficado para a história como um dia trágico em Cundinamarca. Na lagoa de Fúquene, uma lancha com sobrecarga de passageiros estava prestes a embarcar nas águas geladas da lagoa. No entanto, os passageiros levaram mais do que o previsto para embarcar no barco, a viagem atrasou vários minutos. Algum tempo depois, uma nevasca repentina, acompanhada de uma chuva torrencial, impediu-os de zarpar. Eventualmente, verificou-se que o motor do barco apresentava falhas, então, muito possivelmente, se tivessem zarpado na hora marcada, estariam à deriva e a chuva teria afundado o barco."
 colombia.10.a:0 "Um aviso do destino..."
 colombia.11.title:0 "Missão militar de Rojas Pinilla"
 colombia.11.desc:0 "O alto comando militar propôs enviar um delegado em nome do país a uma potência estrangeira ou a um centro de estudos focado para trazer consigo informações fundamentais para o desenvolvimento das forças armadas. Muitos candidatos, finalmente a direção escolheu o tenente Gustavo Rojas Pinilla para realizar esta tarefa. A única coisa que precisa ser esclarecida é para onde ele será enviado."
 colombia.11.a:0 "Mande-o para os Estados Unidos."
 colombia.11.b:0 "Mande-o para a Alemanha."
 colombia.11.c:0 "Mande-o para o centro de estudos militares."

 #colombia.12
 lideres.protegidos.title:0 "Caudilhos liberais são protegidos pelo governo"
 lideres.protegidos.desc:0 "Depois de muitos anos de perseguição política, os líderes liberais do leste do país finalmente receberam o apoio e proteção do governo para realizar sua ação sem vandalismo. A população liberal apreciou este gesto, que tem contribuído para a estabilidade da região."
 lideres.protegidos.a:0 "Um triunfo para o povo."
 #colombia.13
 bog.oponen.title:0 "Comerciantes liberais se opõem a negociar com conservadores "
 bog.oponen.desc:0 "Os principais empresários liberais, que dominam o mercado em Cundinamarca, não aceitaram colaborar economicamente com seus adversários conservadores. Eles argumentam que não têm garantias para negociar, e que o favoritismo aos conservadores por parte de outros empresários poderia custar-lhes seu emprego e seus ganhos."
 bog.oponen.a:0 "Eles são muito teimosos..."
 #colombia.14
 bog.aceptan.title:0 "Empresários liberais e conservadores negociam acordos comerciais"
 bog.aceptan.desc:0 "Depois de várias reuniões com os dirigentes das associações industriais e os dirigentes das empresas nacionais de Cundinamarca, o governo conseguiu organizar os dois grupos, liberais e conservadores, para acordar a sua colaboração mútua no mercado. Os industriais liberais aceitaram com certa relutância, embora vissem com bons olhos os lucros que poderiam ser obtidos com a sincronização de suas empresas, deixando de lado as diferenças políticas."
 bog.aceptab.a:0 "Uma vitória mútua!"
 #colombia.15
 int.acept.title:0 "Prefeitos liberais tomam posse em Magdalena"
 int.acept.desc:0 "Após uma longa campanha de reestruturação institucional e a intervenção direta do [ROOT.GetLeader], os prefeitos das principais cidades de Magdalena finalmente puderam tomar posse, o que estava sendo dificultado pelas diretrizes conservadoras de A delegação liberal alegrou-se com a notícia, anunciando que é uma vitória para o povo."
 int.acept.a:0 "Um triunfo para a democracia."
 #colombia.16
 int.oponen.title:0 "Conservadores rejeitam novos prefeitos em Magdalena "
 int.oponen.desc:0 "Apesar dos esforços presidenciais para conceder o cargo de prefeito ao eleito liberal, tem sido impossível realizar esta tarefa. Governadores departamentais conservadores argumentam que o país está sob estado de sítio desde 1899, razão pela qual eles têm garantia constitucional de “remover qualquer subordinado do cargo se considerarem apropriado”.
 int.oponen.a:0 "Eles estão empenhados em obstruir a vontade do povo."
 #colombia.17
 prensa.eliminada.title:0 "O governo elimina a imprensa subversiva "
 prensa.eliminada.desc:0 "A extensa operação preparada pelas autoridades deu frutos. A imprensa ultraconservadora foi finalmente localizada em Medellín, de onde foi distribuída a todo o departamento, incitando o ódio contra os liberais. Várias pessoas foram presas e o lugar da tipografia foi colocado sob custódia policial. A direção liberal de Antioquia elogiou o trabalho do governo e espera que com este fato a violência política diminua."
 press.removed.a:0 "Excelente."
 #colombia.18
 prensa.continua.title:0 "Jornais conservadores continuam circulando"
 prensa.continua.desc:0 "Os esforços policiais para identificar o local de origem da imprensa ultraconservadora não tiveram sucesso. Inicialmente, as investigações levaram à captura de vários suspeitos, todos membros do partido conservador, mas as provas documentais provaram ser insuficiente para sustentar acusações graves. O processo acabou arquivado e as autoridades não tiveram outra alternativa senão libertar os detidos."
 prensa.continua.a:0 "Não por muito tempo."
 #colombia.19
 conser.arrestados.title:0 "Conservadores extremistas são presos"
 conser.arrestados.desc:0 "Um ataque militar em Caquetá culminou hoje com mais de cem prisões. Uma organização conservadora extremista, que se dedicava a semear o caos e ameaçar adversários, foi dissolvida com a operação. Os principais líderes serão os primeiros para ser apresentado a um juiz, e terá que responder por vários crimes. O partido conservador, por outro lado, argumentou que essas pessoas não têm nenhum vínculo com o partido, mas que agiram por conta própria. questionado por vários grandes jornais, embora seja necessária uma investigação mais aprofundada para esclarecer esse fato”.
 conser.arrestados.a:0 "A justiça foi feita."
 #colombia.20
 conser.escapan.title:0 "Conservadores extremistas escapam da operação"
 conser.escapan.desc:0 "Embora tenha sido planejada uma batida em Caquetá contra extremistas da região, a situação apresentou complicações desde o primeiro momento, até culminar no fracasso total. Talvez os líderes seniores das sociedades extremistas tenham descoberto o plano, então saíram rapidamente do local onde deveriam estar hoje. Nenhuma declaração pública foi feita sobre o que aconteceu, e também não são esperadas, pois é óbvio que representa uma vergonha para as instituições nacionais."
 conser.escapan.a:0 "Nós vamos encontrá-los."
 #colombia.21
 conser.mueren.title:0 "Líderes conservadores morrem em operação de captura "
 conser.mueren.desc:0 "Os esforços para identificar e prender os líderes das sociedades extremistas não tiveram o sucesso esperado. No meio do ataque a situação se complicou em vários pontos, levando a um fogo cruzado que culminou na morte de quase todos os líderes extremistas presos. O partido conservador denunciou a má gestão do governo em relação a esses indivíduos, argumentando que o evento “corrobora a ineficácia das instituições nacionais” e acusa [COL.GetLeader] de incitar a violência política com esse tipo de “ações excessivas” ."
 conser.mueren.a:0 "Droga."
 #colombia.22
 pol.desman.title:0 "Polícia conservadora desmantelada em Nariño"
 pol.desman.desc:0 "Numa operação minuciosamente calculada pelo alto comando militar, as forças públicas conseguiram se infiltrar e lançar um ataque conjunto aos quartéis dos paramilitares conservadores de Nariño. nos arredores de Pasto, abrigados em fazendas de onde planejaram seus ataques subversivos e armazenaram grandes depósitos de armas.Os remanescentes dessa organização paramilitar de direita estão isolados e não devem representar um grande problema enquanto são capturados e processados. "
 pol.desman.a:0 "Uma conquista completa!"
 #colombia.23
 pol.gana.title:0 "Forças armadas são derrotadas por paramilitares conservadores "
 pol.gana.desc:0 "A cuidadosa operação orquestrada pelo alto comando militar sob ordem presidencial saiu do controle logo após seu início. Os agentes do governo infiltrados no corpo paramilitar foram descobertos e obrigados a revelar todas as informações. as autoridades invadiram as fazendas onde essas atividades ocorreram, a polícia conservadora já havia se retirado, enquanto outros membros ficaram e mataram vários soldados antes de escapar."
 pol.gana.a:0 "Inconcebível."
 #colombia.24
 pol.mueren.title:0 "Confronto entre a polícia conservadora e as forças armadas"
 pol.mueren.desc:0 "As fazendas que ficavam nos arredores de Pasto testemunharam um combate brutal entre as forças públicas e a chamada Polícia Conservadora. Na luta, ouviu-se um tiro que explodiu todo o ambiente. Não é se sabe de onde veio, mas o confronto terminou com várias dezenas de mortos de ambos os lados. As forças militares acabaram manchadas quando isso se tornou público, recebendo críticas principalmente do clero. O governo não se pronunciou sobre o assunto, mas vários setores políticos estão exigindo uma explicação sobre o que aconteceu, especialmente membros do partido conservador."
 pol.mueren.a:0 "De jeito nenhum..."

 colombia.25.title:0 "Insurreição conservadora!"
 colombia.25.desc:0 "A acumulação de tensão política que vínhamos acumulando finalmente explodiu. No sul do país irrompeu um combate feroz entre milícias do partido conservador e o exército nacional. A situação, infelizmente, é claro, os conservadores se levantam em armas. \n\nErramos ao permitir que sua influência subversiva se espalhasse por todo o país, e agora eles estão sob o controle do temível Laureano Gómez. Não são apenas remanescentes do exército que se rebelou , mas toda a cadeia de comando entrou em colapso e é impossível fazer contato ou direcionar qualquer instituição em sua área de influência. Agora só há uma opção: recuperar a ordem pela força”.
 colombia.25.a:0 "Esta situação saiu do controle..."
 colombia_25_tt:0 "Os partidários §Yconservadores§! iniciam uma guerra civil."

 colombia.26.title:0 "Insurreição militar!"
 colombia.26.desc:0 "Os generais renegados que viam com desconfiança a gestão do [COL.GetLeader] agiram. A notícia da rebelião foi acompanhada de tumultos em todo o exército. Alguns foram reprimidos, enquanto outros completaram sua missão e se juntaram os renegados. Parte do alto comando foi dissolvido, e várias reservas de munição foram saqueadas pelas forças rebeldes. Embora a república não tenha entrado em um caos generalizado, sem dúvida este evento trará repercussões na administração dos partidos tradicionais."
 colombia.26.a:0 "Esta situação saiu do controle..."
 colombia_26_tt:0 "Os §Ymilitares§! iniciam uma guerra civil."

 colombia.27.title:0 "Insurreição liberal!"
 colombia.27.desc:0 "A oposição liberal acabou sendo mais violenta do que esperávamos. Seu líder, Jorge Eliécer Gaitán, alega que durante todo esse tempo ele tentou fazer as coisas "pacificamente", mas a escalada da violência foi insuportável Os principais líderes liberais se reuniram no norte do país e, com a ajuda do general Alfredo Azuero Arenas, iniciaram uma revolução armada contra o governo. tamanho ou força de combate de suas unidades de milícias improvisadas, mas sabemos que se a rebelião não acabar logo eles tomarão a capital e não pararão até controlarem todo o país."
 colombia.27.a:0 "Esta situação saiu do controle..."
 colombia_27_tt:0 "Os partidários do §Yliberal§! iniciam uma guerra civil."

 colombia.28.title:0 "Milícias conservadoras se organizam em todo o país"
 colombia.28.desc:0 "O alto comando das Forças Armadas enviou notícias preocupantes ao gabinete presidencial. Em todo o país, paramilitares conservadores foram relatados se armando e assumindo o controle de diferentes populações, principalmente no sul. Se fizer algo a respeito, o governo pode perder o controle da situação."
 colombia.28.a:0 "Vamos organizar uma operação imediatamente!"
 colombia.28.b:0 "Basta capturar seus líderes."
 colombia.28.c:0 "Nós vamos superar isso."

 colombia.29.title:0 "Laureano Gómez ameaça guerra civil"
 colombia.29.desc:0 "O líder conservador Laureano Gómez fez um ultimato ao governo. Ele afirma que, se o atual governo não parar sua ação e envolver as propostas do conservadorismo em suas disposições, seus partidários pegarão em armas e tornar a república 'inviável'. Essa situação delicada abalou todo o gabinete nacional, pois as ameaças são certas e soam bastante reais."
 colombia.29.a:0 "Teremos que ceder às exigências dele..."
 colombia.29.b:0 "Vamos mudar algumas coisas para acalmá-lo."
 colombia.29.c:0 "Vamos ver se ele se atreve."

 colombia.31.title:0 "O caso Bonitto Vega"
 colombia.31.desc:0 "A insubordinação do general Bonitto Vega como secretário de guerra está enchendo a paciência do gabinete ministerial. Enquanto o poder civil exige punir o general o quanto antes, outros setores, como o partido conservador dissidente, afirmam que o governo apenas "busca desacreditar o Exército perante a opinião pública, em favor de uma Polícia progressivamente militarizada e leal aos interesses do presidente em exercício". COL.GetLeader]. "
 colombia.31.a:0 "Remover General Vega do serviço."
 colombia.31.b:0 "Não é grande coisa."

 colombia.32.title:0 "General Villamizar desrespeita ordens"
 colombia.32.desc:0 "A insubordinação do general Villamizar como secretário de guerra está enchendo a paciência do gabinete ministerial. Não só desrespeita as ordens administrativas que recebe, como também incita abertamente a desobedecer ao governo por sua "falta de liderança". Sugerem que seja instaurada imediatamente uma corte marcial para puni-lo com a destituição do cargo. Por outro lado, os demais membros do alto comando militar consideram que a situação não é tão grave, mas deve ser encarada como uma crítica à governo e não como um ato de rebelião".
 colombia.32.a:0 "Devemos estabelecer um conselho de guerra!"
 colombia.32.b:0 "Não é grande coisa."

 colombia.33.title:0 "General Neira mostra deslealdade"
 colombia.33.desc:0 "A insubordinação do general Neira como secretário de guerra está enchendo a paciência do gabinete ministerial. Ele não apenas desrespeita as ordens administrativas que recebe, mas também os incita abertamente a desobedecer ao governo por sua "falta de liderança ". Sugere que seja instaurada imediatamente uma corte marcial para puni-lo com demissão do cargo. Por outro lado, os demais membros do alto comando militar consideram que a situação não é tão grave, mas deve ser encarada como uma crítica do governo e não como um ato de rebelião".
 colombia.33.a:0 "Remover General Neira do serviço."
 colombia.33.b:0 "Não é grande coisa."

 colombia.34.title:0 "O alto comando desrespeita a autoridade"
 colombia.34.desc:0 "O alto comando militar, precedido pelos generais José Joaquín Villamizar, Miguel J. Neira e Eduardo Bonitto Vega, recusa-se a apresentar os respectivos relatórios ao poder civil. As ordens administrativas também foram ignoradas e ambos o congresso e o gabinete ministerial suspeitam que os militares estão tramando algo. Os assessores sugerem punir esse desprezo antes que a situação se agrave. Por sua vez, os generais argumentam que o governo "não tem a força necessária para manter a ordem", e que estão apenas “fazendo o que os políticos não sabem fazer”.
 colombia.34.a:0 "Uma sanção severa é justa."
 colombia.34.b:0 "Um aviso será suficiente."
 colombia.34.c:0 "Não é grande coisa."

 colombia.36.title:0 "Os militares exigem a reintegração do general Bonitto Vega"
 colombia.36.desc:0 "Os demais membros da liderança militar deixaram claro ao poder executivo sua insatisfação com a destituição do general Vega. Eles argumentam que o atual governo não está em condições de retirar membros do alto comando militar sem autorização do Congresso, e que está apenas "agravando a gravíssima situação da ordem pública atual". em suas demandas seria sinônimo de entregar o poder da instituição. As demais autoridades, por outro lado, prevêem a possibilidade de um complô militar contra o poder civil, embora sejam conjecturas inconclusivas."
 colombia.36.a:0 "O general já aprendeu a lição."
 colombia.36.b:0 "Vega permanecerá fora de serviço."

 colombia.37.title:0 "Os militares exigem a reintegração do general Villamizar"
 colombia.37.desc:0 "Os demais membros da direção militar deixaram claro ao poder executivo sua insatisfação com a demissão do general Villamizar. Eles argumentam que o atual governo não está em condições de retirar membros do alto comando militar sem autorização do Congresso, e que está apenas "agravando a gravíssima situação da ordem pública atual". cedem às suas reivindicações seria sinônimo de entregar o poder da instituição. As demais autoridades, por outro lado, preveem a possibilidade de um complô militar contra o poder civil, embora sejam conjecturas inconclusivas."
 colombia.37.a:0 "O general já aprendeu a lição."
 colombia.37.b:0 "Villamizar permanecerá fora de serviço."
 
 colombia.38.title:0 "Os militares exigem a reintegração do general Neira"
 colombia.38.desc:0 "Os demais membros da direção militar deixaram claro ao poder executivo sua insatisfação com a destituição do general Neira. Eles argumentam que o atual governo não está em condições de retirar membros do alto comando militar sem autorização do Congresso, e que está apenas "agravando a gravíssima situação da ordem pública atual". cedem às suas reivindicações seria sinônimo de entregar o poder da instituição. As demais autoridades, por outro lado, preveem a possibilidade de um complô militar contra o poder civil, embora sejam conjecturas inconclusivas."
 colombia.38.a:0 "O general já aprendeu a lição."
 colombia.38.b:0 "Neira ficará fora de serviço."

 colombia.39.title:0 "O retorno da UNIR"
 colombia.39.desc:0 "Embora a Unión Nacional de Izquierda Revolucionaria (UNIR) tenha sido dissolvida em 1935 para se fundir com o partido liberal, era óbvio que tal vínculo não duraria muito. Jorge Eliécer Gaitán, líder popular e fundador da UNIR, decidiu restabelecer formalmente seu movimento político, agora apoiado pelos setores mais radicais do liberalismo, incluindo, entre outros, seu parceiro ideológico Plinio Mendoza Neira e até o presidente López Pumarejo. população, a UNIR fica cada vez mais forte, concentrando enormes massas populares sob a liderança de Gaitán".
 colombia.39.a:0 "Grandes mudanças estão chegando na Colômbia."

 colombia.41.title:0 "Os conservadores orquestram um golpe"
 colombia.41.desc:0 "Depois de organizar uma grande unidade de militantes, apoiada por grande parte da população civil e do setor clerical, formou-se uma poderosa força de assalto conservadora que atacou o palácio presidencial ontem à noite com tal decisão que a guarda local não conseguiu responder. Como esperado, [COL.GetLeader] não havia previsto essa situação, então isolar ele e seu gabinete no gabinete presidencial foi uma tarefa bastante simples. Os principais líderes do conservadorismo, Gilberto Alzate Avendaño e Laureano Gómez , logo estavam presentes. Eles foram recebidos com uma ovação de pé dos apoiadores que se reuniram do lado de fora do palácio para se manter a par da situação. \n\nDepois de várias horas, tarde da noite, [COL.GetLeader] finalmente concordou em assinar a renúncia e entregar o comando do país ao partido conservador. A notícia se espalhou pelas ruas e, enquanto os partidários comemoravam, dentro do palácio havia uma batalha para escolher qual dos dois líderes ficaria tomar posse: o ousado falangista Gilberto Alzate ou o acérrimo tradicionalista Laureano Gómez."
 colombia.41.a:0 "Alzate é o líder que a Colômbia precisa."
 colombia.41.b:0 "Laureano Gómez é o único que vai estabilizar a república."

 colombia.42.title:0 "[ROOT.GetLeader] renuncia à presidência"
 colombia.42.desc:0 "Hoje, o presidente [ROOT.GetLeader] expressou ao congresso o grave 'negligência' das diretrizes liberais clássicas para a solução dos problemas nacionais. As divergências dentro do liberalismo, somadas às censuras do conservador partido, dividiu a administração pública e impossibilitou o governo. Em contrapartida, argumentou que seu mandato não poderia continuar nesse cenário, e que deveria ceder o comando a alguém que gozasse de amplo apoio popular. renunciou formalmente ao comando presidencial para entregá-lo ao atual prefeito de Bogotá (e candidato às próximas eleições) Jorge Eliécer Gaitán. \n\nGaitán é uma personalidade ilustre, que não apenas comove todo o povo colombiano com sua eloquência e tenacidade , mas também que mostra real interesse em reformar completamente o sistema colombiano.Entre uma grande festa de seus seguidores, Gaitán assumiu o comando da república e, após um discurso primoroso, t O slogan de sua campanha foi ouvido em uníssono: Povo, pela sua vitória, ataque!"
 colombia.42.a:0 "Gaitán não é um homem, é um povo..."

 colombia.43.title:0 "O golpe falhou!"
 colombia.43.desc:0 "As milícias organizadas pelo partido conservador não foram eficazes o suficiente para o golpe. O plano era atacar o palácio presidencial e forçar [COL.GetLeader] a renunciar. No entanto, a guarda presidencial teve tempo suficiente para notificar o exército da situação. As forças armadas se mobilizaram e em questão de minutos a situação estava em caos absoluto. As estações de rádio espalharam a mensagem rapidamente e, indignados, centenas de militantes conservadores invadiram os arsenais das delegacias e formaram grandes grupos A investida dessas divisões foi tão severa que os opositores, os apoiadores liberais, também saíram às ruas com armas na mão. \n\nA situação se agravou até que os dois principais líderes do partido conservador, Laureano Gómez e Gilberto Alzate Avendaño, declarou que "perante o fracasso da luta civil, resta apenas a força", iniciando assim uma guerra civil entre os partidários conservadores e os fiéis fiéis ao [COL.GetLeade r] administração. Mesmo no próprio exército, centenas de soldados desertaram para se juntar às fileiras conservadoras. A república está agora em uma desordem sem precedentes."
 colombia.43.a:0 "Alzate nos levará à vitória!"
 colombia.43.b:0 "Vamos vencer sob a liderança de Laureano Gómez!"

 COL_grc_rejected:0 "Eles rejeitaram a proposta"

 colombia.44.title:0 "A [FROM.GetName] busca nossa anexação "
 colombia.44.desc:0 "Ultimamente, a retórica pan-nacionalista tem circulado na [FROM.GetName], apelando para a velha ideia de reformar a velha Gran Colombia. Assim, por iniciativa popular, [COL.GetLeader] pediu ao nosso governo que nos reintegrasse na seu território pacificamente. Aceitar implicaria subjugar nossa independência e autonomia ao governo de Bogotá, por isso é difícil concluir se seria benéfico ou não. É claro, porém, que o atual governo colombiano tende a ser repressivo e autoritário, então talvez enviar não seja a melhor opção no início."
 colombia.44.a:0 "Seguiremos o caminho dos colombianos."
 colombia.44.b:0 "O povo equatoriano continuará livre!"

 colombia.45.title:0 "Equador rejeita anexação!"
 colombia.45.desc:0 "Afirmando que a independência do Equador é agora definitiva, [FROM.GetLeader] negou categoricamente a reintegração de sua nação em nosso projeto de restauração da Grã-Colombiana. O Equador fechou suas fronteiras e desdobrou várias unidades ao longo do caminho, talvez antecipando possíveis ação de nossa parte."
 colombia.45.a:0 "Será à força então..."

 colombia.46.title:0 "O Equador concorda com nossas exigências"
 colombia.46.desc:0 "[FROM.GetLeader] recebeu com entusiasmo a proposta que apresentamos. Os movimentos políticos do país que buscavam a reunificação da Grande Colômbia comemoraram a decisão e anunciaram que colaborariam com nosso governo em todos os esforços necessários."
 colombia.46.a:0 "Eles escolheram bem."


 colombia.47.title:0 "[FROM.GetName] busca nos reintegrar em seu território"
 colombia.47.desc:0 "Nosso pequeno istmo fazia parte da Grande Colômbia há muito tempo, mas nosso povo decidiu se separar devido à falta de atenção que recebíamos do governo central. Agora, [FROM.GetLeader] propõe que nos juntemos a eles para retomar o projeto da Grande Colômbia. Devemos aceitar?"
 colombia.47.a:0 "O destino do Panamá é com a Colômbia."
 colombia.47.b:0 "Nossa independência é mais valiosa do que as ambições deles!"


 colombia.48.title:0 "O Panamá se recusa a fazer parte da Grande Colômbia novamente!"
 colombia.48.desc:0 "A decisão de [FROM.GetLeader] foi precisa: O Panamá jamais aceitaria uma anexação à [FROM.GetName]. Ela evocou as muitas décadas em que o istmo esteve sob nosso controle e foi ignorado pelos governos atuais. Afirmava que a luta pela independência do Panamá era um evento definitivo e irreversível, e que o povo do Panamá deveria prosperar por conta própria. É óbvio que, antes de uma invasão de nossas forças, o istmo estará indefeso. No entanto, a principal desvantagem é que não há rota terrestre para a região, já que a fenda de Darien é uma selva inexpugnável. "
 colombia.48.a:0 "Eles não sabem o que é bom para eles."


 colombia.49.title:0 "O Panamá está prestes a ser anexado"
 colombia.49.desc:0 "Nosso pedido revelou ao povo panamenho a realidade atual: O Panamá é uma nação em crise, reduzida a ser um fantoche dos Estados Unidos. Portanto, quando a notícia do projeto Gran-Colombian chegou aos seus ouvidos, centenas de pessoas se manifestaram na capital do país e argumentaram que o Panamá deveria ser reintegrado à Colômbia, não apenas por causa da mudança estrutural e política que está experimentando, mas porque representa um futuro mais promissor do que ser um enclave dos norte-americanos. Diante da pressão popular, [FROM.GetLeader] aprovou a proposta e o processo de anexação já está em andamento. "
 colombia.49.a:0 "Eles escolheram a opção correta."


 colombia.50.title:0 "[FROM.GetName] propõe a retomada do projeto Gran-Colombiana "
 colombia.50.desc:0 "[FROM.GetLeader] deixou claro: desde que assumiu a presidência do país vizinho, seu interesse em reunificar a Grã-Colômbia. Seus desejos estão finalmente se concretizando, por isso ele nos notificou sobre a possibilidade de unir nossas duas nações para dar continuidade ao sonho do libertador Simón Bolívar. No entanto, aceitar implicaria subjugar toda a nossa independência e autonomia à administração de Bogotá, além da oposição sempre persistente em aceitar sem maiores complicações que a Venezuela deixe de existir como nação. Muitos demonstraram seu apoio à moção, embora outros também tenham se recusado firmemente a aceitá-la. A decisão final está nas mãos de [VEN.GetLeader]. "
 colombia.50.a:0 "Unidos, honraremos o legado de Bolívar!"
 colombia.50.b:0 "Isso é apenas desejo de poder.


 colombia.51.title:0 "[FROM.GetName] se recusa a colaborar com o projeto da Gran Colombiana!"
 colombia.51.desc:0 "Após um debate acirrado entre os governantes de [FROM.GetAdjective] em nível local e nacional, [FROM.GetLeader] declarou que [FROM.GetName] não será anexado repentinamente. Eles alegaram que a origem comum que unia a Colômbia e a Venezuela foi perdida há muito tempo e que uma unificação tornaria a nova nação insustentável, além de espalhar a instabilidade política de [ROOT.GetName] para o território de [FROM.GetAdjective]. Não está claro se [FROM.GetLeader] ordenou uma retirada militar para evitar uma invasão nossa, mas não seria algo a se pensar. "
 colombia.51.a:0 "Eles são uma vergonha para o libertador!"


 colombia.52.title:0 "O governo [FROM.GetAdjective] aprova nossa proposta"
 colombia.52.desc:0 "Após um intenso debate entre os líderes venezuelanos em nível local e nacional, a embaixada nos notificou que [FROM.GetName] colaborará harmoniosamente na restauração da Grande Colômbia. Como estava previsto em nossa proposta, [FROM.GetLeader] permanecerá à frente da nova administração na região, e os procedimentos burocráticos necessários para a unificação serão realizados. "
 colombia.52.a:0 "O retorno da Grande Colômbia está se aproximando."


 colombia.53.title:0 "[FROM.GetName] está disposto a comprar Yaguas"
 colombia.53.desc:0 "[FROM.GetAdjective] diplomatas ofereceram a possibilidade de vendermos a eles o estado de Yaguas. Ele já fez parte da Grande Colômbia e, embora não represente uma área estratégica ou amplamente industrializada, eles insistem que devemos abrir mão da terra. Essa pode ser uma proposta razoável, mas devemos considerar o custo-benefício da venda e se ela pode ser viável em longo prazo. Devemos aceitar? "
 colombia.53.a:0 "Uma proposta interessante."
 colombia.53.b:0 "Nossas terras não estão à venda."


 colombia.54.title:0 "[FROM.GetName] aceita a venda de Yaguas"
 colombia.54.desc:0 "Yaguas fazia parte da Grande Colômbia e ajudou-a a ter uma fronteira consistente com a Amazônia. Portanto, é muito agradável saber que [FROM.GetName] soube reconhecê-lo e concordou em ceder o território para nós. Não falta muito para restabelecer o território de [FROM.GetAdjective] no sul."
 colombia.54.a:0 "A diplomacia é uma arte sutil."


 colombia.55.title:0 "[FROM.GetName] rejeita a proposta de Yaguas"
 colombia.55.desc:0 "[FROM.GetLeader] teve a audácia de nos negar o território de Yaguas. Esse estado fazia parte da Grande Colômbia e, sem ele, nossa nova nação não terá uma fronteira consistente com a Amazônia. Eles afirmam que sua soberania sobre o território é a única reconhecida e não pretendem mudá-la. "
 colombia.55.a:0 "Então nós mesmos a tomaremos!"
 colombia.55.b:0 "É uma pena."


 colombia.56.title:0 "[FROM.GetName] quer comprar o Mapari"
 colombia.56.desc:0 "[FROM.GetAdjective] diplomatas informaram o governo do interesse de [FROM.GetName] em adquirir o estado de Mapari. Eles afirmam que estão dispostos a pagar uma quantia considerável e que isso seria de grande ajuda na reconstrução de sua fronteira, proposta por [COL.GetLeader]. Devemos aceitar essa oferta? "
 colombia.56.a:0 "Uma proposta interessante."
 colombia.56.b:0 "Nossas terras não estão à venda."


 colombia.57.title:0 "[FROM.GetName] aceita a proposta do Mapari"
 colombia.57.desc:0 "[FROM.GetLeader] concorda em nos vender o Mapari, desde que paguemos o preço acordado e respeitemos os outros limites que temos com eles. As guarnições de [FROM.GetName] já estão sendo retiradas e a mudança de administração já foi notificada à população da área, que (ou pelo menos a maioria) vê essa mudança com esperança."
 colombia.57.a:0 "Excelente."


 colombia.58.title:0 "[FROM.GetName] se recusa a vender o Mapari"
 colombia.58.desc:0 "[FROM.GetLeader] não concorda em nos vender o Mapari, pois considera que nossas ambições estão indo longe demais ao interferir em sua soberania. Portanto, é possível que eles reforcem a presença militar na área para evitar uma possível altercação. O gabinete ministerial lamenta que não tenha sido possível chegar a um acordo diplomático, e a guerra está começando a ser vista como uma opção plausível. "
 colombia.58.a:0 "Ela será nossa novamente, a qualquer custo."
 colombia.58.b:0 "Não há nada a fazer."


 colombia.59.title:0 "[FROM.GetName] quer negociar a compra de Japurá"
 colombia.59.desc:0 "Por meio de uma nota diplomática, o governo [FROM.GetAdjective] notificou seu interesse no estado de Japurá, que está sob nosso controle. Esse território, que já foi parte da Grande Colômbia, parece representar parte da identidade nacional da nova república que [FROM.GetLeader] busca forjar. É por isso que eles se ofereceram para comprar o território, uma opção que ressoa entre os assessores do governo como viável no atual panorama de tensão. "
 colombia.59.a:0 "Uma proposta interessante."
 colombia.59.b:0 "Nossa terra não está à venda."


 colombia.60.title:0 "[FROM.GetName] concorda em vender Japurá"
 colombia.60.desc:0 "[FROM.GetLeader] considerou possível entregar o controle de Japurá para nós em troca do pagamento acordado. Os procedimentos burocráticos já estão em andamento e os guardas de fronteira foram mobilizados para a linha divisória resultante. A população comemorou esse marco e dá as boas-vindas ao futuro de nossa nação. "
 colombia.60.a:0 "Nossas fronteiras estão se restabelecendo."


 colombia.61.title:0 "[FROM.GetName] não concorda em vender Japurá"
 colombia.61.desc:0 "[FROM.GetLeader] não considera possível entregar o controle de Japurá para nós, não importa o quanto paguemos. Sua declaração foi finalizada e ele solicita que uma proposta semelhante não seja apresentada novamente, pois a decisão é definitiva. A opinião pública não viu com bons olhos esse fracasso diplomático, mas, devido à situação do país, não há muito que possa ser feito a respeito."
 colombia.61.a:0 "Bem, nós vamos tirar isso deles!"
 colombia.61.b:0 "É uma pena."


 colombia.62.title:0 "[FROM.GetName] solicita a venda de Guayana Esequiba"
 colombia.62.desc:0 "[FROM.GetAdjective] diplomatas apresentaram a possibilidade de vendermos o território de Essequibo para eles. Pode ser uma proposta razoável, mas devemos levar em conta a quantidade de recursos que o local contém e o custo-benefício da venda. Devemos aceitar? "
 colombia.62.a:0 "Uma proposta interessante."
 colombia.62.b:0 "Nossa terra não está à venda."


 colombia.63.title:0 "[FROM.GetName] está disposto a vender o Essequibo"
 colombia.63.desc:0 "[FROM.GetName] concordou em nos dar o Essequibo em troca de uma cota industrial acessível. Na verdade, não se esperava que [FROM.GetName] concordasse, mas, considerando o panorama mundial, é provável que eles aceitassem devido à sua incapacidade de manter esse território."
 colombia.63.a:0 "Nossas fronteiras estão se restabelecendo."


 colombia.64.title:0 "[FROM.GetName] não negociará a venda do Essequibo"
 colombia.64.desc:0 "Representantes da [FROM.GetName] deixaram claro que o território do Essequibo não será vendido em nenhuma circunstância para nossa nação, pois é uma área de recursos estratégicos e essenciais. Talvez prevendo nossos planos, eles mobilizaram tropas para a área de fronteira para sua proteção. Não há muito o que fazer em relação a isso diplomaticamente. "
 colombia.64.a:0 "Se eles insistem tanto em preservar o que é nosso..."
 colombia.64.b:0 "Então, ficará em suas mãos."

 colombia.65.title:0 "O Bloco Hispânico"
 colombia.65.desc:0 "Com a ameaça do comunismo e do populismo democrático pairando sobre o mundo, o presidente da Colômbia [COL.GetLeader] propôs que estabelecêssemos uma aliança que pudesse manter nossas nações estáveis ​​e seguras diante de conflitos . Lembrando nossas raízes comuns, a Colômbia busca que este novo “Bloco Hispânico” represente a supremacia da vontade autocrática.
 colombia.65.a:0 "Uma excelente ideia."
 colombia.65.b:0 "Não estamos interessados ​​em nos aliar a um país atrasado."
 colombia.66.title:0 "O governo [From.GetAdjective] concorda em se juntar ao Bloco Hispânico."
 colombia.66.desc:0 "Foi notificado que o governo [From.GetAdjective] concorda em entrar no Bloco Hispânico, a fim de enfrentar e contrabalançar as atuais potências mundiais. Os respectivos procedimentos estão em andamento, por isso esperamos que a aliança será formalizado muito em breve e receberemos os relatórios de inteligência compartilhados."
 colombia.66.a:0 "Nossa aliança vai abalar as potências mundiais."
 colombia.67.title:0 "O governo [From.GetAdjective] não está interessado em aderir ao Bloco Hispânico."
 colombia.67.desc:0 "O embaixador de [From.GetName] deixou claro que eles não estão interessados ​​em estabelecer uma aliança conosco. Ele menciona que a situação global não merece esse tipo de proposta neste momento, nem que são propícias considerando o delicado contexto em que o mundo se encontra."
 colombia.67.a:0 "Eles podem mudar de ideia mais tarde."
 
 colombia.69.title:0 "As eleições de 1938"
 colombia.69.desc:0 "Estas eleições foram históricas, pois é a primeira vez (graças às reformas de López Pumarejo) que os eleitores não exigem condições de aluguel ou ilustração para votar. Como planejado, os conservadores se abstiveram de participar, alegando que não teve chance de vitória nem garantias democráticas. Portanto, o liberal Eduardo Santos venceu sem concorrentes com um total de 511.947 votos."
 colombia.69.a:0 "O povo falou."
 colombia.71.title:0 "As eleições de 1942"
 colombia.71.desc:0 "Assim como há quatro anos, o partido liberal saiu vitorioso nestas eleições. O ex-presidente López Pumarejo voltou a se candidatar e saiu triunfante contra outro candidato da dissidência liberal. Embora os próximos quatro anos sejam promissores, os conservadores mais arraigados estão ameaçando a nova presidência. Vamos torcer para que não prosperem."

 colombia.72.title:0 "A promoção de Rojas Pinilla"
 colombia.72.desc:0 "O oficial Gustavo Rojas Pinilla está demonstrando excepcional talento e habilidade para comandar unidades. Alguns atribuem isso ao conhecimento adquirido em sua missão militar, enquanto outros apenas afirmam que é um dom natural. Sua atuação impressionou seus superiores , que por unanimidade decidiram promovê-lo a general. No entanto, para que a promoção tenha efeito, ela deve ser aprovada pelo presidente [ROOT.GetLeader], conforme exigido por lei."
 colombia.72.a:0 "Ele tem a aprovação."
 colombia.72.b:0 "Ele ainda não está pronto."

 colombia.73.title:0 "A questão da oposição"
 colombia.73.desc:0 "Os focos deste novo estado conservador são colocados nos antigos governantes e eternos opositores da doutrina tradicionalista: os liberais. Não há dúvida de que sua gestão tem sido extremamente popular, mas isso não justifica que suas reformas estavam levando a Colômbia para o caminho do ateísmo e da anarquia. Era inaceitável. \n\nAgora, apesar de nosso golpe ter sido um sucesso, os liberais continuam representando um problema sério para a república. Eles não têm nenhum tipo do poder, mas continuam a se mobilizar contra a ordem institucional nas ruas. Personagens como Jorge Eliécer Gaitán apenas incitam as massas a contrariar o governo e, se continuarem, chegará a um ponto em que não teremos controle sobre o país. Mas, considerando que seu antigo governo foi bastante bem-sucedido, resta-nos apenas duas opções: colaborar com eles para evitar a ira popular ou atacá-los com tanta força que nunca mais se recuperarão."
 colombia.73.a:0 "É hora de uma reconciliação nacional."
 colombia_73_a_tt:0 "A §Yinfluência subversiva liberal§! vai crescer §R25%§! mais rápido, mas eliminá-la será fácil."
 colombia.73.b:0 "Não daremos a pátria aos alienados!"
 colombia_73_b_tt:0 "A §Yinfluência subversiva liberal§! vai crescer §G35%§! mais devagar, mas eliminá-la será difícil."

 colombia.74.title:0 "A república está em desordem"
 colombia.74.desc:0 "O governo de Laureano Gómez não foi popular. A estabilidade do país parece estar cada vez mais baixa, enquanto a violência política, seja entre partidos tradicionais ou entre fanáticos ideológicos, atingiu um ponto de acuidade nunca visto antes, juntamente com o medo constante de uma guerra inevitável de escalas inimagináveis. \n\nA oposição culpou Laureano Gómez e suas políticas extremistas e repressivas. Surpreendentemente, esses apoiadores antilaureanos encontraram um aliado nas forças armadas. Os militares também questionando o novo regime e liderados por Gustavo Rojas Pinilla concordaram com a oposição e agora parecem estar organizando uma grande rebelião. Talvez a única maneira de evitar que o país entre em sua décima guerra civil seja ceder o poder a Rojas e aos insurgentes pacificamente ... "
 colombia.74.a:0 "Vamos ver se eles se atrevem!"

 colombia.75.title:0 "A ascensão da oposição"
 colombia.75.desc:0 "O que havíamos previsto aconteceu, mas nos pegou de surpresa. O agora general rebelde Gustavo Rojas Pinilla consolidou poder suficiente na oposição para liderar uma rebelião armada. Relatórios urgentes estão vindo de quase todos os cantos anunciando que várias guarnições militares se levantaram e distribuíram armas entre a população civil. A cadeia de comando caiu, o exército foi disperso e as forças do governo estão lutando fervorosamente para recuperar o controle institucional. A Colômbia entrou em uma sangrenta guerra civil."
 colombia.75.a:0 "Traidores ingratos!"
 colombia_75_tt:0 "Os apoiadores de §YGustavo Rojas Pinilla§! vão começar uma guerra civil."

 colombia.76.title:0 "O golpe de opinião"
 colombia.76.desc:0 "O povo e a oposição celebram a queda do regime de Laureano Gómez. No que chamaram de "Golpe de Opinião" (já que foi apoiado por quase todo o país). O general Gustavo Rojas Pinilla assumiu a presidência sem derramar uma única gota de sangue. Rojas Pinilla promete estabilizar o país e conduzi-lo a uma época de glória nunca antes vista em nenhum outro regime. Certamente não será difícil para ele, considerando que ele não é apenas extraordinariamente popular mas também hábil em manter o exército unido sob sua figura."
 colombia_76_tt:0 "§YComando General de las Fuerzas Armadas§! torna-se o partido no poder."
 Colombia.76.a:0 "E assim começa mais um regime militar..."

 colombia.77.title:0 "Nossas forças derrotam os americanos"
 colombia.77.desc:0 "A vontade de nossos homens triunfou sobre as ambições dos EUA de tomar nosso território. Os bravos oficiais do exército lideraram o ataque contra as guarnições dos EUA; um ataque tão violento se mostrou impossível de repelir, e hoje nossas forças ocuparam o o canal triunfa. A mudança de administração foi realizada e a travessia marítima está agora definitivamente sob nosso controle."
 colombia.77.a:0 "Recuperamos o que nos pertence!"

 colombia.78.title:0 "O exército é derrotado no istmo"
 colombia.78.desc:0 "O ditador da Colômbia [From.GetLeader] teve a audácia de lançar uma grande ofensiva contra nossas forças no Canal do Panamá a partir de bases próximas. Infelizmente eles tiveram sucesso e nossas tropas confusas estão se retirando. prejudicou nossa capacidade de projetar nossa força para o mundo, o que é uma humilhação internacional."
 colombia.78.a:0 "Infelizmente, temos questões mais urgentes. Um embargo deve ser suficiente."
 colombia.78.b:0 "Isso merece mais do que um aviso!"

 colombia.79.title:0 "O exército é derrotado no canal"
 colombia.79.desc:0 "A ofensiva militar não teve o sucesso esperado no canal. As forças americanas plantaram uma defesa feroz, estabelecendo uma frente que era impossível de romper. Os oficiais já ordenaram a retirada e nossos homens se retraíram de volta para o istmo."
 colombia.79.a:0 "Um pequeno inconveniente, nada mais."

 colombia.80.title:0 "Nossas forças conseguem conter o ataque ao canal"
 colombia.80.desc:0 "O ditador da Colômbia [From.GetLeader] teve a audácia de lançar uma grande ofensiva contra nossas forças no Canal do Panamá de bases próximas. Felizmente, nossos bravos soldados conseguiram parar sua operação e repeliram os invasores. O ataque mostrou que não somos mais os senhores do continente, o que é uma humilhação internacional."
 colombia.80.a:0 "Infelizmente, temos questões mais urgentes. Um embargo deve ser suficiente."
 colombia.80.b:0 "Estas ações são inaceitáveis!"

 colombia.81.title1:0 "[USA.GetName] cede à pressão sobre o Canal do Panamá"
 colombia.81.title2:0 "Conflitos pelo controle do canal do Panamá"
 colombia.81.desc1:0 "Após um ataque inesperado ao Canal do Panamá, as forças colombianas ocuparam a área circundante e dispersaram as forças americanas ali instaladas. [COL.GetLeader] descreveu este evento como uma vitória total e definitiva, alegando que todos O território panamenho está finalmente "nas mãos de seu legítimo proprietário". \n\nA comunidade internacional reconhece que este evento é uma humilhação para as forças dos EUA e pode significar o declínio daquele país. Embora [USA.GetLeader] não tenha feito nenhum declarações no momento, não seria surpreendente se respondesse com severas represálias contra a nação sul-americana".
 colombia.81.desc2:0 "Após um ataque inesperado no Canal do Panamá, as forças armadas colombianas atacaram o enclave dos EUA de bases militares próximas. No entanto, o ataque não teve sucesso e foi uma derrota esmagadora para os agressores. Nem [COL.GetLeader ] nem [USA.GetLeader] forneceram declarações a esse respeito, enquanto analistas internacionais concordam que esse evento não passará despercebido, então não seria surpreendente se os americanos respondessem com severas represálias contra a nação latina."
 colombia.81.a:0 "Nós apenas mostramos nossa força!"
 colombia.81.b:0 "Uma ofensa à soberania dos Estados Unidos."
 colombia.81.c:0 "A Colômbia finge agir sem consequências?"

 colombia.82.title:0 "A negociação sobre os campos de petróleo"
 colombia.82.desc:0 "Semelhante aos nossos homólogos mexicanos e venezuelanos, nosso país é um dos maiores produtores de petróleo da região. Nossa economia depende em grande parte de sua extração, mas a industrialização recente mostrou que os cofres da nação não são preenchido apenas com o chamado “ouro negro”. \n\nPara deixar de depender quase exclusivamente dessa exportação, organizamos um plano para conceder concessões a outras potências estrangeiras democráticas em troca de apoio na produção civil e militar. só nos beneficiará em questões industriais, mas também apoiará a causa da guerra em defesa da democracia durante esses tempos difíceis. A única coisa que resta é assinar o plano e escolher a quem vamos apresentá-lo ".
 colombia.82.a:0 "A maquinaria americana precisa de combustível colombiano."
 colombia.82.b:0 "O exército francês tem pouco petróleo."
 colombia.82.c:0 "Nosso petróleo ajudará a Marinha Real Britânica."
 colombia.82.d:0 "Outras grandes potências precisam de nossos recursos."

 colombia.83.title:0 "A Colômbia oferece a concessão de seus campos de petróleo"
 colombia.83.desc:0 "Em uma reviravolta inesperada, a embaixada colombiana nos enviou um plano elaborado por ele [COL.GetLeader] no qual se propunha conceder-nos direitos sobre um de seus campos petrolíferos em troca de uma simples e modifica a cota industrial. Aceitar a oferta é uma opção tentadora, embora, se nossa nação tiver poucas fábricas, talvez tenhamos que rejeitá-la."
 colombia.83.a:0 "Uma proposta maravilhosa!"
 colombia.83.b:0 "Não estamos em condições de aceitar agora."
 COL_oil_concession:0 "Eles nos deram seus recursos"

 colombia.84.title:0 "[FROM.GetName] aceita a concessão"
 colombia.84.desc:0 "Uma nota diplomática nos informou que [FROM.GetLeader] mostrou grande interesse na oferta de nosso plano de concessão e a aceitou imediatamente. Os respectivos procedimentos já estão em andamento e espera-se que em breve a concessão seja seja formalizado e receberemos nossa cota industrial."
 colombia.84.a:0 "Excelente!"

 colombia.85.title:0 "[FROM.GetName] rejeita a concessão de petróleo"
 colombia.85.desc:0 "Embora tivéssemos certeza de que [FROM.GetName] ia aceitar nossa oferta, chegou surpreendentemente a notícia de que eles a rejeitaram. Eles alegam que não estão em condições de cumprir a cota industrial que pedimos em troca e que devemos procurar outra opção."
 colombia.85.a:0 "Será para outra pessoa então."

 colombia.86.title:0 "Os oligarcas condenam o governo de [ROOT.GetLeader]"
 colombia.86.desc:0 "Um relatório urgente do Ministério da Fazenda confirma que a nação entrou em uma delicada crise econômica e social. Vários empresários e oligarcas decidiram retirar suas principais indústrias do país depois de saber que [ROOT.GetLeader] ratificou a polêmica reforma agrária, expressando que a referida reforma era “desnecessária” e que ia “contra o empreendedorismo nacional”. . Se o governo não se pronunciar sobre isso, é certo que outros oligarcas do país tomarão a mesma decisão."
 colombia.86.a:0 "Mas é para o bem do povo!"

 colombia.87.title:0 "Sindicatos se mobilizam contra o governo"
 colombia.87.desc:0 "Hoje notícias preocupantes chegaram ao gabinete presidencial. As principais organizações sindicais do país estavam fartas de esperar pela colaboração do governo. A indignação desses grupos atingiu o ápice quando foram notificados de que [ROOT O governo .GetLeader] não sancionou a tão almejada reforma agrária entre os sindicatos, mas continuou com uma política que privilegia os oligarcas sobre os trabalhadores. greves gerais em todo o país. Eles alegam que essas ações não vão parar até que o governo ceda e reforme a lei trabalhista."
 colombia.87.a:0 "Mas é para o bem da república!"

 colombia.88.title:0 "O Tratado de Assistência Colombiano-Americano"
 colombia.88.desc:0 "Com a ameaça fascista e comunista pairando sobre o mundo ocidental, o presidente da Colômbia [COL.GetLeader] propôs que façamos uma aliança que possa manter nossas duas nações estáveis ​​e seguras diante da possível conflito”.
 colombia.88.a:0 "Uma aliança estratégica."
 colombia.88.b:0 "Não estamos interessados."

 colombia.89.title:0 "Os Estados Unidos assinam o tratado"
 colombia.89.desc:0 "A embaixada dos EUA na capital confirmou que [USA.GetLeader] concordou em ratificar o tratado e que entrará em vigor o mais rápido possível. No entanto, só poderemos ver seus efeitos quando estivermos em um conflito armado”.
 colombia.89.a:0 "Boas notícias!"
 colombia.90.title:0 "Estados Unidos rejeitam o tratado"
 colombia.90.desc:0 "A embaixada dos EUA na capital informou que [USA.GetLeader] não estava interessado em ratificar o tratado de assistência, e que não estava disposto a aceitar uma proposta semelhante nestes tempos de guerra."
 colombia.90.a:0 "Então não podemos contar com eles..."

 colombia.91.title:0 "A reunificação da Grã-Colômbia"
 colombia.91.desc:0 "Depois de ter recuperado todas as nações pertencentes à antiga Gran Colombia, o governo colombiano à frente do [COL.GetLeader] proclamou à comunidade internacional a reunificação oficial da Gran Colombia. Inspirado nas idéias políticas de Simón Bolívar, a propaganda pan-nacionalista se espalhou por todo o país, consolidando a confiança dos cidadãos no futuro de sua nova pátria. \n\nNo entanto, este “renascimento do legado do Bolívar” deu muito que falar no continente americano. alguns argumentam que a instabilidade fará a nascente república desmoronar, outros consideram que as ameaças externas são um problema maior. Por enquanto, o futuro do povo colombiano permanece um mistério."
 colombia.91.a:0 "O mundo saberá do que somos capazes!"
 colombia.91.b:0 "Outro desequilíbrio de poder na região."
 colombia.91.c:0 "Não vai durar muito!"

 colombia.92.title:0 "Golpe de Estado na Gran Colombia"
 colombia.92.desc:0 "Em resposta ao colapso da administração civil na Colômbia durante a presidência de Laureano Gómez, os dois partidos tradicionais do país apoiaram uma rebelião liderada pelo general Gustavo Rojas Pinilla. mais uma guerra civil para o país, os militares finalmente depuseram o governo de Laureano Gómez e instalaram Rojas Pinilla como o novo chefe de Estado. \n\nEste evento histórico foi chamado de 'golpe de opinião' pelos analistas, uma vez que foi apoiado por quase todos os setores políticos não laureanos da nação. Mesmo que o novo governo não tenha dado declarações expressas, espera-se que Rojas Pinilla estabilize o país e reduza o legado violento de seu antecessor."
 colombia.92.a:0 "Uma nova era para a Colômbia!"
 colombia.92.b:0 "Era de se esperar."
 colombia.92.c:0 "Vamos derrotá-los de qualquer maneira!"

 colombia.93.title:0 "Óscar Benavides revolta-se contra o governo!"
 colombia.93.desc:0 "O general Óscar Benavides já vinha mostrando tendências insubordinadas há algum tempo. Ficou claro que ele não concordava plenamente com o novo governo que se estabeleceu após a Constituinte. Hoje finalmente foi anunciado que sua rebelião é definitivo: Benavides deixou sua posição e atravessou para a Colômbia no momento da declaração de guerra. Agora ele está a serviço de nossos inimigos, tentando estabelecer um novo regime em nossa nação com seu apoio."
 colombia.93.a:0 "Traidor!"

 colombia.95.title:0 "O governo provisório de Loreto "
 colombia.95.desc:0 "Com Loreto sob ocupação de nossas Forças Armadas, o general Óscar Benavides sugeriu ali estabelecer o novo governo provisório peruano. Uma ordem administrativa já foi estabelecida para manter a ordem, e eles começaram a recrutar milícias militares para apoia a causa peruana. Benavides nos expressou sua gratidão e espera que as relações entre o novo Estado peruano e nossa nação sejam próximas e amistosas."
 colombia.95.a:0 "Juntos vamos restabelecer a ordem no Peru."

 colombia.96.title:0 "A morte de Vásquez Cobo"
 colombia.96.desc:0 "A república está de luto. Depois de sofrer vários problemas de saúde, o general Vásquez Cobo, herói da guerra colombiana-peruana e grande opositor dos políticos, morreu hoje. Sua idade avançada não foi impedimento para liderar o golpe contra os dois partidos tradicionais, que levavam a nação a um estado de violência cíclica e perpétua. Seu legado permanecerá no futuro da nação e sua dedicação jamais será esquecida pelo povo colombiano. Mas agora a questão é : quem vai liderar a república?"
 colombia.96.a:0 "Estabelecer uma Junta Militar manterá os interesses pessoais de fora."
 colombia.96.b:0 "O Estado-Maior Geral assumirá as funções governamentais."
 colombia.96.c:0 "O General Villamizar deve assumir o comando."
 colombia.96.d:0 "General Bonitto Vega é o líder certo."

 colombia.97.title1:0 "O exército toma conta de Japurá"
 colombia.97.title2:0 "As forças armadas ocupam Mapari"
 colombia.97.desc1:0 "O ataque coordenado que planejamos em Japurá foi um sucesso total. As forças brasileiras se retiraram e se desorganizaram enquanto as nossas ocupavam triunfantemente o estado. Não há necessidade de esperar para descobrir que [BRA.GetLeader] não reagirá da melhor maneira a este evento, mas pelo menos a supremacia do nosso exército sobre o deles está assegurada. Japurá será em breve reintegrado oficialmente à Colômbia."
 colombia.97.desc2:0 "A rápida ofensiva de nossas tropas foi um embate brutal entre nosso exército e o brasileiro. O combate resultante durou um tempo até terminar com nossa vitória e posterior ocupação do Mapari. Os comandantes dos batalhões receberam muitos elogios a esta vitória e ao general encarregado de liderar o confronto. Mapari está definitivamente sob o controle colombiano, como deveria estar."

 colombia.98.title1:0 "O exército é derrotado em Japurá"
 colombia.98.title2:0 "Nossas forças são derrotadas em Mapari"
 colombia.98.desc1:0 "O ataque coordenado que planejamos em Japurá foi um fracasso total. As forças brasileiras resistiram ferozmente e foi impossível para nossos soldados proteger o território. Não há necessidade de esperar para descobrir que [ BRA .GetLeader] não reagirá da melhor maneira a este evento, não importa o quão bem-sucedidos eles sejam. Na pior das hipóteses, uma guerra em grande escala pode eclodir entre nossas nações."
 colombia.98.desc2:0 "A rápida ofensiva de nossas tropas foi um embate brutal entre nosso exército e o brasileiro. O combate resultante durou algum tempo, mas infelizmente não conseguimos tomar o controle do Mapari. Os comandantes dos batalhões podem Não explicar como um ataque tão planejado não teve o sucesso esperado, enquanto o general no comando alude a vários fatores de diferentes tipos. As tropas ficaram muito desmoralizadas com essa derrota, assim como a opinião pública questiona a verdadeira eficácia do nosso exército. "

 colombia.99.title1:0 "O ataque a Japurá é repelido"
 colombia.99.title2:0 "Colombianos se retiram do Mapari"
 colombia.99.desc1:0 "A Colômbia teve a audácia de lançar uma grande ofensiva contra nossas forças em Japurá de bases próximas. Era algo que esperávamos conhecendo as ambições ditatoriais do [COL.GetLeader]. Felizmente, nossos bravos soldados conseguiram parar sua operação e repeliram os invasores. Essa defesa heróica mostrou que nosso exército continua sendo de padrão superior, reforçando nossa soberania na região e nossa unidade nacional."
 colombia.99.desc2:0 "Um ataque colombiano inesperado às guarnições de Mapari obrigou nossos homens a enfrentar os agressores. Felizmente, as divisões foram fortes o suficiente para manter suas posições e nem um metro de terra acabou sob controle inimigo. [ BRA.GetLeader] elogiou o trabalho e heroísmo dos soldados na Amazônia, mas ainda questiona se seria apropriado organizar uma resposta militar ou manter o status quo."
 colombia.99.a:0 "Nós demonstramos nossa supremacia."
 colombia.99.b:0 "É um ato de agressão!"

 colombia.100.title1:0 "Forças colombianas ocupam Japurá"
 colombia.100.title2:0 "O exército colombiano assume o controle de Mapari"
 colombia.100.desc1:0 "A Colômbia teve a audácia de lançar uma grande ofensiva contra nossas forças em Japurá a partir de bases próximas. Era algo que esperávamos conhecendo as ambições ditatoriais do [COL.GetLeader]. Infelizmente, nosso exército não conseguiu repelir o ataque e o estado caiu nas mãos dos colombianos. Parece que nossa nação está em declínio, e é possível que outras nações aproveitem essa aparência para obter vantagem própria."
 colombia.100.desc2:0 "Um inesperado ataque colombiano às guarnições de Mapari obrigou nossos homens a entrar em combate com os agressores. Infelizmente, foi impossível repelir o ataque e o estado acabou sob ocupação colombiana. Os oficiais militares sugiro finalizar um plano de ataque para expulsá-los, mas considerando o resultado da batalha, é provável que seja infrutífero."
 colombia.100.a:0 "Deixe-os então."
 colombia.100.b:0 "Isso é inédito!"

 colombia.101.title:0 "A Colômbia planeja tomar nosso território no norte "
 colombia.101.desc:0 "[COL.GetLeader] teve a coragem de reivindicar para sua nação o território que controlamos no norte e que acabamos de obter há vários anos. Se não enviarmos um contingente de defesa para a fronteira com a Colômbia podem tomá-la sem uma palavra, o que seria um desserviço ao nosso governo e ao exército brasileiro."
 colombia.101.a:0 "Vamos lidar com a situação adequadamente."

 colombia.102.title:0 "Políticos colombianos exilados oferecem seu apoio"
 colombia.102.desc:0 "Após o golpe de estado liderado por Alfredo Vásquez Cobo na Colômbia, muitos políticos tiveram que se exilar devido à iminente tomada do poder pelos militares. No entanto, eles continuaram determinados a retomar o poder em seus nação e restabelecer a ordem institucional anterior. Esta é a oportunidade deles. Vários desses exilados ofereceram ao governo para colaborar conosco em nossa luta, dando-nos seu conhecimento sobre o funcionamento interno do país para obter uma vantagem estratégica. Nosso governo conselheiros não concorda em aceitar ou não esta oferta, pois não temos certeza sobre suas intenções ou se são verdadeiras".
 colombia.102.a:0 "Precisávamos dessa ajuda!"
 colombia.102.b:0 "Não podemos confiar neles"
 
 colombia.103.title:0 "Políticos no exílio estão apoiando [From.GetName]!"
 colombia.103.desc:0 "Depois do golpe de Alfredo Vásquez Cobo na Colômbia, muitos políticos tiveram que se exilar devido à iminente tomada do poder pelos militares. No entanto, eles continuaram determinados a recuperar o controle e restabelecer a ordem institucional anterior Agora, com o conflito que paira sobre a Colômbia, esses exilados encontraram sua oportunidade de agir, tiveram a audácia de se oferecer ao governo [From.GetAdjective] como colaboradores para derrubar o novo regime militar. Agora o inimigo sabe como nosso governo funciona e terá uma vantagem estratégica no combate."
 colombia.103.a:0 "Mesmo do exterior traem seu país!"

 colombia.104.title:0 "Triunfo confederado na guerra de unificação"
 colombia.104.desc:0 "Nosso apoio às forças sindicalistas foi de grande ajuda em sua campanha. O triunfo de sua missão foi bem recebido pela população, e a nova Confederação Peru-Boliviana foi oficialmente proclamada. [PRU] .GetLeader] notificou sua gratidão ao nosso governo, e espera que as relações entre a nova nação e a nossa sejam estreitas e gratificantes, mas podem desconfiar de nossas intenções de manter a hegemonia da região, o que pode levar a futuras Mas essas suposições são inconclusivas e, desde que nossas ações sejam sutis, não deve haver desvantagens em nosso trabalho."
 colombia.104.a:0 "Excelente."

 colombia.105.title:0 "Sindicalistas se preparam para a insurreição!"
 colombia.105.desc:0 "O momento que menos esperávamos finalmente chegou. Sabemos que as milícias unionistas estão se preparando para pegar em armas e não há muito que possamos fazer além de nos preparar para a guerra civil iminente. É muito provável que que contarão com o apoio militar dos colombianos, mas a situação não nos permite lidar com eles agora. Devemos enfrentar primeiro os sindicalistas e depois nos encarregaremos de seus arquitetos."
 colombia.105.a:0 "Nós vamos esmagá-los!"

 colombia.106.title:0 "O governo colombiano apoia as milícias subversivas"
 colombia.106.desc:0 "Nossos relatórios de inteligência informam que as organizações de extrema direita que defendem a reunificação da Confederação Peru-Boliviana estão aumentando suas atividades no país. Esses incidentes foram anteriormente isolados, mas estão se intensificando devido ao que parece Seja o apoio financeiro dos colombianos. Essas acusações são delicadas, então a ausência de provas conclusivas nos deixa em uma posição impraticável. De qualquer forma, é melhor se preparar antes que seja tarde demais."
 colombia.106.a:0 "Quem eles pensam que são?!"

 ## Evento genérico de inicialização
 EUYL_startupevent.1.t:0 "Obrigado por jogar En Unión Y Libertad | Um retrabalho na América do Sul!"
 EUYL_startupevent.1.d:0 "Thank you so much for playing the mod. If you encounter any bug, feel free to report it on steam or on the discord. Also, please keep in mind this mod is available in English, Spanish, and Portuguese.\n\nMuchas gracias por jugar al mod! Si llegan a encontrar cualquier bug, reportenlo en steam o en el discord. Por favor tengan en cuenta que este mod esta disponible en Ingles, Español, y Portugues.\n\nMuito obrigado por jogar o mod. Se você encontrar algum bug, sinta-se à vontade para relatá-lo no Steam ou no Discord. Além disso, lembre-se de que este mod está disponível em inglês, espanhol e português."
 EUYL_startupevent.1.a:0 "Doce, eu vou"
 EUYL_startupevent.1.b:0 "Jesus Cristo, pare de me incomodar"

 news.bolivia.t:0 "A Guerra Civil Boliviana"
 news.bolivia.d:0 "Após a recusa de Tejada em ceder ao exército, os generais Germán Busch e David Toro decidiram pegar em armas, usando seu apoio militar e influência sobre as forças armadas, e organizaram uma revolta em grande escala contra Governo de Tejada. Vários relatos de bombardeios já ocorreram, e os combates estão acontecendo enquanto esta mensagem está sendo enviada globalmente. \n\nO país está dividido de forma muito equilibrada e muitos especialistas não têm certeza de qual será o resultado desse conflito, nem as consequências que isso trará. \n\nTudo o que podemos fazer é esperar que a situação não escale além das fronteiras da Bolívia."
 news.bolivia.a:0 "Nós vamos acabar com isso!"
 news.bolivia.b:0 "Espero que eles possam se recuperar disso"
 
 ### Brasil ###
 brazil.1.t:0 "Oferta de cafezais para ajudar nossa economia"
 brazil.1.d:0 "Os proprietários de várias plantações de café concordaram e decidiram nos emprestar alguns de seus ativos ao nosso governo para nos ajudar em nossos projetos. \n\nSua ajuda será muito útil e pode nos dão apenas a quantia que precisamos para muitos de nossos projetos mais ambiciosos. Não parece que eles querem ser reembolsados, desde que permitamos que suas plantações prosperem sob nossa gestão."
 brazil.1.a:0 "Isso será de grande ajuda!"

 brazil.2.t:0 "Desenvolvimento Urbano destruiu uma de nossas plantações"
 brazil.2.d:0 "Chegou-nos a notícia de que o desenvolvimento urbano se expandiu tanto que destruiu uma plantação. Os proprietários dessa plantação estão muito furiosos com a 'negligência' da situação e exigem que restabeleçamos seus plantação e/ou reduzir nosso desenvolvimento urbano. \n\nNesta fase, precisamos industrializar nossa nação, portanto, recuar neste ponto não a reduzirá. Nossa dependência do café diminuirá, mas talvez seja para melhor."
 brazil.2.a:0 "Desculpe por isso..."

 brazil.3.t:0 "Plantação ilegal de café foi implantada"
 brazil.3.d:0 "Devido ao poder decrescente das plantações de café na economia do país, muitos começaram a estabelecer plantações ilegais em diferentes partes do país. Os proprietários dessas plantações ilegais parecem estar incomodados com nossa gestão de as plantações, e eles alegam que as temos tratado muito mal, então é por isso que eles decidiram protestar estabelecendo essas plantações ilegais. \n\nDevemos parar as pessoas por trás dessas plantações ilegais? Ou vamos deixar isso passar e ver o que leva?"
 brazil.3.a:0 "Deixe-os fazer isso"
 brazil.3.b:0 "Impedi-los de fazer isso"

 brazil.4.t:0 "Plantações se rebelam contra o governo"
 brazil.4.d:0 "Algumas das plantações, estabelecidas legal ou ilegalmente, começaram a se rebelar contra nosso governo desde nossa súbita mudança para uma economia industrializada. \n\nParece que nossa transição para uma economia industrializada irá não ser tão suave quanto parecia. Precisamos combater fogo com fogo e acabar com os rebeldes antes que seja tarde demais. \n\nNão há como dizer como isso vai acontecer, mas só temos que esperar pelo melhor."
 brazil.4.a:0 "Venceremos esta batalha!"

 brazil.5.t:0 "As plantações foram interrompidas com sucesso"
 brazil.5.d:0 "Depois de muitos meses de idas e vindas, conseguimos parar com sucesso as plantações rebeldes e acalmar a situação. Devido aos protestos em massa e repressão sangrenta, provavelmente nunca conseguiremos dependem do café, pelo menos por um longo tempo. \n\nO bom é que agora podemos nos concentrar totalmente na construção de nossa economia e no crescimento de nossa indústria. Se tudo correr bem, poderemos deixar esse terrível incidente para trás e olhar rumo a um novo e brilhante futuro."
 brazil.5.a:0 "Isso foi para melhor"

 brazil.6.t:0 "Agricultores concordaram com nosso acordo"
 brazil.6.d:0 "Os donos das plantações em nossa nação concordaram em permitir que nossa nação se industrialize a uma velocidade lenta e controlada, permitindo que suas plantações continuem prosperando enquanto nós industrializamos lentamente."
 brazil.6.a:0 "Vamos fazer crescer a nação juntos"

 brazil.7.t:0 "Os Agricultores Recusaram Nosso Acordo"
 brazil.7.d:0 "Os donos das plantações recusaram nosso acordo e nos disseram para não interromper seus negócios a todo custo. Parece que nossa transição para uma economia industrializada não será tão tranquila quanto parecia. "
 brazil.7.a:0 "Parece que teremos um novo inimigo"

 brazil.8.t:0 "Quanto você gostaria de investir nas Forças Armadas?"
 brazil.8.d:0 "Temos a opção de investir uma certa quantidade de nosso poder político sobre a nação na expansão do nosso exército. Alguns especialistas estão nos dizendo para investir pouco e aumentar com o tempo, enquanto outros estão nos dizendo para invista o máximo possível agora. \n\nDadas essas opções, qual devemos seguir?"
 brazil.8.a:0 "Invista um pouco"
 brazil.8.b:0 "Investir uma boa quantia"
 brazil.8.c:0 "Investir muito"

 brazil.9.t:0 "O Brasil está solicitando licença para produzir nossos tanques"
 brazil.9.d:0 "Políticos e generais brasileiros chegaram hoje a Washington D.C. para nos fazer um pedido. Eles estão solicitando acesso para produzir nossos tanques e alguns de nossos tanques. \n\nNossas relações com o Brasil e o Os brasileiros vêm melhorando nos últimos anos, e seu status dominante na América do Sul pode ser de grande importância estratégica para nós, especialmente no futuro, se nos encontrarmos em uma situação terrível. \n\nCom esses fatores em mente, devemos aceitar o seu pedido?"
 brazil.9.a:0 "Aceitar seu pedido"
 brazil.9.b:0 "Negar o pedido"

 brazil.10.t:0 "O Brasil está solicitando a compra de uma de nossas operadoras"
 brazil.10.d:0 "Os brasileiros notaram nossos modelos de porta-aviões e decidiram que poderiam fazer bom uso de um de nossos porta-aviões em sua própria marinha. \n\nDevemos permitir que eles comprem um de nossos porta-aviões?"
 brazil.10.a:0 "Sim"
 brazil.10.b:0 "Não"
 
 brazil.11.t:0 "Oponentes políticos protestam contra nossas campanhas de propaganda"
 brazil.11.d:0 "Vários funcionários e muitos de seus apoiadores retaliaram contra nosso aumento de influência sobre a esfera política da nação. Os protestos começaram a se espalhar pelo país enquanto milhares começam a alegar que estamos incrementando egoisticamente nossos próprios \n\nOs espinhos estão ficando cada vez maiores do nosso lado quanto mais tentamos cumprir nossa agenda política. Precisamos estar conscientes das escolhas que fazemos e das consequências que podem vir depois."
 brazil.11.a:0 "Eles não vão protestar por muito mais tempo"

 brazil.12.t:0 "[FROM.GetName] gostaria que invistamos em seu país"
 brazil.12.d:0 "[FROM.GetName] entrou em contato conosco recentemente, perguntando se estaríamos dispostos a investir na economia deles. Eles afirmam que nos beneficiaremos no longo prazo e nossa economia crescerá junto com a deles. \n\nDevemos investir algumas de nossas reservas em [FROM.GetName]?"
 brazil.12.a:0 "Sim, com certeza"
 brazil.12.b:0 "Não, não temos dinheiro sobrando"

 brazil.13.t:0 "[FROM.GetName] Investiu! Onde devemos colocar o dinheiro?"
 brazil.13.d:0 "Nossos funcionários relataram ótimas notícias, [FROM.GetName] aceitou nosso pedido e investiu uma boa soma de suas reservas em nossa economia. \n\nAgora cabe a nós decidir onde gostaríamos de investir esse dinheiro. \n\nCom essa escolha na palma de nossas mãos, onde devemos investir esse dinheiro?"
 brazil.13.a:0 "Invista nos Mercados Civis"
 brazil.13.b:0 "Invista nas Forças Armadas"
 brazil.13.c:0 "Invista na Marinha"
 brazil.13.e:0 "Investir na Infraestrutura e no Sistema Ferroviário"

 brazil.14.t:0 "[FROM.GetName] não aceitou nossa solicitação"
 brazil.14.d:0 "Infelizmente, [FROM.GetName] recusou nosso pedido de investir em nossa nação, dizendo que eles simplesmente não têm dinheiro suficiente para investir em nossa nação. outra hora."
 brazil.14.a:0 "Infeliz"

 brazil.15.t:0 "Vargas iniciou os preparativos para o estabelecimento de seu Estado Novo!"
 brazil.15.d:0 "Vargas começou oficialmente os preparativos para sua versão do Brasil, estabelecendo-se no centro do país e levando-o a seu gosto. \n\nNão se sabe muito sobre como ele vai conseguir tamanha façanha, por mais que muita gente esteja especulando um possível autogolpe para depor o Congresso e assumir o controle total da nação. Devemos estar cientes do que Vargas está planejando e precisamos ter certeza de que ele não atrapalhe o nosso caminho."
 brazil.15.a:0 "Nós vamos garantir que ele não faça isso!"

 brazil.16.t:0 "O Congresso Interveio em Nossos Planos"
 brazil.16.d:0 "O Congresso do Brasil percebeu nossas ações inéditas sobre o Estado e impôs várias reformas para tentar reduzir a influência sobre nossa nação. \n\nConsiderando o poder do Congresso neste momento, não muito pode ser feito, mas com esforço e tempo suficientes, podemos ser capazes de virar a maré."
 brazil.16.a:0 "Eles não poderão nos parar"

 brazil.17.t:0 "Congresso Intervém em Nossos Planos de Ditadura"
 brazil.17.d:0 "O congresso percebeu algumas de nossas ações estranhas e começou a estabelecer reformas em todo o país para atrasar o progresso de nossa ditadura. \n\nComo eles conseguiram descobrir nossos planos ainda é um mistério, mas precisamos estar cansados ​​de suas ações. Se eles promoverem muitas reformas, podemos estar com sérios problemas."
 brazil.17.a:0 "Reformas míseras não vão nos parar!"

 brazil.18.t:0 "Os comunistas estão planejando espalhar sua influência para outro estado"
 brazil.18.d:0 "Nossa cobertura de inteligência sobre a nação pegou a atividade subversiva comunista em um estado que não relatou nenhuma atividade anteriormente. Parece que os comunistas estão planejando se estabelecer totalmente lá. \n\nNós precisamos tentar detê-los antes que seja tarde demais."
 brazil.18.a:0 "Deixe eles pegarem, nós pegamos de volta depois"
 brazil.18.b:0 "Esses malditos comunistas não estão tomando mais um centímetro deste país!"

 brazil.19.t:0 "Os comunistas espalharam propaganda pelo país"
 brazil.19.d:0 "Os comunistas começaram a espalhar propaganda de massa sobre seu movimento para o povo do Brasil, especialmente nos estados onde a atividade subversiva está ativa atualmente. \n\nEles também estão visando muito os agricultores e a classe baixa , então precisamos ficar atentos nos estados onde temos plantações."
 brazil.19.a:0 "Táticas desprezíveis"
 
 brazil.20.t:0 "Os comunistas estão planejando causar estragos em um estado!"
 brazil.20.d:0 "Alguns de nossos espiões disfarçados relataram uma descoberta bastante assustadora: os comunistas estão planejando causar danos deliberadamente em um estado onde eles têm influência para fazer sua voz ser ouvida. \n\nPrecisamos ser muito cuidado, pois ainda não sabemos quão graves podem ser os danos. Devemos tentar detê-los o mais rápido possível."
 brazil.20.a:0 "Você está falando sério?"

 brazil.22.t:0 "Os integralistas aumentam sua influência sobre o país"
 brazil.22.d:0 "Usando algumas táticas bastante questionáveis, os integralistas aumentaram sua influência sobre a política deste país e estão começando a representar uma séria ameaça ao poder administrativo que temos sobre o país. \n\nPrecisamos tentar detê-los antes que fiquem muito poderosos. No mínimo, devemos nos certificar de mantê-los amigáveis ​​com nosso governo.
 brazil.22.a:0 "Eles não estão tramando nada..."

 brazil.23.t:0 "Congresso prepara reformas para controlar a nação de forma mais eficaz"
 brazil.23.d:0 "O Congresso anunciou oficialmente uma nova onda de reformas para o país e sua política, a fim de estabelecer uma presença ainda maior na nação. Isso vai atrapalhar alguns de nossos planos, e vai fazer com que a influência do congresso sobre o país para aumentar. \n\nCuide do que for preciso, precisamos garantir que o congresso não faça isso com frequência, para que possamos continuar adequadamente com nossos planos."
 brazil.23.a:0 "Aborrecimento Pesky"

 brazil.24.t:0 "Nossos espiões combateram com sucesso os comunistas"
 brazil.24.d:0 "Nossos espiões voltaram com algumas notícias fantásticas, eles conseguiram reprimir o caso e prender os comunistas que estavam ocupando o estado. \n\nCom uma vitória tão importante, o movimento comunista está com certeza levaremos um grande golpe com isso. Só precisamos pressionar um pouco mais e poderemos lidar completamente com os comunistas."
 brazil.24.a:0 "Esta é uma notícia fantástica!"

 brazil.25.t:0 "Nossos espiões foram combatidos"
 brazil.25.d:0 "Infelizmente, nossos espiões foram derrotados pelos comunistas enquanto tentavam deter a atividade subversiva comunista. \n\nEsta foi uma grande derrota e uma completa humilhação. Os comunistas provavelmente tirarão o máximo proveito dessa derrota para usá-lo contra nós. \n\nTudo o que resta é esperar que possamos parar o que vier a seguir."
 brazil.25.a:0 "Isso é terrível!"

 brazil.26.t:0 "Os integralistas esperam a nomeação de Plínio Salgado"
 brazil.26.d:0 "Os Integralistas até agora têm apoiado nossos esforços para estabelecer uma regra mais autoritária e, por isso, esperam que nomeemos Plínio Salgado como ministro da educação. \n\nFaçamos ou não isso depende de nós, e cada uma de nossas escolhas terá pontos positivos e negativos."
 brazil.26.a:0 "Por enquanto veremos"

 brazil.27.t:0 "Os Integralistas ocuparam um de nossos Estados!"
 brazil.27.d:0 "Relatórios locais nos informaram que os integralistas começaram a ocupar militarmente um de nossos estados para estabelecer o domínio sobre a esfera política brasileira."
 brazil.27.a:0 "Maldito seja tudo para o inferno!"

 brazil.28.t:0 "Os integralistas cheiram a destruição em um de seus estados ocupados"
 brazil.28.d:0 "Os integralistas decidiram demolir um dos estados que ocupam como um ato de resistência contra nosso governo. \n\nSe continuarem com esses flagrantes atos de terrorismo, haverá sérias consequências."
 brazil.28.a:0 "Malditos bastardos"

 brazil.29.t:0 "Participantes Integralistas Iniciam Protestos em Todo o País"
 brazil.29.d:0 "Os integralistas tomaram as ruas de todo o país para protestar contra a repressão de seu movimento e da administração do nosso país. Plínio Salgado e Gustavo Barroso são os líderes desses protestos e estão tentando propositalmente para desestabilizar a nação. \n\nEsses protestos devem parar imediatamente e os líderes devem ser presos. Se esses protestos continuarem, podemos estar com sérios problemas."
 brazil.29.a:0 "Abaixo o Integralismo!"
 
 brazil.30.t:0 "Os integralistas intensificam sua revolta"
 brazil.30.d:0 "Usando várias táticas baratas de propaganda e influência sobre a nação, os integralistas intensificaram sua revolta e estão fazendo planos completos para a guerra civil que está por vir. \n\nPrecisamos estar bem preparados para este conflito, todos os nossos homens devem ser recrutados no caso de uma guerra civil total."
 brazil.30.a:0 "Vamos torcer para que possamos parar com isso"

 brazil.31.t:0 "Carlos Prestes foi preso"
 brazil.31.d:0 "O revolucionário comunista Carlos Prestes foi pego e preso por nossas autoridades. Isso será um grande golpe para o movimento comunista e certamente os afetará nos próximos anos. \n\nIsso não será uma vitória completamente tranquila, pois os comunistas provavelmente farão um último esforço para retaliar a prisão de Prestes, mas sem seu líder deveríamos ser capazes de lidar com isso rapidamente."
 brazil.31.a:0 "Ótimo!"

 brazil.33.t:0 "Prestes inicia planos para uma revolta"
 brazil.33.d:0 "Depois de trabalhar nas sombras por algum tempo, os comunistas começaram a planejar uma revolta em grande escala para vingar a tentativa fracassada de 1935. \n\nDiferente da última vez, desta vez parece ser muito mais organizado, e a quantidade de pessoas que apoiam Prestes é muito maior do que a tentativa de 1935. Precisamos ter cuidado aqui, um movimento errado pode nos custar muito."
 brazil.33.a:0 "Eles serão esmagados!"

 brazil.35.t:0 "Os cafeicultores hostis falam contra o nosso partido"
 brazil.35.d:0 "Os cafeicultores furiosos tomaram o campo para protestar e falar contra o nosso partido. Eles exigem que lhes dêmos mais representação política e invistamos mais recursos nos cafezais."
 brazil.35.a:0 "Não precisamos disso agora"

 brazil.36.t:0 "As plantações de café hostis boicotaram seus lucros"
 brazil.36.d:0 "As plantações de café hostis se uniram e boicotaram nossa economia impedindo que seus lucros chegassem ao governo nacional. Esse ato de protesto está provando ser prejudicial à nossa economia e devemos lidar com eles o mais rápido possível. posso."
 brazil.36.a:0 "Eles serão colocados em seu lugar!"

 brazil.37.t:0 "Vargas Suprimiu nosso Movimento"
 brazil.37.d:0 "Vargas percebeu nosso movimento ganhando força entre o povo, então ele e seus membros do gabinete decidiram adotar uma abordagem mais política. Vargas difamou publicamente nosso movimento e fez movimentos para suprimir nossa capacidade de espalhar nossa movimento para outros lugares do país. \n\nEsse governo tirânico vai desmoronar e Vargas vai pagar pelo que fez!"
 brazil.37.a:0 "Bem dito companheiro torcedor. Vargas vai cair!"

 brazil.38.t:0 "Vargas desestabiliza nossos planos"
 brazil.38.d:0 "Com táticas de escumalha, Vargas interferiu em nossos planos e desestabilizou até certo ponto nossa revolta. Por isso, precisamos acelerar nossos planos para compensar esse contratempo."
 brazil.38.a:0 "Podemos lidar com um retrocesso"

 brazil.39.t:0 "Os comunistas em [FROM.GetName] querem nosso apoio em sua revolta"
 brazil.39.d:0 "Agentes disfarçados de [FROM.GetName] vieram à nossa sede para pedir apoio em seu levante contra a 'opressão de Vargas e seu regime autoritário'. \n\nEles afirmam que possuímos o que eles precisamos ter uma revolta camponesa bem sucedida contra o atual governo e estaremos dispostos a reembolsar integralmente nossas contribuições para o levante. \n\nDevemos prestar nossa ajuda a eles?"
 brazil.39.a:0 "Esta é a nossa chance de ouro, vamos ajudá-los"
 brazil.39.b:0 "Não podemos ajudar neste momento"

 brazil.40.t:0 "[FROM.GetName] concordou em nos ajudar"
 brazil.40.d:0 "Nossos agentes disfarçados voltaram com excelentes notícias! Eles disseram que [FROM.GetNameDEF] vai nos ajudar em nossa revolta, e vai nos fornecer o que precisarmos, desde que paguemos."
 brazil.40.a:0 "Perfeito"
 
 brazil.41.t:0 "[FROM.GetName] se recusou a nos ajudar"
 brazil.41.d:0 "Nossos agentes disfarçados voltaram de [FROM.GetName] com notícias comoventes. Eles disseram que não vão nos ajudar em nossa revolta contra a governo."
 brazil.41.a:0 "Isso é terrível!"

 brazil.42.t:0 "Vargas descobriu sobre nossa atividade e interferiu!"
 brazil.42.d:0 "Vargas tomou conhecimento de nossa atividade por meios que ainda não conhecemos. Nossos homens foram presos realizando esta tarefa e nossos planos gerais foram contrariados devido a isso. \n\nNós preciso ter mais cuidado no futuro próximo, senão Vargas pode ficar sabendo de todos os nossos planos."
 brazil.42.a:0 "Ele vai pagar por isso!"

 brazil.43.t:0 "Vargas foi assassinado"
 brazil.43.d:0 "Rádios em todo o país começaram a enlouquecer, pois os relatórios confirmaram que Vargas foi assassinado pelo que parece ser um grupo terrorista não identificado. \n\nAs consequências deste evento de partir o coração já começaram, como pessoas em todo o país começaram protestos em massa, a maioria violentos e levando a tiros. \n\nA nação está entrando em colapso enquanto falamos, por favor, se alguém estiver lendo isso, fique seguro, fique em casa e tenha cuidado com quem você Eles podem ser um aliado ou um inimigo esperando para atacar!"
 brazil.43.a:0 "Nossa hora chegou"

 brazil.44.t:0 "Falha na tentativa de assassinato de Vargas"
 brazil.44.d:0 "Chegaram hoje notícias de que houve uma tentativa de assassinato contra Vargas. O grupo responsável por isso foi identificado como parte do Partido Comunista do Brasil. \n\nSuas intenções, no entanto, ainda são uma mistério para o público e o governo. Qualquer que seja o objetivo final, Vargas anunciou oficialmente uma guerra de pleno direito contra os comunistas dentro do país e vai 'erradicá-los' da nação custe o que custar."
 brazil.44.a:0 "Droga! Isso não saiu como esperado!"

 brazil.45.t:0 "Separatistas Paulistas Começam a Pegar em Armas"
 brazil.45.d:0 "Com a nação em estado de guerra interna e caos, os sentimentos nacionalistas dentro de São Paulo começaram a crescer exponencialmente, e alguns até começaram a pegar em armas para se tornar uma nação soberana. \n\nA As implicações que isso causará ainda estão em debate, mas agora temos que lidar com essa questão em mãos."
 brazil.45.a:0 "Isso não é bom"

 brazil.46.t:0 "Os integralistas começaram a se armar"
 brazil.46.d:0 "À medida que nossa nação cai cada vez mais na anarquia, os integralistas começaram a pegar em armas e se organizar. \n\nPelo que parece, eles estão planejando uma revolta em grande escala e aproveitam o desastre que é o Brasil atualmente. \n\nDevemos estar cansados ​​do que eles fazem, afinal sua revolta pode fazer pender a balança desta guerra, para melhor ou para pior."
 brazil.46.a:0 "Nós vamos esmagá-los!"

 brazil.47.t:0 "Os Integralistas Fortaleceram sua Revolta"
 brazil.47.d:0 "Relatos de alguns de nossos apoiadores disfarçados nos informaram sobre vários planos dos integralistas para aumentar a força de seu levante. Eles querem vencer esta guerra civil não importa o que aconteça, e o farão por qualquer meios necessários. \n\nTemos que nos preparar para a revolta deles, só Deus sabe quando eles atacarão e quantos homens apoiarão seus ideais."
 brazil.47.a:0 "Eles ainda vão perder!"

 brazil.48.t:0 "Os integralistas venceram as eleições"
 brazil.48.d:0 "Os votos foram contados e os resultados foram divulgados. Os integralistas saíram na frente na contagem de votos e tomarão posse a partir de hoje. \n\nO mundo está chocado com este resultado , pois ninguém esperava que o partido fascista no Brasil saísse por cima. Diplomatas alemães e italianos já estão parabenizando os integralistas pela vitória, e o povo está comemorando nas ruas."
 brazil.48.a:0 "É a nossa hora de brilhar"

 #Adicione mais
 brazil.48.t:0 "Os integralistas venceram as eleições"
 brazil.48.d:0 "Os votos foram contados e os resultados foram divulgados. Os integralistas saíram na frente na contagem de votos e tomarão posse a partir de hoje. \n\nO mundo está chocado com este resultado , pois ninguém esperava que o partido fascista no Brasil saísse por cima. Diplomatas alemães e italianos já estão parabenizando os integralistas pela vitória, e o povo está comemorando nas ruas."
 brazil.48.a:0 "É a nossa hora de brilhar"

 #adicionar mais talvez
 brazil.49.t:0 "José Américo venceu a eleição"
 brazil.49.d:0 "Já foram apurados os votos e saiu o resultado. José Américo de Almeida saiu na frente na contagem de votos e tomará posse a partir de hoje. \n\nSendo apoiado por Vargas, Américo promete não mudar muito no país e melhorar ainda mais o país. Com o mundo queimando rapidamente, ele também prometeu permanecer totalmente neutro no caso de um conflito global."
 brazil.49.a:0 "O povo falou"
 
 brazil.50.t:0 "O Partido da União Democrática ganhou as eleições"
 brazil.50.d:0 "os votos foram apurados e os resultados saíram. A União Democrática Brasileira, liderada por Armando de Sales Oliveira, ganhou oficialmente e tomará posse a partir de hoje. \n\nO oeste está muito satisfeito com os resultados e temos recebido cartas de felicitações do Reino Unido, França e Estados Unidos."
 brazil.50.a:0 "O povo foi ouvido"
 
 brazil.51.t:0 "[FROM.GetName] quer que nós os ajudemos na Guerra Civil"
 brazil.51.d:0 "Diplomatas de [FROM.GetName] nos perguntaram se poderíamos ajudá-los de alguma forma na Guerra Civil Brasileira. \n\nDevemos ajudá-los?"
 brazil.51.a:0 "Sim"
 brazil.51.b:0 "Não"
 
 brazil.52.t:0 "[FROM.GetName] concorda em ajudar!"
 brazil.52.d:0 "[FROM.GetName] concordou em nos ajudar e em breve enviará ajuda de todas as formas possíveis."
 brazil.52.a:0 "Perfeito!"
 
 brazil.53.t:0 "[FROM.GetName] Recusa"
 brazil.53.d:0 "[FROM.GetName] se recusou a nos ajudar, afirmando que não está apto para fazê-lo no momento"
 brazil.53.a:0 "Infeliz"
 
 brazil.54.t:0 "[FROM.GetName] Envia Equipamento!"
 brazil.54.d:0 "[FROM.GetName] nos enviou equipamento de infantaria como meio de nos ajudar em nossos esforços!"
 brazil.54.a:0 "Qualquer ajuda é muito apreciada"
 
 brazil.55.t:0 "[FROM.GetName] Envia Títulos de Guerra!"
 brazil.55.d:0 "[FROM.GetName] nos enviou títulos de guerra para ajudar nossa economia durante nossa luta na guerra!"
 brazil.55.a:0 "Qualquer ajuda é muito apreciada"
 
 brazil.56.t:0 "[FROM.GetName] Envia Voluntários!"
 brazil.56.d:0 "[FROM.GetName] nos enviou forças voluntárias para nos ajudar na guerra civil. Eles declararam que estaremos no comando de seus homens!"
 brazil.56.a:0 "Qualquer ajuda é muito apreciada"
 
 brazil.57.t:0 "A guerra finalmente terminou!"
 brazil.57.d:0 "Depois de muitos e muitos meses de luta, sangue, caos, morte, a nação finalmente foi unificada sob uma única bandeira. A história lembrará para sempre esta guerra civil como uma das mais mortais conhecidas pelo homem, com milhões de soldados servindo no total. \n\nAs pessoas começaram a aplaudir nas ruas destruídas, e muitos soldados choraram de alegria porque agora podem se reunir com suas famílias. \n\nTemos um longo caminho pela frente de nós, e muitos problemas para lidar, mas vamos conseguir sobreviver e nos tornar um Brasil que ninguém jamais sonhou!"\
 brazil.57.a:0 "Que esta paz recém-descoberta seja eterna"
 
 brazil.58.t:0 "Um jovem com um grande sonho"
 brazil.58.d:0 "Basil dos Santos, jovem que vive nas fazendas do Rio de Jainero com seu caseiro. Frequentemente visita seu grupo de amigos que moram em uma aldeia próxima, e antes do início do processo civil guerra, ele geralmente era visto cuidando das plantações de café ao redor de sua casa. \n\nIsso tudo mudou, no entanto, quando os comunistas começaram a trabalhar clandestinamente para derrubar o governo, e alguns desses soldados vieram a Basílio para pedir-lhe ajuda com escondendo armas dentro das plantações. Assustado, Basílio obedeceu e começou a escondê-los, no entanto, os soldados ficaram impressionados com sua velocidade e eficiência, e rapidamente reconheceram o jovem adolescente como um prodígio. A notícia de sua ajuda já se espalhou por todos os comunistas, e o agricultores também”.
 brazil.58.a:0 "Muitos têm sonhos, o que torna o dele tão especial?"
 brazil.58.b:0 "Intrigante, devemos ficar de olho nele"
 
 brazil.59.t:0 "O manjericão ganha o apoio dos fazendeiros!"
 brazil.59.d:0 "O menino e sua visão foram inicialmente vistos apenas como isso, uma visão de criança. No entanto, essa visão parece ter pegado um certo grupo de pessoas em nosso estado: os agricultores. o país foi fascinado por sua visão e parece achar sua inexperiência juvenil mais cativante do que um obstáculo. Por enquanto, parece que Basílio ganhou status de celebridade entre os agricultores, mas não há dúvida de que sua influência se espalhará ainda mais por nossa nação Vendo que suas casas desabam e sua vida cotidiana não existe mais, muitos fazendeiros começaram a torcer por Basílio, alguns já o proclamando como o salvador do Brasil e de seu povo."
 brazil.59.a:0 "Por que eles cuidam de uma criança miserável?"
 brazil.59.b:0 "Um desenvolvimento interessante"
 
 #mudar o parlamento com o que for
 brazil.60.t:0 "O Povo Exige a posse imediata de Basílio!"
 brazil.60.d:0 "A manhã calma de hoje foi abruptamente interrompida pelo som de milhares de homens, mulheres e crianças protestando na sede comunista em [ROOT.GetCapitalVictoryPointName] com uma simples exigência: eles desejam a renúncia imediata de [ BRA.GetLeader] e a posse de Basílio. O que antes era uma mera criança que só queria tornar seu sonho realidade, agora se tornou um movimento político com um poder monumental em [BRA.GetName], e esse poder acenou para nossos cooperação. \n\nAs pessoas não vão parar de cantar o nome de Basil, e agora que as baixas estão aumentando, precisamos tomar uma decisão e rápido!"
 brazil.60.a:0 "Eles estão loucos? Uma decisão infantil é absurda!"
 brazil.60.b:0 "O povo falou e nós ouviremos de acordo..."
 
 brazil.61.t:0 "[FROM.GetName] Exige nossa submissão!" #Pode estar errado, talvez use FROM ou BRA
 brazil.61.d:0 "[FROM.GetName] está exigindo nossa submissão imediata! Eles já alinharam milhares de soldados em nossa fronteira e esperamos uma resposta nossa em breve. \n\nO que devemos fazer?"
 brazil.61.a:0 "Nós realmente temos uma escolha no assunto?"
 brazil.61.b:0 "Independência ou morte!"
 
 brazil.62.t:0 "[FROM.GetName] Cede às nossas Demandas!"
 brazil.62.d:0 "[FROM.GetName] concordou em se tornar nosso súdito, e a partir de hoje teremos poder administrativo sobre a maior parte de sua nação."
 brazil.62.a:0 "Eles fizeram a escolha correta."
 
 brazil.63.t:0 "[BRA.GetName] está invadindo [URG.GetName]!"
 brazil.63.d:0 "Repórteres vieram em bando à Casa Rosada hoje, suando profusamente e gritando '[BRA.GetName] esta invadiendo Uruguai!'. Esta informação é algo que ninguém jamais esperaria, e ainda está acontecendo como falamos agora mesmo. \n\n[BRA.GetName] está fazendo algo atroz agora, e o Uruguai não tem chance de derrotá-los. Com nosso irmão em perigo, devemos intervir e parar os traficantes de guerra?"
 
 brazil.64.t:0 "[ARG.GetName] decidiu intervir em nossa reclamação de [URG.GetName]"
 brazil.64.d:0 "Nossos diplomatas nos notificaram que [ARG.GetName] está intervindo oficialmente e apoiará totalmente os uruguaios neste conflito."
 brazil.64.a:0 "Eles vão se arrepender de ter se juntado a esta guerra!"
 
 brazil.65.t:0 "Faça as pazes com [BRA.GetName]?"
 brazil.65.d:0 "Perdemos muitos homens nesta guerra inútil. Nossos soldados não aguentam mais, o povo está protestando nas ruas exigindo que saiamos da guerra. \n\nO que devemos fazer? "
 brazil.65.a:0 "Chega de derramamento de sangue"
 brazil.65.b:0 "Nenhuma paz pode ser feita com monstros"

 brazil.66.t:0 "Quem nos guiará"
 brazil.66.d:0 "Temos poucas opções, esta será uma escolha muito difícil. Há muitos bons líderes à nossa disposição, dispostos a dar tudo para liderar o país e melhorá-lo da maneira que puder. \n\nEnquanto falamos, os votos foram contados e as pessoas escolheram como líder..."
 brazil.66.a:0 "[ROOT.GetLíder]"
 brazil.66.b:0 "O Congresso"
 brazil.66.c:0 "Armando Sales"
 brazil.66.e:0 "Luis Washington"
 brazil.66.f:0 "José Américo"
 brazil.66.g:0 "Afrânio de Melo"

 brazil.67.t:0 "Um pedido de socorro brasileiro"
 brazil.67.d:0 "Os integralistas brasileiros pedem ajuda em sua próxima revolta que estão encenando. Eles alegam que precisam de nossa ajuda para melhorar suas chances de derrubar o governo. \n\nTemos duas opções, venha em seu auxílio , ou deixá-los ser"
 brazil.67.a:0 "Aceitar seu pedido"
 brazil.67.b:0 "Negar o pedido"
 
 brazil.68.t:0 "A tentativa de assassinato de Prestes é bem-sucedida"
 brazil.68.d:0 "O Partido Comunista está enlouquecendo, organizando protestos em massa em todo o país, exigindo uma explicação do governo sobre o assassinato de Prestes. \n\nTodo mundo está lutando para encontrar uma explicação para isso, o que é exatamente o que esperávamos. Agora os comunistas não terão chance de se rebelar sem um líder adequado, e o país só se desestabilizou ainda mais como resultado."
 brazil.68.a:0 "Exatamente como planejado"
 
 brazil.69.t:0 "A tentativa de assassinato de Prestes falhou"
 brazil.69.d:0 "O trecho do jornal diz 'Uma alegria para o Partido Comunista hoje, pois um assassino de origem desconhecida foi enviado para matar Prestes e foi baleado antes que eles pudessem chegar a Prestes. Os seguidores do Partido Comunista estão em armas e estão extremamente zangados.` \n\nNossos planos falharam, e as pessoas estão chocadas. Felizmente nosso assassino foi capaz de manter sua identidade em segredo, o único problema é que não temos certeza se isso permanecerá em segredo por muito tempo."
 brazil.69.a:0 "Merda! MERDA! Isso não é bom!"

 brazil.70.t:0 "O Plano Comunista de Revolta"
 brazil.70.d:0 "Agentes disfarçados nos informaram que os comunistas estão recuperando armas eletrônicas de dentro das plantações de café e armando milícias. A julgar pela situação atual do país, não há dúvida de que eles estão planejando uma revolta em grande escala para tentar se estabelecer como os líderes do país. \n\nFaçamos o que fizermos, não podemos deixar isso acontecer, e devemos fazer tudo ao nosso alcance para tentar derrotá-los o mais rápido possível."
 brazil.70.a:0 "Esses bastardos não vão sobreviver um mês!"

 brazil.71.t:0 "A Questão Real"
 brazil.71.d:0 "A família real tem sido questionada se eles são necessários. Seu papel no país mudou desde a dissolução do Império, e eles podem até colocar um espinho em nosso lado considerando os ideais opostos. \n\nDevemos deportá-los deste país, dar-lhes mais funções no governo ou deixá-los em paz?"
 brazil.71.a:0 "Deportá-los"
 brazil.71.b:0 "Dê-lhes funções no Governo"
 brazil.71.c:0 "Deixe-os ficar"

 brazil.72.t:0 "Patrianovistas Oferecem Apoio no Desprendimento Integralista"
 brazil.72.d:0 "Os Patrianovistas nos ofereceram apoio em nosso levante. Eles reconhecem nossos ideais divergentes, mas estão dispostos a deixar de lado nossas diferenças e nos ajudar em nossos esforços contra Vargas. \n\nDevemos aceitar ou Negar?"
 brazil.72.a:0 "Vamos levar tudo o que ajudar"
 brazil.72.b:0 "Estamos bem sozinhos!"
 
 brazil.73.t:0 "O [BZE.GetName] solicita nossa ajuda!"
 brazil.73.d:0 "Os [BZE.GetName] estão pedindo ajuda em sua guerra civil. Eles estão planejando uma revolta em grande escala para restaurar a monarquia no país, e com a atual situação política no país , eles acreditam que é a oportunidade perfeita para fazê-lo. \n\nDevemos ajudá-los?"
 brazil.73.a:0 "Claro, qualquer coisa para ajudá-los"
 brazil.73.b:0 "Não podemos fazer isso agora"

 brazil.74.t:0 "O [BZE.GetName] quer que intervenhamos na Guerra Civil!"
 brazil.74.d:0 "Os imperialistas brasileiros estão pedindo que intervenhamos totalmente na guerra civil e os ajudemos em seus esforços contra as outras facções. \n\nDevemos intervir e ajudá-los? Ou devemos deixá-los por vontade própria?"
 brazil.74.a:0 "Hora de ajudar nossos irmãos!"
 brazil.74.b:0 "Desculpe, mas não"

 brazil.75.t:0 "Uma revolta uruguaia fracassada"
 brazil.75.d:0 "Os monarquistas no Uruguai não conseguiram ter sucesso em seu levante. \n\nVamos assumir o controle ou deixá-los em paz."
 brazil.75.a:0 "Para a Guerra"
 brazil.75.b:0 "Agora não é a hora"

 brazil.76.t:0 "Uma chance de atacar"
 brazil.76.d:0 "Temos a chance de atacar [BRA.GetName]. Eles se encontraram em uma guerra com Argentina e Uruguai ao mesmo tempo, e suas forças estão todas concentradas em sua fronteira, enquanto nossa fronteira é completamente vazio. \n\nVamos arriscar ou não é a hora?"
 brazil.76.a:0 "Aproveite nossas chances"
 brazil.76.b:0 "Não podemos permitir uma guerra neste momento"

 brazil.77.t:0 "Unificação com o Brasil"
 brazil.77.d:0 "Os brasileiros ofereceram uma unificação de nossos territórios. Se aproveitarmos essa chance, podemos nos tornar uma potência imparável e uma verdadeira ameaça para aqueles que consideramos inimigos. \n\nDevemos"
 brazil.77.a:0 "Sim, vamos unificar"
 brazil.77.b:0 "Não, não vamos unificar"

 brazil.78.t:0 "Portugal recusa-se a unificar"
 brazil.78.d:0 "Os portugueses recusaram nosso pedido de unificação e não tomaram nenhuma decisão para mudar seus modos."
 brazil.78.a:0 "Droga tudo."

 brazil.79.t:0 "Revolta do Uruguai"
 brazil.79.d:0 "A revolta uruguaia começou, e nosso domínio imperial está agora lutando contra o governo uruguaio. \n\nHora de intervir e lidar com a situação. Assim que limparmos o Uruguai, vamos integrá-lo para o Império mais uma vez."
 brazil.79.a:0 "Entendido"

 brazil.80.t:0 "O País estava convencido do Plano Cohen"
 brazil.80.d:0 "O povo, o congresso e o exército estavam todos convencidos do Plano Cohen. Graças a isso, o congresso nos dará ainda mais poder sobre esse golpe inventado para liderar com mão de ferro."
 brazil.80.a:0 "Perfeito"
 
 brazil.81.t:0 "Integralistas tentando um último esforço"
 brazil.81.d:0 "Conseguimos obter informações sobre os planos de um último esforço dos integralistas para colocar Plínio no poder. Também pudemos saber que eles estão planejando um ataque total ao Palácio da Guanabara . \n\nPrecisamos ter cuidado com o próximo movimento deles. Pode atrapalhar todos os nossos planos se as coisas derem errado."
 brazil.81.a:0 "Esses malditos bastardos!"

 brazil.82.t:0 "[BRA.GetName] nos propõe um plano"
 brazil.82.d:0 "[BRA.GetName] entrou em contato conosco, dizendo que eles têm um plano na manga. Eles não apenas querem se juntar à nossa facção e nos ajudar em nossa guerra contra os aliados, mas também querem criar uma nova frente na América do Sul invadindo o Uruguai. \n\nEmbora o plano pareça arriscado, certamente desvia a atenção dos aliados da Europa para a América do Sul, agora que suas posses estarão em risco. Devemos concordar com o plano deles? "
 brazil.82.a:0 "Vamos deixá-los entrar quando lançarem o ataque"
 brazil.82.b:0 "Não podemos bancar outra frente"

 brazil.83.t:0 "[BRA.GetName] Gostaria de comprar nossas colônias na África"
 brazil.83.d:0 "Diplomatas brasileiros chegaram hoje à nossa nação para nos propor uma oferta. Eles estariam dispostos a pagar uma grande soma de dinheiro por nossas terras na África. Eles também prometem manter relações positivas conosco e defender nós no caso de uma invasão estrangeira. \n\nDevemos aceitar a oferta?"
 brazil.83.a:0 "Claro, eles podem ter"
 brazil.83.b:0 "Absolutamente não"

 brazil.84.t:0 "[FROM.GetName] gostaria de comprar nossas posses sul-americanas"
 brazil.84.d:0 "Diplomatas de [FROM.GetName] vieram a [ROOT.GetName] para pedir nossas posses sul-americanas ao norte de seu território. Eles estão dispostos a pagar uma grande soma de dinheiro por tais posses. \n\nDevemos aceitar?"
 brazil.84.a:0 "Claro, eles podem tê-los"
 brazil.84.b:0 "Absolutamente não"

 brazil.85.t:0 "[BRA.GetName] está exigindo um referendo democrático em nossa nação"
 brazil.85.d:0 "Diplomatas brasileiros vieram ao [ROOT.GetName], exigindo que façamos um referendo democrático e deixemos o povo escolher. Eles nos alertaram que haverá consequências terríveis se não fizermos o referendo. \n\nDevemos ceder ou nos manter firmes?"
 brazil.85.a:0 "Nós vamos ceder"
 brazil.85.b:0 "ELES NÃO VÃO SE SAIR COM ISSO!"

 brazil.86.t:0 "Devemos nos Unificar com as Repúblicas Unidas da América Latina?"
 brazil.86.d:0 "Fomos informados de que as Repúblicas Unidas da América Latina estão formadas e nos perguntam se queremos nos unir ao sindicato. Eles já nos garantiram que estaremos devidamente representados no sindicato. \n\nEntão, devemos nos unir e nos tornar uma superpotência juntos?"
 brazil.86.a:0 "Vamos fazer isso"
 brazil.86.b:0 "Nunca!"

 brazil.87.t:0 "Portugal está tentando ressuscitar a monarquia!"
 brazil.87.d:0 "Os espiões portugueses capturados confessaram que o governo português está planejando instigar uma revolta imperial em grande escala dentro da nação. Precisamos ter muito cuidado com seu próximo movimento, pois isso pode afetar muito o curso do a guerra."
 brazil.87.a:0 "ESSES MALDITOS BASTARDOS!"

 brazil.88.t:0 "Portugal estará nos ajudando em nossos esforços imperiais"
 brazil.88.d:0 "Espiões portugueses chegaram secretamente ao nosso quartel-general para nos informar que temos total apoio da monarquia portuguesa e das suas forças. Se necessitarmos de assistência, basta perguntarmos e eles responderão."
 brazil.88.a:0 "Isso é ótimo!"

 brazil.89.t:0 "Vamos Lançar o Ataque ao Palácio Guanabara?"
 brazil.89.d:0 "Nossos membros leais nos informaram que todas as peças estão no lugar para nosso ataque ao Palácio Guanabara. Assim que fizermos isso, a guerra civil começará oficialmente, pois nossas forças se organizarão e assumirão vários estados no sul do Brasil. \n\nVamos lançar o ataque agora ou esperar um pouco?"
 brazil.89.a:0 "Vamos fazer isso!"
 brazil.89.b:0 "Ainda não estamos prontos"

 brazil.90.t:0 "Vários generais inimigos vieram para o nosso lado"
 brazil.90.d:0 "Depois de sua derrota na guerra civil e de largar as armas, alguns de seus generais vieram até nós para oferecer seu apoio em nosso lado do conflito e levar o Brasil a uma era maior."
 brazil.90.a:0 "Ótimo!"
 
 news.361.t:0 "Revolta Integralista no Brasil"
 news.361.d:0 "O mundo só poderia ficar admirado com o desmoronamento das esferas políticas e sociais brasileiras com a revolta integralista no país. Os integralistas ganharam apoio maciço para seu movimento, usando os erros de líderes atuais e passados ​​para abasteça seu partido e cresça em apoio. \n\nEnquanto falamos, muitas batalhas já estão surgindo em todo o país, e a maioria acredita que o Brasil chegará a um estado de pura guerra interna. Os especialistas já estão prevendo que esta será uma das mais mortais guerras civis conhecidas pelo homem, e está apenas começando."
 news.361.a:0 "Vamos vencer!"
 news.361.b:0 "Eles não vão se safar com isso!"
 news.361.c:0 "Jesus Cristo"

 news.362.t:0 "Revolta Paulista no Brasil"
 news.362.d:0 "Como se a situação no Brasil não pudesse piorar, a inteligência já confirmou que uma revolta paulista explodiu totalmente dentro da nação. Os paulistas viram o estado fraco do Brasil como uma oportunidade para conquistar oficialmente a independência deles. \n\nParece que eles conseguiram reunir um exército bastante grande para combater as outras facções brasileiras e estão dispostos a lutar até o fim por sua independência. \n\nSó o tempo dirá como será a guerra civil brasileira evoluir, mas até agora não está parecendo bonito."
 news.362.a:0 "Nós vamos ganhar nossa independência!"
 news.362.b:0 "Eles não vão ganhar merda nenhuma!"
 news.362.c:0 "Está ficando cada vez pior"

 news.363.t:0 "Revolta Comunista no Brasil"
 news.363.d:0 "O mundo não pode fazer nada além de ver o Brasil cair no puro caos. O Partido Comunista no país organizou uma revolta em grande escala para derrubar o governo e se estabelecer como os verdadeiros líderes do Brasil . \n\nPelo que parece, a grande maioria de seu apoio vem dos agricultores do país e da classe baixa. Eles também foram capazes de formar grandes quantidades de milícias para serem os vencedores da guerra civil. \n\nBatalhas já entraram em erupção, e os corpos estão se acumulando enquanto falamos."
 news.363.a:0 "Nós vamos vencer!"
 news.363.b:0 "Eles não vão se safar com isso!"
 news.363.c:0 "Jesus Cristo"

 news.364.t:0 "Insurreição Democrática no Brasil"
 news.364.d:0 "A guerra civil brasileira continua a escalar à medida que as pessoas decidem que já estão fartas e lançam um levante para restabelecer a democracia na nação. Eles estão fazendo isso sob o nome dos Estados Unidos Estados do Brasil, um país de vida muito curta com o nome do Brasil na década de 1870. Eles optaram por reviver essa república de curta duração para contrastar com todas as outras ideologias extremistas na guerra civil, e de uma vez por todas acabar com a guerra civil \n\nQuem vai ganhar nesta guerra civil ainda está em debate, mas o que é certo é que eles terão um longo caminho a percorrer antes que possam realmente consertar a nação."
 news.364.a:0 "OUTRA FACÇÃO?!"
 news.364.b:0 "Eles serão esmagados em breve"
 news.364.c:0 "A democracia voltará!"

 news.365.t:0 "Revolta Imperial na Guerra Civil Brasileira"
 news.365.d:0 "A partir de hoje, foi confirmado que uma facção imperialista, com o apoio dos Patrianovistas, lançou um ataque em grande escala contra as outras facções na guerra civil, com o objetivo principal de restaurar o trono imperial e recolocar a família real em seu 'lugar certo'. \n\nNão se sabe muito sobre esta revolta, e alguns suspeitam que Portugal possa ter tido algum tipo de envolvimento com a ajuda aos imperialistas. \n\nO guerra civil parece que não vai acabar tão cedo."
 news.365.a:0 "SÓ NÃO PARA"
 news.365.b:0 "Ótimo, exatamente o que precisávamos..."
 news.365.c:0 "Glória à Família Real!"
 news.365.e:0 "Agora isso é interessante"

 news.366.t:0 "Portugal Intervém na Guerra Civil Brasileira"
 news.366.d:0 "O mundo foi lançado em um ataque incontrolável quando fontes de notícias confirmaram que Portgual entrou oficialmente na guerra civil brasileira, ajudando os imperialistas em sua guerra civil. Os Estados Unidos não sabem como responder , já que isso é tecnicamente uma violação direta da Doutrina Monroe, no entanto, os EUA não parecem estar em condições de ir à guerra ainda. \n\nA situação só piora quando uma potência europeia intervém na guerra civil brasileira . Tudo o que o mundo pode esperar é que a guerra civil não se torne internacional."
 news.366.a:0 "PORTUGAL????"
 news.366.b:0 "QUE PORRA?!?!"
 news.366.c:0 "Vamos fazer isso"

 news.367.t:0 "O Paraguai intervém na Segunda Guerra Cisplatina"
 news.367.d:0 "Como se a situação na América do Sul não pudesse piorar, foi confirmado que o Paraguai está participando oficialmente da Segunda Guerra Cisplatina depois de cruzar a fronteira brasileira com seu exército. \n\nTodos nós posso esperar agora é que a situação não aumente ainda mais do que já está."
 news.367.a:0 "As coisas só pioram"
 news.367.b:0 "ESSES BASTARDOS SERÃO ESMAGADOS!"
 news.367.c:0 "O Brasil logo cairá!"

 brazil.23.b:0 "Esplendido"
 brazil.91.t:0 "Agente fugitivo dos democratas foi capturado"
 brazil.91.d:0 "Capturamos um agente fugitivo dos democratas que planejam realizar uma revolta em potencial. Usando esta oportunidade, poderíamos obter muitas informações sobre o paradeiro de suas sedes."
 brazil.91.a:0 "Precisamos obter o máximo de informação possível."
 brazil.91.b:0 "Faça-lhe algumas perguntas"
 brazil.91.c:0 "Não confie neste espião em potencial"

 brazil.92.t:0 "Não Fomos Capazes de Localizar a Sede"
 brazil.92.d:0 "Apesar de nossos corajosos esforços, não fomos capazes de descobrir a localização da sede democrática."
 brazil.92.a:0 "Maldição para o inferno!"

 brazil.93.t:0 "A Resistência Democrática concordou com o Compromisso".
 brazil.93.d:0 "A resistência democrática concordou com nosso compromisso e nós ouviremos suas exigências em troca de sua paciência na guerra civil e até mesmo de sua potencial cooperação."
 brazil.93.a:0 "Ótimo!"
  
 brazil.94.t:0 "A Resistência Democrática não concordou com o Compromisso".
 brazil.94.d:0 "A resistência se recusou a nosso compromisso e continuará seus planos originais".
 brazil.94.a:0 "Você vai se arrepender dessa decisão!"

 brazil.95.t:0 "O Estado Novo foi Estabelecido"
 brazil.95.d:0 "Depois de muitos meses de enganação, corrupção e esquemas, Vargas fez todos os preparativos adequados para se estabelecer como ditador do Brasil. \n\nCom essa situação atual, isso significa que precisamos lançar quaisquer planos que tenhamos AGORA, antes que seja tarde demais!"
 brazil.95.a:0 "Lançar os planos"
 brazil.95.b:0 "Parece que precisamos recuar"

 ###PAR###
 paraguay.1.t:0 "Pessoas irritadas com as recentes políticas de laissez-faire"
 paraguay.1.d:0 "As pessoas começaram a demonstrar a sua raiva contra o governo e as suas recentes políticas económicas, tomando as ruas e protestando contra elas. Eles acreditam que estas políticas irão prejudicar ainda mais a economia. As pessoas acreditam que isto se deve a os anteriores governos liberais que destruíram a economia.\n\nPrecisamos de lidar com estes protestos e não permitir que se agravem! O que devemos fazer?"
 paraguay.1.a:0 "Acalmar o Povo"
 paraguay.1.b:0 "Envie os militares para lidar com sua birra"
 paraguay.2.t:0 "[PAR.GetLeader] foi deposto pelos militares!"
 paraguay.2.d:0 "Os militares paraguaios assumiram o controle do governo e depuseram [PAR.GetLeader]!\n\nEsta situação parece bastante sombria."
 paraguay.2.a:0 "Que Deus nos ajude."
 paraguay.3.t:0 "Rafael Franco assume o poder"
 paraguay.3.d:0 "Depois de especulações e conspirações, os militares realmente fizeram isso; derrubaram o governo liberal e colocaram Rafael Franco no poder. \n\nVários setores socialistas, como os Colorados, Anarquistas e membros de Liga Nacional Independiente, apoiavam os militares e a ascensão de Franco ao poder."
 paraguay.3.a:0 "Esperemos que Franco consiga liderar a nação de maneira adequada."
 paraguay.4.t:0 "Eleições Nacionais"
 paraguay.4.d:0 "Hoje é um dia especial para o nosso pequeno país, pois os nojentos comunistas dentro das forças armadas foram eliminados e a democracia foi totalmente preservada! \n\nAlém de nós está uma questão alarmante: quem continuará liderando este país? Esuebio fez muito bem, mas uma nova mente poderia beneficiar nosso país. \n\nO novo líder de [ROOT.GetName] é..."
 paraguai.4.a:0 "Eusébio Ayala"
 paraguai.4.b:0 "Luis Alberto Riart"
 paraguai.4.c:0 "Félix Paiva"
 paraguai.4.e:0 "José Patricio Guggiari"
 paraguay.5.t:0 "[FROM.GetName] Gostaria de comprar [1048.GetName]"
 paraguay.5.d:0 "Delegados de [FROM.GetName] vieram a [ROOT.Capital.GetCapitalVictoryPointName] para discutir sobre uma possível compra de [1048.GetName]. \n\nEles estão dispostos a pagar substancialmente por isso .Devemos aceitar a oferta deles?"
 paraguay.5.a:0 "Sim, claro, não temos utilidade para isso"
 paraguay.5.b:0 "Não permitiremos isso!"
 paraguay.6.t:0 "Direita insatisfeita"
 paraguay.6.d:0 "Pouco depois de assumir o poder, muitos simpatizantes da direita no país demonstraram desapontamento com o novo líder, vendo-o como incapaz de governar o país. A sua preocupação está principalmente relacionada com a administração de Franco do recém-adquirido Chaco, por ter demonstrado interesse em retirar as tropas paraguaias de lá; algo que a direita detesta! \n\nPrecisamos ficar de olho neles se quisermos manter Franco no poder."
 paraguay.6.b:0 "Vamos ficar de olho neles"
 paraguay.7.t:0 "Remanescentes Liberais no Exército"
 paraguay.7.d:0 "Embora a tomada do governo tenha sido um sucesso, isso não significa que a oposição liberal desapareceu magicamente. Eles ainda estão muito presentes, e isso fica evidente. Eles anunciaram publicamente seu desdém pelo atual governo , mas do jeito que está, as ações que eles podem realizar são limitadas. \n\nDevemos ficar de olho neles caso algo aconteça."
 paraguay.7.a:0 "Boa ideia"
 paraguay.8.t:0 "[FROM.GetName] está solicitando gentilmente [994.GetName]"
 paraguay.8.d:0 "Diplomatas de [FROM.GetName] chegaram ao nosso país para nos pedir [994.GetName]. Eles garantem que estão apenas pedindo aquela terra, e dizem que garantirão que não haverá mais haveria quaisquer hostilidades entre os nossos dois países se lhes dermos isso. \n\nQual será a nossa escolha?"
 paraguay.8.a:0 "Claro, dê a eles"
 paraguay.8.b:0 "Estan locos estos? Que se piensan!!"
 paraguay.9.t:0 "Os militares colocaram Félix Paiva no poder"
 paraguay.9.d:0 "Poucas horas após a insurreição militar, os altos oficiais decidiram que Félix Paiva deveria assumir o comando do país, o que por sua vez trará de volta o Partido Liberal ao poder."
 paraguai.9.a:0 "Ok"
 paraguay.10.t:0 "José Félix Estigarribia foi eleito"
 paraguay.10.d:0 "Após a contagem dos votos das eleições [GetYear], José Félix Estigarribia foi eleito presidente da república e tomará posse em breve. \n\nO que isso significará para o Paraguai e seu povo ainda é em debate, mas o que podemos ter certeza é que precisamos garantir a segurança do país e do nosso povo."
 paraguay.10.a:0 "Ótimo"
 paraguay.11.t:0 "José Félix Estigarribia faleceu"
 paraguay.11.d:0 "Uma notícia trágica atingiu o país hoje, pois José Félix Estigarribia faleceu junto com sua esposa em um avião durante uma viagem de Los Altos para sua residência rural em San Bernardino. \n\nMuitos têm saiu às ruas para lamentar sua morte, o que é natural considerando a rapidez de seu falecimento."
 paraguay.11.a:0 "Que ele descanse em paz"
 paraguay.12.t:0 "A Constituição de 1870 foi abolida"
 paraguay.12.d:0 "[PAR.GetLeader] decidiu abolir a Constituição de 1870, afirmando que ela está defasada e requer uma substituição moderna."
 paraguay.12.a:0 "Assim será"
 paraguay.13.t:0 "Civis pegam em armas"
 paraguay.13.d:0 "Após o aumento das tensões no país, os civis se cansaram do lunático louco que é [ROOT.Getleader] e pegaram em armas para lutar contra o governo atual!"
 paraguay.14.t:0 "[FROM.GetName] está exigindo que lhes demos suas terras legítimas"
 paraguay.14.d:0 "Diplomatas paraguaios, escoltados por vários soldados e generais de alto escalão, entraram em nossa capital para exigir que lhes cedamos o que eles acreditam ser suas 'terras legítimas'. \n\nDevemos concordar com isso?"
 paraguay.14.a:0 "Tudo bem, nós aceitamos"
 paraguay.14.b:0 "Sem chance, recuem!"
 paraguay.15.t:0 "Devemos formar uma coalizão contra Parauay?"
 paraguay.15.d:0 "Como o Paraguai continua a se expandir e a ameaçar o equilíbrio de poder entre os países sul-americanos, precisamos nos perguntar: o Paraguai é uma ameaça ao nosso bem-estar? \n\nPelo que parece, com certeza é. Com isso em mente, vamos formar o pacto e convidar também aqueles que estão lutando contra o Paraguai?"
 paraguay.15.a:0 "Precisamos nos defender"
 paraguay.15.b:0 "Nós podemos fazer isso sozinhos, obrigado"
 paraguay.150.t:0 "[FROM.GetName] está exigindo que nos submetamos a eles"
 paraguay.150.d:0 "Recebemos uma carta de [FROM.GetName], exigindo que nos rendamos e nos submetamos a eles. Eles perceberam que nosso esforço de guerra está diminuindo e decidiram tirar vantagem disso. \n\nO que devemos fazer?"
 paraguay.150.a:0 "Aceitar as exigências deles"
 paraguay.150.b:0 "Lutaremos até o fim!"
 paraguay.16.t:0 "[FROM.GetName] Recusou nossas exigências"
 paraguay.16.d:0 "Recebemos a notícia de que [FROM.GetName] se recusou a se tornar nosso súdito e continuará lutando, apesar de suas perdas."
 paraguay.16.a:0 "Oh, bem, eles tiveram uma chance de viver"
 paraguay.17.t:0 "Um chamado para uma revolução nativa"
 paraguay.17.d:0 "Depois que a população nativa do país recebeu mais direitos e liberdades, movimentos de independência começaram a se espalhar pelo país. Acrescentando a isso a instigação causada por Juan Belaieff, os nativos estão se reunindo em todo o país, pedindo uma revolução em grande escala. \n\nQue escolha devemos fazer? Devemos ficar do lado deles e nos vingar dos europeus, ou devemos lutar contra eles e garantir que isso não aconteça novamente?"
 paraguay.17.a:0 "Vamos nos vingar!"
 paraguay.17.b:0 "Lutaremos contra esses malditos bastardos"
 paraguay.18.t:0 "Nossa revolução começou"
 paraguay.18.d:0 "Enquanto falamos, milhares de pessoas estão pegando em armas para lutar por nossa causa. Em breve, derrubaremos esse governo miserável e deixaremos claro quem é o verdadeiro dono dessas terras!"
 paraguay.18.a:0 "Venceremos, não importa o que aconteça!"
 paraguay.19.t:0 "Praguai está intensificando a resistência nativa!"
 paraguay.19.d:0 "Embora a princípio parecesse uma loucura, foram confirmados relatos de avistamentos de paraguaios ajudando as populações nativas em nosso país. Os perpetradores foram presos e pagarão por suas ações, mas agora a questão permanece: o que fazer fazemos com o Paraguai?"
 paraguay.19.a:0 "Vamos fazê-los pagar!"
 paraguay.19.b:0 "Não podemos fazer nada a respeito"
 paraguay.20.t:0 "[FROM.GetName] descobriu nossos esquemas"
 paraguay.20.d:0 "As pessoas que enviamos para [FROM.GetName] foram descobertas e encarceradas. É quase certo que também descobriram nossos planos!"
 paraguay.21.t:0 "Busca bem-sucedida e repressão aos remanescentes liberais"
 paraguay.21.d:0 "Nossa busca dentro do país foi bem-sucedida e conseguimos localizar e atacar os principais quartéis-generais daqueles no exército que ainda permaneciam leais ao partido liberal."
 paraguay.21.a:0 "Excelente!"
 paraguay.22.t:0 "Busca e repressão bem-sucedidas contra os revolucionários de direita"
 paraguay.22.d:0 "Nossa busca dentro do país foi bem-sucedida e conseguimos localizar e atacar os principais quartéis-generais das pessoas do exército que eram simpatizantes de ideologias de extrema direita."
 paraguay.23.t:0 "Busca mal-sucedida"
 paraguay.23.d:0 "Apesar de nossos esforços, não conseguimos localizar nenhum dos principais quartéis-generais daqueles que estavam contra nós."
 paraguay.23.a:0 "Droga"


 news.369.t:0 "A Guerra de Vingança Parauaiana"
 news.369.d:0 "As notícias confirmaram que um novo grande conflito irrompeu na América do Sul, com a formação de uma facção antiparaguaiana para conter a rápida mobilização do Paraguai, impedindo-o de se expandir ainda mais. \n\nAs estimativas de possíveis vítimas já estão chegando a centenas de milhares, e muitos acreditam que a América do Sul pode estar condenada se o Paraguai acabar vencendo essa guerra. Independentemente disso, ainda devemos ter esperança no continente e esperar que tudo acabe bem."
 news.369.a:0 "Todos eles pagarão!"
 news.369.b:0 "Vamos lidar com o Paraguai de uma vez por todas!"
 news.369.c:0 "Jesus..."

 chile.50.t:0 "As Greves Ferroviárias de [GetYear]"
 chile.50.d:0 "Depois da greve ferroviária de janeiro de 1935 devido à desvalorização da moeda e à redução dos salários, um movimento que recebeu apoio efusivo do Partido Comunista, esta é a segunda greve do setor trabalhista nacional cada vez mais ativo.\n\n Embora este segundo governo de Alessandri tenha feito todo o possível para manter o equilíbrio fiscal, essa mobilização de norte a sul levou à decretação do Estado de Sítio por 3 meses e à suspensão extraordinária do congresso. No entanto, é inegável que a unidade sindicalista dos trabalhadores está sendo fortalecida."
 chile.50.a:0 "Isso tem que ser uma intervenção da Internacional Comunista!"

 ## Venezuela ##
 venezuela.1.t:0 "Petróleo descoberto nas areias betuminosas do Mioceno"
 venezuela.1.d:0 "Após uma exploração esperançosa e a perfuração de um poço de descoberta a apenas 37 quilômetros ao norte-noroeste de Ciudad Bolivar, foi descoberto petróleo! O petróleo foi encontrado nas areias betuminosas miocênicas de [947.GetName], e já foram elaborados planos para começar a perfurar o petróleo encontrado aqui e aproveitar ao máximo as possibilidades. \n\nCom diligência, esperamos produzir significativamente mais petróleo bruto, o que poderia nos ajudar drasticamente em termos econômicos."
 venezuela.1.a:0 "Fantástico!"
 venezuela.2.t:0 "O Massacre de Fevereiro"
 venezuela.2.d:0 "Depois que o governador de [VEN.GetCapital.GetName], Félix Galavís, decretou novas leis de censura sobre vários meios de comunicação, muitos venezuelanos na capital decidiram que já bastava e saíram às ruas para protestar contra essas ações. À medida que os protestos cresciam em número, chegando a mais de 20.000, Galavís tomou uma decisão bruta e ordenou que seus homens atirassem nos manifestantes, matando 6 e ferindo 150. \n\nEmbora isso tenha ajudado a acalmar os protestos momentaneamente, as consequências das ações de Galvis podem ser monumentais se não tomarmos providências. Precisamos agir com cautela, pois um movimento errado pode significar uma revolução nacional."
 venezuela.2.a:0 "Isso não pode ser bom!"
 venezuela.3.t:0 "Protestos contra o governo"
 venezuela.3.d:0 "Recebemos notícias de manifestações que estão se formando no país para demonstrar sua aversão ao atual governo. A incapacidade de lidar adequadamente com os protestos pode levar à intensificação dos protestos."
 venezuela.4.t:0 "Greves em nível nacional"
 venezuela.4.d:0 "Trabalhadores de todo o país se recusaram a ir ao trabalho, alegando que as condições de trabalho são inferiores e o salário é abismal. Os grevistas deixaram claro que não irão trabalhar a menos que essas condições de trabalho sejam melhoradas ou que a estabilização do país permita um salário maior."
 venezuela.5.t:0 "Devemos intervir em [VEN.GetName]?"
 venezuela.5.d:0 "Chegou ao nosso conhecimento que a Venezuela não está se alinhando adequadamente com nossas intenções, o que poderia resultar em efeitos colaterais catastróficos no caso de um inimigo se apoderar de seus campos de petróleo.[ROOT.GetTAGStatus] \n\nDevemos intervir e acabar com seus planos perigosos?"
 venezuela.5.a:0 "Intervenha o mais rápido possível!"
 venezuela.5.b:0 "Emita um aviso severo"
 venezuela.5.c:0 "Deixe-os ir"
 venezuela.5.e:0 "Dê a eles 2 anos para se arrependerem"
 VEN_allied_speech_tt:0 "\n\n[VEN.GetName] está se recusando a cortar os laços com as potências do Eixo, e isso poderia levar a uma rota segura de comércio de combustível entre os dois lados, o que é algo que devemos evitar a todo custo."
 VEN_axis_speech_tt:0 "\n\nO alinhamento da Venezuela com as potências aliadas está potencialmente estrangulando o que poderia ser uma rota segura de comércio de petróleo e combustível."
 venezuela.6.t:0 "[FROM.GetName] nos emitiu um aviso severo"
 venezuela.6.d:0 "Recebemos uma comunicação da [FROM.GetName], na qual eles afirmaram que estamos tomando medidas potencialmente perigosas e que estamos 'trilhando um caminho estreito'. Se não cessarmos nosso atual alinhamento ideológico, isso poderá resultar em uma intervenção deles."
 venezuela.6.a:0 "Não temos medo de vocês!"
 venezuela.7.t:0 "A Venezuela removeu nossa influência em seu país"
 venezuela.7.d:0 "Recebemos a notícia de que a Venezuela removeu nossa influência de seu país. \n\nO que devemos fazer?"
 venezuela.8.t:0 "[FROM.GetName] começou a influenciar nossa política"
 venezuela.8.d:0 "[FROM.GetName] iniciou várias atividades subversivas para começar a influenciar nossa política. Devemos desconfiar de suas intenções e ficar de olho neles por precaução."
 venezuela.8.a:0 "Bem, isso é ótimo..."
 venezuela.9.t:0 "[VEN.GetName] nacionalizou seu petróleo"
 venezuela.9.d:0 "Em resposta às crescentes tensões no mundo e ao cabo de guerra político que estava sendo exercido sobre [VEN.GetName] devido ao seu petróleo, o [VEN.GetAdjective] tomou a decisão improvisada de nacionalizar totalmente seu petróleo e não permitir a venda de nenhum de seus produtos a ninguém.
 venezuela.9.a:0 "Intervir militarmente"
 venezuela.10.t:0 "[FROM.GetName] está exigindo direitos de recursos para [VEN_RESOURCE_TARGET_STATE.GetName]"
 venezuela.10.d:0 "[FROM.GetName] entrou em contato conosco, afirmando que está exigindo os direitos sobre os recursos presentes em [VEN_RESOURCE_TARGET_STATE.GetName], em particular o petróleo bruto que está presente lá. \n\nQue decisão devemos tomar?"
 venezuela.10.a:0 "Dar a eles os direitos sobre o recurso"
 venezuela.10.b:0 "Eles não terão acesso a esses direitos"
 venezuela.11.t:0 "Devemos exigir direitos sobre os recursos presentes no Cinturão do Orinoco?"
 venezuela.11.d:0 "O Cinturão do Orinoco é uma região da Venezuela conhecida por ser extremamente rica em petróleo bruto. De fato, é a região do país com a maior quantidade de petróleo e, potencialmente, a região com o petróleo mais intocado de todo o planeta. \n\nCom nossa influência totalmente estabelecida no país, temos o poder de fazer essa exigência. Vamos fazer isso?"
 venezuela.11.a:0 "Com certeza"
 venezuela.12.t:0 "[FROM.GetName] está disposto a discutir a venda de seus recursos para nós"
 venezuela.12.d:0 "Diplomatas da [FROM.GetName] vieram ao nosso país para discutir a venda de direitos sobre seus recursos em uma província deles. Nós ganhamos os recursos do estado que eles escolherem oferecer e, em troca, eles podem exigir pagamento a cada 6 meses. Devemos aceitar essa oferta?"
 venezuela.12.a:0 "Claro, vamos ver o que eles oferecem"
 venezuela.12.b:0 "Não podemos pagar por isso agora"
 venezuela.13.t:0 "[FROM.GetName] aceitou nossa proposta"
 venezuela.13.d:0 "Recebemos informações de que [FROM.GetName] concordou em comprar recursos de um de nossos estados. Agora cabe a nós escolher a qual estado ofereceremos acesso."
 venezuela.13.a:0 "Ótimo!"
 venezuela.14.t:0 "[FROM.GetName] Não deseja comprar acesso aos nossos recursos"
 venezuela.14.d:0 "[FROM.GetName] conseguiu entrar em contato conosco, agradecendo a oferta, mas sua atual situação econômica e política torna impossível para eles arcar com a compra de direitos sobre nossos recursos."
 venezuela.14.a:0 "Melhor sorte na próxima vez"
 venezuela.15.t:0 "[FROM.GetName] nos deu direitos de recursos para [VEN_RESOURCE_SELLING_TARGET_STATETE.GetName]"
 venezuela.15.d:0 "[FROM.GetName] nos informou que teremos acesso total aos recursos situados em [VEN_RESOURCE_SELLING_TARGET_STATE.GetName]. Eles podem exigir pagamento de vez em quando, mas prometem que cumprirão sua parte no acordo."
 venezuela.15.a:0 "Ok"
 venezuela.16.t:0 "[FROM.GetName] Nos expulsou da facção deles"
 venezuela.16.d:0 "Fomos expulsos da facção de [FROM.GetName] devido às nossas ações."
 venezuela.17.t:0 "[FROM.GetName] está exigindo pagamento pelo nosso uso de seus recursos"
 venezuela.17.d:0 "Era inevitável que [FROM.GetName] exigisse pagamento pelo uso de seus recursos. Devemos cumprir nossa parte do acordo e pagar."
 venezuela.18.t:0 "Ponta de lança da revolução"
 venezuela.18.d:0 "Pela primeira vez em anos, nós realmente temos uma palavra a dizer na política venezuelana e no país como um todo. Nosso movimento ganhou grande força e as pessoas estão acordando. Para realmente continuarmos a ser a ponta de lança da nossa revolução, precisamos de um líder adequado para assumir o comando do movimento e garantir que os trabalhadores [VEN.GetAdjective] sejam representados adequadamente. \n\nQuem assumirá o comando?"
 venezuela.19.t:0 "Rafael Simón Urbina deixa o cargo devido a problemas de saúde"
 venezuela.19.d:0 "Após apenas alguns meses de ter sido chamado pelo [ROOT.GetLeader] para ser governador, Rafael apresentou sua renúncia devido a problemas pessoais de saúde."
 venezuela.19.a:0 "Que pena"
 venezuela.20.t:0 "[FROM.GetName] Parou de comprar nossos recursos"
 venezuela.20.d:0 "[FROM.GetName] informou que oficialmente deixará de comprar acesso aos nossos recursos. A partir de hoje, não estaremos fornecendo recursos à [FROM.GetName]."
 venezuela.20.a:0 "Ah"
 venezuela.21.t:0 "[FROM.GetName] está exigindo a Guiana Esequiba"
 venezuela.21.d:0 "[FROM.GetName] está batendo em nossas portas, exigindo que entreguemos a Guiana Esequiba para eles. Eles alegam que é parte integrante da nação [FROM.GetAdjective] e que são os legítimos proprietários dessa terra. \n\nEles já se certificaram de que, se lhes negarmos a terra, eles responderão com força. Qual será a nossa resposta?"
 venezuela.21.a:0 "Entregue-a a eles"
 venezuela.21.b:0 "Quem diabos você pensa que é? NÃO"
 venezuela.22.t:0 "A Guerra Civil finalmente termina"
 venezuela.22.d:0 "Depois de muitas batalhas brutais, campos sangrentos e vidas dizimadas, um raio de sol finalmente aterrissa em nosso belo país. Havia realmente uma luz no fim do túnel, mesmo que parecesse tão distante.\n\nAqueles que permaneceram vivos estão tomando as ruas, comemorando a resolução de um conflito tão sangrento, felizes por poderem visitar seus amigos novamente, felizes por poderem sair de casa novamente sem ter que se preocupar em serem mortos. É... lindo".
 venezuela.22.a:0 "Uma nova era da história da Venezuela começa agora!"
 venezuela.23.t:0 "Os trabalhadores exigem a nacionalização de nossos campos de petróleo"
 venezuela.23.d:0 "Não podemos esquecer que conseguimos chegar ao poder por causa da greve petrolífera planejada contra o governo anterior. Os trabalhadores que nos ajudaram tanto em nossa revolução agora esperam sua recompensa, que será cumprida!"
 venezuela.24.t:0 "[FROM.GetName] Quer comprar o Canal do Panamá"
 venezuela.24.d:0 "[FROM.GetName] chegou a [ROOT.Capital.GetName] com uma proposta interessante. Eles estão dispostos a comprar o Canal do Panamá de nós e estão dispostos a pagar uma quantia bastante alta por ele. \n\nDevemos aceitar?"
 venezuela.24.a:0 "Claro, vamos dar a eles"
 venezuela.24.b:0 "Claro, mas exigimos uma compensação extra"
 venezuela.24.c:0 "Desculpe, mas não podemos fazer isso "d
 venezuela.25.t:0 "[FROM.GetName] concordou, mas precisamos pagar uma compensação extra"
 venezuela.25.d:0 "Embora [FROM.GetName] tenha concordado em nos vender o Canal do Panamá, eles deixaram claro que precisamos pagar uma compensação extra devido ao valor que o canal tem."
 venezuela.26.t:0 "[FROM.GetName] gostaria de assinar um tratado de linha de frente conosco"
 venezuela.26.d:0 "Delegados de [FROM.GetName] chegaram ao nosso país para discutir a assinatura de um tratado para finalmente estabelecer nossas fronteiras e consertar nossas relações após anos de disputas e tensão. \n\nVamos assiná-lo?"
 venezuela.26.a:0 "Claro
 venezuela.26.b:0 "Não"
 venezuela.27.t:0 "[FROM.GetName] se recusou a assinar o Tratado da Linha de Frente"
 venezuela.27.d:0 "[FROM.GetName] respondeu aos nossos delegados que foram enviados para lá, afirmando que não assinarão o tratado e que sua visão da fronteira é a única correta."
 venezuela.27.a:0 "Droga, azar"
 venezuela.27.b:0 "Eles não vão se safar dessa!"
 venezuela.28.t:0 "Afundamento do Monagas e do Tía Juana"
 venezuela.28.d:0 "Recebemos a notícia de que os navios de petróleo Monagas e Tía Juana foram afundados por torpedos [GER.GetAdjective]. Vidas venezuelanas foram perdidas nesses naufrágios, e as ações tomadas pelos [GER.GetAdjective] são indesculpáveis. \n\nComo devemos reagir a essa situação?"
 venezuela.28.a:0 "Exija uma indenização imediata!"
 venezuela.28.b:0 "Embargo a eles"
 venezuela.28.c:0 "Não podemos fazer nada a respeito..."
 venezuela.280.t:0 "[FROM.GetName] Exige indenização pelos navios de petróleo afundados"
 venezuela.280.d:0 "[FROM.GetName] nos comunicou formalmente que afundamos dois de seus navios de petróleo. Devido à perda de vidas, o governo deles exige que lhes demos uma compensação imediata por nossas ações e para garantir que nunca mais façamos algo assim. \n\nO que devemos fazer?"
 venezuela.280.a:0 "Apenas ignore-os"
 venezuela.280.b:0 "Quem diabos eles pensam que são? ????"
 venezuela.280.c:0 "Sentimos muito, pagaremos por nossos erros"
 venezuela.29.t:0 "Parece que [FROM.GetName] nos ignorou"
 venezuela.29.d:0 "Depois de exigir indenização de [FROM.GetName], ainda não recebemos nenhum tipo de resposta do governo deles. É seguro presumir que eles simplesmente nos ignoraram..."
 venezuela.29.a:0 "Deveria ter esperado o mesmo deles"
 venezuela.30.t:0 "[FROM.GetName] concordou em compensar"
 venezuela.30.d:0 "Apesar do que muitos esperavam, o governo [FROM.GetAdjective] realmente respondeu às nossas exigências e concordou em compensar seus erros. Eles também nos enviaram um pedido formal de desculpas, dizendo que sentem muito pela perda de vidas venezuelanas e que farão o que for preciso para compensar isso."
 venezuela.30.a:0 "Isso é ótimo!"
 venezuela.31.t:0 "[VEN.GetName] Comprou dois de nossos Destroyers"
 venezuela.31.d:0 "Recebemos a notícia de que [VEN.GetName] comprou dois de nossos contratorpedeiros e pagou adequadamente por eles."
 venezuela.31.a:0 "Ótimo!"
 venezuela.32.t:0 "Medina retorna para lidar com a terrível situação"
 venezuela.32.d:0 "Depois de receber a notícia de que a situação em casa estava parecendo sombria, Medina decidiu cancelar sua turnê e voltar ao seu país de origem para lidar com o problema."
 venezuela.32.a:0 "Bem-vindo de volta"
 venezuela.33.t:0 "Medina retornou à Venezuela"
 venezuela.33.d:0 "Depois de fazer uma longa turnê pelos países Peru, Colômbia, Panamá, Equador e Bolívia, Medina finalmente voltou para casa para administrar adequadamente o país mais uma vez, depois de se aproximar diplomaticamente dos países mencionados anteriormente."
 venezuela.34.t:0 "Atividade suspeita dos generais e da Acción Democratica"
 venezuela.34.d:0 "Nossa inteligência revelou que alguns generais do país estão cooperando politicamente com a Acción Democratica, planejando derrubar o governo atual. \n\nDo pouco que sabemos, a justificativa deles para um ato tão repugnante é que Medina não está permitindo adequadamente o direito a eleições livres e privadas, e que os salários militares são 'abaixo da média'."
 venezuela.34.a:0 "Malditos bastardos"
 venezuela.35.t:0 "As Forças Armadas e a AD deram início ao golpe"
 venezuela.35.d:0 "Após meses de planejamento, a aliança política formada entre a AD e as Forças Armadas finalmente decidiu lançar seu golpe contra o atual governo. \n\nEnquanto falamos, membros da AD e militares estão se dirigindo à capital para garantir a renúncia imediata de [ROOT.GetLeader]. \n\nSó o tempo dirá como isso se resolverá."
 venezuela.35.a:0 "Que Deus nos guie"
 venezuela.36.t:0 "A oposição continua satisfeita"
 venezuela.36.d:0 "Depois de nossas várias reformas, parece que a oposição e os militares estão satisfeitos com nossas ações e decidiram cancelar sua intervenção militar."
 venezuela.36.a:0 "Que esta paz dure por toda a eternidade"
 venezuela.37.t:0 "Escalante diagnosticado com início de demência"
 venezuela.37.d:0 "Um recente check-up com o médico acabou se transformando em um pesadelo que se tornou realidade, pois foi confirmado que Escalante tem demência de início, que só vai piorar com o tempo. "Embora pareça sombrio, há uma pequena chance de ele ser curado", foram as palavras do médico. \n\nSe a condição persistir, Escalantes será forçado a renunciar à política de uma vez por todas."
 venezuela.37.a:0 "Isso resolve tudo, este governo PRECISA sair"
 venezuela.37.b:0 "Faremos o que for preciso para curá-lo"
 venezuela.38.t:0 "Medina entrega a Presidência a Escalante"
 venezuela.38.d:0 "Conforme planejado originalmente, Medina decidiu deixar o poder, e em seu lugar Diógenes Escalante assumirá o poder. Visto por muitos como uma potencial graça salvadora para a Venezuela, liderando-a em uma década de ouro. Graças a isso, em sua posse como presidente, milhares de pessoas o aplaudiram. \n\nVamos torcer para que nada de ruim aconteça com ele."
 venezuela.38.a:0 "O povo está contigo, senhor presidente"
 venezuela.39.t:0 "Rômulo Gallegos venceu as eleições de [GetYear]"
 venezuela.39.d:0 "Graças à administração de Bentancourt e à democratização do país, a Venezuela finalmente teve sua primeira eleição livre e adequada pela primeira vez em décadas. Os resultados das eleições foram revelados neste dia muito especial, e foi confirmado que Rômulo Gallegos venceu as eleições e assumirá o comando do país."
 venezuela.39.a:0 "Essa é uma notícia maravilhosa!"
 venezuela.40.t:0 "Rômulo Bentancourt venceu as eleições de [GetYear]"
 venezuela.40.d:0 "Apesar das táticas políticas usadas pela oposição, ela simplesmente não foi páreo para a excelente administração de Bentancourt no país, o que lhe rendeu o apelido de 'Pai da Democracia Venezuelana'. Graças à sua administração, ele venceu as primeiras eleições livres da Venezuela em décadas, garantindo-lhe mais alguns anos no cargo."
 venezuela.40.a:0 "Essa é uma notícia maravilhosa!"
 venezuela.41.t:0 "Rafael Simón Urbina vai para o exílio"
 venezuela.41.d:0 "Depois dos eventos que ocorreram devido ao golpe [GetYear] contra Medina, recebemos a notícia de que Urbina foi para o exílio mais uma vez, desta vez para o Haiti. O tempo dirá o que ele decide fazer, mas, por enquanto, ele não é nosso principal problema."
 venezuela.42.t:0 "Urbina retorna à Venezuela"
 venezuela.42.d:0 "Confirmado por várias testemunhas oculares e agentes secretos, Urbina retornou à Venezuela. Por enquanto, parece que ele não vai dar nas vistas, mas pode estar planejando algo. Devemos agir com muito cuidado." 
 venezuela.42.a:0 "Pffff, como se ele pudesse fazer algo contra nós"
 venezuela.43.t:0 "Carlos Delgado Chalbaud foi encontrado morto"
 venezuela.43.d:0 "Ainda parece loucura acreditar, mas surgiram evidências e foi confirmado que Chalbaud foi assassinado e encontrado morto. \n\nO relatório da autópsia confirma que o agressor originalmente tentou sequestrá-lo, mas ele resistiu, forçando o agressor a assassiná-lo no local. Também foi confirmado que o autor desse assassinato foi nada menos que Rafael Simón Urbina. \n\nO que devemos fazer com esse desgraçado?"
 venezuela.43.a:0 "Assassinar o maldito bastardo"
 venezuela.43.b:0 "Exile-o para sempre"
 venezuela.44.t:0 "[GetYear] Greve do Petróleo"
 venezuela.44.d:0 "Em protesto contra o atual governo, vários setores da indústria petrolífera entraram em greve. As greves ocorreram principalmente em Zulia, mas se espalharam por muitas partes do país. O organizador é bastante desconhecido, mas o motivo da greve são as más condições dos trabalhadores."
 venezuela.44.a:0 "Eles pagarão muito caro por isso!"
 venezuela.45.t:0 "[FROM.GetName] Oferece Salvação na Unificação"
 venezuela.45.d:0 "Percebendo nossa situação atual, [FROM.GetName] ofereceu uma solução de última hora: união. Parece loucura, mas com sua indústria e exército, pode ser a vantagem de que precisamos para conseguir uma vitória. \n\nO que devemos fazer?"
 venezuela.45.a:0 "É a nossa última chance"
 venezuela.45.b:0 "Não, estamos mais do que bem"
 venezuela.46.t:0 "[FROM.GetName] Se recusou a se unir a nós"
 venezuela.46.d:0 "[FROM.GetName] respondeu à nossa proposta de unificação, dizendo que eles estarão bem sem a unificação."
 venezuela.46.a:0 "Oh, bem"
 venezuela.47.t:0 "Os EUA estão nos dando dois anos para abandonar totalmente o Eixo"
 venezuela.47.d:0 "Os Estados Unidos notaram nosso alinhamento com as potências do Eixo e temem que possamos eventualmente nos tornar inimigos deles. Devido a essa preocupação, os EUA nos deram um ultimato. Ou rompemos todos os laços com o Eixo dentro de dois anos ou os Estados Unidos intervirão militarmente."
 venezuela.47.a:0 "Tudo bem"
 venezuela.48.t:0 "[FROM.GetName] se recusou a cooperar com nossas ordens"
 venezuela.48.d:0 "Depois de lhes dar tempo para seguir nossas ordens, [FROM.GetName] se recusou a fazer isso. \n\nDevido às nossas condições estabelecidas e ao fato de elas não terem sido cumpridas, chegou a hora de cumprir nossa palavra e intervir militarmente."
 venezuela.48.a:0 "Nós o avisamos, agora é tarde demais"
 venezuela.48.b:0 "Nós simplesmente não podemos nos dar ao luxo de entrar em uma guerra com eles agora"
 
### Evento genérico de Ultimato
 venezuela.49.t:0 "[FROM.GetName] nos enviou um Ultimato"
 venezuela.49.d:0 "Neste dia, recebemos uma comunicação oficial de [FROM.GetName] exigindo nossa imediata anexação e subsequente entrega de nosso território soberano a eles. \n\n[ROOT.GetLeader] avaliou diligentemente a situação junto com seu gabinete, e uma decisão deve ser tomada até hoje. \n\nCom a soberania de nossa nação em nossas mãos, qual será nossa escolha?"
 venezuela.49.a:0 "Temos ao menos uma escolha?"
 venezuela.49.b:0 "Nós lutaremos até o fim!"
### Evento genérico de Ultimato

 venezuela.50.t:0 "[FROM.GetName] está exigindo nossas possessões sul-americanas"
 venezuela.50.d:0 "Recebemos uma comunicação oficial de [FROM.GetName] exigindo a entrega de nosso território sul-americano a eles. \n\nEles afirmam que o território é vital para o núcleo e as fronteiras fundamentais de sua nação e deixaram claro que a não entrega do território resultará em uma escalada militar. \n\nO que devemos fazer?"
 venezuela.50.a:0 "Não podemos nos permitir uma guerra com eles"
 venezuela.50.b:0 "Quer? Venha e pegue então"
 venezuela.51.t:0 "Escalantes deixa o poder"
 venezuela.51.d:0 "Hoje é um dia triste para a república, pois foi divulgada a notícia de que Escalantes deixou o poder devido à sua demência. A doença mental progrediu demais e estava afetando muito Escalantes, a ponto de ele não ser capaz de liderar adequadamente. Devido à falta de um substituto, a Assembleia Nacional estará liderando o país e assumindo o comando administrativo."
 venezuela.51.a:0 "Um dia triste para a Venezuela"
 venezuela.52.t:0 "Escalantes foi curado de sua demência"
 venezuela.52.d:0 "Chegaram notícias maravilhosas do consultório médico após o mais recente check-up de Escalantes. Foi confirmado que a demência foi milagrosamente curada. O médico observou que isso era tecnicamente possível, mas que o processo seria difícil. Eles estavam certos, foi um processo, mas foi bem-sucedido no final, e Escalantes pode continuar liderando nossa nação até as próximas eleições."
 venezuela.52.a:0 "Isso é maravilhoso!"
 venezuela.53.t:0 "Revolucionários pegam em armas em todo o país"
 venezuela.53.d:0 "O barril de pólvora na Venezuela não aguentou mais e explodiu! Enquanto falamos, milhares e milhares de revolucionários começaram a pegar em armas para derrubar à força nosso governo autoritário. Eles afirmam que estão lutando para evitar um segundo Vicente Gomez, uma segunda ditadura brutal. "Nunca Mais!" são os gritos que as pessoas estão fazendo em todo o país, apoiando e até mesmo pegando em armas com os revolucionários para lutar por sua causa. \n\nEles não percebem o grave erro que estão cometendo e estão apenas provando que Laureano está certo: que o povo da Venezuela precisa de um governante autoritário forte para guiá-lo adequadamente. Está vendo o que acontece quando você permite a liberdade?"
 venezuela.53.a:0 "Eles estão cometendo um grave erro"
 venezuela.54.t:0 "Protestos violentos eclodem em todo o país"
 venezuela.54.d:0 "As pessoas começaram a demonstrar sua raiva em relação à nossa mudança de governo com protestos em todo o país. O que começou como apenas alguns manifestantes insignificantes, agora se transformou em um caos nacional, já que os manifestantes começaram a agredir nossas forças policiais e muitos de seus protestos se tornaram violentos, exigindo que paremos imediatamente nossas reformas. \n\nÉ uma pena ver pessoas com lavagem cerebral que acreditam que somos os vilões. Estamos apenas tentando ajudar."
 venezuela.54.a:0 "Parece que precisamos reprimi-los ainda mais"
 venezuela.55.t:0 "Greves em todo o país"
 venezuela.55.d:0 "À medida que o cenário político do país piora, os socialistas do país começaram a orquestrar greves nacionais para expressar seu desdém por nossa mudança para um governo autoritário, alegando que não é assim que o povo venezuelano deve ser tratado. Nosso governo recebeu uma carta desses principais organizadores, dizendo que estamos cometendo um grave erro e que pagaremos caro."
 venezuela.55.a:0 "Eles serão os que pagarão caro"
 venezuela.56.t:0 "Revolucionários pegos contrabandeando armas"
 venezuela.56.d:0 "Vários esquadrões de nossa Gendarme pegaram pessoas tentando roubar armas de nossas reservas, e isso não é algo que aconteceu apenas uma vez, oh não, não, isso tem sido recorrente nas últimas semanas. \n\nÉ dolorosamente óbvio por que eles estão fazendo isso, eles estão planejando uma revolução total contra nós só porque começamos a colocar ordem e dignidade neste país. Seja qual for a tentativa deles, serão esmagados até o chão!"d
 venezuela.56.a:0 "Eles estão perdidos"
 venezuela.57.t:0 "López Contreras é forçado a deixar o poder"
 venezuela.57.d:0 "Como se as coisas não pudessem piorar, [ROOT.GetLeader] enviou uma carta oficial ao gabinete e ao governo anunciando sua aposentadoria e subsequente renúncia ao cargo. Ele abordou os motivos de sua renúncia na carta, afirmando que simplesmente não conseguia lidar com a piora da situação no país, e isso estava afetando significativamente sua saúde mental."
 venezuela.57.a:0 "Que pena"
 venezuela.58.t:0 "A Segunda Revolução Libertadora"
 venezuela.58.d:0 "As tensões estão aumentando na Venezuela há alguns meses, desde que o país decidiu mudar para um estado mais autoritário. As informações nos dizem que as pessoas não querem passar por uma ditadura semelhante à que atravessaram há apenas um ano e estão dispostas a colocar suas vidas em risco para salvar a Venezuela e garantir que ela continue livre e democrática. \n\nOs primeiros tiros da revolução foram disparados há poucas horas, e a situação parece que só vai piorar daqui para frente. O resultado dessa revolução pode determinar a trajetória do país para sempre, portanto, há muita coisa em jogo para ambos os lados."
 venezuela.58.a:0 "Faremos o que for preciso para vencer!"
 venezuela.58.b:0 "Temos que ficar de olho na Venezuela"
 venezuela.58.c:0 "Interessante"
 venezuela.59.t:0 "[ROOT.GetLeader] Contraiu uma doença pulmonar"
 venezuela.59.d:0 "Recebemos a notícia de que [ROOT.GetLeader] contraiu uma doença pulmonar grave. Os profissionais afirmaram que, se não for tratada a tempo, ela pode se agravar gravemente e até levar à morte. Ainda não se sabe onde [ROOT.Getleader] contraiu a doença, mas pode ter sido durante uma turnê no sul do país."
 venezuela.59.a:0 "Vamos nos certificar de que ele receba o tratamento adequado!"
 venezuela.60.t:0 "Laureano faleceu"
 venezuela.60.d:0 "O dia de hoje foi marcado por notícias tristes, pois foi confirmado que Laureano faleceu. A autópsia confirmou que foi devido ao avanço de sua doença pulmonar. É realmente uma pena que não tenhamos conseguido dar a ele o tratamento adequado a tempo."
 venezuela.60.a:0 "Sua memória continuará viva!"
 venezuela.61.t:0 "[FROM.GetName] Ocupou Militarmente [VEN_STATE_OCCUPIED.GetName]"
 venezuela.61.d:0 "Os habitantes locais em [FROM.GetName] entraram em contato conosco repentinamente, pedindo nossa ajuda. Eles nos informaram que a Venezuela entrou em nossas terras ilegalmente com suas tropas, tomando [FROM.GetName] à força e forçando os habitantes locais a aderir ao governo de seu país a partir de agora. \n\nComo devemos reagir a isso?"
 venezuela.61.a:0 "Não podemos fazer nada, desculpe"
 venezuela.61.b:0 "Eles não vão se safar dessa!"
 venezuela.62.t:0 "Revolucionários reprimidos com sucesso"
 venezuela.62.d:0 "Após nossas várias medidas repressivas, recebemos a confirmação de que os revolucionários recuaram e entregaram suas armas às autoridades locais. O país poderá continuar intacto e inteiro." ## monkey d. garp 
 venezuela.62.a:0 "Eles fizeram a escolha certa"

 argentina.22.e:0 "Que se dane o que o povo votou, estamos assumindo o controle!"

 peru.41.t:0 "A Restauração do Império Espanhol"
 peru.41.d:0 "Notícias se espalharam pelo mundo todo sobre o então Reino do Peru, que agora se autodeclara sucessor do Império Espanhol original, afirmando que é seu destino realizar o que o império original não conseguiu! \n\nMuitos especulam sobre o sucesso real desse "sucessor", com muitos já prevendo seu inevitável colapso devido à grande quantidade de terra necessária para estar sob seu controle. \n\nIndependentemente disso, por enquanto eles representam uma séria ameaça ao equilíbrio global."
 peru.41.a:0 "Eles estão fadados ao fracasso"
 peru.41.b:0 "Glória ao Império!"
 peru.42.t:0 "Vamos promover um rei?"
 peru.42.d:0 "Um carlista proeminente e influente chamado Carlos Pio Habsburgo Borbon entrou em contato com nosso governo, oferecendo-se para se tornar rei do novo Império Espanhol. Ele promete que fará tudo o que estiver ao seu alcance para garantir o sucesso imperial total! \n\nEle se tornará rei?"
 peru.42.a:0 "Claro, é apenas lógico"
 peru.42.b:0 "Um peruano deve permanecer no comando!"

## Reformulação monarquista 
 brazil.96.t:0 "A criação da Coalizão Anti-Monarquista"
 brazil.96.d:0 "Depois de saber da nossa crescente influência monarquista em todo o país, Vargas tomou o assunto em suas próprias mãos para cooperar com os outros partidos do país e formar uma coalizão antimonarquista. \n\nVer sua determinação em trabalhar com seus supostos inimigos só pode significar que os outros partidos nos veem como uma grande ameaça ao seu pequeno círculo de amigos que se beneficiam mutuamente."
 brazil.96.a:0 "Eles logo se desintegrarão"
 brazil.97.t:0 "Coalizão inicia planos para deter nosso movimento"
 brazil.97.d:0 "Recebemos a notícia de que a Coalizão iniciou planos para reprimir completamente o nosso movimento, e eles planejam usar qualquer coisa à sua disposição para nos deter, inclusive o sangue de nossos compatriotas."
 brazil.97.a:0 "Brats"
 brazil.98.t:0 "A Coalizão reprimiu nosso movimento!"
 brazil.98.d:0 "A Coalizão nos pegou. Muitos de nossos seguidores mais temidos e leais foram presos, alguns dos quais detêm influência significativa sobre o movimento, impedindo-nos de continuar com nossos planos como pretendíamos. Precisamos lançar o que planejamos AGORA!"
 brazil.98.a:0 "Todos às Armas"
 brazil.99.t:0 "Coalizão Anti-Monarquista caça monarquistas"
 brazil.99.d:0 "Alguns de nossos apoiadores mais leais foram forçados a confrontar forças antimonarquistas e, infelizmente, o resultado acabou sendo trágico, pois a maioria foi presa, com algumas baixas. Esses atos desprezíveis são um crime contra a humanidade!"
 brazil.99.a:0 "Eles pagarão por isso!"
 brazil.100.t:0 "A Bavária declarou independência!"
 brazil.100.d:0 "Algumas de nossas tropas estacionadas na Bavária entraram em contato conosco com urgência, afirmando que a Bavária se separou do país e declarou independência de nós! Nossa inteligência também detectou que a manipulação interna de [BRA.GetName] estava presente nessa operação e na secessão subsequente. \n\nO que devemos fazer?"
 brazil.100.a:0 "Ambos pagarão caro por isso!"
 brazil.100.b:0 "Não podemos nos dar a esse luxo."
 brazil.101.t:0 "O Golpe Imperial"
 brazil.101.d:0 "Finalmente, após muitos meses de planejamento cuidadoso e com o apoio de milhões de pessoas em todo o país, conseguimos abdicar à força do então líder Getúlio Vargas. \n\nAgora, com Veiga no poder, podemos começar a reestruturar o recém-estabelecido estado monárquico e escolher um imperador adequado como sucessor de Dom Pedro II para governar o novo império até a glória!"
 brazil.101.a:0 "Independência ou Morte!"
 brazil.103.t:0 "Independência da Baviera!"
 brazil.103.d:0 "A notícia de que a Bavária acaba de se separar da Alemanha e declarar independência percorreu o mundo! \n\nSentimentos nacionalistas têm crescido na Bavária nos últimos meses, com muitas fontes apontando [BRA.GetName] como o culpado. Considerando a situação atual da Alemanha, tanto os brasileiros quanto os bávaros viram nisso a oportunidade perfeita.\n\nEssa situação está quase garantida para aumentar, mas, por enquanto, tudo o que podemos fazer é esperar para ver."
 brazil.103.a:0 "Interessante"
 brazil.103.b:0 "Até que enfim!"
 brazil.103.c:0 "Eles vão pagar por isso!"
 brazil.104.t:0 "A Restauração do Império do Brasil"
 brazil.104.d:0 "O Império original foi dissolvido em 1889, com o último líder sendo Dom Pedro II. Agora, quase cinco décadas depois, o sucessor do império original foi oficialmente declarado há poucas horas, reivindicando o trono original do império. \n\nO Segundo Império Brasileiro demonstrou ter planos bastante ambiciosos, principalmente para trazer o império de volta à sua antiga glória.\n\nA existência de um império mais uma vez na América do Sul levantou preocupações em muitas nações americanas, principalmente nos Estados Unidos, mas até o momento eles permanecem apenas vigilantes da situação."
 brazil.104.a:0 "Ahh, legal"
 brazil.104.b:0 "Avé Gloria, Avé Imperio"
 brazil.105.t:0 "A União do Brasil e da Bavária"
 brazil.105.d:0 "Foi confirmado que o Segundo Império Brasileiro e o Reino da Bavária se uniram para formar o Reino do Brasil e da Bavária. \n\nMuitas nações especulam sobre o que fazer com essa situação, e outras ainda ficam com uma pergunta muito importante: Devemos tratar essa nova entidade como um aliado ou um inimigo?"
 brazil.105.a:0 "Ok"
 
 ## EUYL
 EUYL.1.t:0 "[USA.GetName] Nos dá 3 anos para declarar guerra contra o Eixo"
 EUYL.1.d:0 "[USA.GetLeader] entrou em contato conosco com um aviso severo para nossa nação, dizendo que, se não declararmos guerra às potências do Eixo e não nos juntarmos ao lado delas na guerra, haverá sérias consequências.\n\nEstamos recebendo 3 anos para decidir nosso destino nesse tópico: ou obedecemos e declaramos guerra aos alemães ou ignoramos e enfrentamos uma possível invasão americana."
 EUYL.1.a:0 "Devemos ter cuidado com o [USA.GetAdjective]"

 EUYL.2.t:0 "Não conseguimos atingir nossos objetivos de guerra"
 EUYL.2.d:0 "Nossos inimigos resistiram com muita força e nossos objetivos originais foram por água abaixo. \n\nNosso povo está tomando as ruas para protestar contra nossa expansão fracassada, e precisamos tomar uma decisão rapidamente. Devemos baixar nossas armas?"
 AELE.2.a:0 "Nós nos rendemos"
 AELI.2.b:0 "Devemos continuar"

 AELE.3.t:0 "[FROM.GetName] Baixou as armas"
 EUYL.3.d:0 "Fomos notificados de que [FROM.GetName] decidiu interromper todos os avanços em nosso território e cessar seu ataque. Eles até concordaram em entregar o território que conquistamos deles. \n\nNossa resistência feroz valeu a pena, e agora somos nós que estamos saindo vitoriosos!"
 EUYL.3.a:0 "SOMOS MELHORES!"

 ## NOVO CONTEÚDO DLC ##
 argentina.dlc.1.t:0 "Pequena marcha fascista em [FROM.FROM.GetName]"
 argentina.dlc.1.d:0 "Apesar de grandes preparativos terem sido feitos para realizar uma marcha massiva, apenas algumas pessoas compareceram à marcha em [FROM.FROM.GetName]. Só temos que esperar que mais pessoas participem da próxima."
 argentina.dlc.1.a:0 "Droga"
 argentina.dlc.2.t:0 "Marcha fascista em [FROM.FROM.GetName]"
 argentina.dlc.2.d:0 "A marcha em [FROM.FROM.GetName] acabou sendo um sucesso, pois muitas pessoas apareceram para elogiar as ideias do fascismo e expressar sua solidariedade à ideologia."
 argentina.dlc.2.a:0 "Ótimo!"
 argentina.dlc.3.t:0 "Grande marcha fascista em [FROM.FROM.GetName]"
 argentina.dlc.3.d:0 "O que foi originalmente planejado para ser uma marcha de tamanho decente em [FROM.FROM.GetName] acabou se tornando uma marcha enorme. Foi muito melhor do que todos esperavam!"
 argentina.dlc.3.a:0 "Isso é fantástico!"
 argentina.dlc.4.t:0 "Oposição forçada a se render"
 argentina.dlc.4.d:0 "Recebemos uma notificação oficial de Marcelo T. de Alvear, líder da resistência do governo anit, declarando sua rendição oficial e desistindo de qualquer tipo de confronto. Ele também prometeu que não haverá mais hostilidades daqui para frente."
 argentina.dlc.4.a:0 "Parece que eles aprenderam a lição"
 argentina.dlc.5.t:0 "Vários setores da oposição se unem contra nós"
 argentina.dlc.5.d:0 "Depois de assumir o controle total da nação, muitas das partes mais democráticas da Concordância, a UCR, os socialistas e até mesmo alguns comunistas se uniram para formar uma coalizão contra nosso governo atual, e nossa inteligência descobriu que eles estão planejando uma revolta em grande escala para nos remover à força do poder!"
 argentina.dlc.5.a:0 "Eles pagarão com seu sangue!"
 argentina.dlc.6.t:0 "Leopoldo Lugones se oferece para tomar o poder"
 argentina.dlc.6.d:0 "Depois de entrar para as fileiras do governo, muitas pessoas começaram a idolatrar o modo de pensar de Lugones e, recentemente, ele reuniu um apoio maciço. Devido a esse grande apoio público, Lugones veio até nós, oferecendo-se para assumir o poder em nosso lugar e liderar a Argentina. Ele acredita que, com seu apoio, será um candidato melhor para conduzir a nação ao seu potencial máximo."
 argentina.dlc.6.a:0 "Sabe de uma coisa? Claro, por que não?"
 argentina.dlc.6.b:0 "...você está louco? Claro que não!"
 
 ## Ecuador ##
 ecu.1.t:0 "Gallo é promovido à liderança suprema"
 ecu.1.d:0 "Após a tentativa de Páez de prolongar a sua posição de poder, o exército decidiu colocar Alberto Enriquez Gallo no poder. Os militares acreditam que as suas crenças profundamente enraizadas na democracia e na liberdade garantirão a democracia no país. \n\nAlém da súbita mudança de poder, o exército também dissolveu a Assembleia Constituinte para controlar mais eficazmente a nação."
 ecu.1.a:0 "Ok"
 ecu.2.t:0 "A inflação atinge a economia equatoriana"
 ecu.2.d:0 "A inflação atingiu a nossa economia, aumentando os preços e diminuindo o valor da nossa moeda. Ninguém previu isso também. O banco central está a lutar para resolver a crise financeira que agora está presente no país!"
 ecu.2.a:0 "Isso é ruim..."
 ecu.3.t:0 "Assembleia Constituinte Depõe [ROOT.GetLeader]"
 ecu.3.d:0 "A Assembleia Constituinte reuniu-se hoje depois de analisar a situação crítica. Eles consideraram que [ROOT.GetLeader] não estava preparado para a tarefa de liderar a nação e será demitido do cargo. A partir de hoje , a Assembleia assumirá o poder."
 ecu.4.t:0 "Os comunistas vencem as eleições nacionais"
 ecu.3.a:0 "Ah, droga"
 ecu.4.d:0 "Depois de grande parte da população ter exigido eleições, os resultados trouxeram uma vitória retumbante para o partido comunista. Tanto o partido Conservador como o Liberal, que governaram o país durante a grande maioria do seu tempo , não posso acreditar neste resultado e recusar-me a aceitar um governo totalitário comunista no poder.\n\nPrecisamos manter os bipartidários sob controle antes que eles tentem novamente."
 ecu.4.a:0 "Fantástico!"
 ecu.5.t:0 "Protestos contra a mobilização"
 ecu.5.d:0 "Depois que [ROOT.GetLeader] apelou à mobilização contra a crescente ameaça [PRU.GetAdjective], muitos equatorianos recusaram e até começaram a protestar contra ela. Se o [PRU.GetAdjective] souber disso, nós estará em sérios apuros."
 ecu.5.a:0 "Eles não percebem a gravidade da situação???"
 ecu.6.t:0 "Assembleia Constituinte em conflito com [ROOT.GetLeader]"
 ecu.6.d:0 "Depois que [ROOT.GetLeader] assumiu o poder. Muitos membros da assembleia começaram a questionar as suas capacidades e ideais de liderança. Isto causou agora uma divisão entre o presidente do país e a Assembleia Constituinte."
 ecu.6.a:0 "Ótimo... exatamente o que precisávamos"
 ecu.8.t:0 "Aurelio Mosquera Narváez encontrado morto"
 ecu.8.d:0 "Aurélio faleceu tragicamente. No entanto, uma mortalha de mistério envolve sua morte, pois as fontes não podem confirmar se foi por suicídio ou se foi homicídio. De qualquer forma, hoje nós lamentar a morte de um grande líder, que tinha um futuro brilhante pela frente."
 ecu.8.a:0 "Que ele descanse em paz"
 ecu.9.t:0 "[FROM.GetName] está disposto a abandonar suas reivindicações de proteção"
 ecu.9.d:0 "Delegados de [FROM.GetName] chegaram ao nosso escritório para discutir o potencial de um acordo de paz finalizado entre nós dois. Eles estão dispostos a abandonar todas as suas reivindicações em nosso território em troca de nossa proteção sobre eles. \n\nAceitar isso significaria que não haverá hostilidades entre os dois.
 ecu.9.a:0 "Claro, vamos deixar nossas diferenças de lado"
 ecu.9.b:0 "KKKKKKKK, como se fossemos simplesmente esquecer o que vocês fizeram conosco!"
 ecu.10.t:0 "[FROM.GetName] está se oferecendo para nos colocar sob sua proteção"
 ecu.10.d:0 "Respeitados generais de [FROM.GetName] chegaram ao nosso escritório para discutir o potencial de se tornarem súditos deles em troca de sua proteção total sobre nossa soberania. \n\nAceitar isso converteria transformar-nos num estado satélite deles. Devemos aceitar estes termos?"
 ecu.10.a:0 "...Tudo bem"
 ecu.10.b:0 "Seus idiotas só querem nos usar!"
 ecu.11.t:0 "[FROM.GetName] está propondo uma união entre nossos países"
 ecu.11.d:0 "Delegados de [FROM.GetName] chegaram ao nosso escritório para discutir uma potencial união entre nossos países, considerando nossas semelhanças em pessoas e cultura. \n\nDevemos aceitar e formar a União Colombo-Equatoriana ?"
 ecu.11.a:0 "Claro"
 ecu.11.b:0 "Gostaríamos de continuar sendo um país, então não"
 ecu.12.t:0 "[FROM.GetName] está exigindo direitos sobre nossos recursos"
 ecu.12.d:0 "[FROM.GetName] nos enviou um ultimato para entregar a eles o acesso aos nossos recursos em todo o país. Não fazer isso pode resultar em uma invasão de terras em grande escala de [FROM.GetName] .\n\nO que devemos fazer?"
 ecu.12.a:0 "Será que temos escolha?"
 ecu.12.b:0 "Venha e tire isso de nós, vamos ver quanto sangue você está disposto a derramar!"
 ecu.13.t:0 "[FROM.GetName] está buscando relações diplomáticas perigosas"
 ecu.13.d:0 "Recebemos notícias de que [FROM.GetName] tem adoptado uma política externa bastante perigosa, alinhando-se com as principais potências fascistas. Se os deixarmos continuar assim, as potências fascistas poderão obter uma posição segura nossa terra natal.\n\nComo devemos proceder?"
 ecu.14.t:0 "Velasco Ibarra retorna ao Equador"
 ecu.14.d:0 "Velasco chegou hoje depois de permanecer alguns anos em Buenos Aires. Muitas pessoas já começaram a elogiar seu retorno e a chamá-lo de verdadeiro salvador do país. Apesar de sua presidência bastante curta, a situação política de o país não tem sido dos mais estáveis e as pessoas podem olhar para ele como uma oportunidade de sair desta confusão."
 ecu.14.a:0 "Bem-vindo de volta, Velasco"
 ecu.14.b:0 "Negar sua entrada"
 ecu.15.t:0 "Um visitante estranho aparece em nosso escritório"
 ecu.15.d:0 "Pouco depois de tomar o poder sobre o país, um homem estranho chegou ao nosso escritório. Explicou a sua situação e como é filho do actual rei de Espanha, que na altura vivia em Itália , no entanto, viu a nossa nação como uma oportunidade de escapar e potencialmente estabelecer-se adequadamente. Ele afirma que a nossa nação mantém uma ligação estranhamente forte com a casa de Borbon, e ele pode fazer muitas coisas grandes se permitirmos. fazemos com ele?"
 ecu.15.a:0 "Ele pode ficar, talvez esse plano dele possa se concretizar"
 ecu.15.b:0 "Não conhecemos você"
 ecu.16.t:0 "Velasco começa a ganhar apoio nacional"
 ecu.16.d:0 "O pior cenário começou a acontecer, à medida que as pessoas em todo o país começaram a se reunir em torno de Velasco, vendo-o como a única graça salvadora para o país. \n\nComo se isso não fosse ruim chega, os Carabineros também começaram a apoiar Velasco e a se mobilizar contra [ROOT.GetLeader]. \n\nPrecisamos agir e rápido!"
 ecu.16.a:0 "Vá para o inferno, idiota!"
 ecu.17.t:0 "Protesto Pró-Velasquist em [FROM.FROM.GetName]"
 ecu.17.d:0 "Recebemos a notícia de que um comício pró-Velasquist foi realizado em [FROM.FROM.GetName], que recebeu grande atenção e apenas exasperou o apoio de Velasco em todo o país."
 ecu.17.a:0 "Ótimo..."
 ecu.18.t:0 "La Gloriosa"
 ecu.18.d:0 "O povo está farto de [ROOT.GetLeader] e exige que ele deixe o poder imediatamente, permitindo que Velasco assuma o poder. Velasquistas de todo o país estão veementemente contra nosso governo e estão dispostos a derramar sangue se isso significar que Velasco assume o poder \n\nComo devemos lidar com esta situação terrível?"
 ecu.18.a:0 "Devemos recuar..."
 ecu.18.b:0 "Em seus sonhos!"
 ecu.19.t:0 "Velasco assume o poder"
 ecu.19.d:0 "Depois de restaurar temporariamente o controle do país, a junta provisória recuou oficialmente para permitir que Velasco Ibarra assumisse o controle da nação. Hoje é um dia maravilhoso para os Velasquistas, e nosso grande líder pode finalmente trazer este país adiante!"
 ecu.19.a:0 "Como as coisas deveriam ser"
 ecu.20.t:0 "[FROM.GetName] gostaria de formar uma facção conosco"
 ecu.20.d:0 "Delegados de [FROM.GetName] chegaram ao nosso escritório para discutir o potencial de formar uma aliança conosco. Eles acreditam que permanecer juntos, unidos, nos tornará invencíveis a qualquer ameaça externa. \n \nDevemos aceitar?"
 ecu.20.a:0 "Claro"
 ecu.20.b:0 "Não, desculpe"
 ecu.21.t:0 "[FROM.GetName] nos deu acesso a todos os seus recursos"
 ecu.21.d:0 "Recebemos notícias de que [FROM.GetName] nos permitiu gerenciar todos os seus recursos e usá-los como quisermos."
 ecu.21.a:0 "Fantástico!"
 ecu.22.t:0 "The United Fruit Company se oferece para assumir o poder"
 ecu.22.d:0 "Funcionários corporativos da Banana Company perceberam nosso interesse na empresa, bem como nossa fraca eficiência administrativa no país, e se ofereceram para assumir o controle do país. \n\nDevemos permitir isso ?"
 ecu.22.a:0 "Não temos escolha..."
 ecu.22.b:0 "Você NÃO tomará o poder!"
 ecu.23.t:0 "A Banana Company assume o controle do Equador"
 ecu.23.d:0 "O Equador recentemente não tem estado tão bem, sofrendo com uma guerra civil e uma crise política que logo se seguiu. Devido a tudo isso, a United Fruit Company decidiu resolver o problema por conta própria e tomar \n\nTer uma empresa administrando um país inteiro nunca foi visto antes, e isso pode significar um desastre se o dinheiro for a única coisa em que eles pensam."
 ecu.23.a:0 "Fantástico!"
 ecu.23.b:0 "Interessante"
 ecu.24.t:0 "A Formação do ARNE"
 ecu.24.d:0 "Recebemos a notícia de que Jorge Luna Yépes formou recentemente um novo partido fascista, a Acción Revolucionaria Nacionalista Ecuatoriana, baseando-se fortemente nas ideias do Falangismo em Espanha. Ganhou algum apoio e poderá podem revelar-se um espinho para o nosso lado se ganharem demasiada popularidade."
 ecu.24.a:0 "Ok"
 ecu.25.t:0 "Edmundo Chiriboga morto em combate"
 ecu.25.d:0 "Notícias trágicas chegaram ao nosso escritório, pois nossos soldados confirmaram que o respeitado general Edmundo Chiriboga foi morto em combate. Esse é o caso de muitos de nossos bravos soldados que lutam contra os miseráveis canalhas peruanos. Esperamos que ele finalmente encontrar a paz do outro lado."
 ecu.25.a:0 "Que descanse em paz"
 ecu.26.t:0 "Reino Unido do Equador, Peru e Bolívia"
 ecu.26.d:0 "A ideia de um reino surgindo na América do Sul definitivamente não estava na cabeça de muitos, mas hoje foi confirmado que o [ECU.GetName] foi formado, com [ECU .GetLeader] à frente de tudo Originário da Espanha, o membro da Casa de Borbon viu o Equador como uma chance de fazer brilhar tanto sua majestade quanto o país. \n\nCom o equilíbrio de poder nas Américas sendo fortemente alterado. a partir disso, só o tempo dirá como as outras nações reagirão."
 ecu.26.a:0 "Fantástico!"
 ecu.26.b:0 "Ok"
 ecu.27.t:0 "[PRU.GetName] bloqueou Guayaquil"
 ecu.27.d:0 "Recebemos relatos de que [PRU.GetName] bloqueou um dos nossos portos mais importantes, impedindo-nos de receber quaisquer mercadorias de países estrangeiros."
 ecu.27.a:0 "Bastardos!"
 
 ## PERU - ECUADOR ##
 peruecuador.1.t:0 "[FROM.GetName] militarizou a Pastaza Ocidental"
 peruecuador.1.d:0 "Fontes locais confirmaram que soldados [FROM.GetAdjective] invadiram Pastaza. Isso é uma violação direta do Status Quo assinado em 1936 e pode até ser classificado como uma declaração de guerra! \n\n nQual deveria ser a nossa resposta?"
 peruecuador.1.a:0 "Devemos militarizar também"
 peruecuador.1.b:0 "Este é um ato de guerra, devemos retaliar!"
 peruecuador.1.c:0 "Vamos esperar para ver como a situação se desenrola"
 peruecuador.2.t:0 "[FROM.GetName] também foi remilitarizado em resposta"
 peruecuador.2.d:0 "Depois que entramos em Pastaza para reforçar a linha de frente, fontes confiáveis confirmaram que [FROM.GetName] fez o mesmo na tentativa de neutralizar nossas ações."
 peruecuador.2.a:0 "Tudo bem"
 peruecuador.3.t:0 "[PRU.GetName] e [ECU.GetName] estão em guerra!"
 peruecuador.3.d:0 "Recebemos informações de que [PRU.GetName] e [ECU.GetName] estão em guerra devido a uma disputa territorial na região de Pastaza. \n\nEste será o primeiro grande conflito na América do Sul teve em quase 6 anos, no entanto, temos a chance de pará-lo a tempo e coincidir durante as negociações de paz.\n\nO que devemos fazer?"
 peruecuador.3.a:0 "Devemos garantir a paz em nosso continente!"
 peruecuador.3.b:0 "Por que deveríamos nos importar?"
 peruecuador.30.t:0 "[FROM.GetName] iniciou propostas de negociações de paz"
 peruecuador.30.d:0 "Delegados de [FROM.GetName] propuseram iniciar negociações de paz o mais rápido possível, a fim de evitar mais escalada de guerra."
 peruecuador.4.t:0 "As negociações de paz estão sobre nós"
 peruecuador.4.d:0 "Chegou o dia. Delegados de todo o continente, incluindo [BRA.GetName], [ARG.GetName] e [USA.GetName] estão esperando nossa resposta definitiva sobre a situação. Eles estão todos pressionando para que paremos esta guerra e mais uma vez estejamos em paz. \n\nEles garantiram que qualquer território atualmente sob nosso controle será traçado nas fronteiras oficiais.\n\nO que devemos fazer?
 peruecuador.4.a:0 "Vamos acabar com essa guerra"
 peruecuador.4.b:0 "Há uma disputa que ainda precisamos resolver!"
 peruecuador.5.t:0 "Ambas as nações concordaram com a paz"
 peruecuador.5.d:0 "Hoje é um ótimo dia! Foi recebida a confirmação de que ambas as nações estão dispostas a assinar um acordo de paz, encerrando oficialmente a guerra entre [PRU.GetName] e [ECU.GetName]."
 peruecuador.5.a:0 "Fantástico!"
 peruecuador.6.t:0 "Protocolo do Rio de Janeiro assinado"
 peruecuador.6.d:0 "Desde a queda da Grande Colômbia, tem havido uma disputa territorial entre [PRU.GetName] e [ECU.GetName], principalmente sobre o território de Pastaza, com ambas as nações reivindicando-o como seu Estas tensões fronteiriças acabaram por se transformar numa guerra em grande escala. Felizmente, graças à assinatura deste tratado de paz, a paz foi restaurada no continente da América do Sul. , pois a disputa ainda está muito presente."
 peruecuador.6.a:0 "Finalmente a paz"
 peruecuador.6.b:0 "Tudo bem"
 peruecuador.7.t:0 "Devemos nos retirar das terras equatorianas?"
 peruecuador.7.d:0 "Agora, com o fim da guerra, surge uma questão: devemos continuar a ocupar as terras equatorianas ou devemos devolvê-las ao Equador?\n\nQual será o resultado?"
 peruecuador.7.a:0 "Devolva para eles"
 peruecuador.7.b:0 "De jeito nenhum!"
 peruecuador.8.t:0 "[PRU.GetName] Retira-se de nossas Terras"
 peruecuador.8.d:0 "[PRU.GetName] retirou suas tropas de nosso território e mais uma vez temos a posse de nossas terras."
 peruecuador.8.a:0 "Bom"
 peruecuador.9.t:0 "[PRU.GetName] ainda ocupa nossas terras"
 peruecuador.9.d:0 "Tropas [PRU.GetAdjective] ainda estão presentes em nossas terras!\n\nO que devemos fazer?"
 peruecuador.9.a:0 "Apenas deixe pra lá"
 peruecuador.9.b:0 "Eles não vão escapar impunes!"
 peruecuador.10.t:0 "Operação Militar Bem Sucedida"
 peruecuador.10.d:0 "Nossas tropas conseguiram completar a operação militar designada! Podemos nos alegrar!"
 peruecuador.10.a:0 "Maravilhoso!"
 peruecuador.11.t:0 "Operação militar fracassada"
 peruecuador.11.d:0 "Infelizmente, nossas tropas não conseguiram completar as tarefas que lhes foram atribuídas."
 peruecuador.11.a:0 "Que chatice..."
 peruecuador.12.t:0 "Estamos preparados para lutar contra [ECU.GetName]"
 peruecuador.12.d:0 "Todos os preparativos foram feitos, podemos declarar guerra ao Equador!"
 peruecuador.12.a:0 "Vamos pegar o que é nosso!"
 peruecuador.13.t:0 "Conflito vitorioso em [FROM.FROM.GetName]"
 peruecuador.13.d:0 "Nossas tropas tiveram sucesso no combate ao inimigo em [FROM.FROM.GetName]. Graças a isso, ganhamos ainda mais informações sobre o inimigo!"
 peruecuador.14.t:0 "Derrota em [FROM.FROM.GetName]"
 peruecuador.14.d:0 "Infelizmente, a batalha que ocorreu não estava destinada a ser nossa vantagem. Nosso inimigo agora aumentou as informações sobre nós e, se não agirmos rápido, isso poderá significar nossa ruína!"
 peruecuador.140.t:0 "Vitória em [490.GetName]"
 peruecuador.140.d:0 "Conseguimos repelir com sucesso as tropas inimigas em [490.GetName]. \n\nIsso aumentará enormemente nosso esforço de guerra contra eles!"
 peruecuador.140.a:0 "Fantástico"
 peruecuador.15.d:0 "Delegados de [ECU.GetAdjective] chegaram ao nosso país para pedir nossa ajuda em seu inevitável conflito com [PRU.GetName].\n\nDevemos ajudá-los?"
 peruecuador.16.t:0 "Equador ocupou ilegalmente Piura!"
 peruecuador.16.d:0 "Recebemos notícias urgentes de que tropas [ECU.GetAdjective] entraram na província de Piura sem qualquer aviso! Esta é uma clara declaração de guerra e nossas tropas devem mobilizar efeito imediatamente!"
 peruecuador.16.a:0 "ELES NÃO VÃO SAPAR ISSO!"
 peruecuador.16.b:0 "Não podemos declarar guerra agora"
 peruecuador.17.t:0 "Equador lutando contra protestos anti-guerra"
 peruecuador.17.d:0 "Alguns de nossos espiões no Equador voltaram para nós afirmando que o país está passando por tempos difíceis devido à sua tentativa de mobilização em preparação para a guerra inevitável. Isto pode ser muito útil para nós, pois eles será desorganizado e aproveitaremos isso ao máximo!"
 peruecuador.17.a:0 "Perfeito, prepare a ofensiva!"
 peruecuador.18.t:0 "Vencedor da Guerra Peru-Equador"
 peruecuador.18.d:0 "Depois de muitos meses de batalhas horríveis, saímos vitoriosos do conflito. O que temos pela frente é um futuro brilhante, brilhando com a alegria de nossa conquista militar vitoriosa!"
 peruecuador.18.a:0 "Incrível!"
 peruecuador.19.t:0 "Perdedor da Guerra Peru-Equador"
 peruecuador.19.d:0 "Apesar de dar tudo o que tínhamos, fomos derrotados. É apenas uma questão de tempo até que as consequências comecem a acontecer."
 peruecuador.19.a:0 "Nada bom! Nada bom!"
 peruecuador.20.t:0 "Resultado inconclusivo da guerra Peru-Equador"
 peruecuador.20.d:0 "A guerra resultou em um resultado bastante inconclusivo, e nenhum dos lados foi realmente capaz de dizer que foi o 'vencedor'."
 peruecuador.20.a:0 "Acho que... está tudo bem?"
 peruecuador.21.t:0 "[PRU.GetName] iniciou uma guerra de fronteira em [490.GetName]"
 peruecuador.21.d:0 "O aumento da atividade das tropas não foi apenas para exibição, já que [PRU.GetAdjective] iniciou um conflito fronteiriço em grande escala na província de [490.GetName]. Devemos reforçar e rápido!"
 chile.430.t:0 "[FROM.GetName] está exigindo [270.GetName]"
 chile.430.d:0 "Recebemos uma demanda de [FROM.GetName] para entregar a posse de [270.GetName]. Não fazê-lo resultará em consequências sérias. \n\nComo devemos proceder com isso?"
 chile.430.a:0 "Deixe-os ficar com isso"
 chile.430.b:0 "A ilha permanecerá BRITÂNICA"

 chile.51.t:0 "Golpe Fascista no Chile!"
 chile.51.d:0 "[CHL.GetName] viu uma mudança recente para uma política mais de direita nos últimos meses. Enquanto a maioria presumiu que essa mudança permaneceria política e democrática, muitos ficaram chocados ao descobrir que o país passou por um golpe de estado repentino e brutal para derrubar o governo democrático no lugar de um fascista. \n\nOs nacistas, como eles se autodenominam, são extremistas que buscam nada mais do que trazer ordem e justiça ao Chile, enquanto espalham o medo entre seus vizinhos."
 chile.51.a:0 "Um aliado muito útil, de fato"
 chile.51.b:0 "Que perigoso. Que triste."
 chile.51.c:0 "O Chile será grande mais uma vez!"

 ecu.28.t:0 "[FROM.GetName] está pedindo acesso militar em Galápagos"
 ecu.28.d:0 "Devido à recente altercação com [JAP.GetName], o [FROM.GetName] está solicitando acesso militar e naval em [649.GetName], pois acredita que é um ponto estratégico para manter. Devemos permitir?"
 ecu.28.b:0 "De jeito nenhum!"

 ecu.29.t:0 "O Peru militarizou [490.GetName]!"
 ecu.29.d:0 "Relatórios inundaram nossa sede nos alertando sobre a presença militar peruana na província de [490.GetName]. \n\nComo devemos responder a essa ameaça potencial à nossa soberania?"
