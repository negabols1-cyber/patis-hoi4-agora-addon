 URG_escuela_militar:0 "Escuela Militar"
 URG_escuela_militar_desc:0 "A Escuela Militar é o instituto encarregado de formar os oficiais do Exército Nacional. Foi fundada em 25 de agosto de 1885, na sequência de um projeto de lei apresentado em 31 de março de 1884 pelo deputado Ventura Fernández. As reformas recentes incluíram a adição de ano de estudos preparatórios, permitindo aos nossos novos oficiais uma melhor educação e as competências necessárias para conduzir os nossos exércitos à grandeza."
 URG_naval_expenses:0 "Aumento das despesas navais"
 URG_foreign_advisors:0 "Assessores Estrangeiros"
 URG_new_airforce:0 "Nova Força Aérea"
 URG_merchant_navy:0 "Expandiu a Marinha Mercante"
 URG_ley_9943:0 "Ley nº 9943"
 URG_ley_9943_desc:0 "Todos os uruguaios têm a obrigação de defender militarmente a República e cumprir o regime jurídico de formação militar que os habilita a fazê-lo."
 URG_farming_subsidized:0 "Agricultura subsidiada"
 URG_INC:0 "INC"
 URG_brou_reformed:0 "BROU Reformada"
 URG_building_grants_idea:0 "Subsídios para construção"
 URG_maintain_status_quo:0 "Economia Agrária"
 URG_maintain_status_quo2:0 "Economia Agrária"
 URG_welfare_state:0 "Estado de bem-estar reformado"
 URG_welfare_state_desc:0 "Datando a segunda presidência de José Batlle y Ordóñez, o sistema atual inclui benefícios completos de desemprego e pensões para os idosos e deficientes. Este sistema permitiu ao governo ganhar o apoio da classe mais baixa, mas também limita o orçamento que o governo pode gastar."
 URG_welfare_state1:0 "Estado de bem-estar reformado"
 URG_welfare_state1_desc:0 "Desde a segunda presidência de José Batlle y Ordóñez, o sistema atual inclui benefícios de desemprego completos e pensões para idosos e deficientes. Reformas recentes removeram alguns benefícios menores, o que liberou parte do orçamento para outros assuntos enquanto ainda manter uma boa opinião sobre os programas do estado."
 URG_welfare_state2:0 "Reformed Welfare State"
 URG_welfare_state2_desc:0 "Desde a segunda presidência de José Batlle y Ordóñez, o sistema atual inclui benefícios totais de desemprego e pensões para idosos. Reformas recentes removeram alguns benefícios, o que liberou parte do orçamento para outros assuntos. quantidade de pessoas desapontadas com nosso governo, mas a maioria da população ainda apóia os programas."
 URG_welfare_state3:0 "Reformed Welfare State"
 URG_welfare_state3_desc:0 "Desde a segunda presidência de José Batlle y Ordóñez, o sistema atual inclui subsídios de desemprego completos. Reformas recentes removeram a maioria dos benefícios, o que liberou muito do orçamento para outros assuntos. As pessoas estão um tanto desiludidas com nosso governo sobre nossos decisões sobre os programas de bem-estar, mas ainda recebe apoio de parte da população que precisa deles."
 URG_welfare_state4:0 "Reação política"
 URG_welfare_state4_desc:0 "A abolição do estado de bem-estar social gerou uma séria reação política de todos os partidos da nação, mas especialmente do setor batllista do partido Colorado e dos socialistas. Os batllistas veem isso como uma traição ao legado de Batlle, que lutou tanto para acabar com as guerras civis e trazer prosperidade para a nação, enquanto os socialistas veem isso como um ataque à classe trabalhadora."
