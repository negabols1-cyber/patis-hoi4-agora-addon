 PAR_worn_out_army:0 "Exército Desgastado"
 PAR_worn_out_army_desc:0 "Acabamos de sair de uma guerra sangrenta de três anos contra a Bolívia, então, embora tenhamos saído vitoriosos, nossos exércitos estão exaustos."
 PAR_stagnated_economy:0 "Economia Estagnada"
 PAR_stagnated_economy_desc:0 "§REsta ideia será removida quando 100% da sua indústria for subsidiada!§!"
 PAR_victor_of_the_chaco_war:0 "Vencedor da Guerra do Chaco"
 PAR_victor_of_the_chaco_war_desc:0 "A Guerra do Chaco foi travada de 1932 a 1935 entre a Bolívia e o Paraguai, pelo controle da parte norte da região do Gran Chaco. O Paraguai acabou vitorioso neste encontro militar, e por isso o povo está mais patriótico do que nunca. \n\n§RPerder o controle sobre o Chaco removerá esse espírito nacional!§!"
