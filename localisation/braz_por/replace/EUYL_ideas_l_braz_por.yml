 ARG_infantry_production:0 "Produção de Equipamentos de Infantaria"
 ARG_infantry_production_desc:0 "Graças aos nossos esforços, agora podemos produzir equipamentos de infantaria a um preço mais barato e com mais eficiência."
 ARG_drift_back_towards_the_confederation_idea:0 "Volta para a Confederação"
 ARG_drift_back_towards_the_confederation_idea_desc:0 "A população está acordando. Quando for a hora certa, vamos atacar!"
 ARG_death_to_the_Unitarios:0 "Morte aos Unitários"
 ARG_death_to_the_Unitarios_desc:0 "Abaixo os Unitarios! Preferimos morrer a desistir do nosso destino!"
 ARG_death_to_the_Federales:0 "Morte aos Federais"
 ARG_death_to_the_Federales_desc:0 "Abaixo os Federais! Não vamos deixar nosso país ser dominado por esses traficantes de guerra!"
 ARG_viva_la_confederacion:0 "Viva La Confederación"
 ARG_viva_la_confederacion_desc:0 "Somos a graça salvadora da Argentina, somos o que fará o país avançar e transformá-lo em uma potência regional e talvez até uma superpotência, somos ótimos. Viva La Confederacion!"
