 rural_economy:0 "Economia Rural"
 rural_economy_desc:0 "A economia brasileira ainda está longe de ser industrializada. A grande maioria dela depende da agricultura e das plantações de café. Embora isso ajude com nossas exportações, precisamos industrializar logo ou então ficaremos para trás com a industrialização de outros países e rapidamente."
