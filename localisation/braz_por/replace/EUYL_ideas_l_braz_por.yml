 BRA_scars_of_the_1930_revolution:0 "Cicatrizes da Revolução de 1930"
 BRA_scars_of_the_1930_revolution_desc:0 "A Revolução de 1930 ainda está na memória muito recente da maioria dos brasileiros. O sangue e o caos político que dela emergiu não serão esquecidos tão rapidamente e nosso povo ainda está cansado de que algo semelhante aconteça.\n\n§RIse você declarar guerra a um país estrangeiro enquanto ainda tiver esse espírito nacional, uma guerra civil será desencadeada!§!"
