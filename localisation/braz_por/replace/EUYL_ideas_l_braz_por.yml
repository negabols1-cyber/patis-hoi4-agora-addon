 CHL_ASMAR:0 "ASMAR"
 CHL_ASMAR_desc:0 "ASMAR (Astilleros y Maestranzas de la Armada de Chile) é uma empresa estatal de construção naval chilena, cujo antecessor foi fundado em 1895, até ser reestruturado e adaptado ao nome atual em 6 de abril de 1960."
 CHL_FAMAE:0 "FAMAE"
 CHL_FAMAE_desc:0 "FAMAE (Fábricas y Maestranzas del Ejército, "Fábricas e Oficinas do Exército") é um fabricante de armas de fogo estatal chileno. Seus produtos são usados ​​pelas forças armadas chilenas e pela força policial de Carabineros. A empresa produz, entre outros a carabina FAMAE CT-30, metralhadora FAMAE SAF, rifle sniper FAMAE FD-200, lançador de foguetes Rayo e revólver FAMAE."
 CHL_communists_political_power:0 "Cooperação política comunista"
 CHL_communists_political_power_desc:0 "Devido às demandas bastante intensas dos comunistas, eles decidiram oferecer ajuda temporária ao nosso governo."
