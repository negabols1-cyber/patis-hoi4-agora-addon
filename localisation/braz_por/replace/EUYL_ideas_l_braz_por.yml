 south_american_armament:0 "Construindo o Exército [ROOT.GetAdjective]"
 south_american_armament_desc:0 "Ameaças estão surgindo ao nosso redor, e nosso exército não está preparado para lidar com essas ameaças. Precisamos começar a construir nosso exército e permitir que ele chegue a um estado onde possamos nos defender de qualquer ameaça estrangeira , ou derrotar qualquer nação que consideremos uma ameaça. Assim que nosso exército chegar a esse estado, ninguém vai nos enfrentar!"
