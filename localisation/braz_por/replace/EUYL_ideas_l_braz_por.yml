 ARG_enzo_bordabehere:0 "Enzo Bordabehere"
 ARG_juan_domingo_peron:0 "Juan Domingo Peron"
 ARG_fm:0 "Dirección General de Fabricaciones Militares"
 ARG_fm_desc:0 "Fabricaciones Militares, o nome completo é Fabricaciones Militares Sociedad del Estado, é um fabricante de armas estatal argentino com sede em Buenos Aires. A empresa era uma agência governamental sob o nome de Dirección General de Fabricaciones Militares (Diretoria Geral de Indústrias Militares). Fundada em 1941, ao longo dos anos a empresa se diversificou em diferentes áreas como mineração, petróleo, material rodante e petroquímica. A empresa está sob a direção do Ministério da Defesa da Argentina."
 ARG_fm_material:0 "Dirección General de Fabricaciones Militares"
 ARG_fm_material_desc:0 "Fabricaciones Militares, o nome completo é Fabricaciones Militares Sociedad del Estado, é um fabricante de armas estatal argentino com sede em Buenos Aires. A empresa era uma agência governamental sob o nome de Dirección General de Fabricaciones Militares (Diretoria Geral de Indústrias Militares). Fundada em 1941, ao longo dos anos a empresa se diversificou em diferentes áreas como mineração, petróleo, material rodante e petroquímica. A empresa está sob a direção do Ministério da Defesa da Argentina."
 ARG_fm_air:0 "Dirección General de Fabricaciones Militares"
 ARG_fm_air_desc:0 "Fabricaciones Militares, o nome completo é Fabricaciones Militares Sociedad del Estado, é um fabricante de armas estatal argentino com sede em Buenos Aires. A empresa era uma agência governamental sob o nome de Dirección General de Fabricaciones Militares (Diretoria Geral de Indústrias Militares). Fundada em 1941, ao longo dos anos a empresa se diversificou em diferentes áreas como mineração, petróleo, material rodante e petroquímica. A empresa está sob a direção do Ministério da Defesa da Argentina."
 ARG_ypf:0 "Yacimientos Petrolíferos Fiscais"
 ARG_ypf_desc:0 "YPF S.A. (Yacimientos Petrolíferos Fiscales; Inglês: "Fiscal Oilfields") é uma empresa de energia argentina verticalmente integrada, envolvida na exploração e produção de petróleo e gás, e no transporte, refino e comercialização de gás e produtos petrolíferos. 2020 Forbes Global 2000, a YPF foi classificada como a 1360ª maior empresa pública do mundo. Fundada em 1922 sob a administração do presidente Hipólito Yrigoyen, a YPF foi a primeira empresa petrolífera estabelecida como empresa estatal fora da União Soviética e o primeiro estado petrolífera para se tornar verticalmente integrada."
 ARG_invested_in_the_mining_industry:0 "Investido na Indústria de Mineração"
 ARG_inflation_1:0 "Inflação muito mínima"
 ARG_inflation_1_desc:0 "Nossa inflação se estabilizou a um ponto em que seus efeitos negativos são insignificantes. Se continuarmos do jeito que estamos, conseguiremos nos livrar totalmente dessa praga que é a inflação."
 ARG_inflation_2:0 "Inflação Mínima"
 ARG_inflation_2_desc:0 "Nossa inflação está indo muito bem agora, e os efeitos negativos não são muito sentidos. Devemos continuar, pois podemos melhorar nossa situação inflacionária atual e nos livrar totalmente da nossa inflação."
 ARG_inflation_3:0 "Leve Inflação"
 ARG_inflation_3_desc:0 "Nossa inflação poderia ser melhor, mas está decentemente boa agora. Precisamos continuar com nossos esforços para controlar a inflação se não quisermos que ela saia do controle e arruine a economia."
 ARG_inflation_4:0 "Inflação moderada"
 ARG_inflation_4_desc:0 "Nossa inflação não é grande, simplesmente não há como negá-la. Temos que começar a tomar medidas para controlá-la antes que ela saia do controle. Se ficarmos com preguiça, ela voltará para nos morder."
 ARG_inflation_5:0 "Sobre a inflação"
 ARG_inflation_5_desc:0 "Nossa inflação chegou a um ponto que muitos de nossos assessores econômicos estão preocupados. O que quer que estejamos fazendo, temos que parar e focar no controle da inflação. Não podemos deixá-la escapar de nossas mãos."
 ARG_inflation_6:0 "Inflação moderadamente severa"
 ARG_inflation_6_desc:0 "Nossa inflação atual está começando a afetar o argentino médio, com muitos abandonando a moeda atual e usando o dólar americano. Temos que agir e rápido para que isso não continue mais."
 ARG_inflation_7:0 "Inflação severa"
 ARG_inflation_7_desc:0 "Muitos consultores econômicos externos estão nos alertando que a inflação está rapidamente atingindo um estado incontrolável. Precisamos fazer algo neste instante, a menos que queiramos que nossa economia seja engolida pela inflação."
 ARG_inflation_8:0 "Inflação muito severa"
 ARG_inflation_8_desc:0 "Nossa inflação está atingindo um estado crítico. As empresas estão perdendo ganhos monetários rapidamente, muitas pessoas estão ganhando menos, e os preços estão subindo vertiginosamente. Muitas pessoas já estão abandonando nossa moeda e usando outra, o que está piorando ainda mais a situação ."
 ARG_inflation_9:0 "Inflação Descontrolada"
 ARG_inflation_9_desc:0 "Nossa inflação chegou a um ponto quase sem retorno. Tornou-se tão ruim que as empresas estão sendo fechadas por não receberem dinheiro suficiente para manter seus negócios. Isso tem que parar, e agora!"
 ARG_inflation_10:0 "Hiper Inflação"
 ARG_inflation_10_desc:0 "Nossa inflação chegou a um ponto sem retorno. A menos que encontremos um milagre e rápido, nossa economia vai afundar e nosso país vai por água abaixo. Que alguém nos salve!"
 ARG_trying_to_control_inflation:0 "Está tentando controlar a inflação"
 aresnal_naval_belgrano:0 "Arsenal Naval Puerto Belgrano"
 aresnal_naval_belgrano_desc:0 "Puerto Belgrano Base Naval (espanhol: Base Naval Puerto Belgrano - BNPB) é a maior base naval da Marinha Argentina, situada próximo a Punta Alta, perto de Bahía Blanca, cerca de 560 km (348 mi) ao sul de Buenos Aires. Tem o nome do bergantim General Belgrano (em homenagem a Manuel Belgrano) que sondou a área no final de 1824. Projetado pelo engenheiro italiano Luis Luiggi, Puerto Belgrano foi inaugurado em 30 de novembro de 1896 sob o nome de Puerto Militar (Inglês: Porto Militar). Em 1911, a empresa ferroviária francesa Ferrocarril Rosario y Puerto Belgrano abriu uma linha de bitola larga (1,70 m) entre Puerto Belgrano e Rosario. O porto foi renomeado Puerto Belgrano em 1923."
 astillero_rio_santiago:0 "AFNE"
 astillero_rio_santiago_desc:0 "O Estaleiro Rio Santiago é um estaleiro localizado na cidade de Ensenada, Província de Buenos Aires, às margens do Rio Santiago. Foi um dos principais estaleiros ativos e importantes da América Latina. Fundado em 1953, tem realizou diversas funções nos setores naval, industrial e ferroviário. Em sua época áurea o estaleiro chegou a 8.000 trabalhadores em dupla jornada."
 great_south_american_war_name:0 "A Grande Guerra Sul-Americana"
 great_south_american_war_name_desc:0 "Depois de várias lutas e batalhas eclodirem entre várias nações sul-americanas, é claro que uma grande guerra, sem dúvida, começou. Vamos vencer esta guerra, não importa o custo!"
 ARG_fm_industrial:0 "Direção Geral de Fabricações Militares e Industriais"
 ARG_fm_industrial_desc:0 "Fabricaciones Militares, o nome completo é Fabricaciones Militares Sociedad del Estado (Corporação Estatal de Indústrias Militares em espanhol), é uma fabricante de armas estatal argentina com sede em Buenos Aires. A empresa era uma agência governamental sob o nome de Dirección General de Fabricaciones Militares (Diretoria Geral de Indústrias Militares). Fundada em 1941, ao longo dos anos a empresa se diversificou em diferentes áreas, como mineração, petróleo, material rodante e petroquímica. A empresa está sob a direção do Ministério da Defesa da Argentina."
