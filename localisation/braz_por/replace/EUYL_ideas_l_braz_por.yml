 URG_rodney_arismendi:0 "Rodney Arismendi"
 URG_serafino_mazzolini:0 "Serafino Mazzolini"
 URG_debt_repayment_in_progress:0 "Reembolso de dívida em andamento"
 URG_the_terra_dictatorship:0 "A Ditadura da Terra"
 URG_the_terra_dictatorship_idea:0 "A Ditadura da Terra"
 URG_the_terra_dictatorship_idea_desc:0 "Gabriel Terra tem governado a nação com mão de ferro desde que assumiu o poder. Devido a isso, muitos inimigos foram feitos ao longo do caminho, e muitos deles foram derrotados prendendo-os. transformou a ditadura em uma ditadura frágil, onde no segundo Terra deixar de governar com brutalidade, o país queimará em chamas. \n\n§REsta NÃO é a ideia oficial, isso é apenas um espaço reservado para dizer o que está acontecendo, essa ideia será removida no dia seguinte.§!"
 URG_ancap_concern:0 "ANCAP"
 URG_ancap_concern_desc:0 "ANCAP (abreviação de Administración Nacional de Combustibles, Alcohol y Portland) é uma indústria petrolífera criada em 1931 por Gabriel Terra. Apesar do tipo de indústria que é, também se concentra no controle dos monopólios das indústrias de álcool e combustíveis. Essa indústria mudará dependendo de quais decisões tomarmos com nosso governo."
 URG_safu:0 "Sociedade Anónima Fabril Uruguaia"
 URG_ute:0 "Usinas e Transmissões Elétricas"
 URG_ute_desc:0 "A Administração Nacional de Centrais Elétricas e Transmissão Elétrica, mais conhecida pela sigla UTE, é a empresa estatal encarregada da produção e fornecimento de energia elétrica no Uruguai. Criada em 21 de outubro de 1912, quando foi promulgada uma lei que dava ascensão a esta empresa pública, no quadro do impulso reformista e modernizador dos sucessivos governos batlistas."
 URG_aserradero_oriental:0 "Aserradero Oriental"
 urg_ancap_trait:0 "Empresa Estatal"
 URG_udelar:0 "UDELAR"
 URG_udelar_desc:0 "A Universidade da República (UDELAR) é a universidade pública do Uruguai e a mais importante do país."
 URG_PESMA:0 "PESMA"
 URG_CIAC:0 "CIAC"
 URG_SCRA:0 "SCRA"
 URG_Ford:0 "Ford Motors Uruguai"
 URG_debt_to_the_british:0 "Dívida aos britânicos"
 URG_debt_to_the_british_desc:0 "Devido às nossas várias expansões industriais nas últimas décadas, acumulamos uma dívida que precisa ser paga aos britânicos. Os britânicos esperam que paguemos essa dívida, e com o mundo aquecendo ao redor nós, só podemos esperar que nenhum sangue seja derramado com esse problema e possamos pagá-lo de volta pacificamente. \n§REssa ideia será removida quando toda a sua dívida com os britânicos for paga."
 URG_terra_loyalities:0 "Terra Legalistas"
 URG_violent_protests:0 "Protestos violentos"
 URG_violent_protests_desc:0 "Pessoas tomaram as ruas e começaram a se manifestar em todo o país, fazendo com que muitos inocentes perdessem suas vidas e o país paralisasse. Temos que parar esses protestos e rápido se quisermos continuar como um nação soberana”.
 URG_rebuilding_the_nation:0 "Reconstruindo a Nação"
 URG_economic_liberty:0 "Liberdade Econômica"
 URG_economic_liberty_2:0 "Liberdade Econômica"
 URG_improved_research:0 "Pesquisa Aprimorada"
 URG_expanded_consription:0 "Conscrição Expandida"
 URG_the_great_patriotic_war:0 "A Grande Guerra Patriótica"
 URG_the_great_patriotic_war_desc:0 "Esses argentinos acreditam seriamente que vão passar por cima de nós como nada? Bem, eles vão ter uma grande surpresa, porque vamos lutar, e vamos lutar até o fim. Não vamos nos render sob nenhuma circunstância, não importa quanto sangue seja derramado ou quanto tempo a guerra dure, vamos ter certeza de que mesmo se perdermos a longo prazo eles terão o pior momento de suas vidas."
 URG_maintaining_a_powerful_economy:0 "Manter uma economia poderosa"
 URG_building_up_an_airforce:0 "Construir uma Força Aérea"
 URG_building_up_an_airforce_desc:0 "Com uma força aérea poderosa, podemos dominar os céus, e dominar os céus nos dará vantagem em qualquer conflito futuro."
 URG_privatized_industry:0 "Indústria Privatizada"
 URG_privatized_industry_desc:0 "Com uma indústria privatizada, não podemos mais intervir diretamente na economia de forma tão eficiente quanto antes. Privatizar nossa indústria, no entanto, nos permite novas opções que a maioria das outras nações não tem à sua disposição."
