 PRU_rebelling_natives:0 "Rebelando Nativos"
 PRU_rebelling_natives_desc:0 "Nossa mudança do Peru para nosso antigo e glorioso império exigirá alguma ajuda do povo e do governo. Faremos com que nossa rebelião se espalhe por todos os nativos do país e percebamos o lixo que é o 'europeu'. Eles não têm o direito de estar em nossa terra e vão pagar, vão pagar por seu genocídio, sua colonização, sua violação do nosso povo.
