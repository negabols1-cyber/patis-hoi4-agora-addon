 CHL_prussian_military_traditions:0 "Tradições militares prussianas"
 CHL_prussian_military_traditions_desc:0 "A tradição militar prussiana é uma tradição militar que se originou na Prússia, e foi adotada por muitos países ao redor do mundo. A Colômbia adotou essa tradição militar para melhorar suas forças armadas e torná-las mais eficazes em combate."
