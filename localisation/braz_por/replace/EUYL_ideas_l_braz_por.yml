 BOL_went_against_the_civilians_name:0 "Foi contra os civis"
 BOL_went_against_the_civilians_name_desc:0 "Escolher ficar do lado das Forças Armadas causou raiva em nossos civis. Embora nosso governo seja agora uma junta civil-militar, o lado civil não está realmente do nosso lado."
