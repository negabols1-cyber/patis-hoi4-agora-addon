 CHL_political_instability_idea:0 "Instabilidade política"
 CHL_politic_instability_idea_desc:0 "O atual espectro político no Chile não é nada bonito. O governo, comunistas e nacistas estão em um constante cabo de guerra politicamente, e toda a nação está dividida de três maneiras. Essa divisão está prejudicando gravemente a nação, e se continuar, a nação do Chile pode muito bem estar com sérios problemas."
