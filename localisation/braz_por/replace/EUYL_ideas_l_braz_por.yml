 PRU_manuel_vicente:0 "Manuel Vicente Villarán"
 BRA_petrobras:0 "Petrobras"
 BRA_resouces_for_the_army:0 "Recursos para o Exército"
 EUYL_crippled_army:0 "Exército aleijado"
 EUYL_crippled_army_desc:0 "Nosso exército simplesmente não pode continuar com esta guerra. Está queimando nossos soldados e o povo é esmagadoramente contra esta guerra. Como se já não fosse ruim o suficiente, muitos de nossos soldados estão desertando da linha de frente. Precisamos para parar esta guerra antes que isso fique fora de controle."
 EUYL_bloody_resistance:0 "Sangrenta resistência antigovernamental"
 EUYL_major_resistance_tt:0 "\n§LAs pessoas neste estado desprezam sua ocupação sobre suas terras e estão dispostas a fazer qualquer coisa para garantir que seu governo não consiga reprimi-los!§!\n\n"
 EUYL_post_war_resistance_worsened_tt:0 "\n\n§Assim que a guerra terminar com [FROM.GetName], a resistência em seus estados será exasperada e será muito mais difícil contê-los!§!"
 EUYL_south_american_dreadnought_race_idea:0 "Corrida Armamentista Naval da América do Sul"
 EUYL_south_american_dreadnought_race:0 "Corrida Armamentista Naval da América do Sul"
 EUYL_dreadnought_race_tt:0 "\n§A Corrida Armamentista Naval da América do Sul foi uma corrida dreadnought que começou no final do século 19 e envolve os países mais ricos e poderosos da América do Sul: Argentina, Chile e Brasil. Os três países têm competido navalmente no passado 4 décadas agora, e se qualquer um dos três fizer um avanço naval, os outros 2 irão alcançá-lo rapidamente.§!\n\n"
 PRU_1936_elections_cancelled:0 "As §YEleições de 1936§! foram §RCanceladas§!"



 ARG_servicio_militar_obligatorio:0 "Serviço Militar Obrigatório"
 ARG_servicio_militar_obligatorio_desc:0 "§RO Serviço Militar Obrigatório vai parar se você tiver um governo democrático, se tiver Serviço por Obrigação ou uma lei de mobilização mais rígida, ou se você parar manualmente!§!"
 BOL_servicio_militar_obligatorio:0 "Serviço Militar Obrigatório"
 BOL_servicio_militar_obligatorio_desc:0 "§RO Serviço Militar Obrigatório vai parar se você tiver um governo democrático, tiver Serviço por Obrigação ou uma lei de mobilização mais rigorosa, ou se você parar manualmente!§!"
 PRU_civil_war:0 "A Guerra Civil Peruana"
 PRU_civil_war_desc:0 "Nossa nação foi envolvida em uma guerra civil. Sangue, caos, destruição, turbulência e desespero tomaram conta de nossa outrora grande nação, e agora estamos vendo como a guerra realmente é: horrível. Nossa causa é maior do que aqueles infelizes o suficiente para morrer, e precisamos trazer a nação de volta em suas patas traseiras o mais rápido possível. Soldados, marchem!"
 INC_our_war_of_independence:0 "Nossa Guerra da Independência"
 INC_our_war_of_independence_desc:0 "Estas criaturas vis que se atrevem a se chamar 'nativos' tomaram nossas terras e se estabeleceram como os verdadeiros colonos desta terra, mas isso vai mudar! Eles vão pagar por tudo que fizeram para nós!"


 # Confederação Peru-Boliviana
 PBC_divided_ideological_sentiments:0 "Sentimentos ideológicos divididos"
 PBC_divided_ideological_sentiments_desc:0 "O que não tínhamos em mente quando nos unificamos é o fato de que cada uma de nossas nações tinha diferentes partidos e ideologias governando-as, e isso causou uma enorme divisão em nossa ideologia dentro de nossa nova nação. Isso é muito ruim para nossa estabilidade política, e se deixarmos essa instabilidade política aparecer para nossos vizinhos, eles tirarão vantagem de nossa situação."
 PBC_all_must_accept:0 "§RTodos os países que estão em guerra com a Confederação Peru-Boliviana precisam aceitar para que os efeitos ocorram!§!"
 PRU_BOL_all_must_accept:0 "§RTodos os países que estão em guerra com o Peru e a Bolívia precisam aceitar para que os efeitos ocorram!§!"
 PBC_split_armies:0 "Exército Dividido"
 PBC_split_armies_desc:0 "A unificação repentina de nossos exércitos causou uma divisão maciça em nossas forças armadas. Nossos generais têm idéias conflitantes, nossos soldados não estão se dando bem uns com os outros, e todo o nosso ramo do exército foi desviado devido à conjunção das nossas nações. Precisamos resolver isso e rapidamente."
 PBC_divided_economy:0 "Economia Dividida"
 PBC_divided_economy_desc:0 "Nosso setor industrial também foi atingido por essa unificação. Empresas da Bolívia e do Peru estão em conflito entre si sobre quem deve ter mais poder sobre os diversos setores da nossa economia. Se isso não acabar e rápido, as consequências vai durar um bom tempo."
 PBC_war_of_independence:0 "Nossa Guerra da Independência"
 PBC_war_of_independence_desc:0 "Esses malditos bastardos nos querem mortos mais uma vez, eles não querem que nosso sindicato funcione. Eles são egoístas e com medo de que seremos bem sucedidos, e para sua surpresa desagradável, NÓS VAMOS! Não importa quantos de nossos homens vamos perder, temos que vencer esta guerra. Nossos predecessores tentaram uma vez e falharam, mas desta vez teremos sucesso!"
 
 # Colômbia
 COL_politicised_army:0 "Exército politizado"
 COL_politicised_army_desc:0 "Durante muito tempo da história da Colômbia, os governantes conservadores usaram os militares como seu exército privado. A liderança militar foi composta quase exclusivamente por generais conservadores, excluindo os liberais de qualquer participação. No entanto, agora que a hegemonia conservadora parece estar chegando ao fim, devemos nos perguntar se o exército continuará sendo uma força política ou se se tornará uma organização que defende todos os colombianos".
 COL_politicised_army_instant_desc:0 "\n§RManter o exército politizado tornará possível uma insurreição militar.§!"
 COL_political_violence:0 "Conflitos bipartidários"
 COL_political_violence_desc:0 "Os dois partidos tradicionais, o liberal e o conservador, lutam pelo poder há décadas, polarizando o povo e impedindo o desenvolvimento da nação. A Colômbia e seus governantes têm um longo processo reservado para quebrar esse antigo legado."
 COL_oposicion:0 "Oposição política interna"
 COL_oposicion_instant_desc:0 "\n§RManter a oposição política possibilitará uma insurreição conservadora ou liberal, dependendo de qual seja o partido no poder.§!"
 COL_revolucion_en_marcha:0 "Revolução em Marcha"
 COL_gaitan_desc:0 "Membro da dissidência liberal, Gaitán é a figura política que concentra os desejos do povo com sua excelente oratória. Sua imagem é extremamente popular, amada e elogiada por muitos, o que lhe rendeu o título de 'Tribuno da as pessoas'."
 gaitan_tt:0 "§YInfluência subversiva liberal§! velocidade de crescimento: §R+15%§!"
 COL_heridas:0 "Feridas de guerra"
 COL_heridas_desc:0 "As constantes guerras civis que a Colômbia enfrentou ao longo de sua história a marcaram como uma nação tendente ao tradicionalismo militar. A guerra é tão comum para os colombianos que o governo gastou grande parte de seus recursos em material bélico. O povo, pelo contrário, cresceram em meio à luta e lutarão até a morte pelos ideais que professam."
 COL_heridas_2:0 "Feridas de guerra"
 COL_heridas_2_desc:0 "As constantes guerras civis que a Colômbia enfrentou ao longo de sua história a marcaram como uma nação tendente ao tradicionalismo militar. A guerra é tão comum para os colombianos que o governo gastou grande parte de seus recursos em material bélico. O povo, pelo contrário, cresceram em meio à luta e lutarão até a morte pelos ideais que professam."
 COL_economia_1:0 "Economia estagnada"
 COL_economia_1_desc:0 "Desde os tempos da independência, a economia colombiana nunca se destacou por ser a mais dinâmica nem a mais lenta. O pouco interesse dos governantes em reviver a economia nacional, somado às constantes guerras civis, esvaziaram os cofres do Estado e os indicadores econômicos travaram por décadas."
