 #Bolívia
 BOL_if_peru_strengthened_relations_tt:0 "\nSe §YPeru§! tiver um foco que §Yfortalece o relacionamento com você§!, então eles não apenas estarão §Gmais propensos a aceitar§! à união proposta, mas você também ganhará §Gcores§! cada estado peruano de propriedade."
 BOL_losers_in_the_chaco_war_name:0 "Perdedor da Guerra do Chaco"
 BOL_losers_in_the_chaco_war_name_desc:0 "Há apenas um ano, entramos em guerra com os paraguaios pelo território do Chaco Boreal e perdemos a guerra junto com uma parte significativa do nosso território. Essa perda fez com que nosso exército entrasse em estado de quase anarquia , e nos tornamos o motivo de chacota da América do Sul. Precisamos nos redimir e jejuar antes que qualquer outro país se aproveite de nossa situação de fragilidade. \n\n§RRetomar e Controlar o Chaco Boreal nos livrará desse espírito nacional!§ !"
 BOL_unstable_republic_name:0 "República Instável"
 BOL_unstable_republic_name_desc:0 "Nosso país está em ruínas desde que perdemos a guerra do Chaco. O povo, o exército e até partes do governo estão contra nós. A ordem foi perdida em nossa nação e estamos cada vez mais perto de sermos considerado um estado falido. Precisamos resolver nossa situação política e rápido se quisermos continuar sendo uma nação soberana."
 BOL_great_depression_name:0 "A Grande Depressão"
 BOL_great_depression_name_desc:0 "A Bolívia tem uma economia muito dependente dos Estados Unidos, e por isso estamos sofrendo muito por causa da grande depressão. Nossas exportações estão desmoronando e nossa economia está falhando, e se continuarmos nesse ritmo, pode ter que dar calote como nação. Além disso, os recursos que foram usados ​​na recente guerra do Chaco também drenaram nossa economia."
 BOL_sea_access_loss:0 "Perda de acesso ao mar"
 BOL_sea_access_loss_desc:0 "Depois de perder a guerra do pacífico, perdemos nosso acesso ao mar. Desde aquele dia, nosso povo e nossa economia sofrem tremendamente como resultado. Se algum dia tivermos acesso ao mar, então nosso povo vai realmente erguer a bandeira boliviana com orgulho e nacionalismo! \n\n§RControlar qualquer estado costeiro vai acabar com esse espírito nacional!§!"
 BOL_gain_infrastructure:0 "Todo estado que tem §Yinfrastructure maior que 3§!, sua infraestrutura irá §Gimprove§! por §Y1§!. §Y2§!."
 BOL_every_neighbor:0 "Para §YTodos os países vizinhos§! que tem um §Yvalor de opinião§! de você §Ymaior que§! §G80§!, você receberá §G1§! §Yfábrica civis§!"
 BOL_tungsten_selling:0 "Para §YTodo estado§! que tem §Yover§! §G40§! §YTungstênio§!, você receberá §G1§! §Yfábrica civis§!"
 BOL_opened_wheat_markets:0 "Mercados de Trigo Abertos"
 BOL_step_off_free_trade_warning:0 "§RI Se sairmos do Livre Comércio, perderemos nossos mercados de trigo!§!"
 BOL_focused_on_what_were_good_at:0 "Foco na Indústria de Mineração"
 BOL_focused_on_what_were_good_at_desc:0 "A indústria de mineração já era uma das nossas indústrias mais fortes, tendo recebido uma boa quantidade de investimentos após a descoberta de grandes quantidades de recursos naturais, especialmente tungstênio, no país. Com este investimento extra e priorização da indústria, nós poderá atingir novos patamares e pode até se tornar um grande produtor de tungstênio do planeta."
 BOL_switched_to_an_agrarian_industry:0 "Mudou para uma sociedade agrária"
 BOL_switched_to_an_agrarian_industry_desc:0 "Por muito tempo, a indústria de mineração dominou nossa economia e indústria como um todo, mas isso está começando a mudar. uma mineração para outra agrícola. Os benefícios que trarão com a existência de uma sociedade agrária vão aparecer e vão aparecer em breve."
