 monroe_doctrine_idea:0 "A Doutrina Monroe"
 monroe_doctrine_idea_desc:0 "A Doutrina Monroe é a política dos Estados Unidos que adverte as nações européias a não declarar guerra ou colonizar nenhuma nação da América Central ou do Sul. Devido a isso, as nações da América do Sul e Central não devem aderir a alianças européias ou trabalhar com europeus, da mesma forma que os europeus não podem explorar nenhuma nação latino-americana."

