 EUYL_war_of_survival:0 "Guerra de Sobrevivência"
 EUYL_war_of_survival_desc:0 "A soberania de nossa nação está sendo colocada em risco enquanto falamos por uma potência estrangeira, e devemos fazer tudo ao nosso alcance para garantir que derrotaremos nosso inimigo e sairemos vitoriosos."
