 PAR_political_instability:0 "Instabilidade Política"
 PAR_political_instability_desc:0 "O espectro político no Paraguai está em frangalhos desde o fim da guerra do Chaco. Os militares têm ficado cada vez mais agitados com as reformas e políticas do atual presidente, e provavelmente continuarão a ficar assim se consideramos o atual presidente abaixo da média. Precisamos manter os militares sob controle para garantir que eles não se intrometam mais em nossa política. \n\n§RA Enquanto esse espírito nacional estiver ativo, haverá um equilíbrio de poder entre os militares e o atual presidente, e isso sempre empurrará o equilíbrio de poder para os militares paraguaios.§!"
