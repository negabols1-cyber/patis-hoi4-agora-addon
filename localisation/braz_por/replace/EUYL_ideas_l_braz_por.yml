 PRU_what_is_our_nation:0 "Qual é a nossa nação?"
 PRU_naval_democratic_loyalties:0 "Sentimentos ocidentais na Marinha"
 PRU_naval_democratic_loyalties_desc:0 "Nossa pequena marinha recebeu treinamento dos Estados Unidos, por causa disso, muitos na marinha têm sentimentos pró-ocidentais muito democráticos."
 PRU_naval_democratic_loyalties_2:0 "Fortes sentimentos ocidentais na Marinha"
 PRU_naval_democratic_loyalties_2_desc:0 "Nossa marinha em crescimento recebeu treinamento extensivo dos Estados Unidos, por causa disso, muitos na marinha têm sentimentos pró-ocidentais muito democráticos."
 PRU_naval_fascist_loyalties:0 "Sentimentos Fascistas na Marinha"
 PRU_naval_fascist_loyalties_desc:0 "Vendo o sucesso dos submarinos alemães e da força naval japonesa na Ásia. Optamos por obter nosso treinamento naval pelo Japão. Uma consequência disso é que muitos na marinha acreditam e simpatizam com as crenças fascistas."
 PRU_pathetic_navy:0 "Marinha dizimada"
 PRU_pathetic_navy_desc:0 "Nossa marinha foi dizimada na Guerra do Pacífico por aqueles belicistas no Chile. Embora nossa marinha tenha recuperado um pouco de sua força, as cicatrizes da guerra ainda permanecem fortes em toda a marinha. glorioso mais uma vez?"
 PRU_conflicting_army_navy_loyalties:0 "Sentimentos conflitantes entre o Exército e a Marinha"
 PRU_conflicting_army_navy_loyalties_desc:0 "Os sentimentos conflitantes entre nossa marinha e exército causaram um ódio amargo entre os dois...
 PRU_improper_air_force:0 "Força Aérea Desorganizada"
 PRU_improper_air_force_2:0 "Força Aérea Desorganizada"
 PRU_improper_air_force_desc:0 "Atualmente, nossa força aérea é uma coleção solta de divisões de aviação de nossa marinha e exército. Por causa disso, é muito mal organizada..."
 PRU_improper_air_force_2_desc:0 "Mesmo com o fortalecimento da força aérea, ainda é atormentada por muitos problemas devido à sua forma desorganizada."
 PRU_divided_navy:0 "Sentimentos Navais Divididos"
 PRU_divided_navy_desc:0 "Os crescentes sentimentos fascistas em nossa marinha fizeram com que muitos daqueles que ainda se apegam aos sentimentos ocidentais na marinha não gostassem fortemente daqueles que se opõem aos seus ideais. Eles acontecerão com o tempo..."
 PRU_divided_army:0 "Sentimentos Fascistas no Exército"
 PRU_divided_army_desc:0 "A ascensão do poder alemão fez com que muitos com crenças de extrema-direita em nosso exército se unissem em uma grande facção em nossas forças armadas. Esta facção está começando a entrar em conflito com as grandes facções pró-ocidentais em nosso exército e está começando a dar um pedágio no exército ... "
 PRU_pro_west_army:0 "Sentimentos ocidentais no exército"
 PRU_pro_west_army_desc:0 "As facções pró-ocidentais em nosso exército reinaram supremas com nossa nova cooperação militar com a França, fazendo com que essas facções de extrema direita se desvanecem!"
 PRU_pro_fascist_army:0 "Fortes Sentimentos Fascistas no Exército"
 PRU_pro_fascist_army_desc:0 "As facções de extrema direita em nosso exército reinaram supremas e esmagaram todas as facções pró-ocidentais em nosso exército. Nosso exército está unido mais uma vez..."
 PRU_strength_in_our_guns_idea:0 "Força em nossas armas"
 PRU_strength_in_our_guns_idea_desc:0 "Nossos homens são preciosos e poucos, então devemos ter certeza de que nossas perdas incluem perdas."
 PRU_strength_in_our_minds_idea:0 "Força em nossas mentes"
 PRU_strength_in_our_minds_idea_desc:0 "Ao superar nossos inimigos, podemos garantir uma vitória rápida."
 PRU_strengthened_currency:0 "Moeda Fortalecida"
 PRU_strengthened_currency_desc:0 "Com uma moeda fortalecida, podemos enfrentar qualquer desafio econômico que esteja em nosso caminho!"
 PRU_industrial_expand:0 "Expansionismo Industrial"
 PRU_rebelling_navy:0 "Marinha Rebelde"
 PRU_rebelling_navy_desc:0 "Os democratas em nossa Marinha estão se rebelando devido à cooperação com os fascistas. Vai nos custar um pouco acalmá-los, mas nós podemos e eventualmente o faremos."
 PRU_rebelling_army:0 "Exército Rebelde"
 PRU_rebelling_army_desc:0 "Os fascistas no Exército estão muito descontentes com nossa recente cooperação com o ocidente e estão se rebelando. Vai nos custar um pouco acalmá-los, mas podemos e vamos conseguir."
 PRU_social_democracy_idea:0 "Democracia Social"
