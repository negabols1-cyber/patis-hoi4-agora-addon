 ARG_economic_depression:0 "Depressão Econômica"
 ARG_economic_depression_desc:0 "A Grande Depressão afetou muito a Argentina. A economia está em frangalhos há 7 anos e se nada for feito, quem sabe o que acontecerá com o país."
 ARG_rampant_corruption:0 "Corrupção desenfreada"
 ARG_rampant_corruption_desc:0 "A Argentina, como a maioria de seus irmãos e irmãs latino-americanos, está cheia de corrupção e fraude."

 ARG_does_not_have_distrust_of_military_spirit_tt:0 "Não tem espírito nacional §Y$ARG_distrust_of_military$§!"
 
 ARG_distrust_of_military:0 "Cicatrizes do Golpe de Estado de 1930"
 ARG_distrust_of_military_desc:0 "Com o golpe de estado de 1930 ainda na memória recente de muitos argentinos, não é surpresa que a maioria da população seja contra os militares, vendo-o como algo negativo que faz mais mal do que bem. temos que reconquistar a confiança da população em geral."
 ARG_economic_depression_2:0 "Ligeira Recuperação Econômica"
 ARG_economic_depression_2_desc:0 "Graças a várias reformas e esforços na industrialização da nação, nossos problemas econômicos melhoraram um pouco. No entanto, ainda há trabalho a ser feito se quisermos nos livrar totalmente de nossas quedas econômicas."
 ARG_shadow_of_peron:0 "Sombra de Peron"
 ARG_shadow_of_peron_desc:0 "Sendo uma ideologia fresca e nova, nas mentes de muitos argentinos o peronismo é visto como uma graça salvadora para nossa queda econômica e não importa qual governo seja colocado no poder, o povo sempre se aproximará cada vez mais de Perón e seus ideologia."
 ARG_shadow_of_peron_2:0 "Sombra de Peron"
 ARG_shadow_of_peron_2_desc:0 "Sendo uma ideologia fresca e nova, na mente de muitos argentinos o peronismo é visto como uma graça salvadora para nossa queda econômica e não importa o governo que esteja no poder, o povo sempre se aproximará cada vez mais de Perón e de sua ideologia."
 ARG_shadow_of_peron_3:0 "Sombra de Peron"
 ARG_shadow_of_peron_3_desc:0 "Sendo uma ideologia fresca e nova, na mente de muitos argentinos o peronismo é visto como uma graça salvadora para nossa queda econômica e não importa qual governo seja colocado no poder, o povo sempre se aproximará cada vez mais de Perón e de seus ideologia."
 ARG_distrust_of_military_2:0 "Cicatrizes do Golpe de Estado de 1930"
 ARG_distrust_of_military__2_desc:0 "Mesmo com nossos recentes esforços para recuperar a confiança do povo, uma boa porcentagem da população ainda não está totalmente convencida do bem que um exército poderoso pode trazer. confiança e apoio de todos na Argentina."
 ARG_improved_mining_techniques:0 "Técnicas de Mineração Aprimoradas"
 ARG_improved_mining_techniques_desc:0 "Com nossa nova tecnologia, agora podemos extrair nossos recursos com mais eficiência."
 ARG_industrial_expansionism:0 "Expansionismo Industrial"
 ARG_industrial_expansionism_desc:0 "Já é hora de começarmos a lidar com nossa economia e trazê-la de volta ao estado que era antes."
 ARG_reduce_public_expenses:0 "Gastos Públicos Reduzidos"
 ARG_reduce_public_expenses_desc:0 "Reduzir os gastos públicos pode nos ajudar no curto prazo, mas não resolverá nossos problemas."
 ARG_patriotic_loan:0 "Estabelecido o Empréstimo Patriótico"
 ARG_patriotic_loan_desc:0 "Agora que estabelecemos o empréstimo Patriótico, isso fortalecerá nossos cofres financeiros, melhorando diretamente nossa economia à custa de algumas despesas."
 ARG_distrust_of_military_3:0 "Cicatrizes do Golpe de Estado de 1930"
 ARG_distrust_of_military_3_desc:0 "Com o golpe de estado de 1930 ainda na memória recente de muitos argentinos, não é surpresa que a maioria da população seja contra os militares, vendo-o como algo negativo que faz mais mal do que bem. temos que reconquistar a confiança da população em geral."
 ARG_air_dominance:0 "Dominância Aérea"
 ARG_air_dominance_desc:0 "Com nosso foco no ar, podemos dominar qualquer oponente que ouse nos testar."
 ARG_artillery_production:0 "Produção de Artilharia"
 ARG_artillery_production_desc:0 "Agora produzimos artilharia com mais eficiência."
