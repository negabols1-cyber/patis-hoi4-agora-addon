 BOL_taking_antofagasta:0 "Tomando Antofagasta"
 BOL_taking_antofagasta_desc:0 "Está na hora de fazermos os preparativos para tomar Antofagasta. Se tudo correr bem, talvez até possamos tomá-lo sem qualquer resistência. Costumávamos possuir Antofagasta, e na realidade devemos possuí-lo. Não permitiremos que o chilenos para bloquear nosso acesso ao mar por mais tempo!"
