 PRU_preparing_for_the_worst:0 "Preparando-se para o pior"
 PRU_preparing_for_the_worst_desc:0 "À medida que as nações do mundo retornam ao seu passatempo favorito de matar uns aos outros, devemos garantir que não sejamos vítimas desses conflitos."
 PRU_pokimane_fart:0 "Socorros para a Economia"
 PRU_continuing_the_gold_standard:0 "Usando o Gold Standard"
 PRU_continuing_the_gold_standard_desc:0 "Quando Edwin Kemmerer nos visitou para ajudar com nossa economia em 1931, ele nos aconselhou a mudar nossa moeda para o padrão-ouro. Seguimos seu conselho desde então, mas talvez devêssemos mudar isso?"
 PRU_continuing_the_gold_standard_2:0 "Continuando o Padrão Ouro"
 PRU_continuing_the_gold_standard_2_desc:0 "Quando Edwin Kemmerer nos visitou para ajudar com nossa economia em 1931, ele nos aconselhou a mudar nossa moeda para o padrão ouro. Sabemos que desligar esse padrão e transformá-lo em uma moeda fiduciária resultaria em catástrofe e assim decidiu que deveríamos continuar usando o padrão-ouro."
 PRU_fiat_currency_instability:0 "Moeda instável"
 PRU_fiat_currency_instability_desc:0 "Nossa moeda atraiu os olhos preocupados de muitos investidores, credores e nações que não têm certeza se negociar conosco é uma boa ideia. Isso está afetando muito nossa economia e devemos encontrar uma maneira de corrigi-lo rapidamente. .."
 PRU_bedrock_of_sa:0 "Alicerce Econômico da América do Sul"
 PRU_bedrock_of_sa_desc:0 "Conseguimos! Nossa moeda agora se estabilizou e fizemos isso sem orientação americana! Essa estabilização fez com que muitos investidores estrangeiros e outros retomassem seus negócios aqui fazendo com que nossa economia se recuperasse. Arriba, arriba, arriba el Perú!"
