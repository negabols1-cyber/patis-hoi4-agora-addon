 URG_blancos_in_opposition_category_desc:0 "Os Blancos foram contra nossas recentes reformas econômicas. Se não lidarmos com eles agora, isso pode se transformar em um problema sério."
 URG_legacy_of_batlle_idea:0 "Legado de Batlle"
 URG_legacy_of_batlle_idea_desc:0 "José Pablo Torcuato Batlle y Ordóñez foi uma figura muito proeminente na política uruguaia. Seu legado continua muito forte no Uruguai moderno."
