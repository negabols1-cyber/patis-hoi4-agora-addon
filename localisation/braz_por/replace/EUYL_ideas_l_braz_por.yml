 ARG_viva_la_confederacion_5_desc:0 "Somos a graça salvadora da Argentina, somos o que fará o país avançar e transformá-lo em uma potência regional e talvez até uma superpotência, somos ótimos. Viva La Confederacion!"
 ARG_send_volunteers:0 "Enviar Voluntários"
 ARG_send_volunteers_desc:0 "Precisamos enviar voluntários para que nossos planos funcionem."
 URG_influenced_politics:0 "A Argentina está influenciando nossa política"
 URG_influenced_politics_desc:0 "A Confederação Argentina está enviando diplomatas fascistas para influenciar nossa política. O que quer que estejam fazendo, não adianta."
 ARG_the_second_cisplatine_war:0 "Dê ao Brasil a luta que eles querem"
 ARG_the_second_cisplatine_war_desc:0 "O Brasil nos declarou guerra sem motivo real, é hora de pagar com sangue. É hora de darmos a eles a luta que eles tanto queriam."
 ARG_the_second_cisplatine_war_2:0 "Dê ao Brasil a luta que eles querem"
 ARG_the_second_cisplatine_war_2_desc:0 "O Brasil nos declarou guerra sem motivo real, é hora de pagar com sangue. É hora de darmos a eles a luta que eles tanto queriam."
 ARG_naval_supremacy_over_brazil:0 "Supremacia Naval sobre o Brasil"
 ARG_naval_supremacy_over_brazil_desc:0 "Devemos conquistar a supremacia sobre o Brasil se sonhamos em vencê-los na guerra."
 ARG_expansionist_policy:0 "Política expansionista"
 ARG_joint_germanargentine_military_training:0 "Treinamento Militar Conjunto"
 ARG_joint_germanargentine_military_training_desc:0 "Ambos estamos aprendendo novas técnicas com os militares um do outro, e com isso estamos melhorando mutuamente nossos exércitos."
 ARG_increased_naval_output:0 "Aumento da saída naval"
 ARG_increased_naval_output_desc:0 "Com este incremento em nossa produção naval, pelo menos seremos capazes de superar qualquer potência naval latino-americana."
 ARG_increased_naval_output_2:0 "Aumento da saída naval"
 ARG_increased_naval_output_2_desc:0 "Com este incremento em nossa produção naval, pelo menos seremos capazes de superar qualquer potência naval latino-americana."
 ARG_increased_naval_output_3:0 "Aumento da saída naval"
 ARG_increased_naval_output_3_desc:0 "Com este incremento em nossa produção naval, pelo menos seremos capazes de superar qualquer potência naval latino-americana."
 ARG_increased_submarine_output:0 "Aumento da saída do submarino"
 ARG_increased_submarine_output_desc:0 "Com estratégias mais eficientes, podemos produzir mais submarinos e contestar a subfrota chilena."
 ARG_increased_destroyer_output:0 "Aumento da saída do destruidor"
 ARG_increased_destroyer_output_desc:0 "Com estratégias mais eficientes, podemos produzir mais contratorpedeiros e contestar a frota brasileira de contratorpedeiros."
 ARG_modern_dockyard_technology:0 "Tecnologia de Estaleiro Aumentada"
 ARG_modern_dockyard_technology_desc:0 "Nova e melhorada tecnologia de estaleiro nos permite produzir navios a um ritmo mais rápido."
 ARG_modern_dockyard_technology_2:0 "Tecnologia de Estaleiro Aumentada"
 ARG_modern_dockyard_technology_2_desc:0 "Nova e melhorada tecnologia de estaleiro nos permite produzir navios a um ritmo mais rápido."
 ARG_improved_heavy_ships:0 "Navios Pesados ​​Aprimorados"
 ARG_improved_heavy_ships_desc:0 "Com tecnologia nova e avançada, podemos dar um soco maior nos navios pesados ​​e garantir que nenhum outro navio possa enfrentar o nosso."
 ARG_build_coastal_ships:0 "Construir Navios Costeiros"
 ARG_build_coastal_ships_desc:0 "Com melhor tecnologia e eficiência aprimorada, podemos construir rapidamente uma defesa costeira em caso de guerra."
 ARG_modern_armada_argentina:0 "Modern Armada Argentina"
 ARG_modern_armada_argentina_desc:0 "Com todos os nossos desenvolvimentos recentes, gastos navais, expansão do estaleiro e navios modernizados, revolucionamos a Armada Argentina, transformando-a em uma potência naval séria nas Américas e talvez até no mundo inteiro."
 ARG_quality:0 "Qualidade"
 ARG_quality_desc:0 "Com tropas de qualidade podemos derrotar qualquer inimigo mesmo que não tenhamos a quantidade de homens que eles têm."
 ARG_quality_2:0 "Qualidade"
 ARG_quality_2_desc:0 "Com tropas de qualidade podemos derrotar qualquer inimigo mesmo que não tenhamos a quantidade de homens que eles têm."
 ARG_quantity:0 "Quantidade"
 ARG_quantity_desc:0 "Com uma grande quantidade de tropas, não importa se o inimigo tem a liderança tecnológica."
 ARG_quantity_2:0 "Quantidade"
 ARG_quantity_2_desc:0 "Com uma grande quantidade de tropas, não importa se o inimigo tem a liderança tecnológica."
 ARG_produce_motorized:0 "Produzir Motorizado"
 ARG_produce_motorized_desc:0 "Agora podemos produzir mais motorizados a um custo mais barato."
 ARG_make_our_own_tanks:0 "Faça nossos próprios tanques"
 ARG_make_our_own_tanks_desc:0 "Fazer nossos próprios tanques mostra ao mundo que não precisamos depender de suas indústrias ou tecnologias para podermos avançar e ter um exército poderoso."
 ARG_cheaper_artillery:0 "Artilharia mais barata"
 ARG_cheaper_artillery_desc:0 "Com artilharia mais barata seremos capazes de bombear mais artilharia e, portanto, ter mais poder de fogo que o inimigo."
 ARG_cheaper_equipment:0 "Equipamento mais barato"
 ARG_cheaper_equipment_desc:0 "Com equipamentos mais baratos, podemos armar mais homens mais rapidamente e, portanto, tornar nosso exército maior mais competente."
 ARG_expand_air_force:0 "Expandir a Força Aérea"
 ARG_expand_air_force_desc:0 "Expandir nossa força aérea é fundamental para dominar o inimigo nos céus e nos permitir ter uma vantagem na guerra em terra."
 ARG_concordancia_elected:0 "Concordância Reeleita"
 ARG_concordancia_elected_desc:0 "Com o Concordancia sendo reeleito recentemente, podemos continuar controlando o país como antes."
 ARG_union_civica_radical_elected:0 "União Civica Radical Eleito"
 ARG_union_civica_radical_elected_desc:0 "Com a União Cívica Radical sendo eleita, podemos começar a voltar aos ideais mais democráticos e trazer à tona este país."
 ARG_los_azules:0 "Los Azuis"
 ARG_los_azules_desc:0 "Los Azules é a facção dentro da UCR que tende a manter ideais mais conservadores e mais do lado da classe média alta e dos ricos."
 ARG_los_azules_2:0 "Los Azuis"
 ARG_los_azules_2_desc:0 "Los Azules é a facção dentro da UCR que tende a manter os ideais mais conservadores e os lados mais com a classe média alta e os ricos."
 ARG_los_azules_3:0 "Los Azuis"
 ARG_los_azules_3_desc:0 "Los Azules é a facção dentro da UCR que tende a manter os ideais mais conservadores e os lados mais com a classe média alta e os ricos."
 ARG_los_grises:0 "Los Grises"
 ARG_los_grises_desc:0 "Los Grises é a facção dentro da UCR que tende a manter mais ideais socialistas e mais do lado dos pobres."
 ARG_los_grises_2:0 "Los Grises"
 ARG_los_grises_2_desc:0 "Los Grises é a facção dentro da UCR que tende a manter mais ideais socialistas e mais do lado dos pobres."
 ARG_los_grises_3:0 "Los Grises"
 ARG_los_grises_3_desc:0 "Los Grises é a facção dentro da UCR que tende a manter mais ideais socialistas e mais do lado dos pobres."
 ARG_expand_the_YPF:0 "Expandir o YPF"
 ARG_expand_the_YPF_desc:0 "Expandindo a empresa YPF poderemos coletar mais recursos e, portanto, exportar mais para o exterior."
 ARG_support_the_YPF_workers_idea:0 "Apoiar os trabalhadores YPF"
 ARG_support_the_YPF_workers_idea_desc:0 "A empresa pode ser a que emprega pessoas, mas são os trabalhadores que trazem isso."
 ARG_reject_personalismo:0 "Rejeitar Personalismo"
 ARG_reject_personalismo_desc:0 "Personalismo é a idéia latino-americana de subjugar os interesses de partidos políticos, ideologias e governo constitucional à lealdade a um líder. Não podemos permitir que isso ocorra mais."
 ARG_banco_central_argentino:0 "Reformado Banco Central Argentino"
 ARG_banco_central_argentino_desc:0 "O Banco Central Argentino é uma maneira perfeita de controlar nossa moeda, e ter um banco central nos permitirá nacionalizar o comércio exterior."
 ARG_expanded_worker_rights:0 "Direitos do trabalhador expandidos"
 ARG_fadea:0 "Fábrica Argentina de Aviões"
 ARG_fadea_desc:0 "Fundada em 1927, a FAdeA (abreviação de Fábrica Argentina de Aviones) era uma empresa dedicada à produção de aeronaves de nível militar. Sua principal planta de produção situava-se na província de Córdoba."
 ARG_expanded_worker_rights_Desc:0 "A expansão dos direitos dos trabalhadores nos trouxe o apoio da população, e o trabalhador médio agora trabalha com mais eficiência e em um ritmo melhor do que antes."
 ARG_barn_of_the_world:0 "O Celeiro do Mundo"
 ARG_barn_of_the_world_desc:0 "Graças às nossas imensas terras agrícolas, recursos naturais abundantes e economia poderosa, fomos e somos conhecidos como o "Celeiro do Mundo", exportando alimentos e mercadorias para todos os países do planeta."
 ARG_invest_in_infrastructure:0 "Investir em nossa infraestrutura"
 ARG_invest_in_infrastructure_desc:0 "Investir em nossa infraestrutura nos permitirá desenvolver nosso país mais rapidamente e permitir o transporte de mercadorias para e em todo o país."
 ARG_our_liberal_ways:0 "Nossos Caminhos Liberais"
 ARG_our_liberal_ways_desc:0 "Fomos um dos primeiros países do planeta a adotar uma mentalidade liberal, que gira em torno de um mercado livre, pensamento livre e melhores direitos trabalhistas. Essas idéias nos permitiram em um ponto ser o país mais rico per capita no planeta. É hora de voltarmos a esses caminhos e nos tornarmos o poder que já fomos."
 ARG_our_liberal_ways_2:0 "Nossos caminhos liberais"
 ARG_our_liberal_ways_2_desc:0 "Fomos um dos primeiros países do planeta a adotar uma mentalidade liberal, que gira em torno de um mercado livre, pensamento livre e melhores direitos trabalhistas. Essas idéias nos permitiram em um ponto ser o país mais rico per capita no planeta. É hora de voltarmos a esses caminhos e nos tornarmos o poder que já fomos.
 ARG_spanish_civil_war_tactics:0 "Táticas da Guerra Civil Espanhola"
 ARG_spanish_civil_war_tactics_desc:0 "Graças a estar na primeira fila da guerra civil, podemos tomar notas das táticas que estão sendo implantadas e, portanto, melhorar nossas próprias tropas."
 ARG_spanish_argentine_economic_allience:0 "Cooperação Econômica Espanha-Argentina"
 ARG_spanish_argentine_economic_allience_desc:0 "Ambas as nossas economias estão crescendo agora como resultado de nossa aliança econômica. Só coisas boas vieram deste pacto e muitas outras ainda estão por vir."
 ARG_imrpoved_consumer_sector:0 "Melhor setor de consumo"
 ARG_imrpoved_consumer_sector_desc:0 "Nossas novas políticas e reformas se mostraram bem sucedidas no setor de consumo de nossa indústria, permitindo que a população ainda fique satisfeita mesmo com um número menor de fábricas dedicadas a bens de consumo."
 ARG_modernize_construction_companies:0 "Empresas de construção modernizadas"
 ARG_modernize_construction_companies_desc:0 "Modernizar nossas empresas de construção nos permitiu obter uma vantagem quando se trata de construir novas fábricas e expandir nossa indústria."
 ARG_attracted_foreign_investment:0 "Investimento Estrangeiro Atraído"
 ARG_attracted_foreign_investment_desc:0 "Graças aos nossos esforços recentes em atrair investidores estrangeiros, nosso mercado comercial se expandiu dramaticamente, assim como nossa economia."
 ARG_open_our_borders:0 "Abriu nossas fronteiras"
 ARG_open_our_borders_desc:0 "Graças à abertura de nossas fronteiras, novas pessoas de todo o mundo estão chegando à Argentina para chamar sua nova casa."
 ARG_the_liberal_war_machine:0 "A Máquina de Guerra Liberal"
 ARG_the_liberal_war_machine_desc:0 "Com o mundo queimando ao nosso redor, é hora de construir nossa indústria militar para competir no cenário global."
 ARG_the_liberal_war_machine_2:0 "A Máquina de Guerra Liberal"
 ARG_the_liberal_war_machine_2_desc:0 "Com o mundo queimando ao nosso redor, é hora de construir nossa indústria militar para competir no cenário global."
 ARG_reformed_parliament:0 "Parlamento Reformado"
 ARG_reformed_parliament_desc:0 "Uma série de reformas depois e o parlamento agora está muito melhor organizado do que antes."
 ARG_workers_in_parliament:0 "Trabalhadores no Parlamento"
 ARG_workers_in_parliament_desc:0 "Ter trabalhadores trabalhadores de classe média no parlamento garantirá que a classe trabalhadora obtenha os melhores benefícios e reformas. Afinal, um trabalhador entende outro trabalhador."
 ARG_federalized_society:0 "Sociedade Federalizada"
 ARG_federalized_society_desc:0 "Federalizar a economia trouxe muitos benefícios para a nossa economia, sem ter que negociar nenhum de nossos valiosos recursos."
 ARG_recently_subsidized_industry:0 "Indústrias-chave recentemente subsidiadas"
 ARG_nationalized_the_industry:0 "Indústrias-chave nacionalizadas"
 ARG_funded_public_works:0 "Obras Públicas Financiadas"
 ARG_funded_public_works_2:0 "Obras Públicas Financiadas"
 ARG_funded_public_works_3:0 "Obras Públicas Financiadas"
 ARG_hospital_militar_central:0 "Hospital Militar Central"
 ARG_hospital_militar_central_desc:0 "O hospital provou ser muito bem sucedido até agora, e os militares estão muito presentes neste novo edifício."
 ARG_accepted_debt_repayment:0 "Reembolsos de dívidas"
 ARG_accepted_debt_repayment_desc:0 "A ação que nos foi movida parece bastante sombria. Esperávamos que a Assembleia Legislativa nos protegesse e percebesse a inocência do nosso governo, no entanto, isso estava longe de ser o caso. Agora temos que pagar a dívida, que nos atrasará temporariamente."
 ARG_accepted_debt_repayments_6:0 "Dívida totalmente quitada" 
 ARG_accepted_debt_repayments_6_desc:0 "O processo que foi movido contra nós foi totalmente quitado. Não precisamos mais nos preocupar com isso."
 ARG_shadow_of_peron_ramon:0 "Sombra de Peron"
 ARG_shadow_of_peron_ramon_desc:0 "Sendo uma ideologia fresca e nova, nas mentes de muitos argentinos o peronismo é visto como uma graça salvadora para nossa queda econômica e não importa qual governo seja colocado no poder, o povo sempre se aproximará cada vez mais de Perón e seus ideologia."
 ARG_disbanded_the_army:0 "Dissolveu o Exército"
 ARG_disbanded_the_army_2:0 "Dissolveu o Exército"
 ARG_gun_output:0 "Aumento da saída do equipamento"
 ARG_viva_la_patria:0 "Viva La Patria"
 ARG_viva_la_patria_desc:0 "Absolutamente nada nem ninguém ousará desafiar nossa própria soberania, e aqueles que o fizerem levarão a surra de uma vida!"
 ARG_german_generals_advice:0 "Conselheiros alemães convidados"
 ARG_strived_for_autarky:0 "Autarquia"
 ARG_smuggled_german_refugees:0 "Refugiados Alemães Contrabandeados"
 ARG_purged_the_peronists:0 "Expurgou os Peronistas"
 ARG_purged_the_peronists_desc:0 "Estamos lidando com a escória de forma muito eficiente, todas as ovelhas que estavam seguindo as crenças distorcidas de Perón estão sendo colocadas em seu lugar."
 ARG_banned_personalismo:0 "Personalismo banido"
 ARG_nationalized_the_industry_2:0 "Indústrias-chave nacionalizadas"
 ARG_workers_in_the_armed_forces:0 "Trabalhadores nas Forças Armadas"
 ARG_soviet_economic_aid_sent:0 "Ajuda Econômica Soviética"
 ARG_soviet_economic_aid_sent_2:0 "Ajuda Econômica Soviética"
 ARG_carlos_alberto_pueyrredon:0 "Carlos Alberto Pueyyredon"
 EUYL_ARG_ramon_castillo:0 "Ramon Castillo"
