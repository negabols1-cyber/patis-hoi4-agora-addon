 trait_BRA_communist_loyalty:0 "Simpatizante comunista"
 trait_BRA_communist_loyalty_desc:0 "Este general simpatiza com o movimento comunista dentro do país e provavelmente irá apoiá-lo no caso de uma guerra civil."
 trait_BRA_democratic_loyalty:0 "Democrata Lealista"
 trait_BRA_democratic_loyalty_desc:0 "Este general é leal ao movimento democrata no país e apoiará a democracia no caso de uma guerra civil, ou se um governo fascista for implementado."
 trait_BRA_imperial_loyalty:0 "Lealista Imperial"
 trait_BRA_imperial_loyalty_desc:0 "Este general é leal à família real brasileira e irá apoiá-la em caso de revolta ou guerra civil."
 trait_BRA_integralist_loyalty:0 "Simpatizante Integralista"
 trait_BRA_integralist_loyalty_desc:0 "Este general simpatiza com o movimento integralista no país e se juntará a eles em caso de guerra civil."
 trait_BRA_vargas_loyalty:0 "Leal a Vargas"
