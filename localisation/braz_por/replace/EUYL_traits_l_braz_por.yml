 POLITICS_SUN_GOD_DESC:0 "Inti é o antigo deus do sol inca. Ele é reverenciado como o patrono nacional do estado inca. Embora a maioria considere Inti o deus do sol, ele é mais apropriadamente visto como um aglomerado de aspectos solares, já que o inca dividiu sua identidade De acordo com os estágios do sol Adorado como divindade padroeira do Império Inca, Pachacuti é frequentemente ligado à origem e expansão do Culto ao Sol Inca A história mais comum diz que ele é filho de Viracocha, o deus da civilização.\n\nA palavra inti é, de acordo com o linguista Rodolfo Cerrón-Palomino, não de origem quíchua, mas um empréstimo da língua Puquina. O empréstimo da língua Puquina explica por que línguas geneticamente não relacionadas, como Quechua, Aymara e Mapuche, têm palavras semelhantes para o Sol. são não apenas linguística, mas também simbolicamente, como na cosmologia Mapuche e Andina Central, o Sol (Inti/Antu) e a Lua (Qilla/Cuyen) são esposos".
